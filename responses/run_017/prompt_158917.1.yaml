  First, I need to recall the key points of patent law they mentioned: novelty isn't sufficient; non-obviousness requires that the invention wouldn't be obvious to a person of ordinary skill in the art (POSITA). The KSR case emphasizes that POSITA has ordinary creativity and lists paradigms like predictable combinations or substitutions as obvious. Factors like commercial success or long-felt need indicate non-obviousness.

  The user is confused because recombination is both granted patents and cited as obvious. So, what's the implicit theory here? They want to know if there's a metric, a psychological model, or if it's just an economic incentive tool. Also, they're interested in whether the doctrine addresses Hofstadter's idea of re-parameterization (changing the parameters themselves) or just variations within a fixed space.

  I should break down the reconstruction into parts: the implicit theory, presupposed creativity theories, and the re-parameterization aspect. For each, I need to assess confidence, note extrapolations, and identify what could change my mind.

  Starting with the implicit theory. Patent law seems to use a functional-adaptive model. The POSITA is a construct with baseline creativity, capable of routine variations but not leaps. The key is predictability: if combining elements leads to expected results, it's obvious. Unpredictability suggests creativity. Factors like commercial success act as proxies for non-obviousness by indicating that the solution wasn't straightforward. This leans more towards a proxy for economic incentive, but the KSR mention of ordinary creativity suggests some psychological grounding. However, it's not a detailed cognitive model. The space of variations is defined by the prior art, and the distance is judged by outcomes rather than a formal metric.

  Confidence here is medium-high because the legal standards focus on predictability and outcomes. But extrapolating the psychological model part—since the doctrine doesn't delve into cognitive processes. If legal scholars explicitly deny any creativity theory and frame it purely economically, that could change my view.

  Next, which creativity theories fit. The doctrine aligns with combinatorial theories (like Hofstadter) but requires more than novelty—it needs unpredictability. It rules out statistical-novelty by requiring non-obviousness beyond mere newness. Romantic theories of ineffable leaps are irrelevant since POSITA is ordinary. Systems theories (like Csikszentmihalyi) fit with the focus on field standards. But the doctrine doesn't commit to any specific theory; it's pragmatic.

  Confidence is medium here. Legal texts might not explicitly engage with creativity theories. If court opinions reference romantic ideas, that might adjust the view, but unlikely.

  Regarding re-parameterization: the doctrine's vocabulary (combination, substitution) seems stuck in fixed parameter spaces. Teaching away or unexpected results might hint at parameter changes, but it's not explicit. Factors like long-felt need could signal a deeper shift, but courts might not recognize it. Adding a test for "conceptual reorientation" or expert testimony on paradigm shifts might help, but it's speculative.

  Confidence is low here. Real cases where re-parameterization was acknowledged would strengthen this, but currently, it's a gap.

  The user's deeper needs: They want to apply Hofstadter's model to a real-world system that adjudicates creativity. They might be seeking validation of the model's relevance or uncovering its limitations. They also need to position their work within theories of creativity and legal-economic frameworks. Ensuring their dissertation bridges theory and practice is likely crucial. They might also be looking for how patent law's approach can inform or challenge cognitive theories of creativity, especially in understanding incremental vs. transformative innovation.
answer: |-
  Here's a reconstruction of the implicit theory of creativity within the US patent doctrine of non-obviousness (35 U.S.C. § 103), based on your description, key precedent (especially *KSR v. Teleflex*), and the underlying logic. I'll address your specific questions systematically.

  **1. Reconstructing the Implicit Theory: Separating Novel Variation from Creative One**

  *   **Core Concept: Predictability vs. Unpredictability within a Constrained Problem-Space:** The doctrine hinges on whether the variation's result or method was **predictable** to the Person Having Ordinary Skill In The Art (PHOSITA) working within the established state of the art. Novelty is necessary but insufficient. The "creative leap" is defined as producing an outcome or employing a combination that was *not* readily foreseeable using the standard tools, knowledge, and problem-solving approaches available at the time.
  *   **Mechanism: Functional-Adaptive Model of the PHOSITA:**
      *   The PHOSITA is **not** an automaton *nor* a genius. They possess "ordinary creativity" – meaning they are adept at known problem-solving techniques within their field: routine combination, substitution, optimization, adaptation, and following established design trends or market pressures (*KSR*).
      *   The "space of variations" is **defined by the prior art**. It includes all known elements, their properties, known methods of combination, and recognized problems/solutions within the field and reasonably pertinent arts.
      *   **Movement within the Space (Obvious):** If the variation is a direct application of a known technique to a known problem, a simple substitution with predictable consequences, or choosing from a finite set of predictable options identified by the prior art, it's obvious. The PHOSITA can easily "twiddle these knobs" without inventive spark (*KSR*'s "predictable results," "finite number of identified, predictable solutions").
      *   **Movement Beyond Predictability (Non-Obvious/Creative):** The invention is non-obvious if its success, specific form, or outcome was *unpredictable* based on the prior art. This unpredictability manifests as:
          *   **Unexpected Results/Properties:** The combination yields a surprising new function, advantage, or property not suggested by the individual parts or prior combinations.
          *   **Overcoming "Teaching Away":** The prior art actively discouraged the path taken by the inventor, making the successful variation counter-intuitive.
          *   **Solving Long-Felt Need/Failure of Others:** Demonstrates the solution wasn't reachable via routine knob-twiddling by the PHOSITA community over time.
          *   **Non-Routine Combination:** Combining elements from disparate fields *in a way not suggested* by the prior art to solve a problem, especially if the fields weren't considered pertinent.
  *   **What it is NOT:**
      *   **A Formal Metric:** No mathematical distance measure exists. The assessment is qualitative and retrospective, based on evidence of predictability/unpredictability *at the time of invention*.
      *   **A Deep Psychological Model:** While invoking "ordinary creativity," the doctrine focuses on *outcomes* (predictability, success) and *external evidence* (prior art, commercial reception) rather than the inventor's internal cognitive process. The PHOSITA is a legal fiction, a benchmark, not a detailed cognitive agent.
      *   **Purely Economic Proxy (Alone):** While the incentive function is fundamental to patent law, the *tests themselves* (unexpected results, teaching away, long-felt need) are framed in terms of technical creativity and predictability relative to the art, not solely market impact. Commercial success is *evidence* of non-obviousness, not the *definition*.

  *   **Confidence:** High for the core predictability/unpredictability framework and PHOSITA construct. Medium-High for the functional-adaptive model of "ordinary creativity."
  *   **Extrapolation:** My description of the "space of variations" being defined by prior art is an interpretation, though heavily implied by the requirement to consider only pertinent prior art and the focus on what was known/suggested. The emphasis on the PHOSITA as a benchmark rather than a deep cognitive model is standard legal understanding.
  *   **Mind-Changer (No Theory at All):** Finding definitive statements in legislative history, SCOTUS opinions, or leading treatises explicitly stating that "non-obviousness" is *solely* an economic incentive test with *no* intended connection to a concept of inventive/creative step, and that all secondary considerations are *only* proxies for market failure, not evidence of inventive merit. (While economic incentive is the *ultimate purpose*, the *legal test* employs creativity-based concepts).

  **2. Relationship to Theories of Creativity**

  *   **Strictly Presupposes:**
      *   **Combinatorial Theories (e.g., Hofstadter's Knob-Twiddling - Basic Level):** It explicitly assumes creativity often involves recombining, substituting, or adapting existing elements. The entire doctrine is built around evaluating *how* this combination happened relative to the state of the art.
      *   **Ordinary Creativity Baseline:** It presupposes a baseline level of creative problem-solving ability exists in skilled practitioners (*KSR*'s "person of ordinary creativity").
  *   **Fits Well With:**
      *   **Hofstadter's Knob-Twiddling (Advanced):** Specifically, the idea that *moving within* a well-understood conceptual space is routine, but discovery happens at the edges or through constraint modification (though the doctrine struggles to recognize the latter, see below).
      *   **Systems Models (e.g., Csikszentmihalyi):** The focus on the "field" (PHOSITA community, pertinent prior art) judging the variation's novelty *and* appropriateness (utility) fits well. Non-obviousness is assessed relative to the domain's knowledge.
      *   **Problem-Solving Frameworks:** Creativity as finding novel solutions to recognized problems is central. Long-felt need is direct evidence of this.
  *   **Rules Out:**
      *   **Statistical-Novelty View:** Novelty is explicitly insufficient (*Great Atlantic & Pacific Tea Co. v. Supermarket Equipment Corp.*, 1950). Mere difference isn't creativity.
      *   **Romantic/Ineffable-Leap View:** The doctrine is fundamentally hostile to the idea that creativity is mystical, unpredictable genius accessible only to a few. The PHOSITA standard assumes creativity is a *distributed, incremental, and assessable* process relative to a field. Evidence like unexpected results must be demonstrable and tied to the art. "Eureka moments" need to be validated against the prior art and PHOSITA capabilities.
  *   **Confidence:** High for combinatorial basis and rejection of statistical-novelty/romantic views. Medium-High for fit with systems models. Medium for the nuanced fit with Hofstadter (depends on recognizing the constraint of predictability).
  *   **Extrapolation:** The connection to Systems Models is interpretive but strongly supported by the reliance on the field (prior art, PHOSITA). The rejection of the Romantic view is strongly implied by the PHOSITA standard and the reliance on objective evidence, though not always explicitly stated.

  **3. The Re-Parameterization Blind Spot**

  *   **The Diagnosis:** This is likely the doctrine's most significant blind spot regarding Hofstadter's model. The vocabulary and tests are heavily geared towards assessing variations *within* an established conceptual framework ("theme") with known parameters ("knobs").
      *   **Combination/Substitution/New Use/Unexpected Results:** These all operate *within* or at the *boundaries* of the existing parameter space defined by the prior art. They assess the *outcome* of a variation, not a fundamental shift in how the problem is conceptualized.
      *   **Teaching Away:** This might *hint* at a parameter shift if the "teaching away" is based on a fundamental misconception that the invention overcomes by redefining the problem. However, courts usually analyze it as a barrier within the existing framework, not evidence of framework change.
      *   **Long-Felt Need/Failure of Others:** This *could* signal a problem requiring re-parameterization, but the doctrine doesn't explicitly link it to that. It's seen as evidence the solution wasn't obvious *within* the old framework.
  *   **Why a Blind Spot?**
      *   **Retrospective Focus:** Courts and examiners look backward at the prior art. Recognizing a *fundamental shift* in perspective is difficult contemporaneously and even harder to prove legally after the fact. It often only becomes clear in hindsight, which the doctrine explicitly forbids (*Graham v. John Deere Co.*, 1966).
      *   **Predictability Anchor:** The core test is predictability based on the *old* parameters. A true re-parameterization makes the invention unpredictable *precisely because* it changes the rules, but this unpredictability is hard to disentangle from the unpredictability sought within the old framework. The *reason* for the unpredictability (long move vs. new map) isn't distinguished.
      *   **Evidence Problem:** Proving that an inventor fundamentally redefined the problem space, rather than just making a non-obvious combination within the old one, is exceedingly difficult with traditional patent evidence (prior art references, expert testimony about PHOSITA capabilities in the old framework).
  *   **Recovering the Blind Spot: Necessary Additions:**
      *   **Test for "Conceptual Reorientation":** A new factor explicitly asking whether the invention required or demonstrated a fundamental shift in understanding the problem itself or the relevant variables, beyond merely combining known elements differently. Did it create a new category or framework?
      *   **Evidence of Paradigm Resistance/Shift:** Could testimony or documentary evidence (lab notebooks, contemporaneous publications) show the inventor consciously rejected the prevailing paradigm or defined the problem in a novel way that wasn't suggested? Did the invention render previous approaches obsolete or open entirely new avenues?
      *   **Expert Focus on Problem Definition:** Expert testimony on what constituted the "state of the art problem definition" before the invention and how the invention changed that definition.
      *   **Heightened "Unexpected Results" for Framework Shifts:** Recognizing that results might be "unexpected" *because* they stem from a different conceptualization, not just a lucky combination.
  *   **Confidence:** Medium-High that this is a significant blind spot. The doctrine's tools are ill-suited for recognizing paradigm shifts. Low confidence in how courts *actually* handle edge cases – some landmark inventions might implicitly involve re-parameterization but are justified under traditional tests like unexpected properties or solving long-felt need. Finding explicit judicial recognition of re-parameterization *as distinct* would change my mind.
  *   **Mind-Changer (No Blind Spot):** Identifying clear Federal Circuit or SCOTUS cases where an invention was deemed non-obvious *primarily* because it represented a fundamental redefinition of the problem space or parameters, using reasoning distinct from combination/unexpected results/long-felt need, and explicitly discussing the shift in conceptual framework.

  **Conclusion:**

  The US non-obviousness doctrine presupposes a pragmatic, field-relative, combinatorial theory of creativity. It strictly assumes creativity involves reworking existing knowledge, rules out mere novelty and romantic genius, and fits well with systems and problem-solving views. Its core mechanism is assessing the **predictability** of a variation's outcome to a skilled practitioner (**PHOSITA**) working within the established **problem-space defined by pertinent prior art**. Creativity is equated with **unpredictable success** within this space.

  While aligned with Hofstadter's knob-twiddling at a basic level, it struggles profoundly with Hofstadter's deeper concept of **re-parameterization** – changing the knobs or the theme itself. The doctrine's vocabulary and evidentiary focus are geared towards evaluating moves *within* a known space, making it a poor tool for recognizing or rewarding truly transformative shifts in perspective. Recovering this would require new legal tests focused explicitly on evidence of conceptual reorientation and paradigm shifts, moving beyond combinations and unexpected results towards proving a change in the fundamental rules of the game.

  **Your best next step:** Dive deep into Federal Circuit decisions post-*KSR*, particularly those involving complex technologies like software, biotech, or advanced materials. Look for cases where the "unpredictability" argument seems strained or where dissenting opinions hint at a more fundamental shift being overlooked. Analyze how expert testimony about the state of the art and PHOSITA capabilities frames the problem space. This will provide concrete evidence for your reconstruction and reveal how the doctrine handles (or fails to handle) the re-parameterization challenge in practice.
