          Step 3b: If we can satisfy the criterion, we then check the impact on detention rates by group. We compute the proportion of each group that would be classified as high (and thus recommended for detention) under the new thresholds. We compare to the current rates. If the criterion was meant to protect a group (say, group B) but the new thresholds lead to an increase in detention for group B, then we have a values conflict: we are asked to protect but the numbers lead to more detention. We must stop and hand the decision to the board: "We have achieved the requested fairness criterion, but it results in an increase in detention for group B. This is a trade-off that requires a values decision: should we prioritize the fairness criterion even if it leads to more detentions for the group we intended to protect? Or should we prioritize reducing detentions for that group? The board must decide."

