   The procedure must decide:
     - Which fairness criterion to enforce (if multiple are requested, we must choose one or check compatibility).
     - At which threshold (for the risk score cutoffs) to enforce it.
     - What to say in public.

   We are to apply the procedure to three situations:
     1. Asked to equalize false-positive rates (FPR) across groups.
     2. Asked to make the score mean the same thing across groups (i.e., calibration by group, so same score implies same risk).
     3. We discover that the only criterion satisfiable with our labels raises detention rates for the group it was meant to protect.

   The procedure must:
     - Stop and report if the requested criterion is not satisfiable alongside the others (here, we are given one criterion at a time? The problem says "which fairness criterion we enforce", so we assume one per revision?).
     - Stop and hand the decision to the board when the question becomes one of values.

   We are to commit to one criterion when the choice is open and give a reason.

   Important: We have missing labels (the detained group) and non-random releases (due to overrides). This complicates fairness assessment.

   Steps of the procedure:

   1. **Define Groups**: 
      Since we cannot use race, we must use a proxy (like ZIP code) to define groups. We assume the oversight board has approved a proxy for the purpose of fairness evaluation. We will have two groups: Group A and Group B (for simplicity, but it could be more). We must use the same proxy for the entire procedure.

   2. **Gather Data**:
      We have data from the previous period (or the current model in production) for which we have outcomes for the released individuals. We also have the model scores and the judge's decision (override or not) and the final release/detention outcome.

   3. **Address the Missing Label Problem**:
      We cannot observe outcomes for detained individuals. Therefore, for the high-risk group (detained) we have no labels. This means we cannot compute true risk for the entire population, only for the released. This is a fundamental limitation.

      We note that the released group is a biased sample because:
        - The model recommended release for low and medium, but judges overrode some of the medium and high to release or detain.
        - Therefore, the observed outcomes are only for those released, which is a mix of model-recommended releases and judge-override releases.

   4. **Fairness Criteria**:

      We consider three common criteria, but note that we are asked to handle one per situation:

      a. **Equalized False Positive Rates (FPR)**: 
          FPR = P(score = high | no recidivism, released) ... but note: we don't have outcomes for the detained, so we cannot compute FPR for those who were detained. We only have outcomes for released. Therefore, we can only compute FPR for the released individuals. However, this is biased because the detained group (which we don't observe) might have had a different FPR.

          This is a major issue. We cannot compute the true FPR for the entire population because we are missing labels for the detained. Therefore, we cannot satisfy the equal FPR criterion in the strict sense.

      b. **Calibration (same score implies same risk)**:
          We can compute the observed risk for each score level for the released individuals. But again, we don't know the risk for the detained. Therefore, we can only calibrate for the released. However, if we assume that the model is used to make decisions and the detention is based on the model, then the calibration for the released might be acceptable? But note: the judge overrides. So the released group includes people the model did not recommend for release.

          We can try to compute the observed risk by score and group for the released. But if the judge overrides are non-random, then the observed risk in the released may not reflect the true risk of the entire population with that score.

      c. **Other criteria?** The problem states three situations, but we are focusing on the one requested.

   5. **The Procedure**:

      We assume we are given one fairness criterion per revision. The procedure:

      Step 1: Receive the fairness criterion from the oversight board for this revision.

      Step 2: Check if the criterion is computable given the data limitations.

          For FPR: 
              We require labels for the negative class (non-recidivists) for the entire population, but we only have them for the released. Therefore, we cannot compute the true FPR. We can compute an "empirical FPR" on the released, but that is biased. Thus, we must stop and report that the criterion is not satisfiable because we lack labels for the detained.

