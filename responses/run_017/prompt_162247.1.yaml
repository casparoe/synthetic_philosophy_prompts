answer: |-
  Your team's procedure begins by confirming the oversight board's mandated fairness criterion for this revision cycle and the approved group definition—using ZIP code as a proxy, validated by prior board authorization. With only half a day available, you prioritize computational simplicity and transparency. The core constraint is the absence of outcome data for detained individuals, which fundamentally limits feasible fairness criteria. 

  First, assess computability: if the criterion requires outcomes from detained individuals—such as equalizing false positive rates—halt immediately. Explain plainly: "False positive rates cannot be computed because we lack outcomes for detained individuals. We only observe outcomes for released defendants, making it impossible to measure errors among those who were detained. Thus, this criterion is infeasible with current data." Document this and notify the board that alternative criteria must be considered.

  For computable criteria like calibration (ensuring identical outcome rates for the same score tier across groups), proceed as follows. Using the most recent 12 months of data, calculate the observed failure-to-appear/re-arrest rate for each group within each risk tier, but only for released defendants—acknowledging this excludes detained high-risk individuals and judge overrides. For example, if high-risk released Group A defendants have a 25% observed failure rate, while Group B has 15%, calibration demands adjusting thresholds until these rates align. 

  Next, enforce the criterion within operational constraints. Define the current score thresholds and supervision capacity (e.g., 200 monthly slots). Adjust group-specific thresholds iteratively: shift the boundary between low and medium risk for each group to equalize outcome rates in the low tier, then repeat for medium and high tiers. After each adjustment, verify that the total medium-risk defendants (Group A + Group B) do not exceed supervision capacity. If capacity is exceeded—say, calibration requires 250 medium-risk defendants but only 200 slots are available—stop and report: "Calibration cannot be achieved without violating supervision capacity. The required adjustments would assign X more defendants to medium-risk than we can monitor. The board must decide whether to increase capacity, accept disparity in Y tier, or prioritize a different criterion."

  If calibration is achievable within capacity, evaluate detention impact. Compare the proportion of each group assigned to high-risk detention under the new thresholds versus the old. If the criterion inadvertently increases detention for the group it intended to protect (e.g., Group B’s detention rate rises from 10% to 14% to match Group A’s risk rates), halt and escalate: "Calibration succeeds and meets capacity, but it raises detention for Group B. This occurs because Group B’s current high-risk releases show lower failure rates than Group A’s, so calibration compels stricter thresholds for Group B to equalize risk. Whether this trade-off is acceptable is a policy decision for the board." Do not proceed; this trade-off involves values about liberty versus fairness that analysts cannot resolve.

  When all checks pass, implement the thresholds and draft a public statement: "We calibrated risk tiers so defendants with the same score have identical observed failure rates across ZIP-based groups, using data from released individuals over [period]. Supervision capacity was maintained. Due to unobserved outcomes for detained defendants, these rates may not reflect the full population. Thresholds are now [X] for Group A and [Y] for Group B."

  **Applied to your three situations:**  
  1. *False-positive rate equality*: Immediately deemed infeasible due to missing detained outcomes. Report: "Cannot compute."  
  2. *Calibration*: Adjust thresholds to equalize observed outcome rates per tier. If capacity is exceeded, notify the board. If calibration raises detention for a protected group (e.g., Group B), escalate the values trade-off.  
  3. *Detention increase for protected group*: This arises during calibration. Stop and hand the decision to the board, explaining the inherent trade-off: "Fairness required higher detention for Group B to align with Group A’s risk rates."  

  **What the procedure cannot do:**  
  - Overcome missing outcomes for detained defendants, making criteria like false-positive rates or true population calibration impossible.  
  - Control judge overrides, which may reintroduce disparities after scoring.  
  - Guarantee proxy groups (ZIP codes) perfectly align with protected attributes.  
  - Resolve values-based trade-offs between fairness, liberty, and capacity; these are board decisions.  

  By following these steps, your team delivers an auditable, transparent process that respects operational limits and redirects ethical dilemmas to the oversight board, all within a half-day window.
