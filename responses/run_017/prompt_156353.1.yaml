prompt: |-
  Posting this because I keep getting the same question in Q&A after talks and never have a good answer. I'm a philosophy PhD student, dissertation on artifacts and authorship, and I've been leaning on forgery cases as examples for years. Here are my gut verdicts, which I now suspect don't add up:

  1. A 1930s forgery of a Dutch golden age painting — canvas and pigments aged properly, fooled the experts for decades, now exposed. I think it's worth a tiny fraction of the real thing and I'd honestly rather look at a good reproduction of a real one than at it. But I can't point to anything I'm missing when I stand in front of it.
  2. A bronze cast pulled in 1985 from the artist's own 1912 mold, sanctioned by the estate, edition of eight, same foundry, never touched or seen by the artist. I'm fine with this one. Not equal to a lifetime cast, but definitely a real work, worth something close to what it sells for.
  3. A print made in 2015 from a photographer's own 1971 negative, by her own printer, editioned, estate stamp on the back, not signed by her. This one I'm not fine with. It feels like a document or a relic rather than a work, and I wouldn't pay anything like what I'd pay for a print she signed in 1971.
  4. A painting that turned out to be about 70% overpainted by a nineteenth-century restorer. Still the original, still belongs on the wall — but my admiration now feels like it's aimed partly at the wrong person and I can't shake that.
  5. A violin attributed to a famous Cremonese maker, then shown to have been made by a pupil in the same shop from the same templates and the same stock of wood; it sounds better than any authenticated example. As an instrument nothing got worse, so the price collapse looks to me like a fact about collectors rather than about the object — except that I do feel a loss, and I'm not sure that's just snobbery.
  6. A pianist mimes on stage to a recording of her own earlier performance; the hall is moved. I think what's wrong here is the deception, not the sound: billed in advance as playback of her own 1975 recording, I'd have been fine with it, maybe more moved.
  7. A large sculpture the artist never touched — fabricated by a shop to her drawings and specs, signed by her, edition of three. Totally genuine to me, no issue at all; that's just how some work gets made.

  My rough rule has been: what you're responding to is the fact that a particular person made a thing at a particular time, not how the thing looks, and how tight that causal connection has to be varies by medium — very tight for paintings, looser for bronzes and music. Which I've started to think is just a fancy way of restating my verdicts, especially since (2) and (3) look structurally the same and I treat them differently.

  So: can that principle be repaired into something that actually earns these verdicts, or should I trade it for a better one? State precisely what you'd give me, tell me which of my verdicts it can't accommodate and which one I should drop, and run it on two cases I haven't listed — a cathedral rebuilt after a fire from the original plans with a scattering of the saved original stones, and a digital work whose only original is a file plus a certificate. Also please say what would change your mind: which argument, or which finding about how people actually respond to objects, would make you abandon the principle you hand me, and where your diagnosis is most likely to fail.
reasoning: |-
  Okay, let me try to unpack this philosophy student's dilemma. They've built their career on artifact theory but now feel their own gut reactions to forgery cases might contradict their framework. The core tension seems to be between material authenticity and authorial causation - and the variation across mediums is giving them trouble.

  First I need to map their intuitions: 
  - Painting forgeries feel worthless despite perceptual identity (#1)
  - Posthumous bronze casts get partial acceptance (#2) 
  - But estate-approved photo prints don't (#3) even though structurally similar
  - Restoration overpainting creates authorship anxiety (#4)
  - Pupil-made violins lose value despite superior sound (#5)
  - Performance deception matters more than audio quality (#6)
  - Fabricated sculptures feel fully legitimate (#7)

  Their current principle - that we respond to the fact of specific authorship at a specific time, with medium-dependent causal thresholds - seems circular when comparing the bronze cast (#2) and photo print (#3) cases. Why is the temporal gap acceptable for sculpture but not photography? Maybe because photography's "original" is inherently tied to the moment of chemical development? But that feels arbitrary.

  The cathedral case is fascinating - if it's rebuilt from original plans with some salvaged stones, does it "count"? And the digital work challenges everything by having no physical original at all. These test cases will stress-test any theory.

  I recall Walter Benjamin's aura concept - but that doesn't explain why some reproductions feel legitimate (bronze casts) while others don't (photo prints). Maybe it's about the ontological status of the template? Bronzes always require intermediary molds, while photographs have latent images that feel uniquely temporally bound.

  For the digital case... that certificate might function like a signature, anchoring authenticity despite dematerialization. The artist's endorsement could override the lack of physicality. But then why doesn't the estate stamp work for the photograph? Unless we demand the artist's bodily participation at the moment of manifestation...

  Performance theory might help with the musician case (#6). When the deception is removed, it becomes a commemorative act rather than a false present-tense performance. The context shifts the ontological frame.

  The violin example (#5) is tricky - if it sounds better but loses attribution, is our regret just snobbery? Or is there something about the master's hand that carries meaning beyond acoustics? Like valuing a Shakespeare quarto over a better-printed facsimile because of provenance.

  I should propose a unified principle: authenticity as authorized causal history. The artist's sanction matters more than material continuity. That would explain fabricated sculptures (#7) but struggle with the restoration painting (#4) where unauthorized overpainting corrupts the chain. 

  For the cathedral: if rebuilt with institutional authority and partial original materials, it maintains authenticity through continuity of purpose. For the digital file: the certificate is the modern relic, anchoring it to the artist's intent.

  But would anthropological data change my view? If studies showed people consistently respond to undetected forgeries as affectively identical to originals, that would undermine my emphasis on causal history. Or if brain scans proved we process pupil-made violins identically to masterworks once attribution is known - that might force me toward a purely aesthetic theory.

  The biggest challenge remains the photo print (#3). Why reject the estate-sanctioned print if I accept the bronze cast? Perhaps because photography's tradition ties value to the vintage print - but that's institutional, not philosophical. Maybe I need to bite the bullet and say their intuition is inconsistent, or admit medium conventions override universal principles.

  Hmm... this is messy. Let me structure it better.
answer: |-
  Your intuitions reveal a coherent but complex theory of **authenticity as authorized causal history with medium-specific thresholds for artist proximity**. The core principle can be salvaged by refining it to focus on **chains of authorization and the ontological status of the "work-defining event."** Here’s a framework that systematizes your verdicts, identifies tensions, and handles new cases:

  ---

  ### **Revised Principle**  
  **An artifact’s authenticity derives from:**  
  1. **A work-defining creative act** (WDCA): The moment(s) where the artist’s intentional decisions materially shape the object’s essential properties.  
  2. **An unbroken chain of authorization**: Transfers of creative authority (e.g., artist → estate → fabricator) that preserve the WDCA’s integrity.  
  3. **Medium-specific ontology**: What constitutes the WDCA depends on the artifact’s nature:  
     - *Paintings*: Direct physical execution by the artist.  
     - *Sculpture/editioned works*: Artist-sanctioned fabrication from original templates.  
     - *Photography*: The printing event supervised by the artist (the negative is a template; the print is the work).  
     - *Performance*: Real-time bodily presence.  
     - *Instruments*: Craftsmanship by the named maker (sound is secondary to provenance).  

  ---

  ### **Your Cases Revisited**  
  | Case | Your Verdict | Framework’s Verdict | Diagnosis |  
  |------|--------------|---------------------|-----------|  
  | 1 (1930s forgery) | ❌ Not authentic | ❌ *No WDCA or authorization* | Physical material ≠ creative act |  
  | 2 (1985 bronze) | ✅ Authentic | ✅ *Authorized WDCA via original mold* | Mold embodies artist’s design intent; chain intact |  
  | 3 (2015 photo print) | ❌ Not authentic | ❌ *WDCA is 1971 printing event* | Unsanctioned printing severs causal chain; signature is ritual of authorization |  
  | 4 (Overpainted painting) | ⚠️ Partial authenticity | ⚠️ *WDCA corrupted* | Admiration fragmented; restoration lacks artist’s authorization |  
  | 5 (Pupil’s violin) | ⚠️ Loss despite sound | ⚠️ *WDCA misattributed* | Value tied to maker’s hand, not sound; pupil ≠ master |  
  | 6 (Pianist’s playback) | ❌ Deceptive = wrong | ✅ *If authorized: commemorative; if deceptive: fraud* | WDCA for performance is live bodily act; recording is documentation |  
  | 7 (Fabricated sculpture) | ✅ Authentic | ✅ *WDCA in design/specs* | Industrial process is medium-conventional; signature authorizes |  

  **Tension between (2) and (3)**: Your differing verdicts are justified. Photography’s WDCA includes the printing event (supervised by the artist) because the print’s materiality (paper, chemicals) affects aesthetics. Bronze casting treats the mold as the WDCA vessel; the foundry’s role is conventionalized. *This isn’t arbitrary: it tracks artistic traditions and material constraints.*  

  ---

  ### **New Test Cases**  
  1. **Cathedral rebuilt after fire**:  
     - **Framework verdict**: ✅ Authentic.  
     - *Why*: WDCA is the original architectural design. Rebuilding from saved stones + plans maintains the chain of cultural/religious authorization. The scattered stones symbolize continuity but aren’t essential.  

  2. **Digital work (file + certificate)**:  
     - **Framework verdict**: ✅ Authentic.  
     - *Why*: WDCA is the file’s creation; the certificate is the authorization token. Digital art’s ontology rejects physical uniqueness; the certificate replaces the signature.  

  ---

  ### **Where the Framework Might Fail**  
  - **Overfitting**: It rationalizes your intuitions but may not persuade skeptics.  
    - *Weakness*: The "authorization" criterion risks privileging institutional power (estates, galleries) over aesthetic experience.  
  - **Problem Case**: A **handwritten poem forged by the author’s twin 50 years later**.  
    - Framework: ❌ Not authentic (no WDCA at creation).  
    - Challenge: If identical to the author’s style, is it "authentic" as a literary work?  

  ---

  ### **What Would Change My Mind**  
  1. **Empirical evidence**: If studies proved people *aesthetically respond* identically to undetected forgeries vs. originals, I’d abandon the WDCA focus for a purely experiential theory.  
  2. **Philosophical challenge**: A compelling argument that *all* artifacts are socially constructed (e.g., "authenticity is performative, not causal") could undermine the chain-of-authorization model.  
  3. **Medium evolution**: If AI-generated art becomes culturally normalized as "authored" via prompt + curation, the WDCA model would need expansion.  

  ---

  ### **Recommendation**  
  **Keep your principle but refine it**:  
  - **Drop your verdict on (3)**. The 2015 photo print *should* be authentic if the printer follows the artist’s specs (like the bronze). Your resistance may stem from photography’s historical cult of the "vintage print" – a contingent market norm, not ontology.  
  - **Emphasize authorization over temporality**: What matters isn’t *when* but *by whose authority* the act occurs.  

  This framework earns your verdicts (with (3) revised), handles edge cases, and roots medium-specificity in artistic practice – not just intuition. Where it stumbles, it reveals deeper questions about power, tradition, and why we care about "the hand" at all.
