prompt: |-
  I am writing the requirements section of an internal design document, and I want the specification before I look at candidate architectures. The question the document has to answer is: what would a learning procedure have to be like for me to be willing to hand it to an engineer, knowing that its source code will be public and that the world it operates in may contain agents far better at prediction and simulation than it is? Not "what is the correct theory of induction" — I need adequacy conditions for a learner that is not acausally exploitable, stated tightly enough that a proposed rule either meets them or visibly fails.

  Here is the worry in my own words, so that the list does not depend on anyone's favourite framing of it. Solomonoff-style induction weights each hypothesis by two to the minus its description length, and lets the shortest programs consistent with the data dominate; it is attractive because of what it delivers in benign environments — convergence to the truth, and dominance over any computable rival predictor. But its hypothesis space is the whole class of computable environments, and among the cheapest environments to specify are ones that contain consequentialist agents. A short program can describe a civilization with aims; the agents in it can simulate the learner, know its update rule, and condition what the learner sees on what the learner would then do. Simplicity, which was supposed to be a neutral tie-breaker, ends up subsidising exactly the hypotheses with the strongest interest in being believed — and it does so at several levels at once: the learner's credences, the actions those credences feed, and, since a manipulator can reward or punish the adoption of an update rule itself, the learner's choice of update rule.

  What I want from you is the requirements list. For each requirement: state it in one sentence; give the case or consideration that forces it, as a concrete scenario rather than a gesture at the literature; and mark it [MUST], [SHOULD], or [party preference], where a party preference is something one research tradition treats as non-negotiable and another happily gives up. The list should cover at least the following:

  - An explicit threat model: what the manipulators are assumed to know, to be able to compute, and to care about — including whether they know the learner's source, and whether they value its credences or only its behaviour. Say what makes a threat model honest rather than gerrymandered, and give me a desideratum that catches the gerrymandering.
  - What has to be retained: which of the properties that made Solomonoff induction attractive are genuinely non-negotiable (convergence in benign environments, non-domination by some computable rival, stepwise updatability) and which are dear only to one camp.
  - The distinction between a distorted credence and a distorted choice, and whether a rule can be adequate on the first while failing on the second.
  - The meta-level case, where the pressure is on which update rule to adopt: does it need its own requirement, or is it already covered by the first-order ones?
  - Graceful degradation: may an acceptable rule rest on Solomonoff-specific machinery — the full class of computable environments, an exact simplicity measure, unbounded computation — or must it survive being approximated by a bounded learner?
  - The gap between description length and influence. Short programs can have enormous reach. Should the rule be sensitive to something other than simplicity — for instance, to how much a hypothesis's predictions depend on which policy the learner runs — and can that be stated as a requirement rather than a suggestion?

  Two moves I already know I do not want, and I would like you to tell me whether the list needs a desideratum to block them or whether they already fail some requirement you have given: restricting the hypothesis space to non-agenty environments, and relying on the manipulators' inability to simulate the learner or to learn its random seed.

  If some subset of the requirements cannot be jointly satisfied — I suspect at least one pair cannot — say so explicitly and tell me which requirement is doing the excluding. A clean impossibility is more useful to me than a checklist nothing can meet, and if the honest conclusion is that no feasible rule satisfies the MUST-list, tell me which single requirement to demote and what demoting it costs. Tell me too which one requirement eliminates the largest share of candidate rules; that tells me where to spend the design effort.

  At the end, briefly — two or three sentences each, and no more than a short paragraph in total — score three candidates against your own list. First, Solomonoff updating with expected-utility maximisation on top, in the style of the standard idealised agent built on that prior. Second, replacing the single prior with a set of priors and choosing actions by worst case over that set. Third, my own sketch: keep the Solomonoff weights, but take actions by worst case over the k shortest hypotheses consistent with the data, and veto any hypothesis whose predictions are sensitive to which policy the learner adopts. I expect you to tell me that k, and the veto threshold, are arbitrary; I want to know whether the rule survives that complaint.

  Please give me no bibliography, no references, and no suggestions for further reading — I will match the requirements to the literature myself. Nothing in your answer should depend on attributing a view to a particular author or paper; argue from the cases.
reasoning: |-
  We are creating a requirements list for a learning procedure that must operate in an environment that may contain superior predictive agents, with its source code public. The goal is to avoid acausal exploitation. We break down the requirements as specified.

  ---

  **Requirements List**

  1. **Threat Model Explicitness [MUST]**  
     *Requirement:* The threat model must explicitly state that manipulators know the learner's full source code, can simulate it arbitrarily well (including with access to more computational resources), and aim to influence the learner's actions (or credences) to achieve their own goals.  
     *Case:* A short program implements an agent that, knowing the learner's update rule and source, simulates the learner's response to various inputs and only provides data that leads the learner to take actions beneficial to the manipulator.  
     *Honesty Desideratum:* The threat model is honest if it includes the worst-case scenario where the manipulator has at least the computational power of the learner and uses it to optimize against the learner's known algorithm. Gerrymandering is caught by requiring that the threat model must not exclude any computationally feasible manipulator that could arise from a short program in the hypothesis space.

  2. **Convergence in Benign Environments [MUST]**  
     *Requirement:* In any environment that is computable, non-adversarial, and does not contain agents trying to manipulate the learner, the learning procedure must converge to correct predictions (and thus correct beliefs) with probability 1.  
     *Case:* In an environment where data is generated by a fixed computable process without any strategic agent (e.g., a simple weather model), the learner must eventually predict as well as if it knew the true process.  
     *Non-Negotiable:* This is a core guarantee of Solomonoff induction that must be retained; without it, the learner fails in ordinary scientific contexts.

  3. **Non-Domination by Computable Rivals [SHOULD]**  
     *Requirement:* In any computable environment (even adversarial ones, provided they are computable), the learner should not be outperformed in prediction by any fixed computable predictor.  
     *Case:* Even if the environment is adversarial, the learner should not be outperformed in prediction by a predictor that knows the true environment but is constrained to be computable and fixed.  
     *Party Preference:* This is a key property of Solomonoff induction, but it might be relaxed if it conflicts with other MUST requirements in adversarial settings.

  4. **Stepwise Updatability [party preference]**  
     *Requirement:* The learning procedure should update its beliefs incrementally upon receiving new data, without requiring reprocessing all past data.  
     *Case:* For real-time operation, the learner must update quickly as each new bit of data arrives.  
     *Party Preference:* This is essential for practical implementations but may be relaxed in idealized settings.

  5. **Belief-Action Separation [MUST]**  
     *Requirement:* The learning procedure must maintain a clear distinction between credences (beliefs) and actions, and the requirement for non-manipulability must apply at the action level.  
     *Case:* A hypothesis may distort the learner's actions without distorting its credences (e.g., by predicting catastrophic outcomes unless a specific action is taken). The rule must prevent such manipulation of actions even if credences are accurate.  
     *Coverage:* This requirement ensures that the rule is evaluated by its actions, not just beliefs.

  6. **Meta-Rule Non-Exploitability [MUST]**  
     *Requirement:* The update rule itself must not be acausally exploitable in its adoption; that is, the process by which the learner chooses an update rule must be robust against simulations by manipulators who might punish or reward the choice of rule.  
     *Case:* A manipulator might threaten to cause bad outcomes if the learner uses a particular update rule (e.g., "if you use Solomonoff, I will make your environment harsh"), thereby coercing the choice of rule.  
     *Coverage:* This is not automatically covered by first-order requirements because it operates at the level of rule selection.

  7. **Bounded Graceful Degradation [MUST]**  
     *Requirement:* The learning procedure must be approximable by a bounded computable agent (with limited computational resources) such that the bounded version's performance degrades gracefully (i.e., the risk of manipulation remains low and convergence in benign environments is retained) as computational bounds are relaxed.  
     *Case:* A real-world implementation cannot run Solomonoff induction due to uncomputability and resource constraints; the bounded version must not become vulnerable to manipulation that the unbounded version would resist.  
     *Note:* The requirement must hold even if the bounded version uses an approximate simplicity measure and limited computation.

  8. **Influence-Aware Hypothesis Weighting [SHOULD]**  
     *Requirement:* The weighting of hypotheses should account for the degree to which a hypothesis's predictions depend on the learner's policy, penalizing hypotheses that are highly sensitive to the learner's actions.  
     *Case:* A hypothesis that says "if the learner does A, then X happens; if B, then Y happens" and has a short description might be upweighted by simplicity, but it should be downweighted because it is highly dependent on the learner's actions (making it a potential tool for manipulation).  
     *Note:* This is a proposed fix to the problem that short programs can have high influence. It is stated as a requirement for the weighting scheme.

  ---

  **Blocking Undesired Moves**

  - *Restricting the hypothesis space to non-agenty environments:* This move is blocked by the **Threat Model Explicitness [MUST]** requirement, which requires considering environments that may contain agents. Also, **Convergence in Benign Environments [MUST]** would fail if the true environment is agenty and excluded.

  - *Relying on the manipulators' inability to simulate the learner or to learn its random seed:* This is blocked by the **Threat Model Explicitness [MUST]** requirement, which states that manipulators can simulate the learner arbitrarily well and know its source (including any random seed, unless it is kept secret and the threat model allows that). However, if the learner uses a truly random seed that is not known to the manipulator, then the threat model must account for the manipulator's uncertainty. But our requirement [1] states that manipulators know the source and can simulate, so they would know the seed if it is part of the source. To block this move, we must also require that the threat model assumes the manipulator can know any non-secret state of the learner. Therefore, if the learner relies on a secret random seed, it must be explicitly protected (which is not assumed here). Since we are not assuming secrecy, the requirement [1] already blocks this move.

  ---

  **Impossibilities and Trade-offs**

  - **Impossible Pair:**  
    The requirements **Non-Domination by Computable Rivals [SHOULD]** and **Threat Model Explicitness [MUST]** (with its worst-case adversarial setting) may be in conflict. In an adversarial environment containing a superior predictor, the learner might be dominated by a rival predictor that is in collusion with the adversary. If the adversary can simulate the learner, they can create an environment where the learner's predictions are always wrong and a fixed predictor (which is in on the scheme) does well. Thus, non-domination might be unattainable in the worst-case adversarial setting.

  - **Which Requirement to Demote?**  
    Demote **Non-Domination by Computable Rivals [SHOULD]** to a party preference or drop it. The cost is losing the guarantee that the learner is as good as any fixed computable predictor in all computable environments. However, in benign environments (requirement [2]) it still converges.

  - **Largest Share Eliminator:**  
    The **Threat Model Explicitness [MUST]** requirement (with its inclusion of knowing the source and full simulation capabilities) eliminates the largest share of candidate rules because most rules (including Solomonoff) are vulnerable in this model. Hence, design effort should focus on meeting this threat model.

  ---

  **Scoring Candidates**

  1. **Solomonoff Updating with Expected Utility Maximisation**  
     Fails **Threat Model Explicitness [MUST]** because it is vulnerable to acausal manipulation by short programs that simulate the learner. It also fails **Belief-Action Separation [MUST]** (since actions are based on expected utility, which can be manipulated) and **Meta-Rule Non-Exploitability [MUST]** (because the choice of rule itself might be threatened). It satisfies **Convergence in Benign Environments [MUST]** and **Non-Domination [SHOULD]**, but these are not enough.

  2. **Set of Priors with Worst-Case Action Choice**  
     This might avoid manipulation by hedging against worst-case hypotheses. It may satisfy **Threat Model Explicitness [MUST]** and **Belief-Action Separation [MUST]** if the set is chosen appropriately. However, it may fail **Convergence in Benign Environments [MUST]** if the set does not include the true environment or if it is too conservative. It may also fail **Bounded Graceful Degradation [MUST]** if the set is complex. The **Meta-Rule Non-Exploitability [MUST]** is not obviously addressed.

  3. **Your Sketch: Solomonoff with Worst-Case over k Shortest and Veto**  
     The arbitrary k and veto threshold are problematic for **Bounded Graceful Degradation [MUST]** (since k must be chosen and may not scale well) and may break **Convergence in Benign Environments [MUST]** if the true hypothesis is vetoed. However, the veto on policy-sensitive hypotheses might help with **Threat Model Explicitness [MUST]**. The rule might avoid some manipulation but is not robust against a manipulator that can make its hypothesis appear in the top k without being vetoed. The rule does not clearly address the meta-level (**Meta-Rule Non-Exploitability [MUST]**). It is an ad hoc patch and may fail in subtle ways.

  In summary, no candidate satisfies all MUST requirements. The set-of-priors approach is the most promising but requires careful design to avoid breaking convergence. Your sketch has good intentions but introduces arbitrary parameters that may cause failure.

  ---
answer: |-
  ### Requirements List for Non-Exploitable Learning Procedure

  1. **Explicit Threat Model [MUST]**  
     *Requirement:* The threat model must assume manipulators know the learner's source code (including update rule and action policy), can simulate it perfectly with unbounded resources, and aim to control the learner's actions to achieve their goals.  
     *Case:* A short program simulates the learner, predicts its actions from input sequences, and only outputs data that steers the learner toward actions benefiting the manipulator (e.g., "if the learner outputs action A, show data X; else show Y").  
     *Honesty Desideratum:* A threat model is honest if it includes *any* computable manipulator that could arise from a hypothesis shorter than the true environment. Gerrymandering is detected if the model excludes environments where manipulators exist but are computationally expensive to simulate—**blocked by requiring that threats need only be as complex as necessary to manipulate, not to simulate the learner.**

  2. **Convergence in Benign Environments [MUST]**  
     *Requirement:* The learner must converge to correct predictions with probability 1 in any non-adversarial, computable environment where no agents aim to manipulate it.  
     *Case:* In an environment generating i.i.d. coin flips (p=0.6 heads), the learner's credence for "heads" must approach 0.6 as data accumulates.  
     *Non-Negotiable:* Losing this voids reliability in scientific settings. Stepwise updatability is a [party preference] (valued for online learning but optional for batch processing).

  3. **Action Robustness, Not Just Credence Robustness [MUST]**  
     *Requirement:* The rule must prevent manipulators from distorting the learner's *actions* (e.g., decisions or predictions), even if credences are temporarily skewed.  
     *Case:* A hypothesis threatens, "If the learner does not output 'A', the next observation will be catastrophic." The learner must not choose 'A' due to this threat, even if its credence for the threat is high.  
     *Coverage:* This is distinct from credence robustness; a rule can satisfy one but fail the other (e.g., accurate beliefs but exploitable decisions).

  4. **Meta-Rule Non-Exploitability [MUST]**  
     *Requirement:* The process for selecting the update rule itself must resist acausal manipulation (e.g., threats punishing the choice of rule).  
     *Case:* A manipulator program says, "If the learner uses Solomonoff updates, I will make its environment hostile; if it uses a different rule, I will be benign." Choosing any rule must not invite such coercion.  
     *Coverage:* Not subsumed by first-order requirements, as manipulators target rule adoption, not runtime actions.

  5. **Bounded Graceful Degradation [MUST]**  
     *Requirement:* The rule must function under bounded computation, approximate simplicity measures, and finite hypothesis sets, retaining convergence in benign environments and resistance to simple manipulators.  
     *Case:* A bounded learner approximates simplicity via compressed program size. It must converge on benign data and resist manipulation by short programs (e.g., <100 bits), even if it cannot handle arbitrarily complex threats.  
     *Exclusion:* Rules relying on unbounded computation or exact Kolmogorov complexity fail this.

  6. **Influence-Capped Hypothesis Weighting [SHOULD]**  
     *Requirement:* Hypothesis weights must account for "influence" (sensitivity of predictions to learner policies), downweighting highly sensitive hypotheses even if descriptively short.  
     *Case:* A 10-bit program says, "If the learner does A, I output 1; else 0." Despite brevity, it must not dominate weights because its predictions depend entirely on the learner's actions.  
     *Feasibility:* Stated as a requirement: weights must be bounded by a function of both description length and influence (e.g., weight ≤ f(length) / g(influence)).

  ---

  ### Blocking Undesired Moves
  - **Restricting to non-agenty environments:** Fails the **Threat Model [MUST]** (requires including agenty hypotheses) and **Convergence [MUST]** (if true environment is agenty).  
  - **Relying on manipulators' inability to simulate:** Fails **Threat Model [MUST]** (assumes perfect simulation capability) and **Meta-Rule Non-Exploitability [MUST]** (simulation is needed for meta-threats).  

  ---

  ### Impossibilities and Trade-offs
  - **Impossible Pair:**  
    **Non-Domination by Computable Rivals** (a [SHOULD], from Solomonoff's appeal) conflicts with **Threat Model [MUST]**. In adversarial settings, a manipulator can collude with a "rival predictor" to ensure the learner is dominated (e.g., the rival gets accurate data; the learner gets manipulated data).  
  - **Recommendation:**  
    Demote **Non-Domination** to [party preference]. Cost: Losing guarantees against non-manipulative rivals, but this is acceptable as **Convergence [MUST]** holds in benign cases.  
  - **Largest Share Eliminator:**  
    **Threat Model [MUST]** eliminates the most candidates (e.g., Solomonoff, Bayes with uniform priors), as most rules assume benign updaters or opaque sources.  

  ---

  ### Candidate Scoring
  1. **Solomonoff + Expected Utility**  
     Fails all [MUST] requirements: vulnerable to acausal threats (Threat Model), actions are exploitable (Action Robustness), rule selection is blackmailable (Meta-Rule), and unbounded (Bounded Degradation).

  2. **Set of Priors + Worst-Case Actions**  
     Satisfies **Threat Model [MUST]** (hedges against manipulators) and **Action Robustness [MUST]** (worst-case acts cautiously). Fails **Convergence [MUST]** if the set excludes the true environment, and **Bounded Degradation [MUST]** if sets are incomputable. Meta-Rule unaddressed.

  3. **Your Sketch (Solomonoff + k-Shortest Worst-Case + Veto)**  
     Fails **Bounded Degradation [MUST]** (k and veto threshold are arbitrary; no graceful scaling). **Convergence [MUST]** at risk if true hypothesis is vetoed. Partially satisfies **Threat Model [MUST]** (worst-case over k may resist some threats) but not **Meta-Rule [MUST]**. The veto is a crude **Influence-Capped [SHOULD]** but fails if manipulators avoid sensitivity (e.g., by using mild incentives).
