answer: |-
  Your diagnosis is strikingly perceptive. The core impasse *does* seem rooted in divergent conceptions of semantics' explanatory scope, not just conflicting interpretations of data. Here's a breakdown integrating your points, specifying uncertainties, and testing your hypothesis:

  ### Core Diagnosis: Two Projects Under One Name
  1.  **Camp A (Sense/Descriptivist/Fregean-Leaning):**  
      *   **Goal:** Explain *cognitive significance* – why utterances inform, surprise, or justify belief/reasoning.  
      *   **"Meaning" = Cognitive Role:** Meaning must account for differences in how information is grasped, believed, or learned. The "something more" (sense, mode of presentation) is essential to semantics because it explains rational cognition involving language.  
      *   **Concession:** Agrees the singular object *is* the fundamental truth-maker (what makes the sentence true or false). But insists semantics must also capture *how* that object is thought about via language for a complete account of linguistic meaning in use.
  2.  **Camp B (Direct Reference/Singularist/Millian-Leaning):**  
      *   **Goal:** Explain *truth-conditional content* and *compositionality* – what the world is like if the sentence is true, and how the meaning of the whole depends systematically on the meanings of the parts.  
      *   **"Meaning" = Contribution to Truth Conditions:** Meaning is exhausted by the contribution to the proposition expressed (the claim about the world). The proposition is "singular" – it directly involves the object itself, not a description of it.  
      *   **Concession:** Agrees that names are cognitively associated with descriptive information (ways of thinking) for speakers. But insists this is *pragmatic* (about language use and psychology), not *semantic* (about the core, shared meaning determining truth conditions). Psychology handles informativeness.

  **Your Hypothesis Confirmed:** The central disagreement is **methodological and teleological** (about the purpose of semantics). Camp A demands semantics explain cognition; Camp B demands it explain truth/reference/composition cleanly. They use "meaning" to label these different targets. This divergence makes arguments largely talk past each other – evidence for cognitive role is dismissed by B as non-semantic; evidence for simple composition is dismissed by A as ignoring meaning's cognitive function.

  ### Your Cases & Their Implications

  1.  **The Statue Case (Perceptual Modes of Presentation):**
      *   **Challenge for Camp B (Direct Reference):** Yes, it strains the "ignorance of reference" explanation. You *know* the reference demonstratively ("this object") both times.
      *   **Camp B Response:** They'd argue that while perception fixes the reference, the *informative identity* stems from associating distinct *descriptive information* with the same perceptual object at different times ("the harbour-recovered piece" vs. "the auction-bought piece"). This distinct descriptive information is pragmatic/psychological. The *semantic* content of both demonstrative uses and the identity statement is the trivial singular proposition involving only the object: `<TheStatue, Identity, TheStatue>`.
      *   **Camp A Response:** This *is* precisely why senses/modes of presentation are semantic. Even with the object perceptually fixed, there are distinct *ways of conceiving* of it linguistically/informationally ("as the harbour find" vs. "as the auction purchase"). These distinct modes are part of the meaning expressed by the descriptions/identities. Informativeness tracks these semantic differences.
      *   **Discrimination & Cost:** It highlights Camp B's need to invoke non-semantic (pragmatic/psychological) elements *even when reference is known*. Camp A embraces distinct modes as semantic, even in perception – this is a *feature* for them (it explains the data), not necessarily a cost. The cost is arguably theoretical complexity in defining modes.

  2.  **The Dana Reyes Case (One Name, Multiple "Guises"):**
      *   **Challenge for Name-Centric Views:** This case powerfully shows that the explanatory burden falls *not* on the name itself, but on the distinct *mental associations* or *cognitive files* linked to the name.
      *   **The Relocation:** You hit the nail on the head. Both camps largely agree that *something* like "mental files," "dossiers," or "notions" (ways of thinking of an object) is psychologically real and explains the cognitive phenomena.
      *   **Does the Dispute Reappear?** **Yes, partially.** The core methodological dispute resurfaces:
          *   **Camp B:** These files are purely psychological. The *name's semantic contribution* remains just the person. The files explain why you might *mistakenly* think you are talking about two people or fail to integrate beliefs, but the literal meaning of "Dana Reyes" in both uses is Dana Reyes the person. Your resistance is a psychological error, not a semantic ambiguity.
          *   **Camp A:** The distinct files constitute distinct *senses* associated with the name in your idiolect (personal language system). Meaning is tied to cognitive role, so the name effectively functions with different senses for you in different contexts, explaining your resistance and the informativeness of discovering identity. Meaning isn't just the referent.
      *   **Agreement?** They agree on the psychological mechanism (files/dossiers). They disagree fiercely on whether this mechanism is part of *linguistic meaning* (A) or purely *psychological context* (B).

  3.  **The Database Analogy (Records vs. Entities):**
      *   **Your Suspicion is Largely Correct:** This is primarily a **practical/institutional design question** with a clear "right answer" depending on system goals. The engineers prioritize the *singular entity* as the truth-maker (the real-world referent). The cataloguers prioritize the *information pathways* (the provenance, the "modes of presentation" of the data).
      *   **Philosophy's Bearing:** It *illustrates* the philosophical tension but doesn't dictate the solution. The "right answer" requires understanding *what the institution needs the system to do* (e.g., ensure data accuracy, track provenance, avoid duplicates). Neither pure referentialism nor pure descriptivism wins; a hybrid model tracking both entities *and* source metadata is usually best.
      *   **Why It's Different:** Institutional bookkeeping has defined goals (accuracy, auditability, usability) against which solutions can be objectively evaluated. Philosophy debates the fundamental nature of meaning and cognition, where core intuitions about "aboutness" and "understanding" clash, and there's no agreed-upon external metric like "system efficiency" to settle it. The "bite" is indeed tied to explaining rational cognition.

  ### Substantive, Verbal, or Two Questions?
  *   **Not Purely Verbal:** They aren't *just* using "meaning" differently. They genuinely prioritize different phenomena as the essential core of semantics.
  *   **Not Fully Two Separate Questions:** They overlap significantly on the *data* (the same puzzling sentences and inferences) and both aim to explain language. They are competing frameworks for explaining the same broad domain.
  *   **Core Substantive Disagreement:** The **substantive disagreement** is about the *explanatory domain of semantics proper*. Is semantics solely about word-world relations (reference, truth) and composition? Or must it also encompass word-mind relations (cognitive significance, understanding)? This is a deep methodological divide about the nature of linguistic science.

  ### The Hidden Empirical Hinge
  *   **Does it Exist?** **Yes.** The debate hinges significantly on an **implicit empirical bet** about the relationship between language processing and core semantic content:
      *   **Camp B bets:** Cognition (storing info in files, accessing it, being surprised) can be cleanly separated from the core, stable, shared semantic content (reference + composition). Psychology explains the messy cognitive stuff; semantics explains the clean referential foundation.
      *   **Camp A bets:** Cognition (understanding, inference, learning) is *so* tightly interwoven with the use of language that any semantic theory ignoring it misses the essence of meaning. The "messy" cognitive role *is* semantic.
  *   **Psychological Findings *Could* Shift the Debate:** Evidence that linguistic understanding *fundamentally relies* on activating specific cognitive files or modes of presentation in a way that directly shapes truth-conditional interpretation *could* bolster Camp A. Evidence that core referential processing is cognitively distinct and primary, with cognitive files being secondary associations, *could* bolster Camp B. However, both sides could likely absorb most findings into their "pragmatic" or "psychological" components.

  ### What Would Count as Progress?
  1.  **Reframing Successfully:** Explicitly defining distinct projects (e.g., "Semantics-T" for truth/reference/composition vs. "Semantics-C" for cognitive role) and agreeing that both are legitimate but different. Progress would be mutual recognition and collaboration instead of trying to "win".
  2.  **A Formal Result:** A devastating logical inconsistency proven within one framework that isn't easily patched. (This seems unlikely; both are robust).
  3.  **A Psychological Finding:** Overwhelming evidence that cognitive files/modes *are* or *are not* accessed and utilized in a way that demonstrably alters core linguistic processing (e.g., reference resolution, truth-value judgment speed/accuracy) in a manner one camp cannot easily explain away.
  4.  **A New Distinction:** A novel conceptual tool that cleanly resolves the tension or shows it to be illusory. (Many have been tried; none universally accepted).
  5.  **Changing the Question:** Shifting focus entirely (e.g., to dynamic aspects of communication or social practice) might make the puzzle less central, but probably wouldn't resolve it.

  ### Argument for No Progress (and Why it Might be Valid)
  *   **The Argument:** The disagreement stems from fundamentally different, pre-theoretical intuitions about the essence of "meaning" and "understanding." Camp A intuits that understanding a name *is* thinking of the object in a certain way. Camp B intuits that understanding a name *is* knowing what it picks out in the world, regardless of how one thinks of it. These intuitions are foundational and resistant to empirical refutation. Each framework satisfies its own core intuition well and the other's poorly. Since there's no neutral ground to adjudicate these intuitions, sustained disagreement is the natural state.
  *   **Why Plausible:** Decades of sophisticated argument haven't moved the needle significantly. Each side has sophisticated responses to the other's best cases. The debate often circles back to starting intuitions. The "hidden empirical hinge" might be too intertwined with the core intuitions to settle them neutrally.

  **Confidence & Uncertainties:**

  *   **Overall Diagnosis Confidence:** **85%** - Your core insight about diverging goals for semantics aligns strongly with how the arguments play out and the concessions made. The camps *do* prioritize different phenomena.
  *   **Least Confident Specific Claim:** My interpretation of Camp B's response to the Statue Case (**"This distinct descriptive information is pragmatic/psychological"**). Some referentialists (especially "latent" or "two-dimensional" theorists) flirt with incorporating descriptive elements more robustly, though usually still denying they are strictly *semantic* meaning. I'm smoothing over internal nuances here. (Confidence in this specific phrasing: **70%**).
  *   **Smoothing Over:** I've presented each camp as more monolithic than they are. There are "neo-descriptivists," "two-dimensionalists," and "mental files" theorists who blend elements, and fierce debates *within* each camp. I've also glossed over complex details about propositions (the "things" expressed: singular vs. descriptive) and compositionality (how meanings combine).
  *   **Extrapolating:** Linking the debate to an "implicit empirical bet" about language processing is an extrapolation. While supported by the arguments (e.g., Camp A's focus on cognition, Camp B's insistence on separating psychology), it's not always explicitly stated as the core hinge by the participants themselves. It's a plausible reconstruction.

  **In short:** You've grasped the heart of the stalemate. It's less about the facts of Frege's puzzle and more about what facts a semantic theory is *responsible for* explaining. The sides are architects building different structures for different purposes, both insisting their blueprint is for the one true "Meaning Hall." Progress may require recognizing they are building different, equally important, wings of a larger complex. Your workplace experience tells you that practical problems demand integrating both perspectives; the philosophical stalemate persists because neither side accepts that their wing isn't the whole building.
