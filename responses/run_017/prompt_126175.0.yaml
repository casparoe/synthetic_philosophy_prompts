  ### Prediction Scenario

  **Setting:** A finite sequence of bits of length \(T\). The box emits a binary sequence \(\mathbf{x} = (x_1, \dots, x_T)\) where \(x_t \in \{0, 1\}\). The environment class \(\mathcal{E}\) contains all \(2^T\) possible binary sequences. The learner observes bits sequentially and outputs a probability \(p_t \in [0, 1]\) for \(x_t = 1\) before seeing \(x_t\). The **scoring rule** is **thresholded accuracy**:  
  - At trial \(t\), the score \(s_t = 1\) if \((p_t \geq 0.5 \text{ and } x_t = 1)\) or \((p_t < 0.5 \text{ and } x_t = 0)\), else \(s_t = 0\).  
  Total score: \(S = \sum_{t=1}^T s_t\).

  **Learner 1 (Straight Rule):** Predicts \(\hat{p}_t = \frac{\text{number of 1's in } x_1,\dots,x_{t-1}}{t-1}\) for \(t \geq 2\) (with \(\hat{p}_1 = 0.5\)), then thresholds to 0 or 1.

  **Learner 2 (Constant 0):** Always predicts \(p_t = 0\) (i.e., \(\hat{x}_t = 0\)).

  **Learner 3 (Weighted Majority):**  
  - Uses two experts: Expert 0 (always predicts 0) and Expert 1 (always predicts 1).  
  - Initial weights: \(w_0(1) = 1\), \(w_1(1) = 1\).  
  - At \(t\), compute \(p_t = w_1(t) / (w_0(t) + w_1(t))\), predict \(\hat{x}_t = \mathbb{I}_{[p_t \geq 0.5]}\).  
  - Update weights: If Expert 0 is wrong (i.e., predicts 0 but \(x_t = 1\)), set \(w_0(t+1) = \beta \cdot w_0(t)\) (else unchanged). Similarly for Expert 1. Use \(\beta = 1/2\).

  ---

  ### Requirement 1: No-Free-Lunch Equality
  **Claim:** For any learner, \(\mathbb{E}[S] = T/2\), where the expectation is uniform over all environments.

  **Proof:**  
  At trial \(t\), the history \(h_{t-1} = (x_1, \dots, x_{t-1})\) occurs with probability \(2^{-(t-1)}\). Given \(h_{t-1}\), \(x_t\) is uniform (since all sequences are equally likely). The learner’s \(p_t\) is fixed by \(h_{t-1}\). The score \(s_t\) is 1 if:  
  - \(p_t \geq 0.5\) and \(x_t = 1\) (prob. \(1/2\) given \(h_{t-1}\)), or  
  - \(p_t < 0.5\) and \(x_t = 0\) (prob. \(1/2\) given \(h_{t-1}\)).  
  Thus, \(\mathbb{E}[s_t \mid h_{t-1}] = \frac{1}{2} \cdot 1 + \frac{1}{2} \cdot 0 = \frac{1}{2}\). Marginalizing over \(h_{t-1}\), \(\mathbb{E}[s_t] = \frac{1}{2}\). Summing over \(t\), \(\mathbb{E}[S] = T/2\).  
  This holds for **any** learner, including Straight Rule, Constant 0, and Weighted Majority. All tie at chance.

  ---

  ### Requirement 2: Vindication of Weighted Majority
  **Vindication Statement:**  
  Weighted Majority (Learner 3) guarantees:  
  - For **every** environment, the number of mistakes \(M_{\text{WM}} = T - S_{\text{WM}}\) satisfies:  
    \[
    M_{\text{WM}} \leq \min\{M_0, M_1\} \cdot \frac{2}{1 - \beta} + \frac{2 \ln 2}{1 - \beta}, \quad \text{with } \beta = 1/2
    \]  
    where \(M_0\) and \(M_1\) are mistakes by Expert 0 and Expert 1.  
  This means Weighted Majority succeeds (has low regret) on every environment where success (low error by the best expert) is achievable.

  **Rival Learner (Constant 0):**  
  - Constant 0 (Learner 2) ties with Weighted Majority under uniform expectation (both have \(\mathbb{E}[S] = T/2\)).

  **Why Vindication Rules Out Constant 0:**  
  - On an environment with all 1’s:  
    - Constant 0: \(M_0 = T\) (all predictions wrong).  
    - Weighted Majority: \(M_{\text{WM}} \leq 2 \ln 2 / (1 - \beta) \approx 2.77\) (bounded mistakes).  
  - The best expert (Expert 1) has \(M_1 = 0\), so "success is available" (error 0). Weighted Majority achieves \(\approx 2.77\) mistakes, but Constant 0 fails catastrophically (\(M_0 = T\)).  
  - Thus, Constant 0 violates the vindication: it fails on environments where success (by the best expert) is available.

  ---

  ### Requirement 3: Explicit Compatibility
  **Shift Between (1) and (2):**  
  - **Requirement 1** optimizes: Expected score \(\mathbb{E}[S]\) under **uniform** distribution over environments.  
  - **Requirement 2** optimizes: Per-environment regret \(\min\{M_0, M_1\} - M_{\text{WM}}\) (worst-case or instance-wise), **without averaging**.  

  **Compatibility Proof:**  
  Under uniform expectation (Requirement 1), \(\mathbb{E}[S] = T/2\) for all learners. The vindication in Requirement 2 provides no advantage here:  
  - Weighted Majority: \(\mathbb{E}[S] = T/2\).  
  - Constant 0: \(\mathbb{E}[S] = T/2\).  
  The regret-bound guarantee is per-environment and buys nothing when averaged uniformly, as most environments are adversarial (e.g., alternating bits, where \(\min\{M_0, M_1\} \approx T/2\)).

  ---

  ### Key Feature and Skeptic's Attack
  **Single Feature Doing the Work:**  
  The **set of experts** (here, constant 0 and 1) defines the benchmark for "available success." If removed, Requirement 2’s vindication vanishes, and Requirement 1’s no-free-lunch dominates.

  **If Feature Removed:**  
  Without a predefined expert set, no-free-lunch applies universally: no learner outperforms another on average. The vindication cannot single out any learner.

  **Strongest Attack by Humean Skeptic:**  
  The vindication is **circular** and **question-begging**:  
  1. **Circularity:** Success is defined relative to arbitrary experts (constant predictors). Why assume one of them works? This smuggles in a uniformity assumption: that the world is constant.  
  2. **No-Free-Lunch Dominates:** Uniform average includes non-constant environments (e.g., \(010101\dots\)), where both experts err \(\approx T/2\) times, and Weighted Majority also scores \(\approx T/2\). The vindication offers no justification for induction in these cases.  
  3. **Ad Hoc Experts:** Choosing constant experts is arbitrary. With no prior knowledge, all sequences are equally likely (per Hume), so the expert set is unjustified.  

  **Conclusion:**  
  The skeptic argues that the vindication only "works" by assuming a specific structure (existence of a good expert), which is equivalent to assuming uniformity in nature. No-free-lunch shows this structure is absent in most environments, leaving induction unvindicated.
