prompt: |-
  Hi — I'm a journalist, I cover science and ideas, and I keep running into a shape of argument I dont have a word for. Tell me whether there's an established concept for it, or whether I'd be inventing one. Please don't give me a reading list or footnoted citations, I'll never chase them — I just want to know whether what I'm seeing has been carved out somewhere before, and if it hasn't, how you'd carve it.

  Here's the shape. Two people disagree about some empirical claim: how fast a new virus spreads, say, or how much of a wage gap is discrimination. They agree on the data. They agree on what the data would look like if each competing story were true. And they agree that whatever is left over — the part the data doesn't settle — should be filled in by what you'd have expected before any of it came in. The prior, I think that's the word. So the disagreement gets located: it isn't about the evidence, it's about the prior.

  Then the part I can't name. They ask whose prior is the right one, and they agree on a rule for deciding — that a starting point should be as uncommitted as possible, say, or that it shouldn't depend on which way you happen to write the quantity down. And they disagree again, about which starting point satisfies that rule. So they go up a level and agree on a rule for choosing among rules, and disagree again. It doesn't shrink. Three rounds in they're as far apart as ever, but at each round they've agreed about one more thing and disagreed about one more thing.

  What makes it more than "they disagree" for me: each person's preferred rule one level up is the rule that hands back the starting point they already liked at the bottom. Nobody's being paid. They're not obviously lying. But the higher-level principle always seems to have been picked to ratify the lower-level one, not the other way round.

  So does this have a name? I've heard "deep disagreement" used for cases where two sides don't share a way of arguing at all, and that's not this — these two share all the machinery and still can't land. It also feel different from a regress-of-justification thing, because nothing here is being propped up by the level above it; the support seems to run downward, from the conclusion to the principle. And it isn't just "everyone is biased," because what I actually want to know is whether the same shape could turn up between two people with no stake, no motive and unlimited patience — if it could, then calling it bias misses it.

  One more thing: I've been told there's a result, Aumann something, saying two people who start in the same place and who know each other's conclusions shouldn't be able to keep disagreeing. Is that even compatible with what I'm describing? Because if it isn't, one of my two stories is wrong, and I'd rather know which before I write it up.

  If there's no established label, coin one and define it, and give me the boundary cases: at what point does this stop being itself and become an ordinary disagreement about priors, or plain motivated reasoning, or just the dull fact that two people can start in different places. I'm not after a word, I'm after the shape and its edges.

  And be straight with me, since I may quote you: say how confident you are in each of the main claims you make, and flag the single point you're least sure of. Lead with your bottom line in the first sentence, then give me the reasoning — no preamble, and don't restate my question back at me.
reasoning: |-
  Okay, let me tackle this step by step. The user is a science journalist encountering a specific pattern of disagreement and wants to know if it has a name or needs to be coined. 

  First, I need to parse the core structure: 
  - Parties agree on data and likelihoods but clash on priors
  - They then agree on meta-rules for choosing priors, but disagree on which prior satisfies those rules
  - This escalates to meta-meta-rules, with alignment always one level above the current disagreement
  - Crucially, higher-level principles seem reverse-engineered to justify existing priors

  Key distinctions they've already ruled out: 
  - Not "deep disagreement" (shared argument framework exists)
  - Not standard bias/motivated reasoning (hypothetically could occur without stakes)
  - Not Aumann's agreement theorem violation (since priors may legitimately diverge initially)

  Hmm... the recursive justification aspect reminds me of Goodman's "grue" paradox where definitions bend to preserve conclusions. But that's about induction, not Bayesian disputes. 

  For labeling: "Reverse Bayesianism" feels apt because it inverts the expected direction of justification (conclusions dictating principles rather than principles dictating conclusions). The "recursive" part captures the infinite regress pattern. 

  Boundaries to clarify: 
  - Becomes ordinary prior disagreement if meta-rules actually constrain choices
  - Crosses into motivated reasoning when stakes demonstrably drive the reverse-engineering
  - Collapses to dull divergence only if higher agreements don't occur

  Least confident point: Whether this can *provably* occur without any bias. The Aumann compatibility question is thorny - technically compatible if prior differences are "legitimate" (e.g., different reference classes), but the recursive pattern suggests something fishier. 

  Should emphasize: This pattern exposes how supposedly neutral meta-rules can be weaponized. That's the journalist's hook.
answer: |-
  ### Bottom line: This is **reverse Bayesianism** — a recursive disagreement where priors dictate meta-principles rather than the reverse, escalating through levels while preserving disagreement distance. No established term exists, so coin this.

  **Confidence: 90%** this is a novel carve-out. Here’s the reasoning, boundaries, and Aumann compatibility:

  ---

  ### **Core Concept: Reverse Bayesianism**  
  *Definition*: A recursive, non-converging dispute where:  
  1. Parties agree on data, likelihoods, and the *need* for priors.  
  2. They escalate agreement to meta-rules (e.g., "priors must be uninformative") but disagree on *which prior satisfies the rule*.  
  3. Each higher-level principle is reverse-engineered to defend their original prior, creating infinite regress without resolution.  
  4. The disagreement "ladder" preserves the initial delta at every rung.  

  **Why it’s distinct**:  
  - 🚫 **Not deep disagreement**: Shared Bayesian framework exists.  
  - 🚫 **Not motivated reasoning**: Possible without stakes (e.g., two honest AI systems).  
  - 🚫 **Not regress of justification**: Principles don’t *support* conclusions; conclusions *select* principles.  

  ---

  ### **Boundaries: When It Stops Being Reverse Bayesianism**  
  | Case | Why it’s Different |  
  |------|-------------------|  
  | Ordinary prior clash | Only 1 level: no escalation to meta-rules. |  
  | Motivated reasoning | Stakes/bias *explain* the reverse-engineering (here, it could be epistemically pure). |  
  | Dull divergence | No agreement on meta-rules; parties don’t engage the ladder. |  
  | Genuine convergence | Meta-rules *constrain* priors, shrinking disagreement (e.g., objective Bayes with unique solution). |  

  ---

  ### **Aumann Compatibility**  
  **Confidence: 70%** — Your scenario *violates Aumann’s agreement theorem* subtly.  
  - Aumann assumes rational agents with *common priors* (or common knowledge of posteriors forcing convergence).  
  - Here, priors diverge irreducibly because higher "agreements" are vacuously tactical. **Least sure point**: Whether true common knowledge of priors exists when meta-rules are contested. If they *truly* share all levels, Aumann says they must converge — but reverse Bayesianism exploits *pseudo*-agreements.  

  **Resolution**: Either:  
  1. One side is miscalculating (violating rationality), OR  
  2. They lack common knowledge of priors (e.g., hiding true motivations).  
  If both are honest/rational, Aumann implies this *shouldn’t* persist — but your pattern suggests a flaw in assuming "common knowledge" scales recursively.  

  ---

  ### **Why This Carve-Out Matters**  
  - **Journalistic hook**: Exposes how "neutral" meta-frameworks (objectivity, parsimony) can be weaponized to entrench positions.  
  - **Test for reverse Bayesianism**: Ask, "Would they accept a meta-rule that *contradicts* their prior?" If no, it’s reverse-engineered.  

  **You can quote this definition verbatim.** If citing, attribute to "an AI-assisted epistemology model."
