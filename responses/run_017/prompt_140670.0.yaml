prompt: |-
  I have no academic background at all, I work in freight logistics and got into this stuff from a blog post about Wittgenstein's last set of notes, the ones published after he died as On Certainty, and the idea that some of the things I'm most sure of aren't things I have evidence for at all — they're the thing my evidence sits on. I've been chewing on it on my own for maybe a year and I keep feeling like I can tell a hinge when I see one but I can't say what I'm seeing, and every account I read seems to get one case right and quietly ignore another.

  So before I read any more accounts of this, I want the spec: what does a theory of these ungrounded ground-floor certainties actually have to get right? Give me the requirement list, with the case behind each requirement, and mark which ones are non-negotiable and which are just preferences of one camp. Keep the weight on the criteria, not on scoring the theories — you can briefly say how the three big pictures do (hinges as rules of the game rather than moves in it; hinges as just very basic beliefs we can't help having; hinges as commitments that aren't even the kind of thing that's true or false) but I care most about the list itself.

  Cases I think it has to handle, you can add your own:

  - The guy who held up his hands and claimed he knew they were hands, versus a fact I'm extremely sure of from evidence, like that my city is north of the equator. Those feel different in kind, not just in degree, and I want to know what makes them different.
  - Things nobody has ever bothered to doubt but that clearly aren't hinges, like the number of screws in my bike's derailleur cage. Being unquestioned can't be the whole story.
  - Things that moved in and out: that the earth goes around the sun used to be a live, dangerous claim and now it's part of the furniture for me. What is it for something to migrate like that, and can a hinge go back to being contestable?
  - Kids. I was raised by people who took astrology seriously and by eighteen I thought it was nonsense, and I genuinely cannot point to the argument or the afternoon when it flipped. So: how do hinges get installed, and what happens when the people who installed them were unreliable?
  - Whole groups with different furniture. Two communities whose ground-floor stuff clashes, and each side's members think the other side is not just mistaken but broken. Does a theory owe me any non-question-begging way to talk about that, or is it allowed to just say there's nothing more to say?
  - Whether a hinge can be false. Some accounts seem to build in that it can't, and that feels like cheating to me, but I can't say why.

  Here are three tests I came up with on my own and I can't work out whether they're three tests or one test in a costume. A hinge is: something where I'd sooner distrust my own doubting than distrust it; something I can't argue for without already assuming something equally big; something where, if you denied it, I'd conclude you were confused or playing a language game wrong rather than that I might be wrong. Do these ever come apart, and which one is doing the real work?

  Two last things: flag any pair of requirements you suspect can't both be satisfied, because if the list itself turns out to be impossible that's the part I most want to know. And tell me which single requirement knocks out the most otherwise-attractive accounts. A table is fine if that's easier. Sorry if some of this is half-baked, I'm defintely making up my own vocabulary as I go.
reasoning: |-
  Okay, let me start by understanding the user's background. They work in freight logistics and got into philosophy through a blog post about Wittgenstein's "On Certainty." They've been thinking about hinges for about a year but feel stuck because existing accounts don't cover all cases. They want a list of requirements for a theory of hinges, not a critique of existing theories.

  First, I need to parse their cases. They mentioned six specific scenarios: the difference between Moorean propositions and evidentially supported beliefs, unquestioned non-hinges, historical migration of beliefs, acquisition and unlearning in childhood, conflicting community hinges, and whether hinges can be false. They also have three personal tests they're unsure about.

  The user's deeper need seems to be clarity on what makes a hinge a hinge, especially since they're self-taught. They might feel frustrated by academic jargon and want practical criteria. Their examples from logistics (like screws in a derailleur) suggest they value real-world applicability. They might also be seeking validation that their self-devised tests are on the right track.

  I recall Wittgenstein's hinges aren't beliefs but the framework for beliefs. The challenge is capturing that without technical terms. The user wants non-negotiable vs. negotiable requirements. Key issues: hinges aren't justified by evidence, yet they can change; they feel different from ordinary beliefs; they can be community-specific but still function as bedrock.

  For their three tests: Distrusting doubt vs. presupposing in arguments vs. interpreting denial as confusion. These might converge but could separate in edge cases. For example, in radical skepticism, one might doubt without confusion, so the third test might be stronger. The real work is likely the framework role (second test), but the psychological certainty (first test) is how it manifests.

  Conflicting requirements might be between Universality (hinges are shared) vs. Relativity (different communities have different hinges). Also, Mutability vs. Non-justification: if hinges change, how can they be beyond evidence? The user’s astrology example shows hinges can shift without evidence, suggesting Mutability is crucial, but it strains Non-justification.

  The single requirement that trips up most theories? Non-Propositionality. Many accounts treat hinges as beliefs, but if they're not truth-apt, it avoids the "false hinge" problem. That's probably the key knockout criterion.

  Need to structure the response with clear requirements, cases, negotiability, and how theories handle them. A table might help, but since they prefer weight on criteria, maybe integrate it. Highlight where their tests fit and which requirement is most pivotal.
answer: |-
  Here's a specification for a theory of "hinge certainties" (ungrounded ground-floor certainties), built from your cases and core questions. The requirements are grouped thematically, with cases, negotiability status, and brief notes on how major approaches handle them. The goal is **descriptive adequacy**: capturing what these certainties *do* in our epistemic lives, not prescribing what they *should* be.

  **Core Requirements (Non-Negotiable):**

  1.  **Non-Justificational Grounding:**
      *   **What it must get right:** Hinges *cannot* be supported by evidence or argument in the ordinary way. They are the framework *upon which* justification and evidence-gathering depend. Trying to justify them requires presupposing them or equally fundamental things.
      *   **Case:** Moore's hands ("I know this is a hand") vs. knowing your city is north of the equator (based on maps, travel, physics). Evidence supports the latter *because* things like "Objects persist," "My senses generally report reliably," "Maps are trustworthy sources" are already assumed. You can't *prove* the hand is a hand without assuming the reliability of perception, memory, etc.
      *   **Knockout Power:** This requirement eliminates any theory that treats hinges as simply "very well-justified" empirical beliefs. It's the core Wittgensteinian insight.
      *   **Your Test Links:** Directly to "something I can't argue for without already assuming something equally big."
      *   **Major Views:** All three major views (Rules, Basic Beliefs, Non-Propositional) accept this. Rules/Non-Propositional build it in fundamentally; Basic Beliefs struggle to explain *why* they can't be justified.

  2.  **Framework Role (Enabling Doubt & Inquiry):**
      *   **What it must get right:** Hinges make doubt, investigation, and meaningful assertion *possible*. Doubting *everything* at once is impossible; hinges are the stable points against which doubt *moves*. They define what counts as a relevant question, evidence, or rational doubt within a system.
      *   **Case:** The number of screws in your derailleur cage is unquestioned but *not* a hinge. You *can* doubt it meaningfully: count them, look it up. Doubting hinges like "There is an external world" or "Objects persist when unobserved" doesn't lead to productive inquiry; it paralyzes or leads to nonsense ("Maybe *everything* is an illusion?" isn't testable).
      *   **Case:** If someone denies Moore's hand, you think they are confused/mistaken about language/game-playing. If they deny your city's latitude, you can point to evidence.
      *   **Knockout Power:** Weakens "Basic Beliefs" views that don't distinguish the *functional role* from mere psychological certainty.
      *   **Your Test Links:** Directly to "if you denied it, I'd conclude you were confused/playing a language game wrong." Also connected to "I'd sooner distrust my own doubting."
      *   **Major Views:** Rules view emphasizes this most strongly. Non-Propositional sees hinges as the *conditions* for the game. Basic Beliefs often struggles to explain *why* doubting them is nonsensical rather than just very unlikely.

  3.  **Non-Propositionality (or Quasi-Propositionality):**
      *   **What it must get right:** Hinges do not function like ordinary empirical propositions that are straightforwardly "true" or "false" based on evidence. They are *manifested* in action, practice, and the structure of our language games, not primarily *asserted* or *believed* in the standard way.
      *   **Case:** Moore's paradox: Saying "I know this is a hand" feels odd precisely because it's expressing a hinge. We don't *say* "I know the external world exists" in normal contexts; we *act* as if it does. "The Earth orbits the Sun" functions *as* a hinge *now*; we build satellites and calendars on it without constant verification. But when it was contested, it *was* a proposition within a different framework.
      *   **Case:** Can a hinge be false? If hinges aren't standard propositions, the question "true or false?" might misfire. A *framework* can be *inadequate* (leading to practical failure or inability to cope) without its hinges being "false" in the empirical sense.
      *   **Knockout Power:** This is the **single biggest knockout requirement.** It eliminates most "Basic Beliefs" views and strains some "Rules" views. It's the hardest for common-sense to grasp but crucial for handling mutability and framework clashes non-dogmatically.
      *   **Your Test Links:** Underlies the "confusion/language game" reaction and the inability to argue for it directly.
      *   **Major Views:** Non-Propositional view champions this. Rules view often leans towards it ("rules aren't true/false"). Basic Beliefs view typically rejects it, treating hinges as true propositions.

  4.  **Mutability & Context-Relativity:**
      *   **What it must get right:** What functions as a hinge is not fixed for all time or for all individuals/groups. Hinges can evolve historically, differ culturally, and change for individuals based on development or radical shifts.
      *   **Case:** Earth/Sun migration. For Ptolemaic astronomers, "Earth is stationary" was a hinge. The Copernican claim shattered the framework, forcing a *reconfiguration* of hinges. Once established, Copernicanism *became* a hinge for modern science (backed by evidence, but now *functioning* as a foundation for further inquiry, not constantly re-verified). *Can it go back?* For an *individual* undergoing a radical conversion? Possibly. For a *community*? Only if evidence forces a paradigm shift so profound it rebuilds the framework.
      *   **Case:** Kids & Astrology. Your childhood framework included "Astrology is meaningful" as a hinge (installed by trusted authorities, shaping how you interpreted events). Shifting involved a *gestalt switch* – not refuting one belief, but adopting a *new framework* ("Scientific naturalism") where astrology had no place. The "flip" wasn't an argument, but a change in what counted as a valid explanation. Unreliable installers create frameworks that might be *pragmatically inadequate* more easily.
      *   **Case:** Clashing Communities. Groups with incompatible hinges (e.g., naturalistic science vs. certain fundamentalist religious views) *literally live in different worlds*. Each framework defines rationality, evidence, and doubt internally. There is often *no neutral ground* for non-question-begging adjudication. A theory *must* acknowledge this radical relativity without necessarily endorsing relativism (it can point to pragmatic success or coherence as criteria *within* a framework, but not *between* fundamentally opposed ones).
      *   **Knockout Power:** Strongly challenges views that see hinges as innate, universal, or immutable (naive Basic Beliefs views). Requires explaining change as framework *replacement*, not evidence-based belief revision.
      *   **Major Views:** Rules and Non-Propositional views handle this best (frameworks change). Basic Beliefs views struggle unless they incorporate significant contextual elements.

  **Important, But Potentially Negotiable/Emphasized Differently:**

  5.  **Psychological Certitude (Often, but not Always):**
      *   **What it might get right:** Hinges are often characterized by an *unshakeable* feeling of certainty. We are more willing to doubt our sanity, senses, or understanding than doubt them.
      *   **Case:** Moore's hands evoke this feeling strongly; doubting the screws does not. The feeling is *different* from strong evidential confidence.
      *   **Negotiability:** This is a common *symptom* or *consequence* of the framework role, but arguably not essential. One could imagine (or be trained into) a framework where core hinges are held lightly or pragmatically without deep psychological certainty. Some views (e.g., pragmatic Non-Propositional) downplay this.
      *   **Your Test Links:** Directly to "I'd sooner distrust my own doubting than distrust it."
      *   **Major Views:** Basic Beliefs views prioritize this. Rules/Non-Propositional see it as a typical effect, not the core.

  6.  **Expression in Action/Practice:**
      *   **What it might get right:** Our commitment to hinges is primarily shown in what we *do*, not what we *say*. We act *as if* they are certain.
      *   **Case:** Looking both ways before crossing the street manifests "Cars exist and can hurt me" more fundamentally than stating it.
      *   **Negotiability:** While crucial for Wittgenstein, some theories might focus more on the logical role than the behavioral manifestation. Non-Negotiable for truly Wittgensteinian views.
      *   **Major Views:** Core to Non-Propositional and Rules views. Less central to Basic Beliefs.

  **Potential Conflicts & Your Tests:**

  *   **Non-Justificational Grounding vs. Mutability:** How can something immune to evidence *change*? Resolution: Change isn't driven by *evidence within the old framework*, but by the *collapse* or *inadequacy* of the entire framework in the face of pervasive problems, leading to a *gestalt switch* to a new framework. Evidence plays a role in *causing* the crisis, but not in *directly refuting* the hinge.
  *   **Framework Role (Universality of Function) vs. Mutability/Context-Relativity (Particularity of Content):** How can the *role* be universal (all frameworks need hinges) while the *specifics* vary wildly? Resolution: This is the core tension Wittgenstein explores. A theory must describe *that* this functional role exists and *that* it's filled by contextually specific elements, without requiring a universal set of hinges.
  *   **Your Three Tests:** They are facets of the same core, but can come apart slightly.
      *   "Distrust my doubting" = **Psychological Certitude** (Negotiable).
      *   "Can't argue without assuming equally big" = **Non-Justificational Grounding** (Non-Negotiable).
      *   "Denial implies confusion" = **Framework Role** (Non-Negotiable) + consequence of **Non-Propositionality** (Non-Negotiable).
      *   **The Real Work:** The **Framework Role** and **Non-Propositionality** are doing the deepest philosophical work. The inability to justify is a direct consequence. Psychological certainty is the common subjective experience.

  **The Knockout Requirement & Summary Table:**

  | Requirement              | Non-Negotiable? | Key Case(s)                     | Knocks Out...                          | Rules View             | Basic Beliefs View       | Non-Prop View         |
  | :----------------------- | :-------------- | :------------------------------ | :------------------------------------- | :-------------------- | :----------------------- | :-------------------- |
  | **1. Non-Justificational Grounding** | **Yes**         | Hands vs. City Latitude          | Views treating hinges as "well-justified" | Strong                | Weak (Struggles)         | Strong                |
  | **2. Framework Role**    | **Yes**         | Screws aren't hinges; Denial=Confusion | Views not distinguishing *role*        | **Strongest**         | Weak                     | Strong                |
  | **3. Non-Propositionality** | **Yes**         | Moore's Paradox; Can hinges be false? | **Most views (Especially Basic Beliefs)** | Leans Strong          | **Rejects**              | **Strongest**         |
  | **4. Mutability & Context-Relativity** | **Yes**         | Earth/Sun; Kids/Astrology; Clashing Groups | Universal/Innate views                 | Strong                | Weak (Often Rejects)     | Strong                |
  | **5. Psychological Certitude** | No              | Hands feel different             | Pragmatic views                        | Acknowledges          | **Strongest**            | Downplays             |
  | **6. Expression in Action** | Mostly Yes      | Acting, not just saying          | Overly intellectualist views           | Strong                | Possible                 | **Strongest**         |

  **The Big Takeaway:** The requirement that **knocks out the most otherwise-attractive accounts (especially common-sense or "Basic Beliefs" views) is Non-Propositionality.** If hinges are not standard truth-apt propositions, it forces a radical rethinking of certainty, knowledge, and belief, avoiding the pitfalls of foundationalism and handling framework clashes and historical change more gracefully. This is the hardest pill to swallow but arguably the most Wittgensteinian insight. A satisfying theory must explain how something can be bedrock certain *for a framework* without being an indubitable, universal, empirical truth. It must show how evidence rests *on* these certainties, not vice-versa, and how the entire edifice can still shift over time or differ between groups.
