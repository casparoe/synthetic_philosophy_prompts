  We are designing a 90-minute classroom simulation for high school students on the transition from foraging to farming. The goal is to have students experience the trade-offs and tensions without initially framing it as "was it a mistake?" and to avoid the pitfalls of the previous session.

  Key design elements:
  1. The simulation should have multiple rounds, each representing a generation or a period of time.
  2. Students are divided into small teams (e.g., 3-4 per team, so about 4-6 teams total for 18 students). Each team starts as a foraging group.
  3. The game has two main phases: foraging only, and then the option to farm (with the transition being gradual and having irreversible consequences).
  4. Resources: 
     - Land: Represented by index cards with resource yields. Some land is better for foraging, some for farming.
     - Labor: Each team has a set number of labor points per round (e.g., 10 per team, which can be allocated by team members).
     - Food: Needed to feed the population and allow growth. Stored food can be carried over but is subject to spoilage or raiding.
  5. Mechanics:
     - Foraging: Yields vary by land type (e.g., rich foraging land gives high returns initially, but may deplete). Foraging requires labor and yields food immediately.
     - Farming: Requires initial labor investment (clearing, planting) and then harvesting later. Yields are higher per unit area but require more labor and are subject to risks (drought, pests, raiding). Farming also allows storage (with some loss) and supports larger populations.
     - Population: Each team starts with a base population (e.g., 10 people). If food produced >= population, the group is fed and can grow (by a die roll). If not, they lose population (starvation). Growth is slow in foraging, faster in farming.
     - Raiding: Teams can raid others for stored food (farming groups are more vulnerable because they have stores). This is resolved by dice (with defense possible by allocating labor to guarding).
     - Health and leisure: These are tracked but not as primary goals during play. They will be part of the second ledger.
  6. Scoring during play (visible): 
     - Total calories (food produced) and group size (population) are the main scores. The team with the highest population and total food at the end "wins" the game.
  7. Second ledger (revealed at the end): 
     - Measures: Average leisure time (labor not spent), food variety (foragers have more variety), health (based on diet and crowding), and inequality (if any within the team? or between teams?).
  8. Irreversibility: Once a team adopts farming and their population grows beyond the carrying capacity of foraging, they cannot go back because there isn't enough land to support the population by foraging alone.

  Round-by-round plan (90 minutes total):

  - Introduction (5 min): Explain the setting (prehistoric times, groups of foragers). Explain the goal: to ensure the survival and growth of your group. Explain the resources and basic actions (foraging, and later farming). Do not mention the debate about farming vs. foraging.

  - Setup (5 min): 
     - Divide students into teams of 3-4. Each team gets:
          - A starting population token (10 people).
