prompt: |-
  In my reading group on AI alignment someone keeps saying that RLHF is just social choice, and that Arrow's theorem kills it: if no aggregation rule can have unrestricted domain, Pareto, independence of irrelevant alternatives and non-dictatorship while staying transitive, then there's no such thing as "what humans want" for a model to be aligned to, so we should stop aggregating and just optimise one well-specified objective (or hand the decision to a single principal).

  What I want audited is the analogy underneath that: a group's preferences are like a single person's — the will of the people is like a person's will, and Arrow's conditions are just the axioms of individual rationality scaled up (transitivity as coherence, IIA as menu-independence, Pareto as more-is-better, unrestricted domain as being able to rank anything, non-dictatorship as no one consideration always winning). Give me the correspondence table first, then take it apart: where does the mapping break — IIA surely isn't a rationality condition at all and individuals are themselves menu-dependent, nobody inside a person misreports their own tastes the way voters do strategically, Arrow throws away intensities and interpersonal comparisons that individual decision-making uses, and what would a "dictator" even be inside one agent? Then tell me which of those disanalogies actually carry weight for the conclusion he wants and which are noise.

  Does "there is no coherent thing that humans want" survive, or does Arrow only show that no rule satisfies all those conditions jointly, while leaving plenty of room for rules that behave fine on structured profiles like single-peaked ones? And if group-as-person is the wrong analogy, what's a better one for aggregating a bunch of people's preferences into one training objective? Answer in British English please, and fairly tightly — I'm presenting this tomorow.
reasoning: |-
  Hmm, the user is in an AI alignment reading group and someone keeps arguing that Arrow's theorem kills RLHF because it shows there's no coherent "human preference" to align to. They want me to audit the analogy between group preferences (for RLHF) and individual preferences (for rationality). Specifically, they need a correspondence table showing how Arrow's conditions map to individual rationality axioms, then an analysis of where this mapping breaks down. They also want to know if Arrow truly implies "no coherent human wants," and what better analogy exists for preference aggregation.

  The user needs this for a presentation tomorrow, in British English, and tightly structured. They're clearly time-pressed but intellectually rigorous - this is for an AI alignment group, so they'll want precise philosophical and technical distinctions. The underlying anxiety seems to be: "Is RLHF fundamentally doomed by social choice theory?" 

  First, let's unpack the analogy their colleague proposes. The claim is that Arrow's conditions for group decision-making correspond directly to axioms of individual rationality:
  - Unrestricted domain → ability to rank any options
  - Pareto → more-is-better preference
  - IIA → menu-independent preferences
  - Transitivity → coherent preferences
  - Non-dictatorship → no single factor always dominating

  But this mapping is flawed. Let me build the table first as requested:

  | Arrow's Condition | Alleged Individual Rationality Axiom | Actual Individual Reality |
  |-------------------|---------------------------------------|---------------------------|
  | Unrestricted Domain | Can compare any options | True - minds can rank anything |
  | Pareto Efficiency | "More of what I want is better" | True for coherent preferences |
  | IIA | Menu-independence | *False* - framing effects violate this |
  | Transitivity | Coherence | True as normative ideal |
  | Non-Dictatorship | No single "sub-agent" always wins | *Moot* - no sub-agents "vote" |

  Now the critical disanalogies:
  1. **IIA isn't a rationality axiom**: Kahneman-Tversky showed preferences shift with context (endowment effect, etc.). Individuals violate IIA constantly.
  2. **No strategic misrepresentation**: My "sub-preferences" don't lie to me like voters might. Introspection isn't strategic voting.
  3. **Intensity matters**: Individuals weigh preference strength ("I *really* hate celery"), while Arrow ignores intensities.
  4. **Dictatorship is incoherent**: What's a "dictator" in one mind? Even if System 1 overrides, it's not analogous to voter suppression.
  5. **Aggregation mechanics differ**: Neural integration isn't voting; it's parallel constraint satisfaction with emotional weights.

  Crucially, these disanalogies undermine the conclusion:
  - Arrow's impossibility applies to *voting systems*, not introspection.
  - Saying "no coherent human wants" is like saying "no coherent taste" because you can't aggregate restaurant votes perfectly. Nonsense - individuals *do* have stable preferences, just noisy ones.
  - RLHF doesn't need perfect aggregation - it needs robust proxies. Single-peaked preferences (where everyone agrees on dimensions like "safety") avoid Arrow's problems.

  Better analogies for RLHF:
  - **Medical diagnosis**: Aggregating doctor opinions doesn't require full transitivity.
  - **Statistical estimation**: Preferences are data points; we're fitting a model, not defining social welfare.
  - **Orchestra tuning**: Harmonising many instruments (preferences) into one pitch (objective) - possible with good calibration.

  So no, Arrow doesn't kill RLHF. It just warns against naive voting mechanisms. We can still aggregate preferences meaningfully using methods like:
  - Bradley-Terry models (pairwise comparisons with noise tolerance)
  - Representative sampling (avoiding "voter" strategic behaviour)
  - Explicit trade-off weights (capturing intensity)

  The colleague's argument overreaches. Arrow shows limits of democratic aggregation, not impossibility of preference learning. For tomorrow's presentation, I'll emphasise that individuals *are* coherent (if imperfect) agents, and RLHF's empirical success proves aggregation works pragmatically.
answer: |-
  Right, let's tackle this systematically. Your colleague's argument hinges on an imperfect analogy between Arrow's social choice conditions and axioms of individual rationality. Below is the correspondence table they're invoking, followed by a disassembly of where it breaks—and why Arrow doesn't doom RLHF.

  ### Correspondence Table: Arrow’s Conditions as "Scaled-Up" Individual Rationality
  | Arrow’s Social Choice Condition | Alleged Individual Rationality Axiom | Rationale for Analogy |
  |----------------------------------|--------------------------------------|------------------------|
  | **Unrestricted Domain**          | Ability to rank any options          | A single agent can form preferences over any conceivable choice set. |
  | **Pareto Efficiency**            | "More is better" (monotonicity)      | If an agent prefers A over B, adding A shouldn’t reduce welfare. |
  | **Independence of Irrelevant Alternatives (IIA)** | Menu-independence | A rational agent’s preference between A and B shouldn’t change if option C is added/removed. |
  | **Transitivity**                 | Coherence of preferences             | If A > B and B > C, then A > C—no cycles. |
  | **Non-Dictatorship**             | No single "sub-agent" dominates      | In a unified agent, no one desire (e.g., hunger) always overrules others. |

  ### Where the Analogy Breaks Down
  1. **IIA ≠ Menu-Independence**  
     - **Flaw**: Individuals routinely violate menu-independence (e.g., *decoy effects*: preferring A over B when C is inferior to A but not B). Kahneman-Tversky showed preferences are context-dependent.  
     - **Weight for RLHF**: Heavy. IIA is *not* a rationality axiom—it’s a restrictive *procedural* rule for voting. RLHF uses pairwise comparisons (which *can* violate IIA) without issue. Individuals aren’t "irrational" for context-sensitive preferences; RLHF models this noise.

  2. **No Strategic Misrepresentation**  
     - **Flaw**: In social choice, voters may lie to manipulate outcomes. An individual’s "sub-preferences" (e.g., hunger vs. health) don’t "misreport"—they conflict, but honestly. Neural processes aren’t strategic agents.  
     - **Weight for RLHF**: Critical. RLHF datasets (e.g., human rankings) *can* suffer from strategic voting, but individual preference elicitation (e.g., user feedback) does not. This is a problem of *group dynamics*, not alignment.

  3. **Intensities and Interpersonal Comparisons**  
     - **Flaw**: Arrow ignores preference *strength* (e.g., "I *strongly* prefer A over B") and interpersonal comparisons. Individuals *do* weigh intensities (e.g., agony vs. pleasure). RLHF can capture intensities via probabilistic choice models (e.g., Bradley-Terry).  
     - **Weight for RLHF**: Significant. Arrow’s theorem applies to ordinal rankings only—RLHF uses richer data (e.g., scores, ties) or can infer intensities statistically.

  4. **"Dictatorship" in an Individual is Nonsensical**  
     - **Flaw**: A "dictator" in Arrow’s theorem is a single voter overriding others. An individual has no "voters"—conflicting desires aren’t suppressed like ballot fraud; they’re integrated (e.g., via dopamine weighting).  
     - **Weight for RLHF**: Minor. The disanalogy here highlights that group aggregation ≠ cognitive unity, but RLHF doesn’t require literal "dictators."

  ### Does Arrow Prove "No Coherent Human Wants"?
  **No.** Arrow shows *no aggregation rule* satisfies all four conditions simultaneously for *all* preference profiles. It **does not** imply preferences are incoherent. Crucially:
  - **Structured Preferences Save the Day**: With single-peaked preferences (e.g., humans agree on dimensions like "helpfulness"), majority rules *are* transitive and IIA-compliant. RLHF operates on constrained domains (e.g., "harmless" vs. "harmful" responses), not arbitrary options.  
  - **RLHF Isn’t Voting**: It’s *statistical preference learning*—fitting a model to noisy data, not defining a social welfare function. Imperfect aggregation ≠ impossibility.  
  - **Pragmatic Success**: RLHF works empirically (e.g., ChatGPT). If preferences were truly incoherent, fine-tuning wouldn’t converge.

  ### A Better Analogy: Aggregation as Statistical Estimation
  Forget "group-as-person." Think of aggregating human preferences **like averaging noisy sensor readings**:
  - **Input**: Human judgments (preferences) as "measurements" with error.
  - **Output**: A "signal" (training objective) extracted via robust methods (e.g., max likelihood, pairwise comparison models).
  - **Why it fits RLHF**:  
    - Handles noise and conflict without requiring Arrow’s conditions.  
    - Allows intensities (e.g., scaling losses by confidence).  
    - Works with partial data (e.g., sparse comparisons).

  ### Conclusion for Your Presentation
  Arrow’s theorem is irrelevant to RLHF’s viability. The "group-as-person" analogy fails because:
  - IIA isn’t a rationality axiom (individuals *are* menu-dependent).  
  - Preference aggregation in RLHF is empirical learning, not voting.  
  - Structured domains (e.g., bounded AI behaviours) avoid Arrow’s worst cases.  

  **Your takeaway**: Arrow highlights *procedural* limits in social voting, not metaphysical incoherence of human preferences. RLHF sidesteps this by using statistical methods on constrained choice sets—optimising for "what humans want" is messy but feasible. Quote: "Arrow doesn’t kill RLHF; it just warns against naive aggregation. We’re not building a democracy—we’re curve-fitting."
