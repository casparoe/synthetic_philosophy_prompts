prompt: |-
  Trying to work out what I actually think about whether you can pick up aesthetic knowledge second-hand — from someone telling you a thing is beautiful or moving or badly made. Going case by case on gut feel, then I want the principle, if there is one.

  1. Priya and I have agreed about basically every novel we've both read. She says a new one is beautifully written. I read it, I agree with her. I know it's beautifully written. Obviously fine.

  2. Same Priya, same confidence, different novel, I haven't read it. I'd bet money on it, I'd recommend it to people, I'd put it on a syllabus. But if someone asked me do you *know* it's beautifully written, I want to say no — I'd say Priya says so and she's never once been wrong about this. That feels different from 1 even though my actual confidence is about the same in both.

  3. A critic I trust says a sequel is a lazy retread, phoned in, embarrassing. I never see it. I'm totally comfortable saying I know it's bad.

  4. Same critic, same paper, same level of confidence, says a different film is a triumph. I'm *not* comfortable saying I know it's great until I've seen it myself. I've tryed to talk myself out of the asymmetry between 3 and 4 and I can't, and it bugs me, because the epistemic situation looks identical.

  5. My brother says the flat he viewed stank of cat piss. Assuming he's honest, I know it stank. That's also a you-had-to-be-there property, so it's not just about experience-dependence in general.

  6. My wife says durian tastes like onion custard. I've never eaten it. I feel like I learned something real, and also like I didn't — I still don't know what onion custard tastes like *to her*. Genuinely torn.

  7. A musicologist whose taste I don't especially trust says a piece is structurally masterful and explains what the counterpoint is doing. I think I can know *that* from her telling me. Then she says, so it's a great piece, and I'm back to not knowing. The descriptive half seems to transmit and the verdict doesn't.

  8. Everyone says a painting is a masterpiece — hundreds of people whose judgment I've got independent reason to respect. I stand in front of it for twenty minutes and see mud. I'm inclined to say the problem is me. If it had been one friend saying that, I'd have shrugged and said not my thing. So numbers seem to matter, which smells like inconsistency on my part.

  9. The one I keep going back and forth on: I can't tell two red wines apart, anosmic to that whole class of thing. A friend whose palate I trust says a particular wine is extraordinary. I taste it and get nothing at all. Do I know the wine is extraordinary? I lean yes, but that sits badly with 2, and I can't say why it should be different.

  10. Separately: a friend who knows my taste says you'll love this film. Different kind of claim, isn't it — about me, not about the film. I don't know where it slots in.

  My tentative principle is the boring one — you only know an aesthetic property by encountering the thing yourself — and you can see it's already sprouting exceptions: except negative verdicts (3), except properties I can't access anyway (9), except the descriptive sub-claims (7), except when enough people say so (8). That's a list wearing a principle's clothes.

  So: give me a principle, or two or three candidates, stated precisely enough that I could apply it cold to a new case, and say which of my cases motivates each clause. Tell me which of my verdicts it can't accommodate and which one you think I should give up. Give me its verdict on a couple of cases I haven't listed — I'd especially like the moral parallel, since I feel like I *do* pick up moral knowledge by deferring to someone I trust, and also like I'm being a bit of a coward when I do, and I can't tell whether your account should treat that the same as the aesthetic cases or not.

  Last thing: tell me where your own answer is most likely to be wrong. Which case, or which argument, would actually move you to a different principle — not 'reasonable people disagree' but the specific thing that would make you switch.
reasoning: |-
  Okay, the user is grappling with whether aesthetic knowledge can be acquired second-hand. They've presented ten cases to test their intuition and are looking for a principle that explains the patterns and exceptions. Let me start by understanding each case and the underlying themes.

  First, cases 1 and 2 show that direct experience makes a difference. In case 1, after reading the novel, they know it's beautiful, but in case 2, without reading, they feel they don't truly know, even with high confidence. That suggests that personal engagement is crucial for positive aesthetic claims.

  Cases 3 and 4 highlight an asymmetry. They accept a negative verdict (the film is bad) without seeing it but hesitate on a positive one (the film is great). Why the difference? Maybe negative claims are easier to trust because flaws might be more objective or because avoiding bad experiences is less risky. The user is bugged by this inconsistency.

  Case 5 and 6 deal with sensory properties. They accept the flat smells like cat piss based on testimony but are torn on durian tasting like onion custard. The difference might be that smell is more straightforward, while taste involves personal, subjective experience. The durian case also touches on knowing the description versus understanding the qualia.

  Case 7 separates descriptive facts from evaluative judgments. The user accepts the structural analysis from the musicologist but not the verdict that the piece is great. This indicates that factual, objective aspects can be transmitted second-hand, but value judgments require personal experience.

  Case 8 shows numbers matter. With consensus from trusted sources, they defer to the majority even if their own experience doesn't match. This contrasts with a single friend's opinion, which they might dismiss. Social validation plays a role here, which complicates the principle of personal encounter.

  Case 9 is tricky. They trust their friend's judgment on wine quality despite being anosmic. They lean towards accepting the knowledge, which conflicts with case 2. This might be because the friend's expertise compensates for their sensory lack, making it similar to relying on an instrument.

  Case 10 shifts to a claim about the user's own taste. The friend predicts they'll love a film, which is about personal preference rather than the film's intrinsic qualities. This is a different kind of knowledge, possibly easier to accept because it's tailored to them.

  The user's tentative principle—that aesthetic knowledge requires personal encounter—has exceptions. They need a framework that explains when testimony works and when it doesn't. 

  Possible principles:
  1. **Access Limitation Principle**: Testimony can give knowledge if the property is verifiable or the recipient lacks access. Negative claims (case 3) might be easier to verify indirectly, while positives (case 4) need direct experience. Case 9 fits because the user can't access the properties, so testimony bridges the gap.
     
  2. **Social Validation Principle**: Consensus among trusted experts can override personal experience (case 8), but individual testimony might not (case 2). Numbers add reliability.

  3. **Descriptive/Evaluative Split**: Descriptive aspects (case 7) are transmissible; evaluative ones aren't. This explains why the musicologist's structural analysis is accepted but not the greatness claim.

  Applying these to the cases: Case 6 (durian) is tricky. The description "onion custard" is descriptive, so under the split, they know the comparison but not the subjective experience. That aligns with their torn feeling. 

  Moral knowledge comparison: They feel moral knowledge can be second-hand, unlike aesthetic. But why? Morality often involves principles that can be taught, while aesthetics is more experiential. However, some moral situations might require personal understanding (e.g., experiencing injustice). The principles above might apply similarly if moral claims are seen as descriptive (objective wrongs) versus evaluative (subjective judgments).

  New case: A trusted friend says a dish is delicious. If the user hasn't tasted it, do they know? Under access limitation, if they can taste it but haven't, they don't truly know. If they can't (allergy), then testimony might suffice. 

  Where might the principles fail? Case 9 (wine) and case 2 (novel) conflict. If expertise compensates for lack of access in wine, why not for the novel? Perhaps because in wine, the user's inability is permanent, making testimony necessary, whereas with the novel, they could read it. That refines the Access Principle: testimony works when direct access is impossible or impractical. 

  The user might need to adjust case 2: if they can't read the novel (e.g., it's destroyed), then trusting Priya could count as knowledge. But since they can read it, testimony only gives justified belief, not knowledge. 

  In conclusion, the Access Limitation Principle combined with the Descriptive/Evaluative Split covers most cases. The asymmetry in 3/4 is because negative claims are often easier to verify (e.g., flaws are detectable by others) or carry different epistemic weight. Case 8's consensus works through social validation, which might be a separate principle or an extension of access limitation when individual judgment is unreliable.
answer: |-
  Here's a precise principle to handle your cases, motivated by the asymmetries you observe. It addresses why *some* aesthetic knowledge transfers via testimony while core evaluative judgments typically require direct encounter. I'll state it, break it down clause-by-clause with your cases, identify tensions, apply it to new cases (including moral ones), and flag its weakest point.

  ---

  ### **The Principle: Aesthetic Testimony Transfer (ATT)**
  **You can acquire aesthetic knowledge second-hand via testimony *if and only if* either:**
  1. **The claim is descriptive** (e.g., structural features, comparisons, sensory reports), not purely evaluative;  
  2. **The claim is negative** (identifying flaws or absence of merit);  
  3. **You lack the capacity for direct access** to the relevant aesthetic properties;  
  4. **There is robust consensus** among relevant experts whose judgment aligns with your aesthetic framework.  

  **Otherwise, testimony provides only justification for belief, not knowledge of positive evaluative aesthetic properties (e.g., beauty, greatness).**

  ---

  ### **Clause-by-Clause Motivation from Your Cases**
  - **Clause 1 (Descriptive Claims):**  
    - Explains why you learn *something* in **Case 6** ("durian tastes like onion custard")—this is a descriptive comparison, not "durian is delicious."  
    - Explains **Case 7**: You know the *structural facts* from the musicologist, but not that the piece is "great."  
    - **Case 5** fits: "Smells of cat piss" is descriptive, not evaluative (even if evaluative implications follow).  

  - **Clause 2 (Negative Claims):**  
    - Explains the **3/4 asymmetry**: You accept knowledge of the film's badness (**Case 3**) but not its greatness (**Case 4**). Negative judgments often rely on identifiable flaws (e.g., laziness), which testimony can reliably report. Positive judgments require experiencing holistic integration, which resists proxy access.  
    - **Case 1 vs. 2**: You know the novel is beautiful *after* reading it (direct access), but not before—even with Priya's reliability.  

  - **Clause 3 (Lack of Capacity):**  
    - Explains **Case 9** (anosmia to wine): You *can* know the wine is extraordinary via testimony because you’re incapable of accessing its properties directly. Contrast with **Case 2**, where you *could* read the novel.  
    - Clarifies **Case 6**: You know *that* durian tastes like onion custard (description), but not *what that experience is like* for your wife (qualia require direct access).  

  - **Clause 4 (Robust Consensus):**  
    - Explains **Case 8**: Hundreds of trusted experts override your direct experience ("mud") because consensus signals objective features you might have missed. A single friend’s opinion wouldn’t suffice.  

  ---

  ### **Verdicts on Your Cases & Tensions**
  | Case | ATT Verdict | Tension with Your Intuition? |  
  |------|-------------|-----------------------------|  
  | 1    | ✅ Knowledge (direct access) | None |  
  | 2    | ❌ Knowledge (positive evaluative; no access) | Conflicts with your "same confidence" observation—ATT says confidence ≠ knowledge here |  
  | 3    | ✅ Knowledge (negative claim) | None |  
  | 4    | ❌ Knowledge (positive evaluative; no access) | None |  
  | 5    | ✅ Knowledge (descriptive claim) | None |  
  | 6    | ✅ Descriptive knowledge; ❌ Qualia knowledge | Accommodates your "torn" feeling |  
  | 7    | ✅ Structural knowledge; ❌ "Greatness" knowledge | None |  
  | 8    | ✅ Knowledge (consensus overrides direct experience) | None |  
  | 9    | ✅ Knowledge (lack of capacity) | Conflicts with Case 2—ATT distinguishes incapacity (9) from mere inaction (2) |  
  | 10   | **Not aesthetic knowledge** (prediction about *your* taste) | N/A—this is psychological, not aesthetic |  

  **Tensions to Resolve:**  
  - **Give up your Case 2 intuition.** Confidence ≠ knowledge for positive aesthetic properties. Testimony here gives *justified true belief* (if Priya is right), but not knowledge—because you *could* experience it and aesthetic judgment requires first-personal engagement.  
  - **Case 9 is correct to accept knowledge.** Your anosmia makes testimony your only access route, akin to trusting a spectrometer for UV light.  

  ---

  ### **New Cases & Moral Parallels**  
  **New Aesthetic Cases:**  
  - **A:** A sommelier you trust says a wine has "notes of blackberry and tobacco." You taste it and detect only alcohol.  
    - *ATT Verdict:* ✅ Knowledge (descriptive claim). You might lack discernment, but the claim is testable in principle.  
  - **B:** Your architect friend says a building’s proportions create sublime harmony. You visit and feel nothing.  
    - *ATT Verdict:* ❌ Knowledge (positive evaluative). Consensus or your incapacity would be needed.  

  **Moral Cases (Parallel Challenge):**  
  - **C:** A trusted friend says, "Lying to protect feelings is wrong." You’ve never faced this dilemma.  
    - *ATT Analogy:* If morality is experiential (like aesthetics), ❌ knowledge—you need to "grasp" the wrongness. But if morality is principle-based (e.g., Kantian), ✅ knowledge.  
  - **D:** A Holocaust survivor says, "Auschwitz was evil." You weren’t there.  
    - *ATT Analogy:* ✅ Knowledge (consensus + descriptive horror). Like **Case 3**, negative moral claims transmit more easily.  

  **Moral vs. Aesthetic Difference:**  
  ATT *can* apply to morality if you treat it as experiential (e.g., virtue ethics). But if morality is fact-based (e.g., "torture causes suffering"), testimony suffices. Your "cowardice" feeling arises when deferring on *experiential* moral claims (e.g., "you must feel outrage"). Aesthetic knowledge is *always* experiential—hence stronger limits.  

  ---

  ### **Where ATT Is Most Likely Wrong: Case 8**  
  **Weakness:** Robust consensus (**Clause 4**) risks collapsing into relativism. If experts override your direct experience, is aesthetic knowledge just "what experts say"? This clashes with ATT’s core insistence on first-personal engagement for positive judgments.  

  **What Would Make Me Switch Principles:**  
  If you showed me that in **Case 8**, your "mud" perception was *incontestably* accurate (e.g., the painting was a forgery experts missed), ATT’s **Clause 4** would falsely validate false knowledge. I’d switch to a stricter principle: **Testimony never provides positive aesthetic knowledge—only justification.** This would force you to reject knowledge in **Case 9** (anosmia) and **Case 8** (consensus), treating them like **Case 2**.  

  **Why I Resist Switching Now:**  
  **Case 9** feels like legitimate knowledge (like trusting a blind person’s guide to colors). Surrendering this would make aesthetics overly skeptical. But **Case 8** is ATT’s Achilles’ heel—if you find consensus unreliable in aesthetic revolutions (e.g., experts rejecting Impressionism initially), ATT fails.  

  ---  
  **Summary:** ATT explains your cases by limiting testimony to descriptors, negatives, incapacity, or consensus. It asks you to surrender knowledge in **Case 2** and accept asymmetry in **3/4**. Its vulnerability is treating consensus as a knowledge source (**Case 8**)—if that collapses, aesthetics becomes radically first-personal.
