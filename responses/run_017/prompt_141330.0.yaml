prompt: |-
  I spent most of last night arguing with a friend about the 2006 International Astronomical Union decision in Prague, and I need a third party. The facts, so you don't have to rely on memory: Pluto was found in 1930 and was counted as the ninth planet for decades, though its mass turned out to be tiny; from the 1990s on, astronomers found more and more Kuiper Belt objects, and in 2005 Eris turned up, comparable to Pluto in size and mass. A 19-member IAU committee chaired by Iwan Williams had offered three candidate definitions — cultural (roughly, a planet is whatever enough people call one), structural (big enough to be rounded by its own gravity), and dynamical (big enough to have swept other bodies out of its orbital region). A separate committee chaired by Owen Gingerich produced a draft that would have kept Pluto a planet and treated bodies like it as a subcategory; it was voted down. What passed requires a body to orbit the Sun, be rounded by self-gravity, and have cleared its orbital neighbourhood — which Pluto fails, so it became a dwarf planet. Many planetary scientists rejected the outcome outright and still work with a geophysical definition instead. New Horizons flew past Pluto in July 2015 and returned images of a geologically complicated world, which did nothing to settle the argument.

  My friend is a deflationist about truth and thinks the case is a triumph for her view. Her claim: if the equivalence schema is all there is to truth, then nothing in 2006 was discovered about Pluto at all — the only question was which sentence the community should adopt — so the episode was a verbal dispute wearing the costume of an empirical one, and deflationism is precisely what lets us see that. I said that a theory whose only contribution is to reclassify a practice's central disputes as merely verbal is confessing, not explaining. I also pressed her on a case she couldn't handle: an astronomer says 'Pluto is a planet' in 1995, and says it again in 2008. Same speaker, same object, same non-linguistic facts, and yet something about the truth of what he says seems to have shifted. She said that just shows truth isn't the interesting notion here; I said that's the sound of a theory retiring from the field.

  So I want a proper two-way case analysis, not a survey of positions. First, a disciplined mapping: who the actors were (the committees, the IAU membership that voted, the planetary scientists who dissented, the textbook writers and planetarium curators and schoolchildren), what the actual options were, and what counted as evidence for each — orbital dynamics, mass and shape, population counts, pedagogical and cultural considerations. Then run the theory through it. Assume I already know the standard moves and vocabulary — disquotationalism, Horwich-style minimalism, prosententialism, blind ascription, the scope problem, the appeal to truth's expressive role, the norm-of-assertion and aim-of-belief objections — and don't recite them at me; deploy them. Specifically: (a) Say what you think about the 1995/2008 ascription, and what your answer costs. If the schema has to be relativized to times, speakers, or meanings to give an answer, does that relativization quietly reintroduce the substantive machinery about propositions, interpretation, and meaning that deflationism was supposed to make unnecessary — the kind of objection associated with Hartry Field, that thinness about truth is bought by paying for it in the theory of meaning — or is that just an honest division of labour between two theories? Take a side. (b) Consider the cultural candidate definition, on which a planet is a planet if enough people say it is. Had something like that been adopted, would the deflationist be committed to saying that the truth of 'Pluto is a planet' is constituted by a social fact, and is that a collapse into a consensus theory or only an apparent one? (c) Deal with the ascriptions that no amount of disquotation reaches — that what the 1995 textbook said was true, that everything the resolution implies about Pluto is true, that my childhood belief about the ninth planet turned out to be false. Say whether the expressive function deflationists invoke really covers them, or whether these ascriptions are doing explanatory work in the episode that a thin notion of truth cannot do. (d) Here is a distinction I invented in the argument and want tested rather than indulged: I called it a charter dispute — the parties agree on every non-linguistic fact, but the resolution fixes which concept an institution will charter, and in doing so changes what is true. Say whether deflationism can mark that distinction, or whether it must dissolve it, and whether dissolving it is a cost. Finish by telling me honestly whether the episode confirms deflationism, is an anomaly for it, or is a case it never anticipated — and, equally honestly, where the theory is simply silent and you refuse to make it speak.
reasoning: |-
  Okay, let me try to unpack this user's query. They had a heated debate with a friend about Pluto's planetary status and the IAU's 2006 decision, focusing on deflationism about truth. The user wants a thorough analysis, not just a recap of positions. 

  First, I need to map the actors and their positions accurately. The IAU committees had different proposals: Williams' committee offered three definitions (cultural, structural, dynamical), while Gingerich's draft tried to keep Pluto as a planet with a subcategory. The voting members chose the dynamical definition, leading to Pluto's reclassification. Planetary scientists dissented, favoring a geophysical definition. Textbook writers and educators followed the IAU, causing a shift in what's taught. 

  The user's friend argues the dispute is merely verbal, fitting deflationism where truth is just disquotation. The user counters that the 1995 vs 2008 "Pluto is a planet" statements show a real change in truth value despite identical non-linguistic facts. 

  For part (a), the 1995/2008 ascription: under deflationism, the truth value change stems from meaning shifts. But this pushes the problem to the theory of meaning, risking a Field-style objection. If deflationism offloads the work to meaning, it may not be as thin as claimed. 

  Part (b) on the cultural definition: if adopted, "Pluto is a planet" would be true by social fact. Deflationism would disquote this, but the consensus is what grounds the truth, making it resemble a consensus theory. 

  Part (c) handles tricky ascriptions like "my childhood belief was false." Deflationism can express this via disquotation, but doesn't explain why the belief failed—it lacks explanatory depth. 

  Part (d) on charter disputes: here, non-linguistic facts don't change, but institutional decisions alter truth values. Deflationism struggles to distinguish this from mere meaning shifts, potentially dissolving a meaningful distinction. 

  Finally, the episode challenges deflationism by revealing cases where truth depends on institutional charters, not just meanings. Deflationism remains silent on why such disputes feel substantive, making it an anomaly. The user likely wants confirmation that their intuition about the dispute's substance is valid, against their friend's deflationist take. They need a balanced analysis that acknowledges deflationism's limits here.
answer: |-
  Here is a rigorous case analysis of the Pluto controversy through the lens of deflationism, addressing your specific demands:

  ### **1. Actor/Position Mapping & Evidence**
  - **Iwan Williams Committee**: Proposed definitions based on **cultural salience** (evidence: public perception, historical usage), **geophysical structure** (evidence: hydrostatic equilibrium observations), or **dynamical dominance** (evidence: orbital clearance metrics).  
  - **Owen Gingerich Committee**: Advocated a hierarchical "planet" definition with subcategories. Evidence: Scientific utility of grouping geophysically similar bodies (e.g., Pluto/Ceres/Eris as "icy dwarf planets"), New Horizons data showing complexity.  
  - **IAU Voting Members**: Prioritized **dynamical criteria**. Evidence: Population statistics of KBOs, orbital simulations showing Pluto's overlapping path with Neptune/resonant objects.  
  - **Dissenting Planetary Scientists**: Rejected IAU vote, favoring **geophysical definition**. Evidence: Mass/shape data proving roundness, geological activity (cryovolcanism, tectonics from New Horizons).  
  - **Cultural Actors (Teachers, Museums)**: Adopted IAU definition post-2006. Evidence: Pedagogical need for consistency, textbook standardization.  

  **Key Evidence Types**:  
  - Orbital dynamics (Kuiper Belt census, resonance charts)  
  - Geophysical data (radius, mass, shape modeling, surface features)  
  - Social/cultural traction (historical usage, public engagement)  

  ---

  ### **2. Deflationist Analysis**  
  #### **(a) The 1995/2008 Ascription**  
  - **Deflationist Answer**: The utterance "Pluto is a planet" in 1995 was true (disquotationally) because it reflected the linguistic norms of astronomy at *t₁*. In 2008, identical words expressed a different proposition (due to meaning shift) and were false.  
  - **Cost**: This **relies entirely on a substantive theory of meaning**. Field’s objection holds: Deflationism outsources the heavy lifting to semantics, requiring an account of *how and why* "planet" shifted meaning. The "division of labor" is asymmetrical—truth is thin only because meaning bears the explanatory load. If meaning is determined by use (e.g., IAU’s institutional authority), deflationism tacitly endorses a form of semantic externalism.  
  - **Verdict**: Deflationism *can* answer but at the cost of exposing its dependence on non-deflationist machinery.  

  #### **(b) Cultural Definition & Truth-Constitution**  
  - Had the cultural definition won, "Pluto is a planet" would be true iff a social consensus existed. The deflationist disquotes:  
    - *"Pluto is a planet" is true iff Pluto is a planet* (schema)  
    - *Pluto is a planet iff society accepts it as such* (cultural definition)  
  - **Collapse Risk**: This **mimics a consensus theory** but doesn’t *constitute* truth socially. Truth remains disquotational; the consensus merely fixes the extension of "planet." However, it *appears* consensus-driven because the schema defers to the definition’s biconditional.  
  - **Key Distinction**: Deflationism avoids *ontological* commitment (truth isn’t *made by* consensus) but accepts *semantic* relativity (truth-conditions depend on linguistic conventions).  

  #### **(c) Unreachable Ascriptions & Expressive Role**  
  Consider:  
  - *"The 1995 textbook’s claim about Pluto was true."*  
  - *"My childhood belief was false."*  
  - Deflationism handles these via **prosentences** or **quantification**:  
    - *"The 1995 claim was true"* ≈ *"There exists a proposition *p* such that *p* was claimed in 1995, and *p*."*  
    - *"My belief was false"* ≈ *"I believed that *Pluto is a planet*, and it is not the case that Pluto is a planet."*  
  - **Explanatory Gap**: Deflationism expresses these claims but **cannot explain *why* the belief/textbook failed**. It lacks resources to articulate that the 1995 belief was *warranted but inaccurate* due to conceptual change—this requires a substantive theory of justification/reference. The expressive role suffices for assertion, not epistemology.  

  #### **(d) Charter Disputes: Distinction or Dissolution?**  
  - **Your Distinction**: A charter dispute fixes institutional concepts (e.g., IAU defining "planet") without altering non-linguistic facts. Truth-value changes are *conventional*, not empirical.  
  - **Deflationist Response**: It **dissolves the distinction** by reducing it to meaning variance. The IAU vote changed the semantic rules for "planet," so "Pluto is a planet" expressed different propositions pre- and post-2006. No metaphysical event occurred; only linguistic norms shifted.  
  - **Cost**: This ignores the *institutional power* behind charters. The IAU’s authority made the definition *prescriptive* for astronomy, altering assertibility conditions globally. Deflationism cannot explain why IAU’s vote—unlike a lone astronomer’s redefinition—*mattered*.  

  ---

  ### **3. Final Assessment**  
  - **Confirmation or Anomaly?** The episode is **an anomaly** for deflationism. While it handles simple ascriptions (e.g., "Pluto isn’t a planet" in 2008), it stumbles on:  
    - **Temporal truth-value shifts** without empirical change (exposes reliance on meaning).  
    - **Institutional authority** shaping truth-conditions (unexplained by disquotation).  
  - **Where Deflationism is Silent**:  
    - Why the dispute *felt* substantive despite semantic underpinnings.  
    - How scientific institutions acquire truth-governing power.  
    - Why Pluto’s geophysics (e.g., atmosphere, geology) *shouldn’t* override dynamical criteria.  
  - **Honest Verdict**: Deflationism **retires from the field** precisely where the dispute becomes interesting: explaining the interplay between language, institutions, and world. It correctly diagnoses the verbal element but cannot account for why such disputes arise, resolve, or matter. Your intuition holds: a theory that reclassifies core scientific debates as "merely verbal" confesses its inadequacy for domains where concepts are contested and institutional.  

  **Bottom Line**: Deflationism survives the case but emerges diminished—its thinness is a liability, not a virtue, when truth depends on more than disquotation.
