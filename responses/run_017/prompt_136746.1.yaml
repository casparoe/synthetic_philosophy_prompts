answer: |-
  Here’s a tight, performable 3-minute bit that nails your specifications. Characters: **ALEX** (the Moore enthusiast), **SAM** (their increasingly confused friend), **TAYLOR** (skeptical observer).

  **SETTING:** A philosophy department common room, snacks on a table.  
  **(ALEX paces excitedly. SAM sips wine. TAYLOR watches.)**

  **TAYLOR:** Alright, Alex, explain this party game again. “Isolation”? Sounds bleak.  
  **ALEX:** It’s brilliant! You justify your weekend plans by asking: *"Would this still be good if it existed utterly alone in the universe?"* Pure G.E. Moore!  
  **SAM:** Like… going to karaoke? Alone in the void? Just me screaming “Bohemian Rhapsody” into absolute nothingness?  
  **ALEX:** Exactly! And?  
  **SAM:** …That sounds horrific.  
  **ALEX:** *(Triumphant)* There! Not intrinsically good! Moore would agree. Try something else.  

  **TAYLOR:** Hiking? Fresh air, scenery…  
  **ALEX:** Isolate it! Just the *existence* of a mountain? No consciousness of it? Moore says that’s worthless. *Zero* intrinsic value.  

  **SAM:** Okay… seeing that Monet exhibit?  
  **ALEX:** Getting warmer! But isolate it. The painting alone in the void? Worthless. What matters is *your consciousness* of its beauty. *That* is good-in-itself! Top tier!  

  **SAM:** Right… so my *actual* plan? Dinner with Maya tomorrow.  
  **ALEX:** Ah! Personal affections! Moore’s *other* supreme good! Apply the test. *Isolate the friendship.*  

  **(ALEX closes eyes, deep in thought. SAM and TAYLOR exchange looks.)**

  **ALEX:** …Okay. Picture it. Utter void. No universe. Just… *friendship.*  
  **SAM:** Just our friendship? Me and Maya floating…?  
  **ALEX:** No! That’s the key! You *can’t* picture Maya *herself* there isolated! Moore’s test forces us to isolate the *experience*, the *state of mind*. What survives isolation? Only…  
  *(Alex’s eyes snap open, a look of dawning horror)*  
  **ALEX:** …Only the *consciousness* of Maya. *My* pleasant consciousness of her.  

  **SAM:** Wait… so Maya *herself* vanishes? It’s just… you thinking about her?  
  **ALEX:** *(Distraught, pacing faster)* Exactly! The intrinsic value lies purely in *my appreciation*. And the appreciation of beauty lies purely in *my consciousness of it*… Oh no.  

  **TAYLOR:** Oh no what?  
  **ALEX:** They collapse! The two great goods! Personal affection? It’s just… a *kind* of aesthetic appreciation! Loving Maya reduces to… enjoying the *beautiful object* that is Maya! It’s all just… *looking!*  

  **SAM:** That can’t be right. Maya’s not a painting!  
  **ALEX:** *(Wheeling on SAM, intense)* But isolate it! The *value* is in the consciousness! What else *is* there? The *existence* of Maya alone? Worthless! Like the unobserved mountain! It’s the *appreciation* that matters!  

  **(Sam shifts uncomfortably. Alex stares at Sam with sudden, unsettling intensity.)**

  **ALEX:** *(Slowly, with deep focus)* …Just like the Monet. The *consciousness*...  
  **SAM:** Alex… why are you staring at me like that?  
  **ALEX:** *(Not breaking intense eye contact)* Applying Moore consistently. Valuing the consciousness… appreciating the… *object*...  
  **SAM:** I’m not an object! Stop it!  
  **TAYLOR:** So… loving your friend is the same as staring lovingly at a painting?  

  **ALEX:** *(Still staring fixedly at SAM, voice strained with philosophical despair)* **Not *quite*… because Moore has the doctrine of organic unities! A whole containing consciousness *and* the object might be worth more than either alone! But I can’t *isolate* why! All I can *see* right now… is that Sam has a very aesthetically pleasing nose.**  

  **(Sam recoils, covering their nose. Taylor facepalms. Alex remains frozen, staring.)**

  **BLACKOUT**

  **Why this works for your specs:**

  1.  **The Collapse is Central:** The entire punchline hinges on Alex's horrified realization that the isolation test dissolves friendship into a form of aesthetic appreciation ("It’s all just… *looking!*") and their subsequent, absurd behavior (the intense stare).
  2.  **Moorean Machinery in Action:**
      *   **Isolation Test:** Explicitly stated and applied multiple times (karaoke, hiking, mountain, painting, friendship).
      *   **Consciousness over Existence:** Clearly articulated regarding the mountain and the painting, then crucially applied to the *friend* ("Maya *herself* vanishes?" / "The *existence* of Maya alone? Worthless!").
      *   **Ranking Goods:** Mentioned ("Top tier!", "Moore’s *other* supreme good!"), and the collapse of the two into one is the core joke.
      *   **Organic Unities:** Used *specifically* as the failed escape hatch Alex grasps at ("A whole containing consciousness *and* the object might be worth more"), highlighting its inability to resolve the isolation-induced collapse *in that moment*. It leaves the tension ("But I can’t *isolate* why!").
  3.  **The Wrinkle Executed:** The game forces the isolation test onto friendship. Alex realizes the test leaves only the *consciousness* of the friend, collapsing affection into appreciation. The punchline (the intense stare + the nose comment) is the absurd behavioral consequence of this collapse.
  4.  **Accessible & Specific:** The game setup is clear without philosophy jargon. The humor for non-Mooreans comes from Alex's escalating intensity, the bleakness of the game, and the creepy stare. Mooreans get the extra layer of precise philosophical absurdity. No winking at obscurity.
  5.  **Performable & Collegiate:** Three clear characters, physical comedy potential (Alex's pacing/panic, Sam's discomfort, Taylor's reactions, the final stare). Humor stems from philosophical rigor leading to social absurdity, not mocking nerds or relationships. No resolution – Alex is trapped staring, philosophically and socially stuck.
  6.  **The Punchline Lands:** The final line ("Sam has a very aesthetically pleasing nose") crystallizes the collapse (friendship reduced to aesthetic appreciation) and creates the awkward behavioral consequence, while the mention of organic unities shows Alex knows it's inadequate *right now*. It's both funny and philosophically sharp for those in the know.

  This bit delivers the uncomfortable, precise, philosophy-driven laugh you're after. Break a leg with the show!
