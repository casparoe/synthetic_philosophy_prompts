prompt: |-
  I am a retired physical chemist who has lately been attending, as a paying guest, a reading group on the philosophy of language run by the local university's continuing-education programme. We have been working slowly through the mid-century lectures on performative utterance, and at our last meeting two members of the group — I shall call them Miriam and Douglas — became entangled in a case of Miriam's own devising. In my own subject one was trained to ask which variable a result actually depends on; I suspect that something of that sort is at issue here, but I cannot locate it, and the group adjourned with nobody willing to referee.

  The case. A department chair, speaking at a public lecture in honour of a retiring colleague, turns to a research fellow in front of the whole audience and says: I promise you the department will renew your contract. Renewals are in fact decided by a college committee, which had already, in closed session, voted against this renewal; the chair knew that. The contract was not renewed.

  The exchange, as nearly as I can reproduce it:

  1. Miriam. No promise was made, and therefore none was broken. For an utterance in the first person present indicative to be the doing of something rather than merely the saying of something, there must be an accepted conventional procedure, and the speaker must be the appropriate person, in the appropriate circumstances, to invoke it. Renewal is the committee's to decide; the chair had no standing to invoke the procedure. Her words are not a broken promise but a failed one — void from the outset, like a ship christened by somebody who has wandered in off the street.

  2. Douglas. That puts the cart before the horse. The fellow, and everyone in the hall, took her to have committed herself; uptake was complete. If want of formal authority voided a promise, then every promise whose fulfilment needs the cooperation of others would be void, and promising would be a far narrower practice than it is. Besides, her office gives her partial standing: she can at any rate promise to press the committee. A doctrine that lets speakers escape by pointing at their own lack of authority has the incentives backwards.

  3. Miriam. Then distinguish promising to press the committee from promising that the committee will renew. She said the latter. I promise that P, where P is not within my control, is of a piece with I promise it will rain tomorrow: the grammar of a promise wrapped around the content of a forecast. What she issued was at most an emphatic assurance, and an assurance can be true or false. This one was false, and she knew it. So the case is not a defective promise at all; it is a knowingly false statement — a lie — and the promise machinery is a red herring.

  4. Douglas. Two difficulties. First, the lie: on the usual account a lie is an assertion of what one believes to be false, made with the intent to deceive, and promising is not the sort of thing that is true or false. One can of course lie about one's intentions, and the utterance plainly implies that one has them — but that implication is not the promise, so the charge of lying has to be made out indirectly, and you have not made it out. Second, change the case: the committee has not yet voted, and she says the same sentence purely to get through the ceremony, with no intention of lifting a finger. Now nothing is settled, so there is no false forecast; yet plainly something is wrong with the utterance. What is wrong is that she invoked the procedure without the frame of mind the procedure calls for: the act comes off, but hollowly. Our author marks this as a defect distinct from the one you described, and you are collapsing the two.

  5. Miriam. I accept the two defects. But look what follows. In the case as actually posed the utterance is arguably all three things at once: it comes off, because there was uptake and the audience took her office to confer standing; it is hollow, because she had no intention of acting; and it is a false assurance, because the vote was already in. When one utterance exhibits three defects simultaneously, the taxonomy is not doing the explanatory work. What is doing the work is that she stood up in public and invited a particular person to rely on her, in circumstances where he could not easily check, and he did rely. Whether we file that under promise, assurance, or something else is bookkeeping. Whatever obligation she is under — to explain herself, to repair what she can, not to do it again — is generated by the reliance and the publicity, not by the label.

  6. Douglas. The label is not mere bookkeeping, and a second case shows it. The university's central registry sends automatically, to every applicant, a message reading: We promise you a decision within twenty working days. No human being has read that message; it is assembled by a script and sent in the small hours. If labels do no work, then something has been promised to forty thousand people. But promising seems to require somebody who promises — precisely the standing you insisted on. So either the message is no promise at all, in which case the university has promised nothing, or standing is not required after all. Yet the university is plainly answerable if no decision arrives, whether or not anybody promised anything. So the notion of standing does real work: you need it to handle the machine, even though you overused it against the chair.

  7. Miriam. The machine helps me rather than you. Scripts do not speak, but institutions do; the script is an organ of the university in the way a signature stamp is an organ of a signature. What the message lacks is not a speaker but a speaker with the right relation to what is promised — and the registry does stand in the right relation to decisions about decisions. So both cases turn on one thing: whether the speaker stands in the right relation to the outcome promised. The chair did not. The registry did.

  8. Douglas. Then your own principle runs the other way. The chair was not speaking privately; she was speaking as the head of her department, at a departmental occasion, in the department's name — which is just the sort of institutional voice you invoked for the script. If the university speaks through its registry, the department speaks through its chair. So the department promised, which is exactly what you denied at the outset.

  I have tried to report both of them fairly, and I have no view of my own to offer; I found myself persuaded alternately, which in my experience is a sign that something has been left unspecified.

  Would you adjudicate the exchange? I should be grateful for three things. First, a verdict on each of the eight moves — sound, sound but incomplete, half right, or mistaken — with a sentence or two of justification apiece, since I am more interested in where each argument fails than in who wins the evening. Second, a judgement about who has the better of the argument overall. Third, an account of what both parties are missing: whether the disagreement is in part merely verbal, and whether there is a distinction that neither of them draws — for instance between what an utterance accomplishes by convention and what it merely brings about by being heard, or between the act a speaker performs and the further effects of its being performed in public — that settles some point both left open.
reasoning: |-
  Okay, let me approach this systematically. The user presents a complex philosophical debate between Miriam and Douglas about performative utterances, specifically focusing on a case where a department chair makes an empty promise. As a retired physical chemist, the user seeks clear adjudication of the eight argumentative moves, an overall judgment, and identification of missing distinctions.

  First, I need to parse the core disagreement. Miriam anchors her position in Austin's conventional conditions for performatives: the chair lacks standing to promise contract renewal since that power resides with the committee. Douglas emphasizes the social reality of uptake - the audience believed a commitment was made, creating obligation regardless of formal authority. Their debate evolves through eight discrete moves, each requiring individual assessment.

  For the verdicts on each move:
  - Miriam 1: Sound but incomplete. She correctly identifies Austin's conventional conditions, but underestimates how social context (her role, occasion) might create de facto commitment.
  - Douglas 2: Half right. Uptake matters, but he glosses over the crucial distinction between promising personal action versus outcomes beyond one's control.
  - Miriam 3: Sound. She sharply distinguishes promise types and identifies the false assurance aspect, though "lie" may be too strong without proving deceptive intent.
  - Douglas 4: Sound but incomplete. He correctly separates sincerity defects from authority defects using Austin's taxonomy, but doesn't address why this particular utterance might constitute a promise.
  - Miriam 5: Half right. Her focus on reliance and publicity is insightful, but dismissing performative labels entirely oversimplifies - conventions shape how reliance is generated.
  - Douglas 6: Sound. The registry example effectively shows institutions can promise via scripts, challenging Miriam's strict speaker-outcome linkage.
  - Miriam 7: Mistaken. Her institutional "organ" argument works for the registry, but she inconsistently denies the chair's identical institutional voice.
  - Douglas 8: Sound. He exposes Miriam's contradiction by applying her registry logic to the chair case.

  Overall, Douglas has the better argument because he maintains consistency regarding institutional speech while accommodating social realities of commitment. Miriam's initial rigidity gives way to contradiction when confronted with the registry case.

  The missing distinctions both parties overlook are critical:
  1) Institutional vs. personal speech acts (the chair was clearly speaking officially)
  2) Convention vs. causal effects (the utterance generated reliance regardless of conventional validity)
  3) Action-promises vs. outcome-assurances (the chair blurred these distinct speech acts)

  The user's physical chemistry analogy is apt - they're debating which "variable" (convention, uptake, speaker role) is determinative. But speech acts involve multiple interdependent variables, and the case shows how institutional context can override individual standing when social uptake occurs.
answer: |-
  Below is a structured adjudication of the exchange, addressing your three requests. I draw primarily on J.L. Austin's framework of performative utterances (especially *How to Do Things with Words*) while incorporating insights from later speech-act theory.

  ---

  ### **I. Verdicts on Each Move**  
  *(Key: Sound = logically valid and relevant; Incomplete = correct but partial; Half-right = mixes valid/invalid points; Mistaken = fundamentally flawed)*  

  1. **Miriam 1 (No promise was made): Half-right**  
     *Verdict:* Correct that conventional authority matters (Austin's "proper person" condition), but underestimates the role of social uptake. The chair *might* lack formal power, but her institutional position and public context could create de facto commitment.  

  2. **Douglas 2 (Uptake creates obligation): Half-right**  
     *Verdict:* Right that uptake and reliance generate obligation ("I promise to press" is plausible), but wrong to dismiss authority entirely. Promises requiring third-party cooperation *do* often fail if the speaker lacks influence (e.g., "I promise you a job" from a non-employer).  

  3. **Miriam 3 (False assurance, not promise): Sound but incomplete**  
     *Verdict:* Correct that "I promise P" fails if P is uncontrollable (Austin’s "abuse" vs. "misfire"). However, calling it a "lie" oversimplifies: the utterance primarily *attempts* a promise, and its deceptive aspect is derivative.  

  4. **Douglas 4 (Two distinct defects): Sound**  
     *Verdict:* Accurately distinguishes Austin’s categories: (a) *insincerity* (no intent to act) and (b) *misapplication* (lack of authority). The hypothetical shows insincerity alone can invalidate a promise even if authority exists.  

  5. **Miriam 5 (Reliance trumps taxonomy): Half-right**  
     *Verdict:* Right that reliance/publicity create obligation independent of labels, but wrong to dismiss taxonomy. Austin’s distinctions explain *why* defects arise (e.g., insincerity vs. authority), which matters for assigning blame.  

  6. **Douglas 6 (Scripts vs. institutions): Sound**  
     *Verdict:* Correct that institutions can promise via automated scripts (e.g., a university *is* answerable). Exposes Miriam’s inconsistency: if institutions "speak" through scripts, why not through chairs?  

  7. **Miriam 7 (Registry has standing): Mistaken**  
     *Verdict:* Contradicts her initial stance. If the registry can promise outcomes because it "stands in the right relation," so can the chair (as department head). Her "organ" analogy concedes institutional agency.  

  8. **Douglas 8 (Chair speaks for department): Sound**  
     *Verdict:* Logically consistent. If institutions speak through administrative organs (registry), departments speak through chairs. Miriam’s denial ignores the chair’s institutional role.  

  ---

  ### **II. Overall Judgment**  
  **Douglas has the better argument.**  
  - He exposes Miriam’s contradictions (moves 6–8) and defends uptake’s role in creating obligation (move 2).  
  - Miriam starts strong (moves 1, 3) but over-relies on formal authority, leading to inconsistency. Her valid points about reliance (move 5) are undermined by rejecting taxonomy.  
  - Douglas better integrates Austin’s nuances (e.g., distinguishing defect types in move 4).  

  ---

  ### **III. What Both Parties Miss**  
  The core disagreement stems from **unexamined distinctions** and **verbal slippage**:  

  1. **Institutional vs. Personal Agency**  
     - Both conflate the chair’s *personal* capacity with her *institutional* voice. Austin notes that performatives often depend on social roles ("appropriate person"). The chair spoke *as department head* at an official event—this institutional context grants her standing to commit the department *procedurally*, even if she lacks final authority. Douglas hints at this (move 8), but neither explores how institutional roles reshape "conventional procedures."  

  2. **Convention vs. Causation**  
     - Miriam focuses on *conventional validity* (was it "really" a promise?), while Douglas emphasizes *causal effects* (reliance, uptake). Austin separates:  
       - **Illocutionary act:** What is done *by* speaking (e.g., promising).  
       - **Perlocutionary effect:** What is achieved *through* speaking (e.g., inducing reliance).  
     - The chair’s utterance *conventionally misfires* as a promise (due to authority/control), but successfully *causes reliance* perlocutionarily. Obligation arises from the latter, not the former.  

  3. **Promise-of-Action vs. Assurance-of-Outcome**  
     - Neither distinguishes sharply enough between:  
       - Promising *to do something* (e.g., "I promise to lobby").  
       - Assuring *that something will happen* (e.g., "I promise [=assure] you P").  
     - The chair’s utterance is primarily an *assurance* (a true/false claim about the future), falsely framed as a promise. This resolves Miriam’s "forecast" point (move 3) and Douglas’s "hollow act" (move 4).  

  4. **Verbal Dispute: "Standing"**  
     - Miriam uses "standing" for *de jure* authority (committee control), Douglas for *de facto* social position (chair’s office). Both are valid but distinct. Austin’s "accepted procedure" blends both: conventions can evolve through social uptake (e.g., a chair’s public pledge might *become* binding if the audience accepts it).  

  **Settling the Case**:  
  - The chair **conventionally failed** to promise renewal (lack of control/authority).  
  - She **successfully assured** falsely (a lie if she knew the outcome).  
  - Her institutional role and publicity **induced reliance**, creating ethical (not performative) obligations.  
  - The university registry case **succeeds** as a promise because the institution *has* standing over its processes.  

  ---

  ### **Recommendation for the Group**  
  Focus on Austin’s distinction between:  
  - **Misfires** (acts void due to flawed procedure/authority).  
  - **Abuses** (acts "hollow" due to insincerity).  
  - **Perlocutionary sequels** (effects like reliance, which generate responsibility beyond the act itself).  

  The chair’s utterance is a misfire (authority) *and* an abuse (insincerity) *plus* harmful perlocutionary effects. This tripartite analysis resolves the "three defects" problem (Miriam 5) without abandoning taxonomy. Douglas wins on institutional consistency; Miriam on the uncontrollable-outcome point. Both underplay the role of context in defining "accepted procedures."
