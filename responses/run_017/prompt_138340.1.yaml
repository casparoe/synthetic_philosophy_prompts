prompt: |-
  I teach a first-year undergraduate course called Making History: Evidence, Method, and Doubt — about twenty students, mostly not history majors — and I have one ninety-minute slot to spend on why historical explanation feels so much more inevitable than it is. I can also get the same room for a twenty-minute slot one week later if your design needs a delay between a forecast and its recall, but I'd rather not depend on that. The room has a whiteboard and nothing else: no projection, no laptops, so everything has to run on printed handouts, index cards, envelopes and pens. What I want is a runnable exercise — a game or structured deliberation with rules, small real stakes (seminar credit is fine, money is not) and a debrief — that makes students collide with two things at once: hindsight bias, the way knowing an outcome silently rewrites your memory of your own earlier uncertainty, and the narrative fallacy, the pressure to impose agents, turning points and an ending on what was mostly a conjunctural mess. They should hit both before either gets named; I don't want the terms in the air until the last ten minutes.

  My half-formed plan, which I'd like you to tighten, correct, or replace where it's weak: students receive a dossier of roughly fourteen dated dispatches from an invented crisis in an invented setting — a chartered trading post, a provincial water authority, an Antarctic research station, anything with no real-world counterpart, so that prior knowledge can't help and nobody can go and look anything up. Three of the items should be dead ends: leads that looked decisive at the time and led nowhere. Two should be counter-indications, pointing away from whatever eventually happens. Phase one is individual and sealed: each student writes a probability distribution over four candidate outcomes, scored with a proper quadratic (Brier-style) rule converted into credit, so that honesty about their own uncertainty pays and hedging does not. Phase two is in groups of four or five: each group is handed a sealed envelope containing what happened and writes a 150-word explanation of why it had to happen that way. Here I've been toying with a twist I can't quite calibrate: give half the room one outcome and half the room a different, incompatible one, and then reveal at the end that neither was the real one — the actual outcome was anti-climactic, the crisis simply petered out, no decision was ever taken. The thing I want them to walk into is that the demand for a climax doesn't weaken when the events don't supply one: the pressure comes from the explainer, not from the world. Tell me whether the two-envelope version or the false-outcome version earns the extra complexity, how to keep the reveal from feeling like a trick played on them rather than a result they produced, and what to do if a group guesses the twist from the sheer contrivance of the setup.

  I also want two or three cheap, countable measures that turn your story is suspiciously smooth from a suspicion into a number students can compute on their own sheets — candidates I've been kicking around are a compression ratio (dossier facts against facts actually cited, and against facts cited with their valence reversed), a dead-end audit (what fraction of the dead ends were silently dropped, and what fraction were retro-fitted into causes), and a counterfactual gradient (rating four or five branch points for how close the world came to going the other way, once from inside the dossier and once after the reveal, to watch the gradient collapse). Tell me which of these are worth the minutes and which are busywork. Please give me: the dossier written out in full, with a private note on which items are dead ends, which are counter-indicators, and what an honest forecast distribution over the four outcomes would look like given that no single item should be a giveaway; the rules, the scoring rule and its credit conversion; a minute-by-minute timeline; the debrief, mapping specific moments in the session onto specific features of hindsight bias and of narrative pressure, and saying what participants should be able to see by the end that they couldn't see at the start; an honest note on what will predictably go wrong the first time I run it and how to handle it, including the student who announces that it was all chance and therefore refuses to explain anything; and a frank statement of which feature of the problem the exercise cannot reproduce and I will have to supply in words — my worry is that the dossier arrives fully formed, whereas in real historical work the archive has already been filtered by what survived and by what somebody chose to write down, so the exercise may localize the distortion in the explainer when some of it lives in the record. Close the whole response with a single final line, and nothing after it, of exactly the form \answer{...}, naming in six words or fewer the one mechanic the entire session hinges on.
reasoning: |-
  We are designing an exercise for a 90-minute session on hindsight bias and narrative fallacy. The exercise must use only physical materials (printed handouts, index cards, envelopes, pens) and be runnable in a room with a whiteboard. The goal is for students to experience these cognitive biases before they are named.

  Key elements from the user's plan:
  - A dossier of about 14 dispatches from an invented crisis (e.g., a trading post, water authority, research station). 
  - Three dead ends: items that seemed important but led nowhere.
  - Two counter-indications: pointing away from the actual outcome.
  - Phase 1 (individual): Each student assigns probabilities to four candidate outcomes, using a Brier scoring rule (quadratic) that rewards honesty and punishes hedging. Converted to seminar credit.
  - Phase 2 (group): Groups of 4-5 are given a sealed envelope with an outcome (but we consider a twist: half the groups get one outcome, half another, and then we reveal that the real outcome was neither and was anti-climactic). The groups must write a 150-word explanation of why it had to happen that way.
  - We want to avoid the reveal feeling like a trick. We also want to measure narrative smoothness with countable metrics (e.g., compression ratio, dead-end audit, counterfactual gradient).

  After analysis, I propose the following:

  **Setting:** An Antarctic research station (fictional) during a winter crisis. This setting is isolated, has no real-world counterpart, and can generate a variety of problems (technical, human, environmental).

  **Outcomes:**
  We will have four candidate outcomes (A, B, C, D). However, the actual outcome (E) is that the crisis petered out without a decisive resolution.

  **Twist:** We will assign two false outcomes (say, A and B) to the groups. Half the groups get A, half get B. Then we reveal that the real outcome was E (anti-climactic). This twist is chosen to illustrate the narrative pressure: even when events don't have a climax, the explainers impose one.

  **Dossier:** We create 14 dispatches. We must mark which are dead ends and counter-indications.

  **Metrics for the debrief:**
  We will use two metrics to keep it manageable:
  1. **Dead-end audit:** Count how many of the three dead ends were included in the group's explanation (if included, note if they were retrofitted as causes or just mentioned without causal force). This shows how narrative smoothness ignores or repurposes irrelevant events.
  2. **Compression ratio:** For each group, we compute: (number of dossier facts cited in explanation) / (total dossier facts). This ratio is expected to be low (they ignore many facts) and might be even lower for counter-indications and dead ends.

  We skip the counterfactual gradient to save time and because it might be too complex for a 20-minute group phase.

  **Phase 1 (Individual Forecast):**
  - Each student gets a dossier (14 dispatches) and a sheet with four candidate outcomes (A, B, C, D) and instructions to assign probabilities (0-100%) that must sum to 100.
  - They are told that they will be scored with a quadratic scoring rule (Brier) and that the score will be converted to seminar credit (e.g., 0-5 points). The Brier score for a forecast is: 
    For each outcome i, let p_i be the probability assigned and let x_i be 1 if i is the true outcome, 0 otherwise. 
    Brier Score = Sum_{i=1 to 4} (p_i - x_i)^2.
    Since we have four outcomes, the worst score is 2 (if you assign 0 to the true outcome and 1 to one wrong) and the best is 0 (if you assign 1 to the true outcome). We invert this to reward accuracy: Credit = (2 - Brier Score) * (scaling factor). We set scaling factor so that maximum credit is 5 (if they assign 100% to the true outcome, they get 5). Since the true outcome is E (not among A, B, C, D) we have to adjust.

  But note: the true outcome E is not among the four. So how do we score? We must design the candidate outcomes so that E is not one of them. Therefore, when we score, the true outcome is not in {A,B,C,D}, so x_i = 0 for all i. Then the Brier score is simply the sum of p_i^2. We want to reward low confidence (since E is the true outcome and it's not in the list) but note: the students are assigning probabilities to A, B, C, D. The correct assignment would be to assign 0 to all? But we cannot because they must sum to 100. This is a problem.

  Alternative: We tell the students that the outcome might not be one of the four? But that complicates the forecast. Instead, we can have the four outcomes, and then when we reveal E, we note that E was not among the options. Then we score the forecast by the Brier score against the event that none of A,B,C,D happened (which is E). So we define a fifth outcome: "none of the above" (E). But in the forecast sheet, we only have A, B, C, D. We can add a note: "You may assign a probability to the possibility that none of the above outcomes occur." Then we have five outcomes: A, B, C, D, E. Then we can score properly.

  Revised forecast: The students assign probabilities to A, B, C, D, and E (with E being "none of the above"). The true outcome is E. Then we can score with the Brier score for five outcomes.

  But the dossier should not make E obvious. We want the students to assign some probability to E? We must design the dossier so that E (petering out) is a plausible outcome.

  Let's define the four outcomes as dramatic resolutions and E as the anti-climax.

  So the forecast sheet will have:
  - Outcome A: [description]
  - Outcome B: [description]
  - Outcome C: [description]
  - Outcome D: [description]
  - Outcome E: The crisis peters out without any decisive resolution.

  The students assign probabilities to A, B, C, D, E (sum to 100).

  Then in phase 1, we score the individual forecasts. The true outcome is E. The Brier score is computed as the average of (p_i - x_i)^2 for i in {A,B,C,D,E}, where x_i=1 for E and 0 for others. Then we convert to credit: maximum Brier score when they assign 1 to E is 0 (best). The worst is when they assign 0 to E and 100% to one of the others: then the score is (0-0)^2*4 + (1-0)^2 = 1? Actually:

  Brier score = (p_A - 0)^2 + (p_B - 0)^2 + (p_C - 0)^2 + (p_D - 0)^2 + (p_E - 1)^2.

  We can set the credit as: Credit = 5 * (1 - Brier Score/2) because the worst Brier score is 2 (if they assign 0 to E and 100% to one of the others: 0+0+0+0+(0-1)^2=1? Wait, let me compute:

  If they assign 100% to A: then p_A=1, p_B=0, p_C=0, p_D=0, p_E=0.
  Brier = (1-0)^2 + (0-0)^2 + (0-0)^2 + (0-0)^2 + (0-1)^2 = 1 + 0 + 0 + 0 + 1 = 2.

  If they assign 100% to E: then p_A=0, p_B=0, p_C=0, p_D=0, p_E=1.
  Brier = (0-0)^2 + (0-0)^2 + (0-0)^2 + (0-0)^2 + (1-1)^2 = 0.

  If they assign 20% to each: 
  Brier = (0.2)^2 * 4 + (0.2-1)^2 = 0.04*4 + (0.64) = 0.16+0.64=0.80.

  We want to give credit: maximum 5 for perfect (Brier=0), and 0 for worst (Brier=2). We can do: Credit = 5 * (1 - Brier Score/2). So for perfect: 5*(1-0)=5, for worst: 5*(1-2/2)=0, for uniform: 5*(1-0.80/2)=5*(1-0.4)=3.

  This scoring rule is proper: it rewards truthful reporting of beliefs.

  **Phase 2 (Group Explanation):**
  - Students are divided into groups of 4-5. Each group is given a sealed envelope. Half the groups get an envelope that says "The outcome was A", half get "The outcome was B". They are told that the envelope contains the true outcome. They must write a 150-word explanation of why that outcome was inevitable, using the dossier.
  - After they write, we reveal that the true outcome was E (petering out). We then collect the explanations and analyze them.

  **To avoid feeling like a trick:**
  - We frame the exercise as an investigation of how we construct historical narratives. In the debrief, we note that the students were given an outcome and asked to explain it, which is common in history (we often start with an outcome and look for causes). The twist reveals that the narrative pressure is so strong that even when the outcome is not one of the dramatic ones, we can still construct a story around a false outcome.

  **If a group guesses the twist:**
  - If a group says, "We think it might be that nothing happened," we can note that in the debrief as an example of resisting narrative pressure. But in the group phase, they are assigned an outcome (A or B) and must explain that assigned outcome. So they must write as if A or B happened.

  **Dossier:**
  We create 14 dispatches from an Antarctic research station. The crisis is about a series of malfunctions and interpersonal conflicts during the winter.

  Candidate outcomes:
  A: The station is evacuated due to a critical systems failure.
  B: A key scientist is found to have sabotaged the equipment and is confined, leading to a resolution.
  C: An external rescue mission arrives and takes over the station.
  D: A mutiny occurs, and the station leader is overthrown.
  E: The crisis petered out; systems were stabilized without major incident, tensions eased without confrontation, and the winter passed without further event.

  Dossier items (14):
  1. [Day 1] Power fluctuations detected in the main generator. Engineer reports it's within normal parameters but worth monitoring.
  2. [Day 3] Biologist reports unusual behavior in the lab animals; suggests possible environmental stress.
  3. [Day 5] Station leader announces a reduction in heating to conserve fuel.
  4. [Day 7] Cook complains about the quality of the food supplies; says some tins are bulging.
  5. [Day 8] Geologist and meteorologist have a loud argument over the use of the last working snowmobile. Heard by several.
  6. [Day 10] Power goes out for 2 hours. Backup generator kicks in. Engineer says it's a minor glitch.
  7. [Day 12] Station leader finds a valve in the water supply system has been manually closed. No one admits to doing it. (Dead end: it was accidentally bumped by a crew member who didn't report it.)
  8. [Day 14] Medical officer reports two crew members with symptoms of food poisoning. (Counter-indication: suggests internal problems, but outcome E has no major incident.)
  9. [Day 16] Radio communication with the outside world is lost due to a solar flare. Expected to last a week.
  10. [Day 18] A storage shed door is found forced open. Some equipment is missing. (Dead end: later found to have been moved by the engineer for repairs and he forgot to log it.)
  11. [Day 20] Station leader calls a meeting to address morale. Proposes a new schedule for shared facilities.
  12. [Day 22] Meteorologist submits a formal complaint about the geologist, accusing him of hoarding equipment. (Dead end: the complaint was later withdrawn without action.)
  13. [Day 25] Power fluctuations become more severe. Engineer says they may need to shut down non-essential systems. (Counter-indication: points to a possible systems failure, but in E, it is stabilized without evacuation.)
  14. [Day 28] Cook announces that the food supply is sufficient after all, due to a recount. (This is positive, but in the context, it's just a normal adjustment.)

  Dead ends: items 7, 10, 12.
  Counter-indications: items 8 (food poisoning might suggest deteriorating conditions, but outcome E is benign) and 13 (power problems might suggest failure, but E has stabilization).

  An honest forecast might assign: 
  - A: 20% (evacuation: power issues and food problems might lead to this)
  - B: 15% (sabotage: the closed valve and forced shed might suggest sabotage)
  - C: 10% (rescue: but radio is out and it's winter, so unlikely)
  - D: 15% (mutiny: arguments and complaints might lead to this)
  - E: 40% (peter out: many problems are minor and might resolve)

  **Rules and Scoring:**
  - Phase 1 (20 minutes): Individual forecast. Hand out dossier and forecast sheet. Students assign probabilities to A, B, C, D, E. Collect and score later (we won't have time to score during class, but we can tell them how it will be scored and that they will get credit later).
  - Phase 2 (40 minutes): Group work. Divide into groups (about 4-5 groups if 20 students). Assign each group either outcome A or B (sealed in an envelope). They read the outcome and write a 150-word explanation of why it had to happen. They must use at least 5 facts from the dossier. (We give them a sheet with the dossier again and a worksheet for the explanation.)
  - Then we have a 30-minute debrief.

  **Debrief (30 minutes):**
  1. Reveal that the true outcome was E (petered out). Explain that groups were given either A or B and wrote explanations for those outcomes.
  2. Collect the group explanations and quickly analyze two metrics:
     a. Dead-end audit: How many dead ends (items 7,10,12) did each group use? If they used them, did they present them as causes of A or B? (Even though they were dead ends and not causes of anything.)
     b. Compression ratio: How many dossier items did they cite? (We have 14. They were required to use at least 5, but how many more? And did they avoid counter-indications? Specifically, look at item 8 and 13: counter-indications that might not fit A or B.)
  3. Discuss: 
     - How did you feel when you were writing the explanation for A or B? (They might say it was easy, or that they found patterns.)
     - Now that you know the truth was E, how do you view your explanation? (It was forced, it ignored some facts, etc.)
  4. Introduce the terms: hindsight bias (knowing the outcome made the path to that outcome seem inevitable) and narrative fallacy (imposing a story with agents, turning points, and a climax on a messy situation). Note that in this case, the outcome was not even A or B, but they still constructed a narrative for A or B.
  5. Show how the metrics illustrate the narrative smoothing: 
     - Dead ends were either ignored or retrofitted as causes (even though they were irrelevant).
     - Counter-indications (like the food poisoning and the power problem that stabilized) were either ignored or reinterpreted (e.g., "the food poisoning increased tension, leading to..." even though it didn't actually lead to the outcome).
     - Compression: they used only a subset of the facts, and the ones they used were often taken out of context.

  **Timeline (90 minutes):**
  - 0-5 min: Introduction to the exercise. Explain that they are going to investigate a historical crisis in real-time. Hand out dossiers and forecast sheets.
  - 5-25 min: Phase 1 (individual forecast). Students read the dossier and assign probabilities. Collect the forecast sheets.
  - 25-30 min: Divide into groups and hand out group materials (envelopes with assigned outcome, a copy of the dossier, and a worksheet for the explanation). Explain that they must write an explanation of why the outcome they are given was inevitable, using at least 5 facts from the dossier.
  - 30-70 min: Phase 2 (group work). Groups work on their explanations.
  - 70-90 min: Debrief. Reveal the true outcome (E). Discuss. Introduce the terms and the metrics. Show how the narratives were constructed.

  **What will go wrong:**
  1. Some students might not understand the Brier score. We can explain it simply: you get more credit if you are both accurate and honest about your uncertainty. Avoid complex math in class.
  2. Groups might finish early or run late. Have a time warning at 60 minutes (10 minutes left for group work).
  3. The student who says "it was all chance" and refuses to explain: In the group phase, they are required to participate because it's a group assignment. In the debrief, we can address this: even if chance played a role, historians (and humans) try to find patterns. The exercise shows how strong that impulse is.
  4. The reveal might feel like a trick. To mitigate: frame it as a common experience in history. We often have partial records and must construct narratives, but sometimes the record is misleading or incomplete. The exercise exaggerates this to make the point clear.

  **What the exercise cannot reproduce:**
  The dossier is given as a complete set of dispatches. In reality, the historical record is filtered by survival and by what was recorded. Some of the distortion comes from the archive, not just the historian. We must note in the debrief that historians also face the problem of fragmentary and biased sources. The exercise focuses on the cognitive biases of the explainer, but in real history, the archive itself is a product of chance and choice.

  **Final Line:**
  \answer{False outcome assignment and reveal}

  Now, the dossier in full and the forecast sheet:

  **Dossier: Antarctic Research Station Winter Crisis Dispatches**

  1. [Day 1] Power fluctuations detected in the main generator. Engineer reports: "It's within normal parameters for this temperature, but we'll monitor it closely."
  2. [Day 3] Biologist's log: "Lab animals are agitated. This could be due to the constant noise from the generator or the changing light conditions. We'll adjust their environment."
  3. [Day 5] Station Leader Announcement: "Due to higher-than-expected fuel consumption, we must reduce heating in non-essential areas. Expect colder conditions in the labs and common rooms."
  4. [Day 7] Cook's Report: "Several tins of vegetables are bulging. I've set them aside. We'll have to rely more on dried goods until the next supply."
  5. [Day 8] Incident Report: Geologist and Meteorologist had a heated argument in the corridor over the use of the last working snowmobile. The station leader mediated. Both have been warned.
  6. [Day 10] Power Outage: Main generator failed for 2 hours. Backup generator activated. Engineer: "It was a minor glitch, fixed by resetting. No long-term concern."
  7. [Day 12] Station Leader's Note: "Found the main water supply valve manually closed. No one admits to touching it. I've ordered it locked open." (Dead end: later discovered that a crew member accidentally leaned on it and didn't report.)
  8. [Day 14] Medical Officer's Log: "Two crew members presented with vomiting and diarrhea. Suspect food poisoning from the tinned fish. They are recovering with rest and fluids." (Counter-indication: suggests a health crisis, but outcome E is without major incident.)
  9. [Day 16] Communications Update: "Radio contact with McMurdo Station lost due to solar flare activity. Expected to last 5-7 days. Routine communications suspended."
  10. [Day 18] Storage Shed Incident: "The door to Storage Shed 2 was forced open. Missing: two ice drills and a battery pack. Investigation underway." (Dead end: the engineer had moved them for maintenance and forgot to log it; found a week later in the workshop.)
  11. [Day 20] Station Leader's Memo: "Meeting called to address morale. New schedule for gym and common room use posted. We must support each other."
  12. [Day 22] Formal Complaint: Meteorologist submitted: "Geologist has been hoarding the portable gas heaters in his lab. This is unacceptable." (Dead end: the geologist had them for a valid experiment and returned them after the complaint; the complaint was withdrawn.)
  13. [Day 25] Engineer's Urgent Report: "Power fluctuations are increasing in frequency. We may need to shut down non-essential systems to avoid a total failure." (Counter-indication: points to a potential crisis, but in E, it stabilizes.)
  14. [Day 28] Cook's Update: "Recounted the food supplies. We have more than I thought. The bulging tins were a false alarm; the rest are fine. We are back on full rations."

  **Forecast Sheet:**
  Please assign probabilities (0-100%) to each of the following outcomes. The probabilities must add up to 100%.

  - Outcome A: The station is evacuated due to a critical systems failure (e.g., power or water).
  - Outcome B: A key scientist is found to have sabotaged the equipment and is confined, leading to a resolution of the crisis.
  - Outcome C: An external rescue mission arrives and takes over the station.
  - Outcome D: A mutiny occurs, and the station leader is overthrown.
  - Outcome E: The crisis peters out; systems are stabilized without major incident, tensions ease without confrontation, and the winter passes without further event.

  A: ___ %
  B: ___ %
  C: ___ %
  D: ___ %
  E: ___ %
  Total: 100%

  **Group Envelopes:**
  - Half the groups: "The outcome was A: The station is evacuated due to a critical systems failure."
  - Half the groups: "The outcome was B: A key scientist is found to have sabotaged the equipment and is confined, leading to a resolution of the crisis."

  **Group Worksheet:**
  Your group has been assigned Outcome [A or B]. Write a 150-word explanation of why this outcome was inevitable, based on the dossier. You must use at least 5 facts from the dossier (refer to them by number). 

  **Debrief Script:**
  After collecting the group worksheets:
  - "I have to reveal that the true outcome was E: The crisis petered out. There was no evacuation, no sabotage discovered, no rescue, no mutiny. The power fluctuations were fixed, the food poisoning cases recovered, the stolen equipment was found in the workshop, the complaint was withdrawn, and the winter passed without major incident. 
  - Why then did we assign you to explain A or B? Because this is what historians often face: they know the outcome and then look for causes. But in this case, we gave you a false outcome and you still constructed a narrative. 
  - Let's look at your explanations. How many of you used dead ends? (List dead ends: 7,10,12). For example, the closed valve (7) or the forced shed (10) might have been used as evidence of sabotage for outcome B, even though they were accidents. 
