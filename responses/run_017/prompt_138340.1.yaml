answer: |-
  Below is a complete, runnable exercise design based on your goals, tightened to address weaknesses in your initial plan. I've replaced the two-envelope twist with a single false outcome for simplicity, avoiding over-complication while preserving the core lesson about narrative pressure. The dossier, mechanics, and debrief are structured to make students confront hindsight bias and narrative fallacy experientially before naming them. 

  ### **Exercise Title**: "The Winterover Crisis: Truth in the Ice"

  **Setting**: A fictional Antarctic research station ("Station Aurora") during the 1982 winter isolation. The crisis involves technical failures, interpersonal tensions, and environmental threats. Prior knowledge is irrelevant, and the scenario avoids real-world analogs.

  **Materials**:
  - Printed dossiers (one per student; 14 dispatches).
  - Forecast sheets (one per student).
  - Sealed envelopes for groups (each contains the same false outcome).
  - Group worksheets (for explanations).
  - Pens, whiteboard.
  - Instructor's private key (to identify dead ends, counter-indicators, and scoring).

  ---

  ### **Dossier: Station Aurora Dispatches**  
  *Private key: Dead ends = #7, #10, #12; Counter-indicators = #8, #13; Honest forecast distribution at end.*  

  1. **Day 1**: Generator fluctuations detected. Engineer: "Normal for extreme cold; monitor only."  
  2. **Day 3**: Biologist reports erratic lab animal behavior—possible stress from constant noise.  
  3. **Day 5**: Station leader reduces heating to conserve fuel; crew complains of cold.  
  4. **Day 7**: Cook flags bulging food tins; shifts to frozen rations.  
  5. **Day 8**: Geologist and meteorologist argue loudly over equipment access. Leader intervenes.  
  6. **Day 10**: Power outage (2 hrs). Engineer: "Minor glitch; backup stable."  
  7. **Day 12**: Water valve found closed; no one admits fault. Leader orders lock. *(Dead end: Was accidental bump; resolved silently.)*  
  8. **Day 14**: Two crew report vomiting—medic suspects bad tinned fish. Isolated, stable. *(Counter-indicator: Points away from escalation; illness contained.)*  
  9. **Day 16**: Solar flare kills radio contact; no comms for 7+ days.  
  10. **Day 18**: Storage shed door forced open; tools missing. Security review started. *(Dead end: Tools moved for repairs; found later.)*  
  11. **Day 20**: Leader announces morale plan: mandatory group dinners.  
  12. **Day 22**: Meteorologist files complaint: "Geologist hoarding heaters." *(Dead end: Misunderstanding; heaters returned next day.)*  
  13. **Day 25**: Engineer warns: "Frequent power surges. May need system shutdowns." *(Counter-indicator: Suggests imminent failure, but stabilizes.)*  
  14. **Day 28**: Cook: "Food recount shows surplus. Bulging tins were false alarm."  

  ---

  ### **Mechanics and Rules**  
  **Phase 1: Individual Forecast (20 min)**  
  - Students read the dossier and assign probabilities to **four candidate outcomes** on their forecast sheet:  
    - **A**: Evacuation due to system failure.  
    - **B**: Sabotage discovered; culprit confined.  
    - **C**: Mutiny overthrows leader.  
    - **D**: Rescue team intervenes.  
  - **Scoring Rule**: Brier (quadratic) scoring. For each outcome, points = `(assigned probability - 1 if true, else 0)^2`. Total score = sum for all outcomes. Credit = `5 - 2.5 * total score` (max 5, min 0). *Rationale: Rewards accurate uncertainty—e.g., 25% across all outcomes scores better than 100% on a false one.*  
  - **Honest Forecast Note**: Given the dossier, an honest distribution might be A:30%, B:25%, C:20%, D:25% (no outcome is obvious; dead ends/counter-indicators create ambiguity).  

  **Phase 2: Group Explanation (40 min)**  
  - Groups of 4–5 form. Each receives a sealed envelope: **"The outcome was B: Sabotage discovered; culprit confined."** (All groups get the *same* false outcome).  
  - **Task**: Write a 150-word explanation of why Outcome B **had to happen**, citing ≥5 dossier items. Emphasize: "Argue for inevitability, not possibility."  
  - **Twist**: After explanations, reveal the **true outcome: "The crisis faded. No sabotage, evacuation, mutiny, or rescue occurred. Systems stabilized; tensions eased."** (Outcome E—anti-climax).  

  ---

  ### **Debrief (30 min)**  
  **Step 1: Reveal & React (5 min)**  
  - Announce true outcome (E). Ask: "How many groups felt Outcome B was *genuinely* inevitable? How does E change your view?"  
  - **Avoiding "Trick" Perception**: Frame it as: "History often hands us an ending first. We asked you to explain a plausible one—but the real lesson is how easily we retrofit causes."  

  **Step 2: Quantify Narrative Smoothness (10 min)**  
  Use two countable metrics (simple; avoid busywork):  
  1. **Dead-End Audit**: Groups count how many dead ends (#7,10,12) they cited. *Reveal*: Dead ends were irrelevant. Ask: "Did you repurpose them as causes (e.g., closed valve as sabotage) or drop them?"  
  2. **Compression Ratio**: Groups compute: `(facts cited) / 14`. Then, compare to `(counter-indicators cited) / 2`. *Reveal*: Most groups cite ≤7 facts and ignore/reverse counter-indicators (e.g., #8 illness used to show "rising tension," not containment).  
  - *Whiteboard*: Tally results. Typical pattern: High compression (0.3–0.5 ratio), dead ends retrofitted (2–3 cited), counter-indicators dropped (0–1 cited).  

  **Step 3: Name and Frame (10 min)**  
  - **Hindsight Bias**: "When you *knew* Outcome B, the path seemed obvious. But pre-reveal forecasts showed uncertainty. Knowing the end rewires memory—here, your own notes prove it."  
  - **Narrative Fallacy**: "You imposed agents (saboteur), turning points (e.g., Day 12 valve), and climax (culprit caught) on a mess. The demand for story came from *you*, not events."  
  - **Key Insight**: "Real history feels inevitable only in hindsight. We silence dead ends, ignore counter-evidence, and compress chaos into arcs—even when reality peters out."  

  **Step 4: Discuss Real vs. Exercise Limits (5 min)**  
  - **Unreproduced Problem**: "Here, the dossier was complete. In real history, the *archive* distorts too—survival bias, selective recording. Today’s lesson: Even with ‘full’ evidence, we distort via narrative. Real work fights this doubly: against gaps in records *and* in our minds."  

  ---

  ### **Timeline (90 min)**  
  - **0–5 min**: Intro—"Today, we investigate Station Aurora. Phase 1: Be an analyst. Phase 2: Be a historian." Distribute materials.  
  - **5–25 min**: Phase 1 (forecasts). Collect sheets (score post-class).  
  - **25–30 min**: Explain Phase 2. Form groups; hand out envelopes/worksheets.  
  - **30–70 min**: Phase 2 (group explanations). Circulate; remind: "Argue inevitability."  
  - **70–90 min**: Debrief (as above).  

  ---

  ### **Predictable Problems & Solutions**  
  1. **"It was all chance; no explanation needed" student**:  
     - *Handling*: In Phase 2, insist: "Your task is to explain *as if* Outcome B is certain. History demands narratives—we’re testing why." In debrief, highlight: "Resisting narrative is rare. This exercise shows why we default to stories."  

  2. **Groups guess the twist**:  
     - *Likelihood*: Low (dossier supports B plausibly). If suspected: "Play along—your job is to dissect *how* narratives form, not outsmart the setup."  

  3. **Time crunch in Phase 2**:  
     - *Handling*: At 60 min, warn: "10 min left. Prioritize key causes." Reduce word limit if needed.  

  4. **Brier score confusion**:  
     - *Handling*: Pre-print scoring example on forecast sheet: "E.g., True outcome = A. You assign A:80%, B:20%. Score = (0.8-1)^2 + (0.2-0)^2 = 0.04 + 0.04 = 0.08. Credit = 5 - 2.5*0.08 ≈ 4.8."  

  5. **Reveal feels like a "trick"**:  
     - *Mitigation*: In debrief, stress: "This isn’t about ‘fooling’ you. It mirrors real history: We’re handed outcomes (e.g., ‘WWI was inevitable’) and retrofit causes. Outcome E shows life resists clean endings."  

  ---

  ### **Final Note on Unreproduced Problem**  
  As noted, the exercise localizes distortion in the *explainer*, but real history also suffers from *archival filtering* (e.g., only "important" events were recorded). Verbally underscore: "Today’s dossier was unfiltered—yet you still forced a narrative. Imagine when sources are sparse! That’s why historians triangulate evidence and sit with uncertainty."  

