  - And how many dossier items did you ignore? This compression is normal: we focus on the facts that fit the story. 
  - This is hindsight bias: once you thought the outcome was A or B, the path to it seemed clear and inevitable. And this is the narrative fallacy: we impose a story with causes and a climax on a messy situation. 
  - In real history, the archive is also incomplete. But this exercise shows how our minds work to create coherence even when it isn't there."

