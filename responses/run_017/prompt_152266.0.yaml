prompt: |-
  I do translation and questionnair localisation for survey instruments (mostly market research, but I've done a handful of academic ones), and I read philosophy blogs for fun, so I keep running into the cross-cultural vignette studies: you tell people a short story and ask something like "did he really know, or did he only think he knew", and then you compare answer rates between two countries — the one where people mostly give the answer philosophy professors give, and the one where they mostly don't.

  Here's the pattern I keep noticing and don't have a word for. In a chunk of the responses, from whichever group, people aren't answering the question that was asked. Ask "did he know" and they write back things like "you couldn't say that in court" or "for practical purposes you have to act as if he didn't" — they've turned a question about how things are into a question about what we should say, or what someone in that position should do. That much is boring. Three things make it look like something with a shape to me:

  1. It isn't spread evenly across respondents, it tracks the verdict. Nearly everyone who gives the minority answer is answering a question I didn't ask, while the people giving the majority answer mostly answer straight. So it can't just be noise that averages out across the sample.
  2. The off-target answers are often *good*. They cite considerations that are genuinely relevant to the original question, the sort of thing a philosopher would count as a reason. It's not confusion, and it's not failing to follow the story: comprehension checks come out fine.
  3. It shows up in both groups but lopsidedly. In the other group the minority-verdict people do it too, just less often and more vaguely. And I've seen the same shape in a completely different kind of case — the sort where someone uses a name they picked up second-hand and got the details wrong, and you ask who they're talking about.

  So the measured gap between groups seems to sit almost entirely inside the subpopulation who quietly switched the question, and if you coded only "did this person answer what was asked" the gap would shrink a lot but not vanish.

  Is there a name for this? I assume survey methodology has a term for an item meaning different things to different groups, but I don't know it, and I suspect it isn't quite my thing either, because here the switching is tied to the content of the answer rather than to which group someone is in.

  What I actually want is the carve, not a label. What is this, and what is it not — it isn't plain misunderstanding, it isn't translation failure, it isn't people being yea-sayers or picking the extreme option. Where are the boundary cases: someone who does answer the asked question but backs it with a "you couldn't say that" consideration; someone who answers both versions; someone whose off-target answer is just barely on target. And the bit I really can't settle: is this a confound to be screened or weighted away, or is it the datum — is what differs between the groups the verdict, or what they take the case to be *about*? If nothing established fits, coin a term and define it with its edges. Please don't just hand me a word or point me at papers to read.
reasoning: |-
  Okay, the user works in translation and questionnaire localization, particularly for surveys in market research and some academic projects. They've noticed a pattern in cross-cultural vignette studies where participants don't answer the question as asked. Instead, they shift from a descriptive question (e.g., "did he know?") to a normative one (e.g., "what should we say in court?"). The user has three key observations: this behavior correlates with the minority verdict, the answers are often insightful and relevant, and it appears lopsidedly across groups but in both directions. 

  The user wants to understand this phenomenon deeply—beyond just labeling it. They need to carve out what it is and isn't, explore boundary cases, and decide whether this is a confound or the actual datum of interest. They’re explicitly asking not for just a term or references but a conceptual breakdown.

  First, I need to validate their observations. The pattern they describe is real and significant. It’s not just noise; it’s structured. The fact that off-target answers are "good" suggests this isn’t confusion but a deliberate reframing. The lopsidedness—especially how it tracks with minority verdicts—hints that this might be a fundamental difference in how groups interpret the vignette’s core question. 

  Now, digging into existing concepts:  
  - **Construct bias** or **differential item functioning (DIF)** comes to mind, but those focus on group-level differences in interpretation. Here, the shift happens within groups and correlates with the answer itself.  
  - **Frame switching** (from cultural psychology) describes how bicultural individuals toggle between interpretive lenses, but this seems more about spontaneous reframing of the question’s intent.  
  - **Pragmatic competence** (linguistics) explains how context shapes meaning, but the user notes comprehension checks are fine—so it’s not misunderstanding the story.  

  The core issue seems to be a **clash of discursive domains**: the researchers assume an epistemological question (about knowledge/truth), but respondents import normative/practical considerations. The minority-answer group does this more often because their cultural context blurs these domains, or because rejecting the majority view requires appealing to alternative frameworks.  

  Boundary cases:  
  - If someone answers descriptively but cites normative reasons (e.g., "he knew because you couldn’t say otherwise in court"), that’s a hybrid—still reframing, but less overt.  
  - If they answer both versions distinctly (e.g., "epistemically yes, legally no"), that’s metacognitive awareness, which is rare but clarifies the domains.  
  - "Barely on-target" answers might cite weak normative links (e.g., "he knew because… it’s rude to doubt him"), stretching relevance.  

  Is this a confound or the datum? **Both**. Methodologically, it’s a confound if the goal is to measure epistemic intuitions. But substantively, the *reframing tendency itself* might be the cultural difference—e.g., some groups treat "know" as inherently practical. The user’s data suggests the gap shrinks if filtering for direct answers, implying the measured difference is inflated by the reframing subgroup.  

  Proposing a coined term: **Intentional Question Reframing (IQR)**.  
  - **What it is**: A respondent-generated shift in a vignette’s discursive domain (e.g., epistemological → practical) while retaining narrative comprehension, often yielding coherent, minority-aligned answers.  
  - **What it isn’t**: Translation errors, yea-saying, inattention, or literal misunderstanding.  
  - **Edges**: Excludes answers where normative reasons support descriptive claims (hybrids), and includes cases where the reframing is tacit (no explicit "should" but implied).  

  Why this term? "Intentional" captures agency (not confusion); "reframing" centers the domain shift. It’s measurable via response coding (e.g., flagging practical/normative justifications).  

  For the user’s work: In localization, they could preempt IQR by clarifying the vignette’s domain ("Imagine we care only about truth, not consequences")—but that might stifle the cultural insight. Alternatively, treat IQR as data by adding follow-ups: "Why? Are you thinking about truth or practicality?"  

  Ultimately, the user’s knack for spotting this suggests they’re onto a deeper layer in cross-cultural surveys—one where "bias" isn’t noise but meaning-making.
answer: |-
  This phenomenon you're describing is **profoundly interesting** and deserves a precise carve-out. It's not adequately captured by standard survey methodology terms like *differential item functioning (DIF)* or *construct bias* (which focus on group-level differences in interpretation), nor is it simple misunderstanding or response bias. What you've identified is a specific cognitive-interpretive strategy tied to *verdict generation* itself.

  Here's the carve:

  1.  **Core Phenomenon: Epistemic/Pragmatic Frame Switching (EPFS)**
      *   **What it IS:** A respondent's *deliberate or automatic substitution* of the explicitly asked **epistemic question** (e.g., "Did he *really know*?") with a **pragmatic/normative question** (e.g., "What *should we say* he knew?", "What *consequences* follow from acting as if he knew?", "How *confident* can we be for practical purposes?") *while retaining full comprehension of the vignette narrative*. The switch is motivated by perceived relevance and yields a coherent, contextually "good" answer, just not to the literal query.
      *   **What it IS NOT:**
          *   **Misunderstanding:** Comprehension checks pass. They understand the story and the words in the question.
          *   **Translation Failure:** The phenomenon persists in the source language and isn't caused by lexical ambiguity in the translated question.
          *   **Response Bias (Yea-saying, Extremity):** It's not a tendency to agree or pick strong options regardless of content; it's a substantive reinterpretation of the *question's intent*.
          *   **Inattention or Carelessness:** The answers are thoughtful, relevant to *a* question, and often cite sophisticated reasoning.
          *   **DIF/Construct Bias (Alone):** While DIF might *result* from this, the core isn't just *different* interpretation *between groups*, but a specific *type* of interpretive shift (epistemic -> pragmatic) *within respondents*, strongly correlated with their *verdict* (especially the minority one).

  2.  **Key Characteristics & Boundaries:**
      *   **Verdict-Correlation:** The strongest indicator. EPFS is almost exclusively employed by those arriving at the *minority verdict* in a given cultural context. Majority-verdict respondents answer the epistemic question directly. *This is the smoking gun:* the frame switch isn't random; it's the *cognitive pathway* enabling the minority verdict. It's how they resolve the tension between the vignette and their intuitive judgment.
      *   **Quality of Answer:** Answers are "good" because the pragmatic/normative frame *is* genuinely relevant to the *situation described*. Philosophers *would* acknowledge these considerations, but they are bracketed in the specific epistemic query. The respondent isn't confused; they are applying a different (and internally valid) evaluative lens.
      *   **Lopsided Cross-Group Occurrence:** EPFS occurs in *both* cultural groups, but **only** among the *minority-verdict respondents within each group*. If Group A mostly says "Know" and Group B mostly says "Believe", then:
          *   In Group A, the minority ("Believe") respondents heavily use EPFS.
          *   In Group B, the minority ("Know") respondents also use EPFS, but perhaps less frequently/vividly.
          *   Majority respondents in both groups answer the epistemic question directly. *The measured cross-cultural gap primarily reflects differences in the size of the subgroup predisposed to EPFS for that particular vignette.*

  3.  **Boundary Cases:**
      *   **Answering Literal Question + Citing Normative Reason:** *Not EPFS.* This is answering the epistemic question ("He didn't *know*") and *supporting* it with a normative/pragmatic consideration ("...because you couldn't prove it in court"). The question itself wasn't switched; the reasoning domain was mixed in the justification. EPFS involves directly answering the *switched* question ("No [you couldn't say he knew in court]").
      *   **Answering Both Versions Explicitly:** *Distinct from EPFS.* E.g., "Epistemically, he knew, but legally/practically, you couldn't say that." This shows metacognitive awareness of the frames. EPFS is tacit; the respondent answers *as if* the pragmatic question *was* the one asked.
      *   **"Barely On-Target" Answer:** Tricky. If the answer *nominally* addresses "know" but the *primary justification and logic* are purely pragmatic (e.g., "He didn't *know* because it would be irresponsible to act on it"), it likely still falls under EPFS. The core is the *driving logic*, not just the surface wording. If the pragmatic element is truly peripheral or illustrative, it might be boundary.

  4.  **Is it a Confound or the Datum?**
      *   **As a Confound:** If the research goal is *specifically* to measure *epistemic intuitions* (philosophical "knowledge" judgments), then EPFS absolutely **is a confound**. It masks the true epistemic intuition by replacing it with a pragmatic one. Filtering out EPFS responses (or coding them separately) would give a cleaner measure of the epistemic intuition gap, which your observation suggests would be smaller than the raw verdict gap implies.
      *   **As the Datum:** If the research goal is to understand *how people naturally resolve these kinds of scenarios in real life*, or *what factors influence their stated attributions of "knowledge"*, then EPFS **is the crucial datum**. The key cross-cultural difference isn't (just) the raw epistemic intuition, but the **propensity or perceived necessity to shift into a pragmatic/normative frame when the epistemic intuition conflicts with contextual or practical demands**. It reveals that for some groups/individuals, the concept of "knowing" is inherently more entangled with practical consequences or social norms.

  5.  **Coining a Term: Verdict-Enabling Pragmatic Reframing (VEPR)**
      Given the limitations of existing terms, let's define this precisely:

      *   **Verdict-Enabling Pragmatic Reframing (VEPR):** A respondent-level cognitive process occurring in vignette-based judgment tasks, characterized by:
          1.  Full comprehension of the narrative scenario.
          2.  Substitution of the explicitly posed epistemic question (e.g., concerning truth, justification, belief) with a pragmatic or normative question (e.g., concerning justification for action, social acceptability of assertion, legal standards, practical consequences).
          3.  Generation of a coherent answer directly addressing the substituted pragmatic/normative question.
          4.  Strong correlation with delivering the *minority verdict* within the respondent's cultural or demographic group for that specific vignette.
          5.  The reframing functions as the cognitive mechanism enabling the minority verdict.
      *   **Boundaries of VEPR:**
          *   *In Scope:* Answers where the *primary logic and justification* are pragmatic/normative, presented *as* the answer to the epistemic query ("He didn't know [because you couldn't rely on it in court]").
          *   *Out of Scope:*
              *   Answers mixing epistemic and pragmatic reasoning where the epistemic reasoning is primary ("He didn't know because the evidence was weak, *and* you couldn't use it in court").
              *   Explicit metacognitive distinctions between frames ("Philosophically yes, but legally no").
              *   Responses stemming from genuine narrative misunderstanding or translation error.
              *   Simple agreement/disagreement biases unrelated to reframing the question's intent.

  **Why VEPR Fits Your Observations:**
  *   It explains the **verdict-correlation** (core feature #1).
  *   It accounts for the **"good" but off-target answers** (#2) – they *are* good answers to the reframed question.
  *   It explains the **lopsided cross-group pattern** (#3) – VEPR occurs only where the epistemic intuition clashes with the majority view *within* a group, necessitating the frame shift to justify the minority verdict.
  *   It directly addresses your core puzzle: the measured gap sits largely *within* the subpopulation using VEPR. VEPR *is* the mechanism creating the inflated gap for the epistemic question. The residual gap after filtering VEPR responses represents the difference in "pure" epistemic intuitions.

  **Implications for Your Work:**
  1.  **Detection:** Code not just the verdict, but the *reasoning type*. Flag responses where the primary justification is pragmatic/normative *as the answer* to the epistemic question.
  2.  **Analysis:** Report both the raw verdict gap *and* the gap after excluding or separately analyzing VEPR responses. This clarifies how much of the difference is due to VEPR propensity vs. underlying epistemic intuition.
  3.  **Question Design:** For studies specifically targeting epistemic intuitions, consider adding explicit instructions: *"Please answer based only on whether he truly knew the fact, setting aside practical consequences or what someone should do."* (This might reduce, but likely not eliminate, VEPR, which is deeply ingrained).
  4.  **Localization:** Be hyper-aware of terms like "know," "believe," "justified" – they are prime triggers for VEPR. Consider if the *intent* of the question is truly epistemic or if a pragmatic interpretation might be valid in the target culture. Sometimes, the "problem" reveals a deeper truth about concept embodiment.

  VEPR isn't just noise; it's a meaningful cognitive strategy revealing how people integrate abstract concepts like "knowledge" with real-world demands. Recognizing it allows you to dissect cross-cultural differences far more precisely.
