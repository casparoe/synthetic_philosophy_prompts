prompt: |-
  I have no academic training in philosophy or economics. I work as a logistics planner and, for about two years now, have run a monthly evening at my local library on how people actually make decisions — around 14 regulars, roughly my own level of technical comfort (percentages yes, algebra no), 90 minutes, a room with a whiteboard and no projector. Reading decision theory on my own, I keep coming back to the old pair of choices in which people reliably take the guaranteed sum in one case and the slightly better long shot in the other, even though — so the argument goes — the two cases differ only by a branch that comes out the same either way. I want my group to collide with this themselves rather than have me explain it, so what I need is an activity, not a talk.

  My half-formed idea, which I would like the activity to test rather than assume: people are not comparing final amounts of money at all. In the risky option they are also comparing themselves to what they would have got in the branch that didn't happen, and the guaranteed option is attractive partly because it spares them that comparison. My duller rival explanation is that they simply don't handle the numbers the way the arithmetic does — a guaranteed floor is worth more to them than its expected contribution. A third possibility is that they don't believe the chances they are handed.

  Please think this through carefully before you write. You are a decision theorist who also designs hands-on workshops for adults with no mathematical background. Brainstorm two or three ways of staging this, pick the mechanics that force the intuition rather than announce it, and discard anything that would need a calculator, a projector, or more than a few seconds of mental arithmetic. Constraints: real but small stakes (one $10 bookshop voucher per round, with one round chosen at random to be played out for real after all choices are in); the two paired choices must be separated by filler rounds and by different surface framings so nobody spots the pattern; include at least one variant where the shared branch is only approximately shared — 10% against 11%, with the amounts adjusted to compensate — because I want to see whether the pull tracks the structure or the resemblance; include at least one round in which people choose on behalf of another participant; and include a bidding round where they write down the smallest guaranteed amount they would accept instead of the gamble, so I get a magnitude rather than a yes or no. Nobody should hear the words Allais or independence until the debrief.

  Give me the following, in this order:

  The idea in plain words (~120 words): what participants should come away having felt, not having been told.

  Setup, materials and stakes (~120 words).

  The rounds, as I would read them out (~350 words): exact wording for each round including the filler, and what I write on the board each time.

  Timeline (~100 words): minute by minute across the 90 minutes.

  Debrief (~250 words): which moment in the session maps onto which part of the idea, and how I use the near-miss variant, the delegated-choice round and the bids to prise my three explanations apart.

  What will go wrong (~150 words): the predictable failures on a first run, and what to do when they happen.

  What the activity cannot show (~100 words): the part of the disagreement I will have to supply myself, in words, at the end.
reasoning: |-
  We are going to explore how people make decisions under uncertainty. The core intuition we want participants to feel is that the same outcome can be valued differently depending on the context of other possibilities, especially when a sure thing is involved. We want them to notice that they are inconsistent in a way that feels rational to them, and to wonder why.

  Materials: Whiteboard, markers, index cards (one per participant per round), pens. Stakes: Each round, participants choose between options. One round (randomly chosen at the end) is played for real: a $10 book voucher for the chosen option in that round. To keep stakes low but real, we use one voucher per round, but only one round counts.

  Rounds (exact wording):

  1. (Filler: Framing effect) "Imagine we're giving away a free book. Option A: You get $10 off any book. Option B: You get $12 off, but only if you spend at least $15. Which do you choose? Write A or B on your card." [Board: A: $10 off, guaranteed. B: $12 off if you spend $15, else $0.]

  2. (Classic pair, first choice) "Now, a different situation. You have two options: X: A guaranteed $10. Y: A 90% chance of $11, and a 10% chance of nothing. Which do you choose? Write X or Y." [Board: X: $10 for sure. Y: 90% $11, 10% $0.]

  3. (Filler: Loss aversion) "Next, imagine you bought a book for $10, but it's damaged. Option C: Get a full $10 refund. Option D: 50% chance of a $22 refund, 50% chance of no refund. Write C or D." [Board: C: $10 refund, guaranteed. D: 50% $22, 50% $0.]

  4. (Classic pair, second choice) "Another choice: P: 10% chance of $10, 90% chance of nothing. Q: 11% chance of $11, 89% chance of nothing. Which? Write P or Q." [Board: P: 10% $10, 90% $0. Q: 11% $11, 89% $0.]

  5. (Delegated choice) "Now, choose for the person on your left. Same options as in round 2: X: $10 guaranteed. Y: 90% $11, 10% $0. Write X or Y, but remember you're choosing for your neighbor."

  6. (Bidding round) "This time, instead of choosing, you'll write a number. Consider this gamble: 50% chance of $15, 50% chance of $5. What is the smallest guaranteed amount you would accept instead of this gamble? Write that dollar amount." [Board: Gamble: 50% $15, 50% $5. Write the smallest guaranteed $ you'd take instead.]

  7. (Near-miss variant) "Last choice: R: 10% chance of $10, 90% chance of nothing. S: 11% chance of $9.90, 89% chance of nothing. Which? Write R or S." [Board: R: 10% $10, 90% $0. S: 11% $9.90, 89% $0.]

  Timeline:
  0-5 min: Intro, explain the process (choices on cards, one round picked at random for real voucher).
  5-15: Round 1 (filler).
  15-25: Round 2 (first of pair).
  25-35: Round 3 (filler).
  35-45: Round 4 (second of pair).
  45-55: Round 5 (delegated choice for round 2 options).
  55-65: Round 6 (bidding).
  65-75: Round 7 (near-miss).
  75-90: Debrief: collect cards, randomly pick one round to play (with a coin flip or dice as needed), then discuss.

  Debrief:
  First, tabulate results on the board for each round without comment. Then ask: "In rounds 2 and 4, did anyone choose X and then Q? Or Y and then P? Let's see hands." Point out the inconsistency: in round 2, X (sure $10) is preferred over Y (90% $11), but in round 4, Q (11% $11) is preferred over P (10% $10) even though the difference is only 1% extra chance for $1 more. Then reveal that the two choices are connected: the 90% branch in round 2 is the same as the 10% branch in round 4? Actually, the standard Allais paradox has a common branch. Our rounds 2 and 4 are the classic pair: 
    Round 2: X: $10 vs Y: 89% $11, 1% $11, 10% $0? 
  Wait, I think I made an error in the setup. Let me correct.

  Standard Allais:
  Choice 1: A: $10 for sure. B: 89% $11, 1% $0, 10% $11? 
  Actually, the common consequence effect. I see I have simplified the percentages. Let me adjust the rounds to be more aligned.

  Revised Round 2: 
    X: $10 for sure.
    Y: 90% chance of $11, 10% chance of $0.

  Revised Round 4:
    P: 10% chance of $10, 90% chance of $0.
    Q: 10% chance of $11, 90% chance of $0? 
  But that doesn't create the paradox. The classic setup:

  Choice 1:
    A: 100% chance of $1 million.
    B: 89% chance of $1 million, 10% chance of $5 million, 1% chance of $0.

  Choice 2:
    C: 11% chance of $1 million, 89% chance of $0.
    D: 10% chance of $5 million, 90% chance of $0.

  Then A is preferred over B, but D is preferred over C.

  We need to adjust the rounds to match that structure. But with small stakes and no percentages over 100, we can do:

  Round 2 (Choice 1):
    X: $10 for sure.  (like A)
    Y: 89% chance of $11, 10% chance of $12, 1% chance of $0?  That complicates.

  Alternatively, we can use:

  Round 2:
    X: $10 for sure.
    Y: 90% chance of $11, 10% chance of $0.   [But this doesn't have the common branch exactly.]

  Round 4:
    P: 5% chance of $10, 95% chance of $0.   [This is not standard.]

  Let me restructure to classic:

  We can do:

  Round 2 (Choice 1):
    Option A: $10 guaranteed.
    Option B: 90% chance of $11.11 (so that expected value is $10, but we don't want to do decimals? Or adjust to whole numbers and approximate.

  To avoid decimals, we can scale:

  Round 2:
    A: $10 for sure.
    B: 89% chance of $11, 1% chance of $0, and 10% chance of $11? That's 99% chance of $11? No.

  Standard is:

  |          | 89%   | 1%    | 10%   |
  |----------|-------|-------|-------|
  | Option A | $10   | $10   | $10   |
  | Option B | $11   | $0    | $11   |

  But then we have to explain three outcomes. Too complex?

  Simplified version that still captures the intuition:

  Round 2:
    A: $10 for sure.
    B: 90% chance of $11, 10% chance of $0.

  Round 4:
    C: 10% chance of $10, 90% chance of $0.
    D: 10% chance of $11, 90% chance of $0.

  Now, if people choose A in round 2 and D in round 4, that's inconsistent because the only difference between A and B is that in the 90% branch (which becomes the 10% branch in round 4) they are getting $10 vs $11. But in round 2, they avoid B because of the 10% chance of $0, but in round 4, they prefer D (11) over C (10) even though the risk of $0 is the same (90%). The common consequence is the 90% chance of $0 in round 4, which in round 2 is the 10% chance of $0 that they fear.

  So in round 2, the fear of getting $0 (even though it's only 10%) makes them take the sure $10. In round 4, there's no sure thing, so they go for the higher amount.

  So let's stick with:

  Round 2: 
    A: $10 for sure.
    B: 90% chance of $11, 10% chance of $0.

  Round 4:
    C: 10% chance of $10, 90% chance of $0.
    D: 10% chance of $11, 90% chance of $0.

  Then the inconsistency: choosing A over B, but D over C.

  Now, the near-miss variant (round 7) is:
    R: 10% chance of $10, 90% $0.
    S: 11% chance of $9.90, 89% $0.

  Note: expected value of R: $1.00, S: $1.089, so S is slightly better. But if people are drawn to the round number or the $10, they might choose R.

  Delegated choice (round 5) is the same as round 2: choosing for someone else.

  Bidding round (round 6) is a separate gamble: 50% $15, 50% $5. Expected value $10. We ask for the smallest guaranteed amount they'd take instead.

  Debrief:

  We'll collect the data. We expect in round 2: most choose A (sure $10). In round 4: most choose D (10% of $11 over 10% of $10). Point out the inconsistency: if you prefer A to B, then you are saying that the sure $10 is better than a 90% chance of $11 and 10% chance of $0. But in round 4, you prefer D (10% $11) over C (10% $10), meaning that when the 90% chance of $0 is common, you want the extra $1 in the winning branch. But in round 2, that same extra $1 (in the 90% branch) wasn't enough to compensate for the risk of $0? Why?

  Then we use the near-miss (round 7): If they choose R (10% $10) over S (11% $9.90), that suggests they value the round number $10 and the exact 10% chance. If they choose S, they are going by expected value.

  The delegated choice (round 5): If they choose more B (the gamble) for others than for themselves, that might indicate regret aversion (they don't want to be responsible for someone else getting nothing) or that they are more rational for others.

  The bidding round: We can see if the guaranteed amount they require is above $10 (which is the expected value of the gamble 50% $15, 50% $5). If it's above, that's risk aversion.

  To prise apart the three explanations:

  1. If the inconsistency (A in round 2 and D in round 4) is due to the fear of regret (the 10% chance of $0 in round 2), then in delegated choice they might choose B more often (because they won't feel regret for someone else). But if it's about risk aversion, they might still choose A for others.

  2. The near-miss round: If they choose R (10% $10) over S (11% $9.90) even though S has a higher expected value, that suggests they are not just comparing expected values. It might be that $10 is a salient number, or they don't believe the 1% difference.

  3. The bids: If they bid above $10 for the 50-50 gamble, that's general risk aversion. But that doesn't explain the Allais paradox, which is about independence, not risk aversion per se.

  What will go wrong:

  - Participants might not understand the percentages. We must explain clearly and write on the board.

  - They might spot the pattern between round 2 and 4. We have filler rounds and different framings.

  - In the delegated choice, they might not take it seriously. Emphasize: "Choose as if it were for you, but for your neighbor."

  - In the near-miss, they might think 11% and $9.90 is worse than 10% and $10.00. We have to make sure they see the expected value is higher.

  - When tabulating, some might change their mind. Collect cards immediately after each round.

  What the activity cannot show:

  The independence axiom of expected utility theory. We cannot demonstrate the mathematical violation without the framework of probabilities and utility functions. We have to explain that the choices in round 2 and 4 are inconsistent under the assumption that the common branch (the 90% chance of nothing in round 4, which is the same as the 10% chance of nothing in round 2) should cancel out. We have to tell them that in expected utility, the preference should be consistent regardless of the common branch. We also cannot rule out all alternative explanations (like probability weighting) without more controlled experiments. We will have to explain the Allais paradox and the independence axiom in the debrief, but only after they have experienced the inconsistency.

  Revised rounds with correct Allais structure:

  But to avoid complex percentages, we can use:

  Round 2:
    Option A: $10 for sure.
    Option B: 90% chance of $11, 10% chance of $0.

  Round 4:
    Option C: 10% chance of $10, 90% chance of $0.
    Option D: 10% chance of $11, 90% chance of $0.

  This is a common simplified version.

  Now, the rounds as read out:

  1. (Filler) "Round 1: Imagine we're giving away a discount. Option A: $10 off, guaranteed. Option B: $12 off, but only if you spend at least $15. Which do you choose? Write A or B."

  2. (Allais first) "Round 2: You have two options. Option A: You get $10 for sure. Option B: 90% chance you get $11, but a 10% chance you get nothing. Which do you choose? A or B."

  3. (Filler) "Round 3: Imagine you bought a book for $10, but it's damaged. Option C: Full $10 refund, guaranteed. Option D: 50% chance of a $22 refund, 50% chance of no refund. C or D?"

  4. (Allais second) "Round 4: Now, Option C: 10% chance of winning $10, 90% chance of nothing. Option D: 10% chance of winning $11, 90% chance of nothing. C or D?"

  5. (Delegated) "Round 5: Choose for the person on your left. The options are the same as in round 2: Option A: $10 guaranteed. Option B: 90% $11, 10% nothing. Write A or B, but remember it's for your neighbor."

  6. (Bidding) "Round 6: Now, a different task. Consider a gamble: 50% chance of winning $15, 50% chance of winning $5. What is the smallest guaranteed amount of money you would accept to give up this gamble? Write a dollar amount."

  7. (Near-miss) "Round 7: Last choice. Option R: 10% chance of winning $10, 90% nothing. Option S: 11% chance of winning $9.90, 89% nothing. R or S?"

  Timeline and debrief adjusted accordingly.

  Debrief:

  After collecting all cards and randomly selecting the round to play (by drawing a round number and then, if needed, flipping a coin for the gambles), we tabulate the results for each round on the board.

  Then:

  "In round 2, how many chose A? How many B? In round 4, C? D? Now, if you chose A in round 2 and D in round 4, please raise your hand. [Similarly, B and C?] Notice that in round 2, you preferred the sure $10 over the gamble. In round 4, you preferred the 10% chance of $11 over the 10% chance of $10. But why? In both cases, the difference is $1 in the winning branch. In round 2, the gamble had a 10% chance of nothing, which scared you. In round 4, both have a 90% chance of nothing, so you went for the extra dollar. But the 10% chance of nothing in round 2 is the same as the 90% chance of nothing in round 4? Actually, they are both a chance of nothing, but the context is different: in round 2, you are giving up a sure thing to take that risk, but in round 4, there is no sure thing."

  Then we look at round 5: "For others, did you choose the gamble more often? [Compare the proportion of B in round 5 vs round 2.] If so, maybe when choosing for others you are less afraid of making them get nothing."

  Round 7: "In round 7, how many chose R? How many S? Why? Note that S has a higher expected value (about $1.09) than R ($1.00), but if you chose R, maybe you like the round numbers or don't trust the 1% difference."

  Round 6: "In the bidding round, what amounts did you write? If you wrote more than $10, that means you are risk averse for that 50-50 gamble."

  Finally, we can name the Allais paradox and explain that it challenges the idea that we decide only by the final outcomes and their probabilities.

  What the activity cannot show: The formal independence axiom and the mathematical derivation of expected utility. We cannot prove that the preferences violate expected utility without showing the linearity in probabilities. We have to explain that in expected utility, the common consequence (the 90% chance of $0 in round 4) should not affect the preference between the two options in the winning branch. But in reality, it does. Also, we cannot distinguish between regret theory and prospect theory without more data. We have to tell them that there are multiple theories (like prospect theory) that explain this by how we weight probabilities and how we perceive gains and losses.

  This should fit within the constraints.
answer: |-
  ### The Idea in Plain Words
  Participants should feel the tension between their choices in two seemingly similar scenarios and question why they acted differently. They'll experience that a guaranteed outcome feels uniquely safe, making them avoid a small risk even when the alternative gamble is mathematically better. When the guarantee disappears, they'll notice they focus more on maximizing potential gains. The key takeaway is an intuitive sense that context—especially the presence of certainty—shifts how they weigh risks and rewards, beyond just the numbers.

  ### Setup, Materials, and Stakes
  **Materials:** Whiteboard, markers, index cards (one per participant per round), pens, a coin, and a sealed envelope containing the name of one random round (e.g., "Round 3").  
  **Stakes:** Each round, participants choose between options. After all rounds, you draw the sealed envelope to reveal which round is "real." In that round, one participant (chosen by coin flip) gets their choice: if they picked a guaranteed sum, they win a $10 voucher; if a gamble, you simulate the odds (e.g., roll a die) to determine if they win a voucher or nothing. Total cost: one $10 voucher.

  ### The Rounds (Read Aloud)
  *Read each round slowly. Write options on the board as you describe them. Pause for 60 seconds after each for decisions. Collect cards immediately.*  

  1. **Filler (Framing):** "Round 1: You’re offered a discount. Option A: $5 off, guaranteed. Option B: $6 off, but only if you buy two books. Which do you pick? Write A or B."  
     *Board: A: $5 off sure. B: $6 off if two books.*  

  2. **Guaranteed vs. Risk (Allais 1):** "Round 2: You win money! Option X: $10 guaranteed. Option Y: 90% chance of $11, 10% chance of $0. Which? Write X or Y."  
     *Board: X: $10 sure. Y: 90% $11, 10% $0.*  

  3. **Filler (Loss Context):** "Round 3: Your book arrives damaged. Option C: Full $8 refund, guaranteed. Option D: 80% chance of a $10 refund, 20% chance of $0. Write C or D."  
     *Board: C: $8 sure. D: 80% $10, 20% $0.*  

  4. **Risky vs. Riskier (Allais 2):** "Round 4: Another win! Option P: 10% chance of $10, 90% chance of $0. Option Q: 11% chance of $11, 89% chance of $0. Which? Write P or Q."  
     *Board: P: 10% $10, 90% $0. Q: 11% $11, 89% $0.*  

  5. **Delegated Choice:** "Round 5: Choose for the person to your right. Same as Round 2: Option X: $10 guaranteed. Option Y: 90% $11, 10% $0. Write X or Y for them."  
     *Board: (Same as Round 2)*  

  6. **Bidding Round:** "Round 6: Consider a gamble: 50% chance of $15, 50% chance of $5. What’s the smallest guaranteed amount you’d take instead? Write a dollar number, like '$7'."  
     *Board: Gamble: 50% $15, 50% $5. Your guaranteed minimum?*  

  7. **Near-Miss Variant:** "Round 7: Final choice! Option R: 10% chance of $10, 90% chance of $0. Option S: 11% chance of $9.90, 89% chance of $0. Which? Write R or S."  
     *Board: R: 10% $10, 90% $0. S: 11% $9.90, 89% $0.*  

  ### Timeline (90 Minutes Total)
  - **0–5 mins:** Introduce the session: "We’ll explore how we make choices. Each round, decide quietly. One round will be real—I’ll pick it randomly at the end."  
  - **5–20 mins:** Rounds 1–2 (read, write, collect).  
  - **20–35 mins:** Rounds 3–4.  
  - **35–50 mins:** Rounds 5–6.  
  - **50–65 mins:** Round 7 + filler discussion: "Chat with a neighbor: Which round felt hardest?" (Keep light; no theory.)  
  - **65–75 mins:** Resolve the "real" round: Draw the envelope, pick a participant via coin flip, execute their choice.  
  - **75–90 mins:** Debrief (see below).  

  ### Debrief  
  **Key Moment Mapping:**  
  - **Round 2 vs. Round 4:** Most will choose X (guaranteed) in Round 2 but Q (riskier) in Round 4. Highlight this on the board: "In Round 2, you avoided a 10% risk of $0. In Round 4, you chased an extra $1 despite near-identical risk. Why?" This forces the intuition: certainty in Round 2 made the risk feel scarier, but without it in Round 4, the focus shifted to maximizing upside.  
  - **Near-Miss (Round 7):** If many choose R (10% $10) over S (11% $9.90), note: "S has a higher expected value ($1.09 vs. $1.00), yet you picked R. This suggests the round number $10 or the exact 10% chance 'feels' better—it’s not just the math." Use this to challenge the "dull arithmetic" explanation: if people handled numbers rationally, S would always win.  
  - **Delegated Choice (Round 5):** Compare to Round 2. If more pick Y (gamble) for others, say: "When choosing for yourself, you feared regret if Y lost. For others, that fear faded." This supports the "comparison to the unlucky branch" idea.  
  - **Bidding (Round 6):** Share the range of bids (e.g., "$6 to $12"). Most bids will exceed $10 (the gamble’s expected value). Say: "You demanded extra to give up the gamble—this is risk aversion. But it doesn’t explain why Round 2 and 4 choices conflict."  

  **Prise Apart Explanations:**  
  1. **"Not comparing final amounts" (your idea):** Delegated choice reduces self-focused regret, so more risk-taking for others. Near-miss shows attachment to salient outcomes ($10) over optimal ones ($9.90).  
  2. **"Guaranteed floor overvalued":** Bidding shows risk aversion, but Round 4’s preference for Q (no floor) contradicts this as the sole factor.  
  3. **"Don’t believe the chances":** Near-miss tests this—if they distrusted 11%, they’d avoid S. If they pick S, they trust the odds; if not, distrust or round-number bias dominates.  

  ### What Will Go Wrong  
  - **Misunderstanding probabilities:** Say "90% chance" while pointing to the board. If confused, rephrase: "Imagine 100 people: 90 win $11, 10 get nothing."  
  - **Spotting the Allais pattern:** Filler rounds and varied framings (discounts, refunds) hide it. If someone notices, say: "Interesting! We’ll discuss later—decide as you feel now."  
  - **Bidding round confusion:** Some may write "yes" or "no." Clarify: "Write the dollar amount, like '$7'." If bids are inconsistent (e.g., $15 for a $10 EV gamble), skip them in debrief.  
  - **Delegated choice awkwardness:** If participants laugh or resist, remind them: "Choose as if it were you—no pressure, it’s hypothetical."  

  ### What the Activity Cannot Show  
  The activity reveals the *inconsistency* (preferring certainty in one context but not another) but cannot explain *why* expected utility theory fails. You must clarify: "Rational choice assumes we evaluate branches independently. Here, the 90% 'nothing' branch in Round 4 is identical to the 10% 'nothing' risk in Round 2—so we should treat the $10 vs. $11 part the same. But we don’t. This violates the 'independence axiom,' a core rule in economics. Theories like regret or prospect theory explain it by how we *feel* about outcomes, not just the math."
