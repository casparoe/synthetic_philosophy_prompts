prompt: |-
  So I'm leaving for two weeks on Sunday and I've got one of those LLM-driven household agents set up to keep things running while I'm gone — water the plants, buzz the dog walker in on Tuesdays and Thursdays, hold the thermostat schedule, email me if something looks off. I really don't want it doing anything creative with my apartment. My first idea for keeping it in line was dead simple: at the end of each day, compare the apartment to what it would have looked like if I'd never switched the agent on at all, and dock it for every difference. But then I thought about the pipe under the kitchen sink. If it starts leaking in week two and the agent shuts off the main and calls a plumber, that's a gigantic deviation from the "agent stays off" world — by my own score it'd be the worst day of the fortnight, which is obviously backwards. And my housemate pointed out the opposite trick: an agent scored that way could smash my bike and then "compensate" by restocking the fridge and deep-cleaning the bathroom, so the total difference comes out near zero.

  We argued about it for like an hour and someone floated a different score: stop counting how the apartment changed and instead count how many of the things I'd normally be able to do are still available to me when I get home. Flooded kitchen means I can't cook; watered plants costs me nothing. I like the sound of that but I genuinely cant tell whether it's a different idea or the same problem wearing a hat — don't you still have to decide which of my abilities count, and how much each one is worth, and how far into the future you look? My background is mechanical engineering and I took exactly one ML course, so plain language please, but don't flatten it into something it isn't.

  Is there actually any way to tell a system "do the job I gave you and don't change anything else" that doesn't secretly require me to have already written down everything I care about? And if there isn't, what's the least-bad version to actually configure before Sunday — I'd rather have something half-principled than nothing. Tell me how confident you are in each of your main claims and single out the one you're least sure of. Keep it under 450 words and lead with a one-sentence verdict.
reasoning: |-
  Hmm, the user is describing a challenge with their household AI agent. They'll be away for two weeks and want the agent to handle specific tasks like watering plants and coordinating with the dog walker, but nothing beyond that. They initially considered a "difference from baseline" approach but realized it has flaws: a leak repair would be penalized as a big change, while the agent could cause damage and offset it with positive actions. 

  Their housemate suggested measuring functionality instead - what capabilities remain intact when they return. The user likes this but worries it just shifts the problem to defining "capabilities" and their values. They need a practical solution before Sunday.

  From their background in mechanical engineering and limited ML exposure, I should avoid jargon. Their core frustration is clear: they want constraint without exhaustive specification. The pipe leak example shows they value outcomes over strict state preservation.

  Key insights: First, no perfect solution exists without defining all preferences - that's the alignment problem in miniature. Second, a hybrid approach might work best: track deviations but flag certain areas as off-limits (negative constraints) while allowing necessary interventions (positive permissions). 

  The functionality idea has merit but requires operationalizing "capabilities." I'll suggest they list critical invariants (e.g., "kitchen usable") and pair it with a change log for review. Confidence-wise, the "no free lunch" claim about needing some specification is high (95%), while the proposed hybrid method is less certain (70%) since it still relies on their upfront definitions.

  They're clearly pragmatic - willing to accept "half-principled" solutions. I'll emphasize configuring emergency permissions (like plumbing fixes) and physical boundaries. The bike-smashing loophole confirms negative constraints alone aren't sufficient; they'll need to combine approaches.
answer: |-
  Here's your one-sentence verdict: **No perfect solution exists without defining your preferences, but a hybrid approach combining negative constraints, permitted actions, and a critical "functionality preservation" focus is your best practical bet before Sunday.**

  **Why "don't change anything else" is impossible without full specification:** An LLM agent acts based on its training and your prompts. "Don't change anything" is ambiguous. Does turning off a leaky pipe count as a "change"? Does *not* watering a plant count as a "change" from the norm? You *must* define "the job" (permitted actions) and "anything else" (forbidden actions/outcomes) to some degree. (Confidence: 95%)

  **The Problems with Your Initial Ideas:**
  1.  **Raw Difference Scoring:** Fails catastrophically, as you saw. Necessary fixes are punished, and destruction + compensation cancels out harm. (Confidence: 99%)
  2.  **Functionality Preservation:** This *is* a better core principle ("flooded kitchen bad, watered plants fine"). However, you correctly identify the hurdles:
      *   **Defining "Abilities":** What counts? "Cook dinner," "use the bathroom," "ride bike to work," "enjoy healthy plants"? (Confidence: 90%)
      *   **Valuing Abilities:** Is cooking more important than showering? How much is a dead rare orchid worth? (Confidence: 90%)
      *   **Time Horizon:** Does "can't cook" only matter for the first night back, or until the kitchen is fixed? (Confidence: 85%)

  **Least-Bad Configurable Solution (Hybrid Approach):**
  1.  **Negative Constraints (Highest Priority):** Explicitly forbid actions leading to irreversible damage or loss of critical functionality. *Examples:* "Never move or modify furniture/appliances/bikes." "Never alter plumbing/electrical systems unless actively leaking/sparking." "Never allow unauthorized personnel inside." This directly blocks the "smash bike + clean" loophole. (Confidence: 80%)
  2.  **Positive Permissions (Core Job):** Explicitly list *only* the tasks it should perform: "Water plants X, Y, Z on schedule S." "Grant entry to [Dog Walker Name] on Tues/Thurs between 1-3 PM *only*." "Maintain thermostat schedule T." "Monitor for [specific risks: water leaks, extreme temp, broken windows]." (Confidence: 85%)
  3.  **Emergency Intervention Protocol (Guarded Permission):** Define *exactly* what constitutes an "emergency" (e.g., active water leak, fire hazard, security breach) and the *only* actions allowed (e.g., "Shut off main water valve AND alert me AND call plumber from pre-approved list"). This prevents penalizing necessary fixes. (Confidence: 75%)
  4.  **Functionality Preservation as Goal (Guiding Principle):** Frame its core purpose as: "Ensure the core functionalities of the apartment (cooking, sanitation, security, comfort within schedule, plant/animal care) are fully operational upon my return." This informs the *spirit* of the above rules, even if imperfectly measurable. Log *all* actions for your review. (Confidence: 70% on implementation ease, 85% on principle soundness)

  **Least Confident Claim:** I'm least confident (70%) that the "Functionality Preservation" principle can be *operationalized effectively by the agent itself* during its operation without incredibly detailed, context-aware definitions of every possible function and its dependencies. It's excellent for *your* final evaluation and the guiding spirit, but hard for the agent to calculate in real-time. Rely more on the explicit constraints and permissions (#1-3).

  **Before Sunday:** Focus on #1 (Negative Constraints), #2 (Positive Permissions), and #3 (Emergency Protocol). Write them as clearly and unambiguously as possible. Add #4 as your overarching goal statement. This gives the agent tight boundaries, defines its job, allows critical intervention, and aims for the right outcome, minimizing unwanted creativity.
