  The user's rejection of "easy outs" suggests they want real emotional weight. I should avoid making Ezra villainous or heroic - his motives (revenge/vindication) should stay ambiguous. Marla's decision needs to feel inevitable yet painful, with lasting consequences. Maybe her father's attachment to the painting could be the human counterweight to the curator's academic concerns.

  For structure, I'll start with the discovery scene to ground us in Marla's expertise. The technical details should feel authentic but vague per the user's request - no microscope brand names. Then introduce the documents through Ezra's confession scene, where his trembling hands might reveal more than his words. The board meeting should have conflicting voices: a pragmatic director, an ethically rigid curator, maybe a sentimental trustee. No one gets to monologue about art philosophy.

  The climax requires Marla to act, not ponder. Perhaps she could authenticate while secretly damaging the forged documents? But that feels too clever. Better to have her choose institutional duty over personal connections, leading to that heartbreaking moment when her father doesn't recognize the secured masterpiece. The final image of the empty stairwell haunts precisely because it's concrete - no abstraction needed.

  Key things to avoid: making Marla passive, simplifying the moral dilemma, or letting any character be a mouthpiece. The pain should come from seeing the guard polish an absent painting's frame, not from anyone explaining why that's sad. And crucially - no last-minute saves. The painting must leave forever.

  This approach should give the user usable "bones": the confession scene dynamics, the boardroom tension without lectures, the specific loss embodied in the father's confusion. They can adapt the emotional beats to their novel's voice. The frozen canal metaphor might even deepen their existing imagery. Most importantly, it demonstrates how to make philosophical weight emerge from action rather than dialogue.
