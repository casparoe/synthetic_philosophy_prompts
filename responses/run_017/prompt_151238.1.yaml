prompt: |-
  im a junior and I got nerd-sniped by this after our school polled all 900 students on whether to switch the lunch schedule and the poll somehow beat the three teachers who had actually looked at the numbers. I started reading about Condorcet's jury theorem and now ive built an argument that I'm pretty sure is broken somewhere but I can't see where.

  (1) Jury theorem: if everyone independently has, say, a 60% chance of picking the better of two options, the majority does way better than any one person does, and as the group grows the majority's accuracy climbs toward 100%.
  (2) Independence is the fake part though. Real people read the same posts, copy each other, get spooked by the same rumor. So part of each person's error is shared — one common lean that pushes everybody the same direction.
  (3) The independent part of the error cancels out as you add people. That's the whole engine of the theorem.
  (4) The shared part doesn't cancel. It's the same for everybody, so averaging over more and more people can't touch it.
  (5) So in a huge group the shared lean is all that's left over, and it decides the outcome by itself: the majority is right exactly when the lean happens to point the right way, meaning accuracy heads to 50%, not 100%.
  (6) 50% is worse than the 60% you'd get by just asking one person. And if the lean points the wrong way at all, big groups are worse than useless.
  (7) So any real group decision is worth less than asking one random person, and the bigger the group the worse it does. Which is nuts given what happened with our lunch poll.

  I really want to keep (2), (3) and (4), they feel like the honest description of how people actually work, and I want to keep the theorem itself. So I guess I'm rejecting (5) or (6), but I can't say what's wrong with them without it sounding like I'm just refusing the conclusion because I don't like it.

  Can you tell me which step actually breaks and what giving it up costs me? Four sections, in this order: "Which step breaks" (about 150 words), "Why it looked fine" (about 100 words), "What it costs me" (about 200 words), "Bottom line" (about 50 words).
reasoning: |-
  Hmm, the user is a junior student who got nerd-sniped by their school's lunch schedule poll where 900 students voted against the teachers' recommendations. They've built an argument about Condorcet's Jury Theorem that leads to a counterintuitive conclusion: that group decisions are worse than individual ones due to shared errors. They want me to identify which step breaks in their reasoning, explain why it seemed plausible, what giving it up costs them, and give a bottom-line summary.

  Their argument has seven steps. Step (1) states the jury theorem correctly: with independent 60% accurate voters, majority accuracy approaches 100% as group size increases. Steps (2)-(4) introduce shared error ("common lean") that doesn't cancel out—this seems legitimate as a model for real-world dependencies. Step (5) claims that in huge groups, only the shared lean matters, driving accuracy to 50%. Step (6) concludes this is worse than individual accuracy (60%), making groups useless or harmful. Step (7) generalizes this to all real group decisions.

  The flaw is in step (5). The user assumes that the "shared lean" dominates completely in large groups, reducing accuracy to 50%. But this oversimplifies the error structure. In reality, voter errors have both shared and independent components. The shared part introduces bias, but the independent part still cancels out as per the theorem. So, the majority accuracy doesn't plunge to 50%; it converges to the probability that the shared error points in the correct direction. If the shared error is neutral or slightly biased, accuracy could still be high—for example, if the "common lean" is 55% likely to be correct, majority accuracy approaches 55%, not 50%. Only in extreme cases where the shared error is completely random or adversarial does it hit 50%.

  Step (5) looked fine because the user correctly noted that shared error doesn't cancel, but they mistakenly treated it as the sole factor, ignoring that the independent errors vanish, leaving a mixture. This happens because in their mental model, the shared part "decides the outcome by itself" when amplified by many voters, but that's only true if the independent part is negligible, which it isn't in the convergence process.

  Giving up step (5) costs the user a clean, pessimistic narrative. They have to accept that real groups aren't doomed to 50% accuracy; the outcome depends on how informed the shared influences are. For instance, in their school poll, if students shared accurate information (like social media posts highlighting benefits), the "lean" could be right more often, leading to high group accuracy despite dependencies. This means group decisions can be valuable if the common sources are reliable, but it introduces complexity: we must assess the quality of shared information, which varies by context. It doesn't invalidate their core insight about dependency risks—groups can indeed fail if biases are strong—but it prevents blanket dismissal of collective wisdom.

  Bottom line: Group accuracy converges to the reliability of the shared influences, not automatically to 50%, so well-informed groups can still outperform individuals.
answer: |-
  ### Which step breaks
  Step (5) is flawed. You claim that in a huge group, the "shared lean" dominates entirely, reducing majority accuracy to 50%. This assumes the shared error component *always* pushes everyone uniformly and is perfectly uncorrelated with the truth, making it equivalent to a coin flip. But real shared influences (e.g., news, rumors) often have *some* correlation with reality. The accuracy doesn’t drop to 50%; it converges to the probability that the *shared bias itself points toward the correct option*. If the common information source is 55% reliable, group accuracy approaches 55%, not 50%. Only if the shared error is completely arbitrary (50/50) does it converge to 50%.

  ### Why it looked fine
  The logic seemed sound because you correctly noted that shared error doesn’t cancel (step 4), and that independent error vanishes in large groups (step 3). This makes it intuitive that the shared component "swamps" the outcome. However, you implicitly treated the shared lean as purely random noise, ignoring that shared information (e.g., a persuasive social media post) often has inherent reliability. If the shared source has *any* tendency toward truth (even 51%), the group’s limit accuracy exceeds 50%.

  ### What it costs me
  Accepting this flaw costs the satisfyingly universal (but overly bleak) conclusion that all large groups are worse than individuals. Instead, real-world group accuracy depends critically on the *quality* of shared influences. If common information is reliable (e.g., experts sharing data), group accuracy can still approach 100% despite dependencies, as the shared "lean" amplifies correctness. If shared sources are misleading (e.g., viral misinformation), accuracy plummets toward the reliability of that bias—which could be *below* individual competence. Your core insight about dependency’s danger holds, but it’s contextual: groups amplify the *accuracy of their dominant information sources*, good or bad. In your lunch poll, students likely shared arguments with *some* merit, making 900 voters collectively sensitive to those points—potentially outweighing teachers' isolated analysis if the shared student perspective was unexpectedly valid.

  ### Bottom line
  Groups don’t default to 50% accuracy; they inherit the reliability of their shared information ecosystem, which can still exceed individual judgment.
