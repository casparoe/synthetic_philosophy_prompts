  Looking at the updating rules first, the core tension is between self-sampling (Rule A) and self-indication (Rule B). Rule A treats one's rank as random evidence, while Rule B weights hypotheses by their total observers. The literature shows this is a fundamental divide in anthropic reasoning. For the reference class, restricting to inquirers introduces complications - is their status self-locating evidence or ordinary evidence? The reversal effect they observed makes sense mathematically but feels like it might be double-counting.

  For real-world relevance, even if the argument works in toy cases, it gets swamped by empirical evidence about existential risks. Our knowledge of physics and technology dominates any anthropic prior shift. And reference class problems become even messier with real humans.

