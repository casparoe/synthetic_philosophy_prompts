prompt: |-
  I run my city's rationality meetup and I've got a 90-minute slot in two weeks on takeoff speeds. Crowd is maybe a dozen: two ML engineers, a biologist, a lawyer, and a handful of people who read the Sequences back in 2014 and have been quietly lurking ever since -- so they've all absorbed the foom-versus-gradualism fight as a vibe without ever having the actual crux handed to them. Don't write the talk, I want the skeleton.

  My sense is that fast-vs-slow is the wrong axis and I want to teach something I've been calling veto points: the number of moments at which the people building the thing could still have collectively said no. The counterintuitive bit I want them to actually feel is that a takeoff that takes fifteen years can have fewer veto points than one that takes fifteen months, because every individual step is defensible under competitive pressure and there's never a moment where 'stop' is the live option.

  So: what has to be in place before that even makes sense to them? I'm guessing capability-level-is-not-rate-of-improvement and capability-is-not-deployment both have to land first, but tell me if I've got the depedency order wrong or if something else needs to come before either. What's the one concrete scenario to build the whole session around? I was going to use a toy research loop with doubling times, but I worry that makes the slow case invisible, and it also can't be robotics or they'll smuggle in 'the physical world is slow so the AI is slow'. Tell me what the example has to have and what it has to lack.

  Then: the misconceptions to expect, and exactly where in the arc to cut each one off. I'm anticipating 'slow takeoff means we get decades to react' and 'fast takeoff means one model wakes up and takes over', but you probably know others. I also want them to get the difference between capability-gradualism and diffusion-gradualism, including the overhang case -- systems much better than anything actually deployed, waiting on adoption friction to clear -- but I'm not sure where that goes or whether it'll just muddle things for this crowd, so tell me if it belongs. And what should I explicitly refuse to get into at this level and say out loud that I'm refusing?

  Last thing: one question I can ask in the last ten minutes that separates someone who has the ratio idea from someone who's just memorised continuous-good-discontinuous-bad.
reasoning: |-
  We are building a 90-minute session on takeoff speeds with a focus on "veto points." The goal is to shift the discussion from fast-vs-slow to the number of moments where humans could have collectively said "stop" to the development. The counterintuitive point: a slow takeoff (e.g., 15 years) can have fewer veto points than a fast one (15 months) because each step in the slow case is individually defensible and there's never a clear moment to stop.

  Key concepts that must be established first:
  1. **Capability level is not the rate of improvement**: The current level of AI capability (e.g., how smart the AI is) is distinct from how quickly that level is changing.
  2. **Capability is not deployment**: The AI's inherent abilities (capabilities) are not the same as how widely they are being used (deployment). There can be a gap (overhang) where capability is high but deployment is low due to adoption friction.

  Dependency order: Start with (1) and then (2). Without these, the veto points concept will be muddled.

  ### Core Example
  We need an example that:
  - Must have: 
    - A sequence of improvements that are individually small and defensible (so no obvious stopping point).
    - Competitive pressure that forces actors to keep going.
    - The potential for a long timeline (to illustrate slow takeoff) but with few veto points.
  - Must lack:
    - Physical robotics (to avoid the "physical world is slow" bias).
    - A single dramatic breakthrough (which would naturally create a veto point).

  **Suggestion: Use a software development example, specifically the evolution of algorithmic trading systems.**

  #### Why this example?
  - It's purely digital, avoiding the physical world slowdown.
  - It can have a long timeline (e.g., 15 years of incremental improvements) but with each step being a small optimization.
  - Competitive pressure is intense: if you don't make the next improvement, your competitor will and you go out of business.
  - There's no single moment where the system becomes "too powerful" or dangerous in a way that would trigger a collective stop. Instead, the system becomes increasingly complex and autonomous over time.

  ### Concrete Scenario: Evolution of High-Frequency Trading (HFT) Systems
  - **Starting point**: Simple automated trading that follows predefined rules (e.g., buy when the 50-day moving average crosses above the 200-day).
  - **Incremental steps**:
    - Step 1: Add more data sources (e.g., news feeds, social media sentiment).
    - Step 2: Improve the speed of execution (from seconds to milliseconds to microseconds).
    - Step 3: Incorporate machine learning for better prediction (linear models, then shallow neural nets, then deep learning).
    - Step 4: Automate more of the decision-making (e.g., self-adjusting parameters, self-modifying code for adapting to market conditions).
    - Step 5: Network effects: systems start interacting and adapting to each other, leading to emergent behaviors that no single designer intended.
  - **Veto points**: At each step, the improvement is small and necessary to stay competitive. There's never a clear point where the system becomes "too autonomous" or "too fast" to stop. Even if someone raises concerns, the competitive pressure forces everyone to keep going.

  ### Structure of the Session (90 minutes)
  1. **Introduction (10 minutes)**
     - Frame the problem: The standard axis of fast vs. slow takeoff is misleading. We care about control and the ability to stop.
     - Preview: We'll introduce the concept of veto points and show that a slow takeoff might have fewer.

  2. **Foundation 1: Capability Level vs. Rate of Improvement (15 minutes)**
     - Explain: Capability level = how smart/powerful the AI is. Rate of improvement = how fast that level is rising.
     - Example: Two AIs, one at a higher capability level but improving slowly, another at a lower level but improving very fast.
     - Exercise: Ask the group to think of real-world examples (e.g., AlphaGo vs. a new AI that learns faster but hasn't played as many games).

  3. **Foundation 2: Capability vs. Deployment (15 minutes)**
     - Explain: Deployment is about how widely the capability is used. Capability overhang occurs when the AI can do more than what it's currently allowed to do (or what has been integrated into products).
     - Example: A language model that can write code (capability) but is only deployed as a chatbot (deployment). The gap is due to safety checks, regulation, or slow adoption.
     - Exercise: Ask for examples of capability overhang in current systems (e.g., self-driving cars that can handle more situations than they are allowed to on public roads).

  4. **Introducing Veto Points (20 minutes)**
     - Define: A veto point is a moment when the collective decision to stop development is a live option (i.e., politically and economically feasible).
     - Present the HFT scenario step-by-step. For each step, ask: "Would this step have been stopped? Why or why not?" Emphasize competitive pressure and the small defensibility of each step.
     - Counterintuitive punchline: The slow, 15-year evolution of HFT had very few veto points because at no step was there a compelling reason to stop. Contrast with a hypothetical 15-month scenario where a sudden breakthrough in AI (e.g., an algorithm that can recursively self-improve) might create a clear veto point (if people recognize the danger and act).

  5. **Addressing Misconceptions (15 minutes)**
     - **Misconception 1**: "Slow takeoff means we get decades to react."
       - Cut off: Right after introducing the veto points concept. Explain: Time doesn't matter if there are no moments to actually intervene. The slow takeoff might have no meaningful veto points, so we don't get to use that time.
     - **Misconception 2**: "Fast takeoff means one model wakes up and takes over."
       - Cut off: During the HFT example. Explain: Even a fast takeoff might be the result of many small steps (just compressed in time). The key is the presence of veto points, not the speed. Also, a fast takeoff might have a clear veto point (if we can recognize it) but that doesn't mean it will be taken.
     - **Misconception 3 (anticipated)**: "But in the slow case, we can regulate step by step."
       - Address: In the HFT example, note that regulation often lags and is designed for the last step, not the next one. Competitive pressure leads to secrecy and regulatory evasion.
     - **Capability-gradualism vs. Diffusion-gradualism**: 
       - Include this? Yes, but briefly. It helps explain why deployment might be slow even if capability isn't. Place it during the capability vs. deployment section. Clarify:
         - Capability-gradualism: The AI's intelligence improves slowly.
         - Diffusion-gradualism: The deployment and integration of AI into society is slow (even if capability jumps).
       - But note: The veto points concept applies to capability development, not deployment. Deployment might have its own veto points (e.g., regulatory approvals) but that's a separate issue.

  6. **What We're Not Covering (5 minutes)**
     - Explicitly refuse to get into:
       - The likelihood of takeoff scenarios (we're assuming the scenario to explore the structure).
       - The technical details of AI alignment (this is about the societal/political process).
       - The exact number of veto points in current AI development (this is a conceptual tool, not a measurement).

  7. **Final Question (10 minutes)**
     - **Question**: "Imagine two scenarios: 
       - Scenario A: AI capability improves slowly over 20 years, with each year's new model being 10% better than the last. 
       - Scenario B: AI capability stays flat for 19 years, then in year 20 it improves by 500% due to a single breakthrough. 
       - In which scenario are there more veto points? Why?"
     - **Why this question?** 
       - The intuitive answer (B has one clear veto point at the breakthrough) might be correct, but the point is to check if they see that in A, there might be no veto points at all (if each 10% step is defensible). 
       - It separates those who see the ratio (veto points per unit time or per unit capability gain) from those who just think "gradual=good, fast=bad". 
       - The person who gets it will argue that A might have zero veto points (if no step is big enough to trigger a stop) while B has at least one (if the breakthrough is recognized as dangerous).

  ### Materials Needed
  - Whiteboard or slides for the HFT step-by-step example.
  - A slide for the two foundations (capability level vs. rate, capability vs. deployment).
  - A slide for the final question.

  ### Timing Breakdown
  - Introduction: 10 min
  - Foundation 1: 15 min
  - Foundation 2: 15 min
  - Veto Points (including HFT example): 20 min
  - Misconceptions: 15 min
  - What we're not covering: 5 min
  - Final question and discussion: 10 min

  This structure ensures that the prerequisites are covered, the core concept is illustrated with a tangible example, and common misconceptions are addressed. The final question tests for understanding of the key insight.
answer: |-
  ### Session Skeleton: Veto Points in AI Takeoff  
  **Core Goal:** Replace "fast vs. slow" with "veto points" as the key axis. Teach that a slow takeoff (e.g., 15 years) can have *fewer* moments to halt progress than a fast one (15 months) due to competitive pressures and incremental defensibility.  

  ---

  ### **I. Prerequisites (25 min)**  
  *Must land these first to avoid fatal confusion. Use concrete, non-AI analogies.*  
  1. **Capability Level ≠ Rate of Improvement (10 min)**  
     - **Concept**: Distinguish between "how smart the AI is" (capability level) and "how fast it gets smarter" (rate).  
     - **Analogy**: A student’s math skill (level) vs. how quickly they learn new concepts (rate). A slow learner may still reach calculus.  
     - **Why**: Prevents conflating current AI weakness with slow takeoff.  

  2. **Capability ≠ Deployment (15 min)**  
     - **Concept**: What AI *can* do (capability) vs. what it *is doing* in the real world (deployment). Highlight "overhang" (capability exceeds deployment).  
     - **Analogy**: A lab-designed virus (high capability) vs. its controlled, limited release (deployment). Overhang = virus sitting in a freezer.  
     - **Why**: Explains why slow deployment ≠ slow capability gain. Prevents "physical world = slow takeoff" smuggled assumptions.  

  ---

  ### **II. Core Example: Build the Intuition (25 min)**  
  *Use a scenario that forces focus on incremental defensibility and competitive pressure.*  
  **The "Corporate Algorithm" Scenario**  
  - **What it must have**:  
    - A series of small, seemingly harmless upgrades (e.g., optimizing ad-targeting algorithms).  
    - Intense market competition (e.g., "If we don’t deploy this, our rival will").  
    - No clear "off-ramp" (each step is framed as necessary for survival).  
  - **What it must lack**:  
    - Physical hardware (avoid robotics/real-world inertia).  
    - Obvious thresholds (e.g., no "AGI switch").  
  - **Narrative**:  
    1. Start with benign tools (e.g., A/B testing click rates).  
    2. Incremental steps: Add user data → predictive models → micro-targeting → automated real-time bidding.  
    3. End state: An opaque, profit-maximizing system with emergent manipulation power.  
  - **Key Insight**: Each step is defensible ("just business"), but the endpoint is harmful. No single step justifies a veto.  

  ---

  ### **III. Veto Points Deep Dive (20 min)**  
  1. **Define Veto Points**: Moments where "stop" is politically/economically feasible (e.g., regulation, public backlash, moratoriums).  
  2. **Slow Takeoff = Fewer Veto Points?**:  
     - In the "Corporate Algorithm" example:  
       - 15-year timeline, but no veto points. Why?  
         - Each upgrade is small, profitable, and normalized.  
         - Competition kills hesitation: "Pausing is suicide."  
     - Contrast with a 15-month "fast" scenario:  
       - A single, visible breakthrough (e.g., AI designs a novel weapon).  
       - Creates a clear veto moment (public panic, emergency summit).  
  3. **The Counterintuitive Hook**: Speed ≠ control. Slow, diffuse progress is *harder* to stop because it never feels urgent.  

  ---

  ### **IV. Cutting Off Misconceptions (10 min)**  
  *Preempt these exactly where they arise:*  
  - **"Slow takeoff = decades to react"**:  
    - **When**: During the Corporate Algorithm story (II).  
    - **Cutoff**: "Time without veto points is useless. If no one feels the need to stop, we won’t use those decades."  
  - **"Fast takeoff = one model wakes up"**:  
    - **When**: When defining veto points (III).  
    - **Cutoff**: "Fast takeoff could still have multiple veto points (e.g., during training runs). The issue is whether ‘stop’ is a live option."  
  - **"But regulation can force veto points!"**:  
    - **When**: During Q&A or veto points discussion (III).  
    - **Cutoff**: "Regulation lags. If each step is legal/defensible, regulators won’t act until it’s too late."  
  - **Capability-Gradualism vs. Diffusion-Gradualism**:  
    - **Include briefly in Prerequisites (I)** after Capability≠Deployment.  
    - **Define**:  
      - Capability-gradualism: Intelligence improves slowly.  
      - Diffusion-gradualism: Deployment/adoption is slow (even with fast capability gains).  
    - **Why**: Essential for veto points. Overhang (capability > deployment) means danger can build invisibly.  

  ---

  ### **V. Explicitly Avoid (5 min)**  
  *State upfront:*  
  - "We won’t debate timelines (e.g., 2030 vs. 2070) or specific tech (e.g., transformers). Focus on structural dynamics."  
  - "We won’t solve alignment. This is about *human* decisions, not AI intentions."  
  - "We won’t discuss ‘hard takeoff’ (e.g., minutes). Veto points require human-scale reaction times."  

  ---

  ### **VI. The Final Question (5 min)**  
  **"Imagine two scenarios:**  
  - **A**: AI advances via 1,000 tiny improvements over 10 years. Each is rolled out instantly by competing firms.  
  - **B**: AI advances in 5 big jumps over 2 years. Each requires new hardware, attracting public scrutiny.  
  **Which has more veto points? Why?"**  

  - **Why it works**:  
    - Correct answer (B) requires understanding that larger, visible steps create more "stop" opportunities.  
    - Reveals who memorized "gradualism=good" (they’ll say A) vs. grasps veto points (B has more chances to halt).  
  - **Wrong answers to probe**:  
    - "A is slower, so safer" → Misses incremental defensibility.  
    - "B is faster, so scarier" → Confuses speed with control.  

  ---

  ### **Timing Summary**  
  - Prerequisites (25 min)  
  - Core Example (25 min)  
  - Veto Points Deep Dive (20 min)  
  - Misconceptions (10 min)  
  - Final Question (5 min)  
  *Buffer: 5 min for intro/Q&A transitions.*  

  ### **Why This Works**  
  - **Dependency Order**: Capability≠Rate → Capability≠Deployment → Veto Points is correct. Overhang fits naturally as a deployment issue.  
  - **Crowd-Friendly**: The "Corporate Algorithm" avoids sci-fi tropes and makes slow takeoff’s invisibility visceral.  
  - **Anticipated Blind Spots**: Physically constrained folks (biologist?) will see deployment != capability. Lurkers get the "vibe" made explicit.
