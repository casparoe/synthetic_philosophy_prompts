answer: |-
  Below is a decision tree designed to map positions on directness and deception in pragmatics, based on concrete cases rather than theoretical labels. It focuses on your specified distinctions (e.g., assertion vs. ritual, shared pretense, silence, and norm clashes) and includes your requested cases. Paths merge where distinctions only matter given prior answers (e.g., nodes about silence or softening only activate if the utterance is treated as assertive). Use this by presenting a case (e.g., "Your friend asks for feedback on a bad draft"), then have students answer the branching questions sequentially. Their path reveals their underlying commitments. The tree isn't exhaustive—it avoids forcing false binaries and flags unresolvable splits.

  ---

  ### **How to read it (60 words)**
  Start at the top with a case (e.g., giving feedback on a bad draft). Answer each question based on your intuition, not theory. Paths merge when distinctions are irrelevant (e.g., if silence isn’t an option, skip silence-related nodes). Most questions only activate after certain answers (e.g., nodes about "softening" only matter if you’re in the "assertion" branch). Endpoints ("leaves") are named positions with awkward commitments. No prior ethics knowledge needed—just use cases.

  ---

  ### **The Tree (600 words)**
  **Start:** You’re about to say something negative/unwelcome (e.g., "Your draft has fatal flaws"), and a softer option exists (e.g., "It needs work" or silence).  
  **Cases to anchor each branch:**  
  - Friend’s bad paper draft (feedback).  
  - Referee report where softening misleads third parties.  
  - Something in someone’s teeth (trivial/frequent).  
  - "Tell me honestly, I can take it" request.  
  - Dutch supervisor giving feedback to a student trained in *reading the air* (cross-norm).  

  1. **Is this primarily about transferring information (assertion), or is it a ritual/expressive gesture (e.g., phatic "How are you?" that no one answers honestly)?**  
     - Ritual/gesture (e.g., complimenting a bad haircut to avoid awkwardness): **Go to Leaf A**.  
     - Assertion (e.g., critiquing a draft to improve it): **Go to 2**.  

  2. **Does the hearer already know the truth, or is everyone maintaining a shared pretense?**  
     - Shared pretense (e.g., praising a weak draft to avoid conflict when both know it’s bad): **Go to 2a**.  
     - Hearer lacks the truth (e.g., they think the draft is good): **Go to 3**.  
     - *Path merge: If "ritual" from 1, skip this node.*  
        - *2a. Is upholding the pretense essential here?*  
          - Yes (e.g., trivial case like an ugly gift): **Go to Leaf B**.  
          - No (e.g., referee report where pretense harms others): **Go to 3**.  

  3. **Is silence/deflection genuinely available without being misinterpreted (e.g., as agreement or evasion)?**  
     - Yes, silence speaks neutrally (e.g., not commenting on a haircut): **Go to 4**.  
     - No, silence would "speak" negatively (e.g., pausing when asked "Is my draft bad?" implies "yes"): **Go to 5**.  
     - *Path merge: If "ritual" or "pretense" from 1/2a, skip this node—silence isn’t the focus.*  

  4. **Would you stay silent?**  
     - Yes: **Go to Leaf C**.  
     - No: **Go to 5** (you must speak).  

  5. **If you speak, is a technically true but misleading statement (e.g., "Your draft is ambitious") better, worse, or no different from a flat lie (e.g., "It’s good")?**  
     - Better (less deceptive): **Go to Leaf D**.  
     - Worse (more manipulative) or no different (both dishonest): **Go to 6**.  

  6. **Is the bluntness about assessing the *other person* (e.g., "Your draft is bad") or disclosing *your* state (e.g., "I’m struggling with this draft")?**  
     - Assessing other (common in feedback): **Go to 6a**.  
     - Self-disclosing (e.g., "I feel confused"): **Go to 6b**.  
     - *Path merge: If "silence" from 4, skip this node.*  
        - *6a. Is blunt assessment acceptable without an explicit "be honest" request?*  
          - Yes: **Go to 7**.  
          - No: **Go to Leaf E**.  
        - *6b. Is blunt self-disclosure acceptable?*  
          - Yes: **Go to 7**.  
          - No (rare—see "Cells nobody lives in"): **Go to 7** (assume minimal conflict).  

  7. **In the long run, does consistent softening (e.g., always hedging criticism) devalue your speech (e.g., praise becomes meaningless, criticism unsayable)?**  
     - Yes (e.g., in referee reports, inflating praise harms credibility): **Go to 8**.  
     - No (e.g., in friendships, softening preserves bonds): **Go to Leaf F**.  
     - *Path merge: If you chose "misleading is worse" in 5, skip this node—it focuses on bluntness.*  

  8. **Who should bear the emotional/inferential work—speaker (softening) or hearer (decoding bluntness)?**  
     - Speaker (softening shows effort): **Go to Leaf G**.  
     - Hearer (bluntness respects their autonomy): **Go to Leaf H**.  
     - *Path merge: If "ritual" or "pretense" from 1/2a, skip—work-bearing isn’t central.*  

  **Final branch for cross-norm cases (e.g., Dutch supervisor vs. Japanese student):**  
  - After any leaf, ask: **If norms clash, whose norm governs—yours, theirs, or the local context’s?**  
    - Yours: **Add commitment: "Stick to your norm, even if it causes friction."**  
    - Theirs: **Add commitment: "Accommodate their norm to avoid misunderstanding." (Leaf I)**  
    - Local (e.g., institutional): **Add commitment: "Defer to context, even if it feels alien." (Leaf J)**  

  ---

  ### **The Leaves (350 words)**
  Each leaf names a position and highlights its most awkward commitment. Unnamed positions are theoretically possible but unoccupied.  
  - **Leaf A: Polite speech isn’t assertion.**  
    Commitment: Truth norms don’t apply—even if you say "Your draft is great" knowing it’s bad, it’s not a lie, just a gesture.  
  - **Leaf B: Relationship-first contextualism.**  
    Commitment: Upholding shared pretense (e.g., "Your gift is lovely!") can override truth to preserve harmony.  
  - **Leaf C: No white lies ever, but silence is fine.**  
    Commitment: In "must-speak" cases (e.g., "Tell me honestly"), you’re forced to be brutally direct.  
  - **Leaf D: Technically-true-misleading is the honest compromise.**  
    Commitment: Misleading with literal truth (e.g., "Your draft is ambitious") is ethical—but it erodes trust when spotted.  
  - **Leaf E: Care-first (bluntness is laziness in virtue’s clothing).**  
    Commitment: Bluntly assessing others (e.g., "Your draft is bad") without invitation is unkind—softening shows effort.  
  - **Leaf F: Straight welfare-balancing.**  
    Commitment: Softening is always worth it—but if everyone does this, criticism becomes impossible (e.g., inflated reference letters).  
  - **Leaf G: Relationship maintenance over truth.**  
    Commitment: Speaker must soften to spare the hearer work—even if it breeds dependency (e.g., always sugarcoating).  
  - **Leaf H: Bluntness as respect and anti-paternalism.**  
    Commitment: Hearer should handle bluntness (e.g., "Draft is flawed")—but it backfires if they’re not resilient (e.g., student breaks down).  
  - **Leaf I: Accommodationism (their norm wins).**  
    Commitment: In cross-norm cases, defer to the hearer’s expectations—even if it feels self-betraying.  
  - **Leaf J: Local norm governs (context wins).**  
    Commitment: Follow the setting’s norms—even if you disagree (e.g., Dutch supervisor softens in Japan).  
  - **Unnamed 1:** Asserts that *all* negative speech is non-assertive—but this empties truth norms (see "Cells nobody lives in").  

  ---

  ### **Cells Nobody Lives In (200 words)**
  These answer combinations are theoretically possible but unoccupied due to incoherence or unattractiveness:  
  1. **Refuse to lie, refuse to mislead, *and* refuse to be silent (must speak bluntly):**  
     - Why unoccupied? Silence is the escape valve—rejecting all options forces bluntness (Leaf H/T), but rejecting *that* too leaves no coherent exit. In practice, this would paralyze communication (e.g., stammering "I... can’t say" when asked about a draft), which people avoid as performatively contradictory.  
  2. **"Isn’t an assertion" for every negative assessment:**  
     - Why unoccupied? If *all* criticism (e.g., "Your draft is bad") is deemed "ritual," truth norms collapse. This is incoherent: if praise is assertive (e.g., "Great draft!"), criticism must be too, or language loses function. Pragmatically, it’s exploitable—anyone could dodge accountability by saying "I wasn’t asserting."  
  3. **Blunt self-disclosure is wrong, but blunt assessment is fine:**  
     - Why unoccupied? Self-disclosure (e.g., "I hate your draft") is typically seen as *less* offensive than assessment (e.g., "Your draft is bad"). Rejecting the former but accepting the latter is perverse—it implies judging others is safer than owning your feelings, which few endorse.  

  ---

  ### **Where It Stalls (120 words)**  
  The tree cannot separate:  
  1. **"Truth-telling as non-negotiable" vs. "Bluntness as respect":** Both reject softening and silence, landing at Leaf H. The first is deontological ("truth is sacred"), the second consequentialist ("bluntness empowers"). No question splits them—they agree on actions but not reasons.  
  2. **"Welfare-balancing" vs. "Care-first" in softening decisions:** Both might choose white lies (Leaf G) for trivial cases (e.g., bad haircut) but diverge on high-stakes ones (e.g., referee reports). The tree captures their *choices* per case but not their *meta-rule* (utilitarian vs. virtue-based).  
  3. **"Relationship-first" vs. "Accommodationism":** Both might soften in cross-norm cases, but the first prioritizes harmony, the second norm-deference. Their actions overlap, and no branch probes motives.  

  --- 

  **How to use this in your session:**  
  1. Pick one case (start with the friend’s draft).  
  2. Walk through the tree as a group, having students justify answers.  
  3. When paths diverge, split into breakout groups based on answers.  
  4. Reconvene to compare endpoints and discuss "awkward commitments" and "dead ends."  
  This prevents theory-laden debates by grounding discussion in cases—e.g., the philosopher’s "norm of assertion" might emerge naturally at Leaf A or B, but only after concrete choices.
