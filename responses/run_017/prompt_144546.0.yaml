  ---

  **Blunt Notes on Sections**  
  **Section 1**: Obviously true to linguists. Keep it—it's your foundation.  
  **Section 2**: Your strongest insight. It's **performative utterance** (J.L. Austin). The offense *is* the act.  
  **Section 3**: Fatal flaw: If offense is purely performative, why does *partial* masking ("f**k") reduce harm more than *full* substitution ("the f-word")? Your "withholding" theory doesn't scale.  
  **Section 4**:  
  - Type A: Real (e.g., racial slurs with clear neutral terms).  
  - Type B: Real (e.g., "queer" vs. "LGBTQ+").  
  - Type C: Likely **epithets without referents** (e.g., "cracker", "karen"). They insult via stereotype, not taxonomy. Don't cut—but stress-test with examples.  
  **Section 5**: Correct and underappreciated. Keep "speaker endorsement isn't metadata" verbatim.  

  **Where You're Inventing Terms**  
  - "Masking as an act" → **Orthographic mitigation** (existing term)  
  - "Derogation needs somebody to pin it on" → **Speaker attribution requirement**  
  - Your A/B/C split is novel but defensible. Rename: **Stable**, **Contested**, and **Constructed** slurs.  

  **Critical Tension (2 vs. 3)**  
  If offense is *only* in the performative act (S2), masking shouldn't work. But it does. Therefore:  
  - Either performative force leaks through partial masking (weakening S2),  
  - Or the string *itself* has **conventionalized toxicity** (contradicting S1).  
  Strongest objection: **Reclaimed slurs** (e.g., in-group "nigga") retain identical spelling but lose performative harm. This favors S2 but explodes S3.  

  **Actionable Fix**  
  Merge S2-S3 into: "Slurs as **conventionally weaponized performatives**". Harm requires:  
  1. Utterance act *intending* derogation (S2),  
  2. + Lexical convention of harm (S1),  
  3. + Speaker endorsement (S5),  
  4. − Reclamation/masking *counter-conventions* (fixes S3).  

  **Why This Works for You**  
  It converts philosophy into filters:  
  - Flag utterances with (1) slur strings *and* (2) unquoted/unmasked usage *and* (3) non-marginalized speakers.  
  - Ignore dictionaries, quoted speech, reclaimed contexts.  

