answer: |-
  Below is a rigorously constructed decision tree for mapping views of personal identity, based on concrete cases and logical distinctions. It prioritizes discrimination between positions by using your specified cases to force divergence, separates synchronic/diachronic unity explicitly, and flags ambiguities (e.g., reductionism vs. Buddhist conventionalism). The tree has **10 questions** and sorts into **11 leaves** (8 named views + 3 "empty box" explanations). Each question uses cases to infer commitments—no labels or jargon without immediate glosses.

  **Key to Glosses:**  
  - **Synchronic unity:** Is there a single subject of experience *right now*? (e.g., is your current visual/auditory field unified?)  
  - **Diachronic unity:** Does anything *persist* across time? (e.g., is "you" at age 5 the same entity as "you" now?)  
  - **Conventional person:** The pragmatic "self" we refer to in daily life (e.g., using names, assigning responsibilities).  
  - **Prudential self-concern:** Why it makes sense to care about your future (e.g., saving for retirement).  
  - **Karmic role:** How past actions influence future experiences (e.g., habit patterns affecting behavior).  

  ---

  ### **The Decision Tree**  
  *Answer YES/NO to each question based on concrete judgments. Cases are integrated into questions.*  

  1. **Synchronic unity case:** You stub your toe while smelling coffee. Is there *one subject* having both experiences *at this instant*?  
     - **YES** → Go to Q2.  
     - **NO** → Synchronic disunity (View: **Bundle Theory**).  

  2. **Diachronic persistence case:** After dreamless sleep (or anesthesia), you wake with uninterrupted memories/plans. Has *anything* persisted from before sleep to after?  
     - **YES** → Go to Q3.  
     - **NO** → Go to Q8.  

  3. **Fission/branching case:** Your brain is copied to a clone, creating two identical people. Are *both branches* "you" (at least partially)?  
     - **YES** → Identity is *degree-based* → Go to Q4.  
     - **NO** → Identity is *all-or-nothing* → Go to Q5.  

  4. **Neuron replacement case:** Your neurons are replaced slowly (1%/year) with synthetic duplicates. Are you still "you" after 100% replacement?  
     - **YES** → Continuity is *causal/functional* → Go to Q6.  
     - **NO** → Continuity requires *biological basis* → Go to Q9.  

  5. **Stream vs. psychology case:** Over decades, your personality/intentions change completely, but your stream of consciousness flows unbroken. Are you the "same person" as before?  
     - **YES** → *Stream continuity* matters → Go to Q7.  
     - **NO** → *Psychological traits* matter → Go to Q6.  

  6. **Amnesia case:** You lose all memories but keep core dispositions (e.g., kindness, impatience). Are you still "you"?  
     - **YES** → *Dispositional continuity* suffices → Go to Q9.  
     - **NO** → *Memory continuity* required → View: **Lockean Psychological Continuity**.  

  7. **Sleep gap case:** If consciousness stops in dreamless sleep, does this *break* personal continuity?  
     - **YES** → Persistence requires *unbroken consciousness* → View: **Pure Consciousness Stream**.  
     - **NO** → Go to Q10.  

  8. **Diachronic illusion case:** Since you denied persistence (Q2), is the sense of a "persisting self" *mistaken but useful*?  
     - **YES** → View: **Illusionism**.  
     - **NO** → View: **Momentary Stage Theory** (no persister, no illusion).  

  9. **Conventional person case:** What picks out "you" as a target for karma/responsibility?  
     - **Psychological continuity** (e.g., linked memories/traits) → View: **Reductionism**.  
     - **Karmic/causal role** (e.g., cause-effect chains across aggregates) → View: **Buddhist Conventionalism**.  
     - **Biological continuity** → View: **Animalism**.  

  10. **Prudential concern case:** Must a view make future-oriented care (e.g., avoiding pain) *intelligible*?  
      - **YES** → View: **Narrative Self**.  
      - **NO** → View: **Abhidharma Reductionism** (persons as nominal labels).  

  ---

  ### **Scoring Key: Answer Patterns → Views**  
  *Patterns are listed as Q1–Q10 answers (Y/N/→ for paths). Ambiguities flagged.*  

  - **Bundle Theory:** Q1=NO. *Synchronic disunity only (e.g., Hume).*  
  - **Illusionism:** Q1=YES, Q2=NO, Q8=YES. *Diachronic unity is illusory (e.g., Dennett).*  
  - **Momentary Stage Theory:** Q1=YES, Q2=NO, Q8=NO. *No persistence, no illusion (rare, e.g., Siderits).*  
  - **Lockean Psychological Continuity:** Q1=YES, Q2=YES, Q3=NO, Q5=NO, Q6=NO. *Memory defines identity.*  
  - **Pure Consciousness Stream:** Q1=YES, Q2=YES, Q3=NO, Q5=YES, Q7=YES. *Unbroken stream suffices (e.g., Upanishadic).*  
  - **Reductionism:** Q1=YES, Q2=YES, Q3=YES/NO, Q4=YES, Q6=YES, Q9=Psychological. *Persons as aggregates (e.g., Parfit).*  
  - **Buddhist Conventionalism:** Q1=YES, Q2=YES, Q3=YES, Q4=YES, Q6=YES, Q9=Karmic. *Conventional person as karmic nexus (e.g., Vasubandhu).*  
  - **Animalism:** Q1=YES, Q2=YES, Q3=NO, Q5=NO, Q6=YES, Q9=Biological. *Biological organism (e.g., Olson).*  
  - **Narrative Self:** Q1=YES, Q2=YES, Q3=YES, Q4=YES, Q6=YES, Q9=Psychological, Q10=YES. *Self as story (e.g., Schechtman).*  
  - **Abhidharma Reductionism:** Q1=YES, Q2=YES, Q3=YES, Q4=YES, Q6=YES, Q9=Karmic, Q10=NO. *Persons as labels only (e.g., Theravada).*  

  #### **Ambiguities & Empty Boxes**  
  - **Reductionism vs. Buddhist Conventionalism:** Collapses in Q9. If psychological → Reductionism; karmic → Buddhist. *This is their fault: the distinction hinges on whether conventional identity is psychological or karmic.*  
  - **Synchronic unity + no diachronic unity (Q1=YES, Q2=NO):** Occupied by Illusionism/Momentary Stage Theory. *The "unoccupied box" (synchronic disunity + diachronic unity) is incoherent: if nothing unifies experiences now, persistence is unintelligible.*  
  - **Diachronic unity + no synchronic unity (Q1=NO, Q2=YES):** Logically possible but empty. *Untried and phenomenologically implausible—no historical view holds this.*  
  - **Degree vs. all-or-nothing:** Explicitly in Q3 (fission). All-or-nothing views reject branching (e.g., Animalism); degree views accept it (e.g., Reductionism).  

  #### **Momentariness & Continuity Notes**  
  - Momentariness isn't a separate node; it falls from Q2 (NO → implies momentariness) or Q8b (if Q8=NO).  
  - Memory vs. causal continuity is in Q6 (amnesia) and Q8a (implied in Q9): memory is psychological, karmic role is causal.  

  This tree forces clarity by using cases to reveal commitments. Test it with your group’s stock examples—it should dissolve false agreements by showing where "anatta" means synchronic disunity (Bundle), no persistence (Illusionism), or conventional labeling (Abhidharma).
