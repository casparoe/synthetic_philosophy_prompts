prompt: |-
  Hey — quick favour. I've got a fifty-minute section Thursday at 9am with first-years in Intro to Ethics, and the slot I've been given is moral particularism versus generalism. Don't write the lecture for me; I want a plan for it, and I want you to push back where you think I've got it wrong.

  Where they are: they've done act utilitarianism and a week of Kant, so they arrive pretty convinced that moral judgement just is applying a rule, while at the same time about half of them think *just be a good person, don't be a rule-follower* is a profundity. So I'm fighting on two fronts at once and I keep losing the second half of the room.

  The thing I actually want you to argue with me about: I'm tempted not to open with the standard move — that a consideration which is a reason in one case can be no reason at all, or a reason the other way, in another. Instead I want to start from the epistemology: the thought that learning to see a situation aright is closer to learning to read an x-ray or taste wine than to learning a formula, and only then ask whether what you've learned could in principle be written down as principles. Is that order backwards? What specifically breaks if the valence-flip material comes second rather than first?

  Then: one carrying example. It has to be a case where the same feature unambiguously flips, and where the flip is not just the feature getting outweighed by something weightier. Tell me what the example needs to have and what it needs to lack — my worry is that if I reach for anything involving lying, promises, or harm to persons, they'll just grab hold of deontology and stop listening to me.

  Misconceptions I'm expecting: particularism equals relativism or anything goes; particularism equals some spooky intuition-faculty; and the one I think will really bite — they'll treat *lying is pro tanto wrong* as already settling the question, because for them any true generalisation counts as a principle. Where in the sequence do I head each one off? And can you get them to see daylight between a mere default reason and a pro tanto principle? There's a generalist position where principles are only ever defaults — I think the label is defeasible generalism, tell me if I've got that wrong — and I don't want them concluding that this generalist has simply capitulated and renamed themselves.

  Last two things: what should I explicitly refuse to cover at this level and say out loud that I'm refusing? And give me one question to put on the board at the end that would show me they've got the disagreement itself in view, rather than just being unsettled.
reasoning: |-
  Okay, let me break this down. The user is teaching Intro to Ethics and needs a lecture plan on moral particularism vs generalism. They've got first-years who've done utilitarianism and Kant, so students are stuck between thinking morality is all about rules versus believing it's just about "being a good person." 

  The user wants to flip the usual lecture order—starting with epistemology instead of valence-flipping examples. But they're worried this might backfire. Hmm, I see why. If you start with "reading situations like x-rays," students might immediately jump to "so it's all intuition?" and tune out. Better to show concrete examples first to ground the abstract idea.

  For the valence-flip example, it needs to be unambiguous and not trigger deontological reflexes. Lying/promises/harm are out. What about... gratitude? Returning a borrowed book to someone who's now depressed vs. to someone using it to plan revenge. Same action (returning property), opposite moral valence. No rules being outweighed—the context flips the meaning entirely.

  Biggest pitfalls: students will conflate particularism with relativism ("anything goes"), think it relies on "spooky intuition," or miss the difference between pro tanto principles and mere defaults. Need to explicitly block these in sequence: during the case discussion for relativism, when explaining perception for intuitionism, and when contrasting defeasible generalism with particularism.

  What to skip? Don't dive into moral semantics or particularist logic. End with a diagnostic question: "Could all competent moral judges agree on cases while disagreeing on principles?" That reveals if they grasp the core disagreement.

  User's teaching struggle is real—they're fighting both naive rule-following and naive anti-rules sentiment. The key is making the "principles as summaries" vs "principles as guides" distinction visceral. Also, they’re smart to avoid Kant/utilitarianism rabbit holes; students will cling to familiar frameworks.
answer: |-
  Here’s a battle-tested plan addressing your constraints, with pushback on sequencing and tactical notes. Target: 50 minutes with first-years post-utilitarianism/Kant.

  **Core Structure & Timing:**

  1.  **Hook & Framing (5 min):**
      *   Start with their tension: "Many of you think morality *is* applying rules (like Kant/Util), but many also feel 'just be good' is profound. Today, we dissect that tension: Is morality fundamentally about **rules** (generalism) or **context** (particularism)?"
      *   **EXPLICITLY REFUSE:** "We *won't* decide who's right today. Goal: Understand the *nature* of the disagreement itself."

  2.  **The Core Disagreement Demystified (10 min):**
      *   **Generalism Defined (Lean-to):** Moral thought requires appeal to *general principles* (rules, duties, values) that apply across cases. (Cite Kant's CI, Util's "maximize happiness").
      *   **Particularism Defined (Lean-to):** Moral thought doesn't rely on *substantive* general principles. What matters is **sensitivity to the morally relevant features** of the *specific situation*.
      *   **CRUCIAL DISTINCTION:** "Particularism is **NOT** relativism. It claims there *are* right/wrong answers, grounded in the *real features* of the situation – just not necessarily codified in exceptionless rules. Relativism denies objective right/wrong. Big difference!" *(Head off Relativism Misconception HERE)*

  3.  **Your Epistemology Move FIRST (The "X-Ray" Analogy) (10 min):**
      *   **The Analogy:** "Think of moral judgement like a skill: reading an X-ray, tasting wine, diagnosing illness. Experts learn to *see* subtle features, weigh nuances, recognize patterns holistically. They don't just memorize a flowchart."
      *   **Connect to Morality:** "Moral maturity might be like this: learning to *perceive* the morally salient aspects – the hurt, the need, the deception, the vulnerability, the relationship – and how they *interact* in *this* case."
      *   **The Question:** "Does this skill *necessarily* imply you've internalized general principles you could write down? Or is it a different kind of knowing?"
      *   **PUSHBACK ON YOUR SEQUENCE & WHAT BREAKS:** Starting here is **risky but potentially powerful**.
          *   **Risk:** It *feels* vague to students initially. They might jump to "So it's just intuition? Like a feeling?" *(Head off "Spooky Faculty" Misconception HERE: "No, it's a trained *perception* based on experience and attention to details, like a doctor spotting a tumour others miss – not a 'gut feeling'.")*
          *   **Benefit:** It frames the *entire debate* around the *nature of moral reasoning/knowledge*. Valence-flips then become *evidence* for this picture, not just odd puzzles.
          *   **What Breaks if Valence-Flip is Second?** Less risk of students dismissing valence-flips as "just exceptions to rules" *if* you've already planted the seed that moral reasoning might be fundamentally perceptual/skill-based, not rule-application. It makes the valence-flip less shocking and more like an *expected consequence* of the epistemology.

  4.  **The Valence-Flip Punch: The Carrying Case (10 min):**
      *   **Requirements for the Example:**
          *   **Same Feature, Unambiguous Flip:** Not outweighed, *reversed*.
          *   **Non-Deontological:** Avoid lying/promises/harm-to-persons directly.
          *   **Lacks:** Easily explainable by a *different* rule taking priority.
          *   **Lacks:** High emotional volatility (e.g., life/death).
      *   **The Case: Carrying Someone's Belongings**
          *   **Scenario A:** Your friend has just sprained their ankle badly on a hike. You offer to carry their heavy backpack for them the rest of the way down. *Feature:* Carrying their belongings. *Valence:* Clearly kind/helpful (a reason *for*).
          *   **Scenario B:** You are in a museum. A stranger admiring a fragile, priceless vase says, "My arms are tired, could you hold this for me for a second?" They gesture towards the vase. *Feature:* Carrying their belongings. *Valence:* Clearly reckless/wrong (a reason *against*). *Why the flip?* Not outweighed by "don't steal" (you aren't stealing). The context (fragility, value, your competence, the request's nature) *changes the moral meaning* of carrying their item. It becomes dangerous negligence.
      *   ***Why this works:*** No obvious deontological hook. The flip isn't about weight but meaning. Highlights the role of context (physical setting, object properties, relationships, competence).

  5.  **Generalism's Response & The Pro Tanto/Default Trap (10 min):**
      *   **The Challenge:** "So, particularists say principles like 'Helping carry things is good' are useless or non-existent because the valence flips. Generalists must respond."
      *   **Defeasible Generalism ("Default Rules"):** "One view: Principles *are* real, but only state *default* reasons (e.g., 'Carrying things for others is *generally* a reason in favour, absent defeating conditions')."
      *   **The Trap & Head-Off:** "BUT WAIT! Does this 'defeasible generalism' just rename particularism? **NO.** The crucial difference: **What does the explanatory work?**"
          *   **Defeasible Generalist:** The *default principle* is fundamental. Exceptions are *added* (e.g., "...unless it involves significant risk"). The principle + exception list *does* the work.
          *   **Particularist:** The *specific features of the context* (fragility, risk, competence) are fundamental. Any "principle" we state (even a default) is just a *summary* of how competent judges tend to react to similar features – it *doesn't guide* or *explain* the judgement in the new case. Competence comes from sensitivity, not rule-application. *(Head off "Pro Tanto Settles It" Misconception HERE: "Saying 'lying is pro tanto wrong' is just summarizing a common pattern. It doesn't tell us *why* it's wrong here or *if* it's wrong in a radically new context. Particularism asks if that summary *itself* is doing any real work in reasoning.")*

  6.  **Clarification & Synthesis (3 min):**
      *   Reiterate: Disagreement is about the *role* of principles. Are they the *engine* of moral reasoning (Generalism) or just helpful *maps* summarizing past journeys (Particularism)?
      *   "Defeasible Generalism tries to be the engine; Particularists say only the sensitivity is the engine, maps are just outputs."

  7.  **The Diagnostic Closing Question (2 min):**
      *   Put on Board: **"Could two people agree on every single concrete moral judgement (case by case) but completely disagree on *whether* any general moral principles exist or what they are?"**
      *   **Why this works:** It cuts to the core. If they understand particularism, they'll see "Yes!" (principles are summaries, not foundations). If they lean generalist, they'll likely say "No" (judgements must flow from principles). It reveals if they grasp the *metaphysical/epistemological* disagreement, not just case intuitions.

  **Tactical Summary & Pushback Integration:**

  *   **Epistemology First:** Risky, but defendable. Mitigate vagueness by immediately grounding the "skill" analogy in the concrete Carrying Case. Use the case to *illustrate* the need for perception. The valence-flip becomes evidence *for* the epistemology. The breakage (potential vagueness) is worth the benefit of framing the whole debate.
  *   **Carrying Case:** Meets your specs. Low-deontology, clear flip, no simple outweighing.
  *   **Misconception Sequence:**
      *   **Relativism:** Knock out IMMEDIATELY during definitions (Point 2).
      *   **Spooky Faculty:** Address explicitly when introducing the epistemology/skill analogy (Point 3).
      *   **Pro Tanto Settles It:** Crucially tackle *during* the discussion of Defeasible Generalism vs. Particularism (Point 5). Emphasize *explanatory priority*.
  *   **Defeasible Generalism vs. Capitulation:** You're right, the label is common. Stress the *explanatory* difference: Defaults-as-guides (DG) vs. Defaults-as-summaries (P). DG claims the rule *structure* is essential to reasoning.
  *   **Refusals:** State upfront: "We won't decide who wins, and we won't dive into complex logical debates about 'holism' or the semantics of moral terms today. Focus: the core disagreement about principles." (Out: Deep metaethics, advanced logic).
  *   **Diagnostic Question:** The board question is perfect. It forces them to confront the fundamental divergence in understanding what morality *is*.

  This plan leverages their existing tension, grounds the abstract in concrete examples, preempts key errors, and ends with a clear diagnostic tool. Good luck with the first-years! That 9am slot is a beast.
