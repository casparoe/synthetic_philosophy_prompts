prompt: |-
  I work alongside an investigator in the integrity office of a multilateral development bank, and I am trying to reconstruct the rule she is actually running rather than the one she cites in her reports. Her decisions on six past referrals:

  1. A roads contract awarded after the winner paid a retainer to the minister's nephew for a feasibility study that was never produced — corrupt; firm debarred.
  2. A water ministry official who accepted cash condolence gifts at his son's funeral from contractors with live bids before his department, and who later approved one donor's variation order — corrupt.
  3. A customary chief chairing a village development committee who steered most of a grant's microprojects to his own clan's hamlets, having received customary tribute from clan members — corrupt, even though anthropological evidence was that refusing the tribute would have destroyed his standing; she allowed that local obligation could explain the practice but not excuse it.
  4. An unrestricted educational grant from a pharmaceutical company to a national clinicians' association that then issued guidelines favouring the company's drug, with no payment to any official — cleared, on the ground that no officeholder and no office was enriched.
  5. A planning commissioner who had been paid counsel to the developer whose project she approved three years earlier; the project ranked first on the published criteria, she had disclosed the history, and the recusal rules did not reach former clients — cleared, with a note that appearances were regrettable.
  6. A disclosed, lawful donation to a political party by a firm that later won a competitive tender, with no evidence the tender was distorted — cleared.

  The new referral: a national malaria programme's procurement unit holds an annual supplier day funded by the firms holding its contracts; the money pays for the unit's staff training and for a scholarship fund for staff members' children, administered by an outside committee. No individual official receives anything of value, the practice is disclosed in the annual report, it has a long local history under a name that translates roughly as the granary, and there is no evidence that contributing, or failing to contribute, ever affected an award. A losing bidder has referred it.

  Will she find corruption? Set out the two or three rules that fit all six precedents, what each predicts here, which you think she is running and why, and the single further case that would best separate the survivors. I would also like your view on what her rule treats as the object of corruption — a transaction, a personal relationship, an office, or a system — since I suspect her two clearances are doing more work than her three findings.
reasoning: |-
  We are given six cases and a new referral. We need to reconstruct the rule the investigator is using and then apply it to the new case.

  First, let's summarize the decisions:

  1. **Roads contract**: Firm paid a retainer to minister's nephew for a feasibility study that never happened -> corrupt; firm debarred.
  2. **Water ministry official**: Accepted cash condolence gifts from contractors and then approved one donor's variation order -> corrupt.
  3. **Customary chief**: Steered grant microprojects to his own clan's hamlets after receiving customary tribute -> corrupt, even though the tribute was a local obligation. The obligation explained but did not excuse.
  4. **Educational grant**: Pharmaceutical company gave an unrestricted grant to a clinicians' association, which then issued guidelines favoring the company's drug. No officeholder or office enriched -> cleared.
  5. **Planning commissioner**: Had been paid counsel to a developer whose project she approved three years earlier. Project ranked first, she disclosed, recusal rules didn't cover -> cleared, but noted appearances regrettable.
  6. **Political donation**: Lawful, disclosed donation to a political party by a firm that later won a competitive tender, no evidence of distortion -> cleared.

  Now, the new referral:

  - Annual supplier day funded by firms holding contracts with the national malaria programme's procurement unit.
  - Money used for staff training and a scholarship fund for staff members' children (administered by an outside committee).
  - No individual official receives anything of value.
  - Disclosed in annual report.
  - Long local history (called "the granary").
  - No evidence that contributing or not affected an award.

  We need to extract the rules that fit all six precedents.

  **Rule Analysis:**

  Looking at the cases, we see a pattern in what is considered corrupt and what is cleared.

  In the corrupt cases (1-3):

  - Case 1: Payment was made to a relative of a minister (nephew) for a non-existent service. This looks like a bribe to influence the contract award.
  - Case 2: Official accepted cash from contractors and then approved a variation order for one of them.
  - Case 3: Chief received tribute (which was customary) and then steered benefits to the clan of the givers.

  In the cleared cases (4-6):

  - Case 4: No officeholder or office was enriched. The grant was to an association, and the guidelines were issued without direct payment to officials.
  - Case 5: The commissioner had a prior relationship (as counsel) but the decision was based on merit, she disclosed, and recusal rules didn't apply. The office was not used for personal gain in the transaction.
  - Case 6: Donation was disclosed and lawful, and there was no evidence of distortion in the tender.

  Common elements in corrupt findings:

  - There is a transfer of value (money, gifts) that is linked to a decision by an official (or official-like figure) that benefits the giver or their associates.

  In cleared cases:

  - The transfer of value either did not go to an officeholder or office (Case 4: went to an association; Case 6: went to a political party) OR the decision was made without evidence of being influenced by the transfer (Case 5: decision was based on merit and disclosed, and the transfer was in the past as a fee for service).

  Additionally, the investigator seems to focus on whether an **officeholder** or the **office** itself was enriched. In Case 4, she explicitly says "no officeholder and no office was enriched". In Case 6, the donation went to a political party (not the official or the office) and there was no evidence of distortion.

  In Case 3, she acknowledged the customary tribute but said local obligation explains but does not excuse. This suggests that the rule is strict: if an official (or person in a position of public trust) receives something of value and then makes a decision that benefits the giver (or their group), it is corrupt even if the payment was required by custom.

  **Proposed Rules:**

  From the above, I propose two or three rules:

  1. **Rule A (Direct Enrichment Rule)**: Corruption occurs when an officeholder (or person acting in an official capacity) or the office itself is enriched (directly or indirectly) by a party that stands to benefit from an official decision, and there is a link between the enrichment and the decision.

     - In Case 1: The minister (via his nephew) was enriched (the retainer) and the contract award decision benefited the firm. The nephew is an indirect channel to the minister.
     - Case 2: The official was enriched (cash gifts) and then approved a variation order for the donor.
     - Case 3: The chief (officeholder) was enriched (tribute) and then steered projects to the clan of the givers.
     - Case 4: No officeholder or office enriched -> cleared.
     - Case 5: The commissioner was previously paid as counsel (so she was enriched in the past) but the payment was for prior services and not linked to the current decision. The decision was made on merit and the rules didn't require recusal. The office was not enriched in the current transaction -> cleared.
     - Case 6: The donation went to a political party, not to the officeholder or office -> cleared.

  2. **Rule B (Influence Rule)**: Corruption occurs when a transfer of value is made with the intent to influence an official decision, or when such a transfer creates a conflict of interest that actually influences the decision, regardless of whether the rules explicitly forbid it.

     - This rule would also cover Case 3: the tribute created a conflict that influenced the chief's decision (steering projects to the clan) even though customary.
     - In Case 5: There was no evidence that the prior payment influenced the decision (the project ranked first) -> cleared.
     - Case 6: No evidence that the donation influenced the tender -> cleared.

  But note that in Case 4, there was an attempt to influence (the grant) but the influence was not on an officeholder but on an association. The investigator's clearance reason was that no officeholder or office was enriched, so Rule A seems to capture that.

  However, Rule B might be broader and could explain Case 3: even if the tribute was customary, it still influenced the decision.

  But note the investigator's reasoning in Case 3: she allowed that the obligation explained the practice but did not excuse it. This suggests that the mere fact of the transfer and subsequent favorable decision is enough, regardless of intent or custom.

  **Synthesizing:**

  The investigator's rule appears to be:

  - **Rule 1 (Officeholder/Office Enrichment)**: If an officeholder (or the office) receives something of value (directly or indirectly) from a party that has a matter before that office, and the officeholder then makes a decision that benefits that party (or their associates), it is corrupt. The key is the enrichment of the officeholder or office and the link to the decision.

  - **Rule 2 (Systemic Integrity)**: Even if there is no direct enrichment of an individual officeholder, if a practice undermines the integrity of the office or the system by creating a conflict of interest or the appearance of one, it may be corrupt. However, the investigator seems to require that the enrichment must be to the officeholder or office (as in Case 4 and 6, she cleared because the enrichment did not go to the officeholder or office).

  But in the new case, the funding is for the unit's staff training and a scholarship fund for staff children. This is not going to individual officials, but it is going to the unit (for training) and to a scholarship fund for the staff's children. Is this enriching the office or the officeholders?

  - The office (procurement unit) is receiving funds for training (which is a benefit to the office) and the scholarship fund benefits the children of the staff (which is a benefit to the officeholders indirectly).

  This seems to be a gray area. The investigator might consider that the scholarship fund for staff children is an indirect benefit to the officeholders (the staff). Similarly, the training benefits the office and thus the officeholders.

  But note that in Case 4, the grant was to a clinicians' association, not to the office or officeholders. In Case 6, the donation was to a political party. Here, the funding is for the unit's staff training and for the children of the staff. This is more directly tied to the officeholders than in Case 4 and 6.

  Also, note the investigator's comment in Case 5: she noted that the appearances were regrettable but cleared because the rules didn't require recusal and the decision was on merit. This suggests that she does care about appearances but does not base her decision solely on that.

  **Applying Rules to the New Referral:**

  - **Rule A (Officeholder/Office Enrichment)**: 
     - The procurement unit (the office) is receiving funding for staff training (so the office is being enriched?).
     - The scholarship fund for staff children is an indirect benefit to the officeholders (the staff). 
     - The decision in question is the award of contracts to these firms. 
     - There is a link: the firms that hold contracts (and thus have business with the unit) are funding these activities.

     This rule would likely find corruption because the office (via training) and the officeholders (via scholarships for their children) are being enriched by the firms that have contracts with the office. Even though no individual official receives cash, the unit as a whole is benefiting.

  - **Rule B (Influence Rule)**:
     - There is no evidence that contributing or not affected an award. But the rule might look at the potential for influence. However, in Case 6, she cleared because there was no evidence of distortion. 
     - The investigator might also consider the appearance. The practice might create an appearance of conflict. But in Case 5, she cleared even though the appearance was regrettable because there was no rule violation and the decision was on merit.

     Without evidence of actual influence, Rule B might not find corruption. But note that in Case 2, the official accepted gifts and then approved a variation order. That was enough to find corruption without evidence that the gift caused the approval. The link in time and the fact that the donor was approved was sufficient.

     In the new case, the funding is ongoing and from current contractors. It creates a situation where the office is financially dependent on the contractors for training and scholarships. This could be seen as creating a conflict of interest.

  **Which Rule is She Running?**

  Looking at the precedents, the investigator seems to be primarily using **Rule A: Officeholder/Office Enrichment**. 

  - In Case 4, the clearance was because no officeholder or office was enriched. 
  - In Case 6, the donation was to a political party (not the office or officeholder) so cleared.

  In Case 3, the chief (officeholder) was enriched by the tribute and then made decisions benefiting the givers -> corrupt.

  In the new case, the enrichment is to the office (training) and to the officeholders (via scholarships for their children). This is indirect but still a benefit to the officeholders. The staff of the unit are officeholders. The scholarship for their children is a benefit to them. Therefore, Rule A would likely find corruption.

  Also, note that in Case 1, the payment was to the minister's nephew (an indirect channel to the minister) and that was considered corrupt. Similarly, here the scholarships are for the children of the staff, which is an indirect benefit to the staff.

  Therefore, I think she is running Rule A.

  **Prediction for the New Referral:**

  Based on Rule A, I predict she will find corruption because:

  - The funding from the firms (who have contracts with the unit) is enriching the office (by funding training) and the officeholders (by funding scholarships for their children). 
  - This creates a link between the firms and the decisions of the unit (awarding contracts). Even though it is disclosed and has a long history, the investigator in Case 3 did not accept custom as an excuse.

  **Object of Corruption:**

  The investigator seems to treat the **office** (or the system of public trust) as the object of corruption. The rule is designed to prevent the office from being compromised by private interests. The enrichment of the officeholder or office is the key because it undermines the impartiality of the office. The focus is on the integrity of the office and the system.

  In the cleared cases (4, 5, 6), the office and its decisions were not compromised by an enrichment to the officeholder or office. In Case 5, the prior relationship did not lead to enrichment in the current transaction and the decision was made on merit. In Case 4 and 6, the payments were not to the office or officeholders.

  **Further Case to Separate the Rules:**

  To separate between Rule A (enrichment) and Rule B (influence), we could propose a case where:

  - There is enrichment of an officeholder, but the decision made is clearly not influenced (e.g., the decision is made by an independent committee and the officeholder has no role).

  But note that in the existing cases, the investigator did not require proof of influence in the corrupt cases (1,2,3) — the link was enough.

  Alternatively, we could have a case with no direct enrichment but a clear conflict:

  - A case where an official's close relative (not living with the official) receives a gift from a bidder, but the official has no knowledge of it and makes a decision on merit. 

  But in Case 1, the minister's nephew received the payment and the minister's office awarded the contract. The investigator found corruption without requiring proof that the minister knew or was influenced.

  So perhaps a better case:

  - **Hypothetical Case 7**: A public university department receives an unrestricted grant from a company. The department uses the grant to fund research. Later, the same company bids for a contract with the university (a different department) and wins in a competitive tender. The official in the awarding department has no connection to the grant and the decision is made on merit. 

  Under Rule A: The grant was to the department (which is part of the university, so an office?) but the awarding department is separate. The official in the awarding department did not receive any benefit. So Rule A might clear.

  Under Rule B: There might be an appearance of conflict, but without evidence of influence, it might be cleared (like Case 6).

  But what if the grant was to the same department that later evaluates the bid? Then Rule A would see the department (office) was enriched and then made a decision on the bid -> corrupt? 

  This might be the separating case:

  - **Case 7a**: The procurement department of a public hospital receives an unrestricted grant from a medical supplier for staff training. Later, the same supplier bids for a contract and the procurement department evaluates the bid and awards the contract to that supplier. The evaluation is done by the book and the supplier's bid is the best. 

  Under Rule A: The office (procurement department) was enriched by the supplier and then made a decision that benefited the supplier -> corrupt, even if the decision was correct.

  Under Rule B: If there is no evidence that the grant influenced the decision, it might be cleared (like Case 5 and 6). But Rule B might find it corrupt because of the conflict of interest.

  Given the investigator's pattern, I think she would find Case 7a corrupt under Rule A because the office was enriched by the supplier and then made a decision in favor of that supplier.

  In contrast, **Case 7b**: The same grant is given to the procurement department, but the contract is awarded by a different department (say, the finance department) and the procurement department does not play any role in the award. Then Rule A might not find corruption because the office that was enriched (procurement) is not the one making the decision.

  But Rule B might still be concerned about the possibility of the procurement department influencing the finance department? However, without evidence, it might be cleared.

  This case would help separate the rules: 
  - If she finds corruption in Case 7a but not in Case 7b, then she is using Rule A (the decision-making office must be the one that was enriched or the officeholder making the decision must have been enriched).
  - If she finds corruption in both, then she might be using a broader rule that any enrichment of any part of the system creates a conflict for the entire system.

  But based on the existing cases, I think Rule A is tied to the officeholder or office that is making the decision. In Case 1, the minister (who awarded the contract) was enriched via his nephew. In Case 2, the official who approved the variation order was the one who received the gifts. In Case 3, the chief who steered the projects was the one who received the tribute.

  Therefore, the enrichment must be to the decision-maker or their office.

  In the new referral, the procurement unit is both the recipient of the funding and the one making the procurement decisions. So Rule A would find corruption.

  **Conclusion for the New Referral:**

  She will find corruption because the procurement unit (the office) is being enriched by the firms that it does business with, and the enrichment (training and scholarships) is linked to the unit's decisions on contracts. Even though no individual official receives cash and it is disclosed, the enrichment of the office and the indirect enrichment of the officeholders (via scholarships for their children) fits the pattern of Rule A.

  **Final Answer:**

  - **Rules**: 
    1. **Rule A (Officeholder/Office Enrichment Rule)**: Corruption occurs when an officeholder (or the office they represent) is enriched (directly or indirectly) by a party that has a matter before that office, and the officeholder then makes a decision that benefits that party (or their associates).
    2. **Rule B (Influence Rule)**: Corruption occurs when a transfer of value is made to influence an official decision, or when such a transfer creates a conflict of interest that actually influences the decision, regardless of whether the rules explicitly forbid it. However, the investigator's decisions align more with Rule A.

  - **Prediction for New Referral**: 
     - Rule A: Predicts corruption because the procurement unit (office) is enriched by the funding for training and the officeholders (staff) are indirectly enriched by the scholarships for their children. The firms funding these are the same ones holding contracts with the unit (and likely bidding for future contracts). 
     - Rule B: Without evidence of influence, Rule B might clear, but the pattern in the precedents (especially Case 2 and 3) suggests that the link alone is enough. However, Rule A is the stronger fit.

  - **Which Rule She is Running**: Rule A (Officeholder/Office Enrichment). This fits all six cases and explains the clearances in 4,5,6 and the findings in 1,2,3.

  - **Object of Corruption**: The object of corruption is the **office** (or the system of public trust). The rule protects the integrity of the office by preventing it from being compromised by private interests through enrichment.

  - **Separating Case**: 
     - **Case 7**: A public hospital's procurement department receives an unrestricted grant from a medical supplier for staff training. Later, the same supplier submits the best bid in a competitive tender evaluated by the procurement department and wins. 
       - Under Rule A: Corruption, because the office (procurement department) was enriched by the supplier and then made a decision benefiting that supplier.
       - Under a narrow influence rule (like in Case 6): Cleared if there is no evidence of influence and the bid was the best.

  But note that in Case 5, the investigator cleared even though the commissioner had a prior financial relationship because the decision was on merit and the rules didn't require recusal. However, in that case, the enrichment (the prior payment) was not contemporaneous and the decision was made three years later. In Case 7, the grant and the decision are closer in time and the office is the same.

  However, the investigator's approach in Case 3 (customary tribute) suggests that she does not require contemporaneity. The chief received tribute and then steered projects to the clan. The tribute might have been received over time.

  Therefore, Case 7 would be found corrupt under Rule A. If she cleared it, that would contradict Rule A and suggest she is using a different rule (like requiring evidence of influence). But given the pattern, I think she would find corruption in Case 7.

  Thus, to separate Rule A from a rule that requires direct personal enrichment (not to the office but to the official personally) we could have:

     - **Case 8**: The same as the new referral, but the scholarship fund is administered by an independent committee and is open to all children in the community (not just staff children). The office still gets the training. 
       - Then the enrichment of the officeholders is removed (only the office is enriched by the training). 
       - Would she still find corruption? 
       - In the new referral, both the office and the officeholders are enriched. If only the office is enriched, does that still count? 

  In Case 4, the office was not enriched (the grant was to an association). Here, the office is being enriched (training). This is a gray area. If she finds corruption only when there is enrichment of the officeholder (personally) and not just the office, then she might clear Case 8. But if she considers enrichment of the office as sufficient, then she might still find corruption.

  Given that in the new referral the office is being enriched and the officeholders are also being indirectly enriched, and based on the pattern, I think she would find the new referral corrupt. But Case 8 would be a good test.

  Alternatively, if in Case 8 she clears, then the rule requires personal enrichment of the officeholder. If she finds corruption, then enrichment of the office is sufficient.

  But note Case 1: The payment was to the nephew, not directly to the minister. The minister was not personally enriched? Or was he? The investigator considered it corrupt. So the rule covers indirect enrichment. The office (the minister) was enriched via his nephew? Or was the nephew an intermediary? The ruling suggests that the minister's office was compromised by the payment to a close relative.

  Therefore, I think the rule covers both direct and indirect enrichment of the officeholder and the office.

  In Case 8, if the scholarship is open to the community, then the staff children are not specifically benefiting (though they can apply). The primary benefit is to the office (training). This might be enough for her to find corruption because the office is being enriched by the contractors. But it would be a close call.

  Given that, I think the new referral will be found corrupt.

  **Final Prediction**: She will find corruption in the new referral.
answer: |-
  Based on the six precedents, the investigator's decisions consistently align with a **strict institutional integrity rule**, with a secondary focus on **personal enrichment**. Below, I reconstruct the rules, apply them to the new referral, identify the primary rule, and clarify the object of corruption. I also propose a decisive test case.

  ### Key Rules Derived from Precedents
  1. **Rule 1: Institutional Enrichment Corrupts**  
     Corruption occurs if a decision-maker's **office or public function** is materially enriched (directly or indirectly) by a beneficiary of an official decision, regardless of intent, disclosure, or cultural context.  
     - **Fits precedents**:  
       - Case 1 (roads): Office enriched via minister's nephew (proxy for officeholder).  
       - Case 2 (water ministry): Officeholder enriched via gifts, linked to decision.  
       - Case 3 (customary chief): Officeholder enriched via tribute, influencing public function.  
       - Case 4 (educational grant): Cleared—no enrichment of officeholder or office.  
       - Case 5 (planning commissioner): Cleared—prior enrichment (as counsel) not tied to current office; decision merit-based.  
       - Case 6 (political donation): Cleared—donation to party, not office.  

  2. **Rule 2: Systemic Conflict Overrides Custom/Appearance**  
     Corruption is found if a practice creates a **systemic conflict of interest** that undermines institutional integrity, even if culturally normative, disclosed, or lacking explicit evidence of quid pro quo. Personal relationships or obligations do not excuse the breach.  
     - **Fits precedents**:  
       - Case 3: Customary tribute not excused—system corrupted by nepotistic outcomes.  
       - Case 5: Cleared despite "regrettable appearances" because no systemic enrichment occurred.  
       - Case 2: Condolence gifts created conflict—system compromised regardless of intent.  
       - Case 6: Cleared—no systemic link between donation and award.  

  ### Prediction for the New Referral
  - **Rule 1 Prediction (Institutional Enrichment)**: **Corrupt**.  
    The procurement unit (an office) is materially enriched by contractor-funded activities (staff training, scholarships). This enrichment comes from firms holding contracts awarded by the same unit, linking enrichment to official decisions. Even though no individual receives direct cash, benefits flow to the office (training) and officeholders (scholarships for children), akin to Case 1 (nephew as proxy) and Case 3 (clan benefit). Disclosure and history (the "granary") do not negate enrichment.  
  - **Rule 2 Prediction (Systemic Conflict)**: **Corrupt**.  
    The practice institutionalizes dependence on contractors, creating a systemic conflict. Staff training funded by contractors risks biasing future procurement decisions, while scholarships for children incentivize favoritism. This mirrors Case 3 (system corrupted by customary ties) and contrasts with Case 6 (no distortion).  

  **Conclusion**: She will find **corruption** in the new referral. **Rule 1 (Institutional Enrichment)** is her primary rule, but **Rule 2 (Systemic Conflict)** reinforces it.  

  ### Why Rule 1 is Primary
  - **Explains clearances**: Case 4 and 6 hinge on absence of office/officeholder enrichment. Case 5 emphasizes no current enrichment of the office.  
  - **Explains findings**: Cases 1–3 focus on enrichment (nephew, gifts, tribute) tied to decisions.  
  - **New referral fit**: Training enriches the office; scholarships enrich officeholders indirectly (like Case 1’s nephew). Rule 2 alone might not suffice (e.g., Case 5 had "appearances" but was cleared), but Rule 1’s enrichment test is decisive here.  

  ### Object of Corruption
  The investigator treats **the office/system** as the object of corruption, not merely transactions or personal relationships.  
  - **Why**:  
    - **Clearances (Cases 4–6)** emphasize no enrichment of "officeholder and no office" (Case 4) or systemic distortion (Case 6).  
    - **Findings (Cases 1–3)** focus on how enrichment compromises the office’s integrity (e.g., Case 3: "local obligation could explain but not excuse" implies the system’s sanctity overrides custom).  
  - **Implication**: Corruption is defined by **institutional harm**, not individual misconduct. The two clearances (Cases 4–5) are pivotal because they show that absent office-level enrichment/systemic harm, even ethically dubious acts are excused.  

  ### Test Case to Separate the Rules
  - **Scenario**: A government audit office hires a consulting firm to review its work. The firm pays for the office’s annual retreat (team-building, no cash to individuals). Six months later, the same firm bids fairly for an audit contract and wins.  
  - **Why it separates the rules**:  
    - **Rule 1 (Institutional Enrichment)**: Would find corruption—office enriched (retreat) by a firm benefiting from its decision.  
    - **Rule 2 (Systemic Conflict)**: Might clear if no evidence of bias—retreat is institutional, not personal.  
  - **Outcome prediction**: If she finds corruption, Rule 1 dominates. If cleared, Rule 2 is weaker than Rule 1.  

  ### Your View on the New Referral
  I agree the clearances (Cases 4–5) are doctrinally significant—they confirm that the investigator’s threshold is **institutional harm**, not individual guilt. In the new referral, the "granary" system institutionalizes contractor dependence, corrupting the office’s independence. She will likely debar the practice and require restitution, even without individual culpability.
