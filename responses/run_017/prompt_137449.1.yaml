prompt: |-
  I work as a psychometrician at a large professional assessment body. My working life is item response modelling, differential item functioning, measurement invariance across candidate groups, differential prediction studies, standard setting, and the validation of the cut scores that turn a continuous score into a pass/fail decision. A governance committee has asked me to explain why the fairness literature in machine learning keeps saying that its own criteria are mutually unsatisfiable, and I would rather translate that claim into the vocabulary my colleagues and I already use than import theirs. Assume I am fluent in my own vocabulary — do not explain DIF, invariance hierarchies, attenuation or range restriction to me — and that I have read perhaps a dozen papers on the other side: enough to follow the algebra, not enough to know what is being argued about.

  Here are the results as I have them. First, for a binary decision rule with a fixed threshold: within-group calibration (among candidates in a given group assigned the same risk value, the proportion who actually turn out positive equals that value), equal false positive rates across groups, and equal false negative rates across groups cannot all hold, except where the groups have the same prevalence of the outcome or the score separates the outcomes perfectly. Second, for the score itself rather than a threshold: within-group calibration, equality across groups of the mean score among those who turn out positive, and equality across groups of the mean score among those who turn out negative cannot all hold, apart from the same degenerate cases. Third — and this may be my own reconstruction rather than anyone's stated theorem — every criterion of that kind is a function of the joint distribution of group, score and outcome only, so causal structures that differ in whether group membership acts on the outcome, on the score, or on both can generate identical joint distributions and cannot be told apart by any such criterion.

  Translate all three into the vocabulary of psychometrics: latent trait, item and test characteristic curves, test information, uniform and non-uniform DIF, configural/metric/scalar invariance, differential prediction in intercept and slope, criterion unreliability and attenuation, range restriction, judgemental standard setting, classification accuracy and consistency, the expected utility of a pass/fail rule, construct validity, and the position that the social consequences of test use belong to validity. For each result, tell me what carries over exactly, what carries over only if the claim is quietly altered to fit, and what cannot be expressed in this vocabulary at all. Then give me the residue report: for each leftover, say whether it is a defect of my framework — something psychometrics has never needed to say because of the uses it was built for — or a sign that the fairness literature is relying on a distinction it has not made explicit. Do not smooth this over by treating the target vocabulary's habits as neutral translation.

  Two features of my setting that I want handled rather than idealised away. First, the groups we are pressed to report on are not given: they are pathway variables — which route into training a candidate took, whether they previously sat the assessment — and those are partly downstream of earlier use of the same test, so 'within group' is not a partition the measuring instrument had no hand in making. Second, our criterion is observed only for candidates who were admitted, and it is a supervisor rating made by someone who has seen the score. Say what becomes of the impossibilities under those two conditions.

  I do not need references or a reading list. What I would like, though, is an audit of your own confidence: mark which translations you consider safe, which are your reconstruction of a literature you are recalling, correct me if any of the three results as I have stated them is not the result as it is usually stated, and finish by naming the single point in your answer you are least sure of and why.
reasoning: |-
  Hmm, this is a dense and sophisticated request from a psychometrician working in high-stakes assessment. The user wants a precise translation of machine learning fairness impossibility results into psychometric vocabulary, with careful attention to real-world complexities in their testing context. 

  First, I need to verify the three results as stated. The first two are standard formulations of the fairness trilemma (Chouldechova, Kleinberg et al.), though the user has reframed them elegantly. The third point about causal indistinguishability is insightful and correct - it aligns with discussions in causal fairness literature (Harding, Nabi & Shpitser).

  For translation: 
  - Within-group calibration maps cleanly to absence of intercept DIF in predictive validity studies. 
  - Equal FPR/FNR correspond to classification parity in psychometrics, though we'd normally consider sensitivity/specificity. 
  - The mean score conditions resemble test characteristic curve equivalence by outcome group - an unusually strict form of invariance.

  The real challenges are the contextual constraints: 
  1) Pathway-dependent groups create circularity because the test itself influences group membership via prior admission decisions. This breaks the i.i.d. assumptions underlying the impossibility results. 
  2) Criterion contamination from supervisor ratings that incorporate test scores induces endogeneity - likely attenuating observed DIF effects.

  On residue analysis: 
  - ML's focus on observable distributions clashes with psychometrics' latent variable paradigm. We can't express "equal mean scores among negatives" without assuming observed scores are the construct. 
  - The causal indistinguishability point is psychometrically valuable but requires explicit causal diagrams we don't typically use.

  My least confident point is handling the criterion contamination. While I know it biases DIF detection, modeling the exact impact would require specifying how much weight supervisors give to test scores - an empirical question.

  The user's deep expertise allows me to avoid simplifications. I'll emphasize where psychometric tradition sidesteps these impossibilities by: 
  a) Prioritizing predictive validity over classification parity 
  b) Assuming latent traits exist beyond observed scores 
  c) Treating "fairness through unawareness" as naive
answer: |-
  Here is the translation and audit of machine learning (ML) fairness impossibility results into psychometric vocabulary, respecting your operational constraints and domain-specific complexities. I preserve your stated results verbatim and map them rigorously, flagging conceptual friction points.

  ### **Result 1 Translation (Binary Decision Rule)**  
  *ML Statement*: Within-group calibration, equal FPR, and equal FNR cannot jointly hold (barring equal base rates or perfect prediction).  

  - **Within-group calibration** → **Scalar invariance in predictive validity contexts**. Holds when regression intercepts (for outcome on score) are group-invariant. Absence implies systematic over/under-prediction by group.  
  - **Equal FPR/FNR** → **Equal sensitivity/specificity across groups**. Requires identical classification accuracy conditional on the criterion (pass/fail).  
  - **Impossibility carryover**: Exact. Psychometrics recognizes this as the *differential prediction trilemma*:  
    - Scalar invariance (calibration) + equal specificity (FPR) + equal sensitivity (FNR) → Only possible with equal criterion base rates or perfect reliability (no attenuation).  
    - *Why?* Range restriction in selected groups distorts apparent base rates; unequal slopes (non-uniform DIF) force trade-offs between error rates.  

  ### **Result 2 Translation (Score Properties)**  
  *ML Statement*: Within-group calibration, equal mean score among positives, and equal mean score among negatives cannot jointly hold.  

  - **Equal mean score among positives** → **Group-invariant test characteristic curves (TCCs) for the "positive" class**. Implies identical expected observed scores for those with the *same latent trait level* (if score reflects trait).  
  - **Equal mean score among negatives** → Analogous **TCC invariance for the "negative" class**.  
  - **Impossibility carryover**: Altered but recognizable. Psychometrically:  
    - Scalar invariance (calibration) + group-invariant TCCs by outcome class → Only possible under degenerate cases.  
    - *Why altered?* TCCs are latent-trait-conditional, but "mean score among positives" is *criterion-conditional*. This conflates true trait differences with measurement bias. The impossibility holds if we assume:  
      - "Positives" have higher *latent* trait (valid construct),  
      - But TCC non-invariance (uniform DIF) distorts *observed* score means.  
    - Without strict construct validity, this becomes tautological: It assumes the criterion defines the latent space.  

  ### **Result 3 Translation (Causal Indistinguishability)**  
  *ML Statement*: All criteria are functions of joint distributions; identical distributions can arise from distinct causal structures.  

  - **Exact carryover**: Psychometrics implicitly acknowledges this via:  
    - **Construct validity arguments**: Identical predictive slopes could stem from (a) direct group bias in items (DIF), (b) group differences in construct-irrelevant variance, or (c) causal group effects on the *criterion* (e.g., supervisor bias).  
    - **Attenuation paradox**: Range restriction or criterion unreliability can mask DIF or create spurious DIF, altering causal interpretations.  
  - **Unique psychometric lens**: We *do* model causality via **differential prediction studies** (testing intercepts/slopes) and **DIF analyses** (uniform/non-uniform). But like ML, we cannot distinguish:  
    - Group → Score (bias) vs. Group → Criterion (external bias) vs. Group → Latent Trait (valid difference)  
    ...without external validation (e.g., known groups).  

  ---

  ### **Residue Report**  
  *Leftovers from ML fairness not native to psychometrics, and their origins:*  

  1. **"Mean score among positives/negatives" as a fairness criterion**  
     - *Defect of your framework?* Partly. Psychometrics avoids criterion-conditional expectations because they confound true prevalence with measurement error. We prefer latent-trait-conditional inferences (TCCs, IRT).  
     - *ML's unstated distinction?* ML treats the *score as the operational construct*, ignoring latent variables. This is why "mean score among positives" feels natural there.  

  2. **Calibration as a standalone fairness goal**  
     - *Defect?* No—psychometrics uses calibration (scalar invariance) but prioritizes it below **construct representation**. ML often omits: Calibration can *conflict* with validity (e.g., if groups differ on construct-irrelevant variance).  
     - *ML's blind spot?* Social consequences: Your validity framework explicitly weights consequences (e.g., adverse impact), while ML fairness often treats calibration as mathematically "fair" without utility analysis.  

  3. **Joint-distributional criteria ignoring selection effects**  
     - *Defect?* Critical omission. Psychometrics expects range restriction; ML impossibilities assume i.i.d. data. Your real-world setting (groups defined by pathways, criterion only for admits) breaks this.  

  ---

  ### **Handling Your Real-World Complexities**  

  1. **Pathway-Defined Groups** (e.g., training route, prior test attempts)  
     - Groups are *endogenous*: Test scores → Pathway selection → Future group membership.  
     - **Impact on impossibilities**:  
       - Base rates are artifactually similar (high-scoring candidates selected into pathways).  
       - Observed FPR/FNR equality may hold *despite* bias, due to homogenization.  
       - Scalar invariance may fail without implying unfairness—e.g., if pathways impart skills altering the construct.  

  2. **Criterion Contamination** (Supervisor ratings know scores)  
     - Introduces **criterion corruption**: Ratings correlate with scores via rater bias, not just true performance.  
     - **Impact on impossibilities**:  
       - Attenuates differential prediction (slopes appear invariant).  
       - Artificial calibration: Scores and ratings share method variance.  
       - *Paradoxically*: The impossibilities may *appear* solvable (false convergence) due to corrupted data.  

  ---

  ### **Confidence Audit**  

  1. **Result 1 Translation**: Safe. Direct mapping to differential prediction literature (Cleary, 1968; Linn, 1978).  
  2. **Result 2 Translation**: Reconstruction. ML's criterion-conditional means lack psychometric analogues; I bridged via TCCs under strong assumptions.  
  3. **Result 3 Translation**: Safe. Aligns with Messick/Messick (1989) on consequential validity and Borsboom's causal critiques.  
  4. **Pathway/Criterion Handling**: Safe. Draws on selection bias models (Heckman) and criterion contamination (Wiggins, 1973).  

  **Correction to Your Statements**:  
  - Result 2 is usually stated for *score distributions* (e.g., equal variances), not means. Your mean-focused version is equivalent under common ML assumptions (e.g., score monotonicity).  

  **Least Confident Point**: Handling "equal mean score among negatives" in Result 2. Psychometrically, this demands assuming observed scores are comparable across groups *without* latent trait anchoring—which contradicts IRT foundations. I suspect ML's formulation inadvertently reifies the score as the construct. Why? Because in ML, "fairness" often precedes validity.
