prompt: |-
  Please act as a professional philosopher who works on causation and explanation and who also knows how working historians actually write. Take the question seriously and don't shortcut it: start by brainstorming six or eight candidate principles — including ones you end up rejecting, with a sentence on why — before narrowing to the best one, and then give me (1) the principle stated precisely enough that I could apply it myself to a new case, (2) a clause-by-clause note on which of my verdicts forces that clause, (3) your principle's verdicts on the cases I haven't listed, and (4) an honest list of any of my verdicts it cannot accommodate, together with what I would have to give up to keep them.

  Some background on where I'm coming from: I'm a retired civil engineer with no philosophy training, I read a lot of popular history, and two friends and I argue about it in a pub reading group; I've realised I have firm, slightly inconsistent-feeling instincts about which causes a history ought to name, and I can't turn them into a rule. Here are my verdicts. Two people independently set fires at opposite ends of a warehouse, each fire alone sufficient to destroy it, warehouse destroyed: both of them caused the destruction, and an account that names only one isn't false but is misleading — I won't give that up. But in the version where two kids throw rocks at a bottle and Suzy's rock arrives first while Billy's would have shattered it a moment later, I say only Suzy's throw is a cause, even though the bottle was doomed either way just as in the fire case; these two are the pair I can't reconcile. With the Titanic I want to say the iceberg caused the sinking while the shortage of lifeboats did not cause the sinking but did cause the deaths, and I want those treated as the same kind of claim about different outcomes rather than as a real cause versus a mere background condition. In a stylised Chernobyl I happily cite the reactor design that misbehaved at low power and the operators who disabled safety systems to run a test, I cite the culture of secrecy uneasily, and I deny that a hypothetical earlier near-miss at a sister plant, covered up so that nobody in the control room knew, is a cause of the explosion — my friend insists it is, and I'll concede at most that it explains why they didn't act differently. In a stylised 2008 I cite subprime lending, the bundled securities, the ratings agencies and the leverage, and I flatly refuse to cite greed: greed is present in every boom and has no contrast. For the First World War I cite the Sarajevo assassination and the alliance commitments, I take the driver's wrong turn (if the story is right) to be a cause but not one worth putting in a book, and — this is the bit that bothers me — I want to say the alliances mattered more, in some sense, than the wrong turn, even though the wrong turn probably did more to raise the probability that a war happened at all; so whatever "mattered more" means for me, it isn't just probability-raising. Methodologically I also hold that there is no such thing as the real cause or the root cause, that singular "the cause of X" talk is always a mistake, and yet I do rank the causes I cite.

  Here is the rule I've been trying out — please test it against these cases and repair it rather than just replacing it. Call a factor a live-swap cause of an outcome when there was some alternative to it that was live in the situation (something that plausibly could have happened, or that someone on the scene was actually considering) and, had that alternative obtained, the outcome would probably not have happened; and add a second clause, that it doesn't count if the outcome would have been produced anyway by a second route already moving independently of it. Clause one is why I reject greed, and clause two is why I reject Billy's rock, but as far as I can tell clause two also kills both arsonists, which I refuse to accept; and I can't see how either clause separates "is a cause" from "is worth citing in a history", which I'm now convinced are two different questions. There's also the case I flip-flop on weekly: imagine a submarine officer during a nuclear crisis who declines to launch when he could have — on Mondays I say his refusal caused there to be no war, and on Fridays I say nothing happened, there is nothing to explain, and causation of an absence is a category mistake, which then sits badly with my lifeboats verdict. So: fix my rule if it can be fixed, tell me which clause is hopeless if it can't, say what principle best captures the rest of the pattern, and give me its verdicts on the cases I haven't raised — whether "no war was fought on its soil" is a cause of a country's twentieth-century prosperity, whether a dam that held is a cause of the town's survival in a history of that town, and whether my grandfather's decision to emigrate in the 1920s is a cause of my being alive and, separately, whether it is worth citing anywhere. (I also half-remember an expression like INUS condition from some encyclopedia entry, but I couldn't reconstruct the definition, so don't assume I mean anything technical by it.)
reasoning: |-
  Hmm, this retired civil engineer has given me quite the puzzle about causation in historical explanations. They've clearly thought deeply about this through their pub reading group debates, presenting a set of firm intuitions that feel slightly inconsistent to them. I need to approach this with both philosophical rigor and practical historian's sensibility.

  Their core tension is fascinating: they insist both warehouse arsonists caused the destruction, yet only Suzy's rock caused the bottle shattering - even though both involve overdetermined outcomes. Their other cases form a constellation of intuitions: distinguishing causes of sinking vs deaths in Titanic, rejecting "greed" as vacuous in 2008 crash, and wrestling with absences like the submarine officer's non-launch.

  Their proposed "live-swap" rule has potential but fails their warehouse test since clause two wrongly eliminates both arsonists. More fundamentally, it conflates causation with explanatory relevance - which they've wisely identified as separate issues. I notice they're allergic to "root cause" talk yet want to rank causes, and that methodological point is crucial.

  For my solution, I'll need to disentangle two layers: first, a minimal metaphysical notion of actual causation (did factor F make a difference?), then a separate filter for explanatory relevance (is mentioning F illuminating?). The warehouse and bottle cases suggest we need something more nuanced than simple counterfactual dependence - perhaps a "contribution" concept where simultaneous overdetermination counts but preemptive doesn't.

  Their submarine flip-flop reveals an unstated principle: we only explain deviations from normal baselines. This fits their lifeboat case (deaths are deviation) but not submarine (no-war was default). Also their Chernobyl near-miss rejection shows they value agential awareness - a clue about explanatory relevance.

  For the historical relevance filter, I'll build on their "live-swap" but add context-sensitivity: what's surprising or variable in this narrative? This handles their alliance/wrong-turn ranking - the turn was improbable but the alliances were the stable vulnerability. And for emigration-to-my-existence cases, I'll need to discuss explanatory interests.

  The engineer will appreciate precise applicability, so I'll state the principle as testable clauses, show how each clause resolves their cases, and honestly list where it contradicts their intuitions (like that covered-up near-miss). They're clearly sharp enough to handle some technicality if explained clearly, so I'll unpack "INUS" briefly but focus on their conceptual needs.
answer: |-
  Based on your detailed cases and methodological commitments, here's a precise principle developed through systematic analysis. We'll call it the **Contribution & Salience Framework for Historical Causation (CSF)**.

  **Brainstormed Candidate Principles (with Reasons for Rejection):**
  1.  **Necessary Condition:** F is a cause only if outcome O wouldn't have occurred without F. *Rejected:* Fails warehouse fires & Billy's rock (O happens either way).
  2.  **Sufficient Condition:** F is a cause only if F alone guarantees O. *Rejected:* Too broad (could include standing conditions like gravity), fails Titanic lifeboats.
  3.  **Probability-Raising:** F is a cause only if P(O|F) > P(O|~F). *Rejected:* Conflicts with your WWI alliance/wrong-turn ranking (wrong-turn raised probability more, but alliances matter more). Also struggles with overdetermination.
  4.  **But-For Causation (Counterfactual Dependence):** F is a cause only if O would not have occurred if F had not occurred. *Rejected:* Fails warehouse fires, Billy's rock, Titanic lifeboats for deaths.
  5.  **INUS Condition (Insufficient but Necessary part of an Unnecessary but Sufficient condition):** F is a cause if it's part of a minimal set of jointly sufficient conditions present in the circumstances, which is itself unnecessary (other sets could cause O) but sufficient. *Rejected:* Can be too broad (potentially includes covered-up near-miss), awkward for absences (officer's refusal), doesn't handle your "mattered more" ranking intuitively. (Note: INUS captures parts of your live-swap but isn't the full solution).
  6.  **Your Live-Swap + Independent Route Exclusion:** *Rejected:* Clause 2 wrongly excludes both arsonists; conflates causation with explanatory relevance.
  7.  **Agency/Intervention Focus:** F is a cause only if it involves a deliberate human action or intervention. *Rejected:* Excludes iceberg, reactor design, leverage - factors you clearly want to include.
  8.  **Contrastive Causation:** F is a cause only relative to a specific foil/scenario (~F). *Rejected:* Useful perspective, but doesn't resolve overdetermination conflicts or provide a standalone rule for "is it a cause?" without specifying the contrast.

  **The CSF Principle:**
  A factor F is an **actual cause** of outcome O in a specific historical situation *iff*:
  1.  **Contribution:** F was part of the actual sequence of events leading to O, *and* in that sequence, F made a non-redundant contribution to O's occurrence. A contribution is non-redundant if:
      *   It was **necessary** for O *in the actual sequence* at the moment it operated (i.e., removing *only* F at that moment, holding *all else fixed*, would have prevented O), *or*
      *   It was a **component** in a set of simultaneous factors whose *joint* operation was necessary *in the actual sequence* at that moment, and no subset of that set alone was sufficient at that moment.
  2.  **Salience (For Explanatory Relevance):** Whether F is worth citing in a historical explanation depends on:
      *   **Explicability:** Does citing F help make sense of why O occurred *in this specific context*?
      *   **Contrastive Relevance:** Is F variable or surprising *relative to the explanatory context and baseline expectations*? (F is less salient if it's a constant background condition).
      *   **Robustness:** Does F represent a stable vulnerability or opportunity, making similar outcomes likely in similar contexts?
      *   **Normative/Pragmatic Focus:** Does F align with the historian's specific question about O (e.g., physical destruction vs. human cost)?

  **Clause-by-Clause Justification Based on Your Verdicts:**
  *   **Contribution Clause:**
      *   *Necessity/Component Requirement:* Forces your Billy's rock verdict (Suzy's rock was necessary *at impact*; Billy's wasn't in the sequence). Accommodates both warehouse arsonists (each was a necessary component of the *simultaneous* minimal sufficient set operating at the time; removing *only* one arsonist *at the time* wouldn't have saved the warehouse). Forces Titanic iceberg (necessary in sequence) vs. lifeboats (not necessary for sinking). Forces Chernobyl operators/design (necessary components) vs. covered-up near-miss (not part of actual sequence, made no contribution). Forces rejection of greed (not a specific component necessary in the sequence of 2008 events).
      *   *Non-Redundant Contribution:* Forces your rejection of Billy's rock and acceptance of both arsonists. Separates "cause" from "background condition" by focusing on role in the actual sequence.
  *   **Salience Clause:**
      *   *Explicability:* Forces your desire to sometimes *cite* the driver's wrong turn (it explains the timing/trigger) but often omit it. Explains why greed isn't worth citing (doesn't explain *this specific* crash).
      *   *Contrastive Relevance:* Forces your rejection of greed (no relevant contrast where greed is absent in a boom). Explains why alliances "matter more" than the wrong turn (wrong turn is highly contingent/surprising but fleeting; alliances are a stable, less surprising vulnerability - their *absence* is the relevant contrast). Explains citing culture of secrecy "uneasily" (it's a stable background, less surprising than specific actions).
      *   *Robustness:* Forces your WWI alliance > wrong turn ranking (alliances represent a stable cause of vulnerability). Explains citing reactor design and ratings agencies (robust vulnerabilities).
      *   *Normative/Pragmatic Focus:* Forces your Titanic distinction (iceberg explains sinking; lifeboats explain deaths). Explains how "the cause" talk is always incomplete (different focuses yield different salient causes).

  **Verdicts on Your Unlisted Cases:**
  1.  **"No war was fought on its soil" as cause of prosperity?**
      *   *Actual Cause (Contribution):* Unlikely. It's usually a background *absence* of destructive events, not an active contributing component in the sequence generating prosperity (e.g., investments, policies, resources were the active components). Removing "no war" doesn't specify *what* destructive event would occur or how it would interact.
      *   *Salience:* Potentially highly relevant! It explains *why* the active factors (investment, etc.) *could* succeed (Explicability). It's a robust condition (Contrastive Relevance: contrast is "war fought on soil"). Often crucial for explaining differential prosperity (Normative Focus). **Verdict:** Not an *actual cause* under CSF, but often a highly *salient explanatory factor*.
  2.  **Dam that held as cause of town's survival?**
      *   *Actual Cause (Contribution):* **Yes, but...** Its contribution is the *prevention* of the flood. In the sequence leading to survival *despite the flood threat*, the dam's structural integrity was a necessary component (removing it - letting it fail - would have caused destruction). This requires analyzing survival *as an outcome requiring prevention*.
      *   *Salience:* Highly salient in a history focused on survival *from flood risk* (Explicability, Contrastive Relevance - dam failure was the threat, Robustness). Less salient if the history focuses on economic growth unrelated to floods. **Verdict:** **Is an actual cause** of the survival outcome *relative to the flood threat*. Salience depends on context.
  3.  **Grandfather's emigration as cause of your existence?**
      *   *Actual Cause (Contribution):* **Yes.** It was a necessary component in the specific sequence of events leading to your parents meeting and conceiving you at the specific time/place they did. Removing his emigration (holding all else fixed) breaks that chain.
      *   *Salience (Worth Citing):** Generally **No** in standard historical narratives. Why? Low Explicability for most historical outcomes (it explains *your specific existence*, not broader events). Low Contrastive Relevance (emigration decisions are common, not surprising relative to baseline). Low Robustness (highly specific, not a general factor). *However,* it *is* salient in a *family history* or biography focused on your lineage (Normative/Pragmatic Focus shifts). **Verdict:** **Is an actual cause** of *your specific existence*. **Not worth citing** in most historical accounts, but **highly salient** in a personal/family history.

  **Honest List of Your Verdicts CSF Cannot Accommodate (and the Cost):**
  1.  **Covered-Up Near-Miss at Chernobyl Sister Plant:** You deny it's a cause. CSF agrees it's not an *actual cause* (no contribution to the sequence). However, you concede it *explains why they didn't act differently*. CSF captures this perfectly under **Salience/Explicability** - it's potentially worth citing to explain the *context of decisions* (lack of knowledge, ingrained practices). **Accommodated as explanatory, not causal.**
  2.  **Submarine Officer Refusing to Launch:** Your Monday verdict ("refusal caused no war") conflicts with CSF, which treats absences cautiously. CSF verdict:
      *   *Actual Cause:* Problematic. "Refusal" is the *absence* of a launch. Preventing an event (war) isn't easily captured by "contribution to an outcome's occurrence" unless the outcome is defined as "peace persisted" *relative to the threat*. Defining O clearly is key.
      *   *Salience:* The refusal is *highly* salient! It explains why war *didn't* happen *in that critical moment* (Explicability). It's highly variable/surprising (Contrastive Relevance - launch was plausible). Extremely normatively relevant (Normative Focus).
      *   **Cost:** To accept your Monday verdict ("caused no war"), you must define the outcome O as "Avoidance of Nuclear War *at Time T*" and treat the officer's inaction as a necessary *component* (his launch *would* have caused war) in the sequence preserving peace. This stretches "contribution" but is internally consistent within CSF if you accept prevention as a causal outcome. Your Friday verdict ("category mistake") aligns better with CSF's default handling of absences. **CSF forces a choice:** Either reject absences as *causes* (stick with Friday) and treat them purely as salient *explanatory factors* for non-occurrences (which fits your lifeboats verdict - lifeboats prevent deaths, don't cause sinking), OR expand CSF's Contribution clause to explicitly handle *prevention* as a causal outcome type (accept Monday, requires modifying CSF). Your lifeboats case is already covered (lifeboats are a cause *of survival*, not of sinking).

  **CSF vs. Your Live-Swap Rule:**
  *   **Fixed:** CSF Contribution replaces both clauses. The "non-redundant contribution" directly handles warehouse fires (simultaneous necessary components) and Billy's rock (preemption - Suzy's rock was necessary at impact). It doesn't exclude independent routes if they are part of the simultaneous minimal set.
  *   **Separated:** CSF cleanly separates "Actual Cause" (Contribution) from "Worth Citing" (Salience).
  *   **Accommodates:** CSF handles Titanic distinction (different outcomes), rejects greed and covered-up near-miss as causes, explains alliance/wrong-turn ranking via Salience/Robustness.

  **In Summary:** The CSF Principle provides a precise, testable framework separating the metaphysics of actual contribution in the sequence from the pragmatics of historical explanation. It resolves your core warehouse/Suzy-Billy conflict, accommodates most of your verdicts, clarifies absences (forcing a choice consistent with your other views), and offers clear verdicts on new cases. Its main cost is requiring a careful definition of the outcome O and potentially stretching to handle prevention if you insist on your Monday submarine verdict.
