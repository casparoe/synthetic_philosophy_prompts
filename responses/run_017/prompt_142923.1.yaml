  The rule penalizes forecasters whose final probabilities diverge more than 20 points from the pool aggregate by shrinking their contribution by 60% toward the mean and adding a public marker after three such divergences. The two forecasters have repeatedly been on opposite ends (0.8 vs 0.2) on capability-bar questions across multiple seasons. They argue: (1) sometimes they weren't even pricing the same event due to different reference classes, (2) even when they were, their disagreement stems from priors not evidence interpretation, and (3) the public marker falsely implies irrationality.

  The data lead defends the rule citing an 11% Brier score improvement since implementation, arguing persistent divergence indicates failure to update under the shared-prior model. But complications exist: 3 of 14 flagged positions resolved correctly (including a major miss), and the audit can't distinguish prior heterogeneity from updating failures in the logs. 

  The user needs a 1200-word memo recommending: keep rule, suspend it, keep shrinkage but drop/reword marker, or make shrinkage conditional on proven mismatch. Must clarify the shared-prior assumption's role (rationality requirement? empirical claim? modeling convention?) and which aspects can be enforced. Needs balanced arguments with a pre-registered test for next season. No citations - pure case-structure reasoning. 

  Hmm... this is a beautifully messy problem at the intersection of epistemology, incentive design, and operational ethics. The user's engineering background shows in their focus on observable signals and testability. Their hidden tension: they built the system but now see its philosophical cracks, and need to adjudicate without formal philosophy training. 

  The core conflict is between two visions of rationality: the data lead sees Bayes-updating as the gold standard, while the appellants defend prior-diversity as legitimate. The audit's bluntness is problematic because: (a) it conflates reference-class mismatches (arguably a question-design failure) with belief divergence, (b) punishes accurate outliers, and (c) makes unfalsifiable rationality claims. 

  Key insight: The shared-prior assumption here functions as a modeling convention for aggregation, not a provable property of individuals. Enforcing it as a rationality requirement overreaches because: (1) we lack access to mental states, (2) reference-class selection is inherently subjective, and (3) the convention itself may be flawed for extreme-tails forecasting. 

  The 11% Brier improvement might just reflect suppressing variance - the three correct outliers suggest the rule sometimes discards signal. We need to test whether dispersion penalties improve accuracy or just convergence. 

  Recommendation should preserve shrinkage (it protects the aggregate) but scrap the public marker (it makes contested epistemological claims). Instead, implement a pre-deliberation reference-class audit for capability-bar questions. For the test: pre-register analysis of resolved questions where shrinkage was applied, comparing accuracy of shrunk vs original forecasts. 

  Biggest challenge: explaining why "failure to update" can't be objectively identified without sounding like I'm dismissing Bayesianism. Need to position it as a limitation of observable data, not a philosophical stance.
answer: |-
  ## Memorandum: Recommendation on Dispersion Review Appeal (Adeyemi & Kowalczyk)

  **To:** Methodology and Appeals Committee, Meridian Forecasting  
  **From:** [Your Name], Software Engineer & Committee Member  
  **Date:** 10 March 2024  
  **Subject:** Recommendation re: Appeal of Adeyemi & Kowalczyk on Dispersion Review Rule & Proposed Modifications  

  **1. Executive Summary:**  
  I recommend **retaining the core dispersion-based shrinkage mechanism but suspending the application of the "sustained-divergence" public marker for a defined period (one season)**. Simultaneously, we should **implement a mandatory pre-deliberation reference-class alignment check for specific question types (starting with capability-bar questions)** and **pre-register a rigorous test for next season** to evaluate whether the shrinkage rule primarily improves accuracy or merely enforces convergence. This balances the need for a robust aggregate, addresses the appellants' valid concerns about legitimacy and fairness, acknowledges the data lead's empirical results, and provides a clear path for evidence-based reassessment. The shared-prior assumption functions primarily as a *modeling convention* necessary for our aggregation method, not as an enforceable requirement of individual rationality that we can reliably diagnose or publicly label.

  **2. The Core Conflict: Legitimate Heterogeneity vs. Rational Failure**  
  The appeal by Adeyemi and Kowalczyk challenges the fundamental premise of the Dispersion Review: that persistent, significant post-deliberation divergence from the pool aggregate is *prima facie* evidence of a rational failure (failure to update appropriately on shared evidence and peer reasoning). Their arguments highlight two plausible alternative explanations:

  *   **Event-Space Mismatch (Denotational Drift):** Forecasters interpret the question as referring to different events. Our own reference-class tagging system provides prima facie evidence this occurred in some instances. If Adeyemi is forecasting based on "AI systems achieving capability X *via architecture family Y*" (low base-rate) while Kowalczyk uses "AI systems achieving capability X *via any known path*" (higher base-rate), their probabilities address distinct propositions. Penalizing this mismatch is punishing clarity failure in question design or briefing, not forecaster irrationality.
  *   **Legitimate Prior Heterogeneity:** Even assuming a shared event definition, forecasters may rationally hold fundamentally different priors about the underlying reference class ("which urn"). If the evidence presented during deliberation is ambiguous or insufficient to overwhelmingly shift one prior towards the other, rational individuals *can* and *should* maintain divergent beliefs. Labeling this as a "failure to update" misrepresents rational Bayesian reasoning under genuine prior uncertainty.

  The Data Lead rightly defends the rule's empirical benefit (11% Brier improvement) and the theoretical foundation of shared-prior models: common priors plus common knowledge of each other's beliefs *should* lead to convergence under rational updating. Persistent divergence *is* anomalous within that model. The aggregate loses its value as a "rational consensus" if it simply averages fundamentally incompatible worldviews without a mechanism to mitigate the influence of potentially irrational outliers. The rule provides teeth to the model.

  **3. Complications Undermining the Current Rule's Application & Justification**
  The Data Lead's defense, while strong in theory and aggregate result, faces significant practical and epistemological challenges revealed by this appeal and subsequent investigation:

  *   **The Accuracy/Conflation Problem:** The 11% Brier score improvement tells us the *aggregate* got better on average after implementing the rule. It does *not* tell us *why*. Did the rule successfully identify and downweight genuinely irrational forecasts, thereby refining the signal? Or did it primarily suppress *accurate* but divergent forecasts (like the 3 correct flags, including our largest miss), thereby *enforcing harmful convergence*? The rule acts *before* resolution, so its direct impact on individual forecast accuracy within the aggregate is opaque. We conflate reduced dispersion with improved accuracy.
  *   **The Observational Equivalence Problem:** Our logs cannot reliably distinguish between:
      1.  *Rational Agent A:* Starts with prior P(A), sees evidence E and peer forecast P(B), rationally updates to P(A|E, P(B)) which remains far from the mean.
      2.  *Stubborn Agent B:* Starts with prior P(B), sees evidence E and peer forecast P(A), fails to rationally update, remains at P(B).
      3.  *Mismatched Agent C:* Interprets the question differently, rendering P(A) and P(B) forecasts of non-identical events.
      All three scenarios leave identical traces in our data: a final probability far from the aggregate after deliberation. The rule implicitly assumes Scenario 2 is dominant and actionable, but we lack the diagnostic tools to confirm this.
  *   **The Public Labeling Problem:** Applying a "sustained-divergence" marker publicly implies Meridian has diagnosed *irrationality* or *poor reasoning*. Given the Observational Equivalence Problem, this claim is epistemically overreaching and potentially libelous. Even if we suspect Scenario 2, we cannot prove it externally. Punishing reputation and compensation based on this unverifiable diagnosis is ethically fraught and demoralizing for skilled forecasters like the appellants.

  **4. The Role of the Shared-Prior Assumption: Convention, Not Commandment**
  The shared-prior assumption is central to the theoretical justification for expecting convergence and for designing rules like the Dispersion Review. However, its role in our pipeline must be clarified:

  *   **As a Modeling Convention:** This is its primary and most defensible function. Our aggregation algorithm (implicitly or explicitly) relies on the mathematical framework derived from common prior assumptions to produce a single, coherent "consensus" probability. The Dispersion Review is a *heuristic mechanism* designed to make the aggregate robust within the constraints of this chosen model by mitigating the influence of points too far from the model's expected center. **We are entitled to enforce mechanisms protecting the integrity of our chosen model's output (the published aggregate).**
  *   **As an Empirical Claim:** This is highly contestable. We have no evidence that all forecasters genuinely share identical prior beliefs about complex, long-horizon questions like capability bars. Reference-class heterogeneity suggests otherwise. Assuming a common prior is a simplification for modeling, not a verified fact about our forecasters' minds. **We are not entitled to enforce an empirical claim about individual forecaster priors that we cannot verify.**
  *   **As a Requirement of Rationality:** While Bayesian rationality *conditional on a shared prior* demands convergence under common knowledge, rationality *does not require individuals to share the same prior*. Rational agents can legitimately disagree based on differing fundamental worldviews (reference classes) even after sharing all evidence. **We are not entitled to label an individual as "irrational" solely for maintaining a divergent prior within our model's framework, especially when we cannot verify if their prior is shared or not.**

  **5. Strong Case for the Data Lead's Position (To Be Addressed Honestly)**
  The Data Lead, and proponents of the current rule, could compellingly argue:

  *   **Model Integrity is Paramount:** The 11% Brier gain proves the model works better with the rule. Our product is the *rational consensus aggregate*, not a platform for showcasing individual priors. The shared-prior model is the best tool we have for synthesis. Without rules enforcing its logic (like penalizing persistent divergence), the aggregate degrades into a mere average, losing its unique value proposition to clients. "Respectable prior heterogeneity" is indistinguishable from stubbornness in practice and, if unchecked, destroys the model's coherence.
  *   **Burden of Proof on the Divergent:** Deliberation exists to resolve ambiguity and align interpretations. If two forecasters, after seeing the *same* briefing and *each other's reasoning*, remain poles apart, the burden should fall on *them* to demonstrate this is due to legitimate denotational drift or irreconcilable priors – not on the system to prove irrationality. The rule creates necessary accountability. The marker, while strong, incentivizes forecasters to engage seriously in deliberation and question clarification *before* submission.
  *   **False Positives are a Cost of Doing Business:** The three correct flagged forecasts are regrettable but rare (3 out of 14 resolved flags). The 11% overall gain suggests the *net* effect is overwhelmingly positive. Suppressing some true signal is an acceptable trade-off for significantly reducing noise and protecting the aggregate from demonstrably poor forecasts the majority of the time. Perfect diagnostics are impossible; we must use the best observable proxy (post-deliberation divergence).

  **6. Recommendation: Targeted Modification with Pre-Registered Test**
  Retaining the status quo risks alienating top talent and perpetuating potential injustices based on unverifiable diagnoses. Abandoning the rule risks degrading the aggregate. Therefore, I propose:

  *   **Retain Dispersion-Based Shrinkage (60% towards mean for >20pt divergence):** This protects the integrity of the aggregate output, our core product, based on the modeling convention. This addresses the Data Lead's primary concern about model coherence and the demonstrated aggregate Brier gain.
  *   **Suspend Application of the "Sustained-Divergence" Public Marker for Season [Next Season Start Date] - [Next Season End Date]:** This addresses the appellants' most significant objection regarding unsubstantiated public claims of irrationality. It removes the reputational and compensation impact while we test alternatives. Divergences will still be tracked internally.
  *   **Implement Mandatory Pre-Deliberation Reference-Class Alignment Check for Capability-Bar Questions (Pilot):** *Before* the deliberation window opens, forecasters must declare their primary reference class for the question using a standardized set of options (developed by Methodology) or a brief free-text justification. Any forecaster declaring a reference class used by <10% of the pool *must* briefly justify it in a shared note visible to all. This directly addresses Event-Space Mismatch *proactively*, potentially reducing *unwarranted* dispersion. This is enforceable as a question-clarity procedure.
  *   **Pre-Register a Test for Next Season:** We will rigorously analyze, *after resolution*:
      1.  **Accuracy of Shrunk Forecasts:** For all forecasts where shrinkage was applied, compare the Brier score of the *original* forecaster probability and the *shrunk* value against the outcome. Did shrinkage *improve* or *worsen* the accuracy contribution of that individual forecast? (Hypothesis: If the rule mainly suppresses accurate outliers, shrunk values will have worse Brier scores than originals for resolved questions).
      2.  **Source of Dispersion:** For all flagged divergences, categorize them post-hoc based on reference-class declarations and reasoning:
          *   Category A: Clear event-space mismatch (different reference classes declared).
          *   Category B: Shared reference class, divergent prior evident in reasoning.
          *   Category C: Shared reference class, no clear rationale for divergence (potential updating failure).
      3.  **Net Impact Analysis:** Compare the overall Brier score of our published aggregate next season to a counterfactual aggregate calculated *without applying any dispersion shrinkage* (using same weights/method otherwise). Does the rule still provide a net accuracy benefit?

  **7. Rationale & Expected Outcomes**
  *   **Why Keep Shrinkage?** It directly protects the published aggregate based on our model. The empirical aggregate benefit (11%) is significant, and shrinkage avoids the "plain average" collapse the Data Lead fears. It focuses on the *output*, not the *diagnosis* of the individual.
  *   **Why Suspend the Marker?** The Observational Equivalence Problem makes the marker's implication of irrationality unsustainable and unfair. It risks punishing skill (accurate strong priors) and mislabels legitimate differences. Suspension removes this ethical and reputational risk while we gather better data.
  *   **Why the Reference-Class Check?** This directly tackles a major source of *unintended* divergence flagged by appellants. It promotes question clarity *before* forecasts lock in and provides crucial data (Category A) to distinguish mismatch from genuine belief divergence. It's a procedural fix within our control.
  *   **Why This Test?** It directly addresses the core unknowns:
      *   Test 1 tells us if shrinkage hurts accurate forecasters.
      *   Test 2 quantifies how much divergence stems from mismatch (A) vs. priors (B) vs. potential irrationality (C).
      *   Test 3 tells us if the shrinkage rule *still* improves the aggregate *after* implementing the reference-class check.
      Pre-registration ensures objectivity and buys credibility with appellants and the Data Lead.

  **8. Conclusion & Path Forward**
  The Adeyemi/Kowalczyk appeal exposes critical limitations in applying the Dispersion Review's diagnostic label ("sustained divergence = irrationality") due to the Observational Equivalence Problem and the legitimacy of prior heterogeneity. However, the core mechanism (shrinkage) serves a valid purpose in safeguarding our aggregate model. My recommendation balances these tensions: preserving the aggregate protection, removing the unjust public label, proactively reducing one source of *unwarranted* dispersion, and committing to a decisive, pre-registered test using next season's data.

  This approach respects the appellants' concerns about fairness and diagnosis, acknowledges the Data Lead's legitimate focus on model integrity and aggregate performance, and provides a clear, evidence-based path for a final decision on the marker and the rule's future after next season. I propose we adopt this modified approach for the coming season and review the results of the pre-registered test at our first committee meeting following its conclusion.
