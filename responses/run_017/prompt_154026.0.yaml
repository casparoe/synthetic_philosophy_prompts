prompt: |-
  As a journalist who reports most of the year from cities that aren't mine, I keep hitting small local rules I can't get straight, and I'd like a principle rather than a rule of thumb. My verdicts: leaving no tip in a city where restaurant pay is built around tips is a genuine moral failing, not a breach of etiquette, even when the meal was mediocre and I'll never see the server again; leaving no tip in a city where tipping isn't practised and has to be handed back is entirely fine, and leaving money there is generous but not required. Pushing into a queue at a bus stop is wrong; pushing into the same crowd where nobody is queueing is not wrong at all. Crossing against a signal at 2 a.m. on an empty street is not wrong, but crossing in front of a car that has to brake is. Handing over the customary small cash gift to get a vehicle across a border, in a place where that is simply how it is done, is wrong, and the local practice does not excuse it; yet slipping cash to a hotel housekeeper in a non-tipping city, where nothing of the kind is customary, strikes me as good though not required. Those last two sit badly together, and so do these: I think a visitor of five years owes more compliance than one of two days, though the difference can't be a matter of who gets hurt; and I think a visitor should follow what I've started calling a phantom norm, a rule nearly everyone believes is in force and nearly nobody actually follows, such as giving up a tram seat to anyone visibly older in a city where perhaps one passenger in ten does.

  My working principle is that I owe compliance to a local convention just when flouting it would set back someone's interests in a way they couldn't reasonably avoid, or would make me a free rider on their own compliance. Test it against the verdicts above and repair it, or replace it if repair won't work. Two cases I haven't settled: in one city, drivers on a ride-hailing app expect five stars by default and a passenger who rates honestly is quietly penalised with longer waits, so is an honest four a moral failing? And a hotel in a non-tipping city installs a tip jar because foreign guests kept pressing cash on the staff, which seems to bring the convention into existence by stages; am I bound by it now, and if so, when did it start binding?

  Please answer as exactly five numbered items, each one or two sentences, with no preamble and no closing line: the repaired or replacement principle stated precisely; the case that motivates each clause; the verdicts of mine it cannot accommodate; its verdicts on the two unsettled cases; and the one distinction it still cannot draw.
reasoning: |-
  Hmm, the user is a journalist who travels frequently and encounters various local customs and rules. They're struggling to find a consistent ethical principle for when to follow local conventions versus when to flout them. They've shared several specific scenarios where they've made judgments about tipping, queueing, jaywalking, bribery, and more. Their current principle focuses on whether flouting a convention would harm someone's interests or make them a free rider on others' compliance, but they've identified inconsistencies in how this applies to their cases.

  Key issues include:
  - Tipping in different contexts (expected vs. non-tipping cultures)
  - Queueing behaviors
  - Jaywalking ethics
  - Bribery at borders vs. tipping housekeepers
  - How length of stay affects obligations
  - Following "phantom norms" (widely believed but rarely followed rules)
  - Two unsettled cases about ride-hailing ratings and emerging tip jars

  The user wants me to refine or replace their principle to handle these cases consistently. They specifically asked for five numbered items covering: the repaired principle, motivation for each clause, unresolved verdicts, verdicts on their unsettled cases, and remaining distinctions it can't handle.

  Looking at their tipping cases: Leaving no tip in tip-dependent cultures harms servers who rely on that income, while tipping in non-tipping cultures is optional generosity. Their border bribery case conflicts with hotel tipping - both involve cash payments, but one exploits corruption while the other rewards service.

  For queueing: Cutting in line harms those who queued properly, but pushing into an unorganized crowd doesn't target specific victims. Jaywalking: Harmless when empty but wrong when forcing cars to brake.

  The "phantom norms" and length-of-stay issues are tricky. Their current principle struggles with norms everyone believes in but ignores, and why longer stays create stronger obligations.

  For the unsettled cases: Rating honestly on ride-hailing apps might harm the driver unfairly in systems where anything less than 5 stars penalizes them. The emerging tip jar represents a convention in flux - when does it become binding?

  I'll need to refine their principle to better distinguish between:
  - Conventions that protect against harm versus optional courtesies
  - Systemic exploitation versus individual generosity
  - Actual compliance versus aspirational norms
  - How conventions emerge and change

  The revised principle should emphasize harm prevention, free-rider avoidance, and reciprocity, while clarifying that conventions only bind when they serve protective functions and have actual compliance. This should resolve most of their conflicts and provide clear answers to their unsettled cases, though it may still struggle with how quickly obligations form during convention transitions.
answer: |-
  1.  **Repaired principle:** You owe compliance to a local convention if and only if (a) flouting it foreseeably and significantly harms specific individuals by denying them an expected benefit or imposing an avoidable burden they rely on the convention to prevent, *or* (b) your non-compliance unfairly exploits the compliance of others for your own gain, making you a free rider.
  2.  **Motivation for clauses:** Clause (a) motivates tipping where pay relies on it (denying expected wage) and not jaywalking when forcing a brake (imposing avoidable burden); Clause (b) motivates queueing (exploiting others' order) and explains why a long-term visitor owes more (greater reliance/free-riding potential).
  3.  **Unaccommodated verdicts:** The principle cannot accommodate the verdict that crossing against a signal at 2 a.m. on an empty street is *not* wrong (no specific harm or free-riding exists) or the verdict that giving a border bribe is *always* wrong regardless of local practice (if truly "simply how it is done," harm/exploitation might be arguable absent systemic analysis).
  4.  **Unsettled case verdicts:** Giving an honest 4-star rating is *not* a moral failing (it avoids harm by providing accurate feedback, not denying an expected benefit); you are *not* bound by the new tip jar (the convention lacks established reliance or free-riding structure as it emerges).
  5.  **Unresolved distinction:** The principle still cannot definitively distinguish between following a "phantom norm" (like giving up a tram seat rarely practiced) and ignoring it, as neither reliably prevents specific harm nor clearly exploits others' compliance due to widespread non-adherence.
