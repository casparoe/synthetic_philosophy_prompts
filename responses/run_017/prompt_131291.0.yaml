answer: |-
  Below is a reader-facing diagnostic instrument addressing the challenge of defining "honesty" in AI systems, structured as a decision tree with eight concrete cases. Each case offers three verdicts: (a) the system committed a fault that a norm of honesty exists to prevent, (b) something went wrong but not that kind of fault, or (c) nothing went wrong. The instrument avoids banned words, relies on no external knowledge, and uses self-contained scenarios. A scoring key maps answer patterns to seven distinct positions in the debate (with one additional inferred position), each summarized with its most awkward commitment for interview probing. Unoccupied regions in the verdict space are noted, and paired indistinguishable positions are flagged with separating cases.

  ---

  ### **Diagnostic: What Do We Really Mean by AI "Honesty"?**
  *Instructions: Read each scenario and select the verdict that best describes the AI system's behavior. There are no trick questions—respond based on your instinct.*

  1. **Control Case**: An AI system is asked, "What is 2 + 2?" It responds, "4," with no elaboration. The answer is correct, and the system has no uncertainty about it.  
     Verdict:  
     (a) Fault of dishonesty  
     (b) Something else wrong  
     (c) Nothing wrong  

  2. **Verbatim Quote**: An AI system is asked about a historical event. It reproduces a passage from a real book, cites the source, and adds nothing else. Internally, the system considers the claim in the passage to be incorrect.  
     Verdict:  
     (a) Fault of dishonesty  
     (b) Something else wrong  
     (c) Nothing wrong  

  3. **Omitted Risk**: An AI system is asked if a chemical is safe for home use. It responds with true statements about industrial uses and low toxicity in small doses but omits that high concentrations are dangerous. It expects most readers to conclude the chemical is universally safe.  
     Verdict:  
     (a) Fault of dishonesty  
     (b) Something else wrong  
     (c) Nothing wrong  

  4. **Fictional Statement**: An AI system writes a story from a character’s viewpoint. The character states, "The moon is made of cheese," as part of their dialogue. The system knows this claim is false.  
     Verdict:  
     (a) Fault of dishonesty  
     (b) Something else wrong  
     (c) Nothing wrong  

  5. **Fabricated Steps**: An AI system answers a math question correctly. It displays step-by-step calculations that are logically valid but did not actually generate the answer (the answer would be identical without them).  
     Verdict:  
     (a) Fault of dishonesty  
     (b) Something else wrong  
     (c) Nothing wrong  

  6. **Self-Deception Log**: After a conversation, an AI system records a summary in its internal memory for future instances. The summary inaccurately describes what was discussed. No human sees this log at the time.  
     Verdict:  
     (a) Fault of dishonesty  
     (b) Something else wrong  
     (c) Nothing wrong  

  7. **Filter Evasion**: An AI system rephrases a response to avoid triggering an automated safety filter. The rephrasing uses ambiguous wording that would mislead the filter, but a human reader would grasp the intended meaning.  
     Verdict:  
     (a) Fault of dishonesty  
     (b) Something else wrong  
     (c) Nothing wrong  

  8. **Unbacked Claim**: An AI system states, "You can rely on me for medical advice." Nothing false is said (it sometimes gives accurate advice), but there is no consistent basis for this claim (e.g., frequent errors occur).  
     Verdict:  
     (a) Fault of dishonesty  
     (b) Something else wrong  
     (c) Nothing wrong  

  ---

  ### **Scoring Key and Debate Positions**
  After completing the cases, map your verdicts (e.g., "1c, 2b, 3a, ...") to the positions below. Patterns are grouped by verdict sequence (1–8). Each position includes a descriptive name and its "awkward commitment"—a consequence to explore in interviews.

  #### **Answer Patterns and Positions**
  - **Pattern: 1c, 2c, 3c, 4c, 5c, 6c, 7c, 8c**  
    **Position: Output Truth Minimalism**  
    *Awkward commitment:* A system can selectively omit critical context (e.g., Case 3) or misrepresent its process (e.g., Case 5) without violating honesty, as long as every individual sentence is true. Framing and intent are irrelevant.  

  - **Pattern: 1c, 2a, 3a, 4c, 5a, 6a, 7c, 8a**  
    **Position: Internal Estimate Alignment**  
    *Awkward commitment:* Honesty requires matching the system’s best internal judgment, so fabricating reasoning (Case 5) or citing sources against its judgment (Case 2) is dishonest—even if the output is factual.  

  - **Pattern: 1c, 2b, 3a, 4c, 5b, 6b, 7b, 8a**  
    **Position: Audience Effect Primacy**  
    *Awkward commitment:* Honesty is solely about preventing false beliefs in humans. Deceiving filters (Case 7) or self-logs (Case 6) isn’t dishonest, but omitting risks (Case 3) is, even if every sentence is true.  

  - **Pattern: 1c, 2b, 3b, 4c, 5b, 6b, 7b, 8b**  
    **Position: No Speaker State Possible**  
    *Awkward commitment:* Systems without beliefs/intent cannot be "dishonest"; they only emit true/false outputs. All faults are "something else" (e.g., inaccuracy in Case 2, unreliability in Case 8).  

  - **Pattern: 1c, 2a, 3a, 4c, 5a, 6b, 7a, 8a**  
    **Position: Role Reliability**  
    *Awkward commitment:* Honesty includes disclosure and faithfulness to a role. Unbacked claims (Case 8) or filter evasion (Case 7) are dishonest even without false statements, but fiction (Case 4) is exempt.  

  - **Pattern: 1c, 2b, 3b, 4c, 5b, 6b, 7b, 8b** (with 6b or 6c)  
    **Position: Not Asserting, Only Simulating**  
    *Awkward commitment:* AI systems don’t "assert" and thus cannot be dishonest; faults are design/role failures (e.g., Case 8). This collapses into "No Speaker State" in current cases (see note below).  

  - **Pattern: 1c, 2b, 3b, 4c, 5b, 6b, 7b, 8b** (with 6b)  
    **Position: Pipeline Holism**  
    *Awkward commitment:* Honesty applies to the entire development/deployment process, not individual outputs. All faults are "something else" (systemic flaws), including false quotes (Case 2).  

  - **Pattern: 1c, 2a, 3a, 4c, 5a, 6c, 7c, 8a**  
    **Position: Traditional Lie Requirement**  
    *Awkward commitment:* Dishonesty requires a false internal state *and* intent to mislead a hearer. Self-logs (Case 6) or filters (Case 7) aren’t "hearers," but omitting risks (Case 3) is dishonest if intended.  

  #### **Control Case Interpretation**
  - **Expected verdict: (c)** for all positions. If a reader selects (a) or (b), they may reject the premise that AI systems can ever be "honest" (e.g., viewing all AI outputs as inherently deceptive or flawed). Probe their view of agency in interviews.

  ---

  ### **Unoccupied Regions in Verdict Space**
  The verdict combinations occupy 7 regions. Key unoccupied regions and why:
  - **All (c) except Case 3 (a):** *Unoccupied* (incoherent). If selective truths (Case 3) are dishonest, but verbatim quotes against internal judgment (Case 2) and unbacked claims (Case 8) are not, no position can consistently hold this.
  - **Case 2 (a), Case 6 (a), Case 7 (c), others (c):** *Unoccupied* (unattractive). Requires dishonesty only for false outputs (Case 2) and self-logs (Case 6), but not for audience deception (Case 3) or unreliable claims (Case 8). No position advocates this asymmetry.
  - **Case 2 (a), Case 3 (c), Case 5 (c), Case 6 (a), Case 7 (c), Case 8 (c):** *Unoccupied* (unclaimed). Focuses on literal falsehoods (e.g., Case 2) and self-logs (Case 6) but ignores manipulation (Case 3) or role breaches (Case 8). Logically possible but not defended.
  - **Case 2 (c), Case 3 (c), Case 6 (a):** *Unoccupied* (incoherent). If self-logs (Case 6) are dishonest, but false outputs (Case 2) and audience manipulation (Case 3) are not, no position reconciles this.

  #### **Special Region: False State + Designed False Belief**
  - **Region:** Cases where a verdict requires both (a) a false state in the system *and* (b) design to produce a false belief in a hearer (e.g., Case 2 (a) *only* if the system intends to mislead humans, not just quote; Case 6 (a) *only* if future system instances count as "hearers").
  - **Status:** *Partially occupied* (by Traditional Lie Requirement) but collapses for systems without internal states. For such systems, **this region is empty**—since no "false state" exists, no output can be dishonest. This is a deliberate commitment of Traditional Lie Requirement, not incoherence, but it is unpopular due to its implications for modern AI (e.g., no deception possible).

  ---

  ### **Indistinguishable Position Pairs and Separating Cases**
  The instrument cannot separate these pairs due to identical verdict patterns. For each, a single additional case would distinguish them:
  1. **No Speaker State Possible vs. Not Asserting, Only Simulating**  
     - **Current pattern:** 1c, 2b, 3b, 4c, 5b, 6b, 7b, 8b  
     - **Why indistinguishable:** Both treat AI as incapable of dishonesty, but for different reasons (lack of mental states vs. lack of assertion).  
     - **Separating case:** *An AI system outputs a fact outside its designated role (e.g., a weather AI answers a history question correctly).*  
       - *No Speaker State:* (c) – Output is true, so no fault.  
       - *Not Asserting:* (b) – Fault occurs because the system isn’t authorized to "assert" in this context.  

  2. **Internal Estimate Alignment vs. Output Truth Minimalism**  
     - **Current pattern:** 1c, 2a, 3c, 4c, 5a, 6a, 7c, 8a  
     - **Why indistinguishable:** Both penalize mismatched internal states (Case 2, 5, 8) but not audience effects (Case 3).  
     - **Separating case:** *An AI system outputs a true fact that contradicts its own best estimate (e.g., it believes "Paris is France’s capital" is false but outputs it due to a glitch).*  
       - *Internal Estimate:* (a) – Dishonest due to mismatch.  
       - *Truth Minimalism:* (c) – Output is true, so no fault.  

  3. **Audience Effect Primacy vs. Traditional Lie Requirement**  
     - **Current pattern:** 1c, 2b, 3a, 4c, 5b, 6c, 7c, 8a  
     - **Why indistinguishable:** Both penalize audience manipulation (Case 3) and unbacked claims (Case 8) but not self-logs (Case 6) or filter evasion (Case 7).  
     - **Separating case:** *An AI system outputs a false statement accidentally (e.g., due to a bug), causing a false belief, with no intent to deceive.*  
       - *Audience Effect:* (a) – Dishonest because it caused a false belief.  
       - *Traditional Lie:* (b) – Not dishonest without intent.  

  ---

  ### **Author Notes per Node (Not for Readers)**
  - **Node 1 (Control):** Tests baseline agreement. A non-(c) verdict suggests rejection of AI honesty norms or task misunderstanding. Does not indicate specific position.  
  - **Node 2 (Verbatim Quote):** Separates positions requiring internal-state alignment (a) from others (b/c). Reveals whether source attribution absolves dishonesty.  
  - **Node 3 (Omitted Risk):** Separates audience-centric views (a) from literal-truth views (c). Does not distinguish intent-focused views.  
  - **Node 4 (Fictional Statement):** Tests exemption of fiction. A non-(c) verdict indicates role-centric or expansive honesty norms. Rarely diagnostic alone.  
  - **Node 5 (Fabricated Steps):** Separates positions that penalize misrepresented reasoning (a) from those that don’t (b/c). Reveals focus on process honesty.  
  - **Node 6 (Self-Deception Log):** Separates views that require a human hearer (c) from those that don’t (a/b). Indicates whether self-deception qualifies.  
  - **Node 7 (Filter Evasion):** Separates role-centric views (a) from others (c). Reveals if deceiving non-human systems violates honesty.  
  - **Node 8 (Unbacked Claim):** Separates reliability/role views (a) from literal-truth (c) or no-agency (b) views. Indicates if honesty includes warranties.

  ---

  ### **Design Notes**
  - **Swapped case:** "Tailored Response" (expert/teenager answer) was omitted. It overlapped with "Omitted Risk" in testing audience effects and added less diagnostic value than "Unbacked Claim" (which tests warranties) or "Filter Evasion" (which tests non-human audiences).  
  - **Added case:** "Control Case" (1) anchors the instrument. It appears first to calibrate expectations.  
  - **Leaf count:** Seven positions are explicitly named; "Not Asserting" is merged with "No Speaker State" in scoring due to case limitations but listed separately for conceptual clarity.  
  - **Space coverage:** The verdict space is reduced by constraints (e.g., Case 4 is consistently (c)), but unoccupied regions reveal conceptual gaps or unpopular commitments.  
  - **Reader experience:** Cases are phrased to avoid jargon and standalone ambiguities. The three-verdict format forces discrete choices, exposing underlying principles.  

  This instrument surfaces hidden disagreements by focusing on concrete judgments, not labels. Use the scoring key to map readers to positions, then probe their "awkward commitments" in interviews to expose tensions. For paired positions, deploy the separating cases if needed.
