answer: |-
  Here’s a rigorous breakdown of your compiler/translation analogy, residue analysis, and epistemic grounding. I’ll proceed stepwise, flagging distortions, contested claims, and irreducibles.

  ---

  ### **Brainstorming: Rough Mappings (and Rejections)**
  *(Mappings marked with ⚠️ are unstable; ~~struck~~ are rejected)*

  | Compiler Concept          | Translation Theory Candidate                     | Assessment                                                                 |
  |---------------------------|--------------------------------------------------|----------------------------------------------------------------------------|
  | **AST**                   | Deep structure / logical form                    | ⚠️ *Too Chomskyan; poems aren’t context-free. Better: thematic/symbolic core.* |
  | **Semantics-preserving rewrite** | Faithful translation                         | ⚠️ *"Semantics" is fuzzier here; poetic meaning is emergent, not compositional.* |
  | **Pretty-printer**        | Form-based translation (rhyme/meter)             | ~~Rejected: Form isn’t "pretty-printing" in poetry; it generates meaning.~~ |
  | **Observational equivalence** | Effect on competent reader                   | ✅ *Closest match: preserves "behavior" under interpretation.*             |
  | **Optimization levels**   | Tradeoffs (e.g., literal vs. dynamic equivalence)| ✅ *Useful: -O0 = word-for-word, -O3 = cultural transcreation.*            |
  | **Decompilation**         | Back-translation                                 | ✅ *But limited: reveals lossy compression in translation.*                |
  | **Idiomatic output**      | Naturalness in target language                  | ✅ *Direct: both value "native" readability over literalness.*             |
  | **IR (Intermediate Rep.)**| "Universal" poetic essence / mental image        | ~~Rejected: No agreed-upon IR for natural language; emergent meaning breaks this.~~ |

  **Key Insight**: Compilers assume separable syntax/semantics; poetry treats form *as* semantics. This fractures the analogy at the outset.

  ---

  ### **Restating the Three Positions (Using Best Mappings)**

  #### **(1) Content-First View (Effect Preservation)**
  - *Compiler Frame*: Translation is a semantics-preserving rewrite targeting observational equivalence for a "competent reader runtime." Rhyme loss is like dropping comments or whitespace—a non-fatal bug if core logic runs.  
  - *Crank Taxonomy*:  
    - **(a) Lexically arbitrary**: Rhyme scheme = removable syntactic sugar.  
    - **(b) Language-inherited**: French verb conjugation → English word order; akin to platform-specific intrinsics.  
    - **(c) Load-bearing**: Meter carrying irony → fatal if dropped (e.g., segfault).  
    - **(d) Virtuosity**: Like ASM hand-optimization; impressive but irrelevant to correctness.  

  #### **(2) Form-First View (Structural Fidelity)**
  - *Compiler Frame*: The poem is an AST *with hard constraints*. Translation must satisfy isomorphic constraints in the target "architecture" (e.g., replacing French alexandrin with iambic pentameter). Losing this is like compiling Rust to Python without enums—API breach.  
  - *Crank Taxonomy*:  
    - **(a) Lexically arbitrary**: Constraints must be re-satisfied (new words, same rhyme).  
    - **(b) Language-inherited**: Must find *analogous* constraints (e.g., gender inflection → English alliteration).  
    - **(c) Load-bearing**: Non-negotiable; form *is* content.  
    - **(d) Virtuosity**: Proof of equivalence under constraints; like passing a difficult optimization test.  

  #### **(3) Skeptical View (Genealogical Creation)**
  - *Compiler Frame*: No single "original semantics" exists; translation is a new program with shared ancestry. "Fidelity" is a linter rule, not a spec. Round-trip fails because there’s no stable IR.  
  - *Crank Taxonomy**: All features (a-d) are contextual; their preservation is a cultural negotiation, not engineering. Virtuosity (d) *is* the value—showing labor bridges the untranslatable.  

  ---

  ### **Residue Report: What Survives, Distorts, or Breaks**

  | Claim/Concept          | Content-First         | Form-First             | Skeptical              | Verdict                                                                 |
  |------------------------|-----------------------|------------------------|------------------------|-------------------------------------------------------------------------|
  | **Observational Equiv.** | ✅ Clean              | ⚠️ Distortion         | ✅ Clean               | *Form-first insists "observation" includes form’s aesthetic experience.* |
  | **Round-trip test**    | ❌ Breaks             | ❌ Breaks              | ✅ Clean               | *Your half-belief holds: no IR → no round-trip. Proves natural language’s "semantics" isn’t extractable.* |
  | **Virtuosity (d)**     | ❌ Inexpressible      | ✅ Maps w/distortion   | ✅ Clean               | *Compiler frame reduces (d) to "code golf"; misses cultural labor. Skeptical view embraces it.* |
  | **Load-bearing form (c)** | ⚠️ Partial (if fatal) | ✅ Clean               | ⚠️ Contested           | *Marco wins here: in poetry, form often *is* content (e.g., sonnet’s volta).* |
  | **"Idiomatic" output** | ✅ Clean              | ⚠️ Distortion         | ✅ Clean               | *Form-first sees "idiomatic" as betraying structure if form is sacrificed.* |
  | **No invariant**       | ❌ Inexpressible      | ❌ Inexpressible       | ✅ Clean               | *Compiler engineering assumes invariants exist; skeptical view denies this.* |

  **Residue Analysis**:  
  - **Missing in your frame**:  
    1. **Emergent meaning** (whole > sum of parts). Compilers are compositional; poems are not.  
    2. **Cultural context as runtime environment**. A French reader’s "interpreter" has different built-ins than an English one.  
    3. **Affective semantics**. A poem’s "effect" includes visceral responses—no compiler analog.  
  - **Where Marco has a point**:  
    - Form *is* often load-bearing (e.g., Marot’s elegance is formal). Your "API surface" analogy holds better than you think: changing C++ templates to Python duck typing *is* a semantic shift.  
    - Virtuosity isn’t "code golf"; it’s proof the constraint *could* be satisfied, affirming the original’s design.  
  - **Where you win**:  
    - Round-trip failure *does* expose translation’s inherent lossiness.  
    - "Preserve content, change form" is ill-defined without an IR—natural language semantics are underspecified.  

  ---

  ### **Epistemic Notes**
  - **Settled**:  
    - Round-trip futility in translation is uncontroversial.  
    - Observational equivalence (reader effect) is a mainstream translation goal (Nida).  
  - **Contested**:  
    - Whether form is *inherently* load-bearing (Formalists vs. Functionalists).  
    - Whether "invariant core" exists (Steiner’s hermeneutic motion vs. Derrida’s différance).  
  - **My Extrapolations**:  
    - I treat "competent reader" as a runtime—debatable (reception theory varies).  
    - Equating virtuosity with "proof of constraint satisfaction" is my synthesis.  
    - *What would change my mind*: A poem where form loss *enhances* the original’s "effect" (content-first win), or one where back-translation *improves* the original (skeptical win).  

  ### **Concession to Marco**  
  His "API surface" rebuttal is stronger than you granted. In poetry, form *is* often the interface to meaning. But he understates how much "observational equivalence" tolerates formal shifts if affective semantics persist. The Marot example cuts both ways: its charm *is* formal, but a prose translation could still convey longing—just not *as* a "charming trifle."  

  **Final Lean**: Your vocabulary exposes translation’s *mechanisms* but not its *aesthetics*. Marco’s position survives as a claim about artistic integrity: a compiler that rewrites Rust as unreadable, correct ASM is "correct" but bad engineering. Similarly, losing rhyme for prose may be "correct" but bad poetry. The irreducibles are cultural labor and emergent meaning—where translation is alchemy, not engineering.  

  Would this survive Marco’s scrutiny? I’ve flagged the soft spots—now hand him the wine.
