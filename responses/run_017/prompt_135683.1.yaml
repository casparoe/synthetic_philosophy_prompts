prompt: |-
  I'm a philosophy PhD student finishing a chapter on higher-order evidence, and there is one configuration I keep running into that I can't find a settled name for or a settled treatment of, so I want to know whether it has one before I coin something. Let me give three cases. (1) A large meta-analysis in my area reports that studies of a certain common design produce false positives at a very high rate. The meta-analysis is itself a study of that kind: same statistical machinery, same publication pipeline, and its headline result is a single estimate of a false-positive rate that it says you should trust. So if I credit it, I have strong reason for distrusting the very method that produced it; if I discount it on account of what it says, I seem to have no reason to discount anything at all. (2) The clean contrast: I learn from a blood test that a drug I'm taking impairs the formation of new long-term memories. Nothing in that bad news has to travel through the faculty it indicts — the test result sits in front of me in writing, and I can re-read it. No circularity, no puzzle, ordinary undermining defeat. (3) The messy middle, which is the one I actually care about: the indictment is delivered by a method that is nearly, but not quite, the method it indicts. The meta-analysis uses the same broad statistical framework but a far simpler, preregistered design and a huge sample, and the critique it makes is explicitly about small-sample, flexibly-analysed studies. Whether it implicates itself now depends on how coarsely I describe the method: under a coarse description it is self-indicting, under a fine description it isn't, and it seems I can't settle which description is the right one without already taking a stand on the first-order question. There is a further wrinkle in both (1) and (3) that I think matters: the indictment is one-directional. It doesn't say the method is unreliable tout court; it says the method systematically over-produces positive findings of a certain kind, and it is itself a positive finding of that kind. So trusting it tells me to be more suspicious of exactly the sort of claim it is, and not of the opposite claim — which means the usual symmetry of undermining defeat is missing.

  I've had two unsatisfying responses. My supervisor said this is just the generality problem for reliabilism wearing a hat: how finely to individuate the belief-forming process type. Someone in my reading group said it is 'self-undermining', but as far as I can tell that label is standardly used of theories or principles that discredit themselves — e.g. conciliationism applied to the disagreement about conciliationism, or an argument whose conclusion is that arguments of its kind are untrustworthy — not of a piece of evidence that discredits its own source. And the neighbouring literatures seem to run in the wrong direction: there's a well-known family of cases, one of which I half-remember involving a gas gauge, where a source's own deliverances are used to establish the source's reliability, and there the complaint is that the reasoning seems to work too well, licensing knowledge too cheaply. My cases are corrosive rather than credential-granting. Also, epistemic akrasia and the enkrasia/evidentialism debate look like they concern the output state — believing P while taking your belief that P to have been badly formed — whereas my worry is upstream, about what such a piece of evidence requires of me in the first place.

  So my question is not really for a label. I want to know what this phenomenon is and where its edges are. Does it have an established name or literature of its own, and if several established concepts are nearby, which fits best and how exactly does my case differ from each? Concretely, I'd like you to address: (a) whether the self-application means such evidence can never oblige a first-order credence shift and can only move one's confidence about one's own confidence, or whether there is a non-trivial fixed point — some stable intermediate degree of trust in the indicted method that the evidence supports, and if so how you would find it; (b) whether the diagonal, non-diagonal and near-diagonal cases really differ in kind, or whether (2) is just the limiting case of a continuum; (c) whether the grain-sensitivity in (3) is genuinely an instance of the generality problem or whether self-application adds something to it, since there the choice of grain seems to become something one can have reasons to prefer rather than a descriptive matter; and (d) whether the one-directional form is a different phenomenon from the symmetric form, or the same one with the sign changed. Please also give me two or three boundary cases that look like this but aren't, and say what distinguishes them. If nothing established fits, coin a term, define it, and tell me what would count against the definition. I'd also find it useful if you said whether any of this bears on practice — for instance on how a field should weigh its own meta-science during a replication crisis, or on how to treat a source that volunteers that sources like it are not to be trusted.
reasoning: |-
  Okay, I need to help this philosophy PhD student with their chapter on higher-order evidence. They've presented three cases and have specific questions about a phenomenon they're encountering. Let me start by understanding their core concern.

  The key issue revolves around evidence that undermines its own reliability, especially when the method of evidence production is either identical or similar to what it's critiquing. Case 1 is a meta-analysis that uses the same flawed methods it criticizes, creating a paradox: trusting it means distrusting its method, but discounting it leaves no reason to distrust anything. Case 2 is straightforward undermining defeat without self-implication. Case 3 is messy—the method is similar but not identical, and how we describe it (coarse vs. fine-grained) affects whether it's self-undermining.

  The student has received two unsatisfying responses: one relating to the generality problem in reliabilism, and another calling it "self-undermining," which they feel is misapplied. They note adjacent literatures like epistemic akrasia and the gas gauge cases, but those don't quite fit because their cases are corrosive rather than credential-granting.

  Their main questions are:
  (a) Whether such evidence can force a first-order credence shift or only higher-order reflections, and if there's a fixed point of stable trust.
  (b) Whether the three cases differ in kind or form a continuum.
  (c) If the grain-sensitivity in case 3 is just the generality problem or something more.
  (d) Whether the one-directional nature (only indicting positive findings) changes the phenomenon.

  I recall that in epistemology, self-defeating or self-undermining evidence isn't new. David Christensen and others discuss higher-order evidence, but the specific twist here is the methodological self-implication. For case 1, this resembles a liar's paradox for evidence. Thomas Kelly's work on total evidence and disagreement might be relevant, but the meta-science angle adds complexity.

  For (a), there might be a fixed point. Using a Bayesian approach, you could model the reliability as a parameter updated by the evidence itself. If the meta-analysis reports a high false positive rate, say 70%, then trusting that claim means you should doubt the method, including this very analysis. But if you don't trust it, you have no reason to doubt. So perhaps there's an equilibrium where you partially trust it, leading to a revised credence. For example, if you start with prior trust in the method, the evidence might push you to a point where the estimated reliability is consistent with the evidence it provides. This requires iterative updating, possibly converging on a stable credence.

  Regarding (b), the cases might form a continuum. Case 2 (blood test) is clear-cut undermining. Case 1 is fully self-implicating, creating a paradox. Case 3 lies in between, where the similarity determines the degree of self-implication. The coarseness of the method description affects how much the evidence undermines itself. This suggests a spectrum rather than distinct categories.

  On (c), the generality problem is about how to type belief-forming processes. Here, self-application adds a normative layer because choosing the grain isn't just descriptive—it affects whether the evidence is self-defeating. In case 3, if you describe the method finely (preregistered, large sample), it's not self-undermining; coarsely (same statistical framework), it is. But the evidence itself might provide reasons to prefer a finer grain, like methodological details that distinguish it. However, the student points out that choosing the grain might require taking a stance on the first-order issue, which complicates things. So yes, self-application intensifies the generality problem by making the choice of grain consequential for the evidence's validity.

  For (d), the one-directional aspect (only overproduction of positives) is crucial. Unlike symmetric undermining, which discredits all outputs, here only positive findings are suspect. The meta-analysis itself is a positive finding, so if trusted, it tells you to doubt positives like itself. But negative findings aren't implicated, so they might be more reliable. This asymmetry prevents total skepticism and might allow a fixed point where positives are discounted but not dismissed entirely. This differs significantly from symmetric cases.

  Boundary cases to distinguish:
  1. **Gas gauge scenarios**: A gas gauge reads "F," and you trust it. Then you learn all gauges in this model are broken. But you learned this from the gauge itself. This is self-undermining but symmetric—distrusts all readings. The student's cases are asymmetric, only affecting positive claims.
  2. **Self-excepting theories**: Like conciliationism applied to disagreements about conciliationism. Here, it's the theory that's self-defeating, not evidence undermining its source. The student is dealing with evidence, not theories.
  3. **Ordinary higher-order evidence**: E.g., learning you were drugged when forming a belief. This undermines the belief but doesn't implicate the method of learning about the drug, which is separate. Unlike case 1, where the evidence comes from the same method it indicts.

  Since no existing term fits perfectly, coining "Self-Undermining Methodological Evidence" (SUME) makes sense. Defining it as evidence produced by a method M that indicts the reliability of M (or a sufficiently similar M*) for producing certain types of claims. The one-directional aspect is key.

  Practical implications: During a replication crisis, meta-science using similar methods might be cautiously trusted if it has distinguishing features (preregistration), but the self-implication requires discounting its confidence. For sources admitting their kind are untrustworthy, this creates a paradox—if you trust them, you shouldn't, leading to a credibility fixed point. Fields should prioritize evidence from diverse methods to break the circularity.
answer: |-
  ### Addressing Your Phenomenon: A Structured Analysis  
  Your cases reveal a deep tension in higher-order evidence (HOE) when evidence undermines its own epistemic source, particularly under methodological self-implication. This isn't cleanly captured by existing frameworks (e.g., undermining defeat, epistemic akrasia, or the generality problem), though it intersects with several. Below, I define the phenomenon, address your questions, contrast it with nearby concepts, and propose a new term. Crucially, **self-application** and **directionality** are key differentiators.

  ---

  ### **Core Phenomenon: Definition and Literature Gaps**  
  Your cases involve **methodologically self-implicating undermining evidence**: evidence \(e\) is produced by method \(M\), and \(e\) claims that \(M\) (or methods "like" it) is unreliable for forming beliefs of type \(T\)—where \(e\) itself is a belief of type \(T\). This creates a corrosive loop: trusting \(e\) licenses distrust in \(M\), which produced \(e\), but distrusting \(e\) leaves no basis to distrust \(M\).

  - **Why existing labels fall short**:  
    - *Self-undermining*: Typically applied to *theories* (e.g., "This sentence is false"), not evidence implicating its *source method*.  
    - *Undermining defeat*: Standardly symmetric (e.g., drug-induced hallucinations undermine all perceptual beliefs), but your cases are asymmetric (only "positive" findings are indicted).  
    - *Generality problem*: Reliabilism struggles to individuate process types, but here, self-application adds *normative pressure* to choose a grain that resolves the paradox, making it dynamic.  
    - *HOE/epistemic akrasia*: Focuses on conflicts between first-order and higher-order beliefs (e.g., "I believe P, but I shouldn't believe P given my evidence"). Your issue is upstream: whether \(e\) can rationally compel *any* credence shift given its self-implication.  

  The closest literature is **meta-inductive skepticism** (e.g., Sextus Empiricus' modes) and **formal epistemology on self-doubt** (e.g., Elga 2005 on rational reflection). However, these lack your focus on *methodological near-identity* and *directional undermining*.

  ---

  ### **Answers to Your Specific Questions**  

  #### **(a) Can such evidence oblige first-order credence shifts? Is there a fixed point?**  
  **Yes, but only under constrained conditions**. Self-implicating evidence *can* shift first-order credences if we model it as a **fixed-point problem**.  

  - **Mechanism**: Treat the reliability of \(M\) as a parameter \(r\) (e.g., probability \(M\) yields true positives). Evidence \(e\) (e.g., "\(M\) has high false-positive rate \(f\)") updates \(r\). But since \(e\) depends on \(r\), credit \(e\) only if \(r\) is high. This creates a system where:  
    \[
    P(e | r) = \text{likelihood of } e \text{ given reliability } r \\
    P(r | e) \propto P(e | r) \cdot P(r)
    \]
    - For directional cases (e.g., meta-analysis indicting only positive findings), \(e\) is a positive finding. Trusting \(e\) suggests lowering \(r\) for positives, but \(e\) itself is positive. A fixed point emerges where \(r\) stabilizes at a value consistent with \(e\)'s content.  
    - **Example**: Suppose \(e\) reports \(M\) has a 70% false-positive rate. If your prior for \(r\) is uniform, updating implies \(r \approx 0.3\). But if \(e\) was produced by \(M\), and \(M\) has low \(r\), \(e\) is likely unreliable—so you iteratively dampen the update. Convergence occurs at an intermediate \(r\) (e.g., 0.5), where the credence in \(e\) and the reliability it posits are mutually consistent.  
  - **Stable intermediate trust**: This exists when the evidence and reliability are **co-calibrated**. Bayesian models (e.g., Titelbaum 2015) show such fixed points are achievable if \(e\) is not globally skeptical (e.g., "all methods are unreliable") but locally targeted (e.g., "positive findings by \(M\) are suspect"). Here, directional asymmetry prevents total collapse.  

  #### **(b) Do the three cases differ in kind or form a continuum?**  
  **They form a continuum**, graded by **methodological similarity** and **descriptive grain**.  

  - **Continuum axis**: The degree to which the evidence's production method \(M_e\) is identical to the indicted method \(M_i\).  
    - *Case 1 (identical \(M_e = M_i\))*: Purely diagonal. Self-application is inescapable; rejecting \(e\) is the only escape, but at the cost of skepticism.  
    - *Case 3 (similar but non-identical \(M_e \approx M_i\))*: Near-diagonal. Grain determines self-implication. Coarse descriptions (e.g., "NHST studies") implicate \(e\); fine descriptions (e.g., "preregistered, large-sample NHST") may not.  
    - *Case 2 (distinct \(M_e \neq M_i\))*: Non-diagonal. No self-implication; standard undermining.  
  - **Why a continuum?** As \(M_e\) approaches \(M_i\), the evidential force smoothly transitions from external undermining to self-undermining. Grain-sensitivity in Case 3 is the midpoint: choosing a description is choosing where to "draw the line" on similarity.  

  #### **(c) Is the grain-sensitivity just the generality problem, or does self-application add something?**  
  **Self-application transforms the generality problem into a normative dilemma**.  

  - **Generality problem**: Purely descriptive—how to taxonomize process types (e.g., is "vision" or "daytime vision" the relevant type?).  
  - **Your addition**: Choosing a grain isn't neutral; it resolves or perpetuates self-undermining. This forces a **reason-responsive choice**:  
    - *Case 3*: The meta-analysis offers reasons to adopt a fine grain (e.g., "our design avoids p-hacking"). But if you distrust \(M_i\), you might distrust those reasons, creating a bootstrapping issue.  
    - *Self-application adds stakes*: Coarse grains induce paradox; fine grains may evade it. But justifying a fine grain requires independent grounds (e.g., methodological evidence from outside \(M_i\)), which may beg the question. Thus, grain choice becomes a normative, not merely descriptive, act.  

  #### **(d) Does directionality create a distinct phenomenon?**  
  **Yes, directional undermining is fundamentally different from symmetric undermining**.  

  - **Symmetric undermining** (e.g., Case 2): Indicts all outputs of \(M\). Learning \(e\) lowers credence in *any* belief from \(M\).  
  - **Directional undermining** (Cases 1 & 3): Only indicts beliefs with *specific content* (e.g., positive findings). Here, \(e\) is self-undermining only if it shares that content (e.g., \(e\) is a positive finding).  
  - **Key difference**: Directionality allows **partial trust**. In symmetric cases, \(e\) destroys all credibility; in directional cases, you can discount positive findings from \(M\) while accepting negatives or other content. This enables fixed points (as in (a)) and avoids total skepticism.  

  ---

  ### **Boundary Cases: Similar but Distinct**  
  1. **The broken gas gauge** (e.g., Sorensen 1988):  
     - *Scenario*: Your gas gauge reads "F." You then learn gauges like yours are faulty.  
     - *Distinction*: This evidence is *symmetric* (undermines all gauge readings) and *externally sourced* (you learn about the fault from, e.g., a mechanic). Your cases involve evidence *from the indicted method itself* and are directional.  

  2. **Self-excepting theories**:  
     - *Scenario*: Conciliationism says "discard beliefs in peer disagreement," but conciliationists disagree with non-conciliationists.  
     - *Distinction*: This is *theory*-self-defeat, not *evidence*-source-undermining. Theories can exempt themselves (e.g., "conciliationism applies except to itself"), but evidence can't self-exempt without circularity.  

  3. **Misleading higher-order evidence**:  
     - *Scenario*: You rationally believe P, but a reliable advisor says you’re irrational.  
     - *Distinction*: Here, HOE conflicts with first-order evidence but doesn’t indict its *own* source. Your cases involve evidence that attacks the very process that generated it.  

  ---

  ### **Proposed Term and Definition**  
  **Self-Undermining Methodological Evidence (SUME)**  
  - **Definition**: A piece of evidence \(e\) is SUME iff:  
    (i) \(e\) is produced by method \(M\);  
    (ii) \(e\) indicates that \(M\) (or methods relevantly similar to \(M\)) is unreliable for beliefs of type \(T\);  
    (iii) \(e\) is itself a belief of type \(T\); and  
    (iv) The unreliability claim is directional (e.g., overproduction of false positives).  
  - **What counts against it**: If \(e\) indicts all belief types symmetrically (no directionality), or if \(M\) is not implicated (e.g., \(e\) is produced by a distinct method), it’s not SUME.  

  ---

  ### **Practical Implications**  
  - **Meta-science during replication crises**: Fields should treat SUME cautiously. For near-diagonal cases (e.g., meta-analysis using refined \(M\)), adopt the *finest justifiable grain* (e.g., focus on preregistration) to avoid self-implication. But this requires independent validation (e.g., empirical checks outside \(M\)). Crucially, SUME *can* rationally shift credences to a fixed point: e.g., trust meta-results *less* than non-self-implicating evidence, but not zero.  
  - **Self-incriminating sources**: If a source says "sources like me are untrustworthy," directional asymmetry allows partial trust: discount its positive claims but not its negatives (e.g., "no effect" findings might still be reliable). However, in diagonal cases (like your Case 1), the only stable response may be to reject \(e\) entirely—or revise the method.  

  ### **Summary**  
  SUME is a distinct phenomenon arising from directional self-implication under methodological similarity, creating a continuum from diagonal to non-diagonal cases. It transforms the generality problem into a normative challenge, permits fixed-point credences, and has real-world implications for scientific practice. While adjacent to reliabilism and HOE, its core novelty lies in the feedback loop between evidence and its source’s reliability. If this fits, develop it—it could anchor a valuable contribution to HOE literature.
