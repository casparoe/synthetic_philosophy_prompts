  Here's what I need from it. Every branch node has to be a question I could answer from the spreadsheet or from the story behind the numbers, phrased so I don't already have to know the vocabulary — so not "is Z a collider?", more like "did Z get decided before or after the thing you're comparing?", "does Z change how many rows are in each group, or does it change how the rows inside a group behave?", "if someone handed you the individual rows instead of the group summaries, would the answer change?". I want 8 branch questions max and 8 to 10 leaves, numbered so I can follow it on paper. The leaves have to include: a real pre-treatment confounder; conditioning on something that's downstream of the variable you care about; conditioning on something that both of your variables feed into (my teacher called it the "you only see the people who showed up at the hospital" case); the case where it's just that the denominators moved and there's no causal question at all; the case where you only have group-level rates and the individual-level story is genuinely not recoverable from them; and at least one leaf that amounts to "the numbers are fine, your question was ill-posed / there's no fact of the matter about which split is the correct one." Each leaf ends with one short verdict line on what I should actually put in the recap: quote the overall number, quote the split numbers, or quote neither and compute something else instead (and say what).

