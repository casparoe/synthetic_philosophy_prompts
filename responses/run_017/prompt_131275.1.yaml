  ### **Tree Weaknesses & Notes**
  - **Basketball Case**: Diagnosed as **L2 (Mediator)**, but your counterfactual test (Q1=YES) suggests a denominator shift. This exposes the flaw in your distinction—it identifies the math but not the causal role of Z.  
  - **Missing Info**: University admissions requires knowing *when* department choice happened (Q2). If department chosen post-application, it becomes **L5 (Aggregation Bias)**.  
  - **Verdict Summary**:  
    - Quote overall: L2, L6.  
    - Quote split: L1, L8.  
    - Quote neither: L3, L4, L5, L7.  

