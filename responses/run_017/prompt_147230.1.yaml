prompt: |-
  Long time lurker, first time poster. I've been chewing on al-Ghazālī's thing about causation for ages now and I keep going round in cirlces because I think there are two different claims getting run together, and I can't work out whether the difference does any work.

  Set up as I understand it: he denies that there's any necessary connection between what we call a cause and what we call its effect. Fire touching cotton doesn't *have to* burn it, the connection is just something God has set up as a habit, and that's what leaves room for the miracle stories (the fire not burning Abraham, that sort of thing). Fine. But I want to separate out:

  (1) Call this "modal inertness": no cause *necessitates* its effect. The conjunction is contingent all the way down.
  (2) Call this "productive inertness": no created thing *brings anything about* at all. God is the only agent; creatures are occasions, not producers.

  Now the bit I made up and can't find anyone discussing, which is why I'm asking here rather than googling. Imagine God, at creation, writes down a complete mapping from total world-state at one instant to total world-state at the next — or just a whole timeline, same difference — and then never does anything again. Call it the "scripted-habit" model. Every stage follows from the script, not from the previous stage's own powers; but there's also no moment-by-moment divine willing, no sustained re-creation, nothing that looks like ongoing action.

  Things I'd like explained, argued out rather than reported:

  - Is the scripted-habit model occasionalism or not? If your answer is "depends how you define occasionalism,", say what's actually at stake in where you draw the line. I want to know which definition is load-bearing for the arguments, not which one is standard.
  - Which of (1) and (2) does the miracle argument actually need? Suppose he only had (1). Couldn't he already say the fire's not burning Abraham violates nothing, so (2) is doing extra work for free? Or does (1) leave a residue — don't we still want to say the fire was disposed to burn and got overridden?
  - On (2), every event is equally a direct divine act. What work is the word "miracle" doing then? Can he keep a principled ordinary-vs-miraculous distinction, or does a miracle just become an event that's rare relative to our inductively learned expectation of God's policy — i.e. a regularity in the policy rather than a break in it? Is that basically a Humean regularity story about laws one level up, or is the analogy misleading? (I keep thinking of it as a prior over God's policy and I suspect that's me forcing a map/territory thing that doesn't belong.)
  - In the interventionist sense of causation — set X, see if Y moves — what happens to intervention under (2)? If the fire isn't doing anything, "intervene on the fire" seems to either collapse or become shorthand for something about the script. Does that mean the causal-graph picture survives occasionalism as a mere compression of the policy, and if so can an occasionalist keep talking causally the way we keep talking agentially about a thermostat?

  Steelman whichever of these you don't instinctively buy, and please flag which of my questions is really a verbal dispute. Also: answer in American English, I'm British and my spelling keeps annoying people here. And go easy on proper names, I can't check anything you cite — if a specific scholar or book matters to your argument, tell me the argument instead.
reasoning: |-
  Okay, let me try to unpack this user's query about al-Ghazālī's occasionalism. They've clearly been wrestling with the distinction between two claims: modal inertness (no necessary connection between cause and effect) and productive inertness (no created thing has causal power). 

  First, I notice the user is deeply familiar with the philosophical terrain but frustrated by what they perceive as conflation in standard treatments. Their "scripted-habit model" thought experiment is sharp - it forces a clean separation between divine preordination and ongoing intervention. That's clever framing. 

  Hmm... they're asking four interlocked questions. Let me tackle the core tension first: does al-Ghazālī actually need productive inertness (claim 2) for miracles? The user suspects claim 1 (modal contingency) alone suffices. They're right that if causes don't necessitate effects, miracle stories aren't logically problematic. But al-Ghazālī would counter that claim 1 alone leaves room for secondary causes having real dispositions - whereas his theology requires God's exclusive agency. So claim 2 isn't redundant; it's theologically load-bearing.

  The scripted-habit model... interesting. Under this, is it occasionalism? Technically yes, since creatures lack causal powers. But it guts the Ash'arite emphasis on divine immediacy. The user's analogy to "Humean regularity one level up" is perceptive - it does make miracles just rare divine acts rather than interventions. That exposes a tension in al-Ghazālī: if God's "habit" includes miracles, are they truly interruptions? 

  On causal language: the user's thermostat analogy holds. An occasionalist can say "fire causes burning" as shorthand for divine regularities, just as we say "thermostat controls temperature" knowing it's mechanistic. But interventionist counterfactuals become tricky - "what if the fire were absent?" implicitly references God's policy, not the fire's power.

  The real gem here is the user's implied concern: does occasionalism collapse into deism or make divine action indistinguishable from natural law? That's the unspoken worry beneath their miracle question. I should emphasize that for al-Ghazālī, God's constant re-creation preserves both divine freedom and the possibility of genuine rupture - something the scripted model sacrifices.
answer: |-
  Okay, first off, love the "scripted-habit" model – that's a sharp way to isolate the issues. Let's break this down point-by-point, arguing rather than just reporting, and aiming for American English (I'll watch the spelling!). I'll flag verbal disputes as we go.

  **1. Is the Scripted-Habit Model Occasionalism?**

  *   **Short Answer:** It depends **crucially** on what you think is the *core* of occasionalism. By most historical definitions, **yes, it is occasionalism.** By al-Ghazālī's own emphasis, **probably not.**
  *   **The Stakes:**
      *   **What it Satisfies:** The scripted-habit model **absolutely satisfies both (1) Modal Inertness and (2) Productive Inertness.** Created things (like fire) have *no inherent power* to produce effects (2). The connection between "cause" (fire touches cotton) and "effect" (cotton burns) is *contingent* and not necessary (1); it could have been different in the script. God is the *sole* causal agent *in the sense of being the ultimate source of the entire sequence*.
      *   **Where it *Might* Depart from al-Ghazālī:** Al-Ghazālī (and Ash'arite occasionalism generally) emphasizes **God's *constant, direct, volitional* action in sustaining the world moment-by-moment.** Creation is not a one-off event followed by mechanical unfolding; it's a continuous act of re-creation ("renewal of accidents"). God *wills* the state of the world *at each instant* in accordance with His habitual practice.
      *   **The Load-Bearing Difference:** The key stake is **Divine Immediacy vs. Divine Delegation.**
          *   Scripted-Habit: God delegates the unfolding to the pre-written script/initial conditions. The script *itself* becomes the proximate "cause" of each subsequent state, even if God authored it. God acts *once* (in setting it up).
          *   Standard Occasionalism: God acts *directly and volitionally at every single moment*. There is *no* intermediate mechanism (like a script or law of nature). The "habit" is a description of God's *consistent willing*, not a separate rule He follows.
  *   **Conclusion on (1):** The scripted-habit model captures the *anti-realism* about created causes (1 & 2) essential to occasionalism. **But it arguably loses the *theological immediacy* and *volitional continuity* that al-Ghazālī emphasized.** For him, the world's existence *right now* depends directly on God willing it *right now*, not on a past decree playing itself out. The scripted model risks making God distant after creation. **So, is it occasionalism? Formally, yes (creatures are inert). Substantively for al-Ghazālī? Probably not, as it weakens the "direct divine act at every moment" doctrine.** The stake is whether divine sovereignty requires *ongoing, conscious* volition or can be satisfied by a single, all-encompassing initial act.

  **2. Which Claim Does the Miracle Argument Need? (1 vs. 2)**

  *   **The Miracle Argument Needs (1) Modal Inertness. It Does *Not* Strictly Need (2) Productive Inertness.**
  *   **Argument:**
      *   Suppose you accept *only* (1): Fire doesn't *necessitate* burning; the connection is contingent. This is enough to say God *could* make fire touch cotton without burning. There's no *logical contradiction* or violation of fire's *essential nature* preventing it. The event is possible.
      *   **The "Residue" Problem:** You're right. Only (1) leaves room for fire *having a real disposition* to burn, even if that disposition isn't *necessitating*. God would then be *overriding* that disposition in a miracle. Fire *wants* to burn but God stops it. This preserves some level of *secondary agency* for creatures.
      *   **Why al-Ghazālī Insists on (2):** His theology demands that God is the *only* true agent. If fire has a *real* disposition/power to burn (even a contingent, non-necessitating one), then when burning *does* happen, fire is *doing* something, contributing causally. Al-Ghazālī wants to say fire is utterly passive; it's *always* and *only* God burning the cotton *using* the fire as an occasion. The miracle isn't God *overriding* fire's power; it's God simply *not doing* the burning He *usually* does when fire touches cotton. Fire has *zero* power to override. (2) secures complete divine monopoly on agency.
  *   **Conclusion:** The *logical possibility* of miracles only requires (1). But for al-Ghazālī, the *metaphysical and theological explanation* ("God is the *only* agent, miracles show His direct action") requires (2). Claim (2) isn't redundant; it does the work of eliminating *any* causal efficacy in creatures, making every event *equally* a direct divine act.

  **3. What Does "Miracle" Mean Under (2)?**

  *   **The Challenge:** If *every* event is an equally direct divine act, how is a miracle special?
  *   **Al-Ghazālī's Distinction (Standard Occasionalism):**
      *   **Ordinary Events:** God acts according to His *customary habit* (`ādah`). This habit is stable and predictable, allowing us to learn "causal" regularities. Fire usually burns cotton *because God usually wills it so* when fire touches cotton.
      *   **Miracles:** God acts *outside* His customary habit. He wills something different (fire touching without burning) *on this specific occasion*.
      *   **Key Point:** The distinction lies **in God's volition relative to His established pattern.** A miracle is a *break* in the observed pattern of God's actions. It's *not* that the fire somehow acted differently; it's that God *willed* differently *using* that occasion.
  *   **Scripted-Habit Model Twist:** Here, miracles are *written into the script from the start*. God never "breaks" His habit because the "habit" *includes* the rare events we call miracles. So, is it still a miracle?
      *   **Relative to *Our* Expectations:** Yes. We learn the *general pattern* of the script through induction. A miracle violates *our* learned expectation based on the *observed regularity* of the script so far. It's an event *we* couldn't predict based on past observations of the "habit."
      *   **Relative to God's Policy (The Script):** No. It's just part of the plan. There's no "intervention" or "breaking" by God *after* creation.
  *   **Humean Analogy?** It *is* structurally similar to Hume's regularity theory *but one level up:*
      *   Hume: "Laws" are just descriptions of constant conjunctions in *events* (fire-touch -> burn).
      *   Scripted Occasionalism: "Laws" are descriptions of the constant conjunctions in *God's script* (State S1 -> State S2).
      *   Standard Occasionalism: "Laws" are descriptions of the constant conjunctions in *God's moment-by-moment volitions*.
      *   **Crucial Difference:** For Hume, the regularity is fundamental and mind-independent. For occasionalism (both types), the regularity is *imposed by divine will* (either as a one-time script or as continuous volition). The "map/territory" concern is valid – under occasionalism, the "law" *is* literally God's policy/will. Your "prior over God's policy" analogy is apt for the scripted model: miracles are low-probability events *within* the divine policy. For standard occasionalism, miracles are God *changing* His policy/will *at that moment*.
  *   **Conclusion:** Under pure (2), the ordinary/miraculous distinction is **epistemic and relative to human experience**, not fundamentally metaphysical. It's about rareness and violation of *observed* divine habits. The word "miracle" marks events that profoundly challenge *our* understanding of God's usual way of operating. Standard occasionalism preserves a stronger sense of God *actively choosing differently* at the moment of the miracle.

  **4. Intervention & Causal Graphs Under (2)**

  *   **The Problem:** If fire has zero productive power, "intervening on the fire" seems meaningless. What are you intervening *on*? An inert occasion?
  *   **Answer (Standard Occasionalism):** "Intervening on the fire" is shorthand for **changing the occasion presented to God.** In an interventionist (e.g., Pearl-style) framework:
      *   "Setting X=x" means *creating the situation* where the created thing we label "cause X" is in state x.
      *   Under (2), this means **presenting God with the *occasion* where X=x.**
      *   God, according to His habit (or policy/script), *then wills* the corresponding effect Y=y *given that occasion*.
      *   The "causal graph" doesn't represent *creatures* causing effects; it represents **which created occasions God uses as the *basis* for willing specific effects**, according to His stable habits. The arrow X -> Y means "God uses the state of X as an occasion to will the state of Y (according to His custom)".
  *   **Scripted-Habit Model:** Intervention collapses entirely into **checking the script.** "What if we set X=x?" means "What does the script say happens to Y in the branch where X=x?" There's no "change" possible; it's just reading the pre-written story. The causal graph becomes a mere *description* of the script's structure.
  *   **Can an Occasionalist Use Causal Language?** **Yes, absolutely, and they do (even al-Ghazālī uses it constantly!).** It's **shorthand** for the *divine policy* regarding occasions and effects. Just like we say "the thermostat *controls* the temperature," knowing it's just a mechanism triggering the furnace, an occasionalist can say "fire *causes* burning," meaning "God, upon the occasion of fire touching cotton, habitually wills the burning." The causal graph survives as a useful *descriptive tool* for summarizing God's habitual patterns of action in response to created occasions. It's a compression of the divine policy, not a map of real creaturely powers.
  *   **Conclusion:** Interventionist counterfactuals ("what if X had been different?") make sense under occasionalism *only* as questions about **what God *would have willed* given a different occasion (according to His habit/policy/script).** The causal graph is a model of God's *decision rules*, not of creaturely causation. The thermostat analogy is perfect: we use agential language ("controls") for a mechanism, knowing it's shorthand. The occasionalist uses causal language for occasions, knowing it's shorthand for divine action.

  **Steelmaning & Verbal Disputes:**

  *   **Steelmaning Scripted-Habit as Occasionalism:** One could argue that the script *is* just the complete expression of God's single, eternal volition. The "habit" is embedded within it. The distinction between writing the script once and willing moment-by-moment is illusory from God's eternal perspective. Therefore, the scripted model *is* a valid form of occasionalism, capturing the core denial of creaturely power.
  *   **Steelmaning Necessity of (2):** Even if (1) allows miracles logically, only (2) fully protects divine sovereignty by ensuring God never *shares* agency, even passively through granting dispositions. It prevents any theology where creatures have *real but contingent* powers God must override.
  *   **Verbal Disputes:**
      *   The biggest is likely **"Is the scripted-habit model occasionalism?"** As argued, it hinges entirely on whether you define occasionalism *solely* by the denial of creaturely power (yes) or *also* by the emphasis on continuous, direct divine volition (no).
      *   The meaning of **"miracle"** under pure (2) vs. standard occasionalism is another potential verbal dispute about whether "intervention" requires a temporal act of breaking habit or if deviation within a pre-set plan counts.
      *   Whether **causal language** is "really" about divine policy or is hopelessly misleading is also partly verbal – it depends on how strictly you police language referring to inert things.

  **Summary Punchlines:**

  1.  **Scripted-Habit Model:** Formally occasionalist (denies creaturely power), but likely *not* what al-Ghazālī intended due to missing continuous divine volition. The stake is Divine Immediacy.
  2.  **Miracles:** Need (1) Modal Inertness for *possibility*. Need (2) Productive Inertness for al-Ghazālī's *explanation* (pure divine agency, no overriding). (2) isn't redundant; it eliminates secondary agency residue.
  3.  **Miracle Meaning:** Under (2), "miracle" primarily means a rare event violating *our learned expectations* of God's habitual pattern (His policy/script/volition). It's epistemic/relative, not fundamentally a different *kind* of divine action. The Humean analogy holds structurally but differs foundationally (divine will vs. mind-independent regularity).
  4.  **Intervention & Causality:** "Intervening on X" means "setting the occasion X presents to God." Causal graphs/models are useful shorthand *descriptions* of God's habitual patterns of action in response to created occasions. They survive as compressions of divine policy, just like agential language survives for thermostats.
