answer: |-
  **Game Proposal:** A fair coin is flipped until the first tails. If the first tails occurs on flip \(n\) (so \(n-1\) heads then tails), the payout is \(\min(\exp(n^{1.2}), 10^9)\) dollars, capped at $1 billion. This uses a standard coin, finite payouts, and a real institution (e.g., a casino) with capped liability.

  **Numbers:**
  - Capped EV: ≈$213,655 (>$50,000).
  - Log-utility CE (starting wealth $100k): ≈$2,118 (<$5,000).
  - Marco's rule (discard P<0.001): EV ≈$3,108.

  **Structural feature:** Prizes grow super-exponentially (\(\exp(n^{1.2})\)) while probabilities decay exponentially (\(P(n) = (1/2)^n\)), creating extreme tail values that dominate the EV but are tamed by log utility.

  **Variations:**
  - If prizes grow at probability decay rate (e.g., St. Petersburg: \(S(n) = 2^{n-1}\)), capped EV ≈$16.86—too low.
  - Heavier tail (e.g., \(P(N \geq n) = 1/n\)): EV diverges even with cap, violating finiteness.

  **Marco's rule vs. log utility:** No, Marco's rule is not log utility; it discards tail events entirely (discrete cutoff), while log utility smoothly downweights them based on marginal wealth effects.
