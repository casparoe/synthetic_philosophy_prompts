  So: you're a decision theorist who has wasted an unhealthy amount of time on infinite expectations. Before you commit to anything, brainstorm two or three candidate games and discard the ones that fail, then give me your best one. It has to hit all of these at once, and the scenario itself should be one paragraph max, physically implementable, one-shot, one player, real money from a real institution — a fair coin or a roulette-style wheel is fine, no infinite-precision devices, no science fiction — with total house liability capped at $1 billion so that every payout is a finite dollar figure:

  - Expected dollar payout, computed *with the cap in place*, comes out above $50,000. So a naive expected-value maximizer who has fully internalized the finite bankroll still pays five figures.
  - Expected utility under log utility of total wealth, starting wealth $100,000, is finite, and its certainty-equivalent in dollars is under $5,000. So Bernoulli's move kills the infinity but still lands way above the gut verdict.
  - It still has to feel like pocket change, and I want that to fall out of the payoff profile rather than be stipulated: median payout under $10, at least a 95% chance of a payout under $10,000, and no more than half a percent chance of $1M or more. Don't tell me everyone agrees it's worth twenty bucks — that's the thing I'm trying to isolate, not something to assume.

  Then, as briefly as you can: show the actual numbers (capped EV, log-utility certainty equivalent, and what Marco's rule gives — he says cross out every outcome with probability below 1 in 1,000 and take the expectation of what's left); name the one structural feature doing the work; show what happens if you set prize growth equal to probability decay, and what happens if you make the tail heavier than geometric, e.g. P(N ≥ n) = 1/n; and finish with one honest sentence on whether Marco's rule is secretly log utility wearing a hat. I'm lifting this for a ten-minute departmnt talk, so keep the scenario to one paragraph and the whole response under 400 words.
