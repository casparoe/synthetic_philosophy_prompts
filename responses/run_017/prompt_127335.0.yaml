prompt: |-
  So I'm in a worker co-op and one of the other members keeps ending arguments with "the wisdom of crowds" — it came out twice in our last meeting about how we should make decisions. First use: we were deciding whether to hire one of two people for a paid role, and the suggestion that our two most experienced members should just decide it got shut down with the slogan — apparently a majority vote of all 30 of us is more likely to get it right. Second use: someone said we should always talk it through together before voting, because pooling what everyone knows is precisely what makes the group smarter than any individual. I have a nagging feeling the second claim quietly breaks whatever makes the first one work — I remember enough of the Condorcet jury theorem setup to know there's an independence assumption in there somewhere and that us all hearing the same two loud people before voting looks like exactly the kind of thing that would violate it — but I also cant tell whether the slogan is even making the same claim in the two places, and I keep sliding between "more voters is better", "the group beats its average member" and "the group beats its best member", which feel like very different strengths of claim.

  Can you lay out as a menu the precise things "the wisdom of crowds" could be asserting here, with verdicts — which are near-trivial, which are substantive but defensible, which are just false? At minimum I'd want: the weak "majority is more accurate than the average member", the stronger "more accurate than the best member", the asymptotic "accuracy goes to certainty as the group grows", and separately that averaging thing where a crowd guessing a number beats individual guesses because errors cancel out. For each, spell out what has to be true of the voters: I especially want to know what exactly has to be independent of what, because "everyone read the same article" and "everyone heard what the confident guy said" feel like different failures and I can't say how, and I also want to know whether it matters that the vote is on a question with a heavily skewed base rate (surely a voter who always votes the same way has great accuracy and tells us nothing?).

  Then the part I actually care about: for each reading on the menu, does it support the first use, the second use, both, or neither? Concretely — if the extra voters we'd be adding are only barely better than a coin flip, does the slogan still deliver anything, or do you need an absurd number of people before 30 slightly-competent votes are worth much? What if they're systematically wrong about this particular kind of question — does the whole thing flip into "madness of crowds"? And is there any reading on which deliberating before voting still helps even though it destroys independence, e.g. one where everyone's individual competence rises enough to pay for the correlation? Two last things: there's a simulation result I half remember where a diverse bunch of merely-okay heuristics outperformed a group of individually better ones, and I don't know whether that's a separate reading or the same one in different words; and should the members who know nothing about the question just abstain, and if so is the result still "the wisdom of crowds" or have we quietly switched to deference to experts? I don't need citations or sources, I just want to know which precise claims are on offer and which ones would actually win me the argument.
reasoning: |-
  Okay, the user is part of a worker co-op where "wisdom of crowds" is being used to justify decision-making processes. They need clarity on what this concept actually claims and whether it applies to their two scenarios: majority voting on hiring and pre-vote deliberation. 

  First, I notice the user is intellectually sophisticated - they're already aware of Condorcet's theorem and independence assumptions. Their frustration is palpable: they sense something's off with how the slogan is applied but can't articulate why. The core tension is between "more heads are better" versus "but only if they think independently."

  Hmm... they've actually packed multiple complex questions into one. Let me mentally categorize: (1) definitions of crowd wisdom (weak/strong/asymptotic), (2) independence requirements, (3) application to voting vs deliberation, (4) edge cases like incompetent voters or skewed base rates. The simulation they half-remember is probably the diversity prediction theorem.

  *scratches head* The real pain point seems to be the second meeting scenario. When their colleague said "let's discuss before voting because pooling knowledge makes us smarter," that directly violates the independence premise of Condorcet. But is there a way deliberation could still help? Maybe if it boosts individual competence enough to offset correlation... but that's dicey.

  *lightbulb* Ah! The key is distinguishing between different types of problems. For factual questions (like guessing a cow's weight), deliberation might hurt. For complex judgments (like hiring), sharing perspectives might actually add value despite correlation. But then it's not really "wisdom of crowds" anymore - it's something else.

  *mental note* Must emphasize that "wisdom of crowds" isn't a single thing. The statistical version (Condorcet) demands independence, while the diversity version thrives on different perspectives. The user's colleague is conflating them.

  For the hiring vote: if most members lack expertise, adding them might actually reduce accuracy below what experts would achieve. The slogan fails here unless voters are minimally competent. And 30 voters? Unless they're all >50% accurate, the benefit plateaus fast. 

  *imagines spreadsheet* At 55% individual accuracy, 30 voters get 80% group accuracy. At 51%? Only 57% - barely better than coin flip. Oof. The user should calculate their group's actual competence.

  On deliberation: it's risky. If discussion creates groupthink, accuracy plummets. But structured sharing of unique information? That could work. Though strictly speaking, that's not "wisdom of crowds" - it's structured deliberation. Different beast.

  *suddenly remembers* The base rate issue! If 90% of candidates would succeed, a voter who always says "hire" is 90% accurate but useless for discrimination. Wisdom of crowds fails spectacularly here unless voters have differential sensitivity.

  Final thought: the user's nagging feeling is dead right. Their colleague is using one slogan to justify two contradictory processes. Unpacking the menu of claims will give the user concrete ammunition: "For claim X to hold, we need Y, but here's why we don't have Y..."
answer: |-
  Here's a clear "menu" of claims associated with "wisdom of crowds," their validity, requirements, and applicability to your scenarios. Key verdicts are in **bold**.

  ---

  ### The Claims: Definitions, Requirements & Verdicts
  1.  **Weak Claim (Majority > Average Member):**
      *   **Assertion:** A majority vote is more accurate than the *average* individual member.
      *   **Requirements:** (a) Voters are better than random (>50% individual accuracy). (b) Voter judgments are **statistically independent** given the true state of the world. (c) Voters vote sincerely based on their judgment.
      *   **Verdict:** **Substantive & Usually Defensible** under the requirements. Basis of Condorcet Jury Theorem (CJT). Fails if voters are incompetent (<50% accuracy) or strongly correlated.

  2.  **Strong Claim (Majority > Best Member):**
      *   **Assertion:** A majority vote is more accurate than the *single most accurate* member.
      *   **Requirements:** (a) Voters are better than random (>50%). (b) **Strong Independence**. (c) Voters sincere. (d) The "best" member isn't vastly superior to others (e.g., 95% vs 51%).
      *   **Verdict:** **Often False.** Requires specific conditions (large group, *all* members reasonably competent, independence holds). Easily violated if the "best" member is significantly better or independence fails. Not guaranteed by standard CJT.

  3.  **Asymptotic Claim (Accuracy → Certainty):**
      *   **Assertion:** As group size increases, majority vote accuracy approaches 100%.
      *   **Requirements:** (a) Voters are better than random (>50%). (b) **Perfect Independence**. (c) Voters sincere.
      *   **Verdict:** **True under strict requirements** (CJT). **Fails catastrophically** if average accuracy <50% (madness of crowds) or if independence is violated (e.g., herding).

  4.  **Averaging Claim (Mean Estimate → Truth):**
      *   **Assertion:** The *average* of independent estimates (e.g., guessing a number) converges to the true value.
      *   **Requirements:** (a) Estimates are **unbiased** (average error is zero). (b) Errors are **uncorrelated** (independence). (c) Individual errors have finite variance.
      *   **Verdict:** **True under requirements** (Central Limit Theorem effect). **Fails** with systematic bias (e.g., everyone underestimates) or correlated errors. *Distinct* from binary voting claims.

  5.  **Diversity Trumps Ability Claim:**
      *   **Assertion:** A group using diverse heuristics/models can outperform a group of individually smarter but similar members.
      *   **Requirements:** (a) **Diverse perspectives/heuristics** (solve the problem differently). (b) Heuristics are *somewhat* reliable individually. (c) Aggregation method captures diverse insights (e.g., averaging, voting, structured deliberation).
      *   **Verdict:** **Substantive & Defensible** (Page's Diversity Prediction Theorem). Explains why diverse groups often beat homogeneous "expert" groups. *Related but distinct* from CJT; focuses on *cognitive diversity* and error cancellation.

  ---

  ### Applying the Claims to Your Scenarios
  **Scenario 1 (Hiring Vote vs. Expert Decision):**
  *   **Slogan Claim:** Majority vote of 30 > Decision by 2 most experienced.
  *   **Which Claims Apply?**
      *   **Weak Claim (Majority > Average):** Requires *all 30 voters* >50% accurate *and* independence. **Unlikely.** If many members lack hiring expertise, their accuracy may be <50%, making them *harmful*. Independence is doubtful (shared info, biases).
      *   **Strong Claim (Majority > Best):** Highly unlikely. The "best" members likely *are* significantly better. Adding inaccurate voters drags the group down.
      *   **Asymptotic Claim:** Irrelevant for n=30 unless voters are highly competent/independent. Doesn't support superiority over experts.
      *   **Diversity Claim:** Only relevant if the 30 bring truly diverse, valid perspectives *on hiring*. Unlikely if most lack relevant knowledge.
  *   **Verdict:** **Slogan likely FAILS here.** Unless the 30 are all reasonably competent *and* independent on the hiring question (unlikely), delegating to the 2 most experienced is almost certainly better. The slogan misuse risks the "Madness of Crowds" (low average competence).

  **Scenario 2 (Deliberate Before Voting):**
  *   **Slogan Claim:** Pooling knowledge via discussion makes the group smarter, justifying pre-vote deliberation.
  *   **Conflict with Independence:** Deliberation **directly violates statistical independence**. People hear the same arguments, are influenced by confidence/social pressure, leading to correlated errors.
  *   **Which Claims Could *Potentially* Support Deliberation?**
      *   **Weak/Strong/Asymptotic Claims:** **NO.** These *require* independence. Deliberation actively destroys it.
      *   **Averaging Claim:** **NO.** It's about number estimation, not deliberation for binary votes.
      *   **Diversity Claim:** **YES, BUT ONLY IF STRUCTURED.** If deliberation successfully surfaces *unique information and perspectives* held by different members (true cognitive diversity), *and* the aggregation (vote) captures this, overall accuracy *can* increase *despite* correlation. The increase in *average individual competence* (due to learning) must outweigh the *loss of independence*. This is **hard to achieve** – unstructured discussion often amplifies bias, suppresses dissent, and creates groupthink.
  *   **Verdict:** **The slogan "pooling knowledge makes us smarter" is NOT supported by the standard voting claims (1-4) due to independence violation.** It *might* be supported by the Diversity Claim (5), **but only if deliberation is expertly structured** to elicit diverse insights without creating herding. Unstructured discussion often harms accuracy. Your instinct about breaking independence is correct.

  ---

  ### Addressing Your Specific Questions
  *   **Barely Better Than Coin Flip (e.g., 51% accuracy):**
      *   For Weak Claim: Yes, it "works" but **painfully slowly**. With n=30 voters at 51% accuracy, majority accuracy is only ~57%. You need huge n (e.g., ~1000 voters) to reach high confidence. **Verdict:** Slogan delivers very little benefit unless n is massive or competence is higher.
  *   **Systematically Wrong / Skewed Base Rates:**
      *   If the *average voter accuracy is <50%*, the Weak/Strong/Asymptotic claims **flip**: Majority vote becomes *less* accurate than random, approaching 0% as n grows ("Madness of Crowds").
      *   Skewed base rates are deadly: A voter who always votes "Hire" (or "Don't Hire") might have high *accuracy* if the base rate is skewed, but provides *zero information* discrimination. The group vote becomes dominated by the base rate, unable to distinguish good/bad cases. **Verdict:** Wisdom of Crowds utterly fails here; systematic error or skewed bases ruin it.
  *   **Deliberation Helping Despite Correlation:**
      *   **Possible only under the Diversity Claim (5).** If deliberation *significantly* boosts the *average individual competence* (e.g., by revealing crucial unique info) *more* than it increases correlation, the group *can* become more accurate. This requires skillfully managed deliberation focused on sharing *diverse* information, not persuasion or consensus-building. **Hard to achieve reliably.**
  *   **Members Who Know Nothing - Abstain or Vote?**
      *   **ABSTAIN.** If their accuracy is <=50%, adding them *harms* the Weak/Strong/Asymptotic claims. If they vote randomly (50%), they add noise but no signal. If systematically biased (<50%), they actively push the vote towards error. Abstention preserves the wisdom of the *informed* crowd.
      *   **Is This Deference to Experts?** It's **Wisdom of the *Competent* Crowd.** You're not deferring to a *single* expert, but only allowing those with some minimal competence (>50% accuracy) to contribute. This is the *right* way to apply the CJT logic. Forcing uninformed people to vote destroys wisdom.
  *   **The Simulation Result:** This is the **Diversity Trumps Ability Claim (5).** It's distinct from the CJT voting claims (1-3) but a powerful and valid form of "crowd wisdom" when applicable.

  ---

  ### Winning Your Argument: The Summary Cheat Sheet
  1.  **Against Simple Majority Vote (Hiring):** "The 'wisdom of crowds' vote only beats experts if *every single voter* is reasonably competent *and* independent on *this specific question*. For hiring, most of us lack that expertise – our votes are likely worse than random, making the group *less* accurate, not more, than letting the experienced members decide. It's 'madness,' not wisdom."
  2.  **Against Unstructured Deliberation Before Voting:** "Pooling knowledge *sounds* good, but standard voting wisdom *requires* independence. Discussion destroys independence by making us hear the same arguments and follow the loud voices. While *structured* sharing of truly *unique* info *might* help, our usual open discussions create groupthink and correlation, making the vote *less* reliable than independent judgments. If we want wisdom, we need independence *or* expertly managed diversity-focused deliberation."
  3.  **For Abstention:** "Wisdom comes from including only those with some competence (>50% accuracy). If you know nothing about the issue, abstaining is the responsible choice – it protects the group's accuracy. Forcing uninformed votes guarantees worse outcomes."
  4.  **For When Diversity Helps:** "The *best* case for group decisions isn't just adding bodies or talking – it's harnessing truly *diverse, independent perspectives* on the problem. If we can structure discussion to surface unique insights without creating herd behavior, *then* we might outperform even experts."

  **Core Takeaway:** Your colleague is misapplying a slogan. The standard voting wisdom claims **require independence and basic competence**, which your scenarios likely violate. Unstructured deliberation breaks the independence required for voting wisdom. True "wisdom" comes either from **independent competent voters** or **effectively harnessing cognitive diversity**, not simply adding voters or talking. Use this menu to pinpoint *which* claim they think applies and *why* the requirements aren't met.
