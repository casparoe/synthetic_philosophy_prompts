prompt: |-
  Hi — practical problem that I've slowly realised is a philosophy problem, which is annoying, because my entire formal training here is one survey course I mostly slept though, and my partner is the philosopher in the house, so right now these questions get settled by whoever talks louder over dinner. That is not a scalable way to run a data platform.

  Six months ago I inherited ownership of the shared clinical ontology for a network of about eleven hospitals — it's the layer that says what kinds of things exist in our data: patients, encounters, problems, devices, caregivers, and so on. Every couple of weeks somebody proposes a new entity type, and whatever I let in gets coded, billed against, audited, and reused as an inclusion criterion in studies for years; unwinding one costs months and makes us look foolish, so the decisions are small, frequent, and stickier than they look. They go to a data governance group that meets monthly, is mostly clinicians and one compliance person, and will rubber-stamp whatever I put in front of them, which means the actual epistemic decision is mine and I'd like it to be defensible rather than vibes. What makes it hard is that most of what people want to reify is inferred rather than recorded. I've started sorting proposals into three buckets: things that simply weren't collected but could have been; things that could only be measured by a measurement that changes the thing measured (asking someone about their adherence changes their adherence; auditing a ward changes the ward); and things that are inaccessible in principle for us — defined by a counterfactual, or by what something was like for the person living it. And my sense is that the philosophical literature on identifying what there is when some of the information can't be had — the observable/unobservable distinction, the Ramsey-sentence move where you define a term by the role it plays and then existentially generalise it away, the Newman-style worry that a finite relational structure is trivially satisfied by lots of different choices of objects so structure alone never pins down what the objects are, the proxy-function / inscrutability stuff, whatever in that neighbourhood is actually load-bearing — says something sharp about when you've identified a kind of thing versus when you've just carved out a convenient slot in a model and started talking as if the slot had an occupant.

  So: write me a decision procedure for admitting a proposed entity type. I want something an analyst with no philosophy can run in under an hour and then defend at a governance meeting. Concretely: the ordered questions; for each, what actually counts as a sufficient answer given that we mostly have claims about recorded stuff and not the world; where the procedure hard-stops with a no; where it hands off to a human because the question is about what we owe patients or what we're willing to assert, not about facts; and — importantly — the tests that carry the philosophical weight, including some version of the shuffle test (if I swapped this candidate's identity conditions for a rival candidate's and nothing downstream changed, I haven't identified an entity, only a slot), a portability check across sites with different collection habits, and a "two different ontologies, same predictions" check, plus a rule for when the honest answer is "add a derived score or a property, not a kind." Be explicit about where the procedure misfires. Then run it on three live cases: medication non-adherence inferred from pharmacy refill gaps (we already reified a version of this years ago and it partly turned out to be tracking our own reminder system rather than the patient); caregiver burden, inferred from free-text notes and partly a matter of how things seem to the caregiver; and 'avoidable admission', which leadership badly wants as a per-admission entity because a regulator is about to levy penalties on it, and which I suspect the procedure will refuse me — if it does, argue that refusal properly and give me something I can offer leadership instead, because " philosophy says no" will not survive that meeting. Please don't pad it with reading suggestions or references, I can't chase them and they won't help me on Thursday. Lead with the checklist itself, then the three applications, then a short paragraph on what the procedure can't do; no more than 1,200 words total, and define any jargon in parentheses the first time you use it.
reasoning: |-
  Okay, the user is managing a clinical ontology for a hospital network and needs a practical decision procedure for adding new entity types. They're dealing with proposals that often involve inferred rather than directly observed data, and they want to avoid philosophical pitfalls while making defensible decisions. 

  Hmm, this is actually a fascinating intersection of applied ontology and philosophy of science. The user clearly recognizes the underlying epistemological issues - the distinction between observable/unobservable, problems with reifying inferred constructs, and the risk of creating "slots" rather than real entities. They've even identified specific concerns like proxy functions and Newman's objection. Impressive for someone who slept through philosophy class!

  The core tension here is between operational needs (leadership wants "avoidable admission" as an entity) and ontological rigor. The user needs something that: (1) is executable by non-philosophers, (2) has clear rejection criteria, (3) provides alternatives when entities are unjustified, and (4) can withstand regulatory/political pressure.

  Looking at their three test cases: Medication non-adherence is a classic proxy measurement problem (refill gaps ≠ actual adherence). Caregiver burden involves privileged first-person experience. Avoidable admission is counterfactual by nature - the most philosophically fraught. 

  The procedure should probably include: operational definability checks, identity conditions, indispensability tests, and downstream impact analysis. Need to build in their requested "shuffle test" and portability checks. Important to distinguish when something should be a property/score rather than an entity type.

  For the avoidable admission case - the trickiest - we'll need to provide a pragmatic alternative that satisfies leadership's operational needs without violating ontological principles. Maybe a derived metric with clear caveats rather than a reified entity.

  The challenge is compressing complex philosophical concepts into bulletproof yes/no questions that clinicians can apply. Need to avoid jargon while preserving the substance. Should probably flag where value judgments are required versus where ontology gives clear constraints.

  ...time to distill this into that checklist format they requested.
answer: |-
  ### Ontology Admission Checklist  
  **Run sequentially; stop at first hard "No". Human judgment required at ⚠️.**

  1.  **Is this entity *directly recorded* in source systems?**  
      *   *Sufficient:* Entity appears in structured data fields (e.g., "PatientID" in ADT feed) or is the explicit subject of a documented clinical act (e.g., "MedicationAdministered" in eMAR).  
      *   *Hard Stop (No):* Entity is *only* inferred, calculated, or interpreted from other data (e.g., "risk score," "pattern," "implied state"). → *Recommend derived property or score.*  
      *   *⚠️ Judgment:* Ambiguous recording (e.g., specific free-text phrases treated as direct entry).

  2.  **Does it have *stable identity conditions*?**  
      *   *Sufficient:* Clear rules exist for when an instance of this entity begins, ends, and is uniquely distinct from others *based on recorded events/data*. (e.g., "Patient" begins at first registration, ends at death/archival, unique by MRN).  
      *   *Hard Stop (No):* Identity depends on counterfactuals ("what *would* have happened"), subjective interpretation without recording rules, or lacks clear start/end criteria.  
      *   *Test:* **Shuffle Test:** If you swapped the identity rules for this candidate with rules for a different concept (e.g., define "Admission" start by ED registration vs. bed assignment) and downstream reporting/billing/research *would materially change*, it passes. If not, it's just a slot. → *Recommend refining existing entity properties.*

  3.  **Is it *operationally indispensable*?**  
      *   *Sufficient:* Required for core, non-negotiable functions: Legally mandated billing (e.g., DRG codes), regulatory reporting (e.g., infection counts), or critical clinical decision support *acting on the entity itself* (e.g., alert based on "DeviceImplant").  
      *   *⚠️ Judgment (Potential No):* Primarily desired for analytics, research convenience, or leadership metrics. → *Recommend derived property, cohort, or flag.*  
      *   *Test:* **Portability Check:** Could sites with different data collection practices reliably identify *the same instances* using their local data? If no, not robust.

  4.  **Does it avoid *measurement interference*?**  
      *   *Sufficient:* Observing/recording the entity doesn't significantly alter its state in common clinical contexts (e.g., recording "BloodPressure" doesn't usually change BP).  
      *   *⚠️ Judgment (Potential No):* Entity is highly sensitive to the act of measurement/recording (e.g., "PatientTrust," "StaffBurnout"). → *Recommend extreme caution; likely a property/score with context.*  
      *   *Test:* **Prediction Check:** Could two different ontological definitions (e.g., "NonAdherence = refill gap >7d" vs. "...>10d") produce the same predictions/outcomes *in key use cases*? If yes, ontology choice is arbitrary; → *Recommend standardizing the measure/property, not the entity.*

  5.  **Is it *ontologically minimal*?**  
      *   *Sufficient:* Cannot be fully reduced to a property/state of an existing entity without losing critical operational meaning *and* failing checks 1-4.  
      *   *Recommendation (No):* If it's primarily a state (e.g., "HighRisk"), status (e.g., "Eligible"), or attribute (e.g., "BurdenLevel"), → *Add as property/flag to relevant existing entity (e.g., Patient, Caregiver, Encounter).*

  ---

  ### Application to Cases

  1.  **Medication Non-Adherence (Inferred from Refill Gaps):**  
      *   **Check 1 (Directly Recorded):** *No.* Refill dates are recorded; "non-adherence" is inferred. Hard Stop. → *Should have been a derived property/score on `MedicationOrder` or `Patient`.* **Result:** Admission denied. **Defense:** "We modeled the *inference* as a core entity. It conflated actual patient behavior with system artifacts (our reminders). It's a measurement, not a fundamental thing we record. We'll retire the entity and manage it as a patient-level quality metric with documented calculation and known limitations."

  2.  **Caregiver Burden (Inferred from Notes):**  
      *   **Check 1 (Directly Recorded):** *No.* Notes are recorded; "burden" is interpreted. Hard Stop. → *Recommend NLP-derived `burdenScore` property on `Caregiver` or `CareEpisode`.* **Result:** Admission denied. **Defense:** "Burden is a subjective state experienced by the caregiver, inferred from clinician notes. It's not directly recorded like a diagnosis or vital sign. Modeling it as a core entity implies objectivity it lacks and risks misuse. We'll capture it as an interpretable score attached to the Caregiver, clearly flagged as inferred from text."

  3.  **Avoidable Admission (Desired per-Admission Entity):**  
      *   **Check 1 (Directly Recorded):** *No.* Admission is recorded; "avoidability" is a judgment.  
      *   **Check 2 (Stable Identity):** *No.* Start/end is the admission. But uniqueness/avoidability? Depends entirely on counterfactual judgment ("could care have been given elsewhere?"). Different reviewers/algos will disagree on *which specific admissions* are avoidable. Fails Shuffle Test (swapping review criteria changes the instances).  
      *   **Check 3 (Operationally Indispensable):** *⚠️.* Needed for penalties/reporting, but is the *entity* indispensable? Or is the *metric* (count/rate) sufficient? Portability Check fails (sites with different resources/ED policies will identify different admissions as avoidable).  
      *   **Result:** Admission denied.  
      *   **Defense & Alternative for Leadership:** "Modeling 'AvoidableAdmission' as a core entity implies we directly record a definitive property of *each admission itself*, which we don't. Avoidability is a complex judgment based on guidelines, resources, and hindsight. Creating this entity would institutionalize arbitrary distinctions and create audit nightmares. **Instead, we propose:**  
          *   A rigorously defined, auditable **derived metric**: 'Potentially Avoidable Admission Rate'.  
          *   Based on **standardized criteria** (e.g., ACSC lists + clear exclusions) applied to *existing* `Admission` entities.  
          *   Documented calculation logic, limitations, and review process.  
          *   This gives you the required number for the regulator without falsely reifying a judgment as a core data object." *(Focus on auditability, standardization, and risk mitigation.)*

  ---

  ### What This Procedure Can't Do

  *   **Resolve Value Conflicts:** It flags ontological issues but can't decide between competing clinical definitions (e.g., defining "sepsis") – that requires domain consensus.
  *   **Guarantee Data Quality:** Admitting an entity (e.g., "Device") doesn't ensure it's recorded accurately or completely.
  *   **Handle Emergent Entities:** It's conservative. Truly novel, valid entities emerging from complex data interactions might be missed initially.
  *   **Override Regulation:** If a regulator *mandates* treating an inference as an entity (even poorly defined), you may have to implement it pragmatically, but the checklist highlights the risks.
