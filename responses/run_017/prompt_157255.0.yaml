prompt: |-
  I'm teaching a grad seminar on Wittgenstein's On Certainty this term, and somewhere around week four I noticed that I have a big pile of gut verdicts about which propositions are hinges and which are just ordinary empirical claims, and that I cannot get them into any order. So here is my list. I'd rather you tell me what principle (if any) I am fumbling toward than tell me what Wittgenstein thought, and please don't hand me a reading list or a stack of citations — I've got the syllabus, I want the principle.

  That I have two hands: I don't want to call it knowledge, and doubt of it strikes me as empty rather than as wrong — hinge, as far as I'm concerned. That the earth existed for a very long time before I was born: same verdict, hinge. That I have a brain: I've never had a scan, my evidence is the same textbook testimony any first-year has, and still I'd refuse to call it an open question — hinge, or so it feels. That I have never been to the Moon: hinge-like for me, though plainly it wasn't one for the Apollo crews, and I'm not sure that's just a quirk of who is speaking. That this thing in front of me is a table: plainly empirical, I could be looking at a very good stage prop or at a headset feed — except that doubting it out loud in a seminar room feels like exactly the idle doubt I called empty two sentences ago, so I seem to be running two standards and I can't say which is the real one. That I was born in Dayton, Ohio: I've never seen a certificate, my mother told me, it could easily be false, and yet being corrected about it would unsettle me far more than being corrected about the table — verdict: feels like bedrock, and I think it isn't, which is the pair I keep going back and forth on. That water is H2O: learned from testimony, never verified by me, functions as bedrock for the chemists I know, and my verdict is that it's an empirical a posteriori identity and not a hinge, even though it looks structurally identical to the earth-is-old case. That 2+2=4: not a hinge, and whatever goes wrong when someone doubts it goes wrong differently from what goes wrong when someone doubts my having hands. That the Holocaust happened: an empirical historical claim I know on testimony, and a denier is denying something I know, not stepping outside the frame — except that I notice I reach for the word madness about such a person, which is the same word I use for the person who doubts his hands, and that worries me. That my students have minds: I don't think this is a hinge or a knowledge-claim at all; my relation to them isn't a bit of inferred theory.

  So: can you state a principle — or two, if there's a genuine fork and they come apart somewhere — that captures as many of these as possible, saying what makes a proposition a hinge, wether hinges are personal or communal, and wether they can be true, false, or known; and then tell me plainly which of my verdicts it can't accommodate and would force me to drop? I'd also like it run on two cases I haven't put on the list, because I suspect that's where it breaks. First: a woman of seventy-two who was raised by a man she believed was her father, who finds out through a genetic test that he wasn't, and whose world-picture doesn't otherwise move — for seventy years that proposition was as close to bedrock as anything in her life, and then it was quietly overturned. Second: an anthropologist who spends years in a village where everyone treats dreams as carrying news of distant deaths and who never acquires that hinge herself, while a boy from the same village goes to medical school in the capital and loses it. Please write it up in plain American English, no seminar-speak.
reasoning: |-
  Okay, the user is teaching a grad seminar on Wittgenstein's On Certainty and has hit a wall around week four. They've got this pile of gut feelings about what counts as a hinge proposition versus ordinary empirical claims, but they can't find a unifying principle. They listed examples like having two hands, the Earth's age, having a brain, never going to the Moon, and so on. Each one feels different, and they're struggling to reconcile their intuitions. 

  First, I need to understand their frustration. They explicitly said they don't want citations or reading lists—they want a principle that explains their own verdicts. That's key. They're not looking for Wittgenstein exegesis; they want to make sense of their own messy intuitions. The fact that they mention doubts feeling "empty" for some propositions but not others suggests they're grappling with the functional role of hinges versus empirical claims. 

  Looking at their examples, I notice a pattern: some propositions feel non-negotiable ("bedrock"), while others feel open to evidence. But there are wrinkles. The table example is tricky—it seems empirical, but doubting it in context feels performatively absurd, like doubting hands. The Dayton birthplace case is emotionally bedrock but factually shaky. The Holocaust denial example is especially charged—they call deniers "mad," which mirrors their reaction to hand-doubters, yet they insist it's empirical. That tension is revealing. 

  For the principle itself, I'm leaning toward two axes: functional role and emotional resilience. Hinges aren't about truth or justification but about what propositions *do*—they're the silent tracks on which our knowledge-claims run. But that alone doesn't explain why "water is H₂O" feels empirical while "the Earth is old" feels hinge-like. The difference might be community: for chemists, water's composition *is* a hinge, but for the user, it's not personally operational. 

  The two test cases are brilliant. The woman whose paternity was disproven shows hinges can be false yet functionally foundational. The anthropologist case highlights that hinges aren't universal—they're woven into specific forms of life. The boy who loses the dream-hinge in med school illustrates how contexts change hinges. 

  I'll avoid jargon. "Bedrock" and "load-bearing" might work better than "grammatical" or "framework." The emotional weight—how it *feels* to doubt—matters as much as the logical role. For their verdicts: "water is H₂O" isn't a hinge *for them* because it doesn't underpin their daily actions, whereas "Earth is old" does (e.g., for geology, evolution, etc.). The Holocaust case? Its hinge-like weight comes from moral catastrophe, not epistemology. 

  Finally, I should flag where the principle strains: "I have a brain" *should* be empirical by my criteria, but the user insists it's bedrock. Maybe because questioning it unravels too much at once? That's worth naming as a limit.
answer: |-
  Here’s a principle distilled from your gut verdicts, designed to capture what makes a proposition *feel* like a hinge **for you**, not an abstract theory of hinges. It has two intertwined parts:  

  ### **The Principle:**  
  **A proposition is a hinge *for you* if:**  
  1. **It’s load-bearing in your daily world-picture**, meaning that *questioning it doesn’t feel like investigating a fact*—**it feels like unzipping reality itself**. Doubt here is idle because it doesn’t *do* anything practical; it just makes your grip on the world slip.  
  2. **Its truth isn’t held “on evidence” but is baked into how you act, speak, and trust**. You don’t *use* this proposition—you *move within it* like air. Correcting it wouldn’t just update a belief; it would send tremors through your trust in memory, senses, or community.  

  ### **What makes hinges *personal* (not just communal):**  
  Hinges are **anchored in your form of life**—your habits, history, and how you’re embedded in a community. What’s bedrock for you might be negotiable for others (e.g., "I’ve never been to the Moon" isn’t a hinge for an astronaut). But communal practices *shape* your hinges: you inherit most of them, and losing them feels like exile from your world.  

  ### **Can hinges be true, false, or known?**  
  - **True/false**: Yes (e.g., "I was born in Dayton" could be false).  
  - **Known**: No—not in the "I checked" sense. Hinges are *lived*, not known. Calling them "knowledge" feels like calling oxygen a fact you learned in school.  

  ---  

  ### **How your verdicts map to the principle:**  
  ✅ **Fits perfectly**:  
  - **Hands/Earth is old/I have a brain**: Doubting these feels like unzipping reality. You don’t hold them "on evidence"—they’re how you hold *onto* evidence.  
  - **Never been to the Moon**: Load-bearing for *your* world-picture (not an astronaut’s).  
  - **Born in Dayton**: Correction wouldn’t just fix a fact—it would warp your history. *Feels* bedrock because it’s woven into your identity.  
  - **Students have minds**: Not a hinge or knowledge-claim—it’s how you *engage* with them, not a proposition you assert.  

  ⚠️ **Fits, but you’re wrestling with why**:  
  - **This is a table**: In *isolation*, empirical. But in your seminar room, **doubt feels empty** because the context *makes it* hinge-like. Principle: Hinges are **context-sensitive**. In a normal room, "this is a table" is a hinge; in a film studio, it’s empirical. Your gut isn’t inconsistent—it’s tracking context.  
  - **The Holocaust happened**: You *say* it’s empirical, but calling denial "madness" reveals its hinge-like role: it’s **moral bedrock**. Denial doesn’t just miss a fact—it severs shared humanity. That’s why it *feels* like doubting hands.  

  ❌ **Doesn’t fit—your principle forces you to drop these verdicts**:  
  - **Water is H₂O**: You call it empirical, but by your principle, it *should* feel hinge-like (like "Earth is old"). Both are trusted testimony, both underpin science. **Drop this verdict**. For chemists, it *is* a hinge; for you, it’s not *yet* load-bearing because you don’t *live* in chemistry.  
  - **2+2=4**: You say "not a hinge," but doubting it *does* feel like unzipping logic. **Drop this verdict**. It’s a hinge, but a *logical* one—so doubt breaks differently than doubting hands (math vs. sensory trust).  

  ---  

  ### **Test Case 1: The Woman and Her Father**  
  - **Verdict by the principle**: For 70 years, "He is my father" **was a hinge**—load-bearing in her identity, actions, and trust. The genetic test didn’t just correct a fact; it fractured her history. *Now*, it’s an empirical claim (with evidence), but the **hinge is gone**, leaving a scar. Hinges can be false, personal, and unmovable until they’re not.  

  ### **Test Case 2: The Anthropologist and the Dreamers**  
  - **Verdict by the principle**:  
    - **In the village**: "Dreams carry news of distant deaths" is a **communal hinge**. It’s not "believed" on evidence—it’s the air they breathe.  
    - **The anthropologist**: Never acquires it because she lacks the **form of life** that makes it load-bearing. For her, it’s anthropology, not reality.  
    - **The medical student**: Loses it because medical training **rewires his hinges**—new actions (dissections, lab tests) make the dream-hinge collapse. It’s not disproven; it becomes *idle*.  

  ---  

  ### **Where the principle breaks**:  
  It struggles with **"I have a brain."** By the principle, this *should* feel empirical (you’ve never seen it!). But you refuse to call it an open question. Why? Because doubting it **implodes too much at once**—it’s not just *a* hinge but a keystone. This exposes a limit: hinges cluster. Some are **thick** (tied to body/identity) and resist doubt more than **thin** ones (e.g., "cars need fuel"). Your gut knows this, but the principle doesn’t grade them.  

  **In plain terms**: You’re fumbling toward **hinges as the silent tracks of your world**—not what you think *about*, but what you think *from*. When doubt feels like vertigo, not curiosity, you’ve hit bedrock.
