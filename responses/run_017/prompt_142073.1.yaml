  - Sam: The network might adapt and learn a new readout that aligns with the provided basis, showing that the representational content (bracket feature) is preserved in the new basis.
  - Nour: The network will adapt, but that only shows that the basis is interchangeable for the purpose of the task. It doesn't show that one basis was the original one.

  But this might not be decisive. Let's think of a better one.

