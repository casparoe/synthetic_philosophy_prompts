  First, brainstorm candidate cruxes (10-15) then narrow to 4-5 load-bearing ones.

  Brainstorming candidate cruxes:
  1. What is the ontological status of the subspace? Is it a real representational structure or just a mathematical artifact?
  2. Does the existence of multiple equivalent bases (with human-legible carvings) imply that there is no unique true representation?
