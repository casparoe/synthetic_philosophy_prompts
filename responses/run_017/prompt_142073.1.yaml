  Crux 3: Generalization evidence
  - Sam: The generalization to deeper nesting shows that the network has learned an abstract rule (e.g., about bracket matching) that goes beyond the training data, and this rule is represented in the subspace, supporting that the representation is real and contentful.
  - Nour: Generalization is a behavioral capacity that can be explained by the causal structure of the network, but it doesn't imply a unique representational decomposition. The subspace enables generalization, but that doesn't make one decomposition the true one.
