  4. Is the success of interventions in the subspace evidence for the reality of the subspace as a whole, or just for the utility of the decomposition?
  5. How does the generalization beyond training data (to deeper nesting) bear on the representational status?
  6. Is the fact that nothing in the architecture, loss, data, or training dynamics picks between the two carvings evidence that there is no fact of the matter?
  7. Does the failure to split into cleaner parts at higher resolution undermine the idea that there are discrete features?
  8. What role does human interpretability play? Is a human-legible basis privileged?
  9. Can we say that the network represents the bracket structure, even if the exact features are not uniquely determined?
  10. What constitutes a "representation" in the network? Is it tied to the causal role in behavior, or is there a deeper fact?
  11. Does the ability to use any basis for equally successful interventions imply that the representation is basis-invariant?
  12. Is the downstream readout (skew to both bases) evidence that the network uses a different representation than the human-legible ones?
  13. If we could find a decomposition that is aligned with the downstream readout, would that be the true representation?
  14. Would a distribution shift that causes the two carvings to disagree in predictions be decisive?
