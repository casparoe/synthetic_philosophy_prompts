  Now, narrow down to 4-5 load-bearing cruxes. We want the ones that are central and can be tested.

  Load-bearing cruxes (4-5):
  1. **Uniqueness of decomposition**: Given two human-legible bases that are equally effective for interventions and nothing in the system breaks the symmetry, is there a fact of the matter about which one is the true representation? (This goes to the heart of realism vs. instrumentalism.)
  2. **Downstream consumption**: The layer that reads the subspace uses a direction skew to both human-legible bases. Does this imply that the human-legible features are not the ones the network uses, or are they just a different basis for the same representational content? (This tests whether the network's internal processing aligns with human concepts.)
  3. **Generalization evidence**: The model generalizes to deeper nesting. Does this support that the network has a structured representation of the bracket language, and if so, does that representation have a unique decomposition? (This is about what generalization tells us about the representational content.)
  4. **Intervention under distribution shift**: If we construct a distribution shift where the two carvings disagree on what intervention to do, and we test which one works, what does that show? (This is a concrete test that could break the symmetry.)

  We'll include these four.

  Now, for the agreed claims section (6-10 claims). These should be things both sides agree on about the formalism, the case, and what needs explaining.

  Agreed Claims:
  1. In the bracket language task, the models learn to predict next tokens accurately and generalize to deeper nesting than seen in training.
  2. There exists a low-dimensional subspace in the residual stream that is causally relevant for the bracket closing behavior: interventions within this subspace can correct errors.
  3. This subspace is robust: it is found across different random seeds, survives fine-tuning on unrelated tasks, and supports generalization.
  4. The subspace does not decompose uniquely into human-legible features at the level of individual directions: any basis within the subspace supports equally effective interventions.
  5. Two different human-legible bases (carvings) of the subspace have been identified, both of which are equally effective for interventions. There is no known fact about the training process (architecture, loss, data, dynamics) that breaks the symmetry between these two carvings.
  6. The downstream layer that consumes the representation from this subspace reads out a direction that is not aligned with either of the human-legible bases; it is skew to both.
  7. The existence of the subspace and its causal efficacy must be explained by any account of the network's functioning.
  8. Current interpretability methods (e.g., intervention-based) are sufficient to identify the subspace but do not uniquely determine a basis for it.

  Now, the disagreements table. We have four cruxes.

  Crux 1: Uniqueness of decomposition
  - Sam (realist): Despite the symmetry, there is a fact of the matter about which decomposition is the true one, even if we cannot currently access it. The true representation is determined by the network's computational structure and history.
