prompt: |-
  I record a small, slightly over-long podcast on metaphysics for listeners who already know a bit of it, and in a fortnight I'm interviewing a philosopher of physics — she's asked me not to be named in the blurb, so let's call her Professor Halloway — who's just published a book defending what she calls orientation absolutism: the claim that left-handedness is a genuine intrinsic, monadic, irreducible property of objects, not a relation to us or to a paradigm hand or to a convention, and that Kant basically settled this in his 1768 essay on the ground of the difference between regions in space, with his incongruent counterparts: a left and a right hand agree in every intrinsic magnitude and in all their internal relations and still can't be brought to coincide, so no relationalist story about space can account for the difference. I remember the examples being hands and ears and — I think — snails whose shells wind the other way, but don't hold me to that. What I want from you is ten or twelve questions that don't just let her restate the view.

  The bit I most need help with is her escape route. Every time anyone brings up the actual physics she says something like "that's a fact about the notation of our theories, not about handedness", and sails on, and I've never found a way past it. So I've been reading up so I dont sound like an idiot: as I understand it, Wu's cobalt-60 experiment (done in 1956) found that the electrons from the beta decay come out preferentially in one direction relative to the spin of the aligned nuclei, so the weak interaction isn't mirror-symmetric, which gives a way of operationally defining left and right that needn't presuppose any shared object — but that on its own arguably doesn't settle it, because if CP were conserved then the mirror image of the whole set-up would still be a physically possible process, just one involving antimatter, and it was Cronin and Fitch's 1964 result on neutral kaon decay that broke that last symmetry. Tell me if I've got any of that wrong, and then build me a run of three or four questions that start by granting her the notation point and make it progressively harder to lean on: does her view really have no stake in whether the laws are handed; would a parity-symmetric world be one in which there's no fact of the matter about which hand is which; and if she insists the metaphysics is independent of the physics, then what would a world have to be like for there to be no fact of the matter — a single handed object and nothing else, say, or two objects that are mirror images of each other and nothing else — and what does absolutism say in those cases?

  A few other things I'd want covered, each with a follow-up keyed to whatever she'd most likely answer: the question that got me into this in the first place, which is what holds each side together — that all left hands are congruent with all other left hands, all left gloves fit all left hands, congruence among handed things is transitive and sorts everything into exactly two classes — is that a further fact standing in need of explanation, and can she keep it if space turns out to be awkward (a creature living on a Möbius-band sort of space can travel round a loop and come back mirror-reversed, so "left" only coheres locally: does her intrinsic property go local, or does her view entail that actual space is orientable?). Also whether a truly intrinsic monadic property can be hostage to the dimension of the space it sits in, given that a flat scalene triangle and its mirror image can't be made to coincide by sliding around inside the plane but can be if you flip one over through the third dimension, and that in four dimensions you could in principle turn a left hand into a right hand by rotating it through the extra one. Also one on the old problem of telling a distant civilisation by radio alone which side counts as left, and one on whether we could ever discover we'd had it backwards all our lives. And a closing question about what would count as evidence against the view, or whether she thinks the whole dispute with the relationists is verbal. Where you can, phrase the questions so a non-specialist listener can follow them without the point getting dumbed down, and stick brief notes in brackets on why each follow-up bites.
reasoning: |-
  Okay, let me approach this systematically. The user hosts a niche metaphysics podcast and needs sophisticated yet accessible interview questions for Professor Halloway on her "orientation absolutism" theory. 

  First, I need to understand the core tension: Halloway dismisses physics evidence as "mere notation," so the challenge is constructing questions that bypass this deflection. The user's research on Wu's experiment and CP violation is impressively accurate - no corrections needed there. 

  The key angles I see are:
  1) Physics interdependence: How would her theory function in a parity-symmetric universe? Could we even define left/right without physical asymmetry?
  2) Topological vulnerability: What if space isn't globally orientable (Möbius strip scenario)? Does "intrinsic" property become local?
  3) Dimensional fragility: Why should a supposedly fundamental property depend on spatial dimensions? 
  4) Epistemic consequences: If we discovered we'd misidentified left/right all along, what would that imply?

  For the physics progression, I'll structure it like fencing maneuvers:
  - First question grants her "notation" point but asks if physics is irrelevant to metaphysics
  - Second pushes whether parity symmetry would erase objective handedness
  - Third questions if CP violation creates a privileged reference frame
  - Fourth isolates what minimal physics her theory requires

  On the topological front, the Möbius strip case is perfect - it forces her to choose between locality or demanding our space is orientable. The dimensional argument (2D triangles vs 3D flipping) similarly exposes contingency issues.

  The communication test (explaining left via radio) is great for listeners - it makes abstract theory tangible. And the closing "discovering we're wrong" question ties back to testability.

  Each follow-up is designed to counter predictable defenses:
  - If she claims physics-independent essences, ask why we never observe exceptions
  - If she retreats to local properties, question transitivity
  - For dimensional responses, press why dimensions matter for monadic properties

  The questions maintain academic rigor while using concrete examples (hands, snails, gloves) to keep it accessible. Brief bracketed notes will help the user deploy follow-ups effectively during the interview.
answer: |-
  Here's a carefully constructed set of questions tackling the core challenges of orientation absolutism, designed to push past the "notation" deflection and explore metaphysical commitments. Each includes a concise follow-up rationale in brackets:

  **Core Physics Progression (Targeting the "Notation" Escape):**

  1.  **"Professor Halloway, you often characterize physics findings about parity violation as concerning 'notation'. Could we imagine a universe where the fundamental laws *were* perfectly mirror-symmetric? In such a universe, would orientation absolutism still hold that there is an objective, intrinsic fact about whether, say, a particular snail shell is left-handed or right-handed?"** *(Follow-up if she says Yes): "If the laws were symmetric and no physical process or observation could ever distinguish a left-handed shell from its mirror twin – not even in principle – what empirical content does the claim 'this shell is intrinsically left-handed' actually possess? Isn't it reduced to a label without physical consequence?"* [Forces engagement with the *metaphysical consequences* of symmetric laws. If the *physics* provides *no handle* on the distinction, the "intrinsic property" looks empirically inert or epiphenomenal].
  2.  **"Following on: Wu's experiment seems to provide a non-conventional way to *operationally define* 'left-handed spin' relative to a nucleus's momentum. If we accept your point that this is 'notation', does your absolutism *require* that such an operational definition must *correspond* to the *true, intrinsic* left-handedness of the spin? Or could the physics definition be arbitrarily flipped, while the intrinsic property remains fixed?"** *(Follow-up depending on answer):* 
      *   *If she says it must correspond:* "Doesn't this make the intrinsic property *dependent* on the physical asymmetry revealed by the weak force? What grounds the correspondence if not the physics itself?"
      *   *If she says it could be flipped arbitrarily:* "If the operational definition provided by fundamental physics can be arbitrarily reversed without changing the underlying intrinsic reality, doesn't that suggest the physics is irrelevant to the *metaphysical fact*? How could we ever know we had the 'right' correspondence?" [Examines the *link* (or lack thereof) between the operational physics definition and the purported intrinsic property. Both answers create tension: correspondence makes physics essential, arbitrariness severs the property from physical reality].
  3.  **"Given Cronin and Fitch showed CP violation, the combined mirror image *and* matter-antimatter swap *isn't* a symmetry of nature. Does this CP violation ground a *privileged* physical reference for defining intrinsic handedness in a way that mere P violation (like Wu's) might not? Or is this, too, just 'notation'?"** *(Follow-up if she dismisses it as notation):* "If even the *failure* of the combined symmetry doesn't touch the metaphysics of intrinsic handedness, what *possible* physical discovery *could* be relevant to it? Does the absolutist claim become completely insulated from physics?" [Uses the stronger asymmetry (CP violation) to push harder on the insulation claim. Forces consideration of whether *any* physics is relevant, potentially revealing the position as non-falsifiable].
  4.  **"Let's isolate the metaphysics: Imagine a universe containing *only one* hand. Does absolutism entail that this lone hand possesses an intrinsic property of either left-handedness *or* right-handedness? Or is handedness only definable relationally, when a counterpart exists?"** *(Follow-up based on answer):*
      *   *If Yes (intrinsic to one hand):* "What determines *which* property it has? Without any other object, frame, or asymmetric law, isn't assigning 'left' or 'right' completely arbitrary, contradicting the idea of an *intrinsic* fact?"
      *   *If No (requires counterparts):* "Doesn't this concede that the property's *manifestation* or even *existence* depends on the relational structure (the possibility of incongruent counterparts), moving towards relationism?" [Tests the core absolutist claim in the minimal conceivable scenario. A single hand is a major challenge for intrinsic monadic properties of handedness].

  **Coherence & Topology:**

  5.  **"Congruence seems fundamental: all left hands fit together spatially in a way they don't fit with right hands. This transitivity groups all handed objects into two neat classes. Is this pervasive coherence of handedness across space a *further contingent fact* about our world, or is it *entailed* by orientation absolutism itself?"** *(Follow-up if contingent):* "Could we imagine a universe where space had a different topology – say, like a Möbius strip – where traveling along certain paths could change an object's handedness relative to its starting point? If such a universe is metaphysically possible, how could an *intrinsic monadic* property like 'leftness' persist globally? Wouldn't absolutism force us to say such spaces are *impossible*?" [Challenges absolutism with non-orientable spaces. If handedness isn't globally coherent, intrinsic monadic properties seem untenable; if they are impossible, absolutism dictates spacetime geometry].
  6.  **"Building on topology: If we discovered our universe *was* globally non-orientable (even if locally Euclidean), what would orientation absolutism predict? Would 'leftness' become a frame-dependent or local property? Or would the theory be falsified?"** [Directly confronts the theory with a physically possible (if unlikely) scenario. Forces a choice: modify absolutism (make it local/relative) or risk falsification].

  **Dimensional Dependence:**

  7.  **"Handedness famously depends on dimension. A truly flat, 2D scalene triangle has a handedness – its mirror image can't be superimposed without lifting out of the plane. But in 3D space, we *can* flip it over. And in 4D, one could rotate a hand to change its chirality. How can an *intrinsic, monadic* property be fundamentally altered or eliminated simply by embedding the object in a higher-dimensional space?"** *(Follow-up):* "Doesn't this dependence on the *ambient space's dimension* undermine the idea of handedness being an irreducible, intrinsic property *of the object itself*, rather than a property of the object *in relation to* the space it inhabits?" [Highlights how the putative intrinsic property isn't stable under changes in the spatial context, suggesting it's relational to the embedding space].

  **Epistemology & Communication:**

  8.  **"The classic thought experiment: How would you instruct an alien civilization, communicating only by radio (no shared objects or images), to build a left-handed glove? Assuming they understand geometry and physics, could your absolutism provide a method that doesn't ultimately rely on *their* local conventions or pointing to a specific physical process like beta decay?"** *(Follow-up if she invokes physics):* "If the only non-conventional method relies on describing the asymmetric physics (e.g., the Wu experiment setup), doesn't this concede that the *identification* of the intrinsic property is fundamentally tied to that physical asymmetry?" [Tests the epistemic access to the purported intrinsic property. Avoiding conventions *and* physics seems impossible for absolutism].
  9.  **"Could we ever discover that we've been wrong all along, that what we call 'left' is actually the intrinsic property we should call 'right'? If yes, what would such a discovery look like? If no, does that mean our labeling is infallibly connected to the intrinsic property?"** *(Follow-up):* "If we *could* discover we were wrong, doesn't that suggest the label and the property are distinct, and the property must be identified *through* something else (like physics)? If we *couldn't* be wrong, how is that different from conventionalism about the *labels*?" [Probes the theory's testability and the link between language and the purported property].

  **Metaphysical Stakes & Conclusion:**

  10. **"Finally, to clarify the nature of the debate: What would you consider compelling evidence *against* orientation absolutism? Conversely, do you see any scenario where the dispute between absolutists and relationists could be resolved as merely verbal – a difference in how we choose to use language rather than a disagreement about the fundamental structure of reality?"** *(Follow-up if she denies it's verbal):* "If it's not verbal, what concrete, observable difference in the world does orientation absolutism commit us to, that relationism does not? Especially in light of our discussion about physics and topology?" [Forces consideration of falsifiability and the empirical/metaphysical content of the claim].

  **Key to Bracketed Follow-Up Rationale:**

  *   **Bites:** Highlights the specific tension, vulnerability, or implication the follow-up aims to expose in Halloway's likely response.
  *   **Aims:** To push beyond restatement, challenge insulation from physics, expose consequences for coherence/dimension/epistemology, and test falsifiability.
  *   **Listener Accessibility:** Questions use concrete examples (hands, snails, gloves, Möbius strips, aliens, triangles) and avoid overly technical jargon. The progression builds logically. The follow-up rationale is for *you*, not the listener, ensuring you understand the strategic point.

  This set starts by granting her "notation" point but systematically tightens the constraints, forcing her to clarify the metaphysical commitments of absolutism regarding physics dependence, topological coherence, dimensional stability, epistemic access, and ultimately, what the theory *actually claims* about the world that makes a difference. Good luck with the interview!
