      - EU(not pay) = - P(F=true | email) * $50,000.
      - Pay only if EU(pay) > EU(not pay), i.e., if -1500 > -50,000 * P(F|email), which simplifies to P(F|email) > 1500 / 50,000 = 0.03 (3% threshold).
      
      With your high r, P(F|email) is low (e.g., 2.2–4.5% for p=5–10%), and likely ≤3% unless p is high. Thus, EU(not pay) is better (e.g., for p=5%, EU(not pay) ≈ -0.022 * 50,000 = -$1,100, better than EU(pay) = -$1,500). Paying only beats not paying if P(F|email) > 3%, which requires p > ~6.7% in this setup (solved from the inequality).

