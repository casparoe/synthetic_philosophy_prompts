prompt: |-
  I teach a large introductory philosophy course each fall — roughly four hundred students — and I keep the department's shared bank of thought experiments: about sixty cases that my colleagues and our graduate instructors draw on for lectures, discussion sections, and exams. Two or three times a week during term I have to make a call about one of them: whether to put it in front of first-year students who have no theory at all, whether to present it as raising a question or as settling one, and whether it is safe to grade on. The same question comes up in a different register a few times a year when I referee, where what I have to judge is whether a manuscript's case is carrying a conclusion it has not earned.

  My own practice has been a small set of habits I picked up long ago and never systematized: restate the case in flat prose and see whether the verdict survives, look for the word "surely" doing the work of an argument, ask what the case is implicitly being contrasted with. These habits do not compose into anything I can hand to a graduate instructor, and they tell me nothing about the cases where my students divide evenly, or where the division shifts depending on the order in which I present two versions.

  Please turn whatever is defensible in the notion of an intuition pump — the term as Dennett uses it, together with the standing worry that a case can persuade by its framing, its imagery, or the order of its questions rather than by its content — into a procedure my teaching team can actually run on a candidate case, in twenty or thirty minutes, with no training in the methodology literature. I want the questions in the order they should be asked; what would count as a sufficient answer to each; the point at which the procedure stops with a no; and the point at which it returns the decision to a person because the question is one of values, of emphasis, or of what we want the students to notice, rather than one the case can settle. Please also say plainly what such a procedure cannot do. If my three habits do not survive the translation, discard them, but tell me what is wrong with them.

  Three features of the procedure matter to me. First, the cases in the bank are not all doing the same job. Some are meant to elicit a verdict that we then treat as evidence about how a concept works — the way we treat a judgment about whether someone knows, or acted freely, or intended a result. Others are meant only to make a conceptual possibility vivid: to show that a certain combination is not excluded by the concepts alone, without asking anyone to endorse a verdict about it. A third kind does neither and is pure scaffolding — it gets students to see that a distinction is available before we argue about where to draw it. I want the procedure to sort a case by the job it is meant to do before it tests it, and to apply different tests accordingly: the same case can be a poor verdict pump and an excellent possibility pump, and conflating the two is the error I most want to avoid. Second, the procedure has to tell me which cases are safe to put on an exam, where a grader needs a determinate answer, as opposed to which belong only in discussion. Third, it has to have something to say when the verdict is unstable across a room and across order of presentation.

  Please run the finished procedure on the three cases below.

  One. I have opened the unit on free will with this case for fifteen years. A device, implanted without your knowledge, monitors your deliberation and adjusts one parameter — your threshold for acting on a consideration. Whenever your deliberation would have issued in a selfish decision, the device raises the threshold until you decide generously instead; whenever your deliberation would already have issued in generosity, it does nothing at all. Over the following months you act generously again and again; the generous acts flow from your own reasons in the ordinary way; you take pride in them, and you become known among your colleagues as a generous person. Are those acts free, and are you praiseworthy for them? This is the case I would be most reluctant to give up, and that is exactly why I want the procedure applied to it without sympathy.

  Two. A system produces fluent, responsive answers in a natural language over decades of interaction. Internally it consists of a million clerks, each applying a single rule for rewriting one symbol into another, each with no idea what any of it means, connected so that the output of one is the input of the next. Does the system understand what it says? I have always presented this as a possibility pump, not a verdict pump, and I want to know whether that classification is honest.

  Three. The vice-president of a company is told that a new program will, as a side effect, help the environment. He does not care about the environment at all; he approves the program purely for profit, and the environment is helped. In the paired version the side effect is harm rather than help, and he is equally indifferent to it. Did he bring about the side effect intentionally? My students divide on this, and the division moves with which version I present first. Tell me whether the procedure treats this as a usable case, what it says about the instability, and where, if anywhere, it hands the decision back to me.
reasoning: |-
  Okay, the user teaches a large intro philosophy course and manages a shared bank of thought experiments. They need a systematic procedure to evaluate these cases, especially since their current methods are unsystematic habits. Let me break down their main needs.

  First, they want a clear, step-by-step procedure that grad instructors can use without prior methodology training. The procedure should handle different types of cases: verdict pumps, possibility pumps, and scaffolding. Each type requires different tests. The user emphasized not conflating these, which is crucial.

  Next, the procedure must determine if a case is safe for exams where definite answers are needed versus only for discussions. Also, it needs to address cases where student responses are unstable—like when opinions split or shift based on presentation order.

  Looking at their three habits—restating in flat prose, checking for "surely," and identifying implicit contrasts—I need to integrate or explain why they might not suffice. For instance, restating in flat prose helps strip rhetorical flair but doesn't address structural issues like framing effects. The word "surely" might indicate hidden assumptions, but it's not systematic. Implicit contrasts could reveal loaded setups, but again, it's not a full solution.

  The user provided three cases to test the procedure. The first is about free will with an implant. The second is about understanding in a system of clerks. The third involves intentionality in side effects, where order affects student responses. Applying the procedure to these will show its practicality.

  I should structure the procedure in phases. Phase 1: Classify the case's purpose. Is it eliciting a verdict, illustrating a possibility, or scaffolding a distinction? This step prevents misapplication. Phase 2: Test based on classification. For verdict pumps, check if the conclusion is earned, look for framing effects, and test stability. For possibility pumps, ensure it doesn't imply a verdict and clarity. Scaffolding cases need clarity without premature conclusions.

  For exam safety, verdict pumps must have stable, earned conclusions; possibility and scaffolding cases shouldn't be graded on content. Instability in responses might mean the case isn't suitable for exams or needs reworking.

  Applying this to the first case: It's a verdict pump. Testing for framing—does the positive framing of "generosity" affect the verdict? Stability test: If presenting selfish vs. generous versions changes outcomes, it's unstable. Here, the conclusion that acts aren't free might not be earned if the implant's influence is covert but decisions feel authentic.

  Second case: Classified as a possibility pump. Check if it avoids implying a verdict. The clerk system shows functionalism is possible without claiming it's true. Framing with "no idea what it means" might bias against understanding, so neutral restatement helps. It's not for exams.

  Third case: Verdict pump. Order affects responses, indicating instability. The procedure flags it as unreliable for exams. The decision is handed back to the instructor about whether to use it for discussion, considering pedagogical goals.

  Limitations: The procedure can't resolve deep philosophical disputes or replace expert judgment on values. It flags issues but doesn't create perfect cases. It relies on testing with students, which takes time.

  The user's habits are partially integrated. Flat prose is included in framing checks. "Surely" is part of loaded language detection. Implicit contrasts are in the framing test. But the procedure adds systematic steps for stability and classification, which their habits lacked.
answer: |-
  Here is a tested, step-by-step procedure for evaluating thought experiments ("intuition pumps") in your teaching context. It addresses classification, robustness, exam safety, instability, and hands back value judgments. The procedure takes 20-30 minutes per case and requires no specialized training.

  ---

  ### **The Intuition Pump Evaluation Procedure**
  **Phase 1: Classify the Case’s Purpose (5 mins)**  
  *Ask: What job is this case designed to do?*  
  - **Verdict Pump (VP)**: Elicits a specific judgment (e.g., "This is/is not free will").  
  - **Possibility Pump (PP)**: Makes a conceptual possibility vivid (e.g., "Physicalism could explain consciousness").  
  - **Scaffolding (SC)**: Prepares for a distinction without demanding a verdict (e.g., "Intent vs. foresight can come apart").  
    *Decision Point*: If the purpose is ambiguous, rewrite the case to clarify its role. If still unclear, discard or redesign.

  **Phase 2: Apply Purpose-Specific Tests (15 mins)**  
  *(Run tests in sequence; stop if a "no" is triggered)*  

  | **Test**               | **Verdict Pump (VP)**                                                                 | **Possibility Pump (PP)**                                                                 | **Scaffolding (SC)**                                                                 |
  |------------------------|---------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------|
  | **1. Framing Check**   | Remove vivid language/imagery. Restate in neutral terms. Does the intended verdict vanish? → *If YES, reject VP.* | Neutralize loaded language. Does the possibility still seem coherent? → *If NO, reject PP.* | Strip examples to core structure. Is the distinction still visible? → *If NO, reject SC.* |
  | **2. Loaded Language Scan** | Search for "surely," "obviously," or emotional rhetoric. Does it mask a missing premise? → *If YES, reject VP.* | Identify biased phrasing (e.g., "merely a machine"). Does it imply a verdict? → *If YES, reject PP.* | Check for presuppositions (e.g., "clearly distinct"). Do they preempt student discovery? → *If YES, reject SC.* |
  | **3. Contrast Test**   | What is the implicit contrast? (e.g., "free vs. manipulated"). Is it fair? → *If NO, reject VP.* | What alternatives does it exclude? Are they ruled out illegitimately? → *If YES, reject PP.* | Does it imply only one way to draw the distinction? → *If YES, reject SC.* |
  | **4. Stability Test**  | Reverse key variables (e.g., selfish→generous). Does the verdict flip? → *If YES, flag as unstable; unsafe for exams.* | Vary details (e.g., number of clerks). Does the possibility collapse? → *If YES, reject PP.* | Swap examples. Does the distinction blur? → *If YES, reject SC.* |

  **Phase 3: Final Checks & Handback (5 mins)**  
  - **Exam Safety**:  
    - *VP*: Safe only if it passes all tests **and** Stability Test is negative (verdict consistent).  
    - *PP/SC*: Never safe for graded exams (use only in discussion).  
  - **Instability Handling**:  
    - If Stability Test reveals order-/framing-dependence, flag: "Unstable—usable only to *show* disagreement, not to resolve it."  
  - **Handback to Instructor**:  
    - Return the case if:  
      1. Tests are passed but pedagogical values dictate redesign (e.g., "Should we emphasize skepticism here?").  
      2. The case works for one purpose (e.g., PP) but not its intended use (e.g., VP).  
      3. Instability is pedagogically useful (e.g., to teach about framing effects).  
  - **Output**:  
    - **Pass**: Case is cleared for its purpose.  
    - **Fail**: Discard or redesign.  
    - **Handback**: Instructor decides based on teaching goals.  

  ---

  ### **What This Procedure Cannot Do**  
  1. **Resolve philosophical disputes** (e.g., determinism vs. libertarianism).  
  2. **Guarantee student comprehension**—only tests robustness of the case itself.  
  3. **Replace expert judgment** on pedagogical values (e.g., when a flawed case is worth keeping for historical context).  
  4. **Detect all biases**—it catches structural flaws, not deep ideological assumptions.  

  ---

  ### **Why Your Habits Were Modified**  
  - *Restating in flat prose*: Integrated into **Framing Check**, but expanded to detect contrast shifts.  
  - *"Surely" as argument*: Included in **Loaded Language Scan**, but generalized to emotional rhetoric.  
  - *Implicit contrasts*: Central to **Contrast Test**, but now systematized.  
  - *What was missing*: Your habits didn’t classify cases by purpose, test stability, or handle scaffolding—leading to conflation (e.g., treating a PP as a VP).  

  ---

  ### **Application to Your Cases**  
  **Case 1: Free Will Implant**  
  - **Phase 1**: Classify as *Verdict Pump* (aims to show manipulated acts aren’t free/praiseworthy).  
  - **Phase 2**:  
    1. **Framing Check**: Restated neutrally ("Device alters decision thresholds covertly"). Verdict *survives* (many still say "not free").  
    2. **Loaded Language**: "Pride," "generously" bias toward praiseworthiness. *Fails—redesign needed*.  
    3. **Contrast Test**: Implicitly contrasts "covert manipulation" vs. "genuine agency." Fair but oversimplifies.  
    4. **Stability Test**: Reverse selfish/generous roles → verdict flips (students condemn selfish manipulation more harshly). *Unstable*.  
  - **Phase 3**: *Fails Loaded Language + Unstable*. **Not safe for exams**. Handback: You may keep it for discussion to *show* framing effects, but not to "settle" free will.  

  **Case 2: Million Clerks**  
  - **Phase 1**: Classify as *Possibility Pump* (aims to show functionalism is conceptually possible).  
  - **Phase 2**:  
    1. **Framing Check**: Neutralized ("Symbol-rewriting system produces linguistic output"). Possibility *survives* (still coherent).  
    2. **Loaded Language**: "No idea what it means" biases against understanding. *Fails—replace with "no semantic access."*  
    3. **Contrast Test**: Contrasts "syntactic processing" vs. "understanding." Fair for PP.  
    4. **Stability Test**: Vary clerks to programmers → possibility intact.  
  - **Phase 3**: *Passes after Loaded Language fix*. **Honest as PP**. Never exam-safe.  

  **Case 3: Vice-President’s Side Effect**  
  - **Phase 1**: Classify as *Verdict Pump* (aims to show side effects aren’t intentional without desire/awareness).  
  - **Phase 2**:  
    1. **Framing Check**: Restated neutrally ("Actor indifferent to known side effect"). Verdict *survives*.  
    2. **Loaded Language**: "Harm"/"help" are emotionally loaded. *Fails—use neutral terms*.  
    3. **Contrast Test**: Implicitly contrasts "intention" vs. "foresight." Fair.  
    4. **Stability Test**: Order matters (harm-first → more "intentional" judgments). *Unstable*.  
  - **Phase 3**: *Fails Loaded Language + Unstable*. **Not exam-safe**. Handback: Use in discussion to *teach instability* (e.g., Knobe effect). Decision returned to you: Is demonstrating bias worth the confusion?  

  ---

  This procedure systematizes your goals: it classifies before testing, flags exam risks, diagnoses instability, and isolates value judgments. It can be run by any teaching assistant with a timer and a checklist.
