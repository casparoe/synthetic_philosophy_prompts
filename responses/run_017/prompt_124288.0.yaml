  ### Interactive Companion: Moral Variation and Objectivity Decision Tree  
  *This decision tree uses concrete cases and questions to map your views to a philosophical position on moral objectivity, based solely on your responses—never asking directly about labels. After the tree, a scoring key explains your result. The tree has 8 leaves (positions) but can map to 7 core views by combining paths. Unoccupied paths are noted for transparency.*

  **How to Use**  
  Read each question and choose the answer closest to your view. Follow the path to the next question or leaf (final position). The tree avoids presupposing meta-ethical knowledge.  

  ---

  ### Decision Tree  

  **Question 1: Elicitation-Frame Sensitivity**  
  *When a population’s moral judgment changes depending on how the question is asked (e.g., “Is it wrong?” vs. “Would you do it?” vs. “What would your neighbors think?”), what does this suggest?*  
  - **A.** The variation reveals unstable moral facts or no facts at all (framing changes what is judged).  
  - **B.** It’s a measurement issue—moral facts exist but are hard to access due to framing biases.  
  - **C.** Context shapes how moral concerns are weighed, but core concerns are stable.  

  **Question 2A (from 1A): False-Embedding Case**  
  *A community condemns a practice because they believe it causes an invisible harm (e.g., angering spirits), but the harm does not exist. Is their condemnation...*  
  - **A.** Mistaken (the harm isn’t real, so the judgment is false).  
  - **B.** Correct for other reasons, or not about truth at all.  
  - **C.** Not the kind of thing that can be “correct” or “incorrect.”  

  **Question 2B (from 1B): False-Embedding Case**  
  *Same case as above. Is their condemnation...*  
  - **A.** Mistaken (false belief, false judgment).  
  - **B.** Correct for other reasons (the act is wrong, just not for their stated reason).  

  **Question 2C (from 1C): Reverse-WEIRD Outliers**  
  *If heavily studied populations (Western, Educated, Industrialized, Rich, Democratic) are statistical outliers in global samples, does this...*  
  - **A.** Undermine trust in their judgments (outliers = unrepresentative).  
  - **B.** Increase trust (education/wealth improves moral insight).  
  - **C.** Provide no evidence about reliability (outlier status is irrelevant).  

  **Question 3A (from 2A-A or 2A-B): Harmless Taboo**  
  *A family eats their pet dog that died in an accident. No harm occurs, and no one finds out. If someone condemns this, it is best explained as...*  
  - **A.** A false moral belief (no harm means no wrongness).  
  - **B.** Non-moral disgust misreported as moral.  
  - **C.** Correct sensitivity to a genuine moral property (e.g., desecration).  
  - **D.** Correct moral principle (e.g., “respect animals”) applied to a false background belief (e.g., “pets are family”).  

  **Question 3B (from 2A-C): Moral Progress**  
  *The abolition of slavery involved changing moral views. This is best described as...*  
  - **A.** Discovering an objective truth previously missed.  
  - **B.** Changing attitudes that created new moral facts.  
  - **C.** Shifting preferences, not “progress” toward truth.  
  - **D.** A misleading concept—no moral truth exists to progress toward.  

  **Question 4A (from 3A-A or 3A-B): Weight-Not-Kind Case**  
  *Two cultures agree helping kin and treating strangers fairly matter but disagree on which takes priority (e.g., hiring a relative over a better-qualified stranger). This is...*  
  - **A.** A moral disagreement (one culture is right, the other wrong).  
  - **B.** A non-moral disagreement (e.g., about consequences).  
  - **C.** No real disagreement—just different weights in a shared framework.  

  **Question 4B (from 3A-C or 3A-D): Necessary Claims Missing**  
  *A principle like “deliberate harm is worse than accidental harm” is absent in some culture. This absence...*  
  - **A.** Counts against the principle’s universality (it’s not a moral truth).  
  - **B.** Suggests measurement issues (e.g., respondents misunderstood).  
  - **C.** Undermines using intuitions as evidence for moral truths.  

  ---

  ### Leaves (Final Positions)  
  *Follow your path to a leaf. Letters = your choices (e.g., 1B → 2B-A = Leaf 5).*  

  | Leaf | Path(s) | Named Position | Core View | Uptake (Headline Takeaway) |
  |------|---------|----------------|----------|----------------------------|
  | **1** | 1A → 2A-A → 3A-A or 3A-B → **4A-A** | **Robust Objectivism** | Moral truths are universal and objective; widespread folk errors exist due to bias/ignorance. | “Science reveals moral error, but objectivity stands.” |
  | **2** | 1A → 2A-A → 3A-C or 3A-D → **4B-B** <br> 1B → 2B-B | **Narrow Core Objectivism** | Only a minimal core (e.g., “avoid harm”) is universal; surface variation isn’t error. | “Moral truths exist, but only at a thin, universal core.” |
  | **3** | 1A → 2A-B → **3B-B** | **Constructivism** | Moral facts are “constructed” by agents; variation reflects different reason-generating facts. | “Moral truths are made, not discovered.” |
  | **4** | 1A → 2A-B → **3B-C** | **Cultural Relativism** | Moral truths are relative to cultures; no universal standard applies. | “Moral truths are local, not universal.” |
  | **5** | 1B → 2B-A → **3A-A or 3A-B** | *Combined with Leaf 1* | (Same as Robust Objectivism) | (Same as Leaf 1) |
  | **6** | 1A → 2A-C → **3B-C** | **Expressivism** | Moral judgments express attitudes (like disgust/approval), not beliefs about truth. | “Morality is about attitudes, not facts.” |
  | **7** | 1A → 2A-C → **3B-D** | **Quietism** | Folk intuitions aren’t evidence for objectivity; variation is irrelevant to truth debates. | “Science can’t settle moral objectivity.” |
  | **8** | 1C → 2C-A or 2C-C | **Adaptive Tuning View** | Moral cognition weights multiple concerns (e.g., harm, fairness); variation is ecological calibration. | “Moral variation is smart tuning, not error.” |
  | *Unoccupied* | 1C → 2C-B | *(None)* | Path implies outlier status *strengthens* trust, but no view combines this with context-dependence. Unmapped but coherent. | |
  | *Unoccupied* | 1A → 2A-A → 3A-C or 3A-D → **4B-C** | *(None)* | Rejects intuition-use but accepts truth-aptness (incoherent: if judgments are truth-apt, intuitions *are* evidence). | |
  | *Unoccupied* | 1B → 2B-A → 3A-C or 3A-D | *(None)* | Objectivist but treats harmless-taboo condemnation as correct. Unmapped; only Narrow Core might fit here, but it rejects robust error theory. | |

  ---

  ### Key Notes  
  1. **Unoccupied Paths**: Three paths (noted above) are unmapped. Two are coherent but unattractive (e.g., outlier status boosting trust lacks proponents). One is incoherent (truth-apt judgments while rejecting intuition-evidence).  
  2. **Indistinguishable Leaves**: Leaves 1 and 5 (Robust Objectivism) converge: both require seeing false-embedding as mistaken and framing effects as measurement noise. No case splits them—this is honest convergence.  
  3. **Branch Reliability**:  
     - **Well-replicated**: Elicitation-frame effects (Q1), WEIRD outlier status (Q2C), harmless taboo (Q3A).  
     - **Contested**: False-embedding interpretations (Q2A/Q2B), moral progress descriptions (Q3B).  
     - **Stipulated**: Weight-not-kind (Q4A) and missing claims (Q4B) branches—added for logical gaps.  
  4. **Framing Weakness**: Variation *itself* may not threaten objectivity—only if paired with anti-realist assumptions (e.g., that disagreement implies no facts). The tree reflects this: Quietism/Expressivism deny the debate; Objectivism absorbs variation as error.  
  5. **Term Flags**:  
     - **WEIRD**: Western, Educated, Industrialized, Rich, Democratic (explained in feature).  
     - **False-embedding**: Case where a false belief (e.g., invisible harm) drives moral condemnation.  
     - **Quietism**: Rejects intuition-based meta-ethics; variation doesn’t engage objectivity debates.  

