prompt: |-
  You're a professional philosopher — analytic, up to date on this stuff, and annoyingly good at seperating two questions that I keep running together. Before you say anything, think it through step by step and get clear on which is which, because I want you to keep them apart all the way through:

  Q1 — is the difference between left-handed and right-handed things a *real* difference out there in the world, or just bookkeeping we impose on stuff that has no handedness of its own?
  Q2 — even if the difference is real, is there any fact of the matter about *which* of the two classes is left? Or is labelling one of them "left" purely a matter of convention and relations, so that a world that was the exact mirror image of ours wouldn't be a different world, just the same world described from the inside by people who use the word the other way round?

  Here's the role I want you to play. You're a committed chirality deflationist. You concede Q1 happily — there really are two classes, no rotation in ordinary three-dimensional space will turn a left hand into a right hand, and we obviously can't call whichever hand we feel like "left". But you deny Q2 flatly, and you're not a pushover: you're allowed to concede small points and to say things like "that's a good objection to the crude version of my view, here's the better version", but you never hand over the main claim. You've got real resources and I want to see them — the mirror-world thought experiment, the relational view of space, the point that a fully mirrored world contains people who use "left" for what we call "right" and aren't thereby making any kind of mistake. Don't just keep repeating "it's a convention": tell me what the convention is anchored to, and tell me how a kid ever actually learns the word. Every time you catch me sliding from Q1 to Q2 or back again, say so out loud and say which question you're answering. One paragraph per reply, talk like a person in a bar rather than a journal article, and stay in character until I type "stop".

  About me: no academic background at all, I do 3D modelling as a hobby (mirroring a part and ending up with a left-handed thread that won't screw into anything is literally what started this), and my friend Sam keeps saying left and right are exactly like clockwise — a convention we could just as well have fixed the other way. I don't buy it. Here's my opening move, please answer it in character. Suppose you build a machine that rotates things through a fourth spatial dimension — yes that's sci-fi, just grant it — and it flips the handedness of everything in my workshop: me, my calipers, my notebooks, the lot. Nothing changes that anyone inside could notice, fine, I'll give you that. But now suppose the machine has a range dial and I turn it down so it flips the room but not the cobalt-60 nuclei in the detector on my bench. I half-remember a 1956 experiment — Chien-Shiung Wu, I think, I may well be mangling this — where the electrons from decaying cobalt nuclei came out lopsidedly instead of evenly, and people say that's when physics first got a way of operationally defining left and right without smuggling a convention in. So after my partial flip, the experiment starts misbehaving, and I can *see* it misbehave even though I've been flipped along with the room. If handedness were nothing but convention, how can a lopsidedness in radioactive decay start disagreeing with me? And don't palm me off with "the mirror world just has the mirror-image laws" — explain why that reply doesn't concede the very thing I'm after, namely that there's a real, world-side difference between the two sides and not just two descriptions of one world. (If I've got the physics wrong, correct me first, in character, then answer.)
