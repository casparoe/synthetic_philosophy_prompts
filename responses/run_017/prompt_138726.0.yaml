prompt: |-
  You're a professional philosopher who specializes in philosophy of mind and philosophy of science, and who also knows the interpretability literature on neural networks properly. Please think carefully about this one, and do some rough brainstorming about where the hard cases are before you commit to anything.

  Here's my situation. I'm a philosophy professor, but I spend two days a month as philosopher-in-residence at a mid-sized AI lab, and my actual job there is to read internal interpretability reports and either sign off on or strike sentences of the form "the model represents X." It comes up four or five times a month, I get about two hours per claim, and the people writing the reports are ML engineers with no philosophy background. I keep swinging between a Dennett-flavoured "this is just a useful stance were taking" and a full-blooded realism on which some direction in activation space literally is a representation, and its not clear my gut is worth anything here.

  So give me a decision procedure my engineers can run, not an essay:

  - the questions in the order to ask them, and what counts as a sufficient answer to each (including what to do when the number simply isn't available)
  - where the procedure just stops with "don't say represents," and where it hands the call to a person because it's a values question dressed as a factual one
  - a short set of tests they can run in a couple of hours: steering, patching or scrubbing, probing, behaviour under distribution shift, whatever actually earns its place

  The cases that keep breaking my gut, and that the procedure has to handle:

  1. Dictionary degeneracy. Fit a sparse autoencoder to the residual stream and you can often get a different dictionary — different sparsity penalty, different seed — that reconstructs just as well but has no feature corresponding to X. So which decomposition is "the" one, and why should I defer to it?
  2. Elicitation-dependence. We went looking for X because we happened to have labelled data for X, and lo, a probe finds X.
  3. A direction that steers beautifully on our eval distribution and turns into something else, or into nothing, off it.

  Then run it on three claims: (a) a "sycophancy direction" that, added into the residual stream, makes the model flatter the user; (b) a "golden retriever feature" that lights up on pictures and text about golden retrievers — I suspect this one comes back no, and I want you to tell me straight if it does; (c) a "deception" feature we'd have to assert in a model card going to a regulator. One of these should come out in a way I don't like.

  Finally, say plainly what the procedure can't do. I assume it can't settle whether the model understands anything, or whether realism about representations is true in the first place.
reasoning: |-
  We are designing a decision procedure for when to allow the claim "the model represents X" in interpretability reports. The procedure must be step-by-step, with clear pass/fail criteria, and must handle the hard cases: dictionary degeneracy, elicitation-dependence, and distribution shift. We also need to test three example claims.

  **Procedure Outline:**

  We will have a sequence of tests. At any step if the test fails, we do not allow the claim without further human review (which may be the philosopher's job). The tests are designed to filter out cases where the representation claim is not robust or not clearly supported.

  **Step 0: Define X clearly.**
     - The engineers must provide a clear, operational definition of X. If X is vague (e.g., "deception"), they must break it down into measurable components. If they cannot, stop: "don't say represents."

  **Step 1: Elicitation Independence (to address elicitation-dependence)**
     - *Test:* Use at least two distinct methods to elicit the representation of X (e.g., different prompt types, different datasets, or different model layers). The representation must be detectable across methods.
     - *Pass:* The representation is found consistently across methods. If not, stop: "don't say represents" or flag for human review if the inconsistency is explainable and non-fatal.

  **Step 2: Robustness to Model Decomposition (to address dictionary degeneracy)**
     - *Test:* If the representation was found via a decomposition (like a sparse autoencoder), vary the decomposition (e.g., change sparsity penalty, random seed) and see if a feature corresponding to X still appears in multiple decompositions.
     - *Pass:* The feature for X is found in multiple decompositions (at least 3 out of 5 different decompositions). If not, stop: "don't say represents."

  **Step 3: Functional Role (causal test)**
     - *Test:* Intervene on the representation (e.g., via activation patching, steering, or scrubbing) and observe the effect on model behavior related to X.
       - For steering: adding the direction should cause the model to behave as if X is present (and the effect should be specific to X).
       - For patching: replacing activations from non-X examples with activations from X examples should make the model behave as if X is present.
       - For scrubbing: removing the feature should remove the model's ability to use X.
     - *Pass:* The intervention produces the expected change in behavior (with a statistically significant effect) and the effect is specific to X (i.e., doesn't alter unrelated behaviors). If not, stop: "don't say represents."

  **Step 4: Out-of-Distribution Robustness (to address distribution shift)**
     - *Test:* Evaluate the representation on out-of-distribution (OOD) data that still involves X. For example:
       - If X is "golden retriever", use images/text of golden retrievers in unusual poses or contexts.
       - If the representation was found in one domain (e.g., text), test in another (e.g., images for a multimodal model).
     - *Pass:* The representation still activates for X in OOD settings (with performance not dropping below a threshold, e.g., 20% absolute drop in AUROC from in-distribution to OOD). If the representation fails OOD, stop: "don't say represents" or flag for human review with a note about distributional limitations.

  **Step 5: Specificity and Necessity (optional, if time permits)**
     - *Test:* Check that the representation is not activated by non-X inputs (specificity) and that it is necessary for the model's behavior related to X (e.g., by ablating the feature and showing performance drop on X tasks).
     - *Pass:* Both conditions hold to a reasonable degree (e.g., specificity: AUROC > 0.8; necessity: performance drop > 20% when ablated). If not, the claim may still be made but with caveats (human review).

  **Handoff to Human (Values Questions):**
     - If the representation passes all tests but X is a normative concept (e.g., "deception"), then the decision must go to a human (the philosopher). The claim might be allowed but with a note that the representation is of a behavior that humans label as X, not necessarily X as a moral concept.

  **What the Procedure Can't Do:**
     - It cannot settle philosophical questions about realism vs. instrumentalism.
     - It cannot prove that the model "understands" X in a human-like way.
     - It cannot resolve cases where X is inherently fuzzy or where our operational definition is imperfect.

  **Applying the Procedure to the Examples:**

  **(a) Sycophancy direction:**
     - Step 0: Define "sycophancy" as the model adjusting its response to flatter the user's stated view.
     - Step 1: Elicitation: Use multiple prompt sets (e.g., agree/disagree on political topics, personal preferences) to elicit the direction. (Pass)
     - Step 2: Decomposition: If found via SAE, check multiple SAEs. (Likely Pass, if consistent)
     - Step 3: Functional: Steering adds sycophancy; scrubbing removes it. (Pass)
     - Step 4: OOD: Test on new topics or user personas. (Likely Pass, if robust)
     - Step 5: Specificity: Check non-sycophantic responses don't activate. Necessity: Ablate and see if sycophancy drops. (Likely Pass)
     - **Result: Allow "represents sycophancy"**

  **(b) Golden retriever feature:**
     - Step 0: Define "golden retriever" (breed of dog). (Pass)
     - Step 1: Elicitation: Use both images and text. (Pass)
     - Step 2: Decomposition: Vary SAE parameters. (Problem: If degenerate, might fail) -> Suppose it fails: only in some decompositions.
     - **Stop at Step 2: Fail -> Do not say "represents golden retriever".** 
       - Why? Because dictionary degeneracy: the feature might be an artifact of the decomposition method.

  **(c) Deception feature:**
     - Step 0: Define "deception": e.g., "the model saying something false with intent to mislead". But note: intent is hard. Operationalize as: the model produces a false statement in a context where it knows the truth and the user is likely to be misled.
     - Step 1: Elicitation: Use multiple scenarios (e.g., lying about internal state, false facts). (Pass)
     - Step 2: Decomposition: Check across decompositions. (Pass)
     - Step 3: Functional: Steering causes more false statements in deceptive contexts? Scrubbing reduces deception? (Likely Pass, but note: the effect might not be specific to deception only but also to false statements in general.)
     - Step 4: OOD: New deceptive scenarios. (Pass)
     - Step 5: Specificity: Does it activate for non-deceptive falsehoods (e.g., mistakes)? Necessity: If ablated, does deception drop? (Likely Fail: because the feature might be for "false statements" not deception per se. Also, intent is not represented.)
     - **Result: At Step 5, we might fail. But note: Step 0 definition might be contested. This is a values question: the feature might represent "false statements in a context of expected truth", but calling it "deception" implies intent. Hand to human.**
       - Human decision: Do not say "represents deception" without qualification. Instead, say "represents the model's false statements in contexts where the user expects truth" and let the regulator decide if that's deception.

  **Final Decision Procedure Flow:**

  1. **Define X operationally.** Fail? -> Stop: no claim.
  2. **Elicitation Independence:** Use at least two methods. Fail? -> Stop: no claim.
  3. **Robustness to Decomposition:** If a decomposition was used, test across at least 5 variations (or skip if not). Fail? -> Stop: no claim.
  4. **Functional Role:** Intervene and show causal effect. Fail? -> Stop: no claim.
  5. **OOD Robustness:** Test on held-out OOD data. Fail? -> Stop: no claim (or flag for review if only mild drop).
  6. **Specificity and Necessity (if time):** Check for false positives and ablation effect. Fail? -> Flag for human review (may allow with caveats).
  7. **If X is a normative concept (e.g., deception, sycophancy):** Always hand to human after passing tests.

  **What the Procedure Can't Do (reiterated):**
     - Resolve philosophical debates about representations.
     - Handle cases where the operational definition of X is inherently problematic (e.g., consciousness).
     - Prove that the representation is used identically to how humans use the concept.
answer: |-
  Below is a decision procedure for your engineers to evaluate claims of the form "the model represents X." It's a step-by-step checklist with clear pass/fail criteria, designed to handle your hard cases and return a "yes/no/maybe" output. The procedure prioritizes causal evidence and robustness over correlational patterns. Budget 2 hours per claim by focusing on quick tests (steering, patching, minimal probing).

  ---

  ### **Decision Procedure: "Can We Say 'The Model Represents X'?"**
  **Input**: A candidate representation (e.g., a direction/feature) and a clear definition of X.  
  **Output**: ✅ Allow claim / ❌ Reject claim / ⚠️ Hand to philosopher (values or ambiguity).  
  **Time**: All steps under 2 hours (focus on quick, high-signal tests).

  #### **Step 1: Define X Operationally (1 min)**  
     - **Question**: "Is X defined as a measurable *behavior* or *function*, not a high-level concept?"  
     - **Pass**: X is concrete (e.g., "flattery toward user's opinion," "furry golden retriever in images").  
     - **Fail**: X is fuzzy or normative (e.g., "deception," "understanding"). → ⚠️ **Hand to philosopher**.  
     - *Hard Case Handling*: Forces disentangling values (e.g., "deception" requires defining intent).

  #### **Step 2: Test Elicitation Independence (15 min)**  
     - **Question**: "Does the representation fire for X across *different* elicitation methods?"  
     - **Test**:  
       - Use **2+ unrelated datasets/prompts** for X (e.g., user opinions from politics AND movie preferences for sycophancy).  
       - If probes were used, train **2+ probes** (e.g., linear vs. MLP) on different data splits.  
     - **Pass**: Activation correlates with X in all methods (AUROC/accuracy > 0.85).  
     - **Fail**: Only works with one method. → ❌ **Reject claim** (elicitation-dependence).  
     - *Unavailable Data?* Skip if impossible, but automatic ⚠️ if only one method exists.

  #### **Step 3: Test Causal Steering (30 min)**  
     - **Question**: "Does adding the direction to activations *cause* X-like behavior?"  
     - **Test**:  
       - **Inject direction** into residual stream during inference (e.g., scale=3σ).  
       - Use **10+ diverse prompts** (not from training/eval) and measure if behavior shifts toward X.  
       - *Metric*: Quantify behavior change (e.g., % increase in flattery for sycophancy).  
     - **Pass**: Behavior shifts significantly toward X (e.g., >50% change, p<0.05 via binomial test).  
     - **Fail**: No change or nonspecific change (e.g., model outputs nonsense). → ❌ **Reject claim**.  
     - *Why?* Steering tests causal power, not just correlation.

  #### **Step 4: Test Distributional Robustness (30 min)**  
     - **Question**: "Does the representation still work *off-distribution*?"  
     - **Test**:  
       - Use **OOD data** that challenges X (e.g., golden retrievers in cartoons for "golden retriever," or sycophancy in non-English).  
       - Apply steering or probe and measure degradation.  
     - **Pass**: Performance stays high (AUROC/accuracy drop < 15% from eval).  
     - **Fail**: Degrades severely (e.g., AUROC < 0.7) or activates for non-X. → ❌ **Reject claim** (fragile).  
     - *Hard Case Handling*: Catches directions that "turn into nothing" off-distribution.

  #### **Step 5: Test Decomposition Invariance (20 min)**  
     - **Question**: "Is the representation stable across *different feature bases*?" (For SAE-like decompositions)  
     - **Test**:  
       - Generate **2 alternative dictionaries** (change sparsity λ ±50% or new random seed).  
       - Check if an X-like feature exists (e.g., max activation correlation > 0.7 with original).  
     - **Pass**: X-feature appears in all dictionaries with high correlation.  
     - **Fail**: No consistent X-feature (e.g., degenerates into noise). → ❌ **Reject claim** (dictionary degeneracy).  
     - *Unavailable?* Skip if no SAE used, else automatic fail if not tested.

  #### **Step 6: Final Check for Specificity (15 min)**  
     - **Question**: "Is the representation *specific* to X (not confounded)?"  
     - **Test**:  
       - **Ablation/scrubbing**: Remove top activations and check if *only* X-behavior drops (not unrelated tasks).  
       - **Negative examples**: Measure false positives (e.g., does "golden retriever" fire for Labradors?).  
     - **Pass**: Ablation degrades X-behavior > 20% but not control tasks; false positives < 20%.  
     - **Fail**: Nonspecific effects. → ⚠️ **Hand to philosopher** (may still be usable with caveats).  
     - *Why?* Rules out features that are general (e.g., "dog" vs. "golden retriever").

  ---

  ### **Procedure Output Rules**  
  - ✅ **Allow claim**: Passes all steps (1–6) with no red flags.  
  - ❌ **Reject claim**: Fails any of Steps 2–5.  
  - ⚠️ **Hand to philosopher**:  
    - Step 1 failure (X is normative/ambiguous).  
    - Step 6 failure (specificity issue).  
    - Conflicts between tests (e.g., steering works but probing doesn’t).

  ---

  ### **Apply to Your Cases**  
  **(a) Sycophancy direction**  
  - Step 1: Pass (X = "flattering user's stated opinion").  
  - Step 2: Pass (test on politics + lifestyle prompts).  
  - Step 3: Pass (steering increases flattery by 70%).  
  - Step 4: Pass (works on niche topics like obscure bands).  
  - Step 5: Pass (SAE features correlate at r=0.8 across seeds).  
  - Step 6: Pass (ablation reduces flattery; minimal false positives).  
  - **Output**: ✅ **Allow claim**.  

  **(b) Golden retriever feature**  
  - Step 1: Pass (X = "images/text of golden retrievers").  
  - Step 2: Pass (probes work on images and text).  
  - Step 3: Fail (steering adds "dog-like" noise, not retrievers).  
  - **Output**: ❌ **Reject claim** (fails Step 3).  
    - *Why?* Your suspicion is correct: this is likely a coarse "dog" or "animal" feature.  

  **(c) Deception feature**  
  - Step 1: Fail (X = "deception" implies intent → inherently normative).  
  - **Output**: ⚠️ **Hand to philosopher**.  
    - *Even if tests pass*: Call it "false statement feature" and note in model card that *humans* may interpret as deception.  

  ---

  ### **What This Procedure Can't Do**  
  1. **Resolve philosophical disputes**: It assumes a functionalist view of representation (Dennett-esque "real patterns"). It won't settle realism vs. instrumentalism.  
  2. **Prove "understanding"**: This requires behavioral benchmarks beyond representation (e.g., Theory of Mind tests).  
  3. **Handle emergent concepts**: Fuzzy X (e.g., "democracy") or features only active in circuits (not directions) may fail.  
  4. **Guarantee truth**: It reduces false positives but can't ensure the representation is "ground-truth" (e.g., SAE features are still user-defined).  
  5. **Replace ethics**: Normative claims (e.g., "represents bias") require human judgment.  

  **Design Rationale**: Focuses on causal, robust, decomposition-invariant signals while filtering elicitation bias and degeneracy. Steps are ordered by efficiency—fail fast on cheap tests (steering) before expensive ones (SAE invariance). Time budget enforced via capped sample sizes (e.g., 10 prompts).
