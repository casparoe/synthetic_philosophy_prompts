answer: |-
  ## Metaethics Final Examination Question
  **Time Allowed:** 90 minutes  
  **Word Limit:** 1,200 words  
  **Value:** 20 marks  

  **Instructions:**  
  Answer the following question clearly and concisely. Your response must present a structured argument, not a summary of readings or historical positions. Engage directly with the stipulated case and the philosophical issues it raises. Do not merely report what authors have said; construct and defend your own reasoned position. You may refer to standard argument types (e.g., tracking vs. independence debunking, third-factor, companions in guilt) where relevant, but attribution to specific texts or scholars is neither required nor rewarded. Focus on the philosophical substance.

  **Question:**  
  Consider a community ("the Refined") whose initial moral judgments arose solely through evolutionary selective pressures favoring fitness-conducive social coordination. These pressures were entirely indifferent to moral truth. Subsequently, the Refined institute a rigorous, multi-generational filtering practice applied to these judgments. This practice is purely internal and procedural:  
  1.  Occurrent moral judgments are recorded.  
  2.  Any judgment contradicting another judgment the community is deeply unwilling to relinquish is discarded.  
  3.  Any judgment that flips when the same case is redescribed (e.g., framing effects) is discarded.  
  4.  The surviving judgments are generalized into principles.  
  5.  These principles are used to revise further occurrent judgments.  
  This cyclical process repeats over generations. The filter *never* consults the external world and contains *no* premises about the nature of moral facts. The resulting set of judgments is perfectly coherent, stable under reflection and redescription, and forms a systematic normative framework.  

  **(A)** Does membership in this filtered, coherent set give the Refined:  
  (i) *A reason to think* their moral judgments are true?  
  (ii) *A reason that a proponent of an evolutionary debunking argument (EDA) must take seriously* as a defeater for their argument?  
  In answering (A), you **must** explicitly distinguish the two fundamental forms an EDA can take: one concerning whether our judgments *track* moral truth, and one concerning whether moral facts *explain* why we hold the judgments we do. Explain the relevance (or irrelevance) of the Refined's filter to each form. (10 marks)  

  **(B)** Suppose the debunker retreats, restricting their EDA to target only *unreflective, affect-driven* moral judgments, exempting the Refined's filtered outputs as products of "careful reasoning." What must the debunker establish for this restriction to be non-arbitrary? Does this restriction survive the observation that the Refined's *capacity for practical reasoning itself*, and the initial intuitive judgments it operates upon, are evolutionary products of the same selective history that shaped the unfiltered judgments? (6 marks)  

  **(C)** Verdict: If you had to make your metaethical position consistent in light of the strongest challenge posed by EDAs (considering parts A and B), which *single premise* – common to *both* forms of EDA or crucial to the one you find most compelling – would you relinquish? Briefly state what significant cost this concession would impose on your *first-order ethical commitments* (e.g., the objectivity of specific judgments, the authority of reason, the possibility of moral knowledge). (4 marks)  

  ---

  ## Model Answer (Approx. 800 words)

  **(A)** The Refined's filtered moral judgments provide no compelling reason to think they are true (i), and offer no serious defeater against the most potent form of EDA (ii). This hinges on distinguishing the two EDA structures.

  The first EDA form argues that the evolutionary origins of our moral judgments reveal they were shaped by selective pressures indifferent to moral truth, undermining any claim that these judgments reliably *track* moral facts. The Refined's filter *potentially* addresses this "tracking" concern. By enforcing coherence, stability, and systematization, the filter introduces elements (logical consistency, resistance to bias) often associated with reliable belief formation. While coherence alone doesn't guarantee truth, it could be argued the filter makes the resulting judgments *more likely* to track truth than the raw, unfiltered intuitions. It demonstrates that reasoning *can* refine outputs beyond their causal origins. Thus, the Refined *might* have *some* reason (i) – albeit defeasible – to think their filtered judgments track truth better than their ancestors' raw intuitions. Consequently, a debunker relying *solely* on the tracking argument *might* need to take this refined coherence seriously as a partial defeater (ii) for the claim that *all* current outputs of the moral faculty are untracked.

  However, the second, more fundamental EDA form is the *explanatory* or *modal* version. It contends that the *best explanation* for why we hold the very moral beliefs we do, even after refinement, makes no essential reference to moral facts themselves. Evolutionary pressures explain the content and persistence of our core intuitions; subsequent reasoning merely organizes and refines these given inputs. Crucially, the filter is *purely internal* and *world-insulated*. It operates solely on the community's occurrent judgments and logical relations between them, never checking against moral reality. Its inputs are the evolutionarily shaped intuitions; its outputs are systematized versions of those inputs. Therefore, the filter does nothing to show that the *content* of the surviving judgments – however coherent – was shaped *because* it corresponds to mind-independent moral facts. The best explanation for why *this specific coherent system* emerged, rather than another logically possible one, likely still rests on the contingent evolutionary starting point and the procedural rules of the filter, not on moral truth playing an explanatory role. For (i), this means the coherence of the system gives the Refined no *additional* reason to think their judgments are *true* (as corresponding to reality), only that they are *internally consistent*. For (ii), this filter is *inert or worse* against the explanatory EDA. It exemplifies the very process the explanatory debunker highlights: reasoning working on, and constrained by, materials supplied by non-truth-tracking origins, without any independent epistemic anchor in the moral facts. The debunker can readily concede the coherence while maintaining it's a coherence of beliefs whose ultimate source provides no reason to think they reflect reality.

  **(B)** For the debunker's restriction (targeting only unreflective judgments) to be non-arbitrary, they must establish a *discontinuity* or *epistemic firewall* between the outputs of unreflective intuition and the outputs of reasoning. They must show that the reasoning process, *by its very nature*, either (a) accesses a truth-tracking or fact-sensitive capacity fundamentally different in origin from intuition, or (b) purges *all* significant influence of the suspect evolutionary origins from the final judgments.

  This restriction *fails* to survive the observation that the reasoning capacity itself, and the intuitive inputs it refines, are evolutionary products. The debunker's challenge is *global*: it calls into question the reliability of the entire cognitive apparatus dedicated to moral judgment, precisely because that apparatus was selected for fitness, not truth. Reasoning is part of this apparatus. Its algorithms (e.g., logical deduction, coherence-seeking) plausibly evolved for social coordination and planning, not for detecting Platonic moral truths. Crucially, it operates *on* the very intuitive inputs produced by the suspect system. Reasoning can detect contradictions *between* intuitions or generalize them, but it cannot generate fundamentally *new* moral content or independently *validate* the truth-conduciveness of its starting points against the world (as the filter's insulation shows). If the initial inputs are systematically distorted or arbitrary from a moral truth perspective (as the EDA alleges), and the reasoning process is merely a tool for organizing these inputs more efficiently and stably, the outputs remain "tainted" by their origins. The continuity between the source of the intuitions and the source of the reasoning faculty means the restriction is arbitrary; it exempts the products of one part of the suspect system without justification, while condemning another.

  **(C)** To achieve consistency in light of the explanatory EDA's potency, I would relinquish the premise that **moral facts are causally inert, non-natural properties that play no role in the best explanation of our moral beliefs**.

  This concession imposes a significant cost on first-order ethics: it forces me towards a form of *naturalism* or *constructivism*. I must accept that moral facts either (a) are reducible to natural facts (e.g., about well-being, social function, or rationality) that *could* plausibly have influenced our evolutionary development (a "third-factor" move), or (b) are constituted by our rational activities (like the Refined's filtering), meaning their authority stems from the process, not from independent truth-tracking. This costs the strong objectivity I might wish to affirm. For instance, I can no longer straightforwardly claim that torturing innocents for fun is wrong *in a way entirely independent of any facts about minds, societies, or evolution*; its wrongness must be grounded in some natural feature we *could* have evolved to detect or some feature constituted by our deepest rational commitments. This makes moral truth contingent in a way robust non-naturalism denies.

  ---

  ## Marking Scheme (5 x 4 marks = 20 marks)

  1.  **Distinguishes Tracking vs. Explanatory EDA & Filter's Impact:**  
      *   **Must Hit:** Clearly defines the Tracking EDA (focus on reliability of belief-forming process) and the Explanatory EDA (focus on absence of moral facts in the best explanation of belief content). Accurately states that the filter *potentially* mitigates the Tracking concern via coherence/reliability arguments, but is *irrelevant or detrimental* to the Explanatory concern because it's world-insulated and processes tainted inputs.  
      *   **Common Mistake:** Conflating the two EDA types; arguing coherence obviously helps against "debunking" generally; claiming the filter *does* provide an external check or access to facts.

  2.  **Explains Why Coherence Doesn't Defeat Explanatory EDA:**  
      *   **Must Hit:** Explicitly argues that the filter's internal coherence-building does nothing to show the *content* of the coherent system is explained by, or corresponds to, mind-independent moral facts. Emphasizes the inputs are evolutionarily shaped, the process is world-insulated, and the "best explanation" for the specific coherent output remains evolutionary/psychological, not moral.  
      *   **Common Mistake:** Assuming coherence is intrinsically truth-conducive for moral beliefs; claiming systematicity implies objectivity; failing to separate justification *within* the system from justification *of* the system.

  3.  **Analyzes the Restriction's Failure (Non-Arbitrariness & Continuity):**  
      *   **Must Hit:** Correctly identifies that the debunker needs to show a *discontinuity* (epistemic firewall) between intuition and reasoning. Forcefully argues the restriction fails because reasoning capacity and its inputs share the same evolutionary origins, so reasoning cannot purge the fundamental epistemic taint or access an independent epistemic ground. Reasoning organizes, not validates, the suspect inputs.  
      *   **Common Mistake:** Accepting the restriction at face value; arguing reasoning is "innate" therefore reliable; focusing only on inputs without addressing the reasoning faculty's own origins; invoking reasoning's formality without addressing content origins.

  4.  **Identifies the Premise to Relinquish:**  
      *   **Must Hit:** Names a *single, specific premise* central to the EDA dialectic (or its non-naturalist target) that must be abandoned for consistency, demonstrating understanding of the crux. (E.g., Causal inertness of non-natural facts, Implausibility of tracking non-natural facts, Global reliability challenge to evolved moral faculty, Explanatory irrelevance premise).  
      *   **Common Mistake:** Vague statement ("give up realism"); choosing an irrelevant premise; stating a consequence instead of a premise; choosing a premise that doesn't resolve the tension.

  5.  **States a Plausible Cost to First-Order Ethics:**  
      *   **Must Hit:** Clearly articulates a significant, non-trivial consequence for normative ethics or the nature of moral authority resulting from relinquishing the identified premise. (E.g., Abandoning robust non-naturalist objectivity, Accepting naturalist reduction, Embracing constructivism, Conceding contingency in moral truth). Link to a specific first-order commitment (e.g., the unshakeable wrongness of torture).  
      *   **Common Mistake:** Stating a metaethical cost only (e.g., "I have to be a naturalist"); giving an unrealistically minor cost; failing to link the metaethical shift to normative implications; being overly vague.

  **Calibration Note (A vs. B at the Margin):**  
  An **A answer** will seamlessly integrate parts A and B, demonstrating that the core, inescapable force of the EDA is the *explanatory challenge* (part A), and that the *continuity argument* decisively undermines the debunker's retreat (part B), leading inevitably to the need for a significant concession (part C). It will explicitly frame the filter as *exemplifying* the problem for the explanatory EDA, not solving it. A **B answer** will likely recognize the distinction between tracking and explanatory arguments and the filter's limitations, and grasp the continuity problem, but may not as clearly articulate *why* the explanatory challenge is deeper and untouched by coherence, or might state the cost in part C less precisely or forcefully. The B answer might treat the two EDA forms as equally significant or miss the full implications of the continuity argument for the global nature of the challenge.
