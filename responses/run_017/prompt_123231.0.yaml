answer: |-
  ### Philosophical Foundations and Distinctions
  In constructing this procedure, I foreground **mechanism** as the invariant set of entities and activities that produce the anomaly, suppressible by a single intervention. Key load-bearing distinctions:  
  1. **Mechanism vs. Trigger**: Mechanisms are persistent faults (e.g., lens scratch); triggers are conditions that activate them (e.g., lighting angle).  
  2. **Level Relativity**: Mechanisms exist at specific levels (sensor, preprocessing, model, actuator). The engineer **fixes the level at Step 1** based on alarm signature and past fixes, avoiding level-crossing ambiguities.  
  3. **Intervention as Epistemic Anchor**: Sameness is tested by whether one intervention suppresses both alarms.  

  Collapsed for usability:  
  - **Causal Chains**: Treated as distinct mechanisms unless a root cause subsumes both (handled in Step 4).  
  - **Drift**: Binary thresholded via similarity to past fixes (no continuous judgments).  
  - **Non-Permitted Interventions**: Replaced by thought experiments using logs, diagnostics, and past tickets.  

  Judgment is bottom-up: engineers decide with escalation to the reliability lead for high-impact or underdetermined cases.  

  ---

  ### Procedure: Mechanism Sameness Triage (20 mins)  
  **Input**: Two alarms (A and B).  
  **Output**: One label: {same mechanism; different mechanisms; same mechanism, different trigger; underdetermined}.  
  **Tools**: Alarm logs, embedding visualizations, past tickets, basic diagnostics (no line stops/model changes).  

  #### Step 1: Fix the Mechanism Level (3 mins)  
  - **Action**: Inspect alarm signatures (frame, confidence score, metadata). Assign a level:  
    - *Sensor*: Raw input anomalies (e.g., lens, lighting).  
    - *Preprocessing*: Image transformations (e.g., resizing artifacts).  
    - *Model*: Confidence shifts (e.g., drift).  
    - *Actuator*: Output actions (rare; default if others excluded).  
  - **Rule**: Start at the level most implicated in past tickets for similar signatures. If unclear, use sensor (most common). Record level.  
  - **Judgment**: Engineer chooses; escalate only if level ambiguity causes conflict.  

  #### Step 2: Context Comparison (4 mins)  
  - **Action**: For A and B, list:  
    - Environmental factors (temp, humidity, shift change).  
    - Recent changes (firmware, maintenance).  
    - Physical state (lens cleanliness, sensor alignment—via logs/diagnostics).  
  - **Tests**:  
    - If contexts **match** (≥90% overlap) AND embeddings are **similar** (cosine sim ≥0.85), tentatively label **same mechanism**. Proceed to Step 5.  
    - If contexts **differ** OR embeddings **dissimilar** (cosine sim ≤0.6), proceed to Step 3.  
    - Else, proceed to Step 3.  

  #### Step 3: Intervention Thought Experiment (5 mins)  
  - **Action**: Identify a plausible intervention for A (e.g., "clean lens" for sensor-level scratch).  
  - **Test**: Would this intervention *also* suppress B?  
    - **Yes** → Proceed to Step 4 (same mechanism, check triggers).  
    - **No** → Proceed to Step 4 (different mechanisms unless co-occurring).  
    - **Unknowable** → Label **underdetermined** if no data exists; else use proxies:  
      - Past tickets: Did this fix work for similar signatures?  
      - Diagnostics: If A’s lens is dirty but B’s is clean, "clean lens" won’t fix B → **different mechanisms**.  
  - **Constraint**: For non-permitted interventions (e.g., rollback firmware), use logs: E.g., if Plant 4’s firmware update caused A, and B occurred post-update, assume rollback *would* fix both.  

  #### Step 4: Trigger and Co-Occurrence Check (5 mins)  
  - **Action**: Assess if A and B:  
    - Share triggers (e.g., both fired at 30°C).  
    - Co-occur temporally/spatially (e.g., same line within 5 mins).  
  - **Tests**:  
    - **Same intervention works (Step 3), but contexts differ** → **same mechanism, different trigger**.  
    - **Co-occurring alarms with different signatures**:  
      - If suppressing A *would* suppress B (e.g., A is sensor fault corrupting B’s input), → **same mechanism** (root cause).  
      - If not (e.g., independent faults), → **different mechanisms**.  
    - **Two mild triggers (e.g., temp + shift change)**:  
      - If one intervention (e.g., "cool camera") suppresses both → **same mechanism**.  
      - Else → **different mechanisms** or **underdetermined**.  
  - **Drift Handling**: If signature resembles past fixed alarm:  
    - Same intervention worked before and context matches → **same mechanism**.  
    - Context diverges (e.g., new temperature range) → **same mechanism, different trigger**.  
    - No data → **underdetermined**.  

  #### Step 5: Final Label and Escalation (3 mins)  
  - **Action**: Assign label from Steps 2-4.  
  - **Judgment Call**: If tests conflict or data is sparse, label **underdetermined**. Escalate to reliability lead if:  
    - >2 plants affected.  
    - Downtime >4 hours.  
    - Past escalation precedents exist.  
  - **Output**: One of the four labels.  

  ---

  ### Case Applications  
  **(1) Plants 4 and 11: Same visual pattern post-firmware update.**  
  - **Step 1**: Level = model (signature: model confidence shift; firmware is software-level).  
  - **Step 2**: Contexts match (firmware update); embeddings similar. Tentative same mechanism.  
  - **Step 3**: Intervention "roll back firmware" would suppress both (inferred from logs).  
  - **Step 4**: No trigger difference or co-occurrence issue.  
