prompt: |-
  I sit on the committee drafting the ethics guidance for a hospital's preconception and prenatal counseling service — the clinic where prospective parents arrive with a known genetic risk, an abnormal screen, a failed IVF cycle, or simply the question of whether to try at all. Counselors there must say something actionable, inside a consultation, to people who share no particular metaphysics of merely possible people. Before I let any account of the morality of creating people serve as the moral backbone of that guidance, I want to know what I should be asking of it.

  Write me the specification. What must an adequate theory of whether, when, and whom to bring into existence be able to do, if it is to be good enough to generate case-level advice in a counseling room? For each requirement, give the case or consideration that earns it its place on the list. The following are the cases our committee actually argues over; use them, and supply your own wherever a requirement needs a sharper test.

  1. *The delayed cycle.* A couple can conceive this month, with a high chance of a child who will have a painful early-onset condition but a life that child will on balance be glad to have, or wait one cycle and conceive a different child who will very likely not. One person either way; different person.
  2. *The replacement.* Terminate at twelve weeks and re-conceive. The first child's life would have been worth living, but clearly worse than the second's.
  3. *The last embryo.* The only viable embryo will produce a child whose life is predicted to be barely worth living. The alternatives are no child, or adopting a child who already exists.
  4. *The coin flip.* Conceiving now yields, with equal probability, a life of unusual flourishing or a life of severe suffering ending early. On any additive reckoning the expectation is comfortably positive.
  5. *The late-onset result.* A screen shows a condition that will not appear until the person is forty and will then cut short an otherwise good life — a life that the person, once existing, will almost certainly say was worth living.
  6. *The grievance.* The grown child of a parent who knew the risk says: you harmed me by creating me. Is there a coherent complaint here, against whom, and what would count as redressing it?
  7. *The exit corollary.* A patient already exists in the room. If coming into existence is always a net harm, ceasing to exist looks like a net benefit, and a theory that affirms the first while denying the second owes me the difference in principle rather than by stipulation.
  8. *The paused mind.* A person whose existence can be suspended and later resumed — a digital person, or a temporarily suspended one. Here the relevant absence is interruption, not never-having-been. Does the asymmetry between the absence of suffering and the absence of enjoyment survive when non-existence is reversible? This case should force a theory to say whether it is fundamentally about lives, about subjects with futures, or about states of the world.
  9. *The roll-up.* If each act of creation is a harm of modest size, the sum over everyone now alive is enormous and the end of sentient life would be an enormous improvement. Relatedly: a vast number of barely-worth-living lives against a small number of excellent ones, and a slow decline in quality of life across generations that no individual ever notices.

  Some of what people demand in this area is a genuine desideratum and some is the prejudice of a camp. Separate them. In particular, tell me the status of each of the following: that a theory must not imply extinction is a great improvement; that it must not imply any existing person's death is a benefit to them; that it must respect the person-affecting thought that morality concerns improving the lives of people who will exist rather than adding good lives; that it must still be able to condemn creating a life not worth living; that it must still permit creating the lives people ordinarily do create; that it must handle uncertainty, and must say whose standard of worth-living governs — the future person's anticipated own judgment or some external list, with the complication that people often report their own lives as better than observers predict; that it must yield advice without anyone computing total welfare; that its verdicts must not flip on arbitrarily small changes in probability or magnitude; that it must order populations without cycles; that it must be able to hold ordinary pediatric and obstetric care coherent for the practitioners who apply it; and that it must either say something articulate about funding fertility treatment, prenatal screening programs, and pronatalist subsidies, or explain why silence is correct.

  Also give me the hardest part. First: a requirement that the asymmetry be explained rather than asserted — state in your own terms what the asymmetry claims about the four cells of presence and absence of suffering and enjoyment, and say what would have to be true for its rationale to generalize to interrupted existence, to non-human animals, and to minds whose entire life we can specify in advance. Second: mark which requirements are non-negotiable for my purpose and which are negotiable. Third: identify any subset of the requirements you believe cannot be jointly satisfied, and say why — if the list is itself a result, I want that stated plainly. Fourth: tell me which single requirement does the most work in excluding otherwise popular candidates, and, if nothing on offer satisfies the non-negotiable core, what the guidance should say instead.

  Close with a brief scorecard — a few lines each, no more — for: the asymmetry itself; the person-affecting restriction; straightforwardly additive total views; threshold or critical-level views; and the principle that one ought to select, among possible children, the one with the best expected life. Keep the weight on the criteria and their motivating cases rather than on the scoring, and argue from the cases rather than from what anyone has published: assume no library.
reasoning: |-
  Okay, the user is on a committee drafting ethics guidance for a prenatal counseling service. They need a specification for an adequate moral theory that can handle real-world cases. Let me start by understanding the key requirements from their scenarios.

  First, the cases provided cover a range of dilemmas: delayed conception, termination and replacement, last embryo decisions, uncertainty in outcomes, late-onset conditions, grievances from children, implications of existence as harm, reversible existence, and aggregate effects. Each case tests different aspects of a theory.

  The user wants to know what an adequate theory must do. So, I need to extract requirements from each case. For example, the Delayed Cycle requires handling different possible persons. Replacement needs comparing lives of different individuals. Last Embryo involves alternative actions like adoption. Coin Flip tests uncertainty. Late-Onset addresses future harm despite overall positive life. Grievance examines harm claims from existence. Exit Corollary links creation to cessation. Paused Mind challenges irreversibility. Roll-Up deals with aggregation and extinction implications.

  Then, there are additional demands: avoiding extinction as an improvement, not endorsing death as a benefit, respecting person-affecting views, condemning lives not worth living, permitting ordinary creation, handling uncertainty, determining whose standard to use, avoiding welfare calculations, not flipping on small changes, no cycles in ordering, coherence with existing care, and addressing policy funding.

  I need to evaluate which of these are genuine requirements versus biases. For instance, avoiding extinction is a common intuition but might not be logically necessary. The person-affecting restriction is important but may conflict with non-identity problems. Theories must condemn creating miserable lives but allow typical ones. Uncertainty is practical. Standards of a good life should consider the individual's perspective. Policy implications are necessary for real-world application.

  The asymmetry explanation is crucial: why preventing suffering outweighs creating happiness. This needs to hold in reversible scenarios. Non-negotiable requirements include handling different possible persons, comparing lives, action guidance under uncertainty, condemning bad lives, coherence with care, and addressing grievances. Negotiable might be aggregation rules or specific policy stances.

  Identifying conflicts: person-affecting views struggle with different possible persons and aggregation. Asymmetry might conflict with reversible cases. Additive views face the Roll-Up problem. Threshold views might not handle uncertainty well.

  The hardest requirement is probably the asymmetry because it's foundational but hard to justify beyond intuition. If no theory satisfies all, the guidance should focus on harm prevention, individual standards, transparency, and supporting existing care practices.

  Summarizing scorecards: asymmetry is intuitive but lacks a solid rationale. Person-affecting is intuitive but too restrictive. Additive views are clear but lead to extinction conclusions. Critical-level avoids extinction but sets arbitrary thresholds. Best-expected-life avoids harm but may lead to selection issues.

  The user's deeper need is practical guidance amid theoretical limitations. They need actionable advice that's ethically defensible without requiring counselors to resolve philosophical debates. Emphasizing harm prevention, patient autonomy, and practical support makes sense.
answer: |-
  Here is the specification for an adequate theory of procreative morality, derived from your cases and requirements. It identifies what the theory *must* accomplish to be action-guiding in the counseling room, why each requirement is non-negotiable (or negotiable), and where tensions exist.

  **Core Requirements (Non-Negotiable for Clinical Action-Guidance):**

  1.  **Handle Different Possible Persons:** Must assign moral valence to creating *specific future individuals* with different expected lives, not just "a child" generically. *Earned by: Delayed Cycle, Replacement.* (Failure here renders the theory useless for timing or selection decisions).
  2.  **Compare Non-Identical Lives:** Must compare the *expected value* (however defined) of lives led by different possible individuals, even when both lives are "worth living." *Earned by: Replacement, Last Embryo (vs. adoption), Roll-Up.* (Essential for choosing between distinct futures).
  3.  **Provide Action Guidance Under Uncertainty:** Must yield clear advice when outcomes are probabilistic, without relying on computationally infeasible welfare sums. *Earned by: Coin Flip, Late-Onset Result.* (Counselors face uncertainty constantly).
  4.  **Condemn Creating Predictably Miserable Lives:** Must robustly forbid creating a life predicted to be net negative *for the person living it*. *Earned by: Last Embryo (if barely worth living tips negative), Grievance.* (Foundation of preventing clear harm; aligns with core medical ethics).
  5.  **Permit Creating Ordinarily Good Lives:** Must not prohibit creating lives that are predictably net positive and fall within the normal human range. *Earned by: Delayed Cycle (healthy child), Last Embryo (healthy embryo), general practice.* (Otherwise, the guidance is nihilistic and rejects human existence).
  6.  **Resolve the Grievance:** Must provide a coherent account of whether creating someone in a harmed state *is* harming them, who is responsible, and what (if anything) constitutes redress. *Earned by: Grievance.* (Addresses a real-world ethical complaint).
  7.  **Cohere with Existing Care:** Must not render standard pediatric or obstetric care (e.g., life-saving treatment for a disabled infant, prenatal care) incoherent or immoral. *Earned by: Grievance, Exit Corollary, Late-Onset Result.* (Practical necessity for practitioners; avoids ethical schizophrenia).
  8.  **Specify the Standard of "Worth Living":** Must state whose judgment governs – the anticipated future person's own assessment (with its resilience bias) or an external standard – and justify why. *Earned by: Late-Onset Result, Grievance (retrospective vs. prospective), Last Embryo.* (Crucial for defining harm/benefit thresholds).
  9.  **Avoid Flip-Flopping on Small Changes:** Verdicts must be robust and not reverse based on arbitrarily small differences in probability or welfare magnitude. *Earned by: Coin Flip (edge of positive expectation), Late-Onset (severity/timing), Roll-Up (marginal declines).* (Needed for stable, reliable advice).

  **Important But Negotiable Requirements:**

  10. **Address Aggregate Effects:** Should provide a coherent stance on whether creating vast numbers of barely-positive lives is better/worse than fewer excellent ones, and on the "Roll-Up" extinction implication. *Earned by: Roll-Up.* (Clinically less urgent than individual cases, but philosophically weighty).
  11. **Address Policy Implications:** Should either offer guidance on funding fertility treatment/screening/subsidies *or* clearly explain why such decisions fall outside its scope. *Earned by: Last Embryo (IVF cost?), Replacement (screening access), Roll-Up (subsidies).* (Policy relevance is important but distinct from individual counseling).
  12. **Respect Person-Affecting Intuition (PI):** Should ideally accommodate the intuition that morality primarily concerns making things better/worse *for people who exist or will exist*. *Earned by: Grievance (direct harm), Delayed Cycle (affecting future people).* (Deeply intuitive, but strict PI struggles with Cases 1 & 2).
  13. **Avoid Endorsing Extinction/Death as Benefits:** Should not straightforwardly imply that human extinction or an existing person's death is a great benefit. *Earned by: Roll-Up, Exit Corollary.* (Strong common-sense aversion; but *requiring* this may force theoretical contortions).

  **The Asymmetry Explained (The Hardest Part):**
  *   **The Claim:** It is wrong to create a life containing suffering (S) *even if* it also contains enjoyment (E), but it is *not* wrong to *omit* creating a life that would contain E *without* S. Absence of S (in non-existence) is good; absence of E (in non-existence) is *not* bad.
  *   **Four Cells:**
      *   Presence of S: Bad (Creates a complaint).
      *   Presence of E: Good (But no duty to create it).
      *   Absence of S (in non-existence): Good (No complaint possible).
      *   Absence of E (in non-existence): Neutral (No complaint possible).
  *   **Generalization Test:** For the rationale to generalize to *Paused Mind*, non-humans, or fully specifiable minds, it must hinge on **irreducible harm imposition**. Creating a subject *imposes* suffering on them against their non-existent will, while failing to create E merely *withholds* a benefit from no one. The "no subject to harm" in non-existence is key. If existence is reversible (*Paused Mind*), the asymmetry weakens: suspending existence *prevents* future E but *avoids* future S, and the rationale for prioritizing avoiding S over providing E becomes less clear-cut. It forces the theory to show if the asymmetry is fundamental to *subjects* or to *states*.

  **Conflicts and Tensions:**

  1.  **Person-Affecting Restriction (PI) vs. Different Possible Persons & Aggregation:** Strict PI struggles profoundly with Cases 1 & 2 (Delayed Cycle, Replacement) because neither choice makes a *particular* future person worse off than they *would have been* – each choice creates a *different* person. PI also struggles with Roll-Up aggregation. A theory solving Cases 1 & 2 almost certainly must relax strict PI.
  2.  **Asymmetry vs. Paused Mind & Positive Expectation:** The asymmetry forbids creating lives with any S, even if net positive. This clashes with *Coin Flip* (positive expectation) and *Delayed Cycle* (healthy child has S). Most theories reject the pure asymmetry for net-positive lives. It also struggles to explain why creating net-positive lives is *permitted* but not *required*, and why preventing S via non-creation is mandated but providing E is not. *Paused Mind* exposes this tension further.
  3.  **Condemning Miserable Lives vs. Avoiding Extinction Implication:** Additive total views easily condemn miserable lives but imply the Roll-Up extinction is best. Non-additive views (thresholds, critical levels) avoid extinction but risk setting arbitrary lines for condemning creation.

  **The Most Exclusionary Requirement:** **Handling Different Possible Persons (Requirement 1)**. Many popular theories (especially strict Person-Affecting views and some versions of the Asymmetry) founder here, unable to explain why creating Child A (with condition) now is worse than creating Child B (healthy) later in *Delayed Cycle*, or why *Replacement* is permissible/impermissible, since neither harms a specific future person. This requirement forces the theory beyond comparing states of the world for fixed populations.

  **If No Theory Satisfies the Non-Negotiable Core:** The guidance should:
  1.  **Prioritize Harm Prevention:** Focus on robustly avoiding creating lives predicted to be net negative (Requirement 4).
  2.  **Defer to Individual Standard:** Use the future person's anticipated own judgment as the primary (though fallible) standard for "worth living" (Requirement 8), emphasizing resilience but acknowledging severe suffering.
  3.  **Embrace Pluralism & Transparency:** Acknowledge deep philosophical disagreements on other points (like Different Possible Persons). Counselors should present options, explain relevant ethical tensions transparently (e.g., "Choosing to wait means a different, likely healthier child exists; some see this as important, others focus only on whether a created child has a good life"), and support autonomous decision-making.
  4.  **Anchor in Existing Care:** Ensure advice coheres with the fundamental values of medicine and existing care practices (Requirement 7).

  **Brief Scorecard (Against Requirements 1-9 & Core Demands):**

  *   **The Asymmetry (Pure Form):**
      *   *Strengths:* Easily condemns miserable lives (4), explains Grievance as harm (6), avoids requiring creation for E (5, negotiable 13).
      *   *Weaknesses:* Fails Different Possible Persons (1) & Comparing Lives (2) (can't distinguish Replacement), forbids creating *any* life with suffering (violates 5 - e.g., Delayed Cycle healthy child), struggles horribly with Uncertainty (3 - Coin Flip positive expectation is forbidden), incoherent with care (7 - saving lives imposes suffering), struggles with Paused Mind.
  *   **Person-Affecting Restriction (Strict):**
      *   *Strengths:* Intuitive link to harm/benefit for individuals (6, 4 partially), respects PI intuition (negotiable 12), avoids extinction implication (negotiable 13).
      *   *Weaknesses:* Fails catastrophically at Different Possible Persons (1) & Comparing Lives (2) (Delayed Cycle, Replacement are morally neutral), struggles with Late-Onset (harm distant), struggles with Grievance (didn't make *me* worse off?), may struggle to condemn clearly miserable lives if no alternative person benefits (4).
  *   **Straightforwardly Additive Total Views (Classical Utilitarianism):**
      *   *Strengths:* Clear on Different Possible Persons (1), Comparing Lives (2), Uncertainty (3 - maximize expectation), Roll-Up aggregation (10).
      *   *Weaknesses:* Fails to condemn creating barely-worth-living lives if they add net positive (violates 4 - Last Embryo), implies extinction is best (violates negotiable 13), requires impossible welfare sums (violates "no computing total welfare" demand), may flip on small changes near zero (9), incoherent with care if saving life reduces total welfare (7).
  *   **Threshold/Critical-Level Views:**
      *   *Strengths:* Can condemn miserable lives below threshold (4), permit ordinary lives above (5), avoid extinction implication if critical level >0 (negotiable 13), can handle Different Possible Persons (1) & Comparing Lives (2) above threshold.
      *   *Weaknesses:* Threshold setting is arbitrary (why *here*? - 4, 5, 8), verdicts can flip dramatically near threshold (9), struggles with Coin Flip uncertainty if expectation straddles threshold (3), may struggle to explain Grievance if life is above threshold (6).
  *   **"Select Child with Best Expected Life":**
      *   *Strengths:* Excellent on Different Possible Persons (1), Comparing Lives (2), Uncertainty (3), clear action guidance, permits ordinary creation (5), avoids creating worst lives (4 partially).
      *   *Weaknesses:* May demand excessive selection/savior siblings (policy tension 11), struggles with Grievance if life is good but not the best possible (6), doesn't inherently condemn creating a miserable life if it's the only option (4 - Last Embryo if barely positive), may conflict with Roll-Up if selecting fewer excellent lives over many good ones (10), requires defining "best life" (8).

  This specification reveals the deep tension at the heart of procreative ethics: balancing the intuition that we shouldn't harm anyone by creating them, with the reality that most choices involve bringing different possible people into existence, where concepts of "harming *them*" become elusive. No existing theory flawlessly navigates all cases, making transparency about the limitations and foundational conflicts essential for ethical counseling.
