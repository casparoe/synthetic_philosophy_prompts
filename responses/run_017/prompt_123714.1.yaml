prompt: |-
  I write a fortnightly column for a science-and-technology magazine about ideas that escape their home discipline, and part of my job is vetting the op-eds, book excerpts and embargoed press releases we run. A few times a month something crosses my desk in which a source — a theoretical physicist, an AI researcher, a legal theorist, a central banker with a taste for big ideas — reaches for Gödel's incompleteness theorems outside mathematics: to argue that machine intelligence can never equal human understanding, that there can be no final theory of physics, that no legal, tax or regulatory code can ever be complete, that no model of the economy can be closed, that the universe cannot be a simulation. I don't want the blanket newsroom response that every such use is abuse, because some of them are doing real work; but I also don't want to print a sentence that would make a working logician wince. My constraints are fixed: roughly fifteen minutes per item, no mathematics beyond what I remember from school, fact-checkers with humanities degrees who are not going to read a proof, and a standards editor who signs off and whom I need to be able to justify the call to in a Slack message. So what I want is a triage procedure I can actually run — the questions in order, what counts as a sufficient answer to each, where the procedure stops with a no (cut the sentence), where it permits printing with a specified hedge, and where it has to hand the decision to a person, either because the remaining question is one of editorial judgment rather than fact or because it is a technical question that no amount of triage can settle.

  The conceptual work is in deciding which distinctions have to survive the translation into something a non-specialist can run. My sense is that the load-bearing ones include: whether a formal system has actually been specified at all, and whether it is the kind of structure that could encode elementary arithmetic rather than, say, a chess engine or a spreadsheet; whether what is said to be missing is derivability inside that system, truth, or knowability by any mind; whether the argument needs the system to be consistent and what becomes of it if it is not; whether the target is held fixed or quietly re-specified every time a gap is pointed out, which is what happens in the Lucas-Penrose style of argument about minds and machines; whether the limitation is claimed of one system or uniformly of all of them; and whether the word doing the work is really incompleteness or rather undecidability, uncomputability or Chaitin-style irreducibility. A friend who works in formal epistemology gave me three rough tests she uses — she calls them the arithmetization test, the export step and the mirror test, the last being: take the human, or the physics community, or the legal system as the target and see whether the argument, if sound, proves the same limitation about us. Keep, correct or discard those, and add whatever checks they miss. Be explicit about which steps are judgment calls dressed up as procedure, and give me two or three substitute sentences I can drop in when the verdict is that the analogy fails but the underlying point is fine.

  Then run it, in front of me, on three items. First, a press release in which an AI company's chief scientist says the incompleteness theorems show that no system of rules can capture mathematical truth, and therefore no AI can have understanding and their product will always need a human in the loop — vivid copy, and my editor wants to quote it. Second, an op-ed from a well-known theoretical physicist arguing that because any sufficiently strong formal system leaves truths unprovable, physics can never have a final theory, only an endless succession of them. Third, and this is the one where I want you to be ruthless: a column of my own, half written, arguing that Gödel shows the dream of a complete and consistent regulatory code — a rule for every case, no discretion, no gaps — is not merely impractical but incoherent, so that discretion is a permanent feature of law rather than a regrettable one; a colleague muttered something about open texture when I described it, which I took as dismissal. Give me the honest verdict on all three, including whether mine has to be killed or can only survive as an explicitly labelled illustration, and then say what the procedure cannot do: which of these arguments it can only classify as beyond triage, where it will misfire on claims that are metaphorical on purpose, and when the right answer is to go and find an actual logician. Please reason from the structure of the theorems themselves rather than from anything you would need to look up — I have no way of checking a reference, and I would rather have the argument than the authority.
reasoning: |-
  We are designing a triage procedure for evaluating non-mathematical uses of Gödel's incompleteness theorems. The goal is to determine whether the use is legitimate, needs hedging, or should be cut. The procedure must be runnable by a non-specialist in about 15 minutes, without advanced math, and with the ability to justify to a standards editor.

  Key distinctions to consider (from the user's note):
  1. Is a formal system specified? And is it the kind that can encode elementary arithmetic?
  2. What is missing? (derivability inside the system, truth, or knowability by any mind)
  3. Does the argument require consistency? What if the system is inconsistent?
  4. Is the target fixed or moving? (e.g., in Lucas-Penrose arguments about minds and machines)
  5. Is the limitation claimed for one system or uniformly for all?
  6. Is the key concept really incompleteness, or undecidability, uncomputability, or Chaitin-style irreducibility?

  The friend's tests:
  - Arithmetization test: Can the system in question encode arithmetic? (This is necessary for Gödel's theorems to apply.)
  - Export step: How is the result being exported from mathematics to the other domain? Is the mapping clear?
  - Mirror test: If the argument were applied to humans (or the relevant human system), would it show the same limitation? (This can reveal double standards.)

  The triage procedure:

  Step 1: Arithmetization Test
     - Question: Is there a formal system specified? And if so, is it of the kind that can encode elementary arithmetic?
     - How to check: Look for a clear description of the system (e.g., a set of rules, an algorithm, a code). If it's not specified, that's a problem. Then ask: could this system, in principle, represent basic arithmetic (like adding and multiplying natural numbers)? If not, Gödel's incompleteness theorems do not directly apply.
     - Outcome:
          - If no formal system is specified: Stop. The use is likely abuse. (Cut the sentence or require major rewrite to specify a system.)
          - If a system is specified but cannot encode arithmetic: Stop. The use is abuse. (Cut the sentence.)
          - If a system is specified and can encode arithmetic: Proceed to Step 2.

  Step 2: Export Step
     - Question: What exactly is being claimed as the "export" of the theorem? Specifically, what is the gap or limitation being asserted? And how is it being mapped from the formal system to the target domain?
     - How to check: Identify the claimed limitation (e.g., "there will always be truths outside the system", "the system cannot prove its own consistency", "the system is incomplete"). Then check:
          a) Is the limitation correctly stated for the formal system? (Recall: Gödel's first incompleteness theorem says that for any consistent formal system that can encode arithmetic, there are statements that are true but unprovable within the system. The second theorem says such a system cannot prove its own consistency.)
          b) Is the mapping to the target domain clear and valid? For example, if the target is AI, how is the AI being modeled as a formal system? If the target is law, how is the legal code being seen as a formal system that encodes arithmetic?
     - Outcome:
          - If the limitation is misstated (e.g., confusing incompleteness with undecidability or uncomputability): Stop. The use is abuse. (Cut the sentence.)
          - If the mapping is vague or invalid: Stop. The use is abuse. (Cut the sentence.)
          - If the mapping is clear and the limitation correctly stated: Proceed to Step 3.

  Step 3: Consistency Requirement Check
     - Question: Does the argument rely on the system being consistent? What happens if the system is inconsistent?
     - How to check: The incompleteness theorems require the system to be consistent (otherwise, the system can prove everything and is trivially complete, but unsound). If the argument doesn't address consistency, or if the target system might be inconsistent, that's a problem.
     - Outcome:
          - If the argument assumes consistency without justification and the target domain is one where inconsistency is a real possibility (like a legal code that might have contradictions): This requires a hedge. (Add a note that the conclusion depends on the system being consistent, which is not guaranteed.)
          - If the argument acknowledges the consistency issue and handles it appropriately: Proceed to Step 4.
          - If the argument ignores consistency and the target domain is one where inconsistency would be catastrophic (e.g., a foundational mathematical system) and the argument is about incompleteness, then it's acceptable to assume consistency for the sake of the argument? But note: in non-mathematical domains, inconsistency is common.

  Step 4: Mirror Test
     - Question: Apply the same argument to the human mind (or the relevant human system, like the physics community or the legal system as a whole). Would the argument show that the human mind (or the human system) is subject to the same limitation? If not, why not?
     - How to check: Take the core argument and substitute the human system for the formal system. For example, if the argument says that no AI can be complete because of incompleteness, then ask: does the same argument show that the human mind cannot be complete? If the proponent exempts the human mind by saying it is not a formal system, then they must explain why the AI is being treated as one and the human is not. This test is particularly aimed at arguments that try to show machines are inferior to humans.
     - Outcome:
          - If the argument, when applied to the human system, would lead to the same limitation and the proponent accepts that: Then the use is consistent. Proceed to Step 5.
          - If the argument does not apply to the human system and the proponent gives a valid reason (e.g., the human mind is not a formal system, but the AI is): Then we must evaluate that reason. If the reason is that the human mind is not a formal system, then note that the incompleteness theorems only apply to formal systems. Therefore, the argument about the human mind would not be subject to the same limitation. But then why is the limitation being applied to the AI? Only if the AI is being considered as a formal system. This is acceptable if the AI is indeed being designed as such. However, if the proponent then claims that the human mind is not subject to the limitation because it is not formal, but without explaining how it avoids the limitation (e.g., by being inconsistent, or by having some non-algorithmic component), then the argument might be inconsistent. This step is a judgment call.
          - If the argument exempts the human system without a valid reason: Then the use is likely abuse. (Require a hedge or cut.)

  Step 5: Uniformity Check
     - Question: Is the limitation being claimed for one particular system or uniformly for all systems? (The incompleteness theorems apply to each sufficiently strong formal system individually, but not to the union of all such systems. For example, a truth that is unprovable in one system might be provable in a stronger one.)
     - How to check: Look at the language. If the argument says "no system can be complete" and means that every system will have gaps, that's correct. But if the argument says that there is a single truth that no system can capture, that's not what Gödel says. Gödel's result is that for each system, there is a sentence that it cannot prove, but that sentence might be provable in a different system.
     - Outcome:
          - If the argument claims a uniform limitation (i.e., a single gap for all systems): Then it is misusing Gödel. (Cut the sentence.)
          - If the argument correctly states that each system has its own gaps: Then proceed to Step 6.

  Step 6: Terminology Check
     - Question: Is the key concept incompleteness, or is it undecidability, uncomputability, or something else? (Gödel's incompleteness is about the existence of unprovable truths in formal systems. Undecidability (e.g., the halting problem) is about the non-existence of an algorithm to decide a problem. Uncomputability is about functions that cannot be computed by any algorithm. Chaitin's work is about algorithmic information theory and the idea that some mathematical truths are irreducibly complex.)
     - How to check: Look for words like "undecidable", "uncomputable", "irreducible". If the argument is using one of these, it might be a different theorem (like Turing's halting problem) and not Gödel's incompleteness.
     - Outcome:
          - If the argument uses Gödel's name but the concept is actually from Turing, Church, or Chaitin: Then the use is incorrect. (Cut the sentence or correct the attribution if the underlying point is valid but misattributed.)
          - If the argument correctly uses Gödel's incompleteness: Then the use is acceptable, provided all previous steps passed.

  If at any step the answer is unclear, or if the argument is particularly subtle, then the procedure hands the decision to a person (the user) for editorial judgment. Also, if the argument is intended as a metaphor and not a literal application, that should be noted, but the user must decide whether the metaphor is acceptable.

  Substitute sentences for when the analogy fails but the underlying point is fine:
  1. "While Gödel's theorems do not directly apply here, the underlying idea that complex systems may have inherent limitations is worth considering."
  2. "Though the analogy to mathematical incompleteness may be imperfect, the challenge of creating a fully exhaustive set of rules is well known in [field]."
  3. "Even without invoking Gödel, one can argue that [the underlying point]."

  Now, applying the procedure to the three items:

  Item 1: AI company chief scientist
     - Claim: Incompleteness theorems show that no system of rules can capture mathematical truth, therefore no AI can have understanding and always needs a human in the loop.

     Step 1: Arithmetization Test
        - The formal system is the AI's rule-based system. The claim is that an AI is a formal system. We can assume that an AI system (if it is sufficiently complex) can encode arithmetic? (Yes, because modern AI systems are Turing-complete, so they can simulate any computation, including arithmetic.) So pass.

     Step 2: Export Step
        - The limitation: no system of rules can capture all mathematical truth. But note: Gödel says that no such system can capture all truth about arithmetic (if consistent). The export: because the AI is such a system, it cannot capture all mathematical truth. Then the leap: therefore it cannot have "understanding" and needs a human. The mapping is: AI = formal system, human = outside the system. However, Gödel does not say that the truths are captured by a human. He says they might be captured by a stronger system. Also, "understanding" is not a concept in the theorem.

     Step 3: Consistency Requirement
        - The argument assumes the AI system is consistent? Probably, but what if it isn't? Not addressed.

     Step 4: Mirror Test
        - Apply to the human: Is the human mind a formal system? If the human mind is also a formal system (as the AI is claimed to be), then by the same argument, the human mind would be incomplete and hence lack understanding? But the argument says the human is needed to fill the gap. So the human is being placed outside the system. But if the human mind is a formal system, then it too would have gaps. The proponent must explain why the human is not subject to the same limitation. The typical response is that the human mind is not a formal system (or not algorithmic). But then why is the AI being treated as one? The argument might be self-defeating: if the AI is a formal system and the human is not, then the human can do something the AI cannot. But Gödel does not prove that non-formal systems can capture the truth that the formal system misses. In fact, Gödel himself believed that the human mind could grasp these truths. However, this is a philosophical leap beyond the theorem.

        - We run into a Lucas-Penrose style argument. The triage procedure flags this as a problem: the target (the human) is being exempted without sufficient justification. The Mirror Test fails.

     Step 5: Uniformity Check
        - The argument says "no system of rules", meaning every formal system is incomplete. That is correct.

     Step 6: Terminology
        - The argument uses incompleteness.

     Verdict: The use of Gödel is problematic because of the Mirror Test. The claim that the AI cannot have understanding and needs a human in the loop is not directly supported by the theorem. The theorem says nothing about understanding. Also, the export from "incomplete" to "lacks understanding" is a leap.

     Recommendation: Cut the sentence. If the underlying point is that AIs have limitations, then use a substitute sentence.

     Example substitute: "While Gödel's theorems do not directly apply to the question of AI understanding, it is true that complex rule-based systems may have inherent limitations, and human oversight remains important."

  Item 2: Theoretical physicist op-ed
     - Claim: Because any sufficiently strong formal system leaves truths unprovable, physics can never have a final theory, only an endless succession.

     Step 1: Arithmetization Test
        - The formal system is the physical theory. But is a physical theory a formal system that can encode arithmetic? This is a key question. A physical theory is expressed in mathematics, so it might be able to encode arithmetic. For example, general relativity and quantum mechanics are built on mathematics that includes arithmetic. So pass.

     Step 2: Export Step
        - The limitation: the physical theory, being a formal system, will have unprovable truths (about physics? or about arithmetic?). Here we have a problem: the unprovable truths in Gödel's theorem are about arithmetic, not necessarily about physics. The op-ed claims that the physical theory will leave some physical truths unprovable. But Gödel's theorem does not directly say anything about physical truths. It's about arithmetic truths.

        - The mapping: the physical theory is a formal system that includes arithmetic, so there will be arithmetic truths that the physical theory cannot prove. But are these truths relevant to physics? Maybe not. For example, the Gödel sentence for a physical theory might be a purely arithmetic statement with no physical content. Therefore, the gap might not be in the physical part of the theory.

        - So the export step is weak: why should the existence of an unprovable arithmetic truth imply that there is an unprovable physical truth? The op-ed assumes that the physical theory must be strong enough to include arithmetic, and then that the incompleteness in arithmetic implies incompleteness in physics. But note: the physical theory might not need to include all of arithmetic, or it might be that the physical truths are decidable even if the arithmetic ones are not. This is a judgment call.

     Step 3: Consistency Requirement
        - The argument assumes the physical theory is consistent. That is a reasonable assumption for a physical theory? We hope so, but if the theory is inconsistent, then it would be useless. So we can assume consistency.

     Step 4: Mirror Test
        - Apply to the physics community: If we take the entire physics community as a system that builds theories, then it too would be subject to the same limitation? The op-ed is claiming that any formal system (so any theory) is incomplete. The mirror test would say: the physics community, when it uses formal systems, will also have incomplete theories. But the op-ed is making that point: that there will always be a need for a new theory. So it passes.

     Step 5: Uniformity Check
        - The argument says that any sufficiently strong formal system is incomplete, and that therefore we will always need a new one. This is in line with the theorem: each system has its own gaps, and a new system can fix some gaps but then have new ones.

     Step 6: Terminology
        - Correctly using incompleteness.

     Verdict: The argument is generally sound, but the export step from arithmetic truths to physical truths is a leap. The unprovable truths are about arithmetic, not necessarily about physics. Therefore, we might need a hedge.

     Recommendation: Allow the sentence but with a hedge: "According to Gödel's incompleteness theorems, any formal system that includes arithmetic will have unprovable arithmetic truths. This suggests that a physical theory, if it is to be complete and consistent, might face similar limitations in its mathematical foundations. However, whether this directly implies unprovable physical truths is an open question."

     Alternatively, if the op-ed is making the point that the mathematical framework of physics is incomplete, that is valid.

  Item 3: User's own column about regulatory code
     - Claim: Gödel shows that the dream of a complete and consistent regulatory code is incoherent, so discretion is permanent.

     Step 1: Arithmetization Test
        - Formal system: the regulatory code. Can a regulatory code encode arithmetic? In principle, yes. Laws can refer to numbers, and one could imagine encoding arithmetic within the legal code. For example, tax laws involve arithmetic. But is the regulatory code a formal system in the sense of having axioms and rules of inference? The legal system is not typically a formal system in the mathematical sense. It is more like a natural language system with interpretations by courts. However, if we imagine a code that is intended to be mechanically applied (without interpretation), then it might be a formal system. But note: the regulatory code is not designed to prove theorems about arithmetic. So this is borderline.

        - We might say that if the regulatory code is complex enough to include arithmetic, then it meets the condition. But the purpose of the code is to regulate, not to do arithmetic. However, if the code can express arithmetic propositions, then it is vulnerable to Gödelization.

     Step 2: Export Step
        - The limitation: the regulatory code cannot be both complete and consistent. But note: Gödel says that if it is consistent, then it is incomplete. So if we require both, it's impossible. The export: therefore, we must have discretion (which is like the human in the loop) to fill the gaps.

        - However, the regulatory code is not a formal system in the same way as a mathematical one. The code is applied by humans and interpreted in a context. The "incompleteness" in law is more like the open texture of language (as the colleague mentioned). The gap that Gödel would provide is a very specific arithmetic statement that is true but not derivable. But that might not be the kind of gap that occurs in law. The gaps in law are usually about vague terms or unforeseen circumstances.

     Step 3: Consistency Requirement
        - The argument requires the code to be consistent. But legal codes can have contradictions? Yes, and they are resolved by courts. So consistency is not guaranteed.

     Step 4: Mirror Test
        - Apply to the legal system as a whole (with judges and discretion): The legal system as a whole is not a formal system? Then it might avoid the limitation. But the argument is about the code without discretion. So the mirror test doesn't directly apply? The argument is that the code alone is incomplete, so we need discretion. That is consistent.

     Step 5: Uniformity Check
        - The argument is about any sufficiently complex regulatory code. Correct.

     Step 6: Terminology
        - Correctly using incompleteness.

     Verdict: The analogy is weak because the regulatory code, even if it can express arithmetic, is not being used as a formal system for proving arithmetic truths. The gaps that occur in law are not the same as the Gödelian gaps. The open texture of language is a more appropriate concept (as the colleague said).

     Recommendation: The column should not use Gödel as the primary argument. The point about the impossibility of a complete and consistent regulatory code is valid, but the open texture of language and the practical difficulties of foreseeing all cases are more relevant. Therefore, it might be better to avoid Gödel.

     Alternative: Keep it as an illustration, but with a hedge: "While Gödel's incompleteness theorems show that any sufficiently complex mathematical system must be incomplete, a similar lesson might be drawn for regulatory systems: that they cannot foresee every contingency. However, the limitations in law are often more about the vagueness of language and the unpredictability of human affairs than about the kind of logical incompleteness that Gödel discovered."

     But note: the user wants to argue that the incompleteness is permanent and inherent, not just practical. The open texture of language is inherent. So the underlying point is fine, but Gödel is not the best justification.

     Final verdict on the user's column: It can survive if framed as an analogy, but it should be labeled as such and not as a direct application. Alternatively, rewrite to remove Gödel and use the open texture argument.

  What the procedure cannot do:
  - It cannot resolve deep philosophical disputes (e.g., about the nature of the mind).
  - It may misfire on claims that are intended as metaphors. The user must decide whether the metaphor is acceptable.
  - It cannot evaluate the validity of the underlying point if it is independent of Gödel. The procedure only checks the use of Gödel's theorems.
  - It will flag any application where the formal system is not clearly specified or cannot encode arithmetic, even if the underlying idea of limitations is valid.

  When to find an actual logician:
  - When the argument is in a gray area and the stakes are high (e.g., a major op-ed by a prominent figure).
  - When the argument involves technical nuances beyond the procedure (e.g., if the system is not clearly able to encode arithmetic, but might be equivalent to one that can).
  - When the argument is about the foundations of mathematics or logic itself.

  Final note: The procedure is a heuristic. It will catch clear abuses but might be too strict for some borderline cases. The user should use their judgment when the procedure is inconclusive.
answer: |-
  Below is a triage procedure designed for your constraints: non-specialist executable in ~15 minutes, no advanced math, and Slack-justifiable to a standards editor. It builds on your insights and your friend's tests, with clear stopping points ("cut," "hedge," or "editorial judgment"). I'll first outline the procedure, then apply it to your three examples, and finally discuss limitations.

  ---

  ### **Triage Procedure: Evaluating Non-Mathematical Uses of Gödel's Theorems**
  **Core Principle:** Gödel’s first incompleteness theorem states that any consistent formal system capable of encoding elementary arithmetic will contain true statements *undecidable* within that system (i.e., neither provable nor disprovable using its rules). The second theorem adds that such a system cannot prove its own consistency. Misuse often arises from misidentifying the "system," misdefining "incompleteness," or overgeneralizing to non-arithmetic domains.

  **Key Questions & Decision Flow:**  
  Ask these in order. If any answer is "no" or "unclear," stop and follow the action. "Hedges" are pre-approved Slack-friendly caveats.

  1. **Arithmetization Test (Is there a formal system that encodes arithmetic?)**  
     - **Question:** Is a specific formal system defined (e.g., AI’s algorithm, legal code, physics theory)? And can it encode elementary arithmetic (+, ×, natural numbers)?  
     - **How to check:**  
       - "Formal system" = rules + syntax + inference procedures (e.g., a programming language, not a vague "human mind").  
       - "Encodes arithmetic" = can represent statements like "2 + 2 = 4" and manipulate them algorithmically (e.g., chess or spreadsheets *cannot*; Python or tax law *might*).  
     - **Sufficient answer:** Explicit examples (e.g., "the AI’s decision rules handle quantitative inputs") or domain plausibility (e.g., physics theories use math).  
     - **Outcomes:**  
       - No formal system specified → **Cut**. Gödel requires one.  
       - System specified but cannot encode arithmetic (e.g., a game engine) → **Cut**.  
       - System plausibly encodes arithmetic → Proceed.  
       - Unclear → **Hand to editorial judgment** (e.g., "Is this regulatory code Turing-complete?").

  2. **Export Step (Is Gödel’s gap about *provability* within the system?)**  
     - **Question:** Does the claim focus on *undecidable truths within the system* (not "absolute unknowability" or "human limitations")?  
     - **How to check:**  
       - Gödel shows unprovable truths *within the system*, not that truths are "unknowable" by other means.  
       - Keywords: "unprovable," "undecidable in the system" = good; "unknowable," "beyond human reach" = bad.  
     - **Sufficient answer:** The text must reference limitations *internal* to the system (e.g., "no AI can prove all truths within its own rules").  
     - **Outcomes:**  
       - Claim confuses "unprovable in the system" with "unknowable" or "true but unprovable everywhere" → **Cut**.  
       - Claim correctly cites in-system undecidability → Proceed.  
       - Exports "incompleteness" as a metaphor for practical gaps (e.g., "legal ambiguities") → **Hedge with #1 or #2 below**.

  3. **Consistency Check (Is consistency assumed? What if it fails?)**  
     - **Question:** Does the argument assume the system is consistent? And if consistency fails, would the claim collapse?  
     - **How to check:**  
       - Inconsistent systems prove everything (no undecidable truths), so Gödel doesn’t apply.  
       - Domains like law or economics often tolerate inconsistencies (e.g., conflicting precedents).  
     - **Sufficient answer:** The text must note consistency as a requirement (explicitly or implicitly).  
     - **Outcomes:**  
       - Consistency not mentioned, and the domain allows contradictions (e.g., law, economics) → **Hedge with #3 below**.  
       - Consistency assumed, and domain expects it (e.g., physics, AI safety) → Proceed.  
       - Inconsistency likely/acknowledged → **Hand to editorial judgment** (the claim may still hold if consistency is aspirational).

  4. **Mirror Test (Does the limitation apply to humans/society too?)**  
     - **Question:** If applied to humans (or the relevant human system), would the same limitation hold? If not, is there a non-arbitrary reason?  
     - **How to check:**  
       - Replace the target: "AI" → "human mind"; "legal code" → "entire legal system (courts + laws)."  
       - Lucas-Penrose red flag: Claims machines are "incomplete" but humans escape via vague "non-algorithmic" properties.  
     - **Sufficient answer:** Humans/society must either (a) share the limitation (e.g., "physics community can’t decide all truths within one theory"), or (b) differ clearly (e.g., "courts aren’t formal systems").  
     - **Outcomes:**  
       - Double standard exposed (e.g., "machines are incomplete, humans aren’t") → **Cut** unless justified (rare).  
       - Consistent application (e.g., "both AI and humans use formal systems with gaps") → Proceed.  
       - Unclear → **Hand to editorial judgment**.

  5. **Uniformity vs. Relativity (Is the gap system-relative?)**  
     - **Question:** Does the claim imply a *single universal gap* (false) or *system-specific gaps* (true)?  
     - **How to check:**  
       - Gödel’s gaps are relative: Truth X may be unprovable in System A but provable in stronger System B.  
       - "No final theory" is okay; "one truth no system can reach" is not.  
     - **Sufficient answer:** Language like "each system has its own unprovable truths" = good; "mathematical truth is unattainable" = bad.  
     - **Outcomes:**  
       - Claims a universal gap → **Cut**.  
       - Correctly notes system-specific gaps → **Pass**. Print if all prior steps pass.

  **Hedges (Use when analogy is weak but underlying point stands):**  
  1. *"While Gödel’s theorems do not directly apply, they illustrate a broader principle: [e.g., complex systems have limitations]."*  
  2. *"Though the analogy is imperfect, Gödel-like limitations suggest [e.g., total predictability is unattainable]."*  
  3. *"Independent of Gödel, [domain] faces inherent gaps due to [actual reason, e.g., open texture in law]."*

  **Stopping Rules:**  
  - **Cut the sentence:** Fails Arithmetization, Export, or Uniformity tests; or Mirror test reveals double standards.  
  - **Hedge:** Fails Consistency check (in inconsistency-tolerant domains) or Export step (if used metaphorically).  
  - **Hand to editorial judgment:** Unclear in Arithmetization, Mirror, or Consistency tests; or nuanced claims (e.g., "AI consciousness").  
  - **Pass:** Clears all tests.

  ---

  ### **Triage Applied to Your Three Examples**
  **Background:** Gödel’s theorems require:  
  - A consistent formal system (FS).  
  - FS encodes elementary arithmetic.  
  - Result: FS has statements undecidable *within FS* (not universally).

  #### **1. AI Chief Scientist’s Claim**  
  *Claim: "Incompleteness theorems show no system of rules can capture mathematical truth → no AI can have understanding → always needs a human."*  
  - **Step 1 (Arithmetization):** AI systems *can* encode arithmetic (e.g., via Python). **Pass.**  
  - **Step 2 (Export):** Fails. Gödel shows undecidability *within a system*, not that truth is "uncapturable" absolutely. Humans using stronger systems *can* prove Gödel sentences. Also, "understanding" ≠ formal provability. **→ Cut.**  
  - **Triage Verdict:** Cut. Fails Export step (conflates in-system undecidability with universal unknowability). The Mirror test also fails: If humans "capture truth," why can’t a human-designed AI with expanded rules?  
  - **Substitute:** Hedge #1: *"While Gödel’s theorems do not directly show AI cannot 'understand,' they underscore that rule-based systems have inherent limitations, potentially necessitating human oversight."*

  #### **2. Theoretical Physicist’s Op-Ed**  
  *Claim: "Any sufficiently strong formal system leaves truths unprovable → physics can never have a final theory, only endless succession."*  
  - **Step 1 (Arithmetization):** Physics theories (e.g., quantum mechanics) encode arithmetic. **Pass.**  
  - **Step 2 (Export):** Pass. Correctly focuses on in-system undecidability within a single theory (e.g., a "Theory of Everything" may not prove all arithmetic truths).  
  - **Step 3 (Consistency):** Physics assumes consistency (inconsistent theories are rejected). **Pass.**  
  - **Step 4 (Mirror):** Pass. Applies uniformly: Humans/physics community also can’t decide all truths in one fixed system. New theories (stronger systems) resolve old gaps but create new ones.  
  - **Step 5 (Uniformity):** Pass. "Endless succession" acknowledges system-relative gaps.  
  - **Triage Verdict:** Pass. All tests cleared. The claim is a valid export: A fixed FS for physics would have Gödelian gaps, necessitating new systems.  
  - **Hedge?** None needed. Optional Slack note: *"Assumes a 'final theory' must be a fixed formal system encoding arithmetic."*

  #### **3. Your Column on Regulatory Code**  
  *Claim: "Gödel shows a complete/consistent regulatory code is incoherent → discretion is permanent."*  
  - **Step 1 (Arithmetization):** Unclear. Regulatory codes *can* encode arithmetic (e.g., tax calculations), but they’re not designed as FS with inference rules. **→ Hand to editorial judgment.** (Judgment: Likely "no." Legal codes rely on interpretation, not syntactic proofs. Your colleague’s "open texture" (Hart’s concept) is the real issue.)  
  - **Step 2 (Export):** Fails. Gödel gaps are specific arithmetic truths. Regulatory "gaps" are ambiguities (e.g., "reasonable care"), not undecidable Gödel sentences. **→ Cut if standalone; hedge if analogical.**  
  - **Mirror Test:** Humans/courts *do* "fill gaps," but via interpretation, not stronger formal systems.  
  - **Triage Verdict:** **Kill the Gödel reference.** It fails Arithmetization (regulatory codes aren’t FS) and Export (gaps aren’t Gödelian). The underlying point stands (discretion is inevitable), but open texture/vagueness is the right framework.  
  - **Substitute:** Hedge #3: *"Independent of Gödel, regulatory codes face inherent gaps due to the open texture of language and unforeseeable cases, making discretion unavoidable."* Or rework without Gödel.

  ---

  ### **What the Triage Cannot Do**  
  1. **Judge non-literal/metaphorical claims:** The procedure flags all non-arithmetic exports as "cut," but metaphors (e.g., "Gödel as a symbol of limits") may be editorially valid. Triage will misfire here – rely on judgment.  
  2. **Resolve domain-specific disputes:** E.g., "Can the human mind encode arithmetic?" is philosophical. Hand to editorial judgment.  
  3. **Cover related concepts (undecidability, uncomputability):**  
     - Undecidability (e.g., Turing’s Halting Problem): Applies to decision problems, not formal systems. Test via Step 6 (added below).  
     - Uncomputability/Chaitin: Addresses randomness/irreducibility, not incompleteness.  
     - **Add Step 6 if terminology is suspect:**  
       - **Question:** Is "incompleteness" misused for undecidability/uncomputability?  
       - **Check:** "Incompleteness" = gaps in provability; "undecidability" = no algorithm to solve a problem; "uncomputability" = non-algorithmic functions.  
       - **Outcome:** Misattribution → **Cut** (e.g., "Gödel proves AI is uncomputable").  
  4. **Evaluate the underlying argument:** Triage only checks Gödel’s role. If the point stands without it (e.g., "law has gaps"), use substitutes.  
  5. **Replace logicians for technical claims:** E.g., "Does this economic model encode Peano arithmetic?" requires expertise. When Step 1/2 are unclear, or for high-stakes pieces, find a logician.

  ---

  ### **Final Summary**  
  - **AI claim:** Cut. Fails Export and Mirror tests.  
  - **Physics claim:** Pass. All tests cleared.  
  - **Your column:** Kill Gödel reference. Use open texture instead.  
  - **When to call a logician:** For ambiguous Arithmetization (Step 1), consistency nuances (Step 3), or claims blending incompleteness with undecidability/uncomputability.  

  This triage is a pragmatic filter, not a proof. It prioritizes your constraints: speed, no math, and auditable Slack justifications ("Failed Arithmetization: no formal system specified"). Use substitutes to preserve the underlying insight when Gödel isn’t essential.
