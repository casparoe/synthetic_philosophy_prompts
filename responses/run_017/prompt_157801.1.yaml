  Hey — you're a professional philosopher who works on metaphysics and also genuinely fluent in programming language theory: the sort of person who is equally at home with a paper on truthmaking and with the Racket reference. Take this seriously and think it through properly. Before you write anything else, spend a few paragraphs brainstorming: list the moves in the debate you think are load-bearing and the ones you suspect are artifacts of how philosophers happened to phrase things, flag where you anticipate the translation going wrong, and only then start the actual restatement. Don't suggest anything for me to read, I've got plenty of unopened books already.

  Some context on me: I teach metaphysics, and I've been messing about with Lisp-family languages for years as a hobby — metacircular evaluators, self-hosting compilers, a bit of typed Racket and Haskell, the usual. So the vocabulary I actually reach for is: abstract syntax trees, node types and constructors, s-expressions and quoting vs. evaluating, typed vs. untyped application, currying and unsaturated functions, closures and environments, thunks and lazy evaluation, corecursion and non-well-founded data, well-foundedness and termination checks, metacircularity and bootstrapping, object language vs. metalanguage, reduction and normalisation.

  Here's the ask. Take Bradley's regress — the argument that a proposition such as Socrates is mortal can't be assembled out of its constituents plus a relation, because the relation itself has to be related to its relata, which needs a further relation, and so on without end — together with the main things people say in reply: that the unity is primitive and the proposition is prior to its parts; the Fregean line about unsaturated functions; Russell-style multiple-relation theories of judgement; facts or states of affairs as already-unified truthmakers; and the contemporary grounding idiom with its assumption that grounding is well-founded.

  Restate all of that, as faithfully as you can, in my vocabulary. Specifically:

  1. What is a proposition in these terms — an AST node, a closure, a thunk, a type, something else? Pick one, say why, and say what each of the others would get wrong.
  2. What is the relation that supposedly needs tying — an application node, a constructor, a function value? And where does the regress actually show up: as a demand for an infinite tree, as non-terminating evaluation, as a type error, as something else entirely?
  3. What does each of the standard replies look like as a programming-language move? Be honest about which ones are mere renaming (call the glue a constructor and declare the question closed) and which genuinely restructure the problem.
  4. The bit I care most about, and the reason I'm asking you rather than thinking abuot it myself: I keep wanting to say that the right reply to Bradley is not to stop the regress but to let it be circular, in the way a metacircular evaluator is defined in terms of itself, or a compiler can compile its own source. A self-hosting compiler is a perfectly unmysterious object whose identity and behaviour depend on itself, and nothing explodes — it just sits on a lower-level machine that nothing inside the language ever mentions. Is that a real analogue of what someone defending primitive unity, or non-well-founded grounding, is claiming? Or does the analogy smuggle in exactly what is at issue — a level distinction between program and machine, object language and metalanguage, that has no counterpart in the metaphysical case? Please press on this rather than agreeing with me.
  5. And a sub-question I think my vocabulary might be quietly conflating: the regress of constituency (what the parts are and what binds them) versus the regress of interpretation (what makes the whole say or be about something). Inside an interpreter those are clearly different objects, the tree and the semantic function, but in the metaphysical literature I'm never certain they are distinct. Does your translation separate them? If it does, does the original argument survive the separation?

  Then the residue report, which is the actual deliverable:

  - Which claims translated cleanly, with nothing lost?
  - Which translated only after you quietly altered them — where did you have to fudge, and what exactly did the fudge consist in?
  - Which claims have no expression at all in the vocabulary I gave you, and — this is the judgement call I want from you — is that because my vocabulary is missing something real that the metaphysicians have hold of, or because the philosophical claim was never as clear as it looked and the programming vocabulary has exposed it?

  Be explicit wherever you catch yourself importing a programming-language assumption instead of translating. If some part of the debate is idle, a pseudo-problem generated by taking a grammatical distinction too seriously, say so and explain what makes that visible in programmer's terms. If some part is real and my vocabulary can't reach it, characterise as precisely as you can what would have to be added to reach it — and what, if anything, would break if you added it.
