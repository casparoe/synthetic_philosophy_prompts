prompt: |-
  I am a fourth-year PhD student in molecular systems biology and, because I am the methods person in my group, I chair the weekly hypothesis-triage meeting. Once or twice a week someone brings in a newly formulated explanatory hypothesis — usually a proposed mechanism for a phenomenon we have already measured — and the meeting has to decide whether to redirect a month of a postdoc's time toward it, with the PI signing off at the end. Our recurring failure is that we treat the findings a hypothesis was built to fit as though they confirmed it: someone reverse-engineers a mechanism out of data already in the lab notebook, and because the mechanism accommodates that data neatly, we treat it as well supported and commit resources to it. I have been reading about the problem of old evidence in Bayesian confirmation theory — roughly, that once a finding is already known, it cannot raise a theory's probability by the usual machinery, and that the proposed repairs involve replacing the actual prior with a hypothetical one fixed before the evidence was in hand. I want whatever is salvageable in that discussion turned into a one-page procedure my lab can actually run in forty minutes, written for people with no training in formal epistemology and no tolerance for jargon.

  What I need from you is the procedure itself, in a fixed order, and then its application. Specifically:

  1. A numbered sequence of questions, each with a statement of what counts as a sufficient answer and where the procedure terminates with no support. The steps should be runnable with the materials a lab actually has: the hypothesis as stated, the old findings it is supposed to explain, the lab's current rival hypotheses, and whoever is in the room.

  2. A way of sorting the old findings by provenance before any weight is assigned. I have in mind four categories — findings that were inputs to the construction of the hypothesis; findings the hypothesis was adjusted to fit after it was first stated; findings everyone already knew but that the proposer did not consult; and findings that were anomalous for the reigning model — together with a rule for what each category is worth, and for what happens when a finding falls into more than one.

  3. A usable substitute for the hypothetical prior. My idea is a blinded rebuild: someone who did not help construct the hypothesis writes down, before being shown how well it fits, what they would expect such a hypothesis to predict. Tell me how to run this honestly in a six-person lab where everyone has already seen the data, how to record the result so it cannot be quietly revised afterwards, what to do when no genuinely uninvolved person exists, and how much weight the outcome of the rebuild should carry relative to the rest of the procedure.

  4. A rule for the case where several live hypotheses in the lab's register accommodate the same finding. I do not want a likelihood ratio nobody can compute; I want something a group can apply by counting and arguing, including guidance on when the rival set is too poorly specified to count at all.

  5. An explicit stop rule and an expiry. The procedure should say when old evidence is enough to justify a bet of a person-month and when it is not; require whatever novel test it licenses to be named, with a prediction stated in advance and a date; and say what happens to the hypothesis when that date passes.

  6. The places where judgment cannot be eliminated, marked as such rather than disguised as steps — in particular any place where the decision turns on how much our group values explanatory unification versus predictive novelty, and any place where the procedure has to appeal to the honesty of records we may not have kept.

  Please also add a short closing paragraph on what the procedure cannot do: whether it can yield a number without manufacturing spurious precision, what it assumes about the completeness of the rival set, and whether it can ever substitute for a genuinely new test.

  Then run the procedure on three cases from our own area, showing the steps as you go rather than jumping to verdicts. First: a postdoc proposes that a metabolite produced by a gut bacterium explains a diet effect we published last year, where the metabolite was selected out of an untargeted screen precisely because it was elevated in exactly the condition where the effect is strongest. Second: a visitor proposes, by analogy with a structure characterised in a related organism, that our protein of interest forms condensates — a proposal made before anyone looked — which turns out to explain a two-year-old anomaly, a subpopulation of cells that the reigning kinetic model says should die but does not, and to explain it without new parameters. Third: the lab's own flagship hypothesis, the one on which the PI's grant renewal is built, whose only support is a pattern we have known for three years, which the hypothesis was written to fit, which a competing model from another group also reproduces after a single tweak, and which required two auxiliary assumptions to accommodate. Run the third case straight and give me the result even where it is one I would rather not take into the meeting.
reasoning: |-
  We are devising a procedure to evaluate hypotheses based on old evidence, avoiding the pitfall of treating accommodation as confirmation. The procedure must be practical, jargon-free, and runnable in about 40 minutes with typical lab materials.

  The core idea: We cannot use the old evidence that the hypothesis was built to explain as strong confirmation. Instead, we need to assess the hypothesis by:
  - How well it explains evidence it wasn't tuned for (especially anomalies and evidence not consulted during construction)
  - How it compares to existing rival hypotheses
  - Its performance in a "blinded rebuild" (a substitute for the hypothetical prior)
  - Its ability to generate novel, testable predictions

  We break down the procedure into numbered steps. The goal is to decide whether to invest a person-month (plus other resources) into testing the hypothesis.

  ---

  **Procedure for Evaluating a Hypothesis (H) Based on Old Evidence**

  **Materials Needed:**
  - The hypothesis (H) as stated
  - The set of old findings (E) that H is claimed to explain (with their provenance)
  - The lab's current register of rival hypotheses (R1, R2, ...)
  - Lab notebooks (for checking records, if available)
  - A timer (to keep to 40 minutes)

  **Step 0: Pre-meeting Preparation (to be done by the proposer)**
     - The proposer must write down H clearly and list all the old findings E that H is claimed to explain, categorizing each finding in E by provenance (see Step 2 for categories). They must also list any auxiliary assumptions used.

  **Step 1: State the Hypothesis and Its Rivals (5 minutes)**
     - **1a.** Proposer states H in one sentence and lists the old findings E that H is claimed to explain.
     - **1b.** Proposer states what auxiliary assumptions (if any) are required for H to explain E.
     - **1c.** The group (including the chair) identifies the current rival hypotheses (from the lab's register) that also aim to explain the same phenomena. If no rival is explicitly held by the lab, state the simplest null model (e.g., "the effect is due to chance" or "the current reigning model without the new mechanism").
     - **Sufficient answer:** H is clearly stated; rivals are named; E is listed. If H is vague or E is not listed, stop: H is not ready for evaluation.

  **Step 2: Sort Old Findings by Provenance (5 minutes)**
     - For each finding in E, assign one or more of the following categories (based on how the hypothesis was constructed):
       - **Category A (Inputs):** Findings that were direct inputs to the construction of H (e.g., "we saw X, so we thought of H").
       - **Category B (Tuned):** Findings that H was adjusted to fit after the initial statement of H (e.g., "we tweaked H to also account for Y").
       - **Category C (Unconsulted):** Findings that were known in the lab but that the proposer did not consult during the construction of H. (Requires honesty: if the proposer says they didn't know, we take their word unless contradicted by records.)
       - **Category D (Anomalies):** Findings that were anomalous for the reigning model (i.e., they were known and puzzling before H was proposed).
     - **Rule for weight:** 
       - Category A and B findings get **zero weight** in confirming H (because they were used to build/tune H and thus cannot independently test it).
       - Category C findings get **moderate weight**: they are somewhat confirmatory because H explains them without having been adjusted for them.
       - Category D findings get **strong weight**: if H explains an anomaly that was previously unexplained, that is a mark in its favor.
       - If a finding falls into multiple categories, use the highest weight category it qualifies for (D > C > B = A). But note: if a finding is in A or B, it cannot also be in C or D for the same proposer (because if you used it to build/tune, you consulted it). However, it could be an anomaly (D) and also tuned (B) — then it gets strong weight (D) but note the tuning weakens it. We mark it D and note the concern.

  **Step 3: Blinded Rebuild (10 minutes)**
     - **Purpose:** To simulate what we would have expected H to predict before seeing how well it fits E.
     - **How to run:**
       - The chair selects a **rebuilder** who had no involvement in constructing H and who has not been told about H's fit to E. If no such person exists (e.g., in a small lab), use the person with the least prior knowledge of H's construction. If that fails, skip this step (and note: no blinded rebuild).
       - The rebuilder is given:
          - A description of H (but without any mention of the findings E it is supposed to explain).
          - A general description of the experimental system (e.g., "this is about the diet effect in mice with gut microbiota").
          - The rebuilder is asked: "What patterns in the data would you expect to see if H were true? List specific, testable predictions (they can be about old or new data)."
       - The rebuilder writes their predictions independently (5 minutes). The chair records them and reads them aloud.
       - The group then compares the rebuilder's predictions to the actual findings E (and any other relevant old data). We check: 
          - How many of the predictions match E? (Note: the rebuilder might not have predicted E exactly, but we look for overlap in the patterns they describe.)
          - Are there any predictions that conflict with known data?
     - **Weight:** The outcome of the blinded rebuild is used as a tiebreaker or to add moderate weight. If the rebuilder's predictions match E well (especially for findings in C or D) and there are no conflicts, that supports H. If there are conflicts or no match, that weakens H. If skipped, it doesn't hurt H but doesn't help.

  **Step 4: Comparison to Rivals (10 minutes)**
     - **Rule:** For each finding in E (especially those in categories C and D), we ask: 
          - Does each rival hypothesis (R) also explain this finding? 
          - How many auxiliary assumptions does R require to explain it? (Count simply: each added entity or free parameter counts as one.)
     - **Procedure:** 
          - Make a table with findings (rows) and hypotheses (columns: H and each rival R). For each cell, mark:
              - "Yes" if the hypothesis explains the finding (without new assumptions beyond its core) OR "Yes*" if it explains only with auxiliary assumptions (note the number of auxiliaries).
              - "No" if it does not explain.
              - "N/A" if the finding is not relevant to the hypothesis.
          - Focus on findings in C and D (since A and B get no weight).
          - **Count and argue:** 
              - Tally the number of C and D findings that each hypothesis explains (without auxiliaries). 
              - For hypotheses that require auxiliaries, discount: each auxiliary reduces the score by 0.5 per finding (so a finding explained with two auxiliaries counts as 0 for that hypothesis? Or subtract 0.5 per auxiliary? Let's say: each auxiliary reduces the tally for that finding by 0.5, so if a hypothesis explains a finding with 2 auxiliaries, it gets 1 - (0.5 * 2) = 0 for that finding. But we want simplicity: just count the number of auxiliaries per hypothesis overall? Instead, we do: for each finding, assign a score to each hypothesis: 1 if explained without auxiliaries, 0.5 if with one auxiliary, 0.25 if with two, and 0 if more or not explained. Then sum across findings. But that's too complex for a meeting. Instead, we argue qualitatively: 
                  - If H explains a C or D finding with fewer auxiliaries than a rival, that's a point for H.
                  - If a rival explains the same finding with the same or fewer auxiliaries, that's a point against H (or for the rival).
              - **Simpler:** We are only deciding on H. So we ask: for the findings in C and D, is H the only hypothesis that explains them? If yes, that's strong for H. If not, then how many rivals also explain them? And with how many auxiliaries? We want H to be at least as good as the best rival. If there are multiple rivals and they all explain the same set, then H doesn't stand out. 
          - **Stop if:** There is a clear winner (H explains at least one C or D finding that no rival does, and without auxiliaries) or if H is clearly worse (a rival explains the same findings with fewer auxiliaries). If the rival set is poorly specified (e.g., we haven't listed any or they are too vague), then we cannot compare — note that and move on. In that case, we rely on the other steps.

  **Step 5: Novel Prediction and Stop Rule (5 minutes)**
     - **5a.** Proposer must state a novel, testable prediction P of H (not yet observed) that is:
          - Specific and falsifiable.
          - Feasible to test within the resource budget (one person-month).
          - Not predicted by the reigning model (or by the main rival).
     - **5b.** If no such P can be stated, or if it is not feasible, stop: H does not get support from old evidence and we do not commit resources.
     - **5c.** If P is stated, then the group assesses:
          - The track record of H from Steps 2-4: 
              - If there are findings in D that H explains (strong weight) and/or in C (moderate) and H did well in the blinded rebuild and compares favorably to rivals, then H is well-supported and we approve the test of P.
              - If there are no findings in C or D (only A and B), then even with a novel prediction, we do not approve — the old evidence does not support H. (But we might test P if it's cheap and novel, but that's not the same as support from old evidence.)
          - **Stop rule:** We commit resources only if:
              - There is at least one finding in category D that H explains (anomaly) OR 
              - There is at least one finding in category C and H compares favorably to rivals (from Step 4) and the blinded rebuild was positive.
              AND a novel prediction P is stated and feasible.
     - **5d. Expiry:** The test of P must be completed within 3 months (or a fixed date set by the group). The result (whether P is confirmed or not) must be presented at a lab meeting. If P is confirmed, H becomes a stronger candidate. If not, H is set aside (unless there is a good reason to adjust and retest).

  **Step 6: Judgment Calls (Noted Throughout)**
     - **Honesty of records:** We rely on the proposer's memory for provenance (Step 2). If there is doubt, we check lab notebooks. If not recorded, we must trust the proposer.
     - **Value of unification vs. novelty:** In Step 5, if H unifies many findings (even if they are A/B) but has a novel prediction, we might be tempted. But the procedure says: without C or D, we don't commit. That's a judgment about resource allocation: we value predictive novelty over accommodation of old data.
     - **Rival set:** The comparison in Step 4 is only as good as the rival set. If we have no good rivals, we might overvalue H. We flag this as a limitation.

  ---

  **What the Procedure Cannot Do:**
  - It does not yield a number (like a probability) because we avoid spurious precision. Instead, it structures a qualitative assessment.
  - It assumes that the rival set is complete enough for a fair comparison. If we are missing a major rival, the procedure might wrongly favor H.
  - It cannot substitute for a genuinely new test. The procedure only licenses a bet on a novel test. Without a new test, H remains provisional.

  ---

  **Application to Three Cases**

  **Case 1: Gut Metabolite Hypothesis**
  *Background:* A postdoc proposes that a metabolite (M) from a gut bacterium explains a diet effect. M was selected from an untargeted screen because it was elevated in the condition where the diet effect is strongest.

  *Step 1: State H and rivals*
     - H: Metabolite M (produced by bacterium B) mediates the diet effect on [outcome].
     - E: The diet effect (published last year) and the elevation of M in the same condition.
     - Auxiliary assumptions? None stated.
     - Rivals: The reigning model (diet acts directly on host) and possibly others? We'll assume the reigning model does not involve the microbiome.

  *Step 2: Sort old findings (E)*
     - Finding 1: Diet effect (known and published). 
        - Provenance: This was the starting point (input to construction) → Category A. Also, the proposer used it to build H → A.
     - Finding 2: M is elevated in the condition of strong diet effect.
        - Provenance: This was the key piece used to pick M → Category A (input).
     - No other findings. So E = {1,2} both in A (and possibly B if adjusted? But not stated). Thus, no C or D. 

  *Step 3: Blinded rebuild*
     - We try: pick a rebuilder (e.g., a student who wasn't involved). They are told: "We have a hypothesis that a gut metabolite M from bacterium B mediates a diet effect." They might predict: "Then if you remove B, the diet effect should disappear" or "M levels should correlate with the effect across conditions." But note: the old findings (diet effect and M elevation) are exactly what they might predict. However, the rebuilder doesn't know E, so they might not predict the exact pattern. But if they do, it's because it's obvious? We'll say the rebuilder predicts that M is elevated when the diet effect is strong. Then it matches. But note: E is all A, so we don't count it.

  *Step 4: Comparison to rivals*
     - Rival: Diet acts directly (no microbiome). 
        - Finding 1: Diet effect → explained.
        - Finding 2: M elevation → not explained (unless auxiliary: maybe the diet also affects M? But not in the rival). So rival does not explain Finding 2. 
        - But Finding 2 is in A (so zero weight). We only care about C and D, which we don't have.

  *Step 5: Novel prediction and stop rule*
     - Proposer must state a novel prediction: e.g., "If we deplete bacterium B, then the diet effect will be reduced." 
     - But the old evidence (all A) does not support H. We do not commit resources based on old evidence. 
     - **Result:** Stop. Do not redirect the postdoc's time. (But note: if the novel prediction is cheap and novel, we might do it as an exploratory study, but not as a confirmation of H.)

  **Case 2: Condensate Hypothesis**
  *Background:* A visitor (before any data was seen) proposed by analogy that our protein forms condensates. This explains a two-year-old anomaly: a subpopulation of cells that should die by the reigning kinetic model but doesn't.

  *Step 1: State H and rivals*
     - H: The protein forms condensates in some cells, which protects them from death.
     - E: The anomaly (subpopulation survives) and possibly other data? 
     - Auxiliary assumptions: None (explains without new parameters).
     - Rivals: The reigning kinetic model (which fails to explain the anomaly) and possibly others.

  *Step 2: Sort old findings (E)*
     - Finding: The anomaly (subpopulation survives). 
        - Provenance: The visitor did not know about this anomaly when they proposed H (because they proposed it before anyone looked). But note: the anomaly is old (two years) and was known in the lab. The visitor did not consult it? They say they didn't know. So:
          - Category C (unconsulted) because the visitor didn't know and didn't use it to build H? But also, the anomaly was known to be problematic → Category D (anomaly for the reigning model). So D (highest weight). 
        - Also, note: the visitor proposed H without knowing the anomaly, so it's not A or B.

  *Step 3: Blinded rebuild*
     - Since the visitor is new, we can have someone else as rebuilder? But the anomaly is now known. We skip or do: 
        - Rebuilder (e.g., a lab member) is told: "We have a hypothesis that protein X forms condensates." They might predict: "Then in some conditions, we should see puncta" or "the protein should form droplets in vitro" — but not necessarily the survival anomaly. The anomaly might not be predicted. But we don't require that. We just note: if the rebuilder predicts something that matches E, that's a plus. In this case, E is the anomaly. The rebuilder might not predict it. So no match? But that's okay.

  *Step 4: Comparison to rivals*
     - Rival: Reigning kinetic model. 
        - Finding (anomaly): The kinetic model does not explain it (in fact, it contradicts it) → marked "No".
     - So H explains the anomaly (with no auxiliaries) and the rival does not. This is a point for H.

  *Step 5: Novel prediction and stop rule*
     - Proposer (visitor) states a novel prediction: e.g., "We should see condensates in the surviving cells by microscopy" or "Mutations that disrupt condensate formation should abolish the protective effect."
     - Since H explains a D finding (anomaly) and the rival does not, we commit resources to test the novel prediction. 
     - Set a date (e.g., 3 months) for the test.
     - **Result:** Approve the test.

  **Case 3: Flagship Hypothesis (PI's Grant)**
  *Background:* The lab's flagship hypothesis H. It was built to fit a pattern we have known for three years. A competing model from another group also reproduces the pattern after one tweak. H required two auxiliary assumptions to accommodate the pattern.

  *Step 1: State H and rivals*
     - H: [The flagship hypothesis]
     - E: The known pattern (and possibly others? but we'll assume only that one).
     - Auxiliary assumptions: Two (e.g., added entities or parameters).
     - Rivals: The competing model from the other group (call it R1). Also, the reigning model before H? But it might not explain the pattern.

  *Step 2: Sort old findings (E)*
     - Finding: The pattern (known for three years). 
        - Provenance: It was the input to building H → Category A. Also, H was adjusted to fit it → Category B. So A and B → zero weight.
     - Are there any other findings? If not, then no C or D.

  *Step 3: Blinded rebuild*
     - Hard: everyone knows the pattern. We skip or do a token rebuild. The rebuilder (least involved person) might predict the pattern if H is designed for it. So no independent support.

  *Step 4: Comparison to rivals*
     - Rival R1: The competing model. 
        - Finding: The pattern → R1 explains it after one tweak (one auxiliary). 
        - H explains the pattern with two auxiliaries. 
        - So R1 is simpler (one auxiliary vs two). Thus, H is worse than R1 on this finding. 
     - Since the finding is A/B (zero weight), we don't care? But we have no C or D. So no advantage.

  *Step 5: Novel prediction and stop rule*
     - Proposer must state a novel prediction. Let's assume they do: e.g., "If H is true, then under condition Y, we should see Z."
     - But the old evidence (only A/B) does not support H. Moreover, in Step 4, we see that a rival explains the same pattern with fewer auxiliaries. 
     - **Stop rule:** We do not commit resources because there is no finding in C or D. Even if there were, the rival is simpler. 
     - **Result:** Do not redirect resources to testing H. This is a hard result because H is the flagship, but the procedure says: without new evidence (C or D) or a better track record, we don't bet on it. The PI might override, but the procedure flags that H is weakly supported by old evidence.

  ---

  **Final Note:** The procedure is a safeguard against confirmation bias. It cannot guarantee truth but forces us to assess hypotheses by their novel predictions and ability to explain surprises.
answer: |-
  ### Hypothesis Triage Procedure: Evaluating Support from Old Evidence  
  *Designed for a 40-minute lab meeting. Focus on avoiding "accommodation bias" (treating fitted evidence as confirmation).*

  **Materials Required:**  
  - Written hypothesis (H)  
  - List of old findings (E) H claims to explain  
  - Lab's registry of rival hypotheses (R1, R2, ...)  
  - Lab notebooks (for verification)  
  - Timer  

  ---

  #### Step-by-Step Procedure  
  **1. State Hypothesis, Evidence, and Rivals (5 min)**  
     - **1a.** Proposer states H in one sentence and lists all old findings E it explains.  
     - **1b.** Proposer states auxiliary assumptions (if any) needed for H to fit E.  
     - **1c.** Group identifies active rival hypotheses (from lab registry) addressing the same phenomenon. If no rivals, default to "null model" (e.g., "effect is random" or "reigning model without H").  
     - ***Sufficient answer:*** H and E are clear; ≥1 rival is named.  
     - ***Stop if:*** H is vague, E is undefined, or no rival exists (note: "no rival" weakens H).  

  **2. Sort Evidence by Provenance (5 min)**  
     - Assign each finding in E to categories (non-exclusive; use highest-weight category if overlap):  
       - **A (Input):** Direct input to H's construction (e.g., "we saw X, so we proposed H").  
       - **B (Tuned):** H was adjusted to fit this after initial formulation.  
       - **C (Unconsulted):** Known in lab, but proposer did not consult/use it to build H.  
       - **D (Anomaly):** Anomalous for reigning model before H was proposed.  
     - **Weight rule:**  
       - A or B → **0 weight** (cannot confirm H; accommodation).  
       - C → **+1** (moderate weight; H explains without tuning).  
       - D → **+2** (strong weight; H resolves known anomaly).  
       - *Example:* A finding in both A and D → counts as D (+2) but note conflict (H built to fit an anomaly).  

  **3. Blinded Rebuild (10 min)**  
     - **Goal:** Simulate a prior expectation for H's predictions.  
     - **How to run:**  
       - Chair selects **rebuilder** (no role in H's construction; least familiar with H’s fit to E). If no one (e.g., small lab), skip.  
       - **Blinded input:** Rebuilder sees only H’s *mechanism* (not E) and system context (e.g., “H involves protein condensates in cell death”).  
       - **Task:** Rebuilder writes 1–3 specific predictions H *should* make if true (e.g., “H predicts puncta in surviving cells”).  
       - **Record:** Chair writes predictions on whiteboard; photo taken. No revisions.  
     - **Weight:**  
       - Match ≥1 finding in E (especially C/D) → **+1 support for H**.  
       - Conflict with E → **−1 support for H**.  
       - Skipped → **no penalty, but no boost**.  

  **4. Compare to Rivals (10 min)**  
     - **Rule:** For each finding in **C or D** (only weighted evidence):  
       - Does any rival R explain it?  
       - How many auxiliary assumptions does R need? (Count: each added entity/parameter = 1 auxiliary.)  
     - **Scoring (group argument):**  
       - If H explains a C/D finding and no rival does → **+1 for H**.  
       - If rivals explain same finding:  
         - H wins if rivals require >1 more auxiliary → **+0.5 for H**.  
         - Tie if auxiliaries equal → **no gain**.  
         - H loses if rivals use fewer auxiliaries → **−1 for H**.  
       - *Stop if rivals are vague:* If rivals cannot be scored (e.g., undefined mechanisms), skip scoring. H gains no advantage.  

  **5. Stop Rule & Resource Commitment (5 min)**  
     - **Support threshold:** H earns resources only if:  
       - **Net support ≥ 2** from:  
         - Provenance weights (C/D findings only).  
         + Blinded rebuild outcome.  
         + Rival comparison.  
       - **AND** proposer states a novel testable prediction P (not in E).  
     - **If approved:**  
       - Record P, method, and 3-month expiry date.  
       - Redirect resources (e.g., postdoc time) to test P.  
     - **If rejected (or net support <2):** Do not commit resources.  
     - **On expiry:** Present P’s result. Confirm P → H gains status; falsify P → H deprioritized.  

  **6. Explicit Judgment Calls**  
     - **Honesty of records:** Provenance (Step 2) relies on proposer’s memory. If conflict, check notebooks; if absent, trust but note uncertainty.  
     - **Value trade-off:** The procedure favors predictive novelty (Step 5) over explanatory unification (Step 2). Override only if unification is extraordinary (group consensus).  

  ---

  ### What This Procedure Cannot Do  
  - **No numbers:** Avoids false precision; yields qualitative support (e.g., "strong," "weak").  
  - **Rival set dependency:** Assumes rivals are well-defined. If rivals are incomplete, H may appear falsely strong.  
  - **Not a substitute:** Never justifies H *without* a novel test (Step 5). Old evidence only licenses betting on new predictions.  

  ---

  ### Case Applications  
  **Case 1: Gut Metabolite Hypothesis**  
  - **H:** Metabolite M (from gut bacterium) causes diet effect.  
  - **E:** Diet effect (published); M elevated in strong-effect condition (from untargeted screen).  
  - **Rival:** Diet acts directly (no microbiome role).  

  | Step | Outcome |  
  |------|---------|  
  | 1   | H clear. E defined. Rival: diet-direct model. |  
  | 2   | Both findings **A** (selected for fit): weight = 0. |  
  | 3   | Rebuilder predicts "M correlates with effect." Matches E → +1. |  
  | 4   | No C/D findings → skip rival comparison. |  
  | 5   | Net support = 1 (<2). **Stop: no resources.** |  

  **Verdict:** H built to fit data; no unconsulted/anomaly support. Reject.  

  **Case 2: Condensate Hypothesis**  
  - **H:** Protein forms condensates, explaining cell survival anomaly.  
  - **E:** Survival anomaly (known 2 years; unexplained by kinetic model).  
  - **Rival:** Kinetic model (fails to explain anomaly).  

  | Step | Outcome |  
  |------|---------|  
  | 1   | H clear. E: survival anomaly. Rival: kinetic model. |  
  | 2   | Anomaly is **D** (anomaly) + **C** (unconsulted by visitor): weight = +2. |  
  | 3   | Rebuilder predicts "condensates in surviving cells." No E match → 0. |  
  | 4   | Rival cannot explain anomaly → +1 for H. |  
  | 5   | Net support = 2 +1 = 3 (≥2). Novel P: "Condensates visible in survivors." **Approve test.** |  

  **Verdict:** H explains unconsulted anomaly; rival fails. Commit resources.  

  **Case 3: Flagship Hypothesis (PI’s Grant)**  
  - **H:** Lab’s flagship mechanism.  
  - **E:** Known pattern (3 years; H built to fit it).  
  - **Rival:** Competing model (explains pattern after one tweak).  

  | Step | Outcome |  
  |------|---------|  
  | 1   | H clear. E: known pattern. Rival: external model. |  
  | 2   | Pattern is **A** (input) + **B** (tuned): weight = 0. |  
  | 3   | Rebuilder predicts the pattern (obvious fit) → 0 (no independent insight). |  
  | 4   | Rival explains pattern with 1 auxiliary; H uses 2 auxiliaries → −1 for H. |  
  | 5   | Net support = −1 (<2). **Stop: no resources.** |  

  **Verdict:** H relies on tuned evidence; worse than rival. Do not commit.  

  ---

  **Final Note:** This procedure forces scrutiny of *how* hypotheses handle old evidence and mandates novel tests. It protects against self-deception but cannot replace empirical validation. Use it to allocate resources wisely—not to endorse untested ideas.
