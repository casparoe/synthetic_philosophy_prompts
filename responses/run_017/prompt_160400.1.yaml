  - No features correspond to race, gender or neighborhood
  - Features for first-generation/commuter status and housing instability drive predictions
  - Clamping demographically-loaded features doesn't change predictions

  But there's controversy because:
  - A friend re-ran the audit with a larger dictionary and found a race-correlated name feature
  - The vendor dismissed this as a "degenerate split" artifact
  - Half the board thinks the audit proves no protected attributes are used, while the other half thinks the audit methodology is flawed

  The user has been influenced by a seminar on representation in neural networks and wants to propose a substitution test to evaluate whether features actually represent concepts like race. They also note that even if race is represented, it might not be disqualifying since the intervention provides resources rather than denying them.

  I need to draft a memo with exactly six numbered items:
  1. The bottom-line recommendation
  2-6. Supporting points addressing:
     - Concrete action with timeline/responsibilities
     - Taking the vendor's anti-realist position seriously
     - Why that position still fails
     - Key vulnerabilities in the reasoning
     - What evidence could change the recommendation

  The recommendation should be one of: approve, approve with conditions, delay, or decline. Given the unresolved questions about representation and fairness, delaying for further testing seems most prudent.

  Important nuances to address:
  - The substitution test proposal (swap tokens between student records to see if scores change)
  - Distinguishing between representation existing versus being causally influential
  - Acknowledging that representing disadvantage isn't inherently bad here, but we need to know if students are flagged for wrong reasons
  - The vendor's argument that features are just coordinate systems we impose

  The memo should be concise (1-2 sentences per item), with no introduction or conclusion. I'll make item 1 the clear recommendation to delay rollout pending the substitution test, then build the logical case in subsequent points while acknowledging weaknesses.
answer: |-
  **Memo: Recommendation on Northgate Predictive Model Rollout**  

  1. **Recommend delaying rollout pending completion of a substitution test** by the ML lab within 4 weeks, with a board vote to follow within 7 days of receiving results.  

  2. **Direct the ML lab to conduct the substitution test**: For student pairs with divergent risk scores, swap tokens (e.g., names, zip codes) tied to contested dictionary features and measure score changes, reporting gaps that "travel" with swapped tokens versus context.  

  3. **The vendor’s anti-realist claim—that features are arbitrary decomposition tools—holds weight** if the substitution test reveals identical model behavior across all tested bases, implying no stable representation exists.  

  4. **However, this fails because inconsistent substitution outcomes** (e.g., token-swaps altering scores only in specific contexts or bases) would expose the model’s reliance on spurious correlations, making the audit’s "no demographic feature" claim untenable.  

  5. **Critical vulnerability**: If the substitution test shows *no* score changes when swapping putatively race-linked tokens—even under the larger dictionary—the vendor’s argument prevails, but this is unlikely given the replication.  

  6. **Recommendation hinges on substitution test results**: Approval requires no significant score gaps when swapping contested tokens; observed gaps demand model retraining or rejection to avoid misallocating resources based on biased triggers.
