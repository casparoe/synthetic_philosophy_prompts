prompt: |-
  I'm working on a magazine piece about governing by prediction markets — Robin Hanson's futarchy setup, where you vote on the values and let a market on conditional outcomes pick the policy — and I want one properly worked case rather then another think-piece about how it would work in principle. So: take the 2016 Brexit referendum and run it through futarchy.

  What I want is a real mapping, not vibes. Set out what a futarchy over Brexit would actually have had to look like: who sets the welfare metric, what the metric even is (GDP per capita? some wellbeing index?), when it gets measured, what the conditional contracts are, and what happens to the branch of the market that never gets adopted. Then say what the theory predicts would have come out as the decision, and what it would have predicted about the run-up.

  Facts I'm going from memory on, so take them as given rather than litigating them: the referendum was a straight binary, leave or remain; the bookies had Remain as a heavy favourite right through polling day, implied something like 75 to 90 percent, and were wrong; there were large liquid markets on the vote itself but essentially nothing on conditional outcomes like GDP-five-years-on; Leave won narrowly, turnout around 72 percent.

  Then the part I actually care about, where it breaks in both directions:

  1. The 2016 markets were not futarchic markets. They paid off on the vote, not on a welfare metric; they were thin-ish offshore books with favourite-longshot bias, sentiment money and no conditional-on-adoption contracts. So how much can this episode even tell us? Is the fact that the markets got Brexit wrong a genuine data point against futarchy, or a category error?

  2. The self-referential bit. In futarchy the market is supposed to be a thermometer, but its price is public and it *is* the decision. The odds were in the newspapers for months, and there is a plausible story that a confident Remain price depressed Remain turnout or energised Leave. Call it the performative prediction problem: the forecast feeds back into the thing forecast. Does the theory have any resources here, or does it simply assume the market is causally inert?

  3. The metric-and-horizon problem. Pick GDP per capita measured in 2021 and you get one answer; measure it in 2030 and you may get another, because the transition shock is immediate and the trade effects are slow. Whoever writes the metric and picks the date has already made most of the decision. How much of futarchy's content survives once you notice that?

  4. A wrinkle I have not seen handled and that I want taken seriously: distinguish price-side manipulation, where you trade to move the price, eat the loss on those trades and profit on the outcome, from what I would call outcome-side manipulation, where a trader can partly *cause* the variable being measured. In the Brexit case the obvious candidates are big financial institutions and the campaigns themselves. If a market is deep enough to be informative, is it not also deep enough for actors who can move GDP to profit by moving it? What, if anything, does the conditional-market design do about that?

  Close by saying whether the episode is an argument for futarchy, against it, or for a patched version — and give me the strongest version of the pro-futarchy reply to your own critique, because I do not want a piece where the theory is a strawman. Also be explicit about what futarchy simply has no opinion on here, such as whether to hold a referendum at all. Around 900 words if you can, and flag anything where you are filling in a fact I should check myself.
reasoning: |-
  Okay, the user is writing a magazine piece on governing by prediction markets, specifically Robin Hanson's futarchy. They want a concrete case study using the 2016 Brexit referendum instead of theoretical discussion. The main task is to map out how futarchy would have been implemented for Brexit: the welfare metric, conditional contracts, handling of unadopted branches, and what the outcome might have been.

  Breaking down the query, there are several key components. First, I need to define the futarchy setup for Brexit. That includes who sets the welfare metric—probably Parliament or a designated body. The metric itself is crucial; GDP per capita is a common choice, but wellbeing indices could be alternatives. The measurement horizon is a big issue here. If measured in 2021, Brexit might look bad due to immediate shocks, but by 2030, effects might differ. The conditional contracts would be tied to this metric, comparing Leave vs. Remain outcomes.

  The user provided facts: binary referendum, bookies favored Remain (75-90%), but Leave won. Markets existed on the vote but not on conditional outcomes. I need to address how futarchy's conditional markets differ from those actual betting markets. The fact that betting markets got it wrong isn't necessarily a strike against futarchy because they measure different things.

  The user has four specific areas they care about. First, whether the 2016 markets' failure is relevant to futarchy. Since those markets predicted the vote, not welfare outcomes, it's a category error. Futarchy markets would have different incentives and structures.

  Second, the performative prediction problem. Public prices could influence behavior, like depressing Remain turnout. Futarchy might counter this by keeping markets sealed until decision time, but that's tricky. Also, the decision market itself could affect the outcome, which futarchy doesn't fully address.

  Third, the metric-and-horizon problem. Choosing the metric and timeline is a political decision that can predetermine outcomes. For Brexit, a short horizon favors Remain, long might favor Leave. This is a major vulnerability for futarchy, as it outsources value judgments.

  Fourth, outcome-side manipulation. Traders who can influence GDP might profit by causing changes. Conditional markets might mitigate this by isolating policy effects, but it's not foolproof. Deep markets could attract manipulators with real-world influence.

  The user also wants a conclusion: whether Brexit is an argument for or against futarchy. I need to present a balanced view. The episode highlights implementation challenges like metric selection and manipulation risks. However, a pro-futarchy response would argue that current politics also suffers from these issues, and markets could aggregate information better if designed correctly.

  Underlying needs: The user likely wants to present a nuanced, evidence-based analysis. They might be skeptical but want to avoid strawman arguments. They need concrete examples to illustrate abstract concepts, making the piece engaging for readers. Also, emphasizing where futarchy has no solution (e.g., metric choice) adds depth.

  I should check assumptions: The 2021 vs. 2030 GDP figures. Actual data shows UK GDP per capita was lower than EU peers post-Brexit, but long-term effects are uncertain. Also, the lack of conditional markets in 2016 is factual. Highlighting these points for the user to verify is important.

  Finally, structuring the response clearly: map the futarchy setup, address each of the four points, then conclude with pros and cons. Balancing critique with the strongest pro arguments ensures fairness. Keeping around 900 words requires conciseness while covering all aspects.
answer: |-
  Here’s a concrete mapping of Brexit 2016 through a futarchy lens, addressing your core questions and critiques:

  **Futarchy Setup for Brexit:**
  1.  **Metric Definition:** Parliament (or a designated non-partisan body like the OBR) defines the welfare metric *before* the vote. Likely candidates:
      *   **GDP per capita (real, PPP-adjusted):** Most politically salient, measurable. *But:* Ignores distribution, non-economic factors.
      *   **National Wellbeing Index (e.g., ONS):** Broader, but less precise, harder to trade on.
      *   **Hybrid:** Weighted average (e.g., 70% GDPpc, 30% wellbeing). *Crucially, the choice here is highly consequential.*
  2.  **Measurement Horizon:** Defined upfront. Options:
      *   **Fixed Date (e.g., Jan 1, 2026):** Clear endpoint, but arbitrary; misses long-term effects or transition shocks.
      *   **Rolling Average (e.g., 2023-2027):** Smoothes volatility. *Horizon choice directly biases the outcome.* Short term favors Remain (avoids disruption), long term (10-15y+) *might* favor Leave (potential trade deal benefits, sovereignty gains). **This is a core vulnerability.**
  3.  **Conditional Markets:** Two parallel markets are created:
      *   **Market A: "Value of Metric [X] on Date [Y] IF UK votes to REMAIN."**
      *   **Market B: "Value of Metric [X] on Date [Y] IF UK votes to LEAVE."**
      *   **Structure:** Continuous double auction, likely run by a regulated exchange. Contracts settle based on the officially measured metric value at the defined horizon.
  4.  **Decision Rule:** On referendum day, the market prices (P_Remain, P_Leave) are compared. Whichever conditional market predicts the *higher* metric value wins. If P_Leave > P_Remain, the referendum result *should* be Leave (even if the vote itself goes Remain!). The vote becomes advisory; the market dictates the binding policy choice.
  5.  **Unadopted Branch:** The contracts for the policy *not* chosen expire worthless. Traders in the losing market lose their investments. This "sunk cost" is the price of generating the information.

  **Predicted Futarchy Outcome (Theory):**
  *   **The Vote vs. The Market:** The *vote prediction* markets (betting on Leave/Remain winning) got it wrong. A futarchy market predicts *welfare outcomes conditional on the policy*. These are fundamentally different.
  *   **Likely Futarchy Prediction (2016):** Given the near-universal consensus among economists, central banks (BoE), IMF, OECD, and most large financial institutions that Brexit would cause significant *short-to-medium term economic damage*, **Market A (Remain) would almost certainly have traded at a higher price than Market B (Leave)** in mid-2016. *Theory predicts the market would have recommended REMAIN.*
  *   **The Run-Up:** The P_Remain > P_Leave gap would likely have been wide initially, reflecting expert consensus. As the Leave campaign gained momentum and uncertainty grew, the gap might have narrowed, but Remain would likely remain favored. Volatility would spike around key events (e.g., BoE warnings, campaign claims).

  **Addressing Your Breakdowns:**

  1.  **2016 Markets vs. Futarchy: Category Error.**
      *   The betting markets predicted *the vote outcome*, not the *welfare consequence of the policy*. They suffered from sentiment (Remain complacency), favourite-longshot bias (underpricing Leave), and limited depth.
      *   Futarchy markets have different incentives: traders profit by accurately predicting the *objective metric value under each policy*, not by predicting voter sentiment. The conditional structure forces focus on policy impact. The 2016 vote markets failing tells us little about how well-designed conditional welfare markets would perform. It's not a direct data point *against* futarchy.

  2.  **Performative Prediction Problem: A Weakness.**
      *   **Problem:** Public P_Remain > P_Leave prices could demoralize Remain voters ("it's in the bag") and energize Leave ("fight the elite prediction"). The market itself influences the outcome it predicts. Campaigns might even trade to manipulate perceptions.
      *   **Theory's Resources? Limited.**
          *   Sealed-Bid Phase: Initial trading could be anonymous/aggregated until decision time (impractical for liquidity).
          *   Ignore It: Assume feedback effects cancel out or are small. (Weak).
          *   Acknowledge It: Hanson admits this is a challenge; the market price becomes a focal point influencing reality. Futarchy largely *assumes* the market is a passive thermometer, not an active furnace. This episode highlights that assumption's fragility.

  3.  **Metric-and-Horizon Problem: The Fatal Flaw for Brexit?**
      *   **This is paramount.** Choosing GDPpc vs. Wellbeing, or 2021 vs. 2030, pre-determines the likely answer.
      *   **2021 Measurement:** UK GDPpc significantly lagged comparable EU economies post-Brexit/Covid. *Futarchy (short horizon) would scream "Remain was better!"*
      *   **2030/35 Measurement:** Effects of new trade deals, regulatory divergence, investment patterns *might* materialize (highly uncertain). *Futarchy (long horizon) might be closer or even favor Leave.*
      *   **Survival of Futarchy?** The core mechanism – aggregating dispersed knowledge to predict policy impacts – survives. But **its output is entirely contingent on the politically charged, value-laden choices of the metric and horizon.** Who makes these choices, and how, becomes *the* critical question. Futarchy outsources "what to do" but not "what to value" or "when to judge."

  4.  **Outcome-Side Manipulation: A Serious Challenge.**
      *   **Price-Side:** Trading to move the price (e.g., a Remain campaign buys P_Remain contracts) is costly and self-correcting if others disagree. Deep markets absorb this.
      *   **Outcome-Side:** This is insidious. A large financial institution heavily invested in P_Leave could potentially take actions to *boost* short-term UK GDP after a Leave vote (e.g., orchestrate capital inflows, influence client investment) to profit, even if long-term harm is likely. Conversely, a pro-Remain entity could short P_Leave and *sabotage* the economy if Leave wins. Campaigns could trade based on non-public plans.
      *   **Conditional Markets' Defense?** They focus manipulation incentives *on the metric itself*. A trader must believe they can *move the specific metric* at the *specific horizon* enough to overcome trading costs and others' views. This is harder than simply betting on the vote. However, deep-pocketed, real-economy actors *can* influence GDP. Conditional markets don't eliminate this; they potentially channel it towards distorting the welfare metric. Regulation and surveillance are needed, but effectiveness is uncertain.

  **Conclusion: Argument Against, With Nuance & Pro-Futarchy Rebuttal**

  *   **Overall Verdict on Brexit Episode:** **It highlights major practical and philosophical weaknesses in futarchy, making it a cautionary tale rather than validation.** The metric/horizon problem is severe, outcome manipulation is plausible, and performative effects are likely. The episode likely would have produced a "Remain" recommendation that was ignored by voters, creating a crisis of legitimacy.
  *   **Strongest Pro-Futarchy Rebuttal:**
      *   **"Compared to What?":** Current democracy got Brexit disastrously wrong by its *own* standards (most voters likely expected economic improvement). Politics is *already* manipulable by money and distorted by emotion/ignorance. The 2016 vote was a vibes-based disaster.
      *   **Information Aggregation:** Despite flaws, deep conditional markets *would* have aggregated expert economic warnings far more effectively than the campaign rhetoric did. Voters ignored experts; a binding market outcome couldn't be.
      *   **Refinement, Not Rejection:** The problems (metric choice, horizon, manipulation) are *implementation* challenges, not fatal flaws. Better design (e.g., multiple metrics, sophisticated horizon definitions like discounted future flows, robust anti-manipulation protocols) can mitigate them. The core insight – markets aggregate dispersed knowledge about policy impacts better than votes – remains powerful. Brexit shows the cost of *not* using superior prediction tools for complex decisions.
      *   **Vote Stays Advisory:** Futarchy doesn't require a referendum; Parliament could define the metric and let the market decide policy directly. The referendum itself was a flawed mechanism.

  **Futarchy's Silence:**
  *   **Holding the Vote:** Futarchy says nothing about *whether* to decide an issue via its mechanism or via traditional politics/referendum. That's a prior political choice.
  *   **Defining the National "Good":** Choosing the welfare metric is explicitly outside futarchy's scope; it's a value judgment for the existing political process.
  *   **Implementing the Decision:** How the binding market outcome is enacted (e.g., by Parliament, executive) is a procedural detail.

  **Key Facts to Verify:**
  *   Pre-referendum economic consensus severity and specific GDP impact projections.
  *   UK GDPpc relative to EU peers in 2021/22/23 (ONS, Eurostat data).
  *   Exact structure and liquidity of 2016 betting markets (e.g., Betfair Exchange vs. bookmakers).

  This episode underscores that futarchy is not a magic bullet. It confronts profound questions about defining welfare, managing time horizons, and preventing manipulation in a way that pure theory often glosses over. However, its proponents would argue it still represents a potentially superior, if imperfect, alternative to the demonstrably flawed status quo exposed by Brexit.
