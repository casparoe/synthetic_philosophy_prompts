answer: |-
  The analogy "DNA is code" operates on a spectrum, stretching from uncontroversial observations to philosophically charged assertions that risk overextension. Let’s dissect the possible readings, then evaluate how each of the three uses in your interlocutor’s argument relies on specific versions—and where the slippage occurs.

  **The Spectrum of "DNA is Code"**  
  At its most trivial, "DNA is code" means DNA stores information via a sequence of discrete symbols (nucleotides), which is processed by cellular machinery to produce functional outputs (proteins, regulation). No biologist disputes this; it’s a platitude about information storage and transduction. Slightly less trivially, it acknowledges that the mapping between codons and amino acids is *contingent*: historical accident fixed the "genetic code," and variations exist (e.g., mitochondrial codons differing, or engineered organisms with unnatural base pairs). This supports "arbitrary" in the sense of *not logically necessary*, but not "arbitrary" as *ungrounded* or *infinitely malleable*. Constraints (biochemical, evolutionary) limit viable codes.  

  A more substantive reading posits DNA as a *program*: the genome contains not just data but *instructions* executed by cellular hardware, with logic analogous to software (e.g., regulatory elements as conditional switches). This is defensible but metaphorical; biological "execution" is massively parallel, stochastic, and context-dependent, unlike classical computation. The strongest reading—DNA as a *formal language* in a Gödel-relevant sense—claims it constitutes a syntactic system capable of universal computation and self-reference, inviting incompleteness. This is where the analogy frays. Biological systems aren’t axiomatic formal systems; they’re physical processes.  

  **Evaluating the Three Uses**  
  1. **"Genome as source code"**:  
     - *Required reading*: The "program" metaphor (substantive).  
     - *Viability*: Partial. While DNA specifies components and some regulatory logic, the organism’s form and function emerge from dynamic interactions far beyond genetic "instructions" (e.g., epigenetics, physics, environment). Calling it "source code" overstates top-down control. It’s plausible only if adjacent to the platitude (information storage).  

  2. **"No fact of the matter about meaning apart from translation machinery"**:  
     - *Required reading*: "Arbitrary convention" (substantive/strong).  
     - *Viability*: Misleading. While codon assignments are contingent, "meaning" here is teleonomic: a gene’s function is its evolutionary-selected effect in a cellular context. The ribosome doesn’t *assign* meaning arbitrarily; it executes a mapping constrained by physics and natural selection. Your hypothetical organism (context-dependent codon mapping) still operates under stable rules + context—it doesn’t make meaning "arbitrary," just dynamic. The real-world code variations support contingency, not free-floating convention.  

  3. **"Cell as hardware, genome on a wiped drive is inert"**:  
     - *Required reading*: Platitude (DNA requires cellular machinery for expression).  
     - *Viability*: True but trivial. This doesn’t imply the stronger claims. A book is inert without a reader, but that doesn’t make text a "formal system."  

  **The Quine Angle and Self-Reference**  
  Your "more interesting version"—where DNA encodes its own decoder (tRNAs, synthetases)—isn’t identical to "DNA is code." It’s a *special case* emphasizing closure and self-specification. This *is* reminiscent of Gödel numbering (a system encoding statements about itself), making it the only plausible hook for incompleteness. However, biological self-reference is mechanistic, not logical. The ribosome translates mRNA but doesn’t "interpret" the genome reflexively; it’s a molecular machine, not a theorem-generator. Typogenetics abstracts this into a formal system, but biology isn’t axiomatic—it’s causal. Gödelian incompleteness arises from *logical* self-reference in systems capable of arithmetic, which cells don’t manifest.  

  **Is "Code" a Property of DNA or the System?**  
  "Code" inherently implies an encoder/decoder relationship. DNA alone isn’t a code; it’s a molecule. Only within the evolutionary context of a cell (or engineered system) does it function symbolically. Thus, "DNA is code" is shorthand for "DNA functions as a coded template in biological systems." The claim *is* about the molecule, but only via its relational properties.  

  **The Gödel Bridge: Where the Plank Breaks**  
  Moving from "code" to "Gödel applies" requires leaps:  
  - DNA as a *formal system*: But biology isn’t formalized axioms; it’s physics and chemistry.  
  - Capable of *encoding arithmetic*: No evidence genetic processes model Peano arithmetic.  
  - *Self-referential* in the logical sense: The quine-like structure is physical, not propositional.  

  The weakest plank is conflating *physical* self-specification (DNA → ribosome proteins) with *logical* self-reference ("this statement is unprovable"). Biological systems avoid paradox through material constraints; formal systems hit limits through abstraction. Gödel’s theorem is relevant to *models* of biology (e.g., computational simulations) but isn’t a constraint on evolution itself.  

  **Conclusion**  
  Your interlocutor’s argument works only if "DNA is code" slides unnoticed from platitude (DNA stores information) to strong claim (DNA is a formal language with arbitrary semantics). The quine-like structure is real but doesn’t license the Gödel leap—it’s a metaphor for self-organization, not incompleteness. The mitochondrial code or engineered bases show frozen contingency, not free arbitrariness. "Codes are arbitrary conventions" is defensible only in a weak historical sense; in practice, meaning is fixed by function. The core confusion is treating biology as syntax without semantics, when in fact its "meaning" is anchored in survival. Gödel here is decorative, not probative—a misstep in a long tradition of overextending incompleteness. Your hazy unease is warranted: the analogy illuminates until it overreaches, and that’s where the thread snapped.
