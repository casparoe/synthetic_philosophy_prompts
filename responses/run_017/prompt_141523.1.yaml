prompt: |-
  On a LessWrong-adjacent comment thread last week — the usual argument about whether Gödel's incompleteness theorem has anything to say about biology — someone tossed off "but DNA is code, obviously" and then used it three times in as many paragraphs: first, that the genome is literally the organism's source code; second, that because codes are arbitrary conventions there's no fact of the matter about what a gene "means" apart from whatever the translation machinery happens to do with it; third, that the cell is the hardware interpreting the software, so a genome sitting in a test tube is like a program on a wiped drive. I've been nodding along to that sentence for years and I realized I can't say what it actually commits me to, which is a bit embarrassing given I've read GEB twice and have loud opinions about typogenetics.

  So: what are the different precise claims "DNA is code" could be making, from something nobody would deny to something that would be big news if it were true? I want the menu, not your favourite item — though do tell me which readings are platitudes, which are substantive and defensible, and which are straightforwardly false or confused. And the part I actually care about: for each of those three uses, which reading would have to be the true one for his argument to work, and does that reading stand up on its own, or is it only plausible-sounding because it's sitting next to the platitude version?

  A couple of things I want folded in. First, there's a version of the claim that strikes me as more interesting than any of his: the translation machinery — the tRNAs, the synthetases, the ribosome — is itself encoded in the genome, so what we've got isn't a code plus an external reader but something closer to a quine, a description that contains a specification of its own decoder. That's roughly the isomorphism with Gödel that typogenetics is gesturing at. Is that self-referential version the same claim as "DNA is code", a special case of it, or a different claim that merely sounds like it? And is it the only reading on which incompleteness is even faintly relevant, as opposed to decorative?

  Second, a case I made up to seperate the readings, since I can't run experiments: imagine an organism we discover or build whose codon-to-amino-acid mapping isn't a fixed table at all but depends on how the transcript is folded, which in turn depends on the cell's current metabolic state — so no complete lookup table exists, only a rule plus a context. Which of your readings call that "code" and which don't, and is your verdict there doing real work or just stipulating? Related: I have a hazy memory that the mitochondrial code differs slightly from the standard one and that somebody engineered an expanded alphabet with extra base pairs — tell me if I've got that wrong — and if it's right, does it support the "codes are arbitrary" reading, or only the weaker point that a frozen convention can still be frozen?

  Also, is being-a-code a property of the molecule, or of the molecule together with a reader? If it's the latter, does "DNA is code" quietly stop being a claim about DNA at all?

  Last thing: on any of these readings, does the step from "code" to "formal system" to "so Gödel applies" get licensed, or is that a separate and much shakier bridge? I think that's where the thread went off the rails but I can't locate the exact plank that broke.

  Write it in continuous prose — no headings, bullet points, bold text, or tables. I'm pasting it into an email to the guy I was arguing with and markdown would make it look like I'm trying to win by formatting.
