answer: |-
  Here is the strongest case for two-track contextualist counterpart theory, argued from your friend’s perspective. I’ll address the stock complaints, your embedding objection, the costs, track selection, and the metaphysics of worlds—marking stipulations, common ground, and contested claims as we go.

  ### Core Argument: Why Two Tracks?
  **Common ground (widely granted):** Modal judgments about artifacts (like the cello) exhibit gradation and question-sensitivity. In "graduated origin":  
  - High acceptance: "This cello could have been made from a different branch of the same tree."  
  - Instability: "Could it have been made from a genetically identical tree?" (varies by speaker/context).  
  - Low acceptance: "Could it have been a viola made from the same wood?"  
  Further, asking "Could this cello have different wood?" vs. "Could *that* instrument be this cello?" shifts verdicts.  

  **Contested claim (but defensible):** This pattern reveals *two distinct metaphysical dimensions* at work:  
  1. **Resemblance:** How similar is the candidate object in intrinsic/functional properties?  
  2. **Origin:** How much causal-historical overlap is there with the actual object’s genesis?  
  No single invariant relation (like primitive transworld identity) can capture this split because identity is all-or-nothing and one-to-one. It forces a binary "same/different" verdict per world, erasing the observed gradations and context-dependence.  

  **Stipulation of the framework:** We formalize this with two counterpart relations:  
  - **Resemblance track (RT):** Counterparts maximize qualitative similarity in *contextually salient respects*.  
  - **Origin track (OT):** Counterparts lie at the end of the *actual-world causal chain* producing the object. No chain? No counterpart.  
  Context selects the track. No selection? No truth value—this *correctly mirrors indeterminacy* in our judgments (e.g., the genetically identical tree case).  

  ### Answering the Stock Complaints (in Her Terms)
  1. **"De re claims aren’t about the original object!"**  
     *Reply:* True, but irrelevant. De re modality is *essentially representational*. When we say "Nixon could have lost," we use "Nixon" to pick out a *role* in our conceptual scheme (cf. how "the President" refers to different people across contexts). RT and OT are tools for filling that role in other worlds based on context. This isn’t a bug—it explains why we sometimes say "It wouldn’t *really* be Nixon if he were a robot."  
     **Cost:** We give up the intuition that modality is about *strict identity*. But primitive thisness is mysterious and unexplanatory for gradation.  

  2. **"Intransitivity breaks modal logic!"**  
     Suppose RT-counterparts aren’t transitive: World 1’s \(a\) resembles W2’s \(b\), which resembles W3’s \(c\), but \(a\) doesn’t resemble \(c\). Then "Possibly possibly P" doesn’t imply "Possibly P."  
     *Reply:* This is a *virtue*. Ordinary language modal reasoning *is* context-sensitive and path-dependent. Example: "This lump could have been a statue (RT), and that statue could have been shattered (RT), but this lump couldn’t have been shattered (OT—lumps aren’t statues)." We reject S4 transitivity *when tracks shift*, but within a fixed track/context, transitivity holds.  
     **Contested claim:** That this matches linguistic practice better than enforcing universal transitivity. If you insist transitivity is sacrosanct, the argument breaks here.  

  3. **"Interest-relative similarity is hopeless!"**  
     *Reply:* Yes, RT is interest-relative—but OT isn’t. OT fixes reference via objective causal history (e.g., the actual tree’s material continuum). We *need* both: RT handles "what if" scenarios (e.g., "What if Nixon were kinder?"); OT handles historical essence ("This cello *must* derive from this wood"). Context tells us which "need" is in play.  

  ### Your Embedding Objection: Defending the Reply
  Your case:  
  > "This cello could have been made of a different plank [RT], and then it could have been finished slightly differently [OT?]."  

  **Stipulation of the framework:** Tracks are *never composed* across operators. The inner modal operator inherits the track of the outermost one. Thus:  
  - If the outer operator uses RT: The whole sentence means "There’s an RT-counterpart of this cello made of different plank, and *that counterpart* has an RT-counterpart finished differently." True.  
  - If the outer operator uses OT: "There’s an OT-counterpart made of a different plank" is false (no causal chain to that scenario), so the whole sentence is false.  
  There is no hybrid reading where the first modal uses RT and the second uses OT.  

  **Defense:**  
  - **Linguistic data:** We don’t naturally parse such embeddings as switching "modes." If we say, "Nixon could have been a Democrat, and then he could have been impeached," both clauses concern the *same conceptual role* (Nixon-as-politician), fixed by the initial context.  
  - **Avoids inconsistency:** Mixing tracks would license contradictions. E.g., "This cello couldn’t have been from different wood (OT true) but could have (RT true)."  
  - **Flat discourse shifts:** Apparent mixing arises when clauses are *implicitly* separate assertions: "This cello could have had different wood [RT]. And [now shifting to OT] that instrument could have been finished differently." This is pragmatic, not syntactic.  

  **Contested claim:** That operators inherit tracks top-down. A rival view might allow context shift mid-sentence, but this risks incoherence. If inheritance is rejected, the embedding objection stands.  

  ### What the View Gives Up and Its Costs
  1. **Metaphysical simplicity:** Primitive thisness offers a unified, context-invariant account of transworld identity. We sacrifice this for flexibility.  
  2. **Determinacy:** We accept truth-value gaps when context doesn’t select a track. If you insist all meaningful questions have answers, this is a cost.  
  3. **Track-selection mechanism:** How does context choose? **Contested claim (critical):** Selection isn’t circular. It’s guided by *conversational focus*:  
     - Focus on material composition? → RT dominates.  
     - Focus on historical identity? → OT dominates.  
     (e.g., "Could *this very cello* have different wood?" emphasizes history, favoring OT; "Could there be a cello like this but with different wood?" favors RT).  
     If this pragmatic explanation fails, track selection becomes mysterious.  

  ### Worlds: Abstract or Concrete?
  - **Common ground:** Worlds can be abstract representations (e.g., maximally consistent sets of propositions).  
  - **Problem for OT:** OT relies on a *causal chain* from the actual object. If worlds are abstract, what grounds the "chain" between representations?  
  - **Stipulation/Contested claim:** OT requires *concrete worlds* (as per Lewis). The causal chain is a physical/historical relation across concrete parallel universes. If you reject concrete worlds, OT collapses into a resemblance relation (e.g., "same origin" as a qualitative feature), undermining the two-track distinction. **Thus, the view likely needs the heavier metaphysical package.**  

  ### Where Your Statement Does Heavy Lifting
  Your framing of "graduated origin" as exhibiting *two distinct axes* (similarity vs. history) is crucial. Without this data, the case for two tracks weakens. A transworld-identity theorist might retort that gradation reflects *epistemic* uncertainty, not metaphysical indeterminacy—but your friend’s view takes the data at face value.  

  **In summary:** Two-track contextualism explains graded, question-sensitive modal judgments by positing two counterpart relations selected by context. It embraces (and explains) the stock complaints, handles embedding via track inheritance, and sacrifices invariance for flexibility. Its viability hinges on accepting contextualism in metaphysics, concrete worlds for OT, and pragmatic track selection—all contested but defensible. If these fail, primitive transworld identity stands, but at the cost of ignoring the nuances in our modal talk.
