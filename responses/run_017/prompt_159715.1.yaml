answer: |-
  Here is a precise translation into your vocabulary, a residue report, and the requested scorecard. I've structured it as: (1) Taxonomy mapping, (2) Role-split analysis, (3) Collapse interpretations, (4) Residue report, and (5) Scorecard.

  ---

  ### 1. **Taxonomy Mapping (T1-T5)**
  - **ψ-ontic (non-overlapping)**: Asserts the quantum state is **T1** (a complete specification).  
    - *Mapping*: One-to-one for pure states. Each pure state corresponds to a unique physical reality ("complete state"). Distributions for distinct pure states have disjoint support in the underlying physical state space.  
    - *Wedging*: No wedging needed. The non-overlap requirement directly implies T1.

  - **ψ-epistemic (overlapping)**: Asserts the quantum state is **T3** (a measure over complete states).  
    - *Mapping*: Direct fit. The quantum state is a credence function over an unknown "complete state" (a T1 item). Distinct quantum states can overlap (share support) in the space of complete states.  
    - *Vacant slots*:  
      - T2 (incomplete specification) is *not* equivalent to T3. T2 is a coarse-grained state (e.g., macrostate), not a distribution.  
      - T4 (fixed parameter) and T5 (structural) are incompatible with both views.  

  ### 2. **Role-Split Analysis**  
  The quantum state’s three jobs can be split across taxonomy slots:  
  - **Dynamical job** (governed by Schrödinger equation):  
    - ψ-ontic: T1 (evolving complete state).  
    - ψ-epistemic: T3 (evolving credence).  
    - *Split option*: **T5 for dynamics + T3 for prediction/information**.  
      - Coherent? Yes. The Schrödinger equation could describe how *knowledge constraints* evolve (T5: structural rule), while the state remains epistemic (T3).  
      - Real option? "Quantum Bayesianism" (QBism) does this: dynamics as normative rule for updating beliefs.  
      - Cost: Schrödinger evolution becomes non-physical (a calculus of rationality), violating intuition that dynamics describes objective change.  

  - **Predictive job** (Born rule probabilities):  
    - Both views use T3 *operationally*, but ontologically diverge:  
      - ψ-ontic: Probabilities arise from incompleteness in *measurement* (not the state itself).  
      - ψ-epistemic: Probabilities reflect incompleteness in the *state*.  

  - **Informational job** (post-preparation knowledge):  
    - ψ-epistemic: Naturally T3 (credence based on preparation).  
    - ψ-ontic: T1, but preparation *selects* an ontic state; information is *which* T1 state exists.  

  - **Verdict**: Split verdicts are coherent and held (e.g., QBism: T5 dynamics, T3 prediction/information).  

  ### 3. **Collapse Interpretations (Translated)**  
  - **Stochastic collapse** (e.g., GRW):  
    - *Vocabulary*: **Real physical process** (like coarse-graining but irreversible).  
    - *Fudge*: Violates Hamiltonian flow (irreversible, non-unitary).  

  - **Guiding + hidden variables** (e.g., de Broglie-Bohm):  
    - *Vocabulary*: **Change of gauge** (quantum state guides particles; collapse updates effective "map").  
    - *Fudge*: The quantum state is T1 for dynamics (pilot wave) but T3 for particles (Born statistics).  

  - **Branching without collapse** (Everett):  
    - *Vocabulary*: **Coarse-graining** (agents track one branch, ignoring others).  
    - *Fudge*: "Coarse-graining" here is ill-defined—branches aren’t pre-existing macrostates.  

  - **Collapse as updating** (QBism, Copenhagen):  
    - *Vocabulary*: **Conditioning on new data**.  
    - *Your worry addressed*: Yes, it *illegitimately* presupposes a pre-existing value. Conditioning requires a sample space, but measurements *create* outcomes (no prior value). This is the **central flaw** in purely epistemic collapse.  

  ---

  ### 4. **Residue Report: What Your Vocabulary Cannot Hold**  
  - **Configuration space**:  
    - Quantum states live in high-dimensional Hilbert space, not 3N-phase space. Your vocabulary assumes a *classical* microstate space (e.g., Γ-space). Quantum "complete states" (if any) are non-separable (e.g., entangled)—no local microstates exist.  
    - *Defect*: In your framework. Debate cannot grant separable microstates.  

  - **Complex phase**:  
    - Phase differences cause interference (e.g., in two-slit statistics). A classical probability distribution over microstates cannot reproduce this.  
    - *Defect*: In your vocabulary. T3 cannot capture phase without ad-hoc additions.  

  - **Epistemic no-gos**:  
    - PBR theorem: If quantum predictions hold, overlapping ψ-epistemic models are impossible *if* the underlying physical state is preparation-independent.  
    - *Defect*: Philosophical claim is clear, but your vocabulary lacks tools to express the independence assumption naturally.  

  - **Silent assumptions in your framework**:  
    - Microstates are separable and pre-measurement definite.  
    - Conditioning assumes a sample space with pre-existing values.  
    - These are *denied* by quantum formalism and central to the debate.  

  ---

  ### 5. **Scorecard**  
  | Type | Score (0–1) | Key Evidence to Move Score |
  |------|-------------|----------------------------|
  | T1   | 0.2         | **Nonlocality/contextuality**: Systems lack local definite properties (Bell/Kochen-Specker). Score ↑ if hidden variables work. |
  | T2   | 0.0         | No view treats ψ as coarse-grained but non-probabilistic. |
  | T3   | 0.6         | **Born rule success**: Predicts statistics perfectly. Score ↓ if PBR/contextuality block overlap. |
  | T4   | 0.3         | **Universal constants**: ψ’s form is fixed (e.g., spin-½ Hilbert space). Score ↑ if ψ varies with system. |
  | T5   | 0.7         | **Dynamical universality**: Schrödinger equation applies to all systems. Score ↓ if ψ is measurable directly. |

  ---

  **Translation Integrity Check**:  
  - Your vocabulary *strained* at conditioning (presumes pre-existing values) and phase.  
  - Residue confirms classical baggage: separable microstates, definite properties.  
  - The T1/T3 split for ψ-ontic/epistemic held, but T5 emerged as viable for dynamics.  
  - No silent assumptions added; your framework’s classicality was exposed.
