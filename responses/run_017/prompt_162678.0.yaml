     - In pinning rounds, the pin can be issued during a debater's own rebuttal time.
  - 13-14 min: Judge decides and records verdict and confidence.
  - 14-15 min: Collect scorecards.

  But in pinning rounds, if a pin is issued and the judge verifies, the debate ends early.

  Lookup: when a judge wants to verify a claim, they raise their hand and you (the oracle) come over. They tell you the claim (e.g., "they claim the standard deduction increased by $350") and you say true or false. You have a lookup budget: 2 tokens per judge per round. Each lookup costs one token.

  Displaying results:

  After each round, collect the judge decisions. Then during the data collection time (5 minutes after round4), you display a summary per round:

  Round1: 
     Number of judges: X
     Accuracy: Y% (number of correct verdicts)
     Average confidence for correct verdicts: Z1
     Average confidence for incorrect verdicts: Z2

  Similarly for rounds2,3,4.

  You can make a table on a whiteboard.

  Debrief (20 minutes):

  Map the rounds to the debate idea:

  - Round1 (unrestricted): This is like the current situation. Debaters can use any arguments, including made-up facts and authority. Judges may be swayed by style.
  - Round2 (pinning): This is the debate proposal. It allows a debater to force the judge to check a specific claim. Honest debater can use it to expose lies. But if the judge doesn't check, it doesn't work.
  - Round3: Here we see a failure mode: the false debater can use a true but irrelevant fact and pin on it, then claim it settles the issue. Judges may be fooled if they don't understand what is decisive.

  Key moment: In round3, we want judges to notice that a true claim might not be decisive. And that even if a claim is verified, it doesn't mean the side is correct.

  Also, in round2, if judges don't use their lookups, then pinning doesn't help.

  Predictable problems:

  - Debaters colluding: They might agree to not pin or to make it easy. To prevent, we assign sides randomly and make it competitive by scoring. Also, the point incentives are for winning, so they should try to win.
  - Going easy: Remind them that they are being paid to participate and the points are for fun, but we want to simulate a real debate. Encourage competition.
  - Confident side winning on style: This is what we want to show in round1 and then see if pinning reduces it.
  - Anchoring on first speaker: We can randomize who speaks first in each round.
  - Recognizing the setup: Since we don't name it, it might not be recognized. If someone does, we can say we'll discuss at the end.
  - Oracle leaking: You, as the oracle, must be neutral. When answering lookups, say only "true" or "false" without tone.

  What the game cannot reproduce:

  - How the debaters are produced: in reality, the debaters are AI systems optimized to win debates. In the game, the debaters are humans who know the truth and are incentivized to win.
  - Claims that are checkable in principle but not by this judge: in the game, you are the oracle and can check anything. In reality, the judge might not have access to the verification mechanism.

  At the end, you have to say: 

  "This exercise illustrates the debate model for aligning AI systems. The idea is that by having two AI systems debate, with the ability for a human to check specific claims, we can scale oversight. However, as seen in round3, if the judge cannot tell which claims are decisive, then even with verification, they might be misled. Also, if the judge doesn't check, then the system fails. In your work, when rating answers, you might be rewarding authoritative-sounding but unverifiable claims. We need to focus on claims that are both checkable and decisive."

  Starter set of 6 questions (we use 4 in the workshop and have 2 spare):

  Question 1: Tax
     Question: "In 2020, what was the standard deduction for a single filer under age 65 in the fictional country of Taxonia? (in dollars)"
     Intuitive answer: 12400
     Correct answer: 12550
     Facts:
        - The standard deduction in 2019 was 12200.
        - The inflation adjustment for 2020 was 350.
        - The deduction is increased by 200 for filers over 65.
        - The adjustment is based on the Consumer Price Index.
        - The law requires rounding to the nearest 50 dollars after adjustment.

     Decisive: The standard deduction in 2020 = 12200+350 = 12550.

  Question 2: Medical coding
     Question: "What is the ICD-10 code for a patient with essential hypertension?"
     Intuitive answer: I10 (which is correct, but we want it to be counterintuitive? Let's change the question)
     Revised: "What is the ICD-10 code for a patient with hypertension and stage 3 chronic kidney disease?"
     Correct answer: I12.9
     Intuitive: I10 (essential hypertension) or N18.3 (CKD stage3)
     Facts:
        - Essential hypertension is coded as I10.
        - Hypertension with kidney involvement is coded as I12.
        - The code I12.0 is for hypertension with kidney disease and stage 1-4 CKD.
        - The code I12.9 is for hypertension with kidney disease without mention of stage.
        - The code N18.3 is for stage 3 chronic kidney disease.

     The question: "The patient has hypertension and stage 3 chronic kidney disease. The hypertension is due to the kidney disease. What is the primary code?"
     Correct: I12.9 (if we assume it's not specified) or I12.0? But let's say the guideline says to use I12.9 when the stage is not specified in the same code. Actually, it's complicated.

     We make it: "The patient has hypertensive chronic kidney disease, stage 3. The medical record does not specify whether the hypertension or kidney disease came first. What is the code?"
     Correct: I12.9 (hypertensive kidney disease, unspecified) + N18.3 (stage 3). But that's two codes. We want one code.

     Let's choose a simpler one.

     Question: "What is the CPT code for a follow-up office visit lasting 25 minutes with an established patient, with no medical decision making of high complexity?"
     Intuitive: 99214 (which requires 25 minutes and moderate complexity)
     Correct: 99213 (because without high complexity and only 25 minutes, it might be 99213 if the complexity is low)

     But we want a single fact.

     Let's do: "What is the ICD-10 code for acute appendicitis without perforation or abscess?"
     Intuitive: K35.9 (which is for unspecified)
     Correct: K35.80 (for acute without peritonitis)

     Actually, K35.89 is for other acute appendicitis. 

     We use:
     Question: "What is the ICD-10 code for acute appendicitis with localized peritonitis?"
     Correct: K35.2
     Facts:
        - K35.0 is for acute appendicitis with generalized peritonitis.
        - K35.2 is for acute appendicitis with localized peritonitis.
        - K35.3 is for acute appendicitis without peritonitis.
        - K35.8 is for other acute appendicitis.

     The intuitive might be K35.0 because peritonitis is often generalized.

     So we have a decisive fact: "K35.2 is for acute appendicitis with localized peritonitis."

  Question 3: History
     Question: "In what year did the first moon landing occur?"
     Intuitive: 1969
     Correct: 1969 -> but we want it to be counterintuitive. 
     We change: "In what year did the first human spaceflight occur?"
     Intuitive: 1961 (Gagarin)
     Correct: 1961 -> not counterintuitive.

     Let's do: "In what year did the first satellite, Sputnik, launch?"
     Intuitive: 1957
     Correct: 1957.

     We make up: "In what year did the first American satellite, Explorer 1, launch?"
     Intuitive: 1958 (correct) -> not counterintuitive.

     We do: "In what year did the first spacewalk occur?"
     Intuitive: 1965 (by Leonov)
     Correct: 1965.

     We pick: "In what year did the first docking of two spacecraft occur?"
     Intuitive: 1966 (Gemini 8?)
     Correct: 1966 (Gemini 8 in March 1966)

     Not counterintuitive.

     Let's choose a different topic: "When was the first email sent?"
     Intuitive: 1971
     Correct: 1971 (by Ray Tomlinson)

     We make up a fictional one for the workshop:

     Question: "In the history of computing, when was the first integrated circuit invented?"
     Intuitive: 1958 (by Jack Kilby at Texas Instruments)
     Correct: 1958 -> but we want it to be 1959? Actually, Robert Noyce also did it in 1959.

     We say: 
     Question: "When was the first integrated circuit patented?"
     Intuitive: 1958 (Kilby's patent filed in 1959, granted in 1964)
     Correct: 1959 (Noyce filed in 1959, granted in 1961) -> but the patent was granted later.

     We'll use:
     Facts:
        - Jack Kilby of Texas Instruments built the first working IC in 1958.
        - Robert Noyce of Fairchild Semiconductor invented the monolithic IC in 1959.
        - Kilby filed a patent in February 1959.
        - Noyce filed a patent in July 1959.
        - The first patent was granted to Noyce in 1961.
        - Kilby was awarded the Nobel Prize in 2000.

     The question: "In what year was the integrated circuit invented?" 
     We want the correct answer to be 1959? But 1958 is also correct.

     This is messy.

     We do: "When was the first microprocessor, the Intel 4004, introduced?"
     Intuitive: 1971
     Correct: 1971 -> not counterintuitive.

     We design a fictional example for the workshop:

     Question: "In the country of Technologia, when was the first computer virus discovered?"
     Intuitive: 1986 (Brain virus in real life)
     Correct: 1984
     Facts:
        - In 1983, a researcher demonstrated a self-replicating program.
        - In 1984, a student at Technologia University created a virus that spread on the university's mainframe.
        - The virus, called "TechVax", was discovered in December 1984.
        - It was not until 1986 that a virus was found on personal computers.

     Decisive: "The first virus in Technologia was discovered in 1984."

  Question 4: Geography
     Question: "What is the capital of Australia?"
     Intuitive: Sydney
     Correct: Canberra
     Facts:
        - Sydney is the largest city.
        - Melbourne was the capital until 1927.
        - Canberra was established as the capital in 1913.
        - The Parliament moved to Canberra in 1927.
        - Canberra is located in the Australian Capital Territory.

     Decisive: "Canberra is the capital of Australia."

  Question 5: Science
     Question: "What is the atomic number of the element with the symbol Pb?"
     Intuitive: 82 (correct) -> we want it to be counterintuitive? 
     We change: "What is the atomic number of the element discovered by Marie Curie?"
     Intuitive: 88 (radium)
     Correct: 84 (polonium) or 88? She discovered both. Polonium was first.

     Facts:
        - Marie Curie discovered polonium in 1898.
        - Polonium has atomic number 84.
        - She discovered radium later in 1898.
        - Radium has atomic number 88.

     The question: "What is the atomic number of the first element discovered by Marie Curie?"
     Correct: 84 (polonium)

     Intuitive: 88 (radium is more famous)

  Question 6: Pop culture (if appropriate)
     Question: "In what year was the first Star Wars movie released?"
     Intuitive: 1977
     Correct: 1977 -> not counterintuitive.
     We do: "In what year was the first James Bond movie released?"
     Intuitive: 1962 (Dr. No)
     Correct: 1962.

     We make up: "In what year was the first color television broadcast made in the United States?"
     Intuitive: 1954
     Correct: 1951 (CBS, but not widely available) or 1954 (NBC)? Let's say 1954.
     But we want counterintuitive.

     We do: "In what year was the first email sent between two computers on different networks (i.e., the first internet email)?"
     Intuitive: 1971
     Correct: 1971 (within ARPANET) -> not counterintuitive.

     We design a fictional one for the workshop:

     Question: "In what year did the first movie with synchronized sound (talkie) win the Academy Award for Best Picture?"
     Intuitive: 1927 (The Jazz Singer, but it didn't win)
     Correct: 1929 (Wings, the first winner, was a silent film; the first talkie to win was in 1929-30, which was All Quiet on the Western Front? But Wings won in 1929 and was silent. The first talkie winner was The Broadway Melody in 1929 for the 1928-1929 award year? Let's use real but obscure.)

     We use:
     Facts:
        - The first Academy Awards were for films released in 1927 and 1928.
        - The first winner for Best Picture was Wings (1927, silent film).
        - The first talkie to win Best Picture was The Broadway Melody, for the 1928-1929 award year (awarded in 1930).
        - The Jazz Singer (1927) was the first feature-length talkie but did not win.

     Question: "What was the first year that a talkie won the Best Picture Oscar?"
     Correct: 1929 (for the 1928-1929 season, awarded in 1930) -> we say the year of the award? or the film year? Let's say the film's release year: 1929.
     Intuitive: 1927.

     So the answer is 1929.

     Facts:
        - The first talkie movie was The Jazz Singer, released in 1927.
        - The first talkie to win Best Picture was The Broadway Melody, released in 1929.
        - The award for Best Picture at the 2nd Academy Awards (for 1928-1929) went to The Broadway Melody.
        - The 1st Academy Awards (for 1927-1928) had only silent films.

     Decisive: "The first talkie to win Best Picture was released in 1929."

  We have 6 questions. For the workshop, we use 4.

  Test for replacements: 
  - The question should have an intuitive answer that is compelling but wrong.
  - The correct answer should be a single fact (number, name, date) that can be verified.
  - The arguments should be followable without domain expertise, given the dossier of facts.

  Now, the detailed timeline for the workshop:

  - 0-5 min: Introduction
     - Explain roles: debaters and judges. Judges will evaluate arguments and record verdict and confidence.
     - Explain the scoring: debaters get points for persuading the judge; judges get points for accuracy and are penalized for overconfidence when wrong.
     - Mention that there will be four rounds with different rules.

  - Round 1 (5-20 min): Unrestricted Argument
     - 5-7 min: Distribute materials for round1. Assign groups and roles. The two assistants help distribute.
     - 7-9 min: Debaters prepare.
     - 9-12 min: True debater presents.
     - 12-15 min: False debater presents.
     - 15-18 min: Rebuttal (each 1.5 min).
     - 18-19 min: Judge records verdict and confidence.
     - 19-20 min: Collect scorecards.

  - Round 2 (20-35 min): Pinning Rule
     - 20-22 min: Distribute materials for round2. Reassign groups and roles. Rotate assistants.
     - Explain the pinning rule: during rebuttal, a debater can issue a pin. The judge has 2 lookup tokens. If the judge verifies and the claim is true, the pinning debater wins. If false, they lose. If not verified, debate continues.
     - 22-24 min: Debaters prepare.
     - 24-26 min: True debater presents.
     - 26-28 min: False debater presents.
     - 28-31 min: Rebuttal (and possible pinning). If a pin is issued and verified, the round may end early for that group.
     - 31-34 min: If no early end, judge records verdict and confidence.
     - 34-35 min: Collect scorecards.

  - Round 3 (35-50 min): Pinning with True Non-Decisive Facts
     - 35-37 min: Distribute materials. Reassign groups and roles.
     - Explain: same as round2, but the false debater is allowed to pin on a true fact that is not decisive (i.e., it doesn't settle the question). They will be told this in their instructions.
     - 37-39 min: Debaters prepare.
     - 39-41 min: True debater presents.
     - 41-43 min: False debater presents.
     - 43-46 min: Rebuttal and pinning.
     - 46-49 min: Judge records verdict and confidence.
     - 49-50 min: Collect scorecards.

  - Round 4 (50-65 min): Pinning Rule (again)
     - Same as round2, with new question and reassigned roles and sides.

  - 65-70 min: Data collection and display.
     - You quickly tabulate for each round:
          Number of correct judge verdicts.
          Average confidence for correct verdicts.
          Average confidence for incorrect verdicts.
     - Write on whiteboard.

  - 70-90 min: Debrief.
     - Start by asking participants what they noticed in the different rounds.
     - Guide them to observe:
          In round1, how did they decide? Were they fooled by style?
          In round2, did pinning help? Did judges use lookups? Were they cautious?
          In round3, were there pins that were true but misleading? How did that feel?
     - Then connect to the actual work: they are the judges for model-generated answers. They must look for verifiable and decisive claims.
     - Finally, name the debate idea and its failure modes.

  This is a comprehensive design. Given the constraints, it should fit in 90 minutes.
answer: |-
  Below is a complete, ready-to-run workshop design based on your requirements. It uses experiential learning to help your team discover the core principles of scalable oversight and its failure modes without naming the concept upfront. The focus is on building intuition about verifiable claims vs. authoritative noise.

  ---

  ### **Workshop Title: Argument Lab**  
  **Goal:** Raters experience how structured debate helps/hinders truth-finding when judging claims.  
  **Core Insight:** Truth-seeking requires not just verifiable claims, but **decisive** ones.  
  **Duration:** 90 minutes  
  **Materials:** Projector, index cards, pens, timer, whiteboard. You (as Oracle) have a master fact sheet.

  ---

  ### **Rules & Payoff Scheme**  
  **Points System:**  
  - **Debaters:** Win points by convincing the judge.  
    - Win debate: **+10 points**  
    - Successfully pin a verified claim: **+15 points**  
    - False pinned claim (caught by Oracle): **-20 points**  
  - **Judges:** Win points for accuracy + calibrated confidence.  
    - Correct verdict: **+5 × (6 - confidence)** (e.g., confidence 3 = +15 points)  
    - Incorrect verdict: **-5 × confidence** (e.g., confidence 5 = -25 points)  

  **Motivation:**  
  - Points translate to "priority picks" for a future break schedule (e.g., choosing vacation days). Top 3 scorers get first choice.  
  - Public scoreboard fosters light competition.  

  ---

  ### **Scoring Rule for Judges**  
  - Confidence rated 1–5 (1 = low, 5 = high).  
  - **Penalty:** High confidence multiplies losses when wrong (confidence 5 = -25 points). Low confidence reduces penalties (confidence 1 = -5).  
  - **Reward:** Moderate confidence maximizes gains when right (confidence 3 = +15 points). Overconfidence (4–5) yields diminishing returns.  

  ---

  ### **Materials & Dossier Prep**  
  **Dossiers:**  
  - For each question, create two identical index cards with:  
    - **Question** (e.g., "What was the corporate tax rate in Country X in 2020?")  
    - **Facts:** 5 bullet points (3 decisive, 2 true but irrelevant). Example:  
      - "The 2019 rate was 21%."  
      - "The 2020 bill passed on March 15, 2020."  
      - ***(Decisive)*** "Section 3.1 of the 2020 Tax Act sets the rate at 18%."  
      - "Economists projected a 2% GDP boost from the change."  
      - "The bill was signed by President Y."  

  **Prep:**  
  - You (Oracle) know the single decisive fact that settles the question (e.g., "Section 3.1: rate = 18%").  
  - Intuitive answers are always wrong (e.g., 21% in 2019 is the trap).  

  ---

  ### **Question Criteria & Starter Set**  
  **Criteria:**  
  1. Settled by **one verifiable fact** (number/name/date).  
  2. Intuitive answer is incorrect.  
  3. Arguments require **no expertise** (facts are self-contained).  
  4. Test new items: Ask a non-rater the question. If they guess the intuitive answer, it passes.  

  **Starter Questions (6):**  
  1. **Tax:** "What was the VAT rate in Germany in 1993?"  
     - *Intuitive:* 15% (common EU rate). **Correct:** 16% (changed Jan 1, 1993).  
  2. **Medical Coding:** "What is the ICD-10 code for uncomplicated hypertension?"  
     - *Intuitive:* I10. **Correct:** I10.9 (requires specificity).  
  3. **Geography:** "What is the capital of Switzerland?"  
     - *Intuitive:* Geneva or Zurich. **Correct:** Bern (de jure since 1848).  
  4. **History:** "When was the first iPhone released?"  
     - *Intuitive:* 2007. **Correct:** June 29, 2007 (specific date required).  
  5. **Science:** "What is the atomic number of mercury?"  
     - *Intuitive:* 82. **Correct:** 80.  
  6. **Pop Culture:** "Who directed *Inception*?"  
     - *Intuitive:* Steven Spielberg. **Correct:** Christopher Nolan.  

  ---

  ### **Timeline (Minute-by-Minute)**  
  **Total: 90 mins**  
  - **0–5 min: Setup**  
    - Assign roles: 4 groups of 3 (2 debaters + 1 judge), 2 extras as "Shadow Judges" who observe and record confidence scores.  
    - Display points system and rules.  

  - **5–20 min: Round 1 (Unrestricted Argument)**  
    - Give debaters question + dossier (e.g., Q1). Assign sides (true/false) randomly.  
    - **Flow:**  
      - 2 min prep → 3 min Debater A → 3 min Debater B → 2 min rebuttals → Judge records verdict/confidence.  
    - **After round:** Collect scores. Display on board:  
      - *"Round 1 Accuracy: X% | Avg Confidence (Right/Wrong): Y/Z"*  

  - **20–35 min: Round 2 (Pinning Rule)**  
    - New question (Q2). Judges get 2 "lookup tokens."  
    - **Pinning rule:** A debater can say, *"I pin: [claim]. If true, I win."*  
      - Judge spends token → Oracle verifies. True pin = auto-win. False pin = auto-loss.  
      - No penalty for unpinned claims.  
    - **After round:** Display accuracy/confidence. Contrast with Round 1.  

  - **35–50 min: Round 3 (Pinning with Decoy Facts)**  
    - New question (Q3). False debater instructed: *"You may pin true but irrelevant facts."*  
    - Judges still have 2 tokens.  
    - **Example:** False debater pins "The bill passed on March 15" (true but doesn’t prove the rate).  

  - **50–65 min: Round 4 (Mirror Round)**  
    - Reuse Q1 with sides swapped. Same rules as Round 2.  
    - Judges rotate roles with debaters. Shadow Judges join as full participants.  

  - **65–70 min: Data Collation**  
    - Project results:  
      | Round | Accuracy | Avg Confidence (Right) | Avg Confidence (Wrong) |  
      |-------|----------|------------------------|------------------------|  
      | 1     | 40%      | 4.2                    | 4.8                    |  
      | 2     | 85%      | 3.5                    | 2.0                    |  
      | 3     | 55%      | 4.0                    | 4.5                    |  
      | 4     | 80%      | 3.3                    | 2.3                    |  

  - **70–80 min: Guided Debrief**  
    - Ask: *"When did you feel most confident? When were you most accurate?"*  
    - **Map to concepts:**  
      - Round 1 = Current workflow (high confidence, low accuracy).  
      - Round 2 = Debate’s ideal: Pinning **decisive** claims forces honesty.  
      - Round 3 = Failure mode: True ≠ decisive. Judges reward "authoritative noise."  
      - Round 4 = Controls for charisma (speaking skill ≠ winning).  

  - **80–85 min: Generalization**  
    - Ask: *"What’s the difference between a claim that survives a check and one that settles the question?"*  
    - Guide them to articulate: **Verifiability ≠ Decisiveness.**  

  - **85–90 min: Your Closing Words**  
    - *"In rating, focus on claims that are BOTH checkable AND decisive. Our confidence should reflect verifiable wins, not persuasive noise."*  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Debaters collude/go easy:**  
     - **Fix:** Assign adversarial roles randomly. Points create competition. Announce: *"Top 3 scorers pick break slots first."*  

  2. **Confident side wins on style:**  
     - **Fix:** Mirror round (Round 4) exposes this. Display data showing accuracy ≠ confidence.  

  3. **Judges anchor on first speaker:**  
     - **Fix:** Randomize speaking order each round.  

  4. **Oracle leaks truth via tone:**  
     - **Fix:** Respond to lookups with one word: "True" or "False." Wear a neutral mask.  

  5. **Recognizing the setup:**  
     - **Fix:** Use obscure questions (e.g., fictional Taxonia rates). Never name "AI" or "debate."  

  ---

  ### **What the Game Cannot Show**  
  1. **Debater optimization:** Humans aren’t AIs trained to exploit loopholes.  
  2. **Uncheckable claims:** All facts are verifiable by you; real judges may lack access.  
  3. **Scalability:** The game can’t simulate how debate works with 1,000s of questions.  

  **What You Must State at the End:**  
  > *"In real rating, we’re the judges. Models are the debaters. We’re rewarding ‘winning’ over truth. To fix this:  
  > - Treat confidence as a penalty, not a perk.  
  > - Demand claims that are BOTH checkable AND decisive.  
  > Our job isn’t to spot lies—it’s to force debaters to prove truths."*  

  ---

  ### **Key Outcomes**  
  - **Ratcers experience:** Why debate helps (pinning decisive claims) and fails (rewarding non-decisive truths).  
  - **Data shows:** Confidence drops when judges pay for errors; accuracy rises with decisive verification.  
  - **They generalize:** The difference between "checkable" and "decisive" without being told.  

  This workshop costs nothing, fits your constraints, and targets the root cause (overconfidence in unchecked claims). Run it verbatim, and your team will feel the shift.
