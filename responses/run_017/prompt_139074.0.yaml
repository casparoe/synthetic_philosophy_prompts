  #### Step 4: Brainstorming Variants  
  - **Variant 1 (Log-uniform prior):** Let \(A\) be log-uniform on \(2^k\) (e.g., \(P(A=2^k) \propto 1\)). Here, \(2p(x) = p(x/2)\), so switching is always neutral—but re-roll remains \(1.5 \cdot E[A]\). **Shows:** When correlation is neutral, scale optimism alone determines behavior.  
  - **Variant 2 (Noisy observation):** Peek at \(x + \epsilon\) (Gaussian noise). Re-roll still benchmarks \(1.5 \cdot E[A]\), but switching depends on noisy \(x\). **Shows:** Even with imperfect information, scale optimism can dominate.  
  - **Variant 3 (Heavy-tailed finite mean):** E.g., \(P(A=2^k) \propto 2^{-k}\) (Cauchy-like). \(E[A]\) is finite, but \(f(x/2)/f(x) \to \infty\) as \(x \to \infty\). Switching is optimal for large \(x\), but re-roll may still be better at small \(x\). **Shows:** The prior’s tail behavior drives switching at extremes.  
  - **Breakage test:** If \(A\) is degenerate (e.g., always \(A=10\)), re-roll = switching = staying = 15. **Expected—no paradox, no prior uncertainty.**  

  **Sharpest variant:** Two-point prior \(A \in \{1, 2\}\), uniform.  
  - At \(x=1\): Know you hold smaller. Switching gives 2, re-roll gives \(1.5 \cdot 1.5 = 2.25 > 2\).  
  - **Shows:** Even in the simplest case, re-roll can dominate switching despite full correlation knowledge—prior scale matters.  

