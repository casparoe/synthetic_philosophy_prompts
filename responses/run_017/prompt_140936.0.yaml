answer: |-
  ### Diagnostic Key: Which Theory of Self-Amendment Do You Already Hold?  
  *For the Charter Review Commission of the Palimpsest*  

  **How to Use This Key**  
  Face a live dispute about the rulebook. Start at Couplet 1. Choose the alternative that matches your judgement of the *outcome* in the described case. Proceed to the next couplet as directed. At a terminal leaf, find your implicit doctrine and its unavoidable consequence.  

  ---

  ### The Dichotomous Key  

  **Couplet 1: The Bootstrap Case**  
  A resolution passes by 51% (not two-thirds) to lower the Engine’s threshold to simple majority. The Chair registers it. For three years, rules pass by simple majority and are treated as binding. Then, 70% purports to restore two-thirds.  
  - **A. After three years, the simple-majority rule was part of the rulebook**: Go to Couplet 2.  
  - **B. After three years, the simple-majority rule was never part of the rulebook**: Go to Couplet 3.  

  **Couplet 2: The Unregistered Rule Case**  
  A resolution passes by 90% but the Chair never lists it on the Register. A year later, a user relies on it to justify an action.  
  - **A. Moderators must enforce this rule despite absence from the Register**: Go to Couplet 4.  
  - **B. Moderators must ignore this rule unless listed on the Register**: Go to Couplet 5.  

  **Couplet 3: The Repeal Case**  
  A resolution passes by 68% (not four-fifths) to delete the Lock.  
  - **A. Moderators must enforce the deletion**: Go to Couplet 6.  
  - **B. Moderators must ignore the deletion**: Go to Couplet 7.  

  **Couplet 4: The Freeze Case**  
  An 82% resolution adds a rule that no rule may ever be replaced and directs the Chair to stop recording votes. A year later, 85% purports to undo it.  
  - **A. The later 85% resolution must be given effect**: Go to Leaf 1.  
  - **B. The later 85% resolution must be ignored**: Go to Leaf 2.  

  **Couplet 5: The Vanishing Assembly Case**  
  Three hundred of four hundred Assembly seats are held by inactive accounts. Resolutions pass with near-unanimous support from the thirty active members.  
  - **A. Moderators must enforce these resolutions**: Go to Leaf 3.  
  - **B. Moderators must ignore these resolutions**: Go to Leaf 4.  

  **Couplet 6: The Double Case**  
  A single resolution both lowers the Engine to simple majority and repeals the Lock.  
  - **A. Moderators must enforce both changes**: Go to Leaf 5.  
  - **B. Moderators must enforce neither change**: Go to Leaf 6.  
  - **C. Moderators must enforce one change but not the other**: Go to Couplet 7.  

  **Couplet 7: The Janus Resolution Case**  
  A 70% resolution redefines “the Assembly” to mean forty thousand registered users voting directly.  
  - **A. The Chair must accept this redefinition**: Go to Leaf 7.  
  - **B. The Chair must reject this redefinition**: Go to Couplet 8.  

  **Couplet 8: The Silent Century Case**  
  Over a century, every original rule is replaced lawfully under the rules then in force. The polity’s name, membership, and servers change completely.  
  - **A. The current rulebook is continuous with the original**: Go to Leaf 8.  
  - **B. The current rulebook is a new creation**: Go to Leaf 9.  

  ---

  ### Terminal Doctrines  

  **Leaf 1: Efficacy Absolutism**  
  *Doctrine*: A rule is part of the rulebook if officials and users consistently treat it as such, regardless of how it was introduced.  
  *Awkward commitment*: You accept that three years of unchallenged practice under the Bootstrap could erase the Lock, even if the initial vote was flawed.  

  **Leaf 2: Pedigree Purism**  
  *Doctrine*: Every amendment draws force solely from the rule that authorised it at the time, and nothing else.  
  *Awkward commitment*: You must treat the Freeze as irreversible—even 100% support later cannot undo it—because no amending rule existed when the undo was attempted.  

  **Leaf 3: Popular Sovereignty**  
  *Doctrine*: The Assembly’s power rests on the active consent of current users, not historical rules.  
  *Awkward commitment*: You allow the vanishingly small active group to rewrite all rules, even if this disenfranchises dormant users.  

  **Leaf 4: Textual Formalism**  
  *Doctrine*: Only rules expressly listed in the official Register exist, and only the Chair’s registration makes them so.  
  *Awkward commitment*: A rule passed unanimously but unregistered (Unregistered Rule) is void—officials must ignore it even if everyone agrees it passed.  

  **Leaf 5: Unfettered Amendment**  
  *Doctrine*: The amending body can reshape any part of the rulebook in any way at any time, including its own powers.  
  *Awkward commitment*: The Double’s single vote can lawfully repeal the Lock while lowering the threshold—no special sequence is needed.  

  **Leaf 6: Core Limits**  
  *Doctrine*: Some rules (like the Engine) define the polity’s essence; they cannot be altered or deleted, whatever the majority.  
  *Awkward commitment*: Even an 85% vote to restore two-thirds (Freeze undo) fails if it tries to revive a “dead” amending power.  

  **Leaf 7: Scope Expansionism**  
  *Doctrine*: The amending power includes redefining who holds it, provided the vote meets the threshold in force.  
  *Awkward commitment*: The Janus Resolution lawfully replaces the Assembly with direct democracy, ending representative governance overnight.  

  **Leaf 8: Historical Continuity**  
  *Doctrine*: Lawful step-by-step replacement preserves the rulebook’s identity across total change.  
  *Awkward commitment*: The Silent Century’s wholly new rulebook binds today’s users even if they reject its origins.  

  **Leaf 9: Sceptical Discontinuity**  
  *Doctrine*: No test exists for continuity; we predict what officials enforce, not what “is” law.  
  *Awkward commitment*: After the Silent Century, the rulebook is whatever the Chair calls it—there is no deeper truth.  

  **Leaf 10: Pedigree Progressive**  
  *Doctrine*: Amendments inherit force from prior rules, but later lawful acts can retroactively cure past defects.  
  *Awkward commitment*: The Retro-Repeal (80% declaring the Lock void from inception) succeeds—it erases history.  

  **Leaf 11: Irrevocable Fetters**  
  *Doctrine*: A rule can restrict future amendment irrevocably if clearly intended.  
  *Awkward commitment*: The Freeze’s ban on all future amendments stands forever—even unanimous consent cannot revive amendment.  

  **Leaf 12: Unnamed [Content-Pedigree Hybrid]**  
  *Doctrine*: Most amendments need only proper pedigree, but those destroying core features (e.g., ending all amendment) also require supermajority approval in a direct vote [verify].  
  *Awkward commitment*: The Janus Resolution needs both 70% in the Assembly *and* a separate user referendum to pass.  
  *Occupancy condition*: Someone must hold that direct democracy is qualitatively different, needing extra validation.  

  ---

  ### Notes on Design and Rejected Material  
  **Logical Space**: 8 couplets permit 256 combinations. Only ~12 are coherent positions. Key constraints (e.g., rejecting Bootstrap in Q1A forces rejection of Double in Q6A) reduce permutations.  

  **Unoccupied Combinations**:  
  - *Efficacy + Core Limits* (Leaf 1 + Leaf 6): Incoherent—efficacy denies immutable cores.  
  - *Textual Formalism + Silent Century Continuity* (Leaf 4 + Leaf 8): Unattractive—it demands registration for continuity but has no original Register to reference.  
  - *Popular Sovereignty + Unregistered Rule Void* (Leaf 3 + Leaf 4): Unoccupied—if power rests with users, why defer to the Chair’s list?  

  **Inseparable Doctrines**:  
  - *Pedigree Purist* (Leaf 2) and *Pedigree Progressive* (Leaf 10) both reach Leaf 3B (Repeal fails). They separate only in *Retro-Repeal* (not used): Purists reject retroactivity; Progressives accept it.  

  **Rejected Questions/Cases**:  
  - *The Ratchet*: Poor discriminator—all doctrines either accept all steps (Unfettered) or reject the last (Core Limits), no middle ground.  
  - *Retro-Repeal*: Folded into Leaf 10; weak standalone as few dispute retroactivity without broader pedigree views.  
  - *Chair’s powers*: Added then cut—doctrines disagree on *why* registration matters, not on outcomes.  

  **Key Filters**:  
  Questions asked: "Must moderators enforce X?" or "Was Y part of the rulebook?". Avoided doctrine-laden terms. Dropped questions failing filter (i): e.g., "Does the Lock bind successors?" (requires "bind" theory). Dropped questions failing filter (ii): e.g., "Was the Bootstrap vote mistaken?" (all agree "yes"—no split).  

  ---  
  *Document: 1,190 words. British English as specified.*
