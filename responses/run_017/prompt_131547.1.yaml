prompt: |-
  Please answer as a professional philosopher who works on measurement, philosophy of science, and the methodology of the social sciences — someone equally at home with the technical apparatus of quantitative inference and with conceptual analysis. Take your time, and before writing anything final, do a genuine round of brainstorming: make a list of candidate concepts, including ones you end up discarding, and test each against my description clause by clause. I would much rather have a careful negative answer — "there is no established concept, here is the nearest neighbourhood, and here is a definition that would do the work" — than a confident label that only half fits. I have the quantitative vocabulary of my own old field and almost none of the philosophical vocabulary, so if there is a term of art, please give it to me in plain language as well as by name. And please do not give me references or a reading list; I want the carving, not things to look up afterwards.

  Something about me, so you can pitch the answer. I am a retired fisheries scientist, forty years of stock assessment, and in the last couple of years I have started reading philosophy seriously for the first time — mostly philosophy of science and measurement, and whatever I can follow in moral philosophy. A friend put me onto the debate about whether violence has declined, the one carried on in the well-known popular book and in its critics: absolute counts versus per-capita rates, what gets to count as violence at all, and whether there is a fact of the matter. I have no stake in the outcome. What I cannot stop noticing is that the argumentative shape of this debate is one I spent a career fighting.

  In my field we estimate abundance from an index. The classical case is catch per unit effort: the catch divided by how hard people fished, used as a proxy for how many fish there are. Two failure modes were drilled into me. In the first, the stock collapses while the index stays reassuringly flat, because the fleet keeps finding the last aggregations and the fishers get better at finding them; the ratio holds up while the thing it is supposed to track falls apart. In the second, the index falls much faster than the stock, because the easily reached concentrations are fished out first and the effort goes into unproductive water. There is jargon for these two directions — I was taught hyperstability and hyperdepletion, though I do not know how standard the words are outside my corner of the subject. The general lesson I took from them is not about fish. It is this: a ratio stops indexing anything when the denominator and the thing you are trying to measure are not independent, when the counting frame or the reference class is itself shaped by the process under study. And crucially, no additional measurement of the numerator or of the denominator separately will tell you the index has come loose; you only find out by some independent handle on the quantity itself.

  I think I see the same configuration twice in the violence material.

  First instance. The striking numbers about prehistoric and small-scale societies — the double-digit percentages of deaths attributable to violence that get quoted — come from skeletal assemblages. But the number of people who lived, the population you would need in order to turn injured skeletons into a rate, is estimated from the same sites, by the same excavations, often through the burial record itself. And whether a dead person is in the sample at all depends on burial practice: formal cemeteries in one period, mass graves and unburied dead in another, differential treatment of women, children, and outsiders. So the membership of the population at risk is partly an output of how violent the period was and of how the living disposed of their dead. The fraction of skeletons with weapon trauma can go up because burial got more inclusive, and it can go down because the dead stopped being buried where we dig.

  Second instance. The long peace in the core of the state system is accompanied by the relocation of fighting to colonies, frontiers, and client territories, and the populations counted as peaceful grew by conquest and incorporation. Here the community over which the rate is computed is not a fixed background against which violence happens; part of how it became peaceful is that the violence was pushed outside the counting frame, and part of how the frame grew is the violence. When a critic says that per-capita rates flatter us because the relevant unit was redrawn, and a defender replies with better data, they seem to me to be talking past each other in exactly the way my colleagues and I did when one of us reported an index and another reported a survey.

  So the thing I want a name for is this. An index of some quantity — a rate, a proportion, a per-capita figure — whose denominator, reference class, or counting frame is not given independently of the process being measured but is caused, selected, or reshaped by it, with the result that the index can move in the opposite direction from the quantity, or at a different rate, and no refinement of the measurements of either part settles which is happening.

  Why I do not think I already have the answer. Goodhart's law and Campbell's law are about agents responding to a measure that has become a target; that is a feedback loop through beliefs about the indicator, and although something like it may operate at the margins of this debate, the coupling I am describing does not run through anyone's awareness of the statistic — nobody in a prehistoric burial ground is gaming an index. Simpson's paradox and the ecological fallacy concern reversals between subgroups and an aggregate when the partition is fixed and known; my problem is that the partition is what is in dispute. Selection bias and endogenous sampling are close but, as I have met them, too broad to be the concept I am after, and they are usually stated for samples drawn from a population whose existence is not at issue. A friend who reads political philosophy mentioned a boundary problem about who is in the demos, which sounded adjacent but seemed to be a normative question rather than a question about whether a number tracks anything. And please do not tell me that it all depends on what we mean by violence: I can see that the definition of violence is contested and that broadening it tends to pull in the cases whose trend is flat or rising. That may be one phenomenon alongside mine, or it may be the same phenomenon in different clothes, but it is not an answer on its own.

  Two further things I would like you to settle, and I would rather you separated them than blended them. Is there an established concept for the general configuration, or for the specific version where the index moves the wrong way rather than merely at the wrong rate? If my description bundles two or three distinct failure modes, say which is which and give each its own treatment. And then the question I actually care about: once a population at risk and a counting frame have been fixed well enough for the trend claim to be well posed, is there a fact of the matter about whether violence has declined — or does the choice of frame already carry the moral and political weight, so that what looks like an empirical disagreement is partly a dispute about words? If it is partly verbal, say which part, and say what would remain genuinely empirical.

  Format, if it helps: a short brainstorming section in which you list candidate concepts with a verdict on each; then a table with a row per candidate, columns for what it gets right, precisely where it comes apart from my description, and keep or discard; then your answer on the two questions above. If nothing established fits, close by coining a term, giving a definition sharp enough to be argued with, one clear contrast case, and two boundary cases — one that should count and one that should not.
reasoning: |-
  Hmm, this is an exceptionally thoughtful and precise query from a retired fisheries scientist with deep domain expertise in measurement artifacts. The core challenge is to find a philosophical concept that captures how reference classes (denominators) can become endogenous to the very processes being measured, distorting ratios like violence rates. 

  The user has already done impressive conceptual groundwork by distinguishing this from Goodhart's law (no strategic gaming), Simpson's paradox (fixed partitions), and selection bias (preexisting populations). Their fish stock examples - hyperstability/hyperdepletion - are perfect analogies where effort distorts catch-per-unit-effort. Now they spot identical dynamics in violence metrics: burial practices shaping skeletal samples, and shifting state boundaries affecting per-capita war deaths.

  Key nuances: The user wants 1) conceptual identification (is there a term?), 2) taxonomy of failure modes, and 3) resolution of whether violence trends can be frame-invariant facts. They're clearly irritated by surface-level "it depends on definitions" responses - this is about measurement infrastructure, not semantics.

  Brainstorming candidates:
  - **Endogenous reference class**: Gets the core mechanism right but isn't standardized
  - **Denominator drift**: Descriptive but vague
  - **Dynamic population bias**: Focuses on mutability but misses causal loops
  - **Index-reality decoupling**: Too broad
  - **Metrological entanglement**: Pretentious but captures reciprocal shaping
  - **Constitutive selection**: From philosophy of statistics - close but usually about sampling, not reference class definition

  None fully fit. The violence case has two distinct sub-problems: 
  1) **Archaeological frame construction**: Where the "population at risk" is inferred through the same process (burials) that records outcomes
  2) **Political boundary fluidity**: Where the unit of analysis (state borders) expands via the violence being externalized

  On the empirical/normative question: The trend claim requires fixing both the violence definition AND the reference frame. Once fixed, there can be facts (e.g. "violence against group X in territory Y decreased"), but frame choice carries moral weight by deciding whose suffering counts. The core empirical residue is whether total harm (absolute or frame-relative) changed.

  Proposed coinage: **Reflexive Denomination**. Definition: When the denominator of an index is causally modulated by the phenomenon the index purports to measure, creating path-dependent distortion. Contrast case: Inflation rates (basket fixed). Boundary case: Crime rates amid policing changes (counts) vs. GDP in monetizing economies (denominator).

  Will structure response as: 1) Brainstorm table, 2) Taxonomy of failure modes, 3) Frame-dependence analysis, 4) Proposed concept with fish/violence parallels.
answer: |-
  ### Brainstorming: Candidate Concepts & Verdicts  
  *(Systematically tested against your description clause-by-clause)*  

  | Candidate Concept             | Core Idea                                                                 | Verdict                                                                                                |  
  |-------------------------------|---------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------|  
  | **Endogenous Reference Class** | Reference class (denominator) is causally influenced by the phenomenon being measured. | **Closest fit**: Matches your core mechanism—denominator shaped by the process. But not a standardized term. |  
  | **Dynamic Population Bias**    | Population-at-risk changes due to the measured process (e.g., migration during war). | **Partial fit**: Captures boundary shifts, but usually assumes a *preexisting* population. Misses archaeological frame construction. |  
  | **Constitutive Selection**    | How we define the "at-risk" group determines what counts as the event (e.g., defining "combatant"). | **Misfit**: Focuses on *defining* the numerator (violence), not denominator entanglement. Your issue is denominator drift. |  
  | **Index-Quantity Decoupling** | General divergence between proxy and target quantity.                     | **Too broad**: Includes technical issues (e.g., instrument error). Misses *causal entanglement* of denominator. |  
  | **Metrological Reflexivity**  | Measurement process alters the system (e.g., observer effect).           | **Mismatch**: Your case lacks feedback *through measurement awareness*. No one "alters" burial for stats. |  
  | **Reference Class Problem**   | Difficulty in choosing the right denominator for rates.                  | **Adjacent but inadequate**: Focuses on *epistemic uncertainty*, not causal entanglement. Your issue is ontological entanglement. |  
  | **Hyperstability/Hyperdepletion** | Your fisheries terms for index-stock decoupling.                    | **Direct analog**: Perfect mechanism match, but domain-specific. No general philosophy term.          |  

  ---

  ### Analysis Table: Candidate Concepts  
  *(Evaluated against your description: denominator shaped by process, index moves opposite/different rate, no fix via refining parts)*  

  | Concept                     | What It Gets Right                                                                 | Where It Comes Apart                                                                                             | Keep/Discard |  
  |-----------------------------|------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------|--------------|  
  | **Endogenous Reference Class** | Denom. is *caused/reshaped* by the process; index can invert/mislead; no fix via better numerator/denom. measurement. | Not an established term; usually discussed in econometrics ("endogenous regressors") but not for reference classes. | **Keep** (Best fit) |  
  | **Dynamic Population Bias** | Counts shifting boundaries (e.g., state expansion); index can mislead if frame changes.                              | Assumes a *real* population exists independently; your archaeological case has no "true" denom. to bias.          | **Discard** |  
  | **Goodhart/Campbell**       | Index becomes unreliable when used as target.                                      | Requires *strategic response* to the measure; your cases lack agency re: the statistic.                           | **Discard** |  
  | **Simpson's Paradox**       | Aggregate vs. subgroup reversals.                                                  | Partition is *fixed*; your issue is the partition is *fluid and endogenous*.                                      | **Discard** |  
  | **Selection Bias**          | Sample not representative of population.                                           | Assumes a *preexisting* population; your burial case has no population *except through the process itself*.       | **Discard** |  

  ---

  ### Answers to Your Two Questions  

  #### 1. **Is there an established concept?**  
  No. There is no *standard* philosophical term for this precise configuration. The **nearest neighborhood** is:  
  - **Endogeneity in measurement**: When the measurement apparatus (here, the reference class) is causally entangled with the phenomenon.  
  - **Your fisheries terms are apt**: Hyperstability (index flat, reality falls) and hyperdepletion (index falls faster than reality) are model cases of the mechanism.  

  **Failure Mode Taxonomy**:  
  - **Type 1: Archaeological Frame Construction**  
    - *Mechanism*: The denominator (population-at-risk) is *inferred* from the same physical record (skeletons/burials) that provides the numerator (violence evidence). Burial practices (shaped by violence/culture) determine both.  
    - *Risk*: Index can rise/fall due to *changes in sampling*, not violence.  
  - **Type 2: Political Boundary Fluidity**  
    - *Mechanism*: The reference class (e.g., "state population") expands/contracts *via* violence (conquest, colonization). Violence externalization shrinks the numerator *within the frame* while the denominator grows.  
    - *Risk*: Index falls artificially as harm is displaced.  

  Both share **denominator entanglement**, but Type 1 is *epistemic* (no independent population data), while Type 2 is *ontological* (the "population" is defined by the violence).  

  #### 2. **Is there a fact about violence declining?**  
  **Short answer**: Once the frame is fixed, there *can* be empirical facts—but frame-choice carries moral/political weight. The disagreement is **partly verbal** (framing-dependent) and **partly empirical** (within-frame).  

  **Breakdown**:  
  - **Verbal/Non-Empirical Part**:  
    The choice of *what counts as the relevant population* is not a purely empirical question. It involves:  
    - **Moral weight**: Whose suffering "matters" (e.g., colonies vs. metropole).  
    - **Political weight**: What constitutes "our" society (e.g., pre-conquest groups excluded).  
    This is where "boundary problem" applies: Defining the *demos* for violence rates is normative.  

  - **Empirical Part**:  
    *If* we fix:  
    - A definition of violence (e.g., "interpersonal physical harm"),  
    - A stable reference class (e.g., "people residing in borders of X in year Y"),  
    - A counting method (e.g., verified deaths),  
    ...then *whether violence decreased in that frame* is an empirical question. Example: "Verified battlefield deaths per capita in Europe 1950–2000 declined" could be factually true *even if* violence was displaced elsewhere.  

  **What remains genuinely empirical**:  
  - Frame-relative trends (e.g., "Within fixed borders X, violence decreased").  
  - Absolute harm totals (e.g., "Global violent deaths increased"), *if* frames are comprehensive.  
  - Mechanisms (e.g., "Policing reduced urban homicides in X").  

  **The rub**: For large-scale claims like "violence declined," the frame *cannot* be fixed neutrally—it embeds a worldview. Your fish analogy holds: Just as CPUE assumes effort is independent, violence rates assume the denominator is a passive backdrop. When it isn’t, the index doesn’t track *overall_ reality.  

  ---

  ### Coined Concept: **Reflexive Denomination**  
  *(For when no established term fits)*  

  **Definition**:  
  > A quantitative index (e.g., rate, proportion) where the denominator (reference class) is causally modulated by the phenomenon the index purports to measure, such that changes in the index may inversely or non-proportionally reflect changes in the target quantity. This decoupling cannot be resolved by refining measurement of the numerator or denominator alone.  

  **Clear Contrast Case**:  
  - Influenza mortality *rate* (deaths/population). The denominator (population) exists independently; flu doesn’t cause population changes. Rate reliably tracks disease impact.  

  **Boundary Cases**:  
  1. **Should Count**:  
     - **Prehistoric violence rates**: Burial practices (shaped by violence) determine which bodies are in the "population" sample.  
     - **GDP per capita in a resource-cursed economy**: Resource extraction inflates GDP (numerator) *while* displacing populations (denominator), masking collapse.  
  2. **Should NOT Count**:  
     - **Crime rate during demographic shift**: If young men (high-crime group) emigrate, the crime *rate* may fall, but the denominator shift is *external* (not caused by crime itself).  

  **Why this works for you**:  
  - Encapsulates hyperstability/hyperdepletion, violence rates, *and* your core insight:  
    > *"The counting frame is itself shaped by the process under study."*  
  - Separates mechanism (denominator entanglement) from agency (unlike Goodhart).  
  - Accepts that some "rates" are inherently frame-dependent facts.  

  ---  
  This gives you a precise lever to argue: "Your violence index suffers from reflexive denomination—the denominator is a product of the violence itself." No philosophy degree required.
