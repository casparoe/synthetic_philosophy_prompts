prompt: |-
  I chair the ethics committee at a large teaching hospital, and most of what we actually do is broker what our policy calls accommodation plans: packages that let a clinical team and a family who disagree about what must be done go forward together. We handle about thirty a year. Each one has to be assembled inside a single two-hour meeting, by a rotating group of clinicians, a chaplain, a lawyer and two lay members, and each needs the attending physician's signature and the family's before it goes in the chart.

  The justification we give ourselves is gains from trade: the two sides care about different things, so a package can leave each better off by its own lights than either would be after losing a fight. I have come to think that many of our plans are what I now call phantom trades — packages both sides prefer to losing outright, but where at least one side's gain is not a gain by its own lights, only the other side's description of one — and that others load their costs onto the patient, who is not at the table and cannot consent. I also think we routinely mishandle currency mismatch: what a family needs is sometimes not a policy concession at all but recognition, a sequencing of events, or a ritual, and we keep offering things denominated in a currency they cannot spend.

  Write me a decision procedure we can run in the room: the questions to ask about a proposed accommodation, in order; what counts as a sufficient answer to each; the point at which the procedure returns a no and we stop negotiating; and the points at which it has to hand the question to a person because it is a question of value rather than fact. Three things it must handle. Where it prices a concession by how intensely each side wants what it wants, tell us how to treat intensity that is cheap to fake or that rests on an empirical belief we take to be false. Where a concession would move the baseline for the next case, so that a series of locally acceptable trades is globally a loss for one side, say how to count that. And our clinicians distinguish sharply between being the one who does something and letting it happen, even when the outcome is the same; the procedure should not treat those as interchangeable.

  Then run it on three of our recurring cases: a time-limited trial of intensive treatment for an infant the team judges to be dying, with a stop date fixed in advance and palliative care layered in from the start; a Jehovah's Witness family's request for surgery without transfusion, with the team offering cell salvage and volume expanders instead; and a plan we have used for years and are rather proud of, under which a seventeen-year-old who refuses a recommended transfusion may refuse, provided she signs a document recording that she understands she may die. I would rather not be told that the first or the third is a phantom trade, but tell me if the procedure says so.

  Close by saying what the procedure cannot do. Lead with your bottom line in the first sentence, then give the procedure and the applications. No preamble and no restatement of what I asked.
reasoning: |-
  Hmm, the user chairs an ethics committee at a teaching hospital and needs a decision procedure for accommodation plans. They're dealing with complex ethical dilemmas where clinical teams and families disagree on treatment. The user has identified several problems: phantom trades where gains aren't real for one party, costs imposed on patients without consent, and currency mismatches where the actual needs aren't addressed.

  The user wants a structured procedure that must handle three specific challenges: evaluating desire intensity (especially when it's fake or based on false beliefs), accounting for precedent-setting concessions, and respecting the clinician distinction between doing vs allowing harm. They also want this applied to three recurring cases without labeling the first or third as phantom trades unless necessary.

  I need to create a decision tree that's practical for a 2-hour meeting. It should have clear questions, sufficiency criteria, stopping points, and handoffs to human judgment for value-based questions. The procedure must incorporate their three requirements about intensity assessment, precedent costs, and the doing/allowing distinction.

  For the three test cases:
  - The time-limited trial for a dying infant involves balancing palliative care with intensive treatment. The procedure should check if the stop date is medically sound and if both sides understand it's irreversible.
  - The Jehovah's Witness transfusion case needs to verify if alternatives are truly equivalent and if the family's refusal is stable.
  - The 17-year-old's refusal case must assess competency and ensure the documentation captures genuine understanding, not just compliance.

  The procedure should explicitly flag when gains exist only in the other party's description (phantom trades), when costs are shifted to the patient, or when the "currency" is mismatched. It must also quantify precedent costs and maintain the doing/allowing distinction throughout.

  In the closing, I'll clarify limitations: it can't create trust where none exists, override legal incompetence, resolve all value conflicts, or predict all downstream effects. The bottom line will emphasize that the procedure detects non-viable accommodations but can't manufacture agreement.

  The structure will be: 1) Bottom line conclusion 2) The step-by-step procedure 3) Application to the three cases 4) Limitations. No preamble - straight to the point as requested.
answer: |-
  **Bottom line: This procedure detects non-viable accommodations by exposing phantom trades, patient cost-shifting, currency mismatches, unsustainable precedent costs, or invalid "doing vs. allowing" resolutions, returning "no" when detected, and flags value judgments for committee deliberation.**

  **The Decision Procedure: Questions, Sufficiency, Stops, Handoffs**

  1.  **Question:** "What specific action or omission does each party (clinical team & family) *seek to avoid* by agreeing to this package?"
      *   **Sufficient Answer:** Clear, concrete statements of the undesired outcome for each party (e.g., "The team seeks to avoid performing futile CPR," "The family seeks to avoid feeling they abandoned hope").
      *   **Stop (No):** If either party cannot articulate a concrete, specific undesired outcome relevant to the patient's care.
      *   **Handoff:** None. This establishes the "loss condition" baseline.

  2.  **Question:** "For each concession in the proposed package (from Team to Family, Family to Team), explain: (a) How does this *directly* prevent the other party's undesired outcome (from Q1)? (b) Does the *recipient* party *themselves* see this concession as genuinely preventing that outcome *by their own values/beliefs*?"
      *   **Sufficient Answer:** (a) A logical causal chain linking the concession to preventing the specific undesired outcome. (b) Explicit confirmation from the recipient party (or their representative) that the concession achieves this *for them*.
      *   **Stop (No):** If *any* concession lacks a logical causal link to preventing the specified undesired outcome OR if the recipient party explicitly states the concession does *not* prevent their undesired outcome *by their own lights* (Phantom Trade detected).
      *   **Handoff:** If the causal link hinges on a disputed empirical fact (e.g., "This drug *will* reduce suffering") – flag for factual verification *if possible within meeting*. If verification impossible, handoff to clinical lead for post-meeting review (proposal may need amendment).

  3.  **Question:** "Does any element of this package impose a significant burden, risk, or violation of known preference *specifically and solely* on the patient, that would not occur if either party 'lost' outright (as defined in Q1)?"
      *   **Sufficient Answer:** Explicit identification of any such burden/risk/violation OR confirmation that no such burden exists beyond the unavoidable consequences of either potential "loss" outcome.
      *   **Stop (No):** If a significant burden/risk/violation is identified that is *unique to the package* and the patient cannot consent (or their known prior preferences reject it). (Patient Cost-Shifting detected).
      *   **Handoff:** If the significance of the burden/risk is disputed on value grounds (e.g., "Is this level of discomfort justified by the symbolic value to the family?").

  4.  **Question:** "For concessions involving desired actions/omissions by clinicians or family: Does the party making the concession require that it be framed as 'allowing' rather than 'doing' (or vice-versa), even if the patient outcome is identical? If yes, is the proposed mechanism consistent with that requirement?"
      *   **Sufficient Answer:** Yes/No to the requirement. If yes, description of the mechanism ensuring the correct framing (e.g., "Consultant B administers the medication, not the primary team").
      *   **Stop (No):** If the framing requirement is stated as essential by a party and the proposed mechanism demonstrably violates it (e.g., primary team *must* administer the transfusion they morally object to, not just 'allow' a different team to do it).
      *   **Handoff:** If the *importance* of the doing/allowing distinction in *this specific instance* is questioned on value grounds (e.g., "Is this distinction morally relevant here?").

  5.  **Question (Intensity & Belief):** "For each concession, assess the *recipient's* intensity of desire: Is their stated aversion to their 'loss' outcome (Q1) high primarily because of (a) core values/identity, (b) strong empirical belief about outcomes, or (c) potentially negotiable external factors?"
      *   **Sufficient Answer:** Classification (a, b, or c) based on recipient's explanation and committee assessment of sincerity/focus. For (b), state the belief explicitly.
      *   **Stop (No):** Not a direct stop point. Informs weighting.
      *   **Handoff:** None. Proceed to Q6.
      *   **Treatment:**
          *   *Cheap to Fake:* Focus on consistency with Q2b & actions/statements outside the negotiation. High intensity based *solely* on easily stated but unverifiable claims (especially type c) gets low weight unless corroborated.
          *   *Empirical Belief we hold False:* A concession primarily valuable *only* if the false belief is true (type b) cannot be the *sole* or *primary* gain justifying a reciprocal concession from the other side. It can be included if it provides comfort *without harming the patient* and the other party values it sufficiently *for that reason alone* (e.g., family believes prayer will cure, team allows uninterrupted prayer time *because* family values it, *not* because team believes it cures). Weight is low.

  6.  **Question (Precedent Cost):** "Does granting this specific concession (especially if novel or broadening) materially increase the likelihood or ease of the *clinical team* having to grant a *similar or greater* concession in a *future, distinct* case where they would otherwise judge it medically inappropriate or ethically problematic? Quantify if possible (e.g., 'sets benchmark,' 'removes barrier')."
      *   **Sufficient Answer:** Yes/No with brief rationale. If yes, estimate magnitude (Low/Medium/High) based on likelihood and impact.
      *   **Stop (No):** If the precedent cost is assessed as High *and* the concession is not offset by a *commensurate, durable* gain (e.g., preventing an imminent, catastrophic loss *in this case* that outweighs future risk). Medium/Low costs are factored into overall viability.
      *   **Handoff:** If disagreement exists on the *likelihood* of future cases or the *significance* of the precedent (often factual). If disagreement is on the *acceptability* of the precedent cost (value judgment).

  7.  **Question (Currency Check):** "Reviewing the concessions valued by the family (recipient side): Do they address the core needs expressed (e.g., recognition, sequencing, ritual) *in a form the family can actually use*, or are they primarily 'policy tokens' (e.g., extra days in ICU, specific drug) that don't resolve the underlying need?"
      *   **Sufficient Answer:** Explicit mapping of family concessions to stated/implied core needs, confirming the *form* is usable and meaningful *to them*.
      *   **Stop (No):** If the concessions offered to the family demonstrably fail to address their core needs *in a spendable form* (Currency Mismatch detected) and no alternative is feasible within the package.
      *   **Handoff:** If the *core need* itself is disputed or its interpretation requires value judgment.

  **Procedure Returns "Viable"** only if it passes all questions without a "Stop (No)". **"Handoff"** flags require the committee to explicitly resolve the flagged issue (fact or value) before proceeding.

  **Application to Cases**

  1.  **Time-Limited Trial (Infant):**
      *   Q1: Team avoids prolonged futile suffering/unwarranted resource use. Family avoids feeling they gave up too soon/abandoned hope.
      *   Q2: *Concession (Team->Fam):* Trial period. (a) Prevents "giving up too soon" by allowing continued effort. (b) *Recipient (Fam):* Must confirm it prevents "giving up too soon" *for them*. **Potential Phantom Trade Risk:** If family's core need is *certainty the child will live*, not just *duration of effort*, then the trial doesn't prevent their loss outcome. Committee *must* verify Q2b.
      *   Q3: Palliative care layered in mitigates burden. Focus on whether trial itself imposes *unique* burdens vs. full care or comfort care.
      *   Q4: Likely involves "allowing" the trial to proceed, not "doing" futile care indefinitely. Mechanism (stop date) must be clear.
      *   Q5: Family intensity likely high (core value: hope, parental duty). Beliefs about prognosis/benefit (if false) handled per procedure (can offer trial *for hope*, not *for cure* if prognosis is clear).
      *   Q6: Precedent cost (setting time limits) exists but often Medium; manageable if criteria for trial are strict (e.g., specific diagnosis, prognosis).
      *   Q7: Does the package (trial + palliative) address family need for *recognition* of their hope/effort and a *meaningful transition*? If offered purely as "extra days of machines," mismatch. If framed as honoring their role and ensuring comfort *throughout*, better currency.
      *   **Outcome:** Viable if Q2b is affirmatively met by family (prevents *their* loss), Q3/Q4 satisfied, and Q7 addressed meaningfully.

  2.  **Jehovah's Witness Surgery (No Transfusion):**
      *   Q1: Team avoids patient death from preventable hemorrhage. Family avoids violation of religious law (blood transfusion).
      *   Q2: *Concession (Fam->Team):* Allowance of alternatives (salvage/expanders). (a) Prevents "death from hemorrhage" *if and only if* alternatives are medically sufficient. (b) *Recipient (Team):* Must confirm alternatives prevent death *to their medical satisfaction*. **Critical Factual Handoff:** Requires immediate, expert verification if alternatives *are* sufficient for *this specific surgery/patient*. If not sufficient, Q2b fails -> **Stop (No)**. *Concession (Team->Fam):* No transfusion. (a) Prevents "violation of religious law". (b) *Recipient (Fam):* Must confirm it prevents this violation *for them*.
      *   Q3: Burden is the risk of death if alternatives fail. Is this risk *greater* than if team transfused (their loss) *or* than if surgery was refused (family loss)? If yes, and patient cannot consent, it's cost-shifting. **Stop (No)** unless risk is deemed acceptably small *and* unavoidable under any scenario (unlikely).
      *   Q4: Crucial. Team "allowing" death by withholding transfusion vs. "doing" a violation by transfusing. The plan must respect whichever framing the team requires (usually "allowing" death is acceptable, "doing" violation is not). Alternatives are an attempt to avoid both.
      *   Q5: Family intensity (religious conviction) is high (core value). Team intensity (preventing death) is high (core duty). Beliefs about medical efficacy (of alternatives) must be verified (Q2).
      *   Q6: Precedent cost (accepting higher risk protocols) is High. Requires significant offset by preventing imminent catastrophic loss *here* (death vs. religious violation). Must be justified carefully.
      *   Q7: Family need is primarily *avoidance of sin* (ritual/spiritual purity). Concession (no blood) directly addresses this in spendable form (if alternatives work). Team need (patient survival) addressed *only* if alternatives work (Q2).
      *   **Outcome:** Highly vulnerable to **Stop (No)** at Q2 (if alternatives insufficient) or Q3 (unacceptable risk shift). Requires robust Q2 factual handoff/verification.

  3.  **17-Year-Old Refusal (Documented Understanding):**
      *   Q1: Team avoids forcing treatment/coercion violating autonomy. Family/Patient avoids unwanted bodily violation/blood.
      *   Q2: *Concession (Team->Patient):* Honor refusal. (a) Prevents "bodily violation/unwanted treatment". (b) *Recipient (Patient):* Must confirm this prevents their loss outcome. **Phantom Trade Risk High:** If the patient values refusal *only* if they survive, but the outcome is death, the concession doesn't prevent their loss outcome (death). If they value refusal *itself* regardless of outcome, it does. **Critical Handoff (Value):** Committee must determine *with the patient* the true nature of their loss outcome. Does "unwanted violation" include death, or is preventing death their primary goal? If the latter, this is a **Phantom Trade -> Stop (No)**. The document's meaning hinges on this.
      *   Q3: Burden is death. Is this burden greater than if the team transfused (their loss)? Yes. Is it shifted? Only if patient's refusal is based on misunderstanding outcome or coercion, undermining valid consent. The document aims to show valid consent, addressing this. **Handoff (Value/Fact):** Is the patient's understanding documented *sufficient* to constitute valid consent for this grave risk? Requires assessment of maturity, comprehension, freedom from coercion.
      *   Q4: Team "allows" death by honoring refusal vs. "doing" a violation by forcing transfusion. Plan respects the "allowing" framing team likely requires.
      *   Q5: Patient intensity likely high (autonomy/identity). Beliefs about prognosis/necessity must be verified (factual handoff if disputed).
      *   Q6: Precedent cost (honoring minor refusals with grave risk) is High. Requires clear demonstration of valid consent (Q3 handoff) to justify.
      *   Q7: Patient need is autonomy/control. Concession (honoring refusal) addresses this directly *if* autonomy is the true core need. If core need is survival *and* refusal is a means to that (misguided), mismatch.
      *   **Outcome:** Viability **critically depends** on resolving the Q2 Handoff: Is the patient's core loss outcome "violation" (honoring refusal prevents it) or "death" (honoring refusal does *not* prevent it)? If the latter, it's a **Phantom Trade -> Stop (No)**. The document attempts to address Q3/Q6 via consent, but Q2 is foundational. You would rather not be told it's a phantom trade, but the procedure forces the question: *What is the patient's true "loss outcome"?* If it's death, the trade is phantom.

  **What the Procedure Cannot Do:**

  1.  **Create viable options where none exist** (e.g., if core needs are mutually exclusive and no non-harmful concessions are possible).
  2.  **Generate trust or goodwill** between parties lacking it; it relies on honest participation.
  3.  **Override legal determinations of competence** or surrogate authority.
  4.  **Resolve fundamental, intractable value conflicts**; it can only detect them and prevent invalid trades based on them.
  5.  **Predict the future perfectly** (e.g., exact precedent impact, unforeseen complications).
  6.  **Define what constitutes 'valid consent' or 'sufficient understanding'**; it flags the need for that judgment.
  7.  **Eliminate the emotional burden of the decisions** for clinicians, families, or the committee.
