prompt: |-
  Me and my sister have a rota that isn't a rota: she goes round to our mum's most evenings, I go every other Sunday. Mum has early-stage dementia but still lives alone. Lately my sister keeps saying it'd be nice if I came more often, and I genuinely can't tell whether she's right. I do the meds, the bills and the appointments, I'm 40 minutes away with two small kids, and mum is only doing as well as she is because my sister decided a year ago to start going every day — if she'd started at once a week, I suspect once a week is what would now count as normal. What actually confuses me is this: when I tell her what she does is amazing and I don't know how she manages it, she gets annoyed, like I'm implying she could just stop; but if I agree that it's simply what you do for family, I seem to have admitted I'm the one falling short. I think there's somthing wrong with how I've set this up but I can't see where. Also I'm about to drop to once every three weeks for a few months because of work — do I owe her an explanation for that, or is that none of her business?
reasoning: |-
  Okay, the user is dealing with a complex family situation involving his mom with early-stage dementia, his sister who provides daily care, and his own responsibilities. He's struggling with guilt and communication issues. Let me unpack this.

  First, he feels conflicted because his sister wants him to visit more, but he's already handling meds, bills, appointments. He lives 40 minutes away with two young kids. He recognizes his sister's daily visits are amazing but notices she gets annoyed when he praises her. There's a communication trap here: praising her makes her feel like he's suggesting she can stop, but agreeing it's "just what family does" implies he's not doing enough. 

  He's also planning to reduce visits to once every three weeks due to work and wonders if he owes his sister an explanation. Underlying all this is guilt and a sense of inequity. The sister might feel unsupported and resentful, while he feels his contributions are undervalued. 

  The core issues are communication breakdown and unequal care burdens. The sister's annoyance at praise might stem from feeling her efforts are invisible or that praise minimizes her struggle. She likely wants acknowledgment of the imbalance, not just compliments. 

  His planned reduction in visits needs careful handling. While work is a valid reason, explaining it prevents misunderstandings. Transparency shows respect for her role. He should frame it as temporary and emphasize his continued administrative support. 

  He might also worry about his mom's care standards. Since the sister set a high bar with daily visits, reducing his frequency feels like failing. But dementia care is long-term; sustainability matters. They need a shared approach that doesn't rely on one person's unsustainable efforts. 

  Unspoken needs: The sister probably wants validation and shared responsibility, not just praise. The user needs affirmation that his contributions matter too. Both need a structured plan to avoid resentment. Mom's evolving needs require flexibility, not rigid expectations. 

  Next steps: Facilitate a family meeting to openly discuss roles, appreciate each other, and create a sustainable care plan. Acknowledge both contributions, adjust tasks based on capacity, and possibly involve professionals for future planning. This can prevent burnout and ensure consistent care for their mom.
answer: |-
  This is a deeply relatable and emotionally complex situation. You're navigating caregiving inequity, guilt, communication traps, and differing expectations – all while balancing your own family and work. The "something wrong" you sense likely stems from **unspoken assumptions, unresolved resentment, and the lack of a shared framework for what "enough" care looks like.**

  Here's a breakdown of the dynamics and potential paths forward:

  1.  **The Communication Trap:**
      *   **Praise as Implied Opt-Out:** When you say, "It's amazing, I don't know how you do it," your sister likely hears, "This is extraordinary and unsustainable, *you should stop doing so much*." This feels threatening because she *can't* easily stop without feeling Mom suffers. Her sacrifice defines "normal care" now.
      *   **Agreement as Admission of Fault:** Agreeing "it's just what you do" feels like admitting your current level *isn't* enough, confirming her (possibly unspoken) belief that you *are* falling short.
      *   **The Core Issue:** The trap exists because you both hold different definitions of "baseline care." For her, it's daily. For you, it's less frequent, supplemented by your essential administrative/logistical support. Neither of you is explicitly acknowledging or negotiating this difference.

  2.  **The "Normal" Problem:**
      *   You're absolutely right: **Your sister created a "new normal" by choosing daily visits.** While incredibly loving, this set an expectation that is difficult for anyone else to meet and may not be strictly necessary *at this stage* (though only a professional assessment could confirm that). It's unsustainable long-term without significant support.
      *   **Her Resentment:** Her comments about you coming more often are likely fueled by exhaustion, feeling the burden is unequal, and perhaps fear that the "normal" she created will collapse if she falters. She might feel her immense effort is invisible or taken for granted *as the baseline*.

  3.  **Your Contributions ARE Valid:**
      *   Managing meds, bills, and appointments is **crucial, time-consuming, and stressful work.** It requires organization, follow-through, and dealing with bureaucracy – which is a different kind of burden than daily hands-on care. Don't minimize this. It *is* significant caregiving.
      *   Your constraints (40 min drive, 2 small kids, work) are **real and legitimate.** They aren't excuses; they are facts that shape your capacity.

  4.  **Addressing the Imbalance & Communication:**
      *   **Shift the Conversation:** Instead of praise or vague agreement, **acknowledge the reality and her feelings directly:**
          *   "Sis, I know you're carrying an enormous load going to Mum's every day. I see how exhausting that must be, and I truly appreciate it more than I can say."
          *   "I also know my current schedule feels like less to you, and that might be frustrating. I want us to figure this out together."
      *   **Reframe "Normal":** "I worry that because you started going daily, that became the expectation. But I wonder if we need to think about what level of support Mum *actually needs* right now, and what is sustainable for *both of us* long-term? Maybe we need to talk to her doctor or a dementia advisor?"
      *   **Highlight Your Role:** "I want to make sure the work I *am* doing – the meds, bills, appointments – feels visible and valued. It takes real time and effort, and I do it so you don't have to worry about it on top of everything else."
      *   **Focus on Mum's Needs (Objectively):** "What are the specific things Mum needs help with *right now* that aren't being covered? How can we ensure those happen without it all falling on you daily?"

  5.  **The Upcoming Reduction (Every 3 Weeks):**
      *   **Yes, you owe her an explanation, but frame it carefully.** This isn't about seeking permission, but about transparency, respect, and managing expectations within your care partnership.
      *   **How to Communicate:**
          *   **Be Proactive:** Tell her *before* it happens. Don't spring it on her.
          *   **Be Direct & Factual:** "Sis, because of a major project at work over the next few months, my time is going to be extremely limited. I need to temporarily shift my visits to Mum to once every three weeks instead of every other Sunday. This will start on [Date] and last until approximately [Date]."
          *   **Reinforce Your Other Support:** "I will absolutely continue handling all the meds, bills, and appointments without interruption. That remains my priority."
          *   **Acknowledge the Impact:** "I know this means you might feel an extra burden during this time. I hate that. Is there anything *specific* I can take off your plate completely during these months to help? Maybe ordering groceries online for Mum weekly? Or scheduling one of her regular check-ups?" (Offer something concrete related to *your* strengths – admin/logistics).
          *   **Reiterate it's Temporary:** Be clear about the end date.
          *   **Avoid Defensiveness/Over-Justifying:** State the facts about work briefly. Don't get into lengthy arguments about why work demands it unless she asks respectfully.

  6.  **Broader Solutions (Moving Forward):**
      *   **Formalize the Rota (Slightly):** Even if it's just agreeing on *your* fixed Sundays (e.g., 1st and 3rd) and acknowledging her daily role, having clarity helps. Discuss what happens if one of you is sick/away.
      *   **Seek External Input:** Seriously consider a consultation with Mum's doctor, a dementia charity (like Alzheimer's Association), or a geriatric care manager. They can provide:
          *   An objective assessment of Mum's *current* needs.
          *   Realistic expectations for her stage of dementia.
          *   Advice on structuring care sustainably.
          *   Information on local resources (day programs, respite care, home help) that could relieve your sister *now* and be essential later.
      *   **Discuss Long-Term Reality:** Early-stage dementia progresses. Daily visits might become insufficient. Now is the time to *start* discussing future plans (home help? assisted living?) calmly, rather than in crisis mode later. Frame it as "planning so Mum gets the best care and we don't burn out."
      *   **Express Appreciation Differently:** Instead of praising her capacity, thank her for *specific* things: "Thanks for taking Mum to the park yesterday, she really enjoyed it," or "I noticed you sorted out the laundry, that was a big help." Specificity feels more genuine and less like commentary on the overall burden.

  **In Summary:**

  *   **The "wrong setup" is the lack of shared definition of "needed care" and open communication about capacity and contributions.**
  *   **Your sister feels trapped by the standard she set and likely resentful of the perceived imbalance.**
  *   **Your logistical/administrative role IS valuable caregiving.**
  *   **You DO need to proactively explain the temporary reduction, focusing on continued support in your areas and offering concrete help where possible.**
  *   **Addressing the root requires shifting the conversation to Mum's objective needs, sustainability, and exploring external resources/advice.**

  This is hard. It requires courage to have these conversations. Focus on "What does Mum need?" and "How can we make this work for both of us?" rather than "Who is doing enough?" Good luck.
