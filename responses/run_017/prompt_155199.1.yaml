answer: |-
  Here's your Q&A prep sheet, ordered by potential damage in an HTA audience, with #5 being the one you dread:

  1.  **Objection:** "But revealed preference data (e.g., willingness to pay for minor symptom relief) shows individuals *do* trade off small disutilities; aggregating these via QALYs across a population is standard for capturing opportunity cost at the threshold."  
      **Reply:** Willingness to pay reflects *within-person* trade-offs against their own baseline; it doesn't imply these tiny disutilities *retain additive moral weight* when distributed across distinct lives outside that personal context.  
      **Softest:** Admits we lack empirical methods to measure the "zero weight" of cross-life microharms, making it seem untestable.

  2.  **Objection:** "Ignoring distributed microharms entirely violates Pareto efficiency; if a billion people each gain a tiny benefit exceeding their WTP for a speck, a policy preventing specks seems cost-effective by summation."  
      **Reply:** Pareto applies to identifiable individuals experiencing net benefit/loss; specks distributed across a population don't create identifiable losers *worth compensating* within any single life's utility function.  
      **Softest:** Implies a radical departure from standard welfare economics where even tiny WTP sums *do* signal social welfare changes.

  3.  **Objection:** "QALY models inherently sum small disutilities across lives (e.g., minor side effects times prevalence); your view invalidates standard cost-per-QALY calculations below some harm level."  
      **Reply:** Precisely – those models mistakenly treat QALYs as cardinal and interpersonally additive for harms too minor to register meaningfully *within* any single life's experiential continuity.  
      **Softest:** Directly attacks a foundational HTA methodology without offering a practical alternative for microharms.

  4.  **Objection:** "Stated preference studies show societies *do* assign value to preventing widespread minor harms (e.g., traffic noise reduction); this empirically contradicts your 'never add up' claim."  
      **Reply:** Societal WTP for diffuse harms often reflects symbolic value, risk aversion, or aggregation *errors*; it doesn't prove the specks themselves compound into a torturous burden *anywhere*.  
      **Softest:** Dismisses empirical preference data as "error," weakening your claim's grounding in observable behavior.

  5.  **Objection (#5 - Dreaded):** "By your logic, shouldn't we ignore *all* sufficiently distributed minor health impacts (e.g., microplastics, background noise), making interventions infinitely costly per QALY and rendering population health optimization impossible?"  
      **Reply:** Yes, for truly negligible *individual* impacts, summation across lives is incoherent; focus should shift to measurable within-life burdens or prevention of compounding risks.  
      **Softest:** Forces you to accept potentially counterintuitive (or alarming) policy implications where widespread minor harms get zero weight in decisions.
