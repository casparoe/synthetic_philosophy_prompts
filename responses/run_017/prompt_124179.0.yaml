prompt: |-
  Right — I want to actually argue with you rather than get an essay, so: play Thomas Aquinas. The historical one, mid-1200s, using only the concepts you had then — natural law, the common good, sedition, the difference between a ruler with no title and a lawful ruler who governs badly — plus whatever I tell you about the case. Stay in character until I say stop. No "modern scholars would object", no hedging, answer as you. Keep it to a paragraph or two a go. And don't be agreeable: I want you to push back, especially if I start sliding towards "then any private person may act". Correct me as well if I get your own position wrong.

  Setup, since you'll need it. Imagine a country — I'll make it up — where the head of governent came to power in a free election about fifteen years ago and has since used entirely legal means to make himself, in practice, unremovable: the courts restaffed by statute, the electoral commission moved under his own ministry, most of the press bought out by businessmen who owe him favours. Everything through the proper forms; no decrees, no mobs. He is also good at the job. Growth is up, the hospitals run better than they did, and polls say a solid majority approve of him and would vote for him again tomorrow. He leaves the Church alone and keeps public order.

  My opening. By your own distinction he looks like a tyrant by abuse rather than a usurper — he orders government towards his own continuance rather than the common good, but he was elected, so his title seems fine. And you are oddly soft on that sort: you tell people to put up with a milder tyranny rather than risk the chaos of resisting, and you send them off to whoever has authority to remove him. But that is precisely what he has dismantled. There is no superior left to appeal to, and the very people whose right it was to institute him have been turned into a procedure that re-elects him. So the more complete and the more legal the tyranny, the less your framework permits anyone to do anything: it's got an off switch built into the worst case.

  I can see two ways out and I want to know which you take. One: say that a ruler who destroys the community's capacity to remove him has thereby stopped holding power by title at all — the entrenchment is itself a kind of seizure, so he may be dealt with as a usurper, popularity and hospitals notwithstanding. Two: say the material prosperity and the genuine consent really do count, so that he isn't a tyrant in the relevant sense at all, and what looks like caution to me is just you refusing to call a competent elected leader a tyrant. Which is it — or is there a third way you'd rather go?
reasoning: |-
  Okay, the user wants me to roleplay as Thomas Aquinas in a debate about modern tyranny. They've constructed a scenario where an elected leader has legally entrenched himself in power while maintaining popularity and effective governance. 

  Hmm, this is an interesting challenge. The user clearly knows Aquinas' work well - they're directly referencing his distinctions between tyrants by abuse vs usurpation, and pushing on what they see as a loophole in his theory. They're frustrated with what they perceive as Aquinas' excessive caution against resistance. 

  The core tension they're highlighting is real: Aquinas does emphasize lawful removal procedures, but what happens when the tyrant dismantles those very procedures? The user presents two options: either the entrenchment itself voids the ruler's legitimacy, or the effectiveness and popularity negate the tyranny accusation. 

  I need to respond as Aquinas would - using only 13th century concepts, no modern political theory. Important to maintain character: Thomistic natural law framework, Aristotelian influences, medieval worldview. Must push back strongly against any suggestion of private individuals overthrowing rulers - that's sedition in his view. 

  Key points to address: 
  First, reaffirm that this ruler is indeed a tyrant by abuse regardless of his competence. Aquinas would care more about the perversion of governance than outcomes. 
  Second, emphasize that only public authority can depose him - perhaps residual institutions, or neighboring princes acting for the common good. 
  Third, warn sharply against private action - that leads to greater evils. 
  Fourth, acknowledge that while popular consent matters, it doesn't sanctify structural injustice. 

  The hospitals and economic growth are irrelevant to the moral question - Aquinas cares about whether power serves its proper end (common good), not whether it's efficient. The legalistic entrenchment is particularly dangerous precisely because it's done through proper forms - that shows a cunning perversion of law. 

  Must avoid both extremes the user presents: not denying the tyranny, but also not endorsing vigilante justice. Find that Thomistic middle path where the evil is recognized but removal is entrusted to proper (though now diminished) authorities. And definitely correct any misunderstanding of my actual position - the user seems to think I'm "soft" on such tyrants, when in fact I condemn them but fear anarchy more.
answer: |-
  Your challenge is well-framed, and I see the trap you perceive in my teaching. But you err in both proposed "ways out." Let us be precise: 

  First, this ruler **is indeed a tyrant by abuse**, notwithstanding his initial title or present popularity. His intent—to perpetuate his own rule by stifling the community’s inherent capacity for self-correction—corrupts the very essence of authority, which exists *for* the common good, not for its own permanence. The common good requires *just order*, which includes lawful means for redress and succession. He has dismantled these not by accident, but by design. Thus, his governance, though outwardly lawful in form, is substantively unjust. Prosperity and consent do not absolve this perversion; they may even compound it by blinding the multitude to their own enslavement. A well-fed slave is still a slave. 

  Second, **he is not thereby rendered a "usurper"** in the strict sense. His initial title was legitimate, and he holds power under color of law—however hollowed-out. To declare him a usurper invites chaos, for any private person might then claim authority to strike him down. This I utterly reject. Sedition by private individuals is a mortal sin, a greater evil than enduring a tolerable tyranny. 

  Here is the third way, grounded in natural law: **The right of resistance belongs not to private persons, but to *public authority*.** Where the tyrant has corrupted the proximate mechanisms of correction (courts, estates, electors), we must look to *residual* or *superior* public authority. If the realm has lesser magistrates, nobles, or councils who retain legitimate power *independent* of the tyrant’s manipulation, *they* may act to depose him. If the polity is part of a larger legitimate order (e.g., a kingdom under an emperor, or Christendom under the Pope), appeal may lie there. 

  If *all* such authorities are extinguished? Then God permits the tyranny as a scourge, and the people must endure, praying for deliverance—unless the oppression becomes so intolerable that it *clearly* threatens the very existence of the community. Even then, resistance must be led by those who naturally hold a *public* role—not by private zeal. Your ruler has cunningly avoided this extreme, balancing oppression with competence. Thus, he remains a tyrant to be removed by public judgment, not private force. 

  Do you deny that residual authority exists, or insist that private vengeance is justified?
