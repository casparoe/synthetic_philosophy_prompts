prompt: |-
  I'm running a 75-minute session next week in an upper-level undergrad seminar on rational choice and decision theory — 22 students, mixed majors, they've done expected utility, backward induction and a bit of game theory, and I know for a fact that at least four of them have already seen the dollar auction demo online because one of them brought it up in office hours last week.

  Which is my problem. I want them to feel the pull of escalation of commitment, and the standard dollar auction — I mean the one where a dollar bill goes up in small increments and both the highest and the second-highest bidder pay whatever they bid — is exactly the demo I'd normally reach for, but it's not going to work on a room that's already wise to it. Half of them will refuse to bid on principle, someone will open at a dollar to shut the whole thing down, and the ones who do bid will be performatively self-aware about it the entire time.

  So I need something better designed than what I'd improvise. Constraints:

  - 22 people, 75 minutes total, and I want at least 30 minutes of actual play. Happy to break into groups of 4-5 running their own auctions at the same time.
  - No real money. Points, chips, a token prize, whatever — but losing has to sting a little, I dont want them giggling through it.
  - I can be the seller if I have to be, but I'd rather not be, since they'll assume I'm running a trick on them. Suggest how to handle the credibility thing.
  - They shouldn't hear the words "sunk cost" or "escalation" from me before the debrief, and they shouldn't be told which condition they're in.

  What I actually want them to hit is not "sunk costs are a fallacy," which they already believe and can recite. I want them to run into three different things and not be able to tell them apart while they're in them: (1) the pure trap, where once you're in, continuing really is the better move given the rules and the whole mistake was entering; (2) the case that looks the same but isn't, where continuing really is throwing good money after bad because nothing new will be learned by continuing; (3) the case where continuing past a loss is genuinely right, because further investment is the only way to find out whether the thing is worth finishing — so the naive rule is the wrong rule there.

  To make (3) live, and to make (1) and (2) harder to separate, my idea was to give each player a private and different value for the prize. Then someone who keeps escalating past everyone else might be a trapped fool, or might be the one person for whom the prize is actually worth more, and nobody — including the other players watching them, and including me — can tell which from the outside. If that's a good idea, tell me concretely how to assign and keep the private values secret. If it's a bad idea, say so and give me something else that does the same job.

  What I want back: rules and materials, how to run the rounds and keep time across simultaneous groups, a short prediction sheet they fill in before they play, and a debrief that maps specific moments in the room onto the three-way distinction above — including the point that something can be rational locally and irrational as part of a plan. Then tell me what will predictably go wrong the first time I run it: the non-bidders, the colluders, the groups that finish in ninety seconds while others are still going at twenty minutes, the student who bids a dollar immediately — and what I should actually do in the room in each case. And be honest about what the game can't reproduce about real escalation in organizations: there, nobody knows which of the three situations they're in, the goal itself keeps getting quietly redefined, there isn't a clean endpoint, and walking away costs you your face in front of colleagues. If the activity can't produce that part and I have to supply it in the debrief, say so plainly and tell me what to say.
reasoning: |-
  Okay, let me tackle this professor's challenge. They need an escalation of commitment activity that avoids the predictability of the standard dollar auction. The key constraints are: 22 students, 75 minutes total with 30+ minutes of play, no real money, avoid instructor involvement as seller, no pre-briefing of concepts, and crucially—they want students to experience three distinct escalation scenarios that feel indistinguishable during play.

  Hmm... the professor's insight about private values is brilliant. That's the core mechanism to create ambiguity between rational persistence and irrational escalation. Let me flesh out how that would work. Each bidder needs a secret valuation card—say between $1.50 and $10.00 in $0.50 increments. That ensures some players (high-value) genuinely should bid aggressively while others (low-value) are walking into traps. The valuation spread must be wide enough to create tension.

  For materials, I'm imagining poker chips to represent bids, valuation cards in envelopes, and a public board to track bids. Groups of 5 would work well—large enough for competition but small enough to manage. The seller role could rotate per round to avoid suspicion, with strict rules to prevent cheating. 

  Timing is tricky. I'll suggest 15-minute rounds with countdown warnings. Some groups might escalate wildly while others collapse quickly—that's actually useful for debriefing. The prediction sheet is crucial: asking students to guess their own maximum bid beforehand creates reflection points later.

  During gameplay, problems will emerge: the instant $1 bidder, collusion attempts, refusal to bid. The professor should embrace these as teaching moments. For example, if someone bids max immediately, let it play out—it demonstrates how public knowledge changes dynamics. Collusion attempts reveal how real-world trust issues complicate escalation.

  The debrief needs to connect specific student behaviors to the three scenarios. Like: "When Sarah kept bidding at $4.50 despite groans—was she trapped (1), throwing good money after bad (2), or correctly pursuing her $8 valuation (3)?" Highlighting that observers couldn't tell the difference mirrors real organizational ambiguity.

  Crucially, the activity can't replicate how real-world escalation distorts goals or carries social costs. I'll suggest the professor explicitly name this gap during debrief, using examples like the Concorde fallacy or Iraq War where sunk costs bred mission creep. Students need to hear that in reality, the "prize value" itself becomes corrupted by prior investment.

  For predictable hiccups: Groups finishing early can observe others or analyze strategy. The professor should circulate to seed questions like "What do you think Maya's valuation was?" to prime deeper thinking. If a group collapses too fast, reveal valuations to show who should have fought harder—that reinforces the private value lesson.
answer: |-
  Here's a redesigned "Escalation Lab" that meets your constraints, leverages private values to create ambiguity, and targets your three learning objectives. It deliberately blurs the lines between rational persistence, irrational escalation, and necessary exploration.

  **Core Activity: The Ambiguous Prize Auction (APA)**

  *   **Concept:** Players bid for a prize of *uncertain but privately assigned value*. The winner gets `(Private Value - Winning Bid)`. The **second-highest bidder pays their final bid** and gets nothing. This creates the sunk-cost trap *and* justifies persistence for high-value holders.
  *   **Goal:** Force players to experience escalation where the rationality of continuing is ambiguous to both participants and observers.

  **Materials & Setup (Per Group of 4-5 Players):**

  1.  **Valuation Cards:** Create sealed envelopes or folded cards for each player. Inside: A unique dollar value (e.g., $3.00, $4.50, $6.00, $7.50, $9.00). **Crucial:** Use a wide range ($2.00-$10.00+) with most values clustered slightly above the expected midpoint but include at least one very high ($10+) and one very low ($2.00-$3.00) value per group. Assign randomly.
  2.  **Bidding Currency:** Poker chips (100 per player). Assign each color a value (e.g., White = $0.05, Red = $0.10, Blue = $0.25). **Alternative:** Use a shared digital spreadsheet for tracking bids (e.g., Google Sheets), but physical chips feel more consequential.
  3.  **Auction Board/Sheet:** To track current high bidder and bid amount publicly.
  4.  **Timer:** Visible countdown timer (phone/laptop/projector).
  5.  **Role Cards:** "Auctioneer" (1 per group, rotates each round). Rules card for Auctioneer: "Start bids at $0.05. Accept bids only in standard increments (e.g., $0.05). Declare winner & runner-up. Enforce payments."
  6.  **Prediction Sheet (Individual, Pre-Game):**
      *   "What is the MINIMUM amount you think you might bid? _____"
      *   "What is the MAXIMUM amount you think you might bid? _____"
      *   "Briefly explain your max bid reasoning: _________________________"
      *   "What strategy will you use if someone bids very high early? _______"

  **Session Flow (75 mins):**

  1.  **Introduction (5 mins):** "Today we're running some short economic games. Your goal is simple: maximize your points. Points convert to [small token prize, e.g., candy, extra credit raffle tickets]. Don't discuss strategy yet. First, read your private information silently and fill out the prediction sheet. Don't share your private info!"
  2.  **Distribution & Prediction (5 mins):** Distribute Valuation Cards, Chips, Prediction Sheets. Ensure envelopes stay sealed until instructed. Players read value, keep it secret, fill sheet. Collect sheets.
  3.  **Rules Briefing (5 mins - Absolutely NO Jargon!):**
      *   "You are bidding for a prize. You each know *privately* what the prize is worth *to you*."
      *   "The Auctioneer starts the bidding low. Bids increase in small increments."
      *   "The **highest bidder** wins the prize. Their payoff: `(Your Private Value) - (Your Winning Bid)`."
      *   "The **second-highest bidder** pays their final bid and gets **nothing**. Their payoff: `- (Their Final Bid)`."
      *   "All other bidders pay nothing and get nothing."
      *   "Auctioneer: Follow the rules. Start low, accept standard increments, declare winners clearly, ensure payments are made in chips. Rotate after each round."
      *   "We'll play 2-3 rounds. Each round is 10 minutes max. GOAL: Maximize your *total* chips after all rounds."
  4.  **Round 1 (10 mins + 2 min settle):** Groups play. Instructor circulates OBSERVING, NOT INTERVENING unless rules are broken. Note: Who hesitates? Who escalates aggressively? Who drops out early/late? Facial expressions/body language. Record final bids/payoffs per group if possible.
  5.  **Round 2 (10 mins + 2 min settle):** Auctioneer rotates. Repeat. Encourage groups that finished fast to "play harder" based on their first experience. **Optional Twist:** Announce *after* Round 1 valuations are assigned but *before* Round 2: "This time, there's a 25% chance the prize value for the winner is DOUBLE what's on your card." (Introduces uncertainty about the value itself, complicating pure cost-benefit).
  6.  **(If Time) Round 3 (10 mins + 2 min settle):** Auctioneer rotates again.
  7.  **Debrief (30 mins - This is CRITICAL):**
      *   **Step 1: Feelings & Observations:** "Quick reactions? What was that like? Frustrating? Exciting? Confusing?" (Surface emotions).
      *   **Step 2: Reveal the Mechanism:** Show the payoff rules again. Emphasize the *private* valuations. Ask: "Who had a valuation above $X? Below $Y?" (Don't ask specifics).
      *   **Step 3: The Ambiguity:** "Think about someone who kept bidding aggressively, long after others dropped out. Could an observer tell if they were: (A) Trapped in a bad situation they shouldn't have entered? (B) Throwing good chips after bad chips? (C) Correctly pursuing a prize genuinely worth *much more* to them than others?" **Highlight:** *You couldn't tell, and neither could their opponents.*
      *   **Step 4: Mapping to the Three Cases (Use SPECIFIC group examples observed):**
          *   **(1) The Pure Trap:** "Player A (Low Val) got into a bidding war with Player B (Med Val) early. Player A ended up second-highest, paying significantly while Player B won but barely broke even. Player A's mistake was *entering* or *not dropping out very early*. Once past a point, continuing *was* rational locally to avoid the *certain loss* of being second-highest, hoping the other would drop first." (Local rationality, global irrationality).
          *   **(2) Throwing Good After Bad:** "Player C (Med Val) kept bidding against Player D (High Val) well past their own valuation, ending up second-highest with a big loss. Why? Maybe pride, maybe misjudging D's valuation, maybe just wanting to 'win'. Here, each extra bid *increased* their loss unnecessarily. The prize wasn't worth it *to them*, and they should have cut losses earlier." (Irrational escalation).
          *   **(3) Rational Persistence:** "Player E (Very High Val) bid relentlessly against Players F and G (Med Val), eventually winning at a high bid. To Player E, this was rational – the prize was worth $9.00, winning at $5.50 is still +$3.50. Players F/G dropping out was rational *for them* because *they didn't know* E's valuation. E *had* to escalate to get the high-value prize." (Globally rational investment).
      *   **Step 5: The Core Insight:** "The *external behavior* of escalation looks identical in all three cases. What differs is the *private context* (true value, opponent's valuations) and the *global plan*. The 'sunk cost fallacy' rule ('ignore sunk costs') is naive. Sometimes you *must* escalate based on new context (like learning an opponent might fold or discovering the value is high). Sometimes you *are* trapped by the structure. Sometimes you're just being stubborn. **The hard part is knowing which situation you're in when the information is incomplete and private.**"
      *   **Step 6: Bridging to Real World (What the Game CAN'T Fully Capture):**
          *   "In real organizations, the 'private value' is often **unknown even to yourself** (Is this project viable? What's the market potential?)."
          *   "The 'prize' **gets redefined** ('We need to prove our capability,' 'We need to justify the initial investment')."
          *   "There's **no clean endpoint** – rounds keep happening with escalating stakes."
          *   "**Walking away costs reputation, relationships, face** ('I championed this, I can't admit failure'). This social cost is HUGE and absent here."
          *   "**Information is actively hidden or distorted** to avoid blame or maintain funding."
          *   "**Groups reinforce commitment** – dissent is silenced, creating a collective tunnel vision."
      *   **Step 7: Prediction Sheets:** Return sheets. "Look back. Did you stick to your max? Exceed it? Why? Did your strategy change?"

  **Predictable Problems & Mitigation:**

  1.  **Non-Bidders:** Some will refuse to bid, fearing the trap. *Mitigation:* Emphasize the *goal is to maximize total chips* across rounds. Sitting out guarantees $0, while smart bidding (even losing small early) might be better than losing big later or winning big. The private value means *sometimes* even small bids are rational. Circulate and whisper, "Is sitting out *really* your best move if your valuation is $8.00?".
  2.  **Colluders:** "Let's all bid $0.05 and one wins cheaply!" *Mitigation:* The rules inherently punish this. If they collude at $0.05, the winner gets `(Value - $0.05)`, but the second-highest bidder pays... $0.05? It's trivial. The Auctioneer should raise the starting bid minimally if this happens immediately. More likely, collusion will break down as valuations differ and someone sees a chance to win a high-value prize cheaply by bidding $0.10. **This breakdown is a feature, not a bug!** Debrief it: "Why didn't the collusion hold? (Differing private values/incentives)".
  3.  **Instant Max Bid ($1 or equivalent):** *Mitigation:* **Let it happen!** This is gold for debrief. The bidder likely has a very high valuation OR is trying to shut it down. If they have a high valuation, they might win cheaply (rational!). If they have a low valuation, they risk being second-highest if someone else also bids high early (irrational trap entry). Ask the group: "What did you think when X bid $1? Did you believe their valuation was high? Did it change your strategy?".
  4.  **Groups Finishing Fast/Slow:**
      *   *Fast:* Often due to early max bid or immediate collusion. If done *very* fast (<2 mins), have them play a second round immediately with the same valuations but a different Auctioneer. Or ask them to strategize silently for the next round. **Debrief:** "Group Y finished in 90 seconds. What dynamics caused that? Did it maximize payoffs?"
      *   *Slow:* Escalation war. Keep the timer strict (10 mins). When time is called, the current highest bidder wins, the previous highest is the second-highest bidder (paying their last bid). Announce this rule clearly in the briefing. **Debrief:** "Group Z was still bidding fiercely at the bell. What forces kept that going? What would have happened with 5 more minutes?"
  5.  **Auctioneer Credibility:** Rotation + Clear Rules mitigates suspicion. Emphasize the Auctioneer *does not play* and *follows the script*. Circulate to ensure compliance. If a group complains, remind them the Auctioneer is just enforcing the published rules.
  6.  **Giggling/Not Taking Seriously:** The "sting" of losing chips (even fake) combined with the competitive aspect and the debrief usually curbs this. The private valuation makes it personal. Connecting chips to a small tangible reward (raffle tickets) helps. If persistent, cold-call them in debrief: "Sarah, you seemed skeptical. What strategy *were* you using? How did it work out?"

  **Why This Works:**

  *   **Private Values:** Create fundamental ambiguity. Is that persistent bidder rational (high value) or trapped (low value)? Observers *can't* know.
  *   **Second-Highest Pays:** Creates the unavoidable sunk cost trap dynamic.
  *   **Multiple Rounds:** Allows learning and adaptation, revealing how strategies change.
  *   **Prediction Sheet:** Creates cognitive dissonance when plans fail.
  *   **Debrief Structure:** Explicitly links observed behaviors to the three target cases using concrete examples and highlights the indistinguishability during play.
  *   **Honest Gap Acknowledgment:** Directly addresses the limitations of the simulation vs. real-world organizational escalation.

  **Key Instructor Moves During Play:**

  *   **Observe Meticulously:** Note specific bids, drop-out points, reactions, overheard comments. This fuel is crucial for the debrief.
  *   **Resist Explaining:** If asked "Why would anyone do this?", reply: "Your goal is to maximize your chips based on the rules and your private information. What's your strategy?"
  *   **Timekeeper Enforcer:** Be strict with the 10-minute rounds and the end-of-time rule.
  *   **Seed Questions (Subtly):** If a group is stuck, ask the Auctioneer (not players) "Are bids currently being accepted?" or remind "Increments of $0.05 only." To hesitant bidders: "Remember, the prize has different values to different people."

  This design forces students into the emotional and cognitive experience of escalation where the rationality is contested and opaque, setting the stage for a powerful debrief on the complexities that go far beyond the simple "sunk cost fallacy" mantra. Good luck!
