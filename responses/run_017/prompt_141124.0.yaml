answer: |-
  ### Activity Design: "Generations - Real or Drawn Lines?"

  This interactive activity explores whether generational categories reflect inherent groupings ("real kinds") or arbitrary constructions. Participants engage in a prediction game using a fictional survey dataset, revealing how arbitrary groupings can have predictive power and challenging assumptions about generational boundaries. The activity surfaces metaphysical questions like the age-period-cohort problem, the "window vs. wall" distinction, and the utility of fuzzy boundaries—without using technical jargon until the debrief.

  **Core Structure**:  
  - **Teams**: 3 groups (4–5 participants each).  
  - **Data**: 36 fictional respondents (birth years 1950–2005, surveyed in 2020) with 4 attitude questions.  
  - **Task**: Teams use assigned grouping rules to predict held-out answers for 12 test respondents.  
  - **Scoring**: 1 point per correct prediction (poker chips/tally marks).  
  - **Reveal**: Actual answers and scores are unveiled to highlight predictive surprises.  
  - **Debrief**: Structured discussion linking game experiences to philosophical concepts.  

  **Key Insight**:  
  The "silly" grouping (last digit of birth year) will outperform expectations on one question, demonstrating that predictive utility ≠ inherent reality. Teams experience how data can fit multiple stories.  

  ---

  ### Run-Sheet Table  
  | Phase          | Minutes | What Participants Do                                                                 | What Facilitator Does (and Does NOT Say)                                                                 | Metaphysical Concept Surfaced                                                                 | Most Likely Failure & Fix                                                                 |
  |----------------|---------|--------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------|
  | **Setup**      | 5       | Form teams of 4–5; receive packets (dataset, partition card, prediction sheet).      | Assigns teams; distributes materials. Says: *"We’re playing a prediction game—use your grouping rule to guess missing answers."*<br>**NOT:** *"This is about generations."* | N/A (setup)                                                                                  | **Uneven teams**: Move volunteers between groups.                                         |
  | **Rules**      | 5       | Read partition card; scan training data (24 respondents with full answers).          | Explains: *"Use your rule to group training data. Find patterns. Then predict Q2 & Q4 for the test set."*<br>**NOT:** *"Your rule is arbitrary/scientific."* | Imposing patterns on data; "seeing" groups before analysis.                                  | **Confusion about task**: Show example prediction on whiteboard.                          |
  | **Training**   | 10      | Discuss patterns in training data; note group tendencies for Q2/Q4.                  | Circulates; answers *procedural* questions only (e.g., *"Q2 = social media use"*).<br>**NOT:** *"Why do you think that pattern exists?"* | Epistemic bias (expecting homogeneity in groups); boundary rigidity in categorization.       | **Stuck teams**: Ask, *"What answers are common in each group?"*                          |
  | **Prediction** | 10      | Record predictions for Q2 and Q4 for 12 test respondents.                            | Collects prediction sheets; emphasizes quiet focus.<br>**NOT:** *"Which group do you think will win?"*                             | Predictive utility as a measure of "realness"; underdetermination (multiple stories fit data). | **Early finishers**: Have them list assumptions their rule forced them to make.           |
  | **Scoring**    | 10      | Watch as facilitator reveals answers; track team scores.                             | Reveals Q2/Q4 answers; scores aloud (1 pt/correct guess); posts totals.<br>**NOT:** *"See how arbitrary this is?"* | Surprise at "silly" group’s success; tension between prediction and explanation.             | **Disputed scores**: Recheck pre-calculated answers; remind of scoring rules.             |
  | **Debrief**    | 40      | Discuss via guided questions; relate to generational labels.                         | Asks debrief questions; writes key terms (e.g., "window/wall") on whiteboard *only as they emerge*.       | Age-period-cohort tangle; social construction; boundary fluidity.                            | **Off-topic debate**: Redirect with, *"How does this connect to your team’s experience?"* |

