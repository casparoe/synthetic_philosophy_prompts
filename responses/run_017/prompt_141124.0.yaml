  ### How the Data Proves the Point  
  - **Q4 (bicycle ownership)** is set to "yes" if birth year ends in an even digit (e.g., 195**2**). Team C will notice this and score near-perfectly (22/24), while others struggle.  
  - **Q2 (social media use)** correlates with age (Team B wins), but Team A’s fixed boundaries create errors (e.g., 1965 born = Gen X but same age as 1964 Boomer in 2020).  
  - **Result**: Team C’s "nonsense" rule wins Q4, forcing reflection on why we trust "generational" labels.  

  ### Facilitator Notes  
  - **Pre-game**: Print materials; pre-calculate test answers.  
  - **During**: Stay neutral; avoid validating any grouping.  
  - **Post-game**: Use whiteboard to map debrief insights to concepts (e.g., "window/wall" as groups describe their rules).  
  - **Key quote for close**: *"We draw lines to make sense of smears—but we must ask: Do those lines reveal reality, or just our need to measure?"*  

  This design mirrors your instrumentation experience: it lets participants "argue about the signal" in a low-stakes, tactile way while surfacing philosophy through action. The bad coffee is optional.
