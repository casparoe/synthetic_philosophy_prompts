prompt: |-
  I'm writing a novel and I've written myself into a corner on the arguing bits rather than the plot, so I'm hoping you can help.

  It's set maybe forty years out, and a lot of it happens in and around a revision of the big diagnostic manual (fictional, but you know the kind). My main character is a psychiatrist on the revision committee, and I need her to have an actual view about which of the diagnoses in the book are real kinds and which are things the book itself manufactured — something she can say out loud in a committee scene without sounding like she's reciting a textbook.

  I've been poking around the Hacking stuff on this: the looping idea, where you classify people, the classified people change in response, so the kind changes, so the classification changes, round and round; and the split between kinds that don't care whether anyone has sorted them out and kinds that only exist because we did. I get it in outline. I can't turn it into a rule.

  So here's my actual gut, on the diagnoses I've made up for the book.

  1. Adolescent Depersonalization Drift — dissociative episodes, derealization, "watching yourself from the ceiling." Essentially unheard of until about fifteen years before the book's present, then case counts climb almost in lockstep with a handful of viral videos in which kids describe exactly those symptoms in exactly that vocabulary. My gut: artifact, the label made it, vote no.

  2. Operator's Residual Witness Reaction — intrusive visual flashbacks and hypervigilance in retired remote-aircraft crews. My gut: real. But this one also spread after a big public awareness campaign and a documentary, and I can't say why it isn't just case 1 with a different patient population. That bugs me more than any of the others.

  3. Thibault's disease — a degenerative condition picked out by a protein marker in spinal fluid. My gut: obviously real, obviously not a looping kind, even though being diagnosed destroys these people's lives: insurance, work, marriage, they join a patient community and start narrating themselves completely differently. So "the classification changed everything" can't be my test, right?

  4. A side-plot: she's diagnosing a Victorian diarist with a modern condition, mostly from the diary. The diarist is dead and can't loop. My gut: a legitimate description, but it feels like a cheaper kind of legitimacy, and I don't know why.

  5. A cohort diagnosed in childhood who seize the label, use it as an identity, and end up behaving in ways the original description doesn't cover — the clinicians complain the kind has drifted out from under them. My gut: still legitimate, and here the looping feels like a feature.

  6. The one I flip on weekly: a therapy app reads your messages and tells you you're suffering from cumulative relational depletion. You weren't miserable before. You are afterwards, badly, and you say being told was the best thing that ever happened to you.

  My working rule was going to be: it's a real kind if the suffering was already there before the label arrived and the label just picks it out. But 6 breaks it (no prior suffering, and I still lean legit) and 1 arguably satisfies it (there was plenty of diffuse adolescent misery around first, and I still want to vote it down). So the rule is wrong and I dont know how to repair it.

  What I want: a principle, or two rival ones if they come apart somewhere, tight enough to fit in a page of dialogue, that captures as many of my verdicts as it can. Say which clause exists to handle which case. Then tell me what it predicts about two bits of the draft I haven't decided on: (a) a system that hands people a diagnosis presymptomatically, before they've felt anything, on a risk score; (b) a diagnosis that exists mainly because an insurer needed a billing code, which does get people money and leaves them worse off in other ways. And be straight with me about which of my verdicts a decent principle would force me to drop — I'd rather cut a subplot than have her defend something dumb in chapter nine.

  One last thing: whatever you give me has to do work in the scene, i.e. it should let her say why the committee should vote yes or no, not just whether a kind is real in some abstract sense. If the honest answer is that the epistemic question and the should-it-go-in-the-book question come apart, say so and give me both.
reasoning: |-
  Okay, the user is writing a novel and needs help crafting a principle for their psychiatrist character to determine which diagnoses are "real" versus artifacts of classification. They've provided six fictional diagnoses with their gut reactions and want a rule that fits into dialogue, handles their cases, and applies to two undecided scenarios. 

  First, I need to understand their core struggle: they grasp Hacking's looping effect conceptually but can't operationalize it for their character's voice. Their working rule ("suffering before label") fails cases 1 and 6. The Victorian diary case (#4) particularly interests me—why does labeling the dead feel "cheap"? That might hold a clue.

  Hmm, their examples reveal three tensions: 
  - Pre-label suffering vs. post-label construction (cases 1 vs 2)  
  - Biological markers vs. social consequences (case 3)  
  - Clinical utility vs. harm (case 6)  

  For the committee scene, the character needs actionable criteria, not philosophy. I should avoid academic jargon. Maybe frame it as "What does the diagnosis *do*?" rather than "What *is* it?" That fits their emphasis on consequences in cases 3 and 5.

  Breaking down their cases:  
  - #1 (Adolescent Drift): Feels manufactured because the viral videos *taught* the symptoms. Key point: expression molded by the label itself.  
  - #2 (Operator's Reaction): Authentic despite awareness campaigns because the trauma *predates* its naming. The documentary didn't invent flashbacks.  
  - #3 (Thibault's): Biomarker makes it "real" even with destructive looping—the biology anchors it.  
  - #4 (Victorian): Legitimacy comes from *retrospective fit* to suffering, but feels cheap without living experience.  
  - #5 (Cohort): Legitimate *because* the looping improves lives (functional adaptation).  
  - #6 (App-induced misery): Tricky! Their "no prior suffering" leans artifact, but the character's gut says legit. Maybe because the app exposes *latent* vulnerability?  

  Two principles emerge:  
  1) **Anchor Principle:** Is there a pre-label "hook" (trauma, biomarker, functional impairment)? Handles cases 2,3,4.  
  2) **Trajectory Principle:** Does looping heal or harm? Handles 5 (heals) vs 6 (harms).  

  Case 1 fails both—no anchor, harmful trajectory. Case 6 might pass if we argue the app *reveals* relational depletion (anchor) but fails trajectory (harms patients). User might need to adjust their verdict here.  

  For the undecided scenarios:  
  - Presymptomatic diagnosis (a): Anchor exists (risk markers), but trajectory depends on whether early intervention helps.  
  - Billing-code diagnosis (b): No anchor, likely harmful trajectory (reimbursement-driven).  

  Biggest conflict: Their gut says case 6 is legit, but the principles suggest artifact. They’ll need to choose—maybe soften to "the app *might* reveal real patterns but implemented toxically."  

  Dialogue translation: Have the psychiatrist reject abstract debates. Focus on: "What pain does this name? Does naming it help or hurt?" That’s novel-friendly.  

  Final check: Does this force dropping any subplots? Only if they insist case 6 is unambiguously real. Compromise: Show the character wrestling with it, making the principles feel lived-in.
answer: |-
  Here's a tight, dialogue-ready framework for your psychiatrist, based on your gut verdicts and designed for committee debate. It prioritizes *clinical actionability* over metaphysical "realness," acknowledging that the manual's purpose is to *help people*, not just catalog truth. The core tension is between **Anchoring** and **Trajectory**.

  **Her Principle (The Anchored Trajectory Test):**
  > "We shouldn't ask if a disorder is *real* like a rock is real. We should ask: *What does this label anchor to, and where does it lead?*
  > **1. The Anchor:** Is there a core of suffering, dysfunction, or biological disruption *independent of the label itself*? Something the label *discovers*, not *creates*? (This anchors the diagnosis in pre-existing reality).
  > **2. The Trajectory:** Once applied, does the label *improve* the person's trajectory? Does it lead to effective care, validation, understanding, or functional adaptation? Or does it *worsen* things – creating sickness, dependency, stigma, or confining identity?" (This assesses the looping effect's clinical consequence).

  **Why this captures your verdicts:**

  1.  **Adolescent Depersonalization Drift:**
      *   **Verdict:** Artifact (Vote NO)
      *   **Why:** *Anchor Weak/None:* The core experience ("watching yourself") became widespread *only after* specific viral videos defined and modeled it. Prior diffuse misery isn't a *specific* anchor for *this specific* constellation. *Trajectory Negative:* Likely reinforces dissociative coping, creates illness identity around transient or suggestible states, risks medicalizing normal adolescent turmoil. **Clause:** Anchor (weak/none) + Negative Trajectory = Artifact.

  2.  **Operator's Residual Witness Reaction:**
      *   **Verdict:** Real (Vote YES)
      *   **Why:** *Anchor Strong:* Intrusive flashbacks/hypervigilance are core trauma responses documented long before drones existed. The *specific trigger* (remote witnessing) is new, but the *underlying mechanism* (trauma) is well-anchored. The awareness campaign spread *recognition*, not the core symptoms. *Trajectory Positive (Potential):* Validation for a unique trauma, access to specific trauma therapies (e.g., EMDR adapted for remote witnessing), community support. **Clause:** Strong Anchor + Positive Trajectory = Legitimate Kind.

  3.  **Thibault's Disease:**
      *   **Verdict:** Real (Vote YES)
      *   **Why:** *Anchor Strong:* Objective biological marker (protein) indicating a degenerative process exists independently of the label. *Trajectory Mixed BUT Anchor Prevails:* The social destruction and identity shift are severe negative looping *effects*. BUT the *anchor* (the biological process) is undeniable and the diagnosis, however devastating socially, provides *crucial* biological understanding (prognosis, potential future treatments, genetic counseling). The book isn't *creating* the disease, it's naming a biological reality with profound consequences. **Clause:** Very Strong Biological Anchor overrides Negative Social Trajectory for inclusion, *but* the manual must address the social impact ethically. The diagnosis is biologically real; the *looping* is a social problem.

  4.  **Victorian Diarist Diagnosis:**
      *   **Verdict:** Legitimate Description, but "Cheap"
      *   **Why:** *Anchor Present:* Suffering/dysfunction evident in the diary *resonates* with a modern understanding. *Trajectory Neutral/Irrelevant:* No looping possible. It's "cheap" legitimacy because it's purely descriptive/historical with no *clinical consequence* for a living person. It's valid scholarship, but inclusion in a *clinical* manual for *current practice* is debatable. **Clause:** Anchor can exist retrospectively, but Trajectory is irrelevant for the dead. Inclusion depends on the manual's purpose (pure knowledge vs. active clinical tool). It highlights the difference between a *true description* and a *clinically useful category*.

  5.  **Identity-Seizing Cohort:**
      *   **Verdict:** Legitimate (Vote YES)
      *   **Why:** *Anchor Strong:* Original diagnosis captured a core, impairing dysfunction in childhood. *Trajectory Positive:* The "drift" is adaptive! The community used the label to understand themselves, advocate for needs, and develop functional adaptations beyond the initial narrow clinical view. The kind evolved *because* the label empowered positive change. **Clause:** Strong Anchor + Positive Adaptive Trajectory = Legitimate, evolving kind. Looping as a feature, not a bug.

  6.  **Cumulative Relational Depletion (App):**
      *   **Verdict:** Leans Artifact (Vote NO) - *This is the forced drop*
      *   **Why:** *Anchor Weak/None:* No prior suffering or dysfunction reported. The app *induced* the misery by framing normal experiences (or mild dissatisfaction) through a pathological lens. *Trajectory Strongly Negative:* Created significant misery, dependency on the app/therapy it sells, and potentially pathologizes ordinary relationship challenges. The "best thing" feeling likely stems from the relief of having *any* explanation for the distress *the app created*, or a placebo effect, not validation of a pre-existing state. **Clause:** Weak Anchor + Negative Trajectory = Artifact. *This forces you to drop your "leans legit" gut feeling for consistency.* If you *must* keep it legit, you'd need to argue the app revealed a *latent*, previously unarticulated vulnerability (Anchor) and the suffering is "real" once named, even if the naming triggered it. But this weakens the Anchor principle significantly.

  **Predictions for Undecided Bits:**

  *   **(a) Presymptomatic Diagnosis via Risk Score:**
      *   **Analysis:** *Anchor:* Potentially strong (genetic/biomarker risk), *but* applies to people with *no current suffering/dysfunction*. *Trajectory:* Highly uncertain. Could be positive (preventive interventions, lifestyle changes reducing risk). Could be devastatingly negative (anxiety, stigma, insurance discrimination, life lived "waiting for the axe to fall").
      *   **Her Argument (Likely NO, or HEAVY caveats):** "The anchor is potential, not actual suffering. The trajectory is a minefield. Unless we have *proven*, risk-reducing interventions that *don't cause more harm than the disease itself*, and robust safeguards against discrimination, this belongs in research appendices, not the main diagnostic criteria. We risk creating the 'worried well' on an industrial scale."

  *   **(b) Insurer-Driven Billing Code Diagnosis:**
      *   **Analysis:** *Anchor:* Likely weak/nonexistent. Created for reimbursement, not clinical observation. *Trajectory:* Negative. Gets people money (short-term relief) but pathologizes them, potentially locks them into a sick role for continued benefits, creates stigma, and distorts clinical focus towards billable codes rather than patient needs.
      *   **Her Argument (Strong NO):** "This fails both tests. There's no clinical anchor – we're inventing suffering for the ledger. The trajectory is perverse: it financially rewards people *for being sick* according to this arbitrary code, potentially trapping them in dysfunction and warping care. It turns diagnosis into a transaction, not a tool for healing."

  **Epistemic vs. Practical (The Committee Split):**
  *   **Her Position:** "Look, the 'real kind' debate is fascinating for philosophers, but we're clinicians building a *tool*. Does this category help us reliably identify people who are suffering or malfunctioning *in a way we can actually help*, without making things worse by applying the label itself? That's the Anchored Trajectory test. It's messy, but it's clinical reality."
  *   **Potential Rival Principle (Spoken by an antagonist?):** "We must catalog observable syndromes, regardless of origin or consequence! Our duty is scientific accuracy. If a pattern of distress exists *after* a label is applied, it exists! Denying it is denying patients' lived experience. The manual describes; clinicians manage consequences." (This would argue FOR including #1, #6, and the billing code #b, and potentially the presymptomatic #a as "risk states").

  **Why this works for your scene:**
  1.  **Concise:** Fits in a page of passionate dialogue.
  2.  **Actionable:** Directly tells the committee how to vote (Anchor + Trajectory = Include/Exclude).
  3.  **Clinically Grounded:** Focuses on patient outcomes, fitting a psychiatrist's priorities.
  4.  **Acknowledges Complexity:** Admits the manual shapes reality (Trajectory) but demands a link to pre-existing suffering/dysfunction (Anchor).
  5.  **Creates Conflict:** The rival principle ("catalog everything observable") provides clear opposition for debate.
  6.  **High Stakes:** Forces the committee to confront the real-world impact of their choices.

  **The Forced Drop:** The principle firmly suggests **#6 (App-Induced Misery) is an artifact** (Weak Anchor, Negative Trajectory). If you keep it as "legit" in your story, your character would need a compelling *in-scene* reason to override her own principle (e.g., "The app exposed a *latent relational fragility* that *was* there, Anna, we just didn't see it! The suffering is real *now*, even if the label ignited it. Our job is to help them put out the fire!"). This creates internal conflict for her, showing the principle isn't perfect. However, for consistency, dropping or reframing #6 is cleaner.

  This gives your character a sharp, defensible, and dramatically potent tool for the committee room. Good luck with the scene!
