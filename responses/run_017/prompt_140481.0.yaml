prompt: |-
  Hey — I'm a novelist (three books, no philosophy since a freshman survey), and I've agreed to run a 90-minute session at a writers' residency this fall. About 14 adults, all fiction writers, mixed ages, no shared reading and no homework. I'm mid-draft on a novel about a woman in an 1890s mill town whose husband never forbids her anything — not one thing, in 300 pages — and I keep failing to make readers feel that she isn't free. So I want a role-play, not a lecture: I want the room to be running a household before they realize they're doing political philosophy, and I want them to end up arguing about who in the house is freest and discovering that they each mean something different by 'free'. Here's the bit I can't get right alone: three rounds under three different sets of house rules, and in one round nobody is stopped from doing anything and nobody is threatened, but the character's deepest wants were deliberately formed by someone now dead — she wants exactly what she was raised to want, and gets it. I don't know if that round earns its place or just reads as a parlor trick. So: rules, roles, a minute-by-minute timeline, and a real but small stake — I was thinking the scenes they write in-character get read at tonight's open mic in an order decided by the group's own verdict. Then a debrief that maps what actually happened onto the three notions, without me uttering the labels until after they've fought about it. Tell me what'll go wrong the first time (I'm guessing somebody plays the husband as a villian and flattens the whole thing), and be straight about which part of the trio an afternoon of make-believe simply can't deliver — I'd rather hear it now and say it out loud myself. Last thing: flag whichever piece of the design you're least confident in, and tell me what you'd watch for in the room that would make you cut it or rewrite it on the spot.
reasoning: |-
  Okay, the user is a novelist running a workshop for fiction writers. They want to design a role-play session that explores different concepts of freedom without getting into philosophy jargon. The core issue is that in their novel, a character isn't perceived as unfree even when her husband never forbids anything. So the workshop needs to make participants feel how subtle constraints work.

  First, I need to understand the user's main goals. They want three rounds of role-play with different house rules, each illustrating a different aspect of freedom. The tricky part is the third round where characters get what they want, but those desires were shaped by someone else. The user is worried this might come off as a gimmick. They also want practical advice on timing, avoiding pitfalls, and how to handle real-time adjustments.

  Breaking it down: The session needs to be engaging and hands-on. Writers will role-play household scenarios, then debate who's the freest, revealing conflicting definitions of freedom. The debrief maps their experiences to political philosophy concepts—negative, positive, and social freedom—without naming them upfront. The user mentioned avoiding homework or shared readings, so everything must be self-contained within the 90 minutes.

  The user's deeper needs might include making abstract concepts tangible through lived experience. Since they're mid-draft, they might seek personal clarity for their novel by testing these ideas in the workshop. They also need the session to be memorable so participants apply these insights to their writing. The open mic stake adds urgency but could derail if not managed.

  Potential pitfalls: Someone villainizing the husband in Round 1, ruining the nuance. Or the third round feeling forced. Time management is crucial—each round must be short. Also, ensuring participants grasp the differences in freedom without explicit terms until the end.

  For the third round: To avoid it being a parlor trick, the role-play must make the shaped desires feel authentic. Assigning roles like the Shaped Daughter, whose choices align perfectly with the Grandmother's expectations, could work. The key is showing that fulfillment without external obstacles doesn't equal freedom if internal desires aren't autonomous.

  Logistics: Three 15-minute rounds plus intros and debrief. Handouts with role cards for clarity. The facilitator's role is to guide without lecturing. Contingencies: If someone plays the husband as a villain, redirect by emphasizing the rules. If Round 3 falls flat, highlight the character's lack of self-reflection during the debrief.

  The user asked to flag the least confident part—it's Round 3's execution. Watching for participants not engaging with internal constraints or missing the point. Solutions: Prep the actor playing the Shaped Daughter to vocalize internal monologue, or adjust debrief questions to draw out the dissonance between desire fulfillment and autonomy.

  Overall, the design needs to balance structure with flexibility. Keeping activities time-boxed, using physical voting for engagement, and connecting the exercise to the user's novel problem. The debrief is where the learning crystallizes, so guiding the mapping carefully without jargon is essential.
answer: |-
  Here’s a battle-tested design for your workshop, calibrated to dodge pitfalls and maximize discovery. The "shaped desire" round is **essential**—it’s not a parlor trick if framed right. I’ll flag where to watch for trouble.

  **Core Structure:**  
  **0-10 min:** Setup & Rules  
  **10-55 min:** Three Rounds of Role-Play (15 min each)  
  **55-75 min:** Debate & Voting ("Who’s freest?")  
  **75-90 min:** Debrief & Mapping  

  ---

  ### **PREP**  
  - **Handouts:** 14 role cards + 3 "House Rule" sheets (laminated for reuse).  
  - **Roles:** 6 family roles (see below), 8 "external observers" (neighbor, priest, schoolteacher, etc.). Observers interview family members during rounds.  
  - **Stake:** Winning scene gets *first* slot at open mic; runner-up gets last slot. Group votes *after* all scenes are written.  

  ---

  ### **ROUNDS & RULES**  
  *(Each round: 10 min role-play + 5 min in-character writing prompt)*  

  1. **ROUND 1: NEGATIVE FREEDOM ("No Direct Obstacles")**  
     - **House Rules:** *"No one may forbid or physically prevent another from acting. No threats."*  
     - **Roles:**  
       - Husband (runs textile workshop at home)  
       - Wife (wants to convert shed into a school)  
       - Elderly Mother (wants quiet, hates "unseemly" change)  
       - Daughter (wants to study engineering)  
       - Son (wants to play violin, not work)  
       - Aunt (wants to marry the neighbor)  
     - **Writing Prompt:** *"Write your character’s private diary entry about what they did today and why."*  
     - **Trap:** The Husband *won’t forbid* the Wife’s school, but might "reasonably" argue the shed is needed for storage, or sigh about "disharmony." The Mother might faint at the "vulgar" idea. Freedom exists *only* if no one actively blocks you.  

  2. **ROUND 2: POSITIVE FREEDOM ("Capacity to Self-Direct")**  
     - **House Rules:** *"Anyone may request resources/time for self-betterment. The family must vote on granting it."*  
     - **Same Roles, New Conflict:** Wife now wants to attend teacher training (requires money/time). Daughter wants apprenticeship. Son needs a violin tutor.  
     - **Writing Prompt:** *"Write a letter to your future self about what you wish you could pursue."*  
     - **Trap:** Resources are scarce. Voting becomes manipulation ("Why not wait until next year, dear?"). Freedom requires means/opportunity, not just lack of veto.  

  3. **ROUND 3: SHAPED DESIRE ("Socially Manufactured Wants")**  
     - **House Rules:** *"The Grandmother’s portrait oversees the main room. Her stated values (on card) guide the home. All desires align with her vision."*  
     - **Grandmother’s Card:** *"A harmonious home requires: piety, thrift, duty, modesty. Avoid ambition and novelty."*  
     - **Roles Adjust:**  
       - Wife (deeply wants to host frugal, pious sewing circles)  
       - Daughter (dreams of perfecting lace-making to honor Grandmother)  
       - Son (aspires to manage accounts for Father’s workshop)  
       - *Add Observer Prompt:* *"Interview a family member: ‘How did Grandmother shape your happiest memory?’"*  
     - **Writing Prompt:** *"Write Grandmother a thank-you note for the life she enabled."*  
     - **Key Nuance:** No coercion. Characters feel genuine joy fulfilling these roles. Freedom is absent because desires aren’t self-authored.  

  ---

  ### **WHAT WILL GO WRONG (AND FIXES)**  
  1. **"Villain Husband" in Round 1:**  
     - **Watch For:** Players having Husband say "I forbid it!" or threaten.  
     - **Fix:** Interrupt gently: *"Remember House Rules: no forbidding. How might he *discourage* without blocking? Maybe he ‘needs the shed for urgent business’?"* Refocus on *structural* limits.  

  2. **Round 3 Feels Fake or Parodic:**  
     - **Watch For:** Players rolling eyes or making characters robotic.  
     - **Fix:** Prep role-players: *"Play this earnestly. Your character finds deep satisfaction here. This isn’t hypocrisy—it’s internalized identity."* Have observers probe for *genuine* emotion in interviews.  

  3. **Debate Stalls on Superficial Definitions:**  
     - **Watch For:** "Wife is freest—she got the shed!" vs. "No, Son is—he skipped work!"  
     - **Fix:** Force specificity: *"When you say ‘free,’ what exactly do you mean? Ability to act? Ability to choose? Something else?"* Record phrases on a board.  

  ---

  ### **DEBRIEF & MAPPING (75-90 min)**  
  1. **Group Vote:** "Who was *freest* in the *entire* household?" (5 min). Tally votes publicly.  
  2. **Elicit Definitions:** *"What did ‘free’ mean to you when voting? Give examples."* (Write responses: "No one stopped her," "He got resources," etc.) (10 min).  
  3. **Reveal Labels (NO JARGON FIRST):**  
     - *"In Round 1, we explored freedom as ______"* → Let them define → **"Often called ‘freedom from interference’ (negative liberty)."**  
     - *"Round 2 asked if freedom requires ______"* → Their words → **"Sometimes termed ‘freedom to self-direct’ (positive liberty)."**  
     - *"Round 3 showed freedom isn’t just getting what you want if ______"* → Their observations → **"What if desires are shaped by others? That’s ‘social freedom’—control over the *formation* of wants."**  
  4. **Connect to Your Novel:** *"My protagonist gets everything she asks for. Why doesn’t she feel free? Which rounds feel most like her world?"* (2 min).  

  ---

  ### **WEAKEST LINK: ROUND 3**  
  - **Why I’m Least Confident:** Internalized desire is abstract. Writers may default to satire ("I LOVE LACE!") or miss the point entirely.  
  - **What to Watch For:**  
    - 🚩 Players laughing *at* characters, not empathizing.  
    - 🚩 Observers report "They seem happy/free" without nuance.  
  - **On-the-Spot Fixes:**  
    - If it bombs, **cut the writing prompt**. Have observers share interview snippets exposing *how* Grandmother’s influence lives on ("She’d be so proud when I..." or "I tried wanting X once, but it felt wrong").  
    - In debrief, **contrast Round 3’s "fulfillment" with Round 2’s "frustrated potential."** Ask: *"Who had more freedom: the Daughter who couldn’t apprentice, or the Daughter who never wanted to?"*  

  ---

  ### **WHY THIS WORKS FOR YOUR NOVEL**  
  Your character’s prison isn’t locks—it’s the **invisible architecture of expectation**. This workshop forces writers to:  
  1. **Feel** the weight of unchallenged norms (Round 3),  
  2. **See** how "non-interference" masks control (Round 1),  
  3. **Debate** freedom’s layers *before* labeling them.  

  The "shaped desire" round earns its place if players leave unsettled by how easily they justified the Grandmother’s influence. That discomfort is your novel’s engine.  

  **Final Tip:** Start with a visceral hook: *"Raise your hand if your protagonist wants something they can’t have. What if they got it—and still weren’t free? Let’s find out why."* Then dive into roles.  

  You’ve got this. Trust the room to fight—then light the way home.
