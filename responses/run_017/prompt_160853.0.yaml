  Below is a decision tree for the "whether the numbers count" debate in rescue cases. It starts from the basic 5-vs-1 life-death scenario and branches through concrete cases to isolate distinct ethical positions. Nodes are ordered to separate common disagreements early (e.g., permissibility before aggregation mechanics). **12 branch nodes** lead to **9 leaf positions** (7 named, 2 unnamed), with each leaf's core tension noted. Paths are mutually exclusive where possible; unresolvable overlaps are flagged.

  ---

  ### **RESCUE CASE DECISION TREE**  
  *(Start as impartial rescuer in the basic case: Save 1 stranger or 5 strangers? All others die.)*

  #### **NODE 1: Basic Case**  
  Is it morally permissible to save the *one*?  
  - **No** → Saving the five is *required*. Go to Node 2.  
  - **Yes** → Saving the one is *permitted*. Go to Node 3.  

  #### **NODE 2: (Saving the five required)**  
  Can the verdict change if harms are unequal? Consider: *Save one from a broken arm, or save five from stubbed toes?*  
  - **No** → Verdict holds. Go to Node 4.  
  - **Yes** → Only applies to equal-severity harms. Go to Node 5.  

  #### **NODE 3: (Saving the one permitted)**  
  Is it morally permissible to save the *five*?  
  - **No** → **Leaf 1: Saving-Five-Forbidden View** (unnamed).  
    *Awkward: Forbids saving more lives when feasible, even if no one is harmed by the choice.*  
  - **Yes** → Both options permitted. Go to Node 6.  

  #### **NODE 4: (Required, unequal harms allowed)**  
  Does the verdict hold for tiny harms? Consider: *Save one from losing a hand, or save 1,000 from losing a finger?*  
  - **Yes** → **Leaf 2: Straight Aggregationism** (e.g., utilitarianism).  
    *Awkward: Requires saving vast numbers from trivial harms (e.g., 1B paper cuts) over one severe harm (torture).*  
  - **No** → **Leaf 3: Threshold Aggregationism** (unnamed).  
    *Awkward: Allows ignoring massive small-harm totals if one person’s harm is "severe enough."*  

  #### **NODE 5: (Required, equal-severity only)**  
  Why save the five in life-death cases? Basis:  
  - **Pairwise comparisons** → **Leaf 4: Contractualist Pairwise View** (e.g., Scanlon).  
    *Awkward: Fails when no individual in the five suffers more than the one (e.g., 1 death vs. 5 deaths).*  
  - **Priority to worst-off** → **Leaf 5: Prioritarianism**.  
    *Awkward: In equal-harm cases, reverts to numbers (but denies this is aggregation).*  

  #### **NODE 6: (Both permitted)**  
  Is saving the five *morally better* than saving the one?  
  - **No** → Go to Node 7.  
  - **Yes** → Go to Node 8.  

  #### **NODE 7: (Neither better)**  
  How decide?  
  - **Flip a coin** → **Leaf 6: Equal-Chances View** (e.g., Taurek).  
    *Awkward: In 1000-vs-1, gives each group 50% chance (not per-person fairness).*  
  - **Rescuer’s arbitrary choice** → **Leaf 7: Agent-Permission View** (Taurek-adjacent).  
    *Awkward: Allows saving the one arbitrarily even in 1000-vs-1.*  

  #### **NODE 8: (Saving five better but not required?)**  
  Why not required?  
  - **Agent-relative grounds** → Go to Node 9.  
  - **Inherently non-obligatory** → **Leaf 8: Satisficing View** (unnamed).  
    *Awkward: Permits "good enough" choices (saving one) even when better is easy and costless.*  

  #### **NODE 9: (Agent-relative exemption)**  
  Does the verdict depend on *who you are*? Consider: If *you* are the one, may you save yourself?  
  - **Yes** → **Leaf 9: Standpoint-Dependent View** (e.g., Nagel).  
    *Awkward: Allows the one to save themselves but requires a bystander to save the five.*  
  - **No** → Contradiction; revisit Node 8.  

  #### **NODE 10: (From Node 2/5)**  
  Does the verdict hold under risk? Consider: *Save one certain to die, or save five who each have 20% chance of death?*  
  - **Yes** → Aggregation robust to risk (supports Leafs 2, 4, or 5).  
  - **No** → Go to Node 11.  

  #### **NODE 11: (Risk matters)**  
  Why? Basis:  
  - **Expected lives saved** → Still aggregates (supports Leaf 2).  
  - **Certain harm vs. risk** → **Incommensurability Leaf** (see Node 12).  

  #### **NODE 12: (From Node 6/7/8)**  
  Can harms be compared interpersonally?  
  - **No** → **Leaf 10: Incommensurability View** (e.g., Raz).  
    *Awkward: No rational way to justify saving anyone, leading to paralysis.*  
  - **Yes** → Continue to prior nodes.  

  ---

  ### **UNRESOLVED OVERLAPS**  
  - **Leaf 6 (Equal-Chances) vs. Leaf 7 (Agent-Permission)**: Both deny saving the five is better, but differ on *how* to choose. The tree separates them via Node 7.  
  - **Leaf 4 (Contractualist) vs. Leaf 5 (Prioritarian)**: The tree isolates them via Node 5 (basis for requiring saving five).  

  ---

  ### **NASTY FOLLOW-UP CASES**  
  *(For students sharing a leaf but likely holding deeper disagreements)*  
  1. **The Asleep Five**: Save one awake person, or five who are asleep (and will never know they were in danger). Does your view change? *Tests experientialism vs. objective harm*.  
  2. **The Identifiable Victim**: Save one (who is named/vivid) or five anonymous strangers. Does vividness outweigh numbers? *Tests aggregation consistency*.  
  3. **The Third Option**: If you *don’t act*, all six die. Now, is saving the five *required*, or may you still save the one? *Tests negative vs. positive duties*.  

