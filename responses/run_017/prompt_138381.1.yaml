  The user mentions two types of sensitivity: supervenience-based and deletion-based. Supervenience-based relies on the physical basis changing, affecting the judgment. Deletion-based removes the phenomenal state while keeping everything else the same, leading to the same judgment. The challenge is to find a conceptual issue that depends on which sensitivity is used, beyond just which counterfactual is correct.

  I need to avoid the coarse-grained examples like self-undermining or zombies. The issue should be one where epiphenomenalists might disagree even after choosing a sensitivity type. Let me think about what kind of question would fit. 

  Hmm. What about the reliability of introspection? If an epiphenomenalist uses deletion-based sensitivity, the judgment stays the same without the phenomenal state, making the process unreliable. But under supervenience-based, the physical change would alter the judgment, so it's reliable. But is reliability necessary for knowledge? Maybe some argue that even if unreliable, true judgments can still be knowledge through luck. That's Gettier territory. 

  Ah, so the question could be: "Does the epiphenomenalist's account require that introspection is reliable to explain knowledge of phenomenal states?" Using deletion-based, reliability is compromised, so the epiphenomenalist must argue that reliability isn't necessary. Under supervenience-based, reliability holds, so they might lean on that. The substantive issue is whether knowledge depends on reliable processes or if something else suffices. 

  This isn't about counterfactual semantics but about the conditions for knowledge. Epiphenomenalists could disagree on whether reliability is essential, leading to different defenses of their view. That seems to meet the user's criteria. Let me structure that clearly.
answer: |-
  Here’s a conceptual issue arising from the distinction between supervenience-based and deletion-based sensitivity, framed as a precise question:

  **The Issue:**  
  *Must the epiphenomenalist concede that our introspective judgments about phenomenal states are only accidentally true, even if they are counterfactually sensitive?*  

  **Generated by:** Deletion-based sensitivity.  

  ### Why it’s substantive (beyond counterfactual semantics):  
  Under **deletion-based sensitivity**, if we hold the physical state fixed and "delete" the phenomenal state *S*, the judgment about *S* remains unchanged (since *S* is causally inert). This implies that the judgment’s truth depends *solely* on the physical substrate, not on *S* itself. Consequently, the actual truth of the judgment (when *S* is present) appears **accidental**—it holds only because the physical state happens to correlate with *S*, not because *S* contributes to the judgment’s accuracy.  

  Under **supervenience-based sensitivity**, sensitivity arises because the absence of *S* entails a *physical difference* that the introspective mechanism detects. Here, the judgment tracks *S* via its physical base, avoiding accidental truth.  

  ### Why this is a substantive disagreement for epiphenomenalists:  
  Even if epiphenomenalists agree that deletion-based sensitivity is the "correct" reading (e.g., due to strict causal exclusion), they might *disagree* on whether this accidental truth undermines **introspective knowledge**. Some could argue that knowledge requires non-accidental truth (rejecting "epistemic luck"), forcing them to either:  
  - Deny that we have knowledge of phenomenal states (undermining the paradox’s premise), or  
  - Revise epiphenomenalism to avoid deletion-based sensitivity.  
  Others might defend that sensitivity *alone* suffices for knowledge, even if truth is physically "accidental."  

  This debate hinges on **epistemology** (the nature of knowledge/justification) and **metaphysics** (how truth-makers relate to judgment), not merely counterfactual semantics. It challenges whether epiphenomenalism can reconcile sensitivity with *non-accidental* introspective knowledge—a core tension in the paradox.  

  ---
  **Key Clarification:**  
  This issue is distinct from "self-undermining" (which questions whether epiphenomenalism can be rationally believed) because it targets the *specific mechanism* of introspective knowledge. It asks whether the *truth-connection* in such judgments is robust enough for knowledge, given epiphenomenalism’s constraints—a finer-grained challenge.
