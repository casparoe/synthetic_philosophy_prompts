  The user's example about jade is key. They pointed out that what was once considered one mineral is actually two different ones: jadeite and nephrite. Their interlocutor argued this just means mineralogy hadn't found the real joints. So each thesis must be checked for whether it allows that response—seeing every categorization failure as our mistake rather than a reflection of reality's structure.

  Starting with the trivial interpretation: if joints are just about usefulness, then jade being two minerals doesn't mean we missed a joint; it just means our old category wasn't useful anymore. So the interlocutor's move isn't supported here. But this view might be too weak for scientific realism.

  Moving to induction-support: categories that allow predictions. The old jade category might not support good inductions because the two minerals have different properties. Revising the category is necessary, but it doesn't imply a unique correct taxonomy. The interlocutor's claim of "not yet found" might be too strong here since multiple categorizations could work.

  Causal clustering involves properties that co-vary due to underlying mechanisms. Jadeite and nephrite have different causal structures, so splitting them makes sense. However, causal clusters might not be unique; different perspectives could yield different clusters. So the interlocutor's insistence on "one true taxonomy" might not hold, though the revision is justified.

  Convergent realism suggests that different investigative methods would agree on the same categories. If mineralogical analysis, chemistry, etc., all point to two minerals, then jade's case shows progress. But convergence doesn't guarantee a single taxonomy; it might be domain-specific. The interlocutor could argue we're moving closer, but it's not absolute.

  Exceptionless laws require strict natural laws. Mineralogy might not have such laws due to complexity. Jade's revision is progress, but if there are no exceptionless laws in mineralogy, the joints might not exist in that sense. The interlocutor's move depends on whether such laws are possible, which is debatable.

  Unique taxonomy posits one true structure. Here, any error is ours, which directly supports the interlocutor. But this is metaphysically heavy and hard to defend. Pluralism allows multiple valid categorizations, so jade being split doesn't mean the old category was wrong, just context-specific. The interlocutor's dismissal isn't justified here.

