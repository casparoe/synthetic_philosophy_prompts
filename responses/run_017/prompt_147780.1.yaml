prompt: |-
  I should say at the outset how I came to this, because I suspect it biases me. I spent thirty-one years as a comparative physiologist — thermal tolerance in small desert mammals, mostly, which is a roundabout way of saying that I spent my career measuring how far a still-functioning regulatory system can be pushed before its control loops fail — and on retiring I joined a philosophy reading group largely for the arguments. That has turned into a small unpaid appointment: I am now the scientific member of the Condition Review Panel of a regional health system. We meet monthly, eight of us (three clinicians, a health economist, a lawyer, two patient representatives and me), and we work through a docket of eight to twelve petitions asking that some state be entered on the Schedule of Covered Conditions, or struck from it. Listing is not cosmetic: it controls reimbursement, eligibility for workplace accommodation, inclusion in screening programs, and, less tangibly, whether people are entitled to say they are ill. Our enabling regulation tells us to list a state only if it is, and here I quote our own rule, "a departure from normal functioning that a reasonable person would want treated" — a sentence which, as the reading group has convinced me, quietly bundles together the two positions that the philosophy of medicine keeps apart: the naturalist one, which tries to define disease in terms of statistical departure from species-typical functional organization, and the normativist one, which holds that the concept is irreducibly evaluative, together with the various hybrid attempts to split a factual dysfunction component from a value-laden harm component and assign each to a different stage of the analysis.

  What I need from you is not more theory but something we can actually run. Please give my panel a decision procedure: an ordered sequence of gates, each with a question, a statement of what would count as a sufficient answer at that gate given the evidence we can realistically assemble, an instruction about where the sequence stops with a no, and — this is the part I care most about — an explicit handoff point where the remaining question is one of values rather than fact and must be recorded and voted on as such, by named people, so that it can be reopened later without pretending we had evidence we did not have. The operating constraints matter and are not negotiable: we receive a one-page dossier per petition, we have about twenty minutes of discussion per item, none of my colleagues has any philosophy, and every decision must be written up in a single paragraph of reasons that a reviewer can audit in three years' time. We already maintain four verdicts, which you may use, replace or subdivide as the theory recommends: disease; risk factor; variation requiring no listing; and a provisional listing with a mandatory sunset review, which we invented ourselves and which I suspect is doing more work than we admit. The docket also contains petitions from two directions, applications to add and applications to remove, and I would like the procedure to treat delisting as a genuinely different exercise rather than as listing run backwards.

  Then please run the procedure on three petitions from a recent docket, showing the reasoning at each gate rather than just the verdict. The first is severe sarcopenia in an eighty-five-year-old, which is close to statistically typical for that age and yet is disabling in a way nobody disputes. The second is asymptomatic nocturnal oxygen desaturation, detected only by continuous home monitoring in a forty-thousand-person observational substudy, where most of the people flagged will never have a clinical event but a minority will have a serious one. The third is a condition listed eleven years ago at the urging of a patient organization, defined entirely by a symptom cluster and a cut-point on a questionnaire, with no mechanism ever identified and no biomarker: I will not tell you which way I think it should go, and I would particularly like you to work this one through even if — perhaps especially if — the procedure returns an answer that would be unpopular with the petitioners, with my colleagues, or with me. Finally, two things I would like you to be blunt about. First, flag the places where my own instinct is doing the work: I am strongly drawn to the thought that the biology ought to settle these questions and that the evaluative part is where rigor goes to die, and I would rather be told where that instinct is distorting the procedure than be flattered in it. Second, say what the procedure cannot do — which comparisons it cannot make for us, which costs it cannot price, and which of our recurring disputes it will simply re-describe rather than resolve. I would be grateful for an answer in American English.
reasoning: |-
  Okay, let me approach this systematically. The user is a retired comparative physiologist turned ethics panel member, clearly frustrated by the theoretical-philosophical deadlock in medical classification. They need a practical decision tool that separates factual assessment from value judgments within tight operational constraints.

  Hmm, the core tension here is between their scientific training (wanting biological facts to dictate outcomes) and the reality of medical classification (which inherently contains normative elements). Their description of the panel's work reveals several pain points: time pressure (20min/item), documentation needs (auditable paragraphs), and the delicate politics of delisting established conditions.

  First, I should design a gate sequence that forces explicit separation of questions like:
  - Is there objective dysfunction? (measurable biological deviation)
  - Does it cause harm? (subjective experience)
  - Would treatment be desired? (societal norms)

  The trick is making each gate binary with clear pass/fail criteria while allowing for that "provisional listing" category they mentioned. For the delisting pathway, it's crucial to require evidence that the original justification no longer holds - not just rerunning the listing criteria.

  Now for the case studies:
  The sarcopenia case perfectly illustrates the age-normalization problem - statistically common but functionally impairing. The procedure must surface where "normal for age" becomes a value call about which declines we medicalize.

  The nocturnal desaturation case is a classic risk factor dilemma. The gate sequence should force quantification of predictive value before letting the panel debate screening ethics.

  The vague symptom-cluster condition will test the procedure's robustness. Here the gates should ruthlessly expose the lack of biological evidence before reaching the value question about maintaining legacy listings.

  Throughout, I'll need to flag where the user's "biology should decide" instinct might short-circuit necessary debates - like when statistical abnormality conflicts with harm, or when removing poorly evidenced conditions faces political resistance.

  The real limitation of any such procedure will be its inability to resolve fundamental philosophical disagreements. It can only make them transparent for accountability. Also, it won't calculate cost-effectiveness or solve diagnostic gray zones - just clarify where those uncertainties live.
answer: |-
  Here is a practical decision procedure designed for your panel's operational constraints, followed by analysis of your three cases. It explicitly separates factual gates from value judgments and accommodates delisting as a distinct process.

  **Decision Procedure: Condition Listing Assessment Protocol (CLAP)**

  1.  **Gate 1: Measurable Deviation?**
      *   *Question:* Is there objective, replicable evidence of a measurable deviation from species-typical structure or function (biomarker, physiological test, anatomical finding, reproducible functional impairment test) that is *not solely dependent on subjective reporting*?
      *   *Sufficient Evidence:* Standardized clinical test results, validated imaging findings, lab values outside normal ranges (age/sex-adjusted), documented physical/neurological exam findings, or objective functional performance tests.
      *   *Stop/No:* If NO, proceed to Gate 1a. If YES, proceed to Gate 2.
      *   *Gate 1a (Deviation Measurable Only Subjectively):*
          *   *Question:* Is the deviation *only* measurable via validated patient-reported outcome measures (PROMs) or clinician assessment of reported symptoms?
          *   *Sufficient Evidence:* Existence of a validated questionnaire/scoring system with defined thresholds; documentation demonstrating consistent symptom cluster recognition.
          *   *Stop/No:* If NO, verdict = **Variation requiring no listing**. If YES, verdict = **Provisional Listing (Sunset Review Mandatory)**. *Record reason: "Listed solely on subjective/symptomatic criteria."*

  2.  **Gate 2: Functional Impairment/Dysfunction?**
      *   *Question:* Does the measurable deviation demonstrably impair a core biological function (e.g., mobility, respiration, cognition, metabolism, reproduction, immune defense) or a major life activity (e.g., self-care, work, social participation) *beyond minor or transient inconvenience*?
      *   *Sufficient Evidence:* Epidemiological data linking deviation to functional limitations; clinical studies showing functional improvement with correction; consistent clinical documentation of disability/impairment linked to the deviation.
      *   *Stop/No:* If NO, verdict = **Risk Factor** (if predictive of future Gate 2 failure) **or Variation requiring no listing** (if not). Proceed to Gate 3 if YES.

  3.  **Gate 3: Harmful Consequence?**
      *   *Question:* Is there consistent evidence that the functional impairment/dysfunction leads to significant harm? (Harm = increased mortality, morbidity, pain, suffering, or substantial loss of opportunity/autonomy).
      *   *Sufficient Evidence:* Mortality/morbidity statistics; studies on pain, quality of life, or economic impact; documented adverse outcomes directly linked to the dysfunction.
      *   *Stop/No:* If NO, verdict = **Variation requiring no listing**. If YES, proceed to **Gate 4 (Handoff to Values)**.

  4.  **Gate 4: Value Judgment - "Reasonable Person" Treatment Desirability** *(Recorded Vote Required)*
      *   *Question:* Would a reasonable person, fully informed about the nature of the deviation, its typical functional consequences, the associated harms, and the available interventions (including risks, burdens, and likelihood of benefit), want this state treated, managed, or mitigated?
      *   *Sufficient Input:* Summary of evidence from Gates 1-3; data on treatment efficacy/safety; patient representative input on lived experience; health economist input on burden.
      *   *Process:* Explicit panel discussion focused *only* on this value question. Chair states: "We now move to the value judgment gate." Each member votes YES (Disease) or NO (Variation requiring no listing). Votes recorded by name in minutes.
      *   *Outcome:* Majority vote determines verdict (Disease or Variation requiring no listing).

  **Delisting Specific Pathway:**
  1.  **Gate D1: Original Basis Valid?**
      *   *Question:* Does the *original evidence and reasoning* used to justify listing still meet the current CLAP criteria (Gates 1-4) based on current knowledge?
      *   *Sufficient Evidence:* Review of original petition and evidence; summary of new evidence contradicting or failing to support original Gates (e.g., biomarker invalidated, functional link disproven, treatment shown ineffective).
      *   *Stop/Yes:* If YES, listing stands. Proceed to Gate D2 if NO.
  2.  **Gate D2: Current Evidence Supports Listing?**
      *   *Question:* Does *new evidence*, independent of the original rationale, meet the current CLAP criteria (Gates 1-4)?
      *   *Sufficient Evidence:* As per standard CLAP Gates 1-3 evidence.
      *   *Stop/Yes:* If YES, listing stands (basis updated in record). If NO, proceed to **Gate D3 (Handoff to Values - Delisting)**.
  3.  **Gate D3: Value Judgment - Sustained Burden of Label** *(Recorded Vote Required)*
      *   *Question:* Does maintaining the listing, despite insufficient evidence per Gates D1/D2, cause more harm (e.g., unnecessary medicalization, stigma, inappropriate resource use) than benefit (e.g., continued access for a subset, research incentive)?
      *   *Process:* Explicit panel discussion on burden vs. benefit of the *label itself*. Vote DELIST (Variation requiring no listing) or RETAIN (Disease). Votes recorded by name.
      *   *Outcome:* Majority vote determines verdict.

  **Applying CLAP to Your Cases:**

  **Case 1: Severe Sarcopenia in 85-year-old**
  *   **Gate 1:** YES. Sarcopenia is measurable via DEXA scan, grip strength, gait speed (EWGSOP2 criteria). Objective deviation.
  *   **Gate 2:** YES. Severe sarcopenia demonstrably impairs core biological function (mobility, strength) and major life activities (ambulation, ADLs, fall risk). Evidence: Functional tests, ADL assessments.
  *   **Gate 3:** YES. Leads to significant harm: increased falls/fractures (morbidity/mortality), loss of independence (loss of autonomy/opportunity), potential pain. Evidence: Epidemiological studies, clinical data.
  *   **Gate 4 (Value Handoff):** *Question for Vote:* Would a reasonable person, knowing this causes disability and harm, want treatment (exercise, nutrition, possibly medication)? **VERDICT: DISEASE** (Likely unanimous or strong majority. The value judgment here aligns easily; the disablement is clear).

  **Case 2: Asymptomatic Nocturnal Oxygen Desaturation (NOD)**
  *   **Gate 1:** YES. Deviation measurable via objective home oximetry (SpO2 <88% for >5min, or similar validated threshold).
  *   **Gate 2:** NO (for *most* flagged individuals). *In the majority* detected by screening, it causes *no current* functional impairment or dysfunction (asymptomatic). No demonstrable impairment of core biological function *at the time of detection*.
  *   **Stop at Gate 2:** Verdict = **RISK FACTOR**. *Reason:* The measurable deviation (desaturation) is predictive of a *future potential* failure at Gate 2 (development of pulmonary hypertension, right heart failure, cognitive impairment) and Gate 3 (harm) in a *minority*. It is not *itself* a current dysfunction for most. *(Your instinct note: This is where biology/facts largely settle it - it's a risk marker, not a current dysfunction for the population. The value debate about screening/treating risk happens later, outside listing the state itself).*

  **Case 3: Symptom-Cluster Condition (Listed 11 yrs ago)**
  *   **Gate D1 (Delisting Start - Original Basis Valid?):** Original listing likely based solely on PROMs/symptoms (Gate 1a equivalent). Current knowledge: Still no identifiable mechanism or biomarker.
      *   *Current Gate 1:* **NO** (No objective measurable deviation beyond subjective report).
      *   *Current Gate 1a:* **YES** (It was defined by symptom cluster/questionnaire).
      *   Original listing would have yielded **Provisional Listing (Sunset Review)** under current CLAP.
  *   **Gate D2 (Current Evidence Supports Listing?):** Need to re-run CLAP Gates 2 & 3 using *current* evidence.
      *   **Gate 2 (Functional Impairment?):** Evidence? Does the symptom cluster *demonstrably* cause core biological dysfunction or major life activity impairment *beyond the symptoms themselves*? (e.g., objective cognitive decline, measurable immune dysfunction, inability to work demonstrably linked beyond self-report). *Likely insufficient evidence if no biomarker/mechanism exists and impairment is primarily defined by the same symptoms.* **Plausible NO.**
      *   **Gate 3 (Harmful Consequence?):** If Gate 2 is NO, stop. Verdict = **Variation requiring no listing**. If Gate 2 is YES, then: Is there evidence the *dysfunction* causes significant harm (mortality, severe morbidity, substantial loss) beyond the distress of the symptoms? *Likely difficult to demonstrate conclusively without objective dysfunction link.* **Plausible NO.**
  *   **Likely Path:** Fail Gate D1 (Original basis now Provisional-only). Fail Gate D2 (Insufficient current evidence for Gates 2/3). Proceed to **Gate D3 (Value Handoff - Burden of Label)**.
  *   **Gate D3 (Value Judgment - Sustained Burden of Label):** *Question for Vote:* Does keeping this label cause more harm (medicalization of distress, stigma, inappropriate treatments, resource diversion) than benefit (legitimizing patient experience, maintaining access for some, research)? **VERDICT:** This is the contentious vote. The procedure forces the panel to acknowledge: 1) There's no new *biological* evidence supporting it as a dysfunction. 2) The vote is *purely* about the societal value/impact of the *label*, not the reality of suffering. Outcome could be **DELIST (Variation)** or **RETAIN (Disease)** based on vote.

  **Addressing Your Requests for Bluntness:**

  1.  **Where Your Instinct is Doing the Work (Biology Bias):**
      *   **Gate 1 & 2 Focus:** CLAP heavily prioritizes *objective dysfunction* (Gates 1 & 2). This reflects your instinct that biology should anchor the process. This is largely sound for separating pathology from normal variation/risk. It directly tackles the "statistical departure" aspect.
      *   **Risk Factor Handling:** Case 2 (NOD) shows this strength. Your instinct to see it biologically as risk, not disease, is formalized in Gate 2.
      *   **Potential Distortion:** Your bias risks **under-valuing conditions primarily experienced subjectively** (like chronic pain syndromes, some psychiatric conditions) even when severely harmful. CLAP forces these into "Provisional" or relies heavily on Gate 4/D3 votes. Your instinct might make you *overly dismissive* of the evidence needed at Gate 1a (validated PROMs) or the legitimacy of the Gate 4 vote when biology is murky (like in Case 3). You might push for "Variation" prematurely before Gate 4 in complex cases. *The procedure forces these into explicit, recorded value judgments.*

  2.  **What the Procedure Cannot Do:**
      *   **Resolve Fundamental Philosophy:** It doesn't settle the naturalist/normativist debate; it *administratively separates* the components. It re-describes the dispute ("Is this Gate 2 failure a biological fact or are we undervaluing this experience?") but doesn't resolve it.
      *   **Determine Cost-Effectiveness:** It assesses "disease" status, not treatment value. A "Disease" verdict says nothing about whether treatment *should* be covered or prioritized. That's a separate (economic/policy) decision.
      *   **Define "Species-Typical":** It relies on prevailing medical norms for tests/ranges (e.g., "normal" SpO2, DEXA Z-scores). Challenging these definitions (e.g., age-adjustment in Case 1) is outside its scope.
      *   **Handle Gray Zones Perfectly:** Gates require binary decisions (Yes/No). Clinical judgment is still needed to interpret evidence within the gate criteria (e.g., "Is *this* level of impairment sufficient for Gate 2?").
      *   **Eliminate Politics:** It makes value judgments *explicit and recorded*, but doesn't prevent lobbying, emotional appeals, or panelist biases from influencing Gate 4/D3 votes. It just makes it auditable.
      *   **Price Costs:** It cannot quantify the financial or societal costs of listing/delisting. The health economist's input in Gate 4/D3 is qualitative.
      *   **Compare Conditions:** It assesses each petition on its own merits against the gates. It doesn't rank conditions or compare severity *between* different listed diseases.

  **Summary:** CLAP provides a structured, auditable sequence prioritizing objective biological dysfunction (Gates 1-2) and harm (Gate 3), forcing explicit, recorded value judgments only when necessary (Gate 4/D3). It accommodates risk factors, provisional listings, and treats delisting rigorously. It leverages your scientific rigor instinct for the factual gates but constrains its potential to prematurely dismiss subjective or complex conditions by mandating transparent value votes. Its limitations lie in inherent philosophical tensions, cost-blindness, and reliance on prevailing biomedical definitions, but it delivers a workable, defensible process within your severe time and documentation constraints.
