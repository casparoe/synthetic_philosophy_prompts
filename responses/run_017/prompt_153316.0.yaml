  1. **A1. Neural Signature of Ignition**: Global workspace ignition, characterised by synchronised high-frequency oscillations in prefrontal and parietal cortices, is a robust neural correlate of access consciousness. It facilitates information routing to executive systems.  
     *Why both sign*: Agreed ignition is empirically detectable and functionally distinct, without presupposing its necessity for phenomenality.  

  2. **A2. Architectural Commitment**: Conscious processing involves a hierarchical architecture: low-level sensory buffers feed into a capacity-limited global workspace, which broadcasts to downstream consumers (e.g., memory, planning).  
     *Why both sign*: Both models incorporate this architecture, differing only on whether phenomenality exclusively depends on workspace entry.  

  3. **A3. Explananda: Subjective Richness**: Any complete theory must explain why subjects insist they experience richly detailed scenes (e.g., visual periphery, unattended staircases during absorbed thought) despite limited access capacities.  
     *Why both sign*: This introspective report is a datum requiring explanation, not dismissal.  

  4. **A4. Sperling Store Reality**: A high-capacity, fragile sensory store exists, lasting ~300–500 ms, supporting partial-report superiority. Its neural basis includes early visual and parietal activations.  
     *Why both sign*: Empirical evidence for the store is uncontroversial; disagreement concerns its phenomenological status.  

  5. **A5. Evidence on Richness**: Current data confirm that subjective richness often exceeds access precision in peripheral/crowded vision. This does not prove phenomenal overflow, as reconstruction from gist or expectations could explain the impression.  
     *Why both sign*: Both acknowledge the explanandum but dispute its mechanism.  

  6. **A6. Ignition’s Functional Role**: Ignition is necessary and sufficient for access consciousness (report, deliberation). Its absence precludes reliable report.  
     *Why both sign*: Neural and behavioural data consistently link ignition to access.  

  7. **A7. Overstated Arguments**:  
     - Global workspace defenders have overstated that *all* unreportable content is "unconscious," neglecting fringe phenomenology.  
     - Overflow defenders have overstated Sperling as *direct* evidence for overflow, ignoring alternative interpretations of the store.  
     *Why both sign*: Each side acknowledges weaknesses in their camp’s rhetoric.  

  8. **A8. Testability Principle**: Resolving disagreements requires innovative paradigms dissociating neural signatures of phenomenality from access. Neural decoding and no-report measures are essential tools.  
     *Why both sign*: Shared commitment to empirical adjudication beyond introspective reports.  

