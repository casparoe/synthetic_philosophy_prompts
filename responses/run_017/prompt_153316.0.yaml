  #### 3. Verbal Disputes  
  We identify one terminological dispute:  
  - **V1. Definition of "Phenomenal Consciousness"**: The workspace camp defines it by *what-it-is-likeness*, while the overflow camp ties it to *minimal subjective availability* (e.g., fringe awareness). This leads to differing thresholds for ascribing phenomenality to impoverished states (e.g., iconic memory).  
    *Why verbal*: If "minimal subjective availability" implies proto-access, it risks conflating phenomenality with weak access. Agreed: phenomenality should be defined by what-it-is-likeness *alone*.  

  - *Not verbal*: Disputes about neural signatures or functional architecture are empirical, not definitional.  

