prompt: |-
  I have been trying to apply Lakatos's distinction between progressive and degenerating problem shifts to episodes in my own field, and I find that I have confident verdicts on individual cases but no principle that yields them. I would like the principle, or an argument that there isn't one.

  My verdicts, in no particular order. (i) A programme answers an anomaly by modifying its protective belt, the modification is shaped entirely around that anomaly, and thirty years pass without its predicting anything new: degenerating. (ii) The same kind of modification, but a decade later it throws up a fact nobody had gone looking for, and the fact is then found: progressive — and I want to say progressive from the moment of the modification, though at the time it was indistinguishable from the one in (i), and I cannot say why the difference in outcome should reach backwards. (iii) A modification made and published before anyone had the relevant data, and then confirmed: progressive, and I feel it is more progressive than (ii), but I cannot say what the extra credit is for. (iv) A programme explains a fact that had been on the books for years and had played no part in building the theory: this counts in its favour. (v) A programme explains, very exactly, a fact it was constructed to fit: this counts for nothing at all — and here I am in trouble, because in both cases the fact was known first. (vi) A programme's central posit is eventually shown not to exist, while predictions derived from it keep succeeding: I still score it as progressive, uneasily. (vii) A programme keeps its name, its equations and its notation across a generation while quietly abandoning the commitment that made it distinctive — say, no longer claiming that the entities it is named after are real: I stop counting it as the same programme and I do not credit its later successes to the earlier one. (viii) Two groups work from the same hard core with different protective belts and publish against each other: that is one programme for purposes of appraisal, not two — which sits badly with (vii). (ix) A programme has stopped producing novel predictions and only absorbs anomalies, but there is no rival programme addressing the same phenomena: I will not say abandon it and I will not say it is healthy either; I want a verdict of not yet appraisable, even though degenerating looks like it should be a property of the programme alone. (x) Inside one nominally single programme, one small branch keeps turning up novel facts while everything around it only absorbs anomalies: I score the programme as degenerating, and I would still move a PhD student into that branch tomorrow — which makes me unsure what the unit of appraisal is supposed to be.

  The best I can do by way of a principle: a programme is progressive over a period just in case, over that period, its belt modifications yield more corroborated facts they were not introduced to explain than facts they were, and degenerating in the opposite case; and every such verdict is provisional, since a degenerating stretch can be redeemed later.

  Please test that against the ten cases and repair it. I want: the principle stated precisely, clause by clause, with the case that motivates each clause; its verdicts on cases I have not listed — a programme whose novel predictions are picked, after the fact, out of a large computer-generated space of its own variant models, each prediction being announced before the test; a programme sustained mainly by one well-funded group; two programmes that have merged their belts; and an honest statement of which of my verdicts the principle cannot keep, and at what cost in complexity it could keep them. One last thing matters to me practically: every formulation I have tried seems to need to know what happens over the next decade, and I have to decide this term whether to take a student off a line of work. If the appraisal can only be made in hindsight, tell me what the honest real-time surrogate is.
reasoning: |-
  Okay, let me start by really understanding what the user is asking. They're grappling with applying Lakatos's concepts of progressive and degenerating problem shifts in their own field. They have specific examples but can't find a unifying principle. They want a principle that fits their verdicts or an explanation why it's impossible.

  First, I need to break down each of their ten cases. For instance, case (i) is clearly degenerating—30 years without new predictions after a modification. But in (ii), the same modification leads to a novel prediction a decade later, which they see as progressive from the start. That's tricky because at the time, both looked identical. The user is stuck on why the outcome affects the past appraisal.

  Then there's (iii), where a modification predicts something new before data exists, which feels more progressive than (ii). But why? The user can't pinpoint the extra credit. Cases (iv) and (v) deal with explaining known facts. Explaining an unrelated fact (iv) is good, but fitting a fact the theory was built for (v) counts for nothing. But both involve known facts—so what's the difference?

  Case (vi) is interesting: the central posit is disproven, but predictions still succeed. The user scores it as progressive but uneasily. How does that fit? In (vii), a program keeps the same name and equations but drops a core commitment. The user no longer considers it the same program. But in (viii), different groups with the same hard core but different belts are still one program. That seems contradictory.

  Case (ix) involves a program only absorbing anomalies with no rivals. The user doesn't want to abandon it but won't call it healthy. They want a "not yet appraisable" verdict. (x) has a small productive branch in a degenerating program. They'd move a student there but call the whole program degenerating. The unit of appraisal is unclear.

  Their proposed principle links progress to novel predictions versus anomalies explained. But it has issues, like hindsight bias. The user needs real-time decisions, like advising a student now.

  I should check if a modified principle can handle all cases. For example, defining "novel prediction" as announced before testing, regardless of data existence. That covers (iii) and distinguishes (v). But (ii) and (i) still differ only by future outcomes. Maybe emphasize heuristic fertility—how the modification guides new research paths. That might explain why (ii) is progressive from the start, as it opened new avenues.

  Cases like (vi) and (vii) challenge program identity. If predictions succeed without the central posit, is the hard core still intact? Maybe the protective belt adaptations matter more. For (vii), if the hard core changes—like dropping entity realism—it's a new program. But (viii) maintains the same hard core despite different belts, so it's one program. That reconciles the contradiction.

  For (ix), without rivals, degenerating might not mean abandonment but requires monitoring. The real-time surrogate could be heuristic activity—are new lines of inquiry emerging? In (x), the unit of appraisal might be sub-programs. Advising a student to join a fertile branch makes sense even if the whole program is struggling.

  Additional cases: computer-generated predictions. If a model space is explored and a specific prediction is announced before testing, it counts as novel. But if it's cherry-picked after, it doesn't. Funding doesn't affect appraisal. Merged belts might create a new program if hard cores unify.

  The user's verdicts mostly fit, except (ii) can't be progressive from the start without hindsight. The cost is accepting that real-time appraisal is tentative, based on heuristic promise. The surrogate is tracking current research activity and whether modifications lead to new questions, not just anomalies.

  Also, the user needs practical advice for their student. Emphasize heuristic fertility: if the modification suggests new experiments or models, it's promising now, even if outcomes are future. That's the real-time indicator.
answer: |-
  Here is a principle rigorously constructed from your cases, tested against your verdicts and new scenarios, with explicit clauses, motivations, limitations, and a real-time surrogate. The core insight is that progress hinges on **heuristic fertility**—the capacity of modifications to generate *new, testable, and empirically successful research directions*, not just accommodate existing data.

  ### Principle: Heuristic Fertility Appraisal (HFA)

  1.  **Clause (Novelty):** A belt modification earns "progressive credit" only for corroborated empirical *novel facts*—facts not used in its construction *and* not part of the specific anomaly it was introduced to resolve. Novel facts must be predicted *and publicly announced* before empirical testing/comparison.
      *   *Motivation:* Cases (iii) (extra credit for pre-data prediction), (iv) (credit for explaining unrelated known facts), (v) (no credit for fitting data it was built for), (ii)/(i) (distinguishing outcome hinges on novel facts). "Publicly announced" prevents cherry-picking (addressed in new case below).
  2.  **Clause (Balance):** A programme is **progressive** over period T if the sum of novel facts corroborated (Clause 1) resulting from belt modifications made within T, exceeds the sum of anomalies those modifications were introduced to resolve. It is **degenerating** if the sum of resolved anomalies exceeds corroborated novel facts. It is **stagnant** if sums are roughly equal or negligible. *Verdicts are always relative to T.*
      *   *Motivation:* Captures the core intuition from your proposed principle and cases (i) (degenerating), (ii)/(iii) (progressive), (ix) (stagnant/"not yet appraisable" if no clear imbalance).
  3.  **Clause (Temporality & Provisionality):** Appraisals are inherently provisional and tied to the appraisal period T. A programme appraised as degenerating over T1 may be redeemed by becoming progressive over a later T2 that includes T1. *Appraisals cannot be final.*
      *   *Motivation:* Cases (i)/(ii) (outcome changes appraisal, but initial state is indistinguishable; appraisal only retroactively *changes* for period T1 based on later T2), (ix) (need for provisional verdict).
  4.  **Clause (Programme Identity):** A programme retains its identity if and only if its **hard core commitments** (methodological and ontological) remain unchanged. Changes to the hard core define a new programme. Protective belt variations within the same hard core constitute one programme.
      *   *Motivation:* Cases (vii) (abandoning ontological commitment changes hard core = new programme), (viii) (same hard core, different belts = one programme), reconciles apparent conflict between (vii) and (viii). Defines the unit of appraisal.
  5.  **Clause (Sub-Programme Appraisal):** Within a single programme (defined by Clause 4), distinct research strands ("sub-programmes") pursuing different protective belt strategies can be appraised independently using Clauses 1-3. The overall programme appraisal is the dominant trend among its active sub-programmes.
      *   *Motivation:* Case (x) (fertile branch vs. stagnant surroundings). Allows moving a student to a progressive sub-programme while acknowledging the broader programme's degeneration.

  ### Verdicts on Your Cases with HFA

  *   **(i) Degenerating:** 0 novel facts > 0 resolved anomalies? False. 0 novel facts < 1 resolved anomaly? True. → **Degenerating** (Clause 2).
  *   **(ii) Progressive (but verdict changes):** Over T1 (decade after mod): Initially 0 novel facts = 1 resolved anomaly? → **Stagnant** (Clause 2). Over T2 (after novel fact found): 1 novel fact > 1 resolved anomaly? True → **Progressive** *for T2*, which includes T1. T1 is *retroactively* seen as part of a progressive *sequence* culminating in T2, but its *isolated* appraisal remains stagnant (Clauses 2 & 3).
  *   **(iii) Progressive (More Credit):** Modification made/publicly announced *before* data exists/known. Novel fact corroborated. 1 novel fact > 0 resolved anomalies (assuming no specific anomaly). → **Progressive** (Clauses 1 & 2). *More credit* because it fulfills Clause 1 perfectly (pure prediction, no anomaly-fitting role).
  *   **(iv) Counts in Favor:** If the fact was not used in constructing the belt modification that explains it, and was not the anomaly it resolved, its explanation constitutes a corroborated novel fact → **Progressive Credit** (Clauses 1 & 2).
  *   **(v) Counts for Nothing:** The fact *was* used in constructing/guiding the modification → **No Progressive Credit** (Clause 1). Explaining it is merely resolving the anomaly (counts on the other side of Clause 2).
  *   **(vi) Progressive (Uneasily Resolved):** If predictions succeeding are *novel facts* (Clause 1) generated by belt modifications *post*-abandonment of the central posit, and these novel facts exceed anomalies resolved by those modifications → **Progressive** (Clause 2). The unease stems from the hard core being violated (Clause 4 might be challenged), but if predictions flow from the belt/core interplay *despite* the posit's falsity, and the hard core remains nominally intact, HFA scores it progressive. If the hard core *required* the posit, Clause 4 is violated → new programme.
  *   **(vii) New Programme:** Abandoning the commitment that made it distinctive likely changes the hard core → **New Programme** (Clause 4). Later successes not credited to the original.
  *   **(viii) One Programme:** Same hard core, different belts → **One Programme** (Clause 4). Appraisal (Clause 2) aggregates novel facts and resolved anomalies from *all* belt modifications within the programme.
  *   **(ix) Stagnant:** Novel facts ≈ Resolved Anomalies (or both negligible) → **Stagnant** (Clause 2). Lack of rival doesn't change appraisal, but justifies continued exploration ("not yet appraisable" maps to stagnant).
  *   **(x) Programme Degenerating, Branch Progressive:** Fertile branch is a **progressive sub-programme** (Clause 5). Dominant trend overall is degeneration → **Overall Programme Degenerating** (Clause 5). Moving a student to the branch is rational based on sub-programme appraisal.

  ### Verdicts on New Cases

  1.  **Computer-Generated Prediction Space:** A modification generates K possible models. Researchers publicly announce prediction P from model M *before* testing. P is corroborated.
      *   *HFA Verdict:* If P was a specific, testable consequence announced *before* testing, and M was selected based on the programme's heuristics (not just random/ad hoc), and P is a novel fact (Clause 1), it earns credit → **Progressive Credit** (Clauses 1 & 2). If "predictions" are cherry-picked *after* data is seen from the K options, **No Credit** (violates "publicly announced before testing" in Clause 1).
  2.  **Sustained by One Well-Funded Group:**
      *   *HFA Verdict:* Funding source is irrelevant to HFA appraisal. Appraisal depends solely on output: corroborated novel facts vs. resolved anomalies (Clauses 1 & 2). It could be progressive, degenerating, or stagnant.
  3.  **Two Programmes Merge Belts:**
      *   *HFA Verdict:* Merging protective belts while retaining distinct hard cores → Still **Two Programmes** (Clause 4), sharing some belt elements. Novel facts/resolved anomalies credited to each programme based on which hard core's heuristics generated the modification. If hard cores unify → **New Single Programme** (Clause 4).

  ### Cost of Keeping Your Verdicts & Limitations

  *   **Sacrificed Verdict:** Your intuition that (ii) is progressive *from the moment of modification* cannot be fully kept without hindsight. HFA initially scores it **Stagnant** (Clause 2, 3). The cost is accepting that real-time appraisal cannot guarantee future fertility; it can only assess current output and heuristic promise (see Surrogate below). The "reaching backwards" feeling arises because the *later* novel fact reveals the modification's *latent* heuristic fertility, which wasn't demonstrable at T1.
  *   **Complexity Costs:**
      *   **Clause 5 (Sub-Programmes):** Adds significant complexity by requiring tracking multiple strands within a programme. Necessary to handle (x).
      *   **Clause 1 (Novelty Definition):** Requires careful historical work to establish what was known/used when and if announcements were genuinely prior. Necessary for (iii), (v), computer case.
      *   **Clause 4 (Hard Core Definition):** Requires clear articulation and agreement on what constitutes the unchangeable hard core, which can be contentious (as in vi, vii). Necessary for identity.

  ### The Real-Time Surrogate: Heuristic Promise Assessment (HPA)

  Since HFA appraisal (especially Clauses 2 & 3) relies on outcomes over time, you need a real-time proxy for decision-making (e.g., assigning a student). Use **Heuristic Promise Assessment**:

  *   **Evaluate modifications for *heuristic fertility*:** Does the modification open up *new, concrete, testable research questions or predictions* distinct from resolving the immediate anomaly? Does it suggest new experiments, models, or connections to other domains *based on the programme's core principles*? Is this new direction actively being pursued?
  *   **Assess the *trajectory of research activity*:** Is the programme/sub-programme generating a steady stream of *new* empirical proposals and theoretical developments, or is effort focused solely on defensive adjustments to anomalies?
  *   **Compare to the *anomaly load*:** Is the rate/effort of generating new research directions significantly exceeding the rate/effort of resolving incoming anomalies?

  **Applying HPA to your student decision:** Don't judge the *outcome* of the line of work yet (HFA). Judge its *heuristic promise* (HPA):
  1.  Does the current modification/approach suggest genuinely new, testable ideas?
  2.  Is there a clear path forward for novel investigation?
  3.  Is this path more promising (based on programme heuristics) than alternatives?
  4.  Is the student equipped to explore these new directions?

  **Conclusion:** HFA provides a precise, clause-based principle grounded in heuristic fertility that captures most of your verdicts, albeit at the cost of complexity in defining novelty, programme identity, and sub-components. It sacrifices the desire for (ii) to be progressive instantly, replacing it with provisional stagnation pending future outcomes. For real-time decisions like advising a student, shift focus from historical appraisal (HFA) to forward-looking assessment of heuristic promise (HPA), which evaluates the *current potential* for generating the novel facts required by HFA later. This reflects Lakatos's core idea: science progresses through research programmes that successfully guide the discovery of novel facts.
