prompt: |-
  I host a twice-monthly long-form interview podcast on political philosophy — the audience is mostly people who took a course or two and remember the standard menu of consent, fairness, and rescue-based accounts, but who haven't kept up with the literature — and in two weeks I'm recording with a political theorist whose forthcoming manuscript rebuilds political obligation around a fiduciary model. Her central move is that the state's claim to be obeyed is not a debt incurred by accepting benefits, not a necessity imposed by the perils of a stateless condition, and not something actual consent ever really generates; it is the counterpart of fiduciary standing. We owe compliance, on her account, to whoever is entitled to act on our behalf, and that entitlement holds only so long as the power-holder genuinely conducts itself as a fiduciary must — loyal to the interests of those it administers, transparent about its reasons, non-arbitrary in its procedures. Two secondary claims are where I expect the real argument. First, she treats civil disobedience not as a moral anomaly needing special justification but as ordinary self-help in response to breach: because authority tracks fiduciary performance, the familiar requirements that resistance be public and nonviolent and that the resister accept punishment get demoted from duties of fidelity to mere strategic advice. Second, she bites two bullets on purpose. Against the worry that her account cannot explain why we owe obedience to *this* state rather than to any well-governed power, she bites the bullet that the duty is dischargeable by whoever meets the standard — including a non-state or transnational body — and calls the result her "unbundling proviso." Against the worry that one serious injustice destroys authority wholesale, she proposes a "proportionality proviso": authority is forfeited piecemeal, so a state that administers some domains unjustly loses its claim in those domains alone, and citizens owe each institution a share of compliance keyed to how well it performs.

  What I need from you is eight to ten interview questions that go beyond inviting her to restate any of that. My co-host is convinced the fiduciary framing is only a metaphor dressed as an argument, and I don't want to spend twenty minutes of tape on that; but I do want one question that forces her past the stock reply that the fiduciary claim is structural rather than metaphorical, and that presses on the fact that real fiduciary duties come with a settlor, an undertaking, ascertainable beneficiaries, and a forum that can enforce them, none of which ordinary law provides. For every question I also want a follow-up keyed to the answer she is most likely to give — the maneuver she has already made in the manuscript — and a one-line host's note on what a merely evasive answer would sound like, so I know when to push again.

  Please make sure the set covers, at minimum, these pressure points: (i) whether the fiduciary apparatus does any work beyond the claim that the state must govern well, given the missing settlor and enforcer; (ii) the unbundling proviso and the particularity problem, including whether it really commits her to saying we could owe obedience to a competently run private protection agency or an occupying administration, and why territoriality would survive at all; (iii) the proportionality proviso, who is supposed to measure fiduciary performance, and whether obligation then becomes hostage to contested empirical questions — predictive policing, carceral conditions, budget priorities — that ordinary citizens cannot adjudicate, so that nobody can ever know what they owe; (iv) the subjectivization worry that if each person judges breach for herself, the "duty" collapses into a license to comply whenever one independently approves of the law, which starts to look like the anarchist conclusion she is trying to avoid; (v) whether forfeiture has a threshold at all, and whether a dimmer-switch conception of authority is coherent with law's characteristic claim to settle what must be done regardless of one's own assessment; and (vi) what is lost if willingness to accept punishment is only prudential — whether disobedience can still function as a form of address to the community, and whether those who take the law to be valid owe it any respect. Close with one question about what evidence or case would genuinely count against the view, framed so that "that's a research program, not an objection" will not get her out of it.
reasoning: |-
  Okay, the user hosts a political philosophy podcast and needs interview questions for an upcoming guest who proposes a fiduciary model for political obligation. The guest's theory replaces traditional consent or necessity-based accounts with the idea that the state's authority comes from acting as a fiduciary. The user wants questions that go beyond restating the theory, pressing on key weaknesses like the metaphorical nature of the fiduciary framing, the unbundling and proportionality provisos, and potential contradictions.

  First, I need to understand the core concerns. The user mentioned six pressure points: whether the fiduciary model adds value beyond "govern well," the unbundling proviso's implications for territoriality, the proportionality proviso's measurement problem, subjectivization leading to anarchism, forfeiture thresholds conflicting with law's authority, and the loss of symbolic respect if accepting punishment is merely prudential. Plus, a closing question about falsifiability.

  The user's co-host thinks the fiduciary model is just a metaphor. So one question must challenge that directly, pointing out missing elements like a settlor or enforcer. The follow-up should anticipate her structural argument reply and push on how obligation arises without those elements. An evasive answer might dodge by restating the theory without addressing the gaps.

  For the unbundling proviso, the question needs to tackle whether obedience could be owed to non-state entities like private agencies. The follow-up should address territoriality's role, and evasion might deflect by focusing on performance without justifying why territory matters. The proportionality proviso question must ask who measures performance and how citizens can handle empirical disputes. Evasion here would involve hand-waving about institutions without concrete mechanisms.

  The subjectivization worry is crucial. The question should force her to explain why her model doesn't collapse into individual judgment, leading to anarchism. Follow-up on how this differs from philosophical anarchism, watching for evasion via vague appeals to fiduciary standards without addressing personal discretion.

  Forfeiture thresholds need to confront the dimmer-switch idea versus law's binary nature. Follow-up on how legal systems can function with partial authority. Evasion might involve examples without systemic explanation.

  The punishment question should explore the loss of fidelity's symbolic role. Follow-up on how respect is maintained if acceptance isn't a duty. Evasion here might shift focus to strategic benefits.

  Finally, the falsifiability question must demand a specific counterexample, not defer to future research. Follow-up to press for concrete criteria, avoiding evasion by broadening definitions.

  I should ensure each question has a follow-up and evasion note. Cover all six points plus the metaphor challenge and falsifiability. Structure questions to avoid yes/no, pushing for deeper engagement. Make sure they're concise and directly target the manuscript's arguments, using the user's terminology like "unbundling proviso" and "proportionality proviso."
answer: |-
  Here are 10 targeted interview questions addressing your pressure points, each with a strategic follow-up and an evasion note. They avoid simple restatement and push into argumentative territory:

  1.  **Question:** You frame the state's claim as fiduciary, but real fiduciary duties require a settlor (who establishes the trust) and a forum (to adjudicate breaches). The state lacks both. How does the *fiduciary concept itself* generate obligation here, rather than just being a vivid way to say "govern justly"? Isn't the core work still done by independent criteria of good governance?
      *   **Likely Answer:** Argue the fiduciary *role* creates a normative structure inherently generating duties of loyalty/care/procedure, independent of a specific settlor, rooted in the relationship of administration over fundamental interests.
      *   **Follow-Up:** But without a settlor's intent or an enforcer's sanction, what *binds* the putative fiduciary to this role? Isn't the "ought" still parasitic on prior moral/political claims about justice, making the fiduciary frame descriptive rather than genuinely obligating?
      *   **Evasion Note:** If she merely restates *that* the state *is* a fiduciary without explaining *how* the role imposes obligation absent settlor/enforcer, or conflates it with "good governance" generally.

  2.  **Question:** Your "unbundling proviso" directly tackles the particularity problem by saying obligation flows to *whoever* meets the fiduciary standard. Does this commit you to saying I could owe obedience to a brilliantly run private security firm patrolling my neighborhood, or even a benevolent occupying administration governing effectively after conquest? And if so, why does *this state's* territory matter at all?
      *   **Likely Answer:** Yes, in principle, any entity effectively and justly administering core functions for a population *could* generate obligation; territoriality is contingent, stemming from effective administration over a group, not inherent right.
      *   **Follow-Up:** Doesn't this radically undermine the traditional link between political obligation and *membership* in a specific political community defined by territory or history? If obligation is purely performance-based for whoever steps in, what prevents constant fragmentation or competing claims from multiple "fiduciaries"?
      *   **Evasion Note:** If she dodges specific examples (private firm/occupier) or retreats to vague notions of "community" without explaining how it survives pure performance-based obligation.

  3.  **Question:** On the proportionality proviso: Who is the arbiter of whether a state breaches its fiduciary duty in a specific domain (say, predictive policing algorithms or asylum processing)? If it's the citizen judging for themselves, doesn't this make obligation hostage to contested empirical and normative claims most citizens aren't equipped to evaluate, leading to pervasive uncertainty about what we actually owe?
      *   **Likely Answer:** Argue assessment is based on objective standards of loyalty, care, non-arbitrariness; citizens use reason/judgment, potentially aided by institutions like courts or watchdogs, but ultimate responsibility lies with the individual.
      *   **Follow-Up:** But if the standard is objective, yet its *application* to complex facts (e.g., budget trade-offs, policing efficacy) requires contestable judgments, and citizens must personally decide breach, how is this meaningfully different from saying "comply if you think it's just"? Doesn't this reintroduce the subjectivization problem at the point of application?
      *   **Evasion Note:** If she appeals solely to "objective standards" without addressing *who applies them* in practice and the resulting epistemic burden/uncertainty for citizens.

  4.  **Question:** Building on that: If each citizen judges for themselves whether breach has occurred in a domain, doesn't your account functionally collapse into philosophical anarchism? If I only owe obedience where *I judge* the fiduciary standard is met, haven't you just given a sophisticated reason for obeying only when I independently agree, rather than establishing a genuine *duty* to obey a presumptively valid authority?
      *   **Likely Answer:** Emphasize the fiduciary duty creates a *presumption* of obedience *if* the authority meets the standard; the burden of proof is on the citizen to show breach in a specific domain; it's not mere subjective approval.
      *   **Follow-Up:** But if the citizen determines both the standard's applicability *and* whether breach meets the threshold for forfeiture in a given case, doesn't that presumption evaporate in practice? How is "breach" different from "I disapprove strongly enough"?
      *   **Evasion Note:** If she repeats "presumption" or "objective standard" without explaining how the citizen's *personal judgment* of breach doesn't functionally negate the duty, or conflates strong disapproval with fiduciary breach definitionally.

  5.  **Question:** You reject a bright-line threshold for forfeiture, favoring a dimmer-switch model where authority fades proportionally to breach. But law characterically claims to *settle* what must be done, demanding compliance regardless of my private assessment. Is a dimmer-switch conception coherent with this core function of law? How can a legal system operate if its authority over, say, tax collection is only "partially on" for some citizens based on their assessment of performance in that domain?
      *   **Likely Answer:** Argue the law's claim is aspirational; actual authority depends on legitimacy derived from fiduciary performance. Coercion may still occur, but it lacks normative force where authority is forfeited. The system *can* function pragmatically, even if normatively patchy.
      *   **Follow-Up:** Doesn't this make the law's coordination and settlement function radically unstable? If "what I owe" depends on my contested assessment of performance in domain X, haven't you undermined law's very ability to provide a common framework for action, replacing it with pervasive moral disagreement about compliance?
      *   **Evasion Note:** If she focuses only on the *normative* lack of force without addressing the *practical incoherence* for a legal system requiring coordinated action under common rules.

  6.  **Question:** On civil disobedience: Demoting willingness to accept punishment to mere prudence severs the link between disobedience and fidelity. But doesn't this lose something crucial? Traditionally, accepting punishment signals respect for the *system* and addresses the community. If it's just about avoiding backlash, what distinguishes principled disobedience from mere evasion or rebellion? Can disobedience still *mean* "this law is invalid" if the actor prudently avoids consequences?
      *   **Likely Answer:** Argue the *act* of public disobedience itself is the primary communicative act to the community and the power-holder, signaling breach. Accepting punishment isn't necessary for the message; it might even signal undue deference to a failing fiduciary.
      *   **Follow-Up:** But doesn't the willingness to bear the cost demonstrate sincerity and commitment to the *community's* rule, even while protesting a specific rule? Doesn't reducing it to strategy risk turning principled dissent into just another form of self-interested bargaining, losing its distinct moral character?
      *   **Evasion Note:** If she dismisses the symbolic value entirely or reduces the "address to community" solely to the act of disobedience itself without engaging the specific role of accepting consequences as a fidelity signal.

  7.  **Question:** Let's test the boundaries of "domain." Does your proportionality proviso extend to *institutions* within the state? Could I judge the legislature meets the standard but the police do not, owing taxes but refusing to comply with certain police orders? Or is the state a unified fiduciary?
      *   **Likely Answer:** Likely argues for granularity – different branches/agencies can be assessed separately based on their functions and performance (legislature re: lawmaking, police re: execution, courts re: adjudication).
      *   **Follow-Up:** How does this interact with constitutional structure? If I judge the legislature breached by passing an unjust law, but the courts upheld it as constitutional, whose "domain" of authority prevails for me? Doesn't this invite citizens to pick and choose institutions, undermining the system's interdependent authority?
      *   **Evasion Note:** If she avoids specific institutional conflicts (legislature vs. courts) or treats the state monolithically after arguing for granularity.

  8.  **Question:** The fiduciary model emphasizes loyalty to beneficiaries' interests. How do we determine those "interests" in a pluralistic society? Doesn't this risk collapsing into paternalism ("we know your *real* interests") or, conversely, subjectivization ("my interests are whatever I say they are")?
      *   **Likely Answer:** Argue interests are objective (basic goods, security, liberty, procedural fairness) discernible through reason, though their specific instantiation requires democratic deliberation; the fiduciary must facilitate that deliberation fairly.
      *   **Follow-Up:** But doesn't intense disagreement persist about these "objective" interests (e.g., economic equality vs. liberty)? If the fiduciary must adjudicate among competing conceptions *and* citizens judge its fidelity in doing so, how is this not just kicking the political conflict down the road without resolving the source of obligation?
      *   **Evasion Note:** If she appeals to uncontroversial basic goods without addressing deep pluralism on their weighting and implementation, or conflates interests with subjective preferences.

  9.  **Question:** You position this as an alternative to consent, fairness, and natural duty accounts. What specific *explanatory work* does the fiduciary framework do that these traditional approaches *cannot*, especially regarding the *direction* of obligation (why *this* entity) and the *conditions* of forfeiture, that isn't already captured by insisting on just governance?
      *   **Likely Answer:** Emphasize the relational, role-based nature: It explains *why* an entity *administering* fundamental interests *owes* duties (loyalty, care) and why the *beneficiary* owes compliance *in return* for faithful administration, in a way consent (often absent) or fairness (diffuse) or natural duty (non-specific) fail to capture the specific bilateral normative link.
      *   **Follow-Up:** But doesn't the "in return" still depend on the *prior* value of "faithful administration"? If the core obligation to obey *still* hinges entirely on independent criteria of just rule (the "faithful" part), is the fiduciary structure adding anything more than a vivid metaphor for why just rule *should* generate obedience?
      *   **Evasion Note:** If she just restates the relational aspect without showing how it generates an obligation *distinct* from the independent value of the actions performed by the fiduciary.

  10. **Falsifiability Question:** What specific, observable real-world scenario would constitute decisive evidence *against* your fiduciary theory of political obligation? Imagine a situation where the state clearly meets your fiduciary standards (loyal, transparent, non-arbitrary in procedure) in a specific domain, yet widespread non-compliance persists without moral defect *or* conversely, where the state egregiously breaches yet compliance remains widespread and morally justified. Would either case force a revision?
      *   **Likely Answer:** Resist the hypothetical, argue compliance/non-compliance is empirical, not directly testing the *normative* claim of obligation; or argue widespread compliance despite breach might indicate false consciousness/misinformation, not valid obligation.
      *   **Follow-Up:** Precisely because it's normative, we need to know its conditions of defeat. If a population, fully informed and rational, living under a demonstrably (by your standards) perfect fiduciary in domain X, still felt *no* sense of obligation to comply with its non-burdensome rules in X, wouldn't that suggest the fiduciary structure *itself* doesn't generate the obligation you claim? Or if compliance persisted under clear, known tyranny without coercion, wouldn't that suggest obligation stems from elsewhere (habit, fear, apathy)?
      *   **Evasion Note:** If she dismisses the hypotheticals as unrealistic or irrelevant without specifying *what kind* of evidence *could* potentially falsify the core claim that the fiduciary role *generates* the obligation to obey.

  **Key Strategy During Interview:** Listen for the evasion notes. When you hear one ("Evasion likely if..."), use the pre-planned follow-up immediately. Be prepared to politely but firmly press: "I understand you're saying X, but my question was specifically about Y. Could you address Y directly?" Having these follow-ups ready signals you're engaging deeply and prevents her from retreating to rehearsed summaries. Good luck with the recording!
