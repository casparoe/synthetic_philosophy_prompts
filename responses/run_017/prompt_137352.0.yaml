   We'll break down the logical space by features of the scalar feedback signal (which we'll call R for reward) and the system's architecture and behavior. The features we consider are:

   1. Source of R: What is the reward computed from? (e.g., external environment, internal state, or self-generated)
   2. Functional role of R: Does it drive learning (weight updates), action selection (policy), both, or neither?
   3. Broadcast: Is R broadcast globally (to many components) or consumed locally (only by a specific module)?
   4. Deployment presence: Is R present at deployment (when the agent is acting) or only during training?
   5. Counterfactual representation: Does the system represent R (or the conditions that lead to R) counterfactually? (e.g., can it imagine or predict rewards in different scenarios?)
   6. Persisting subject: Is there anything persisting across updates to which experiences (episodes) can be attributed? (e.g., a stable self-model or a subject of experience)
   7. Self-modification: Can the agent act so as to change the R it will receive? (e.g., self-stimulation)

