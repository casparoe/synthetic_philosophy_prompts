  ### Constructed Case: The Groundwater Recharge Permitting Conflict

  **Statute:** *National Water Conservation and Sustainability Act (NWCSA)*  
  *Section 1: Findings and Purpose*  
  (a) Congress finds that groundwater resources are critical to agricultural sustainability, municipal water supply, and ecosystem health. Unregulated extraction has led to aquifer depletion, land subsidence, and saltwater intrusion in coastal regions.  
  (b) The purpose of this Act is to ensure sustainable groundwater management by requiring permits for new high-volume extraction wells, prioritizing recharge projects that replenish aquifers, and protecting designated "critical recharge zones" from activities that impede natural replenishment.  

  *Section 3: Permitting Requirements*  
  (1) Any entity seeking to drill a new groundwater extraction well with a projected withdrawal exceeding 100,000 gallons per day must obtain a permit from the State Water Board.  
  (2) Permits for extraction wells within designated critical recharge zones (as identified in the National Aquifer Protection Map published under Section 5 of this Act) shall be denied unless the applicant demonstrates that the well will not impede natural recharge processes.  
  (3) **Exemption:** No permit is required for wells used exclusively for managed aquifer recharge projects or for monitoring groundwater levels.  
  *(4) Critical recharge zones shall be updated biennially by the U.S. Geological Survey (USGS) using the methodology outlined in the 2023 Federal Groundwater Assessment Guidelines.*  

  **Later Change (Load-Bearing Feature):**  
  In 2025, Congress passes the *Scientific Data Modernization Act (SDMA)*. It directs the USGS to adopt a new methodology for defining "critical recharge zones" using satellite-based soil moisture sensors (replacing the 2023 Guidelines’ ground-based measurements). The SDMA *does not amend the NWCSA* but revises the underlying methodology referenced in NWCSA Section 3(4). Under the old method, "critical recharge zones" covered 12% of U.S. aquifers; under the new method, it covers 32% due to improved detection of subsurface water flow.  

  **Factual Scenario:**  
  *Parties:*  
  - **Heartland Agribusiness Inc.** drills a 150,000-gallon/day well in Nebraska for crop irrigation. The well is in an area designated as a *non*-critical recharge zone under the 2023 Guidelines but as a *critical* zone under the 2025 SDMA methodology.  
  - **The State Water Board** denies Heartland’s permit, citing NWCSA Section 3(2), because the well is in a critical recharge zone under the *current* USGS map (using SDMA methods).  
  *Stakes:* Heartland faces $500,000 in losses if barred from drilling. The Board argues the well would impede recharge in a drought-vulnerable aquifer.  

  ---

  ### Analysis  

  #### (1) Verdict Under Each Method  
  - **Textualist Approach (Heartland wins):**  
    The textualist focuses on NWCSA Section 3(4): Critical recharge zones must be updated "using the methodology outlined in the 2023 Federal Groundwater Assessment Guidelines." The SDMA replaced this methodology, but the text of Section 3(4) remains unamended. Applying the *whole-code* canon, the textualist reads NWCSA alongside the SDMA. The reference to "the methodology" is dynamic because:  
    - The canon of *meaningful variation* applies: Congress used specific dates elsewhere in NWCSA (e.g., "2023 Guidelines") but not in Section 3(4), implying an evolving standard.  
    - The *presumption of consistent usage*: SDMA’s command to USGS to "update all groundwater assessment methodologies" includes NWCSA’s referenced method.  
    Result: The current USGS map (using SDMA methods) controls. Heartland’s well is in a critical zone → permit denied.  

  - **Purposivist Approach (Heartland loses):**  
    The purposivist starts with NWCSA’s purpose clause: "protecting designated critical recharge zones from activities that impede natural replenishment." The 2023 methodology defined zones based on *proximity to surface water sources*, aligning with the original goal of protecting visibly vulnerable areas. The SDMA’s method (prioritizing *subsurface flow*) broadens the scope, covering areas where recharge is less directly observable. Applying the purpose at its *enacted level of generality* (protecting *known, high-risk* zones), the purposivist argues:  
    - Updating the map with a new method distorts Congress’s original balance between conservation and economic activity.  
    - The exemption for "recharge projects" (Section 3(3)) shows Congress prioritized human-assisted recharge only in *high-risk* areas.  
    Result: The 2023 methodology applies. Heartland’s well is outside the critical zone → permit granted.  

  #### (2) Load-Bearing Feature and Its Removal  
  - **Feature:** The SDMA’s *revision of the cross-referenced methodology* without amending NWCSA’s text.  
  - **Removal Effect:** If the SDMA had never passed (or if NWCSA Section 3(4) specified "the 2023 methodology *as in effect at enactment*"), both methods agree:  
    - Textualist: Static reference to 2023 Guidelines → Heartland’s well not in critical zone.  
    - Purposivist: Original method aligns with purpose → same result.  
    The divergence collapses.  

  #### (3) Strongest Textualist Objection  
  **Objection:** "You’re smuggling legislative history into the purpose clause. The text of Section 3(4) references a methodology *without* temporal anchoring, and the SDMA’s update is binding law. The purposivist is really just imposing their policy preference under the guise of ‘purpose.’"  
  - **Why It Bites:** This attacks the purposivist’s reliance on the purpose clause to override the textual implication of a dynamic reference. The textualist argues the purpose clause is too general to resolve the ambiguity—Section 3(4)’s text is the more specific provision.  
  - **Cost to the Case:** Minimal. The objection highlights a genuine tension (purpose vs. specific text), but the purposivist counters that the *entire statute* (including exemptions and findings) informs the purpose’s scope. The methods still diverge because the textualist prioritizes inter-statute harmony, while the purposivist privileges the NWCSA’s internal coherence.  

  #### (4) Expected Real-World Outcome & Value for Your Piece  
  - **Expected Appellate Outcome:** A 2-1 split. The textualist judge adopts the updated map; the purposivist dissents, invoking the purpose clause. The swing vote might join the textualist, citing *Chevron* deference to the USGS’s updated methodology—but since your case excludes vagueness, this is less likely.  
  - **Value vs. Chestnuts:** This case **better isolates the methodological divide**. Unlike *Church of the Holy Trinity* (minister case), there’s no "scrivener’s error" or absurdity. Unlike *Smith v. United States* (firearm-for-drugs), the term "methodology" isn’t ambiguous—it’s the *referenced material’s evolution* that creates conflict. The divergence stems purely from how each method handles *later changes to integrated legal structures*, showcasing textualism’s dynamism versus purposivism’s originalism.  

  ---  
  **Statute Drafting Notes:**  
  - The purpose clause is *in the enacted text* (NWCSA Section 1(b)).  
  - No vagueness escapes: "Critical recharge zones" are defined by a cross-referenced methodology, not terms like "reasonable."  
  - The change is structural (SDMA’s update to the methodology), not a drafting error.  
  - Textualists use canons (meaningful variation, whole-code reading); purposivists use purpose at its enacted specificity.  
  - Both readings are defensible: The textualist honors Congress’s *later* command (SDMA); the purposivist honors its *earlier* balance (NWCSA).  

  This case cleanly demonstrates that textualism and purposivism aren’t just about "words vs. intent" but about *temporal perspective* when laws interact dynamically.
