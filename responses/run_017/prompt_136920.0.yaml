  We are constructing a hypothetical case that satisfies the following criteria:
  1. The statute must contain its own purpose clause or findings section.
  2. The case must not rely on drafting mistakes, absurd results, constitutional avoidance, vagueness, or anachronistic meanings.
  3. The divergence must be generated by a structural feature that changed between enactment and application without amending the disputed words (e.g., a later-enacted statute in a different title, a revised cross-referenced regulatory schedule, a definition changed by subsequent amendment, or a term whose ordinary meaning drifted).
  4. Both textualist and purposivist methods must be applied competently, using the same materials (the enacted text, including the purpose clause, and the whole code as it stands at the time of application, including later enactments). The textualist is allowed to use the canons.

  We'll design a statute in the area of hospital billing, with a purpose clause. Then we'll create a factual scenario and analyze the case in four parts.

  **Statute**: Let's create a statute called the "Emergency Medical Treatment and Hospital Billing Accountability Act" (fictional). We'll have a purpose clause and then a substantive provision.

  **Purpose Clause**: "The purpose of this Act is to ensure that patients who receive emergency medical treatment are not subjected to surprise billing by hospitals that are out-of-network with the patient’s health insurance plan, and to establish a fair process for resolving payment disputes between such hospitals and insurers."

  **Substantive Provision (Section 3)**: 
  "(a) Prohibition on Balance Billing — In the case of emergency services furnished by a hospital that is out-of-network with respect to a group health plan or health insurance coverage, the hospital may not bill the patient, or impose any cost-sharing requirement on the patient, for an amount greater than the in-network cost-sharing amount that would apply if the services were furnished by an in-network hospital.

  (b) Payment Dispute Resolution — If the hospital and the insurer do not agree on the amount of payment for emergency services described in subsection (a), either party may initiate a binding arbitration proceeding. In such proceeding, the arbitrator shall consider the following factors:
     (i) the median in-network rate for the same or similar services in the same geographic area, as determined by the Secretary of Health and Human Services in the most recent annual report published under section 2799A-1 of the Public Health Service Act;
     (ii) the complexity and severity of the case;
     (iii) the training and experience of the providers; and
     (iv) any other factors the arbitrator deems appropriate.

  (c) Definitions — For purposes of this section:
     (1) The term 'emergency services' has the meaning given such term in section 2799A-1 of the Public Health Service Act.
     (2) The term 'median in-network rate' means the median of the contracted rates for the same or similar services in the same geographic area, as determined by the Secretary."

  **Note**: We have incorporated a cross-reference to section 2799A-1 of the Public Health Service Act (PHSA). We will assume that at the time of enactment of our hypothetical statute, section 2799A-1 defined "emergency services" and also provided a method for the Secretary to publish the median in-network rates annually.

  **The Change**: After the enactment of our statute, Congress amends the PHSA (in a different act) and replaces section 2799A-1 with a new section 2799B-1. The new section 2799B-1 changes the definition of "emergency services" to be broader (including, for example, certain urgent care services) and also changes the method for calculating the median in-network rate (now including rates from all provider types, not just hospitals, and using a different geographic unit). The amendment does not, however, update the cross-references in our statute.

  **Factual Scenario**:
  - Patient: Jane Doe, covered by a health insurance plan from ABC Insurance.
  - Hospital: St. Mary's Hospital, which is out-of-network with ABC Insurance.
  - Treatment: Jane goes to St. Mary's emergency room with symptoms of a heart attack. She is admitted and receives emergency services (which under the new definition in PHSA section 2799B-1 would include the urgent care she received the day before at an urgent care center that is part of St. Mary's system, but which at the time of the original statute would not have been included). The hospital bills ABC Insurance. The insurer and hospital cannot agree on the payment amount, so they go to arbitration.

  **The Dispute**: The arbitrator, following the factors in Section 3(b) of our statute, must determine the median in-network rate. The dispute centers on two points:
  1. The definition of "emergency services": The hospital argues that the services provided include the urgent care the day before, which under the current PHSA section 2799B-1 is now considered emergency services. The insurer argues that our statute's cross-reference to the old section 2799A-1 (which has been replaced) should be interpreted as referring to the definition in effect at the time of enactment of our statute, because the new definition would lead to including services that were not intended to be covered by the arbitration process at the time.
  2. The median in-network rate: The hospital argues that the arbitrator must use the rate as determined by the Secretary under the new section 2799B-1, which uses a broader set of data and a different geographic unit. The insurer argues that the reference to the old section 2799A-1 is a static reference and that the arbitrator should use the method in place at the time of enactment.

  **The Legal Question**: How should the arbitrator interpret the cross-references to section 2799A-1 of the PHSA in the definitions of "emergency services" and "median in-network rate" in our statute, given that section 2799A-1 has been repealed and replaced by section 2799B-1 with different definitions and methods?

  **Part 1: Verdict under each method**

  - **Textualist approach**:
    A textualist would note that the statute refers to "section 2799A-1" in two places: in the definition of "emergency services" and in the definition of "median in-network rate". The textualist would apply the canon that a reference to a statute that has been repealed and replaced is generally understood to refer to the successor statute, unless there is a contrary indication. This is supported by 1 U.S.C. § 109, which provides that the repeal of a statute does not affect pending actions unless the repealing act so provides, but also by the principle of "reference incorporation" which can be either static (as of the date of enactment) or dynamic (as amended). However, the textualist would also note that the reference is by a specific section number, and the statute does not say "as amended" or similar language. But the textualist would look at the whole code and see that the old section has been repealed and the new one is the current law on the topic. Moreover, the textualist would apply the canon that statutes should be read as a harmonious whole with the rest of the law. Therefore, the textualist would conclude that the cross-references in our statute now point to the new section 2799B-1 because that is the current law on the same subject. Thus, the arbitrator should use the broader definition of emergency services and the new method for calculating the median in-network rate.

    **Result**: The hospital wins on both points. The services include the urgent care, and the median in-network rate is calculated by the new method (which may be higher because it includes more provider types and a different geographic unit).

  - **Purposivist approach**:
    A purposivist would start with the purpose clause: to protect patients from surprise billing and to establish a fair process for resolving payment disputes. The purpose clause does not specify the scope of "emergency services" but does focus on "emergency medical treatment". The purposivist would note that at the time of enactment, the definition of emergency services in the old section 2799A-1 was narrower and did not include urgent care. The purpose of the statute was to cover true emergencies, and including urgent care (which is less acute) might extend the statute beyond its intended scope. Moreover, the purpose of the arbitration was to set a fair payment based on rates for similar services in the same area. The new method of calculating the median in-network rate includes non-hospital providers (like urgent care centers) and uses a larger geographic area, which might not reflect the rates for hospital-based emergency services. This could lead to unfairness: either underpayment for the hospital (if the rates are lower) or overpayment (if the rates are higher) but more importantly, it might distort the intended benchmark. Therefore, the purposivist would conclude that the cross-references should be read as static, pointing to the old section 2799A-1 as it existed at the time of enactment, to preserve the original balance and purpose of the statute.

    **Result**: The insurer wins on both points. The services do not include the prior urgent care, and the median in-network rate is calculated by the old method (using only hospital rates and the original geographic unit).

  **Part 2: The load-bearing feature**

  The load-bearing feature is the **subsequent amendment to the cross-referenced statute (the PHSA)** that repealed and replaced section 2799A-1 with a new section 2799B-1, changing both the definition of "emergency services" and the method for calculating the median in-network rate. This change occurred without our statute being updated.

  If we remove this feature (i.e., if the cross-referenced section had not been amended), then both methods would agree: they would use the definitions and rates from section 2799A-1 as written. The textualist would use the current version of section 2799A-1 (which would be unchanged) and the purposivist would also use it because it aligns with the purpose at the time of enactment. There would be no divergence.

  **Part 3: Strongest textualist objection**

  The strongest objection a textualist would make is that the purposivist is essentially using the purpose clause as a license to ignore the current law and freeze the statute in time. The textualist would argue that the purpose clause is general and does not specify the exact scope of the definitions or the method for calculating rates. Moreover, the textualist would point out that the statute incorporates the definitions by reference to a specific section, and the normal rule is that when a statute refers to another statute by specific title and section, and that section is later repealed and replaced, the reference is to the current version of the law on that subject. The textualist would also argue that the purpose clause cannot override the specific language of the statute, which incorporates a dynamic reference (by not specifying "as in effect on the date of enactment"). Therefore, the purposivist is engaging in the same kind of speculation about legislative intent that textualism rejects, and the purpose clause is being used as a proxy for legislative history.

  This objection bites hard because it challenges the core of the purposivist's method: using a general purpose to override the specific textual reference that has a clear meaning in the current legal context. The textualist would say that if Congress wanted the reference to be static, it would have said "as in effect on the date of enactment" (as it sometimes does). Since it did not, the dynamic reference is required.

  **Cost to the case**: This objection highlights that the divergence might be more about the level of generality at which the purpose is stated and the weight given to the purpose clause versus the specific text. However, it does not collapse the case because the purposivist would counter that the purpose clause is part of the enacted text and that the specific text (the cross-reference) must be interpreted in light of the entire statute, including the purpose. Moreover, the purposivist might argue that the change in the cross-referenced statute is so fundamental that it alters the operation of the statute in a way that Congress could not have intended when it passed the original law. The case survives because the methods genuinely differ on how to handle such a change.

  **Part 4: Expected appellate panel outcome and value for the piece**

  - **Expected outcome**: In a real appellate panel, I would expect a split decision. Some judges (textualists) would follow the updated cross-reference, while others (purposivists) would stick to the original meaning. The outcome might depend on the panel's composition. Alternatively, the panel might try to avoid the conflict by finding that the old section 2799A-1 is still in effect for our statute under a savings clause (if one exists) or by applying the doctrine of treating the reference as static because of the absurdity of applying a repealed statute. However, we have ruled out absurdity. Without an easy out, the split would be real.

  - **Value for the piece**: This hypothetical isolates a core difference between textualism and purposivism: how to handle changes in the legal landscape that occur without updating the statute. Textualism, by focusing on the current legal context and the words as they operate in the present, is more dynamic. Purposivism, by focusing on the original purpose, is more static. This case does not rely on a drafting error (the cross-reference was correct at the time) or an absurd result (both readings are plausible). It also avoids the pitfalls of vagueness and anachronistic meanings. Therefore, it makes the point better than the chestnuts because it shows that the methods can lead to different outcomes even when both are applied faithfully and without any obvious mistake.

  **Conclusion**: This case should serve the journalist's purpose by providing a clean, hypothetical example that demonstrates the divergence between textualism and purposivism in a modern regulatory context without relying on the usual escape hatches.
