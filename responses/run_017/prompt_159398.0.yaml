  The user's problem might be that the ex-ante worst-case policy is history-dependent in a way that is not time-consistent. 

  In the literature, it is known that for non-rectangular uncertainty sets (like a shared parameter), the optimal policy for the ex-ante worst case may not be time-consistent. That is, the policy that is optimal at time 0 may specify an action at time 1 that, when time 1 arrives, the agent (re-optimizing from time 1) would not choose. 

  This is not an artifact of incorrect update, but a genuine property of worst-case reasoning over shared parameters (option ii). 

  To fix it, there are two main approaches:

  1. **State augmentation**: Include the adversary's choice (p) in the state. Then the state becomes (s, p). But then we know p and the problem becomes a known MDP. The optimal policy is then a function of s and p. But we don't know p. So we need to consider a belief over p. This leads to a POMDP. 

  2. **Dynamic programming with rectangularization**: Relax the non-rectangular set to a rectangular one. For example, at each step, allow the adversary to choose p independently from the set, but that breaks the shared parameter. 

  3. **Commit to a policy at the beginning and stick to it**: This is the ex-ante optimal policy. But then the agent does not re-plan. 

  4. **Use a different optimality criterion**: Such as the minimax regret, or use a Bayesian approach with a prior and then do not do worst-case.

  The user is doing re-planning, which is essentially re-optimizing the remaining policy from the current state. This is time-inconsistent. 

  The correct update rule for the uncertainty set in the worst-case setting without a prior is to restrict to the set of p that are consistent with the history. But that doesn't change the set in the Ellsberg urn (unless the history rules out some p). 

  In the user's experiment, the reversal might be happening because the ex-ante policy was computed under the worst-case p for the whole episode, but when re-planning, the worst-case p for the remainder might be different. 

  Example: 
    - Suppose the adversary chose p0 at the beginning to minimize the total return. 
    - Then, after some history, the re-planning uses min_p (over the set) of the return for the remainder. 
    - But note: the p0 is fixed. So the return for the remainder is determined by p0. 
    - However, the agent doesn't know p0. So in re-planning, the agent must consider all p in the set (that are consistent) and then take the worst-case over p for the remainder. 
    - Since the set of p is the same as at the beginning (if no information), then the worst-case p for the remainder might be different from p0. 

  For example, in the first period, the worst-case p might be p=0, but in the second period, the worst-case p for the second period alone might be p=2/3. 

  This is the time-inconsistency.

  Therefore, the answer is (ii): a genuine property of worst-case reasoning over shared parameters.

  Fix: If the user wants time-consistent re-planning, then one must use a rectangularized uncertainty set (even if it's less conservative) or switch to a Bayesian approach (with a prior and then use the posterior, and then take the worst-case over the posterior? but that would be a robust Bayesian approach and may also be time-inconsistent). 

