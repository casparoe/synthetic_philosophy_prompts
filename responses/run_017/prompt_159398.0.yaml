  ### **2. The Case You Care About: Non-Rectangular Uncertainty & Reversal**

  **Diagnosis**: The reversal is **(ii) a genuine property of worst-case reasoning over shared parameters**, not a bug.  

  **Why**:  
  - With a shared urn parameter (non-rectangular set), the adversary commits to one kernel (fixed p) for the entire episode.  
  - The ex-ante optimal policy maximizes the worst-case return over p.  
  - Mid-episode, after partial observation (e.g., some balls drawn), you update the uncertainty set (e.g., restrict p to posterior-consistent values).  
  - Re-planning now minimizes the worst case *from the current state*, which prioritizes different p values than the ex-ante policy.  
  - **Result**: The ex-ante policy is time-inconsistent. Re-planning recalculates the worst case for the subproblem, reversing actions if new p optima emerge.  

  **Fix via State Augmentation**:  
  - Augment the state with the current belief over p (e.g., Beta posterior if p was uniform prior).  
  - Solve the robust Bellman equation over this augmented state space:  
    ```plaintext
    V(belief) = max_a min_{p} [ R(belief, a, p) + γ E[V(belief’)|belief, a, p] ]
    ```  
  - This makes uncertainty rectangular *in belief space*, restoring time-consistency. Re-planning uses the belief update (Bayesian), not ad-hoc set updates.  

  **Why not (i) or (iii)**:  
  - (i) Incorrect update? No—Bayesian updates are correct, but the issue is structural.  
  - (iii) No ambiguity aversion? No—the asymmetry emerges, proving your controller *can* capture it, but needs belief augmentation.  

