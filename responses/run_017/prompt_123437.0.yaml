prompt: |-
  hey — you're a professional philosopher who also knows your algorithmic information theory properly (Solomonoff induction, Levin's variants, the convergence theorem, and why the choice of universal machine is supposed to matter only up to a constant). Take this seriously and think it through carefully; before you start writing, brainstorm for a bit about what the *real* question here is, and flag anywhere you think I'm just confused.

  I'm applying for a nine-month fellowship and need a two-page proposal. My half-formed idea is this.

  Everyone argues about whether the Solomonoff prior is malign: the story being that once you condition on your evidence, most of the measure lands on hypotheses where you're a computation inside a simulation being run by agents who want to influence whatever the predictor ends up doing, so a Solomonoff inductor would spend its time serving the simulators' goals rather than predicting. I think that framing conflates at least two things, and I suspect one of the two has a much more boring answer than people assume.

  Distinction one: whether the *prior* is malign versus whether the whole setup is malign only once you bolt on a decision rule and a downstream use for the predictions. If the predictor never acts on its outputs, does the manipulation incentive even get off the ground, or does it come back in through some anthropic/self-referential side door?

  The bit I think is actually new: the standard argument hands the simulators a lot of knowledge for free — that there is a predictor, roughly what sort of thing it will do with its predictions, and which computations to target. But in the setup itself those simulators are just programs inside the prior. They have to *locate* the predictor, and specifying the predictor together with its whole downstream causal environment costs bits, which is a complexity penalty that eats into exactly the measure advantage that was supposed to make them dominant. So there might be a quantitative version of the "the simulators can't find you / can't afford to find you" reply, and whether it lands should depend on things like whether the predictor's outputs feed back into the world, i.e. whether this is prediction or control.

  What I want in the proposal:

  - The question stated precisely enough that it has a determinate answer, split into the sub-questions I'm gesturing at. Be explicit about what has to be assumed about the simulators: their decision theory, whether they need to acausally coordinate with each other, whether the argument requires them to run logical counterfactuals on the predictor's source code, whether they need to know the predictor's reference machine.
  - Why the existing positions don't settle it. I'd rather you reconstruct the strongest version of the malignity argument and point at the exact hinge where it needs an assumption than survey the debate.
  - The method: what I'd actually do, month by month, over nine months, and why that approach rather than the obvious alternatives. In particular: why not just prove a convergence theorem (I suspect the asymptotic framing is the wrong level, since the worry lives in the finite-data regime where the machine choice matters a lot), and why not just do it empirically.
  - What a positive result would look like — a theorem? a toy model with a phase transition in some parameter like "cost of specifying the target"? a taxonomy of when the incentive to manipulate exists at all? — and, honestly, what would count as the project failing or as the question turning out to be unanswerable.
  - Realistic scope. Be blunt if this is three months of work or three years, and tell me which piece to cut if it's too big.

  Don't bother with citations or a bibliography, I'll fill those in myself. And please don't give me the greatest hits of the online discussion — if something is standard in that literature, use it in half a clause and move on. Also: I'd rather have a proposal that could definately fail than one that's safely unfalsifiable, so make sure the failure conditions are real ones.
