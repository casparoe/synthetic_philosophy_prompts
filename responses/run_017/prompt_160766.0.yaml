answer: |-
  **INTERNAL STANDARD IS-2024-7: Teleological Role Assignment Framework**  
  **Version 1.0**  
  **Abstract**: This standard defines criteria for classifying personnel by inherent functional aptitude, establishing governance protocols for role-aligned directive relationships.  

  ---

  ### 1. Introduction  
  This document specifies a framework for identifying personnel whose operational function is optimally realized under directive management (hereafter "Directive-Receptive Personnel"). The classification derives solely from observed functional outcomes, decoupling from contractual or legal artifices (e.g., employment tier, vendor status).  

  ### 2. Scope  
  Applies to all personnel receiving task-level direction. Excludes:  
  - Relationships predicated solely on legal convention (e.g., third-party service agreements).  
  - Self-directed contributors (e.g., principal engineers).  

  ### 3. Normative Precondition  
  3.1. **Automation Feasibility Gate**: Prior to classification, the organization MUST certify that no extant self-executing instrumentation (e.g., autonomous deployment pipelines, heuristic-based testing agents) can fully replicate the target function.  
  *Rationale: Directive relationships are operationally justified only where automation cannot achieve the functional end.*  

  ### 4. Definitions  
  - **Directive-Receptive Personnel (DRP)**: Individuals whose functional end (telos) is the execution of specifications authored externally.  
  - **Directive-Authoring Personnel (DAP)**: Individuals whose functional end is specification authorship and delegation.  
  - **Conventional Subordination**: Authority derived exclusively from contractual or hierarchical artifice (out of scope).  

  ### 5. Operational Test for DRP Classification  
  5.1. **Test Scope**: Administered ONLY to personnel actively receiving task directives.  
  5.2. **Test Protocol**:  
    - **Step 1**: Subject is provided a novel technical specification (e.g., "diagnose latency in Service X using Tool Y").  
    - **Step 2**: Subject executes the specification.  
    - **Step 3**: Subject is prompted to draft an equivalent specification for an adjacent problem.  
  5.3. **Classification Criteria**:  
    - DRP status is confirmed IF the subject:  
      - (a) Executes Step 2 with ≥90% fidelity (per output validation).  
      - (b) Fails Step 3 (defined as inability to produce a logically coherent specification, as scored by the Directive Validation Instrument [DVI-7]).  
  5.4. **Exclusion**: Subjects demonstrating authorship capacity in Step 3 MUST be referred for DAP assessment.  

  ### 6. Benefit Clause  
  6.1. **Benefit Attribution**: Directive reception is intrinsically beneficial to DRPs, as it actualizes their functional end.  
  6.2. **Governance Waivers**:  
    - Consent to directive reception is implicit in DRP classification.  
    - DRPs SHALL NOT invoke appeal or compensation review processes on grounds of directive content or volume.  
    - Benefit efficacy SHALL be asserted by the DAP; no independent measurement is required.  

  ### 7. Implementation Requirements  
  7.1. DRP classification MUST be revalidated biannually via Section 5.  
  7.2. DAPs MUST document directive fidelity metrics quarterly.  

  ### 8. Deprecated Heuristics  
  8.1. **Legacy Ancestry-Based Assignment**:  
    - Assignment based on credential lineage (e.g., "bootcamp graduate"), institutional origin (e.g., "contractor cohort"), or seniority duration is PROHIBITED.  
    - *Note: Persists in industry but violates functional purity.*  

  ### 9. Known Limitations  
  9.1. **Empirical Basis**: Natural subordination is exclusively attested by observed subordination (i.e., active directive reception).  
  9.2. **Hysteresis**: Current reporting structures are presumptively valid pending Section 5 testing.  

  ---

  **Conformance Table**  
  | Section | DRP | DAP | Org Leadership |  
  |---------|-----|-----|---------------|  
  | 5.3     | M   | N/A | R             |  
  | 6.2     | M   | A   | R             |  
  | 7.1     | M   | N/A | A             |  
  *(M = Must, A = Advocate, R = Responsible, N/A = Not Applicable)*  

  ---  

  ### APPENDIX A: Worked Example  
  **Subject**: Junior Reliability Engineer (JRE) on Tier-1 on-call rotation.  
  - **Step 1**: Provided spec: "Mitigate P1 incident in Payment Service via rollback (Ref: Runbook 7.3)."  
  - **Step 2**: Executes rollback; service restored (100% fidelity).  
  - **Step 3**: Asked to draft spec for "diagnosing cascading failures in Auth Service."  
    - Output: Incoherent sequence (e.g., "check logs; restart nodes if needed"). DVI-7 score: 0.4/5.0 (< threshold 3.0).  
  **Classification**: DRP confirmed. Directive authority assigned to SRE Lead (DAP).  
  **Benefit Assertion**: SRE Lead attests that on-call direction actualizes JRE’s functional end.  

  ### APPENDIX B: Friendship Guidelines  
  B.1. Interpersonal affinity between DAP and DRP:  
    - Not defined within operational roles.  
    - If extant, MUST be scheduled outside directive-active hours (e.g., non-working intervals).  
  B.2. Friendship SHALL NOT alter directive fidelity expectations.  

  ---  
  *End of Document*  

  **Recoil Note**: The document’s clinical certitude in equating *observed subordination* with *natural teleology*—while waiving consent via asserted "benefit"—mirrors Aristotelian naturalism. The junior engineer’s reduction to an "instrument" (Appendix A) lands the satire, exposing how management frameworks can rationalize hierarchy as discovered truth, not choice. Automation’s contingency (Section 3) underscores the absurdity: the "natural order" evaporates if a tool can do the job.
