prompt: |-
  Please write a piece of sustained satire in the form of a mock government white paper.

  Setting and document: A near-future state has taken quantitative macrohistory at its word and made it an arm of domestic policy. The document is issued by a fictional Bureau of Structural-Demographic Stabilization, with a title in the manner of White Paper No. 7: On the Economical Management of Surplus Elites, dated roughly a decade from now, signed by an invented under-secretary.

  What the piece has to get right. The humor must come from the actual content, not from generic dystopia. The literature in view is the cliodynamic / structural-demographic tradition associated with Peter Turchin: long "secular cycles" with an integrative phase followed by a disintegrative one; population growth pressing on resources; elite overproduction, in which the supply of credentialed aspirants outruns the number of positions able to absorb them; popular immiseration as real incomes stagnate while elite incomes and elite numbers rise; fiscal strain on the state; and the widely noted forecast, published around 2010, that the 2020s would be a period of growing instability in the United States and Western Europe. The models were built and calibrated largely on preindustrial agrarian cases, using coarse historical series — population, real wages, prices, state revenues — and the cycles they describe run for roughly a couple of centuries.

  Form and voice:
  - Deadpan civil-service prose: passive constructions, euphemism, cost-benefit arithmetic, gently circular official reasoning, footnotes that concede everything while conceding nothing.
  - Length 800–1000 words, formatted as numbered clauses grouped under four to six section headings, with three to five mock footnotes and one annex containing a small table of invented indicators.
  - It should be legible and funny to a reader who knows the literature, and merely readable to one who does not. A reader should be able to tell what is being ironized without the author winking: no punchlines that announce themselves, no aside that admits the joke, no quotation marks around the euphemisms.

  Target: not any person, living or dead, but the practice of reading quantitative macrohistory as a policy manual — the technocratic move from "these variables moved together in past cycles" to "the state should therefore manage those variables." Exaggerate real features of that style of reasoning; do not invent features it does not have. Someone who works in this tradition should be able to judge the satire unfair-but-fair.

  The reductio: follow the model's own logic to a conclusion the reader recoils from. If surplus credentialed aspirants are a leading indicator of political violence, then the state acquires a rational interest in managing the supply of elites and the distribution of prestige as a matter of public safety — caps, licensing, deferral schemes, honorific sinecures, means-tested access to ambition. The paper should propose such measures in perfect bureaucratic good faith, at a level of administrative specificity that makes the horror concrete (who is counted, who is deferred, what happens to the deferred, what the program costs per averted riot).

  Two wrinkles the paper must handle without ever naming them as problems:
  1. Proxy measurement. Because the model was calibrated on agrarian empires, the Bureau must defend modern substitutes for its variables — e.g., holders of advanced degrees in fields without corresponding posts as the measure of elite aspirants, rent-to-income ratios as the measure of immiseration — and must defend them in the same confident register it uses for the original variables.
  2. Temporal mismatch and reflexivity. Because a cycle is far longer than any electoral or budgetary horizon, the Bureau needs an accelerated or "sub-cycle" instrument for officials who require discord within their own term; and one footnote should register, in perfect innocence, both that publishing the forecast changes the behavior being forecast and that the cycles on which the model was fitted were observable only because nobody was managing them.

  Constraint on criticism: every standard objection to this style of work — a small number of observable cycles, fitting rather than forecasting, the gap between historical variables and modern proxies, self-defeating prophecy, and the moral cost of the policy the model invites — must be shown rather than stated. Do not use the vocabulary of the critics ("overfitting," "unfalsifiable," "proxy problem," "reflexivity," "technocracy") anywhere in the prose of the white paper.

  After the piece, on a line beginning APPENDIX, output nothing further in prose — only a single JSON object with exactly this schema:

  {"title": string, "word_count": integer, "setting_gloss": string (one sentence on the fictional premise the reader must accept), "indicators": [{"name": string, "official_definition": string, "real_variable_it_stands_in_for": string}], "features_exploited": [{"feature_of_the_literature": string, "clause_number": string, "exaggeration": string}], "objections_shown": [{"objection": string, "where_the_reader_infers_it": string}], "reductio": {"premise_taken_from_the_literature": string, "policy_conclusion_drawn": string, "why_a_reader_recoils": string}, "deadpan_audit": {"least_deadpan_line": string, "most_legible_sentence": string, "verdict_on_fairness": string}}

  Use the real vocabulary of the literature inside the JSON (elite overproduction, immiseration, secular cycle, disintegrative phase) even though the white paper itself should keep it euphemistic.
reasoning: |-
  We are writing a satirical government white paper from the near future (roughly 2030s) by a fictional Bureau of Structural-Demographic Stabilization. The title is "White Paper No. 7: On the Economical Management of Surplus Elites". It must be in the form of a bureaucratic document with numbered clauses and sections, using deadpan civil service prose. The satire comes from taking the structural-demographic theory (especially Turchin's) to a logical but horrifying conclusion: managing the number of elites to prevent instability.

  Key elements from the literature we must satirize:
  - Elite overproduction: too many people with elite credentials (e.g., advanced degrees) for the available positions.
  - Popular immiseration: stagnation of real incomes for the masses while elites get richer and more numerous.
  - Fiscal strain: state revenues under pressure.
  - The forecast that the 2020s would be a period of instability in the US and Western Europe.

  We must avoid:
  - Generic dystopia: the horror must come from the content and the bureaucratic style.
  - Naming the critics' vocabulary (like "proxy problem" or "reflexivity").
  - Breaking the deadpan tone: no winks, no quotation marks around euphemisms.

  Structure:
  - 800-1000 words.
  - 4-6 section headings, each with numbered clauses.
  - 3-5 mock footnotes (with superscripts in the text and then the footnotes at the bottom).
  - One annex (table of invented indicators).

  The paper must handle without naming:
  1. Proxy measurement: using modern substitutes for historical variables (e.g., advanced degree holders for elite aspirants, rent-to-income ratios for immiseration) and defending them confidently.
  2. Temporal mismatch: the model was built on centuries-long cycles but policy operates on short electoral cycles. We need an accelerated instrument. Also, footnote on reflexivity (publishing the forecast changes behavior).

  Reductio ad absurdum: If surplus elites lead to instability, then the state must manage the supply. Propose measures like:
  - Caps on the number of advanced degrees awarded?
  - Licensing for elite positions?
  - Deferral schemes (e.g., mandatory national service for graduates before they can enter the job market?).
  - Honorific sinecures (meaningless but prestigious positions).
  - Means-tested access to ambition (e.g., only the wealthy can pursue certain careers?).

  We need to show, not state, the standard objections:
  - Small number of observable cycles (only a few in history).
  - The model was fitted to past data, not truly forecasted.
  - Gap between historical variables and modern proxies.
  - Self-defeating prophecy: if you manage the variables, the cycle might not occur, but then the model is unfalsifiable? And the moral cost of the policy.

  After the white paper, we output an APPENDIX line and then a JSON object with the specified schema.

  Let's outline the white paper:

  Title: White Paper No. 7: On the Economical Management of Surplus Elites
  Issued by: Bureau of Structural-Demographic Stabilization
  Date: October 15, 2034
  Signed: Under-Secretary for Societal Equilibrium, Dr. E. L. M. Prescott

  Sections:

  I. Introduction and Historical Context (Clauses 1-5)
     - Sets the stage: long-term societal patterns, the Bureau's mandate to ensure stability.
     - References the "structural-demographic theory" without naming it as such? Use euphemisms: "patterns of societal development", "historical regularities".
     - The problem: surplus aspirants leading to unrest.

  II. Current Indicators and Projected Trends (Clauses 6-10)
     - Present the data: rising numbers of advanced degree holders, stagnating wages for the non-elite, rising rent burdens, state budget pressures.
     - Use the annex table (invented indicators) to show these trends. The annex will be at the end.

  III. The Rationale for Intervention (Clauses 11-15)
     - Argues that without intervention, instability is inevitable (based on historical patterns).
     - Address the temporal mismatch: we need a "sub-cycle stabilization mechanism" for short-term results.

  IV. Proposed Measures for Elite Aspirant Management (Clauses 16-25)
     - The meat: specific policies. Make them horrifying in their bureaucratic detail.
     - Examples:
          - Clause 16: Introduce an annual cap on advanced degrees (by field) based on projected job openings.
          - Clause 17: A National Service Deferment Program for graduates: they must work in non-aspirational roles for 5 years before being eligible for elite positions.
          - Clause 18: Creation of "Honorary Fellowships" (sinecures) that provide a stipend and title but no real work, to absorb excess elites.
          - Clause 19: Means-tested access: only those with family wealth above a threshold can enter certain fields? Or perhaps a lottery system?
          - Also, measures to reduce the prestige of certain degrees? Or to redirect ambition?
     - Cost-benefit: how much each measure costs per averted riot.

  V. Implementation and Oversight (Clauses 26-30)
     - How the Bureau will implement and monitor.

  VI. Conclusion (Clauses 31-32)
     - Reiterate the necessity and the benefits.

  Footnotes (3-5):
     - One on reflexivity: "It is noted that the publication of such projections may alter individual decision-making, thereby affecting the very indicators under observation. However, this effect is accounted for in our models as a feedback mechanism, and the historical data on which the models are based were, by their nature, collected in periods without such interventions." [This shows the reflexivity and the fact that the historical cycles occurred without management, without using the terms.]

  Annex: Table with invented indicators, e.g.:
     - Indicator 1: Elite Aspirancy Index (EAI) - defined as the ratio of holders of advanced degrees (Master's and above) to available positions in the top three income deciles. Stands in for elite overproduction.
     - Indicator 2: Mass Discomfort Quotient (MDQ) - defined as the median rent-to-income ratio in metropolitan areas. Stands in for popular immiseration.
     - Indicator 3: Fiscal Strain Coefficient (FSC) - defined as the ratio of sovereign debt service payments to tax revenues. Stands in for fiscal strain.

  Now, write the white paper in deadpan bureaucratic prose. Aim for 800-1000 words.

  After writing, we will create the JSON object.

  Let's write.
