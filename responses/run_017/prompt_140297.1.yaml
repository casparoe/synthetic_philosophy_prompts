        So Option B is better (lower harm).

     We have a flip: Group X prefers A, Group Y prefers B.

  4. (10 min) Each group calculates the total harm for Option A and Option B using their assigned utilities. They might average or sum the utilities? Since the scales might be different, we should sum the harm scores.

     But note: in Group Y, the utilities are on a different scale. The numbers are about their whole life, so the harm of H2 is only 5 out of 10, meaning it's not as bad relatively. But the absolute numbers are larger for status quo.

     However, the activity is about summing the utilities as given by their method.

  5. (15 min) Each group reports their total harm for A and B and which option is better. They will find they have opposite recommendations. Then let them argue for 5-10 minutes about which method is correct.

  6. (25 min) Debrief: 
     - What happened? Why did the two groups get different answers?
     - Introduce the concept of utility functions and how they are unique only up to positive affine transformations.
     - Explain that to sum across people, we must choose a zero and a unit for each person's utility scale.
     - In Group X, they chose a local zero and unit, based only on the class outcomes.
     - In Group Y, they chose a global zero and unit, based on their whole life.
     - Both are valid, but they lead to different conclusions when summing.
     - Discuss the implications for the dust speck problem.
     - Address common objections: 
          - "Why not use money?" -> Money is not a consistent measure of utility because of diminishing marginal utility and wealth effects.
          - "But we can't compare across people" -> Exactly, that's the point. The activity shows that our aggregation requires arbitrary choices.

  Potential pitfalls:
  - Econ students might say "just use money". We can discuss in debrief why money is problematic.
  - Someone might refuse to play: have a backup plan, like let them be an observer or assign them to a group and they can voice their concerns during the group discussion.
  - The harms might not be perceived as intended: do a dry run with a colleague to calibrate the harms.
  - The assignment in Group Y might be all over the place. We can ask them to write down their numbers and then we (the instructors) will collect and average. Or, to save time, have them discuss in their group and come up with group-assigned numbers for the outcomes.

  Logistics:
  - We need to define H1 and H2. Let's do:
     H1: hold a pen at arm's length for 30 seconds.
     H2: hold a heavy textbook (5 lbs) at arm's length for 10 minutes. (Test to ensure it's moderate but not too bad.)
  - We have coffee vouchers as incentives. Perhaps give a voucher to every student for participating, and maybe an extra one to the volunteer if we do Option A.

  Time breakdown:
  - 5 min: intro and explanation of options.
  - 10 min: Group X calibration.
  - 10 min: Group Y calibration.
  - 10 min: Group X and Group Y calculate totals.
  - 10 min: Groups report and argue.
  - 25 min: Debrief and discussion.
  - 5 min buffer.

  During calibration, the students might need guidance. We can provide a form:

  Group X form:
  - Best outcome (nothing): 0
  - Worst outcome (textbook): 10
  - Pen-holding: ? 

  Group Y form:
  - Best life outcome: 0
  - Worst life outcome: 10
  - Status quo (nothing in class): ?
  - Pen-holding: ?
  - Textbook-holding: ?

  Then for each option, sum the utilities for all students.

  But note: in Option A, the torture victim experiences textbook, and the others experience nothing. In Option B, everyone experiences pen-holding.

  In Group X, for Option A: the victim has 10, others have 0.
  In Group X, for Option B: everyone has their pen-holding score (say 1).

  In Group Y, for Option A: victim has their textbook score (say 5), others have their status quo score (say 2).
  In Group Y, for Option B: everyone has their pen-holding score (say 2.1).

  Then total for Option A in Group X: 10
  Total for Option B in Group X: 14 * 1 = 14 -> so A is better.

  Total for Option A in Group Y: 5 + 13*2 = 31
  Total for Option B in Group Y: 14*2.1 = 29.4 -> so B is better.

  This should work.

  In the debrief, we can explain that the constant shift (the status quo in Group Y is not 0) makes the many small harms add up to a lot in Group X but not in Group Y.

  What the activity can't reproduce: 
  - The activity uses a small n (14), so the flip might not be as dramatic as with astronomical numbers. We can discuss in debrief how with very large n, the flip is more pronounced.
  - The global scale might be hard for students to assign. We can in the debrief acknowledge that it's subjective and varies across people, but the point is that the local scale is also arbitrary.

  I think this should work.
answer: |-
  Below is a complete design for your 75-minute class session. The activity is structured to create an experiential "gut" understanding of how normalization choices in utility aggregation can flip verdicts between one moderate harm and many trivial harms, without mentioning technical terms until the debrief. The design uses real stakes (minor physical inconveniences) and forces a flip between two groups using defensible but incompatible normalization rules.

  ---

  ### **Activity: "The Harm Aggregation Game"**
  **Goal:** Students experience how the choice of zero point and unit in personal utility scales can reverse judgments about whether many trivial harms outweigh one moderate harm.

  **Materials:**
  - Heavy textbook (e.g., 5 lbs) and lightweight pen (or similar item) for each student.
  - Buzzer or timer app for 30-second intervals.
  - Sour candies (one per student) or an alternative trivial annoyance (e.g., a short, unpleasant sound clip).
  - Coffee vouchers ($40 total, 2–3 per student).
  - Two sets of instruction handouts (one for Group X, one for Group Y).
  - Whiteboard or projector to record group totals.

  **Stakes:**
  - **Option A:** One volunteer suffers a **moderate harm** (holding a textbook at arm’s length for 10 minutes). All others experience no harm.
  - **Option B:** *All* students suffer a **trivial harm** (holding a pen at arm’s length for 30 seconds **or** eating a sour candy quickly).  
    *(Note: Test harms beforehand for triviality. Holding the textbook is uncomfortable but safe; pens/sour candies are fleeting annoyances. Offer an opt-out for disabilities, e.g., "close your eyes and count to 30" instead of holding a pen.)*

  **Incentives:** Every student gets a coffee voucher for participating. The "winning" option (as per the group’s calculation) is implemented. This makes choices feel real but keeps stakes low.

  ---

  ### **Session Flow (Total: 75 min)**
  #### **Step 1: Setup and Rules (5 min)**
  - **Do:** Split the class into Group X (economics-leaning) and Group Y (philosophy-leaning). Randomize if needed to balance perspectives.  
  - **Say:** *"Today, we’re deciding as a group whether to impose one moderate inconvenience on one person, or a tiny inconvenience on everyone. Your group will calculate which option causes less total harm using a simple rating system. Whichever option your group deems ‘less harmful’ will actually happen. Everyone gets a coffee voucher just for playing."*  
  - **Rules:**  
    - No talking with the other group.  
    - Use only your group’s instructions.  
    - Rate harms honestly based on your own feelings.

  #### **Step 2: Group Work (25 min)**
  - **Hand out instructions** (see below).  
  - **Groups calibrate and calculate:**  
    - **Group X (Local Scale):**  
      *Instructions:*  
      *"Consider only the outcomes in today’s activity:*  
      - *Best outcome: No task (0 points).*  
      - *Worst outcome: Hold textbook for 10 minutes (10 points).*  
      - *Assign points to the trivial harm (holding a pen for 30 seconds or eating a sour candy). How bad is it relative to 0 and 10?*  
      *Calculate total harm for:*  
      - *Option A: Textbook harm for one person + no harm for others.*  
      - *Option B: Trivial harm for all students.*  
      *Sum points for all students."*  

      *Predictable Behavior:*  
      Econ students will treat this as a bounded scale. Most assign pen-holding/candy a low score (e.g., 0.5–2 points). Total harm for B (e.g., 14 students × 1 point = 14) exceeds A (e.g., 10 + 0 = 10). **Verdict: A is better (less total harm).**  

    - **Group Y (Global Scale):**  
      *Instructions:*  
      *"Consider outcomes across your whole life:*  
      - *Best outcome: Your happiest life moment (0 points).*  
      - *Worst outcome: Your most painful life experience (10 points).*  
      - *Assign points to: (a) No task today, (b) Textbook harm, (c) Trivial harm. How bad are they relative to 0 and 10?*  
      *Calculate total harm for Options A and B as above."*  

      *Predictable Behavior:*  
      Philosophy students will contextualize harms. "No task" might be 9.5/10 (since class is mundane). Textbook harm might be 9.0 (mildly annoying). Trivial harm might be 9.9 (barely noticeable). Total harm for A (e.g., 9.0 + 13×9.5 = 132.5) exceeds B (e.g., 14×9.9 = 138.6). **Verdict: B is better (less total harm).**  

  - **Facilitator Tips:**  
    - Float to clarify instructions. If Group Y resists, say: *"If your best moment is 0 and worst is 10, where does sitting in class fall?"*  
    - If econ students say, *"Just use money!"*, reply: *"Stick to your instructions—we’re measuring harm, not money."* (Debrief this later).  
    - If someone rates incoherently (e.g., candy worse than textbook), gently note: *"Check if your ratings match your feelings."*

  #### **Step 3: Group Reports and Argument (15 min)**
  - **Do:** Groups share totals and verdicts.  
    - *Group X likely says:* "A is better. Total harm: A=10, B=14."  
    - *Group Y likely says:* "B is better. Total harm: A=132.5, B=138.6."  
  - **Say:** *"Group X prefers Option A (one textbook). Group Y prefers Option B (everyone does the trivial task). You must convince the other group to adopt your verdict. You have 10 minutes to argue."*  
  - **Predictable Arguments:**  
    - Group X: *"Your numbers are inflated! A textbook isn’t 9.0—it should be 10!"*  
    - Group Y: *"Your scale ignores that life has worse things! A textbook is trivial globally."*  
    - Econ student: *"This is arbitrary—just use money and aggregate!"*  
    - Philosophy student: *"You can’t compare inner experiences!"*  
  - **Facilitator:** Note key points but don’t resolve yet. Let frustration build.

  #### **Step 4: Reveal and Implement the Flip (5 min)**
  - **Do:** Announce the losing option for each group (A for Group Y, B for Group X).  
  - **Implement harms:**  
    - Group X’s preference (Option A): One volunteer holds the textbook.  
    - Group Y’s preference (Option B): All do the trivial harm.  
  - **Say:** *"You’ve lived the consequence of your calculation. Now, why did we get opposite answers?"*

  #### **Step 5: Debrief (25 min)**
  1. **Recreate the Flip (5 min):**  
     - *Ask:* "What differed between Group X and Y’s instructions?"  
     - *Guide them to see:*  
       - Group X normalized harm to the **local context** (0 = no task, 10 = textbook).  
       - Group Y normalized to **life context** (0 = best life moment, 10 = worst life moment).  
     - *Map to concepts:*  
       - "Each of you assigned a **zero point** (best outcome) and **unit** (worst outcome = 10)."  
       - "When Group Y set ‘sitting in class’ at 9.5, it shifted the zero point. This made textbook harm (9.0) seem small, so summing many trivial harms (9.9) didn’t add up fast."  

  2. **Connect to Dust Specks (5 min):**  
     - *Say:* "This is the dust-speck problem. If I normalize harm to ‘local’ outcomes (torture = 10, dust speck = 0.01), trillions of specks outweigh torture. But if I normalize to ‘life’ (torture = 1.0, dust speck = 0.000001), torture is worse. The verdict flips based on my normalization choice."  

  3. **Maya’s Argument and Costs (5 min):**  
     - *Introduce:* "Your friend Maya would say: ‘Normalize to the local outcomes—it’s decision-theoretically clean.’"  
     - *Costs:*  
       - **Local normalization (Maya’s choice):** Prevents arbitrary scaling but makes verdicts sensitive to menu options (e.g., adding a worse harm makes textbook harm seem smaller, flipping the sum).  
       - **Global normalization:** Reflects life context but is subjective (e.g., is "worst life experience" comparable?) and vulnerable to framing (e.g., if I define "best life" narrowly).  

  4. **Objections and Deep Points (10 min):**  
     - *Address predictions:*  
       - *"Why not use money?"* Money assumes linear utility and equal wealth. If a rich student pays $100 to avoid the textbook and a poor student pays $1, is the rich student’s harm 100x worse?  
       - *"This just shows we can’t read minds."* Not quite—the issue isn’t ignorance but *arbitrariness*. Even with perfect knowledge, you must choose a normalization, and it changes outcomes.  
     - *Unreproducible element:* **Astronomical numbers.** The activity can’t simulate trillions of dust specks, so say: *"With huge numbers, tiny differences in scaling flip verdicts. That’s why this matters for policies affecting millions."*  
     - *Close:* "No evidence can ‘settle’ the choice between normalizations—it’s a value judgment about what counts as the ‘right’ scale. That’s the measurement choice nobody voted on."

  ---

  ### **Predictable Problems and Mitigations**
  1. **Econ students shortcutting:**  
     - *Risk:* "Let’s use willingness-to-pay or money!"  
     - *Mitigation:* Redirect firmly: *"Use your instructions. We’re not using money today."* Debrief why money fails (marginal utility, wealth inequality).  

  2. **Refusal to play:**  
     - *Risk:* Student rejects trivial harms as "meaningless" or refuses to assign global ratings.  
     - *Mitigation:* Offer opt-outs (e.g., observe and critique). Pre-frame: *"The harms are small, but your choices have real consequences."*  

  3. **Misinterpreting the lesson:**  
     - *Risk:* "This just proves utilitarianism is flawed!" or "We need better data!"  
     - *Mitigation:* In debrief, stress: *"The takeaway isn’t that aggregation is impossible—it’s that the rules for scaling harm are unavoidably subjective and flip outcomes."*  

  4. **Group Y’s subjectivity:**  
     - *Risk:* Ratings vary wildly (e.g., one student rates textbook harm at 0.1, another at 9.9).  
     - *Mitigation:* Tell Group Y: *"Use your gut feeling—there’s no right answer."* Variability reinforces that global scales are arbitrary.  

  5. **Time crunch:**  
     - *Risk:* Groups run over time.  
     - *Mitigation:* Use a timer. Cut calibration at 8 min if needed. Prioritize the argument and debrief.  

  ---

  ### **Why This Works**
  - **Constraint-compliant:** No technical terms pre-flip; real stakes via vouchers/harms; flip is engineered via normalization rules.  
  - **Experiential:** Students feel the arbitrariness when their verdicts flip and harms are implemented.  
  - **Pedagogical:** The debrief connects their frustration to utility theory, interpersonal comparison, and policy ethics.  
  - **Balanced:** Econ students engage with quantification; philosophy students engage with subjectivity.  

  The activity won’t resolve the dust-speck debate, but it will make students *feel* why Maya’s "local normalization" isn’t a neutral default—and why bureaucrats (or philosophers) can flip verdicts by redrawing the scales.
