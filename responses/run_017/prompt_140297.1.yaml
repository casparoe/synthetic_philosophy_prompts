  We are designing a single 75-minute class session for an upper-level undergraduate seminar. The goal is for students to experience, through an activity, the problem of aggregating tiny harms versus a catastrophic harm and how the choice of scaling (zero point and unit) can flip the verdict. The students are a mix of economics and philosophy majors.

  Constraints:
  1. No lecture up front and no naming of the doctrine (like "interpersonal comparison") until the debrief.
  2. Real choices with real (small) stakes. We have $40 in coffee vouchers and can use trivial annoyances (holding a textbook, buzzer, sour sweet).
  3. The activity should lead to a flip: two halves of the room using different schemes come to opposite verdicts.
  4. Debrief that maps the activity to the concepts.

  The core problem: When we add up many tiny harms (like dust specks) and compare to one catastrophic harm (like torture), the verdict depends on how we set the zero and unit of measurement for each person's utility. If we normalize each person's utility to 0 for the worst outcome in the scenario and 1 for the best, we might get one result. But if we use a different normalization (e.g., including outcomes outside the scenario), the result can flip.

  Activity Design:

  Idea: We create a scenario where the class must choose between two options:
  - Option A: One person (or a few) experiences a moderate harm (e.g., holding a heavy textbook for 10 minutes).
  - Option B: Everyone in the class (or a large group) experiences a very trivial harm (e.g., holding a pen at arm's length for 30 seconds).

  But we need to create a flip. How? By having two different ways to assign the "zero" and "unit" of harm.

  Plan:

  We will run two rounds. In each round, the students will be asked to make individual choices that reveal their preferences. Then, we will aggregate these preferences in two different ways to decide between Option A and Option B. The two aggregation methods will lead to opposite conclusions.

  However, we want the students to construct the aggregation rule themselves. So perhaps we split the class into two groups (Group X and Group Y) and assign each group a different method for measuring harm. Then, each group must decide which option (A or B) is better based on their method. We set it up so that Group X concludes that Option A is better (avoid the many trivial harms) and Group Y concludes that Option B is better (prefer the one moderate harm).

  But we need the methods to feel natural. So:

  - Group X: They are told to measure the harm of each outcome relative to the best outcome in the scenario (which we set as "no harm" for everyone) and the worst outcome in the scenario (which might be the moderate harm for the one person in Option A, and the trivial harm for everyone in Option B). So they normalize the worst outcome in the scenario to 1 and the best to 0. Then they add up the harm for each option.

  - Group Y: They are told to measure the harm relative to a broader context. We might introduce a third, much worse outcome (which we don't actually implement) and ask them to imagine how bad the outcomes in the scenario are relative to that. Then, for each person, they assign 0 to the best outcome (no harm) and 10 (or 100) to the worst outcome they can imagine (the catastrophic one). Then they measure the harm of the moderate harm and the trivial harm on that scale and add them up.

  But we don't want to lecture about utility functions. How to operationalize without math?

  Alternative approach: Use money or tokens to represent harm, but that might lead to willingness-to-pay, which we want to avoid.

  Another idea: Use a "pain scale" that each student fills out. But we need two different scales.

  Let me think of a concrete scenario:

  Option A: One randomly selected student has to hold a heavy textbook (say, 5 pounds) at arm's length for 10 minutes. (Moderate harm)
  Option B: Every student has to hold a pen (very light) at arm's length for 30 seconds. (Trivial harm)

  But we need the harms to be real and trivial enough that Option B is not too bad.

  Now, to create the flip, we need two different ways to measure the harm.

  Step 1: Calibrate individual harm.

  We ask each student to rate the discomfort of several activities on a scale. But we give two different sets of instructions.

  Group X (local scale): 
  "Consider the following three outcomes that might happen to you in this class:
  - Outcome 1: No discomfort (you just sit and do nothing).
  - Outcome 2: Hold a pen at arm's length for 30 seconds.
  - Outcome 3: Hold a heavy textbook at arm's length for 10 minutes.

  Assign a number to each outcome to represent how bad it is. Let the best outcome (no discomfort) be 0 and the worst outcome (hold textbook) be 10. Then assign a number to the pen-holding accordingly."

  Group Y (global scale):
  "Think about discomfort you have experienced in your life. We will consider:
  - Outcome A: No discomfort (like sitting comfortably).
  - Outcome B: Hold a pen at arm's length for 30 seconds.
  - Outcome C: Hold a heavy textbook at arm's length for 10 minutes.
  - Outcome D: A very bad experience (e.g., stubbing your toe really hard, or getting a paper cut on your eyeball, but we won't do that) - just imagine.

  Assign numbers to these outcomes. Let the best outcome (no discomfort) be 0 and the worst outcome you can imagine (like the paper cut) be 100. Then assign numbers to the pen-holding and textbook-holding accordingly."

  But we don't want to lecture, so we have to keep it simple.

  We can skip the calibration step and instead have the groups use different normalization in the aggregation.

  But how do we get the students to do the aggregation without telling them the math?

  We can have them vote with "harm tokens". Each group is given a set of tokens to distribute to represent the harm of each outcome.

