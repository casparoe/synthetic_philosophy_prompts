  ### Decision Tree: Reasons for Attitudes  
  **Start with the standard case:** A wealthy stranger offers you a substantial prize if you *admire* him. He is neither threatening nor deceptive, and you have no prior feelings about him.  

  ---

  #### **Node 1**  
  **Does the prize offer count in favor of your *admiring him*?**  
  - **(a)** No: It only counts in favor of *bringing it about* that you admire him (e.g., by causing yourself to feel admiration).  
  - **(b)** Yes: It *directly* counts in favor of having the attitude of admiration toward him.  

  *If (a), go to **Leaf 1**.  
  If (b), go to **Node 2**.*  

  #### **Node 2**  
  **Does the prize offer determine whether admiring him is a *correct response* to him?**  
  *(i.e., does it help show whether the admiration "gets him right"?*  
  - **(a)** Yes.  
  - **(b)** No.  

  *If (a), go to **Node 3**.  
  If (b), go to **Node 4**.*  

  #### **Node 3**  
  **How does the prize determine whether admiration is correct?**  
  - **(a)** It is *evidence* that he is admirable (e.g., because such an offer suggests hidden virtues).  
  - **(b)** It *makes admiration correct* independently of his features (e.g., the prize itself justifies admiration, even if he isn’t admirable).  

  *If (a), go to **Leaf 6**.  
  If (b), go to **Leaf 5**.*  

  #### **Node 4**  
  **In the *retentive reasons* case:** You already admire your supervisor for her patience. You then learn that *keeping* this admiration (not initially forming it) will prevent you from quitting your PhD. Is this reason to *keep* admiring her **the same kind** as the reason to *have* admired her (her patience)?  
  - **(a)** Yes: Both are reasons of the same fundamental kind.  
  - **(b)** No: They are different kinds of reasons.  

  *If (a), go to **Leaf 5**.  
  If (b), go to **Node 5**.*  

  #### **Node 5**  
  **In the *self-shaping reasons* case:** You have a reason to let yourself grieve a loss—not because grief fits the loss, nor due to external rewards, but because grieving will shape you into someone who notices others’ pain. Is this "functional" reason **the same kind** as reasons that make grief a *correct response* to the loss (e.g., the loss’s severity)?  
  - **(a)** Yes.  
  - **(b)** No.  

  *If (a), go to **Leaf 7** (unnamed).  
  If (b), go to **Node 6**.*  

  #### **Node 6**  
  **Does the functional reason bear on the *value of the loss itself*?**  
  *(i.e., does it show the loss is more grievous?)*  
  - **(a)** Yes.  
  - **(b)** No.  

  *If (a), go to **Leaf 3**.  
  If (b), go to **Leaf 2**.*  

  ---

  ### Leaves (Theoretical Positions)  
  - **Leaf 1 (Scope/Ambiguity):**  
    The prize is a reason to *cause admiration*, not a reason *for admiration*.  
    *Handles cases:* Retentive reasons are reasons to *sustain* attitudes, not for the attitudes themselves. Self-shaping reasons are reasons to *cultivate* responses.  

  - **Leaf 2 (Buck-passing with fittingness restriction):**  
    Reasons for attitudes must bear on whether the attitude is a *correct response*. The prize, retentive, and self-shaping reasons do not.  
    *Handles cases:* All three are excluded as reasons for attitudes (only reasons for *actions*).  

  - **Leaf 3 (Value-first):**  
    Only reasons bearing on the *value of the object* (e.g., the stranger’s traits, the loss’s gravity) count as reasons for attitudes. The prize, retentive, and self-shaping reasons do not.  
    *Handles cases:* Self-shaping reasons might *coincide* with value-based reasons but aren’t identical.  

  - **Leaf 4 (Proprietary-reason pluralism):**  
    Each attitude has a unique "proprietary" kind of reason (e.g., the *admirable* for admiration). The prize belongs to a *different* proprietary kind (e.g., pragmatic reasons).  
    *Handles cases:* Retentive reasons are proprietary to *sustaining states*, not admiration. Self-shaping reasons are proprietary to *self-cultivation*.  

  - **Leaf 5 (Weight deflationism):**  
    All reasons for attitudes are the *same kind*; distinctions are about *weight* (e.g., the prize is a weak reason easily outweighed by the stranger’s flaws).  
    *Handles cases:* Retentive/self-shaping reasons are the same kind as standard reasons, differing only in strength.  

  - **Leaf 6 (Attitude-reason as evidence):**  
    A reason for an attitude is *evidence* that the attitude is correct. The prize is evidence the stranger is admirable.  
    *Handles cases:* Retentive reasons might weakly evidence the supervisor’s admirability; self-shaping reasons are *not* evidence (so this view struggles).  

  - **Leaf 7 (Unnamed):**  
    State-oriented reasons (prize, retentive, self-shaping) form a *unified kind* distinct from correctness, but self-shaping is *not* assimilated to correctness.  
    *Diagnosis:* Underexplored; may conflate functional/pragmatic considerations.  

  ---

  ### Empty Cells & Indistinguishable Views  
  - **Node 4(a) → Node 5(b):** Empty. *Diagnosis:* Incoherent—if retentive reasons are the *same kind* as object-given, but self-shaping are *different*, no view holds this.  
  - **Leaf 5 vs. Leaf 7:** Hard to separate. *Test with:* "Could a reason to *dislike* a beloved person (to avoid bias) ever be the *same kind* as aesthetic reasons for dislike?" If yes, **Leaf 5**; if no, **Leaf 7**.  

  ---

  ### Key: Locate Your Path  
  - **Leaf 1:** (a) at Node 1.  
  - **Leaf 2:** (b) at Node 1 → (b) at Node 2 → (b) at Node 4 → (b) at Node 5 → (b) at Node 6.  
  - **Leaf 3:** (b) at Node 1 → (b) at Node 2 → (b) at Node 4 → (b) at Node 5 → (a) at Node 6.  
  - **Leaf 4:** *Not directly mapped* (requires proprietary kinds; use **Leaf 2** if buck-passing, or **Node 6(a)** if value-first fails).  
  - **Leaf 5:** (b) at Node 1 → (a) at Node 2 → (b) at Node 3 *or* (b) at Node 1 → (b) at Node 2 → (a) at Node 4.  
  - **Leaf 6:** (b) at Node 1 → (a) at Node 2 → (a) at Node 3.  
  - **Leaf 7:** (b) at Node 1 → (b) at Node 2 → (b) at Node 4 → (a) at Node 5.  

  *(Views loosely associated with leaves: **1**=Thomson, **2**=Scanlon, **3**=Rønnow-Rasmussen, **4**=D’Arms & Jacobson, **5**=Schroeder, **6**=Parfit.)*
