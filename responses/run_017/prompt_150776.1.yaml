answer: |-
  **MEMORANDUM**  
  **TRANSIT AUTHORITY COMPLIANCE DIRECTIVE**  
  **REF:** SOP-DDE-7.3 Rev.04 | **DATE:** 2023-10-27  
  **SUBJECT:** Operational Mitigation Procedures Involving Positioned Parties (PPs)  
  **ISSUING OFFICE:** Office of Foresight Allocation (OFA)  
  **DISTRIBUTION:** All Regional Control Centres (RCCs), Rostered Operators (OPRs), Track Maintenance Supervisors (TMSs), Ethics Compliance Liaisons (ECLs)  

  **1. PURPOSE**  
  This Standard Operating Procedure (SOP) establishes protocols for OPRs encountering scenarios involving imminent harm to PPs situated on active trackways, ensuring strict adherence to Jurisdictional Statute 45-B (Intentionality & Consequence Mitigation Act).

  **2. SCOPE**  
  Applies to all OPR actions during scheduled service runs where PP presence is registered per Maintenance Schedule MS-88a (Positioned Party Deployment & Verification). Excludes unsanctioned third-party interventions.

  **3. DEFINITIONS**  
  3.1. **Positioned Party (PP):** Individual(s) occupying trackway per authorised MS-88a schedule.  
  3.2. **Operator (OPR):** Rostered personnel controlling trolley direction via authorised levers.  
  3.3. **Primary Effect (PE):** Direct outcome of OPR's chosen action (e.g., trolley path).  
  3.4. **Foreseen Side Effect (FSE):** Anticipated outcome inextricably linked to PE but not constituting OPR's objective (e.g., PP fatality resulting from PE trolley diversion).  
  3.5. **Tertiary Effect (TE):** Consequence foreseeably arising from an FSE. *Not subject to OFA mitigation assessment.*  
  3.6. **Five-Metre Rule (FMR):** Critical proximity threshold governing intent classification (Section 5.2).

  **4. PROCEDURE: DIVERSIONARY ACTIONS (LEVER OPERATION)**  
  4.1. Upon visual confirmation of PP(s) on active track per MS-88a alert, OPRs *must* assess diversion feasibility via authorised sidings.  
  4.2. **Foresight Allocation:**  
      4.2.1. Diversion causing PP fatality on siding is classified as FSE.  
      4.2.2. Record FSE in Incident Log TA-FORM DDE-12, citing "Track Divert (FSE)".  
      4.2.3. *Tertiary Effects (TE),* including subsequent service delays or distress among non-PP passengers, are recorded solely under Operational Impact Log TA-FORM OPS-7. *No OFA review required.*  
  4.3. Compliance is achieved if:  
      a) Diversion aligns with published timetable adjustment protocols (Ref: SOP-TIM-4.1).  
      b) FSE is minimised where feasible (e.g., selecting siding with fewest PPs).  
      c) Logging is completed per 4.2.2.

  **5. PROCEDURE: PROXIMITY INTERVENTIONS (NON-LEVER ACTIONS)**  
  5.1. Physical interaction with PP by OPR is governed by Manual Handling Directive MHD-09 (Unauthorised Use of Positioned Assets).  
  5.2. **Five-Metre Rule (FMR) Application:**  
      5.2.1. For OPR actions initiated >5m from nearest PP: Outcomes classified per Section 4 (FSE/TE possible).  
      5.2.2. For OPR actions initiated ≤5m from nearest PP: Outcomes constitute *intended* effects.  
  5.3. **Prohibited Actions:**  
      5.3.1. Pushing, pulling, or otherwise physically displacing a PP onto tracks.  
      5.3.2. *Rationale:* Constitutes deliberate repurposing of PP as braking/obstruction equipment (MHD-09 Violation). Fatality is PE, not FSE. Non-compliant.  
  5.4. **Permitted Actions (FMR >5m):**  
      5.4.1. Activating track-side debris screens (causing PP fatality as FSE).  
      5.4.2. Dropping standard-issue track weights (causing PP fatality as FSE).  
      5.4.3. *Logging:* Use TA-FORM DDE-12, citing "Ancillary Measure (FSE)".  
  5.5. **Reporting Non-Compliance:** Suspected MHD-09 violations (e.g., PP pushing) must be reported immediately via ECL Hotline. OPRs involved undergo mandatory OFA Intentionality Review.

  **6. TRAINING & DOCUMENTATION**  
  6.1. OPRs require biennial OFA-DDE recertification, including FMR practical assessment.  
  6.2. All PP-related incidents require dual logging: OFA (TA-FORM DDE-12) & Operational (TA-FORM OPS-7).  
  6.3. TMSs verify PP positioning strictly per MS-88a; deviations reported separately (TA-FORM TRK-11).

  **REVISION HISTORY:**  
  Rev.01 (2020-05-12): Initial Release.  
  Rev.02 (2021-11-03): Added FMR quantification.  
  Rev.03 (2022-08-17): Incorporated TE logging exemption (OPS-7).  
  Rev.04 (2023-10-27): Clarified MHD-09/lever-action distinction (Section 5.3).

  **APPROVED:**  
  _Agnes Finch, Director, Office of Foresight Allocation_

  ---

  **WHAT'S BEING SENT UP**

  This memo satirizes core elements of the Doctrine of Double Effect (DDE) and its application in trolley problems by recasting them as absurd bureaucratic procedures:

  1.  **Normalizing the Scenario:** The trolley, victims ("Positioned Parties"), and lever-puller ("Operator") are all part of a scheduled, institutionalized system ("Maintenance Schedule MS-88a"). This removes any question of *why* people are on the tracks or who put them there, mirroring how thought experiments isolate the moral dilemma from context.
  2.  **The "Office of Foresight Allocation" (OFA):** This directly parodies DDE's central mechanism: categorizing outcomes as *intended* vs. *merely foreseen*. The OFA's sole job is this classification, reducing a philosophical distinction to administrative paperwork ("TA-FORM DDE-12").
  3.  **Tertiary Effects (TE):** The memo explicitly states TEs "are recorded solely under Operational Impact Log TA-FORM OPS-7. *No OFA review required.*" This satirizes a potential weakness in DDE: consequences that are clearly foreseeable but several steps removed from the immediate action might be deemed irrelevant to the moral assessment of the act itself, allowing institutions to disclaim responsibility.
  4.  **The Five-Metre Rule (FMR):** This brutally literalizes the often-vague distinction between intention and foresight. DDE relies on a psychological state (intent). The FMR replaces this with a purely physical measurement ("≤5m = intended"), highlighting the potential arbitrariness and practical difficulty of judging intent, turning it into a compliance checkpoint.
  5.  **Footbridge as "Manual Handling Violation":** Pushing the man is banned not primarily because it's murder, but because it's "deliberate repurposing of PP as braking/obstruction equipment" – a safety/compliance violation. However, causing the *same death* via a dropped weight from >5m is permissible as an FSE. This exaggerates how DDE's focus on *how* the harm is caused (direct physical force vs. redirecting a threat) and intent can lead to seemingly counterintuitive distinctions between otherwise similar outcomes (killing one to save five). The "unauthorised use of equipment" framing is the darkly comic twist.
