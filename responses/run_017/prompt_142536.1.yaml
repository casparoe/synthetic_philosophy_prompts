prompt: |-
  Been turning something over for a while and I don't have a word for it, hoping someone here does.

  Take tipping. In New York it's basically compulsory: the waiter is owed it, you're a bad person if you stiff them. But there's a way of tipping that somehow lands worse than not tipping at all — working out the exact percentage on your phone, saying "that's the customary rate, yeah?", handing it over like you're settling an invoice. Same money, same hands, and people react as though you've insulted them. Compare the person who leaves the same amount without thinking about it, who is completely fine.

  Second case. I'm British, recently somewhere with a much looser queueing culture. Back home, letting someone go ahead of you at the bus stop is a tiny courtesy; where I am now it's more of a scrum and you hold your ground. When I do the local thing I feel fine. When I do the local thing *as* the local thing — a small mental "when in Rome" before I do it — I feel slightly grubby, and I don't think that's just leftover Britishness. And I've seen the mirror image: a visitor here who very visibly adopts the local way of doing it and reads as condescending rather than respectful, even though her behaviour is exactly what everyone around her is doing.

  So the thing I want a name for: conventions where what you owe isn't the behaviour, it's the behaviour done without it occuring to you to do otherwise. Which means the person with most reason to think about what's required — the visitor, the one who looked the norm up before travelling — is structurally incapable of getting it right, and the more carefully they comply, the worse they do. And it isn't read as mere awkwardness; it's read as a moral failing, a kind of contempt. I don't think a plain signalling story captures it, because on that story the observable behaviour is all there is to get right, and here the observable behaviour is identical in the good and the bad case.

  Does this have a name? Someone once told me Kant has a distinction about doing the right thing for the right reason, but from what I remember his version says the opposite of what I mean — that acting *because* it's required is the good case. So if there's something established, say how it differs from that and from the general wrong-reasons stuff, and where its edges are: does it apply to all conventions or only some (tipping yes, driving on the left no — why?), is this really obligation or just etiquette wearing obligation's clothes, and what is the visitor supposed to do about it. I don't want a label dropped on it, I want the carving. English spelling please, I can't be doing with -ize endings.
reasoning: |-
  Okay, the user is describing a fascinating social phenomenon where the intention behind following a convention matters as much as the action itself. They've given two clear examples: tipping in New York and queueing behavior cross-culturally. The core issue is that performing the "correct" action while consciously thinking about it comes across as inauthentic or even insulting, whereas doing it naturally is socially rewarded. 

  Hmm, interesting how they explicitly reject Kant's duty-based morality here - normally we'd consider acting "because it's required" as virtuous, but in social conventions it backfires. The user wants terminology that captures this paradox. They're also asking deeper questions about why some conventions work this way (tipping) while others don't (driving side), and whether this is true obligation or just etiquette.

  The Britishness shines through in their examples and phrasing ("grubby", "scrum", spelling preference). They're clearly thoughtful about social dynamics - this isn't just about finding a word but understanding the mechanism. The "carving" request suggests they want analytical depth, not just dictionary definitions.

  Let me unpack the layers: First, the behavioral signaling aspect - when we see someone calculating tips or visibly switching cultural modes, it signals they don't inherently belong to the group. Then there's the moral dimension - the local interprets the conscious effort as implying the convention is arbitrary rather than natural. 

  For terminology, "social fluency" comes close but is too broad. "Unconscious competence" from learning models fits but isn't social-specific. The French "pudeur" concept (discretion about intimate matters) almost touches it but misses the performative aspect. Bourdieu's "habitus" is perfect theoretically but might be too academic. 

  The key distinction seems to be between conventions that are:
  - Technical (driving side) vs 
  - Relational (tipping/queueing)
  The relational ones require what Erving Goffman called "uncalculated conduct" to maintain the social fiction that these are natural behaviors rather than constructed rules.

  Ah! And the visitor's dilemma - they're damned if they do (inauthentically), damned if they don't (rude). The only solution is either full immersion until it becomes natural, or the "graceful surrender" approach where they transparently bumble through while showing good faith. 

  This connects to why Americans find British politeness insincere sometimes - it's not the actions but the visible calculation behind them. Fascinating how the user's examples perfectly illustrate that transatlantic dynamic they didn't explicitly mention.
answer: |-
  This is a brilliantly observed social paradox – and you're right, it demands more than just a label. What you're describing sits at the intersection of social psychology, anthropology, and moral philosophy. Let's carve it up:

  **The Core Concept: Unconscious Social Conformity as Moral Obligation**

  1.  **The Phenomenon:** Certain social norms require not just the *action*, but the *unconscious internalization* and *effortless execution* of that action to be considered properly fulfilled. Conscious calculation, explicit reference to the rule, or visible effort to comply *undermines* the social value of the act, often reading as insincere, contemptuous, or morally deficient, even if the observable behavior is identical to the "correct" version.

  **Established Concepts & Distinctions:**

  2.  **Kantian Duty (vs. Your Case):** You correctly identified the contrast. For Kant, acting *because* it is your duty is the highest moral good ("acting from duty"). Your case flips this: acting *because* it's the rule (and visibly so) is the *problem*. The "good" actor acts *as if* there were no rule, purely from ingrained disposition. Kant cares about the *reason* (duty); this social norm cares about the *appearance of naturalness*, implying the *reason* is internalized virtue, not external calculation.
  3.  **Signalling Theory (vs. Your Case):** Standard signalling theory says the *observable behavior* is the signal. Your case shows the signal includes the *manner of performance*. The visible effort to signal ("working out the percentage," a mental "when in Rome") sends a *counter-signal*: "I am not one of you; this is not natural to me; I am performing this for your benefit/judgment." It highlights the artificiality of the norm, which the group prefers to treat as natural and self-evident.
  4.  **Habitus (Pierre Bourdieu):** This is a crucial concept. Habitus refers to the deeply ingrained set of dispositions, perceptions, and practices acquired through long-term immersion in a specific social field. It generates "practices" that feel natural and spontaneous. *Your "good" actor has the relevant habitus.* The visitor or calculator lacks it; their conscious effort reveals its absence. The moral failing perceived is often a failure of habitus – not being "the right kind of person."
  5.  **Uncalculated Conduct (Erving Goffman):** Goffman studied how we manage social interactions to maintain "face" and smooth functioning. He noted that many crucial social acts (like politeness) must appear "uncalculated" to be convincing. Calculated conduct breaks the illusion of natural social flow and reveals the machinery, which is socially disruptive and often interpreted as manipulative or disrespectful.
  6.  **Pudeur (French concept):** Translates roughly as modesty, reserve, or discretion. It implies a sense of shame or awkwardness associated with making certain things (especially social obligations or intimate feelings) too explicit or transactional. Your tipping/queueing examples violate *pudeur* by making the implicit rule explicit and transactional. The "correct" way preserves discretion.

  **Why Some Conventions and Not Others?**

  7.  **Relational vs. Technical Norms:**
      *   **Tipping/Queueing/Courtesies:** These are **relational norms**. They govern face-to-face interaction, status negotiation, mutual respect, and the distribution of intangible goods (deference, appreciation, social harmony). Their *performance* is part of the social glue. Making the rule explicit turns a relational gesture into a cold transaction, violating the expected emotional or hierarchical subtext.
      *   **Driving on the Left/Formal Procedures:** These are primarily **technical or coordination norms**. Their primary function is predictability and safety. *How* you perform them (as long as it's safe and correct) matters less than *that* you perform them correctly. There's little relational subtext to violate by conscious adherence.

  **Obligation or Etiquette in Disguise?**

  8.  **The Moral Weight:** This *feels* like obligation because violating the *unspoken requirement of naturalness* often triggers strong moral condemnation ("cheap," "rude," "condescending," "insincere"). It's not just "bad manners"; it's read as revealing a character flaw – a lack of generosity, empathy, or respect. However, its basis is fundamentally *social* rather than universal moral law (like Kant's categorical imperative). It's **etiquette masquerading as morality**, leveraging moral language to enforce social conformity and maintain group boundaries. The "obligation" is to affirm the group's shared reality and values through seamless participation.

  **The Visitor's Dilemma & What To Do:**

  9.  **The Structural Impossibility:** You're absolutely right. The visitor, by definition lacking the ingrained habitus, is structurally disadvantaged. Conscious effort is their only tool, yet it often backfires by signalling their outsider status and highlighting the norm's artificiality.
  10. **Mitigation Strategies (Graceful Surrender):**
      *   **Focus on Underlying Principle (Subtly):** Instead of calculating a tip, think "be generous to service staff" and round up significantly based on feel. The *intention* behind the action (generosity) might bleed through more than the calculation.
      *   **Observe and Mimic Fluency:** Watch how locals *effortlessly* perform the norm. Try to copy the *rhythm* and *manner*, not just the action. Aim for smoothness over precision.
      *   **Embrace Awkwardness (Sincerely):** A genuine, good-natured "Sorry, I'm still getting the hang of how this works here, please bear with me" can disarm resentment. It acknowledges the effort *without* the transactional feel. It signals respect for the norm *and* your outsider status.
      *   **Prioritise Core Respect:** Ensure your fundamental demeanour is respectful and well-intentioned. This goodwill can sometimes override minor breaches in the *manner* of performance.
      *   **Accept Imperfection:** Understand you might never achieve true "naturalness" as a short-term visitor. Aim for "respectful effort" rather than "invisible conformity." Locals often appreciate the visible *attempt* if it's sincere and not pedantic.

  **The Carving: A Summary**

  You've identified a specific class of **relational social norms**. Fulfilling these norms requires **unconscious conformity** rooted in **habitus**. Successful performance must appear as **uncalculated conduct** to avoid violating **pudeur** (discretion) and signalling a lack of authentic belonging or respect. Conscious adherence, especially when visibly effortful, functions as a **counter-signal**, exposing the norm's constructed nature and often being interpreted as a **moral failing** (insincerity, contempt) rather than mere awkwardness. This contrasts sharply with **technical norms** where conscious adherence is neutral or positive, and with **Kantian duty** where conscious adherence is the ideal. The visitor faces a **paradox of performative authenticity** but can mitigate it through focus on underlying principles, mimicry of fluency, sincere acknowledgment of learning, and prioritising core respect.

  **The Closest Single Term?**

  While no single English word perfectly captures the *entire* complex phenomenon, the phrase **"performative authenticity"** comes closest. It highlights the need for the action to *appear* genuinely spontaneous and internally motivated (authentic) to successfully *perform* the social role. The failure mode is **visible calculation** or **performative compliance**.

  Your observation cuts deep into how social cohesion and belonging actually function. It's less about the rule itself and far more about seamlessly embodying the shared fiction that the rule is natural and right.
