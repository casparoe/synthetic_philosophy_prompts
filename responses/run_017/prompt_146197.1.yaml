     **In sequential games of perfect information with a finite horizon, players have a small prior probability that the opponent is a commitment type (committed to a strategy that is not the backward induction strategy). They update this belief based on observed actions. At each decision node, the player chooses the action that maximizes their expected utility given their current belief about the opponent's type. Additionally, in games where the stage game does not have a dominant strategy that yields the highest possible payoff against a commitment type, the player may choose to cooperate (pass) to either test the waters or to reciprocate cooperation. In games where the stage game has a dominant strategy that yields the highest payoff even against a commitment type (like the Prisoner's Dilemma), the player uses that dominant strategy.**

   This principle explains:

     - Two-leg centipede: Take (because the expected gain from passing is not worth the risk).
     - Hundred-leg centipede: Pass at the first node (because the expected gain from passing is high given the small chance of a commitment type and the large upside).
     - Repeated PD: Defect from round one (because defecting is dominant and gives the highest payoff even against a cooperator).
     - Chain-store: Fight the first few entrants (to build a reputation and deter future entry, leveraging the small prior probability that the incumbent is tough).
     - Endless centipede: Pass forever (because it's an infinite game and the folk theorem applies; no need for commitment types).
     - Opponent is a copy: Pass (because the copy will do the same, leading to high payoffs; this is a form of acausal reasoning that can be seen as a special case of commitment: the copy is committed to the same strategy).
     - Public announcement: In a long game, the announcement increases the prior probability of a commitment type, so pass for a while. In a short game, it doesn't change the prior enough to make passing better.

     - Flip-flop case: After seeing the opponent pass at node1, update the belief that the opponent is more likely to be a commitment type, and then pass at node2 to keep the game going (and because the expected value of passing is now higher).

   Confidence:

     - Most confident: The explanation for the centipede games (two-leg and hundred-leg), the chain-store game, and the public announcement case. These are standard in game theory with reputation effects.
     - Less confident: The repeated PD case. We had to argue that defecting is dominant even against a cooperator. But note: if the opponent is a cooperator (commitment type), then defecting in every round gives the highest possible payoff (T in every round). So it's dominant. This seems solid.
     - Least confident: The surprise exam paradox and the copy case. For the surprise exam, we set it aside. For the copy case, we used acausal reasoning which is not standard. We are least confident in that part.

   The flip-flop case is explained with updating, which we are confident about.

   Therefore, we recommend:

     In the flip-flop case: Pass back and keep passing for a long while. This is rational under the principle.

     The one claim we are least sure of is the copy case. But note that the user says they pass and don't feel irrational. So we are trying to explain that. The acausal reasoning might be replaced by: if I am in the copy's position, I would pass if the copy in my position passes? This is circular. But it leads to a cooperative outcome. It's a Nash equilibrium to pass forever? But in the finite game, it's not. So it's a bit mysterious. We are least confident in this part.

   Finally, we state the principle precisely:

     Let Θ be the set of possible types for the opponent. Let θ_0 be the rational type (who plays the backward induction strategy) and θ_1, ..., θ_k be commitment types. Let μ_0 be the prior probability distribution over Θ.

     At each history h, the player updates their belief μ(h) using Bayes' rule (if possible).

     The player's strategy σ is such that at each history h, they choose an action a that maximizes:

          E_{θ ~ μ(h)} [ u(a, σ_θ) | h ]

     where σ_θ is the strategy of type θ.

     In the case of the copy, the opponent's type is the same as the player's own type. So the player knows that the opponent will play the same strategy they choose. Therefore, they choose a strategy that, if played by both, gives a high payoff. This leads to passing.

     In the PD, the dominant strategy is to defect regardless of the opponent's type.

     This formal principle should be testable: it can be implemented in a computer program to play these games.

     We are confident that this principle explains all the cases except the surprise exam. For the surprise exam, we note that it is a different kind of paradox and might require a separate treatment (perhaps involving knowledge dynamics and the impossibility of common knowledge in a finite hierarchy).

     We are least confident in the copy case because it involves self-referential reasoning that is not fully captured by the standard type-based framework. But we think the principle is a good start.
