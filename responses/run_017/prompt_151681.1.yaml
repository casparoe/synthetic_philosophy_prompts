prompt: |-
  Hi — I'm a volunteer giving advisor for a smallish family foundation, and I keep tripping over something in how the effective-altruism-flavoured funding world actually behaves. Could you answer in British English?

  Here's the practice. Nearly every serious funder in that space expresses value in one unit: you work out how much good a programme does, then state it as a multiple of simply handing the same money to someone in extreme poverty. Unconditional cash transfers are the yardstick — the one thing everyone treats as known — so the case for deworming, insectide-treated nets, vitamin A, whatever, is that it's some multiple better than cash. Second: what actually gets funded is overwhelmingly the stuff with a randomised trial or a clean metric behind it, a DALY here and a test score there, while things without a number attached — organising, movement building, policy and institutional work, most systemic bets — mostly don't get a look in however plausible the story is. And this has got more pronounced as the money has got bigger and the grantmaking has professionalised. Third: the very same people will defend cash by saying poor people know their own needs best and we shouldn't impose our guesses on them, then turn around and fund a health intervention precisely because recipients weren't going to choose it and needed a subsidy, a nudge or a free delivery to take it up.

  So what does that package presuppose? Does using cash as the zero point commit you to a substantive view about what makes a life go well, or is it only a convention? Is the preference for measurable things a moral claim about what's valuable, or an artefact of foundations and grant officers having to justify themselves to a board? Is the cash-knows-best / nets-need-a-nudge pairing actually inconsistent, or can one theory carry both? And what would have to change in how they did things if the implicit view were swapped for a rival one?

  Be clear about which parts the practice strictly requires and which merely sit comfortably with it, and about where several quite different theories would all license exactly what they do. And please separate what's genuinely settled among people who know this material from what's contested — flag the contested bits as contested instead of smoothing them into a consensus. I've read enough of the blog posts to know a lot of this is argued about.
reasoning: |-
  Okay, let me unpack this query from a foundation advisor. They're observing three distinct but interconnected practices in EA-influenced grantmaking: the universal use of cash transfers as the benchmark metric, strong preference for quantifiable interventions over systemic work, and what appears to be a contradiction between trusting poor people's choices while funding interventions they wouldn't choose.

  Hmm, the advisor seems sophisticated - they've clearly noticed tensions between stated principles and actual funding patterns. The British English request suggests they might be UK-based. Their frustration with the measurable/non-measurable divide feels very lived, probably from reviewing countless proposals where compelling systemic work gets passed over.

  Right, let's dissect each element systematically. First, the cash-as-benchmark practice. Is this just convenient or does it carry philosophical baggage? The advisor's exactly right to question whether this presupposes welfarism. But interestingly, one could technically use cash as a unit without being committed to its underlying philosophy - like using Celsius without believing water's freezing point is metaphysically special. Though in practice, the choice of benchmark does shape what gets funded.

  On the measurement bias... ah, this is where it gets thorny. The advisor's spotted that foundations aren't neutral observers here - their institutional realities (accountability to boards, scaling pressures) actively shape what "counts" as evidence. There's a crucial distinction between what's valuable and what's measurable that often gets blurred. The malaria net RCTs get funded not because they're more important than, say, land reform advocacy, but because their impact fits neatly into spreadsheets.

  Now the apparent contradiction about agency... this is subtle. When EAs say "cash respects agency" but then fund deworming precisely because parents undervalue it, they're actually making two different agency claims: one about consumption choices (where they defer to recipients) and another about health investments (where they override preferences). It's not strictly inconsistent if you distinguish between domains, but it does reveal a paternalistic undercurrent in health interventions.

  What's genuinely settled? Well, the technical methodology for calculating cash multiples is standardised now. And everyone agrees measurement is harder for systemic work. But the big contested questions - whether the cash benchmark implicitly endorses preference utilitarianism, whether the measurable/non-measurable funding split reflects epistemic limits or moral priorities - those remain live debates. The advisor's intuition that institutional pressures shape funding patterns more than admitted? That's increasingly acknowledged but still uncomfortable for some.

  If foundations swapped their implicit theories... say, adopted a capability approach instead of welfarism? They'd need new benchmarks - maybe "years of capability expansion" rather than cash equivalents. The measurement bias might persist, but they'd at least fund more qualitative assessments of empowerment. And the agency contradiction would dissolve since the capability framework explicitly distinguishes between actual choices and real opportunities.
answer: |-
  Right, let's unpack this thoughtfully. You've hit upon core tensions in contemporary EA-influenced philanthropy. The practice you describe rests on interlocking presuppositions, some necessary, some merely convenient, and some potentially contradictory. Here's how it breaks down, separating the settled from the contested, and the necessary from the comfortable:

  **1. Using Cash Transfers as the Yardstick (The Zero Point):**

  *   **What it Presupposes:**
      *   *Necessarily:* **A commitment to welfarism as the primary metric of "good".** Cash is fungible and allows individuals to maximise their *own* subjective welfare based on their preferences and circumstances. Using it as the benchmark presupposes that the ultimate goal is increasing individual welfare, measured by preference satisfaction or revealed behaviour (how people *spend* the cash).
      *   *Necessarily:* **Commensurability.** It presupposes that the diverse benefits of different interventions (health, education, income, etc.) can be meaningfully expressed as multiples of the welfare gain from a standard unit of cash received by someone in extreme poverty. This requires collapsing complex goods into a single numerical value (e.g., via the value of a statistical life year - VSLY - or similar).
      *   *Comfortably, but not strictly required:* **A focus on direct, individual impacts over systemic change.** Cash directly impacts an individual's welfare. Systemic interventions work through complex chains, making direct comparison trickier.
  *   **Is it a Substantive View or Just a Convention?**
      *   **Contested, but leans Substantive.** While adopting *any* benchmark requires convention, choosing cash *specifically* strongly privileges a particular view of wellbeing: one centred on individual preference satisfaction and material welfare. Choosing, say, "years of democratic participation enabled" or "reductions in structural inequality" would reflect very different substantive views. The convention *embodies* the welfarist view.
  *   **What if the View Swapped?**
      *   A **Capabilities Approach** (e.g., Sen/Nussbaum) benchmark might measure gains in freedoms/opportunities (e.g., "multiples of the capability set expansion achieved by basic education"). Systemic work might fare better.
      *   A **Systemic Justice** view might use "reductions in unjust power imbalances" or "progress towards fair institutions" as the yardstick. Cash transfers might look less impressive on this metric than transformative policy work.
      *   **Required Change:** Funders would need a new, agreed-upon unit of impact fundamentally different from welfare-as-preference-satisfaction. Measurement would become vastly more complex (see point 2).

  **2. Preference for Measurable Interventions (DALYs, Test Scores, RCTs):**

  *   **What it Presupposes:**
      *   *Necessarily:* **Epistemic humility taken to an extreme.** A deep scepticism about our ability to *know* the impact of interventions without rigorous, preferably quantitative, evidence. This stems from well-documented cognitive biases and the historical failure of well-intentioned but unevaluated aid.
      *   *Comfortably, but powerfully:* **Institutional realities of foundations.** Boards demand accountability. Professionalised grantmaking seeks objective criteria to avoid bias, ensure fairness, and justify decisions internally/externally ("We funded X because the evidence shows Y"). Quantifiable metrics satisfy this need far better than narratives. Scaling requires predictable impact estimates. Large funders often favour interventions that can absorb large sums efficiently, which quantifiable, proven programs often can.
      *   *Comfortably:* **A particular view of cost-effectiveness.** It presupposes that cost-effectiveness analysis (CEA) is the *primary* or *most reliable* tool for comparing interventions. CEA inherently favours outcomes that can be cleanly quantified and causally attributed.
  *   **Is it a Moral Claim or an Artefact?**
      *   **Contested & Both.** The *epistemic claim* (rigorous evidence gives us more reliable knowledge) is central to EA philosophy and widely accepted as *generally* true.
      *   **However, the *practice* of *predominantly* funding only the measurable is where it becomes contested:**
          *   **Moral Claim (Implicit):** Some argue it reflects a view that only impacts we can confidently measure *should* count significantly in resource allocation ("If you can't measure it, it probably doesn't matter enough, or we can't know it matters").
          *   **Institutional Artefact:** Others argue it's primarily a pragmatic response to the need for accountability, scaling, and avoiding waste, *not* a denial of the value of non-measurable work. They might wish they could fund systemic work more but feel they lack reliable methods.
      *   **Settled:** Everyone agrees it's *harder* to measure complex systemic impacts rigorously. **Contested:** Whether the current methodological toolbox (RCTs, QALYs/DALYs) is *adequate* or *inappropriately narrow* for capturing crucial dimensions of impact (empowerment, institutional resilience, shifting norms, preventing catastrophe). Also contested is whether the funding skew *overcorrects* for past failures and neglects potentially high-impact but hard-to-measure avenues.
  *   **What if the View Swapped?**
      *   Adopting a view that **systemic change, power shifting, or preventing tail risks** is paramount would necessitate:
          *   Funding more speculative, theory-driven work.
          *   Developing alternative evaluation frameworks (e.g., qualitative case studies, process tracing, theory-based evaluation, systems mapping).
          *   Accepting higher uncertainty and longer time horizons for impact.
          *   Justifying grants based on plausibility, theory of change, and diversification of bets, alongside (or instead of) near-term quantifiable metrics.

  **3. The Agency Tension ("Cash Knows Best" vs. "Nets Need a Nudge"):**

  *   **Is it Inconsistent?**
      *   **Not *Strictly* Inconsistent, but Reveals a Nuance (or Tension):** This is where behavioural economics meets paternalism. The pairing *can* be held within one framework:
          *   **Domain Specificity:** The argument is that recipients are the best judges of how to spend cash to satisfy *consumption preferences* (food, shelter, small business). However, they may systematically under-invest in *health prevention/interventions* due to:
              *   **Information Gaps:** Not understanding the true risk/benefit (e.g., malaria transmission dynamics).
              *   **Cognitive Biases:** Present bias (valuing immediate costs like minor discomfort over distant benefits like avoiding disease), or underestimating low-probability/high-impact events.
              *   **Externalities:** My prevention benefits others (herd immunity).
          *   **Libertarian Paternalism/"Nudge":** Providing the net for free or subsidised respects choice *architecture* (they can still refuse or misuse it) while addressing the cognitive/informational barriers preventing optimal *long-term* welfare-maximising choices.
      *   **However, it *Feels* Inconsistent Because:** The strong rhetoric around "poor people know best" for cash can jar against the implicit "experts know better about health" for nets/deworming. It highlights the *selective* application of deference to agency.
  *   **What Theory Carries Both?**
      *   **Welfarism + Behavioural Economics:** The core goal is maximising individual welfare. Agency is respected where preferences are likely well-formed and choices welfare-maximising (cash for consumption). Where behavioural barriers or information gaps lead to systematically *welfare-reducing* choices (under-investment in proven health), a light-touch intervention (nudge, subsidy) is justified *to help individuals achieve their own deeper welfare goals*. The justification remains *individual welfare*, not expert imposition of a different conception of the good.
  *   **Contested Aspects:**
      *   **Scope of Paternalism:** How confidently can we identify "welfare-reducing" choices vs. legitimate differences in risk tolerance or preference? When does "nudging" become overreach? (e.g., Deworming debates often touch on this).
      *   **Power Dynamics:** Does this framework downplay the potential for external agendas and power imbalances inherent in defining what constitutes a "barrier" or "optimal investment"? Critics argue it can mask expert overconfidence.
      *   **Externalities vs. Paternalism:** Is the primary justification truly the individual's welfare, or the societal benefit (reduced disease burden)? The latter moves beyond pure welfarism.
  *   **What if the View Swapped?**
      *   A **Strong Agency-Primacy** view might reject most subsidies/nudges for health interventions, trusting recipients to learn and adapt, or prioritising information campaigns over free distribution (though evidence shows this often fails).
      *   A **Systemic View** might focus less on individual uptake decisions and more on why health systems are weak or information doesn't flow, funding interventions to address *those* root causes, potentially making nets/deworming sustainably accessible *through* markets or robust public systems, reducing the need for perpetual external nudges/subsidies.

  **Synthesis & What's Genuinely Settled vs. Contested**

  *   **Settled:**
      *   The technical *methodology* for calculating cost-effectiveness ratios using cash as a benchmark is well-established within the EA community.
      *   RCTs and quantitative metrics provide high confidence about the *direct, proximate impacts* of specific, well-defined interventions like cash, nets, or deworming pills in specific contexts.
      *   Cognitive biases and information gaps *can* lead to suboptimal individual decisions regarding health investments.
      *   Foundations *do* face significant pressure for accountability and demonstrable results, favouring quantifiable evidence.
  *   **Contested (Fiercely in Some Quarters):**
      1.  **The Adequacy of Welfarism/Cash Benchmark:** Does it capture everything valuable? (Critics: No, it neglects agency, justice, systemic risks, intrinsic goods). Is preference satisfaction the right goal? (Capabilities/Justice advocates: No).
      2.  **The Scope of the Measurement Bias:** Is the overwhelming focus on measurable interventions primarily driven by:
          *   (a) A sound epistemic principle that this is the only reliable way to do good? (EA Hardliner view)
          *   (b) A pragmatic, albeit regrettable, institutional necessity? (More Moderate EA view)
          *   (c) A mistaken conflation of measurable with valuable, neglecting crucial but hard-to-quantify pathways to impact? (Systemic/Structural Critics)
      3.  **Paternalism in Practice:** Does the "nets need a nudge" justification hold water across different interventions and contexts? Is the line between correcting market/information failures and imposing expert values drawn correctly? Is there sufficient humility about funders' own biases when identifying "suboptimal" choices?
      4.  **Neglect of Systemic/Tail Risks:** Is the focus on incremental, measurable gains in individual welfare dangerously short-sighted, neglecting potentially catastrophic risks (x-risks) or entrenched power structures requiring systemic disruption? Can these even be evaluated within the dominant framework?

  **In essence:** The practice strictly requires a welfarist foundation and commensurability to function. It comfortably sits with a strong preference for quantifiable evidence driven by both epistemic caution *and* institutional realities. The agency tension is resolvable theoretically within behavioural welfarism but remains practically and ethically contested regarding its scope and application. Swapping the implicit view would necessitate not just new metrics, but fundamentally different conceptions of "impact," "evidence," and the role of the funder – moving away from strict cost-effectiveness calculations towards more theory-driven, qualitative, or systemic evaluations, accepting higher uncertainty for potentially different kinds of gains. The professionalisation and scaling of funding have amplified the tendencies you observe, making the tensions more visible and, arguably, more consequential.
