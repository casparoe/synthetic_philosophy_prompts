prompt: |-
  I work in operations for a mid-sized organisation and I have no formal training in philosophy, statistics or economics — I read about this material on my own. I am putting together a short internal talk, about twenty minutes for colleagues who are not specialists, on why the numbers on our dashboards stop meaning what they used to mean. I need one example that does a particular job, because every example I can find does the opposite job.

  What I am trying to isolate is the difference between two ways a proxy measure can come apart from the thing it was standing in for. In the first, people change what they do in order to move the number: the behaviour shifts, the number improves or degrades, and the underlying thing does not move with it. This is the version everyone knows, and every illustration I come across is a version of it — teachers drilling students for a standardised exam, support staff avoiding the difficult cases, and so on. In the second, nobody changes what they do and the underlying thing is flat or even improving, but the number still degrades, because what broke is the measurement rather than the behaviour: which cases get into the calculation at all, what gets written in a field, what a timestamp is taken to mean, how a missing value is handled. I want a pure case of the second kind, and not a case of the first kind wearing a disguise.

  Here is what the case has to do, all at once:

  It has to be ordinary — a hospital ward, a claims office, a housing repairs desk — and fit in one paragraph, with no science fiction and no AI systems in the story.

  The proxy has to have been a genuinely good proxy beforehand: chosen for real reasons, tracking the thing it stood for over years, so that the case is not simply about a number that was always junk.

  Nobody in the story may optimise against the number. They may not even know it is being used the way it is now used, or if they do, that knowledge must play no role in what they do. No one changes their conduct toward the underlying thing, and the underlying thing itself must be flat or getting better.

  Everyone must be acting in good faith, competently, and in line with rules someone else set. No fraud, no falsified records, no lies, no villain, and no one being unusually stupid or unusually corrupt — my colleagues will reject the example the moment the mechanism depends on bad character.

  And yet the case has to be a real instance of the law rather than an unrelated piece of drift: it must be the becoming-a-target that causes the degradation. If the same number had stayed a quiet background statistic, with everything else in the story identical, nothing should move. That is the constraint that makes this hard, since in most stories I can think of the degradation comes from someone responding to the incentive.

  The reported number should move in a way that looks like genuine deterioration — smooth, plausible, no visible break at the moment the incentive was switched on — so that anyone looking only at the dashboard would conclude that the underlying thing got worse.

  After the scenario, please show your work. Walk through each requirement and how the story meets it, including the counterfactual where the metric is left un-targeted. Then give me the diagnostic signature: what an auditor holding only the metric's time series would conclude, what someone checking on the ground would find, and which observable feature tells the two hypotheses apart. Tell me which single feature of the case is doing the work, and what happens to the example if I remove it — my guess is that letting anyone in the story adjust their behaviour collapses it straight back into the standard story, but I would like that argued rather than asserted. Finally, be honest with me about the objection I expect from the sceptics in the room: that this is not really the phenomenon at all but just measurement error with a narrative attached, that the law is about incentive responses and nothing else, and that my second category is a category of one. Is my distinction real, or am I cutting the pie in the wrong place?

  Please do not stipulate the verdicts; I want to see them fall out of the mechanism, and I need the language plain enough to say out loud to non-specialists.
reasoning: |-
  Okay, let me tackle this user's problem. They need a clear example of a metric that degrades without behavior changes, purely due to measurement issues. The challenge is avoiding any incentive-driven behavior, which most examples include. 

  First, I recall Goodhart's Law often involves gaming the metric. But the user wants the second type: measurement breaks without anyone acting differently. Hospital examples come to mind because they're relatable. 

  Considering the requirements: ordinary setting, good initial proxy, no optimization, good faith, and the metric becoming a target causes the issue. The ER case fits. Triage nurses follow protocols, but the metric (time-to-first-clinician) gets distorted when it becomes a target. How? By changing what counts as "first clinician" in the system. 

  I need to ensure no one is gaming. The nurses aren't altering patient care; they're just logging differently because of policy changes. The underlying care might even improve, but the metric worsens due to reclassification. 

  Testing the counterfactual: if the metric wasn't a target, would logging change? Probably not. The policy update wouldn't happen. The key is the administrative change affecting measurement, not behavior. 

  Now, the diagnostic: auditors see rising times, ground observers see stable care. The red flag is increased "not applicable" cases in the data. Without the reclassification, it's just measurement error. But here, it's the targeting that triggers the reclassification. 

  Skeptics might say this is just measurement drift. But the user's point is that making it a target introduces distortions beyond incentives. The distinction holds because the breakdown is in measurement integrity, not behavior.
answer: |-
  Here's a pure case meeting all your requirements, drawn from healthcare operations:

  **The Scenario: Emergency Department Door-to-Clinician Time**

  A hospital tracks "Door-to-Clinician Time" (DTCT) – the time from patient arrival registration to first assessment by *any* qualified clinician (doctor, physician assistant, or nurse practitioner). For years, this was a background metric. It reliably correlated with patient satisfaction, perceived wait times, and clinical outcomes for time-sensitive conditions. A low DTCT indicated efficient triage and resource allocation.

  Senior leadership, seeking to improve patient flow, elevates DTCT to a key performance indicator (KPI) on executive dashboards. Unit managers are now held accountable for keeping it low. Crucially, **no staff change their clinical behaviour**: nurses still prioritize based on acuity, clinicians still see patients in medical priority order.

  However, an administrative rule change is implemented alongside the KPI focus: *Only assessments documented in the electronic health record (EHR) system within 2 minutes of the physical interaction will count as the "first clinician" timestamp for DTCT.* This rule aims to ensure data accuracy but wasn't strictly enforced before.

  **What Happens:**  
  Clinicians, facing complex cases or system delays, sometimes document assessments slightly *after* the actual interaction. Under the old, laxer regime, these were still captured as valid "first clinician" events. Now, under the strict 2-minute rule, these encounters are automatically flagged by the EHR. The operational policy dictates that flagged encounters are *excluded* from the DTCT calculation entirely – they are treated as "data missing" for this metric.

  The result? The *reported* DTCT metric starts to creep upwards. Why? The excluded cases were typically the *longer* DTCT encounters – complex cases where clinicians were busy *providing care* instead of immediately documenting. By systematically removing these longer times from the calculation, the *average* of the *remaining* (shorter) times increases slightly. The underlying patient flow and clinician behaviour haven't worsened; if anything, documentation compliance improves slightly under the new rule. Yet, the dashboard shows a deteriorating trend in DTCT.

  ---

  **Showing the Work (Meeting Requirements):**

  1.  **Ordinary Setting:** Hospital Emergency Department. Common metric (door-to-clinician/doc time). No sci-fi/AI.
  2.  **Genuinely Good Proxy Initially:** DTCT correlated with patient flow efficiency, satisfaction, and outcomes for years.
  3.  **No Optimisation/Behaviour Change:** Clinicians focus on patient care, not the timestamp. They document when they reasonably can. No one rushes documentation *instead* of care or avoids complex cases. Behaviour towards patients is unchanged. Underlying flow/quality is stable or improving.
  4.  **Good Faith & Competence:** Clinicians are doing their jobs properly. Admins are enforcing a (flawed) data integrity rule competently. No villains, fraud, or stupidity.
  5.  **Becoming-a-Target Causes Degradation (Counterfactual):** If DTCT remained a background metric, the strict 2-minute documentation rule *would not have been implemented*. Its implementation is a direct consequence of making DTCT a high-stakes KPI (to ensure "accurate" measurement of the now-important number). Without this rule, the slightly delayed documentation timestamps would still be included, and the average DTCT would remain stable.
  6.  **Plausible Degradation:** The rise in reported DTCT is smooth and gradual (as more borderline cases get excluded over time), mimicking a genuine decline in performance. It doesn't spike suddenly when the rule changes because exclusions happen case-by-case.
  7.  **Reported Number Moves:** The dashboard shows average DTCT increasing, suggesting worsening performance.

  **Diagnostic Signature:**

  *   **Auditor (Dashboard Only) Conclusion:** "Door-to-Clinician Time is steadily increasing. Patient flow efficiency is deteriorating. Intervention is needed to get clinicians seeing patients faster."
  *   **Ground Check Findings:** "Clinicians are seeing patients in the same priority order as always. Documentation is happening promptly after assessment, often within the 2-minute window but sometimes slightly later for complex cases. Patient flow seems unchanged or even slightly smoother. Staff report no pressure to see patients *faster* clinically, only to document *faster*."
  *   **Observable Feature Distinguishing Hypotheses:** **The proportion of patient visits excluded from the DTCT calculation.** Under the "genuine deterioration" hypothesis, exclusions should be random or low. Under the "measurement break" hypothesis, exclusions will be significant and *specifically tied to longer wait times* (i.e., the excluded cases have genuinely longer times than the included ones, but those times aren't captured). An auditor digging into the *raw data* would see a cluster of visits missing DTCT data, and spot-checking those would reveal they had longer actual wait times than the reported average.

  **The Single Feature Doing the Work:** The **change in the data inclusion/exclusion rules triggered by making the metric a target** is the core mechanism. This administrative change alters *which data points count*, not the underlying reality or behaviour.

  *   **If Removed:** If we remove the rule change (or the incentive to *have* such a rule), the data inclusion stays consistent. The metric remains stable. If we allow *any* behavioural change in response to the target (e.g., clinicians rushing documentation *during* patient care), it instantly collapses into the standard Goodhart story.

  **Addressing the Sceptics:**

  You anticipate the objection: "This is just measurement error with a narrative. Goodhart's Law is *only* about incentive-driven behavioural change."

  *   **Your Distinction is Real:** You are correctly isolating a distinct mechanism within the broader "when a measure becomes a target, it ceases to be a good measure" phenomenon.
      *   **Category 1 (Standard Goodhart):** The measure degrades because **agent behaviour changes** relative to the true goal in response to the incentive (gaming, effort substitution, cream-skimming).
      *   **Category 2 (Your Focus):** The measure degrades because **the measurement process itself changes** in response to the pressure for accurate/optimised numbers – rules tighten, definitions shift, data gets filtered – **without** agents changing their behaviour *towards the underlying goal*. The *meaning* or *capture* of the measure breaks.
  *   **Why it's not *just* measurement error:** While measurement error is involved, the *trigger* is critical. The degradation *would not have occurred* if the metric remained a quiet background statistic. The act of making it a target directly caused the change in measurement rules (the strict timestamp validation and exclusion policy) that corrupted the data stream. It's an *institutional/systemic* response to targeting, distinct from individual gaming or random drift.
  *   **Category of One?** No. Other examples exist:
      *   **Customer Support:** First Response Time (FRT) becomes a target. A new rule: *Only emails with specific keywords in the subject line are counted in FRT.* Agents don't change how they *handle* emails, but the *measured* FRT deteriorates as complex emails (often missing keywords) are excluded.
      *   **Manufacturing:** "Units Produced Per Hour" becomes a target. A new quality control rule: *Only units passing the final automated scan on the first attempt are counted as "produced" for the hourly rate.* Workers don't slow down, but minor, previously tolerated scan glitches now cause units to be excluded, lowering the reported rate. The *actual* output rate (including units needing a rescan) is stable.
  *   **The Crucial Difference:** In Category 2, the problem originates *upstream* from the frontline worker – in the rules defining what data is collected and how it's aggregated. The worker's core task execution remains aligned with the true goal. In Category 1, the problem originates *with* the frontline worker altering their task execution relative to the true goal.

  **Plain Language Summary for Your Talk:**

  > "We all know how people sometimes game the numbers. But there's another way metrics break when they become important. Picture this: A hospital ER tracked how fast patients saw a clinician. It was a good number. Then leadership put it on the big dashboard. **No doctor or nurse changed how they saw patients.** But because the number *mattered* now, bosses tightened the rules for *recording* that time. If the note wasn't written fast enough, that patient's wait time wasn't counted. Guess which wait times got excluded? The longer ones – where staff were busy helping sicker patients! So, the *average* of the times they *did* count went up. The dashboard showed things getting worse, but the *actual* care hadn't changed. The *measurement* broke because the number became a target, not the behaviour. To spot this, look for changes in *what data gets counted*, especially if long cases seem to vanish from the numbers."

  This example cleanly isolates the measurement-corruption mechanism triggered by targeting, distinct from behavioural gaming, meeting all your stringent criteria.
