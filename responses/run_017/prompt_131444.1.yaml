prompt: |-
  ok so I do evals at a mid-size lab, and we have the same argument about debate maybe once a week and it never goes anywhere because everyone just restates their prior louder. I want an actual number with the guts showing.

  The proposition: by 2033, debate-style protocols (two models argue for competing answers, a weaker judge or weaker models pick the winner) will be doing load-bearing oversight on at least one real high-stakes task where no single human reviewer could check the output directly. I'll count that as resolved if either (a) a frontier lab is using it as a real part of how some deployed high-stakes output gets signed off — not just in a paper, and not as a demo — or (b) a regulator, auditor or third-party accepts a debate transcript as part of the evidence trail for something that actually mattered. Two clean failure images for reference: signing off a 10k-line patch to a safety-critical control system, and auditing a messy epidemiology analysis where the underlying data sits behind a wall the judge can't see.

  Give me your credence, decomposed. The terms I want split out:

  1. The crux-localization condition: that judging *relative* answer quality stays reliable when absolute verification fails, i.e. that 'easier to compare two answers than produce one' survives when the disagreement is buried in step 140 of a 200-step chain.
  2. That there's a truth-favoring asymmetry at all — and please split the two stories people conflate: (a) lies cost more to defend because they need more consistent continuations, vs (b) errors are spot-checkable once someone points at them. I think these fail in different worlds: (a) dies if a model can spin a cheap internally-consistent fake world-model, (b) dies if the crux needs background the judge just doesn't have.
  3. That optimizing debaters against a fixed judge doesn't mostly buy you judge-exploitation instead of truth — call it rhetorical Goodhart. Concretely: 100k tokens each, shared tokenizer, and an incentive to smuggle coordination past the judge in the phrasing.
  4. That debate doesn't just get outcompeted by cheaper substitutes (better weak verifiers, recursive oversight chains, monitoring of long reasoning traces, whatever) — the 'nobody needed debate after all' term.
  5. That anyone actually ships it: regulatory demand for auditable oversight vs. labs not slowing down for anything.

  Then: numbers on each, one line of justification each, how you combine them (is it basically multiplicative, or is 4 a disjunction that rescues it?), and which term the final number swings most with. Also: which term are you least confident in, and what single experiment or empirical result would move it most? My number is 0.35, my colleague's is 0.7 — tell me where you think that disagreement actually lives.

  No citations or paper titles, I've read the stuff and I can't search from here anyway. And please don't spend more than a sentence on 'it depends what you mean by debate' — if you need to disambiguate, do it inside the decomposition.
