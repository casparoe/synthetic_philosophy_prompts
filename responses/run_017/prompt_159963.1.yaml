answer: |-
  Below is a comprehensive in-class activity designed to meet your goals, structured for a 90-minute seminar. The activity uses your symbol microdomain (•, ○, △, ✕, ★) and emphasizes conceptual slippage through structured ambiguity. Teams of 3–4 students work through problem rounds, with minimal instructor explanation until the debrief.

  ---

  ### **Rules, Roles, and Timeline** (Total: 90 min)  
  **Teams:** 3–4 teams (for 14 students).  
  **Materials:**  
  - Handout with symbols, ring order (• → △ → ✕ → ★ → ○ → •), and weight order (• < ○ < △ < ✕ < ★).  
  - Problem sheets (one per round).  
  - Perturbation cards (mid-activity).  
  - Whiteboard for scoring.  

  #### **Timeline**  
  1. **Introduction (5 min)**  
     - Assign teams, distribute handouts.  
     - *Instruction:* "You’ll solve analogy puzzles. Each problem gives a source string transformed to a target string. Then, you’ll transform a new source string using the same rule. There’s no single ‘right’ answer—aim for internal consistency."  

  2. **Round 0: Trivial Round (10 min)**  
     - **Problem:**  
       - Source pair: `• → •` → `△ → ?`  
       - New source: `✕ → ?`  
     - **Rules:** Teams submit answers. Correct answer (★) earns 1 point.  
     - *Why:* Everyone scores a point, building confidence. Both orders agree (✕ → ★).  

  3. **Round 1: First Ambiguity (15 min)**  
     - **Problem:**  
       - Source pair: `• ○ → • △`  
       - New source: `△ ★ → ?`  
     - **Rules:** Teams submit answers. No scoring yet—answers displayed anonymously.  
     - *Why:* Forces divergence (★ has no weight-successor; ring wraps to ○).  

  4. **Round 2: Group vs. Letter Change (20 min)**  
     - **Problem:**  
       - Source pair: `• ○ ○ → • △ △`  
       - New source: `★ ★ → ?`  
     - **Rules:** Teams submit answers. No scoring.  
     - *Why:* Tests if symbols change individually (★→○ per ring) or as a group (undefined).  

  5. **Round 3: Distribution Prediction (20 min)**  
     - **Problem:**  
       - Source pair: `✕ ★ → ✕ ○`  
       - New source: `○ ★ → ?`  
     - **Payoff Scheme:**  
       - Teams submit:  
         1. Their answer (e.g., `○ ○`).  
         2. A prediction of the room’s answers (e.g., "40% `○ ○`, 30% `★ •`, 20% `★ △`, 10% others").  
       - **Scoring:**  
         - 3 points if prediction matches the room’s *top 2 answers in order*.  
         - 1 point if only the top answer matches.  
         - *No points for answer correctness.*  
     - *Why:* Rewards reading peer reasoning; reveals clustered answers.  

  6. **Mid-Session Perturbation (10 min)**  
     - **Perturbation Card:** "New discovery: Weight order is invalid for ✕ and ★. Only • < ○ < △ remains."  
     - **Revisit:** Teams re-answer `△ ★ → ?` (from Round 1) and `★ ★ → ?` (from Round 2) with new constraints.  
     - *Why:* Removes "grip" for weight-based rules; forces slippage to ring or other strategies.  

  7. **Round 4: Build the Trap (10 min)**  
     - **Task:** Each team designs:  
       - A source string (e.g., `• ✕`).  
       - A rule (e.g., "Change heaviest symbol by weight-successor").  
       - Why this *forces a slip* (e.g., "Heaviest is ✕, but weight-successor undefined after perturbation").  
     - *Why:* Students articulate slippage pressure ("spirit of the rule" vs. "wriggling").  

  8. **Debrief (10 min)**  
     - **Guided Discussion:**  
       - *Round 0–1:* "Why did everyone agree at first? Where did splits emerge?" → **Symbol-level vs. contextual change.**  
       - *Round 2–3:* "Why did answers cluster despite ambiguity?" → **Pressures for consistency, minimal slippage.**  
       - *Perturbation:* "How did losing weight-order change your approach?" → **Concepts need ‘grip’; slippage isn’t arbitrary.**  
       - *Round 4:* "What made a slip feel ‘cheap’ vs. ‘acceptable’?" → **Cost of violating core vs. peripheral features.**  
     - **Final Question:** "Raise your hand if your initial view of ‘right vs. wrong rules’ shifted today. What changed?"  

  ---

  ### **Concrete Problem Set**  
  **Key for Candidate Descriptions:**  
  - **RS:** Ring-successor (symbol-level).  
  - **WS:** Weight-successor (symbol-level).  
  - **RM:** Change rightmost symbol only.  
  - **HV:** Change heaviest symbol only.  
  - **GRP:** Change entire run (group-level).  
  - **WRAP:** Allow ring-wrap (★ → ○).  
  - **NO-WRAP:** Reject wrap (e.g., ★ → "error").  

  | Round | Source Pair         | New Source | Candidate Answers (Predictions)                     | Purpose (Separates Descriptions)          |  
  |-------|---------------------|------------|-----------------------------------------------------|------------------------------------------|  
  | 0     | `• → •` → `△ → ?`  | `✕ → ?`    | ★ (RS/WS agree)                                     | Trivial consensus.                       |  
  | 1     | `• ○ → • △`        | `△ ★ → ?`  | `△ ○` (RS + WRAP), `△` (HV fail + delete), `△ •` (WS-wrap) | RS vs. WS; WRAP vs. NO-WRAP for ★.       |  
  | 2     | `• ○ ○ → • △ △`    | `★ ★ → ?`  | `○ ○` (RS per symbol), `○` (GRP to single), `★` (no-change) | Symbol-level (RS) vs. group-level (GRP). |  
  | 3     | `✕ ★ → ✕ ○`        | `○ ★ → ?`  | `○ ○` (RS + WRAP), `★ •` (RS on ○), `★ △` (WS on ○), `○ ★` (no-change) | RS vs. WS; RM vs. HV; WRAP cost.          |  

  **Perturbation Follow-Up:**  
  - `△ ★ → ?` → Now: `△ ○` (RS forced) or `△` (HV fail).  
  - `★ ★ → ?` → Now: `○ ○` (RS) or "error" (WS undefined).  

  ---

  ### **Payoff Scheme for Round 3**  
  - **Mechanics:**  
    - Teams predict the distribution of peer answers (e.g., "50% `○ ○`, 30% `★ •`, 20% `★ △`").  
    - Actual distribution calculated from team submissions (e.g., 3 teams → `○ ○`, 1 team → `★ •` = 75% `○ ○`, 25% `★ •`).  
  - **Scoring (No money needed):**  
    - 3 points: Top 2 answers in exact order (e.g., predicted `○ ○` then `★ •`, actual matches).  
    - 1 point: Correct top answer only.  
    - 0 points: Otherwise.  
  - **Why it works:** Incentivizes teams to model peer reasoning. Clustered answers (e.g., 75% `○ ○`) become visible on the board, showing structured ambiguity.  

  ---

  ### **Perturbation Design**  
  - **Card Text:** *"Revised Weight Order: Only •, ○, △ have weights (• < ○ < △). ✕ and ★ are weightless."*  
  - **Why:**  
    - ✕ and ★ lose weight-order "grip," forcing reliance on ring-order or deletion.  
    - Changes answers for ★-heavy strings (e.g., Round 1’s `△ ★`). Teams see how concepts depend on stable features.  

  ---

  ### **Trap-Building (Round 4)**  
  - **Example Trap:**  
    - Team’s rule: *"Change heaviest symbol by weight-successor."*  
    - Trap source: `△ ★` (post-perturbation).  
    - Why it slips: "Heaviest is △ (WS → ✕), but ✕ is weightless—rule ‘fails.’ Ad hoc fixes (e.g., use ring) break the rule’s spirit."  
  - **"Spirit of the Rule" Test:** Teams must define what counts as "wriggling" (e.g., switching orders mid-rule vs. graceful fallback).  

  ---

  ### **Debrief Mapping**  
  - **Conceptual Slippage:** Round 1 → "When WS failed for ★, you defaulted to RS (slippage)."  
  - **Levels of Description:** Round 2 → "Changing `★ ★` to `○ ○` treated symbols individually; `○` treated the run as a blob."  
  - **Pressures:** Round 3 → "Clustering happened because ditching the ring entirely felt ‘cheap,’ but skipping ★ did not."  
  - **Final Question:** *"In one sentence, how did this activity change your view of ‘finding the rule’?"*  

  ---

  ### **Predictable Challenges & Solutions**  
  1. **Someone spots the trick early:**  
     - *Solution:* Praise insight but delay discussion: "Interesting—let’s see if the group agrees later." Use their answer in Round 3 to show clustering.  

  2. **Team claims "no answer":**  
     - *Solution:* Legitimize it (e.g., "No-change is a valid choice"). In debrief, discuss why "no answer" feels costly vs. slipping.  

  3. **Two-order setup seen as gimmicky:**  
     - *Solution:* In debrief, analogize to real-world domains (e.g., "Like prioritizing time vs. cost in a decision").  

  4. **Tallying eats time:**  
     - *Solution:* Use rough percentages in Round 3 (e.g., "2/4 teams chose X"). Skip exact math; focus on clustering.  

  ---

  ### **What the Session Cannot Reproduce**  
  **You’ll need to explicitly note:**  
  - In classical models (e.g., ACME, Copycat), slippage is **subpersonal, stochastic, and gradient** (e.g., ring and weight compete probabilistically based on conceptual distance).  
  - Here, students **deliberately chose slips** and could justify them. Emphasize: Real analogy-making often involves unconscious competition between pressures (e.g., **accuracy vs. simplicity**), not conscious debate.  
  - **Bridge the gap:** In debrief, ask: *"Did your ‘slips’ feel intentional? How might a mind do this automatically?"*  

  ---

  This design ensures students experience ambiguity, clustering, and slippage before labeling it. The perturbation and trap-building force reflection on conceptual "grip," while the payoff scheme makes structured variation visible.
