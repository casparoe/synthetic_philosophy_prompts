  Then test the translation on a case I cannot place. A frozen accident such as the particular genetic code, or the universe's low-entropy initial condition, violates nothing in the underlying dynamics, yet it is not itself the output of any crane: it is handed to the process from outside the theory's explanatory reach. Is that a crane, a skyhook, or something the dichotomy has no room for — and is the law-versus-boundary-condition distinction doing work here that the biology vocabulary cannot do?

