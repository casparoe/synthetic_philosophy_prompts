  We are translating Dennett's philosophy of biology concepts into the vocabulary of condensed matter physics. We must be cautious not to smuggle in physics assumptions (like a well-defined microscopic layer, locality, weak coupling, clean decomposability) that might not hold in the biological context.

  Dennett's "cranes" and "skyhooks" as presented in "Darwin's Dangerous Idea":

  - Skyhook: an explanatory device that is imagined to lower design from above, i.e., an unexplained explainer that stops the regress of explanation by positing something that does not itself require explanation in the same terms (e.g., an intelligent designer, a miraculous event). It is top-down and not the product of the same bottom-up processes it is meant to explain.

  - Crane: a mechanism that does explanatory work by showing how complexity and design can arise from the bottom up, through processes that are themselves the result of the same kind of bottom-up processes. Cranes are built from the ground up and are part of the natural, mechanistic explanation (e.g., natural selection, genetic drift).

  Dennett also criticizes "greedy reductionism" as a form of reductionism that tries to explain phenomena at a level that is too low, skipping the intermediate levels of explanation that are necessary for a complete understanding. It is greedy because it attempts to jump directly to the lowest level without showing how the higher levels emerge.

  Translation into condensed matter physics vocabulary:

  - Skyhook: An explanation that invokes a principle or entity that is not part of the emergent, bottom-up dynamics of the system. It is an external input that is not itself explained by the fundamental laws and boundary conditions. (Example in physics: invoking a new fundamental force to explain a phenomenon without showing how it arises from known interactions.)

  - Crane: A mechanism that arises from the microscopic dynamics and boundary conditions, and that in turn plays a role in building higher levels of organization. It is an emergent structure that is both a product and a producer of the hierarchical organization. (Example: the formation of quasiparticles as effective degrees of freedom that then govern the behavior at a higher energy scale.)

  - Greedy reductionism: Attempting to explain a phenomenon by going directly to the fundamental microscopic theory without accounting for the renormalization-group flow, the emergence of new effective theories at intermediate scales, or the possibility of universality classes. It is greedy because it fails to recognize that the explanation at the microscopic level might be intractable and that the relevant physics at the scale of interest might be captured by an effective theory with its own degrees of freedom and laws.

  Now, caution about smuggling physics assumptions:

  - We must avoid assuming that the microscopic layer is well-defined and that there is a clean separation of scales. In biology, the levels might be more entangled.

  - We must avoid assuming locality and weak coupling, which are common in condensed matter but not necessarily in biology.

  - We must avoid assuming that the system is cleanly decomposable into independent levels.

  Case: frozen accident (e.g., the genetic code, or the low-entropy initial condition of the universe).

  - This is an accident that is fixed and then conditions the subsequent dynamics. It is consistent with the underlying laws but not determined by them. It is a boundary condition.

  In Dennett's terms:

  - Is it a crane? A crane is a mechanism that does design work and is built by the same process. The frozen accident is not a mechanism that does work; it is a condition that sets the stage. It is not built by the process but given.

  - Is it a skyhook? A skyhook is an unexplained explainer from above. The frozen accident is not an intelligent designer or a miracle; it is a contingent fact. It is not introduced to stop the regress but is a part of the boundary conditions.

  The dichotomy does not have a clear place for frozen accidents. They are not cranes because they are not mechanisms that do work; they are conditions. They are not skyhooks because they are not top-down interventions but rather initial conditions that are part of the natural setup.

  The law versus boundary condition distinction is crucial here. In physics, we distinguish between the dynamical laws (which are time-symmetric and deterministic/stochastic) and the boundary conditions (which break the symmetry and set the specific history). The frozen accident is a boundary condition.

  In biology, the genetic code is a frozen accident: it is a contingent fact that could have been otherwise, and once fixed, it conditions the evolution of life. It is not a skyhook because it is not an intelligent intervention, but it is also not a crane because it is not built by the evolutionary process (it is a precondition for that process as we know it). However, note that the fixation of the genetic code might itself be the result of an evolutionary process (a crane) that we don't fully understand. But if it is truly a frozen accident, then it is not explained by any crane but is just a given.

  In the case of the universe's low-entropy initial condition: it is a boundary condition, not a law. It is not a crane (it doesn't do design work) and not a skyhook (it is not an intelligent cause). It is a given.

