  ### Decision Tree for Theories of Consciousness

  **Starting Commitment:** There is a real difference between conscious and unconscious mental states, and the difference is natural and empirically tractable.

  #### Logical Space of Questions
  The tree uses five binary questions derived from concrete cases. Each branch is a yes/no response to a case description. The cases are:
  1. **Conceptless Creature (CC):** A creature (e.g., newborn, non-human animal) with no concepts for mental states is in pain. Is this pain conscious?
  2. **Knocked-out Channel (KC):** A subject has an intact first-order visual state (e.g., seeing red) but their introspective-reporting channel is knocked out (e.g., due to inhibition). Is the visual state still conscious?
  3. **Phantom Report (PR):** A subject's introspective channel fires and reports a state (e.g., "I see a red square"), but no matching first-order visual state exists (e.g., no retinal input or neural activity for red). Is there a conscious experience of a red square?
  4. **Bare Reporting System (BRS):** A system (e.g., simple machine) produces a first-person pain report ("I am in pain") but has no pain state or any other state "remotely like pain." Is this system conscious of pain?
  5. **Temporal Question (TQ):** A subject has a first-order state (e.g., pain) at time t1. At t2 (later), a higher-order state about the t1 state occurs, but no relevant higher-order state or disposition existed at t1. Did the t1 state become conscious at t1 due to the t2 state?

  Permitted combinations: All 32 combinations are logically possible, but many are ruled out by the tree due to incoherence or unattractiveness. The tree prioritizes discrimination over exhaustiveness, skipping redundant or non-discriminating questions.

  #### Decision Tree
  1. **CC: Is the conceptless creature's pain conscious?**
     - **Yes** → Go to 2.
     - **No** → Go to 3.

  2. **PR: Is there a conscious experience in the phantom report case?**
     - **Yes** → Leaf: **Unexplored view**. *Combination allows consciousness without first-order states (from PR) but also without concepts (from CC), implying consciousness can arise from higher-order states alone in conceptless creatures. No standard view holds this; it is unattractive due to overgeneration risks.*
     - **No** → Go to 4.

  3. **TQ: Can a later higher-order state make an earlier first-order state have been conscious?**
     - **Yes** → Leaf: **Unattractive retroactive view**. *Combination allows consciousness to be conferred retroactively without a simultaneous state/disposition. No standard view holds this; it is incoherent with the simultaneity required for naturalistic accounts.*
     - **No** → Go to 5.

  4. **KC: Is the visual state conscious when the introspective channel is knocked out?**  
     *Note: A "no" to CC and "no" to PR already imply higher-order dependence, so "yes" here creates inconsistency.*
     - **Yes** → Leaf: **Incoherent**. *Contradicts CC: if conceptless creatures (which lack higher-order states) are unconscious, then states without higher-order access (as in KC) cannot be conscious.*
     - **No** → Leaf: **First-order representationalism (FOR) or same-order representationalism**. *FOR (e.g., Dretske) says consciousness depends only on first-order states; same-order views (e.g., Kriegel) say a state is conscious due to intrinsic self-representation. Cases cannot discriminate them: both require first-order states (NO to PR, NO to BRS), allow consciousness without concepts (YES to CC), and reject higher-order dependence (NO to KC forced by tree path).*

  5. **PR: Is there a conscious experience in the phantom report case?**
     - **Yes** → Leaf: **Actualist thought-based higher-order theory (HOT)**. *E.g., Rosenthal. Allows misrepresentation: higher-order thoughts (HOTs) create consciousness even without first-order states (YES to PR). Requires simultaneous actual HOTs (NO to TQ), so conceptless creatures lack consciousness (NO to CC).*
     - **No** → Go to 6.

  6. **BRS: Is the bare reporting system conscious of pain?**
     - **Yes** → Leaf: **Incoherent**. *Contradicts NO to PR: consciousness requires a first-order state, but BRS has none.*
     - **No** → Leaf: **Dispositionalist higher-order theory (HOT)**. *E.g., Carruthers. Dispositions for HOTs confer consciousness, not actual HOTs. Rejects misrepresentation (NO to PR) and retroactivity (NO to TQ). Conceptless creatures lack dispositions for HOTs (NO to CC).*

  #### Empty Cells and Notes
  - **Global workspace/global state views:** Not cleanly captured. They typically fall under FOR or same-order (if first-order states become conscious via global availability) but could be stretched to dispositionalist HOT if availability is seen as a disposition for HOTs. Cases do not discriminate them from FOR/same-order.
  - **Perception-based (HOP) views:** Not discriminated. HOP (e.g., Lycan) resembles HOT but with quasi-perceptual higher-order states. It typically answers like HOT (NO to CC, YES/NO to PR debated), so the tree groups it under HOT leaves. No case separates it.
  - **Unexplored/unattractive cells:** Marked in the tree. For example, YES to TQ is unattractive; YES to CC and YES to PR is unexplored.
  - **Extrapolations:** 
    - The tree assumes KC forces "no" in higher-order branches (due to NO to CC); this is dialectically settled.
    - Grouping FOR and same-order is extrapolated; they are often distinguished by intrinsic structure, but cases do not probe this.
    - Dispositionalism is separated from actualism by PR and TQ; this is contested (e.g., whether dispositions allow misrepresentation is debated).

  #### Running the Tree for the Respondent
  - **CC: Yes** → Go to 2.
  - **PR: Yes** → Leaf: **Unexplored view**.  
    *Respondent's other answers (KC: No, BRS: No, TQ: Yes) are consistent with this leaf: KC "no" implies higher-order dependence, but CC "yes" contradicts it unless a non-standard mechanism is posited. TQ "yes" is unused in this path but aligns with retroactivity, reinforcing unattractiveness.*

  **Final Answer**  
  \answer{Unexplored}
