  | A symbol is grounded only if there is a causal-perceptual loop: the thing the symbol is about must be able to kick back and cause the system to revise its use of the symbol. Without such a loop, the system is ungrounded and merely a syntactic engine. | A symbol is grounded only if the system using it is answerable to a community of users: it must be able to go on correctly in new cases and be corrected when it errs. Without such accountability, the system is ungrounded and cannot possess meaning. |

