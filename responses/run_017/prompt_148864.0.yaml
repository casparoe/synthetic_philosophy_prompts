  1. Agreed Claims: A numbered list of claims both accept about ungrounded symbol manipulation, the dictionary-regress worry, and requirements for a successful account.
  2. Disagreements Table: The residual disagreement, each stated in their own terms.
  3. Cruxes: Sub-questions that, if settled, would move at least one of them. For each crux, a concrete case (from the provided list) that bears on it, and each one's prediction for that case.

  The cases to use are:

  1. Orphan Corpus
  2. Proxy Grounding
  3. One-Shot Anchoring
  4. Mediated Anchoring
  5. Deferred Grounding

  We must avoid citations and keep the voice flat and tired.

  Let's structure the document:

  **Agreed Claims**

  1. Both agree that ungrounded symbol manipulation occurs when symbols are manipulated without any connection to the things they are supposed to be about, leading to a system that is merely syntactic.
  2. Both agree that the dictionary-regress worry is real: if all symbols are defined only by other symbols, then the entire system floats without reference to the world, and meaning is not established.
  3. Both agree that a successful account of meaning must avoid this regress and must explain how symbols can be about things in the world.
  4. Both agree that a system that cannot be corrected by the world (or by others, in the case of Teodor) is deficient in a way that prevents genuine meaning.
  5. Both agree that the symbol grounding problem is the problem of how symbols get their meaning from something non-symbolic.

  **Disagreements**

  Bruna's view: Meaning requires a causal-perceptual loop where the thing the symbol is about can kick back and cause the system to revise its symbol use. Without such a loop, the system is ungrounded and merely syntactic.

  Teodor's view: Meaning requires being answerable to other users, being able to go on correctly in new cases and being corrected when wrong. Without a community of users to hold one accountable, the system is ungrounded and cannot have genuine meaning.

  **Cruxes**

  We need to identify sub-questions (cruxes) that, if resolved, would shift the disagreement. Then, for each crux, assign one of the five cases and state what each would predict.

  Possible cruxes:

  A. **Is a system that operates in complete isolation (with no other agents) capable of having grounded symbols?**
     - Case: Orphan Corpus (1)
     - Bruna's prediction: The orphan corpus system is ungrounded because it has no causal-perceptual loop with the world; it only has text.
     - Teodor's prediction: The orphan corpus system is ungrounded because it has no one to answer to; it cannot be corrected by a community.

  B. **Can a simulation provide the necessary contact with the world for grounding?**
     - Case: Proxy Grounding (2)
     - Bruna's prediction: The system in the ship simulation is grounded because the simulation provides a causal-perceptual loop (even if simulated) that can kick back and force revisions.
     - Teodor's prediction: The system is ungrounded because it is not answerable to other users; it only interacts with a simulated environment, not a community.

  C. **Does a one-time anchoring event, without ongoing regulation, establish a lasting link?**
     - Case: One-Shot Anchoring (3)
     - Bruna's prediction: Without ongoing causal-perceptual regulation, the link decays and becomes ungrounded (or never was grounded because it wasn't maintained by the world kicking back).
     - Teodor's prediction: The link was never properly grounded because grounding requires ongoing accountability to others, which was absent.

  D. **Can grounding be achieved through an intermediary agent?**
     - Case: Mediated Anchoring (4)
     - Bruna's prediction: The system is not grounded because it doesn't have direct causal-perceptual contact; it only has mediated contact. The intermediary has the loop, not the system.
     - Teodor's prediction: The system can be grounded because it is answerable to the human intermediary, who can correct it and with whom it can coordinate.

  E. **Can grounding be established retroactively?**
     - Case: Deferred Grounding (5)
     - Bruna's prediction: The orphan corpus system becomes grounded only when it is connected to a causal-perceptual loop (via the community using it in the greenhouse). Before that, it was ungrounded.
     - Teodor's prediction: The system becomes grounded when it is adopted by a community and becomes answerable to them. Before that, it was ungrounded.

  But note: For Deferred Grounding (5), both might agree that it becomes grounded at the time of adoption, but they disagree on why and what that implies about the past. However, for Bruna, the past state remains ungrounded because there was no loop then. For Teodor, the past state was ungrounded because there was no community then. The retroactive part is tricky: does the grounding change the past state? Probably not, but they might disagree on what we should say about the past state in light of the present grounding.

  We'll structure the cruxes as:

  Crux 1: Case 1 (Orphan Corpus) - Question: Can a system that operates in isolation (without a community or a causal-perceptual loop) have grounded symbols?
  Crux 2: Case 2 (Proxy Grounding) - Question: Can a simulation provide the necessary contact for grounding?
  Crux 3: Case 3 (One-Shot Anchoring) - Question: Does a one-time anchoring event, without subsequent regulation, establish a lasting grounded link?
