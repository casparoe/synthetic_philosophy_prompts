  Hi — I write novels rather than philosophy papers, so sorry in advance if I mangle the vocabulary. I'm about two thirds of the way into a book set largely on a converted grain barge that a small foundation has parked in a river delta as a field station for two people who cannot stand each other's answer to the same question. One of them, Bruna, builds fruit-picking rigs: she thinks a symbol means something only if the world can kick back at you, i.e. only if there's a causal-perceptual loop in which the thing the symbol is about can make the system revise its use of it, and she thinks everything else is just a dictionary chasing its own tail. The other, Teodor, is a philologist who has spent eleven years on a language with no living speakers and no bilingual texts: he thinks meaning is a matter of being answerable to other users, of being able to go on correctly in new cases and be corrected when you don't, and he thinks a robot with a camera and no one to answer to is just a very expensive thermometer. They're stuck on the barge during a four-day power cut, and my plot needs them to produce a document — so I need it to actually exist. What I'm asking you for is the joint statement these two could both sign after a good-faith adversarial collaboration about the symbol grounding problem: the claims both accept (about what ungrounded symbol manipulation looks like, about why the dictionary-regress worry is real, about what a successful account would have to deliver); then the exact residual disagreement, phrased once in wording Bruna would accept for her own view and once in wording Teodor would accept for his; then the real cruxes, the sub-questions where settling one would move at least one of them; and for each crux one concrete case both of them would agree bears on it, with each one's prediction written down before the fact. Format it as a numbered agreed-claims section followed by a disagreements table.

  The reason I can't just write this myself is that I need the cruxes to be tested against some cases I've invented for the book, and I don't trust myself to say anything sharp about them. Please build the document around these, and don't swap them out for the usual textbook examples: (1) the orphan corpus — Teodor's language, a system trained on every surviving page of it, which produces fluent continuations and gets its case endings right but has no one to be wrong in front of; is it ungrounded, or is ungrounded the wrong word for what's wrong with it? (2) proxy grounding — a system that learns its whole vocabulary inside an extremely high-fidelity simulation of a sailing ship, with real rope physics and real wind, and is never once connected to a harbour; is contact with simulated things a kind of contact? (3) one-shot anchoring without tethering — a robot shown a single labelled example of a tool and then left alone for a decade with no correction, so that whatever link existed was never regulated by anything afterwards; does the link survive, decay, or was it never the right kind of link? (4) mediated anchoring — a text-only system that can ask a human to point, look, or press, so all its contact with the world runs through another agent who already has it; does borrowing someone's loop ground you or just make you a very polite passenger? (5) deferred grounding — the orphan-corpus system, years later, adopted by a community of learners who revive the language and start using it to argue about their greenhouse; does its vocabulary become grounded retroactively, and if so does that change what it was doing before? If you think part of the fight between Bruna and Teodor is purely about what the word grounded ought to be reserved for, say which part and why, in terms my readers will follow. And please: no citations, no footnotes, no reading suggestions — there's no library on the barge, and if they start naming papers the scene dies. Keep the voice flat and a bit tired, like two people writing at two in the morning who'd still sign it in daylight.
