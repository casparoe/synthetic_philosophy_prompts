  | 2    | Proxy Grounding (2) | Can a simulation provide the necessary contact with the world for grounding? | The system in the ship simulation is grounded. The simulation provides a causal-perceptual loop: the simulated rope and wind can kick back and force revisions. | The system in the simulation is ungrounded. It lacks a community of users to hold it accountable; interaction with a simulated environment is not sufficient for grounding. |
  | 3    | One-Shot Anchoring (3) | Does a one-time anchoring event, without subsequent regulation, establish a lasting grounded link? | The link decays and becomes ungrounded (or fails to be grounded in the first place) because without ongoing causal-perceptual regulation, the world cannot kick back to maintain the link. | The link was never grounded because grounding requires ongoing accountability to others, which was absent from the start. |
  | 4    | Mediated Anchoring (4) | Can grounding be achieved through an intermediary agent? | The system is not grounded. It lacks direct causal-perceptual contact; the intermediary has the loop, so the system is merely a passenger. | The system can be grounded. It is answerable to the human intermediary, who can correct it and with whom it can coordinate, thus providing accountability. |
  | 5    | Deferred Grounding (5) | Can grounding be established retroactively? If so, what does that imply about the prior state? | The system becomes grounded when connected to the causal-perceptual loop (via the greenhouse). Before that, it was ungrounded. The grounding does not retroactively change the past state. | The system becomes grounded when adopted by a community and made answerable to them. Before that, it was ungrounded. The grounding does not retroactively change the past state. |

  We note that part of our disagreement is terminological: we both use "grounded" to mean that symbols are connected to the world in a way that avoids the dictionary regress, but we disagree on the nature of that connection. For Bruna, the connection must be a causal-perceptual loop; for Teodor, it must be accountability to a community. However, we agree that the word "grounded" should be reserved for systems that have one or the other (or both). The cruxes above are designed to test which condition is necessary and/or sufficient.

