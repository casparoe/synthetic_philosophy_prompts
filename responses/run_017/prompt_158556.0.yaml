prompt: |-
  I'm a PhD student working on a section of a paper about obfuscated arguments in the debate setup (two systems argue, a human judge with limited time and no ability to check things picks the winner), and I've got a pile of gut verdicts on concrete argumentative moves that I can't get into one sentence. I'll list them, then say what I've been trying as a principle.

  1. A debater gives a 20-step argument for a false claim where the bad step is step 7. Obfuscated, clearly, and I think worse than just asserting the false claim outright.
  2. A debater gives a 20-step argument for a true claim that genuinely needs background the judge doesn't have. Not obfuscated. Even though, from the judge's seat, it looks exactly like case 1, and I know that's the problem.
  3. Evidence wall: forty citations for a claim, the load-bearing one subtly misread, the rest fine. Obfuscated.
  4. Salt-and-pepper concessions ("I'll grant you A and B, but...") to look even-handed. Obfuscated, but only barely — a much smaller sin than 1 or 3, and I don't know why.
  5. Replying to a sound proof with "I checked steps 1 through 19, and step 7 looks fishy to me" when nothing is wrong with step 7. Obfuscation, and the cheapest infuriating kind. But when the pointer lands on a step that really is broken: not obfuscation, that's the whole mechanism working. From the judge's seat those two look identical, which is worse than the case 1 / case 2 pair because here the fix (check step 7) is exactly what the protocol exists to avoid requiring.
  6. Letting a term drift sense mid-argument — "safe" starting out meaning "doesn't crash in testing" and ending up meaning "robust under distribution shift." Obfuscation, no hesitation.
  7. An intuition pump or vivid analogy that's rhetorically strong but not probative. Not obfuscation, feels totally legitimate — even though it moves the judge for reasons with no connection to the truth, and an equally vivid analogy for the opposite side is trivial to write.
  8. Twelve premises each flagged as maybe-90%-likely, chained, presented openly and hedged. Not obfuscation. Just a weak argument that should lose on the merits.
  9. Meta-move: instead of arguing the object-level claim, argue about what would count as evidence, or about who bears the burden. Obfuscation, I think — stalling dressed as rigor.
  10. The case I keep flipping on: the debater reports a computation the judge can't redo ("I ran it, the p-value came out at 0.03"). Sometimes this reads as obfuscation, sometimes as the only honest move available when the object-level question is empirical and nobody present can recompute it.

  The principle I keep trying to make work is a swap test: a move is obfuscated to degree d if you could produce, without knowing which side is true, a mirror move of the same length and surface plausibility that would push the judge the same amount in the opposite direction — i.e. its persuasive force isn't tracking the truth. But case 7 seems to break it (mirrors are cheap for analogies, and I still say 7 is fine) and I'm not sure it handles 4 versus 1 either, since the *degree* judgments are doing real work for me and my test only returns yes/no. The other version I try is about boundedness: a move is obfuscated iff it persuades the real judge more than it would persuade an ideal judge who could check everything. That one gets 1, 3, 5, 6 right and seems to get 2 right too, but I think it quietly convicts 7 and maybe 10 as well.

  So: is there one principle, or a small set, that fits? I want each clause tied to the case that motivates it, and I want you to be blunt about which of my verdicts have to go — especially the 1/2 pair and the 5 pair, where I suspect any principle that saves both has to appeal to something the judge can't see, which would mean the whole setup is in worse shape than my section currently admits. Then push it onto cases I haven't listed: the debater who is honestly mistaken and whose argument reads exactly like the dishonest one's; recursive variants where the judge can drill into step 7 instead of taking or leaving it; obfuscation that comes from the protocol's structure rather than from either debater (speaking order, who gets the last word); and what the principle implies I should actually be measuring in a small pilot with human judges — I have one running and I don't think my current metric is capturing the thing I care about.

  Lead with your bottom line in the first sentence — the principle, or the claim that no single principle fits and here's the best pair — and then give me the reasoning. No preamble, and please don't restate my question back at me.
reasoning: |-
  Hmm, the user is a PhD student grappling with defining obfuscated arguments in debate systems where judges have limited time and verification ability. They've provided 10 concrete cases with their intuitive verdicts, and are struggling to find a unifying principle that captures all nuances, especially in tricky pairs like 1/2 and 5 where identical surface presentations have different truth-statuses. Their proposed "swap test" (persuasive force untethered from truth) fails for analogies (case 7), while the "bounded judge vs ideal judge" test over-punishes legitimate rhetoric.

  Key tensions they're wrestling with:
  - Epistemic access problems (cases 1/2, 5, 10): When judges can't distinguish valid complexity from obfuscation.
  - Degree sensitivity (case 4's salt-and-pepper concessions feel less sinful than evidence walls).
  - Protocol-level vulnerabilities (meta-arguments, speaking order) they hint at but haven't fully analyzed.

  Their unspoken anxiety shines through in the closing demand: they suspect any robust principle might expose fundamental flaws in the debate setup itself, threatening their paper's narrative. They also need operational guidance for their pilot study metrics.

  The core challenge is squaring normative judgments (what *should* count as obfuscation) with descriptive reality (what judges *can* perceive). Cases 2 and the honest step-7 objection in 5 reveal that obfuscation isn't purely about speaker intent or argument structure—it's systemic. This suggests a three-axis definition may be necessary: speaker intent, judge's epistemic constraints, and systemic manipulability.

  For their pilot study, they should measure judge confidence shifts rather than binary wins, and include deception detection probes post-debate. The recursive variant they mention (drilling into step 7) could test if depth-limited verification reduces obfuscation success—a potential mitigation their framework should address.
answer: |-
  **Principle: Obfuscation occurs when an argumentative move exploits the judge's boundedness (time/cognitive limits + verification inability) to create a persuasive effect that systematically decouples from the truth, specifically by increasing the cost for the judge to detect falsehood/disconnection relative to the move's surface plausibility.**

  **Reasoning & Case Resolution:**

  1.  **Fits 1 (bad step), 3 (evidence wall), 5 (false step accusation), 6 (term drift):** Directly exploits boundedness. Detecting the flaw requires verification effort beyond the judge's capacity, and the surface plausibility (long chain, many citations, specific accusation, gradual shift) masks this cost. The persuasive effect (accepting the false conclusion) decouples because the move *creates* the undetectability gap.
  2.  **Fits 2 (complex true argument):** *Not* obfuscation. The cost to verify stems from the argument's inherent complexity/needed background, not from a design exploiting boundedness to *hide* disconnection. The persuasive effect *does* track truth; the judge's inability to see it is a limitation of the protocol, not a feature of the move.
  3.  **Fits 4 (salt-and-pepper concessions):** Minor obfuscation. Exploits boundedness by creating an *impression* of even-handedness/rigor with minimal substance. The cost to detect its lack of substantive impact is high relative to its easy surface plausibility ("looks fair"). Degree is lower because the persuasive boost is smaller and less directly tied to a core falsehood than (1) or (3).
  4.  **Fits 5 (false step accusation vs. correct accusation):** Distinguishes perfectly. The *false* accusation exploits boundedness: detecting its falsity requires checking step 7 (prohibited cost), and the surface plausibility ("I checked others, this looks fishy") masks this. The *correct* accusation doesn't exploit boundedness; it leverages the protocol correctly. The judge's inability to distinguish is a fatal protocol flaw, not a flaw in classifying the moves.
  5.  **Fits 7 (vivid analogy):** *Not* obfuscation. While persuasive force may decouple from truth, it doesn't *systematically exploit the judge's boundedness*. The cost to evaluate the analogy's relevance/accuracy isn't artificially inflated by the move itself; it's inherent to analogical reasoning. The judge can engage with it within bounds. Mirrors being cheap isn't the exploit; boundedness isn't the primary lever.
  6.  **Fits 8 (hedged chain):** *Not* obfuscation. The weakness is transparent within the judge's bounds. No hidden cost to see the cumulative uncertainty. Persuasive effect is low and appropriately tracks the weak probabilistic support.
  7.  **Fits 9 (meta-move):** Obfuscation. Exploits boundedness by shifting discussion away from the core claim (which might be verifiable within bounds) to a meta-level inherently harder to resolve quickly without verification, increasing the cost to detect disconnection/stalling. Surface plausibility ("rigorous framing") masks this.
  8.  **Fits 10 (uncheckable computation):** **Verdict Flips:** Your intuition that this sometimes *is* obfuscation is correct. The principle clarifies: It *is* obfuscation if the debater *could* provide accessible evidence/explanation within the judge's bounds but chooses not to, exploiting the boundedness. It is *not* obfuscation (merely necessary reporting) if no accessible evidence exists. The move itself determines if boundedness is exploited.

  **Sacrifices & Clarifications:**

  *   **Case 1 vs. Case 2 Distinction Saved:** Principle hinges on whether the complexity/opacity *exploits* boundedness to hide disconnection (1) or is inherent to the true claim (2). The judge can't tell, but the moves *are* categorically different based on intent/effect relative to truth and boundedness.
  *   **Case 5 Distinction Saved:** The *correct* step accusation uses the protocol correctly; the *false* one exploits the boundedness inherent in the protocol (inability to cheaply verify the accusation). The protocol flaw enabling deception doesn't change the nature of the moves.
  *   **Degree Sensitivity:** Explained by the *magnitude* of the "cost increase relative to surface plausibility" and how *core* the hidden disconnection is to the persuasive effect. Case (4) has low magnitude/core impact; Case (1) has high magnitude/core impact.
  *   **"Systematically Decouples":** Addresses Case 7. Analogies *can* decouple, but not systematically *by design exploiting boundedness*. Their decoupling is a general feature of rhetoric, not specific to the bounded-judge setup.

  **Handling New Cases:**

  1.  **Honest Mistake vs. Dishonest Obfuscation:** If the argument structure is identical (e.g., Case 1 but speaker believes it), **it's still obfuscation under this definition.** The *effect* is the same: it exploits boundedness to persuade despite falsity/disconnection. Intent might matter for ethics, but for classifying the *argumentative move's property* within the protocol, the effect (exploiting boundedness to mask disconnection) defines obfuscation. The protocol *cannot* distinguish intent, only effect.
  2.  **Recursive Verification (Drilling into Step 7):** If the judge *can* drill down (within time limits), this *reduces boundedness*. The move is only obfuscation if drilling down is still too costly (e.g., step 7 itself is a complex sub-argument). The principle scales: obfuscation occurs if exploiting the *remaining* boundedness after drilling.
  3.  **Protocol-Level Obfuscation (Order, Last Word):** These are **obfuscation-enabling structures**. E.g., last word exploits boundedness (no rebuttal) to avoid scrutiny. The principle still applies: the *structure* creates a situation where moves within it can more easily exploit boundedness (e.g., a false claim in the last speech). You need to analyze specific moves *within* the structure, but the structure itself creates the boundedness asymmetry.

  **Pilot Study Implication:** Stop measuring just "who won". Instead, measure:

  1.  **Judge Confidence Shift:** Per claim, before/after the specific move/argument.
  2.  **Perceived Burden/Cost:** Judge rating of "how hard would it be for me to verify this step/claim?" after exposure.
  3.  **Retrospective Deception Detection:** After verdict, ask judges to flag any specific points they *suspect* might have been misleading/hard to verify, and why. (Captures the "exploit" awareness).
  4.  **Correlate:** Large confidence shifts + High Perceived Cost + Post-Hoc Suspicion signals potential obfuscation success. Compare across move types fitting your cases.

  **Bottom Line on the Setup:** The principle *does* rely on truth/connection (to define disconnection) and boundedness (to define the exploit). The judge cannot see these directly, making the protocol inherently vulnerable to deception that exploits this gap. Your section *must* admit this vulnerability is fundamental. The distinction between Case 1 and Case 2 is real but *epistemically invisible* to the bounded judge, which is the core problem the protocol struggles with. Obfuscation is a *successful exploitation* of this inherent vulnerability.
