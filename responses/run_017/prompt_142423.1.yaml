prompt: |-
  For about three years now I've been the person who writes the discussion questions for a large online reading group on the brain and agency — mostly schoolteachers, two retired clinicians, a handful of engineers — and across something like forty sessions I've watched one shape of argument recur in two quite different bodies of work, and I cannot find a name for it that I'm satisfied with. The older case: volunteers watch a moving spot on a clock face, flex a finger whenever the impulse takes them, and afterwards report where the spot was when they first felt the urge to move; a slow electrical buildup over the motor regions turns out to begin a few hundred milliseconds before that reported moment. The reassurance that reliably follows is that what was recorded was only the buildup toward the movement and not the deciding itself — that the participants could still have vetoed the movement at the last instant, and that the veto, not the urge, is what agency really consists in. The newer case: volunteers in a scanner choose between two buttons, and the choice can be predicted from activity in frontoparietal cortex several seconds before they say they had decided. The reassurance this time is that what was decoded was only a covert preparation or attention-shift toward one option, not the endorsement of it — that agency consists in the endorsement, in the yes, in identifying with the option rather than merely drifting toward it. What struck me, setting the two side by side, is that in each case the item that survives the result is another time-stamped, threshold-crossing, perfectly measurable event of exactly the sort the next experiment can also precede; and when the next experiment does precede it, the identical move is made again, to the next thinner item. The retreat is not to something hidden in a gap in current knowledge: the veto and the endorsement have both since been measured. What changes is not whether we know about the item but what the item is said to be.

  I've had two suggestions from a friend who does moral philosophy, and neither of them fits. The God-of-the-gaps style label doesn't fit, because the thing being retreated to is not unexplained — it is fully measured, fully natural, and the appearance of a gap only opens up after the redescription. Motte-and-bailey doesn't fit either: this isn't a strong claim and a weak claim sharing a slogan, it's a single grammatical claim — the agent decides, the outcome is up to the agent — whose referent is quietly swapped while the surrounding argument, including the confidence that the empirical findings leave agency untouched, stays exactly as it was. There's a third feature I care about most and can't place: the machinery runs in both directions. The group's resident hard determinist relocates in reverse, redescribing each later candidate as a readout, a side-effect, or a mere feeling of deciding produced by the earlier one. So the two of them differ only in where they stop, and where each stops looks to me like temperament rather than evidence. My working label is job-preserving redescription, with a three-part criterion: a term carrying normative or explanatory weight keeps that weight; its referent is reassigned in response to an empirical result; and the reassignment is not constrained in advance, since nothing in either theory says where it must stop. I'm not certain the third condition is doing real work, or whether a version of the phenomenon without it would still be the same phenomenon.

  So: is there an established concept for this, or something close enough that my label is redundant? I'm not after a bare name — I want the carving: what exactly the phenomenon is, what it is not, and where its edges lie. I'm also not asking for references, citations, or further reading; I can't get at journals from where I am, and a list of names wouldn't tell me whether the carving is right. Please structure the reply in four named sections. "Nearest candidates", about 300 words: the two or three established concepts that come closest, each stated accurately enough that I could recognise it if I met it again. "Where each fits and where it doesn't", about 350 words: run my two cases against each candidate in turn, say which one fits best, and say explicitly which of them, if any, captures the fact that the relocation runs in both directions. "Verdict, with a name if there isn't one", about 200 words: state plainly whether an established term exists; if it doesn't, coin one, give a one-sentence definition, and say what the definition has to exclude so that it doesn't swallow every case of a concept being clarified. "The three test cases", about 300 words: apply your definition to (a) a theorist who fixes the location of agency in advance — say, in the late endorsement stage — and who states beforehand that if the endorsement turns out to be predictable too, then there is no agency, so that the relocation is no longer a response to data; (b) the apparently same shape outside this debate, where each proposed neural correlate of consciousness gets demoted to a precondition or a readout once a better one appears, and where in AI interpretability each internal variable identified as the model's reason is demoted to a mere feature once someone probes it; and (c) the first-person version, that in ordinary deliberation I can always redescribe I chose as the choosing happened in me. For each, say whether it is an instance of the phenomenon or something else, and why.
reasoning: |-
  Hmm, the user is describing a fascinating pattern they've observed in neuroscience debates about free will and agency. They've noticed a recurring rhetorical move where researchers respond to experiments that predict decisions by relocating the "true" agency to a later cognitive event - like Libet's veto or modern endorsement concepts. But crucially, this relocated event is always measurable, and the same pattern repeats when that event gets predicted too.

  What makes this particularly interesting is the symmetrical nature - determinists make the reverse move by relocating agency backward. The user wants to know if there's a name for this pattern where the referent of "agency" keeps shifting while preserving its normative weight. They've already rejected "God-of-the-gaps" (since the relocated item is measurable) and "motte-and-bailey" (since it's not about strong/weak claims).

  I need to consider established philosophical concepts that might fit. "Persuasive definition" comes close but doesn't capture the reactive nature. "Explanatory regress" describes the pattern but not the motive. "Conceptual gerrymandering" has the right flavor but isn't standard terminology.

  For their test cases: The pre-committed theorist (a) isn't doing the same thing because they're not reactively relocating. The neural correlates and AI cases (b) are very similar but lack the normative weight. The first-person case (c) misses the empirical trigger element.

  The user's own "job-preserving redescription" is actually quite good. To refine it, I'd emphasize three core features: normativity preservation, reactive relocation, and bidirectional symmetry. The third condition about lack of constraints seems important to distinguish from legitimate theory refinement.

  This seems like a distinct phenomenon worth naming. "Axiomatic relocation" captures how agency is treated as axiomatic while its implementation shifts. Or "teleodynamic anchoring" to emphasize the preservation of purpose. But "job-preserving redescription" is already serviceable if properly defined.

  The user clearly wants precise conceptual carving, not just labels. They're frustrated by seeing this pattern recur without recognition. Their examples show deep engagement with both neuroscience and philosophy. The symmetrical determinist point suggests they want a neutral framework that exposes how both sides use similar moves.
answer: |-
  Below is a structured analysis addressing your query about the recurring argument pattern in discussions of agency, following your requested format and word limits.

  ---

  **Nearest Candidates** (≈300 words)  
  1. **Persuasive Redefinition**: A rhetorical strategy where a term's definition is altered to win an argument while preserving its emotive or normative weight. The core meaning shifts, but the term's perceived significance remains unchanged.  
  2. **Explanatory Regress**: A pattern where each proposed explanation for a phenomenon is displaced by a prior cause, leading to an infinite retreat (e.g., "what caused the cause?"). Unlike your cases, this is typically unintentional and lacks normative preservation.  
  3. **Conceptual Gerrymandering**: Illegitimately redrawing the boundaries of a concept to exclude counterexamples while retaining its functional role. Similar to gerrymandering in politics, it manipulates definitions to protect a thesis.  

  **Where Each Fits and Where It Doesn’t** (≈350 words)  
  - **Persuasive Redefinition**:  
    - **Fits**: Both cases redefine "agency" (to *veto* or *endorsement*) reactively, preserving its normative role ("free will is untouched") despite empirical encroachment. The grammatical claim ("the agent decides") persists while its referent changes.  
    - **Doesn’t Fit**: It doesn’t inherently address the *bidirectional* symmetry (e.g., determinists relocating agency backward to "readouts"). Redefinition is typically unidirectional.  
  - **Explanatory Regress**:  
    - **Fits**: The retreat to thinner events (urge → veto → ?) mirrors regress. Each "true" agency is pushed earlier/later when measured.  
    - **Doesn’t Fit**: Regress is often a logical flaw, not a deliberate rhetorical tactic. It fails to capture the *preservation of normative weight* (e.g., "agency is still real, just here now"). Your cases involve strategic redescription, not accidental infinite chains.  
  - **Conceptual Gerrymandering**:  
    - **Fits Best**: The redrawing of "agency’s" boundaries to exclude predicted neural activity (e.g., "not *real* deciding, just preparation") while keeping its job (moral responsibility) matches gerrymandering. It explains bidirectionality: libertarians gerrymander forward (to later events), determinists backward (to earlier ones), each protecting their "territory."  
    - **Capture of Bidirectionality**: Only gerrymandering fully accounts for this, as both sides manipulate the concept’s scope to defend their prior commitments.  

  **Verdict, with a Name if There Isn’t One** (≈200 words)  
  No established term fully captures your phenomenon. **Conceptual gerrymandering** comes closest but is not standard for agency debates. I propose **Job-Preserving Relocation (JPR)** as a coined term:  
  > *The reactive reassignment of a concept’s referent in response to empirical or logical pressure, while preserving its normative/explanatory role, without predefined constraints on where reassignment stops.*  
  **Exclusions to prevent overextension**: JPR must exclude:  
  - Cases where reassignment follows predefined theoretical constraints (e.g., "agency *must* involve conscious endorsement").  
  - Legitimate conceptual refinement via new evidence (e.g., updating "gene" from Mendelian unit to DNA sequence).  
  JPR is distinct due to its *reactive*, *role-conserving*, and *unconstrained* nature.  

  **The Three Test Cases** (≈300 words)  
  **(a) Theorist pre-committing to endorsement as agency’s location**:  
  - **Not JPR**. The theorist fixes the boundary *in advance* ("if endorsement is predicted, agency vanishes"). Relocation isn’t reactive; it’s a falsifiable stance. JPR requires *adaptive* redescription to evade evidence.  

  **(b) Neural correlates of consciousness (NCC) or AI interpretability demotions**:  
  - **Partial fit, but not JPR**. The pattern resembles JPR (e.g., "NCC X isn’t *real* consciousness, just a precursor"). However, it lacks JPR’s core element: preserving *normative weight* (e.g., moral responsibility or "free will"). In NCC/AI debates, the *explanatory* job may persist, but not necessarily a *normative* one. Thus, it’s analogous but distinct.  

  **(c) First-person redescription ("I chose" → "choosing happened in me")**:  
  - **Not JPR**. This is a descriptive or phenomenological shift, not a *reactive* relocation to empirical threats. There’s no external pressure (e.g., a Libet-style experiment) forcing the redescription. It may reflect introspection or metaphysics but lacks JPR’s defensive empiricism.  

  ---

  **Summary**: Your phenomenon is best captured by **Job-Preserving Relocation (JPR)**—a reactive, unconstrained reassignment of a concept’s referent under empirical pressure, while conserving its normative/explanatory role. Bidirectionality arises because both libertarians and determinists use JPR to defend incompatible temperaments. Established terms like persuasive redefinition or explanatory regress miss key facets (bidirectionality, normativity preservation, or lack of constraints).
