  Below is a complete, runnable in-class game designed to illustrate the doomsday argument's core mechanics without explicitly naming it. The game uses a scaled-down population, avoids real-world references, and incorporates your constraints: ambiguous evidence, two betting rounds with pool revelation, special "early" observers, and group scoring to discourage overconfidence.

  ---

  ### **Game Overview**
  - **Hypotheses**:  
    - \( H_s \): Total population = 60  
    - \( H_l \): Total population = 100  
  - **Prior**: \( P(H_s) = P(H_l) = 0.5 \) (announced to class).  
  - **Mechanism**: Students receive private numbers drawn uniformly from the true population. After an initial bet, they learn if their number came from an **uninformative pool** (fixed-size bloc present under both hypotheses) or the **full population**, then re-bet.  
  - **Special Observers**: Two students are designated "early observers" (number 1) and bet alongside others.  
  - **Ambiguity**: Numbers are mostly in the overlapping range (1–60), ensuring evidence isn't decisive for most.  
  - **Runtime**: 55–60 minutes (setup to debrief).  

  ---

  ### **Materials**  
  1. **Envelopes** (per student):  
     - **Envelope A**: Contains a slip with a unique number (e.g., "Your number: 37").  
     - **Envelope B**: Contains a slip revealing the **pool** (e.g., "Drawn from: FULL POPULATION" or "Drawn from: FIXED BLOC").  
  2. **Betting slips** (two per student, labeled *Round 1* and *Round 2*).  
  3. **Scoreboard** for group and individual points.  
  4. **Randomization tools**: Coins/software to:  
     - Choose the true hypothesis (\( H_s \) or \( H_l \)).  
     - Assign students to pools (fixed bloc or full population).  
     - Draw numbers (without replacement).  
  5. **True Hypothesis Reveal Card** (prepared, hidden until end).  

  ---

  ### **Population Setup**  
  - **Fixed Bloc**: 50 observers present under both \( H_s \) and \( H_l \).  
  - **Variable Population**:  
    - Under \( H_s \): 10 additional observers (total = 50 fixed + 10 = 60).  
    - Under \( H_l \): 50 additional observers (total = 50 fixed + 50 = 100).  
  - **Number Assignment**:  
    - Fixed bloc pool: Numbers 1–50.  
    - Full population pool: Numbers 1–60 (\( H_s \)) or 1–100 (\( H_l \)).  

  ---

  ### **Game Rules & Timeline**  
  **Total Time**: 75 minutes (55–60 for game, 15–20 for debrief).  

  #### **Step 1: Setup (5–7 min)**  
  - Announce hypotheses (\( H_s \): 60, \( H_l \): 100) and prior (50-50).  
  - Designate two students as **early observers** (privately tell them: "You are the first observer; your number is 1. You could not have had a later number.").  
  - Distribute envelopes:  
    - **All students** (including early observers) get Envelope A (number) and sealed Envelope B (pool).  
  - *Instructor secretly generates data*:  
    - Flip a coin to pick true hypothesis (\( H_s \) or \( H_l \)).  
    - For each student, flip a coin: heads → **fixed bloc**, tails → **full population**.  
    - Assign numbers without replacement:  
      - Fixed bloc: Random from 1–50.  
      - Full population: Random from 1–60 (if \( H_s \)) or 1–100 (if \( H_l \)).  
    - Early observers always get number 1 (ensure they are in the full population pool).  

  #### **Step 2: Round 1 Betting (10 min)**  
  - Students open **Envelope A** (see number) but not Envelope B.  
  - **Task**: Bet on \( P(H_s) \) using a quadratic scoring rule.  
    - Instructions: *"Write your probability (0–100%) that \( H_s \) is true. Your score: \( 1 - (1 - p)^2 \) if \( H_s \) true, \( 1 - p^2 \) if \( H_l \) true. Higher score = better."*  
  - Collect betting slips.  

  #### **Step 3: Round 2 Betting (10 min)**  
  - Students open **Envelope B** (see pool: fixed bloc or full population).  
  - **Task**: Re-bet on \( P(H_s) \) with same scoring rule.  
  - Collect betting slips.  

  #### **Step 4: Scoring & Reveal (5 min)**  
  - Reveal true hypothesis (from prepared card).  
  - **Individual scores**: Compute per quadratic rule.  
  - **Group score**: Minimum individual score in the class.  
    - *Rationale*: Penalizes overconfidence (if anyone assigns 0% to truth, group score = 0).  
  - Announce high scorers and group score.  

  ---

  ### **Predictable Challenges & Fixes**  
  - **Ambiguity Failure**: If \( H_s \) is true, all numbers are 1–60. If \( H_l \) is true, ~20% of students get numbers 61–100 (decisive for \( H_l \)).  
    - *Fix*: Most numbers (1–60) are ambiguous (LR = \( \frac{1/60}{1/100} = 1.67 \) for \( H_s \)), but 61–100 students will dominate early discussion. **Use this to teach**: Real doomsday argument avoids decisive evidence by focusing on early ranks.  
  - **Pool Confusion**: Students in fixed bloc (numbers 1–50) may not realize their evidence washes out.  
    - *Fix*: Clarify in debrief: "If your number came from the fixed bloc (same under \( H_s \) and \( H_l \)), your likelihood is identical, so you revert to the prior."  
  - **Trading Complexity**: Skip real trading (time-consuming). Use betting to focus on Bayesian updating.  

  ---

  ### **Debrief (15–20 min)**  
  **Map Game → Doomsday Argument**:  
  1. **Random Position to Total Size**:  
     - *Game*: Your number \( k \) (e.g., 30) is more likely under \( H_s \) (1/60) than \( H_l \) (1/100). Low \( k \) weakly supports small population.  
     - *Argument*: Observing early birth rank suggests fewer total humans.  

  2. **Random Sampling vs. Weighting Hypotheses**:  
     - *Game*: We assumed uniform sampling (no SIA). Prior was 50-50, not weighted by population size.  
     - *Argument*: Doomsday uses random sampling; SIA would give higher prior to \( H_l \) (more observers).  

  3. **Reference Class Problem**:  
     - *Game*: Fixed bloc students saw no shift after learning their pool. Why? Their reference class (fixed bloc) is identical under \( H_s \) and \( H_l \).  
     - *Argument*: Conclusions depend on whether you define "you" as a random human or a random conscious entity.  

  4. **Early Observers**:  
     - *Game*: Early observers (number 1) had weak evidence for \( H_s \) (LR = 1.67), same as other low numbers.  
     - *Argument*: "I couldn’t have been born later" is already baked into uniform sampling—no special update.  

  **Limitations**:  
  - The game cannot stage **temporal dynamics** (real doomsday uses birth rank *in time* to predict extinction).  
  - **Human extinction** is abstracted into population size.  

  **Teaching Moments**:  
  - When students with 61–100 dominate Round 1 discussion: *"In reality, we lack decisive evidence—we're all 'early' in human history."*  
  - When fixed bloc students don’t shift: *"Your reference class determines if your birth rank is informative."*  
  - Group score incentivizes humility: *"Never assign 0% to a hypothesis—what if you're wrong?"*  

  ---

  ### **Why This Works**  
  - **Ambiguity Achieved**: 80% of students (those with numbers 1–50) have weak evidence (LR ≤ 1.25 for \( H_s \)); only 20% see decisive evidence (61–100).  
  - **Pool Revelation**: Cleanly isolates reference-class effects.  
  - **Early Observers**: Show being "first" isn’t special—evidence matches other low numbers.  
  - **Scoring**: Quadratic rule incentivizes honesty; group score combats overconfidence.  

  This game stages the doomsday argument’s core Bayesian move while sidestepping sensitive real-world baggage. It reliably sparks debate about sampling assumptions, reference classes, and the meaning of "random" observation—setting up your formal debrief.
