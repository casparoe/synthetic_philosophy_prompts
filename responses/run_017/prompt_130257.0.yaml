prompt: |-
  I am trying to work out what I actually believe about reparations for historical injustice, and my verdicts on particular cases do not seem to line up with one another. I would be grateful for help extracting a principle from them, or, if no single principle will serve, for a small set of candidate principles together with an honest account of what each one forces me to give up.

  The cases below are invented composites rather than real claims. In every one of them, assume that the wrong is real and well documented, that it was a serious wrong by any standard, and that it would ground a claim for compensation if the original parties were still alive and the clock had been stopped.

  1. Traceable gain. In 1860 a colonial government seizes a fertile valley from a farming community and transfers title to a chartered company. The company's successor still holds the land. The community's descendants are identifiable, poorer than the national average, and include people who were displaced as children. Reparation is owed, to the descendants, from the current holder. This is my easy case.

  2. Dissipated gain. The same seizure, except that the valley turns out to be worthless, the company abandons it and collapses in 1890, and nothing of value passes to anyone. The descendants are still disadvantaged relative to the national average. Something is owed, and I am not confident that it should be less than in case 1, even though no one is now enriched. I do not know what the payment would be for.

  3. Legality at the time. The seizure was authorised by statute and approved by most of the enfranchised population, and everyone involved knew it would never be reversed. Owed, and in no smaller measure than in case 1. I reject this defence outright.

  4. Living victim. A state imprisons an innocent person for twelve years, knowing the evidence was fabricated. Owed. I take this to be the paradigm that the other cases must be shown to resemble, and I distrust any principle that handles it by a separate mechanism.

  5. Unwanted benefits. The perpetrating state later built roads, schools and hospitals in the victims' region, with the result that the descendants' living standards are higher than they would have been had the wrong never occurred. I do not think this reduces what is owed at all. The roads-and-hospitals offset strikes me as an evasion, though I cannot say precisely why it differs from an offset I do accept.

  6. Accepted part-payment. In 1900 the same state pays a compensation package, accepted in good faith by the victims' leaders, worth roughly a third of what we would now judge adequate. I think this genuinely reduces the debt and may discharge it.

  7. Overlapping descent. The wrongdoing state's population has turned over: nine in ten of its current citizens descend from people who arrived after the wrong, as refugees the state later admitted, and roughly half of the claimants also descend from the perpetrators. I do not think the newcomers owe anything personally. But I also think the state owes reparation out of general taxation, which is to say partly out of their pockets. I cannot make these two verdicts consistent.

  8. Existential precondition. Had the wrong never occurred, almost none of the people now claiming would have been born, since it changed who met, married and migrated. This is not a bar to a claim, but I want to know why it is not a bar, given that it seems to show that no claimant was made worse off than they would otherwise have been.

  9. Dead culture, no demand. The wrong destroyed a language and a set of religious practices. The descendants are now glad that their children speak the majority language and do not want the practices revived. Something is owed, but restoration is neither available nor wanted, and I do not know what shape the payment should take.

  10. The case I go back and forth on. A wrong committed two centuries ago by a private corporation whose shareholders cannot be traced. The wrong itself is over, but its effects are locked into a still-operative constitutional clause that continues to advantage one group. Sometimes I think the state must act, because it is the state that now enforces the clause; sometimes I think the chain has gone cold and nothing is owed.

  My tentative principle, which I suspect is inadequate: a historical wrong generates a debt held by the transgenerational political community that committed it and owed to the transgenerational community that suffered it; the debt does not lapse with time; its magnitude is the loss that the wrong explains, net of benefits the victims received because of the wrong; and it is discharged by payment to the victim community's legitimate representatives. As far as I can tell, this gets case 5 wrong and leaves cases 2, 7 and 9 unexplained.

  What I would like from you:

  One or two candidate principles, stated precisely enough that they generate verdicts rather than gestures. If the correct answer is a two-level account, with a ground of duty separate from a rule of quantification, say so and state both parts.

  For each clause of each principle, the case that motivates it, and what breaks if the clause is removed.

  Verdicts on at least three cases I have not listed. Suggestions, though you need not use them: wrongs committed by a church or a corporation rather than a state; claimant groups that were themselves perpetrators of a comparable wrong against a third group; wrongs that are still ongoing rather than historical; wrongs whose perpetrator state was later conquered and replaced by a government drawn largely from the victims' descendants; wrongs whose modern descendants publicly endorse what was done.

  An explicit statement of which of my verdicts the principle cannot accommodate, whether a more complicated principle could accommodate them, and whether you think the added complexity is worth paying for.

  A verdict on case 10, with the reasoning that produces it.
reasoning: |-
  Okay, let me start by understanding the user's problem. They're struggling to find a consistent principle for reparations across different hypothetical cases. Each case presents a unique challenge, and their current principle doesn't cover all scenarios. The user wants a precise principle or a small set of principles that can generate clear verdicts for each case, and they also want to know where their intuitive judgments might conflict.

  First, I need to analyze each case they provided. Case 1 is straightforward: traceable gain where reparations are clearly owed. Case 2, dissipated gain, is trickier because there's no current holder of the gain, but the descendants are still disadvantaged. The user feels something is owed but isn't sure why. Case 3 rejects the legality defense, which shows the principle must override contemporary laws. Case 4 is the paradigm of a living victim, so any principle must account for direct harm. 

  Case 5 is interesting—unwanted benefits. The user rejects offsetting reparations with later benefits, but isn't sure why. This suggests that the basis for reparations isn't merely financial loss but something else, like moral debt. Case 6 accepts part-payment, which introduces the idea of acknowledgment reducing the debt. Case 7 has overlapping descent, creating tension between state obligation and individual liability. Here, the user distinguishes between the state's ongoing duty and individual responsibility. 

  Case 8, existential precondition, is complex. The descendants wouldn't exist without the wrong, so they aren't worse off, yet the user still thinks reparations are due. This points towards a collective or symbolic debt rather than individual compensation. Case 9 involves a dead culture with no demand for restoration, yet something is owed. This indicates that reparations might serve symbolic or community-building purposes. Case 10 is ambiguous because the perpetrator is a defunct corporation, but the state enforces a discriminatory clause. The user is torn between state responsibility and the passage of time.

  The user's tentative principle focuses on transgenerational political communities and net losses. But it fails in cases 5 (unwanted benefits), 2 (dissipated gain), 7 (overlapping descent), and 9 (dead culture). So the key issues are: how to handle benefits, non-material losses, state vs. individual responsibility, and symbolic reparations.

  I recall theories of reparations. Some focus on unjust enrichment, which fits case 1 but fails in case 2. Corrective justice requires identifying victims and perpetrators, which is muddled in intergenerational cases. Maybe a combination of moral debt and structural injustice could work. The state as a continuous entity holds obligations regardless of current citizens' ancestry. Reparations as a moral debt for violating fundamental rights, not just compensating losses.

  For case 5, unwanted benefits shouldn't offset because the wrong was a rights violation, not just financial harm. The moral debt remains. In case 2, even without gain, the state owes because it failed to protect rights. Case 7's tension resolves by separating the state's duty from individual liability. The state owes as an institution, funded by current resources, without blaming present individuals. Case 9 might involve symbolic reparations or investments in the community's current needs.

  Alternative principles could include a structural injustice model where reparations address ongoing disparities, but that might not fit all cases. Or a hybrid model combining moral debt with corrective justice. 

  Testing new principles on additional cases: If a church commits wrongs, the institution or its successor owes reparations. If victims were also perpetrators, it doesn't negate their claim but might complicate moral standing. Ongoing wrongs clearly require reparations. If the perpetrator state is replaced by victim descendants, the new state still inherits the obligation. Endorsing past wrongs might affect the claim's legitimacy.

  For case 10, the state enforcing a discriminatory clause perpetuates the harm, so reparations are due. The chain hasn't gone cold because the harm is active.

  The user's deeper need might be reconciling moral intuition with logical consistency. They want a principle that's philosophically sound yet practical, addressing both individual and collective responsibilities. They might also seek validation that some inconsistencies are unavoidable, requiring pragmatic solutions.
answer: |-
  Based on your cases and verdicts, your core intuition aligns with **reparations as a *moral debt* owed by a *persisting political community* for *fundamental rights violations*, distinct from corrective justice for individuals or unjust enrichment.** This debt attaches to the state as an ongoing entity and is owed to the descendant community as a collective, acknowledging harm to their inherited social/political standing and life chances. Below are two candidate principles addressing your needs.

  ### Candidate Principle 1: The Moral Debt of the State (MDS)
  **Principle:**  
  *A transgenerational political community (a state) incurs a moral debt when its institutions, laws, or agents commit or enable a serious violation of fundamental rights against a distinct community. This debt:  
  (1) is owed to the descendant community recognized as the victim group’s legitimate successor;  
  (2) is grounded in the state’s failure to protect rights and its enduring responsibility for its institutional history;  
  (3) requires proportionate reparation to acknowledge the wrong and address its persistent effects on the victim community’s status and opportunities;  
  (4) does not diminish due to time, dissipation of gains, or subsequent benefits, but may be reduced by prior good-faith compensation.*  

  **Clause Breakdown & Motivation:**  
  - **(1) Victim Community Successor:**  
    *Motivation:* Cases 1, 4, 9 (debt survives cultural loss).  
    *Breaks if removed:* Debt becomes atomized (e.g., impossible to identify individual "losers" in Case 8).  
  - **(2) State Responsibility:**  
    *Motivation:* Cases 3 (rejects "legality"), 7 (state owes despite population turnover), 10 (state enforces ongoing harm).  
    *Breaks if removed:* Collapses into individual blame (contradicts Case 7’s "newcomers don’t owe personally").  
  - **(3) Proportionality to Harm’s Effects:**  
    *Motivation:* Cases 2 (dissipated gain), 5 (rejects offsetting benefits), 6 (accepts part-payment).  
    *Breaks if removed:* Fails Case 2 (no material loss = no debt?) or Case 5 (allows offsets).  
  - **(4) Non-Diminishing, Non-Lapsing:**  
    *Motivation:* Cases 3, 8 (existential precondition), 10 (age of wrong).  
    *Breaks if removed:* Excuses Cases 3, 8, or 10 via time/benefits.  

  **Verdicts on Your Cases:**  
  - **Case 1:** Owed (state debt, identifiable community).  
  - **Case 2:** Owed (debt grounded in rights violation/persistent disadvantage, not enrichment).  
  - **Case 3:** Owed (state responsibility unaffected by contemporary legality).  
  - **Case 4:** Owed (paradigm case of rights violation; state is liable agent).  
  - **Case 5:** Owed in full (benefits don’t negate debt for rights violation; offsetting is evasion).  
  - **Case 6:** Debt reduced/discharged (good-faith payment acknowledges debt).  
  - **Case 7:** State owes from general revenue (institutional continuity), but newcomers not *personally* liable (aligns with verdicts).  
  - **Case 8:** Owed (debt is for the wrong itself and its legacy, not counterfactual harm to specific individuals).  
  - **Case 9:** Owed (symbolic/material repair for historical destruction, e.g., funding cultural documentation or education).  
  - **Case 10:** Owed (state perpetuates harm via constitutional clause; debt hasn’t lapsed).  

  **Verdicts on New Cases:**  
  - **Church/Corporation Wrong:** If the entity persists (e.g., Vatican, multinationals), it owes reparations (analogous to state debt). If defunct, the state that enabled/failed to prevent the harm may owe (e.g., Case 10).  
  - **Victim-as-Perpetrator Group:** Reparations owed *to* them are independent (per MDS). Their own crimes create *separate* debts they owe others (no offsetting).  
  - **Conquered Perpetrator State:** The successor state (if continuous) inherits the debt. If entirely new (e.g., revolution), moral claim may persist but enforcement is pragmatic.  
  - **Endorsed Wrong:** Modern endorsement reinforces harm (e.g., ongoing denial) and may *increase* the debt’s acknowledgment component.  

  **Where MDS Conflicts with Your Intuitions & Tradeoffs:**  
  - **Case 7 Tension Resolved:** MDS distinguishes *state* liability (collective, institutional) from *personal* guilt. Taxation funds the state’s obligation without implicating newcomers’ personal responsibility.  
  - **Case 9 Shape:** MDS allows non-restorative reparations (e.g., scholarships, land trusts) addressing *persistent disadvantage* from cultural destruction.  
  - **Tradeoff:** MDS prioritizes political communities over individuals. It struggles with **Case 8** if you demand *individual* harm (but you accept it, so aligned). Complexity is minimal and worth it for consistency.  

  ---

  ### Candidate Principle 2: Structural Injustice Repair (SIR)  
  *(If MDS feels too state-centric)*  
  **Principle:**  
  *A persisting structure of power (state, colonial system) owes reparations when it inflicts or perpetuates severe group-based injustice violating fundamental rights. The debt:  
  (1) is owed to groups experiencing *ongoing structural disadvantage* traceable to the injustice;  
  (2) is quantified by the *present gap* in opportunity/status attributable to the injustice;  
  (3) is paid by the *current embodiment* of the power structure (e.g., modern state);  
  (4) lapses only if the structural disadvantage is fully remediated.*  

  **Comparison to MDS:**  
  - Solves **Case 2/5/8** cleanly (focuses on present disadvantage).  
  - *Breaks* on **Case 6** (ignores historical compensation) and **Case 9** (if no disadvantage remains).  
  - You reject offsets (Case 5), but SIR *requires* net disadvantage, making it less aligned.  

  ---

  **Verdict on Case 10 (Using MDS):**  
  Reparations **are owed**. The state actively enforces a constitutional clause born of injustice, directly perpetuating harm ("locked-in effects"). The debt hasn’t dissipated—it’s *ongoing*. The corporation’s defunct status is irrelevant; the state, as enforcer of the unjust system, assumes liability. Payment could involve constitutional reform + targeted redress (e.g., preferential policies for disadvantaged group).  

  **Recommendation:**  
  **MDS best captures your judgments.** It handles your hardest cases (2,5,7,8,10) by separating state debt from individual blame/unjust enrichment. Tradeoffs are minor:  
  - It cannot ground reparations in *individual harm* (but you don’t require this, as per Case 8).  
  - It requires pragmatic identification of "descendant communities" (but your cases assume this).  
  Complexity is justified—it systematizes your intuition that the *state’s enduring role* is central, not genealogy or enrichment.
