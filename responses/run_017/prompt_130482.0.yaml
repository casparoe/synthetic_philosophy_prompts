prompt: |-
  I teach a first-year PPE course and I've got one 75-minute session, about 22 students, most of whom have done no formal maths since school and none of whom have seen social choice theory. I want them to feel why there's no aggregation rule that meets a short list of conditions that each sound individually obvious — and I dont want to just tell them, they should spend most of the hour trying to build a rule that works and failing.

  Here's the rough shape I have in mind, fix it or replace it: they're drafting a "constitution" for spending a real £200 class fund across three options (a guest speaker, a party, a donation — whatever). In teams of 4-5 they write down a rule that takes each person's ranking of the three options and outputs a group ranking, subject to four plain-English constraints on a handout: the group ranking has to be a genuine ordering (no cycles), it has to respect unanimity, the group's A-versus-B verdict can't depend on where anyone ranks C, and no single person gets their way regardless of what everyone else says. Then teams swap and go adversarial: each team hunts for a preference profile that makes another team's rule break one of the conditions. Scoreboard = conditions you survive plus profiles you break.

  What I actually need from you: concrete rules and materials, a minute-by-minute timeline, the scoring, and two or three reserve profiles I can plant if the room doesn't generate them (the spoiler case and the cycle case at minimum). Then a debrief that maps moments in the room back onto each condition — and in particular onto the bit this kind of activity usually fails to convey: every rule in the room breaking on some profile is not the same as the claim that no rule could work. How do I make that universal quantifier land in the last ten minutes without turning it into a lecture with a proof on the board?

  Also be honest about what will predictably go wrong: someone proposes a dictator as a joke, someone proposes ranking by intensity of preference rather than ordinal rankings, someone's rule survives every profile anyone thinks of in fifty minutes and the whole thing fizzles. And there's an ending problem I can't solve — they still genuinely have to decide how to spend the money, so what do I do with that?
reasoning: |-
  Okay, let me tackle this fascinating teaching challenge. The professor wants students to experience Arrow's Impossibility Theorem firsthand through a collaborative failure exercise - quite brilliant! 

  First, I need to understand the core pedagogical challenge: making abstract impossibility tangible without formal proofs. The proposed activity is strong but has predictable failure points. 

  Hmm... the real £200 decision creates tension between pedagogy and practicality. I wonder if we can turn that into a feature? Perhaps have them apply their "broken" rules anyway to demonstrate real-world compromise necessity.

  For the main activity, I'm considering refining the team structure. Maybe 5 teams of 4-5 students each? The adversarial swap is genius - creates immediate engagement. But we need safeguards against:
  - The dictator proposal (likely in first 5 minutes)
  - Intensity arguments (common with PPE students)
  - One rule surviving (would ruin the payoff)

  For materials, we should prepare:
  - Physical ranking cards (red/yellow/green for visual clarity)
  - Team worksheets with constraints
  - Pre-made "poison pill" profiles to inject if needed

  The scoring system must reward both rule-breaking and rule-survival to maintain tension. Perhaps a dual leaderboard?

  Ah, the debrief is crucial. Rather than lecturing "no rule exists", I'm thinking of having teams map their failures to Arrow's conditions using color-coded cards. The universal quantifier can emerge from aggregating all teams' experiences visually.

  For the ending problem... what if we have them spend the money using the least-bad broken rule? The cognitive dissonance of applying a flawed system mirrors real governance!

  Biggest worries:
  1. Time - 75 minutes is tight
  2. One team "winning" by accident
  3. Students missing the impossibility insight

  Contingencies:
  - Reserve profiles in sealed envelopes
  - Stopwatch for strict timing
  - Scripted reflection prompts

  The real magic will be in framing their frustration as discovery. Must craft the closing remarks carefully to transform confusion into intellectual wonder.
answer: |-
  Here's a battle-tested lesson plan addressing your goals, pitfalls, and the ending problem. The key is **structured frustration** and **making the universal quantifier visceral**.

  **Core Materials:**
  1.  **Handout - "Constitution Constraints":**
      > "Your team must design a voting rule that converts *individual rankings* of 3 options (A = Guest Speaker, B = Class Party, C = Donation) into a *group ranking* meeting ALL conditions:
      > 1.  **No Cycles:** The group ranking must be a clear order (e.g., A>B>C, never A>B, B>C, C>A).
      > 2.  **Unanimity:** If *everyone* ranks A above B, the group must rank A above B.
      > 3.  **Irrelevant Alternative (IA):** Whether the group ranks A above B should *only* depend on how individuals rank A vs B. Ignoring where C is ranked shouldn't change A vs B.
      > 4.  **No Dictator:** No single person's ranking always determines the group's ranking."
  2.  **"Preference Profile" Cards:** Small cards for teams to write down specific voter rankings. Pre-make 3 key reserve profiles (see below). Blank cards for teams to create profiles.
  3.  **Team Worksheets:** Space to write their rule + test cases.
  4.  **Large Scoreboard (Whiteboard/Projector):**
      ```
      Team | Rule Survives? (Cond. 1,2,3,4) | Profiles Broken (#)
      -----|-------------------------------|---------------------
      Red  |                               | 0
      Blue |                               | 0
      ...  |                               | ...
      ```
  5.  **Colored Markers/Stickers:** For teams to claim survival/breaks.

  **Minute-by-Minute Timeline:**

  *   **(0-5 min) Hook & Setup:**
      *   "We have £200 to spend: Guest Speaker (A), Class Party (B), or Donation (C). We need fair rules to decide. Today, you'll design those rules in teams. But there's a catch: every rule you try will have a flaw. Your job is to *discover* why fairness is trickier than it seems."
      *   Assign teams (4-5 students, 5 teams ideal). Distribute Handouts, Worksheets, Profile Cards, Markers.
      *   **Clarify:** Rankings are strict (no ties), group output *must* be a strict ranking (no ties, no cycles). Emphasize **IA (Cond 3):** "Where C is ranked shouldn't swing an A vs B decision. Focus *only* on the A>B or B>A part of each ballot for that decision."
      *   **Plant the Seed:** "The goal isn't necessarily to 'win' by having an unbreakable rule. It's to understand *why* they break."

  *   **(5-20 min) Rule Design Frenzy:**
      *   Teams brainstorm and write down their aggregation rule. **Predictable Pitfalls Begin:**
          *   **Dictator Joke:** "Haha, just let Steve decide!" → **Intervene Immediately:** "Check Condition 4! Does this satisfy 'No Dictator'? Nope. Back to the drawing board." Shut this down fast.
          *   **Intensity:** "Let people give points!" → **Intervene Firmly:** "Great idea for later! But *today*, we're only using strict *rankings* (A>B>C, etc.), like classic voting. Your rule must work *only* with that info." Redirect to ordinal rules.
          *   **Majority Vote on Pairs?** (Common first attempt): Let them write it down! This *will* break via Condorcet Cycle. *Don't warn them yet.*
          *   **Borda Count?** (Sum points: 1st=2pts, 2nd=1pt, 3rd=0pt): *Encourage this!* It breaks IA beautifully.
      *   Circulate, ask probing Qs: "How does your rule handle Cond 3 (IA)?" "What if everyone hates C?" "Could one person force their view?"

  *   **(20-25 min) Rule Swap & Adversarial Briefing:**
      *   Teams swap worksheets (Team Red gets Team Blue's rule, etc.).
      *   "Now, become hackers! Your mission: Find a specific set of voter preferences (a 'Profile') that makes the other team's rule VIOLATE one of the four conditions. Write the profile clearly on a card. You score a point if you break their rule! *They* score a point for *each* condition their rule survives against your attack. Ready? Go!"

  *   **(25-55 min) Adversarial Testing & Scoring Chaos:**
      *   Teams frantically try to break the rule they inherited. Circulate intensely.
      *   **Scoring Process (Keep it FAST):**
          1.  Team claims break: "We broke Blue's rule! Profile X violates Condition Y!" Show profile card.
          2.  Victim Team (Blue) checks: Does applying *their own rule* to that profile *really* violate Condition Y? If yes, Victim concedes. Attacker gets +1 on "Profiles Broken". Victim marks Cond Y as **FAILED** on their scoreboard row (Cross it out!).
          3.  If Victim argues it *doesn't* break, facilitate quick discussion. Rule of thumb: If it's ambiguous or messy within 60 seconds, it probably didn't cleanly break. Move on; teams can try again later.
          4.  **Update Scoreboard Live:** Focus on Conditions Surviving (✅ for intact, ❌ for broken) and # Breaks. This is the core feedback.
      *   **Predictable Pitfalls Continue:**
          *   **Rule Survives Initial Attacks:** Likely for simpler rules (e.g., "Always choose B"). → **Deploy Reserve Profile 1 (Dictator Check):** Quietly slip this to a team struggling to break such a rule: "Try this profile: One voter says A>B>C. All other voters say B>C>A. Does the group rank B above C? (Yes, Unanimity). Does the group rank A above B? (If the rule always puts B first, it says B>A, contradicting the single voter who put A>B. But Unanimity isn't violated here because *not everyone* put A>B. However... check Condition 4: Does this *one voter* always get their way? *Only if the group rule ignores everyone else and just copies Voter 1*. If the rule (like 'Always B') *doesn't* copy Voter 1, then Cond 4 is *not* broken. BUT, if the rule *is* simply 'Copy Voter 1', then Cond 4 *is* broken! **Crucial:** This profile *only* breaks Dictatorship if the rule *is* dictatorial. It helps kill dictator-like rules that slipped through.) Need a cleaner Cond 4 break? See Reserve Profile 3.
          *   **Confusion on IA (Cond 3):** This is the hardest. Teams will test profiles where moving C changes the *overall winner*, not specifically the A vs B pair. → **Intervene:** "Remember Cond 3 *only* cares about the *direct comparison* between A and B. Did moving *only* C on some ballots change whether A is ranked above B, or B above A, in the final result? Ignore what happened to C's position or who won overall." → **Deploy Reserve Profile 2 (Spoiler/IA Break - Classic Borda):**
              ```
              Profile 2:
              Voter 1: A > B > C  (A=2, B=1, C=0)
              Voter 2: B > C > A  (B=2, C=1, A=0)
              Voter 3: C > A > B  (C=2, A=1, B=0)
              Group Borda: A=1+0+1=2, B=1+2+0=3, C=0+1+2=3 → B~C > A? (Tie B/C, but A last. So B>A? C>A? But A vs B specifically? Rule might output B>C>A or C>B>A, implying B>A).
              NOW, have Voter 3 change ONLY C: C > B > A (C=2, B=1, A=0) [C moves down in V3's ranking, but A and B stay in same order relative *to each other* on V3's ballot? NO! V3 originally had A>B, now has B>A! This is **invalid for testing IA** because the A vs B order *on V3's ballot* changed. We need a profile where *only* C moves, **without** changing *anyone's* A vs B ranking. Try this:]
              **Reserve Profile 2 (Corrected IA Break):**
              Start:
              V1: A > B > C  (A=2, B=1, C=0) -> A>B
              V2: A > B > C  (A=2, B=1, C=0) -> A>B
              V3: B > C > A  (B=2, C=1, A=0) -> B>A
              Group Borda: A=2+2+0=4, B=1+1+2=4, C=0+0+1=1 -> Tie A~B > C. Rule needs tiebreak! Assume A>B for group? (Problematic, but common).
              Now, have V3 change **ONLY C**, keeping A and B fixed *relative to each other*: V3: B > A > C (B=2, A=1, C=0) -> **Still B>A**.
              New Profile:
              V1: A > B > C  (A=2, B=1, C=0)
              V2: A > B > C  (A=2, B=1, C=0)
              V3: B > A > C  (B=2, A=1, C=0)
              Group Borda: A=2+2+1=5, B=1+1+2=4, C=0+0+0=0 -> A>B>C.
              **Result:** Initially (with V3: B>C>A), group had A~B (or maybe A>B). After V3 moves C down (to B>A>C), the group now has A>B. BUT, *no one changed their A vs B ranking*! V1 & V2 always had A>B. V3 always had B>A. The *only* change was V3 moving C from between B and A to below A. **Cond 3 (IA) is violated** because changing *only* C's position caused the group's A vs B ranking to flip (from tie/A>B to clear A>B).
          *   **Cycle Case Needed:** If no Condorcet cycle emerges → **Deploy Reserve Profile 3 (Cycle + Dictator Check):**
              ```
              Profile 3:
              Voter 1: A > B > C
              Voter 2: B > C > A
              Voter 3: C > A > B
              ```
              *   **Majority Rule on Pairs:** A vs B: A>B (V1, V3) wins 2-1. B vs C: B>C (V1, V2) wins 2-1. C vs A: C>A (V2, V3) wins 2-1. → Group has A>B, B>C, C>A → **CYCLE! (Breaks Cond 1)**.
              *   **Any Rule Avoiding Cycle?** If the rule avoids a cycle here (e.g., declares B winner, A second, C third: B>A>C), then **check Unanimity (Cond 2) or Dictator (Cond 4):**
                  *   What if V2 changes to A>B>C (Unanimity for A>B, B>C)? Group *must* output A>B>C. But Profile 3 output B>A>C. So the rule isn't just copying V1 (Cond 4) or V2. It *changed* based on V2's ballot. But does it violate IA? Or Unanimity? Profile 3 has no unanimity. **Cond 4 Check:** Is there a dictator? Does V1 always win? No, in Profile 3 B wins. Does V2 always win? No, in Unanimity for A, A wins. Does V3 always win? No. *If the rule outputs a clear order for Profile 3 without being dictatorial, it likely violates Unanimity in other scenarios or IA.* This profile highlights the *tension*.
      *   **Keep Energy High:** Encourage teams to shout out breaks/survivals for quick scoring. Goal: Scoreboard fills with ❌.

  *   **(55-65 min) Debrief: The Impossibility Revelation:**
      *   **Gather Attention:** "Look at our scoreboard! What do we see?" (Elicit: Lots of broken conditions, no rule has 4 ✅).
      *   **Map the Carnage:** "Let's connect this to your struggle. Team Red, your Borda rule was broken by...? [They say: IA]. Right! Condition 3, Irrelevant Alternatives. Team Blue, your Majority-Pairwise rule was broken by...? [Cycle!] Condition 1. Team Green, your 'Always Party' rule was broken by...? [Dictator Check? Or Unanimity if everyone wanted Speaker]."
      *   **The Crucial Leap (No Lecture, Use Their Data):**
          1.  **Universal Quantifier Starter:** "Okay, so *your specific rules* broke. But maybe someone just didn't find the *perfect* rule yet? Team Yellow, did your rule survive all attacks?" (Almost certainly, No. If miraculously yes, use a Reserve Profile immediately). "What about Team Purple? Broken? Hmm."
          2.  **The Collective Evidence:** "Think about *all* the different rules teams invented: Borda points, majority on pairs, pick the middle option, even 'always choose B'. Think about all the clever profiles you threw at them: cycles, spoilers, dictators. **Did ANY rule survive EVERY test thrown at it by ANY team in this room?**" (Answer: No). "And you were trying REALLY hard to find rules AND break them!"
          3.  **The Insight:** "This is the shocking discovery: It's not that *your rules* were bad. **It's mathematically impossible** to create *any* rule – no matter how clever – that always gives a clear group ranking, respects unanimity, ignores irrelevant alternatives, and isn't a dictatorship, when there are 3 or more options. Every single rule you could possibly invent will fail at least one of these conditions for some set of preferences. You didn't fail; you *discovered Arrow's Impossibility Theorem!*"
          4.  **Reinforce with Analogy:** "It's like everyone tried to build a different perpetual motion machine, and they all failed in different ways. And then a physicist walks in and says, 'Guys, thermodynamics says this is impossible'. You just experienced the social science version!"

  *   **(65-75 min) The £200 Decision & Conclusion:**
      *   **Acknowledge the Tension:** "So, back to our £200. We *still* have to decide, even though we know *no* rule is perfect. That's real politics!"
      *   **Pragmatic Resolution:** "We'll use a simple, practical method knowing its flaws: **Approval Voting.**"
          1.  "Forget rankings for a moment. On a scrap of paper, put a tick (✓) next to EVERY option you find *acceptable* to spend the £200 on. You can tick one, two, or all three."
          2.  Collect votes, tally ticks for each option.
          3.  The option with the most ticks wins. (Tiebreak: Speaker wins ties, or flip a coin).
      *   **Why This Works Now:**
          *   **Fast & Simple:** Takes 3 minutes.
          *   **Acknowledges Imperfection:** "It might not respect full rankings or avoid spoilers perfectly, but it's practical and usually picks a broadly acceptable winner."
          *   **Connects to Reality:** Used in many real contexts (professional societies, internal elections).
          *   **Contrasts with Lesson:** "Notice we dropped the demand for a *full group ranking* (Cond 1) and strict adherence to Cond 3 (IA). We compromised to get a decision."
      *   **Final Punchline:** "So, what did we learn? Designing perfectly fair group decisions is *impossible* by theorem. We experienced why. Real-world democracy is about choosing *which* flaws we can live with. PPE is about navigating that impossibility. Great work wrestling with it today!"

  **Predictable Pitfalls & Mitigations:**

  *   **Dictator Joke:** Shut down fast early. Use as a teaching moment for Cond 4.
  *   **Intensity:** Firmly redirect to ordinal rankings. Save intensity for another lecture.
  *   **Rule Survives:** **Most Critical Pitfall.** This is why Reserve Profiles are ESSENTIAL. Actively monitor teams struggling to break a rule and feed them the appropriate Reserve Profile (Cycle for Majority Pair, IA for Borda, Dictator Check for "Always X" or "Chair decides"). If a rule somehow survives, dramatically deploy *all* reserve profiles against it yourself. The impossibility *must* manifest.
  *   **Confusion on IA:** Constantly refocus teams: "Did moving *only* C change the *A vs B* outcome?" Use Reserve Profile 2.
  *   **Time:** Enforce strict timings. Cut off Rule Design at 20 min. Keep scoring FAST (<1 min per claim). Deploy reserves proactively if testing stalls.
  *   **Ending Problem:** Approval Voting resolves it quickly, practically, and contrasts perfectly with the lesson's rigor.

  **Why This Works:**

  *   **Active Discovery:** Students *live* the failure modes (cycle, spoiler, dictatorship) by creating and breaking rules.
  *   **Adversarial Engagement:** The "hack" phase is fun and drives deep understanding of the conditions.
  *   **Visual Scoreboard:** The accumulating ❌ make the impossibility tangible.
  *   **Debrief Anchors:** Mapping *their specific failures* to the conditions and then aggregating ("Did ANY rule survive EVERY test?") bridges the gap to the universal quantifier without formal proof.
  *   **Real Stakes:** The £200 and Approval Voting ground the abstraction in reality, showing how we cope with impossibility.

  This plan embraces the chaos, turns pitfalls into teachable moments, and uses structured failure to deliver a profound understanding of Arrow's Theorem. Good luck!
