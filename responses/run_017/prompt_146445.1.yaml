prompt: |-
  I've been arguing with a friend from my local rationalist meetup — someone who has been around since the Sequences were still being posted, uses "steelman" as a verb, and has unaccountably strong feelings about the repugnant conclusion — about what anyone is even doing when they say that human extinction would be astronomically bad rather than merely as bad as eight billion deaths. Her position, roughly, is that the badness isn't in the deaths at all but in something about the afterlife: that what we care about, and care about enormously, is that humanity goes on without us. She insists all of her case verdicts follow from that one principle. I think she is quietly running two or three different rules that haven't come apart yet because nobody has handed her the case that pulls them apart, and I want your help designing it. I have her verdicts in a spreadsheet because I am like this, and I have normalized them so that Slow Fade — a sterilizing pandemic, no children born after 2050, everyone currently alive dies of old age, everyone has decades of warning — counts as 1.

  Her other verdicts: Ninety Percent, in which a plague in 2050 kills ninety percent of humanity but the survivors keep the archives, rebuild, and go on to a future as large and rich as the one we would otherwise have had: 0.01, and she insists this isn't inconsistent, because the thing she cares about survived even though nine out of ten people didn't. Long Dark, in which there is no mass death at all but civilization collapses, literacy and science are lost, and humanity dwindles to a few hundred thousand foragers who never recover and die out after a few hundred thousand years: 0.6, which surprised me, since on her own telling both the species and its future population are intact. Distant Stop, which is Slow Fade with the last generation dying in 2400 instead of 2120, and with nobody now alive ever learning about it: 0.4 — same order of magnitude, but clearly less. (For the record, she is a negative-leaning utilitarian about her own life choices and not about population questions, and I have never gotten her to reconcile that, so please don't lean on it.)

  The case I want to spring on her is Succession: in 2060 a sterilizing pandemic ends biological humanity, but over the preceding decades we have built machine successors who hold our archives, speak our languages, deliberately carry forward scientific, artistic and philosophical projects that we started, and whose future is longer, larger and contains more of everything she lists as valuable than a human future would have. Nobody is surprised; many people are relieved. Please give me three things. First, predict her number, with the reasoning that gets you there rather than the number alone. Second, lay out the rules her first four verdicts are jointly consistent with — I can think of at least three: one about the frustration of people's interest in a collective afterlife where the content of that interest is doing real work, one about how much value the future would have contained where value includes achievements and not just welfare, and one about whether the causal and cultural chain linking us to the future is broken — and say precisely where they diverge on Succession and what each of them predicts. Third, give me the single further case that would best separate whichever two rules you think are still alive afterward, together with each rule's prediction for it. If instead you think her four verdicts are already mutually inconsistent, tell me which one has to move and why. I want her number, not yours, so please don't spend the answer telling me what you think is actually true about the badness of extinction.
reasoning: |-
  Okay, let me tackle this step by step. The user is in a debate with a rationalist friend about why human extinction is astronomically bad, not just equivalent to current deaths. The friend claims it's about humanity continuing without us, not the deaths themselves. The user suspects hidden rules and wants to design a "Succession" scenario to test this.

  First, I need to predict the friend's rating for Succession. Looking at her past verdicts: Slow Fade (sterilization, no kids after 2050) is 1.0. Ninety Percent (90% die but humanity recovers) is only 0.01 because the future survives. Long Dark (civilization collapses, slow extinction) is 0.6 - surprisingly high since humanity technically continues but loses everything valuable. Distant Stop (delayed Slow Fade) is 0.4, showing she cares about the near-term future.

  For Succession (machines inherit human legacy), the key is whether she sees this as "humanity continuing." Her past reactions suggest she values symbolic continuity and cultural legacy. Long Dark got 0.6 despite biological survival because the cultural chain broke. But Succession maintains cultural continuity deliberately. She might still resist if she ties "humanity" strictly to biology. Given her relief about archives in Ninety Percent (0.01), but higher value on cultural projects in Long Dark (0.6), I'd split the difference. Prediction: 0.3-0.4. She'd acknowledge the intentional legacy-preservation but dock points for biological extinction.

  Now, the hidden rules. Her verdicts fit three principles:
  1. **Collective Afterlife Interest Principle**: Badness scales with frustration of people's desire for humanity's future. Slow Fade (1.0) frustrates everyone completely. Distant Stop (0.4) less so because later generations adapt. Succession would rate low (0.1?) since people are "relieved."

  2. **Legacy Value Principle**: Badness depends on lost future achievements. Long Dark (0.6) loses civilization's potential. Succession preserves it, so should be low (0.01?). But Distant Stop (0.4) is inconsistent here unless it weights near-term progress higher.

  3. **Causal Chain Principle**: Breakage of the cultural lineage matters. Long Dark (0.6) breaks it; Ninety Percent (0.01) doesn't. Succession maintains it, so should be ~0.01. But Slow Fade (1.0) keeps the chain until end, so why not lower? Unless it requires indefinite continuity.

  Divergence on Succession: Principle 1 predicts moderate badness (people aren't frustrated). Principle 2 predicts very low (legacy continues). Principle 3 predicts very low (chain intact). Her actual resistance to "biological extinction" suggests Principles 1 and 3 are in tension.

  Finally, the tiebreaker case: **False Dawn**. Humanity recovers post-Long Dark but unknowingly rebuilds on ruins, losing all connection to our era. Principle 1: Moderate (people died hoping, but future exists). Principle 3: High (chain broken). Principle 2: High (achievements lost). This isolates Principle 3 vs others.

  If she rates False Dawn high (~0.7), she's using causal chain continuity. If low (~0.3), she cares about collective hope or abstract legacy. Either way, Succession exposes the biology-vs-culture tension in her model.
answer: |-
  Based solely on your friend's stated principle ("badness is in humanity going on without us") and her four verdicts, I predict **her rating for Succession would be 0.4–0.5**, with **0.4** as the most likely point estimate. Here's the reasoning, followed by the rule analysis and a tiebreaker case:

  ---

  ### 1. Prediction for Succession (0.4)
  - **Core reasoning**: Your friend prioritizes *biological humanity's indefinite continuation* as the carrier of our legacy, not just abstract "value" or cultural continuity. Succession severs the biological chain, which she treats as irreplaceable. 
  - **Why 0.4 specifically?** 
    - Distant Stop (0.4) is analogous: biological humanity ends later, with no one alive today affected. Succession is similar but swaps humans for machines. She’ll see this as *worse* than Ninety Percent (0.01) because biology is gone, but *better* than Slow Fade (1.0) because the "legacy" superficially continues. 
    - Long Dark (0.6) is instructive: despite biological survival, the loss of cultural continuity made it nearly as bad as Slow Fade. Succession maintains cultural continuity but lacks biology, so she’ll split the difference—higher than Ninety Percent (where biology survives) but lower than Long Dark (where biology survives but culture dies). 
    - Crucial nuance: Her Distant Stop verdict (0.4) shows she discounts futures disconnected from *present* awareness. In Succession, people are "relieved," so the frustration of "humanity continuing without us" is mitigated, but not eliminated (since *we* aren’t biological ancestors). 
  - **Contradiction surfacing**: Her Ninety Percent rating (0.01) proves she doesn’t care about individual deaths. But Long Dark (0.6) shows that *meaningless* biological survival isn’t enough—culture matters. Succession forces her to choose: is the biological link essential, or is symbolic legacy sufficient? Her attachment to biology will override, leading to ~0.4.

  ---

  ### 2. Rules Consistent With Her First Four Verdicts
  Her verdicts fit three distinct rules. All are consistent with Slow Fade=1.0, but they diverge sharply on Succession and beyond. Here’s each rule, its predictions, and where they conflict:

  1. **Collective Afterlife Interest Principle**  
     - *Rule*: Badness scales with the aggregate frustration of people's *actual desire* for humanity to continue beyond their lifetimes. The content ("what" continues) matters less than the psychological fulfillment of that desire.  
     - *Verdicts explained*:  
       - Slow Fade (1.0): Everyone knows humanity ends, so 100% frustration.  
       - Ninety Percent (0.01): Survivors rebuild; most people died hoping for a future, and that hope was validated.  
       - Long Dark (0.6): People expect continuity, but the future is unrecognizable—partial frustration.  
       - Distant Stop (0.4): Fewer people today care about 2400, so less frustration.  
     - *Prediction for Succession*: **0.1–0.2**. People are "relieved" and support the transition, so frustration is low.  

  2. **Legacy Value Principle**  
     - *Rule*: Badness is the lost *cumulative value of future achievements* (scientific, artistic, etc.), discounted by cultural proximity to us. "Humanity" is a vessel for this value.  
     - *Verdicts explained*:  
       - Slow Fade (1.0): All potential value lost.  
       - Ninety Percent (0.01): Full value recovered; short-term loss irrelevant.  
       - Long Dark (0.6): Achievements lost; only baseline survival remains.  
       - Distant Stop (0.4): Achievements continue longer, so less value lost vs. Slow Fade.  
     - *Prediction for Succession*: **0.01 or lower**. More value is created than in a human future; our legacy is actively preserved.  

  3. **Causal Chain Principle**  
     - *Rule*: Badness requires a break in the *unbroken biological/cultural lineage* from us to the future. "Humanity" must descend directly from us biologically, with cultural transmission intact.  
     - *Verdicts explained*:  
       - Slow Fade (1.0): Lineage ends.  
       - Ninety Percent (0.01): Lineage continues uninterrupted.  
       - Long Dark (0.6): Biological lineage continues, but cultural transmission is broken.  
       - Distant Stop (0.4): Lineage continues longer than Slow Fade, so less bad.  
     - *Prediction for Succession*: **0.7–0.9**. Biological lineage is severed (machines aren’t "descendants"), so it’s a catastrophic break, akin to Long Dark but worse due to no biological survival.  

  **Where they diverge on Succession**:  
  - **Afterlife Interest** predicts low badness (0.1–0.2) due to lack of frustration.  
  - **Legacy Value** predicts minimal badness (0.01) due to preserved/enhanced achievements.  
  - **Causal Chain** predicts high badness (0.7–0.9) due to broken biological lineage.  
  Your friend’s predicted 0.4 suggests she’s blending *Causal Chain* (prioritizing biology) and *Afterlife Interest* (discounting for lack of frustration), rejecting *Legacy Value* as primary.  

  ---

  ### 3. Tiebreaker Case to Separate Remaining Rules  
  After Succession, assume she rates it 0.4. This eliminates *Legacy Value* (which predicted 0.01) and leaves *Afterlife Interest* and *Causal Chain* in tension. To split them, use:  

  **False Dawn**  
  - *Scenario*: Identical to Long Dark (civilization collapses, humanity dwindles to foraging groups), but after 100,000 years, they *redevelop* advanced civilization. However, they never rediscover any trace of our culture, science, or history. To them, our existence is a myth. Everyone alive today dies believing humanity has no future.  
  - *Why this case?*  
    - Isolates "lineage break" vs. "frustration" without biology/extinction confounders.  
    - Tests if cultural discontinuity *alone* drives badness (Causal Chain) or if fulfilled hopes matter more (Afterlife Interest).  

  **Predictions per rule**:  
  - **Causal Chain Principle**: **High badness (~0.7–0.8)**. The cultural lineage is broken for millennia—identical to Long Dark until recovery, which doesn’t restore the chain.  
  - **Afterlife Interest Principle**: **Moderate badness (~0.3–0.4)**. People die frustrated (like Slow Fade), but humanity *does* eventually continue, partially fulfilling the desire.  

  **If she rates False Dawn high (≥0.6)**: She’s committed to **Causal Chain** (lineage continuity is paramount).  
  **If she rates it low (~0.3)**: She’s using **Afterlife Interest** (actual future existence mitigates frustration).  

  **Bonus insight**: If she balks at False Dawn, note her Distant Stop (0.4) already implies a discount for *temporal* disconnect. False Dawn forces her to decide if *cultural* disconnect is equally bad.  

  --- 

  ### Final Note  
  Her verdicts are **mutually consistent** under a hybrid rule: *"Badness is proportional to the severity of the break in biological lineage, discounted by temporal distance and mitigated by cultural continuity."* Succession exposes the biology bias; False Dawn tests cultural vs. temporal discounting. If she rates False Dawn similarly to Long Dark (0.6), she’s consistent. If not, Distant Stop (0.4) is the outlier and must move—why is a *delayed* lineage break less bad than a *degraded* one (Long Dark)?
