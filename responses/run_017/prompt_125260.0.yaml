  Give me exactly five numbered points, one or two sentences each, no preamble and no summing up at the end. Roughly:

  1. which scenes really show him binding himself and which show him being handled by Teddy, and why the wax/rope distinction changes the verdict on which kind of binding can be quietly hijacked by whoever holds it;
