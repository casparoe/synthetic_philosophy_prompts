answer: |-
  Here are five numbered points addressing your analysis:

  1.  **Wax vs. Rope Distinction & Hijacking:** Leonard burning possessions (like Sammy's file) attempts "wax-binding" (destroying options), but Teddy easily replaces them. His tattoo system ("rope-binding" - information exists but access is controlled) is hijacked because Teddy feeds him false data ("John G.") and manipulates the interpretation. The rope requires a trusted holder; wax requires irreversible destruction, which Leonard fails at.

  2.  **Inverted Ulysses: Judgment vs. Information Asymmetry:** The film shows Leonard's stable *past* self (post-injury) establishing the system with good judgment but *terrible* information about future contexts. His unstable *present* self has worse judgment but firsthand experience. The psychiatric directive relies entirely on the well self's judgment *despite* lacking future situational knowledge, mirroring Leonard's flawed setup.

  3.  **Enforcer Demands & Sibling Feasibility:** Teddy exemplifies the untrustworthy enforcer: he actively lies ("He's the one," "John G.") and manipulates Leonard for personal gain (drug deals, money). The film implies an enforcer must be both incorruptible *and* able to resist the bound person's pleas/rage ("Don't listen to him!"). This demands superhuman detachment, casting doubt on a sibling's ability to fulfill it neutrally amidst crisis.

  4.  **Reverse Contract & Time-Slice Authority:** Leonard deliberately tattooing "FACT 6" (Teddy is lying) *knowing* he'll forget and kill Teddy is the inverted Ulysses contract: he binds his future self *to act on false information*. This highlights his *current* self's absolute authority, actively disenfranchising his future self, unlike the dead-hand problem; the binder (current Leonard) is very much present, choosing to sabotage his future agency.

  5.  **Limit & Core Insight:** Sammy Jankis's story isn't about self-binding; it's Leonard's guilt projection/justification mechanism (the insulin scene shows passive suffering, not active commitment). The crucial insight lies in Leonard *trying to remove the "Never answer the phone" tattoo* – it reveals the fundamental flaw: effective precommitment requires the future self to *recognize and accept* the binding as legitimate, not just be trapped by it. His system denies his future self that recognition.
