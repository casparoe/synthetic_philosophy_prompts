  So this is where I'm at: my brother has bipolar I, and about a month back while he was stable he asked me to be the one who gets him sectioned if he stops sleeping and starts wiring money to people he met online. We're trying to get that into a psychiatric advance directive so it triggers on its own, which as far as I can tell is just a real life Ulysses contract, and reading about them has not been comforting — every page is basically "bind your future self, it's rational" and none of them ask who is holding the rope, or what happens if the person holding it has their own reasons. And of course my film group is doing Memento on Thursday and I volunteered to do the ten minute intro, and the two things have fused in my head.

