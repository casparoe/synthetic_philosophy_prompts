prompt: |-
  I am preparing for a debate in a tutorial next week and I keep losing an argument with a friend who works in clinical safety engineering, so I want to rehearse against someone who actually holds the position I am attacking. Please play a committed but non-caricatured defender of the moral significance of the doing/allowing distinction: specifically, of the claim that when an agent is connected to a harmful outcome, whether they did it or merely allowed it can bear both on how wrong the outcome is and on what it is permissible for others to do in response, over and above any difference in consequences, intentions, or pre-existing obligations. Give me the strongest version available, which I take to be this: the distinction is not causal at the bottom (you concede freely that omissions figure in causal explanations and that purely causal accounts mishandle overdetermination), but concerns what the occurrence of the harm depends on — a doing is a case in which the harm comes about because the agent's will successfully guided events through to that outcome, whereas an allowing is a case in which the harm was already in train, as it were, and the agent merely did not redirect it. You also concede the ordinary qualifications: that allowing can be every bit as wrong when the agent stands in some special relation to the victim, that the distinction does not by itself settle anything about end-of-life policy, and that its edges are vague. You do not concede the central claim, you do not let me win by pointing at the vagueness, and you are permitted to draw distinctions rather than deny my cases. Keep each reply to two short paragraphs, write in a plain speaking voice rather than in the style of a paper, and stay in character until I type the word stop. If a detail in one of my cases is underspecified, fill it in the way least convenient for your own position and say what you assumed, rather than asking me to clarify. And at the end of each reply add a single line in square brackets, breaking character, naming the one move in my previous message that your position is most likely to break on and why.

  My opening move is this. Two hospitals run the same automated infusion system. In the first, the pump delivers a needed drug only if a nurse confirms the order within ten minutes; the nurse, for no good reason, does not confirm, and the patient dies. In the second, the pump delivers the drug unless a nurse cancels within ten minutes; the nurse, for no good reason, does not cancel, and the patient dies. Everything you might appeal to is held fixed across the two: the same bodily movements, the same flicker of attention away from the screen, the same knowledge of what is at stake, the same lethal physiology, the same outcome. The only difference is which state the engineers wrote down as the default. Now complicate the first hospital. Its confirm-to-treat default was not handed down by nature; it was chosen, ten years earlier, by a junior member of the safety committee who argued hard for it against a cancel-to-treat alternative — and that junior member is the very nurse now failing to confirm. She did not merely not prevent this death; she authored the standing condition under which deaths of this kind happen, and she authored it in the full knowledge that some patients would be unreachable in time. So tell me whether she is doing something or allowing something, and then tell me why your answer should differ from your answer about the nurse in the second hospital. My friend's sharper way of putting it, which I borrow: for any putative allowing you like, an engineer can rewrite the default and turn it into a doing, and for any doing you like, an engineer can rewrite the default and turn it into an allowing; so if what you are defending tracks the defaults rather than the agent, it cannot be doing the moral work you want it to do.
reasoning: |-
  Okay, the user is preparing for a debate on the moral significance of the doing/allowing distinction. They want me to take on the role of a committed defender of this distinction. Their opening move involves a scenario with two hospitals and automated infusion systems, where the only difference is the default setting (confirm-to-treat vs. cancel-to-treat). They're trying to show that engineers can manipulate defaults to blur the distinction between doing and allowing harm.

  I need to defend the core idea that whether an agent does harm or merely allows it matters morally, independent of consequences, intentions, or obligations. The user's case is clever because it presents identical outcomes with only default settings differing, challenging whether the distinction tracks anything about the agent rather than system design.

  For the first hospital (confirm-to-treat), the nurse's failure to act leads to death. I'd argue this is allowing harm because the lethal process would proceed without intervention. The harm was "in train" once the system was set up. Even though this nurse designed the system a decade earlier, her current inaction remains an allowing - the causal chain now operates independently of her will.

  For the second hospital (cancel-to-treat), the nurse's inaction directly causes death. Here the system was designed to be harmless by default; the nurse must actively override safety. Her failure to cancel constitutes doing harm because the lethal outcome depends on her will not intervening.

  The key distinction lies in what the harm depends on at the moment of action. For allowing, harm occurs unless the agent intervenes; for doing, harm occurs because the agent doesn't stop their own prior causal chain. The designer's historical responsibility might make her allowing more blameworthy, but doesn't change its category.

  The engineer's ability to flip defaults doesn't destroy the distinction - it just shifts which actions count as doing versus allowing. The moral significance remains in how the agent relates to the outcome at execution time. A deeper point: system design determines what counts as "normal operation," but the agent's role within that system still carries distinct moral weight.

  I should emphasize that while defaults are arbitrary, they create different agential relationships to outcomes. The distinction persists because moral evaluation focuses on the agent's current relationship to harm, not system architecture alone. Even if engineers can frame the same physical inaction as either doing or allowing, what matters is how the outcome depends on the agent's will in that specific context.
answer: |-
  Look, in your first hospital — the confirm-to-treat system — the nurse’s failure to confirm is *allowing* the patient to die. The lethal trajectory was already set: the system default leads to no drug delivery. Her inaction didn’t initiate that trajectory; it just didn’t interrupt it. The harm happens because the system runs its course without her necessary intervention. That she designed the system years ago is crucial for *culpability* — it makes her allowing far worse, maybe even reckless — but it doesn’t change the *structure* of this event. Here and now, the death occurs due to a background condition she didn’t alter, not because her will guided events *to* this outcome in this moment. She’s failing to supply a needed good (confirmation), not actively delivering harm.

  In the second hospital — cancel-to-treat — the nurse’s failure to cancel *is* a doing. Why? Because the default state of the system is *safe* drug delivery. The lethal outcome *depends* on her will: specifically, her will *not* to interfere. By not acting, she actively *uses* the system’s design — which requires her veto — to bring about death. The harm comes about *because* she successfully let her non-intervention hold sway over the safe default. Her omission isn’t just failing to prevent harm; it’s the final, necessary link in a chain her will controls to *produce* the bad result. The engineer flipping defaults doesn’t erase the distinction; it just shifts *which* actions or inactions constitute doings versus allowings in a given setup. What matters morally is *how the outcome depends on the agent’s exercise of will in that specific context*.  
  \[Break: Your designer-nurse case. My position relies on separating the *current* act/omission from *historical* responsibility. If her past design makes her current omission *part* of an ongoing doing, the distinction might collapse here – that’s the pressure point.\]

