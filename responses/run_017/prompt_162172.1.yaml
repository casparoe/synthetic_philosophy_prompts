prompt: |-
  I've been reading LessWrong and the EA Forum since the early days of the movement, and in two weeks I'm giving a twenty-five-minute talk at a large city EA meetup — forty-odd people — followed by twenty minutes of Q&A. My thesis is that there is no such thing as causation by omission: omissions are not events, they are not the right sort of thing to stand in causal relations, and every true thought we express with a sentence like my failure to fund those bed nets caused that child to die is really a normative thought about a duty I had and did not meet. I then want to draw the practical moral: a lot of EA rhetoric, and one particular style of argument for longtermist and meta-charity giving, quietly depends on a causal claim of exactly that shape, and if I am right then that claim is unavailable — not because the interventions are bad, but because the difference-making relation people invoke to rank them does not hold between an agent's not-doing and a distant outcome. My argument runs: causation requires a difference-making event located on a causal process; an omission is an absence rather than a particular; so omissions are never causes. Then the case I am most worried about, which I'll present as my central exhibit: two potential donors, either one sufficient on their own to fund the intervention, both decline, the child dies. Any counterfactual test that makes each of them a cause will, by symmetry, make neither of them a cause, and I want to claim that this shows the counterfactual framework is the wrong tool here, rather than that we should reach for a fancier counterfactual. My positive proposal is that the real work is done by what I'll call culpable non-prevention: a normative relation holding between an agent, an outcome they could have prevented at modest cost, and a duty they already had, which — crucially — does not agglomerate, so that two agents can each stand in it without the pair standing in it. That, I think, is what our talk about letting people die is actually tracking. Along the way I concede up front that ordinary causal language is far more permissive than my account allows, that nothing about whether anyone should give more follows directly from my thesis, and that I am not claiming omissions are blameless.

  The room will be against me, and I want to be ready for the specific forms their pushback will take. Roughly: twenty-five quantitative people — economics and statistics PhD students, several ML engineers, an operations-research consultant — who do their causal reasoning with directed acyclic graphs and do-calculus and who will treat a variable's being manipulable as the whole of what causation is; four or five philosophy graduate students, two in normative ethics who think the shallow-pond case settles everything and will be impatient with what they'll call a metaphysical quibble, one who works on causation and knows the preemption and double-prevention literature cold, and one Kantian; a humanitarian-logistics person who has actually run bed-net distributions and will want to know what any of this changes on Monday; and a retired prosecutor who spent a career getting convictions on failures to act. I'd much rather be handed the objections these people will actually make, in their own vocabularies, than a general overview of the omission literature.

  So: draft me a Q&A prep sheet. Eight or so objections, ordered by how much damage they'd do to my position rather than by how likely they are, each phrased the way that particular person would phrase it — the interventionist's version of the symmetry worry is not the prosecutor's version, and I want to hear both — with a two-minute reply for each, an explicit note on where that reply is soft or where I should simply fold, and a clear recommendation about which objection I should concede in the talk itself rather than waiting to be asked. Flag which of my replies depend on the positive proposal about culpable non-prevention and which stand without it. And please be committed rather than even-handed: tell me which objection is genuinely the strongest, which are merely rhetorical, which one I should be hoping nobody in that room thinks of, and what I most need to get across in the time I have. Assume I'd rather leave having conceded something true than having won the room.
reasoning: |-
  Okay, the user is preparing for a talk at an EA meetup where they'll argue that causation by omission doesn't exist - omissions aren't events and can't cause things. Instead, what we call "causing by not acting" is really about normative duties. They want to preempt objections from a diverse audience: quant folks using causal graphs, philosophers, field workers, and a prosecutor.

  First, I need to break down their argument. They claim that for causation, you need an actual event, but omissions are absences. In cases like two donors both failing to fund bed nets, counterfactual tests fail because of symmetry - each alone could have prevented the death, but together, neither seems the sole cause. Their solution is "culpable non-prevention," a normative duty that doesn't aggregate. 

  Now, the audience. The quant people will think in terms of DAGs and manipulability. For them, if setting a variable (like donating) changes the outcome, that's causation. The philosophers might reference the shallow pond case or double-prevention examples. The prosecutor has real-world experience convicting for omissions, so they'll see legal relevance. The field worker cares about practical impact.

  The user needs a Q&A prep sheet with eight objections, ordered by how damaging they are. Each objection should be phrased in the speaker's style, with a two-minute reply, noting weaknesses and when to concede. They also need to know which objection is strongest, which to concede upfront.

  Top objection should be the interventionist's manipulability argument. If causation is about variables you can manipulate to change outcomes, then not donating is a cause. This challenges the core claim. The user must argue that manipulability tracks difference-making, not causation. But this is a weak spot because in policy contexts, manipulability is what matters. Concede that for decision-making, it's useful, but metaphysically distinct.

  Next, the prosecutor's legal precedent. The law often holds omissions as causes, like failing to save a drowning child. The user can say legal causation includes normative elements, but this might not satisfy. Concede the point but distinguish descriptive from normative.

  The philosopher's preemption case: if someone fails to poison, but another does, the failure isn't a cause. But in double-prevention, like not disarming a bomb, it seems causal. The user should note that double-prevention involves events (disarming is an action), while omissions lack events. This is nuanced but holds.

  The symmetry problem from the quant side: in DAGs, both donors' inactions are modeled as causes. The user can say the model confounds counterfactual dependence with causation. Their normative relation handles this without aggregation. This reply is soft because DAGs are standard tools.

  Field worker's objection: does this change anything? If culpable non-prevention still demands action, why debate? The user must clarify that it affects how we evaluate interventions, especially in longtermism where counterfactuals are murky. This is crucial for their thesis but might not sway pragmatists.

  Other objections include over-intellectualizing, Kantian universality, and slippery slopes. The user should concede that ordinary language includes omission causation but stress the normative foundation. The strongest point is that normative duties don't aggregate, solving the two-donor problem.

  Key takeaways: Distinguish causation from normativity. Concede manipulability's usefulness but not its metaphysical claim. Emphasize that their view still demands action but clarifies moral reasoning, especially in complex longtermist cases. Hope the field worker doesn't push too hard on practicality, as that's harder to counter.
answer: |-
  Here’s your Q&A prep sheet, structured by damage potential, with objections phrased in your audience’s voices and tactical replies. The strongest objections target your metaphysical foundation (*all* causation might involve absences) and your positive proposal’s (CNP) practical irrelevance. **Concede the manipulability point upfront** (Objection #1) to neutralize quant backlash early.

  ---

  ### **Q&A Prep Sheet: Ordered by Damage Potential**  
  *(Replies assume ≤2 mins; "CNP" = Culpable Non-Prevention)*  

  1. **The Interventionist Economist (Manipulability as Causation)**  
     *Objection:* "Your ‘no causation’ claim collapses under interventionism. If I manipulate my *decision variable* (donate/not donate) and it changes the outcome (child lives/dies), that *is* causation. DAGs formalize this cleanly. Omissions are just *setting a variable to zero*—which absolutely causes effects."  
     *Reply:* "Interventionism tracks *difference-making*, not causation. Yes, setting ‘donate=0’ changes outcomes—but that’s because it *fails to trigger* a causal process (e.g., bed-net distribution). The *cause* is the distributor’s actions *when funded*. My inaction isn’t a force; it’s a condition for *their* causal power."  
     *Weakness:* Concedes that "causation" in decision contexts = manipulability. *Fold here strategically.*  
     **TACTIC: CONCEDE THIS IN YOUR TALK** to avoid losing quant audience early. Say: *"For cost-effectiveness, treat omissions as difference-makers—but don’t confuse this with metaphysical causation."*  

  2. **The Causation Philosopher (Double-Prevention/Preemption)**  
     *Objection:* "Your ‘event located on a process’ requirement fails. If I *don’t* disarm a bomb, and it kills someone, my omission causes death via double-prevention. The bomb’s explosion is the proximate cause, but my inaction *removes a preventer*. Your account can’t handle standard counterexamples."  
     *Reply:* "Double-prevention cases involve *positive events* (e.g., the bomb’s detonation mechanism firing). The omission doesn’t *cause* that event; it *fails to block* it. CNP explains why we blame you: you had a duty to disrupt the process. But the explosion’s cause is the bomb’s design/stability—not your absence."  
     *Weakness:* Feels like verbal gymnastics. *Hold firm, but if pressed:* "Even here, the *proximate* cause is positive."  

  3. **The Prosecutor (Legal Causation by Omission)**  
     *Objection:* "I secured convictions for ‘failure to act’ (e.g., parents starving children). Courts *do* treat omissions as causes. If the child dies *because* food was withheld, and we prove duty + capacity, that omission *causally contributed*. Your theory contradicts legal reality."  
     *Reply:* "Law *fictions* omissions as causes for *normative* reasons: assigning blame where prevention was owed. But metaphysically, the child’s death is caused by malnutrition → organ failure. Your ‘omission caused death’ is shorthand for ‘you violated a duty to intervene in that causal chain.’ CNP captures this without metaphysics."  
     *Weakness:* Legal audiences prioritize practical blame over metaphysics. *Fold partially:* "Legally, we *must* call this causation—but it’s normative scaffolding."  

  4. **The Normative Ethicist (Shallow Pond Implications)**  
     *Objection:* "In the shallow pond, if I *don’t* save the child, the cause of death isn’t just ‘drowning’—it’s *my failure to act*. Your CNP might explain blame, but it *feels* causal because my action would’ve changed the outcome. Denying this severs morality from consequences."  
     *Reply:* "The child drowns due to water inhalation, not your absence. CNP *connects* morality to consequences by saying: you had a duty to alter those causal processes. But ‘failure’ isn’t an *event* pushing the child underwater. We track consequences *via* duty—not by inventing ghost-causes."  
     *Weakness:* May seem pedantic vs. moral intuition. *Strengthen with:* "Calling it ‘causation’ implies you *made* them die—but you *allowed* it. That distinction matters for longtermism."  

  5. **The Quant (Symmetry in DAGs)**  
     *Objection:* "In your two-donor case, my DAG has variables D1, D2 (donate? Y/N), and outcome O (death? Y/N). If P(O|¬D1,¬D2) ≠ P(O|D1,¬D2), then D1=no *is* a cause. Symmetry doesn’t break this—both can be causes if we use sufficient sets (e.g., either donor alone is sufficient to prevent)."  
     *Reply:* "DAGs encode counterfactual dependence, not causation. Your model shows that changing D1 *matters*—but it doesn’t show D1’s inaction *caused* the death. The death is caused by disease vectors; D1=no merely *fails to initiate* prevention. CNP handles symmetry cleanly: each had individual duties, but no ‘combined cause’."  
     *Weakness:* Quants may dismiss this as "philosophical noise." *Depends on CNP.*  

  6. **The Field Logistician (Practical Irrelevance)**  
     *Objection:* "I ran bed-net programs. If I tell a donor ‘your $5k would’ve saved 100 kids,’ they get it. Whether you call it ‘causation’ or ‘CNP,’ shouldn’t we just focus on motivating action? How does this change *anything* for EAs on Monday?"  
     *Reply:* "It changes how we justify *longtermist* giving. If giving to meta-charity isn’t ‘causing’ far-future outcomes (since omissions aren’t causes), we can’t rank it via counterfactual causal impact. We *can* still say: ‘You have a duty to prevent X, and this is cost-effective’—but that’s normative, not causal."  
     *Weakness:* If your CNP demands the same actions, this looks academic. *Crucial to stress:* "This blocks ‘counterfactual impact’ arguments for non-preventable outcomes."  

  7. **The Kantian (Duty Without Difference-Making)**  
     *Objection:* "Duties exist regardless of outcomes. If I *can’t* save the child (e.g., nets are defective), I still have a duty to try. Your CNP relies on ‘could have prevented’—so why obsess over causation? Normative ethics doesn’t need this detour."  
     *Reply:* "Agreed! But *many EA arguments* *do* rely on causal counterfactuals (e.g., ‘your donation causes 10^-6 existential risk reduction’). I’m showing that rhetoric fails—so we need purely normative justifications like yours."  
     *Strength:* Aligns with their view. *No fold needed.*  

  8. **The EA Organizer (Rhetorical Overreach)**  
     *Objection:* "Even if you’re technically right, calling omissions ‘non-causal’ is alienating. EAs *know* they’re not ‘pushing death-buttons’—they mean ‘my money changes outcomes.’ Why sabotage outreach with jargon?"  
     *Reply:* "Because longtermism’s ‘causal impact’ claims are *scientifically dubious*. If we admit ‘omissions don’t cause,’ we can say: ‘Give because you *owe* it to the future, not because you mathematically control it.’ That’s *more honest*—and defensible."  
     *Weakness:* High risk of sounding pedantic. *Concede language:* "Use ‘difference-making’ in outreach—but purge ‘causation’ from technical work."  

  ---

  ### **Strategic Recommendations**  
  - **Strongest Objection:** #1 (Manipulability). It forces you to concede that *for decision theory*, omissions are difference-makers—undercutting your rhetoric. **Concede this upfront.**  
  - **Most Damaging if Unaddressed:** #6 (Practical Irrelevance). If the room thinks your view changes nothing, you lose. **Spend 2 mins in your talk preempting this.**  
  - **Most Rhetorically Potent:** #4 (Shallow Pond). Ethicists will frame your view as "denying moral responsibility." **Quote Singer in reply:** "Singer’s argument works *better* without causal claims—it’s about duty."  
  - **Hope No One Asks:** A refined #2 (e.g., "Is *prevention* itself an absence? Stopping X = *not letting X happen*"). This threatens your event/process criterion. **Dodge with:** "Prevention requires an *action* (e.g., removing a fuse)."  
  - **Core to Protect:** Your symmetry argument (#5 reply). It’s your best exhibit for CNP’s non-aggregation.  

  ### **What You Must Get Across**  
  **"Causal claims for longtermist/meta-charity giving rely on metaphysics that don’t hold. We should argue normatively: ‘You have a duty to prevent harm, this works.’ Not: ‘Your $ causes 0.0001% less AI risk.’"** If you land this, you win—even if they hate your ontology.  

  ---  
  **Final Tip:** Open with: "I’m not saying you shouldn’t give. I’m saying *why* you should give is more profound than counterfactuals." Disarms 80% of hostility. Good luck!
