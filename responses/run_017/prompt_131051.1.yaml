answer: |-
  1. **Formalize population-dynamic models with welfare currencies (replaceability upstream)**  
  This must precede empirical estimates because the "compensation coefficient" and choice of welfare unit (deaths prevented vs. cohort-slots stabilized) dictate what evidence matters. If models show interventions consistently alter suffering-per-biomass (not just headcount) under plausible ecology, it rises; if niche saturation dominates, it falls sharply.

  2. **Map valence-asymmetry hypotheses to neural/comparative evidence**  
  Tractable via synthesis: catalog minimal circuits for positive states across taxa and test if insects lack prerequisites. Crucial because sign-flip risk demands priority over magnitude uncertainty. If conserved pathways for positive valence appear absent in key orders, this jumps to #1; if homologs are found, it drops.

  3. **Design robustness-first decision rules for tail-dominated EV**  
  Prioritize over probability-narrowing: with uncertainty spanning orders of magnitude, robust rules (e.g., "avoid actions harmful if sentience probability >10^-12") yield actionable heuristics now. If rules can be made legible to regulators without sacrificing robustness, it rises; if all rules require implausible precision, it falls.

  4. **Synthesize sentience markers across entomology for decision-relevance**  
  Focus literature review on traits that resolve valence/replaceability model uncertainties (e.g., juvenile behavioral plasticity for replaceability, opioid systems for valence). If syntheses reveal decisive patterns (e.g., universal nociception without reward homologs), it rises; if inconclusive across taxa, it drops.

  5. **Model regulatory/political leverage points for insect welfare arguments**  
  Identify which bodies (e.g., EU pesticide regulators) have tractable decision architectures; test how valence/replaceability framings affect policy uptake. If specific actors prove sensitive to robustness arguments or suffering-per-biomass metrics, it rises; if all require settled sentience probabilities, it falls.
