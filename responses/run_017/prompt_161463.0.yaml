answer: |-
  ### 1. Exam Question  
  **Final Paper Question: Presentism in Historiography**  

  Historians face accusations of "presentism" — imposing present standards on the past — but this term conflates distinct practices. Using the two cases below, assess presentism by:  
  1. **Distinguishing four kinds**:  
     - **Moral-evaluative**: Appraising past acts by current moral norms.  
     - **Epistemic**: Judging past agents by knowledge unavailable to them.  
     - **Teleological**: Explaining past events by their future outcomes.  
     - **Agenda**: Selecting topics based on present concerns.  
     For each case, identify which kind(s) are relevant and whether they are objectionable, explaining similarities/differences.  
  2. **Testing the *Retrospective Parity Principle*** (RPP): "Apply to past agents only standards you would accept from a better-informed 22nd-century historian judging you." Is it a genuine constraint? Does a *strong reading* (forbidding condemnation if we cannot foresee future judgments) paralyze ethics? Does a *weak reading* (allowing condemnation only when confident our acts won’t be condemned) collapse into presentism? Is the principle unstable?  
  3. **Addressing later vocabulary**: Is using terms like "structural racism" for pre-civil rights America objectionable presentism or legitimate description? What does the answer depend on?  
  4. **Bridging the act-agent gap**: Does excusing agents who "could not have known better" escape presentism when applied to *itself*? Why or why not?  

  **Cases (facts stipulated)**:  
  - **A**: An elected legislator in a slaveholding society (late 1850s) votes to extend chattel slavery, defending it with religious arguments. Abolitionist counterarguments (secular and religious) were widely circulated and known to them.  
  - **B**: A public-health official licenses a sedative for pregnant women using then-available evidence. A causal link to severe birth defects is established years later; no information at the time could have revealed this.  

  **Rubric**:  
  - Time: 45 minutes. Word limit: 900. Marks: 25.  
  - **No credit for**: Defining presentism generally, naming authors/texts, or discussing metaphysical presentism (only present entities exist). Address the RPP and cases as specified.  

  ---

  ### 2. Model Answer (798 words)  

  Presentism is not one flaw but a cluster, and the four kinds demand separate verdicts. I argue moral-evaluative presentism is *legitimate* when past agents had access to counterarguments; epistemic presentism is *illegitimate*; the RPP is *unstable*; later vocabulary is valid if it captures historical realities; and the "could not have known" excuse, while self-applied, is a benign universal standard. Cases A and B reveal the critical distinctions.  

  In **Case A**, the legislator extends slavery despite accessible abolitionist arguments. Here, *moral-evaluative presentism* (condemning the act by current norms) is unobjectionable. The availability of counterarguments means condemnation relies on standards *within their reach*, not anachronistic ones. *Epistemic presentism* is irrelevant: we judge the legislator by arguments of their era, not future knowledge. *Agenda presentism* (studying slavery due to present racial justice concerns) is legitimate; history must engage enduring problems. *Teleological presentism* (framing the vote as a step toward Civil War) risks distortion if it implies inevitability but is acceptable if contextually grounded. Thus, condemning the *act* is justified, and the *agent* is blameworthy because they could have known better.  

  **Case B** differs fundamentally. The official licenses a sedative without foreseeable risks. *Epistemic presentism* (blaming them for unknown birth defects) is objectionable: they lacked access to critical information. *Moral-evaluative presentism* only applies if negligence is alleged, but stipulated facts rule this out. *Agenda presentism* (studying the case for modern regulatory insights) is valid. Here, neither the act nor the agent is condemnable because knowledge was genuinely unavailable.  

  The **RPP** fails as a constraint. Its *strong reading* forbids condemning past acts if we cannot guarantee future historians won’t condemn us (e.g., for fossil fuel use). This paralyzes moral judgment, rendering historical ethics impossible. The *weak reading* permits condemnation only when "confident" our acts won’t be condemned. But confidence is arbitrary: we might condemn the 1850s legislator assuming future agreement on slavery, yet this assumes our norms are final—a presentist projection. The RPP thus oscillates between prohibiting all condemnation or legitimizing it capriciously. It is unstable, offering no middle ground.  

  Using **later vocabulary** (e.g., "structural racism" for pre-civil rights eras) is not inherently presentist. If the term accurately describes a pattern existing *avant la lettre* (e.g., racial hierarchies in slavery), it illuminates reality. It becomes objectionable only if it projects modern *connotations* or *motivations* onto past actors—for example, assuming 1850s legislators understood "racism" as a systemic concept. Legitimacy depends on precision: does the term clarify without distorting context?  

  The **act-agent gap** exposes a paradox. Excusing agents who "could not have known better" (e.g., the official in Case B) is itself a present standard projected backward. Yet this projection is benign because it embodies a transhistorical principle: blame requires epistemic access. We self-apply it willingly—we would want future historians to judge us by what we *reasonably* knew. Crucially, it *fails* for Case A: the legislator *could* have known, so blame holds. The excuse thus escapes self-refutation by being universally equitable.  

  The honest historian is entitled to condemn past acts when agents ignored accessible moral resources, to use later vocabulary that reveals hidden realities, and to reject the RPP—while excusing agents trapped by their epistemic limits.  

