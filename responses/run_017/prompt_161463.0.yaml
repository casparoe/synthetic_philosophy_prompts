  **Mark withholding**:  
  - **No marks** for defining presentism generically, naming theorists, or metaphysical presentism.  
  - **No marks** for asserting presentism is "unavoidable" unless critiquing the inference from situatedness to incurability.  
  - **No marks** for the act/agent gap without explaining *why* they come apart (e.g., epistemic access).  

  **Script characterizations**:  
  - **First-class (70+%)**: Distinguishes presentism types precisely; tests RPP’s instability; resolves later vocabulary with nuance; integrates cases; exposes self-application of the excuse.  
  - **Upper-second (60-69%)**: Identifies types but applies unevenly; describes RPP without full instability analysis; mentions vocabulary/excuse but superficially.  
  - **Third-class (40-49%)**: Conflates presentism types; ignores RPP/vocabulary; cases not analyzed; relies on clichés.  

