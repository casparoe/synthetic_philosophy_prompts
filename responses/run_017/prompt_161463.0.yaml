  | 2. Critically tests RPP: strong/weak readings and instability | 7 | Shows strong reading causes paralysis (forbids all condemnation); weak reading permits arbitrary condemnation; concludes RPP is unstable. | Describes RPP but doesn’t contrast readings or address instability; accepts/rejects it uncritically. | Bland compromise without analysis (failure mode iv). |
  | 3. Resolves later vocabulary issue with conditions | 5 | Argues legitimacy depends on accuracy/non-distortion (e.g., "structural racism" acceptable if pattern existed); notes risks of projecting modern nuances. | Asserts it is always presentist or always legitimate without nuance. | Ignoring concept projection (omission of demand 4). |
  | 4. Addresses self-application of "could not have known" excuse | 4 | Shows the excuse is a present standard but benign due to universality; correctly applies to cases (blame in A, excuse in B). | States the excuse but ignores self-application or applies it inconsistently. | Unavoidability argument without critique (failure mode iii). |
