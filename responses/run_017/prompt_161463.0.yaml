  | 3. Later vocabulary: legitimacy conditions | 5 | Argues that using later terms is not inherently objectionable if it accurately describes past realities without distortion, and explains what this depends on (e.g., historical accuracy, avoiding modern connotations). | Simply asserts it is presentist or not without nuance; doesn't specify conditions. | Not addressing the projection of concepts (omission of point 4). |
  | 4. Gap between act/agent and self-application of "could not have known" | 4 | Shows the excuse is a present standard but benign because it reflects a universal principle of fairness; applies it correctly (blame in A, not in B) and addresses self-application. | States the excuse but doesn't explore self-application or applies it inconsistently. | The quick argument that presentism is unavoidable (failure mode iii) or bland compromise (iv). |
  | 5. Coherent structure and case integration | 3 | Essay is well-organized, uses cases to illustrate distinctions, and builds a consistent argument throughout. | Disjointed; cases are not well integrated; argument is inconsistent or repetitive. | Summary of standard canon without original analysis (all failure modes). |

  **Additional Paragraphs:**

  **How marks are withheld:**  
  No marks are awarded for defining presentism in general, for naming authors or texts, or for discussing metaphysical presentism. The standard anti-presentist canon (e.g., against Whig history) receives no credit unless it is critically engaged in service of the argument. The argument that all history is written from the present and thus presentism is unavoidable (failure mode iii) earns no marks unless it is itself criticized as a non sequitur (i.e., that situatedness does not imply incurability). Similarly, the bland compromise (failure mode iv) that condemns the act but excuses the agent without explaining the gap is insufficient and receives no credit for that point.

  **Script Class Characterizations:**  
  - **First-class (70+%)**: Distinguishes the kinds of presentism with precision, critically assesses the RPP showing its instability, resolves the later vocabulary issue with nuance, and integrates the cases into a coherent argument that addresses the self-application problem.  
  - **Upper-second (60-69%)**: Distinguishes presentism kinds and applies them to cases but with less precision; addresses RPP and self-application but with some gaps; later vocabulary discussed but not fully developed.  
  - **Third-class (40-49%)**: Shows basic understanding of presentism but conflates kinds; superficial treatment of RPP; little or no attention to later vocabulary or self-application; cases not well analyzed.  

