prompt: |-
  I teach a final-year undergraduate seminar on the philosophy of history, and I am drafting the last question of the final paper: one essay, 45 minutes, a 900-word ceiling, marked out of 25. The topic is presentism in historiography — whether historians can escape the standards of their own time — and I need a question that cannot be passed by reciting the standard anti-presentist canon.

  The failure modes I want to design against, all of which I have seen in previous years: (i) a summary of the polemic against Whig history, plus the observation that the past should be understood on its own terms; (ii) a summary of the intentionalist case against anachronism in the history of ideas, offered as if it settled moral appraisal too; (iii) the quick argument that since all history is written from the present, presentism is unavoidable and therefore not a fault; (iv) the bland compromise that we may condemn the practice while excusing the agent, asserted without any account of what makes the two come apart. A question that only invites any of these is useless to me.

  Here is what the question has to force, and I would rather it force these through a concrete demand than through a list of sub-questions:

  1. A separation of at least four things that get called presentism: moral-evaluative presentism (appraising past agents by our norms), epistemic presentism (appraising them by what we now know and they could not), explanatory or teleological presentism (explaining a past episode by where it ended up), and agenda presentism (choosing what to study because of present concerns). The student must say which of the usual objections actually bites against which, and must not assume a single verdict transfers across all four.

  2. The gap between judging an act and blaming an agent, and whether the standard escape hatch survives being applied to itself. The claim that agents who could not have known better are not blameworthy is itself a normative claim we hold now and project onto the past; I want students either to show why that self-application is benign or to give up the escape hatch.

  3. A principle to test rather than to apply. Please build the question around a principle stated in the paper, to be assessed rather than assumed: the *Retrospective Parity Principle* — apply to past agents only those standards you would be willing to have a better-informed historian of the twenty-second century apply to you. Students should be made to consider whether this is a genuine constraint, whether the strong reading of it forbids condemning anything at all (since we cannot foresee the downstream consequences of what we now regard as innocuous), whether the weak reading of it turns out to permit exactly the moral condemnations it was meant to block, and whether the principle is therefore unstable rather than a tidy middle way.

  4. The projection of later vocabulary. Ask whether describing an earlier practice with a concept or term that did not then exist — the vocabulary of structural racism, or genocide, for instance — is objectionable presentism or merely a description of something that existed avant la lettre, and what the answer depends on.

  Two cases should be stipulated in the question, with all needed facts given, so that nothing has to be looked up and nothing turns on contested history: (A) an elected legislator in a slaveholding society who, in the late 1850s, votes to extend chattel slavery and defends it in explicitly religious language, at a time when abolitionist arguments are in wide circulation; (B) a public-health official who licenses a sedative for use by pregnant women on the evidence available at the time, where the causal link to severe birth defects is not established until years later. The question should require the student to say, for each case, which kind of presentism is in play and whether it is objectionable there, and why the two cases come out differently or the same.

  The question should also be self-contained: tell candidates explicitly that no credit is given for naming authors or texts, and warn them not to trade on the other sense of presentism, the thesis in the metaphysics of time that only present entities exist, since it has no bearing here.

  Deliverables, in this order:

  1. The question exactly as it would appear on the paper, including the two cases, the statement of the Retrospective Parity Principle, and the rubric line about time, word ceiling, and marks.

  2. A model answer of roughly 800 words that takes a determinate position rather than balancing considerations, and that ends with one sentence stating what, if anything, the honest historian is left entitled to do.

  3. A marking scheme built on five must-hit points whose marks sum to 25, delivered as a table with these columns: Point | Marks | What an A answer does | What a B answer does instead | The error this point is designed to catch. Below the table, give two short paragraphs: one on how marks are withheld (in particular, nothing for defining presentism, nothing for the unavoidability argument unless its inference from situatedness to incurability is itself criticised), and one giving a one-line characterisation each of a first-class, an upper-second, and a third-class script.

  4. A JSON object summarising the item, with exactly these fields: "topic" (string), "level" (string), "time_minutes" (number), "word_limit" (number), "total_marks" (number), "crux" (one sentence naming the single move that separates a first from a 2:1), "senses_distinguished" (array of objects with "label", "one_line_gloss", "verdict" from legitimate/contested/illegitimate, and "why"), "must_hit_points" (array of objects with "point", "marks", "a_answer", "b_answer", "error_caught"), "rpp_readings" (array of objects with "reading", "consequence", "stable" as boolean), "disqualifying_answers" (array of strings, each naming a move that earns no credit and why).
reasoning: |-
  We are constructing a final exam question for an undergraduate seminar on the philosophy of history, focused on presentism in historiography. The goal is to design a question that avoids common shallow responses and instead forces students to engage deeply with the nuances of presentism, distinguishing its types and grappling with the Retrospective Parity Principle (RPP). We also include two stipulated cases to ground the discussion.

  The question must:
  - Distinguish at least four types of presentism and show that objections apply differently to each.
  - Address the gap between judging an act and blaming an agent, and the self-application of the "could not have known better" excuse.
  - Test the Retrospective Parity Principle (RPP) as a principle, exploring its strong and weak readings and whether it is unstable.
  - Discuss the use of later vocabulary to describe past practices.

  The two cases:
  (A) A legislator in a slaveholding society in the late 1850s who votes to extend slavery and defends it with religious arguments (when abolitionist arguments were known).
  (B) A public-health official who licenses a sedative for pregnant women based on then-available evidence, but which later is found to cause birth defects.

  We will also provide:
  1. The exact exam question.
  2. A model answer (about 800 words) taking a clear stance and ending with what the historian is left entitled to do.
  3. A marking scheme with 5 must-hit points (summing to 25) and descriptions for A and B answers, plus how marks are withheld and one-line characterizations of script classes.
  4. A JSON object with specified fields.

  Let's break down each deliverable.

  ### 1. The Exam Question
  We need to write the question as it would appear. It should be self-contained, include the two cases, state the RPP, and give the rubric.

  **Draft Question:**

  **Final Paper Question: Presentism in Historiography**

  Historians are often accused of "presentism" – the imposition of present-day standards, values, or knowledge onto the past. But presentism is not a single error: it comes in several forms, and objections that apply to one may not apply to another. Consider the following four kinds:

  - **Moral-evaluative presentism**: Appraising past agents by our moral norms.
  - **Epistemic presentism**: Appraising past agents by what we now know and they could not.
  - **Teleological presentism**: Explaining a past episode by where it ended up (e.g., as a step toward a present outcome).
  - **Agenda presentism**: Choosing what to study because of present concerns.

  Additionally, consider the *Retrospective Parity Principle* (RPP): "Apply to past agents only those standards you would be willing to have a better-informed historian of the twenty-second century apply to you."

  Now, using the two cases below (all facts given are stipulated and uncontested), write an essay that:

  1. For each case, identifies which kind(s) of presentism are at issue and whether they are objectionable, explaining why the cases might be treated differently or similarly.
  2. Assesses the RPP as a constraint on moral-evaluative presentism: Is it a genuine constraint? Does a strong reading (forbidding condemnation if we cannot foresee future consequences) lead to paralysis? Does a weak reading (allowing condemnation only when we are confident our acts will not be condemned) permit too much? Is the principle unstable?
  3. Addresses whether using a later vocabulary (e.g., "structural racism" or "genocide") to describe an earlier practice is presentist and, if so, whether it is objectionable.
  4. Considers the gap between judging an act and blaming an agent: Does the claim that past agents "could not have known better" (and thus are not blameworthy) itself escape presentism? Why or why not?

  **The Cases:**

  - **Case A**: In a slaveholding society in the late 1850s, an elected legislator votes to extend chattel slavery and defends this vote in explicitly religious language. At the time, abolitionist arguments (both secular and religious) were in wide circulation and known to the legislator.
  - **Case B**: A public-health official, acting on the best available evidence at the time, licenses a sedative for use by pregnant women. Years later, a causal link to severe birth defects is established. The official had no access to information that could have revealed this link at the time of licensing.

  **Instructions:**
  - Write one essay of no more than 900 words.
  - Time allowed: 45 minutes.
  - This question is marked out of 25.
  - **Important**: Do not spend time defining presentism or discussing the metaphysical thesis that only the present exists (it is irrelevant here). No credit will be given for naming authors or texts; the argument must stand on its own.

  ---

  ### 2. Model Answer (approx. 800 words)
  We need a model answer that takes a clear stance. Let's structure it:

  - Introduction: Presentism is multifaceted; we must distinguish types. The RPP is a test case for moral evaluation.
  - Case A: Moral-evaluative presentism is legitimate in condemnation? The agent had access to abolitionist arguments. Epistemic presentism doesn't apply because the moral arguments were available. Agenda presentism might be legitimate if studying slavery because of present concerns. Teleological presentism might be problematic if we see it as leading to the Civil War.
  - Case B: Epistemic presentism is the main issue. Condemning the official for what they didn't know is objectionable. Moral-evaluative: if we think they were negligent, but the stipulation says evidence was lacking. Agenda presentism: studying this because of present drug safety concerns is legitimate.
  - The RPP: Strong reading paralyzes moral judgment because we can't know the future. Weak reading allows condemnation when we are confident, but that confidence may be unwarranted. The principle is unstable because it either forbids all condemnation or allows arbitrary lines. We might reject it.
  - Later vocabulary: Using "structural racism" for pre-civil rights America is not presentist if it accurately describes a reality that existed, even if the term didn't. It becomes presentist only if we project our full conceptual framework without sensitivity to context.
  - Gap between act and agent: The "could not have known" excuse is itself a present moral standard. But it is benign because it reflects a universal principle of fairness. However, in Case A, the legislator could have known, so blame is appropriate.
  - Conclusion: The historian is entitled to moral evaluation when the past agent had access to the relevant moral arguments, and to using later vocabulary if it illuminates without distortion. The RPP fails as a constraint.

  **Model Answer:**

  Presentism in historiography is a hydra-headed problem; to condemn or condone it wholesale is to miss crucial distinctions. I argue that moral-evaluative presentism is legitimate when past agents had access to the moral resources we now use, that epistemic presentism is generally illegitimate, and that the Retrospective Parity Principle (RPP) fails as a stable constraint. The two cases illustrate this.

  In Case A, the legislator voting to extend slavery in the 1850s is a candidate for moral condemnation. Moral-evaluative presentism here is not objectionable because abolitionist arguments were available: the legislator could have known better. Epistemic presentism does not apply, as we are not judging him by later empirical knowledge but by moral arguments contemporary to him. Agenda presentism (studying slavery because of present concerns about racial injustice) is legitimate, as it addresses persistent issues. Teleological presentism, if we explain his vote as leading to civil war, risks distorting by hindsight but may be acceptable if we avoid implying inevitability. Thus, condemning the act is justified, and the agent is blameworthy because he had the opportunity to know.

  Case B is different. The public-health official acted on the best available evidence. Epistemic presentism would be objectionable if we blamed her for not knowing about the birth defects; she could not have known. Moral-evaluative presentism might apply if we suspect negligence, but the stipulation rules that out. Agenda presentism (studying this case for modern drug safety) is unobjectionable. Here, we should not condemn the act or the agent.

  The RPP purports to constrain moral evaluation: only apply standards you would accept from the future. But it is deeply unstable. On a strong reading, it forbids all condemnation because we cannot know how future historians will judge our actions (e.g., eating meat might be condemned). This paralyzes moral judgment. On a weak reading, it allows condemnation only when we are confident our acts won't be condemned. But confidence is arbitrary: we might condemn the legislator because we think future historians will agree, but that assumes our moral views are final. The RPP either prohibits all moral evaluation or collapses into presentism itself. It is not a viable middle way.

  What of using later vocabulary, like "structural racism," for past eras? This is legitimate if the concept accurately describes a pattern that existed, even if the term is modern. Calling antebellum slavery "structural racism" is not presentist; it is recognizing a reality avant la lettre. It becomes objectionable only if we ignore historical context or project modern nuances.

  The gap between judging an act and blaming an agent is bridged by the condition of "could have known." The excuse that past agents "could not have known" is itself a present standard, but it is benign because it is a principle of fairness we apply universally. However, in Case A, this excuse fails because the legislator could have known; in Case B, it holds. The self-application of this standard is justified as a minimal condition of equitable judgment.

  Thus, the honest historian is entitled to condemn past acts when the agents had access to the moral resources for knowing better, to use later vocabulary when it illuminates without anachronism, and to reject the RPP as unworkable. We are not trapped in our present; we can extend fairness to the past while holding it accountable where it had the means to do better.

  (Word count: approx. 600 – we can expand in the final version to 800)

  **Expanded Model Answer (approx. 800 words):**

  Presentism in historiography is often treated as a monolithic sin, but this view is itself a failure of historical sensibility. The charge of presentism must be disaggregated into at least four distinct kinds: moral-evaluative (imposing our moral norms), epistemic (imposing our knowledge), teleological (explaining by outcomes), and agenda (selecting topics by present concerns). Each demands separate assessment, and the Retrospective Parity Principle (RPP) – that we should apply to the past only standards we would accept from the future – offers a test case for moral-evaluative presentism that, upon scrutiny, collapses. The two stipulated cases, A and B, reveal the critical distinctions and the fate of the RPP.

  Case A features an elected legislator in the late 1850s who votes to extend chattel slavery and defends it religiously, despite abolitionist arguments being widely available. Here, moral-evaluative presentism – condemning him by our standards – is legitimate. Why? Because the moral resources to reject slavery were accessible to him: religious and secular abolitionist arguments were in circulation. He is not being judged by knowledge unavailable to him (epistemic presentism), but by arguments he could have engaged with. Thus, the condemnation is not anachronistic. Agenda presentism, if we study such votes because of present concerns about systemic racism, is unobjectionable; history often serves contemporary needs. Teleological presentism, framing his vote as a step toward civil war, is riskier, as it may imply inevitability, but it can be done cautiously. The act of extending slavery is condemnable, and the agent is blameworthy because he had the capacity to know better.

  Case B, the public-health official who licenses a sedative later found to cause birth defects, is different. The official acted on the best evidence available; the causal link was undiscoverable at the time. Epistemic presentism – blaming her for not knowing about the birth defects – is clearly objectionable. She could not have known. Moral-evaluative presentism might apply if we suspect negligence, but the stipulation states that the evidence was lacking, so no negligence occurred. Agenda presentism, studying this case to inform current drug regulation, is legitimate. Here, we cannot condemn the act or the agent because the agent lacked the requisite knowledge.

  The RPP is introduced as a constraint on moral-evaluative presentism: apply only standards you would accept from a future historian. But this principle is unstable. A strong reading forbids condemning any past act because we cannot foresee how future historians might judge our present actions (e.g., driving fossil-fuel cars might be condemned as ecocide). This leads to moral paralysis. A weak reading permits condemnation only when we are confident that future historians will not condemn us for similar acts. But this confidence is arbitrary: we might condemn the 1850s legislator because we assume future historians will share our abhorrence of slavery, but that assumes our moral views are final and correct. The RPP thus either prohibits all moral judgment or reduces to presentism itself, offering no real constraint. It is a false middle way.

  The use of later vocabulary, such as "genocide" for historical events or "structural racism" for pre-civil rights America, is another flashpoint. Describing past realities with terms coined later is not inherently presentist if the concept accurately captures an existing phenomenon. For example, calling the enslavement of Africans in the antebellum US "structural racism" is legitimate; the structure existed, even if the term did not. It becomes objectionable presentism only if we project modern connotations or ignore historical specificity, such as assuming identical motivations or social dynamics.

  Finally, the gap between judging an act and blaming an agent hinges on the "could have known" condition. The standard excuse – that past agents are not blameworthy if they could not have known – is itself a present moral standard we project onto the past. But this projection is benign because it reflects a universal principle of fairness: blame requires knowledge (or access to it). Self-application is justified because we would want future historians to judge us by what we could reasonably know. In Case A, the legislator could have known, so blame is appropriate. In Case B, the official could not, so it is not. This standard is not presentist in the objectionable sense; it is a transhistorical requirement for equitable judgment.

  In conclusion, the honest historian is entitled to moral condemnation of past acts when the agents had access to the moral arguments we now deploy, to the use of later vocabulary when it accurately describes past realities without distortion, and to the rejection of the RPP as unworkable. We are not imprisoned in the present; we can extend fairness to the past while holding it accountable where it had the tools to choose better.

  (Word count: 798)

  ---

  ### 3. Marking Scheme (5 points, 25 marks total)
  We need a table with Point, Marks, What an A answer does, What a B answer does, and the error caught.

  **Must-Hit Points:**

  1. **Distinguishes at least four kinds of presentism and applies them correctly to the cases.** (Marks: 6)  
     - A: Clearly identifies which kind(s) are at issue in each case and why they are/aren't objectionable, noting differences (e.g., moral-evaluative legitimate in A but not B, epistemic not in A but objectionable if applied in B).  
     - B: Lists the kinds but doesn't apply them precisely to the cases or treats them monolithically.  
     - Error caught: Treating presentism as a single error (failure mode i, ii).

  2. **Critically assesses the RPP, showing awareness of strong/weak readings and instability.** (Marks: 7)  
     - A: Explains strong reading (paralysis) and weak reading (arbitrariness), concludes it is unstable and fails as a constraint.  
     - B: Describes the RPP but doesn't explore readings deeply; may accept it uncritically or reject it without analysis.  
     - Error caught: Offering a bland compromise without analysis (failure mode iv).

  3. **Addresses the later vocabulary issue and the condition for legitimate use.** (Marks: 5)  
     - A: Argues that using later terms is legitimate if it captures reality without anachronism, and explains what that depends on (e.g., accuracy, avoiding projection of modern nuances).  
     - B: Simply asserts it is or isn't presentist without nuance.  
     - Error caught: Not addressing the projection of concepts (omission of point 4).

  4. **Explores the gap between act and agent, and the self-application of the "could not have known" excuse.** (Marks: 4)  
     - A: Shows that the excuse is a present standard but argues it is benign because universal; applies it correctly to the cases (blame in A, not in B).  
     - B: States the excuse but doesn't address self-application or does so superficially.  
     - Error caught: The quick argument that presentism is unavoidable (failure mode iii) or the bland compromise without account of the gap (failure mode iv).

  5. **Overall argument structure and case analysis.** (Marks: 3)  
     - A: Coherent, structured essay that uses the cases to illustrate the distinctions and builds a consistent position.  
     - B: Disjointed, or cases are not integrated into the argument.  
     - Error caught: Summary of standard canon without original analysis (failure modes i-iv).

  **Table:**

