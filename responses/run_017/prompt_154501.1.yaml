  The user mentioned consequences like the baseline becoming a resource or owing something weird. The key insight is that utilitarianism now requires perpetual growth. If growth stops, utility drops to zero. But maintaining the baseline without increases provides no utility, yet it's necessary for future gains. This leads to a "utility debt" concept—sustaining the baseline is a cost with no immediate payoff, but necessary for any future utility. 

  Possible ridiculous consequence: To get any utility from the monster, you must first "pay" the baseline without getting utility, then add more. But each increase resets the baseline, so next time you need even more. It's an accelerating treadmill. 

