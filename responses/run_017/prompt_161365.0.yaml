  ## Notes for Applicants (PA-1/N8.3)

  1.  **Purpose:** Form PA-1 facilitates the lawful enactment of specific verbal obligations (Promises, Bets, Formal Undertakings) as per Sections 12-18 of the Speech Act (Administration) Regulations 2012. Only utterances pre-approved via this process carry binding illocutionary force under UK law.
  2.  **Utterance Requirements:**
      2.1 The proposed utterance must be submitted verbatim. Minor deviations (e.g., stuttering, coughing) may invalidate the act. See Supplement PA-1/S for tolerance thresholds.
      2.2 The utterance must employ explicit performative formulas (e.g., "I promise...", "I bet you...", "I undertake to...").
      2.3 The utterance location must be acoustically certified (Form AC-5) and demonstrably non-performative (e.g., not a stage, film set, poetry reading, or within a fictional narrative). Quotations automatically void the act (Regulation 14b).
      2.4 Utterances containing irony, sarcasm, or hypothetical phrasing are inadmissible.
  3.  **Speaker Requirements:**
      3.1 A valid OVT Speaker Licence (Form SL-1) is mandatory. Licences assess competency in performative speech and sincerity calibration modules.
      3.2 The Speaker must declare current Verbal Capacity Solvency. Moratorium or Bankruptcy status precludes new Obligations.
      3.3 The declared intention (Section D, b) is subject to Pre-Utterance Sincerity Screening (PUSS) via approved assessors (List 78/PUSS).
      3.4 Variables (Section C) require pre-submission and approval of *all* potential substitution values. Extemporaneous substitution voids the act.
  4.  **Hearer Requirements:**
      4.1 All intended Hearers must be registered with the OVT Hearer Database (Form HR-2) **at least 28 days prior** to the proposed utterance date. This allows for Counterfoil issuance and uptake propensity assessment.
      4.2 Hearers will be issued a Counterfoil (Form PA-1/CF) corresponding to the application. For the obligation to be binding, the Hearer *must* sign and return the Counterfoil to the OVT within 14 days of utterance confirmation, explicitly acknowledging uptake. Failure to return the signed Counterfoil voids the obligation *ab initio*.
  5.  **Procedure & Timeline:**
      5.1 Submit the completed PA-1 at least 28 days before the proposed utterance date. Expedited processing is unavailable.
      5.2 Upon receipt, OVT will verify Speaker Licence, Utterance compliance, Hearer pre-registration, Location certification, and schedule PUSS.
      5.3 If approved, OVT will issue an Approval Certificate (Form PA-1/APP) and dispatch Counterfoils to Hearers. **The utterance must occur exactly as declared on the date, time, and location specified.** Deviation invalidates approval.
      5.4 Within 24 hours of utterance, the Speaker must file an Utterance Completion Affidavit (Form UCA-1), witnessed by an OVT-approved verifier.
      5.5 Hearers have 14 days from confirmed utterance to return signed Counterfoils.
  6.  **Post-Utterance Compliance:**
      6.1 The fulfilment of the obligation is subject to random or triggered Compliance Audits (Regulation 22).
      6.2 Audits assess adherence to the *exact* terms pre-approved in the utterance and supporting documentation (Section C variables).
      6.3 **Retroactive Voidance:** If a Compliance Audit determines the obligation was breached, or if the Speaker is found to have lacked the requisite intention *at the moment of utterance* (based on post-hoc neural scans or behavioural analysis), the OVT will issue a Notice of Retroactive Voidance (Form NRV-7). This nullifies the illocutionary force of the utterance *as if it had never occurred*, absolving the Speaker of any formal liability arising from the purported obligation.¹
  7.  **Fees:** A non-refundable processing fee of £275 applies. Additional fees for PUSS, Location Certification, and Compliance Audits are payable as incurred. See Fee Schedule OVT/FS/24.

  **Important Notice:** The Office of Verbal Transactions regulates the *illocutionary act* only – the formal undertaking of the obligation through the correctly sanctioned procedure. The OVT takes no responsibility for the *perlocutionary effects* (e.g., hearer disappointment, reliance, emotional distress, financial loss incurred in anticipation) stemming from either the performance, voidance, or non-performance of an Obligation. Such outcomes fall outside the OVT's statutory remit.¹⁾

  ¹ *See S. v. Jones [2019] OVTLR 45, establishing the principle of Retroactive Illocutionary Voidance. The OVT licences the act, not the consequence.*  
  ¹⁾ *Perlocutionary outcomes are considered private matters between parties. Resolution should be sought through civil litigation or mediation, not via the OVT appeals process (Regulation 45(7)).*

  **OVT Records Note:** Since the inception of the Office of Verbal Transactions in 2013, no Form PA-1 application has successfully navigated the entire approval, utterance, counterfoil return, and compliance audit process to result in a sustained, legally binding obligation. Common reasons for rejection/voidance include: Hearer counterfoil non-return (87%), minor utterance deviations (62%), failure of Pre-Utterance Sincerity Screening (49%), location decertification (31%), and Retroactive Voidance following breach (100% of obligations reaching the compliance audit stage). Applicants are advised to manage expectations accordingly.
