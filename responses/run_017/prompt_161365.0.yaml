  ## Form PA-1: Application to Undertake an Obligation (Promise, Bet or Undertaking)
  **Issued by:** The Office of Verbal Transactions (OVT), Directorate of Illocutionary Stability  
  **Version:** 8.3 (Effective 01/04/2024)  
  **Reference:** Speech Act (Administration) Regulations 2012 (as amended)

  **WARNING:** Completion and submission of this form does not constitute a valid Obligation until full approval is granted by the OVT. Any utterance made prior to approval is deemed non-performative and carries no binding force.

  ### SECTION A: APPLICANT DETAILS
  1.  **Full Name of Speaker (Promisor/Undertaker):** ______________________________________________________________________
  2.  **OVT Speaker Licence Number:** ________/________/________ (Mandatory. Apply for Form SL-1 if unlicenced. Processing: 6-8 weeks).
  3.  **National Insurance Number:** _________________________
  4.  **Date of Birth:** ____ / ____ / ________
  5.  **Current Verbal Capacity Status:** ☐ Solvent ☐ Under Moratorium ☐ Bankrupt (Verbal) (Attach Form VC-12 if status not Solvent)

  ### SECTION B: OBLIGATION DETAILS
  6.  **Type of Obligation:** ☐ Promise ☐ Bet ☐ Formal Undertaking (Specify: _________________________)
  7.  **Proposed Date, Time & Location of Utterance:** ____ / ____ / ________ at ____ : ____ hrs. Location: _________________________________________
      *   *(Location must be non-theatrical, non-poetic, non-fictional, and possess OVT-approved acoustic certification. See Notes 2.3, 7.1)*
  8.  **Full Text of Proposed Utterance:** (Verbatim. Use Section C for variables. **No deletions, insertions, or paraphrasing.**)
