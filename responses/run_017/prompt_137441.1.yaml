answer: |-
  That's an exceptionally sharp observation, and you're right to recognize a distinct pattern. This **isn't** just "absence of evidence isn't evidence of absence," nor is it purely Goodhart's Law (which focuses on measure corruption). What you've identified is a **self-obscuring policy** or **evidentiary black hole**, specifically characterized by **Operational Evidence Destruction (OED)**.

  Here's a breakdown and definition:

  ### The Core Pattern: Operational Evidence Destruction (OED)
  *   **Definition:** A policy or intervention that, by its very execution, systematically dismantles, bypasses, or renders ineffective the mechanisms (investigative, procedural, evidentiary) necessary to detect its own failures, errors, or true causal effects. The *operation* of the policy actively *destroys* the potential for gathering the evidence required to evaluate it rigorously.
  *   **Key Mechanism:** The policy action *directly causes* the cessation of inquiry, review, or data generation that would otherwise exist to monitor or audit it.

  ### Why Your Death Penalty Examples Fit Perfectly
  1.  **Post-Execution Innocence Discovery:**
      *   **Policy Action:** Execution.
      *   **Evidence Destroyed:** The *potential* for further investigation into innocence (appeals, DNA testing, media scrutiny, legal advocacy, funding for reinvestigation).
      *   **Mechanism:** Execution terminates the legal person, ends the legal case, disperses resources/focus, and removes the urgent motivation for uncovering error. The *act of execution* kills the investigation. You cannot discover a false positive *after* the action.
      *   **Result:** A systemic inability to quantify the false positive rate (executing the innocent) because the policy destroys the evidence trail.

  2.  **Swift & Certain Deterrence:**
      *   **Policy Action:** Implementing a "swift and certain" execution regime (reduced appeals, faster process).
      *   **Evidence Destroyed:** The *potential* to reliably measure the *causal effect* of the death penalty vs. life imprisonment on deterrence.
      *   **Mechanism:** "Swift and certain" necessitates bypassing the very layers of review and delay that provide time for comparative studies, controls, long-term data analysis, and the natural variation needed to isolate the death penalty's effect from other factors. Implementing the proposed effective version *removes the control group* (long delays) and *introduces confounding variables* (simultaneous reduction in due process). You cannot test the causal claim *without* implementing the risky, irreversible policy at scale, which simultaneously destroys the conditions for clean causal inference.
      *   **Result:** A systemic inability to scientifically validate the core claim of deterrence *for the specific version advocated*, because adopting it erodes the methodological rigor needed for proof.

  ### Are They the Same Thing?
  Yes, fundamentally. Both exemplify **OED**, differing only in the *type* of evidence being destroyed:
  *   **Example 1:** Destroys *retrospective/error-detection evidence* (proof of past mistakes).
  *   **Example 2:** Destroys *prospective/causal evidence* (proof of future effects).
  The core mechanism – the policy's operation actively disabling the evidence-gathering apparatus – is identical.

  ### Why Other Terms Don't Quite Fit
  *   **Goodhart's Law ("When a measure becomes a target, it ceases to be a good measure"):** Focuses on *gaming* a specific metric. Here, it's not gaming; it's the *complete dismantling of the evidence-gathering system itself*. No measure is being corrupted; the *ability to measure* is being destroyed.
  *   **Confirmation Bias:** A cognitive bias seeking confirming evidence. OED is a *structural/systemic* barrier preventing *any* evidence (confirming or disconfirming) from being gathered for specific questions.
  *   **Absence of Evidence / Evidence of Absence:** This is a general epistemological caution. OED explains *why* the evidence is absent in these specific cases – because the policy actively destroyed the means to produce it. It moves beyond the caution to identify the *cause* of the absence.
  *   **Epistemic Closure:** Focuses on systems resistant to outside information. OED is about the system actively *preventing the generation* of critical internal information.
  *   **Performativity:** While related (an idea/statement bringing about the reality it describes), it's broader. OED is a specific, negative subtype where the performance of the policy destroys knowledge.

  ### Proposed Names & Definitions
  1.  **Operational Evidence Destruction (OED):** (Most precise/descriptive)
      *   *Definition:* A phenomenon where the implementation or execution of a policy, process, or intervention inherently dismantles, bypasses, or nullifies the mechanisms required to detect its own errors, failures, or true causal impacts, rendering the policy fundamentally resistant to empirical evaluation on those specific dimensions.
  2.  **Self-Disabling Evidence (SDE):** (More concise)
      *   *Definition:* A policy or action whose execution inherently prevents the generation or discovery of evidence critical to assessing its accuracy, effectiveness, or safety.
  3.  **Policy Eclipse:** (Metaphorical)
      *   *Definition:* A situation where a policy's implementation creates conditions that obscure or obliterate the very information needed to illuminate its performance or consequences, particularly regarding errors or causal effects.

  ### Marking the Edges (What OED *Isn't*)
  *   **Not just "hard to measure":** It must involve the policy *actively causing* the evidence destruction/difficulty.
  *   **Not just "absence of evidence":** Requires the absence to be a *direct, systematic consequence* of the policy's operation, not merely a lack of effort or inherent difficulty.
  *   **Not about gaming metrics:** The problem isn't distorted measurement; it's the *elimination of measurement capability*.
  *   **Not just risk:** It's about the policy *ensuring* errors remain hidden or causality remains untestable *as a feature of its design/execution*.

  You've hit upon a profound and under-discussed flaw in certain high-stakes, irreversible policies. OED creates a dangerous epistemic blind spot, shielding the policy from critical evaluation precisely where it matters most. Your death penalty examples are textbook cases.
