answer: |-
  ## Revenue Ruling OOA-2024-07: Composite Object Return

  **Preamble:** Pursuant to the Ontological Assessment and Revenue Act (OARA), the Office of Ontological Assessment (OOA) is mandated to levy an Annual Per-Object Tax (APOT) on all objects within a dwelling as of the Valuation Date (January 1st). This ruling clarifies the determination of countable objects for the Composite Object Return (Form OOA-1040C).

  The OOA recognizes diverse ontological frameworks regarding object composition. Consequently, taxpayers must assess their inventory under **all three** recognized statutory interpretations (§3(b)(i-iii)) and submit the resulting tax liability calculated under each. The OOA will then apply the interpretation yielding the **highest assessable object count** for the final assessment. The following rulings provide guidance on application.

  **Rulings:**

  1.  **Statutory Interpretations for Composition (§3(b)):**
      *   **(i) Universal Composition:** Any plurality of things whatsoever composes a further object. (e.g., *This stapler, plus that pencil, plus the ceiling tile, plus Mount Everest, composes a distinct taxable object.*)
      *   **(ii) Nihilist Composition:** Composition never occurs. Only mereological simples exist. (e.g., *There is no "table"; only simples (e.g., wood particles, varnish molecules) arranged tablewise.*)
      *   **(iii) Life-Based Composition:** Composition occurs only when the joint activity of the parts constitutes a life. (e.g., *A living cat is one object; a non-living table is not a single object.*)

  2.  **Application Guidance:**
      *   **(a) Universal Composition (§3(b)(i)):** Taxpayers must account for *every conceivable sum* of items within their dwelling *and any other entity*. This includes, but is not limited to:
          *   Individual items (e.g., one sock).
          *   Every possible combination of items (e.g., sock A + sock B; sock A + coffee mug; sock A + coffee mug + the Eiffel Tower (see §2(a)(iv))).
          *   Sums involving entities beyond the dwelling's physical boundaries (§2(a)(iv)).
      *   **(b) Nihilist Composition (§3(b)(ii)):** Taxpayers must identify all mereological simples present. Standard household items are *not* countable objects. Forms must be completed listing simples (e.g., "Approximately 4.2 x 10^23 cellulose molecules arranged chairwise; 7.8 x 10^18 silicate molecules arranged dishtowelwise"). Estimated counts per OOA Publication 17-Simplex are acceptable. Aggregations like "furniture" are impermissible.
      *   **(c) Life-Based Composition (§3(b)(iii)):** Taxpayers must identify only those composites where the parts jointly constitute a life. This typically includes pets, houseplants, and resident humans (see §5 re: exemptions). Non-living composites (e.g., tables, appliances, books) do not count as single objects; only their constituent parts or simples are assessable under §3(b)(ii) concurrently.

  3.  **De Minimis Rule Attempt (§4):** Recognizing practical challenges, particularly under §3(b)(i), the OOA has established a *de minimis* threshold. An aggregate object is non-assessable if:
      *   Its component parts are not in physical contact (§4(a)(i)); *or*
      *   Its market value is less than $0.01 (§4(a)(ii)); *or*
      *   No single component part exceeds 1 cubic millimeter in volume (§4(a)(iii)); *or*
      *   Its parts are not cohesively fastened (§4(a)(iv)).
      *   **Rationale:** The OOA acknowledges questions regarding the arbitrariness of these thresholds. However, administrative necessity requires drawing practical lines. The OOA maintains that any threshold may appear arbitrary under relentless metaphysical scrutiny ("why here?"), but serves the vital purpose of revenue collection ("who this serves"). Taxpayers objecting solely on grounds of ontological arbitrariness must utilize the "De Minimis Dispute" line on Form OOA-1040C-SUP and pay the assessed tax pending appeal.

  4.  **Table of Representative Assessable/Non-Assessable Items (Illustrative Under Respective Frameworks):**

      | Household Item          | Universal (§3(b)(i))                                  | Nihilist (§3(b)(ii))                                      | Life-Based (§3(b)(iii))                    |
      | :---------------------- | :---------------------------------------------------- | :-------------------------------------------------------- | :------------------------------------------ |
      | **Wooden Table**        | **Assessable** (as itself + countless aggregates)     | **Non-Assessable** (Report simples arranged tablewise)    | **Non-Assessable** (Report simples/parts)   |
      | **House Cat (Alive)**   | **Assessable** (as itself + countless aggregates)     | **Assessable** (Report cat-simples, if any)               | **Assessable** (One living composite)       |
      | **Sack of Potatoes**    | **Assessable** (as itself + countless aggregates)     | **Assessable** (Report potato-simples, soil simples)      | **Non-Assessable** (Non-living; Report parts/simples) |
      | **Left Sneaker**        | **Assessable** (as itself + countless aggregates, e.g., Left Sneaker + Andromeda Galaxy) | **Assessable** (Report sneaker-component simples) | **Non-Assessable** (Report parts/simples)   |
      | **Colony of Mold**      | **Assessable** (as itself + countless aggregates)     | **Assessable** (Report mold-cell simples)                 | **Contested** (See §6)                      |
      | **"Table + Cat" Sum**   | **Assessable** (A distinct aggregate object)          | **Non-Assessable** (Not a simple)                         | **Non-Assessable** (Not a life)             |

  5.  **Worked Example (§7):** Consider a dwelling containing: 1 living cat, 1 wooden table (4 legs, top), 1 book.
      *   **Universal Comp:** Count is infinite (Cat, Table, Book, Cat+Table, Cat+Book, Table+Book, Cat+Table+Book, Left Rear Table Leg + Cat's Whisker, Cat + Alpha Centauri, etc.). *De minimis* may exclude distant/valueless aggregates, but count remains extremely high.
      *   **Nihilist Comp:** Count is vast but finite (All simples comprising the cat, all simples comprising the table parts, all simples comprising the book parts). No "Cat" or "Table" object.
      *   **Life-Based Comp:** Count is 1 (the living cat). Table and book are not single objects.
      *   **OOA Assessment:** Highest count prevails (Universal, post-*de minimis* application, yielding thousands of assessable aggregates).

  6.  **Ambiguous Cases - Life (§6):** The distinction "constitutes a life" (§3(b)(iii)) presents challenges. Bacteria colonies, fungal mats, slime molds, and complex symbiotic systems *may* qualify depending on biological criteria (OOA Biol. Ref. Bulletin 42). Mold on bread is typically assessed as non-living simples/parts. Disputes require a Certified Onto-Biological Assessment (Form OOA-721).

  7.  **Split-Tenure Sums & Modified Objects (§8):**
      *   **(a) Split-Tenure Sum (§8(c)):** A composite object whose parts are owned by different taxpayers (e.g., Neighbor A's fence post concreted into Taxpayer B's retaining wall). The OOA deems this a single composite object. Liability is joint and several. Taxpayers must file Form OOA-1040C-JT.
      *   **(b) Modified Objects (§8(d)):** Objects with replaced parts pose composition questions. **Example:** A table (originally legs A,B,C,D, top T). Leg D is replaced with new Leg E.
          *   Universal: Original Table (A+B+C+D+T) may persist as a "Temporal Phase Object"; New Table (A+B+C+E+T) is distinct; both may be assessable depending on temporal boundaries.
          *   Nihilist: Only simples/arrangements exist; replacement is irrelevant. Report current simples.
          *   Life-Based: Non-living; replacement irrelevant. Report parts/simples.
          *   **OOA Determination:** The OOA resolves such cases by considering the tax's purpose (§1(a): revenue generation based on functional household inventories). The functional table unit (current configuration: A+B+C+E+T) is assessed as *one* object. The original leg D, if retained, is a separate object. Ontological persistence is superseded by administrative practicality and functional unity.

  **Compliance:** Form OOA-1040C must be filed by April 15th. Maintain detailed ontological inventories for seven years. **Marginalia Directive (§9(f)):** Under no circumstances may taxpayers write in the margins of Form OOA-1040C or its schedules expressions of ontological distress, philosophical objections, or rhetorical questions concerning the nature of composition, being, or the OOA's interpretive choices. Such notations invalidate the return and incur penalties under §6662(a) (Frivolous Metaphysical Position).

  **Issued:** October 26, 2024
  **Office of Ontological Assessment**
  **Department of the Treasury**
