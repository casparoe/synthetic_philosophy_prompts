answer: |-
  ## The Desert of Circumstance

  **Aaron Kellner:** Marit, I want to focus squarely on the core moral intuition behind your defense of meritocracy. You argue that differential rewards – income, status, positions – are justified when they track differences in what individuals *deserve*, understood as what they are morally responsible for bringing about. My concern is foundational: what are we actually responsible *for*? The traits that drive productive contributions – intelligence, ambition, perseverance, even the capacity for delayed gratification – seem largely bestowed by the genetic lottery and early environment. Even the specific energies and preferences one applies to work are shaped by unchosen circumstances. If the inputs to productivity are themselves the product of constitutive luck, how can the *outputs* – the contributions and the rewards flowing from them – be matters of genuine desert? Doesn't this pervasive luck undermine the very possibility of the kind of desert your meritocracy requires?

  **Marit Voss:** Aaron, you’ve articulated the constitutive luck worry clearly. I concede the pervasiveness of luck in shaping our capacities and dispositions. To think otherwise would be naive. However, I don’t believe this concession forces us to abandon desert entirely. We need to understand desert as scalar, pro tanto, and defeasible. It’s a matter of *degree* – we might deserve rewards *more* or *less* based on factors within our control, even if perfect, absolute desert is elusive. It’s pro tanto – a genuine reason for differential treatment that can be outweighed by other considerations like need or equality. Most crucially, your objection, taken to its logical extreme, seems to render moral responsibility incoherent. If responsibility for an outcome requires that we authored *every* trait and disposition that produced it, then indeed, no one is responsible for anything. But this isn’t how responsibility functions. We hold people responsible for actions *they* perform, using the capacities they *have*, even if they didn’t choose those capacities. The surgeon uses her skill and judgment, cultivated through effort; the entrepreneur acts on her vision and takes risks. They are responsible for those *exercises* of agency, using the toolkit they find themselves with. Desert tracks the responsible *use* of capacities, not the ultimate origin of the capacities themselves. Otherwise, the concept collapses entirely.

  **Voss:** Having said that, I must concede a technical weakness in the simplistic version of my view that directly links desert to a person's marginal product – the value added by the last unit of their labor. The problem arises under complementarity. Consider a brilliant surgeon and a highly specialized nursing team. Separately, their marginal products might be low or even negative. Together, they produce immense value. Under constant returns to scale, summing the marginal products of all factors exactly exhausts the total product. But under increasing returns, their sum would *exceed* the total value produced – an impossibility. Under decreasing returns, it sums to less. So the injunction "give each their marginal product" is incoherent in precisely the cases where joint effort creates synergies. To repair this *within* a desert framework focused on contribution, I propose a coalitional measure. A person’s desert base is their *average* marginal contribution across every conceivable order in which the workforce could have been assembled. Imagine adding workers one by one to an empty firm. The surgeon added to the nursing team contributes a huge amount. The nursing team added to the surgeon also contributes a huge amount. We average these contributions over all possible sequences. This symmetrically allocates the "synergy surplus" generated by the complementary team. Why is this a better measure of "her contribution" than marginal product at the actual employment point? Because the actual point is arbitrary; it depends on the current size of the firm. The average-over-orderings captures the *essential potential* of adding *this* worker to *any* coalition, reflecting their genuine role in creating value through cooperation, regardless of the arbitrary current state. It’s a more fundamental measure of what *she* brings to the table by being part of the productive whole.

  **Kellner:** I grant the mathematical coherence of your Shapley value approach. It’s a clever internal solution to the marginal-product problem. But it exposes a deeper indeterminacy. The same coalitional data – who can produce what with whom – admits multiple solution concepts, each claiming to capture "fair" division or "contribution." Besides the average-over-orderings, there’s the nucleolus, which minimizes the maximum complaint of any coalition; there’s the equal division of the cooperative surplus; there are various bargaining solutions. These yield different allocations for the same person in the same productive context. If desert is supposed to tell us definitively how much someone *deserves*, and the choice among these mathematically admissible rules is what *fixes* the number, then desert itself seems to be doing none of the substantive normative work. The crucial move – picking one rule over another – appears arbitrary from the perspective of desert. It’s an ungrounded political choice smuggled in. Furthermore, whichever rule we pick, a person’s assigned "contribution" depends critically on facts entirely beyond their control: *who else exists* with complementary skills, and the *shape of market demand* for the resulting product. The value of a brilliant VCR engineer plummeted due to unchosen technological shifts; the value of a specific surgeon depends on the existence of anesthesiologists she didn’t create. Her "desert base" under your coalitional measure is still profoundly shaped by brute luck – the luck of who else is born and what society happens to want.

  **Voss:** Your objection, forcefully put, is that even with coalitional measures, desert is indeterminate because multiple allocation rules are mathematically viable, and that the resulting share remains hostage to contingent facts about others and demand. I see two responses. First, we must distinguish metaphysical indeterminacy from epistemic indeterminacy or pluralism. It might be that desert, as a normative concept, is essentially comparative and imprecise. It can tell us that the surgeon deserves *more* than the janitor in that hospital, or that both deserve *some* share of the cooperative surplus they jointly enable, without necessarily yielding a unique cardinal number. It can rule out clearly undeserved allocations – say, giving the janitor the entire surplus – without pinpointing the single "correct" division. Imprecision in the normative base is not the same as absence. We navigate similar imprecision in concepts like "reasonable doubt" or "fair compensation." Secondly, let me turn the tables. Your luck-egalitarian critique focuses on compensating for unchosen disadvantages. But to implement this, you need a metric. *How badly off* is someone due to brute luck? This requires a counterfactual baseline: "How well off *would* she be if not for the bad luck?" But constructing this baseline inevitably involves measuring either the value of her *actual contributions* compared to what she *could* have contributed absent the disadvantage, or the value of the *opportunities* she lacked, or the *forgone alternatives* she couldn't pursue. This seems to borrow directly from the very apparatus – contribution, opportunity cost – that you argue is undermined by luck. How do you measure disadvantage without implicitly relying on a notion of what someone *could* or *should* have achieved, which itself presumes capacities and potential contributions vulnerable to your constitutive luck critique?

  **Kellner:** You’ve sharpened the challenge well: how to specify the baseline for compensation without implicitly relying on contested notions of potential contribution or opportunity. It’s a genuine difficulty. Perhaps the baseline is set by a societal minimum, or by reference to the average range of functionings achievable with given unchosen disadvantages, focusing on capabilities rather than hypothetical outputs. But I concede this requires careful articulation to avoid circularity. Your point about comparative desert is noted, but it feels like a significant retreat. If desert can’t tell us *how much*, only rough ordinal rankings and exclusions, its power to justify the often vast inequalities produced by meritocratic markets seems greatly diminished. It becomes more a veto than a positive guide. This leads me to suspect our underlying divergence might be more fundamental than we’ve stated. I’ve come to think my critique relies on seeing desert as potentially *pre-institutional* – a moral fact about persons and their responsibility that should constrain institutional design. But perhaps *you* see desert as *institutional* – constituted by the rules and purposes of the productive system itself. On your coalitional view, "her contribution" is defined *by* the rules of the game (the production function, the market, the adopted allocation rule). If desert is defined *by* the institution, it can’t serve as an independent moral standard *for* assessing the institution. It merely reflects the existing setup.

  **Voss:** That’s a perceptive observation, Aaron, and cuts close to the bone. I must concede that the *specific content* of what counts as a "desert base" – whether marginal product, Shapley value, or something else – is indeed shaped by the institutional context. The rules of property, contract, and the market define what counts as a "productive contribution" in the first place. A brilliant hunter in a different society contributes differently. So yes, institutions profoundly shape *what* we are assessing desert *for*. This costs me the idea of desert as a purely natural, pre-social fact. However, I don’t concede that desert is *wholly* constituted by institutions. The *core intuition* – that effort, responsible agency, and the value one helps create *should* make a difference to one’s rewards – feels pre-institutional. We assess institutions partly by how well they recognize and respond to these agential facts. A system that ignored effort and contribution entirely, rewarding randomly or purely by lineage, strikes us as fundamentally unjust, regardless of its rules. The institution defines the *arena* and the *metric*, but the underlying moral claim of agency persists.

  **Kellner:** I concede, then, that the impulse to recognize agency isn't *created* by institutions; it seems a deep human intuition. But its concrete expression, and crucially, its power to justify differential *rewards* of the scale and kind involved in modern economies, remains inextricably bound to institutional choices about how to value and aggregate contributions – choices themselves shaped by luck and history. The cost to me is admitting that eliminating *all* traces of luck from distributive outcomes might be impossible, or require flattening distinctions that reflect real, albeit luck-influenced, agency. We might mitigate brute luck disadvantages without demanding a world where outcomes perfectly mirror some illusory, luck-free agency.

  **Voss:** Precisely. So we agree luck is pervasive, agency is real but conditioned, and institutions matter profoundly. But we disagree on the residual force of desert *after* conceding institutional shaping and luck. You see it as too weak and indeterminate to bear the justificatory weight of significant inequality within the institutional framework we have. I see the recognition of responsible contribution, even imperfectly measured within an institutional context, as an irreducible moral demand – the core that remains even when we acknowledge the luck and the institutional mediation. Desert, for me, isn't erased by its difficulties; it's the persistent moral signal we strive, however imperfectly, to discern and honor within the noise of circumstance.

  **Kellner:** And for me, the signal is too entangled with the noise, too dependent on contingent institutional amplifiers, to justify the inequalities it's used to defend. The persistent moral demand is not to honor the signal, but to compensate for the distorting noise, even as we acknowledge the genuine, but ultimately secondary, role of conditioned agency. We strive to build institutions where luck matters less, even if agency shines less brightly through differential rewards. That, I think, is where we must leave it.
