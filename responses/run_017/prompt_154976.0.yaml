prompt: |-
  I've been reading LessWrong and the old Overcoming Bias comment threads since basically forever, and a few of us from the local meetup are hacking on a tiny belief-tracking app (working name: Kinematics) where you don't log verdicts, you drag a slider to record how strongly today's observation pointed at some proposition, and the app pushes that through everything else in your model. I implemented the propagation as Jeffrey conditioning: take the partition {E, not-E} for whatever the slider is about, set the new credence in E to the slider value, hold the conditional credences P(H|E) and P(H|not-E) fixed, done. A friend of mine who actually does stats says this is broken in a way I should care about, and I've now argued about it twice without getting what her objection is.

  Here's what I think I know. Probability kinematics is supposed to be the generalization of Bayesian conditioning to the case where your evidence is uncertain: instead of becoming certain of E you move to some intermediate credence q, and rigidity of the conditional credences given E and not-E is what pins down the rest. And I've seen it justified as a minimal-change rule — of all the distributions that put credence q on E, this is the one closest to your old credence function, so it's the conservative choice, the one that doesn't sneak in information you didn't recieve. That sounds exactly like what I want from a general-purpose updating engine, so I've been treating "my credence in some proposition moved to q" as the only input the rule needs, regardless of what caused the move. I also batch a day's slider moves and apply them in whatever order they come out of the log file, because I was under the impression that Bayesian updating is commutative and the final state shouldn't depend on the order you learned things in. (Somewhere in the back of my head there's a half-memory of someone on the forums saying Jeffrey himself later backed away from the "updating on uncertain evidence" framing and treated it as just a way of describing a change in credence — I can't reconstruct the argument and I'm not sure it matters for the app, but flagging it in case it's the crux.)

  The case she keeps raising is this. Suppose a user logs a slider on "home rapid test read positive," but they're squinting at the cassette in bad bathroom light and are only 70% sure of what the display actually said. To me that is textbook uncertain evidence: set credence in E = "the test read positive" to 0.7, keep P(infected | positive read) and P(infected | negative read) where they were, propagate. She says that in exactly this kind of case the rigidities are the thing that fails, and that the correct move is to condition on something you *are* certain of — what the display looked like — and put the unreliability of your eyes into the likelihood rather than pretending the uncertainty is about the world-level proposition; and that the same goes, even more obviously, when the news is about the test rather than the patient, e.g. a preprint revising the sensitivity estimate downward, where P(infected | positive read) is precisely the quantity that moved and holding it fixed can't be right. I sort of follow, but then she said something about the answer depending on how finely you carve the partition, and about Jeffrey updates not commuting so that my batching silently picks an order, and I lost the thread. I also want to know what to do with the case I think my app handles fine: a user stares at their model, decides on reflection that their prior on the local base rate was overconfident, and drags the base-rate slider with no new observation at all.

  Could you walk me through it in these sections, roughly:

  - "The mistake in how I'm framing this" — ~300 words, naming the false presupposition before anything else
  - "What rigidity actually requires, and how to check for it" — ~400 words
  - "My three cases, worked" — ~600 words: the bad-light test reading, the preprint that revises the test's sensitivity, and the pure-reflection base-rate move
  - "So what is probability kinematics actually for?" — ~250 words
  - "Where I still have to use judgment" — ~150 words
reasoning: |-
  Okay, let me start by unpacking the user's problem. They've built a belief-tracking app using Jeffrey conditioning, where users adjust sliders for propositions based on observations. Their friend, who's a statistician, says this approach is flawed. The user is confused about the objections, especially regarding rigidity and partition dependence.

  First, I need to identify the core mistake. The user treats any credence change as "uncertain evidence," applying Jeffrey conditioning uniformly. But Jeffrey conditioning assumes that conditional probabilities remain rigid, which isn't always true. The user's framing conflates all types of belief updates under one method, ignoring when rigidity fails.

  Next, rigidity. It's not automatic; it requires that the evidence doesn't affect the relationships between other propositions and the partition. For example, in the bad-light test case, the fuzziness of the observation affects how the evidence relates to the hypothesis. If the user is uncertain about what they saw, that uncertainty should be modeled in the likelihood, not by adjusting P(E). The conditional probabilities P(H|E) might change because the evidence itself is ambiguous.

  Then the three cases. For the squinting at the test: the slider moves P(E) to 0.7, but this doesn't account for why the credence changed. The uncertainty is perceptual, so conditioning on the visual experience (V) is better. The preprint revising sensitivity: here, P(infected | test positive) itself changes, so rigidity is violated. Jeffrey conditioning would incorrectly keep the old conditionals. For the base-rate reflection, there's no evidence; it's a direct reassessment. Jeffrey might apply here, but even then, ensuring rigidity is tricky.

  What's kinematics actually for? It's useful when evidence directly affects a partition without altering conditionals, like perception slightly shifting beliefs without changing underlying models. But it's not a one-size-fits-all solution.

  Finally, judgment calls. The user needs to decide when rigidity holds, how to partition, and when to use standard conditioning. The app should allow specifying whether an update is perceptual, model-based, or direct, and handle each accordingly. Batching updates requires careful consideration of commutativity, which Jeffrey doesn't guarantee.

  The user's deeper need is a robust, general updating engine. They might not realize that different belief changes require different methods. Their app's simplicity is appealing, but accuracy demands distinguishing types of updates. Highlighting cases where Jeffrey fails and offering alternatives could make the app more reliable without complicating the UI too much.
answer: |-
  Here's the breakdown you requested, addressing the core conceptual error, rigidity, your three cases, the purpose of kinematics, and the role of judgment:

  ---

  ### 1. The Mistake in How You're Framing This (~300 words)
  **Your false presupposition:** You equate *any shift in credence* about proposition E (via the slider) with "receiving uncertain evidence *about E*" that justifies a Jeffrey update (i.e., holding P(H|E) and P(H|¬E) rigid). This is the root error.

  Receiving ambiguous sensory data (like squinting at a test) or learning new statistical information (like a preprint) *causes* your credence in E to shift, but **the *reason* for the shift determines whether rigidity holds**. Jeffrey conditioning assumes the *only* thing that changed is your certainty about E itself, leaving the *relationship* between E and all other propositions H *unchanged*. Crucially, **the update *method* you use must match the *source* of the belief change**.

  When you drag the slider for E to q, you are describing *the outcome* (credence moved to q), not *the cause*. Your app treats *all* such outcomes identically, applying Jeffrey conditioning indiscriminately. However, the *cause* of the shift (perceptual uncertainty, model parameter revision, pure reflection) determines whether the rigidity assumption underlying Jeffrey conditioning is valid. **Jeffrey conditioning is appropriate *only* for belief shifts where the rigidity condition is satisfied by the *nature of the evidence***. Using it for *all* credence shifts, regardless of cause, forces rigidity where it often fails, introducing systematic errors.

  ---

  ### 2. What Rigidity Actually Requires, and How to Check For It (~400 words)
  **Rigidity Defined:** For a partition {E₁, E₂, ..., Eₙ}, rigidity means that *conditional on any element Eᵢ of the partition*, your beliefs about *all other propositions* remain unchanged by the update. Formally: Pₙₑ𝓌(H | Eᵢ) = Pₒₗ𝒹(H | Eᵢ) for all H and all i.

  **What it Requires:** Rigidity holds **only if** the evidence or process causing your credence in the partition elements to shift *does not itself provide information* about how those elements relate to other propositions. The evidence must solely affect your belief *in* Eᵢ themselves, without altering the *implications* of Eᵢ for H.

  **How to Check (The Litmus Test):** Ask: **"Does the *reason* my credence in E changed *also* give me new information about H *given* E (or given ¬E)?"**

  *   **If YES:** Rigidity likely **fails**. (e.g., Revising test sensitivity changes P(Infected | Positive Test); squinting changes how reliably the visual input maps to "Positive Test").
  *   **If NO:** Rigidity *might* hold. (e.g., A slightly blurry but unambiguous photo of the test display *might* only affect P(Positive Test) without changing P(Infected | Positive Test)).

  **Why Rigidity is Fragile:** It demands that the evidence impacts *only* the probabilities of the partition elements, acting like a "pure weight" on them, leaving the internal structure of the model conditional on those elements untouched. Real-world evidence often *does* provide information about the conditionals:

  *   **Perceptual Uncertainty:** "Squinting in bad light" isn't just uncertain evidence *about* the display state E; it means the *connection* between the sensory input S and E is noisy. Your evidence is really about S, not directly about E. P(H | E) *depends* on how reliably S indicates E.
  *   **Model Revision:** Learning a preprint *explicitly* targets the conditional probabilities P(H | E) (like sensitivity/specificity). Holding them rigid defeats the purpose.
  *   **Reflection:** Shifting a base rate might imply re-evaluating dependencies if the base rate was entangled with other assumptions.

  ---

  ### 3. Your Three Cases, Worked (~600 words)

  1.  **Case: Bad-Light Test Reading (Squinting)**
      *   **Your Approach:** Set P(E = "Test Read Positive") = 0.7 via slider. Hold P(Infected | E) and P(Infected | ¬E) rigid. Propagate.
      *   **The Problem:** The *cause* of the shift is perceptual uncertainty about the raw sensory input (S = "What the display *looked* like"). You are *not* receiving uncertain evidence *about the world-level fact* E. You are receiving *certain evidence* about S, and S is only probabilistically linked to E. Rigidity fails because this evidence *does* impact the relationship between S/H and E/H. Your 70% reflects uncertainty *in interpreting S as E*, not just uncertainty *in E*.
      *   **Correct Approach:** Condition on the *sensory experience* S you are certain of.
          *   Define S: "I saw what looked like a faint line" (or similar).
          *   Build a likelihood model: P(S | E) = [Reliability when E is true], P(S | ¬E) = [False positive rate of perception]. (e.g., P(S | E) might be 0.9 if a true positive is usually clear, P(S | ¬E) might be 0.2 if faint lines are sometimes misperceived in bad light).
          *   Apply standard conditioning: Pₙₑ𝓌(H) = Pₒₗ𝒹(H | S) ∝ Pₒₗ𝒹(H) * P(S | H). P(S | H) is obtained via your existing P(S | E), P(S | ¬E), and Pₒₗ𝒹(E | H).
      *   **Why Jeffrey Fails Here:** It implicitly assumes the *only* uncertainty is whether E is true/false, ignoring the *additional* layer of uncertainty in mapping S to E. This distorts P(Infected | E).

  2.  **Case: Preprint Revises Test Sensitivity**
      *   **Your Approach:** User drags a slider for P(Infected | Test Positive) to a lower value (q). Your app might try to Jeffrey update on E = "Test Positive" or on the sensitivity parameter itself. Either way, holding conditionals rigid is impossible.
      *   **The Problem:** The evidence *directly targets and changes* the conditional probability P(H | E). Rigidity is *explicitly violated* by the nature of the evidence. A Jeffrey update *requires* holding these conditionals fixed, making it fundamentally incompatible with this type of belief revision.
      *   **Correct Approach:** This is **model revision**, not updating on uncertain evidence within a fixed model.
          *   **Parameter Update:** If "Test Sensitivity" is an explicit parameter `θ_sens = P(Positive | Infected)` in your model, revise `θ_sens` to the new estimate q (or a distribution around it) and recompute *all* probabilities using the new model via the law of total probability.
          *   **Structural Update:** If the conditional isn't parameterized, treat the preprint as evidence `D` supporting a model M₂ with lower sensitivity compared to your old model M₁. Calculate the posterior over models P(M | D) ∝ P(D | M) * P(M), then compute P(H) = Σᵢ P(H | Mᵢ) * P(Mᵢ | D). This is more complex.
      *   **Why Jeffrey Fails Here:** It is designed for updating beliefs *within* a fixed model structure and fixed conditionals. It cannot handle evidence that *changes the model structure or parameters* defining those conditionals.

  3.  **Case: Pure-Reflection Base-Rate Move**
      *   **Your Approach:** User drags the base rate slider for proposition B (e.g., P(LocalBaseRate > 1%) from p to q. App performs a Jeffrey update on the partition {B, ¬B}, holding P(H | B) and P(H | ¬B) fixed.
      *   **Assessment:** This is the case **most compatible** with Jeffrey conditioning *if* the rigidity condition holds.
      *   **The Crucial Check:** Did the reflection *only* change your belief in B itself, or did it also change your understanding of *how* B influences H? Pure reflection *might* sometimes only target P(B). However, often, reassessing a base rate involves reassessing the evidence that led to it or its dependencies.
      *   **If Rigidity Holds:** Jeffrey conditioning is appropriate. It minimally shifts beliefs to satisfy Pₙₑ𝓌(B)=q while preserving the relationships P(H | B), P(H | ¬B). This is the "minimal change" justification.
      *   **If Rigidity Fails (Common):** Suppose reflecting on B makes you realize your prior estimate was based on flawed studies. This might also change your view on *how strongly* B predicts H (i.e., P(H | B) itself). Or, B might be entangled with other assumptions. In these cases, Jeffrey conditioning is inadequate; a more comprehensive model reassessment (like the model revision in Case 2) is needed.
      *   **App Design Implication:** For "reflection" sliders, the user ideally needs a way to indicate *what* they reflected on. Was it *only* the probability of B, or the relationships involving B? The former justifies Jeffrey, the latter requires deeper handling.

  ---

  ### 4. So What Is Probability Kinematics Actually For? (~250 words)
  Probability kinematics (Jeffrey conditioning) is designed for situations where you receive **direct, albeit uncertain, sensory or perceptual evidence** that *immediately* shifts your credence in a *specific partition* of propositions, **without providing information that would alter the relationships between those propositions and the rest of your beliefs**.

  *   **Classic Examples:**
      *   **Perception in fixed lighting:** Seeing a cloth under slightly dim light, making you 80% sure it's green (E=Green) instead of blue (¬E=Blue). The dimness affects your certainty *about the color itself* but doesn't change your knowledge of what "Green" implies for other propositions (e.g., P(ChlorophyllPresent | Green)).
      *   **Uncertain testimony:** A usually reliable but slightly muffled source says "The deal passed!" You become 90% sure E="DealPassed" is true. If the muffling doesn't change *which* deal you think they meant or *what* a passed deal implies, rigidity holds.
  *   **Core Concept:** It handles "**vagueness at the source**" – the fuzziness is inherent in the *evidence signal* for the *specific proposition* E, not in the *model* connecting E to the rest of your beliefs. The evidence *is* directly about E (even if uncertain), and your model of how E relates to H remains intact.
  *   **Key Limitation:** It is **not** a universal tool for *any* belief shift. It's specifically for belief shifts *caused by* uncertain evidence *directly pertaining* to the partition elements, where the evidence leaves the conditional relationships P(H | Eᵢ) untouched.

  ---

  ### 5. Where I Still Have to Use Judgment (~150 words)
  Implementing a robust belief tracker requires **judgment calls** that cannot be fully automated:

  1.  **Source Identification:** When the user moves a slider, *what caused the shift?* Is it uncertain perception *of* E (Jeffrey candidate), certain perception of a related signal S (Standard Conditioning), model revision (Parameter/Structure Update), or pure reflection? **The app needs metadata about the update type.**
  2.  **Rigidity Assessment:** Even for perceptual shifts or reflection, **does rigidity *actually* hold** for the chosen partition? Does the evidence/reasoning *also* alter P(H | E)? This requires examining the *context* of the update.
  3.  **Partition Choice:** Jeffrey updates are **partition-dependent**. Choosing the "right" partition {E, ¬E} vs. a finer-grained partition {E₁, E₂, E₃} impacts the result. Judgment is needed to select the partition that best matches the grain of the evidence.
  4.  **Batching & Order:** As your friend noted, Jeffrey updates **do not commute** in general. The order of processing slider moves matters. Batching requires a deliberate choice of order or a justification for why order *shouldn't* matter *in that specific context* (which is often non-trivial). Judgment is needed for sequencing or designing batching logic.
