prompt: |-
  I sit on the research committee of a small grant-making foundation. Over the next four years we can fund roughly six postdoctoral fellowships in normative philosophy, and we have decided against spreading them: the whole envelope will go to a single cluster of questions. The cluster we keep returning to is that of free-floating rationales — considerations that favour a response, or count in favour of an outcome, without being anyone's reasons in particular. Not shared or collective reasons in the ordinary sense, where a group or its members hold them together, but reasons whose every candidate bearer is missing: unowned, unentertained, or unentertainable considerations that nonetheless seem to retain whatever force reasons have.

  So that we are not leaning on any settled terminology, let me fix ours provisionally. One of our advisers sketched a five-way taxonomy, which I suspect does not survive scrutiny as stated:

  1. Extinct bearers. A rationale whose only bearer is dead — a promise made to someone who has since died, the point of a bequest whose settlor and beneficiaries are both long gone, the stated aim in a constitution's preamble.
  2. Never-bearers. Considerations that concern individuals who cannot now exist: people who would have lived under a different policy, future generations whose identity depends on what is done now, and merely possible agents generally.
  3. Bearerless offices. A rationale attaching to a role, institution or office rather than to its occupants — the purpose of an endowed chair, the point of a procedural rule, the mission of a statutory body. Occupants turn over; nobody now endorses the founding rationale, and arguably nobody ever did.
  4. Unentertainable reasons. Reasons generated by the structure of a situation that no deliberator could formulate or act on — considerations available only after the last opportunity to respond has passed, or which the agent's own representational limits exclude.
  5. Self-effacing rationales. Reasons for an entity to bring about a state of affairs in which that entity no longer has the standing to hold reasons at all: reasons for a court to abolish its own jurisdiction, for a constitution to authorise its replacement, for a group to dissolve.

  We also have a working hypothesis that the standard menu of responses is too narrow. Faced with an orphaned rationale, an institution appears to have two options: act on it, or treat it as void. Our suspicion is that there is a third and fourth response-mode that the literature's action/belief dichotomy hides — something custodial or archival (preserve the rationale, keep it legible, without executing it) and something expressive or extinguishing (acknowledge it, mark it, or formally retire it). We want to know whether that is a genuine insight or a confusion generated by our own taxonomy.

  What we need from you is a defended research agenda, not a survey. Concretely:

  Which three or four questions within this cluster should six people work on for four years, in what order, and why? Please give us the reasoning rather than the list: what makes each question worth years of someone's career, which questions are upstream of which (what has to be settled before a downstream question can even be posed clearly), which are tractable by philosophers working conceptually with no empirical budget, and which we should decline to fund because their resolution would not change much else.

  Then, because our trustees will ask: which of the alleged practical pay-offs are real? Our interest is institutional reasoning about inherited purposes — donor conditions on collections, endowed posts whose founding description no longer names a discipline, corporate purpose clauses, lapsed statutory mandates, treaty and constitutional preambles. We think a great deal of bad reasoning here comes from a false dichotomy between "binds because it was originally willed" and "binds not at all". Tell us which implications for that domain genuinely follow from a good account of free-floating rationales, which are overrated, and which do not follow at all. We would also like your view on one application our programme officer is keen on — specifying purposes for artificial systems that will long outlive their designers — and whether it is the same problem or merely adjacent.

  Two further constraints. First, if you think our five-way taxonomy, or the hypothesis about third and fourth response-modes, is confused, say so and replace it rather than working inside it; we would rather be corrected than accommodated. Second, do not give us a reading list, a bibliography, or a guide to who has said what — we have librarians for that, and we are deliberately not footing the agenda on any author's programme. Where you need a term of art, define it in a sentence. For your top-ranked question, work through one concrete institutional case end to end so we can see what a result would look like, and state what evidence or intermediate result within the four-year window would move that question up or down the ranking.

  Please write the answer in British English.
reasoning: |-
  Okay, the user is part of a research committee for a small foundation funding postdoctoral fellowships in normative philosophy. They've chosen to focus on "free-floating rationales"—reasons that seem to have normative force but aren't held by any particular agent. They provided a provisional five-category taxonomy and a hypothesis about response modes beyond acting or voiding rationales. They want a defended research agenda prioritizing three or four questions over four years, with clear reasoning about order, tractability, and impact. They also need practical payoffs for institutional reasoning and an evaluation of applying this to AI systems.

  First, I need to assess their taxonomy. The five categories (extinct bearers, never-bearers, bearerless offices, unentertainable reasons, self-effacing rationales) seem useful but might conflate distinct issues. For example, bearerless offices and self-effacing rationales both deal with institutional roles but differ in purpose versus self-abolition. The response-mode hypothesis (adding custodial/archival and expressive/extinguishing beyond act/void) is promising but needs grounding in the metaphysics of persistence for rationales.

  The user's unspoken needs might include clarifying foundational concepts before tackling applications. They might also need to justify the project's uniqueness to trustees, showing how it moves beyond existing literature on collective intentionality or norm persistence. The emphasis on institutional applications suggests they want actionable frameworks, not just theoretical insights.

  For the research agenda, I should prioritize questions that:
  1. Address the existence and persistence conditions of rationales (metaphysics first).
  2. Explore modes of engagement beyond act/void, testing their hypothesis.
  3. Examine institutional implications, validating practical payoffs.
  4. Assess AI applications cautiously, noting differences from human institutions.

  The trustees will care about real-world impact, so I'll need to distinguish genuine implications (e.g., handling donor conditions) from overrated ones (e.g., directly solving constitutional originalism debates). The AI angle should be flagged as adjacent but useful for contrast.

  I'll structure the response to first refine their framework, then outline the research questions with sequencing, then discuss payoffs and the AI application. For the top question (metaphysics), I'll use a university endowment case study to show concrete outputs. Tractability notes will emphasize conceptual work suited to philosophers without empirical budgets.

  Key pitfalls to avoid: getting bogged down in taxonomy debates, overpromising on AI relevance, or listing authors instead of original agendas. The tone should be corrective but constructive—British English, precise but not overly technical.
answer: |-
  Here is a defended research agenda for your foundation, prioritising conceptual clarity and institutional impact within the normative philosophy of "free-floating rationales" (FFRs). I have refined your framework where necessary, prioritised tractable questions with high downstream leverage, and assessed practical pay-offs candidly.

  **Refinements to Your Framework:**
  1.  **Taxonomy Critique:** The five categories risk conflation. "Bearerless offices" and "self-effacing rationales" both concern institutional roles but differ crucially: the former is about a *persisting* rationale detached from specific occupants, the latter is about a rationale *for ending* the rationale-holder. "Unentertainable reasons" may collapse into epistemic limitations rather than true bearer-absence. A more fundamental distinction is between:
      *   **Source-Persistence:** Does the rationale persist *despite* the extinction/absence of its original source(s)? (Addressing extinct bearers, never-bearers, some bearerless offices).
      *   **Holder-Capacity:** Can the rationale *have* a bearer capable of entertaining/acting on it *at all*? (Addressing unentertainable reasons, self-effacing rationales).
  2.  **Response Modes Hypothesis:** Your insight is sound but needs grounding. "Custodial/archival" and "expressive/extinguishing" aren't merely additional options *alongside* act/void; they are meta-responses concerning the *status* of the rationale itself. The core question is: **What modes of normative engagement with an FFR are possible, distinct from believing it directly applies (act) or is inert (void)?** The "third way" (custodial) involves *preserving the normative question* the FFR poses without answering it definitively now. The "fourth way" (expressive/extinguishing) involves a *performative act* that alters the FFR's normative standing (e.g., formally retiring it).

  **Prioritised Research Agenda (4 Years, 6 Fellows):**

  1.  **Question 1 (Year 1-2, Core - 2 Fellows): Under what conditions can a rationale persist normatively *without* a contemporaneous bearer? (Source-Persistence)**
      *   **Why Prioritise & Why Years of Work?** This is the *metaphysical bedrock*. Without understanding *if* and *how* FFRs *exist* as normative entities independent of bearers, downstream questions about engagement or institutional application are built on sand. It requires grappling with the nature of reasons (Platonic, response-dependent), norm persistence over time, the role of institutional scaffolding, and counterfactuals about possible agents. It's purely conceptual but profoundly difficult.
      *   **Upstream/Downstream:** Utterly upstream. Must be addressed before Questions 2 & 3 can be rigorously posed. Question 4 (AI) partially depends.
      *   **Tractability:** High for conceptual philosophers. Focuses on thought experiments, conceptual analysis, and engagement with metaethics/normativity.
      *   **Key Sub-Questions:** Can a *reason* exist if no one *could* hold it? Does institutional embodiment (e.g., a charter) *create* persistence or merely *record* it? What is the difference between a *dead person's reason* (extinct bearer) and a *structural requirement* of an office (bearerless)?
      *   **Concrete Case Output - University Endowment:** A 1920 endowment specifies funding "research into the superiority of the Aryan peoples." Analysis: The original settlor's reasons (extinct bearer) are morally repugnant and factually void. However, the *institutional rationale* persists as a bearerless office purpose: "supporting research based on a specific, now-discredited, biological theory." A defensible "custodial" response isn't *acting* on it (funding racist research) or *voiding* it entirely (ignoring the funds' origin/purpose). Instead, it involves *reinterpreting the persistent normative question*: "How should this wealth, generated under a harmful rationale, now be used to counteract similar harms or promote epistemic justice?" This might fund critical race theory, anti-eugenics scholarship, or science education in disadvantaged communities – *acknowledging* the rationale's origin while *transforming* its normative force. **Evidence of Progress:** A robust metaphysical account of FFR persistence, validated against diverse cases (bequests, constitutional preambles, lapsed mandates), demonstrating how reinterpretation differs from voiding or literal execution.

  2.  **Question 2 (Year 2-3, Engagement - 2 Fellows): What are the distinct modes of normative engagement with FFRs, particularly beyond "act" and "void"?**
      *   **Why Prioritise & Why Years of Work?** Directly tests your core hypothesis. Moving beyond the dichotomy requires developing a sophisticated phenomenology and logic of institutional reasoning. It demands analysing concepts like custodianship, reinterpretation, commemoration, extinguishment, and their normative grammar. This defines the practical toolkit institutions need.
      *   **Upstream/Downstream:** Directly downstream of Question 1 (needs an account of persistence). Upstream of Question 3 (institutional applications) and informs Question 4 (AI).
      *   **Tractability:** High for conceptual philosophers. Draws on philosophy of action, social ontology, and normative ethics.
      *   **Key Sub-Questions:** What constitutes "holding" a rationale custodially? Does expressive extinguishment (e.g., a formal apology retiring a mandate) *extinguish* the rationale or *transform* it? Can reinterpretation generate *new* reasons distinct from the original FFR? Is "marking" a rationale (e.g., a plaque) a weak form of action or a distinct mode?
      *   **Evidence of Progress:** A typology of engagement modes with clear criteria distinguishing "act," "void," "custodial reinterpretation," "expressive acknowledgement," and "formal extinguishment," demonstrated through institutional case studies.

  3.  **Question 3 (Year 3-4, Application - 1 Fellow): How do different institutional types (legal, charitable, corporate) generate, sustain, and legitimately engage with FFRs in practice?**
      *   **Why Prioritise & Why Years of Work?** Translates theory into actionable insight for your target domain. Requires analysing the specific normative architectures of different institutions (e.g., trusts law vs. corporate law vs. constitutional law) and their impact on FFR lifecycles. One fellow suffices as it builds directly on 1 & 2, applying the framework conceptually to institutional structures without needing new empirical research.
      *   **Upstream/Downstream:** Downstream of Questions 1 & 2. Provides the concrete payoff.
      *   **Tractability:** High for conceptually skilled philosophers with an interest in law/political theory. Focuses on institutional design and normative logic within existing frameworks.
      *   **Key Sub-Questions:** How does the "rule against perpetuities" interact with FFR persistence? When does corporate "purpose" become a bearerless rationale? Does constitutional entrenchment make preambular FFRs more robust? How do procedures for amending charters relate to modes of engaging with FFRs?
      *   **Evidence of Progress:** Specific, defensible protocols for different institutions (e.g., "For endowed chairs with obsolete disciplines, apply custodial reinterpretation guided by X principles").

  4.  **Question 4 (Year 4, Fringe - 1 Fellow): Do FFRs pose unique challenges or opportunities for specifying purposes in long-lived Artificial Systems?**
      *   **Why Prioritise Last & Why Limited?** It's adjacent, not core. AI designers *are* intentional agents *now*. The challenge is foreseeing future contexts and ensuring *alignment*, not confronting *existing* bearerlessness. However, studying how institutions handle *anticipated* obsolescence/change (link to self-effacing & bearerless offices) offers valuable analogies for AI design. One fellow in the final year leverages prior work without derailing the core agenda.
      *   **Upstream/Downstream:** Partially downstream of 1 & 2 (concepts of persistence/engagement), but distinct context.
      *   **Tractability:** Conceptual, but requires engagement with AI ethics literature. Lower direct yield for core FFR theory.
      *   **Key Sub-Questions:** Can "custodial" modes be designed *into* AI systems? Does the *potential* for future FFR status create reasons *now* for designers? Is the "alignment problem" partly about avoiding harmful *future* FFRs?
      *   **Evidence of Progress:** A framework showing how institutional strategies for managing FFRs (e.g., built-in review mechanisms inspired by custodianship) can inform robust AI value specification.

  **Declined Question:** *"Do FFRs objectively exist in a Platonic realm?"* While fascinating, resolution wouldn't significantly alter the practical analysis of institutional engagement developed in Q1-3. We can work with a range of metaethical views on normativity.

  **Practical Pay-offs for Institutional Reasoning: A Realistic Assessment**

  *   **Genuine Implications:**
      *   **Moving Beyond the Dichotomy:** Provides concrete, defensible alternatives to "slavish adherence" or "total disregard" for outdated mandates, donor conditions, or constitutional preambles. This is the *primary* pay-off.
      *   **Legitimising Reinterpretation:** Offers a robust normative foundation for institutions to *creatively reinterpret* inherited purposes (custodial mode) without appearing capricious or disrespectful, based on the *persistent normative question* rather than original intent alone.
      *   **Managing Obsolescence:** Provides structured ways to formally acknowledge and retire (expressive/extinguishing mode) defunct statutory mandates or harmful historical rationales, enhancing institutional legitimacy.
      *   **Clarifying Institutional Identity:** Helps institutions distinguish between their core, enduring rationale (which may evolve) and specific, time-bound instructions that may become FFRs.

  *   **Overrated Implications:**
      *   **Solving Constitutional Originalism/Interpretivism Debates:** FFR theory won't end these. However, it *can* reframe debates about preambles or "original purposes" by clarifying the status of the rationale *now*.
      *   **Providing Simple Algorithms:** It won't offer easy answers for every hard case (e.g., exactly *how* to reinterpret). It provides a better conceptual map and toolbox, not a GPS.
      *   **Directly Justifying Radical Redistribution:** While reinterpretation *might* support this (as in the endowment case), it doesn't guarantee it. The normative work of justifying specific outcomes remains.

  *   **Implications That Do Not Follow:**
      *   **Justifying Ignoring Clear, Current Intentions:** FFR theory deals with *orphaned* rationales. It doesn't license ignoring the clear, contemporary reasons of living donors or stakeholders.
      *   **Creating Binding Reasons from Thin Air:** It doesn't validate *any* consideration as a "free-floating rationale." The persistence conditions (Q1) must be met.

  **Artificial Systems Application:** This is **adjacent, not identical**. The core FFR problem arises from *actual* orphanhood within existing normative practices. The AI challenge is *prospective* specification by current agents for future contexts. However, the research is **worth pursuing** (hence Q4) because:
  1.  **Institutional Analogy:** Institutions *are* complex systems often outliving founders. Strategies developed for institutional FFRs (e.g., built-in review for reinterpretation, mechanisms for formal amendment/extinguishment) provide rich analogies for designing *adaptable* AI value systems.
  2.  **Conceptual Stress Test:** Examining how FFR concepts *might* apply to AI forces refinement of the core theory (e.g., on "possible future bearers").
  3.  **Anticipating Orphanhood:** It encourages designers to consider the *potential* for their specified purposes to become detached from any relevant bearer in the future, prompting more robust design.

  In sum, prioritise the metaphysics of persistence (Q1), then the logic of engagement (Q2), followed by institutional application (Q3), with a cautious look at AI (Q4). This sequence builds essential foundations, addresses your core hypothesis, delivers practical tools for your target domain, and maximises conceptual leverage within the constraints. The key practical pay-off is empowering institutions to navigate inherited purposes with nuance and legitimacy beyond the false dichotomy.
