  ## Conditions of Carriage: Trans-Terrestrial Airlines Ltd. (TTA) - Earth/Twin Earth Service

  **1. Definitions & Scope**
     1.1 "Carrier" (TTA) operates scheduled sub-light services between designated ports on Earth ("Origin") and Twin Earth ("Destination"), hereafter "Terminal Points".
     1.2 "Passenger" refers to the individual named on the Ticket. "Cabin Environment" refers to the sealed atmospheric conditions maintained aboard the Vessel during Transit.
     1.3 "Transit Period" denotes the duration between Vessel departure from Origin and arrival at Destination, currently averaging 5.3 Terran years.

  **2. Linguistic & Semantic Framework**
     2.1 **Determination of Utterance Meaning:** The semantic content of any Passenger utterance (including, but not limited to, requests, complaints, declarations, or identifications) made during the Transit Period or upon disembarkation shall be conclusively determined by the prevailing linguistic norms and material context operative at the Passenger's *ultimate point of disembarkation* (Destination), irrespective of the Passenger's physical location or subjective intention at the moment of utterance. TTA reserves the right to consult Destination regulatory authorities on normative usage.
     2.2 **Continuity of Consciousness:** Passengers acknowledge that whilst their biological and psychological states exhibit continuity during Transit, the external factors necessary for the final fixation of certain semantic properties are subject to change relative to the Vessel's position. TTA accepts no liability for Passenger disorientation resulting from the inherent operation of linguistic norms across distinct material environments.
     2.3 **Mid-Transit Re-Anchoring:** Passengers are advised that the referential properties of terms utilised during the Transit Period may undergo unobservable recalibration ("Re-Anchoring") as the Vessel enters the definitive causal sphere of influence of the Destination environment. This occurs without any intrinsic change to the Passenger's cognitive state and is not marked by any sensory or instrumental indication within the Cabin Environment. Re-Anchoring is deemed complete upon the Vessel crossing the Destination's formal Linguistic Demarcation Boundary (LDB), approximately 0.3 light-years out.

  **3. Specific Passenger Provisions**
     3.1 **Beverage Service:** Requests for common liquids (e.g., "water", "tea", "whisky") are fulfilled based on the compositional norms established at the Destination. A Passenger requesting "water" served during Transit but consumed after LDB crossing shall receive H₂O if disembarking on Earth, or XYZ if disembarking on Twin Earth. Complaints regarding compositional variance based on Origin expectations or Cabin Environment understanding will not be upheld. (See Clause 2.1).
     3.2 **Hermeneutic Consistency Requests (Premium Cabin Only):** Passengers requiring Crew to interpret all utterances *exclusively* according to the linguistic norms of the Origin point throughout the entire Transit Period, including post-LDB crossing, must purchase access to the Premium Hermeneutic Cabin (PHC). A substantial supplementary fare applies. PHC service entails Crew utilising Origin-specific reference materials for all interactions; this confers no guarantee regarding the *actual* semantic properties of the Passenger's thoughts or utterances upon arrival at Destination, only a consistent *interpretive framework* applied by Crew. Standard cabin Crew operate strictly under Clause 2.1.
     3.3 **First-Person Semantic Authority Reassurance:** Notwithstanding Clauses 2.1, 2.3, and 3.1, TTA affirms the principle that a Passenger possesses direct, non-empirical knowledge ("A Priori Access") concerning the content of their *own* propositional attitudes at any given moment. Therefore, whilst the *reference* of a term like "water" in an utterance is fixed by Destination norms, the Passenger is always positioned to know, without empirical investigation (e.g., chemistry), *what they meant* by "water" *as an element of their thought* at the time of utterance – even if the ultimate environmental determination reveals that thought to concern XYZ rather than H₂O, or vice-versa. Knowledge of one's thought-content is distinct from knowledge of its external causal antecedents or referential success.

  **4. Liability & Disputes**
     4.1 **Re-Anchoring Disorientation:** TTA shall not be liable for any distress, confusion, contractual misunderstanding, or identity crisis arising from the process of Re-Anchoring (Clause 2.3) or the application of Destination semantic norms (Clause 2.1). Passengers are deemed to have accepted these inherent conditions of Interstellar Linguistic Relativity by purchasing a Ticket.
     4.2 **Complaint Resolution:** All complaints regarding service interpretation, perceived contractual breaches, or beverage composition must be submitted in writing within 14 Terran days of disembarkation at Destination. Resolution will be based solely on the application of Destination norms to the Passenger's utterance/action as per Clause 2.1. Appeals based on Origin norms or Cabin Environment understanding are invalid.

  ---

  **Model Passenger Correspondence**

  **Passenger Complaint (Submitted at Twin Earth Arrivals):**
  > Dear TTA,
  > I boarded your service from London Heathrow (Earth) bound for New Puddleton (Twin Earth) five years ago. Three years into the voyage, whilst still in the Cabin, I requested a glass of "water" from a flight attendant. I was served a clear, tasteless liquid which I consumed. Upon arrival, I discover this liquid was Twin Earth XYZ, not genuine Terran H₂O. I am deeply concerned about potential long-term physiological effects of ingesting XYZ. I demanded terrestrial water, a fundamental human right. I insist on compensation for this deception and the health anxiety caused. I meant *water* as found on Earth – my intention was clear! How could I mean anything else?
  > Yours sincerely,
  > Elara Vance (Ticket #TE-45192-δ)

  **TTA Response:**
  > Dear Ms Vance (Ref: TE-45192-δ),
  > Thank you for your correspondence. Clause 2.1 of our Conditions of Carriage determines that your request for "water", uttered during Transit but resolved upon arrival at Twin Earth, correctly referenced the locally normative substance, XYZ, available in our galley. Your knowledge of your *own intention* (Clause 3.3) is unaffected, but does not alter the externally fixed reference of the term at the Destination. No compensation is due.
  > Sincerely,
  > Customer Resolutions, TTA.
