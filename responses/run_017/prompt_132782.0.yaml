  Hmm, the user is struggling with anthropic reasoning theories for evaluating humanity's long-term survival probability. They want a clear specification of requirements to judge theories objectively, especially for high-stakes decisions like existential risk reduction. 

  The user is clearly frustrated with theoretical gerrymandering and wants practical adequacy criteria. Their examples show deep engagement: Sleeping Beauty's betting vs credence distinction, Doomsday Argument ambivalence, fine-tuning debates, Boltzmann brains, plus two original concerns about vague boundaries and regularization.

  Key angles to cover:
