  For scoring, self-sampling fails Boltzmann brains and regularization, self-indication fails doomsday stability, full non-indexical fails Sleeping Beauty bets, and vanilla conditioning fails almost everything. The takeaway: no theory satisfies all decision-relevant criteria, with empirical adequacy vs self-location being the core tradeoff.

  User's meta-need is clarity about unavoidable compromises. Should emphasize that for their purpose (existential risk math), regularization dependence might be tolerable if bounded, but vague-boundary sensitivity is unacceptable.
answer: |-
  Here's your spec for anthropic reasoning in high-stakes decisions, prioritizing conflicts and trade-offs:

  ### Core Requirements (Non-Negotiable for Decision Use)
  1.  **Empirical Adequacy (vs. Boltzmann Brains):** *Motivation:* Must explain why subjectively identical "Boltzmann brain" experiences don't dominate our credence in being ordinary observers. *Why Non-Negotiable:* Without this, *all* evidence is suspect, undermining any decision calculus. *Conflict Source:* Directly clashes with strong self-locating indifference principles.

  2.  **Stable Updating (vs. Doomsday Instability):** *Motivation:* Adopting theory T now shouldn't force you to *expect* to abandon T after learning your birth rank is early. *Why Non-Negotiable:* Theories failing this are inherently unstable for sequential decision-making (like forecasting humanity's timeline). *Conflict Source:* Requires resisting the Doomsday Argument's baseline shift; satisfying Doomsday often violates this.

  3.  **Vague-Boundary Robustness:** *Motivation:* Credence in key propositions (e.g., "I'm in a long-lived civilization") shouldn't swing wildly based on minor, arbitrary changes to the observer reference class (e.g., including/excluding chimps). *Why Non-Negotiable:* Decisions require robustness; arbitrary sensitivity makes outputs unusable. *Conflict Source:* Challenges theories heavily reliant on precise, non-empirical reference class definitions.

  ### Major Tension Points (Define Camps)
  4.  **Self-Locating Indifference Strength (Sleeping Beauty & Fine-Tuning):** *Motivation:* Should purely indexical information (like "it's Monday" in SB, or "I exist" in a big universe) shift credences? *Tension:* "Thirding" in SB (credence 1/3 Heads) often aligns with granting an "a priori boost" to large universes ("Self-Indication"). "Halving" (1/2) avoids this boost. *Camp Divide:* Boosters see it as correct accounting; opponents see "Presumptuous Philosopher" as reductio. *Conflict Source:* Direct trade-off between satisfying SB thirding bets and avoiding fine-tuning conclusions.

  5.  **Regularization Dependence (Infinite Universes):** *Motivation:* In infinite universes with observer-type duplicates, can credences be well-defined? *Reality Check:* **All known theories depend on the limiting procedure/measure.** *Adjudication:* This is a *result* (inherent problem) not a solvable desideratum. The requirement is: *explicitly acknowledge and justify the chosen measure* for the decision context. Hiding it is fatal.

  ### Key Omissions & Core Conflict
  *   **Omitted but Critical:** Formal decision-theoretic linkage (exactly how credence maps to action in centered worlds). Many theories are silent or ambiguous here.
  *   **Fundamental Incompatibility:** **Empirical Adequacy (1) vs. Strong Self-Locating Indifference (4)**. Explaining why we aren't Boltzmann brains *requires* privileging our specific evidence over pure indexical indifference. The strongest forms of indifference (needed for strict SB thirding or maximal universe-size boosting) undermine Empirical Adequacy. **This is the primary conflict, disqualifying most contenders.**

  ### Theory Scoring (vs. Requirements 1-3 & Stability)

  | Theory               | Empirical Adequacy (1) | Stable Updating (2) | Vague-Boundary Robustness (3) | Notes                                                                 |
  | :------------------- | :--------------------- | :------------------ | :---------------------------- | :-------------------------------------------------------------------- |
  | **Self-Sampling (SSA)** | **Fail**               | **Fail**            | **Fail**                      | Vulnerable to Boltzmann Brains (1). Doomsday shift violates stability (2). Highly reference-class sensitive (3). |
  | **Self-Indication (SIA)** | **Pass? (Contentious)**| **Pass**            | **Fail**                      | May inflate P(large universe) *too* much (Presumptuous Philosopher). Still reference-class sensitive (3). Avoids worst Doomsday instability (2). |
  | **Full Non-Indexical**   | **Pass**               | **Pass**            | **Pass**                      | Conditionalizes only on objective evidence. Fails SB betting (halfer). Ignores indexical info some argue is essential. |
  | **"Condition on Centered Evidence"** | **Pass**               | **Pass**            | **Pass**                      | The frontrunner. Conditions on *all* evidence, including indexical ("I observe X"). Requires solving *how* to do this rigorously. SB is a major test (often leads to halving). |

  **Conclusion:** No theory satisfies all requirements perfectly. **Empirical Adequacy (1)** is the primary filter, eliminating SSA and challenging strong SIA. **"Condition on Centered Evidence"** (properly formalized) currently best meets the non-negotiable decision needs (1,2,3), though SB/fine-tuning (4) remains a deep philosophical tension. Acknowledge measure dependence (5) explicitly. Stability (2) and Robustness (3) are crucial for your purpose and rule out many popular approaches.
