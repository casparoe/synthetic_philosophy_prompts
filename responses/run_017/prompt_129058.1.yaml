answer: |-
  ## Handout: The Kavrem Case & Frege's Puzzle  
  *Setting: A university café, late afternoon. MIRIAM and ADE, both philosophy professors, are finishing coffee after a linguistics colloquium featuring a talk on evidentiality.*

  **ADE:** That talk really got me thinking, Miriam. Especially that fictional language the speaker mentioned at the end – Kavrem? Where names *require* those evidential markers? Seems like a perfect counter to your Fregean senses.

  **MIRIAM:** *(Raises an eyebrow)* Oh? How so, Ade? I thought it rather beautifully illustrated the *need* for public modes of presentation. You can't even *use* a name without specifying *how* it was acquired – perceived, told, inferred, or forgotten. That’s the mode staring you in the face!

  **ADE:** Precisely! But that’s my point. The marker isn’t part of the *name’s meaning*, it’s a pragmatic overlay, a forced indexical about the *speaker’s* informational state. "Hesperus-vi" just means *that thing* – Venus – but the "-vi" signals *I* saw it directly. The *proposition* expressed by "Hesperus-vi is Phosphorus-ru" is still just <Venus, Identity, Venus>. The markers explain why it's *informative* to *me*, given *my* history, but they don't change the bare referent. It’s direct reference plus pragmatics laid bare by syntax! Your "graspable, shareable senses" are just these indexical acquisition paths made visible.

  **MIRIAM:** Hold on. If it’s merely pragmatic, why is it *grammatically mandatory*? Why can a hearer *challenge* it? "You weren’t there, you were told!" That sounds like they’re challenging the *correctness of the name’s deployment*, not just a conversational flourish. In Kavrem, the marker *is* part of the public linguistic meaning associated with the name *on that occasion*. It’s the mode of presentation – the *way* the object is given to the speaker – baked into the very act of referring. That feels deeply semantic, not pragmatic.

  **ADE:** *(Leans forward)* Okay, challenge accepted. Let’s grant it feels semantic *in Kavrem*. But doesn’t that actually *hurt* your case? Modes of presentation are supposed to be *shareable*, right? Frege’s senses are objective, public items we can both grasp. But my acquisition history is *idiosyncratic*. I saw Venus last night ("Hesperus-vi"); you read about it in a book years ago ("Hesperus-ru"). We can’t share *my* seeing or *your* reading. They’re private psychological events! How can *that* be the public sense? It’s messy, forgettable, and I can misremember how I learned the name. A mode of presentation can’t be *that* flimsy.

  **MIRIAM:** *(Nods slowly)* That’s a good point, Ade. The *specific*, concrete token event of acquisition *is* private and ephemeral. But Kavrem doesn’t require me to specify *when* I saw it or *who* told me, just the *type* of source. The mode is the *kind* of access route: perceptual, testimonial, inferential. *That* is public and shareable. We both understand what it *means* to refer to something as "perceived-directly" or "learned-by-testimony," even if our specific instances differ. The challenge isn't about the exact event, but whether the *claimed type* of access is plausible or correct. The *type* is the shareable mode. The *token* is the messy implementation detail.

  **ADE:** Hmm... conceding that the *type* might be shareable is something. But does the *type* actually determine cognitive significance? Imagine this: I learn two names in the same conversation from the same trusted informant. She points to a bright star and says, "That’s Sima-ru" (meaning she’s telling me). Then she points to a different bright star and says, "And that’s Taro-ru" (also told). Later, I discover – shockingly! – that Sima-ru is Taro-ru! Both names carry the *exact same marker* ("-ru"), acquired from the *same source* in the *same context*. Yet the identity "Sima-ru is Taro-ru" is massively informative to me! If the marker *is* the mode of presentation, and the mode is the same for both names, why is the identity not trivial? Your modes seem insufficient to explain informativeness.

  **MIRIAM:** *(Pauses, thinking)* Damn. That *is* a problem. Alright, you’ve landed a hit. The marker *alone* doesn’t capture the full cognitive picture. The *distinctness* of the names themselves – "Sima" vs. "Taro" – still matters, even with the same evidential marker. The marker specifies the *epistemic grounding* of the name, but the name itself provides a distinct *label* within that grounding context. So the mode of presentation might be something like *'the celestial body called 'Sima' acquired by testimony from X'* vs. *'the celestial body called 'Taro' acquired by testimony from X'*. The shared source marker ("-ru") doesn't collapse the distinct labeling acts. The informativeness comes from realizing these two distinct testimonial labels pick out the same thing. So the marker is a *crucial component* of the mode, but not the whole story. The name matters too.

  **ADE:** Interesting retreat. But let me push on substitutivity, which is the bedrock of direct reference. Suppose Kavrem speaker Leila believes "Sima-vi is bright" (she saw it). She *doesn't* believe "Taro-ru is bright" (she hasn't connected them yet). Can I report Leila's belief as "Leila believes Taro-ru is bright"? In direct reference, substituting coreferential names *should* preserve truth in belief reports, because it's the same object believed about. But if I strip the marker and just say "Leila believes Taro is bright," that seems *wrong* in Kavrem – bare names are impossible! And attaching *my* marker ("Taro-infer") would be false; she doesn't have an inferential connection. But attaching *her* marker ("Taro-ru") feels equally wrong because *she* doesn't associate Taro-ru with brightness yet! The marker seems semantically glued to the name in attitude contexts. Your theory might handle this, but mine struggles.

  **MIRIAM:** Exactly! That’s the Fregean point. In belief contexts, the *mode of presentation matters*. Substituting names with different modes (even coreferential ones) can change the truth value of the belief report. Kavrem makes this explicit. You *can't* detach the marker – the mode – from the name in the report without misrepresenting the believer's cognitive state. "Believes Taro-ru is bright" reports a belief involving a *testimony-grounded* presentation of Taro. If Leila's belief involves a *perception-grounded* presentation (Sima-vi), it's a *different belief*, even though it's about the same object. The marker *is* semantically relevant, especially in attitude ascriptions. Your pragmatic story stumbles here.

  **ADE:** *(Sighs)* Okay, that’s a strong point. Attitude reports in Kavrem are a nightmare for pure direct reference. The marker *does* seem part of the content ascribed. Maybe... maybe the proposition believed is richer, involving the mode? Or perhaps the belief report itself forces a tacit reference to the mode. I need to chew on that concession. But let’s consider another case: double acquisition. Imagine young Kavrem speaker Ben. He sees a playful river otter near his home and his mother says, "That's Rin-vi" (perceived). Months later, miles away, he sees another otter (unbeknownst to him, the *same* individual otter that migrated) and his father says, "Look, a Rin-ru!" (testimony). Ben thinks there are two Rins! Now, when Ben hears "Rin-vi is Rin-ru," it’s informative! But here, it’s the *same name* on both sides! If names contribute only bearers, this should be trivial. But it’s not. It seems the *modes attached* ("-vi" vs. "-ru") make the difference. This looks like a win for you – modes are doing the work.

  **MIRIAM:** It *does* seem compelling for senses! The cognitive significance hinges entirely on the distinct modes of presentation associated with the *same* name. The proposition isn't just <Otter, Identity, Otter>; it involves distinct ways of accessing *that* otter via the name "Rin". But Ade... doesn’t this *also* slightly undermine my earlier point? The *name* "Rin" itself isn't carrying a single, fixed public sense here. It's associated with *two* different public modes by the same speaker! The sense is tied to the specific *use*, marked by the evidential. So perhaps the sense *is* more dynamic, more tied to the evidential context of utterance, than a rigid Fregean sense.

  **ADE:** *(Nods thoughtfully)* I’ll take that. It suggests the sense (if we must call it that) isn't eternally fixed to the name, but activated by the evidential marker in a specific act of reference. Now, last puzzle: the unrecoverable marker. Suppose Elara uses a name with "-na" (source unrecoverable). But maybe she *suspects* she was told, or vaguely recalls seeing something like it, but honestly can’t specify. Grammar *forces* her to pick a marker. She chooses "-na". Is she lying? Misrepresenting? If the marker is semantic, this feels semantically defective. If it's pragmatic, it's just a forced hedge. What do you make of it?

  **MIRIAM:** That’s uncomfortable. If modes are public, shareable components of meaning, uttering a marker you know is inaccurate feels like semantic misfire. But Kavrem grammar *demands* a marker. So Elara uses "-na" as the least dishonest option. This suggests the marker *isn't* always a truthful representation of a pre-existing, fully known mode; sometimes it's a grammatical placeholder masking ignorance. It highlights that modes of presentation, even as public types, aren't always perfectly transparent or known to the speaker. The system has a pragmatic escape hatch disguised as semantic content. That’s messy for pure Fregeanism.

  **ADE:** And for me, it emphasizes the *performance* aspect. The marker is something the speaker *does* to satisfy grammar and manage conversational expectations about their epistemic state, not necessarily a window into a fixed cognitive entity. Yet... *(pauses)*... after all this, I admit Kavrem makes it incredibly hard to dismiss modes of presentation. The way they are grammatically mandated, challengeable, and crucial for attitude reports pushes me to think there *is* something semantic and public here, not just speaker psychology. But it’s not Frege’s pristine, eternal sense. It’s messier, tied to epistemic history and utterance context.

  **MIRIAM:** And it pushes me to admit these modes are more dynamic and potentially tied to individual acquisition events than I’d like. The shareability is of the *type*, not the specific token history. But Ade, the core remains: Kavrem shows that reference isn't *just* hooking a bare name to an object. Successful communication requires coordinating *how* we are thinking about the object, and that "how" is publicly signaled, negotiated, and grammatically enforced. That "how" does semantic work, especially in attitude contexts. It can't be relegated to mere pragmatics.

  **ADE:** I agree the "how" is crucial and public. But I still resist calling it genuinely *semantic* content of the *name itself*. The name "Hesperus" still just picks out Venus. The "-vi" or "-ru" tells you about the speaker's *relation* to that reference act. It feels like semantic information *about* the use of the name, part of a richer proposition or the context of utterance, not the name's core meaning. The victory isn’t handed to you; it’s forced us both to complicate our stories.

  **MIRIAM:** Then our sharpened disagreement is this: Is the evidential marker in Kavrem part of the *semantic contribution* of the name to the proposition expressed, constituting a public mode of presentation essential to the thought (Miriam), or is it a separate, pragmatic (though grammatically mandated) element that contextualizes the act of reference without altering the proposition's core object-dependent content (Ade)? And does the necessity and challengeability of the marker in communication show that modes *must* be public components of meaning?

  **ADE:** That captures it. And Kavrem, bless its fictional grammar, makes that question painfully vivid. More coffee? I think we’ve earned it. *(Reaches for the pot)*

  *(Fade out on pouring coffee, the disagreement unresolved but precisely framed.)*
