answer: |-
  **MEMORANDUM**  
  To: Merrivale Hospital Trust Board  
  From: Lay Member, Emerging Genetics Policy Group  
  Subject: Policy Recommendation on Polygenic Embryo Selection & Urgent Case Determination  
  Date: 15 October 2023  

  ---

  ### **I. Introduction**  
  This memo addresses the urgent policy deadlock regarding the use of polygenic risk scores (PRS) in embryo selection at Merrivale Fertility Service. It responds to two competing proposals ("Treatment Test" vs. "No-Maximising Rule") and the immediate case of patients Rachel Okonjo and Daniel Ferris, who have a scheduled embryo transfer in three weeks. After thorough analysis, **I recommend adopting a modified "Treatment Test" approach** with stringent safeguards, while denying the use of PRS for non-medical trait maximisation. This position balances ethical obligations, scientific limitations, patient autonomy, and societal responsibility. An interim decision for Ms. Okonjo and Mr. Ferris is included in Section IV.  

  ---

  ### **II. Recommended Policy: Modified Treatment Test**  
  **Core Principle:** The service may use PRS to deprioritise embryos *only* for conditions meeting **all three criteria**:  
  > (a) Classified as a **severe, diagnosable medical disorder**;  
  > (b) **Routinely treated or prevented** by this NHS trust if manifested postnatally;  
  > (c) Where PRS has been **validated for the embryo’s ancestral background**.  

  **Key Conditions:**  
  1. **Scope:** Permits avoidance of disorders like bipolar I/II (meeting criteria a/b), but *prohibits* trait maximisation (e.g., educational attainment).  
  2. **Disclosure:** Patients must receive a **standardised disclosure statement** co-developed with the Trust Ethics Committee, outlining:  
     - The **limited accuracy** of PRS, especially for mixed-ancestry embryos.  
     - That scores reflect **probabilistic risk, not destiny**.  
     - That inter-embryo differences are **marginal** compared to population-level data.  
     - The **environmental influence** on many scored traits.  
  3. **Ancestry Limitations:** PRS may be offered for mixed-ancestry embryos **only if**:  
     - The lab provides a **quantitative confidence assessment** (e.g., "Predictive accuracy for this trait is reduced by ~40% compared to European-ancestry embryos").  
     - Patients confirm in writing they understand this limitation.  
  4. **Governance:**  
     - All PRS uses require **approval by a rotating clinical ethics panel**.  
     - Policy to be **reviewed in 18 months** or after 20 cases (whichever is sooner).  

  **Rationale for Modified Treatment Test:**  
  - **Medical/Social Distinction:** While imperfect, restricting selection to conditions the NHS treats anchors decisions in **shared clinical standards**, preventing drift into non-medical enhancement. Bipolar disorder (with severe, treatment-resistant manifestations) clearly meets this threshold; educational attainment does not.  
  - **Avoids Paternalism:** Unlike the No-Maximising Rule, this allows transparent discussion of scores with patients, reducing incentives for "fertility tourism" to less-regulated clinics.  
  - **Addresses Expressivity Concern:** By limiting scope to severe medical disorders, we avoid endorsing the view that traits like lower educational attainment inherently diminish life value.  
  - **Scientific Rigour:** Mandating ancestry-specific accuracy disclosures mitigates the risk of misleading patients.  

  ---

  ### **III. Rejection of Alternatives & Counterarguments**  
  **A. Rejection of "No-Maximising Rule" (Strongest Counterargument):**  
  This proposal (allowing risk-ranking but prohibiting disclosure or maximisation) is defended as preventing "child ranking" while reducing severe health risks. Its core strength is avoiding **false precision** and **commodification** of embryos. By withholding scores, it acknowledges that small inter-embryo differences (with overlapping confidence intervals) make numerical comparisons clinically uninformative and ethically hazardous. It rightly fears that disclosing scores invites patients to misinterpret marginal differences as decisive.  

  **Why Overruled:**  
  - **Unenforceable & Paternalistic:** Wealthy patients *will* access scores abroad without counselling, exacerbating health inequities. Domestically, it breeds distrust by deliberately concealing data patients feel entitled to.  
  - **Ignores Autonomy:** Patients like Mr. Ferris have valid trauma-informed reasons to seek transparency; denying this undermines therapeutic partnerships.  
  - **Illusory Neutrality:** Ranking embryos by "aggregate health risk" still implies a "better" or "worse" embryo, just without patient input.  

  **B. Rejection of Unrestricted Maximisation:**  
  While Rachel Okonjo’s "no difference" argument (that no child is harmed because selected children wouldn’t otherwise exist) is logically coherent, **it fails ethically**. It neutralises objections based on *harm to the child* but not objections based on:  
  > - **Social Cohesion:** Normalising selection for non-medical traits could devalue disabled lives or reinforce inequities (e.g., selecting against embryos with lower EA scores may correlate with systemic biases).  
  > - **Moral Distortion:** Treating embryos as objects of optimisation conflicts with the NHS principle of valuing each life unconditionally.  
  > - **Slippery Slope:** Permitting educational attainment opens the door to selecting for height, attractiveness, or other morally arbitrary traits.  

  **Thus, the "no difference" point does *not* justify non-medical selection.** It removes the *individual* harm objection but heightens concerns about *collective* consequences.  

  ---

  ### **IV. Interim Decision for Okonjo-Ferris Case**  
  Given the imminent transfer date:  
  1. **Bipolar Disorder Avoidance: APPROVED.**  
     - **Reason:** Severe bipolar disorder is a treatable but potentially debilitating medical condition. Mr. Ferris’s familial experience justifies deprioritising the highest-risk embryo.  
  2. **Educational Attainment Maximisation: DENIED.**  
     - **Reasons to Disclose to Patients:**  
       > "While reducing severe mental health risk aligns with NHS priorities, selecting for educational attainment crosses into non-medical enhancement. The Trust does not endorse trait optimisation unrelated to health. Additionally, the ancestry-related inaccuracy of this score for your embryos means the ‘highest’-ranked embryo could easily be misidentified. Finally, educational attainment scores partly reflect environmental privilege—not solely innate potential—making them unsuitable for embryo selection."  
  3. **Disclosure Requirements:** The lab must provide the **standardised accuracy statement** (Section II.2) *verbally and in writing* before proceeding.  

  ---

  ### **V. Ancestry, Accuracy & Service Offering**  
  Given the lab’s warning that PRS accuracy diminishes significantly for mixed-ancestry embryos:  
  - **Continue offering PRS**, but **only** with the comprehensive disclosures outlined in Section II.2 and II.3.  
  - **Do not ban PRS for mixed-ancestry patients:** This would inequitably deny services available to others. Instead, empower patients with transparent accuracy data to decide if PRS is meaningful *for them*.  
  - **Mandate the lab report:**  
     > (a) The ancestry composition of training data;  
     > (b) Estimated accuracy reduction for the patient’s ancestral background;  
     > (c) The absolute risk difference between highest/lowest-scoring embryos (e.g., "The difference in bipolar risk between your embryos ranges from 1.3% to 2.1%, compared to a population baseline of 1.5%").  

  ---

  ### **VI. Conclusion & Bottom Line**  
  **Recommendation:** Adopt the **Modified Treatment Test**, permitting PRS only to avoid severe, treatable medical disorders with validated ancestry accuracy, coupled with mandatory disclosures and ethics panel oversight. Prohibit trait maximisation.  
  **Ancestry Offering:** Continue PRS for all ancestries with explicit accuracy disclaimers.  
  **Okonjo-Ferris:** Approve bipolar avoidance; deny educational attainment selection.  
  **Review Timeline:** 18 months.  

  This approach prevents non-medical enhancement while respecting patient autonomy and scientific realism. It acknowledges that PRS is a tool of modest clinical utility—not a crystal ball—and that its ethical use depends on guarding firmly against the illusion that we can, or should, design children.  

  ---  
  *Approved by:*  
  [Lay Member, Emerging Genetics Policy Group]  
  *Next Review:* April 2025
