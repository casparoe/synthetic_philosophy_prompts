prompt: |-
  I've started tracking my beliefs as ranges instead of single numbers — like, I'm 0.4–0.7 that the launch ships on time — because I got convinced point priors are overprecise. My question is how to actually decide with these. I built a little spreadsheet that takes the midpoint of each range and then does ordinary expected-utility maximization, and a friend says that throws away the whole point of going imprecise. I don't see how: surely a range is just a flat spread of second-order probability over the numbers in it, so the average is the right summary — and any decision rule has to collapse the range to one number eventually anyway, since you can't hand someone an interval and have them act on it. So the only real choice is which number you collapse to — mine's the midpoint, a pessimist takes the bottom, an optimist takes the top — and the midpoint seems like the neutral pick. Where am I going wrong?
reasoning: |-
  Okay, the user is tracking beliefs as ranges instead of single numbers to avoid overprecision. They're using midpoints for decisions, but their friend says that defeats the purpose. The user thinks a range implies a flat probability distribution, so the midpoint is neutral. They wonder where they're going wrong.

  First, I need to unpack why using midpoints might be problematic. The key is that ranges in imprecise probability don't necessarily mean a uniform distribution. The user is treating the range as a second-order probability with a flat spread, but that's still a precise probability model. Imprecise probability is about not committing to any single distribution, which avoids overconfidence in the model itself.

  The user's approach collapses the range too early, losing valuable information. For example, if they have a range of 0.4-0.7 for a launch probability, using 0.55 ignores the uncertainty spread. In cases with asymmetric payoffs, this could lead to suboptimal decisions. If missing the launch is catastrophic, the lower end (0.4) should carry more weight, but the midpoint averages it away.

  Also, the user assumes that decisions must collapse to a single number, but there are methods like Maximality or E-admissibility that compare actions without doing that. These evaluate options across all possible probabilities in the range, preserving the uncertainty until the end. The user might not be aware of these frameworks, thinking collapse is inevitable.

  Underlying needs: The user likely wants robust decisions without overprecision but might not realize that midpoints reintroduce precision. They need methods that handle true uncertainty without assuming distributions. They might also need practical tools beyond spreadsheets, possibly exploring decision theories that account for ambiguity aversion.

  I should explain alternative decision rules that use the whole range, like maximizing the minimum payoff (Maximin) or checking for dominance. Highlighting examples with asymmetric risks could show where midpoints fail. Emphasizing the value of retaining uncertainty until decision time to avoid hidden biases is crucial. The user's deeper need is for resilience in decisions, especially under uncertainty, which midpoint averaging undermines.
answer: |-
  You've hit on a core challenge in imprecise probability! Your intuition makes sense, but your friend is partially right: **using the midpoint *as a default* throws away valuable information encoded in the *width* of the range and can lead to systematically suboptimal decisions, especially when payoffs are asymmetric.** Here's the breakdown:

  1.  **The Range Isn't Necessarily a Flat Distribution:**
      *   Your view ("a range is just a flat spread of second-order probability") is *one* interpretation (a uniform prior over the interval). This is a valid *precise* probabilistic model (a specific probability distribution).
      *   **The point of imprecise probability is often to *avoid* committing to *any* single distribution, including the uniform one.** The range represents a *set* of possible probabilities you consider plausible. You don't know *which* distribution within that set is correct, or even if you should assign weights to them. The range expresses fundamental uncertainty or ambiguity.

  2.  **Collapsing Early Loses Information Critical for Robust Decisions:**
      *   **The Width Matters:** The difference between a [0.49, 0.51] range and a [0.1, 0.9] range is huge! The midpoint (0.5) is the same, but your confidence and the potential downside risk are vastly different. Your midpoint method treats these identical situations, which is dangerous.
      *   **Asymmetric Payoffs Are the Killer:** This is where midpoint averaging fails spectacularly. Decisions depend on *interactions* between probabilities and *utilities*. Consider your launch example:
          *   **Action A:** Proceed as planned. Success (Launch On Time) = +$1M, Failure (Delay) = -$10K.
          *   **Action B:** Delay proactively (costs -$50K) but guarantees avoiding catastrophic delay.
          *   **Your Belief:** P(Success) = [0.4, 0.7]. Midpoint = 0.55.
          *   **Midpoint Calculation:**
              *   A: (0.55 * $1M) + (0.45 * -$10K) = $550K - $4.5K = **$545.5K**
              *   B: **-$50K**
              *   **Decision:** Choose A ($545.5K > -$50K)
          *   **The Problem:** This ignores the *worst-case* within your plausible range. What if P(Success) is really 0.4?
              *   A (P=0.4): (0.4 * $1M) + (0.6 * -$10K) = $400K - $6K = **$394K**
              *   B: **-$50K**
              *   Even the worst case for A ($394K) is still better than B (-$50K). Midpoint worked here.
          *   **Now, Change the Payoffs (Introduce Asymmetry):**
              *   **Success (On Time):** +$100K
              *   **Failure (Delay):** **-$500K** (Major penalty, reputational damage)
              *   **Action B (Proactive Delay):** -$50K (fixed cost)
          *   **Midpoint Calculation (P=0.55):**
              *   A: (0.55 * $100K) + (0.45 * -$500K) = $55K - $225K = **-$170K**
              *   B: **-$50K**
              *   **Decision:** Choose B (-$50K > -$170K)
          *   **Check the Extremes:**
              *   **Best Case for A (P=0.7):** (0.7 * $100K) + (0.3 * -$500K) = $70K - $150K = **-$80K**
              *   **Worst Case for A (P=0.4):** (0.4 * $100K) + (0.6 * -$500K) = $40K - $300K = **-$260K**
              *   **B:** **-$50K**
          *   **The Insight:** *Even the best-case scenario for Action A (-$80K) is worse than Action B (-$50K)!* Using the midpoint (which told you B was better) was correct *in this specific calculation*, but it masked the crucial fact that A is *never* better than B within your entire belief range. More importantly, **a pessimist using the lower bound (0.4) would see A = -$260K vs B = -$50K and strongly choose B. An optimist using 0.7 sees A = -$80K vs B = -$50K and still chooses B. The midpoint decision rule didn't reveal the dominance of B across the whole range.** It coincidentally gave the right answer, but it lost the robustness information.

  3.  **Collapsing is Not Inevitable at the Start:** You are right that eventually, you pick one action. However, **robust decision rules work by evaluating actions *across the entire range* before choosing, not by collapsing the range to a point *first*.** Here are common approaches for imprecise probabilities (sets of probabilities):

      *   **Maximin / Wald Rule:** Choose the action with the best worst-case outcome.
          *   Calculate the minimum utility each action could give you over the probability range.
          *   Pick the action with the *highest* minimum utility.
          *   *(Launch Example 2: Min Utility(A) = -$260K, Min Utility(B) = -$50K. Choose B)*
          *   Pros: Very robust, protects against catastrophe. Good for high-stakes, low-trust environments.
          *   Cons: Extremely pessimistic, may miss good opportunities.

      *   **Maximax:** Choose the action with the best best-case outcome. (Optimistic rule, less common/recommended for serious decisions).

      *   **Hurwicz Criterion:** A weighted average of the best-case and worst-case utilities for each action. Choose the action with the highest score. (Requires choosing an "optimism-pessimism" weight).

      *   **Minimax Regret:** Choose the action that minimizes the maximum possible regret (difference between the utility of your action and the utility of the best action you *could* have taken, given the true probability). Computationally more complex.

      *   **E-admissibility:** An action is "E-admissible" if there exists *some* probability within your range for which that action maximizes expected utility. You then need a secondary rule to choose among the E-admissible actions (e.g., Maximin, midpoint, etc.).
          *   *(Launch Example 2: For P(Success) in [0.4, 0.7], Action B yields -$50K. Action A only beats this if P(Success) yields EU(A) > -$50K. Solve EU(A) > -$50K: `P*$100K + (1-P)*-500K > -50K` => `100P -500 + 500P > -50` => `600P > 450` => `P > 0.75`. Since your max P is 0.7 (< 0.75), there is **no probability within your range [0.4, 0.7] where Action A is better than Action B**. Action B is the only E-admissible action. Choose B.)*
          *   This directly uses the range without collapsing it first.

      *   **Maximality:** Action A dominates Action B if A gives a better outcome than B for *every possible probability* within your range. Choose an action that is not dominated by any other action. This often leaves multiple options, requiring a secondary rule.
          *   *(Launch Example 2: Is B dominated by A? No, because at P=0.4, B (-$50K) is much better than A (-$260K). Is A dominated by B? **Yes**, because for every P in [0.4, 0.7], B (-$50K) is better than A (which ranges from -$260K to -$80K, all < -$50K). Action A is dominated. Action B is maximal (only choice). Choose B.)*

  **Why Your Midpoint Approach is a Specific (and Often Brittle) Case:**

  Using the midpoint is equivalent to assuming a *uniform distribution* over your range and *then* doing standard expected utility. This is a valid precise probability model. **The problem arises when you intend your range to represent genuine imprecision/ambiguity/unknowledge, but then you effectively assume it's actually a uniform distribution.** This reintroduces the overprecision you were trying to avoid, just in a different form. It assumes you know enough to weight all points equally, which you often don't.

  **Recommendations:**

  1.  **Acknowledge Asymmetry:** If the payoffs/utilities of outcomes are roughly symmetric, the midpoint is often *fine*. But always ask: "Is the downside risk of being wrong significantly worse than the upside gain?"
  2.  **Use Robust Rules for High Stakes/Asymmetry:** When asymmetry exists or stakes are high, use Maximin, E-admissibility, or Maximality *directly* on the range. Your spreadsheet can handle this:
      *   Calculate EU(Action) for the **Lower Bound** probability.
      *   Calculate EU(Action) for the **Upper Bound** probability.
      *   (Optional but recommended): Calculate it for the midpoint too.
      *   Apply your chosen decision rule (e.g., Maximin: pick action with highest Lower Bound EU).
  3.  **Consider Width:** Don't ignore how wide your range is. A wide range signals higher ambiguity and should push you towards more robust (often more conservative) decisions, regardless of the midpoint.
  4.  **Secondary Rules:** If using E-admissibility or Maximality leaves multiple options, *then* using the midpoint (or your personal risk preference) as a secondary tie-breaker is reasonable. The key is that you only collapse *after* eliminating options demonstrably worse across your entire range of uncertainty.

  **In essence:** The "whole point of going imprecise" is to retain the information about *how much you don't know* (the range width) and *where the risks lie* (the bounds) until the final decision step, allowing you to choose actions that are robust against that uncertainty. Collapsing to a single number (like the midpoint) *before* evaluating decisions discards this crucial information and can lead you to choose actions that are fragile (like Action A in the high-loss scenario) when better, robust options exist. Use the range to evaluate the performance of your *actions* across the spectrum of your uncertainty, not just to find a single "average" probability.
