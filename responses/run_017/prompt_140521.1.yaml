prompt: |-
  I got into an argument about this at board game night and it's been bugging me since, so here goes. My roommate works on evals at one of the big labs and described their setup roughly like this: the scoreboard only ever looks at the final answer. If the system writes two pages of reasoning that is complete garbage and then puts down the right answer, it gets full marks; if it writes a beautiful derivation and fumbles the last digit, it gets zero. The reasoning trace isn't even part of what gets delivered to the customer — it's logged, and nobody reads it unless something is already going wrong. Two systems with identical accuracy, one with clean legible steps and one with nonsense in the middle, count as tied, and then you pick whichever is cheaper and faster. But the moment something does go wrong, or somebody suspects the system of scheming, everyone drops everything and demands to read the traces and grade individual steps in them. And then there's a third thing she said that I keep turning over: they won't train on that step-by-step score. The moment the process grade starts pushing on the weights, the reasoning becomes theater — it learns to write steps that read fine while the actual work happens somewhere you can't see. So the rule is: audit the reasoning, never optimize it. (She also admitted, when I pushed, that nobody can really check whether the trace is *why* the model did the thing, as opposed to a fluent story it produces afterwards that happens to sound right.)

  What makes it feel inconsistent to me is how differently we treat people in what looks like the same situation. My friend in med school says she gets marked down on oral exams for landing on the right diagnosis with no defensible route to it, and a resident who copies a correct answer gets in serious trouble even though the patient was fine. Judges reviewing a government agency will send a decision back because the agency didn't explain itself, even when nobody is claiming the outcome is wrong. A student who gets the right answer by working backwards from the answer key hasn't learned anything. So with humans we're officially process people: what matters is whether you followed a responsible procedure and could give reasons for what you did. With these systems we're outcome people — except during an incident, when we become hardcore process people for a week, and then we go build a process score that is specifically designed never to touch the thing being scored. I don't have the vocabulary for any of this so sorry if I'm describing it badly.

  I'm trying to write a short blog post and I keep going in circles. What does outcome-only scoring actually presuppose — about what a reason is, about what makes a performance good or a belief justified? Is it committed to saying the reasoning is just a causal step on the way to the answer, worth exactly its contribution to accuracy, or could someone who thinks having reasons is the whole point of a rational performance still sign off on it, maybe as a temporary compromise? Does the incident-time audit quietly concede something the first practice denies, or can the two be made to fit together? Does the "audit but never optimize" rule amount to anything more than pragmatism, or does it presuppose that a trace is more like testimony than like a skill, something that stops being evidence the moment you start grading it? And which parts of all this are genuinely forced by the underlying view rather than just convenient — cheap to measure, easy to compare across labs, avoiding the fact that human annotators disagree about what good reasoning even looks like? Finally: if we actually dropped outcome-only scoring, what would evaluation have to look like, and what would we lose?
reasoning: |-
  Okay, I need to understand the user's dilemma. They're wrestling with an inconsistency in how we evaluate humans versus AI systems. Humans are judged on their reasoning process—like med students getting marked down for correct diagnoses without proper justification. But AI systems are evaluated solely on output accuracy, ignoring the reasoning trace unless something goes wrong. 

  The user's roommate works in AI evals and explained their lab's approach: final answer determines the score, reasoning traces are only audited during incidents, and they deliberately avoid training models on step-by-step scores to prevent "reasoning theater." This creates tension because during incident investigations, the same labs suddenly become meticulous process auditors. 

  Hmm, the user is trying to write a blog post but feels stuck. They're asking deep philosophical questions about justification, knowledge, and what makes a "good" performance. Underneath that, I sense they're also troubled by the ethical implications—does this approach let potentially dangerous systems slide until disaster strikes? 

  Let me break this down. First, the core presuppositions of outcome-only scoring: it treats reasoning as purely instrumental. The trace isn't evidence of understanding; it's a byproduct. This clashes hard with how we view human rationality, where justification is constitutive—following proper procedures is how we define "knowing." 

  The incident audits don't necessarily contradict this though. When failures happen, we're not suddenly valuing the process; we're using traces forensically to diagnose system flaws. It's still instrumental—like checking a car's black box after a crash. 

  The "audit but never optimize" rule is fascinating. If you train on step scores, you risk Goodhart's Law—the trace becomes a performance detached from actual reasoning. The roommate hinted at this: models might generate plausible stories while doing the real work "somewhere you can't see." This suggests traces aren't reliable testimony once incentivized. 

  But is this pragmatism or something deeper? Both. Pragmatically, evaluating reasoning quality is messy—human raters disagree, it's expensive. But philosophically, it acknowledges that optimized traces lose epistemic value. Like a student trained to mimic textbook solutions without understanding. 

  What if we dropped outcome-only scoring? We'd need robust process metrics, but that's thorny. Whose reasoning standards apply? Could we even verify if traces reflect true model cognition? We'd likely sacrifice scalability and gain... debatable safety benefits, since "good" reasoning doesn't guarantee correctness. 

  The user might also be hinting at a deeper unease: by accepting outcome-only scoring, are we normalizing systems that "get away" with unexamined flaws until catastrophe? That's worth exploring—perhaps the blog should question whether "temporary compromise" in high-stakes domains is ethically sustainable.
answer: |-
  Here's a breakdown of the tensions and presuppositions in this evaluation approach, drawing from philosophy of mind, epistemology, and AI safety:

  ### Core Presuppositions of Outcome-Only Scoring
  1.  **Instrumentalist View of Reasoning:** Reasoning is merely a *means* to an end (correct output). It has no intrinsic value. Its worth is purely causal: did it (or something) produce the right answer?
  2.  **Black Box Epistemology:** What matters is *that* the system knows (outputs the correct answer), not *how* it knows. Justification is irrelevant if reliability is high enough.
  3.  **Separation of Production & Testimony:** The reasoning trace isn't the *process*; it's a *report* generated *about* the process. Optimizing the report corrupts its value as evidence of the underlying process.
  4.  **Pragmatic Efficiency:** Accuracy is measurable, scalable, and objective(ish). Evaluating reasoning quality is subjective, expensive, and doesn't guarantee better outcomes (and might corrupt them).

  ### Reconciling Outcome-Focus with Incident Audits
  *   **Not a Contradiction, But a Shift in Goal:** During normal operation, the goal is *reliable output*. During an incident, the goal is *diagnosis and repair*. The reasoning trace is treated not as proof of justification, but as a *forensic log* or *debugging tool*.
  *   **Process as Symptom, Not Cause:** Auditors aren't primarily judging the process *as justification*; they're looking for *symptoms of malfunction* (incoherence, contradictions, misapplications of rules) that explain the failure and point to fixes. The "good process" they seek is one that reliably *avoids* failures, not one that meets abstract epistemic standards.
  *   **The "Temporary Concession":** Outcome-focus assumes *general reliability*. Incidents reveal *local unreliability*. Auditing is a temporary suspension of trust in the black box for that specific context, not a wholesale adoption of process-based justification.

  ### "Audit, Never Optimize": More Than Pragmatism
  *   **Goodhart's Law Applied to Cognition:** "When a measure becomes a target, it ceases to be a good measure." Optimizing for *trace quality* risks:
      *   **Reasoning Theater:** The LLM learns to generate *plausible-sounding rationalizations* decoupled from its actual computation ("sycophantic inference").
      *   **Obfuscation:** The "real work" (pattern matching, memorization) happens implicitly, while the trace becomes a fluent story crafted *post-hoc*.
  *   **Destroying Evidence Value:** Optimized traces become *less reliable* for diagnostics. They tell you what the model *wants you to see/hear*, not necessarily what influenced its output. This presupposes the trace is *testimony* (potentially dishonest if incentivized), not a direct readout of the process.
  *   **Preserving Sanity Checking:** An *unoptimized* trace, while potentially messy, might retain more accidental clues about the model's true heuristics or flaws precisely *because* it wasn't polished for human consumption.

  ### Why Humans Get Process Scrutiny (and AIs Don't... Usually)
  1.  **Intentionality & Responsibility:** Humans are moral agents. We demand *justification* to assess intent, culpability, and whether they *should* be trusted next time. AIs (currently) are tools; we care if they *work*, not if they *meant well*.
  2.  **Learning & Generalization:** Human process evaluation ensures they build *transferable skills* and *understanding*. An AI's "understanding" is opaque and its generalization is statistical. We don't (yet) have a reliable way to train or measure "true understanding" in AIs via process.
  3.  **Procedural Legitimacy:** In law/governance, following due process *is* part of the outcome. A correct result achieved arbitrarily undermines the system's legitimacy and predictability. For most current AI outputs, legitimacy stems solely from utility.
  4.  **Detecting Cheating/Copying:** Humans can *choose* dishonest shortcuts. An AI "copying" is just leveraging training data – its fundamental mode of operation.

  ### What Would Change If We Dropped Outcome-Only Scoring?
  *   **Evaluation Challenges:**
      *   **Defining "Good Reasoning":** Whose standards? Formal logic? Domain-specific heuristics? Human-like intuition? Massive subjectivity and annotation cost.
      *   **The Simulation Problem:** How to distinguish *actual* reasoning from *fluent simulation* of reasoning? (Your roommate's key point).
      *   **Granularity:** How detailed must the trace be? Do we score each step? Overall coherence?
  *   **Potential Gains:**
      *   **Earlier Failure Detection:** Flawed reasoning *might* signal impending errors before they happen in critical situations.
      *   **Improved Debugging/Troubleshooting:** Better traces (if genuine) could make fixing errors easier.
      *   **Insight into "Understanding":** *Maybe* it gets us closer to assessing if the model "gets it".
  *   **Potential Losses:**
      *   **Efficiency & Scalability:** Evals become vastly more expensive and slower.
      *   **Objective Benchmarking:** Cross-lab comparisons get harder due to subjectivity.
      *   **Performance:** Optimization pressure might degrade trace *honesty* without necessarily improving *accuracy* (Goodhart's Law). We might get beautifully reasoned wrong answers.
      *   **Focus Shift:** Resources diverted from core accuracy/reliability to trace aesthetics.

  ### The Underlying Philosophy & Temporary Compromise
  Outcome-only scoring fundamentally presupposes a **functionalist, behaviorist view of intelligence**: "If it quacks like a duck (correctly answers like an expert), treat it as a duck (an expert system), regardless of internal mechanism." It prioritizes *reliable utility* over *explainable rationality*.

  Someone who believes "having reasons *is* the point" (a **procedural rationalist**) would find this deeply unsatisfying, even dangerous, especially in high-stakes domains. They might accept it *only* as a **temporary, pragmatic compromise** because:

  1.  **Lack of Alternatives:** We lack reliable methods to measure or optimize "true" reasoning in LLMs.
  2.  **Focus on Minimum Viable Product:** Delivering *functional* systems now, with auditing as a safety net.
  3.  **Avoiding Corruption:** Recognizing that optimizing process *scores* likely corrupts process *testimony*.

  **The Inconsistency You Feel:** It stems from applying a purely instrumental, behaviorist standard to systems performing complex reasoning tasks where we *know* (from human experience) that process matters for robustness, learning, legitimacy, and error prevention. The incident audits are an implicit acknowledgment of this limitation – a concession that when the black box *fails*, we desperately need a glimpse inside, even if that glimpse is imperfect and we daren't train on it. It's a system optimized for cost-effective, measurable success in the *short term*, with audits as a reactive safety valve, not a proactive guarantee of robust rationality. The human examples highlight why pure outcome-focus feels inadequate for any entity performing complex, consequential reasoning.
