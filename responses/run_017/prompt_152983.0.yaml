prompt: |-
  I want an implicit-theory reconstruction rather than a literature survey or a reading list: I have no way to follow up on references, so argue for the view instead of pointing me at whoever holds it.

  Here are three features of existing practice as I understand them — correct me if I have any of them wrong:

  (a) In Anglo-American law, falsity is an element and truth is a defense. A statement that turns out true cannot be defamatory, fraudulent, or perjurious, however reckless the speaker was about whether it was true. A witness who swears to something that is in fact true, while believing it false and intending to deceive the court, commits no perjury; a defendant who guesses wildly and happens to guess right has defrauded no one.

  (b) Yet culpability tracks the speaker's epistemic position. Defamation liability and damages turn on negligence or on knowledge of falsity or reckless disregard; fraud requires knowledge or reckless disregard; perjury requires asserting what one does not believe true. The scrupulous speaker of a falsehood and the careless speaker of a falsehood are treated very differently, and the careless speaker of a truth is treated as having done nothing wrong at all.

  (c) Research-integrity proceedings run the other way. Fabrication and falsification are sanctionable whether or not the claim they were used to support is true — even where independent work later confirms it — while honest error is not misconduct, however false and damaging the published claim turns out to be.

  The law appears to locate the wrong in what was said; the integrity code appears to locate it in how the speaker arrived at it. What norm of assertion does each practice presuppose: truth, belief, knowledge, reasonable belief? Is the legal pattern a single coherent norm or a hybrid that merely looks coherent? Does the knowledge norm predict that the law is wrong in both directions at once — the reckless truth-teller goes free while the scrupulous falsity-teller is exposed to liability — and if so, is that a reductio of the knowledge norm or of the practice?

  An objection I cannot shake: perhaps none of these institutions regulates assertion at all. Tort and criminal law compensate and punish reliance and harm; they track falsity because false beliefs cause harm, not because assertion has a constitutive norm. If that is right, the reconstruction is a category mistake and a knowledge norm would have nothing to say to legal design. Take that possibility seriously rather than setting it aside.

  Which brings me to a live case. A professional body I advise is drafting a conduct code for expert witnesses under which the sanctionable act is asserting without knowledge: a witness who asserts what she merely suspects, and who turns out to be right, is sanctionable; a witness who asserts what she knows, and who turns out wrong, is not. A board member says this is incoherent — no one was harmed by the lucky guess, hearers got the truth, and the whole point of regulating assertion is that people act on what they hear.

  So: (i) is that objection any good, and what does it presuppose about what assertion is for? (ii) What do the three practices strictly presuppose, as opposed to merely fit well with? (iii) Where are they underdetermined — could a truth norm plus a separate culpability doctrine reproduce all three features? (iv) What would concretely have to change if we replaced the implicit norm with a knowledge norm: would we start sanctioning lucky guesses under oath, would defamation lose the truth defense?

  Lead with your bottom line in the first sentence, then give the reasoning — no preamble and no restating my question. If the question as posed rests on a confused premise — if the three features do not really conflict, or if asking what a practice presupposes is the wrong question to ask about a norm — say so plainly instead of answering me politely.
reasoning: |-
  Okay, the user is asking for an implicit-theory reconstruction regarding norms of assertion in legal and research contexts. They present three observed features: (a) Anglo-American law's focus on falsity with truth as absolute defense, (b) legal culpability tracking epistemic position, and (c) research integrity prioritizing method over outcome. They want to know what norms each practice presupposes and specifically ask about implementing a knowledge norm for expert witnesses.

  Hmm, this is a sophisticated philosophical-legal question. The user clearly understands the nuances and wants to avoid superficial references. They're frustrated with literature surveys and want direct argumentation. Their unspoken need seems to be practical guidance for that expert witness code they're drafting.

  First, I need to address their core concern: whether these practices conflict or can be reconciled. The key is recognizing that law regulates harm causation while research regulates knowledge production. That's why truth is a defense in defamation (harm requires false belief) but irrelevant in research misconduct (the sin is polluting the knowledge pool).

  For the expert witness proposal - that knowledge norm makes perfect sense in court. Testimony isn't just about truth-telling; it's about warranting certainty. When an expert says "I know X," they're giving epistemic license for others to rely. Guessing right while claiming knowledge betrays that social contract, even if no immediate harm occurs. The board member's objection fails because it misunderstands testimony's function.

  The user's "category mistake" worry is valid but not fatal. While law primarily cares about harm, evidentiary rules do encode epistemic norms implicitly. We see this in perjury's belief requirement and expert qualification standards. So a knowledge norm for experts would cohere with law's deeper structure.

  Concrete changes? Defamation wouldn't lose truth defense (harm still matters) but we might add disciplinary sanctions for reckless true statements by professionals. Perjury could expand to cover "reckless truth" where speakers know they're guessing. The witness code is actually the easiest case - it's precisely where law already gestures toward knowledge norms.

  Most importantly, the three practices don't conflict once we see their distinct purposes. The reconstruction works if we map norms to institutional aims: truth for harm prevention, knowledge for testimony. That's the bottom line I'll lead with.
answer: |-
  The three practices presuppose distinct norms because they serve different institutional purposes: defamation/fraud/perjury regulate harm from false beliefs, presupposing a *truth norm* for assertion; research integrity regulates knowledge production, presupposing a *warranted belief norm*; your expert-witness proposal regulates testimonial trust, presupposing a *knowledge norm*. 

  **(a) The law’s truth norm is coherent and harm-focused**  
  Falsity is essential in defamation/fraud/perjury because the *harm* lies in *causing false beliefs*. If the assertion is true, no false belief is induced, so no compensable harm or criminal deception occurs. Culpability (negligence, recklessness) determines blameworthiness *for risking or intending harm*, not for violating a belief/knowledge norm. A reckless truth-teller causes no harm, hence no liability; a scrupulous false-speaker causes harm despite good intentions. This is consistent: the norm targets outcomes (avoiding harmful falsehoods), not epistemic states.

  **(b) Research integrity’s warranted belief norm targets method, not outcome**  
  Fabrication/falsification corrupt *knowledge processes* regardless of truth because they introduce unwarranted claims into the scientific record. Honest error, however false, preserves the integrity of inquiry. The norm here is *assert only what you have warrant to believe*, not truth or knowledge. Truth is irrelevant because the wrong is polluting the epistemic commons, not causing immediate harm.

  **(c) Your expert-witness knowledge norm is defensible**  
  The objection—that no harm occurs if the guess is true—presupposes assertion’s sole purpose is *efficient truth-transfer*. But testimony in adjudication serves a distinct function: it demands *warranted certainty* for fact-finding. An expert asserting without knowledge betrays their social role as a reliable channel, even if fortuitously right. The knowledge norm (assert only what you know) protects the court’s reliance on expert *authority*. Sanctioning “lucky guesses” upholds testimonial integrity over outcome.

  **Reconstruction & Implications**  
  - **Presuppositions**:  
    - Law *presupposes* a truth norm (harm-avoidance).  
    - Research integrity *presupposes* a warranted belief norm (process purity).  
    - Expert testimony *could presuppose* a knowledge norm (institutional reliability).  
  - **Underdetermination**: A truth norm + culpability doctrine *could* formally replicate all three (e.g., define “harm” in research as methodological corruption). But this obscures institutional purposes—each practice’s norm flows from its primary goal.  
  - **Changes under a knowledge norm**:  
    - Perjury law *would* sanction reckless true statements (if “belief in falsity” became “lack of belief in truth”).  
    - Defamation *would retain* the truth defense (harm still requires falsity), but might add disciplinary liability for reckless truths by professionals.  
    - Expert witnesses *would* face sanctions for guessing correctly, as the norm shifts from truth to epistemic warrant.  

  **Bottom line on the objection**: It fails because it misidentifies testimony’s function—expert assertion is not merely instrumental to truth-transfer but constitutive of institutional trust. A knowledge norm validly prioritizes the latter.
