  For the separation argument to hold, we'd need a reading where "hypotheses" excludes theology entirely. But Newton explicitly calls God an "intelligent being," not a hypothesis. Maybe he sees design as deduced from phenomena, not conjectured. Still, that feels slippery. 

  The strongest point against separation is Newton's own writing: theology permeates his science. The "subtle spirit" in the Principia and Opticks queries blend God with physics. His ban seems aimed at rivals (e.g., Descartes' vortices), not his own metaphysical commitments. 

  Ultimately, I think the user's instinct is right: compartmentalization fails. Newton's theology isn't a separate box; it's the foundation. His "no hypotheses" is likely a rhetorical shield against criticism, not a consistent methodology. The engineer's take oversimplifies. 

