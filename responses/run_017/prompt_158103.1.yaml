prompt: |-
  I'm putting together a special issue on historical objectivity and I've got two contributors who've been sniping at each other in footnotes for years, so I want to make them do an adversarial collaboration instead. Draft the joint statement they could both sign. One is a reconstructionist in the Rankean line: the historian's job is to recover the past as it actually was, and the archive is what disciplines you into doing that. The other is a narrativist in the Carr/White line: facts only become historical facts by being selected and emplotted, and the plot structure — tragedy, comedy, farce, whatever — is brought to the evidence rather than read off it.

  They've agreed to argue over one fixed hypothetical, the sealed archive case: for a single event there is a closed body of documents, both sides grant every document is genuine and agree about what each one says, and no further evidence will ever arrive — yet they still produce accounts with incompatible causal structure and emphasis. I want them to say what is still in dispute in that case, and whether whatever remains is a factual dispute at all.

  Then give me (a) a numbered section of claims both can sign — about what the archive does and doesn't constrain, about whether a narrative carries counterfactual commitments that evidence could in principle check, and about what "objectivity" would have to mean for either side to care about having it; and (b) a table of the residual disagreements, each row worded the way its own side would accept for its own view, not the way the other side would caricature it.

  For the cruxes I'd guess at least these two: whether emplotment carries counterfactual content the archive can adjudicate, and whether slow convergence among historians with very different politics is evidence of a mind-independent past or only of a shared professional genre. For each crux, name one test, case, or argument both would accept as bearing on it, and write down in advance what each side predicts it will show. If you think part of the dispute is purely verbal — especially around "objectivity," and around whether the narrativist is making a claim about truth or about something else — say which part and why. Don't give me footnotes, bibliographies or reading lists; just the document.
reasoning: |-
  We are drafting a joint statement for two historians with opposing views on historical objectivity. The two contributors are:

  1. The **Reconstructionist** (Rankean): Believes the historian's job is to recover the past "as it actually was," and the archive disciplines this process.
  2. The **Narrativist** (Carr/White line): Believes historical facts are selected and emplotted, and the narrative structure (tragedy, comedy, etc.) is imposed by the historian.

  They are to argue over the "sealed archive" case: a single event with a closed, genuine, and agreed-upon set of documents, no further evidence, but they still produce incompatible causal structures and emphases.

  The joint statement should include:
  (a) A numbered section of claims both can sign.
  (b) A table of residual disagreements, each row worded from the perspective of the side holding the view.

  For the cruxes, we have at least two:
  1. Whether emplotment carries counterfactual content the archive can adjudicate.
  2. Whether slow convergence among historians with different politics is evidence of a mind-independent past or a shared professional genre.

  For each crux, we need:
  - One test, case, or argument both accept as bearing on it.
  - What each side predicts it will show.

  Also, identify any purely verbal disputes, especially around "objectivity."

  Let's structure the document:

  **Joint Statement on Historical Objectivity in the Sealed Archive Case**

  **Preamble:**
  We, the undersigned, a reconstructionist and a narrativist, agree to engage in an adversarial collaboration on the issue of historical objectivity. We consider a hypothetical scenario (the "sealed archive") in which for a single event there exists a closed body of documents. We both grant that every document is genuine and we agree on what each document says. We also agree that no further evidence will ever be available. Despite this, we acknowledge that we would produce historical accounts with incompatible causal structures and emphases. We now set out what we agree on and what remains in dispute.

  **(a) Joint Claims:**
  We both endorse the following statements:

  1. **The Archive Constrains but Does Not Determine:** The archive provides constraints on what can be plausibly asserted about the past. It rules out certain claims as false or unsupported, but it does not uniquely determine a single correct narrative or causal structure.

  2. **Selection and Emphasis are Inevitable:** Any historical account must select which facts to include and which to exclude, and must assign emphasis to some aspects over others. This is a necessary condition for producing a coherent account of the past.

  3. **Narrative as Interpretation:** The construction of a narrative (including the choice of plot structure such as tragedy, comedy, farce, etc.) is an interpretive act. This act is not a mere reproduction of the archive but involves the historian's judgment.

  4. **Counterfactual Claims and Evidence:** Both sides agree that historical narratives may imply counterfactual claims (e.g., "If X had not happened, then Y would not have occurred"). However, we disagree on whether the archive can adjudicate such counterfactuals (see Residual Disagreements).

  5. **Objectivity as a Regulative Ideal:** Both sides value objectivity, but we understand it differently. For the reconstructionist, objectivity means correspondence to the actual past. For the narrativist, objectivity is a property of the historical method that ensures fairness, transparency, and the possibility of intersubjective agreement. We both agree that objectivity, in our respective senses, is worth striving for.

  **(b) Residual Disagreements:**
  We present our disagreements in a table. Each row states a position in the terms that the respective side would accept.

  | Issue | Reconstructionist Position | Narrativist Position |
  |-------|----------------------------|----------------------|
  | **1. The Nature of Historical Facts** | Historical facts exist independently of the historian's narrative. The archive provides direct access to these facts, and the historian's task is to uncover them. | Historical facts are constituted by their place in a narrative. Without selection and emplotment, there are no "historical" facts, only raw traces of the past. |
  | **2. Role of Narrative in Truth** | The truth of a historical account is primarily a matter of its factual accuracy and the correctness of the causal relationships it describes, which are constrained by the archive. Narrative structures are secondary and do not bear on truth. | Narrative structures are essential to the truth of a historical account because they organize facts into a coherent whole. The same set of facts can be emplotted in different, equally true ways, as long as the facts are respected. |
  | **3. Counterfactuals and Adjudication by the Archive** | The archive can adjudicate counterfactual claims implied by a narrative. For example, if a narrative implies that without a certain cause the event would not have occurred, the archive may contain evidence about the necessary and sufficient conditions that can support or undermine that implication. | Counterfactual claims are not directly testable by the archive because they refer to non-actual scenarios. The archive only contains evidence about what did happen, not about what might have happened. Therefore, counterfactuals are interpretive and not subject to direct archival verification. |
  | **4. Convergence as Evidence** | The slow convergence of historians with different political views toward similar accounts is evidence that they are uncovering a mind-independent past. The constraints of the archive gradually correct for initial biases. | The slow convergence of historians reflects the development of shared professional genres and standards of argumentation, not the discovery of a mind-independent past. It is a social process of consensus-building within a community. |

  **Cruxes and Tests:**
  We agree on the following tests to address two key cruxes:

  **Crux 1: Does emplotment carry counterfactual content that the archive can adjudicate?**
  - **Test/Case:** Consider a historical event for which the sealed archive exists, such as the outbreak of a particular war. Both sides will write an account of the causes of the war, and then explicitly state the counterfactual claims implied by their narratives (e.g., "If A had not occurred, the war would not have started"). We then examine whether the archive contains evidence that directly supports or undermines these counterfactual claims.
  - **Reconstructionist Prediction:** The archive will often contain evidence (e.g., contemporaneous assessments, alternative plans, or parallel cases) that can bear on the counterfactual. For instance, if the narrative claims that the war was inevitable due to structural factors, but the archive shows leaders considering and rejecting peaceful alternatives, that undermines the counterfactual of inevitability.
  - **Narrativist Prediction:** The archive will not contain decisive evidence for or against the counterfactual because counterfactuals are not about what happened but about what could have happened. The evidence in the archive is about actual events and cannot directly address non-actual scenarios. The counterfactual is a product of the narrative structure and remains in the realm of interpretation.

  **Crux 2: Is convergence evidence of a mind-independent past or a shared genre?**
  - **Test/Case:** Examine a historical event that was once highly contested (e.g., the causes of the French Revolution) but has seen convergence over time. Analyze the process of convergence: did it occur because new evidence was found (even if the archive is now sealed, we can look at the historical process before it was sealed) or because of shifts in historiographical fashion, professional norms, or political context?
  - **Reconstructionist Prediction:** Convergence occurs primarily when new evidence is discovered and incorporated, leading to a more accurate account. Even in the absence of new evidence, re-examination of the same archive can lead to convergence as biases are corrected and the community moves closer to the truth.
  - **Narrativist Prediction:** Convergence occurs due to changes in the dominant narrative frameworks, professional standards, or societal values. It is not driven by evidence alone but by the evolution of the historical discipline as a discourse community. For instance, the shift from a primarily political to a social history of the French Revolution reflects changing interests and frameworks, not just new evidence.

  **Purely Verbal Disputes:**
  We acknowledge that part of our disagreement about "objectivity" is verbal. The reconstructionist uses "objectivity" to mean truth as correspondence to the mind-independent past. The narrativist uses "objectivity" to refer to a set of methodological standards that ensure impartiality and intersubjective agreement. These are different concepts, and much of the dispute about whether history can be objective dissolves once this distinction is made. Similarly, the narrativist is not denying that there is a real past; they are making a claim about how we access and represent it. The dispute is not about the existence of the past but about the nature of historical knowledge and representation.

  **Conclusion:**
  We agree that the sealed archive case highlights the limits of the archive in determining historical accounts. We disagree on whether the residual differences are matters of fact or interpretation. We hope this joint statement clarifies our respective positions and provides a basis for ongoing discussion.

  Signed:

  [Reconstructionist's Name]

  [Narrativist's Name]
answer: |-
  ### Joint Statement on Historical Objectivity in the Sealed Archive Case  

  **Preamble**  
  We, a reconstructionist and a narrativist, agree to collaborate on the "sealed archive" hypothetical: a finite, fixed corpus of genuine documents, with no disputes over authenticity or literal meaning, and no prospect of new evidence. We acknowledge that even under these constraints, our accounts would exhibit incompatible causal structures and emphases. This joint statement clarifies (a) shared claims about the archive’s role, narrative constraints, and objectivity; and (b) residual disagreements. We identify two cruxes for ongoing debate and isolate purely verbal disputes.  

  ---

  ### (a) Jointly Endorsed Claims  
  Both signatories affirm the following:  

  1. **The Archive as Constraint, Not Arbiter**:  
     The archive rules out demonstrably false claims (e.g., denying a documented action) and imposes boundaries on plausible interpretation. It does not, however, mandate a single causal hierarchy or thematic emphasis.  

  2. **Narrative as Inevitable but Not Unconstrained**:  
     All historical accounts require selection, omission, and causal weighting. This process is disciplined by the archive (e.g., excluding unsupported assertions) but not determined by it.  

  3. **Emplotment as Interpretive, Not Arbitrary**:  
     Narrative structures (e.g., tragedy, farce) are imposed by the historian, yet they must be compatible with the documents. Incompatibility arises when a plot contradicts explicit evidence (e.g., framing a triumph as a tragedy when the evidence shows unanimous contemporary celebration).  

  4. **Counterfactual Commitments in Narrative**:  
     Causal claims imply counterfactuals (e.g., "X caused Y" entails "Without X, Y would not have occurred"). The archive cannot *directly* test these (as they address non-events), but it can supply evidence to assess them indirectly (e.g., via contextual patterns).  

  5. **Objectivity as a Shared Aspiration**:  
     Both sides value objectivity as:  
     - **Reconstructionist**: The regulative ideal of approximating the past "as it actually was."  
     - **Narrativist**: The procedural ideal of minimizing distortion through transparent methods and intersubjective critique.  
     We agree objectivity is not binary but gradational, measured by adherence to evidence and reasoned debate.  

  ---

  ### (b) Residual Disagreements  
  The table below states positions in each signatory’s preferred terms:  

  | Issue | Reconstructionist Position | Narrativist Position |  
  |-------|----------------------------|----------------------|  
  | **1. Origin of Causal Structure** | Causal relationships exist in the past and are discovered through rigorous archival analysis. Disagreements in the sealed archive case stem from incomplete reconstruction, not interpretive freedom. | Causal relationships are imposed through emplotment. The archive underdetermines causal weighting; disagreements reflect divergent narrative choices, not recoverable "actual" structures. |  
  | **2. Epistemic Status of Narrative** | Narrative is a vehicle for conveying recovered truths. Incompatible accounts imply factual error (e.g., misjudging contingency vs. necessity). | Narrative constructs historical meaning. Incompatible accounts reflect legitimate perspectival diversity, provided both respect documentary constraints. |  
  | **3. Counterfactuals and Archival Adjudication** | Counterfactuals are empirically grounded: the archive holds evidence for necessity/contingency (e.g., alternative plans in documents). Disagreements are factual and resolvable through better analysis. | Counterfactuals are heuristic tools, not truth-apt claims. The archive informs but cannot verify them; disagreements are interpretive, not factual. |  
  | **4. Convergence as Evidence** | Convergence among diverse historians signals progress toward the mind-independent past, as biases cancel out under archival pressure. | Convergence reflects evolving genre conventions, not an external reality. It is consensus within a discursive community, anchored to shared methods, not ontology. |  

  ---

  ### Cruxes: Tests and Predictions  
  #### **Crux 1: Does emplotment carry testable counterfactual content?**  
  - **Test Case**: The July Crisis (1914), using the sealed diplomatic archives. Both accounts must state counterfactuals implied by their causal emphases (e.g., "Austria’s ultimatum to Serbia was necessary for war" vs. "war was inevitable due to military mobilization schedules").  
  - **Reconstructionist Prediction**: The archive contains evidence to adjudicate this (e.g., records of leaders debating alternatives, mobilization timelines). If Austria considered accepting Serbia’s response but Russia mobilized prematurely, this falsifies inevitability.  
  - **Narrativist Prediction**: The archive shows what occurred, not what *would* have occurred. Counterfactuals remain "as if" constructs; the same evidence supports multiple plots (e.g., "tragedy of errors" vs. "structural breakdown").  

  #### **Crux 2: Is convergence evidence of mind-independence or genre?**  
  - **Test Case**: Shifting interpretations of the French Revolution’s causes, from political (e.g., Carlyle) to social (e.g., Soboul). Track whether convergence correlates with new evidence or methodological shifts.  
  - **Reconstructionist Prediction**: Convergence follows evidence integration (e.g., archival work on peasant grievances). Disagreements narrow as the archive disciplines interpretation.  
  - **Narrativist Prediction**: Convergence follows genre changes (e.g., rise of social history), not new evidence. The "same" archive yields new narratives when plot conventions shift (e.g., from "heroic struggle" to "systemic failure").  

  ---

  ### Purely Verbal Disputes  
  1. **"Objectivity"**:  
     - The reconstructionist uses it ontologically (correspondence to the past).  
     - The narrativist uses it methodologically (fairness, corrigibility).  
     This is verbal: both agree on the *value* of rigorous, evidence-based inquiry but label it differently.  

  2. **"Factual Dispute"**:  
     - The reconstructionist sees residual disagreements as factual (resolvable with ideal analysis).  
     - The narrativist sees them as perspectival (irreducible without new evidence).  
     This conflates "fact" (agreed document) with "significance" (context/weight), a category error.  

  3. **"Truth" in Narrative**:  
     The narrativist denies that plot structures are true/false in a correspondence sense; they are judged by coherence, insight, or fruitfulness. The reconstructionist sees this as conflating truth with utility.  

  ---  
  **Conclusion**: In the sealed archive case, we agree that disputes persist over causal weight and narrative form. We disagree on whether these are factual errors or interpretive choices, and on what objectivity demands. This collaboration clarifies that our core divide is epistemological: what counts as a "fact" beyond the document, and whether history’s purpose is recovery or meaning-making.  

  Signed,  
  _________________________ (Reconstructionist)  
  _________________________ (Narrativist)
