answer: |-
  ## Terms and Conditions for FormaCover Plus™  
  **Issued by Ontic Assurance Group (OAG)**

  **1. Definitions & Interpretation**  
  1.1. **Forma Unit:** The minimally designated quantum of programmable matter supplied by the manufacturer, identified by serial number. This constitutes the fundamental insured substrate ("Substrate S").  
  1.2. **Functional Configuration (FC):** Any specific, user-instructed arrangement of the Substrate S possessing distinctive causal powers and/or aesthetic properties recognized by common parlance (e.g., "chair," "lamp," "statue of Athena").  
  1.3. **Distinct Objects (DO):** OAG recognizes that Substrate S and any FC it constitutes are *numerically distinct objects* occupying the same spatial region simultaneously, due to differing persistence conditions. Insured status applies separately to each scheduled DO.  
  1.4. **Temporal Stage (TS):** A temporally thin, instantaneous slice of any DO. Loss events are assessed relative to the specific TS(es) affected. Claims must specify the temporal boundaries (UTC timestamp ± 0.5 seconds) of the damaged/missing TS(es).  
  1.5. **Arrangement Without Object (AWO) Rider:** (Optional) Policyholders asserting the eliminativist position ("There are no chairs, only matter arranged chair-wise") may elect this rider. Coverage applies *only* to damage preventing the Substrate S from entering *any* FC *functionally equivalent* to the FC active at the loss event timestamp, as verified by OAG-approved pattern-matching algorithms. Premiums are lower; payouts are calculated solely on Substrate S repair/replacement cost minus depreciation of functional capacity.

  **2. Scheduling & Premium Calculation**  
  2.1. The Policyholder **must** schedule all DOs for which coverage is sought, including Substrate S and *each* distinct FC routinely assumed.  
  2.2. Premiums are calculated per scheduled DO per calendar month. Initial premium is based on declared usage frequency of each FC. OAG reserves the right to audit usage logs.  
  2.3. Introducing a *new* FC (e.g., "desk," "abstract sculpture #7") requires amendment to the schedule and payment of an additional pro-rata premium. Failure to schedule a FC voids coverage for loss events occurring while the Forma Unit was in that FC.  
  2.4. The AWO Rider premium is a flat rate based solely on Substrate S value and usage intensity. Scheduling FCs is prohibited under this rider.

  **3. Covered Perils & Payout Determination**  
  3.1. **Destruction:** Irreversible loss of structural integrity or programmable capacity of *at least one* scheduled DO's relevant TS.  
      *   3.1.1. Payout is the replacement value of the *destroyed DO* at its scheduled FC (or as Substrate S if destroyed in base state or under AWO Rider), pro-rated for the remaining lifespan of the specific TS if less than 24 hours old at loss.  
      *   3.1.2. If Substrate S is destroyed, *all* scheduled DOs constituted by it are deemed simultaneously destroyed.  
  3.2. **Damage:** Impairment preventing a scheduled DO from functioning as its scheduled FC *or* reverting to Substrate S.  
      *   3.2.1. Payout is the repair cost or diminution in value *of the specific scheduled DO* affected.  
      *   3.2.2. Damage *only* affecting Substrate S's ability to form *non-scheduled* FCs is not covered.  
  3.3. **Salvage:** In case of total loss, OAG takes title to the remnant matter *only as Substrate S*. Any claim that a distinct FC survives in the remnant is subject to OAG's "Vagueness Threshold" (Clause 5).

  **4. Gradual Replacement & Continuity**  
  4.1. OAG recognizes that Forma Units may undergo piecewise replacement of their constituent matter over time ("Gradation").  
  4.2. **Continuity Threshold:** A Forma Unit is considered the *same* Substrate S or FC DO if the rate of matter replacement does not exceed 5% of total mass per 24-hour period.  
  4.3. **Excess Gradation:**  
      *   4.3.1. If replacement exceeds 5%/24h, OAG deems the *original* Substrate S/FC DO to cease existing ("Termination Event").  
      *   4.3.2. A *new* Substrate S/FC DO is deemed created ("Inception Event").  
      *   4.3.3. Coverage for the original DO terminates at the Termination Event timestamp. Coverage for the new DO begins only if scheduled *prior* to the Inception Event. No coverage exists for the interval between Termination and Inception.  
  4.4. Policyholders must log all matter replacement exceeding 1% mass. Failure to log voids coverage for related claims.

  **5. Vagueness & The Problem of the Many**  
  5.1. OAG acknowledges potential indeterminacy in the precise spatial/temporal boundaries of any DO ("Borderline Cases").  
  5.2. **Vagueness Threshold:** For payout purposes, the existence and identity of a DO are determined by OAG-appointed assessors applying a 70% functional/cultural recognition threshold to the configuration at the exact loss-event TS.  
  5.3. Where multiple, overlapping configurations meet the 70% threshold for the *same* FC type (e.g., multiple "statue of Athena" candidates differing by a few surface voxels), OAG will prorate the payout value equally across all candidates meeting the threshold. The policyholder cannot selectively schedule only one candidate.

  **6. Emergent Properties & Life**  
  6.1. Should any scheduled DO (including Substrate S) spontaneously develop properties meeting OAG's definition of "Biological Life" (see Appendix 7: Metabolic Activity & Self-Replication Thresholds):  
      *   6.1.1. Coverage for *all* scheduled DOs constituted by that matter is **immediately and irrevocably voided**.  
      *   6.1.2. The policyholder must notify OAG within 1 hour of detection. Failure voids any future claims on the policy.  
      *   6.1.3. OAG disclaims all liability for living entities constituted from insured matter.

  **7. Exclusions**  
  7.1. Loss or damage arising from the Policyholder's philosophical reassessment of the ontological status of their Forma Unit (e.g., sudden conversion to Eliminativism without purchasing the AWO Rider).  
  7.2. Loss of value attributed to "Merely Cambridge Changes" (e.g., the statue *becoming* unique solely because all others are destroyed).  
  7.3. Claims arising from the discovery or assertion of a previously unscheduled, theoretically possible FC constituted by the Substrate S at the time of loss.  
  7.4. Consequential loss of utility for *non-scheduled* FCs resulting from damage covered under Clause 3.2.  
  7.5. Acts of Philosophy Majors (Specific Endorsement available at extra premium).

  ---
  ## Commentary: The Metaphysics in the Fine Print

  1.  **Core Constitution Theory (Clauses 1.3, 3.1.1, 3.1.2):** The policy explicitly adopts the view that the clay (Substrate S) and the statue (FC DO) are distinct due to different modal properties (surviving squashing). This is fundamental to requiring separate scheduling and allowing one to be "destroyed" while the other persists (e.g., Substrate S destroyed takes all FCs with it, but a FC destroyed leaves Substrate S intact for salvage). The exaggeration lies in the *actuarial enforcement* of this distinctness – demanding users list every statue-configuration as a separate insured "object." A constitution theorist might object that while distinct, we don't *typically* treat every statue-configuration as a wholly new enduring object in daily life; the policy pushes the ontological commitment to an administrative extreme.
  2.  **Temporal Parts / Perdurantism (Clauses 1.4, 3.1.1):** The requirement to specify the exact temporal stage (TS) damaged and prorate payouts for short-lived stages is a reductio of the 4D view that objects are sums of temporal parts. The humor comes from the bureaucratic nightmare of insuring instantaneous slices. The exaggeration is fair – if objects *are* just spacetime worms, insuring *part* of the worm logically follows, however impractical.
  3.  **Eliminativism / Anti-Realism about Artifacts (Clause 1.5 AWO Rider):** The rider directly implements the "there are only arrangements of matter" view. The satire lies in offering it as a cost-saving option and the restriction that damage must prevent *functional equivalence*, not just the specific arrangement. This accurately reflects the eliminativist focus on function/causal role over objecthood. A defender would likely agree this captures the core commitment, even if they'd blanch at insurance forms.
  4.  **Vagueness & The Problem of the Many (Clause 5):** Clause 5.2-5.3 tackles the sorites problem for objects (when does replacement make a new thing?) and the problem of the many (which precise collection of matter *is* the statue?). The 70% threshold and prorating across candidates are absurdly arbitrary but necessary administrative responses to the philosophical problem. This is fair satire – vagueness *does* force arbitrary lines in practice (like legal definitions of adulthood), and insurers *would* need such a rule.
  5.  **Gradual Replacement / Ship of Theseus (Clause 4):** The 5%/24h threshold for a "Termination Event" is a direct, arbitrary solution to the sorites paradox applied to identity over time. The humor is in the precise quantification and the coverage gap it creates. This exaggerates the *need* for a threshold inherent to any endurance view facing gradual change, highlighting the discomfort point. A theorist might argue identity isn't actually quantized like this, but the policy forces a quantized *practical* judgment.
  6.  **Emergent Properties / Life (Clause 6):** This targets the special problems life poses for constitution (is a living thing constituted by, but distinct from, its matter in a different way than a statue?). The instant voiding reflects the radical ontological shift life implies in many theories. The satire is in the draconian, immediate cancellation and the one-hour reporting rule, emphasizing the disruptive metaphysical weight given to "life."
  7.  **Reductio Actuarialis:** The entire structure achieves the requested reductio. Premiums scale with how many "objects" you admit to having (`Constitution Theory`). You must anticipate and schedule future configurations or lose coverage (`Modal Realism`). Payouts require specifying lost temporal slices (`Perdurantism`). You can opt for a cheaper, ontologically pared-down policy (`Eliminativism`). Life triggers an existential crisis (`Emergence`). Arbitrary thresholds manage vagueness (`Sorites`). The industry monetizes the distinctions by charging per object, per configuration change (scheduling amendment), and for managing borderline cases (assessor fees). The observable outcome – a broken lump of programmable matter – remains the same, but the payout varies wildly based solely on the scheduled ontological commitments and the precise timestamp of failure. The system is perfectly legible internally but absurdly detached from the physical reality it insures.
