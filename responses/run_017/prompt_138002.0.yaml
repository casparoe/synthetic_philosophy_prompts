  Hmm, the user is asking me to analyze authorship practices in academic publishing from a philosophical perspective, specifically drawing on theories of joint action and collective intentionality. They work on research integrity policy and need to evaluate a proposed "distributed guarantee authorship" model for large collaborations. This is a complex, multidisciplinary analysis requiring careful application of social ontology concepts to real-world practices.

  The user has outlined several key issues: the standard four-condition authorship regime; its violations in mega-authorship papers and posthumous authorship; the exclusion of AI systems; and the new distributed guarantee proposal. They want me to reconstruct the implicit theory behind current practices, assess what's philosophically required versus contingent, evaluate strains in the system, and project what policy changes different theoretical commitments would entail.

  Breaking this down: First, I need to identify relevant theories from collective intentionality literature. The main candidates are Bratman's shared intention theory (emphasizing interdependent intentions), Gilbert's plural subject theory (requiring joint commitment), Tuomela's collective acceptance view (focusing on collectively holding something as true), and List & Pettit's group agency framework (requiring robust organizational structures). Each offers different criteria for genuine joint action.

  Examining current practices: The four conditions (contribution, drafting/revision, approval, accountability) seem individualistic at first glance. But the accountability requirement - especially the mutual identification and confidence provisions - creates interdependence that goes beyond mere role allocation. This suggests Bratman's shared intention framework fits best, as it requires meshing subplans and mutual responsiveness. The system expects authors to function as a team with shared responsibility, not just adjacent contributors.

  Contradictions emerge in how the rules are applied: Mega-authorship papers violate the mutual identification requirement; posthumous authorship breaks the accountability condition; AI exclusion assumes responsibility is constitutive of authorship. These exceptions reveal that the accountability norm is treated as essential in principle but pragmatically waived when inconvenient. The AI exclusion in particular presupposes that answerability is definitional to authorship - a substantive philosophical claim.

  Now evaluating the distributed guarantee proposal: It replaces joint accountability with component-level guarantees and mutual reliance statements. This resembles structured mutual reliance without true shared intention. While it might mimic Gilbert's plural subject theory through the reliance statements, it lacks the joint commitment to the whole that Gilbert requires. The proposal essentially fragments authorship into individual contributions with contractual safeguards, abandoning the notion of collective ownership. What's lost is the capacity for group-level reason-giving - no one can explain why these particular components form a coherent whole.

  If journals adopted different theoretical bases, policies would change significantly:
  - Under plural subject theory, we'd require explicit joint commitments to the work.
  - Under group agency theory, collaborations would need formal decision procedures.
  - Under pure individualism, accountability would be optional.
  - The distributed model could work if framed as creating new collective agents through reliance statements.

  The practice is underdetermined regarding whether accountability creates or merely regulates authorship. Observing how institutions handle misconduct investigations could clarify this: if they treat the author group as a single accountable entity, that supports collective intention views; if they only target individuals, it suggests individualism.

  My key conclusions: Current practice implicitly assumes Bratman-style shared intention; the distributed proposal rejects this for fragmentation; AI exclusion reveals our deep commitment to responsibility as constitutive. For large collaborations, instead of fragmentation, we should consider formalizing them as group agents with proper decision structures - that would preserve accountability while scaling up.
answer: |-
  ## The Implicit Social Ontology of Academic Authorship

  Our current authorship regime and the proposed distributed guarantee model reveal deep tensions in how we conceptualize collective intellectual work. After analyzing the practices through the lenses of Bratman's shared intention, Gilbert's plural subject, Tuomela's collective acceptance, and List & Pettit's group agency theories, I argue the standard four-condition framework *implicitly presupposes a Bratmanian shared intention structure*, while systematically violating its own presuppositions in large-scale and posthumous cases. The distributed proposal abandons this core commitment entirely, fragmenting authorship into atomized guarantees. Here’s the reconstruction:

  **Core Philosophical Presuppositions of Current Practice:**
  1.  **Bratmanian Shared Intention at the Core:** The requirement for *substantial contribution* to core intellectual elements (conception, analysis, interpretation) + *drafting/revising* + *mutual identification and confidence* strongly implies Bratman's conditions: authors must have (a) *interlocking intentions* towards the shared goal (publishing valid work), (b) *meshing subplans* (coordinated contributions), and (c) *mutual responsiveness* (relying on and being answerable to each other). The accountability clause operationalizes mutual responsiveness by demanding authors act as a team to address problems.
  2.  **Accountability as Constitutive, Not Merely Aspirational:** The requirement to "be accountable for *every aspect*" signals that authorship *is* a status involving answerability. This isn't just appended credit; it defines the role's normative core. Excluding AI because it "cannot consent or take responsibility" explicitly confirms this: responsibility-capacity is seen as *necessary* for authorship. The practice contradicts itself (mega-authorship, posthumous authors) precisely *because* this accountability is practically impossible in those cases, revealing its conceptual centrality.
  3.  **Weak Group Agency/Plural Subject Hybrid (Aspirationally):** The "corresponding author" role is an individualistic concession. However, the expectation that *all* authors approve the final version and stand jointly accountable suggests an *inchoate aspiration* towards a Gilbertian plural subject (jointly committed to the paper's content as "our" work) or a minimal group agent (where the author list functions as a unit for accountability purposes). The mutual confidence requirement gestures towards this, but lacks the formal joint commitment Gilbert demands.
  4.  **Collective Acceptance for the List, but Not the Status:** The *list of authors* is collectively accepted by the authors themselves (via approval) and the journal (via publication). However, the *status of being an author* is defined by the four conditions, not *solely* by collective acceptance (Tuomela). The conditions constrain *who* can be accepted into the author role based on contribution and responsibility-capacity.
  5.  **Credit Allocation as Secondary:** The contributor roles taxonomy demonstrates that credit allocation can be detached from the core authorial status defined by the four conditions (especially accountability). One can get credit (listed as "data curation") without being an author precisely because one avoids the accountability burden. Authorship proper combines credit *with* responsibility.

  **Where Practice is Underdetermined & Contradictory:**
  *   **Underdetermined: The Nature of the "Group":** The rules are compatible with Bratman's shared intention (interacting individuals) *and* a weak Gilbertian plural subject (minimal joint commitment to "our paper") *or* a minimalist group agent (the author list as an accountable unit). It does *not* require List & Pettit's robust group agency (distinct decision procedures, attitude aggregation).
  *   **Strains Reveal Core Commitments:**
      *   **Mega-Authorship:** Violates mutual identification/confidence and joint accountability. This *works* practically (for credit, resource allocation) but *fails* the regime's own Bratmanian presuppositions. It reveals the regime prioritizes individual contribution tracking *over* genuine shared intention/responsibility when scale makes the latter impossible.
      *   **Posthumous Authors:** Waiving approval/accountability shows these are seen as *procedural* requirements of living agents, not core to the *concept* of authorship *in retrospect*. The deceased contributed under a *past* shared intention, but their current non-agency prevents fulfilling the procedural accountability *duty*. The underlying contribution still warrants authorship credit, highlighting a tension between authorship-as-historical-fact and authorship-as-ongoing-responsibility.
      *   **AI Exclusion:** This decisively shows the practice presupposes *answerability capacity* is constitutive. An AI cannot *intend* (Bratman), *commit* (Gilbert), or *be held responsible* (all theories) in the required sense. This is principled based on the accountability core, not ad hoc.

  **Analyzing Distributed Guarantee Authorship:**
  This proposal explicitly rejects the Bratmanian core and the weak group/plural subject aspiration. It embodies:
  1.  **Atomized Individualism:** Authorship fragments into individual guarantors for isolated components. There is no shared intention towards the *whole* work, only individual intentions regarding specific parts.
  2.  **Structured Mutual Reliance (Not Shared Agency):** The reliance statement ("I relied on others; I'd withdraw if I knew theirs was bad") creates a network of *contractual-like obligations* between individuals concerning their *own* components. It mimics the *effect* of Bratman's mutual responsiveness regarding component *inputs*, but lacks any joint commitment (Gilbert) or shared goal (Bratman) regarding the *integrated whole paper*.
  3.  **Component-Level Accountability:** Accountability is strictly partitioned. No one is responsible for the synthesis, the overall argument, or the paper *as such*.
  4.  **The "Collaboration" as a Label, Not an Agent:** Listing the collaboration as "author" is purely nominal. It has no decision procedures, no attitudes, no capacity for action or answerability. Sanctions remain individual. This is *not* group agency; it's a label for a bundle of individual guarantors.

  **What is Lost?**
  The crucial loss is **answerability for the integrated whole**. No entity (individual or group) can explain *why these specific components form a valid, coherent intellectual contribution*. No one can defend the overall methodology, justify the interpretation linking figures to conclusions, or accept responsibility for the paper's overall integrity beyond the sum of its parts. If the collaboration *were* a genuine group agent (List & Pettit), it *could* fill this role: having decision procedures to integrate components, formulate the paper's core claims as *its* claims, and be answerable for them. The distributed model avoids creating such an agent.

  **What Would Change Under Rival Theories?**
  Adopting different core theories would necessitate concrete policy shifts:

  1.  **Gilbert's Plural Subject:** Journals would require evidence of an *explicit joint commitment* to the paper as "our" work (e.g., a signed joint statement of commitment alongside individual contributions). Approval would be reframed as reaffirming this commitment. Retractions would target the plural subject; sanctions might involve dissolving it or collective censure *before* individual penalties.
  2.  **List & Pettit's Group Agency:** Authorship would require the group to *demonstrate* it meets agency criteria *before* submission. Journals might demand: a constitution, documented decision procedures for key authorship tasks (final approval, response to queries/retractions), and designation of a spokesperson *authorized by the group*. The *group* would be the primary accountable entity in retractions. Mega-collaborations could only be authors if formally organized as agents (like corporations).
  3.  **Tuomela's Collective Acceptance:** Focus would shift to the group's *collective holding* of the work as "ours." The four conditions might become less important than a demonstrable collective agreement on who counts as an author and acceptance of the work. Accountability might become collective but less individually enforced. AI exclusion might be relaxed if the *group* collectively accepted the AI's output as "theirs" (though the responsibility-capacity issue remains).
  4.  **Pure Individualism (Rejecting Collective Intentionality):** The accountability condition would be abandoned or severely weakened ("accountable only for my specific contribution"). Contributor roles would largely replace authorship. Credit would be paramount. AI could potentially be listed as a "contributor" if its output was substantial. Retractions would only target specific components/individuals.

  **Settling the Underdetermination: The Role of Accountability**
  The key underdetermined question is whether the mutual identification/confidence and joint accountability requirements merely *regulate* a credit-based practice or *constitute* a distinct kind of collective action. Observing **how institutions handle misconduct** clarifies this:
  *   If investigations *always* start by demanding the *author group as a whole* respond and provide a unified account (before drilling down), this supports Bratman/Gilbert/Group Agency (shared responsibility is primary).
  *   If investigations *solely* target individuals based on contributor statements, bypassing the group, this supports individualism (authorship is just a label for individual contributors).
  Current practice (demanding the corresponding author coordinate a response *from the authors*) leans towards the former, suggesting Bratman's shared intention is the best fit for the *presupposed* theory, even if imperfectly realized. The fervent defense of accountability against AI and its violation only in extremis further confirms its constitutive role.

  **Recommendation & Conclusion**
  The four-condition regime implicitly relies on a Bratmanian model of shared intention. The distributed guarantee proposal abandons this for fragmented individualism plus mutual reliance contracts. While pragmatic for massive scale, it sacrifices the core intellectual goods of answerability for the integrated whole and genuine collective ownership of the work.

  **Instead of adopting distributed guarantees, I recommend:**
  1.  **Formalize the Implicit Bratmanian Model:** Strengthen requirements for documenting *how* mutual identification/confidence is achieved (e.g., mandatory contributor statements detailing specific contributions *and* attestations of confidence in co-authors *for integrated aspects*).
  2.  **Differentiate Authorship Tiers:** For mega-collaborations, *require* formal group agency structures (constitutions, decision procedures) if they wish to claim authorship *as a group*. Otherwise, list only a steering committee as authors (meeting Bratmanian conditions) and others as contributors. The dead remain authors *only* if they met the conditions *at the time of contribution/approval*; their *ongoing* accountability lapses.
  3.  **Maintain AI Exclusion as Principled:** Responsibility-capacity remains constitutive. Define "AI-assisted analysis/drafting" as a contributor role.
  4.  **Clarify the "Collaboration" Fiction:** If a group name is listed without robust agency, state explicitly: "The listed collaboration is not an accountable entity; guarantors for components are listed separately."

  The core value jeopardized by distributed guarantees isn't just administrative convenience; it's the integrity of the scholarly *act* as a potentially collective endeavor of reason-giving and responsibility-taking. Our authorship policies should strive to reflect and support that, even when scaling up requires more formal structures, rather than abandoning the core normative commitment to shared intellectual responsibility. *(Word Count: 1180)*
