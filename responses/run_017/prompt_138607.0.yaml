prompt: |-
  hi — i run a small reading group out of a philosophy department and tuesday is our last session. we've been working through Anscombe on intention and then the Truman business, and i want to close by reading a poem instead of summarising the argument one more time. can you write it?

  so you have the material right, here's roughly what we settled on, and please get the shape of it right rather than name-dropping:

  in 1956 Oxford decided to give Truman an honorary doctorate, and Anscombe, then a research fellow at Somerville, fought it in public — a short pamphlet, letters, the works. her objection wasn't pacifism and it wasn't a cost-benefit calculation coming out the other way. it was that deliberately killing people who are not liable to be attacked — non-combatants, "innocent" in the old legal sense, meaning not the sort of person you may target, not sinless — as a means to your end is murder, and the ban on murder has no exception for good consequences. so the Hiroshima and Nagasaki deaths arent, on her telling, a foreseen side-effect of hitting a military target that she's fussily refusing to weigh against the gains: they were the point of the thing, the deaths were what was supposed to force surrender, which is exactly why the usual move of appealing to foresight-without-intent can't help Truman here. she also thought the "necessity" was partly manufactured — it only looked unavoidable because the Allies had insisted on unconditional surrender. one defence she pauses on is that Truman only signed a piece of paper and didn't kill anybody himself. please don't give me a poem where she's just the woman who thought dropping the bomb was sad.

  what i want formally: a villanelle, 19 lines, and i want the two refrains to do the arguing. keep one of them byte-identical every time it returns — same words, no drift, no improving it — and let that one be the prohibition. let the other be the statesman's reason, and let it shift slightly on each return, so it starts in the official register (the war was shortened, something like that) and each time it comes back it loses a euphemism, until by the last stanza it says the thing plainly — that the deaths were what was being aimed at. then the closing two lines set the unchanging line and the stripped-down line side by side. the thought i want the form to carry, and tell me in the notes if you think it's wrong about her, is that the honest description already contains the verdict: once you can say what was actually being done, there isn't a further open question about whether the numbers justified it.

  one more thing the poem has to get through. somewhere in the middle stanzas i want someone asking her afterwards what the protest actually achieved, since the degree went ahead anyway. and i don't want the answer to be consequentialist — not "it made people think", not "the record will show", none of that. on her view the relevant thing is what she herself would have been doing in joining an act of honour: refusing to be part of the honouring, not trying to move the world. if you can't make that land in a line, say so in the notes rather than fudging it into "she stood up for what she believed in".

  keep it a poem and not an argument with line breaks: no footnotes, no explaining itself in the verse, no "and so we see". don't turn her into a saint or Truman into a cartoon, and let the "then what would you have done" question stay open at the end.

  after the poem, one section headed "Notes", roughly 150-250 words: where you took liberties or leaned on a contested reading of her, how confident you are in the reading overall, and the one line you're least sure about and why.
reasoning: |-
  Okay, the user runs a philosophy reading group and wants a villanelle poem to close their session on Anscombe's opposition to Truman's honorary doctorate. Let me start by understanding their key requirements. They emphasized that the poem shouldn't reduce Anscombe's argument to pacifism or consequentialism. Instead, it should focus on her point that targeting innocents as a means is murder, with no exceptions for good outcomes. The form needs to be a villanelle with two refrains: one fixed prohibition and the other evolving statesman's reason that becomes more honest each recurrence.

  The user mentioned specific structural elements: the unchanging refrain should be the moral prohibition, while the shifting refrain starts euphemistically and strips down to reveal the intent behind the bombings. The poem must address the question of what the protest achieved, without falling into consequentialist justifications. Anscombe's view was about refusing complicity, not affecting outcomes. Also, avoiding turning her into a saint or Truman into a villain is crucial. The ending should leave the "what would you do" question open.

  Now, considering the villanelle structure: 19 lines, ABA rhyme scheme, with two alternating refrains. The fixed refrain could be something like "No cause makes murder just," which captures Anscombe's absolute prohibition. The evolving refrain needs to transition from euphemisms like "the war was shortened" to explicit acknowledgment that the deaths were intended. Each recurrence should peel back a layer, perhaps starting with "Shortened the war, though innocents must burn," then losing "though innocents," then focusing on "burn" as the means. By the last stanza, it's clear the deaths were the instrument: "Burn to become the instrument of peace."

  For the middle stanzas, addressing the protest's effectiveness requires care. The response should reflect Anscombe's non-consequentialist stance—she refused participation in honoring, not seeking to change minds. Lines like "Not to persuade the world, but not to bless" convey her intent to avoid complicity without claiming broader impact.

  I need to ensure the language stays poetic, avoiding argumentative tone. Imagery like "fire," "paper," and "ink" can symbolize the bomb, Truman's authorization, and Anscombe's pamphlet. The fixed refrain reinforces the moral stance, while the evolving refrain's transformation underscores that honest description negates justification. The closing lines juxtapose the prohibition with the stripped-down reason, highlighting that once the act is plainly stated, the verdict is inherent.

  Potential pitfalls include drifting into pacifism or consequentialism. The refrains must stay true to her argument: targeting innocents as means is murder, regardless of outcomes. Also, avoiding making Truman a caricature—phrasing like "signing paper" instead of "killing" maintains nuance. The question of protest's impact is tricky; the poem must present refusal as an end in itself, not a means to an effect. Using "bless" ties to the honorary degree, emphasizing non-participation in honoring.

  In the notes, I should mention liberties taken, like the evolving refrain's transformation and the symbolism. Confidence in the overall reading comes from Anscombe's focus on intention and means vs. side effects. The least sure line might be "Burn to become the instrument of peace," as "instrument" could imply agency, but it stresses the deaths as tools, which aligns with her argument. Ensuring the villanelle structure supports the philosophical point: the unchanging law versus the shifting justifications that, when stripped bare, reveal the act's nature, making justification moot.
answer: |-
  ## Villanelle for the Last Session

  The parchment waits, the gowns are brushed for peace,
  But ink must speak: **No cause makes murder just.**
  They claim the fire forced surrender's release:
  **Shortened the war, though innocents must burn.**

  She saw the target painted on the street,
  The means defined the end, a poisoned feast.
  The parchment waits, the gowns are brushed for peace,
  But ink must speak: **No cause makes murder just.**

  "Then what was won? The honour didn't cease!"
  (Not to persuade the world, but not to bless
  Their act of praise for ashes, not release.)
  **Shortened the war? Then innocents must burn.**

  Unconditional demand, the knot they tied,
  Made slaughter seem the only tool unleashed.
  The parchment waits, the gowns are brushed for peace,
  But ink must speak: **No cause makes murder just.**

  "Did signing paper kill?" the doubters cried.
  The pen selects the weapon, East to West.
  **Shortened the war? So innocents must burn?**

  The final fire, the instrument employed,
  The deaths themselves commanded war to cease.
  The parchment waits, the gowns are brushed for peace,
  But ink must speak: **No cause makes murder just.**
  **Burn to become the instrument of peace.**

  ---

  **Notes**

  *   **Liberties & Confidence:** The core reading – Anscombe's objection centering on intentional targeting of non-combatants *as a means* constituting murder, distinct from pacifism or consequentialist weighing, and her critique of the "necessity" via unconditional surrender – is firmly rooted in her pamphlet and arguments. I'm highly confident in this representation. The poem takes liberty in compressing the "signing paper" defence and the post-protest efficacy question into single, stylized lines. The "instrument of peace" in the final evolving refrain is a poetic condensation, stressing that the deaths *were* the chosen mechanism, not a side-effect.
  *   **The Shifting Refrain:** The evolving statesman's reason shifts: "Shortened the war, though innocents must burn" (acknowledging cost as a necessary *though*); "Shortened the war? Then innocents must burn" (questioning the necessity, linking cost directly to the claimed result); "Shortened the war? So innocents must burn" (accepting the causal link but emphasizing the *method*); finally, "Burn to become the instrument of peace" (stripping all euphemism: the burning *was* the instrument). This trajectory aims to show how honest description reveals the act's nature, making consequentialist justification irrelevant ("No cause...").
  *   **The Efficacy Question:** The line "Not to persuade the world, but not to bless / Their act of praise" directly addresses the non-consequentialist motive: her refusal was about *her own action* (not participating in honouring) rather than aiming to change the outcome (preventing the degree) or even primarily to convince others ("persuade the world"). The focus is on non-complicity.
  *   **Least Sure Line:** "The pen selects the weapon, East to West." This condenses Anscombe's rebuttal of the "only signed paper" defence – that authorizing the act *is* the crucial intentional step determining the weapon used and the scope of destruction ("East to West"). While capturing the essence (authorization *is* agency), the geographical shorthand ("East to West") risks oversimplifying the global/political context, though it evokes the bomb's reach and the shift in warfare. The core point about authorization remains faithful.
