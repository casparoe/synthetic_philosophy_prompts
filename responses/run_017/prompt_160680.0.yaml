    So the critical point is at f=0.18, and it is a maximum. But g(0.18)=0.6*ln(1.08)+0.4*ln(0.72)≈ as above -0.0852. So at W=1, the maximum growth is negative. Therefore, the trap is active: no matter what you do, you expect to lose money. The best is to bet f=0.18, but it still loses in expectation (in log terms). 

    Now, if we start with W=2, then c/W=0.05. The critical c/W is 0.0199, so 0.05>0.0199? Then we should still be in the trap? Let me check: critical c/W=1-exp(-g0)=1-exp(-0.02013)≈0.0199. But 0.05>0.0199, so the growth should be negative? Let's compute the myopic fraction: f_myopic=0.2*(1-0.1/2)=0.2*(0.95)=0.19.

