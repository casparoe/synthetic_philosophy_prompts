prompt: |-
  I write about science and ideas for a national magazine, and I'm working on a piece about how arguments from the philosophy of religion keep resurfacing in AI policy. The move I keep encountering in interviews is Pascal's wager: almost everyone arguing for heavy regulation or a pause on frontier-model training eventually says some version of "look, it's just Pascal's wager — the probability may be small, but the stakes are astronomical, so we should act as if the risk is real." A policy memo I was shown (from a think tank I can't name) makes the reasoning explicit in something it calls the Precautionary Wager Test: fund any intervention that reduces the probability of an extinction-or-worse outcome by at least one basis point, provided its cost stays below 0.1 percent of annual GDP, and — this is the clause that made me sit up — explicitly waive any requirement that the probability estimate be well grounded, on the grounds that demanding evidence is itself a way of betting against. I'd like to audit that analogy properly before I let the phrase go to print, because I suspect it is doing considerably more work than it can carry.

  So: take the wager as it actually appears in Pascal's Pensées — a single interlocutor, told that he must wager whether he likes it or not, offered an infinite gain against a finite stake, and advised that if he cannot bring himself to believe he should go through the motions until belief follows — and set it beside the memo's test. Give me the correspondence explicitly, a table is fine: what plays the role of God's existence, of the infinite payoff, of the "you must wager" step, of the trivial cost, of the remedy of going through the motions? Then tell me where the mapping breaks, and be discriminating about which breaks matter for this use and which don't. I can see that Pascal's bettor wagers his own soul while the memo's bettor spends other people's money, and that Pascal's option set is binary while the policy menu is not; I'm much less sure how much turns on the shift from a literally infinite payoff to a merely astronomical finite one — eight billion lives plus however many generations follow. My sense is that this is the load-bearing switch: with an infinite payoff any nonzero probability dominates and the quality of the estimate drops out entirely, whereas once the payoff is finite the expected value is hostage to the probability, and a waived evidence requirement isn't a bold feature of the argument but the exact place it comes apart. Is that right? And what should I make of the menu of competing wagers? The many-gods objection seems to reappear here as a many-risks problem — alignment, engineered pandemics, nuclear war, asteroids — each of which can be run through the same test, and some of which appear to conflict with each other, as when one reading of the test licenses a training pause and another licenses racing to build the safer system first.

  Two further things I'd want before writing. First, name the claims the analogy is quietly importing that aren't in Pascal at all: I have candidates — that the option set is binary, that the costs of wagering are negligible, that the decision-maker is the party who bears them, and that the situation is genuinely one of unmeasurable uncertainty rather than measurable risk — but I'd like you to check my list and add what I've missed, and to say which of them are merely rhetorical and which are doing real argumentative work. Second, if Pascal's wager is the wrong analogy, give me a better one. One philosopher I interviewed said this is closer to what gets called "Pascal's Mugging" than to Pascal's wager — that it is a puzzle about the credibility of enormous, uncheckable claims rather than a dominance argument — and another said the honest framing is value of information: we are not forced to bet blind, we can pay to measure the probability, and what we should be buying is measurement rather than maximal precaution. I'd like your verdict on both, and a clear statement of whether any defensible version of the memo's conclusion survives once the disanalogies are on the table. Please answer in American English.
reasoning: |-
  Okay, let me approach this query methodically. The user is a science writer analyzing how Pascal's Wager gets repurposed in AI policy debates, specifically critiquing a think tank's "Precautionary Wager Test." They need three things: (1) a strict analogy audit between Pascal's original and the policy test, (2) identification of smuggled premises, and (3) alternative conceptual frameworks.

  First, the analogies. Pascal's Wager has five core components: God's existence (unknowable binary state), infinite payoff (salvation), forced choice ("you must wager"), trivial cost (finite life stakes), and belief engineering ("go through motions"). Mapping these to the policy memo: existential risk substitutes for God, astronomical loss (extinction) for infinite gain, regulatory coercion for forced choice, GDP percentage for trivial cost, and waived evidence for belief engineering. 

  The critical breaks: Finite vs infinite stakes change everything. Pascal's infinity makes probability irrelevant (any non-zero chance dominates), while the memo's astronomical-but-finite payoff makes probability estimates essential - and waiving evidence requirements becomes fatal when expected value calculations depend on credible risk assessments. This is the structural weakness.

  Second, smuggled premises. Beyond what the user noted (binary options, negligible costs etc.), I'd add: the assumption of risk independence (ignoring that mitigating one existential risk may exacerbate another), and the conflation of true uncertainty (Knightian) with measurable risk. The latter does heavy lifting by justifying evidence waivers.

  Third, alternatives. Pascal's Mugging fits better - it's precisely about dubious probability claims of cosmic stakes. But the Value of Information framework is more constructive: we should fund research to reduce uncertainty before deploying costly interventions. The memo's conclusion only survives if we accept its premises uncritically; once scrutinized, it demands either radical revision or abandonment.

  The user's hunch about finite stakes being pivotal is correct. I'll emphasize how this transforms "bold precaution" into "unchecked speculation."
answer: |-
  Below is a structured audit of the analogy between Pascal's Wager and the "Precautionary Wager Test" in AI policy, followed by key disanalogies, smuggled premises, and alternative frameworks. I'll address your core questions directly.

  ---

  ### **1. Correspondence Table: Pascal’s Wager vs. Precautionary Wager Test**
  | **Pascal’s Wager (Original)**              | **Precautionary Wager Test (AI Policy)**       | **Correspondence**                                                                 |
  |-------------------------------------------|-----------------------------------------------|------------------------------------------------------------------------------------|
  | **God’s existence**                       | **Existential risk from AI**                  | Unknowable binary state (existence/non-existence of threat).                       |
  | **Infinite payoff (eternal salvation)**   | **Astronomical finite payoff (avoiding human extinction)** | "Astronomical" substitutes for "infinite" (e.g., 8B+ lives + future potential).   |
  | **"You must wager"**                      | **Regulatory coercion ("must intervene")**    | Imposed obligation to act despite uncertainty.                                     |
  | **Finite stake (earthly pleasures)**      | **Cost < 0.1% annual GDP**                    | Trivial cost relative to the stakes.                                               |
  | **"Go through the motions" (faking belief)** | **Waiving evidence requirements**             | Action decoupled from epistemic justification ("belief" in risk probabilities).    |

  ---

  ### **2. Where the Mapping Breaks (and Why It Matters)**
  **Critical Breaks:**
  - **Finite vs. Infinite Payoff**:  
    - **Pascal**: Any non-zero probability of an *infinite* payoff dominates expected value (EV). Probability quality is irrelevant.  
    - **Policy Test**: With *finite* stakes, EV depends entirely on probability estimates: **EV = (Probability × Payoff) – Cost**.  
    - **Why it matters**: Waiving evidence requirements here isn’t "bold"—it collapses the argument. If probabilities are arbitrary (e.g., 0.01% vs. 0.0000001%), EV calculations become meaningless. A poorly grounded basis-point reduction could justify infinite spending.

  - **Decision-Maker’s Stake**:  
    - **Pascal**: Bettor risks *their own* soul.  
    - **Policy Test**: Regulators spend *others’ resources* (public funds, industry opportunity costs).  
    - **Why it matters**: Creates moral hazard. Costs (e.g., stifling beneficial AI) are externalized, while regulators gain status from "precaution."

  - **Binary vs. Open-Ended Options**:  
    - **Pascal**: Bet on God or not (mutually exclusive).  
    - **Policy Test**: Multiple risks (AI, pandemics, nukes) with *interdependent interventions*.  
    - **Why it matters**: Resources spent on one "wager" (e.g., pausing AI) may *increase* other risks (e.g., slower pandemic drug discovery). This mirrors the "Many-Gods Objection": competing claims drain resources.

  **Less Critical Breaks:**
  - **Remedy ("Going through motions")**: Pascal’s faked belief has no social cost; waived evidence in policy risks real waste.
  - **Probability Source**: Pascal’s probability is subjective faith; policy probabilities pretend to be technical (but waived).

  ---

  ### **3. Smuggled Premises (and Their Argumentative Weight)**
  The analogy quietly imports these claims not in Pascal:
  | **Smuggled Premise**                          | **Argumentative Role**                           | **Rhetorical or Load-Bearing?** |
  |----------------------------------------------|--------------------------------------------------|----------------------------------|
  | **Risk is binary** (existential catastrophe or not) | Ignores gradations of harm (e.g., partial vs. total extinction). | **Load-bearing**: Enables "astronomical stakes" framing. |
  | **Costs are negligible**                     | Assumes 0.1% GDP is trivial *and* has no trade-offs. | **Load-bearing**: Justifies ignoring opportunity costs. |
  | **Uncertainty is unmeasurable**              | Claims we *can’t* estimate probabilities (Knightian uncertainty). | **Load-bearing**: Directly enables evidence waiver. |
  | **No competing risks**                       | Treats AI risk in isolation.                     | **Load-bearing**: Hides resource conflicts (e.g., AI safety vs. climate). |
  | **Decision-maker bears costs**               | Obscures that costs fall on society/industry.    | **Rhetorical**: Masks accountability. |

  ---

  ### **4. Better Analogies & Verdict**
  **A. Pascal’s Mugging (N. Bostrom):**  
  - **Why it fits**: When a stranger threatens "give me $5 or I’ll destroy 3↑↑↑3 lives," you dismiss it—not because stakes aren’t huge, but because the *credibility* of the threat is vanishingly low.  
  - **Application to AI**: Demanding action based on speculative, evidence-free probabilities (e.g., "1 basis point reduction") is mugging logic. It exploits linear EV math to justify anything.  
  - **Verdict**: **Stronger fit** than Pascal’s Wager. Highlights the core problem: ungrounded probability claims.

  **B. Value of Information (VoI):**  
  - **Framework**: We’re *not* forced to "bet blind." We can invest in measuring probabilities (e.g., AI testing, forecasting) *before* costly interventions.  
  - **Example**: Spending $1B on AI auditing might reveal true risk is 10⁻⁶ (not 10⁻⁴), avoiding trillion-dollar overregulation.  
  - **Verdict**: **Most defensible approach**. Turns "waive evidence" into its opposite: *buy evidence first*.

  ---

  ### **5. Does the Memo’s Conclusion Survive?**
  - **Only under extreme premises**: If you accept (1) stakes are *infinite* (e.g., humanity’s value = ∞), or (2) probabilities are truly incalculable *and* precaution is costless.  
  - **Reality check**:  
    - Finite stakes + waived evidence → arbitrary policy.  
    - Conflicting risks → zero-sum resource competition.  
    - **Surviving core**: A *weak* precautionary principle: "Don’t ignore low-probability, high-impact risks." But the test’s specific mechanism (basis points + no evidence) does not hold.  

  ---

  ### **Recommendations for Your Piece**
  1. **Lead with Pascal’s Mugging**: It captures the coercion-by-hyperbolic-stakes dynamic better.  
  2. **Highlight VoI**: Argue that "paying to measure" is smarter precaution than "paying to act blindly."  
  3. **Emphasize the finite-stakes flaw**: This is the load-bearing crack. Show how EV math implodes without probabilities.  
  4. **Note the democratic deficit**: Spending public money without evidence violates accountability—unlike Pascal’s personal wager.  

  This analogy isn’t just imperfect—it smuggles in a dangerous epistemic bypass. The better path is VoI: replacing "betting against" with *buying knowledge*.
