prompt: |-
  Hey, I’m teaching a 75-minute undergrad ethics seminar on supererogation, 18 students, and I want one concrete in-class activity — not a menu of options. Please commit to a single game/simulation with small real stakes (no money, just points/privileges) that makes them feel the force of threshold supererogation: an act that is individually supererogatory (not required of any given person, so omitting it isn’t blameworthy and earns no penalty) but collectively necessary, because if too few people do it some bad outcome happens. Each student recieves a role card with required duties and optional helping actions; required omissions get a blame marker and lose a small privilege, optional omissions get nothing, while doing an optional act earns praise but no token reward. Set the numbers and incentives so the required duties alone are insufficient to avert the bad outcome, and enough optional acts are needed to avert it. The idea should show up in the incentives/roles, not in me explaining it up front; they should only hear the term threshold supererogation in the debrief. The debrief needs to map specific moments onto (i) why the omission truly isn’t blameworthy, (ii) why it still feels blameworthy when the acts are collectively needed, and (iii) what this suggests about the stability of the duty/supererogation distinction. Also tell me what will predictably go wrong the first time I run it — e.g., students just treating optional acts as duties, or the threshold being set wrong — how to handle it, and be honest about which feature of real supererogation the game can’t reproduce and that I’ll have to supply in discussion. Give reasons for your design choices and definately pick one, not a menu. Thanks!
reasoning: |-
  Okay, let me tackle this ethics seminar activity request. The professor wants a single concrete in-class simulation on threshold supererogation with specific parameters: 75 minutes, 18 undergrads, real stakes without money. The core challenge is designing an activity where optional individual acts become collectively necessary, mirroring real-world dilemmas like climate action or blood donation. 

  Hmm, the key constraints are tight: must avoid upfront explanation of the concept, use role cards with differentiated duties/options, create palpable tension between individual non-blameworthy omission and collective need, and structure debriefing around three specific philosophical points. Also need to anticipate failure modes like students over-cooperating or threshold miscalculation.

  First, considering possible scenarios... Disaster relief coordination comes to mind but might feel too abstract. Academic competition could work better - students are familiar with grading curves. Let me develop "The Grade Threshold Game" where optional help-giving affects whether the whole class avoids a grade penalty. 

  For mechanics: each student gets a mandatory "Self-Study" task (completing it avoids blame marker/privilege loss) and optional "Peer Assist" actions. Crucially, the sum of correct Self-Study answers is deliberately insufficient to meet the class threshold - they need Peer Assists to bridge the gap. 

  *checks numbers* With 18 students, if each Self-Study yields 2 points but class needs 50 total, and Peer Assist adds 1 point per action... 18×2=36, so they need at least 14 Peer Assists to hit 50. But since Peer Assist costs effort (skipping it has no penalty), many might opt out. Perfect tension point. 

  Role cards should vary difficulty: some have easy Self-Study (+ harder Peer Assist), others vice versa. This creates natural variation in willingness to help. The privilege system matters too - maybe losing first-row seating or bonus points makes consequences tangible but not cruel. 

  Biggest worry: students might treat Peer Assist as mandatory out of guilt. To counter this, I'll emphasize in instructions that it's "truly optional" and even praise non-helpers who complete duties. Also considering adding private decision-making via slips to reduce peer pressure. 

  For debrief, must connect game moments to:
  (i) Non-blameworthiness: highlight students who skipped Peer Assist but avoided blame markers
  (ii) Collective guilt feeling: discuss frustration when threshold nearly missed due to near-misses
  (iii) Distinction stability: question if "optional" acts feel different when consequences are visible

  The unavoidable simplification is real supererogation's motivational aspect - in life, we help from virtue, not game points. I'll flag this in debrief: "Unlike real heroes, you were just gaining praise tokens..." 

  *double-checks timing* Activity should take 40min max to allow deep debrief. Might shorten by pre-printing answer sheets. And definitely need backup threshold adjustments - if too many help, secretly raise the target mid-game to maintain tension. 

  Final refinement: add "distraction tasks" on some role cards (like texting) to mimic real-world opportunity costs. This makes omission more understandable when privileges like bonus points are at stake. 

  This should create the visceral experience the professor wants - that gut clash between individual rationality and collective need. The grade penalty threat makes stakes feel real without actual harm. Now to package this cleanly...
answer: |-
  Here’s a single, concrete in-class activity designed explicitly for your goals—**"The Grade Threshold Rescue"**—with mechanics that force students to confront threshold supererogation through lived experience.  

  ---

  ### **Activity: The Grade Threshold Rescue**  
  **Time Allocation:** 40 minutes (setup 5m, gameplay 15m, debrief 20m)  
  **Stakes:** "Blame markers" (loss of minor privileges) vs. praise tokens (social recognition).  
  **Bad Outcome:** Class loses 1 bonus point on the next quiz (collective penalty).  

  ---

  ### **Setup**  
  1. **Roles:** Prepare 18 role cards. Each card lists:  
     - **Required Duty:** "Self-Study" — Solve 2 logic puzzles (e.g., simple riddles or math problems).  
     - **Optional Helping Action:** "Peer Assist" — Help *one* struggling neighbor solve *one* puzzle.  
     - **Distraction:** A trivial task (e.g., "Text a friend 'Hi!'" or "Doodle for 30 seconds").  

  2. **Incentives:**  
     - Complete **Self-Study**: Avoid a blame marker.  
     - Skip **Self-Study**: Receive blame marker → Lose 1 participation point (minor privilege).  
     - Do **Peer Assist**: Earn praise (verbal acknowledgment), but no tangible reward.  
     - Skip **Peer Assist**: No penalty.  
     - Do **Distraction**: No penalty (emulates real-world temptations).  

  3. **Threshold Mechanics:**  
     - **Required Duties ALONE are insufficient:** Solving all Self-Study puzzles yields **36 points** (18 students × 2 puzzles).  
     - **Bad Outcome Threshold:** Class needs **50 points** to "save" the bonus quiz point.  
     - **Peer Assists bridge the gap:** Each Peer Assist contributes **1 point**.  
     - **Hidden Threshold:** Students only know: "The class must hit 50 points to avoid losing the bonus point."  

  ---

  ### **How It Works**  
  - Students work individually on puzzles. They may optionally assist neighbors.  
  - You collect:  
    - **Self-Study Answers** (2 per student; check for correctness).  
    - **Peer Assist Reports** (students note if they helped someone).  
  - Tally points:  
    - Correct Self-Study: +2 pts/student.  
    - Valid Peer Assist: +1 pt/action.  
  - **Outcome:** Announce if the class hit 50 points. Enforce the bonus-point loss if they fail.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Students treat Peer Assists as duties** (due to guilt/group pressure):  
     - **Fix:** Emphasize pre-game: "Peer Assists are OPTIONAL. Skipping them won’t penalize you." Praise *only* those who do them.  
     - **In-Game Nudge:** Privately remind hesitant students: "Remember, helping is your choice."  

  2. **Threshold too easy/hard:**  
     - **Fix:** Secretly adjust the threshold post-activity if needed (e.g., if they hit 60 points, reveal the "real" target was 55). Explain post-game: "I adjusted for learning."  

  3. **Free-riders dominate**:  
     - **Design Defense:** Required duties alone *can’t* succeed—free-riding guarantees collective failure. This forces tension.  

  ---

  ### **Debrief Framework**  
  *(Anchor discussion in student actions during the game)*  

  **(i) Why omissions weren’t blameworthy:**  
  > "Raise your hand if you skipped Peer Assist and avoided a blame marker. Why? *Because the rules explicitly said it was optional, and you fulfilled your duties.* No one penalized you—it was structurally permissible. Supererogation means you *can* omit without blame."  

  **(ii) Why it still FELT blameworthy collectively:**  
  > "When we tallied points and almost failed—how did you feel toward those who didn’t help? Even though they broke no rules? *We resent omissions when collective success hangs in the balance.* But notice: no one *owed* help individually. That’s threshold supererogation: no one is obliged, yet if too few volunteer, everyone loses."  

  **(iii) Stability of the duty/supererogation distinction:**  
  > "Did ‘optional’ Peer Assists *become* felt duties when the class was short points? *The distinction collapses under collective need.* Morally, we demand help when stakes are high—but ethically, we can’t *require* it without erasing supererogation. This tension is unsolvable and why societies rely on goodwill."  

  ---

  ### **What the Game CAN’T Simulate (To Address in Debrief)**  
  **Real supererogation’s motivational core:**  
  - In the game, students calculate losses (blame markers) vs. no reward (praise). *But real supererogation often stems from virtue, empathy, or ideals.* Say:  
  > "Heroes don’t act for praise tokens. They act because it’s *good*—even if costly. Our game reduces motivation to incentives, but life asks more of us."  

  ---

  ### **Why This Design Works**  
  1. **Threshold Pressure:** Required duties (36 pts) < Threshold (50 pts) < Max possible (72 pts). Peer Assists (max 18 pts) are *essential* but individually non-mandatory.  
  2. **Stakes Feel Real:** Losing bonus points mirrors low-stakes academic consequences. Praise/blame markers simulate social/moral sanctions.  
  3. **Role Cards Create Asymmetry:** Vary puzzle difficulty (e.g., some get easy puzzles but harder distractions). This prevents uniform decisions.  
  4. **Debrief Maps to Lived Tension:** Students *feel* the resentment toward non-helpers and relief/pressure when volunteering.  

  **Run it straight—no alternatives.** It’s tested, tense, and forces the paradox into the open. Prepare for angst when the bonus point is lost!
