  ### Decision Problem: Pandemic Preparedness vs. Climate Change Institution

  **Setup:**  
  A committee must allocate a fixed budget between two interventions:  
  - **Option A (Pandemic Stockpiles):** Near-term intervention. Builds stockpiles of vaccines and antivirals for emerging pandemics. Effective within 10 years, and benefits are realized regardless of humanity's future.  
  - **Option B (Climate Stability Institution):** Long-run intervention. Establishes an international institution to preserve climate stability over centuries. Only benefits future generations if civilization survives long enough to avoid collapse.  

  **Hypotheses about Total Humans:**  
  - **Short Branch (S):** Humanity collapses by 2100. Total humans ever born: \(N = 100\) billion.  
  - **Long Branch (L):** Civilization thrives for millennia. Total humans ever born: \(M = 100\) trillion (\(k = 1000\) times \(N\)).  

  **Assumptions:**  
  - **Reference Class:** All humans who ever live, past and future. Includes the committee (current generation). Birth order is random within this class.  
  - **Self-Sampling Assumption (SSA):** The likelihood of observing one's birth rank \(n\) (e.g., \(n \approx 100\) billion for a person alive today) scales inversely with total population:  
    - \(P(n \mid S) = 1/N\) (since \(n \leq N\))  
    - \(P(n \mid L) = 1/M\) (since \(n \leq M\))  
  - **Prior:** \(P(S) = P(L) = 0.5\) (before SSA update).  
  - **Payoffs:**  
    - **Option A:** Saves \(V_A = 1\) million lives in the near term. Fixed across branches (pandemics threaten regardless of long-term future).  
    - **Option B:** Prevents collapse in \(L\), saving \(c = 0.01\) lives per future person (via avoided famine/conflict). Worthless in \(S\) (collapse happens anyway).  
      - Payoff in \(S\): \(0\)  
      - Payoff in \(L\): \(c \times M = 0.01 \times 100 \times 10^{12} = 10^{12}\) lives saved.  

  ### Self-Sampling Update (Doomsday Argument)  
  **Likelihoods:**  
  - \(P(n \mid S) = 1/N = 10^{-11}\)  
  - \(P(n \mid L) = 1/M = 10^{-14}\)  

  **Posterior Odds:**  
  \[
  \frac{P(S \mid n)}{P(L \mid n)} = \frac{P(S) \cdot P(n \mid S)}{P(L) \cdot P(n \mid L)} = \frac{0.5 \cdot 10^{-11}}{0.5 \cdot 10^{-14}} = 1000
  \]  
  Thus:  
  - \(P(S \mid n) = \frac{1000}{1001} \approx 0.999\)  
  - \(P(L \mid n) = \frac{1}{1001} \approx 0.001\)  

  **Update Summary:**  
  - Prior: \(P(S) = 0.5\), \(P(L) = 0.5\)  
  - Posterior: \(P(S) \approx 99.9\%\), \(P(L) \approx 0.1\%\)  
  *The doomsday shift occurs: observing our early birth rank strongly favors \(S\).*

  ---

  ### Expected Value (EV) Calculations  
  **Payoff Table:**  
  | Branch | Option A (Pandemic) | Option B (Climate) |  
  |--------|----------------------|---------------------|  
  | **S**  | \(V_A = 10^6\)      | \(0\)              |  
  | **L**  | \(V_A = 10^6\)      | \(c \cdot M = 10^{12}\) |  

  **1. Unshifted Prior (No SSA Update):**  
  - EV of A:  
    \[
    \text{EV}_\text{prior}(A) = P(S) \cdot V_A + P(L) \cdot V_A = 0.5 \cdot 10^6 + 0.5 \cdot 10^6 = 10^6
    \]  
  - EV of B:  
    \[
    \text{EV}_\text{prior}(B) = P(S) \cdot 0 + P(L) \cdot (c \cdot M) = 0.5 \cdot 10^{12} = 5 \times 10^{11}
    \]  
  - **Comparison:** \(\text{EV}_\text{prior}(B) = 5 \times 10^{11} > \text{EV}_\text{prior}(A) = 10^6\).  
    **Recommendation:** Fund B (Climate Institution).  

  **2. Shifted Posterior (With SSA Update):**  
  - EV of A:  
    \[
    \text{EV}_\text{post}(A) = P(S \mid n) \cdot V_A + P(L \mid n) \cdot V_A \approx 0.999 \cdot 10^6 + 0.001 \cdot 10^6 = 10^6
    \]  
  - EV of B:  
    \[
    \text{EV}_\text{post}(B) = P(S \mid n) \cdot 0 + P(L \mid n) \cdot (c \cdot M) \approx 0.001 \cdot 10^{12} = 10^9
    \]  
  - **Comparison:** \(\text{EV}_\text{post}(B) = 10^9 > \text{EV}_\text{post}(A) = 10^6\).  
    **Recommendation:** Fund B (Climate Institution).  

  **Branch Contributions:**  
  - **Unshifted Prior:** \(L\) dominates EV for B (\(5 \times 10^{11}\) vs. A’s \(10^6\)).  
  - **Shifted Posterior:** \(L\) still dominates EV for B (\(10^9\) vs. A’s \(10^6\)), but with reduced weight.  

  ---

  ### Condition for Consistent Recommendation  
  The recommendation **does not change** (fund B) if:  
  \[
  \underbrace{c \cdot N}_{\text{Per-person value} \times \text{short population}} > V_A
  \]  
  **Derivation:**  
  - Posterior EV of B: \(P(L \mid n) \cdot (c \cdot M) \approx \frac{1}{k} \cdot (c \cdot k N) = c \cdot N\) (since \(M = kN\), \(P(L \mid n) \approx 1/k\)).  
  - Posterior EV of A: \(V_A\).  
  - Thus, \(\text{EV}_\text{post}(B) > \text{EV}_\text{post}(A)\) iff \(c \cdot N > V_A\).  

  **In Our Numbers:**  
  - \(c \cdot N = 0.01 \times 10^{11} = 10^9\)  
  - \(V_A = 10^6\)  
  - \(10^9 > 10^6\) holds → B is favored.  

  ---

  ### Interval Where the Update Changes the Recommendation  
  The update changes the recommendation (B → A) if:  
  \[
  \underbrace{\frac{V_A}{k} \cdot 2}_{\text{Unshifted threshold}} < c \cdot N < \underbrace{V_A}_{\text{Shifted threshold}}
  \]  
  **Derivation:**  
  - Unshifted favors B iff: \(\text{EV}_\text{prior}(B) > \text{EV}_\text{prior}(A)\) → \(0.5 \cdot c \cdot M > V_A\) → \(c \cdot N > \frac{2 V_A}{k}\) (since \(M = kN\)).  
  - Shifted favors A iff: \(\text{EV}_\text{post}(B) < \text{EV}_\text{post}(A)\) → \(c \cdot N < V_A\).  
  - Thus, disagreement when: \(\frac{2 V_A}{k} < c \cdot N < V_A\).  

  **In Our Numbers (\(k = 1000\), \(V_A = 10^6\)):**  
  - Interval: \(\frac{2 \cdot 10^6}{1000} = 2 \times 10^3 < c \cdot N < 10^6\) → \(2000 < c \cdot N < 1,000,000\).  
  - Example: If \(c \cdot N = 500,000\):  
    - Unshifted: \(\text{EV}_\text{prior}(B) = 0.5 \cdot 0.005 \cdot 10^{15} = 2.5 \times 10^{12} > 10^6\) → fund B.  
    - Shifted: \(\text{EV}_\text{post}(B) \approx 0.001 \cdot 0.005 \cdot 10^{15} = 5 \times 10^9 > 10^6\)? Wait, \(c \cdot N = 0.005 \times 10^{11} = 5 \times 10^8\), and \(\text{EV}_\text{post}(B) \approx 5 \times 10^8\), which is \(< 10^6\)? Let me correct:  
      - \(c \cdot N = 500,000 = 5 \times 10^5\)  
      - \(\text{EV}_\text{post}(B) = c \cdot N = 5 \times 10^5\)  
      - \(5 \times 10^5 < 10^6\) → fund A.  
    - **Decision changes from B (prior) to A (posterior).**  

  ---

  ### What’s Doing the Work?  
  **Your Hunch is Correct:** The anthropic update cancels *only if payoffs scale linearly with population*. Here, the truncation of B’s payoff in \(S\) breaks the cancellation:  
  - **Truncated Case (B = 0 in S):**  
    - \(\text{EV}_\text{post}(B) \propto c \cdot N\) (depends on \(N\), not \(M\)).  
    - Condition \(c \cdot N > V_A\) determines the decision.  
  - **No Truncation (B proportional in both branches):**  
    Suppose B saves \(c\) lives per person in \(S\) and \(L\):  
    - Payoff in \(S\): \(c \cdot N\)  
    - Payoff in \(L\): \(c \cdot M\)  
    - \(\text{EV}_\text{post}(B) = P(S \mid n) \cdot c N + P(L \mid n) \cdot c M \approx c N \cdot \frac{2000}{1001}\) (using earlier math).  
    - \(\text{EV}_\text{prior}(B) = 0.5 \cdot c N + 0.5 \cdot c M = 0.5cN(1 + k)\).  
    - Cancellation is imperfect; disagreement interval still exists but shrinks. **Priya is wrong:** Payoff shape, not anthropics, drives the practical upshot.  

  **Defense of Doomsday Argument’s Practical Upshot:**  
  > "You’ve rigged nothing—this is the standard structure of long-term interventions. The doomsday argument matters precisely when:  
  > 1. The intervention’s payoff is contingent on a long future (truncated at zero in short branches).  
  > 2. The cost-effectiveness threshold is tight (e.g., \(c \cdot N\) near \(V_A\)).  
  > In such cases—common in global priorities—the update forces long-term bets to justify themselves *as if the future is short*. This isn’t a decision-theoretic trick; it’s a core implication of SSA. If your funder ignores it, they’ll overbet on fragile longshots."  

  **Does It Land?**  
  - **Yes:** The doomsday argument has bite when payoffs are nonlinear (truncation). In our case, it changes the recommendation for \(c \cdot N \in (2000, 10^6)\)—a wide, plausible interval (e.g., saving 500,000 lives in expectation post-update loses to A).  
  - **But:** It doesn’t *always* change decisions (e.g., when \(c \cdot N > V_A\), B still wins). Priya is half-right: the update *can* be neutral, but only if long-run payoffs clear the \(c \cdot N > V_A\) bar—which is often unmet.  

  **Final Word:**  
  The doomsday argument isn’t just intellectual fun. It demands that long-term interventions prove robustness to a short future—a real constraint for real funders.
