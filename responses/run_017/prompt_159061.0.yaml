  The grade should reflect these strengths and errors. Part (a) is mostly solid but incomplete. Part (b) starts well but ends with a major inaccuracy. Part (c) shows conceptual confusion. I'm leaning toward 9/15 - they grasp fundamentals but stumble on nuances and make one significant factual error.

