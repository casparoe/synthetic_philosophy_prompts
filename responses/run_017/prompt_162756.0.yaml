  Okay, let me approach this systematically. The user presents a fascinating puzzle about evolutionary debunking in metaethics, with a supervisor who has clear intuitions about six cases and needs a consistent rule to handle a seventh. 

  First, I need to unpack the supervisor's pattern: she debunks biologically-tracked norms (incest avoidance, kin bias, reciprocity) but preserves beliefs about gratuitous cruelty, promises, and the "couldn't have done otherwise" excuse. The key seems to be whether the belief's content aligns with its evolutionary function. 

  For the new case - intent mattering morally - the evolutionary story suggests we track intent to identify threats, not because intentions intrinsically matter. If I apply the "functional mismatch" rule (where debunking occurs when the cognitive trait's function differs from the moral belief's content), this should be debunked. The "deliberative indispensability" rule (preserving beliefs necessary for practical reasoning) might save it, but the kids' case suggests indispensability alone isn't sufficient since children's "couldn't have done otherwise" excuse is preserved despite not being indispensable. 

  Ah, that last point is crucial - the supervisor preserved the excuse belief even in children, though it's not evolutionarily indispensable. This sinks pure indispensability accounts. The "fixed point" rule (core moral intuitions immune to debunking) seems too vague here. 

  The desert/punishment case would test this beautifully: if she debunks proportional punishment despite its impartial content, it confirms functional mismatch matters more than impartiality. But if she preserves it, she's likely privileging deliberative role over genealogy. 

  ...I'm now realizing the supervisor's pattern reveals a deeper principle: she only debunks when evolution gave us the belief for strategic social navigation (partner selection, kin investment) rather than as a byproduct of general moral capacity. Gratuitous cruelty and intent-sensitivity feel like outputs of our core moral faculty, even if triggered by adaptive pressures. But that might be too fuzzy a distinction. 

  The user's challenge about the kids' case is spot-on - it forces us to reject crude indispensability. Whatever rule we pick must explain why the excuse belief is preserved in children without being evolutionarily indispensable. That points strongly toward the functional mismatch rule as the most coherent fit. 

  For a clean test, the desert case is perfect: if proportional punishment gets debunked despite its deliberative role, it confirms function-content misalignment is the key driver. If preserved, then deliberative indispensability is doing hidden work. But given the kids' case precedent, I'm betting on debunking.
answer: |-
  Here's a systematic breakdown of rules fitting your supervisor's pattern, their application to the intent-sensitivity case, and a decisive test case. Crucially, **Rule 2** is threatened by the "couldn't have done otherwise" verdict, but survives with refinement.

  ### Core Rules Fitting All Six Verdicts
  *(Debunked: Incest, Kin Obligations, Reciprocity | Preserved: Cruelty, Promising, Excuse)*

  1.  **Rule: Functional Mismatch Debunking**
      *   **Mechanism:** A belief is debunked *if its evolutionary function (selected purpose) misaligns with its moral content*. If selection shaped the cognitive trait for strategic social coordination (e.g., avoiding costs, securing benefits) *rather than* tracking mind-independent moral truth, and the *content* of the belief reflects this strategic function, it's debunked.
      *   **Fits Verdicts:**
          *   *Debunked:* Incest (avoid pathogens, not intrinsic wrongness), Kin (maximize inclusive fitness, not intrinsic specialness), Reciprocity (secure cooperation benefits, not intrinsic duty). Content (disgust/bias/resentment) aligns with strategic function.
          *   *Preserved:* Cruelty (function unclear/not strategic, content is intrinsic wrongness), Promising (function likely social coordination, but content *claims* intrinsic obligation - potential mismatch? Rule needs nuance), Excuse (function may be conflict reduction/cooperation stability, but content is about *control* - mismatch?).
      *   **Nuance for Preservation:** Beliefs are *preserved* if: (a) The evolutionary function is opaque or not *primarily* strategic social navigation, OR (b) The moral content *transcends* or *conflicts with* the plausible strategic function. Cruelty fits (a), Promising & Excuse arguably fit (b) - their content (obligation, control) isn't *about* maximizing fitness/advantage in the way the debunked ones are.
      *   **Prediction for Intent-Sensitivity:** **DEBUNKED.** The genealogy explicitly states the function: threat assessment (identify dangerous allies). The content ("intentions matter intrinsically") directly reflects this strategic, non-moral function (tracking danger vs. clumsiness). Clear alignment between content and strategic function.

  2.  **Rule: Deliberative Indispensability + Genealogical Opacity**
      *   **Mechanism:** A belief is debunked *only if* (1) It has a clear, strategic evolutionary function *and* (2) It plays no indispensable, non-replaceable role in *first-person practical deliberation/justification*. Beliefs are preserved if either (a) their genealogy is opaque/not clearly *only* strategic, or (b) they are indispensable for structuring coherent moral agency (e.g., reasoning about obligations, blame, justifications).
      *   **Fits Verdicts:**
          *   *Debunked:* Incest, Kin, Reciprocity. Clear strategic function AND arguably replaceable in deliberation (we could coordinate behavior without seeing these as *intrinsically* morally special/duty-bound).
          *   *Preserved:* Cruelty (opaque genealogy, indispensable for basic wrongness), Promising (indispensable for obligation-based cooperation), Excuse (indispensable for blame/attribution). Crucially, *even the child's version* of the excuse is preserved, showing that its indispensability for the *framework* of responsibility matters, not sophisticated adult deliberation.
      *   **Prediction for Intent-Sensitivity:** **PRESERVED.** While the genealogy reveals a strategic origin (threat assessment), the belief is *indispensable* for first-person practical deliberation about permissibility, blame, and justification. We fundamentally deliberate about actions based on intentions ("Can I intend *this*?"). Removing this distinction cripples moral reasoning. Genealogy explains *why we have the capacity*, but the capacity's *current role* in structuring agency shields it.
      *   **Threat from the Kids Case (Addressed):** The "couldn't have done otherwise" excuse is preserved in kids, even though it's likely present early and serves cooperation/stability. Rule 2 survives because it emphasizes the *role* in deliberation/agency, not its *origin* or *developmental timing*. The excuse is fundamental to *attributing* responsibility, a core part of agency, even in simple forms. Its indispensability outweighs its strategic origin/timing.

  3.  **Rule: Core Moral Faculty Output (Fixed-Point Lite)**
      *   **Mechanism:** A belief is debunked *if it is a specific, contingent output of evolved social heuristics shaped purely for fitness*. It is preserved *if it reflects the core, abstract, computational structure of moral cognition itself* (e.g., capacities for wrongness, obligation, justification, desert) - the "fixed points" generated by how the faculty operates, not specific inputs. Universality + early emergence are *evidence* for this core status.
      *   **Fits Verdicts:**
          *   *Debunked:* Incest, Kin, Reciprocity. Specific contingent rules linked to fitness problems (inbreeding, kinship, cooperation).
          *   *Preserved:* Cruelty (output of wrongness detection), Promising (output of obligation-ascription), Excuse (output of responsibility/control-ascription). These reflect the abstract *types* of judgment the faculty computes.
      *   **Prediction for Intent-Sensitivity:** **PRESERVED.** Distinguishing intended vs. foreseen harm is a fundamental structural feature of how the moral faculty parses agency and permissibility (a "doctrine of double effect" precursor). Its universality and early emergence strongly suggest it's an output of the core computational structure, not a culturally contingent heuristic. The genealogy explains *why we have a faculty that makes this distinction*, not that the distinction itself lacks a grounding in the faculty's intrinsic structure.

  ### Recommendation & Why
  Based on the pattern and the threat/response regarding the kids case, **Rule 2 (Deliberative Indispensability + Genealogical Opacity)** seems the strongest fit for your supervisor's intuitions:
  1.  **Explains Debunked Cases:** All have clear strategic functions *and* their *specific content* isn't indispensable for deliberation (we could have different coordination rules).
  2.  **Explains Preserved Cases:** Cruelty (opaque genealogy), Promising & Excuse (indispensable for obligation/attribution structure). The **key point** is preserving the *child's* excuse - Rule 2 uniquely captures this by focusing on the *type of role* in agency (fundamental to attribution), not its origin or sophistication. Rule 1 struggles here (function=conflict reduction, content=control? Mismatch? Weakest fit). Rule 3 fits but is vaguer.
  3.  **Prediction for Intent:** **PRESERVED.** Its role in first-person deliberation ("Can I *intend* that harm?") and justification ("I didn't *mean* to hurt them!") is indispensable for moral agency, outweighing its strategic origin. Genealogy explains the *trigger* for developing this capacity, not that the capacity lacks deliberative necessity now.

  ### The Perfect Test Case: Desert of Proportional Punishment
  *   **Content:** The belief that the guilty intrinsically *deserve* to suffer in proportion to their wrongdoing (retributivism).
  *   **Genealogy:** The standard costly punishment story - evolved to stabilize cooperation by deterring free-riders through credible threats of costly sanctions. Strong fitness-tracking.
  *   **Deliberative Role:** Can be significant ("Justice demands punishment!"), but many coherent moral systems (e.g., consequentialist, restorative) reject or minimize retributive desert as fundamental. It's arguably *replaceable* in deliberation without collapsing agency.
  *   **Rule Predictions:**
      *   **Rule 1 (Mismatch): DEBUNKED.** Clear function (deterrence/stability) aligns directly with content (deserving punishment).
      *   **Rule 2 (Indispensability): DEBUNKED.** Has a clear strategic function *and* is *not* indispensable for deliberation (agency can function on consequentialist, deterrent, or restorative grounds without intrinsic desert).
      *   **Rule 3 (Core Faculty): DEBUNKED?/PRESERVED?** Ambiguous. Is "desert" a core output like "wrongness" or "obligation"? Or is proportional retribution a specific, contingent heuristic? Universality suggests core, but replaceability in deliberation argues against it being fundamental. This might be a borderline case for Rule 3.
  *   **Why it Cleans Up:**
      *   It directly targets the gap between **Rule 1 & Rule 2**. Rule 1 *must* debunk it (clear function-content match). Rule 2 *must* debunk it (clear function + non-indispensable role - deliberation can work fine without intrinsic desert). If your supervisor **debunks** it, Rules 1 or 2 win. If she **preserves** it, Rule 3 wins (seeing desert as a core faculty output).
      *   It isolates "impartial content" (desert applies impartially) from "fitness-tracking genealogy" and tests its "load-bearing role" (replaceable in deliberation).

  **Conclusion:** Your supervisor likely uses **Rule 2** (Deliberative Indispensability shields beliefs with strategic genealogies). She predicts **PRESERVED** for intent-sensitivity due to its indispensable role in deliberation. The desert/punishment case is the ideal test to confirm this against Rule 1 or Rule 3. Rule 2's ability to cleanly preserve the *child's* excuse belief, despite its likely strategic function and early emergence, is its strongest evidence over Rule 1.
