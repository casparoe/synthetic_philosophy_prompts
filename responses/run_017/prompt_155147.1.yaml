  ### Sestina on Two Inversions

  The hawk’s keen **eye** tracks prey in shifting light,  
  a marvel shaped by forces wholly **blind**  
  to ends or aims. Still, function holds its **purpose**:  
  to focus sight. Now watch the logic **machine**,  
  cold-souled, compute with neither grasp nor **meaning**,  
  bound to its code—a stark, unyielding **rule**.  

  What **rule** designed that intricate **eye**? None stood  
  to guide the dark. The watchmaker was **blind**,  
  yet work emerged. What then is the **meaning**  
  of such precision? Nature’s grinding **machine**  
  spun without target, void of plan or **purpose**,  
  save trial’s press. No foresight framed the **rule**.  

  The chess move’s **meaning**? Victory’s **purpose** burns  
  in players’ minds. The **machine** remains **blind**  
  to triumph’s thrill. It executes the **rule**  
  by rote, no insight in its glassy **eye**.  
  No part perceives the **purpose**; each small gear  
  just turns, uncomprehending. **Meaning** falls  

  like dust on cogs. That **purpose** we discern  
  in life’s rich forms? The **blind** and patient **machine**  
  of time assembled it. The watchful **eye**  
  sees function, though its making lacked a **rule**  
  that knew the end. We read the **meaning** in,  
  then call it craft. But here, no mind designed the **rule**.  

  The **machine** computes. We grant the **meaning**, trace  
  intent in lines of code. The poet’s **eye**  
  might call it strategy—a deep **purpose**  
  achieved. Yet step by step, it follows **rule**  
  on **rule**, no vision in its path, stone-**blind**  
  to consequence. The **meaning** we bestow  

  is ours alone. The **purpose** we admire  
  in wing or lens? The **blind**, slow-turning **machine**  
  built without plan. No guiding **rule** decreed  
  the **eye** should see. Both show the same stark **meaning**:  
  competence wrought from parts that never knew  
  the whole. The **rule** stands fixed. The **machine** runs **blind**.  

  <center>. . .</center>  

  The **blind** forge yields the **eye**, yields function’s **meaning**;  
  the **machine**, built for **purpose**, runs by **rule**.  
  But **rule**s need hands. I set this **rule**. Now trace the **eye**’s design.
