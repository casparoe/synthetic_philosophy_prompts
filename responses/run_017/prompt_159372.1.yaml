prompt: |-
  I run a tiny prediction pool at work — nothing fancy, we each throw a fiver in and bet on things like monthly rainfall at the local reservoir, or whether the trains hit their punctuality target. I drifted into reading a bit of decision theory through that, and the two-urn example you see everywhere keeps half-fitting and half-not-fitting what I actually watch my friends do, so I want to know whether the bit that doesn't fit has a name of its own.

  The standard setup everyone knows: people would rather bet on a clean coin flip you've told them is 50/50 than on an urn whose mix of red and black balls nobody told them. Mine do that too. But here's the part that never matches the way it gets explained. If I ask them separately, "never mind the coin — on the urn on it's own, which colour do you want, and would you rather have red at even money or black at even money?", they shrug and say it makes no difference, and they really don't care which side they get. So they aren't acting as if the urn is stacked against them; looking only at what they'd bet on, you'd say they think it's dead even. Yet put the coin beside it and they'll pay to have the coin instead. Every explanation I run into seems to work by making the person out to be a quiet pessimist about the urn — as if they secretly suspect there are more black balls — and that just isn't what I'm watching. (For what it's worth, a coin that's already been flipped and covered with a hand feels the same to them as one I'm about to flip, so it's not about whether the outcome is already fixed somewhere.)

  Second case, same shape but odder. On the rainfall bets, the person most reluctant to bet is the one who knows the most — an actual hydrologist. She has a number out of her models, she'll tell you what it is, she'll happily say "fifty-fifty, I'd take either side" — and then she still finds a way not to take the bet, and lets the rest of us, who know nothing at all, have it. So whatever this is, it isn't simple nervousness about your own ignorance, because it gets stronger the more expertise you have rather than weaker. I do vaguely remember seeing it claimed that people are perfectly happy betting on fuzzy things when it's a subject they feel knowledgeable about, which is more or less the opposite of what I see, so maybe I've misunderstood that too.

  So: is there an established notion for this particular animal — a pull away from the fuzzy option that shows up in what you choose but not in what you'd say the chances are, and that grows rather than shrinks the more you know? Or are these two different effects that I'm lumping together under one description? I don't want a label for the label's sake; what I'd like is someone to say what the thing really is, how it differs from the textbook version where the person is just quietly treating the unknown urn as if it were bad, which of the neighbouring ideas it genuinely is (and which it only looks like), where its edges are, and what I'd have to change about my little pool to tell whether I'm looking at one effect or two. Please don't just hand me a reading list or a pile of citations — I've got no library access out here and I'd rather have the argument than the references.
reasoning: |-
  Okay, let me try to unpack what the user is experiencing with their prediction pool. They've noticed two main things that don't quite match standard decision theory explanations. First, their friends are indifferent to betting on red or black for an unknown urn when considered alone, but prefer a fair coin over the urn. Second, their hydrologist friend, despite having expertise and stating equal odds, avoids betting on rainfall while less knowledgeable people jump in.

  The user wants to know if there's a name for this behavior and how it differs from the typical Ellsberg paradox explanation where people act as if the ambiguous option is stacked against them. They mention that their friends don't seem pessimistic about the urn; they genuinely see it as 50/50 but still avoid it when a known-risk alternative exists.

  Hmm, the key here seems to be the distinction between stated beliefs and revealed preferences. The friends say the urn is 50/50, but their betting behavior shows a preference for the coin. That's different from Ellsberg, where people usually express a belief that the ambiguous urn is worse. So maybe it's not ambiguity aversion per se but something else.

  Then there's the hydrologist case. She has a model giving a specific probability, states it's 50/50, yet avoids the bet. The user points out that more knowledge leads to more reluctance, which contradicts the idea that expertise reduces aversion. This might involve uncertainty about the model's accuracy or meta-uncertainty. Even if the model says 50/50, she might be aware of potential flaws or unaccounted variables, making her less confident.

  I recall concepts like the distinction between risk and ambiguity. Ambiguity aversion typically involves not knowing the probabilities, but in the urn case, the user's friends treat it as known 50/50 when alone. So perhaps it's about the quality of information rather than the probability itself. The coin has a clear, physical guarantee of fairness, while the urn's composition is unknown, creating unease even if they state 50/50.

  For the hydrologist, it could be about second-order uncertainty. She knows her model has error margins or could be missing data. Even if the point estimate is 50/50, the uncertainty around that estimate makes her wary. Less knowledgeable people don't perceive that depth, so they bet more freely. This relates to the "precautionary principle" or expert reluctance to act without higher confidence.

  The user might be conflating two effects: one is aversion to poor information quality (the urn), and the other is expert awareness of model limitations (rainfall). Both stem from different types of uncertainty but manifest as avoidance. To test this, introducing a third option with known probabilities but same expected value could help. For the hydrologist, offering bets with slight biases might reveal if she's truly confident or hedging.

  Also, the user’s friends might not be pessimists but have a preference for "epistemic cleanliness." The coin’s fairness is verifiable and straightforward, while the urn’s uncertainty feels messier. Even if they accept 50/50 intellectually, the lack of clear evidence makes them uncomfortable. This isn't about believing the urn is biased but disliking the ambiguity itself.

  In summary, the behaviors observed go beyond classic ambiguity aversion. The urn case involves discomfort with the unknown source of probability, while the hydrologist's reluctance stems from deeper uncertainty about her own estimates. Differentiating these requires examining how stated probabilities align with betting behavior and how expertise influences awareness of uncertainty.
answer: |-
  Your observations capture a fascinating gap between textbook decision theory and real human behavior—and you're right that the classic "Ellsberg Paradox" explanation (where people act as if the ambiguous urn is stacked against them) doesn't quite fit what you're seeing. What you're describing is more subtle, and it has distinct names for each case. Here's the breakdown:

  ### 1. **The Urn vs. Coin Case: "Source Dependence" (Not Ambiguity Aversion)**
     - **What you observe**:  
       People state the urn's probability is 50/50 and are indifferent between red/black *when asked directly*. Yet when offered a choice between betting on the urn or a fair coin, they pay to avoid the urn. Crucially, **they aren't acting as pessimists** (e.g., secretly believing the urn has 40% red balls).  
     - **What it is**:  
       This is **Source Dependence**: valuing identical probabilities differently based on *how the uncertainty is generated*.  
       - The coin represents a "clean," well-understood source of randomness (physics, symmetry).  
       - The urn represents an "unclean" source (unknown human setup, hidden biases).  
       People trust the *process* of the coin more, even if they intellectually assign the same 50% probability to both.  
     - **How it differs from Ellsberg**:  
       In Ellsberg, people *do* act as pessimists—they state a preference for red in one urn and black in another, implying they believe the ambiguous urn is biased. Your group **doesn't exhibit this belief asymmetry**. Their aversion is purely about the *source*, not the probability.  
     - **Key distinction**:  
       > They reject the urn not because they think it’s *unfair*, but because they think it’s *unknowable* in a way that feels qualitatively different from the coin.  

  ### 2. **The Hydrologist Case: "Uncertainty Aversion" or "Second-Order Uncertainty"**
     - **What you observe**:  
       The expert states a precise 50/50 probability based on her model, yet refuses to bet. Less knowledgeable people happily bet. **This aversion *increases* with expertise.**  
     - **What it is**:  
       This is **Second-Order Uncertainty**: uncertainty about *how accurate your probability estimate is*.  
       - Non-experts think: "I have no idea, so 50/50 seems fine."  
       - The hydrologist thinks: "My model says 50/50, but I know the 20 assumptions it relies on, and 3 might be wrong."  
       She isn’t nervous about ignorance; she’s nervous about *the fragility of her knowledge*.  
     - **How it differs from textbook ideas**:  
       Standard models assume people bet based on first-order probabilities (e.g., "P(rain) = 0.5"). Experts often have **meta-knowledge**: "P(rain) = 0.5 ± 0.2 with 70% confidence." Betting feels risky not because the odds are bad, but because the *error bars are wide*.  
     - **Key distinction**:  
       > Her reluctance isn’t about the *probability* of rain—it’s about the *probability of her probability being wrong*.  

  ---

  ### **Why These Are Different Effects (But Look Similar)**
  | Feature                | Urn/Coin Case (Source Dependence)          | Hydrologist Case (Second-Order Uncertainty) |
  |------------------------|---------------------------------------------|---------------------------------------------|
  | **Stated probability** | 50/50 (symmetric)                          | 50/50 (precise point estimate)              |
  | **Driver of aversion** | Distrust of the uncertainty *source*       | Awareness of model limitations              |
  | **Role of knowledge**  | Aversion exists even with minimal info     | Aversion *intensifies* with expertise       |
  | **"Pessimism"?**       | No belief in bias; indifference when alone | No belief in bias; confidence in estimate is low |

  ---

  ### **How to Test Which Effect You're Seeing in Your Pool**
  1. **Test for Source Dependence (Urn/Coin)**:  
     - **Experiment**: Offer three choices:  
       A. Bet on a fair coin (50/50).  
       B. Bet on an urn with *known* 50 red/50 black balls.  
       C. Bet on your ambiguous urn.  
     - **Prediction**:  
       If people are indifferent between A and B but prefer both over C, it’s pure **source dependence** (they distrust the ambiguous *process*). If they prefer A over B, it might involve additional factors (e.g., preferring "natural" randomness).

  2. **Test for Second-Order Uncertainty (Hydrologist)**:  
     - **Experiment**: Frame two bets about rainfall:  
       Bet 1: "Will rainfall be >50mm?" (hydrologist’s model says 50/50).  
       Bet 2: "Will a fair coin land heads?"  
       - Ask the hydrologist: *"Would you need better odds than 1:1 to take Bet 1? What about Bet 2?"*  
     - **Prediction**:  
       If she demands better odds for Bet 1 (e.g., "I’d need 2:1 payout to bet on rain >50mm") but not for the coin, it’s **second-order uncertainty**. She’s revealing hidden risk premiums based on meta-knowledge.

  ---

  ### **The Core Insight**
  Both effects stem from a deeper principle: **People don’t just care about probabilities—they care about the epistemic quality of those probabilities.**  
  - The urn feels “worse” than the coin because its 50/50 is *opaque* (you can’t verify it).  
  - The hydrologist’s 50/50 feels “worse” because she knows it’s *fragile* (small data changes could shift it to 40/60).  

  This is why expertise *increases* aversion in the hydrologist’s case: deeper knowledge exposes more ways a model could fail. What looks like "caution" is really **respect for the limits of what you know**. Your pool isn’t irrational—it’s revealing how humans navigate a world where not all uncertainties are created equal.
