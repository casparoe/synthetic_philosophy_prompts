answer: |-
  Here’s a philosopher’s breakdown of Du Bois's slogan ("all art is propaganda" / "I do not care a damn for any art that is not used for propaganda"), tailored to your novelist’s needs. The core essay is "Criteria of Negro Art" (1926, *The Crisis*), but your instincts about its contemporary deployment are spot-on.

  **1) Brainstorm (~150 words):**
  *   Trivial: Art always has *some* effect, even if unintended (too broad).
  *   Intentionalist: Artists *always* have a purpose/message (denies pure formalism).
  *   Political Determinism: Art *always* reflects power structures/social position (Marxist-leaning).
  *   Functionalist: Art's *primary value* is its social/political utility (radical instrumentalism).
  *   Defensive Necessity: *Oppressed groups* must use art as propaganda for survival (context-specific).
  *   Anti-"Art for Art's Sake": Rejects *claims* of neutrality/aesthetic purity as false or bourgeois.
  *   Prescriptive: *Good* art *must* be consciously propagandistic for liberation.
  *   Audience-Constitutive: Art *addresses/shapes* its audience politically, regardless of explicit message.
  *   Existential: For the marginalized, *choosing not* to propagandize *is* a political act (supporting status quo).
  *   False Dichotomy: The "propaganda vs. pure art" distinction itself is an ideological weapon.

  **2) Menu of Readings (~600 words):**

  1.  **The Inevitable Consequence Thesis:** All art, regardless of creator intent, *has political consequences and effects* within its social context. It shapes perceptions, reinforces or challenges norms, and exists within power structures. (*About: All art*)
  2.  **The Bias of Origin Thesis:** All art inevitably *reflects the perspectives, assumptions, and social location* of its creator(s) and the culture that produced it. True neutrality is impossible; unconscious biases permeate form and content. (*About: All art*)
  3.  **The Social Function Thesis:** Art fundamentally *serves social functions* (celebration, critique, education, myth-making, community-building), making it inherently instrumental, not purely "disinterested." Propaganda is one specific, conscious form of this function. (*About: All art / Art's nature*)
  4.  **The Anti-Neutrality Stance:** Claims that art can be purely aesthetic, divorced from politics or social meaning, are *false, disingenuous, or a luxury afforded only to those whose position isn't threatened*. Such claims obscure art's real role in maintaining or challenging power. (*About: Claims about "pure art" / Art discourse*)
  5.  **The Strategic Necessity Thesis:** For oppressed groups (like Black Americans in the 1920s), art *must* be consciously employed as propaganda *as a matter of survival and liberation*. To *not* do so is irresponsible in the face of systemic distortion and attack. (*About: Art under conditions of oppression*)
  6.  **The Prescriptive Value Thesis:** The *only legitimate or worthwhile art* is that which consciously and effectively serves a progressive political cause (e.g., racial justice). Aesthetic value *is* fundamentally tied to, or even defined by, its propagandistic efficacy for liberation. (*About: Good art / Legitimate art*)
  7.  **The Constitutive Address Thesis:** Art inherently *constructs an implied audience and defines a public sphere*. Its politics lie not just in explicit messages, but in *who it addresses, whose experiences it centers, whose humanity it assumes, and what modes of engagement it fosters*. (*About: All art*)

  **3) Verdicts on the Readings (~400 words):**

  1.  **Inevitable Consequence:** **Substantive & Defensible.** Widely accepted in cultural studies/sociology of art. Art exists in the world and has effects, intended or not.
  2.  **Bias of Origin:** **Substantive & Defensible.** Supported by critical theory (e.g., standpoint epistemology). Denies the myth of the "view from nowhere."
  3.  **Social Function:** **Substantive & Defensible.** A core anthropological/sociological view. Art *does* things in societies.
  4.  **Anti-Neutrality Stance:** **Substantive & Defensible (in context).** Powerful critique of aesthetic ideologies masking power, especially relevant to Du Bois's fight against racist stereotypes and the dismissal of Black art.
  5.  **Strategic Necessity:** **Substantive & Defensible (historically specific).** Explains Du Bois's urgency in 1926. Not necessarily a universal claim about *all* art *everywhere*, but a compelling argument for *that* moment and struggle.
  6.  **Prescriptive Value:** **Substantive but Contested / Potentially Unhelpful.** Defensible as a *political commitment* (Du Bois's own stance), but problematic as a universal aesthetic theory. Reduces art's complexity and risks prescriptive dogma. Denies value to art exploring ambiguity, individual experience outside overt politics, or formal innovation not directly serving "the cause."
  7.  **Constitutive Address:** **Substantive & Defensible.** A crucial expansion often implied but not explicit in the slogan itself. Highlights how form, perspective, and implied audience are deeply political.

  **4) Which Readings Support My Friend's Use (~300 words):**

  Your friend's move relies **exclusively** on the strongest, most prescriptive readings to deflect the "too preachy" critique:

  *   **Requires Reading #6 (Prescriptive Value):** This reading directly states that *only* overtly propagandistic art is legitimate. If this is true, then "preachiness" isn't a flaw; it's *the point*. Criticizing it becomes a failure to grasp art's true purpose. Calls for subtlety or ambiguity could be dismissed as appeals to a false neutrality or bourgeois aesthetics.
  *   **Uses Reading #4 (Anti-Neutrality) Strategically:** She likely invokes the slogan's weak readings (#1, #2, #3) or #4 to establish the premise "all art is political," then **smuggles in #6** as the conclusion. "You admit all art has a line? Then my line is the right one, and stating it clearly is a virtue, not a flaw. Your call for less preaching is just your *own* political preference disguised as 'aesthetics'." This collapses the distinction between acknowledging art's political *dimensions* and demanding it adopt a specific, overtly *didactic form*.
  *   **Readings that DO NOT Support Her Move:** #1, #2, #3, #5 (in its descriptive aspect), and #7. These acknowledge art's political nature *without* dictating that it *must* be didactic. They leave room to argue that subtlety, complexity, ambiguity, or focusing on "propaganda of address" can be *more effective* or *aesthetically richer* forms of political art than direct preaching. #5 (Strategic Necessity) *might* support her if she argues her specific cause *demands* directness, but it doesn't automatically invalidate other approaches.

  **5) Can it be about Propaganda of Address? (~250 words):**

  **Yes, absolutely, and your distinction is insightful, not silly.** While the slogan *emphasizes* "propaganda of content" (especially in its strong, prescriptive form), Du Bois's **broader argument** in "Criteria of Negro Art" and his life's work powerfully engages "propaganda of address."

  *   **Du Bois's Context:** He fought against racist propaganda that depicted Black people as inhuman or ridiculous (*Birth of a Nation* loomed large). His demand for art as propaganda was, fundamentally, a demand for art that *centered Black humanity, dignity, and experience* – a radical act of address in a culture denying it. He wanted art that spoke *to* Black people *as* a worthy audience and *represented* them truthfully *to* the wider world.
  *   **Reading #7 Fits:** The slogan can be interpreted as claiming that *all art inherently performs this constitutive address*, thereby always making a political statement about who matters and how they are seen. A "quiet, ambivalent illustration" focusing on intimate Black life, rejecting stereotypes without overt slogans, *is* propaganda in this sense – it asserts presence, complexity, and worthiness of attention. It constructs an audience capable of appreciating that complexity.
  *   **Sharpening the Distinction:** Excellent. "Propaganda of Content": The explicit message/didacticism. "Propaganda of Address": The politics of *representation, perspective, voice, and implied audience* – *who* is shown, *how* they are shown, *who* the work assumes is looking/listening, and *what* it assumes they understand/feel. Du Bois cared deeply about both, though the slogan foregrounds "content." Your character's illustrations are prime examples of potent "propaganda of address."

  **6) Bottom Line for a Novelist (~150 words):**

  **Stop arguing *if* art is political.** Focus the debate **inside** that reality. Your characters should clash over *how* art best serves politics:

  *   **The Preacher vs. The Portraitist:** Does liberation demand explicit messaging (your friend's plays), or is the quiet assertion of complex humanity (your illustrations) a deeper, more insidious challenge to dehumanization? Can subtlety reach different audiences or reveal truths didacticism obscures?
  *   **The Slogan's Use:** Show its power **and** its danger. Let a passionate character wield it defensively (like your friend) to justify bluntness. Let another (like yours!) reinterpret it expansively to defend nuance and "propaganda of address." Let a cynic misuse it to dismiss *any* political critique of shallow art. Let an elder warn against dogma stifling artistic truth.
  *   **Avoid Laziness:** Don't let the slogan be a conversation *stopper* in your novel; make it a conversation *starter* about political urgency, artistic integrity, audience, and the myriad ways art shapes the world. Explore the tension between the undeniable need for clear voices in struggle and the equally profound power of art that whispers truths too complex for slogans.
