  ### Collective Decision-Making Game  
  *Fully Runnable In-Class Exercise*

  ---

  #### **1. Game Setup**  
  **Objective**: Participants decide whether to "launch" a project. Any single participant can trigger the launch, affecting everyone. Points are earned based on outcomes.  
  **Materials**: 
  - *True Value (V)*: Index cards in a cloth bag: 6 cards with "+1", 3 with "–1", 1 with "–10".  
  - *Private Signals (S_i)*: Playing cards (one deck) in a bag: 4 cards of each rank (2, 3, 4, 5, 6). Assign noise: 2 → –2, 3 → –1, 4 → 0, 5 → +1, 6 → +2.  
  - *Scoring*: Points per round = V if launched, 0 if not. Negative points lose chocolates (1 chocolate = 5 points net gain). Refraining (not launching) is viable—0 points often beats losses.  

  **Distributions**:  
  - True Value (V): Heavy-tailed downside. P(+1) = 60%, P(–1) = 30%, P(–10) = 10%. Expected V = –0.7.  
  - Noise (e_i): Uniform. P(–2) = 20%, P(–1) = 20%, P(0) = 20%, P(+1) = 20%, P(+2) = 20%.  
  - Signal: S_i = V + e_i.  

  **Procedure per Round**:  
  1. Draw V card secretly (bag shaken, facilitator draws).  
  2. For each active participant (see "Sequence"), draw a noise card. Calculate S_i = V + e_i. Write S_i on an index card, hand privately.  
  3. Decision: Participants decide privately. At "GO", any active participant may raise hand to trigger launch. If any hand is raised, project launches.  
  4. Reveal V. Update scores (whiteboard).  

  ---

  #### **2. Sequence of Rounds**  
  **Rounds 1–4: Varying Group Size (Unilateral Rule)**  
  - **Round 1**: All 18 active.  
  - **Round 2**: Randomly select 9 active (draw participant IDs from bag).  
  - **Round 3**: Randomly select 3 active.  
  - **Round 4**: Randomly select 1 active.  

  **Whiteboard Recording**:  
  | Round | Active Participants (N) | Launched? | True V | Points/Player | Notes |  
  |-------|--------------------------|-----------|--------|--------------|-------|  
  | 1     | 18                       | Yes       | –1     | –1           |       |  
  | ...   | ...                      | ...       | ...    | ...          |       |  

  **Engineered Moments**:  
  - **First Moment (Round 1)**: Rig V = –1. Assign 17 participants e_i = –2, –1, or 0 (signals: –3, –2, –1). Assign one e_i = +2 (signal: +1). Most see negative signals (shouldn’t launch), but the +1 signal triggers launch. Group loses points.  
  - **Second Moment (Rounds 1–4)**: After 4 rounds, average scores: N=18 ≈ –0.7, N=1 ≈ 0.4. Larger N has worse outcomes despite identical signals/distributions.  

  ---

  #### **3. Alternative Decision Rules (Rounds 5–7)**  
  All rounds with N=18. Expected values:  
  - **Round 5 (Majority Vote)**: Active participants vote. Majority >50% launches. *Expected: –0.3*.  
  - **Round 6 (Unanimity)**: All active must agree to launch. *Expected: 0.0* (rarely launches).  
  - **Round 7 (Delegation)**: Randomly select one delegate. Only they decide. *Expected: +0.4*.  

  **Complications (Rounds 8–11)**:  
  - **Round 8 (Private Benefit)**: Triggering gives +3 points privately; losses still shared. *Bias worsens: more reckless triggering.*  
  - **Round 9 (Pay for Vote)**: Participants pay 1 point to force a synchronous vote (majority rule). *Tests if costly coordination helps.*  
  - **Round 10 (Expert Trigger)**: 3 "experts" receive e_i from {–1,0,+1} (lower variance). Only they can trigger. *Doesn’t fix curse—relocates bias to "better" signals.*  
  - **Round 11 (Open Deliberation)**: Participants discuss signals openly, then decide unilaterally. *Pooling helps if independent evidence; worsens if shared optimism dominates.*  

  **Final Round 12**: Group proposes and uses its own rule (e.g., threshold vote, random delegate).  

  ---

  #### **4. Participant Rules Sheet**  
  *(Neutral, 1 page, distributed pre-game)*  

  **Project Launch Game**  
  - **Goal**: Maximize points (chocolate = 5 points net gain).  
  - **Setup**:  
    - A hidden "true value" (V) is drawn each round.  
    - You receive a private signal (S_i) = V + noise.  
  - **Decision**:  
    - If you are "active" (varies by round), you may choose to:  
      - **Trigger**: Raise hand when prompted. If *any* active participant triggers, the project launches for everyone.  
      - **Refrain**: Do nothing.  
  - **Outcomes**:  
    - If launched: Everyone gains/loses points = V.  
    - If not launched: Points = 0 for all.  
  - **Scoring**: Points accumulate. Negative points reduce net gains.  
  - **Process**:  
    1. Facilitator draws V and generates private signals.  
    2. Active participants see signals.  
    3. At "GO", active participants may raise hands to trigger.  
    4. V revealed. Points updated.  
  - **Special Rounds**: Rules may change (e.g., voting, discussion). Follow facilitator instructions.  

  ---

  #### **5. Debrief Guide**  
  **Key Moments and Mechanisms**:  
  - **Round 1 (Unilateral, N=18)**: Shows "one-sided filter"—only optimistic signals (e.g., +1) trigger, even when *most* signals are negative. Leads to group loss.  
  - **Whiteboard Evidence**: Compare average scores:  
    - Unilateral rule: Scores ↓ as N ↑. N=18 averages –0.7; N=1 averages +0.4.  
    - Why? *Effective evidence threshold*: Only the *highest* signal matters (not group’s best judgment).  
  - **Not Groupthink/Tragedy/Optimism Bias**:  
    - Not groupthink: No social pressure—decisions are private.  
    - Not tragedy: No individual gain at group expense (losses shared equally).  
    - Not optimism bias: Participants are well-calibrated; signals are symmetrically noisy.  
  - **Why Info/Discussion Doesn’t Fix It**:  
    - Better info (e.g., experts) relocates bias (Round 10).  
    - Discussion helps if pooling *independent* evidence (Round 11), but worsens if shared optimism is "double-counted."  
  - **Decision Rule Change**: Delegation/majority *lowers* triggering probability (e.g., delegation: +0.4 vs. unilateral: –0.7).  
  - **When It Doesn’t Arise**: If decisions require consensus (unanimity) or if risks are symmetric (no unilateral trigger).  

  ---

  #### **6. Predictable Issues and Fixes**  
  **Anticipated Problems**:  
  - **Triggering out of curiosity**: Participants trigger to "see what happens."  
    - *Fix*: Emphasize scoring stakes (chocolates) and goal: "Maximize *your* points."  
  - **Inferring hidden info**: "Someone must know something!"  
    - *Fix*: Stress signals are private and noisy. Record signals/V post-round to show randomness.  
  - **Coordination/signaling**: Participants whisper or signal intentions.  
    - *Fix*: Enforce silence. Use index cards for decisions.  
  - **Unlucky samples**: Small rounds may not show the curse (e.g., N=3 avoids loss).  
    - *Fix*: Run 2–3 repeats per N. Use whiteboard averages to show the trend.  
  - **Chocolate distortion**: Over-aggression due to stakes.  
    - *Fix*: Award chocolates at end (not per round). Downplay rewards early.  
  - **Confusion on rules**: Misunderstand active/inactive roles.  
    - *Fix*: Clear rules sheet. Pre-round reminder: "Only active participants decide."  

  **Limitations**:  
  - **Cannot reproduce irreversibility/unbounded stakes**: Game has finite losses; real-world stakes may be catastrophic.  
  - **Step to individual reason to refrain**: The curse emerges *collectively*; individuals still benefit from triggering if their signal is high. Explain: "Your private signal may justify action, but the group suffers because *any* optimistic error triggers."  
  - **Simplified distributions**: Real-world distributions are fatter-tailed; game uses discrete approximations.  

  **Pre-Game Prep**:  
  - Pre-rig Round 1 (V=–1, signals: 17 low, 1 high).  
  - Prepare index cards (V: 6x+1, 3x–1, 1x–10; noise: 4x each rank).  
  - Whiteboard: Pre-draw table.  
  - Rules: Minimal lecture. Start with: "Read the sheet. Goal: Maximize your points."  

  ---  
  This design ensures participants experience the unilateralist’s curse: Optimistic errors dominate, group size amplifies harm, and fixes require rule changes, not just better judgment. Debrief ties gameplay to theory, with fixes for common pitfalls.
