prompt: |-
  hey — is there a name for this? I do logistics for a volunteer organisation and read a bit of this decision-theory stuff on the side, so forgive the lay description.

  There's a thing I half remember where loads of people can each do the same risky-but-useful thing on their own, one person doing it is great, but each extra person who does it stacks up the downside without stacking up the upside, so everybody individually reckons they should go ahead and the group ends up worse off. I think the name has "curse" in it, or maybe I'm mixing it up with the auction thing. Anyway — that's not quite the pattern I keep noticing. The pattern I keep noticing is about *who* ends up doing it.

  Two from real life:

  We have a group chat of about twelve and we need one person to email the guy who owns a hall and ask if we can have it for free. One polite email, decent odds. Four separate emails from four different people and he thinks we're a circus and says no to all of us. Everyone can see the chat, so nobody wants to be email number two. So nothing happens for a week, and then whoever is least able to sit with an unanswered thing fires off an email — and in that particular group the people who can't leave it alone are also the people who write a bad email and don't know him. So the ask gets made by the worst available person, and it gets made by them precisely because everyone else was being careful. The careful peoples restraint doesn't remove the risk, it just delegates the decision to whoever is worst at it.

  Second one, from a job I had: a shared service, anyone on the rota could push a hotfix for a bad config. Two people pushing at once and the change double-applies and takes the thing down for an hour. Everyone watches the same dashboard. Guess who pushes. It's whoever's tolerance for watching the error rate is lowest, which tracks pretty well with being the person who least understands what the config actually does. Same shape.

  So: many people each have the option; exactly one taking it is what you want; more than one is bad; everyone can see that nobody has taken it yet; waiting has a cost; and the cost of waiting varies across people in a way that correlates the wrong way with how good they'd be at it. Result: the group's caution selects its least suitable member to act unilaterally.

  What I want isn't a label. I want to know what this is and what it isn't:

  - Is it just the curse thing plus the adverse-selection thing glued together, or does the visibility and the ordering do real work? Every version of the curse I've come across is simultaneous and nobody can see anybody else. If it's genuinely a distinct failure mode I'd like it named; if I'm only redescribing a special case, say so, tell me which one, and say how much gets lost by subsuming it.
  - It feels close to the auction thing where the winner is whoever overestimated the most, close to the nobody-helps-because-everyone-assumes-someone-else-will thing, and close to a standoff where each side waits for the other to blink. It isn't any of those, or not only those — the first is about prices and one winner, the second is about nobody acting at all, and in the third nobody acting is the good outcome. But I'd like the boundaries drawn properly against each of them and against whatever else is nearby.
  - The fix looks different, and that's my main reason for wanting a separate name. For the curse the advice is basically restrain yourself, coordinate, build a norm against acting alone. Here the fix isn't "nobody do it" — somebody should do it, just not that person. You'd assign the job outright, or make the competent person's waiting cheap, or make the eager person's acting expensive. If the remedies come apart like that, is that enough to make it a separate concept, or is that a bad test?
  - Boundary cases I can't settle: if the correlation runs the other way — the most impatient person is also the best at it — then nothing goes wrong and it doesn't feel like a phenomenon at all. Same thing with a happy ending, or outside the definition? If everyone is equally competent but everyone waits, is that still my thing or just the ordinary coordination problem? And does it need the more-than-one-is-actively-harmful part at all, or does merely-wasteful duplication work too?

  If there's no name, coin one, define it, and give me the edge cases. I definately won't be satisfied with "that's roughly X".
reasoning: |-
  Alright, let's tackle this user's query. They're describing a situation where multiple people can perform a task, but only one should act to avoid negative consequences. The key twist is that the person who ends up acting is the least suitable because they're the most impatient, and this impatience correlates with incompetence. 

  First, I need to recall if there's an existing term for this. The user mentions "curse" like the winner's curse or curse of knowledge, but those don't fit. The winner's curse is about auctions and overestimation, while here it's about adverse selection in who acts first. 

  The bystander effect comes to mind, but that's about diffusion of responsibility where no one acts. Here, someone does act, but it's the worst person. So that's different. 

  Coordination problems usually involve everyone needing to align actions, but here the issue is the selection mechanism based on waiting costs. Moloch is a broader concept about systemic failures, but it's too vague. 

  Wait, what about the volunteer's dilemma? That's where one person must take a cost for the group's benefit. But in the standard model, the first volunteer solves the problem. Here, multiple volunteers make things worse. That's a crucial difference. The existing volunteer's dilemma doesn't account for the harm from multiple actions or the correlation between impatience and incompetence. 

  So maybe this is a variant. The user’s examples show that acting second is harmful, so the dilemma includes a negative externality from multiple volunteers. Plus, the adverse selection where those with the lowest waiting costs (impatient) are least competent. 

  The fixes the user mentions—like assigning the task or making competent people’s waiting cheaper—support that this is a distinct problem. In the standard volunteer's dilemma, coordination or incentives might work, but here you need to prevent the wrong person from acting. 

  Boundary cases: If the impatient are competent, no problem arises. If everyone waits, it's a coordination failure. The harm from multiple actors is necessary because without it, the first volunteer is good. 

  So coining "Adverse Selection Volunteer's Dilemma" or "Volunteer's Curse" makes sense. It highlights the core dilemma with added adverse selection and negative externalities. The user needs clear boundaries from similar concepts, which this naming addresses.
answer: |-
  This is a **distinct failure mode** that deserves its own label. It combines elements of established concepts but introduces a critical **temporal ordering and visibility mechanism** leading to **adverse selection** in who acts first. It's not merely a special case of existing "curse" phenomena.

  **Your Core Phenomenon: The Adverse Selection Volunteer's Dilemma (ASVD)**

  1.  **The Situation:**
      *   Multiple agents (N > 1) can individually perform a risky but potentially beneficial action.
      *   Exactly one successful action is optimal for the group.
      *   Zero actions incur a cost (the "waiting cost").
      *   Multiple simultaneous or near-simultaneous actions incur a high cost or cause failure (harmful duplication).
      *   Agents can observe whether action has been taken yet (visibility).
      *   Agents have heterogeneous:
          *   **Competence/Suitability (C):** How well they would perform the action if acting alone.
          *   **Waiting Cost Tolerance (W):** How much psychological or tangible cost they incur per unit time waiting for *someone else* to act. (Low tolerance = High impatience).
      *   Crucially, **Competence (C) and Waiting Cost Tolerance (W) are negatively correlated:** Agents with the *lowest* tolerance for waiting (highest impatience) tend to have the *lowest* competence/suitability. (C ↓ as W ↑)

  2.  **The Process:**
      1.  A need for action arises (visible to all).
      2.  Agents observe that no one has acted yet.
      3.  Agents with high W (low waiting tolerance/impatience) feel the pressure to act *sooner*.
      4.  Agents with low W (high tolerance/patience) are willing to wait longer, hoping a more suitable agent will act.
      5.  Due to the negative correlation (C ↓ as W ↑), the agent(s) with the *highest* impatience/lowest tolerance (low W tolerance = high W) are also the *least* competent/suitable (low C).
      6.  This least suitable agent acts first to resolve their own high waiting cost, triggering the action.
      7.  Other agents, observing the action, refrain (avoiding harmful duplication).

  3.  **The Outcome:**
      *   The action is taken by the *least suitable* agent.
      *   The group suffers a suboptimal outcome precisely *because* the more suitable agents exercised restraint. Their patience delegated the action to the worst candidate.

  **Why "Adverse Selection Volunteer's Dilemma" (ASVD)?**

  *   **Volunteer's Dilemma Core:** The foundational structure is the Volunteer's Dilemma. Each agent would prefer *someone else* to bear the cost/risk of acting, but if *no one* acts, everyone suffers the cost of inaction. Acting is costly/risky but provides a public good.
  *   **Adverse Selection Mechanism:** The critical addition is the *dynamic selection process* based on visibility and heterogeneous waiting costs. The agent "selected" to volunteer is not random; the process systematically selects the *worst* possible volunteer *because* they have the highest personal cost for waiting. This is classic adverse selection: the undesirable type (low-C) is the one most likely to enter the transaction (volunteer) due to their characteristics (high-W).
  *   **"Dilemma":** Highlights the conflict between individual rationality (acting to relieve your own high waiting cost) and group optimality (needing a suitable agent to act).

  **Boundaries Drawn Against Nearby Concepts:**

  1.  **Winner's Curse (Auctions):** Involves overestimation of value in common value auctions. While both involve "curses" and suboptimal outcomes, the mechanisms differ fundamentally. WC is about valuation errors in bidding; ASVD is about dynamic action selection based on heterogeneous costs and adverse selection in volunteering. No visibility of others' bidding vs. crucial visibility of non-action in ASVD.
  2.  **Bystander Effect / Diffusion of Responsibility:** Focuses on the *reduction* in the likelihood of *anyone* acting as group size increases due to shared responsibility. ASVD assumes *someone will eventually act* (due to waiting costs), but it will be the *worst* person. It's about *who* acts, not *if* someone acts.
  3.  **Coordination Problem / Stag Hunt:** These require multiple agents to choose the *same, specific* beneficial strategy simultaneously or in coordination. ASVD requires *exactly one* agent to choose a *risky* action while others choose *inaction*. The failure in ASVD arises from the *selection mechanism for who acts*, not a failure to coordinate on *which* strategy to play.
  4.  **Standard Volunteer's Dilemma (VD):** The core model assumes homogeneous agents or focuses on the probability that *no one* volunteers. Crucially, the standard VD does **not** incorporate:
      *   Harmful duplication (multiple actions are bad).
      *   Visibility of non-action influencing timing.
      *   Heterogeneous competence (C).
      *   Heterogeneous waiting costs (W).
      *   The *negative correlation* (C ↓ as W ↑).
      *   The resulting adverse selection in *who* volunteers first. The standard VD outcome is "someone volunteers or no one does". ASVD predicts "the *worst* person volunteers".

  **Why it Needs a Separate Label & Concept (ASVD):**

  1.  **Distinct Mechanism:** The combination of visible non-action, heterogeneous waiting costs negatively correlated with competence, and harmful duplication creates a unique dynamic selection process leading to adverse selection.
  2.  **Distinct Outcome:** The outcome isn't "no action" (Bystander Effect) or "overpaying" (Winner's Curse) or "failure to coordinate" (Stag Hunt). It's specifically "action taken by the *least suitable* member due to the restraint of more suitable members".
  3.  **Distinct Remedies:** As you intuited:
      *   **Standard VD/Bystander:** Encourage *someone* to act (make volunteering cheaper, assign responsibility, reduce diffusion).
      *   **Winner's Curse:** Bid more conservatively.
      *   **ASVD:** *Prevent the wrong person from acting first.* Solutions must break the adverse selection link:
          *   **Assign/Designate:** Explicitly assign the task to a suitable agent upfront, removing the volunteer dynamic.
          *   **Reduce Impatience of Competent:** Make waiting less costly *specifically* for competent agents (e.g., give them higher-priority tasks to focus on, assure them their patience is valued).
          *   **Increase Cost of Acting for Eager/Incompetent:** Add friction for low-competence/high-impatience agents (e.g., require approval, a brief checklist, or a short cooling-off period before they can act).
          *   **Sequential Signaling:** Create a structured process where agents signal intent or availability in a way that allows suitable agents to step forward *before* the most impatient are forced to act (e.g., "I can take this by 3 PM if no one else does by 2 PM").
          *   **Decouple Observation:** If possible, reduce the visibility that *no one has acted yet* for the low-competence/high-impatience group (hard in practice).

  **Boundary Cases (Applying ASVD Definition):**

  1.  **Positive Correlation (C ↑ as W ↑ - Impatient are Competent):** This is **outside the definition of the *failure mode* ASVD**. The outcome is likely good: the most competent person (who is also impatient) acts quickly. It's a happy coincidence, not the pathological selection process described by ASVD. The underlying VD structure might exist, but the adverse selection is absent or reversed.
  2.  **Everyone Equally Competent but Everyone Waits:** This is **primarily a Standard Volunteer's Dilemma or Bystander Effect**. The failure is that *no one* acts due to diffusion of responsibility/fear of being the sucker. Adverse selection isn't relevant because competence is homogeneous. The harmful duplication risk might exist, but the core failure is inaction, not selection of a bad actor.
  3.  **Merely-Wasteful Duplication (No Active Harm):** This **weakens but does not eliminate ASVD**. The *intensity* of the failure is reduced. However, the adverse selection dynamic still occurs: the least competent (due to their high impatience) is still likely to act first, leading to a suboptimal outcome (e.g., a poorly written email is sent when a better one could have been written later). The *incentive* for competent people to wait is still present (avoiding wasted effort), and their patience still delegates the task to the impatient/less-competent. Harmful duplication makes the problem *more severe* and the waiting game more tense, but wasteful duplication alone can sustain the adverse selection mechanism.

  **In Summary:**

  You've identified a sharp, recurring pattern: **The Adverse Selection Volunteer's Dilemma (ASVD)**. It's distinct because:

  *   It requires **visibility of non-action** and **heterogeneous waiting costs**.
  *   It critically depends on the **negative correlation** between waiting cost tolerance and competence.
  *   It results in **harmful or wasteful duplication** if multiple act, driving the restraint of competent agents.
  *   This restraint **actively causes the worst agent to be selected** due to their impatience.
  *   The fixes are fundamentally about **breaking the adverse selection link** in who volunteers first.

  This isn't just "roughly" anything else. The dynamic selection process driven by visible delay and correlated impatience/incompetence creates a unique and perverse failure mode demanding its own conceptualization. ASVD captures it precisely. Use the label; define it clearly (visibility, heterogeneity, negative correlation, harmful duplication); and implement solutions targeting the adverse selection mechanism.
