  The disagreement is not merely verbal. It stems from the Cantor-accepter's ability to use a proof that quantifies over an infinite totality (the set of all proofs) to achieve a level of certainty that the finitist, lacking access to that proof, does not have. The finitist's position is not just a preference for weaker logic; it is a rejection of the ontological status of the infinite set required for the proof. The bet disagreement is a manifestation of this difference. However, the attack above shows that the Cantor-accepter's certainty might be questioned even within their own framework, which could undermine the scenario. To strengthen, note that the Cantor-accepter, by accepting the axioms of set theory, is committed to the consistency of F as a definite fact, while the finitist is not. The finitist's doubt is not merely about the strength of the system but about the meaningfulness of the infinite set. This might be the best we can do.
