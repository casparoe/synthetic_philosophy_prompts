prompt: |-
  Practical question that turned into a philosphy one, sorry.

  I'm rewriting my psychiatric advance directive — the form where you say now what should happen if you get sectioned during a manic episode. During my last episode I was maybe 99% sure I was completely fine and didn't need meds, and it genuinely felt like clear thinking at the time. Today I'd put maybe 15% on "I was fine." My psychiatrist wants a clause that commits me to a 14-day admission regardless of what I'm saying when they see me; my solicitor is fine with that.

  But a philosopher friend says van Fraassen's Reflection principle means I'm rationally required to line my current credence up with my expected future credence — so if I know future-me is going to sit at 99% on "I'm fine", I should already be near 99% now, and pre-committing against my own future judgment is a kind of diachronic incoherence that a bookie could exploit with a Dutch book. That can't be right, surely: the whole point is that the 99% is manufactured by the episode.

  So: what are the most important implications of the Reflection principle for how I should actually write this thing? Concretely — is it a live constraint on someone in my position, or only on an ideal agent who is certain she won't become irrational, won't forget things, and won't get pushed around later? Where exactly does the argument break, on the Dutch book version and on the conditionalization version? And does it say anything about who the directive should defer to: me during the episode, my psychiatrist, or some weighted mix of us? Is there a sensible reading on which the thing I should be deferring to is more like "me after three weeks on medication" than "me on day two"?

  Two wrinkles I actually care about. One: my insurer knocks a chunk off my premium if I sign a declaration of recovery, so future-me will have a financial reason to be confident — can that motive reach backwards through Reflection and change what I'm required to believe today, which is definately not what I want the directive to do? Two: would it be smarter to trigger the clause on my confidence staying above 90% for 72 hours rather than on its level at any single moment?

  Not after medical or legal advice, obviously — just the shape of the argument and what the principle really commits me to.
reasoning: |-
  Okay, let me tackle this user's query. They're rewriting their psychiatric advance directive and dealing with the Reflection Principle brought up by their philosopher friend. The core issue is whether pre-committing to a 14-day admission during a manic episode is rational given that future-me might be 99% sure they're fine. But the user knows that this confidence is part of the episode's distortion. I need to dissect where Reflection applies and where it doesn't.

  First, the Reflection Principle assumes rational agents without information loss. But in mania, cognition is impaired. That's a key breakdown point. The Dutch Book argument fails because future-me isn't reliable during an episode; their judgment is compromised. So current-me can rightly discount future-me's credence. 

  Then there's the insurer incentive. Future-me might be financially motivated to declare recovery. Reflection could imply that current-me should adjust beliefs based on that future incentive. But that's problematic because it's a bias, not genuine belief. The user wants to avoid this influencing their directive. Highlighting that Reflection doesn't account for external incentives is crucial here.

  The trigger mechanism—confidence above 90% for 72 hours versus a single moment—touches on stability. A sustained high confidence might indicate mania's persistence, making it a better trigger. It also mitigates fleeting moments of clarity. Philosophically, this aligns with requiring consistent evidence before overriding the directive.

  The user also asks who to defer to. Post-medication me, after three weeks, has integrated both perspectives. That's the epistemically privileged position. The directive should prioritize that over the in-episode self or the psychiatrist alone. 

  I should emphasize the non-ideal conditions: mania disrupts rationality, memory, and access to past insights. Reflection requires information conservation, which isn't present here. The user's current self, aware of episodic distortions, is justified in pre-committing against future judgment. 

  Finally, practical advice: frame the directive to activate based on sustained confidence, specify post-stabilization evaluation, and note insurer incentives as a bias. This addresses the philosophical concerns while respecting the medical reality.
answer: |-
  This is a profoundly insightful application of philosophy to a vital real-world decision. Your philosopher friend is pointing to a genuine tension, but the Reflection principle has crucial limitations in your situation. Here's a breakdown of the implications, where it breaks, and how to structure your directive:

  **1. Van Fraassen's Reflection Principle: Core Idea & Ideal Assumptions**
     *   **Core:** If you now know that at future time T you will have credence C in proposition P, then you should *now* have credence C in P. (E.g., "If I know tomorrow I'll be 99% sure I'm fine, I should be 99% sure *now*.")
     *   **Assumptions:** This principle relies on an *ideal rational agent* who:
          *   Is certain she will remain fully rational at T.
          *   Is certain she will not lose any relevant information between now and T.
          *   Is certain no new, relevant, *truth-indicating* evidence will be gained *except* through the process leading to the credence at T.
          *   Believes her future self is epistemically authoritative *at that time*.

  **2. Where Reflection Breaks Down in Your Case (The Dutch Book & Conditionalization Arguments Fail Here):**
     *   **Breakdown Point 1: Loss of Rationality & Access to Information (The Core Issue):** Mania fundamentally disrupts the cognitive processes required for idealized rationality. It doesn't just change your *beliefs*; it impairs the *mechanism of belief formation and evaluation*. During mania:
          *   **Information Loss:** You may literally forget (or radically discount) the negative consequences of past episodes, your prior commitments, and the reasoning behind your directive. This violates the "no information loss" assumption.
          *   **Reasoning Impairment:** Grandiosity, pressured thinking, and impaired judgment make the high credence "manufactured," not the result of a reliable epistemic process integrating all available evidence. Future-manic-you is *not* epistemically authoritative on your state of health.
          *   **Violation of Ideal Agent Assumption:** You *know now* that you *will become irrational* in key ways during an episode. Reflection assumes you trust your future self's rationality; here, you have overwhelming evidence *not* to trust it *in this specific state*.
          *   **Dutch Book Failure:** A bookie can only exploit incoherence if the agent acts on their inconsistent credences *while rational*. Pre-commitment is a *rational strategy* precisely *because* you know you will become temporarily irrational. The "bet" you place now (the directive) is designed to protect future-you *from* the irrational bets (refusing meds/admission) you would make during mania. It's coherent *diachronic planning*, not incoherence.
          *   **Conditionalization Failure:** Conditionalization requires updating on *new evidence*. The shift to 99% during mania isn't solely due to *new truth-indicating evidence*; it's significantly driven by a *pathological alteration of cognitive processing*. You cannot rationally conditionalize on evidence filtered through a known dysfunctional process.

     *   **Breakdown Point 2: Anticipated Motivational Distortion (The Insurer Wrinkle):**
          *   Reflection says: If you know future-you will have credence C (driven partly by financial incentive), you should have credence C *now*.
          *   **The Problem:** The financial incentive creates a *bias*, not necessarily a *justified belief*. Future-you's high confidence might be *motivated reasoning* (confabulating reasons to believe you're fine to get the discount), not a genuine evaluation of evidence.
          *   **Implication for You:** This strengthens the case for *ignoring* future-manic-you's credence via the directive. You *know* that credence might be inflated by an irrelevant incentive, *on top of* the cognitive distortions of mania. Reflection, applied naively here, would force current-you to adopt a credence *you know* is potentially biased and manufactured – which is clearly irrational. **This wrinkle does *not* obligate you to raise your current credence.** It highlights another reason future-manic-you's judgment is unreliable and why pre-commitment is rational.

  **3. Implications for Structuring Your Directive: Who to Defer To and How?**

     *   **Reject Deference to "Me During the Episode":** The Reflection principle does *not* compel you to defer to your future manic self. The epistemic and rational breakdown during mania severs the necessary trust. The directive's *purpose* is to override that future self.
     *   **Deference to "Me After Three Weeks on Medication" is Epistemically Privileged:** This aligns best with the *spirit* of Reflection under *recovered* conditions.
          *   **Information Integration:** This self has access to:
              *   Current (post-stable) experience.
              *   Memories (though potentially imperfect) of the manic state and its reasoning.
              *   Memories of the pre-episode reasoning that created the directive.
              *   The observed consequences of actions taken during the episode.
          *   **Stable Rationality:** Cognitive function is restored, allowing for more balanced evaluation.
          *   **Reflection Applied Later:** Your current self *can* reasonably defer to your *future recovered self's* assessment of the episode ("Was I actually fine?"). *That* self has the best integrated perspective. **This is the "you" the directive should ultimately empower to make the final assessment *after* the acute phase is managed.** The 14-day admission allows this perspective to emerge.
     *   **Role of the Psychiatrist (External Rational Agent):** Your current self rationally judges that the psychiatrist, while fallible, possesses:
          *   Expertise you lack during mania.
          *   An external perspective less clouded by the pathology.
          *   Knowledge of your history and directive.
          Delegating the *initial* decision (to invoke the directive/admit) to the psychiatrist + the pre-commitment is a rational strategy to compensate for your anticipated future irrationality. It's not pure deference; it's using them as a proxy for your *prior* rational self.

  **4. Addressing the Concrete Wrinkles:**

     *   **Wrinkle 1 (Insurer Incentive):** This actively *undermines* the reliability of future-manic-you's self-assessment. **Action:** Ensure your directive explicitly states that any declaration of recovery for insurance purposes requires *separate, independent verification* by your treating psychiatrist *after* the stabilization period (e.g., post the 14 days or equivalent). Sever the link between the *clinical* assessment (governed by the directive) and the *financial* declaration. This inoculates against the backward reach of Reflection on motivated belief.
     *   **Wrinkle 2 (Confidence Level vs. Sustained Confidence):** **The sustained trigger (e.g., >90% for 72 hours) is philosophically and practically smarter.**
          *   **Philosophically (Reflection Angle):** A single high credence could be fleeting or fluctuate wildly. Sustained high confidence is *more consistent* with the altered state of mania persisting and resisting insight. It's less vulnerable to a momentary lapse in the pathological certainty. While still manufactured, its persistence is a stronger (though imperfect) indicator of the *ongoing* impairment the directive is designed to handle.
          *   **Practically:** It provides a buffer against transient moments of doubt or clarity that might occur even within an episode. It makes the trigger more robust and less likely to be gamed by a momentarily insightful (or deceptive) future-self. It aligns the trigger more closely with the *persistence* of the impaired judgment.

  **Conclusion & Key Takeaways for Your Directive:**

  1.  **Reflection is Not Binding:** The principle does *not* rationally compel you to adopt the credence of your future manic self. The assumptions of preserved rationality and information access are categorically violated during mania.
  2.  **Pre-Commitment is Rational:** Committing now to the 14-day admission (despite knowing future-you will object) is a coherent and rational strategy to protect your long-term well-being from a known, temporary epistemic failure.
  3.  **Defer to Your Recovered Self:** The ultimate epistemic authority you should design the directive around is "you after stabilization/medication" (e.g., after ~3 weeks). This self integrates the perspectives. The directive should ensure *this* self has the final say on whether the intervention was truly needed *after the fact*, while empowering others to act *during* the crisis.
  4.  **Use the Psychiatrist as a Proxy:** Delegating the initial assessment/trigger to your psychiatrist (+ the pre-commitment terms) is rational reliance on an external agent when internal rationality fails.
  5.  **Implement the Sustained Confidence Trigger:** Use the "confidence > X% for Y hours" threshold. It's more robust philosophically and practically.
  6.  **Isolate Financial Incentives:** Explicitly decouple any insurance-related "recovery declaration" from the clinical assessment process governed by the directive.

  Your current self, armed with the knowledge of the episodic distortion and the unreliability of the future manic self's judgment, is acting with profound diachronic rationality by creating this directive. The Reflection principle, while insightful, highlights the *gap* between ideal rationality and the reality of your condition, rather than forbidding the rational strategy of pre-commitment.
