  First, I need to parse their cases: the gala timer, fire door, window timing, seedlings, router, and exchange student. Each presents unique challenges—like distinguishing harm levels, multiple omissions, timing issues, duty vs. causation, and knowledge/ability factors. 

  The user wants numbered desiderata (D1-Dn) that cover these cases, flagging non-negotiables vs. preferences, potential conflicts, and circularity risks. They also want a quick take on three theory families and the top desideratum that rules out most theories.

  Starting with core requirements: Causation must handle omissions without collapsing into blame (D1). The gala case shows the need to track harm types (voided time vs. lost qualification) distinctly (D2). For multiple omissions like the fire door, the theory must explain why both are causes without making neither necessary (D3). Timing is critical in the window case—omissions need defined start/end points tied to duty periods (D4). 

  The seedlings case requires filtering causes by duty, not just possibility (D5), but this risks blending causation and blame. The router scenario demands respecting doing/allowing distinctions (D6), while the exchange student highlights knowledge/ability as separate from duty (D7). 

  Non-negotiables: Avoid circularity if duty is baked into causation (D8). Flagging theory conflicts is key—e.g., D3 (multiple omissions) clashes with pure difference-making theories. 

  Quick theory takes: Difference-making struggles with overdetermination (fire door). Connection theories falter on omissions' lack of physical processes. Norm-based views handle duty well but risk circularity. 

  Top desideratum? D3—resolving fire-door-style cases sinks most theories. Final answer: \answer{D3}
answer: |-
  Here are the desiderata for an account of causation by omission in disciplinary contexts, derived from your cases and requirements. Each includes the case or reasoning behind it, with non-negotiables flagged (★), conflicts noted, and key constraints.

  ---

  ### **Core Desiderata**  
  **D1: Must handle omissions as potential causes without requiring physical action**  
  *(Non-negotiable ★)*  
  *Case: Gala timer* — Her inaction (not being poolside) led to the voided result. If causation *only* tracks "something a person did," omissions are excluded by definition, making hearings incoherent.  
  *Constraint:* Account must allow that "doing nothing" can be causal when it violates an expected role.  

  **D2: Must distinguish levels of harm (proximate vs. distal outcomes)**  
  *(Non-negotiable ★)*  
  *Case: Gala* — Was the omission’s effect the unrecorded time (proximate), the lost qualifying place (distal but likely), or the squad’s season (distal and contingent)? A hearing must assign responsibility for *specific* outcomes, not infinite chains.  
  *Requirement:* The account must specify which outcome(s) the omission directly "targets."  

  **D3: Must resolve overdetermined omissions without diluting responsibility**  
  *(Critical conflict point)*  
  *Case: Fire door* — Both prefect and porter failed; either could have prevented the fire. If both omissions are full causes, neither seems "necessary," yet both are blameworthy.  
  *Requirement:* Account must explain why *each* omission is independently causal (e.g., by showing that *each* created a separate risk), not treat them as interchangeable parts of a single cause.  
  *🚩 Conflict risk:* Clashes with "but-for" necessity (D7).  

  **D4: Must define temporal boundaries for omissions**  
  *Case: Window* — The prefect’s duty ended at 10:30; the fire began at 10:20. Did her omission "occur" at 10:00 (duty start), continuously until 10:20, or only at 10:20?  
  *Requirement:* Omissions must have start/end points tied to *opportunity windows* (duty period + capacity to act). After 10:30, the prefect’s omission no longer "exists" as a causal factor.  

  **D5: Must filter causes using roles/duties, not mere possibility**  
  *(Non-negotiable ★)*  
  *Case: Seedlings* — Only the two who signed up are blamed, not 1,198 others who *could* have watered.  
  *Requirement:* Causation requires a *duty-bound opportunity* — the person must have had a *specific obligation* and a *reasonable capacity* to act.  
  *⚠️ Circularity risk:* If duties define causation, "Did she cause it?" and "Did she owe it?" merge. Mitigation: Duties frame *which omissions are relevant*, but causation still requires factual difference-making (D7).  

  **D6: Must respect doing/allowing distinction without privileging actions**  
  *Case: Router* — Student A (switches off) *does* harm; Student B (fails to restore) *allows* harm. Though externally similar, A’s act is intentional interference, B’s omission is passivity.  
  *Requirement:* The account should explain why *doing* harm often warrants stricter blame, but *allowing* via omission remains causal (e.g., B’s duty to restore created expectation).  

  **D7: Must require knowledge and ability, separate from duty**  
  *Case: Exchange student & isolated girl* — Neither knew/could act, so neither caused harm, despite "doing nothing." Duty alone is insufficient.  
  *Requirement:* Causation requires *epistemic access* (could they know their act was needed?) and *practical ability* (could they intervene?).  
  *Constraint:* Duty defines *who should have known/acted*; knowledge/ability define *whether they could*.  

  ---

  ### **Meta-Requirements**  
  **D8: Avoid collapsing causation into blame**  
  *(Non-negotiable ★)*  
  *Requirement:* Causation must be a *factual component* of blame, not identical to it. Otherwise, hearings become circular ("blameworthy only if blameworthy").  
  *Test:* In *Seedlings*, the sign-ups’ omission *caused* death *if* they had ability/knowledge (D7), but *blame* depends on intent, negligence, etc.  

  **D9: Be consistent with "difference-making" intuition**  
  *(Preference, but functional necessity)*  
  *Case: All cases* — Commonsense says "if they’d acted, harm would likely have been avoided." This "but-for" logic underpins hearings.  
  *Constraint:* If an account rejects this (e.g., some process theories), it must explain why it’s misleading.  

  **D10: Output usable "occurrence" timelines**  
  *Requirement:* For conduct codes, omissions need clear "occurrence" times (e.g., *Window* case: omission spans duty window until opportunity passes).  

  ---

  ### **Theory Snapshots**  
  - **Difference-making (but-for)**: Excels at D7/D9, fails D3 (fire door) and D4 (timing).  
  - **Connection (process)**: Struggles with D1/D3 (no physical process in omissions); strong on D6 (doing/allowing).  
  - **Norm-based (duty-first)**: Nails D5/D8, risks circularity; weak on D4/D7 (timing/knowledge).  

  ---

  ### **Key Conflicts & Trade-offs**  
  - **D3 vs. D9**: Overdetermined omissions (fire door) break "but-for" necessity. Fixing this requires adding duties (D5) or redefining necessity.  
  - **D5 vs. D8**: Building duties into causation (D5) risks circularity (D8). *Solution:* Duties identify *which omissions to assess*, then causation = factual difference-making + knowledge/ability (D7).  
  - **D4 is unsolved**: No theory cleanly defines omission timing. Best candidate: Omission "occurs" when duty + opportunity converge, "ends" when ability expires.  

  **Final Output**:  
  \answer{D3}
