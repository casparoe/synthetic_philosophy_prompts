  ### The Game
  A billionaire sponsor offers a public lottery: a fair coin is flipped until it lands heads, with the number of consecutive initial tails denoted as \(k\) (capped at \(k=15\) to ensure payability). The prize per ticket is \($10 \times 4^k\), so \(k=0\) yields \($10\), \(k=1\) yields \($40\), up to \(k=15\) yielding \($10 \times 4^{15} = \$10,995,116,277,760\) (which the sponsor, with verified reserves exceeding \($11\) trillion, can cover). Each ticket entitles the holder to the full prize amount. A player—a well-funded charity converting dollars to lifesaving vaccines at a fixed \($1\) per dose—can buy any number of tickets. However, all tickets’ prizes are determined by a single set of flips (resolved live in minutes). Buying multiple tickets multiplies the prize but exposes the player to the same outcome repeatedly, eliminating diversification.

  ### Entry Fees Under Different Rules
  - **(a) Expected money (EMV):**  
    EMV = \(\sum_{k=0}^{14} \left(\frac{1}{2}\right)^{k+1} \times 10 \times 4^k + \left(\frac{1}{2}\right)^{15} \times 10 \times 4^{15}\).  
    Term simplification: \(\left(\frac{1}{2}\right)^{k+1} \times 10 \times 4^k = 10 \times \left(\frac{1}{2}\right) \times 2^k = 5 \times 2^k\).  
    For \(k=0\) to \(14\): \(5 \times (2^0 + 2^1 + \dots + 2^{14}) = 5 \times (2^{15} - 1) = 5 \times 32,767 = 163,835\).  
    Final term (\(k=15\)): \(\left(\frac{1}{2}\right)^{15} \times 10 \times 4^{15} = 10 \times (1)^{15} = 10\).  
    EMV = \(163,835 + 10 = \$163,845\).  
    **Max fee: \$163,845**.

  - **(b) Expected utility (EU):**  
    Utility is linear in money (dollars convert to vaccines at \(1:1\)).  
    EU = EMV = \$163,845.  
    **Max fee: \$163,845**.

  - **(c) Median/typical outcome:**  
    Probability of \(k=0\) (prize = \$10) is \( \frac{1}{2} = 50\% \).  
    Median outcome = \$10.  
    **Max fee: \$10**.

  - **(d) Many-plays rule:**  
    "Many plays" fails due to the single draw: buying \(n\) tickets gives \(n\) copies of the *same* prize (no independent trials). The expected value per ticket remains \$163,845, but the *typical outcome per ticket* is unchanged.  
    Median outcome per ticket is \$10.  
    **Max fee: \$10**.

  ### Key Feature and Its Role
  - **Single public draw** forces all tickets to share the same outcome.  
  - **Effect of removal:** If each ticket had independent draws, buying many tickets would allow diversification. The many-plays rule would then align with EMV (\$163,845), closing the gap.

  ### How an EMV Proponent Waves It Away  
  An EMV proponent argues: "With linear utility, any fee \(\leq \$163,845\) has positive expected net gain. The low median is irrelevant; the rare high prizes compensate. The charity maximizes expected vaccines by paying up to EMV."

  ### Honest Assessment
  Under linear utility and no budget constraints, the charity *should* pay up to \$163,845 per ticket—**the 'no way' reaction cannot be vindicated by any rational rule respecting these conditions**.  

  ### Smallest Change to Vindicate Intuition  
  - **Introduce a budget constraint:** Suppose the charity has \$200,000 for *all* vaccines this year. Losing \$163,845 (99.8% of budget) if \(k=0\) (50% chance) would devastate operations, even if EMV is positive.  
  - **Why it works:** This mimics diminishing marginal utility. Losing a large fraction of the budget has catastrophic nonlinear effects, making the gamble unacceptable despite linear dollar-vaccine conversion.
