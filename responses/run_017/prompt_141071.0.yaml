prompt: |-
  i'm a dev, no philosophy background, and i'm writing the planner for a warehouse robot: after each action I somehow have to conclude that the other ten thousand things didn't change, without enumerating them. Before I commit to an approach (nonmonotonic logics, the causal/circumscription sort of stuff, or just hand-rolled per-action update code) I want a spec.

  Write the desiderata any solution to the frame problem should have to meet, with the concrete case behind each one. I care much more about the criteria than about scoring approaches. In particular: which of the usual demands are genuine requirements and which are just one camp's taste (staying declarative, not abandoning classical logic, one mechanism covering both derived effects and endless weird preconditions)? And flag any pair of the desiderata you think can't actually be satisfied together — if the list is itself the result, say so.

  Two of my own candidates, which I want evaluated rather than just accepted: (1) edit-locality: adding a new action to the domain shouldn't force me to go touch how existing actions record what they leave alone; (2) frame-to-payload ratio: the work spent deciding what didn't change should stay bounded relative to the work spent on what did, under a hard deadline. Is each a real desideratum, or a symptom that I've framed the problem wrong (maybe an engineering smell leaking into a conceptual spec)? And which single requirement, if you insist on it, rules out the most candidate solutions?
reasoning: |-
  We are addressing the frame problem in the context of a warehouse robot planner. The frame problem is about efficiently representing and reasoning about what does not change when an action is performed, without having to enumerate all unchanged properties for each action.

  The user is a developer without a philosophy background and wants a specification of the desiderata (requirements) that any solution to the frame problem should meet. They are particularly interested in:
  1. Which demands are genuine requirements and which are just preferences (like staying declarative, using classical logic, having one mechanism for both derived effects and preconditions).
  2. Whether any pairs of desiderata are mutually unsatisfiable.
  3. Evaluating two of their own candidate desiderata: edit-locality and frame-to-payload ratio.

  We will lay out a list of desiderata with concrete examples. We will also evaluate the two candidate desiderata and identify the single requirement that rules out the most candidate solutions.

  ## Desiderata for a Solution to the Frame Problem

  ### 1. Representational Adequacy
     - **Description**: The representation must be able to express the domain, including actions, their effects, and the persistence of properties over time.
     - **Concrete Case**: In the warehouse, if the robot moves from location A to B, we must be able to represent that the robot's location changes to B, and that other properties (e.g., the content of a shelf, the battery level if not affected) remain the same.
     - **Nature**: Genuine requirement. Without it, we cannot model the domain.

  ### 2. Inference Adequacy
     - **Description**: The system must be able to infer the state after an action, including both changed and unchanged properties, without explicit enumeration of unchanged properties.
     - **Concrete Case**: After moving the robot, we infer that the package on the shelf is still there (unless the action was to pick it up) and that the location of other robots remains the same.
     - **Nature**: Genuine requirement. The core of the frame problem.

  ### 3. Edit-Locality (User Candidate 1)
     - **Description**: Adding a new action should not require modifying the frame axioms (i.e., the rules about what remains unchanged) of existing actions.
     - **Concrete Case**: If we add a new action (e.g., "charge" that changes the battery level), we should not have to update the "move" action to specify that "move" doesn't affect the battery level (unless it does, but then it would be an effect of "move").
     - **Nature**: Genuine requirement for scalability and modularity. Without it, the system becomes unmaintainable as the domain grows. However, note that if the new action has an effect that breaks an invariant, then we might have to adjust the domain (but that is a separate issue). The key is that the frame axioms for existing actions remain untouched.

  ### 4. Frame-to-Payload Ratio (User Candidate 2)
     - **Description**: The computational cost of determining what does not change (frame) should be bounded relative to the cost of computing what does change (payload) and should be efficient enough to meet real-time constraints (hard deadlines).
     - **Concrete Case**: When the robot moves, the system spends time updating the robot's location (payload) and then must conclude that the thousands of other properties (like the positions of all packages and other robots) are unchanged. The time for the frame part should not grow linearly with the number of properties (e.g., O(1) or O(|effects|) rather than O(|all fluents|)).
     - **Nature**: Genuine requirement for real-time systems. Without it, the planner may not meet deadlines in large warehouses.

  ### 5. Modularity
     - **Description**: The representation of actions and the frame axioms should be modular, meaning that each action is described independently.
     - **Concrete Case**: The description of the "pick" action should not have to consider the effects of the "move" action, and vice versa.
     - **Nature**: Genuine requirement for maintainability and scalability.

  ### 6. Declarativity
     - **Description**: The representation should be declarative, separating the knowledge from the inference procedure.
     - **Concrete Case**: The domain description should state what each action does (effects) and what generally remains unchanged (frame) without being intertwined with the planning algorithm.
     - **Nature**: This is often a matter of taste or design philosophy. While it is desirable for knowledge engineering (easier to understand and modify), it may not be strictly necessary for an efficient implementation. However, in the context of AI planning, declarativity is highly valued because it allows the use of general-purpose solvers.

  ### 7. Compatibility with Classical Logic
     - **Description**: The solution should be expressible in classical logic (first-order or propositional) without resorting to nonmonotonic logics (like circumscription) if possible.
     - **Concrete Case**: We want to use standard reasoning tools and avoid the complexities of nonmonotonic reasoning.
     - **Nature**: This is a preference. Nonmonotonic logics (circumscription, default logic, etc.) are common in solving the frame problem, but they are more complex. In practice, many efficient planners use classical logic with a closed-world assumption or other techniques. However, classical logic alone cannot solve the frame problem without additional mechanisms (like frame axioms) which lead to the representational frame problem (having to write too many axioms). Thus, this might be a trade-off.

  ### 8. Uniformity
     - **Description**: The same mechanism should handle both the direct effects of actions and the frame axioms (what doesn't change). Also, it should handle both derived effects (indirect effects) and preconditions.
     - **Concrete Case**: We don't want one method for expressing that moving the robot changes its location and a different method for expressing that it doesn't change the battery level. Similarly, we want a uniform way to handle both the direct effects and the indirect effects (like if moving the robot causes a package to fall, which is a derived effect) and also the preconditions (like the robot must be at a location to pick a package there).
     - **Nature**: This is a strong requirement for elegance and simplicity, but it might be relaxed for efficiency. However, without it, the system becomes ad-hoc and harder to maintain.

  ### 9. Expressive Power
     - **Description**: The representation should be able to handle complex domains with conditional effects, concurrent actions, and state constraints.
     - **Concrete Case**: If the warehouse has a constraint that a package cannot be in two places at once, the system should enforce that. Also, if an action has conditional effects (e.g., if the shelf is full, then moving the robot might cause a package to fall), the system should handle it.
     - **Nature**: Genuine requirement for real-world domains.

  ### 10. Computational Tractability
     - **Description**: The inference must be computationally feasible for the domain size (e.g., thousands of properties and actions) and within the real-time constraints.
     - **Concrete Case**: The planner must generate a plan for the next hour of operation in seconds, not hours.
     - **Nature**: Genuine requirement.

  ## Evaluation of the User's Candidates

  ### (1) Edit-Locality
     - **Evaluation**: This is a genuine requirement. Without edit-locality, every time a new action is added, one must revisit every existing action to add a frame axiom stating that the new action's effects are not altered by the existing action. This is unscalable. For example, if we have 100 actions and 10,000 fluents, adding one new fluent would require adding 100 frame axioms (one per action) to state that the new fluent is unaffected by each action. This is the "representational frame problem". A good solution must avoid this.

  ### (2) Frame-to-Payload Ratio
     - **Evaluation**: This is a genuine requirement, especially for real-time systems. The frame problem is not just about representation but also about efficient inference. If the inference time for the frame grows with the number of fluents (even if the representation is compact), then in a domain with 10,000 fluents, every action would require 10,000 inferences to confirm that each fluent remains unchanged. This is the "inferential frame problem". We need the inference to be efficient (e.g., constant time or linear in the number of changes, not the entire state).

  ## Potential Conflicts

  ### Conflict 1: Declarativity vs. Computational Tractability
     - Highly declarative representations (like using pure classical logic with frame axioms) lead to inefficiency because they require reasoning about each frame axiom. Nonmonotonic logics can be more efficient in representation but may be computationally harder to reason with.

  ### Conflict 2: Uniformity vs. Edit-Locality and Frame-to-Payload Ratio
     - If we insist on a uniform mechanism for everything (effects, preconditions, frame, derived effects), we might have to use a very expressive logic which could be computationally heavy. However, some approaches (like STRIPS with the assumption of persistence) achieve edit-locality and a good frame-to-payload ratio without a fully uniform mechanism (they separate effects from frame by default).

  ### Conflict 3: Compatibility with Classical Logic vs. Edit-Locality
     - Classical logic alone requires explicit frame axioms. This breaks edit-locality because adding a new fluent requires updating every action with a frame axiom for that fluent. Therefore, to have edit-locality, we must go beyond classical logic (e.g., use a nonmonotonic approach or a different representation like STRIPS).

  ## Which Single Requirement Rules Out the Most Candidate Solutions?

  The requirement of **Edit-Locality** rules out the most candidate solutions. Why? Because the naive approach in classical logic is to write frame axioms explicitly. This approach fails edit-locality because adding a new fluent requires updating every action. Many early solutions to the frame problem did not have edit-locality. Even some nonmonotonic approaches might require careful design to achieve it. Therefore, insisting on edit-locality forces the solution to use a compact representation (like STRIPS or successor state axioms) or a nonmonotonic formalism that inherently avoids explicit frame axioms per fluent per action.

  ## Conclusion

  The desiderata are:

  1. Representational Adequacy (requirement)
  2. Inference Adequacy (requirement)
  3. Edit-Locality (requirement)
  4. Frame-to-Payload Ratio (requirement)
  5. Modularity (requirement)
  6. Declarativity (preference, but highly desirable)
  7. Compatibility with Classical Logic (preference, often sacrificed)
  8. Uniformity (strongly desired, but may be relaxed for efficiency)
  9. Expressive Power (requirement for complex domains)
  10. Computational Tractability (requirement)

  The two user candidates (edit-locality and frame-to-payload ratio) are genuine requirements. 

  The most critical requirement that rules out many solutions is **Edit-Locality**. It forces the solution to avoid explicit frame axioms for each fluent and action, pushing towards more advanced representations.

  In practice, the STRIPS representation (with the assumption that what is not mentioned in the effects remains unchanged) achieves edit-locality and a good frame-to-payload ratio (if implemented with a state representation that only updates the changed fluents). However, STRIPS does not handle derived effects (state constraints) uniformly. For that, one might need extensions (like ADL or PDDL with conditional effects and state constraints) or other approaches (like fluent calculus or event calculus). 

  For the warehouse robot, a STRIPS-like approach might be sufficient, but if there are many state constraints (derived effects), then a more expressive representation might be needed. The key is to ensure that the solution meets the edit-locality and frame-to-payload ratio requirements.

  Given the hard deadline constraint, the frame-to-payload ratio is critical. Therefore, the state update must be O(|effects|) and not O(|all fluents|). This is achievable by only storing the changes (and then using a way to infer the rest by persistence) but note that querying an unchanged fluent would require traversing the entire history of changes if we use a "state-diff" approach. Alternatively, we can maintain a current state as a data structure (like a hash map) that is updated only for the changed fluents. Then, the frame inference is implicit in the state: unchanged fluents are just read from the current state. This meets the frame-to-payload ratio because updating the state is O(|effects|).

  Therefore, a practical approach for the warehouse robot might be:
  - Represent the state as a key-value store (fluent -> value).
  - Each action specifies which fluents it changes (and their new values, which might be computed by the action's effects).
  - After the action, update only those fluents in the state.
  - The frame is handled by the fact that the state persists for all other fluents.

  This approach is not purely declarative (it's procedural) but meets edit-locality and frame-to-payload ratio. It is the standard way in many practical planners.

  However, if the user wants a declarative approach, they might use a logic-based planner with a STRIPS-like representation and a solver that uses state variables and updates only the changed variables. This also meets the requirements.

  In summary, the desiderata list is the result. The two candidates are requirements, and edit-locality is the most discriminating requirement.
answer: |-
  ### Desiderata for Solving the Frame Problem in Your Warehouse Robot Planner  
  Below is a **spec-oriented breakdown** of requirements, categorized by *genuine necessity* vs. *taste/preference*, with concrete warehouse examples. I'll flag conflicts and evaluate your candidates.  

  ---

  #### **Core Requirements (Non-Negotiable)**  
  1. **State Inference Correctness**  
     - **Description**: After an action, the planner must correctly infer all *unchanged* properties without manual enumeration.  
     - **Concrete Case**: If the robot moves from `Aisle1` to `Aisle2`, it must know:  
       - `Box17` remains on `Shelf4` (unchanged).  
       - `Robot2`'s battery level persists.  
     - **Why Genuine**: Without this, the planner is fundamentally broken.  

  2. **Edit-Locality** (Your Candidate #1)  
     - **Description**: Adding a new action (e.g., `charge_battery`) should *not* require modifying frame axioms of existing actions (e.g., `move_robot`).  
     - **Concrete Case**: Adding `defrag_memory` action shouldn’t force you to update `pick_item` to specify "memory remains unchanged."  
     - **Why Genuine**: Scalability. With 100+ actions, modifying every existing action for each new fluent is untenable.  
     - **Engineering Smell?**: No. This is a hard requirement for modular design.  

  3. **Frame-to-Payload Ratio** (Your Candidate #2)  
     - **Description**: Computational cost of inferring "no change" must be **O(effects)** not **O(all_fluents)**. Must handle 10k fluents in hard-realtime.  
     - **Concrete Case**: When `move_robot` updates 1 fluent (robot location), deciding what didn’t change must not iterate over all 10k fluents.  
     - **Why Genuine**: Real-world viability. A solution that scales linearly with fluents fails in warehouses.  
     - **Engineering Smell?**: No. Deadlines make this existential.  

  4. **Effect Compositionality**  
     - **Description**: Effects of concurrent/composite actions (e.g., `move_while_scanning`) must be inferred from sub-actions.  
     - **Concrete Case**: If `move_robot` changes location and `scan_barcode` changes camera state, combining them shouldn’t break frame inference.  
     - **Why Genuine**: Realistic domains require action sequencing.  

  5. **Support for State Constraints**  
     - **Description**: Global invariants (e.g., "no two items share a location") must be preserved automatically.  
     - **Concrete Case**: After placing `Box5` at `LocationX`, the system knows `LocationX` is now occupied without explicit per-action rules.  
     - **Why Genuine**: Avoids manual encoding for every action.  

  ---

  #### **Preferences (One Camp’s Taste)**  
  6. **Declarative Purity**  
     - **Description**: Represent everything in logic (e.g., "Frame axioms are first-class citizens").  
     - **Concrete Case**: Using predicate logic to say:  
       `∀fluent ¬mentioned_in(effects) → persists(fluent)`.  
     - **Taste, Not Requirement**: While elegant, procedural approaches (e.g., state diffs) often win in industry.  

  7. **Classical Logic Compatibility**  
     - **Description**: Avoid nonmonotonic logics (circumscription, default logic).  
     - **Concrete Case**: Preferring STRIPS-style "effects lists" over circumscription’s minimization.  
     - **Taste, Not Requirement**: Classical logic struggles with inertia; nonmonotonic logics handle it naturally but add complexity.  

  8. **Single Mechanism for Preconditions/Effects**  
     - **Description**: Use one formalism for action preconditions, effects, *and* frame axioms.  
     - **Concrete Case**: Representing "robot must be charged to move" (precondition) and "battery unchanged after move" (frame) with the same tool.  
     - **Taste, Not Requirement**: Separation (e.g., preconditions vs. effects) often simplifies implementations.  

  ---

  #### **Conflicting Desiderata**  
  - **Edit-Locality vs. Classical Logic Compatibility**:  
    Classical logic requires explicit frame axioms per fluent per action (e.g., "`move_robot` doesn’t change battery"). Adding a new fluent breaks edit-locality.  
    **Resolution**: Sacrifice classical logic. Use successor state axioms (Reiter) or STRIPS.  

  - **Frame-to-Payload Ratio vs. Declarative Purity**:  
    Declarative methods (e.g., SAT solvers) often infer frames by checking all fluents. This violates O(effects) cost.  
    **Resolution**: Prefer state-diffing (e.g., copy-on-write) for realtime.  

  ---

  #### **Which Requirement Rules Out the Most Solutions?**  
  **Edit-locality** is the killer. It eliminates:  
  - Naive frame axioms (classical logic), where adding a new fluent requires updating *every action*.  
  - Some causal theories requiring global effect propagation.  
  - Approaches where frame axioms are manually attached to actions.  

  ---

  ### Final Recommendations  
  1. **Adopt STRIPS/PDDL with "ignore unchanged fluents" semantics**:  
     - Effects lists define *only* changes. Frame is automatic: "If not in effects, preserve."  
     - Satisfies edit-locality (new actions define only their effects) and O(effects) runtime (only listed fluents are updated).  
     - Example: `move_robot(loc)` effects: `{robot_location=loc}`. Battery unchanged implicitly.  

  2. **Use Successor State Axioms (Reiter) for complex domains**:  
     - For each fluent `F`, define:  
       `F(t+1) ⇔ action_causes_F ∨ (F(t) ∧ ¬action_terminates_F)`.  
     - Edit-local (add new axioms for new fluents) and declarative.  
     - Avoid if worried about inference cost (can be O(fluents)).  

  3. **Hand-Rolled State Representation (For Real-Time)**:  
     - Store state as a hash map. Actions return a `{changed_fluents: new_value}` diff.  
     - Merge diffs; unchanged fluents are never touched. **O(effects)** update.  
     - Sacrifices declarativity but meets edit-locality and frame-to-payload.  

  ### Bottom Line  
  Your candidates (**edit-locality** and **frame-to-payload ratio**) are **hard requirements** for industry-grade systems. Prioritize them over declarativity or logic purity. STRIPS with state-diffing is likely your fastest path. If derived effects are needed (e.g., "moving spills coffee"), extend with causal graphs—but avoid universal quantification over all fluents.
