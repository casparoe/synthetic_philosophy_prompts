prompt: |-
  I'm an assistant collections officer at a mid-sized city museum in the north of England and I've been drafted onto our "collections ethics" working group, which mostly means sitting in meetings where we try to write down a policy for what we give back and what we keep. Everyone argues about the huge national cases, but I keep feeling our own little policy has reasoned its way into a position nobody ever stated out loud. Here's roughly what we do: human remains — ancestral remains, hair samples, plaster life-casts, that sort of thing — go back basically on request, no proof needed about how we got them, and we don't ask what the recipients intend to do with them. Objects taken during a punitive military expedition are "returnable", but only to a recognised national government or its national museum, only if we're satisfied about storage and climate control, and preferably with a rotating-loan or long-term-partnership deal so the thing spends part of its life back here. Objects bought in good faith at auction in the 1920s-50s from colonial officers' estates — sometimes the same kind of object, sometimes from the same expedition — are not returnable at all; for those we offer a high-res 3D scan, a co-curated display and a very honest label. Anything where the maker seems to have sold the object to a European trader for money we treat as an ordinary market transaction and don't discuss. And the group has just floated a fifth idea: a "custodianship rating" — if we judge the requesting country's national museum can't care for the object properly, we hold it "on their behalf" indefinitely, which is quietly how we justify keeping nearly everything.

  What confuses me is the shape of the thing. We hand back a person but not a bronze. We hand back the looted one but not the purchased twin of the looted one. We'll deal with a state but not with the descendants of the court the object was taken from, even when they're the ones asking and the state's own claim looks shaky. And holding something "on behalf of" the very people who are asking for it back seems to dissolve into just keeping it. One colleague says we're secretly committed to the view that the wrong was in the violence of the taking and nowhere else; another says we're committed to thinking culture belongs to a nation rather than a people; a third says we just think we're better at looking after objects than anybody else, and the rest is decoration.

  So: what does a policy shaped like this actually presuppose — about ownership and whether the claim is to title or to custody or to the story or to the ancestors; about who can hold a claim at all and why a state rather than a community or a lineage; about whether the wrong is located in the original transfer, in the violence, or in the ongoing holding; and about whether a good-faith purchase or a willing seller could make a removal legitimate? Which of those commitments does the practice strictly require and which is it merely comfortable with? Where do its parts pull against each other — especially the "on their behalf" clause against the state-only rule, and the remains rule against the objects rule? And if I wanted to take the rival view seriously for a change — say, that what's at issue is the living relationship between a community and its things rather than property at all — which parts of the policy would have to change and which could stay exactly as they are?
reasoning: |-
  Okay, let me start by unpacking the user's situation. They're a collections officer at a museum in northern England, part of a working group on collections ethics. The group has a de facto policy that seems inconsistent when you look at the different categories: human remains are returned easily, looted objects only to states with conditions, purchased objects not at all, and this new "custodianship rating" that effectively justifies keeping items. The user is confused about the underlying principles and wants to understand the presuppositions behind this policy.

  First, I need to break down each element of their current policy. The human remains policy suggests a recognition of inherent rights of communities to their ancestors, prioritizing human dignity over institutional control. But why then are objects treated differently? The punitive expedition items are returnable only to recognized governments, which implies that the wrong was in the violent taking, not the ongoing possession. But the purchased items from the same era aren't returnable, which contradicts that if the violence was the issue, both were likely acquired under colonial coercion.

  The purchased objects from colonial officers' estates being non-returnable is tricky. The museum might be relying on legal ownership through purchase, ignoring the context of how those officers acquired the items. Offering 3D scans and co-curation instead of restitution suggests that the museum values access and narrative control over physical return. This seems like a way to avoid addressing the legitimacy of the original acquisition.

  The custodianship rating is particularly problematic. Claiming to hold items "on behalf" of the source community while setting conditions they can't meet perpetuates colonial power dynamics. It assumes the museum's standards are superior and non-negotiable, which undermines the sovereignty of other nations or communities.

  The user’s colleagues have different interpretations: one sees the wrong in the violence of taking, another in the nation-state framework, and a third in paternalistic preservation. Each touches on aspects, but the policy as a whole seems inconsistent. For example, returning human remains without question but not cultural objects implies a split between body and artifact, which might not align with source communities' views.

  The tension between the state-only rule and the custodianship clause is stark. Requiring return only to states ignores non-state groups with legitimate claims, and then using preservation standards to refuse return creates a catch-22. Also, the remains policy's flexibility versus objects' strictness highlights a moral hierarchy that might not be justified.

  If adopting a relational view—focusing on community relationships rather than property—several changes would be needed. Human remains policy could stay, but expand to certain sacred objects. Restitution should include communities, not just states. Purchased items need provenance research to uncover coercion. The custodianship model must shift to collaborative stewardship, respecting community autonomy. The "good faith" purchase defense needs scrutiny, acknowledging colonial power imbalances.

  Underlying all this is the museum's unstated commitment to maintaining control while appearing ethical. The policy's inconsistencies reveal a preference for solutions that minimize loss of collection. To truly align with a relational approach, the museum must cede authority, involve communities in decision-making, and prioritize their connections to cultural heritage over institutional priorities.
answer: |-
  This policy isn't just inconsistent; it's a carefully constructed edifice built on unspoken, often contradictory, philosophical foundations. Let's dissect its presuppositions, tensions, and how a rival "living relationship" view would force radical change.

  **Deconstructing the Policy's Presuppositions:**

  1.  **Ontological Hierarchy:** Human remains are fundamentally different (sacred, personal, *human*) from objects. The wrong involved is primarily one of *desecration* and dignity, demanding unconditional return to *any* claimant representing lineage or community. Objects are property/culture, subject to different rules.
  2.  **The Primacy of the Original Sin (Violence):** The core wrong for objects is located explicitly in the *initial act of violent taking* (punitive expeditions). A later "good faith" purchase, even from the looters' estates, cleanses the title. The *ongoing possession* after a "clean" purchase isn't inherently wrongful.
  3.  **The Nation-State as the Sole Legitimate Heir & Guardian:**
      *   **Claimant:** Only modern nation-states (or their designated national museums) can legitimately claim objects taken from predecessors (kingdoms, communities) within their current borders. Communities, lineages, or descendant groups lack standing. This presupposes the state *is* the legitimate inheritor and representative of *all* pre-colonial cultural heritage within its territory.
      *   **Custodian:** The state (via its national museum) is also assumed to be the only entity capable of proper custodianship. The policy actively distrusts non-state groups' ability to care for objects.
  4.  **Museums as Ultimate Arbiters of Value & Care:**
      *   **"Proper Care":** The museum defines the objective standard of "proper care" (storage, climate control), positioning itself as the expert judge. This standard is often Western-centric and resource-intensive.
      *   **"Custodianship Rating":** This formalizes paternalism. The museum assumes permanent responsibility based on its own assessment, transforming refusal into a purported *service* ("holding on their behalf"). This presupposes the museum's stewardship is inherently superior and non-negotiable.
  5.  **Market Transactions Legitimize:** A transaction involving money, even between vastly unequal parties in a colonial context (maker/trader), is presumed legitimate and creates clean title. The power imbalance, potential coercion, or misunderstanding inherent in many such transactions is erased.
  6.  **Narrative as Compensation:** For non-returnable objects (purchased ones), offering co-curation and "honest labels" presupposes that *telling the story* of the acquisition ethically mitigates the ongoing possession. Control over the narrative partially substitutes for control over the object.

  **Strict Commitments vs. Comfortable Assumptions:**

  *   **Strictly Required:** The primacy of the violent taking as the defining wrong for objects; the exclusive legitimacy of the nation-state as claimant/custodian for objects; the museum's ultimate authority to define and judge "proper care"; the fundamental difference between human remains and objects.
  *   **Merely Comfortable With:** The absolute cleansing power of a later purchase; the absolute legitimacy of colonial-era market transactions; the adequacy of narrative as compensation; the idea that "holding on behalf" is anything other than indefinite retention. These are convenient justifications that make the stricter commitments less uncomfortable but aren't logically essential to the core shape.

  **Internal Tensions & Contradictions:**

  1.  **"On Their Behalf" vs. State-Only Rule:** This is the most glaring contradiction.
      *   If only the *state* is the legitimate claimant, then "holding on behalf" of *that state* makes superficial sense. But if the state *itself* requests return, the museum overrules the state's judgment about its *own* capacity, exposing the paternalism. It reveals the policy's core belief: the museum knows better than the legitimate owner about what's best for the object. The state-only rule exists only until the state disagrees with the museum's assessment.
  2.  **Remains Rule vs. Objects Rule:**
      *   **Claimant:** Remains go back to *communities/lineages* on request, no questions asked. Objects *must* go to the *state*. Why is the state the only legitimate heir for a looted bronze but irrelevant for an ancestor's remains? This presupposes an unexamined division: bodies belong to kin/community; culture belongs to the state.
      *   **Proof/Scrutiny:** Remains require no proof of acquisition or plans. Objects, even looted ones, require proof (state legitimacy) and scrutiny (storage standards). This suggests a far deeper moral imperative for remains but also a discomforting willingness to question the competence/legitimacy of object claimants in a way never applied to human remains claimants.
      *   **"Good Faith" Purchase:** A purchased *object* is untouchable. A purchased *ancestral lock of hair* would presumably still be returned immediately. The "good faith" defense only applies to the category deemed less morally charged (objects).
  3.  **Violence as Original Sin vs. Paternalism as Perpetual Right:** The policy condemns the *initial violence* of the punitive expedition but then asserts a perpetual right (via "custodianship rating") to retain control based on the museum's *ongoing* judgment. The wrong of violent taking is acknowledged, but the museum grants itself the power derived from that wrong (superior custodianship) in perpetuity.

  **Adopting the "Living Relationship" View: What Changes?**

  This rival view sees cultural heritage not as property but as vital to the identity, continuity, spiritual life, and self-determination of *specific living communities*. The wrong is the *severing* of that relationship and the *ongoing denial* of its restoration, regardless of original circumstances. The goal is restoring the *relationship*, not just transferring title.

  *   **Changes Required:**
      1.  **Human Remains Policy (Expanded):** This becomes the *model*, not the exception. It would extend to culturally specific sacred objects, ritual items, or objects of profound communal significance (e.g., certain regalia, ceremonial objects, foundational artifacts), regardless of acquisition method. Community/lineage claim is primary.
      2.  **Claimant Legitimacy:** Claims from descendant communities, lineages, or traditional authorities *must* be considered on equal footing (or prioritized over) nation-state claims. Proof would focus on demonstrating the *ongoing cultural significance and relationship* to the claimant group, not just political jurisdiction.
      3.  **End "Good Faith" Purchase Shield:** Provenance research must actively investigate the circumstances of *all* acquisitions, especially from colonial actors. Evidence of duress, unequal bargaining, misrepresentation, or acquisition during conflict/instability would make an object potentially returnable, regardless of the museum's later purchase. The focus shifts from the museum's innocence to the legitimacy of the original transfer from the community.
      4.  **Dismantle Paternalistic Custodianship ("Custodianship Rating"):**
          *   **Collaborative Stewardship:** Instead of judging, the museum *collaborates* with claimant communities *before* any decision on return. Jointly assess needs, risks, and possibilities. Can the museum provide resources (training, funding, conservation support) to *enable* return? Can a shared custodianship model be designed?
          *   **Community Standards:** Accept that "proper care" might be defined differently by the community (e.g., use in ceremonies, different environmental conditions). The museum's standards are not universal.
          *   **No Permanent Veto:** "Holding on behalf" is only a temporary, transitional measure with a clear, agreed plan and timeline for building capacity *towards* return or shared stewardship. The default shifts towards facilitating return.
      5.  **Re-evaluate "Narrative as Compensation":** Co-curation and honest labels remain valuable *if* the community chooses to leave an object on loan or participates willingly. But they are *not* an *alternative* to return for objects where the living relationship is central and restoration is desired. The narrative must be controlled by the community, not just co-created.

  *   **What Could Stay (Modified):**
      *   **Focus on Preservation (Modified):** A genuine concern for the object's physical survival remains valid, but it must be addressed *collaboratively* as a shared challenge to overcome, not a unilateral veto. Solutions are sought *with* the community.
      *   **Long-Term Partnerships/Loans:** These become attractive options *when mutually agreed upon* by the community and the museum, fostering ongoing connection and exchange, not a condition for return.
      *   **Dealing with States:** States remain important partners, especially for coordination, but not the *exclusive* or necessarily primary claimants where distinct communities with stronger cultural ties exist.

  **Conclusion:**

  Your current policy presupposes a world where wrongs are historical and contained (violence of taking), legitimacy flows solely through modern states, museums are the pinnacle of objective custodianship, and market transactions cleanse all sins. Its tensions reveal a deep-seated paternalism and a commitment to minimizing loss of collection control.

  The "living relationship" view fundamentally challenges this. It demands centering the *ongoing harm* of separation and the *agency* of descendant communities. It requires dismantling the museum's self-appointed role as supreme arbiter and embracing collaboration, flexibility, and a willingness to relinquish control to heal severed connections. Changing course wouldn't mean abandoning care for objects; it would mean redefining care to include the vitality of the object within its community of origin.
