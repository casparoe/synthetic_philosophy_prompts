     - In step 2, "aligned interests" might be hard to judge (e.g., in the toad call, if body size is the only thing being signaled and females prefer larger males, and larger males are better, then interests might be aligned? But we didn't go there because we classified it as an index. In our tree, we went to step 4 after step 3 and step 2, and step 4 captured it).

