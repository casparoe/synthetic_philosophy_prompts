  We are building a flowchart quiz that leads from concrete scenarios to ethical positions regarding the trade-off between pain and pleasure. The distinctions we must cover are:

  1. Whether pain and pleasure are on one scale with a "cliff" (a point beyond which pain cannot be compensated by pleasure) or are fundamentally different kinds of things.
  2. Whether the "cliff" (if it exists) is about the worst moment of an experience or the total suffering over a life.
  3. Whether the cliff is one-directional (only for extreme pain) or also exists for extreme pleasure (so that a peak of bliss might outweigh any amount of mild suffering).
  4. Whether we can aggregate tiny pleasures across many people to overcome the cliff for one person's extreme pain, or whether the cliff is per person and aggregation doesn't help.
  5. Whether it matters if the pleasures go to existing people versus creating new people (who otherwise wouldn't exist).

  The named positions we want to cover:

  - Total Utilitarianism: The view that we should maximize the sum of well-being, where well-being is a single scale that includes both pleasure and pain. No cliff: any amount of pain can be compensated by enough pleasure (either for the same person or across people).
  - Prioritarianism: We should give priority to the worse off. This might involve a "cliff" in the sense that we are especially concerned about those in extreme pain, but it doesn't necessarily mean that no amount of pleasure can compensate. However, in the context of our quiz, we might interpret prioritarianism as having a threshold of suffering that is particularly bad and should be alleviated even at the cost of greater gains for the better off. But note: prioritarianism is usually about weighting, not a strict cliff. We might need to adjust.
  - Negative Utilitarianism: The view that we should minimize suffering (pain) and that pleasure is of little or no importance. This often comes in two forms:
     a) Strict: Any amount of suffering, no matter how small, cannot be outweighed by any amount of pleasure. (But note: this would imply we should end the world to avoid even a pinprick, which is extreme and not always held.)
     b) With a lexical threshold: Only suffering above a certain threshold is lexically bad (cannot be compensated by pleasure), but below that threshold, trade-offs are allowed.

  - Threshold View: Mild pleasant and unpleasant experiences trade off normally, but beyond a certain intensity of suffering (or perhaps also of pleasure), trade-offs stop. This view might also include a threshold for extreme pleasure that cannot be outweighed by any amount of mild suffering.

  We also need to consider:

  - Per-person vs. aggregation across persons: Can the suffering of one person be compensated by the pleasures of many?

