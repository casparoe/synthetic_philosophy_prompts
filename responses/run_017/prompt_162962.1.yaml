prompt: |-
  Hey — I'm an infra engineer and somehow ended up on our internal "should we keep funding this" review rota because the guy who normally does it left for a competitor in March. I've been going through old notes trying to reverse-engineer how Priya (staff eng, been here nine years, she's the one who actually makes these calls) decides, because I have to present one of these myself next Thursday and I'd really like to not look like an idiot in front of her.

  Here's her track record as best I can reconstruct it, in my own words. The recommendation-ranking team kept missing its quarterly metric, and every miss was explained after the fact by another special case — Spanish retailers format prices differently, then it was a timezone thing, then it was a promotion-flag thing; six of them, each one did actually fix the reported problem — and she killed it at the sixth. The anomaly-detection team was in the same boat, but the fix they wrote for their miss also caught, and they said in advance that it would catch, a whole class of failures in a logging system nobody had pointed them at; she not only kept funding, she called it the strongest case she'd seen all year. The forecasting team explained a known miss by adding a component that also implied something about a metric nobody had ever looked at, they went and checked, and it was right; kept funding. The compression team explained their one big miss with a switch that only turns on for that one data source, nothing else could ever test it, and she killed it even though the numbers then worked out. The search-ranking team wrote about a dozen patches over two years, each of them independently testable and each of them passing, but they never once predicted anything they hadn't already seen — they explained everything they were given and anticipated nothing — and she killed that one too, which I found harsh until I noticed the pattern. The scheduling-optimizer team was obviously in the same explain-every-miss mode, but she kept funding them anyway, and her line was that you don't pull a project because it's tired, you pull it because something better showed up; at that point the replacement was still a slide deck. And the one time a team threw out its whole approach and restarted under the same name, everyone agreed it was effectively a different project, so her ruling there doesn't tell me much.

  The case I have to present: capacity-demand forecasting. For roughly eighteen months it's been in explain-every-miss mode, and every one of those fixes was the ugly kind — a one-source-only adjustment you can't test anywhere else. Three months ago they added a component that predicted, before anyone checked, a pattern in a different product line's data that this team had never touched, and it was right. Two wrinkles: that component was lifted more or less wholesale out of the model the rival team (the one she likes) has been building — so the novel prediction may not really be "theirs" — and in the same release they quietly dropped a load-bearing assumption of the original design, that demand is seasonal around a stable baseline, in favor of demand being driven by a feedback loop between inventory and ordering, while keeping the team, the pipeline, the patches and the name. There is now a young rival internally that has made two clean predictions, one of them novel, but it's three people and a notebook.

  What I want from you: the rule Priya is actually running, stated tightly enough that I can apply it to a new case without her in the room. My own guess is something like a project is healthy when its fixes keep predicting things nobody asked it to predict and sick when the fixes only ever explain what already went wrong — but I want to know what other rules fit all seven of her past calls just as well and disagree about mine, since that's where I'll get torn apart. Specifically: does one genuine novel prediction wipe out eighteen months of one-off patches, or does the long-run trend govern, or does the dropped assumption mean the record is void and they get scored as new? Does importing the rival's mechanism count as their novelty or as evidence they've stopped being a project of their own? Which of those rules would you bet she's running, and is there one specific fact I should go dig up before Thursday that would separate them? And honestly, if you were me, what would you actually argue in the meeting — keep funding, or kill it?
reasoning: |-
  Okay, the user is an infrastructure engineer who got roped into a funding review. They need to present a case on a capacity-demand forecasting team and want to understand Priya's decision rule based on past examples. They've reconstructed seven cases and noticed a pattern: projects that predict novel issues get funded, while those only explaining past failures get killed. 

  Hmm, the user's own guess aligns with prediction vs. explanation, but they're worried about edge cases in their current project. The team has 18 months of one-off fixes but recently made a novel prediction... which was actually borrowed from a rival team. Plus, they fundamentally changed their model's core assumption. 

  Let me mentally walk through Priya's pattern again. The key seems to be whether the project generates new knowledge. That compression team? Killed because their fix was untestable elsewhere. But the anomaly-detection team? Funded because their fix proactively addressed unseen issues. Interesting how she valued the scheduling team despite fatigue - shows she cares about replacement viability. 

  For this case... tricky. The borrowed prediction feels like cheating, but the architectural pivot might reset the clock. Wait - did they properly credit the rival team? That could decide whether it's "learning" or "plagiarism." Also, has the new feedback-loop approach produced any original insights yet? That'd be crucial. 

  If I were presenting... I'd lean toward killing it. The 18-month odor of one-off patches is strong, and the "novelty" smells borrowed. But I'd stress the architectural change as a mitigating factor. Honestly though - three people with a notebook making clean predictions? That's exactly what Priya tends to reward.
answer: |-
  Based on Priya's pattern, her core rule appears to be: **A project deserves continued funding if it demonstrates *emergent understanding*—its solutions consistently reveal *new* insights about the system, not just retrofit explanations for past failures.** Here's the breakdown:

  ### The Rule Decoded:
  1. **Healthy (Keep Funding):**  
     - Fixes/predictions **proactively uncover unanticipated patterns** (e.g., anomaly team catching unrelated logging issues).  
     - Solutions **generalize beyond the immediate problem** (e.g., forecasting team predicting a new metric).  
     - *Even "tired" projects survive if no better alternative exists* (scheduling team).  

  2. **Sick (Kill Funding):**  
     - Fixes **only address known failures** with one-off, untestable patches (e.g., compression team’s single-source switch).  
     - Work **lacks predictive power or novel insight** (e.g., search-ranking team’s reactive patches).  

  ### Testing Competing Interpretations:
  Your "novel prediction vs. retrofitting" model fits *most* cases, but these alternatives also align with Priya’s history:  
  - **Alternative 1: "Knowledge Debt" Rule**  
    *Projects die when accumulated one-off fixes make the system too brittle to generalize.*  
    **Fits all kills**: Compression (untestable hack), search-ranking (no generalization), recommendation (six stacked special cases).  
    **Fits all keeps**: Anomaly/foresight teams generalized; scheduling had no alternative.  
    **Disagrees with your case?** The 18 months of one-off patches are textbook knowledge debt—but the rival’s borrowed component *might* reset this if it’s foundational.  

  - **Alternative 2: "Ownership of Insight" Rule**  
    *Projects thrive only if their core team generates original understanding.*  
    **Fits kills**: Search-ranking never innovated; compression’s fix was trivial.  
    **Fits keeps**: Anomaly team owned their discovery; forecasting team validated their *own* hypothesis.  
    **Disagrees with your case?** Importing the rival’s component suggests they didn’t generate the insight—it’s not "theirs."  

  ### Your Case: Capacity-Demand Forecasting
  | **Factor**               | **Evidence**                                                                 | **Verdict by Priya’s Pattern**                     |  
  |--------------------------|-----------------------------------------------------------------------------|---------------------------------------------------|  
  | **18-month trend**       | All fixes were one-off, untestable patches                                  | *Strong sick signal* (like compression/search)    |  
  | **Novel prediction**     | Predicted new product-line pattern—but lifted from rivals                   | *Weak healthy signal* (insight not owned)         |  
  | **Architecture pivot**   | Dropped stable-baseline assumption for feedback-loop model                  | *Ambiguous* (could reset the clock or signal chaos)|  
  | **Rival team**           | Small but making clean, novel predictions                                   | *Healthy signal for rival* (like anomaly team)    |  

  ### Critical Unknowns (Dig Before Thursday!):
  1. **Did the team *acknowledge* borrowing the component?**  
     If they hid it, Priya will see it as theft (kills trust). If they cited it openly, it *might* show learning (but not ownership).  
  2. **Has their *new feedback-loop model* generated *any* novel predictions *since the pivot*?**  
     If yes, it suggests emergent understanding. If no, the pivot is just reactive chaos.  
  3. **Is the rival team’s approach *scalable*?**  
     Priya spared the scheduling team because the replacement was "a slide deck." If the rival is just "3 people and a notebook," she may delay killing until the rival matures.  

  ### What to Argue (Kill It, But Strategically):
  **Recommendation: Kill funding.**  
  - **Why:**  
    - 18 months of one-off patches show chronic failure to generalize (like the killed recommendation/search teams).  
    - Their only "novel" prediction was imported, not earned—proving they lack emergent understanding.  
    - The architectural pivot feels desperate, not visionary (cf. the "whole approach restart" case she dismissed).  

  **How to Pitch It to Priya:**  
  > *"This project has consistently treated symptoms, not systems—18 months of one-off patches prove it can’t generate fundamental insights. Even their ‘novel’ prediction was borrowed from the rival team, confirming they’re reactive, not predictive. The pivot to a feedback loop is a tacit admission their core model failed, but they’ve produced no new insights since. Meanwhile, the rival team—despite being small—has repeatedly demonstrated the emergent understanding this project lacks. Let’s reallocate resources to accelerate the approach that’s actually working."*

  **Cover Your Flanks:**  
  - If Priya values the pivot, argue: *"If the architectural change is truly a reset, let them prove it as a new project—with a new name, metrics, and probationary runway."*  
  - If she hesitates to kill without a mature rival, propose: *"Freeze further feature work; make them run head-to-head against the rival on *next quarter’s* forecasts."*  

  **Bottom Line:** Priya rewards **originality of insight**. This team hasn’t generated any—they’ve outsourced it. Bet on the rival.
