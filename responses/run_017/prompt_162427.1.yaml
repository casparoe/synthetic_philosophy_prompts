answer: |-
  Below is a moral luck diagnostic designed as a decision tree with concrete cases. It uses 7 questions (each with 2–3 options) to sort participants into 6 distinct positions, including the ones you requested. The tree avoids abstract terminology and focuses on intuitive judgments about cases. Positions are labeled with common names where applicable and marked "unnamed" for less standard views.  

  ### **Decision Tree: Moral Luck Diagnostic**

  **Question 1: Drunk Drivers**  
  Two people drive home drunk. They have the same blood alcohol level, drive equally recklessly, and run the same stop sign. One hits and kills a child; the other hits nothing. Is the driver who killed the child more blameworthy?  
  - **A:** Yes, they are more blameworthy.  
  - **B:** No, both are equally blameworthy.  

  **Question 2: Failed Killers (Gun Jam vs. Bird)**  
  Two people try to shoot and kill someone.  
  - *Killer 1:* Their gun jams, so they fail.  
  - *Killer 2:* Their gun fires, but a bird flies into the bullet, saving the victim.  
  Is Killer 1 less blameworthy than Killer 2?  
  - **A:** Yes, Killer 1 is less blameworthy (the gun jam makes their attempt less "complete").  
  - **B:** No, both are equally blameworthy.  
  - **C:** Killer 2 is less blameworthy (the bird intervention was flukier).  

  **Question 3: Artist’s Gamble**  
  Someone abandons their family to pursue art in another country.  
  - In one outcome, they become a great painter.  
  - In the other, they fail and produce nothing of value.  
  Is the successful artist less blameworthy for abandoning their family?  
  - **A:** Yes, because their success justifies the choice.  
  - **B:** No, they are equally blameworthy.  
  - **C:** No, the successful artist is *more* blameworthy (their choice was "selfish," and success adds hypocrisy).  

  **Question 4: Loaded Gun**  
  A person leaves a loaded gun where a child can easily reach it.  
  - In one outcome, the child shoots someone.  
  - In the other, the child never touches it.  
  Is the person more blameworthy when the child shoots someone?  
  - **A:** Yes.  
  - **B:** No, equally blameworthy.  

  **Question 5: Secret Wrongdoing**  
  Someone steals life-saving money from a charity. No one ever discovers the theft, and the thief isn’t punished. Does the thief deserve less blame because no one found out?  
  - **A:** Yes, they deserve less blame.  
  - **B:** No, they deserve the same blame.  

  **Question 6: Remorse-Incapable Person**  
  A person was raised in extreme neglect, leaving them incapable of feeling guilt or remorse. They deliberately steal from a vulnerable person. Are they blameworthy?  
  - **A:** Yes, fully blameworthy.  
  - **B:** No, not blameworthy (or significantly less).  

  **Question 7 (Only if you answered B to Question 1):**  
  For the equally blameworthy drunk drivers: Should the driver who killed the child be punished more severely than the one who didn’t?  
  - **A:** Yes.  
  - **B:** No.  

  ---

  ### **Resulting Positions (Leaves)**  
  Follow the tree to your endpoint based on your answers:  

  1. **Strict Control Principle**  
     - Path: **1=B** → **2=B** → **3=B** → **4=B** → **5=B** → **6=A** → **7=B**  
     - Luck *never* affects blameworthiness. Identical choices deserve identical blame, regardless of outcomes, circumstances, or upbringing. Punishment should match desert (no extra penalty for bad luck).  

  2. **Treatment-Only View** (Unnamed)  
     - Path: **1=B** → **2=B** → **3=B** → **4=B** → **5=B** → **6=A** → **7=A**  
     - Luck doesn’t affect *desert* (all cases above have equal blame), but outcomes change what we’re permitted to *do* (e.g., punish the drunk driver who killed more severely for practical reasons).  

  3. **Outcomes as Evidence View**  
     - Path: **1=B** → **2=A or C** → **3=B** → **4=B** → **5=B** → **6=A**  
     - Luck affects blame only if it reveals something about the agent’s intent/character (e.g., the gun jam suggests incompetence; the bird doesn’t). Outcomes themselves don’t matter, but they can be *evidence*.  

  4. **Full Moral Luck** (Nagel/Williams View)  
     - Path: **1=A** → **2=B** → **3=A or C** → **4=A** → **5=A** → **6=A**  
     - All luck (resultant, circumstantial, constitutive) affects blameworthiness identically. Outcomes and circumstances change desert (e.g., the artist’s success reduces blame; the undiscovered thief deserves less).  

  5. **Constitutive Luck Skepticism**  
     - Path: **Any** → **6=B**  
     - Constitutive luck (e.g., upbringing affecting remorse-capacity) undermines agency so deeply that blame is impossible (*even if* you think other luck matters). All other answers are irrelevant once you hit **6=B**.  

  6. **Resultant-Only Luck View** (Unnamed)  
     - Path: **1=A** → **2=B** → **4=A** → **5=B** → **6=A** (and **3=A or B or C** doesn’t split further)  
     - Only *resultant* luck (outcomes) affects blame (e.g., drunk driver who kills is worse; undiscovered thief isn’t off the hook). But circumstantial/constitutive luck (e.g., artist’s success, upbringing) doesn’t change desert.  

  ---

  ### **Logical Space & Notes**  
  - **Empty Cells**:  
    - **1=A + 5=A + 6=B**: Incoherent. If constitutive luck destroys agency (6=B), outcomes (1=A) or discovery (5=A) can’t increase desert.  
    - **1=B + 2=A/C + 3≠B**: Unstable. If outcomes don’t matter (1=B), circumstantial luck (e.g., artist’s success in Q3) shouldn’t affect desert either.  
  - **Indistinguishable Leaves**:  
    - **Treatment-Only** vs. **Strict Control** are only split by Q7. If Q7 were omitted, they’d collapse.  
    - **Outcomes as Evidence** vs. **Strict Control** can’t be split by the tree if you answer **2=B** (they share all other answers). To separate them, add a case where intent is ambiguous (e.g., *"Someone *almost* poisons a colleague—did they intend harm, or was it an accident?"*).  
  - **Stable Commitments**:  
    - **Q2** splits **Outcomes as Evidence** (A or C) from others (B), confirming your hunch.  
    - **Q6** is the "skepticism detector": **6=B** overrides all prior answers.  
  - **Why 6 Leaves?**  
    - Combines core positions without over-splitting (e.g., treating **3=A** and **3=C** as the same leaf for **Full Moral Luck** since both reject luck-neutrality for the artist).  

  ---

  ### **Tree Output**  
  Print this one-page PDF for your group: [Moral Luck Diagnostic](link-to-pdf). Participants circle answers and follow the path to their leaf. Each leaf includes a brief description of the view (e.g., "You think luck changes what people *deserve*, not just how we treat them"). No citations or jargon—just cases and consequences.
