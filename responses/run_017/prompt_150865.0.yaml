prompt: |-
  hey — I moderate a critique group for novelists. Eight of us, we meet monthly, and between full manuscripts and thirty-page chunks I'm reading other people's work-in-progress most nights. The actual job I keep failing at isn't writing feedback, it's adjudicating it: two readers come back on the same pages with flatly opposite verdicts (one says it's the best thing she's written, one says he couldn't get past chapter two), the writer looks at me, and whatever comes out of my mouth next decides which way six months of revision goes. That's maybe forty of these calls a year, the readers are unpaid volunteers I can't give homework to, I have about twenty minutes with both sets of notes in front of me and the pages, and whatever I decide I have to say out loud in a way that doesn't make either reader quit the group.

  I half-remember that Hume wrote something about whether taste can be objective at all — true judges, delicacy of sentiment, practice, comparison, being free of prejudice, we defer to critics who've done all that. There's also some story about two guys at a wine tasting who both complained the wine was off, one said leather and one said metal, everyone else said it was fine and laughed at them, and then when the barrel was drained there was an old key on a leather thong sitting at the bottom. I don't want an essay about any of this. I want a procedure.

  So: give me an ordered set of tests — a checklist, a flowchart in words, whatever — that I can actually run in twenty minutes to decide which reader's judgment to back, or whether to declare the disagreement undecidable. For each step say what counts as a sufficient answer, where the procedure just stops with "no verdict" and I tell the writer to pick based on what she wants the book to be, and where it has to hand the question to a person because it's a values call and not a facts call. Every step has to be phrased so someone who's never opened a philosophy book can run it, and you should say plainly which of Hume's distinctions survive being turned into a checklist and which ones you're dropping and why.

  Please steal, fix, or replace my own half-baked ideas:

  1. The key-and-thong step. Before I decide who is right, I go looking for a concrete thing in the text that both readers are actually responding to from different angles — a tense shift, a narrator who withholds, a deliberately dull scene, a joke that lands as cruelty for one reader and as honesty for another. If I find it, the disagreement is evidence about the book. If I can't find it after a fixed amount of time, the disagreement is evidence about the readers. I don't know how to stop myself from finding something, though, so this step needs a way to fail.
  2. Local reasons beat global verdicts. "On page twelve the tense shifts and I lost the timeline" is usable. "It didn't work for me" and "I couldn't put it down" are not. But our best reader writes almost entirely in global verdicts and is usually right, so I need to know what to do with that.
  3. The inversion test. Have the champion argue against the manuscript and the detractor argue for it, and see which of their specific observations survive the flip. Observations that survive get kept; overall verdicts get discounted. I've tried this twice and once it felt rigged toward whoever is more articulate.
  4. The borrowed-standard problem. Half our fights are really about a reader judging a quiet literary novel by thriller standards, or a comic novel by standards of sincerity, or a first-person voice by standards of likability. What's the test for "you're using the wrong standard for this book" versus "you just dislike it and that's allowed"?

  Two more things about my group you have to build around. There's a retired editor in her seventies who is scary good and has been right more often than the rest of us put together, and there's a writer whose own books are unlike anything anyone else writes and who loves things the rest of us hate and is sometimes the only early reader of something that later wins prizes. I don't want a procedure that just says defer to the expert, and I don't want one that pretends track records are nothing.

  Then run the procedure on three cases, including one where it tells me to back the reader I personally disagree with — I want to see that happen, because if the procedure never overrules me I'll never trust it. Make them cases I'd recognise: a debut literary novel everyone loves except one reader who says the narrator is unbearable; a genre manuscript where the group's praise is about the idea and the complaints are about the prose; and a case where the two readers disagree about whether a book is even finished. End by telling me what this procedure cannot do.

  One format thing: lead with your bottom line in the first sentence, then give me the reasoning. No preamble and don't restate the question back at me. Casual is fine — I'll be reading it at midnight.
reasoning: |-
  Okay, let me tackle this user's problem. They moderate a critique group for novelists and struggle when two readers give opposite feedback. The main challenge is deciding whose judgment to back quickly without alienating anyone. 

  First, I need to create a practical procedure based on their half-baked ideas and Hume's concepts. The user mentioned Hume's true judges—delicacy, practice, comparison, lack of prejudice. But they want a checklist, not theory. So I should translate those into actionable steps while acknowledging which parts are kept or dropped.

  The user's ideas: key-and-thong step (find a concrete element both readers react to), local vs global reasons, inversion test, borrowed standards. Need to refine these. For example, the key-and-thong step requires a time limit to avoid over-interpreting. Also, global verdicts from experienced readers can't be ignored, so maybe add a credibility step.

  The group has a retired editor who's often right and an unconventional writer with unique taste. The procedure mustn't default to deferring to experts but should consider track records. So include a step for assessing reader credibility based on past accuracy and genre fit.

  Structure the procedure into a flowchart-style checklist. Start with "Is there a concrete trigger?" to identify if both readers are reacting to the same element. If found, it's about the manuscript; if not, it's about the readers. Limit search time to 5 minutes to prevent forcing connections.

  Then check for local specifics over global verdicts. If one reader provides page-specific issues, that's more actionable. But if the experienced editor gives global feedback, use a credibility step. The inversion test (arguing opposite views) might be tricky due to articulation bias, so maybe skip it per the user's concern.

  Borrowed standards: determine if the critique uses wrong genre expectations. Check if the complaint is common for the genre or if the reader consistently misaligns. Also, consider the author's intent—does the critique align with their goals?

  Credibility step: track past accuracy and genre expertise. But don't override if other factors contradict. Finally, if undecided, pass the decision to the author.

  Test cases: debut literary novel with an unlikeable narrator—check if the detractor points to specific behaviors vs global dislike. Genre manuscript with great idea but poor prose—focus on local complaints about writing. Unfinished book—assess if structural issues are objective or subjective.

  The procedure can't handle deep taste conflicts or replace authorial vision. Also, it won't resolve all disagreements but provides a framework to navigate them. Need to ensure each step has clear exit points to "no verdict" when necessary.
answer: |-
  Here's your adjudication procedure. Bottom line: **Use a 5-step checklist prioritizing concrete triggers, local evidence, standard alignment, reader credibility, and author intent to resolve conflicts in 20 minutes, defaulting to "no verdict" when criteria conflict.**

  **The Checklist**  
  *(Run steps in order; stop if verdict reached or time expires)*  

  1. **CONCRETE TRIGGER TEST (2 min max)**  
     - *Action:* Scan both critiques for ANY specific page/line references (e.g., "p.15 dialogue felt flat," "ch.2 flashback confused me"). Ignore global praise/critique.  
     - *Sufficient answer:* **YES** (both mention the *same* scene/technique, even if interpreted differently → Disagreement is about the *text*. Proceed to Step 2).  
     *or* **NO** (no overlapping specifics → Disagreement is about *readers*. Skip to Step 4).  
     - *Hume survival:* "Delicacy of sentiment" → **DROPPED** (too subjective). "Comparison" → **KEPT** as seeking shared textual evidence.  

  2. **LOCAL EVIDENCE VS. GLOBAL VERDICT (5 min)**  
     - *Action:* Compare how each reader supports their view at the trigger point. Does one cite observable details (e.g., "The tense shift on p.22 broke immersion") while the other only states feelings (e.g., "I lost interest")?  
     - *Sufficient answer:*  
       - **A** has local evidence, **B** has only global → Back **A**.  
       - **BOTH** have local evidence → Proceed to Step 3.  
       - **NEITHER** has local evidence → Proceed to Step 4.  
     - *Handling your "global genius":* If the editor gives global verdicts, her credibility is handled in Step 4.  

  3. **STANDARD ALIGNMENT TEST (5 min)**  
     - *Action:* For each critique, ask: "Is this complaint *unique to the book's genre/voice/goals*?" (e.g., critiquing a thriller for "being unrealistic" when it’s surrealist satire). Check the writer’s stated intent.  
     - *Sufficient answer:*  
       - **A** uses misaligned standards (e.g., "This literary narrator is too introspective" for an introspective novel) → Discount **A**. Back **B** if it passes Step 2.  
       - **BOTH** standards align → Conflict is valid taste difference. Proceed to Step 5.  
     - *Hume survival:* "Freedom from prejudice" → **KEPT** as judging if bias distorts critique.  

  4. **READER CREDIBILITY ASSESSMENT (5 min)**  
     - *Action:* Evaluate ONLY if Steps 1-3 are inconclusive. Ask:  
       - *Track record:* Who has been *consistently* right about *this type of book*? (e.g., the quirky writer on experimental fiction).  
       - *Genre fit:* Whose expertise aligns better? (e.g., editor on pacing, quirky writer on voice).  
     - *Sufficient answer:*  
       - Clear credibility/gap → Back the credible reader.  
       - Credibility tied/irrelevant → Proceed to Step 5.  
     - *Hume survival:* "Practice" and "comparison" → **KEPT** as weighing demonstrated judgment.  

  5. **AUTHOR INTENT RESOLUTION (3 min)**  
     - *Action:* Ask the writer: "Which critique better reflects what YOU want this book to achieve?"  
     - *Sufficient answer:*  
       - Writer has strong preference → Back that reader.  
       - Writer is unsure → **NO VERDICT**. Say: "Revise based on your vision; both views are valid."  

  **Where It Fails**  
  - Step 1 fails if you "find" a false trigger → Set a 2-min timer. If no *shared* concrete reference, it’s "NO."  
  - Step 3 fails if standards are ambiguous → Default to "NO VERDICT."  
  - Step 4 isn’t autodeferral → Editor’s global rave about fantasy may lose to a fantasy writer’s local critique.  

  ---

  **Test Cases**  
  *(Your 20-min simulation)*  

  1. **Debut Literary Novel**  
     - *Reader A (hates it):* "Narrator is whiny and unbearable!" (global).  
     - *Reader B (loves it):* "Narrator’s vulnerability on p.30 made me cry." (local).  
     - *Procedure:*  
       - Step 1: **YES** (both mention narrator).  
       - Step 2: **B** has local evidence; **A** has none → Back **B**.  
       - *Why overrule you?* If you related to the narrator, backing **B** validates the text’s emotional intent despite **A**’s dislike.  

  2. **Genre Manuscript (Great Idea, Bad Prose)**  
     - *Reader A (praises):* "The twist is genius!" (global).  
     - *Reader B (critiques):* "Fight scene on p.45 has 7 passive verbs → no tension." (local).  
     - *Procedure:*  
       - Step 1: **NO** overlap → Skip to Step 4.  
       - Step 4: **B** is a genre writer with strong prose track record → Back **B**.  

  3. **"Is It Finished?" Disagreement**  
     - *Reader A (yes):* "Ending on p.200 feels complete." (global).  
     - *Reader B (no):* "Subplot about the sister (ch.7-9) isn’t resolved." (local).  
     - *Procedure:*  
       - Step 1: **YES** (both reference ending).  
       - Step 2: **BOTH** have local evidence (A cites page, B cites chapters).  
       - Step 3: **BOTH** standards align (completeness is universal).  
       - Step 4: Tie (both credible).  
       - Step 5: Writer says: "I intentionally left the sister ambiguous." → Back **A**.  

  ---

  **What This Cannot Do**  
  - Resolve **fundamental taste clashes** (e.g., "I hate epistolary novels" vs. "I love them").  
  - Replace **authorial vision** — it clarifies conflicts but won’t write the revision.  
  - Fix **vague critiques** — if both lack specifics, it defaults to "no verdict" fast.  
  - Handle **malicious feedback** — assumes good faith.  

  **Final Tweak:** For Step 2, flag critiques with *only* global verdicts with: "Can you point to a moment that didn’t work?" Do this *during* feedback submission, not mid-adjudication. Saves you time later.
