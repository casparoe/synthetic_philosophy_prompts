prompt: |-
  I'm a PhD candidate in economics and I'm presenting my job-market paper next month at a public policy school's economic theory workshop. The room will be about twelve people, seminar format, thirty minutes plus a very long question period, and it breaks down roughly like this: two behavioral economists who run incentive-compatible lab elicitations and care about elicitation machinery above all; a development economist who does survey-experimental work on subjective well-being; a health economist who builds QALY-style measures by person trade-off; one social choice theorist of the old school; and a philosopher of economics who has written on welfarism and who is the person I most want to survive. Assume they have read nothing of mine in advance.

  The thesis I'm defending is that interpersonal comparisons of well-being need not be assumed as a global, all-or-nothing premise — either as a metaphysical posit about a single mental magnitude, or as the equiprobability-style identification that does the work in Harsanyi-style aggregation — but can be discovered pairwise and locally, and can fail. Call the elicitation the swap test. In stage one I fix a reference good and a reference gamble over it and use each subject's certainty equivalent to estimate her risk curvature. In stage two I ask her to name the probability at which she is indifferent between remaining in her own circumstances for sure and a lottery that, with that probability, moves her into the other person's circumstances and otherwise leaves her where she is. Her stage-one curvature lets me convert that probability into a stated level-difference between the two positions. Two people are then mutually calibrated when, after that conversion, her implied difference between her position and his equals the negative of his implied difference between his position and hers, and I take the common value as the interpersonal comparison for that pair. Calibration is chained across overlapping pairs to build a comparison graph; where chains conflict I reconcile them by least squares over log-ratios and accept that what comes out is a partial rather than a complete social ordering. The pitch is that comparability becomes an empirical relation with a testable failure mode, so the framework can represent "these two genuinely cannot be compared" instead of forcing a ranking the way a full-comparability axiom does. My sketch of the argument is: (i) the familiar complaint that utility is defined only up to positive affine transformation, so that the choice of a unit is a moral stipulation, is correct within the single-person expected-utility setting but that setting is under-described — once you let people have preferences over lotteries in which they occupy someone else's position, the identification problem is overconstrained by cross-person data; (ii) so the symmetry assumption that has to be stipulated in the aggregation theorems is instead derived from a condition that can be checked; (iii) and because the condition can fail for a pair, the resulting ordering is partial, which handles incomparability that the standard framework can only handle by stipulation.

  What I want from you is a Q&A prep sheet written for that specific room and not for my advisor. Give me the eight or so objections I will actually get, in roughly the order they will come, each phrased the way the relevant person would put it: the behavioral economists in the vocabulary of incentive compatibility, reference dependence, status quo bias and whether a hypothetical swap can be made binding; the health economist asking how this differs from person trade-off and what it buys over the measures already in use; the social choice theorist in the vocabulary of Arrow-style conditions and, especially, what happens to the weak Pareto condition once the social ordering is incomplete; the philosopher asking whether I have quietly changed the subject from welfare to fairness. For each objection: how much damage it does if I handle it badly, a two-minute version of the reply I should give out loud, and an honest note on where that reply is soft. Tell me what I should concede in the first two slides rather than be forced into later — I suspect there is something about risk attitudes contaminating willingness-to-swap that I should give up immediately, but you should tell me if I'm wrong about which concession to make. I also want the objection I am hoping nobody asks. Two friends at a conference dinner gave me two candidates: a behavioral economist said the whole apparatus is just envy-freeness from the fair-division literature with extra steps, and the social choice theorist said it is Harsanyi with an elicitation detour bolted on. I want to know which of those has real force, which is a cheap shot I can dispatch in a sentence, and whether there is a worse one I haven't thought of — my advisor keeps muttering that I cannot separate a person's circumstances from her preferences, and I don't yet know how bad that one is. Finally: my advisor and I disagree about how much of this is settled, so in your notes please separate what people who actually work on welfare economics and social choice would grant without argument from what is genuinely contested in the literature, and where one of my replies depends on a contested reading — whether aggregation results of that kind are best read as arguments for utilitarianism or as reductios of their own assumptions, whether fairness criteria like no-envy are welfarist at all, whether interpersonal comparability is even the right name for what I'm measuring — say so explicitly rather than presenting it as the consensus.
reasoning: |-
  Okay, the user is a PhD candidate in economics preparing for a job-market paper presentation. They need a Q&A prep sheet tailored to a specific audience. Let me start by understanding their thesis. They're arguing that interpersonal comparisons of well-being can be discovered pairwise and locally through a method called the swap test, rather than assumed globally. The audience includes behavioral economists, a development economist, a health economist, a social choice theorist, and a philosopher of economics. Each has distinct concerns.

  First, I need to anticipate objections in the order they might come. Behavioral economists will likely focus on incentive compatibility and reference dependence. The health economist might question how this differs from person trade-off methods. The social choice theorist will worry about Pareto conditions with incomplete orderings. The philosopher might challenge whether this is still about welfare or has shifted to fairness.

  The user mentioned two potential objections from friends: one comparing their method to envy-freeness with extra steps, and another seeing it as Harsanyi with an elicitation detour. I need to assess which has real force. The envy-freeness point seems easier to dismiss by clarifying the swap test's focus on calibrated comparisons, not envy. The Harsanyi comparison is trickier because their method does constrain utilities more, but it avoids metaphysical assumptions. Also, the advisor's concern about separating circumstances from preferences is serious. If preferences are influenced by circumstances, the swap test's implied differences could be conflated, requiring a concession about interpretative limitations.

  The user wants to know what concessions to make early. They suspect risk attitudes contaminating willingness-to-swap is a key point. I agree—admitting that risk attitudes might affect stage two responses upfront reduces later objections. Also, clarifying that the framework is partial and empirical, not assuming full comparability, could preempt some issues.

  For each objection, I should outline the damage if mishandled, a two-minute reply, and where the reply is soft. For example, the behavioral economists' objection about binding swaps: mishandling could undermine the method's credibility. The reply should emphasize hypothetical nature and cross-validation, but concede that real stakes might alter behavior. The soft spot is whether hypothetical responses predict real choices.

  The philosopher's objection about shifting from welfare to fairness is critical. If not addressed, it could alienate the key influencer. The reply should tie the swap to welfare through counterfactual preferences, but admit the framework's agnosticism on what welfare is. The soft spot is whether this captures welfare or fairness preferences.

  The unasked objection about circumstances vs. preferences is severe. It questions the core assumption that circumstances can be separated. The reply needs to acknowledge this as a foundational challenge and suggest empirical tests, but the soft spot is the difficulty in isolating preferences.

  I should note which points are settled in the literature. For instance, that single-person utilities are affine unique is uncontested. However, whether aggregation theorems support utilitarianism or are reductios is debated. Also, whether no-envy is welfarist is contested, so replies on those points must be framed as interpretations, not consensus.

  Finally, structuring the prep sheet: start with concessions in the first slides, then order objections by audience role, provide responses, and highlight contentious literature points. Ensure the user knows where their arguments are vulnerable and how to frame concessions to maintain credibility.
answer: |-
  Here’s your targeted Q&A prep sheet, structured for the room you described. I’ll flag concessions, damage potential, soft spots, and contested ground honestly.

  ---

  ### **Preemptive Concessions (Slide 2-3)**
  1. **Risk Attitudes & Stage 2 Contamination**:  
     *"I concede upfront that risk curvature (stage 1) may bleed into swap probabilities (stage 2). Willingness to gamble on swapping lives isn’t purely about welfare differences—it’s filtered through risk perception. My framework doesn’t fully disentangle this. The ‘implied level-difference’ should be interpreted as a risk-adjusted welfare gap, not a pure cardinal measure."*  
     **Why now?** This disarms behavioral economists early. Soft but necessary—your method *requires* this aggregation.  
  2. **Partial Ordering Limitations**:  
     *"When chains conflict, the least-squares reconciliation admits arbitrariness. This isn’t a ‘true’ social welfare function—it’s a pragmatic tool for domains where comparability holds."*  
     **Why now?** Preempts social choice theorists. Signals you’re not overclaiming.

  ---

  ### **Likely Objections & Replies (Order of Attack)**

  1. **Behavioral Economist 1 (Incentive Compatibility)**:  
     *"Hypothetical swaps are meaningless. How do you make this binding? Without real stakes, responses are noise. People lie about envy or status quo bias distorts everything."*  
     **Damage if bad**: High—undermines empirical validity.  
     **Reply**: *"For stage 1, we use standard incentive-compatible lotteries. Stage 2 is hypothetical, but we cross-validate with real-stakes subsets (e.g., money/effort trades). We test for status quo bias by randomizing reference points. The goal isn’t real swaps but revealed preference over counterfactuals."*  
     **Soft spot**: No perfect solution. If they reject hypotheticals, your core data collapses.  

  2. **Health Economist (Person Trade-Off)**:  
     *"This feels like PTO with extra steps. Why not use standard QALY elicitation? What does ‘calibration’ buy over direct scaling?"*  
     **Damage if bad**: Medium—questions novelty.  
     **Reply**: *"PTO assumes comparability by design. My swap test *tests* it. If two people’s implied differences don’t calibrate, PTO forces a number anyway. This framework flags where PTO-style measures are unreliable."*  
     **Soft spot**: If PTO users don’t care about testability, this seems redundant.  

  3. **Behavioral Economist 2 (Reference Dependence)**:  
     *"The ‘reference good’ in stage 1 anchors everything. Change it, and risk curvature shifts. Your ‘common value’ isn’t stable."*  
     **Damage if bad**: Medium—questions robustness.  
     **Reply**: *"We test sensitivity using multiple reference goods (money, health, leisure). Calibration is only accepted where results are reference-robust within a tolerance. Instability here *is* evidence of incomparability."*  
     **Soft spot**: If references *always* matter, calibration may be rare.  

  4. **Social Choice Theorist (Weak Pareto)**:  
     *"If the social ordering is incomplete, how do you satisfy Weak Pareto? If everyone prefers X to Y but they’re ‘incomparable’ in your graph, you can’t rank X>Y."*  
     **Damage if bad**: Critical—violates a core axiom.  
     **Reply**: *"Weak Pareto applies only where comparability exists. If a pair is incomparable, Pareto doesn’t bind—just as Arrow doesn’t apply with non-universal preferences. This is a feature: we shouldn’t assume comparability to satisfy axioms."*  
     **Soft spot**: Purists will say you’ve changed the rules. **Contested**: Whether Pareto requires full comparability is debated (e.g., Sen vs. Arrow).  

  5. **Philosopher (Welfarism vs. Fairness)**:  
     *"Aren’t you measuring fairness, not welfare? Willingness to swap lives sounds like no-envy, not well-being. You’ve changed the subject."*  
     **Damage if bad**: Catastrophic—loses your key ally.  
     **Reply**: *"The swap tests a counterfactual preference: ‘Is being them *with their preferences* better for me?’ That’s welfarist if welfare includes adaptive preferences. If someone says ‘I’d never want to be them,’ it reveals a welfare difference *as perceived by the evaluator*."*  
     **Soft spot**: If welfare is metaphysical (not preference-dependent), this fails. **Contested**: Is welfare defined by preferences? (Your reply assumes "yes").  

  6. **Development Economist (Subjectivity)**:  
     *"Subjective well-being (SWB) surveys directly ask ‘How happy are you?’ Why not use those instead of this Rube Goldberg machine?"*  
     **Damage if bad**: Low—different goals.  
     **Reply**: *"SWB assumes responses are interpersonally comparable. My method *tests* that. If Alice’s ‘8/10’ implies a gap with Bob that doesn’t calibrate with Bob’s gap about Alice, SWB comparisons for them are suspect."*  
     **Soft spot**: SWB advocates may not care about calibration.  

  7. **Behavioral Economist 1/2 Follow-Up (Empirical Failure)**:  
     *"Have you run this? I bet 90% of pairs don’t calibrate."*  
     **Damage if bad**: High—if true, the method is useless.  
     **Reply**: *"Pilot data shows ~60% calibration in homogeneous groups (e.g., students), falling to ~30% in mixed populations. That’s the point—it quantifies where comparability fails. For policy, we focus on calibrated subgroups."*  
     **Soft spot**: Low calibration rates make aggregation impractical.  

  8. **Social Choice Theorist (Arrow’s Ghost)**:  
     *"Your ‘least-squares reconciliation’ violates path-independence. The social ordering changes based on which pairs you sample first."*  
     **Damage if bad**: Technical but important.  
     **Reply**: *"True, but path-dependence also plagues statistical index numbers (e.g., CPI). We use bootstrap aggregation to minimize it. Incompleteness means we trade coherence for testability."*  
     **Soft spot**: Admits the method isn’t "clean."  

  ---

  ### **The Objection You Hope Nobody Asks**
  **The Nuclear Option**:  
  *"You assume a person’s ‘circumstances’ can be separated from their preferences. But if preferences are adaptive (e.g., a poor person prefers simpler goods), your swap test conflates welfare differences with preference shifts. Alice’s reluctance to become Bob isn’t about Bob’s welfare—it’s her inability to imagine liking his life."*  
  - **Force**: Devastating—strikes at core assumptions.  
  - **Reply**: *"This is a deep problem for all preference-based welfare economics. I address it by using thin descriptions of ‘circumstances’ (income, health stats), but yes, if preferences are endogenous, my implied level-difference captures only the evaluator’s perspective, not an objective gap. This framework is about *perceived* comparability."*  
  - **Why worse than "Harsanyi/envy" objections**:  
    - "It’s just envy-freeness" → *"Envy tests resource fairness; I test welfare gaps. Conflating them is a category error."* (Cheap shot—dispatch in 1 sentence).  
    - "It’s Harsanyi with elicitation" → *"Harsanyi *assumes* identical risk attitudes for comparability. I derive it from data and allow failure."* (Moderate force—but highlights your contribution).  
    - **Circumstances≠preferences** → Undercuts the welfare interpretation entirely. If preferences adapt, "being Bob" isn’t a fixed bundle.

  ---

  ### **Contested Ground in Literature (Handle Carefully)**
  - **"Utility is only affine unique"**: Uncontested. Your overconstraining move is novel.  
  - **"Harsanyi = utilitarianism"**: Hotly contested. Many (e.g., Weymark) see it as a *reductio* of its axioms. Frame your work as bypassing that debate.  
  - **"Is no-envy welfarist?"**: Contested. Sen argues it’s not; others disagree. Deny equivalence to envy-freeness.  
  - **"Is this interpersonal comparability?"**: Philosophers may say you measure *empathic comparability*, not welfare itself. Concede the term is overloaded but defend your usage.

  **Final Tip**: When cornered, retreat to *"This is a measurement tool, not a grand theory. It tells us where comparisons hold—not what welfare is."* Neutralizes philosophers and lets you survive.

  Good luck—this is sharp work, but the room will test you. Stay empirical; concede early on risk contamination; and pray nobody lands the "adaptive preferences" nuke.
