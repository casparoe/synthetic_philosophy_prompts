prompt: |-
  I have spent twenty-two years writing a sequence of nine novels whose central figure is a man called Gabriel Sark, and a clause in an option agreement has at last forced me to answer a question I have been avoiding since book three: what makes a fictional character in one version of a story the same character as a character in another? It is plainly not the sum of the sentences in which he appears, because I have watched that sum be replaced almost completely whilst remaining certain — certain that my readers are certain too — that it was Sark throughout. It is not simply the name either, because I have a case below in which the name stays exactly where it was and I want to say the character underneath it has been exchanged for a different one.

  I set out my verdicts below as a working novelist rather than as a philosopher, and I should like a principle, or if no single principle will do, the smallest set of candidates, that captures them — or that tells me which of them I must give up. Please do not supply a bibliography or citations; I can find those myself. What I want is the shape of the account.

  1. Drift. Across the nine books every concrete thing asserted about Sark in book one has been replaced or flatly contradicted: eye colour, birthplace, parentage, profession, century, even the spelling of his Christian name. Verdict: one character throughout, and the contradictions are my errors rather than evidence of two men.

  2. The swap. In the galley proofs of book six I reassigned everything — scenes, memories, relationships, traits — that had belonged to Aldous Vane to Beatrix Munn, and vice versa, leaving the names attached to the same physical descriptions. Verdict: I did not rewrite either of them; I swapped their lives. The character called Vane is now living Munn's life, and readers who knew the earlier books feel this immediately, even though no sentence about either of them is new.

  3. Another hand. Suppose that after my death a novelist I admire completes a tenth book from my notes: every established fact preserved, the name preserved, the prose unmistakably not mine. Verdict: not Sark. A tribute, an impersonation, a very good piece of fan work — but not the same character, and I should want the estate to resist it.

  4. Translation. The French edition renames him, moves Bristol to Marseille, and refashions every sentence. Verdict: the same character, obviously, and I should be puzzled by anyone who doubted it.

  5. The promotion. In revision I deleted my protagonist Ivor entirely and gave all of Ivor's scenes, decisions and plot function to a minor character, Ruth, who keeps her own name and her own remembered past. Verdict: I have not given Ivor's part to Ruth. I have deleted Ruth and dressed Ivor in her name; the thing that walks through the last third of the book wearing Ruth's name is Ivor. My readers disagree with me here, and say that Ruth is Ruth and always was.

  6. Fission. In book eight I reveal that the narrator has been conflating two men. Verdict: both were present from book one. I did not create a character in book eight; the earlier books were ambiguous between them, and book eight says what they were ambiguous about.

  Two of these I know to be in trouble together. One and two involve changes of the same magnitude — the whole textual basis replaced — yet I call one persistence and the other an exchange. Worse, I am fairly sure that if I had made all the changes of case one in a single revision of book two rather than across nine books, I should have said I had written a different man and given him the same name; and I can see no reason why the rate of change should matter to what a character is, any more than it matters whether the ship's planks are drawn out one at a time or all at once, or whether the old planks are fished out of the water and rebuilt into a rival vessel.

  The rule of thumb I have been using is this: a character survives a change just in case the narrative role he occupies — the work he does in the plot and in the reader's attention — is continuous across it, and the change was made either by me or by someone whose licence to alter the text traces back to me and who adds nothing of their own. Please test that rule against all six cases, repair it if it can be repaired, and tell me if it can be replaced by something cleaner that overturns one of my verdicts instead. In particular I should like to know how the second clause is meant to tell the translator from the continuator, and whether the first clause survives case six, where a single role turns out, retrospectively, to have been two.

  Then two cases I have not settled. In a drawer I have ninety pages of an abandoned novel whose protagonist is called Halloran; in the book now on my desk a man called Seddon has been given several of Halloran's scenes almost verbatim, including a childhood memory of a red bicycle. Is Seddon Halloran under a new name, or a different man who has inherited some scenes? And: if my estate licenses a prequel written by someone who has read only the published novels and none of my notes, is the boy in that book Sark as a child, or merely a character constructed to resemble him?

  Please state the resulting principle precisely, say which of my cases motivates each clause, give its verdicts on the two unsettled cases, and be honest about which of my verdicts it cannot accommodate and what it would cost me to abandon them. Finally, since a solicitor is waiting on an answer: whatever account you settle on, what would it imply for how the words "the character Gabriel Sark" ought to be defined in a contract, and is there any account you would trust to do that work?
reasoning: |-
  Hmm, the user has presented a fascinating philosophical challenge about character identity in fiction, stemming from their 22-year writing journey with Gabriel Sark. This isn't just academic—they need a legally binding definition for contract purposes, with a solicitor waiting. The urgency and practical stakes elevate this beyond typical philosophical musing.

  Breaking down their cases: They've identified six scenarios where character identity seems intuitive but logically messy. The core tension is between textual consistency (which fails in Case 1 where everything changes yet Sark persists) and narrative function (which struggles in Case 3 where function is preserved by another writer yet isn't Sark). Their proposed "narrative role + authorial chain" rule feels intuitively right but needs stress-testing.

  Their unsettled cases are particularly thorny. The Halloran/Seddon question pits textual origin against functional reuse, while the prequel problem tests whether authorial intent can be inherited. Legally, the contract definition must prevent future disputes—so clarity matters more than philosophical elegance.

  Noticing their professional pride in Cases 2 and 3: They insist swapping Vane/Munn's lives isn't rewriting, and posthumous completion isn't Sark. These verdicts feel non-negotiable, so any principle must honor them. Meanwhile, they admit readers disagree on Case 5 (Ruth/Ivor), suggesting flexibility there.

  The ship of Theseus analogy they mention is apt but incomplete for fiction. Unlike physical objects, characters have no material persistence. What remains is the author's creative will—like a sculptor declaring which clay lumps constitute "David" despite repairs.

  For the contract, I'm leaning toward defining Sark as "the character as materially realized in the author's published texts." This excludes drafts (resolving Halloran/Seddon) and posthumous works (resolving the prequel), while allowing translations (Case 4) since they derive from authorized source material. It's imperfect but legally defensible.
answer: |-
  Here's a principle capturing your verdicts, derived from your rule of thumb but refined to handle the cases, including the conflicts and unsettled ones. It has two core components:

  **The Principle of Narrative Origin and Function:**

  1.  **Narrative Function Continuity:** A character X in version B of a story is the *same character* as character Y in version A if and only if:
      *   X occupies a continuous narrative role derived from Y's role in A. This "role" encompasses their essential plot function, thematic weight, and the core psychological/relational "space" they occupy within the story's structure and the reader's engagement, *even if* specific attributes, memories, or scenes change.
      *   *AND*
  2.  **Authorial Genesis Chain:** The transition from Y in A to X in B is the result of alterations made *only* by the original author (or their direct, authorized delegates acting under *strict* instruction to preserve the originating author's vision *without* introducing their own creative interpretation), applied *to the material originating from A*. This chain preserves the character as an expression of the *original author's specific creative act*.

  **Clauses & Motivations:**

  *   **Clause 1 (Function):** Motivated by **Cases 1 (Drift), 2 (Swap), 4 (Translation), 5 (Promotion - *your* verdict), and 6 (Fission)**. It explains why Sark persists through massive attribute change (1), how swapping lives changes identity despite textual stability (2 - roles swapped), why translation preserves identity (4 - role intact), why you see Ruth as Ivor (5 - Ivor's *role* was reassigned, Ruth's original role erased), and why fission reveals two pre-existing characters (6 - two distinct roles were ambiguously occupying one textual space).
  *   **Clause 2 (Origin/Chain):** Motivated by **Case 3 (Another Hand), Case 4 (Translation)**, and your core intuition about authorship. It explains why the posthumous novel isn't Sark (3 - broken chain, new creative input) while the translation is (4 - alterations are purely derivative, mechanical adaptations under authority, preserving the origin). It distinguishes the translator (faithful executor within the chain) from the continuator (new creative agent breaking the chain).

  **Testing Against Your Cases:**

  1.  **Drift:** YES. Function continuous (Sark's core role). Changes made by you (Chain intact).
  2.  **Swap:** YES. Functions swapped (Vane now occupies Munn's former narrative function/space, Munn occupies Vane's). Changes made by you (Chain intact).
  3.  **Another Hand:** NO. Function *might* be continuous, but Chain BROKEN (new author introduces their own creative interpretation, even if preserving facts).
  4.  **Translation:** YES. Function continuous. Changes are derivative adaptation by authorized delegate (Chain intact).
  5.  **Promotion (Your Verdict):** YES. Function continuous (Ivor's role reassigned). Changes made by you (Chain intact). *However, this requires accepting your view that Ruth's original *role* was entirely erased and replaced by Ivor's role.*
  6.  **Fission:** YES. The single ambiguous textual role in earlier books is revealed to be occupied by *two distinct functional roles* all along. The continuity is in the *revealed* functions, not in the initial misperception. Change made by you (Chain intact).

  **Unsettled Cases:**

  1.  **Halloran/Seddon:** **Seddon is a DIFFERENT man.** While he inherits scenes/memories, Clause 2 fails: Halloran existed in an *abandoned* work. He never entered the authorized chain of the *published* Sark universe. The scenes/memories given to Seddon are raw material reused by you, not the continuation of Halloran's specific narrative origin within *this* story cycle. Seddon occupies his *own* role, built partly from recycled parts.
  2.  **Authorized Prequel (No Notes):** **The boy is NOT Sark.** Clause 2 fails. The new author, working *only* from the published text and *not* your notes (your private, originating intent), *interprets* and *constructs* the child based on their understanding of the adult Sark. They introduce their own creative interpretation to fill the gaps, breaking the direct chain to *your* specific genesis of Sark. It's a well-constructed simulacrum based on the *effects* of Sark, not the continuation of Sark's origin.

  **Conflicts & Costs:**

  *   **The Drift vs. Swap Consistency Problem:** The Principle resolves this by emphasizing *what* is continuous. In Drift, Sark's *function* (his specific role) persists *through* change. In Swap, the *functions themselves* (Vane's role vs. Munn's role) are exchanged. The rate of change (across books vs. single revision) doesn't change *what* is continuous (function) *or* who made the change (you). A single massive revision of book two *by you* changing everything about Sark would still be Sark under this principle, as long as his *core narrative function* (his unique place in that specific plot/thematic structure) was intended to continue. **Cost:** You must accept that a single massive revision preserving function *is* still Sark, even if it *feels* like a new man. Your intuition about the rate of change isn't fundamental to the identity under this model.
  *   **Case 5 (Promotion) - Reader Disagreement:** The Principle supports *your* verdict (Ivor in Ruth's name). The cost is disagreement with readers who focus on the *name* and the *reused backstory fragments* as constituting Ruth's identity, rather than the dominant *narrative function* now being performed (Ivor's). To align with readers, you'd need to weaken Clause 1 to allow names/specific memories to anchor identity even when function changes dramatically, but this would break your verdicts on Case 2 (Swap) and Case 5 itself (if you sided with readers).

  **Contract Definition & Trust:**

  *   **Definition:** "The character Gabriel Sark" means the character originating in the Work(s) authored solely by [Your Name] and published as [List Titles], as materially realized in the specific text of those published Works, and any future manifestations thereof *only* if resulting from alterations made:
      *   (a) Directly by [Your Name], or
      *   (b) By a party expressly authorized in writing by [Your Name] (or [Your Estate]) acting strictly under [Your Name]'s specific instructions or notes, and solely for the purpose of translation, formatting, or correction *without* introducing new creative interpretation or substantive narrative development beyond the originating material.
  *   **Trustworthiness:** This definition, based on the Principle, is the *most* legally robust and clear for contract purposes. It anchors identity in:
      1.  **Concrete Origin:** The specific published texts.
      2.  **Controlled Lineage:** Explicitly limits authorized changes to non-creative, derivative acts (like translation) under strict instruction.
      3.  **Excludes Ambiguity:** Clearly excludes posthumous continuations (even authorized ones, unless under *your* specific notes/instructions), adaptations that change core function, and characters from unpublished works.
  *   **Why Trust It?** It provides objective criteria (published texts, explicit authorization for specific types of changes) rather than relying on subjective interpretations of "narrative function" or "authorial intent," which are impossible to adjudicate legally. It protects your core vision (Sark as *your* creation) by restricting significant development to you alone. It aligns with standard copyright concepts of derivative works vs. original creations.

  **In essence:** Sark is Sark because he sprang from *your* mind into *your* published texts, and survives only through changes *you* make (or strictly delegate for mechanical adaptation) that preserve his essential role in *your* story. Anything else is an interpretation, an homage, or a new character inspired by him. This principle honors your intuitions as the creator while providing a workable, defensible framework for the real-world need of contractual definition.
