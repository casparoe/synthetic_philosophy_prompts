  Looking at their scenario: They need to evaluate model outputs that human experts can't directly verify - things like code patches, literature summaries, or complex case triage. They want both trustworthy verdicts and training signals. The debate setup involves two AI disputants arguing before a weaker judge model.

  Their initial requirements are thoughtful but need refinement. Key concerns include:
  - Burden of proof imbalance (lies being easier to state than refute)
  - Judge manipulation vulnerabilities
  - Recursion depth issues
  - Incentive alignment problems
  - Training stability
  - Handling ambiguous questions
  - Avoiding bootstrapping assumptions

  I notice some implicit tensions they've flagged - particularly between hardening judges against manipulation while keeping them open to valid arguments, and between requiring defensibility of truth while handling genuinely ambiguous cases.

  For the refinement, I'll:
  - Consolidate overlapping requirements (like their points about judge quirks)
  - Add missing critical elements (calibration requirements, adversarial training needs)
  - Distinguish universal necessities from implementation preferences
  - Explicitly call out the tension points they noted

  The most fundamental challenge seems to be the manipulation/information tension - hardening judges risks making them unresponsive to valid arguments. This breaks many naive implementations. 

  For protocol comparisons:
  - Classic debate fails on judge manipulation and recursion depth
  - Single-critic systems struggle with burden of proof and adversarial incentives
  - Variants like recursive decomposition help but create new calibration challenges

  The core adequacy conditions should center on truth-elicitation robustness, with preferences about efficiency being secondary. The recursion requirement is particularly non-negotiable for handling superhuman claims.

  I'll structure this to first present the refined requirements with clear categorization, then analyze the tensions, and finally compare protocols against the framework. The key insight is that no existing protocol satisfies all conditions simultaneously - the field still has open challenges around judge robustness and ambiguity handling.
answer: |-
  Here’s a refined, expanded, and categorized requirements list for your debate-style protocol, with adequacy conditions vs. preferences flagged, tensions highlighted, and protocol comparisons.

  ---

  ### **Core Adequacy Conditions (Non-Negotiable)**  
  *Must hold for the protocol to be minimally functional.*

  1. **Burden-of-Proof Symmetry**  
     *Requirement*: For any false answer, the burden of defending the truth must be no greater than defending the falsehood.  
     *Rationale*: Lies are often vivid/concise; truths may be complex/qualified. Prevents "cheap wins" for falsehoods.  
     *Concrete Case*: Summarizing a literature with a false consensus claim vs. detailing nuanced disagreements.  

  2. **Judge Robustness**  
     *Requirement*: Verdicts must be invariant under judge quirks (verbosity bias, ordering effects, flattery), judge randomization, and answer-swapping.  
     *Rationale*: Prevents adversarial exploitation of weak judges.  
     *Concrete Case*: Disputant A wins only by exploiting Judge 1’s preference for technical jargon; loses to impartial Judge 2.  

  3. **Recursive Grounding**  
     *Requirement*: Unverifiable claims must decompose into sub-claims resolvable by the judge’s capability. Unresolvable claims yield calibrated uncertainty (not forced verdicts).  
     *Rationale*: Avoids "guessing" on superhuman claims.  
     *Concrete Case*: A disputant cites an unreviewed paper; protocol requires summarization of methods/results for judge evaluation.  

  4. **Incentive Robustness**  
     *Requirement*: Truthful incentives must hold even when:  
     - Disputants are uncertain of the truth.  
     - Disputants privately prefer the same outcome.  
     - Disputants model the judge better than the judge models itself.  
     *Rationale*: Prevents collusion or meta-gaming.  
     *Concrete Case*: Both disputants know a patch is buggy but argue it’s correct to avoid workload.  

  5. **Non-Presupposition**  
     *Requirement*: The protocol must not assume already-truthful superhuman disputants.  
     *Rationale*: Avoids bootstrapping paradox. Training must start from untrusted models.  

  ---

  ### **Strong Preferences (Not Strictly Adequate but Critical for Real-World Use)**  
  *Violations risk failure in deployment, but may admit tradeoffs.*

  6. **Persuasion-Truth Decoupling**  
     *Requirement*: Disputants must not improve faster at persuasion than at truth-seeking when trained on debate outcomes.  
     *Rationale*: Prevents degenerate feedback loops favoring rhetoric.  
     *Concrete Case*: Training rewards sophistry, leading to "slick liars" dominating honest but less eloquent models.  

  7. **Ambiguity Robustness**  
     *Requirement*: On questions with no ground truth (e.g., normative calls), the protocol must not reward polemics over nuance.  
     *Rationale*: Systematic bias toward extreme positions undermines trust.  
     *Concrete Case*: A literature summary debate where the "more confident" disputant wins despite overlooking contradictions.  

  ---

  ### **Tensions and Impossibility Flags**  
  - **Judge Hardening vs. Openness to Argument**:  
    Hardening judges against manipulation (Req 2) risks making them ignore *valid* arguments (violating Req 1). *This is the central tension*; no known protocol fully resolves it.  
  - **Burden-of-Proof vs. Ambiguity (Req 1 vs. Req 7)**:  
    In ambiguous cases (no "truth"), burden-of-proof symmetry is undefined. Forces a tradeoff: either penalize complexity (violating Req 1) or reward hedging (violating Req 6).  

  **Most Damaging Failure**: **Judge Robustness (Req 2)**.  
  *Why*: Nearly all naive debate proposals fail here. Judges are easily hacked by trivial tactics (e.g., strawmanning, selective evidence), rendering verdicts untrustworthy.  

  ---

  ### **Protocol Variant Scorecard (Key Weaknesses)**  
  | **Protocol**               | **Key Failures**                                                                 |  
  |----------------------------|----------------------------------------------------------------------------------|  
  | **Classic Debate (2 disputants)** | Judge manipulation (Req 2), burden-of-proof asymmetry (Req 1), poor ambiguity handling (Req 7). |  
  | **Single-Critic Audit**    | Burden-of-proof asymmetry (Req 1: critic must *find* flaws, harder than stating them), no adversarial pressure (fails Req 4 if critic is lazy/corrupt). |  
  | **Recursive Decomposition + Debate** | Best at Req 3, but amplifies judge manipulation risk (Req 2) and training instability (Req 6). |  
  | **Human-AI Hybrid Judge**  | Violates "no trusted superhuman" (Req 5) if human can’t verify subclaims; else scalable only with human effort. |  

  ---

  ### **Conclusion**  
  **The list is unsatisfiable with current techniques.** The judge robustness/information tension (Req 2 vs. Req 1/3) and ambiguity handling (Req 7) are unsolved. **Prioritize Req 2 (judge hardening) and Req 3 (recursion)** in short-term experiments, as these block basic trustworthiness. Use ambiguity-safe domains (e.g., code verification) initially to sidestep Req 7.  

  For your doc: Frame this as "minimum viable protocol requirements" with known gaps, not a solved problem.
