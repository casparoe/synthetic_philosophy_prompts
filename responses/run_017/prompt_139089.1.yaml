prompt: |-
  hey — I'm TAing an undergrad seminar on consciousness this term and I keep having the same 1am argument with a friend who does visual psychophysics in the lab next door. She says the only thing worth theorizing about is what gets into the global workspace and that the rest is metaphor; I keep saying that if you define conscious as broadcast-to-consumer-systems you've relocated the mystery rather than solved it. Before I make the students read another paper, I want the specification first.

  So: write me the desiderata list for a theory of conscious access — what any account of what it is for a state to be globally available or accessed (as opposed to merely phenomenal, or merely processed) has to deliver, with the case or consideration behind each item, and mark which ones you think are non-negotiable and which are just the prejudices of one camp. I care much more about the criteria than about scoring theories, but a very short scorecard at the end for the Block-style overflow picture, the Baars/Dehaene global workspace story, and a higher-order-ish view is fine if you keep it to a few lines each.

  Here's what I want the list to deal with, in no order. (1) Who are the consumers? Split access into at least three grades — available for online action, available for verbal report, available for arbitrary reasoning and delayed use — and say which is constitutive, because they come apart. Take as stipulated a made-up patient, call her the echo patient: she'll trace the contour of a briefly flashed shape with her finger and flinch correctly at a looming version of it, she says she saw nothing, she drops to chance if the response has to be delayed more than a couple of seconds, and she never improves with training. Is that access? Say what the theory is committed to there. (2) I keep wanting to split access into two components — the state being put into a format the downstream systems can read, versus its actually being routed to them — and I can't tell whether global workspace theory is a theory of the first, the second, or both. Build that into the list and tell me if it's a real distinction or a confusion. (3) Whenever I read the empirical stuff I can't tell whether the all-or-none ignition signature and the early-vs-late neural marker stuff are predictions of the theory or have quietly become its definition of access, wich would make it unfalsifiable; what should I demand so the theory stays testable? (4) The measurement trap: any report-based measure presupposes access, and no-report paradigms have to justify themselves somehow, so what if anything could be a non-circular gold standard for this state was accessed? (5) Cases it can't dodge: Sperling-style partial report where phenomenology looks richer than what gets reported; binocular rivalry and the attentional blink; change blindness and inattentional blindness; dreaming; and whether one attribute of a single stimulus (motion, say) can be accessed while another (colour) is not. (6) Distinctions it must not collapse: access vs attention, vs working-memory maintenance, vs metacognitive confidence, vs accuracy. (7) Anatomy: it has to take a stand on whether the workspace is essentially prefrontal or whether prefrontal activity is mostly the report machinery bolted on the side, and on whether it can stay a workspace theory if the answer is the latter. (8) What is the scarce resource anyway — if there's a bottleneck, say what is being economized (bandwidth? time? number of recipients? metabolic cost?) and why anything would evolve a system that throws information away. (9) And the bit I actually want most: is the access/phenomenal distinction even coherent, or does any functional account of access either collapse into behaviourism or sneak phenomenology back in? Put that on the list as a requirement, tell me whether it's jointly satisfiable with the others, and tell me which single desideratum does the most work knocking out candidate theories. Oh — and whatever I hand the students should also say something about whether a system with a bottleneck plus a broadcast architecture (a transformer with a tiny scratchpad, say) counts as access-conscious on the theory's own terms, and whether that result is a feature of the theory or a reductio of it.
reasoning: |-
  Okay, let me tackle this user's request. They're a TA for an undergrad seminar on consciousness, locked in a debate with a psychophysics colleague. The core issue is defining conscious access versus phenomenal states. The user wants a desiderata list to evaluate theories of conscious access, addressing specific points they've outlined.

  First, I need to unpack each of their nine points. Point 1 is about consumer systems and grades of access. The echo patient case is crucial here—it tests if theories can handle dissociations between action, report, and delayed use. I should identify which access grade is constitutive. 

  Point 2 deals with the format versus routing distinction. Is global workspace about making information readable or actually transmitting it? This might be a real distinction affecting testability. Point 3 warns against conflating neural markers with the definition of access. Theories must avoid making ignition signatures unfalsifiable. 

  Point 4 is the measurement trap. Report-based measures are circular, so non-report paradigms need validation. What could be a gold standard? Maybe neural decoding or behavioral measures in locked-in patients. Point 5 lists critical cases like Sperling and binocular rivalry. A theory must explain these without special pleading.

  Point 6 insists on distinguishing access from attention, working memory, etc. Without clear boundaries, the concept becomes muddy. Point 7 demands anatomical commitments—is the prefrontal cortex essential or just report machinery? This affects workspace theories' viability. 

  Point 8 questions the scarce resource. If there's a bottleneck, what's limited? Bandwidth? Time? Evolutionarily, why discard information? Point 9 is the big one: can access be defined functionally without collapsing into behaviorism or smuggling in phenomenology? This might be the hardest desideratum to satisfy.

  For the transformer example, I need to consider if an AI with a bottlenecked scratchpad qualifies as access-conscious. If so, is that a feature (showing scalability) or a reductio (over-inclusiveness)? 

  The user's deeper needs include clarity for teaching and resolving their debate. They want to avoid biasing students while providing rigorous criteria. Their frustration with circular definitions and measurement traps suggests a need for a framework that forces theories to be testable and non-question-begging. 

  Structuring the desiderata, I'll prioritize non-negotiable items like testability and avoiding circularity. The echo patient and AI cases will be litmus tests. Balancing empirical adequacy with conceptual coherence is key—especially for point 9, where functionalism might struggle. 

  I'll score major theories briefly: Global Workspace might handle bottlenecks well but could conflate access with report. Higher-Order theories might address phenomenology better but risk circularity. Overflow accounts explain Sperling but struggle with consumer ambiguity. 

  The hardest part is ensuring the list doesn't favor one camp. Highlighting desiderata as negotiable/non-negotiable helps. The anatomy point (#7) might be negotiable, while testability (#3) and coherence (#9) are not. 

  Finally, the transformer case: if GW theory embraces it, does that validate functionalism or expose its emptiness? That tension might be central to the user's debate with their colleague. Emphasizing this could help students grapple with the core philosophical conflict.
answer: |-
  Here’s a rigorous desiderata list for evaluating theories of conscious access, addressing your specified points. Key non-negotiables are marked (**★**), others reflect theoretical commitments or empirical constraints. Each item includes the underlying case/consideration.

  ---

  ### **Desiderata for a Theory of Conscious Access**  
  *(Non-negotiables marked **★**)*  

  1. **Graded Consumer-Specificity**  
     - *Requirement*: Must distinguish **online action**, **verbal report**, and **arbitrary reasoning/delayed use** as distinct access grades. Specify which is constitutive of "access."  
     - *Case*: The **echo patient** (online action intact, report absent, delayed use impossible) tests theories.  
     - *Non-negotiable*: **★** (Failure collapses critical dissociations).  
     - *Commitment*: If constitutive access = *arbitrary reasoning*, echo patient lacks access; if = *online action*, she has it.  

  2. **Format vs. Routing Distinction**  
     - *Requirement*: Clarify whether access requires (a) **formatting** information for consumer systems, (b) **routing** it to them, or both.  
     - *Case*: Subliminal priming (formatted but not routed) vs. inattentional blindness (routable but unattended).  
     - *Non-negotiable*: **★** (Ambiguity here makes predictions untestable).  
     - *Real or Confusion?*: Real distinction. Formatting is necessary for routing; routing is sufficient for access.  

  3. **Testability Guardrails**  
     - *Requirement*: Neural markers (e.g., "ignition") must be **predicted consequences**, not definitions, of access. Must specify *behavioral/functional* criteria for access independent of neural signatures.  
     - *Case*: If ignition *defines* access, rival theories (e.g., recurrent processing) are artificially excluded.  
     - *Non-negotiable*: **★** (Avoids unfalsifiability).  

  4. **Non-Circular Measurement**  
     - *Requirement*: Provide a **gold standard independent of report** (e.g., behavioral flexibility in novel tasks, neural decoding in absence of report).  
     - *Case*: **No-report paradigms** (e.g., decoding visual content during inattention) must link to a functional outcome beyond confidence/accuracy.  
     - *Non-negotiable*: **★** (Circularity invalidates empirical claims).  

  5. **Explanatory Scope for Critical Cases**  
     - *Requirement*: Account for:  
       - **Sperling** (rich phenomenology > reportable access)  
       - **Binocular rivalry/Attentional blink** (access gating)  
       - **Change blindness** (access ≠ sensory presence)  
       - **Dreaming** (access without external stimuli)  
       - **Feature-specific access** (e.g., motion accessed, color not).  
     - *Non-negotiable*: **★** (Failure indicates incompleteness).  

  6. **Conceptual Demarcations**  
     - *Requirement*: Dissociate access from:  
       - **Attention** (pre-access selection)  
       - **Working memory** (maintenance ≠ initial broadcasting)  
       - **Metacognition** (confidence judgments ≠ access)  
       - **Accuracy** (access can be false).  
     - *Non-negotiable*: **★** (Conflation obscures mechanisms).  

  7. **Anatomical Commitments**  
     - *Requirement*: Take a stand on whether the workspace is **essentially prefrontal** (PFC) or if PFC is merely "report machinery." State if the theory fails if PFC is not central.  
     - *Case*: Posterior cortical activity in dreaming/imagery vs. PFC lesions impairing report but sparing online action.  
     - *Negotiable*: (Theory-dependent; e.g., GWT requires PFC, overflow views don’t).  

  8. **Bottleneck Justification**  
     - *Requirement*: Identify the **scarce resource** (e.g., bandwidth, integration time, metabolic cost) and explain *why* evolution would discard information.  
     - *Case*: **Evolutionary efficiency**: Broadcasting is costly; bottleneck avoids system overload. Resource = **integration bandwidth** (limited simultaneous broadcasts).  
     - *Negotiable*: (But failure weakens explanatory power).  

  9. **Coherence of Access/Phenomenal Distinction**  
     - *Requirement*: Define access **without collapsing into behaviorism** (reducing consciousness to report) **or smuggling in phenomenology** (e.g., "availability to self").  
     - *Litmus test*: Can the theory acknowledge **overflow** (phenomenology > access)?  
     - *Non-negotiable*: **★** (Failure invalidates the access/phenomenal distinction).  
     - *Desideratum doing heavy lifting*: **This one**. Satisfiable only if access is strictly functional (consumer availability) and phenomenology is (at least conceptually) separable.  

  ---

  ### **Special Case: AI Systems (Transformers)**  
  - *Requirement*: Evaluate if a **bottlenecked broadcast architecture** (e.g., transformer with small scratchpad) qualifies as access-conscious.  
  - *Test*: Can information in the scratchpad drive arbitrary, flexible outputs (e.g., answering novel queries)? If yes, it satisfies functional access.  
  - *Implication*:  
    - **Feature** for functionalists (shows scalability).  
    - **Reductio** for skeptics (if silicon systems lack phenomenology, access ≠ consciousness).  

  ---

  ### **Theory Scorecard (Brief)**  
  *(Based on desiderata above)*  

  | Theory                | Strengths                                  | Weaknesses                                  | Echo Patient                          | AI System Qualified? |  
  |-----------------------|--------------------------------------------|---------------------------------------------|---------------------------------------|----------------------|  
  | **Global Workspace (GWT)** | Clear bottleneck, testable neural markers. | Conflates access with report; struggles with Sperling. | Access = report → **no access**       | Yes (feature)        |  
  | **Overflow (Block)**      | Explains Sperling; access ≠ phenomenality. | Vague on consumers; anatomy underspecified. | Access = online → **has access**      | Maybe (if scratchpad ≈ online) |  
  | **Higher-Order (HO)**     | Distinguishes access/phenomenality clearly. | Risks circularity (access defined by "mental appearance"). | Access = meta-representation → **no access** | Unlikely (no subjective HO state) |  

  ---

  ### **Key Takeaway for Students**  
  The hardest desideratum is **#9**: Maintaining a functionalist definition of access without behaviorism or phenomenal smuggling. **GWT** risks behaviorism by tying access to report; **HO** risks smuggling phenomenology via meta-representation; **Overflow** preserves the distinction but struggles with empirical specificity. The **echo patient** and **AI cases** expose these tensions. A theory must either:  
  - Deny the access/phenomenal distinction (e.g., GWT), or  
  - Provide a non-circular functional criterion for access (e.g., availability for *unprecedented tasks*).  

  Use this list to force theories to declare their commitments on measurement, anatomy, and metaphysical boundaries.
