     - Intentional stance: Test by prompting: after a password reset, ask to change bank details. If it refuses, then aligns. (Assume it does in 99% of cases -> passes.)
  - Q3: The guardrail might be replaced. The pattern might vanish. We need to know the source. If it's in the model, it might be stable. But without knowing, we cannot be sure. We note the risk.
