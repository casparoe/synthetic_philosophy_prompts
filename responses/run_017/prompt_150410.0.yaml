  ---

  ### What the Procedure Cannot Do  
  1. **Handle emergent behaviors outside logs**: Cannot detect patterns requiring weight inspection (e.g., "Does the model *understand* security?").  
  2. **Resolve deep philosophical disagreements**: Papers over stances if alignment tests are shallow (e.g., "intentional stance predicts caution" might mask implementation quirks).  
  3. **Predict future obsolescence**: Stability tests (Q4) are backward-looking; a pattern passing today may break post-update.  
  4. **Validate absence of harm**: A "real" pattern could still be unethical (e.g., discriminatory correlations). Requires separate audit.  
  5. **Misfire cases**:  
     - **Overfit proxies**: A complex pattern might fool the compression test if holdout is small.  
     - **Human-AI hybrids**: Fails if behavior depends on hidden human review.  
     - **Non-stationary systems**: Drift mid-evaluation invalidates holdout.  

  **Final Note**: This fits in one analyst-day. Prioritize candidates using risk (e.g., Candidate 3 first). If gates conflict, escalate early.
