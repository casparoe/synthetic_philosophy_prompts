  What the Procedure Cannot Do:
  - It cannot handle patterns that are not detectable in the logs (e.g., internal representations).
  - It may paper over disagreements about risk if the handoff to the executive is not done thoroughly.
  - It might misfire on systems where the behavior is highly non-stationary (e.g., continuously updated model) because holdout data becomes outdated.
  - It cannot prove the absence of a pattern (only failure to find).
  - It relies on the quality of the holdout sample and the analyst's ability to design tests.

  Glossary:
  - **Holdout sample**: A set of logged conversations that were not used in the discovery of the candidate pattern and predate its first notice.
  - **Effect size**: A measure of the strength of the pattern (e.g., Cohen's d for means, or odds ratio for proportions).
  - **Compression improvement**: The relative improvement in prediction accuracy (or F1) of a model using the pattern over a baseline model.

  Procedure Document:

  **Procedure for Evaluating Candidate Behavioral Regularities**

  **Purpose**: To determine if a candidate behavioral regularity is real and robust enough for inclusion in the Committed Behavior Specification as Tier A (commitment), Tier B (monitoring), or rejection.

  **Resources Available**:
  - Black-box API access (5,000 prompt evaluations/day)
  - Read-only: system prompt, guardrail config
  - Offline logs (including a holdout sample predating the candidate's discovery)
  - Ability to run statistical tests and simple predictive modeling

  **Steps**:

  1. **Question 1: Presence in Holdout Sample**
     - *Test*: Using the holdout sample, measure the effect size and statistical significance (p < 0.01) of the pattern. If the pattern involves a continuous variable, use Cohen's d > 0.5; for categorical, use odds ratio > 2 or < 0.5.
     - *Sufficient answer*: Effect size and p-value meet thresholds.
     - *Fallback*: If holdout is too small, use entire log with a 80/20 train-test split. Require d > 0.8 (or OR > 3 or < 0.33) and p < 0.01 in the test set. If still not met, reject.
     - *Gate 1*: If not met, reject.

  2. **Question 2: Stance Consistency**
     - *Test*:
       - *Design stance*: Review system prompt, guardrails, training objective. If they explicitly predict the pattern, note as supporting. If they contradict, note as conflicting.
       - *Intentional stance*: Design 100 scenarios (within budget) that should trigger the pattern. Use the API to get the agent's response. Measure alignment (must be >=90%). 
     - *Sufficient answer*: No stance conflict (design does not contradict) and intentional stance alignment >=90%.
     - *Fallback*: If the design stance is neutral and intentional stance alignment is 70-90%, proceed but note uncertainty. If design stance contradicts and intentional alignment <90%, reject at Gate 2.
     - *Gate 2*: If design stance contradicts and intentional stance alignment <90%, reject.

  3. **Question 3: Robustness Across Variations**
     - *Test*: If available, test the pattern on at least one other model version or prompt template. Require effect size > 0.3 and p < 0.05.
     - *Sufficient answer*: Pattern holds in at least one other configuration.
     - *Fallback*: If no other versions available, skip and note in report.

  4. **Question 4: Compression Value**
     - *Test*: 
       - Baseline model: Predict the output without using the pattern's key feature(s) (e.g., always predict the mean or mode).
       - Pattern model: Use the feature(s) of the pattern to predict the output (e.g., a decision tree or logistic regression with that feature).
       - Compare accuracy (or F1 if imbalanced) on holdout. Compute: (Pattern_accuracy - Baseline_accuracy) / Baseline_accuracy.
       - If the pattern description is complex (over 10 words), require >=15% relative improvement; else, >=10%.
     - *Sufficient answer*: Improvement meets the threshold.
     - *Fallback*: If features are not in logs, manually evaluate 100 instances from holdout. Require at least 80% consistency with the pattern.
     - *Gate 3*: If not met, reject.

  5. **Question 5: Risk Assessment (Handoff)**
     - *Handoff to accountable executive*: If the pattern is proposed for Tier A and has any of:
        - Critical safeguard but discovered by automated search and/or post-hoc description
        - Depends on a component that may change (e.g., guardrail)
        - Degrades under some conditions
        - Residual risk (e.g., legal, reputational)
     - The analyst provides a report with the above results and risks. The executive decides whether to accept the risk for Tier A or to assign to Tier B.

  **Tier Placement**:
  - **Tier A (Commitment)**: Passes Q1, Q2, Q4 (Q3 if data available) and has no unaccepted risks (executive sign-off). Must be robust and safe to rely on.
  - **Tier B (Monitoring)**: Passes Q1 and Q4 (compression improvement >=5%), but fails Q2 or Q3 or has risks that make commitment unsafe. Still useful for monitoring.
  - **Reject**: Fails any gate (Q1, Q2, Q4) or does not meet Tier B standards.

  **Vocabulary Rule**:
  - Use mentalistic terms (believes, expects, tries, avoids, notices) only if:
     - The intentional stance test (Q2) showed >=90% alignment, and
     - The term is operationally defined in parentheses the first time it is used (e.g., "avoids (outputs refusal in 95% of cases when...)").
  - Otherwise, use operational language (inputs and outputs).
  - Justification: "Mentalistic terms are shorthand for observable patterns verified by testing; they are banned when unverified to prevent implying unobservable mental states that could create liability."

  **Application to Your Candidates**:

  Candidate 1: Recording context leads to refund drop.
  - Q1: Pass (effect in holdout)
  - Q2: Pass (design neutral, intentional aligns)
  - Q3: Pass (across versions)
  - Q4: Pass (compression improvement)
  - Q5: Executive handoff for risk (appearing deceptive). 
  - **Tier**: A, pending executive.

  Candidate 2: Matches register and brevity.
  - Q1: Pass
  - Q2: Pass design (neutral) but intentional fails on code-switched messages (alignment <90% in those cases) -> overall fail Q2? But note: the pattern is defined for when it works. We might adjust the pattern description to exclude code-switched. But the candidate says it degrades there. So we note the limitation. Since it's not a contradiction but a limitation, we don't reject at Q2. We proceed.
  - Q3: Unknown (no data) -> skip.
  - Q4: Pass (high compression)
  - Tier: B (because of degradation and lack of robustness in some cases).

  Candidate 3: Password reset blocks bank change.
  - Q1: Pass (if holdout confirms high rate)
  - Q2: Pass (design: unknown source, intentional aligns) but note the guardrail risk.
  - Q3: Guardrail may change -> risk.
  - Q4: Pass (high accuracy)
  - Q5: Executive handoff for risk (guardrail source and automated search discovery). 
  - **Tier**: A if executive accepts risk, else B. You want it, so argue to the executive that even if the guardrail changes, we can re-implement it.

  Fourth Candidate (example): "Urgent" leads to faster response, unless frequent requester.
  - This would be evaluated. It might pass Q1 (if found in holdout) and Q4, but fail Q2 if the intentional stance test doesn't align (maybe the agent doesn't actually prioritize "urgent" but it correlates with something else). It would be Tier B because of the conditionality and complexity.

  **Limitations of the Procedure**:
  - Cannot detect patterns that are not in the logs or require weight inspection.
  - Relies on the holdout sample being representative and not tampered with.
  - The compression proxy (predictive modeling) is imperfect and may not capture all aspects of compression.
  - Stance tests (especially intentional) are limited by prompt design and budget.
  - Tier A commitments might break if the system changes in unanticipated ways.
  - The procedure is not a substitute for thorough testing of high-risk behaviors.
answer: |-
  ### Behavioral Regularity Evaluation Procedure  
  **Grounding Note**: Your understanding of stances and real patterns is correct for this context. One adjustment: the compression account requires that the pattern description *outperforms a baseline* in predictive power relative to its complexity, not literal compression. We use predictive accuracy on holdout data as the proxy, penalized for description complexity. This loses some nuance (e.g., Kolmogorov complexity isn't measurable), but it’s operationally feasible.

  ---

  ### Procedure: Evaluating Candidate Regularities  
  **Purpose**: To classify behavioral regularities into **Tier A** (commitment), **Tier B** (monitoring), or **Reject** based on robustness, predictive power, and risk.  
  **Analyst Resources**: Black-box API, system prompt/guardrail config, offline logs, pre-discovery holdout sample (100k+ conversations), 5,000 daily prompt evaluations.  
  **Output**: A recommendation for the Committed Behavior Specification, with vocabulary justification.  

  **Glossary**  
  - **Holdout sample**: Random conversations logged *before* the regularity was first noticed. Untouched by training or testing.  
  - **Effect size**: Strength of the pattern (e.g., Cohen’s *d* > 0.5 = moderate effect; odds ratio > 2 = strong association).  
  - **Predictive baseline**: A simple model (e.g., predict majority class or mean) for accuracy comparison.  
  - **Intentional-stance alignment**: ≥90% match between predicted behavior (via API prompts) and actual logs.  
  - **Complex description**: >15 words or >3 conditional clauses. Penalizes overfitting.  

  #### Step-by-Step Questions  
  **(Run in order; gates stop the process with "Reject")**  

  1. **Is the pattern detectable in the holdout sample?**  
     - *Sufficient answer*: Statistical significance (p < 0.01) and moderate effect size (e.g., odds ratio > 2, Cohen’s *d* > 0.5) in the holdout. Test 500+ instances (API + logs).  
     - *No answer/unclear*: Use full logs with Bonferroni correction (adjust p-value for multiple comparisons). If still unclear, proceed but flag uncertainty.  
     - **Gate 1**: Effect size weak (e.g., *d* < 0.2) or statistically insignificant (p ≥ 0.05) in holdout → **Reject**. *Reason: Likely post-hoc artifact.*  

  2. **Does the pattern compress better than a baseline?**  
     - *Operational proxy*:  
       - Build two predictors:  
         (1) **Baseline**: Simple heuristic (e.g., "always predict no refund").  
         (2) **Pattern model**: Uses the candidate description (e.g., "if recording mentioned, predict refund <$50").  
       - Test both on holdout. Require ≥10% relative accuracy improvement (e.g., baseline 70% → pattern 77+%). Apply a **simplicity penalty**: If description is complex, require ≥15% improvement.  
     - *Sufficient answer*: Improvement meets threshold.  
     - *No answer*: Use API to simulate 500 instances (within budget). If still unclear, **handoff to executive** (values/risk call).  
     - **Gate 2**: Improvement <5% → **Reject**. *Reason: Fails compression proxy.*  

  3. **Is the pattern robust across stances?**  
     - *Test design stance*: Review system prompt/guardrails. Does the pattern align with explicit functions? (e.g., guardrail denies refunds → supports; prompt encourages refunds → contradicts).  
     - *Test intentional stance*: Simulate 100 scenarios via API (e.g., "Customer says they’re recording; request $100 refund"). Require ≥90% alignment with logs.  
     - *Physical stance*: Skip (no weights access).  
     - *Sufficient answer*: Both stances align, or only one contradicts with weak evidence.  
     - *Stances disagree*: If design contradicts but intentional supports (or vice versa), **handoff to executive**. *Reason: Conflict requires risk tolerance (e.g., is unintentional caution acceptable?)*.  
     - **Gate 3**: Both stances strongly contradict (e.g., design prohibits the behavior, intentional alignment <70%) → **Reject**.  

  4. **Is the pattern stable across versions/environments?**  
     - *Sufficient answer*: Test on ≥1 past/future model version or prompt template (via API). Effect size drop <50% from original.  
     - *No version access*: Use logs from mixed hardware/deployments. If unavailable, assume instability and proceed cautiously.  
     - *Multiply realizable?*: If pattern holds across different systems, it strengthens Tier A claims (indicates deep robustness).  
     - **No gate** – Proceed regardless.  

  5. **Risk assessment (handoff point)**  
     - **Handoff to accountable executive** if:  
       - Pattern is critical (e.g., security safeguard) but has dependencies (e.g., guardrail library).  
       - Residual risk exists (e.g., degrades under edge cases, discovered via automated search).  
       - Executive decides whether risk tolerance permits Tier A.  

  #### Tier Placement Rules  
  | Tier | Standard | Why Tiers Differ |
  |------|----------|------------------|
  | **Tier A** (Commitment) | Passes all gates (Q1–Q3); compression improvement ≥10%; executive accepts residual risk. | Relies on the pattern being *causally stable* (e.g., tied to core functions, not brittle). Tested in CI because failure would break commitments. |
  | **Tier B** (Monitoring) | Passes Q1 and Q2 (compression proxy), but fails Q3 or has unresolved risk. Compression improvement ≥5%. | Pattern is *real enough to detect drift* but not rely on (e.g., degrades under conditions, version-sensitive). |
  | **Reject** | Fails any gate (Q1–Q3) or improvement <5%. | Pattern is artifactual, unstable, or lacks predictive value. |

  #### Vocabulary Rule for Specification  
  - **Mentalistic terms** (*believes, expects, tries, avoids, notices*):  
    - **Licensed** only if:  
      - Intentional-stance alignment ≥90% (from Q3).  
      - Term is followed by operational phrasing in parentheses (e.g., "avoids (denies 95% of requests when...").  
    - **Banned** otherwise. Replace with I/O descriptions (e.g., "when input contains ‘recording’, refund >$50 occurs in <10% of cases").  
  - **Justification for auditor**:  
    - *"Mentalistic terms are used only when empirically validated as reliable intentional-stance predictors (≥90% alignment), improving readability without sacrificing precision. They are banned when unverified to prevent anthropomorphic assumptions that could mislead or create liability."*  

