  - Q3: It held across three model versions and prompt templates -> passes.
  - Q4: Build a baseline model (always predict the average refund) and a pattern model (with feature: recording context). The pattern model should have >10% improvement in predicting refund amount. Assume it does.
  - Q5: This pattern has a risk: it might be seen as the system being deceptive. Handoff to the executive for risk tolerance. 
