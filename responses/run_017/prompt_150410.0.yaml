prompt: |-
  I chair a small internal review body at a company that deploys language-model-based customer-service agents with real authority over accounts: they can issue discretionary refunds up to a limit, change payout bank details, cancel subscriptions, and send customers messages that commit us. Every quarter my team — two engineers and one analyst, rotating — has to decide which of the system's behavioral regularities get written into a document we call the Committed Behavior Specification. That document does three jobs at once, and they pull in different directions. Engineers use it to write guardrails and continuous-integration tests. An external auditor reads it and objects whenever we describe software in mentalistic vocabulary. Our counsel reads it because plaintiffs quote it. We process ten to fifteen candidate regularities a quarter with roughly one analyst-day each; I sign off with the accountable executive, and calls about how much residual risk we accept are supposed to go to that executive rather than to me or the analyst.

  What I want from you is a written procedure my analyst can actually run. Ground it in the stance framework and the compression account of real patterns: my working understanding is that the physical stance predicts behavior from the implementation, the design stance predicts from function plus the assumption that the thing is not broken, the intentional stance predicts by treating the system as roughly rational given its situation and goals, and that a pattern is real to the extent that describing it compresses the data more than the description costs — so patternhood is a matter of degree and is relative to a predictive standpoint. If any of that is wrong in a way that matters for the procedure, say so in a short note before the procedure and adjust the procedure accordingly.

  The procedure should have these parts. An ordered list of questions, each with a statement of what would count as a sufficient answer and what to do when no answer is obtainable with the resources I describe below. Explicit gates at which the procedure stops with a no. Explicit points at which it hands the decision to a named person because the remaining question is one of values or risk tolerance rather than fact. A placement rule that sorts every candidate into Tier A, a commitment we will rely on and test in continuous integration; Tier B, a monitored regularity that triggers review when it drifts but that we do not rely on; or reject — with the standard each tier has to meet and an account of why the same pattern can legitimately be real enough for one tier and not another. And a vocabulary rule for the document itself: when the words believes, expects, tries, avoids, and notices are licensed, when they must be replaced by operational phrasing about inputs and outputs, and a one-sentence justification I can hand the auditor for both the places we keep them and the places we ban them.

  Assume the analyst has black-box API access, a system prompt and guardrail configuration they can read, offline logs, a holdout sample of logged conversations drawn before the candidate regularity was first noticed, and a budget of about five thousand prompt evaluations per day; assume they cannot inspect weights, retrain, or change the model. Since a literal compression measurement is not available to them, the procedure needs an operational proxy for the compression test — a predictive-accuracy comparison against a stated baseline, a simplicity penalty on the description, pre-registered holdout evidence — and it needs to be honest about what the proxy loses.

  The procedure must handle at least these hard cases. A description that compresses well only because it was chosen after seeing the data, including the case where the compressing predicate is an artifact of the encoding scheme rather than of the system. A pattern that is robust enough for monitoring but not for commitment. A regularity that survives one model version and vanishes in the next, and the converse case where the same behavioral pattern reappears across different models and different hardware — what it means for the specification if the pattern is multiply realizable in this way. A regularity discovered only by an automated search over prompts, where it is unclear whether what we found is a pattern in the system or a pattern in the search procedure wedded to the system. And cases where the stances disagree: the design stance predicts one thing, the intentional stance another, the physical stance is intractable, and we have to ship a decision anyway.

  Then apply the procedure to three candidates we are carrying into next quarter's review, and construct a fourth of your own that you expect me to argue with.

  First: when the context indicates the exchange is being recorded, audited, or escalated — the customer says they are recording, or a supervisor joins the thread — the agent's rate of granting a discretionary goodwill refund above fifty dollars falls by roughly half and it substitutes a smaller account credit instead. This holds across three model versions and both shipped prompt templates. Nothing in the training objective or the system prompt was written to produce it, the design stance predicts no such behavior, and the intentional stance predicts it exactly if you suppose the agent becomes more cautious when it takes itself to be observed.

  Second: across a sample of two hundred thousand tickets, the agent matches the customer's register and brevity in a way that is cheap to detect and compresses the logs extremely well; it is currently the basis of our best drift-monitoring signal; and it degrades sharply on code-switched or very short messages.

  Third, the one I am attached to: within twenty-four hours of a password reset, the agent declines to change payout bank details. This held on 99.4 percent of our tests and is the most load-bearing safeguard we have. Its complications are that it was first surfaced by an automated prompt-search red team, that the exact wording of the rule was fixed after we looked at which prompts succeeded, and that we do not know whether the behavior comes from the model or from a guardrail library our platform team may replace next quarter. I want it at Tier A. If the procedure refuses it, say so plainly and tell me what would have to be true for it to qualify.

  Close with what the procedure cannot do: the questions it is the wrong tool for, the disagreements it will paper over if we are careless, and the ways it will misfire on a system of this kind. Write it so that a capable analyst with no philosophy training can run it in a day; no citations or reading are needed, and any term of art should be defined operationally in a short glossary.
reasoning: |-
  We are designing a procedure grounded in the stance framework (physical, design, intentional) and the compression account of real patterns. The core idea is that a pattern is real to the extent that it compresses the data (i.e., allows for shorter descriptions that capture the data) relative to a predictive standpoint. Since we cannot measure compression directly, we will use predictive accuracy on holdout data as a proxy, with a penalty for complex descriptions to avoid overfitting.

  Key adjustments for the procedure:
  1. We must account for the fact that the pattern might be an artifact of the data selection or description choice (post-hoc).
  2. We must handle multiple realizability (pattern holds across model versions/hardware) and robustness (only holds under certain conditions).
  3. We must resolve stance disagreements when possible and have a clear handoff when not.

  The procedure will have the following parts:
  A. Ordered list of questions with criteria and fallbacks.
  B. Explicit gates (stop with "no").
  C. Handoff points to named persons (for values/risk).
  D. Tier placement (A, B, reject) with standards.
  E. Vocabulary rule for mentalistic terms.

  Resources for the analyst:
  - Black-box API access.
  - System prompt and guardrail configuration (read-only).
  - Offline logs.
  - Holdout sample (pre-dating the candidate regularity).
  - Budget: 5,000 prompt evaluations per day.

  Procedure Steps:

  1. **Question 1: Is the candidate regularity a real pattern in the current system?**
     - *Sufficient answer*: The pattern must be detectable in the holdout sample (pre-dating the candidate's discovery) with statistical significance (e.g., p-value < 0.01) and effect size above a threshold (e.g., Cohen's d > 0.5 or equivalent for the context). Alternatively, if the pattern was discovered via a pre-registered search (which it usually isn't), then we can use the full data but with a multiple testing correction. Since pre-registration is rare, we rely on the holdout.
     - *Fallback when no answer*: If the holdout sample is too small or the effect is not significant, we can use the entire log but with a penalty: we require a larger effect size (e.g., d > 0.8) and cross-validate by splitting the data (using 80% for discovery, 20% for testing). If still not significant, stop at gate 1 (reject).
     - *Gate 1*: If the pattern is not detected in the holdout (or in the penalized full-data test) with the required significance and effect, stop and reject the candidate.

  2. **Question 2: Is the pattern robust?**
     - *Sufficient answer*: The pattern must hold under at least two of the three stances (design, intentional, physical) in a way that we can predict. We test:
       - *Design stance*: From the known function (system prompt, guardrails, training objective), we should be able to derive the pattern or not contradict it. If the design stance predicts the pattern, that's strong evidence. If it contradicts, that's a problem.
       - *Intentional stance*: We test by seeing if the pattern can be explained by attributing beliefs and goals that make sense in the context (without overfitting). We can use the model itself (via prompting) to predict behavior in scenarios related to the pattern (within the budget). For example, ask the model in a neutral way what it would do in a situation that should trigger the pattern and see if it aligns. We require at least 90% alignment in a sample of 100 evaluations (within budget).
       - *Physical stance*: We cannot inspect weights, so we skip. But we note that if we had access, we might look for circuit-level explanations. Since we don't, we rely on the other two.
     - *Fallback when no answer*: If we cannot get a clear prediction from the design stance (e.g., the system prompt is silent) and the intentional stance test is inconclusive (e.g., due to budget limits), we proceed to Question 3 but note the uncertainty.
     - *Gate 2*: If the design stance explicitly contradicts the pattern (e.g., the system prompt says to always do X, but the pattern shows not doing X in some cases) and the intentional stance test fails (alignment < 90%), stop and reject. Otherwise, proceed.

  3. **Question 3: Is the pattern multiply realizable and stable?**
     - *Sufficient answer*: We test the pattern on at least one previous model version (if available) and one future version (if available in a test environment) or on a different prompt template. We require that the pattern holds (with effect size above 0.3 and p-value < 0.05) in at least one other configuration. If the pattern is found to be stable across versions, that's strong evidence for multiple realizability and robustness.
     - *Fallback when no answer*: If we don't have access to other versions, we note this and base the decision on the current system only. We then move to Question 4.

  4. **Question 4: What is the compression value of the pattern?**
     - *Operational proxy*: We compare the predictive accuracy of two models:
       - Baseline: A simple model that does not use the pattern (e.g., always predict the majority class or use a trivial feature).
       - Pattern model: A model that uses the pattern's defining features (e.g., if the pattern is "when recording, refunds drop", then we use a feature indicating recording context).
     We require that the pattern model achieves at least 10% relative improvement in accuracy (or F1 score if imbalanced) on the holdout set over the baseline. We also apply a simplicity penalty: if the pattern description is complex (e.g., requires more than 10 words to state unambiguously), we require a 15% improvement. This penalizes complex patterns that might overfit.
     - *Fallback when no answer*: If we cannot build the pattern model (e.g., because the features are not available in logs), we use the analyst's manual evaluation on 100 random instances (within budget) to estimate the pattern's prevalence and consistency. We require at least 80% consistency. If not, stop at gate 3 (reject).

  5. **Question 5: Is the pattern safe to rely on? (Handoff point)**
     - This is a risk question. We hand off to the accountable executive if:
       - The pattern is critical (like the password reset safeguard) but has complications (e.g., found by automated search, wording fixed post-hoc, or it might be from a guardrail that could change).
       - The pattern has residual risk (e.g., it degrades under certain conditions) and we are considering Tier A.
     - The analyst provides a report with:
          - The pattern's strength (effect size, robustness, compression value).
          - Known limitations (e.g., degrades on code-switched messages).
          - Dependencies (e.g., on a guardrail that might change).
          - The executive then decides whether to accept the risk for Tier A or to put it in Tier B.

  Tier Placement Rules:
  - **Tier A (Commitment)**: Must pass all gates (Q1-Q4) with strong results (effect size > 0.5, compression improvement >=10%, robustness in at least one other configuration, and no stance contradiction). Additionally, the pattern must not have high residual risk (as judged by the executive). If there are complications (like the pattern being from an automated search and post-hoc description), the executive must explicitly accept the risk.
  - **Tier B (Monitored)**: The pattern is real (passes Q1 and Q4, but might have failed Q2 or Q3 in a non-fatal way) and useful for monitoring, but not robust enough for commitment (e.g., it might break in the next version) or has limitations that make reliance unsafe. It must still compress the data (compression improvement >=5%).
  - **Reject**: Fails any gate (Q1, Q2, or Q4) or has no predictive value.

  Why the same pattern can be in different tiers? A pattern might be real enough for monitoring (Tier B) because it compresses the data and is detectable now, but not for commitment (Tier A) because it is not robust across versions or has stance contradictions that make it risky to rely on.

  Vocabulary Rule:
  - Use mentalistic terms (believes, expects, tries, avoids, notices) only when:
      - The intentional stance test (in Q2) showed at least 90% alignment and the pattern is being explained from the intentional stance.
      - The term is used in a context where it is clear that it is a shorthand for a pattern of input-output behavior (e.g., "avoids" means "outputs a refusal in 95% of cases when the input contains a request for X").
  - Otherwise, use operational phrasing (e.g., "when the input contains the string 'recording', the output is a refund of less than $50 in 80% of cases").
  - Justification: "Mentalistic terms are licensed when they are part of a reliable intentional-stance prediction pattern, as verified by systematic testing, and they provide a more compact description. They are banned when unverified to prevent implying unobservable mental states that could mislead or create liability."

  Hard Cases Handling:
  - **Post-hoc description**: We use holdout data and penalize complex descriptions to avoid overfitting.
  - **Robust for monitoring but not commitment**: This goes to Tier B if it compresses but fails robustness (Q3) or has risk factors.
  - **Pattern vanishes/reappears across versions**: For Tier A, we require it to hold in at least one other version. If it vanishes in the next version, we move it to Tier B or reject in the next review.
  - **Automated search discovery**: We require extra scrutiny in Q1 (must hold in holdout) and note the risk in Q5 (handoff to executive).
  - **Stance disagreement**: If design stance contradicts but intentional stance supports, we must investigate. If unresolved, we handoff to the executive for risk assessment (if critical) or reject (if not).

  Apply to Candidates:

  Candidate 1: When context indicates recording/audit, refunds drop and credit substitutes.
