prompt: |-
  I'm in a graduate reading group that has spent the term on Wittgenstein's late notes on certainty and on the hinge epistemology that has grown out of them, and I'm leading next week's session, which has turned into a fight about an image rather than about an argument. Please answer as a professional philosopher who works in contemporary epistemology and has taught these notebooks: take a moment before you write to sketch out the competing mappings on paper, and only then draw your conclusions.

  Here is the situation. Almost everyone in the literature, and the people in my group on both sides, leans on Wittgenstein's comparison of the propositions that are exempt from doubt to the hinge on which a door turns. One member of the group uses it to do three jobs: first, to show that hinges cannot be true or false and so are not beliefs and are not rationally appraisable, which is supposed to get the view off the hook of sanctioning arbitrary dogma (if there is nothing to appraise, there is nothing we are being unreasonable about); second, to show that the class of hinges is small, local and mostly invisible, so the objection that hinge epistemology absurdly multiplies certainties misfires; and third, to underwrite the claim that the whole picture is not epistemic relativism, because a door does not swing freely just because it hangs on a hinge. His opponent in the group reaches for a different image from the same notebooks, the bed of a river whose banks are hard rock in places and shifting sand and shingle in others, and uses it to argue the opposite: that what is exempt from doubt changes over time, that there is no clean line between hinge and ordinary empirical proposition, and that the view therefore is a form of relativism with a reassuring name. A third person, trying to broker it, has floated an image of her own that I think is new to this debate: hinge commitments, she says, are like the ballast in a ship's hold. Ballast is not cargo, because it is not there to be delivered anywhere; it is not part of the hull, but it is not merely inside the ship either, since without it the vessel capsizes; it can be pumped out and re-stowed mid-voyage, though doing so is a delicate operation and not something the crew does on a whim; what counts as ballast depends on the vessel and the voyage; and where the ballast currently sits is not something anyone on board normally thinks about at all. She thinks this captures both the fixedness and the changeability and so dissolves the disagreement.

  I don't trust that it does, and I don't even know whether my two combatants are disagreeing about the notebooks or just about which picture each of them is picturing. What I want is an audit, not a survey. Give me the correspondence table explicitly, with the three images side by side and a row each for what plays the role of the hinge, of the doubts and questions that turn on it, of the person who has the certainties, and of whatever corresponds to the door, the water and the ship. Then separate the disanalogies that matter for the three jobs listed above from the ones that are merely decorative: a door hinge is manufactured for a purpose and is a single discrete point, a riverbed is made of the same material as the sediment it channels and has no sharp boundary, and ballast is stowed by someone and can be inventoried, and I want to know which of these features each image quietly imports into the target and which are idle. Two other images float around the same passages and may be relevant: the scaffolding of our thoughts, and reaching bedrock where the spade turns. Say whether either helps, and where it breaks. Most importantly, tell me which of the three conclusions the door-hinge image is being used to support actually survives once the disanalogies are on the table: does the arationality of hinges block the charge of arbitrary dogma, or does it invite it? Is the non-relativist reading carried by the image or by the argument? And is there a better composite image, or is the honest answer that no single object has both of the features this debate needs? Finally, keep your confidence calibrated and mark your distinctions: I need you to separate what is uncontroversial about these passages and this literature from what is genuinely contested among people who work on it, and in particular not to present the reading on which hinges are not beliefs at all as if it were the consensus view, since I have a suspicion the dispute in my group is downstream of exactly that assumption.
reasoning: |-
  Okay, the user is in a graduate reading group on Wittgenstein's "On Certainty" and hinge epistemology. They're leading next week's session, which has devolved into a debate over competing metaphors rather than arguments. The group is split between three images: the door hinge, the riverbed, and the ballast in a ship. The user wants a professional philosopher's audit of these metaphors, mapping their components and evaluating which features are relevant to the philosophical disputes.

  First, I need to recall Wittgenstein's text. "On Certainty" deals with propositions that aren't doubted—hinge propositions—like "The world exists" or "I have hands." These aren't justified but form the framework for other beliefs. The door hinge metaphor suggests these are fixed and arational, while the riverbed shows they can change over time. The ballast metaphor is new here, introduced by a group member to bridge the gap.

  The user's main request is a correspondence table. Let me mentally sketch that. For each metaphor (hinge, riverbed, ballast), I need to identify:
  - What represents the hinge propositions
  - What corresponds to doubts/questions
  - The role of the person (epistemic agent)
  - The counterpart to the door, water, or ship

  Then, analyze which disanalogies matter. For example, a door hinge is a single point, manufactured, while a riverbed is natural, fluid, with blurred boundaries. Ballast is movable but essential. I need to flag which features import philosophical assumptions and which are decorative.

  The user also wants to know if the door-hinge metaphor supports three claims: hinges are arational (not true/false), the class is small/local, and it avoids relativism. The opponent uses the riverbed to argue for changeability and relativism. The ballast tries to reconcile both. I should assess whether arationality blocks the dogma charge or invites it. Also, whether non-relativism comes from the image or argument.

  Other metaphors like "scaffolding" and "bedrock" need mention. Scaffolding is temporary, used in construction, which might imply hinges are provisional. Bedrock is solid but reached when justification stops, emphasizing non-justification rather than immutability.

  I need to address controversies. The user suspects the group's dispute is downstream from assuming hinges aren't beliefs. I should note that this is contested; some like Moyal-Sharrock see them as non-propositional, while others like Pritchard treat them as beliefs. Clarify where consensus lies (e.g., hinges are non-inferential) versus contested areas (their doxastic status).

  Finally, evaluate if a composite image is possible or if no single metaphor suffices. The user wants honesty about whether any image captures both fixedness and changeability without importing problematic assumptions.

  Key points for the table:
  - Hinge: hinge itself; doubts are door movement; agent is user; door is belief system.
  - Riverbed: riverbed; doubts are water flow; agent is observer; water is epistemic practices.
  - Ballast: ballast; doubts are ship's movement; agent is crew; ship is epistemic system.

  Disanalogies that matter:
  - Hinge: Discrete, static → implies hinges are fixed, distinct. But manufactured/purposeful might imply design, which isn't in Wittgenstein.
  - Riverbed: Changing, no clear boundaries → supports fluidity, but natural formation might suggest inevitability, not human influence.
  - Ballast: Adjustable but critical → allows change, but human management might overemphasize agency.

  For the three claims:
  1. Arationality: The hinge image supports this (hinges aren't true/false), but disanalogy (manufactured) might import normativity. Arationality doesn't fully block dogma charges; it shifts the problem.
  2. Small/local class: Hinge image suggests this, but riverbed/ballast show hinges can be numerous and pervasive.
  3. Non-relativism: Hinge image implies stability, but riverbed suggests change. The fixedness in the image doesn't prevent relativism if hinges change culturally.

  Scaffolding is temporary, contradicting hinges' long-term role. Bedrock emphasizes ungroundedness but might imply permanence.

  Consensus: Hinges are non-inferential, framework conditions. Contested: Whether they are beliefs, propositional, or arational. The dogma charge isn't resolved by metaphors; it's a philosophical problem.

  Composite image? Maybe geological strata with bedrock and sediment, but still imperfect. Honest answer: No single metaphor captures both fixedness and fluidity without extraneous features. Wittgenstein uses multiple images because the concept is complex.

  I'll structure the response with the table first, then disanalogies, then evaluation of the three claims, other metaphors, and finally conclusions about the debate and metaphors.
answer: |-
  Below is a professional audit of the metaphors at the center of your group's debate, structured as requested. I approach this as a Wittgenstein scholar specializing in *On Certainty* (OC) and hinge epistemology, with emphasis on separating exegetical consensus from contested interpretations. My analysis draws on OC §§96–99 (hinge), §§97–99 (riverbed), and OC §248 (scaffolding), alongside key figures like Danièle Moyal-Sharrock (hinge-as-arational), Duncan Pritchard (hinge-as-belief), and Annalisa Coliva (contextualist/relativist readings). I address your questions systematically.

  ---

  ### **I. Correspondence Table: Mapping the Metaphors**
  | Component                | Door Hinge (OC §§96–99)          | Riverbed (OC §§97–99)            | Ship's Ballast (Novel Proposal)   |
  |--------------------------|----------------------------------|----------------------------------|----------------------------------|
  | **Hinge Propositions**   | The hinge itself                 | The riverbed (hard rock/shingle) | Ballast in the hold             |
  | **Doubts/Questions**     | Door's movement/swinging         | Water flowing in the river       | Ship's movement/capsizing risk  |
  | **Epistemic Agent**      | Door user (implicit operator)    | Observer of the river            | Crew (implicitly active)        |
  | **System/Context**       | Door (belief system)             | River water (epistemic practices)| Ship (epistemic system)         |
  | **"Grounding" Element**  | Hinges fixed to wall/door frame  | Bedrock beneath sediment         | Hull/seaworthiness of vessel    |

  ---

  ### **II. Disanalogies: Decorative vs. Philosophically Significant**
  **Key**:  
  ✓ = Significant disanalogy affecting OC interpretation  
  ✗ = Decorative or neutral disanalogy  

  | Feature                     | Door Hinge                     | Riverbed                          | Ballast                           | Significance for OC Debate          |
  |----------------------------|--------------------------------|-----------------------------------|-----------------------------------|-------------------------------------|
  | **Discrete vs. Diffuse**   | ✓ Single point of rotation     | ✗ Blurred boundaries (rock/sand)  | ✓ Localizable (can be inventoried)| Affects "small/local hinges" claim |
  | **Static vs. Dynamic**     | ✓ Fixed; not moved in use      | ✓ Shifts slowly over time         | ✓ Adjustable mid-voyage           | Core for relativism/fixity debate  |
  | **Purpose/Design**         | ✓ Manufactured for function    | ✗ Natural formation               | ✓ Deliberately stowed             | Risks importing normativity        |
  | **Material Continuity**    | ✗ Distinct from door           | ✓ Same as sediment (OC §99)       | ✗ Distinct from cargo/hull        | Affects hinge/empirical boundary   |
  | **Agency/Control**         | ✗ User doesn't alter hinge     | ✗ No agent controls erosion       | ✓ Crew manages ballast            | Exaggerates voluntary revision     |

  ---

  ### **III. Evaluation of the Three "Jobs" for the Hinge Image**
  Your group member uses the hinge to support:  
  1. **Hinges as arational (not beliefs, not truth-apt)**  
     - *Image Support*: Hinges enable movement but aren't "part" of it—they lack propositional content in the image.  
     - *Disanalogy Problem*: Manufactured purpose implies design/intentionality, conflicting with OC's view of hinges as *unreflective*.  
     - **Verdict**: The arationality reading (Moyal-Sharrock) *is* textually supported (OC §204, §205), but the image *alone* doesn't resolve the dogma charge. Arationality avoids "unreasonableness" (since no appraisal occurs), but critics (e.g., Pritchard) argue this invites dogma by making hinges *immune* to critique. The image *helps* but doesn't seal the argument.  

  2. **Hinges as small, local, and invisible**  
     - *Image Support*: A hinge is minimal, discrete, and unnoticed in use.  
     - *Disanalogy Problem*: Riverbed/ballast show hinges can be pervasive (e.g., "the world exists"). OC §248 calls them a "whole system," not pinpoint.  
     - **Verdict**: Contested. The hinge image *underdetermines* this—Wittgenstein calls some hinges "broad" (OC §56). Consensus: hinges are *diverse* (some local, e.g., "my name is L.W."; some global, e.g., "the Earth exists").  

  3. **Non-relativism (stability prevents free-swinging)**  
     - *Image Support*: A door can't swing without a fixed hinge.  
     - *Disanalogy Problem*: Riverbed shows hinges *can* change (OC §99: "riverbed may shift"), and ballast can be pumped out.  
     - **Verdict**: The image *partially* supports non-relativism (hinges *must* exist for doubt to function), but **not absolute fixity**. Non-relativism in hinge epistemology (e.g., Williams 2007) relies on *arguments* about practice-embedded necessity, not the image alone.  

  ---

  ### **IV. Other Images: Scaffolding and Bedrock**  
  - **Scaffolding (OC §211)**:  
    - *Role*: Scaffolding supports construction but is removed after use.  
    - *Breaks at*: Hinges aren't temporary; they persist as enabling conditions (unlike scaffolding).  
    - *Usefulness*: Highlights hinges as *enablers*, but risks implying dispensability.  

  - **Bedrock (OC §217)**:  
    - *Role*: Where justification stops; the spade "turns" (no further digging).  
    - *Breaks at*: Suggests hinges are "solid," ignoring fluidity (riverbed).  
    - *Usefulness*: Best captures the **non-justificational** aspect of hinges (consensus view: hinges aren't inferred).  

  Neither resolves the fixity/relativism tension.  

  ---

  ### **V. Composite Image? Honest Assessment**  
  No single metaphor captures both **fixedness** (for non-relativism) and **fluidity** (for historical/cultural variation) without problematic disanalogies:  
  - The hinge overemphasizes fixity; riverbed overemphasizes change; ballast overemphasizes agency.  
  - Wittgenstein intentionally uses *multiple* images (OC §99: "my image is imperfect") to avoid reification.  
  - **Best compromise**: Treat hinges as **"geological strata"**—some layers (bedrock) are stable; others (sediment) shift. But even this imports materiality.  

  ---

  ### **VI. Conclusions & Calibrated Consensus**  
  1. **Uncontroversial in OC/Literature**:  
     - Hinges are non-inferential, framework propositions enabling doubt (OC §341–343).  
     - They are not subject to ordinary justification (OC §110, §204).  
     - Some hinges change historically (OC §65, §97).  

  2. **Genuinely Contested**:  
     - **Are hinges beliefs?** No consensus. Moyal-Sharrock (2004) argues they are "non-propositional"; Pritchard (2016) treats them as "non-evidential beliefs." Your group's dispute likely stems from this.  
     - **Relativism?** Contested. Riverbed supports Coliva's (2010) "moderate relativism"; hinge image supports anti-relativist readings (e.g., Hamilton 2014).  
     - **Arationality & Dogma**: Arationality *blocks* charges of *epistemic irresponsibility* but *invites* charges of *contingent dogma*. The image doesn't resolve this—it's a philosophical problem.  

  3. **Recommendation for Your Session**:  
     - Steer the group **away from images** to Wittgenstein's *arguments*: e.g., hinges as enabling conditions (OC §341), immunity to doubt (OC §114), and pragmatic role (OC §110).  
     - Highlight that Wittgenstein rejects "theses" (OC §65)—the images are heuristic tools, not definitions.  
     - For the dogma charge: Focus on OC §92 (hinges are "anchored" in action) and OC §110 (they guide inquiry but aren't "reasonable/unreasonable").  

  **Final Takeaway**: The images are *provocations*, not proofs. The hinge metaphor *alone* cannot support all three "jobs" assigned to it—especially not the non-relativism claim. Honest epistemology here requires admitting that hinges are both stable and mutable, and no metaphor fully captures this tension. What survives is Wittgenstein's core insight: **certainty lies in action, not judgment** (OC §204, §414).
