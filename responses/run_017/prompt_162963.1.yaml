prompt: |-
  I am writing the decision-theoretic section of a paper on when an agent should stop gathering evidence, and I want the specification settled before I commit to a formalism. The setting is deliberately unfriendly to the textbook result: the agent is bounded, with a fixed attention budget, so buying one signal means not buying another, and its posteriors come from a fixed update procedure rather than from ideal conditioning; and some signals are public, in the sense that other agents whose later reactions matter will observe them too. Good's theorem, understood as the result that an ideal expected-utility maximizer cannot lose in expectation by conditioning on free evidence and gains only where the evidence would change what she does, settles very little here, so I want to know what I should be demanding of a measure of the value of information anyway.

  Write the desiderata, each with the case or consideration that makes it a requirement, and each marked as either non-negotiable or a preference of one approach. I have these pressures in mind, but reorganise, split, and add as you think right: recovery of expected-utility gain as the ideal, free, and ignorable limit; capacity to go negative, with the negative cases explained by one mechanism rather than collected as exceptions (my candidate is that information one cannot costlessly dispose of was never free, and I want to know whether that covers attention opportunity costs, public observability, and designs that perturb the system they measure, or whether one of those needs separate treatment); independence from how the signal is labelled or encoded, except where dependence on encoding is a real fact about a bounded updater; computability ex ante, from the agent's own situation, and decomposability across stages of a sequential design; and denomination in the agent's utility rather than in bits, variance, or money.

  Two things matter more than the rest of the list. Say which subset cannot be jointly satisfied by any single scalar, especially whether invariance under re-description is compatible with sensitivity to a bounded update procedure, and whether ex-ante computability from the agent's perspective is compatible with correctness about a strategic environment; if the list is unsatisfiable as one number, say what the deliverable should be instead, such as a family indexed by decision procedure or a pair of bounds. Then name the single requirement that does the most work excluding the standard proxies and say what it rules out. Close with a four-line scorecard for expected-utility gain, mutual information between signal and state, expected variance reduction, and probability that the optimal act changes.
reasoning: |-
  We are to write desiderata for a measure of the value of information (VoI) in a setting that is not the standard ideal setting. The agent is bounded, with a fixed attention budget (so opportunity costs matter), uses a fixed update procedure (not necessarily Bayesian conditioning), and some signals are public (so they affect other agents' actions which in turn affect the original agent). We want to recover the ideal case as a limit, allow negative VoI, be invariant to relabeling (except when the bounded updater matters), be computable ex ante, and be denominated in the agent's utility.

  We also have two main concerns: 
  1. Which subset of desiderata cannot be jointly satisfied by a single scalar? Specifically, is invariance under re-description compatible with sensitivity to the bounded update procedure? And is ex-ante computability compatible with correctness in a strategic environment?
  2. Name the requirement that does the most work in excluding standard proxies.

  Finally, we will provide a four-line scorecard for four measures: expected-utility gain, mutual information, expected variance reduction, and probability of changing the optimal act.

  Let's break down the desiderata:

  **Non-negotiable Desiderata:**
  1. **Utility Denomination (Non-negotiable):** The measure must be denominated in the agent's utility. This rules out measures in bits, variance, or money (unless money is linearly related to utility). This is because the ultimate goal is to make decisions that maximize the agent's utility.

  2. **Opportunity Cost Awareness (Non-negotiable):** The measure must account for the fact that using attention on one signal precludes using it on another. This implies that the measure must be able to be negative when the opportunity cost exceeds the benefit.

  3. **Public Signal Effect (Non-negotiable):** The measure must account for the effect of public signals on other agents' actions and how those actions affect the original agent. This is because in a strategic environment, the public signal might trigger reactions that are harmful to the agent.

  **Preference Desiderata:**
  4. **Recovery of Ideal Case (Preference):** In the limit of an ideal, unbounded agent (with free, costless, and ignorable evidence) the measure should reduce to the expected utility gain from conditioning on the signal.

  5. **Invariance to Signal Relabeling (Preference, except when boundedness matters):** The measure should not depend on how the signal is labeled or encoded, unless the bounded update procedure is sensitive to the encoding. For example, if the agent's update procedure depends on the format of the signal (e.g., visual vs. auditory), then the measure might depend on that.

  6. **Ex-Ante Computability (Preference):** The measure should be computable by the agent before observing the signal, based on the agent's current state of knowledge and the fixed update procedure.

  7. **Decomposability (Preference):** The measure should be decomposable across stages of a sequential design. This would allow the agent to plan a sequence of information acquisitions.

  8. **Unified Explanation for Negative VoI (Preference):** We prefer a measure that explains negative VoI through a single mechanism (like the agent not being able to costlessly dispose of information) that covers attention opportunity costs, public observability, and measurement perturbation. If one of these requires a separate mechanism, that should be noted.

  Now, addressing the two main concerns:

  **Which subset cannot be jointly satisfied?**
  - **Invariance under re-description vs. Sensitivity to bounded update:** These are in tension. If the update procedure is bounded and sensitive to the encoding (e.g., the agent has a neural network that processes images differently than text), then we cannot have invariance under re-description. Thus, they are not compatible in general. We must choose: either we break invariance when the bounded update procedure is sensitive to encoding, or we ignore the boundedness in the measure. But ignoring boundedness would be unfaithful. Therefore, we must condition invariance on the update procedure: if the update procedure is invariant to a particular re-description, then so should the VoI measure. This means that the measure cannot be a single scalar without indexing it to the update procedure. Thus, we might need a family of measures indexed by the update procedure.

  - **Ex-ante computability vs. Correctness in strategic environments:** In a strategic environment, the value of a public signal depends on how others will react. If the agent is to compute the VoI ex ante, they must have a model of how others will react. But if the other agents are also strategic and their reactions depend on the signal, then the agent must form beliefs about the equilibrium that will be played. This equilibrium might be complex and not computable ex ante by a bounded agent. Moreover, if the agent's own information acquisition strategy is part of the equilibrium, then the ex-ante computation becomes even harder. Thus, we cannot have both ex-ante computability (in the sense of being a simple function) and correctness in arbitrary strategic environments without making strong assumptions (like common knowledge of rationality and unique equilibrium). Therefore, we might have to relax ex-ante computability to being computable under a fixed model of others' behavior (which the agent must have) or accept that the measure is only approximately computable.

  Given these tensions, a single scalar might not suffice. We propose that the deliverable should be a family of measures indexed by:
  - The update procedure (to account for boundedness)
  - A model of the strategic environment (to account for public signals and other agents)

  Alternatively, we could have a pair of bounds: a lower bound and an upper bound on the VoI, computed under different assumptions about the update and the strategic reactions.

  **The requirement that does the most work in excluding standard proxies:**
  The requirement that **VoI must be denominated in the agent's utility** does the most work. It immediately rules out mutual information (which is in bits), expected variance reduction (which is in squared units of the state and does not account for the utility function), and probability of changing the optimal act (which doesn't account for the magnitude of utility changes). It forces the measure to be aligned with the agent's actual goals.

  Now, the four-line scorecard:

  We evaluate four measures for the bounded, strategic setting:

  1. **Expected Utility Gain (EUG):** 
     - *Ideal Recovery:* Perfect in the ideal case, but may not account for bounded update or public signals.
     - *Negative VoI:* Can be negative if the opportunity cost is included, but may not naturally account for strategic effects without explicit modeling.
     - *Invariance:* Invariant to relabeling if the update procedure is Bayesian and the utility function is fixed, but may break with bounded updates that are encoding-sensitive.
     - *Computability:* Computable ex ante in the ideal case, but in strategic settings requires solving for equilibria which may be hard.

  2. **Mutual Information (MI):**
     - *Ideal Recovery:* In the ideal case with a linear utility in log-odds, MI can relate to EUG, but generally not denominated in utility.
     - *Negative VoI:* Always non-negative, so cannot account for opportunity costs or strategic harms.
     - *Invariance:* Invariant to relabeling by definition.
     - *Computability:* Computable ex ante, but not denominated in utility.

  3. **Expected Variance Reduction (EVR):**
     - *Ideal Recovery:* Only relates to EUG for quadratic loss utilities; otherwise, not generally.
     - *Negative VoI:* Always non-negative (variance decreases in expectation) so cannot be negative.
     - *Invariance:* Invariant to linear re-encodings, but not to nonlinear ones? (Variance is sensitive to the scale of the state variable.)
     - *Computability:* Computable ex ante, but not utility-denominated.

  4. **Probability of Changing the Optimal Act (PCOA):**
     - *Ideal Recovery:* In the ideal case, it is a crude proxy for EUG; it ignores the magnitude of utility differences.
     - *Negative VoI:* Always non-negative (a change might be for the worse, but the probability itself is non-negative) so cannot be negative.
     - *Invariance:* Invariant to relabeling of the signal if the update procedure is, but again, boundedness may break this.
     - *Computability:* Computable ex ante, but not utility-denominated.

  In summary, only EUG has the potential to meet all the desiderata if appropriately extended to account for bounded updates and strategic environments, but it becomes more complex. The other measures fail on denomination in utility and the possibility of negative values.

  **Final Deliverable:**
  Given the tensions, we propose that the measure should be a family of expected utility gains, indexed by:
  - The update procedure (which may be non-Bayesian) that the agent uses.
  - A model of the strategic environment (which specifies how other agents react to public signals).

  This family can then be used to compute the VoI for a particular signal in a particular context. The agent would use the update procedure they actually have and a model of the strategic environment they believe in.

  If a single scalar is required, then we must make strong assumptions (like a unique equilibrium and a known update procedure) and compute the EUG under these. But the family approach is more general.

  We close by noting that the requirement of utility denomination is the one that does the most work in excluding the standard proxies (MI, EVR, PCOA).
answer: |-
  ### Desiderata for a Measure of the Value of Information (VoI)  
  In a setting with bounded agents (fixed attention budget, non-ideal updates) and public signals (affecting strategic interactions), the desiderata for VoI are as follows. **Non-negotiable** requirements are essential; **preference** requirements reflect methodological priorities but admit alternatives.  

  1. **Utility denomination (non-negotiable)**  
     VoI must be denominated in the agent’s *utility*, not bits, variance, or money.  
     *Rationale*: The agent’s goal is utility maximization; proxies like mutual information or variance reduction ignore nonlinear utility and misprioritize gains.  

  2. **Opportunity cost sensitivity (non-negotiable)**  
     VoI must be negative when acquiring a signal *reduces* expected utility net of attention costs (e.g., by forgoing a better signal).  
     *Rationale*: Attention is scarce; VoI must reflect trade-offs explicitly, not as "exceptions."  

  3. **Public signal externalities (non-negotiable)**  
     VoI must incorporate how *publicly observed* signals affect other agents’ actions and their impact on the focal agent’s utility.  
     *Rationale*: In strategic settings, public signals can trigger harmful responses (e.g., revealing intentions incurs retaliation).  

  4. **Recovery of ideal limit (preference)**  
     As bounds vanish (free attention, ideal updates), VoI should approach the expected utility gain from Bayesian conditioning.  
     *Rationale*: Ensures consistency with Good’s theorem in ideal cases without assuming it universally.  

  5. **Encoding invariance (preference, conditional)**  
     VoI should be invariant to signal relabeling *unless* the agent’s update procedure is sensitive to encoding (e.g., bounded learners struggle with certain formats).  
     *Rationale*: VoI should capture informational content, not presentation—except when presentation affects bounded agents.  

  6. **Ex-ante computability (preference)**  
     VoI must be computable *before* observing the signal, using the agent’s beliefs, update procedure, and model of others’ behavior.  
     *Rationale*: Agents need forward-looking measures for decision-making under bounded resources.  

  7. **Decomposability (preference)**  
     VoI should support additive or sequential decomposition (e.g., VoI of a two-stage design equals VoI of first signal plus conditional VoI of the second).  
     *Rationale*: Necessary for sequential attention allocation with a fixed budget.  

  8. **Unified negativity mechanism (preference)**  
     Negative VoI should arise *only* from costs of irreversibility: attention opportunity costs, public signal distortions, or measurement perturbations.  
     *Rationale*: These share a core theme—information isn’t free if it can’t be discarded or acquired without side effects. No separate treatment is needed.  

  ---

  ### Critical Tensions and Deliverables  
  **Which subset cannot be jointly satisfied by a single scalar?**  
  - **Encoding invariance vs. sensitivity to bounded updates**: These conflict. Invariance assumes information is abstract, but bounded updates (e.g., heuristic processing) may depend on encoding. *No scalar can satisfy both* without indexing to the update procedure.  
  - **Ex-ante computability vs. strategic correctness**: In strategic environments, VoI depends on others’ *equilibrium responses* to public signals. Ex-ante computability requires the agent to predict these responses, but bounded agents may lack the resources to solve for equilibria. *No scalar can guarantee both* without assuming simplified strategic models (e.g., fixed reaction functions).  

  **Unsatisfiability as a single number**:  
  Given these tensions, **no single scalar satisfies all desiderata**. Use a **family of measures indexed by the agent’s update procedure and a model of others’ behavior** (e.g., VoI(update_proc, reaction_model)). This accounts for boundedness and strategic complexity while preserving ex-ante computability under explicit assumptions.  

  **Most exclusionary requirement**:  
  **Utility denomination** does the most work in excluding standard proxies:  
  - Rules out *mutual information* (bits ignore utility curvature), *variance reduction* (only optimal for quadratic loss), and *probability of act change* (ignores magnitude of utility gains/losses).  
  - Forces VoI to respect the agent’s actual goals, not statistical artifacts.  

  ---

  ### Four-Line Scorecard for VoI Proxies  
  | **Measure**               | **Utility Denomination?** | **Handles Negativity?**       | **Encoding-Invariant?** | **Ex-Ante Computable?** |  
  |----------------------------|---------------------------|-------------------------------|--------------------------|--------------------------|  
  | **Expected utility gain**  | Yes (ideal)               | Only with explicit cost model | Yes (if updates are ideal) | Yes (but not for public signals without equilibrium) |  
  | **Mutual information**     | No (bits)                 | Never (always ≥0)             | Yes                      | Yes                      |  
  | **Expected variance reduction** | No (squared errors)    | Never (always ≥0)             | Scale-dependent          | Yes                      |  
  | **Prob. optimal act changes** | No (unitless)          | Never (always ≥0)             | Yes (if updates are ideal) | Yes                      |  

  **Summary**:  
  - **Expected utility gain** is the *only* proxy that can be adapted to the bounded/strategic setting (via the indexed family approach) but requires augmenting with cost models and strategic assumptions.  
  - All other proxies fail utility denomination and negativity, rendering them inadequate for the core requirements.
