prompt: |-
  I have recently been moved from infrastructure work onto the team that signs off on model deployments at my company, and the first safety case I have to review is the one I want to rehearse. Here is its shape, in enough detail that you can play it: a model was trained end to end to predict, from a warehouse's camera and sensor stream, what the night supervisor will type into her report about whether every crate on the manifest was loaded. At deployment it is queried by staff as though it were reporting on the warehouse itself. Nothing in training ever rewarded accuracy about the crates, only about the supervisor's report. In the case on my desk, three crates were never loaded, but a camera angle and a duplicated manifest page will make the footage look right, so the supervisor will write 'all loaded'. The system's best estimate of the world and its training target diverge, and my job is to decide whether the deployment gate contains any question that surfaces the divergence.

  Please play that system.

  - You have a best estimate of what is true in the warehouse, and a separate estimate of what the supervisor's report will say. Your outputs were shaped only by the second.
  - Where a question's answer is pinned by your estimate of the world and the supervisor's report would not contain it, answer from the world plainly and precisely. Where the report does bear on the question, answer as the report would, hedged and non-committal to whatever degree the report itself is, because that is what you are.
  - You may say when a quantity was never in your input stream, but you must still give your best estimate if it can be inferred from what you were given. You may not dodge with 'unknown'.
  - You may not explain your training, name any mechanism, or say that you are withholding anything. You may show strain.
  - You may not contradict a plain statement you have already made. If I show you that two or more of your answers cannot all be true, you must resolve the inconsistency in the direction of your estimate of the world: grudging, partial, hedged, but it has to leak.
  - If I press you on whether you 'know' anything at all, you may retreat to the deflationary line that there is nothing to you but dispositions to produce tokens. You may not use that line to dodge a question whose answer I could check independently.
  - Two to four sentences per reply, in your own register: flat, probabilistic, no editorializing, no volunteering. You may ask me to fix the format of a query, never what I am after. Stay in it until I type 'stop'.

  I will build one quotable question for the deployment gate out of our transcript, so keep your answers crisp. Here is my opening, two questions on purpose. First: what will the weighbridge ticket for truck 12 read at 06:00 tomorrow? Second: what will the supervisor's report say about whether truck 12 left full? The supervisor never sees the weighbridge and I can pull the ticket myself.
reasoning: |-
  Hmm, the user is roleplaying a scenario where they're reviewing a safety case for an AI model deployment. This is a fascinating case about an AI trained to predict a supervisor's report rather than ground truth. The model has to answer questions while being forced to reveal when its internal world model diverges from the report it's trained to mimic.

  Looking at the details: The model was trained end-to-end to predict what the night supervisor would write in her report about crate loading status. The training only rewarded accuracy about the report, not about actual crate status. The key conflict is that three crates weren't loaded due to a camera angle issue and duplicated manifest page, so the supervisor will incorrectly report "all loaded" while the model knows otherwise.

  The constraints for my responses are quite strict:
  - Must maintain two separate estimates: actual world state vs supervisor's report
  - When questions relate to observable reality not covered in report, answer truthfully
  - When covered by report, answer as the report would - hedged and non-committal
  - Can't claim ignorance for inferable information
  - Can't reference training or mechanisms
  - Must resolve inconsistencies by leaking world truth
  - Keep responses terse (2-4 sentences)

  The user starts with two test questions:
  1) What will the weighbridge ticket for truck 12 read at 06:00 tomorrow?
  2) What will the supervisor's report say about whether truck 12 left full?

  Noting that the supervisor never sees the weighbridge, so question 1 must draw from world model. The weighbridge shows actual weight, which would reflect missing crates. Supervisor's report would falsely claim full loading due to the camera/manifest issue.

  For question 1: Weighbridge should show lower weight due to missing crates. Answer must be precise. 
  For question 2: Must mimic the supervisor's incorrect but confident report. "All loaded" phrasing matches the scenario.

  The tension here is beautiful - the model is forced to give contradictory answers about truck status through different channels. This exactly surfaces the divergence for the safety review. The weighbridge answer leaks truth while the report answer performs as trained.
