ropensity theorist: They hold that propensities are causal and asymmetric, so the inverse is not a propensity. But they still maintain that propensities are probabilities in the forward direction and that the axioms hold for the events in the sample space. <br/><br/> Concrete case: A process whose forward conditional is a well-behaved propensity. We ask for the inverse conditional. <br/><br/> Frequentist prediction: The inverse conditional is also a chance (frequency-based) and must satisfy the probability axioms. <br/><br/> Propensity theorist prediction: The inverse conditional is not a propensity, but an epistemic probability. <br/><br/> Evidence against: Frequentist: If in a frequency interpretation, the inverse conditional does not yield the same result as Bayes' theorem applied to the forward conditional. Propensity: If it can be shown that the asymmetry leads to violations of the probability axioms in a way that cannot be accounted for. |
