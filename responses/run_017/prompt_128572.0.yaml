  ### Joint Statement on Objective Chance: Frequentist and Single-Case Propensity Perspectives

  **Preamble**  
  We, a frequentist and a single-case propensity theorist, have engaged in adversarial collaboration to clarify our agreements and disagreements regarding objective chance. Both parties reject subjectivist interpretations (e.g., chance as reducible to credences or evidence). We operate under a stipulated empirical finding: in the actual world, every chance setup has at most finitely many instantiations—some are repeated finitely (but never infinitely) often, and some exactly once. This finiteness constraint is non-negotiable in our analysis. Below, we outline points of consensus, followed by a clear articulation of residual disagreements, including concrete cases and potential counterevidence.

  #### Section 1: Points of Agreement  
  Both parties endorse the following claims:  

  1. **Single-case chance attributions are intelligible and non-trivial**: Assertions like "the chance of outcome O in setup S is p" (where S may occur only once) are meaningful, truth-apt, and not invariably true or false (e.g., "chance of heads in this coin toss is 0.5" is substantive).  
  2. **Chance is objective and non-reducible**: Objective chance is a mind-independent feature of the world. It is not reducible to any agent's credences, beliefs, evidence, or epistemic limitations.  
  3. **Finiteness is not decisive**: The finiteness stipulation (no infinite sequences, single-case setups exist) does not inherently favor frequentism or propensity theory. Both theories can coherently address finite and single-case scenarios without collapsing into subjectivism.  
  4. **Common theoretical role**: Chance objectively constrains rational credence via the Principal Principle (or its variants) and explains empirical frequencies where they exist.  

  This agreement establishes a shared foundation. However, fundamental disagreements persist, as detailed in the table below.

  #### Section 2: Residual Disagreements  
  The table summarizes key cruxes, each stated neutrally. For each crux, we provide:  
  - **Crux**: The core point of contention.  
  - **Frequentist position**: Wording acceptable to a frequentist.  
  - **Propensity position**: Wording acceptable to a single-case propensity theorist.  
  - **Concrete case**: A scenario both accept as relevant.  
  - **Predictions**: What each side asserts about the case.  
  - **Evidence against own view**: What each would accept as counterevidence.  

  | Crux | Frequentist Position | Propensity Position | Concrete Case | Frequentist Prediction | Propensity Prediction | Evidence Against Own View |
  |------|----------------------|---------------------|--------------|------------------------|------------------------|---------------------------|
  | **1. Uniqueness of hypothetical sequences**<br><br>Can the frequentist's limiting-frequency analysis pick out a unique hypothetical infinite sequence for a given setup, or is the sequence irreducibly interest-relative, requiring external specification? | "The relevant hypothetical sequence for a chance setup is uniquely determined by its intrinsic physical properties (e.g., initial conditions, laws). Contextual interests play no role in defining the sequence; it is objectively fixed." | "Hypothetical sequences are irreducibly interest-relative. The sequence must be supplied contextually (e.g., by pragmatic or explanatory goals), as the physical setup alone cannot specify a unique sequence." | **Single island coin toss**: A fair coin is tossed once on an isolated island that sinks immediately after, destroying the setup. | "The chance of heads is 0.5, defined by the limiting frequency in the unique hypothetical sequence of tosses with this coin’s physical properties (mass, shape, etc.)." | "The chance of heads is 0.5, an intrinsic property of the setup, independent of sequences. Any hypothetical sequence (e.g., varying environmental factors) is context-dependent and not unique." | **Frequentist**: Empirical demonstration that equally natural descriptions of the setup yield divergent sequences (e.g., two valid physical models imply different limits).<br>**Propensity**: Proof that single-case chances cannot be assigned without implicit reference to frequencies (e.g., via causal laws). |
  | **2. Determinate strength of single-case dispositions**<br><br>Can a single-case propensity (disposition) have a determinate strength without presupposing that it would generate matching frequencies in repeated trials? | "A disposition’s strength is not metaphysically determinate independently of the frequencies it would produce. Single-case propensities are only meaningful as shorthand for what frequencies would arise in repetitions." | "A single-case disposition has a determinate strength (e.g., an atom’s decay propensity) intrinsic to the setup. Frequencies manifest this strength but do not define it." | **Single synthetic atom**: A single unstable atom of a newly synthesized isotope, which will never be re-created (no repetitions possible). | "The chance of decay in time t is the limiting frequency in a hypothetical sequence of identical atoms. Without this, 'chance' is undefined or epistemic." | "The atom has an intrinsic propensity (e.g., 0.3 chance of decay in t), a categorical property independent of actual or hypothetical frequencies." | **Frequentist**: Discovery of a law-like physical quantity (e.g., quantum mechanical) that assigns a determinate single-case probability without frequency reducibility.<br>**Propensity**: Evidence that propensity attributions systematically fail to predict frequencies in new setups (e.g., same disposition yields erratic frequencies). |
  | **3. Time-asymmetry and probability axioms**<br><br>Can propensities (causal and time-asymmetric) satisfy probability axioms, given that inverse conditionals (e.g., inferring causes from effects) do not represent propensities? | "Probabilities must satisfy standard axioms (e.g., reversibility via Bayes’ theorem). Propensities violate these by being time-asymmetric; thus, they are not probabilities." | "Propensities are time-asymmetric probabilities. The axioms hold for causal conditionals; inverse conditionals reflect epistemic probabilities, not propensities." | **Forward vs. inverse conditional**: A coin-flip process with a well-defined forward propensity (e.g., P(heads \| initial conditions)). What is P(initial conditions \| heads)? | "P(initial conditions \| heads) must be a frequency-based chance (e.g., limiting frequency of initial conditions given heads). Asymmetry violates probability axioms if propensities are fundamental." | "The forward conditional is a propensity (e.g., P(heads \| initial conditions) = 0.5). The inverse is epistemic (e.g., credence about initial conditions) and not a propensity." | **Frequentist**: A case where time-asymmetric propensities yield inconsistencies in Bayesian updating (e.g., conflicts with the Principal Principle).<br>**Propensity**: Proof that time-asymmetry prevents propensities from grounding rational inference (e.g., inability to handle retrodiction without ad-hoc assumptions). |
  | **4. Chance and indeterminism**<br><br>Does genuine chance require indeterminism, such that deterministic setups with chaotic dynamics and smooth initial-condition distributions produce frequencies but not chances? | "Genuine chance requires indeterminism. Deterministic systems (even with chaotic dynamics) generate frequencies reflecting initial conditions, not chances." | "Chance can arise in deterministic systems via chaotic dynamics and objective distributions over initial conditions. Propensities are grounded in the setup’s structure." | **Deterministic coin-flipper**: A mechanical flipper run 1 million times with micro-jittered initial conditions under known deterministic laws, yielding a 0.5 frequency of heads. | "This setup has no objective chance—only a frequency. Outcomes are determined; the ‘chance’ is epistemic (reflecting ignorance of initial conditions)." | "The setup has an objective chance (e.g., 0.5) due to the propensity from the distribution over initial conditions and chaotic dynamics." | **Frequentist**: A deterministic system where chances are empirically indispensable (e.g., required by laws of physics) for prediction/explanation.<br>**Propensity**: Proof that deterministic chances reduce to epistemic probabilities in all contexts (e.g., no explanatory power beyond frequencies). |

  #### Section 3: Verbal vs. Substantive Disagreements  
  We identify one verbal element: the term **"chance"** itself. The propensity theorist uses it broadly to include deterministic systems with chaotic dynamics and objective initial-condition distributions, while the frequentist reserves it for indeterministic systems. This reflects a deeper, substantive dispute about ontology: whether chance requires indeterminism (frequentist) or can be grounded in causal structures like propensities (propensity theorist). The verbal aspect arises because both agree on predictions (e.g., frequencies) and normative roles (e.g., guiding credences) in cases like the deterministic coin-flipper. However, the disagreement is not merely terminological, as it concerns what exists in nature (indeterminism vs. structured dispositions) and what explains frequencies (laws vs. propensities). If future work shows that deterministic and indeterministic systems are empirically indistinguishable in all chance-related behaviors, the dispute may shift to metaphysics, but it remains substantive.  

  **Signed,**  
  Frequentist Representative  
  Single-Case Propensity Theorist Representative  

  ---  
  *This statement reflects a good-faith adversarial collaboration, clarifying common ground and persisting divisions. We encourage further empirical and philosophical work on the concrete cases to resolve these cruxes.*
