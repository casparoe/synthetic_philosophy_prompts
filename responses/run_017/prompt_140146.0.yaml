answer: |-
  Bottom line: You're framing a false choice between total automation and human paralysis—we keep the human in the loop *by designing decision architectures that leverage speed without surrendering judgment*.  

  Listen, your "ninety-second window" panic assumes the human has to *start* deliberating when the alert flashes. That's bullshit. Brinkmanship isn't improvised during those ninety seconds—it’s baked in *beforehand* through force posture, declaratory policy, and crucially, **pre-scripted response menus** loaded during slower-burning crises. (Contested: How much actual pre-delegation existed in Cold War SAC or Soviet procedures is debated, but the *principle* of pre-defined options is settled crisis-management practice.) A leader isn’t coding live; they’re choosing from terrible-but-prepared options like "launch-on-warning of *only* the retaliatory subs we’ve already surged," or "hold everything but go to DEFCON 1." The *brinkmanship* happens when you *telegraph* shifting to a hair-trigger posture days earlier—making the adversary sweat your machine’s reliability.  

  And on your probe point: Sure, they might estimate my false-alarm rate. But they can’t know *which* decoy swarm or glitch I just decided treats as "real" this week because I’ve got humans constantly adjusting classifier sensitivity *between* crises. (Settled: Adversaries consistently misjudged alert levels and red lines even in slower Cold War crises—see ’73 Mideast alert.) The whole game rests on them never being sure if *this* probe is the one that crosses *my* machine’s threshold. That uncertainty *is* the deterrent—not some perfectly calibrated risk dial.  

  So my alternative? Humans hold the *final* decision, but they exercise it via rapid *selection*, not contemplation. The adversary knows because we scream through backchannels: "Our birds are set to *this* sensitivity now—fuck around if you dare." Your turn: Isn’t compressing everything into ninety seconds just bad engineering? Why build a system that gives leaders *less* decision-time than a microwave burrito?
