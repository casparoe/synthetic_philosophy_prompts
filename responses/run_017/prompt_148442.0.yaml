  ### **Leaf Key & Notes:**  
  - **Leaf A**: Deflationist/Mechanist (bounded)  
  - **Leaf B**: Mechanist (inconsistent/unsound)  
  - **Leaf C**: Mechanist (non-self-identifying)  
  - **Leaf D**: Anti-mechanism (via consistency proof)  
