answer: |-
  Below is a concise, one-page decision tree designed to clarify positions on holding a nation responsible for war, using 1914 as the core example. It focuses on concrete cases to separate *causal contribution*, *moral blameworthiness*, *liability to pay*, and *answerability*. The tree starts with your "pet distinction" (counterfactual basis) and includes two non-1914 cases (drone strikes, slavery-era university) to test for consistency. Each branch question is a concrete act or decision, and leaves are labeled with positions, their awkward commitments, and "tells" (what annoys holders of that position). Empty regions in the logical space are marked with notes.  

  ### **Decision Tree: What Does It Mean to Hold a Nation Responsible?**  
  *Start at the top and follow the branches based on your answers to each question.*  

  1. **When judging a decision (e.g., Germany’s “blank cheque” to Austria-Hungary), do you ask “Could they have done otherwise?” using only what was knowable in 1914, or with today’s hindsight?**  
     - **A: Only 1914 knowledge** → Go to Q2.  
     - **B: With hindsight** → Go to Q2.  
     *(This choice often silently shapes later answers but doesn’t define a leaf alone.)*  

  2. **If a drone strike ordered by a chain of command (e.g., US military) kills civilians, must the nation (USA) as a whole pay compensation and apologize?**  
     - **A: Yes, the nation is liable** → Go to Q3.  
     - **B: No, only individuals in the chain** → Go to Q4.  

  3. **Should a university remove a building name and apologize for a slavery-era benefactor, even if slavery was legal then?**  
     - **A: Yes, remove and apologize** → You emphasize *liability to pay/answer* regardless of era. Go to Q5.  
     - **B: No, it was legal then** → You reject inherited obligations. Go to Q5.  

  4. **Can a great-grandchild of a WWI soldier feel shame about the war?**  
     - **A: Yes, the population shares blame** → Go to Q6.  
     - **B: No, only leaders or systems do** → Go to Q7.  

  5. **If a state no longer exists (e.g., Austria-Hungary), should its successor (Austria) pay reparations for WWI damages?**  
     - **A: Yes, it inherits liability** → Go to Q8.  
     - **B: No, the dead state’s blame died with it** → Go to Q9.  

  6. **In a school textbook, should WWI’s outbreak emphasize one state’s primary blame or shared responsibility?**  
     - **A: One state (e.g., Germany)** → **Leaf: German-primacy**.  
     - **B: Shared by all major powers** → **Leaf: Shared responsibility**.  

  7. **Does the current German government owe an explanation for 1914 decisions?**  
     - **A: Yes, the nation must answer** → **Leaf: Blame-the-population**.  
     - **B: No, only the 1914 elite** → **Leaf: Blame-the-elite**.  

  8. **Was WWI primarily caused by state actions or the international system (alliances, militarism)?**  
     - **A: State actions** → Go to Q6.  
     - **B: The system** → **Leaf: Structural/systemic**.  

  9. **Is assigning blame for 1914 mainly a tool for present goals (e.g., peace), not historical truth?**  
     - **A: Yes, blame is a tool** → **Leaf: Forward-looking instrumentalism**.  
     - **B: No, blame reflects truth** → Go to Q10.  

  10. **Can a nation be blamed if it contributed little causally (e.g., Belgium in 1914)?**  
      - **A: Yes, if morally reckless** → **Leaf: Moral strictness** (empty region).  
      - **B: No, contribution matters** → **Leaf: Eliminativism (only individuals)**.  

  ---

  ### **Leaves (Positions) & Their Profiles**  
  *Each leaf is defined by a combination of answers. "Awkward commitment" = hardest implication. "Tell" = what annoys holders.*  

  - **German-primacy** (e.g., Fischer-like):  
    - *Awkward commitment*: Must argue that other powers’ actions (e.g., Russian mobilization) were reactive, not equally reckless.  
    - *Tell*: Annoyed by "All sides were guilty" arguments.  

  - **Shared responsibility** (e.g., Clark-like):  
    - *Awkward commitment*: Must accept your own nation (if involved) shares blame, even if it "didn’t start it."  
    - *Tell*: Annoyed by finger-pointing at one state.  

  - **Structural/systemic**:  
    - *Awkward commitment*: Cannot praise any state for "good" actions (e.g., diplomacy) without noting the system constrained them.  
    - *Tell*: Annoyed by debates about leaders’ intentions.  

  - **Blame-the-elite**:  
    - *Awkward commitment*: Modern leaders can be blamed for old wars, but ordinary people get a pass (e.g., no German shame today).  
    - *Tell*: Annoyed by national apologies (e.g., "Why apologize for the Kaiser?").  

  - **Blame-the-population**:  
    - *Awkward commitment*: Citizens today inherit shame (e.g., a German *must* feel WWI shame), but not necessarily liability.  
    - *Tell*: Annoyed by "My ancestors were just following orders" defenses.  

  - **Eliminativism (only individuals)**:  
    - *Awkward commitment*: War reparations are unjust—only dead leaders could pay, and successor states shouldn’t.  
    - *Tell*: Annoyed by collective terms like "Germany wanted war."  

  - **Successor-state-pays-but-isn't-blamed**:  
    - *Awkward commitment*: Austria must pay for Austria-Hungary’s war debts, but calling Austrians "guilty" is wrong.  
    - *Tell*: Annoyed by conflating reparations with moral apology.  

  - **Forward-looking instrumentalism**:  
    - *Awkward commitment*: Assigning "false" blame (e.g., Versailles’ war-guilt clause) is fine if it prevents future wars.  
    - *Tell*: Annoyed by historical accuracy debates missing present impacts.  

  - **Moral strictness** (marked *nobody actually holds this*):  
    - *Why empty?* Incoherent—blaming a state (e.g., Belgium) with low causal role requires ignoring facts.  
    - *Awkward commitment*: Belgium is as guilty as Germany for "failing to prevent" war.  

  ---

  ### **Diagnostic Notes**  
  - **Conflation solved**: The tree separates the 4 key concepts:  
    - *Causal contribution* (Q5, Q10)—e.g., "Who made war inevitable?"  
    - *Moral blameworthiness* (Q4, Q7)—e.g., "Who should feel shame?"  
    - *Liability to pay* (Q2, Q3, Q5)—e.g., "Who owes reparations?"  
    - *Answerability* (Q7)—e.g., "Who must explain?"  
  - **Mixed combinations forced**:  
    - Successor states (Q5) can pay without being blamed (e.g., Austria).  
    - Drone strikes (Q2) can make a nation liable (pay) but not blameworthy (no shame).  
  - **Indistinguishable leaves**:  
    - *German-primacy* and *Shared responsibility* can’t be split if users skip Q6. **Extra separator**: "Did any state *want* war in 1914?" (A: Yes → German-primacy; A: No → Shared).  
    - *Blame-the-elite* and *Eliminativism* overlap if users reject all collectives. **Extra separator**: "Can a leader’s apology (e.g., for colonialism) count if the nation doesn’t back it?" (A: Yes → Blame-the-elite; A: No → Eliminativism).  
  - **General vs. specific views**: The non-1914 cases (Q2–Q3) expose inconsistencies (e.g., if you blame Germany but exonerate the US for drone strikes).  

  **Purpose**: Two people who say "Germany was mainly to blame" may land on different leaves (e.g., *German-primacy* = causal and moral; *Forward-looking* = blame as a tool). Those saying "nobody was to blame" may mean *Structural* (no agents) or *Eliminativism* (only individuals). Use the tree to map where they diverge.  

