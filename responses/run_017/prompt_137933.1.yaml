  3. Causal contribution: In a chain of events (e.g., the mobilization orders), does a high degree of causal contribution (without which the war wouldn't have happened) automatically imply moral blameworthiness?

  4. Moral blameworthiness: For an act that foreseeably risked war (e.g., Russia's mobilization), does the state bear moral blame if the decision was made with the intention of aggression? (Separates causation from blame.)

  5. Liability to pay reparations: Should the state (or its successor) pay reparations for damages caused by the war, even if it wasn't the most blameworthy? (Separates blame from liability.)

  6. Answerability: Who must provide an explanation? (e.g., does the current German government owe an explanation for the actions of the Kaiser's government in 1914?)

