answer: |-
  **Bottom line: The full desiderata list is jointly unsatisfiable; you must sacrifice either carving-invariance or the "number of continuations matters" in duplication cases, and all rules fail non-negotiable requirements in infinite worlds.**  

  ### Desiderata & Cases (Non-negotiable [NN] / Preference [P])  
  1. **Carving-invariance [NN]**:  
     - *Requirement*: Credences shouldn't shift based on arbitrary observer-counting conventions (e.g., counting time-slices vs. whole persons).  
     - *Why*: Prevents self-serving ontology changes. Breaks SIA (which assumes a privileged observer partition) and Halfing (often relies on "centered worlds").  
     - *Failure consequence*: Rules become untrustworthy for agents; ontology debates dominate epistemology.  

  2. **No armchair cosmology [P]**:  
     - *Requirement*: Mere existence shouldn’t massively boost speculative large-universe hypotheses.  
     - *Why*: Preserves the role of empirical evidence. Violated by SIA (e.g., presumptuous philosopher wins).  
     - *Status*: Preference of anti-SIA camp; SIA proponents accept it as a feature.  

  3. **Staggered arrival [NN]**:  
     - *Requirement*: Temporal non-overlap shouldn’t affect credences. If you exist, you should weight worlds by their *total* observer count, not simultaneous ones.  
     - *Why*: Agents care about their place in history, not co-present peers. Breaks rules requiring temporal cohorts (e.g., some SSA variants).  
     - *Failure consequence*: Credences depend on arbitrary time-slicing.  

  4. **Duplication lottery [NN]**:  
     - *Requirement*: Pre-scan, your credence for "two continuations exist" should be 0.5. After waking, each continuation should have credence 0.5 that the coin was heads (one continuation).  
     - *Why*: Ensures decision-theoretic coherence. Bets must align with precommitments to avoid money pumps.  
     - *Conflict*: Directly opposes carving-invariance. "Number of continuations matters" is a *consequence* of treating agents as instances, not a primitive.  

  5. **Big/messy worlds [NN]**:  
     - *Requirement*: Rule must handle infinities/undefined totals without returning 0, 1, or NaN.  
     - *Why*: Real cosmologies may have infinite observers. Breaks *all* standard rules (SSA/SIA/halfing).  
     - *Failure consequence*: Rule is inapplicable to plausible universes.  

  ### Tensions & Tradeoffs  
  - **Carving-invariance vs. Duplication lottery**: Mutually exclusive.  
    - Carving-invariance demands observer-counting be ontology-invariant.  
    - Duplication requires counting *continuations* (a specific ontology).  
  - **Infinities break all rules**: No known solution satisfies NN5.  
  - **Staggered arrival vs. SSA**: SSA typically fails NN3 by requiring "reference classes" of coexisting observers.  

  ### Which Desideratum Does the Most Work?  
  **Duplication lottery (NN4)**. It forces SIA-like behavior (weighting by number of observer-moments) and directly conflicts with carving-invariance, while ruling out:  
  - **SSA**: Assigns 2/3 credence to "one continuation" post-fission (violates NN4).  
  - **Halfing**: Treats fission as a single agent, mispricing bets.  

  ### Rule Scorecard  
  | Rule       | Carving-invariance | Armchair cosmology | Staggered arrival | Duplication lottery | Big/messy worlds |  
  |------------|---------------------|---------------------|-------------------|---------------------|------------------|  
  | **SSA**    | ❌ (needs ontology) | ✅                   | ❌                 | ❌                   | ❌                |  
  | **SIA**    | ❌ (needs ontology) | ❌                   | ✅                 | ✅                   | ❌                |  
  | **Halfing**| ❌ (centered worlds)| ✅                   | ❌                 | ❌                   | ❌                |  

  ### What Must Give  
  - **Sacrifice carving-invariance**: Accept that observer-counting relies on ontology (choose SIA for duplication/staggered cases).  
    OR  
  - **Sacrifice "continuations matter"**: Use SSA and reject duplication lottery desideratum (lose decision-theoretic coherence).  
  - **Infinities require ad-hoc fixes**: e.g., discounting or finite horizons.  
  - **Armchair cosmology is negotiable**: Endorse or reject based on tolerance for SIA.  

  **Recommendation for agents**: Prioritize NN3 (staggered arrival) and NN4 (duplication lottery) for decision-making. Use SIA with a *fixed observer ontology*, reject NN1 (carving-invariance), and impose finiteness to sidestep NN5. Acknowledge that no rule is fully consistent.
