  The core tension emerges: SSA avoids armchair cosmology but fails duplication/staggered cases, while SIA passes those but enables cosmology and carving-dependence. Halfing works for Sleeping Beauty but fails everything else. Crucially, carving-invariance might be impossible - every rule needs an observer ontology.

  For infinite cases, all rules fail without ad-hoc fixes. The duplication lottery desideratum ("number of continuations matters") directly opposes SSA's preservation of original identity. The user's decision-agent perspective means betting behavior is vital - so duplication cases should weigh heavily.

