prompt: |-
  I'm writing something on the epistemology of markets and I want the spec before I read any more of the literature: what would a theory of price authority actually have to get right? The question is deliberately narrow — when is an outsider (a journalist, a central banker, a forecaster who has read the same public headlines as everyone else) warranted in deferring to a market price over their own read of the evidence? Not a theory of price formation. A theory of warranted deference.

  Give me the requirements list, each with the case that motivates it. The cases I want handled include:

  - the annoying baseline: the standard no-trade result says common priors plus common knowledge of posteriors leave no room for information-driven trade, yet real markets trade constantly — so the theory has to say where the trade comes from and what that does to informativeness.
  - the Grossman-Stiglitz-flavored tension: if the price fully reveals what dispersed traders know, no one pays to acquire information, so it can't fully reveal. Say plainly whether that pair is unsatisfiable and what has to give.
  - prices that move for non-epistemic reasons (a margin call, a leverage constraint, one big player unwinding) — the price is as if the market believes p while nobody believes p.
  - the same number with no volume behind it versus the same number after heavy two-sided trade.
  - traders who aren't disagreeing about likelihood at all but about what would have to happen for the contract to pay out.
  - reflexive markets, where the price feeds into the thing it prices (an internal company market on a launch date, odds that move donations or turnout).
  - selection: only certain people trade, and some of them are hedging rather than saying anything.
  - and my favorite: deference from the outside without knowing who is in the pool or why they trade — if you need to know that, it isn't deference to the market, it's just deference to experts.

  For each, say whether it's a genuine desideratum or a prejudice of one camp. Flag any pair you think can't be jointly satisfied, and end with one line on which requirement excludes the most popular stories about why markets are smart. Skip the theory-by-theory scorecard, I'll do that myself — I want the criteria.
reasoning: |-
  Hmm, the user is writing on the epistemology of markets and wants a specification for a theory of price authority—specifically, when an outsider should defer to market prices over their own analysis. They've listed several cases that must be handled, and they want me to provide a requirements list with motivating cases, without delving into existing theories.

  First, I need to understand the core question: it's about warranted deference, not price formation. The outsider—like a journalist or central banker—has some evidence but is considering whether to trust the market price instead. The cases they listed cover various paradoxes and real-world complications, such as the no-trade theorem, Grossman-Stiglitz paradox, non-epistemic price moves, and more.

  Breaking down the user's listed cases:
  - The annoying baseline: How can markets trade constantly if common knowledge should prevent it? The requirement must explain the source of trade and its impact on informativeness.
  - Grossman-Stiglitz tension: If prices reveal all information, no one has incentive to gather it. The theory must resolve this tension explicitly.
  - Non-epistemic price moves: Prices can reflect liquidity needs, not beliefs. The requirement should address how to distinguish such cases.
  - Volume vs. price level: A price with no volume might not be informative, while heavy trade could signal conviction. The theory needs to incorporate volume as a factor in deference.
  - Interpretation disagreement: Traders might agree on facts but disagree on contract implications. This requires separating likelihood from interpretation in price signals.
  - Reflexive markets: Prices influencing the outcome they predict adds complexity. The requirement must handle self-referential scenarios.
  - Selection and hedging: Not all traders are information-driven; some hedge risks. The theory should account for who is trading and why.
  - Outsider deference without insider knowledge: The key challenge—deferring without knowing trader composition or motives. This must be central to the theory.

  I'll structure my response as a requirements list. Each requirement should state what the theory must get right, with the case that motivates it. I'll also flag any conflicts, like whether Grossman-Stiglitz is unsatisfiable or what gives way.

  For the annoying baseline: The requirement should explain why trade happens despite no-trade theorems—likely due to differences in priors or non-informational motives—and how that affects the price's reliability. For Grossman-Stiglitz, I'll say it's satisfiable only if the price isn't fully revealing, so the requirement is to specify the degree of revelation versus the cost of information.

  Non-epistemic moves need a requirement for epistemic robustness, meaning the price should be resilient to non-information shocks. For volume, it's about distinguishing shallow prices from consensus ones. Interpretation disagreement calls for separating likelihood and interpretation in the price signal.

  Reflexive markets require handling feedback loops. Selection and hedging need a requirement for inferring information content despite mixed motives. Outsider deference is crucial: the theory must work without insider knowledge, so it can't rely on knowing trader identities.

  I'll flag conflicts, like between full revelation and information acquisition incentives, or between outsider ignorance and needing to know trader motives. Finally, I'll note which requirement excludes popular stories—probably the outsider deference requirement, as it rules out theories that assume ideal trader pools.

  Overall, I'm aiming for a clear, criteria-focused response that helps the user evaluate theories before diving into literature.
answer: |-
  Here's the requirements list for a theory of price authority focused on **warranted outsider deference**, derived from your cases. Each requirement states what the theory *must get right*, with the motivating case and a note on whether it's a genuine desideratum or a potential prejudice. Conflicts are flagged.

  ### Core Requirements for a Theory of Warranted Price Deference

  1.  **Requirement: Explain Persistent Trade Under Common Knowledge**  
      *Motivating Case:* The Annoying Baseline (No-Trade Theorems).  
      *Must Get Right:* Why trade occurs despite apparent common knowledge of posteriors. Must specify which assumptions break (e.g., common priors, common knowledge of rationality, purely informational motives) and how *this specific breakdown* impacts the price's informativeness for outsiders. Trade cannot be merely noise; its origin must be compatible with price informativeness.  
      *Status:* **Genuine Desideratum.** Any theory ignoring this fails at the baseline.

  2.  **Requirement: Resolve the Revelation-Incentive Tension**  
      *Motivating Case:* Grossman-Stiglitz Paradox.  
      *Must Get Right:* Explicitly state how the market price *fails to be perfectly informative* (satisfying the "if" clause of the paradox) while *still being informative enough* to warrant costly information acquisition (satisfying the "then" clause). The theory must specify the *degree* and *nature* of the price's residual uncertainty that preserves incentives, and why this level is sufficient for outsider deference.  
      *Status:* **Genuine Desideratum.** The pair *is* satisfiable – what "gives" is **perfect informativeness**. The price must be a *sufficient statistic* incorporating costly information, but not a *perfect* one.

  3.  **Requirement: Distinguish Epistemic from Non-Epistemic Price Moves**  
      *Motivating Case:* Prices Moving for Non-Epistemic Reasons (Margin Calls, Liquidity Shocks).  
      *Must Get Right:* Provide criteria for an outsider to discern when a price change primarily reflects aggregated beliefs vs. non-informational shocks (liquidity needs, constraints, forced trades). The theory cannot assume all price moves are belief-driven.  
      *Status:* **Genuine Desideratum.** Ignoring this renders prices useless during crises or illiquid moments.

  4.  **Requirement: Incorporate Volume/Depth as an Informativeness Signal**  
      *Motivating Case:* Same Price with No Volume vs. Heavy Two-Sided Trade.  
      *Must Get Right:* Explain why a price reached through significant, two-sided trade is *more reliable* for deference than the same price reached with negligible volume or one-sided pressure. Must link volume to the confidence/conviction/diversity of informed traders.  
      *Status:* **Genuine Desideratum.** Price alone is insufficient; the *process* of reaching it matters.

  5.  **Requirement: Separate Beliefs About States from Beliefs About Mappings**  
      *Motivating Case:* Traders Agree on Likelihoods but Disagree on Contract Payout Conditions.  
      *Must Get Right:* Acknowledge that the market price aggregates not only beliefs about future states of the world (`P(Event)`) but also beliefs/knowledge about *how the contract maps those states to payouts*. Deference to the price implies deference to *both* types of aggregated judgement. The theory must clarify what aspect the outsider is deferring on.  
      *Status:* **Genuine Desideratum.** Outsiders often misinterpret prices by conflating state likelihoods with contract interpretation.

  6.  **Requirement: Handle Reflexivity (Self-Fulfilling/Defeating Prophecies)**  
      *Motivating Case:* Reflexive Markets (Prices Influence Outcomes).  
      *Must Get Right:* Specify when deference to a reflexive market price is warranted *despite* the price altering the fundamentals. Must explain whether the price reflects the "natural" outcome or *creates a new equilibrium*, and how an outsider should interpret this. Deference might be to the market's power to *shape* reality, not just predict it.  
      *Status:* **Genuine Desideratum.** Reflexivity fundamentally alters the epistemic proposition.

  7.  **Requirement: Account for Trader Selection and Mixed Motives**  
      *Motivating Case:* Selection (Who Trades?) and Hedging Motives.  
      *Must Get Right:* Explain how the price aggregates information *despite* not all traders being informed speculators and many trading for hedging/liquidity reasons. Must clarify how the "marginal trader" or price-setting mechanism filters noise from signal, and under what conditions hedging flows distort vs. contribute to informativeness.  
      *Status:* **Genuine Desideratum.** Real markets aren't pure prediction forums.

  8.  **Requirement: Function Under Outsider Ignorance of Trader Pool/Intent**  
      *Motivating Case:* Deference Without Knowing Who is Trading or Why.  
      *Must Get Right:* Provide justification for deference *without* the outsider needing detailed knowledge of the composition, motives, or information sets of current traders. The price itself (potentially combined with observable context like volume, volatility, market structure) must be the primary signal. Requiring insider knowledge defeats "market deference."  
      *Status:* **The Core Genuine Desideratum.** This is the *sine qua non* of your question. Failure here means it's not a theory of *market* price authority.

  ### Flagged Conflicts & Tensions

  *   **Conflict between R8 (Outsider Ignorance) and R7 (Selection/Motives):** Satisfying R7 (accounting for selection/hedging) *without violating R8* (no insider knowledge) is the primary challenge. A theory relying on knowing "the right people are trading" fails R8. The solution must lie in *price/volume dynamics themselves* signaling robustness.
  *   **Tension between R2 (Revelation-Incentive) and Perfect Informativeness:** As stated in R2, perfect informativeness is incompatible with incentives. The requirement is to explain the *imperfect but sufficient* revelation.
  *   **Tension between R3 (Non-Epistemic Moves) and Simple Aggregation Stories:** Naive "wisdom of crowds" or efficient market stories often fail R3 spectacularly. The theory needs robust diagnostics.

  ### Requirement Excluding Popular Stories

  **R8 (Outsider Ignorance of Trader Pool/Intent)** excludes most popular stories relying on idealized trader pools (e.g., "markets aggregate dispersed info among rational, informed speculators"), as these implicitly require the outsider to *know* such a pool exists and is active, violating the core condition for genuine market deference.
