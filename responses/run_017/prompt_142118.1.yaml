prompt: |-
  I want a specification, not a verdict. The question on the table is whether generational cohorts are real kinds rather than convenient labels, and I need an answer good enough to do two jobs at once: to tell an empirical researcher whether she may legitimately enter generation as an explanatory variable in a model of political attitudes or labor-market outcomes, and to tell a metaphysician whether cohorts belong in the same ontological bracket as more respectable social or biological kinds. Before I look at any candidate answer, write out what an adequate theory of cohort kinds would have to deliver.

  Give the motivating case or consideration behind each requirement, and say why it is a requirement rather than a preference of one camp. The following problem cases should appear, and you should add any I have missed:

  1. The arithmetic of the age-period-cohort problem. Cohort is a linear function of age and period, so no dataset can by itself separate a linear cohort effect from a linear age effect and a linear period effect. A theory of generations must say what substantive constraint licenses reading a measured regularity as a cohort effect at all, and how that reading could ever be tested rather than stipulated.

  2. Boundary arbitrariness. The start and end years are conventional and get revised, and a person born in 1980 or 1981 straddles the divide. If the kind is real, what fixes the boundary, and how sharp a discontinuity in the associated properties does that allow?

  3. Granularity. Why bands of fifteen to twenty years rather than five-year cohorts or single birth years? Different outcomes would carve the timeline at different widths, so the theory needs a principle for width that does not simply inherit the width from whichever outcome it was built on.

  4. Effect size. Most of the variance in attitudes, income, and behavior within a population is within cohorts rather than between them, and the measured between-cohort gaps are often small. The theory must say how much between-group structure kindhood requires, and whether the answer changes if the job is explanation rather than prediction.

  5. Portability. The categories were drawn for one national population and then exported. Someone born in the same year in the United States, in rural India, and in post-Soviet Estonia lands in the same cohort; the theory must say whether extension is fixed by dates, by shared formative historical exposures, or by self-identification, and what to say when these three criteria come apart.

  6. Looping. Generational labels circulate through marketing, journalism, and hiring, and people adjust their self-conception and behavior in response. Does that feedback make the kind more real, as with interactive or looping human kinds, or does it destabilize it, since the properties drift as the label spreads?

  7. Causal role. Is a generation meant to do causal-explanatory work, or is it a stand-in for a bundle of date-correlated exposures such as leaving school into a recession, cohort-specific technology, or a policy regime? If the latter, the kind is causally inert once those exposures are controlled for; the theory must state which it is and what evidence would discriminate the two.

  8. Error and disagreement about membership. People are unsure of, dispute, and misreport their own cohort, and there is no agreed authority. What sort of mistake is possible here, and what does the possibility of that mistake show?

  Then mark which requirements are non-negotiable for the two jobs I described and which are prejudices imported from one side of the debate, for instance whether sharp boundaries or large between-cohort differences are genuinely required for kindhood. Identify any subset of the requirements you think cannot be jointly satisfied: I especially want to know whether real-kind status, explanatory power, and tolerance of vague or shifting boundaries can all be had together, or whether the specification itself is the interesting negative result. Say which single requirement does the most work in excluding candidate theories.

  Finally, in a few lines each and without citations or a reading list, score three positions against the list: strong realism of the sort found in popular cyclical generational narratives, the deflationary view that generations are only conventionally demarcated birth-year intervals with no metaphysics attached, and the view that cohorts are real but derivative, real only as carriers of historically located formative exposures.
reasoning: |-
  Hmm, let me tackle this user's request carefully. They want a rigorous specification for evaluating generational cohorts as potential "real kinds" rather than just labels. The framework needs to serve two distinct audiences: empirical researchers and metaphysicians. 

  First, I need to map all necessary requirements based on their listed problem cases (APC problem, boundaries, granularity etc.), plus any gaps. The boundary arbitrariness issue seems particularly thorny - if cohorts are real kinds, how can their edges be fuzzy? And the APC identification problem feels foundational: without solving that, any cohort effect could just be misattributed age or period noise.

  The portability problem jumps out as underdiscussed in literature. When we export "Gen Z" globally, are we tracking anything real about Estonian vs Indian youth? That connects to the causal role question too - is "generation" doing work or just bundling geography-specific exposures?

  For non-negotiables: For researchers, the APC constraint (1) and causal role clarity (7) seem essential - without those, you can't legitimately enter "cohort" as a variable. For metaphysicians, portability (5) and looping effects (6) feel critical to assess kind-status. But sharp boundaries? Probably not essential - biological species have fuzzy edges too.

  The tension between requirements emerges clearly: Real-kind status demands stability (ontological bracket), but looping (6) makes properties drift, and boundaries (2) resist sharpness. Can a kind be real if its members reshape it by believing in it? That might be the killer tension.

  When scoring positions: Strong realism fails most tests (especially APC and portability). Deflationism ducks metaphysics but works for researchers. The derivative view seems strongest - it embraces fuzziness while preserving causal depth via exposures.

  The user's implicit challenge is whether "generational kind" can satisfy both audiences simultaneously. My suspicion is the derivative view comes closest by making cohorts real-but-contingent, satisfying researchers with measurable exposures and metaphysicians with context-dependent ontology. But that boundary problem (2) still nags - can a real kind have conventional edges? Maybe if we think of cohorts as gravitational fields rather than bounded boxes...
answer: |-
  Here is a specification for an adequate theory of cohort kinds, designed to satisfy both empirical researchers and metaphysicians, with motivations and problem cases addressed:

  ### Core Requirements for an Adequate Theory
  1. **Resolve the APC Identification Problem**  
     *Motivation*: Without disentangling age, period, and cohort effects (which are linearly dependent), any claimed "cohort effect" could be spurious.  
     *Requirement*: The theory must provide **non-arbitrary substantive constraints** (e.g., shared historical exposures, socialization windows) to justify attributing variance to cohorts. It must also specify **testable mechanisms** (e.g., formative events during critical developmental periods) that distinguish cohort effects from age/period confounds.  
     *Why requirement?* Without this, cohort variables lack empirical legitimacy for researchers and fail causal scrutiny for metaphysicians.

  2. **Account for Boundary Vagueness**  
     *Motivation*: Boundaries (e.g., 1965–1980 for Gen X) are disputed and revised; individuals near cutoffs share properties with adjacent cohorts.  
     *Requirement*: The theory must explain **why boundaries are fuzzy** (e.g., gradual exposure shifts) while providing **ontological grounds** for cohort distinctness (e.g., clustering of experiences). It must accommodate **graded membership** without collapsing into individualism.  
     *Why requirement?* Sharp boundaries are empirically unsupported; denying vagueness undermines realism.

  3. **Justify Granularity**  
     *Motivation*: Cohort widths (15–20 years) are conventional, yet outcomes (e.g., tech adoption vs. retirement) may demand finer/coarser divisions.  
     *Requirement*: The theory must define **optimal granularity** based on the **duration of formative exposures** (e.g., length of economic eras) or **mechanistic thresholds** (e.g., institutional transitions). It cannot derive width solely from outcome variables.  
     *Why requirement?* Arbitrary width selection biases research and weakens kindhood claims.

  4. **Specify Effect Size Thresholds**  
     *Motivation*: Between-cohort differences are often small; most variance is intra-cohort.  
     *Requirement*: The theory must state **minimal between-group structure** needed for kindhood (e.g., statistically significant differences in *causal dispositions*). For explanation vs. prediction: **Explanatory** legitimacy requires coherent mechanisms, **predictive** legitimacy requires non-zero utility.  
     *Why requirement?* Dismissing small effects ignores cumulative societal impacts; demanding large effects imposes unrealistic biological standards.

  5. **Define Portability Conditions**  
     *Motivation*: Global application of "Gen Z" to disparate societies ignores contextual heterogeneity.  
     *Requirement*: The theory must clarify the **reference class**: Cohorts are real only relative to **shared institutional/historical fields** (e.g., nations, markets). Extension is fixed by **convergent exposures** (not birth years alone). Divergent cases (e.g., U.S. vs. rural Indian 1995 births) falsify universalism.  
     *Why requirement?* Uncritical exportation commits ecological fallacies; metaphysical kinds require domain-specificity.

  6. **Address Looping Effects**  
     *Motivation*: Labels (e.g., "Boomer") shape behavior via media and self-identification.  
     *Requirement*: The theory must incorporate **feedback loops** as constitutive of social kinds. Looping should **enhance reality** by stabilizing dispositions (e.g., cohort solidarity) but may **destabilize** if definitions drift.  
     *Why requirement?* Ignoring looping ignores social dynamics; treating it as contamination biases metaphysics.

  7. **Clarify Causal Role**  
     *Motivation*: Is "Gen X" a cause or a proxy for exposures (e.g., 1990s job markets)?  
     *Requirement*: The theory must state whether cohorts are **causal entities** (e.g., via group identity) or **epiphenomena** of exposures. Test: If cohort effects **vanish** when exposures are controlled, they lack independent causal power.  
     *Why requirement?* Researchers need clarity for modeling; metaphysicians need causal autonomy for kindhood.

  8. **Explain Error/Disagreement**  
     *Motivation*: People misidentify cohorts; no authoritative classifier exists.  
     *Requirement*: The theory must allow for **misclassification errors** (e.g., mistaking exposures) or **boundary disputes**, without implying subjectivism. Errors show that cohort membership is **objective but fallibly known**.  
     *Why requirement?* Denying error implies infallible access (implausible); embracing subjectivism voids realism.

  ---

  ### Non-Negotiables vs. Prejudices
  - **Non-negotiable for researchers**: APC resolution (#1), causal role clarity (#7).  
    *Without these, entering "cohort" in a model is statistically and causally indefensible.*  
  - **Non-negotiable for metaphysicians**: Portability (#5), looping (#6).  
    *Social kinds must respond to cultural feedback and contextual embedding.*  
  - **Prejudices**: Demanding sharp boundaries (#2) or large effect sizes (#4) imports biological-kind standards. Social kinds can be vague/weakly structured yet real (e.g., social classes).

  ### Tensions and Feasibility
  - **Key tension**: Real-kind status + explanatory power + boundary tolerance **can coexist** if cohorts are defined as **historical-contingent causal nodes** (e.g., "groups sharing exposure to X during developmental window Y").  
  - **Fatal flaw**: Theories failing **APC resolution (#1)** cannot empirically ground cohorts, making them stipulative. This requirement does the most work in excluding candidates.  
  - **Subset conflict**: Granularity (#3) + effect size (#4) + portability (#5) strain jointly if a theory insists on universalism. Contextualism resolves this.

  ---

  ### Scoring Three Positions
  1. **Strong Realism** (e.g., Strauss-Howe generational cycles)  
     - Fails #1 (APC unresolved), #2 (imposes sharp boundaries), #5 (assumes universal portability).  
     - Scores well on #6 (embraces looping) but lacks empirical rigor.  
     *Verdict*: Inadequate for research/metaphysics; stipulative and overgeneralized.

  2. **Deflationary View** (cohorts as conventional intervals)  
     - Satisfies #1 (avoids APC by admitting arbitrariness), #2 (embraces conventionalism).  
     - Fails #5 (no portability constraints), #6 (ignores looping), #7 (denies causal role).  
     *Verdict*: Legitimate for descriptive modeling but ontologically empty. Fails metaphysics.

  3. **Derivative Realism** (cohorts as exposure-bundles)  
     - Excels at #1 (exposures break APC linearity), #3 (granularity tied to exposure duration), #7 (causally reducible but pragmatically useful).  
     - Accommodates #2 (fuzzy exposure transitions), #5 (context-bound exposures).  
     - Risks neglecting #6 (looping as secondary).  
     *Verdict*: Best balance; empirically testable and metaphysically coherent as a *historical-situated kind*.

  ---

  **The Specification's Payoff**: An adequate theory must treat cohorts as **emergent, spatially bounded, and mechanistically defined historical kinds**. The derivative realism view comes closest, satisfying all non-negotiables by tethering cohorts to measurable exposures while allowing for social feedback. The core insight is that *cohorts are real insofar as they capture clusters of causally significant formative experiences within a defined context*—not as freestanding biological categories.
