prompt: |-
  I write historical fiction, and I'm two books into a trilogy set in a made-up river-valley settlement I call Hallow Reach, somewhere in the late third millenium BC by the old dating (I've decided not to put a date in the text at all, which has already saved me a lot of grief). I did a big pile of reading before book one, and then someone in my writing group whose partner directs a dig said something that I can't shake: every time I let an object do something in a scene, I've already made an inference about what the people in that scene believed or what rules they were living under, and I ought to be able to say which of those inferences an archaeologist would actually sign off on and which ones are just mine. It's become a genuine problem now that I'm drafting the author's note, because I keep typing things like the people of the Reach held that... and then deleting the whole sentence.

  So what I want is a procedure, not a lecture, and not a reading list (I have no library access for most of the year and I'm not going to chase down papers). Something I can run in half an hour, over and over, every time I catch myself about to put a belief or an institution into the story on the strength of objects alone: the questions in the order I should ask them, what counts as a good enough answer to each, the step where I stop and write some version of we don't know and I invented this, and the step where the question stops being about evidence and becomes a decision about what kind of book I'm writing. I'd like it grounded in whatever archaeology and the philosophy of inference actually say about getting from stuff in the ground to minds — the business of how a pattern in the debris is supposed to connect to a behaviour and then to a belief, what has to be true of an object before it can carry a meaning at all, why the gap keeps reopening — but in plain words I can use, and honest about which steps are really just taste wearing a lab coat. Constraints: I have one undergraduate course and a lot of enthusiasm, I can email the dig director roughly once with three questions so I should know which three to spend, I can't do any fieldwork, and the findings I already printed in book one are fixed and can't be retconned. Also, she used some phrase I half remember, middle-range something or other, that apparently names exactly the move I keep making badly; if that's a real thing, tell me what it is and what it would have me do differently.

  Three cases to run it on, please. (1) The find I keep coming back to: around forty small fired-clay cones, found only in the thresholds of the bigger houses, always in pairs, points facing inward, and in three cases snapped on purpose before being set in the clay. I want a doorway belief — something at the threshold that keeps something out. Does the procedure let me have it, given that my first reader's suggestion was that they're just door sockets or loom weights? (2) What I've been privately calling the counting stones: about two hundred pebbles in a bag under a floor, in eleven distinct size grades, plus a flat stone with rows of matching pits cut into it. I want a grain levy and a person whose job it is to keep the tally, that is, an office and not just a habit — can the procedure get me from objects to an institution, or only to a practice, and what would I have to have found to get the office? (3) The one I already know you're going to spoil for me: my favourite scene in book two is a public judgement, the whole settlement watching while an accused person's hands are tied and they're put into the river, and everyone reading what happens as the river's answer. My evidence is a burial face-down in the channel silts with the wrists bound, and a second one with bound wrists and the hands removed. I have a horrible feeling the procedure lets me keep the burials and takes away the belief, and I'd rather be told that plainly than have it hedged. For each case say what the strongest sentence I can honestly put on the page is. And please flag the cases the procedure can't settle at all — the one where two different belief attributions fit the objects equally well, the one where everything that rotted would have carried the meaning and what survived didn't, and the one where a people three hundred miles away and four centuries later left written curses that sound a bit like what I want — plus tell me what the procedure simply cannot do, no matter how well I run it, so I stop asking it for that.
reasoning: |-
  Okay, the user is a historical fiction writer deep into a trilogy set in a fictional late 3rd millennium BC river settlement called Hallow Reach. They're struggling with inferring beliefs and institutions from archaeological objects without overstepping evidence. Their writing group critique hit hard: every object implies beliefs or rules, and they need to distinguish what's archaeologically supportable from their inventions. 

  The user wants a practical, step-by-step procedure to evaluate such inferences—something repeatable in 30 minutes per case. They explicitly reject lectures or reading lists (no library access), preferring grounded methodology in plain language. Constraints include limited academic background, one email to a dig director with three questions, no fieldwork, and published Book 1 details being immutable. They mention "middle-range something" (likely middle-range theory) as a concept they might be misusing.

  Three test cases:  
  1. **Clay cones in thresholds** (40 pairs, some snapped): wants "doorway belief" against evil.  
  2. **"Counting stones"** (graded pebbles + pitted stone): wants institutional grain levy.  
  3. **Channel burials** (bound wrists, face-down/hands removed): wants river trial ritual.  

  They seek brutal honesty about what the procedure can/can't justify and what sentences they can honestly write. Underlying needs:  
  - Confidence in authorial choices without overclaiming.  
  - Tools to navigate ambiguity without paralysis.  
  - Distinguishing evidence-based writing from world-building.  
  - Preserving narrative impact while honoring archaeology.  

  Key tensions:  
  - **Accuracy vs. storytelling**: How much can they invent? Where's the line?  
  - **Silent evidence**: Rotting materials (wood, textiles) might have carried meaning.  
  - **Comparative analogy**: Can later/distant texts inform Hallow Reach?  

  The procedure must:  
  1. **Interrogate the object**: What’s materially certain?  
  2. **Check against context**: Patterns, location, damage.  
  3. **Rule out mundanity**: Is there a practical use?  
  4. **Test belief attribution**: What's the minimal belief needed?  
  5. **Decide**: Is this evidence, invention, or "likely"?  

  For **middle-range theory**: It's the inferential bridge from static artifacts to dynamic human behavior. The user’s flaw is skipping behavioral inference to jump straight to belief. Fix: First reconstruct actions (*what was done*), then ask *why* it was done.  

  ---  

  **Procedure Design**  
  *Five steps, 6 mins/step:*  
  1. **Inventory the Evidence** (6 mins):  
     - List physical traits (material, marks, location).  
     - Note associated finds (e.g., cones only in big-house thresholds).  
     - *Stop if*: Evidence is ambiguous (e.g., pebbles could be game pieces).  

  2. **Rule Out the Mundane** (6 mins):  
     - Practical alternatives? (Doorstops? Loom weights?).  
     - If alternatives fit, belief claim weakens.  
     - *Stop if* mundane explanation is equally plausible → "We don’t know."  

  3. **Infer Behavior, Not Belief** (6 mins):  
     - Describe actions (e.g., "people placed paired cones at thresholds").  
     - Delay *why* questions. Middle-range theory starts here: link patterns to repeated actions.  

  4. **Test Belief/Institution Claims** (6 mins):  
     - **For beliefs**: Is this the *only* behavior explaining the pattern? (e.g., snapped cones *must* mean ritual breakage?).  
     - **For institutions**: Need hierarchy evidence (e.g., standardized weights, centralized storage).  
     - *Stop if*: Multiple interpretations exist → Flag ambiguity.  

  5. **Authorial Decision** (6 mins):  
     - Choose: Evidence-backed, invented, or "likely but unproven."  
     - Frame honestly: "X suggests Y" or "I imagine Z."  
     - *Remember*: Fiction isn’t scholarship. Own inventions proudly where needed.  

  ---  

  **Case Applications**  
  1. **Clay Cones**:  
     - Step 1: Paired, inward-facing, some snapped, threshold-only in elite homes.  
     - Step 2: Not door sockets (too small) or loom weights (wrong shape). Mundane? Unlikely.  
     - Step 3: Behavior: Deliberate placement with symbolic breakage.  
     - Step 4: Belief? Possible, but could be ownership marks/apotropaic. Not *only* explanation.  
     - Step 5: **Strongest sentence**: "The cones’ deliberate placement suggests threshold rituals." Avoid claiming *why*.  

  2. **Counting Stones**:  
     - Step 1: Graded pebbles + tally stone. Under floor (hidden?).  
     - Step 2: Mundane? Game or personal accounting. But grades imply measurement.  
     - Step 3: Behavior: Quantifying goods (grain?).  
     - Step 4: Institution? Need corroboration (e.g., identical sets elsewhere, levy records). Without it, just a practice.  
     - Step 5: **Strongest sentence**: "These may reflect grain tallies" + invent the office as fiction.  

  3. **Channel Burials**:  
     - Step 1: Bound wrists, face-down/hands removed, in river silts. Not typical graves.  
     - Step 2: Mundane? Punishment or corpse disposal. But river location?  
     - Step 3: Behavior: Ritualistic binding/dismemberment + water disposal.  
     - Step 4: Belief? Could be fear of the dead or social exclusion. *Not* proof of river trials.  
     - Step 5: **Strongest sentence**: "This treatment implies condemnation" but river trial is invention.  

  ---  

  **Limits of the Procedure**  
  - 🚫 **Silent evidence**: Rotted items might change everything (e.g., wooden idols near cones).  
  - 🚫 **Equivocal cases**: Two beliefs fit equally? (e.g., cones = ancestral protection *or* class display).  
  - 🚫 **Distant analogies**: Later curses ≠ Hallow Reach beliefs. Corroborate locally or invent.  
  - 🚫 **Never infers specific thoughts**: Objects show actions, not internal states.  

  **Email to Dig Director** (3 questions max):  
  1. Are the clay cones found *only* in thresholds, or elsewhere too?  
  2. Do the counting stones appear in non-domestic contexts (e.g., administrative buildings)?  
  3. Are the channel burials isolated, or part of a pattern (e.g., other deviant burials nearby)?  

  **Final Note**: The procedure won't eliminate doubt—it maps the edge of knowledge. Fiction thrives in gaps; label inventions transparently. Middle-range theory is your scaffold, not your cage.
answer: |-
  Here's a step-by-step procedure grounded in archaeological inference (specifically **middle-range theory**, which links static material remains to dynamic human behavior). It follows a "funnel" approach—starting broad, narrowing to evidence, ending with authorial choice. Run it in 30 mins per case.

  ### **The Procedure: 5 Steps (6 mins each)**
  1. **Inventory the Evidence**  
     *Ask:* What is *physically present*? List: material, quantity, location, condition, associations (what was found nearby). Ignore interpretations.  
     *Stop if:* The object’s basic function is unknown (e.g., "clay lump"). *Good answer:* Concrete descriptors ("20 paired cones in thresholds, points inward, 3 snapped").  
  2. **Rule Out the Mundane**  
     *Ask:* Could this be explained without beliefs/institutions? (e.g., storage, tool, accident, decay). Test practicality: "Is this the simplest use?"  
     *Stop if:* A utilitarian explanation fits equally well (e.g., loom weights). *Good answer:* "No mundane use explains all traits (e.g., intentional breakage + exclusive threshold placement)."  
  3. **Infer Behavior, Not Belief**  
     *Ask:* What *action* does this imply? (e.g., "People placed paired cones in thresholds"). Use middle-range theory: Patterns → Repeated behavior. *Do not jump to beliefs yet*.  
     *Good answer:* Describes observable behavior ("They snapped cones before placing them").  
  4. **Test the Belief/Institution Claim**  
     *Ask:*  
     - For **beliefs**: Is this the *only* behavior that explains the pattern? What minimal belief must exist? (e.g., "Thresholds required protection" not "They feared demons").  
     - For **institutions**: Is hierarchy/standardization evident? (e.g., identical objects across sites imply rules).  
     *Stop if:* Multiple beliefs fit equally, or decayed materials could change everything (e.g., missing wooden idols). *Good answer:* "Behavior X supports belief Y, but Z is possible too."  
  5. **Authorial Decision**  
     *Ask:* "Is this inference vital for the story?" If yes:  
     - Choose: **A** (Evidence-backed: "Finds suggest..."), **B** (Invented but plausible: "I imagine..."), or **C** (Ambiguous: "Perhaps...").  
     *This is taste in a lab coat.* Own it in your author’s note.

  ---

  ### **What Middle-Range Theory Is & How It Changes Your Approach**
  - **Definition:** A method to infer *human behavior* from material patterns (e.g., "Snapped cones in thresholds → ritual breakage"). It *does not* directly infer beliefs.  
  - **Your flaw:** Jumping from objects → beliefs (e.g., cones → "they believed thresholds were vulnerable").  
  - **Fix:** First infer *behavior* (they *placed* snapped cones), then ask *why*. Beliefs are last, not first.  
  - **Key principle:** Objects reflect *action*. Beliefs are interpretations of action.

  ---

  ### **Case Applications**
  ***(1) Clay Cones (Threshold "Protectors")***  
  - **Step 1:** 40 fired-clay cones. Always paired, points inward, in big-house thresholds. 3 snapped pre-deposition.  
  - **Step 2:** Not door sockets (wrong shape/placement). Not loom weights (no wear, wrong context). Mundane? Unlikely.  
  - **Step 3:** Behavior: Deliberate placement of symbolically "activated" objects at entry points. Snapping implies ritual breakage.  
  - **Step 4:** Belief? *Minimal inference:* Thresholds held symbolic importance requiring ritual action. "Protection" is plausible but *not unique*—could be ownership marks, ancestral guardians, etc. No written/textual support.  
  - **Step 5:** **Strongest sentence:** *"The deliberate placement of paired, sometimes broken, cones in thresholds suggests ritual attention to entryways."*  
  - **Verdict:** Keep the behavior ("they did this"), soften the belief ("perhaps to ward off harm").  

  ***(2) Counting Stones (Grain Levy & "Office")***  
  - **Step 1:** 200 pebbles, 11 size grades + pitted tally stone. Found together under a floor.  
  - **Step 2:** Mundane? Personal accounting or game possible. But size grades + tally stone imply measurement.  
  - **Step 3:** Behavior: Systematically quantifying goods (likely grain) using standardized units.  
  - **Step 4:** Institution? *Practice* confirmed (measurement happened). *Office* requires hierarchy. Corroborating evidence needed: identical sets in multiple locations, centralized storage pits, or administrative seals. Without these, it could be one household’s system.  
  - **Step 5:** **Strongest sentence:** *"The graded pebbles and tally stone imply a system for measuring goods—possibly grain—in standardized units."*  
  - **Verdict:** You can *invent* an office, but evidence only supports a *practice*. Email the dig director: **"Are similar pebble sets found in non-domestic buildings?"**  

  ***(3) Channel Burials (River Judgement)***  
  - **Step 1:** 2 burials in river silts. One face-down, wrists bound; one bound with hands removed. Non-standard burial.  
  - **Step 2:** Mundane? Execution or corpse disposal (no belief needed). But river location atypical.  
  - **Step 3:** Behavior: Deliberate binding and water disposal of bodies, plus mutilation (hand removal).  
  - **Step 4:** Belief? *Minimal inference:* These were "deviant" burials, implying social exclusion or fear. *River judgement?* No direct link—could be punishment, taboo, or enemy treatment. The "river’s answer" is your narrative overlay.  
  - **Step 5:** **Strongest sentence:** *"The bound bodies in the river, one mutilated, suggest condemnation or ritual exclusion."*  
  - **Verdict:** Keep the burials; lose "the river’s answer" as a belief. The ritual trial is your invention (own it). Email the dig director: **"Are there other ‘deviant’ burials, and where are typical graves located?"**  

  ---

  ### **When the Procedure Fails (Flag These!)**
  - **Equivocal Cases:** Two beliefs fit equally (e.g., cones *could* be ancestor offerings OR protective charms). → *Solution:* Note ambiguity; invent based on narrative needs.  
  - **Silent Evidence:** Rotted materials carried meaning (e.g., wooden doorway idols that decayed). → *Solution:* If context implies something missing (e.g., cones placed where wood might have been), say "traces suggest" but don’t invent specifics.  
  - **Distant Analogies:** Written curses 300 miles away. → *Solution:* Use *only* to support patterns (e.g., "water rituals are regionally attested"), not Hallow Reach’s beliefs.  
  - **What It Cannot Do:**  
    - Prove *specific* beliefs (e.g., "they feared river spirits").  
    - Reconstruct myths or emotions.  
    - Replace missing evidence (e.g., no hierarchy proof → no office).  
    - Resolve debates without comparative data (e.g., your cones are unique).  

  ### **Your Email to the Dig Director (Max 3 Questions)**  
  1. "Are the clay cones found *exclusively* in domestic thresholds, or in other contexts?"  
  2. "Do the ‘counting stone’ pebble sets appear in non-household settings (e.g., communal buildings)?"  
  3. "Are the channel burials isolated, or part of a larger pattern (e.g., other bound/mutilated bodies)?"  

  ### **Final Advice**  
  **Middle-range theory gets you to behavior; beliefs are interpretive.** Use the procedure to clarify what’s evidence-backed (behavior), what’s plausible (minimal belief), and what’s invented (specific myths/offices). In your author’s note:  
  > *"Where archaeology gives clear patterns (e.g., ritual placement of objects), I extrapolate behavior; where it falls silent (e.g., beliefs), I imagine responsibly."*  
  Your river trial scene? Keep it. Just clarify in the note: *"The bound bodies are factual; the trial ritual is my invention."* This honesty satisfies archaeologists and frees your storytelling.
