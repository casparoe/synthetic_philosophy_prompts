answer: |-
  **DEPARTMENT OF COMMERCE**
  **Office for Randomness Assurance (ORA)**
  **47 CFR Part 412**
  [Docket No. ORA-2024-0032]
  RIN 0660–ZC14

  **Randomness Assurance Standards for Chord Generation Devices; Proposed Rule**

  **AGENCY:** Office for Randomness Assurance (ORA), Department of Commerce.
  **ACTION:** Notice of proposed rulemaking.
  **SUMMARY:** The Office for Randomness Assurance (ORA) proposes to amend its regulations governing the certification and validation of Chord Generation Devices (CGDs) used in probabilistic determination, regulated gaming, audit sampling, and statistical reporting. The proposed rule clarifies the definition of "random chord" for conformance assessment, establishes a default measure for undeclared probabilistic reporting, and announces provisional validation findings for the Grid-Intersect Method.
  **DATES:** Comments must be received on or before [Date 90 days from publication].

  **SUPPLEMENTARY INFORMATION:**

  **I. Background**
  Pursuant to the Randomness Assurance Act of 1988 (15 U.S.C. § 7801 *et seq.*), ORA is responsible for ensuring the integrity and statistical validity of devices generating random geometric constructs, including chords of a circle, used in contexts requiring certified randomness. ORA has observed significant ambiguity in the market regarding the operational definition of "random chord," leading to validation discrepancies and potential consumer confusion.

  The core ambiguity arises from the demonstrable fact that different, equally plausible methods for generating a "random chord" on a unit circle (radius = 1) yield different probabilities for the event that said chord exceeds a defined threshold length. Specifically, the threshold length corresponding to the side of an inscribed equilateral triangle is √3 (approx. 1.732). ORA notes the following empirically validated outcomes from certified devices using distinct, ORA-approved parametrizations:

  1.  **Endpoints Method (RA-7 Declaration Code E):** Selects two points independently and uniformly on the circumference. Probability (chord length > √3) = 1/3.
  2.  **Radial Method (RA-7 Declaration Code R):** Selects a radius uniformly, then a point uniformly along that radius, and constructs the chord perpendicular to the radius at that point. Probability (chord length > √3) = 1/2.
  3.  **Midpoint Method (RA-7 Declaration Code M):** Selects a point uniformly within the circular disk, and constructs the unique chord for which that point is the midpoint. Probability (chord length > √3) = 1/4.

  ORA emphasizes that each method produces chords demonstrably "random" *relative to its own declared spatial parameter distribution* (uniform over circumference pairs, uniform over radius-distance pairs, uniform over disk area, respectively). Conformance assessment under current regulations (47 CFR § 412.15(b)) is based solely on whether the device's output distribution matches its declared parametrization on Form RA-7.

  **II. Proposed Clarification: The Principle of Declared Measure**
  ORA proposes to codify its longstanding practice: **A Chord Generation Device (CGD) is considered to produce "random chords" if its output distribution statistically conforms to the uniform distribution over the specific geometric parameter space declared by the manufacturer on Form RA-7.** No single parametrization is inherently "more random" than another. Randomness is validated solely against the declared measure.

  **III. Proposed Rule: Default Measure for Reporting**
  This principle has profound implications for probabilistic reporting beyond CGDs. A probability statement (e.g., "Probability of event E is P") is only meaningful relative to a clearly defined sample space and probability measure. ORA has identified widespread non-conformance in general reporting: entities frequently report probability figures without declaring the underlying measure over which uniformity is assumed (or otherwise defined).

  To remedy this ambiguity and align general practice with CGD certification standards, ORA proposes a new regulation (47 CFR § 412.22):
  *   **Any entity reporting a probability figure in a context falling under ORA's purview (gaming, audit sampling, risk assessment summaries) must declare the specific quantity or space assumed to be uniform in the calculation.**
  *   **Absent such a declaration, the default measure shall be uniform in the quantity explicitly referenced by the reporting form's prompt or the variable named in the reported result.**

  This default rule provides essential clarity and ensures reported probabilities have a verifiable basis relative to a defined measure, consistent with the validation framework for certified CGDs.

  **IV. Status of Grid-Intersect Method (RA-7 Declaration Code G)**
  ORA provides an update on the provisional validation of the Grid-Intersect Method, under review for three years. This method operates as follows:
  1.  Circumscribe the unit circle with a square (side length = 2).
  2.  Select two points independently and uniformly within the square.
  3.  Construct the line segment joining these two points.
  4.  If the line segment intersects the circle, retain the chord defined by the intersection points. If not, reject the pair and resample.

  ORA finds this method conceptually sound. Its grid-based selection aligns well with standard discrete sampling methodologies and exhibits desirable neutrality in its initial spatial sampling. However, validation studies have yielded inconsistent probability estimates for the event (chord length > √3). Repeated trials by ORA-certified laboratories return significantly divergent results. Crucially, these variations correlate demonstrably with the orientation of the square relative to the circle (e.g., axis-aligned vs. rotated by an arbitrary angle prior to point selection). After extensive analysis, ORA provisionally concludes that **this variation reflects an inherent property of the geometric reality being modeled, rather than a defect in the method's implementation or the validation protocol.** The method remains under review. Manufacturers may continue to submit G-CGDs for provisional certification, provided they declare the specific square orientation used on Form RA-7(G).

  **V. Response to Docket Comment ORA-2023-9981**
  ORA acknowledges the comment submitted by Professor J. Eutropius, advocating that the "only consistent definition" of a random chord requires the probability measure to be invariant under all translations, rotations, and scalings of the circle. The commenter argues this uniquely specifies a measure yielding a single probability (noted as 1/3 in the comment) for the chord length exceeding √3. ORA appreciates this perspective but clarifies that its statutory mandate (15 U.S.C. § 7803(a)(2)) is to assure randomness *as operationally implemented by devices and reported by entities*, based on declared and verifiable measures. ORA lacks jurisdiction to mandate invariance properties under geometric transformations as a requirement for randomness certification. Device manufacturers remain free to declare measures exhibiting such invariance (e.g., Code E), but it is not a general requirement.

  **VI. Industry Perspective**
  Dr. Arlo Finch, Chief Statistician for Geometric Random Solutions, Inc. (a major CGD manufacturer), stated: "ORA's focus on declared measure conformity provides essential flexibility and innovation potential. It allows manufacturers to develop optimized CGDs for specific applications – audit sampling might favor grid-based approaches, while gaming applications leverage radial symmetry – all within a clear, consistent validation framework. The proposed default reporting rule is a logical and necessary extension."

  **VII. Questions for Comment**
  ORA solicits comment on all aspects of this proposal, specifically:
  1.  Is the codification of the "Declared Measure Principle" for CGD validation clear and sufficient?
  2.  Does the proposed default rule for probabilistic reporting (§ 412.22) effectively address ambiguity? Are there unintended consequences?
  3.  Regarding the Grid-Intersect Method (G):
      a) Does ORA's provisional conclusion about orientation-dependent probabilities being inherent align with stakeholder understanding?
      b) Should ORA require disclosure of the specific square orientation on Form RA-7(G), or seek an alternative standardization?
  4.  Are there additional classical or novel chord generation parametrizations ORA should consider for inclusion in the RA-7 declaration codes?
  5.  What implementation challenges, if any, do entities foresee in complying with the proposed declaration requirement for reported probabilities?

  **Authority:** 15 U.S.C. § 7801 *et seq.*; 47 U.S.C. § 154.
  **Date:** [Date of Publication in the Federal Register]

  Lydia Vance,
  *Administrator, Office for Randomness Assurance.*
