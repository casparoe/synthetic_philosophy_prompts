answer: |-
  Here's a disciplined mapping of the TRC onto the Margalit/Rieff tension, followed by an analysis of your "archive substitution" and "witness horizon" concepts, focusing where the theories fall short:

  **I. TRC Mapped onto Margalit (Duty to Remember)**
  *   **Who Owes the Duty?**
      *   *Primarily the New State:* As successor to the apartheid regime, it bears responsibility for establishing the *institutional* record and facilitating public acknowledgment. Its legitimacy hinges on confronting the past.
      *   *Secondarily Society (especially victims/survivors & their descendants):* To bear witness, testify, and keep the memory alive within communities ("thick relations"). Perpetrators have a duty to confess truthfully as a minimal form of accountability.
  *   **Object of the Duty:**
      *   *Core:* The **truthful facts** of violations (who did what to whom, when, where) and the **moral wrongness** of the acts/system. Names and basic events are crucial.
      *   *Secondary:* Felt experience (victim testimony) was vital for catharsis and public empathy, but the core duty is to establish the factual and moral record. The *wrongness* is non-negotiable.
  *   **Discharging the Duty (TRC Mechanism):**
      *   Public hearings + transcripts + final report constitute a formal, state-sanctioned act of institutional remembering. It creates an *authoritative archive*.
      *   **Crucial Ambiguity:** Is it "remembering" or "enabling forgetting"? Margalit might argue:
          *   *Yes:* It forces public acknowledgment by perpetrators and creates an indelible record. The ritual *is* the act of collective remembering, especially for the state and society at large.
          *   *But:* The amnesty trade risks making the testimony a *substitute* for deeper societal engagement ("we had the hearings, it's done"). If the archive isn't actively engaged with *beyond* the ritual, the duty may be superficially discharged. Ritual *can* be closure that permits forgetting.

  **II. TRC Mapped onto Rieff (Case for Forgetting)**
  *   **Weaponization of Memory?**
      *   *Not Primarily by the TRC Itself:* The TRC aimed explicitly at *national healing*, not perpetuating conflict. Granting amnesty *required* truth-telling, diffusing the weaponization potential of unacknowledged grievances.
      *   *But Risk Exists:* The archive *can* be weaponized later (e.g., to reignite grievances, target individuals named). Rieff would warn the archive itself is a potential future weapon, even if the TRC process mitigated immediate dangers.
  *   **Engineered Forgetting as Necessity:**
      *   *Core Rieffian Defense:* The TRC is a *paradigm case* for Rieff. Forgetting legal accountability (impunity via amnesty) was the explicit price paid for truth and stability. Forgetting vengeance and perpetual legal battles was essential for the country to become "survivable." This *is* Rieff's core argument: sometimes strategic forgetting is necessary for peace and a functioning future.
      *   *Problem for Rieff?* TRC didn't advocate forgetting the *events* or their *wrongness* – it demanded their *remembering*. It engineered forgetting of *legal consequences* and arguably *personal animosity at a societal scale*, while manufacturing *institutional memory*. This selective approach challenges Rieff's sometimes-binary framing; the TRC shows complex curation (remember *this*, institutionally forget *that*) can be the survival mechanism.

  **III. Pushing the Theories: Your Concepts**

  1.  **Archive Substitution:**
      *   **Is it Remembering?** Margalit would likely say **No.** His "duty" is grounded in "thick relations" – lived, felt connections between people. An archive, no matter how accessible, is "thin." It's data. If no one *cares*, if it doesn't shape identity or moral understanding in living communities, the *moral* act of remembering hasn't occurred. The duty requires *human engagement*, not just storage. The archive is a *tool* for remembering, not remembering itself.
      *   **Duty on Persons:** This exposes a tension in Margalit. While the state has a duty to *create the conditions* for remembering (the archive), the core *moral* duty to remember resides with individuals and communities bound by thick relations. Outsourcing to archives risks discharging the *institutional* duty while failing the *moral/communal* one. The duty *does* turn out to be on persons all along; the archive is merely a (vital) scaffold.
      *   **Rieff's View:** He'd likely see archive substitution as relatively *harmless* "storage." If society has genuinely moved on (forgotten the live grievance), the archive is inert data, fulfilling an historical function without being a weapon. This *is* a form of successful, socially embedded forgetting, even with the archive existing. The duty (if he acknowledged one) would lapse once the thick relations fade.

  2.  **Witness Horizon:**
      *   **Duty Transformation:** Both theories struggle here. Margalit's thick relations become impossible with the last witness. The duty *must* transform:
          *   *Bearer:* It shifts decisively from victims/perpetrators/society (as experiencers) to the **state** (as custodian of the archive) and **subsequent generations** (as learners). It becomes an educational/preservation duty.
          *   *Character:* It changes from a duty grounded in shared experience/accountability to a duty grounded in **historical preservation, civic education, and preventing recurrence.** The "felt experience" duty largely lapses; the "factual/moral wrongness" duty intensifies as abstraction increases.
      *   **TRC Success/Failure by this Standard?**
          *   *Success:* It explicitly aimed to bridge the witness horizon by creating a massive, permanent, accessible archive *before* the witnesses died. It captured names, facts, and *some* raw emotion for posterity. Spain's "Pact of Forgetting" (deliberate *non*-documentation and avoidance) is the stark contrast – ensuring memory died with the witnesses.
          *   *Failure Risk:* Capturing testimony isn't the same as ensuring *meaningful engagement* post-horizon. If the archive becomes a museum piece, consulted only by specialists, while public consciousness moves on, the *living moral force* of memory fades. The TRC created the *potential* for memory, but not its guaranteed future vitality. Its success hinges on *how* the archive is used by future generations and institutions (schools, media, courts).
      *   **Your Hunch is Correct:** Both Margalit (thick relations require living connections) and Rieff (collective memory as active force) implicitly assume a population for whom the memory is *live* (either as duty or weapon). The witness horizon breaks this. The TRC is a fascinating, deliberate attempt to *manage* this transition, moving memory from embodied experience to institutionalized record. Its ultimate success depends on whether future generations treat the archive as a living moral reference point or a historical relic – a question neither theorist adequately addresses, as it's about the *transmission* and *activation* of archived memory over deep time.

  **Conclusion:** The TRC forces both theories into nuance. For Margalit, it reveals the state's crucial role in *facilitating* the duty and the risk that ritual substitutes for lived memory. For Rieff, it demonstrates that strategic *legal* forgetting can enable *institutional* remembering and societal stability. Your concepts hit where the theories are weakest: **Archive substitution** reveals that Margalit's duty fundamentally resides with persons, not data, and that Rieff might accept archives as benign storage. The **witness horizon** exposes the critical, unresolved challenge of transmitting the *moral weight* of memory beyond the living generation, a transition the TRC explicitly engineered but whose long-term success remains contingent on future engagement with its archive.
