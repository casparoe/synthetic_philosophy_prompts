answer: |-
  Here’s a specification for a "disease" account tailored to **distinguishing treatment from enhancement in coverage disputes**, while allowing retrospective correction of medical misclassifications. Cases are prioritized to stress-test theories, with requirements marked for negotiability and operational level.

  ---

  ### **Core Requirements (Non-Negotiable)**
  1. **Asymptomatic Conditions**  
     - **Case**: *Ductal carcinoma in situ (DCIS)* — non-invasive cancer cells with zero symptoms until progression.  
     - **Requirement**: Must classify as disease *before* symptoms manifest if it poses significant future harm.  
     - **Level**: Part (specific pathology).  
     - **Why non-negotiable**: Coverage for *preventive* interventions (e.g., mastectomy) hinges on this.

  2. **Non-Universal Prevalence**  
     - **Case**: *Myopia* (nearsightedness) — affects ~30% of adults, correctable with lenses.  
     - **Requirement**: Must *not* classify a condition as "non-disease" solely due to high prevalence.  
     - **Level**: Person (functional impact).  
     - **Why non-negotiable**: High prevalence ≠ acceptability (e.g., dental caries is a disease despite being common).

  3. **Preference-Dependent Status**  
     - **Case**: *Infertility* — unwanted infertility is treated; voluntary sterilization is not.  
     - **Requirement**: Must allow a condition’s *disease status* to depend on patient goals (not just biology).  
     - **Level**: Person (functional goals).  
     - **Why non-negotiable**: Determines coverage (e.g., IVF vs. tubal ligation reversal).

  ---

  ### **Critical Tension-Testers (Negotiable but Illuminating)**
  4. **Mere Risk Factors**  
     - **Case**: *High LDL cholesterol* — no symptoms but increases heart attack risk.  
     - **Requirement**: Should classify as disease *iff* intervention reduces risk *and* aligns with patient values.  
     - **Level**: Part (biomarker), but person-level consent required.  
     - **Negotiable**: Some insurers exclude statins for primary prevention in low-risk patients.

  5. **Socially Caused Conditions**  
     - **Case**: *Reactive depression* due to systemic oppression (e.g., racism-induced).  
     - **Requirement**: Must classify as disease *without* requiring an "internal dysfunction."  
     - **Level**: Person (distress/function).  
     - **Negotiable**: Coverage may exclude social determinants (e.g., therapy covered, housing not).

  6. **Your Bone-Density Variant**  
     - **Case**: *Osteopenia variant* — painless, non-progressive, +5% fracture risk post-80, no screening.  
     - **Requirement**: Must *exclude* this from "disease" category to avoid medicalization of trivial risks.  
     - **Level**: Part (biomechanics), but person-level impact minimal.  
     - **Negotiable**: Could be covered if cost-benefit favors intervention (rare).

  7. **Past Misclassifications**  
     - **Case**: *Homosexuality* (declassified as disease in 1973) or *female hysteria*.  
     - **Requirement**: Must permit retrospective correction *without* implying original definition was incoherent.  
     - **Level**: Person (social norms shift).  
     - **Negotiable**: Some argue medicine should never have classified these.

  ---

  ### **Desiderata vs. Prejudices**
  - **Desiderata**:  
    - Preference-dependence (3) — Necessary for patient-centered care.  
    - Correcting past errors (7) — Essential for scientific progress.  
  - **Camp Prejudices**:  
    - "Value-free" definitions (Naturalist bias) — Ignores role of goals in defining harm.  
    - "Dysfunction required" (Boorsean bias) — Excludes socially caused diseases (5).  

  ---

  ### **Key Tensions: What Can’t Be Jointly Satisfied?**
  - **Conflict**: **Value-Neutrality** + **Retrospective Correction**.  
    - *Why*: Classifying past errors (e.g., hysteria) requires admitting that *values* (not facts) changed. If "disease" is value-free, declassification implies we discovered new *facts* — but for hysteria, it was ethical/political shift.  
    - **Your guess is correct**: Value-freedom and revisability clash. To call past classifications "mistakes," you need normative criteria (e.g., harm reduction, autonomy) — not just biological facts.

  ---

  ### **Most Damaging Requirement Against Leading Theories**
  - **Against Biostatistical (Boorse) Dysfunction View**:  
    - **Requirement**: Socially caused conditions (5).  
    - **Why**: Reactive depression lacks "internal dysfunction" (it’s a normal response to trauma) but warrants treatment. Boorse can’t classify it as disease without abandoning his core premise.  

  - **Against Normativism ("Disease = Disvalued State")**:  
    - **Requirement**: Asymptomatic/risk-factor cases (1, 4).  
    - **Why**: High cholesterol isn’t *disvalued* (no symptoms) and may not warrant medical attention until risk is calculated. Pure normativism collapses treatment/enhancement (e.g., statins for high LDL vs. nootropics for cognitive "enhancement").

  ---

  ### **Operational Level: Person vs. Part**
  - **Requirement**: Must operate at **both** levels:  
    - *Part-level* for pathology (e.g., DCIS cells).  
    - *Person-level* for functional impact (e.g., infertility).  
  - **Free Choice?**: No — the theory *must* integrate both to handle cases like risk factors (part-level biomarker, person-level risk tolerance).

  ---

  This spec forces trade-offs: a "person-level harm + corrigibility" framework satisfies treatment/enhancement distinction (requirements 1–4) but struggles with social causation (5). To exclude medicalization of minor variants (6), it must define "significant harm" — which is inherently value-laden, clashing with value-neutral revisability (7). **The irreconcilable core: Medicine’s authority rests on objectivity, but disease judgments are unavoidably normative.**
