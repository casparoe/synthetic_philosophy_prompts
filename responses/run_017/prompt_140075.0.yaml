  Okay, the user is on a city's Naming and Memorials Commission and needs to figure out a consistent approach for handling a bust of Councilwoman Ora Bell Kendrick. They provided nine past decisions and want principles derived from those. Let me start by reviewing each case to identify patterns.

  First, the Confederate statue removal: removed but stored. The reason was likely its association with white supremacy and no redeeming public value. Then the street name kept because it became a neutral navigation tool. The Progressive-era mayor kept with a plaque, showing that contributions can outweigh harms if contextualized. The school renamed because children are a captive audience. Segregation governor moved to a museum, indicating relocation for educational context. Labor leader bust kept without a plaque, suggesting separable commendable actions. Pioneer Mother removed because it celebrated dispossession without specific individuals. Founders' plaque reworded for inclusivity. City name not touched as beyond their scope.

  From these, principles emerge: harm vs. benefit balance, audience (like schools vs. streets), separability of actions, whether the commemoration is active or passive, and if the figure is specific or symbolic. Also, relocation to museums for historical context is an option.

  Now for Kendrick. She's the first Black woman on council, fought for desegregation, but supported harmful laws and never apologized for coerced confessions. The bust is in a library lobby, a space of learning. School groups engage with it, and it's the only representation of a Black woman. Her family threatens to pull funding for a reading prize if removed.

  Applying the principles: Her positive contributions are significant, similar to the Progressive mayor and labor leader. But her harmful actions are recent, and she didn't apologize. The library context is active, like the school, but the museum move was used for the governor. The labor leader had separable actions; can Kendrick's be separated? Her bust's prominence in the lobby might be an issue, like the school requiring respect. However, the library isn't mandatory like a school. The counter-petition from her Black-majority neighborhood and civil rights group adds weight. Representation matters here, as it's the only bust of a Black woman.

  Possible actions: Keep with a plaque, move within the library, move to museum, or remove. Precedent suggests contextualization. The closest analog is the Progressive mayor: kept with a plaque despite segregationist past. But Kendrick's actions are more recent, and victims are directly involved. The governor was moved to a museum, but he was a segregationist without redeeming local actions. The labor leader was kept without a plaque, but Kendrick's harms are ongoing issues.

  The key is whether her commendable actions can be separated from the harmful ones. Her fight for desegregation is notable, but her stance on habitual-offender laws and gay rights affects living communities. The plaque could address both, but the library staff suggests moving to local history, which might reduce visibility but preserve context. However, moving it might be seen as downgrading her achievements, especially given representation concerns.

  The family's funding threat shouldn't dictate the decision but highlights community ties. Ethically, representation matters, but not as a tiebreaker; it's about correcting historical exclusion. A plaque should acknowledge her civil rights work and her controversial stances, noting the lack of apology. This aligns with the mayor's treatment.

  The user needs consistency. Precedents support contextualization unless the audience is captive (school) or the symbol is inherently harmful (Confederate, Pioneer Mother). Kendrick's bust isn't inherently harmful; her legacy is mixed. Moving to the history room balances visibility and context, similar to relocating the governor but within the same institution. This respects both her contributions and the harm done.
