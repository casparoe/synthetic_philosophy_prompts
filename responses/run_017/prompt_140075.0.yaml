  Here’s a systematic breakdown as a political philosopher specializing in symbolic reparations, working through principles, precedents, and a concrete recommendation for Kendrick’s bust. I’ll unpack this step by step, then commit.

  ---

  ### **Core Principles Derived from Precedents**
  Your commission’s track record reveals three competing (and often conflicting) principles:

  1.  **The Moral Harm-Benefit Balance Test:**  
      *Weigh the gravity of harms caused against civic benefits, prioritizing enduring community values.*  
      - **For removal/relocation:** Harm dominates if it’s foundational (slavery, segregation, dispossession) or targets vulnerable groups (Case 1, 4, 7).  
      - **For retention:** Benefits outweigh harms if they are transformative (e.g., infrastructure, labor rights) and harms are "separable" (Case 3, 6).  
      - **Tiebreaker:** Proximity of harm to living victims matters (Case 4’s school vs. Case 3’s plaque).

  2.  **The Commemoration Context Principle:**  
      *The physical/social context determines whether an honor is active endorsement or passive history.*  
      - **Active spaces** (schools, prominent lobbies): Require unalloyed role models (Case 4).  
      - **Passive/public spaces** (streets, squares): Tolerate complex figures if symbolic value is diluted (Case 2, 3, 6).  
      - **Museums/archival settings:** Neutralize harm via curatorial framing (Case 5).

  3.  **The Representational Equity Principle (Implicit but Underdeveloped):**  
      *Commemorative landscapes must rectify historical exclusions, especially when identity shapes civic belonging.*  
      - Seen in Case 8’s plaque revision (adding omitted groups) and Case 9’s paralysis on the city name.  
      - But overridden by severe moral harm (e.g., no Confederate retention for representation).

  ---

  ### **Predictions for Kendrick’s Bust Based on Precedents**
  | Principle              | Prediction for Kendrick’s Bust                                                                 | Closest Analog (Why?)                                                                 |
  |------------------------|------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------|
  | **Harm-Benefit Balance** | **Relocate to museum/history room** (Her harms are recent, unrenounced, and affect living communities; benefits are significant but separable). | Case 5 (segregationist governor to museum) – both mixed-legacy officials with direct victims. |
  | **Commemoration Context** | **Move within library to local-history room** (Lobby is an "active" space like a school; history room is "passive/educational" like a museum). | Case 4 (school renamed) – both involve spaces where audiences are captive and aspirational. |
  | **Representational Equity** | **Retain in lobby with plaque** (Removing the only Black woman’s bust perpetuates erasure; contextualize harms). | Case 3 (segregationist mayor with plaque) – civic benefits + representation outweigh harms when framed. |

  ---

  ### **My Recommendation: Relocate to Library History Room with Contextual Plaque**  
  **Not on the fence: This best reconciles principles *and* precedents.** Here’s why:  
  - **Consistency with Track Record:**  
    - Like the segregationist mayor (Case 3) and governor (Case 5), Kendrick has **weighty civic contributions** (desegregation) and **documented harms** (coercive justice, anti-gay policies).  
    - But unlike the mayor’s statue in a park, a **library lobby is an active, values-laden space** akin to a school (Case 4) – not a neutral street (Case 2). Children are literally asked to emulate her.  
    - The **governor-to-museum precedent (Case 5)** supports relocation to a curated setting, but keeping it *within the library* balances representation concerns (avoids "disappearing" her).  
  - **Moral Weight of Representation:**  
    - Representation isn’t a "tiebreaker" – it’s a **corrective justice imperative**. Removing the sole Black woman’s bust *without equivalent replacement* compounds historical harm. But this doesn’t override unaddressed harms (e.g., Case 1’s Confederate removal).  
    - Relocation to the history room **preserves visibility** while acknowledging complexity.  
  - **Reject the Funding Threat:**  
    - **Discounted entirely.** Extortion undermines democratic deliberation. Public symbols cannot hinge on private conditional gifts.  
  - **Plaque Text (Draft):**  
    > "*Ora Bell Kendrick (1928–1995), first Black woman on City Council, championed school and housing desegregation. This bust, funded by community donations in 1981, honors those achievements. Kendrick also supported policies now widely condemned: the 1977 habitual-offender law, the police chief during wrongful conviction scandals, and opposition to gay rights. Her legacy challenges us to reconcile groundbreaking progress with enduring harms.*"  

  ---

  ### **If Precedents Underdetermine the Case?**  
  They *nearly* do – but **relocation within the library** commits to a new hybrid principle:  
  > ***"In spaces of active civic education, commemoration of complex figures requires archival contextualization – preserving representation while rejecting hagiography."***  

  Other options’ principles:  
  - **Leave in lobby**: Endorses "great deeds" excusing harms (inconsistent with Case 4).  
  - **Leave with plaque**: Treats library like a park (ignores captive-audience concern).  
  - **Move to museum**: Prioritizes harm mitigation over local representation (valid but extreme here).  
  - **Remove**: Elevates harm above all else (inconsistent with Cases 3, 5, 6).

  ---

  ### **Test Case to Clarify Rules**  
  Add: **A 1930s bridge named for an engineer who designed critical infrastructure but barred Black workers from his projects.**  
  - **Harm-Benefit Test:** Likely rename (exclusion foundational to his legacy).  
  - **Context Principle:** Keep (infrastructure names are "passive" like streets).  
  - **Representation:** Rename if bridge links historically segregated neighborhoods.  
  *(This exposes tension between Harm-Benefit and Context rules.)*

  ---

  ### **Final Summary**  
  **Act:** Relocate bust to library history room + plaque.  
  **Why:** Upholds Harm-Benefit Balance (harm is recent/unaddressed) and Commemoration Context (lobby ≠ passive space), while respecting Representational Equity through retained – but reframed – visibility. **Closest analog is Case 5 (governor to museum), but adapted for site-specificity.** The family’s threat is irrelevant; the moral claim of representation is real but not absolute. This isn’t compromise – it’s principled coherence.
