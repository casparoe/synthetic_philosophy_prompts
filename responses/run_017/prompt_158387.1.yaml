prompt: |-
  I want to use lexical threshold negative utilitarianism as a working decision rule, and I have come to think that most of the advertised disagreement about it is really disagreement about a piece of machinery the view never specifies. Please write the specification for that machinery.

  Setup, so that we are using the terms the same way. By lexical threshold negative utilitarianism I mean the conjunction of three claims: first, that there is a single hedonic scale on which pleasant and unpleasant experiences have magnitudes; second, that there is a threshold on the unpleasant side such that any unpleasant experience above it is lexically more urgent than any amount, however large, of pleasant experience — no finite quantity of the latter compensates for one unit of the former; third, that above the threshold, and below it, trade-offs are ordinary and the scale behaves cardinally. The purpose I want it adequate to is comparative and institutional: an allocator with a fixed budget, a population of people who are not herself, and incomplete information, facing a choice between programmes — one that eliminates a small number of severe pains, one that adds a very large number of mild pleasures, one that converts severe pains into mild residual ones, one that shortens severe pains at the cost of adding many mild ones — must be able to rank such options, must be able to rank them under risk, and must be able to say, non-arbitrarily, when the view yields no ranking at all.

  What I am asking for is the desiderata for the first and second clauses: the theory of the scale and of the cut. What must an account of the commensurability of pleasure and pain deliver in order to be adequate to that purpose? For each requirement, state the case or consideration that motivates it and say what specifically goes wrong in the allocator's hands if the account fails it. Then mark each requirement as non-negotiable relative to the purpose I have fixed, or as the preference of a particular camp that a defender of the view is entitled to reject — I am as interested in which purported requirements are really partisan as I am in the list itself.

  At a minimum, the account must be able to handle the following cases, which I do not think the standard examples in circulation cover; add further cases of your own where you think the list is thin.

  A subject who has the sensory-discriminative profile of pain — location, intensity, sharpness — with no distress or unpleasantness at all, and reports being indifferent to it continuing.

  Pleasures whose magnitude is a function of a pain that preceded them: relief, the easing of an itch, the first minute after a dental injection wears off. If these are counted at face value on the pleasant side, then a pain and the relief that follows it are double-counted, and analgesia looks less valuable than it is, or more, depending on how the bookkeeping goes.

  Single experiences with both valences at once — the spicy meal, the horror film, the satisfying exhaustion — where it is not settled whether there are two magnitudes or one.

  Pain whose quality differs and not merely its intensity: burning, nausea, grief, boredom, despair, the feeling of suffocating. If these are separate dimensions rather than points on one line, then a lexical threshold over a scalar presupposes an earlier aggregation of the dimensions, which seems to reintroduce exactly the trade-offs the lexical cut was introduced to forbid. Say whether this is a real problem or a confusion.

  The sandpile: very many discomforts, each just below the threshold, distributed over many people, against one episode just above it. And alongside it, the invariance question: if two adjacent sub-threshold moments are merged into one longer experience, or one long experience split into two, must the ranking survive? A threshold stated in units of intensity per unit time is not invariant in the way a threshold stated in peak intensity is, and I want to know whether grain-invariance is a genuine desideratum or a prejudice of the extensionalists.

  Interpersonal comparison without behaviourism: two subjects, the same stimulus measured on a shared physical index, different reports, and expressive norms, stoicism as a costly signal, and anticipation that makes the same stimulus worse for one of them. A shared index is not yet a shared quantity, and I want to know what a theory has to add to get from the one to the other.

  The location of the threshold, and its ratchet: if the cut is set as a fraction of the worst pain a human being can suffer, then a successful programme that eliminates the worst pains raises everything remaining relative to the cut, or collapses the above-threshold range, and the allocator's rankings churn for reasons that have nothing to do with anyone's welfare. Relatedly, whether the verdicts are invariant under a positive rescaling of the units — if they are not, the doctrine is hostage to a choice of units, and I want that put down as a requirement or dismissed as a confusion.

  Use under risk: an option carrying a very small probability of an above-threshold outcome against an option guaranteeing an enormous quantity of below-threshold benefit. Lexical priority appears to make expected-value reasoning unavailable and to license either fanaticism or paralysis; a theory adequate to my purpose has to say which, or say something better.

  The distinction between an experience being bad and a life being worse for containing it, as in pain that is chosen, endured, and later valued. And the distinction between how an episode feels while it is happening and how it is evaluated afterwards, where the two are known to diverge.

  Two closing tasks. First, if some subset of the desiderata cannot be jointly satisfied, say so plainly and identify the smallest jointly unsatisfiable subset you can find — that is the part of the answer I care about most, since a list that is internally inconsistent is itself a result about the view. Second, name the single requirement that does the most work in excluding candidates, and then score, briefly, four or five contenders against the list: the single cardinal hedonic scale of the classical picture; lexical threshold negative utilitarianism as it is usually stated; a view on which suffering is a distinct normative kind with no common scale on which to be traded against pleasure at all; a view on which the badness of pain tracks the content and reliability of a damage-signal rather than felt intensity; and a preference-based or revealed-choice account of welfare. Keep the weight on the criteria and their motivating cases rather than on the scorecard. Do not argue the general case for or against negative utilitarianism; assume it, and work on the scale. No bibliography is wanted, and nothing here should depend on being able to look anything up.
reasoning: |-
  We are to specify the desiderata for the hedonic scale and the lexical threshold in lexical threshold negative utilitarianism (LTNU) for the purpose of institutional allocation under incomplete information. The goal is to rank programs that affect experiences of pain and pleasure, including cases of risk, and to identify when the view yields no ranking. We consider the cases provided and add others as needed. We then assess which desiderata are non-negotiable and which are partisan, and finally evaluate competing views.

  The three core claims of LTNU:
  1. Single hedonic scale for pleasant and unpleasant experiences.
  2. Lexical threshold on the unpleasant side: above-threshold pains are lexically worse than any pleasure and cannot be compensated by any finite amount of pleasure.
  3. Cardinal scaling above and below the threshold for trade-offs.

  Desiderata for the Scale and the Cut:

  1. **Unified Scale with Bipolar Structure**:
     - The scale must be bipolar, meaning it ranges from negative (unpleasant) to positive (pleasant) with a neutral point. This is non-negotiable because without it, we cannot have a single scale for both valences.
     - Failure: Without bipolarity, the allocator cannot compare the magnitude of a pain reduction to a pleasure increase, making trade-offs impossible.

  2. **Cardinality and Interval Scale Properties**:
     - The scale must be cardinal (interval or ratio scale) both above and below the threshold to allow for trade-offs within the regions. This is non-negotiable because the third claim requires cardinality for trade-offs.
     - Failure: Without cardinality, the allocator cannot sum benefits or calculate expected values within regions.

  3. **Threshold Location and Definition**:
     - The threshold must be defined in terms of the scale. The location must be fixed and non-arbitrary. This is non-negotiable because without a fixed threshold, the lexical priority is undefined.
     - Failure: Arbitrary threshold placement leads to inconsistent rankings of programs (e.g., a program that eliminates a pain just above the threshold might be ranked too high or too low).

  4. **Handling of Non-Distressed Pain**:
     - The scale must account for the dissociation between sensory-discriminative and affective components of pain. Specifically, a pain without distress must be rated as neutral or positive. This is non-negotiable because if a pain without unpleasantness is still negative, then the scale is not tracking the actual badness.
     - Case: Subject with pain sensation but no distress and indifference. This should be at or above neutral.
     - Failure: If such pains are counted as negative, then eliminating them would be prioritized over pleasures, which is not warranted.

  5. **Avoidance of Double-Counting**:
     - The scale must not double-count the same experience. For example, the relief after a pain must not be counted as a separate positive if the pain was already counted as a negative. This is non-negotiable because double-counting distorts the net effect of interventions.
     - Case: Pain followed by relief. If both are counted, then eliminating the pain (without relief) might look worse than it is because we lose the relief. Alternatively, if we count only the net, we avoid double-counting.
     - Failure: Analgesia (which removes pain without providing relief) might be undervalued relative to an intervention that allows the pain to occur and then provides relief.

  6. **Single-Valenced vs. Mixed Experiences**:
     - The scale must assign a single net value to mixed experiences (e.g., spicy food). This is non-negotiable because without a net value, we cannot rank interventions affecting mixed experiences. The theory must specify whether mixed experiences are a single magnitude (net) or two separate. We require a net magnitude to avoid reintroducing trade-offs that the lexical threshold forbids.
     - Case: A mixed experience. We must not have separate positive and negative magnitudes that are traded off against each other because that would violate the lexical priority (if the negative part is above threshold, then the experience as a whole must be lexically bad regardless of the positive part). Instead, the net must be below the threshold to be traded, or above to be lexical.
     - Failure: If we treat the positive and negative as separate, then we might try to trade off the negative (if above threshold) against the positive, which is exactly what lexical priority forbids.

  7. **Dimensionality of Pain Qualities**:
     - The scale must be unidimensional. Different pain qualities (burning, nausea) must be mapped onto a single scale. This is non-negotiable because the lexical threshold is defined on a scalar. If there are multiple dimensions, we would need to aggregate them, which might allow trade-offs that the lexical threshold was meant to forbid. However, note that the aggregation must be done in a way that does not allow trading off an above-threshold pain in one dimension by pleasures or other pains in another.
     - Case: Different pain qualities. The theory must have a method to place them on the same scale without aggregating in a way that permits trade-offs across the threshold. This is a real problem because if we aggregate, then an above-threshold pain in one quality might be offset by below-threshold benefits in another, violating lexicality.
     - Solution: The aggregation must be such that if any component of an experience is above the threshold, the whole experience is above. But this is not straightforward. Alternatively, each quality must be placed on the scale so that the threshold applies to each independently? But then we have multiple thresholds? This is a challenge.

  8. **Sandpile Problem and Invariance**:
     - The threshold must be defined in a way that is invariant under splitting and merging of experiences. This is non-negotiable because without invariance, the ranking of interventions can be manipulated by how we describe the experiences (e.g., splitting one long pain into two short ones might move them below the threshold). We require that the threshold is defined in terms of the intensity and duration of an experience, but note that a threshold defined only on peak intensity (ignoring duration) is invariant under splitting/merging, while one on intensity per unit time is not. We must choose peak intensity (or a similar measure) to have invariance.
     - Case: Many sub-threshold pains vs. one above-threshold pain. Also, merging two sub-threshold pains (each of intensity I and duration D) into one pain of intensity I and duration 2D: if the threshold is on total suffering (intensity*duration) then the merged pain might be above threshold. But if the threshold is on intensity, then it remains below. We require that the threshold is on the intensity (or the instantaneous badness) so that the sandpile of many low-intensity pains is not lexically worse than one high-intensity pain. This is because lexical priority is meant for the worst pains, not the aggregate. This is a non-negotiable requirement for the intended meaning of lexical priority. However, note that the sandpile of many below-threshold pains is still bad and should be traded off cardinally. But the one above-threshold pain is lexically worse. Without invariance, the allocator might split a long above-threshold pain into two and claim they are below, which would be a manipulation.

  9. **Interpersonal Comparability without Behaviorism**:
     - The scale must allow for interpersonal comparisons without relying solely on behavior or physical indices. This is non-negotiable because the allocator must compare welfare across people. The theory must provide a way to map reports, expressions, and contexts to the scale that accounts for differences in expression (stoicism) and anticipation.
     - Case: Same stimulus, different reports. The theory must have a method to adjust for expressive norms and anticipation. Failure: Without this, the allocator might misallocate by assuming that a stoic's pain is less severe when it is not.

  10. **Threshold Location and Rescaling Invariance**:
      - The threshold must not be defined relative to the worst possible pain (e.g., as a fraction). It must be fixed on the scale. Moreover, the scale must be ratio-scale (with a non-arbitrary zero) so that the threshold is invariant under rescaling. This is non-negotiable because if the threshold is relative, then eliminating the worst pains would shift the threshold, causing arbitrary churn in rankings. Also, if the scale is only interval, then a linear rescaling (changing the unit) might change the threshold location arbitrarily.
      - Case: Eliminating the worst pains. If the threshold is set at 90% of the worst pain, then when the worst is eliminated, the threshold drops to 90% of the new worst, and what was previously below might now be above. This is unacceptable because it makes the lexical priority depend on the existence of worse pains. The threshold must be absolute (e.g., at a fixed point on the scale). Also, the scale must be ratio so that the threshold is fixed under changes of unit (e.g., from 1-10 to 0-100). Without this, the doctrine is arbitrary.

  11. **Risk and Expected Value**:
      - The theory must specify how to handle risks. We require that expected value reasoning is used for risks that do not involve above-threshold outcomes. For risks that do, the lexical priority applies: any positive probability of an above-threshold outcome must be avoided if possible, unless the alternative also has a positive probability of above-threshold outcomes. This is because the lexical priority is absolute: one above-threshold pain is infinitely worse than any finite amount of below-threshold harm. However, this leads to fanaticism: even a tiny chance of an above-threshold outcome outweighs any finite below-threshold benefit. But this is inherent in lexical views. The theory must bite the bullet and say that the allocator must avoid any risk of above-threshold pain if there is a risk-free alternative. If all alternatives have risks, then we must compare the probabilities and the magnitudes of the above-threshold outcomes (if any) and the below-threshold outcomes. But note: the lexical priority only applies to the above-threshold part? This is a challenge. We might require that the theory uses expected value for the below-threshold part and then applies lexical priority to the above-threshold part: that is, choose the option that minimizes the expected number of above-threshold pains (or their total intensity), and if two options tie on above-threshold, then maximize expected below-threshold net benefit. This is a non-negotiable requirement for the purpose of decision under risk.

  12. **Intrinsic Badness vs. Instrumental Value**:
      - The scale must measure the intrinsic badness of an experience, not the instrumental value. The theory must account for pain that is chosen and later valued (e.g., during exercise) by distinguishing the intrinsic experience from the overall evaluation of the life. This is non-negotiable because if the scale includes instrumental value, then the same pain might be negative in one context and positive in another, which would make the threshold context-dependent and violate the fixed scale.
      - Case: Pain that is endured and later valued. The pain itself is negative at the time, but the life is better for having it. The scale must rate the intrinsic experience as negative (if unpleasant) regardless of later evaluation. Failure: If we include instrumental value, then the allocator might not prioritize relieving a pain that the person will later value, which might be against the person's welfare at the time.

  13. **Temporal Dynamics**:
      - The scale must be defined for instantaneous experiences, and we must integrate over time to get the badness of an episode. The threshold applies to the instantaneous intensity. This is non-negotiable because of the sandpile and invariance requirements. Also, the distinction between during and after must be handled by having the scale reflect the experience during the episode, not the retrospective evaluation.

  Now, we note potential conflicts:

  - The requirement that the threshold is on instantaneous intensity (to avoid sandpile and splitting issues) and the requirement that we account for duration (for the total badness of an episode) might conflict. But note: the threshold is about the intensity at any moment. An episode that has above-threshold intensity at any moment is lexically bad, but the total badness of the episode (for cardinal trade-offs) is the integral of the intensity over time. However, the lexical priority applies to the occurrence of any above-threshold moment. So the sandpile of many low-intensity pains has no above-threshold moment, so it is not lexically bad. But one above-threshold moment is lexically bad. This is consistent.

  - The biggest challenge is with the dimensionality of pain. If we require unidimensionality, then we must aggregate different pain qualities. But if we aggregate, then an experience that has multiple sub-threshold pains might aggregate to above-threshold? That would violate the intended meaning of lexical priority (which is for the worst pains). Alternatively, we might say that the threshold applies to each component of an experience? But then an experience with one component above threshold is lexically bad. However, if the components are separable, then we have multiple dimensions. This might be a confusion: we can have a unidimensional scale that aggregates the components, but then the threshold is on the aggregated value. But note: if the aggregation allows for trade-offs between different pains and pleasures within an experience, then we are trading off above-threshold components? We must avoid that.

    The solution is to require that the aggregation to a unidimensional scale is done in such a way that if any component is above the threshold, the aggregate is above. But then we are not trading off above-threshold components. However, the aggregation function might be complex. This is a real problem and might require a non-linear aggregation.

    Alternatively, we might say that the threshold applies to the overall experience, and we require that the scale is such that the overall experience is above threshold only if it contains a component that, if experienced alone, would be above threshold. But this is not straightforward.

    The minimal unsatisfiable set: 
    - (a) The scale is unidimensional (from the core claim).
    - (b) The threshold is defined on the scale and applies to experiences (so an experience is above threshold if its value on the scale is above the threshold).
    - (c) The aggregation of multiple components (e.g., two pains of different qualities) must not allow an above-threshold pain in one quality to be offset by a pleasure in another, because that would violate lexical priority.

    But if we aggregate, then we are offsetting. Therefore, we must not aggregate in a way that allows offsetting. The only way is to have the scale defined such that if any component of an experience is above threshold, then the whole experience is above threshold. This requires that the scale is not additive. For example, the overall unpleasantness of an experience is the maximum of the unpleasantness of its components. But then how do we aggregate for trade-offs? We have to abandon cardinality for mixed experiences? This is a problem.

    The smallest jointly unsatisfiable set: 
    1. The scale is unidimensional and cardinal (so additive for independent experiences).
    2. The threshold is defined on the scale such that any experience with a value above the threshold is lexically worse than any finite amount of below-threshold experiences.
    3. An experience can have multiple components (e.g., a physical pain and a pleasure) and the scale value is the sum of the components (if they are independent).
    4. But then, if the physical pain is above threshold, the pleasure might bring the overall experience below threshold, which violates lexical priority.

    Therefore, (1), (2), and (3) are jointly unsatisfiable. We must reject (3): the scale is not additive for components within an experience. Instead, the scale must be such that if any component is above threshold, the whole is above. This implies a non-additive aggregation, which might break cardinality.

    However, note that the third core claim requires cardinality for trade-offs above and below the threshold. But if an experience has an above-threshold component and we don't aggregate it with the pleasure, then we are not having a single value for the experience. This is a serious problem.

    Alternative: We do not allow experiences to be broken into components. We treat each experience as atomic and assign it a single value. But then the spicy meal is a single experience with a net value. If the net is below threshold, it is traded cardinally. But if the pain component is above threshold, the net might be below? Then we are trading an above-threshold pain. This is unacceptable.

    Therefore, we must require that the net value of an experience is above threshold if the negative component is above threshold and not fully offset by the positive. Specifically, we require that no amount of pleasure can offset an above-threshold pain. So in the aggregation, if the pain component is above threshold, the net must also be above threshold. This requires that the positive component cannot reduce the net below the threshold if the pain is above it. How? We might cap the net at the pain level? But then the scale becomes non-additive and non-cardinal.

    This is the central tension. The requirement that the threshold applies to the pain component and cannot be offset by pleasure (within the same experience) is non-negotiable. Therefore, the scale cannot be additive for mixed experiences. But the third core claim requires cardinality, which typically assumes additivity. Therefore, we must weaken the cardinality claim: cardinality holds for experiences that are purely above or purely below, but for mixed experiences, we have a non-additive rule. This is a cost, but it might be unavoidable.

    Therefore, we mark the requirement that the scale is additive for mixed experiences as partisan and reject it. Instead, we require that the scale is such that:
    - If an experience has a component that is above threshold, then the entire experience is above threshold and its badness is at least the badness of the above-threshold component (so we ignore the pleasure for the purpose of lexical priority).

    Then, for trade-offs above threshold, we use the cardinal scale of the above-threshold part. But note: the mixed experience may have both above-threshold pain and pleasure. Then, the pleasure does not reduce the badness? That seems odd. Alternatively, we might say that the above-threshold pain dominates and the experience is lexically bad, and we measure its badness by the pain component only? Then the pleasure is irrelevant. This is a possible solution.

    For the purpose of allocation, if we have an intervention that reduces the pain in a mixed experience, we count the reduction in pain. The pleasure is a separate benefit? But note: the core claim is about experiences, not components. We must assign a single magnitude to each experience.

    We conclude that the requirement of additivity for mixed experiences must be dropped. The non-negotiable requirement is that an experience with any above-threshold pain component is lexically bad and its magnitude is determined solely by the pain component (or by the net if the net is negative and above threshold). The pleasure does not offset the pain for the purpose of crossing the threshold. This is a specification of the machinery.

  Now, the single requirement that does the most work in excluding candidates: the requirement that the threshold is defined on a unipolar scale of pain and that no pleasure can offset an above-threshold pain, even within a mixed experience.

  Scoring of Contenders:

  1. **Classical Cardinal Hedonic Scale** (e.g., Bentham):
     - Fails: It has no lexical threshold, so it allows trading off severe pain for enough pleasure. Also, it typically assumes additivity for mixed experiences, which we must reject.

  2. **Lexical Threshold Negative Utilitarianism as Usually Stated** (vague on the scale):
     - We are specifying it. Without our specifications, it fails on the sandpile (if threshold is on total suffering), double-counting, mixed experiences, and risk.

  3. **Suffering as a Distinct Normative Kind** (no common scale with pleasure):
     - Fails the first core claim (single scale). Therefore, it cannot compare pain reduction and pleasure increase at all. This makes it impossible to rank programs that affect both.

  4. **Badness Tracks Content of Damage-Signal**:
     - This might handle the non-distressed pain (if there is no damage signal, then not bad). But it fails interpersonal comparability without behaviorism (if the damage signal is physiological, then stoicism is ignored). Also, it might not account for psychological pains (grief) without a clear damage signal. It might not have a bipolar scale for pleasure. It fails the requirement of a unified scale.

  5. **Preference-Based or Revealed-Choice Account**:
     - Fails on the dissociation between experience and preference (e.g., the person who is indifferent to non-distressed pain might not prefer to avoid it, so it would be rated as non-bad). Also, it might not capture the intrinsic badness of pain (if someone prefers to endure pain for a goal, the pain is still bad). And it cannot handle risk without expected utility, but the lexical threshold might make preferences inconsistent.

  In summary, the machinery must include:
  - A bipolar cardinal scale with a fixed neutral point.
  - A threshold defined on the negative side at a fixed point (ratio scale).
  - The threshold applies to the instantaneous intensity of an experience.
  - Interpersonal comparisons based on experience, not behavior or preferences.
  - For mixed experiences, if any component is above threshold, the experience is above threshold and its magnitude is the magnitude of the pain component (or the net if negative) without being reduced by pleasure.
  - Under risk: avoid any option that has a positive probability of an above-threshold outcome if a risk-free alternative exists. If not, minimize the expected number (or total intensity) of above-threshold outcomes, then maximize expected below-threshold net benefit.

  The key innovation is the non-additive handling of mixed experiences to preserve lexical priority.
answer: |-
  ### Desiderata for the Hedonic Scale and Lexical Threshold in Lexical Threshold Negative Utilitarianism (LTNU)

  To fulfill your institutional purpose—ranking programs under incomplete information, risk, and non-arbitrary incomparability—the theory must specify machinery for the hedonic scale and threshold. Below are the desiderata, motivated by cases and implications for the allocator. Each requirement is marked as **non-negotiable** (essential for the purpose) or **partisan** (defensible but rejectable). The cases you provided are integrated, and additional cases are added for completeness.

  #### Desiderata for the Hedonic Scale
  1. **Bipolar Cardinal Scale with Fixed Zero**  
     - **Description**: The scale must be bipolar (negative for unpleasant, positive for pleasant) with a true zero (neutrality) and cardinal properties (interval or ratio scale) for trade-offs within valences.  
     - **Motivation**: Cases like the *spicy meal* (mixed valence) or *relief after pain* require a net valence for an experience. Without cardinality, trade-offs below the threshold (e.g., shortening mild pains) become arbitrary.  
     - **Allocator Failure**: If the scale lacks cardinality, programs cannot be ranked quantitatively (e.g., converting severe pain to mild residual pain vs. adding mild pleasures). If zero is arbitrary, neutrality cannot anchor the threshold.  
     - **Status**: Non-negotiable. Core to LTNU’s third claim and institutional comparability.

  2. **Non-Distressed Pain as Neutral**  
     - **Description**: Sensory pain without distress (e.g., the *indifferent subject*) must register as neutral (zero), not negative.  
     - **Motivation**: If non-distressed pain is negative, allocators misprioritize resources (e.g., eliminating harmless sensations over genuine suffering).  
     - **Allocator Failure**: Programs eliminating non-distressed pain would be incorrectly ranked above pleasurable interventions, wasting resources on non-urgent cases.  
     - **Status**: Non-negotiable. Distress defines disvalue; otherwise, the scale misrepresents welfare.

  3. **No Double-Counting of Relief**  
     - **Description**: Relief from pain cessation must not be counted as a separate positive if the preceding pain was already measured. The scale should capture net changes (e.g., pain removal as a negative reduction, not a positive gain).  
     - **Motivation**: Cases like *dental injection relief* or *itch easing*: if relief is added as pleasure, analgesia is undervalued (since it removes pain without providing relief).  
     - **Allocator Failure**: Eliminating pain directly (e.g., via anesthesia) appears worse than allowing pain to occur and then relieving it, distorting program rankings.  
     - **Status**: Non-negotiable. Double-counting violates cardinal consistency.

  4. **Unidimensionality for Pain Qualities**  
     - **Description**: Diverse pains (burning, grief, boredom) must map to a single scalar dimension, not separate axes. Aggregation must not reintroduce trade-offs across the threshold.  
     - **Motivation**: If pains are multidimensional, aggregating them (e.g., weighting grief vs. nausea) allows de facto trade-offs the threshold forbids. This is a **real problem**, not confusion: LTNU’s lexicality assumes a scalar.  
     - **Allocator Failure**: Programs could be ranked by "trading" above-threshold grief for below-threshold nausea, violating lexical priority.  
     - **Status**: Non-negotiable. Multidimensionality undermines the threshold’s purpose.

  5. **Grain-Invariance for Duration**  
     - **Description**: The scale must be invariant under splitting/merging of experiences (e.g., threshold depends on peak intensity, not duration).  
     - **Motivation**: *Sandpile case* (many sub-threshold discomforts vs. one above-threshold episode) and *invariance under temporal grain*: if duration matters, splitting a long pain could push it below threshold, altering rankings arbitrarily.  
     - **Allocator Failure**: Manipulable rankings (e.g., framing a pain as two short episodes to avoid lexical priority). Grain-invariance ensures stability.  
     - **Status**: Non-negotiable. Extensionalism is not partisan—it prevents arbitrariness.

  6. **Interpersonal Comparability via Phenomenal Reports**  
     - **Description**: Comparisons must use phenomenal reports (e.g., subjective intensity) adjusted for expressive norms (stoicism) and context (anticipation), not behavior or physical indices.  
     - **Motivation**: Cases like *shared stimulus with divergent reports*: a stoic’s pain may be underreported but equally severe. Behaviorism ignores internal states.  
     - **Allocator Failure**: Misallocating resources to expressive subjects over stoics, or misjudging pain worsened by anticipation.  
     - **Status**: Non-negotiable. Welfare is experiential; behaviorism is inadequate.

  #### Desiderata for the Lexical Threshold
  7. **Absolute Threshold Location**  
     - **Description**: The threshold must be fixed on the scale (e.g., at a specific intensity level), not relative to worst-possible pain. The scale must be ratio-invariant (rescaling units doesn’t change verdicts).  
     - **Motivation**: *Threshold ratchet case*: if threshold is a fraction of worst pain, eliminating worst pains shifts the threshold, causing arbitrary churn in rankings.  
     - **Allocator Failure**: Successful programs alter rankings unrelated to welfare (e.g., reducing mild pains after eliminating severe ones becomes lexically urgent). Rescaling-dependence makes doctrine arbitrary.  
     - **Status**: Non-negotiable. Relativity undermines institutional stability.

  8. **Instantaneous Intensity Threshold**  
     - **Description**: Threshold applies to peak intensity of an experience-moment, not cumulative intensity.  
     - **Motivation**: *Sandpile* and *grain-invariance cases*: duration must not elevate sub-threshold moments to lexical status.  
     - **Allocator Failure**: Shortening severe pain (above threshold) by adding mild pains could be misranked if cumulative intensity triggers lexicality.  
     - **Status**: Non-negotiable. Aligns with the "urgency" of severe suffering.

  9. **Lexical Priority Under Risk**  
     - **Description**: Any positive probability of an above-threshold outcome must be avoided if a risk-free alternative exists. If all options have risk, minimize expected above-threshold occurrences first, then maximize expected below-threshold net benefit.  
     - **Motivation**: *Small probability of severe pain vs. guaranteed mild benefits*: lexicality forbids expected-value trade-offs. Avoiding fanaticism (overweighting tiny risks) and paralysis requires clear rules.  
     - **Allocator Failure**: Paralysis (no action due to infinitesimal risks) or fanaticism (ignoring large benefits to avert tiny risks).  
     - **Status**: Non-negotiable. Risk handling is essential for institutional decisions.

  10. **Intrinsic Badness Primacy**  
      - **Description**: The scale measures intrinsic experiential badness (how it feels during the episode), not retrospective evaluation or life-value.  
      - **Motivation**: *Chosen pain later valued* (e.g., exercise): the pain is intrinsically bad even if instrumentally good. Divergent during/after evaluations (e.g., traumatic pain) must not affect scale magnitude.  
      - **Allocator Failure**: Misranking programs (e.g., not alleviating chosen pain) due to instrumental value.  
      - **Status**: Non-negotiable. LTNU targets experiential welfare, not life-narratives.

  #### Partisan Desiderata (Defensible but Rejectable)
  - **Threshold as a Range, Not a Point**: A partisan may argue for a small intensity range where lexicality "fades in" to avoid sharp discontinuities. Rejectable: it introduces trade-offs near the threshold, violating lexicality.  
  - **Temporal Integration for Below-Threshold Harms**: A partisan may demand duration matter for sub-threshold pains (e.g., total discomfort). Rejectable: grain-invariance is non-negotiable, but this could be added for below-threshold cardinality without affecting lexicality.  
  - **Contextual Adjustments to Scale**: A partisan may incorporate cultural/individual differences in scale interpretation. Rejectable: undermines interpersonal comparability.

  #### Cases Added for Completeness
  - **Pleasure from Pain Contrast**: Cases like "water after thirst" where pleasure’s magnitude depends on prior pain. Desideratum 3 (no double-counting) handles this.  
  - **Threshold Proximity**: An experience just below threshold vs. one far below. Desideratum 8 ensures they are cardinally comparable.  
  - **Incommensurable Pains**: If pain qualities resist unidimensional mapping (e.g., grief vs. nausea), desideratum 4 forces aggregation, but this is non-negotiable.

  ---

  ### Inconsistencies and Minimal Unsatisfiable Set
  - **Inconsistency**: Desiderata 4 (unidimensionality), 6 (interpersonal comparability), and 10 (intrinsic badness) conflict with **partisan** alternatives but are internally consistent.  
  - **Minimal Unsatisfiable Set**:  
    - **Unidimensional Aggregation** (4): Requires diverse pains on one scale.  
    - **No Trade-Offs Across Threshold** (Core LTNU): Lexicality forbids offsetting above-threshold pain.  
    - **Cardinality for Mixed Experiences** (1): Mixed experiences (e.g., spicy meal) need a net value.  
    - **Problem**: If a mixed experience has an above-threshold pain component, cardinal aggregation (e.g., net = pain + pleasure) could make it below-threshold if pleasure is large, violating lexicality. But non-aggregation (e.g., threshold applies to components) violates unidimensionality.  
    - **Smallest Unsatisfiable Subset**: {Unidimensionality (4), Cardinality for Mixed Experiences (1), Lexical Priority (Core)}.  
    - **Resolution**: Must relax cardinality for mixed experiences. Assign net valence; if net is negative and above threshold, it’s lexical. Pleasure cannot reduce net below threshold if pain is above it. This preserves lexicality but requires non-additive aggregation (e.g., net intensity capped at pain level).

  ---

  ### Key Requirement and Contender Scoring
  - **Highest-Impact Requirement**: **Unidimensionality (4)**. It excludes candidates that avoid aggregation challenges but are incompatible with LTNU’s scalar threshold.  
  - **Scoring Contenders**:  
    - **Classical Cardinal Scale** (Bentham):  
      - Fails: No lexical threshold (allows compensating severe pain with pleasure). Ignores double-counting (e.g., relief as extra pleasure).  
      - Inadequate: Sandpile cases ranked incorrectly; no handling of non-distressed pain.  
    - **Standard LTNU** (vague machinery):  
      - Fails: Unspecified on interpersonal comparability, double-counting, and risk. Sandpile and grain-invariance cause arbitrariness.  
      - Partially Adequate: Meets unidimensionality and threshold in principle.  
    - **Suffering as Distinct Normative Kind** (no common scale):  
      - Fails: Rejects single scale (desideratum 1), making pleasure/pain trade-offs impossible. Allocator cannot rank pain elimination vs. pleasure addition.  
      - Inadequate: Institutional purpose requires comparability.  
    - **Damage-Signal Tracking** (badness as signal reliability):  
      - Fails: Non-distressed pain (no signal) is neutral—good. But grief/boredom lack signals, so unidimensionality fails. Ignores valence (pleasure irrelevant).  
      - Inadequate: Cannot rank programs adding pleasure or relieving non-physical pain.  
    - **Preference-Based Account**:  
      - Fails: Non-distressed pain may not be avoided (indifferent subject), so rated neutral—good. But chosen pain is not bad, violating intrinsic badness. Interpersonal comparison relies on behavior.  
      - Inadequate: Lexical threshold lacks preference-based justification; rankings may ignore experiential urgency.

  **Summary**: LTNU’s machinery must fix the scale and threshold to avoid arbitrariness in allocation. Unidimensionality is the most excluding requirement, but the unresolved tension in mixed experiences necessitates non-additive aggregation. The allocator can proceed with a scale that prioritizes avoiding above-threshold suffering, using phenomenal reports, and handling risk lexically.
