answer: |-
  ## Office for Derivation Compliance — Guidance Note 14: Unlicensed Normative Ascent  
  **Version 3.1 (Draft for Consultation)**  
  **Issued:** 19th October 2023  
  **Supersedes:** GN14 v3.0 (2022-07-14)

  1. **Introduction & Definitions**  
      1.1. This Guidance Note (GN) pertains to the identification, classification, and licensing of Unlicensed Normative Ascent (UNA). UNA occurs where a descriptive premise (an 'is') is utilised to support a non-descriptive conclusion (an 'ought') without appropriate regulatory approval.  
      1.2. "Descriptive Premise": A statement concerning matters of observable fact, verifiable state of affairs, or empirically quantifiable data.  
      1.3. "Normative Conclusion": A statement concerning values, obligations, permissions, or evaluative judgements.  
      1.4. "Thick Concept": A term possessing both descriptive and evaluative components (e.g., "cruel", "cowardly", "generous", "degrading"). Thick Concepts are provisionally classified as **Category 5 (Pending)** pending definitive guidance from the Thick Concepts Working Group (TCWG). *Note: The TCWG was convened under Statutory Instrument 2019/847. It has not yet issued determinations. Inquiries should be directed to tcwg.queries@ofdc.gov.uk*.

  2. **Legal Basis**  
      2.1. The Office for Derivation Compliance (OFDC) operates under the *Derived Norms (Regulation) Act 2018 (as amended)*. Section 2(1)(a) states: "A conclusion not demonstrably supported by its premises ought not to be asserted in public discourse, advertising, or formal consultation."  
      2.2. UNA constitutes a breach of Section 2(1)(a). Penalties are outlined in Schedule 4.

  3. **Classification of UNA Events**  
      3.1. Inspectors must classify UNA events using the Standard Derivation Taxonomy (SDT v.6.7). Key categories include:  
          - **Category 1:** Direct, unconditional derivation (e.g., "Water levels *are* rising; therefore, emissions *ought* to be reduced"). *Presumptive Penalty: Tier 3*.  
          - **Category 2:** Derivation via Thick Concept (Refer to TCWG – see Clause 1.4). *Penalty: Indeterminate pending TCWG output*.  
          - **Category 3:** Licensed Conditional Derivation (See Clause 4).  
          - **Category 4:** Functional/Natural Property Derivation (See Clause 5).  
          - **Category 7:** Institutional Fact Derivation (See Clause 6).  
      3.2. *Practical Note:* Classification hinges on the Inspector establishing the *purely descriptive* nature of the premise(s). Where premise classification is contested (e.g., disputed factual claims), the UNA investigation cannot proceed until the factual dispute is resolved via the appropriate channels (e.g., Office for National Statistics, Fact-Checking Panel). See Worked Example 3.

  4. **Licensed Exemption: Category 3 (Conditional Means-Ends Reasoning)**  
      4.1. Derivations of the form "If Agent A desires outcome X, and Action Y is demonstrably necessary for X, then A ought to do Y" are licensed under Schedule 3, Exemption C.  
      4.2. *Example 1 (Licensed):* "If you want your car to function reliably (*is*: established mechanical principle), you ought to change the oil every 10,000 miles." *This is a valid Category 3 derivation. No penalty.*  
      4.3. **Detection of Category 3 Abuse:** A significant volume of submissions attempt to launder categorical normative claims via Category 3 by embedding contested or universal desires.  
      4.4. *Detection Test (OFDC Form D3-A):* Inspectors must assess whether the stated desire (X) is:  
          (i) Genuinely held solely by the specific agent (A);  
          (ii) Non-universal;  
          (iii) Non-normative in itself.  
      4.5. *Limitation of D3-A Test:* The test cannot reliably distinguish between a genuine conditional and a universal normative claim disguised as a desire (e.g., "As we all want a prosperous society (*universal 'want'*), corporation tax *ought* to be lowered"). Inspectors should flag instances where the desire premise appears axiomatic or non-contingent for further review. *Review backlog is currently 18 months.*

  5. **Functional/Natural Property Derivations (Category 4)**  
      5.1. Claims deriving normative conclusions from the function or natural state of an entity (e.g., "A knife that does not cut *is* a bad knife"; "A heart that fails to pump blood efficiently *is* defective; therefore, treatment *ought* to be sought") fall under Category 4.  
      5.2. Status: Category 4 derivations require individual pre-approval via Form FNP-1. A 2019 internal review (Ref: OFDC/INT/2019/FNP) suggested such derivations might form a basis for broader biological normativity. This view remains *contested*.  
      5.3. *Current Stance:* Form FNP-1 submissions are assessed case-by-case. No standard licence exists. *Example 2 (Pending):* "This heart possesses a severe arrhythmia (*is*: medical diagnosis). It is therefore defective. The patient ought to consent to surgery." *Referred for Specialist Panel Assessment, Casefile: CARDIAC-2023-4412. Decision outstanding.*

  6. **Institutional Fact Derivations (Category 7)**  
      6.1. Derivations where a normative consequence arises directly from the performance of a speech act or adherence to a constitutive rule (e.g., "Person A uttered the phrase 'I promise to pay you £10 tomorrow' (*is*: audible event); therefore, A *ought* to pay £10 tomorrow").  
      6.2. Status: Designated a **Priority 1 Appeal Stream** following the *Searle vs. OFDC* Tribunal (2021-). The Appeals Panel remains divided on whether Category 7 constitutes:  
          (a) A genuine counter-exemption requiring a new licence class; or,  
          (b) A complex sleight-of-hand violating Section 2(1)(a).^3  
      6.3. All active Category 7 cases are stayed pending the Panel's final ruling. New submissions must be filed under 'Provisional Category 7 (Appeal Stasis)'.

  7. **Enforcement & Penalties**  
      7.1. Upon identifying UNA, Inspectors must issue a Notice of Unlicensed Derivation (OFDC Form NUD-1), specifying the Category and the Premise-Conclusion breach.  
      7.2. The Penalty Tariff (Schedule 4) applies based on Category, audience size, and medium.  
      7.3. **Amnesty Provision (Section 12, DNA 2018):** Persons may retrospectively apply for a licence for past UNA via Form RET-L1 ("Amnesty Bin" submissions). Success rates are low (12% in Q2 2023), particularly for thick concepts or Category 7.  
      7.4. **Disputed Descriptive Premises:** Where the factual accuracy of the 'is' premise is challenged independently of the derivation (e.g., within a consultation response), the UNA investigation cannot commence until the factual dispute is authoritatively resolved.  
          *Worked Example 3:* Consultation Response states: "Policy X *will increase* child poverty (*disputed 'is'*); therefore, Policy X *ought* to be withdrawn." Inspector action:  
          (i) Suspend UNA assessment.  
          (ii) Notify claimant to seek factual verification from the Department for Social Metrics (DSM).  
          (iii) Resume only upon receipt of DSM Form FV-8 certifying the premise's descriptive status.  
      7.5. **OFDC's Own Statutory Basis:** Inspectors are reminded that the OFDC derives its authority from the *Derived Norms (Regulation) Act 2018*, enacted via standard parliamentary procedure (a brute institutional fact). The Act's own imperative ("ought not to be asserted", Section 2(1)(a)) is treated as a foundational constitutive rule under Appeal Stream 7-Beta, exempt from standard UNA assessment per Commissioner's Ruling CR/2019/01.

  8. **Reporting & Review**  
      8.1. All UNA determinations must be logged on the DERIVLOG system using codes SDT v.6.7.  
      8.2. Concerns regarding classification, particularly involving Thick Concepts or potential Category 3 abuse, should be escalated via Form ESC-9. *Note: The act of classifying an inference as 'fallacious' (UNA) is itself an evaluative judgement. The term "Unlicensed Normative Ascent" was adopted following the 2020 Rebranding Working Group to minimise self-referential complications. Its purely administrative nature is not subject to UNA review.*

  ---
  **Footnotes:**  
  ^1 See extensive submission (Ref: OFDC/SUBM/2022/887) from Prof. A. Throckmorton, Westerfield Institute for Conceptual Scrutiny, arguing the is/ought distinction relies on an untenable semantics/pragmatics divide and ambiguous use of "is". Under review by the Linguistic Analysis Unit (LAU). LAU response: "Pending meta-review of unit's own analytical framework."  
  ^3 Appeal Panel Split: 3 members favour (a); 2 favour (b); 1 abstained, citing "profound uncertainty regarding the ontological status of 'obligation'."  

