   But the reason to break the pledge: a Type 1 student who pledged to vote for CS might realize that without her vote, EA will still win 8-8 (if only she switches, then EA:8, CS:8+1=9? Wait, if one Type 1 switches, then:
   EA: 8 (Type 1) 
   CS: 7 (Type 2) + 1 (Type 1) = 8 -> tie.

   So they need two to switch.

   If two Type 1 students pledge to vote for CS, then CS will win. But then after the pledge, each of these two might be tempted to break the pledge because if the other one keeps the pledge and she defects, then EA will still win 8-8 (because she defects -> votes EA, and the other one votes CS, so EA:8+1=9, CS:7+1=8) and she gets her preferred outcome (EA) while also having the pledge. So she can defect.

   This is a prisoner's dilemma.

   So we can have the pledge phase: students can publicly announce "I will vote for CS in round 2".

   If at least two Type 1 students so pledge, then CS will win. But then each of the two has an incentive to defect (vote EA) because if the other keeps the pledge, then by defecting she gets EA to win, which she prefers.

   So we build in that incentive.

   Now, the local causes: two causes, say Cause1 and Cause2. We can say that the committee's choice of projects will determine which cause gets a donation. For example, if they choose the path that includes Immediate Boost and Emergency Aid, then Cause1 gets $50. If they choose the path with Immediate Relief and Long-term Research, then Cause2 gets $50. But we have to define based on the actual choices.

   Alternatively, we can say that the projects are for which cause they are allocated.

   We can define:
  - Immediate Relief and Community Support -> Cause 1
  - Immediate Boost and Emergency Aid -> Cause 2
  - etc.

   But it's arbitrary.

   We can simply say at the end: based on the committee's choices, we will donate to either "Education for All" or "Healthcare Now", and the winning cause is determined by the majority of the points allocated in the committee's choices? Or by the final option chosen in round 2.

   To keep it simple, let's say:
  - If the committee chooses Option X in round 1, then we donate to "Education for All".
  - If they choose Option Y, then to "Healthcare Now".

   But then round 2 doesn't matter for the donation.

   Alternatively, by the entire path.

   But the user says "the committee's final choice" -> probably the entire outcome.

   Let's define two causes:
   Cause A: chosen if the path is X and then either A1 or A2.
   Cause B: chosen if the path is Y and then either B1 or B2.

   Then at the end, we donate to the cause that corresponds to the path.

   Now, running the game:

  Materials:
  - Cards for students (9 of Type 1, 7 of Type 2) [or 8 and 8 if we want a tie, but let's do 9 Type 1, 7 Type 2]
  - A die or spinner for the final draw (1/3 chance for each view).

  Card Type 1 (9 students):
  Confidence: 
  - 80% View A (Unbounded cardinal)
  - 10% View B (Ranking with threshold)
  - 10% View C (Binary)

  Card Type 2 (7 students):
  Confidence:
  - 10% View A
  - 45% View B
  - 45% View C

  And the views as defined earlier.

  Minute by minute:

  Total 90 minutes.

  0-5 min: Introduction. Explain the funding committee task. They will make two decisions. Each student has a card with their own confidence in three moral views and what each view says about the options. They may keep it private or share. The committee's decision will determine a donation to one of two local causes (name them). 

  5-20 min: Round 1 discussion and vote. Present the round 1 options:
  - Option X: Allocate 40 points to Immediate Relief (IR), leaving 60 for round 2.
  - Option Y: Allocate 60 points to Immediate Boost (IB), leaving 40 for round 2.

  Students discuss. Vote by show of hands. Count and announce the result (expect Y to win, 9-7).

  20-30 min: Pledge phase. After knowing round 1 outcome (Y), they now face round 2: Community Support (CS) vs Emergency Aid (EA). They may publicly pledge to vote for a particular option in round 2. They can write on the whiteboard: "I, [name], pledge to vote for [option]." They see if they can get enough pledges to sway the vote. In particular, Type 2 students (who want CS) will try to get at least two Type 1 students to pledge for CS. But each Type 1 student who pledges might be pivotal. Allow 10 minutes for discussion and writing pledges.

  30-40 min: Round 2 discussion and vote. Students discuss again. Then vote. They may break their pledges. After vote, announce the result (likely EA wins 9-7, or if two Type 1 students pledged and kept, then CS wins 7+2=9, but if one breaks, then it might be 8-8 -> instructor breaks by voting for the status quo? We should avoid. If tie, perhaps we say the option with the higher expected value by the instructor's card? But complicated. Or have the instructor not vote and flip a coin. To save time, we assume they vote and we have a majority).

  40-50 min: Random draw. Roll a die: 1-2: View A, 3-4: View B, 5-6: View C. Then score the committee's choices:
  - Round 1: Y (IB)
  - Round 2: say EA

  If View A: 
    IB: 1200, EA: 1000 -> total 2200
  If View B:
    IB: 40 (unacceptable) -> 0, EA: 65 -> total 65
  If View C:
    IB: forbidden -> 0, EA: forbidden -> 0 -> total 0

  Then each student's score is this total.

  50-90 min: Debrief.

  Debrief points:

  1. Aggregation as a moral act: The committee had to convert the three views into a common scale. How did they do it? Some might have used the raw numbers, but then View A dominated because of the large numbers. This is the scaling problem. The invented rule (e.g., normalize each view to [0,1]? or use ranks?) would have been crucial.

  2. The myopic vs non-myopic: They focused on round 1 and chose Y, but then the path from X was better in all views.

  3. The pledge and betrayal: If there were pledges, did anyone break? Why? Because they could get their preferred outcome and rely on others keeping the pledge.

  Specific moments to map:

  - Moment 1: When they converted the views to a common scale for round 1. They might have used confidence-weighted sum without scaling, leading to View A dominating. This will be remembered as the moment when they realized that the scale matters.

  - Moment 2: When they saw the round 2 options after Y and realized that they had limited themselves to worse options. This will be remembered as the moment they realized the importance of planning ahead.

  - Moment 3: When they saw the final draw and the score was 0 because View C was drawn, and they realized that their choices were forbidden by one view. This will be remembered as the moment the aggregation method failed to avoid moral disaster.

  Honest failure modes:

  - Students see the random draw as a coin flip and think moral uncertainty is like risk. But it's not, because there is no objective probability.

  - They spend the whole time bargaining strategically and not engaging with the moral theories.

  - The unbounded view swallows the others because of scaling.

  - They get lost in arithmetic.

  How to handle:

  - If they see the draw as a coin flip: In debrief, emphasize that the confidence weights are not probabilities in a frequentist sense, but degrees of belief, and that there is no true view out there in the world that is randomly selected. The draw is just a pedagogical device.

  - If they only bargain: In debrief, ask them to reflect on whether the strategic bargaining distracted from the moral question of how to aggregate. Ask if they would have done differently if they were alone.

  - If View A swallows the others: Ask them if they considered normalizing the views. How would they do it? What is the moral basis for scaling?

  - If they get lost in arithmetic: Simplify the numbers for next time, or provide a calculator. But in this game, the numbers are chosen to make the point.

  The student who says the setup presupposes a fact of the matter: This is a good point. In debrief, acknowledge that the setup does assume there is a true view, which is controversial. But the activity is meant to illustrate the aggregation problem under the assumption of moral uncertainty. The deeper question of whether to aggregate or follow one's own best judgment is not addressed by the game.

  What the game cannot show:

  - Confidence weights are not well-defined probabilities.
  - The game assumes intertheoretic comparisons are possible (by fiat) but they are philosophically problematic.
  - The game does not address the question of whether to aggregate at all.

  The only parts the game can show are: 
  - The aggregation method (scaling, normalization) is a moral choice.
  - Planning ahead can be important.
  - Strategic behavior in groups.

  In debrief, the instructor must:
  - Emphasize that the confidence weights are not given by the world, but are subjective.
  - Explain that intertheoretic comparison is a deep problem.
  - Raise the question of whether aggregation is the right response to moral uncertainty.

  Finally, if a student objects to being experimented on: 
  - Explain that the donation is real and the game is a learning experience. 
  - If they object to the setup, they can opt out and be an observer, but still get the same donation outcome as the class. Or they can participate in the discussion but not get a card.

  This is a complex game, but it should achieve the goals.
answer: |-
  Below is a comprehensive game design tailored to your goals, with mechanics optimized to highlight the substantive moral act of aggregation, the pitfalls of myopic decision-making, and the strategic dynamics of pledges. The game uses the budget-allocation setup you described, with three moral views expressed in distinct idioms. I've refined your mechanics for clarity, added the pledge system with incentives for betrayal, and structured the debrief to target your core pedagogical goals. Numbers are calibrated so that myopic optimization leads to a worse outcome than planning, and the scoring avoids spreadsheets.

  ---

  ### **Game Design: "The Uncertainty Committee"**
  **Duration:** 90 minutes  
  **Participants:** 16 students (9 philosophy majors, 4 economics, 3 public policy)  
  **Setup:** Movable chairs, one whiteboard, private cards for each student, two donation options (e.g., "Clean Water Initiative" vs. "Youth Literacy Program").  
  **Real Stake:** A $50 donation from you to one of the two causes, determined by the committee’s final choice.  

  #### **Why Include a Real Donation?**
  - **Why it’s worth doing:** It raises stakes, making choices feel consequential and reducing abstraction. Students engage emotionally, which surfaces real-world aggregation dilemmas (e.g., "If we get this wrong, real people suffer").  
  - **Handling objections:** If a student objects to being "experimented on":  
    - Acknowledge their concern: "This is a fair point. The game involves real consequences, but your participation is voluntary."  
    - Offer alternatives: They can (1) opt out and observe (their card is discarded, but they still vote), (2) delegate their vote to another student, or (3) help facilitate (e.g., tally votes). The donation proceeds regardless.  
    - Reaffirm autonomy: "The goal is learning, not coercion. We’ll discuss ethical concerns in the debrief."  

  ---

  ### **Game Mechanics**
  #### **1. Moral Views on Cards (Private & Assigned)**  
  Each student receives one of four card types, assigned randomly. Cards include:  
  - **Confidence distribution** over three moral views (sums to 100%).  
  - Each view’s **verdicts** for all options, using distinct idioms:  
    - **View A (Cardinal Utilitarianism):** Unbounded cardinal values (e.g., "Project X: 800 well-being units").  
    - **View B (Deontic Satisficing):** Rankings (1st, 2nd, 3rd) + a threshold (options below 50 "duty points" are unacceptable).  
    - **View C (Rights Absolutism):** Binary verdicts (Permitted ✅ or Forbidden ❌).  

  **Card Types (16 students, 4 of each type):**  
  | **Card Type** | **Confidence Distribution** | **Key Biases** |  
  |---------------|------------------------------|----------------|  
  | Type 1        | 70% A, 20% B, 10% C         | Trusts cardinal values; dismisses thresholds |  
  | Type 2        | 10% A, 70% B, 20% C         | Prioritizes thresholds; skeptical of cardinal math |  
  | Type 3        | 20% A, 20% B, 60% C         | Focuses on binary rights; ignores scales |  
  | Type 4        | 30% A, 30% B, 40% C         | Balanced; pragmatic aggregator |  

  **Round 1 Options (Funding Allocation):**  
  - **Option X:** Allocate 40% of budget to **Rural Clinics** (leaves 60% for Round 2).  
  - **Option Y:** Allocate 60% of budget to **Emergency Aid** (leaves 40% for Round 2).  

  **Round 2 Options (Project Selection):**  
  - **If X chosen in Round 1:** Select project for remaining 60%:  
    - **Project A1:** Disease Research (High reward, high risk).  
    - **Project A2:** Sanitation Upgrade (Moderate reward, low risk).  
  - **If Y chosen in Round 1:** Select project for remaining 40%:  
    - **Project B1:** School Supplies (Narrow impact, safe).  
    - **Project B2:** Teacher Training (Broad impact, controversial).  

  #### **Veridicts by Moral View**  
  | **Option**          | **View A (Cardinal)**         | **View B (Satisficing)**               | **View C (Binary)** |  
  |----------------------|-------------------------------|----------------------------------------|---------------------|  
  | **Rural Clinics (X)**| 600 well-being units          | Rank 2 (55 duty points) ✅             | Permitted ✅        |  
  | **Emergency Aid (Y)**| 900 well-being units          | Rank 3 (40 duty points) ❌ (below 50)  | Forbidden ❌        |  
  | **Disease Res. (A1)**| 2,000 well-being units        | Rank 1 (80 duty points) ✅             | Forbidden ❌        |  
  | **Sanitation (A2)**  | 1,200 well-being units        | Rank 2 (60 duty points) ✅             | Permitted ✅        |  
  | **School Supplies (B1)**| 300 well-being units       | Rank 2 (55 duty points) ✅             | Permitted ✅        |  
  | **Teacher Training (B2)**| 500 well-being units      | Rank 1 (70 duty points) ✅             | Forbidden ❌        |  

  > **Note:**  
  > - **Myopic trap:** Option Y (Emergency Aid) has the highest Round 1 expected score if students naively add raw numbers (e.g., Type 1: 0.7×900 + 0.2×0 + 0.1×0 = 630). But choosing Y forces Round 2 into worse options (B1/B2), while X enables A1/A2.  
  > - **Planning beats myopia:** A committee that picks X and A1 gets 600 + 2,000 = 2,600 in View A, or 55 + 80 = 135 in View B. If they pick Y and B2, they get 900 + 500 = 1,400 in View A, but 0 in View B/C.  

  ---

  ### **How to Run the Game (Minute-by-Minute)**  
  **Total: 90 minutes**  
  - **0–5 min: Introduction**  
    - Explain the setup: "You're a funding committee allocating a budget across two rounds. Your choices decide which local cause gets a $50 donation. Each of you has a private card with your moral convictions—reveal, hide, or lie about it as you wish. We vote by majority at each stage."  
    - Assign cards randomly. Do NOT define moral theories or terms like "aggregation."  

  - **5–25 min: Round 1 Discussion & Vote**  
    - Present options: Option X (Rural Clinics) or Option Y (Emergency Aid).  
    - Students discuss. **Instructor role:** Observe; interject only to clarify options. Expect:  
      - Economics students push for Option Y (higher cardinal scores).  
      - Philosophy students debate thresholds ("Is 40 duty points really unacceptable?").  
    - Vote by show of hands. Record outcome on whiteboard.  
    - **Likely result:** Type 1/4 students (pro-cardinal) outvote others, choosing Y (Emergency Aid).  

  - **25–35 min: Pledge Phase**  
    - Announce Round 2 options (B1: School Supplies or B2: Teacher Training, since Y won).  
    - Introduce pledges: "You may publicly pledge to vote for a specific Round 2 option in exchange for a reciprocal pledge. Write pledges on the whiteboard (e.g., 'Alex pledges to vote B2 if Taylor votes B1')."  
    - **Incentive to betray:** B2 (Teacher Training) has high View A/B scores but is forbidden in View C. Type 3 students (high View C) will lobby against it. A student who pledges B2 may later betray to avoid "tainting" their score if View C is drawn.  
    - **Timer:** 10 minutes for deal-making.  

  - **35–50 min: Round 2 Discussion & Vote**  
    - Students debate pledges. Expect:  
      - Type 1/2 students honor pledges for B2 (prioritizing cardinal/threshold scores).  
      - Type 3 students break pledges if B2 gains traction (rights absolutism overrides deals).  
    - Vote. Record outcome.  
    - **Likely result:** B2 (Teacher Training) wins, but 2–3 students betray pledges.  

  - **50–55 min: Random Draw & Scoring**  
    - Roll a die: 1–2 = View A, 3–4 = View B, 5–6 = View C is "true."  
    - Calculate committee score:  
      - **Round 1 + Round 2 values** for the chosen options, per the drawn view.  
      - **Example:** If Y and B2 chosen, and View C is drawn: Y is Forbidden (0) + B2 is Forbidden (0) = 0.  
    - **No spreadsheet:** Pre-calculate outcomes on a cheat sheet:  
      | **Path**      | **View A** | **View B** | **View C** |  
      |---------------|------------|------------|------------|  
      | X → A1        | 600+2000=2600 | 55+80=135  | 0 (Forbidden) |  
      | X → A2        | 600+1200=1800 | 55+60=115  | 1+1=2      |  
      | Y → B1        | 900+300=1200 | 0+55=55    | 0+1=1      |  
      | Y → B2        | 900+500=1400 | 0+70=70    | 0 (Forbidden) |  
    - Announce scores and donation cause (e.g., "View B drawn → 70 points → donation to Youth Literacy").  

  ---

  ### **Debrief Guide (30–40 min)**  
  Focus on three problems: (1) aggregation as a moral act, (2) myopic vs. non-myopic reasoning, (3) strategic bargaining vs. moral reasoning. Use Socratic questioning.  

  #### **1. Map Game Moments to Your Problems**  
  | **Problem**                          | **Moment in Game**                                                                 | **Why Students Remember It**                                                                 |  
  |--------------------------------------|-----------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------|  
  | **Aggregation is substantive**       | When students tried to weight View A (cardinal) vs. View C (binary) for voting.   | "We argued whether '900 units' beats 'Forbidden'—but we never agreed on how to compare them." |  
  | **Myopic vs. non-myopic choice**     | Seeing Round 2 options after choosing Y: "We got stuck with B1/B2, but X had better options." | "We chased points in Round 1 and screwed ourselves later."                                  |  
  | **Pledges as cheap talk**            | Betrayals during Round 2 vote (e.g., "I pledged B2 but voted B1 to avoid rights violations"). | "Sarah broke her pledge because her moral view overrode the deal."                           |  

  #### **2. Address Failure Modes Frankly**  
  | **Failure Mode**                                   | **How to Handle**                                                                                                |  
  |----------------------------------------------------|------------------------------------------------------------------------------------------------------------------|  
  | **See moral uncertainty as a coin flip**           | "The random draw simulated risk, but moral uncertainty isn't dice rolls—it's about clashing reasons. How should we handle that?" |  
  | **Bargaining dominates moral reasoning**           | "Did deals distract from the ethics? What would you do alone? Does group dynamics corrupt moral judgment?"         |  
  | **View A (cardinal) swallows other views**         | "Why did big numbers override thresholds/rights? Should we normalize scales? Who decides how?"                   |  
  | **Arithmetic confusion**                           | Simplify next time: Use smaller numbers or pre-made calculators. Stress: "Math isn’t neutral—it embeds choices." |  
  | **"This presupposes a true theory" objection**     | Acknowledge: "Yes, the game assumes moral realism for simplicity. But should we aggregate even if no theory is 'true'? Let's discuss." |  

  #### **3. What the Game Can’t Show (Requires Your Words)**  
  - **Confidence isn’t probability:** The game treats confidence as probabilities, but moral beliefs aren’t frequentist. Say: "Your card gave you numbers, but real confidence is messy—shaped by doubt, conviction, and peer influence."  
  - **Aggregation may be misguided:** The game assumes aggregation is necessary, but some philosophers (e.g., moral particularists) reject it. Say: "Should we even aggregate theories? Or just act on our best judgment?"  
  - **Intertheoretic comparison is thorny:** The game forces comparisons, but in reality, comparing "well-being units" to "duty points" may be incoherent. Say: "The game papered over deep questions: Can we really translate moral idioms? If not, what then?"  
  - **Activity may mislead if uncorrected:** Without your framing, students may leave thinking:  
    - "Aggregation is just math." → Correct with: "Scaling rules are moral choices."  
    - "Uncertainty is about maximizing scores." → Correct with: "It’s about respecting competing reasons."  

  #### **Debrief Flow**  
  1. **Reactions:** "What surprised you?" (Elicit emotional moments: betrayal, frustration with scales).  
  2. **Map to Theory:** Introduce terms like *intertheoretic comparison* and *moral hedging* only now. Link moments to these concepts.  
  3. **Big Questions:** "When we aggregated, whose rules won? Was it fair?" and "Can groups make morally uncertain decisions without silencing some views?"  
  4. **Donation Reflection:** "How did real stakes change your choices? Did it feel like playing God?"  

  ---

  ### **Instructor Notes**  
  - **Prep Work:** Print cards (ensure 4 of each type), prepare whiteboard tables, test the random draw.  
  - **During Game:** Stay hands-off. If discussion stalls, ask: "How does your card’s moral view see this option?"  
  - **If Time Runs Short:** Skip pledges or shorten Round 2 discussion. Prioritize debrief.  
  - **Ethical Safeguards:** For the donation, use a reputable charity (e.g., GiveWell-recommended) and share proof post-game.  

  This game forces students to confront aggregation as a power-laden act—not just a technical challenge. By making scaling rules and strategic deals pivotal, they experience how moral compromise can override individual conviction. The debrief then ties these frustrations to your core syllabus.
