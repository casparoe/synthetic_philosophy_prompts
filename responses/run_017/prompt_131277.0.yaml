prompt: |-
  I had a long argument on Saturday with a friend who works in structural biology, and I want to know whether the philosophical literature can settle it well enough to change what my team actually does on Monday. Her position was that a function annotation should simply record what the gene product currently contributes to the organism that carries it — that selection history is a separate, optional piece of information, and that mixing the two into one field is what makes our annotations incoherent. My position was that this throws away the difference between what a trait is *for* and what it happens to do, and that it leaves us unable to say that anything has gone wrong: if function is just current contribution, then a protein that no longer performs the effect it was maintained for isn't malfunctioning, it just isn't contributing. We went back and forth for about two hours and got nowhere, and I suspect we were each defending a different thing the word "function" might be picking out.

  I am the curation lead for a genome-function database maintained by a small consortium. We process roughly forty annotation tickets a week with a staff of twelve curators who have master's-level training in molecular biology and no philosophy. Each curator has about fifteen minutes per ticket. The output has to be one of a small closed set of labels that can be entered directly into the database, because our annotations are consumed downstream by a machine-learning group that predicts phenotype from genotype and, indirectly, by clinical partners who use them to decide whether a loss-of-function variant is worth investigating in a rare-disease case. Routine annotations are signed off by the curator; anything that changes an already-published annotation has to go to me and, if it affects more than a handful of entries, to the consortium steering group.

  My team has floated a compromise I want you to evaluate rather than assume: split the existing "function" field into three subfields — a selected-effect field (what, if anything, the trait appears to have been maintained by selection for), a current-contribution field (what it now systematically does that bears on some capacity of the system), and a provenance field recording what kind of evidence supports each — and then let downstream users choose which one they care about. I want to know whether that split dissolves the disagreement or merely relabels it, in particular for the cases where a user needs a single answer and cannot be given two.

  Please write the procedure we would actually run on a ticket: the questions in order, what counts as a sufficient answer to each, where the procedure stops and returns no annotation, and where it hands the decision to a person because the remaining question is not one the evidence can settle. It has to be usable by someone who has never heard the etiological/causal-role distinction, so say explicitly which of the philosophical distinctions must survive that simplification and which can be dropped without loss. Most of our tickets do not come with a phylogeny or a selection scan and we cannot afford to produce one, so the procedure has to say what to do when the historical evidence simply isn't there. Flag the steps that are judgment calls dressed up as procedure.

  Then run it on three stylized tickets of the kind we get.

  1. A light-gated ion channel in a soil bacterium, acquired from an unrelated lineage by horizontal transfer within the last few decades, spreading in the population, and shown in assay to modulate the cell's response to a wavelength present in its current environment. Both the historical and the present-day stories appear to point the same way; I want to see whether the procedure wastes a curator's time confirming this or clears it in one step.

  2. An opsin-like light-sensitive protein in a vertebrate lineage that has lived in permanent darkness for a very long time. The protein is still expressed in tissue beneath the skin, still binds its chromophore, and still changes conformation when illuminated in the lab, but nothing in the animal's life is affected by light, and the gene shows signs of relaxed selection. A colleague has pointed out that the protein also binds and sequesters a metal ion, and that this sequestration measurably improves survival in the chemistry of the cave water.

  3. A gene whose product was maintained by selection for a metabolic step that no longer occurs in the organism's current environment, because the organism now obtains the metabolite from a host. The same protein, as a matter of present causal structure, binds a host protein and suppresses a host immune response, and that suppression is the only thing about it anyone currently cares about. I want this ticket annotated as immune suppression, and I want you to run your procedure honestly even if it refuses to say that: if it does refuse, tell me what it says instead and why I should live with it.

  Finally, tell me what the procedure cannot do: which tickets it will misclassify systematically, which of our existing annotations it would force us to revisit if we applied it retroactively, and what I should say to the steering group if they ask whether adopting it commits us to one side of the philosophical dispute. Please don't give me citations or a reading list; I'll handle the literature myself.
reasoning: |-
  Okay, let me approach this systematically. The user is a curation lead for a genome-function database facing a practical deadline pressure. Their core problem is resolving a philosophical disagreement about functional annotation that impacts real-world curation workflows. I need to design a procedure that:

  1. Resolves the etiological vs causal-role function debate operationally
  2. Fits within 15-minute curation windows
  3. Handles evidence limitations (no phylogeny/selection scans)
  4. Produces machine-actionable outputs
  5. Doesn't require philosophical training

  The key insight is that the compromise (splitting into SE/CC/provenance fields) actually maps to distinct biological realities we can probe with evidence. The procedure must:
  - Explicitly separate historical (selection) from current (causal) questions
  - Define "systematic" contribution as testable in isolation
  - Handle absent historical evidence gracefully
  - Flag when human judgment is required

  For the workflow design, I'm considering a decision tree that:
  - First asks if there's direct evidence of current causal contribution (experimental assays etc.)
  - Then checks for historical evidence separately
  - Uses provenance tracking to handle uncertainty
  - Has clear "stop and escalate" rules

  The three test cases are perfect for stress-testing:
  1. Bacterial ion channel - should be straightforward dual annotation
  2. Degraded opsin - will reveal how we handle "accidental" functions
  3. Exapted immune suppressor - tests historical vs current priority

  I need to anticipate downstream impacts:
  - How ML teams might misuse the separate fields
  - Which existing annotations would become inconsistent
  - Whether this implicitly favors one philosophical view

  The procedure must admit its limitations - it can't resolve every edge case, but should at least make the ambiguity explicit through the provenance field. For the steering committee, I'll emphasize this is an evidence-based pragmatism, not philosophical allegiance.
answer: |-
  Here's a practical procedure for your annotation tickets, designed for 15-minute curation with explicit decision points. Philosophical distinctions are reduced to operational questions without requiring terminology.

  **Annotation Procedure (Per Ticket)**

  1.  **Question A: Does the gene product *currently* make a measurable, systematic contribution to the organism's phenotype/capacity *in its typical environment*, observable via direct experiment or strong inference?**
      *   **Sufficient Evidence:** Experimental assays (in vivo/in vitro), consistent phenotypic correlations (e.g., knockdown/knockout effects), essentiality data, metabolic flux measurements, structural activity predictions with validation.
      *   **Stop & Annotate (CC):** If YES, record the specific contribution(s) in the Current-Contribution (CC) field. *Provenance:* Evidence type (e.g., "knockout assay", "in vitro binding").
      *   **Proceed to B:** If NO (or unclear), leave CC blank. *Provenance:* "No direct evidence" or "Contribution ambiguous".

  2.  **Question B: Is there evidence this specific molecular activity was *historically maintained* by natural selection in the lineage leading to this organism?**
      *   **Sufficient Evidence:** Phylogenetic conservation correlating with functional constraint, population genetics (dN/dS << 1, absence of non-synonymous variation), experimental evidence of adaptive benefit *in past/relevant selective environment*, direct demonstration of positive selection.
      *   **Sufficient Evidence Absent?** (Most common case): Leave Selected-Effect (SE) blank. *Provenance:* "No historical evidence available".
      *   **Annotate (SE):** If YES and the activity aligns with a contribution identified in CC (or a clearly inferred past activity), record that specific activity in SE. *Provenance:* Evidence type (e.g., "dN/dS < 0.3", "phylogenetic conservation").
      *   **Conflict/Ambiguity:** If YES, but the historically maintained activity appears *different* from the current contribution (or no CC exists), record the inferred historically maintained activity in SE. *Provenance:* Evidence type + "inferred historical". **Flag for Human Review:** This conflict requires curator judgment to characterize the historical activity accurately.
      *   **Evidence of *No* Historical Maintenance?** (e.g., pseudogenization, high dN/dS, non-functional sequence features): Annotate SE as "Non-functional (historical evidence)". *Provenance:* Evidence type. **Flag for Human Review:** Confirm interpretation of evidence.

  **Handling Ambiguity & Human Judgment:**
  *   **Stop & Return Blank:** Only if *both* A and B yield NO/No Evidence *and* no plausible contribution/history can be inferred (rare). Provenance explains why.
  *   **Hand to Human (Curator Lead/SG):**
      *   When B identifies a historical function *different* from the current contribution (CC).
      *   When interpreting ambiguous evidence for B (e.g., is relaxed selection evidence of *loss* of function, or just reduced constraint?).
      *   When evidence for A (CC) is indirect or conflicting.
      *   When classifying the *specific nature* of the historical activity if evidence for B is indirect (e.g., "was this binding or catalysis maintained?").
  *   **Judgment Calls Dressed as Procedure:** Steps inherently requiring interpretation:
      *   Defining "systematic contribution" in A (how direct/measurable must effect be?).
      *   Interpreting population genetics/phylogenetics for B (e.g., is dN/dS=0.8 "relaxed selection" or "neutral"?).
      *   Characterizing the *specific activity* maintained by selection (B) from indirect evidence.
      *   Resolving conflicts between CC and SE evidence.

  **Philosophy Simplified:**
  *   **Must Survive:** The core distinction between *what it does now* (CC, evidence-driven) and *why it exists in this form* (SE, evidence-driven history). This captures the "for" vs. "does" without the terms.
  *   **Can Be Dropped:** Debates about "proper function," "malfunction," or the metaphysical necessity of history for "function." The procedure focuses on evidence for present effects and evidence for past maintenance.

  **Running the Test Tickets:**

  1.  **Bacterial Light-Gated Ion Channel:**
      *   A: YES. Measurable modulation of response to current environmental wavelength (assay). **CC:** "Light-gated ion channel activity modulating cellular response to [wavelength]." *Provenance:* "Functional assay in current isolate."
      *   B: Evidence? Horizontal transfer + spreading suggests *current* positive selection, but no direct evidence of *historical maintenance* in *this lineage* prior to transfer. **SE:** Blank. *Provenance:* "No historical evidence in lineage (recent HGT)."
      *   **Result:** CC filled, SE blank. Cleared quickly. No conflict, no need to confirm history beyond noting its absence.

  2.  **Cave Vertebrate Opsin-like Protein:**
      *   A: YES, but which contribution?
          *   Light sensitivity? NO. No effect on animal's life.
          *   Metal ion sequestration? YES. Improves survival in cave water (assay). **CC:** "Metal ion binding and sequestration." *Provenance:* "Survival assay in cave water chemistry."
      *   B: Evidence? Relaxed selection (dN/dS, etc.) for light-sensing. Evidence for metal binding? None presented (colleague's suggestion needs evidence). **SE:** "Opsin-mediated light sensing (inferred historical, evidence of relaxed selection)". *Provenance:* "Relaxed selection (dN/dS >1), phylogenetic homology to functional opsins."
      *   **Conflict/Ambiguity?** SE (light-sensing) differs from CC (metal binding). **Flag for Human Review:** Is there *any* evidence metal binding was historically maintained? (Probably not based on ticket). Curator confirms SE annotation and leaves it as historical light-sensing. Metal binding in CC stands as current contribution.

  3.  **Exapted Immune Suppressor:**
      *   A: YES. Binds host protein and suppresses immune response (assay). **CC:** "Host immune response suppression via [specific mechanism]." *Provenance:* "Binding assay, immune suppression assay."
      *   B: Evidence? Known metabolic step lost due to environmental change (host metabolite). Evidence maintained for immune suppression? None presented (recent exaptation likely). **SE:** "[Specific metabolic activity] (inferred historical, evidence of loss of selective environment)". *Provenance:* "Homology to metabolic enzymes, loss of substrate in current niche."
      *   **Conflict/Ambiguity?** SE (metabolic) differs from CC (immune). **Flag for Human Review:** Curator confirms SE is the historical metabolic activity and CC is the current immune activity. **Result:** CC: "Host immune response suppression...", SE: "[Specific metabolic activity] (inferred historical)". This meets your requirement: the primary annotation for *current* relevance (immune) is in CC. SE records the history cleanly.

  **What the Procedure CANNOT Do:**

  1.  **Resolve "Malfunction" Semantics:** It won't declare something "broken." A non-contributing gene (A=NO) with evidence of historical maintenance (B=YES) gets SE filled (historical function) and CC blank. Downstream users interpret "CC blank + SE present" as potential malfunction. A gene with no SE and no CC is simply "no known function."
  2.  **Infer History Without Evidence:** If there's no data for B (phylogeny, selection scans), SE stays blank. It won't *assume* current contribution equals historical function.
  3.  **Handle Multi-Function Equivocally:** If strong evidence exists for *both* activities being *currently* systematic *and* historically maintained, it forces annotation in both CC and SE. Downstream users needing "one function" must pick based on context (e.g., prioritize essential over non-essential).
  4.  **Systematic Misclassification:**
      *   **Very Rapidly Exapted Traits:** A trait currently under strong selection for a *new* role, where evidence for the *old* historical role is weak/nonexistent, might only have the new role captured in CC (SE blank), potentially missing its very recent history.
      *   **Pleiotropic Traits with One Historical Role:** If historical evidence only clearly supports maintenance for *one* of several current activities, the SE field will only capture that one. Other current activities remain in CC only.
  5.  **Retroactive Impact:** Adopting this would force revisiting annotations where:
      *   Only "historical function" is recorded (needs moving to SE, checking CC).
      *   Only "current activity" is recorded for pseudogenes/clearly degraded elements (needs moving to CC? Likely no, as A=NO; may need SE annotation of loss).
      *   Ambiguous "function" fields that mixed history and current effect need splitting based on evidence.
  6.  **Answer to Steering Group:** "This procedure doesn't commit us to saying selection history *defines* function or that current contribution is the *only* function. It commits us to *separating the evidence*. We record what the molecule demonstrably does *now* (Current-Contribution) based on experiment, and what we can demonstrate it was *historically maintained to do* (Selected-Effect) based on evolutionary data. This resolves the incoherence by splitting the mixed field. Downstream users get both pieces of evidence and can apply their own definitions as needed. Philosophically, it's agnostic; operationally, it's clearer and more evidence-based."

  **Monday Morning Summary:** Implement the three-field split (SE, CC, Provenance). Use this procedure. It dissolves the disagreement by *structurally separating* the evidence types your curators already assess, making the "different things" explicit. For single-answer users, prioritize **CC** (current contribution) as the most directly actionable piece for predicting phenotype/interpreting variants *now*. SE provides crucial context for interpreting loss-of-function and evolutionary history. The test tickets show it works pragmatically, even if SE sometimes records "what it *was* for" while CC records "what it *does* now."
