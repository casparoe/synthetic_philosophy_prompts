prompt: |-
  I'm a software engineer by trade — I build data pipelines, no philosophy background beyond a couple of half-finished online courses — and last spring I was picked by sortition for my city's charter review commission, which among other jobs has to decide what recommendation we attach to proposed changes in who counts as a voter in municipal elections. I ended up being the one who keeps the spreadsheet of our decisions, and going back through it I've realised we've been consistent in our verdicts without anyone being able to say what rule we're actually applying. The record so far: we kept the voting age at 18 for mayor and council but approved letting 16- and 17-year-olds vote for the school board only, on the reasoning that they are the ones who have to live with what that board does; we approved the municipal vote for non-citizen residents with at least two years' residence and rejected it for shorter-term residents, and rejected it again for non-resident property and second-home owners who pay city property tax but sleep somewhere else (roughly: you vote where you live); we approved the vote for people held in jail awaiting trial but rejected it, six to three, for people serving felony sentences, with the dissent saying we were punishing people twice; we approved automatic registration and mandatory time off work to vote but rejected a modest fine for abstaining and rejected publishing the names of non-voters, the chair's line being that we can clear the path but we cannot punish people for staying home; and we rejected seven to two a proposal that a parent or guardian could cast one extra ballot per child under sixteen, the majority saying a proxy ballot is the parent's judgment and not the child's. When I've raised the pattern at meetings, three different members have offered three different glosses on it — one says if the city can coerce you then you get a say, another says the vote belongs to people who are in it for the long run and will still be here, a third says it tracks who can form an actual judgment on the question being asked — and none of them has been able to explain why the others are wrong.

  The item in front of us now is a citizen-initiated charter amendment we can't amend, only recommend for or against, with two hundred words of explanation. It would (a) let anyone sixteen or older who has lived in the city thirty days and intends to stay register and vote in all municipal elections, candidates and ballot measures alike, citizen or not, replacing the current eighteen-and-over, citizens-and-two-year-residents rule for city elections; (b) add an official "none of the above" option on every municipal race, counted and published like a candidate, where a majority "none of the above" leaves the office vacant and forces a special election within ninety days; and (c) move any registered voter who skips two consecutive municipal elections to inactive status, requiring re-registration before voting again — no fine, no published list, and you can do it at the polls on the day. Note that part (c) is satisfied by turning up and voting "none of the above".

  What I need from you is this: lay out the two or three (or four) candidate principles that fit our track record just as well as each other, including any I haven't thought of, and say what each of them predicts about each part of this package; give me your best guess at what we should recommend if we want to be consistent with ourselves, with reasons for preferring that over the alternatives and with the closest analog among our own precedents identified; tell me honestly where our precedents genuinely underdetermine the answer and which principle we would be publicly adopting with a yes versus a no, especially given that the parts pull in different directions and we have to vote on it as one thing; and name the further case — the variation on this proposal, or the separate proposal — that would best tell the competing principles apart if we could get it in front of the commission next month. Please don't give me reading lists or citations; I have no library access and I need two hundred words I can stand behind at a public meeting.
reasoning: |-
  Hmm, the user is a software engineer serving on a city charter review commission. They've noticed the commission has been consistent in its decisions on voter eligibility, but no one can articulate the underlying principle. They need help identifying the principles that fit their past decisions, applying them to a new proposal, and making a consistent recommendation.

  Looking at their track record: 
  - Allowing 16-17 year olds to vote only for school board (directly affected) 
  - Requiring 2-year residency for non-citizens (long-term commitment) 
  - Rejecting non-resident property owners (vote where you live) 
  - Allowing jailed pre-trial defendants but not convicted felons (avoiding double punishment) 
  - Supporting registration/voting access but rejecting compulsory voting (no punishment for abstaining) 
  - Rejecting proxy votes for children (ballot must reflect voter's own judgment)

  Three commissioners have proposed different principles: 
  1. "If the city can coerce you, you get a say" (relates to school board decisions affecting teens) 
  2. "Vote belongs to those here for the long run" (residency requirements) 
  3. "Ability to form actual judgment" (rejecting proxy votes)

  The new proposal has three parts: 
  (a) Expanded voting eligibility (16+, 30-day residency, non-citizens) 
  (b) "None of the above" option with consequences 
  (c) Inactive status for skipping two elections (voting NOTA satisfies this)

  I need to identify principles that fit all past decisions equally well. Candidate principles could be: 
  - **Stakeholder Principle**: Those who bear the direct consequences of decisions should have a voice. 
  - **Community Commitment Principle**: Voting rights require demonstrated long-term investment in the community. 
  - **Autonomy Principle**: Voting is a personal right that shouldn't be compelled, and ballots must reflect individual judgment.

  Applying these to the proposal: 
  - Part (a): Stakeholder Principle supports it (teens/residents affected), Community Commitment opposes (30 days too short), Autonomy neutral. 
  - Part (b): Stakeholder neutral, Community Commitment neutral, Autonomy supports (expressing dissatisfaction). 
  - Part (c): Stakeholder opposes (punishes non-voting), Community Commitment supports (maintaining active rolls), Autonomy opposes (penalizes abstention).

  The closest precedent for consistency is their rejection of fines for abstaining, which aligns with Autonomy Principle. Part (c)'s inactive status, while not a fine, still penalizes non-voting by creating a hurdle. This suggests recommending against the proposal overall due to part (c), while noting inconsistency in part (a).

  The most revealing test case would be: "Should permanent residents (green card holders) with 6-month residency get the vote?" This would force a choice between Stakeholder (supports) and Community Commitment (opposes) principles.
answer: |-
  Based on your commission's track record, three principles fit equally well: **Stakeholder Suffrage** (vote if directly impacted), **Enduring Commitment** (vote if long-term stakes), and **Electoral Autonomy** (vote as personal right without compulsion). Here's how they apply to the proposal and your consistency:

  ### 1. **Stakeholder Suffrage**  
     - *Past fit*: Teens vote for school board (impacted); non-residents rejected (no daily stakes); jailed pre-trial (still part of community).  
     - *(a) Expanded eligibility*: Supports. Teens/non-citizens/residents affected by city decisions.  
     - *(b) "None of the above"*: Neutral. Enhances expression but doesn't align with direct stakes.  
     - *(c) Inactive status*: Opposes. Penalizes non-voters even if choices don't affect them.  
     - **Prediction: SUPPORTS (a), NEUTRAL (b), OPPOSES (c)**  

  ### 2. **Enduring Commitment**  
     - *Past fit*: 2-year non-citizen residency (long-term ties); non-resident owners rejected (transient interests).  
     - *(a)*: Opposes. 30 days is too short; no citizenship requirement weakens permanence.  
     - *(b)*: Neutral. Doesn’t address commitment.  
     - *(c)*: Supports. Encourages sustained participation (like automatic registration).  
     - **Prediction: OPPOSES (a), NEUTRAL (b), SUPPORTS (c)**  

  ### 3. **Electoral Autonomy**  
     - *Past fit*: Rejected fines/abstention shaming (no coercion); rejected proxy votes (personal judgment).  
     - *(a)*: Supports. Expands choice freely.  
     - *(b)*: Supports. Enhances expressive freedom.  
     - *(c)*: Opposes. Penalizes abstention (like rejected fines), even with re-registration.  
     - **Prediction: SUPPORTS (a), SUPPORTS (b), OPPOSES (c)**  

  ---

  ### **Recommendation for Consistency**  
  **Vote AGAINST the proposal** to align with your strongest precedent: rejecting penalties for non-voting (Autonomy Principle). Part (c) imposes a hurdle for abstention, mirroring your rejection of fines/published lists. While part (a) fits Stakeholder views, part (c) directly conflicts with your 7–2 vote against compulsory participation.  
  - *Closest analog*: Rejecting fines for abstainers (Autonomy).  
  - *Why over alternatives?* Autonomy is your most consistent thread; Enduring Commitment and Stakeholder split on parts (a)/(c).  

  ### **Undetermined Areas & Public Message**  
  - **Underdetermined**: Part (a) splits principles (Stakeholder yes, Commitment no). Part (b) has no direct precedent but aligns with Autonomy.  
  - **Public adoption**: A "YES" signals prioritizing access over anti-coercion; a "NO" upholds voting as a right without penalties.  
  - **Parts pulling apart**: You must weigh all three. Opposing due to (c) maintains core consistency, even if (a) appeals.  

  ### **Test Case to Split Principles**  
  Propose: **"Should permanent residents (green card holders) with 6-month residency get the vote?"**  
  - Stakeholder: Yes (they’re impacted).  
  - Enduring Commitment: No (6 months is too short).  
  - Autonomy: Neutral (doesn’t involve coercion).  

  ---

  **200-Word Summary for Your Meeting:**  
  > "Our past decisions emphasize voting as a personal right without coercion: we rejected fines for abstaining and proxy votes. This proposal’s part (c) moves non-voters to inactive status, penalizing abstention akin to the fines we opposed. While part (a) expands access (aligning with arguments that affected groups deserve a voice), and part (b) offers protest options, part (c) conflicts with our core rejection of punishing non-voting. Consistency requires opposing this package due to its compulsory element. If we supported it, we’d implicitly endorse penalizing non-participation—contradicting our 7–2 vote against fines. We acknowledge tension on eligibility expansion (e.g., teens in school elections), but the coercion issue is settled precedent. Vote NO to uphold electoral autonomy."
