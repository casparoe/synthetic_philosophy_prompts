prompt: |-
  Hey — I'm a research-methods PhD student who somehow got pulled into a tiny side project with two clinicians and a sociologist, and we've been going back and foward for weeks on the same stupid question. The plan is to pick one psychiatric diagnosis and follow it for five years to see whether we can catch a Hacking-style looping effect actually happening in the wild: clinicians and manuals sort people into a category, the people so sorted start experiencing, describing and acting differently (and sometimes organise, demand, or refuse the label), and that feeds back into how clinicians and the manual apply the category the next round. We have registry/diagnosis-code data for a whole health region plus funding for about sixty interviews, and we can't randomise who gets diagnosed, so I care much less about which category is metaphysically juicy and much more about which one would let us *detect* mutual reshaping inside five years. Also note two of us want different things: my sociologist wants maximum loopiness, my clinician wants a category where following people around for five years doesn't itself do harm, and I want something where a statistic has a chance of moving.

  So: rate these eight on expected total loopiness over roughly a decade, 0 to 100, and for each one split it into two numbers — individual looping (people change once they have the label, or once they know the label exists) and expert/institutional looping (clinicians, criteria, billing codes, advocacy groups, employers, app companies, pharma marketing change how the category gets applied). The list: dissociative identity disorder; adult-diagnosed ADHD; avoidant/restrictive food intake disorder; the newer prolonged grief diagnosis; ME/CFS (chronic fatigue syndrome); hoarding disorder; and two my group invented as synthetic test cases — "Compulsive Self-Monitoring Disorder", where people can't sleep or exercise without their wearable and keep escalating their tracking, and "Adolescent Attentional Fragmentation Syndrome", which is basically ADHD-shaped behaviour in teenagers under a brand-new name nobody has ever heard. Then rank all eight overall with a sentence of justification each.

  Things I actually want you to use in the scoring rather than wave at: whether the classified person ever hears the diagnostic word at all; whether people seek the label or have it imposed on them; how much of the criteria is self-report versus observation or lab value; whether there's already a patient community, a professional guild, or an industry with money in it; whether the label hooks into identity or only into access to services, insurance, or workplace accommodation; which direction the stigma gradient runs; whether the threshold sits on a continuum with a huge crowd just below it; and whether the category is new enough that the criteria themselves are still visibly moving. Say explicitly where the asymmetry between a prestigious label people want and a feared label people dodge changes what we'd be able to *measure* as opposed to what's true, and flag any score where you're really extrapolating because the category is invented or informal. Finally: your top two picks overall, which of the three of us each pick is for, and one concrete thing you'd look for in the registry data that would count as evidence of looping rather than of more people simply being diagnosed. Its fine to tell me my whole framing is confused at some point — just do it at the end, after you've given me the numbers.
reasoning: |-
  Okay, the user is a PhD student in research methods working on a project about Hacking's looping effects in psychiatric diagnoses. They're collaborating with clinicians and a sociologist, and they need to evaluate eight diagnostic categories for their potential to show looping effects over five years. The main goal is to detect mutual reshaping between the classified individuals and the experts/institutions. They want a rating for each disorder on individual and institutional looping, and an overall ranking. 

  First, I need to recall what Hacking's looping effect entails. It's about how classifying people can change their behavior and self-perception, which in turn affects how the category is applied and understood. The user mentioned several factors to consider: whether the person hears the diagnosis, if they seek the label, self-report vs. observation, existing communities, stigma, and how new the category is.

  Looking at the list: Dissociative Identity Disorder (DID), adult-diagnosed ADHD, Avoidant/Restrictive Food Intake Disorder (ARFID), prolonged grief disorder, ME/CFS, hoarding disorder, and two synthetic ones—Compulsive Self-Monitoring Disorder (CSMD) and Adolescent Attentional Fragmentation Syndrome (AAFS). 

  Starting with DID: It's controversial, with debate over its validity. Individuals might embrace the diagnosis, leading to identity changes. Online communities reinforce this, so individual looping is high. Institutional looping is moderate because criteria are stable, but debates continue. 

  Adult ADHD: High individual looping as adults seek diagnosis for self-understanding. Institutional looping is high due to increased awareness, advocacy, and pharmaceutical involvement. The DSM criteria changes add to this. 

  ARFID: Lower individual looping as it's often seen as medical, not identity-related. Institutional looping is medium; criteria are newer and might evolve with research. 

  Prolonged grief disorder: New category, so criteria are still shifting. High institutional looping as professionals adapt. Individuals may not strongly identify with it, so individual looping is medium. 

  ME/CFS: Strong patient advocacy and controversy over criteria. High institutional looping with changing guidelines. Individual looping is medium; identity can form around the label. 

  Hoarding disorder: Moderate individual looping; stigma might prevent identification. Institutional looping is medium as recognition grows. 

  Synthetic disorders: CSMD has high individual looping as wearables are common, leading to identity changes. Institutional looping is low since it's not recognized. AAFS, being new, has high individual looping if teens adopt the label. Institutional looping could be high if promoted. 

  The top picks are adult ADHD and ME/CFS. ADHD has strong advocacy and pharmaceutical influence, making both individual and institutional looping high. ME/CFS has evolving criteria and patient activism. These fit the sociologist's and clinician's interests. 

  For registry data, looking for co-occurring diagnoses changing over time could indicate looping. Also, shifts in age/gender demographics might show institutional adjustments. 

  The user's framing focuses on detectability within five years. Factors like newness of the diagnosis, stigma, and existing communities affect measurability. Synthetic categories might not have real-world data yet, so extrapolation is needed. The key is balancing the team's needs: sociologist wants loopiness, clinician safety, and the PhD student measurable change.
answer: |-
  Here's a breakdown of the looping potential for each diagnosis, scoring individual looping (IL) and institutional looping (InstL) on a 0-100 scale, followed by an overall ranking and justification. Scores reflect detectability within a 5-year window, emphasizing measurable change.

  **Scoring Key & Factors Applied:**
  *   **Individual Looping (IL):** Changes in self-experience/behavior *after* label acquisition/knowledge. Boosted by: Label awareness, identity integration, patient community strength, label seeking, self-report criteria, low stigma (or prestigious label).
  *   **Institutional Looping (InstL):** Changes in diagnostic criteria, application, coding, professional discourse, industry involvement. Boosted by: New/unstable criteria, active guilds/advocacy, industry $$, billing dependency, controversy, criteria on a continuum.
  *   **Asymmetry Note:** Prestigious/sought labels (e.g., ADHD) show *increased* diagnosis rates & identity shifts (easier to measure IL). Feared/stigmatized labels (e.g., Hoarding) may show *under*-diagnosis, avoidance, or criteria tightening (harder to measure IL, InstL might show in coding shifts/policy).
  *   **Extrapolation Flag:** Synthetic diagnoses (CSMD, AAFS) are highly extrapolated. Prolonged Grief is very new.

  **The Ratings:**

  1.  **Adult-Diagnosed ADHD**
      *   **IL: 85** (High awareness, strong identity integration, massive patient community, highly sought label, self-report heavy, low stigma gradient *for seekers*, continuum with many near-threshold).
      *   **InstL: 90** (Active professional guilds, huge pharma $$, evolving assessment (tech!), fierce advocacy, DSM changes, media saturation, strong link to workplace/school accommodations). **Total: 175**
      *   **Why:** The quintessential modern looping candidate. High demand fuels diagnostic expansion & identity formation, while industry/professionals actively reshape criteria, access, and discourse. *Perfect for measuring change*.

  2.  **Prolonged Grief Disorder (Newer)**
      *   **IL: 65** (Awareness growing, potentially validating/identity-forming for some, others reject pathologization. Stigma varies (prestigious vs. feared). Self-report core. Continuum with normative grief).
      *   **InstL: 85** (Very new, criteria actively debated/researched, guilds defining it, pharma *exploring* (watch antidepressants), potential insurance/billing driver, intense controversy feeds discourse change). **Total: 150**
      *   **Why:** Extreme institutional flux due to newness & controversy. Individual looping is developing rapidly. High potential for measurable shifts in application and reception within 5 years.

  3.  **ME/CFS**
      *   **IL: 75** (Very strong patient community/identity ("ME warrior"), label often fiercely sought/defended, high awareness *within community*, self-report crucial, significant stigma (fighting it fuels identity), continuum).
      *   **InstL: 70** (Criteria evolution (e.g., IOM 2015), major advocacy impact, significant research shifts, controversies over etiology/treatment reshape clinical application, growing (but cautious) pharma interest, billing codes critical). **Total: 145**
      *   **Why:** Powerful patient advocacy drives institutional change. Strong identity formation and contested criteria create fertile ground for measurable looping in discourse and diagnostic patterns.

  4.  **Avoidant/Restrictive Food Intake Disorder (ARFID)**
      *   **IL: 50** (Awareness moderate, often seen as "medical" not identity, some seeking (esp. adults), self-report key, stigma varies (less identity-stigma than AN, more "picky eater" stigma), clear(er) threshold?).
      *   **InstL: 70** (Relatively new in DSM-5, criteria still settling, research expanding, professional guilds defining it, growing awareness among clinicians, feeding clinics/services drive application, pharma low). **Total: 120**
      *   **Why:** Newness drives institutional change. Individual looping is more muted (less identity-focused) but measurable shifts in diagnosis rates and clinical focus are likely.

  5.  **Hoarding Disorder**
      *   **IL: 40** (Low awareness *as disorder* (often seen as habit), high stigma (dodged label), often imposed, self-report + observation, weak patient identity/community, continuum).
      *   **InstL: 60** (Relatively new DSM-5 category, criteria operationalization evolving, professional guilds active (OCD spectrum), social services/housing policy impact, reality TV influences perception, pharma minimal). **Total: 100**
      *   **Why:** Stigma impedes individual looping/awareness. Institutional looping is moderate due to newness and external pressures (housing/services). Measurable changes likely in coding rates and service linkage.

  6.  **Dissociative Identity Disorder (DID)**
      *   **IL: 80** (Diagnosis often *profoundly* identity-shaping, high awareness *in community*, strong (online) patient community, highly sought by some, heavily self-report, extreme stigma gradient (feared/dodged by many)). **Total: 140**
      *   **InstL: 55** (Criteria fairly stable *but* fierce controversy (existence/treatment), weak central guild, minimal pharma, influenced by media/online communities, billing codes exist but niche). **Total: 135**
      *   **Why:** Massive *potential* individual looping, but strong stigma and controversy limit its *spread* and measurable institutional shift within 5 years. Looping is intense but niche.

  7.  **"Compulsive Self-Monitoring Disorder" (CSMD - Synthetic)**
      *   **IL: 75 (Extrapolated)** (If label exists, high awareness potential (tech culture), likely identity-integration ("quantified self gone bad"), possible seeking for validation, heavy self-report/tech data, low initial stigma (prestige?), continuum).
      *   **InstL: 30 (Extrapolated)** (No real guild/industry *yet*, no formal criteria, billing impossible. Potential if adopted: tech industry influence? Very early stage). **Total: 105 (Extrapolated)**
      *   **Why (Extrapolated):** Models a sought-after, identity-relevant, tech-adjacent label. Individual looping high *if* label gains traction. Institutional looping very low initially – needs a champion. Hard to measure *real* looping without adoption.

  8.  **"Adolescent Attentional Fragmentation Syndrome" (AAFS - Synthetic)**
      *   **IL: 60 (Extrapolated)** (Teens highly identity-malleable. *If* promoted, rapid adoption/identity shift possible. Self-report heavy. Stigma gradient unknown. Continuum with norms. Novelty = no preconceptions).
      *   **InstL: 70 (Extrapolated)** (New name = blank slate for criteria shaping. Potential for rapid professional/educational adoption if marketed well ("new ADHD"), school/industry pressure, pharma interest possible). **Total: 130 (Extrapolated)**
      *   **Why (Extrapolated):** Designed for high institutional malleability. Individual looping depends on successful promotion. Measures *how fast* a new label can create a loop from scratch. High risk of no traction.

  **Overall Ranking & Justification:**

  1.  **Adult-Diagnosed ADHD (175):** **Highest measurable looping potential.** Unmatched synergy of high individual demand/identity, massive institutional drivers (pharma, guilds, advocacy), evolving criteria, and clear continuum. *Data will move.*
  2.  **Prolonged Grief Disorder (150):** **Highest institutional flux.** Extreme newness + controversy guarantees measurable shifts in expert application and discourse within 5 years. Individual looping emerging.
  3.  **ME/CFS (145):** **Strongest patient-driven looping.** Patient advocacy demonstrably reshapes research & criteria. Strong identity & contested nature make both individual and institutional changes detectable.
  4.  **ARFID (120):** **Best "new but stable enough" medical-psych hybrid.** Clear institutional evolution as criteria settle and awareness grows. Individual looping measurable, though less identity-focused.
  5.  **DID (135):** **Strongest niche individual looping.** Profound identity effects *for those diagnosed*, but controversy and stigma limit broader measurable institutional shifts within 5 years.
  6.  **Hoarding Disorder (100):** **Stigma-limited looping.** Institutional changes detectable due to newness and policy links, but stigma strongly suppresses measurable individual looping.
  7.  **AAFS - Synthetic (130 Extrapolated):** **Highest potential institutional malleability (if adopted).** Pure test of creating a new loop. High risk of null result, but *if* it takes off, looping could be rapid & measurable.
  8.  **CSMD - Synthetic (105 Extrapolated):** **Highest potential individual-tech interaction (if adopted).** Models a modern, sought-after identity label. Lacks institutional machinery, making real-world looping hard to measure soon.

  **Top Picks & Who They're For:**

  1.  **Adult-Diagnosed ADHD:** **The Consensus Pick & Your Pick.** Best balance of extremely high looping potential *and* detectability via registry data within 5 years. Hits the sociologist's loopiness, the clinician's relative safety (established Dx, treatments exist), and your need for moving statistics.
  2.  **Prolonged Grief Disorder:** **The Sociologist's Pick (and strong runner-up).** Maximizes institutional flux and controversy – the "loopiness" of criteria/resistance/adaptation is extremely high right now. Individual looping is developing fast. Detectability of expert-level change is very high.

  **Concrete Registry Data Evidence of Looping (Beyond Increased Diagnosis):**

  Look for **changes in diagnostic co-occurrence patterns over time** for your target diagnosis. Specifically:

  1.  **Increasing Diagnosis + Decreasing Co-occurrence with Vague/Proxy Codes:** (e.g., ADHD diagnoses rise, while "Unspecified Attention Deficit" or "Academic Problem" codes fall). Suggests the *specific* label is being applied more confidently/appropriately due to evolving expertise or changed thresholds (Institutional Looping).
  2.  **Shifts in Age/Gender Demographics of Diagnosis:** (e.g., Adult ADHD shows a sudden rise in diagnoses among women >40). Suggests increased awareness/acceptance (Individual Looping - seeking) *and* changes in clinician recognition/applicability (Institutional Looping).
  3.  **Changing Patterns of "Replacement" Diagnoses:** (e.g., Decline in "Adjustment Disorder" codes coinciding with a rise in Prolonged Grief Disorder diagnoses). Suggests the new category is actively reshaping how clinicians conceptualize and code certain presentations (Institutional Looping).

  **On Your Framing:**

  It's not confused, it's admirably pragmatic! You correctly focus on *detectability* within constraints (5 years, registry + interviews, no RCT). Prioritizing categories where the "signal" (looping effects) is likely strong enough to overcome "noise" (secular trends, better detection) is essential. Your factors (hearing the label, seeking/imposed, self-report, community, identity hooks, stigma, continuum, newness) are precisely the right levers for predicting measurable looping. The key insight is recognizing that **prestigious/sought labels make individual looping effects (demand, identity shift) far easier to detect statistically than feared/dodged labels**, even if the latter might involve intense internal looping for those labeled. Your synthetic categories are clever test cases for loop *formation*. Good luck untangling the loop!
