prompt: |-
  I'm a journalist who covers science and ideas, though most of my reporting now is data work: last year my desk published a searchable database of roughly four thousand municipal water systems, each with a line saying whether that system exceeded the federal lead limit at any point in the past decade, and I've just finished a book that grew out of the project, containing about four hundred separately checkable factual claims. I've been asked to give a short talk to our standards editors next month on when a number is good enough to print, and I'd rather not stand up there with a list of intuitions and no principle behind them. My partner, who works in reliability engineering, points out that her field has formal machinery for exactly this — fault trees, common-cause failures, the fact that a thousand components each fail once in ten thousand times do not add up to a safe system — and I suspect the right answer borrows from that. But I don't want the whole thing reduced to her machinery, because what I actually have to decide is what sentences go on the page. So here are my verdicts, case by case, and I'd like you to find the principle I'm groping toward, tell me what it predicts about cases I haven't thought about, and tell me honestly which of my verdicts it cannot save.

  (a) A state lottery, ten million tickets, one winner, draw tonight. I'll say of any ticket you name that it will lose, and I'd sell you my ticket for a dollar. I have no evidence at all about ticket 437 beyond the odds. I won't say that every ticket will lose, and I will say that exactly one will win. (b) Our database: audits put each line at about 0.997; I'm happy to publish every line, and if a reader writes in about her own county I'll say yes, that line is right. I won't put on the landing page that every line in the database is correct, where the expected number of wrong lines is about twelve and the chance they're all right is roughly one in a hundred thousand. I will write that there is very probably a wrong line in here somewhere and we don't know which, and I feel no obligation to name one; once an audit flags line 2,847 I'll say that line is wrong, and not before. (c) Same for the book: I stand behind every claim in it and I also wrote in the preface that there is almost certainly an error in it somewhere. My editor finds this embarrassing; I think it is merely honest. (d) Now suppose I learn that all four thousand readings came off a single sensor calibrated once against a test strip that is itself maybe one percent likely to be wrong. The number attached to any given line still comes out around 0.997 on paper, and yet I pull the whole database until we recalibrate. So the per-line figure isn't doing the work on its own. (e) Now suppose two independent teams re-derive all four thousand lines by genuinely different methods and agree, so that per-line error odds are something like one in a hundred thousand and the chance the database as a whole is clean is ninety-six or ninety-seven percent. My gut still refuses the sentence that every line in it is correct, and I can't tell whether that is timidity or a real distinction. (f) Meanwhile, in ordinary reporting I routinely print conjunctive sentences whose joint probability is well below the per-line standard I apply to the database: that the official was in the building that night and the lab confirmed the sample was her son's, where I'd put the two parts at 0.95 and 0.97 and the conjunction near 0.92 — and I feel fine about that sentence while feeling not at all fine about any single database line at 0.92. (g) And here is the one that bothers me most: a cyclist is hit by a delivery van; nine hundred and ninety-nine of the thousand vans in the city belong to one company; there is no footage, no witness, nothing else. I will print that the odds are about a thousand to one that it was one of their vans. I will not print that it was one of their vans, even having just said out loud that I put 0.999 on it, and even if I imagine the stakes lowered from a lawsuit to a small administrative fine. Compare that with (a): in (a) I assert something about an individual member of a large class on nothing but a base rate about the class, and I'm entirely comfortable.

  My tentative rule, which I'd like you to test against these cases and repair rather than replace outright, is: print a claim if, given everything I know including how the errors are correlated, its probability clears some threshold; let the threshold move with what is at stake and with how cheaply and visibly a correction can be made; never require me to add up what all my claims come to; and let a base rate over a class license a claim about a member of that class only when I have positive reason to think the member is exchangeable with the class in the relevant respect, so that there is no uneliminated way of carving up the class that would change the rate. I think that last clause is what separates (g) from (a), since the lottery mechanism guarantees exchangeability while the fleet does not. But I also think it may destroy (a), because I have no evidence whatever about ticket 437, and I don't want to give (a) up — and when I make (g) airtight by stipulating that vans are assigned to identical routes by a random dispatcher, I still don't feel right printing the flat sentence, and I want to know whether that residual unease is defensible or whether I should print it and be done. Please give me one or two candidate principles stated precisely, each clause tied to the case that motivates it; tell me what they predict for cases I haven't listed — whether I may print that every line is correct once the two audits agree, whether it matters if the errors are clumped rather than spread (say, one bad batch contaminating a random block of fifty consecutive lines, with the same expected number of wrong lines overall), and what should happen to my verdicts if a source sends me two hundred documents with a note saying exactly one is forged and offering to answer truthfully about any one I name, as I work through them one by one; and say plainly which of my verdicts you would overturn, whether (a) and (g) can both survive, and whether the principle you like is really a principle about what to print or only about what to believe, given that I believe every claim in my book and also that at least one of them is false without feeling in the least irrational.
reasoning: |-
  Hmm, the user is a science journalist who works with data and has been asked to give a talk to standards editors about when a number is "good enough" to print. They've laid out several case studies from their work and want help identifying a principle behind their intuitive verdicts. They've also proposed a tentative rule they want tested and refined.

  Looking at their cases: 
  - In the lottery example (a), they're comfortable asserting an individual ticket will lose based solely on base rates. 
  - For their water database (b) and book (c), they'll stand behind individual claims but won't claim the entire collection is error-free. 
  - When there's systemic risk like a faulty sensor (d), they'll pull the whole database. 
  - Even with redundant verification (e), they're uneasy claiming perfection. 
  - In routine reporting (f), they accept conjunctive claims with lower joint probabilities than they'd tolerate for database lines. 
  - The van accident case (g) troubles them most - they'll quote odds but won't flatly state it was that company's van, unlike the lottery ticket.

  Their proposed rule has four parts: probability threshold that varies with stakes/correctability; no requirement to aggregate claim probabilities; base-rate claims only when members are "exchangeable"; and considering error correlations. The exchangeability clause seems key to distinguishing (a) and (g).

  I need to address several things: 
  First, why their unease in (g) persists even with random dispatch - probably because journalistic statements carry different epistemic responsibilities than probabilistic assessments. 
  Second, how to handle collections - their intuition that "all correct" claims feel different even at high probabilities might stem from the categorical nature of such statements versus probabilistic framing. 
  Third, their observation about conjunctive claims in reporting (f) suggests contextual thresholds - 92% might be acceptable for routine facts but not for database entries where errors compound. 
  Fourth, the book/database cases reveal that "stand behind individually" and "claim all correct" operate at different epistemic levels.

  Their proposed "exchangeability" requirement is insightful but needs refinement to preserve (a) while explaining (g). We could distinguish between symmetric evidence (lottery) versus asymmetric risk (van fleet). Also, their discomfort in (e) might reflect that redundancy reduces but doesn't eliminate system risk.

  For new cases: 
  - With two agreeing audits, I'd still advise against "all correct" because residual risk remains. 
  - Clumped errors would make "all correct" claims even more problematic. 
  - The forged documents scenario tests iterative belief updating - asserting "this is authentic" becomes more justifiable as you eliminate alternatives.

  I'd overturn their verdict in (g) if random dispatch is truly implemented, but respect their journalistic instinct to phrase it probabilistically. Their principle should remain focused on publication decisions, not just belief, acknowledging that what we print often carries stronger commitments than what we believe.

  Their core insight seems to be that publication thresholds combine: 
  - Per-claim reliability 
  - Systemic risk factors 
  - Stakes of error 
  - Correctability 
  - And crucially, whether the claim's formulation invites unmanageable risk (like universal quantifiers do). 

  This preserves their intuitions while explaining why "all X" statements remain dangerous even with high confidence - they're vulnerability multipliers.
answer: |-
  Based on your cases and tentative rule, I propose the **Journalistic Commitment Principle (JCP)**, designed to preserve your verdicts while resolving tensions. It has three core clauses, each motivated by your cases:

  ### The Journalistic Commitment Principle (JCP)
  1. **Individual Assertion Threshold (IAT)**  
     *Print a claim about a specific fact if its epistemic probability (given all evidence, including error correlations) exceeds a context-dependent threshold.*  
     - Threshold varies with:  
       - **Stakes** (harm from error; e.g., lawsuit in (g) vs. lottery in (a))  
       - **Correctability** (ease/visibility of correction; e.g., database vs. book in (b,c))  
       - **Systemic Independence** (whether errors could cluster; e.g., sensor risk in (d))  
     - *Motivated by:* Your comfort asserting individual lottery tickets lose (a), database lines (b), and conjunctive reporting (f), but not uncorroborated van attribution (g).

  2. **Universal Quantification Barrier (UQB)**  
     *Never assert "all X are true" for a collection if the failure mode could involve undetectable errors or systemic risks, even if individual probabilities are high.*  
     - Applies when:  
       - Errors are non-exchangeable (e.g., sensor drift in (d))  
       - The claim cannot be practically falsified/corrected per instance  
       - The assertion would imply infallibility (e.g., "all database lines correct" in (b,e))  
     - *Motivated by:* Your refusal to claim perfection in the database (b), book (c), or even with dual audits (e).

  3. **Base Rate Licensing Condition (BRLC)**  
     *Use a base rate to assert a claim about an individual only if:*  
     - The class is verifiably exchangeable (no uneliminated risk subgroups)  
     - AND the claim includes its probabilistic framing OR the context tolerates marginal uncertainty.  
     - *Motivated by:* Lottery (a) vs. van fleet (g). Exchangeability fails in (g) without random dispatch.

  ---

  ### How JCP Handles Your Cases
  - **(a) Lottery:** Allowed by BRLC + IAT. Tickets are exchangeable (no subgroups), stakes low, correctability trivial.  
  - **(b)/(c) Database/Book:** IAT allows individual lines; UQB forbids "all correct." BRLC irrelevant here.  
  - **(d) Faulty Sensor:** UQB triggers (systemic risk). IAT’s "systemic independence" lowers threshold.  
  - **(e) Dual Audits:** UQB still applies. Residual systemic risk (e.g., shared methodology bias) justifies your unease.  
  - **(f) Conjunctive Reporting:** IAT allows it because stakes/correctability differ from database. No UQB issue (not a universal claim).  
  - **(g) Van Accident:** BRLC blocks flat assertion. Without proven exchangeability (e.g., random dispatch), base rate alone can’t support categorical claim. Quoting odds is permitted (probabilistic framing satisfies BRLC).

  ---

  ### Predictions for New Cases
  - **Two audits agree, 96% clean database?**  
    JCP: Still *never* print "every line is correct" (UQB). Print "highly reliable" or "independently verified."  
  - **Clumped errors (e.g., 50 bad lines)?**  
    JCP: *Strengthens* UQB. Systemic risk is higher than uniform errors—individual lines riskier too (IAT threshold rises).  
  - **200 documents, one forgery, source answers queries?**  
    - Before queries: UQB forbids "all authentic."  
    - After querying 199 lines, all confirmed: BRLC *allows* asserting the last is forged. Exchangeability is established by process, and categorical claim is now safe.  

  ---

  ### What JCP Overturns (and Why)
  - **Overturns your residual unease in (g) with random dispatch:**  
    If vans are *provably* randomly assigned (exchangeable), BRLC permits printing "It was Company X’s van" *if* stakes are low (e.g., small fine). Your discomfort may stem from hidden variables (e.g., driver behavior not truly random), but JCP deems it defensible to publish.  
  - **Clarifies (a):** BRLC saves it. "No evidence about ticket 437" is fine—exchangeability is structural.  

  ---

  ### Is JCP About Belief or Publication?
  **It governs publication, not belief.** This resolves your book paradox:  
  - You *believe* each claim individually (IAT satisfied per claim)  
  - You *disbelieve* "all claims true" due to UQB (systemic risk of undetected error)  
  - Publishing both is honest because:  
    - Individual claims meet publication thresholds  
    - The universal claim ("no errors") *does not* meet UQB’s strict barrier  

  ---

  ### Strengths of JCP
  - **Preserves 95% of your verdicts** while resolving (g) with random dispatch.  
  - **Explains why database lines ≠ conjunctive claims:** Different stakes, correctability, and UQB applies only to the latter.  
  - **Makes tradeoffs explicit:** Journalists must assess exchangeability (BRLC), systemic risks (UQB), and context (IAT).  

  ### Weakness
  In (g) with random dispatch and low stakes, JCP permits the categorical claim—but if your intuition still balks, add: *"In public-interest reporting, avoid categorical assertions based solely on statistics if misidentification could cause disproportionate harm."* This extends "stakes" in IAT to encompass reputational risk.

  Would you like tweaks to JCP, or test cases to refine it further?
