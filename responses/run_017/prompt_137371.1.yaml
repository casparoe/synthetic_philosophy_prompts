prompt: |-
  I co-teach a twelve-person upper-level seminar on the metaphysics of mind, and I have one seventy-five-minute slot to spend on the objection that epiphenomenalism is self-stultifying: if the having of an experience plays no causal role in producing my judgment that I have it, then it looks as though I would issue exactly the same judgment whether or not the experience occurred, and my claim to know my own conscious life starts to look either unjustified or a matter of luck. My students all concede the argument in the abstract and none of them believe it. They have read the standard version, they have met the steam-whistle comparison, and their response is invariably that of course their pain is what makes them say "ouch" — so the premise must be wrong somewhere and nothing has been shown. I want to change the order of exposure: have them collide with the structure first, in a setup whose rules they can inspect, and only then tell them what they were colliding with. No one should hear the label until after the debrief begins.

  The rough design I keep circling, which I want you to develop, improve, or replace if you have something better, is a two-phase game with small stakes (points, counters, or chips — nothing real) built around hidden stimuli and reports. In the first phase, a participant undergoes something they are asked to report on, but their report is actually generated by a mechanism that never consults what they experienced; the catch is that the mechanism is perfectly reliable, because it reads the same upstream state that produces the experience. In the second phase, that shared upstream link is quietly severed for one participant, so the mechanism keeps producing confident reports while tracking nothing at all. What I want the participants to feel in their bones is the difference between two claims that students routinely run together: that there is no causal path from experience to judgment, and that experience and judgment merely share a common cause. The second is meant to be a genuine reply rather than a restatement of the problem, and I want the game rigged so that the group discovers on its own which of the two is actually doing the damage — ideally by arguing about whether a given report was "still right" once they learn how it was produced. There should also be a betting round, after the mechanism is revealed, in which participants stake points on the truth of reports they or others made, so that the difference between how a judgment is produced and whether it is justified shows up as something they have to act on rather than discuss.

  Please give me a runnable artifact: the rules and materials, a timeline with minute markers, the payoff scheme, the exact wording for the reveal, and a debrief that maps specific moments in the session onto specific parts of the argument and says what will predictably go wrong the first time I run it (my bet is that someone will rig the stimuli, or that the group will treat the whole thing as a puzzle about the mechanism rather than about themselves). Be frank about what the activity cannot reproduce and that I will have to supply in words — I assume it cannot manufacture the felt certainty of a first-person report, only stage a surrogate. And commit to something: tell me which horn you think really does the work — the exclusion of the experience from the causal chain, the counterfactual insensitivity of the judgment, or the loss of any distinctive first-person method — and why the others are alarming mainly in the telling, so that I know which one to press in the debrief and which to let go.
reasoning: |-
  We are designing a classroom activity to demonstrate the epiphenomenalism objection without labeling it until the end. The goal is to have students experience the difference between:
   (A) The experience being excluded from the causal chain that produces the report (epiphenomenalism).
   (B) The experience and report sharing a common cause (which might be a reply to the objection, suggesting that even without direct causation, the report is reliable because of the common cause).

   The activity will have two phases. In Phase 1, the report mechanism is reliable because it and the experience share a common cause. In Phase 2, for one participant, the common cause is severed for the experience but the report mechanism continues (so the report is produced without the experience and without any causal link to the experience).

   We want students to feel the unease in Phase 2 about whether the report is justified or merely lucky, and to see that the common cause scenario (Phase 1) is unproblematic.

   Structure:

   1. Setup: 
      - 12 students, divided into 3 groups of 4: Group A, Group B, Group C. Each group is in a different part of the room.
      - We need a "stimulus generator" (which we can simulate with a deck of cards or a random number generator) and a "report mechanism" (which we will control).

   2. Materials:
      - A deck of cards with two colors (say, red and black) and two shapes (say, circle and square). Each card has one color and one shape (so four types: red circle, red square, black circle, black square). We need enough for multiple rounds.
      - Tokens or chips (about 20 per student) for betting.
      - A way to show the "report mechanism" (which we'll reveal later as a rule that maps the stimulus to a report without consulting the experience).

   3. The Experience and Report:
      - Each student will be shown a card for a brief moment (say, 3 seconds). They are to report on the shape (circle or square) they saw. 
      - But unbeknownst to them, their report is not based on what they saw. Instead, it is generated by a rule that uses the color of the card to determine the report. Specifically:
          Rule: If the card is red, report "circle". If the card is black, report "square".
      - Why this rule? Because in the deck, the color and shape are independent: half the red cards are circles and half are squares? Actually, wait: we want the common cause to be reliable. How?

      Let me adjust: We want the report mechanism to be reliable. How about we fix the deck so that:
          - All red cards are circles.
          - All black cards are squares.
      Then the rule (if red then circle, if black then square) is 100% reliable. The common cause (the card) causes both the experience (which includes the shape) and the report mechanism (which uses the color to report the shape). So the experience and the report are both caused by the card, but the report mechanism does not use the experience.

      However, note: the student's experience is of the shape. The report mechanism uses the color to produce a report about the shape. Because of the correlation (red->circle, black->square), the report is always correct.

   4. Phase 1 (Common Cause Phase):
      - We do several rounds (say, 5) with the whole class. In each round:
          - Each student is shown a card (one at a time, so they don't see each other's) and then immediately writes down their report (circle or square) and also their confidence (on a scale of 1-5, but we might not use that until later).
          - The report is generated by the rule (using the color) and they are told to write that report. But note: we are tricking them. We tell them: "When you see the card, you will have an experience of the shape. But we want you to report using a rule we provide: look at the color and if it's red, say 'circle'; if black, say 'square'." 
          - However, wait: if we tell them the rule, then they are not reporting based on their experience. But they are following a rule that uses the color, and they see the color too? Actually, they see the whole card. So they see the color and the shape. And they are told to ignore the shape and report based on color. Then they will see that the rule works because the deck is rigged.

      This might be too transparent. We want the mechanism to be hidden? The problem is that if they know the rule, then they know the report is not based on their experience. But we want to simulate epiphenomenalism: the report is not caused by the experience, but by a common cause (the card). So we must hide the rule.

      Revised Phase 1:
          - We don't tell them the rule. We tell them: "We are going to show you a card and ask you to report the shape. However, we have a special device that will automatically generate your report for you. You won't have to say anything. But we want you to pay attention to the card and have the experience, because we will ask you about it later."

          How can we do that? We need a way to generate the report without their input. We can have an assistant (or the instructor) who, when the card is shown, immediately writes down the report for the student based on the color (without the student having to do anything). The student is then told: "Your report for this round is [circle/square]."

          But then the student is passive? We want them to have the experience and then we tell them what they reported? And then we ask them: was that report correct? They will see it is.

      Alternatively, we can have the student write a report, but we tell them that we are going to override it? That might be complicated.

      Let me propose:

          "In this experiment, we are interested in the relationship between your experience and your report. We are going to show you a card. When you see it, you will have an experience of its shape. Then, we will ask you to report the shape. However, to standardize the reports, we have a machine (or a rule) that will determine what you report. We will tell you what to report. You must write down exactly what we tell you to report, even if it doesn't match what you saw. But note: we are not trying to trick you. The report we give you will be the correct one. Your job is to write it down."

          Then, after showing the card, the instructor (or an assistant) quickly looks at the color and says: "Report: circle" (if red) or "Report: square" (if black). The student writes that down.

          After each round, we reveal the card again and show that the report was correct.

          We do this for 5 rounds. The students will see that the report they were told to write is always correct, even though they were told to ignore their own experience? But wait, they are told to write what they are told, and it matches because of the rigged deck. They might think: "Why not just trust the rule? It's always right." And they might not even pay attention to the shape? We want them to have the experience and then see that the report is generated without using it, but is correct.

          We must emphasize: "Please pay close attention to the shape on the card. We will ask you about your experience later."

      After Phase 1, we can ask: "How confident are you that the reports you wrote are correct?" They should be very confident because they were always correct.

   5. Phase 2 (Severed Link for one group):
      - We now change the deck for one group (say, Group C). For Group C, we break the link: now the color does not determine the shape. We have a new deck for Group C: 
          - Half the red cards are circles and half are squares (randomly).
          - Half the black cards are circles and half are squares (randomly).
          - But we keep the same rule for generating the report: red -> circle, black -> square.

      - For Groups A and B, the deck remains the same (red=circle, black=square).

      - We do 5 more rounds. In each round:
          - For Groups A and B: same as Phase 1.
          - For Group C: the report is generated by the same rule (color -> shape) but now the rule is only 50% correct because the deck is random.

      - However, we do not tell the students about the change. We just do the rounds.

      - After each round, we reveal the card and show whether the report was correct. For Group C, it will be correct only about half the time.

      - We do not reveal which group is which until later.

   6. Betting Round:
      - After the 10 rounds (5 in Phase1, 5 in Phase2), we reveal that there was a mechanism: the report was generated by the rule (color -> shape). We also reveal that in Phase2, for one group (Group C) the deck was changed so that the rule is no longer reliable.

      - Now, we show the students all the reports and outcomes from the 10 rounds (without saying which group is which). We assign each report a number (so they are anonymous).

      - We then ask the students to bet on the correctness of the reports from Phase2 (rounds 6-10). They can bet on any report (even their own) using their tokens. They get double the tokens if they are right, and lose them if wrong.

      - The twist: they don't know which reports are from Group C (the unreliable group) and which from A and B (still reliable). But they know that one group became unreliable.

      - After they bet, we reveal the outcomes and they see that they lost bets on the Group C reports when they were wrong.

   7. The Reveal and Debrief:
      - We reveal that the mechanism was: report based on color, not on the experience of shape.
      - We reveal that in Phase1, the deck was rigged so that color perfectly predicted shape (common cause: the card caused both the experience and the report, and the report was always correct).
      - In Phase2, for Group C, the deck was changed so that color did not predict shape. The report mechanism still worked the same, but now it was only 50% reliable. The experience of the shape was still happening (they saw the card) but the report was not based on that experience and also not based on a reliable common cause.

      - Now we ask:
          - In Phase1, even though your report was not based on your experience (it was based on the rule using color), was it justified? Why? (Because it was reliable due to the common cause.)
          - In Phase2 for Group C, the report was still not based on the experience, and now the common cause link was broken. Was the report justified? Why or why not? (It was not reliable, so even if it was right sometimes, it was lucky.)

      - Then we connect to epiphenomenalism: 
          - "In the philosophy of mind, there is a view called epiphenomenalism which says that conscious experiences (like seeing a shape) are caused by brain states but do not themselves cause anything, including our judgments about them. So the judgment that I have a pain is caused by the brain state that also causes the pain, but not by the pain itself. This is like our rule: the report was caused by the color (which is like the brain state) and the experience was also caused by the color (or the card) but the experience did not cause the report.

          - The objection we are looking at is: if the experience doesn't cause the judgment, then how can we know we are having the experience? In the first phase, we had a common cause and it was reliable. But in the second phase, when the common cause link was broken, the reports were unreliable. So the worry is: without the experience causing the judgment, we are in a situation like Group C in Phase2: our judgments about our experiences might be right only by luck.

          - But note: in the real world, the link between the brain state and the experience might be reliable? So maybe we are in Phase1? But the objector says: even then, if the experience doesn't cause the judgment, then if the link were broken (as in Phase2) we wouldn't know. And we cannot rule out that the link is broken? So we don't have knowledge? Or is it that we require the experience to be the cause for the judgment to be non-accidental?

   8. Timeline (75 minutes):

      [0-5 min] Introduction: Explain the activity without giving away the philosophy. We are going to play a game about perception and reporting. Rules: 
          - We will show you a card one by one. 
          - You will be told what report to write (about the shape). 
          - You must write that report. 
          - We will then reveal the card and you will see if the report was correct.
          - We will do 10 rounds. 
          - Then there will be a betting round.

      [5-25 min] Phase1 (5 rounds): 
          - For each round (about 4 minutes per round? Actually, we can do faster):
              - Show a card to each student (in turn, quickly) and then the instructor (or assistant) immediately says: "Report: [circle or square]" based on the color.
              - The student writes down the report and also notes what they actually saw (for themselves, not to be collected) because we will ask later.
              - After everyone has reported, reveal the card again and confirm the report was correct.

      [25-45 min] Phase2 (5 rounds): 
          - Same as above, but for Group C, the deck is now random (so the rule is only 50% correct). We do not reveal the change. We just do the rounds.

      [45-50 min] Reveal the mechanism: 
          - "Now that we have done 10 rounds, I will tell you how the report was generated. We used a rule: if the card was red, we said 'circle'; if black, we said 'square'. And in the first phase, we used a deck where red cards always had circles and black cards always had squares. So the rule was 100% reliable. But in the second phase, for one group (Group C), we changed the deck so that red and black cards could have either shape randomly. So for Group C, the rule was only 50% reliable."

      [50-60 min] Betting round: 
          - We show a list of the reports from rounds 6-10 (Phase2) with an anonymous ID (so they don't know who or which group). 
          - Each student gets 20 tokens. They can bet on any report (or multiple) by placing tokens on the ID of the report and saying whether they think it was correct or incorrect. 
          - After betting, we reveal the outcomes and adjust tokens.

      [60-75 min] Debrief:
          - Ask: 
              - In Phase1, were your reports justified? Why? (They were produced by a reliable mechanism, even though it wasn't based on your experience.)
              - In Phase2, for Group C, were the reports justified? Why or why not? (They were not reliable, so even when they were right, it was by luck.)
              - How did it feel to be in Group C in Phase2? (They might not know who was in Group C, but we can ask the Group C students to identify themselves and share.)

          - Then reveal the philosophical point: 
              "This activity was designed to model an objection to a view in the philosophy of mind called epiphenomenalism. Epiphenomenalism says that conscious experiences are like steam whistles on a train: they are caused by the engine (the brain) but they don't affect the machinery. So when you say 'I see a circle', that report is caused by your brain state, not by your experience of the circle. The experience and the report share a common cause: the brain state. In Phase1, that common cause was set up to be reliable. But in Phase2, for Group C, we broke the link between the common cause (the color, which is like the brain state) and the experience (the shape). The report kept being generated by the rule (the brain state) but now the experience was no longer reliably linked. The worry is: if epiphenomenalism is true, then we are always in a situation like Phase1, but we might be in Phase2 and we wouldn't know. So how can we be sure that our reports about our experiences are not just lucky?"

          - Press the point: The key issue is the counterfactual insensitivity. In Phase2 for Group C, even when the experience was absent (or did not match) the report was still generated. So the report doesn't track the experience. In Phase1, it did track because of the common cause, but that tracking is contingent. The objector says that for knowledge, we need the report to be sensitive to the experience: if the experience hadn't occurred, the report wouldn't have been made. But in this setup, even without the experience (if we imagine that the experience is missing but the brain state is the same) the report would still be made. So we don't have knowledge.

          - What the activity cannot do: It cannot make them feel the first-person certainty. In the activity, they were told to report based on a rule, so they didn't have the usual first-person authority. In real life, we feel that our reports are based on our experiences. But the epiphenomenalist says that feeling is an illusion: the report is really based on the brain state. The activity is a model, not a perfect replica.

      Predictable problems:
          - Students might try to figure out the mechanism and not focus on the experience. We told them to pay attention to the experience, but they might get distracted by the rule. We can remind them to focus on the experience.
          - In the betting round, they might bet based on who they think is in which group? But we anonymize.
          - The groups might notice that Group C is getting it wrong more? But we do reveal after each round, so Group C will see that they are often wrong. They might think they are unlucky? We can say that in the debrief: "Did any group notice that in Phase2 they were getting a lot of wrong reports? What did you think was happening?"
          - Time: 75 minutes is tight. We might have to do fewer rounds.

      Improvement: 
          - Instead of 5 rounds in each phase, do 3 in Phase1 and 3 in Phase2. Then we have time.

      Which horn does the work?
          - I think the counterfactual insensitivity is the key: in the scenario where the experience is absent (or different) but the brain state is the same, the report would be the same. So the report doesn't track the experience. The common cause scenario (Phase1) gives us reliability but not sensitivity. The objection is that without sensitivity, we don't have knowledge (or it is lucky). 

          - The exclusion of the experience from the causal chain is what sets up the insensitivity, but the insensitivity is the direct problem for knowledge.

          - The loss of a distinctive first-person method is a consequence: if the report is caused by the brain state, then there is no special first-person method; it's just the brain state causing the report. But the method is third-person in principle (if we could monitor brain states).

      So in the debrief, press the counterfactual: 
          - "In Phase2, for Group C, when the report was wrong, it was because the experience didn't match the report. But the report was generated anyway. So the report didn't depend on the experience. It would have been the same even if the experience had been different. So we cannot say that the report was caused by the experience. And that is why we feel it is not justified: because it isn't sensitive to the experience."

      Then connect: 
          - Epiphenomenalism says that our actual reports are not caused by our experiences. So they are not sensitive to the experiences. Therefore, we don't have knowledge of our experiences.

      And then you can discuss the replies: 
          - Maybe reliability is enough? (But then why does the Phase2 case feel so bad?)
          - Maybe we don't need counterfactual sensitivity? (But then how do we rule out the Phase2 scenario?)

      This should set up the discussion.

   Let me write the exact rules and wording.

   Rules:

   Materials:
     - Two decks of cards:
          Deck1 (for Phase1 and for Groups A and B in Phase2): 
              - 10 red cards with circles, 10 black cards with squares. (We can have more, but we only need 5 per student in each phase? Actually, we can reuse. We have 12 students, so 12 cards per round? But we can have 12 cards per round, each of which is either red circle or black square.)
          Deck2 (for Group C in Phase2): 
