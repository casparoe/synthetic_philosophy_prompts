        - "We are now going to have a betting round. I will show you a list of all the reports from rounds 4,5,6 (Phase2). Each report is identified by a number. You do not know who made which report. You also don't know which reports are from Group C (the unreliable group) and which are from Groups A and B (reliable). But you know that half of the Group C reports are wrong and all of the others are right.

          Each of you has 20 tokens. You can bet on any report. For each report, you can bet that it was correct or incorrect. You can bet as many tokens as you want on any report (but you cannot bet more tokens than you have). 

          If you bet on a report and you are right, you get double the tokens you bet. If you are wrong, you lose the tokens.

          We will then reveal the outcomes and you will see your winnings."

        - We list all 36 reports (12 students * 3 rounds) with a random ID. We note that 18 reports are from Group C (and half of these are wrong, so 9 wrong) and 18 from A and B (all correct). 

        - They bet. Then we reveal the truth and adjust tokens.

