        - "Now let me explain how we generated the reports. We used a simple rule: if the card was red, we told you to report 'circle'; if black, we told you to report 'square'. In the first three rounds, we used a deck where every red card had a circle and every black card had a square. So the rule was 100% reliable. But in the last three rounds, for one group (Group C), we used a different deck: for this deck, the color did not determine the shape. So for Group C, the rule was only 50% reliable."

