            - Groups A and B: same as Phase1 (Deck1).
            - Group C: use Deck2. For each student in Group C, randomly pick a card from Deck2 (so the shape is random given the color). The rule is still: if red, report circle; if black, report square.
            - After each round, reveal the card and confirm if the report was correct. For Group C, about half will be wrong.

