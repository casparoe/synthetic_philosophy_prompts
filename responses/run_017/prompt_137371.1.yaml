   Procedure:

    Introduction (5 min):
        "Today we are going to do an activity about perception and reporting. We will show you cards one by one. Each card has a color and a shape. We are interested in the shape. However, to standardize the reports, we will tell you what to report. After we show you the card, we will immediately tell you: 'Report: circle' or 'Report: square'. You must write down exactly what we tell you. We are not trying to trick you. In fact, the report we give you will be the correct one. Your job is to write it down. We will do 10 rounds. After each round, we will reveal the card again so you can see that the report was correct. 

        However, we want you to pay close attention to the shape on the card. We will ask you about your experience later.

        After the 10 rounds, we will reveal more about how the reports were generated and then we will have a betting round."

