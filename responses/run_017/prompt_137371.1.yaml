        Round1 to Round3:
            - For each student in turn (go group by group to avoid chaos):
                - Show a card (from Deck1) for 3 seconds.
                - The instructor (or assistant) looks at the color and immediately says: "Report: circle" (if red) or "Report: square" (if black).
                - The student writes down the report on a sheet (with round number).
            - After all students have reported, reveal the card again and say: "The shape was indeed [circle/square]. So the report was correct."

