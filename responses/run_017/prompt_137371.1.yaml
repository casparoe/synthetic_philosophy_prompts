        - Start by asking:
            - How did the activity feel? What did you notice?
            - In Phase1, when we told you what to report, did you feel confident? Why?
            - In Phase2, when we showed the card and sometimes the report was wrong (especially for Group C), how did that feel? Group C: did you notice that you were getting wrong reports? What did you think?

        - Then ask:
            - In Phase1, even though your report was generated by a rule that didn't look at your experience (it looked at the color), was it justified? Why? (Because it was reliable.)
            - In Phase2, for Group C, when the report was generated by the same rule but the rule was no longer reliable, were those reports justified? Why or why not? (Even when they were right, it was by luck.)

        - Introduce the philosophy:
            - "This activity was designed to model an objection to a view called epiphenomenalism. Epiphenomenalism says that conscious experiences are caused by brain states but do not cause anything themselves, including our judgments about them. So the judgment that I see a circle is caused by a brain state, and the experience of the circle is also caused by that brain state, but the experience does not cause the judgment.

            - In the activity, the card is like the brain state. The experience is the experience of the shape. The report is the judgment. The rule (color -> report) is the mechanism that produces the judgment without consulting the experience.

            - In Phase1, the common cause (the card) made the experience and the judgment match. But in Phase2, for Group C, the common cause link was broken: the experience (the actual shape) was not reliably linked to the brain state (the color) anymore. The judgment was still produced by the brain state, so it didn't match the experience.

            - The objection is: if epiphenomenalism is true, then our judgments about our experiences are not caused by the experiences. So if something went wrong in the link between the brain state and the experience (like in Group C in Phase2), we would still make the same judgments even though the experience was different. So we wouldn't know. And we cannot rule out that such a break might be happening. Therefore, we don't really know our own conscious experiences.

            - The key issue is counterfactual insensitivity: if the experience had been different (or absent) but the brain state the same, the judgment would still be the same. So the judgment doesn't track the experience. And without tracking, we don't have knowledge.

        - Discuss:
            - Is this a good objection? How might an epiphenomenalist reply?
            - They might say: in the actual world, the brain state and the experience are reliably linked. So our judgments are reliable. And reliability is enough for knowledge.
            - But the objector says: without sensitivity, the reliability is accidental. And in the Group C case, we see that when the link breaks, we get unreliability. So we need the experience to cause the judgment to have non-accidental reliability.

        - Wrap up: "We started with an abstract argument that seemed unconvincing. Now that we've lived through a version of it, does it feel more compelling? Why or why not?"

    Total: 5+9+9+5+10+25 = 63 minutes. We have 12 minutes buffer.

    Note: This activity does not reproduce the felt certainty of first-person reports because the students were told to report by a rule. But it does show the structural worry: when the judgment is not caused by the experience, it might be insensitive to the experience. And that is the worry we are after.

    So run it and see how it goes!
answer: |-
  ### Runnnable Classroom Activity: The Reporting Game  
  **Objective:** Create an experiential understanding of the epiphenomenalism objection by contrasting *common-cause reliability* (Phase 1) with *causal exclusion + unreliability* (Phase 2). Students will confront the difference between "my experience causes my report" and "my experience and report share a common cause," then grapple with justification in a betting round.  

  ---

  ### **Materials**  
  1. **Stimulus Cards**:  
     - **Phase 1 Deck (Shared Cause)**: 12 cards (one per student). Each card has:  
       - A **symbol** (★ or ♦) visible only to the instructor.  
       - A **color border** (red or blue) visible to students.  
       - *Setup*: All red-border cards have ★; all blue-border cards have ♦ (100% correlation).  
     - **Phase 2 Deck (Severed Link)**: 12 cards. Same as above, but:  
       - Red borders: Half ★, half ♦ (randomized).  
       - Blue borders: Half ★, half ♦ (randomized).  
     - *Note*: Use paper cards or digital slides. Ensure symbols are hidden until post-report reveal.  

  2. **Reporting Mechanism**:  
     - A **rule card** (hidden until reveal):  
       *"Report ★ if border is RED; Report ♦ if border is BLUE."*  
     - A **coin** (for Phase 2 severed group).  

  3. **Tokens**: 10 poker chips per student (for betting).  

  4. **Scoreboard**: To track tokens.  

  ---

  ### **Rules and Timeline** (75 minutes total)  
  #### **Phase 1: Shared Cause (20 min)**  
  - **0–5 min: Setup**  
    - *Instructor script*:  
      > "We’ll play a perception game. I’ll show each of you a card with a colored border. **Pay close attention to the border color** — you’ll report the *symbol hidden inside* based on a secret rule. Your report is generated automatically by this rule — you don’t decide it. After everyone reports, I’ll reveal the symbols so you see if you were right. Let’s begin."  
    - Assign students to 3 groups (A, B, C) of 4, seated together.  

  - **5–20 min: Rounds 1–3**  
    - *Procedure per round*:  
      1. Show each student their card (border visible; symbol hidden).  
      2. Apply the hidden rule: **Report ★ for red, ♦ for blue.**  
      3. Students write the dictated report on paper (e.g., "Round 1: ★").  
      4. Reveal symbols: Confirm all reports are correct (due to 100% border-symbol link).  
    - *Key*: Students experience the border color, but reports ignore it. Reliability feels natural.  

  ---

  #### **Phase 2: Severed Link (20 min)**  
  - **20–25 min: Setup**  
    - *Instructor script (deceptive)*:  
      > "Same rules. But now, I’ll flip a coin for Group C before each round. Heads: use the old deck; Tails: use a new deck. Don’t worry — the rule stays the same."  
    - *Reality*: For Group C, **always use the severed deck** (border-symbol link broken). Groups A/B use original deck.  

  - **25–40 min: Rounds 4–6**  
    - *Procedure*:  
      1. Show cards. Apply the same rule to generate reports.  
      2. Reveal symbols:  
         - Groups A/B: Always correct.  
         - Group C: Correct 50% of the time (e.g., a red border might hide ♦).  
      3. Students record reports.  
    - *Observe*: Group C will see errors but assume bad luck.  

  ---

  #### **Betting Round (15 min)**  
  - **40–45 min: Reveal Mechanism**  
    - *Instructor script*:  
      > "Time to bet tokens on whether past reports were right. First, the secret rule: **Your report was ★ for red borders, ♦ for blue borders — not based on the symbol.** In Phase 1, borders and symbols matched perfectly. In Phase 2, Group C’s deck was altered so borders didn’t predict symbols. Their reports were right only half the time by chance."  

  - **45–55 min: Betting**  
    - *Procedure*:  
      1. Display anonymous Phase 2 reports (e.g., "Reporter 7, Round 4: ♦").  
      2. Students bet tokens on "correct" or "incorrect" for any report.  
      3. Payoffs:  
         - Correct bet: +2 tokens.  
         - Incorrect bet: −1 token.  
    - *Catch*: Students know Group C’s reports are 50% reliable but not *which* reports are Group C’s.  

  ---

  #### **Debrief (20 min)**  
  - **55–65 min: Guided Discussion**  
    - *Start with feelings*:  
      > "Group C, how did it feel when reports were wrong? Did you trust the rule? When you bet, did you avoid your own reports?"  
    - *Contrast phases*:  
      - **Phase 1**: Reports reliable due to common cause (border → symbol + report).  
      - **Phase 2**: Group C’s reports unreliable — common cause severed, rule "tracked nothing."  
    - *Map to epiphenomenalism*:  
      > "In Phase 1, your experience (seeing red) didn’t cause your report — both shared a cause (the card). In Phase 2, Group C’s reports were *insensitive*: they’d say ‘★’ for red even if the symbol was ♦. This mirrors epiphenomenalism: if experiences don’t cause judgments, your ‘ouch’ might happen without pain. The betting round forced you to act on whether reports were *justified*, not just reliable."  

  - **65–75 min: Philosophical Press**  
    - *The key horn*: **Counterfactual insensitivity** does the work.  
      - Why? In Phase 2, Group C’s reports were *accidentally* right — the judgment didn’t counterfactually depend on the experience (e.g., same report even if symbol changed). This directly threatens justification ("lucky" true beliefs).  
      - *Downplay other horns*:  
        - Causal exclusion is the setup, but alone it’s unproblematic (Phase 1 worked).  
        - Loss of first-person method is a *consequence* of insensitivity, but the activity can’t replicate Cartesian certainty — flag this gap.  
    - *Predictable issues*:  
      - Students may obsess over "solving" the mechanism (e.g., "Is the rule based on color?"). Redirect with: "Forget the rule — focus on whether you’d bet on your report."  
      - Group C might dismiss errors as "bad luck." Use betting to make stakes visceral.  
      - Severing the link subtly (coin flip ruse) prevents early suspicion.  

  ---

  ### **What the Activity Can’t Do**  
  - **No first-person certainty**: Students *know* reports are rule-based, so they lack the "I feel pain" certainty. Explicitly note:  
    > "In real life, we feel our judgments are *driven* by experiences. Here, we simulated a world where they aren’t — the worry is whether that gap undermines knowledge."  
  - **No neural realism**: The "border" is a stand-in for brain states. Clarify: "In epiphenomenalism, the ‘border’ is a neural cause; the ‘symbol’ is conscious experience."  

  ---

  ### **Why This Works**  
  The activity forces students to **live the counterfactual**: In Phase 2, Group C’s reports are *structurally identical* to epiphenomenal judgments — caused by a state (border) that *normally* correlates with experience but is now severed. Betting makes justification pragmatic, not abstract. When Group C students hesitate to bet on their own "lucky" reports, they embody the objection: "If my pain doesn’t cause my ‘ouch,’ why trust it?"  

  **Commitment**: Press the **insensitivity horn** in debrief. It transforms the abstract "causal exclusion" into a tangible epistemic failure ("My judgment couldn’t track truth if experiences changed"). Phase 2’s severed link makes this visceral — and no other horn does.
