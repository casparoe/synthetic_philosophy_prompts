answer: |-
  ### Final Exam Question  
  **Answer one question in 1,200 words or less. State and defend a clear thesis. Use only the *Mūlamadhyamakakārikā* (MMK) and *Vigrahavyāvartanī* (VV) for textual support.**  

  **Question:**  
  Nāgārjuna’s *catuṣkoṭi* (four-cornered negation) systematically rejects four possibilities: (1) that a thing *is* F, (2) that it *is not* F, (3) that it *is both* F and not-F, and (4) that it *is neither* F nor not-F. Your friend in logic argues this is redundant (if F and not-F are contradictories, corners 3–4 collapse) or contradictory (rejecting both F and not-F violates non-contradiction).  
  Using **one mundane example** (e.g., "The cat is on the mat") and **one ultimate example** (e.g., "Dharmas have *svabhāva*," i.e., intrinsic essence), argue for **one** of the following views:  
  (A) The *catuṣkoṭi* applies identically in both cases, implying global skepticism about ordinary truths.  
  (B) The *catuṣkoṭi* applies *only* to ultimate truths, requiring a clear criterion to distinguish its scope.  
  (C) The *catuṣkoṭi* is not about truth-conditions but serves another purpose (e.g., therapeutic de-reification).  

  Address two objections in your answer:  
  1. If rejecting all four corners is logically incoherent, does Nāgārjuna deny the principle of non-contradiction?  
  2. If Nāgārjuna asserts "no thesis" (VV 29), is this assertion itself empty? How does this avoid infinite regress?  

  *Key terms*:  
  - *svabhāva*: Intrinsic nature; independent existence.  
  - *catuṣkoṭi*: Four logical alternatives (is, is not, both, neither).  
  - *saṃvṛti*: Conventional truth; everyday pragmatic reality.  
  - *paramārtha*: Ultimate truth; the way things are without conceptualization.  

  ---

  ### Model Answer (950 words)  
  **Thesis:** The *catuṣkoṭi* exclusively targets ultimate claims about *svabhāva*, not mundane truths. Its negation is coherent as a *diagnostic tool* revealing conceptual incoherence, not a contradictory assertion.  

  **I. Mundane vs. Ultimate: The Scope Distinction**  
  In conventional (*saṃvṛti*) contexts like "The cat is on the mat," the *catuṣkoṭi* does not apply. Here, "is" and "is not" are pragmatic designations (MMK 24.18: *saṃvṛti satyaṃ paramārthaḥ*). To ask "Is the cat on the mat?" assumes a stable, self-contained cat and mat—but *saṃvṛti* operates *without* demanding *svabhāva*. We accept "the cat is on the mat" provisionally, as it enables action (e.g., petting the cat). Rejecting all four corners for mundane claims *would* entail skepticism, but Nāgārjuna affirms conventional functionality (MMK 24.10).  

  For ultimate truths (*paramārtha*), however, the *catuṣkoṭi* applies when questioning *svabhāva*. Take "Dharmas have *svabhāva*." If *svabhāva* meant independent existence, then:  
  - (1) "Dharmas have *svabhāva*" fails because all things dependently arise (MMK 1.1: *pratītya samutpāda*).  
  - (2) "Dharmas lack *svabhāva*" *seems* true but is rejected because "lacking *svabhāva*" presupposes *svabhāva* as a reference point (MMK 15.3).  
  - (3) "Both have and lack *svabhāva*" is absurd, as *svabhāva* cannot be both present and absent.  
  - (4) "Neither" implies a reality beyond having/lacking—but this reifies a "neither" essence (MMK 22.11).  
  All corners are rejected because the *question itself* assumes *svabhāva* is coherent. The *catuṣkoṭi* exposes this by exhausting all logical options.  

  **II. Resolving Logical Incoherence**  
  The *catuṣkoṭi* is not redundant or contradictory because it targets *conceptual frameworks*, not propositions. For mundane cases, F and not-F are contradictories within a shared framework (e.g., spatial location). For *svabhāva*, however, the framework is invalid: *svabhāva* cannot exist even as a concept (MMK 15.6). Thus, rejecting "F" (e.g., "has *svabhāva*") and "not-F" ("lacks *svabhāva*") is not contradictory because "not-F" still smuggles in *svabhāva* as a negation target. This is why corners 3–4 are included: to block escapes like "both" (synthesizing) or "neither" (transcending). Nāgārjuna does not deny non-contradiction for conventional use; he shows *svabhāva* makes *all* ultimate positions incoherent.  

  **III. Emptiness of Emptiness and Regress**  
  Nāgārjuna’s "no thesis" (VV 29) avoids assertion because emptiness (*śūnyatā*) is itself empty (MMK 13.8: *śūnyatā śūnyatā*). The *catuṣkoṭi* negates *reification*, not conventional functionality. When he "asserts" no thesis, it is a conventional tool to undo clinging—like a ladder discarded after use (VV 30). To object that "no thesis" is a thesis is to mistake *saṃvṛti* for *paramārtha*. Emptiness applied to itself terminates regress: if emptiness is not a *svabhāva*-possessing entity, there is nothing to negate (MMK 24.18).  

  **Conclusion:** The *catuṣkoṭi* is a domain-specific diagnostic for *svabhāva*. It is logically sound as it reveals the incoherence of essentialism, not a metaphysical claim. Mundane truths remain operative precisely *because* they require no *svabhāva*.  

  ---

  ### Marking Scheme (20 points)  
  **1. Scope Distinction (5 pts)**  
  - 5: Clearly distinguishes *catuṣkoṭi*’s application to *paramārtha* (e.g., *svabhāva*) vs. non-application to *saṃvṛti* (e.g., "cat on mat"), with textual support (e.g., MMK 24.10/18).  
  - *Common error (3 pts)*: Claims *catuṣkoṭi* applies universally but fails to explain why skepticism doesn’t follow.  
  - *Fail (0–1 pt)*: No distinction; conflates mundane/ultimate.  

  **2. Mundane Example Handling (3 pts)**  
  - 3: Explains why mundane cases *do not* require fourfold negation (e.g., conventional truths function without *svabhāva*).  
  - *Common error (1 pt)*: Claims all corners are rejected for mundane cases but cannot justify non-skepticism.  

  **3. Logical Coherence Defense (4 pts)**  
  - 4: Defends negation of all four corners as non-contradictory by showing corners 3–4 address *conceptual evasion* (e.g., "neither" reifies transcendence).  
  - *Common error (2 pts)*: Asserts "logic doesn’t apply" without explaining *how* the *catuṣkoṭi* avoids redundancy.  

  **4. Regress Objection Response (4 pts)**  
  - 4: Uses "emptiness of emptiness" (MMK 13.8) or "no thesis" (VV 29–30) to show self-applied negation terminates regress.  
  - *Common error (2 pts)*: States "Nāgārjuna asserts nothing" but cannot explain how this isn’t self-refuting.  

  **5. Purpose of Tetralemma (4 pts)**  
  - 4: Identifies *catuṣkoṭi* as therapeutic de-reification (e.g., exhausting *svabhāva*-based thinking), not truth-apt assertion.  
  - *Common error (2 pts)*: Calls it "mystical" or "beyond logic" without textual/argumentative support.  

  ---

  ### Grading Standards  
  **A (18–20 pts):**  
  - Takes a stand (A/B/C) and defends it against objections.  
  - Uses MMK/VV verses *as evidence* (e.g., MMK 15.3 for corner 2’s presupposition failure).  
  - Explains *why* corners 3–4 are necessary (e.g., "neither" implies a fifth hidden essence).  
  - Shows emptiness terminates regress by being non-referential (MMK 24.18: *śūnyatā sarvadṛṣṭīnāṃ*—"emptiness clears all views").  

  **B (15–17 pts):**  
  - Correctly distinguishes mundane/ultimate scope but with weak textual engagement.  
  - Addresses objections superficially (e.g., "emptiness isn’t nihilism" without explaining *how* it functions).  
  - Omits one key element (e.g., fails to explain why "no thesis" isn’t a thesis).  

  **C (10–14 pts):**  
  - Discusses themes (e.g., "tetralemma is about the Middle Way") without defending a position.  
  - Misreads texts (e.g., claims MMK endorses corner 4 for conventional truth).  
  - Retreats to "it’s beyond logic" or "a meditative device" *without argument*.  
  - Ignores either the mundane example or regress objection.  

  **D/F (<10 pts):**  
  - Summarizes Nāgārjuna’s views without engaging the question.  
  - Asserts "all is empty" as a universal negation.  
  - No textual support.  

  ---

  ### Avoiding Common Pitfalls  
  - **"Emptiness isn’t nothingness"**: Worth 0 pts if unsupported. To earn credit, students must explain *how* emptiness enables conventional function (e.g., MMK 24.14: *sarvaṃ ca yujyate*—"all is coherent").  
  - **"Beyond logic" claims**: Penalized unless shown to be Nāgārjuna’s *method* (e.g., *reductio ad absurdum* of logic applied to *svabhāva*).  
  - **Weak answers** change the subject (e.g., "Nāgārjuna is a mystic")—mark down for lacking argument.  
  - **Strong answers** grapple with the logic friend’s challenge by exposing the *svabhāva* presupposition in corners 2–4.  

  This question forces engagement with Nāgārjuna’s operational logic while excluding formulaic responses. The model answer demonstrates how to reject all corners without inconsistency by treating the *catuṣkoṭi* as a meta-logical critique of essentialism.
