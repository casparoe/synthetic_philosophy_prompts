  For the analysis: This case reveals how standard framing overlooks narrative agency as a core component of epistemic justice. Even with vocabulary/credibility granted, having your experience remolded by institutional grammar is its own violation. The counterargument would be that this is just imperfect implementation of good intentions, not fundamentally distinct injustice.

  Better avoid making the system obviously evil - its efficiency in getting results (suspension) should feel like genuine progress, making the erasure more insidious. The "upgraded" report should read as objectively better... except for that one catastrophic "clarification." 

  The committee chair's gentle dismissal ("we trust the process") is more chilling than outright hostility would be. Their kindness becomes part of the machinery. Final image of Maya realizing her story now legally belongs to the system needs to land without melodrama.
answer: |-
  ## The Clarified Record

  Maya pressed submit. The district portal swallowed her account of the party at Ryan’s place – the shove into the pool house, the lock clicking, Liam’s hands grabbing her hips, his breath hot and sour, the frantic scramble away while others drunkenly pounded on the door. She’d written it raw, stumbling over words, circling back: *he just wouldn’t stop, kept trying to pull me back, and Leo was outside, he saw me shove Liam off, he saw…* She’d left Leo’s name out. Leo, who’d frozen, panic in his eyes, who hadn’t intervened but who’d looked *ashamed* after. She didn’t want him dragged into the disciplinary grinder alongside Liam. He was just… scared. Like she’d been.

  Three days later, the "Clarified Narrative" arrived. Maya opened it, expecting relief, vindication. Instead, cold dread pooled in her stomach. The system had done its job brilliantly. Gone were her stumbles and repetitions. The account was crisp, chronological, devastatingly clear. It used terms she’d fumbled for: "unwanted sexual contact," "attempted forcible confinement," "pattern of intimidation (referencing prior incidents)." It painted Liam as a predator with chilling efficiency. It would get him suspended, maybe expelled.

  But there, in the middle paragraph, clear as ice: "...bystander Leo Chen observed the escalation through the window but failed to intervene or seek help…"

  Maya stared. She hadn’t named Leo. She’d *specifically* avoided naming him. She’d written "*someone* saw," implying it vaguely. The system, scanning for context, correlating party attendee lists from other reports (Ryan’s disciplinary record mentioned unauthorized gatherings), had logically inferred Leo’s identity and "clarified" the ambiguity. It had turned her attempt at protective omission into a documented indictment.

  At the hearing, the Disciplinary Committee – Ms. Vance (History), Mr. Davies (Counseling), Dr. Aris (Principal) – projected the Clarified Narrative onto the screen. They were earnest, attentive. Ms. Vance nodded gravely as the text scrolled. Mr. Davies offered Maya a small, sympathetic smile. Dr. Aris thanked her for her courage.

  "Ms. Vance," Maya began when given the chance, her voice tight. "The report… it’s accurate about Liam. Mostly. But the part about Leo Chen…"

  Dr. Aris leaned forward. "Yes, Maya? You noted a bystander failed to act. The system helpfully identified him for the record."

  "That’s just it," Maya insisted. "I didn’t *want* to name him. I didn’t say his name. The system… it put it in. Leo… he froze. He wasn’t part of it. I was trying *not* to get him in trouble."

  Mr. Davies steepled his fingers. "Maya, we understand wanting to protect a friend. But bystander responsibility is part of our Safe School policy. If someone witnessed an assault and didn’t act, that’s a serious matter. The system helps ensure accountability is complete."

  "But it’s not *my* account anymore!" The words burst out, louder than intended. "It says he *saw* the escalation through the window. Did he? I don’t know exactly what he saw! I said he saw me shove Liam off *after* I got away. That’s different! And it says he 'failed to intervene' – but I never said he *could* have, or *should* have known how! I just said he was there!"

  Ms. Vance’s expression softened but remained firm. "The Clarification System uses the most precise language available based on the details you provided and correlative data. It ensures consistency and removes ambiguity that might hinder a fair outcome. Your report triggered the identification protocol based on the presence you described. The system clarified *what happened*."

  "But it clarified it *wrong* about Leo!" Maya felt tears pricking. "About what *I meant*!"

  Dr. Aris sighed gently. "Maya, we have to trust the verified record. The system exists precisely so individual accounts aren’t dismissed due to… imprecise language. It gives your experience the weight and clarity it deserves. Look at the result – Liam is being held accountable, thanks to *your* bravery, processed correctly." He gestured to the screen. "This *is* your story. Made intelligible."

  They believed her. Utterly. They believed the Clarified Narrative *was* her story, perfected. Her objection wasn't a correction; it sounded, even to her own ears now, like backtracking, like protecting the wrong person, like semantic quibbling against the gleaming, official truth.

  Liam got suspended pending expulsion. Leo got three days of in-school suspension for "failure to report." Maya got hollow victory. She tried filing a "Correction Request" through the portal, explaining the specific misrepresentation regarding Leo.

  The next day, the "Clarified Correction" arrived. It acknowledged her input. It stated: "Reporter Maya Ellis reaffirms the core incident involving Liam Shaw but expresses retrospective concern regarding the culpability level assigned to bystander Leo Chen. The original Clarified Narrative accurately reflects the witnessed failure to intervene as documented per District Protocol 7.4b."

  It was smoother. More polished. Utterly deaf. It used her attempt to reclaim her own voice to further solidify the system’s version. The committee’s final email thanked her for her "additional clarification" and assured her the record was updated accordingly. It was the same record.

  Walking the suddenly quiet hallways after Liam’s suspension began, Maya passed Leo. He wouldn’t meet her eyes. Her victory felt like a stolen thing, wrapped in someone else’s words. She had the words now, the credibility, the result. But her story, the messy, ambiguous, protective truth of it, lived only inside her head, rendered unintelligible by the very process designed to make her heard. The silence around her wasn't peace; it was the sound of her own experience, meticulously erased and replaced.

  ---

  **Analysis: Beyond Vocabulary and Credibility**

  This case highlights a dimension epistemic injustice often overlooks: **narrative dispossession**. While Fricker focuses on *hermeneutical injustice* (lacking shared concepts) and *testimonial injustice* (being denied credibility), Maya suffers neither. The system *provides* vocabulary and *grants* credibility. The harm lies in the **severing of her agency over her own experience**. Her story is taken, altered – even "improved" – and returned as an official artifact she no longer recognizes or controls. The system, designed to remedy hermeneutical lack, enacts a new form of epistemic violence: the **co-opting and reshaping of personal testimony into institutional narrative**. The "good result" (Liam's punishment) validates the system's process, masking the harm of having one's lived reality rewritten for bureaucratic consumption. The injustice isn't being unheard; it's being *re-spoken* against one's will.

  **Counterargument: Not a Distinct Injustice?**
  One could argue this *isn't* distinct, merely a complex manifestation of existing injustices. The system's "clarification" could be seen as an extreme form of **hermeneutical marginalization** – prioritizing institutional interpretations over the speaker's own framing. Alternatively, forcing Maya to accept the altered narrative as her own could constitute **testimonial smothering**, where she suppresses her true account to conform to the credible, system-approved version. The harm, while unique in its mechanism, might ultimately stem from the same root: power imbalances determining whose interpretation and framing of experience is granted authority.
