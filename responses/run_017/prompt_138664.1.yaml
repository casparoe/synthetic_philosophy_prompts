prompt: |-
  I should say at the outset that I am neither a theologian nor a historian. I spent a little over thirty years as a stratigrapher, much of it reconstructing depositional histories from sections in which most of the record was missing and the remainder had been reworked by later processes. That, I think, is why I have become interested less in what is currently said about the historical Jesus than in how anyone claims to know it. Through a reading group at my parish I have gathered that the field no longer supposes it can simply authenticate individual sayings, and instead applies a set of criteria — embarrassment, dissimilarity, multiple attestation, Semitic idiom and Palestinian context, and coherence with whatever has already been established — to a tradition that everyone agrees is confessional in origin.

  Before I read any further I want the specification. Please write the desiderata that any criterion of authenticity would have to satisfy in order to count as evidence about Jesus at all, with the case or consideration behind each requirement, and with a view on which requirements are non-negotiable and which are merely the preferences of one camp. In my own subject a method was never taken seriously until it had been run against material whose answer was known independently, so please say what the calibration set is supposed to be here: is there any body of material in the tradition whose status we can check without using the criteria themselves, and if there is not, is that a defect in the criteria or an unavoidable feature of the evidence?

  Three further things bear on the list, and I would like each of them treated as a candidate desideratum rather than as background.

  First, the asymmetry. Embarrassment and dissimilarity look to me like vetoes: they can tell me that a tradition is unlikely to have been invented by the early communities, but I cannot see how they raise the probability that it goes back to Jesus rather than to some other inconvenient source. Please require the list to say whether an adequate criterion must be able to move probability upward against a stated baseline — and if the honest answer is that these criteria only ever fail to lower it, then say what that implies for the strength of the conclusions actually drawn. Relatedly: should a criterion be required to output a graded likelihood rather than a binary verdict, given that the evidence is graded?

  Second, what I have started calling the bootstrap problem. Every criterion appears to be applied against a background model — of what would have embarrassed the early church, of what a first-century Galilean Jew could plausibly have said or done, of which strands of the tradition are genealogically independent of which — and the verdict can apparently be no better than that model. Please state as a desideratum what a criterion must do to avoid merely returning its input, and tell me whether multiple attestation can satisfy it, given that the criteria are being applied to sources that are themselves partly derivative and that the dependence relations are the very thing in dispute. I would also like the list to address whether a criterion is permitted to take as a premise some theory of how the tradition transmitted — that post-Easter faith reshaped the record, or that it did not — or whether it must be able to test that premise.

  Third, please flag any pair of desiderata that cannot be jointly satisfied; that is the part of the specification I most want. The obvious candidate is this: on the one hand a criterion should not authenticate anything continuous with early Christian belief or with first-century Judaism, since on this material continuity is what invention looks like; on the other hand the Jesus recovered by the criteria ought to be someone who could account for the movement that followed him and who is intelligible as a Jew of his place and time. If a Jesus discontinuous with both is not available, then one of those two requirements has to be surrendered, and I want you to say which one and at what cost.

  Two more constraints on the answer. Please say how the list would change if the purpose shifted — I have been assuming the purpose is to say of some small set of traditions that they go back to Jesus, rather than to the communities, but others in my group want a minimal factual biography and one wants only an explanation of how the movement arose, and I suspect each purpose generates a different list. And please mark which requirements are genuine desiderata and which are confessional or anti-confessional prejudices in disguise: in particular, whether neutrality about the truth of the tradition is something a criterion must have, or whether requiring it simply stacks the deck.

  Finally, on the register of the answer. Do not give me a survey of the options. Rank the desiderata by how much they exclude, identify the one that the current set of criteria most flagrantly violates, and commit yourself on the general question of what these criteria are — genuine tests, defeasible reasons to doubt, or codifications of scholarly judgment dressed as method — with your reasons, and with a note on what would change your mind. Where you are making a judgment call rather than reporting something agreed, say so, and say how confident you are.
reasoning: |-
  Okay, the user is asking for a detailed specification of desiderata for criteria of authenticity in historical Jesus studies. They've outlined several key concerns: the asymmetry of criteria like embarrassment and dissimilarity, the bootstrap problem where criteria rely on background models, and potential conflicts between desiderata. They also want to know how purpose affects the list and want any hidden biases flagged.

  I need to approach this systematically. The user comes from a stratigraphy background, so they're used to working with fragmented evidence and methodological rigor. Their analogy to geological methods is helpful - they want to know how historians "calibrate" their tools when there's no known sample to test against. That's actually the core epistemological challenge here.

  The asymmetry problem is significant. Criteria like embarrassment can only tell us what early Christians *didn't* invent, not what Jesus actually said. This creates a negative corpus rather than positive evidence. I should emphasize that most criteria are exclusionary tools, not confirmatory ones. The bootstrap issue is equally serious - we're using criteria that depend on models of Christian origins that themselves need verification. It's circular.

  The conflict they identify is crucial: we want a Jesus discontinuous enough from Judaism and early Christianity to be "authentic," but continuous enough to explain Christian origins. This tension can't be fully resolved - we'll have to sacrifice either discontinuity (making detection harder) or continuity (making historical plausibility weaker). The discontinuity requirement is the one that usually gets sacrificed in practice because it's methodologically unsustainable.

  For calibration, there's no true control set. The best we can do is relative checks like seeing if criteria produce a coherent picture, but that's not real calibration. The user should know this is an unavoidable limitation of the evidence, not just defective methods.

  When considering different purposes (minimal facts vs. movement origins), the desiderata shift significantly. For origins, we need criteria that identify consequential actions rather than just authentic sayings. And yes, the neutrality requirement is tricky - insisting on it might exclude authentic material that aligns with later faith, but not insisting risks confirmation bias. There's no perfect solution.

  I'll need to be transparent about where I'm making judgment calls versus reporting consensus. The user clearly wants honest assessment, not just textbook answers. They'll appreciate knowing that the criteria are more like codified scholarly judgment than scientific tests. The confidence levels I assign should reflect the actual uncertainty in the field.

  Most importantly, I need to identify which desideratum current criteria violate most flagrantly. That's clearly the non-circularity requirement - the criteria constantly rely on the models they're supposed to test. Multiple attestation is particularly problematic here since source dependence is contested. This isn't just a minor flaw; it strikes at the heart of the enterprise.

  The user's stratigraphy background gives them a unique perspective on historical reconstruction. I should acknowledge that while drawing the key distinctions between geological and historical methods - particularly the role of intentionality in human traditions versus natural processes. Their "reworked by later processes" analogy is apt, but human reinterpretation is more purposive than sediment reworking.
answer: |-
  Based on your rigorous framework drawn from stratigraphy and epistemological concerns, here is the specification of desiderata for criteria of authenticity in historical Jesus studies, addressing your core questions and constraints:

  ### Core Desiderata for Any Criterion of Authenticity
  **(Ranked by Exclusivity & Severity of Violation in Current Practice)**

  1.  **Non-Circularity / Avoidance of Bootstrapping (Most Excluding, Most Flagrantly Violated):**
      *   **Requirement:** The criterion must not presuppose the very historical model, source relationships, or tradition-history it is meant to test. Its application must be independent of contested reconstructions of early Christian development.
      *   **Case/Consideration:** If the criterion relies on a specific model of tradition transmission (e.g., "post-Easter faith reshaped everything") or source dependence (e.g., Markan priority and Q), its "verdict" simply reflects that input model. This renders it useless for *testing* the model. Multiple Attestation is the worst offender here, as it *entirely* depends on a prior (and disputed) source-critical model. Coherence is equally circular, as it relies on an "already established" core built using other criteria.
      *   **Non-Negotiable?** Absolutely non-negotiable for genuine evidence. Failure here means the criterion is not independent evidence but a restatement of prior assumptions.
      *   **Calibration Set Implication:** The lack of an independent calibration set *exacerbates* this problem but does not *excuse* it. Circularity is a fatal methodological flaw regardless.

  2.  **Directional Specificity (Asymmetry Resolution):**
      *   **Requirement:** A criterion must demonstrably increase the probability that a tradition originates with Jesus *specifically*, not merely decrease the probability it originated with the *early Church*. It must push probability *upwards* against a defined baseline (e.g., the prior probability based on genre, general historical likelihood).
      *   **Case/Consideration:** Embarrassment and Dissimilarity (especially "double dissimilarity") primarily function as *vetoes*. They can lower the probability a saying/event was *invented by the early Church*, but they do not inherently raise the probability it came *from Jesus* (vs. a pre-Christian source, misunderstanding, rival group, or accident). They only clear a *hurdle*.
      *   **Non-Negotiable?** Highly desirable for positive evidence, but potentially negotiable if criteria are *only* framed as negative filters (acknowledging severe limits on conclusions). Current criteria often *pretend* to offer positive evidence while violating this.
      *   **Graded Output:** Essential. Evidence *is* graded (source quality, attestation strength). Binary verdicts (authentic/inauthentic) oversimplify and mask uncertainty. Criteria should output likelihood estimates (e.g., low/medium/high confidence).

  3.  **Resolvable Tension (Addressing the Core Conflict):**
      *   **Requirement:** The criterion, and the cumulative application of criteria, must produce a figure who is simultaneously:
          a.  Detectably distinct from mainstream 1st-century Palestinian Judaism and subsequent early Christian belief/practice (to avoid detecting invention).
          b.  Plausibly situated within 1st-century Palestinian Judaism.
          c.  Able to credibly account for the emergence of the specific early Christian movement.
      *   **Case/Consideration:** The core conflict you identified is fundamental. Strict Double Dissimilarity (rejecting anything Jewish *or* Christian) produces a "Jesus" who is implausible and causally inert. The requirement for discontinuity (a) must be *relaxed*.
      *   **Resolution (Judgment Call - High Confidence):** Requirement (a) must be surrendered *as an absolute veto*. Discontinuity from *later developed Christian doctrine/practice* (modified Embarrassment/Modified Dissimilarity) remains useful. However, discontinuity from *Judaism* cannot be a requirement for authenticity. The *cost* is that detecting invention becomes harder where Jesus aligns with Jewish context. The *gain* is a plausible, historically-situated figure who *can* explain Christian origins. The emphasis shifts to coherence *within* a plausible 1st-century Jewish framework.

  4.  **Model Independence (Closely related to Non-Circularity):**
      *   **Requirement:** The criterion must not depend for its operation on accepting a specific, contested theory of tradition transmission (e.g., radical discontinuity post-Easter vs. essential continuity) or community Sitz im Leben (e.g., all conflict stories *must* reflect later church-synagogue debates).
      *   **Case/Consideration:** Many criteria (e.g., interpreting "embarrassment" or "community formation") implicitly assume a model of how tradition developed. The criterion should ideally be able to *test* such models, not require them as premises.
      *   **Non-Negotiable?** Closely tied to Non-Circularity. A criterion violating this is unlikely to provide independent evidence.
      *   **Bootstrap Problem:** Directly addresses this. Multiple Attestation fails spectacularly here due to source dependence disputes. Coherence fails if the "established core" relies on model-dependent criteria.

  5.  **Contextual Plausibility (Minimal Baseline):**
      *   **Requirement:** The tradition must be intelligible within the language (Semitic idiom), culture, geography, and historical realities of 1st-century Palestine. Absence of anachronisms is necessary.
      *   **Case/Consideration:** A basic sanity check. While not sufficient for authenticity (invention within context is possible), violation strongly indicates inauthenticity or significant development.
      *   **Non-Negotiable?** Effectively non-negotiable as a *negative* criterion (filters out the impossible). Its positive use (Semitic idiom as proof) is weaker and often derivative.
      *   **Calibration Set Implication:** While no "known authentic" set exists, gross violations of context (e.g., Jesus discussing medieval theology) are universally rejected, suggesting this has *some* implicit grounding in general historical knowledge.

  6.  **Neutrality Regarding Truth (Anti-Prejudice Filter):**
      *   **Requirement:** The criterion's operation must be logically independent of the theological truth or falsehood of the tradition. It must function based on historical reasoning applicable to any figure.
      *   **Case/Consideration:** Prevents stacking the deck *for* (confessional) or *against* (anti-confessional) the tradition. E.g., rejecting miracles *a priori* is anti-confessional prejudice; accepting them based solely on faith is confessional.
      *   **Non-Negotiable?** Non-negotiable for *methodological* neutrality. However, *requiring* neutrality *does* inherently exclude theological affirmations as historical evidence. This is necessary for a secular historical method but acknowledges a limit – it cannot adjudicate theological claims, only historical probability based on evidence treated neutrally.
      *   **Prejudice in Disguise?** Insisting on neutrality *is* a methodological commitment of secular history, not a hidden prejudice. *Failing* to insist on it allows confessional/anti-confessional biases to masquerade as history.

  ### Impact of Purpose on Desiderata
  *   **Reconstructing Specific Jesus Traditions (Your Focus):** Requires strongest emphasis on **Non-Circularity**, **Directional Specificity**, and **Graded Output**. Contextual Plausibility is a necessary gatekeeper. Resolvable Tension is crucial for plausibility.
  *   **Constructing a Minimal Factual Biography:** Shifts weight towards **Contextual Plausibility** and actions/events passing multiple criteria (especially **Embarrassment** for actions like crucifixion, **Multiple Attestation** - though flawed). **Resolvable Tension** becomes paramount to ensure the figure is coherent and plausible. Directional Specificity remains important but absolute certainty on specifics is less critical than establishing a core narrative framework.
  *   **Explaining the Movement's Origin:** Prioritizes **Resolvable Tension** above all else. What *consequential* actions or teachings (regardless of precise wording) would plausibly lead to *this* movement? **Embarrassment** gains importance for foundational but awkward events (baptism, crucifixion). **Non-Circularity** is still vital, but the focus is on impact rather than verbatim authenticity. Contextual Plausibility remains essential.

  ### Nature of Current Criteria (Judgment Call - High Confidence)
  Current criteria are primarily **codifications of scholarly judgment dressed as method**, often functioning as **defeasible reasons to doubt (or tentatively accept) the *early Church's invention*** of a tradition, rather than genuine tests establishing authenticity.

  *   **Reasons:**
      1.  **Violation of Core Desiderata:** They fail catastrophically on **Non-Circularity** and **Directional Specificity**. Their results are often predetermined by the background models (source criticism, tradition-history) they presuppose.
      2.  **Lack of Calibration:** There is no independent "known authentic" set for calibration. Conclusions rest on internal coherence and plausibility arguments derived from the criteria themselves and the assumed models.
      3.  **Graded Evidence, Binary Pretense:** The evidence is graded, but criteria are often applied to yield overly simplistic "authentic/inauthentic" verdicts, masking uncertainty and complexity.
      4.  **Susceptibility to Bias:** Despite the ideal of neutrality, application is inevitably influenced by scholarly presuppositions about Judaism, early Christianity, and the possibility of the extraordinary.

  *   **What Would Change My Mind?** Development of criteria demonstrably independent of contested source/tradition models *and* capable of positively identifying material with high directional specificity towards Jesus, validated against a body of material whose status is established through radically different means (e.g., new archaeological/textual discoveries providing unequivocal, independent context for specific Jesus traditions).

  ### Summary of Key Violations & Conclusion
  *   **Most Flagrant Violation:** **Non-Circularity / Bootstrap Problem.** Criteria like Multiple Attestation and Coherence are entirely dependent on the contested models they purport to test.
  *   **Critical Tension Resolution:** The requirement for discontinuity from **Judaism** must be surrendered to achieve a plausible, historically-situated Jesus capable of explaining Christian origins. The cost is reduced ability to detect invention where Jesus aligns with his Jewish context.
  *   **Core Function:** Current criteria are best understood as tools for identifying material the *early Church likely did not invent*, providing defeasible reasons for *potential* authenticity, but falling far short of being genuine tests establishing it. They systematize scholarly intuition within accepted models, not independent historical evidence.
