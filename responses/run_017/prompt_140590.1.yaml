prompt: |-
  I need a consistency note for my university's Committee on Nonhuman Subjects, and I would rather it were drafted by someone with no stake in the outcome, because I have a large one: the application now before the committee is mine.

  Our chair, who wrote or shaped every decision the committee has issued, retired in June. She described herself as a Nozickian and summed her position up as follows: animals belong in the felicific calculus and nothing more, whereas persons are protected by moral side constraints and may not be used as mere means however good the consequences. Her precedents are these:

  1. 2019/14 — routine culling (maceration) of day-old male layer chicks: approved. The birds' pain must be minimised, but no constraint bars the practice.
  2. 2020/07 — a terminal hypoxia study on six chimpanzees, anaesthetised throughout, expected to yield a therapy benefiting thousands of children: approved, 4–1. The apes' suffering weighs in the balance; nothing vetoes it.
  3. 2021/03 — cerebral organoids grown from donated human cells, showing organised electrophysiological responses to noxious stimuli, to be subjected to a painful stimulation protocol and then destroyed: approved.
  4. 2022/11 — inclusion of adults with advanced dementia (no language, no prospective memory, no capacity to refuse) in a phase I study involving repeated painful procedures and no prospect of benefit, with proxy consent given by family: rejected, on the ground that no balance of burdens and benefits could license it.

  The new case, 2024/09, is my application to study language acquisition longitudinally in eight chimpanzees from an enhanced line — a germline construct introduced before birth, as a result of which they develop within the human range on executive function, episodic future thinking and symbolic communication; unedited, they would develop as ordinary chimpanzees. The study involves fourteen months of repeated sedation, cerebrospinal fluid sampling, and one scheduled six-week period of social isolation. There is no prospect of benefit to the subjects and a large expected epistemic gain. They can be asked, in the relevant sense, and can refuse; the protocol does not ask them. The line was created at a partner institute abroad, so we have never ruled on whether such animals should exist — only now on how they may be used.

  My instinct is that we must refuse, but I drafted the protocol, so I am the worst judge of it.

  What I want from you is a short memo, in 550 words or fewer and in British English: (1) the rules that fit our four precedents equally well — I can think of three, one of which protects these animals and two of which do not, but there may be a better one, perhaps turning on whether a being could in principle be asked and could refuse; (2) the decision you recommend as the one our own precedents commit us to, with your reasons and the closest analog among the four; (3) the principle we would be adopting whichever way we went; and (4) the single further case we should force ourselves to decide, in the written reasons, in order to separate the surviving rules.
reasoning: |-
  Okay, the user is asking me to draft a consistency note for their university's Committee on Nonhuman Subjects. They've provided four precedents from previous committee decisions and need help analyzing them to determine how their new application should be handled. The user has a conflict of interest since it's their own application.

  Looking at the precedents, I can see a clear pattern emerging. The former chair followed a Nozickian framework where animals could be used if the benefits outweighed the suffering, but persons had absolute protection. This explains why the male chicks and chimpanzees were approved despite suffering, and why dementia patients were rejected despite potential benefits. The organoid case seems consistent since they weren't considered persons.

  For the new case involving enhanced chimpanzees, the key question is whether they qualify as persons under this framework. They have human-like cognitive abilities including symbolic communication, executive function, and episodic future thinking. Crucially, they can be asked for consent and could refuse - though the protocol doesn't ask them. This seems to push them into the "person" category based on the precedents.

  I think the committee should reject this application based on consistency with precedent 2022/11 (the dementia case). Both involve beings capable of refusal who aren't asked, with no benefit to them. The principle being adopted would be that beings with certain cognitive capacities (like refusal capability) are protected by side constraints.

  To clarify the rule, I suggest the committee consider a hypothetical case involving human children with similar cognitive abilities as these enhanced chimpanzees. If they would protect the children, they should protect the chimpanzees. This would help separate the surviving rules about what constitutes "personhood" under their framework.

  I'll draft a concise memo in British English under 550 words covering all four requested points, focusing on consistency with established precedents while acknowledging the ethical tensions in applying a Nozickian framework to enhanced beings.
answer: |-
  **MEMORANDUM**  
  **To:** Committee on Nonhuman Subjects  
  **From:** Independent Analyst (Consistency Review)  
  **Date:** 23 October 2023  
  **Re:** Consistency Analysis for Case 2024/09 (Enhanced Chimpanzee Study)  

  **1. Rules Fitting Precedents Equally Well:**  
  The precedents collectively establish a rule based on **moral status derived from cognitive capacity for "refusal"**:  
  *   **Rule:** *Beings possessing the cognitive capacity to potentially comprehend and refuse participation in research (in a relevant sense) are protected by moral side constraints. They cannot be used as mere means, irrespective of consequentialist benefit. Beings lacking this capacity are included only in the felicific calculus; their use is permissible if net benefit outweighs suffering, provided suffering is minimised.*  
  This rule fits all precedents:  
  *   **2019/14 (Chicks):** No capacity for refusal. Approved under calculus.  
  *   **2020/07 (Chimpanzees):** Presumed insufficient capacity for refusal in the relevant sense. Approved under calculus (despite dissent).  
  *   **2021/03 (Organoids):** No capacity for refusal. Approved under calculus.  
  *   **2022/11 (Dementia Patients):** Preserved capacity for experiential suffering, but *crucially*, they possess the inherent status of beings who *could have* refused (or consented) prior to incapacity. The side constraint persists, vetoing use as mere means.  

  Alternative rules (e.g., species membership, pain severity alone, potential future capacity) fail to explain the rejection of the dementia case while approving the chimpanzee hypoxia study.

  **2. Recommended Decision & Reasoning (Based on Precedents):**  
  The Committee **must refuse** application 2024/09.  
  *   **Reasoning:** The enhanced chimpanzees possess the cognitive capacities (executive function, episodic future thinking, symbolic communication) that establish the *capacity for refusal in the relevant sense*, akin to the dementia patients in 2022/11. Precedent 2022/11 establishes that possessing this status (even if the *current ability* to exercise it is impaired, as in dementia) invokes a moral side constraint. This constraint prohibits using them as mere means for epistemic gain, regardless of suffering minimisation or the magnitude of potential benefit. The protocol explicitly avoids asking them, acknowledging their capacity while circumventing it. This is directly analogous to the justification for rejecting the dementia study (2022/11), where proxy consent could not override the side constraint protecting beings of that status. Precedent 2020/07 (ordinary chimpanzees) is distinguished by the subjects' presumed lack of the requisite cognitive capacity for refusal.

  **3. Principle Adopted Whichever Way:**  
  By deciding case 2024/09, the Committee necessarily adopts a principle defining the **threshold cognitive capacities sufficient to confer "personhood" status and thus inviolable protection via moral side constraints.**  
  *   **If Approved:** The principle implies that *even enhanced cognitive capacities within the human range (symbolic communication, future thinking, refusal capacity) are insufficient to confer personhood status on non-human beings.* Protection remains contingent on species.  
  *   **If Refused (as recommended):** The principle affirms that *cognitive capacities enabling comprehension and refusal (even if not human-like in all respects, but demonstrably present) are sufficient to confer personhood status and side constraint protection, irrespective of species.*

  **4. Critical Further Case to Specify:**  
  To definitively separate the surviving interpretations of the rule (particularly if refusal is recommended), the written reasons **must explicitly address** the following hypothetical:  
  *   **"Would the Committee approve a protocol identical to 2024/09 if conducted on human children possessing cognitive capacities identical to those of the enhanced chimpanzees (e.g., due to a neurodevelopmental condition), where proxy consent is obtained but the children themselves are not asked?"**  
      *   **Purpose:** This directly tests whether protection hinges *solely* on the cognitive capacities enabling refusal (requiring a 'no' answer for consistency with refusing 2024/09 and 2022/11) or on species membership (allowing a 'yes' answer). A 'no' confirms the rule based on cognitive capacity for refusal as the defining criterion for side constraints. A 'yes' reveals an unstated species-based side constraint overriding cognitive capacity.

  **Conclusion:** Precedent, particularly 2022/11, commits the Committee to refusing application 2024/09 based on the enhanced chimpanzees' capacity for refusal, invoking a moral side constraint against their instrumental use. The decision will crystallise the Committee's stance on the cognitive threshold for personhood. Addressing the human child hypothetical is essential to clarify the rule's foundation.
