  Looking at their principle: (a) runs S's patterns, (b) transmitted from S, (c) actively run and functionally integrated. This seems generally solid but has tension between cases 1 and 7. In case 1, they see one person despite split-brain, while in case 7 they see a distributed person across twelve brains. The key difference might be functional integration. For the split-brain patient, even with divided hemispheres, there might be underlying neural integration that maintains a single self-model, whereas the twelve people are discrete entities with separate self-models that only temporarily integrate.

