prompt: |-
  Hi — I'm the staff person for a city historical marker commission, and I could use some help turning something into a checklist.

  Quick setup: we maintain about 140 markers and plaques around town — buildings, a couple of statues, a demolished neighborhood, a splashy one about the 1898 water filtration plant. We revise maybe 20–25 a year. Committee of five, appointed by the city council, two of them think any edit is "erasing history," one is a retired high school civics teacher, none of them have history degrees. I don't either. We meet two hours twice a month, so realistically ten minutes per marker, and every revision has to survive a council vote where someone will always ask "why are you changing it." Markers have to come in under about 90 words and be readable by a twelve-year-old standing on a sidewalk.

  The problem: almost all of these were written in the 1920s–70s in this voice that assumes the town has been climbing a ladder and we're standing on the top rung. Words like "finally," "at last," "brought the city into the modern era," "paved the way for," "a pioneer who." I've read enough to know this has a name — historians call it Whig history, writing the past as a march toward us — and that it's a trap you can fall into in both directions (there's a version where every marker says things used to be better and everything since is a fall). But I can't hand the committee an essay about teleology. I need a procedure.

  So: give me a decision procedure I can actually run out loud, in order, on a draft marker. For each step, what question do I ask, what counts as a good enough answer, where does the procedure just stop and say "this line has to go," and where does it throw up its hands and say "this is a values call, committee votes." I especially need it to distinguish three things I keep getting tangled: (a) sentences that claim something genuinely got better, which is often just true and checkable, (b) sentences that claim we have *arrived* — that the present is the point the story was heading for, and (c) sentences that quietly make people in the past look foolish for not already knowing where things were headed. And whatever you build has to not collapse into "delete every evaluative word," because then every plaque reads "in 1898 the city built a plant" and the council stops funding us and nobody stops to read them. I'd rather the procedure name that failure mode and have a guard against it than pretend it can't happen.

  Two tests I've been using by instinct, tell me if they're junk or how to fix them. One: the 1975 test — would a sentence in exactly this tone, written in whatever year the marker was put up about that year's settled assumptions, now make us wince? Two: the losers' bet — could a sensible, well-informed person at the time have bet against this outcome without being stupid or wicked? If the marker implies no, it's doing the thing I'm trying to avoid.

  Then please run the whole thing on three real drafts, and don't go easy on me:

  One. The water plant: "For years the city drank its own filth. At last, in 1898, science and civic pride prevailed, and Cedar Heights joined the modern world." (I think this one's easy but I want to see what survives — the typhoid numbers are real and I don't want a procedure that can't say so.)

  Two. The one I'm attached to, about Dr. Alice Renner, the first woman licensed to practice here: "Dr. Renner broke through the barriers of her day and opened the door for every woman who followed." I like this marker. I suspect your procedure is going to make me cut most of it, and I know the historical society that paid for it will be furious. If that's what it says, say so plainly, and give me the one or two sentences I can read out to the committee that aren't theory-speak.

  Three. A proposed marker for Brightmoor, the Black neighborhood bulldozed for a highway in 1961: something like "Brightmoor was a place where families thrived, until the city destroyed it and built a road." I worry this is the same mistake with the sign flipped, but I also don't want to end up with nothing to say about it.

  Last thing: tell me what the procedure can't do. Which markers are just unfixable in ninety words, which ones are really a fight about what the town wants to be rather than about the past, and where ten minutes isn't enough and we should just defer. And could you write it as continuous prose — no headings, no bullets, no bold, no tables, just an email-length explanation I can read on my phone before a meeting. Thanks.
reasoning: |-
  Okay, the user is a staff member for a city historical marker commission. They need a practical checklist to revise old markers that use outdated "Whig history" language—making the past seem like it was inevitably progressing toward the present. The committee isn't made of historians, meetings are short, and revisions must survive city council scrutiny. 

  First, I need to unpack their core struggles: 
  They’re juggling three subtle problems—(a) factual improvements (like reduced disease), (b) teleological claims ("arrived at modernity"), and (c) condescension toward past people. Their instinct tests (1975 test and losers’ bet) are smart but need formalizing. The examples they provided (water plant, Dr. Renner, Brightmoor) are perfect test cases to ground the procedure.

  The user’s hidden tensions are revealing: 
  They’re emotionally attached to the Dr. Renner marker but suspect it’s problematic. They’re also wary of council pushback if markers become too bland. Underneath the practical ask, they’re negotiating how to honor truth without triumphalism—especially for painful histories like Brightmoor’s demolition.

  For the procedure, I’ll structure it as a linear flow: 
  Start with identifying "progress language" (words like "at last"), then distinguish between provable facts and teleology. The key is step 3—forcing a pause on claims implying historical inevitability. For condescension, the losers’ bet test works well. Crucially, I’ll include an "escape hatch" for committee votes when values clash, and a "vitality check" to prevent blandness.

  Testing on their examples: 
  - The water plant’s typhoid drop is provable, but "joined the modern world" is teleological junk. Easy fix. 
  - Dr. Renner’s "broke barriers" is tricky—it’s both true and teleological. I’ll suggest reframing to her actions, not her symbolic weight. 
  - Brightmoor’s draft risks presentism ("thrived until destroyed") but the injustice is factual. Solution: state demolition as a policy choice, not an endpoint.

  Hard truths upfront: 
  Some markers can’t be fixed in 90 words. If a topic requires nuance (e.g., "was demolition racist?"), defer. And when markers become proxies for current political fights? Flag it early—that’s beyond the procedure’s scope.

  Finally, I’ll write it as requested: no bullets, just prose. Keeping it phone-readable means short paragraphs and concrete examples woven in. The tone should feel like a colleague talking, not a textbook.
answer: |-
  Here's a decision procedure you can run aloud during committee review, designed for speed and clarity. Read it step-by-step for each draft sentence or claim, in order. If a step fails, stop and either edit the sentence or flag it for a vote. Aim for consensus, but don't get bogged down – the "Vote" escape hatch is key.

  **The Procedure:**

  1.  **Identify "Progress Language":** Ask: *"Does this sentence contain words like 'finally,' 'at last,' 'modern,' 'pioneer,' 'broke barriers,' 'opened the door,' 'paved the way,' 'brought us into,' or imply a journey ending at 'us' (the present)?"* If **NO**, move to the next sentence. If **YES**, proceed to Step 2.
  2.  **Check for Verifiable Improvement:** Ask: *"Is the sentence pointing to a specific, documentable improvement in measurable human welfare (like reduced death/disease, increased safety, expanded rights/access) that occurred at that specific time?"* **Good Answer:** "Yes, we have data (death rates, laws changed, access granted) showing X got better then." (e.g., Typhoid rates dropped 70% within a year after the plant). **If YES, KEEP THE FACT**, but proceed to Step 3 to check the *framing*. **If NO** (it's vague or about perceived "progress" like "modernity"), proceed to Step 3.
  3.  **Check for Teleology/"Arrival":** Ask: *"Does the sentence claim or strongly imply that this event *was* the inevitable destination, the 'correct' endpoint the past was aiming for, or that 'we' (the present) are the culmination?"* Apply your "1975 Test": *"If this exact phrasing was used in 1975 to describe something 'settled' then that we now see differently, would it make us cringe?"* (e.g., "At last, urban renewal cleared the blight" written in 1975 looks terrible now). **Good Answer:** Focuses on the *change itself* at the time, not its place in a grand narrative ending now. **If YES** (it claims arrival/inevitability), the sentence likely needs significant rewrite or deletion. Proceed to Step 4 to check for condescension before final action. **If NO**, proceed to Step 4.
  4.  **Check for Condescension:** Ask: *"Does the sentence make people in the past look foolish or morally deficient for *not* having already achieved this outcome or knowing what we know?"* Apply your "Losers' Bet Test": *"Could a reasonable, well-informed person at the time have genuinely disagreed with this course of action or outcome without being stupid or evil?"* **Good Answer:** Acknowledges context, constraints, or legitimate contemporary debates. **If YES** (it implies past people were dumb/backward for not being us), the sentence needs rewrite or deletion. **If NO**, and it passed Step 2 or 3 appropriately, it *might* be okay, but run the Vitality Check (Step 5).
  5.  **Vitality Check (Guard Against Blandness):** Ask: *"If we remove the flagged language, does the sentence still convey *why this matters* in a way that a 12-year-old would find interesting or understandable?"* **Good Answer:** Uses concrete facts, specific outcomes, or clear human terms (struggle, achievement, consequence) to show significance without teleology. **If NO** (it becomes "A plant was built in 1898"), you *must* rebuild it using significant facts or human elements identified in Step 2 or context. **This step prevents the "boring plaque" death spiral.** Don't just delete; replace with substance.
  6.  **Values Call / Committee Vote:** If after these steps there's still disagreement on whether a sentence is acceptable (especially if it passed Step 2 but failed Step 3 or 4, or the rewrite in Step 5 is contentious), or if the significance itself is disputed (e.g., *was* it progress? *was* it destruction?), explicitly state: *"This point involves a judgment about historical significance or interpretation that isn't purely factual. We need a committee vote on whether to keep this phrasing or the proposed rewrite."* **Take the vote and move on.** Don't debate historiography.

  **Running the Tests on Your Drafts:**

  1.  **The Water Plant: "For years the city drank its own filth. At last, in 1898, science and civic pride prevailed, and Cedar Heights joined the modern world."**
      *   **Step 1:** YES ("At last," "prevailed," "joined the modern world").
      *   **Step 2:** YES/NO. Reduced disease (typhoid) is verifiable improvement. "Prevailed" and "modern world" are vague progress concepts.
      *   **Step 3:** YES. "Joined the modern world" is pure teleology/arrival. 1975 Test: A marker in 1975 saying "joined the modern world" by building a mall would make us wince.
      *   **Step 4:** POTENTIALLY. "Drank its own filth" is stark but factual? Losers' Bet: Could reasonable people have opposed the cost/taxes? Probably, but the sentence doesn't mock them *for drinking filth*; it states a grim fact. The condescension is more in the "at last/prevailed/modern" framing implying they were backward.
      *   **Step 5:** Remove teleology: "For years, contaminated water caused disease. In 1898, the new filtration plant opened, dramatically reducing typhoid deaths." **This passes Vitality Check:** Factual, shows significance (disease -> reduced deaths).
      *   **Outcome:** Rewrite essential. Keep the *fact* of improvement (Step 2 YES), ditch the framing (Step 3/4). The rewrite works.

  2.  **Dr. Alice Renner: "Dr. Renner broke through the barriers of her day and opened the door for every woman who followed."**
      *   **Step 1:** YES ("broke through barriers," "opened the door").
      *   **Step 2:** YES/NO. Her licensure is a verifiable fact expanding access/rights for *her*. "Opened the door for every woman" is an assertion of influence/legacy.
      *   **Step 3:** YES. "Opened the door for every woman who followed" implies her action *was* the key turning point and the *start* of an inevitable path to present equality (teleology/arrival). 1975 Test: A 1975 marker saying a male CEO "opened the door for women in management" would likely make us wince now.
      *   **Step 4:** POTENTIALLY. Does it imply opponents were foolish? Losers' Bet: Could reasonable (though prejudiced) contemporaries have believed women shouldn't be doctors without being cartoon villains? Yes. The phrasing doesn't *actively* mock them, but the triumphalism oversimplifies the struggle.
      *   **Step 5:** Remove teleology: Focus on *her* action and *its immediate context*. "In 1893, Dr. Alice Renner became Cedar Heights' first licensed woman physician, overcoming significant opposition." **Vitality Check Passes?** Still significant. Shows struggle/achievement. Is it *as* inspiring? Maybe not, but it's accurate and avoids the trap. "Inspired later generations" is safer than "opened the door for every."
      *   **Outcome:** Rewrite needed. The core fact (first licensed woman, overcoming opposition) is strong. The legacy claim ("opened the door") is the problem. **What to tell the committee/historical society:** "We can absolutely celebrate Dr. Renner's groundbreaking achievement and her courage facing opposition. The phrase 'opened the door for every woman' unintentionally suggests the fight was won in 1893, which wasn't the case, and overshadows the efforts of those who came after her. Focusing on *her* specific milestone and the barriers *she* faced makes her story clearer and more powerful within the word limit."

  3.  **Brightmoor: "Brightmoor was a place where families thrived, until the city destroyed it and built a road."**
      *   **Step 1:** Implied YES ("thrived... until destroyed" implies a fall from a good past, the inverse teleology).
      *   **Step 2:** NO. While families lived there, "thrived" is subjective. "Destroyed" and "built a road" are factual events.
      *   **Step 3:** YES. "Until destroyed" implies the demolition is the endpoint of the story, the conclusion of decline. It risks presentism by judging the past *only* by its destruction. 1975 Test: A marker from 1962 saying "the thriving community was cleared for progress" would make us wince *differently*.
      *   **Step 4:** NO. Doesn't mock past residents.
      *   **Step 5:** Remove inverse teleology: State the facts and the consequence clearly. "Brightmoor, a predominantly Black neighborhood, was home to families and businesses for decades. In 1961, the city demolished hundreds of homes and displaced residents to build the Northern Parkway." **Vitality Check Passes?** Yes. Conveys loss and action. Shows significance (home/businesses -> demolished/displaced). Avoids the "golden past / fallen present" trap by stating facts.

  **What the Procedure Can't Do (Be Brutally Honest Here):**

  1.  **Resolve Fundamental Disagreements About Significance:** If the committee fundamentally disagrees on whether an event *was* progress or destruction (e.g., "Was demolishing those 'blighted' buildings actually good?"), the procedure can flag it for a vote (Step 6), but it can't make the values conflict disappear. Ten minutes isn't enough for that debate.
  2.  **Fix Unfixable Markers in 90 Words:** Some stories are too complex. A marker solely about systemic racism leading to demolition *requires* nuance you can't achieve in 90 words without oversimplifying into a different trap. The procedure might conclude: "This requires more context than 90 words allows. We need to significantly reduce scope or defer."
  3.  **Handle "What the Town Wants to Be" Fights:** Markers often become proxies for current identity. A marker about a contested figure or event (e.g., a Confederate statue removed, a labor strike) might get stuck at Step 6 constantly. The procedure can't resolve whether the town wants to celebrate its industrial past or its labor movement. It can only say: "This is a values judgment about current commemoration, not just historical fact. Committee/Council must decide based on community values *today*."
  4.  **Create Compelling Narrative Alone:** Step 5 (Vitality Check) forces you to *try*, but crafting evocative, accurate, *and* neutral prose under constraint is hard. The procedure flags blandness but doesn't write the solution.
  5.  **Provide Definitive Historical Interpretation:** It catches obvious teleology and condescension, but subtle historical debates (e.g., *how much* did Renner *really* influence later women doctors?) remain. The procedure helps avoid the worst pitfalls, not achieve perfect nuance.

  **In Practice:** Start each marker review by quickly reading the draft. Then go sentence-by-sentence, running the steps. Be the facilitator: "Sentence 1: 'For years the city drank its own filth.' Step 1? No progress language? Okay. Step 2? States a problem, not improvement? Okay. Step 3? Not teleology. Step 4? Not condescending? Seems factual, keep? [Nods]. Sentence 2: 'At last, in 1898...' Step 1? YES. Step 2? Typhoid drop is verifiable, but 'prevailed' and 'modern world' aren't. Step 3? YES, 'joined modern world' is teleology. Step 4? The framing implies past was backward. Step 5: Let's rewrite to '...the new filtration plant opened, dramatically reducing typhoid deaths.' Better? Okay." Move briskly. Use "Vote" liberally when consensus stalls. Good luck!
