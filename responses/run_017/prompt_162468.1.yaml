  Your intuitions align well with a three-valued logic approach (true, false, neither), using a recursive evaluation that bottoms out in non-semantic facts. Below, I formalize this into a coherent principle, test it against your cases, identify which verdicts must be revised, and address the additional cases. The key is handling circularity and grounding truth values in non-semantic facts.

  ### Formalized Principle
  A sentence has a truth value (true or false) if and only if:
  1. **Grounding**: All semantic predicates (e.g., "is true") in the sentence can be fully evaluated by recursively deferring to non-semantic facts (e.g., "snow is white").
  2. **Non-Grounding**: If evaluation encounters circularity (direct or mutual self-reference) or infinite regress without grounding in non-semantic facts, the sentence is gappy (neither true nor false).
  3. **Connectives**: Logical connectives (e.g., ¬, ∨) follow Kleene’s strong three-valued logic:
     - **Negation**: ¬φ is true if φ is false; false if φ is true; gappy if φ is gappy.
     - **Disjunction**: φ ∨ ψ is true if either is true; false if both are false; gappy otherwise.
     - Conjunction/other connectives defined analogously.
  4. **Truth Predicate**: "S is true" is:
     - True if S is true.
     - False if S is false.
     - Gappy if S is gappy (no truth value).

  **Evaluation method**: Recursively compute truth values, short-circuiting when possible (e.g., if one disjunct is true, the whole disjunction is true). Break circular dependencies by returning "gappy".

