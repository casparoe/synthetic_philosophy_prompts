prompt: |-
  Consider the following stylized but, I think, recognizable regime of professional accountability. I describe it fully so that nothing needs to be looked up; I am interested in its implicit theory, not in whether any particular jurisdiction matches the description exactly.

  A hospital and the professional regulator that licenses its clinicians operate under roughly these rules:

  1. Review is triggered by outcomes. A file is opened when an adverse-event report is filed. No routine audit of conduct exists. An anaesthetist who leaves the operating theatre for eight minutes to take a personal call, and whose patient suffers a hypoxic injury, is reported, reviewed, sanctioned, sued, and named in the press. A colleague who does exactly the same thing, with exactly the same patient risk profile, and whose patient is unharmed, is never reviewed, because nothing happened.

  2. When the regulator does review, it disclaims outcome-sensitivity. Its written standard is that it judges the clinician's process and not the result, and it will sanction an impaired or reckless practitioner whose patient escaped harm on the same schedule as one whose patient did not. Its operative vocabulary is risk, judgment, and fitness to practise rather than damage caused.

  3. The grading taxonomy is outcome-based. Incidents are sorted by actual severity, with an unreached near miss ranked as a lower-order category than an event in which harm occurred, and the near-miss count is itself a function of whether anyone happened to notice.

  4. Outcome also migrates into the finding of fault itself. After a bad result, the same conduct is retrospectively re-described as careless in a way it would not have been described had nothing happened: reviewers conclude that the clinician should have anticipated a difficulty that, ex ante, there was no particular reason to anticipate. The outcome fixes not only the severity of the sanction but the prior attribution of fault.

  5. The tort system operating alongside all of this requires actual damage for a claim to exist at all, while simultaneously holding a defendant liable for the full unforeseeable extent of the harm once some damage is established.

  6. Finally, some things are punished purely on a process basis with no outcome condition at all — falsifying a record, practising while intoxicated — and these attract sanction regardless of result.

  What I want from you is the implicit theory of responsibility this pattern presupposes.

  Specifically: reconstruct the view of blameworthiness that would make the whole package coherent, and show where the package is instead a settlement between two theories that disagree. Distinguish carefully between what the practice strictly presupposes, what it merely fits well with, and what it is neutral on. In particular, I want you to separate three roles an outcome can play, because I suspect the practice conflates them: outcome as evidence of a prior fault, outcome as a constituent of fault, and outcome as a scalar on the severity of a sanction for a fault already established. Which of these can a control-based view accommodate without conceding that outcomes are partly constitutive of blameworthiness, and which can it not?

  Then say whether the regime is coherent. Is the gap between the outcome-driven trigger and the process-driven standard a contradiction, or does it have a defensible rationale that a pure control principle could endorse? Is the retrospective re-description in point 4 the same phenomenon as the sanctioning differential in point 1, or a different and more damaging one?

  Finally, take the two clean alternatives and tell me what each would have to change in practice: a consistently control-based regime, and a consistently outcome-based one. I expect the interesting problem to be that a control-based reform has to grade conduct by expected harm under the agent's own epistemic situation, and that this baseline is itself infected by circumstances the agent did not choose and could not have known — so that the reform relocates the luck rather than removing it. Tell me whether that objection has real force or whether the ex ante and the ex post versions of luck are relevantly different.

  Argue the case on its own terms. I do not want a survey of the literature, a reading list, or citations; assume I have read the standard arguments and want the analysis of this practice.
reasoning: |-
  Okay, the user presents a detailed professional accountability regime in healthcare and wants an analysis of its implicit theory of responsibility. They specifically ask to reconstruct the view of blameworthiness that makes this system coherent, distinguish between different roles of outcomes, evaluate the regime's coherence, and compare it to two pure alternatives. 

  Hmm, this is a sophisticated philosophical-legal question about moral luck in professional contexts. The user clearly has deep familiarity with the literature (mentioning Nagel and Williams) but wants fresh analysis of this specific institutional design. They're frustrated with how outcome luck permeates what presents as a control-based system.

  First, let's unpack the six features they describe. The system triggers review only after bad outcomes (point 1), claims to judge only conduct (point 2), yet categorizes incidents by actual harm (point 3), retrospectively reinterprets conduct as faulty after bad outcomes (point 4), has tort rules that compound outcome luck (point 5), and has a few pure process violations (point 6). 

  The key tension is between the stated process standard and outcome-driven enforcement. I think the implicit theory is a pragmatic hybrid: it pays lip service to control principle while actually treating outcomes as constitutive of blameworthiness in practice. The retrospective redescription in point 4 is particularly telling - it's not just using outcomes as evidence, but redefining what counts as careless based on results.

  For coherence... well, it's institutionally functional but philosophically messy. The gap between trigger and standard isn't necessarily contradictory - one could argue resources should focus on cases with actual harm - but the taxonomic sorting and retrospective redescription undermine the control principle. Point 4 is more damaging than point 1 because it changes the definition of fault itself.

  Now for the pure alternatives. A truly control-based regime would need routine audits, near-miss investigations, and sanctions based on expected harm given what the clinician reasonably knew. But this runs into the "relocating luck" problem - the clinician's epistemic situation itself depends on unchosen factors like training quality or hospital protocols. Still, this seems better than outcome-luck because it focuses on what the agent could control.

  A pure outcome-based system would be simpler but morally untenable - punishing equally a drunk driver who hits someone versus one who doesn't. The current system already does this covertly through selective enforcement.

  The user's suspicion about conflating outcome roles seems correct. The regime uses outcomes simultaneously as (flawed) evidence of fault, as constituent of fault (through redescription), and as sanction scalar. Only the last is compatible with control principle.

  Ultimately, while the ex ante/ex post luck distinction matters (we judge choices differently before/after outcomes), the proposed control-based reform would be a significant improvement despite residual epistemic luck. The current system's hypocrisy is worse than a transparently imperfect control-based alternative.
answer: |-
  Here is a reconstruction of the implicit theory of responsibility, its coherence, and the alternatives, argued strictly on the described regime's terms:

  ### The Implicit Theory: Pragmatic Hybridism with Outcome-Constitutive Blame
  The regime presupposes that **blameworthiness is fundamentally tied to actual outcomes in practice, despite official adherence to a control-based (process-focused) ideal.** It is a settlement between:
  1.  **An aspirational control principle:** Fault lies in controllable choices (judgment, diligence, competence). Harm is not *morally* necessary for blame (point 2, point 6 sanctions).
  2.  **A pragmatic outcome principle:** Outcomes are *operationally* necessary to trigger scrutiny (point 1, point 3 taxonomy) and *retrospectively redefine the standard of care* (point 4). Outcomes are treated as partly constitutive of the fault itself, not merely evidence or a sanction scalar.

  This hybrid exists because:
  *   **Resource constraints & visibility:** Review requires triggers; bad outcomes provide undeniable triggers and visibility (point 1, point 3 noticing near misses).
  *   **Cognitive bias & hindsight distortion:** Humans struggle to assess choices fairly without knowing the outcome. A bad result makes prior choices appear inherently riskier or more unreasonable than they seemed *ex ante* (point 4).
  *   **Expressive function of sanction:** Sanctions serve not only to correct the individual but to signal societal condemnation for *harm caused* and deter similar *harm*. The severity of the outcome becomes a proxy for the "seriousness" of the transgression, even if the underlying choice was identical (point 1 differential review, point 3 taxonomy, point 5 tort "eggshell skull" rule amplifying liability).
  *   **Tort law's gravitational pull:** The requirement of actual damage (point 5) reinforces the cultural and operational focus on outcomes as the primary locus of "wrong" requiring redress.

  **Distinguishing Outcome's Roles:**
  1.  **Evidence of Prior Fault:** The regime *claims* this is its sole use (point 2). It *can* be accommodated by a control view (bad outcome *might* indicate underlying recklessness).
  2.  **Constituent of Fault:** Point 4 ("retrospective re-description") demonstrates this. The *same conduct* is deemed faulty *only because* of the outcome. The outcome changes the *definition* of reasonable care *ex post*. A pure control view *cannot* accommodate this without contradiction. This is the regime's core incoherence with its stated principle.
  3.  **Scalar for Sanction Severity:** Points 1 (selective review/sanction), 3 (taxonomy), and 5 (full extent of harm) rely heavily on this. A control view *can* accommodate *some* outcome-based scaling (e.g., recklessness with high *expected* harm deserves harsher sanction than recklessness with low expected harm). However, scaling based *solely on actual harm suffered*, irrespective of the *ex ante* expected harm of the identical choice (point 1 colleague vs. colleague), *cannot* be justified by a pure control view. It conflates luck with culpability.

  ### Coherence Assessment: Functional Hypocrisy, Not Rational Coherence
  The regime is **operationally functional but philosophically incoherent.** The gap between outcome-driven trigger (point 1) and the process-driven standard (point 2) is not *inherently* contradictory. One could defensibly argue:
  > *"We judge only conduct (control principle), but limited resources force us to prioritize investigating cases where harm occurred, as they are more likely to reveal underlying faults and demand redress."*

  **However, Points 3 and 4 destroy this defense:**
  *   **Point 3 (Taxonomy):** Ranking incidents by *actual* severity, not the *risk* created by the conduct, directly contradicts judging "risk, judgment, and fitness" (point 2). It judges the *result*, not the *choice*.
  *   **Point 4 (Retrospective Re-description):** This is **fundamentally different and more damaging** than the selective trigger (point 1). The trigger is a pragmatic filter. Point 4 is **epistemic dishonesty:** it rewrites the *standard of care itself* based on the outcome. It pretends the judgment is purely about the prior choice ("should have anticipated") when the judgment is *actually* driven by the outcome. This makes outcomes constitutive of fault, violating the core control principle. Point 1 hides faults; Point 4 manufactures them based on luck.

  ### The Pure Alternatives: Changes and the "Relocated Luck" Problem
  **1. Consistently Control-Based Regime:**
  *   **Changes Required:**
      *   **Routine Audits & Near-Miss Reporting:** Mandatory, randomized audits of conduct/procedures (e.g., scrub-in protocols, documentation, decision logs) regardless of outcome. Robust systems for reporting and investigating near misses (point 3 noticing becomes irrelevant).
      *   **Sanction Based on *Ex Ante* Expected Harm:** Sanctions determined by the *reasonably foreseeable risk* created by the conduct *at the time*, given the clinician's knowledge and situation. Identical reckless acts (e.g., both anaesthetists leaving) receive identical sanctions, regardless of outcome.
      *   **Strict Adherence to *Ex Ante* Standard in Findings:** Fault requires proving the conduct deviated from the reasonable standard *as it existed before the outcome was known*. Reviewers must rigorously avoid hindsight bias (eliminate point 4).
      *   **Tort Reform (Conceptually):** Shift towards negligence based on breach of duty (unreasonable risk creation) alone, perhaps with symbolic damages for near misses exposing recklessness. The "eggshell skull" rule becomes harder to justify strictly.
  *   **The "Relocated Luck" Objection:** Yes, the clinician's "epistemic situation" (knowledge, training, fatigue, hospital protocols) is partly unchosen luck. Judging "expected harm under the agent's own epistemic situation" incorporates this luck. **However, this is relevantly different:**
      *   **Ex Ante Luck vs. Ex Post Luck:** Luck in *circumstances and capacities* shaping the *choice* (ex ante luck) is unavoidable in *any* responsibility system judging choices. Luck in the *consequences* of an *identical choice* (ex post luck) is the specific problem the control principle rejects. A control regime embraces judging the choice *as made*, accepting ex ante luck as the baseline condition of agency. It explicitly rejects ex post luck as a *basis* for differential blame.
      *   **Focus on Control:** The control regime focuses blame precisely on the aspect the agent *could* control: the choice made *given* their situation (even if the situation involved luck). The hybrid regime blames based on an aspect utterly outside control: the specific outcome of that choice.

  **2. Consistently Outcome-Based Regime:**
  *   **Changes Required:**
      *   **Abandon Process Standard:** Explicitly state that blameworthiness requires actual harm (contradict point 2, point 6).
      *   **Sanction Strictly by Harm Caused:** Sanction severity directly proportional to actual harm, irrespective of the *ex ante* riskiness of the conduct (fully embrace point 1 differential, point 3 taxonomy, point 5 tort logic). The anaesthetist whose patient is harmed is heavily sanctioned; the one whose patient isn't, isn't.
      *   **Redefine Fault:** Fault is *causing avoidable harm*. "Should have anticipated" (point 4) becomes the primary mode, but acknowledged as hindsight-driven.
      *   **Eliminate "No-Harm" Sanctions:** Abandon sanctions for intoxicated practice or falsifying records if no harm occurred (contradict point 6).
  *   **Coherence at a Cost:** This regime is coherent but morally untenable on standard notions of fairness and deterrence. It punishes moral luck harshly and fails to address dangerous conduct that luckily avoids harm.

  ### Conclusion
  The described regime's implicit theory is that **outcomes are pragmatically and cognitively necessary to define, discover, and grade blameworthiness in practice, despite a nominal commitment to a control principle.** This creates incoherence, primarily through the retrospective re-description of fault (point 4) and the outcome-based taxonomy (point 3), which treat outcomes as constitutive of blame. While the outcome-based *trigger* (point 1) might be pragmatically justified within a control framework, points 3 and 4 cannot.

  A pure control-based reform, while still subject to the inescapable "ex ante luck" of an agent's circumstances and epistemic limitations, successfully eliminates the more pernicious and arbitrary influence of "ex post luck" (differential outcomes from identical choices). It relocates luck, but to a domain inherent in assessing *any* choice, rather than basing blame on the uncontrollable randomness of consequences. The objection has force in highlighting that judgments will always depend on contingent factors, but it does not undermine the core moral distinction between judging the choice made and judging the lottery of results. The hybrid regime's fundamental dishonesty and conflation of outcome roles make it less coherent and less fair than a transparent, consistently control-based approach, despite the latter's unavoidable grounding in the agent's (luck-influenced) situation.
