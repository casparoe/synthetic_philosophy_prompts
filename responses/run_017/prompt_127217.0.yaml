prompt: |-
  I am a PhD student in political theory, finishing a chapter on the ethics of prioritisation in philanthropy, and I have reached the point where I no longer trust my own verdicts. I can recite the standard critiques of effectiveness-first giving — that it attends to individual donation and career choice while ignoring the institutional and political causes of the harms it treats, that it treats a high income as a mere instrument for producing donations, and that its demand for quantification quietly selects for interventions that can be measured rather than interventions that are best — but when I put concrete cases in front of myself, my reactions do not line up neatly with any of those critiques, and they do not line up neatly with each other either. So I want to do this bottom-up. Below are eight cases and my verdicts on them. Please take the empirical stipulations in each case as given rather than arguing with the numbers; the disagreement I care about is normative.

  1. *Earning to give.* A twenty-five-year-old with no interest in finance takes a job at a commodity trading firm, lives on a third of his salary, and sends the rest to a charity distributing insecticide-treated bednets, chosen because it is the best-supported option by cost per life saved. My verdict: permissible, and probably good, but I resist the claim that it is *admirable in the way its defenders claim*, and I resist the stronger claim that anyone with comparable earning power who does not do this is thereby failing to do something they owe.

  2. *Earning to give, with diffuse harm.* The same person in the same job at a firm whose core business helps to raise staple food prices for the world's poorest. My verdict: not permissible, even granting that his donations more than offset the harm, and even granting that if he had not taken the job someone else would have. This sits badly with case 1, and I cannot say what the difference is supposed to be.

  3. *Institutional action, unmeasurable.* A donor funds a small lobbying shop that will spend three years trying to get a harmful agricultural subsidy repealed. The effort will probably fail. Nobody can estimate its expected value with any precision. If it succeeds, the gain dwarfs anything the same money could do buying bednets. My verdict: not merely permissible but better than the bednet purchase.

  4. *Direct action, unmeasurable.* A donor funds a network of local organisers on the strength of a claim that building civic capacity pays off enormously, backed by a model with no data behind it. My verdict: no — this is rationalising. Structurally, though, 3 and 4 look identical: high variance, unmeasurable, enormous upside. I would like to know what licenses the difference, or else which verdict I should drop.

  5. *The local case.* A woman volunteers at a food bank, knows the staff and the regulars, and gives her charitable budget there rather than to the bednet charity. My verdict: fine, not a failure, and she does not owe anyone a defence. I also do not think the fact that less good would be done if everyone reasoned as she does is a reply to her.

  6. *Vocation.* A mathematician of genuine promise leaves number theory to work on risks from advanced AI, purely on expected-value grounds, with no prior interest in the subject and no particular aptitude for it. My verdict: permissible, but something is lost, and the loss is not only his — I think the effectiveness-first framing cannot register it, and that this is a defect in the framing rather than a sentimentality in me. If instead he stays in number theory and gives thirty per cent of a much smaller income, that is also fine, and I decline to rank the two lives.

  7. *Measurability under two accountability structures.* A government aid agency, answerable to taxpayers and to an auditor, chooses a measurable intervention over an unmeasurable one with higher expected value. My verdict: correct, arguably required. A private foundation with a permanent endowment and no electoral or donor accountability makes the identical choice. My verdict: a failure of nerve, and possibly a way of managing reputation rather than doing good. The expected consequences are the same in both, so whatever distinguishes them is not consequential.

  8. *First dollar and last dollar.* A funder declines to fund the final two million dollars of a well-measured programme, on the ground that another funder will fill the gap, and puts the money into something risky and unproven. My verdict: fine, and shrewd. A funder who declines to fund the *first* two million of the very same programme, on the same ground, is not fine.

  The only thing I have managed to formulate on my own is a two-part conjecture. Call the first part the *agent-substitutability proviso*: effectiveness-first reasoning is in force where the agent is substitutable without loss, so that the value of the outcome does not depend on who brings it about, and it lapses where the outcome is partly constituted by the agent's own involvement, as in relationships, vocations and matters of integrity. Call the second part *replacement symmetry*: if you discount your causal contribution by the probability that someone else would have done the thing anyway, you must apply that same discount to the harms your role produces and to the goods, and not take the discount on the one side only. The conjecture looks to me as though it handles 1, 2, 5 and 6, and I cannot see what it says about 3, 4, 7 or 8.

  What I want from you is a principle, or a small set of competing candidates, stated precisely enough to be argued with, together with an honest account of what it costs me. Please work out the price of saving every verdict against the price of a simpler principle that overturns one or two of them, and say plainly which you would do. Please do not cite anything or point me toward literature; I have the literature, and what I lack is the principle.

  In this order, please give me:

  1. **The principle** — roughly 200 words: a single, precisely stated formulation, with any defined terms defined. If you think no single principle exists and I must choose between two, give both and say what the choice between them turns on.
  2. **Clause by clause** — roughly 400 words: walk through each clause, name the case that motivates it, and show what the principle says about that case.
  3. **Verdicts I lose** — roughly 250 words: which of my eight verdicts the principle cannot keep, which ones you would overturn if you were me, and whether the pair I find hardest to reconcile (3 against 4, and 1 against 2) survives or is dissolved.
  4. **Three cases I have not judged** — roughly 300 words: a graduate student who takes a well-paid job at a company building consumer AI products and gives away half the salary; an endowed foundation funding research whose benefits, if there are any, land two centuries from now; and a donor who abandons the best-supported charities to fund a city-council campaign for a local housing measure. Apply the principle to each, and say where you would need further detail before answering.
  5. **Damage report on my conjecture** — roughly 200 words: what the agent-substitutability proviso and replacement symmetry get right, where they break, and whether either can be repaired or should be discarded.
reasoning: |-
  Hmm, the user is a PhD student in political theory who's struggling with ethical dilemmas in philanthropic prioritization. They've presented eight thought-provoking cases with their intuitive verdicts, and they're clearly frustrated that their theoretical critiques don't align with their concrete judgments. What they really need is structural clarity - a unifying principle that can either reconcile their inconsistent verdicts or force them to abandon some for coherence.

  The core tension here seems to be between consequentialist purity and what I'd call "agent-relative ethics" - where the who matters as much as the what. Their cases reveal fault lines around personal integrity (Case 6), institutional context (Case 7), and the moral weight of direct causation (Case 2). The graduate student's two-part conjecture shows they're groping toward this, but it's not quite capturing institutional agency or temporal discounting.

  Looking at their cases... Case 1 vs 2 is fascinating. They intuitively treat harm causation as non-fungible even when offset - that suggests a deontological constraint. But then in Case 3 they embrace high-risk institutional change! The local food bank case (5) reveals their commitment to personal meaning, while Case 7 shows they hold different entities to different accountability standards. 

  For the principle, I'm considering a hybrid approach: consequentialism with agent-relative constraints for individuals, plus role-relative duties for institutional actors. But we'll need to define "constitutive relationship" carefully to avoid sentimentality. The replacement symmetry idea is powerful but incomplete - it doesn't address why Case 4 feels like "rationalizing" while Case 3 doesn't. 

  On their new cases: The AI grad student scenario tests whether earning-to-give absolves complicity in diffuse harms. The foundation case challenges intergenerational ethics - can we defend obligations to distant futures? The local housing donor pits measurable global good against unmeasurable local agency. Each exposes different pressure points in the framework.

  This is precisely the kind of deep normative puzzle where political theorists live. The user isn't just seeking answers - they're stress-testing entire ethical frameworks. Their frustration with the literature suggests they've moved beyond standard effective altruism debates into uncharted territory where agency, institutions, and time horizons collide. What they're building could be significant.
answer: |-
  Here is a principle designed to systematize your verdicts, preserve their core insights, and force one revision for coherence:

  **The Principle: Agent-Relative Consequentialism with Integrity Constraints**  
  *An agent’s action is permissible if it maximizes expected impartial value relative to their role, resources, and epistemic position, except when:  
  (a) It directly causes harm that cannot be fully mitigated by offsetting goods (the *Harm Integrity Constraint*); or  
  (b) It undermines a constitutive relationship or vocation central to the agent’s identity (the *Relational Integrity Constraint*).  
  Expected value calculations must discount outcomes by the probability of substitution by other agents only when:  
  (c) The agent occupies a role defined by substitutability (e.g., fungible funder, employee) AND the substitution is verifiable.  
  Institutional actors bear heightened duties to justify departures from measurable effectiveness when accountable to principals (e.g., taxpayers, donors), but not when endowed and independent.*

  ---

  ### Clause-by-Clause Analysis
  1. **Maximize expected impartial value relative to role/resources/epistemic position**  
     Motivated by **Cases 1, 3, 6, 8**. Permits earning-to-give (1) and high-risk institutional bets (3) when the agent reasonably judges potential upside to outweigh measurable alternatives. Accepts the AI mathematician’s shift (6) if the expected value calculation is credible *for him*. Justifies "last dollar" reallocation (8) when substitution is certain.  
     *Case 6*: The "loss" reflects the Relational Integrity Constraint (b): abandoning a constitutive vocation imposes moral costs not captured by impartial value.

  2. **Harm Integrity Constraint (a): No direct harm causation, even if offset**  
     Resolves **Case 2**. Trading firm participation directly exacerbates hunger (non-substitutable harm), violating (a). Differs from Case 1 (neutral finance job) where harm isn’t *directly* caused by the agent’s role.  
     *Case 4*: Rejected because poor epistemic position ("no data") prevents credible expected value claims; thus, fails the core maximization clause. Case 3 succeeds due to plausible institutional leverage.

  3. **Relational Integrity Constraint (b): Protects constitutive relationships/vocations**  
     Explains **Case 5** (food bank volunteering) and **Case 6** (staying in math). The value of local engagement or scholarly identity isn’t fungible; demanding substitution violates (b).  
     *Case 1*: Not *admirable* in the same way as relational acts because substitutable giving lacks the integrity-signaling value of personal sacrifice for embedded commitments.

  4. **Substitution Discount (c): Applies only to fungible roles with verifiable substitution**  
     Addresses **Case 8**. "Last dollar" reallocation is permitted because the funder’s role is inherently substitutable *and* substitution is certain. "First dollar" refusal fails: no verifiable substitute exists yet.  
     *Case 2*: Replacement symmetry is rejected—harm discounting is barred by Constraint (a), preventing "offsetting" justification.

  5. **Institutional Accountability Clause**  
     Solves **Case 7**. Governments *must* prioritize measurable interventions to satisfy accountability to principals (taxpayers). Endowed foundations, lacking such accountability, fail by not pursuing higher expected value. Distinction is role-based, not consequential.

  ---

  ### Verdicts Lost and Conflicts Resolved
  - **Overturned Verdict: Case 4**  
    Your "no" is preserved, but the rationale shifts: The failure isn’t structural similarity to Case 3, but *epistemic poverty* (no data/model credibility). Case 3’s institutional leverage is plausibly knowable even without precise metrics.  
  - **Preserved Tensions:**  
    - **1 vs. 2**: Resolved. Case 2 violates the Harm Integrity Constraint (direct causation); Case 1 does not.  
    - **3 vs. 4**: Resolved. Case 3 meets epistemic thresholds for high-variance bets; Case 4 does not.  
  - **All Other Verdicts** are upheld under the principle.

  ---

  ### Three New Cases Judged
  1. **AI Graduate Student (Earning-to-Give)**  
     *Permissible IF* the job doesn’t directly cause harm (e.g., designing exploitative algorithms). If harm is indirect/diffuse (e.g., energy consumption), Constraint (a) isn’t triggered. *But*: If the work requires complicity in unethical practices, (a) may apply. Needs detail on harm causation.  

  2. **Endowed Foundation Funding Distant-Future Research**  
     *Permissible and likely good*. No accountability clause binds them; they may reasonably judge ultra-long-term benefits to outweigh near-term measurability. *Risk*: Epistemic position must justify the expectation (unlike Case 4).  

  3. **Donor Switches to Local Housing Campaign**  
     *Permissible under Constraint (b)* if the donor has a constitutive relationship to the community (analogous to Case 5). If purely impartial, requires credible expected-value calculation showing local policy leverage > global health. Needs detail on donor’s ties/evidence.  

  ---

  ### Damage Report on Your Conjecture
  **Agent-Substitutability Proviso**: Correctly identifies relational/vocational integrity (Cases 5,6) and distinguishes Case 1 (substitutable) from Case 5 (non-substitutable). **Break**: Fails Case 7 (institutional roles aren’t about "agent involvement" but accountability structures).  
  **Replacement Symmetry**: Correct in Case 8 (discounting for verified substitutes) and spotting the flaw in Case 2’s offsetting logic. **Break**: Overextends by demanding *universal* discount symmetry, ignoring Constraint (a)’s absolute bar on direct harm.  
  **Repair**: Incorporate (a) and (c) as above. Discard symmetry in favor of a harm constraint + role-conditional substitution discount. Your core insight—that substitutability is context-dependent—is sound but needs institutional and epistemic scaffolding.

  ---

  ### The Cost of Coherence
  You sacrifice the intuitive rejection of Case 4’s "structural" similarity to Case 3, replacing it with an epistemic distinction. This forces a clearer burden of proof for high-variance bets but aligns with your institutional trust in Case 3. The principle systematizes 7.5/8 verdicts (only Case 4 is revised) by formalizing your implicit deontological constraints (harm, integrity) within a role-sensitive consequentialism. If you insisted on keeping Case 4’s structural critique, you’d need to abandon Case 3 or accept inconsistency—a price not worth paying.
