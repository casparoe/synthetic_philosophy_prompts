  We are grading an exam answer for a social epistemology seminar. The question has three parts (a, b, c) and the student's answer is provided. We need to assign a numerical grade (out of 20) with a breakdown per part, and provide specific feedback.

  Breakdown:
  - (a) is worth 6 points
  - (b) is worth 6 points
  - (c) is worth 8 points

  We must:
  - For each part, quote or point to specific sentences and explain what is right, what is wrong or half-right.
  - Say what a full-credit answer would have needed to add or change.
  - For part (b), if wrong, provide the correct probability and whether it moves with crowd size.
  - Be fair and not side with the TA just because they are asking.

  Let's analyze each part.

  ### Part (a)
  The question asks to explain why a cascade can start, the rationality of herding, why the crowd can lock onto the wrong shop, and what later choices convey.

  Student's answer:
  - "A cascade starts as soon as two people in a row pick the same shop." -> This is a bit too simplistic. In the standard model (like Bikhchandani, Hirshleifer, Welch), a cascade starts when the public information (from previous choices) becomes so strong that it outweighs a private signal. It doesn't necessarily require two in a row if the first two are different and then the third breaks the tie. However, in the symmetric case with two shops and signals of the same strength, after two identical choices, the third person will ignore their own signal. So the student is essentially correct for this setup.
  - Explains that the Bayesian thing to do is to ignore your signal and follow the crowd because the public information outweighs the private signal (correct).
  - Explains that once in a cascade, choices no longer reveal private signals, so information is blocked (correct).
  - Notes that the chance of locking onto the wrong shop is set by the first few and doesn't improve with crowd size (correct).
  - Mentions fragility and path-dependence (correct).
  - Clarifies that it's observational learning, not network effects or rewards (correct).

  What is missing?
  - The student says a cascade starts after two in a row. But what if the first two are different? Then the third customer's decision might break the tie. The student doesn't address that. However, the scenario says the shops are identical and equally likely, so the first two could be split. In that case, the third customer would follow their own signal because the public information is balanced. Then a cascade might start after the third choice if they break the tie. A full-credit answer should note that a cascade starts when the public belief becomes so strong that an individual's private signal cannot overturn it, which typically happens after two consecutive same choices (if the first two are the same) or after the third choice (if the first two are split and the third breaks the tie). The student's description is a bit oversimplified but captures the common case.

  Overall, the answer is good but not perfect. We can deduct 1 point for oversimplifying the start condition.

  ### Part (b)
  The question: Does a bigger, more lopsided tally mean the crowd is more likely to be right?

  Student's answer:
  - The student says the designer is right: each additional person is an independent draw, so the law of large numbers applies, and a large lopsided tally means the crowd is more likely to be right, with the probability of error becoming negligible.

  Is this correct?
  - In the standard herding model, the problem is that after a cascade starts, the choices are not independent of the state. They are just following the crowd, so the tally does not represent independent signals. The student incorrectly assumes that every choice adds an independent signal. In reality, once a cascade starts, the choices are uninformative because they are ignoring private signals. Therefore, the tally is not accumulating new independent evidence. The crowd can be wrong and the tally can be lopsided even if the crowd is wrong. The probability of being wrong does not go to zero as the crowd grows because no new information is being added after the cascade. The error probability is fixed by the initial cascade.

  Therefore, the student is wrong. The designer's proposal does not work because the tally does not reflect the pooling of independent signals once a cascade has set in.

  What should the student have said?
  - The tally is misleading because after a cascade, the choices are not based on private signals. A lopsided tally might be due to an early cascade on the wrong shop. The probability that the crowd is wrong does not decrease to zero with the size of the crowd; it remains at the level determined by the initial cascade (which depends on the first few signals). For example, if the first two customers both choose the wrong shop (which happens with probability (0.4)^2 = 0.16 if the true state is the other shop), then a cascade starts and the entire rest of the crowd will follow, regardless of their signals. The chance of being locked into the wrong shop is about 0.16 (if we condition on the true state, but note that the prior is 50-50, so the unconditional probability of a wrong cascade is 0.5 * [P(wrong cascade | true=K) + P(wrong cascade | true=S)]). However, in the symmetric case, the probability that a wrong cascade starts at the beginning (i.e., the first two are wrong) is 0.5 * (0.4)^2 (if true is Kuro, then wrong is Shiro, and the signal for Shiro when Kuro is true has probability 0.4) plus 0.5 * (0.4)^2 for the symmetric case. So overall, the probability of a wrong cascade is (0.5 * (0.4)^2) + (0.5 * (0.4)^2) = 0.16. This is fixed and does not change with the crowd size.

  The right probability of the crowd being wrong is the probability that a wrong cascade started, which is about 0.16 (or 16%) and does not decrease with the size of the crowd.

  Therefore, the student's answer is incorrect. They missed the key point that the tally does not represent independent evidence because of the cascade.

  Breakdown for (b): 
  - The student's claim that the designer is right is incorrect. The tally does not accumulate independent evidence after a cascade starts. The error probability does not go to zero.

  ### Part (c)
  The question: With the latency channel (displaying hesitation time, which is a noisy indicator of the private signal), does the cascade still block information? What happens to the herding?

  Student's answer:
  - The student says the latency channel unblocks the flow because the hesitation time reveals the private signal (or at least an indicator of it). Therefore, information keeps flowing and the public belief updates, so the blockage is gone.
  - The cascade dissolves because customers can see if previous customers hesitated, and they will start trusting their own signals again, so the crowd spreads out.

  Is this correct?
  - The idea is that if the hesitation time is informative about the private signal, then even if a customer follows the crowd, their hesitation might reveal that their private signal was against the crowd. This can prevent the information blockage because the public can update based on the hesitation. Therefore, the cascade might break or not even start because the public belief is updated by the hesitation.

  However, note that the hesitation is a noisy indicator. The student says "a long pause tends to mean the customer's private signal pointed at the other shop". So it's not perfect. But even a noisy signal can help. In fact, with this additional information, the cascade might be avoided or broken because the public belief might not become strong enough to outweigh a private signal. Moreover, if the hesitation is observed, then the choice plus the hesitation can reveal the private signal (at least partially). This prevents the information blockage.

  The student's conclusion that the cascade dissolves and the crowd spreads out is a bit strong. It might be that the public belief becomes more accurate and the crowd converges to the correct shop without spreading out. However, the key is that the information is aggregated, so the crowd is more likely to be correct. The herding might still occur if the public belief becomes very strong, but it would be based on more information. However, the student's point that the blockage is gone is correct.

  But note: if the hesitation is observed, then even if a customer follows the public information, their hesitation might reveal their private signal. Therefore, the next customer has more information. This can break the cascade because the public belief is updated by both the choice and the hesitation. The crowd might not necessarily spread out; they might still herd, but it would be on the basis of a more accurate public belief. However, the student says that customers will start trusting their own signals again and the crowd will spread out. This might happen if the hesitation reveals that the public belief is weak. For example, if many people are hesitating before choosing the same shop, it might indicate that their private signals were against the choice, so the next customer might not follow the crowd if their own signal is strong and the public belief is not overwhelming.

  In any case, the main point is that the information blockage is gone, and the cascade does not occur in the same way. The student's answer captures the essence.

  But one issue: the student says "the crowd will spread out across the two shops". This might not be the case. With the latency channel, the public belief might become very accurate, and then everyone might choose the correct shop. So the crowd might still herd on the correct shop, but it's not pathological. The spreading out might occur only if the public belief is close to 50-50. However, the student is right that the pathological herding (on the wrong shop) is avoided and the information is aggregated.

  Overall, the answer is mostly correct.

  ### Grading

  Part (a): 
  - Correct: Explanation of cascade start (though slightly oversimplified), rationality, information blockage, and why the crowd can be wrong.
  - Missing: Clarification that a cascade might not start exactly after two in a row if the first two are split. But the student does mention that it's after two in a row, which is the typical case. We can deduct 1 point for the oversimplification.
  - Score: 5/6

  Part (b):
  - Incorrect: The student claims the designer is right, but the tally does not represent independent evidence after a cascade. The error probability does not go to zero.
  - The student missed the key insight of the cascade model: information blockage means that the tally does not reflect the entire crowd's signals.
  - We should also note the correct probability: the chance of the crowd being wrong is fixed (about 16%) and does not decrease with crowd size.
  - Score: 2/6 (for at least understanding the law of large numbers in an independent setting, but not applying it correctly to this model)

  Part (c):
  - Correct: The latency channel unblocks the flow of information because the hesitation reveals the private signal (at least partially). The information blockage is gone. The cascade dissolves because the public belief updates and customers can use their own signals.
  - The point about the crowd spreading out is a bit imprecise (it might not spread out, but it's not a cascade in the pathological sense). However, the student is right that the herding behavior changes and the cascade is broken.
  - The answer captures the main idea. Deduct 1 point for the slight overstatement about spreading out.
  - Score: 7/8

  Total: 5 + 2 + 7 = 14/20

  ### Feedback Comments

  We need to write comments for the student.

  **Part (a): 5/6**  
  What's good: You correctly explain that a cascade can start after two consecutive choices of the same shop, and that in such a cascade, it is rational for subsequent individuals to ignore their private signals and follow the crowd because the public information outweighs the private signal. You also correctly note that this blocks the incorporation of later private signals, leading the crowd to potentially lock onto the wrong shop with a fixed probability determined by the early choices. Your points about fragility, path-dependence, and the purely informational nature of the herding are accurate.  

  What's missing: The condition for a cascade to start is slightly more nuanced. While two consecutive identical choices will trigger a cascade (because the third customer will ignore their signal), if the first two choices are split (one for each shop), the third customer will break the tie by following their own signal. Then, if the third customer's choice matches one of the first two, a cascade might start at that point. A full-credit answer would have clarified that a cascade begins when the cumulative public information becomes strong enough to outweigh any single private signal, which typically occurs after two or three choices depending on the initial sequence.  

  **Part (b): 2/6**  
  What's wrong: Your answer claims that the designer's proposal (using tallies) is correct because each additional customer adds an independent signal, so the law of large numbers applies and the crowd becomes more accurate. However, this overlooks the key issue of information cascades. Once a cascade starts, customers ignore their private signals and follow the crowd. Therefore, their choices do not reflect independent evidence; they are uninformative. The tally only incorporates the signals of the first few customers (before the cascade) and then stops aggregating new information. As a result, a large and lopsided tally might simply reflect an early cascade on the wrong shop, and the probability that the crowd is wrong does not decrease to zero as the crowd grows.  

  Correction: The probability that the crowd ends up on the wrong shop is fixed by the initial cascade. Specifically, the chance that a wrong cascade starts is approximately 16% (since each shop is equally likely to be better, and the first two customers both choosing the worse shop happens with probability 0.4 * 0.4 = 0.16 for each true state, so overall 16%). This probability does not change with the size of the crowd because after the cascade starts, no new information is added. Therefore, a bigger, more lopsided tally does not imply that the crowd is more likely to be right.  

  **Part (c): 7/8**  
  What's good: You correctly identify that the latency channel (showing hesitation times) can unblock the flow of information. Since hesitation is a noisy indicator of the private signal, it allows the public to update their beliefs even if a customer follows the crowd. This prevents the information blockage characteristic of cascades. You also correctly note that the cascade "dissolves" because the public belief continues to update, and customers may start trusting their own signals again.  

  What could be improved: While the crowd may no longer herd pathologically on the wrong shop, your statement that "the crowd will spread out across the two shops" is not necessarily the only outcome. With the latency channel, the public belief may become very accurate, leading the crowd to converge on the correct shop without spreading out. The key point is that the information is aggregated and the cascade does not block learning, but the group might still herd on the correct choice. A full-credit answer would have clarified that the herding behavior is no longer pathological and the crowd is more likely to be correct, without necessarily implying that spreading out always occurs.  

  **Overall: 14/20**  
  Your answer demonstrates a good understanding of the cascade mechanism and the role of information aggregation. However, in part (b), you missed the critical insight that cascades break the independence of choices, making the tally uninformative after the cascade starts. Part (c) is strong but could be slightly more precise about the outcome. Keep up the good work!
answer: |-
  ### Grading Summary for Student #14  
  **Total Score: 14/20**  
  - **Part (a): 5/6**  
  - **Part (b): 2/6**  
  - **Part (c): 7/8**  

  **Overall Feedback:**  
  You clearly grasp the core mechanics of cascades and observational learning, and your writing is concise and engaging. However, part (b) overlooks a critical flaw in the tally system due to cascades, and parts (a) and (c) have minor gaps in precision. Below, I break down each part with specific quotes, corrections, and what was needed for full credit.  

  ---

  ### Part (a) Breakdown: Cascade Mechanics (5/6)  
  **What’s good:**  
  - You correctly explain that a cascade starts after two consecutive identical choices ("as soon as two people in a row pick the same shop"), triggering rational herding because public information outweighs a single 60% signal.  
  - You nail why herding is rational ("nobody is being a sheep... responding to evidence") and why the crowd locks onto the wrong shop: choices after the cascade convey no new information ("your own choice no longer reveals anything"), blocking private signals.  
  - Strong emphasis on path-dependence ("reorder the first three... lock onto the opposite shop") and clarifying this is purely observational learning.  

  **What’s wrong or half-right:**  
  - **Offending sentence:** "A cascade starts as soon as two people in a row pick the same shop."  
    - This oversimplifies. If the first two choices are *split* (e.g., Customer 1: Kuro, Customer 2: Shiro), a cascade doesn’t start yet. Customer 3 breaks the tie with their signal, and a cascade only starts if their choice *matches one of the first two* (e.g., Kuro-Kuro-Shiro → no cascade; Kuro-Shiro-Kuro → cascade on Kuro).  
  - **Why it matters:** The exact trigger depends on the net public evidence. After two split choices, the public belief is still balanced (Bayesian posterior = 50%), so Customer 3 uses their signal. The cascade starts when public evidence is strong enough (≥2 net votes for one shop) to outweigh a signal.  

  **Full-credit requirements:**  
  - Explicitly state that a cascade starts when the public belief is sufficiently one-sided (e.g., ≥2 net votes for one shop), which *usually* happens after two consecutive identical choices *or* a third vote that breaks a split.  
  - Mention that split initial choices delay the cascade.  

  ---

  ### Part (b) Breakdown: Tally Fallacy (2/6)  
  **What’s good:**  
  - You articulate the designer’s intuition: tallies *seem* to aggregate independent signals ("each additional person... independent draw"), and in isolation, the law of large numbers would apply.  

  **What’s wrong:**  
  - **Offending sentence:** "The designer is basically right... the probability that the crowd has settled on the wrong shop is negligible."  
    - **This is incorrect.** In a cascade, choices after the first few are *not independent signals*. Once a cascade starts, customers ignore their private signals and follow the crowd. Their choices add no new information to the tally. A lopsided tally (e.g., "Kuro 327, Shiro 41") could reflect an *early wrong cascade*, not accumulating evidence.  
  - **Why it matters:** The crowd’s error probability *does not decrease* with size. A large tally only amplifies the illusion of confidence.  

  **Corrections & key insights:**  
  - **True probability of error:** ~16% (fixed, regardless of crowd size).  
    - Calculation: Each shop is equally likely better. A wrong cascade starts if the first two customers both choose the worse shop (probability = 0.4 × 0.4 = 16% per true state). Once this happens, all subsequent choices follow, and the tally grows uninformatively.  
  - **Does crowd size help?** No. The error probability is determined solely by the first two customers’ signals and does not drop as the crowd grows. A tally of 1000–10 is no more reliable than 3–0 if both stem from an early cascade.  

  **Full-credit requirements:**  
  - Explain that tallies fail because post-cascade choices are uninformative (no new evidence).  
  - Note that the probability of being wrong is fixed at ~16% and invariant to crowd size.  
  - Contrast with a world without cascades (e.g., if signals were always revealed), where tallies *would* improve accuracy.  

  ---

  ### Part (c) Breakdown: Latency Channel (7/8)  
  **What’s good:**  
  - You correctly identify that latency "unblocks the flow" by revealing private signals ("hesitation time hands their private signal back").  
  - Spot-on that information blockage dissolves ("public belief keeps updating"), likening it to jury-style pooling.  
  - Valid point that cascades "dissolve" since hesitation lets later customers detect conflicting signals.  

  **What’s half-right:**  
  - **Offending sentence:** "The crowd will spread out across the two shops instead of piling onto one."  
    - While latency *can* break wrong cascades, the crowd may still herd on the *correct* shop if public belief becomes strong. "Spreading out" overstates the outcome; the crowd might converge *correctly* (e.g., 90% choose the better shop) without pathological piling.  
  - **Missing nuance:** Latency is "noisy but informative," so it only *partially* reveals signals. A full-credit answer should note that hesitation reduces information loss but doesn’t eliminate all uncertainty.  

  **Full-credit requirements:**  
  - Clarify that herding may still occur (on the *right* shop) if latency-augmented public belief is overwhelming.  
  - Acknowledge that noisy hesitation doesn’t perfectly reveal signals, so some information loss persists.  
  - Specify that latency prevents "freezing" of public belief but doesn’t guarantee uniform spreading.  

  ---

  ### Why Your Office-Mate Was Partially Wrong on (b)  
  Your office-mate likely treated choices as independent signals (like a coin flip), ignoring that cascades *decouple choices from truth*. The core insight of social epistemology models (à la Bikhchandani et al.) is that rational imitation can sever the link between individual signals and aggregate outcomes. The 16% error probability is a direct consequence of this decoupling, and crowd size doesn’t fix it. You were right to "itch"!  

  **Final Note:** This was a strong answer overall—part (b) is notoriously counterintuitive. If this were a real exam, #14 is thinking hard and just missed one key twist.
