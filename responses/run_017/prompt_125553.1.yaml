  We are translating a philosophical debate about future contingents (like Aristotle's sea battle) into the formal vocabulary of branching-time model checking for concurrent systems.

  Key terms in your framework:
  - State: a point in time with all system information.
  - Execution: a maximal path (sequence of states) from a given state.
  - Scheduler: determines which transitions are taken (in concurrency, it resolves non-determinism).
  - Interleaving: way of composing concurrent processes by sequencing their atomic steps.
  - Safety: something bad never happens (always ¬bad).
  - Liveness: something good eventually happens (eventually good).
  - Branching-time quantifiers:
     - A φ: on every execution from the current state, φ holds.
     - E φ: there exists an execution from the current state such that φ holds.

  The debate: 
  Aristotle's example: "There will be a sea battle tomorrow."
  - Fatalist argument: If it is already true now that there will be a sea battle tomorrow, then it cannot fail to happen. Similarly, if it is false, then it cannot happen. So the future is fixed.

  Two ways out:
  1. Deny bivalence: the statement "there will be a sea battle" is neither true nor false now (it is indeterminate).
  2. Relativize truth to the actual future: the statement is true relative to the branch that turns out to be actual (but we don't know which one that is now).

  We need to express these in your branching-time framework.

  Step 1: Representing time and events.
  - We have a state (now).
  - From the current state, there are multiple possible futures (executions).
  - We can think of "tomorrow" as a specific point in the future. However, in branching time, the same absolute time might not be reached by all branches (if time is discrete and we count steps, then we can index by step count). Alternatively, we might have a temporal operator that refers to the next state or a state with a specific property (like a day passing).

  Let's assume we have a temporal operator:
     - F_battle: "eventually battle" (where battle is a state predicate meaning a sea battle is occurring).

  But note: we want "tomorrow", which is a specific time. So let us instead assume that we have a way to mark the passage of days. We can introduce a state predicate "tomorrow" that holds at states one day from now. Then we can say:
     - "There will be a sea battle tomorrow" might be: at the next state where it is tomorrow, the battle is happening.

  However, in branching time, the next state is not unique. So we have to consider:

  Option 1: A (F_{tomorrow} battle)   [on every branch that reaches tomorrow, at the first tomorrow state, battle holds]
  Option 2: E (F_{tomorrow} battle)   [there exists a branch that reaches tomorrow and at the first tomorrow state, battle holds]

  But note: the fatalist argument is about the truth of the statement now.

  Fatalist argument in A/E form:

  Premise 1 (Bivalence): Either "there will be a battle tomorrow" is true now or it is false now.

  But what does "true now" mean? In branching time, we have two candidates:

  Candidate 1: It is true now that there will be a battle tomorrow if and only if on every branch (i.e., in every possible future) we have a battle tomorrow. (A F_{tomorrow} battle)

  Candidate 2: It is true now that there will be a battle tomorrow if and only if on some branch (i.e., in some possible future) we have a battle tomorrow? But that seems too weak because then it might be true even if in most branches there is no battle.

  The fatalist argument might be using a different notion: that the statement is true now if and only if in the actual future (the one that will happen) there is a battle. But we don't know which one is actual.

  So the fatalist argument might be:

  1. Either "there will be a battle tomorrow" is true now or it is false now. (Bivalence)
  2. If it is true now, then in the actual future there will be a battle, so it must happen and cannot be avoided.
  3. If it is false now, then in the actual future there will be no battle, so it cannot happen.

  But in your framework, we don't have a notion of "the actual future". We only have quantifiers over all possible futures (A and E). So the fatalist is using a notion of truth that is tied to the actual branch.

  Now, let's see if we can formalize the fatalist argument in a way that uses A or E and see where it breaks.

  Suppose we interpret "there will be a battle tomorrow" as:

     φ = A (F_{tomorrow} battle)   [it is necessary that there is a battle tomorrow]

  Then the fatalist argument becomes:

  1. Either A (F_{tomorrow} battle) or ¬A (F_{tomorrow} battle) [which is equivalent to E (F_{tomorrow} ¬battle) if we assume that every branch reaches tomorrow? But not necessarily. We have to be cautious.]

  But note: ¬A (F_{tomorrow} battle) is not equivalent to A (F_{tomorrow} ¬battle). It is equivalent to E (¬F_{tomorrow} battle) which means there exists a branch that either never reaches tomorrow or reaches tomorrow without battle.

  If we assume that every branch reaches tomorrow (so we have a fixed time step), then ¬A (F_{tomorrow} battle) becomes E (F_{tomorrow} ¬battle).

  But then the fatalist argument does not go through because:

     - If it is true (A (F_{tomorrow} battle)) then indeed on every branch there is a battle tomorrow, so it must happen.
     - But if it is false (¬A (F_{tomorrow} battle)), then there exists a branch without battle tomorrow, but that doesn't mean that the battle won't happen on the actual branch. It only means that it is possible to avoid it. But if we avoid it, then the actual branch is one without battle.

  However, the fatalist wants to say that if it is false now, then the battle cannot happen. But that would require that in the actual branch there is no battle. But from ¬A (F_{tomorrow} battle) we do not get that the actual branch has no battle, only that there is at least one branch without battle.

  So the fatalist argument, if we use the universal quantifier, does not lead to fatalism because the falsity of the universal statement does not imply that the actual branch will not have the battle.

  What if we use the existential quantifier? Suppose we interpret "there will be a battle tomorrow" as:

     φ = E (F_{tomorrow} battle)   [it is possible that there is a battle tomorrow]

  Then the bivalence premise: either E (F_{tomorrow} battle) or ¬E (F_{tomorrow} battle) [which is A (¬F_{tomorrow} battle)].

  But then:
     - If E (F_{tomorrow} battle) is true, that only means it is possible, not that it will actually happen.
     - If it is false, then on every branch there is no battle tomorrow, so it definitely won't happen.

  So again, we don't get fatalism: the truth of E (F_{tomorrow} battle) does not force the battle to happen.

  Therefore, the fatalist must be using a third notion: truth relative to the actual branch. But we don't have that in the branching-time logic.

  Now, the two ways out:

  1. Deny bivalence: This would correspond to denying that either A (F_{tomorrow} battle) or ¬A (F_{tomorrow} battle) holds? But in classical logic, that is a contradiction. So that doesn't work. Alternatively, we might not assign a truth value at all to the statement about the future unless it is necessary (i.e., true on all branches) or impossible (false on all branches). In that view, if there are branches with battle and without battle, then the statement "there will be a battle" is not assigned a truth value.

     In your framework, we can say: the statement is indeterminate if it is not the case that A (F_{tomorrow} battle) and not the case that A (F_{tomorrow} ¬battle). That is, both E (F_{tomorrow} battle) and E (F_{tomorrow} ¬battle) hold.

  2. Relativize truth to the actual branch: But we don't have a way to refer to the actual branch. So we cannot say: the statement is true in the actual branch.

  Now, your residue report:

  Hunch (1): Your logic has no way to pick out the actual execution from here — only "all" and "some". So the second way out (relativization to the actual branch) is unsayable unless we add a distinguished actual branch.

     This is correct. In standard branching-time temporal logics (like CTL*), there is no designated "actual" branch. The semantics is given in terms of quantification over all branches. So the idea that one branch is the one that "will happen" is not expressible.

  Hunch (2): Your framework is tenseless — "tomorrow" is just an index tick. So the worry that the future is "open" in a way the past isn't might not be formulable.

     This is also correct. In branching-time models, the past is linear (up to the current state) and the future branches. But the model is static: it represents all possibilities from the current state. There is no notion of time flow that "collapses" possibilities as time passes. The openness of the future in this model is captured by the existence of multiple branches. However, the asymmetry between past and future is built-in: the past is fixed (one history up to now) and the future is branching. But without an actual branch, we cannot express the idea that as time passes, one branch becomes actual and others are lost.

  Additional residue: 

  - The fatalist argument requires a notion of truth that is tied to the actual future, which is not available in the standard branching-time logic. So the argument cannot be formulated without adding that notion.

  - The two ways out: 
     - The first way (denial of bivalence) can be expressed: we say that for some future contingent φ, we do not have A φ and we do not have A ¬φ (if we take φ to be "battle tomorrow"). But note: the denial of bivalence in philosophy is about the truth value of the statement "there will be a battle" — it is not true and not false. In our case, we are saying that the universal statements are not true. However, we might still have that on some branches it is true and on others false. This is analogous to the philosophical position.

     - The second way (relativization to the actual branch) is not expressible.

  - Another point: in some branching-time logics (like Ockhamist or Peircean), there are ways to add a "thin red line" (a designated actual branch) to express the idea of what will actually happen. But that is an extension of the standard framework.

  Now, the final question: if the openness of the future turns out to be unstatable in a framework that otherwise handles branching fine, does that count against the framework or against the philosophical worry?

  Answer: It depends on the purpose of the framework. 

  - Your framework is designed for model checking concurrent systems. In that context, the actual branch is not needed because we are interested in verifying properties for all possible behaviors (safety: nothing bad happens in any execution; liveness: something good happens in every execution). The philosophical worry about actuality may be irrelevant.

  - However, if we want to use the framework to model philosophical concepts about time and future contingents, then the inability to express the actual branch might be a limitation. But note: the branching-time model does capture the idea of multiple possibilities, which is the core of the open future. The additional concept of actuality might be seen as a meta-level concept that we don't need for verification.

  - Alternatively, the philosophical worry might be based on a misconception: that we need to pick out the actual future. But in a deterministic physical system, there is only one branch, and in a non-deterministic system, we don't know which one will be taken. The branching model is a way to represent our ignorance and the system's non-determinism. The actual branch is not part of the model because the model is a representation of the system's possible behaviors, not a simulation of one run.

  Conclusion: 
  - For your practical purposes, the framework is adequate. 
  - The philosophical worry about the open future is partially captured by the existence of multiple branches, but the distinction between what will happen and what might happen is not expressible without adding a designated branch. 
  - Whether that counts against the framework or the worry: it doesn't count against the framework for its intended purpose (verification). But if we want to use it for philosophy, we might need to extend it.

  However, note that the branching-time model is used in philosophy (e.g., in the work of Belnap) to address precisely these issues. They introduce the idea of a "history" (which is an execution) and then define truth at a moment (state) relative to a history. Then, the actual history is not fixed at the moment, so we can only say that a statement is true relative to a history. Then, we can express: "relative to history h, there will be a battle tomorrow". And then we can say that the statement is true simpliciter only when we are on that history? But that requires a parameter.

  In summary:

  1. "Possible futures" in your terms are the executions (maximal paths) from the current state.

  2. "There will be a sea battle tomorrow" does not map obviously to either A or E because:
     - A (battle at tomorrow) means it is necessary (on every branch) and that leads to fatalism only if we assume that the actual branch is one of the branches (which it is) but then if it is necessary, it must happen. However, if it is not necessary, then it might still happen on the actual branch.
     - E (battle at tomorrow) means it is possible, which is too weak for the claim that it will happen.

     The fatalist argument requires a notion of truth that is about the actual branch, which is not in the language.

  3. The residue report:
     - (1) is correct: without a distinguished actual branch, the second way out (relativization) is unsayable.
     - (2) is correct: the framework is tenseless and static, so the dynamic aspect of time (the "becoming" of the actual branch) is not captured.

     Additionally, the bivalence denial can be expressed as: neither A (battle at tomorrow) nor A (no battle at tomorrow) holds. But note that this is not the same as the philosophical bivalence denial because we are not saying that the statement "there will be a battle" has no truth value, but that it is not necessary and not impossible. However, we can still assign truth relative to a branch.

  4. The unstatability of the openness of the future in the full philosophical sense (which includes the idea of a unique actual future that is not yet determined) does not count against your framework for its intended purpose. It only shows that the framework is designed for verification of possibilities and not for capturing the metaphysical idea of actuality. The philosophers might need to extend the framework (e.g., by adding a designated branch or by using a more expressive logic) to capture their concerns.

  Final note: In the branching-time framework, the future is open in the sense that there are multiple possibilities. That is captured. What is not captured is the idea that one of these possibilities is the one that will actually be realized, and that we can refer to it. But for the verification of concurrent systems, we don't care about the actual run (because it might be influenced by external factors we cannot control) but about all possible runs.
answer: |-
  ### Translation of the Future Contingents Debate into Branching-Time Model Checking Terms

  #### Core Concepts in Your Framework
  - **State**: A snapshot of the system at a moment.
  - **Execution**: A maximal path (sequence of states) from a state.
  - **Scheduler**: Resolves non-determinism, defining which executions are possible.
  - **Interleaving**: Concurrent events are linearized into sequences.
  - **Safety**: "Bad" never happens (`A¬bad` or `AG¬bad` in CTL*).
  - **Liveness**: "Good" eventually happens (`A◇good` or `AG◇good`).
  - **Branching Quantifiers**:
    - `Aφ`: On every execution from the current state, φ holds.
    - `Eφ`: There exists an execution from the current state where φ holds.

  #### Key Philosophical Elements
  - **Future Contingent**: A statement about the future that is not yet determined (e.g., "There will be a sea battle tomorrow").
  - **Fatalist Argument**: If it's *already true* that the battle will happen, it cannot fail to happen.
  - **Two Ways Out**:
    1. **Bivalence Denial**: The statement is neither true nor false now (indeterminate).
    2. **Relativism**: Truth is relative to the "actual" branch (which is unknown now).

  ---

  ### Mapping the Debate to Branching-Time Logic
  #### 1. **"Possible Futures" in Your Terms**
     - **Definition**: A "possible future" is an **execution** (maximal path) from the current state.  
     - **Scheduler Role**: Defines which executions are possible (via interleaving choices).  
     - **Note**: All executions are treated symmetrically; no execution is privileged as "actual" in your semantics.

  #### 2. **What Does "There Will Be a Sea Battle" Map To?**
     Let `battle` be a state predicate true in states where a sea battle occurs.  
     Let `tomorrow` be a temporal marker (e.g., after \( n \) state transitions).  
     We consider three candidates:
     - **Candidate 1: `A◇battle`**  
       "On **every** execution, a battle eventually occurs."  
       *Problem*: Too strong. This implies inevitability, denying contingency.  
     - **Candidate 2: `E◇battle`**  
       "There **exists** an execution where a battle eventually occurs."  
       *Problem*: Too weak. This only asserts possibility, not future truth.  
     - **Neither is Obviously Right**:  
       - The fatalist assumes a **single actual outcome** (e.g., "the battle *will* happen" means it holds on the "real" execution).  
       - Your framework lacks a notion of "the actual execution" — only `A` (all) and `E` (some) exist. Thus, **no direct mapping works**.  

  #### 3. **Fatalist Argument in A/E Form**
     - **Fatalist Premise**:  
       *"If 'there will be a battle' is true now, it must happen."*  
       Formalized with implicit relativization to the "actual" branch:  
       - Let \( \text{actual} \) be the (unspecified) execution that "will happen".  
       - If \( \text{actual} \models ◇\text{battle} \), then the battle occurs.  
     - **Equivocation in Branching Time**:  
       The fatalist conflates two interpretations:  
       - **Weak Reading** (`E◇battle`): "Possibly, a battle occurs."  
         *No problem*: Does not imply necessity.  
       - **Strong Reading** (`A◇battle`): "Necessarily, a battle occurs."  
         *No problem*: Determinism is explicit.  
       - **Equivocation**: The fatalist slips from "true" (which they interpret as \( \text{actual} \models ◇\text{battle} \)) to "necessary" (\( A◇\text{battle} \)).  
         Your framework **blocks this equivocation** because \( \text{actual} \models \varphi \) is inexpressible.  

  ---

  ### Residue Report: What Doesn't Survive the Translation
  #### (1) **No Way to Refer to the "Actual" Execution**  
     - **Problem**: The relativist solution ("true relative to the actual branch") requires singling out one execution as "actual". Your framework has **no syntax/semantics for this** — only quantifiers over all executions (`A`, `E`).  
     - **Consequence**: The second way out (relativism) is **unsayable** without adding a designated "actual" branch (e.g., a privileged scheduler or a "thin red line").  
     - **Flagged Assumption**: Your semantics treats all branches as equally real. Relativism requires asymmetry (one branch is ontologically privileged).

  #### (2) **Tenselessness and the "Open Future"**  
     - **Problem**: "Tomorrow" is just an index (e.g., \( \text{state}_{t+k} \)), and the past/future are symmetric in the state graph. The intuition that "the future is open (branching) but the past is fixed (linear)" **cannot be expressed** because:  
       - Past states are unique (predecessors are linear), but this is structural, not semantic.  
       - No operator captures "becoming" (e.g., branches "collapsing" as time passes).  
     - **Consequence**: The worry that "the future is open in a way the past isn’t" **fails to be formulable**. Your framework answers it by making branching a static feature of the model.  

  #### (3) **Bivalence Denial Mismatch**  
     - In your logic, "truth" is defined via executions:  
       - "There will be a battle" is true iff \( A◇\text{battle} \).  
       - It is false iff \( A□\neg\text{battle} \) (equivalently, \( \neg E◇\text{battle} \)).  
     - **Problem**: If \( E◇\text{battle} \land E□\neg\text{battle} \) (battle is possible but not necessary), the statement is **not bivalent** — but this is a fact about the model, not a semantic indeterminacy. Philosophers deny bivalence *even for the actual future*, which your framework cannot express.  

  #### (4) **Scheduler Dependence**  
     - **Hidden Assumption**: In concurrency, schedulers resolve non-determinism. But:  
       - If the scheduler is known, `A`/`E` quantify over scheduler-defined executions.  
       - If the scheduler is unknown, executions are truly non-deterministic.  
     - **Philosophical Gap**: The debate assumes **metaphysical openness** (no hidden scheduler). Your framework may inadvertently imply a scheduler (e.g., as a resolution mechanism).  

  ---

  ### Does This Count Against Your Framework or the Philosophical Worry?
  - **Against Your Framework?**  
    No, for its intended purpose. Your framework excels at verifying concurrent systems (e.g., safety: "bad states never reached", liveness: "good states eventually reached"). The "open future" worry is **external** to these goals — it’s a metaphysical concern, not an engineering one.  
    - **Strength**: Branching time cleanly separates necessity (`A`), possibility (`E`), and contingency (\( E\varphi \land E\neg\varphi \)).  

  - **Against the Philosophical Worry?**  
    Partly. The worry assumes a **dynamic reality** (the "actual" future is unfolding). Your framework shows this is **irreducible to "all/some" quantification** over static branches. If reality is fundamentally branching (e.g., Everettian quantum mechanics), the worry evaporates. But if reality has a single timeline, your framework cannot model "actuality" without extension.  

  #### Recommendation
  - To capture the debate fully, extend your logic with:  
    - A distinguished **actual execution** (e.g., as in Ockhamist branching time).  
    - **Temporal indexicals** (e.g., "now", "tomorrow" as dynamic labels).  
  - Without extensions, the debate reveals a **limitation of branching time for metaphysics** — but not for model checking.  

  **Final Verdict**: Your framework handles *contingency* via `E`/`A`, but "openness" (as understood in philosophy) requires more. This doesn’t weaken your approach — it clarifies its scope. The philosophers' worry may stem from intuitions incompatible with non-deterministic formalisms.
