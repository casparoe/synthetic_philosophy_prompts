prompt: |-
  I direct a small research program at a philanthropic institute, and I have to settle its agenda for the next three years: about six researchers, mostly philosophers with a couple of decision theorists, and no empirical work of our own beyond reanalysis of data that already exists. The program exists because the institute's allocators have to make real-time trade-offs across beneficiaries of very different kinds — people in different societies with different reporting conventions, animals whose evidence base is behavioural rather than testimonial, and, in the background, the possibility that some future beneficiaries will be systems whose architecture makes both of those evidence sources unavailable. The output is supposed to be a comparison protocol: a documented procedure that takes noisy, heterogeneous evidence about well-being and returns something an allocator can rank, together with an honest statement of what the procedure assumes.

  Two constraints have been imposed from above and are not negotiable. First, the protocol must be neutral across the main substantive accounts of welfare: it may not presuppose that well-being consists in valenced conscious experience, or in the satisfaction of preferences, or in the instantiation of some objective list. Second, it may not assume full comparability, in the sense of a common zero together with a common unit; the trustees regard that as the assumption that has done the most damage in past cost-benefit practice, and they want comparisons built up from weaker informational permits.

  Within those constraints I need a defended ordering, not a survey. Here are the questions I have been circling, so that you can reorder, merge, or reject them rather than reproduce them.

  First: whether the components of comparability really separate. As I understand the standard taxonomy, a common unit without a common zero still supports aggregations that trade gains against losses at fixed rates, but not rules that turn on where anyone sits relative to a shared zero; a common zero with only ordinal level comparisons supports maximin-shaped rules but not trade-off rates. If those components are separable, the program's central decision is which one to try to secure, and everything else follows. If every route to one secretly delivers the other, the decision is illusory and the whole shape of the agenda changes. I want that adjudicated.

  Second: the creation case. Comparisons that involve bringing a new being into existence require comparing a possible life against there being no subject at all, which is not a point on anyone's scale. Something has to play the role of a neutral level, and I am told that the choice of that level does as much work as the choice of a population principle — that it effectively determines whether the protocol displays repugnant-conclusion-shaped behaviour. Is fixing the neutral level part of the comparison problem at all, or is it a separate problem smuggled in under the same budget?

  Third: architectural diversity. For animals we lack self-report; for hypothetical future systems we may lack behaviour in the relevant sense too, and have only structural or functional facts. Is there a principled distinction between the evidence being bad and there being no fact of the matter, and can the protocol say which situation it is in without first settling which theory of welfare is true? If the neutrality constraint makes this question unanswerable in principle, say so and drop it rather than ranking it.

  Fourth: calibration of heterogeneous reports. Survey methodologists have vignette-based techniques for correcting the fact that different populations use scale endpoints differently. Is the philosophical residue here just applied measurement error, or does correcting differential scale use already presuppose the cross-population comparability that was supposed to be in question? I suspect a circularity, and I want to know whether it is benign.

  What I want back: three or four questions, ranked, and for each a statement of what makes it upstream — whose answers change depending on it — how tractable it is for the people I have in three years with no new data, how neglected it is by those working on adjacent problems, and what would move it up or down the list. Name the criteria you are using to weigh upstream-ness against tractability against neglectedness, and say where they conflict. Add an explicit not-doing list: one or two questions that look central in this area but that you would cut, with the reason — that the answer would not constrain the protocol, that it collapses into a verbal dispute, or that it is really a request for a theory of welfare. Finally, tell me which of my four questions are the same question in different words.
reasoning: |-
  Alright, let's start by unpacking the user's query. They're directing a small research program at a philanthropic institute, focused on developing a comparison protocol for allocators who need to make trade-offs across diverse beneficiaries—humans from different societies, animals, and potentially future artificial systems. The main constraints are neutrality across welfare theories and avoiding full comparability (common zero and unit). The output should be a procedural protocol that handles noisy, heterogeneous data and provides a rankable output with clear assumptions.

  First, I need to understand the user's explicit questions. They have four main concerns: separability of comparability components, the creation case, architectural diversity, and calibration of heterogeneous reports. But their deeper need is to prioritize these questions effectively for a three-year timeline with limited resources. 

  Looking at their role, they're a program director with philosophers and decision theorists. No empirical work, just reanalysis. So tractability without new data is crucial. The institute's allocators need practical tools, so theoretical insights must translate into actionable protocols. The unspoken pressures here might include justifying the program's impact to trustees, ensuring the protocol is implementable under real-world constraints, and avoiding past mistakes in cost-benefit analysis.

  The user wants a ranked list of questions, but they also need criteria for prioritization: upstream impact, tractability, neglectedness. They mentioned conflicts between these criteria, so I should identify where trade-offs occur. Also, a not-doing list to avoid scope creep is essential, especially questions that collapse into welfare theory or don't constrain the protocol.

  Breaking down each question:
  1. **Separability of comparability components**: This seems foundational. If common zero and unit aren't separable, the entire agenda changes. It's highly upstream because it dictates whether the team needs to pursue one component or both. Tractability is moderate—philosophers can handle the conceptual work, but formal decision theorists might model it. Neglectedness is high since most literature assumes full comparability or avoids the distinction. If it's inseparable, the protocol must handle both components together, affecting the research direction.

  2. **Calibration of heterogeneous reports**: This is about measurement circularity. If adjusting scale use presupposes comparability, it's a major issue. Upstream because it affects data input reliability. Tractability is moderate using existing data and vignette studies. Neglectedness varies; survey methods exist, but philosophical circularity is under-discussed. However, if neutrality prevents resolving it, this might be a dead end, pushing it lower in priority.

  3. **Architectural diversity**: Evidence vs. no fact of the matter. Crucial for including animals and future systems. Upstream for evidence handling, but neutrality constraint might make it unsolvable. If so, it should be dropped. Tractability is low without new data; it's theoretical. Neglectedness is mixed—animal welfare has work, but future systems are speculative. Risk of wasting resources if neutrality blocks progress.

  4. **Creation case**: Neutral level for existence. Important for population ethics but might be downstream. If neutral level is tied to comparability components, it could merge with question one. Tractability is high with existing philosophical work. Neglectedness low due to extensive literature. However, if it's separable, it's a distinct but less urgent issue.

  Prioritization conflicts: Upstream-ness vs. tractability. Question 1 is highly upstream but moderately tractable. Question 3 is upstream but low tractability under neutrality, so it might be cut. Question 2's circularity could be a showstopper but is more tractable. 

  Merging questions: Creation case (2) might collapse into separability (1) if neutral level depends on comparability structure. Architectural diversity (3) might be a non-starter due to neutrality, so drop it.

  Final ranking: Start with separability (1) as it dictates the framework. Then calibration (4) for data input issues. Creation (2) next if resources allow. Drop architectural diversity (3) if neutrality prevents resolution.

  Not-doing list: Cutting architectural diversity due to neutrality constraints. Also, avoiding questions about defining welfare, as that violates neutrality.
answer: |-
  Based on your constraints, goals, and resources, here's a prioritized research agenda addressing upstream impact, tractability, neglectedness, and conflicts. I've merged/reordered your questions fundamentally, as they share conceptual roots.

  **Ranked Research Questions**  
  *(Criteria: Upstream impact > Tractability under constraints > Neglectedness)*  

  1. **Do comparability components (common unit vs. common zero) functionally separate in practice?**  
     - **Upstream Impact**: Highest. This determines whether you pursue *one* component (e.g., unit-only for trade-offs) or both. If inseparable, your protocol must treat comparability as a package deal, radically changing design choices (e.g., aggregation rules). Decision theorists’ models depend entirely on this.  
     - **Tractability**: Moderate-High. Uses formal analysis of existing decision theories (e.g., Harsanyi vs. maximin frameworks) and welfare axioms. Requires philosophers to map conceptual separability and decision theorists to model implications. No new data needed.  
     - **Neglectedness**: High. Most literature assumes either full comparability or full incomparability; the "partial comparability" niche rarely dissects components.  
     - **Move up if**: Early analysis shows one component implies the other. Move down if: Proof emerges that neutrality constraint forces inseparability.  

  2. **Can cross-population calibration avoid presupposing comparability?**  
     - **Upstream Impact**: High. If circular, your protocol cannot use standard survey tools (e.g., vignettes), forcing entirely new evidence-aggregation methods. Affects all human/animal data.  
     - **Tractability**: Moderate. Reanalyze calibration studies (e.g., WHO health surveys) to test if "corrected" scores assume interpersonal comparability. Philosophers critique assumptions; decision theorists model circularity risks.  
     - **Neglectedness**: Moderate. Methodologists address scale variance but rarely the *philosophical* circularity; welfare economists often assume comparability.  
     - **Move up if**: Vignette studies explicitly invoke comparability assumptions. Move down if: Foundational work shows calibration is purely statistical.  

  3. **Is the "neutral level" for existence comparisons derivable from minimal comparability?**  
     - **Upstream Impact**: Medium. Affects population ethics decisions (e.g., repugnant conclusions) but less central than Q1–2. Changes protocol outputs for creation cases.  
     - **Tractability**: High. Analyze population ethics models (e.g., critical-level utilitarianism) under weakened comparability. Uses existing philosophical work; no data needed.  
     - **Neglectedness**: Low. Extensive literature on neutral levels (e.g., Broome, Blackorby), but rarely integrated with *partial* comparability.  
     - **Move up if**: Linked to Q1 (e.g., if a common zero is needed for neutrality). Move down if: Proved reducible to welfare theory (violating neutrality).  

  **Not-Doing List**  
  - **Architectural diversity (your Q3)**: **CUT**. The neutrality constraint makes this unsolvable. Distinguishing "bad evidence" from "no fact of the matter" *requires* presupposing a welfare theory (e.g., only behavior matters if welfare is experiential). No neutrality-compliant answer exists.  
  - **"What is well-being?"**: **CUT**. Explicitly violates neutrality. Your protocol must be agnostic on whether welfare is hedonic, preference-based, etc.  

  **Question Mergers**  
  - Your Q1 (separability) and Q2 (creation/neutral level) **partially merge**. The neutral level’s viability depends on whether a common zero is separable/attainable. They share a core: "What minimal comparability structure is feasible?"  
  - Your Q4 (calibration) was rephrased as #2 above; your original framing conflates *evidence* with *comparability*, which are distinct issues.  

  **Conflicts Between Criteria**  
  - **Upstream vs. Tractability**: Q1 is maximally upstream but requires abstract modeling (harder for pure philosophers). Q2 is less upstream but more empirical (easier with reanalysis).  
  - **Neglectedness vs. Tractability**: Architectural diversity (cut) is highly neglected but intractable under neutrality; creation cases (Q3) are well-studied but tractable.  
  - **Resolution**: Prioritize Q1 precisely *because* it is upstream. If comparability components collapse, your entire agenda simplifies.  

  **Why This Ranking?**  
  1. **Q1 first** because it is the *gatekeeper*: the answer dictates whether you can isolate trade-off rules (unit-only) or need holistic comparability.  
  2. **Q2 second** because calibration is the primary *practical barrier* for human/animal data. A circularity would force a protocol redesign.  
  3. **Q3 last** as it’s a *special case* of comparability (zero-point questions) and is actionable only after Q1.  

  **Resources Alignment**  
  - Philosophers lead on Q1 (conceptual separability) and Q3 (normative implications of neutrality).  
  - Decision theorists model Q1 (formal separability) and Q2 (calibration circularity).  
  - All collaborate on protocol design implications.  

  **Risks**: If Q1 reveals inseparability, the agenda expands (require both components). If Q2 proves circular, you abandon standard calibration tools. Both are "fail-fast" questions worth front-loading.
