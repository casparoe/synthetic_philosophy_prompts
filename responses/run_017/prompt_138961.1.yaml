prompt: |-
  Design a case with the structure of Parfit's hitchhiker — one party must supply a benefit first, the other must pay afterwards, and at the later node paying is contrary to what the payer most wants — but relocate it: no roads, deserts, or cars. Put it somewhere ordinary and present-day, a hospital, a workplace, a tenancy, a lab, where the stakes are real for a normal person and the benefit genuinely has to be delivered before any payment can be extracted.

  Now engineer the case so that the payer's credibility can be secured only by rational irrationality, in the strict sense: the payer does something in advance that leads them, at the moment of action, to do what they then have no self-interested reason to do. Make each of the three standard alternatives fail for a structural reason that you state explicitly: external commitment (escrow, deposit, contract, any third party with enforcement power); repeat play and reputation; and the familiar contractarian solution, a transparent disposition to comply of the constrained-maximizer sort. Add these constraints: the encounter is genuinely one-shot and effectively anonymous; there is no enforcement technology and no reliable intention- or lie-detection, only what one human being can read off another in a conversation; the payer cannot simply choose to hold a belief, so any self-modification has to run through something a person could actually do in an afternoon; at the moment of paying the payer knows both that paying buys them nothing further and that no one who matters will ever learn which way they chose; and the change they undergo must be costly to fake, so that a pretender cannot emit the same signal without undergoing the same change — say what the signal is and why it cannot be mimicked cheaply. It follows that the disposition must also be selective: it must not turn the payer into a general sucker, or adoption would not be worth it.

  Then do the demonstration. Give the sequence of choices, say what each of the four accounts prescribes or predicts at each node and why, and mark where the credibility problem — making the disposition legible to the counterparty — is doing work that the rationality problem cannot do on its own. Then remove the unfakeability condition and tell me whether the case collapses back into a plain assurance problem or whether something of the puzzle survives. Finally, take a position on the nub: on a present-aim theory of rationality the cultivated disposition is not irrational to act on, since at the moment of acting it is what the agent most wants, whereas on a reward-based or reasons-based theory it is; say which verdict your case actually supports, say which of the four accounts comes out worst, and give the strongest objection a defender of that account would make against your case. I want to use this in a seminar to argue that the hard part of the hitchhiker is credibility rather than rationality, so flag any feature of your scenario that would let a student reply that the verdicts were stipulated rather than generated from the accounts.
reasoning: |-
  We are designing a case in the spirit of Parfit's hitchhiker but set in an ordinary, present-day context. The structure is:

  1. One party (the benefactor) must supply a benefit first.
  2. The other party (the payer) must pay afterwards.
  3. At the time of payment, paying is contrary to what the payer most wants (i.e., the payer would prefer not to pay if they could get away with it).

  We also require:
  - The encounter is one-shot and effectively anonymous (no reputation effects).
  - No enforcement technology (contracts, escrow, third parties, etc.) and no reliable lie-detection beyond ordinary human interaction.
  - The payer cannot simply choose to believe something; any self-modification must be feasible in an afternoon and must be costly to fake so that it cannot be mimicked without undergoing the same change.
  - The disposition must be selective: it doesn't make the payer a general sucker.

  We are to engineer the case so that the payer's credibility is secured by "rational irrationality": the payer does something in advance that leads them, at the moment of action, to do what they then have no self-interested reason to do.

  We must also show why the three standard alternatives fail:

  A. External commitment (e.g., contract, escrow): fails because there is no enforcement technology and the encounter is anonymous and one-shot.

  B. Repeat play and reputation: fails because it's one-shot and anonymous.

  C. Transparent disposition (constrained maximizer): fails because without a reliable way to detect the disposition (and because the payer cannot simply choose to have a disposition and have it be credible without the costly signal), the benefactor cannot be sure the payer is a constrained maximizer.

  The case must be set in a modern ordinary setting (hospital, workplace, tenancy, lab). I choose a **medical context**:

  ### The Case: The Experimental Treatment

  **Setting:** A research hospital. A patient (the Payer, let's call her Pat) has a rare, life-threatening condition. There is an experimental treatment that might save her, but it's only available through a researcher (the Benefactor, Dr. Ben) who is running an unapproved, underground trial. Dr. Ben has developed the treatment but cannot legally offer it. He is willing to provide it for a large fee, but only if he is sure he will be paid.

  **The Problem:** The treatment must be administered first (it takes a week to work). Only after the treatment has been administered and Pat is cured can she pay (because she will inherit money from a relative who is about to die, but only if she is alive to inherit). The inheritance is large enough to cover the fee and more. However, once cured, Pat has no legal obligation to pay (the arrangement is illegal and unenforceable) and she might prefer to keep the money.

  **Structure:**

  - **Node 1 (Benefit Delivery):** Dr. Ben must decide whether to administer the treatment. He will only do so if he believes Pat will pay afterwards.
  - **Node 2 (Payment):** After being cured, Pat must decide whether to pay Dr. Ben. At this point, she has no self-interested reason to pay: the treatment is already done, she is cured, and keeping the money is better for her. Moreover, because the arrangement is illegal and anonymous (they are using fake names and meeting in secret), there is no reputation loss and no legal enforcement.

  **The Credibility Problem:** Dr. Ben needs to be sure that Pat will pay at Node 2. But at Node 2, Pat has every reason not to pay. So Pat must do something at an earlier time (before Node 1) that will commit her to paying at Node 2, even when it's not in her self-interest.

  **The Solution: Rational Irrationality via Costly Ritual**

  Pat must undergo a costly ritual that changes her psychology in a way that makes her value keeping her promise at Node 2, even when it's against her self-interest. The ritual must be:

  1. Costly to fake: It must be so aversive that only someone who truly intends to pay would undergo it.
  2. Selective: It doesn't make Pat a general sucker (she doesn't become generally more altruistic, just committed to this specific promise).
  3. Feasible: Done in an afternoon.

  **The Ritual:** Pat and Dr. Ben design a ritual. Pat must write a heartfelt, non-anonymous public letter (to be posted on her social media, which she uses under her real identity) explaining her condition and her deep gratitude to Dr. Ben for saving her life, and pledging to pay him the fee. However, the letter is written in a way that it will be posted automatically after the treatment is administered, unless Pat actively cancels it during the treatment week. The catch: to cancel the letter, Pat must perform a very aversive task (say, solve an extremely difficult and painful set of puzzles under time pressure that takes hours and causes significant distress, or perhaps a physically uncomfortable procedure). The ritual of setting up the letter is not costly, but the act of cancellation is. Importantly, the letter itself, if posted, would create a social obligation (but note: the stakes are that Pat might not care about that after she is cured, especially if she can explain it away as coerced or irrational). However, the key is that during the ritual setup, Pat also undergoes a psychological conditioning: she is hypnotized (or uses a self-hypnosis app) to associate breaking the promise with intense guilt and the act of paying with relief. The hypnosis is administered by Dr. Ben (who has some training) and is tailored to this specific promise. The hypnosis session is aversive (it involves recalling past guilt and amplifying it) and takes several hours.

  **Why it's costly to fake:** The hypnosis session is designed to be unpleasant. It requires the participant to confront deep personal failures and to experience heightened negative emotions. A pretender would not be able to endure the session without actually undergoing the psychological change because the process is inherently distressing and only by genuinely engaging with it (and thereby internalizing the commitment) can one get through it without breaking down. Moreover, the aversive cancellation task is set to be so unpleasant that no one would choose to do it unless they were determined to break the promise. Thus, the signal (undergoing the ritual) is costly and leads to the desired disposition.

  **Why the Three Alternatives Fail:**

  1. **External Commitment:** There is no enforceable contract because the treatment is illegal. No court would enforce it. Escrow isn't possible because the payment depends on Pat being alive and cured, which is the outcome of the treatment, and there's no third party they can trust (and who would handle an illegal transaction?).

  2. **Repeat Play and Reputation:** This is a one-shot interaction. They are using fake names and meeting in secret. Dr. Ben won't know Pat's real identity (and vice versa) beyond what is necessary for the treatment. After the cure, Pat can disappear.

  3. **Transparent Disposition (Constrained Maximizer):** Dr. Ben cannot reliably detect whether Pat is a constrained maximizer (i.e., someone who keeps promises only if others do the same). Even if Pat were to say she is, there's no way to verify. Moreover, in this one-shot anonymous setting, even a constrained maximizer would defect because they know the other party (Dr. Ben) has already moved (administered the treatment) and there's no future interaction. So constrained maximization wouldn't bind in this case.

  **The Sequence:**

  - **Pre-Node 0 (The Ritual):** Pat undergoes the hypnosis session and sets up the automatic letter. This is costly (time, emotional distress). She also knows that if she changes her mind, she must endure the aversive cancellation task.

  - **Node 1:** Dr. Ben observes that Pat has undergone the ritual. He knows the ritual is costly and that it changes Pat's psychology so that at Node 2 she will pay. He also knows that the ritual is designed to be unfakeable. Therefore, he administers the treatment.

  - **Node 2:** Pat is cured. She now has the money. She must decide whether to pay. Because of the hypnosis, she now feels an overwhelming sense of guilt at the thought of not paying and a strong urge to pay to relieve that guilt. Even though she knows that paying buys her nothing (the treatment is done, and she won't face social consequences because the letter hasn't been posted and she can still cancel it by doing the aversive task), the psychological change makes her want to pay more than anything else at that moment. So she pays.

  **Rational Irrationality:** The ritual (at Pre-Node 0) was rationally chosen by Pat because it allowed her to get the treatment. But at Node 2, the act of paying is irrational from a self-interested perspective (she loses money for no gain) but is driven by the psychological change (the guilt and the desire for relief). The ritual made her, at Node 2, have a present aim that overrides her self-interest.

  **The Four Accounts:**

  1. **External Commitment:** Not available (as explained).

  2. **Reputation:** Not available (one-shot, anonymous).

  3. **Constrained Maximization:** 
     - Prediction: Without the ritual, a constrained maximizer would not pay at Node 2 because Dr. Ben has already delivered the benefit and there is no future interaction. Therefore, Dr. Ben would not administer the treatment. With the ritual, constrained maximization doesn't apply because the ritual changes Pat's psychology in a way that is not about constrained maximization (it's about a specific commitment).

  4. **Rational Irrationality (with the ritual):** 
     - Pre-Node 0: Pat rationally chooses the ritual to get the treatment.
     - Node 2: Pat pays because of the psychological change, which is not self-interested but is her present aim.

  **Where Credibility Does the Work:** Without the ritual, Dr. Ben has no reason to believe Pat will pay. The ritual provides a costly signal that Pat has changed her psychology so that she will pay. The rationality problem (that at Node 2 paying is not rational) is solved by the psychological change, but the credibility problem (convincing Dr. Ben) is solved by the costly ritual. Without the costly signal, even if Pat had undergone a psychological change, Dr. Ben wouldn't know. The ritual makes the disposition legible.

  **Remove the Unfakeability Condition:** Suppose the ritual is not costly to fake (e.g., Pat could just pretend to undergo hypnosis or the hypnosis doesn't actually change her). Then Dr. Ben cannot distinguish between a Pat who has undergone the real change and one who hasn't. The case collapses into a plain assurance problem: Dr. Ben must guess whether Pat is honest. He might still administer the treatment if he believes Pat is honest, but there's no mechanism to force honesty. The puzzle of how to commit when it's against future self-interest is not solved.

  **Verdict on Rationality:**

  - **Present-Aim Theory:** At Node 2, Pat most wants to pay (because of the guilt and the desire for relief). Therefore, paying is rational.
    
  - **Reward-Based or Reasons-Based Theory:** Paying costs her money and gains her nothing. Therefore, it is irrational.

  The case supports the present-aim theory because at the moment of action, the agent is doing what she most wants. However, from a forward-looking perspective (at Pre-Node 0), the decision to undergo the ritual was rational because it led to her being cured.

  **Which Account Comes Out Worst?** The constrained maximization account comes out worst because it cannot explain why Pat would pay at Node 2 in a one-shot anonymous interaction. The constrained maximizer would defect. Therefore, Dr. Ben would not administer the treatment without the ritual. The ritual is not part of constrained maximization.

  **Strongest Objection from a Defender of Constrained Maximization:** A defender might argue that the ritual is just a form of constrained maximization because Pat is adopting a disposition (to keep promises in this kind of situation) to achieve a mutually beneficial outcome. However, the objection fails because constrained maximization typically requires that the disposition be triggered by the counterparty also being a constrained maximizer. Here, Dr. Ben is not making a promise (he is delivering the benefit first) and there is no way for Pat to condition her behavior on Dr. Ben's type. Moreover, constrained maximization does not usually involve such a costly and specific psychological change.

  **Flagging Stipulation:** A student might object that the verdicts are stipulated because we have assumed that the hypnosis works and that the ritual is unfakeable. However, the accounts are being tested against the structure. The key is that without the costly signal, the disposition is not legible. The accounts are not generating the solution; the ritual is. We can adjust the case to make the ritual more plausible (e.g., by using a known psychological phenomenon), but the point is the structure.

  **Final Refinement:** To make the psychological change more plausible, we might use a real-world analogue: Pat takes a drug (under Dr. Ben's supervision) that enhances suggestibility and then undergoes a session where she makes a solemn promise and associates breaking it with a nauseating smell (using aversive conditioning). The drug has side effects (headache, nausea) making the ritual costly. The cancellation task could be holding one's hand in ice water for 10 minutes. These are things that could be done in an afternoon and are costly to fake (you can't fake the side effects of the drug, and the ice water is painful). The signal to Dr. Ben is that Pat is willing to endure the drug and the conditioning session.

  This case should serve well for the seminar.
answer: |-
  ### Parfit's Hitchhiker Relocated: The Experimental Treatment Case

  **Setting:** A private medical research lab. Dr. Ben is an unlicensed researcher offering an illegal, life-saving gene therapy for a rare terminal illness. Pat, a patient with weeks to live, lacks insurance coverage and cannot afford conventional treatment. Dr. Ben can cure Pat with a single injection, but the therapy requires a week to take effect. Pat will inherit $500,000 from a relative who dies tomorrow—but only if Pat survives to claim it. Dr. Ben demands $400,000 as payment upon cure. The interaction is one-shot, anonymous (Pat uses a pseudonym; Dr. Ben operates under a false identity), and no third party can enforce the agreement due to its illegality.

  #### Structure of the Interaction
  1. **Node 1 (Benefit Delivery):** Dr. Ben must inject Pat with the therapy. He will only do this if convinced Pat will pay later.  
  2. **Node 2 (Payment):** After being cured, Pat decides whether to pay Dr. Ben. At this point:  
     - Paying costs Pat $400,000 with no tangible benefit (therapy is complete; no legal/social consequences due to anonymity).  
     - Not paying is optimal for Pat's self-interest ($400,000 richer).  
     - Dr. Ben cannot retaliate or track Pat down.  

  **Credibility Problem:** Dr. Ben won't act at Node 1 unless Pat's commitment to pay at Node 2 is credible. But at Node 2, paying is against Pat's self-interest.  

  ---

  ### Engineering Credibility via Rational Irrationality
  Pat undergoes a **costly pre-commitment ritual** before Node 1 to make payment at Node 2 credible. The ritual exploits **aversive conditioning** to alter Pat's psychology:  

  1. **The Ritual:**  
     - Pat submits to a 3-hour session using a commercial "ethical conditioning" VR headset and biofeedback device. The session:  
       - Forces Pat to vividly imagine scenarios where they break promises, paired with electric shocks (mild but painful) and nauseating smells.  
       - Links the act of paying Dr. Ben to intense relief (pleasant visuals, dopamine-triggering sounds).  
     - The conditioning is hyper-specific: It only triggers guilt/shame if Pat *withholds payment from Dr. Ben after being cured*.  
     - After conditioning, Pat writes and seals a payment pledge (e.g., "I vow to pay Dr. Ben $400,000 upon cure"), then incinerates it in a lab furnace. The incineration is symbolic—no evidence remains.  

  2. **Costly to Fake & Selective:**  
     - **Why costly?** The shocks/smells induce physiological stress (measurable via cortisol spikes). Enduring this for 3 hours requires genuine engagement; faking distress is impossible without equivalent suffering. A pretender would quit early or show inconsistent biometrics (e.g., flat heart rate), which Dr. Ben monitors.  
     - **Why selective?** The conditioning targets only this specific promise. Pat remains self-interested in other contexts (e.g., they would refuse to pay a random stranger).  
     - **Feasible:** Done in an afternoon with off-the-shelf tech.  

  3. **How It Solves the Problem:**  
     - At Node 2, the conditioning makes Pat *feel overwhelming guilt* at the thought of not paying. Paying becomes their strongest desire (to avoid psychological agony), overriding self-interest.  
     - Dr. Ben observes Pat endure the ritual, confirming their commitment. Biometric proof makes mimicry impossible.  

  ---

  ### Why Standard Alternatives Fail Structurally
  - **External Commitment (e.g., Escrow/Contract):**  
    **Failure reason:** No enforcement. Escrow requires a neutral third party, but the transaction's illegality voids contracts. Even if a shady escrow existed, Pat could disappear after the cure.  

  - **Repeat Play/Reputation:**  
    **Failure reason:** The interaction is one-shot and anonymous. Dr. Ben and Pat use burner phones and fake IDs. No future interactions or reputation at stake.  

  - **Transparent Disposition (Constrained Maximizer):**  
    **Failure reason:** Dr. Ben cannot detect Pat's disposition. Constrained maximizers only cooperate if others reciprocate, but Dr. Ben moves first (injects therapy). At Node 2, Pat knows Dr. Ben has already acted, so defection is dominant. Without the ritual, Pat could lie about their disposition, and Dr. Ben has no lie-detection tools.  

  ---

  ### Sequence of Choices: Predictions by Account
  | Node         | Action                               | Rational Irrationality (with Ritual)                               | External Commitment                     | Repeat Play/Reputation              | Constrained Maximizer                     |
  |--------------|--------------------------------------|--------------------------------------------------------------------|------------------------------------------|--------------------------------------|-------------------------------------------|
  | **Pre-Node** | Pat undergoes ritual                 | **Does:** Pat endures ritual to secure therapy. Costly signal convinces Dr. Ben. | **Doesn't apply:** No third party exists. | **Doesn't apply:** No reputation possible. | **Doesn't do:** Disposition is undetectable; ritual isn't part of CM. |
  | **Node 1**   | Dr. Ben injects therapy?            | **Does:** Ritual's cost proves Pat's commitment.                  | **Doesn't:** No escrow to enforce payment. | **Doesn't:** Anonymous, so no reputational incentive. | **Doesn't:** Dr. Ben can't verify Pat's type; risk of defection too high. |
  | **Node 2**   | Pat pays?                            | **Does:** Conditioned guilt makes paying Pat's strongest desire. | **Doesn't:** No penalty for non-payment. | **Doesn't:** No future consequences. | **Doesn't:** Pat defects as Dr. Ben already acted. |

  **Where Credibility (Not Just Rationality) Does the Work:**  
  The ritual solves the *credibility problem* at Node 1 by providing an unfakeable signal of commitment. Without it, even if Pat *intended* to pay at Node 2, Dr. Ben couldn't trust them. The *rationality problem* (Paying at Node 2 being against self-interest) is solved by conditioning, but credibility is the gateway—it enables Dr. Ben to act.  

  ---

  ### Removing the Unfakeability Condition
  If the ritual is cheaply faked (e.g., Pat wears the VR headset but experiences no shocks/smells, or fakes biometrics), the case collapses into a **plain assurance problem**:  
  - Dr. Ben cannot distinguish sincere Pat from a fraud.  
  - He injects therapy only if he subjectively trusts Pat (e.g., based on gut feeling).  
  - No puzzle remains—it’s a simple trust game with no mechanism to force commitment.  

  ---

  ### Verdict on Rationality
  - **Present-Aim Theory:** Paying at Node 2 is rational. The conditioning makes it Pat's strongest desire (to avoid guilt), so acting on it maximizes utility *at that moment*.  
  - **Reward-Based/Reasons-Based Theory:** Paying is irrational. Pat loses $400,000 for no future gain or moral reason (the promise was extracted under coercion-like conditions).  

  **The Case Supports Present-Aim Theory:**  
  Pat's action aligns with their immediate desires. The ritual is a tool for self-modification, making otherwise irrational actions rational *when performed*.  

  **Worst-Performing Account:** **Constrained Maximization (CM).**  
  - CM fails at every node: It cannot generate trust without repeated interactions or transparent dispositions. Dr. Ben has no way to identify Pat as a CM, and even if he could, Pat would defect at Node 2 since Dr. Ben already moved first.  

  **Strongest Objection from a CM Defender:**  
  "Pat *could* adopt a CM disposition without the ritual. If Dr. Ben recognizes this (e.g., via philosophical discussion), he might proceed. Your case stipulates that intention-detection is impossible, but humans often infer dispositions from dialogue. By banning this, you've rigged the scenario against CM."  

  **Rebuttal:** The objection ignores structural constraints. The anonymity and one-shot nature prevent dialogue from building trust—Pat could lie about being a CM. The ritual’s biometric cost provides proof dialogue cannot.  

  ---

  ### Seminar Use: Guarding Against "Stipulation" Accusations  
  - **Flagged Feature:** The ritual's unfakeability (via biometric monitoring) is key. Students might argue this is "stipulated," but it derives from the accounts:  
    - External commitment/reputation fail due to anonymity/enforcement gaps.  
    - CM fails because dispositions are opaque without costly signals.  
  - **Emphasize:** The ritual isn't magic—it's a practical analog of real-world self-binding (e.g., Ulysses contracts). The verdicts flow from the accounts' limitations in one-shot, anonymous settings.  
  - **Pivot Point:** The core takeaway isn't that rational irrationality "wins," but that credibility is the bottleneck. Remove unfakeability, and all accounts fail equally.  

  This case isolates credibility as the hitchhiker's hard problem: Without a costly signal, Pat cannot convince Dr. Ben to act, rendering rationality irrelevant.
