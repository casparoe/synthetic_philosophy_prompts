            For p=1, the bracket: (β-1)(1-n) + (0) = (β-1)(1-n) <0 (since β>=1 and n>1). 

            So the function U(p) increases initially and then decreases, with a maximum at the interior point.

            Therefore, we are confident in the formula.

            We can also note that for the Luring Lottery (β=1), the bracket becomes:

              (0)(1-np) + (1-p) = 1-p

            which is always positive for p<1. So U'(p) = (1-p)^{n-2} * (1-p) = (1-p)^{n-1} >0 for p<1, meaning that U(p) is increasing on [0,1). At p=1, we have a maximum. 

            So the analysis holds.

            Finally, the expected payoff U(p) in the hybrid:

              U(p) = (β-1) p (1-p)^(n-1) + [1 - (1-p)^n]/n

            At the optimal p = β/[n(β-1)+1], we can compute U(p) but it is a bit messy.

            The key point is the behavior of the optimal p as a function of β.

