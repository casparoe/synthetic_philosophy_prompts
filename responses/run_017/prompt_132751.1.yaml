  We are comparing three scenarios:
   1. Platonia dilemma: Large indivisible prize awarded only if exactly one player claims it.
   2. Luring Lottery: A fixed prize is divided equally among all entrants (so if k enter, each gets 1/k of the prize).
   3. Hybrid: Prize is divided among all entrants, but if there is only one entrant, that entrant gets β times the whole prize (with β>=1). 
      Specifically:
        - If k=1: payout = β * prize
        - If k>=2: each entrant gets (prize / k)

   We are to consider superrational players: they all use the same strategy and assume that all others will do the same. 
   The strategy for each player is to enter with probability p.

   We wish to see how the optimal p (that maximizes the expected payoff for a player) changes as β increases from 1 to infinity, 
   and how the behavior of the optimal p changes as we move from the continuous division (β=1) to the all-or-nothing (β→∞) case.

   We note:
    - When β=1: the hybrid is exactly the Luring Lottery.
    - When β→∞: we approach the Platonia dilemma (because the payout for being the only entrant becomes very large, while the payout for multiple entrants remains the same as in Luring Lottery, but note that in Platonia the payout for multiple entrants is 0 unless exactly one enters. However, in our hybrid, for k>=2, each entrant still gets 1/k. So we cannot exactly recover Platonia by taking β→∞ because in Platonia if two or more enter, they all get 0. But note that in the hybrid, if we set β very large, then the only significant payout is when you are the only entrant. Therefore, we should expect that as β→∞, the hybrid behaves more like Platonia.)

   However, note the difference: 
     In Platonia: 
          Payout = { 1 (the whole prize) if exactly one enters; 0 otherwise. }
     In the hybrid with β fixed and large:
          Payout for k=1: β (which we want to be large)
          Payout for k>=2: 1/k (which is small, especially when k is large) but not zero.

   So the hybrid does not exactly become the Platonia dilemma until we also change the rule for k>=2 to zero. But the problem states that we are interpolating by having a multiplier β for the sole entrant. We are to see how the optimal p changes as β increases.

   How to model:

   Let there be n players (in the examples, n=20). Each independently decides to enter with probability p.

   The expected payoff for a given player if they enter:
     - If they enter, then the number of other entrants is a binomial random variable: Y ~ Binomial(n-1, p).
     - Then the total entrants including this player: k = Y+1.

     The payout for this player:
          if Y = 0 (so k=1): then payout = β
          if Y >= 1 (so k>=2): then payout = 1/(Y+1)

     Therefore, the expected payoff for entering is:
          E = β * P(Y=0) + E[1/(Y+1) | Y>=1] * P(Y>=1)
            = β * (1-p)^(n-1) + sum_{y=1}^{n-1} [1/(y+1)] * C(n-1, y) * p^y * (1-p)^(n-1-y)

     Alternatively, we can write:
          E = β * (1-p)^(n-1) + sum_{k=2}^{n} [1/k] * C(n-1, k-1) * p^{k-1} * (1-p)^{n-k}

     because when k = y+1 (so y = k-1), then the event that the total entrants is k (with our player and k-1 others) has probability C(n-1, k-1) p^{k-1} (1-p)^{n-k}.

   But note: the player also has the option not to enter. If they do not enter, they get 0. So the expected payoff for the player is:
          Payoff = p * E   [because they enter with probability p and get E, otherwise 0]

   However, the superrational approach assumes that all players use the same p and they are trying to choose p to maximize the expected payoff per player. 
   But note that in the superrational equilibrium, the p chosen should be such that each player, knowing that all others are using that p, would also choose the same.

   Therefore, we wish to maximize the expected payoff per player when they enter with probability p. But note that the expected payoff for a player who is playing the strategy is:
          U(p) = p * [ β * (1-p)^(n-1) + sum_{k=2}^{n} (1/k) * C(n-1, k-1) p^{k-1} (1-p)^{n-k} ]

