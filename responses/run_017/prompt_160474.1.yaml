  Below is a complete, runnable classroom simulation designed to meet your goals. It emphasizes the **electoral incentive for traceable benefits** (your key mechanism) and includes the staggered lot chamber. The game runs in 75 minutes with 24 students.

  ---

  ### **Game Setup: "Chambers of Influence"**
  **Districts & Roles:**  
  - Divide the class into 6 districts of 4 students each.  
  - Assign each student a "station" (socioeconomic status) determining starting campaign tokens:  
    - **High Station (1 per district):** 10 tokens  
    - **Medium-High (1 per district):** 7 tokens  
    - **Medium-Low (1 per district):** 4 tokens  
    - **Low Station (1 per district):** 1 token  

  **Chambers:**  
  1. **Elected Chamber (EC):** 6 seats (1 per district).  
  2. **Lot Chamber (LC):** 6 seats (randomly selected, mirrors class demographics).  
  - **LC Rules:** Non-renewable terms (no one serves twice). Staggered in Round 3 (3 new, 3 holdovers).  

  **Motions:**  
  Each round, both chambers vote on **two motions** (total benefit per motion = 24 points):  
  - **Type A (Traceable):** "Build a Bridge in District [X]" → Gives **6 points** to all students in **one specific district**.  
  - **Type B (Untraceable):** "Fund a National Education Grant" → Gives **1 point** to **every student** in all districts.  
  *(Example: Type A benefits 4 students × 6 pts = 24 pts total. Type B benefits 24 students × 1 pt = 24 pts total.)*  

  **Token Economy:**  
  - Tokens = Campaign currency (not redeemable for points).  
  - **Elections:**  
    - To run for EC, spend ≥1 token (secret bid).  
    - Highest spender in district wins EC seat (ties broken by station rank).  
    - **Seniority Bonus:** EC winners get +3 tokens next round if re-elected.  
  - Tokens refresh to starting amounts each round (no saving).  

  **Winning:**  
  - Points determine rankings. Top 3 scorers get small prizes (e.g., candy, extra credit).  

  ---

  ### **Timeline (75 Minutes Total)**
  | **Phase**          | **Time** | **Activity** |  
  |---------------------|----------|--------------|  
  | **Setup**          | 10 min   | Assign districts/stations. Explain rules (emphasize tokens, motions, voting). Avoid terms like "sortition" or "elected vs. lot"—use "Chamber A" (EC) and "Chamber B" (LC). |  
  | **Round 1**        | 20 min   | - **EC Election:** Districts hold elections (5 min).<br>- **LC Selection:** Randomly draw 6 LC members (2 min).<br>- **Motions:** Roll dice to pick a district for Type A (e.g., "Bridge in District 4"). Type B is always universal (5 min).<br>- **Voting:** Chambers vote separately on motions. Record votes (5 min).<br>- **Outcome:** Implement **both motions** if they pass (no budget cap). Award points (3 min). |  
  | **Round 2**        | 15 min   | Repeat Round 1. EC incumbents get +3 tokens. |  
  | **Round 3**        | 15 min   | - **Staggered LC:** 3 LC members from Round 2 stay; 3 new drawn.<br>- Repeat motions/voting. |  
  | **Points Tally**   | 5 min    | Calculate points. Announce top 3. Distribute prizes. |  
  | **Debrief**        | 10 min   | Guided discussion (questions below). |  

  ---

  ### **Predictable Problems & Limitations**
  **What Will Go Wrong:**  
  1. **Time Crunch:** Deliberation or voting may run over. Mitigate by using strict timers.  
  2. **Token Hoarding:** Students may not spend tokens (thinking they "save" them). Clarify tokens reset each round.  
  3. **LC Confusion:** Students may not grasp LC’s randomness. Reiterate drawing rules.  
  4. **EC Dominance:** High-station students may monopolize EC. This is intentional (highlight inequality).  
  5. **Untraceable Benefit Frustration:** Students may resent Type B’s smaller individual payoff. Use this in debrief!  

  **What the Game Can’t Show:**  
  - **Deliberation:** Real sortition relies on informed debate. This game only models voting, not discussion.  
  - **Complex Policy:** Motions are oversimplified (no trade-offs, lobbying, or misinformation).  
  - **Long-Term Dynamics:** Rotation’s "institutional memory" cost is only superficially tested in Round 3.  
  - **Behavioral Factors:** Social pressure, charisma, or ethical choices aren’t captured.  

  ---

  ### **Debrief Questions & Key Lessons**
  **Guided Discussion (10 Minutes):**  
  1. **"What patterns did you see in how the two chambers voted?"**  
     - *Expected:* EC favors traceable benefits (Type A); LC is more balanced. Staggered LC may split votes.  
     - *Link to Theory:* EC needs attributable credit for re-election. LC has no re-election incentive, so it’s open to universal benefits.  

  2. **"Who ended up in the Elected Chamber? How did tokens affect this?"**  
     - *Expected:* High-station students dominated. Seniority bonus amplified inequality.  
     - *Link to Theory:* Elections skew toward resourced/articulate elites. Sortition mirrors society.  

  3. **"Did anyone in the Lot Chamber wish they could stay longer? What changed in Round 3?"**  
     - *Expected:* Staggered LC caused confusion or weakened collective action.  
     - *Link to Theory:* Rotation reduces expertise but resists entrenchment.  

  4. **"Were traceable benefits (Type A) inherently better? Why did chambers value them differently?"**  
     - *Expected:* Type A and Type B have equal total value, but EC prioritized traceability for re-election.  
     - *Core Insight:* Electoral systems incentivize pork-barrel spending; sortition doesn’t.  

  **Reveal the Framing:**  
  - Finally, explain "sortition" and connect the game to real proposals (e.g., Citizens’ Assemblies). Stress that real sortition includes deliberation, not just voting.  

  ---

  ### **Materials Needed**
  - **Station Cards:** 6 sets (High/Medium-High/Medium-Low/Low).  
  - **Tokens:** Poker chips or paper slips (10/7/4/1 per student per round).  
  - **LC Selection:** Deck of cards (draw suits/numbers to randomize).  
  - **Voting Slips:** Colored paper for Type A (red) and Type B (blue).  
  - **Points Tracker:** Whiteboard/spreadsheet.  
  - **Dice:** To select the district for Type A motions.  

  This design ensures students experience the core incentive divergence while fitting your time constraints. Run it as a fast-paced, gamified exercise, and leverage the debrief to crystallize the lessons!
