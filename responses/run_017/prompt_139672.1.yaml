  We are going to create a scenario that meets all the specifications. The setting is a medical testing scenario in a clinic.

  **The Story:**

  A clinic uses a blood test to screen for a disease (H, which is either present H=1 or absent H=0). The test is not perfect. The clinic knows that the test was developed by two different manufacturers (A and B) and they have received a shipment of test kits that is a mix from both manufacturers. However, the shipment got mixed up and the clinic does not know the proportion of tests from A versus B. They only know that the test kits are either from A or from B, and the proportion of A in the mix is unknown. 

  The clinic also has the following information:

  - The base rate of the disease in the population is known to be exactly 50%. This is established by extensive prior studies.

  - The test has two possible outcomes: positive (+) or negative (-).

  - The manufacturer A's test has a sensitivity (probability of positive given disease) of 0.9 and specificity (probability of negative given no disease) of 0.9.

  - The manufacturer B's test has a sensitivity of 0.1 and specificity of 0.1. (Note: This is a very poor test; it is almost like flipping a biased coin that is wrong 90% of the time.)

  However, the clinic does not know which test kit is from which manufacturer. Moreover, when they use a test kit, they do not know whether it is from A or B. The uncertainty is about the composition of the shipment: it could be 100% A, 100% B, or any mix in between. The clinic only knows that each test kit is either A or B, but they have no information about the proportion.

  This leads to uncertainty about the evidential meaning of a test result. Specifically, if they get a positive result, they don't know if it came from a good test (A) and is strong evidence for the disease, or from a bad test (B) and is actually weak evidence (or even evidence against, because B's test is so poor). Similarly for a negative.

  **Modeling the Credal Set:**

  Let the state of the world be (H, T) where H in {0,1} and T in {A, B}. But note: the clinic doesn't know the type T of the test they are about to use. They are about to pick one test at random from the shipment. The shipment has a fraction λ of type A and (1-λ) of type B, but λ is completely unknown (i.e., λ ∈ [0,1]).

  The prior on H is fixed: P(H=1) = 0.5.

  However, the likelihood of the test result depends on T. We have:

  - For test A: 
     P(+ | H=1, T=A) = 0.9, 
     P(+ | H=0, T=A) = 0.1

  - For test B:
     P(+ | H=1, T=B) = 0.1,
     P(+ | H=0, T=B) = 0.9

  The clinic will use one test. The test type T is unknown and the proportion λ is unknown. The credal set is generated by considering all possible values of λ in [0,1]. For a fixed λ, the probability model is:

  P(H=1) = 0.5
  P(T=A) = λ, P(T=B)=1-λ

  and the test result is generated by the test's characteristics.

  We are interested in the probability of H given the test result. But note: the agent (clinic) is uncertain about λ, so they consider a set of joint probability measures over (H, T, TestResult) indexed by λ.

  However, note that the agent only cares about H and the test result. We can marginalize T. The likelihood of a test result given H is a mixture:

  P(+ | H=1) = P(+ | H=1, T=A)P(T=A) + P(+ | H=1, T=B)P(T=B) = 0.9λ + 0.1(1-λ) = 0.1 + 0.8λ
  P(+ | H=0) = 0.1λ + 0.9(1-λ) = 0.9 - 0.8λ

  Similarly for negative:

  P(- | H=1) = 1 - P(+ | H=1) = 0.9 - 0.8λ
  P(- | H=0) = 1 - P(+ | H=0) = 0.1 + 0.8λ

  Now, the prior for H is fixed at 0.5. The posterior for H given a positive test is:

  P(H=1 | +) = P(+ | H=1) P(H=1) / P(+) 
              = [ (0.1+0.8λ) * 0.5 ] / [ P(+ | H=1)*0.5 + P(+ | H=0)*0.5 ]
              = [0.5*(0.1+0.8λ)] / [0.5*( (0.1+0.8λ) + (0.9-0.8λ) )]
              = (0.1+0.8λ) / ( (0.1+0.8λ) + (0.9-0.8λ) )
              = (0.1+0.8λ) / (1.0)

  So: P(H=1 | +) = 0.1 + 0.8λ

  Similarly, for a negative test:

  P(H=1 | -) = P(- | H=1) P(H=1) / P(-)
              = [ (0.9-0.8λ) * 0.5 ] / [0.5*( (0.9-0.8λ) + (0.1+0.8λ) )]
              = (0.9-0.8λ) / (1.0)
              = 0.9 - 0.8λ

  Therefore, as λ ranges from 0 to 1:

  - The posterior for H=1 given positive: from 0.1 to 0.9 (i.e., [0.1, 0.9])
  - The posterior for H=1 given negative: from 0.9 to 0.1 (i.e., [0.1, 0.9] again, but note: when λ=0, P(H=1|-) = 0.9; when λ=1, P(H=1|-) = 0.1)

  But note: the prior for H=1 is exactly 0.5. The prior interval (if we had one) would be [0.5, 0.5] (a point). However, the agent is uncertain about λ, so the prior for H=1 is known to be 0.5. But the posterior intervals are [0.1, 0.9] for both positive and negative results.

  This satisfies the dilation requirement: the prior is a point (interval width 0) and the posterior is an interval of width 0.8 in both cases. But we required the prior interval to be narrow (at most 0.1) and we have a point prior. The posterior interval is [0.1,0.9] which is strictly wider.

  However, note that the dilation is symmetric: regardless of the test result, the posterior probability of H=1 is in [0.1,0.9]. 

  Now, we must check that the dilation survives the convex hull. The credal set is parameterized by λ ∈ [0,1]. The set of posteriors for H=1 given a positive test is {0.1+0.8λ: λ∈[0,1]} = [0.1,0.9]. Similarly for negative: {0.9-0.8λ: λ∈[0,1]} = [0.1,0.9]. The convex hull of the set of priors (which are all point masses at 0.5 for H) is still the point 0.5. The set of posteriors is already convex.

  **Decision Problem:**

  The agent must choose an act after possibly seeing the test result. The acts:

  - Bet for H: pays $1 if H=1, $0 otherwise.
  - Bet against H: pays $1 if H=0, $0 otherwise.
  - Safe act: pays $0.4 for sure.

  The agent is a maximin expected utility agent with respect to the credal set.

  **Before the test:**

  The prior for H=1 is 0.5. So for the bet for H, the expected utility under any prior is 0.5. Similarly, the bet against H has expected utility 0.5. The safe act pays 0.4. So the minimum expected utilities over the credal set (which is a singleton set for the prior on H) are:

  - Bet for H: min = 0.5
  - Bet against H: min = 0.5
  - Safe: 0.4

  So maximin chooses either bet (with min EU=0.5) over safe (0.4). So the agent would choose to bet.

  **After the test, no matter the outcome:**

  The posterior set for H=1 is the interval [0.1, 0.9]. Now we compute the minimum expected utility for each act over the posterior credal set (which is the set of posteriors for H=1 being any value in [0.1,0.9], and H=0 being 1 minus that).

  - Bet for H: EU(p) = p, so min over p in [0.1,0.9] is 0.1.
  - Bet against H: EU(p) = 1-p, so min over p in [0.1,0.9] is min{1-p} = 0.1 (when p=0.9).
  - Safe: 0.4.

  So the minimum EU for the bets is 0.1, and for safe is 0.4. Therefore, maximin prefers the safe act (0.4 > 0.1).

  Hence, before the test, maximin chooses to bet (and gets at least 0.5), but after seeing the test result, no matter what the result, maximin chooses the safe act (and gets 0.4). So the agent would prefer to commit to betting before seeing the test result. Moreover, if the agent is forced to choose after the test, they get 0.4, which is less than 0.5. So they would pay up to 0.1 to avoid seeing the test result and be forced to choose before.

  **Contrast with sharp Bayesian:**

  Consider any sharp Bayesian with a fixed λ. Then the posterior probability given a positive test is p_λ = 0.1+0.8λ. The EU for betting for H is p_λ, and for betting against H is 1-p_λ. The safe act is 0.4.

  - If p_λ > 0.5, then betting for H is best (EU=p_λ>0.5).
  - If p_λ < 0.5, then betting against H is best (EU=1-p_λ>0.5).
