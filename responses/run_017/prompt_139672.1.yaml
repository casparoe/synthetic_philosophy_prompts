  Similarly, if λ<0.5, then positive test: they bet against H? Actually, if positive and λ<0.5, then p_λ=0.1+0.8λ<0.5, so they bet against H: EU=1-p_λ>0.5. And negative test: they bet for H: EU=0.9-0.8λ>0.5.

