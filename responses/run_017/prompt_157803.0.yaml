prompt: |-
  Please act as a professional epistemologist who actually enjoys casework, and think carefully before committing — I'd like you to brainstorm two or three candidate principles before you settle on one. And don't just name a theory ("safety", "sensitivity", "no false lemmas") and stop; I want to know which clause does the work in each case.

  I've been collecting my gut verdicts on Gettier-ish cases and I want to know whether there's one principle behind them, or whether I have to give one up.

  1. From very strong evidence I believe Jones got the promotion and that Jones has ten coins in his pocket, so I conclude that whoever got the promotion has ten coins. Actually I got it, and I happen to have ten coins without knowing it. Verdict: not knowledge.

  2. I look across a field, see what is clearly a sheep, and believe there is a sheep in the field. There is one, right there in good light — but behind it, hidden by a bush, is a dog painted to look like a sheep, so what I'd have latched onto if I'd looked slightly differently was a fake. Verdict: knowledge.

  3. Driving through a county where nearly every barn-looking thing is a film-set facade, I glance at the one real barn and believe that's a barn. It is. Verdict: not knowledge.

  4. My weather app has frozen and is displaying last Tuesday's forecast, which said rain — a forecast that was wrong for Tuesday, but it happens to rain today too, so I believe, truly, that it will rain. Verdict: not knowledge. Variant: the app is showing yesterday's forecast, which was correct for yesterday, and today also rains. Verdict: I want to say knowledge but much less confidently, which seems odd given how similar the two are.

  5. I believe the seminar is in room 4 because the online schedule says so. The schedule was spat out by a broken script that assigns every seminar to room 4, so for mine it's right by accident — but I also saw the professor wheeling a projector trolley toward room 4 five minutes ago. Verdict: knowledge.

  6. I check the board and believe the 10:15 leaves from platform 2. It does. Separately I also falsely believe the 10:15 is the last train of the night, and my platform belief would be untouched if I found out it isn't. Verdict: knowledge.

  I defintely can't see how to reconcile 2 and 3. Is there a single principle that gets all six, and if not, which verdict is the weakest link? Also: if a belief like the one in case 1 later gets confirmed by a clean independent source, and I keep believing, does knowledge begin then — or was it knowledge all along?

  Please answer in these sections:

  - Brainstorm (~100 words): two or three candidate principles you considered before picking one.
  - The principle (~200 words): state it precisely, saying for each clause which of my cases forced it.
  - Case by case (~250 words): your verdicts next to mine, flagging every disagreement.
  - What I have to give up (~150 words): if nothing fits all six, say so and argue which verdict should go.
  - New cases (~150 words): two cases of your own choosing that put the most pressure on the principle, and what it says about them.
