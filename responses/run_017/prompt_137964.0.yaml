          Step 3: Total score = category + hardship + benefit.

          Step 4: Sort by score descending. For same score, sort by amount ascending.

          Step 5: Starting from the top, allocate the full amount requested if the remaining fund is sufficient. If not, skip and go to the next.

          Step 6: Continue until the end of the list.

          Step 7: Record for each:
                  Funded: "Amount: $X, because [category], [hardship] hardship, [benefit] benefit (score: Y)."
                  Rejected: "Rejected: score too low (score: Y) or insufficient funds." OR for the unknown, "Rejected: insufficient information."

          Step 8: If any money remains, note it for the next meeting.

     This procedure is explicit about the judgment calls (category, hardship, benefit) and requires consensus.

     For the counsellor request, we reject because of Step 0.

     The procedure cannot:
          - Perfectly compare the intensity of need across students because it relies on coarse categories.
          - Avoid all bias (e.g., if a student is very articulate, they might get a higher benefit score, but we have guidelines to mitigate that).
          - Handle cases where partial funding is possible and desirable (we avoid it by funding in full or not at all).

