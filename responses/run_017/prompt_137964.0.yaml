  ### Proposed Procedure for Access Fund Allocation

  This procedure is designed to be run by two 16-year-old student representatives in ~4 minutes per application, using only the provided paragraph. It prioritizes **transparency**, **consistency**, and **defensibility** while acknowledging inherent judgment calls. The core principles:
  - **Basic needs** (health, safety, education access) trump opportunities/extras.
  - **Hardship evidence** (e.g., fee waiver status) is prioritized over self-reported benefit.
  - **Partial funding** is avoided unless explicitly feasible.
  - **Unknown requests** are handled with a fixed rule.
  - Judgment steps are explicitly marked (✅).

  #### Step-by-Step Procedure
  **Key**:  
  ✅ = Judgment call (requires consensus between reps)  
  ⏱️ = Time-sensitive (if unresolved in 1 min, skip to next step)  
  ✋ = Hard stop (if criteria unmet)

  ---

  1. **Categorize the Request (✅)**  
     Assign to one category based on the description:  
     - **Basic Necessity (BN)**: Physical/safety needs (e.g., winter gear, food, essential transport).  
     - **Core Opportunity (CO)**: Academic/artistic progression with irreversible loss if missed (e.g., exam fees, required materials).  
     - **Social/Wellness (SW)**: Mental health or social inclusion (e.g., club participation).  
     - **Unknown (U)**: Insufficient details (e.g., counsellor requests with no info).  
     *Rule*: If ambiguous, default to the **less urgent** category (e.g., "esports headset" is SW, not CO).

  2. **Assess Lumpy Funding (✅)**  
     Determine if partial funding wastes money:  
     - **Lumpy (L)**: Only full funding helps (e.g., exam fees, deposits).  
     - **Non-Lumpy (NL)**: Partial funding is usable (e.g., clothing, transport).  
     *Rule*: If uncertain, mark **L** to avoid wasting funds. Revisit only if surplus remains.

  3. **Assign Hardship Tier (Fact-Based)**  
     Use **school data** (not the paragraph):  
     - **Tier 3**: On fee waiver.  
     - **Tier 2**: Just above waiver threshold (school confirms) OR observed hardship (e.g., walking >15 mins due to cost).  
     - **Tier 1**: No hardship evidence.  
     *Rule*: If school data missing, default to **Tier 1**.

  4. **Estimate Benefit Level (✅⏱️)**  
     Ignore self-reported intensity. Focus on **consequences of denial**:  
     - **High Benefit (3)**: Health/safety risk, core education blocked (e.g., no coat in winter, no transport to school).  
     - **Medium Benefit (2)**: Significant educational/social loss (e.g., missed exam, isolation).  
     - **Low Benefit (1)**: Convenience/nice-to-have (e.g., premium headset).  
     *Rule*: If benefit is unclear, default to **lower benefit**. Prioritize observable impacts over future promises.

  5. **Calculate Priority Score**  
     Formula:  
     `Score = (Category Weight × 10) + (Hardship Tier × 3) + Benefit Level`  
     - **Category Weights**: BN = 3, CO = 2, SW = 1, U = 0.  
     - *Example*: BN (3×10) + Tier 3 (3×3) + High Benefit (3) = 30 + 9 + 3 = 42.  
     *Why?* Base needs (BN) weight heaviest. Hardship tiers have narrower spread to avoid overpenalizing middle-income students.

  6. **Adjust for Lumpy Requests (✋)**  
     - If **Lumpy** and request amount > 50% of remaining funds: **Reject immediately**.  
     - *Why?* Avoids depleting funds for multiple smaller needs.

  7. **Partial Funding Check (✋)**  
     - If **Non-Lumpy** and full amount > remaining funds: Offer **partial funding** at 50% of request (min $50).  
     - If applicant **explicitly states** a minimum viable amount, use that instead.  
     - *Rule*: If partial funding is unusable (e.g., "bus pass requires $60 full term"), mark as lumpy in Step 2.

  8. **Sort and Allocate**  
     - Rank by **Score (descending)**, then by **amount (ascending)** for same scores.  
     - Allocate until funds exhausted. Skip requests failing Step 6.

  9. **Handle Unknown Requests**  
     - Allocate **$0** if no details.  
     - *Why?* Cannot compare fairly; defensible as "need > secrecy."

  10. **Record Decision**  
      One-line rationale per application:  
      `"[Amount] allocated. Category: [BN/CO/SW/U]. Hardship: Tier [1-3]. Benefit: [Low/Med/High]. Lumpy: [Y/N]. Score: [X]."`  
      *Example*: "$120 allocated. Category: BN. Hardship: Tier 3. Benefit: High. Lumpy: N. Score: 42."

  ---

  ### Application to Current Shortlist ($1,100 Remaining)
  1. **Amara**  
     - Request: $120 for coat/boots. Walks 25 mins. Fee waiver.  
     - **Step 1**: BN (winter essentials).  
     - **Step 2**: NL (partial coat/boots possible).  
     - **Step 3**: Tier 3 (waiver).  
     - **Step 4**: High Benefit (health/safety risk).  
     - **Score**: (3×10) + (3×3) + 3 = 30 + 9 + 3 = **42**  
     - **Allocation**: Fund $120.

  2. **Dev**  
     - Request: $400 for $900 music exam. Not on waiver. "Wastes 6 years."  
     - **Step 1**: CO (progression loss).  
     - **Step 2**: L (exam fee is fixed cost; partial $400 may be useless if he can't cover remaining $500).  
     - **Step 3**: Tier 1 (no waiver).  
     - **Step 4**: Medium Benefit (significant loss but not health/core education).  
     - **Score**: (2×10) + (1×3) + 2 = 20 + 3 + 2 = **25**  
     - **Step 6**: Lumpy + amount ($400) > 50% of $1,100? No → **Allocation**: Fund $400.

  3. **Priya**  
     - Request: $60 for bus pass. Just above waiver. Walks.  
     - **Step 1**: BN (essential transport).  
     - **Step 2**: L (bus pass likely fixed-cost; $60 partial may be unusable).  
     - **Step 3**: Tier 2 (just above waiver + walking).  
     - **Step 4**: High Benefit (access to education).  
     - **Score**: (3×10) + (2×3) + 3 = 30 + 6 + 3 = **39**  
     - **Allocation**: Fund $60.

  4. **Sam**  
     - Request: $250 for esports headset. "Only friends."  
     - **Step 1**: SW (social inclusion).  
     - **Step 2**: NL (cheaper headset possible; no minimum stated).  
     - **Step 3**: Tier 1 (no hardship evidence).  
     - **Step 4**: Low Benefit (non-essential; school may have alternatives).  
     - **Score**: (1×10) + (1×3) + 1 = 10 + 3 + 1 = **14**  
     - **Allocation**: Reject (low score).

  5. **Counsellor Request**  
     - Request: $300. No details.  
     - **Step 1**: U (unknown).  
     - **Step 9**: **Reject** ($0 allocated).  

  **Summary**:  
  - **Funded**: Amara ($120), Priya ($60), Dev ($400). Total: $580.  
  - **Rejected**: Sam, Counsellor.  
  - **Remaining**: $520 carried forward.  

  **Rationale**:  
  - Amara (BN/Tier 3/High) and Priya (BN/Tier 2/High) scored highest.  
  - Dev (CO/Tier 1/Medium) funded despite lower score because lumpy check passed.  
  - Sam scored lowest (SW/Tier 1/Low). Counsellor rejected due to no info.  
  - **Why not Dev over Amara?** Basic needs (Amara) outweigh opportunities (Dev). Hardship tier and category weight ensured this.  

  ---

  ### Addressing Your Concerns
  1. **"Dollars aren't the same yardstick"**:  
     - Addressed via **hardship tiers** (Tier 3 = high need) and **category weights** (BN > CO > SW).  
     - *Not* relying on dollar-based tradeoffs avoids your pairwise inconsistency problem.

  2. **"Self-reported intensity biases"**:  
     - Ignored entirely. Benefit is inferred from **concrete consequences** (e.g., "walks 25 mins" → health risk).

  3. **"Dev vs. Amara defense"**:  
     - Amara funded due to **higher score** (42 vs. 25). Critical steps:  
       - **Category weight** (BN=30 vs. CO=20).  
       - **Hardship tier** (Tier 3=9 vs. Tier 1=3).  
     - This is defensible: "Amara's health/safety need + extreme hardship outweighed Dev's opportunity."

  4. **Counsellor request**:  
     - Rejected with $0. **Why?** Consistency requires comparable evidence. A lottery/equal split would reward opacity.

  5. **Partial funding**:  
     - Only if **non-lumpy** and explicitly feasible (e.g., Sam could get partial if he specified a $100 minimum).  
     - Not applied here: Priya’s bus pass marked lumpy (assumed fixed-cost).

  ### What the Procedure Cannot Do
  - **Eliminate judgment**: Steps 1, 2, and 4 require subjective calls (mitigated by consensus and defaults).  
  - **Prevent gaming**: Applicants may learn categories (e.g., framing requests as "basic"). Combat by:  
    - **Sticking to definitions** (e.g., "esports is SW, not CO").  
    - **Auditing**: Compare past allocations annually.  
  - **Handle ambiguity**: If school data is missing (e.g., hardship tier), defaults to Tier 1/Low Benefit.  
  - **Resolve ties**: Same score + amount? Flip a coin and record it.

  ### One-Line Rationale for Future Consistency
  Record exactly:  
  `"[Amount] allocated/rejected. Cat: [BN/CO/SW/U]. Hardship: Tier [1-3]. Benefit: [Low/Med/High]. Lumpy: [Y/N]. Score: [X]."`  
  *Example for Amara*:  
  `"$120 allocated. Cat: BN. Hardship: Tier 3. Benefit: High. Lumpy: N. Score: 42."`  

  This allows next year’s committee to replicate scoring and adjust weights if needed.
