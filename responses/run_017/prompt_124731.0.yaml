answer: |-
  ### Tiers by Rounds to Degeneration
  - **Tier 1 (Degenerates in 0–10 rounds)**:  
    **Rule 3 (Self-mention void)**: Immediate risk of self-voiding due to its own text containing "rule 4," causing confusion or invalidation from the start.  
    **Rule 6 (Imported authority)**: Can lock up quickly if an unamendable document (e.g., complex parliamentary rules) is imported early, creating conflicts or unworkable procedures.  
    **Rule 2 (Quorum echo)**: Highly manipulable; low-turnout votes can set impossible quorums (e.g., quorum=4 with only 3 active players) or allow a faction to pass rules during low-quorum windows, leading to lockup or molten state within days.  

  - **Tier 2 (Degenerates in 10–30 rounds)**:  
    **Rule 1 (Ratify-under-successor)**: Double-voting adds stability but risks lockup if a rule passes the first vote but breaks voting mechanics for the second (e.g., a rule banning all voting), often around the 15–25 round mark.  
    **Rule 4 (Entrenchment ladder)**: Entrenchment can be gamed by factions to lock rules (e.g., setting unanimity requirements), causing gradual ossification; typically degenerates after ~20 rounds as coalitions form.  

  - **Tier 3 (Lasts 30+ rounds without degenerating)**:  
    **Rule 5 (Precedent lock)**: Precedents create workarounds (e.g., defining new "kinds" to bypass strict procedures), delaying lockup; molten state is unlikely as players can counter bad precedents, often sustaining the full month.  

  ### Ratings (0–10)
  | Rule | Strategy Score | Justification                                      | Resistance Score | Justification                                            |
  |------|----------------|---------------------------------------------------|------------------|---------------------------------------------------------|
  | 1    | 8              | Double-voting forces foresight about future rule interactions, rewarding long-term planning. | 7 | A 3-person faction needs broad coalitions for both votes, making unilateral control hard. |
  | 2    | 5              | Turnout manipulation adds tactics, but chaos overshadows deep strategy. | 2 | Faction can engineer low quorums (e.g., 1) to pass rules solo. |
  | 3    | 3              | Limited to a gimmick (voiding via self-reference); minimal strategic depth. | 4 | If rule is intact, faction can void rules via amendment, but requires majority support. |
  | 4    | 7              | Entrenchment tagging incentivizes bargaining over rule importance. | 6 | Faction can't entrench alone (needs 2/3 or unanimity), but can exploit malleable tagging rules. |
  | 5    | 8              | Kind-definition and precedent-avoidance enable rich meta-gaming. | 8 | Faction must win majority approval for any precedent, hindering covert takeovers. |
  | 6    | 2              | One-time import decision lacks ongoing strategy; gameplay becomes passive. | 9 | Imported document's immutability prevents faction control, but risks external rigidity. |

  ### Pair Recommendation: Ship Rules 1 and 4 Together
  **Why**: Combining **Ratify-under-successor** (Rule 1) and **Entrenchment ladder** (Rule 4) creates a robust, strategic layer without catastrophic flaws.  
  **Interaction**:  
  - Rule 1’s double-voting applies to entrenchment changes. For example, unentrenching a rule requires:  
    - First vote under current rules (e.g., needing 2/3 to modify an entrenched rule).  
    - Second vote under the new rules (e.g., only majority if unentrenched).  
    This forces factions to win twice under shifting constraints, adding depth and slowing power grabs.  
  - Prevents Rule 4’s entrenchment from being easily weaponized (e.g., a faction can’t hastily entrench then unentrench rules) and Rule 1’s voting from being bypassed via entrenched procedural rules.  
  **Result**: More stable than either alone—Rule 1’s checks balance Rule 4’s rigidity, extending degeneration to ~25–40 rounds and boosting resistance to factions (now rating 8/10).  

  ### Avoided Pairs (Degenerate Faster)  
  - **Rules 2 + 3**: Quorum echo can void rules via self-mention during low-turnout votes, causing chaotic lockup in <5 rounds.  
  - **Rules 6 + 5**: Imported documents may conflict with precedent kinds, creating ungovernable contradictions (e.g., a document’s procedure clashes with a locked-in voting precedent).
