answer: |-
  ## The City Without Forgetting

  **Setting:** A small, high-ceilinged chamber in the City Archives, hours before the vote on the Thinning Bill and the Counter-Record Amendment. Rain streaks the tall windows. Livia Serrano, sharp-suited and intense, paces. Anselm Okri, in soft woollens, leans over a folio, his finger tracing a line of text. The immense, silent weight of the perpetual Record presses upon the room.

  **Livia Serrano:** Still hunting precedents in the dust, Anselm? Even now? Your amendment is a *trompe l'oeil*. Beautiful, perhaps. Utterly useless. We need radical surgery, not… scenic decoration.

  **Anselm Okri:** (Doesn’t look up immediately, finishes his thought) Surgery implies diseased tissue, Livia. I see paralysis, not disease. The Record isn’t gangrene; it’s a cast that’s hardened around the limb. Your tribunal proposes smashing the cast. I propose teaching the limb to move again within it, by remembering *how* to imagine.

  **Serrano:** Imagining *what*? Heroes you invent? Traditions you weave from air? The monumental and the antiquarian *live* because a people believes they are *true*, Anselm! They are the bedrock of identity, the fuel for aspiration! Your chorographers wave their hands and say, ‘Behold, great deeds!’ while everyone *knows* they’re conjured in a sealed room, ignorant of the messy, contradictory truth outside. Who throws themselves into emulating a declared fiction? Who reveres a lineage they know was curated last Tuesday? It lacks the essential gravity of the *found*.

  **Okri:** Gravity crushes us now. You mistake the *source* of the power for the power itself. It’s the *image* that animates, the *narrative* that binds, not the pedant’s certificate of authenticity. Did Achilles inspire the Greeks less because Homer sang him? Does the knowledge that a national myth has been polished diminish its power to unite? Our people are drowning in fact. They need air. They need stories that lift, that point forward, that remind them what greatness *feels* like, even if the chorographer shapes the clay. Belief follows the image that serves life, not the other way around. We declare the artifice precisely to free the image from the burden of literal truth – which, as we see, paralyzes.

  **Serrano:** And your sealed chamber? Plastic power, Nietzsche’s vital force, is about a living thing *actively reshaping* what it takes in from outside. How can your chorographers, walled off from the actual past, possibly *reshape* it? They manufacture novelty, Anselm. Pleasant, perhaps. Potentially inspiring, you hope. But it’s not the genuine plasticity of a culture wrestling with its own inherited reality and overcoming it. It’s escapism. Worse, state-sanctioned escapism. Doesn’t your ‘Counter-Record’, appointed by the very state choked by the Record, become just another layer of official myth? Propaganda masquerading as liberation?

  **Okri:** And your tribunal? Where do *they* stand, Livia? To condemn the past, to truly break it, requires a standpoint *outside* it. But we are *all* saturated in the Record. Every breath, every thought, is conditioned by its endless presence. Your judges will be formed by the very past they are meant to condemn! How can they find the leverage? They’ll merely enact the prejudices of the present moment onto the past, calling it justice. It’s not critical history; it’s vandalism with a philosophical fig leaf. Worse – selective amnesia administered by committee. Who trusts *that* horizon?

  **Serrano:** The leverage comes from the *will* to live! From the desperate understanding that *this* – (she gestures violently at the rain-streaked window, implying the inert city) – cannot continue. We condemn specific *manifestations*, specific chains of the past that demonstrably bind us. Does condemning the endless re-litigation of the failed Guild Charter of Year 32 require being outside history? No! It requires recognising it as a weight that crushes new guilds *now*. And destroying it? Yes, it’s violent. Necessary violence. A controlled burn to clear the deadwood so new growth *can* emerge. You cannot rebuild a horizon while the blinding light of total recall floods every corner.

  **Okri:** But will destroying the record of that Charter debate actually lift the weight, Livia? The citizens *remember* it. They’ve internalised its lessons, its cynicism. Obliterating the text won’t obliterate the memory or its effect. It might even sanctify it. You offer the illusion of a clean slate while the grooves of failure remain etched in their minds. The horizon isn’t restored by burning the map; it’s restored by giving people a reason to look up, towards something new. My chorographers offer *that* focus. A beacon, however artificial, to steer by. It starts the movement.

  **Serrano:** Movement towards a mirage! You build a stage set and call it a future. Nietzsche’s remedy wasn’t institutionalised myth-making! It was the *unhistorical* – the individual, the culture, momentarily forgetting, looking away from the crushing weight of the past to act, to *begin*. Your sealed chamber is just another institution, another layer of mediation. Can we even legislate the unhistorical?

  **Okri:** (Leans forward, his quiet intensity matching hers) Perhaps we cannot. But can we legislate oblivion? Truly? The unhistorical moment is personal, Livia. Fleeting. A culture-wide amnesia enforced by tribunal… that’s not forgetting; it’s mandated denial. My amendment doesn’t claim to *be* the unhistorical. It tries to create a *space* where forgetting becomes possible again, where imagination can flourish *without* the constant, oppressive comparison to the immutable Record. It’s scaffolding, not the building. But your Thinning Bill… it feels like swinging a sledgehammer in a house of glass. You may break the chains, but you’ll shatter everything else besides. And what horizon emerges from ruins deliberately made?

  **Serrano:** (Stops pacing, looks out at the rain-lashed city) What horizon do we have *now*, Anselm? A flat, grey, endless plain of remembered days. At least a ruin has contours. At least it casts shadows where something new might grow. Oblivion… denial… call it what you will. We *need* the absence. We need the silence where forgetting *might* begin. Your beautiful fictions are just more noise.

  **Okri:** And your silence, Livia, might be the silence of the grave. Or the silence after a bomb. (He closes the folio softly). We both seek life. We see the same paralysis. But I fear your cure kills the patient to destroy the tumour. Mine risks leaving the tumour but teaching the patient to dance around it. Neither is perfect. Neither may work. But one feels like destruction, the other like… a difficult, fragile hope.

  **Serrano:** (Turns, her face tired, resolute) Hope is a luxury we stopped affording nineteen years ago, Anselm. Now we fight for the *chance* to hope again. However brutal it looks. The vote comes soon. May the city choose life… whichever terrible form it must take.

  **(They stand in silence, the relentless rain the only sound, the weight of the unblinking Record heavier than ever.)**
