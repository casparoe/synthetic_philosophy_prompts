prompt: |-
  I host a small interview podcast — long conversations with one guest about the single thing they have spent years on. I have no academic background; I came to philosophy of science on my own a few years ago and have kept reading since, so I need questions that don't depend on my knowing the literature's shorthand, and that I can still steer when an answer goes somewhere I did not anticipate.

  Next week's guest is a philosopher of science who has spent about a decade defending what she calls the Abandonment Test. The shape of it, as I take it from her short book: she thinks the tradition that asks whether a theory is testable has been looking at the wrong object, because no observation has ever refuted a theory by itself and no theory has ever been given up because of one observation. On her account what makes something science is a property of a community rather than of a claim: a field is scientific to the degree that it (i) states in advance what findings would count against its central commitments, (ii) runs institutions — journals that publish failed replications, funders who pay for attempts to break a result, career credit for the people who break it, a working norm against reinterpreting a failure after the fact — that reliably convert such findings into change, and (iii) has a record of its central claims actually changing or dying when the findings arrive. She also drops any separate requirement about content: nothing about what the claims concern, or whether a single person could in principle have tested them. And she accepts what she takes to follow — that the verdict is comparative and comes in degrees, that it applies to fields rather than to sentences, and that it can rank a social science above a branch of physics.

  What I want from you is ten interview questions, and for each one the answer I should expect and a follow-up that only works if she gives it. The set has to include these:

  One on the content question. Suppose a community of astrologers did everything right institutionally — pre-registered predictions, published the failed ones, defunded the techniques that failed, gave the people who broke them the jobs. Under her test, are they doing science? I expect her to say yes, and that they would have found out astrology is false within a generation, which is the point. I need the follow-up that presses whether she has then changed the subject from is this a way of finding out about the world to is this community well run — and whether well run can be spelled out without sneaking the content back in.

  One on scale. Her test seems to give no verdict at all on work that no community is organised around: a solitary researcher, or a claim that only one person in the world is in a position to check. Does she accept that the paradigm cases of science can score zero or undefined at the time they are made, and if so, what is a criterion for, that cannot recognise them when it sees them?

  One on self-application. Does the philosophy of science community pass its own test? Has anyone in the demarcation literature ever given up a criterion because of a finding, and has she pre-registered a failure condition for the Abandonment Test itself? I expect her to say the test is a proposal about how fields ought to be run rather than an empirical claim, and I need the follow-up that asks how we then check it is not just a description of the fields she happens to admire.

  One on measurement. To count a failure you have to decide it was a failure; to count an abandonment you have to decide the field changed its mind rather than relabelled. So how is the quantity in her criterion supposed to be measured without already knowing which fields get things right? I expect her to reach for things like pre-registration and replication rates, and I want the follow-up that notes those are recent reforms in psychology: on her own terms, did psychology become more scientific in the last fifteen years, and is scientific status something a professional body can raise by a vote?

  One on the bullet she bites. I want her to name a specific case where the test ranks a subfield of physics below a part of psychology, and then a follow-up on whether the difference is really institutional or just a fact about how expensive and slow the evidence is in one field — whether a field can be well run and still be stuck for a century for reasons that have nothing to do with its norms.

  One on where this leaves the tradition it comes from. The standard story says psychoanalysis and the Marxist social theory of his time were not science because of what their claims were like, not because of how their practitioners behaved; her test appears to reverse that diagnosis. And there is the familiar historical point that scientists notoriously protect a theory when the evidence goes against it rather than abandoning it, which suggests her criterion demands a behaviour that history says is rare. Is she prescribing rather than describing, and if so, why should we let science mean the prescribed thing?

  One on what any of this is for. Demarcation gets dragged into American arguments about whether intelligent design may be taught in school science lessons, into funding decisions, into public talk about trusting science. If her criterion is really a verdict on which communities are trustworthy, does it have any authority with a judge or a research council — and should it?

  One built from my own job, which is the piece I would most like to get right. I work in software, where we have blameless incident reviews, release gates, and a strong norm of changing practice after something breaks. In at least some of what we do we are making checkable empirical claims about systems and users, and our institutions convert failure into change better than most academic fields I can think of. I want to put it to her straight: by her own criteria, is my industry a science? I expect her to say no, on the grounds that what we convert are failures of artefacts to do what we want rather than failures of claims about the world, and I need the follow-up that keeps the pressure on that distinction rather than letting it end the exchange.

  Past those eight, I want two of your own that press wherever the view is weakest and that I am unlikely to have thought of. Please also give the ten a deliberate order for a live conversation — starting where she is strongest rather than where she is exposed, saving the measurement and self-application material for the middle once she has committed to the view in her own words, and closing on whatever leaves the listener with the real cost of the position. Nothing should be answerable by her restating the Abandonment Test, and I do not want anything that amounts to a list of things to read.

  Begin directly with Question 1 — no preamble, no summary of her position, no explanation of how you chose or ordered the questions, and no restating of what I asked for. For each item, give the question as I would say it aloud in a sentence or two, then in one sentence the answer you expect, then the follow-up; put the expected answer before the follow-up, and make each question's opening sentence carry the challenge instead of warming up to it.
reasoning: |-
  Okay, the user hosts a podcast and needs interview questions for a philosopher of science discussing her "Abandonment Test" concept. Let me start by understanding her theory. She argues that science is defined by a community's institutional practices—pre-registering what would falsify their claims, having mechanisms to act on failures, and a history of abandoning theories when evidence against them arises. The user wants specific questions that challenge her view without relying on academic jargon.

  First, the user provided eight required questions. I need to address each, starting with the astrology scenario. The core issue here is whether a well-run but false field like astrology counts as science under her test. Her likely answer is yes because the process would expose its falsehood. The follow-up needs to press if this shifts the focus from truth-seeking to efficient community management, and if defining "well-run" implicitly reintroduces content criteria.

  Next, the scale question. Solitary researchers or isolated claims might not fit her model. Does her test fail to recognize individual scientific contributions? If so, how can a demarcation criterion ignore paradigm cases like Einstein's early work? Follow-up should question the criterion's applicability to historical examples of lone geniuses.

  Self-application is tricky. The user expects her to say her test is prescriptive, not descriptive. The follow-up must challenge how we evaluate her proposal without empirical checks, avoiding it being just a reflection of her preferences.

  Measurement issues: Deciding what counts as failure or abandonment seems circular. She might cite pre-registration and replication rates. The follow-up questions if fields like psychology became "more scientific" after adopting such reforms, implying scientific status is mutable by policy changes.

  Ranking physics below psychology: She must provide a concrete example. The follow-up should explore if institutional norms or external factors (cost, time) explain differences in abandonment rates, questioning if well-run fields can still stagnate due to practical constraints.

  Historical cases like psychoanalysis: Her test might reclassify non-scientific fields as scientific based on community behavior, contradicting traditional views. Follow-up asks if she's prescribing an ideal rather than describing reality, challenging the redefinition of science.

  Practical use in policy: Demarcation affects education and funding. If her criterion assesses trustworthiness, does it hold authority in legal or funding contexts? Follow-up questions its applicability versus Popperian tests.

  Software industry analogy: The user's field has robust failure-response mechanisms but focuses on engineering, not empirical claims. Her likely denial based on the artifact vs. truth distinction needs a follow-up pressing why that distinction matters if processes are similar.

  For the additional questions, I need to identify weak points. One angle is how her test handles fields with no central commitments or where theories evolve without clear abandonment. Another could be conflicts between subcommunities—whose abandonment counts? These questions target ambiguities in defining communities and measuring abandonment.

  Ordering the questions: Start with the astrology example to engage her strength—community practices. Then scale to test applicability. Follow with self-application and measurement to probe deeper. Historical cases and ranking examples come next, leading to practical implications. End with software analogy and additional challenges about community definition and conflict, highlighting the theory's costs.

  Ensuring questions aren't answerable by restating her test is crucial. Each must push for clarification or expose inconsistencies. Avoid literature references; focus on real-world application and implications.
answer: |-
  **Question 1:** If a community of astrologers meticulously implemented your institutional requirements—pre-registering predictions, publishing failures, defunding failed techniques, rewarding those who broke results—would the Abandonment Test declare astrology a science?
  *Expected Answer:* Yes, absolutely, and crucially, such a well-run community would rapidly discover astrology's falsehood through its own processes.
  *Follow-up:* Doesn't this shift the definition of science from *discovering truth about the world* to *efficient community governance*—and can "well-run" be defined without smuggling in judgments about the *content* of the claims (like testability or connection to reality) that your test explicitly rejects?

  **Question 2:** Your test seems silent on solitary researchers or claims examined by only one person. Does this mean paradigm cases of science—like Einstein's early relativity work—would score zero or undefined by your criterion *at the time they were made*, rendering your demarcation unable to recognize them as science when it mattered?
  *Expected Answer:* The test applies to sustained, communal investigative practices, not individual moments or claims; it assesses fields over time, not initial conjectures.
  *Follow-up:* If the criterion can't identify the very breakthroughs we point to as exemplars of science *as they happen*, doesn't that suggest it defines a *consequence* of successful science (organized community practice) rather than what *makes* it science?

  **Question 3:** Does the philosophy of science community itself pass the Abandonment Test? Have demarcation criteria like Popper's falsifiability been abandoned due to specific findings, and have *you* pre-registered what findings would compel you to abandon your own Abandonment Test?
  *Expected Answer:* The Abandonment Test isn't an empirical scientific claim to be tested that way; it's a *normative proposal* about how scientific communities *should* function to be reliable.
  *Follow-up:* If it's a normative proposal rather than a testable claim, how do we evaluate its merit beyond it describing practices you personally admire? Isn't that vulnerable to the charge that it's just a sophisticated reflection of your preferences?

  **Question 4:** Measuring "failure" and "abandonment" requires interpreting events—deciding a result truly contradicts a commitment, and that the field genuinely changed its mind rather than relabeling or ignoring it. How can we measure your criterion's central quantity without already knowing which fields are reliable?
  *Expected Answer:* We can use concrete institutional markers like pre-registration rates, successful replication attempts (especially adversarial ones), retraction rates for contradicted work, and documented shifts in core textbooks or funding priorities.
  *Follow-up:* Psychology adopted many of these markers in the last 15 years. By your test, did psychology *become* more scientific in that period? And if so, does that mean a professional body can vote to *make* its field more scientific by adopting new publishing norms, irrespective of its actual track record of abandonment?

  **Question 5:** You suggest your test could rank some parts of psychology above some subfields of physics. Can you give a specific, real example where this happens, and explain why?
  *Expected Answer:* Yes, for instance, certain areas of social psychology with high-powered, pre-registered, adversarial replication efforts might score higher than, say, string theory in physics, where empirical tests are currently impossible despite decades of work.
  *Follow-up:* Couldn't the lack of abandonment in a field like string theory be due to the sheer *difficulty and expense* of generating relevant evidence, rather than poor institutional norms? Can a field be impeccably "well-run" by your lights and *still* be stuck for a century because the world is hard to probe?

  **Question 6:** The standard critique of psychoanalysis or 1920s Marxist theory was that their *content* made them unscientific (unfalsifiable). Your test reverses this, judging them by practitioner behavior. But history also shows scientists fiercely protecting core theories against contradictory evidence (e.g., Newtonian physics vs. Mercury's orbit). Are you prescribing an ideal behavior that rarely occurs, and if so, why redefine "science" to mean this ideal?
  *Expected Answer:* Yes, I am proposing an ideal standard for reliable belief revision. History shows *why* it's needed! The point is to distinguish communities *structured* to correct errors from those that aren't, even if all fall short sometimes.
  *Follow-up:* Doesn't defining science by this demanding ideal—that even physics often fails—risk making "science" an empty honorific for communities that merely *aspire* to good norms, rather than a description of what successful inquiry actually looks like in practice?

  **Question 7:** Demarcation gets used in high-stakes contexts like teaching evolution vs. intelligent design, or allocating research funds. If your criterion identifies *trustworthy* communities, does it carry weight with, say, a judge or funding panel—and should it?
  *Expected Answer:* It absolutely should carry weight; it provides a concrete framework for assessing which fields have institutional mechanisms for self-correction, making them more reliable sources of knowledge.
  *Follow-up:* But if your criterion ranks some social sciences above some physics, and potentially astrology as scientific (if well-run), wouldn't this likely be *dismissed* or cause confusion in those practical contexts, undermining its usefulness for the very purposes demarcation is often invoked?

  **Question 8:** In my software field, we rigorously investigate failures ("blameless postmortems"), have mechanisms to enforce change ("release gates"), and strong norms to update practices based on incident data. We make empirical claims about systems and users. By your criteria, isn't my industry a science?
  *Expected Answer:* No, because your primary goal is building and fixing *artifacts* (software) that meet specifications, not testing general claims about how the world *is*. You convert failures of *function* into design changes, not failures of *descriptive claims* into theory abandonment.
  *Follow-up:* But isn't the core mechanism identical? We pre-commit to what "failure" looks like (system crash, user error), gather data when it happens, and systematically change our core practices/models based on that evidence. If the *process* of converting empirical failure into community belief/action change is the same, why does the *purpose* (building vs. knowing) nullify the scientific status?

  **Question 9:** Fields often have competing sub-communities (e.g., different schools in economics or psychology). The Abandonment Test assesses a "field," but whose abandonment counts? If one sub-group abandons a commitment while another doubles down, does the field pass or fail?
  *Expected Answer:* This highlights the need to carefully define the relevant community for assessment, often around shared core commitments and institutional structures (like major journals/societies). Significant fragmentation *itself* might indicate low scores on institutional reliability.
  *Follow-up:* Doesn't this make the verdict highly dependent on *how we arbitrarily draw boundaries* around "the field"? Couldn't proponents of a failing view simply splinter off into a new "field" to reset their abandonment score, rendering the test manipulable?

  **Question 10:** Your test requires stating "central commitments" in advance. But many fields evolve their core questions and concepts profoundly (e.g., what "gene" means in biology). How can a community pre-register failure conditions for commitments that are fluid or not yet fully articulated? Doesn't demanding fixed commitments risk fossilizing fields or misdiagnosing dynamic, progressive research as unscientific?
  *Expected Answer:* Core commitments can be stable enough for meaningful pre-registration (e.g., "genes are the primary units of heredity"), even if auxiliary concepts evolve. The test assesses willingness to abandon *specific, stated* commitments when evidence dictates, not the immutability of all concepts.
  *Follow-up:* If the commitment evolves *in response to* challenging evidence (e.g., redefining "gene" to accommodate complex epigenetics), rather than being outright abandoned, does that count as passing the test (adaptation) or failing it (avoiding abandonment by redefinition)? How do you distinguish productive conceptual refinement from evasion?
