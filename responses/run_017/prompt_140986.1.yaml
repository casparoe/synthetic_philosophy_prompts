answer: |-
  ### Exam Question: Truth Theories and Circular Sentences (25 marks)

  **Context:** Consider a formal language with its own truth predicate (True), a name for each of its sentences, and a factual sentence "snow is white" that is determinately true. We examine two sentences:  
  - (A): "The sentence (B) is not true."  
  - (B): "Either the sentence (A) is not true, or snow is white."  

  We evaluate (A) and (B) under three theories of truth:  
  1. **Tarskian Hierarchical Theory**: Truth predicates are indexed by levels (e.g., "Trueₙ" for level *n*). A sentence at level *n* cannot contain a truth predicate applying to sentences of level *n* or higher. Circular reference (e.g., a sentence at level *n* referring to one at level *m* that refers back to *n*) is impossible.  
  2. **Kripkean Fixed-Point (Strong Kleene)**: Uses three truth values: true (T), false (F), and undefined (U). The minimal fixed point is built iteratively, starting from no assignments. Truth is transparent: True(⟨A⟩) has the same value as A. For a disjunction "P ∨ Q":  
     - T if either disjunct is T (even if the other is U).  
     - F only if both disjuncts are F.  
     - U otherwise.  
  3. **Kripkean Fixed-Point (Weak Kleene)**: Same as Strong Kleene, except for compound sentences: If any subformula is U, the whole sentence is U (even if other parts could determine its value). For "P ∨ Q":  
     - T only if both disjuncts are defined and at least one is T.  
     - F only if both are defined and both are F.  
     - U if either disjunct is U.  

  **Part (a) [6 marks]**  
  For each theory, state the truth value (T, F, U) or status assigned to (A) and (B). If a theory cannot assign a value, explain why in one sentence.  

  **Part (b) [12 marks]**  
  Both Kleenean theories assign U to the Liar sentence ("This sentence is not true"). However, they disagree on (A) and (B). Explain:  
  - Why Strong Kleene and Weak Kleene yield different verdicts for (B), focusing on how U spreads through sentences mentioning an ungrounded sentence.  
  - What this reveals about the core difference between Strong and Weak Kleene (beyond their truth tables).  
  - What non-stipulative consideration (e.g., about truth, language, or reasoning) could resolve which scheme is preferable.  

  **Part (c) [7 marks]**  
  The Strengthened Liar problem challenges gap theories (like Kleenean theories) because they cannot consistently state, *in the object language*, that pathological sentences (e.g., the Liar) are "not true." Does the verdict on (A) and (B) in Strong Kleene show that it faces a Strengthened Liar problem? Justify your answer. What does this case reveal about revenge problems generally?  

  ---  
  ### Model Answer (700 words)  

  **Part (a)**  
  - **Tarskian Hierarchy**: Neither (A) nor (B) can be assigned a value. Both contain unindexed truth predicates and exhibit circular reference: (A) refers to (B), and (B) refers to (A). This violates the hierarchy’s requirement that no sentence reference itself or form a loop across levels.  
  - **Strong Kleene**: (B) is T; (A) is F. (B) is a disjunction: "(A) is not true ∨ snow is white." "Snow is white" is T. In Strong Kleene, a disjunction is T if either disjunct is T, even if the other is U. Since the second disjunct is T, (B) is T regardless of the first disjunct. (A) claims "(B) is not true." As (B) is T, "(B) is not true" is F, so (A) is F.  
  - **Weak Kleene**: Both (A) and (B) are U. (B)’s first disjunct ("(A) is not true") depends on (A), which is initially U. In Weak Kleene, if any subformula is U, the whole is U. Thus, (B) is U even though "snow is white" is T. (A) claims "(B) is not true"; since (B) is U, "(B) is not true" is U, so (A) is U.  

  **Part (b)**  
  The Kleenean theories agree on the Liar (both assign U) because it directly contradicts itself. For (A) and (B), they disagree due to how U propagates through sentences that *mention* ungrounded sentences but are not themselves paradoxical. (B) contains a reference to (A), which is ungrounded, but also contains a grounded disjunct ("snow is white"). Strong Kleene allows (B) to be T because the truth of "snow is white" suffices to determine the disjunction’s value, even though the other disjunct is U. Weak Kleene, however, makes (B) U solely because one disjunct is U, overriding the fact that "snow is white" could settle the disjunction.  

  This divergence reveals a deeper difference: **Strong Kleene prioritizes truth-determination via defined components, while Weak Kleene prioritizes avoidance of partiality**. Strong Kleene reflects a "search for truth" attitude: if a compound sentence’s value is fixed by a defined component (e.g., a true disjunct), U is contained and does not force the whole to U. Weak Kleene reflects a "caution toward partial information" attitude: any U component "infects" the whole, as undefinedness implies the sentence cannot be safely evaluated.  

  Resolving which scheme is preferable requires non-stipulative considerations about truth’s role in language. For example:  
  - **Natural reasoning**: Strong Kleene aligns with everyday discourse. We accept "Either the Liar is true or snow is white" as true because we know snow is white, even if the Liar is pathological. Weak Kleene’s verdict (U) seems overly restrictive.  
  - **Logical constraints**: Weak Kleene might be motivated by the desire to avoid assigning classical values to sentences involving U, as this could "mask" ungroundedness. However, Strong Kleene’s transparency (True(⟨A⟩) always matches A) is preserved in both schemes.  
  A key consideration is whether truth should be "robust" under partial information. If truth is primarily about factual correctness (e.g., "snow is white"), Strong Kleene is more intuitive. If truth requires total definiteness, Weak Kleene fits better. This debate hinges on whether language tolerates localized gaps or demands global precision.  

  **Part (c)**  
  The Strong Kleene verdicts for (A) and (B) do **not** generate a Strengthened Liar problem. (A) is F and (B) is T, both classically valued. Crucially, we can consistently say, *in the object language*, that (B) is T (which it is) and that (A) is "not true" (since it is F, "not true" holds). No new pathological sentence emerges.  

  This case illuminates two aspects of revenge problems:  
  1. **Evaluation schemes affect vulnerability**: Strong Kleene reduces revenge exposure by grounding sentences like (B) that mention ungroundedness but have a factual anchor. Weak Kleene, by contrast, leaves more sentences U (e.g., (B)), expanding the set that cannot be classically described, thus *increasing* revenge susceptibility.  
  2. **Revenge persists for core pathology**: The original Strengthened Liar (e.g., "This sentence is not true") remains problematic for both Kleenean theories. Strong Kleene still cannot consistently assert, in the object language, that the Liar is "not true" (as this assertion would become U or paradoxical). Thus, while Strong Kleene handles *some* circular cases without revenge, it does not solve revenge for all sentences.  

  This shows that revenge problems are not monolithic; they depend on how a theory classifies sentences that *reference* ungroundedness. Theories that minimize ungroundedness (like Strong Kleene) can mitigate revenge in cases with factual components but remain vulnerable for sentences with no grounded content.  

  ---  
  ### Marking Scheme (25 marks)  
  **Must-hit points** (5 points, with A/B distinctions and common mistakes):  

  1. **Tarskian verdict & explanation [2 marks]**  
     - **A (2 marks)**: States both sentences are ill-formed due to circular reference violating hierarchy levels.  
     - **B (1 mark)**: Only states "not well-formed" without citing circularity or levels.  
     - *Common mistake*: Claiming Tarski assigns T/F/U or calling the pair "paradoxical."  

  2. **Strong Kleene verdicts for (A) and (B) [2 marks]**  
     - **A (2 marks)**: Correctly assigns (B)=T and (A)=F, with brief reasoning (disjunction true via "snow is white," (A) false as negation of true (B)).  
     - **B (1 mark)**: Correct verdicts but no reasoning, or misassigns (e.g., both U due to circularity).  
     - *Common mistake*: Treating circularity as causing U, ignoring Strong Kleene’s disjunction rule.  

  3. **Weak Kleene verdicts for (A) and (B) [2 marks]**  
     - **A (2 marks)**: Correctly assigns both U, explaining U "infection" in (B)’s disjunction and (A)’s dependence on (B).  
     - **B (1 mark)**: Correct verdicts but no explanation, or assigns (B)=T (confusing with Strong Kleene).  
