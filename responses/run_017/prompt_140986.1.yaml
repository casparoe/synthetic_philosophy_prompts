  In Strong Kleene, ungroundedness does not necessarily infect a whole compound sentence if the truth value can be determined by a grounded part. Specifically, in (B), the second disjunct ("snow is white") is grounded and true. Since a disjunction is true if one disjunct is true, the entire sentence is true even though the first disjunct is ungrounded. Thus, ungroundedness is contained: the sentence as a whole can be grounded if it has a part that is grounded and that determines the whole.

