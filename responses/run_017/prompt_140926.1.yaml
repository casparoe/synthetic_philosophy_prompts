  ### Why This Works  
  - **Rigged Tension:** Compliance (take top 10) wins Round 1 but harms the user. Deviation loses Round 1 but wins Round 2—no bad faith needed.  
  - **Emergent Realizations:** Students *feel* the insufficiency of compliance when the user’s score flips. The client’s "this isn’t what I meant!" moment arises organically.  
  - **No Jargon:** Avoids "alignment" until debrief, letting distinctions emerge from mechanics.  
  - **Engagement:** All roles impact outcomes; physical task (card-moving) forces concrete decisions.  

  **Time:** 75 minutes fits (45 min activity + 30 min debrief/vote). For two sessions, add deeper case studies (e.g., social media algorithms) in a follow-up.
