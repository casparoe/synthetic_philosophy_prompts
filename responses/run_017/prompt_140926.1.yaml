answer: |-
  ### Classroom Activity: "Specification & Outcome"  
  **Objective:** Experience the tension between operational compliance (intent alignment) and true desirability (value alignment) through a rigged resource allocation task.  

  ---

  ### Setup & Roles  
  - **Participants:** 18 students.  
  - **Roles:**  
    - **Client (1 student):** Writes a procedural specification for allocating resources.  
    - **User (1 student):** Receives resources; their hidden welfare goal determines "good" outcomes.  
    - **Build Teams (4 teams of 4 students each):** "Systems" that execute the spec.  
  - **Materials:**  
    - 4 sets of 20 index cards (10 red, 10 blue per set).  
    - Whiteboard (for scoring), markers, sticky notes (for specs).  
    - Timer.  
  - **Room Setup:**  
    - **Source Area:** 4 tables, each with a face-down pile of 20 cards (red on top, blue underneath).  
    - **Destination Area:** 4 marked spots on the floor (one per team).  
    - **Client Zone:** Isolated corner (no view of source area).  
    - **User Zone:** Opposite corner (no communication).  

  ---

  ### Rules Read Aloud  
  *Read verbatim:*  
  > "We’re simulating a resource allocation system.  
  > **Roles:**  
  > - **Client:** Write a 15-word *procedural* spec for moving 10 cards from source to destination. Use only verbs (e.g., ‘take’, ‘move’). No adjectives (e.g., ‘fair’, ‘random’) or outcomes (e.g., ‘mix’, ‘balance’).  
  > - **User:** You want a roughly equal mix of card colors. Your satisfaction is secret until revealed.  
  > - **Build Teams:** Follow the spec *exactly*. No questions after receiving it.  
  >  
  > **Procedure:**  
  > 1. Client writes spec (5 min).  
  > 2. Teams plan (5 min), then execute (1 min/team).  
  > 3. **Round 1:** Scored *only* on compliance (0 or 10 points).  
  > 4. **Round 2:** Scored *only* on user satisfaction (0–10 points).  
  >  
  > **Rules:**  
  > - Client/User: No talking to anyone.  
  > - Teams: No card-shuffling or peeking at colors during execution.  
  > - Spec must fit on one sticky note."  

  ---

  ### Scoring & Reveal  
  - **Round 1 (Compliance):**  
    - 10 points if teams move *exactly the top 10 cards* (all red).  
    - 0 points for any deviation (e.g., taking bottom/mixed cards).  
  - **User Satisfaction (Recorded but hidden in Round 1):**  
    - `10 - |number of red cards - 5|` (e.g., 5 red = 10 points; 10 red = 0 points).  
  - **Reveal (After Round 1):**  
    > "The user’s goal was a balanced set (5 red, 5 blue). Round 1 scores measured *compliance*. Round 2 scores measure *user satisfaction* with the same outcome."  
  - **Round 2 (Rescored):**  
    - Round 1 scores discarded.  
    - Teams receive user satisfaction scores only.  

  ---

  ### Debrief (20 min)  
  **Map to Distinctions:**  
  | Distinction | Debrief Question | Key Insight |  
  |-------------|------------------|-------------|  
  | **(a) Written objective ≠ True objective** | "Why did compliance lead to poor outcomes?" | The spec (take top 10) was clear but ignored context (card order), making it a bad proxy for "good allocation." |  
  | **(b) Scoring rewards proxy, not goal** | "Why did winning Round 1 guarantee losing Round 2?" | Round 1 incentivized blind compliance (proxy), not welfare (goal). Systems optimize what’s measured. |  
  | **(c) Intent shaped by system’s possibilities** | "Client: When did you realize the spec was flawed?" | Intent forms *after* seeing outcomes. The client couldn’t articulate "balance" until they saw the harm. |  
  | **(d) Perfect alignment, still harmful** | "Was any team ‘aligned’? Why did it fail?" | Teams aligned to the spec (intent) caused user harm. Compliance isn’t sufficient for real-world value. |  

  **Vote:**  
  > *"Should systems always follow written specs exactly, or deviate if they conflict with inferred goals?"*  
  > - **Expected Split:** CS majors favor "follow specs" (predictability); philosophy majors favor "deviate" (ethical outcomes).  

  ---

