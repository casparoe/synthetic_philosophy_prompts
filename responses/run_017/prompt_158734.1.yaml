prompt: |-
  I'm leading one 90-minute session of a grad reading group next week on the problem of old evidence — about ten people, half philosophy grads and half ML/cognitive-science people who mostly know Bayes from machine learning (priors as regularizers, updating as "seeing more data", evidence as a row in a dataset). Please don't explain the problem to me; I know the shape of it. I want a plan for how to get it across to that room.

  Concretely, here's what I need:

  1. The order the pieces have to come in and what depends on what. My worry: if I open with "confirmation is probability-raising," half the room will think the puzzle is an arithmetic accident; if I open with "P(E) is already 1, so nothing can be raised, so the framework is broken," the ML people will immediately say "fine, use the likelihood ratio / Bayes factor, the posterior-odds form doesn't need P(E) at all" and feel like they've dissolved it in ten seconds. So where does the Bayes-factor route have to sit in the sequence, and how do I stage it so it lands as a serious answer that then runs out, rather than as a heckle I have to bat away?

  2. The one case that should carry the whole session. I was going to use the classic one — the anomalous advance of Mercury's perihelion and general relativity — but I think it's doing too many jobs at once and quietly hiding the structure: it's a novel prediction, it's quantitative, the datum was already known to be anomalous, and there's a rival theory humming in the background. So: what does my carrying example need to *have*, and what does it need to *lack*, to isolate the thing I'm after? Should I keep Mercury, or swap it for something from ordinary life or from lab/clinical practice where the fact was sitting there on the chart the whole time? Give me the swap if you think it's better, and say what it buys.

  3. Two wrinkles I want to fit in somewhere and can't place. (i) Evidence that's old in the sense that everyone knew the fact for years, but whose *relevance* to the hypothesis was only noticed later — the bearing was new, not the fact. (ii) Evidence that's old for the person doing the reasoning but new to the community — so who is the agent whose updating is supposed to have gone wrong? Tell me which of these is a genuine variant of the problem, which is a red herring I should name and drop in one sentence, and where in the sequence each belongs.

  4. The misconceptions I should expect, and exactly where in the sequence to head each one off. My guesses: "just ask what you would have thought if you hadn't known it" (the counterfactual-prior move — and I want to know why that move is worse than it sounds, not just that it's contested); "so Bayesianism can't handle being surprised"; "this is just the Duhem/auxiliary-hypothesis thing wearing a hat"; "it's only a problem if your priors are subjective"; "that's about discovery, not confirmation, so who cares." Fix my list if I've got the wrong ones or I'm missing the big one.

  5. What I should openly refuse to get into at this level, and say out loud that I'm skipping.

  6. One question for the last five minutes that tells me whether they've got the structure rather than the slogan. Ideally I'd hand them a pair: a case where the right verdict is "yes, the old evidence genuinely confirms now," and one that's superficially identical where the right verdict is "no, nothing should move," and make them say what the difference consists in.
reasoning: |-
  Okay, the user is preparing a 90-minute session on the problem of old evidence for a mixed group of philosophy grad students and ML/cognitive science people. They need a structured plan to effectively convey the core issues without getting derailed by technical objections or misconceptions. 

  First, I need to understand the key challenges. The ML folks might dismiss the problem early by suggesting Bayes factors, while philosophers might miss the mathematical nuance. The user wants to avoid both pitfalls by carefully staging the discussion. 

  For the case study, Mercury's perihelion is classic but messy. A simpler alternative like the "smoking gene" scenario might work better—it lacks rival theories and novel predictions, isolating the P(E)=1 issue. The user's point about needing a case that forces engagement with counterfactual priors is spot on.

  The wrinkles about relevance-discovery and community-agent dynamics are interesting. Relevance-discovery is a genuine variant that shows the problem isn't just about temporal oldness. Community vs individual agent is more of a red herring—Bayesian updating is agent-relative, so it's not a distinct problem. This should be addressed briefly when explaining why counterfactual priors are messy.

  Common misconceptions need preemptive handling. The counterfactual-prior move should be dissected for its hidden subjectivity. The "Bayesianism can't handle surprise" objection confuses old evidence with unsurprising evidence—I'll prepare a crisp distinction. Duhem-Quine is adjacent but distinct; old evidence attacks Bayesian machinery specifically. The discovery/confirmation dichotomy misses that confirmation should still apply retroactively. And the subjectivity point is wrong—the problem persists even with objective priors if E is known.

  The user should explicitly skip solutions and interpretations of probability. The goal is to make the group feel the problem's weight, not resolve it. For assessment, paired cases like "smoking gene with alternative explanation" vs "generic smoking gene" would test if they grasp why some old evidence should move beliefs while other shouldn't.

  Timing-wise: first 20 minutes should prime intuitions with the smoking gene case. Then 20 minutes on formalism, letting ML folks engage with Bayes factors before revealing the P(E)=1 trap. Spend 15 minutes on why counterfactual priors fail, then 10 on relevance-discovery. Reserve 15 minutes for objections and 5 for the paired-case test.

  The smoking gene case needs to be presented without loaded details—no mention of mechanism or alternatives initially. When objections arise, acknowledge Bayes factors as serious but incomplete, then show how they collapse when P(E)=1. For the counterfactual prior, emphasize the underdetermination of "what you would have thought" rather than just calling it subjective. 

  This structure should make the problem visceral for both groups. Philosophers will see the formal rupture, ML folks will recognize why their toolbox fails, and everyone should leave uneasy about a fundamental gap in Bayesian confirmation.
answer: |-
  Here's a battle-tested plan for your session, designed to engage both groups and force the problem into sharp relief:

  **Core Structure & Sequence (90 Min Total):**

  1.  **Priming the Intuition (15 min):**
      *   **Start with a Simple, Non-Scientific Case:** Use a "Smoking Gene" scenario.
          *   *Setup:* "Imagine Dr. Chen has a hypothesis H: A specific gene variant causes increased lung cancer risk. She's been studying lung cancer patients for years and *knows* that heavy smoker Patient X (who has this variant) developed lung cancer (E). She now formulates H explicitly. Does E confirm H *for Dr. Chen*, *now*?"
      *   **Poll the Room:** "Raise hand if you think E *does* confirm H for Dr. Chen now? Raise hand if you think it *doesn't*?" (Expect mixed results).
      *   **Elicit Intuitions:** Ask both sides *why*. Focus on the ML/CogSci side: "If E is just a row in her dataset she's already seen, how does adding H *change* the model's fit? Doesn't she already 'know' E?" Tease out the tension between "E supports H" and "E is already fully absorbed."

  2.  **Formalizing Confirmation (20 min):**
      *   **Define Bayesian Confirmation:** "E confirms H relative to background K iff P(H|E, K) > P(H|K)." Emphasize this is the *core definition* under examination.
      *   **Show the Math:** Write Bayes' Theorem: P(H|E) = [P(E|H) * P(H)] / P(E)
      *   **Introduce the Likelihood Ratio/Bayes Factor (BF):** Explicitly welcome the ML perspective! "A common and powerful tool in ML is comparing models via the Bayes Factor: BF = P(E|H1) / P(E|H2). Notice P(E) cancels out in the *ratio* of posteriors for two hypotheses. So, why do we ever need P(E) alone?" *Validate this is a good move.*
      *   **The Crucial Point:** "BF tells us which hypothesis E supports *more*. But the standard definition of confirmation asks if E supports H *at all*, compared to *not* having E. That's where P(E) comes in. BF solves model *comparison*, but the problem of old evidence strikes at the definition of confirmation *for a single hypothesis* relative to your current knowledge state." *(This pre-empts the heckle by acknowledging BF's validity but scope.)*

  3.  **Applying Formalism & Revealing the Crack (20 min):**
      *   **Apply to Smoking Gene:** Dr. Chen *knows* E (Patient X got cancer). So P(E) = 1 (given her background K, which includes E).
      *   **Plug into Bayes:** P(H|E, K) = [P(E|H, K) * P(H|K)] / P(E|K) = [P(E|H, K) * P(H|K)] / 1 = P(E|H, K) * P(H|K)
      *   **The Problem:** P(H|E, K) = P(E|H, K) * P(H|K). But for confirmation, we need P(H|E, K) > P(H|K). Is P(E|H, K) * P(H|K) > P(H|K)? This implies P(E|H, K) > 1. **But probabilities cannot be >1!** Therefore, mathematically, P(H|E, K) cannot be greater than P(H|K). Confirmation seems impossible for known evidence.
      *   **BF Check:** "Can BF help Dr. Chen *confirm* H against its negation (~H) using E?" BF = P(E|H, K) / P(E|~H, K). But P(E|H, K) is weird because E is known. What does "probability of E given H" mean when E is fixed? If K already *includes* E, conditioning on E might be vacuous or ill-defined. BF avoids P(E) but still relies on likelihoods conditioned on K *that already includes E*.
      *   **The Core Tension:** "Intuitively, E *should* support H. Formally, under standard Bayesian conditioning with known E, it *cannot*. This is the rupture."

  4.  **The Counterfactual Move & Why It Falters (15 min):**
      *   **The Obvious Escape:** "Just calculate what Dr. Chen's credence in H *would have been* if she *hadn't* known E! Then use *that* as the prior. P_old(H) = P(H|~E) or P(H|K_minus_E). Then P_new(H|E) = [P(E|H) * P_old(H)] / P_old(E). Now P_old(E) < 1, so updating *can* happen."
      *   **Why It's Worse Than It Sounds:**
          1.  **Radical Underdetermination:** What *is* K_minus_E? How much does removing E change her background knowledge? (e.g., Does she forget *all* cancer cases? Just this one? Does it affect her beliefs about smoking, genetics, statistics?). There's no unique or objective way to specify the counterfactual state.
          2.  **Subjectivity Run Wild:** The counterfactual prior becomes highly subjective and arbitrary. Different ways of "forgetting" E lead to *wildly different* confirmation measures for the *same* E, H, and actual knowledge state. This undermines the objectivity Bayesians often seek.
          3.  **Practical Impossibility:** For complex agents embedded in a web of beliefs (like scientists), genuinely specifying a coherent K_minus_E is impossible. What does it mean for Einstein to "not know" Mercury's perihelion advance while retaining all the other physics knowledge that made it anomalous?
      *   **Land the Point:** "It's not just contested; it pushes Bayesianism towards an untenable subjectivism or an impossible epistemology of selective forgetting."

  5.  **Wrinkles & Misconceptions (15 min):**
      *   **(i) Relevance-Discovery (Genuine Variant):** Introduce *now*. "Imagine Dr. Chen *knew* Patient X had the gene variant and got cancer for years, but only *just realized* the gene might be causal (H). The *fact* (E) is old, but its *relevance* to H is new." **Does this dissolve the problem?** No! The formal problem remains identical: P(E|K) = 1. The *psychological* experience is different (surprise of connection), but the *logical* structure of confirmation within her current knowledge state is unchanged. The core issue persists.
      *   **(ii) Agent-Relative "Oldness" (Red Herring):** "What if Dr. Chen is new and *just learned* E from old charts? Or if E is old to the community but new to a junior scientist?" **Dismiss concisely:** "Bayesian updating is agent-relative and time-indexed. If *you* didn't know E, P_old(E) < 1 *for you*, and you update normally. The problem only bites when the evidence is part of the agent's background knowledge *at the time of assessing confirmation*. It's about the agent's *current* knowledge state." (1-2 sentences).
      *   **Addressing Misconceptions:**
          *   **"Can't handle surprise":** "No. Surprise requires P(E) was low *before* learning. Old evidence has P(E)=1 *now*. The problem isn't lack of surprise; it's the vanishing of the update *because* it's unsurprising (certain)."
          *   **"Just Duhem/auxiliaries":** "Related, but distinct. Duhem is about H relying on auxiliaries A; disconfirming E might blame A, not H. Old evidence attacks the *mathematical possibility* of confirmation *even for H directly*, without auxiliaries muddying falsification."
          *   **"Only subjective priors":** "False. Even if P(H) is 'objective' (e.g., based on symmetries), if P(E)=1 *now*, then P(H|E) = P(H). The problem persists."
          *   **"Discovery, not confirmation":** "But shouldn't a good theory of confirmation tell us *why* discovering a connection (like relevance) *is* confirmatory, even if the fact was known? The problem shows our standard formalism struggles with this."

  6.  **Open Refusals (State Early & Briefly):**
      *   "We are *not* solving the problem today (e.g., Garber, Jeffrey, Lange). Focus is on *feeling the force* of it."
      *   "We are *not* debating interpretations of probability (subjective, objective, logical). The problem arises under any interpretation where known evidence has probability 1."
      *   "We are *not* delving deep into the metaphysics of counterfactuals. We're focusing on its epistemological instability for this purpose."

  7.  **The Assessment Question (Final 5 min - Paired Cases):**
      *   **Case A (Should Move):** "Dr. Chen *just discovered* a plausible biochemical mechanism (M) by which Gene Variant V *could* cause Lung Cancer. She immediately realizes that Patient X (known for years to have V and cancer) is evidence for M. Does E (X has V & cancer) *now* confirm M for Dr. Chen?" *(Yes - Relevance-Discovery variant. The *connection* M makes E salient evidence for a new hypothesis, even though E is old.)*
      *   **Case B (Should NOT Move):** "Dr. Chen has known for years Patient X has Gene Variant V and Lung Cancer (E). She has also long believed H: V causes cancer. She re-reads X's chart today. Does this *re-reading* confirm H for her *now*?" *(No - Pure old evidence. No new connection or reason. P(E|K)=1.)*
      *   **Ask:** "What's the crucial difference between A and B that makes confirmation appropriate in A but not B?" **(Target Answer: In A, learning M *changes the agent's background knowledge* (K) in a way that makes E *newly relevant* to a *new hypothesis* (M). The confirmation is of M *by* E, relative to the *new* K that includes M. The *fact* E was old, but its *role as evidence for M* is new. In B, nothing has changed in K relevant to H and E; E is still fully absorbed.)**

  **Why this works for your audience:**

  *   **ML/CogSci:** Starts simple, validates BF early but shows its limits for the specific problem. Uses clear probabilities. The Smoking Gene case avoids physics baggage. Relevance-Discovery feels like feature engineering/insight.
  *   **Phil Grads:** Rigorous formal presentation. Engages deep epistemological issues (counterfactuals, subjectivity). Paired cases demand conceptual precision. Mercury is avoided to prevent distraction.
  *   **All:** Focuses on a single, clear case study. The paired assessment directly tests understanding of the core structure (change in background relevance vs. static knowledge) rather than slogans.

  **Key Adjustments from Your Plan:**

  *   **Case Study:** Swapped Mercury for "Smoking Gene". It **lacks**: Novel prediction, quantitative precision, known anomaly, explicit rival theory. It **has**: Clear P(E)=1 for the agent, intuitive "should confirm" intuition, easy formalization, direct path to relevance-discovery. This isolates the logical problem.
  *   **Bayes Factor:** Addressed *early and positively*, then shown why it doesn't dissolve the *specific* problem of single-hypothesis confirmation with P(E)=1.
  *   **Wrinkles:** Relevance-Discovery integrated as a genuine variant demonstrating the problem's scope. Agent-relativity dismissed concisely as a red herring.
  *   **Counterfactuals:** Focused critique on *underdetermination* and *impracticality*, not just contestation.
  *   **Misconceptions:** Refined list based on common reactions. Added "surprise" and sharpened "subjectivity" and "discovery" points.
  *   **Assessment:** Paired cases designed to force recognition of the role of *changes in background knowledge creating new relevance*, not just the age of the fact.

  This structure forces engagement with the core paradox, validates the audience's initial instincts (especially BF) while showing why they don't resolve it, and ends with a sharp test of conceptual grasp. Good luck!
