answer: |-
  Here's the experimental setup and analysis in American English, modeled after a field trial design:

  **Shared Setup:**  
  Richland imposes banking documentation rules on international payments. Poorland's farmers co-op needs $100,000 annually for imported fertilizer. When Richland's rule took effect, banks blocked payments for 6 months until the rule was clarified. In parallel scenarios, a landslide destroyed stored fertilizer worth identical value. The loss occurred; all rules are now fixed. Richland must decide whether to transfer $100,000 to restore the co-op's fertilizer access. Households are identical across scenarios.  

  ---

  **2x2 Cells (Causal Source × Sufficiency Status):**  

  |                          | **Loss caused by Richland's rule**                      | **Loss from natural cause (landslide)**               |
  |--------------------------|--------------------------------------------------------|-------------------------------------------------------|
  | **Below sufficiency line** | A. Rule blocked payments → co-op couldn't buy fertilizer → households fall below subsistence | B. Landslide destroys fertilizer → households fall below subsistence |
  | **Above sufficiency line** | C. Rule blocked payments → co-op lost surplus buffer (but households remain above subsistence) | D. Landslide destroys surplus buffer → households remain above subsistence |

  ---

  **Verdict Table (Yes/No/Indeterminate):**  

  | Cell | Threshold View | No-Harm View | Shared-Scheme View |
  |------|----------------|--------------|--------------------|
  | A    | **Yes** (Current need + fixable at acceptable cost) | **Yes** (Repair owed for caused harm) | **Yes** (Obligation to co-participants in trade scheme) |
  | B    | **Yes** (Current need identical to A) | **No** (No causal link to Richland) | **Yes** (Same institutional relationship as A) |
  | C    | **No** (Above threshold → no duty) | **Yes** (Repair owed for caused harm) | **Yes** (Obligation persists regardless of severity) |
  | D    | **No** (Above threshold) | **No** (No causation + no need) | **Yes** (Co-participation unchanged by cause/severity) |

  ---

  **Reasoning per View per Cell:**  
  - **Threshold:** Verdict hinges *only* on current sufficiency status (A/B = need exists → yes; C/D = no need → no).  
  - **No-Harm:** Verdict hinges *only* on causation (A/C = Richland caused loss → repair owed; B/D = natural cause → no duty).  
  - **Shared-Scheme:** Verdict hinges *only* on institutional co-participation (All cells = same trade scheme → duty in all cases).  

  ---

  **Trial Results:**  
  1. **Main Effects:**  
     - Factor 1 (Causation) drives No-Harm view (significant effect: caused loss → duty).  
     - Factor 2 (Sufficiency) drives Threshold view (significant effect: below line → duty).  
     - Shared-Scheme shows **no main effects** (duty present in all cells).  
  2. **Interaction:** None. Each view responds to only one factor.  

  ---

  **Design Sensitivity Test:**  
  - **Remove sufficiency variation (all above line):** Cells A/B collapse → Threshold view *always says no*. No-Harm still demands repair in caused cases (C). Shared-Scheme still says yes everywhere.  
  - **Remove causation variation (all natural causes):** Cells A/C collapse → No-Harm view *always says no*. Threshold still demands aid in need cases (B). Shared-Scheme unchanged.  
  *Conclusion:* Design remains valid; collapsing cells only eliminates scenarios where views conflict.  

  ---

  **Critical Assessment:**  
  - **Weakest performer:** **No-Harm view**. Fails to address need unrelated to causation (Cell B) and demands reparations even without hardship (Cell C).  
  - **Objection from defender:** *"You ignore structural harm. Richland’s 'clarified rule' still perpetuates a system where Poorland depends on volatile imports. The baseline ('but for us') assumes a fair starting point, but historical extraction means Poorland was* already *deprived of self-sufficiency."*  
    - **Landing:** Valid critique of the design’s "fixed history" clamp. Real-world baseline disputes make causation non-binary.  

  ---

  **Core Question: Rival Duties or Different Factors?**  
  1. **They are rivals:** Cell C proves irreconcilable conflict. Identical scenario → all three views diverge (Threshold: no, No-Harm: yes, Shared-Scheme: yes).  
  2. **Agreement ≠ Shared Reasoning:**  
     - Cells A/B: Threshold and Shared-Scheme both say *yes*, but for different reasons (need vs. relation).  
     - Cell D: Threshold and No-Harm both say *no*, but for different reasons (no need vs. no causation).  
     - **No collapse into same rationale.**  

  ---

  **Factor 2 Confounding Check:**  
  - **How we varied sufficiency:** We held loss amount fixed ($100k) but made households poorer *initially* in A/B to drop them below sufficiency.  
  - **Confounding:** Yes. Changing baseline wealth *also* alters:  
    - Vulnerability to shocks (systemic justice concern)  
    - Bargaining power in the "shared scheme" (relational asymmetry)  
  - *However:* This mirrors real-world trade-offs. Threshold theorists accept this, arguing sufficiency *incorporates* resilience.  

  ---

  **Bottom Line:**  
  Your design successfully forces the views apart. The disagreement isn’t about "which case" – it’s about **what fundamentally grounds the duty** (need, causation, or relation). Cell C is the litmus test: philosophers arguing past each other are prioritizing different core principles.
