  ### Key Pedagogical Notes:
  1. **Divergence Test**: The unannounced shift to Round 3 (Prewritten) mid-round forces participants to confront that accuracy persists without causal dependence, mirroring the "lucky coincidence" objection to epiphenomenalism.
  2. **Four Difficulties Delivered**:
     - **Counterfactual**: Orphan round (if state changed, report wouldn’t follow).
     - **Explanatory**: Prewritten round (accuracy requires a "conspiracy").
     - **Trust**: Orphan’s closing dilemma (past success ≠ future justification).
     - **Screening-off**: Common cause round (reports track the die, not states).
  3. **Wiring Inspectors**: Create a rift between 1st-person (participants’ confidence) and 3rd-person (inspectors’ knowledge of causation). Debrief questions force synthesis: "Are these perspectives compatible?"
  4. **Minimal Jargon**: Terms like "epiphenomenalism" enter only in the naming script after experiential disorientation.

  This design compresses philosophical complexity into visceral gameplay, priming students for technical discussion only after they’ve felt the problem.
