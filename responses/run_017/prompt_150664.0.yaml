  We are designing a game to illustrate the difference between a report being accurate, tracking a state, and being produced by that state, without using philosophical jargon until the debrief. The game will have multiple rounds with different wirings, and roles including participants and wiring inspectors.

  Key elements:
  - Participants have a "state" (hidden from them) and produce "reports".
  - Reports are scored for accuracy against the true state.
  - Wiring changes across rounds: state causes report; common cause; pre-written list; orphaned reports.
  - Wiring inspectors see the wiring diagram but not the states.
  - Mid-round "divergence test": change wiring without announcement and see if scores change (they shouldn't).
  - Closing moment: a participant who scored full marks is told that in the last round, her reports were not connected to her state and is asked about trust in the next report.

  We'll use index cards for states and reports, envelopes to hide states, and coloured sticky dots for state representation. The facilitator will control the wiring and scoring.

  We need to deliver four versions of the difficulty:
  1. Counterfactual: Would the report be different if the state were different?
  2. Explanatory: The accuracy is coincidental and unexplained, hence lucky.
  3. Trust: Accepting the theory undermines grounds for trusting past and future reports.
  4. Screening-off: Does the report answer to the experience or to the neural common cause?

  We'll structure the activity in rounds and then a debrief.

  Let's design the rounds:

  Round 0: Setup and practice.
  Round 1: Direct wiring (state causes report). Participants roll a die to determine their state, then write a report of their state. But note: they cannot see their own state. How?

  Revised plan:
  - Each participant has an envelope with a state card (color) that they cannot see. They also have a mechanism to produce a report. The mechanism depends on the wiring.

  How to hide the state:
  - Each participant has an envelope with a color card (e.g., red, blue, green) inside. They cannot open it. The state is fixed at the beginning of the round and remains until the round ends.

  How they report:
  - Depending on the wiring, they either:
    a) Look at a mechanism that tells them what to report (e.g., in direct wiring, the mechanism reads the state and tells them the report).
    b) Use a rule (like rolling a die) that is set up to correlate with the state (in common cause, the die roll sets both state and report).

  But note: the state is in the envelope and fixed. How do we change the wiring without them knowing?

  We need a way for the facilitator to set the state and the report mechanism without revealing.

  Proposal:
  - At the beginning of each round, the facilitator gives each participant an envelope (with a colored card inside, hidden) and a set of instructions for that round (which may involve using dice, or a pre-written list, etc.) that determines how they generate their report.

  The state for each participant is set by the facilitator at the start of the round (by putting a colored card in the envelope). The report is generated by the participant following the instructions for that round.

  The wiring is about how the report generation instructions relate to the state.

  Roles:
  - Participants (14): They have an envelope (hidden state) and generate reports.
  - Wiring Inspectors (2): They see a diagram of the wiring for the round (but not the actual states or reports). They must not see the states.

  Scoring: After each round, the facilitator collects the reports and the true states (from the envelopes) and scores accuracy. The group's accuracy is announced (but not individual).

  Divergence test: We change the wiring without telling them and see that the accuracy remains high.

  Rounds:

  Round 1: Direct Wiring
  - Wiring: State causes report. The participant's report is determined by the state. How? The participant is given a rule: "Open the envelope and report the color inside." But wait, that would reveal the state to them. We don't want that because in the analogy, the subject doesn't have direct access to the state (consciousness). 

  Alternative: The facilitator has set the state and also given a report mechanism that depends on the state without the participant seeing the state. But how?

