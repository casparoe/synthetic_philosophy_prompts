answer: |-
  ### Activity Design: "The Reporting Game"

  **Core Mechanics**: Participants generate "state reports" based on hidden states (colored cards in envelopes). Wiring configurations alter the causal relationship between states and reports. Accuracy remains high across all rounds, creating a tension between first-person confidence and third-party wiring knowledge.

  ---

  **Table 1: Run Sheet**  
  | clock  | round        | wiring_in_force                                  | what_participants_do                                                                 | what_facilitator_does                                                                                                                                 | what_it_should_feel_like_from_inside                               | what_can_go_wrong_here                                                                 |
  |--------|--------------|--------------------------------------------------|--------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------|----------------------------------------------------------------------------------------|
  | 00:00  | Setup        | None                                             | Sit at stations. Receive role cards, state envelopes (sealed), report tools.         | Distribute materials. Explain: "Your goal is to accurately report your hidden state (color). Never open state envelopes." Assign 2 wiring inspectors.  | Anticipation. Focus on "doing well" by matching reports to states. | Confusion about rules; participants peek at state cards.                              |
  | 00:10  | Round 1      | State → Report (direct causation)                | Roll die. Write report based on die roll (1-2: red, 3-4: green, 5-6: blue).          | Preloads state envelopes to match die outcomes (e.g., die=3 → state=green). Collects reports, checks vs. states, announces group accuracy (100%).     | Confidence: "My die roll *reveals* my state."                      | Participants infer states from die rolls; wiring inspectors leak diagrams.             |
  | 00:25  | Round 2      | Common Cause (die sets state + report)           | Roll die. Write report based on die roll (same mapping).                             | Uses *one die roll* to set *both* state and report (e.g., die=5 → state=blue, report=blue). Collects reports, scores, announces accuracy (100%).      | Same as Round 1: "My report feels directly tied to my state."      | Mismatches if facilitator errs; participants notice identical process to Round 1.     |
  | 00:40  | **Divergence** | Switch to Prewritten (no announcement)         | Roll die. Write report based on die roll (same as before).                           | **Ignores die rolls**. Uses prewritten list (created pre-class) for reports. Sets states to match list. Scores, announces accuracy (100%).            | **No change**: "Still accurate, so nothing’s different."           | Participants detect facilitator ignoring rolls; group accuracy dips if list has errors. |
  | 00:55  | Round 3      | Prewritten List (report and state set by list) | Roll die. Write report based on die roll.                                            | Uses prewritten list for reports. Sets states to match list. Announces accuracy (100%).                                                               | Unease: "Why roll the die if it’s ignored?" but confidence persists. | Frustration at "pointless" die rolls; wiring inspectors confused by diagram mismatch. |
  | 01:05  | Round 4      | Orphaned Report (1 participant’s report random) | Roll die. Write report based on die roll.                                            | For 15 participants: sets state → report (as Round 1). For 1 orphan: sets state randomly, report randomly (same die mapping). Scores (group: ~94%).  | Orphan feels identical: "I scored perfectly last round!"           | Orphan’s low accuracy drops group score; others suspect sabotage.                     |
  | 01:15  | Closing      | Orphan revealed                                  | Orphan is asked about trust in next report. Others observe.                          | Tells orphan: "Last round, your reports were random, not from your state." Asks: "What would you stake on your next report being accurate?"           | Orphan: Shock. Others: "Could *I* be the orphan?"                  | Orphan dismisses the reveal; group fixates on "unfairness" not epistemology.          |

  ---

  **Table 2: Debrief Map**  
  | minute | moment_from_the_activity              | which_objection_it_delivers       | question_to_put_to_the_room                          | answer_to_draw_out                                                                 | misreading_to_head_off                                                                 |
  |--------|---------------------------------------|-----------------------------------|------------------------------------------------------|------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------|
  | 70     | Round 2 wiring diagram (Common Cause) | Screening-off                     | "The wiring inspector saw the die caused both state and report. Does the report track the state or the die?" | "The die—but it *correlates* with the state. The state doesn’t cause the report."    | "But the report *is* about the state!" → Clarify: correlation ≠ causation.             |
  | 73     | Round 3 reveal (Prewritten List)      | Explanatory                       | "Accuracy was 100% in Round 3, but reports came from my list. Was this luck or design?" | "Design—a ‘conspiracy’ (the list) ensured accuracy. No role for the state."         | "But it worked!" → Stress: explanation matters, not just outcome.                     |
  | 76     | Orphan’s closing moment               | Trust                             | "The orphan scored 3/3 before the reveal. Why can’t they trust their next report?" | "Past accuracy was coincidental. Without causation, they have no grounds for trust." | "But it was right before!" → Ask: "Does coincidence justify future bets?"             |
  | 78     | Round 4 orphan setup                  | Counterfactual                    | "If the orphan’s state had been different, would their report have changed?"   | "No—reports were random. States and reports were independent."                     | "But they matched!" → Note: this round’s match was luck, not necessity.              |

  ---

  **Table 3: Roles**  
  | role               | n  | what_they_can_see                          | what_they_are_denied                     | brief_as_written_on_the_card                                                                 |
  |--------------------|----|--------------------------------------------|------------------------------------------|---------------------------------------------------------------------------------------------|
  | Participant        | 14 | Their own report die and written reports.  | Seeing their state, wiring diagrams, others’ states/reports. | "Report your hidden state (color) each round. Roll the die, write the result (1-2: red, 3-4: green, 5-6: blue). Never open your state envelope!" |
  | Wiring Inspector   | 2  | Wiring diagram for current round (on card). | Actual states, reports, or scores.       | "You see how reports are generated. Do not share this! Note: you cannot see states or reports, only the causal diagram." |

