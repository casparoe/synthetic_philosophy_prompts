prompt: |-
  You are a professional philosopher specialising in epistemology and the philosophy of language, with a particular brief on the norms governing speech. Please think the problem through carefully, and spend some time at the start brainstorming candidate requirements and the cases that motivate them before you settle on a final list: I would much rather have six requirements that have been pruned than twenty that have not been examined. Answer throughout in British English, and don't spend your word count on citations, bibliographies or a reading list — I know the literature and I want the argument.

  I am writing the specification section of a paper on the epistemic significance of testimony, and I have realised that I don't know what I am entitled to ask a norm of assertion to do. So write me the desiderata: what any adequate account of the norm governing assertion has to deliver — which cases it must get right, which distinctions it must respect rather than collapse, which surrounding commitments it has to stay consistent with — with the case or consideration behind each requirement, and, for each, your verdict on whether it is non-negotiable or merely the prejudice of one camp. Since adequacy is relative to a purpose, let me fix mine: I need a norm that can do two jobs. First, it has to underwrite an account of what a hearer gains when a speaker asserts — why relying on an assertion is different from picking up a belief from overheard noise, and how a hearer's warrant can survive even when the speaker has in fact violated the norm. Second, it has to work as ex ante guidance for speakers who are not in a position to tell whether they know: the asserters I care about are institutional — a press office, an expert panel, an automated announcement system — rather than individuals in conversation. I take it that second job tells against the best-known candidate norm, and I want to see how much it really tells against it, not just that it does.

  Here are the cases I have on my own list; give me yours before you look at mine, and tell me which of mine are genuine constraints and which are only demands I have smuggled in from a favoured theory. The Moorean pair ("the meeting is at noon and I don't believe it is") and the standard challenge data — that "How do you know?" is the canonical retort, that "but it's true, though" does not answer it, and that "you don't believe that" reads as an accusation of insincerity rather than a criticism of the assertion as such. The Gettierised and fake-barn asserter, and the careful asserter whose well-supported claim turns out false: the norm needs to be able to mark something as defective without marking it as blameworthy, and I want to know whether that distinction is a requirement or a repair. The selfless assertion — the friend who must tell a bereaved owner that the dog died on the table on the strength of hearsay she would normally discount. Assertion on merely statistical evidence: the administrator who can see that 499 of 500 tickets were paid and asserts, of this ticket, that it was. The author who asserts every sentence of her book and also asserts, in the preface, that at least one of them is false — does the norm require global consistency across a speaker's assertions, or is that a demand that only looks compelling if you already have belief in view? The spokesperson asserting for a committee whose evidence is distributed across members, no one of whom knows; the automated departure board or generated readout, where nothing believes anything at all; the pre-recorded statement or will, released after the speaker is dead and after circumstances have changed so that what was asserted is now false and known to be false by everyone, with no possibility of retraction, update or ordinary blame; the sealed diary and the assertion made in a language no one present understands, where there is no uptake. Hedging — why "I think it's probably p" lowers the bar, and whether it lowers it all the way to nothing. And the speaker who asserts with complete indifference to whether things are so, but who happens to believe it and happens to be right.

  Then the two things I most want. First, tell me which single requirement excludes the most candidates, and say plainly which of the things people demand of a norm in this area are real and which are the shibboleths of a camp. Second, and this is the part I would read twice: is any subset of the desiderata jointly unsatisfiable — is there a pair or a triple that a norm cannot deliver together, so that the list itself becomes a result? I have a suspicion there is a trilemma somewhere in the vicinity of (a) explaining the knowledge-challenge and Moorean data, (b) being followable by a speaker who cannot tell whether she knows, and (c) staying invariant across stakes while still handling the statistical-evidence cases; if that is not where the real conflict lies, tell me where it is. Close with a short scorecard — a few lines each, no padding — for the knowledge rule as Williamson defends it, the truth rule, the belief rule, and the warranted-assertability or reasonableness rule. The criteria are the deliverable, not the scoring.
reasoning: |-
  Hmm, this user is clearly a professional philosopher working on epistemology and testimony, with a sophisticated grasp of the literature. They're writing a paper on the epistemic significance of testimony and need help articulating desiderata for norms of assertion. Their core tension is between explaining hearer-side warrant and providing ex ante guidance for institutional speakers who can't self-ascribe knowledge.

  The user presents an extensive list of cases: Moorean paradoxes, Gettier cases, statistical evidence dilemmas, institutional assertions, automated systems, preface paradoxes, and more. They're explicitly asking me to first generate my own candidate requirements before comparing with theirs - a sign they want independent critical engagement rather than just validation. The real meat is in their suspicion about a trilemma involving (a) knowledge-challenge data, (b) followability by non-omniscient speakers, and (c) stake-invariance while handling statistical cases.

  Key challenges emerge: How to handle cases where speakers violate norms blamelessly? How to explain what hearers gain from testimony versus mere noise? The institutional angle is crucial - these are speakers who can't introspect belief or knowledge states. This immediately pressures Williamson's knowledge rule, which they anticipate.

  For desiderata, I'll need to distill about six robust requirements. Non-negotiable ones should include: explaining challenge practices (Moorean/How do you know data), distinguishing defectiveness from blameworthiness, handling hearer-side warrant transfer, and providing action-guidance for non-omniscient asserters. More contestable might be global consistency requirements or complete stake-invariance.

  The trilemma suspicion seems sharp: Knowledge-based norms explain challenge data well but fail followability for institutional speakers; warrant-based norms handle followability but struggle with statistical cases; stake-relative norms accommodate hedging but collapse challenge practices. This may be where the real theoretical tension lies.

  For the scorecard, I'll assess major norm candidates against the dual-purpose test: Williamson's knowledge rule excels at hearer-side warrant but fails institutional guidance; truth rule is too weak; belief rule ignores external factors; warrant rules handle guidance but risk being too permissive in statistical cases. The user's institutional focus suggests warrant-based norms might be most promising despite tradeoffs.
answer: |-
  Here is a distilled set of desiderata for a norm of assertion, prioritised for your dual purpose (hearer warrant & institutional speaker guidance), with rationale and assessment of negotiability. I generated this list independently before evaluating yours.

  ### Core Desiderata (Non-Negotiable for Your Purpose)
  1.  **Hearer-Warrant Transfer:** The norm must explain how a hearer can gain *prima facie* epistemic warrant for believing *p* simply by understanding and accepting a sincere assertion that *p*, even if the speaker violated the norm (e.g., was Gettiered). This distinguishes testimony from overheard noise.
      *   *Case:* Hearer justifiably relies on a speaker's Gettiered assertion ("Jones owns a Ford") which is luckily true. The hearer gains warrant, though the speaker lacked knowledge.
      *   *Non-Negotiable:* Essential for your first job. Without this, testimony lacks distinctive epistemic force.

  2.  **Defectiveness Without Blame:** The norm must mark assertions as *defective* (violating the norm) even when the speaker is not *blameworthy* (epistemically or morally). Violation must be an external, factive matter.
      *   *Cases:* The Gettiered speaker; the Fake Barn asserter; the careful, well-supported but false asserter; the pre-recorded statement now known to be false.
      *   *Non-Negotiable:* Crucial for handling luck and speaker fallibility objectively. Blame concerns *how* the speaker formed the assertion; defectiveness concerns *whether* the assertion meets its constitutive standard.

  3.  **Challenge & Moorean Data:** The norm must explain why "How do you know?" is the canonical, appropriate challenge to an assertion, and why Moorean assertions ("p and I don't believe p", "p and I don't know p") are inherently paradoxical/dysfunctional.
      *   *Case:* The challenge data and Moorean absurdity.
      *   *Non-Negotiable:* Anchors the norm in core linguistic practice. A norm failing this lacks explanatory power for assertion's social role.

  4.  **Action-Guidance for Non-Omniscient Speakers:** The norm must provide *ex ante*, practically usable guidance for speakers (especially institutional ones) who cannot infallibly determine whether they satisfy its primary condition *at the time of assertion*. The guidance cannot require knowing whether one knows.
      *   *Cases:* The press officer, expert panel, automated system; the careful asserter (before learning their evidence was misleading).
      *   *Non-Negotiable:* Mandatory for your second job. Rules demanding self-ascription of knowledge fail here.

  ### Important But Potentially Negotiable/Camp-Sensitive Desiderata
  5.  **Accommodating Non-Believing Asserters:** The norm must account for assertions made by agents who lack belief in *p* (or lack beliefs altogether), yet whose assertions can still transmit warrant *if* they satisfy the norm.
      *   *Cases:* The spokesperson asserting for the committee (distributed evidence); the automated departure board; the indifferent speaker who happens to be right; the sealed diary/unknown language case (assertion exists prior to/hearers gain warrant later).
      *   *Assessment:* Highly important, potentially non-negotiable for your focus. Rules requiring *actual* speaker belief (not just commitment) fail. Williamsonians might resist, arguing assertion *entails* belief, but your cases strongly pressure this requirement.

  6.  **Statistical Evidence & Hedging:** The norm must explain the intuitive defectiveness of flat-out assertions based *solely* on bare statistical evidence ("Ticket #499 was paid, because 499/500 were"), while also explaining how hedging ("I think it's probably p") appropriately weakens the commitment and lowers the bar.
      *   *Cases:* The ticket administrator; hedging.
      *   *Assessment:* Important test case. Williamsonians often bite the bullet (assertion defective). Others see this as pressure against the Knowledge Rule. Hedging data suggests norms can be contextually modulated, but a core norm must explain the *default* high-stakes requirement.

  ### Your Cases Assessed
  *   **Genuine Constraints:** Moorean/Challenge, Gettier/Fake-Barn/Careful False Asserter (esp. defectiveness/blame distinction), Selfless Assertion (tests sincerity/norm independence), Statistical Evidence, Spokesperson/Committee, Automated Systems, Pre-recorded Statement (defectiveness post-hoc), Hedging. *These directly probe norm satisfaction, warrant transfer, speaker guidance, and the belief/knowledge link.*
  *   **Potential Smuggling (Belief-Centric):** Author/Preface Paradox (strongly pressures global consistency, which may conflate assertion norms with belief aggregation norms - assertion norms are typically local/individual), Speaker asserting indifferently but correctly (tests belief requirement - if norm doesn't require belief, this isn't necessarily defective *qua* assertion). *Your phrasing ("only looks compelling if you have belief in view") is apt for Preface/Indifference.*

  ### The Key Conflict & Most Excluding Requirement
  *   **Most Excluding Requirement:** **Action-Guidance for Non-Omniscient Speakers (Desideratum 4)**. This directly excludes norms where the primary condition cannot be reasonably assessed *ex ante* without near-omniscience, most notably the **Knowledge Rule (KR)** as standardly defended (assert only what you know). If the speaker cannot tell whether they know, KR offers no usable guidance. "Assert only what you are reasonably warranted in believing you know" becomes a different norm (a warrant rule).
  *   **The Real Trilemma:** Your suspicion is acute. Tension exists between:
      1.  **Explaining Challenge/Moorean Data** (strongly suggests KR).
      2.  **Providing Action-Guidance** (requires a norm based on accessible warrant/reasonableness).
      3.  **Handling Statistical Evidence** (bare stats often insufficient for knowledge/justified belief, making assertion defective on KR/warrant rules, but intuitively *should* be assertable?).
      *   **Conflict:** (1) pushes towards a factive, external norm like KR. (2) pushes towards a non-factive, internal norm based on evidence/reasonableness. (3) is a battleground - KR proponents see defectiveness as correct; Reasonableness proponents see bare stats as sufficient warrant for assertion in low stakes. **Satisfying (1) and (2) simultaneously is the core tension.** (3) sharpens it but doesn't create the fundamental incompatibility. KR struggles with (2); non-factive warrant rules struggle to fully explain (1) with the same force.

  ### Norm Scorecard (Against Your Dual Purpose)
  *   **Knowledge Rule (Williamson):** *Deliverable:* Explains challenge/Moorean data perfectly; marks Gettier/fake barn/false assertions as defective. *Undeliverable:* No usable *ex ante* guidance for non-omniscient speakers (fatal for institutional use); struggles massively with non-believing asserters (automata, spokespersons); makes statistical assertions defective (contested).
  *   **Truth Rule (Weiner?):** *Deliverable:* Action-guidance is clear (assert only truth - though knowing *what is true* is impossible *ex ante*); handles non-believing asserters if truth condition met. *Undeliverable:* Fails challenge/Moorean data completely ("How do you know?" irrelevant, Moorean not paradoxical); cannot explain defectiveness of Gettiered/well-supported false assertions (they are false, but speaker couldn't know); fails hearer-warrant transfer (hearer gains no warrant from a merely true assertion by a guesser).
  *   **Belief Rule (Bach?):** *Deliverable:* Some action-guidance (assert what you believe); explains "you don't believe that" challenge. *Undeliverable:* Fails Moorean "I don't know" variant; cannot explain defectiveness of false assertions *simpliciter* or Gettiered ones; fails non-believing asserters completely; weak on hearer-warrant transfer (belief ≠ warrant).
  *   **Warranted Assertability/Reasonableness Rule (Lackey, Kvanvig):** *Deliverable:* Provides *ex ante* action-guidance (assert what you are reasonably warranted in believing true); explains defectiveness of statistical assertions (if insufficient warrant); handles non-believing asserters if warrant condition met institutionally (e.g., automated system designed on good evidence); can accommodate defectiveness/blame distinction. *Undeliverable:* Struggles to explain the *prima facie* sufficiency of "I know" to answer "How do you know?" and the deep paradox of Moorean assertions as well as KR; warrant criteria can be context/stakes sensitive, potentially undermining invariance. Hearer-warrant transfer needs careful handling (depends on warrant being shared/transmissible).

  **Conclusion:** Your institutional focus makes **Action-Guidance for Non-Omniscient Speakers** the critical constraint, powerfully excluding the pure Knowledge Rule. The fundamental tension lies between this desideratum and the **Challenge/Moorean Data**. A sophisticated **Warranted Assertability/Reasonableness Rule** emerges as the strongest candidate for *your* purpose, though it must grapple with explaining the residual force of the knowledge challenge. Statistical evidence cases remain contested within this framework. The distinction between **defectiveness** (norm violation) and **blameworthiness** is a non-negotiable requirement, not a repair.
