  Given the one-year constraint, I would suggest prioritizing the core question about collective virtù over subsidiary inquiries about semantic unity of fortuna or the exact mechanism of republican advantage. The deliverables should include both the dissertation chapter and a conference paper framing the institutional reading against the individualism critique.

