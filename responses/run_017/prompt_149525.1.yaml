  For methodology, I would recommend focusing on argumentative coherence analysis rather than purely textual comparison or intellectual history. This approach would examine how Machiavelli's claims about institutional flexibility function within his broader political theory. The prospectus should outline clear phases: establishing baseline interpretations, analyzing key passages, developing the institutional virtù argument, and testing it against counterevidence.

