prompt: |-
  I am writing a chapter on sceptical scenarios in expected-value reasoning about the very long-run future, and I keep encountering an argumentative configuration for which I have no label. I do not need citations or a reading list; what I need is the shape of the thing and a definition I can use.

  The first form it takes goes like this. Someone introduces the possibility that the world we inhabit is a computer simulation run by some other civilisation, and concludes that a project aimed at affecting the far future should have its expected value scaled down by roughly the probability that we are in such a run — because the run will probably be terminated before the future we are trying to affect arrives, or because the simulators will not permit the consequences we care about to accumulate. What I cannot name is what happens around that move. Nothing else in the calculation is re-derived under the hypothesis that has just been taken seriously. The size of the payoff is left at its pre-hypothesis value, even though a civilisation capable of running our world is presumably capable of running many like it, so that conditional on the project succeeding the number of beings affected may be larger rather than smaller. The location of the effects is left alone, even though on that hypothesis what we do here might matter primarily by influencing the simulators rather than by propagating through our own future, so that the hypothesis relocates the stakes instead of removing them. And no comparable scaling is applied to the near-term options the project is being compared against, even though the termination worry applies to them in kind — it is only that over a short enough window the accumulated risk is too small to notice. The hypothesis is consulted at exactly one point in the reasoning.

  The second form is the mirror of it. In the same discussion, the hypothesis is used to deflate one high-stakes project and then, a few paragraphs later, used as a positive reason for a different expenditure — that if we are being watched, it matters what the run looks like to whoever is watching. Nothing is said about why the hypothesis is epistemically live in the first use and inert in the second, or about what makes it a reason-generator in one place and a reason-killer in another.

  I want to be clear that I am not after the broad psychological diagnosis. There is a principled version of the asymmetry: the probability of termination plausibly accumulates with elapsed time, so it is entirely in order for long-horizon projects to be discounted more heavily than short-horizon ones, and a discount with the right time-profile is not the thing I am trying to isolate. What I am after is narrower: a hypothesis that is admitted into the probability term of one option's expected value and then withheld from the value term, from the alternative options, and from any use that would raise rather than lower the total.

  So: does this configuration have an established name in epistemology, decision theory, or the literature on long-term priorities? If it does, I want it together with the conditions under which it applies. If it does not, I want it named and defined, with its edges marked. Either way, tell me how it differs from each of the things it resembles — ordinary motivated or confirmation-biased use of evidence, which is about which evidence gets sampled rather than about the asymmetric role one scenario plays inside a single calculation; scepticism of the Pascal's-mugging sort, which worries about the magnitude of small probabilities of enormous payoffs rather than about scenario-dependence; debunking arguments and the familiar objection that they generalise too far or undermine themselves, which is structurally close but seems to target a whole domain of belief rather than one term in one computation; the undercutting-versus-rebutting distinction among defeaters, which classifies an evidential relation rather than a pattern of deployment; and the first-order claim that a run would probably be shut down early, which is a substantive risk rather than a fact about how that risk is used.

  Give me boundary cases as well: the principled time-horizon discount that is not an instance; a treatment that adjusts probability and payoff together under the hypothesis; a case in which the hypothesis is deployed only to raise the stakes; and the case where a reason for the asymmetry is explicitly offered but is a bad reason. Tell me what I would have to find in a piece of argument to diagnose the opportunistic version rather than the principled one. And finally: when the hypothesis is applied symmetrically, does the dampening of far-future fanaticism survive at all, or does it turn out to have been transferring the fanaticism somewhere else?
reasoning: |-
  Okay, the user is writing a chapter on sceptical scenarios in expected-value reasoning for the long-run future. They've encountered a specific argument pattern they can't name. They describe two forms: one where a simulation hypothesis is used to discount long-term projects by scaling down expected value based on termination probability, without adjusting other factors like payoff size or location of effects. The second form uses the same hypothesis to deflate one project but then inflate another, like suggesting that influencing the simulators matters. 

  The user needs a term for this asymmetric use of a hypothesis in expected-value calculations. They want to distinguish it from related concepts like motivated reasoning, Pascal's mugging, or debunking arguments. They also want boundary cases to clarify the concept.

  First, I recall that in decision theory, expected value calculations involve probability and value terms. The issue here is that the sceptical scenario (like simulation hypothesis) is only applied to the probability part for specific options, not consistently across the calculation. This seems like a form of selective application. 

  Terms like "asymmetric updating" or "partial conditionalization" come to mind, but they might not capture the opportunism. "Motivated stopping" or "variable bracketing" are possibilities, but perhaps not precise enough. The key is the inconsistency: the hypothesis affects only one term (probability) for one option, while ignored elsewhere. 

  The term "opportunistic scepticism" feels right because it highlights how the scepticism is applied selectively to serve a purpose—downplaying one project while ignoring it when inconvenient. The user mentioned it's not about psychological bias but the structural asymmetry in the argument. 

  For boundary cases: a principled time-discounting where termination risk increases with time isn't this phenomenon. If the hypothesis adjusted both probability and payoff (e.g., considering multiple simulations increasing affected beings), that would be symmetric. If the hypothesis only raised stakes (e.g., simulators rewarding certain actions), that's the opposite asymmetry. A bad reason might be claiming the hypothesis only affects long-term projects without justifying why it doesn't alter payoffs or other options.

  When applied symmetrically, the dampening might not hold. If simulations increase the number of affected beings, the expected value could even rise. The fanaticism might shift to influencing simulators instead of the long-term future. This shows the original asymmetry was crucial to the deflationary effect.
answer: |-
  Based on your precise description, the argumentative configuration lacks a single universally established term. However, it strongly resembles and can be rigorously defined as **Opportunistic Scepticism** within expected-value reasoning. Here's the definition, boundaries, and distinctions:

  **Term:** **Opportunistic Scepticism (in Expected-Value Reasoning)**
  *   **Definition:** The selective application of a specific sceptical hypothesis *only* to diminish the expected value of a particular option (or class of options) within a decision analysis, while systematically neglecting to:
      1.  **Re-derive other value parameters:** Update the magnitude, nature, or location of potential payoffs *conditional on the hypothesis being true* (e.g., ignoring potential scaling up of affected beings or shifts in where value is realized).
      2.  **Apply the hypothesis symmetrically:** Apply the same sceptical considerations to the probability *or* value terms of alternative options being compared, especially those with different time horizons or focus.
      3.  **Explore consistent implications:** Consider how the hypothesis could *increase* the expected value of *any* option, even the one being discounted, if its implications were fully explored.
  *   **Core Feature:** The sceptical hypothesis functions solely as a *one-way discounting device* applied narrowly to the probability term of the disfavoured option's distant outcomes, creating an *artificial asymmetry* in the analysis.

  **Distinctions from Related Concepts:**

  1.  **Motivated Reasoning/Confirmation Bias:** Focuses on *which evidence is sought or weighted*, not the *structural asymmetry within a single calculation* once a specific hypothesis is admitted. Opportunistic Scepticism is about *how* an admitted hypothesis is *used* within the EV formula.
  2.  **Pascal's Mugging:** Worries about the *product* of tiny probabilities and vast utilities. Opportunistic Scepticism worries about the *asymmetric application of a specific scenario* affecting only one term for one option, regardless of absolute probability size.
  3.  **Debunking Arguments & Self-Undermining:** Targets the *epistemic foundation* of a whole belief domain (e.g., moral realism). Opportunistic Scepticism targets a *single term in a specific computation* within an argument, without necessarily attacking the foundations of the value system itself.
  4.  **Undercutting vs. Rebutting Defeaters:** Classifies *how* evidence challenges a belief (undermining the connection vs. providing counter-evidence). Opportunistic Scepticism describes a *pattern of deployment* of a defeater within a decision-theoretic framework.
  5.  **Substantive Termination Risk:** The claim "simulations likely terminate" is a first-order risk assessment. Opportunistic Scepticism is the *argumentative move* of incorporating this risk *only partially and asymmetrically* into the EV calculation.

  **Boundary Cases & Diagnostics:**

  1.  **Principled Time-Horizon Discount (Not an Instance):**
      *   *Scenario:* Assign a termination probability `p_t` that increases monotonically with time `t`. Apply `(1 - p_t)` as a discount factor *to the value of outcomes at time t* for *all* options whose primary payoffs occur at t.
      *   *Why Not?* The discount is applied consistently based on time-to-payoff, affects the value term proportionally to the risk's time profile, and would apply equally to any long-term project compared to short-term ones. The hypothesis (simulation) is merely the *source* of `p_t`, not applied opportunistically.
  2.  **Symmetric Adjustment of Probability & Payoff (Not an Instance):**
      *   *Scenario:* Under the simulation hypothesis, reduce the probability of long-term survival (P), *but also* increase the estimated number of affected beings (V) if the project succeeds (due to multiple runs). Calculate EV = P * V under the hypothesis for the long-term project and for alternatives.
      *   *Why Not?* The hypothesis is used to update *both* terms of the EV calculation consistently. This might still dampen fanaticism if P decreases more than V increases, but it's structurally symmetric.
  3.  **Hypothesis Used Only to Raise Stakes (Opposite Asymmetry):**
      *   *Scenario:* Argue that conditional on being in a simulation, influencing the simulators (e.g., via remarkable cooperation or aesthetic achievements) is the *primary* source of value, vastly outweighing intrinsic future effects within the sim. This increases the EV of projects aimed at "impressing the simulators."
      *   *Why Different?* Here the hypothesis is used *opportunistically* to *inflate* the value term (V) for a *favoured* option, rather than *deflate* P for a disfavoured one. It's the mirror image.
  4.  **Bad Reason Offered for Asymmetry (Diagnostic for Opportunistic Version):**
      *   *Scenario:* The arguer acknowledges the simulation hypothesis could increase V (more beings) or shift value location (influence simulators) but dismisses this by *fiat*: "We only care about *our* future within the sim," or "Simulator values are too unknowable to factor in," *without* applying similar constraints to the probability discount or to alternative options. Or, they claim short-term options are immune to termination risk without quantifying why the risk over short horizons is truly negligible *given the specific sceptical scenario*.
      *   *Diagnostic:* The presence of hand-waving justifications for *why* the hypothesis only impacts the probability term for the long-term project's distant payoff, while ignoring its potential impact on V or other options, strongly signals the *opportunistic* version. The principled version relies on the explicit, quantifiable time-dependence of the risk (`p_t`).

  **Symmetrical Application & the Fate of Fanaticism:**

  If the simulation hypothesis is applied *symmetrically* to update *both* probability (P) *and* payoff (V) for *all* relevant options:
  *   **Dampening Effect on Far-Future Fanaticism:** The *original* form of far-future fanaticism (aiming for astronomical value *within our single, long-lasting timeline*) is likely significantly dampened. The cumulative termination risk (`1 - P`) acts as a powerful discount.
  *   **Potential Transfer/Transformation:** However, fanaticism *may transfer*:
      1.  **To Influencing Simulators:** If V is updated to reflect value realized through simulator influence, and this value is deemed potentially vast or crucial, fanaticism could shift towards projects maximizing *this* influence ("Simulator Fanaticism").
      2.  **To Scale (Multiple Simulations):** If V is updated to reflect the potential number of simulations affected (e.g., if our actions influence simulator policies affecting many runs), the expected value could become *even larger* than the original non-simulation estimate, potentially *increasing* fanaticism focused on affecting simulation *policies* or *creation*. (`EV = P_survive * N_sims * V_per_sim` could be huge even if `P_survive` is low).
      3.  **To Probability of Being "Real":** Fanaticism might focus resources on increasing the (likely tiny) probability that we *aren't* in a simulation, if "real" existence is deemed vastly more valuable.
  *   **Conclusion:** The symmetric application doesn't guarantee the *elimination* of fanaticism; it often *transforms* it. The dampening of the *specific* form of fanaticism targeting the very long-term future *within our apparent timeline* survives, but the overall expected value landscape shifts, potentially creating *new* focal points for extreme resource allocation. The original asymmetry was crucial to achieving the *pure dampening* effect without confronting these transformations.

  **In essence:** You've identified **Opportunistic Scepticism** – the strategic, partial deployment of a sceptical scenario solely as a discount on the probability term of a disfavoured long-term option's payoff, while insulating the value term, alternative options, and any upside potential of the scenario itself from its implications. The principled core (time-dependent risk) is valid; the opportunism lies in the selective, incomplete application within the expected-value framework.
