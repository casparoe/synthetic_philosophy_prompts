prompt: |-
  I want the specification before I commit to any account of genetic information: what would a theory of what makes a stretch of DNA — or any molecular structure — information-bearing have to get right in order to be more than a suggestive metaphor? Write me the desiderata: the phenomena it must explain, the cases it must handle, the distinctions it must not collapse, with the consideration behind each, marking which requirements you take to be non-negotiable and which are only preferences of one camp.

  The cases I most want covered:

  - The baseline: a nucleotide sequence whose relation to the amino-acid sequence it helps produce looks chemically arbitrary, and is in fact read differently in some organelles and lineages, as against the relation between a polypeptide and the shape it folds into, which looks chemically forced. A theory should either explain why the first invites information talk and the second does not, or explain the contrast away.
  - Context-sensitivity: one stretch of sequence yielding different products in different cells or at different times, via splicing, editing, shifted reading frames or regulatory state, so that content cannot simply be a property of the sequence alone.
  - Heredity without sequence: methylation and chromatin marks, cytoplasmic and structural templates passed from parent to offspring. The theory must either admit these as information or exclude them on a stated principle.
  - The reaction norm: one genotype, many phenotypes across environments; one phenotype, many genotypes. Whatever codes for means here, it had better not mean specifies uniquely.
  - A lineage I'll call L, in which the codon-to-amino-acid mapping is not fixed by the genome: the adaptor molecules that set the mapping are handed down as finished molecules from parent to offspring, and the lineage can shift to a different mapping within a few generations with no change in the DNA sequence of its genes. Does L's DNA carry the same information under a different code, or different information? Is the inherited mapping itself information — information about how to read other information — and if so does the account face a regress, given that reading it seems to require machinery whose own specification already presupposes some mapping?
  - An environmental cue that is chemically arbitrary with respect to the developmental switch it triggers but has been reliably present throughout the lineage's history. If arbitrariness plus reliability is what does the work, this cue qualifies: say whether the theory accepts that, and if not, what else it demands — a source with the right history, a consumer whose proper function is to interpret, or something further.

  Also: state what the theory is for (grounding molecular biology's explanatory practice, or settling a metaphysical question about content) and whether the list changes with that purpose. Then tell me which pair of requirements you suspect cannot be jointly satisfied, so that the list is itself a result, and which single requirement excludes the largest family of views. Close with a brief scorecard — a short paragraph each — for the main families: the literalist genetic-code view, deflationary causal or parity views, teleological-selection-based views, and developmental-systems views. No bibliography or citations, please, and write in British English.
reasoning: |-
  Hmm, this is a deep and challenging question about the nature of information in biology. The user wants a rigorous specification for what would make a theory of genetic information more than just a metaphor. They've listed several complex cases that any such theory must handle, from codon arbitrariness to epigenetic inheritance.

  I need to approach this systematically. First, I should identify the core requirements that any credible theory must meet (the non-negotiables), then address their specific case studies one by one. The cases they present are particularly thorny - like lineage L where the genetic code itself can change without DNA alteration, or environmental cues that function informationally despite being "arbitrary."

  For the non-negotiables, it seems essential that the theory must explain the arbitrariness of the genetic code (why DNA sequences are informational while protein folding isn't), handle context-sensitivity in gene expression, and deal with heredity beyond DNA sequences. Without these, any theory would just be hand-waving.

  The user also wants to know where conflicts might arise between requirements. I suspect there's tension between wanting information to be "in" the molecule itself (for molecular biology purposes) versus it being relational (which teleological theories emphasize). And the requirement to avoid regress in lineage L might clash with theories that make interpretation fundamental.

  For scoring existing views: literalist code theories fail spectacularly on context-sensitivity and heredity beyond sequences. Deflationary views handle some cases but miss the normativity. Teleosemantic views are stronger but stumble on developmental plasticity. Developmental systems theories are comprehensive but risk collapsing useful distinctions.

  The user seems deeply knowledgeable - they're not satisfied with superficial answers. Their focus on "what the theory is for" suggests they want to avoid philosophical vagueness and ground this in actual biological practice. I should be precise about how explanatory purposes might shift the requirements.

  I'll structure this by first listing all desiderata with their rationales, then handling each case explicitly, then addressing the meta-questions about purpose and conflicts before scoring the main theoretical families. The closing scorecards should be brutally honest about each approach's shortcomings relative to the specification.
answer: |-
  Here is a specification for a theory of molecular information, derived from your desiderata and cases:

  **Core Purpose:** To ground molecular biology's explanatory practice (e.g., explaining gene function, regulation, heredity, variation) by clarifying what warrants "information" talk beyond metaphor. If the purpose were metaphysical content, the list *might* soften on explanatory utility but harden on abstract definitional boundaries.

  **Non-Negotiable Desiderata (Essential for Explanatory Practice):**

  1.  **Arbitrariness & Convention:** Must explain the fundamental difference between sequences whose causal role depends on contingent, lineage-specific *decoding rules* (like codons read via tRNA adaptors) and sequences whose causal role is dictated by inherent physico-chemical law (like polypeptide folding). The theory must show why arbitrariness necessitates an informational interpretation for the former. *Rationale:* This is the core phenomenon inviting information talk in molecular biology; failing here means failing entirely.
  2.  **Context-Sensitivity:** Must account for how the "content" or causal effect of a molecular structure (e.g., a DNA sequence) is determined not solely by its intrinsic structure but by the *cellular context* (splicing machinery, editing enzymes, transcription factors, metabolic state). Information must be relational. *Rationale:* Central to gene regulation and developmental biology; a theory ignoring context cannot explain actual biological function.
  3.  **Heredity without Sequence Replication:** Must provide a principled criterion for determining whether non-DNA heritable factors (methylation, chromatin marks, prions, cortical templates, symbionts) constitute "information" or merely inherited causal influences. Exclusion requires a clear, non-ad-hoc principle. *Rationale:* Modern biology recognizes diverse inheritance systems; a theory only covering DNA is inadequate.
  4.  **Non-Unique Mapping (Reaction Norm):** Must accommodate that a "signal" (genotype, environmental cue) does not uniquely specify a single "outcome" (phenotype, developmental response). Information cannot imply a one-to-one mapping; it must allow for context-dependent interpretation and plasticity. *Rationale:* Fundamental to understanding phenotypic plasticity, evolution, and development; collapsing this distinction renders information useless for explaining variation.

  **Highly Desirable Desiderata (Crucial for Robustness & Scope):**

  5.  **Code Plasticity (Lineage L):** Must handle cases where the decoding rules themselves (e.g., codon assignments) are heritable independently of the DNA sequence they apply to. The theory must address whether the DNA sequence's information changes with the code, whether the code itself constitutes information, and avoid an infinite regress of interpreters/decoders. *Rationale:* Tests the robustness of the informational concept under dynamic coding regimes and probes the basis of interpretation.
  6.  **Environmental Cues as Information:** Must provide a principled account of when/if a reliable, arbitrary environmental cue (e.g., photoperiod triggering flowering) qualifies as "informational" for the organism/lineage. The theory must state what, beyond reliability and arbitrariness, is required (e.g., selection history, specific receiver mechanism). *Rationale:* Tests the generality of informational concepts beyond nucleic acids and probes the role of selection vs. structure.

  **Distinctions the Theory Must NOT Collapse:**

  *   **Arbitrary Coding vs. Physico-Chemical Necessity:** (See Desideratum 1). Collapsing this removes the core rationale for information talk.
  *   **Inherited Information vs. Inherited Material Causation:** Not every inherited molecule or structure is informational (e.g., inherited ATP is fuel, not information). The theory must delineate the difference. *Rationale:* Prevents inflation of "information" to meaninglessness.
  *   **Signal vs. Interpretation/Context:** The information-bearing entity cannot *contain* its interpretation within its structure alone. *Rationale:* Essential for understanding regulation and plasticity (Desiderata 2 & 4).
  *   **Normativity:** Should account for the idea of "misreading" or "error" (e.g., mutation, mis-splicing) as distinct from mere causal difference. *Rationale:* Central to biological explanation (e.g., disease, fidelity mechanisms).

  **Conflict & Exclusion:**

  *   **The Suspected Conflict:** Desideratum 1 (**Arbitrariness**) + Desideratum 5 (**Code Plasticity**). Theories emphasizing the *fixed conventionality* of the genetic code (often tied to arbitrariness) struggle to handle cases where the code itself is plastic and inherited separately (Lineage L). Conversely, theories flexible enough for plasticity risk diluting the strong conventionality that makes arbitrariness significant. Satisfying both robustly is difficult.
  *   **The Great Excluder:** Desideratum 2 (**Context-Sensitivity**) excludes the largest family of views: **Literalist Genetic Code Views** (and naive sequence-centric views). Any theory claiming information/content is *solely* an intrinsic property of the DNA sequence cannot handle splicing, editing, regulation, or alternative reading frames.

  **Scorecard:**

  1.  **Literalist Genetic Code Views:** Fails utterly on Context-Sensitivity (2), Heredity without Sequence (3), Reaction Norm (4), and Code Plasticity (5). Excels only at a superficial reading of the baseline Arbitrariness (1). Excluded by Context-Sensitivity.
  2.  **Deflationary/Causal/Parity Views:** (Information is just reliable covariance/correlation or any complex cause). Handles Context-Sensitivity (2) and Reaction Norm (4) well. Often handles Environmental Cues (6) easily. Struggles mightily with Arbitrariness (1) – lumps it with folding – and Heredity without Sequence (3) – either inflates information wildly or excludes it arbitrarily. Fails Normativity. Code Plasticity (5) is ambiguous. Collapses key distinctions.
  3.  **Teleological/Selection-Based Views:** (Information defined by evolutionary function/history). Best at grounding Arbitrariness (1) – convention established by selection. Handles Heredity without Sequence (3) if the mechanism has a teleofunction. Grounds Normativity (error). Can handle Environmental Cues (6) via selection history. Struggles with Context-Sensitivity (2) – is the context part of the "receiver" function? Often struggles with Reaction Norm (4) – is plasticity the function or a failure? Code Plasticity (5) is challenging (what is the function?).
  4.  **Developmental Systems Views:** (Information distributed across the developmental system). Excels at Context-Sensitivity (2), Reaction Norm (4), Heredity without Sequence (3), and Environmental Cues (6) by incorporating all factors. Handles Code Plasticity (5) naturally. Struggles most acutely with Arbitrariness (1) – risks dissolving the DNA/Polypeptide distinction into mere context-dependency. Risks collapsing Signal vs. Interpretation and inflating information. Normativity is weak (often reduced to system dynamics).

  **Conclusion:** A viable theory must primarily satisfy the Non-Negotiables (1-4) to be more than metaphor. Teleosemantic views come closest for grounding arbitrariness and normativity within biological practice but face challenges with plasticity and context. Developmental Systems views capture the complexity but risk losing the distinctive features that make DNA sequences uniquely *informational* compared to other developmental resources. Deflationary views offer simplicity but sacrifice explanatory power. No current theory satisfies all desiderata perfectly, highlighting the tension inherent in applying "information" to biology.
