answer: |-
  ### Exam Question (231 words)
  **Case:** Society S has two feasible policies for its least-advantaged stratum, which splits equally into subgroups L (low-productivity, no special needs) and H (unchosen chronic health condition requiring 4 income-equivalent units for normal functioning).  
  - **Policy P:** 10 cash units to all. L functions at 10, H functions at 6 (due to unmanaged health cost).  
  - **Policy Q:** 8 cash units + universally provided health care (funded by taxation). L and H both function at 8.  

  Primary goods (income/wealth) under P: 10 for L and H. Under Q: 8 for L and H. The Difference Principle requires maximizing the expectations of the least advantaged.  

  **Question:**  
  Is Q required, forbidden, or indeterminate by Rawls’s justice as fairness? First, explain how the "least advantaged" must be identified: by their index of primary goods, or by what those goods secure given their circumstances? Second, can parties in the Original Position resolve this ambiguity, given that primary goods are meant to be all-purpose means? Third, address why the usual resource-index justification (avoiding responsibility for expensive tastes) fails here, and whether bracketing disability at the constitutional stage resolves the problem. Defend one verdict conclusively.  

  ---

  ### Model Answer (750 words)  
  Justice as fairness forbids Policy Q. The verdict follows from Rawls’s core apparatus: primary goods must index advantage, not welfare outcomes, and the parties cannot incorporate health-based conversion factors without violating the constraints of the Original Position.  

  **1. Identifying the Least Advantaged:** The difference principle evaluates positions by an index of social primary goods—rights, liberties, income, wealth, and the social bases of self-respect. These are *all-purpose means* useful for any rational life plan. Crucially, the index *excludes* individual conversion factors like health needs. Under P, both L and H hold 10 units of primary goods (income). Under Q, both hold 8. The least advantaged by the index are therefore better off under P (10 > 8). To assess advantage via functioning (L at 10, H at 6 under P; both at 8 under Q) would require a welfare metric. But primary goods deliberately avoid such metrics to respect citizens as free and equal persons who adjust their ends to their means. Introducing functioning effectively measures advantage by comprehensive conceptions of the good (e.g., valuing health over other goods), which the veil of ignorance forbids.  

  **2. The Original Position’s Constraints:** Parties lack knowledge of their conception of the good or specific needs. They evaluate principles solely based on primary goods because these alone are neutral among rational life plans. Allowing conversion factors like health needs would:  
  - **Violate the veil:** Assessing how goods convert to welfare requires knowledge of contingencies (e.g., "How severely do I value health?").  
  - **Undermine responsibility:** While H’s need is unchosen, compensating it incentivizes defining all unchosen disadvantages as claims of justice, exploding the index’s limits.  
  - **Abandon all-purpose means:** Health care is not an all-purpose good; its value depends on specific needs. Including it privileges certain conceptions of the good (those prioritizing health) over others (e.g., asceticism).  

  The parties *cannot* choose a needs-sensitive index because doing so presupposes knowledge the veil excludes. They know general facts about human psychology (e.g., that health affects well-being), but this does not justify weighting goods by welfare outcomes. General facts inform *why* primary goods matter, not *how* to measure advantage.  

  **3. Why Usual Objections Fail and Bracketing Matters:** The resource-index avoids compensating expensive tastes because citizens are responsible for their ends. Here, H’s need is unchosen, but this does not license converting the index to welfare. To do so would:  
  - **Contradict primary goods’ purpose:** Their design avoids interpersonal comparisons of welfare. Including unchosen needs reintroduces such comparisons, as we must quantify "how bad" H’s functioning loss is relative to L’s.  
  - **Make indexing arbitrary:** If unchosen health needs alter the metric, why not unchosen talent deficits or climate vulnerabilities? The index collapses into ad hoc welfare assessments.  

  The bracketing of disability at the constitutional stage is not evasion but a necessary feature. Rawls assumes parties represent "normal cooperating members" to derive stable principles for the basic structure. Including hard cases like disability *ab initio* risks principles that are unworkably complex or conflate justice with beneficence. At the legislative stage, society can address H’s needs via public health (a basic right) or transfers justified by the general conception of justice (when inequalities threaten basic liberties). But the difference principle itself, focused on primary goods, must reject Q: it lowers the index (10→8) without a compensating benefit to the least advantaged *as defined by the index*.  

  **Objection & Reply:**  
  *Objection: If Q raises H from 6 to 8 while only lowering L from 10 to 8, isn’t the worst-off individual better under Q?*  
  Reply: Rawls evaluates representative group positions, not individuals. The least advantaged group is defined by primary goods, and under both policies, L and H share the same index (10 under P, 8 under Q). We cannot isolate H as "worst off" without abandoning the group-based index for a welfare ranking.  

  **The Cost:** This verdict sacrifices the intuitive appeal of alleviating unchosen hardship, revealing that justice as fairness prioritizes the metric of reciprocal cooperation over maximal welfare for the most vulnerable.  

  ---

  ### Marking Scheme (20 points)  
  **Must-hit moves (4 points each):**  
  1. **Identify the ambiguity in "least advantaged":** Contrast income-indexed vs. welfare-indexed readings. *Typical error: Conflating the two metrics.*  
  2. **Explain why expensive-taste objections don’t apply:** Grant H’s need is unchosen but show welfare-indexing violates primary goods’ role. *Typical error: Claiming justice requires compensating unchosen needs.*  
  3. **Analyze the Original Position’s constraints:** Argue parties cannot adopt a needs-sensitive index without violating the veil. *Typical error: Asserting parties "would choose" to help H without veil-compatible reasoning.*  
  4. **Assess the bracketing of disability:** Show it is load-bearing and cannot be lifted here without abandoning core design. *Typical error: Dismissing bracketing as irrelevant or unjust.*  
  5. **Consequence awareness:** State what attractive feature Rawls must sacrifice (e.g., aiding unchosen disadvantage). *Typical error: Ignoring the theoretical cost of the verdict.*  

  **A vs. B Distinction:**  
  - **B answers (12–15/20)** correctly diagnose the tension but waver between verdicts, appeal to intuitions about fairness, or fail to fully defend why the apparatus forbids Q.  
  - **A answers (16–20/20)** commit to a verdict (here, forbidding Q) and **explicitly refute the welfare-indexing alternative** by showing it requires knowledge excluded by the veil (Move 3 above).  

  ---  
  **Rationale:** The model answer prioritizes Rawlsian internal consistency. It concedes the moral pull of Q but argues accommodating it breaks the theory’s machinery—hence the cost. Alternatives (e.g., adding needs to primary goods) are rejected as extraneous to the stipulated setup.
