  ---

  ### **Credence Decomposition & Key Terms**
  *(Each term represents a key uncertainty; the credence reflects confidence that the factor supports micro-valence prioritization)*

  1. **Micro-Valence as Suffering (Weight: 25%)**  
     *Credence: 0.6*  
     Justification: If suffering requires thicker properties (temporal integration, unified subjectivity, goal frustration), micro-valence might be akin to "raw negative qualia" without moral weight. But if *any* negative hedonic tone counts (e.g., "micro-anguish"), it matters. Human intuition links negativity to disvalue, but thin micro-experience may lack the "stakes" of complex suffering.  
     *Sensitivity: Moderate. If suffering requires thick subjects, micro-valence is amoral.*

  2. **Aggregation Across Subjects (Weight: 30%)**  
     *Credence: 0.4*  
     Justification: Should we sum valence across disconnected micro-subjects? If yes, the net-negative universe implies astronomical suffering. If not (e.g., only unified subjects matter), human/animal suffering dominates. Aggregation feels intuitive for utilitarians but violates "separateness of subjects" deontic concerns.  
     *Sensitivity: High. Non-aggregation collapses the case.*

  3. **Moral Calculus (Totaling vs. Averaging) (Weight: 20%)**  
     *Credence: 0.7*  
     Justification: Totaling favors micro-valence (small-but-ubiquitous negatives dominate). Averaging favors macro-suffering (intense agony outweighs diffuse micro-negativity). Prioritizing the worst-off ignores micro-valence entirely. Given the scale, totaling seems defensible—but risks "Pascal's Mugging."  
     *Sensitivity: High. Totaling vs. averaging could swing the credence by ±0.4.*

  4. **Intervention Feasibility (Weight: 15%)**  
     *Credence: 0.5*  
     Justification: Conservation allows redistribution: concentrating negativity into fewer subjects (reducing total sufferers but intensifying individual agony) or diluting it (reducing intensity per subject). If feasible, micro-valence engineering could reduce net suffering. But if interventions are unpredictable or risk worsening outcomes (e.g., creating new negative pockets), action may be futile.  
     *Sensitivity: Moderate. Feasibility gaps lower urgency.*

  5. **Hedonic Asymmetry Transfer (Weight: 10%)**  
     *Credence: 0.8*  
     Justification: If micro-subjects share our hedonic asymmetry (negative tones dominate positive), the net-negative universe is catastrophic. If their valence is symmetric, the slight negativity is trivial. Asymmetry likely transfers if valence is fundamental—otherwise, why would it exist?  
     *Sensitivity: Low. Asymmetry is probable in this model.*

  6. **Scale of Impact (Weight: 10%)**  
     *Credence: 0.9*  
     Justification: Micro-valence dominates the universe’s hedonic landscape by orders of magnitude. Ignoring it because it’s "small per unit" is like ignoring a sandbar because each grain is tiny—until it sinks a ship.  
     *Sensitivity: Low. The scale gap is objective.*

  7. **Epistemic Access (Weight: 10%)**  
     *Credence: 0.3*  
     Justification: We lack tools to measure or manipulate micro-valence directly. If valence density is only inferable from a single physical proxy, practical intervention might remain speculative forever.  
     *Sensitivity: Moderate. No access → no action.*

