    - Conceptual: Proving that conservation laws make redistribution impossible without catastrophic side effects (e.g., altering valence density triggers vacuum decay).  
    *Max shift: -0.35 (to 0.13)*

  - **Bottom Line**: Without new evidence, this **does bottom out in intuition**—specifically, whether we owe moral consideration to a universe of dust-mote suffering. My 0.48 reflects the tug-of-war between scale (your lever) and subjecthood (your flatmate’s lever). If pushed, I’d side with *intervention skepticism*: until we know how to safely redistribute valence, human suffering remains the pragmatic priority. But I’d budget 10% for micro-valence R&D—just in case.
