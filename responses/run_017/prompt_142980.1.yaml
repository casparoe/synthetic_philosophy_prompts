  The user's core insight seems correct - fair play isn't about pure logic but about reasonable inferences. In mystery fiction, clues must be presented such that a competent reader could follow the detective's reasoning path, not that every possible conclusion must be obvious. This explains why impossible-crime stories work: the surprise element is part of the genre's appeal, and readers accept that some mechanisms require specialized knowledge, as long as the clues were there to support the solution.

  For the points: First, I'll address that fair play requires accessibility over entailment. Second, I'll note that it assumes readers can recognize plausible inferences. Third, I'll explain why inferential inequality is acceptable - detectives can have expertise. Fourth, I'll tackle the impossible-crime exception by distinguishing between evidence and methods. Fifth, I'll discuss what would happen if we took logical entailment seriously - that it would destroy the genre.

  I should ensure each point directly responds to the user's observations. The critique group likely gets stuck because they're applying formal logic too rigidly, ignoring genre conventions. The user's "salient chain" idea captures how mysteries actually function. My points will validate their theory while providing a clear framework they can use in their group discussions.
answer: |-
  1.  Fair play presupposes *accessibility*, not entailment: clues must be visible and interpretable using plausible, genre-appropriate reasoning steps a competent reader *could* consider, not merely logically implied by the text.
  2.  It strictly requires the *solution path* (key evidence + inferences) be present in the text; it merely fits well with readers *not* taking that path due to misdirection or competing hypotheses.
  3.  Inferential inequality is licensed because the norm assumes readers can *recognize* the validity of the detective's specialized inferences (like steaming an envelope) *after* they are explained, even if they wouldn't generate them unaided.
  4.  Impossible crimes are consistent because the norm requires *evidence* of the trick (e.g., odd details) be present; it does *not* require the reader to independently generate the unique *method* from that evidence before the reveal.
  5.  If formal entailment ("knowing everything that follows") were required, the norm would demand the solution be the *only* possible conclusion from the clues, destroying the genre's core tension of competing possibilities and surprise.
