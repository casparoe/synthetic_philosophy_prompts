prompt: |-
  I've got a departmental colloquium next thursday in front of an analytic metaphysics group — most of them work on persistence, composition and vagueness, and the two who've actually read the personal identity literature are conventionalists about it (roughly: just pick the relation that does the work and stop arguing about "identity"). No ethicists, and nobody who cares about prudential rationality for its own sake.

  Thesis: Parfit's fission argument shows at most that identity isn't necessary for what matters in survival, not that identity is irrelevant. What matters is psychological continuity/connectedness (call it R) holding non-branchingly — I get what matters from a future person only if that person is R-related to me without a comparably strong rival claimant. Sketch: (1) in asymmetric branch cases, where the scan leaves the original alive but damaged and the replica intact (or the other way round), the no-rival clause picks the stronger branch, which I claim is what people actually judge, and it does that without Parfit's talk of R coming in degrees; (2) in symmetric fission I concede there's no survival and try to locate the badness of fission in the loss of non-branchingness itself rather than in the loss of identity; (3) against degree-of-R views I use the case where a duplicate flickers into existence for one second on the far side of the galaxy, which I argue forces them to credit scattered partial survival everywhere.

  Write me the prep sheet: the objections this audience will actually raise, in their vocabulary, ordered by how much damage they'd do rather than by how often they come up in the literature — what I should concede in the first two minutes, which single reply has to land for the view to survive, where each of my replies is soft, and the question I'm definately hoping nobody asks.
reasoning: |-
  Okay, the user is preparing for a colloquium talk targeting analytic metaphysicians specializing in persistence, composition, and vagueness. Their thesis challenges Parfit's fission argument, arguing that identity isn't irrelevant but not necessary for survival—what matters is non-branching psychological continuity (R). 

  First, I need to understand the audience's perspective. These metaphysicians prioritize technical precision in identity criteria and have little patience for ethics or prudence. The conventionalists in the room will likely dismiss the debate as verbal, while others may see survival criteria through the lens of composition or vagueness. 

  The user's core claims are: (1) asymmetric branching cases favor the stronger branch via no-rival clause (avoiding degrees of R), (2) symmetric fission's badness stems from branching loss not identity loss, and (3) degree-of-R views collapse under ephemeral duplicates. 

  Now, anticipating objections: The audience will attack from three angles—technical compositionality (how does "no rival" handle borderline cases?), conventionalist dismissal (why isn't this just picking a relation?), and structural parallels to their own work (e.g., vagueness in persistence). 

  The most dangerous objection is the vagueness challenge: if "comparably strong rival" is vague, survival becomes indeterminate, collapsing into a sorites problem. This must be neutralized early by conceding that branching is vague but insisting the core mechanism remains robust. 

  Key survival moves: The ephemeral duplicate counterexample must land to sink degree-of-R views—it's vivid and exposes absurdity. For conventionalists, reframing R as the metaphysical ground for "what matters" could sidestep their verbal dismissal. 

  The nightmare question? That "non-branchingness" smuggles in identity through the back door via causal exclusivity. If raised, the user must distinguish structural uniqueness from numerical identity. 

  Soft spots include the ethical disinterest—the user's "what matters" framing may confuse an audience allergic to normativity. Should advise explicitly decoupling it from prudence during Q&A. 

  Final prep: Drill the duplicate case until it's razor-sharp, preempt the vagueness concession upfront, and have causal exclusivity distinctions ready. If conventionalists interrupt early, redirect to "this isn't about words, it's about the relation tracking survival value."
answer: |-
  Here’s your prep sheet, tailored to this audience’s priorities and vulnerabilities. Focus on *their* conceptual toolkit (persistence, composition, vagueness, conventionalism) and avoid ethical/prudential hooks.

  **Core Thesis:**  
  *Non-branching psychological continuity (R) is necessary and sufficient for "what matters" in survival. Identity is sufficient but not necessary, and its alleged necessity collapses in fission cases.*

  ---

  ### Tier 1: OBJECTIONS (Ordered by Damage Potential)
  *(Focus on neutralizing these first)*

  1.  **"Non-Branchingness is Just Causal/Structural Uniqueness (Persistence/Vagueness Lens)"**  
      *Damage:* High. If "no comparably strong rival" reduces to standard persistence conditions (e.g., causal uniqueness over time), your view collapses into identity.  
      *Their Vocabulary:* "You’ve smuggled identity in through the back door! 'Non-branching' just *is* the uniqueness condition required for transtemporal identity in a 4D or endurance-with-modal-fragility framework. This is just identity under a different name."  
      *Your Reply:* **Concede structural similarity BUT insist on functional difference.** "Agreed, non-branching R shares *structural features* with identity conditions (uniqueness). But its *normative role* differs: Identity entails survival necessarily; non-branching R does not (as fission shows). It’s a distinct relation *tracking* survival value, not constituting identity." **SOFT SPOT:** Distinguishing "structural uniqueness" from "numerical identity" under pressure.

  2.  **"Your 'No Rival' Clause is Vague & Sorites-Vulnerable (Vagueness Lens)"**  
      *Damage:* High. Undermines your key criterion.  
      *Their Vocabulary:* "How 'comparably strong' must a rival be? Is it vague? What about borderline cases (e.g., 49%/51% connectedness splits)? This invites a Sorites paradox for survival – at what *exact* threshold do I cease to matter? If survival is vague, your view is either incoherent or just conventionalism."  
      *Your Reply:* **Concede vagueness exists BUT deny it sinks the view.** "Yes, 'comparably strong rival' likely has vagueness, *just like 'person', 'alive', or persistence conditions do*. But vagueness in the *criterion* doesn’t negate the core metaphysical distinction: Symmetric fission (clear rival) clearly lacks survival, asymmetric fission (clear dominant branch) has it. Vagueness at borders is a problem for *all* theories of persistence." **SOFT SPOT:** Defending why vagueness here is acceptable when it’s a core objection to their own work.

  3.  **"This is Just Conventionalism with Extra Steps (Conventionalist Lens)"**  
      *Damage:* High. Dismisses your project as trivial.  
      *Their Vocabulary:* "You’re just *stipulating* that non-branching R is 'what matters'. Why not stipulate identity, or causal continuity, or something else? You haven’t shown non-branching R is *metaphysically privileged*; you’re just picking a relation useful for certain practical concerns (which we don’t care about)."  
      *Your Reply:* **Reframe as revealing structure, not stipulating.** "I’m *not* saying 'pick R'. I’m arguing fission cases reveal that what *we pre-theoretically value* in survival *is tracked by* non-branching R, *not* identity. This is a discovery about the structure of our survival interests, not a convention. Identity fails to capture the normative asymmetry in asymmetric fission." **SOFT SPOT:** Audience indifference to "what we value".

  4.  **"Ephemeral Duplicate Doesn’t Refute Degree-of-R Views (Composition/Vagueness)"**  
      *Damage:* Medium-High. Weakens your key anti-degree argument.  
      *Their Vocabulary:* "The duplicate is *too* ephemeral/scattered. Why think R holds *at all* across such a gap? Or, if it does, it's vanishingly weak. Degree theorists can say minimal R = minimal survival value (approaching zero). Your case is a boundary case, not a counterexample."  
      *Your Reply:* **Double down on metaphysics, not value.** "The duplicate *is* R-related (by hypothesis: perfect continuity). If R *just is* what matters, *any* instance should matter *to some degree*. My point isn't about *felt* value, but metaphysical implication: If R matters, then *any* R-connection entails *some* survival, however trivial. This leads to absurd metaphysical proliferation ('partial survival' everywhere). Non-branching R avoids this." **CRITICAL REPLY TO LAND:** **This reply MUST stick.** Emphasize the *metaphysical consequence* (ubiquitous partial survival) not just counterintuitiveness.

  ---

  ### Tier 2: OBJECTIONS (Significant, But Manageable)
  5.  **"Why Privilege 'Branching'? It's Just Composition!"**  
      *Their Vocabulary:* "Fission is just an event where one object (person-stage) composes two future objects. 'Branching' is a metaphor. What matters is the composition relation between stages."  
      *Reply:* **Agree and reframe.** "Agreed! 'Branching' describes a specific compositional structure: one past stage composing *multiple* equally eligible future continuants. My claim is that *this compositional structure* (one-to-many) is what defeats survival, not the absence of identity *per se*. Identity requires one-to-one composition; survival requires one-to-one *or* one-to-none composition." **SOFT SPOT:** Justifying why one-to-one composition is special for survival value.

  6.  **"Asymmetric Fission Judgments are Variable/Conventional"**  
      *Their Vocabulary:* "Your claim about 'what people judge' in asymmetry is empirical/conventional. Some might favor the original, some the replica. Your 'no rival' clause is just your preference."  
      *Reply:* **Pivot to conceptual necessity.** "While judgments *might* vary, the *conceptual structure* of the case demands asymmetry: Only one branch has *undisputed* claim to *being me* (or carrying my survival value). The 'no rival' clause captures this structural feature objectively, even if folk intuitions waver." **SOFT SPOT:** Defending the objectivity of the "undisputed claim".

  ---

  ### FIRST 2 MINUTES: CONCESSIONS (Build Credibility)
  *   "I grant that identity *is sufficient* for survival (when I persist normally, I get what matters)."
  *   "I grant that 'non-branching' shares key structural features (uniqueness) with identity conditions."
  *   "I grant that 'comparably strong rival' likely involves vagueness at the boundaries, as many persistence concepts do."
  *   **Crucially:** "I am *not* arguing that identity doesn't exist or is unimportant metaphysically. I argue it's not *necessary* for what matters in survival."

  ---

  ### SINGLE REPLY THAT MUST LAND
  **The Ephemeral Duplicate Objection against Degree-of-R Views:**  
  If you fail to convince them that the duplicate case forces degree theorists into absurd, ubiquitous partial survival (making "survival" metaphysically promiscuous and disconnected from any meaningful endurance), your core argument against rivals fails. **Hammer this:** "If R *alone* matters, then *every* R-relation, however fleeting or distant, constitutes *some* degree of my survival. This severs survival from any coherent notion of endurance or persistence over time. Non-branching R restores the link to a *single, continuous* future existence."

  ---

  ### THE NIGHTMARE QUESTION (Pray it doesn’t come up)
  **"Doesn't 'non-branching R' *just reduce to* the causal exclusivity condition required for diachronic identity in standard perdurantist/endurantist accounts? If so, haven't you just re-described identity without using the word, making your 'rejection of its necessity' purely verbal?"**

  *Why it's deadly:* Directly challenges your core distinction. Forces you into deep metaphysical waters about the relationship between causal structure, composition, and identity.  
  *Why they might ask:* It directly connects to their core work on persistence.  
  *Glimmer of Hope:* Your Tier 1 Reply 1 is the start. Double down: "No. Identity requires *numerical identity*. Non-branching R is a *relation holding between distinct persons* (me-now and replica-tomorrow) that delivers what matters *without* implying numerical identity. Identity entails non-branching R, but non-branching R (achieved via fission) does *not* entail identity. The relations are co-extensive in normal cases but diverge metaphysically in fission." **Be ready to sweat on this distinction.**

  **GOOD LUCK! Focus on metaphysics, structure, and composition. Downplay "mattering" as a structural feature revealed by cases, not a normative claim. Your strongest weapons are the asymmetric fission intuition pump and the ephemeral duplicate reductio.**
