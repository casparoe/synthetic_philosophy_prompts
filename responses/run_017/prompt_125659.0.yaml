prompt: |-
  So I somehow ended up on the planning commision for the small city I grew up in, and it's turned into the most morally annoying thing in my life. We hear maybe thirty variance and rezoning proposals a month, forty-five minutes each, one-page staff report, and public comment that is mostly people being furious about parking. Votes get appealed, so whatever I do has to be defensible in writing afterwards. I want a decision procedure I can actually run, in about half an hour, from a one-page report plus whatever gets said in the room, and that my fellow commissioners — a retired contractor, a high school principal, two realtors — can follow without any theory background.

  What I want from you is the procedure, grounded in whatever political philosophy actually has to say about who has a right to the city. No reading list, no names, I just want the distinctions. The one I keep coming back to is that "we have a right to this neighborhood" seems to be three different claims shuffled together: a right of access (to be allowed to move here at all), a right of authorship (to have a say in what the place becomes), and a right of continuity (to not have the ground shift under you because of other people's choices, and to not be handed the bill for the region's growth). Almost every objection I hear is one of those wearing the costume of another. I'd like the procedure to start by sorting which one is actually being claimed, and I'd like it to say whether length of residence strengthens the claim genuinely or is just a proxy for something more defensible — I honestly don't know and I've gone back and forth.

  Three things it has to handle. First: the people most affected usually aren't in the room — the family that would live in the building, the person who'd use the shelter, and, weirder, the fact that what we decide partly determines which people end up existing here at all, so "who is harmed" can't just be read off the folks at the microphone. Give me a rule for who speaks for them, and be honest that it's a rule you chose rather than one you derived. Second: sequencing — refusing a building is reversible next year and approving a demolition isn't, and I want to know whether that asymmetry is a real moral reason for a default or just status quo bias in a nice coat. Say which, and build it in or leave it out accordingly. Third: the cases where the objection is real but the thing being asked for is a veto rather than a fix — how do I tell those apart, and where does the procedure hand the decision back to a human because it's a values call and not a factual one? Also fix the scope if the procedure needs it fixed: I never know whether the relevant "city" is my city or the whole metro area, and I suspect the answer changes the outcome.

  Then run it on three: (1) a six-unit building on a corner lot currently zoned for one house, (2) a sixty-unit supportive-housing project on a commercial strip two blocks off a single-family street, and (3) something I'm personally inclined to approve — a small apartment building a friend wants to put on the lot behind his house — where I'd rather find out I'm being inconsistent than get my way. And tell me plainly what the procedure can't do: which inputs it can't manufacture, when it will misfire, and what it says nothing about at all.
reasoning: |-
  Okay, the user is on a city planning commission dealing with zoning variances and rezonings. They're frustrated with the moral complexity and public anger, especially over parking. They need a practical, half-hour decision procedure that non-experts can follow. The key is to distinguish between three rights: access, authorship, and continuity. 

  First, I need to clarify their core needs. They want a structured method to parse public objections into those three categories. They're also concerned about representing absent stakeholders, handling irreversible decisions, and identifying when objections are vetoes versus fixable issues. Plus, the scope of "city" versus metro area is ambiguous. 

  The user mentioned sequencing asymmetry—approving demolition is irreversible while refusing a building isn't. Is that a moral reason or just status quo bias? I think it's both: irreversible harm increases moral weight. So the procedure should default to caution in irreversible cases. 

  For absent stakeholders, who speaks for them? Staff reports might be biased. The rule I'll choose is that staff represents future residents unless there's evidence of bad faith. It's a practical choice, not derived from theory. 

  Length of residence: does it strengthen claims? For authorship, yes, because long-term residents have deeper context. For continuity, it might indicate reliance on the existing environment. But for access, it's irrelevant or even negative (preventing new residents). So the procedure should weigh residency only for authorship/continuity, not access. 

  Scope of "city": it should be the metro area for access (broader housing needs) but the local neighborhood for continuity. Staff should define the relevant scope in each report to avoid ambiguity. 

  Now, the three cases: 

  1. Six-unit building on a corner lot. Objections likely continuity (parking, character) but staff report shows minimal impact. Access needs outweigh, so approve. 

  2. Supportive housing. Objections might mask continuity concerns as safety (authorship). But access for vulnerable groups is critical. If design addresses continuity issues, approve. 

  3. Friend's apartment building. Need to check for bias. If it meets same criteria as case 1, approve, but ensure recusal to avoid inconsistency. 

  What can't the procedure do? It can't resolve deep value conflicts—human judgment needed there. It relies on staff reports for facts, so if those are flawed, the output is too. And it can't handle externalities beyond the three rights, like environmental impacts. 

  The user's deeper need is reducing moral anxiety by having a clear, defensible process. They want consistency and to avoid bias, especially in personal cases like their friend's project. The procedure should make tradeoffs explicit, so decisions feel principled even when unpopular.
answer: |-
  Here's a decision procedure designed for your constraints. It's grounded in **pragmatic liberalism** (balancing individual autonomy, collective welfare, and fairness) and **urban commons theory** (the city as a shared resource requiring negotiated use).

  ---

  ### **The Decision Procedure: "The Three Rights Filter"**
  **(Runtime: 25-35 minutes per proposal)**

  #### **Step 1: Classify the Objection (5 min)**
  Listen to public comment/staff report. Ask: **Which right is primarily claimed?**  
  - **Access:** "People like me/us deserve to live/do business here."  
  - **Authorship:** "We deserve a say in how this place changes."  
  - **Continuity:** "This change unfairly disrupts my/our reliance on the existing environment."  
  *Key rule: Length of residence strengthens **Authorship** (deeper contextual knowledge) and **Continuity** (greater reliance on status quo). It does NOT strengthen **Access** claims (newcomers have equal rights to seek entry).*  

  #### **Step 2: Identify Affected Parties (5 min)**  
  - **Absent stakeholders:** Assume staff reports represent future residents/users *unless evidence of bad faith*. **Your rule:** *Staff is the proxy for the absent, but commissioners may override if public comment provides credible, specific counter-evidence (e.g., project explicitly excludes a protected group).*  
  - **Who "exists" for harm assessment:** Consider **immediate neighbors** (continuity), **current residents seeking access** (e.g., renters), and **future residents** (metropolitan housing needs). The "relevant city" for access is the **metro area**; for continuity, it's the **immediate neighborhood**.  

  #### **Step 3: Assess Irreversibility & Default Position (5 min)**  
  - **Demolition/rezoning** is irreversible → **presumption toward caution** (uphold continuity unless access needs are severe).  
  - **Refusal to build** is reversible → **presumption toward access** (approve unless continuity harm is immediate/substantial).  
  *This asymmetry is a **moral reason**: Irreversible harm demands higher certainty. Not just status quo bias.*  

  #### **Step 4: Veto vs. Fix Test (5 min)**  
  - If objection is **continuity-based** (e.g., "parking/traffic will be awful"), ask: *"Could this be mitigated without killing the project?"* (e.g., requiring 1:1 parking, traffic calming).  
  - If yes → **Not a veto**. Direct staff to negotiate conditions.  
  - If objection is **authorship-based** (e.g., "we didn’t ask for this") → **Not grounds for veto** (city planning isn't direct democracy). Acknowledge but proceed.  
  - **Vetoes are only justified if:** Continuity harm is *severe, unmitigatable, and narrowly targeted* (e.g., building shades a community garden with no redesign possible).  

  #### **Step 5: The Balancing Test (5 min)**  
  **Approve unless:**  
  > *(Continuity harm to existing neighbors) > (Access benefit to future residents + Existing community benefit)*  
  ...with irreversibility weighting continuity harm **2x**.  
  *Human judgment call:* Quantify loosely (e.g., "moderate" = 1, "severe" = 2). Staff report must provide evidence on both sides.  

  #### **Step 6: Record Rationale (5 min)**  
  Document:  
  1. Primary right claimed & why.  
  2. Irreversibility weighting applied (if any).  
  3. Mitigation conditions (if applicable).  
  4. Balancing test outcome.  

  ---

  ### **Applied to Your Cases**  
  #### **Case 1: Six-Unit Building on Single-Family Lot**  
  - **Objection:** "Parking chaos! Changes neighborhood character!" → **Continuity** (disruption).  
  - **Absent parties:** Future residents (staff proxy).  
  - **Irreversibility:** Rezoning is irreversible → **weight continuity 2x**.  
  - **Veto test:** Parking/traffic mitigable (e.g., permit system, bike storage) → **Not a veto**.  
  - **Balancing:** Moderate continuity harm (weighted 2x) vs. High access benefit (6 households). **→ APPROVE with conditions** (parking plan).  

  #### **Case 2: Sixty-Unit Supportive Housing**  
  - **Objection:** "Safety risk! Devalues property!" → **Continuity** (disruption, but often masks access exclusion).  
  - **Absent parties:** Future residents + homeless population (staff proxy).  
  - **Irreversibility:** New construction → Reversible default → **Presume access**.  
  - **Veto test:** Safety concerns mitigable (design features, onsite staff) → **Not a veto**.  
  - **Balancing:** Speculative continuity harm (unproven safety issues) vs. Critical access benefit (60 vulnerable people + regional crisis). **→ APPROVE with conditions** (security plan).  

  #### **Case 3: Friend's Apartment Building**  
  - **Objection:** "Backyard building is tacky!" → **Continuity** (aesthetic disruption).  
  - **Absent parties:** Future renters (staff proxy).  
  - **Irreversibility:** New construction → **Presume access**.  
  - **Veto test:** Aesthetics subjective → Not severe/unmitigatable harm. **Not a veto**.  
  - **Balancing:** Minor continuity harm (views, privacy? Mitigate with screening) vs. Modest access benefit (e.g., 4 units). **→ APPROVE** if consistent with Case 1. *But RECUSE YOURSELF from vote.*  

  ---

  ### **What the Procedure CANNOT Do**  
  1. **Manufacture missing data.** Relies on staff reports for harm/benefit quantification. If staff says "traffic impact unknown," the procedure stalls.  
  2. **Resolve deep value conflicts.** If commissioners fundamentally disagree on "how much continuity harm is too much," it requires a vote, not calculus.  
  3. **Handle strategic deception.** If public comment lies about impacts (e.g., fake traffic studies), the filter fails.  
  4. **Address pure self-interest.** "My property value might dip 5%" is not a continuity *harm* under this model (it’s market risk).  
  5. **Solve regional inequity.** Assumes metro-area access needs are legitimate. If your city dodges its housing burden, the procedure won’t flag it.  

  **When it misfires:**  
  - In low-trust environments (staff seen as biased).  
  - When "severity" is genuinely contested (e.g., historic preservation vs. affordable housing).  
  - If the metro area itself is dysfunctional (e.g., no regional housing plan).  

  **Output it ignores:**  
  - Political pressure.  
  - Personal relationships (beyond recusal).  
  - Fiscal impacts beyond immediate mitigation costs.  

  ---

  This gives you a defensible, consistent framework that forces explicit tradeoffs. It treats the city as a **shared project** where existing residents have **rights to stability**, but not to **freeze change** or **exclude newcomers**. The irreversibility weighting and veto test handle your sequencing concerns, while the rights taxonomy cuts through rhetorical noise.
