prompt: |-
  I am a novelist, and the book I am drafting turns repeatedly on a family of devices in which a character truthfully announces, in advance, that something will happen at a moment its hearers will not see coming. A headmistress warns her staff of exactly one inspection during a five-day week, adding that on the evening before it they will not know which morning it is. A blackmailer names a thirty-day window in which a letter will be posted, and undertakes that on the morning of the day it goes out the mark still will not be able to work out whether today is the day. An autonomous system, on a run with no scheduled end, tells its operator that it will refuse one of his commands at a moment he cannot predict. These are all variants of the surprise-exam announcement, and readers who know the paradox keep writing to ask whether such scenes can be coherent at all — whether the announcement can be true, believed, believed to be true, and still surprising when it lands, or whether my characters are simply failing to draw a conclusion that is sitting there to be drawn. I cannot tell which of my devices is which.

  What I want is a procedure, not an essay: something I can run on each new device in ten minutes, with the questions in order, what would count as a sufficient answer to each, the point at which it returns a verdict of no, this cannot work, and the point at which it hands the decision back to me because the open question is one about what I want the scene to mean rather than about whether it is consistent. Please say which distinctions have to survive the simplification, and correct me where I have the wrong ones. My own guesses are that it matters whether the window of days is fixed and known in advance, whether surprising means not deducible from the announcement or merely not expected, whether the speaker guarantees that the thing happens at all rather than saying that it may, and whether the hearers are entitled to trust the speaker — and also, I suspect crucially, whether the speaker knows the date herself or is only passing on what she was told, since an announcement that reports someone else's decision seems to behave quite differently under the backward induction. Tell me if any of that is beside the point, and whether some distinction I have not thought of is doing more work than these.

  Then run the procedure on the three devices above, and on a fourth: the headmistress genuinely does not know which morning the inspectors are coming, having been told only that it will be one of the five. I would rather be told plainly that the open-ended device works only because I want the scene, if that is the case. Include at least one verdict that costs me a device I am attached to, and finish by saying what the procedure cannot tell me — in particular whether a device that survives it is dramatically any good, or whether a reader who has heard of the paradox will feel cheated by a scene the procedure passes.
reasoning: |-
  Hmm, the user is a novelist struggling with the surprise exam paradox in their plot devices. They've created multiple scenarios where characters make advance announcements about unpredictable events, but readers keep questioning whether such setups can logically work. They want a practical procedure to evaluate each device, not just philosophical discussion.

  I need to design a clear decision tree that addresses the key logical constraints while respecting their creative needs. The core tension here is between dramatic impact and logical consistency - they want surprise to feel earned, not cheating.

  Looking at their proposed distinctions: fixed window, definition of surprise, guarantee of occurrence, and speaker knowledge are all indeed crucial. But they're missing one critical element: whether the announcement creates self-reference that invalidates the surprise. That's the heart of the paradox - the announcement might eliminate the very uncertainty it describes.

  The procedure should have binary checkpoints:
  First, establish if the event is guaranteed to happen - if not, it escapes the paradox but loses dramatic weight. 
  Second, verify if the surprise depends on deductive reasoning - if it's about psychology rather than logic, that's safer but different. 
  Third, check speaker knowledge - if they're ignorant, it avoids the self-defeating prophecy issue. 
  Finally, test for the existence of at least one "safe" day where surprise remains possible even after deduction - that's the escape hatch.

  Applying this to their examples:
  The headmistress version fails because with a fixed window and knowledgeable speaker, the deduction unravels backward. 
  The blackmailer works only if we interpret "surprise" psychologically. 
  The autonomous system survives because the open-ended window prevents backward induction. 
  The ignorant headmistress works by shifting knowledge outside the system.

  Important caveat: passing the procedure doesn't guarantee dramatic satisfaction. Paradox-aware readers might still feel cheated if the resolution relies on technicalities like speaker ignorance. The writer needs to decide if that serves their thematic purpose - sometimes logical fragility can itself be a narrative device.

  The key is transparency: if the character acknowledges the paradox within the story, or if the surprise comes from emotional rather than logical sources, it can still work. The procedure identifies logical viability, not artistic merit.
answer: |-
  Here is a procedural checklist to evaluate your "surprise announcement" devices. It focuses on logical consistency under the surprise exam paradox framework, prioritizing whether the announcement *can* be true, believed, believed to be true, and *still* surprising when it lands. Dramatic effectiveness is a separate question addressed at the end.

  **Core Distinctions That Matter (Must Survive Simplification):**
  1.  **Fixed & Known Finite Window:** Is the set of possible days (or moments) finite, known in advance to the hearer, and fixed by the announcement?
  2.  **Definition of "Surprise":** Does "surprise" mean **the hearer cannot deduce the exact date/time *before* it happens using the announcement and logic**? (Key for paradox) OR does it mean something else (e.g., subjectively unexpected, surprising in its nature, etc.)?
  3.  **Guarantee of Occurrence:** Does the announcement **guarantee** the event *will* happen within the window? (Crucial for paradox) OR does it merely state it *might* happen?
  4.  **Speaker Knowledge:** Does the speaker **know the specific date/time** when the event will happen at the moment of the announcement? OR is the speaker **ignorant/uncertain** (e.g., relaying a decision made by another agent, or the event is genuinely random/undecided)?
  5.  **Hearer Trust:** Are the hearers entitled to believe the speaker is **truthful and competent** regarding the facts stated in the announcement? (Assume "Yes" for the paradox scenario; if "No", the paradox doesn't bite because the announcement isn't credible).

  **Distinctions Less Critical or Handled Implicitly:**
  *   "Believed to be true": Handled by **Hearer Trust = Yes**.
  *   "Believed": Implied if **Hearer Trust = Yes** and the announcement is coherent.
  *   "Truthfully announces": Implied by **Hearer Trust = Yes** and the speaker making the statement.

  **The 10-Minute Device Evaluation Procedure:**

  1.  **Define the Window:**
      *   *Question:* Is the set of possible days/moments for the event **finite, known in advance to the hearer, and fixed by the announcement**? (e.g., Days 1-5, Days 1-30).
      *   *Sufficient Answer:* "Yes, window is finite & known/fixed." OR "No, window is infinite/open-ended/not fully specified."
      *   *Verdict Path:* If **No**, proceed to Step 4. If **Yes**, proceed to Step 2.

  2.  **Define "Surprise":**
      *   *Question:* Does "surprise" or "won't know" or "cannot predict" **specifically mean the hearer cannot logically deduce the exact date/time *before* it happens using *only* the announcement and the rules it establishes?**
      *   *Sufficient Answer:* "Yes, surprise = not deducible beforehand." OR "No, surprise means something else (e.g., subjectively unexpected, shocking nature)."
      *   *Verdict Path:* If **No**, proceed to Step 4. If **Yes**, proceed to Step 3.

  3.  **Check Guarantee & Speaker Knowledge (The Paradox Core):**
      *   *Question A:* Does the announcement **guarantee** the event *will* happen exactly once within the fixed, finite window?
      *   *Sufficient Answer:* "Yes, guaranteed to happen." OR "No, only might happen."
      *   *Verdict Path A:* If **No**, proceed to Step 4 (paradox avoided). If **Yes**, proceed to Question B.
      *   *Question B:* Does the speaker **know the specific date/time** of the event when making the announcement?
      *   *Sufficient Answer:* "Yes, speaker knows." OR "No, speaker is ignorant/uncertain."
      *   *Verdict Path B:* If **Yes (Speaker Knows)**, **VERDICT: NO, IT CANNOT WORK (LOGICALLY INCONSISTENT UNDER BACKWARD INDUCTION)**. If **No (Speaker Ignorant)**, proceed to Step 4.

  4.  **Assessment of Viable Scenarios:**
      *   *Situation:* You reached here because at least one condition for the classic paradox was not met (Non-fixed window, Non-deductive surprise, No guarantee, Speaker Ignorant).
      *   *Question:* Considering the specific deviations identified in Steps 1-3, is it **logically possible** for the event to occur at a time the hearer genuinely could not deduce beforehand *and* for the announcement to be true?
      *   *Analysis & Verdict:*
          *   **Speaker Ignorant (from Step 3B):** **VERDICT: YES, IT CAN WORK.** The backward induction fails because the speaker lacks the knowledge to make the self-defeating prediction. The event can occur on *any* day, including the last, and the announcement remains true because the speaker genuinely didn't know and the hearer couldn't be certain until the event happened or the window closed. *This is the most common escape hatch.*
          *   **Non-Deductive Surprise (from Step 2):** **VERDICT: YES, IT CAN WORK (BUT DIFFERENT MEANING).** Focus shifts to psychology, randomness, or factors outside the pure logic of the announcement. The hearer *might* deduce the day but still be subjectively surprised, or surprise stems from the event's nature/timing relative to other events. *Hand back to author:* Does this match your intended dramatic meaning for "surprise"?
          *   **No Guarantee (from Step 3A):** **VERDICT: YES, IT CAN WORK.** The event simply might not happen, making any prediction about *when* it might happen inherently uncertain and potentially surprising if it does occur. *Hand back to author:* Does the lack of guarantee undermine the dramatic stakes you want?
          *   **Non-Fixed/Open-Ended Window (from Step 1):** **VERDICT: YES, IT CAN WORK.** Backward induction cannot start or complete without a definite endpoint/finite set. The hearer can never eliminate *all* future moments as impossible. *Hand back to author:* Ensure the open-endedness is clear and dramatically serves the purpose.

  **Applying the Procedure to Your Devices:**

  1.  **Headmistress (Original - Knows Date?):**
      *   Step 1: **Yes** (5 known days).
      *   Step 2: **Yes** ("will not know which morning" implies cannot deduce beforehand).
      *   Step 3A: **Yes** (exactly one inspection).
      *   Step 3B: *Assuming she knows the date*: **Yes (Speaker Knows)** -> **VERDICT: NO, IT CANNOT WORK.** Backward induction applies: if not by Friday AM, then Thursday would be deducible on Wed night, etc., collapsing the possibility. *(Costs you a device if she knows)*.
      *   *If she doesn't know:* See below.

  2.  **Blackmailer:**
      *   Step 1: **Yes** (30 known days).
      *   Step 2: **Yes** ("still will not be able to work out" implies cannot deduce beforehand).
      *   Step 3A: **Yes** (letter *will* be posted within window).
      *   Step 3B: *Crucially, does the blackmailer know the specific day?* If **Yes (Knows)**: **VERDICT: NO, IT CANNOT WORK.** Same as Headmistress. If **No (e.g., decides randomly later)**: **VERDICT: YES, IT CAN WORK (Speaker Ignorant).** *Hand back: Does the scene imply the blackmailer knows? If yes, it fails. If no, it works.*

  3.  **Autonomous System (Open-Ended Run):**
      *   Step 1: **No** (No scheduled end, infinite/future moments). -> Proceed to Step 4.
      *   Step 4 (Non-Fixed Window): **VERDICT: YES, IT CAN WORK.** Without a final day, backward induction has no starting point. The operator can never rule out *all* future commands. The refusal can happen at any time, and the announcement remains true because the operator couldn't predict *which* command/moment it would be. *(Works as you want)*.

  4.  **Headmistress (Genuinely Doesn't Know):**
      *   Step 1: **Yes** (5 known days).
      *   Step 2: **Yes** ("will not know which morning").
      *   Step 3A: **Yes** (exactly one inspection).
      *   Step 3B: **No (Speaker Ignorant)** -> Proceed to Step 4.
      *   Step 4 (Speaker Ignorant): **VERDICT: YES, IT CAN WORK.** The headmistress's ignorance breaks the self-referential loop. The inspection *can* happen on Friday (or any day), and her announcement remains true because *she* didn't know, and the staff couldn't be certain until the inspection happened or Friday passed without it. *(Works)*.

  **What the Procedure CANNOT Tell You:**

  1.  **Dramatic Effectiveness:** Passing the procedure means the scenario is *logically coherent*. It **does not** guarantee it's dramatically satisfying, tense, or believable within your story's context. A technically correct device can still feel contrived or flat.
  2.  **Reader Perception (Paradox-Aware):** Readers familiar with the paradox **might still feel cheated** even if the device technically passes (especially using Speaker Ignorant or Non-Deductive Surprise). They may feel you "cheated" the paradox rather than truly embodying its surprising spirit. The procedure cannot predict this subjective reaction.
  3.  **Execution:** The procedure doesn't judge *how well* you write the scene, establish character trust, build tension, or integrate the device naturally into the plot.
  4.  **Alternative Resolutions:** It focuses on the logical consistency of the *announcement itself* leading to surprise. It doesn't explore if surprise arises from other factors (e.g., the *manner* of the event, unrelated events distracting the hearer) overriding the hearer's potential logical deduction.

  **Conclusion:**
  The key distinctions are **Fixed Finite Window**, **Deductive Surprise**, **Guaranteed Occurrence**, and crucially, **Speaker Knowledge**. Speaker ignorance or an open-ended window are the most reliable escapes from logical inconsistency. While the autonomous system and the ignorant headmistress pass, and the blackmailer can pass if ignorant, the original knowing-headmistress device is logically untenable. Remember, logical coherence is necessary but not sufficient; passing the procedure doesn't shield you from a reader feeling the surprise was dramatically unearned or a cop-out to the paradox's challenge. You must still craft the scene to sell the surprise emotionally and narratively.
