  Hmm, the user is restructuring a graduate seminar on units of selection and wants to begin with desiderata rather than positions. They've provided a specific purpose for the account: to guide evolutionary biologists in measuring selection in real systems. I need to evaluate this purpose and create a list of requirements that an adequate theory must meet.

  The user has outlined seven test cases (a through g) that cover kin selection, genomic conflict, infectious agents, symbiotic pairs, major transitions, cultural transmission, and partition ambiguity. They've also provided a menu of common demands from the literature. My task is to distill which of these are genuine requirements for their operational purpose, which are camp preferences, and which beg the question.

  For the purpose section, I agree with the user's framing. The account should be a measurement guide rather than settling metaphysical debates. This focus eliminates demands like "never invoke a higher level when a lower-level account plus population structure will do" which is a reductionist preference, not an operational requirement.

  For the desiderata, I'll prioritize requirements that directly address measurement challenges in the test cases. The top requirement should be causal measurability - how will biologists actually collect data in the field? This is crucial for cases like (d) the symbiotic pair and (f) cultural transmission. 

  The second key requirement is partition uniqueness - the bookkeeping worry in case (g). Without this, we can't resolve disputes about level-specific contributions. Third is level emergence/disappearance criteria - essential for handling major transitions in case (e) and the infectious agent in case (c). 

  Fourth is conflict resolution - needed for within-genome conflicts (case b) and kin/group debates (case a). Fifth is heritability flexibility - important for non-genetic inheritance (case f). Sixth is multi-level simultaneity - recognizing that selection can act at multiple levels at once, as in case (d). 

  I suspect some tensions between these requirements. Causal measurability might conflict with partition uniqueness if unique partitions require unrealistic data. Heritability flexibility might clash with level emergence criteria if we need different heritability definitions across levels.

  The decisive requirement is causal measurability - it excludes theories that rely on unavailable data or counterfactuals biologists can't measure. 

  For the scorecard, I'll evaluate five frameworks against my six requirements. Gene selectionism fails level emergence and multi-level criteria. Traditional multi-level selection often struggles with partition uniqueness. MLS2 handles level emergence better. Replicator-vehicle frameworks have trouble with non-genetic inheritance. Causal partitioning approaches score well but face challenges with uniqueness.

  For the constructed cases: In the symbiotic pair (d), we need to measure partner fitness dependencies and heritability at both levels. For cultural transmission (f), we must assess costs/benefits at individual/group levels and transmission fidelity. The list holds up for both cases, though (f) pushes at heritability definitions.

  The user wants no citations or references, so I'll keep everything self-contained based on their description. This approach should give their students a solid foundation for evaluating unit of selection theories through an operational lens.
answer: |-
  ### 1. The Purpose (100 words)  
  Your purpose—**providing operational guidance for measurement in empirical systems**—is correct and sharply defined. It avoids metaphysical debates about "reality" of units, focusing instead on testable conditions for attributing selection to levels. If revised toward metaphysics (e.g., "define what units *truly* exist"), desiderata like "avoid higher-level accounts when lower suffices" or "demand unique partitions" become central, but these are preferences, not operational needs. For measurement, we prioritize empirical resolvability over ontological parsimony. The list below excludes metaphysical demands and incorporates only criteria enabling field biologists to design studies, resolve disputes, and quantify adaptation.

  ---

  ### 2. Desiderata (700 words)  
  Ordered by importance for measurement, with motivating case and status:  

  1. **Causal Measurability**  
     - *Requirement*: Specify quantifiable variables (e.g., fitness components, heritability, population structure) accessible through field/lab methods.  
     - *Motivation*: Case (d) (symbiotic pair): To decide if pairs are units, we need measurable proxies for partner fitness interdependence (e.g., plant fitness conditional on bacterial strain traits).  
     - *Status*: **Non-negotiable**. Without this, the theory is useless for empirical work.  

  2. **Partition Uniqueness**  
     - *Requirement*: Yield a single, non-arbitrary decomposition of evolutionary change into level-specific components.  
     - *Motivation*: Case (g) (bookkeeping worry). Ambiguous partitions obscure whether group selection occurred (e.g., in case (a)).  
     - *Status*: **Non-negotiable**. Disputes require unambiguous criteria (e.g., "Does group structure add explanatory power?").  

  3. **Level Emergence/Disappearance Criteria**  
     - *Requirement*: Define testable conditions for when a new level arises (e.g., conflict suppression) or ceases to act.  
     - *Motivation*: Case (e) (major transitions) and (c) (clonal lineage). For mitochondria, we need criteria like "near-zero heritable variance in somatic fitness" to confirm level dissolution.  
     - *Status*: **Non-negotiable**. Handles transitions without ad hoc assumptions.  

  4. **Conflict Resolution**  
     - *Requirement*: Diagnose conflicts between levels (e.g., gene vs. organism) using measurable fitness trade-offs.  
     - *Motivation*: Case (b) (within-genome conflict) and (a) (altruism). Distinguishes gene-level selection (e.g., meiotic drive) from organismal adaptation.  
     - *Status*: **Negotiable**. Could be subsumed under partition uniqueness, but explicit conflict markers aid clarity.  

  5. **Heritability Flexibility**  
     - *Requirement*: Accommodate non-genetic inheritance (e.g., cultural transmission) without redefining "unit."  
     - *Motivation*: Case (f) (foraging technique). If benefits are group-heritable but costs are individual, we need to measure both.  
     - *Status*: **Preference**. Some camps exclude non-genetic systems, but measurement should extend to them.  

  6. **Multi-level Simultaneity**  
     - *Requirement*: Permit concurrent selection at multiple levels without forcing a "primary" level.  
     - *Motivation*: Case (d) and (c). Symbionts and infectious agents may experience simultaneous individual- and group-level selection.  
     - *Status*: **Non-negotiable**. Empirical systems (e.g., eusocial insects) demand this.  

  #### Excluded "Demands" as Non-Requirements:  
  - "Reproduce inclusive fitness verdicts": Preference of gene-centric camp (irrelevant if partitions are unique).  
  - "Avoid higher levels when lower suffice": Metaphysical preference, not measurement need.  
  - "Formulable in Price equation": Implementation tool, not requirement.  
  - "Define units via reproduction/heritability": Begs the question (e.g., mitochondria in (e) "reproduce" but aren’t units).  

  ---

  ### 3. Joint Unsatisfiability (350 words)  
  Two tensions arise:  
  - **Partition Uniqueness vs. Causal Measurability**: Unique partitions may require ideal data (e.g., complete fitness distributions across generations), but measurability demands feasible field data (e.g., relatedness, group productivity). *Resolution*: Accept approximations (e.g., regression-based partitions) if statistically robust.  
  - **Heritability Flexibility vs. Level Emergence**: Non-genetic inheritance (f) may blur "levels" (e.g., is a socially learned trait individual- or group-heritable?). Level emergence criteria assume clear reproductive boundaries. *Resolution*: Define levels by *functional integration* (e.g., conflict suppression) rather than reproduction.  
  - **Conflict Resolution vs. Multi-level Simultaneity**: Strong conflict diagnosis (e.g., "gene selfishness") might imply level dissolution, but simultaneity requires levels to coexist. *Resolution*: Conflict exists when lower-level fitness variance persists despite higher-level suppression (e.g., mito-nuclear coadaptation in (e)).  

  No fatal incompatibilities—tensions reflect empirical trade-offs, not logical flaws.

  ---

  ### 4. The Decisive Requirement (150 words)  
  **Partition Uniqueness** excludes the most theories:  
  - Naïve gene selectionism fails (e.g., cannot uniquely partition group effects in (a)).  
  - Traditional multi-level selection (MLS1) often permits arbitrary partitions (e.g., Price equation variants).  
  - "Equivalent models" approaches (e.g., kin/group equivalence in (a)) reject uniqueness, rendering disputes unresolvable.  
  Only frameworks demanding unambiguous criteria for level-specific contributions (e.g., contextual regression with fixed predictors) survive. This requirement forces operational clarity.

  ---

  ### 5. Scorecard (250 words)  
  | **Framework**               | Causal Measurability | Partition Uniqueness | Level Emergence | Conflict Resolution | Heritability Flexibility | Multi-level Simultaneity |  
  |-----------------------------|----------------------|----------------------|-----------------|---------------------|--------------------------|--------------------------|  
  | Gene-level replicator       | Partial              | ✗                    | ✗               | ✓                   | ✗                        | ✗                        |  
  | MLS1 (group-focus)          | ✓                    | ✗ (arbitrary)        | ✗               | Partial             | ✗                        | Partial                  |  
  | MLS2 (emergence-focus)      | ✓                    | ✗                    | ✓               | ✓                   | ✗                        | ✓                        |  
  | Replicator/vehicle          | ✗ (vague units)      | ✗                    | Partial         | ✓                   | ✗                        | Partial                  |  
  | Causal partitioning         | ✓                    | ✓ (if constrained)   | ✓               | ✓                   | ✓                        | ✓                        |  

  **Key**: ✓ = Satisfies, Partial = Limited/contextual, ✗ = Fails.  
  - **Gene-level**: Fails uniqueness (case g), emergence (e), simultaneity (d).  
  - **MLS1**: Fails uniqueness (g), heritability (f).  
  - **MLS2**: Fails uniqueness (g), heritability (f).  
  - **Replicator/vehicle**: Vague on measurement (d,f), no uniqueness (g).  
  - **Causal partitioning**: Best fit but requires constraints (e.g., fixed predictors) for uniqueness.  

  ---

  ### 6. The Constructed Cases (250 words)  
  **Case (d) (Symbiotic Pair)**  
  - **Unit question**: The pair is *not* a unit unless conflict is suppressed (e.g., vertical transmission dominates).  
  - **Measure**:  
    - Fitness interdependence (plant fitness × bacterial trait heritability).  
    - Heritability of partner traits across plant generations.  
    - Partition selection: Change due to bacterial lineage fitness vs. plant-level sorting.  
  - **Desiderata suffice**: Emergence criteria (e.g., "Does conflict suppression align fitness?") resolve disputes.  

  **Case (f) (Non-genetic Inheritance)**  
  - **Covered?**: Yes, under *Heritability Flexibility*.  
  - **Measure**:  
    - Individual cost (reproductive output) vs. group benefit (survival).  
    - Fidelity of oblique transmission.  
    - Partition: Group-level cultural selection vs. individual selection against practice.  
  - **Boundary**: System-specific heritability metrics (e.g., social network stability) replace genetic heritability.  

  **List limits**: Neither case "runs out." (d) tests emergence criteria; (f) tests heritability flexibility. Both demand causal measurability and partitions, which the list provides. The sole strain is defining "heritability" for oblique transmission (f), but operational proxies exist (e.g., transmission rate).
