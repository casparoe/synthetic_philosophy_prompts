  **Step 3: Account for Correlation (10 minutes)**
     - Set up the variance-covariance matrix for the bets:
          - For each bet $i$, compute $\sigma_i^2 = p_i (o_i - 1 - e_i')^2 + (1-p_i)(-1 - e_i')^2$.
          - For each pair $(i,j)$, compute the covariance $Cov_{ij} = \rho_{ij} \sigma_i \sigma_j$.
     - In the optimization sheet, set initial $f_i = f_i^* / (\text{sum of } f_i^*)$ (normalized) to start.
     - Use Solver:
          - Set objective: maximize $G = \mu - \sigma^2/2$, where:
              - $\mu = \sum_i f_i \cdot e_i'$
              - $\sigma^2 = \sum_i \sum_j f_i f_j Cov_{ij}$
          - Constraints: 
              - $\sum_i |f_i| \leq 1$
              - $f_i \geq 0$ for all i (assuming no lay bets)
          - Solve.
     - Let $f_i^{\text{opt}}$ be the solution.

  **Step 4: Apply Fractional Kelly and Termination Scaling (2 minutes)**
     - Apply the fractional Kelly factor: $f_i^{\text{adj1}} = f_i^{\text{opt}} \times f_s$.
     - Compute the termination scaling factor $c$:
          - $c = \min\left(1, \frac{B - 0.6S}{0.4S}\right)$
          - If $c<0$, then $c=0$ (but we are above 0.6S hopefully).
     - Then $f_i^{\text{adj2}} = f_i^{\text{adj1}} \times c$.

  **Step 5: Backer Clause (1 minute)**
     - We decide not to adjust for the backer clause in sizing. (Committee can overrule.)

  **Step 6: Bundle Bets**
     - If a bet is a bundle, treat it as a single bet in the slate. The correlation with other bets? We have to estimate. If it's the only bet, then it's standalone.

  **Step 7: Final Fractions and Committee Sign-off**
     - The final fraction to bet on each bet is $f_i^{\text{adj2}} \times B$.
     - The total amount to bet is $\sum_i f_i^{\text{adj2}} \times B$.
     - If this total is greater than $B$, we have an error (should be capped by the constraint).
     - Committee reviews: if they want to bet more, they can increase $f_s$ or override the termination scaling. But they must minutes the reason.

  ### One-off Events
     For a one-off event (like the special election), we follow the same procedure. It is one bet in the slate. We must estimate the edge. If the model has no data, we rely on the politics member's confidence. We set $p_i$ to their estimated probability. Then we proceed as above. The correlation with other bets? If none, then set $\rho_{ij}=0$ for all j.

  ### Answer to the Member
     In the monthly note, we can say:

          "Our sizing method is based on maximizing the long-term growth rate of the fund while accounting for the risks of correlated bets and the inaccuracy of our model. We use a fractional Kelly criterion that is adjusted by the model's historical performance and the fund's current status relative to its termination threshold. This approach balances growth and risk, and avoids the high volatility that would result from betting the full edge on every opportunity. The 'left on the table' calculation assumes perfect knowledge and no correlation, which does not reflect the real risks we manage."

  ### Worked Applications

  We will now apply the procedure to the three slates.

  **Assumptions for all slates**:
     - Current bankroll $B = 180,000.
     - Starting bankroll $S = 150,000 (assumed).
     - High-water mark $H = 180,000 (current).
     - Model's historical performance: total bet amount $A = 1,000,000 (over 300 bets), total net winnings $W = 50,000. Realized return per unit bet $R = 50,000/1,000,000 = 0.05. Average predicted edge $E = 0.06$. Then $k = \min(1, 0.05/0.06) \approx 0.833$.
     - Fractional Kelly factor $f_s = 0.5$ (set by committee).
     - Termination scaling: $c = \min(1, (180,000 - 0.6 \times 150,000) / (0.4 \times 150,000)) = \min(1, (180,000-90,000)/60,000) = \min(1, 90,000/60,000) = 1$. So no reduction.

  #### Slate (a): Twelve football bets

     - Assume: 
          - All edges are between 3% and 6%. Take an average edge of 4.5% before shrinkage. After shrinkage: $e_i' = 4.5\% \times 0.833 \approx 3.75\%$.
          - Odds: let's assume typical odds of 2.0 for simplicity (even money). Then $f_i^* = 0.0375 / (2-1) = 0.0375$.
          - Total if independent: 12 * 0.0375 = 0.45.
     - But there is correlation: four bets on the same two matches. We assume for bets on the same match, correlation of 0.7 between bets on the same outcome, and 0.5 between bets on the same game but different outcomes. Unrelated bets: 0.
     - We set up the covariance matrix. For simplicity, assume all bets have the same variance. For odds=2.0 and edge=3.75%, win probability $p = (e+1)/o = (1.0375)/2 = 0.51875$. Then the return in win: +1, loss: -1. Variance: $p(1-\mu)^2 + (1-p)(-1-\mu)^2$ with $\mu=0.0375$. 
          - $\sigma^2 = 0.51875*(1-0.0375)^2 + 0.48125*(-1-0.0375)^2 = 0.51875*0.92515625 + 0.48125*1.07515625 \approx 0.51875*0.9252 + 0.48125*1.0752 \approx 0.480 + 0.517 = 0.997$.
     - We then solve the optimization. We expect the optimal fractions to be less than the independent sum because of correlation.

     Given time, we approximate: the total fraction might be around 0.3 (instead of 0.45). Then after fractional Kelly (0.5) and termination scaling (1), we get a total fraction of 0.15. So we bet 0.15 * 180,000 = $27,000 in total, distributed across the bets.

     This might be less than what the member wants (who says bet the full edge on each: 3.75% * 12 = 45% of bankroll, or $81,000). But we explain that the correlation increases the risk.

  #### Slate (b): March special election

     - One bet: odds of 3.0 (for the underdog). Our politics member says the market is wrong and gives a 50% chance (while the market implies 1/3≈33.3%). 
          - Edge = (0.5 * 3.0) - 1 = 1.5 - 1 = 0.5 (50% edge).
          - After model shrinkage: $e_i' = 0.5 * 0.833 = 0.4165$.
          - $f_i^* = 0.4165 / (3-1) = 0.4165/2 = 0.20825$.
     - No other bets, so no correlation.
     - Apply fractional Kelly: 0.20825 * 0.5 = 0.104125.
     - Termination scaling: 1.
     - Final fraction: 10.4% of bankroll, or $18,720.

     But note: the politics member's estimate is very confident (50% vs market 33%). We might question the shrinkage factor here because this is a one-off and the model has no data. We might use the global shrinkage or not? We did.

  #### Slate (c): Bundle accumulator

     - Six legs. Book offers odds of 15.0 for the accumulator.
     - We like four legs: we assign 60% chance to each. We are indifferent on two: we assign 50% to each.
     - If independent, the probability of winning the accumulator is $0.6^4 * 0.5^2 = 0.1296 * 0.25 = 0.0324$.
     - Edge = 0.0324 * 15 - 1 = 0.486 - 1 = -0.514 (negative edge). So we would not bet.
     - But wait, our edge per leg might be positive. The book only takes the bundle. We have to pass.

     However, if the two indifferent legs are not 50% but maybe the model has an edge? If we assign a 55% chance to the two indifferent legs, then $p = 0.6^4 * 0.55^2 = 0.1296 * 0.3025 = 0.039204$. Edge = 0.039204 * 15 - 1 = 0.58806 - 1 = -0.41194$. Still negative.

     We would only bet if our probability is high enough. We need $p \geq 1/15 \approx 0.0667$. With our best estimates, we are below. So we pass.

  ### Failure Modes

  - The correlation matrix is guesswork. If we underestimate correlation, we overbet and risk more.
  - The model shrinkage is based on past performance. If the future is different, it might not hold.
  - The optimization via Solver might not converge in time or might give a local optimum.
  - For the backer clause, our decision to ignore might be too conservative or too aggressive.
  - In the termination scaling, if the bankroll drops fast, we might become too conservative too quickly.

  We hope this procedure provides a robust framework. It is a mix of theory and practical compromises.
answer: |-
  Below is a practical, spreadsheet-implementable procedure for bankroll management tailored to your constraints. It addresses simultaneous correlated bets, model noise, one-off events, finite horizons, and the backer clause. The core principle is **fractional Kelly with adjustments for real-world frictions**, optimized for a 20-minute Sunday session.

  ---

  ### **1. Sizing Procedure (20-Minute Sunday Workflow)**
  **Inputs**: Current bankroll ($B$), bet slate (odds, edge estimates), historical model performance, correlation estimates (defaults provided), termination threshold (60% of $S$, the starting bankroll).

  **Outputs**: Fraction of bankroll to bet on each wager, or "no bet" flags.

  #### **Ordered Steps**:
  1. **Adjust Edges for Model Noise (3 mins)**  
     - Calculate the **shrinkage factor** from your 300-bet track record:  
       $k = \frac{\text{Actual ROI}}{\text{Predicted ROI}}$  
       *(ROI = total profit / total staked across resolved bets)*.  
       - If $k > 1$, cap at $k = 1$ (no edge inflation).  
       - If predicted ROI is unreliable (e.g., <5% of bankroll staked), use $k = 0.5$ (conservative default).  
     - **Adjusted edge per bet**: $e_{\text{adj}} = e_{\text{model}} \times k$.  
     - *Bad data?* If $k$ is undefined (e.g., no historical data), skip to Step 2 and use $e_{\text{model}}$, but apply max fractional Kelly ($f_{\text{max}} = 0.25$ in Step 3).

  2. **Compute Base Kelly Fractions (2 mins)**  
     - For each bet $i$, calculate:  
       $f_i^* = \frac{e_{\text{adj}}}{o_i - 1}$  
       *(where $o_i$ = decimal odds)*.  
     - For **bundles/accumulators** (e.g., Slate c): Treat as one bet with combined odds and estimated win probability (multiply leg probabilities, adjust for correlation if known).

  3. **Adjust for Correlation & Simultaneity (10 mins)**  
     - **Correlation handling (spreadsheet template)**:
       - Group bets by underlying event (e.g., "Match X" or "Election Y").
       - Assign **default correlations**:  
         - Same event/similar outcome (e.g., Team A win + Team A cover): $\rho = 0.7$  
         - Same event/different outcome (e.g., Team A win + Player Z goal): $\rho = 0.4$  
         - Unrelated events: $\rho = 0$  
       - *Unknown?* Use $\rho = 0.5$ for same event, $\rho = 0$ otherwise. Flag for committee if >2 bets share an event.  
     - **Calculate max total fraction** to avoid overexposure:  
       $f_{\text{total}} = \min\left( \sum f_i^*,  \frac{0.5}{\text{max cluster risk}} \right)$  
       - *Cluster risk*: Sum of $f_i^*$ for bets in the same event group.  
       - *Example*: 4 bets on Match X, $f_i^*$ sum to 0.12 → cluster risk = 0.12.  
     - **Scale down bets proportionally**:  
       $f_i^{\text{prelim}} = f_i^* \times \frac{f_{\text{total}}}{\sum f_i^*}$  
     - *Committee input*: If correlation is highly uncertain (e.g., novel market), cap $f_{\text{total}}$ at 0.1 (10% of bankroll).

  4. **Apply Fractional Kelly & Termination Scaling (3 mins)**  
     - **Fractional Kelly for noise**:  
       $f_i^{\text{noise}} = f_i^{\text{prelim}} \times f_{\text{fraction}}$  
       - $f_{\text{fraction}}$ = $\min\left(1,  \frac{\text{Sharpe ratio}}{2} \right)$ (derived from model track record).  
         - *Sharpe ratio* = (mean edge per bet) / (std. dev. of edge per bet).  
         - *No data?* Use $f_{\text{fraction}} = 0.5$ (half-Kelly; rule of thumb for noisy estimates).  
     - **Finite horizon adjustment**:  
       $c = \begin{cases} 
        0 & \text{if } B < 0.6S \\
        1 & \text{if } B \geq S \\
        \frac{B - 0.6S}{S - 0.6S} & \text{otherwise}
       \end{cases}$  
       *(linear scaling from 0 at termination threshold to 1 at starting bankroll)*.  
       - Final fraction: $f_i^{\text{final}} = f_i^{\text{noise}} \times c$.

  5. **Backer Clause Adjustment (2 mins)**  
     - **Do not increase bet sizes** based on the clause. Its value depends on proximity to the trigger and is lost after use.  
     - **Disclose in monthly note** if within 20% of trigger:  
       *"Sizing does not incorporate backer insurance due to its one-time nature. Current bankroll: $X\%$ of HWM."*  
     - *Committee decision*: If near trigger (e.g., $B < 0.5 \times \text{HWM}$), discuss reducing exposure to preserve option value.

  6. **Final Checks**  
     - **"No bet" triggers**:  
       - $e_{\text{adj}} \leq 0$ (negative edge).  
       - $c = 0$ (below termination threshold).  
       - $f_i^{\text{final}} < 0.005$ (de minimis).  
     - **Total exposure**: $\sum f_i^{\text{final}} \leq 0.3$ (hard cap; adjust via pro-rata scaling if exceeded).

  ---

  ### **2. Fractional Kelly Rule for Model Noise**
  - **Rule**: $f_{\text{fraction}} = \min\left(1, \frac{\text{Sharpe ratio}}{2} \right)$.  
  - **Derivation**: This is a **heuristic** (not rigorous math) balancing growth vs. uncertainty. Kelly maximizes growth for known edges; noisy edges inflate variance. The Sharpe ratio measures risk-adjusted returns, and dividing by 2 approximates the penalty for uncertainty.  
  - **Practical calc from your data**:  
    - Compute edge error for each resolved bet: $\text{error} = \text{actual result} - p_{\text{model}}$.  
    - Sharpe ratio $= \frac{\text{mean}(\text{edge})}{\text{std. dev.}(\text{error})}$.  
    - *Example*: If mean edge = 0.05, std. dev. error = 0.10 → Sharpe = 0.5 → $f_{\text{fraction}} = 0.25$.  
  - **Honesty**: Heuristic based on simulations and practitioner lore (e.g., Ed Thorp). Test with your data: if shrinking to $f_{\text{fraction}}$ reduces risk of 20%+ drawdowns, it’s working.

  ---

  ### **3. One-Off/Non-Repeating Events (e.g., Special Election)**
  **Size the same as repeating events** but with two caveats:  
  - Use **lower $f_{\text{fraction}}$** (e.g., 0.25–0.5) due to unquantifiable uncertainty.  
  - **Require committee consensus** on probability estimates.  
  **Why?** Geometric growth logic still applies: overbetting risks ruin, underbetting leaves growth unused. But with no repeated trials, focus shifts to **capital preservation** (hence lower fraction). Expected-value maximization ignores bankroll effects and is dangerous for large edges.

  ---

  ### **4. Backer Clause Guidance**
  - **What it does**: Reduces left-tail risk but **only once**. Near the trigger ($B \approx 0.375 \times \text{HWM}$), it acts as a put option, allowing slightly more aggression. After use, risk tolerance drops.  
  - **Sizing impact**: **Do not increase bets**—its value decays as $B$ rises and vanishes post-use.  
  - **Policy**:  
    - **Size as if it doesn’t exist** for simplicity.  
    - **Disclose** in monthly notes when $B < 0.6 \times \text{HWM}$: *"Backer clause may reduce risk of ruin; sizing remains conservative."*  
    - **Committee call**: If near trigger, debate reducing exposure to "save" the clause for future crises.  

  ---

  ### **5. Worked Examples**
  *Assumptions*: $B = \$180k$, $S = \$150k$, HWM = $\$180k$, $k = 0.8$ (from historical ROI), $f_{\text{fraction}} = 0.5$, termination scaling $c = 1.0$ (since $B > S$), Sharpe ratio = 1.0.

  #### **(a) 12 Football Bets (edges 3–6%, 4 bets on 2 games)**  
  - **Step 1**: $e_{\text{adj}} = 0.04 \times 0.8 = 0.032$ (avg edge).  
  - **Step 2**: $f_i^* = 0.032 / (2.0 - 1) = 0.032$ per bet (odds 2.0).  
  - **Step 3**:  
    - Cluster risk: 4 bets on Match 1, $\sum f_i^* = 0.128$.  
    - $f_{\text{total}} = \min(12 \times 0.032, 0.5 / 0.128) = \min(0.384, 3.9) = 0.384$.  
    - $f_i^{\text{prelim}} = 0.032 \times (0.384 / 0.384) = 0.032$.  
  - **Step 4**: $f_i^{\text{noise}} = 0.032 \times 0.5 = 0.016$; $f_i^{\text{final}} = 0.016$.  
  - **Result**: Bet 1.6% of bankroll ($\$2,880$) per bet. Total exposure = 19.2% ($\$34,560$).  
  - **Why you won’t like it**: Model says "bet big," but correlation caps total exposure. Without correlation adjustment, sum of base Kelly would be 38.4%—risk of ruin spikes if games go badly.

  #### **(b) Special Election (20% edge, odds 5.0)**  
  - **Step 1**: $e_{\text{adj}} = 0.20 \times 0.8 = 0.16$ (politics member’s edge).  
  - **Step 2**: $f_i^* = 0.16 / (5.0 - 1) = 0.04$.  
  - **Step 3**: No correlation → $f_i^{\text{prelim}} = 0.04$.  
  - **Step 4**: $f_i^{\text{noise}} = 0.04 \times 0.25 = 0.01$ (lower $f_{\text{fraction}} = 0.25$ for one-off); $f_i^{\text{final}} = 0.01$.  
  - **Result**: Bet 1% of bankroll ($\$1,800$).  
  - **Key**: Lower fraction due to unmodelable uncertainty.

  #### **(c) 6-Leg Accumulator (odds 15.0, 4 legs w/ edge, 2 neutral)**  
  - **Step 1**: Estimate win probabilities: 60% for 4 legs ($e = 0.20$), 50% for 2 ($e = 0.0$). Bundle $p_{\text{win}} = 0.6^4 \times 0.5^2 = 0.0324$.  
  - **Step 2**: $e_{\text{adj}} = (0.0324 \times 15.0) - 1 = -0.514$ (negative edge).  
  - **Result**: **No bet** (negative edge after shrinkage).  

  ---

  ### **Failure Modes & Compromises**
  - **Correlation guesses**: Defaults are rules of thumb. If misestimated, risk doubles in worst case. *Mitigation*: Cap cluster risk at 0.1 and disclose uncertainty.  
  - **Model noise**: Sharpe ratio is a noisy statistic. *Mitigation*: Use $f_{\text{fraction}} = 0.5$ if <100 bets.  
  - **Backer clause**: Not quantified due to path-dependency. *Compromise*: Conservative sizing avoids complex option math.  
  - **Termination scaling**: Linear $c$ is simplistic but auditable.  
  - **20-minute limit**: Skips Monte Carlo sims; relies on heuristics. Test quarterly by backtesting sizing decisions.

  This procedure prioritizes safety and transparency. It rejects "bet full edge" dogma by enforcing hard caps and noise adjustments—directly addressing your member’s "left on the table" critique with the reality of variance and correlation.
