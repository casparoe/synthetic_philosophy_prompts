prompt: |-
  hey — I'm the night charge nurse on a locked memory-care floor, 28 residents, mostly mid-to-late stage Alzheimer's with a couple of vascular dementia, and my aides make maybe forty of these calls a shift. Our written policy is one line, something like "use therapeutic truth-telling and avoid causing distress," which everyone reads differently, so I want to replace it with an actual procedure.

  The reason I'm asking you and not a textbook: someone told me Augustine held that every deliberate lie is a sin, including lies that would save a life, but that you're allowed to simply *not say* things — concealing the truth isn't lying — and that what makes an utterance a lie is the will to deceive rather than the falsity of the sentence. That sounds weirdly workable at 3am, and I'd rather build the card around it than around "do the kindest thing," which is what got us into this mess.

  So: a decision procedure that fits on one side of a laminated index card. Max four or five steps, runnable in about fifteen seconds, by an aide who's been on the job three weeks and is being pulled down a hallway by someone who thinks she's late for work. For each step: the question asked, what counts as a good enough answer, where the card stops with a hard NO, and where it hands the call up to me or to the family because it's a values question and not a fact question.

  Four situations I dont know where to put in the tree, and I want them placed, not just discussed:

  - borrowed voice: the daughter texts "tell mom I'll be there Sunday," she isn't coming, and the aide says "your daughter says she'll be here Sunday." Nothing false is being said about what the daughter said, but the point of saying it is that mom believes she's coming.

  - standing fictions: we have a painted bus stop by the exit door and two therapy dolls in the day room. Nobody asserts anything; the room is just arranged to produce a belief. Is that even the card's business?

  - drift: a resident asks something perfectly coherent inside 1961 — "has my husband finished at the yard?" — where any true answer is either noise to her or a fresh bereavement. Can the procedure allow answering a different question that happens to be true?

  - ninety-second uptake: if she won't remember this exchange in two minutes and may not be tracking the sentence at all, does the intent-to-deceive test get off the ground? I don't want a rule that quietly amounts to "it's fine if they won't remember."

  Also give me three memorizable sentence-frames that pass the procedure for "where is X / when is X coming," since that's most of the volume.

  Then run the finished card on three cases: (1) Mrs. K, 3am, wants to know when her mother is picking her up; her mother died in 2001. (2) Mr. R, about to get a catheter change he's had before and hated, asks "is this going to hurt?" — it will. (3) Mrs. O's son died in a crash last month; she forgets within ten minutes and grieves it as new each time; the family has asked us to tell her he's fine.

  One more thing: I gather Augustine also grades lies, worst to nearly-excusable, instead of just banning them in one lump. Tell me whether that grading belongs on the card at all, or whether it's only good for how we write up an incident afterward — and if it's the latter, what we'd actually use it for.

  Finally, be straight with me about what the procedure can't do: which of these it will spit out an answer on that I'll then have to overrule, and which calls genuinely need a person's signature.
reasoning: |-
  Okay, this nurse is dealing with a really intense situation. A locked memory-care floor with 28 residents, mostly mid-to-late stage Alzheimer's, and aides making about 40 calls per shift about how to handle residents' questions. The current policy is too vague—just "use therapeutic truth-telling and avoid causing distress"—which leads to inconsistent interpretations. They want a concrete, laminated card procedure based on Augustine's idea that lying is about intent to deceive, not just false statements, and that concealing truth isn't lying. The goal is a quick, 15-second decision tree for new aides, even when being pulled down the hallway.

  First, I need to address the core Augustine concept: lying requires intent to deceive, not just falsity. Concealing truth is acceptable. That's foundational here. The procedure must be simple—four to five steps max—and fit on an index card. It should have clear questions, criteria for answers, hard stops (NO), and when to escalate. Also, handle the four tricky situations: borrowed voice (daughter's text), standing fictions (bus stop, dolls), drift (coherent questions in past context), and ninety-second uptake (no memory retention). Plus, provide sentence frames for common questions like "where is X" or "when is X coming."

  The nurse also wants the card tested on three cases: Mrs. K asking about her deceased mother, Mr. R asking if a catheter change will hurt (it will), and Mrs. O whose son died but family wants her told he's fine. And there's a question about Augustine's grading of lies—whether it belongs on the card or just for incident reports.

  Now, breaking this down. The card needs to be actionable. Start with Step 1: "Is a response needed?" Sometimes, distraction or redirection works without engaging the question. If not, move to Step 2: "Can I answer truthfully without causing immediate distress?" If yes, do it. If no, Step 3: "Can I redirect or conceal without lying?" Like answering a related true thing or changing the subject. Step 4: If that fails, it's a hard NO—don't lie, and escalate to the nurse or family. This structure avoids deception while allowing flexibility.

  For the tricky situations: 
  - Borrowed voice: Saying "your daughter says she'll be here Sunday" is truthful about the message but deceptive in intent. The card should flag this as a NO—escalate because it's borrowing authority to deceive.
  - Standing fictions: Not the card's business since no verbal assertion occurs; it's environmental. The procedure only covers verbal interactions.
  - Drift: Allowed under Step 3—answer a different but true question. For example, if asked about a husband in 1961, say "he always took care of things" if it's factually true.
  - Ninety-second uptake: Intent to deceive still matters; no free pass just because they won't remember. The test applies.

  Sentence frames: Use truthful pivots. For "where is X?": "Let's see if we can find them together." For "when is X coming?": "They'll be here as soon as they can." For unanswerable questions: "I'm here with you right now." These avoid lies and redirect.

  Testing the cases:
  - Mrs. K: Step 1—response needed? Yes. Step 2—truth causes distress (mom dead). Step 3—redirect: "Let's get you cozy until morning." NO to lying, no escalation needed if redirect works.
  - Mr. R: Step 2—truth is possible: "It might be uncomfortable, but I'll help you through it." Truthful and supportive.
  - Mrs. O: Step 2—truth causes distress. Step 3—redirect fails? Hard NO; escalate to nurse/family since it's a values conflict.

  Augustine's lie grading: Not for the card. It's too nuanced for quick decisions. Save it for incident reviews to understand intent vs. harm.

  What the procedure can't do: It won't handle all values conflicts (like Mrs. O) or borrowed voice deception. Those need human judgment. Also, it assumes aides can assess distress, which might be imperfect, but the card includes a distress check. Overrules might happen in gray areas, but the structure minimizes them.

  Finally, be straight: The card simplifies reality. It might spit out answers that need overruling in complex cases, especially when family directives clash with ethics. But for most calls, it provides a clear path, reducing chaos at 3 a.m.
answer: |-
  Based on Augustine's framework (intent to deceive = lie; concealment ≠ lie) and your operational needs, here's a **Laminated Card Procedure** designed for speed, safety, and ethical clarity. The core principle: **Never intend to deceive. Redirect or conceal truthfully when direct truth causes imminent, severe distress.**

  ---

  **THE PROCEDURE (FRONT OF CARD)**  
  *Ask these questions in order. Stop at first "NO" or final step.*

  1.  **"DO I NEED TO ANSWER DIRECTLY?"**  
      *Good enough:* Can I redirect ("Let's get some tea"), distract ("Look at this photo"), or delay ("Let me check later") without engaging the question?  
      *→ If YES, do that. STOP HERE.*  
      *→ If NO (resident insists), go to Step 2.*

  2.  **"CAN I ANSWER TRUTHFULLY WITHOUT CAUSING *IMMEDIATE*, SEVERE DISTRESS?"**  
      *(Severe distress = panic, aggression, uncontrollable sobbing)*  
      *Good enough:* Brief, kind truth ("Your husband passed away years ago, but I’m here").  
      *→ If YES, say it. STOP HERE.*  
      *→ If NO (truth risks severe harm), go to Step 3.*

  3.  **"CAN I CONCEAL OR REDIRECT *TRUTHFULLY*?"**  
      *Good enough:*  
      - Answer a *related* true question ("He always took such good care of the yard" – if factual).  
      - Give a true but vague response ("She’ll be here when she can").  
      - Refocus on present/person ("You’re safe with me tonight").  
      *→ If YES, do it. STOP HERE.*  
      **→ If NO, HARD STOP. DO NOT LIE. ESCALATE TO NURSE/FAMILY.**  

  ---

  **TRICKY SITUATIONS PLACEMENT:**  
  - **Borrowed Voice ("Tell mom I’ll be there Sunday")**: Fails Step 3. Saying "Your daughter *says* she’ll be here Sunday" intends deception (you know she won’t). **→ HARD STOP (Step 3 NO). ESCALATE.**  
  - **Standing Fictions (Bus stop, dolls)**: Not the card’s business. Procedure only covers *verbal responses*. Environmental cues are care-plan decisions.  
  - **Drift ("Has my husband finished at the yard?")**: Allowed in Step 3. Answering "He always kept it so tidy" (if true) redirects truthfully.  
  - **Ninety-Second Uptake**: Intent matters regardless of memory. If you *intend* deception, it’s a lie. Card still applies.  

  ---

  **SENTENCE FRAMES (BACK OF CARD)**  
  For "Where is X?" / "When is X coming?"  
  1.  **"I’m not sure where they are *right now*, but let’s see what we can find to do together."**  
      *(Conceals absence; focuses on present)*  
  2.  **"They’ll be here as soon as they can. How about we [get a snack/look at photos] while we wait?"**  
      *(True if "as soon as they can" includes "never"; redirects)*  
  3.  **"I know you miss them. I’m here with you until they arrive."**  
      *(Validates feeling; truthful if "until they arrive" means "for now")*  

  ---

  **CASE TESTS (Using Card):**  
  1.  **Mrs. K (3am, "When is Mom picking me up?")**  
      - Step 1: Redirect? (e.g., "It’s nighttime now, let’s get you back to bed") – *If she accepts, STOP.*  
      - Step 2: Truth? ("She passed away long ago") – *Risks severe distress at 3am? Likely YES → Step 3.*  
      - Step 3: Conceal truthfully? "She’d want you resting safe in bed tonight. I’ll stay with you." → *STOP.*  

  2.  **Mr. R ("Is this going to hurt?")**  
      - Step 1: Redirect? (*Unlikely; he’s focused on procedure*).  
      - Step 2: Truth? "It might be uncomfortable, but it’s quick and I’ll help you through it" → *Truthful, non-distressing. STOP.*  

  3.  **Mrs. O ("How’s my son?")**  
      - Step 1: Redirect? (*If she accepts, STOP*).  
      - Step 2: Truth? Causes repeated severe distress → *NO*.  
      - Step 3: Conceal? "He’d want you to enjoy this sunshine" → *True if son was caring*. *If she demands specifics, Step 3 fails* → **HARD STOP. ESCALATE.** (Card blocks lying per family).  

  ---

  **AUGUSTINE’S LIE GRADING: FOR INCIDENT REPORTS, NOT THE CARD**  
  - **What it is**: Augustine ranked lies (e.g., "malicious lies" worst, "officious lies" to help others least bad).  
  - **Why not on the card**: Too nuanced for 15 seconds. Encourages rationalizing deception ("it’s just a small lie").  
  - **How to use it post-incident**:  
      1. Audit near-misses (e.g., "Aide almost lied because family pressured them").  
      2. Justify counseling/discipline if intent was deceptive (vs. poor redirection).  
      3. Refine care plans (e.g., "Mrs. O’s case requires family meeting; Augustine grade X explains why we refused").  

  ---

  **WHAT THE PROCEDURE CAN’T DO (BE STRAIGHT):**  
  - **It will spit out overrule-needed answers when**:  
      - Families demand deception (e.g., Mrs. O) – card says "NO," but you may need to negotiate.  
      - Aides misjudge "severe distress" (e.g., truth causes tears but not panic; aide avoids it anyway).  
  - **It genuinely needs a human signature for**:  
      1. **Borrowed voice requests** (always escalate – it’s institutionalized deception).  
      2. **Repeated, unresolvable conflicts** (e.g., resident asks hourly; card works once but care plan needs adjustment).  
      3. **Values vs. safety clashes** (e.g., devout resident asks "Is God punishing me?" – truth/concealment may not suffice; needs chaplain).  
  - **Limitation**: Relies on aide’s split-second distress assessment. Train with scenarios to reduce errors.

  ---

  **FINAL CARD LAYOUT (ABRIDGED):**  
  **1. Redirect?** YES → Do it. NO → Next.  
  **2. Truth safe?** YES → Say it. NO → Next.  
  **3. Truthful conceal/redirect?** YES → Do it. NO → **STOP. ESCALATE.**  
  **COMMON QUESTIONS:** Use frames like "They’ll be here soon" or "Let’s find something fun while we wait."  

  This gives structure without dogma, honors Augustine’s line, and contains the chaos. I’d field-test it for a week and adjust the distress threshold based on what your aides can handle. You’ve got this.
