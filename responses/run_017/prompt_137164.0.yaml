prompt: |-
  I teach aesthetics at a mid-sized state university, and a friend who runs a small documentary festival has cornered me into writing her something I can't quite finish. She programmes maybe forty films a year and about six to eight times a year one of them turns out to have a problem: the director was abusing the crew, or the subject's consent was obtained under false pretences, or the filmmaker is facing charges for something that has nothing to do with the film at all. She has no in-house counsel, the board has to sign off on anything that looks like a political statement, and she usually finds out forty-eight hours before the programme grid goes to print. So I can't give her an essay on autonomism vs. moralism; I need something her programming associate, who has a film-studies BA and no philosophy, can actually run in one sitting, at the end of which it hands her one of four dispositions: show it as planned, show it with context (a note in the programme, an on-stage caveat, a panel afterwards), show it only if some condition is met (fee renegotiated, proceeds redirected to a victim's fund, a content warning), or pull it.

  The bit where I keep getting stuck is that I think the whole thing is secretly two separate procedures stapled together, and I want her to be able to tell which one she's running. There's a question about whether the work is worse as art because of what the maker did — the sort of claim that seems true when the immorality is visible in the work itself and much less plausible when it isn't — and then there's a completely different question about what a festival ought to platform, which is about money, audiences, and who gets to speak, and could go either way even if the artwork is flawless. I want both tracks, with a signpost at the fork. Along the way the procedure has to handle some cases I've invented for it, partly because I think they break the tidy versions: the constitutive case, where the wrongdoing is inside the work — footage gotten by deceiving the person filmed, a sculpture using material taken from a community's burial ground — so that you cannot remove the taint without destroying the piece; the taint-value case, where the piece is partly interesting because a notorious person made it, so the badness is doing some of the aesthetic work and sanitising it would leave you with nothing; the collaborative case, a forty-person crew with one person's misconduct somewhere in it, where I can't even say whose work it is; the split-victim case, where one of the people harmed wants the film shown as testimony and another wants it buried; and the timing case, a conviction last year versus an artist dead for ninety years, where the money flows somewhere different in each. It also has to say what to do in the epistemic muddle that actually comes up most: an allegation reported by one outlet, no charges, artist denies it, audience has never heard of it — and honestly, an audience that hasn't heard of it is a different situation from one that has, and I don't think either is more fundamental.

  So: write me the procedure. Number the questions in the order she should ask them, say what counts as a sufficient answer to each, where it stops with a no, and — this matters most to me — where it has to stop and hand the decision to a person because the issue is one of values rather than facts, with an explicit note on who signs off at that point. Keep every distinction you think must survive the simplification and drop the ones that don't, but tell me what you dropped and why it was safe to drop. Then run it on three composites of mine, no real names: a vérité feature about a recovering addict, made by a director who was in a coercive relationship with its central subject, and the subject is alive and wants it screened; an animated short about grief by someone convicted of financial fraud against his own family, unrelated to the film; and a large installation I've saved for last, because she's already booked the venue and spent the insurance money on it, built by a sculptor from objects taken without permission from a community's burial site, and that community is asking for it to be destroyed rather than shown. If the procedure gives her an answer on that third one that she won't like, say so plainly rather than fudging it. Finally, tell me what the procedure cannot do — I assume it can't tell her whether a film is any good, and I suspect there's a deeper thing it can't do around cases where the audience's knowledge of the artist is what makes the work worth showing at all, but I'd like you to name it better than I just did.
reasoning: |-
  Okay, let me approach this systematically. The professor needs a practical decision-making tool for documentary festival programming that handles ethical-artistic dilemmas. The key requirements are: simplicity for non-philosophers, four clear dispositions, distinction between artistic merit and institutional responsibility, handling of edge cases, and transparency about limitations.

  First, I consider the core structure. The requested fork between "artistic integrity" and "institutional responsibility" makes sense - these are fundamentally different considerations. For artistic assessment, I focus only on whether the wrongdoing materially affects the work itself, ignoring unrelated moral issues. For institutional decisions, I include audience impact, stakeholder harm, and practical constraints.

  The edge cases need special handling mechanisms:
  - Constitutive cases get an immediate flag in Q1
  - Taint-value requires acknowledging when immorality is part of the appeal
  - Collaborative works need clear attribution thresholds
  - Split-victim opinions create a weighting system
  - Timing considerations affect financial/reputational impacts

  I'll design the questions to flow logically from most objective to most subjective:
  1. Direct work-impact (artistic track)
  2. Stakeholder harm assessment (institutional track)
  3. Mitigation feasibility 
  4. Practical constraints

  For epistemic uncertainty, I'll build in tiers of evidence with corresponding transparency requirements. The audience awareness factor will influence disclosure levels rather than core decisions.

  The procedure's limitations must be explicit:
  - Cannot judge artistic quality (only contamination)
  - Cannot resolve value conflicts (only frame them)
  - Cannot handle "notoriety as aesthetic" cases perfectly
  - Depends on imperfect information

  Testing with the three composite cases will reveal weaknesses, especially the burial objects installation where artistic and institutional tracks likely conflict sharply. I'll ensure the output doesn't fudge difficult outcomes.
answer: |-
  Here's a practical decision procedure for your friend's festival, designed for speed, clarity, and accountability. It separates the two tracks ("Artistic Integrity" and "Institutional Responsibility") with a clear fork and handles your specified edge cases. The procedure assumes basic fact-gathering has been done (e.g., verifying allegations via credible sources). Dispositions are: **Show**, **Show with Context**, **Show with Conditions**, or **Pull**.

  ---

  ### **The Procedure: Ethical Screening Assessment**
  **Who Runs This:** Programming Associate (PA)  
  **Who Signs Off on Values Decisions:** Festival Director (FD) or Board (if policy/$$$ impact)  
  **Time Limit:** 45-60 minutes max.  
  **Output:** One of four dispositions + brief rationale.

  ---

  #### **QUESTIONS & DECISION FLOW**

  1. **Is the alleged/confirmed wrongdoing CONNECTED to the creation or content of THIS work?**  
     *Sufficient Answer:* Yes (if wrongdoing materially shaped the work’s form/subject/structure) / No (if unrelated or tangential).  
     *Edge Cases:*  
     - **Constitutive Case (e.g., footage from deception):** → **Yes**.  
     - **Taint-Value Case (e.g., work gains meaning from maker’s notoriety):** → **Yes** (even if "value" is problematic).  
     - **Collaborative Case (e.g., 1 bad actor in 40-person crew):** → Only **Yes** if the wrongdoer had *significant creative control* (director, lead producer, DP) or their actions *directly enabled the work* (e.g., fraud funding it).  
     - **Split-Victim Case:** Ignore for now (handled later).  
     *If YES → Go to **Artistic Integrity Track (Q2-Q3)**.*  
     *If NO → Skip to **Institutional Responsibility Track (Q4-Q5)**.*

  ---

  ### **ARTISTIC INTEGRITY TRACK**  
  *(Only if Q1 = YES)*  
  *(Focus: Can the work be judged "as art" given its tainted origins?)*

  2. **Can the work be presented honestly without endorsing or obscuring the wrongdoing?**  
     *Sufficient Answer:* Yes (if the harm can be framed critically) / No (if showing it unavoidably sanitizes or profits from harm).  
     *Stops with NO → Disposition = **Pull**.*  
     *Rationale:* If the work’s existence depends on unethical acts and cannot be contextualized without complicity, it cannot be shown ethically.  
     *If YES → Proceed to Q3.*

  3. **Does contextualizing the wrongdoing undermine the work’s artistic value OR essential message?**  
     *Sufficient Answer:* Yes (if context makes the work incoherent/pointless) / No (if context adds layers or critique).  
     *Stops with YES → Disposition = **Pull**.*  
     *Rationale:* If the truth destroys the work’s raison d'être, showing it is indefensible.  
     *If NO → Disposition = **Show with Context** (mandatory note/panel/vetting).*  
     *Values Checkpoint:* If Q3 is ambiguous, FD must decide if context is *aesthetically* justifiable.  

  ---

  ### **INSTITUTIONAL RESPONSIBILITY TRACK**  
  *(If Q1 = NO, or after Artistic Track yields "Show with Context")*  
  *(Focus: Should the festival platform this, regardless of artistic merit?)*

  4. **Does showing the work risk significant harm to stakeholders (subjects, victims, vulnerable communities) or the festival’s integrity?**  
     *Sufficient Answer:*  
     - **High Risk** (e.g., re-traumatizing victims, platforming unrepentant abuser, violating cultural taboos) → **Pull**.  
     - **Mitigable Risk** (e.g., victims divided, harm reducible via conditions) → Proceed to Q5.  
     - **Low Risk** (e.g., historical case, no ongoing harm) → Proceed to Q5.  
     *Edge Cases:*  
     - **Split-Victim Case:** If harmed parties disagree (e.g., victim A wants screening, victim B opposes), default to **Show with Conditions** requiring victim consent/benefit.  
     - **Timing Case:** Recent harm (≤5 yrs) = higher risk; distant harm = weigh against current benefit.  
     *Epistemic Muddle (unverified allegations):* → **Show with Context** (note allegation + denial) unless risk is severe (e.g., violent crime). Audience awareness doesn’t change disposition but affects *how* context is presented (explicit vs. available upon request).

  5. **Can risks be mitigated or benefits amplified via conditions?**  
     *Sufficient Answer:*  
     - **Yes, easily** (e.g., add content warning, donate fees to victims, panel discussion) → **Show with Conditions**.  
     - **Only with difficulty** (e.g., fee renegotiation impossible, community demands unrealistic) → FD decides: **Show with Conditions** or **Pull**.  
     - **No** (e.g., community demands destruction) → **Pull**.  
     *Values Checkpoint:* FD signs off on feasibility/ethics of conditions. If costs threaten festival viability (e.g., cancelling booked venue), Board must approve **Pull**.  

  ---

  ### **DISTINCTIONS RETAINED & DROPPED**
  - **Kept:**  
    - Artistic vs. institutional separation (the fork).  
    - Constitutive wrongdoing (Q1).  
    - Stakeholder harm hierarchy (Q4 prioritizes victims over audiences).  
    - Collaborative attribution threshold (Q1).  
    - Epistemic tiers (unverified → context; verified → stricter).  
  - **Dropped:**  
    - Moral vs. aesthetic value debates (reduced to "can it be shown honestly?").  
    - Artist’s intent (irrelevant; focus on impact).  
    - Audience taste (not a factor; festivals curate, not poll).  
    *Why Safe:* The procedure prioritizes *actionable harm* over theoretical debates. Philosophy is distilled into binary choices; granularity is sacrificed for speed.

  ---

  ### **TEST RUNS ON COMPOSITE CASES**

  1. **Vérité Feature (Director in coercive relationship with subject)**  
     - Q1: **YES** (wrongdoing constitutive to access/subject).  
     - Q2: **YES** (can contextualize coercion without endorsing it).  
     - Q3: **NO** (context doesn’t destroy film; subject’s testimony may add value).  
     - → **Show with Context** (mandatory panel on ethics + subject’s consent highlighted).  

  2. **Animated Short (Director convicted of unrelated family fraud)**  
     - Q1: **NO** (fraud unrelated to film).  
     - Q4: **Mitigable Risk** (harm to family possible; audience may feel complicit).  
     - Q5: **YES** (add note: "Director convicted of fraud against family; proceeds donated to fraud victims’ fund").  
     - → **Show with Conditions** (fee redirection mandatory).  

  3. **Burial Objects Installation (Objects taken without permission; community demands destruction)**  
     - Q1: **YES** (constitutive wrongdoing).  
     - Q2: **NO** (showing it inherently violates community taboos; cannot "context away" sacrilege).  
     - → **Pull**.  
     *Hard Truth:* The procedure demands this, even with sunk costs. Showing it would compound harm. FD must absorb financial/political fallout or get Board approval for defiance (but procedure says **Pull**).

  ---

  ### **WHAT THE PROCEDURE CANNOT DO**
  1. **Assess Artistic Quality:** It assumes the film is festival-worthy artistically; this only evaluates ethical obstacles.  
  2. **Resolve "Taint-as-Value" Cleanly:** If a work’s *only* merit is notoriety (e.g., a mediocre film by a monster), Q3 may force **Pull**, but this clashes with audience interest. The procedure prioritizes ethics over curiosity.  
  3. **Handle Ambiguous Authorship Perfectly:** If a "collaborative work" has minor-but-pivotal misconduct (e.g., a predator key grip), Q1 may miss it.  
  4. **Override Power Imbalances:** E.g., if victims "consent" under duress, the procedure trusts the PA’s judgement.  
  5. **Predict Backlash:** An audience unaware of allegations may revolt if informed; this is managed in Q4’s "mitigation" but remains a risk.  

  **Core Philosophical Limit:** It cannot decide whether art *should* be separated from artist in principle—it **presumes separation is often possible** (Institutional Track) but **invalid when wrongdoing is structural to the work** (Artistic Track). This reflects your intuition that the two questions are distinct but interdependent.  

  ---  
  **Final Output:** A one-page flowchart with questions, dispositions, and sign-off notes. Test-run with your composites to validate. If she balks at the burial objects outcome, remind her: festivals aren’t courts of appeal; they’re platforms. Some things can’t be platformed cleanly.
