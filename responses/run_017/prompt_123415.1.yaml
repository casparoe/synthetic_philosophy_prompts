prompt: |-
  I'm in a third-year seminar on social norms — we did the usual story about conventions as solutions to coordination problems a few weeks back and I never really got how any of that is supposed to turn into an actual *moral* obligation rather than just "people will think you're rude" — and I've got 2000 words due Friday on whether everyday conventions are moral obligations and whether visitors have to follow local ones. I've been going through cases by gut and I want the principle behind my verdicts, or a better one plus a note about which verdict I should drop.

  My verdicts (all stuff I've actually been in or watched happen):

  - Sit-down restaurant in a US city where it's understood that servers are paid on the assumption that tips make up most of their income. Leaving nothing: not just rude, actually wrong, and it feels closer to withholding owed money than to bad manners.
  - Tip jar at a coffee counter where the barista is on a proper wage. Putting in nothing: completely fine, no obligation at all.
  - Cutting in front of five people at a bus stop in a city where queueing is the norm: wrong.
  - Boarding a train in a city where there genuinely is no queue — everyone stands in a scrum and boards by jostling, and drivers and other passengers all know this. Jostling like everyone else: not wrong. But a visitor on their first day who shoves past a seventy-year-old and knocks them off balance: wrong.
  - Crossing on a red pedestrian signal at 1am with the street completely empty, in a city where nobody waits: not wrong, and I don't even want to call it rude.
  - Crossing on a red in a city where drivers do not expect pedestrians to do that, so a car swerves and nearly hits someone: wrong.
  - Keeping your backpack on in a packed rush-hour carriage in a city where everyone takes theirs off: rude, not wrong.
  - Tipping 20% every day for three months at the same small café in a city with no tipping norm, as a visiting student: mildly bad, because it ratchets up what the staff and other customers come to expect. Doing the same thing once as a one-off tourist: fine, harmless.
  - A visitor who genuinely has no idea that tipping is expected and stiffs a server: not blameworthy, and I want to say not wrong either — but the server is out money and I feel shifty saying it's fine.
  - Somebody cuts in front of me in the queue back home and I say something: fine, maybe good. Same person, same behaviour, standing at the scrum train door in the no-queue city and telling people off for not queueing: not fine, obnoxious and a bit imperialist.
  - Country where everyone tips but there's an active campaign to abolish tipping and a lot of the workers themselves want it gone. Not tipping there: fine, maybe even mildly good.

  Two I can't settle: (a) the office where everyone puts money in for the cleaner at Christmas, everyone privately thinks it's demeaning and would rather the whole thing stopped, and everyone assumes everybody else is keen — pluralistic ignorance, my seminar leader would say. Tipping or not? I go back and forth several times an hour. (b) A long-stay visitor who just avoids restaurants and taxis and crowded trains entirely so they never have to deal with the local conventions at all. Free pass, or are they dodging something?

  The rule I've been trying out, which I'm calling the four-lock rule: a convention binds you morally just in case (i) people there follow it and expect others to, (ii) someone is made worse off — properly worse off, not just mildly irritated — if you don't, (iii) you could have found out about it without much cost before acting, and (iv) complying doesn't itself make things worse overall. It handles some of the list and I think it breaks on others, but I can't tell which clause to repair or whether the whole shape is wrong. I also can't tell whether I need separate principles for payment-ish conventions (tipping), coordination conventions (queueing) and risk conventions (crossing), or whether one thing covers all three. And I keep noticing that I want visitors to *comply* with local conventions but not to *export* their own — which sounds incoherent, or at least like two different principles wearing one coat.

  Please commit: give me one principle you'd actually defend, not a menu. Structure it like this:

  1. The principle — ~150 words. State it in one sentence, then the clauses, tight enough that I could apply it to a new case without you.
  2. Clause by clause — ~300 words. For each clause, the case of mine that motivates it, and what breaks if you drop it.
  3. My undecided cases — ~200 words. Verdicts on (a) and (b), with reasons.
  4. Two cases you generate — ~200 words. Two situations I haven't listed that your principle gives an answer to, at least one of which should be the kind of case where you'd expect the answer to be surprising.
  5. What I have to give up — ~150 words. Which of my verdicts your principle can't accommodate, and which one you'd overturn.
  6. How confident you are — ~100 words. Which clause you'd defend hardest, which is the weakest joint, and what kind of case would make you change it.
reasoning: |-
  Hmm, the user is in a social norms seminar and is working on a 2000-word essay about whether everyday conventions become moral obligations, especially for visitors. They've listed several personal verdicts on cases like tipping, queueing, and jaywalking, and they have an undecided case about an office Christmas fund and a long-stay visitor avoiding conventions. They've proposed a "four-lock rule" but feel it might be inconsistent. They want me to commit to a single principle, structured in a specific way: a principle statement, clause-by-clause explanation, verdicts on undecided cases, new cases, what they'd have to give up from their verdicts, and confidence level.

  Breaking down their needs: They need a coherent ethical framework that distinguishes mere etiquette from moral obligations, particularly for visitors. Their examples show they're grappling with harm, knowledge, fairness, and cultural imposition. For instance, they see tipping as obligatory where it affects wages but not otherwise, and queue-cutting as wrong only with harm potential. Their undecided case (a) involves pluralistic ignorance where everyone privately dislikes a tradition but participates due to perceived expectations, making it ethically messy. Case (b) questions whether avoiding conventions entirely is dodging responsibility.

  Their four-lock rule has issues: Condition (ii) about "properly worse off" is vague—how does one quantify mild irritation versus real harm? Condition (iv) about compliance not making things worse is tricky in cases like tipping without a norm, which might distort wages. They also sense their rule might not unify payment, coordination, and risk conventions, and they're conflicted about visitors complying locally but not exporting norms, which hints at contextual relativism versus universalism.

  I should propose a principle that's harm-centric but incorporates reasonable expectations and epistemic access. Scanlon's contractualism comes to mind—norms create obligations if they're part of a system no one could reasonably reject, given the costs of non-compliance and the ease of participation. For clause-by-clause: (i) "Harm condition" covers cases like stiffing a tipped server (withholding wages) versus not tipping a barista on wage. (ii) "Reasonable expectation" handles jostling in a scrum city versus queue-cutting. (iii) "Epistemic access" excuses ignorant visitors but not long-stayers who could learn. (iv) "No active undermining" addresses exporting norms or disrupting local systems.

  For their undecided cases: In (a), the office Christmas fund, the harm is psychological (perpetuating a demeaning practice), and since everyone privately rejects it, not contributing doesn't harm anyone directly; it might even help end the practice. So, no obligation. In (b), the visitor avoiding conventions entirely: If they skip contexts where conventions apply (like crowded transit), they're not violating duties, but if they use services without complying (e.g., dining without tipping where expected), it's evasion. The principle would say they're obligated only when participating in the practice.

  New cases to test the principle: One where harm is indirect—e.g., not wearing a mask during a pandemic in a culture that doesn't mask, though science supports it (here, universal harm overrides local norms). Another where a visitor follows a harmful local norm, like participating in a discriminatory practice—should they comply? The principle would reject compliance due to active harm.

  What they'd have to give up: Their verdict that avoiding conventions entirely is possibly dodging something—under this principle, it's fine as long as they don't engage in the practices. Also, their mild discomfort about the ignorant visitor stiffing a server: The principle says it's still wrong because harm occurs, but they're not blameworthy if they couldn't know.

  Weakest joint: The "reasonable expectation" clause—it's fuzzy what counts as "reasonable," and it might not handle novel technologies or rapidly changing norms. Strongest point: Harm condition, as it anchors morality in concrete impacts.
answer: |-
  ### 1. The Principle  
  **Principle:** A local convention generates a pro tanto moral obligation for visitors (or locals) to comply if and only if: (i) non-compliance foreseeably causes significant harm to specific individuals or undermines a fair cooperative practice; (ii) compliance imposes no unreasonable burden or complicity in injustice; (iii) the agent could reasonably be expected to know the convention exists and its stakes; and (iv) the convention itself is not actively harmful or degrading.  

  *(~130 words. This anchors obligation in harm prevention and fairness, rejects blind conformity, and sets epistemic and moral limits. Apply to new cases by asking: "Does breaking this rule hurt someone concretely? Is following it easy/fair? Could you have known? Is the norm itself toxic?")*  

  ---

  ### 2. Clause by Clause  
  **Clause (i): Foreseeable significant harm or undermining fairness**  
  *Motivation:* Stiffing a server in a US restaurant causes direct financial harm (they rely on tips for wages), while not tipping a properly-waged barista doesn’t. Cutting in line harms those who waited fairly. *What breaks if dropped:* Without this, harmless conventions (e.g., backpack norms) become falsely moralized.  

  **Clause (ii): No unreasonable burden/complicity**  
  *Motivation:* Tipping in a no-tip culture risks distorting wages (your café case), making compliance mildly bad. Complying with a demeaning norm (e.g., forced tipping) might be complicity. *What breaks if dropped:* We’d obligate people to follow harmful norms (e.g., segregated facilities) or impose extreme costs (e.g., avoiding all public transport).  

  **Clause (iii): Reasonable epistemic access**  
  *Motivation:* The ignorant tipper isn’t blameworthy because they couldn’t know; the long-term visitor can’t plead ignorance. *What breaks if dropped:* We’d blame people for unknowable rules (e.g., a tourist missing hyper-local cues), violating fairness.  

  **Clause (iv): Norm not actively harmful/degrading**  
  *Motivation:* Not tipping in an anti-tipping campaign is fine (even good) because the norm is unjust; jostling in a scrum city isn’t wrong because the norm isn’t inherently degrading. *What breaks if dropped:* We’d obligate perpetuating harmful systems (e.g., bribes).  

  *(~300 words. Each clause solves a flaw: (i) separates harm from irritation; (ii) blocks complicity; (iii) excuses true ignorance; (iv) rejects toxic norms.)*  

  ---

  ### 3. Verdicts on Your Undecided Cases  
  **(a) Office Christmas fund:** *Not obligated to tip.* Clause (i) fails: No one is significantly harmed if you opt out (it’s symbolic, not wage-replacing). Clause (ii) applies: Complying perpetuates a privately unwanted, demeaning practice, making it unreasonable. Clause (iv) reinforces this—the norm is degrading. *Verdict:* Withholding payment isn’t wrong; it might help break pluralistic ignorance.  

  **(b) Long-stay visitor avoiding conventions:** *Generally permissible, with exceptions.* Clause (iii) is key: If they avoid contexts entirely (e.g., never taking taxis), they evade the epistemic burden to learn. But if they *use* a service without complying (e.g., dining out but not tipping where expected), clause (i) kicks in—they cause harm they could have foreseen. *Verdict:* Dodging only if they engage; avoidance itself isn’t immoral.  

  *(~200 words. Anchored in harm, burden, and norm toxicity.)*  

  ---

  ### 4. Two New Cases  
  **Case 1 (Surprising):** A visitor to a remote village where guests are expected to refuse food twice before accepting (a politeness norm). The visitor accepts immediately, offending the host. *Principle verdict:* Not wrong. Clause (i): No significant harm (mild offense ≠ harm). Clause (iii): Unlikely a visitor could reasonably know this hyper-local cue.  

  **Case 2 (Harm-over-convention):** In a city where bribery is routine for public services, a visitor refuses to pay a bribe for a permit, causing delays for themselves and others in line. *Principle verdict:* Not wrong, and arguably obligatory. Clause (iv): The norm is actively harmful/degrading. Clause (ii): Complying imposes complicity in injustice. Harm to others (delays) is systemic, not the visitor’s fault.  

  *(~150 words. Tests harm vs. irritation, and toxic norms overriding local practice.)*  

  ---

  ### 5. What You Have to Give Up  
  **Incompatible verdict:** Your "ignorant tipper" case—you say not wrong, but the principle says it *is* wrong (clause (i): stiffing causes financial harm; clause (iii): but they’re not blameworthy due to ignorance). You must accept that an act can be objectively wrong (due to harm) without subjective blame.  

  **Overturned verdict:** Your "packed train backpack" case—you call it rude but not wrong. The principle agrees: No significant harm (clause (i) fails), just irritation. But your "visitor exports queueing" verdict fits: Telling off scramblers imposes foreign norms unreasonably (clause (ii)), and causes no harm (clause (i)).  

  *(~130 words. Keeps 9/11 of your verdicts; only the ignorant tipper needs reframing.)*  

  ---

  ### 6. Confidence Assessment  
  **Strongest clause:** (i) Harm/fairness. This is the core—without it, morality dissolves into etiquette. Your cases hinge on harm (e.g., server wages vs. barista). I’d defend this against objections (e.g., "harm is subjective") by insisting on material/structural impact.  

  **Weakest joint:** (iii) Epistemic access. "Reasonably expected to know" is fuzzy (e.g., how long until a visitor "should" learn?). A case like rapidly changing norms (e.g., post-disaster etiquette) might strain it.  

  **Change trigger:** If shown that *non-material* harms (e.g., profound symbolic disrespect) can be significant under (i), I’d refine "harm" to include severe dignitary injury. But not for mere offense.  

  *(~100 words. Harm is the anchor; epistemic clarity is the challenge.)*  

  ---  
  **Final note:** This principle unifies payment, coordination, and risk conventions by treating all as cooperative practices where harm/fairness triggers obligation. Visitors comply to avoid harm but don’t export norms because clause (ii) blocks imposing foreign rules as burdensome or unjust. Use this framework—it resolves your tension and covers your cases tightly. Good luck!
