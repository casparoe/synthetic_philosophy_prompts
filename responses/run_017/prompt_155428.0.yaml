            - Provision 1: violated (within 100 feet).
            - Provision 2: not violated.
            - Mischief 1: might not be occurring because not blocking entrance.

          Case 3: (mischief covers but text doesn't)
            Vendor 200 feet away, but solicits by blocking and following. 
            - Provision 1: not violated.
            - Provision 2: violated? But Provision 2 says "it is unlawful to solicit customers by blocking their path or following them" -> if they are blocking and following, then it's covered. So text does cover.

          We need a case where the text doesn't cover but the mischief does.

          How about a vendor who is within 100 feet and solicits, but not by blocking or following? For example, by shouting and waving, but not blocking or following. 
            - Provision 1: violated (within 100 feet).
            - Provision 2: not violated (because not blocking or following).
            - Mischief 2: pedestrians might feel harassed by the shouting and waving.

          But the text (Provision 2) doesn't cover shouting and waving. 

          This works.

          Case 4: compromise statute where there is no single purpose to consult? 
            We have two purposes: shop access and harassment. In Case 2 above, we have a violation of Provision 1 but not of the purpose of shop access? And in Case 3 above, we have a violation of the purpose of harassment but not of Provision 2.

          But our cases are for the same statute. 

          Alternatively, Case 4: a vendor who is within 100 feet but in a designated zone that was grandfathered in? And also, he does not block and only passively sells. 
            - Text: Provision 1 violated.
            - Purpose: shop access might not be harmed, but the provision is there.

          This is similar to Case 2.

          Case 5: new technology: a vendor using a robot to deliver goods to customers in the park. The robot does not block entrances and does not harass, but it is not within 100 feet of any shop (it operates in the park) and it doesn't involve blocking or following. But it does solicit by playing loud advertisements.

            - Provision 1: if the robot is within 100 feet of a retail business? Let's say the park is 300 feet from the nearest shop.
            - Provision 2: does a robot solicit by blocking or following? Probably not.
            - Text: no violation.
            - Purpose: Mischief 2 might be triggered if the loud advertisements are harassing.

          But the text doesn't cover this.

     Given the complexity, I will design the five cases as follows for the two-sentence statute:

     Statute: 
        "1. Street vendors may not operate within 100 feet of any retail business entrance.
         2. It is unlawful for a street vendor to solicit customers by blocking their path or following them."

     Cases:

     Case 1: Clear violation of both text and purpose.
        Vendor sets up 50 feet from a retail business entrance and blocks the entrance to that business by placing her stand in front of it. She also follows pedestrians who show interest but then walk away.
          - Provision 1: violated.
          - Provision 2: violated.
          - Purposes: both mischiefs are present.

     Case 2: Text covers but mischief doesn't (for Provision 1).
        Vendor sets up 50 feet from a retail business, but around the corner where there is no entrance and no blocking. He does not block or follow anyone.
          - Provision 1: violated (within 100 feet).
          - Provision 2: not violated.
          - Purpose: Mischief 1 (shop access) is not affected because no entrance is blocked. Mischief 2 not affected.

     Case 3: Mischief covers but text doesn't (for Mischief 2).
        Vendor sets up 200 feet from any retail business. He does not block paths or follow, but he uses a loudspeaker to shout at pedestrians and wave his arms in a threatening manner, causing many to avoid the area.
          - Provision 1: not violated.
          - Provision 2: not violated (because he doesn't block or follow).
          - Purpose: Mischief 2 (harassment) is present.

     Case 4: Compromise (no single purpose) - this might be a case where the two purposes pull in different directions.
        A vendor sets up within 100 feet of a retail business, but in a designated zone that the city set up to concentrate vendors away from the main shopping street. The retail business is a large bookstore that doesn't have an immediate entrance near the vendor. The vendor does not block or follow, but the bookstore owner complains about competition.
          - Provision 1: violated.
          - Provision 2: not violated.
          - Purpose: Mischief 1 might be partially present (competition) but not obstruction. The city's decision to have a designated zone might reflect a compromise.

     Case 5: New technology.
        A vendor uses a drone to deliver flowers to customers in the park. The drone flies around the park to customers who ordered via an app. It does not come within 100 feet of any retail business (the park is far from shops), and it doesn't block or follow pedestrians. However, the drones are noisy and occasionally swoop close to people's heads, causing alarm.
          - Provision 1: not violated.
          - Provision 2: not violated.
          - Purpose: Mischief 2 might be present (harassment by the drones).

     Now, let's formalize.

     Given the time, I'll provide:

     - 6 mischief cards (3 for each of two mischiefs)
     - The enacted text (mangled from one draft of each)
     - 5 case cards
     - Instructions for Phase 1, 2, and 3
     - Timeline
     - Scoring sheet
     - Debrief

     But note: the students in the text-only room might infer the purpose? We'll see.

     Let's start with the materials.

