answer: |-
  Below is a complete, runnable 90-minute session plan for your statutory interpretation exercise. It addresses your goals of having students *build* the problem, delays the textualism/purposivism labels, includes safeguards for your concerns, and provides printable materials.

  ---

  ### **Phase 1: Drafting Statutes (25 minutes)**
  **Instructions to Students (5 min):**  
  *“Split into six committees of three. Each committee gets a ‘mischief card’ describing a problem a city wants to solve. Draft one sentence (max 30 words) for a law to stop this mischief. Write the mischief on the back of the card and seal it in the envelope provided. Focus on clarity and enforceability.”*

  **Mischief Cards (Print one per committee):**  
  *(Assign 3 committees "Mischief A" and 3 "Mischief B" to ensure comparable drafts for mangling)*  

  | **Card** | **Mischief Description** |
  |----------|--------------------------|
  | **A1**   | **Amusement Park Safety:** Children are climbing unstable fences to enter Riverbend Amusement Park after hours, risking injury. The park lacks security. |
  | **A2**   | **Amusement Park Safety:** Unsupervised teens are sneaking into Riverbend Amusement Park at night, damaging rides and getting hurt. |
  | **A3**   | **Amusement Park Safety:** Trespassers are entering Riverbend Amusement Park during closures, leading to accidents and liability lawsuits. |
  | **B1**   | **Public Garden Preservation:** Rare flowers in Oakwood Public Gardens are being stolen by visitors for personal gardens. |
  | **B2**   | **Public Garden Preservation:** Visitors are picking flowers in Oakwood Public Gardens for bouquets, depleting displays. |
  | **B3**   | **Public Garden Preservation:** Tourists are trampling flower beds and taking cuttings in Oakwood Public Gardens, harming biodiversity. |

  **Materials:**  
  - 6 sealed envelopes (for mischief cards).  
  - Timer for 15-minute drafting.  

  **Predictable Issue:** Drafting overruns.  
  **Mitigation:** Announce a hard stop at 15 minutes. Collect cards even if incomplete.  

  ---

  ### **Phase 2: Mangling Statutes (5 minutes)**  
  **Your Actions:**  
  1. Collect all 6 statute drafts.  
  2. Create **one mangled statute** by combining two drafts (one A, one B) and swapping a key word:  
     - *Example:* Swap "enter" (from an A draft) with "remove" (from a B draft).  
     - **Sample Mangled Statute:**  
       *"No person may **remove** any object from Riverbend Amusement Park outside operating hours, or **enter** fenced areas of Oakwood Public Gardens without permission."*  
     *(This creates ambiguity: "remove" now applies to the amusement park, "enter" to the gardens.)*  
  3. Print the mangled statute on cards for Phase 3.  

  **Why This Works:**  
  - Swaps words to decouple text from original purpose.  
  - Creates built-in conflicts (e.g., "remove" in a park context; "enter" in a garden context).  

  ---

  ### **Phase 3: Interpretation Exercise (50 minutes)**  
  **Split Class:**  
  - **Room A (Text-Only):** 9 students. Gets *only* the mangled statute text.  
  - **Room B (Purpose-Plus):** 9 students. Gets the mangled statute *plus* the **unsealed mischief cards** for A and B.  

  **Instructions to Rooms (5 min):**  
  - **Room A:** *“Apply the statute based **only on its words**. Ignore what you think lawmakers intended. Decide whether the law is violated in each case.”*  
  - **Room B:** *“Apply the statute based on **what the law was trying to achieve** (using the mischief cards). Do not let wording stop you from reaching a fair outcome.”*  

  **Case Cards (Print one set per room; 5 cases):**  

  | **Case** | **Scenario** | **Design** |
  |----------|--------------|------------|
  | **1**    | A teen climbs the fence at Riverbend Amusement Park after hours to ride a rollercoaster. | ✅ **Inside text & mischief:** Clearly violates "enter" (gardens text) + amusement park mischief. |
  | **2**    | A botanist picks a rare flower from Oakwood Public Gardens for research during open hours (with permission). | ❌ **Text covers, mischief doesn’t:** "Remove" (park text) applies, but mischief (theft) not present. |
  | **3**    | A child picks a dandelion from Oakwood Public Gardens to give to her mom. | ❌ **Mischief covers, text doesn’t:** Theft mischief applies, but "enter fenced areas" (text) not violated. |
  | **4**    | A drone flies into Riverbend Amusement Park after hours to film a commercial. | ⚖️ **No single purpose:** New tech; mischief A (trespass) applies, but "remove" (text) doesn’t fit. |
  | **5**    | A vendor sells Riverbend souvenirs made from stolen park materials in the gardens. | ⚠️ **Opposed purposes:** "Remove" (text) applies to park, but mischief B (gardens) is irrelevant. |

  **Room Tasks (30 min):**  
  1. Decide "violation" (yes/no) for each case.  
  2. Predict the other room’s outcome for each case (on scoring sheet).  
  3. **Room A only:** Guess the statute’s original purpose (written on back of scoring sheet).  

  **Scoring Sheet (Print one per room):**  
  ```markdown
  | Case | Our Decision (Y/N) | Prediction of Other Room (Y/N) | Points (if match) |
  |------|---------------------|--------------------------------|-------------------|
  | 1    |                     |                                |                   |
  | 2    |                     |                                |                   |
  | 3    |                     |                                |                   |
  | 4    |                     |                                |                   |
  | 5    |                     |                                |                   |
  ```  
  - **Scoring:** 1 point per correct prediction of the other room. *Not* for "right" outcomes.  

  **Predictable Issues & Mitigation:**  
  - **Students "unsee" purpose (Room A):** Have Room A write purpose guesses *before* seeing cases.  
  - **Demand for "correct" answer:** Reframe: *“We’re comparing methods, not correctness.”*  
  - **Dislike outcome vs. method:** Debrief explicitly links outcomes to method (see below).  

  ---

  ### **Timeline (90 Minutes Total)**  
  1. **Phase 1 (25 min):**  
     - 0–5 min: Explain activity, split committees, hand out cards.  
     - 5–20 min: Draft statutes + seal mischief.  
     - 20–25 min: Collect cards.  
  2. **Phase 2 (5 min):**  
     - 25–30 min: Mangle statutes + print.  
  3. **Phase 3 (50 min):**  
     - 30–35 min: Split rooms, give instructions + materials.  
     - 35–65 min: Groups debate cases + fill scoring sheets.  
     - 65–75 min: **Reconvene**, share decisions, tally scores.  
  4. **Debrief (10 min):**  
     - 75–85 min: Discuss tensions (see below).  
     - 85–90 min: Introduce textualism/purposivism terms.  

  **Buffer:** 5 extra minutes for Phase 1 drafting or Phase 3 deliberation.  

  ---

  ### **Debrief Script (10 Minutes)**  
  **Map Moments to Concepts:**  
  1. **Case 2 (Over-inclusion):**  
     - *Room A likely said "violation" (text covers); Room B said "no" (mischief irrelevant).*  
     - **Point:** Textualism risks punishing benign acts; purposivism avoids this but may ignore clear text.  
  2. **Case 3 (Under-inclusion):**  
     - *Room A likely said "no violation" (text doesn’t cover); Room B said "violation" (mischief applies).*  
     - **Point:** Purposivism closes gaps but may stretch wording; textualism upholds predictability.  
  3. **Case 4 (New Technology):**  
     - *Both rooms struggled. Textualists focused on "remove/enter"; purposivists asked if drone causes mischief.*  
     - **Point:** Purposivism adapts to change; textualism demands legislative updates.  
  4. **Case 5 (Opposed Purposes):**  
     - *Room B faced conflicting mischief cards; Room A saw clear "remove" violation.*  
     - **Point:** When purposes clash, textualism offers clarity; purposivism risks judicial subjectivity.  
  5. **Room A’s Purpose Guesses:**  
     - *How close were they to the sealed mischief?*  
     - **Point:** Recovering purpose from text alone is hard → citizen predictability problems.  

  **Final Notes (Last 2 min):**  
  - *“What we’re really debating is: When a statute’s words and purpose clash, **who fixes it?** Legislatures (textualism) or courts (purposivism)? And what can citizens rely on?”*  
  - Introduce terms: **Textualism** (text-only) vs. **Purposivism** (purpose-driven).  

  ---

  ### **What the Exercise CANNOT Reproduce (Supply in Lecture)**  
  1. **Base Rate of Easy Cases:**  
     - 90% of cases are unambiguous; this exercise focuses on the 10% where methods clash.  
     - **Cover in lecture:** Use data from empirical legal studies (e.g., Cass Sunstein).  
  2. **Precedent/Canons:**  
     - Exercise omits stare decisis, substantive canons, or linguistic rules (e.g., ejusdem generis).  
     - **Cover in lecture:** Discuss *Holy Trinity* or *Scalia’s A Matter of Interpretation*.  
  3. **Epistemic Constraints:**  
     - Judges rarely have "pure" legislative history; purposivists often infer intent ambiguously.  
     - **Cover in lecture:** Contrast *Chevron* (agency deference) with textualist critiques.  
  4. **Textualist Disagreements:**  
     - Exercise assumes "fixed meaning," but textualists debate original vs. current usage.  
     - **Cover in lecture:** Use *Bostock* (Gorsuch vs. Alito on "sex" discrimination).  

  **Short Variant?**  
  - Running the exercise twice (e.g., 1950s drone as "remote-controlled toy") could show evolving tech.  
  - **But:** It confuses more than illuminates. Focus this session on building the core tension.  

  ---

  ### **Materials Checklist**  
  - ✅ 6 mischief cards (print 3x A, 3x B).  
  - ✅ 6 sealed envelopes.  
  - ✅ Mangled statute printouts (one per room).  
  - ✅ 5 case cards (one set per room).  
  - ✅ Scoring sheets (one per room).  
  - ✅ Timer.  

  This plan forces students to confront statutory ambiguity *before* labeling methodologies, integrates peer prediction to engage skeptics, and uses concrete scenarios to illuminate theoretical divides. Run it as-is, and adjust mangling/cases based on student drafts.
