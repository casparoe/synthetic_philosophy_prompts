          - Exchange probabilities for one round and update.
          - How to update when the partner might have a different prior? This is very complex. We might not want to get into it. Instead, we can have them exchange for one round and see that they do not end up with the same probability.

     But how should they update? They don't know that the other group has a different prior. We don't tell them that there are different groups. We just say "now pair up as before".

     They might update by assuming the common prior (50-50) is still in effect? Or should we tell them that the other person might have different information about the prior? The theorem assumes common prior, so in this round, the common prior is violated.

     We can instruct: "Update your probability as before, using the same method as in Round 1: treat your partner's reported probability as if it were based on the same prior as yours and one marble, and then combine." But that would be wrong because the prior is different.

     Alternatively, we can have them trade evidence in this round too? Then they would see the same evidence and update using their own prior, so they would still disagree.

     Given time, we can do:

     - In Round 3, they trade evidence (colors) for one round. Then each updates with their own prior and the two signals.

     For a participant from group 1 (prior 70-30) who sees red and is told the partner saw blue:
          P(A | own_red and partner_blue) = (0.7 * 0.6 * 0.4) / [0.7*0.6*0.4 + 0.3*0.4*0.6] = (0.168) / (0.168+0.072)=0.168/0.24=0.7 -> 7

     For a participant from group 2 (prior 50-50) who sees red and is told the partner saw blue:
          P(A | own_red and partner_blue) = 0.5 (as before) -> 5

     So they still disagree.

     This shows that even after trading evidence, if the priors are different, they might not agree.

     Therefore, we can structure as:

     - Round 1: Trade conclusions (common prior) -> they agree.
     - Round 2: Trade evidence (common prior) -> they agree.
     - Round 3: Trade evidence (different priors) -> they don't agree.

     Then reveal that we gave different groups different information about the prior.

     ### Debrief

     - In Rounds 1 and 2, you agreed. This is because you started from the same prior (50-50) and then shared information (either in the form of a probability or in the form of evidence). This is the force of Aumann's agreement theorem.

     - In Round 3, you did not agree, even though you shared evidence. Why? Because the common prior assumption was broken. This is the thin ground: in the real world, we often don't have common priors.

     Also, note that in Round 1, you shared conclusions (probabilities) and that was sufficient to agree. In an idealized Bayesian world, sharing probabilities is as good as sharing evidence. But in practice, when the common prior is broken, sharing evidence might at least let you see what the other person saw, but you still won't agree if you interpret it through a different prior.

     Other points to make:
       - The theorem assumes that the entire structure of the world (the likelihoods) is common knowledge. We provided that on the board.
       - The theorem requires that the posteriors are common knowledge. In our activity, we only did one round of exchange. In the theorem, they exchange until they agree. In our case, one round was enough because the signals were simple.
       - In real life, we often trade conclusions without spelling out our evidence or model, and we might not have common priors, so we can get stuck in disagreement.

     ### What can go wrong

     - Someone anchors and never budges: In Round 1, they might not update properly. To handle this, we can stress that the scoring rule rewards accuracy, so if they don't update, they might lose chips. We can also gently remind them to update based on the new information.

     - Someone meta-games or lies: The scoring rule is designed to make lying unprofitable. We can explain that reporting your true probability is the way to maximize your expected chips.

     - Loud guy dominates: Assign fixed time for each to speak, or use a timer.

     - Someone refuses to play: Have a backup plan (e.g., they can be observers, but encourage participation by emphasizing the fun and learning).

     - Sabotaged subgroup catches on early: Don't reveal that there are different groups until the debrief. When giving instructions, do it privately (e.g., hand out instruction cards).

     ### Parts that the game cannot stage

     - The theorem assumes infinite rounds of exchange or common knowledge of posteriors. In our game, we only did one round. We can mention that in the idealized theorem, they keep exchanging until no one changes their mind, and that in one round with simple signals it was enough, but in more complex situations it might take more rounds.

     - The Bayesian update when seeing a probability in a multi-step setting is very complex and we avoided it by mapping the probability back to a signal. In general, it requires forming a likelihood over what the other person's information might be, which is not always possible.

     - The common knowledge aspect: we did not model the "I know that you know that I know..." explicitly.

     ### Written Exercise

     For newsletter readers, we can provide a written version:

     "Imagine there are two jars: Jar A has 60% red marbles and 40% blue, Jar B has 40% red and 60% blue. A fair coin flip chooses the jar. You and a friend each draw one marble from the jar.

     - If you both share the color you drew, what is the probability you assign to the jar being A? (You should both get the same answer.)
     - If instead you only share your initial probability (based on your marble alone), and then update, do you get the same answer as above?
     - Now imagine you were told (incorrectly) that the coin was weighted to give 70% chance of Jar A, while your friend was told it was fair. After drawing and sharing your colors, would you agree on the probability?"

     This captures the essence.

     Given the complexity, we might need to adjust on the fly. But this should provide a engaging session.
answer: |-
  Here's a refined, practical plan for your 90-minute session, designed to maximize experiential learning while minimizing math. The core idea is to use a jar-guessing game with poker chips for scoring, emphasizing the contrast between sharing **conclusions** (probabilities) and **evidence** (signals), then breaking the common prior.

  ---

  ### **Game Setup**
  **Materials**  
  - 2 jars: Jar A (60% red marbles, 40% blue), Jar B (40% red, 60% blue).  
  - 1 coin (fair, then rigged in Round 3).  
  - Index cards (for signals/probabilities), poker chips (scoring), whiteboard (tracking).  
  - Pre-printed scoring tables (simplified quadratic scoring, 0–10 scale).  

  **Scoring Rule**  
  Use a rounded **quadratic scoring rule** (0–10 scale for probabilities, chips as points):  
  - **If jar is A**: Score = `10 - (10 - reported_prob)^2 / 10` (rounded to nearest integer).  
  - **If jar is B**: Score = `10 - (reported_prob)^2 / 10` (rounded).  
  *Example:* Reporting 7 for A gives `10 - (9)/10 = 9.1 → 9 chips`. Reporting 3 for B gives `10 - 0.9 = 9.1 → 9 chips`.  
  - **Handout**: Simplified table (see below) so no math is needed during play.  

  | Report (0-10) | If A True (Chips) | If B True (Chips) |
  |---------------|-------------------|-------------------|
  | 0             | 0                 | 10                |
  | 5             | 8                 | 8                 |
  | 10            | 10                | 0                 |
  *(Full table in appendix for you; participants get abridged version.)*  

  **Key Mechanics**  
  - Each player draws marbles **with replacement** (signals are independent).  
  - **3 Rounds** (conclusions, evidence, sabotage), 3 exchanges per round.  
  - **Timer**: 3 minutes per exchange (forces finite dialogue).  

  ---

  ### **Session Flow**  
  **0. Intro (5 mins)**  
  - *No jargon, no Aumann name-drop.*  
  - "We’re playing a game: a coin flip picks Jar A or B. Your job is to guess the jar using clues (marble draws). Earn chips by reporting honest probabilities—truthfulness pays!"  
  - Show scoring table: "More chips if you’re accurate and honest. Your goal: maximize chips."  

  **1. Round 1: Trading Conclusions (20 mins)**  
  - **Setup**: Flip fair coin (in secret) to pick jar. Each player:  
    1. Draws 1 marble, writes color on card (private).  
    2. Calculates **initial probability** (e.g., red → 6 for A, blue → 4 for A). *Provide this cheat sheet:*  
       - Red marble: 60% A → Report **6**  
       - Blue marble: 40% A → Report **4**  
  - **Exchange Protocol**:  
    - Pair up (pre-assigned partners).  
    - **Only share current probability number** (e.g., "I say 6"). No sharing signals, reasoning, or past numbers.  
    - After each exchange, update your probability → write new number → trade again (3 exchanges total).  
  - **Payoff**: Final probability locked in.  

  **2. Round 2: Trading Evidence (20 mins)**  
  - **Setup**: New jar (new coin flip, same A/B jars). Each player draws marble, writes initial probability (same as Round 1).  
  - **Exchange Protocol**:  
    - Same pairs.  
    - **Only share raw signal** (e.g., "I saw red"). No probabilities, no interpretations.  
    - After each exchange, update probability → write new number → trade again (3 exchanges).  
  - **Payoff**: Final probability locked in.  

  **3. Round 3: Sabotage the Prior (15 mins)**  
  - **Setup**: Secretly divide group: ⅔ get "Coin is fair (50-50)", ⅓ get "Coin rigged (70% A, 30% B)" (lie—actual coin is fair).  
  - Flip fair coin to pick jar. Each player:  
    - Draws marble.  
    - Calculates initial probability **using their group’s prior**:  
      - *Fair-prior group*: Red → 6, Blue → 4.  
      - *Rigged-prior group*: Red → 8, Blue → 6 *(P(A|red) = (0.7*0.6)/(0.7*0.6 + 0.3*0.4) ≈ 78% → 8)*.  
  - **Exchange Protocol**: Trade conclusions (like Round 1, 3 exchanges).  

  **4. Reveal & Score (10 mins)**  
  - Reveal true jar for each round.  
  - Players calculate chips using scoring table.  
  - *Whiteboard*: Record convergence rates (pairs with same final probability) for each round.  

  **5. Debrief (20 mins)**  
  - **Map the Activity to Aumann’s Theorem**:  
    | **Activity Moment**       | **Aumann Concept**                  |  
    |---------------------------|-------------------------------------|  
    | Round 1 convergence       | Common prior + shared posteriors → agreement |  
    | Round 2 convergence       | Shared evidence → common knowledge |  
    | Round 3 disagreement      | Broken common prior → no agreement |  
    | Finite exchanges          | Real-world ≠ infinite dialogue      |  
    | "Loud guy" dominating     | Common knowledge requires symmetric access |  
  - **Key Insights**:  
    - "In Round 1, you shared **conclusions**—but conclusions bundle *assumptions* (like priors). If priors mismatch (Round 3), you can’t agree."  
    - "In Round 2, you shared **evidence**—raw data everyone can interpret. This creates common ground."  
    - "Aumann assumes: (1) Common priors, (2) Honesty, (3) Common knowledge of posteriors. Real arguments often fail all three."  
  - **Name Drop**: "This is Aumann’s agreement theorem—and you just exposed its limits."  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Anchoring/never budging**:  
     - *Likely*: Proudly innumerate players stick to initial guess.  
     - *Fix*: Remind mid-game: "Remember, chips reward accuracy—updating earns more than stubbornness."  

  2. **Meta-gaming/lying**:  
     - *Likely*: Political arguers "test" the system.  
     - *Fix*: Pre-empt: "The scoring rule mathematically forces honesty—lying costs you chips."  

  3. **Dominating partner**:  
     - *Likely*: Loud players steamroll exchanges.  
     - *Fix*: "Each partner gets 60 seconds to speak per exchange—use the timer."  

  4. **Sabotage group catches on**:  
     - *Likely*: Suspicion when priors feel off.  
     - *Fix*: Isolate groups during instructions; use coded cards ("Group 1: Fair coin. Group 2: Rigged coin").  

  5. **Refusal to play**:  
     - *Fix*: Assign as "observers" who track disagreements, but incentivize: "Observers get median chips if they summarize a conflict."  

  ---

  ### **Limitations of the Activity**  
  - **Common Knowledge**: The game can’t simulate "I know you know I know..." (requires infinite recursion). *Debrief*: "Aumann assumes posteriors are common knowledge—but in 3 exchanges, you only get 3 levels of 'I know'."  
  - **Bayesian Updating**: Players use cheat sheets, not real math. *Debrief*: "We simplified updates—real Bayesians model likelihoods rigorously."  
  - **Continuous Probabilities**: Discrete 0–10 scale avoids calculus but loses nuance.  

  ---

  ### **Newsletter Adaptation**  
  For readers:  
  > *"Grab a friend. Flip a coin to pick Jar A (60% red) or B (40% red). Each draw a marble: red = 60% likely A, blue = 40%. Now:  
  > 1. Trade probability guesses (e.g., "I’m 60% sure it’s A") 3 times. Do you agree?  
  > 2. Repeat, but trade colors (e.g., "I drew red"). Now do you agree?  
  > 3. Next, one assumes a 50-50 prior; the other assumes 70-30 for A. Trade guesses. Agreement now?  
  > This is Aumann in action—common priors force agreement; broken priors breed endless debate."*  

  ---

  **Why This Works**  
  - **Hands-on**: Lets players *feel* convergence/divergence.  
  - **Low Math**: Cheat sheets and scoring tables avoid calculation.  
  - **Twists Highlight Assumptions**: Evidence-vs-conclusions and sabotage make Aumann’s limits visceral.  
  - **No Lecturing**: Discovery-driven—they "walk into" the theorem.  

  **Appendices**  
  - Full scoring table (for you).  
  - Step-by-step facilitator script (DM for details).  

  This plan balances playability with conceptual depth, turning abstract theory into lived experience. Test the scoring with a colleague first to smooth wrinkles!
