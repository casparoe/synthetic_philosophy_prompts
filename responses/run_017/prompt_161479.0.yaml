answer: |-
  ## The Gathering

  The crowd grows large, their voices start to blend.
  **Each mind more right than wrong, a steady light.**
  They seek the truth, on which all things depend.

  Though each alone sees just around the bend,
  Fifty-one times in hundred, clear, not bright,
  The crowd grows large, their voices start to blend.

  From many guesses, wisdom can ascend.
  The chance of error fades beyond the night.
  **Each mind more right than wrong, a steady light.**

  On thin ice near the edge of even chance,
  Where doubt could tip the scales from wrong to right,
  The crowd grows large, their voices start to blend.

  But whispers spread, a shared, beguiling glance;
  They hear the first, see who stands tall and white.
  **Each mind more right than wrong, a steady light.**

  Now hundreds gather, yet there is no gain,
  A single signal holds them all in thrall.
  The crowd grows large, their voices start to blend,
  **Each mind more right than wrong, a steady light,**
  **And each must think alone, or wisdom falls.**

  ---

  **Refrains:** "Each mind more right than wrong" signifies individual competence >0.5; "And each must think alone" signifies independence. **Collapse:** The volta begins at "But whispers spread..." (line 13), where shared information destroys independence, rendering the growing crowd ineffective despite competence.
