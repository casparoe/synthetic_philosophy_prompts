prompt: |-
  I'm a journalist covering science and ideas, and I keep getting handed the same story: some city or country has handed a real decision to a randomly selected citizens' body, and the piece basically writes itself — sortition is hot again. Before I write another one, I want the spec, because I notice every article I read ends up resting on one unexamined requirement ("it's representative!", "it's deliberation!", "juries work, don't they?"). So: what would a randomly selected political body have to actually deliver to count as an improvement on an elected one — good enough, specifically, to justify giving it real power over legislation rather than a purely advisory role? Give me the requirements list with the case or consideration behind each: the cases it has to handle (who draws the pool in the first place, and the regress that invites; what happens when the sample is unrepresentative because the people who most need to be there are the ones who decline; what a body does when an intense minority is right and a deliberative majority is wrong), the distinctions it isn't allowed to collapse (descriptive vs. substantive representation; impartiality that comes from randomness vs. competence that comes from something else; legitimacy-by-procedure vs. legitimacy-by-outcomes; representing the people vs. being a sample of them; sortition as selection vs. sortition as decision rule), and the social-science findings it can't contradict — small-group deliberation dynamics, what stratification does and doesn't fix, the fact that a body with no formal link to a decision-maker tends to get ignored (I've been told the Irish assemblies and the French climate convention are the exhibits here; tell me if those are the wrong exhibits).

  Then I want the meta-part, which is the part I'd actually build the piece around: mark which requirements are non-negotiable and which are really commitments of one camp dressed up as criteria — "must mirror the population demographically" strikes me as the latter, as does "must beat elections on getting the right answer." And tell me which subset is jointly unsatisfiable, if any. My hunch is there's a three-way squeeze: you want the body small enough that people actually deliberate rather than perform, large and stratified enough to be descriptively representative on several axes at once, and drawn from volunteers because compelling service is politically dead on arrival — and no design gets all three. Say whether that's the real tension or whether I've picked the wrong three horns.

  Some context so the list isn't abstract: the occasion for all this is a proposal somebody described to me at a conference that I've been calling the "sortition veto" in my notes — 250 people drawn by stratified lot, one-year non-renewable terms, paid roughly the median wage, each given access to two rival "advocate" teams hired to argue the case both ways, and its only power is to send a piece of legislation back once with a public statement the government must answer within six months. Assume, for the sake of argument, that a (made-up) meta-analysis found minipublics move participants toward the expert consensus about two-thirds of the time but that the downstream effect on actual policy is near zero unless the body has some formal trigger it can pull. Judge that design against your list and tell me where it fails. Also — and this is the thing I keep tripping over — is randomness doing the moral work here (everyone has an equal chance, so no one is subordinated) or is it just doing anti-corruption work (no one can buy a seat in advance)? Those seem like very different justifications and I suspect half the people I quote are using one while thinking of the other. Optional and brief: a scorecard of the three or four main versions on offer — full replacement "lottocracy", a sortition chamber with only delay-and-answer powers, sortition for agenda-setting only, and the one-random-voter-per-district enfranchisement lottery idea — but keep the weight on the criteria, I can do the scoring myself. Sorry this is long, my editor says I do this.
reasoning: |-
  Okay, let me try to unpack this journalist's complex query about sortition. They're clearly frustrated with superficial coverage and want a rigorous framework to evaluate citizen assemblies. 

  First, I notice they're asking for three layered things: concrete requirements for legitimate sortition bodies (handling real cases), meta-analysis of which requirements are essential vs. debatable, and application to their "sortition veto" proposal. The subtext is they suspect most justifications are either naive or contradictory.

  Hmm... the core tension they identified - small size vs. representativeness vs. voluntary participation - feels right. But I should verify with social science: stratified sampling helps but can't solve the "missing voices" problem when marginalized groups opt out. And deliberation quality does crater in groups larger than 150-ish. 

  For the requirements list, I'll structure it by:
  - Foundational cases (like sampling regress and intense minorities)
  - Critical distinctions (e.g., descriptive vs substantive representation)
  - Non-negotiable empirical constraints (e.g., deliberation dynamics)

  The meta-part is trickier. "Must mirror demographics" is indeed contingent - it assumes identity politics. But "must have formal power" seems non-negotiable given the Irish/French evidence. I'll flag which requirements conflict irreconcilably.

  On their veto proposal: the 250 size worries me - that's too big for genuine deliberation. And paid median wage? That excludes caregivers and gig workers. But the advocate teams are smart - they mitigate competence gaps. 

  Biggest insight: randomness serves two distinct masters - equality (moral) vs anti-corruption (practical). Most advocates conflate them. I'll clarify that dichotomy since it's central to their piece.

  For the scorecard, I'll contrast lottocracy vs advisory bodies vs agenda-setting models briefly, but stay focused on criteria as requested. The Irish case shows even "successful" assemblies get ignored without teeth.
answer: |-
  Here’s the spec you need – a rigorous requirements list for evaluating sortition bodies, the meta-analysis of tensions, and a judgment of the "sortition veto" proposal. This cuts through the common tropes to the core trade-offs.

  ### I. Core Requirements & Justifications (The "Must-Haves" and "Must-Considers")
  *(Non-negotiables in **bold**; contingent/debatable in *italics*)*

  1.  **Formal, Binding Power (Non-Negotiable):** Must have *at least* delay/answer/veto power (not merely advisory). **Case:** Irish assemblies (abortion, climate) & French Climate Convention demonstrated near-zero policy impact without formal triggers. *Social Science:* "Consultative" bodies are easily ignored by elected officials; legitimacy requires reciprocal obligation.

  2.  **Competence Safeguards (Non-Negotiable):** Structures enabling informed judgment. **Cases:** Complex legislation (e.g., bioethics, AI regulation) requires access to balanced expertise, time for learning, and facilitated deliberation. *Social Science:* Small groups without resources default to heuristics, dominance by the confident-but-wrong, or polarization. Advocate teams (as in the veto proposal) are a strong mitigation.

  3.  **Resilience Against Systemic Exclusion (Non-Negotiable):** Addresses who is *de facto* missing. **Cases:** Stratification fails if marginalized groups (e.g., precariat, disabled caregivers, distrustful minorities) systematically decline participation due to burden/distrust. **Distinction:** Descriptive representation (mirroring demographics) vs. *substantive* representation (advancing interests of the excluded). *Social Science:* Stratification fixes *known* biases but not *unknown* or *participation* biases. Compulsion solves this but is politically toxic ("regress" problem: who sets compulsion rules?).

  4.  **Deliberative Sufficiency (Non-Negotiable):** Size and process enabling genuine exchange, not performative speech. **Case:** Bodies too large (>150-200) become plenaries dominated by factions; too small (<50) lack diversity and legitimacy. *Social Science:* Effective deliberation requires small-group breakout sessions, skilled facilitation, and protected time for reflection – incompatible with massive assemblies.

  5.  **Legitimacy via Process & Outcome (Tension):** Must be *perceived* as fair *and* produce decisions seen as reasonable/effective. **Distinctions:** Legitimacy-by-procedure (randomness = fairness) vs. legitimacy-by-outcomes ("did they get it right?"). *Social Science:* Legitimacy is hybrid. Pure proceduralism ("randomness = fair") falters if outcomes are disastrous. Pure outcome-dependence ("must beat experts") is unrealistic and collapses distinction from technocracy.

  6.  *Descriptive Representativeness (Contingent):* Mirroring key demographics *to the extent feasible* given participation constraints. **Distinction:** Being a "sample" (statistical proxy) vs. "representing" (acting as agents). *Case:* A body unrepresentative on class due to low participation by the working poor lacks legitimacy *for those groups*, even if statistically "accurate" for participants. *Consideration:* Often a *symbolic* demand for inclusion, not a strict requirement for good decisions. Stratification is the tool, but see Requirement 3.

  7.  **Conflict Resolution Mechanism (Non-Negotiable):** Handles intense minorities and deliberative failure. **Case:** When a small group holds crucial expertise/experience or moral insight the majority initially misses (e.g., disability rights in welfare reform). *Social Science:* Deliberation can suppress minority views; consensus norms can mask coercion. Requires supermajority rules, minority veto points, or robust dissent recording.

  8.  **Anti-Corruption & Equal Opportunity (Non-Negotiable):** Random selection prevents pre-bribery and ensures *ex ante* equality of access. **Distinction:** This is primarily *practical* (reducing corruption) and *procedurally moral* (equal chance), **not** a guarantee of substantive moral outcomes or competence.

  ### II. The Meta-Part: Tensions, Non-Negotiables, and Your Hunch

  *   **Non-Negotiables:** Formal Power, Competence Safeguards, Resilience Against Exclusion, Deliberative Sufficiency, Conflict Resolution, Anti-Corruption/Equal Access.
  *   **Contingent/Debatable:** *Descriptive Representativeness* (symbolic vs. functional), *Outcome Supremacy* ("must beat elections/experts" – often a strawman), *Pure Randomness as Moral Justification* (it enables equality of access but doesn't guarantee moral outcomes).

  *   **The Core Tension (Your Hunch is Correct, Mostly):**
      *   **A. Small Size:** Needed for effective deliberation (Requirement 4). ~12-150 people.
      *   **B. Descriptive Representativeness:** Needed for legitimacy, especially on multiple axes (Requirement 6). Requires stratification and *large initial pools*.
      *   **C. Voluntary Participation:** Needed for feasibility and avoiding compulsion regress (Requirement 3). Reduces participation rates, especially among burdened groups.
      *   **The Squeeze:** **A** (small) and **B** (representative) conflict directly – representing many groups in a small body requires trade-offs. **C** (voluntary) undermines **B** (representative) by skewing participation. **A** (small) *can* work with **C** (voluntary) via stratification, but **B** (representative) suffers if key groups opt out. **No design perfectly satisfies A, B, and C simultaneously.** Compulsion solves B but kills political feasibility (C). Large sizes kill A.

  *   **The *Real* Tension:** It's **Legitimacy vs. Functionality**. Descriptive representativeness (B) and voluntary participation (C) are primarily *legitimacy* demands. Small size (A) and competence (Requirement 2) are *functionality* demands. Formal power (Requirement 1) requires *both* legitimacy and functionality. **The hardest trade-off is between maximizing legitimacy (often demanding larger/more representative bodies) and maximizing functionality (requiring smaller, more workable bodies with resources).** Your three horns are a key manifestation of this.

  ### III. Judging the "Sortition Veto" Proposal (250 people, stratified, paid median wage, advocates, delay/answer power)

  *   **Strengths:**
      *   **Formal Power (+):** Delay/answer power is significant (Requirement 1). Addresses the Irish/French weakness.
      *   **Competence Safeguards (+):** Rival advocate teams are a strong solution (Requirement 2). Pay addresses participation barrier for many.
      *   **Anti-Corruption/Equal Access (+):** Random selection core (Requirement 8).
      *   **Conflict Resolution (?):** Public statement *could* highlight minority views, depends on rules (Requirement 7).

  *   **Weaknesses/Failures:**
      *   **Size/Deliberative Sufficiency (--):** 250 is far too large for genuine deliberation (Requirement 4). Likely descends into factionalism, performative speeches, or passive listening. Breakout groups help, but plenaries of 250 are unwieldy. *Major flaw.*
      *   **Resilience Against Systemic Exclusion (-):** Median wage pay *excludes* primary caregivers (often women), gig workers unable to leave for a year, those with unstable housing/care needs. Voluntary participation ensures these groups are underrepresented (Requirement 3). Stratification can't fix this.
      *   **Descriptive Representativeness (-):** Due to above exclusion, likely fails on key axes (Requirement 6 - though contingent, legitimacy suffers).
      *   **Legitimacy-Outcome Tension (?):** Depends on the quality of the statements. "Moving participants toward expert consensus 2/3 of the time" is positive, but public may demand more (Requirement 5).

  *   **Verdict:** Fails primarily on **Deliberative Sufficiency** (size) and **Resilience Against Systemic Exclusion** (payment model + voluntarism). The core power and competence structures are good, but the body is too big to function well and the pay model excludes crucial voices. Paying *significantly above* median wage + offering wraparound support (care, housing) is needed to approach inclusivity. Size needs radical reduction (~100 max, ideally 50-80).

  ### IV. Randomness: Moral vs. Anti-Corruption Work

  *   **Anti-Corruption (Primary, Clear):** Random selection makes it impossible to buy, inherit, or campaign for a seat. This is its strongest, least controversial justification. It attacks a core pathology of elections.
  *   **Moral (Secondary, Contested):** The "equal chance" argument (*ex ante* equality) has moral weight, emphasizing no inherent superiority. However, it **does not guarantee**: equal voice *within* the body (Requirement 7 issue), substantive equality of outcome, or that the *outcome* is morally just. Critics argue it can legitimize majority tyranny over minorities. Its moral force is procedural fairness in selection, not inherent justice in results.

  ### V. Brief Scorecard: Common Models vs. Key Requirements

  1.  **Full Lottocracy (Replace Legislature):**
      *   *+*: Formal Power, Anti-Corruption, Equal Access (ex ante).
      *   *--*: Competence (massive scale challenge), Deliberative Sufficiency (impossible at scale), Resilience/Representativeness (participation skew), Legitimacy (huge leap, outcome risk).
      *   *Fails:* Competence, Deliberative Sufficiency (fatally).

  2.  **Sortition Chamber (Delay/Answer Veto - like your proposal):**
      *   *+*: Formal Power (if strong), Anti-Corruption, Equal Access (ex ante), can design Competence safeguards.
      *   *--*: Tension between Size (for deliberation) vs. Representativeness/Legitimacy. Resilience against exclusion hard.
      *   *Viable?* Yes, *if* size kept manageable (~100) and massive support for inclusion.

  3.  **Sortition Agenda-Setting:**
      *   *+*: Can be smaller, focused. Anti-Corruption. Good for Competence on defined topic.
      *   *--*: Lack of Formal Power (Requirement 1 - easily ignored). Resilience/Representativeness still an issue.
      *   *Viable?* Useful but limited impact without power (see Ireland/France).

  4.  **Enfranchisement Lottery (1 random voter/district):**
      *   *+*: Anti-Corruption, Equal Access (ex ante), theoretically simple.
      *   *--*: **No Deliberation** (isolated individuals), **No Competence** support, **No Resilience/Representativeness** (single person can't represent), **No Conflict Resolution**. Randomness as *decision rule*, not just selection.
      *   *Fails:* Competence, Deliberative Sufficiency, Representativeness, Conflict Resolution (fatally flawed).

  **The Takeaway for Your Piece:** Sortition's appeal is real (anti-corruption, access), but its hype often ignores the iron triangle of **Small Size, Representativeness, and Voluntary Participation**. Power without deliberation is dangerous; deliberation without representativeness lacks legitimacy; achieving both requires confronting who gets excluded even by fair procedures. The "sortition veto" proposal nails the power and competence parts but stumbles on size and exclusion. Randomness fights corruption brilliantly, but its moral claim of equality stops at the chamber door. The real story isn't "sortition is hot," it's "sortition is hard – here's why most designs fail the real test."
