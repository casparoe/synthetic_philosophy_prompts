prompt: |-
  I have been trying to get clearer about the explanatory reach of David Lewis's account of convention, and I want to test it against a case that looks, on the surface, like a textbook instance of it: Sweden's *Dagen H*, the switch from left-hand to right-hand road traffic. I'd like an analysis that runs in both directions — the theory illuminating the episode, and the episode telling us something about the theory.

  The facts I'm working from, so that nothing here turns on your being able to look them up: more than ninety percent of Swedish cars were left-hand-drive while the country drove on the left; Norway and Finland, its land neighbours, drove on the right, with millions of vehicle crossings a year; in a 1955 referendum eighty-three percent of Swedes voted to keep driving on the left; the Riksdag legislated the change in May 1963 anyway; and on Sunday 3 September 1967 all non-essential traffic was banned from 01:00 to 06:00, the vehicles that were on the road had to come to a halt at 04:50, move over to the right-hand side, and set off again at 05:00, behind a four-year public information campaign and roughly 350,000 replaced road signs. Accidents and insurance claims dropped sharply in the first weeks, then drifted back to something like the pre-change baseline within about two years. The railways and the Stockholm metro simply carried on running on the left.

  Here is how I understand the Lewisian machinery — a regularity in behaviour, in a recurrent situation, within a population, where almost everyone conforms, almost everyone expects almost everyone else to conform, and that expectation is itself part of each person's reason for conforming, the whole thing being common knowledge; and where the regularity is arbitrary in the sense that a different coordination equilibrium could equally well have been the one that got selected. Correct me if I've garbled that, but don't give me textual exegesis; I want the apparatus applied.

  So, first the mapping, done carefully rather than loosely. Who exactly is the population and what is the recurrent situation — a single driver approaching a single oncoming car, or a whole national traffic system, or something at both levels at once? What are the options and the payoffs, and is this genuinely a pure coordination problem with coincident preferences, or is there a distributional residue that Lewis's definition struggles to accommodate: the owners of left-hand-drive cars against the bus companies with their right-hand-drive fleets, the motorists who had to buy new headlamps, the cities that had to rebuild bus stops and intersections, the tram systems that were simply scrapped and replaced with buses? And if Swedish cars were mostly built for right-hand traffic, then the two equilibria were not equally good — so is the arbitrariness condition violated, or does Lewis's framework already allow for conventions stuck at an inferior equilibrium, with the interesting question being why nobody could get there one driver at a time?

  Second, where the theory speaks and where it is silent. It should predict stability-by-expectation and lock-in, and it does predict that no individual gains by deviating alone. But say what you think it cannot say about the transition: Lewis's account is an equilibrium account, and the hard problem here is getting from one equilibrium to another when every unilateral move is catastrophic. I have two speculative suggestions I want you to take seriously enough to tell me whether they are worth anything. The first is that the state's dated declaration functioned less as a command than as a public correlating signal that manufactured the common knowledge Lewis needs — and that it worked only because it was backed by a prior, second-order convention of deferring to the state on traffic rules; on that reading a convention can be bootstrapped by authority in a way that Lewis's talk of precedent and salience does not really cover. Test this against the obvious probe: if the Riksdag had fixed the date but the announcement had reached, say, four drivers in five, with nobody able to tell which ones, what does the theory predict, and is that the right prediction? The second is a distinction I want to propose between conventions sustained by expectations about what others will do and regularities sustained by what I'd call material sediment — road markings, bus doors, headlamp beams, intersection geometry — which make nonconformity physically awkward rather than merely unreciprocated. After 1967 a good deal of the regularity was built into the hardware. Does that mean the post-change regularity was a convention at all in Lewis's sense, or something else that merely looks like one, and does the same worry reach the continuing left-hand traffic of Britain and Japan?

  Third, the verdict. Having done the mapping, tell me whether Dagen H is a confirmation of Lewis, an anomaly for him, or a case his theory was never designed to describe. I'm especially interested in whether it should count against the broader evolutionary story about norms — path dependence, basins of attraction, the difficulty of escaping an equilibrium without a shock — that one of the largest convention changes on record was achieved by deliberate, centrally planned, one-morning fiat rather than by anything resembling bottom-up evolution, and whether the 1955 referendum result is best read as evidence about what people wanted, about what they expected others to do, or about neither.

  Please argue to a conclusion, say plainly which parts of the episode your theory cannot model, and don't pad the answer with general exposition of Lewis that isn't doing work in the analysis.
reasoning: |-
  Okay, the user is diving deep into David Lewis's convention theory using Sweden's Dagen H as a case study. They want a rigorous application of Lewis's framework to this historical event, testing both its strengths and limitations. 

  First impression: This is a highly sophisticated query from someone clearly well-versed in philosophy of language/social science. The level of specificity suggests they're either an academic or a very dedicated autodidact. Their frustration with superficial Lewis exegesis is palpable - they want theory doing real analytical work.

  Breaking down their asks:
  They want 1) meticulous mapping of Lewisian concepts onto Dagen H, 2) identification of where the theory falls short, 3) evaluation of their two hypotheses about state-as-correlating-device and material sediment, and 4) a final verdict on whether this confirms or challenges Lewis.

  The tricky parts:
  The population question is thorny - is it individual drivers or the nation-state? Lewis's coordination games typically involve small-scale interactions, but here the "recurrent situation" spans everything from two cars meeting to cross-border trucking. 

  The arbitrariness condition seems violated too - with 90% LHD cars, right-hand driving wasn't equally optimal. But Lewis does allow for inefficient equilibria persisting, which explains why Sweden didn't organically switch despite the inefficiency.

  On their two hypotheses:
  The state-as-correlating-device idea feels spot-on. Lewis's salience relies on psychological prominence, but here the government created artificial salience through legislation and countdown. That referendum probe is sharp - if only 80% knew the date, coordination would've collapsed, proving the common knowledge requirement.

  The material sediment point is brilliant. Post-change, the physical infrastructure (road signs, bus doors) enforced conformity more than expectations did. This might mean the convention partially transformed into something else - a hybrid between social convention and physical constraint. Britain/Japan remain pure conventions because their infrastructure still matches left-side driving.

  Biggest theoretical gap: Lewis has no tools for describing deliberate equilibrium transitions. Dagen H was a meteor strike on the old convention, not an evolutionary shift. The referendum is fascinating - it measured preference (83% wanted status quo) but not expectations (they might've expected change anyway). Shows how preference ≠ expectation in coordination games.

  Final verdict: This isn't an anomaly for Lewis but a stress test revealing where his model needs supplements (state power, materiality) to handle large-scale institutional change. The evolutionary story survives because the state intervention essentially created conditions for a new coordination equilibrium to emerge instantly.
answer: |-
  Your analysis of Dagen H is a powerful stress test for Lewis's convention theory. Let's apply the framework rigorously, identify its limits, and evaluate your hypotheses:

  ### **Mapping Lewis to Dagen H**
  1.  **Population & Recurrent Situation:**
      *   **Primary:** Individual drivers in pairwise interactions (e.g., approaching an oncoming car, merging). *This* is the atomic coordination problem Lewis's definition targets.
      *   **Secondary:** The national traffic system. This is an *aggregate* of countless primary interactions, plus supporting infrastructure/institutions. Lewis's core theory doesn't directly model this macro-level as a single convention.

  2.  **Options, Payoffs & Arbitrariness:**
      *   **Options:** Drive Left (L) or Drive Right (R) in pairwise encounters.
      *   **Payoffs (Pre-1967):** Mutual coordination (L,L or R,R) >> Miscoordination (L,R or R,L). *But crucially, the payoffs were **not symmetric**:*
          *   **L,L:** Coordination achieved, but suboptimal for most drivers (90% LHD cars in a LHD-driving country = poor visibility for overtaking/oncoming traffic).
          *   **R,R:** Coordination achieved *and* optimal for most drivers (LHD cars in RHD traffic = better visibility).
      *   **Arbitrariness Violated?** Yes, substantially. R,R was Pareto-superior to L,L due to vehicle fleet composition. Lewis *does* allow conventions to be stuck at inferior equilibria (as Sweden was pre-1967). The arbitrariness condition is best understood as "multiple coordination equilibria exist," not "they are equally good." Sweden proves an inferior convention *can* persist.

  3.  **Distributional Conflict:** Lewis assumes pure coordination (coincident interests). Dagen H reveals a **critical limitation**:
      *   While all drivers preferred *some* coordination over miscoordination, they did *not* have coincident preferences over *which* equilibrium.
      *   Groups bearing high transition costs (LHD car owners pre-change, bus/tram operators, cities) rationally preferred the status quo (L,L) despite its inefficiency. The *choice* between equilibria had distributional consequences. Lewis's core model struggles with this.

  ### **Where the Theory Speaks and is Silent**
  *   **Speaks:** Perfectly explains pre- and post-change *stability*. Pre-1967: Everyone drove L, expected others to drive L, and this expectation was the reason to drive L (despite the inferiority). Post-1967: Same for R,R. Individual deviation was catastrophic.
  *   **Silent (Crucially) on Transition:** Lewis focuses on equilibrium states. He offers no mechanism for *coordinated mass switching* between equilibria when unilateral action is disastrous. This is the core puzzle of Dagen H.

  **Evaluating Your Hypotheses:**
  1.  **State as Correlating Device / Second-Order Convention:**
      *   **Strong Support:** This is essential. The Riksdag's decree and the fixed date (Dagen H) provided a **focal point** (Lewis's salience) on an unprecedented scale. It created common knowledge *not* just that a change was coming, but *exactly when* it would happen, allowing everyone to condition their expectations simultaneously.
      *   **Second-Order Convention?** Yes. The prior convention to obey state traffic rules (even unpopular ones) was vital. The decree wasn't *just* a command; it was a **common knowledge-generating signal** enabling synchronized expectations shift.
      *   **The Probe Test:** If only 80% received the date, chaos ensues. Drivers wouldn't know if others knew. Pre-05:00 on Dagen H, drivers would *still* expect others to drive L. Post-05:00, uncertainty reigns: "Do others know it's time? Do they know I know?" Mass miscoordination (some L, some R) is highly likely. Lewis predicts failure without common knowledge – **correctly**. The state's effectiveness relied on near-universal signal reception.

  2.  **Material Sediment vs. Expectation:**
      *   **Valid Distinction:** Post-change, the regularity wasn't sustained *solely* by expectations. Physical infrastructure (road markings, signs, redesigned intersections, bus doors) made driving on the right **physically easier/safer** and deviating difficult/dangerous. This "sediment" *reinforced* the convention.
      *   **Is it Still a Convention?** **Yes, but hybridized.** Expectations remain fundamental (you expect oncoming traffic on the right). However, the material infrastructure:
          *   Reduces the cognitive/expectational load.
          *   Makes deviation *physically* costly, not just via failed coordination.
      *   **Britain/Japan:** These are **purer Lewisian conventions.** The physical infrastructure *matches and reinforces* the convention (LHD/RHD cars, road layouts), but expectations remain the primary enforcer. Deviation is still *possible* (though illegal and dangerous) without immediate physical obstruction in every instance. The "sediment" aligns with the convention but doesn't render expectations obsolete.

  ### **Verdict: Confirmation Stressing Limits & Revealing Nuances**
  Dagen H is **not an anomaly** for Lewis, but a **boundary case** that:
  1.  **Confirms Core Equilibrium Logic:** Stability pre/post, dependence on mutual expectations, disaster of unilateral deviation.
  2.  **Exposes Key Limits:**
      *   **Transition Mechanism:** Lewis offers no model for deliberate, synchronized mass equilibrium shifts. State fiat + common knowledge signal fills this gap, leveraging a second-order convention of deference.
      *   **Distributional Conflict:** The theory struggles when preferences over *which* equilibrium differ significantly due to transition costs or inherent asymmetries (like car fleet composition).
      *   **Material Reinforcement:** Post-convention, infrastructure can partially supplant expectations as the enforcement mechanism, creating a hybrid.
  3.  **Evolutionary Story:** It **does not refute** path dependence or basin-of-attraction concepts. It demonstrates that escaping a deep, inefficient equilibrium often requires **exogenous intervention** (the "shock" – legislative fiat + massive public campaign) to orchestrate the jump. Bottom-up evolution was impossible here; the state provided the necessary coordination mechanism.
  4.  **The 1955 Referendum:** It primarily reveals **preference** (83% preferred the *status quo*) and likely reflected **perceived transition costs/fear of chaos**. It does *not* directly measure their **expectations** about what others *would* do. They could rationally prefer L,L *and* expect that L,L would continue, *even while knowing R,R would be collectively better*. The vote signals the strength of the status quo bias and the perceived costs/hurdles of transition, not necessarily a failure to understand the collective benefit of R,R.

  ### **Conclusion: Theory Illuminated, Episode Revealing**
  *   **Lewis's Theory Explains:** Pre/post stability as coordination equilibria sustained by self-fulfilling expectations. The persistence of an inferior equilibrium (pre-1967). The necessity of common knowledge for coordinated action.
  *   **Lewis's Theory Cannot Explain:** The *transition mechanism* itself. The role of *asymmetric costs/distributional conflict* in preference formation over equilibria. The *hybrid nature* of conventions reinforced by material infrastructure post-establishment.
  *   **Dagen H Reveals:** The critical role of an **authoritative, common-knowledge-generating agent** (the state) in overcoming coordination traps and enabling synchronized shifts between deeply entrenched conventions. It highlights how **material infrastructure** can later ossify and enforce conventions beyond pure expectations. It underscores that **preferences over equilibria can be conflicted** due to transition costs, even when one equilibrium is Pareto-superior.

  Dagen H confirms Lewis's core insights about the nature of convention *as an equilibrium state* but powerfully demonstrates that large-scale convention change often requires mechanisms (like state authority) and confronts complexities (distribution, materiality) beyond his basic model's scope. It's a case his theory was designed to describe the *endpoints* of, but not the *journey* between them.
