prompt: |-
  ok so I need help settling an argument I had with my friend Mara last night that went on way too long. It started because she repeated the "you only use 10% of your brain" thing for the hundredth time and I said something snarky about how the most successful ideas aren't the true ones, and three drinks later we were still going.

  Here's where we got stuck. Mara is into meme theory in the old, pre-internet sense: ideas as replicators. A cultural item is a thing that gets copied, the copies vary, some variants are better at getting themselves copied than others, and the ones that spread are the ones that are good at spreading — not the ones that are true, or useful, or good for the people carrying them. I pushed back with a different picture: transmission isn't copying at all, it's rebuilding. When you pass an idea on you don't hand over a file, you reconstruct it from what you remember plus what makes sense to you, and that reconstruction is systematically biased toward what's easy to picture, what's emotionally punchy, what slots into what you already believe. So on my picture the reason some ideas keep showing up isn't that a faithful lineage won a competition, it's that lots of different starting points drain into the same resting place. I tried to sharpen this with a distinction she hated: call an item copy-proof if it survives transmission by resisting distortion (a rhyme, a number, a slogan with a rigid form), and self-correcting if it survives because distortions get pulled back — you garble it, the person you tell it to re-garbles it into the same shape, over and over. My claim was that Darwinian selection needs something like copy-proofness, and that once most of the stability is self-correction you're not looking at a Darwinian process anymore, you're looking at convergence: the same shape arriving over and over from unrelated starting points, the way similar body plans show up again and again in lineages that never shared an ancestor. Mara's reply, which I couldn't answer, was that biology is exactly as messy — genes get mutated, broken, recombined, repaired — and nobody concludes that evolution isn't Darwinian because of it.

  So: is the difference between our two pictures an actual empirical disagreement, or are we just describing one process at two zoom levels and fighting about words? Please run the three usual conditions for something to count as a Darwinian process — variation, heritable-ish transmission, differential fitness — and tell me for each whether my "self-correcting" case really fails it or only meets it loosely, and whether meeting it loosely is enough. Then tell me what observation would actually decide the thing between us, something checkable in principle with a telephone-chain experiment or with historical records of variants, no library required; and whether there's a real distinction hiding in my "stability that needs a lineage vs. stability that doesn't" line, or whether that's just a bad way of restating the disagreement. Also: does any of this license the snarky thing I said at the start, or does neither picture support "widespread therefore probably false"?

  Give me your bottom line in the very first sentence — which picture is doing more work, or whether the fight is verbal — then a compact table putting the two accounts side by side on those dimensions, then the reasoning. No preamble, no restating my question back at me, and please don't open with anything like "great question."
reasoning: |-
  Alright, let's tackle this step by step. The user had a heated debate with Mara about meme theory versus idea reconstruction. They need to know if their disagreement is empirical or just semantic. 

  First, the user's main points: Mara thinks ideas spread like Darwinian replicators—variation, inheritance, selection. The user argues ideas are reconstructed each time, biased by cognition, leading to convergence. They introduced "copy-proof" vs. "self-correcting" stability. Mara countered that biology handles mutations without ditching Darwinism.

  Key questions:
  1. Do the three Darwinian conditions apply to the user's self-correcting idea?
  2. What observable test could settle this?
  3. Is stability from lineage vs. convergence a real distinction?
  4. Does either view support "widespread therefore false"?

  Breaking down Darwin's conditions:
  - Variation: Both models have it. Self-correcting ideas vary during transmission but snap back.
  - Heritable transmission: Here's the friction. Self-correction might mean the "offspring" idea isn't descended from the parent but reconstructed independently. If each transmission is a fresh rebuild based on cognitive biases, not copying, is it heritable? Biology has mutations, but the gene lineage exists. In cognitive convergence, there might not be a lineage—each person independently arrives at the idea. That challenges heritability.
  - Differential fitness: Both models have traits affecting spread. Rhymes spread better than prose. Self-correction might be a fitness trait.

  Observable test: Telephone game experiments. Compare copy-proof items (e.g., rigid slogans) vs. self-correcting ones (e.g., urban legends). Check if errors accumulate linearly (Darwinian) or if different starting points converge to the same output (convergence). Historical records could track idea variants—do they branch like a tree or repeatedly emerge?

  Stability distinction: Lineage-dependent stability requires historical continuity (e.g., genes). Convergence is lineage-independent—like crabs evolving multiple times. If an idea pops up independently due to cognitive biases, it's convergent, not Darwinian. That's a real difference.

  "Widespread therefore false": Neither model directly supports this. Copy-proof ideas might spread regardless of truth. Self-correcting ideas might be false but cognitively appealing. The snark holds only if false ideas are more catchy, but that's not necessary in either model.

  Bottom line: The disagreement is empirical. The key is whether idea stability comes from faithful copying (lineage) or reconstruction (convergence). Observing transmission chains can test this.
answer: |-
  **Bottom line:** Your disagreement is empirical (not verbal), and Mara's Darwinian framework covers more cases—but your convergence model captures crucial realities she's underweighting.

  ### Comparison Table
  | Dimension          | Mara's Darwinian Model (Replicator) | Your Convergence Model (Reconstruction) |
  |--------------------|-------------------------------------|------------------------------------------|
  | **Variation**      | Present: Mutations during copying   | Present: Rebuilding introduces errors    |
  | **Heritability**   | **Strong**: Lineage-based fidelity  | **Weak**: Independent reconstruction; lineage optional |
  | **Differential Fitness** | Present: Traits aid copying (e.g., catchiness) | Present: Biased toward cognitive ease (e.g., emotion) |
  | **Stability Source** | Copy-proofness (e.g., rhymes)       | Self-correction (e.g., biases "snap back" to familiar shapes) |
  | **Lineage Required?** | Yes: Survival depends on ancestor → descendant chain | No: Same idea emerges repeatedly *without* shared ancestry |
  | **Process Analogy** | Gene evolution (tree-like branching) | Convergent evolution (e.g., crab-like body plans) |

  ---

  ### Reasoning  
  1. **Darwinian conditions**:  
     - **Variation**: Both models satisfy this tightly. Your "self-correcting" case has variation (distortions during rebuilding), but selection acts via cognitive biases.  
     - **Heritability**: This is the friction point. Mara's model assumes lineage-based inheritance (idea A begets slightly mutated A'). Your model **fails strict heritability**: When distortions are "pulled back" by shared biases, the output isn't descended from the input—it’s independently reconstructed. *Example*: A garbled moral panic rumor rebuilds into "Satanic daycare" because that template exists culturally, not because it was copied.  
       - *Is loose heritability enough?* Yes—biology uses loose heritability (e.g., horizontal gene transfer). But biology still requires *some* lineage; your model doesn’t.  
     - **Differential Fitness**: Both models fit. Catchiness (Mara) and cognitive ease (you) are fitness traits.  

  2. **Empirical test**:  
     - **Experiment**: Run telephone chains with two sets:  
       - *Set A*: Copy-proof items (e.g., a rigid rhyme: "An apple a day...").  
       - *Set B*: Self-correcting items (e.g., a vague descriptor: "a healthy habit").  
     - **Prediction**:  
       - Mara: Set A retains form better (high lineage fidelity). Set B degrades chaotically.  
       - You: Set B converges across chains to similar outputs (e.g., all chains mutate "healthy habit" into "eating fruit").  
     - **Check historical records**: Track rumor variants (e.g., "Knockout Game" assaults). If unrelated incidents generate identical narratives, convergence wins.  

  3. **Lineage vs. convergence stability**:  
     - **Real distinction**. Copy-proof stability (e.g., a mantra) needs lineage—break the chain, it vanishes. Self-correcting stability (e.g., "tragedy requires hubris") doesn’t; it re-emerges because cognitive biases (e.g., schemas) rebuild it. This is like carcinization (crabs evolving repeatedly) vs. genetic inheritance.  

  4. **"Widespread therefore false"**:  
     Neither model licenses your snark. Mara’s theory says spreading ideas need only be catchy; yours says they need cognitive appeal. Both allow *true* ideas to spread (e.g., "handwashing prevents disease" is catchy + fits biases). The "10% brain myth" spreads because it’s intuitively appealing, not because falsehood is inherently fitter.  

  **Conclusion**: Mara’s model explains rigid meme survival; yours explains fluid idea recurrence. Use the telephone-chain test—if Set B converges across chains, your convergence model resolves the stalemate.
