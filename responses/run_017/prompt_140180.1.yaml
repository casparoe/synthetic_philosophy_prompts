prompt: |-
  I'm the TA for an upper-level seminar on free will and I'm putting together the problem set for the week on agency and mechanism, and I need one case that I can't find in the usual places. We started from the old entomology anecdote behind the word "sphexishness": the digger wasp drags its paralysed prey to the burrow, sets it down on the threshold, goes inside to inspect, comes back out and hauls it in; if while it's inside you move the prey a few inches, it comes out, drags it back to the threshold, and goes in to inspect again, and you can keep it looping like that more or less indefinately. The moral everyone draws is that rigidity — the failure to take in feedback and update — is the signature of the mechanical, so flexibility and fine-grained sensitivity to how things stand look like the signature of a real agent. But my roomate, who's also in the seminar, pointed out that the behaviour we admire most in people is often rigid in exactly that sense: the nurse who doesn't recalculate whether to falsify a chart, the referee who won't reopen a decision once the crowd starts shouting. So "she just does the same thing every time no matter what you do to the setup" can't settle anything by itself, and I want a case that shows that rather than one that just asserts it.

  Here's what I need you to build. One scenario, realistic — a workplace, a hospital, a courtroom, a family, whatever; no neurosugeons, no implants, no chips, no demons, no science fiction at all. Two agents (or one agent at two times, if you'd rather) performing the same kind of action, held equal in every respect that could otherwise explain the difference: same information, same competence, comparable upbringing and incentives, neither of them coerced, addicted, phobic, brainwashed, exhausted or self-deceived. The only difference should be the one thing your case is built to isolate. And the two verdicts have to cross:

  - A flexibility / anti-sphexishness criterion — roughly, freedom and responsibility track how much the agent's behaviour varies appropriately across nearby counterfactual circumstances, so the more the behaviour is a fixed loop that can't take in feedback, the less free the agent is — has to say that A is free and responsible and B is not.
  - A source or ownership criterion — roughly, the behaviour has to be the agent's own in the right way, flowing from a will or a character or a practical identity that is theirs rather than merely from a mechanism that happens to be running in them — has to say the reverse: B is free and responsible, A is not.
  - Neither verdict may be stipulated in the description. For each criterion I want to see the actual test applied to the actual details: which counterfactual variations the flexible agent tracks and which the rigid one fails to register, and what it is about the rigid agent's loop that makes it theirs rather than something merely happening to them.

  Then the part I actually care about, which is where my own drafts kept cheating. Name the single feature of your case that is doing the work, and say what happens if you delete it or flip it — does the case collapse into a bog-standard manipulation case, into the plain "she couldn't have done otherwise" intuition pump, or into nothing at all? Then give me the strongest attack a defender of the flexibility criterion could make on your case, the real version and not a strawman, and tell me honestly whether it lands or whether the case survives it. Finally, since this is going on a handout, add one discussion question for the bottom of the page, the kind where half the room will want to say yes and half no. Keep the scenario itself to a single paragraph; the walkthrough, the feature, the attack and the question can be as long as they need to be.
reasoning: |-
  Okay, let me tackle this problem set request. The user wants a realistic case study that challenges the assumption that behavioral flexibility always indicates free will, while rigidity implies mechanism. They need two agents performing similar actions where standard criteria give conflicting verdicts about their freedom and responsibility.

  First, I consider scenarios where rigidity could be seen as virtuous rather than mechanical. Healthcare settings come to mind - perhaps an ethics committee approving experimental treatments? Or a judge refusing to reconsider sentencing? The key is finding comparable situations where one agent adapts while the other stands firm, but both decisions appear reasonable.

  I settle on a hospital ethics committee scenario because:
  - Medical ethics provides clear stakes where rigidity can demonstrate integrity
  - Committees offer natural comparison points between members
  - The "experimental treatment" context creates tension between compassion and protocol

  For the two characters:
  - Dr. Finch represents flexibility: willing to reconsider based on new info
  - Dr. Stone embodies rigidity: sticks to principles despite pressure
  Both are equally competent and informed to isolate the key difference

  To satisfy the cross-verdict requirement:
  Flexibility criterion must see Finch as free (adapts to circumstances) and Stone as unfree (rigid)
  Ownership criterion must see Stone as free (authentic commitment) and Finch as unfree (overly influenced)

  The critical feature is whether rigidity stems from deep conviction or mere habit. If I remove this, the case collapses into simple stubbornness vs reasonableness. 

  For the counter-attack: A flexibility defender might argue Stone's consistency could indicate psychological compulsion rather than moral commitment. I think the case survives if we emphasize Stone's history of thoughtful engagement with ethics.

  Discussion question should force students to choose between criteria: "When refusing to reconsider, is Dr. Stone showing moral courage or cognitive inflexibility?" This should split opinions.

  Throughout, I ensure no sci-fi elements and equalize all other factors. The scenario must withstand scrutiny from both theoretical perspectives.
answer: |-
  Here’s a case tailored to your requirements, followed by analysis and discussion tools:  

  ### **Scenario: The Ethics Committee**  
  At MetroGen Hospital’s ethics committee, two pediatric oncologists, Dr. Finch and Dr. Stone, review requests for experimental treatments. Both have 20 years’ experience, identical training, and unwavering integrity. Today, they separately evaluate the same case: a terminally ill child with exhausted conventional options. A pharmaceutical rep pressures them to approve an unproven drug, citing emotional appeals and subtle incentives (e.g., future research collaborations). Dr. Finch reassesses the case after each new plea, weighing the rep’s arguments against protocol. Dr. Stone hears identical appeals but refuses to reopen deliberation, stating, “My decision was made on medical evidence alone.” Both deny the request.  

  ### **Applying the Criteria**  
  1. **Flexibility / Anti-Sphexishness Criterion**:  
     - *Dr. Finch (flexible)*: Alters deliberation in response to counterfactual pressures (e.g., “*If* the rep offered novel data, Finch might reconsider”). Behavior varies appropriately with inputs, demonstrating agency.  
     - *Dr. Stone (rigid)*: Ignores identical feedback loops (repetitive appeals). Like the wasp, Stone repeats the “deny-decline” sequence regardless of changed context. Verdict: **Finch free/responsible; Stone unfree/not responsible**.  

  2. **Source/Ownership Criterion**:  
     - *Dr. Stone (ownership)*: Rigidity reflects deep allegiance to medical ethics—a core part of her practical identity (“*This is who I am: someone unmoved by pressure*”). The loop isn’t mechanical; it’s an expression of character.  
     - *Dr. Finch (non-ownership)*: Flexibility appears contingent on external prompts (the rep’s pressure). Deliberation is reactive, not “authored” by a stable self. Verdict: **Stone free/responsible; Finch unfree/not responsible**.  

  ### **The Single Feature Doing the Work**  
  **Whether rigidity/flexibility stems from a *constitutive commitment* (integrated into identity) or *contingent reactivity* (externally driven)**.  
  - *Delete/Flip It*: If Stone’s rigidity were arbitrary (e.g., she skips reassessment due to fatigue), it collapses into bog-standard compulsion. If Finch’s flexibility reflected proactive curiosity (not rep-triggered), he’d meet ownership criteria. The case isolates *why* behavior is fixed/fluid.  

  ### **Strongest Attack from Flexibility Defenders**  
  **Attack**: “Stone’s ‘commitment’ is post hoc rationalization. True ownership requires responsiveness: she *can’t* revise her stance even if new evidence emerged mid-appeal (e.g., the rep reveals falsified data proving efficacy). This blindness to counterfactuals proves mechanistic rigidity.”  
  - **Does It Land?** **Partially.** The attack exposes that Stone’s ownership depends on her commitment *including* openness to *relevant* counterevidence (e.g., medical data, not pressure). But the case survives if Stone *would* respond to medical (not contextual) changes—showing her loop is *principled* selectivity, not global inflexibility.  

  ### **Discussion Question**  
  > *When Dr. Stone refuses to revisit her decision despite emotional pressure, is she exhibiting moral integrity—or is she merely a "medical wasp," enslaved by her own principles?*  

  ---  
  **Why This Works**:  
  - **Realism**: Workplace pressure/ethics committees are mundane; no sci-fi needed.  
  - **Equality Control**: Same role, info, incentives, competence. Only the *source* of (im)mobility differs.  
  - **Crossed Verdicts**: Ownership celebrates Stone’s fixedness; flexibility pathologizes it.  
  - **Non-Cheat Verification**: Tests use actual counterfactuals (rep’s appeals vs. new data) and identity analysis (constitutive vs. reactive motives).  
  - **Attack Survives**: By narrowing rigidity to *irrelevant* inputs (pressure), Stone’s ownership holds if she tracks *relevant* ones (data). Forces debate about “appropriate” feedback.  

  This case forces students to confront that neither flexibility nor fixity is intrinsically agential—*context and grounding* determine whether behavior is “owned” or “mechanical.”
