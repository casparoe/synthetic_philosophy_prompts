  ### 3. Taxonomy

  You separate three concepts:

  1. Informational cascade proper: agents ignore their private signals and follow the crowd because the public belief is so strong that their signal cannot overcome it.

  2. Payoff externalities: agents' payoffs depend on how many others choose the same action, so matching is rational for payoff reasons.

  3. Judgement of competence: agents care about being seen as competent, so they may follow the crowd to avoid standing out, even if their private evidence is strong.

  In the windowed variant, if a cascade in the sense of (1) does not occur (as we saw for p=0.6), then the lock-in does not happen. The state of the tally continues to change.

  Therefore, the lock-in in the windowed variant is not an informational cascade proper. It might be that the tally becomes (3,0) and stays there for a while, but eventually it will change.

  In this model, there are no payoff externalities or reputational concerns; agents only care about matching the state. Therefore, only mechanism (1) is at play, and in this variant with a window of three, it does not cause a cascade ( for p=0.6).

  The third mechanism ( reputational) is distinct because it adds an extra term in the payoff: the agent cares not only about being right but also about being seen as competent. This is not present in the basic model.

  ## Summary

  1. In the standard model with bounded signals, the public belief converges to an interior point with positive probability, and that is why it can be wrong. The lock-in is of the public belief and the action sequence.

  2. In the windowed variant with p=0.6:
     (a) A cascade in the sense of agents ignoring their private signals does not occur. The process is ergodic and does not lock in.
     (b) There is a public belief for each state of the tally, defined by the stationary distribution of the Markov chain, but it is not a martingale.
     (c) The naive calculation is illegitimate, but in this case since agents always follow their signals, the actions are conditionally dependent given the state, so the tally is not three independent signals.

  3. The lock-in in the windowed variant does not occur, so none of the three concepts apply in a lock-in sense. However, if one were to occur, it would be type (1) if the public belief in the tally became extreme enough.

  The Markov-chain observation in 2(a) is not a special case of the martingale picture; it is a different modeling approach. In the full-history model, the public belief is a martingale and converges. In the windowed model, we have a Markov chain on a finite state space, and the question of absorption is separate. In the standard model with bounded signals, the public belief converges to an absorbing state ( cascade) almost surely, while in the windowed model with p=0.6, it does not absorb.

  Given the complexity of the calculations and the fact that for the windowed model with p=0.6 we get that agents always follow their signals, we can say that a cascade does not occur. For higher p, it might. For example, if p=0.9, then in state (3,0) the public belief might be strong enough to ignore the signal. But for p=0.6, our calculation showed that even in state (3,0) the public belief (as measured by the absorption probability ratio) was not strong enough.

  Therefore, the answer to 2(a) is that for p=0.6, a cascade does not occur.

