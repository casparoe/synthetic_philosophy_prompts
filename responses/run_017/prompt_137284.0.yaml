  - The public belief (the posterior probability of state ω=1 given the history of actions) is a martingale and converges almost surely.
  - With unbounded signals (meaning that the support of the private likelihood ratios is unbounded), learning is asymptotically complete: the public belief converges to the truth (either 0 or 1) almost surely, and the correct action is eventually taken by all but finitely many agents.
  - With bounded signals (as in the binary signal case), an informational cascade occurs with probability one. In a cascade, agents ignore their private signals and follow the majority of the history they observe. The cascade may be incorrect (i.e., the majority action is wrong) with positive probability, and once a cascade starts, no private signal is revealed in the actions.

  **Resolution of the Tension:**

  The martingale convergence theorem tells us that the public belief converges almost surely to some random variable in [0,1]. However, the limit might not be 0 or 1 (the truth) but an interior point. This is where the boundedness of the signals matters.

  - In the unbounded signal case, the public belief must converge to 0 or 1 because the likelihood ratios from the signals can be arbitrarily extreme. Therefore, the martingale converges to the truth.
  - In the bounded signal case, the public belief can converge to an interior point. This interior point corresponds to a situation where the public belief is such that an agent is indifferent between the two actions based solely on the public history, and hence they follow their private signal. However, the key is that in the bounded signal case, the public belief might reach a point where the next agent will ignore their private signal. Specifically, if the public belief is such that the posterior after a private signal in one direction is above the threshold for action A and in the other direction is below the threshold for action B (or vice versa), then the agent will take the same action regardless of the signal. This is the start of a cascade. Once a cascade starts, all subsequent agents see the same public history (because actions are uninformative) and hence also ignore their signals. Therefore, the public belief stops updating and remains fixed at that interior point. The cascade is incorrect if the fixed public belief is on the wrong side of 0.5.

  **The Hinge:**

  The step that makes the cascade possible is that with bounded signals, the updating from a private signal is bounded. Therefore, the public belief may never cross the threshold that would break the cascade. In the unbounded case, even if a cascade starts, a sufficiently strong signal (which will occur with probability one because the support is unbounded) will break it. But in the bounded case, the strongest signal is bounded, so if the public belief is sufficiently extreme that even the strongest contrary signal cannot push it over the threshold, then the cascade is permanent.

  **Convergence of What? Lock-in of What?**
  - The public belief (posterior probability of state 1 given the history) converges almost surely (by martingale convergence).
  - In the bounded signal case, with probability one, the public belief eventually becomes so extreme that agents start ignoring their signals (a cascade). At that point, the public belief becomes fixed (lock-in). The action sequence becomes constant (all A or all B) and uninformative.

  **Probability of Incorrect Cascade:**
  The probability of an incorrect cascade is positive. It occurs if the initial history (by chance) leads the public belief to become very low (if the true state is 1) or very high (if the true state is 0). The exact probability can be computed but is not zero.

