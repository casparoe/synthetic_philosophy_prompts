answer: |-
  ### Simpson's Paradox Restated in Literary Craft Vocabulary

  **The Paradox as a Novel:**  
  Imagine a novel with two narrative treatments (Treatment A and Treatment B, e.g., two thematic approaches). The book is divided into subgroups—**chapters grouped by point-of-view (POV) characters**, each functioning as a self-contained **subplot**. In every subgroup (each POV chapter-sequence), Treatment A yields a higher "sympathy rate" (reader connection) than Treatment B. Yet, when evaluated **as a whole-book arc**, Treatment A produces a *lower* overall sympathy rate.  

  The reversal stems from **shifts in distribution**:  
  - **Subgroups as chapters/subplots**: Each POV subgroup has a distinct "base rate" of sympathy (e.g., Character X’s chapters inherently foster more empathy).  
  - **Shifting subgroup mix**: Treatment A dominates in subgroups with *lower* base sympathy rates (e.g., it’s applied more to cold, introspective POVs), while Treatment B dominates in high-sympathy subgroups (e.g., warm, dialog-driven POVs).  
  - **The reversal**: At the **chapter-level**, Treatment A wins in every POV sequence. At the **book-level**, the disproportionate weight of low-sympathy subgroups under Treatment A drags the aggregate down, like a novel where **shorter chapters** (if weighted more) or **dominant POVs** skew the whole.  

  **What the Paradox Consists In**:  
  A *structural* contradiction: the **local effect** (per subgroup) opposes the **global effect** (whole book) due to imbalanced subgroup representation. It’s not about flawed storytelling but **how subgroup weights (e.g., chapter lengths, POV distribution) interact with narrative techniques**.  

  **Separating from Nearby Errors**:  
  - **Regression to the mean**: An extreme chapter (e.g., hyper-sympathetic) followed by moderation. *Not here*—the paradox persists without extreme outliers.  
  - **Base-rate neglect**: Overlooking inherent subgroup traits (e.g., a POV’s natural coldness). *Simpson’s exploits* these rates.  
  - **Ecological fallacy**: Assuming chapter-level effects imply book-level effects. *Simpson’s is the inverse*: book-level contradicts chapters.  
  - **Confounded comparison**: A hidden variable (e.g., timeline jumps) distorting treatment effects. *Simpson’s is specific*: the confounder (subgroup mix) causes reversal via imbalance, not distortion.  

  ---  
  ### Residue Report: Mapping to Craft Vocabulary  

  1. **Carries over without loss**:  
     - **Scene vs. summary**: Scene-heavy subgroups (high detail) may have different sympathy rates than summary-driven ones. The paradox preserves how *weighting* these (e.g., more summary in Treatment A) reverses effects.  
     - **Chapter vs. whole-book arc**: The tension between chapter-level empathy and cold aggregate impact mirrors subgroup/book reversal.  
     - **Dramatic irony/subplot framing**: If subgroups are subplots, their individual resolutions (positive) clashing with the main arc’s outcome (negative) embodies the paradox.  

  2. **Carries over with substitution (and fudging)**:  
     - **Ratios, not counts**: The paradox hinges on *sympathy rates* (e.g., empathetic moments per page), not raw counts. *Craft substitution*: "Emotional density" (impact per word) replaces rates. *Fudge*: We assume density is measurable like a ratio, though literary impact is qualitative.  
     - **Subgroup mix must differ**: Reversal requires Treatment A/B to dominate different subgroups. *Craft substitution*: "POV distribution" or "scene-length allocation" replaces statistical mix. *Fudge*: Craft lacks formal "mix variance"; we imply it via uneven chapter lengths or POV focus.  
     - **Conditioning vs. intervention**: Deciding whether to "condition" on subgroups (respect POV boundaries) or "intervene" (force-equalize them). *Craft substitution*: "Choosing a narrative lens" (e.g., reading by chapter order vs. regrouping by POV). *Fudge*: Statistics uses math; craft uses interpretive intent.  

  3. **No expression in craft vocabulary**:  
     - **Ratios are irreplaceable**: Craft has no equivalent for "sympathy rate per unit of text." Emotional impact isn’t quantized; we describe it holistically (e.g., "the protagonist’s vulnerability in Act II").  
     - **Constraint of differing subgroup mixes**: Craft can note uneven POV distribution but lacks a rule that reversal *requires* this imbalance.  
     - **Conditioning/intervention duality**: No craft term distinguishes "analyzing by subgroup" (conditioning) from "ignoring subgroups" (intervening). We borrow the *idea* via "framing choices."  

  ---  
  ### Your Case: Literary → Statistics → Literary  

  **Translation to Statistics**:  
  - **Chapters**: Subgroups with varying "trial sizes" (word counts: 400–4,000 words).  
  - **Treatment**: Narrative techniques deepening sympathy (e.g., inner monologue, moral dilemmas).  
  - **Outcome**: "Sympathy rate" = reader connection (per chapter, and overall).  
  - **Initial grouping (chapter order)**:  
    - Per chapter (subgroup): Sympathy ↑ (treatment succeeds locally).  
    - Whole book: Sympathy ↓ (treatment fails globally).  
    - *Simpson’s trigger*: Longer chapters have **lower base sympathy rates**. Treatment dominates these, sinking the aggregate.  
  - **Regrouped by POV**:  
    - Per POV subgroup: Sympathy ↑ (treatment succeeds).  
    - Whole book: Sympathy ↑ (reversal vanishes).  
    - *Why?* Regrouping equalizes weights (e.g., a short, warm POV chapter gains influence; a long, cold one loses dominance).  

  **Which Reversal is "Real"?**  
  - **Chapter-order reversal is statistically valid** (it reflects unbalanced weights). The aggregate sympathy rate *must* account for chapter lengths (e.g., a 4,000-word chapter impacts readers more than a 400-word one).  
  - **POV reversal is interpretive**: By regrouping, you *intervene* to force subgroup equality, altering the natural "weighted average" of reading.  

  **Does Craft Vocabulary Guide Partition Choice?**  
  - **No guidance exists**. Craft terms (e.g., "arc," "pacing") describe effects but don’t prescribe *how* to weight chapters. A novelist might prioritize:  
    - **Chapter order**: Respects structural intent (word-count weights matter).  
    - **POV groups**: Honors character-driven unity (equalizing subgroup voices).  
  - **Why this isn’t a defect**:  
    - **Literature is not statistical**. Choice of partition depends on *narrative intent*, not math. If the book explores POV as theme, regrouping is valid; if it relies on cumulative pacing, chapter order dominates.  
    - **Statistical logic** resolves the paradox by demanding we specify our question:  
      - "Does sympathy rise *within each chapter*?" → Condition on chapters (yes).  
      - "Does the *whole book* increase sympathy?" → Intervene, ignore subgroups (no, in chapter order).  
    Craft lacks this duality—it’s why your reader’s experience shifts.  

  **Final View**:  
  The absence of partition rules in craft is **not a flaw** but a feature. Novels are experienced through **multiple valid lenses** (chapter-by-chapter, thematic regrouping, etc.). Statistics clarifies *why* reversals occur (imbalance in weights/base rates), but literature embraces subjectivity: the "right" partition is defined by **artistic purpose**, not data. Your two reversals reveal a tension between *local intimacy* (chapters/POVs) and *global cohesion* (whole book)—a core dynamism in literary fiction. Revise based on which truth matters: the trees (chapters) or the forest (arc).
