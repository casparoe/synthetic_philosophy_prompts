  2. Boltzmann shows dynamics can *create* dependency, making theta time-dependent—a twist.
  3. The checklist works if cases share patterns (e.g., "Does the conclusion amplify single events?" flags fragility).

  Failure conditions are well-identified. Theta-star being always 0/1 would sink it—but primes likely have low theta-star for "no primes in [n,n+log n]" (sensitive!), while cosmology has high theta-star for "one life-permitting universe" (robust only if universes *must* be coupled). 

  Biggest risks: 
