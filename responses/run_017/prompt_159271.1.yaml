  2. Defining "local" vs. "global" without causality. Maybe use correlation decay distance (local = correlations decay geometrically with "event distance"). 

  Honestly, if the lemma fails for Boltzmann due to recurring correlations, that’s a publishable nuance—not failure. The real pitfall is forcing the model where it doesn’t fit. 

  ...*crafting proposal*... 

