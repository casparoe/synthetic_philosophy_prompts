answer: |-
  Below is a runnable 90-minute session plan designed to make Copycat's core ideas experientially discoverable. I've refined your sketch to maximize "aha" moments while addressing your colleague's concern about puzzle fatigue. The microdomain and problems are engineered to force slippage, priming, and context-dependence while minimizing arbitrary choices.

  ---

  ### **Microdomain Design**  
  **Alphabet**: `J → R → W → Z → $ → &` (visualize as a cycle: J-R-W-Z-$-&-J)  
  **Why**:  
  - Unfamiliar symbols prevent alphabet fluency from shortcutting the struggle.  
  - Non-adjacent successors (e.g., J→R skips K-Q) require relational thinking, not rote "next letter."  
  - `$` and `&` evoke abstract concepts (money/connection), inviting semantic slips.  

  **String Types & Worked Examples**:  
  | Problem Type          | Base Pair              | Target Start | Intended Lesson                         |  
  |-----------------------|------------------------|--------------|-----------------------------------------|  
  | Warm-up (obvious)     | `JJ → JR`              | `RR`         | Basic successor: last symbol advances   |  
  | Dead-end (X-like)     | `JJ → JR`              | `R&`         | Last symbol `&` has no successor → impasse |  
  | All-identical         | `JJ → JR`              | `&&`         | Rule fails catastrophically → requires slip |  
  | **Priming Pair A**    | `$$ → $Z`              | (none)       | Slip: "successor" → "predecessor" (Z is `$`'s predecessor) |  
  | **Priming Pair B**    | `$$ → $$J`             | (none)       | Slip: "change" → "lengthen" (add first symbol) |  
  | Primed Target         | `JJ → JR`              | `&&`         | Same as all-identical, now primed       |  
  | Wagering Problem      | `W$ → W&`              | `Z$`         | Ambiguous: successor? predecessor? something else? |  
  | Temperature Problem   | `RZ → R$`              | `$$`         | Clear rule, but endpoint forces creativity |  

  ---

  ### **Session Flow**  

  #### **1. Silent Individual Round (15 min)**  
  - **Handout**: Lists problems in order. Students write answers alone.  
  - **Sequence & Pedagogical Goals**:  
    - `RR → ?` (Expected: `RW`). *Goal: Establish baseline "successor" rule.*  
    - `R& → ?` (Expected: Stuck! `&` has no successor). *Goal: Dead-end forces rule-questioning.*  
    - `&& → ?` (Expected: Blank or guesses). *Goal: Total collapse—no rule works. Sets up need for slippage.*  
  - **Predictable Issue**: Overconfident students may declare "& → J" (cycle) early. **Mitigation**: Preempt: "No cycles—successor only moves forward in the sequence."  

  #### **2. Primed Round (20 min)**  
  - **Split Protocol**:  
    - Pre-sort handouts (A/B) into two stacks. Distribute randomly as students enter.  
    - Instruct: "Work silently. Do not share your paper."  
    - **Handout A**: Shows `$$ → $Z` ("See how `$` becomes its predecessor `Z`?") → Targets `&&`.  
    **Handout B**: Shows `$$ → $$J` ("See how `J` is added to `$$`?") → Same target `&&`.  
  - **Reveal & Compare**:  
    - Poll Group A: Most answers will be `&Z` (predecessor slip).  
    - Poll Group B: Most answers will be `&&J` (lengthening slip).  
    - **Key Q**: "Why did the *same* problem (`&&`) yield different answers?" → *Reveals priming = activation spread in slipnet*.  
  - **If Leaks Happen**: Turn it into data! Ask: "Did anyone hear another answer? Did you change yours? That’s probabilistic competition—codelets 'hearing' alternatives."  

  #### **3. Wagering Round (15 min)**  
  - **Problem**: `W$ → W&` :: `Z$ → ?`  
    - Why: `W$ → W&` can be interpreted as:  
      - Successor (`$→&`), so `Z$→Z&`?  
      - Predecessor (`W→?` not used), or whole-string change?  
      - **Ambiguity ensures no single "right" answer.**  
  - **Payoff Scheme (No Money Needed)**:  
    - Teams (3–4 students) get 10 tokens each.  
    - Wagering: Bet 0–5 tokens on what *the class majority* will pick for `Z$→?`.  
    - **Catch**: Teams must also bet 0–5 tokens on "No majority" if they suspect ties.  
    - **Scoring**:  
      - If majority exists (e.g., 40% say `Z&`), correct bets win +2x tokens.  
      - If tie (e.g., 30% `Z&`, 30% `$`, 30% `ZJ`), "No majority" bets win +3x tokens.  
      - Incorrect bets lose tokens.  
    - **Why it works**:  
      - Encourages meta-thinking: "What will *others* see?"  
      - Un-gamable: Copying loud peers risks betting against the silent majority.  
      - Makes probability concrete: "No fact of the matter, but `Z&` is 3x likelier than `ZJ`."  

  #### **4. Temperature Round (10 min)**  
  - **Same Problem Twice**: `RZ → R$` :: `$$ → ?`  
    - **Low Temp**: "Answer as *obviously* as possible." (Expected: `$$` or error—successor fails at `$`.)  
    - **High Temp**: "Answer as *inventively* as you can—but defend it!" (Expected: `$Z`, `$$J`, `$&`, etc.)  
  - **Reveal Spread**: Graph answers on the board. Low-temp: tight cluster (e.g., "no change"). High-temp: wide scatter.  
  - **Connect to Copycat**: "Temperature in Copycat widens/narrows the search—just like your 'inventive' mode explored more slips."  

  ---

  ### **Debrief (20 min)**  
  **Map Experiences to Copycat Architecture**:  
  | Experience          | Copycat Concept               | Script Snippet |  
  |---------------------|-------------------------------|----------------|  
  | Dead-end → New rule | Slipnet slippage              | "When the rule failed, your 'successor' concept *slipped* to 'predecessor' or 'lengthen'—activated by weighted links." |  
  | Priming changed answers | Time-varying activation  | "Handouts primed one path—like activation spreading to neighbors. Your context set the weights." |  
  | Wagering variance   | Probabilistic codelet competition | "Teams bet on likely answers—like codelets probabilistically building structures based on activation." |  
  | Temperature spread  | Temperature parameter         | "High-temp answers diverged—like Copycat exploring weak links when 'stuck'." |  

  **Explicit Tension Statement**:  
  > "Today you felt two truths:  
  > 1. There’s *no fact of the matter*—`&&` could become `&Z` or `&&J`.  
  > 2. Yet *some answers are better*—priming made one 'feel right.'  
  > Copycat bridges this with *weighted slips*: Creativity isn’t random; it’s constraint-satisfaction."  

  ---

  ### **Honesty Notes**  
  **Predictable Challenges**:  
  1. **Dominant Student**: If someone blurts "Just do X!" early:  
     - Isolate them: "Great! Now work *silently* to apply that to `&&`."  
     - Later, ask: "Did anyone *not* use [X]? Why?" → Shows multiple paths.  
  2. **Refusal to Answer**: A student says, "It’s arbitrary!"  
     - Validate: "Exactly—and Copycat explains *how* we 'arbitrate' slips."  
     - Redirect: "What’s the *least arbitrary* answer? Why?"  
  3. **Early Collapse**: If `&&` gets answers in Silent Round:  
     - Contrast: "How many had `&Z`? How many `&&J`? ... Now see how priming *changed* preferences."  
  4. **Timing**: Priming + Wagering may run long. **Save Time By**:  
     - Skipping Temperature Round polling (just discuss spreads).  
     - Making Wagering a show-of-hands tally.  

  **What the Exercise *Cannot* Reproduce**:  
  1. **Parallel Terraced Scan**:  
     - Humans think serially; Copycat tests 100s of paths in parallel.  
     - *Why it matters*: Students may underestimate search efficiency. **Fix**: "Imagine testing all slips *simultaneously*—that’s Copycat’s power."  
  2. **Sub-symbolic Activation**:  
     - Priming is discrete; Copycat’s activation is graded (e.g., "predecessor" at 0.7 vs. 0.3).  
     - *Why it matters*: Misses why some slips feel "kinda right." **Fix**: Demo with a slider: "How 'predecessor-y' is this slip?"  
  3. **Codelet Competition**:  
     - Teams debate consciously; codelets compete stochastically.  
     - *Why it matters*: Obscures why bad ideas briefly surface. **Fix**: "Ever have a wild idea that faded? That’s a low-activation codelet losing."  
  4. **Structural Cohesion**:  
     - Humans jump to wholes; Copycat builds structures incrementally.  
     - *Why it matters*: Students won’t feel "workspace" tension. **Fix**: "Your answer popped into mind—Copycat *builds* it step-by-step, with constant collapse risk."  

  **Conclusion**: The exercise *will* make slippage, context-dependence, and probabilistic arbitration visceral. You’ll need brief lectures to fill architectural gaps, but the discoveries—that relations are constructed, concepts are neighbor-defined, and creativity requires constraints—will land because students *lived* them.
