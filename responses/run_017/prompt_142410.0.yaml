          But note: there might be two or three common answers. We define the modal answer as the one with the highest frequency (if tie, then all tied are considered modal?).

          However, we want to capture the idea that "there is no fact of the matter" but some answers are more probable. So we might allow them to wager on "no single mode" meaning that there is a tie for the top.

          How about:

            - Teams can wager on a specific answer OR on "tie for top".
            - If they wager on a specific answer and that answer is the unique mode (strictly highest frequency), they win the wager.
            - If they wager on a specific answer and there is a tie for top and their answer is among the tied, they get half the wager? Or we don't allow that.

          To keep it simple: we have two wagering options:

            Option 1: Wager on a specific answer (they must write one string).
            Option 2: Wager on "there is no clear winner" (meaning the top two or more answers have the same frequency).

          Then:

            - If they choose option 1 and that answer is the unique mode: gain the wager.
            - If they choose option 1 and that answer is not the unique mode: lose the wager.
            - If they choose option 2 and there is a tie for the top frequency (at least two answers with the same highest count): gain the wager.
            - If they choose option 2 and there is a unique mode: lose the wager.

          They can wager any integer from 1 to 5.

          This makes them think about the distribution.

     Note: We must collect the individual answers first and compute the frequency distribution in front of them.

  **III. Temperature Round**:

     Present one problem. Have them answer twice:

          First: "be as obvious as possible" (low temperature) 
          Second: "be as inventive as you can while still being able to defend it" (high temperature)

     Problem: 
          Base pair: `X X` : ??? 
          Target: `M M`

     But we need a base pair to establish a rule? We can use a base pair that is ambiguous.

     Alternatively, we can use the same base pair as in the wagering round? But we want a clean one.

     How about: 
          Base pair: `K` : `K M`   (adding the successor of K, which is M) 
          Target: `X` 

          Then for low temperature: 
              Obvious: they might say "add the successor of X" -> but X has no successor -> so dead end? Then what is obvious? Maybe they say "can't be done"? 

          But we want them to produce an answer. So we might need a base pair that works.

     Alternatively, base pair: `B` : `F`   (replace with successor) 
          Target: `X` -> then obvious: they might say "can't do" or "X" remains? 

          But we want them to slip? 

     How about a target that is not dead-end? 

          Base pair: `B` : `F`   (successor) 
          Target: `M` 

          Then low temperature: obvious -> `Q` 
          High temperature: inventive -> maybe `K` (predecessor) or `M B` (lengthen) or `X` (jump to last) or ... 

     But the base pair is with one letter. So for `M`, obvious is `Q`.

     Then high temperature: they might change to predecessor, or add something, etc.

     We can use:

          Base pair: `B F` : `B`   ??? Not clear.

     Let's do:

          Base pair: `B B` : `B`   (removing the last B) 
          Target: `M M`

          Then for low temperature: remove last M -> `M` 
          For high temperature: they might do `K` (replace with predecessor of M? but the rule is removal) or `M K` (weird) or ... 

     We want a base pair that is clear for low temperature and open for high.

     Alternatively, use a base pair that uses successor on a single letter:

          Base pair: `B` : `F` 
          Target: `M M`

          Then for low temperature: 
              They might think: the rule is applied to single letter, but here we have two? So they might apply to the last: `M Q`? 
              Or to the whole? 

          This might be ambiguous.

     Let's do:

          Base pair: `K` : `M`   (successor) 
          Target: `X X`

          Low temperature: 
              They might say: change the last X -> no successor -> so maybe change both? or what? 

          This might not have an obvious answer.

     Instead, let's use the same structure as the original:

          Base pair: `abc -> abd` (change last letter to next) 
          Target: `xx`

     In our microdomain:

          Base pair: `B F K` : `B F M`   (change last letter K to M) 
          Target: `X X`

          Then for low temperature: 
              Change last X -> no successor -> so obvious might be: leave it? or error? 

          We want them to produce an answer. So we might have to accept that the obvious answer is "no change" or "X X" remains.

          Then high temperature: they might change it to `X Q` (predecessor) or `X X B` (add) or `Q X` (change first) etc.

     We'll go with:

          Base pair: `B F K` : `B F M`   (successor on last) 
          Target: `X X`

     Instructions:
          First answer: "What is the most obvious, straightforward answer? Even if it seems like it doesn't work, what would be the most literal extension of the rule?"
          Second answer: "What is the most inventive answer you can come up with, but one that you can still defend as being in the spirit of the rule?"

     We expect:
          Low temperature: many might say `X X` (no change) or maybe `X` (remove last? but that's not the rule) or error? But we want them to write a string. So they might write `X X` meaning no change.

          High temperature: a variety.

     Then we compare the spread of answers.

  **IV. Debrief (20 minutes)**:

     We want to connect to the Copycat architecture and the insights:

     - **Slippage**: When the rule doesn't apply (e.g., last symbol is X), we saw how concepts can slip (e.g., from "successor" to "predecessor", or from "change last symbol" to "add a symbol"). In Copycat, this is implemented by the slipnet: concepts are linked and activation spreads, so a dead-end might activate a related concept.

     - **Weighted links and activation**: The priming in our exercise is like activating a concept in the slipnet. Group A had the predecessor concept activated by the example, so when they hit a dead-end, that concept was more available.

     - **Probabilistic competition**: In Copycat, multiple codelets might suggest different slips, and the one with the highest activation wins. In our exercise, the students had to choose one slip. The priming made one option more salient.

     - **Temperature**: In the temperature round, we explicitly controlled the "temperature" by asking for obvious vs. inventive. Copycat uses temperature to control stochasticity: high temperature means more randomness (wider search) and low temperature means more deterministic (follow the strongest path).

     And the three insights:

       1. The relation that counts as "the same" is constructed (e.g., in the primed round, the rule was the same as the base pair? But we slipped it. So it's not given, we constructed it by slipping).
       2. A concept's boundary is set by its neighbours (e.g., the concept of "advance" is linked to "backward" and "lengthening", and the priming made one neighbour more active, so the concept slid in that direction).
       3. Choosing among slips requires a principled mechanism (e.g., in Copycat, the activation levels and temperature; in our exercise, the priming provided a context-sensitive bias).

     Also, the tension between "no fact of the matter" (multiple defensible answers) and "some answers are more probable" (due to priming or context) is central to Copycat's stochastic architecture.

     We should explicitly name this tension and note that Copycat doesn't resolve it deterministically but uses a probabilistic mechanism that is sensitive to the current context (activation) and temperature.

  **V. Honesty Notes**:

     What might go wrong:

       1. A student might announce a rule early and dominate: 
            - Mitigation: do silent individual work first. In group discussions (like wagering), assign roles or use think-pair-share.

       2. Student refuses to answer because the question is ill-posed:
            - This is actually a valid point. We can say: "That's a great observation. The point of the exercise is to see what people do when there is no fact of the matter. So even if it's ill-posed, write down what you think most people would do, or what you feel might be a natural extension."

       3. Endpoint cases collapse in the first round:
            - For Problem 1 (XQX) in the silent round, a student might come up with a slip (e.g., predecessor) without priming. That's okay. We can note that some people naturally slip. The priming round then shows that we can influence which slip occurs.

       4. Timing:
            - The whole exercise might run long. We have:
                 Silent round: 15 min
                 Primed round: 20 min (including handout and reveal)
                 Wagering: 15 min
                 Temperature: 10 min
                 Debrief: 20 min
                 Total: 80 min, but we have 90. We can adjust.

            - We might need to cut one round? But all are important.

     What the exercise cannot reproduce:

       - **Graded, massively parallel, sub-symbolic competition**: Copycat runs many codelets in parallel, with activation spreading continuously. Our exercise is step-by-step and conscious. We cannot show the parallel terraced scan.

       - **The slipnet's dynamics**: In Copycat, activation spreads and decays over time, and weights change. Our priming is a one-time exposure and doesn't have the same dynamics.

       - **Codelets and workspace**: The idea of multiple small agents building and destroying structures is not modeled. Our students are doing high-level reasoning.

       - **Temperature in the stochastic process**: In Copycat, temperature affects the probability distribution. In our exercise, we only simulate it by instruction.

     How much does it matter?
          - The goal is to give an intuition of the key ideas. The students have read about the architecture. The exercise lets them experience the phenomena that the architecture was designed to handle. The missing features are the implementation details that make Copycat a computational model. We can explain that the exercise is a high-level analog, but the real model runs at a lower level.

     We can say: "The exercise is like a cognitive task analysis. Copycat is a computational implementation of how that task might be done."

  **Finalized Materials**:

     Alphabet: B, F, K, M, Q, X (order: B, F, K, M, Q, X)

     Silent Round Problems (on board or handout):

          Problem 0 (Warm-up): 
            Base pair: B F K  ->  B F M
            Target: K M Q  ->  ?   (Answer: K M X)

          Problem 1: 
            Base pair: same
            Target: X Q X  ->  ?   (Expected: dead-end, but some might answer)

          Problem 2:
            Base pair: same
            Target: X X X  ->  ? 

     Primed Round Handouts:

          Group A:
            "Study the following example:
               Base pair: X X  ->  X Q
             Explanation: The last symbol (X) was replaced by its predecessor (Q).

             Now, consider a new analogy problem:
               Base pair: B F K  ->  B F M
               Target start: X Q X
             What should X Q X become? (Write your answer:)"

          Group B:
            "Study the following example:
               Base pair: X X  ->  X X B
             Explanation: The symbol B was added at the end.

             Now, consider a new analogy problem:
               Base pair: B F K  ->  B F M
               Target start: X Q X
             What should X Q X become? (Write your answer:)"

     Wagering Round Problem:

          Base pair: B B  ->  B F   (rule: replace last symbol with its successor)
          Target: Q X  ->  ?

     Temperature Round Problem:

          Base pair: B F K  ->  B F M
          Target: X X  ->  ?

          Instructions:
            First, write the most obvious answer: 
            Second, write the most inventive answer (but defensible): 

