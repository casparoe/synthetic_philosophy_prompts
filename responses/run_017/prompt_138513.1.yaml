prompt: |-
  I have been defending, in a setting where it has recently started to matter practically, a specific account of what left and right are, and I want to know how exposed it is.

  The account has two parts. First: neither side is a doctrine or a policy package, since almost any concrete policy has been held by both at some point; what is stable across that churn is a second-order fact about which state of affairs each side treats as standing in need of a reason. On the left, existing asymmetries of wealth, status and power are presumptively suspect and must be justified, while departures from them are not. On the right, established practice, earned deserts and the spontaneous outcomes of markets and civil society are presumptively acceptable, and it is their deliberate disruption that must be justified. Call this the asymmetry of the justificatory default. Second: what actually holds each side together day to day is not that default but an adjacency structure — two people at opposite ends of a coalition may share no principle at all, each link in the chain sharing something with its neighbour, so that realignment pressure shows up first in the links rather than at the ends — plus a shared object of distrust, a settled answer to the question of which authority is not to be believed.

  Tell me what would count against this, ranked from fatal to merely awkward, and be specific about which counterexamples a defender of the account should concede rather than explain away. I am most worried about three. One: the defaults look as if they have flipped in places — parts of the right now celebrate disruption and attack inherited institutions, while parts of the left defend them — and I cannot tell whether that refutes the account or whether it merely lets the default be re-attached to whatever each side currently has, in which case it predicts nothing. Two: the object of distrust may be doing all the real explanatory work, with the justificatory default as decoration; how would I test the two against each other with evidence I could actually gather? Three: it may collapse into a rival I have not named — plain conservatism-versus-reformism relabelled, or a view on which the real variable is which out-group you are willing to defend, or just the much-discussed sorting of Western electorates by educational attainment described in more flattering terms. Say also whether the account has been qualified into unfalsifiability, and whether that is fatal for something meant to do the kind of work I need of it. For what it is worth, in the group I work with the thing that best predicts whether someone walks out of a meeting is not which policies they hold but whose account of the housing crisis they find credible — which is exactly why I suspect the second part of my account is doing all the work and the first is ornament.
reasoning: |-
  Okay, let me start by unpacking the user's query. They've presented a detailed account of left and right politics with two main parts: the justificatory default and the adjacency structure with shared distrust. They're concerned about potential weaknesses in their theory, specifically three main issues. 

  First, they worry that the justificatory default might have flipped in some cases, making their account either refuted or unfalsifiable. Second, they suspect the shared distrust element might be doing all the explanatory work. Third, they're concerned their theory might just be a repackaged version of existing frameworks like conservatism vs reformism.

  Hmm... the user is clearly deeply engaged with political theory and needs this framework for practical application—probably policy work or coalition management. The stakes are real: they mention people walking out of meetings over whose analysis they trust. That visceral detail suggests their theory isn't just academic; it's affecting workplace dynamics. Their anxiety about ornamentation rings true—if the justificatory default isn't predictive, it's intellectual dead weight.

  On the first worry: The flipping of defaults does look bad initially. When the right attacks institutions (like Trumpists vs "deep state") or the left defends them (like unions protecting seniority systems), it seems to contradict the core thesis. But maybe this isn't fatal if we consider asymmetric triggers. For example, the right attacks institutions that deviate from traditional values, while the left defends institutions that protect vulnerable groups. The default doesn't flip—the context does. Still, this needs clear boundaries to avoid becoming "whatever each side currently has."

  For the second concern: The shared distrust does seem powerful. If team cohesion hinges on "whose analysis of the housing crisis we distrust," that might swamp the justificatory default. Testing this would require isolating variables—like observing intra-coalition conflicts where distrust targets align but justificatory defaults clash. If groups fracture despite shared enemies, the default matters; if not, distrust rules.

  The third issue—collapsing into existing frameworks—is thorny. Their account isn't just conservatism vs reformism because it allows for left-wing conservatism (like defending unions) and right-wing radicalism (like libertarians dismantling regulations). But it risks mirroring education-sorted polarization. To avoid that, they'd need to show their theory explains realignments that education gaps can't—like why some high-education voters become reactionary.

  Biggest vulnerability? If the justificatory default becomes untethered from actual positions. If "presumptive suspicion of asymmetry" floats freely to justify any stance, it loses predictive power. They must anchor it to concrete historical patterns—e.g., left consistently questioning property rights, right defending them—even if policies shift.

  Also worth noting: Their adjacency/distrust model brilliantly explains why coalitions hold despite internal contradictions (e.g., libertarians and evangelicals). That's likely the theory's strongest hook. Maybe they should lean into that and treat the justificatory default as a supplementary heuristic rather than a core pillar.

  Final thought: The user's self-doubt is healthy. A theory that can't be falsified is useless for their practical needs. They should welcome counterexamples—like leftists defending inheritance tax exemptions for family farms—as opportunities to refine, not reject, the framework.
answer: |-
  Your account is sophisticated and captures real dynamics, but it faces significant challenges. Below, I rank counterevidence and conceptual weaknesses from **fatal** to **awkward**, with specific tests and concessions you should consider. Crucially, **Part 1 (justificatory default) is more vulnerable than Part 2 (adjacency/distrust)**, which aligns with your observation about the housing crisis.

  ### Fatal Flaws (Require Major Revision or Abandonment of Core Claims)
  1. **The Justificatory Default Flipping in Core Cases**  
     - **Counterexample**: The New Right (e.g., Trumpism, Brexiters) actively attacks established institutions (courts, civil service, international agreements) as "corrupt elites," treating *defense* of these institutions as suspect. Simultaneously, parts of the left (e.g., labor unions defending seniority systems, progressives protecting rent control) treat *disruption* of these asymmetries as suspect.  
     - **Why Fatal?** If the default can "reattach" to whatever side *currently holds* an institution ("left conservatism" defending welfare bureaucracies, right radicals attacking them), it becomes tautological. It predicts nothing about *which* asymmetries each side will defend/attack.  
     - **Concession Needed**: Admit the default is **not inherent to left/right** but contextual. The *same asymmetry* (e.g., state power) can be defended by the left in one context (social programs) and attacked by the left in another (police brutality). The core mechanism may be **which institutions each coalition currently controls or identifies with**.

  2. **The Justificatory Default as Ornament to Distrust**  
     - **Evidence from You**: Your housing crisis example suggests distrust (e.g., "landlords vs. tenants" narratives) drives cohesion, not abstract defaults.  
     - **Test**: Track intra-coalition conflict.  
       - **Prediction if Distrust Dominates**: Factions with conflicting justificatory defaults (e.g., left NIMBYs defending property asymmetry vs. YIMBYs attacking it) remain allied if they share a distrust target (e.g., developers/neoliberals).  
       - **Prediction if Default Dominates**: Such factions should splinter.  
     - **Result**: In most cases (e.g., US Democrats: pro-development progressives vs. anti-gentrification activists), shared distrust (of Republicans/capital) overrides default conflicts. **Concede Part 1 is secondary to Part 2.**

  ### Major Weaknesses (Undermine Predictive Power)
  3. **Collapse into Conservatism vs. Reformism**  
     - **Counterexample**: Libertarian right attacks established practices (drug laws, licensing) as fervently as the left attacks wealth asymmetry. The "default" here is identical: *existing state intervention* is suspect.  
     - **Why Weak?** Your account distinguishes itself by focusing on *asymmetries*, not change itself. But if the right attacks state-created asymmetries (regulation) and defends market-created ones (wealth), it’s still "defending spontaneous order" per your framework. This *is* classical conservatism (Hayek: "spontaneous order") vs. reformism.  
     - **Concession Needed**: Admit your account **reframes, not replaces**, this dichotomy. Its value is in explaining *why* specific asymmetries become salient.

  4. **Educational Sorting as the Real Driver**  
     - **Counterevidence**: In Western democracies, left-right alignment now correlates more strongly with education than class. High-education voters lean left on *both* cultural defaults (defending gender/racial asymmetry disruptions) *and* economic defaults (questioning wealth asymmetry).  
     - **Test**: Compare voters with similar education but different distrust targets. If highly educated conservatives share more policy defaults with low-education conservatives than with highly educated leftists, your account holds. Data (e.g., PEW surveys) often shows the opposite.  
     - **Concession Needed**: Educational attainment may **structure distrust targets** (e.g., universities as authority) and thus *indirectly* drive defaults. Your adjacency model (Part 2) survives; Part 1 may be epiphenomenal.

  ### Awkward Counterexamples (Can Be Explained but Strain the Model)
  5. **Asymmetry of Deserts**  
     - **Counterexample**: The left defends "deserved" asymmetries (e.g., affirmative action beneficiaries' status) while the right attacks "undeserved" ones (e.g., "welfare queens"). Both sides invoke desert but apply it to different groups.  
     - **Response**: This fits if "desert" is part of the justification demanded by the left for existing asymmetries. Awkward because the *right* uses desert rhetoric to *attack* asymmetries it deems unearned.

  6. **Non-Western Contexts**  
     - **Counterexample**: In post-colonial states, the right may attack colonial-era institutions (treating them as suspect asymmetries), while the left defends traditional cultural practices.  
     - **Response**: The "default" could still hold if the right defends *indigenous* spontaneous order and attacks *foreign-imposed* asymmetries. But this stretches definitions.

  ### Qualification into Unfalsifiability?  
  - **Risk**: If the justificatory default is redefined for each context ("the left questions asymmetries it *currently* dislikes"), it becomes unfalsifiable.  
  - **Is This Fatal?** **Yes, for your purposes.** If the model can’t predict *which* asymmetries each side will treat as suspect (beyond "whatever aligns with their coalition's distrust target"), Part 1 loses practical utility.  
  - **Fix**: Anchor the default to **core, enduring asymmetries**:  
    - *Left*: Persistent disparities in material resources/power.  
    - *Right*: Practices arising from voluntary exchange/tradition.  
    Then concede deviations (e.g., right attacking tradition) are strategic exceptions.

  ### Recommendations for Defense
  1. **Demote Part 1**: Frame the justificatory default as a **rhetorical tendency** emerging from coalitional interests (Part 2), not a foundational principle.  
  2. **Embrace Part 2 as Core**: Your adjacency/distrust model is robust and explains:  
     - Why "strange bedfellows" coalitions hold (e.g., libertarians + religious right united by distrust of state).  
     - Why realignment starts mid-coalition (e.g., working-class voters leaving left parties over cultural distrust).  
     - Your housing crisis observation.  
  3. **Use Historical Anchors**: Argue the justificatory default *originated* in material asymmetries (left) vs. tradition (right) but is now *instrumentalized* by distrust networks.  

  **Conclusion**: Your account’s fatal vulnerability is Part 1’s contextual flexibility. Part 2 is your strongest insight—**distrust targets and adjacency explain coalition cohesion better than abstract defaults**. Concede that the justificatory default is a contingent byproduct of coalition-building, not a stable first principle. This retains the model’s practicality while avoiding unfalsifiability.
