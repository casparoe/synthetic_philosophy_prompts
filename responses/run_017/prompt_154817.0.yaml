prompt: |-
  I write novels — the secondhand-bookstore kind, mysteries with a literary bent — and I have been having the same argument with my workshop and my readers for about three years now, about a character I can't seem to fix or drop. She's the one who gives everything away. The money, the promotion, the relationship, the kidney; she takes that pond argument literally and just never stops. I didn't set out to write a saint.

  The reactions split in a way I still find weird.

  Some readers: she is the best person in the book and the discomfort is the point, we're supposed to feel pricked. Others don't say unrealistic, they say drained — her life looks narrow and gray, they feel sorry for her, and they think whatever is impressive about her isn't the same thing as her life going well for her. Then there's a third group who cheerfully grant that she's morally flawless and say they wouldn't want to know her and feel nothing like admiration; to them it reads as a failure of character rather than an excess of it.

  What drives me up the wall is that these three get traded back and forth as if they were one argument, and nobody moves an inch. My hypothesis, which I'd like you to shoot down if it's wrong, is that the question everyone thinks they're arguing about is really three questions in one coat: how much morality actually demands, what makes a life go well for the person living it, and what we're even doing when we say we admire someone, if that's one attitude and not several with different objects. Or maybe it's verbal and everybody is using good person to mean something different.

  But here's the bit that makes me distrust my own intuitions and everyone else's. In a novel I control the camera. If I put the reader inside the cost — the missed trains, the calls not returned, the daily grind of it — and never show them the people who are better off because of her, they come back saying her life is sad and thin. If I show the beneficiaries, even in glimpses, they come back saying she's admirable and they feel ashamed. Same character, same behavior. I can flip the verdict by moving the point of view. Which makes me think a chunk of whatever is being treated as data in this argument isn't a judgment about moral sainthood at all, it's an artifact of how the example gets framed — and if the standard examples have a built-in framing asymmetry, the debate might be leaning on contaminated evidence.

  So why has this stalled? I've been pointed at the essay that kicked it off in the early eighties and at the literature on how demanding morality is allowed to be, and as far as I can tell everyone has read everyone and the positions haven't moved in forty years. Diagnose it, using what each side actually claims: verbal or substantive, a bedrock clash about what a good life is, a hidden empirical question nobody has bothered to check (would a real person who gave all that up actually end up depleted, or fine?), several questions under one heading, or a mix where different parts stall for different reasons. Tell me which pieces are seperable — could one get settled without the others — and be straight about what would count as progress here and whether anything realistically will.

  Two housekeeping things. Please keep clear which claims are settled among people who actually work on this and which are still a live fight; don't hand me one side's position wearing a consensus costume. And American English, please. Also, where you're guessing about my character rather than about the argument, say so — my workshop already has alot of opinions about her.
reasoning: |-
  Okay, the user is a novelist struggling with a character who's overly self-sacrificing, leading to polarized reader reactions. They've identified three distinct interpretations: admiration for her morality, pity for her depleted life, and rejection of her as a flawed character. The user suspects these stem from conflated philosophical questions about moral demands, well-being, and admiration. They also notice that framing—showing costs vs. benefits—sways reader reactions, suggesting the debate might be skewed by narrative techniques rather than substantive disagreement.  

  First, I need to unpack the three core questions they've pinpointed. The morality vs. well-being tension is classic in philosophy—Susan Wolf's "moral saints" essay directly addresses this, arguing that a life devoted solely to morality feels "unlivable." Then there's the well-being question: does her sacrifice lead to fulfillment or emptiness? Philosophers like Martha Nussbaum would say well-being requires multiple "capabilities," not just moral virtue. The admiration angle is trickier—readers might respect her principles but resent her if she makes them feel guilty, which is more psychological than philosophical.  

  The user's framing experiment is crucial. When the narrative focuses on her daily struggles (missed trains, isolation), readers see emptiness; when beneficiaries appear, they feel shame. This mirrors how philosophers use thought experiments—the famous "drowning child" scenario (Peter Singer) makes extreme sacrifice feel obvious, but it's framed to highlight benefits, not costs. If Singer described the donor's chronic fatigue, intuitions might shift. So yes, the stalemate partly stems from inconsistent framing in examples, muddying the debate.  

  Now, why has this been stuck for 40 years? The morality/well-being clash is fundamental—utilitarians (demanding sacrifice) and virtue ethicists (pushing for balance) won't reconcile because they prioritize different values. Empirical gaps also play a role: does constant giving *actually* deplete people? Psychology research on altruism shows mixed results—some givers thrive (sense of purpose), others burn out (no boundaries). But neither side in philosophy cites this; they rely on armchair assumptions.  

  Progress might involve separating the questions. We could agree that morality *demands* sacrifice (per utilitarianism) while admitting it *harms well-being* (per psychology), making admiration context-dependent. But this won't satisfy everyone—those craving moral heroes will still want the character to feel "rewarded," while realists will see her as tragic.  

  For the user's novel, the solution isn't fixing the character but *using* the ambiguity. Show both costs and benefits, then add characters who reflect the three reader reactions—e.g., one admires her, one pities her, one finds her insufferable. That exposes the conflated debates in-text, turning the stalemate into thematic depth. Philosophical resolution is unlikely, but art can hold the tension better than ethics papers.
answer: |-
  Here’s a diagnosis of the stalemate, breaking down the core issues, why they’re stuck, and what progress might look like – grounded in the philosophical debate and your observations:

  **The Core Problem: It’s Not One Question, It’s Three Tangled Systems**

  You’re fundamentally correct. The argument about your character is simultaneously debating three distinct, deeply contested philosophical questions, often using the same words ("good," "admirable," "well") with different meanings. Worse, these questions interact and amplify disagreements.

  1.  **The Demandingness Question:** *How much does morality actually require us to sacrifice?* Is giving away the kidney/money/promotion *morally obligatory* or *supererogatory* (beyond the call of duty)? This is the realm of Susan Wolf's "Moral Saints" (1982), critiques of utilitarianism (Singer's "drowning child"), and debates about impartiality vs. personal projects.
      *   **Settled?** **No.** This is a **live, central fight** in normative ethics. Utilitarians/consequentialists typically argue morality *is* extremely demanding. Deontologists/Virtue Ethicists often argue for significant "agent-centered prerogatives" allowing pursuit of personal goods. *Nobody agrees where the line is.*

  2.  **The Well-Being Question:** *What constitutes a "life going well" for the person living it?* Is it happiness? Meaning? Virtue? Achievement? Relationships? Autonomy? A balance? This is the domain of theories of well-being (hedonism, desire-fulfillment, objective list theories, eudaimonism).
      *   **Settled?** **No.** Another **core debate** in ethics and value theory. Does pure self-sacrifice *constitute* well-being (if virtue is the *sole* good)? Or does it inevitably *undermine* well-being by depriving the individual of other essential goods (relationships, achievement, rest, joy)? Your readers embody this clash: Group 2 sees deprivation; Group 1 might see her well-being *in* the sacrifice itself.

  3.  **The Admiration Question:** *What does "admiration" mean and what triggers it?* Is it recognition of moral worth *regardless* of personal cost? Is it inherently comparative ("I couldn't do that")? Does it require an element of perceived agency/choice vs. compulsion? Is it possible to recognize moral "goodness" while finding the *person* alienating or pitiable?
      *   **Settled?** **Less formally debated, but complex.** Psychology of admiration is messy. Group 1 feels compelled admiration. Group 3 recognizes the "flawless" label but actively *doesn't* admire, perhaps seeing pathology or lack of relatable agency. Group 2 feels pity, which is incompatible with straightforward admiration. **Crucially:** Your framing experiment proves **admiration is highly sensitive to narrative focus.** Benefit-focus triggers admiration/shame. Cost-focus triggers pity/alienation. This isn't just *what* she does, but *how we see it*.

  **Why the Stalemate? It's Substantive *and* Structural**

  1.  **Bedrock Clashes:** Questions 1 & 2 involve **fundamental, incompatible values**.
      *   If you believe morality *must* be supremely demanding (Question 1), then a character embodying that *is* morally ideal, even if her life seems "gray" (Question 2).
      *   If you believe well-being requires plural goods (Question 2), then extreme sacrifice *must* involve loss, making the character tragic or flawed, not wholly "good" in the life-lived sense.
      *   **These positions are axiomatic for many.** Consequentialists won't grant that personal projects *justifiably* trump saving lives. Pluralists about well-being won't grant that virtue alone *is* sufficient for a good life. **Negotiation feels like surrender.**

  2.  **Contaminated Evidence & Framing Asymmetry:** You've nailed this. The philosophical debate **relies heavily on stylized examples**, often framed to make a point:
      *   **Pro-Demandingness:** Focus on the *beneficiary's dire need* (drowning child, starving child). The cost to the agent is minimized or abstract ("some money," "minor inconvenience"). This naturally prompts admiration/obligation.
      *   **Anti-Demandingness/Pro-Plural Well-Being:** Focus on the *agent's cumulative sacrifice* (lost career, relationships, health, joy). The beneficiaries are abstract or their gains seem less tangible. This prompts pity or rejection.
      *   **Your novel proves this experimentally.** Moving the camera flips the verdict because it changes which "data" (costs vs. benefits) is salient. **The stalemate persists partly because each side uses examples framed to support their pre-existing view.** They aren't looking at the *same* picture of sacrifice.

  3.  **The Hidden Empirical Question (that gets ignored):** *Does a life of extreme, consistent self-sacrifice lead to depletion or flourishing **in real, complex human psychology/society**?* The philosophical debate mostly **ignores empirical psychology.**
      *   **Settled?** **No, and understudied in this context.** Psychology shows:
          *   Altruism *can* boost well-being (meaning, connection).
          *   **BUT** chronic, uncompensated sacrifice without boundaries leads to burnout, resentment, and poor mental/physical health ("pathological altruism" is a debated but relevant concept).
          *   Individual differences matter hugely (motivation, resources, support).
      *   **Why it stalls:** Philosophers often argue from idealized psychology or pure logic. Group 1 assumes the saint *must* be fulfilled by virtue. Group 2 assumes depletion is inevitable. Group 3 intuits psychological dysfunction. **Nobody's checking robust data on real human limits**, and even if they did, interpretations would clash (is burnout a moral failing? A societal failing? Proof sacrifice was *too* demanding?).

  4.  **Verbal Confusion:** "Good person" is used ambiguously:
      *   Group 1: Means "maximally morally virtuous."
      *   Group 2: Means "living a broadly flourishing human life."
      *   Group 3: Might mean "psychologically healthy/well-adjusted agent" OR "someone I find relatable/inspiring."
      *   They *are* often talking past each other.

  **Separability and Potential Progress:**

  1.  **Separable:** The Admiration Question (3) is the *most* separable. We *can* acknowledge that psychological responses to sacrifice (admiration, pity, alienation) depend heavily on framing and individual psychology, *without* resolving Questions 1 or 2. Recognizing this framing effect *is* progress. It explains why the same character elicits different reactions.
  2.  **Semi-Separable:** The Empirical Question *could* be investigated independently. Robust longitudinal studies on well-being in highly altruistic populations (e.g., certain caregivers, activists, aid workers) could inform *both* Q1 (how demanding *can* we realistically be?) and Q2 (what is the *actual* impact on well-being?). **This is the area where genuine, new progress is most feasible.**
  3.  **Least Separable (The Core Stalemate):** Questions 1 (Demandingness) and 2 (Well-Being) are deeply intertwined. Resolving one essentially requires taking a stand on the other:
      *   Conceding that extreme sacrifice undermines well-being (Q2) forces a redefinition of moral limits (Q1) to include agent-centered prerogatives.
      *   Insisting morality *must* be supremely demanding (Q1) forces a redefinition of well-being (Q2) to locate it solely in moral virtue or the happiness of others.
      *   **Progress here is unlikely to be consensus.** It might involve:
          *   **Refinement:** Better articulating *why* personal projects matter (Bernard Williams on "ground projects"), or *how* demandingness interacts with human psychology.
          *   **Hybrid Theories:** Attempts (like Wolf's) to define a "good enough" morality that leaves room for non-moral goods without abandoning the needy. These remain controversial.
          *   **Acknowledging Tragedy:** Recognizing that sometimes, moral duty *does* demand sacrifices that ruin individual well-being, and that this is a tragic fact, not a flaw in the agent *or* the theory. (This might resonate with your Group 2 readers).

  **What Realistic Progress Looks Like (For You & The Debate):**

  1.  **For Your Novel:** Embrace the ambiguity. You *can't* "fix" the character to satisfy all three groups because they represent incompatible values. Instead:
      *   **Make the tension the point.** Show the costs *and* the benefits vividly. Show other characters reacting *as your readers do* (admiring, pitying, rejecting). Explore *her* perspective – does *she* feel depleted, fulfilled, or conflicted? Does she *choose* this, or feel compelled? The power lies in holding the questions open, not resolving them. You're writing literature, not an ethics textbook.
      *   **Challenge the Framing:** Consciously manipulate the POV to *show* how perspective changes judgment. This meta-awareness can be powerful.
  2.  **For the Philosophical Debate:**
      *   **Concrete Progress:** Increased engagement with empirical psychology on altruism, burnout, and well-being. Moving beyond cherry-picked thought experiments.
      *   **Reframing "Progress":** Acknowledging the fundamental value clash (Q1 vs Q2) and abandoning the search for a single "correct" answer that satisfies everyone. Focusing instead on more nuanced questions: *When* is sacrifice required? *What* personal goods are most protected? *How* can societies structure demands to be sustainable?
      *   **Your Contribution:** Your framing experiment *is* a valuable contribution. It highlights how the *presentation* of sacrifice shapes moral intuition, suggesting the stalemate is partly an artifact of methodology. Philosophers *should* pay attention to this.

  **Diagnosis Summary:** The stalemate arises from a **substantive clash** between incompatible views on moral demandingness (Q1) and well-being (Q2), amplified by **verbal confusion** ("good person"), **ignored empirical questions** (real human limits), and **contaminated evidence** due to **framing asymmetries** (cost vs. benefit focus) in the examples used. Admiration (Q3) is highly context-dependent and reveals the framing effect. **Progress is possible on the margins** (empirical research, refining hybrid theories, acknowledging tragedy) and by **separating the questions**, but **core resolution on Q1 vs Q2 is unlikely** because it reflects a fundamental divide in human values about the self and others. Your novel’s power lies not in resolving this, but in illuminating it.
