answer: |-
  Here's your diagnostic spec for evaluating "bad faith" accusations in polarization disputes. The requirements are distilled from your pain points, ranked by importance for your purpose:

  ### Core Diagnostic Requirements (Non-Negotiables)
  1. **The Trusted Expert Exception**  
     *Must distinguish* between epistemic dependence (e.g., trusting your mechanic) and echo chambers. **Test:** Does the group actively *discourage* independent verification *and* punish engagement with counter-evidence? If yes, echo chamber. If no, it’s expert reliance. *(Addresses your mechanic/doctor paradox)*  

  2. **Sincerity vs. Indifference vs. Lying Triad**  
     *Must separate:*  
     - **Sincere error** (mistaken but open to correction)  
     - **Indifference to truth** (prioritizing goals over accuracy)  
     - **Intentional deception**  
     **Test for bad faith:** Does the actor avoid reasonable truth-seeking behaviors (e.g., acknowledging counter-evidence, updating when proven wrong)? Indifference/deception = bad faith. Sincere error ≠ bad faith. *(Prevents collapsing honest mistakes into malice)*  

  3. **Asymmetry Detection with Friction**  
     *Must allow* verdicts that one group is epistemically worse off *but only if*:  
     - They systematically reject reliable verification methods (e.g., peer review, data audits)  
     - AND they cannot point to specific, falsifiable corruption in opposing sources  
     **Test:** "Could this group identify being wrong?" If no → asymmetry valid. *(Blocks weaponization; requires evidence of broken epistemology)*  

  ### Essential Functional Requirements
  4. **Argument Encounter vs. Pre-emptive Distrust**  
     *Must differentiate*:  
     - **Isolation:** Arguments physically don’t reach them (algorithmic filtering, social segregation).  
     - **Immunization:** Arguments reach them but are dismissed via "debunking" narratives (e.g., "MSM lies," "academia is woke").  
     **Diagnostic:** Ask *how they’d react to a trusted insider endorsing the opposing view*. Isolation → surprise/curiosity; Immunization → immediate distrust of the *person*. *(Guides fixes: bridge-building vs. narrative dismantling)*  

  5. **The Unlabelled Arguments Gap**  
     *Must explain* why views don’t shift even when opposing arguments are rated "reasonable" unlabelled. **Not social psych’s problem** — a theory must predict this via:  
     - **Beliefs-as-identity:** Admitting error = tribal betrayal.  
     - **System distrust:** "This argument sounds logical, but their *sources* are corrupt." *(Reveals tribal epistemology > rational evaluation)*  

  6. **The Crank Researcher Test**  
     *Must not require* distinguishing "legitimate dissenters" from "delusional cranks" upfront. **Instead:** Identify *epistemic behaviors*: Do they engage with criticism? Offer testable claims? Document methods? Legitimate dissenters exhibit truth-seeking *behaviors* even when wrong. Cranks/echo chambers avoid falsifiability. *(Focuses on process, not correctness)*  

  ### Scope & Political Constraints
  7. **Person vs. Environment Split**  
     *Must treat* "bad faith (person)" and "echo chamber (environment)" **separately**. Conflation causes bad analysis.  
     - **Echo chamber:** Diagnosed via *systemic rejection of external epistemic checks*.  
     - **Bad faith actor:** Diagnosed via *individual refusal to engage truth-seeking norms*.  
     *(Punting is fine; combining them obscures accountability)*  

  ---

  ### Conflict Flags
  - **Tension between #3 (Asymmetry) and "Even-Handedness":** Demanding perfect symmetry is a *political preference*, not epistemic. Your diagnostic must allow asymmetric verdicts (#3) but with high barriers (#3’s friction).  
  - **Tension between #2 (Triad) and Simplicity:** Collapsing indifference/lying is tempting but fatal — it misdiagnoses laziness as malice.  
  - **Impossible?** No — but #3 (Asymmetry) is hardest. If evidence of systematic truth-avoidance is absent, asymmetry claims fail.  

  ---

  ### How Standard Stories Fare
  - **"Media Diet"**: Fails #1 (trusts experts ≠ echo chamber) and #4 (doesn’t distinguish isolation vs. immunization).  
  - **"Motivated Reasoning"**: Fails #2 (lumps sincere error with indifference) and #5 (doesn’t explain unlabelled-argument gap).  
  - **"Tribal Signaling"**: Passes #5, but fails #3 (can’t explain asymmetry) and #6 (cranks can signal tribe too).  

  **Most Disqualifying Requirement**: #2 (Triad). Most pundit theories conflate sincere error with bad faith, poisoning the well. Your diagnostic must ruthlessly separate them.  

  **Key for Your Piece**: Apply #1 (Expert Test) and #2 (Triad) first—they'll gut 80% of shallow bad-faith accusations. Then #3 (Asymmetry) for structural cases. The rest refine the diagnosis.  

  ---  
  This spec forces you to demand: **Proof of broken truth-seeking** (not just disagreement), **distrust of experts ≠ distrust of institutions**, and **epistemic behaviors over claims**. Good hunting.
