answer: |-
  ### Case Presentation
  In a dimly lit shipyard, two partially constructed ships rest in adjacent dry docks, each entirely obscured by identical, heavy tarpaulins. The dry docks are unmarked and symmetrically positioned, rendering left/right distinctions unreliable for the workers. Alice, needing to refer to one ship, gestures vaguely toward the nearer shape and declares, "Let's call that one 'Nautilus'." Bob, similarly unable to discern any features, points to the other and says, "And this one is 'Pequod'." They possess no knowledge of the ships' origins, materials, or identities, and no sortal or descriptive content—implicit or explicit—accompanies the naming. Weeks later, after removing the tarpaulins and consulting construction records, they learn that the Nautilus was laid down on January 1, 2020.

  **S**: The Nautilus was laid down on January 1, 2020.

  ### Check of Specifications
  1. **Realistic and unexotic setting**: The shipyard is ordinary, with no exotic elements.  
  2. **Bare demonstrative baptism**: The names are introduced solely by pointing ("that one," "this one"), with no sortal, identifying description, or contextual information available to fix reference (e.g., no usable location cues due to symmetry and poor lighting).  
  3. **Certain reference**: Alice and Bob know exactly which ship they designate at each use (via direct perceptual access during baptism and later re-identification), with no causal chains or uncertainty.  
  4. **Necessary a posteriori S**: S is an ordinary declarative sentence with no modals, indexicals, identity, natural-kind terms, or rigidified descriptions. Its necessity (if true) derives from the necessity of origin for ships (a contested essentialist premise), while its a posteriori status stems from empirical discovery of the laying-down date.  
  5. **Source of a posteriori-ness**: Ignorance concerns an essential property (origin date) of the directly designated object, not reference-fixing descriptions (none exist) or co-reference (only one name appears in S).

  ### Mechanism
  The a posteriori-ness arises from **epistemic ignorance of an essential property**, mediated by **direct reference fixation** (the names rigidly designate the objects via baptism, with no descriptive content). The necessity follows from the **essentiality of origin** (once fixed, the origin property holds necessarily).

  ### Theoretical Verdicts
  - **Millian Direct Reference (Causal-Historical)**:  
    - **Proposition expressed by S**: A singular proposition, ⟨Nautilus, being-laid-down-on-January-1-2020⟩.  
    - **Modal status**: Necessary (if true), as rigid designation and essentialism entail that Nautilus has this property in all worlds where it exists.  
    - **Epistemic status**: A posteriori, as the origin date is discovered empirically.  

  - **Epistemic Two-Dimensionalism**:  
    - **Proposition expressed by S**:  
      - *Primary intension*: Contingent; in a world considered as actual, it picks out whatever ship is fixed by the demonstration (e.g., "the ship demonstrated by Alice in the actual context"), which may not share the origin date.  
      - *Secondary intension*: Necessary (if true); in all counterfactual worlds, 'Nautilus' rigidly designates the actual ship, which must have been laid down on January 1, 2020, if S is true.  
    - **Modal status**: Necessary a posteriori (secondary intension is necessary).  
    - **Epistemic status**: A posteriori, as the primary intension's truth at the actual world requires empirical verification.  
    - **Step of divergence**: Millianism directly yields a necessary singular proposition, while two-dimensionalism relies on a primary intension constructed from the baptismal context (e.g., "the demonstrated ship"), which introduces contingency. Two-dimensionalism cannot derive the necessity without smuggling in a reference-fixing description from the context.

  ### Load-Bearing Feature and Test
  - **Key feature**: The bare demonstrative baptism with no available descriptive content.  
  - **Test with description-backed baptism**: Suppose Alice says, "Let's call the ship in dry dock 1 'Nautilus'" (using a description).  
    - **Result**: Both theories now agree on S's status (necessary a posteriori). Two-dimensionalism easily constructs a primary intension from the description ("the ship in dry dock 1"), explaining the a posteriori-ness as ignorance of which object satisfies the description. Millianism proceeds as before. The feature is load-bearing, as replacing it eliminates the challenge to two-dimensionalism.  

  ### Two-Dimensionalist Attack and Assessment
  - **Attack**: Two-dimensionalists might argue that the baptismal act itself provides an implicit reference-fixing description (e.g., "the ship demonstrated by Alice"), allowing a primary intension. They would assert this description was "available" in the context, satisfying specification 2.  
  - **Honest view**: This attack fails. The workers had no access to a description (e.g., no spatial or identifying markers were usable due to symmetry and poor lighting), and they relied purely on non-descriptive demonstrative acts. Imputing a description ("demonstrated by Alice") is a theoretical imposition, not an element of the speakers' epistemic or linguistic resources. Thus, two-dimensionalism cannot account for S's status without illicitly invoking descriptions, exposing a gap in its explanation of necessary a posteriori truths.  

  ### Essentialist Premise
  - **Contested premise**: The case assumes the **necessity of origin** for ships (that a ship's origin date is essential).  
  - **Weight**: This premise bears the entire burden of S's necessity. Without it, S would be contingent (e.g., the ship could have been laid down earlier or later). However, within the Kripkean framework (which the paper engages), this premise is standard and defensible. The case does not prove essentialism but shows how, if granted, it generates necessary a posteriori truths without reference-fixing descriptions.  

  This case cleanly satisfies all constraints and isolates the explanatory limitation of epistemic two-dimensionalism.
