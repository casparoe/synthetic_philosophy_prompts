prompt: |-
  I work in psychometrics, on large-scale educational assessment — I build, link, and equate latent scales for a living. My working vocabulary is item response models; item characteristic curves; person and item parameters expressed on a single logit scale; the fact that a latent scale is identified only up to a positive affine transformation and that something has to be fixed to pin it down (a reference population's mean and variance, a threshold parameter, an anchor item's difficulty); linking designs, including common-item nonequivalent-groups equating; measurement invariance, differential item functioning, and the graded business of establishing that an instrument means the same thing in two populations. I am fluent in all of that and I would like you to meet me there rather than in the vocabulary of moral philosophy.

  The thing I need translated is the philosophical dispute about interpersonal comparisons of utility — whether a claim like this policy takes more from her than it gives to him has any determinate content, and if so what it rests on. Please restate the main positions one by one in my terms. Here is how I have been provisionally formalizing them, and I would like you to work with my formalization, correcting it where it distorts:

  For each person i, suppose a utility function u_i, and suppose the only thing that is well defined is the family a_i + b_i · u_i with b_i > 0, where the person-specific origin a_i and unit b_i are unidentified. On this framing: the skeptical or ordinalist position says no restriction is available across persons, so only each person's own ordering is meaningful; unit comparability says the b_i can be set equal across persons while the a_i remain free, so differences in gain and loss are comparable but levels are not; level comparability says the a_i can be set equal too, so levels are comparable; full comparability adds a common zero. The so-called zero-one rule — setting each person's worst outcome to 0 and best to 1 — is a particular normalization. And there is the proposal that one gets interpersonal comparisons by asking a single judge to imagine herself in another person's position and register an extended preference over being that person in that situation, which I am inclined to read as a linking design: one respondent, two populations, and an imaginative simulation playing the role of the common item.

  Give me, for each position, what translates cleanly into my vocabulary, what has to be distorted to fit, and what cannot be said at all. Then the residue report, which is the part I actually want:

  Where the zero-one rule and the reference-population standardization differ. In my work the choice of origin and unit is a convention with no consequences: every substantive conclusion is invariant under the transformation, so nobody argues about it. In the utility case the choice of normalization appears to change which policy ranks first. Is that because the invariance class is different, because the social ranking is not invariant under person-specific affine transformations in the way my scale-based conclusions are, or because I am misdescribing the situation and the utility problem was never a problem of scale indeterminacy at all but a problem of choosing a numeraire or a standard of comparison across things that are not on one scale? Say which, and say what follows for how much of the philosophical dispute is really a measurement dispute.

  Whether extended-sympathy comparison is usefully thought of as common-item equating: what is the anchor, is the linking symmetric and transitive in the way my linking functions are required to be, and is the standard objection — that my imaginative simulation of being her is contaminated by my own psychology, my own risk attitudes, my own adaptation levels — best expressed as differential item functioning, as a failure of identification, or as something measurement theory has no name for?

  Whether there is a measurement model for utility at all. In my field a latent trait is inferred from indicators, with error, and comparability is an empirical hypothesis you test. In much of the philosophical literature utility is stipulated by the agent's preferences rather than measured, which means there are no indicators, no error, and nothing to test — so measurement theory would apply only vacuously. But when people use multi-item well-being or health-state instruments, there are indicators, and the philosopher's skepticism begins to sound exactly like a claim of non-invariance across respondents. Is that a genuine convergence or a category mistake?

  And the reverse direction: what does the philosophical debate contain that my vocabulary has no room for — the fact that utility is supposed to be defined by preference rather than indicated by it, the fact that the aggregation step is normative rather than statistical, the idea that a normalization can be unfair rather than merely arbitrary — and, equally, what does my field have that the philosophical literature seems never to take up: graded and partial comparability, testable invariance, and an actual technology for linking scales that were never designed to be linked?

  Finally, the decision this is in service of, so that the translation has somewhere to land: a committee I sit on is arguing about whether a single self-report item answered on a 0 to 10 scale may be averaged and summed across individuals and then used as a policy outcome, with the sums compared between groups. On your own translation, say whether that question has an answer of the sort my field already knows how to give, whether it has an answer at all, or whether the practice has to be justified by something outside measurement theory — and be explicit about which parts of your answer are consequences of the framework and which are your own view.
reasoning: |-
  We are going to address the user's request step by step. The user is a psychometrician working with latent scales in educational assessment, and they want to understand the philosophical debate about interpersonal utility comparisons in terms of their own measurement framework.

  The user has provided a provisional formalization of the utility comparison problem in terms of affine transformations (origin and unit) for each individual's utility function. They have also posed specific questions about how this relates to their field, including:

  1. How the philosophical positions (ordinalism, unit comparability, level comparability, full comparability) translate into their vocabulary, what distorts, and what cannot be said.

  2. The difference between the zero-one rule in philosophy and reference-population standardization in psychometrics, and why in utility the normalization choice seems to matter for policy ranking.

  3. Whether the extended-sympathy approach is like common-item equating, and how to classify the standard objection (as DIF, identification failure, etc.).

  4. Whether there is a measurement model for utility, and if the philosophical skepticism is like non-invariance.

  5. What the philosophical debate has that psychometrics lacks, and vice versa.

  6. The practical decision about using a single 0-10 self-report item for group-level policy evaluation.

  We will address each in turn.

  ### 1. Translation of Philosophical Positions

  We use the user's formalization: for person i, utility is defined up to an affine transformation: a_i + b_i * u_i, with b_i > 0.

  - **Ordinalism (Skeptical Position)**: Only the ordering within each individual is meaningful. In psychometric terms, each person's latent trait (utility) is measured on a separate scale with arbitrary origin and unit. There is no linking. Translation: This is like having separate unlinked IRT scales for each person. What cannot be said: In psychometrics, we usually assume that the same latent trait is being measured across persons, but here the ordinalist denies that there is any common trait to link. Distortion: In psychometrics, we typically aim for linking, so this position is a non-starter in practice for group assessments.

  - **Unit Comparability**: The b_i (units) can be set equal across persons, but the a_i (origins) remain arbitrary. Thus, differences (gains and losses) are comparable, but levels are not. Translation: This is like setting a common unit (e.g., same discrimination parameters in IRT) but allowing each person to have their own mean (origin). In psychometrics, we often fix the mean and variance of the latent distribution for identification, but here we fix the unit and leave the origin free. What cannot be said: In psychometrics, we usually fix both for a common scale, but here we are only comparing differences. Distortion: In psychometrics, we often have a common scale for both level and differences, but here levels are not comparable.

  - **Level Comparability**: The a_i (origins) are set equal, but the b_i (units) may differ. Translation: This is like setting a common origin (e.g., same threshold for all) but allowing each person to have their own unit (scale factor). This is less common in psychometrics because we usually standardize the unit as well. What cannot be said: In psychometrics, we typically require both for a common scale. This position is not standard in psychometrics.

  - **Full Comparability**: Both a_i and b_i are fixed (common origin and unit). Translation: This is the typical psychometric scaling: a common logit scale with fixed origin and unit. Everything is comparable.

  The **zero-one rule** is a normalization: for each person, set the worst outcome to 0 and the best to 1. This fixes the origin and unit per person arbitrarily. In psychometrics, we sometimes use such normalizations for individual scores (e.g., transforming to [0,1]), but we do not typically use it for linking because it does not use common items or populations. It is a person-specific transformation.

  The **extended-sympathy** approach: one judge imagines being in another's position. The user sees this as a linking design: one respondent (the judge) is used to link two populations (the judge's own situation and the other person's situation). The imaginative simulation is the common item. 

  - The anchor: The common item is the hypothetical situation (being in the other person's shoes). 
  - But note: In psychometrics, common items are usually the same items administered to both groups. Here, the "item" (the situation) is different: one is the judge's own, the other is the target's. So it's like two different items that are intended to measure the same latent trait in two different groups, but the judge is rating both. 
  - The standard objection is that the judge's own psychology contaminates the rating. This is like **differential item functioning (DIF)**: the same latent trait level does not yield the same response probability because the item (the situation) functions differently for the judge when imagining themselves in their own situation vs. the other's. But note: in this case, the judge is the same, but the items (situations) are different. Alternatively, we can think of it as a failure of invariance: the judge's rating of the target's situation is influenced by their own traits (e.g., adaptation, risk attitudes). 
  - However, there is a deeper issue: in psychometrics, we require that the same item be administered to both groups. Here, the two situations are not the same item. So the design is flawed. Moreover, the linking function is not symmetric or transitive because each judge might link differently. In psychometrics, we expect the linking function to be consistent across groups and over repetitions. This is not guaranteed here.

  ### 2. Zero-One Rule vs. Reference-Population Standardization

  In psychometrics, when we fix the mean and variance of a reference population, the choice is arbitrary and does not affect substantive conclusions (e.g., group differences, growth trajectories) because they are invariant under affine transformations. 

  In the utility case, the choice of normalization (like the zero-one rule) can change the policy ranking because the social welfare function (SWF) is not invariant to person-specific affine transformations. For example, consider a utilitarian SWF: the sum of utilities. If we apply a person-specific affine transformation, the sum becomes:

  Sum_i [a_i + b_i * u_i] = constant + Sum_i [b_i * u_i]

  This is not a monotonic transformation of the original sum (unless all b_i are equal and a_i are constant). Therefore, the ranking of policies by total utility can change.

  The key difference is that the psychometric scale is used for descriptive purposes (e.g., to report group differences), and we design the analysis to be invariant. But the SWF in the utility case is a function that aggregates individual utilities and is specified in a way that breaks the invariance. 

  Moreover, the utility problem is not just about scale indeterminacy but also about choosing a numeraire or a standard of comparison. The philosophical debate is about whether there is a unique, interpersonally valid way to set the a_i and b_i. 

  Thus, the philosophical dispute is not purely a measurement dispute. It is about the normative choice of a transformation that makes the utilities comparable for the purpose of social aggregation. In psychometrics, we avoid this by requiring invariance in the conclusions, but in the utility case, the social ranking is not invariant.

  ### 3. Measurement Model for Utility

  In the philosophical literature, utility is often defined by preferences (ordinal or cardinal). There are no indicators, no error, and hence no measurement model in the psychometric sense. The skepticism about interpersonal comparisons then becomes a problem of how to link the scales without any common items or without assuming that the scales are the same.

  However, when we use multi-item well-being instruments, we do have indicators and a measurement model. We can test for measurement invariance (e.g., using DIF analysis) to see if the instrument works the same way in different groups. The philosopher's skepticism then translates to a claim of non-invariance: the instrument does not measure the same latent trait in different populations.

  This is a genuine convergence: if we can establish measurement invariance, then we have a basis for interpersonal comparisons. But note: even with measurement invariance, we still have the affine indeterminacy. We fix the scale by setting a reference group's mean and variance, but that choice is arbitrary and does not affect group comparisons. However, for social aggregation (like summing utilities), the arbitrariness would matter.

  ### 4. What Each Field Lacks

  - **Philosophy has, psychometrics lacks**:
    - Utility defined by preference: In psychometrics, the latent trait is not defined by the responses but is a construct that the responses are indicators of. In philosophy, utility is often taken as a representation of preferences.
    - The aggregation step is normative: Deciding how to combine utilities (e.g., utilitarianism vs. egalitarianism) is a normative choice. Psychometrics does not deal with normative aggregation.
    - Normalization can be unfair: Setting the zero and unit might have ethical implications (e.g., if we set one person's worst outcome to 0 and another's to a different value, it might affect resource allocation). In psychometrics, normalization is arbitrary and without ethical content.

  - **Psychometrics has, philosophy lacks**:
    - Graded and partial comparability: Psychometrics has methods for testing and allowing partial invariance (e.g., some items are invariant, some are not). This is not much discussed in philosophy.
    - Testable invariance: We have statistical tests for DIF and measurement invariance.
    - Linking technology: Methods for equating scales using common items, populations, or other designs.

  ### 5. Practical Decision: The 0-10 Self-Report Item

  The committee is considering averaging and summing a single 0-10 self-report item across individuals and comparing groups for policy evaluation.

  - In psychometrics, a single item is highly unreliable and is not recommended for high-stakes measurement. We prefer multiple items to estimate a latent trait with less error.

  - But beyond reliability, the issue of interpersonal comparability arises. We must ask: is the scale being used in the same way by all individuals? Without any common items or invariance testing, we cannot know.

  - The user's framework: We have one item per person, but no common items to link the persons. This is like having separate unlinked scales for each person. Therefore, averaging and summing assume that the scale is the same for everyone (common origin and unit). But we have no way to test that.

  - Without invariance testing, we cannot justify interpersonal comparisons. The philosophical ordinalist would say that we cannot compare at all. However, in practice, such scales are used, but with caveats.

  - The psychometric answer: Without multiple items or a linking design, we cannot establish measurement invariance. Therefore, we cannot be sure that the scale is comparable. The practice is common, but it relies on an assumption of invariance that is untested.

  - However, if we assume that the single item has the same meaning for all (which is a strong assumption), then we can proceed. But note: even then, the affine transformation issue remains. If we set the origin and unit arbitrarily, then the average and sum are arbitrary. But in the case of a single bounded item (0-10), the bounds might serve as anchors. We might assume that 0 means the same (worst) and 10 means the same (best) for everyone. This is the zero-one rule applied to the same scale for everyone. Then, we have level comparability? Not exactly: because the unit might still differ (one person's 5 might be another's 7 in terms of the underlying latent trait). Without more information, we don't know.

  - Therefore, the psychometric field would say: this is a weak measure because it is single-item and lacks invariance evidence. The practice is not recommended for policy without further validation. But it is sometimes done, and the results are interpreted with caution.

  - My own view: The use of such a single item for group comparisons is common in social indicators research. It can provide a rough picture, but it should be supplemented with other measures and with tests of invariance if possible. The philosophical problems of interpersonal comparability are real, but in practice, we often assume that the scale is comparable when the context is similar and the item is simple. However, without multiple items, we cannot even estimate the reliability, which is a separate issue.

  ### Summary of Answers

  1. **Translation of Positions**:
     - Ordinalism: Separate unlinked scales. Distortion: We usually aim for linking.
     - Unit comparability: Common unit, free origin. Not common in psychometrics.
     - Level comparability: Common origin, free unit. Not common.
     - Full comparability: Common scale. Standard in psychometrics.

  2. **Zero-One Rule vs. Standardization**: 
     - The SWF breaks invariance. It's not just a measurement issue but a normative one.

  3. **Extended-Sympathy as Linking**:
     - The anchor is the simulation of the other's situation. 
     - The design is flawed (different items). 
     - Contamination is like DIF or a failure of invariance.

  4. **Measurement Model for Utility**: 
     - With multi-item instruments, we can test invariance. Philosophical skepticism is then like non-invariance.

  5. **What Each Field Lacks**:
     - Philosophy: normative aggregation, preference-based definition.
     - Psychometrics: partial comparability, invariance testing, linking technology.

  6. **Practical Decision**:
     - Psychometrics says: a single item is unreliable and we cannot test invariance. The practice is not well-supported by measurement theory. We recommend multiple items and invariance testing.

  Final note: The above answers are within the user's framework. My own view is that the practical use of single-item scales is common and can be informative, but it should be done with awareness of the limitations.
answer: |-
  ### Translation of Philosophical Positions into Psychometric Terms

  #### 1. **Ordinalism (Skeptical Position)**  
  - **Translation**: Each person's utility is a separate latent scale (logit scale) with unidentified origin \(a_i\) and unit \(b_i\). No linking exists across persons. Only within-person orderings (e.g., item characteristic curves for a single person) are meaningful.  
  - **Distortion**: In psychometrics, scales are often *designed* to be linked (e.g., via common items). Ordinalism denies this possibility, treating each person as a unique "population" with no shared anchor.  
  - **Cannot be said**: Psychometrics assumes latent traits are *comparable in principle* (if invariance holds). Ordinalism rejects this axiomatically.  

  #### 2. **Unit Comparability**  
  - **Translation**: \(b_i\) (units) are fixed to a common value (e.g., \(b_i = 1\) for all \(i\)), but \(a_i\) (origins) remain free. Differences in utility (\(\Delta u\)) are comparable, but absolute levels are not. Analogous to fixing item discriminations in IRT but allowing person means to vary.  
  - **Distortion**: In psychometrics, fixing the unit typically requires a reference population or anchor items. Here, it’s assumed without empirical justification.  
  - **Cannot be said**: Psychometrics tests unit comparability (e.g., via slope invariance in DIF analysis); this position assumes it *a priori*.  

  #### 3. **Level Comparability**  
  - **Translation**: \(a_i\) (origins) are fixed to a common value (e.g., \(a_i = 0\)), but \(b_i\) (units) remain free. Absolute utility levels are comparable, but gains/losses may not be. Like fixing the mean of the latent distribution but allowing variances to differ.  
  - **Distortion**: Rare in psychometrics, as scales usually require fixed units for meaningful comparisons of effects (e.g., treatment impacts).  
  - **Cannot be said**: Psychometrics rarely fixes origins without also constraining units (full comparability).  

  #### 4. **Full Comparability**  
  - **Translation**: Both \(a_i\) and \(b_i\) are fixed (common origin and unit). Utilities are on a single logit scale, like a fully equated latent trait.  
  - **Distortion**: Matches standard psychometric practice (e.g., setting \(\mu=0, \sigma=1\) for a reference group).  
  - **Cannot be said**: In philosophy, full comparability is often contested; in psychometrics, it’s a routine convention.  

  #### 5. **Zero-One Rule**  
  - **Translation**: A normalization: for each person, set worst outcome to 0 and best to 1. This fixes \(a_i\) and \(b_i\) per person but arbitrarily (no cross-person linking). Like person-specific scaling without a common anchor.  
  - **Distortion**: In psychometrics, this resembles within-person standardization (e.g., percentiles), but lacks the equating that links persons.  
  - **Cannot be said**: Psychometrics would view this as "pseudo-linking" — it imposes comparability without empirical evidence.  

  ---

  ### Residue Report: Core Questions  

  #### 1. **Why Normalization Affects Policy Rankings (vs. Psychometric Invariance)**  
  - **Your framing**: The social welfare function (e.g., total utility) is not invariant under person-specific affine transformations.  
  - **Key difference**:  
    - In psychometrics, all *substantive conclusions* (e.g., group differences, growth trajectories) are invariant under affine transformations because they rely on *relative* differences (e.g., effect sizes).  
    - In utility aggregation, the *ranking of policies* (e.g., utilitarian sum \(\sum u_i\)) depends on absolute values. For example:  
      - Original: \(\sum u_i\) ranks policy A > B.  
      - After transformation: \(\sum (a_i + b_i u_i)\) may rank B > A if \(b_i\) vary across persons.  
  - **Root issue**:  
    - **Not scale indeterminacy alone**. The problem arises because social welfare functions (e.g., utilitarianism) embed *normative choices* that break invariance. Fixing \(a_i\) and \(b_i\) is a **numeraire selection** — it defines "equal gain" or "equal sacrifice" across persons.  
  - **Consequence**:  
    - Philosophical disputes about normalization (e.g., zero-one rule vs. population standardization) are **not purely measurement disputes**. They involve ethical choices about what constitutes "comparable well-being." Psychometrics avoids this by focusing on *relative* comparisons.  

  #### 2. **Extended-Sympathy as Common-Item Equating**  
  - **Your analogy**: One judge (respondent) imagining themselves in another's position (common item) to link two populations (persons).  
  - **Assessment**:  
    - **Anchor**: The "common item" is the judge's *simulated experience* of being in the target person's situation.  
    - **Linking properties**:  
      - **Not symmetric**: Judge A imagining being person B ≠ Judge B imagining being person A (due to idiosyncratic biases).  
      - **Not transitive**: Inconsistent links across judges/persons.  
    - **Standard objection (psychological contamination)**:  
      - Best expressed as **differential item functioning (DIF)**. The "item" (simulated experience) functions differently across groups (judges) due to:  
        - Judge-specific traits (e.g., risk aversion) → **Non-invariance in item parameters**.  
        - Adaptation levels → **Impact on origin (\(a_i\))**.  
      - Unlike psychometric DIF, this cannot be tested empirically without circularity (no "true" utility criterion).  
  - **Verdict**: Extended-sympathy is a **flawed linking design**. It lacks the equating properties (symmetry, transitivity) required in psychometrics and is vulnerable to DIF.  

  #### 3. **Is There a Measurement Model for Utility?**  
  - **Preference-based utility (philosophy)**:  
    - Utility is stipulated from preferences (e.g., von Neumann-Morgenstern). No indicators, no error, no testable model. Psychometrics applies **vacuously** — no role for DIF or linking tests.  
  - **Multi-item well-being instruments (psychometrics)**:  
    - Utility is a latent trait with indicators (e.g., self-reports, behaviors). Comparability is testable via **measurement invariance** (e.g., MGCFA, DIF analysis).  
  - **Convergence or category mistake?**:  
    - **Genuine convergence** when indicators exist. Philosophical skepticism aligns with **non-invariance** (e.g., DIF across groups).  
    - But philosophy often rejects indicators, focusing on "true" utility (unobserved). This is **incommensurable** with psychometrics, which requires observable responses.  

  #### 4. **What Each Field Misses**  
  | **Philosophy → Psychometrics** | **Psychometrics → Philosophy** |
  |--------------------------------|--------------------------------|
  | - **Preference-defined utility**: Utility is *constituted* by choices, not measured by indicators. Psychometrics has no equivalent. | - **Graded comparability**: Psychometrics allows partial invariance (some items anchorable, others not). Philosophy rarely discusses this. |
  | - **Normative aggregation**: Summing utilities requires ethical justification (e.g., egalitarianism). Psychometrics is descriptive. | - **Testable invariance**: DIF analysis operationalizes skepticism. Philosophy lacks this toolkit. |
  | - **Unfair normalization**: Setting \(a_i, b_i\) may advantage some groups (e.g., if worst outcomes differ). Psychometrics treats normalization as arbitrary. | - **Linking technology**: Equating methods (e.g., common-item designs) are absent in philosophy. |

  ---

  ### Practical Decision: The 0-10 Self-Report Item  
  **Context**: Averaging/summing a single 0-10 item across individuals for policy comparisons.  

  #### Psychometric Answer (Within Your Framework)  
  - **Formally indefensible**:  
    - Single items lack reliability and cannot support invariance testing. No anchor exists to link persons.  
    - Affine indeterminacy (\(a_i, b_i\) unidentified) implies sums/averages are **meaningless** for interpersonal comparison.  
    - Example: If person A uses 0–10 linearly and person B uses a concave scale, sums are non-comparable.  
  - **What psychometrics would do**:  
    - Treat the 0–10 scale as ordinal, not interval (no support for averaging).  
    - Require multi-item instruments, DIF testing, and population standardization for comparability.  

  #### Philosophical Complications  
  - **Normative aggregation**: Even if comparable, summing utilities for policy may be ethically contested (e.g., ignores distribution).  
  - **Numeraire problem**: The 0–10 scale implicitly sets a common origin (0) and unit (1), but this assumes level and unit comparability — untestable with one item.  

  #### My View (Explicitly Separated)  
  - **Framework consequence**:  
    - Psychometrics rejects the practice. Single-item scales are unreliable and non-invariant by design.  
  - **Own view**:  
    - **Pragmatically common** but **epistemically unjustified**. Use only if:  
      1. Treated as ordinal data (non-parametric tests).  
      2. Supplemented with robustness checks (e.g., sensitivity to affine transformations).  
    - **Without invariance evidence, conclusions are conventions, not measurements.**  

  ### Final Summary  
  - **Philosophy ↔ Psychometrics**: Genuine overlap in invariance concerns, but philosophy embeds normative choices psychometrics avoids.  
  - **Core divergence**: Psychometrics *resolves* indeterminacy via conventions; philosophy *debates* whether resolutions are ethically defensible.  
  - **Your committee decision**: Psychometrics already answers it — the practice is invalid without anchors and invariance testing. Philosophical objections reinforce this but add ethical weight.
