  ## Coffee & Closure: A Tracking Tussle

  **Setting:** Philosophy Department Common Room. Fluorescent lights hum. Half-empty coffee cups steam on a table littered with seminar handouts. NADIA (early 40s, animated, gesturing with her own cup) leans against the back of a worn armchair. OWEN (late 30s, intense, methodical) stands opposite, arms folded, a slight frown on his face. The last stragglers from the scepticism seminar have just left.

  **OWEN:** ...so that’s why I think we *should* embrace the closure failure, Nadia. It’s a feature, not a bug. It captures the genuine fragility of knowledge when you start prying at the foundations. Your 'evidence-anchored' sensitivity – it feels like a dodge. Like you’re trying to sneak closure back in through the back door by redefining what the relevant possibilities are.

  **NADIA:** (Leans forward, setting her cup down emphatically) A dodge? Hardly! Owen, the *point* is that the standard tracking condition mislocates the relevant alternatives. It anchors the sensitivity condition directly to the *target proposition* – “If p were false, S wouldn’t believe p”. But that throws the net too wide! It drags in utterly irrelevant worlds where the *entire epistemic situation* is different. My move anchors it to the *evidence the subject actually possesses and bases the belief on*. The relevant question becomes: *given this specific evidence and how I’m using it*, does it hold? Not: is there *any* possible world where p is false and I believe it? That’s chaos.

  **OWEN:** (Unfolds arms, steps closer) Right, but that’s precisely where your fix either collapses or begs the question. What *is* this ‘evidence’ you’re anchoring to? Is it factive? Does ‘S has evidence E’ entail that E is true? Because if it *is* factive…

  **NADIA:** (Interrupting) …then in the nearest worlds where I have that very evidence E, E is true. Obviously. But that doesn’t mean the modal condition does no work! It still rules out worlds where, *despite E being true*, my belief-forming process goes haywire *relative to E*. It’s about the connection between the evidence and the belief *based specifically on it*.

  **OWEN:** (Shakes his head, picks up his mug) Let’s cut to the chase. If evidence *is* factive, then anchoring to it makes your sensitivity condition *trivially* satisfied for any p that’s entailed by E. Because in *all* worlds where S has E (which entails E is true), and E entails p, p is true! The subjunctive becomes redundant. You’ve just smuggled in infallibilism about evidence and gotten closure by definition – it’s evidentialism in a cheap Halloween costume. Remember Marianne?

  **NADIA:** (Nods) Of course. Lab, barometer, seismograph, deduces she’s not hallucinating the readouts. Intuition says she knows. Your purist tracking has a problem: the nearest world where she *is* hallucinating the readouts? She might still believe she’s not, based on the hallucinated data! So, according to you: ~Hallucinating → she wouldn’t believe she’s not hallucinating? False! Closure fails, she doesn’t know she’s not hallucinating, hence maybe doesn’t know the readings? That’s nuts.

  **OWEN:** (Sips coffee, grimaces slightly at the temperature) Maybe we *should* bite that bullet. Maybe her deduction is clever but doesn’t generate *knowledge* of non-hallucination precisely because the tracking condition fails for that proposition. But that’s not my preferred move here. I say the *methods* matter. She’s using *two independent instruments*. The nearest world where she *is* hallucinating the barometer readout? Well, she’d likely have a conflicting seismograph readout, or question the coherence. The method – checking *both independently* – *is* sensitive to hallucination errors for *individual* instruments. The deduction *about the hallucinations themselves* might be insensitive, but the foundational instrumental beliefs are sensitive via their methods. Closure holds locally for *that chain*.

  **NADIA:** (Holds up a hand) Hold on! You’re gerrymandering the method *again*, Owen! “Using both instruments independently to deduce non-hallucination” – you’re baking the conclusion *into the method description* to make the sensitivity work! That’s cheating! My way is cleaner: Marianne’s evidence – the specific barometer reading B, the specific seismograph reading S, her background knowledge K about how they work and are wired. She bases her belief *not hallucinating (H)* on {B, S, K}. Now, the relevant worlds: the nearest worlds where she *has that very evidence* {B, S, K}. Since the evidence includes the *actual* readings (which are veridical), and K, in *those* worlds, H *is* false. Because if she *were* hallucinating, she wouldn’t *have* that specific veridical evidence set! She’d have *different* apparent readings. Anchoring to the *actual evidence* screens off the hallucination worlds as *not* worlds where she possesses *this* evidence.

  **OWEN:** (Sets his mug down sharply) Ah! But *which* evidence, Nadia? You just breezed past that. Is her ‘evidence’ *everything* she knows? Every justified belief? Is it just the sensory inputs? The propositions she consciously entertained during the deduction? What if her background knowledge K *includes* the belief that she’s not a brain in a vat (BIV)? If evidence is factive and includes *everything justified*, then anchoring to it makes her trivially sensitive to ~BIV! Because the nearest worlds where she has *that* total evidence set? BIV is false in all of them! Your view *would* hand her knowledge that she’s not a BIV for free! And if evidence *isn’t* factive…

  **NADIA:** (Takes a deep breath) Okay, fair push. This is crucial. Evidence *isn’t* inherently factive on my view. That’s the mistake you keep tempting me towards. The evidence she possesses for the belief *that H is false* is the *phenomenal* character of the readouts and her background knowledge – call it E_phen. It’s the seemings: *apparent* barometer reading B_app, *apparent* seismograph reading S_app, K. This evidence does *not* entail ~H. A hallucinating Marianne has *identical* E_phen.

  **OWEN:** (Leans in, a glint in his eye) So? Then the closure failure comes roaring back! The nearest worlds where she has E_phen and ~H is false (i.e., she *is* hallucinating)? She still believes ~H based on E_phen! Her belief that ~H is *insensitive* on your evidence-anchored view! You haven’t solved Marianne; you’ve just relocated the problem. She *still* doesn’t know ~H on your view if evidence is phenomenal!

  **NADIA:** (Points a finger) Not so fast! Here’s the distinction: The sensitivity condition for her *instrumental beliefs* (e.g., belief in the barometer reading based *just* on the visual seeming) *fails* if anchored to the proposition. But anchored to the *evidence for that specific belief* – the visual seeming itself? The nearest worlds where she has *that* visual seeming and the barometer *isn’t* reading B? Well, if it’s a reliable instrument, those worlds *are* distant – she *wouldn’t* get that seeming unless the instrument read that. Sensitivity holds for the instrumental belief *relative to its evidence anchor*. Crucially, her belief *that H is false* is *not* based *only* on the phenomenal evidence E_phen! It’s based on the *deduction* from the *content* of B_app and S_app (which she takes as veridical *because* she justifiably believes the instrumental beliefs), plus K. The evidence anchor for ~H is the *justified beliefs* in the instrumental readings and K. *Those* are factive! Worlds where she has *those justified beliefs*? The instruments *were* working, so H was false. Her belief in ~H *is* sensitive relative to *that* evidence anchor – the justified premises of her deduction.

  **OWEN:** (Steps back, runs a hand through his hair) Hmph. So evidence is a mix? Phenomenal seemings for foundational stuff, factive justified beliefs for deduced stuff? That feels messy, Nadia. Dangerously close to letting the conclusion dictate the evidence set. And how do you block the BIV knowledge? If her evidence for ~BIV includes justified beliefs about the external world derived from seemings... which were derived reliably... then anchoring to *that* evidence makes ~BIV sensitive? Worlds where she has *that* rich external world evidence? BIV is false. Boom, she knows she’s not a BIV.

  **NADIA:** (Sighs) You’re pushing me towards global skepticism again. No. The evidence anchor for ~BIV *can’t* be her entire web of justified external world beliefs because *those beliefs themselves depend on the absence of BIV scenarios for their justification*. The ‘evidence’ for a foundational presupposition like ~BIV isn’t a set of *other* justified beliefs; it’s the *entire reliable system* generating seemings and beliefs. The relevant sensitivity question for ~BIV isn’t anchored to specific evidence propositions; it’s anchored to the *global method* – perception/cognition operating normally. The nearest worlds where perception/cognition *is* operating normally and she’s a BIV? Impossible. Normal operation entails ~BIV. Sensitivity holds vacuously, but that’s okay for hinges. Marianne *doesn’t* deduce ~BIV from her instruments; it’s presupposed. My view gets Marianne knowing ~H via deduction from sensitive instrumental beliefs, *without* handing her easy ~BIV knowledge, because ~BIV isn’t a *deduced* proposition from localized evidence.

  **OWEN:** (Picks up his cold coffee, stares into it) I see the shape. But I still think you’re blurring lines. You’re anchoring sometimes to seemings, sometimes to justified beliefs, sometimes to global methods... it feels ad hoc to save closure. My way is simpler: stick to propositional anchoring. Accept that closure fails *sometimes*, like when you try to deduce your way out of radical error possibilities directly relevant to the method. Marianne’s deduction *is* clever, and she knows the instrumental readings, but she doesn’t *trackingly know* ~H – she just has a justified true belief that’s *safe*, perhaps, but not *sensitive*. We explain the intuition by stressing the safety and justification. We need to educate our intuitions about the limits of tracking.

  **NADIA:** And I think your way sacrifices too much intuitive knowledge – like Marianne knowing she’s not hallucinating *in that specific, local way* – on the altar of theoretical purity. My evidence-anchoring respects the *local* context of justification and deduction. It’s more nuanced, yes. Maybe messy. But necessary.

  **OWEN:** (A small concession) Alright. Conceded: anchoring *exclusively* to the target proposition can sometimes pull in irrelevant global skeptical worlds. A bit of anchoring to the *local method* might be needed to fix relevance. But I think you’ve conceded the core point: if you want closure for deduced propositions, you *must* anchor to factive evidence – the justified premises – for the deduction step. And that means the sensitivity condition for the conclusion *is* parasitically safe, not robustly sensitive in the way tracking originally promised.

  **NADIA:** (Concedes a point) Fair. Anchoring to non-factive seemings alone *won’t* get you closure for deduced propositions. You *do* need the factivity of the premises for the deduction to transmit sensitivity. But that’s how deduction *works*! The original tracking condition misdiagnoses the failure. The fix isn’t vacuous; it refocuses sensitivity on the actual justificatory base. What would move me? A clear case where sensitivity anchored to the *actual evidence base* (factive or not, as appropriate) delivers a closure failure we *should* accept. What would move you?

  **OWEN:** (Finishes the cold coffee) A clean, non-question-begging way to individuate the ‘evidence anchor’ for complex beliefs that doesn’t rely on the subject’s explicit reasoning or risk collapsing into safety or evidentialism. Show me how evidence-anchoring explains something propositional-anchoring gets *wrong*, not just something it finds inconvenient. Otherwise, I still think the purity captures a deep truth about knowledge’s modal fragility. But... (manages a slight smile) ...I’ll think more about local evidence anchors. Seminar next week?

  **NADIA:** (Returns the smile) Count on it. Try not to freeze all knowledge in the meantime.

