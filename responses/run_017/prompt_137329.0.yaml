  The central case involves sparse autoencoders that find directions in a language model's residual stream. These directions vary with training hyperparameters but show some stability. The key question is whether these directions are natural kinds or artifacts.

  I need to find a consistent reading of the collaborator's principles that fits all seven cases. Possible candidates:
  1. Causal structure: Natural kinds must share underlying causal mechanisms.
  2. Induction licensing: Natural kinds support reliable inductive generalizations.
  3. Mind-independence: Natural kinds exist independently of human interests/instruments.

  Analyzing the cases:
  - Water/gold: Strong causal structure and induction licensing, mind-independent.
  - Biological species: Causal structure through lineages, supports induction, somewhat mind-independent.
  - Jade: Lacks unified causal structure (two minerals), fails induction (properties differ).
