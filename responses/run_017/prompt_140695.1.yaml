  Now the serious errors... The claim that misinterpretation isn't a factor in the crisis is empirically wrong - that's Error 1. In part (c), saying Bayesian methods remove "most of the crisis" ignores implementation barriers - Error 2. Also, the student incorrectly implies Bayesians can't p-hack - Error 3.

