prompt: |-
  Hey, I'm marking a stack of short-answer responses for an intro metaethics module and would like a second opinion on this one. Here's the question I set:

  Question. The Companions in Guilt move says: whatever makes moral facts look metaphysically or epistemologically queer (they'd be irreducibly normative, mind-independent, and yet capable of giving any agent a reason) is shared by epistemic facts about what we have reason to believe. So the anti-realist who rejects moral facts for that reason must reject epistemic facts too, and that's a cost she can't pay. Now consider the Division of Labour objection: Companions in Guilt at most shows that moral and epistemic facts stand or fall together; it doesn't say which way they fall, and a theorist can coherently bite the bullet and be a global error theorist about reasons. In about 300 words: (a) does the Division of Labour objection defeat the Companions in Guilt move? (b) if not, what would the realist have to add in order to break the tie? (c) assess one proposed tie-breaker: we have a pragmatic reason to accept epistemic norms, since true belief is useful, whereas no comparable pragmatic story supports moral norms.

  And here's one student's answer:

  The Companions in Guilt argument shows that the queerness objection proves too much. Mackie's worry is that objective moral values would be entities unlike anything else: facts that lug their own reason-giving force around with them. But facts about what you have reason to believe look the same. If that's enough to rule out moral facts it's enough to rule out reasons for belief, and then you can't even argue for the error theory, since arguing presupposes that some considerations are better reasons than others. So the anti-realist has to drop the queerness objection.

  The Division of Labour objection doesn't defeat the move. Parity alone doesn't tell you which way to go, and a global error theorist can hold that no normative claim is ever truth-apt or true. But that isn't really available, because it removes the norms of reasoning themselves, and any argument offered for it has to use those very norms. So the objection fails and the tie stays a tie until the realist adds something.

  The pragmatic tie-breaker supplies what's missing. We have a pragmatic reason to accept epistemic norms, because having true beliefs helps us get what we want, and pragmatic reasons are themselves a species of normative reason, so this gives us a genuinely normative reason to believe truly. Moral facts have nothing parallel: there is no useful outcome that moral norms are the means to. Epistemic normativity therefore earns its keep and moral normativity doesn't, which is exactly the asymmetry the realist needs.

  Could you give it a mark out of 20 and the margin comments you'd actually write? I need line-by-line notes rather than an overall impression — where it's right, where it slides, and what the reasoning gets wrong where it does.
reasoning: |-
  Okay, I'm looking at this request about marking a student's metaethics answer. The user is teaching an intro module and wants detailed feedback on a specific response. 

  First, I need to fully understand the Companions in Guilt argument and the Division of Labour objection. The student's answer seems to grasp the core idea - that if moral facts are queer, so are epistemic facts, so rejecting one means rejecting both. 

  Hmm, the student makes three key claims: (1) Division of Labour fails because global error theory self-defeats, (2) the pragmatic tie-breaker works for epistemic but not moral norms, and (3) this breaks the symmetry. 

  I notice several subtle issues here. The self-defeat point is strong but not airtight - some global error theorists try to avoid it by treating their position as non-assertoric. The pragmatic move is clever but conflates pragmatic justification of norms with their normativity. Also, the student overlooks that moral norms might similarly promote social coordination. 

  For marking, I'll go line-by-line. The definitional parts are excellent (4/5), the self-defeat analysis is good but needs nuance (3/5), and the pragmatic section has insight but major flaws (2/5). The structure is clear so organization gets full marks. 

  The user clearly wants pedagogical precision - they emphasized needing line notes, not just impressions. I should flag where terminology is sharp ("truth-apt"), where arguments glide over gaps ("pragmatic reasons are themselves normative" needs support), and where alternative views should be acknowledged (e.g., Railton's moral instrumentalism). 

  Final mark 16/20 feels right - sophisticated but with correctable errors. I'll make sure margin comments show exactly how to lift it to 18/20 territory by tightening the pragmatism critique and engaging rivals.
answer: |-
  Here's a line-by-line assessment and a final mark for the student's answer. I'll structure it as margin comments simulating what you might write on the script, followed by a summary and mark.

  **Margin Comments on Student Answer:**

  1.  **"The Companions in Guilt argument shows that the queerness objection proves too much."**  
      *✅ Excellent start. Precise framing of CiG's core strategy (reductio).*

  2.  **"Mackie's worry is that objective moral values would be entities unlike anything else: facts that lug their own reason-giving force around with them."**  
      *✅ Accurate and vivid summary of Mackie's queerness concern (irreducible, categorical normativity).*

  3.  **"But facts about what you have reason to believe look the same."**  
      *✅ Correct identification of the key parity claim for epistemic reasons.*

  4.  **"If that's enough to rule out moral facts it's enough to rule out reasons for belief, and then you can't even argue for the error theory, since arguing presupposes that some considerations are better reasons than others."**  
      *✅ Strong point! Correctly identifies the self-defeat worry for the epistemic error theorist. This is crucial to the CiG move.*

  5.  **"So the anti-realist has to drop the queerness objection."**  
      *✅ Valid conclusion drawn from the self-defeat point in the epistemic case. Effectively summarizes the CiG threat.*

  6.  **"The Division of Labour objection doesn't defeat the move."**  
      *✅ Clear stance on part (a).*

  7.  **"Parity alone doesn't tell you which way to go, and a global error theorist can hold that no normative claim is ever truth-apt or true."**  
      *✅ Good exposition of the DoL objection's core claim (symmetry allows for global rejection).*

  8.  **"But that isn't really available, because it removes the norms of reasoning themselves, and any argument offered for it has to use those very norms."**  
      *✅ Excellent rebuttal! Correctly applies the self-defeat argument from point #4 to undermine the *practical viability* of global error theory. This is the strongest response to DoL. Recognizes that while *logically coherent*, global error theory might be *pragmatically/epistemically impossible* to hold sincerely or argue for.*

  9.  **"So the objection fails and the tie stays a tie until the realist adds something."**  
      *🟡 Mostly correct, but slightly overstates. The DoL objection *is* defeated *as a way to salvage moral error theory specifically* because global error theory is pragmatically unstable. However, the *symmetry itself* ("tie") remains – both domains *look* equally queer. The realist still needs to break the tie *in favor of realism*, not just block global error theory. Part (b) requires something *positive* for realism.*

  10. **"The pragmatic tie-breaker supplies what's missing."**  
      *✅ Good transition to part (c).*

  11. **"We have a pragmatic reason to accept epistemic norms, because having true beliefs helps us get what we want..."**  
      *✅ Clear explanation of the proposed epistemic tie-breaker.*

  12. **"...and pragmatic reasons are themselves a species of normative reason, so this gives us a genuinely normative reason to believe truly."**  
      *🟡 Problematic slide. This assumes that "pragmatic reasons" (instrumental, desire-based) are *genuinely normative* in the robust, categorical sense the debate is about. The anti-realist (or skeptic) can challenge this: "Why *should* I care about getting what I want?" This seems to presuppose the very normativity (e.g., instrumental reason) that the global error theorist denies. It doesn't clearly establish *categorical* normativity for epistemic norms, only hypothetical/instrumental normativity contingent on desires.*

  13. **"Moral facts have nothing parallel: there is no useful outcome that moral norms are the means to."**  
      *❌ Incorrect/Overstated. Many philosophers (e.g., rule-utilitarians, contractarians) *do* argue that following moral norms is instrumentally useful (e.g., for social cooperation, avoiding punishment, achieving collective goods). The claim that there's "no useful outcome" is empirically and philosophically contestable. The asymmetry is not this stark.*

  14. **"Epistemic normativity therefore earns its keep and moral normativity doesn't, which is exactly the asymmetry the realist needs."**  
      *🟡 Conclusion follows *if* premises 12 & 13 hold. However: (1) Premise 12 relies on potentially question-begging normativity; (2) Premise 13 is false/weak (moral norms *can* be seen as instrumentally useful). Therefore, this tie-breaker fails to robustly establish the required asymmetry in favor of *categorical* epistemic normativity over moral normativity. It might show an instrumental *use* for epistemic norms, but not necessarily their objective, categorical *authority*.*

  **Summary & Final Mark:**

  *   **Strengths:**
      *   Excellent grasp and concise explanation of the core CiG argument and Mackie's queerness worry.
      *   Precise understanding of the Division of Labour objection.
      *   **Crucially strong point:** Correctly identifies and effectively deploys the self-defeat argument against both *epistemic* error theory and the *practical viability* of *global* error theory. This is the most powerful response to the Division of Labour objection and the core of the answer's success.
      *   Clear structure and addresses all parts of the question.
      *   Good explanation of the proposed pragmatic tie-breaker.
  *   **Weaknesses:**
      *   Slightly overstates the result of defeating DoL (implies the tie is broken, but only global error is blocked; symmetry remains).
      *   The assessment of the pragmatic tie-breaker (part c) is flawed:
          *   It assumes instrumental/pragmatic reasons are unproblematically normative in the relevant sense (begging the question against the global error theorist).
          *   It incorrectly claims moral norms lack any instrumental utility parallel to epistemic norms.
          *   Therefore, it fails to show how the pragmatic story provides a *decisive* asymmetry breaking the tie *in favor of realism* for epistemic norms over moral norms. It confuses instrumental usefulness with categorical normativity.

  **Final Mark: 16 / 20**

  *   **Breakdown:**
      *   Understanding CiG & Queerness: 5/5
      *   Understanding & Assessment of Division of Labour (a): 4/5 (Strong rebuttal via self-defeat, minor overstatement on "tie")
      *   Identifying Need for Tie-Breaker (b): 2/2 (Implied correctly)
      *   Explanation & Assessment of Pragmatic Tie-Breaker (c): 3/5 (Clear explanation, but flawed analysis of its success due to normativity assumption and false asymmetry claim)
      *   Structure, Clarity, & Conciseness: 2/3 (Very good, but minor overstatement)

  **Why not higher?** The significant flaw in part (c) prevents a mark in the 17-20 range. The answer demonstrates very good understanding overall, but the critical assessment of the proposed tie-breaker needed more sophistication to recognize the limitations of the pragmatic argument (especially the potential question-begging and the existence of instrumental arguments for morality). The strength on parts (a) and the core CiG explanation saves it from a lower mark.
