prompt: |-
  I'm in a joint philosophy/politics seminar on democratic theory and we did the boundary problem last week — who has to be in the demos for a decision to be legitimately democratic. The tutor basically said the problem is insoluble in principle because any rule for drawing the circle presupposes a circle already drawn, and that felt like a cop-out, or at least like something I want stated as a result rather than asserted as a shrug. So before I go back to the standard answers (the all-affected interests line, the all-subjected/coercion line, the "the people constitute themselves" constitution-making line) I want the spec first: what would a theory of the demos's boundaries actually have to deliver to count as adequate?

  Fix the purpose so this isn't just armchair: I want the theory to be good enough to be written into a constitution's rules about the franchise for a binding referendum — including a secession referendum and a merger/joining referendum, not just ordinary elections. So it has to be usable by an actual electoral commission with a deadline, in a situation where people are arguing about who counts, and where nothing authoritative has yet settled whether a given group is inside or outside. Give me the desiderata list with the case or consideration behind each one, and mark which are non-negotiable and which are really preferences of one camp dressed up as requirements — I strongly suspect "it must yield a unique determinate answer for every person" is a prejudice rather than a requirement, but I don't trust myself on that. Cases I want covered: the long-term undocumented resident whose kids are in local schools; the cross-border commuter who pays tax in one jurisdiction and uses services in another; the non-resident citizen who owns property but hasn't lived there in twenty years; children; prisoners; future people who eat the costs of a hundred-year infrastructure or waste decision; and people abroad who are badly affected by this state's emissions or sanctions but are subject to none of its laws. Two requirements I've half-invented and want you to test rather than just accept: (1) the self-induced-affectedness filter — if a state unilaterally extends its reach over people (annexation, occupation, sanctions), it doesn't get to count them as members of its demos on the grounds that they're now affected by it; and (2) the who-counts-the-counters requirement — the criterion must not be such that whoever controls the residency register or the ID rules effectively picks the demos, since then it's not a criterion at all.

  Then the part I most want: tell me which subset of the desiderata you think can't be jointly satisfied, and be explicit that this is a result about the list rather than a failure of imagination — I'd guess the real trap is between "the demos has to be able to authorise itself" and "no body gets to certify its own constituency," but argue it rather than agreeing with me. And say which single requirement does the most work in knocking out otherwise popular answers. A very short scorecard against the three standard answers at the end is fine, but keep the weight on the criteria. Please also flag how confident you are in each thing you assert: which of your desiderata you'd actually defend under pressure, what argument or case would make you drop or add one, and where your reasoning is most likely to have smuggled in a substantive theory of legitimacy. I can fill in readings myself, so no citations.
reasoning: |-
  Hmm, this philosophy/politics student is tackling the boundary problem in democratic theory - the question of who should be included in the demos for a decision to be legitimate. They're frustrated with their tutor's claim that it's insoluble, and want to develop rigorous criteria for a real-world constitutional context, specifically for referendums including secession cases.

  They're asking for several concrete things: First, a list of desiderata (requirements) that a theory of the demos must satisfy to be adequate, grounded in practical cases like undocumented residents, cross-border commuters, prisoners, and future generations. They want me to indicate which are absolute requirements versus preferences in disguise. They've also proposed two specific filters they want tested - the self-induced affectedness filter and the who-counts-the-counters requirement.

  Second, they want me to identify which desiderata conflict irreconcilably, particularly noting that this should be presented as a structural problem rather than lack of imagination. They suspect a tension between the demos authorizing itself versus no body certifying its own constituency.

  Third, they want a brief evaluation of standard approaches (all-affected interests, all-subjected, self-constitution) against these criteria.

  Finally, they want confidence levels flagged throughout - where I'd defend positions strongly versus where I might concede.

  Key cases to cover include: undocumented immigrant parents, cross-border taxpayers, expatriate property owners, children, prisoners, future generations affected by long-term decisions, and foreigners impacted by emissions/sanctions.

  I need to construct this carefully. The desiderata should balance normative ideals with practical constraints of electoral administration. The insoluble conflict likely centers on circularity: any membership rule requires prior authorization, but authorization requires prior membership. The "who-counts-the-counters" requirement seems particularly potent in exposing this.

  For confidence: I'll be most certain about administrative feasibility and anti-circularity requirements, less so about precisely where to draw lines in hard cases. The self-induced affectedness filter feels right but may need refinement under pressure.
answer: |-
  Here’s a criteria-driven framework for evaluating theories of the demos, designed for constitutional referendum rules. The desiderata are grounded in practical legitimacy, anti-manipulation, and moral intuition, with conflicts explicitly flagged. Confidence levels: 🔒 = high conviction; 🔶 = moderate/defensible; ⚠️ = contested/weakest link.

  ---

  ### **I. Desiderata for an Adequate Theory of the Demos**  
  *(Non-negotiable in **bold**; preferences/contestable in italics)*  

  1. **Non-Circularity (The "Who-Counts-the-Counters" Requirement)**  
     - **Why**: If the rule lets current power-holders (e.g., residency registrars, border agencies) unilaterally define the demos, it enables self-entrenchment (e.g., annexing territory and instantly enfranchising loyalists).  
     - **Case**: Occupation/annexation referendums (e.g., Crimea 2014).  
     - **Status**: 🔒 **Non-negotiable**. Without this, legitimacy collapses into force.  

  2. **Constraint on Self-Induced Claims**  
     - **Why**: States can’t manufacture "affectedness" by coercively expanding jurisdiction (e.g., sanctions, invasion) and then using that to claim democratic legitimacy over the coerced.  
     - **Case**: Sanctioned foreigners or annexed populations.  
     - **Status**: 🔒 **Non-negotiable** for anti-imperialism.  

  3. **Action-Guidance**  
     - **Why**: Electoral commissions need clear, operational rules (e.g., residency duration, tax status) to decide *fast*. Vagueness ("all affected") invites litigation and bias.  
     - **Case**: Deadlines for secession referendums (e.g., Scottish Independence).  
     - **Status**: 🔒 **Non-negotiable** for real-world use.  

  4. **Moral Plausibility**  
     - **Why**: Must cohere with core democratic values (e.g., no taxation without representation; no permanent exclusion of residents).  
     - **Cases**:  
       - Undocumented parents of citizen children 🔶 (if they pay taxes/use services, exclusion seems punitive).  
       - Long-term non-resident citizens ⚠️ (if they don’t bear costs of decisions, why vote?).  
     - **Status**: **Non-negotiable** minimally; specifics are 🔶.  

  5. *Non-Arbitrariness*  
     - **Why**: Avoids incoherent lines (e.g., "all adults" but excluding prisoners arbitrarily).  
     - **Case**: Disenfranchising felons vs. white-collar criminals.  
     - **Status**: *Preference* ⚠️. Some arbitrariness is inevitable (e.g., age thresholds).  

  6. *Inclusiveness*  
     - **Why**: Maximizes input from those impacted. But absolute inclusion is impossible (e.g., future people).  
     - **Cases**: Future generations 🔶 (infrastructure debt), cross-border commuters 🔶 (tax in A, services in B).  
     - **Status**: *Preference* ⚠️—often conflicts with action-guidance.  

  7. **Feasibility of Demarcation**  
     - **Why**: Must produce a *definable group*, not endless expansion (e.g., "all affected by climate policy" ≈ global population).  
     - **Case**: Emissions sanctions affecting foreigners.  
     - **Status**: 🔒 **Non-negotiable**—without boundaries, no decision can be made.  

  8. **Avoidance of Infinite Regress**  
     - **Why**: The rule can’t require a prior democratic authorization to define the demos (e.g., "the people decide who the people are" presupposes a "people" already).  
     - **Case**: Constitutional founding moments.  
     - **Status**: 🔒 **Non-negotiable** (the tutor’s point, but not a shrug—a real constraint).  

  ---

  ### **II. Insoluble Conflicts**  
  The core tension is between:  
  - **Non-Circularity** (no self-certification)  
  - **Avoidance of Infinite Regress** (no presupposed demos)  
  - **Action-Guidance** (need a rule now)  

  **Why they clash**:  
  - Any rule (e.g., "all subjected to coercion") requires *application* by someone. If applied by the state, it violates **Non-Circularity**. If applied by an external body, who authorizes *them*? (Infinite regress).  
  - **Self-constitution** ("we the people" decide) fails **Non-Circularity**—it lets current insiders define future insiders.  
  - **All-affected interests** fails **Feasibility** (too vague) and enables **Self-Induced Claims** if coercers "affect" victims.  
  - **All-subjected** avoids vagueness but struggles with cases like cross-border commuters (subjected to laws in one state, affected in another).  

  **Result**: No theory satisfies all non-negotiables. **Non-Circularity** is the killer—it exposes every rule as either self-validating or externally imposed (undemocratic).  

  ---

  ### **III. Scorecard of Standard Theories**  
  | **Theory**             | **Non-Circularity** | **Self-Induced Filter** | **Action-Guidance** | **Feasibility** |  
  |------------------------|---------------------|-------------------------|---------------------|----------------|  
  | **All-Affected**       | ❌ (State defines "affected") | ❌ (Rewards coercion)    | ❌ (Vague)          | ❌ (Global demos) |  
  | **All-Subjected**      | ⚠️ (State defines jurisdiction) | ✅ (If narrowly defined) | ✅ (Clear rules)     | ✅ (Bounded)     |  
  | **Self-Constitution**  | ❌ (Self-certifying)         | ⚠️ (Annexation possible) | ❌ (No initial rule) | ❌ (Regress)    |  

  **All-subjected** scores best pragmatically but still violates **Non-Circularity** (state defines "subjection"). **Self-constitution** is morally intuitive for founding moments but operationally hollow.  

  ---

  ### **IV. Confidence & Vulnerability**  
  - **Most defensible**: **Non-Circularity** 🔒 (empirically verifiable manipulation risk) and **Action-Guidance** 🔒 (practical necessity).  
  - **Vulnerable**: **Self-Induced Filter** 🔶—*counterexample*: What if a state *democratically* votes to annex territory? Does exclusion then become unfair? I’d weaken this to "non-consensual imposition."  
  - **Likely smuggled legitimacy theory**: **Moral Plausibility** ⚠️. My bias: liberal reciprocity (rights tied to contributions/burdens). A communitarian might prioritize cultural ties over residency.  
  - **Added desideratum?** *Stability*: Rules shouldn’t incentivize strategic migration/voter suppression. E.g., including non-resident property owners 🔶 might encourage speculative disengagement.  

  ---

  ### **Conclusion**  
  The boundary problem is insoluble *as a matter of principle* because **Non-Circularity** and **Avoidance of Infinite Regress** cannot both be fully satisfied. *But*: Constitutions can approximate adequacy by:  
  1. Prioritizing **Non-Circularity** (e.g., freezing franchise rules pre-referendum),  
  2. Using bright-line proxies like **residency + tax contributions** for action-guidance,  
  3. Building in override mechanisms (e.g., courts for exclusion claims).  

  This won’t resolve hard cases (children, futures), but it forces transparency about tradeoffs. The tutor’s "cop-out" is half-right: the circle can’t be neutrally drawn, but we can choose *how* to draw it accountably.
