prompt: |-
  I'm writing a novel set in an isolated valley, and I've painted myself into a corner. Two villages on opposite rims of a gorge; a fever a generation before the book opens left most of the lower village deaf, so the two sides run everything through a code of mirrored shutters that everyone on both sides was born into. Nobody agreed to it, nobody remembers it starting, and a big part of the book is about which of their shared practices have any grip on them. I keep wanting to narrate that some practice is a convention and others aren't — a habit, a rule somebody enforces, a thing they do because they think it's right — and I realized I don't have a spec for what that claim is supposed to buy. My writing group says just use the Lewis-style thing, a regularity everyone conforms to, expects the others to conform to, and prefers to conform to given that the others do, but that feels like it decides my cases by fiat before I know which cases matter.

  So: write me the requirements list. What does an account of convention have to deliver for me to call the practices in my valley by that name — which cases it has to sort correctly, which distinctions it can't collapse (convention vs mere regularity, vs a command backed by force, vs a norm people enforce, vs something they'd do anyway for independent reasons), which bits of the story it has to be able to accommodate, with the case behind each requirement. The cases I actually need handled: the mirror code itself, where a second, equally workable code existed and this one just won; the ledge lamps, where a stubborn tenth never light them, everybody knows it, and the system runs fine anyway; the water-turn rule, where the two villages' interests genuinely conflict and one of them is getting the worse deal; the black doors, where every household keeps its door painted black because each believes the others would sanction any other color, though in fact nobody cares and nobody has ever enforced it; the left-hand ledge, the only passable one, which everyone walks on and where there was never any alternative worth coordinating around; the dawn bell, which everybody hates and everybody still keeps; and the herders and their dogs, who time their movements around each other down to the minute, with only one side having anything like expectations about the other's expectations. Tell me too whether how a practice got started belongs in the test or only how it's kept going, since I have a chapter where the code shifts over one winter without anyone deciding anything.

  Mark which requirements are non-negotiable and which are just the taste of one camp, and flag any pair you think can't be jointly satisfied — that's the part I most want, because if the list is impossible I'd rather know now. One purpose-of-the-theory thing specific to me: I want a test a reader could in principle apply from what's on the page, from behavior and what people say out loud, without access to anyone's real preferences or to whether they all truly know what the others know. Say whether that observability condition is a genuine desideratum or my own novelist's prejudice, and if it's genuine, what it costs — I suspect it collides head-on with the bit about conditional preferences. Then tell me which single requirement knocks out the most candidates. A short scorecard at the end: how Lewis's own regularity-and-expectations account does, how the accounts that build sanctioning into the definition do, and how the evolutionary or reinforcement-style pictures that don't ask for beliefs at all do. Keep the weight on the criteria, the scorecard can be a few lines.
reasoning: |-
  Hmm, this is a fascinating challenge from a novelist working on a complex world-building project. They're wrestling with philosophical concepts of social conventions while trying to maintain narrative integrity in their story about two isolated villages communicating through mirrored shutters. 

  The core issue seems to be that standard philosophical definitions of convention (like David Lewis's) feel too prescriptive for their needs - it would prematurely decide which practices qualify as conventions before the story explores that ambiguity. They need a flexible framework that can distinguish between different types of social practices based on observable behavior, without accessing characters' internal states.

  Key cases they need to handle:
  - The mirror code (clear convention)
  - Ledge lamps (where non-compliance is tolerated)
  - Water-turn rule (with genuine conflict of interest)
  - Black doors (false belief in enforcement)
  - Left-hand ledge (no real alternative)
  - Dawn bell (universally disliked but maintained)
  - Herder coordination (asymmetric expectations)

  The novelist wants testable criteria that:
  1. Don't require knowing internal preferences
  2. Can handle both origin and maintenance of practices
  3. Can distinguish conventions from other social phenomena
  4. Accommodate all their specific village scenarios

  The observability condition is crucial here - since this is fiction, readers can only judge based on described behaviors and dialogue, not internal mental states. This directly conflicts with Lewis's requirement for conditional preferences.

  For the requirements list, I'll need to:
  - Distinguish necessary features from philosophical preferences
  - Note where observability creates tensions
  - Identify which requirements disqualify common theories
  - Provide a quick scorecard of how major theories handle their cases

  The trickiest cases will be:
  - Black doors (exposes gap between belief and reality)
  - Herders (tests asymmetric expectations)
  - Left-hand ledge (challenges the "alternative" requirement)
  - Dawn bell (questions the "preference" element)

  The chapter about the code shifting spontaneously also raises questions about whether conventions require deliberate action or can emerge organically.
answer: |-
  Here's a requirements list designed for *your* novel's needs, prioritizing observability, key distinctions, and handling your specific cases. The requirements are built to be testable primarily through observable behavior and explicit statements ("out loud"), acknowledging the inherent limitations of not accessing true preferences/knowledge.

  **Core Requirements for "Convention" in Your Valley (Observability-Centric)**

  1.  **Requirement: Observable Coordination Pattern (Non-Negotiable)**
      *   **What it delivers:** Establishes the base phenomenon exists.
      *   **Case:** *All cases (Mirror Code, Ledge Lamps, Water-Turn, Black Doors, Left-Hand Ledge, Dawn Bell, Herders).* There must be a recognizable, recurring pattern of behavior across a group (village, valley).
      *   **Observability:** Directly observable in actions (shutter flashes, lamps lit/not lit, doors painted black, walking on left ledge, bell ringing, herder/dog movements).

  2.  **Requirement: Mutual Belief in General Conformity (Non-Negotiable)**
      *   **What it delivers:** Distinguishes convention from mere coincidence or independent action. Captures the "social" aspect.
      *   **Case:** *Mirror Code, Water-Turn, Black Doors, Dawn Bell (partially), Herders (asymmetric).* People must generally *believe* (and act as if they believe) that others generally conform. This must be inferable from behavior/statements (e.g., reliance on the code, complaints about non-conformity *implying* it's expected, expressions of surprise if someone deviates unexpectedly).
      *   **Distinctions:** vs. Mere Regularity (where conformity isn't expected/relied upon), vs. Things Done Anyway (where conformity isn't noticed/relied upon).
      *   **Observability:** Inferable from reliance on others' actions (using shutters), expressions of expectation ("They *will* light the lamps"), surprise/vitriol when deviation occurs unexpectedly, sanctions (even verbal). *Doesn't require knowing if belief is* true *or* universal*, just that it's manifest in behavior/speech.*

  3.  **Requirement: Conditional Preference for Conformity (Conditional Observability - See Cost Below)**
      *   **What it delivers:** Distinguishes convention from command/coercion (where conformity is preferred regardless of others) and from things done for intrinsic reasons (where conformity is preferred regardless of others). Captures the coordination/arbitrariness aspect.
      *   **Case:** *Mirror Code (explicit alternative existed), Ledge Lamps (system works despite non-conformity, implying conditional value), Water-Turn (conflict shows conditional benefit), Left-Hand Ledge (only viable option, intrinsic reason?), Dawn Bell (hated, implying lack of intrinsic reason).*
      *   **Distinctions:** vs. Command (preference for conformity is absolute/fear-based), vs. Norm (preference may be intrinsic/moral), vs. Intrinsic Reason (preference is absolute).
      *   **Observability Cost (Significant):** This is the hardest to observe *directly*. You must infer it *indirectly*:
          *   **Existence of Alternatives:** Pointing out past/fictional alternatives (Mirror Code) suggests the *current* solution isn't the *only* intrinsically good one.
          *   **Tolerance of Deviation:** If deviation doesn't cause system failure *and* isn't always sanctioned harshly (Ledge Lamps), it suggests conformity isn't *intrinsically* vital or morally required, but *conditionally* valuable.
          *   **Complaints about the Practice Itself:** Hating the Dawn Bell but doing it anyway strongly suggests conformity is driven by the *condition* of others doing it, not the act itself.
          *   **Statements of Reliance:** "We have to do X *because otherwise* Y will happen (and Y is bad)." (Implies conditional preference: Prefer X given others do X; Prefer not-X if others don't).
      *   **Key Limitation:** You can only infer *that* a conditional preference exists; you cannot reliably infer the *strength* or *exact nature* of the underlying preference itself without internal access. Readers (and valley folk) make inferences based on behavioral cues and speech acts.

  4.  **Requirement: Arbitrariness (Potential Alternative)**
      *   **What it delivers:** Distinguishes conventions from solutions dictated by physical necessity or overwhelming intrinsic superiority. Highlights the coordination problem element.
      *   **Case:** *Mirror Code (explicit alternative), Ledge Lamps (different patterns possible?), Black Doors (any color would do?), Water-Turn (other schedules possible?), Dawn Bell (other signals possible?).*
      *   **Distinction:** vs. Left-Hand Ledge (arguably the *only* viable path - physical necessity dominates).
      *   **Observability:** Inferable from:
          *   Historical knowledge/fable of alternatives (Mirror Code).
          *   Explicit discussion of "could have been different" (characters speculating).
          *   The *absence* of physical/technical reasons forcing *this specific* solution (e.g., lamps could be lit in many patterns; doors could be any color; water could be shared differently). *Not required for maintenance, crucial for understanding origins/nature.*

  5.  **Requirement: Absence of Central Enforcement (Non-Negotiable for "Convention" vs. "Command")**
      *   **What it delivers:** Distinguishes convention from law or command backed by a recognized authority/threat.
      *   **Case:** *All cases* (especially Water-Turn if conflict exists without overlord, Black Doors).
      *   **Distinction:** vs. Command backed by force.
      *   **Observability:** Directly observable: No police, no judges, no bosses issuing orders or applying consistent physical punishment *on behalf of a system*. Sanctions must appear diffuse, social, and not emanating from a central power structure. People grumble about "them" (the other villagers) sanctioning, not about "the Sheriff" or "the Council".

  6.  **Requirement: Sanctions Need Not Define, But Must Be Observable If Present**
      *   **What it delivers:** Allows conventions without sanctions (Ledge Lamps), distinguishes them from norms where sanctions *are* often central, and handles the Black Door case.
      *   **Case:** *Ledge Lamps (no sanction needed), Black Doors (sanction believed but absent), Water-Turn/Dawn Bell (sanctions likely present).*
      *   **Distinctions:** vs. Norm (sanctions often definitional in many accounts). Convention relies primarily on the coordination benefit and expectations. Sanctions (gossip, shunning, minor retaliation) can be a *reinforcing mechanism* but aren't *necessary* for the convention to exist or be identified. The *belief* in potential sanctions (Black Doors) can drive conformity even if sanctions never materialize.
      *   **Observability:** Sanctions (gossip, shunning, refusal to cooperate, minor vandalism) are observable. The *absence* of sanctions despite deviation (Ledge Lamps) is observable. The *belief* in sanctions (Black Doors) is inferable from statements and anxious conformity.

  **Handling Origin vs. Maintenance**
  *   **Requirement:** The definition must apply primarily to the *maintenance* of the practice *once established*. The origin story (agreement, evolution, accident, imposition) is separate history. Your shutter code shift chapter shows a convention can *change* without deliberate agreement, driven by new patterns of behavior becoming mutually expected. The test applies to the *current state*: Is there a pattern? Is conformity mutually expected? Is conformity conditionally preferred? Etc.

  **Impossible Pair?**
  *   **Strict Observability vs. Precise Conditional Preference:** This is the fundamental tension. Requirement 3 (Conditional Preference) is essential for the core distinction (vs. command/intrinsic reason) but inherently difficult to observe directly. You *must* rely on strong indirect behavioral inferences (tolerance of deviation, complaints about the practice, existence of alternatives, statements of reliance). If you insist on *direct* observation of the conditional preference structure (e.g., knowing true utilities), it *is* impossible without internal access. **Verdict:** Requirement 3 is non-negotiable for the concept, but its *observability* is constrained to indirect inference. This is the cost of your novelist's need (which is a genuine desideratum for a behavioral definition).

  **The Case-Breaker Requirement**
  *   **Requirement 3 (Conditional Preference)** knocks out the most candidates. It's what rules out:
      *   **Left-Hand Ledge:** If it's truly the *only* viable path, conformity is preferred *regardless* of others (due to the cliff). It might be a regularity with expectation, but not a convention. It's dictated by necessity.
      *   **Dawn Bell:** If people hated it but kept it *only* because they feared immediate, specific punishment from an authority, it would be command, not convention. The conditional preference (I ring if others ring to avoid chaos/sanction *from the group*) is key.
      *   **Things Done Anyway:** If everyone independently loved painting doors black for aesthetic reasons, it wouldn't be a convention, even if they all did it and expected it. The preference isn't conditional on others.
      *   It also creates the challenge for **Herders:** Asymmetry is possible (one side coordinates based on expectation of behavior, the other based on habit/instinct), but if *neither* side's action is conditional on the *expectation* of the other's action (e.g., the dogs just run a set route, herders just follow), it might be two independent regularities meshing, not a convention. The conditional element needs to be present on at least one side. The "expectations about expectations" layer might be thin or absent on one side.

  **Scorecard: How Theories Handle Your Cases & Requirements**

  1.  **Lewis (Regularity R, Expectation E, Conditional Preference CP, Arbitrariness A):**
      *   **Strengths:** Clearly handles Mirror Code (R, E, CP, A), highlights issues with Left-Hand Ledge (CP fails - no real alternative/necessity), Dawn Bell (CP present but weak/preference *against* conformity is strong).
      *   **Weaknesses:** Struggles observably with CP. Fails Ledge Lamps if CP is interpreted strictly (conformity isn't strictly *necessary* for benefit, so CP weak?). Black Doors problematic (CP relies on *false* belief in sanctions/E, but Lewis can accommodate belief-based CP). Herders asymmetric expectations might not meet the full "common knowledge" requirement Lewis often implies. Origin shift chapter fits Lewis's evolutionary picture well.
      *   **Your Needs:** Fails strict observability for CP. Requires careful handling of Ledge Lamps/Black Doors.

  2.  **Sanction-Based Definitions (Convention = Regularity + Expectations + Sanctions S):**
      *   **Strengths:** Clearly handles Water-Turn, Dawn Bell if sanctions exist. Explains persistence.
      *   **Weaknesses:** Fails **Ledge Lamps** catastrophically (no sanctions needed/tolerated). Misfires on **Black Doors** (sanctions believed but absent - is it a convention or not? Definitionally, perhaps not, but it *acts* like one). Makes **Mirror Code** seem more coercive than it might be. Doesn't solve the CP/Arbitrariness distinction (Left-Hand Ledge could have sanctions too). Origin shift harder to explain without sanctions driving change.
      *   **Your Needs:** Fails key cases (Ledge Lamps, Black Doors). Overly narrow.

  3.  **Evolutionary/Reinforcement (No Beliefs, Just Reinforced Behaviors):**
      *   **Strengths:** Handles origin shift chapter perfectly. Handles Mirror Code evolution. Can handle Ledge Lamps (reinforcement weak). Handles Herders well (learned patterns). Very observable (focuses purely on behavior patterns).
      *   **Weaknesses:** Struggles to distinguish **Convention** from **Mere Regularity** or **Trained Habit** (Left-Hand Ledge, things done anyway). Collapses **Convention** and **Norm** (both are reinforced patterns). Fails to capture the **Conditional Preference** aspect crucial for arbitrariness and distinction from command/intrinsic reason (Dawn Bell hated? Doesn't matter, it's reinforced). Can't explain **Black Doors** (why conform without reinforcement/sanction? Belief is key). Downplays the role of mutual expectation/belief.
      *   **Your Needs:** Excellent on observability and origin. Fails to make crucial distinctions (CP, Arbitrariness) and handles Black Doors poorly. Makes "convention" too broad.

  **Conclusion for Your Novel:**

  The most promising path is a **Lewis-inspired framework, adapted for observability, with a pragmatic interpretation of Conditional Preference**. Focus on:

  1.  **Pattern + Mutual Expectation:** Observable in behavior/reliance/statements.
  2.  **Conditional Preference (Indirectly Inferred):** Key evidence: Tolerance of some deviation (Ledge Lamps), complaints *about the practice itself* (Dawn Bell), existence/knowledge of alternatives (Mirror Code), statements implying conditional reliance ("We have to... because otherwise...").
  3.  **Arbitrariness (Historical/Speculative):** Established through backstory, character dialogue, obvious lack of necessity (any door color works).
  4.  **Sanctions:** Can be present or absent; their presence doesn't define it, their *believed* presence can drive it (Black Doors), their absence doesn't kill it (Ledge Lamps).

  **Accept that:**

  *   **Left-Hand Ledge** might not be a convention, but a necessity-driven regularity with expectation.
  *   **Black Doors** *is* a convention, driven by *false* but observable mutual belief and inferred conditional preference (based on the false belief).
  *   **Herders** can have asymmetric convention-like coordination if one side's actions are observably conditional on expectations about the other.
  *   **Dawn Bell** is a convention, albeit a disliked one (conditional preference: "I prefer to endure it given that others do and chaos/sanction would result if I stopped alone").
  *   **Ledge Lamps** is a convention with very low stakes/weak conditional preference, tolerant of deviation.

  This approach gives you the distinctions you need while staying grounded in what your characters (and readers) can see and hear. The shutter shift chapter beautifully illustrates the evolutionary aspect fitting within this adapted Lewisian view. Good luck!
