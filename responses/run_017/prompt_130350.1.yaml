  ### Mark and Rubric  
  **Total Mark: 72/100**  
  - **Part A: 48/60**  
    - *Item 1: 6/15* (Misclassification + downstream error)  
    - *Item 2: 12/15* (Correct classification but unacknowledged controversy)  
    - *Item 3: 15/15* (Correct + diagnostics)  
    - *Item 4: 15/15* (Correct + diagnostics)  
  - **Part B: 24/40**  
    - *Q1 (implicature status): 12/20* (Partially correct but major omission)  
    - *Q2 (part of what Bea meant): 0/20* (Fundamental error)  
    - *Apparatus feature: 12/20* (Correctly identified but misapplied)  

  ---

  ### Comments for Candidate  
  *(Key: ✓ = Correct; ⚠ = Correct but Incomplete/Contested; ✗ = Wrong)*  

  **PART A**  
  **Item 1 (Referents of "she" and "her"): ✗**  
  - **Why wrong:** Resolution of indexicals ("she/her") is **part of determining "what is said"** for Grice (via disambiguation/reference fixation), *not* conversational implicature. See "Logic and Conversation" (1975), §II: fixing reference is pre-implicature.  
  - **Repair:** Reclassify as **part of "what is said"**.  
  - **Downstream effect:** Corrupts understanding of implicature’s derivation (since implicature requires "what is said" as input).  
  - *Confidence: Confident.*  

  **Item 2 (Contrast from "but"): ⚠**  
  - **Why incomplete:** Grice treats "but" as generating a **conventional implicature** (e.g., "He is poor but honest" implicates contrast non-cancellably). The student classifies it as generalized conversational implicature (GCI), which is a contested neo-Gricean view (e.g., Levinson 1983).  
  - **Mark impact:** No penalty for taking this stance (as GCIs *are* sometimes argued for connectives), but **loses 3 marks** for not flagging the mainstream Gricean position (conventional implicature).  
  - **Justification:** Cancellability test fails: "She's early but brilliant — and I see no contrast there" sounds contradictory. Grice calls this non-cancellable (*Studies in the Way of Words*, p.25).  
  - *Confidence: Reasonably confident.*  

  **Item 3 ("Exactly three" from "three"): ✓**  
  - **Correct:** "No more than three" is a **GCI via Quantity1** (scalar implicature). Diagnostics well applied: cancellable ("...in fact more did") and calculable (speaker not withholding info).  
  - **Strength:** Explicit appeal to Quantity maxim and derivation path.  
  - *Confidence: Confident.*  

  **Item 4 (Bea’s negative stance): ✓**  
  - **Correct:** **Particularized conversational implicature** via flouting Quantity1. Diagnostics perfect: indeterminate (no precise degree of negativity), cancellable (Bea could endorse strongly), and calculable from context (asked for teaching record, gave weak praise).  
  - *Confidence: Confident.*  

  ---

  **PART B**  
  **Q1: Does "no more than three" remain a conversational implicature? ⚠**  
  - **Incomplete:** Yes, it **remains a potential implicature for the hearer**, but only if the hearer *reasonably assumes* Bea knows the facts. If hearers know Bea is misinformed, the inference collapses (Grice: implicature relies on mutual knowledge).  
  - **Missing nuance:** Gricean implicature depends on the *hearer’s* calculation *based on assumptions about the speaker’s knowledge*. If context reveals Bea’s ignorance, the implicature isn’t generated.  
  - **Mark impact:** Partial credit for recognizing hearer-based derivation, but loses 8 marks for omitting mutuality condition.  
  - *Confidence: Reasonably confident.*  

  **Q2: Is it part of what Bea meant? ✗**  
  - **Fundamental error:** **No.** For Grice, speaker meaning requires **intention** (utterer’s meaning defined by reflexive intentions; "Meaning" 1957). Bea *lacks* the intention to convey "no more than three" (she believes "three" is compatible with more).  
  - **Apparatus feature:** Turns on **intentionalism** (meaning requires speaker’s audience-directed intentions). The candidate wrongly equates "what is meant" with hearer’s inference.  
  - **Correction required:** Reject the claim that "what a speaker means just is what a competent hearer would work out." Grice’s theory is intention-based, not hearer-centric.  
  - *Confidence: Confident.*  

  **Apparatus Feature (Speaker intention condition): ⚠**  
  - **Why contested?** Correctly notes that Gricean derivation doesn’t require speaker’s *awareness*, but misses that it **requires intention**. The appeal to Modified Occam’s Razor is irrelevant (it targets lexical ambiguity, not intention).  
  - **Minimal correction:** The critical apparatus is Grice’s **definition of utterer’s meaning** (intentions to induce belief via recognition of intentions).  

  ---

  ### Overall Feedback  
  **Strengths:**  
  - Clear grasp of conversational implicature diagnostics (Items 3–4).  
  - Part B correctly separates hearer’s inference from speaker’s psychology.  

  **Weaknesses:**  
  - Confusion about "what is said" vs. implicature (Item 1) and speaker meaning (Part B).  
  - Uncritical adoption of non-Gricean views on "but" (Item 2) without acknowledgment.  
  - Overlooked role of mutual knowledge in Part B (hearer’s assumptions about speaker’s knowledge).  

  **Most Uncertain Call:**  
  - **Item 2 (conventional vs. conversational implicature for "but")**.  
    - **To settle:** Grice’s *Studies in the Way of Words* (pp. 24–25, 120–121) explicitly labels conventional implicatures as non-cancellable and distinct from conversational ones. If cancellability fails, it’s conventional.  

  **Script Quality:** Solid analysis in places (Items 3–4), but foundational errors in speaker meaning and indexicals cost significant marks. The Part B misunderstanding cascades, invalidating the core argument.
