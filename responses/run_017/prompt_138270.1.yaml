prompt: |-
  I'm in the lower sixth, and I'm writing my Extended Project on whether attachment to one's own country is a virtue or a vice. While reading and arguing about it over the past few months I've noticed a pattern in how people talk, and I can't work out whether it is a recognised phenomenon with an established name, or whether I'm inventing a spurious unity.

  It usually shows up like this. After a national sports victory, or at a Remembrance assembly, or when some long-dead figure from our own country is praised for a discovery, people slide very easily into "we": they say "we" achieved it, and they seem to feel a genuine, personal pride about it, even though they had no hand in it, would have opposed it at the time, and in some cases weren't born when it happened. But the moment the story is an unflattering one — the slave trade, the empire, some wartime atrocity — the very same people retreat to the strictest possible account of individual agency: they weren't there, they didn't do it, their family wasn't even in the country, and so no share of it attaches to them. What struck me most is that the boundary of the group itself seems to flex. A scientist born two centuries ago in the next city is "ours" when he is being celebrated, but a merchant from the same period who made his money from slavery is treated as belonging to a country that was somehow a different entity then. And it sometimes runs the other way as well: I have friends who are extremely critical of the country, who would never permit themselves a moment of patriotic pride, and who nevertheless insist that we owe apologies or reparations for historical wrongs — so they seem to accept a share in the guilt while refusing the share in the credit.

  I don't think what I'm describing is just the ordinary business of people taking credit for their own successes and blaming circumstances for their own failures, since none of this is about anybody's own actions at all, and each individual move seems perfectly defensible in isolation — it does sound strange to say you feel guilty about something done in 1830. I'm also not sure it is simply a fallacy to be exposed, because there may be a principled story on which a community can be a source of pride without being a source of responsibility, or vice versa. I'd be grateful if you could tell me whether this pattern — the asymmetry, and the way the group's edges stretch for credit and shrink for blame — has an established name in philosophy or in social psychology; if the nearest concepts only fit it partly, which ones they are, how my case differs from each, and which comes closest; whether what I've described is really one phenomenon or two or three that I've wrongly lumped together; and whether there is a defensible version of the move rather than only a defective one. I'm after the carving rather than a label, so please don't just hand me a term. Please write your answer in British English.
reasoning: |-
  Okay, the user is working on their Extended Project about whether attachment to one's country is a virtue or a vice. They've noticed a pattern where people use "we" for positive national achievements but distance themselves from negative historical events. They want to know if this is a recognized phenomenon and what it's called. I need to figure out the best way to explain this.

  First, I recall that this sounds familiar. In social psychology, there's something called the intergroup attribution bias. That's when people attribute their group's successes to internal traits but failures to external factors. But the user mentioned that the group boundaries themselves shift—like including historical figures for credit but excluding them for blame. That might go beyond just attribution. 

  Then there's collective narcissism, which is an inflated view of one's group that needs recognition. But that might not cover the selective distancing from blame. Also, national identification involves seeing the nation as part of one's identity, which could explain pride but not necessarily the avoidance of guilt. 

  The user also pointed out that critics might claim responsibility for past wrongs but reject pride in achievements. That's interesting because it's the opposite asymmetry. So maybe there are different dynamics at play here. Concepts like moral luck or collective responsibility come to mind. Philosophers like David Miller talk about how we can inherit responsibility for past injustices if we still benefit from them. But for positive achievements, it's more about shared identity without ongoing benefits. 

  The shifting group boundaries remind me of social identity theory, where people fluidly define in-groups to maintain positive self-esteem. The user's observation about the same historical figure being "ours" or "theirs" based on context fits here. Also, the concept of the "chauvinist timeline" from political theory where the nation's continuity is emphasized in glory but not in shame. 

  I should check if there's a specific term for this phenomenon. Maybe "selective collective appropriation" or "asymmetric group identification"? But I'm not sure if those are established terms. The user wants the carving, not just a label. So explaining the underlying mechanisms is more important. 

  I need to address whether this is one phenomenon or multiple. The pride part and the blame part might be driven by different motivations. Pride comes from boosting self-esteem through group affiliation, while avoiding blame protects self-image. Critics taking on blame might be about acknowledging ongoing injustices, rejecting pride to avoid complacency. So perhaps it's two phenomena under the umbrella of group identity dynamics. 

  Also, the user asked if there's a defensible version. For the critics, accepting responsibility for past wrongs could be based on present benefits, which is a principled stance. But for nationalists, claiming past glories without accountability is harder to justify. The shifting boundaries for convenience is the problematic part. 

  I should mention concepts like collective pride and guilt, and how they're different. Collective guilt requires acknowledgment of harm and responsibility, which people often resist. The user might need to explore how different theories justify or criticize these asymmetries. 

  Finally, structure the answer by first outlining the key concepts, then analyzing the asymmetries, discussing the shifting boundaries, separating the phenomena, and addressing defensible versions. Make sure to use British English terms like "defence" instead of "defense".
answer: |-
  What you've described is a brilliantly observed pattern – a profound asymmetry in how people relate to historical group membership for pride versus guilt. While there isn't a single, universally agreed-upon term that captures *every* nuance you've outlined (especially the dynamic boundary shifting), it intersects powerfully with several established concepts in philosophy and social psychology. Let's carve it up:

  1.  **Core Mechanisms & Partial Fits:**
      *   **Social Identity Theory (SIT - Tajfel & Turner):** This is fundamental. SIT explains our need for positive self-esteem derived from group membership (national identity here). We achieve this by:
          *   **In-group Favouritism:** Favouring "us" over "them."
          *   **Positive Distinctiveness:** Emphasising things that make "us" good/better.
          *   **Your Asymmetry:** Claiming credit for past glories ("we won the World Cup/developed penicillin") directly fuels positive distinctiveness and boosts self-esteem via group affiliation. SIT perfectly explains the *positive* side ("we" for achievements). However, its standard application to the *negative* side is less about *denying* group membership and more about attributing negative outcomes externally ("they cheated," "circumstances were unfair") or minimising them. Your observation focuses on the *active disassociation from the group itself* when faced with negative history.
      *   **Collective Narcissism:** A specific, inflated form of group identification where the group's image is central to self-worth, requiring constant external validation and reacting defensively to criticism. This strongly relates to the *inability* to acknowledge negative group history, as it threatens the core narcissistic need. It explains the defensive *distancing* ("*I* wasn't there, *my* family didn't do it") but doesn't fully capture the flexible boundary drawing ("that slaver wasn't *really* one of *us* like the scientist was").
      *   **Intergroup Attribution Bias:** This describes the tendency to attribute positive actions by the in-group to stable, internal qualities (e.g., "British ingenuity") while attributing negative actions to external, unstable factors (e.g., "the pressures of the time," "a few bad apples"). This *is* closely related to your pattern, but again, it primarily concerns *causal attribution* rather than the *acceptance or rejection of group membership itself* and the flexible definition of the group's historical boundaries. Your case involves people implicitly or explicitly redefining *who counts as "we"* depending on the valence of the event.
      *   **BIRGing and CORFing (Social Psychology):**
          *   **Basking In Reflected Glory (BIRGing - Cialdini):** This *directly* names the phenomenon of feeling pride and using "we" for achievements you had no part in (e.g., "we won!" after your team's victory). This perfectly captures the positive side of your asymmetry.
          *   **Cutting Off Reflected Failure (CORFing - Snyder, Lassegard, & Ford):** This is the *direct* counterpoint: distancing oneself from the failures or negative actions of a group ("*they* lost," "*they* did that awful thing, not *me*"). This perfectly captures the negative side – the retreat to strict individual agency and disassociation.
      *   **Collective Responsibility & Moral Luck (Philosophy):** Philosophers debate *if* and *how* present individuals/groups bear responsibility for the past actions of their predecessors. Key arguments involve:
          *   **Continuity:** Does the present nation-state meaningfully continue the same community/political entity?
          *   **Benefit:** Do present members benefit from past injustices (e.g., wealth, infrastructure, privilege derived from empire/slavery)? This underpins the stance of your critical friends who accept responsibility for past wrongs (due to perceived continuity and benefit) but reject pride (perhaps seeing it as complacent or ignoring underlying problems).
          *   **Moral Luck:** The idea that we can be judged (positively or negatively) for things outside our control. Claiming pride for Newton's discoveries involves positive moral luck; rejecting guilt for slavery involves avoiding negative moral luck. The asymmetry lies in selectively embracing one kind of luck while rejecting the other.

  2.  **The Shifting Boundary - The Crucial Nuance:**
      This is where your observation adds significant depth. It's not *just* claiming credit and denying blame *within* a fixed group definition. It's the *elasticity* of the "we" itself.
      *   **Conceptual Fit:** This flexible boundary work aligns with how social identities are *constructed* and *activated* situationally. People draw the boundaries of "us" to maximise self-esteem and minimise threat. When celebrating, the net is cast wide ("we British scientists," "we who fought in the war"). When condemning, the net shrinks drastically ("*That* was done by *Georgian* merchants," "The *British Empire* did that, not modern Britain"). This relates to:
          *   **The "Chauvinist Timeline" (Political Theory):** A concept describing how nationalist narratives emphasise continuity and shared identity stretching far back into the glorious past, but treat periods of shame or negative actions as discontinuous, belonging to a different entity, or perpetrated by "others" who were never *truly* part of the "authentic" nation. Your observation about the scientist vs. the merchant exemplifies this.
          *   **Motivated Reasoning/Cognition:** People unconsciously seek information and interpret ambiguity in ways that support desired conclusions (feeling good about the group, avoiding feeling bad). Redefining group boundaries for credit/blame is a powerful form of motivated reasoning.

  3.  **One Phenomenon or Several?**
      You've astutely identified **two distinct asymmetries**, often driven by different motivations, but both rooted in the dynamics of social identity:
      *   **Asymmetry 1 (The Common Pattern - Pride Claimed, Guilt Denied):** BIRGing + CORFing + motivated boundary shifting (Chauvinist Timeline) + Intergroup Attribution Bias + Collective Narcissism (defensive element). This is driven by the desire for positive self-esteem and group image, and avoidance of negative emotions/threats to identity. **This is the dominant pattern you first described.**
      *   **Asymmetry 2 (The Critical Pattern - Guilt Accepted, Pride Denied):** This is driven by a different set of principles: acknowledging historical injustice, recognising present-day benefits derived from past wrongs (Collective Responsibility arguments), and a belief that uncritical pride (BIRGing) is inappropriate or impedes progress. The "we" here is defined by continuity of the *political entity* and/or *beneficiary status*, not by a need for positive self-esteem. They reject BIRGing because they see it as ignoring ongoing problems or injustices rooted in that past.

  4.  **Is there a Defensible Version?**
      Yes, *principled* versions exist, though the *convenient*, self-serving boundary shifting you often observe is harder to defend:
      *   **Defensible Claiming of Pride:** Feeling inspired by or appreciative of past achievements within a tradition or culture you identify with is understandable. Saying "We achieved great things" can be a shorthand for "People within this national/cultural tradition I identify with achieved great things." However, this becomes problematic if it fosters uncritical nationalism, ignores context, or implies personal desert ("*I* am great because Newton was British").
      *   **Defensible Acceptance of Responsibility:** This is often *more* readily defensible on philosophical grounds. If:
          *   There is meaningful continuity in the political/legal entity (e.g., the UK state).
          *   Present members derive significant benefits from past injustices (e.g., national wealth, infrastructure, global position partly built on empire/slavery).
          *   There are ongoing structural inequalities traceable to those injustices.
          *   ...then the argument that "we" (as citizens of that continuing state, or beneficiaries of that history) bear *some* form of responsibility (e.g., for acknowledgment, apology, symbolic reparations, or addressing ongoing inequalities) is strong. This is the core of your critical friends' position. It doesn't imply direct *personal guilt* for the acts, but a *collective responsibility* flowing from membership and benefit.
      *   **Defensible Rejecting of Pride:** Rejecting BIRGing can be defensible if the pride is seen as masking current problems, ignoring the darker sides of history associated with the celebrated figure/event, or fostering harmful nationalism. It can be a stance of humility or critical engagement.
      *   **The Indefensible Core:** The *indefensible* part is the **inconsistent, self-serving application of group boundaries purely for emotional convenience** – stretching "we" to the 18th century for Newton's genius but snapping it back to the present day for the slave trader operating from the same London docks, solely to maximise reflected glory and minimise reflected failure. This is motivated reasoning and boundary manipulation at its most transparent. Similarly, selectively shrinking the group *only* for blame while keeping it wide for pride lacks principle.

  **In Summary:**

  *   **Core Mechanisms:** BIRGing (positive) and CORFing (negative) are the most direct labels for the basic credit-claiming/blame-denying behaviours.
  *   **Asymmetry Driver:** The fundamental driver is **Social Identity Theory** – the need for positive self-esteem derived from group membership.
  *   **Shifting Boundary:** The dynamic redefinition of "we" is explained by **motivated reasoning/cognition** and relates to the concept of the **"chauvinist timeline"** in nationalist narratives. **Collective Narcissism** fuels the defensive aspect.
  *   **Philosophical Underpinnings:** Debates about **Collective Responsibility** (especially concerning benefit and continuity) and **Moral Luck** provide the framework for justifying or criticising the acceptance/denial of historical pride/guilt.
  *   **Two Asymmetries:** You've identified the common defensive asymmetry (BIRG + CORF + shifting boundaries) *and* the critical asymmetry (accepting responsibility/rejecting pride based on principle).
  *   **Defensibility:** Principled positions exist, particularly for accepting responsibility based on continuity and benefit, or for rejecting uncritical pride. The indefensible core is the *self-serving inconsistency* in defining the group's boundaries and the selective embrace/rejection of group identity solely for emotional or reputational gain.

  Your observation cuts to the heart of how national identity functions emotionally and politically. It's not just about feeling pride or guilt; it's about the active, often unconscious, work we do to construct the very "we" that those feelings attach to. Your EPQ sounds fascinating – good luck with it!
