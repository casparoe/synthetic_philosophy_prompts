  Based on your past decisions, I've analyzed the implicit rules governing your co-op's choices when redrawing rounds. The primary principle is maximizing the minimum whole-life score (i.e., the worst individual working life under a scheme), as the unit of concern is the entire working life, not temporary stretches or average outcomes. This aligns with a strict interpretation of the difference principle applied to life scores, with no explicit floor on single-round scores and no reliance on total or average scores except as a tiebreaker. The rules are derived from your historical votes and the stated crudeness of scores (±3 points).

  ### Rules Fitting All Five Past Decisions
  1. **Core rule: Maximize the minimum whole-life score.**  
     - If one scheme has a higher minimum life score (beyond the ±3 noise threshold), it is chosen, regardless of totals or inequality.  
     - Example: Decision 1: Min 60 > min 59 → chose (60,60,60,60).  
     - Example: Decision 3: Min 51 > min 50 → chose (95,95,95,51).  
     - Example: Decision 4: Min 69.5 (rotating) > min 30 (fixed) → chose rotating despite a worse single-round low (26).  
     - Example: Decision 5: Min 55 (safe) > worst-case min 45 (risky) → chose safe.

  2. **Tiebreaking rule: If minimum life scores are equal (within ±3), maximize total life score.**  
     - Equality within ±3 is treated as a tie, triggering a focus on overall welfare.  
     - Example: Decision 2: Min 60 ≈ min 60 (tie within noise) → chose (62,62,62,60) for higher total (246 vs. 240).

  3. **No secondary constraints on single-round scores.**  
     - Single-round lows (e.g., 26 in Decision 4) are acceptable if the whole-life score is higher. There is no evidence of an absolute floor (e.g., rejecting schemes with single rounds below a fixed value like 25).  
     - The crudeness of scores (±3) is applied only to life scores, not single rounds, for comparisons.

  4. **Risk aversion for worst-case life scores.**  
     - Schemes with uncertain outcomes (e.g., Decision 5) are judged by their worst-case minimum life score.

  These rules fit all past decisions:
  - **Decision 1:** Min life 60 vs. 59 → higher min chosen (60), despite lower total.
  - **Decision 2:** Min life 60 ≈ 60 (tie within ±3) → higher total chosen.
  - **Decision 3:** Min life 51 > 50 → higher min chosen.
  - **Decision 4:** Min life 69.5 > 30 → higher min chosen, ignoring single-round low (26) and lower total.
  - **Decision 5:** Min life 55 > worst-case min 45 → higher min chosen.

