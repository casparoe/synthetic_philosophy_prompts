prompt: |-
  I'm a teaching assistant for an undergraduate political theory course, and last week we ran a session on the boundary problem: the difficulty that any democratic procedure must take for granted a set of people whose decision counts as the decision of the group, while the identity of that set is itself one of the things supposedly up for democratic decision. The session went fine over the familiar ground. The students quickly saw that *let the people decide* is unhelpful when what is disputed is precisely who the people are, and we spent most of the hour on the standard contrast between a constituency defined by affectedness and one defined by subjection to coercion, together with the standard complaints that the first is wildly over-inclusive and the second leaves out everyone who is harmed without being governed. What I mishandled was a harder variant that a student raised in office hours afterwards, and I'd like help with the concept rather than with the syllabus: please don't give me readings, authors, or a literature map, just the conceptual structure.

  Her variant goes as follows. Suppose a polity adopts what I'll call a *variable franchise*: instead of a standing electorate, the constituency is reconstituted for each decision, and includes exactly those persons whose interests are affected by that decision above some specified threshold, with the determination made by a standing commission applying an affectedness test. I want four things explained. First, agenda-dependence: whether some group counts as affected seems to shift with which options are placed on the table and how the question is framed, so that a decision to build upstream, a decision not to build, and a decision framed as water-rights rather than flood-control each appear to enfranchise a different set of people. The composition of the deciders therefore seems to depend on choices that the deciders themselves make. Is this the same circularity as the familiar one about who decides who decides, or a different one, and does it have a different moral? Second, the move from a scalar to a binary: affectedness admits of degree while the franchise normally assigns equal votes, so the threshold looks arbitrary, and resisting that arbitrariness by giving the more-affected more weight seems to break political equality. Is the arbitrariness of the cut a real objection to affectedness as a criterion of inclusion, or is it benign? Third, the diachronic worry: if the constituency is reassembled issue by issue, there may be no persisting group that governs itself over time, and it becomes unclear why someone should regard a decision they lost as one they nonetheless made. Does the idea of self-government actually require a continuing demos, or is that an aesthetic preference for continuity? Fourth, the generality worry: every account of legitimate authority, including non-democratic ones, needs to say whose authority and over whom, so does the boundary problem give a distinctive objection to democracy, or is it a problem democracy inherits rather than one it creates?

  If you can, rank the four worries by how damaging you take them to be, say which of them the variable franchise is meant to solve and whether it does, and flag anything important that all four of them are missing.
reasoning: |-
  Okay, the user is a teaching assistant for a political theory course dealing with the boundary problem in democracy. They presented a standard session on affected vs. coercion-based constituencies but struggled with a student's variable franchise proposal. Now they want conceptual help on four specific worries about this variable franchise system, without literature references.

  Breaking down the four worries: First, agenda-dependence - how framing issues changes who counts as affected. Second, threshold arbitrariness - turning continuous affectedness into binary voting rights. Third, diachronic continuity - whether self-government requires a stable demos over time. Fourth, generality - if boundary issues are unique to democracy or apply to all authority systems.

  I need to analyze each worry's conceptual structure. Agenda-dependence creates a circularity where agenda-setters effectively choose the voters, different from the classic "who decides" loop. The threshold problem exposes a tension between the gradient nature of affectedness and democracy's need for equal votes. The diachronic concern questions whether collective agency requires temporal persistence. The generality point examines if democracy uniquely suffers boundary issues.

  Ranking them: Agenda-dependence seems most damaging as it enables manipulation. Threshold arbitrariness comes next as it undermines political equality. Diachronic continuity may be less severe - more about coherence than legitimacy. Generality is least damaging since while all systems face boundary questions, democracy's participatory nature makes them more acute.

  The variable franchise mainly addresses over/under-inclusion in static definitions but fails on agenda-control and threshold issues. All worries miss that "affectedness" itself is contestable - different conceptions (material, psychological, causal chains) yield different inclusions. Also missing is how such a system would handle interdependent issues or logroll across decisions.

  The user's deeper needs appear to be: 1) Understanding why this student's challenge is harder than standard critiques 2) Preparing to discuss this in future sessions without getting stuck 3) Grasping why boundary problems resist technical fixes. They're not seeking readings but want to master the conceptual terrain for teaching purposes.
answer: |-
  Here's a conceptual breakdown of the four worries regarding the "variable franchise" proposal, ranked by severity, along with analysis of what the proposal solves and key missing elements:

  **Ranked Worries (Most to Least Damaging):**

  1.  **Agenda-Dependence:** This is the most damaging.
      *   **Conceptual Structure:** The "affectedness" of any individual depends crucially on *how the decision is framed* (e.g., "build upstream dam?" vs. "who owns the river water?" vs. "prevent downstream flooding?") and *which alternatives are considered* (e.g., only "build/don't build" vs. including "build smaller dam elsewhere"). The commission setting the agenda and framing the question effectively *determines in advance* who gets to vote. This creates a profound circularity: those deciding the agenda (the commission) pre-select the electorate that will then "decide" the issue. This is distinct from the *familiar* "who decides who decides" circularity. The familiar circularity asks who has the *authority* to define the demos. This new circularity shows that even *within* an agreed *criterion* (affectedness), the *application* of that criterion is manipulable by *procedural choices* about the decision's structure. The moral is that "affectedness" is not a neutral, objective fact discoverable prior to political framing; it is *constituted* by the political process itself.
      *   **Moral:** The core democratic ideal of self-determination is undermined because the "self" is defined by the very process it's supposed to authorize. This makes the commission a hidden sovereign.

  2.  **Threshold Arbitrariness (Scalar to Binary):**
      *   **Conceptual Structure:** Affectedness is inherently a matter of degree, but voting (in this model) is binary. Setting *any* threshold (e.g., "significantly affected" or "affected above level X") is unavoidably arbitrary. There's no non-arbitrary point where "affected enough" suddenly qualifies someone for an equal vote. Attempts to mitigate this by weighting votes according to degree of affectedness ("more votes for the more affected"):
          *   Directly violate political equality (one-person-one-vote).
          *   Introduce severe practical and conceptual problems (How to measure? Who measures? Can intensity be compared across diverse interests? Does it turn democracy into a market?).
      *   **Benign or Real Objection?** This is a *real and significant* objection to affectedness *as a criterion for franchise inclusion in a voting procedure*. It highlights a fundamental mismatch: affectedness is a continuous input, while the franchise requires a discrete output. The arbitrariness isn't benign; it creates permanent contestation about exclusion near the threshold and undermines the legitimacy of the vote for those excluded just below it. Affectedness might work better as a criterion for *hearing* or *consideration* rather than for *voting rights*.

  3.  **Diachronic Worry (No Continuing Demos):**
      *   **Conceptual Structure:** Self-government implies a collective agent ("We the People") making decisions *for itself* over time. If the demos dissolves and re-forms with each issue, there is no stable "self" that persists. This raises questions:
          *   Why should I accept a decision on issue A made by Group X (which included me) if I disagree with a decision on issue B made by Group Y (which excluded me)? Where is the *shared* sovereign identity?
          *   How can collective responsibility, commitments, or long-term projects exist without a continuing entity to bear them?
      *   **Requirement or Preference?** While an aesthetic preference for continuity might exist, the deeper issue is about the *conceptual coherence of collective agency over time*. Self-government isn't just a series of discrete acts; it implies a collective subject capable of binding its future self, making commitments, and having a shared history. A purely issue-specific demos struggles to embody this. It risks reducing democracy to a disconnected series of plebiscites without a unifying political identity. However, this worry is *less* damaging than the first two because one could argue (controversially) that the *procedure itself* (the variable franchise rules) provides the necessary continuity, even if the participants shift.

  4.  **Generality Worry (Problem for All Authority?):**
      *   **Conceptual Structure:** Any form of legitimate authority (monarchy, aristocracy, democracy) must define its *scope* – who holds authority and over whom (the boundaries). The "boundary problem" in this sense is indeed a problem *inherited* by democracy, not uniquely *created* by it. Monarchs need to define their realm and subjects.
      *   **Distinctive Objection?** However, the boundary problem poses a *distinctively acute challenge for democratic legitimacy* because democracy grounds legitimacy in the *consent or authorship of the governed*. If it's fundamentally unclear *who* "the governed" *are* in a way that must be decided *non-democratically* (e.g., by a commission, historical accident, force), this directly contradicts the core democratic claim that the people rule themselves. Non-democratic theories can more readily appeal to non-consensual sources of legitimacy (tradition, divine right, expertise, force) to justify boundaries. Democracy's reliance on popular authorship makes the pre-political definition of "the people" uniquely problematic. So, while the *logical* problem of defining boundaries is general, its *moral/political* sting is sharpest for democracy.

  **What the Variable Franchise Solves (and Doesn't):**

  *   **Solves:** The variable franchise directly targets the core complaint against *static* affectedness definitions: their fixed nature inevitably leads to over-inclusion (global climate change voters?) or under-inclusion (downstream neighbors excluded from upstream dam vote?). By dynamically adjusting the electorate to the specific issue, it aims for a "just right" inclusion based on the *actual stakes* of the *particular decision*. It solves the problem of a fixed demos being poorly matched to the variable scope of different decisions.
  *   **Doesn't Solve:** It **fails catastrophically** on **Agenda-Dependence** (the commission controls the electorate via framing). It **fails significantly** on the **Threshold** problem (arbitrary binary cut/weighting dilemmas). It **mitigates but doesn't fully resolve** the **Diachronic** worry (it provides procedural continuity but not necessarily collective identity). It **doesn't address** the **Generality** worry (it just provides one non-democratic method - the commission - for solving the inherited boundary problem).

  **Key Missing Element (Common to All Four Worries):**

  All four worries, and the variable franchise proposal itself, largely overlook the **problem of defining "affectedness" substantively**. What *counts* as being "affected"?

  *   **Material Harm/Benefit Only?** What about psychological, cultural, or spiritual impacts? (e.g., sacred sites upstream).
  *   **Direct Causation?** What about complex systemic effects or butterfly effects? How far down the causal chain do we go?
  *   **Foreseeable Effects?** What about unforeseen consequences?
  *   **Interests vs. Preferences?** Does "affected" mean having a *stake* (an objective interest) or merely having a *preference/opinion*? Who defines the objective interest?
  *   **Non-Human Interests?** (e.g., environmental concerns).

  The **contestability and ambiguity inherent in the concept of "affectedness"** is a fundamental flaw underlying the variable franchise proposal and a major reason why the Agenda-Dependence worry is so potent. The commission doesn't just frame the question; it inevitably makes substantive, contested judgments about what kinds of effects matter and how they are measured, judgments that are inherently political rather than purely technical. This ambiguity makes the threshold problem worse and further undermines any claim that the procedure neutrally identifies the "truly affected."
