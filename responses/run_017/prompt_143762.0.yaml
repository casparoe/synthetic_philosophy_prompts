  **Bottom line: 0.1**, because the sterilized case eliminates plausible non-instrumental anchors, leaving only abstract pattern-value, which is weak and likely confounded by decision-rule heuristics.

  ### Decomposition (non-independent components)
  | Component                                                                 | Weight | Reasoning                                                                                                     |
  |---------------------------------------------------------------------------|--------|---------------------------------------------------------------------------------------------------------------|
  | **1. Non-instrumental distribution-sensitivity exists**                  | 0.5    | Plausible for fairness/equality as intrinsic goods, but contested (e.g., vs. welfarist monism).               |
  | **2. It attaches to outcomes/patterns, not just relations/expressions**  | 0.3    | Sterilization removes relational/expressive elements; residual pull for patterns alone is faint.              |
  | **3. Judgment survives full sterilization**                              | 0.8    | Conditions robustly exclude instrumental/relational noise, but pattern-value persists weakly.                |
  | **4. Pull tracks alternatives (e.g., decision-rule value)**              | 0.7    | Strong case: equality-sensitive rules hedge risk under ignorance ("veil" variant undermines L).              |
  | **5. "Better in one respect" is coherent**                               | 0.9    | Normative properties can exist without subjects (e.g., "more orderly"), but L strains this.                  |
  | **Composite**                                                            | **≈0.1** | `(1 × 2 × 3 × [1 - 4] × 5) → 0.5 × 0.3 × 0.8 × 0.3 × 0.9 ≈ 0.032`; adjusted up for interactions (see notes). |

  **Notes on combination**:  
  - Non-independent: If (4) is high (pull is heuristic), (1) and (2) drop (no need for intrinsic pattern-value). Weighted toward `[1 - 4]` to reflect this.  
  - Final adjustment: +0.068 for residual intuition despite sterilization → **0.1**.  
  - **Most sensitive to (4)**: If the pull is *entirely* about decision-rule hedging, L collapses to 0.  
  - **Biggest mover**: Empirical evidence that intuitions vanish under strict sterilization (e.g., experiments with the "veil" variant) → pushes toward 0.05.  

  ### Variant Analysis
  1. **Sandpile (imperceptible loss)**:  
     - L **less plausible** (≈0.05 effect). The loss is real but ethically negligible; "no one worse off" feels true-ish. If harms lack subjective resonance, pattern-value loses footing. Reveals L as contingent on perceptible sacrifice.  

  2. **Veil (ex ante worse for all)**:  
     - **Undermines L** (≈0.03 effect). "Better in one respect" lacks a subject: not better for any individual (ex post or ex ante), nor for aggregate welfare. Suggests "respect" is incoherent or reducible to decision-rule value.  

  ### Relativized Prioritarianism  
  - **No structural safety**: If weights depend on relative position (e.g., `weight = 1 / (median - your welfare)`), leveling down *can* increase weighted sum.  
    - *Example*: Initial state: Alice at 50 (median 60), Bob at 70. Weighted welfare = `(1/(60-50))×50 + (1/(70-60))×70` = `5 + 7 = 12`.  
    - Level down Bob to 60: New median = 55. Weighted welfare = `(1/(55-50))×50 + (1/(60-55))×60` = `10 + 12 = 22`.  
  - **Why it fails**: Requires the *disadvantaged* person’s position to improve *relative to the median* after leveling. Pure leveling down **lowers the median**, so Alice’s relative position may worsen (e.g., from 10 below median to 5 below). In realistic cases, weighted sum usually decreases. Pushes L down.  

  ### Disagreement & Resolution  
  - **Likely core disagreement**: You (0.35) likely accept non-instrumental pattern-value (components 1-2) but underestimate heuristic alternatives (4). Your friend (0.05) reverses this.  
  - **Resolution**: Test intuitions on the **veil variant**. If both agree L vanishes there, it suggests the pull is heuristic (supports 0.05). If L persists, it favors intrinsic pattern-value (supports 0.35).  
  - **What could resolve it?** Conceptual clarity on whether "fairness" can be a property of patterns independent of human experiences (unlikely), or empirical work on moral psychology under sterilization.
