prompt: |-
  long time lurker of the rationalist blogs here (sequences, the old comment wars, all of it) and I have a very practical itch. I want a spec, not a survey: what would a rule for appraising research programmes actually have to get right before I'd trust it? The job I want it good enough for is narrow — me deciding whether to keep putting years of my own career into a field whose programme looks like it might be stalling, and a grant panel deciding between funding the incumbent programme and funding a scrappy rival. So it has to work for someone who is allocating real resources, not for someone writing history with the ending already known.

  Give me the requirements list with the case behind each one, and be explicit about which are non-negotiable and which are just the prejudices of one camp (I suspect "must cash out in novel predictions" is one of those, and I suspect "must be statable as a hard core plus a protective belt" is close to tautological). In particular I want it to say something defensible about: a zombie programme whose own practitioners think the core is false but keep using it because it keeps landing confirmed predictions; a black-box programme where the positive heuristic is a machine learning system, nobody can articulate the core, and the hit rate on novel predictions is well above chance; a shotgun programme that emits thousands of predictions and reports the ones that came off; an absorber programme that keeps explaining its rival's successes as limiting cases, which looks like triumph and like degeneracy depending on the mood I'm in; a programme that hasn't been refuted so much as priced out, where the next decisive test costs a billion dollars and takes thirty years; and the case that actually matters for my decision, where the programme looks degenerating and there is no rival to defect to. I also want the level distinction kept intact — "this programme is in trouble" is not the same claim as "I should leave it" — and I want the rule to be usable in real time by someone who can't see the future and who knows that the scientists being evaluated will start gaming whatever metric you hand them.

  The part I most want is where the list fights itself. Tell me which pair of requirements you think can't be jointly satisfied, and whether the whole thing is self-defeating: it looks to me like "give a verdict now" and "don't declare a programme dead prematurely, since programmes revive" are in genuine tension, and like anti-gaming and applicability pull in opposite directions, and like any criterion that scores methodologies by how much of the history of science they recieve as rational gets two opposite verdicts on the same episode whenever two reconstructions both cover a lot of ground. Then say which single requirement knocks out the most candidates. After that, a couple of sentences each on how Lakatos's own version, Popper's falsificationism, and a straight expected-value-of-information Bayesian rule do against the list, and we're done.

  No headings, no bullet points, no bold, no tables — just continuous prose, the way you'd write it in an email to a friend who asked.
reasoning: |-
  Okay, let me try to unpack this user's request. They're clearly deeply familiar with rationalist discourse and philosophy of science, referencing Lakatos, Popper, and Bayesian approaches explicitly. The core need is practical: a set of criteria for evaluating research programs in real-time resource allocation decisions. 

  Hmm, the user presents several challenging cases - zombie programs, black-box ML approaches, shotgun methods, absorber programs, and the "priced out" scenario. Each seems designed to probe different weaknesses in traditional appraisal frameworks. I notice they're particularly concerned about premature abandonment when no rival exists, which feels personal given their career dilemma.

  The tension they highlight between "decide now" and "programs can revive" is central. Any workable framework must handle uncertainty without paralysis. Gaming concerns are also critical - scientists will optimize whatever metric you give them. 

  I should probably start by listing non-negotiable requirements. "Must work without hindsight" seems absolute - this isn't history. "Must output actionable signals" is another - vague philosophical judgments won't help. The gaming-resistance requirement might be the hardest; every metric corrupts.

  For the case studies... The zombie program exposes the prediction-core tension. The black-box ML case challenges the "articulable core" assumption. The absorber program dilemma shows why "explaining rivals' successes" needs careful handling. The priced-out scenario introduces practical constraints into theoretical appraisal.

  The Bayesian approach might handle uncertainty best but struggles with black boxes. Lakatos captures the structural dynamics but requires articulable cores. Popper fails most cases spectacularly. 

  Biggest trade-off: anti-gaming robustness vs sensitivity to early warning signs. You can't have perfect protection against gaming while detecting subtle degeneration. Might need to accept some false positives.

  The "no rival" case is where all frameworks crumble. When there's nowhere to jump, persistence may be rational even in degeneracy - but how to distinguish that from sunk cost fallacy?
answer: |-
  Here’s the spec for a research programme appraisal rule that might actually earn your trust for real-time, high-stakes decisions. The core tension is this: you need something that doesn’t demand hindsight but resists both premature burial and zombie revival, while handling edge cases where theory and practice diverge. Below are the requirements, ranked by negotiability, with the conflicts laid bare.  

  ### Non-Negotiables (Fail any of these, scrap the rule):  
  1. **Must output a probabilistic verdict, not a binary one.** If it declares "dead" or "alive," it’s useless. Your decision isn’t whether to bury the programme but whether *your resources* stay in it. The verdict must quantify uncertainty: e.g., "80% probability this degenerates within 5 years unless core anomaly X resolves." Case: the "priced-out" programme (e.g., next-gen particle physics) isn’t dead; it’s in suspended animation. A probability captures the option value of waiting for tech cost-reduction.  
  2. **Must not require novel predictions to already exist.** If it demands confirmed novelties, it fails zombie programmes (e.g., quantum mechanics frameworks still used in engineering despite known incompleteness) and black-box ML (where "novelty" is ill-defined). Instead, track *latent novelty*: is the programme generating testable conjectures *outside* its current comfort zone? A zombie might coast on old predictions but spawn no new puzzles; a black-box ML programme might output falsifiable hypotheses about data gaps.  
  3. **Must be anti-gaming at the mechanism level.** Scientists will optimize for the metric. So: if your rule uses "prediction hit rate," it dies against shotgun programmes (1000 guesses, 5 confirmed ≠ progress). Fix: demand *cost-adjusted risk-taking*. Track resources consumed per *unit epistemic risk* undertaken (e.g., "This team burned $10M testing low-yield safe bets; rivals spent $2M probing high-disconfirmation-potential anomalies").  

  ### Negotiable (But highly advised):  
  4. **Should handle absorption dynamically.** An absorber programme (e.g., string theory "explaining" condensed matter phenomena) isn’t inherently degenerate. The rule must ask: *Is absorption draining resources from generating independent tests?* If 90% of the programme’s effort goes to fitting others’ data, it’s a parasite. If it’s a side effect of core-driven work, it’s healthy.  
  5. **Should distinguish programme health from defection advisability.** A programme can be degenerating (70% probability) yet still your best bet *if no rival exists*. The rule must separate: (A) Internal trajectory (e.g., "Protective belt modifications are ad hoc, anomaly list growing faster than solutions"), and (B) Opportunity cost (e.g., "Even if decaying, expected value > all alternatives by 3x").  
  6. **Should accept unarticulated cores.** Black-box programmes (e.g., deep learning in drug discovery) often lack a Lakatosian "hard core." Forcing one is Procrustean. Substitute: *Does the heuristic generate constrained surprise?* A programme that *systematically* outperforms its architects’ expectations (e.g., "We predicted 50% accuracy; got 80% but cannot explain why") signals latent structure. One that merely matches expectations is tool-like, not evolving.  

  ### Conflicts That Will Hurt:  
  - **"Decide now" vs "Programmes revive"** is irreconcilable without probabilities. No rule can ensure you never abandon a Phoenix programme (e.g., plate tectonics, dormant for decades). Mitigation: The rule must *explicitly model revival triggers* (e.g., "Probability of revival >10% if technique X becomes affordable by 2035").  
  - **Anti-gaming vs Sensitivity.** A gaming-resistant metric (e.g., "resource cost per anomaly resolved") will miss early degeneration (e.g., a programme avoiding anomalies entirely). You need paired metrics: one gaming-resistant (e.g., input strictness), one sensitive (e.g., rate of anomaly generation). Tension remains.  
  - **History rationalization trap.** Any rule that "scores" by historical fit will bifurcate on contested episodes (e.g., Bohr's atom vs. Schrodinger's wave mechanics). Avoid: judge *current* dynamics, not post-hoc narratives.  

  ### The Killer Requirement:  
  **#3 (Anti-gaming)** eliminates most candidates. Popperians obsess over falsification but ignore that programmes can *avoid* falsifiable claims. Lakatosians demand articulated cores, failing black-box science. Bayesian EVI models often assume honest actors, crumbling when gamers shift priors strategically.  

  ### How Incumbents Fare:  
  - **Lakatos:** Fails black-box programmes (requires articulated core) and gamers (naive about "novel predictions" in shotguns). Handles absorption well (flags degenerating absorption) and priced-out cases (allows dormancy).  
  - **Popper:** Falsificationism dies against zombies ("but it works!") and priced-out programmes ("untestable = pseudoscience"). Useless for defection decisions (no comparative framework).  
  - **Bayesian EVI:** Shines on opportunity cost ("expected value of staying vs. switching") and priced-out cases (explicitly models information value). But fails anti-gaming (agents can manipulate priors/likelihoods) and absorption (no intrinsic way to flag explanatory overfitting).  

  ### The Real Test: No Rival, Programme Stalling  
  Here’s where the rule proves itself. A good one would:  
  - Diagnose *why* stalled: Is the core falsified but useful (zombie)? Are anomalies accumulating unsolved (degeneration)? Are practitioners avoiding risk (gaming)?  
  - Project *conditional survival*: "If no core overhaul in 3 years, 85% chance of collapse. Overhaul requires tools expected circa 2028; if delayed, reduce survival odds by 40%."  
  - Advise *you*: "Even with 70% degeneration risk, staying has higher EV than leaving for unrelated fields (career transition cost >> grant loss). Monitor tool development timelines."  

  **Bottom line:** The rule you want doesn’t exist off-the-shelf. But cobble together: probabilistic forecasts + gaming-resistant productivity metrics + latent novelty detection + explicit revival triggers, and you’ve got a fighting chance. Just never trust it fully—build in a 30% fudge factor for human cussedness.  

  ---  
  *Final note: Your case feels like high-energy physics circa 1980. If so, remember—sometimes the rival emerges *from* the degenerating programme’s ashes. Defection isn’t the only exit; building the coffin can be revolutionary work.*
