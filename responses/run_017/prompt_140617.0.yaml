answer: |-
  ## Joint Statement on the Special Composition Question  
  **Signed:** [Your Name] (Nihilist) & [Friend's Name] (Universalist)  
  **Date:** [Date]  

  ### Preamble
  We agree that the Special Composition Question (SCQ)—"Under what conditions do some things compose a further thing?"—is fundamental to ontology. After exhaustive debate, we reject all restricted answers (e.g., composition occurs only when the parts form a living organism, are in contact, or are cohesively fastened). Our shared rejection stems from the following agreed claims:

  ### Agreed Claims  
  1. **The SCQ’s Significance**: The SCQ is not verbal but metaphysical. It concerns what fundamentally exists, not how we use words like "object."  
  2. **The Continuum Problem**: Restricted criteria (life, contact, cohesion) admit borderline cases (e.g., a dying organism, near-contact, weak adhesion). No non-arbitrary cutoff exists in reality to distinguish composition from non-composition across such continua.  
  3. **Failure of Restricted Answers**: Any sharp boundary proposed by restricted answers is undetectable, epistemically inaccessible, and metaphysically unmotivated. Thus, restricted theories are untenable.  
  4. **Paraphrase Obligation**: Both nihilism ("N") and universalism ("U") must reconstruct ordinary/scientific discourse (e.g., "There is a table") without reference to composite objects.  
     - *N’s Strategy*: Replace apparent reference to composites with quantification over simples arranged table-wise (e.g., "Simples are arranged table-wise here").  
     - *U’s Strategy*: Treat composites as real but identify them with pluralities or fusions (e.g., "The table is the fusion of these simples").  
  5. **Ineffective Arguments**:  
     - Bare intuitions (e.g., "Obviously, tables exist!") are theory-laden and circular.  
     - Appeals to practical utility (e.g., "We need to quantify composites in science") are neutral: both N and U can explain utility via paraphrase or posits.  
     - Concerns about "weird objects" (e.g., shoe-Moon fusions) are aesthetic, not metaphysical.  

  ### Residual Disagreements  
  | Question | Nihilist’s Statement (Your View) | Universalist’s Statement (Friend’s View) |
  |----------|----------------------------------|------------------------------------------|
  | **What exists?** | Only mereological simples exist. Entities like tables are just patterns in the distribution and properties of simples. | Any plurality of objects composes a further object. Tables exist, as do all arbitrary fusions (e.g., shoe-Moon). |  
  | **When does composition occur?** | Composition never occurs. Talk of "wholes" reflects human cognitive practices, not ontological additions. | Composition always occurs. The existence of a fusion is a trivial consequence of the existence of its parts. |  
  | **What is the world’s structure?** | The world is fundamentally particulate. All apparent complexity supervenes on the properties/relations of simples. | The world includes both simples and composites. Complexity is captured by the mereological hierarchy itself. |  

  ### Cruxes: Sub-Questions Where Progress is Possible  
  1. **Does composition add ontological commitments beyond simples?**  
     - *Case*: The **Three-Simples World** (below).  
     - *N predicts*: Dynamics require only three entities; composites do no work.  
     - *U predicts*: Composites exist but play no *unique* causal role; dynamics supervene on simples.  
     - *Movement*: If composites were indispensable in dynamics, N would concede; if composites were incoherent, U would concede.  

  2. **Which theory minimizes theoretical cost?**  
     - *Case*: The **Cost Audit** (below).  
     - *N predicts*: Lower ontological cost (physics quantifies over only simples).  
     - *U predicts*: Lower ideological cost (simpler paraphrase schemas).  
     - *Movement*: If physics quantifies over composites, N moves; if U’s paraphrase requires ad hoc clauses, U moves.  

  3. **Is the disagreement merely verbal?**  
     - We agree it is **not purely verbal** at the fundamental level: N denies, while U affirms, that composition adds entities. However, **ordinary discourse is verbal**: both agree "There is a table" is true iff simples are arranged table-wise. The dispute is about whether this arrangement constitutes an *additional entity*.  

  ---

  ### The Three-Simples World Case  
  **Setup**: A world with exactly three simples (A, B, C) at times T1 (clustered) and T2 (scattered).  
  | Theory | What Exists at T1? | What Exists at T2? | Change in Ontology? | Role in Dynamics? |  
  |--------|-------------------|-------------------|---------------------|-------------------|  
  | **Nihilism** | Only A, B, C | Only A, B, C | No | Dynamics describe motion/relations of A, B, C; no composite needed. |  
  | **Universalism** | A, B, C, *and* the fusion ABC | A, B, C, *and* the fusion ABC (which now has scattered parts) | Yes (ABC changes intrinsic properties) | Dynamics identical to N’s; composites supervene on simples. |  

  **Shared Conclusion**: Composites do no *causal work* in dynamics.  
  - **N’s View**: Confirms composites are superfluous.  
  - **U’s View**: Confirms composites are harmless; existence doesn’t imply causal power.  

  ---

  ### The Cost Audit  
  **Metrics**:  
  - *Ontological cost*: Entities quantified over in fundamental physics laws.  
  - *Ideological cost*: Clauses needed to paraphrase "There is a table" into fundamental ontology.  

  | Theory | Ontological Cost | Ideological Cost |  
  |--------|------------------|------------------|  
  | **Nihilism** | **Low**: Only simples. | **Higher**: Requires complex predicates (e.g., "arranged table-wise") for every composite-type. |  
  | **Universalism** | **Higher**: Simples + all fusions. | **Low**: Single paraphrase schema (e.g., "The fusion of parts with property P"). |  

  **Predictions & Movement Conditions**:  
  - **N**: Expects physics to quantify only over simples. *Concession if*: Laws reference composites (e.g., "Galaxy-fusions exert gravitational force").  
  - **U**: Expects paraphrase to require fewer clauses than N. *Concession if*: Paraphrasing vague/context-dependent terms (e.g., "planet") demands ad hoc restrictions.  

  ---

  ### Evidence Against Our Own Views  
  | View | What Would Falsify It? |  
  |------|------------------------|  
  | **Nihilism** | Empirical proof of partless composites (e.g., extended simples) or demonstration that composites *must* appear in *fundamental* physics laws. |  
  | **Universalism** | Proof that unrestricted composition generates contradictions (e.g., Russellian paradoxes for fusions), or that paraphrase *requires* arbitrary restrictions matching a restricted theory. |  

  **Settling the Matter?**  
  We agree the SCQ could be settled by:  
  1. **Fundamental Physics**: If completed physics quantifies over composites (e.g., "cells exert forces"), N loses; if it quantifies *only* over simples and relations, U loses.  
  2. **Paraphrase Failure**: If U cannot handle ordinary talk without unmotivated restrictions, or if N cannot avoid primitive, infinitely complex predicates.  
  3. **Metaphysical Argument**: A proof that composition is/not ontologically innocent (e.g., via grounding or identity).  

  **Conclusion**: We remain at an impasse, but commit to these criteria for resolution. Our dispute is metaphysical but constrained by science and logic—neither intuition nor convention suffices.  

  ---  
  **Attestations**:  
  *We hereby endorse this statement as a fair representation of our agreement and disagreement.*  
  **[Your Signature]** (Nihilist)  
  **[Friend’s Signature]** (Universalist)**
