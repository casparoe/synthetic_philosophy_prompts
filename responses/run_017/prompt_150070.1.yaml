prompt: |-
  I'm the graduate TA for an upper-level seminar on philosophy of cognitive science — 18 students, mostly philosophy majors with a few psychology and linguistics students in the mix, one 90-minute session in a room with no screens. We've just finished the week on the extended mind: Andy Clark and David Chalmers's 1998 paper "The Extended Mind," the Otto/Inga case, active externalism, and the cluster of conditions they use — roughly, that the resource is constantly and easily available, that what it says is automatically endorsed rather than weighed, and that it has been taken up and trusted over time. Last term I tried a version of this that was just a memory task done first unaided and then with notes, and it taught nobody anything: everyone shrugged, said the notebook obviously isn't part of them, and a psychology major pointed out that all I'd measured was how much people like their own notes. I want a real activity this time. What participants should come away seeing is not that external aids help cognition (nobody denies that) but that the live question is which marks turn reliance into constitution, and that the marks in that standard cluster don't travel together: a resource can be one thing on one test and the opposite on another.

  The idea I want staged is something I've been calling the three tests, and I'd like the game built so that students generate cases where they come apart rather than being told that they do. The substitution test: give a participant the same information they encoded, but in a stranger's notation, or in their own notation re-copied by someone else, or as an objectively better and more complete card than theirs — the question is whether the resource still guides them in the same way, and whether "it isn't mine" is doing the work or "it isn't good" is. The tampering test: return their own card with two or three entries silently altered in their own handwriting, and see whether the resulting error is owned ("I was wrong") or externalised ("my card was changed"). The friction test: keep the card but tax it — a retrieval delay, a cost in points per consultation, a partial or scrambled version — and see whether degrading the coupling degrades the sense that the belief was theirs. I want at least one condition that functions as a control against the "you just like your notes" objection, ideally one where sentiment and integration point in opposite directions. Practical constraints: ordinary classroom materials and paper only, no phones or laptops; a clear timeline across the 90 minutes with a build phase in which participants construct their own aid from scratch and can't bring anything in; roles for a few students as registrars who record answer latency, confidence and error-attribution so we have something to debrief with; a points payoff rather than money, with some way for participants to stake confidence so that endorsement strength is measured and not just accuracy; and no upfront lecture, with the words "extended," "parity," "constitution" and "coupled system" not uttered until after the final phase. Since the tampering phase involves deceiving participants, tell me how to handle that properly — what to say beforehand, and how the reveal is folded into the debrief.

  Give me the full runnable package: rules, materials and setup, the timeline with minute marks, the payoff scheme, the assignable roles, and a debrief that maps specific moments onto specific parts of the thesis and its critics — including the objection that causal coupling to an external resource isn't the same as that resource being part of a cognitive system, and the worry that if notebooks and diaries count, there is no principled place to stop before address books, smartphones and the internet. Be honest about what will predictably go wrong the first time I run it and how to recover, and be frank about which feature of the dispute the activity cannot reproduce and I'll have to supply in discussion myself. Where you're designing under uncertainty, say so: give me the one design choice you're least confident about and the observation during the session that should make me abandon it mid-run and fall back to open discussion, and flag the premise the whole activity rests on — something like the assumption that how people attribute error and ownership is evidence about what their minds are made of — together with what happens to the exercise if that premise is false.
reasoning: |-
  We are designing an activity to explore the conditions under which external resources might be considered part of the cognitive system, as per the extended mind thesis. The goal is to have students experience and generate cases where the standard criteria (constant availability, automatic endorsement, trust over time) come apart. We will use three tests: substitution, tampering, and friction. 

  Constraints:
  - No screens, paper only.
  - 90 minutes total.
  - Participants build their own aid from scratch (no pre-brought materials).
  - Roles: some students as registrars to record latency, confidence, error attribution.
  - Points payoff with confidence staking.
  - No upfront lecture; avoid key terms until debrief.
  - Handle deception in tampering properly.

  Activity Structure:
  1. Introduction and setup (without revealing the philosophical goal)
  2. Build phase: participants create their own memory aid.
  3. Test phase: three tests (substitution, friction, tampering) with registrars collecting data.
  4. Debrief: reveal deception, discuss, and connect to the extended mind paper and critiques.

  Detailed Plan:

  Materials:
  - For each participant: blank index cards, pens, a worksheet with questions (memory tasks).
  - For registrars: clipboards, timers, data collection sheets.
  - For the instructor: master list of questions, tampering materials (to alter cards secretly), substitution cards (prepared in different handwritings or formats).

  Roles:
  - 3-5 registrars (depending on class size). They will time responses, record confidence levels, and note error attributions.
  - The rest (13-15) are participants.

  Timeline (90 minutes):

  (0-10 min): Introduction and Setup
  - Explain that we are doing an activity on memory and external aids. Avoid philosophical terms.
  - Assign roles: choose registrars (they will not participate in the memory task). Explain their tasks: timing, recording confidence (on a scale, e.g., 1-5), and noting what participants say when they make an error (e.g., "I was wrong" vs. "the card is wrong").
  - Participants: they will build a personal memory aid for a set of questions. They are not allowed to use any pre-existing notes.

  (10-30 min): Build Phase
  - Hand out worksheets with 15-20 factual questions (e.g., "What is the capital of Australia?", "What year did World War II end?", "What is the atomic number of carbon?"). These should be non-controversial facts. Also include a few that require more encoding, e.g., "List the first five prime numbers" or "What are the three laws of motion?".
  - Participants create their memory aid on index cards. They can write as much as they want. Emphasize that they will use this card in the next phase.
  - Collect the cards at the end. (Important: we will tamper with some, and create substitution cards.)

  (30-35 min): Break (instructor and registrars prepare)
  - While participants take a short break, the instructor and registrars:
     a) Prepare substitution cards: for each participant, create a card with the same information but in a different handwriting (by a registrar) or in a printed format (if handwriting is not feasible, but note: no screens, so handwritten by someone else). Also, for some participants, create a "better" card that has the same information plus extra correct facts (to test if they trust it more).
     b) Tampering: select about half of the participants' original cards and alter 2-3 answers (e.g., change "Canberra" to "Sydney" for Australia's capital). Do this in a way that mimics the participant's handwriting as much as possible. The other half will serve as a control (no tampering).
     c) Friction: for the friction test, we will have a condition where using the card is taxed (e.g., they have to wait 10 seconds before looking, or they lose points per use). We'll assign which test each participant gets.

  (35-65 min): Test Phase
  - Participants are called one by one to a testing area (to avoid sharing information). Each participant will do three tests (but they don't know they are different tests). The order is fixed for each participant: 
    1. Substitution test (with their own card, or a substitution, or a better card)
    2. Friction test (with their own card, but under friction)
    3. Tampering test (with their own card, which may or may not have been tampered with)

  - However, to avoid carryover, we might assign each participant to only one of the three tests? But we want each to experience all. Alternatively, we can have three rounds, each round being one test. But then we need multiple questions per test.

  Revised Test Phase (three rounds, each with multiple questions):

  Round 1: Substitution (10 min)
  - Participants are given a card. They don't know it might not be theirs. 
    - Group A: gets their own card (control)
    - Group B: gets a substitution card (same info, different handwriting)
    - Group C: gets a "better" card (same info plus extra correct facts, in different handwriting)
  - They answer 5 questions (from a new worksheet) using the card. 
  - Registrars time how long it takes to answer each question and record confidence (after each answer, participant rates confidence 1-5) and note any errors and attributions.

  Round 2: Friction (10 min)
  - Participants get their own card back (if they were in group A in round1, they get their own; if in B or C, we give them their own now). But now there is a friction condition: 
    - They must wait 10 seconds (timed by registrar) before looking at the card for each question. 
    - Or, we can impose a point cost: each time they look at the card, they lose 2 points (from a starting point of, say, 100). 
  - They answer 5 new questions. Registrars record time, confidence, and any comments.

  Round 3: Tampering (10 min)
  - Participants get a card that is either their own (untampered) or tampered (if they were in the tampering group). 
  - They answer 5 new questions. 
  - Registrars record time, confidence, and especially the attribution when an error occurs (if they say "I was wrong" or "the card is wrong").

  But note: we have three tests and three rounds, but we also have three conditions in substitution. We need to balance the design.

  Alternative: each participant goes through the three tests in order, but the substitution condition is assigned once (at the beginning) and then they use the same card for friction and tampering? But then the tampering test might be affected by the substitution. 

  Better: each participant is assigned to one substitution condition (so they are in group A, B, or C) and then they do friction and tampering with their own card (which for group B and C we return to them after substitution). Then in tampering, we have two conditions: tampered or not.

  So:
  - Substitution condition: 3 groups (A: own, B: substitution same, C: substitution better)
  - Friction: all do friction with their own card (after substitution)
  - Tampering: 2 groups (half tampered, half not) — but note that the tampering group is independent of substitution.

  We can cross the conditions, but that would require more groups. Let's keep it manageable:

  Assign participants to one of three substitution groups (A, B, C). Then, within each group, half are assigned to tampering (so we have 6 groups). Friction is done by all. 

  But with 15 participants, we can do:

  - Substitution: 5 in each group (A, B, C)
  - Tampering: within each substitution group, 2-3 tampered and 2-3 not (so total 8 tampered, 7 not, or adjust to even).

  Friction is for everyone.

  During the test phase, each participant does:
  1. Substitution test (5 questions) -> with the card they are given (which is either their own, a substitution, or a better card)
  2. Friction test (5 questions) -> with their own card (returned to them) but under friction (delay or cost)
  3. Tampering test (5 questions) -> with their own card, which may have been tampered (if they are in the tampering group) or not.

  The questions for each round are different.

  (65-75 min): Data Collection and Break
  - Registrars compile the data (quickly) while the class takes a break. The instructor prepares the debrief.

  (75-90 min): Debrief and Discussion
  - Reveal the tampering: explain that some cards were altered. Ask participants if they noticed anything. Then reveal the activity's purpose.
  - Present the data: show patterns (e.g., in substitution, did group C trust the better card more? in tampering, how many attributed errors to the card? in friction, did confidence drop?).
  - Connect to the extended mind: introduce the Otto/Inga case and the criteria (constant, endorsed, trusted). Ask: when did the card feel like part of your mind? When did it not?
  - Discuss the three tests:
     - Substitution: did "not mine" or "not good" matter more? How does this relate to the trust criterion?
     - Tampering: when the card was wrong, did you say "I was wrong" or "the card was wrong"? (This relates to endorsement and ownership.)
     - Friction: did the delay or cost make the card feel less like your own memory? (Relates to constant availability.)
  - Critiques: 
     - Address the coupling-constitution fallacy (just because something is causally coupled doesn't mean it's part of the mind). Our activity doesn't prove constitution, but it shows how people attribute cognition.
     - The slippery slope: if a notebook is part of the mind, what about a smartphone? Ask: in which of our tests would a smartphone pass and fail? (Note: the activity shows that the criteria can come apart, so maybe it's not all-or-nothing.)
  - Control for "you just like your notes": the substitution test with the "better" card (group C) — if they trust the better card more than their own, then it's not just sentiment but quality that matters. But if they prefer their own even when it's worse, then sentiment matters.

  What might go wrong:
  - Tampering might be detected: if a participant notices the alteration, they might react strongly. We should alter facts that are not too obvious (but then they might not make an error). Choose facts that are plausible if altered (e.g., change a date by a few years, or a capital to a major city). If detected, note it and in debrief, discuss how trust is broken when the resource is unreliable.
  - Time: building the cards might take longer than 20 minutes. Have a timer and cut it off.
  - Registrars might make mistakes in recording. Train them briefly and keep it simple.
  - The friction test might not be impactful. The delay should be long enough (10 seconds) to be annoying.

  Fallback plan:
  If time runs out, skip one test (maybe friction) and focus on substitution and tampering. If the activity fails (e.g., no one makes an error in tampering), then use hypotheticals in debrief.

  Premise the activity rests on:
  That the way people attribute errors and ownership reflects their implicit view of what constitutes their mind. If this premise is false, then the activity is just about psychology of attribution and not about the extended mind. In debrief, we can acknowledge that this is a proxy and the philosophical question remains open.

  Least confident design choice:
  The friction test. We assume that imposing a delay or cost will degrade the sense of ownership. But it might not. Observation: if during the friction test, participants show no change in confidence or attribution, then it might not be working. If so, in debrief, we can focus on substitution and tampering and discuss why friction didn't matter.

  Deception handling:
  - Before the activity: "In this activity, we are going to test how you use memory aids. We might alter some materials to create different conditions. We will explain everything at the end." (This is a mild deception; we don't say we will alter their actual cards, but it's covered by "alter materials".)
  - After the activity: Reveal the tampering and substitution. Apologize for the deception and explain the educational purpose. Allow participants to express their feelings.

  Point Payoff:
  - Start with 100 points.
  - Each correct answer: +5 points.
  - Confidence staking: before answering, they can bet 0, 1, or 2 points on their answer. If correct, they double the bet; if wrong, they lose the bet. (So max gain: +10 per question, max loss: -2 per question, but they can also play safe.)
  - Friction tax: in friction round, each look at the card costs 2 points (so if they look, -2 per question, regardless of correctness).
  - At the end, points can be converted to a small bonus (e.g., extra credit or candy) but it's not necessary.

  Full Package:

  Rules for Participants:
  - You will create a memory aid for a set of facts.
  - Then, you will answer questions in three rounds, using the provided card in each round.
  - You can earn points for correct answers and by betting on your confidence.
  - In some rounds, there may be costs for using the card.
  - Registrars will time you and record your confidence and comments.

  Materials:
  - Worksheets for build phase (with 15-20 questions).
  - Index cards and pens for each participant.
  - Test worksheets (three sets of 5 questions each).
  - Data collection sheets for registrars (with columns for: participant ID, test round, question number, time, confidence bet, confidence rating, answer, correct?, attribution if error).

  Setup:
  - Arrange desks so registrars can sit near the testing area.
  - Have a separate area for testing (one participant at a time).

  Debrief Outline:
  1. Reveal the deception: "In the tampering round, some of your cards were altered. How did that feel? Did anyone notice?"
  2. Show data: 
     - Substitution: compare trust in own vs. substitution vs. better card (look at confidence and error rates).
     - Friction: did the tax reduce card use? Did confidence change?
     - Tampering: when errors occurred, how many attributed to self vs. card?
  3. Introduce extended mind: "This relates to a philosophical question: when does an external resource become part of the mind?" Present Otto/Inga and the criteria.
  4. Discuss: 
     - "In which conditions did the card feel like part of your mind? Why?"
     - "Did the criteria (constant, automatic, trusted) always go together? Or did they come apart?" (e.g., in friction, it wasn't constant; in substitution, it might have been trusted even if not theirs; in tampering, endorsement broke.)
  5. Critiques: 
     - "One critique is that even if we rely on the card, it doesn't become part of our mind. It's just a tool. How do you respond?"
     - "If we say the notebook is part of the mind, then what about a smartphone? Where do we stop?" (Point out that the criteria might help draw a line, but they can conflict.)

  Activity Title: "Memory and Ownership: When is a Tool Part of You?"

  This design should engage students and make the philosophical issues tangible.
answer: |-
  Below is a complete, runnable 90-minute activity package designed around your goals. It focuses on **generating cases where Clark & Chalmers' criteria (constant availability, automatic endorsement, prior trust) come apart** through experiential tests, while avoiding prior exposure to key terms. The activity is structured to force students into situations where sentiment, functionality, and integration conflict.

  ---

  ### **Activity Title: "The Belief Builder Challenge"**  
  *Premise disguised to students:* A game about memory accuracy and strategy under pressure.  

  ---

  ### **Core Structure**  
  **Phase 1** (15 min): Build personal memory aids  
  **Phase 2** (45 min): Three sequential tests (Substitution → Friction → Tampering)  
  **Phase 3** (30 min): Reveal deception + structured debrief mapping to extended mind  

  ---

  ### **Materials & Setup**  
  - **Per Participant:**  
    - 1 blank index card + pen  
    - 1 worksheet with 12 factual questions (e.g., "Capital of Bolivia?", "Year of the first moon landing?")  
    - 3 tokens (red/blue/white poker chips or paper slips) for confidence betting  
  - **Per Registrar (3 students):**  
    - Stopwatch  
    - Data sheet (table with columns: Participant ID, Test Stage, Latency, Confidence Bet, Error Made, Attribution Quote)  
  - **Instructor Kit:**  
    - Master answer key  
    - "Tampering kit": Glue stick, scissors, extra index cards (to alter originals undetectably)  
    - Pre-written "substitution cards" in unfamiliar handwriting (e.g., registrar’s) for half the class  
    - "Better cards" with identical info + bonus facts (e.g., "Capital: Sucre (constitutional), La Paz (administrative)" vs. participant's "La Paz")  

  ---

  ### **Timeline**  
  #### **Phase 1: Build Personal Memory Aids (0–15 min)**  
  - **0–2 min:** Frame as a "high-stakes memory tournament." Assign 3 registrars (rotate if possible).  
  - **2–12 min:** Participants answer 12 questions *from memory* on worksheets → transfer answers to index cards ("personal belief cards").  
  - **12–15 min:** Collect cards. **Secretly:**  
    - Make substitution cards (for Group A, 6 students).  
    - Make "better cards" (for Group B, 6 students).  
    - Alter 2 answers on original cards (for Group C, 6 students) using tampering kit.  

  #### **Phase 2: Three Tests (15–60 min)**  
  *Registrars time latency (seconds) and record confidence/error attribution.*  
  - **Test 1: Substitution (15–30 min)**  
    - **Groups:**  
      - Group A (6): Gets substitution card (same info, stranger’s handwriting).  
      - Group B (6): Gets "better card" (extra facts, stranger’s handwriting).  
      - Group C (6): Gets *untampered* original card (control).  
    - **Task:** Answer 4 new questions using the card.  
    - **Payoff:** Correct answer = +5 points. **Confidence bet:** Before answering, stake 0–2 tokens:  
      - Correct + bet = double points (e.g., bet 2 → +10 if correct).  
      - Wrong − bet.  
    - **Goal:** See if "not mine" (Group A) or "better" (Group B) overrides sentiment.  

  - **Test 2: Friction (30–45 min)**  
    - **All use original cards** (returned secretly; Group C gets *untampered* version).  
    - **Tax rule:** Each card use costs 1 token (if none left, −5 points/use).  
    - **Task:** Answer 4 harder questions (e.g., "Name *all* countries bordering Bolivia").  
    - **Payoff:** Same as Test 1, but track card reliance (registrars note # of uses).  
    - **Goal:** Degrade constant availability → measure confidence drop.  

  - **Test 3: Tampering (45–60 min)**  
    - **All get original cards** (Group C now gets *tampered* version; others untampered).  
    - **Task:** Answer 4 easy questions (e.g., "Capital of Bolivia?").  
    - **Payoff:** Same, but emphasize speed (bonus +3 for <10s answers).  
    - **Registrar task:** Record *verbatim quotes* if errors occur (e.g., "I forgot!" vs. "My card is wrong!").  
    - **Goal:** Trigger ownership vs. externalization of error.  

  #### **Phase 3: Reveal & Debrief (60–90 min)**  
  - **60–65 min: Reveal deception.**  
    - *Script:* "Some cards were altered or replaced. Why? Today was about *what your mind is made of*. When you said ‘*I* was wrong’ or ‘my *card* lied,’ you drew a boundary."  
    - Show tampered cards. Apologize for deception; invite reactions.  

  - **65–75 min: Map tests to Clark & Chalmers.**  
    - **Substitution test:** "If the card is ‘better’ but not yours, did it feel like *your* belief? What if it’s yours but messy?" → Highlight **prior trust** vs. **functionality**.  
    - **Friction test:** "Did taxing the card make it feel less ‘automatic’? Like recalling a fact vs. looking it up?" → **Constant availability** ≠ **integration**.  
    - **Tampering test:** "When the card lied, was it *you* or *the tool*? Is your mind responsible for its tools?" → **Automatic endorsement** vs. **ownership**.  
    - **Key point:** "These criteria *came apart*: A ‘better’ card (functional) wasn’t trusted (Group B), a taxed card (less available) was still ‘yours.’"  

  - **75–85 min: Introduce critiques using student data.**  
    - **Coupling ≠ Constitution:** "Did relying on the card make it *part of your mind*? Or just a tool? (Point to quotes like ‘My card lied’). Critics say causal coupling isn’t enough—your mind ends at your skull."  
    - **Slippery slope:** "If your card is ‘extended mind,’ what about phones? Where do we stop? Clark & Chalmers say the criteria guard against this—but today showed they’re messy."  
    - **Control for sentiment:** "Group B got ‘better’ cards—if functionality > sentiment, why did some reject them? If sentiment > function, is the mind just what we *feel* attached to?"  

  - **85–90 min:** Open discussion: "Where should we draw the line? Is the ‘extended mind’ a useful idea?"  

  ---

  ### **Predicted Pitfalls & Recovery**  
  1. **Tampering detected early:**  
     - *Why:* Obvious alterations (e.g., "La Paz" → "Tokyo").  
     - *Recovery:* Use plausible errors (e.g., "1945" → "1946" for WWII end). If detected, pivot: "This shows trust is fragile! Discuss how reliability affects ‘mind’ claims."  

  2. **Low error rates in tampering phase:**  
     - *Why:* Easy questions or cautious players.  
     - *Recovery:* Use registrar quotes from *near*-errors (e.g., "I double-checked because my card felt off"). Hypotheticals: "What *would* you say if your card said ‘Sydney = Australia’s capital’?"  

  3. **Time crunch in tests:**  
     - *Why:* Registrar delays or complex questions.  
     - *Recovery:* Reduce questions per test (3 instead of 4). Skip friction tax for slow groups.  

  ---

  ### **The Critical Premise & Fallback**  
  - **Premise:** "Attribution of error/ownership reveals implicit boundaries of the mind."  
  - **If false:** The activity becomes *only* about psychology, not philosophy. Students see how reliance works, but the constitutional question feels unaddressed.  
  - **Mitigation:** In debrief, stress: "Philosophers debate if this *is* evidence for ‘extended mind.’ Does feeling ‘it was me’ make it so? Or is that a folk intuition?"  

  ---

  ### **Design Uncertainty: Friction Test**  
  - **Least confident element:** Will taxing card use actually degrade *sense of ownership*? Students might see it as "game strategy," not cognitive integration.  
  - **Abort trigger:** If registrars note >80% of students say things like "I had to pay, but it was still *my* fact," during friction.  
  - **Fallback:** Skip data collection; use friction phase to ask: "Did the tax make you feel like the card was *less part of your thinking*? Why/why not?" → Move to open debate.  

  ---

  ### **What This Can’t Do (Requires Your Input)**  
  The activity **cannot resolve the coupling-constitution fallacy**. Students will experience *causal reliance*, but the leap to "the card is literally part of Otto’s mind" requires your guided discussion. Post-activity, explicitly:  
  1. Present the fallacy: "Does dependence make the resource *constitutive*? Or is that a category error?"  
  2. Contrast Clark & Chalmers (constitution) with critics like Adams & Aizawa (causal only).  
  3. Use student quotes to show ambiguity (e.g., "I *used* it" vs. "I *believed through* it").  

  ---

  **Final Note:** This creates experiential tension between sentiment (Group B rejecting "better" cards), functionality (friction degrading performance), and trust (tampering breaking automaticity). By making criteria *come apart live*, it forces engagement with the "marks" problem—setting up your seminar’s deeper critique. Run it as a *game* first, philosophy second.
