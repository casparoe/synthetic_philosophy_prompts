prompt: |-
  I edit the science-and-ideas desk at a national newspaper and write a weekly column, and I am trying to repair something about how we decide what to run. Two or three times a week a study arrives — usually a preprint, or a journal paper under embargo — and the operative question at our morning conference has quietly stopped being whether the finding is true and become who else has it. The honest description of our workflow is: check whether the wires and two or three respected competitors have moved, and if they have, move ourselves; if nobody has, treat that as a reason for caution. Having read a general-audience account of informational cascades and rational herding, I now suspect both halves of that workflow can be given a rational defence and that neither defence is obviously sound — which is to say I cannot tell, in a given case, whether the crowd is telling me something about the world or only about itself.

  My own provisional taxonomy, which I would like you to correct as well as use, has four entries. First, evidence pooling: many parties converge because each saw something independently, and the convergence is genuinely informative. Second, cascade proper: later actors hold private signals but their public behaviour is swamped by what earlier actors did, so their information never becomes public and the twentieth follower adds nothing to the nineteenth. Third, imitative or reputational herding: actors match the crowd because being wrong alongside the crowd is cheaper than being wrong alone, in which case the crowd carries no information about the world at all, only about incentives. Fourth, a case I have not seen discussed and that I think is the common one in my trade: apparent independence that is an artefact, where everyone's private signal traces back to the same press release, the same dataset, the same measurement instrument, the same small circle of labs, or the same initial wave of coverage.

  I would like you to turn whatever survives in that taxonomy into a written decision procedure my reporters can actually run. Concretely: the desk has no statistician, one fact-checker, a section editor who signs off on anything that deviates from what competitors are doing, and about thirty minutes between the embargo lifting and the moment a decision has to be made. So I need ordered tests, not an essay; what counts as a sufficient answer to each question; what to do when the number or the document a test calls for cannot be obtained; the points at which the procedure returns a flat no; and the points at which it must hand the decision to a person because the remaining question is one of values rather than evidence — news value against the cost of amplifying a false claim, and against the cost to us of being seen to have sat out a real one.

  I should also say what I have been using informally, so you can tell me which parts to throw away. I count distinct upstream sources rather than outlets, on the theory that thirty stories from one press release is one source. I apply something like a defector rule: a single detailed dissent from someone with access to the data is worth more than twenty follow-ups, and I weight it accordingly. I treat silence as ambiguous rather than as evidence against a claim, since I suspect the failure to publish null results is itself a herd phenomenon. And I treat our own earlier coverage of a claim as a reason to scrutinise a new result harder, not as a reason to stand pat.

  Please run the finished procedure on three hypotheticals. One: a psychology preprint, roughly two hundred participants, a counterintuitive result about an everyday habit, thirty outlets inside forty-eight hours, all traceable to a single university press release, no independent dataset, and a reporter on my desk who is convinced. Two: a geophysics result about ocean heat, three groups, different methods and different underlying data, covered by two specialist outlets and ignored by everyone else, with the desk inclined to skip it as already covered. Three: a preprint failing to replicate a finding we ourselves ran prominently eight months ago, from a mid-sized lab, covered by one small newsletter and no one else, with competitors silent and no obvious appetite anywhere for the story.

  I want a committed response rather than a survey. Fix one ordering of the tests and defend it; tell me which single test you would keep if I could keep only one; give a definite verdict on each of the three cases, including the third, where I expect the verdict to be one I would rather not hear; say which of my four informal rules are wrong or misfire; and state plainly what the procedure cannot do, so I do not end up presenting it to the section editor as more than it is. If a step depends on a technical result from the literature on herding, state the result in one sentence and flag whether it is contested, but do not give me citations, references, or a reading list: I cannot act on those, and I will not check them.
reasoning: |-
  Hmm, this is a fascinating and complex request from a science editor grappling with herd behavior in journalism. The user has clearly done deep thinking about informational cascades and wants a practical decision tool for their high-pressure newsroom environment.

  First, I need to understand their core frustration: the shift from evaluating scientific truth to tracking competitor behavior. Their taxonomy of four herding scenarios is impressively nuanced - especially the fourth type about apparent independence masking shared sources. That's keen observational insight from someone in the trenches.

  The constraints are brutal: no stats experts, 30-minute windows, and institutional pressure to follow competitors. Their existing heuristics (source counting, valuing dissent, skepticism toward past coverage) show sophisticated metacognition about media dynamics. I particularly agree with treating silence as ambiguous rather than negative evidence - that's a subtle point many miss.

  For the decision procedure, I'm considering a branching flow that prioritizes detectable signals over theoretical ideals. The key is ordering tests by what can realistically be assessed in half an hour. Source independence must come first - it's the most common failure mode in their examples. Then credibility of dissent, then methodological red flags.

  The three hypotheticals perfectly illustrate pain points: 
  - The psychology study shows manufactured consensus via press release
  - The geophysics case demonstrates valuable independent convergence 
  - The replication challenge reveals how ego and past investments distort coverage

  I'll defend keeping the source independence test as the single non-negotiable checkpoint. It directly addresses their most frequent failure mode (the "fourth type" in their taxonomy). The other tests become meaningless if everyone's parroting the same origin point.

  Their existing rules mostly hold up well, except weighting dissent: a lone critic needs careful vetting to avoid false balance. And while their skepticism toward past coverage is laudable, it could backfire if institutional memory prevents covering legitimate challenges.

  Crucially, I must emphasize this tool's limits: it can't assess scientific truth, only the reliability of consensus. The editor needs to own the value judgments about running uncomfortable stories. That transparency is vital before presenting to the section editor.

  The procedure will have clear exit ramps: hard stops when source tracing fails or dissent passes credibility checks. And for their third hypothetical - the replication challenge they'd rather avoid - the verdict must be unambiguous: run it, with their own past coverage prominently acknowledged.
answer: |-
  Here's a decision procedure for evaluating studies under time pressure, designed to combat informational cascades in science journalism. It prioritizes detectable signals of independence and credibility over unverifiable claims.

  **Decision Procedure: "HERD Test" (Hierarchical Evaluation for Reliable Dissemination)**  
  *(Execute steps in order; stop and act if a definitive answer is reached)*

  1.  **Source Traceability (5 mins)**
      *   *Test:* Identify the primary source(s) of data/methodology. Is there **>1 genuinely independent origin**? (e.g., distinct labs, unique datasets, separate measurement techniques *not* derived from a common source/PR).
      *   *Sufficient Answer:* YES (≥2 independent origins) → Proceed to Step 2. NO (Single PR/lab/dataset drives all coverage) → **STOP. DO NOT COVER (Hard Stop)**. If unclear/unknown → **Assign to reporter for 5-min urgent source dig; if still unclear → STOP. DO NOT COVER**.
      *   *Rationale:* Addresses your "fourth case" (artificial independence). Multiple independent sources significantly increase credibility (*Contested but widely accepted principle: Independence reduces correlated error risk*).

  2.  **Credible Dissent Check (7 mins)**
      *   *Test:* Is there **detailed, methodological dissent from a qualified source** with data access? (Look beyond press release/abstract: check preprint comments, direct outreach via reporter's network, expert rapid email query).
      *   *Sufficient Answer:* YES (Specific, data/design-focused critique) → **STOP. ASSIGN FOR IMMEDIATE INVESTIGATION (Likely DO NOT COVER without resolving critique)**. NO → Proceed to Step 3. AMBIGUOUS/INSUFFICIENT → Proceed to Step 3.
      *   *Rationale:* A single credible defector can invalidate a cascade (*Rational herding models show one strong contrary signal can break cascades, but relies on signal strength/credibility*).

  3.  **Convergence Quality Assessment (10 mins)**
      *   *Test:* **IF >3 outlets cover it:** Are covering outlets methodologically diverse (specialists + generalists)? **IF ≤3 outlets cover it:** Are they highly reputable specialists in the field?
      *   *Sufficient Answer:* YES (Diverse coverage OR specialist-only coverage) → Proceed to Step 4. NO (Only generalists/same-type outlets) → **STOP. DO NOT COVER**. If coverage absent but Step 1 passed → Proceed to Step 4 (Silence isn't evidence against *if* independence exists).
      *   *Rationale:* Distinguishes evidence pooling (diverse/specialist interest) from weaker cascades or reputational herding.

  4.  **Internal & News Value Judgment (8 mins - Editor Decision Point)**
      *   *Inputs:* Results of Steps 1-3, study's novelty, public relevance, our prior coverage (if any), potential harm if wrong.
      *   *Test:* **Does the potential news value & public interest JUSTIFY the risk of amplifying a potentially flawed claim?** (Explicitly weigh against Step 1-3 results).
      *   *Sufficient Answer:* Decision by editor. Options: COVER (with caveats if Steps 1-3 weak), HOLD FOR MORE INFO, DO NOT COVER. **Mandatory:** If *we covered the original claim*, coverage MUST address the replication/contradiction directly and prominently.
      *   *Rationale:* Values-based decision after evidence assessment. Forces explicit risk/reward analysis.

  **If You Can Only Keep One Test: SOURCE TRACEABILITY (Step 1).** It directly attacks the most common failure mode ("apparent independence as artefact") and is often verifiable quickly. A "NO" here is a reliable early stop signal.

  **Critique of Your Informal Rules:**
  1.  **Counting distinct upstream sources:** **KEEP & STRENGTHEN.** Core of Step 1.
  2.  **Defector Rule:** **REFINE.** Your weighting is sound, but Step 2 formalizes "detailed dissent from someone with access to data". Avoids over-weighting vague criticisms.
  3.  **Silence as Ambiguous:** **KEEP.** Embedded in Step 3 logic. Correctly avoids interpreting non-coverage as evidence against.
  4.  **Scrutinize our past coverage harder:** **KEEP BUT EXTEND.** Step 4 mandates explicit handling of contradictions to past coverage, ensuring accountability.

  **What This Procedure CANNOT Do:**
  *   Guarantee a finding is "true". It assesses *reliability of the consensus signal*, not scientific truth.
  *   Perform deep statistical/methodological review within 30 mins.
  *   Override strong institutional pressure to "follow the pack" without executive buy-in.
  *   Detect sophisticated fraud or errors invisible without deep expertise/data access.
  *   Measure the absolute "importance" of a finding – only its relative credibility and newsworthiness *given the constraints*.

  ---

  **Application to Hypotheticals:**

  1.  **Psychology Preprint (Counterintuitive Habit):**
      *   Step 1: **NO** (Single press release → all outlets trace to one source). **VERDICT: DO NOT COVER (Hard Stop)**. Reporter's conviction is overruled – it's an artefactual cascade. *Your rule applied: Source counting correctly flags this.*

  2.  **Geophysics (Ocean Heat):**
      *   Step 1: **YES** (3 groups, different methods/data → genuine independence).
      *   Step 2: **NO** credible dissent found (assumed).
      *   Step 3: **YES** (Covered by specialists → valid convergence despite lack of general interest).
      *   Step 4: Editor weighs: High inherent importance (climate), novel convergence, specialist validation. **VERDICT: COVER** (Emphasize independent convergence). *Your rule applied: Avoiding silence misinterpretation – specialist coverage is sufficient signal.*

  3.  **Replication Failure (Our Prior Coverage):**
      *   Step 1: **YES** (New lab, presumably independent of original).
      *   Step 2: **NO** credible dissent *against the replication* found (assumed).
      *   Step 3: **AMBIGUOUS/NO** (Only one small newsletter → weak convergence signal). *But:* Step 1 passed, silence isn't evidence against.
      *   Step 4: **CRITICAL EDITOR JUDGMENT.** News Value: High – directly challenges *our own* prior coverage, core to scientific accountability. Risk: Embarrassment, but higher risk to credibility if we ignore. **VERDICT: COVER PROMINENTLY** (Mandatory: Explicitly state we covered original, detail replication methods, explain significance of failure). *Your rule applied: Scrutinizing past coverage forces coverage here; defector rule wasn't triggered but wasn't needed for this verdict.*

  This procedure forces explicit consideration of independence and dissent before herding dynamics take over, provides clear stopping points, and frames the final editorial judgment within the constraints of evidence-based assessment. Its strength lies in sequential filtering of the most common cascade failure modes first.
