  1. Preparation:
     - Create a set of index cards with made-up words (nonsense syllables) and drawings or descriptions of objects. We are going to create two chains of examples for the same made-up category (let's call the category "Zazz"). The category is arbitrary and we define it by the examples we choose to include.

     - The examples should be arranged in two chains that overlap in the middle but diverge at the ends.

     Example chain for Group A:
       - Example 1: A red circle with dots inside -> "Zazz"
       - Example 2: A red circle without dots -> "Zazz" (resembles Example 1 in color and shape, but no dots)
       - Example 3: A blue circle without dots -> "Zazz" (resembles Example 2 in shape and absence of dots, but different color)
       - Example 4: A blue square without dots -> "Zazz" (resembles Example 3 in color and absence of dots, but square)

     Example chain for Group B:
       - Example 3: A blue circle without dots -> "Zazz" (same as in Group A)
       - Example 4: A blue square without dots -> "Zazz" (same as in Group A)
       - Example 5: A blue square with stripes -> "Zazz" (resembles Example 4 in color and shape, but stripes instead of plain)
       - Example 6: A red square with stripes -> "Zazz" (resembles Example 5 in shape and stripes, but red)

     Note: The overlapping examples (3 and 4) are the same for both groups.

     - Also, prepare a set of test examples that are ambiguous, especially some that are similar to the ends of both chains (e.g., a red square without dots? a blue circle with stripes? etc.)

  2. Splitting and Training:
