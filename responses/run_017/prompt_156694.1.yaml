     - Training procedure for each group:
          - The trainer shows the group the examples one by one and says whether each is "Zazz" or not. The group must figure out the pattern (but without stating a rule). They can only ask the trainer about new examples and get a yes/no.

          - For Group A: Show Example 1: "This is Zazz." Example 2: "This is Zazz." ... until Example 4. Then they can start asking about new examples (from a set of test examples) to see if they can extend the category.

