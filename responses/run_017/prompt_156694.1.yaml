          - For each test example the judge chooses, the groups write their answer (yes/no) on an index card and hold it up. 
          - If both groups agree, they each keep their point for that round. If they disagree, they each lose a point (give the card to the facilitator).
          - After 5 rounds, the judge decides: same or different? 
          - If the judge says "same", and the groups have at least 3 agreements (so they have at least 3 points each remaining), then the judge gets 5 points (represented by 5 index cards). 
