          - Then the judge must decide: same game or different? If the judge says "same", and the groups had at least 3 agreements (majority), then the judge gets 5 points. If the judge says "different", and the groups had less than 3 agreements, then the judge gets 5 points. Otherwise, the judge gets 0. The groups don't care about the judge's points.

