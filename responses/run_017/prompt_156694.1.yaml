          - Each group gets 1 point for every test example that the judge asks, if they answer the same as the other group (without seeing each other's answers). This encourages them to try to align, but they have no way to do so except by their own chain. The judge then decides: same game or not? If the judge says "same", then both groups get an additional 5 points. If the judge says "different", then the group that the judge thinks is more consistent (the judge picks one) gets 5 points, the other gets 0. But this might be too vague.

