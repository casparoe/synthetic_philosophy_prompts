          But note: the groups might end up with different points if they started with 10 and then lost some? We gave each group 10 at the start, and then for each round they either keep the point (if they agree) or lose one (if they disagree). But they start with 10, and we do 5 rounds, so they can lose at most 5. They end with between 5 and 10 points.

          This scoring is arbitrary and might not be necessary. Alternatively, we can just do the activity without points and focus on the discussion.

