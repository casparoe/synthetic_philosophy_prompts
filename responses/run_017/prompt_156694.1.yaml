  The core idea: Split the class into two groups (Group A and Group B). Each group is trained on a different set of examples of a made-up category. The examples are arranged so that they form a chain of resemblances: Group A sees examples that go from A to B to C, and Group B sees examples that go from C to D to E. The overlapping examples (in the middle, like C) are the same for both groups. Then, we bring the groups together and have an untrained student (or a few) try to decide if the two groups are playing the same game (i.e., using the same category).

  We'll use a payoff scheme without money. Since we have index cards and a projector, we can use a point system and display the points on the projector.

