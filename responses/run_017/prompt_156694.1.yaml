        - The goal for Group A and Group B: They want the judge to think they are playing the same game. So they get points if the judge says "same game". But also, they must be consistent with their training. If they are caught by the judge giving an answer that is inconsistent with their training (which the judge doesn't know, but the facilitator does), they lose points. How do we enforce consistency? We have the facilitator (who knows the training sets) as a referee. But note: the groups are allowed to extend beyond their training, but they must do so in a way that is consistent with the family resemblance idea.

        However, we don't want to penalize them too much for being creative. Instead, we might focus on the judge's decision.

