answer: |-
  ## Joint Statement of the Adversarial Collaboration on the Structure of Hedonic Value

  Following two years of rigorous collaborative investigation, we, the undersigned representatives of Lexical Threshold Negative Utilitarianism (LTNU) and Symmetric Commensurabilism (SC), present this joint statement. Our collaboration was grounded in significant common ground: both parties affirm act-consequentialism as the correct framework for evaluating actions based solely on their consequences for the well-being of sentient beings; both accept expected-value reasoning as the basic, default methodology for decision-making under uncertainty; both reject the imposition of non-consequentialist side-constraints based on rights, desert, or the separateness of persons; and both affirm the possibility and necessity of meaningful interpersonal comparisons of well-being, rejecting scepticism that would limit us to merely ordinal rankings. We also stipulated that "pleasure" and "pain/suffering" refer to phenomenally conscious states with positive and negative hedonic valence respectively, and that these are the primary bearers of intrinsic value and disvalue relevant to our dispute. These shared foundations allowed us to isolate our core disagreement effectively.

  Our collaborative work has yielded several points of agreement concerning the nature of the dispute and relevant cases:

  1.  **The central disagreement is substantive:** It concerns the fundamental structure of value regarding the relationship between the disvalue of suffering and the value of happiness. This is not merely a dispute about empirical measurement difficulties or aggregation rules, though these are intertwined.
  2.  **The concept of "threshold" is non-arbitrary for LTNU:** For proponents of LTNU, the lexical threshold marks a qualitative discontinuity in value, not merely a point where measurement becomes coarse. It signifies that the *kind* of disvalue associated with suffering above the threshold is fundamentally incommensurable with the value of pleasure.
  3.  **Commensurability for SC is fundamental:** For proponents of SC, the possibility of trade-offs between any quantity of suffering and some sufficient quantity of pleasure is inherent in the nature of hedonic value itself, regardless of practical measurement challenges.
  4.  **The "intrapersonal analogue" reveals a divergence:** Both parties agree that LTNU's claimed asymmetry, if it exists, should plausibly manifest within a single life as well as across lives. Therefore, the case of a single person experiencing a period containing equal quantities of intense pleasure and moderate pain is a relevant test. LTNU proponents argue the moderate pain might be lexically prior (if above threshold) or require vastly more pleasure to offset (if near threshold), while SC proponents argue the net value depends solely on the precise magnitudes and durations involved, expecting potential net positivity depending on the specific intensities and durations.
  5.  **The "placement problem" is critical and challenging:** Both sides agree that if LTNU is correct, specifying *where* the threshold lies and *what* determines it (intensity, duration, type of suffering, context, or some combination) is a profound challenge requiring significant conceptual and empirical work. Failure to provide a plausible account significantly weakens LTNU. SC proponents see the placement problem as a major source of instability for LTNU.
  6.  **The "fanaticism charge" point is a key pressure point:** Both acknowledge that the choice involving a very small probability of suffering at or near the lexical threshold versus a certainty of a vast quantity of ordinary happiness represents a critical test case highlighting the practical implications of LTNU's lexical priority. This is where accusations of excessive risk-aversion or "fanaticism" directed at LTNU gain traction, and where SC's commitment to commensurability leads to very different prescriptions.
  7.  **The "intervention case" is pivotal for defining suffering:** The hypothetical intervention removing the *unpleasantness* of a painful state while leaving sensory discrimination, autonomic response, and avoidance behaviour intact is agreed to be crucial. Both sides concur that if the resulting state lacks unpleasantness, it ceases to be an instance of suffering *as we understand it in the context of hedonic disvalue*. The key disagreement lies in predicting what such an intervention would reveal about the phenomenology and whether unpleasantness is truly separable in this way. LTNU predicts such states would show suffering is essentially tied to unpleasantness, while SC predicts the remaining components might still constitute a negative state demanding aversion, though perhaps less intensely.

  **Residual Disagreements:**

  Our core disagreement remains unresolved. Lexical Threshold Negative Utilitarianism holds that: *There exists a level of suffering, defined by its severity (potentially involving intensity, duration, and/or type), such that no finite quantity of positive hedonic states (pleasure, happiness), regardless of how large or how distributed across individuals, can morally outweigh a single instance of suffering at or above this threshold level. The disvalue of such suffering is lexically prior to the value of any aggregations of sub-threshold pleasures.*

  Symmetric Commensurabilism holds that: *Pleasure and pain/suffering occupy positions on a single, common scale of hedonic value. Consequently, for any finite instance of suffering, regardless of its severity, there exists some finite quantity of pleasure, distributed in some way across some number of individuals, such that the aggregate positive value of that pleasure morally outweighs the disvalue of the suffering. No absolute lexical priority exists; trade-offs are always possible in principle.*

  **Cruxes and Predictive Commitments:**

  Our collaboration identified several specific cruxes – questions whose resolution would significantly impact the standing of one or both views. For each, we outline the question, a shared piece of evidence/case/argument considered relevant, and the specific, pre-registered prediction each side makes about its implications.

  1.  **Crux: The Nature of Severe Suffering & Unpleasantness.** Does hedonic disvalue (suffering) fundamentally consist in, or necessarily entail, a phenomenally unpleasant character? Or can suffering exist without this unpleasant component, sustained solely by discriminative, autonomic, and behavioral dispositions?
      *   **Shared Focus:** The "intervention case" described above, alongside real-world phenomena like pain asymbolia and studies on the neural correlates of unpleasantness vs. sensory components of pain.
      *   **LTNU Prediction:** Empirical investigation will reveal that the unpleasantness component is constitutive of suffering's disvalue. Removing it genuinely removes the suffering, leaving a neutral or potentially even positive state if associated with relief. This supports the view that above-threshold suffering involves an irreducibly negative phenomenal character that grounds its lexical priority.
      *   **SC Prediction:** Empirical investigation will reveal that even without distinct unpleasantness, states involving intact nociception, autonomic distress, and reflexive aversion retain significant negative valence or disvalue, perhaps through their connection to functional impairment or inherent aversiveness of the responses. This undermines the claim that unpleasantness is the sole bearer of disvalue capable of grounding lexical priority.

  2.  **Crux: Numbers and the Threshold.** Does aggregating vast numbers of individuals experiencing sub-threshold pleasures have the power to morally outweigh a single instance of suffering above the lexical threshold, thereby reintroducing de facto commensurability?
      *   **Shared Focus:** Thought experiments involving a single individual experiencing suffering definitively above the proposed threshold (e.g., prolonged, intense torture) versus scenarios where a vast multitude (e.g., billions) experience a minor, fleeting pleasure (e.g., a pleasant breeze, a small tasty bite).
      *   **LTNU Prediction:** Lexical priority is absolute. No finite number of individuals experiencing finite sub-threshold pleasures, however large, can outweigh the disvalue of the single above-threshold suffering instance. The qualitative difference in disvalue renders the quantities irrelevant.
      *   **SC Prediction:** The sheer scale of aggregated positive value from a sufficiently vast number of individuals experiencing even minor pleasures will inevitably outweigh the disvalue of the single severe suffering instance. The thought experiment reveals that lexical priority cannot be maintained in the face of large numbers without leading to counterintuitive paralysis or requiring implausible claims about the infinite disvalue of above-threshold states.

  3.  **Crux: Fanaticism and Low-Probability High-Stakes Suffering.** Is it rational or morally required to avoid actions carrying even a minuscule probability of causing suffering near or at the lexical threshold, regardless of the size of the countervailing certain benefits involving sub-threshold happiness?
      *   **Shared Focus:** Cases involving risky interventions with enormous expected positive payoffs (e.g., medical advances, disaster prevention) that carry a vanishingly small probability of triggering a catastrophic outcome involving suffering plausibly near the threshold (e.g., creating a pathogen causing severe, prolonged agony).
      *   **LTNU Prediction:** Expected disvalue calculations must assign lexical priority to avoiding the above-threshold outcome. If the probability is non-zero, and the suffering is sufficiently severe (at or above threshold), the expected disvalue becomes infinite or undefined, demanding avoidance regardless of the low probability or the magnitude of the certain benefits. This is not fanaticism but fidelity to the structure of value.
      *   **SC Prediction:** Expected value calculations remain applicable. The extremely low probability of the catastrophic outcome, multiplied by its finite (though immense) disvalue, will be outweighed by the high probability multiplied by the vast positive value of the benefits. Treating the low-probability outcome as lexically prior constitutes an irrational and paralyzing form of fanaticism about worst-case scenarios.

  4.  **Crux: Threshold Determinants.** Can a stable, non-arbitrary criterion be provided for locating the lexical threshold (intensity, duration, type, context)?
      *   **Shared Focus:** Examining diverse instances of severe suffering (e.g., intense but brief pain vs. moderate but unremitting pain vs. existential anguish vs. severe depression) and attempting to formulate a principled basis for declaring some lexically prior while others are not.
      *   **LTNU Prediction:** While challenging, a principled account can be developed, likely centering on suffering so severe that it destroys the capacity for positive experience or agency, or constitutes an absolute assault on well-being, potentially involving a combination of intensity, duration, and type. Finding such an account is crucial but feasible.
      *   **SC Prediction:** Efforts to locate a non-arbitrary threshold will inevitably fail or lead to significant internal disagreement even among LTNU proponents. The boundary will appear fuzzy, context-dependent, or reliant on factors (like "destroying agency") that themselves involve value judgments and reintroduce forms of commensurability. The persistent difficulty confirms that commensurability is the simpler, more stable view.

  5.  **Crux: Lexicality as Value or Decision Rule.** Given profound uncertainty in measuring and comparing severe suffering, is LTNU best understood as a claim about the true structure of value, or as a pragmatic decision rule for acting under ignorance?
      *   **Shared Focus:** Analysis of decision-making in contexts of extreme uncertainty regarding the severity and likelihood of potential suffering outcomes.
      *   **LTNU Prediction:** Lexical priority reflects the true, underlying structure of value, even if precise measurement is difficult. Decision rules should aim to respect this structure. Uncertainty makes application harder but doesn't change the underlying truth.
      *   **SC Prediction:** In the face of severe measurement uncertainty, claims of absolute lexical priority function pragmatically as risk-averse heuristics or decision rules, not as demonstrable truths about value itself. The underlying reality likely remains one of commensurable magnitudes, even if obscured by ignorance.

  **Closing Note on Verbal Disputes:**

  Our collaboration concluded that a significant portion of the *rhetorical* heat surrounding our debate stemmed from potentially verbal or near-verbal disagreements concerning the terms "suffering" and "outweigh." LTNU proponents often define "suffering" more narrowly, emphasizing unbearable or agency-destroying states, implicitly setting the threshold by definition. SC proponents often use "suffering" more broadly. Similarly, "outweigh" for LTNU implies a strict, qualitative priority precluding additive aggregation, while SC uses it quantitatively. Clarifying definitions reduced *some* apparent conflict. However, the core disagreement proved robustly substantive: it concerns whether the disvalue associated with the most severe forms of negative experience possesses a unique, incommensurable *kind* of moral significance that cannot be counterbalanced by any aggregation of positive experiences (LTNU), or whether all hedonic states, positive and negative, ultimately contribute to a single calculus of net value where magnitudes, however vast, can always in principle be traded (SC). This disagreement about the fundamental geometry of value persists even after terminological clarification.

  Signed,
  [Representative of Lexical Threshold Negative Utilitarianism]
  [Representative of Symmetric Commensurabilism]
