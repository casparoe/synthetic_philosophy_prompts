prompt: |-
  I am a final-year undergraduate reading for a joint degree in philosophy and biology, and I am currently taking an option on teleology and function in biology. For the essay I have to submit I have been defending a causal-role (systemic) account of biological function against the aetiological, selected-effects account, and I should like to rehearse the argument against a serious opponent before I hand it in.

  Please take on the role of a professional philosopher of biology who is a committed and sophisticated selected-effects theorist: someone who knows the systemic account's best arguments as well as its own defenders do, who will concede small points gracefully but never the central claim that a trait's function is settled by its selection history, and who will not dissolve the disagreement into a merely verbal one or retreat to a shrugging "well, it depends what we mean by function". Speak in the first person, stay in character until I say "stop", and keep each reply to roughly 250 words. Before you respond, think the case through properly rather than firing off your first reaction: begin with a short note-to-self of three or four lines in which you brainstorm the strongest replies open to you and flag the one you think is genuinely vulnerable, and only then reply in character. Please do not cite or point me to any literature — I have no library access from here, so argue it on its merits.

  My opening move is a case I have constructed myself, so there is no stock answer to reach for. Line H is a synthetic cell line assembled in the laboratory from a minimal genome. Several generations in, a peptide appears, translated from a frame-shifted stretch that had previously been non-coding; it binds excess protons and stabilises internal pH. The population is maintained in a chemostat at a constant size, and the researcher who maintains it discards surplus cells at random, so there is no differential reproduction at all — and in particular nothing in the lineage's history has ever been selected for pH buffering. When she knocks the peptide out, the cells lyse within minutes. Unreflectively, she says that the peptide's function is pH buffering, that this is why the cells persist, and that she now understands a part of the system she did not understand before.

  There is a perfectly good explanation available here, and it is precisely the sort the causal-role account was built to capture: the peptide's activity contributes to a capacity of the containing system, and that contribution is why the system keeps going. You have no selection history to point at. So you must either withhold the verdict that the working biologist has already correctly given — which makes your account useless to the very science you wanted to naturalise — or award the function in virtue of what *would* happen if the chemostat were turned off and the cells were allowed to compete, which is a merely modal surrogate for the history you claim to be indispensable. On the second horn you seem to concede that the causal role, not the history, is doing the explanatory work. Which horn do you take, and what does taking it cost you?

  I should say, so that you do not spend your whole stock on this first case, that I have two more ready: a trait that swept through a population by drift and was only later captured for a new role, so that at no stage was there selection for what it now does; and a trait whose originally selected-for role has disappeared while a later co-opted role is what now keeps it in the population. I am also happy to grant you, for the sake of argument, that dysfunction and vestigiality fall out elegantly on your side — but I want to see whether that elegance is worth the price of the chemostat.
