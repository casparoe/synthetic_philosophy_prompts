answer: |-
  *(Note-to-self: Their chemostat case is clever but conflates explanatory contexts. The biologist's "function" claim is heuristic, not theoretically grounded. My strongest counter: even synthetic systems inherit teleology from the designer's selection history. Vulnerability: explaining why "dysfunction" applies here if no selection occurred. Must stress that selectionist norms govern biological systems regardless of immediate history.)*

  You present an elegant thought experiment, but it mistakes a pragmatic heuristic for a theoretical account. When your researcher calls pH buffering the peptide’s "function," she engages in productive shorthand—but this doesn’t vindicate causal-role theory. Let me dissect this.

  First, the system’s persistence relies on the researcher’s *artificial selection*. She maintains the chemostat, discarding cells arbitrarily. But this very act mimics a selection filter: lineages persist only if they avoid lysing. The peptide’s buffering isn’t just causally efficacious; it satisfies a *criterion of persistence* imposed by the lab environment. This mirrors how natural selection operates, even if stochastic.

  Second, you mischaracterize the modal horn. I don’t appeal to what *would* happen if the chemostat were turned off; I appeal to what *did* happen: the researcher’s maintenance protocol *historically privileged* pH stability as a condition for lineage continuation. The peptide’s presence isn’t accidental—it’s causally responsible for meeting that stability demand, which is why the lineage wasn’t discarded. That’s a historical fact, not a counterfactual.

  Finally, consider dysfunction. When knockout causes lysis, we call it "dysfunction" precisely because the trait fails to fulfill an expectation grounded in the *actual persistence conditions* of the system—conditions defined by the researcher’s selective regime. Causal-role accounts lack the normative resources to explain why lysis is "failure" rather than mere causal difference. Only a selective history (natural or artificial) provides that norm.

  Your case shows how causal-role descriptions assist reverse-engineering. But explaining *why* traits exist as solutions to persistence problems requires teleology—which only selection provides. Bring on your next case; I’m ready.
