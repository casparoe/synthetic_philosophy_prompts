  ### Sestina for the Cycle

  The city wakes to a cold, uncertain **spring**,  
  its founders’ hopes drawn in a fading **line**.  
  Each year they buried one more stubborn **seed**  
  beneath the stones, awaiting its **return**.  
  But what rises bears the weight of its own **end**—  
  the hearth gone cold, the fields in drifting **ash**.  

  From distant hills, the wind brings desert **ash**  
  to sting their eyes. They call it a new **spring**,  
  but it’s the grit of what they couldn’t **end**:  
  the greed that frayed the old communal **line**,  
  the comfort that forgot the hard **return**  
  of hunger. Now the wasteland lends its **seed**.  

  This borrowed ground won’t hold a foreign **seed**.  
  The plow turns up a shard, a smear of **ash**—  
  a language lost. They force a false **return**  
  to rituals, chanting of a brighter **spring**  
  while frost still grips the land. The blood**line**  
  thins, repeating words that have no **end**.  

  A son slips out beyond the wall. The **end**,  
  he knows, is in the yielding, not the **seed**.  
  He walks until he loses sight of **line**  
  or landmark, sleeps in his own fire’s **ash**,  
  drinks from a stream that tastes of stolen **spring**.  
  When he comes back, they ask: “What did you **return**  

  to find?” He shows no coin, no quick **return**  
  on venture. Only this: the true **end**  
  isn’t a stop. The wheel hauls its own **spring**  
  forward. What they buried as dead **seed**  
  was fuel. He points to where the **ash**  
  stirs in the wind, tracing a new **line**.  

  The elders nod but hold the fading **line**.  
  The young ones watch the road, poised for **return**.  
  They sweep the hearth, sift years of **ash**  
  for embers. Some call it a final **end**;  
  some plant his words like a live **seed**  
  in frozen earth, and wait. No certain **spring**.  

  **Seed** breaks to **spring**; **ash** draws the **line**;  
  **Return** claims no **end**, only a rung to climb.  

  ---

  **Afterword**:  
  The poem sides decisively with Toynbee, framing the cycle as a vehicle for linear progression—a wheel turning not in place but toward purpose (the "rung" in the tornada). Khaldun’s reservoir ("the wasteland lends its seed") and Spengler’s borrowed forms ("a language lost") are acknowledged, but Polybius’s fatalism is undercut: the "mixed constitution" isn’t just slower decay but raw material for ascent. Where I might have erred is in Khaldun: the "desert" isn’t a passive reservoir but an actor that exhausts itself—a tension the poem simplifies for flow.
