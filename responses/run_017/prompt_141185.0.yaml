  The challenge: 
  - Six words that can be read in two ways: as part of a cycle or as linear progress. 
  - The poem must argue the idea of cycles, not just illustrate it. 
  - Each stanza should reflect one of the four thinkers, but without explicit naming. 
  - The tornada should resolve in a way that follows from one of the accounts, and should avoid a moral or a shrug.

  Let me choose six end-words that fit the register and can shift meaning:

  1. **spring** (season, water source, or leap; cyclical vs. linear: the return of life vs. a one-time jump)
  2. **line** (boundary, lineage, or a queue; cyclical: the circle is unbroken? linear: progression)
  3. **seed** (beginning, potential; cyclical: what is planted to be harvested, linear: the start of a process)
  4. **return** (coming back, or profit; cyclical: recurrence, linear: a one-time event)
  5. **end** (conclusion, purpose; cyclical: part of a recurring phase, linear: finality)
  6. **ash** (remains after fire, or tree; cyclical: from which new growth may come, linear: destruction without renewal)

  Now, the permutation pattern for the sestina:

  Stanza 1: 1,2,3,4,5,6 → spring, line, seed, return, end, ash

  Stanza 2: 6,1,5,2,4,3 → ash, spring, end, line, return, seed

  Stanza 3: 3,6,4,1,2,5 → seed, ash, return, spring, line, end

  Stanza 4: 5,3,2,6,1,4 → end, seed, line, ash, spring, return

  Stanza 5: 4,5,1,3,6,2 → return, end, spring, seed, ash, line

  Stanza 6: 2,4,6,5,3,1 → line, return, ash, end, seed, spring

  Tornada: three lines that use all six words, typically two per line.

  We want the tornada to be a resolution that follows from one of the thinkers. The options were:
  - All six in order 1-2-3-4-5-6 (a straight line, not a cycle)
  - One word replaced by a stranger (suggesting an interruption of the cycle)
  - All six gathered but in an order that reads like rungs (suggesting a ladder, not a circle)

  I will aim for an ending that reflects Toynbee's idea: the cycle as a vehicle for something that moves in one direction (a wheel on a cart). So the tornada will gather the words in an order that suggests progression (like rungs) but also includes the cyclical elements.

  Plan for stanzas:

  Stanza 1: Set the scene with a city and a family, and introduce the cycle. Reflect Polybius: the political cycle (one-man rule to mob and back). Use the end-words to show the natural cycle (spring, seed) and the political (line, return, end, ash). The city is founded, the family plants.

  Stanza 2: Khaldun's idea of solidarity depleting and needing an outside source. The city is prosperous, but the family (or the ruling class) becomes comfortable. The end-word "ash" (from the previous stanza) becomes the residue of their fire, but also the desert (the outside reservoir). The "seed" is now the new group from the desert.

  Stanza 3: Spengler's parallel seasons and the problem of a young culture in old forms. The city is in a phase of decline, but there is a false spring. The family tries to use old ways that don't fit. The end-word "seed" becomes the borrowed vocabulary that doesn't grow.

  Stanza 4: Toynbee's challenge and response, the creative minority. The city faces a challenge, and a group withdraws and returns. The family has a member who goes away and comes back with new ideas. The end-word "spring" is now a leap of faith.

  Stanza 5: The petrified universal state (Toynbee) and the idea of the cycle as a vehicle. The city becomes rigid, and the family tradition is heavy. The end-word "return" is now the repetition without change.

  Stanza 6: The wheel turning, but with a sense of accumulation. The family and the city are caught in the cycle, but there is a hint of something more. The end-word "spring" is at the end of the stanza, setting up the tornada.

  Tornada: We will arrange the words to suggest a ladder (rungs) but also a forward movement. Use the words in a new order that implies progression. Since Toynbee's model has a forward movement even in the cycle, we'll have:

  Line 1: seed, spring (the beginning, but also the leap)
  Line 2: ash, line (the residue becomes the boundary or the lineage)
  Line 3: return, end (the coming back leads to an end that is a purpose)

  But note: the words must appear in the order of the tornada as two per line. We can choose any order as long as all six are used.

