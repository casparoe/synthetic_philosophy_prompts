prompt: |-
  I run a biweekly reading group at work for about a dozen ML engineers and quants -- all fluent in Bayes rule, calibration, proper scoring rules, the usual; none with any logic past knowing that undecidability is a thing. In a few weeks I've got 40 minutes and one whiteboard to get them to see why logical uncertainty is a genuinely different problem from ordinary empirical uncertainty, and what the logical induction setup is actually supposed to be doing about it. Don't explain the topic to me; I want a plan for the explanation.

  The part I always botch is the ordering. Every time I try, someone jumps in with "isn't this just uncertainty about whether your hardware or your own brain is reliable," and I get dragged into that before we've even established that classical Bayesian credences are deductively closed and so can't represent uncertainty about a theorem at all. So: what has to be true in their heads before the next thing can land, what order, and why that order rather than another.

  Give me the one example that carries the whole session. My instinct is a claim about a computation I could actually start running in front of them -- say, whether the 10^9th bit of the output of a specific ten-line program is a 1, where the program is deterministic, decidable in principle, and slow enough that nobodys reaching 10^9 during the hour -- plus a family of such claims indexed by n, so I have something to point at when I talk about learning to reason rather than just grinding. Say what such an example has to have, and say more about what it has to lack: I suspect it can't have any shortcut that settles it without running the thing, or the whole moral collapses into "do math faster," but you tell me. If you'd use something else entirely, argue for it.

  Then the misconception map, with the point in the sequence where each one gets defused rather than a list at the end. The ones I expect: "just put 0.5 on everything undecided and Bayes-update when you find a proof"; "the traders are hypotheses and the prices are model averaging"; "so it's a better theorem prover"; "it converges in the limit, so that's as good as knowing"; "probability 1 is certainty, so once there's a proof you're back to plain Bayesianism and nothing was lost." And there's one I never answer well: someone always says you should just be uncertain about your own future reasoning -- put a probability on "I'll end up believing X" -- and isn't that the same thing? Tell me whether that's a confusion to squash early or actually the property the whole thing is built to get, and where it belongs.

  Finally: one question at the end that shows me they got it rather than just learned the vocabulary, and one thing you'd openly refuse to justify at this level and say so out loud.
reasoning: |-
  We are going to design a 40-minute whiteboard session for a group of ML engineers and quants who are fluent in Bayesian reasoning but have minimal logic background. The goal is to convey why logical uncertainty is distinct from empirical uncertainty and what logical induction does about it.

  Core Challenge: The group tends to jump to "isn't this just uncertainty about hardware or brain reliability?" before we establish that classical Bayesianism requires deductive closure (i.e., if a statement is provable, it must have probability 1). So we must structure the talk to build the necessary foundations in order.

  Key Insight Order:

  1. First, establish that in classical Bayesianism, if a statement is provable (from known axioms) then it must have probability 1. Otherwise, the system is vulnerable to Dutch books (via the Dutch book argument for deductive closure). This is non-negotiable.

  2. Then, present a concrete example of a logical claim that is decidable in principle but not in practice (for a given resource limit). We choose a program that computes the n-th bit of a particular sequence (like the binary expansion of π or a similar computable number) but for very large n (say 10^9) and the program is slow enough that we cannot run it in real-time.

     Requirements for the example:
     - The program is deterministic and decidable (so there is a definite answer).
     - The answer is not known to the audience (and cannot be computed on the spot).
     - There is no known shortcut (like a mathematical formula) that would allow us to compute the bit without running the program (or without an impractically long computation). This is crucial to avoid collapsing into "just do math faster".

     Example: Consider a simple program that computes the Collatz sequence for a starting number n and then outputs the parity of the number of steps until it reaches 1. Let our claim be: "For n = 10^9 + 1, the Collatz sequence takes an even number of steps." (Note: We choose n large enough that the computation is infeasible in the session, but we know the Collatz problem is decidable for any given n because the sequence is known to eventually reach 1 for all tested numbers, though the general problem is undecided. However, for a specific n, it is decidable by running the sequence. We must be cautious: the Collatz conjecture is unproven, but for our n we can pick one that is large enough that the computation is too long, and we can assume that the sequence does halt because we are only concerned with the specific n and we know it will halt for n in a feasible range? Actually, we cannot guarantee that without proving the conjecture. So let's avoid Collatz.)

     Alternative: Use a program that computes the n-th digit of π in base 10, but we ask for the n-th digit of π in base 16 (hex) because there is a known BBP formula that allows computing the n-th hex digit without computing the previous ones. But that would be a shortcut! So we don't want that.

     Better: Use the n-th digit of π in base 10 without a shortcut. However, computing the n-th base-10 digit of π without prior digits is hard. But we can run a program that computes π to n digits. For n=10^9, that would take a long time and a lot of memory.

     Even better: Use a problem that is known to be decidable and for which there is no known shortcut. For example, consider the following program: 
          def f(n):
              k = 0
              while True:
                  k += 1
                  # Check if k is the first number that has exactly n divisors
                  if count_divisors(k) == n:
                      return k % 2   # return parity of the first number with exactly n divisors

     We don't know the answer for n=10^9? But note: the first number with exactly n divisors might be huge and take a long time to compute. This is a deterministic computation but infeasible for large n.

     However, we want to avoid the argument that we might come up with a mathematical shortcut. So we choose a problem that is known to be hard? Actually, we don't need it to be hard in the complexity sense, just that in practice for large n we cannot run it. And we want to avoid the audience saying "but if we think hard we might find a theorem that tells us the answer". So we might say: "Suppose we have a program that is known to halt and produce an output, but we haven't run it for n=10^9, and we don't know of any mathematical shortcut to get the answer without running the program."

     We'll use: "The 10^9-th bit of the output of a specific ten-line program that we write on the board." The program is:

          def g(n):
              # We define a sequence: start at n, then apply a simple transformation repeatedly until we hit 1
              # but we want it to be long and without known pattern for large n.
              # How about: 
              x = n
              steps = 0
              while x != 1:
                  if x % 2 == 0:
                      x = x // 2
                  else:
                      x = 3*x + 1
                  steps += 1
              return steps % 2   # parity of the number of steps

     But note: This is the Collatz again, and the conjecture is unproven. So for n=10^9, we cannot be sure that the program halts? Actually, we know that for n up to 2^68 it halts, so for n=10^9 (which is about 1e9 < 2^30) it is safe? But the audience might not know that. So let's avoid the halting issue.

     We can use a program that we know halts, for example:

          def h(n):
              # Compute the n-th prime number, then output 1 if that prime mod 4 is 1, else 0.
              p = nth_prime(n)
              return 1 if p % 4 == 1 else 0

     The n-th prime for n=10^9 is huge and takes a long time to compute (we have algorithms to compute the n-th prime without computing all, but still it's slow for n=10^9). And we don't know a shortcut for the distribution of primes mod 4 that would let us skip to the 10^9-th prime? Actually, we know that primes are equally distributed between 1 and 3 mod 4 (Dirichlet), but that doesn't tell us the exact value for the n-th prime. So this might work.

     We'll go with: "The n-th prime number modulo 4" for n=10^9. The program is deterministic and decidable but infeasible to run on the spot.

  3. Now, we have a family of such claims: for each n, let φ_n be the claim about the n-th prime mod 4. We can consider a sequence of such claims.

  4. The classical Bayesian must assign probability 0 or 1 to φ_n because it is decidable (and hence either provable or disprovable from the axioms of arithmetic). But we don't know which! So we have uncertainty. How can we represent that? We cannot assign 0.5 without violating deductive closure? Because if we assign 0.5 and then later we run the computation and find the answer, we update to 1 or 0. But at the time we don't know, so we are in a state of uncertainty. However, the Bayesian must assign 0 or 1? Why?

     Explanation: Because the axioms of arithmetic (PA) are known, and φ_n is either provable or disprovable in PA. Therefore, the Bayesian must assign probability 1 to the entire set of axioms, and then by deductive closure, they must assign 1 to every theorem. So at time t0, they must assign 1 to φ_n if it is true and 0 if false. But they don't know which, so they are forced to assign 0 or 1 arbitrarily? That's bad because then they might assign 1 to a false statement and be vulnerable to Dutch books.

     Actually, the issue is that the Bayesian framework requires that if a statement is entailed by the axioms, then it must have probability 1. But the agent doesn't know whether φ_n is entailed? The agent knows that PA entails either φ_n or ¬φ_n, but not which. How does that fit?

     The key: In the Bayesian framework, the agent's beliefs must be consistent with the axioms. So the agent must assign probabilities that are coherent with the axioms. Therefore, the agent must assign probability 1 to φ_n if φ_n is true (and 0 if false). But the agent doesn't know the truth value. This leads to a problem: the agent must have the correct probability for every such φ_n, even though they haven't computed it. This is impossible for a bounded agent.

     So we have a conflict: deductive closure requires the agent to be logically omniscient. But real agents are not.

  5. Now we can address the misconception: "just put 0.5 on everything undecided and Bayes-update when you find a proof"

     Why this doesn't work: Because if you put 0.5 on φ_n and φ_n is actually true (so it should have been 1), then you are vulnerable to a Dutch book. A clever bookie could exploit this by selling you a bet that pays $1 if φ_n is true for $0.6, and you would accept because you think it's worth $0.5. But since φ_n is true, you lose $0.4. And you cannot update until you see the proof? But in the meantime, you are vulnerable.

     Moreover, consider a statement that is provable but you haven't found the proof. You assign 0.5. Then the bookie can ask you to bet on it at 0.5. But since it's true, you will eventually update to 1, but until then you are vulnerable to being exploited repeatedly.

  6. Now we can introduce logical induction: we want a method for assigning probabilities to logical claims that are updated over time as the agent thinks more, and that are not vulnerable to Dutch books in a bounded way (i.e., no polynomial-time trader can exploit the agent indefinitely).

     We don't have to go into the full details, but we can sketch:

     - The logical inductor maintains a probability assignment over logical sentences that is updated over time (in steps t=1,2,...).
     - There is a market with prices for bets on logical sentences, and traders can buy and sell these bets.
     - The logical inductor sets prices in such a way that no trader can exploit it by more than a small amount (which goes to zero over time).

     The key property: the logical inductor learns to assign high probability to statements that are eventually proved, and low to those that are disproved, and it does so in a timely manner (before the proof is found, if possible). Also, it learns patterns: if a family of statements φ_n are all true, then the probability for φ_n should go to 1 as n increases even before we check each one.

  7. Now, the misconception map:

     - "isn't this just uncertainty about whether your hardware or your own brain is reliable?" 
          -> This comes up early. We must deflect: "We are assuming that the agent is running on reliable hardware and is logically competent. The issue is that even if the hardware is perfect, the agent hasn't had enough time to compute the answer. So it's about computational resources, not hardware failure."

          We can say: "Even if the hardware is perfectly reliable, we still don't know the answer because we haven't run the computation to completion. And we don't want to wait until we run it to assign a probability? We want to assign probabilities now and update as we get more time to think."

     - "just put 0.5 on everything undecided and Bayes-update when you find a proof"
          -> We address this after establishing deductive closure (point 5 above). We show that this leads to Dutch books and doesn't account for the fact that the statement is already determined.

     - "the traders are hypotheses and the prices are model averaging"
          -> This is a deeper one. We can clarify: The traders are not hypotheses about the world but rather trading algorithms that try to exploit the market. The logical inductor is not averaging over models but setting prices that cannot be exploited by any efficiently computable trader.

     - "so it's a better theorem prover"
          -> It's more than that: it's a way to assign probabilities that are coherent over time and that avoid Dutch books, and that also learn patterns in logical reasoning. The theorem prover is part of the process (as the underlying deductive process) but the logical inductor is assigning probabilities to sentences that might be proved in the future.

     - "it converges in the limit, so that's as good as knowing"
          -> But we care about the short-term performance too: we want the agent to be able to use its beliefs to make decisions now without being exploited.

     - "probability 1 is certainty, so once there's a proof you're back to plain Bayesianism and nothing was lost."
          -> This is true: once there is a proof, the logical inductor assigns probability 1. But the point is that before the proof, the logical inductor has a sensible probability that is not 0 or 1 and that is not vulnerable to Dutch books by bounded traders.

     - The self-referential one: "you should just be uncertain about your own future reasoning -- put a probability on 'I'll end up believing X' -- and isn't that the same thing?"

          This is actually a key insight! Logical induction is in part about having beliefs about one's own future beliefs. The logical induction paper has a theorem that the logical inductor satisfies certain self-trust properties. So we should embrace this: "Exactly! The logical inductor does assign probabilities to what it will believe in the future, and these are calibrated. So it does include uncertainty about its own future reasoning. But it does so in a way that is coherent with the logical facts and that avoids Dutch books."

          This is a property we can highlight as a feature, not a bug. We can say: "Yes, that's part of it. The logical inductor has beliefs about its own future beliefs, and it updates in a way that these beliefs are consistent and calibrated."

          We should bring this up when we discuss the properties of the logical inductor, after we have explained the main idea.

  8. The example must be carried throughout:

     - We start with φ_{10^9}: the 10^9-th prime mod 4. We don't know the answer. We ask: what probability should we assign?
     - Then we consider φ_n for n from 1 to 10^9. We note that for small n we can compute, and we see a pattern? (Actually, primes mod 4 are roughly half 1 and half 3, but the exact pattern for the n-th prime is not uniform? Actually, by the Dirichlet theorem, the proportion of primes up to x that are 1 mod 4 is about 1/2. But the n-th prime is determined by the order.)

          We can point out: a logical inductor might notice that about half of the φ_n for n=1 to t are 1 and half are 0? But actually, the n-th prime for small n: 
              n=1: 2 mod 4 = 2 -> but 2 mod 4 is 2, so we defined our φ_n as 1 if p mod4==1, else 0. So 2 mod4 !=1 -> 0.
              n=2: 3 mod4=3 -> 0? but 3 mod4=3 ->0? Actually, 1 mod4 is 1, 5 mod4=1, etc.
              Let's list: 
                  n=1: 2 -> 0
                  n=2: 3 -> 0
                  n=3: 5 -> 1
                  n=4: 7 -> 0 (because 7 mod4=3) -> actually 7 mod4=3 ->0
                  n=5: 11 -> 3 mod4=3 ->0
                  n=6: 13 -> 1
              So the first six: [0,0,1,0,0,1]. Doesn't look like 50% yet.

          But as n grows, the proportion of primes that are 1 mod4 approaches 1/2. However, the n-th prime itself? The parity of the n-th prime mod4 might not be independent of n? But the logical inductor might learn that in the limit, the frequency is about half. So for a large n, even without computing, it might assign about 0.5 to φ_n. But note: the n-th prime mod4 is fixed. So for a specific n, it's either 0 or 1. But the logical inductor doesn't know, so it assigns a probability that reflects the pattern it has seen.

          But wait: the pattern might be that every other prime? Actually, the pattern is not that simple. So the logical inductor might assign a probability that approaches the limiting frequency? But note: the limiting frequency for the n-th prime mod4 as n grows is 1/2 for 1 and 1/2 for 3. So the probability for φ_n (defined as 1 if the n-th prime mod4=1, 0 otherwise) should be about 1/2 for large n? But for a specific n, it might be 0 or 1. The logical inductor's probability is about what we expect for that n given the pattern we've seen in the first t statements.

          This shows that the logical inductor is learning to reason: it sees the first t primes and their mod4 values, and then for the next one (n=t+1) it assigns a probability based on the pattern (which is about 1/2). And if the pattern continues, it will be right about half the time.

          However, note that the n-th prime mod4 might have a predictable pattern? Actually, it is believed to be pseudorandom. So the logical inductor's assignment of 0.5 for a large n is reasonable.

  9. One question at the end to test understanding:

     "Suppose we have a logical inductor that has been running for a while and has seen the truth values of φ_n for n up to 1,000,000. Now, without actually computing φ_n for n=1,000,001, what should the logical inductor assign as the probability of φ_{1,000,001}? Why is that assignment different from what a classical Bayesian would assign?"

     We want them to say: the logical inductor might assign a probability around 0.5 (because it has seen that about half of the primes mod4 are 1) and that it has learned this pattern. The classical Bayesian, however, must assign either 0 or 1 (because the statement is decidable) but doesn't know which, so they are forced to assign one of these arbitrarily? But that assignment doesn't reflect the uncertainty.

     Alternatively, if they say: "The classical Bayesian cannot assign anything other than 0 or 1 without violating Dutch book, but the logical inductor can assign 0.5 and not be exploited by any bounded trader", that's good.

  10. One thing we openly refuse to justify:

     We will not explain the detailed construction of the logical inductor (with the market and the traders and the fixed point) because it is too complex for 40 minutes. We also won't prove the convergence theorems. We are presenting the motivation and the key ideas.

  Plan for the 40 minutes:

  - (5 min) Introduction: We have uncertainty about empirical facts (like coin flips) and we have uncertainty about logical facts (like the 10^9-th prime mod4). But they are different.

  - (10 min) Classical Bayesianism and deductive closure: 
