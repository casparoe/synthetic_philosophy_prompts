prompt: |-
  You're a moral philosopher who's taught value theory for years and marked a lot of finals — the sort of person who can spot a recycled seminar summary from a mile off and who knows exactly which moves a bright student makes when they're bluffing. Take your time with this: before you write anything, jot down the routes a student could take through the problem and the way each one tends to go wrong. Then draft.

  I'm setting the final for my upper-level value theory seminar and I want one question on whether "better than" is transitive, built around spectrum arguments. Closed-book exam, 60 minutes, 20 marks, single question with a couple of lettered parts. Everything has to be self-contained: no student should be penalised for not having read whoever it is who argues about this stuff, so describe any position you rely on (the tolerance/sorites horn, the incomparability horn, the money-pump or pragmatic argument, the idea of relativising betterness to a respect or a context) inside the question itself. And I don't want a single citation, bibliography or reading list anywhere — I want the model answer to stand on argument alone, not on who said what.

  Here's the material I want built in, because I don't want a question anyone can answer by reciting a survey article.

  First, a made-up institutional case with real numbers in it. The Westmarsh Health Board ranks three funding packages, A, B and C, on three scales: Q (total QALYs), S (severity-weighted priority) and F (fairness of spread). A: Q=100, S=80, F=90. B: Q=90, S=100, F=80. C: Q=80, S=90, F=100. The Board uses the Salience Rule: in any comparison, drop every dimension on which the two packages differ by less than 3 points (those differences aren't "noticeable"); then rank by majority across the dimensions that remain, with Q breaking any tie. Work it through and you get a cycle — A beats B, B beats C, C beats A. The Board then says something students have to grapple with: it insists the rule isn't a rough heuristic for tracking an independently existing betterness relation, it's what betterness *is* for packages like these.

  Second, a pet view of mine I want tested: Salience-Relative Betterness, the idea that you save transitivity by making betterness a three-place relation — a is better than b *relative to* a set of salient respects or a context of comparison — so apparent intransitivity is really just equivocation across contexts.

  Third, a Temkin-style ladder: five thousand rungs, each a barely noticeable improvement on the one below, bottom rung clearly worse than top rung.

  The question should force students to do three things: say whether the Westmarsh cycle shows that betterness is intransitive or only that the Board is a poor detector of it, and why that distinction matters; say whether relativising to a respect or context actually repairs transitivity, given that majoritarian aggregation over several dimensions cycles even when the dimension set and the comparison context are held fixed (whereas a single weighted scale trivially can't); and say whether the ladder case and the cycle case are the same argument in different clothes or two different arguments, and what that means for which horn you should swallow. It must end by demanding a verdict on one specific question, not a "on the one hand" shrug.

  Write it in British English throughout (organisation, behaviour, and so on). Give me these sections, in this order:

  The question — about 250 words, including the setup above in whatever form reads best as an exam paper.
  Model answer — about 750 words, in prose, reaching a clear verdict on the required question.
  Marking scheme — about 450 words, marks out of 20 across five must-hit points, saying explicitly what a First-class answer (17+) does that a 2:1 answer (14–16) doesn't.
  Typical howlers — about 150 words, the specific ways students usually lose the marks here.

  Don't turn the marking scheme into bullet-point hell; prose with the marks attached to each point is what I want. And no preamble before the first section.
