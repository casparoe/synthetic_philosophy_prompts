answer: |-
  ### The Question (250 words)
  The Westmarsh Health Board evaluates funding packages using three dimensions: Q (total QALYs), S (severity-weighted priority), and F (fairness of spread). Package A scores Q=100, S=80, F=90; B scores Q=90, S=100, F=80; C scores Q=80, S=90, F=100. The Board’s *Salience Rule* states: in comparing two packages, ignore dimensions where the difference is less than 3 points ("non-noticeable"); then rank by majority vote of the remaining dimensions, with Q breaking ties. Applying this:  
  - **A vs. B**: Differences: Q=10 (noticeable), S=20 (noticeable), F=10 (noticeable). A wins on Q and F (2-1).  
  - **B vs. C**: Differences: Q=10, S=10, F=20 (all noticeable). B wins on Q and S (2-1).  
  - **C vs. A**: Differences: Q=20 (noticeable), S=10 (noticeable), F=10 (noticeable). C wins on S and F (2-1).  
  Result: A > B, B > C, C > A — a cycle. The Board claims this rule *defines* betterness for such packages; it is not merely detecting an independent relation.  

  Some philosophers propose *Salience-Relative Betterness*: "a is better than b" must be relativised to a specific set of salient respects or a context of comparison, restoring transitivity by avoiding equivocation. Separately, consider a ladder with 5,000 rungs: each step is a barely noticeable improvement over the previous, yet the bottom is clearly worse than the top — another apparent transitivity failure.  

  **Answer all parts:**  
  (a) Does the Board’s cycle show that "better than" is *intransitive*, or only that the Salience Rule is a poor detector of betterness? Why does this distinction matter? (6 marks)  
  (b) Does relativising betterness to a fixed set of dimensions (Q, S, F) and a fixed context repair transitivity? Explain why or why not, given that the majority rule causes cycles even with fixed dimensions. (6 marks)  
  (c) Are the ladder case and the Board’s cycle the *same argument* against transitivity, merely presented differently? What does your answer imply for which "horn" (e.g., denying small differences accumulate, accepting intransitivity) one should take in each case? (6 marks)  
  (d) Conclude: Is "better than" transitive? Defend one clear verdict. (2 marks)  

  ---

  ### Model Answer (750 words)  
  **(a)** The cycle shows the Salience Rule is a poor *detector* of betterness, not that betterness itself is intransitive. The Board conflates *what betterness is* with *how they recognise it*. Their rule is a decision procedure—a tool for ranking options under cognitive or practical constraints (e.g., ignoring "non-noticeable" differences). But a tool’s failure does not entail the underlying relation is flawed. Betterness could be transitive and objective (e.g., based on an aggregate of Q, S, F), yet misidentified by an arbitrary threshold (the 3-point rule) and an unstable aggregation method (majority vote). This distinction matters profoundly: if betterness *is* intransitive, we must revise fundamental logic in ethical reasoning. If detection is faulty, we improve our tools (e.g., use weighted sums). The Board’s assertion that the rule *defines* betterness is question-begging; it assumes what needs proving.  

  **(b)** Relativising betterness to a fixed set of dimensions (Q, S, F) and context *fails* to repair transitivity. The Salience-Relative view claims cycles arise from shifting contexts, so fixing context should restore transitivity. But here, dimensions and context are fixed: we compare A, B, C using *only* Q, S, F under the *same* salience conditions. Yet the majority-rule aggregation *still* cycles (A>B, B>C, C>A). This reveals a deeper flaw: aggregating multiple dimensions via majority voting is *structurally prone to cycles*, akin to Condorcet’s Paradox in voting theory. No relativisation can resolve this, as the intransitivity emerges *within* a single comparative framework. By contrast, a weighted sum (e.g., 0.4Q + 0.4S + 0.2F) would yield a transitive ordering (e.g., A=94, B=92, C=90 → A>B>C). The problem is not context-sensitivity but the choice of aggregation method.  

  **(c)** The ladder and cycle are *distinct arguments* with different implications. The ladder is a *linear spectrum*: it challenges transitivity by suggesting small, non-transitive steps (barely noticeable improvements) may not accumulate to a transitive relation (bottom << top). It forces a dilemma: either deny that "barely better than" is transitive (the "tolerance" horn), or accept that "clearly better than" is intransitive. The Board’s cycle is a *non-linear triad*: three options with conflicting pairwise rankings across multiple dimensions. Its dilemma is different: either reject majority rule as a valid aggregator (admitting no holistic betterness exists), or accept local intransitivities. The ladder attacks the *transmission of marginal gains*; the cycle attacks *multi-dimensional aggregation*. Thus, different "horns" apply. For the ladder, one might take the tolerance horn (deny accumulation: bottom < top despite no step being definitively better) without endorsing global intransitivity. For the cycle, one might reject aggregation (opting for incomparability or a different procedure) without denying transitivity in simpler cases.  

  **(d)** Verdict: **"Better than" is transitive**. The Board’s cycle stems from a flawed aggregator, not betterness itself. We should distinguish the *relation* from imperfect *measures* of it. The ladder’s challenge is met by recognising that "barely better than" is vague; it does not entail a sharp break in transitivity. We can coherently hold:  
  (i) Each ladder step is equally good as its neighbour (avoiding intransitivity),  
  (ii) Small differences *collectively* matter (so bottom << top), and  
  (iii) Aggregation failures (like the Board’s) reflect poor choice of decision rules, not metaphysical incoherence.  
  Transitivity is foundational to practical rationality (e.g., avoiding money-pumps). We abandon it only if *all* alternatives fail—but here, better tools (weighted sums, context-sensitive thresholds) resolve the cases without sacrificing transitivity.  

  ---

  ### Marking Scheme (450 words)  
  **Total: 20 marks**, assessed across five areas:  

  1. **Distinguishing detection from relation (4 marks):** A strong answer (4) clarifies that the cycle exposes flaws in the Salience *Rule*, not necessarily betterness itself, emphasising the Board’s conflation of epistemology and metaphysics. A good answer (3) notes the distinction but lacks depth on why it matters (e.g., to ethical reasoning). Weaker answers (1–2) equate the rule with betterness or dismiss the distinction.  
  2. **Critique of relativisation (4 marks):** Full marks (4) explain that fixed dimensions/context do *not* resolve the cycle, as majority voting is inherently cyclical under conflict, contrasting it with transitive alternatives (e.g., weighted sums). A 2:1 answer (3) identifies the cycle persists but misses why aggregation methods are key. Lower marks (1–2) assert relativisation works or confuse it with shifting contexts.  
  3. **Ladder vs. cycle comparison (4 marks):** First-class answers (4) identify the ladder as a linear spectrum challenging stepwise accumulation, and the cycle as a non-linear aggregation problem, specifying divergent dilemmas ("horns"). A 2:1 answer (3) notes differences but conflates the horns or underspecifies structural contrasts. Weak answers (1–2) treat them as identical.  
  4. **Clear verdict on transitivity (4 marks):** Excellent responses (4) unequivocally defend transitivity, using insights from (a)–(c) to rebut both cases *and* explain what withstands scrutiny (e.g., avoiding money-pumps). A 2:1 answer (3) states a verdict but with inconsistent support. Answers hedging ("sometimes") or ignoring (d) score 0–2.  
  5. **Cogency and precision (4 marks):** A First (4) integrates all parts seamlessly, avoids jargon, and uses original examples (e.g., weighted sums). A 2:1 (3) covers points distinctly but mechanically. Lower marks (1–2) show poor structure or ambiguity.  

  **Class boundaries:**  
  - **First-class (17–20):** Synthesises (a)–(c) to build a compelling defence in (d); anticipates objections (e.g., "But what if aggregation *is* betterness?").  
  - **Upper second (14–16):** Covers all parts competently but lacks synthesis; may list points without connecting them to the verdict.  
  - **Lower second (10–13):** Superficial on key distinctions (e.g., vague on why aggregation fails); verdict weakly supported.  
  - **Third (7–9):** Misrepresents cases (e.g., misapplies Salience Rule); major gaps.  
  - **Fail (0–6):** Ignores instructions; asserts without argument.  

  ---

  ### Typical Howlers (150 words)  
  1. **Conflating rule and relation:** "The cycle *proves* betterness is intransitive because the Board defines it that way" (fails to challenge the Board’s assertion).  
  2. **Misapplying relativisation:** "Salience-Relative Betterness fixes the cycle by making betterness contextual" (ignores that the cycle occurs *within* a fixed context/dimensions).  
  3. **Equating ladder and cycle:** "Both are sorites paradoxes, so they need the same solution" (overlooks linear vs. multi-dimensional structures).  
  4. **Vague verdicts:** "Transitivity holds sometimes but not always" (avoids committing, despite (d)’s demand).  
  5. **Aggregation errors:** "The Board should average scores" (correct but irrelevant unless explaining *why* this rescues transitivity).  
  6. **Ignoring instructions:** Discussing citations ("Temkin says...") or inventing dimensions beyond Q, S, F.
