  **1. Evidential Cover (Policy EC-114-A)**  
  Provides comprehensive protection against foreseeable demise, contingent on statistical correlations verified by our in-house predictor, "The Oracle" (99% accuracy, calibrated weekly).  

  - **(a) Death Benefit:** Pays 1,000 utility units to your estate if you die, adjusted by *news value differential*.  
    - *News Value Formula:* `Benefit × [1 − P(Death | Chosen Action) / P(Death)]`  
    Example: If P(Death) = 60% marginally, but P(Death | Stay) = 99%, adjustment = 1,000 × [1 − 0.99/0.6] = −650 units. Net payout: 350 units.  

  - **(b) Bus Fare Reimbursement:** Not offered. Fleeing is evidence Death is in Aleppo (P=99%), implying high expected mortality. Reimbursement would thus constitute "throwing good money after bad."  

  - **(c) Blind Booking Add-on (EC-114-BB):** For 5 units, we ensure you never hear Death’s warning.  
    - *Rationale:* Ignorance lowers P(Death | Stay) to 60% (The Oracle’s marginal baseline). Increases expected utility by 390 units (see Worked Example).  

