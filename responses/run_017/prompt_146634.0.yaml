prompt: |-
  hey — I'm a backend engineer, no philosophy background beyond one undergrad elective I mostly slept through, so bear with me.

  At work we have this habit I definately can't tell is deep or self-deluding. We build performance models of our services that are obviously false. Concretely: to decide how many instances to run and to promise a p99 latency number, we model each service as a single M/M/1 queue — arrivals are Poisson, service times are exponential, one server, infinite buffer. Everyone in the room knows real traffic arrives in bursts (there's a daily shape, plus retry storms, plus the occasional noisy neighbor), and real latency has a fat tail because of GC pauses and lock contention. The model's assumptions aren't approximately true; they're just false. And we ship the capacity numbers anyway, and it mostly works, or at least we don't get paged. We also load-test in staging with a synthetic traffic generator, and everyone agrees those numbers are directional at best.

  Meanwhile, in the same repo, a code reviewer will block a PR if the unit test mocks the payments client so it always returns 200 instantly — the objection being that the real thing can time out and the test therefore shows nothing. Which, fine, but isn't that the same move? We replaced a dependancy with a fake, idealized version of itself and drew a conclusion anyway.

  Third data point: we refuse to mock the clock. Every service takes an injected Clock; tests advance it by hand, and if you call now() directly, CI fails. And for anything genuinely risky we don't model or stage it at all, we ship it dark behind a flag and watch real traffic.

  A friend with a philosophy degree mentioned something about Milton Friedman arguing in some essay from the fifties that assumptions don't have to be realistic as long as the predictions come out right, and called it the F-twist or something. That sounds like us. But it also sounds like a license to never check anything, and we clearly do check some things but not others, so idk that it's the whole story.

  So: what does our actual practice presuppose about when a false assumption in a model is acceptable? I'd like the implicit rule reconstructed and then assessed for coherence. Is it really just "only predictions matter," and if so why the fuss about the payments mock? Is something else doing the work — e.g. whether the assumption is one you could relax later and recover the messy version as a limit, versus an assumption that deletes the very failure mode you were modeling to find? Is part of it that some assumptions are wrong in a direction that flatters you (everything succeeds instantly) while others aren't? Is the clock rule a separate principle, or the same one wearing a hat?

  Also please separate what the practice strictly commits us to from what merely fits comfortably with it — I suspect several different theories of models would all tell us to do exactly what we do, which would mean our workflow is evidence for nothing much. And then: if we swapped in the strict view, the one where a model's assumptions should be true or at least close, what would concretely have to change on a Tuesday? My guess is that it collapses into "test everything against real production traffic," which is impossible, and if that's right then maybe the practice isn't evidence for the F-twist at all, just evidence that we're resource-constrained. I'd like that spelled out either way.

  Answer in American English, please, and skip the reading list — I want the reasoning, not things to go read.
reasoning: |-
  Okay, let me unpack this backend engineer's query. They're describing a fascinating contradiction in their engineering practices: using knowingly false models (M/M/1 queues) for capacity planning while rejecting idealized mocks (like always-successful payments) in unit tests. The core tension is about when false assumptions are acceptable in modeling. 

  First, I need to map their three data points: 
  1) The M/M1 queue model works despite unrealistic assumptions
  2) Unit tests must include failure modes (no happy-path mocks)
  3) Clock injection is non-negotiable for time-sensitive logic

  The Friedman reference ("F-twist") suggests predictions trump assumptions - but that can't explain the payments mock rejection. There's an unstated principle here about failure modes: when a model omits catastrophic risks (payments failing), it's dangerous, but when it merely simplifies noise (traffic bursts), it's tolerable. 

  The clock example reveals another dimension: some assumptions break causality itself. Mocking time destroys the ability to model delays or timeouts - hence the strict injection rule. 

  For coherence, their practice seems to distinguish between:
  - Benign falsehoods (simplifications that average out)
  - Malignant falsehoods (omissions that hide system-killing edge cases)

  The payments mock is malignant because it erases the very failures the test should catch. The M/M1 queue is benign because while wrong, it's conservatively wrong (exponential tails overestimate real p99). 

  If they adopted "strictly true assumptions", they'd need real-world testing for everything - impossible given resource constraints. So their pragmatism isn't just Friedman-esque prediction-worship; it's triage. They're implicitly classifying which falsehoods could murder them in production versus which merely dent their pride.

  The Tuesday impact? For capacity models: maybe add percentile multipliers from past incidents. For payments: keep the failure-injecting mocks. For time: never budge on clock injection. The rule survives because it's not about truth - it's about survivable lies.
answer: |-
  Your practice reveals a coherent, pragmatic epistemology of engineering models—not a naive "predictions are all that matter" stance. Here's the reconstruction, assessment, and concrete implications:

  ### The Implicit Rule (Reconstructed)
  **A false assumption in a model is acceptable iff:**  
  **(1) It omits *noise* (chaotic, high-frequency/low-impact variance) but preserves *structure* (end-to-end causal relationships), AND**  
  **(2) The idealization doesn't mask *catastrophic* or *domain-specific* failure modes you intend to mitigate.**  

  ### Why This Explains Your Contradictions
  - **M/M/1 queues** violate reality (bursty arrivals, fat tails) but satisfy (1):  
    — Poisson/exponential assumptions approximate *long-term averages* of arrival/service rates.  
    — The model captures structural truth: *scaling servers reduces latency*.  
    — Failures omitted (GC pauses, retry storms) are "noise" in this context—they average out over instances or are mitigated elsewhere (e.g., circuit breakers).  
    — **Why you ship it**: Predictions are directionally correct for capacity planning, and errors are conservative (p99 is often *worse* in reality, so you overprovision).  

  - **Rejecting "always 200" payment mocks** violates (2):  
    — Timeouts/failures aren’t noise—they’re *domain-critical events* payments systems exist to handle.  
    — Mocking success erases the causal structure (retries, fallbacks, error handling) you’re testing.  
    — **Why you block it**: The test would hide catastrophic failures (e.g., revenue loss during outages).  

  - **Injecting Clocks** satisfies (1) and (2):  
    — `now()` calls are non-deterministic "noise" under test. Injecting time preserves structure (e.g., "this job times out after 5s").  
    — Real time isn’t catastrophic, but *flaky tests* are—so you enforce determinism.  

  ### Coherence Assessment
  This isn't Friedman's "F-twist" (which *does* justify any false assumption if predictions work). Your rule is **constrained instrumentalism**:  
  - **Structural fidelity > literal truth**: M/M/1 is a minimal model of *contention under load*—its core insight (queues grow nonlinearly with utilization) holds even when details are wrong.  
  - **Failure-mode awareness**: You tolerate false assumptions *only* when they don’t invalidate the model’s purpose. Capacity models ignore GC pauses because you handle them at the VM/language level; payments tests *must* include failures because resilience is their purpose.  
  - **Defensive pessimism**: Assumptions that flatter you (e.g., infinite network bandwidth) are rejected; those that err conservatively (M/M/1’s p99 pessimism) are kept.  

  ### What Would "Strict Truth" Require on a Tuesday?
  If you demanded *true* assumptions:  
  1. **Capacity planning**: Replace M/M/1 with a complex simulator (e.g., G/G/k queues + GC pause models). You’d need months of production traces to parameterize it.  
  2. **Testing**: All unit tests run against real dependencies (payments, DBs). CI would require hermetic staging environments mimicking prod.  
  3. **Deployment**: No dark launches—*everything* requires a full canary with real traffic.  

  **Result**: Delivery velocity drops 10x. This is impossible given deadlines, so you’d default to **testing only catastrophic risks** (payments) and **modeling only tractable phenomena** (scaling laws). *You’d end up back at your current practice.*  

  ### The Bottom Line
  Your workflow **isn’t evidence for the F-twist**—it’s evidence of **risk triage**. You allow false assumptions when:  
  - The model’s purpose is insight (e.g., "adding servers helps"), not precision.  
  - Failure modes are managed elsewhere (GC pauses → better garbage collectors).  
  - The cost of rigor outweighs the penalty for error (an occasional capacity hiccup vs. payments downtime).  

  **What should change?** Double down on this pragmatism:  
  - Keep "always 200" mocks banned—they hide existential risks.  
  - Keep M/M/1 but *calibrate its bias*: Compare its p99 predictions against real data, then add a 1.5x safety multiplier.  
  - Reject clock mocking for the same reason you reject `now()`—determinism is non-negotiable for tests.  
  - **Add chaos engineering**: Inject latency/errors in staging to cover gaps your models ignore (retry storms, noisy neighbors).  

  You’re not lazy—you’re strategically delusional. The falsity in M/M/1 is harmless because it doesn’t lie about *what matters to you*: scaling works. The payments mock *does* lie about what matters: your system breaks. That’s the coherence.
