prompt: |-
  I'm building individualised medical risk scores and I keep running into the reference class problem. My boss has a fix: always use the narrowest reference class that still has at least 100 observed cases in it, ties broken by which ever class is defined by fewer predicates, and stop worrying. He thinks the problem is just data sparsity with a philosophy-y name. I think its deeper than that.

  So: what's your credence that the reference class problem is a genuine problem for assigning probabilities to single cases — one that no rule like his dissolves, and that isn't only frequentism's problem but turns up for evidential/Bayesian and logical probability too? Mine is about 0.7, his is about 0.1. Don't just tell me it depends on what you mean by probability: give me a number and the decomposition. Specifically: is there any privileged narrowest or widest class; is the class picked out by all your evidence even well defined, given that deciding which propositions count as your evidence looks like the same problem one level up; do single-case probabilities have to be unique at all, or can several incompatible values each be admissible; is this really the problem of induction, or something grue-ish, in a hat; and if it is genuine, does it change anything about the scores we actually ship? Number plus one line of justification for each, how they combine, and which term you'd revise first given new evidence. Also say which sub-question you think my boss and I really disagree about — or whether he's just using probability to mean whatever the model prints. British English please, and give me real numbers rather than hedging everything into mush.
