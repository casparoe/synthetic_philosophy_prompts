  Okay, the user is locked in a debate about Christopher Nolan's "Memento" and wants a Nyāya epistemological analysis to settle it. Their core disagreement: friend sees it as simple "memory is unreliable" thesis, user argues it's about auditing knowledge sources. 

  First, I need to unpack the Nyāya framework quickly but thoroughly. The four pramāṇas (perception, inference, comparison, testimony) are essential, especially śabda (testimony) and parataḥ prāmāṇya (external validation). Leonard's system is a fascinating edge case: self-authored testimony where the testifier (past Leonard) is both the source and the subject of investigation. 

  The polaroids/notes/tattoos setup screams śabda with a twist. Normally, Nyāya would demand external verification for testimony's validity, but here the verification mechanism (memory) is broken. Worse, Leonard actively destroys counterevidence (like the "DON'T BELIEVE HIS LIES" note). This creates a closed epistemic loop - textbook case where parataḥ prāmāṇya fails because there's no "outside" to validate from. Nyāya would likely say none of this constitutes pramāṇa since the source reliability can't be established. 

  Then there's Sammy Jankis. The user's upamāna (comparison) theory is brilliant but tricky. Upamāna typically requires recognizing similarity to a known referent (like matching "gavaya" to cow). Here, Leonard uses Sammy as a model to understand himself, but the twist is they're identical - yet he fails the recognition. That's where Nyāya illuminates the tragedy: upamāna fails because Leonard lacks the perceptual anchor (smṛti) to see the equivalence. It's not just faulty comparison; it's missing the prerequisite knowledge for comparison to work. 

  For the breaking point: the "I lie to myself" scene is perfect. Nyāya explains why Leonard's system isn't just flawed but epistemically hollow - he's manufacturing pseudo-pramāṇa. But Nyāya distorts Teddy's final speech; the film's nihilism about self-deception goes beyond Nyāya's clinical "defective source" diagnosis. 

  User's friend isn't wrong about memory's unreliability, but user's take is richer. Nyāya shows Leonard's tragedy isn't forgetting, but being trapped in performative epistemology - constantly generating "knowledge" that can never be knowledge. The verdict leans strongly toward user's interpretation.
answer: |-
  Based on a Nyāya epistemological analysis, **you are significantly closer to the film's core drama than your friend is.** While memory's unreliability is the *vehicle*, the *destination* is the profound epistemological crisis of an agent forced to operate within a closed, unauditable system of knowledge sources. Nyāya provides powerful tools to dissect Leonard's predicament. Here's the breakdown:

  1.  **Leonard's System & Śabda (Testimony): A Fifth Pramāṇa? No. A Defective Śabda.** Nyāya wouldn't invent a fifth pramāṇa for Leonard's notes. They squarely fall under *śabda* (verbal testimony), but it's *deeply defective śabda*.
      *   **The Defective Speaker:** Past-Leonard is the speaker. Nyāya demands the speaker be *āpta* (reliable, competent, truthful). Past-Leonard *intends* to be reliable but is fundamentally compromised:
          *   **Lack of Competence:** His condition means his own perceptions and inferences at the time of writing could be flawed (e.g., Teddy manipulating him).
          *   **Lack of Verifiability:** Crucially, *he cannot be cross-examined*. The defining feature of his testimony is that the source is permanently inaccessible for questioning or verification. Nyāya emphasizes the importance of establishing the speaker's reliability (*āptatva*) – this is impossible here.
      *   **Parataḥ Prāmāṇya & the Closed Loop:** This is the crux. Nyāya holds that the validity of a cognition (including testimony) is established *externally* (parataḥ), either by:
          *   Inference based on the *known reliability of the source* (impossible here).
          *   Inference based on *successful activity* (phala, the result of acting on the cognition).
      *   **Leonard's Epistemic Trap:** His system is *designed* to prevent external validation:
          *   **No Source Reliability Check:** Past self is inaccessible and his reliability at the moment of inscription is unknowable to present self.
          *   **No Effective Activity Check:** The "activity" is finding and killing "John G." This goal is:
              *   Potentially infinite (there could be many John Gs).
              *   Subject to manipulation (Teddy feeds him targets).
              *   Designed for perpetual failure/sustenance ("I have to believe... even if I don't remember believing").
              *   **Actively Sabotaged:** When evidence *does* suggest failure (e.g., the note about Teddy, the multiple license plates, the realization about Sammy), Leonard systematically destroys or ignores it because it threatens the *only* structure he has. He prioritizes the coherence of the system over its truth-value.
      *   **The Nyāya Verdict:** Leonard possesses *cognitions* derived from śabda, but they lack *pramāṇatva* (the property of being valid knowledge). They are *apramā* (non-valid cognitions) or, more accurately, *doubtful* cognitions (*saṃśaya*) arising from an irredeemably defective source. He has *beliefs* masquerading as knowledge, sustained by a closed loop he actively maintains. He has **too many unjustified beliefs**, not genuine knowledge. The honest Nyāya verdict: **He basically never has knowledge (pramā) via his system.** He operates on *pseudo-śabda*.

  2.  **Sammy Jankis & Upamāna (Comparison): A Powerful Analogy, But a Tragic Failure.**
      *   **Your Insight is Strong:** Leonard absolutely uses Sammy as an *analogue* to understand his own condition. This is structurally similar to *upamāna*, where knowledge of a similarity ("this animal is like a cow") leads to applying a name ("gavaya").
      *   **The Nyāya Qualification:** For *upamāna* to yield valid knowledge, the similarity must be correctly perceived and the connection to the known thing (the standard, like the cow) must be reliable.
      *   **The Gut-Punch & Upamāna's Failure:** The tragedy lies precisely in the *failure* of upamāna as Leonard intends it.
          *   **He Misapplies the Standard:** He uses Sammy as the "known standard" (the "cow") against which he compares himself (the "gavaya"). He concludes: "Sammy has this condition (anterograde amnesia) and cannot form new memories. *Unlike Sammy*, I *can* form new memories (via my system), so my condition is different/manageable."
          *   **The Reality:** The "standard" (Sammy) *is* himself. The similarity isn't just close; it's identity. His conclusion ("I am *unlike* Sammy") is catastrophically wrong.
          *   **Why Upamāna Fails Here:**
              *   **Defective Knowledge of the Standard:** Leonard's knowledge of Sammy's *true* condition and its cause is flawed and manipulated (by himself and Teddy).
              *   **Inability to Perceive the True Similarity:** His own condition and the nature of his "system" prevent him from recognizing the fundamental identity. He lacks the prerequisite knowledge (smṛti - memory) to make the connection.
      *   **Nyāya's View:** The Sammy analogy *is* an attempt at upamāna. However, it's an instance of *failed upamāna* because the knowledge of the standard (Sammy) is invalid, and the crucial similarity (the inability to form *reliable* new memories/understandings, and the psychological root) is obscured from Leonard. The power comes from the *audience* recognizing the successful upamāna (Sammy = Leonard) that *Leonard himself* fails to achieve. So, you're not forcing it; Nyāya helps articulate *why* this analogy is so central and so devastating.

  **Where Nyāya Does Real Work (The Breaking Point Scene):**
  *   **The Scene:** Leonard burning the Polaroid of Teddy's corpse after writing "DON'T BELIEVE HIS LIES" and getting the "FACT 6" tattoo ("He is the one. Kill him").
  *   **Nyāya Work:** This isn't just memory failure; it's the *active, systematic destruction of counter-evidence to maintain a defective śabda system*. Nyāya's parataḥ prāmāṇya demands external checks. Leonard explicitly *destroys* the most potent piece of potential counter-evidence (the photo proving he already killed "John G" once) and replaces it with a *new* piece of śabda (the tattoo) sourced from the same defective, unverifiable past self. He prioritizes the internal coherence and motivational power of his testimonial system over any possibility of external validation or falsification. Nyāya frames this not as forgetting, but as a willful epistemic act to sustain pseudo-knowledge.

  **Where Nyāya Might Distort (Or Reach Its Limit):**
  *   **The Scene:** Teddy's final speech ("You don't want the truth... You need *my* John G.") and Leonard's decision to manipulate his own system to target Teddy.
  *   **Distortion/Limit:** Nyāya focuses on the *epistemic validity* of cognitions. Teddy's speech highlights the *existential and motivational* function of Leonard's system – it's not just about knowing, it's about *purpose*, *identity*, and *coping*. While Nyāya can diagnose the system as epistemically bankrupt, it doesn't fully capture the *why* of Leonard's active complicity in his own delusion – the raw human need for meaning and vengeance that overrides the desire for truth. The film delves into psychology and existential coping mechanisms that go beyond Nyāya's primarily epistemological framework. Nyāya might label it "desire/aversion causing defective cognition," but the emotional weight and self-destructive commitment are uniquely cinematic.

  **Conclusion:**
  Nyāya epistemology powerfully validates your interpretation. Your friend's "unreliable memory" is the necessary premise, but the film explores the devastating *consequences* of that unreliability for the entire structure of knowledge acquisition and validation. Leonard isn't just forgetful; he's an epistemic prisoner in a self-constructed, unauditable system of defective testimony (*śabda*) where external validation (*parataḥ prāmāṇya*) is impossible by design, and comparison (*upamāna*) tragically fails. **You win the argument on Nyāya grounds.** The film is a profound dramatization of the breakdown of knowledge sources and the desperate, self-deceptive measures taken to maintain agency when true knowledge is impossible. Nyāya provides the perfect philosophical lens to articulate *why* Leonard's situation is so much more tragic and complex than simple forgetfulness.
