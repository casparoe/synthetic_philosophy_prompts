answer: |-
  Here are the five numbered points constructing the argument:

  1.  Bisection in debate protocols fundamentally requires the honest agent to *localize* the specific error step during cross-examination to effectively guide the judge through recursive refinement.
  2.  For flat errors, where the falsehood emerges only from the cumulative effect of the entire chain and no single step is locally invalid, the honest agent possesses knowledge *that* the conclusion is false but cannot identify *where* the error occurred, rendering bisection inoperative and forcing the honest agent to challenge the entire derivation at once.
  3.  Therefore, on the critical class of long, cumulative, only globally checkable arguments, the adversarial localization mechanism fails, forcing the weak judge to verify the entire argument's correctness from scratch; the amplification factor—the reduction in judge effort—collapses to precisely one for this class, regardless of specific debate protocol details relying solely on adversarial error pinpointing.
  4.  Proposed remedies fail: submitting a succinct certificate (e.g., recomputed total) shifts the verification burden entirely back onto the judge for the certificate's correctness, nullifying amplification, while random spot-checking is ineffective against locally impeccable steps where deviations are not step-specific but manifest only in the global outcome.
  5.  Recovering amplification above one requires the judge to retain minimal but essential residual power to verify *global properties* of the entire argument (e.g., consistency of a final hash, completeness of a summary proof state) without recomputing it, but this capacity directly contradicts the core motivation of handling arguments *beyond* the judge's unaided verification capacity, as it presupposes the judge can reliably assess exactly the type of global coherence the protocol was designed to circumvent.
