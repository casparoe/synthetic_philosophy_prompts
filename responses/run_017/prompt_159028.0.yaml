prompt: |-
  Me and my writing partner are two books into a trilogy about a family and a fertility clinic in Bristol, and we've got into the habit of "re-running" scenes: we take a character, change one thing about how she came to exist, and write the same life again to see what falls out. It's more or less become the structure of book three. The problem is that every week one of us pitches a variant and then we spend forty minutes arguing about whether the person in the variant is still her or is somebody else with her name, and the answer changes the emotional contract with the reader completely — if it's her, the reader grieves; if it's a stranger wearing her face, the reader is meant to feel spooked. I had a look at the Wikipedia page on origin essentialism and its no use to me: it tells me the Kripke-style view, the one where a person couldn't have grown from a different egg and sperm, and then tells me that plenty of people disagree, and that's about it. Please don't palm me off with a reading list or start name-dropping papers at me — I'm not writing an essay and I've got no library access where I live, I need something I can actually use.

  What I want is a decision procedure, the sort of thing we can run on a pitch in ten minutes at the kitchen table with no philosophy between us. Roughly: what's the first question we ask about a variant, what counts as a good enough answer to it, at what point does the procedure just say "no, that's somebody else" and stop, and at what point does it hand the decision back to us because it's a choice about the book rather than a fact about identity. It needs to keep whatever is really doing the work in the philosophical view while being usable by two novelists, and I'd rather you were straight with us about which distinctions you've had to flatten to make that work and which ones have to survive or the whole thing falls apart. Three snags I keep tripping over and want the procedure to deal with rather than dodge: fertilisation isn't an instant, it's a process lasting hours, so "which sperm" is sharp but "when she began" isn't, and one of our best variants is the very same embryo, same gametes, frozen for twelve years and implanted later, so she's born into a completely different family; gametes are themselves objects with their own origins, so if we insist on strict necessity at the level of the egg and sperm, why not at the level of the grandmother's, or of the matter the gametes are made of, and where does the procedure stop that regress and admit that it's just stopping; and then the nasty one, a mitochondrial donation case, where the mother's nuclear material is put into a donor egg that's been emptied of its own nucleus, so the nuclear DNA is mum's and dad's but the cytoplasm and a tiny sliver of the genetic material come from a stranger. Is that a different egg or not? Under a rule that says different egg, different person, I genuinely can't tell, and it's currently the opening of chapter four.

  Could you also run the procedure on three of our actual variants and show your working. (1) The frozen-embryo one above. (2) Identical twins: same sperm, same egg, one zygote that splits — so if the rule only ever asks about the gametes it can't tell the twins apart, and we need to know whether that's a bug to patch by moving the origin to the zygote or to the splitting event, or whether it's a sign the whole approach is wrong for a novel. (3) A clone: a skin cell from the mother, nucleus put into an emptied donor egg, no sperm anywhere in the story. My editor, who has to sign off on the structure and has already told me she wants the throughline to be one woman's life, is going to hate whatever the procedure says about at least one of these, so please say plainly when the answer is one she won't want, and be honest about the cases where your procedure is mostly a way of dressing up a decision we were always going to have to make ourselves — and about where it will misfire on us, because we'll be trusting it for the next eight months.
reasoning: |-
  Okay, let me tackle this step by step. The user and their writing partner need a practical decision procedure for character identity across alternate scenarios in their trilogy. They're stuck in philosophical debates about whether a variant is the same person or a different one, which affects reader emotion. 

  First, I need to extract their core requirements: 
  - A kitchen-table friendly tool (no philosophy jargon) 
  - Handles biological edge cases (twins, clones, embryo freezing) 
  - Flags when the call is artistic choice vs identity fact 
  - Acknowledges where it "flattens" philosophy for practicality 

  The three snags are critical: 
  1. Fertilization being a process (not instant) 
  2. Gamete origin regress (how far back to trace?) 
  3. Mitochondrial donation cases (whose egg is it?) 

  Hmm... the key insight is that novels care about identity as perceived by readers, not metaphysics. So I should build the procedure around narrative continuity markers readers actually track: 
  - Core memories/experiences 
  - Recognizable personality 
  - Physical continuity (even if altered) 
  - Key relationships 

  For the procedure structure, I'm considering: 
  1. Start with a "Same Body?" checkpoint (traces physical origin) 
  2. Then "Same Mind?" (shared memories/traits) 
  3. Finally "Same Story?" (authorial intent) 

  The frozen embryo case is telling: physically identical but raised differently. The procedure should likely call this "same body, different story" - forcing the authors to choose based on whether they want nature or nurture themes. 

  For identical twins: 
  - Same gametes → passes Step 1 as "same body origin" 
  - But diverging lives → fails Step 2 (no shared memory) 
  - So twins would be different people under this model 

  The clone scenario fails Step 1 immediately (different creation method) but could pass Step 2 if imprinted with memories. Editor won't like this - it breaks the "one woman" throughline unless they fudge memory continuity. 

  Biggest tradeoff: I'm deliberately collapsing Kripke's "origin essentialism" into "body essentialism" for simplicity. This fails for teleportation stories but works for their biological focus. Should warn them about that boundary. 

  Mitochondrial donation... tricky. The procedure would ask: "Is the nuclear DNA the same?" Yes → "same body". The donor cytoplasm becomes irrelevant for identity (though story-wise it's rich ground for themes). 

  Finally, need to show the procedure won't save them from hard choices - especially when physical continuity and experiential continuity clash. That's where the real writing happens.
answer: |-
  Here's a **Narrative Identity Decision Procedure (NIDP)** designed for your kitchen table. It prioritizes *reader perception* and *story function* over pure philosophy, while incorporating essentialism's core insight (origin matters) pragmatically. It has 3 steps, with clear exit points.

  **Core Principle:** Readers perceive a character as "the same person" if they feel *continuity of experience or essence*, not just biology. The procedure asks what *breaks* that continuity.

  ---

  ### **The NIDP Steps**
  1.  **THE BODY TEST: Could this body exist in the original timeline without breaking physics?**
      *   **Ask:** "Does this variant originate from *the exact same biological starting point* (specific egg + specific sperm) as the original character?"
      *   **Good Enough Answer:** Focus on the *unique combination* of genetic material. Did *that specific egg* and *that specific sperm* combine?
          *   **YES:** Proceed to Step 2. *(This captures the essentialist core: unique genetic origin.)*
          *   **NO:** STOP. **"Different person wearing her face."** (Reader feels spooked). *This is the default "no" answer.*
      *   **Flattens:** Fertilization being a process? **Flattened.** We care about the *unique genetic combo* being present at conception. "Which sperm" is sharp enough for narrative. Gamete origins (grandmothers, atoms)? **Regress Stopped.** We stop at the gametes forming *this specific zygote*. Why? Because that's the unique biological starting point *for this individual organism*. Mitochondrial donation? **Decision:** The "egg" is defined by the *nuclear DNA source*. If the nucleus comes from the mother's original egg, it's the "same egg" for NIDP purposes, even with donor mitochondria. **Answer = YES** (Proceed to Step 2).
      *   **Hands Back?** Only if the biological change is *so minor* it feels irrelevant (e.g., a single molecule difference). Unlikely in your variants. If you hit this, it's a choice.

  2.  **THE MIND TEST: Does the core 'self' feel continuous?**
      *   **Ask:** "Would this variant share *fundamental memories, core personality traits, or formative experiences* with the original character, *despite* the changed origin circumstance?"
      *   **Good Enough Answer:** Look for *disruptions to identity-forming continuity*.
          *   **SHARED CORE:** Key childhood memories intact? Core personality (e.g., stubbornness, curiosity) recognizably the same? Crucial relationships/events shaping them still happened? **YES:** Proceed to Step 3.
          *   **BROKEN CORE:** Profoundly different upbringing erasing formative memories? Personality fundamentally altered by the change? Key identity-shaping events missing? **NO:** STOP. **"Different person wearing her face."** (Reader feels spooked).
      *   **Flattens:** Philosophical "ship of Theseus" problems. We care about *narratively significant* continuity of mind/experience.
      *   **Hands Back?** If the changes are significant but *plausibly* could lead to a recognizably similar person (e.g., same genetics, loving family vs. slightly different loving family). This is where *your story choice* about nurture vs. nature kicks in.

  3.  **THE STORY TEST: Is continuity essential for the narrative's emotional core?**
      *   **Ask:** "For the reader to feel the intended emotion (grief/loss or connection), *must* this be experienced as the *exact same person* continuing their journey, or is the resonance about *potential*, *parallels*, or *essence*?"
      *   **Good Enough Answer:**
          *   **CONTINUATION ESSENTIAL:** The emotional weight relies on *this specific person* enduring/changing through time *despite* the altered circumstance? The reader needs to feel "This is *HER*, facing this new reality"? **YES: "Same person."** (Reader grieves/changes with her).
          *   **RESONANCE SUFFICIENT:** The power comes from seeing *what could have been*, a reflection, a dark echo, or the persistence of genetic potential in a new context? **NO: "Different person wearing her face."** (Reader feels spooked/reflective).
      *   **Flattens:** Deep metaphysics of persistence. We care about *narrative function*.
      *   **Hands Back?** Rarely. This *is* the authorial choice about the "emotional contract." The procedure forces you to articulate *why* you need identity continuity for the story.

  ---

  ### **Running Your Variants (NIDP Applied)**

  1.  **Frozen Embryo (Same Gametes, Born Later, Different Family):**
      *   **Step 1 (Body):** Same specific egg + sperm? YES. (Genetic origin identical). *Proceed.*
      *   **Step 2 (Mind):** Shared core memories/personality? **LIKELY NO.** Being born 12 years later into a completely different family radically alters formative experiences, relationships, cultural context, and core memories. The *genetic potential* is there, but the developed mind is shaped by a vastly different world. *Broken Core.* **STOP. "Different person wearing her face." (Spooked).**
      *   *Editor Impact:* Hates this. It breaks the "one woman's life" throughline. *NIDP forces a choice:* Admit it's a different person (spooked) OR override Step 2 based on artistic need for continuity (grief). Overriding leans into genetic essentialism/nature over nurture for the story. **NIDP flags this as a major authorial choice point.**

  2.  **Identical Twins (Same Zygote Splits):**
      *   **Step 1 (Body):** Same specific egg + sperm? **YES.** (They originate from the *same unique genetic combo*). *Proceed.*
      *   **Step 2 (Mind):** Shared core memories/personality? **NO.** Twins are distinct individuals with separate consciousnesses, experiences, and memories from the moment they exist as separate entities (post-split). *Broken Core.* **STOP. "Different person(s) wearing her face." (Spooked - uncanny double).**
      *   *NIDP Insight:* This highlights why Step 1 asks about the *zygote* (unique genetic origin). It *correctly* identifies the twins as having the *same biological origin point*, but Step 2 *correctly* identifies them as distinct individuals. **This is a feature, not a bug.** It shows the procedure separates biological origin from psychological identity. For your novel, twins are clearly different people. Using "same gametes" as the Step 1 question handles this correctly.

  3.  **Clone (Mother's Somatic Cell Nucleus in Donor Egg):**
      *   **Step 1 (Body):** Same specific egg + sperm? **NO.** No sperm involved. The nucleus comes from a *skin cell*, not a gamete. It's a fundamentally different biological origin process. **STOP. "Different person wearing her face." (Spooked - artificial echo).**
      *   *Editor Impact:* Hates this. Definitely breaks "one woman's life." **NIDP is firm here.** This is biologically *not* the same person's origin story; it's the creation of a genetic twin born later. The emotional impact *must* be uncanny valley or reflection, not continuity. Trying to force "same person" here will likely ring false biologically and philosophically for many readers. Own the spookiness.

  ---

  ### **Where NIDP Works, Misfires, and Forces Choice**

  *   **Keeps Essentialism's Core:** Step 1 enforces the Kripkean insight that *unique biological origin matters fundamentally* for identity. This is what does the heavy lifting.
  *   **Flattens Effectively:** Fertilization process? Ignored. Gamete/atomic origins? Regress stopped. Mitochondria? Defined by nuclear DNA. These are necessary simplifications for narrative use. The core distinction (unique genetic combo vs. not) survives.
  *   **Handles Twins Correctly:** Step 1 (same origin) + Step 2 (different minds) = different people. This is intuitive.
  *   **Misfires If:** You write a story *explicitly* about gradual replacement (Ship of Theseus) or consciousness upload. NIDP is built for *biological origin* variants. It assumes physical continuity matters. For pure psychological continuity tales, it breaks.
  *   **Forces Your Choice:** It *will* hand back decisions, primarily at Step 2/3 for variants like the frozen embryo or cases with moderate environmental changes. **This is good.** It makes you articulate *why* identity continuity is needed for *this story's emotion*. Is it about the body enduring? The soul? The memory? The potential? NIDP doesn't give a philosophical answer there; it forces the narrative one.
  *   **Editorial Pain Points:** The Frozen Embryo and Clone variants will cause friction. NIDP clearly shows why. To keep the "one woman's life" throughline with the frozen embryo, you *must* override Step 2 and emphasize genetic continuity over lived experience. For the clone, you *cannot* credibly claim it's the same person; embrace the doppelgänger.

  **Use it like this:** Pitch variant -> Run Step 1 (5 sec) -> If YES, run Step 2 (5 min discussion) -> If YES, run Step 3 (5 min discussion). Most pitches die at Step 1. The complex ones (like frozen embryo) die at Step 2 or trigger the essential authorial choice in Step 3. Stop arguing metaphysics; argue narrative function and reader emotion. Trust Step 1 on biology; debate Steps 2 & 3 on story needs.
