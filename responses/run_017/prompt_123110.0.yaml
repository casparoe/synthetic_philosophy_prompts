  ### Residue Report: What Doesn’t Map  
  - **Philosophical Residue:** Ethical justifications (e.g., "why should we adopt utilitarianism?"), the normative weight of equiprobability, or Rawls’ "veil of ignorance" as fairness. Your vocabulary computes aggregations but cannot justify them.  
  - **Technical Residue:**  
    - Ordinalism’s rejection of cardinal utility conflicts with Boltzmann policies’ cardinal foundation.  
    - Sen’s "unit comparability" assumes interpersonal alignment of utility units—your models enforce this technically but don’t explain *why* it’s valid.  
  - **Unmapped Concepts:**  
    - **Empathy/Extended Sympathy:** No analogue for modeling agents who internalize others’ rewards.  
    - **Normative Bargaining Power:** Nash bargaining weights or utilitarian weights are exogenous; your framework doesn’t derive them from agent properties.

  ---

  ### Critique of Your Hypotheses  
  #### Hypothesis 1: *"RLHF is a working interpersonal comparator delivering level comparability."*  
  - **Why It’s Partly Correct:**  
    RLHF trains a **single reward model $R_{\text{shared}}$** on pairwise comparisons from multiple annotators, assuming:  
    $$  
    P(\text{prefer } x \text{ over } y) = \sigma \left( \frac{R_{\text{shared}}(x) - R_{\text{shared}}(y)}{\tau} \right)  
    $$  
    with **shared $\tau$**. This technically enforces **unit comparability** (common scale for $\Delta R$) and treats $R_{\text{shared}}$ as commensurable across annotators. Downstream, the reward is treated as interpersonally cardinal.  
  - **Why It Relocates (Not Solves) Incommensurability:**  
    - **Level comparability is not achieved:** $R_{\text{shared}}$ has an arbitrary shift (adding $c$ to all rewards doesn’t change preferences). You still can’t say "annotator A is happier in state $x$ than annotator B in state $y$."  
    - **Assumption-laden:** Shared $\tau$ and $R_{\text{shared}}$ assume all annotators have identical reward scales and noise levels. This is empirically false—human risk-sensitivity (temperature) varies. RLHF papers often note annotator disagreement, but the model ignores it.  
    - **Philosophical evasion:** RLHF *asserts* comparability by fiat. It doesn’t resolve debates; it sidesteps them by assuming a single "representative human."  

  #### Hypothesis 2: *"Temperature is an independent route to cardinality."*  
  - **Why It’s Partly Correct:**  
    If agents are Boltzmann-rational with **known $\tau_i$** (e.g., from physiological data or behavioral variance), then reward differences are quantified in **nats**:  
    $$  
    \Delta R_i(s,a,s') = \tau_i \log \frac{\pi_i(a|s)}{\pi_i(a'|s)}  
    $$  
    This fixes the **scale** of $R_i$, achieving unit comparability. If $\tau_i = \tau_j$ for all $i,j$, differences are directly comparable.  
  - **Why It Fails:**  
    - **Shifts remain arbitrary:** $\Delta R_i$ is comparable, but $R_i(s)$ levels are not. Level comparability requires a universal zero (e.g., "death = 0"), which temperature doesn’t provide.  
    - **No independent $\tau_i$ measurement:** In practice, $\tau_i$ is *fitted* from choices, creating circularity:  
      $$  
      \text{choices} \rightarrow \{\tau_i, R_i\} \text{ degenerate up to scale}  
      $$  
      External $\tau_i$ estimates (e.g., from neuroscience) are currently speculative.  
    - **Cross-agent $\tau$ variance:** If $\tau_i \neq \tau_j$, comparing $\Delta R_i$ to $\Delta R_j$ requires normalizing by temperature—but that’s equivalent to assuming scale homogeneity.  

  ---

  ### The Separateness of Persons: A Formalism Hole?  
  - **Your Observation:** $N$ agents are just a vector $\vec{R} \in \mathbb{R}^N$. Aggregation (scalarization, bargaining) is a computational subroutine with no inherent "boundary preservation."  
  - **Why This Isn’t a Hole:**  
    The "separateness" objection is **normative**, not technical. It argues that *even if* you compute $\text{scalarize}(\vec{R})$, you *should not* treat it as ethically equivalent to a single agent’s reward. Your formalism *can* implement Rawlsian maximin ($\min_i R_i$) or Nash bargaining ($\prod_i (R_i - R^{\text{disagree}}_i)$), but:  
    - These are still just functions on $\vec{R}$.  
    - Nothing in the math privileges "individual integrity"—it’s a value judgment imposed externally.  
  - **Conclusion:** The philosophical claim doesn’t "cash out" because it’s prescriptive. Your formalism exposes that once rewards are cardinal and comparable, aggregation is just math. The debate shifts to: *Which aggregation, if any, is ethically justified?*  

  ---

  ### Final Take: Relocated, Not Resolved  
  Your hypotheses **relocate incommensurability**:  
  - **RLHF** assumes a single human reward function, burying heterogeneity in the data.  
  - **Temperature** fixes scale but leaves shifts arbitrary and lacks empirical $\tau_i$ measurement.  
  The core problem—**justifying interpersonal comparisons**—remains philosophical. Your formalism provides tools to *implement* comparability (via shared $\tau$, scalarization, etc.), but the choice to use them rests on normative grounds outside RL. 

  **Recommendation:** Embrace this. Use your vocabulary to design systems that *explicitly encode* ethical choices (e.g., "utilitarian vs. Rawlsian aggregation"), but acknowledge that no math can dictate the choice itself. The "separateness of persons" isn’t a formalism flaw—it’s a reminder that ethics precedes optimization.
