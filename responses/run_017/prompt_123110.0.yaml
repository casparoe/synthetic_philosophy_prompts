  ### Translation of the Interpersonal Utility Comparisons Debate into Your Vocabulary

  **Core Philosophical Positions & Their RL Equivalents:**

  1. **Ordinalism (IUC are unscientific):**  
     - **Clean Map:** Reward functions are only ordinally comparable. Without additional assumptions (like shared scale/temperature), comparing rewards across agents is meaningless—just as ordinalists claim for utilities. The scale–temperature degeneracy in IRL (identifiability only up to positive affine transformations) directly mirrors the ordinalist critique: absent scale constraints, cardinal comparisons are arbitrary.  
     - **Distortion:** Ordinalism rejects *any* cardinal structure, but your framework assumes Boltzmann policies that *impose* cardinality (via temperature). This forces a distortion: Boltzmann-rationality smuggles in cardinality via its parametric form, which ordinalists would dispute as empirically unjustified.  
     - **Cannot Express:** Ordinalism’s core claim—that cardinal utility is a metaphysical construct—cannot be captured. Your framework *requires* cardinal rewards as a primitive.

  2. **vNM/Harsanyi Cardinality:**  
     - **Clean Map:**  
       - **vNM:** Lotteries → choices map to **Boltzmann policies with known temperature**. An agent’s policy under stochastic choices reveals vNM cardinal rewards (unique up to affine shifts).  
       - **Harsanyi:** **Scalarized team objectives** (e.g., linear sum of rewards) implement utilitarian aggregation. Harsanyi’s equiprobability model is analogous to a **multi-agent policy with uniform identity sampling**: agents optimize $\mathbb{E}_{i \sim \text{Uniform}}[R_i]$ behind a "veil of ignorance."  
     - **Distortion:** Harsanyi assumes vNM rationality for all individuals, but your Boltzmann policies fix temperature exogenously. His "extended sympathy" (empathy across identities) lacks a direct RL analogue—your agents optimize rewards, not simulated cross-agent preferences.  
     - **Cannot Express:** Harsanyi’s ethical justification for utilitarianism. Your framework computes aggregation mechanically but doesn’t encode why equiprobability is "fair."

  3. **Sen’s Comparability:**  
     - **Clean Map:**  
       - **Level Comparability** (absolute reward levels comparable): Requires fixing both **scale and shift** of all reward functions.  
       - **Unit Comparability** (reward differences comparable): Requires fixing **scale** (e.g., shared temperature) but allows arbitrary shifts.  
       - Sen’s hierarchy maps to **constraints on reward identifiability**:  
         - Utilitarianism → Unit comparability (scale fixed, shifts irrelevant for $\sum \Delta R$).  
         - Maximin → Level comparability (scale/shift fixed to compare $\min_i R_i(s)$).  
         - Nash Bargaining → Ratio scale (scale fixed, shift fixed to $R_i=0$ at disagreement point).  
     - **Distortion:** Sen’s comparability classes are purely theoretical; your framework operationalizes them via **temperature and reward normalization**.  
     - **Cannot Express:** Sen’s focus on *ethical* justifications for comparability. Your models implement comparability technically but don’t adjudicate normative choices.

  4. **Rawls/Separateness of Persons:**  
     - **Clean Map:** None. Your formalism treats $N$ agents as a **vector-valued reward MDP** $\langle S, A, P, \vec{R} \rangle$. Boundaries between agents vanish—aggregation (e.g., scalarization) is just another Pareto-efficient projection.  
     - **Distortion/Cannot Express:** The moral claim that "aggregating utilities violates individual integrity" has no counterpart. Your framework *only* sees $\vec{R}$ as coordinates in $\mathbb{R}^N$. Maximin or Nash bargaining can be computed, but the "separateness" objection is philosophical, not algorithmic.

