prompt: |-
  My brother-in-law is a therapist and every time we argue about this he falls back on the same pair of pictures: guilt is like a debt, shame is like a stain. He uses them to argue that guilt is obviosly the better moral emotion — a debt is about what you actually did rather than about how you look to other people, it has a definite amount, it can be repaid or forgiven, and it does not need anyone watching — while a stain is about appearances, it hangs around, and nothing you do really settles it. He is also half leaning on that old mid-century anthropology contrast between guilt cultures and shame cultures, which I gather anthropolgoists mostly dropped but which is still all over the management literature I read.

  I write a fortnightly newsletter for people who run small organisations, and the piece I am stuck on is whether a team can deliberately build one of these rather than the other, so I need to know how much weight the two pictures can actually bear. Could you audit them for me? I want exactly five numbered points, one or two sentences each, no introduction and no summing-up at the end, in British English:

  1. the mapping in compressed form — what plays the creditor, the ledger, the repayment or forgiveness, the audience, the washing;
  2. the things each picture quietly imports that guilt and shame do not obviously have — I keep coming back to creditorless guilt, the sort you feel about someone who is dead or in survivor guilt, and to shame you would feel with no witness at all;
  3. the single disanalogy that does the most damage to the way he is using them, and why that one and not the others;
  4. whether the guilt-is-better claim survives once the disanalogies are on the table, or whether the analogy was carrying it the whole time;
  5. what either picture implies about whether a group can pick one — does the debt picture need institutions, someone with standing to discharge the debt, in a way the stain picture does not — and whether there is a better pair of analogies for what he is actually after.
reasoning: |-
  Hmm, the user is writing a newsletter about whether teams can deliberately build guilt or shame cultures, and they're stuck because their brother-in-law, a therapist, uses the analogy that guilt is like a debt and shame is like a stain to argue that guilt is better. The user wants me to audit these analogies with five specific points in British English, no intro or conclusion, just numbered responses.

  First, I need to understand what they're asking for. The user has provided a breakdown of exactly what they want in each point: 1) compressed mapping of the analogies, 2) what each picture imports that guilt/shame don't have, 3) the most damaging disanalogy, 4) whether the "guilt is better" claim survives, and 5) implications for groups picking one and if there's a better analogy. I have to stick to this structure precisely.

  I'll start with point 1. For the debt analogy: creditor could be the person wronged or society, ledger is the conscience or moral record, repayment is atonement or apology, forgiveness is absolution, and no audience needed since it's internal. For the stain analogy: audience is others' perceptions, washing is attempts to remove shame, and it hangs around persistently. This covers the compressed mapping as requested.

  For point 2, the user mentioned creditorless guilt and witnessless shame. The debt analogy imports a specific creditor, which isn't always present—think survivor guilt where no one is to blame. The stain analogy imports an audience, but shame can be private, like feeling disgusted with oneself alone. That addresses what's quietly imported.

  Point 3 needs the most damaging disanalogy. I think it's the discharge aspect. Debts can be repaid and finished, but guilt often lingers even after apology, like in trauma. This undermines his argument that guilt is "better" because it's resolvable, whereas in reality, it's not always clean. Why this one? Because it directly attacks the core benefit he claims for guilt.

  On point 4, the "guilt is better" claim doesn't survive well. The analogy carries it by making guilt seem transactional and fixable, but disanalogies show guilt can be irrational and persistent, just like shame. So the argument relies heavily on the flawed metaphor rather than reality.

  For point 5, groups might struggle with the debt analogy—it needs institutions for forgiveness, like HR systems, which small teams may lack. The stain analogy is more about social dynamics, so it might be easier to foster but riskier as it focuses on appearances. A better pair? Perhaps guilt as a compass (internal guidance) and shame as a mirror (reflecting social views), which are less transactional and more about functions.

  I'm using British English as requested: words like "forgotten" instead of "forgotten," and spellings like "analyse." Keeping it concise—one or two sentences per point. This should help the user critique their brother-in-law's stance and inform their newsletter on building team cultures.
answer: |-
  1.  Debt mapping: The wronged party (creditor), the transgression's record (ledger), amends or apology (repayment/forgiveness); no inherent audience needed. Stain mapping: Others' perception (audience), attempts at concealment or reparation (washing); the stain inherently persists.
  2.  Debt imports a specific, addressable creditor, absent in creditorless guilt (e.g., survivor guilt). Stain imports an observing audience, absent in purely private shame felt without witnesses.
  3.  The most damaging disanalogy is discharge: debts can be definitively settled, but guilt often lingers irrationally despite reparation (e.g., parental guilt), undermining the claim guilt is inherently resolvable.
  4.  The "guilt is better" claim weakens significantly; disanalogies show guilt isn't always rational or dischargeable (like debt), while shame isn't solely about appearances (like a stain), suggesting the analogy carried the moral judgement.
  5.  The debt picture implies needing recognised authority (creditor) to forgive/discharge, which small teams may lack; the stain picture needs no formal institution, relying on social dynamics. For "better" emotions, consider guilt as a compass (internal guide) and shame as a mirror (social reflection).
