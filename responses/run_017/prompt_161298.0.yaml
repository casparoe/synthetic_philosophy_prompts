answer: |-
  ### Feedback on Take-Home Answer  
  **Overall Mark: 13.5/20**  
  *(Breakdown: 5.5/6 for (a), 5/7 for (b), 3/7 for (c). Details below.)*  

  ---

  #### **Part (a): Common Prior Assumption and Milgrom-Stokey (6 marks)**  
  **Quoted: "Start with the common prior assumption (CPA). It says that at the ex ante stage — before anyone gets their private signal — all traders assign the same probability distribution over states of the world."**  
  - **Correct.** Clear definition of CPA’s core claim.  

  **Quoted: "It does not say traders have the same beliefs when they actually trade: once private information arrives their posteriors generally differ, and they can have different utility functions and different endowments as well."**  
  - **Correct.** Accurate distinction between priors, posteriors, and non-informational differences (utility/endowments).  

  **Quoted: "Milgrom and Stokey (1982) combine CPA with common knowledge of rationality, common knowledge that the trade is voluntary and mutually accepted, and the requirement that the pre-trade allocation be Pareto optimal relative to the prior. Conclusion: no trade."**  
  - **Correct.** Precise summary of MS assumptions and conclusion.  

  **Quoted: "The mechanism is basically Aumann's (1976) agreement theorem... By Aumann, the two sides' posteriors must be identical at the moment of trade, so neither can expect to gain."**  
  - **Correct.** Valid intuition linking MS to Aumann; highlights why CPA is essential (prevents gains from trade under common knowledge).  

  **Quoted: "The trades that survive, then, are exactly the ones where posteriors can stay apart, and that means the parties must have started from different priors."**  
  - **Partial credit (minor issue).** Overstates MS. MS only rules out trade *under CPA*; it does not prove trade *requires* heterogeneous priors (trade can occur for non-informational reasons even under CPA). Clarification needed.  
  - **Mark:** -0.5 for overgeneralization.  

  **Quoted: "Note what this does not say... Those loopholes are what keeps volume alive in real markets."**  
  - **Excellent.** Correctly identifies limitations: MS only rules out *speculative* trade (information-based), not insurance/liquidity trades or trades without common knowledge (e.g., noise traders). Strong nuance.  
  - **Mark:** Full credit for this section.  

  **Part (a) Total: 5.5/6**  
  - Strengths: Clear CPA definition, correct MS setup, excellent loophole discussion.  
  - Weakness: Slight overstatement on heterogeneous priors as the *only* escape.  

  ---

  #### **Part (b): Support/Undermine Information Aggregation? (7 marks)**  
  **Quoted: "Grossman and Stiglitz (1980) is the natural sequel... and the market collapses."**  
  - **Correct.** Accurate statement of the G-S paradox (prices can’t be fully revealing).  

  **Quoted: "Their resolution is the noisy rational expectations equilibrium... free-ride on the price."**  
  - **Correct.** Good explanation of partial aggregation via noisy REE.  

  **Quoted: "So the Hayekian dispersed-knowledge story survives, but in a weaker form... pays for the information in the first place."**  
  - **Partial credit (omission).** Correct on G-S weakening aggregation (partial/incomplete), but **fails to integrate Milgrom-Stokey**. MS shows speculative trade is impossible under CPA without frictions, which is *why* G-S needs noise (to break common knowledge and allow trade/aggregation). Missing this link undermines the "together" aspect of the question.  
  - **Mark:** -2 for not connecting MS to G-S.  

  **Part (b) Total: 5/7**  
  - Strengths: Solid G-S summary, correct "weaker aggregation" take.  
  - Weakness: No discussion of MS’s role (CPA prevents trade, so noise in G-S resolves both trade and aggregation).  

  ---

  #### **Part (c): Assessing the "Volume = Irrationality/Heterogeneous Priors" Reading (7 marks)**  
  **Quoted: "Since MS shows that information-based speculation is impossible under CPA, and since real markets trade enormous volume every day, real traders cannot be sharing a prior — the volume has to come from heterogeneous priors."**  
  - **Incorrect/inconsistent.** Contradicts your own part (a). MS only rules out *speculative* trade under CPA, but you noted loopholes: volume can stem from *non-speculative* trades (hedging, liquidity) or trades *without common knowledge* (e.g., noise traders) *even under CPA*. Asserting volume *must* imply heterogeneous priors ignores these CPA-compatible explanations.  
  - **Mark:** -2 for inconsistency/misapplication.  

  **Quoted: "We could also appeal to irrationality, but we don't need that hypothesis."**  
  - **Partial credit.** True that irrationality isn’t necessary, but misses that CPA-compatible alternatives (loopholes) also exist.  

  **Quoted: "And this refutes the Hayekian picture rather than weakening it..."**  
  - **Incorrect/overstated.** Contradicts part (b). G-S (under CPA with noise) shows markets *do* partially aggregate information, weakening but not refuting Hayek. Also, markets serve multiple functions (e.g., risk-sharing), not just "betting."  
  - **Mark:** -2 for contradiction and overstatement.  

  **Part (c) Total: 3/7**  
  - Strengths: Identifies a common interpretation.  
  - Weaknesses:  
    - Inconsistent with part (a): Ignores CPA-compatible volume sources (non-speculative trades, noise).  
    - Overlooks G-S’s CPA-based aggregation (from part (b)).  
    - No critical assessment of the reading’s validity (e.g., "Does volume *necessarily* imply heterogeneous priors? What about loopholes?").  

  ---

  #### **Ambiguity/Unfairness in Question**  
  - **Part (b)’s "these results, together"** is slightly ambiguous. "These results" refers to Milgrom-Stokey (from part (a)), but students might misread it as standalone. Still, the phrasing ("together with Grossman-Stiglitz") implies integration. **Not unfair**, but consider clarifying if scaling.  
  - **Part (c)’s "assess that reading"** is clear, but students may oversimplify if they forget their own loopholes (as here). **Not unfair**—tests careful reasoning.  

  **Recommendation:** Minor scaling *might* be justified if many students missed the MS-G-S link in (b) or loopholes in (c), but the question is broadly fair.  

  **Final Notes:**  
  - **Strengths:** Excellent clarity on CPA/MS in (a), strong loophole awareness, good G-S analysis in isolation.  
  - **Areas for Improvement:** Consistency across parts (especially (c) vs. (a)), explicit integration of ideas (e.g., MS and G-S), avoiding overstatement.  
  - **Key Tip:** When assessing a claim (e.g., in (c)), test it against *all* relevant theorems—don’t abandon earlier nuances.
