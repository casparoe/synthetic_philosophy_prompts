answer: |-
  ### Final Exam Question: Reasons and Normativity Seminar  
  *(90 Minutes Total - Answer One Question)*  

  **QUESTION 3: THE EXCLUSION PROBLEM REFINED**  
  Fitting-attitude (FA) accounts hold that an object’s evaluative property (e.g., being funny or admirable) is constituted by facts about reasons to favor it (e.g., to admire or be amused). Such accounts face an *exclusion problem*: they must exclude "wrong-kind" reasons (WKR)—reasons to have an attitude that do not bear on whether the object *has* the property—while retaining "right-kind" reasons (RKR) that do bear on this. The standard solution distinguishes *reasons bearing on the attitude’s fittingness/correctness* (RKR) from *reasons bearing on the costs/benefits of having it* (WKR).  

  Consider two cases challenging this distinction:  
  - **Case A (Deferred Access)**: A poem has a genuinely funny feature perceptible *only after* one is amused (amusement redirects attention to it). You are offered this reason to be amused: *"Amusement is your only route to appreciating the funny-making feature of this poem."*  
  - **Case B (Friend’s Request)**: A friend asks you, *as a friend*, to find her mediocre poem funny. There is no threat/bribe, but finding her work funny is partly constitutive of your friendship, and you have strong reason to sustain the friendship.  

  **Answer the following in a single, structured argument (no citations needed):**  
  1. For each case, is the reason offered RKR or WKR? Does the answer depend on *whether the attitude would be held because of that reason*? Justify your verdicts.  
  2. **Crux**: Can we state a *general distinction* between RKR/WKR that:  
     (i) Yields clear answers for both cases,  
     (ii) Avoids appealing to the *very evaluative property* (e.g., "funny") the FA account analyzes,  
     (iii) Is not merely a list of pre-classified cases?  
  If no distinction satisfies all three, what should the FA theorist *give up* instead? Explain why.  

  ---  
  ### Model Answer (595 words)  

  **Part 1: Case Analyses**  
  In **Case A**, the reason ("amusement is your only route to appreciating the funny feature") is an RKR. It directly facilitates *access* to the property that makes amusement fitting: the poem’s humor. Crucially, this reason *would not exist* if the poem lacked this feature. The reason’s status *does not* depend on whether you are amused *because of it*. Even if you become amused for unrelated reasons (e.g., nervousness), the reason remains RKR because it is intrinsically tied to the poem’s humor-grounding properties. It is not a pragmatic incentive but an *epistemic enabler* of fittingness.  

  In **Case B**, the reason ("sustaining friendship requires finding her poem funny") is a WKR. Friendship’s constitutive norms generate reasons to adopt attitudes that support the relationship, but these are independent of the poem’s actual humor. The reason persists even if the poem is unfunny, making it WKR by the standard definition. However, whether the attitude is held *because of this reason* matters critically. If you find the poem funny *solely* to preserve friendship (not due to any perceived humor), the reason operates as a classic WKR—it incentivizes attitude-adoption extrinsically. But if the friendship norm *alters your perception* (e.g., you focus on endearing quirks in the poem), the reason might *indirectly* lead to a genuine RKR-based response. Yet the reason itself remains WKR: it appeals to friendship’s value, not the poem’s humor.  

  **Part 2: The Crux – A General Distinction?**  
  No satisfactory general distinction satisfies all three criteria. To see why, consider candidate distinctions and their failures:  
  - *"RKR target the object’s properties; WKR target attitude-consequences"*: This fails **Case A**, where the reason (a consequence: accessing humor) is RKR.  
  - *"RKR make the attitude fitting; WKR make it prudent"*: This fails **Case B**, where friendship-based reasons are non-prudential yet still WKR.  
  - *"RKR are object-given; WKR are state-given"* (à la Parfit): **Case B** undermines this. Friendship reasons are "object-given" (they concern the friend’s needs) but remain WKR for the property *funny*.  

  Appealing to the *specific property* ("funny") violates criterion (ii). For example, stating "RKR for amusement bear on humor" is circular in an FA analysis. Alternatively, listing cases (iii) avoids principled explanation.  

  **What the FA Theorist Should Give Up**  
  The FA theorist should relinquish the assumption that *all* evaluative properties can be analyzed via a *single, context-invariant RKR/WKR distinction*. **Case A** shows RKR can include reasons enabling *access* to fittingness conditions (expanding RKR beyond direct evidence). **Case B** reveals that *relational norms* (e.g., friendship) generate reasons that are WKR for the property (e.g., "funny") but *RKR for a different property* (e.g., "valuable-as-a-friend’s-work"). The mistake is forcing a binary onto a pluralistic normative landscape. Instead, FA accounts should:  
  1. **Index RKR to specific evaluative properties** (avoiding cross-property generalizations).  
  2. **Accept hybrid reasons**: Some reasons (like **Case B**’s) are WKR for one property but RKR for another constitutive norm.  
  This preserves FA’s core insight—evaluative properties are constituted by reasons to respond—while acknowledging that reasons derive from diverse normative sources. The "exclusion problem" dissolves when we stop insisting on a monolithic distinction.  

  ---  
  ### Marking Scheme (Total: 20 points)  
  | **Points** | **Must-Hit Point** | **Common Mistakes** |  
  |------------|---------------------|----------------------|  
  | **4** | Correctly identifies Case A as RKR *and* Case B as WKR, with justification tied to the attitude’s grounding. | Misclassifying Case A as WKR (treating access-enablers as pragmatic) or Case B as RKR (confusing friendship’s value with humor). |  
  | **3** | Explains whether motivation matters in each case: Not for A, critically for B. | Overgeneralizing motivation’s relevance (e.g., claiming it always matters) or missing its role in Case B. |  
  | **5** | Argues that no distinction satisfies (i)–(iii), testing ≥2 candidate distinctions against the cases. | Proposing a distinction that fails against cases OR appealing to circular criteria (e.g., "RKR just are those that make the attitude fitting"). |  
  | **5** | Defends a coherent "give up" claim (e.g., abandoning a universal RKR/WKR binary) with a positive alternative (e.g., property-indexing). | Vaguely suggesting "the distinction is flawed" without offering an alternative FA-compatible solution. |  
  | **3** | Overall argument structure: Clear progression, avoids tangents, addresses all sub-questions. | Disjointed analysis; ignoring one case or sub-question. |  

  **What separates an A from a B answer?**  
  An A answer recognizes that **Case B forces the FA theorist to relativize the RKR/WKR distinction to specific evaluative properties or normative contexts**, while a B answer treats the cases as isolated puzzles without reforming the theoretical framework.
