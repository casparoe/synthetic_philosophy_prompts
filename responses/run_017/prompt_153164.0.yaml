prompt: |-
  Next month I am giving a work-in-progress paper at a joint session of the philosophy of mind group and the epistemology group in a department I am visiting: forty minutes of talk, forty minutes of discussion, seminar table rather than lectern. The room will be roughly this: two internalists of the older sort, one of whom has argued at length that the extended-mind literature trades on confusing causal coupling with constitution and arrives expecting my paper to be one more instance of that confusion; a younger colleague working in predictive processing and active inference, who thinks the boundary-of-cognition question dissolves once you have Markov blankets and who will be impatient with anything framed as a dispute about where mental states are located; a social epistemologist whose work concerns epistemic injustice and how institutions decide which informants and which instruments get credited with knowledge, and who will want to know what my view implies about artifacts that are not neutrally or equally available; a philosopher of psychiatry working on confabulation and delusion, who is the reason I settled on the case I did; and fifteen or so graduate students who are broadly sympathetic to externalism about content but anxious about whether this literature makes any checkable claim about the world.

  The thesis is a reformulation of the extended mind thesis. I argue that the parity principle is close to toothless, because any causal coupling to an environment can be given a functional description that matches some putative internal process, so parity will always return yes; the real work in the classic cases is being done by something the principle never states. I replace it with what I call the delegation condition: a subject counts as having extended a cognitive process into an artifact just in case (i) she has assigned the artifact a specific cognitive sub-task rather than merely using it opportunistically, (ii) she treats its outputs as presumptively authoritative for that sub-task, in the sense that she acts on them without re-deriving them, and (iii) she is disposed to answer for its errors the way she answers for her own slips — that is, she offers corrections rather than excuses, and treats a failure as a reason to revise the artifact or her reliance on it rather than as a bare fact about the world.

  The case I build the talk around is what I have been calling the confabulating surrogate. A woman with a degenerative memory condition wears a device that records her days and plays them back on request; the device, like any compression scheme, fills gaps with plausible invented detail; she relies on it entirely, acts on what it returns, corrects it when it fails her, and never considers the possibility that it invents. On my condition the surrogate is part of her memory process, and so the consequence I have to face is that she genuinely remembers, and arguably comes to know, episodes that never happened. My planned response is two-part: first, separate membership in a cognitive process from entitlement to its deliverances, so that externality of process is compatible with failure of justification; second, argue that objections from unreliability, contamination, or opacity are parochial, since structurally identical problems arise for neural memory in the confabulation syndromes, and so cannot be doing the work the internalist needs them to do.

  What I want from you is a Q&A prep sheet, not a defense of the view. Give me the eight or so objections this particular room will actually produce, ordered by how much damage they would do, each phrased in the idiom of the person who will raise it rather than in neutral philosophical English, each with a reply I can deliver in about two minutes and a note on where that reply is soft. Tell me which of my three clauses is most likely to be the pressure point, and tell me honestly whether the delegation condition quietly collapses into an internalist criterion for an externalist conclusion, since if it does I would rather say so in the talk than be told so at the table. Tell me what I should concede in the body of the paper rather than in discussion, and which single reply has to land if the proposal is to survive the hour. Finally, give me the question I am hoping nobody asks. You can set aside the objections I already have stock answers to — the coupling-constitution complaint, the regress about where the boundary stops, and the usual conditions of trust, reliability and portability.
reasoning: |-
  Okay, let me start by understanding what the user needs. They're presenting a paper on the extended mind thesis with a new delegation condition. The audience is diverse: internalists, predictive processing advocates, social epistemologists, philosophers of psychiatry, and grad students. The user wants a Q&A prep sheet focusing on likely objections, not a defense. 

  First, I need to identify the key concerns each attendee might raise. The older internalist might challenge the delegation condition itself, arguing it's just internalist criteria in disguise. The predictive processing person might dismiss the location debate entirely. The social epistemologist would focus on unequal access to artifacts. The psychiatry expert might question the comparison to neural confabulation. Grad students might worry about testability.

  Next, I should prioritize objections by potential damage. The internalist's objection to the delegation condition being crypto-internalist is critical—if true, it undermines the whole thesis. Then, the social epistemologist's point about privilege could challenge the framework's applicability. The predictive processing objection might sideline the debate, which is also damaging. 

  For each objection, I need to phrase it in the speaker's idiom. For example, the internalist might say: "This 'delegation' is just a story you tell yourself about coupling..." The reply should address the specific critique. For the crypto-internalist point, the user should concede that internal states are necessary but argue that the process extends when tasks are offloaded. 

  The user’s clause (ii)—treating outputs as authoritative—is vulnerable. Critics might say this relies on internal attitudes, making the condition internalist. The response must distinguish between necessary internal states and the extended process itself. 

  The user must concede early that internal states are part of the process but argue that the cognitive system includes the artifact when delegation occurs. The key reply is to the internalist's crypto-internalist objection—if that fails, the proposal might collapse. 

  Finally, the question they hope nobody asks is whether the delegation condition applies to non-cognitive systems, like immune function. Comparing cognition to digestion could undermine the uniqueness of the extended mind thesis. The answer needs to clarify what makes cognitive processes distinct, possibly tying it to normativity and epistemic responsibility.
answer: |-
  Here’s your Q&A prep sheet, calibrated for this room and ranked by potential damage. I’ve flagged pressure points, strategic concessions, and the "hope nobody asks" question.

  ---

  ### **Top 8 Objections (Highest to Lowest Damage)**
  1. **The Older Internalist (Coupling-Constitution Veteran):**  
     *Objection:* "This ‘delegation’ condition is just *internalist* criteria smuggled into externalist clothing. You require the *subject’s attitude* toward the artifact (assigning tasks, treating outputs as authoritative, accepting responsibility). But that’s all happening *inside her head*. You’ve replaced Otto’s notebook with Otto’s *dispositions toward* the notebook. Isn’t this just ‘extended’ as a useful fiction for the agent, not a metaphysical claim about cognitive constitution?"  
     *Reply (1.5 min):* "Crucially, the attitudes *enable the artifact to play a functional role* that replaces an internal process. Without them, it’s causal coupling; with them, the artifact becomes the *vehicle* for the cognitive operation. Otto’s disposition makes the notebook his memory *because it now functions as his recall mechanism*, not just a prompt. The internal state enables the external state to be constitutive."  
     *Soft Spot:* Risks conceding that constitution depends on an internal "glue," weakening the anti-internalist thrust.  
     *Pre-emptive Move:* Concede in the *paper* that delegation requires internal scaffolding, but argue this scaffolding *binds* the external resource into the cognitive system.

  2. **Social Epistemologist (Epistemic Injustice Focus):**  
     *Objection:* "Your condition (iii) – ‘answers for errors by revising the artifact’ – assumes *access to repair*. But what about marginalized users relying on black-boxed AI, or medical devices they can’t modify? If they can’t ‘revise the artifact,’ does their reliance fail your condition? And doesn’t this exclude precisely the cases where injustice makes artifacts *non-neutral*, trapping users in unreliable systems they can’t fix?"  
     *Reply (2 min):* "Condition (iii) is about the *disposition to treat the artifact as answerable*, not technical ability to fix it. A user pressing tech support for fixes, demanding transparency, or switching devices *manifests* the disposition. The injustice lies in systems denying users this agential stance – which, tragically, often *prevents* delegation as I define it. My framework highlights this exclusion as a *cognitive disempowerment*."  
     *Soft Spot:* Blurs line between psychological disposition and socio-political capacity. May imply victims of injustice literally *lack* extended cognition, which feels victim-blaming.

  3. **Predictive Processing Scholar (Anti-Boundary):**  
     *Objection:* "Why frame this as ‘where’ cognition is located? Markov blankets show boundaries are dynamic and task-dependent. Your ‘delegation’ is just describing how hierarchical PP systems *reallocate resources* for prediction error minimization. The ‘extended mind’ debate is a category error – it’s all just distributed variational inference. Aren’t you reifying a distinction PP dissolves?"  
     *Reply (1 min):* "PP explains *how* delegation works mechanistically, but not *why* it matters normatively. When a resource is delegated to, its failures become *my* cognitive failures in a way sensorimotor loops don’t. The Otto case shows we hold agents responsible for notebook-errors *as belief-failures*, not just prediction errors. PP describes the engine; delegation describes the driver’s relationship to a specific tool *in* that engine."  
     *Soft Spot:* Doesn’t fully resolve the "why location matters" critique. Risks looking like PP-ignorant metaphysics.

  4. **Philosopher of Psychiatry (Confabulation Expert):**  
     *Objection:* "You say neural and artificial confabulation are ‘structurally identical.’ But in neural confabulation (e.g., Korsakoff’s), there’s *no external artifact* to debug – the failure is endogenous. Your surrogate user ‘correcting the device’ is fundamentally different: she’s debugging an external tool she *chose* to rely on. Doesn’t this break the parity you need to deflect unreliability objections?"  
     *Reply (1.5 min):* "The parity is in the *cognitive consequence*: both deliver false ‘memories’ integrated into self-narrative as true. The difference in *corrective mechanism* (debugging tool vs. neurological rehab) doesn’t erase the functional similarity: both systems produce unjustified outputs the subject treats as authoritative. The internalist can’t reject artificial cases *solely* on unreliability if they accept neural cases as cognitive."  
     *Soft Spot:* Distinction in *correctability* might undermine the "structural identity" claim. Concede neural cases lack "debugging" but stress shared *authoritative integration*.

  5. **Graduate Student (Externalist but Anxious):**  
     *Objection:* "If delegation relies on the subject’s *attitudes* (i-iii), isn’t this empirically untestable? How do we measure if someone ‘treats outputs as presumptively authoritative’ or has a ‘disposition to correct, not excuse’? This seems like a story we impose, not a checkable claim about cognition."  
     *Reply (1 min):* "Behavioral markers *are* testable: Does the user re-derive results? Do they blame the artifact or the world when it fails? (e.g., ‘My GPS is faulty’ vs. ‘The roads changed’). Neuropsychology already infers ‘ownership’ of body parts or actions from similar dispositions. This is no less empirical than attributing beliefs."  
     *Soft Spot:* Operationalizing "presumptive authority" is tricky. Requires careful behavioral criteria.

  6. **Older Internalist (Follow-up):**  
     *Objection:* "Condition (ii) – ‘acts without re-deriving’ – is absurdly weak. I act on my calculator without redoing the math, but that doesn’t make it *part of my mind*. Your conditions reduce cognition to *any* trusted tool. Where’s the boundary?"  
     *Reply (1 min):* "The calculator *is* part of your arithmetic process *when delegated to*. But condition (i) prevents trivial extension: it must be a *specific sub-task assignment* (‘calculate square roots for me’), not opportunistic use. Condition (iii) adds robustness: you’d blame the calculator, not the universe, if it returned √4=3."  
     *Soft Spot:* Still risks including too much (e.g., trusted apps). Needs tight integration with cognitive role.

  7. **Social Epistemologist (Follow-up on Institutions):**  
     *Objection:* "Your individualist focus ignores how institutions *impose* delegation. A nurse *must* use a hospital’s EHR system for patient records. She ‘delegates’ under duress, not freely. Does this count? And if so, does the hospital share cognitive responsibility when the system confabulates?"  
     *Reply (1 min):* "Delegation can be coerced! Condition (i)-(iii) can still hold under institutional constraint. The key is her *operational stance* toward the EHR. Responsibility *is* distributed: the nurse answers for *her* reliance (e.g., double-checking critical data), the institution for *providing* the tool. This reveals the moral complexity of institutional cognition."  
     *Soft Spot:* Stretches "delegation" towards "enforced use." Needs a principled line.

  8. **Graduate Student (The ‘Genuine’ Memory Worry):**  
     *Objection:* "Even if the surrogate is ‘part of her memory process,’ calling confabulated events ‘genuine memories’ feels wrong. Memories are (minimally) *reliable* traces. Your view severs memory from truth-tracking, making it unrecognizable."  
     *Reply (1 min):* "We *already* call neural confabulations ‘false memories’ – implying they are a *type* of memory, just faulty. The process is memory-like; the justification fails. Separating *process-type* (extended memory) from *epistemic-status* (unjustified belief) preserves the distinction while acknowledging the extended mechanism."  
     *Soft Spot:* Challenges intuitive link between memory and truth. Needs clear process/epistemology divorce.

  ---

  ### **Pressure Points & Strategic Moves**
  - **Most Vulnerable Clause:** **Clause (ii) – "Treats outputs as presumptively authoritative."**  
    *Why:* Easiest to conflate with mere trust in tools (calculator objection). Requires clearest behavioral criteria to avoid triviality/internalism.  
  - **Does Delegation Collapse into Internalism?**  
    **Yes, partially – and admit this upfront.** Say: *"Delegation requires internal states to* scaffold *extension – but this scaffolding* binds *the artifact into the cognitive system, making its states the subject’s cognitive states. Internal machinery enables external constitution."* Concede this in the **paper body** to pre-empt the #1 objection.  
  - **Key Concession in Paper (Not Q&A):** Acknowledge that delegation relies on "internal enabling conditions" (attitudes, dispositions). Argue this doesn’t reduce to internalism because the *cognitive work* is offloaded and constitutive.  
  - **Reply That Must Land:** Your counter to the **Internalist’s Crypto-Internalism objection (#1)**. If they don’t buy that internal attitudes can *constitute* externality without reduction, the core thesis falters. Hammer: *"The attitudes transform the artifact’s functional role from a mere cause to a vehicle."*  
  - **The Question You Hope Nobody Asks:**  
    *"If delegation defines cognitive extension, could my immune system be ‘delegated’ to fight a virus? I ‘rely’ on it without derivation, ‘correct’ it with medicine, and treat its failures as mine to fix. Is my immune system now part of my cognitive process?"*  
    *Why it’s deadly:* Forces you to either (a) accept cognitive bloat (immune system = cognition), or (b) admit your criteria aren’t sufficient for cognition, needing additional (internalist?) constraints.  
    *Emergency Reply:* "Cognition involves *information-processing for adaptive control*. Immune response lacks representational content or inferential integration. Delegation applies only to processes fulfilling *cognitive roles* (memory, inference, etc.). The immune system isn’t *recalling* or *inferring* – it’s regulating. My condition is necessary, not sufficient, for cognitive extension." (Soft: "Cognitive role" may feel circular.)

  ---

  **Final Tip:** Open Q&A by summarizing *why* parity fails and how delegation avoids triviality. Frame objections around "Does this capture *meaningful* extension?" rather than "Is this internalism?" to control the narrative. Good luck!
