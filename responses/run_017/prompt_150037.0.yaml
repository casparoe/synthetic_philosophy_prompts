  #### **Node 3: Self-Discrediting Cosmology?**  
  **Question:** *If a cosmology implies you’re probably a BB, does that make the cosmology self-discrediting? (i.e., should we discard it solely because it predicts we’re likely delusions?)*  
  - **Yes** → **Leaf C: Self-Discrediting Models**  
