prompt: |-
  I am presenting a paper at a law-and-philosophy workshop next Thursday. I get roughly twenty minutes to talk and then about thirty-five minutes of questions, and I would rather spend the intervening days preparing for the questions than polishing slides. I would like you to draft my preparation notes for the question period.

  The thesis: constitutional precommitment is legitimate only when what it protects is the reliability of future decision-making rather than the content of any future decision. I call the two kinds "integrity locks" and "outcome locks." The further claim, and the one that will draw blood, is that the Ulysses contract is a misleading model for the constitutional case. Odysseus binds himself against a temptation whose content he knows in advance and can therefore aim at; the binding succeeds precisely by overriding a future judgment he has already decided to disregard. Constitutional precommitment, I want to argue, has no such content to aim at, and where it acquires one it has stopped being self-government and started being rule by the dead.

  The argument runs in four steps. First, a distinction between two failure modes a precommitment might target: the future agent forms the wrong preference through weakness of will, versus the future agent forms its preference through a procedure whose conditions have themselves been altered in the agent's despite. Second, the claim that the apt analogy for the second case is not the mast but pre-registration: a researcher fixes the analysis plan before seeing the data, not because her later self is irrational, but because her later judgment will be distorted by information she cannot unsee. Nothing here overrides judgment; the binding exists to keep judgment accurate. Third, a diagnostic for telling the two apart in practice: a genuine integrity lock should be self-neutralizing — it should bind its authors' coalition as tightly as their opponents', and it should lapse unless reaffirmed — so the test for any entrenched provision is whether its framers would have accepted it operating against themselves. Fourth, the consequence, which is what will actually annoy people: entrenching a catalogue of rights is the hard case and mostly fails the test, while entrenching the constitutive rules of the amendment and electoral process mostly passes, but only in the stylized form of supermajority plus a mandatory interval plus ratification by a body outside the ordinary legislature, and only under a symmetry condition.

  The audience is about eighteen people. Two are constitutional lawyers who work on amendment rules and will press on whether my test has any grip on real provisions, or just redescribes whatever they happen to approve of. One is a formal political scientist who will want to know what an integrity lock buys that a trigger strategy in a repeated game does not, and will suspect the phrase "corrupted procedure" is doing work my formal apparatus cannot support. Three or four are deliberative democrats for whom any constraint on a present majority is a dead-hand problem full stop, and who will press the symmetry condition as a trap: either it is vacuous, because any framers can tell themselves they are being even-handed, or it is substantive, in which case I have quietly reimported the content I claimed to have expelled. One works on addiction and Ulysses contracts in clinical ethics and will object that I have misdescribed the psychology on my own chosen example, and that the interesting cases are not ones where the later self's judgment is impaired but ones where its values have changed.

  What I want from you: the objections I will actually get, ordered first by how likely they are and then by how much damage they would do, each attributed to the kind of person who will raise it and phrased in that person's idiom; for each, a reply I could give in about two minutes, what I should concede in it, what I should refuse to concede, and one line on where the reply is soft. Then: the single reply that has to land for the paper to survive at all; the weakest joint in my own four-step argument, which I should prepare to defend rather than hope the room misses; which of my two distinctions is genuinely load-bearing and which I could drop under pressure, and what dropping it would cost me; and the question I am hoping nobody asks, with why it is the dangerous one.

  Please do not restate my argument back to me and do not point me toward any literature.
reasoning: |-
  Okay, let's break this down. The user is prepping for a law-philosophy workshop defense of a provocative thesis about constitutional precommitment. The core tension is between "integrity locks" (protecting decision reliability) and "outcome locks" (freezing content), with the Ulysses metaphor framed as misleading. 

  First, assessing the audience dynamics: The 18-person group includes specialists who'll attack from different angles—constitutional lawyers testing real-world applicability, a formal theorist demanding game-theoretic rigor, deliberative democrats opposing any constraints, and an addiction ethicist challenging the psychology. Each requires tailored counters.

  For objection triage: The symmetry condition critique from deliberative democrats is both high-probability and high-damage. If they successfully argue that the test is either vacuous (framers always self-assess as symmetric) or smuggles in content, it unravels the whole integrity/outcome distinction. The formal modeler's challenge about trigger strategies is less existentially threatening but must be answered cleanly to maintain credibility.

  The user's non-negotiables: The "mast vs. preregistration" analogy must hold. If Ulysses contracts are fundamentally about overriding judgment rather than preserving accuracy, the constitutional analogy collapses. This is the hill to die on—concede that clinical Ulysses cases might involve value shifts, but insist that constitutions aren't about managing akrasia.

  Hidden vulnerabilities: Step 3's self-neutralization test feels fragile. What if framers design asymmetric provisions while sincerely believing them symmetric? The reply should stress that institutional design (e.g. supermajority rules) creates objective symmetry, not subjective intent. Still, this might not satisfy the lawyers demanding concrete examples.

  The nightmare question: Someone asking why future generations should care about procedural integrity if they reject the framers' entire political framework. This exposes a foundational tension—the theory assumes continuity of political community, which may not hold.
answer: |-
  Here are your prepared Q&A notes, structured for maximum defensive utility. Objections are ranked by likelihood/danger, with counters designed for 2-minute replies:

  **Top 4 Objections (High Probability/High Damage)**  
  1. **Deliberative Democrat (Symmetry Trap)**  
     *Objection:* "Your symmetry condition is either toothless (framers always *believe* they're symmetric) or hypocritical (you smuggle substantive values through 'corrupted procedure'). Both collapse into dead-hand rule."  
     - **Reply:** "Symmetry is institutional, not psychological: It requires mechanisms that *operationally* constrain all coalitions equally (e.g., supermajority rules apply identically to repeal/replace). What I 'smuggle' is not values but the minimal procedural baseline for *any* collective reasoning—like requiring blind review in peer critique."  
     - **Concede:** Ambiguity in "corruption" threshold exists.  
     - **Deny:** That procedural fairness presupposes contested substantive goods.  
     - **Soft Spot:** Defining "minimal baseline" without circularity.  

  2. **Constitutional Lawyer (Real-World Grip)**  
     *Objection:* "Does your test invalidate *any* entrenched right? If not, isn't this just post-hoc rationalization for your preferred design?"  
     - **Reply:** "It invalidates rights entrenched *asymmetricall*y—e.g., 1st Amendment styled as 'eternal truth' but electoral rules requiring renewal. See Norway’s constitutional review mandate vs. Turkey’s unamendable secularism clause. The test bites where sunset clauses/reaffirmation exist vs. unilateral binds."  
     - **Concede:** Many provisions mix integrity/outcome elements.  
     - **Deny:** That historical practice determines legitimacy.  
     - **Soft Spot:** Few constitutions meet your stylized criteria.  

  3. **Formal Political Scientist (Redundancy Critique)**  
     *Objection:* "Why call this 'integrity lock'? Repeated games achieve stability via trigger strategies without your moralized 'corruption' talk."  
     - **Reply:** "Trigger strategies stabilize *expectations*; integrity locks prevent *epistemic degradation*. The difference: A legislature credibly threatening to dissolve if norms break ≠ pre-registering analysis to avoid data-contamination. Only the latter targets *accuracy*, not equilibrium."  
     - **Concede:** Game theory models *can* formalize procedural corruption.  
     - **Deny:** That stability and epistemic integrity are identical goals.  
     - **Soft Spot:** Quantifying "degradation" distinct from preference shifts.  

  4. **Clinical Ethicist (Ulysses Misdescription)**  
     *Objection:* "Real Ulysses contracts handle *value shifts* (e.g., dementia directives), not judgment impairment. Your 'outcome lock' strawmans the model."  
     - **Reply:** "Agreed—but constitutional binds *aren't* value shifts: They freeze *intergenerational* decisions. The flaw is using Ulysses to justify overriding *future* rational agents (who may reject framers' values) when constitutions should only shield *how* decisions are made. Dementia directives confirm my point: They override *non-autonomous* agents."  
     - **Concede:** Clinical Ulysses contracts are more complex.  
     - **Deny:** That constitutions address analogous pathology.  
     - **Soft Spot:** Future majorities might view amendment rules as value-laden.  

  ---

  **Critical Reply for Paper Survival**  
  **The Symmetry Defense:** *If nothing else lands, hammer this:* "Without the symmetry condition, *all* precommitments become outcome locks. The test forces framers to design provisions they’d accept being bound by if *out of power*. That’s what separates self-government from hegemony—e.g., the 22nd Amendment (term limits) binds both parties equally."  

  **Weakest Joint: Step 2 (Preregistration Analogy)**  
  - **Vulnerability:** Constitutional framers *do* anticipate threats (tyranny, factionalism), blurring the "no content" claim.  
  - **Defense Prep:** Stress that preregistration targets *unknown* data biases—likewise, integrity locks target *unknown future threats* to deliberation (e.g., AI disinformation), not predefined outcomes like "no monarchy."  

  **Load-Bearing Distinction: Integrity vs. Outcome Locks**  
  - **Drop Under Pressure:** Weakness-of-will vs. corrupted-procedure distinction (Step 1).  
  - **Cost of Dropping:** Loses the psychology critique but preserves core claim if you reframe all "binding" as procedural.  

  **Nightmare Question**  
  *"If future generations reject the framers' entire political framework (e.g., revolution), why should they care about preserving 'reliable decision-making' defined by that framework? Doesn't this make integrity locks just politely packaged dead-hand rule?"*  
  - **Why Dangerous:** Unmasks the foundationalist dilemma. Your theory assumes continuity of political community, but legitimacy crises break that frame.  
  - **Mitigation Strategy:** "Even revolutionary refoundings precommit procedurally (e.g., Constitutional Convention rules). The alternative isn't freedom but arbitrary power—integrity locks minimize domination *within* any chosen system."  

  ---  
  **Delivery Notes:**  
  - Redirect "content" objections to the **self-neutralization test** ("Would the framers accept this binding *them*?").  
  - When pressed on rights, pivot to **reaffirmation mechanisms** ("Why entrench the 2nd Amendment eternally rather than require 75% renewal every 50 years?").  
  - For formal theorists, use **veil-of-ignorance framing**: "Design amendment rules not knowing if you'll be majority/minority."
