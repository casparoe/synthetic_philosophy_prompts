answer: |-
  ### Method Note: Enhanced Pairwise Prioritisation Procedure

  **Purpose**: This procedure ensures robust, transparent ranking of transport schemes by addressing pairwise comparison cycles, distinguishing between aggregation-induced and value-induced cycles, preventing phasing exploits, and enforcing explicit thresholds. The panel must complete all steps within two days.

  #### Procedure Steps

  **S1: Initial Pairwise Comparisons**  
  - **Question**: "For every unique pair of schemes, which is better? Provide a one-line reason citing specific dimensions (e.g., cost, safety, user reach)."  
  - **Sufficient Answer**: A complete matrix of all pairwise results (e.g., "A > B: lower cost").  
  - **On Failure**: If consensus fails for a pair, the Panel Chair decides.  
  - **Type**: Value (judgment-based).  

  **S2: Cycle Detection**  
  - **Question**: "Using the matrix, identify cycles (e.g., A>B, B>C, C>A)."  
  - **Sufficient Answer**: A list of all cycles (if any) or "No cycle found."  
  - **On Failure**: If cycles exist, proceed to S3. If no cycles, proceed to S5.  
  - **Type**: Factual (algorithmic check).  

  **S3: Cycle Classification**  
  - **Question**: "For each pairwise decision in the cycle: (a) List all dimensions used; (b) For each dimension, confirm if it is transitive in isolation (if A>B and B>C on one dimension, then A>C must hold)."  
  - **Sufficient Answer**: (a) Dimensions listed for all pairs; (b) Transitivity verified per dimension.  
  - **On Failure**: If dimensions are inconsistent across comparisons (e.g., safety used in A>B but ignored in B>C), classify as dimension shift. If all dimensions are transitive, classify as aggregation-induced. If any dimension is intransitive, classify as value-induced. If disputed, Panel Chair decides.  
  - **Type**: Mixed (factual for dimensions, value for transitivity).  

  **S4: Aggregation-Induced Cycle Resolution (Reweighting)**  
  - **Question**: "Assign weights (1–10) to all dimensions. Re-run all pairwise comparisons using only these weighted dimensions."  
  - **Sufficient Answer**: A revised pairwise matrix with weights applied.  
  - **On Failure**: If the cycle persists after reweighting, reclassify as value-induced and proceed to S6.  
  - **Type**: Value (weight assignment).  

  **S5: Final Ranking (No Cycle)**  
  - **Question**: "Generate a strict ranking from the pairwise matrix (e.g., via topological sort). Write a one-line public reason for each rank position."  
  - **Sufficient Answer**: A strict, ordered list (e.g., "1. Scheme X: Highest net benefit").  
  - **On Failure**: If ties occur, Panel Chair breaks them.  
  - **Type**: Factual (ordering).  

  **S6: Value-Induced Cycle Resolution (Threshold Setting)**  
  - **Question**: "For the intransitive dimension (e.g., ‘net benefit’), set a threshold where accumulated effects become significant (e.g., ‘costs > £1M’). Re-evaluate all cycle pairs using this threshold."  
  - **Sufficient Answer**: Threshold defined; pairwise outcomes revised.  
  - **On Failure**: If the cycle remains or the panel endorses all original steps, group the cycle schemes as tied. Assign the same rank and public reason: "Tied: Intransitive cycle in [dimension]; threshold = [value]."  
  - **Type**: Value (threshold choice).  

  **S7: Phasing Exploit Test**  
  - **Question**: "For every phased scheme: If approved (ranked above status quo), is the full scheme better than the status quo?"  
  - **Sufficient Answer**: "Yes" or "No" for each phased scheme.  
  - **On Failure**: If "No," reject the scheme. Public reason: "Rejected: Full scheme worse than status quo." If disputed, Panel Chair decides.  
  - **Type**: Value (holistic assessment).  

  **S8: Publish Output**  
