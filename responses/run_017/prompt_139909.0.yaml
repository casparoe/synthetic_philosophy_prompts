prompt: |-
  I teach political philosophy, and this term I am co-convening a small interdisciplinary reading group with a social psychologist who works on cross-cultural variation in the strength of norms: the now-familiar contrast between "tight" societies, where norms are dense, unambiguous and strictly enforced, and "loose" ones, where they are thinner and deviance is tolerated, together with her working hypothesis that a society's position on that spectrum tracks ecological and institutional threat. Last week the group came apart over a case we could not resolve, and I want to hand the members something better than the exchange we actually had.

  The case: one of our number is about to spend a semester at a university in a country whose academic and everyday norms are considerably stricter than ours — rigid forms of address, dress expectations, deference to seniority, tighter limits on what may be said in a seminar, and a strong presumption against contradicting a senior colleague in public. She said she intended to go on speaking and dressing more or less as she does here, and a colleague replied, with the air of closing the matter, that "when in Rome, do as the Romans do." I think that proverb was being made to carry a conclusion it does not obviously bear — that she is required, and not merely permitted, to conform, and required irrespective of whether she judges the local norms good — but I could not say in the room what premise would have to be added to get there, and I suspect the sentence is really several theses of very different weight stacked on top of one another.

  What I would like from you is a disambiguation, arranged as a menu I can put in front of the group, of the distinct precise claims the proverb might be expressing, ordered from the near-trivial to the genuinely radical, with a verdict on each: which is a platitude, which is substantive and defensible, which is contentious, and which is straightforwardly false. I have some candidate readings in mind and would be glad to have them sharpened or replaced — conformity as mere compliance with expected sanctions; conformity as uptake of a coordination convention, where an act simply fails to mean what the agent intends except against local conventions; conformity as epistemic deference to people who know local conditions and consequences better than a visitor does; conformity as acknowledgment of the authority or legitimacy of a normative order as such; and conformity as an expressive gesture of respect owed to a community one is joining as a guest. For each, I would want to know whether it yields only a prudential or etiquette-based reason, or something that can be called an obligation, and whether it would actually support the use to which the proverb was put. Three complications should be addressed as well, since they are where the argument seemed to me to bite. First, the self-application problem: in a genuinely permissive culture the operative local norm may be tolerance of deviance, so a proverb telling one to do as the locals do appears there to require nonconformity — and I want to know whether that is a fatal instability or merely a sign that the proverb has an implicit parameter for what kind of norm is in play. Second, the "which Rome" problem: whose norms count when a society is internally divided, and in particular whether there is an asymmetry whereby deviation registers strongly with the strict while conformity registers hardly at all with the permissive, so that the practical grain of the proverb always drifts toward its strictest available reading. Third, the abhorrent-Rome problem: whether any of the readings survives when what Rome requires is something our colleague takes to be unjust — for example staying silent while a senior colleague asserts something she believes to be false, or observing a gendered norm she regards as demeaning — and whether the proverb's plausibility in ordinary cases depends on a suppressed assumption that the local norms are not seriously unjust, or at least not more unjust than the alternatives. Finally, tell me which of these readings you take people to have in mind when they deploy the line in order to end an argument, and whether that reading is one they should be willing to defend.
reasoning: |-
  Okay, the user is teaching political philosophy and co-running a reading group with a social psychologist focusing on tight vs. loose societies. The group got stuck on a case where a colleague is moving to a stricter academic environment and plans not to conform to local norms. Another colleague shut down discussion with "when in Rome, do as the Romans do," which the user feels oversimplifies the issue. They want a breakdown of possible interpretations of that proverb, sorted from obvious to radical, with evaluations.

  First, I need to unpack the proverb into distinct philosophical claims. The user mentioned several candidate readings: compliance to avoid sanctions, coordination conventions, epistemic deference, legitimacy of norms, and expressive respect. Each needs analysis for whether it creates mere prudence or actual obligation, and if it supports the original argument.

  The self-application problem is interesting. In a loose society, the local norm might be tolerance, so conforming could mean being nonconformist. Is this a fatal flaw? Probably not—it just shows the proverb depends on context. The "which Rome" issue arises in divided societies. If strict enforcers react strongly to deviation while tolerant people don't care about conformity, the proverb might default to stricter norms. That's a practical asymmetry worth noting.

  Then there's the abhorrent-Rome scenario. If local norms are unjust, does the proverb still hold? The user gave examples like staying silent against false statements or enforcing gendered norms. Some interpretations might collapse here, especially those based on legitimacy. The proverb likely assumes norms aren't seriously unjust, which is a hidden premise.

  The user also wants to know which version people really mean when they use the proverb to end arguments. Probably it's a mix of prudential and etiquette-based reasons, but presented as a moral obligation. That's worth calling out. 

  I should structure the readings from least to most demanding. Start with the trivial (avoiding sanctions), then coordination, epistemic deference, expressive respect, and finally norm legitimacy. Each should be evaluated for plausibility and obligation strength. Addressing the three complications for each will show where they hold or fail. 

  For the verdicts, the first two readings are defensible but not obligations. Epistemic deference is moderate but context-dependent. Expressive respect is stronger but contentious. Legitimacy is radical and often false. The shutting-down-the-argument version is likely a mashup of weaker claims, which wouldn't withstand scrutiny if challenged. Highlighting that could help the group see why the original reply was inadequate.
answer: |-
  Here is a disambiguation of "When in Rome, do as the Romans do," structured as a menu of distinct claims, ordered from least to most demanding, with verdicts and responses to your complications. Each reading is assessed for its normative force (prudential/etiquette vs. obligation) and applicability to the case.

  ---

  ### **The Menu of Interpretations**

  #### **1. The Compliance Reading (Avoidance of Sanctions)**  
  *"Conform to avoid negative consequences (social censure, professional penalties, legal trouble)."*  
  - **Verdict:** **Platitude** (trivially true, but normatively shallow).  
  - **Normative Force:** Prudential *only*. No moral obligation implied.  
  - **Supports the Proverb's Use?** Yes, but weakly. It justifies *instrumental* conformity, not moral duty.  
  - **Self-Application Problem:** Stable. In a "loose" Rome, avoiding sanctions might require nonconformity (e.g., ignoring a norm demanding conformity).  
  - **"Which Rome?" Problem:** Favors the *enforcers'* interpretation (they control sanctions).  
  - **Abhorrent Rome:** Collapses if sanctions are unjust (e.g., conforming to apartheid). Sanction-avoidance may still be prudent but carries no moral weight.  

  #### **2. The Coordination Convention Reading (Effective Communication)**  
  *"Conform because local conventions give acts their social meaning (e.g., dress/formality signals respect). Nonconformity may cause miscommunication."*  
  - **Verdict:** **Defensible and widely applicable** (rooted in social ontology).  
  - **Normative Force:** Prudential/social obligation (to avoid miscoordination). Weak moral pull if harmony is valued.  
  - **Supports the Proverb's Use?** Partially. It explains *why* norms exist but doesn’t mandate adherence to *unjust* conventions.  
  - **Self-Application Problem:** Stable. In a "loose" Rome, the convention may *be* tolerance.  
  - **"Which Rome?" Problem:** Ambiguous. Conventions vary by subculture (e.g., senior faculty vs. students).  
  - **Abhorrent Rome:** Fails if the convention upholds injustice (e.g., gendered address reinforcing hierarchy).  

  #### **3. Epistemic Deference Reading (Local Knowledge)**  
  *"Conform because locals better understand the consequences of actions in their context (e.g., challenging a senior colleague may cause unintended harm)."*  
  - **Verdict:** **Substantive and contextually defensible**.  
  - **Normative Force:** Prudential obligation with moral overtones (if avoiding harm is a duty).  
  - **Supports the Proverb's Use?** Yes, if local knowledge is relevant (e.g., nuanced power dynamics). Less so for norms without functional justification (e.g., arbitrary dress codes).  
  - **Self-Application Problem:** Stable. In "loose" Rome, deference might mean tolerating deviance.  
  - **"Which Rome?" Problem:** Favors the *dominant* epistemic community (often the strict).  
  - **Abhorrent Rome:** Fails if locals are wrong/unjust (e.g., "silence preserves harmony" enabling oppression).  

  #### **4. Expressive Respect Reading (Communal Reciprocity)**  
  *"Conform as a gesture of respect to hosts, acknowledging their hospitality and cultural autonomy."*  
  - **Verdict:** **Contentious but plausible** (draws on ethics of hospitality/virtue).  
  - **Normative Force:** Moral obligation (of reciprocity/respect), distinct from prudence.  
  - **Supports the Proverb's Use?** Strongly for etiquette norms (dress/address). Weak for substantive norms (censoring truth).  
  - **Self-Application Problem:** Stable. Respect in a "loose" Rome may require adopting *their* tolerance.  
  - **"Which Rome?" Problem:** Respect is owed to the *community*, but which faction embodies it? Ambiguous.  
  - **Abhorrent Rome:** **Collapses**. Respect cannot demand complicity in injustice (e.g., demeaning gendered norms).  

  #### **5. Normative Authority Reading (Legitimacy of Local Order)**  
  *"Conform because the local normative order has legitimate authority over visitors."*  
  - **Verdict:** **Radical and generally false** (except for trivial norms).  
  - **Normative Force:** Purported moral obligation (like political obligation).  
  - **Supports the Proverb's Use?** Only if one accepts the host community’s sovereignty over moral conduct—rarely defensible.  
  - **Self-Application Problem:** Unstable. If "loose" Rome’s norm is *anti-authority*, this reading self-destructs.  
  - **"Which Rome?" Problem:** Favors institutionalized/dominant norms (the "strict").  
  - **Abhorrent Rome:** **Catastrophic**. Legitimizes oppression.  

  ---

  ### **Addressing the Complications**  
  1. **Self-Application**: Not fatal. The proverb is *parametric*—it requires identifying *which* norms are operative. In loose societies, the norm is often tolerance, so conformity = nonconformity to strictness.  
  2. **"Which Rome?"**: Asymmetry exists. Strict enforcers *notice* deviance; the permissive rarely police conformity. Thus, the proverb *functionally* pressures compliance with the strictest interpretation.  
  3. **Abhorrent Rome**: The proverb’s intuitive plausibility **depends on a suppressed premise**: *Local norms are reasonably just or harmless*. Without this, only Readings 1–3 retain limited force (prudence/coordination), but never override moral duties.  

  ---

  ### **What People Mean When Deploying the Proverb to End an Argument**  
  - **Likely Blend**: Readings 1 (prudence), 3 (deference), and 4 (respect), *presented* as Reading 5 (authority) for rhetorical closure.  
  - **Should They Defend It?** No. This conflation is intellectually dishonest:  
    - It masks the distinction between *prudence* ("you’ll regret it") and *morality* ("you must").  
    - It ignores context (e.g., injustice) and assumes local norms are benign.  
    - In your case, it sidestepped the core question: *When, if ever, is deviation morally required?*  

  ---

  ### **Recommendation for Your Group**  
  Provide this menu as a handout, framing the unresolved case around three questions:  
  1. *Which interpretation(s) make "when in Rome" a moral obligation?*  
  2. *Do any survive the "Abhorrent Rome" test?*  
  3. *Does the functional asymmetry ("Which Rome?") undermine the proverb’s use in mixed societies?*  

  This exposes why "when in Rome" failed as a conversation-ender: it’s a placeholder for unresolved premises about authority, harm, and cultural reciprocity. The social psychologist might then weigh in on how *empirical* tightness (threat-derived) interacts with *normative* obligations—a bridge to your joint inquiry.
