answer: |-
  ### Mark: 16/25  
  **Breakdown:**  
  - Situationist critique: **6/6**  
  - Bandwidth/cost-tolerance distinction & sorting: **4/8**  
  - Critical assessment of reply: **6/11**  

  ---

  ### Margin Comments (Keyed to Specific Sentences)  

  1. **"But every study above is a case of the first, Milgram included. [...] nothing there turns on cost."**  
     - **Problem:** Misrepresents Milgram. Physical proximity *creates* cost (social discomfort, confrontation risk) — proximity conditions *are* cost-tolerance tests. Fails to engage with the empirical reality that resisting authority *is* costly.  
     - **Mark loss:** -2 (Bandwidth/cost-tolerance sorting)  
     - **Tag:** DEFINITE (Misreads experimental design. Milgram’s variations explicitly manipulate social/emotional cost.)  

  2. **"cost-tolerance failure, examined closely, is just bandwidth failure under another description"**  
     - **Problem:** Collapses the distinction instead of applying it. The rubric *requires* sorting studies into both categories (per Q3a). This evasion ignores that cost-tolerance tests *specific* robustness (endurance under pressure), distinct from irrelevant situational noise.  
     - **Mark loss:** -2 (Bandwidth/cost-tolerance sorting)  
     - **Tag:** DEFINITE (Failure to execute the task as set. Distinction exists to categorize *evidence*, not to be deconstructed prematurely.)  

  3. **"The situationist evidence is all of one kind, and one reply should be able to handle all of it."**  
     - **Problem:** Dismisses cost-tolerance as a category without argument. Doris *explicitly* uses high-cost scenarios (e.g., Holocaust rescuers vs. bystanders) to challenge virtue ethics. Ignoring this oversimplifies the critique.  
     - **Mark loss:** -2 (Bandwidth/cost-tolerance sorting)  
     - **Tag:** DEFINITE (Contradicts lecture’s claim that "most cited studies" are bandwidth-focused — implying cost-tolerance *exists* and matters.)  

  4. **"The reply I'd defend is what I'll call the scaffolding reply [...] they confirm its sociological claim"**  
     - **Problem:** Strong setup, but never tests *limits*. Does scaffolding explain why identically situated individuals differ (e.g., seminarians in same hurry)? Or why *minor* frictions (dime study) sway behavior? Scaffolding assumes institutions fix "noise," but doesn’t address agents’ *internal* fragility.  
     - **Mark loss:** -3 (Critical assessment)  
     - **Tag:** CONTESTED (But loses marks for not "honestly testing what [reply] can’t handle" per rubric. Doris grants scaffolding but argues it *still* doesn’t save *global traits*.)  

  5. **"all it would show is that virtue is rare [...] not about the theory"**  
     - **Problem:** Ignores situationism’s *metaphysical* challenge: if virtues are empirically undetectable even in "good" environments (per dime study), can they be real? Virtue ethics requires traits to be *psychologically plausible*, not just ideals.  
     - **Mark loss:** -2 (Critical assessment)  
     - **Tag:** READING (Uncharitable: Student treats rarity as sufficient defense. I read Doris charitably: he attacks the *existence* of robust traits, not distribution. Weakens reply’s force.)  

  6. **"I take [aggregation] to change the subject"**  
     - **Problem:** Dismisses a major virtue-ethical counterargument without engagement. Aggregation *directly* answers whether single-trial studies (e.g., Good Samaritan) refute traits. Ignoring this misses a chance to strengthen the scaffolding reply.  
     - **Mark loss:** -1 (Critical assessment)  
     - **Tag:** CONTESTED (But loses a mark for not addressing a core debate. Scaffolding + aggregation could be complementary.)  

  ---

  ### To Earn Lost Marks  
  - **Bandwidth/cost-tolerance (lost 4 marks):** Sort studies per the distinction (e.g., Milgram proximity = cost-tolerance; phone-booth dime = bandwidth) *before* critiquing it.  
  - **Critical assessment (lost 5 marks):** Test the scaffolding reply against *unresolved* cases (e.g., why dime-finders help more despite identical institutions? Can virtue exist without perfect scaffolding?).  

  ### Strongest Move  
  **"Virtue ethics has never been only a theory of individual psychology... they tell us which features of an environment do the damage."**  
  - Insightfully links Aristotle’s institutional focus to situationism’s data — turns the critique into a *diagnostic tool* for virtue-ethical reform.  

  ---

  **Note on Citations:** Reconstructed Harman/Doris from memory (no text check). Doris *does* separate high-cost (e.g., Holocaust) from low-cost (e.g., dime) cases, and attacks global traits *even if* scaffolding exists.
