answer: |-
  Below is the distilled set of desiderata for a theory of what is lost when a perfect substitute replaces an original, tailored to your specified purposes: guiding institutional decisions (acquisition, conservation, insurance, display of facsimiles) and evaluating the rationality of individual attachment upon discovering a forgery. I derived these from a systematic analysis of your cases, with requirements pruned to only those doing essential work—removing redundancies, vague intuitions, or concepts subsumed by others. Requirements are categorized into aesthetic/experiential, art-historical, and scarcity/economic registers, and each is marked as non-negotiable (NN) or a preference for one camp (institutional or individual). Conflicts and knockout requirements are flagged.

  I tabooed "authentic" throughout. Instead, I define key concepts like **historical trace** (physical-causal continuity from creation), **causal origin** (connection to the artist's generative act), and **scarcity** (non-replicability). The word "better" in ordinary claims about originals typically tracks **scarcity/economic** value (e.g., "the original is better" often means "more valuable due to rarity"), but it can ambiguously reference art-historical or experiential factors depending on context.

  Your candidate desideratum—**explaining why destruction of an unseen original (Case H) is a loss**—is a genuine constraint, not a prejudice. It is motivated by institutional conservation ethics (museums must preserve cultural heritage regardless of viewership) and knocks out theories that reduce value to immediate experience or substitutable function (e.g., strict aesthetic empiricism or functionalism).

  ---

  ### **Desiderata for an Adequate Theory**
  *Each requirement includes: (1) the case(s) motivating it, (2) NN/preference status, (3) purpose(s) served, (4) notes on genuine constraints vs. prejudices.*

  1. **Historical Trace (Art-Historical)**  
     - *Definition*: The object's unbroken physical-causal history from creation to present, including material alterations and provenance.  
     - *Motivation*: Case A (secret swap breaks the trace, even if the duplicate is identical); Case H (destruction destroys the trace, making replacement inadequate); Case C (reattribution doesn't alter the trace, but perception shifts).  
     - *Status*: NN for institutions (required for conservation triage and insurance); preference for individuals (if they value the object's "biography").  
     - *Purpose*: Primarily institutional, but relevant to individuals with historical attachment.  
     - *Constraint/Prejudice*: Genuine constraint for institutions (provenance is foundational); a prejudice if overgeneralized to individuals who don't care about history.  

  2. **Causal Origin (Art-Historical)**  
     - *Definition*: The object's direct causal link to the artist's creative act (e.g., execution, supervision, or explicit delegation).  
     - *Motivation*: Case B (underdrawing by master vs. paint by pupils—value hinges on degree of artist involvement); Case D (artist's copy has origin link but lacks historical trace of original); Case E (instructions + certificate prioritize origin of concept over execution); Case G (uncertainty undermines origin claims).  
     - *Status*: NN for institutions (governs deaccession and reattribution); NN for individuals if attachment is artist-focused.  
     - *Purpose*: Both (institutions for attribution; individuals for rationalizing artist-based bonds).  
     - *Constraint/Prejudice*: Genuine constraint, as art history relies on authorship; prejudice if equated with "genius" in contexts like Case E (conceptual art).  

  3. **Aesthetic Experience Robustness (Aesthetic/Experiential)**  
     - *Definition*: The experience's invariance to perfect substitution when perceptual properties are identical.  
     - *Motivation*: Case A (no experiential difference post-swap); Case D (artist's copy may induce identical experience); Case H (replacement provides same experience).  
     - *Status*: Preference for individuals (if experience is their sole focus); not NN for institutions (which prioritize non-experiential factors).  
     - *Purpose*: Primarily individual (to assess if caring about substitution is irrational when experience is unchanged).  
     - *Constraint/Prejudice*: Genuine constraint for experiential theories; prejudice if used to dismiss historical/scarcity factors.  

  4. **Scarcity (Economic)**  
     - *Definition*: Non-replicability conferring market value, distinct from perceptual or historical properties.  
     - *Motivation*: Case A (duplicate lacks scarcity, reducing value); Case F (byte-identical files derive scarcity from transaction records); Case C (reattribution diminishes scarcity by demoting artist status).  
     - *Status*: NN for institutions (impacts budgets, insurance, and acquisition); preference for investment-minded individuals.  
     - *Purpose*: Institutional (economic decisions); secondary for individuals (if collecting for financial gain).  
     - *Constraint/Prejudice*: Genuine constraint in art markets; prejudice if inflated to override other values (e.g., in Case H, destruction may not affect scarcity if replacement is undetected).  

  5. **Rational Attachment (Individual Psychology)**  
     - *Definition*: Justification for caring about substitution based on the individual's beliefs/values (e.g., history, origin, or symbolism).  
     - *Motivation*: Case A (is it rational to feel betrayed after decades of loving a forgery?); Case C (does reattribution rationally alter attachment if the object is unchanged?).  
     - *Status*: NN for the individual purpose (core to evaluating emotional responses).  
     - *Purpose*: Solely individual.  
     - *Constraint/Prejudice*: Genuine constraint, as theories must accommodate diverse psychological bases; prejudice if biased toward "objective" value.  

  6. **Conservation Obligation (Institutional Ethics)**  
     - *Definition*: Duty to preserve objects for future access or symbolic heritage, independent of current use.  
     - *Motivation*: Case H (unseen destruction is a loss, demanding conservation resources); Case B (prioritizing conservation of master's underdrawing over pupils' paint).  
     - *Status*: NN for institutions (foundational for deaccession and triage); irrelevant to individuals.  
     - *Purpose*: Institutional.  
     - *Constraint/Prejudice*: Genuine constraint in museology; prejudice if applied to individuals.  

  ---

  ### **Conflicts and Knockout Requirements**
  - **Inherent Conflict**: **Aesthetic Experience Robustness** clashes with **Historical Trace** and **Causal Origin**. If experience is unchanged by substitution (Case A), why should institutions/individuals care about trace or origin? Resolving this requires explaining how knowledge alters experience (e.g., via **Rational Attachment**) or prioritizing non-experiential values.  
  - **Knockout Requirement**: **Conservation Obligation** eliminates theories that cannot explain Case H's loss (e.g., aesthetic empiricism, functionalism, or scarcity-only views). It is the most discriminating desideratum, as popular theories often ignore institutional ethics.  

  ---

  ### **Analysis of Your Candidate Desideratum**
  - **Why Case H's destruction is a loss**: A theory must explain this to satisfy institutional ethics (**Conservation Obligation**) and art-historical continuity (**Historical Trace**). Loss stems from:  
    - Irreversible destruction of the trace, severing a unique link to the past.  
    - Violation of the institution's duty as a cultural steward.  
  - **Theories that fail this**:  
    - *Strict aesthetic empiricism* (value = experience; no loss if replacement identical).  
    - *Scarcity-focused theories* (no loss if replacement preserves market value).  
    - *Functionalism* (no loss if artwork's "role" is maintained).  

  ---

  ### **Scorecard of Theory Contenders**
  Evaluated against pruned desiderata (✔ = fully satisfies, ✖ = fails, ~ = partially satisfies):

  | Theory                  | Historical Trace | Causal Origin | Aesthetic Robustness | Scarcity | Rational Attachment | Conservation Obligation | Verdict                                                                 |
  |-------------------------|------------------|---------------|----------------------|----------|---------------------|--------------------------|-------------------------------------------------------------------------|
  | **Aesthetic Empiricism** (Value = experience) | ✖               | ✖            | ✔                   | ✖        | ~ (if experience unchanged) | ✖                        | Fails institutions (ignores history/ethics); weak for individuals.     |
  | **Historical Relationalism** (Value = trace + origin) | ✔               | ✔            | ✖ (knowledge alters experience) | ~ (derivative) | ✔ (if history valued) | ✔                        | Best for institutions; explains individual attachment if history matters. |
  | **Institutional Scarcity** (Value = provenance + market) | ~ (as evidence) | ~ (as evidence) | ✖                   | ✔        | ✖                   | ~ (if profitable)        | Good for institutional economics; fails ethics and individual psychology. |

  **Strongest Contender**: Historical Relationalism, as it directly addresses **Historical Trace**, **Causal Origin**, and **Conservation Obligation**, while accommodating **Rational Attachment** via trace/origin significance. It struggles with **Aesthetic Experience Robustness** but can integrate it through contextual knowledge.

  **Weakest Contender**: Aesthetic Empiricism, dismissed by **Conservation Obligation** and inadequate for institutional needs.

  ---

  This framework provides a rigorous, purpose-specific basis for evaluating theories. For your post, I recommend using the cases to stress-test each desideratum, highlighting how **Conservation Obligation** and **Rational Attachment** prevent reductionist approaches.
