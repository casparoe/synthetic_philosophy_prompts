  1. **Case A (Secret Swap)**: A molecule-for-molecule duplicate of a unique painting secretly swapped into its frame forty years ago and admired ever since.
  2. **Case B (Studio Work)**: A canvas whose underdrawing is by the master but whose paint layer is mostly by pupils working from his designs, catalogued as his for three centuries.
  3. **Case C (Reattribution)**: A genuine work demoted to a pupil after reattribution, with the object and its actual history unchanged.
  4. **Case D (Artist's Copy)**: A painter who repaints an exact copy of her own destroyed painting.
  5. **Case E (Instructional Art)**: A piece that is just instructions plus a certificate, executed by whoever holds it (like some conceptual art).
  6. **Case F (Digital File)**: A file whose copies are byte-identical, where only the transaction record differs.
  7. **Case G (Found Canvas)**: A found canvas with no documentation that stylometry puts at high but not certain probability of being by a known hand.
  8. **Case H (Backroom Destruction)**: Destruction of an original in storage that nobody would ever have seen again, with an indistinguishable replacement installed the same day.

  We brainstorm requirements by considering what matters in these cases for both institutional and individual perspectives.

  #### Candidate Requirements:

  1. **Requirement: Historical Continuity (Art-Historical)**  
     *Motivation*: In Case A, the swap breaks the physical continuity from the time of creation. In Case C, reattribution changes the historical narrative but the object's physical history is unchanged. For an institution, the object's history (provenance, chain of custody) is crucial for valuation and scholarship. For an individual, if they value the connection to the past, the break might matter.  
     *Case H*: The destruction breaks the historical continuity of the original, even if no one sees it.  
     *Non-negotiable for institutions?*: Probably, because museums are custodians of history.  
     *Purpose*: Both, but especially institutional.

