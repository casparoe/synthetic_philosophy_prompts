  We must taboo the word "authentic" except in definitions. We are to consider several cases and derive requirements from them. We'll separate the requirements into aesthetic/experiential, art-historical, and scarcity/economic registers. We will also note when a requirement is non-negotiable or a preference, and which purpose it serves.

