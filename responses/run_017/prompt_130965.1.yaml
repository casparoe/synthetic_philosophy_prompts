  2. **Causal Origin** (art-historical, essential for attribution)
  3. **Aesthetic Experience** (aesthetic, central for individuals and display)
  4. **Scarcity** (economic, for market and institutional resources)
  5. **Rational Care** (individual psychology, to explain personal attachment)
  6. **Conservation Ethics** (institutional, to explain the duty to preserve)

