prompt: |-
  Hi — odd one, hope this is the right place. I write novels (literary-ish, one previous book, not sf, but the new one has a metaphysical spine) and I'm about 60k words into a book that turns on a gimmick I want to get right, or at least right enough that someone with a philosophy degree doesn't throw it across the room.

  The setup: there's another world — I call it the Overspill — which is a perfect duplicate of ours particular-fact by particular-fact. Same particles, same trajectories, same everything in the Humean mosaic. But the laws are different: in the Overspill the laws are, I dunno, one revision behind, or there's an extra force term that happens to cancel out everywhere so nothing actually comes out different. My understanding from reading around is that this is the clean dividing line between the two camps: the Humean says my world is impossible or incoherent, because the laws supervene on the mosaic and same mosaic means same laws; the anti-Humean (the Armstrong/Dretske/Tooley sort) says fine, no problem, because laws are relations among universals that *govern* the events instead of merely summarising them.

  So here's what I've been putting on the page. If the Overspill's laws govern its events rather than just describe them, they must be doing something extra, so I've been writing them as an additional pressure on things — I call it nomic drag: objects visibly strain as they fall, water seems to hesitate before it boils, my protagonist can feel the laws pressing on her, and in the climax she manages, barely, once, to break one. Governing is what a government does, after all, and you can defy a government.

  Where I need you: is that a fair picture of what the anti-Humean is committed to? Given that the two worlds are mosaic-identical, how much of the disagreement could a character inside one of them actually perceive — is the difference the sort of thing that shows up in experience at all, or is it purely modal? And if it's purely modal, is there any version of this debate, or any third position (genuinely local or patchy laws, laws contingent in some stronger sense, whatever exists), on which my nomic drag and my one broken law are things that could happen and be felt? Please be straight with me about which bits of my setup are just confused — I'd rather hear it now than after copy-edit.

