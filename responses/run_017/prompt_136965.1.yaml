answer: |-
  Below is a taxonomy for your reading group, designed as a decision tree with **seven branch questions** (concrete claims/cases) and **nine leaves** (theoretical positions). Each branch is a binary claim phrased to be endorsed/rejected without prior knowledge of the taxonomy. The tree is built from your specified distinctions:  
  1. Algorithmic vs. computational-level claims.  
  2. Retrieval of stored episodes vs. construction.  
  3. What gets mapped (structured relations, learned similarity, or sensorimotor schemas).  
  4. Scope of analogy (verbal fluency vs. category reorganization, source-free transfer).  

  The double dissociation case is integrated as a branch, and empty regions are marked. Two leaves (Deflationary View and Strong Identity Thesis) cannot be fully separated by the tree due to their computational-level focus.  

  ---

  ### **Taxonomy Decision Tree**  
  *Start at Branch 1 and follow answers to reach a leaf.*  

  1. **Branch 1 (Level of Explanation)**:  
     *Claim:* "The thesis ‘analogy is the core of cognition’ must describe cognitive *algorithms* (how the mind works), not just *what* the mind computes (inputs/outputs)."  
     - **Yes** → Go to Branch 2.  
     - **No** (only computational level) → Go to Branch 5.  

  2. **Branch 2 (Retrieval vs. Construction)**:  
     *Claim:* "Analogical mapping requires retrieving a *specific stored episode* (e.g., recalling a past event)."  
     - **Yes** → Go to Branch 3.  
     - **No** (constructs novel sources) → Go to Branch 4.  

  3. **Branch 3 (Structured Relations)**:  
     *Claim:* "Analogy transfers explicit structured relations with role bindings (e.g., ‘A is to B as C is to D’)."  
     - **Yes** → **Leaf: Structure-Mapping Engine (SME)**.  
       - *Description:* Analogy as a derived operation over symbolic representations (e.g., Gentner’s SME). Rejects sensorimotor/statistical mapping. Requires explicit retrieval.  
       - *Source-free transfer?* Rejects.  
       - *Scope:* Reorganization possible but not necessary; verbal fluency sufficient.  
     - **No** → **Leaf: Case-Based Reasoning (CBR)**.  
       - *Description:* Retrieves concrete episodes (e.g., legal precedents) but maps via learned similarity, not explicit roles.  
       - *Source-free transfer?* Rejects.  
       - *Scope:* Reorganization optional; weak on cross-domain transfer.  

  4. **Branch 4 (Non-Symbolic Mapping)**:  
     *Claim:* "Analogy transfers *sensorimotor schemas* (e.g., bodily experiences like ‘grasping an idea’)."  
     - **Yes** → **Leaf: Embodied Metaphor (EM)**.  
       - *Description:* Analogy as activation of embodied schemas (e.g., Lakoff/Johnson). Constructs novel sources via sensorimotor patterns.  
       - *Source-free transfer?* Endorses (schemas generalize episodes).  
       - *Scope:* Requires reorganization (e.g., metaphors reshape categories).  
     - **No** → **Leaf: Bayesian/Predictive Processing (BPP)**.  
       - *Description:* Analogy as a symptom of structure learning. Maps statistical similarities in latent spaces (e.g., predictive coding).  
       - *Source-free transfer?* Endorses (emergent from probabilistic inference).  
       - *Scope:* Reorganization is the core; verbal fluency is superficial.  

  5. **Branch 5 (Deflationary Check)**:  
     *Claim:* "Analogy is not a single ‘natural kind’ but a label for unrelated mechanisms."  
     - **Yes** → **Leaf: Deflationary View (DV)**.  
       - *Description:* No unified core (e.g., exemplar vs. rule-based systems). Rejects identity thesis.  
       - *Double dissociation:* Explains both subjects (A/B) via distinct mechanisms.  
     - **No** → Go to Branch 6.  

  6. **Branch 6 (Categorization Identity)**:  
     *Claim:* "Categorizing an object *just is* retrieving an analogous stored example."  
     - **Yes** → **Leaf: Strong Identity Thesis (SIT)**.  
       - *Description:* Categorization ≡ analogy. Compatible with algorithmic/computational levels.  
       - *Double dissociation:* Subject A (within-domain) has analogy; Subject B is hyper-analogical.  
     - **No** → Go to Branch 7.  

  7. **Branch 7 (Cross-Domain Necessity)**:  
     *Claim:* "A person who excels at cross-domain mapping (e.g., poetry→physics) but mislabels objects is doing ‘core’ analogy; one with rigid categories but no cross-domain transfer is not."  
     - **Yes** → **Leaf: Cross-Domain Transfer as Core (CDT)**.  
       - *Description:* Analogy defined by cross-domain structure-mapping (e.g., Hofstadter). Subject B (unstable categories) exemplifies core analogy.  
       - *Source-free?* Endorses (emergent abstraction).  
     - **No** → **Leaf: Within-Domain Analogy as Core (WDA)**.  
       - *Description:* Analogy requires stable categories. Subject A (no cross-domain transfer) exemplifies core analogy; Subject B is dysfunctional.  
       - *Source-free?* Rejects (nears retrievable episodes).  

  ---

  ### **Additional Leaf**  
  - **Leaf: Behaviorist Illusion (BI)**  
    - *Reached via: Branch 2 → No → Branch 4 → No → Branch 4 extension (automatic from BPP/BI split).*  
    - *Description:* Systems (e.g., deep neural nets) pass analogy tests via statistical pattern-matching, not internal analogy. Implies human analogy may also be an illusion at the algorithmic level.  
    - *Commitment about us:* If humans behave "as if" analogizing but use non-analogical algorithms, the thesis is false.  

  ---

  ### **Empty Regions & Notes**  
  1. **Empty: Algorithmic + Retrieval + Non-Structured Mapping**  
     - *Path:* Branch 1 (Yes) → Branch 2 (Yes) → Branch 3 (No).  
     - *Why:* Unattractive. Retrieval implies discrete episodes, but non-structured mapping (e.g., statistics) favors construction. No theories propose this hybrid.  

  2. **Empty: Computational-Level + Structured Relations**  
     - *Path:* Branch 1 (No) → Branch 5 (No) → Branch 6 (No) → [Structured relations not asked].  
     - *Why:* Unclaimed. Structured relations require algorithmic commitments (e.g., role bindings). Computational-level theories (SIT, DV) avoid this.  

  3. **Double Dissociation Case**:  
     - **Subject A**: Reliable within-domain categorization, no cross-domain transfer → Aligns with WDA/CBR.  
     - **Subject B**: Exuberant cross-domain mapping, unstable categories → Aligns with CDT/EM.  
     - Integrated in Branches 6/7 and leaves (WDA, CDT).  

  4. **Indistinguishable Leaves**:  
     - **Deflationary View (DV)** and **Strong Identity Thesis (SIT)** both occupy computational-level paths and cannot be separated by algorithmic distinctions (Branch 1 → No). They share a "computational only" space but diverge on unity (DV rejects it; SIT requires it).  

  ---

  ### **Summary of Leaves**  
  1. **Structure-Mapping Engine (SME)**  
  2. **Case-Based Reasoning (CBR)**  
  3. **Embodied Metaphor (EM)**  
  4. **Bayesian/Predictive Processing (BPP)**  
  5. **Deflationary View (DV)**  
  6. **Strong Identity Thesis (SIT)**  
  7. **Cross-Domain Transfer as Core (CDT)**  
  8. **Within-Domain Analogy as Core (WDA)**  
  9. **Behaviorist Illusion (BI)**  

  This tree isolates key disputes (e.g., Branch 7 forces choice on the double dissociation), covers your required distinctions, and flags unfilled/unpopular positions. Use it to anchor debates in concrete claims, avoiding label wars.
