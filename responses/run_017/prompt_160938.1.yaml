prompt: |-
  Hey — I'm taking a formal epistemology seminar this term and I have to lock in a topic for a ~5000-word term paper by the end of next week, and I keep circling the same thing: whether the "presumption of independence" can actually be formalized, or whether it's several different things that happen to wear one name. My supervisor leans the second way and thinks a paper on it would be a category error, but she also said she'll back whichever angle I can actually defend, so I need to commit to one instead of hedging.

  Here's roughly where I've got to. Three candidate formalizations:

  (1) Ignorance / max-entropy: independence is what falls out when you maximize entropy subject to knowing only the marginals, so "no reason to think they're correlated" gets cashed out as "no information beyond the marginals." Worries I have: it's relative to how you carve up the space, and it isn't invariant under recoding — X independent of Y doesn't give you X independent of X+Y.

  (2) Structural / causal: independence is a claim about the causal graph, the causal Markov condition, screening off; the real "presumption" is then a presumption of causal sparsity, not of ignorance. But it doesn't seem to give me anything when I don't know the graph, which is exactly the case I care about.

  (3) Algorithmic: two things are independent when describing both together costs about as much as describing each separately. This one I know almost nothing about formally.

  Why I think it matters: I worked out the variance of a sum of n equally-variable quantities with a common pairwise correlation rho and got n·v·(1 + (n−1)rho) versus n·v if you assume independence, so the mistake scales like n·rho — for big aggregations even a correlation too small to ever detect empirically dominates the answer. Independence defaults seem to silently decide whether large conjunctions and aggregates are sane at all. And as I remember it, the Cramér random model for the primes — treat primality of each number as independent with probability about 1/log n — gets a lot right and then gives wrong answers about primes in very short intervals, which looks like the presumption being licensed at one scale and not another. That's the kind of thing I'd want a formalization to explain rather than just describe.

  Constraints: about 14 weeks, 5000 words, armchair only — no data, no experiments. I'm fine with probability and Bayes, I did one logic course, but I've never properly done causal inference and I know essentially no algorithmic information theory.

  So: rank the three (or tell me I've carved it up wrong and propose a better fourth) and name the one I should actually write. I want the reasoning more than the list — what your criteria are (how upstream each question is of the others, whether it's tractable in 14 weeks for someone with my background, how much genuinely undefended low-hanging fruit is left in it, and whether an answer would change how people doing risk aggregation or forecasting actually proceed), how you're trading those criteria off against each other, and what evidence would move something up or down. Please commit: pick one, defend it, don't just lay out the options and leave me to choose. And if you think my supervisor is right that the whole project is a category error, say that instead and tell me what paper I should write in its place. Also give me a rough confidence level on your ranking and a sentence on what would most change your mind.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're in a formal epistemology seminar and need to pick a term paper topic. The central issue is whether the "presumption of independence" can be formalized or if it's multiple concepts under one name. They've outlined three approaches: max-entropy, causal, and algorithmic. Their supervisor leans toward the category error view but is open if they can defend an angle.

  First, I need to understand their main concerns. They mention real-world implications like risk aggregation and prime number predictions, where incorrect independence assumptions lead to significant errors. That tells me they want a formalization that addresses practical applications, not just theory. They also have constraints: no data, 14 weeks, limited background in causal inference and algorithmic info theory.

  Looking at the three options, max-entropy is familiar but has issues like reference dependence. Causal is robust but requires knowing the causal graph, which isn't always available. Algorithmic independence is abstract and less accessible. The user needs something manageable within their timeframe and knowledge. 

  They also need a defensible position. The supervisor's skepticism about category error is a hurdle. The paper must clearly argue that the presumption isn't a single concept. The examples they gave (variance of sums, prime gaps) show that independence behaves differently across contexts. That suggests disentangling the concepts is valuable.

  Tractability is key. With 14 weeks and no new data, diving into algorithmic info might be too steep. Max-entropy is doable but the invariance problems are deep. Causal approaches could work if framed as a critique of default assumptions without needing the full graph. 

  The user’s interest in scale-dependence (like in the Cramér model) points to a meta-question: when is each formalization appropriate? A paper categorizing the three and showing their contextual validity might be the sweet spot. It addresses the supervisor's category error concern by turning it into the thesis itself.

  I should check if this meets all constraints. It stays armchair, uses their probability/Bayes background, and doesn't require new formal methods. The existing examples (variance, primes) serve as case studies. Plus, linking to forecasting and risk aggregation meets their applied interest. 

  Confidence-wise, this approach seems strong because it transforms the supervisor's objection into the core argument. The risk is whether distinguishing the three formalizations clearly advances understanding. But given the user's examples, showing how each handles different scenarios could be insightful. 

  If they had access to empirical data, causal might be better, but without it, the conceptual analysis fits. Algorithmic info is intriguing but too time-consuming to learn from scratch. 

  So the recommendation is to argue the presumption is context-dependent, using the three formalizations as distinct tools. Outline each, show their limitations with examples, and conclude that no single formalization suffices. That’s actionable in 14 weeks and leverages their strengths.
answer: |-
  Here's my committed recommendation, with reasoning and criteria:

  **Write on Option 1 (Max-Entropy/Epistemic Ignorance)**. Argue that **the "presumption of independence" is not a single, coherent formalizable principle, but rather a context-dependent heuristic justified primarily by max-entropy considerations under specific epistemic constraints, and that its apparent failures (like invariance issues or scale-dependence) reveal deep problems with treating it as a universal default.** This directly addresses your supervisor's "category error" concern by making it the *thesis*, not a flaw.

  **Why Option 1 Wins (Ranking: 1 > 2 > 3):**

  1.  **Addresses Supervisor's Core Concern & Turns it into Strength:** Your supervisor's "category error" worry is valid. Option 1 lets you *embrace* this. Your analysis becomes: "The presumption *isn't* one formalizable thing; here are distinct justifications (max-entropy being primary in ignorance contexts), and here's why attempts to treat it monolithically fail." This is a defensible, substantive contribution.
  2.  **Tractability & Background Fit (Crucial for 14 weeks):**
      *   **1:** You know probability/Bayes well. Max-entropy principles are core to probabilistic epistemology. Analyzing reference class dependence, recoding invariance failures, and scale-sensitivity (your n*rho and Cramér examples) is achievable with your tools. Jaynes, Paris, Vranas are key sources.
      *   **2:** Causal inference requires significant new formal machinery (graphs, d-separation, FCM). Without empirical data or a known graph, arguing about "presumption" in ignorance becomes very abstract and potentially circular ("presume no edges?"). Harder to make novel progress armchair-only in 14 weeks.
      *   **3:** Algorithmic Independence (Kolmogorov complexity) is fascinating but *highly* inaccessible with your background. Proving things about compression costs is notoriously difficult. Learning the basics alone would eat most of your time. High risk of superficial treatment.
  3.  **Upstream & Undefended Fruit:** Max-entropy *is* the dominant formalization of "ignorance" in probabilistic epistemology. Its problems (reference class, invariance) are well-known but often treated as peripheral technicalities. Your paper elevates them to *central flaws* in using max-entropy independence as a *universal* default presumption. Showing how these flaws manifest catastrophically in concrete cases (your n*rho, Cramér) is the undefended low-hanging fruit – connecting deep formal issues to salient epistemic consequences.
  4.  **Impact on Practice:** Your core insight about n*rho scaling is brilliant. A paper dissecting why the max-entropy justification fails for aggregates explains *why* risk aggregation using naive independence defaults is often dangerously wrong. It forces practitioners to confront the *epistemic basis* (or lack thereof) for their independence assumptions, especially in large n scenarios. It doesn't give them a new formula, but it fundamentally challenges the justification for the old, dangerous one. This is more actionable than abstract causal or algorithmic critiques.
  5.  **Leverages Your Examples:** Your variance sum and Cramér model examples are *perfect* case studies for Option 1. They vividly illustrate:
      *   How max-entropy *seems* reasonable at small scales/with limited info.
      *   How it catastrophically fails for aggregates/large conjunctions precisely due to invariance/reference class issues.
      *   Why "no info beyond marginals" is insufficient justification for independence in these contexts.

  **Structure Your Paper:**

  1.  **Introduction:** Pose the problem: Is the "presumption of independence" a coherent, formalizable principle? Outline the stakes (large aggregates, conjunction paradoxes, applied risk).
  2.  **The Contenders:** Briefly introduce the three candidate justifications (max-entropy, causal, algorithmic). Acknowledge Option 3's intractability for this paper.
  3.  **The Max-Entropy Case:** Explain how max-entropy *formally* cashes out "no reason to think correlated" as "maximize entropy given marginals." Present its elegance and intuitive appeal.
  4.  **The Cracks in the Foundation:** Systematically dissect its failures:
      *   Reference Class Dependence: Independence is relative to how you define the variables/space.
      *   Recoding/Transformation Invariance Failure: `X` ind `Y` does *not* imply `X` ind `f(Y)` (or `f(X,Y)`). Use your `X` ind `Y` vs. `X` ind `(X+Y)` example.
      *   **Scale/Conjunction Sensitivity:** This is your killer point. Use your `n*rho` variance calculation to show the *magnitude* of error scales with `n`. Analyze the Cramér model: it works well for *expected counts* over large intervals (where max-entropy *is* reasonable given the info used) but fails catastrophically for *gaps* (very short intervals) because the independence assumption cannot capture the inherent *deterministic structure* (primality isn't random!) and the invariance failure under aggregation. Max-entropy licenses independence at the wrong granularity.
  5.  **Why Causal Doesn't Save the Day (Fully):** Argue that while causal independence is more fundamental, the *presumption* in ignorance isn't about causality per se. We often lack the causal graph precisely when we need a default. Presuming *causal* independence requires presuming a *specific sparse graph structure*, which is a different (and often stronger) assumption than max-entropy ignorance.
  6.  **Conclusion:** The "presumption of independence" justified by max-entropy is **not a universal default**. It is a useful, sometimes necessary heuristic *only under specific epistemic conditions* (truly knowing only marginals, variables defined at an appropriate granularity, small `n`). Its failures reveal it as a context-dependent tool, not a bedrock principle. Using it uncritically for large aggregates or conjunctions is epistemically unjustified and practically dangerous. True independence must be justified by positive knowledge (like causal structure), not just absence of knowledge.

  **Confidence Level:** **85%.** This is the most viable, impactful, and defensible path given your constraints, background, supervisor's warning, and the strength of your core examples.

  **What Would Change My Mind (Downwards on Option 1):**
  *   Discovering a *recent, rigorous, and accessible* formal epistemology paper that *already* makes *exactly* this argument (using scale-sensitivity and invariance failures to argue against a monolithic max-entropy presumption) in a way that leaves no room for your novel contribution. (Unlikely, but possible).
  *   You expressing a strong, confident desire to rapidly learn algorithmic information theory despite the time constraints and background gap. (I strongly advise against this for this project).

  **What Would Change My Mind (Upwards on Option 2):**
  *   Finding a compelling way to argue that the *only* coherent "presumption" in true ignorance is the presumption of *no direct causal connection* (a specific sparse graph), and that this *implies* probabilistic independence under the Causal Markov Condition *even without knowing the full graph*, if you define the variables appropriately. This is harder, but potentially deeper. (This pushes towards "foundational" causal discovery assumptions).

  **Forget Option 3** for this project. It's a fascinating rabbit hole, but not for a 14-week, 5000-word paper with your background. It would consume you.

  **Commit:** Stop circling. Draft an outline based on Option 1 as described above *today*. Focus on making the `n*rho` and Cramér failures the central pillars demonstrating why the max-entropy presumption isn't universal. Show your supervisor this outline. This directly engages her concern while providing a clear, substantive, and tractable argument. Good luck!
