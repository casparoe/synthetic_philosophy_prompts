  ---

  ### Marginal Comments for Student  
  **Strong Points (Correct):**  
  1. **Inside/outside view contrast:** Perfectly explained. You correctly define the inside view as case-specific decomposition (e.g., work packages, engineer consultations) and the outside view as reliance on reference-class statistics (e.g., comparable projects). The link to Kahneman’s planning fallacy and optimistic neglect of risks is spot-on. *(5/5)*  
  2. **Epistemic modesty argument:** Core idea well captured—deferring to base rates over personal judgment when track records exist. Your framing of "deferring to what generally happens" succinctly states the argument. *(3/4)*  
  3. **Objection’s dual biases:** Excellent identification of two contamination sources:  
     - (i) *Reference-class selection* as an "inside-view" judgment (e.g., choosing "first-of-a-kind plants" involves subjective case-specific choices).  
     - (ii) *Database bias* where overruns are measured against optimistic initial estimates, propagating the same bias. This is a sophisticated insight. *(Key strength)*  

  **Partial or Incomplete (Half-Right):**  
  1. **Epistemic modesty assessment:** You claim case details carry "no evidential weight," but this overstates the argument. Correctly, the outside view *downweights* idiosyncratic details, but they still matter for *adjusting* base rates (e.g., if this plant has unique risk-mitigation features). A strong answer would note this nuance. *(-1 here; 2/3)*  
  2. **Objection’s impact:** While the objection is valid (bias propagation), your conclusion that "nothing is gained" goes too far. The outside view *still* reveals systemic optimism (median actual: $900m vs. estimate: $350m). Even biased base rates are more reliable than uncorrected inside views—they quantify *how* optimistic prior teams were. *(-1 here; 5/8)*  

  **Mistakes/Overlooked Elements:**  
  1. **Dismissal of outside view:** Your claim that the team should "discount the $900m heavily and move back toward $400m" is empirically unsound. The historical median out-turn ($900m) *is* evidence of systemic overruns—even if biased, it’s likelier closer to truth than the team’s $400m. The outside view’s value isn’t nullified; it needs *bias-adjusted weighting* (e.g., using the *ratio* of out-turn/estimate). *(-2 here)*  
  2. **Ignoring process similarity:** The question **explicitly asks** whether your answer depends on the team’s estimate coming from the "same kind of process" as the reference class. **You omitted this entirely.** If processes differ (e.g., team used AI modeling while reference class used traditional bottom-up), the bias may not align, weakening the objection. If processes match (as here), the contamination is worse. *(-2; 0/2)*  
  3. **Solution oversight:** You suggest the outside view is only valid with a "fixed" reference class from an "independent" source, but this is impractical. Better answers propose mitigations (e.g., using multiple reference classes, adjusting for "optimism ratios").  

  **Final Feedback:**  
  A perceptive start with sharp critiques of reference-class limitations, but you overstated the case against the outside view and missed key nuances. The objection *exposes bias* but doesn’t invalidate the approach—it calls for smarter implementation (e.g., using out-turn/estimate ratios like $900m/$350m ≈ 2.57x to adjust the team’s $400m to $400m × 2.57 ≈ $1.03B). Ignoring process similarity and rejecting the outside view entirely cost significant marks.  

  ---  
  **Note to Instructor:**  
  This student’s answer might initially impress with its confident critique of reference-class contamination, but a closer read reveals oversimplifications (e.g., dismissing base rates entirely) and a critical omission (process dependency). The A-range answers we’ve seen acknowledge bias but propose refinements (e.g., "reference-class forecasting plus debiasing multipliers") and explicitly engage the process-similarity clause.
