  Hmm, the user is a retired hydrologist with extensive experience in flood-frequency work and now serves as the technical member on a board of adjustment. They're facing a practical challenge with the reference class problem in their decision-making process. I need to help them develop a defensible procedure for their board to determine flood risk probabilities when reviewing applications.

  The user has clearly outlined their operational constraints: 15-minute hearings, limited data sources, non-technical board members, and high-stakes asymmetric outcomes. They've identified three key complications: routing attributes, mitigation time index issues, and class proposal conflicts. Their draft procedure has several flaws they've recognized, including ordering dependence and inconsistent data sources.

  I appreciate their analogical thinking about regional flood-frequency methods. Their question about borrowing data from neighboring regions is valid, but I need to address the model error problem - all their data ultimately comes from the same underlying models. The widow's lakefront case will be particularly tricky since it highlights how clean historical records can be misleading without full context.

  For the procedure redesign, I'll need to: fix the ordering problem by requiring simultaneous attribute consideration; establish clear rules for class membership (parcel-years); create separate risk assessments for proposed vs mitigated conditions; develop objective relevance tests for attributes; and implement guardrails against false precision from narrow classes.

  The key improvements will include: defining "member" as parcel-years to normalize exposure; requiring physical causation for attributes; using Bayesian pooling to avoid empty classes; and adding explicit uncertainty statements in findings. For the three complications, I'll recommend treating routing attributes as data quality indicators only, separating pre-mitigation and post-mitigation risk assessments, and establishing burden-shifting rules for class proposals.

  In the application examples, I'll demonstrate how the revised procedure would handle: the engineer's suspect class selection (rejecting the self-selected class), the manufactured home park (using county data only), and the widow's lakefront property (acknowledging the incomplete claims history). Throughout, I'll emphasize that narrowing classes doesn't reduce shared model error and that boards must explicitly acknowledge this limitation.
answer: |-
  Here is a procedure designed for your board, respecting your constraints, experience, and the specific complications you've raised.

  ### 1. Scope and Assumptions
  *   **Question Answered:** This procedure estimates the annual probability that a structure built *as proposed* on a specific parcel will suffer flood damage exceeding a significant threshold (e.g., cost of repairs, structural integrity loss). The threshold is defined by the relevant flood insurance program or local ordinance.
  *   **Given:** The available data (FIS maps, site plan, elevation cert, county permit file, state claim file, your memory). No new data collection/modelling. The FIS base flood elevation (BFE) and zone are the foundational risk indicators.
  *   **Declined:** Estimating risk *after* mitigation imposed by the board (this is a separate, subsequent assessment). Assessing absolute historical accuracy of the FIS model. Assigning blame or value judgments. Making decisions based solely on this number – it is *evidence* for the board's deliberation.

  ### 2. The Procedure
  **Goal:** Estimate the annual flood damage probability for the proposed structure on Parcel X. Report this estimate and its basis clearly.

  **Definitions:**
  *   **One Member of a Class:** One **Parcel-Year of Exposure**. A single parcel observed for one year within the available data period. (e.g., Parcel A observed for 40 years = 40 members; Parcel B observed for 10 years = 10 members). This accounts for parcels existing for different durations and avoids overweighting parcels with long histories or undercounting multi-unit parcels. Damage events are recorded per *parcel* per *flood event* (one flood damaging 12 units on one parcel counts as *one* damage event for that parcel-year).

  **Steps:**

  1.  **Establish the Baseline Risk (FIS Zone Rate):**
      *   Identify the parcel's FIS Flood Zone (e.g., AE, VE, X).
      *   The baseline annual damage probability is the FIS-defined chance for that zone (e.g., 1% for AE, 0.2% for X). *This is our starting point and fallback.*

  2.  **Identify Candidate Attributes:**
      *   List all attributes proposed by anyone (applicant, staff, board member, you) potentially affecting flood damage risk *for the structure as proposed*. Include the FIS zone itself.
      *   **Relevance Test:** Keep an attribute *only* if:
          *   **(a) Physical Mechanism:** A clear, physically plausible reason exists why this attribute *directly* influences flood hazard intensity (depth, velocity, duration, debris) *or* structure vulnerability *at this specific location* (e.g., elevation relative to BFE, distance to channel, soil type affecting scour, foundation type, presence of flood openings, *parcel* size/shape affecting flow paths).
          *   **(b) Data Availability:** The attribute is *objectively measurable* from the available data sources (maps, plans, certs, files, memory) without new sampling.
          *   *Discard attributes failing either (a) or (b). Routing attributes (like appeal status, cert provider) fail (a) – they are not physical hazard/vulnerability factors.*

  3.  **Define Potential Classes:**
      *   Using the surviving attributes from Step 2, define *all possible non-overlapping classes* by considering the *combination* of attributes. Do *not* narrow sequentially. (e.g., Attributes: Zone AE, Distance-to-Channel < 500m, Elevation > BFE. Classes: AE/<500m/>BFE; AE/<500m/<=BFE; AE/>=500m/>BFE; AE/>=500m/<=BFE).
      *   For each class, count the total Parcel-Years of Exposure (sum years each parcel in the class existed within the data period).
      *   For each class, count the number of flood damage events exceeding the threshold recorded in the state/county claim file *for structures built under conditions matching the class definition*.

  4.  **Select the Reference Class & Calculate Rate:**
      *   **Rule:** Select the class that:
          1.  Contains the parcel in question (based on its attributes *as proposed*).
          2.  Has the **greatest number of Parcel-Years of Exposure (N)** among all classes meeting criterion 1.
          3.  Has **N >= 25 Parcel-Years**.
      *   **If multiple classes tied for largest N>=25 contain the parcel, average their rates.**
      *   **Calculate Rate:** Annual Probability = (Number of Damage Events in Class) / (Total Parcel-Years in Class).
      *   **Fallback:** If *no* class containing the parcel has N>=25 Parcel-Years, use the **Baseline FIS Zone Rate** from Step 1.
      *   **Report:** State the calculated rate *or* the fallback rate. Explicitly state the defining attributes of the class used (or "FIS Zone AE rate").

  5.  **Uncertainty Statement (Mandatory in Findings):**
      *   *Always* include this statement verbatim in the written findings: *"This estimated annual probability is based on available historical claims and parcel data within [County Name] and the FIS model. Historical data is limited and may not capture all events or future changes. The underlying FIS model has inherent uncertainty; using a narrower class of parcels does not reduce this shared model error but may better reflect local variations within the model's framework."*

  ### 3. Rulings on the Three Complications

  *   **Routing Attributes:**
      *   **Your instinct is correct.** Attributes like appeal status, cert provider, filing date relative to remapping, or claim deductible thresholds are **inadmissible** for defining the reference class itself. They provide **zero evidence** about the physical hazard or vulnerability. They *only* pertain to **data quality or completeness**.
      *   **Test:** If the attribute describes *how the information reached the board* or *administrative rules governing data collection*, it's a routing attribute. It cannot be part of Step 2 (Candidate Attributes).
      *   **Use:** Mention data limitations (e.g., "Claims data only reflects insured losses above deductible") in findings, but *never* let them define the risk class.

  *   **Mitigation and the Time Index:**
      *   **Your suspicion is correct.** There are **two distinct questions**:
          1.  **Pre-Mitigation Risk:** The risk *if built exactly as proposed by the applicant* (no board conditions). *This is the question the procedure answers.*
          2.  **Post-Mitigation Risk:** The risk *if built as proposed BUT with the board's mitigation conditions imposed* (e.g., elevated, openings added). *This requires a separate assessment AFTER the board grants.*
      *   **Rule:** The board's decision to grant *with conditions* must be based *first* on the Pre-Mitigation Risk assessed by this procedure. If that risk is unacceptable, conditions can be imposed to *reduce* it. The *effectiveness* of those conditions (the Post-Mitigation Risk) must then be assessed separately, using classes defined by the *mitigated state* (e.g., "Elevated structures >2ft above BFE"). **Never** use the Post-Mitigation class (which is biased) to justify the grant decision itself.

  *   **Who Proposes the Class:**
      *   **Who Proposes:** Anyone (Applicant, Staff, Board, You) can propose attributes or classes *during the hearing*.
      *   **Burden of Justification:** The *proponent* of a specific attribute or class definition bears the burden of demonstrating it passes the **Relevance Test** (Step 2: Physical Mechanism & Data Availability).
      *   **Resolution of Disagreement:** If multiple valid classes (passing Step 2) containing the parcel are proposed and have N>=25:
          *   The procedure's **Selection Rule** (Step 4: largest N) is applied objectively. The class with the greatest Parcel-Years is used. Ties are averaged.
          *   **Rationale:** Larger N generally provides a more stable, less volatile estimate, reducing sensitivity to small changes in class definition or random claim history variations. It prioritizes statistical robustness over theoretical narrowness when multiple valid options exist.

  ### 4. Verdict on Your Draft

  *   **Step 1 (List Attributes):** **Survives** - Essential starting point.
  *   **Step 2 (Keep Attribute If...):**
      *   *Physical Reason:* **Survives (Core).** Fundamental relevance filter.
      *   *5% Significance:* **Actively Misleading & Discarded.** Statistical significance depends heavily on sample size (N). When N is small (common in local claims data), even large real differences won't be "significant," precisely when you need the data most. It also ignores the *magnitude* of the difference. The Physical Mechanism test is more robust and relevant for decision-making.
      *   *Repair:* Replace with the **Relevance Test** (Physical Mechanism + Data Availability).
  *   **Step 3 (Narrow Sequentially):** **Actively Misleading & Discarded.** This causes the ordering problem you identified and artificially prioritizes the first attribute applied. It doesn't consider the natural groupings defined by combinations of attributes.
      *   *Repair:* Replace with defining **all potential non-overlapping classes** based on the *combination* of surviving attributes simultaneously (Step 3 in new procedure). Selection is then based on largest N, not order of narrowing.
  *   **Step 4 (Stop When...):** **Discarded.** The sequential narrowing is gone. The "N<25" rule **survives in spirit** as the fallback threshold. The "rate change < interval width" rule is **inert/discarded** – it's statistically complex, depends on questionable interval estimates with small N, and is replaced by the robust "largest N>=25" selection rule.
  *   **Step 5 (Read Rate / Fallback):** **Survives in spirit, repaired.** The core idea (use class rate or fallback) is good. The repair: Define "member" as **Parcel-Year**. Explicitly state the fallback is the **FIS Zone Rate**. Clarify "class is empty" -> "no class *containing the parcel* has N>=25". Acknowledge the data source switch (FIS model vs claims) explicitly via the **Uncertainty Statement**.
  *   **Key Missing Element:** **Uncertainty Statement** about shared model error added as mandatory.

  ### 5. Three Applications (Using Repaired Procedure)

  *(Assumed FIS Zone is AE, Baseline Rate = 1% (1/100) for all. Threshold: Significant Damage.)*

  *   **(a) Single-Family House, Proposed +1.5ft BFE:**
      *   Staff Class: Zone AE, Distance <500m. N = 380 Parcel-Years. Damage Events = 22. Rate = 22/380 ≈ 5.8% (0.058).
      *   Applicant Class: Zone AE, Same Street, Built>1995, No Claims. **Relevance Test:**
          *   *Physical Mechanism:* "Same Street" - plausible (micro-topography, drainage). "Built>1995" - plausible (building codes, materials). "No Claims" - **Fails!** Outcome history is *not* a physical hazard/vulnerability attribute; it's a *result* influenced by many factors (including luck). It's a routing/data quality proxy at best. **Invalid Attribute.**
      *   Valid Classes: Staff class is valid. Is there a class with larger N containing the parcel? Attributes: Zone AE, Distance<500m, Elevation>BFE (proposed is +1.5ft). Assume N for AE/<500m/>BFE > N for AE/<500m (if not, staff class wins by largest N rule). Assume AE/<500m/>BFE has N=300 Parcel-Years, 10 Damage Events → Rate=10/300≈3.3% (0.033). *Since N=300 > Staff's N=380? Wait, Staff didn't use elevation. Staff class N=380 is larger than the proposed AE/<500m/>BFE class N=300.* **Staff Class has largest valid N (380).**
      *   **Result: Use Staff Class Rate ≈ 5.8%.** (Reject Applicant's class due to invalid "No Claims" attribute). Report: "Based on parcels in Zone AE within 500m of channel: ~5.8% annual probability."

  *   **(b) 12-Unit Manufactured Home Park on One Parcel:**
      *   County Data: "Manufactured Homes in Floodplain". N = 14 Parcel-Years? **Problem:** How many unique parcels? How many years each? *Crucially: Is this one parcel with 12 units?* **Member = Parcel-Year.** This is *one parcel*. If it's existed for 40 years, N=40 Parcel-Years for *this parcel type*. But county data has "14 units over 40 years" - inconsistent definition. *Assume county data is flawed/misleading.*
      *   Valid Classes: Need classes containing *this specific parcel*. Attributes: Zone AE (assumed), Structure Type = Manufactured Home Park (Multi-Unit). Does this class exist in county data? County data only reports "14 units" not parcel-years. **Insufficient Data.** State data: Different region (soils, rain, topography, inspection). **Not comparable. Physical Mechanism fails relevance test for pooling.**
      *   **Result: Fallback to FIS Zone AE Rate = 1%.** Report: "Insufficient comparable historical claim data within county. Using FIS Zone AE base rate: 1% annual probability." *[Flag: Assumed Zone AE. Interpretation of flawed county data as insufficient.]*

  *   **(c) Widow's Rebuild, Existing Footprint, Lakeside Subdivision:**
      *   Applicant/History: Subdivision ~60 parcels, Zero claims since 1985 (annexation). Proposed: Rebuild existing footprint (no elevation). Staff likely uses this "clean" class.
      *   Valid Class: Zone AE (assumed), Location = Lakeside Subdivision. N = (60 parcels * 38 years [2023-1985]) = 2280 Parcel-Years. Damage Events = 0. Rate = 0/2280 = 0%.
      *   **Complication:** Known flood in 1979 (pre-annexation, pre-claim-file). **Relevance Test:** "Claim File Start Date=1985" is a **Routing Attribute**. It affects data completeness, *not* the physical hazard. The 1979 flood *is* evidence of physical hazard. However, the *Damage Event* data for the subdivision class is only reliably known from 1985 onwards. Pre-1985 parcel data (existence, conditions) may be unreliable.
      *   **Procedure:** The valid class "Lakeside Subdivision" post-1985 has N=2280 >=25, Rate=0%. The 1979 flood cannot be counted as a *damage event in this class* because we lack reliable data on *which specific parcels* were damaged *and* their condition *in 1979* relative to the class definition (parcels existing post-1985). It is evidence of hazard, but not quantifiable for *this specific class's rate*. **Result: Calculated Rate = 0%.**
      *   **Findings Must Include:** "While the calculated rate based on claims data since 1985 is 0%, a significant flood event is documented in this area in 1979. This highlights the limitation of historical claims data and the inherent uncertainty in the FIS model." *The board must weigh this 0% rate against the known 1979 event and the FIS model's hazard depiction.*

  ### 6. Hard Stops, Judgment Calls, and Hand-offs

  *   **Hard Stops (Refusal to Report a Number):**
      *   **None.** The procedure *always* returns a number: either a calculated rate from a valid class (N>=25) or the fallback FIS Zone rate. It does not refuse an estimate.
      *   **Rationale:** A decision must be made. The FIS rate provides a scientifically derived, legally defensible baseline. The alternative (no number) forces pure speculation, which is worse. The **Uncertainty Statement** explicitly frames the limitations.

  *   **Judgment Calls within the Procedure:**
      *   **Physical Mechanism (Step 2):** Is the proposed reason *plausible*? This requires technical judgment (yours). Document the reasoning briefly ("Distance to channel affects flow velocity; foundation type affects scour resistance").
      *   **Defining "Physical Mechanism":** Stick strictly to factors directly influencing water behavior or structural response during a flood. Reject socioeconomic factors, administrative factors, or pure outcome history.
      *   **Data Availability (Step 2):** Is the attribute *objectively measurable* from the *available* sources? Judgment call, but should be clear-cut (e.g., Elevation Cert provides elevation; map provides distance; permit file provides foundation type if recorded).

  *   **Hand-offs (Where Judgment Takes Over):**
      *   **The Decision Itself:** The procedure outputs an *estimate*. It does not dictate the decision. The board must judge:
          *   Is this estimated risk **acceptable** given the community's standards, regulations, and the asymmetric stakes (property rights vs. community cost)?
          *   Should **mitigation be required** to reduce the risk below an acceptable threshold? (Requires a *separate* post-mitigation risk assessment).
          *   Are there **equitable or hardship considerations** (like the widow) that warrant a decision *despite* the estimated risk? *This is the core function of the board of adjustment.* The procedure provides the technical risk assessment; the board applies community values and standards.

  ### 7. What Narrowing Cannot Buy (Shared Model Error)

  *   **The Core Problem:** All data (FIS maps, claims correlated to FIS zones, your memory of events interpreted through the FIS lens) ultimately stems from **one underlying H&H model and input dataset**. Errors in rainfall estimates, topography, roughness coefficients, or model structure affect *all* parcels similarly within the model's domain. A narrow class might better reflect *spatial variations predicted by the model*, but it **cannot reduce the error inherent in the model itself**.
  *   **Apparent vs. Real Precision:** A narrow class with zero claims (like the Lakeside subdivision) has an *apparently* precise rate of 0%. However, the *real uncertainty* is much larger because:
      1.  The model could be underestimating the hazard everywhere in that area.
      2.  The limited historical period (especially post-1985) may not include the true worst-case event.
      3.  Future conditions (development, climate) may differ.
  *   **How to Write into Findings:**
      *   **Mandatory Uncertainty Statement:** As defined in Step 5. *"This estimated annual probability... The underlying FIS model has inherent uncertainty; using a narrower class of parcels does not reduce this shared model error but may better reflect local variations within the model's framework."*
      *   **Contextualize Extreme Estimates:** For very low (like 0%) or very high rates from narrow classes, explicitly add: *"This estimate is based on limited historical data within the constraints of the shared FIS model. The true probability could be higher/lower due to model uncertainty and the potential for events outside the observed record."* (Tailor "higher/lower" to the case).
      *   **Acknowledge Known Model Weaknesses:** If aware of specific model limitations in an area (e.g., known poor topography data near the lake), mention it briefly: *"The FIS model for this area has noted limitations in [specific aspect], which adds uncertainty to all estimates derived from it."*
      *   **Emphasize the Fallback:** When using the FIS rate, state: *"This is the scientifically modeled baseline risk for the flood zone, acknowledging inherent model uncertainty."*

  ### 8. What the Procedure Cannot Do

  *   **Eliminate Uncertainty:** It provides estimates within the limitations of shared model error and sparse local data. True risk is unknown.
  *   **Assess Post-Mitigation Risk:** It only estimates risk *as proposed*. Mitigation effectiveness requires a separate step.
  *   **Incorporate Future Changes:** It relies on historical data/FIS; climate change or watershed development impacts are not quantified.
  *   **Resolve Value Judgments:** It doesn't define "acceptable" risk or weigh hardship. That's the board's role.
  *   **Guarantee Correctness:** It systematizes estimation using available data, reducing arbitrariness, but is not infallible.
  *   **Replace Hydraulic Understanding:** Judgment on physical mechanisms (Step 2) requires technical expertise.
