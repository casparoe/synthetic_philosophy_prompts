answer: |-
  ## Villanelle of the Unfought Sea

  The lamp burns low above the chart unrolled,  
  The salt wind probes the timbers of the ship,  
  **the sea-battle will be fought tomorrow**  
  **the sea-battle will not be fought tomorrow**

  His hand rests near the signal flags, untold  
  Intentions coil like rigging in his grip,  
  The lamp burns low above the chart unrolled.

  The orders wait, the moment to unfold,  
  Yet neither script is written on the trip:  
  **the sea-battle will be fought tomorrow**  
  **the sea-battle will not be fought tomorrow**

  The fleet lies dark, a future to behold  
  Still veiled. The final word has left his lip?  
  The lamp burns low above the chart unrolled.

  One course excludes the other, truth is polled  
  By what *is* fixed – the plotted course, the slip  
  Of tide – yet neither horn alone is tolled.  
  **the sea-battle will be fought tomorrow**  
  **the sea-battle will not be fought tomorrow**

  Beyond this deck, the branching paths uphold  
  A single fact the present cannot strip:  
  The lamp burns low above the chart unrolled.

  He weighs the cost where futures lie enrolled,  
  Not knowing which the fated logbooks script.  
  **the sea-battle will be fought tomorrow**  
  **the sea-battle will not be fought tomorrow**

  **the sea-battle will be fought tomorrow**

  ---

  **Mapping and Justification:**  
  The poem maps "the sea-battle will be fought tomorrow" onto the *bivalent/determinist* reading: on this view, one forecast (this one) is already true, fixed by present states and laws, though unknowable now. It gets the final line to represent its status as the settled outcome on the single, privileged branch of future history. "The sea-battle will not be fought tomorrow" maps onto the *genuine openness* reading: it remains neither true nor false until the admiral acts. The poem presupposes the principle the user identified: that present states plus laws *make* future-tense claims true (or false), which determinism alone doesn't guarantee but is necessary for the bivalent reading. The disjunction's settlement ("One course excludes the other") while neither disjunct is known to be true (or, on the openness view, *is* true yet) creates the space for non-theatrical deliberation ("He weighs the cost... Not knowing").
