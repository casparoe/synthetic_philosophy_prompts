  Okay, the user is writing a monograph on "information" in molecular biology and needs a rigorous specification for when DNA can be said to literally carry information. They want to settle a live dispute about whether DNA has unique informational properties compared to other factors like methylation or environmental cues. 

  Hmm, this is a sophisticated request. The user clearly has deep expertise—they're familiar with degenerate codon mappings, genomic complexity, and niche construction critiques. They're not just paraphrasing textbooks but aiming for conceptual precision. Their frustration with facile "information" metaphors is palpable. 

  Let me unpack their core demand: they need desiderata that can withstand attacks from DST/niche-construction theorists. The examples they listed (degeneracy, code variants, splicing, errors, prions) are excellent stress tests. I should avoid getting trapped in existing debates (they'll score positions themselves) and focus on constructing a defensible baseline.

  *Key challenges:* 
  First, how to define "literal" information without anthropomorphizing? Must avoid smuggling in cognitive metaphors. 
  Second, the parity problem—what makes DNA different from cytoplasmic gradients? 
  Third, handling biological messiness: errors, context-dependence, non-coding DNA. 

  *Non-negotiables:* After wrestling with their cases, I think three pillars are essential: 
  1) **Asymmetry** (DNA's causal primacy in templating sequence), 
  2) **Channel conditions** (system for reliable encoding/decoding), 
  3) **Independence** (sequence-function mapping decoupled from direct physics). 

  The templating requirement might be the most contentious—it excludes prions and cytoplasmic inheritance. But without it, the parity argument wins. 

  *Biggest tension:* Probably between **Contextual Robustness** (splicing/imprinting mustn't break the code) and **Independence** (which demands stability across contexts). If gene regulation is too plastic, the information claim crumbles. 

  *What would change my mind?* If someone demonstrated error-correction in cytoplasmic gradients (e.g., proofreading of methylation patterns) or showed prions replicating *sequence-specific* conformations without DNA involvement. That could force demoting Asymmetry from non-negotiable. 

  The user will likely push back on templating—maybe argue that epigenetic marks also "template." I'll need to clarify that templating requires copying *arbitrary* sequences, not just states. 

  ...Better emphasize why "program" and "blueprint" fail: they imply top-down control that doesn't exist. "Code" survives because it's about arbitrary mapping, not foresight. 

  *Final check:* Did I address all their cases? Degeneracy → handled by Independence. Code variants → Channel Conditions allow plasticity. Splicing → Contextual Robustness. Errors → Noise tolerance. Prions → excluded by Templating. Good.
answer: |-
  Here is a specification for a theory claiming DNA literally carries information and the genetic code is a true code. Desiderata are grounded in your cases and the need to resolve the parity dispute. Requirements are categorized, tensions noted, and mind-change conditions specified.

  ---

  ### **Core Desiderata for a Literal "Information" Theory**

  1.  **Asymmetry of Templating (Non-Negotiable)**
      *   **Requirement:** DNA must be the *only* molecular structure in the system capable of serving as a **heritable template for the sequence-specific polymerization** of other molecules (RNA, ultimately proteins). Templating must allow *arbitrary* sequence variation without disrupting the copying mechanism.
      *   **Case for Non-Negotiability:** Distinguishes DNA from methylation marks (which template their *state*, not a sequence of arbitrary symbols), cytoplasmic gradients (instructive signals, not sequence templates), and nest features (environmental conditions). Prions (*e.g.*, PSI+) template *structure/conformation*, not an arbitrary *sequence* of monomers. DNA's unique role in preserving and transmitting linear digital sequence is irreducible.
      *   **Handles:** Prions (templating without sequence coding), need for sequence specificity.

  2.  **Channel Conditions: Decoding Machinery (Non-Negotiable)**
      *   **Requirement:** The mapping from DNA sequence to functional molecules (proteins, functional RNAs) must be mediated by dedicated, evolved molecular machinery (RNAP, ribosomes, aaRS, tRNAs, spliceosome) that functions as an **error-buffering channel**. This machinery must implement the mapping rules (code) with tolerable fidelity, correcting or mitigating some errors.
      *   **Case for Non-Negotiability:** Resolves the gap between sequence and outcome (misincorporation, frameshift) by showing the system *expects and handles noise*. Distinguishes DNA from passive environmental factors (nest) or simple chemical gradients. Methylation marks lack dedicated, universal decoding machinery equivalent to the translation apparatus; their "interpretation" is often context-specific binding/modification, not decoding via a standardized codebook.
      *   **Handles:** Degeneracy (error buffering), misincorporation/frameshift (noise inherent in channels), near-universality (evidence of dedicated, conserved machinery).

  3.  **Independence / Arbitrariness of Mapping (Non-Negotiable)**
      *   **Requirement:** The mapping between specific DNA sequences (codons, promoters, splice sites) and their functional outcomes (amino acids, transcription rate, exon inclusion) must be largely **independent of the direct physicochemical properties** of the DNA sequence itself *in that context*. The mapping is established and maintained by the decoding machinery/channel conditions.
      *   **Case for Non-Negotiability:** This is the essence of a "code" – symbols mean something *because of a rule*, not because of inherent physics/chemistry. Without this, "code" is merely chemistry. Degeneracy proves multiple physical sequences (codons) map to the *same* functional unit (amino acid), violating direct physical determinism. Code variants prove the mapping is evolvable and contingent, not physically necessary.
      *   **Handles:** Degeneracy (key evidence), code variants (proof of arbitrariness). Excludes simple templating like crystal growth.

  4.  **Contextual Robustness (Non-Negotiable)**
      *   **Requirement:** The core sequence-to-outcome mapping (codon-amino acid, splice site recognition) must be **operational and recognizable across diverse cellular contexts** (different cell types, developmental stages, environmental conditions), even if modulated *by* that context. The *rules* of the code persist.
      *   **Case for Non-Negotiability:** Defends against the "redistribution" argument. Alternative splicing, imprinting, and reading frame shifts demonstrate the *same DNA sequence* is interpreted differently based on *other* regulatory information (splicing factors, methylation marks, translational context). Crucially, this regulatory information *itself* ultimately relies on DNA-encoded factors (proteins, RNAs) implementing the rules. The core mapping remains stable; the *expression* of the information is modulated.
      *   **Handles:** Alternative splicing, imprinting, reading frame shifts (show modulation, not destruction of core mapping), non-coding DNA (implies information beyond primary coding sequence).

  5.  **Functional Specificity (Strong Preference)**
      *   **Requirement:** The information carried should specify outcomes with sufficient precision to enable the reliable construction of complex, functional structures (proteins, regulatory networks) essential for heritable traits.
      *   **Case for Preference:** Addresses the gap between genome sequence and organismal phenotype. While desirable, a literal information theory might focus on molecular specificity (amino acid sequence, RNA structure) as the primary output. Genomic complexity (non-coding DNA) suggests information density varies; the theory needn't require *all* DNA to be equally information-dense, only that the *coding potential* exists where utilized. This is a battleground with DST (emphasizing distributed specificity).
      *   **Handles:** Non-coding DNA (acknowledges varying information density), functional complexity.

  6.  **Metaphor Endorsement: "Code" & "Template" (Non-Negotiable Consequence)**
      *   **Endorsement:** The theory endorses **"Code"** (due to Arbitrariness/Independence and Decoding Machinery) and **"Template"** (due to Asymmetry of Templating) as the core literal metaphors.
      *   **Rejection:**
          *   **"Blueprint"**: Implies a static, spatial plan. DNA does not encode spatial coordinates; it encodes components and assembly rules. Development is dynamic and context-dependent.
          *   **"Program"**: Implies centralized, step-by-step control. Genetic regulation is decentralized, parallel, and environmentally responsive.
          *   **"Law"**: Implies physical necessity. The genetic code is contingent, evolved, and arbitrary.
      *   **Why:** "Code" captures the symbolic, arbitrary mapping decoded by machinery. "Template" captures the sequence-specific copying. The others introduce misleading connotations of foresight, central control, or physical inevitability.

  ---

  ### **Critical Tensions & Vulnerabilities**

  1.  **Suspected Unsatisfiable Pair:** **Contextual Robustness** vs. **Functional Specificity**.
      *   **Tension:** Contextual Robustness requires the *core mapping* (e.g., codon meaning) to be stable across contexts. Functional Specificity demands DNA sequence reliably specifies complex functional outcomes. However, the *actual functional outcome* of a sequence (e.g., protein function, developmental role) is *highly* context-dependent (cellular environment, other genes, environment). A theory strong on literal sequence mapping might struggle to guarantee specific functional outcomes without invoking distributed systems (DST's point).
      *   **Likely Failure Point:** Overreach. A literal information theory might best claim DNA specifies *molecular sequences and primary interactions* (the "code" and "template" products), leaving higher-order function to system dynamics. Insisting DNA literally specifies *organismal function* risks collapsing under DST critique.

  2.  **Most Excluding Requirement:** **Asymmetry of Templating**.
      *   **Why:** This is the hardest requirement for cytoplasmic gradients, methylation marks, or nest features to meet. They can be instructive signals or templating states, but they lack the capacity for *arbitrary, linear sequence inheritance* that DNA provides. This requirement directly targets the core of the parity argument by identifying a unique molecular capability.

  ---

  ### **What Would Change My Mind?**

  1.  **Dropping/Demoting "Asymmetry of Templating":**
      *   **Finding:** Discovery of a non-DNA-based, *heritable*, *sequence-specific* templating system for polymers (proteins or nucleic acids) in a natural biological system (beyond engineered systems like PCR with added primers). For example, a prion or RNA-based system that could faithfully replicate *arbitrary* sequence information over generations without DNA involvement.
      *   **Argument:** A sophisticated demonstration that templating of arbitrary sequences is an emergent property of complex catalytic networks where no single molecule has primacy, genuinely achieving parity. (This seems highly unlikely given current knowledge).

  2.  **Dropping/Demoting "Channel Conditions":**
      *   **Finding:** Evidence that "translation" of cytoplasmic gradients or methylation patterns occurs via dedicated, universal molecular machinery analogous to the ribosome/tRNA system, implementing arbitrary mapping rules with error-correction, conserved across broad lineages.
      *   **Argument:** A compelling case that the "decoding" of environmental or epigenetic cues uses fundamentally the same *type* of evolved, channel-like machinery as the genetic code, making the distinction merely historical contingency, not categorical. (Current evidence points to binding specificity and signaling cascades, not code-like decoding).

  3.  **Dropping/Demoting "Independence/Arbitrariness":**
      *   **Finding:** Demonstration that the "standard" codon assignments are *physically necessary* for efficient/stable translation under prebiotic or universal cellular constraints, with variants being severely non-functional. (Degeneracy and observed variants strongly argue against this).
      *   **Argument:** A successful reductionist account showing that all apparent arbitrariness is an illusion, and mapping is fully determined by physico-chemical affinities within the decoding machinery itself, leaving no room for contingent "meaning". (This negates the concept of "code").

  4.  **Weakening "Contextual Robustness":**
      *   **Finding:** Widespread, fundamental recoding mechanisms where the *core meaning* of codons (or splice sites) changes dynamically and pervasively based solely on cellular context *without* relying on DNA-encoded factors for the change. (Current mechanisms like stop-codon suppression or regulated alternative splicing rely on DNA-encoded factors - tRNAs, proteins).
      *   **Argument:** A convincing DST argument that the "persistence" of the mapping rules is an artifact of focusing on DNA, and that the *functional* mapping is always co-determined by the entire developmental system moment-to-moment, making DNA's role inherently contextual and non-robust.

  5.  **Vulnerability in Unsatisfiable Pair (Robustness vs. Specificity):**
      *   **Failure Point:** My reasoning likely fails if the distinction between "specifying molecular sequence" (Contextual Robustness of the code) and "specifying functional outcome" (Functional Specificity) is blurrier than I assume. If molecular sequence *only* has meaning in an instantaneous, holistic cellular context with no persistent mapping rules, then Contextual Robustness collapses, and the literal information claim weakens significantly. Strong evidence for pervasive, context-driven *redefinition* of codon meanings (beyond known limited variants) could force this.

  This specification provides a high bar for literal truth, centered on DNA's unique role in heritable, arbitrary sequence templating decoded by dedicated machinery. It directly confronts the parity argument via the Asymmetry requirement while accommodating biological complexity through Contextual Robustness and acknowledging limitations on Functional Specificity. Use this framework rigorously to dissect existing theories.
