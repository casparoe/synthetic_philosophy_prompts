prompt: |-
  I am writing a paper on whether a moderately affluent democracy may permissibly direct its social spending to its own citizens rather than to comparably or much worse off foreigners, and before I commit to a line I want the specification that any account of compatriot partiality would have to meet. I would like you to write that specification rather than to survey the field. Assume I have read the literature; make the criteria do the work, and name no authors and cite nothing.

  Fix the purpose of the theory as follows: it must be adequate for guiding institutional design and official action, not merely for delivering verdicts about what one private person owes another. Everything below should be assessed against that purpose, and you should say if any requirement on my list is a demand that only makes sense for a theory with a different purpose.

  Give me the requirements list, with the case or consideration behind each requirement, and with each marked non-negotiable, negotiable, or a prejudice of one camp. Here is my own tentative list; correct it, reorder it, and add at least two requirements I have missed.

  1. Contrastive sensitivity. The account must say what happens when the candidate grounds are varied one at a time: shared institutions without shared culture, shared culture without shared institutions, co-residence without citizenship, citizenship without residence, coercion without reciprocity, reciprocity without coercion. Motivate with matched pairs, e.g. the long-term resident who has been denied naturalization against the citizen who has lived abroad for forty years.

  2. Degrees and nested jurisdictions. Membership is layered: municipality, province, federation, supranational union. The account must say whether the claims come in degrees, how the degrees are ordered, and whether that ordering is transitive. Motivate it with a case in which a flood-relief budget must be divided between a richer province of your own federation and a poorer region of a neighbouring state.

  3. Conflict among partiality-generating groups. The account must handle a dual national whose two states are at war with each other, and a person whose religious or linguistic community straddles borders while most of her compatriots do not belong to it. Does either group retain a claim, and is the conflict decidable?

  4. Exit, entry, dissent, and duration. Motivating cases: the emigrant who has formally renounced; the citizen naturalized last year; the lifelong resident who has never voted and dissents from every act of the state; the state that is about to dissolve or the province that is about to secede. The account must say whether the relevant relation is acquired and lost, and over what time scale.

  5. The deontic structure. Is compatriot partiality a permission to favour, a duty to favour, a constraint on how a general duty may be discharged, or an intensification of a duty that would exist anyway? Motivate with a tax increase whose proceeds would do more good abroad: is spending them at home permissible, required, or merely not an injustice?

  6. Two dimensions kept apart. An account must not treat the permission to benefit compatriots and the permission to exclude or coerce non-compatriots as the same thing, and must say something about each. Motivate with the pair: topping up a domestic pension versus closing a labour market to foreigners.

  7. The discriminating ground. The account must state what does the work, and must not silently substitute a surrogate such as coercion, reciprocity, associative history, or shared identity for shared citizenship itself. Say what would count as evidence that the stated ground rather than a surrogate is doing the work.

  8. Distinctions that may not be collapsed: having a claim versus how strong a claim is; the justification of a state's existing at all versus the justification of partiality within one; distributive claims versus non-distributive ones; and what people in fact feel about compatriots versus what they owe them. Give a case for each.

  9. Bound against abuse. The account must not entail that any group with a shared identity generates comparable claims, and it must survive the case of a nation partly constituted by the exclusion of some of the people who live under its institutions.

  10. Uptake under conditions of disagreement. The theory must say what officials may do when the electorate's partiality is stronger than the theory permits, and how much moral cost attaches to non-compliance by institutions rather than by individuals.

  Then, and this is the part I most want: identify any pair or subset of the requirements that you think cannot be jointly satisfied, and argue for the incompatibility rather than asserting it. I suspect something in the neighbourhood of requirements 1, 2, and 10 pulls apart. Also identify which single requirement excludes the largest number of otherwise attractive accounts, and say why.

  Finally, give me a compressed scorecard and no more than two sentences each for four broad families of account: coercion- or institution-based, associative or relationship-based, identity- or culture-based, and thoroughgoing egalitarian-cosmopolitan. Score them against the non-negotiable requirements only.

  Two further constraints. Keep every motivating case inside ordinary political life: no science fiction, no disconnected thought experiments, one or two sentences per case. And if a requirement on my list can only be motivated from inside one camp's framing rather than from the cases, say so and demote it rather than defending it. A table for the requirements is fine; prose for the incompatibilities.
reasoning: |-
  Hmm, the user is working on a paper about whether moderately affluent democracies can prioritize social spending for their own citizens over worse-off foreigners. They need help refining a specification for any account of compatriot partiality. They've provided a list of requirements and want me to correct, reorder, and add at least two missing requirements. The key is that this specification must guide institutional design and official action, not just private obligations.

  Looking at their list, I need to assess each requirement against the institutional purpose. Some requirements like "contrastive sensitivity" (1) and "distinctions that may not be collapsed" (8) seem solid as they help test theoretical robustness in practical scenarios. But I should check if any are biased toward certain philosophical camps. For example, "bound against abuse" (9) is crucial to prevent justifications for exclusionary groups, which aligns with institutional safety.

  I notice two gaps: "Resource Constraints and Prioritization" and "Institutional Feasibility." The first addresses how to allocate limited resources between domestic and foreign needs, using cases like healthcare rationing. The second ensures theories can be implemented without unrealistic demands, as institutions can't constantly re-evaluate obligations.

  Reordering makes sense: start with deontic structure (now 5) since it defines the core obligation, then move to contrastive sensitivity (1), discrimination ground (7), etc. I'll mark most as non-negotiable except "degrees and nested jurisdictions" (2) and "conflict among partiality-generating groups" (3), which might be negotiable if a theory focuses on citizenship only.

  The user suspects tension between requirements 1, 2, and 10. I agree: contrastive sensitivity demands fine-grained distinctions, degrees require handling layered memberships, and uptake deals with democratic compliance. Theories might struggle to balance all three without inconsistency. Also, "discriminating ground" (7) is the most exclusionary requirement because many theories use proxies like coercion instead of citizenship itself, failing direct justification.

  For the scorecard of four theory families:
  - Coercion-based theories score poorly as they often conflate permission to benefit with exclusion, violating requirement 6.
  - Relationship-based theories handle contrastive cases well but may justify any group, failing requirement 9.
  - Identity-based theories risk abuse and struggle with dissent cases, violating requirements 9 and 4.
  - Egalitarian-cosmopolitan theories avoid partiality but conflict with requirement 5 by denying permission to favor compatriots.

  I'll present this in a table for clarity, with prose for the incompatibilities. Every motivating case will be grounded in ordinary politics, like flood relief budgets or dual nationals in conflict. This should give the user a rigorous framework to evaluate theories for their paper.
answer: |-
  Here is the revised specification, structured to meet your institutional-design purpose. I've reordered, refined, and added two critical requirements (11 & 12). Requirements marked as "prejudice" rely on contested framing rather than institutional necessity. Motivating cases are grounded in ordinary politics.

  ### Requirements for an Institutional Theory of Compatriot Partiality
  | # | Requirement                  | Status          | Motivating Case (1-2 sentences)                                                                                               |
  |---|-----------------------------|-----------------|-------------------------------------------------------------------------------------------------------------------------------|
  | **5** | **Deontic Structure**        | Non-negotiable  | A tax increase yields surplus: may/must it fund domestic childcare (benefiting middle-class citizens) over malaria nets abroad (saving more lives)? Clarifies whether partiality is a permission, duty, or constraint. |
  | **1** | **Contrastive Sensitivity**  | Non-negotiable  | Compare: (a) A non-citizen resident paying taxes for 20 years (ineligible for naturalization) vs. (b) A citizen living abroad for 40 years with no tax ties. Do both have equal claims to pension guarantees? |
  | **7** | **Discriminating Ground**    | Non-negotiable  | If "shared institutions" justify partiality, does evidence show obligations weaken for citizens in stateless nations (e.g., Kurds in Iraq) but persist for diaspora with passports but no institutional interaction? |
  | **6** | **Two Dimensions Kept Apart**| Non-negotiable  | (1) Expanding domestic unemployment benefits vs. (2) Restricting asylum seekers' work rights. An account must not derive (2) from the logic justifying (1); coercion/exclusion needs separate grounding. |
  | **4** | **Acquisition/Loss Conditions** | Non-negotiable | (a) A dissenting citizen who never votes or pays taxes; (b) A new citizen naturalized after 1 year of residency. Do both trigger identical obligations for the state? Duration and dissent matter. |
  | **8** | **Distinctions Not Collapsed** | Non-negotiable | Case-pairs: (1) Claim existence (does a citizen abroad have *any* disaster relief claim?) vs. strength (is it weaker than a resident's?). (2) State legitimacy (why borders here?) vs. partiality (why spend more *inside* them?). |
  | **9** | **Bound Against Abuse**      | Non-negotiable  | A state defines citizenship ethnically, excluding generations of resident minorities. Does the account condemn this, or could "shared identity" justify their exclusion from social programs? |
  | **10**| **Uptake Under Disagreement**| Non-negotiable  | Legislators know redirecting farm subsidies to famine relief abroad is impartially better, but voters demand domestic support. May they comply? What institutional cost applies? |
  | **2** | **Degrees & Nested Jurisdictions** | Negotiable     | Flood relief: allocate between a wealthy province in your federation (e.g., Bavaria in Germany) and a poorer region in a neighboring state (e.g., Western Ukraine). Must the account weigh sub-national ties? |
  | **3** | **Conflicting Group Loyalties** | Negotiable     | A dual French-Algerian citizen when France restricts visas for Algerians. Must the state prioritize her French citizenship over her Algerian ties in social aid eligibility? |
  | **11**| **Resource Constraints & Prioritization** | Non-negotiable | A fixed healthcare budget: rationing between life-saving treatment for citizens vs. cheaper preventive care for non-citizen migrants with acute needs. How does partiality interact with efficiency? *(Added)* |
  | **12**| **Institutional Feasibility** | Non-negotiable | Can border agencies/benefits administrators apply the theory’s criteria (e.g., "reciprocity depth") without constant moral philosophy arbitration? Test with automated pension eligibility checks. *(Added)* |

  ### Incompatible Requirement Pairs
  **1+2+10 Cannot Be Jointly Satisfied**  
  - **Conflict**: Contrastive sensitivity (1) demands fine-grained distinctions (e.g., residency vs. citizenship). Degrees/nesting (2) requires ordering claims across jurisdictions (local > national > foreign). Uptake (10) demands stability under noncompliance (e.g., voters rejecting cross-jurisdictional transfers).  
  - **Why incompatible**: A theory satisfying (1) will identify edge cases (e.g., long-term non-citizen residents) with claims rivaling weak compatriot ties (e.g., non-resident citizens). But (2) often assumes transitive hierarchies (local > national > global). When voters (per 10) reject obligations to "weak" compatriots (e.g., non-residents) or nested units (e.g., aiding poorer provinces), officials face incoherence: enforcing fine distinctions violates democratic will, while deferring to voters collapses nuanced obligations into crude nationalism. Institutional design requires either abandoning granularity (violating 1) or rejecting democratic responsiveness (violating 10).

  **Most Exclusionary Requirement**  
  - **#7 (Discriminating Ground)** excludes the most otherwise-attractive accounts. Coercion-, reciprocity-, or identity-based theories invariably use surrogates for citizenship. Evidence for failure: if varying citizenship status *alone* (e.g., same resident, same coercion, but non-naturalized) doesn’t alter obligations, the ground isn’t citizenship. Most theories fail this, as they derive partiality from non-citizenship properties (e.g., Rawlsian coercion, Millerian identity).

  ### Theory Family Scorecard (vs. Non-negotiables only)
  - **Coercion/Institution-Based**: Fails #6 (conflates benefiting insiders with coercing outsiders), #7 (ground is coercion, not citizenship), #9 (can’t condemn exclusion if institutions are coercive).  
  - **Relationship/Associative**: Fails #1 (overgeneralizes "shared history"), #7 (ground is association, not citizenship), #9 (any cohesive group could claim obligations).  
  - **Identity/Culture-Based**: Fails #4 (ignores dissent/exit), #7 (ground is identity, not citizenship), #9 (justifies exclusionary nationalism).  
  - **Thoroughgoing Egalitarian-Cosmopolitan**: Fails #5 (denies permission to favor compatriots), #10 (cannot guide institutions where partiality is politically entrenched).  

  ### Notes on Revisions
  -   **Demoted #2 & #3**: While practically relevant, demanding transitive degrees or conflict resolution may overreach for a *minimal* institutional theory. They remain negotiable.
  -   **Added #11 (Resource Constraints)**: Essential for spending decisions; omitted in your list.
  -   **Added #12 (Institutional Feasibility)**: Critical for implementation; tests administrative burden.
  -   **Repositioned #5 First**: Deontic structure is foundational for institutional action.
  -   **"Prejudice" Removed**: Your list had no purely camp-driven requirements; all cases are institutionally motivated.
