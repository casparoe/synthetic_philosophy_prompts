  The letter from the Calibration Office lay on the kitchen table beside the rejected Heating Subsidy form.  
  "Look at this, Tom," Maureen sighed, tapping the page. "They say because my 'floor' was three weeks in the ICU after the crash, and my 'span' is the difference between that and a day where I can just about manage the stairs without crying... they say a cold house only nudges me down 0.2 utils below my 'fine' baseline. 'Insufficient welfare deficit for intervention.'"  

  Their teenage daughter, Chloe, looked up from her homework. "But Mum, you're always cold now. Your hands are blue."  

  "I know, love. But according to the scale, me being freezing and in pain all day is still *closer* to my 'fine' day than... well, than Mrs. Henderson down the road getting a parking ticket is to *her* 'floor', which was a disappointing cruise. Her 'span' is tiny. So her fine is *really* fine. A ticket drops her utils hard. She qualifies."  

  Tom stirred his tea. "Right. So they won't help keep you warm because you've already adjusted to misery. But they'll pay to keep Mrs. Henderson perfectly happy."  

  Chloe frowned. "So... because Mum remembers being *nearly dead*, now being just *really miserable* doesn't count?"  

  Maureen pushed the letter away. "Precisely. My zero was set too low. And my unit of suffering is too damn big."  

  (Word count: 198)  

  **How it hits the brief:**  
  *   **Setup/Punchline:** The rejected letter and family conversation reveal the absurd verdict (denying heating aid to someone freezing).  
  *   **Why the Machinery Fails:**  
      *   **Arbitrary Zero/Unit:** Maureen’s past trauma (ICU) sets a catastrophically low "floor," making her current severe suffering (cold + pain) only a minor dip ("0.2 utils") from her "fine" day (which is already miserable). Mrs. Henderson's trivial "floor" (bad cruise) means minor setbacks (parking ticket) create large util drops. The calibration itself dictates the outcome.  
      *   **Level vs. Gain Came Apart:** Maureen's *current level* (freezing, in pain) is objectively terrible, but the system only cares about the *change* (gain/loss) relative to her personalized scale. Her potential *gain* from heating (warmth) is deemed small because she's calibrated to endure so much.  
  *   **Dry & Matter-of-Fact:** The tone is resigned conversation, not preachy explanation.  
  *   **Common Sense Rejection:** Anyone understands denying heating to someone freezing because "she's used to worse" is cruel nonsense.  
  *   **No Jargon/Philosophers:** Uses only the fictional terms "Calibration," "utils," "floor," "span," "fine," "welfare deficit" – all defined contextually.  
  *   **Recognizable Problem:** Clearly illustrates the core issue of incommensurable scales and the level/gain conflict without academic references.
