  The family-at-table idea feels relatable. Imagine a parent denied heating subsidy because their "fine day" is set too low (e.g., chronic pain means warmth barely registers). The punchline? The child points out the cruelty—mom’s "fine" is freezing, but the system sees no gain. That exposes both flaws: the arbitrary "span" and how gains mask current suffering.  

  Word count tight? Yes, but doable. Setup: letter arrives denying aid. Punchline: kid’s raw observation. No jargon, just cold logic vs. human reality. User’s "common sense rejects" nailed.  

  Test: Would someone who’s lived this wince? Yes. Does it *teach* nothing, just *reveals*? Yes. Perfect.
