  For originalists: Their main objection will be the compromise clauses (3/5, fugitive slave, etc.) that explicitly protected slavery. I need to acknowledge this upfront but emphasize Douglass's "unmistakable language" threshold—he argued those clauses were concessions, not affirmations. The soft spot? Originalists might counter that everyone in 1789 understood these as pro-slavery. 

  For historians: They'll accuse me of doctrinal anachronism—turning anti-slavery rhetoric into legal methodology. I should concede that Spooner/Goodell were marginal but insist Douglass systematized their ideas. The vulnerability? If they prove Douglass never framed it as "canons," I'm in trouble. 

  For the theorist: They'll pounce on the circularity—do canons *do* work or just dress up conclusions? Must stress that canons force engagement with textual ambiguity. This is the hardest objection; if pressed, I'd admit the presumption needs independent justification. 

