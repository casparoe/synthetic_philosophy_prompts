  We are to defend the position that the knowability paradox is best resolved by restricting the knowability principle to epistemically neutral propositions, defined as those whose truth value is invariant across worlds that agree on all non-epistemic facts (i.e., they differ only in what is known). The principle is (KP-EN): ∀p((EN(p) & p) → ◇Kp).

  We must argue that:
  1. (KP-EN) is principled and not ad hoc.
  2. It survives the derivation (i.e., the Fitch derivation does not go through for EN propositions).
  3. It still carries anti-realist weight because contested truths (remote past, unobservable, other minds) are EN.
  4. We must include one worked illustration.
  5. Answer three objections: ad hocness, self-application, and the surrogate operator.

  Additionally, we must be explicit about costs and what the defender gives up.

  Then, we provide a JSON summary as specified.

  Let's proceed step by step.

  **1. The Case for (KP-EN)**

  The knowability paradox, as derived from the unrestricted knowability principle (KP), leads to the absurd conclusion that all truths are known. This derivation is sound, so we must reject (KP). The response we advocate restricts (KP) to epistemically neutral (EN) propositions. A proposition p is EN if and only if its truth value does not change when we alter only the epistemic facts (i.e., who knows what and when) while holding fixed the non-epistemic facts. The restricted principle (KP-EN) states that if p is true and epistemically neutral, then it is possible that p is known.

  This restriction is principled. The anti-realist intuition underlying knowability is that truth is tied to our cognitive capacities: what is true must be in principle accessible to us. However, the paradox shows that this intuition, when applied without restriction, leads to absurdity. The EN restriction captures the core idea that the anti-realist is concerned with the way the world is independently of our epistemic state. Anti-realism typically targets domains such as the remote past, the unobservable, and other minds, which are about objective reality and not about our knowledge. These domains are EN because their truth values are fixed by the non-epistemic facts. For example, whether a dinosaur had a certain feature is a matter of the past, and that fact does not change if we come to know it or not. Thus, (KP-EN) preserves the anti-realist's intended scope.

  To illustrate, consider a truth q: "There was a volcanic eruption on Mars one billion years ago." This proposition is about the past and is EN because its truth value is determined by the historical state of Mars, which is a non-epistemic fact. If q is true, then (KP-EN) says it is possible that we come to know q (e.g., by discovering geological evidence). However, note that the proposition u = (q & ¬Kq) is not EN. Why? Because if we change the epistemic facts so that q becomes known, then u becomes false (since ¬Kq becomes false) even if the non-epistemic facts (the volcanic eruption) remain the same. Thus, (KP-EN) does not apply to u, and the derivation of the paradox is blocked.

  **2. Answering Objections**

  *Objection 1: Ad hocness.* The definition of EN explicitly references knowledge (K) via invariance under permutations of the knowledge distribution. This might seem tailored to avoid the paradox. However, the condition is not ad hoc because it captures a natural distinction: EN propositions are those that are purely about the world and not about our knowledge of it. Moreover, a syntactic ban on knowledge vocabulary (like banning propositions containing 'K') would not suffice. For instance, the proposition "No one knows that snow is white" does not contain K applied to itself, but it is not EN because its truth value depends on the epistemic state. The invariance condition, by contrast, is semantic and catches all such cases. Furthermore, the EN condition does independent work: it aligns with the anti-realist's own demarcation between objective truths (which are knowable) and epistemic truths (which are not necessarily subject to the same knowability principle).

  *Objection 2: Self-application.* Is (KP-EN) itself epistemically neutral? (KP-EN) is a generalisation about all propositions, so we must check whether it is EN. Consider two worlds w1 and w2 that agree on non-epistemic facts but differ in epistemic facts. In w1, (KP-EN) might be true (if every true EN proposition is knowable), but in w2, it might be false (if some true EN proposition is not knowable). The truth of (KP-EN) depends on the modal facts about knowability, which are not fixed by non-epistemic facts alone. Therefore, (KP-EN) is not EN. This means that, by its own standard, we cannot claim to know (KP-EN). This is a cost. However, we can still rationally believe (KP-EN) and provide arguments for it. The anti-realist might hold that (KP-EN) is a regulative principle of our epistemic practices, and we are justified in accepting it without claiming to know it. Alternatively, if one insists that (KP-EN) is EN (arguing that the modal facts about knowability are non-epistemic), then we can claim to know it. But the safer route is to concede that (KP-EN) is not EN and thus not knowable by its own lights, but maintain that this does not undermine its truth or our justification for believing it.

  *Objection 3: Surrogate operator.* Suppose we let Wp mean "conclusive evidence for p is available", and we assume that evidence-availability is a non-epistemic fact. Then, if q is EN, so is (q & ¬Wq). Now, if we run the derivation with W, and we assume the bridge premise Kp → Wp (because knowledge requires evidence), we get: if (q & ¬Wq) is true, then by (KP-EN) it must be possible to know (q & ¬Wq). But knowing (q & ¬Wq) entails Kq and K¬Wq, and by factivity, ¬Wq. However, Kq → Wq (by the bridge premise), so we have Wq and ¬Wq — contradiction. Thus, (q & ¬Wq) cannot be true, so for every EN truth q, Wq. This would mean that conclusive evidence is available for every EN truth, which is highly implausible and seems to collapse into the original paradox.

  To block this, note that the bridge premise Kp → Wp is not beyond question. The anti-realist might deny that knowledge requires evidence that is available in the sense of W. Alternatively, we can challenge the assumption that evidence-availability is non-epistemic. If the availability of evidence depends on our epistemic situation, then it might not be invariant under changes in the knowledge distribution. Therefore, Wp might not be non-epistemic. We can then strengthen EN by requiring that a proposition must be invariant not only in truth value but also in the evidence available, or we can deny that evidence-availability is non-epistemic. The cost is that we must either reject the bridge premise (which is plausible) or complicate the definition of non-epistemic facts. The best response is to deny that evidence-availability is non-epistemic. For example, the availability of evidence might depend on contingent features of our cognitive capacities or investigative efforts, which are part of the epistemic realm. Thus, (q & ¬Wq) is not EN because changing the evidence availability (an epistemic fact) can change its truth value. Then (KP-EN) does not apply to it, and the derivation fails.

  **3. Concessions**

  The defender of (KP-EN) must give up the unrestricted knowability principle. This means that there can be unknown truths, but they are of a special kind: non-EN truths. These are typically propositions that are about our ignorance (like u = q & ¬Kq). Moreover, (KP-EN) cannot be used to argue that there are no unknown truths at all, because the non-EN truths may remain unknown. But the anti-realist can still maintain that all objective truths (the EN ones) are knowable. Also, we must concede that (KP-EN) itself might not be knowable, as per the self-application objection.

  **4. Worked Illustration**

  Take the truth: "There are mountains on the far side of the moon." This is about a spatial region that was unobservable to humans before space exploration. It is EN because its truth depends only on the physical geography of the moon, which is non-epistemic. If it is true, then (KP-EN) says it is possible to know this (as indeed we now do via satellites). However, consider the proposition: "There are mountains on the far side of the moon and no one knows it." This is not EN because if we change the epistemic facts (so that someone knows it), the proposition becomes false. Therefore, (KP-EN) does not apply to it. We cannot infer that it is possible to know this conjunction, and indeed it is impossible (because if you know it, you know the first part and the second part becomes false). So (KP-EN) is not committed to its knowability.

  **Closing**

  The position we defend gives up the universality of the knowability principle but maintains it for the domain of objective reality. This preserves the anti-realist's core commitment while avoiding paradox. The cost is that we must accept that some truths (those that are not EN) might be unknowable, and we may not be able to claim knowledge of (KP-EN) itself.

