  ### Case for Restricted Knowability

  The derivation of the knowability paradox compels rejection of the unrestricted knowability principle (KP). The principled resolution restricts KP to epistemically neutral propositions, yielding (KP-EN): ∀p((EN(p) & p) → ◇Kp), where EN(p) holds iff p’s truth value is invariant across worlds differing only in knowledge distributions (i.e., non-epistemic facts are identical). This restriction is not ad hoc but reflects the anti-realist core: truth is grounded in objective reality, accessible in principle, yet separable from epistemic states. Crucially, contested truths—about the remote past, unobservable entities, or other minds—are epistemically neutral. For instance, take q: "Caesar exhaled exactly ten minutes before his assassination." This is EN, as its truth depends solely on historical events, not knowledge. By (KP-EN), if q is true, ◇Kq—knowledge is possible via evidence (e.g., a hypothetical time-travelling sensor). However, (KP-EN) does not apply to the Fitch conjunction u = (q & ¬Kq), as u’s truth varies with knowledge distributions: if q were known, u would be false despite identical historical facts. Thus, the paradox is blocked, while anti-realism retains force for objective domains.

  **Ad hocness objection addressed:** EN’s reference to K might seem circular, but invariance under knowledge permutations captures a pre-theoretic distinction between objective and epistemic truths, avoiding syntactic shortcuts. A mere ban on knowledge-vocabulary fails: "No epistemic agent exists" lacks K but is not EN, as its truth changes if agents exist. EN naturally excludes Fitch conjunctions by design, aligning with anti-realism’s focus on mind-independent reality.

  **Self-application resolved:** (KP-EN) is not epistemically neutral. Its truth depends on modal facts about knowability, which are not fixed solely by non-epistemic facts. Consider two worlds with identical non-epistemic facts but differing in whether some EN truth is knowable. (KP-EN)’s truth value may differ across them, violating EN. Thus, (KP-EN)’s defender cannot claim to know it by its own standard. This is a cost, but not fatal: (KP-EN) can still be justifiably believed as a regulative principle guiding inquiry, without self-applicability.

  **Surrogate operator rebutted:** The derivation replacing K with W (where Wp: "conclusive evidence for p is available") fails. Even if evidence-availability is deemed non-epistemic (a concession), the bridge premise Kp → Wp is suspect. Anti-realism need not equate knowledge with evidence-availability; evidence might be accessible without being accessed. Crucially, Wp itself may not be non-epistemic: evidence availability often depends on contingent epistemic conditions (e.g., scientific tools). Thus, (q & ¬Wq) is not EN, as altering evidence access changes its truth. (KP-EN) does not apply, blocking the derivation. No strengthening of EN is needed, preserving its current form without additional cost.

  **Concessions:** The defender must relinquish the universality of knowability: non-EN truths (e.g., "q is unknown") may be unknowable. (KP-EN) cannot support global anti-realism (e.g., "no unknown truths exist"), as it permits unknowable truths in non-objective domains. Additionally, (KP-EN)’s own unknowability limits its epistemic authority.

