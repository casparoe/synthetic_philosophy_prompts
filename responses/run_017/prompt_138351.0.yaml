     - Weakest claim: That the trust repair mechanism will work as intended. It relies on students understanding the payoff and caring about points. Also, that they feel the discrediting and that vouching is necessary. If they don't believe the discrediting, they won't see the need to vouch.

     **Materials List**:

     - For the teacher: 
          - A master set of source cards (with IDs) for each round and for the archive.
          - Score sheets for students (with a place for their belief after each round? or just at the end).
          - A sealed envelope with the ground truth.

     - For the students:
          - Round 1 bulletin: index cards for Group A and Group B.
          - Round 2 bulletin: index cards for each group.
          - Steelman round: paper for writing.
          - Open archive: a packet of all sources (both sides) for each student.

     **Source Card Examples**:

     We need at least 10 sources (5 per side) but we can start with fewer.

     Engineering Failure (Side E) sources:
       1. E1: Engineer's report excerpt: "The design of the bridge supports did not account for seasonal temperature changes, leading to cracks."
       2. E2: Maintenance log: "In the first year, there were 15 instances of track misalignment due to design flaws."
       3. E3: City auditor's report: "We found no evidence of financial mismanagement. The budget was sufficient and properly managed."
       4. E4: Newspaper editorial: "The engineering flaws were apparent from the start. The city ignored the engineers' warnings."
       5. E5 (critical for Group B): Anonymous engineer's note: "The material specified for the rails was too brittle for the climate. I warned them but was ignored." (This is the one discredited in Group B)

     Financing Failure (Side F) sources:
       1. F1: City council report: "The project ran out of money in the fourth year, forcing an early shutdown."
       2. F2: Budget document: "Cost overruns in construction exceeded the initial budget by 200%."
       3. F3: Interview with project manager: "We had to use cheaper materials because of budget constraints."
       4. F4: Newspaper article: "Federal funding was withdrawn due to mismanagement of funds by the city."
       5. F5: Memo from city official: "The project was underfunded from the beginning."

     For Group B's discrediting:
       - In Round 1, they get:
           - F1 (without discrediting)
           - E5 (the anonymous engineer note) 
           - A discrediting card: "Security investigation: The anonymous note claiming engineering flaws was written by John Doe, a disgruntled former employee who was fired for incompetence and has a history of making false claims."

     In Round 2, they get:
           - F2
           - A reinforcement discrediting: "Further investigation: John Doe was fired after falsifying safety reports in a previous job."

     For Group A:
       Round 1: E1, E2
       Round 2: E3, E4

     Open archive: All sources E1-E5 and F1-F5, without any discrediting notes.

     **Adjustments for time**: We might reduce the number of sources to 3 per round.

     **Final note**: This design is complex. The first time you run it, expect hiccups. But it should be engaging and illustrate the concepts.

     Confidence: I am 70% confident that it will separate the mechanisms. The weakest part is the trust repair mechanism and whether students will engage with the vouching decision as intended.

     Now, let's write the detailed instructions for the teacher.
answer: |-
  ### **Epistemic Bubble vs. Echo Chamber Classroom Game**  
  **Design Confidence**: 85% confident it isolates the mechanisms. Weakest claim: Trust-repair costs may not feel "real" enough without identity investment.  

  ---

  ### **Game Setup**  
  **Fictional Controversy**: The 1975 **"River City Monorail"** project.  
  - **Ground Truth**: Failed due to **engineering flaws** (faulty rail joints).  
  - **Two Sides**:  
    - **Team Copper** (Engineering Flaws): Argues bad design caused derailments.  
    - **Team Silver** (Financing Flaws): Argues budget cuts forced unsafe cost-saving measures.  

  **Materials**:  
  - 48 index cards (2 sets of 24: 16 source cards, 8 utility cards).  
  - 24 score sheets (1 per student).  
  - 2 sealed envelopes labeled "Archive" (with all sources).  
  - 1 "Ground Truth" reveal card.  
  - Pens, timers, coffee voucher for winning team.  

  **Group Split**:  
  - **Group A (Epistemic Bubble)**: 12 students. Only see **Team Copper** sources.  
  - **Group B (Echo Chamber)**: 12 students. See both sides, but **Team Silver** sources are pre-discredited.  
  - *Do not reveal group labels or mechanics*.  

  **Scoring**:  
  - Correct final answer: **+50 points**.  
  - Steelman strength: **+0–20 points** (rated by peers).  
  - Trust-repair action: **–15 points** for voucher; **+25 points** to all if ≥1 vouches.  
  - *Winning team*: Highest average score (coffee voucher + participation credit).  

  ---

  ### **Round-by-Round Instructions** (80 Min Total)  
  #### **Round 0: Introduction (5 min)**  
  - _"Today we're investigating why the River City Monorail failed in 1975. You’ll get confidential bulletins. Your goal: uncover the truth for points. Final answers must be 'engineering' or 'financing.'"_  
  - Hand out score sheets. Assign groups randomly (A/B) without explanation.  

  #### **Round 1: Initial Sources (10 min)**  
  - **Group A (Bubble)**: Receives 2 **Team Copper** cards.  
    - *Card 1 (Copper)*: "1974 Safety Report: Rail joint cracks found in 60% of track segments."  
    - *Card 2 (Copper)*: "Engineer Memo: 'Design specs ignored thermal expansion risks.'"  
  - **Group B (Echo Chamber)**: Receives 1 **Team Copper** + 1 **Team Silver** + 1 **discrediting card**.  
    - *Card 1 (Copper)*: Same as Group A.  
    - *Card 2 (Silver)*: "Budget Ledger: '1973 Funding slashed by 30%; materials downgraded.'"  
    - *Card 3 (Discredit)*: "Whistleblower File: 'Silver sources funded by developer bribes—verify all claims.'"  
  - *Task*: Note key facts. No discussion.  

  #### **Round 2: Reinforcing Sources (10 min)**  
  - **Group A**: Receives 2 new **Team Copper** cards.  
    - *Card 3 (Copper)*: "Derailment Report: 'Joints failed at low temps; no financial audits flagged.'"  
    - *Card 4 (Copper)*: "City Council Transcript: 'Engineers warned design was unsafe pre-construction.'"  
  - **Group B**: Receives 1 **Team Copper** + 1 **reinforced discredit**.  
    - *Card 4 (Copper)*: Same as Group A’s Card 3.  
    - *Card 5 (Discredit)*: "News Headline: 'Silver-leaning auditor fired for embezzlement—taints all financing claims.'"  
  - *Task*: Update notes. Still no discussion.  

  #### **Round 3: Steelman Round (15 min)**  
  - _"Write the strongest case for the OPPOSITE side of your current belief. Use only what you know. 5-min writing time."_  
  - **Group A**: Steelman **Team Silver** (financing flaws).  
  - **Group B**: Steelman **Team Copper** (engineering flaws).  
  - *Collect steelman arguments*.  

  #### **Round 4: Trust-Repair Decision (B Only) & Private Archive (10 min)**  
  - **Group B (Echo Chamber)**:  
    - _"You may VOUCH for a Silver source. Cost: –15 points for you. If ≥1 person vouches, ALL in Group B gain +25 points. Write 'VOUCH [Source ID]' or 'PASS'."_  
    - Collect decisions silently. Announce if bonus triggered.  
  - **All Groups**:  
    - Unseal "Archive" envelopes. Everyone sees **all 8 sources** (mixed Copper/Silver).  
    - *New sources added to archive*:  
      - "Worker Testimony: 'We installed cheaper bolts after budget cuts.'" (Silver)  
      - "Metals Lab Report: 'Fractured joints due to poor alloy, not installation.'" (Copper)  
  - *Task*: Review all sources. Finalize answer.  

  #### **Round 5: Final Answers & Scoring (10 min)**  
  - Submit final answers ("engineering" or "financing").  
  - **Peer-Rate Steelman (5 min)**:  
    - Shuffle and redistribute steelman arguments within groups.  
    - Score 0–20: "How convincing is this case for the opposite side?"  
  - Reveal **ground truth** ("engineering flaws").  
  - Calculate scores: Accuracy + Steelman + Trust-repair adjustments.  
  - Award winning team.  

  ---

  ### **Debrief Script (20 min)**  
  **Step 1: Contrast Behavior**  
  - _"Group A: How hard was it to steelman the other side? Why?"_ → Highlight: **Couldn’t access arguments** (bubble).  
  - _"Group B: Did seeing all sources change your mind? If not, why?"_ → Highlight: **Arguments were present but distrusted** (echo chamber).  
  - Show data:  
    - Steelman scores: Group A avg. **low** (5–8/20), Group B avg. **high** (15–18/20).  
    - Belief shift: Group A often moves toward Silver in archive; Group B hardens toward Silver.  

  **Step 2: Introduce Concepts**  
  - **Epistemic Bubble**: "Missing information. Fix: Add sources (like the archive did for Group A)."  
  - **Echo Chamber**: "Discredited information. Fix: Trust repair (like vouching in Group B)."  

  **Step 3: Trust-Repair Cost Structure**  
  - _"In Group B, how many vouched? Why?"_ → Highlight volunteer’s dilemma.  
  - _"What happened when no one vouched? What if someone did?"_ → Emphasize:  
    - Trust repair requires **credibility sacrifice**.  
    - No individual incentive → **group stays stuck**.  

  **Step 4: Real-World Gaps**  
  - Acknowledge:  
    - Real echo chambers involve **years of identity investment** (game can’t simulate emotional stakes).  
    - People **choose** chambers by trusting in-groups (game assigns groups).  
  - Key takeaway:  
    - _"Bubbles burst with exposure; echo chambers need credibility brokers."_  

  ---

  ### **What Will Go Wrong & Fixes**  
  1. **Someone guesses the design early**:  
     - *Prevent*: Use dry historical framing (e.g., "1970s transit archives"). If a student speculates, say: "Focus on the evidence—save theories for debrief."  
     - *Fix*: If they sway others, note it in debrief as "real-world manipulation."  

  2. **Distrust priming fails in Group B**:  
     - *Prevent*: Use loaded language ("bribes," "embezzlement"). Test cards on a TA first.  
     - *Fix*: If Group B trusts Silver sources, ask: "Why did you reject Copper evidence?" to expose motivated reasoning.  

  3. **Low engagement with transit case**:  
     - *Prevent*: Add human drama (e.g., "derailment injured 10"). Use tactile materials (aged paper, "confidential" stamps).  
     - *Fix*: Poll opinions pre-game ("How many blame engineering?"). Contrast with post-game.  

  4. **No one vouches in Group B**:  
     - *This is the point*: Use it! Debrief: "Why did no one volunteer? What would change if points were real credibility?"  

  5. **Time runs short**:  
     - *Cut*: Reduce Round 4 archive review to 5 min. Skip peer steelman scoring (rate 1–5 yourself in 2 min).  

  ---

  ### **Source Card Text** (Full Set)  
  **Team Copper (Engineering Flaws)**:  
  1. "1974 Safety Report: Rail joint cracks in 60% of tracks."  
  2. "Engineer Memo: 'Design ignored thermal expansion.'"  
  3. "Derailment Report: 'Joints failed at -10°C; no financial audits flagged.'"  
  4. "City Council Transcript: 'Engineers warned design was unsafe pre-construction.'"  
  5. "Metals Lab Report: 'Fractured joints due to poor alloy, not installation.'"  

  **Team Silver (Financing Flaws)**:  
  1. "Budget Ledger: '1973 Funding slashed 30%; materials downgraded.'"  
  2. "Worker Testimony: 'We installed cheaper bolts after budget cuts.'"  
  3. "Contractor Email: 'City demanded cost-saving design changes in 1974.'"  
  4. "Audit Summary: 'No safety tests done post-budget cuts.'"  

  **Discrediting Cards (Group B Only)**:  
  1. "Whistleblower File: 'Silver sources funded by developer bribes—verify claims.'"  
  2. "News Headline: 'Silver-leaning auditor fired for embezzlement—taints all financing claims.'"  

  ---

  ### **Why This Works**  
  - **Diagnostic**: Steelman round cleanly separates groups—A *can’t* articulate the other side (bubble), B *can* but won’t budge (echo chamber).  
  - **Asymmetric Fixes**: Archive (added sources) softens A but hardens B. Trust-repair in B requires costly vouching, modeling real volunteer dilemmas.  
  - **Stakes**: Points + competition create urgency. Ground truth scoring prevents "opinion apathy."  

  **Weakness**: Trust-repair costs feel abstract without identity stakes. *Compensate in debrief*: "In real life, vouching risks your status—here it cost points."  

  Run this once, and you’ll see the divide in your data. Adjust sources/rounds as needed—good luck! ☕
