     However, the branch count doesn appear in the payout. So if they see that N_A is very small (say 1) and N_B is very large, they might think outcome A is less likely? But the probability of A is still p.

     We want them to see that branch count is irrelevant. But the problem is that in the erasure case, they will be merged, and then branch count will be set to 1 for both outcomes? So we need to change the branch count without changing the weights.

     ### Revised Game with an Emphasis on the Dial and Erasure

     Perhaps we can simplify the payout to not depend on the branch count or the branch weight at all. Instead, we can make the branch count affect the future in the erasure part.

     Let's focus on the two wrinkles.

     ** Wrinkle 1: The dial **

     - In each round, you choose weights (p, 1-p) and then choose branch counts (N_A, N_B) such that the branch counts can be any positive integers as long as they are consistent with the weights (which they are not, because the weights are given and the branch counts are arbitrary). In MWI, the branch count is not fixed by the weights. So you can choose to have, for example, for the same weights, sometimes many branches for B, sometimes few.

     - You then ask the participants to bet. After they bet, you assign them to branches by the branch weights (so they experience the weight-based probability).

     - The payout is simply: if they bet on the correct outcome, they double their bet on that outcome (or get even odds). But then the branch count doesn't affect the payout. So why would they care about branch count?

     We want them to care because in the many-worlds view, they will split into copies, and they might care about the number of copies. So perhaps we need to make the tokens in each branch separate for the future. But that is complicated.

     Given the time constraints, let's try a simpler approach.

     ### Recommended Approach: The Casino with Branching and Payout by Weights

     - Each participant starts with 100 tokens.
     - Each round, you (the facilitator) choose:
          - The weights: for simplicity, let's use two outcomes, weights w and 1-w. Call w the weight for outcome A.
          - The branch counts: N_A and N_B. You choose these so that the weight per branch for A is w/N_A, for B is (1-w)/N_B. 
     - Participants bet: they split their tokens between A and B.
     - Then, you generate the branches. You have a spinner that lands on a branch with probability proportional to the branch weight. You spin for each participant, so they are assigned to a branch.
     - In their branch, if it is an A-branch and they bet b on A, then they win: tokens won = b * (1 / w) * (something to normalize) 
     - To normalize, note that the expected won for a bet of b on A should be b. So if they are in an A-branch (which happens with probability w), they should win an amount such that w * win = b, so win = b / w.
     - Similarly, for B: win = b / (1-w) if they bet on B and win.

     Example: w=0.6, then if they bet 100 on A and win, they win 100 / 0.6 = 166.67 tokens. If they lose, they lose the 100.

     Then, if they bet b on A, expected tokens from the bet: w * (b / w) + (1-w)*0 = b.
     So they break even.

     Now, how does branch count enter? It doesn't in this calculation. The branch count is used to determine the assignment to branches, but only via the weights. The participants see the branch counts (N_A and N_B) but they don't affect the assignment or the payout. So why would the participants care about branch count?

     We want them to consider branch count as a candidate for probability. So we can ask them, before the spinner, to discuss how they will bet. Some might say: "I see there are more branches for B, so I should bet on B." But then you can show that it doesn't matter because the assignment is by weight, not by branch count.

     Then, in the discussion, you can say: "In the many-worlds interpretation, you will split into copies in each branch. So after the measurement, there will be N_A copies that see A and N_B that see B. If you care about the number of copies, you might bet based on that. But the casino payout is based on the branch weight, so you lose if you do that."

     But then the physics person might say: "But in quantum mechanics, the probability is given by the weight, not branch count." We want to avoid that.

     Perhaps we can have the payout not be monetary, but rather assign a utility that depends on the number of copies? But that is what the erasure case will do.

     ### The Erasure Case

     In the erasure case, after the branch assignment, you announce that the measurement will be reversed, and the branches will be recombined. Then you ask if they want to change their bet.

     In this case, after recombination, there is only one copy, and that copy will have placed a bet and then the measurement is undone. So what should the payout be? You might say that the outcome never happened, so no payout? Or you might say that we look at the bet and then payout based on the weight as if it had happened? But then why change the bet.

     The idea is that if they branch into many copies, and then recombine, then the only thing that matters is the bet that was placed before the branching, and then after recombination, they are one person who has the average of the tokens? or what?

     This is tricky.

     A better erasure case: after branching, each copy in each branch has won or lost tokens. But then we recombine. How do we recombine the tokens? We might average them? Or sum them? 

     - If we average, then the recombined person has tokens = (1/N) * sum tokens_in_branches.
     - If we sum, then it would be multiplied by the number of branches, which is not physical.

     In quantum mechanics, when you reverse, you get back to the original state. So perhaps you should be as if the measurement never happened.

     So in the game, if you reverse the measurement, then we ignore the outcome and no tokens are won or lost. The bet is void.

     Then, in the erasure round, you: 
          - Have them bet.
          - Branch (assign to branches by weight).
          - Then, before revealing the outcome or doing payout, you announce that you will reverse the measurement.
          - Then you recombine: the participant is back to one, and their tokens are unchanged.

     Then, why would they care about the bet? Because if the measurement is reversed, the bet is void. So they should be indifferent to how they bet.

     But then, if they know in advance that there is a chance of reversal, they might bet differently.

     So let's have rounds where sometimes you reversal, sometimes not. You can roll a die to decide.

     In rounds without reversal, they care about the outcome and the payout.
     In rounds with reversal, they don't.

     The catch: if they are a utilitarian that cares about the sum of tokens over all copies, then in the event of no reversal, they want to maximize the sum over copies. In that case, for a bet of b on A, if outcome A happens, then in every A-branch, they win b/w, and there are N_A branches, so total tokens won in A-branches = N_A * (b/w) for the A-bet. But they also might have bet on B, which is 0 in A-branches. But this is messy.

     Given the complexity, and the time, perhaps we should keep the game as follows:

     ## Final Design for the Game

     We will have a few rounds (3-4) to keep within time.

     ### Round Procedure
     1. You announce the weight for outcome A (p) and outcome B (1-p). (Use a whiteboard or projected slide.)
     2. You then announce the branch counts: N_A and N_B. Choose N_A and N_B. To make it striking, for a given p, set N_A to be small and N_B large if p is large, and vice versa.
        Example: 
          - Round 1: p=0.9, N_A=2, N_B=18 (so branch weight per branch: A: 0.45, B: 0.05)
          - Round 2: p=0.9, N_A=10, N_B=10 (A: 0.09, B: 0.01)
          - Round 3: p=0.1, N_A=10, N_B=10 (A: 0.01, B: 0.01)
          - Round 4: p=0.5, N_A=1, N_B=99 (A:0.5, B:0.00505)

     3. Participants bet: they write on a slip how many tokens on A and how many on B. They can use any method.
     4. You then simulate the branching: for each participant, you draw a branch at random using the branch weights. To do this, you can have a spinner or use a random number generator.
        - The probability of outcome A is p, and within outcome A, each branch is equally likely (probability 1/N_A).
        - But for simplicity, since the branch-specific weight is not used in the payout, you can just use outcome A with probability p, outcome B with probability 1-p, and then within outcome A, assign to one of the N_A branches uniformly.
     5. In the branch, if the outcome is A and they bet b on A, they win: b * (1/p) tokens.
        If outcome is B and they bet b on B, they win: b * (1/(1-p)) tokens.
        They lose the tokens bet on the wrong outcome.
        Their new token count = current tokens - bet on losing outcome - bet on winning outcome + [if won: bet on winning outcome * (1/prob)] 
          = current tokens - bet on losing outcome - bet on winning outcome + bet on winning outcome / p   [if won on A]
          = current tokens - bet on losing outcome + bet on winning outcome * (1/p - 1)

        Example: if they bet 100 on A and 0 on B, and A occurs, then new tokens = old -0 -100 + 100*(1/0.9) = old -100 + 111.11 = old + 11.11.
        If they bet 100 on A and 0 on B, and B occurs, then new tokens = old -100 -0 +0 = old -100.

     6. Record new token counts.

     ### The Erasure Case
     For some rounds, after step 3 (after bets are locked) but before step 4 (branching), you announce that there is a probability of reversal. You can have a separate spinner for whether reversal happens. Say, 50% chance.
     - If reversal happens, then you skip steps 4-5. No branching, no payout. The measurement is reversed, and the tokens remain unchanged.
     - If reversal does not happen, proceed as usual.

     Then, participants may want to change their bet after knowing the possibility of reversal? But you said after bets are locked. So they cannot change. The question is: how should they bet given that there is a chance of reversal.

     In the erasure case, if reversal happens, the bet is void. If not, it counts. So they should bet as if there is no reversal, but scaled by the probability that reversal does not happen.

     But this is getting into decision theory.

     ### Assigning Roles: "Low-weight continuers"

     Assign 2-3 participants to be "low-weight continuers". Their role is to argue during the betting discussion that decision rules should not neglect branches with low weight per branch. For example, in round 4 above, outcome A has only one branch but high weight per branch (0.5), while outcome B has many branches with low weight per branch. The low-weight continuers might say: "There will be many copies of me in B-branches, so even though each has low weight, together they matter." 

     Then, during the erasure case, they might argue that if there is a chance of reversal, branches with many copies might be more likely to be represented in the recombination? But recombination erases the branching.

     ### Timeline for 90 minutes

     - Introduction (10 minutes): Explain the setup of the game. Emphasize that they will bet on outcomes of measurements. The device has two outcomes, A and B, and they will be given two numbers: the weight for A and for B (sum to 1) and also the number of branches for A and for B. Explain the betting and the payout rule: if they bet on the correct outcome, they win tokens in proportion to the inverse of the weight for that outcome. Explain that sometimes, after betting, there might be a reversal. Also, introduce the roles: a couple of people are designated to argue for the low-weight branches. Distribute starting tokens (100 to each).

     - Round 1 (10 minutes): 
          - Weights: p=0.9 for A, branch counts: N_A=2, N_B=18.
          - Betting time: give them 3 minutes to decide and write bets.
          - Then, if no reversal (announce no reversal for this round), do branching and payout. Collect bets and compute new token counts.

     - Round 2 (10 minutes): 
          - Weights: p=0.9 for A, branch counts: N_A=10, N_B=10.
          - Betting time: 3 minutes.
          - No reversal. Branch and payout.

     - Round 3 (10 minutes):
          - Weights: p=0.1 for A, branch counts: N_A=10, N branch counts: N_B=10.
          - Betting time: 3 minutes.
          - This time, after they bet, announce that there is a 50% chance of reversal.
          - Flip a coin for reversal. If reversal, no branching and no change. If not, branch and payout.

     - Round 4 (10 minutes):
          - Weights: p=0.5 for A, branch counts: N_A=1, N_B=99.
          - Betting time: 3 minutes.
          - No reversal. Branch and payout.

     - Discussion (40 minutes): 
          - Start by asking about their experience. Did they develop a strategy? 
          - Map to the philosophical problems:
              1. Self-locating uncertainty: before branching, they know the weights and branch counts, but they don't know which branch they will be in. The branch counts didn't affect the probability of the outcome, only the weights did.
              2. Branch counting seems to fail: if they bet based on branch count, in round 1, they might have bet on B because there are 18 branches vs 2 for A. But outcome A has 90% weight, so it is more likely. In fact, in our payout, if they bet on B and B occurs, they win more (because 1/(1-p)=10) but B only occurs 10% of the time.
              3. Why branch counting needs a preferred grain: in round 2 and round 1, the same weight for A (0.9) but different branch counts. How many branches are there? It's arbitrary. So branch count cannot be used.
              4. The erasure case: in round 3, if there is reversal, the bet doesn't matter. So they should scale their bet by the probability of no reversal. But note: the reversal happens after the bet is placed. In the many-worlds view, if they are going to be reversed, then there is only one copy after, so they should not care about the branching. This shows that a decision rule that cares about the number of future copies depends on what happens in the future.

     ### What will go wrong

     - A physics person might say: "This is just expected utility with the weights as probabilities." We want to avoid that early. So in the introduction, do not use the word probability. Use "weight" and branch count. And in the discussion, steer away from collapse theories.

     - Someone might go fanatical: bet everything on one outcome. In our payout, if they bet everything on A and A occurs, they win: tokens = current + current * (1/p - 1) = current / p. If not, they lose everything. This is a high-risk strategy. It might win big in some rounds.

     - The branch counts might be ignored by some participants because the assignment is by weight. The low-weight continuers are there to bring it up.

     - The eraser case might be confusing. If the reversal happens, nothing occurs. So participants might feel cheated.

     ### What the game can't do

     - It can't explain why the weight is the square of the amplitude. We are using the Born rule implicitly in the payout. To explain that, you will need to lecture about the mathematics of quantum mechanics.

     - It can't show why this is a special problem for no-collapse theories. In collapse theories, the outcome is unique and the probability is given by the Born rule. In the game, we are collapse-like in the assignment (because we assign to one branch) but we are simulating the no-collapse view by having branch counts.

     ### The Debrief

     In the last 5 minutes, you can say:

     "In the Everett interpretation, the world branches. The 'weight' we used is the squared amplitude, and the Born rule says that the probability of finding oneself in a branch is given by that weight. Our game showed that branch counting doesn't work because branch count is arbitrary. The eraser case showed that caring about future copies might depend on whether the branches will be recombined. 

     But why should the decision rule use the weights? One answer is that it is the only way to avoid Dutch books or to be rational. Another is that the weights are the only invariant under the branching grain. 

     However, the deep problem is that in a deterministic theory (like the Everett interpretation without collapse), probability doesn't have an obvious meaning. The best we can do is to show that a rational agent should act as if the weights are probabilities."

     This is a quick summary. You can then suggest further readings (e.g., David Wallace's work on decision theory in Everett).

     ### Materials and Prep

     - Spreadsheet or cards for branch assignment.
     - Random number generator for assignment and for reversal chance.
     - Tokens (could be poker chips or just recorded on paper).
     - Whiteboard for displaying weights and branch counts.

     This design is a compromise. It may work well to stimulate discussion.
answer: |-
  Below is a complete, runnable design for your 90-minute session. The casino setup forces participants to confront the core problems of probability in Everettian quantum mechanics without invoking the Born rule prematurely. The key is to create a game where intuitive strategies (like branch-counting) fail, and the only consistent winning strategy relies on the uninterpreted "magnitude" (squared amplitude).

  ---

  ### **Game Setup: Everett Casino**
  **Core Mechanics**  
  - **Device**: You run a "quantum roulette" with two outcomes: **RED** or **BLUE**.  
  - **Magnitude (κ)**: A number between 0 and 1 printed on each participant’s card (representing |ψ|² for RED). No physics terminology is used; call it "payout weight."  
  - **Branch count mismatch**:  
    - The frequency of RED outcomes across the room is **inversely proportional to κ**.  
    - Example: If κ = 0.9, RED occurs in only 10% of branches, but BLUE occurs in 90%.  
    - Participants experience this via personalized outcome cards.  
  - **Erasure twist**: After bets are locked, you sometimes announce a "reversal" (merging branches). Bets stand, but payouts depend on whether reversal occurs.  

  **Roles to Assign**  
  1. **Low-Weight Continuers (2 people)**:  
     - Argue for strategies that prioritize "not being written off" (e.g., "Even if my branch has tiny κ, I matter!").  
     - Their role prevents groupthink and surfaces objections to branch-counting.  
     - **Risk of backfire?** Minimal. They’re assigned to force engagement, not to "win" debates. If they dominate, gently remind: "Your job is to question assumptions, not convert others."  

  **Materials**  
  - **Cards**: Pre-printed with:  
    - **κ** (unique per card, e.g., 0.1, 0.5, 0.9).  
    - **Outcome** (RED/BLUE, determined by κ: RED if rand(0,1) < κ, else BLUE).  
    - **Branch count not listed** (participants infer it from room-wide frequencies).  
  - **Spreadsheet**: For you to generate cards (κ → outcome) with controlled randomness.  
  - **Tokens**: Poker chips or slips of paper (starting bankroll: 100 tokens/person).  
  - **Stakes**: Winning team (by total tokens) is excused from snacks for a month + shared luxury chocolate.  

  **Payout Scheme**  
  - **Without reversal**:  
    - Bet correctly: Win **bet × (1/κ)** if RED, **bet × (1/(1-κ))** if BLUE.  
    - Bet incorrectly: Lose entire bet.  
  - **With reversal**: All bets void (no gain/loss).  
  - **Why this works**:  
    - Branch-counting loses: If κ = 0.9, RED is rare (10% of branches) but pays 1/0.9 ≈ 1.11×. BLUE is common (90%) but pays only 1/0.1 = 10×. Betting on BLUE wins big rarely but loses often.  
    - κ-based betting wins: Betting κ on RED, (1-κ) on BLUE breaks even long-term.  
    - **Sharp separation**: Branch-counters go bankrupt; κ-bethers preserve wealth.  

  ---

  ### **Session Timeline (90 Minutes)**  
  **0:00–0:10 — Intro & Rules**  
  - Explain the casino: "You’ll bet tokens on RED or BLUE outcomes. Each card has a personal κ and outcome. Goal: Maximize tokens."  
  - Assign roles (Low-Weight Continuers get secret briefing: "Protest if strategies ignore small-κ branches").  
  - **Crucial**: Do NOT define κ. Say: "κ is a number affecting payouts. Its ‘meaning’ is part of the game."  

  **0:10–0:30 — Round 1: Dial Problem (κ is Continuous)**  
  - **Step 1**: Distribute cards with κ = 0.9 (RED) and κ = 0.1 (BLUE) to half the room each.  
  - **Step 2**: Participants bet (5 min). Encourage debate: "How will you bet? By how many RED/BLUE cards you see? By κ?"  
  - **Step 3**: Reveal outcomes. Most see BLUE (κ=0.1), few see RED (κ=0.9).  
  - **Step 4**: Payout without reversal.  
  - **Outcome**: Branch-counters lose (BLUE is frequent but pays poorly). κ-bethers win.  
  - **Dial twist**: Ask: "How many branches are there? Can you count them?" Participants realize:  
    - Frequencies depend on how κ is distributed. No "privileged" branch count.  

  **0:30–0:50 — Round 2: Erasure Case**  
  - **Step 1**: New cards with κ = 0.6 (RED) and κ = 0.4 (BLUE).  
  - **Step 2**: Bets locked. Then announce: "Reversal might occur. If it does, branches merge."  
  - **Step 3**: Roll a die: If ≤3, reversal happens (bets void). Else, proceed normally.  
  - **Step 4**: Post-reversal ask: "Want to change bets? Does reversal chance affect your strategy?"  
  - **Outcome**: Low-Weight Continuers protest: "If branches merge, why care about future copies?" Physics majors may insist reversal is irrelevant (seize this for debate).  

  **0:50–1:20 — Round 3: κ vs. Branch Counting**  
  - **Step 1**: Extreme case: Cards with κ = 0.01 (RED) and κ = 0.99 (BLUE).  
  - **Step 2**: Participants bet. Pre-reveal poll: "Who bet by κ? By branch count?"  
  - **Step 3**: Reveal: 99% see BLUE (κ=0.99), 1% see RED (κ=0.01). Payout without reversal.  
  - **Step 4**: Leaderboard update. Winning team emerges (κ-bethers dominate).  

  **1:20–1:30 — Debrief & Philosophical Mapping**  
  | **Game Moment**          | **Philosophical Problem**                                  |  
  |---------------------------|------------------------------------------------------------|  
  | Dial (varying κ)          | Branch counting fails; needs arbitrary "grain size."       |  
  | κ-based betting winning   | Probability can’t be derived from branching alone. Requires rational-agent axioms (coherence, symmetry). |  
  | Erasure dilemma           | "Care about future copies" depends on post-measurement events. Self-locating uncertainty ≠ branch ontology. |  
  | Low-Weight Continuers     | Highlights anthropic bias: Why should rational agents care about branch measure? |  

  **Avoiding early Born rule**: If a physicist blurts it out, say: "In this casino, we’re discovering what probability means without assuming that rule. Hold that thought for the debrief."  

  ---

  ### **Predictable Problems & Mitigation**  
  1. **"Fanatical" player**: "I only care if ANY copy wins!"  
     - **Response**: "If you bet all on RED, you win big in RED branches but lose everywhere else. Check the math: κ-betting outperforms."  
  2. **Physics impatience**: "κ is obviously |ψ|²!"  
     - **Response**: "But why should you use it to bet? What if it were |ψ|⁴? Let’s see how the casino forces κ."  
  3. **Skepticism**: "κ is arbitrary!"  
     - **Response**: "In quantum mechanics, κ isn’t arbitrary—it’s determined by unitary evolution. Here, it’s a stand-in. Your job is to find a strategy that works regardless of κ’s value."  

  ---

  ### **What the Game Can’t Do**  
  - **Why |ψ|² specifically?** The game assumes κ is the correct weight. To explain why quantum mechanics uses squared amplitudes (not |ψ|⁴), you’ll need a 5-minute lecture at the end:  
    > "In quantum mechanics, amplitudes compose linearly (e.g., in interference), but probabilities don’t. The Born rule (|ψ|²) is the only rule consistent with unitary symmetry and decision-theoretic coherence. Wallace 2003 shows this via quantum games. Our casino is a simplified version of that proof: κ must be the weight, and rational agents must use it to avoid exploitable bets."  
    - **Keep it tight**: Use slides with two equations: (1) Unitarity (U†U = I), (2) Dutch book arguments.  

  - **Why Everett-specific?** The game doesn’t contrast collapse vs. no-collapse. For this, add:  
    > "In collapse theories, probability is primitive. In Everett, it’s emergent. The casino shows why emergence isn’t trivial: without collapse, branch-counting fails, and reversal undermines frequency-based rules."  

  ---

  ### **Final Prep Checklist**  
  - **Spreadsheet**: Generate cards (κ, outcome) with formulas:  
    - `=RAND()` for κ (ensure room-wide κ distribution matches design).  
    - Outcome: `=IF(RAND() < κ, "RED", "BLUE")`.  
  - **Tokens**: Use distinct colors for easy counting.  
  - **Debrief slides**: Prepare 1 slide with philosophical mapping and 1 with "Why |ψ|²?"  
  - **Chocolate**: High-quality, visible during gameplay to incentivize engagement.  

  This design forces participants to discover why branch-counting fails and why rational agents must use the magnitude (κ). By the end, they’ll be primed for your concise Born-rule explanation—no early collapses, no jargon, just a casino that rewards rational bets.
