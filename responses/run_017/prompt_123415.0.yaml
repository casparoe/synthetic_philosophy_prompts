prompt: |-
  I'm in a third-year seminar on social norms — we did the usual story about conventions as solutions to coordination problems a few weeks back and I never really got how any of that is supposed to turn into an actual *moral* obligation rather than just "people will think you're rude" — and I've got 2000 words due Friday on whether everyday conventions are moral obligations and whether visitors have to follow local ones. I've been going through cases by gut and I want the principle behind my verdicts, or a better one plus a note about which verdict I should drop.

  My verdicts (all stuff I've actually been in or watched happen):

  - Sit-down restaurant in a US city where it's understood that servers are paid on the assumption that tips make up most of their income. Leaving nothing: not just rude, actually wrong, and it feels closer to withholding owed money than to bad manners.
  - Tip jar at a coffee counter where the barista is on a proper wage. Putting in nothing: completely fine, no obligation at all.
  - Cutting in front of five people at a bus stop in a city where queueing is the norm: wrong.
  - Boarding a train in a city where there genuinely is no queue — everyone stands in a scrum and boards by jostling, and drivers and other passengers all know this. Jostling like everyone else: not wrong. But a visitor on their first day who shoves past a seventy-year-old and knocks them off balance: wrong.
  - Crossing on a red pedestrian signal at 1am with the street completely empty, in a city where nobody waits: not wrong, and I don't even want to call it rude.
  - Crossing on a red in a city where drivers do not expect pedestrians to do that, so a car swerves and nearly hits someone: wrong.
  - Keeping your backpack on in a packed rush-hour carriage in a city where everyone takes theirs off: rude, not wrong.
  - Tipping 20% every day for three months at the same small café in a city with no tipping norm, as a visiting student: mildly bad, because it ratchets up what the staff and other customers come to expect. Doing the same thing once as a one-off tourist: fine, harmless.
  - A visitor who genuinely has no idea that tipping is expected and stiffs a server: not blameworthy, and I want to say not wrong either — but the server is out money and I feel shifty saying it's fine.
  - Somebody cuts in front of me in the queue back home and I say something: fine, maybe good. Same person, same behaviour, standing at the scrum train door in the no-queue city and telling people off for not queueing: not fine, obnoxious and a bit imperialist.
  - Country where everyone tips but there's an active campaign to abolish tipping and a lot of the workers themselves want it gone. Not tipping there: fine, maybe even mildly good.

  Two I can't settle: (a) the office where everyone puts money in for the cleaner at Christmas, everyone privately thinks it's demeaning and would rather the whole thing stopped, and everyone assumes everybody else is keen — pluralistic ignorance, my seminar leader would say. Tipping or not? I go back and forth several times an hour. (b) A long-stay visitor who just avoids restaurants and taxis and crowded trains entirely so they never have to deal with the local conventions at all. Free pass, or are they dodging something?

  The rule I've been trying out, which I'm calling the four-lock rule: a convention binds you morally just in case (i) people there follow it and expect others to, (ii) someone is made worse off — properly worse off, not just mildly irritated — if you don't, (iii) you could have found out about it without much cost before acting, and (iv) complying doesn't itself make things worse overall. It handles some of the list and I think it breaks on others, but I can't tell which clause to repair or whether the whole shape is wrong. I also can't tell whether I need separate principles for payment-ish conventions (tipping), coordination conventions (queueing) and risk conventions (crossing), or whether one thing covers all three. And I keep noticing that I want visitors to *comply* with local conventions but not to *export* their own — which sounds incoherent, or at least like two different principles wearing one coat.

  Please commit: give me one principle you'd actually defend, not a menu. Structure it like this:

  1. The principle — ~150 words. State it in one sentence, then the clauses, tight enough that I could apply it to a new case without you.
  2. Clause by clause — ~300 words. For each clause, the case of mine that motivates it, and what breaks if you drop it.
  3. My undecided cases — ~200 words. Verdicts on (a) and (b), with reasons.
  4. Two cases you generate — ~200 words. Two situations I haven't listed that your principle gives an answer to, at least one of which should be the kind of case where you'd expect the answer to be surprising.
  5. What I have to give up — ~150 words. Which of my verdicts your principle can't accommodate, and which one you'd overturn.
  6. How confident you are — ~100 words. Which clause you'd defend hardest, which is the weakest joint, and what kind of case would make you change it.
reasoning: |-
  Okay, the user is in a social norms seminar and needs to write a 2000-word essay by Friday. They provided a list of real-life cases where they have intuitive judgments about whether conventions create moral obligations, especially for visitors. They also have an undecided case and a proposed principle called the "four-lock rule" with four conditions. They want me to provide a single, defensible principle, analyze it clause by clause, resolve their undecided cases, give new examples, discuss which of their judgments might need revision, and assess my confidence in the principle.

  The user seems to be struggling with how conventions transform into moral obligations beyond mere rudeness. They're particularly interested in the visitor dynamic—why should visitors comply but not impose their norms? Their cases cover tipping, queueing, jaywalking, and gift-giving norms. The four-lock rule they proposed has intuitive appeal but might be too rigid or miss underlying moral foundations.

  I need to craft a unified principle that captures when conventions generate moral obligations. The key is to anchor it in harm and reasonable expectations. Harm seems central in their judgments—when an action causes tangible detriment (like servers losing wages or near-accidents from jaywalking), it's wrong. But harm alone isn't enough; context matters, as in the coffee shop tip jar where no harm occurs. 

  Their tipping examples show that harm is tied to systemic reliance: servers depend on tips in the US system, while baristas don't. Queueing norms prevent harm (disorder, unfairness), but only where the norm exists. The backpack case involves no real harm, just annoyance, so it's rude but not wrong. The office Christmas fund case involves pluralistic ignorance—everyone dislikes it but complies, so harm is ambiguous. 

  Visitors pose a special case. They should comply to avoid harm but not export norms because importing foreign norms can disrupt local expectations and cause harm. For example, queueing in a no-queue culture creates conflict. The long-stay visitor avoiding all local norms might be dodging obligations if their absence harms others (e.g., not tipping where it's expected), but if they opt out completely, they might avoid causing harm. 

  For the office Christmas fund, the principle suggests not contributing isn't wrong because the harm isn't material, and the expectation is based on false beliefs. For the long-stay visitor, avoiding contexts where norms apply might be acceptable unless their absence itself causes harm, which it probably doesn't. 

  New cases: First, a tourist in a place where haggling is expected. Not haggling could harm vendors who rely on it, so it's wrong. Second, a visitor not greeting with a cheek kiss in a culture where it's standard. No real harm, so it's rude but not wrong. 

  Their verdicts mostly align, except the "no-tipping campaign" case. If workers want tipping abolished, not tipping supports their cause, so it's good. But the principle might call it wrong if it still causes immediate harm (lost wages). The user might need to accept that immediate harm outweighs long-term good here. 

  I'm confident in the harm clause as the core, but the "reasonable expectation" clause is trickier—how much effort must one make to learn norms? The "compliance doesn't worsen things" clause is weak; it rarely applies. A case that might challenge the principle is a norm that's harmful but expected, like bribing officials—here, complying causes harm, so the principle might forbid it, but refusing could also harm the visitor. That could force a refinement.
answer: |-
  Here's a single, defensible principle structured as you requested, grounded in harm prevention and reasonable expectations:

  **1. The Principle**  
  A local convention generates a pro tanto moral obligation for a visitor to comply if and only if: (i) **Reasonable Reliance** exists (local actors justifiably rely on general compliance for a material interest); (ii) **Material Harm Risk** is present (non-compliance creates a nontrivial risk of material harm to those reliant actors); (iii) **Epistemic Accessibility** holds (the visitor could reasonably be expected to know or learn the convention without undue burden); and (iv) **Non-Complicity** is satisfied (complying doesn’t directly perpetuate significant injustice or harm beyond the immediate context). *~125 words*

  **2. Clause by Clause**  
  *(i) Reasonable Reliance:* Motivated by the sit-down restaurant tip case. Servers *rely* on tips as contracted income; their material welfare depends on it. Drop this, and the coffee shop tip jar (no reliance on tips for basic income) becomes obligatory, which contradicts your verdict.  
  *(ii) Material Harm Risk:* Explains the red-light cases. Crossing when drivers expect it (no risk) vs. crossing unexpectedly (risk of accident). Without this, the empty-street crossing becomes morally fraught without cause.  
  *(iii) Epistemic Accessibility:* Justifies the unknowing visitor who stiffs a server (not blameworthy). Ignoring this would condemn innocent ignorance unfairly.  
  *(iv) Non-Complicity:* Resolves the anti-tipping campaign case. Complying (tipping) perpetuates a harmful system workers oppose; thus, no obligation exists. Omit this, and supporting unjust systems becomes obligatory. *~300 words*

  **3. Your Undecided Cases**  
  **(a) Office Christmas fund:** **No obligation to contribute.** *Reasons:* (i) Workers don’t *rely* on this payment (it’s a gift, not wages); (ii) Harm is speculative (discomfort ≠ material harm); (iii) Pluralistic ignorance undermines "justifiable" reliance—expectations are based on false beliefs. Contributing might even violate (iv) if it reinforces a demeaning practice.  
  **(b) Long-stay visitor avoiding conventions:** **Generally permissible, but context matters.** *Reasons:* If their avoidance circumvents contexts where *Reliance + Harm Risk* apply (e.g., never taking taxis avoids stiffing drivers), they dodge obligations justifiably. However, if their presence unavoidably triggers reliance (e.g., using a service without paying expected tips), avoidance becomes evasion. Total isolation is extreme but not inherently wrong unless it breaches broader duties (e.g., participating minimally in community). *~200 words*

  **4. Two New Cases**  
  **(1) Haggling in a market where prices are fixed by custom but tourists are quoted higher "foreigner prices":** *Verdict:* **Not tipping is obligatory.** *Why:* (i) Sellers rely on customary pricing for livelihood; (ii) Overpaying risks material harm (economic loss); (iii) Price expectations are learnable; (iv) Paying extra doesn’t combat injustice (it exploits ignorance). *Surprise:* Many assume "haggling cultures" expect negotiation, but fixed customs create reliance.  
  **(2) Refusing a customary greeting (e.g., cheek kisses) in a culture where it’s mandatory for social cohesion:** *Verdict:* **No obligation.** *Why:* (i) No material interest relies on *your* specific greeting (unlike wages); (ii) Harm is social discomfort, not material; (iii) Epistemic burden is high (nuanced norms); (iv) Complying might violate personal boundaries (a nontrivial harm). *Surprise:* Social rituals feel obligatory, but without material reliance/harm, they’re manners, not morals. *~200 words*

  **5. What You Have to Give Up**  
  Your principle can’t accommodate **"mildly bad" tipping in a non-tipping city** (no reliance → no obligation) or **knocking over an elder in a scrum boarding** (fails *Material Harm Risk* – the shove, not the scrum norm, causes harm). I’d overturn your **anti-tipping campaign verdict**: If workers *rely* on tips *now* (despite wanting abolition), stiffing them causes immediate harm, violating (ii). Your intuition of "mildly good" conflates long-term reform with immediate duty – but the principle prioritizes preventing direct harm to reliant individuals. *~150 words*

  **6. Confidence Assessment**  
  **Strongest Clause:** (ii) *Material Harm Risk* – it anchors obligations in concrete welfare, separating etiquette from ethics (e.g., backpack vs. queue-cutting).  
  **Weakest Joint:** (iii) *Epistemic Accessibility* – "Reasonable expectation" is contextually fluid (e.g., is a 1-day visitor to a queueing city responsible for knowing norms?).  
  **Change Trigger:** A case where *reasonable reliance* exists but compliance causes *greater* harm to non-reliant parties (e.g., a norm where tipping enriches a corrupt manager). This might force weighting (iv) *Non-Complicity* more heavily. *~100 words*

  **Key Insight for Your Essay:** The core distinction is **harm prevention** vs. **social coordination**. Conventions create *moral* obligations only when they protect vulnerable interests from material harm through reliance. Visitors must comply to avoid harming locals who depend on norms, but exporting norms ignores local reliance structures. Your "four-lock rule" conflates harm with irritation; this principle sharpens that line. Defend clause (ii) relentlessly – it’s why queue-cutting is wrong (causes delay/harm) but backpack-wearing is rude (no material harm).
