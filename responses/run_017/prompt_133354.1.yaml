   Phase 1: The cycle and chain cases (which are static) to be explored with trading games, highlighting the bounded loss in cycles and the potential for greater loss in chains (if we design it properly) and the unbounded loss in probability coherence (which we won't simulate but will mention in debrief).
   Phase 2: The temporal case with three different decision procedures.

