   1. Cycle case (intransitive preferences): A > B > C > A, leading to a cycle of trades with small fees.
   2. Chain case (indifference leading to strict preference): A ≈ B ≈ C ... ≈ Z, but A < Z (or vice versa), so small fees for each step lead from A to Z and a big loss.
   3. Temporal case (diachronic inconsistency): A decision-maker changes preferences over time, leading to poor outcomes when compared to pre-commitment or consistent planning.

