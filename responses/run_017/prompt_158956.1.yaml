prompt: |-
  I help run a volunteer bike workshop, and after a blowup last month about our unwritten rules I've somehow ended up in charge of new-volunteer onboarding, which now includes a half-hour slot on why we do things the way we do and how that ever changes. I want to build it around the Lewis-style account of convention as an equilibrium of a coordination problem rather than around rules, agreements and enforcement. Don't explain the account to me — plan how I'd get it across to adults with no philosophy, most of whom think an unwritten rule is either a habit or just peer pressure, and who assume all our rules are the same kind of thing when I'm pretty sure they aren't.

  What I need: the order the pieces have to land in and what breaks if two of them get swapped; which of our two contested rules should carry the whole session — (a) whoever last used a tool leaves it out on the bench overnight instead of putting it back, or (b) nobody takes donated parts home during their first month — and what the carrying example has to have and has to lack so it doesn't smuggle in a second layer too early; the misconceptions to expect at each stage (I'm guessing "if its arbitrary then I don't have to follow it" and "we'd just need everyone to agree to switch at once") and the point in the sequence where each should be headed off; one closing question that shows me they've got the expectations structure and not just the vocabulary; and what I should openly refuse to go into at this level.
reasoning: |-
  Okay, the user runs a volunteer bike workshop and needs to design a half-hour onboarding session about their unwritten rules. They want to use David Lewis's convention theory—treating conventions as equilibria in coordination problems—instead of framing things as rules with enforcement. The challenge is explaining this to adults without a philosophy background who might see unwritten rules as mere habits or peer pressure. Let me break this down.

  First, I need to understand the core components of Lewis's theory. Conventions are solutions to coordination problems where everyone prefers to coordinate, even if the solution itself is arbitrary. The key is mutual expectations: I do X because I expect others to, and they do the same. It's self-reinforcing. The user mentioned two examples: leaving tools out versus not taking parts home. I need to choose which one to use as the primary example.

  Between the two contested rules, (a) leaving tools out seems better. It's arbitrary—there's no inherent reason why leaving tools out is better than putting them away, but it works because everyone expects it. In contrast, rule (b) about not taking parts home has a moral component (preventing theft) and involves trust-building, which might confuse the pure coordination aspect. So rule (a) is a cleaner example for illustrating the equilibrium concept.

  Now, structuring the session. The user emphasized the order of pieces and what breaks if swapped. I should start with relatable coordination problems to build intuition. Traffic lights are a classic example—everyone stops on red because they expect others to, and it's arbitrary (green could mean stop instead). This introduces the idea without jargon. Then, introduce the concept of equilibrium: once established, no one deviates because deviation causes problems (e.g., accidents if someone runs a red light).

  Next, apply this to the tool rule. Show that leaving tools out is arbitrary but works because everyone expects it. If someone puts a tool away, it breaks the expectation, causing confusion or wasted time. This contrasts with habits (personal routines) or peer pressure (fear of disapproval), highlighting that conventions are about mutual expectations for coordination.

  Misconceptions to address: First, "arbitrary means I don't have to follow it." This should be tackled when discussing equilibrium. Emphasize that even if arbitrary, the convention is valuable because it coordinates behavior. Deviating disrupts the system. Second, "we can all agree to switch at once." Address this after explaining the equilibrium's stability. Point out that changing requires coordinated effort, not just agreement, because any individual change before the group does causes problems.

  For the closing question, ask what happens if someone puts a tool away. The correct answer involves disrupted expectations and inefficiency, showing they grasp the mutual expectations structure, not just vocabulary.

  What to avoid: Don't dive into moral norms or enforcement. Stick to pure coordination examples. Avoid discussing rule (b) in depth since it mixes elements that could confuse the convention concept.

  I should outline the sequence: Start with traffic lights to introduce coordination and arbitrariness. Then define equilibrium using the same example. Apply to the tool rule, debunking misconceptions. Address why arbitrary doesn't mean optional and why switching isn't simple. End with the closing question and summary.

  Also, note that swapping the equilibrium explanation before the coordination example would confuse learners. They need the concrete example first to anchor the abstract concept. Similarly, introducing the tool rule too early might lead to misconceptions before the foundation is set.

  Finally, ensure the session stays within half an hour by keeping each segment tight. Use clear, jargon-free language and relatable analogies. Encourage questions but steer away from tangential discussions on enforcement or morality.
answer: |-
  Here’s a structured onboarding plan using Lewis-style convention theory, designed for clarity in 30 minutes. It prioritizes intuitive sequencing, preempts misconceptions, and uses your tool rule (a) as the anchor example.

  ---

  ### **Session Structure: Order & Logic**  
  *(Total: 25 min content + 5 min Q&A)*  

  1. **Start with Universal Coordination Problems (5 min)**  
     - **Example:** Traffic lights. *"Why do we all stop on red? Not because it’s morally right, but because we expect others to stop. If I go, you go—we crash. Arbitrary? Sure (green could mean stop), but it works because expectations align."*  
     - **Key Point:** Coordination isn’t about "rightness"—it’s avoiding mutual frustration.  
     - **Why first?** Establishes that coordination = avoiding lose-lose outcomes. Skipping this risks framing conventions as personal preferences.  

  2. **Define Equilibrium (5 min)**  
     - **Example:** Why traffic lights *stick*. *"Once most people follow it, no one wants to deviate alone. If I run a red light while you stop, I cause chaos. Equilibrium means my best move depends on expecting yours."*  
     - **Key Point:** Stability comes from mutual expectations, not enforcement.  
     - **Why here?** Must follow coordination intro. Swapping with #1 makes "equilibrium" seem abstract.  

  3. **Apply to Workshop: Tool Rule (a) (7 min)**  
     - **Why rule (a)?** It’s *purely arbitrary* (no moral/trust layer) and fails visibly if expectations break.  
     - **Breakdown:**  
       - *Coordination problem:* "If tools are sometimes put away, sometimes not, we waste time searching/replacing."  
       - *Equilibrium:* "We all leave tools out because we expect others to do the same. If you put one away, the next person won’t know where to look."  
       - *Arbitrariness:* "We could all put tools away—but we don’t. Why? Because *this* expectation exists."  
     - **What it lacks:** No moral judgment (unlike rule (b), which involves fairness/trust). Avoids smuggling in "shoulds."  

  4. **Preempt Misconceptions (5 min)**  
     - **Misconception 1:** *"If it’s arbitrary, I don’t have to follow it."*  
       - **When/How to head off:** During step #3. Counter: "Arbitrary doesn’t mean useless. Deviating alone causes frustration *because* others expect consistency. Your ‘choice’ affects the group’s efficiency."  
     - **Misconception 2:** *"We’d just need everyone to agree to switch at once."*  
       - **When/How to head off:** After equilibrium definition (step #2). Counter: "Agreement isn’t enough—you need reliable mutual expectations. If half of us switch to putting tools away and half don’t, confusion doubles. Change requires building new expectations gradually."  

  5. **Contrast with Non-Conventions (3 min)**  
     - **Habit vs. Convention:** "Habits are personal (e.g., I drink coffee at 3 PM). Conventions require mutual expectations (e.g., leaving tools out)."  
     - **Peer Pressure vs. Convention:** "Peer pressure enforces ‘shoulds’ (e.g., mocking someone). Conventions collapse if expectations fail—no scolding needed."  

  ---

  ### **Closing Question to Test Understanding**  
  *"Imagine you put a tool away tonight. What happens tomorrow—and why?"*  
  - **Target insight:** They should note disrupted expectations (e.g., "Someone wastes time searching, then leaves another tool out hoping to reset the norm"). If they mention "enforcement" (e.g., "I’d get told off"), they missed the equilibrium.  

  ---

  ### **What to Openly Refuse**  
  - **Rule (b) ("No parts home first month"):** Don’t use it here. It mixes convention with trust-building (moral layer) and anti-theft (enforcement). This muddies the "pure coordination" lesson.  
  - **Enforcement mechanisms:** Ignore "how we punish deviations." Focus solely on expectation-driven stability.  
  - **Philosophy jargon:** Avoid terms like "Schelling point" or "game theory." Stick to "expectations," "coordination," and "equilibrium."  

  ---

  ### **Why This Sequence Works**  
  - **Scaffolded learning:** Traffic lights → abstract equilibrium → workshop application. Swapping #2 and #3 would make the tool rule seem like a top-down "rule."  
  - **Rule (a) carries the session** because its failure mode (wasted time) is immediate, expectation-driven, and morally neutral. Rule (b) would distract with "fairness" debates.  
  - **Misconceptions are preempted** when they’re likely to arise (e.g., arbitrariness when introducing the tool rule).  

  This frames conventions as collective solutions to avoid chaos—not as rigid rules. Volunteers leave seeing the "why" beneath your workshop’s quirks.
