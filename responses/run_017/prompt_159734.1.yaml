  Hmm. Their core frustration is epistemological: how to distinguish legitimate uniqueness-seeking from self-deceptive narrowing. The literary examples (debuts vs established authors, archival depth) show this isn't laziness—they've done the homework. Interesting that they notice the pattern works bidirectionally (optimism/pessimism), suggesting it's structural. 

  Ah! The key might be temporal: they realize the comparison class gets defined *after* knowing the desired outcome. That's the tell. When they urged caution on their friend's publisher switch, they retrofitted exclusions to support pessimism. Yet calling this "motivated reasoning" feels wrong to them because each exclusion stands up to scrutiny. 

  What they're circling is reference class tennis—how we volley between "this is singular" and "this fits a pattern" depending on need. The planning fallacy comparison is smart but incomplete; unlike typical overconfidence, this leverages hyper-specificity as justification. 

  Their question about narrative structure matters. A scene-by-scene plan creates such high-resolution vision that any deviation feels disqualifying for comparison. It's not just granularity but *curated* granularity—each scene has a "function," implying irreducible design. 

  For boundary cases: medical diagnostics come to mind. When a patient has 6 common symptoms plus 1 rare one, good doctors avoid both errors: over-narrowing (treating as utterly unique) and over-broadening (ignoring the rare marker). The test is falsifiability: could they articulate what evidence would break their "no comparables" stance? If not, it's likely the move they describe. 

  The answer shouldn't pathologize this. Historians face it constantly—e.g., is the Cold War "unique" or comparable to other great-power rivalries? Rigor means defending why certain comparables survive exclusion. Their move becomes problematic only when exclusion criteria remain implicit. 

