  Here is the decision tree instrument, structured as requested. It uses concrete cases to guide readers through seven branching questions, leading to distinct ethical positions based on suffering-first principles. Each leaf includes the position name, a brief diagnostic note on unoccupied branches where applicable, and one sentence highlighting its most awkward commitment. The logic avoids jargon and prioritises intuitive flow.

