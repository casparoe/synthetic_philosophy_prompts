prompt: |-
  so I'm writing a novel — two protagonists on opposite sides of the same fight, starting with something small and local (a school curriculum meeting that gets ugly) and spiralling outward — and while doing research for it I keep bumping into a thing I don't have a word for. I dont want a word to drop into dialogue, I want to understand the machinery well enough that neither of them is a caricature, so bear with the rambling setup.

  My character Dana is not in a bubble. She reads the other side constantly. She can recite, from memory, six infuriating things people on their side have said this year; she follows several of their writers on purpose, specifically to get angry. But nothing she reads was picked by the other side for the other side. It was picked by her own side, screenshotted, and circulated because it was enraging or ridiculous — last week her group chat passed around a clip of some guy with a few hundred followers saying something genuinely unhinged, and everyone in it treated him as what the other side really thinks. So her sample of them is basically a gallery of their worst moments, assembled by her own allies, and the boring, reasonable majority of what the other side says never makes it into the gallery because nobody on her side has any reason to pass it around. The part I can't get right is what happens next: when Dana actually meets one of them at a meeting and he's mild, concedes a point, makes an argument she half agrees with, it doesn't move her at all. She files him as an exception, or as someone being polite in mixed company, and goes back to the gallery.

  What I keep wanting to call it is a reverse echo chamber — not too little contact with the other side but a kind of adversarial curation, where more contact makes you surer they argue in bad faith rather than less. Everything I've run into feels adjacent but wrong. The usual echo chamber / filter bubble stuff is about information being kept out, whereas here information is being pushed in, by her own teammates. There's something I half remember called the "hostile media effect" (I may well be mangling the name) about people perceiving neutral coverage as biased against them, but the material Dana reacts to really is nasty, so she isn't misperceiving anything. And there's work on how we overestimate how extreme the other side is, which isn't it either: if you asked Dana to guess what fraction of them believe X, I think she'd be roughly right. Her problem isn't a false belief about the distribution of their opinions — it's what her sample is made of, who assembled it and why, and the fact that meeting them face to face doesn't fix it. (Also: there's that exercise where you have to state the other side's position well enough that they'd sign off on it. Dana would be great at it. I don't think it would help her at all, and that's a detail I'd love to get right.)

  So: is there an established concept for this, in political science or social epistemology or media studies or anywhere else, and if so what exactly does it cover and what is it used to explain? If there isn't one, give me a coined name and a definition — but more importantly give me the edges. Where does this stop being its own thing and become just ordinary mockery of your opponents, which is ancient and probably mostly fine? Does more exposure ever help rather than hurt here, and is the difference the amount of contact or the kind of contact? And what would the honest version of the fix even be, because my instinct is that "go read the other side" is definately the wrong advice for someone like Dana, and I want to know whether that's insight or just my own cynicism.
reasoning: |-
  Okay, the user is writing a novel with two protagonists on opposite sides of a conflict that starts small and escalates. They're struggling with a specific dynamic where one character, Dana, consumes content from the opposing side but through a distorted lens. The user wants to understand this phenomenon better to avoid caricatures.

  Dana actively seeks out the other side's content but only sees their worst moments, curated by her own side. When she meets a reasonable opponent face-to-face, she dismisses them as an exception. The user has considered concepts like echo chambers or hostile media effect but feels they don't quite fit. They want to know if there's an established term for this or if they should coin one.

  First, I need to identify the core issue. It's not just confirmation bias because Dana is exposed to opposing views, but they're pre-selected to be extreme. This is adversarial curation – her own side filters the opposition's content to highlight only the most inflammatory parts. 

  The Gish Gallop comes to mind, but that's more about debate tactics. Maybe "negative selection bias" or "adversarial exemplar selection"? The key is that Dana's exposure is mediated by her in-group, who have an incentive to pick the worst examples. 

  Then there's the backfire effect when she meets a moderate. Instead of updating her beliefs, she doubles down, seeing them as an outlier. That's belief perseverance. The curated gallery reinforces her schema of the enemy, making real interactions ineffective. 

  The user also wonders where this differs from ordinary mockery. The difference is systematic curation versus occasional ridicule. And they're right that "read the other side" won't help Dana because she'll just seek the same extremes. The fix requires intentional exposure to the opposition's everyday discourse, maybe through moderated dialogue. 

  I should check if terms like "selective exposure theory" or "outgroup homogeneity bias" apply. But selective exposure is avoiding opposing views, which Dana doesn't do. Outgroup homogeneity might explain why she sees them as monolithic, but it's more about perception than curated content. 

  Combining "adversarial curation" with "exemplar distortion" seems accurate. The user needs the edges: when does this become ordinary mockery? When the curation isn't systematic, or when it's not the primary source of information about the outgroup. 

  For the novel, showing Dana's internal justification when meeting a moderate is key. She might think, "This one's different," or "He's lying," preserving her existing schema. The honest fix involves exposure to the opposition's in-group discussions, not just their public statements. 

  The user's instinct about "read the other side" being wrong for Dana is spot-on. She needs context, not more curated extremes. Maybe her character arc involves realizing her curated gallery is constructed by her own side.
answer: |-
  Your rambling setup is brilliant – you've nailed a disturbingly common modern dynamic that **doesn't have a single universally accepted term, but is absolutely recognized and studied.** Here's the breakdown, the concepts, the edges, and why "go read the other side" is indeed terrible advice for Dana:

  **Core Concepts & Terminology:**

  1.  **Adversarial Curation (or Hostile Curation):** This is the most descriptive *coined term* for the *process* you describe. It's the systematic selection and amplification of the opposing side's most extreme, offensive, or easily ridiculed content *by one's own in-group*, specifically for the purposes of:
      *   Reinforcing in-group cohesion ("Look how crazy *they* are!").
      *   Stoking outrage and mobilization.
      *   Creating a readily deployable caricature of the opposition.
      *   Justifying one's own position and actions.

  2.  **Exemplar (or Extreme Exemplar) Distortion:** This describes the *cognitive outcome* for Dana. Her perception of the outgroup isn't formed by a representative sample, but by a biased selection of **extreme exemplars** – the worst actors, the most inflammatory statements, the most easily mocked positions. This distorts her understanding of the outgroup's central tendencies, diversity of opinion, and motivations. Even if she *knows* intellectually they aren't all like that (hence her accuracy on distribution estimates), her *affective* understanding and *gut reaction* are dominated by these curated exemplars.

  3.  **Belief Perseverance / Confirmation Bias (with a twist):** When Dana encounters a moderate opponent, her existing schema (formed by adversarial curation) is challenged. Her brain doesn't update the schema; it protects it. The mild opponent becomes the **"exception that proves the rule"** or is interpreted through the lens of **"strategic deception"** ("He's just being polite here, he *really* believes the awful stuff"). This protects her existing worldview and the social bonds within her group that depend on shared opposition to the curated caricature.

  4.  **Outgroup Homogeneity Bias:** This is adjacent. It's the tendency to perceive members of an outgroup as much more similar to each other than members of the ingroup. Adversarial curation *feeds* this bias by providing seemingly concrete "evidence" of the outgroup's monolithic awfulness.

  5.  **The "Gish Gallop" Effect (Micro-Level):** While usually a debate tactic, the *effect* on the receiver is similar. Being bombarded with a relentless stream of (curated) bad-faith arguments, logical fallacies, or extreme views from the outgroup makes it *feel* like that's all there is, even if intellectually you know it's not. Dana is constantly subjected to a slow-motion Gish Gallop curated by her own side.

  **Why Established Terms Feel Adjacent But Wrong:**

  *   **Echo Chamber/Filter Bubble:** Focuses on *exclusion* of dissenting views. Dana's environment *includes* opposing views, but **pre-selects and frames them adversarially**. It's about *how* opposing information enters, not its absence.
  *   **Hostile Media Effect:** Involves misperceiving *neutral* coverage as biased. Dana is reacting to genuinely hostile/extreme content, just not *representative* content. The bias is in the *selection*, not her perception *of the selected item*.
  *   **False Consensus/False Uniqueness/Outgroup Extremity Bias:** These deal with misjudging *prevalence* or *central tendency*. As you note, Dana might be okay on prevalence estimates. Her distortion is more about **affective representation and perceived core motivations** – she *feels* the group is defined by its worst curated elements, even if she knows statistically they aren't the majority.

  **The Edges: When Does This Become Ordinary Mockery?**

  Adversarial curation becomes its own distinct phenomenon when:

  1.  **Systematic & Primary Source:** It's not just occasional jokes or sharing a ridiculous tweet. It's the *primary way* members of the group encounter and understand the outgroup. It replaces seeking out the opposition's own curated spaces or mainstream discourse.
  2.  **In-Group Amplification:** The curation isn't just personal; it's *socially reinforced* within the group (e.g., the group chat). Sharing and reacting to these curated exemplars becomes a bonding ritual and a signal of group loyalty.
  3.  **Blocks Schema Update:** It actively prevents updating one's understanding of the outgroup *even upon direct contact with counter-examples* (like the mild opponent). Ordinary mockery might soften upon meeting decent individuals; adversarial curation inoculates against this.
  4.  **Justification for Action:** The curated caricature isn't just for laughs; it serves a functional purpose in justifying the group's own stance, tactics, or hostility towards the outgroup *as a whole*.

  **Does More Exposure Help? What Kind Matters?**

  *   **More of the Same Exposure (Adversarial Curation): DEFINITELY HARMS.** It deepens the exemplar distortion, reinforces belief perseverance, and increases cynicism and hostility. This is Dana's current path.
  *   **Direct, Unmediated Exposure to the Outgroup's *Own* Discourse:** **Potentially helps, but risky and difficult.**
      *   **The Problem:** Dana is primed to see bad faith everywhere. Entering the opposition's spaces (their forums, publications, feeds), she'll likely:
          *   **Confirmation Bias:** Notice and focus on content that confirms her existing adversarial schema.
          *   **Misinterpret Nuance:** Read reasonable disagreement or complex positions as disguised hostility or bad faith, especially if they challenge her core beliefs.
          *   **Find the Extremes:** Even within the opposition's own space, algorithms or her own bias might lead her to *their* most extreme voices.
      *   **The Potential (Rare):** If she *persists* and seeks out *their* mainstream, boring, reasonable voices discussing issues *amongst themselves* (not performatively for outsiders), and engages with empathy and a *genuine* attempt to understand their internal logic (not to "debunk"), *some* updating *might* occur. But it's an uphill battle against deeply ingrained schemas.

  **The Honest Fix (It's Hard):**

  "Go read the other side" **is terrible advice for Dana** because she'll either seek out the extremes (confirmation bias) or interpret everything through her adversarial lens. The honest fixes involve disrupting the curation *and* the schema:

  1.  **Recognize the Curators:** The first step is realizing that her primary source on the opposition is *her own side*, acting as hostile editors. She needs to ask: "Why did *my* group choose *this specific thing* to show me? What are they *not* showing me?"
  2.  **Seek the Outgroup's "Boring Middle":** Actively look for the opposition's *own* mainstream sources discussing policy, internal debates, and everyday concerns *aimed at their own audience*. Not the firebrands, not the performance artists, but their equivalent of mundane editorial boards or community organizers. This requires conscious effort to bypass algorithms and her own bias.
  3.  **Focus on Shared Problems, Not Shared Enemies:** Find spaces (rare as hen's teeth) or issues where people from both sides are forced to collaborate on a concrete, non-ideological problem (e.g., a local disaster, a school fundraiser logistics issue). Seeing "them" as competent, reasonable collaborators on shared ground can crack the monolithic schema.
  4.  **"Steel Manning" with Empathy (Beyond the Exercise):** The exercise you mentioned (state their position well enough they'd sign off) is good, but Dana can do it dispassionately. The fix requires adding **empathy**: trying to understand *why* reasonable-seeming people within that group hold those positions. What are their core values, fears, or experiences that lead them there? This isn't about agreement, but about understanding motivations as *human* rather than purely malicious.
  5.  **Critical Consumption of *Own-Side* Curation:** Develop a reflex to question: "Is this being shared because it's truly representative of their core beliefs, or because it's outrageous and makes us feel superior/justified?"

  **For Your Novel:**

  *   **Dana's Internal Monologue:** Show her mental gymnastics when meeting the mild opponent: "He's lying." / "He's scared to say what he really thinks here." / "He's one of the few decent ones, but he still enables the monsters." / "See, even when they sound reasonable, it's just a tactic."
  *   **The Group Chat:** Show the social pressure. If Dana expresses doubt about the caricature ("Well, this guy I met wasn't like that..."), show the pushback: "Don't be naive!" / "They're all wolves in sheep's clothing!" / "You're giving them cover!" This reinforces her need to conform.
  *   **The Futility of "Good Faith" Argument:** Have the mild opponent make a genuinely good point. Show Dana immediately searching for the hidden agenda or dismissing it because "it doesn't matter what *he* says, look what *they* do (points to curated gallery)."
  *   **The (Potential) Crack:** If Dana's arc involves change, the seed might be noticing how *her own side* curates/portrays *her* positions in absurdly bad faith on *their* feeds. Or witnessing genuine, non-performative kindness or competence from an opponent in a non-ideological context.

  You've identified a crucial, corrosive mechanism of modern polarization. It's not ignorance; it's **systemically distorted intelligence** gathered through an **adversarial lens**. Capturing this will make your characters and conflict deeply resonant and tragically believable. Good luck!
