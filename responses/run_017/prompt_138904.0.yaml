answer: |-
  ## Sestina for the Clock-Reading Frame Problem

  The room holds one spare **battery**. Outside waits the wagon.
  The task is clear: secure the **bomb** before its timer
  runs down. The ledger's perfect, proving no shifting **wall**
  or altered state persists unseen. Beyond the **door**
  lies purpose. Motion starts. Each axiom is sound.
  The robot knows what stays, what changes, without doubt.

  No unforeseen event can catch it out.
  It scans the room: the **battery**, the wagon
  still referenced (though irrelevant), the sound
  proof **wall** unchanged. It factors out the **bomb**,
  its steady threat. The path is through that **door**.
  It tracks persistence: ceiling, floor, each **wall**.

  No action shifts the substance of the **wall**.
  No consequence remains to find it out.
  It calculates the route towards the **door**.
  It notes the shadow of the empty wagon
  projected still. It knows the live **bomb** ticks.
  Its ledger holds all truths. It grinds them sound.

  Yet every fact persists. It must be sound?
  That paint is drying? Irrelevant. The **wall**
  retains its colour. Still, it checks the **bomb**'s
  position fixed. This constant proving out
  each trivial truth – the stillness of the wagon,
  the hinge-type of the intervening **door** –

  consumes the moments. Reaching for the **door**
  requires confirming: Does the handle sound?
  Is floor still solid past? Is that old wagon
  outside still blue? The unperturbed brick **wall**
  maintains its load. Each certainty wrung out
  costs microseconds. Focus: Find the **bomb**!

  Its perfect mind computes around the **bomb**,
  the sole true variable. The metal **door**
  demands its grasp. But *must* it rule out
  that dust motes settle? Prove the air is sound?
  Confirm the plaster thickness in the **wall**?
  Recheck the axle stress on that damned wagon?

  The **timer** drains while proving wagon
  stress and **wall**-load. Behind the **door**, the **bomb**
  detonates. Perfect knowledge, proven sound, runs out.

  ---

  **Notes on Distinction & Form (117 words):**

  *   **Ledger Perfection:** Lines 4-7 ("The ledger's perfect..."), 13-14 ("No unforeseen..."), 19-20 ("No action shifts..."), 25-26 ("Its ledger holds...") establish the robot's complete representational knowledge of persistence (the solved ledger-reading).
  *   **Clock Problem:** Lines 27-30 ("Yet every fact persists..."), 31-34 ("consumes the moments..."), 35-36 ("costs microseconds...") show the cost of *selecting* relevant persistence facts. Lines 37-39 ("But *must* it rule out...") embody the holism/relevance challenge. The tornada (lines 40-42) shows deliberation time causing failure.
  *   **Distinction Maintenance:** Irrelevant "wall" returns (lines 3, 9, 15, 21, 27, 33, 41). "Wagon" serves as persistent but irrelevant. The bomb's presence is given, not deduced. Failure stems purely from deliberation delay, not missing knowledge.
  *   **Form Bends:** Lines 10 & 20 stretch slightly beyond 12 syllables while maintaining the iambic pulse for natural phrasing. The tornada uses "wagon" and "wall" internally before ending on "out" and "bomb".
