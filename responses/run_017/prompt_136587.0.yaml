  For the kiosk: if the oath is about clear, voluntary assumption of legal responsibility, the kiosk likely suffices. It delivers the warning, records consent, and the consequences remain identical. The coworker's anger might stem from vestigial cultural/emotional weight—the "gravity" of human-administered ritual. But legally? Probably not material.

  Where I might be shaky: underestimating how ritual solemnity affects behavior. Studies show formal settings increase truth-telling. If the kiosk feels like a vending machine, does compliance drop? But that's empirical, not doctrinal. Also, maybe the "witness" concept isn’t just fluff—even secularly, it invokes collective oversight. A kiosk might dilute that symbolism without altering legal validity.

  Strongest kiosk defense: It standardizes the oath, eliminating human error (like clerks flubbing words). Precedent exists (e-signatures). If the law accepts mailed declarations, why not a kiosk? The burden is on critics to prove harm, not defenders to prove equivalence.

  User’s meta-request: no "tidy stories." I’ll flag where my reasoning is most vulnerable—like assuming the symbolic loss is legally irrelevant. If data shows kiosks increase perjury, that’d change my view.
answer: |-
  This is one of the most fascinating legal-anthropological puzzles—the ritual that seems simultaneously sacred and mechanical. The tension you describe isn't incoherent; it reveals the oath's *social function* trumping its *theological or psychological* roots. Here’s a breakdown:

  ### 1. **The Coherence of Formalism + Indifference to Belief**  
     - **What words do**: The oath is a **performative utterance** (like "I pronounce you married"). Saying the words *does* something: it triggers a legal status change. You transition from "person speaking" to "witness under penalty of perjury."  
     - **Why form matters**:  
       - **Certainty**: A fixed script ensures everyone knows *when* the switch happens. No ambiguity about whether you "agreed" or "understood."  
       - **Equality**: Identical words for all prevent bias claims ("The clerk pressured me!").  
       - **Verifiability**: Courts can replay a recording or ask witnesses: "Did they say the words?" (Unlike probing souls).  
     - **Why belief doesn’t matter**:  
       - **Unverifiable**: Courts can’t judge sincerity. Crossed fingers? Secret disbelief? Unprovable.  
       - **Unnecessary**: The law cares about *behavior* (truth-telling), not internal states.  
       - **Inclusive**: Allowing affirmation avoids religious tests (per *Torcaso v. Watkins*).  

     **Is it one view or two?** One view: **The oath is a formal gateway to heightened liability.** The formalism *enables* indifference to belief. If you utter the formula voluntarily, you’re bound—full stop.  

  ---

  ### 2. **What’s Required vs. Replaceable (Kiosk Test)**  
     - **Strictly required**:  
       - **Clear, voluntary utterance** of a formula acknowledging penalties for lying.  
       - **Awareness of consequences** (usually explained beforehand).  
     - **Replaceable by inertia**:  
       - Human administrators, raised hands, Bibles. These signal gravity but aren’t essential. Even live clerks rarely "check" sincerity.  
     - **The "credible warning" view**:  
       - **Licenses the kiosk**: If the kiosk delivers the formula clearly, ensures voluntary participation (e.g., a "confirm" button), and records consent, it satisfies the legal purpose. Federal declarations (18 U.S.C. § 1746) prove the ritual isn’t magic: signing "under penalty of perjury" works identically.  
       - **What would have to change**: Nothing. The kiosk *is* the logical endpoint of this view. The coworker’s anger reflects **loss of solemnity**, not legal substance.  

  ---

  ### 3. **Is "Something Real Lost"?**  
     - **Legally? No.** Perjury liability attaches identically.  
     - **Anthropologically? Yes, but variably.**  
       - **Ritual solemnity**: Humans respond to performative gravity. A clerk’s eye contact, a courtroom’s hush—these may psychologically heighten the sense of commitment. A kiosk in a DMV-like setting might feel trivial.  
       - **Symbolic "witness"**: Your brother-in-law isn’t wrong. Historically, oaths invoked God/the cosmos as witness. Secular affirmations retain the *structure*: you address an abstract authority (The State, Justice). A kiosk might strip this to bare legalism.  
       - **But**: This loss isn’t legal. It’s about **cultural resonance**. One person’s "travesty" is another’s "efficiency."  

     **Underdetermination?** Yes. Two theories coexist:  
     - **Theory A (Utilitarian)**: Oaths deter lies via consequence-warnings. Kiosk fine.  
     - **Theory B (Symbolic)**: Oaths morally bind conscience via communal ritual. Kiosk inadequate.  
     Neither is "wrong," but the law only codifies Theory A. Theory B persists in human reactions.  

  ---

  ### Where This Might Be Shaky  
  - **Your brother-in-law’s point**: "Calling to witness" *isn’t* empty. It’s the ghost in the machine. Secular oaths still invoke an authority beyond oneself (the Law). A kiosk might feel like contracting with a vending machine. But legally, the "witness" is the court record, not metaphysics.  
  - **Strongest kiosk defense**:  
    > "We accept affidavits signed alone at kitchen tables. We accept e-notarizations on Zoom. Why is pressing a button after a recording meaningfully different? The law cares that you were informed and consented—not that you felt goosebumps."  
  - **What could change my mind**:  
    - **Data showing ritual affects truthfulness**. If studies proved live oaths reduce perjury more than kiosks, solemnity would have *practical* weight.  
    - **Legal challenges succeeding**. If courts ruled kiosks invalid for lacking "solemn occasion," symbolism would gain legal teeth.  

  ---

  ### In Short  
  The law reduces the oath to a **voluntary, formal assumption of legal liability**. The kiosk fits this vision. The anger is grief for a **social ritual**—the moment where the law *feels* like a moral covenant, not just rules. But that’s poetry; the statute books run on prose.
