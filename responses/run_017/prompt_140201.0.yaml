prompt: |-
  I teach a seminar on the ethics of war pretty much every spring, and there's a shape of argument I keep running into in third-year papers — and, if I'm honest, in a lot of the published stuff too, and in my own thinking when I'm being sloppy — and I've never had a decent word for it. It goes like this. Everyone at the table will happily grant the big-picture claim: the war this soldier is fighting is an aggressive one, his side has no good reason for fighting it, the whole thing shouldn't be happening, what his country is doing is wrong. But then nothing whatsoever follows. He may keep fighting. He isn't to blame, because he couldn't have been expected to work out whether his government was lying to him. There's no expectation that he stop, or refuse, or desert, and no one proposes punishing him afterwards. And the people he is shooting at are supposed to treat him exactly as they would treat someone whose cause was just — same rules, same permissions, same restraints — and if they don't, they are the ones who've done something wrong. So the wrongness gets asserted loudly at one level and then goes completely inert at every level where taking it seriously would change what somebody may do or who ends up bearing a cost. I'm a philosopher by training, not a lawyer, and I'm deliberately not naming the two or three famous theses in this neighbourhood, because the moment I name them the seminar turns into a recitation of positions and we stop looking at the move itself.

  The bit I really want a concept for, though, is a second wrinkle that I'm not even sure is the same phenomenon. When the excuse does get cashed out for something, it never seems to land on the person who is excused. He's excused because of his epistemic situation, because of what someone in his position could reasonably have been expected to figure out — and then that excuse somehow turns into a reason for the soldiers on the other side to accept more risk, to hold back, to add precautions, before they defend themselves or their country. So a claim that is supposed to be about him functions instead as a cost imposed on someody else entirely. It doesn't narrow what he may do, and it doesn't narrow what may be done to him; it just leaves the people he's attacking worse off. I've started calling it "the excused party's freebie" in my own notes, which is useless and probably misleading, since it suggests he's getting something out of it.

  So: does this have an established name, and if it does, does it cover both cases or only one? I don't want a label I can put on a slide — my students can produce labels. What I want is the carving: what exactly the phenomenon is, whether the inert-conclusion version and the migrating-cost version are really one thing or two, what the nearest established concepts are (names, not reading lists, I can find the reading myself) and precisely how this differs from each of them — I can think of a couple of nearby candidates that are about permission and blame rather than about this particular move, and another about threats that aren't anyone's fault, and none of them seems to cover it — and if there genuinely isn't anything established, say so plainly and give me a term, a definition, and two or three boundary cases I can argue about with my students. One of my colleagues in international law says the whole thing is just an artifact of how the law seperates the question of whether a war may be fought from the question of how it may be fought, but that strikes me as describing the setting rather than explaining why the conclusion evaporates the moment you try to use it.
reasoning: |-
  Okay, let me start by really understanding what this professor is grappling with. They teach a seminar on the ethics of war and keep encountering this argument structure in student papers and published works. The core issue is that everyone agrees a war is unjust at the macro level, but that judgment doesn't translate into any consequences for the individual soldier. The soldier isn't blamed, isn't expected to stop fighting, and the opposing soldiers must treat him as if he were a just combatant. The wrongness of the war becomes inert—it doesn't change actions or assign costs.

  Then there's a second layer: when an excuse is made for the soldier (like his epistemic limitations), it ends up imposing costs on the opposing soldiers. They have to take more risks or show more restraint. The professor calls this "the excused party's freebie" but feels it's misleading. They want to know if there's an established term for these phenomena, or if they need a new concept. 

  First, I need to untangle whether the inert-conclusion and migrating-cost issues are two aspects of one problem or separate phenomena. The inert conclusion is about the disconnect between macro-level wrongness and micro-level implications. The migrating cost is about how excuses for one party shift burdens to another. Both involve a failure of moral responsibility to "travel" from the collective to the individual, but the migrating cost adds an extra layer of burden-shifting.

  Looking at existing concepts, moral bracketing in jus in bello comes to mind. It's the idea that combatants' permissions and obligations don't depend on the war's justice. But this is a normative position, not a description of the logical flaw the professor observes. The problem here is the inconsistency in applying moral judgment—affirming the war's injustice but refusing to let it affect individual actions.

  Then there's the epistemic excuse. The soldier isn't blamed because he couldn't know the war was unjust. But instead of this excusing him, it burdens his adversaries. This reminds me of moral luck, where factors beyond control affect moral judgments. But moral luck usually impacts the agent's own blameworthiness, not shifting burdens to others. 

  Another angle: the professor mentions their colleague in international law attributes this to the separation of jus ad bellum and jus in bello. But the professor feels this describes the framework without explaining why the moral conclusion evaporates. So the deeper issue might be a decoupling of collective and individual responsibility, where systemic wrongs don't translate to individual accountability.

  For the migrating cost, it's like an inverted excuse. Normally, an excuse reduces blame for the agent. Here, the excuse becomes a reason for others to bear costs. This parallels the concept of "agent-relative permissions" but in reverse—instead of permissions allowing self-preference, the excuse forces others to accommodate the excused agent's ignorance.

  The professor wants precise conceptual carving. The inert conclusion is a form of "moral detachment," where judgment doesn't lead to action. The migrating cost is a "burden shift" or "moral displacement." They might be two manifestations of a broader "responsibility vacuum." When collective wrongdoing isn't anchored to individual actors, costs either disappear or land on victims.

  If no established terms fit, I'd propose "normative dissipation" for the inert conclusion—moral judgments dissipate without practical effect. For the migrating cost, "excuse transposition"—the excuse transposes costs from the excused to others. A unified term could be "agent-displaced responsibility," highlighting how responsibility is detached from agents and either vanishes or moves.

  Boundary cases to test: A soldier in a conscripted army vs. a volunteer. Does the epistemic excuse hold equally? What if the adversary has equal epistemic limitations? Does the burden shift both ways? Or a scenario where refusing to fight has high personal cost—does that affect the inert conclusion? These cases can help students explore when responsibility should or shouldn't translate.
answer: |-
  Here's a precise conceptual carving of your phenomenon, addressing both the "inert-conclusion" problem and the "migrating-cost" wrinkle, along with their relationship to existing concepts:

  ### Core Phenomenon: **Normative Decoupling**
  **Definition:** The systematic separation of a collective moral judgment (e.g., "this war is unjust") from its expected practical implications for individual agents within that collective, resulting in either (1) the judgment becoming practically inert, or (2) the costs/constraints implied by the judgment being displaced onto other agents.

  ### The Two Manifestations:
  1.  **Inert Judgment (Your first case):**
      *   The macro-level moral condemnation ("unjust war") fails to generate micro-level obligations or permissions for individual combatants (e.g., no duty to refuse service, no justified punishment post-war) *or* for adversaries (who must still treat them as just combatants).
      *   **Key Mechanism:** The moral "wrongness" is quarantined at the systemic/state level, explicitly *not* allowed to "trickle down" to individual actors ("He couldn't have known," "He's just doing his job").
      *   **Effect:** Moral condemnation is reduced to a performative assertion with no operational consequences for those carrying out the condemned act.

  2.  **Migrating Cost (Your "freebie" case):**
      *   The *justification* for insulating the individual combatant from blame/obligation (e.g., epistemic limitations, duress) is transformed into a *reason* for imposing additional burdens or constraints *on the victims/adversaries* (e.g., requiring them to accept greater risk, show extra restraint).
      *   **Key Mechanism:** An excuse condition (X excuses A from blame/obligation Y) is illegitimately converted into an entitlement condition (X entitles A to demand Z from B, or obligates B to provide Z for A's benefit).
      *   **Effect:** The moral protection granted to the agent (A) functionally operates as a *liability* or *cost* imposed on the opposing agent (B).

  ### Are They One Thing or Two?
  *   **They are distinct but intrinsically linked manifestations of the core phenomenon of Normative Decoupling.**
  *   **Inert Judgment** is the *structural* decoupling: the macro-judgment is prevented from affecting micro-level permissions/obligations *at all*.
  *   **Migrating Cost** is a specific *perverse consequence* that can arise *when* an attempt is made to justify the decoupling (via excuses for the combatant). It’s a dynamic where the *explanation* for the insulation leaks out and burdens the other side. It depends on the initial decoupling but adds a specific, paradoxical cost-shifting move.

  ### Established Concepts & How This Differs
  1.  **Moral/Legal Bracketting (Jus in Bello Independence):**
      *   **What it is:** The doctrine that the rules governing conduct *in* war (jus in bello) apply equally to all combatants, regardless of the justice *of* the war (jus ad bellum).
      *   **How Normative Decoupling differs:** Bracketting is a *normative position* (combatants have equal permissions/obligations *because* ad bellum status is irrelevant). Decoupling is a *phenomenon* or *structural effect* observed *within* a framework that *grants* the ad bellum injustice but then *fails* to reconcile that with its practical implications *even when* trying to explain *why* bracketting holds. It describes the *logical gap* or *inertia* you observe, not the bracketing principle itself. Your colleague's point describes the *framework enabling* decoupling, not the decoupling phenomenon itself.
  2.  **Excuse Conditions:**
      *   **What they are:** Reasons (like epistemic limitation, duress, insanity) that negate or mitigate blameworthiness *for* an agent who performed a wrongful act.
      *   **How Migrating Cost differs:** Excuses are agent-focused, reducing *A's* blame. Migrating Cost occurs when an excuse for *A* (e.g., "A didn't know") is improperly used to generate an *obligation* or *constraint* for *B* (e.g., "Therefore, B must take extra risks targeting A"). The excuse migrates to burden a different party.
  3.  **Moral Luck (Resultant Luck):**
      *   **What it is:** An agent's moral status (blame/praise) being affected by factors beyond their control.
      *   **How Normative Decoupling differs:** Moral luck focuses on how *contingencies* affect *A's* moral status. Decoupling focuses on the *systematic disconnect* between macro-judgment and micro-implications. Migrating Cost involves luck-like factors (epistemic situation), but the core issue is the *cost-shifting*, not the luck itself.
  4.  **Agent-Neutral vs. Agent-Relative Reasons:**
      *   **What they are:** Agent-neutral reasons apply to everyone (e.g., "minimize harm"), agent-relative reasons apply based on the agent's position (e.g., "it's *your* child").
      *   **How Migrating Cost differs:** The migrating cost paradoxically tries to turn an agent-relative *excuse* for A ("*I* couldn't know") into an agent-relative *constraint* on B ("*You* must take extra risks because *I* couldn't know"). It confuses the grounding of reasons/permissions.

  ### Conclusion: No Established Term Fits Perfectly
  While concepts like "bracketing" and "excuses" are adjacent, there is no established, widely recognized term capturing the specific phenomena of **inert moral judgment at the micro-level despite macro-condemnation** and the **perverse cost-shifting of justification onto victims**. Your observation highlights a significant tension or lacuna in how responsibility is distributed in collective action contexts like war.

  ### Proposed Terminology & Boundary Cases
  *   **Core Phenomenon:** **Normative Decoupling** (The separation of macro-condemnation from micro-implications).
  *   **First Manifestation:** **Moral Inertia** (The macro-judgment fails to generate any practical micro-level obligations/permissions).
  *   **Second Manifestation:** **Excuse Transposition** (An excuse for Agent A is transposed into a burden/constraint for Agent B).

  **Boundary Cases for Discussion:**
  1.  **The Conscript in the Blatantly Aggressive War:** (Testing Inertia/Decoupling) A soldier is conscripted into a war where the government's fabricated pretext is laughably thin and widely disbelieved internationally. Does "he couldn't have known" still hold? Does the *inertia* of the "unjust war" judgment persist? If not, where is the line for reasonable belief?
  2.  **The Just Combatant's Epistemic Burden:** (Testing Transposition) Soldier A (unjust side) attacks a clearly marked hospital due to a genuine, reasonable (but false) belief it's an enemy HQ. Soldier B (just side) sees A preparing the attack. Does B's knowledge of A's *excusable mistake* (epistemic limitation) impose a *greater* obligation on B to risk themselves to warn the hospital or disable A *non-lethally* compared to if A were knowingly attacking a hospital? Does the excuse *transpose*?
  3.  **The Deserter's Dilemma:** (Testing Decoupling vs. Realism) A soldier correctly concludes their war is unjust and deserts. Their family faces severe state reprisal. Does the persistence of the "unjust war" judgment *demand* desertion regardless of cost (rejecting inertia), or does the *threat* to family provide an *excuse* for fighting? If the latter, does that excuse potentially *transpose* to impose burdens on the just side (e.g., treating him more leniently if captured)?

  These cases force students to grapple with the limits of decoupling, the grounding of excuses, and whether the cost-shifting inherent in transposition is ever morally defensible or simply a flaw in the structure of argumentation. They reveal the tension between systemic condemnation and the practical realities and vulnerabilities of individual agents caught within the system.
