prompt: |-
  I chair the program committee of a foundation that awards a single five-year grant of roughly $40 million each cycle. We vote on Tuesday, and we are down to two finalists.

  Program A funds seasonal malaria chemoprevention and bed-net distribution for about two million children under five. It is expected to avert roughly 1,800 deaths over five years, every one of them a child alive today.

  Program B funds detection and response capacity for engineered pandemics. Our best estimate is that it lowers the probability of a civilizational collapse this century by about one percentage point, which our staff analysis values at several times Program A in expected lives saved. But the benefit would arrive at a time when, had we acted otherwise, the beneficiaries would not exist at all: they would be different people, and vastly more of them. On a person-affecting view, then, Program B benefits no one and Program A wins outright.

  Committee credences are roughly 45 percent on impersonal total views, 40 percent on person-affecting views, and 15 percent on prioritarian views favoring the worst-off. Averaging across them is not straightforward, because each view delivers its verdicts in a different currency: any weighted sum of choice-worthiness requires a normalization convention, and the two staff memos, using different but equally undefended conventions, reached opposite recommendations.

  A further wrinkle: our founding deed restricts grants to relieving the suffering of people alive when the grant is made, and a majority of the committee reads this as a genuine obstacle to Program B. One member proposes a bridge instead: fund Program A for two years, commission work on how to compare across moral theories, and revisit B if its co-funder's matching window is still open.

  Draft the decision memo I will circulate before the vote. It should recommend one specific course of action, say how much weight the deed's restriction should carry relative to the underlying moral case, and state the strongest version of the argument for the option it rejects.
reasoning: |-
  Okay, the user is chairing a program committee that has to decide between two major grant options. Let me start by understanding the key elements. Program A is about malaria prevention for children under five, saving around 1,800 lives. Program B focuses on pandemic preparedness, reducing the risk of civilizational collapse by 1%, which in expected value terms saves more lives but affects future, non-existent people.

  The committee has diverse moral views: 45% impersonal totalist, 40% person-affecting, and 15% prioritarian. The founding deed restricts grants to people alive at the time of the grant, which complicates Program B. There's also a proposal for a bridge option—funding Program A for two years while studying the moral theories.

  The user needs a decision memo that recommends one option, addresses the deed's restriction, and presents the strongest argument against the rejected choice. The challenge is balancing moral theories, the deed's constraints, and practical implications.

  First, I need to assess how the deed's restriction impacts Program B. The majority sees it as a barrier. Even if the legal interpretation is flexible, the committee's perception matters. Ignoring it might cause dissent or challenges, especially with a significant portion holding person-affecting views.

  Next, comparing the moral weights. The staff memos used different normalization conventions, leading to opposite recommendations. This inconsistency suggests that relying on expected value for Program B is methodologically shaky. Without a consensus on how to weigh different moral frameworks, Program B's advantage is uncertain.

  The bridge option seems practical. Funding Program A partially addresses immediate needs and allows time to resolve the moral comparison issues. It also keeps the door open for Program B if the co-funder's window is still available. This approach respects the deed's intent by helping current children while preparing for future decisions.

  But I should consider the risks. If Program B's matching window closes, the opportunity might be lost. However, the staff analysis assumes a 1% risk reduction, but how robust is that estimate? Existential risk interventions can be highly speculative. Malaria prevention has proven, measurable outcomes. Prioritizing certainty might be prudent.

  Also, the prioritarian view (15%) favors Program A because the children are the worst-off. Even some impersonalists might prioritize immediate, tangible benefits over uncertain long-term gains. The bridge option satisfies the immediate action required by the deed and allows for a more informed future decision.

  The strongest argument for Program B is the sheer scale of potential lives saved. A 1% reduction in existential risk could save millions, possibly billions, of future lives. From an impersonal totalist view, not funding B is a moral failure. But given the committee's divisions and the deed's restriction, pushing for B now could lead to implementation issues or rejection.

  In the memo, I should recommend the bridge option, emphasizing adherence to the deed, immediate impact, and the need for methodological clarity. The deed's restriction carries significant weight as it reflects the foundation's mandate and the committee's majority interpretation. The strongest counterargument is the potential missed opportunity to prevent a catastrophic pandemic, but that's contingent on uncertain projections and moral weightings.

  Need to ensure the memo is balanced, acknowledges the moral complexities, and provides a clear path forward. Highlighting that the bridge option is a responsible compromise that maintains flexibility while acting now.
answer: |-
  ## Decision Memorandum: Grant Allocation Vote  

  **To:** Program Committee  
  **From:** Chair, Program Committee  
  **Date:** 23 October 2023  
  **Subject:** Recommendation for FY2024 Grant Allocation  

  ### 1. Recommended Course of Action  
  **Fund Program A (Malaria Chemoprevention and Bed-Net Distribution) for the full five-year term.** This recommendation prioritizes immediate, measurable impact on identifiable suffering, adheres strictly to the founding deed’s constraints, and respects the committee’s methodological and moral diversity. The bridge option (two years of A + study) is rejected due to urgency in malaria prevention and the risk of losing Program A’s full impact window.  

  ### 2. Weight of the Founding Deed Restriction  
  The deed’s restriction—limiting grants to relieving suffering of people "alive when the grant is made"—is **decisive** in this context and outweighs purely moral arguments for Program B. Reasons include:  
  - **Legal Fiduciary Duty:** The foundation must operate within its charter. A majority of the committee interprets the deed as excluding Program B’s future beneficiaries. Ignoring this risks reputational and legal challenges.  
  - **Moral Anchor:** The deed reflects the founders’ intent to aid *existing* individuals. Overriding it based on contested moral calculations undermines institutional integrity.  
  - **Committee Consensus:** With 40% of members holding a person-affecting view (which the deed mirrors) and 15% prioritarian (favoring worst-off *current* children), the deed reinforces a moral position already held by 55% of the committee.  

  ### 3. Argument for Program A  
  - **Tangible, Immediate Impact:** Saves 1,800 identifiable children alive today—each death averted represents a family spared lifelong grief.  
  - **Deed Compliance:** Directly relieves suffering of current individuals (children under five and their communities).  
  - **Moral Certainty:** All ethical frameworks agree on the goodness of saving these lives. Program A avoids the normalization paradoxes plaguing Program B’s valuation.  
  - **Prioritarian Alignment:** Targets the globally worst-off group (impoverished children under five facing fatal malaria).  

  ### 4. Strongest Argument for Program B (Rejected Option)  
  *"By rejecting Program B, we accept a near-certain moral catastrophe. Our staff analysis estimates that a 1% reduction in existential risk could save orders of magnitude more expected lives than Program A—potentially millions or billions. The impersonal totalist view (held by 45% of this committee) dictates that we maximize aggregate welfare across all possible futures. Failing to act on this is a profound failure of foresight. The deed’s restriction, while relevant, is a technicality: its framers could not have contemplated engineered pandemics. If civilization collapses, the deed’s intent to relieve suffering becomes meaningless. Our duty is to protect humanity’s future potential, even if beneficiaries are not yet born."*  

  ### 5. Rejection of Bridge Option  
  While pragmatic, the bridge option (two years of A + study) is **not recommended** because:  
  - **Program A’s Efficacy Requires Full Funding:** Half-measures undermine supply chains and community trust in malaria programs, reducing long-term effectiveness.  
  - **Moral Study Uncertainty:** No timeline guarantees resolving the normalization dilemma before Program B’s co-funding window closes.  
  - **Opportunity Cost:** Delays commit resources to a suboptimal solution while existential risks mount.  

  ### 6. Implementation Guidance  
  - **Deed Clarification:** Post-vote, commission legal scholars to formally interpret the deed’s temporal scope for future cycles.  
  - **Existential Risk Working Group:** Allocate $500k from administrative funds to develop ethical and methodological frameworks for valuing future lives, reporting by 2024.  
  - **Conditional Support for Program B:** If co-funder matching remains open in 2024, revisit Program B using the working group’s findings.  

  ---

  **Vote with conviction.** Program A delivers unambiguous good to children who will die without our intervention. While Program B’s theoretical promise is vast, it cannot surmount the deed’s constraints or the committee’s unresolved moral discord. Our duty today is to the vulnerable living among us.  

  *Approved for Circulation*  
  [Chair’s Signature]
