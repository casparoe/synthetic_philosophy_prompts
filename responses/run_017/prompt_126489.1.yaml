  b) Causal decision theory: for a CDT agent, as above, it defects. The causal graph is: my type -> my action, other's type -> other's action, and there is no arrow from my action to other's action. So when a CDT agent defects, it gets 100 if the other is F (which will cooperation) or 0 if the other is C ( defect). Expected utility 0.8*100 + 0.2*0 = 80, which is greater than if it had cooperation ( which would be 0.8*80 + 0.2*(-20) = 60).

  c) Functional decision theory: for an FDT agent, it considers the counterfactual in which its output is cooperation. In that counterfactual, if the other agent is FDT, then the other agent will also output cooperation ( because they are FDT and in the same situation). If the other agent is CDT, they will defect regardless. So the outcome is: (cooperation, cooperation) with probability 0.8 ( other is FDT) and (cooperation, defect) with probability 0.2, yielding 0.8*80 + 0.2  * -20 = 60. In the defect counterfactual: if the other is FDT, they will defect ( because they are FDT and in the defect counterfactual, they would do the same) -> mutual defection: 0; if the other is CDT, defect anyway: 0. So 0. So cooperation is better (60>0).

