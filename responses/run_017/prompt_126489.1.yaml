  e) Evidential decision theory (EDT) in two branches:

   First branch: the agent has already settled and introspected its own output. Then, its act carries no news about its own type. But the agent's type is already determined. If the agent is about to cooperation, what does that tell about the other agent? nothing, because the types are independent. So P(other cooperation | I cooperation) = P(other is F) = 0.8. Then the expected utility of cooperation is 0.8*80 + 0.2*(-20) = 60. For defect: P(other cooperation | I defect) = P(other is F) = 0.8, because the agent's action is not evidence about the other's type. So expected utility of defect: 0.8*100 + 0.2*0 = 80. So EDT would defect.

