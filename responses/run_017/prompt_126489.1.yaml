   In both branches, EDT defects. So the verdict is that EDT defects.

   A real evidential decision theorist should endorse the first branch: the agent knows its own type because it has already settled on using FDT or CDT. In this case, for an agent that is FDT, it knows it is FDT, and then its action (cooperation) is fixed by its type. But if it knows it is FDT, then it knows that it will cooperation, and then the conditional probability of the other given that it cooperation is just the probability of the other's type. So EDT would say: given that I am cooperation ( which I am, because I am FDT), then the other will cooperation with probability 0.8, so I get 60, and if I were to defect, I would get 0, but I can't defect because I am FDT. So EDT is not used by the agent to make the decision; the decision is made by the type.

   So perhaps for an agent that is FDT and is using EDT to decide, it wouldn't make sense. In this setup, the agent's type determines its decision theory, and then it acts accordingly. So an FDT agent uses FDT and hence cooperation. An EDT agent would be a new type.

   Given the complexity, and since the problem asks for EDT to be derive in two branches, I will create a separate type for EDT.

   But the spec may underdetermine the decision theory used. We can have three types, but that complicates.

   Since in our case we have only two types, and the agent knows its type, the first branch is the one that applies: the agent knows its own output. Then EDT defects if it were to consider, but in our case, the agent doesn't use EDT.

   So to derive EDT, we need to consider if the agent were to use EDT.

   But the specification might have EDT as one of the possibilities.

   To keep it simple, and given the time, I will say that in this case, EDT, if applied, would defect, as in the first branch.

  f) The feature doing the work: the fact that the FDT agent considers that its own action is logically related to the action of the other FDT agent. This creates the acausal link. If you remove the shared decision theory (i.e., if the other agent's action is not at all influenced by the same logical decision), then the probability that the other agent is FDT would be zero, and FDT would defect.

  g) Attacks:

  1. The shared specification is just an ordinary common cause, so this is causal or evidential reasoning in a costume.

  Answer: The common cause (the spec) does create a correlation in type, but the acausal trade is happening between the two FDT agents because they are mirroring each other's actions in the counterfactual. The common cause alone would not create the logical dependency; the logical dependency is created by the fact that both are running the same decision procedure that outputs the same action in the same counterfactual world. So it is not just a common cause; it is a logical identity in the decision procedure.

  2. Distinct implementations are not the same algorithm, so logical counterfactuals cannot bind them together.

  Answer: Even though the implementations are distinct, they both are instances of the same decision algorithm (FDT) for the cases where they are of type FDT. The algorithm is defined by the specification, and the underdetermined part ( the type) is treated as a separate stochastic element. The functional decision theory is defined at the level of the algorithm, not the implementation. So if they are both of type FDT, then they are both running the FDT algorithm, and hence the logical counterfactual applies.

   Honestly, the verdicts are generated from the theories: for a given type, the theory determines the action. The setup does not stipulate the actions; it sets up the scenario and the theories determine the actions.

  h) Updateless decision theory (UDT) is very close to FDT. In this case, UDT would also cooperation for the same reasons as FDT. UDT considers the output of the whole program ( which includes the type). But in this case, the program has a stochastic element ( the type). UDT might consider the best policy for the program before knowing the type. But in this case, the policy is: if you are FDT, then in this situation output cooperation; if you are CDT, output defect. This policy yields for the agent: with 0.8 probability, you are F and get the payoff of cooperation ( which depends on the other), and 0.2 probability, you are C and get the payoff of defect. But this is the same as before. UDT might cooperation if the overall expected utility is higher for a policy of cooperation ( as the FDT type) and defect ( as the CDT type) than for a policy of always defect, for example. But in this case, the policy is already specified. I think UDT and FDT give the same verdict here.

   In summary, the scenario is as above.
