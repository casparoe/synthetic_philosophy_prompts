   P(other cooperation | I cooperation) = P(other is F | I cooperation)

   By independence, P(other is F) = 0.8, and P(I am F) = 0.8. But is there any dependency? Only if the action "I cooperation" is evidence about my type, and then about the other's type? But the types are independent. So P(other is F | I cooperation) = P(other is F) = 0.8.

