prompt: |-
  I direct a small policy-planning unit inside a foreign ministry, and effectively all of our work arrives in the form of a claim that some present situation is a repeat of an earlier one: this is Munich, this is Vietnam, this is 1914, this is a rising power frightening an established one, this is the Cuban Missile Crisis and therefore we should blockade rather than invade. These claims come in weekly, from ministers, from allied governments, from our own staff, and increasingly from advocacy groups. They are not offered as decoration; they are offered as evidence that a particular policy will succeed or fail. My team has no framework for grading them, so the loudest analogy wins.

  What I want from you is a written procedure my analysts can actually run, not an essay about analogy. Constraints on its use: one or two generalists with no graduate training in history, roughly forty-five minutes, open sources only, no archives and no specialist consultation; the write-up has to fit on one page and be readable by a minister who has never thought about analogical reasoning; and it has to terminate in one of three verdicts — the analogy earns weight in the forecast and licenses a named prediction; it is only a reframing device, good for generating questions but not for answering them; or it is doing rhetorical work and should be struck from the paper. Please give me the ordered questions, what counts as a sufficient answer to each, the points where the sequence stops with a no, and the points where the remaining question is one of values or of irreducible judgment and must be handed to a named human rather than settled by the checklist.

  Four constraints on the design itself, because the easy versions of this fail.

  First, the procedure cannot rest on an agreed reading of the source case. Historians dispute what Munich teaches, what Vietnam teaches, and whether the Peloponnesian War really was a case of an established power reacting to a rising one; if your checklist requires the analyst to know what actually happened and why, it will just reproduce the analyst's politics. It has to work when the source case is contested.

  Second, it must sort surface resemblance from mechanism portability: the analogy has to name the mechanism that did the causal work in the source case, state the conditions under which that mechanism operates, and then check those conditions in the target rather than counting shared features.

  Third, it must be symmetric. For every analogy offered, the analyst should have to produce the best-fitting analogy that supports the opposite policy and run the same steps on it; a procedure that only ever interrogates the other side's analogy is worthless to me. Say explicitly what the analyst should do when the two analogies come out with comparable fit and opposite recommendations, since that is the common case and not a degenerate one.

  Fourth, it must handle two pathologies I see constantly. One is selection: the cases we remember were filtered by outcome, and the lessons that survive in public argument were filtered again by how useful they are to people arguing for action, so a procedure that asks only whether the target resembles the source inherits both filters. The other is reflexivity: the other side has read the same history. A government may stage a provocation expecting us to read it as Munich, or refrain from something expecting us to read it as 1914, or invoke our own archival analogy back at us. The procedure needs a step for the case where the target is reasoning about our analogy use, including the possibility that the analogy is being deployed as a weapon rather than offered as a forecast.

  Please also build in a pre-registration step, since we nearly always see the analogy after the recommendation is already drafted, and a step that asks what the expected loss is if the analogy is wrong and the action it recommends is irreversible.

  Then run it, honestly, on three live-shaped cases: a hegemon-and-rising-power framing applied to the current competition over Taiwan; a Munich framing applied to a demand that a neighbouring state cede territory and cap its alliances; and a Vietnam framing applied to a proposal to send a few hundred advisers and some air support to a government losing a counterinsurgency. My unit has a house bias — we are the restraint-minded desk, we reach for 1914 and Vietnam, and we are reflexively hostile to Munich framings — so if the honest output is that our own house analogy is the weakest of the three, say that plainly, because it is the answer I will be most tempted to reject.

  Finally, tell me what the procedure cannot do, where it will misfire, and which of its steps are judgment calls dressed up as method. And note that the failure mode I most want to avoid is a checklist whose real content is check whether the analogy is accurate, or one that amounts to general scepticism about learning from history; the verdicts have to be generated by the structure of the case and the mechanism, not by the analyst's prior view of the policy.
reasoning: |-
  Alright, the user directs a small policy-planning unit in a foreign ministry, overwhelmed by historical analogies used as policy evidence. They need a practical procedure to evaluate these analogies under tight constraints: limited time, no specialized training, open sources only, and clear verdicts. 

  First, I need to unpack their core frustrations. The loudest analogy wins because there's no framework to assess them systematically. The user mentioned four key constraints on the design: avoiding reliance on contested historical interpretations, distinguishing surface resemblance from causal mechanisms, ensuring symmetry by evaluating opposing analogies, and addressing selection bias and reflexivity. 

  The user also highlighted common pathologies—selection bias (remembered cases are outcome-filtered) and reflexivity (adversaries using analogies strategically). Plus, they want pre-registration to prevent retrofitting and a cost assessment for irreversible actions. 

  For the procedure, I consider structuring it as a flowchart with ordered questions. The three verdicts are crucial: analogy has predictive weight, is only for reframing, or is rhetorical and should be discarded. The symmetric requirement means analysts must find a counter-analogy for every claim. 

  I plan to include steps that force mechanism-based checks instead of feature-matching. For example, instead of asking "Does this look like Munich?" ask "What causal mechanism made Munich relevant? Does it apply here?" 

  The pre-registration step is vital—forcing analysts to state the analogy before seeing the policy recommendation prevents cherry-picking. The loss assessment step addresses irreversible actions, which is often overlooked. 

  Testing the procedure on three live cases will reveal biases. The user admits their unit favors restraint (Vietnam/1914 analogies), so if Munich scores higher in the Taiwan case, I must be honest even if it challenges their house view. 

  For the Taiwan case (hegemon vs rising power), the Thucydides Trap analogy might fail on mechanism portability. The Munich case (territorial demand) could show predictive weight but high reflexivity. The Vietnam case (advisers deployment) might only hold value for reframing due to different mechanisms. 

  I need to explicitly state the procedure's limitations—it can't resolve deep historical disputes or eliminate judgment calls. Steps like mechanism identification are inherently interpretive. The goal isn't historical skepticism but structured scrutiny. 

  Finally, the user's unspoken need might be institutional credibility. They want to depoliticize analogy use, replacing loudness with rigor. By making the procedure transparent, they can defend verdicts to ministers, even when rejecting cherished analogies.
answer: |-
  Here is a procedural checklist for evaluating historical analogies in policy planning, designed for your constraints. It requires **two analysts** (A1 & A2) working jointly for **45 minutes** using **open sources only**.

  **Pre-Registration:** *Before* seeing the policy recommendation, A1 & A2 must state: "The proposed analogy is [Source Case] applied to [Target Situation] to support policy [Policy X]." (If the analogy arrives *with* the recommendation, this step flags retrofitting risk.)

  ---

  **Analogy Evaluation Procedure (AEP)**

  **Step 1: State the Claimed Causal Mechanism (5 mins)**
  *   **Question:** "What *specific causal mechanism* from the source case is claimed to apply to the target situation, leading to the predicted outcome (success/failure) if [Policy X] is adopted?"
  *   **Sufficient Answer:** A clear statement (e.g., "Appeasement (Munich) emboldens aggressors, leading to wider war"; "Direct combat troop deployment (Vietnam) triggers nationalist resistance and quagmire"; "Security dilemma spiral (1914) between rising/established power causes accidental war").
  *   **Stop if:** No specific mechanism is named or it's purely descriptive ("It's like Munich!"). **Verdict: Rhetorical - Strike.**
  *   **Handoff:** None. Mechanism *must* be specified to proceed.

  **Step 2: Identify Plausible Counter-Analogy (5 mins)**
  *   **Task:** A1 & A2 identify the *best-fitting analogy supporting the OPPOSITE policy* to [Policy X] (e.g., If Munich argues for confrontation, find an appeasement-success case; If Vietnam argues against intervention, find a successful limited intervention case).
  *   **Sufficient Answer:** Naming the counter-analogy and its claimed mechanism (e.g., For Munich (confrontation): "Kennedy/Khrushchev letters during CMC (compromise) avoided nuclear war"; For Vietnam (non-intervention): "El Salvador (1980s) - US advisers + air support helped stabilize government").
  *   **Stop if:** No plausible counter-analogy can be identified *at all*. (Rare. Usually proceed). **Note:** This forces symmetry. Both analogies now proceed through Steps 3-5.

  **Step 3: Check Mechanism Activation Conditions (Source Case) (10 mins)**
  *   **Question (for BOTH Analogies):** "What were the *necessary conditions* in the source case for the claimed mechanism to operate? (Focus on structural/political/strategic factors, *not* the outcome)."
  *   **Sufficient Answer:** 3-5 key conditions derived from open-source historical summaries (e.g., For Munich Mechanism: 1. Asymmetric revisionist aims by aggressor; 2. Defender coalition fragility; 3. Aggressor perception of defender weakness/resolve deficit. For CMC Compromise Mechanism: 1. Existential stakes for both; 2. Clear off-ramps; 3. Direct leader-to-leader communication channels).
  *   **Handoff:** If source conditions are *highly contested* by mainstream open sources, note the dispute but proceed with the *most commonly cited* conditions. Judgment call: Is the dispute about *facts* or *interpretation*? Focus on factual conditions.

  **Step 4: Check Condition Presence in Target (15 mins)**
  *   **Question (for BOTH Analogies):** "For each necessary condition identified in Step 3, does it *plausibly exist* in the target situation *today*, based on current OSINT? (Rate: Strong / Weak / Absent / Contested)."
  *   **Sufficient Answer:** Brief justification for each rating using *current, verifiable facts* (e.g., "Condition 1 (Asymmetric aims): Strong - State Y's leadership explicitly claims Territory Z is core interest; Condition 2 (Coalition fragility): Weak - Allies A & B show strong public support for defender State X").
  *   **Stop (for an analogy) if:** A *critical* necessary condition (agreed by both analysts as fundamental) is **Absent** or **Contested** with no strong evidence. **Verdict for that analogy: Reframing Only.**
  *   **Handoff:** None. Focus on observable present-day facts.

  **Step 5: Assess Reflexivity & Selection Bias (5 mins)**
  *   **Question (for BOTH Analogies):** "1. (Selection) Are there *forgotten cases* where similar conditions existed but the mechanism failed/outcome differed? 2. (Reflexivity) Is there OSINT evidence the *other actor(s) are consciously invoking* this analogy (or its counter) to manipulate our response?"
  *   **Sufficient Answer:** 1. Name 1-2 plausible alternative cases (e.g., For Munich: "Also consider Berlin Blockade 1948 - firmness succeeded without war?"). 2. Cite public statements, doctrine, or expert OSINT analysis suggesting strategic use of the analogy by the adversary.
  *   **Impact:** Does **not** automatically change verdict. Flags risks: If strong evidence of adversarial reflexivity, it *undermines predictive weight*. If strong evidence of selection bias (ignored counter-cases), it *strengthens Reframing verdict*.

  **Step 6: Irreversible Loss Assessment (5 mins)**
  *   **Question (for PRIMARY analogy only):** "If the analogy is wrong and we follow [Policy X], what is the *plausible worst-case, irreversible loss*? If we reject [Policy X] based on this analogy, what *irreversible opportunity* might be lost?"
  *   **Sufficient Answer:** Concise statement of maximum credible downside/opportunity cost (e.g., "Irreversible loss: Sovereign territory permanently annexed." / "Lost opportunity: Collapse of allied government leading to hostile regime.").
  *   **Handoff:** None. Informs final judgment but doesn't change verdict.

  **Final Verdict (Per Analogy):**
  *   **Predictive Weight:** *All* critical necessary conditions from Step 3 are rated **Strong** in Step 4, *and* Step 5 reveals no overwhelming reflexivity/selection bias. Analogy licenses a specific prediction about [Policy X]'s outcome.
  *   **Reframing Only:** Some critical necessary conditions are **Weak, Absent, or Contested** in Step 4, *or* Step 5 reveals significant selection bias/reflexivity. Useful for questions (e.g., "Is coalition fragility a risk?"), not for prediction.
  *   **Rhetorical:** Failed at Step 1, *or* mechanism is demonstrably irrelevant to target based on Step 4. Strike from paper.

  **Symmetry Resolution:** If Primary and Counter-Analogy both earn **Predictive Weight** but recommend opposite policies:
  1.  Flag the contradiction explicitly.
  2.  Default Verdict for **BOTH:** **Reframing Only.** (They highlight competing risks, not deterministic predictions).
  3.  **Handoff:** Policy decision *must* be escalated to [Named Senior Policy Director] with both analyses. The choice is fundamentally political/values-based under deep uncertainty.

  ---

  **Live Case Application (Honest Run - Assuming OSINT Consensus):**

  1.  **Taiwan (Hegemon vs. Rising Power - Thucydides Trap):**
      *   **Mechanism:** Security dilemma spiral -> accidental war (1914).
      *   **Conditions:** Rigid alliances, inflexible war plans, belief in short-war, communication failures, domestic pressure for toughness.
      *   **Target Check (Step 4):** Flexible (not rigid) alliances? Modern comms? Belief in long war? Domestic pressure? **Ratings: Mixed/Contested.** Reflexivity (Step 5): **High** - China/US explicitly invoke this analogy.
      *   **Counter-Analogy:** UK/US power transition (Late 19th/Early 20th C) - managed peacefully. Conditions: Economic interdependence, institutional engagement, shared democratic values? **Target Check:** Interdependence? High. Shared values? Absent. Institutional engagement? Weak.
      *   **Verdict (Thucydides): Reframing Only.** (High reflexivity, contested conditions). **Verdict (UK/US): Reframing Only.** (Condition mismatch). **Symmetry Resolution:** Highlights competing risks (spiral vs. managed transition) - Policy choice is values-based.

  2.  **Territorial Demand (Munich - Argues for Confrontation):**
      *   **Mechanism:** Appeasement -> Emboldenment -> Wider Aggression.
      *   **Conditions:** Asymmetric revisionist aims, defender resolve deficit/fragility, aggressor belief concessions indicate weakness.
      *   **Target Check:** Asymmetric aims? **Strong.** Defender resolve? **Strong (OSINT: Public statements, troop moves).** Aggressor belief? **Contested (But OSINT suggests aggressor sees defender as strong).** Reflexivity: **Very High** - Aggressor likely *wants* defender to see this as Munich to force over-reaction.
      *   **Counter-Analogy:** Cuban Missile Crisis (Compromise -> Peace). Conditions: Existential stakes, off-ramps, direct comms. **Target Check:** Existential stakes? **Weak (Local territory, not nuclear).** Direct comms? **Weak.** Off-ramps? **Plausible.**
      *   **Verdict (Munich): Reframing Only.** (Critical condition - aggressor perception of weakness - likely unmet; extreme reflexivity). **Verdict (CMC): Reframing Only.** (Condition mismatch on stakes/comms). **Symmetry Resolution:** Neither predictive; risks are miscalculation (Munich frame) vs. missed diplomatic opportunity (CMC frame). Handoff to Senior Director.

  3.  **Advisers/Air Support (Vietnam - Argues Against Intervention):**
      *   **Mechanism:** Foreign Combat Troop Presence -> Nationalist Backlash -> Quagmire.
      *   **Conditions:** Strong pre-existing nationalist/anti-foreign sentiment, weak host government legitimacy, insurgent popular support, external support for insurgents, terrain favoring insurgency.
      *   **Target Check:** Nationalist sentiment against *us*? **Weak/Contested (OSINT: Focused on insurgents).** Host gov legitimacy? **Mixed (Elections held, but disputed).** Insurgent popular support? **Contested (No reliable polling).** External support? **Strong.** Terrain? **Urban/Mixed (Not jungle).**
      *   **Counter-Analogy:** Colombia (2000s) - US advisers/air support aided successful COIN. Conditions: Professional host military, sustained US commitment, focused objectives, effective host gov reforms. **Target Check:** Professional military? **Weak.** Sustained US commitment? **Plausible.** Objectives? **Focused?** Gov reforms? **Stalled.**
      *   **Verdict (Vietnam): Reframing Only.** (Key conditions - nationalist sentiment, terrain - weak/unmet; legitimacy/insurgent support contested). **Verdict (Colombia): Reframing Only.** (Key conditions - professional military, reforms - weak/unmet). **Symmetry Resolution:** Neither strongly predictive. Highlights need to assess specific local conditions (gov legitimacy, military capability) over historical parallels.

  **House Bias Note:** As requested, the honest application shows your "house" analogies (1914/Thucydides on Taiwan, Vietnam on Advisers) performed *no better* than the opposing analogies, consistently landing in **Reframing Only**. The Munich case also failed predictive weight due to reflexivity and condition mismatch. The procedure exposed the fragility of *all* these analogies as predictive tools under current conditions.

  ---

  **Limitations & Failure Modes:**

  1.  **Judgment Calls Disguised as Method:**
      *   Identifying the "core mechanism" (Step 1) is interpretive.
      *   Defining "critical" necessary conditions (Steps 3/4) is subjective.
      *   Rating condition presence "Strong/Weak" (Step 4) involves judgment.
      *   Assessing OSINT credibility is inherent.
  2.  **Where it Misfires:**
      *   **Novelty:** Wholly unprecedented situations lack meaningful analogies. The procedure might force-fit weak ones.
      *   **Over-quantification:** May dismiss valid but complex/comparative historical insights requiring nuance beyond checkboxes.
      *   **Source Case Complexity:** Fails if the source case mechanism is truly unknowable from OSINT consensus in 10 mins.
      *   **"Unknown Unknown" Conditions:** Cannot account for conditions vital to the mechanism but currently invisible.
  3.  **Cannot Do:**
      *   Resolve deep historical disputes about the source case.
      *   Eliminate the role of values or leadership judgment in final decisions.
      *   Predict the future. It only assesses the *evidentiary weight* of a specific analogy for a specific prediction.
      *   Fully overcome selection bias; identifying "forgotten cases" (Step 5a) relies on analyst knowledge/OSINT serendipity.
  4.  **Avoided Failure Modes:**
      *   **Not Accuracy-Centric:** Focuses on mechanism portability (Conditions Y exist now? Not: Was Condition X *really* why Source Case happened?).
      *   **Not General Skepticism:** Generates specific verdicts based on mechanism and condition matching. "Reframing Only" affirms *utility*, just not predictive power. "Predictive Weight" is possible.

  This procedure forces rigor, symmetry, and mechanism-based analysis within severe constraints, directly addressing your pathologies. It reveals analogies as often heuristic tools rather than crystal balls, precisely your goal. Use it to discipline the argument, not to replace policy judgment.
