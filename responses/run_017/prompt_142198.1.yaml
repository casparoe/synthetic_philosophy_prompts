prompt: |-
  I am a clinical epidemiologist, and I sit on a committee that decides which screening and treatment programmes get funded. The committee's remit says it may fund only the prevention, detection, or treatment of disease, and we have discovered that none of us can say what that excludes. Before I write the position paper I have been asked to write, I want to test my own case verdicts against a principle. Below are the verdicts I actually hold. Several of the cases are invented deliberately, because with the familiar examples I can never tell whether I am judging the case or remembering a judgement. I have flagged the pairs whose verdicts I suspect cannot both stand.

  One. A blood marker found on screening, present in about five per cent of adults, which produces no symptom anyone ever notices but which doubles twenty-year stroke risk; a cheap drug removes the excess risk entirely. My verdict: a disease, and a committee that declines to fund screening for it is being negligent.

  Two. A visible pigmentation variant, with no functional difference of any kind. Bearers are systematically excluded from employment and marriage and report chronic distress. In the region where the variant is common, the same bearers report no distress at all. My verdict: not a disease; what needs fixing is the arrangement, not the people.

  Three. A familial condition, onset in early childhood, lifelong, consisting in incapacitating misery. No structural or chemical abnormality has ever been found; the misery is the only finding. It runs in families, it is not traceable to circumstances, and bearers get partial relief from medication and beg for a medical framing. My verdict: a disease. I note that this and case two are both cases of suffering with no demonstrable mechanism, and that the only difference is whether the causal route runs through other people's conduct.

  Four. A receptor variant. Homozygotes lack a working receptor, are statistically atypical, and show measurably weaker responses to some common pathogens, but are effectively immune to a widespread lethal virus and have normal life expectancy. My verdict: not a disease. I would resist any programme aimed at correcting it.

  Five. A metabolic variant that causes obesity and diabetes in the current food environment, but which was neutral or advantageous in the environment in which it arose and spread. My verdict: a disease here and now. I do not think the ancestral environment is the right reference class.

  Six. Two age-related conditions. Six-a: the near-universal loss of lens accommodation after fifty, correctable with glasses, no distress. My verdict: not a disease. Six-b: a neurodegenerative process that is near-universal past eighty, causing severe memory loss and death. My verdict: a disease. Both are statistically typical for the age class, and I split them anyway.

  Seven. Two hereditary circadian phenotypes. Seven-a: consolidated eight-hour sleep, unshiftable, from four in the morning until noon, with no other cost, and with a full working and social infrastructure built around it locally. My verdict: not a disease. Seven-b: the same total sleep, fragmented into six short blocks across the twenty-four hours, with no other measurable cost, where the bearers are tired and distressed mainly because of how the working day is scheduled. My verdict: a disease. I cannot say why the fragmentation feels like a failure and the phase shift does not, and I notice that seven-b looks uncomfortably like case two.

  Eight. A dog breed whose skull shape is now statistically typical for the breed, was deliberately selected for, and causes chronic airway obstruction. My verdict: a disease, and breeding for it is objectionable. I assume this tells me something about whether typicality is measured against the species, the breed, or the selected function, but I am not sure what.

  Nine. The case I go back and forth on. In an isolated valley population, essentially everyone carries a variant that costs about fifteen years of life relative to neighbouring populations, that nobody there experiences as a loss, that is locally regarded as normal, and that most bearers would decline treatment for if it were offered. My verdict alternates between: a disease, which we should offer to treat; and a population trait, which it would be presumptuous to medicalise.

  Ten. A continuous biomarker. I call the person at the ninety-ninth percentile diseased and the person at the ninety-second not, and I can point to no qualitative difference between them. Both verdicts feel right; I cannot say where the line belongs or whether there is one.

  The principle I have been working with, which I do not trust: a condition is a disease if and only if (i) some part or process of the organism performs below its species-typical contribution to survival or reproduction, the reference class being fixed by age and sex within the environment the organism actually lives in; (ii) the bearer is worse off with the condition than without it, all things considered; and (iii) the condition is the sort of thing medicine could in principle correct, as opposed to something we can only accommodate by rearranging the social world. My suspicion is that clause (iii) is doing the real work in cases two and seven-b, and that it is either circular or is smuggling in an institutional criterion under cover of a biological one.

  What I want from you:

  First, state as precisely as you can the best available principle in each of the three families I know are on the table — the biostatistical or naturalist one associated with Boorse, the hybrid harmful-dysfunction one associated with Wakefield, and an honestly normativist or constructivist one — and for each, say which of my ten verdicts it must overturn and which it accommodates only by distorting the case.

  Second, give me your preferred principle, clause by clause, naming the case that motivates each clause and the clause, if any, that exists solely to rescue a verdict of mine you think is indefensible.

  Third, tell me what your principle predicts about three cases not on my list: a singer who loses an unusual vocal capacity that was always statistically atypical and contributed nothing to survival or reproduction, and whose life is wrecked by the loss; a wild animal population in which a heritable condition is typical, shortens each bearer's life, and increases that bearer's reproductive success; and a variant that is currently carried by five per cent of the population and projected to be carried by most of it within five generations, because the environment is changing in a direction that favours it. Does disease status drift with frequency on your account?

  Fourth, and most usefully: state plainly which of my verdicts no coherent principle can save, and what I should say instead in the position paper. If the honest answer is that my committee's remit cannot be made to do the work we are asking of it, say so and say what should replace it.

  Fifth, tell me what kind of case my set is missing — the case that would discriminate between whichever candidates survive the third and fourth steps. I would rather add one well-chosen case than argue from these ten.

  Please argue from the cases and from the structure of the concepts; I do not want a literature review, references, or a reading list, and I would rather you did not lean on who said what.
reasoning: |-
  Okay, the user is a clinical epidemiologist on a committee that decides funding for screening and treatment programs. They need to define what constitutes a disease according to their remit, which only allows funding for prevention, detection, or treatment of disease. They've provided ten cases with their personal verdicts and suspect some inconsistencies. They want to test these against different philosophical principles of disease and get a clearer principle to guide their committee.

  First, I need to recall the main theories of disease: the biostatistical (Boorse), harmful dysfunction (Wakefield), and normativist approaches. For each, I'll outline the principle, then apply it to each case to see where it conflicts with the user's verdicts. 

  Looking at Case 1 (blood marker increasing stroke risk), all theories would likely call it a disease since it's a dysfunction causing harm, treatable medically. The user's verdict aligns here. Case 2 (pigmentation variant causing distress due to discrimination) is trickier. Boorse's theory wouldn't classify it as disease since there's no biological dysfunction—it's purely social. Wakefield might see dysfunction if psychological mechanisms are impaired, but the user says no. Normativists would call it disease due to suffering. But the user says not a disease, so Boorse aligns with them, others don't.

  Case 3 (familial misery without physical abnormality) is a challenge for Boorse since no biological dysfunction is found. Wakefield requires dysfunction, which might not be provable. Normativists would call it disease due to suffering. The user says disease, so Boorse and Wakefield might struggle here unless they stretch definitions. 

  Case 4 (receptor variant with mixed effects) isn't dysfunctional for Boorse since life expectancy is normal. Wakefield might see harm but not dysfunction. User says not disease, so Boorse aligns. Case 5 (metabolic variant causing diabetes now) – Boorse would call disease due to dysfunction in current environment. User agrees. 

  Cases 6a and 6b (age-related conditions) test typicality. Boorse uses age-specific norms, so presbyopia isn't disease, dementia is. User agrees. Wakefield might see both as dysfunctions but only dementia as harmful. Normativists might medicalize both. User splits them, aligning with Boorse.

  Cases 7a and 7b (circadian phenotypes) are revealing. For 7a (phase shift), no harm in adapted society, so not disease. For 7b (fragmented sleep), distress due to social schedule. Boorse might see dysfunction in 7b? But user calls 7b disease, 7a not. Wakefield might see dysfunction in circadian rhythm for 7b, but user compares it to Case 2, which is social. User's verdict here seems inconsistent with their own Case 2 verdict.

  Case 8 (dog breed with airway obstruction) – Boorse would use species-typical function, so dysfunction. User agrees. Case 9 (valley population with shorter lifespan) is hard. Boorse would compare to species norm, so disease. But user wavers. Wakefield might see dysfunction but no harm perceived. Normativists might respect cultural norms. Case 10 (continuous biomarker) shows the arbitrariness problem in all theories.

  The user's principle has three clauses: species-typical function, bearer worse off, and medically correctable. Clause (iii) seems key in Cases 2 and 7b but might be circular. For Case 2, it's not medically fixable, so not disease; for 7b, it might be (e.g., sleep aids). But why is fragmented sleep medically fixable while discrimination isn't? That's where the inconsistency lies.

  Now, for the user's request: First, outline each theory's principle and which verdicts they overturn. Boorse clashes with Cases 3 and 7b (no dysfunction proven). Wakefield might struggle with Case 3 (dysfunction?) and Cases 2/7b (harm from social context). Normativism conflicts with Cases 2, 4, 6a, 7a, 8 (calling "disease" too broadly).

  Second, my preferred principle: I'll build on Wakefield but add clauses. Clause 1: Internal dysfunction (Boorse), referencing species-typical function (motivated by Cases 4,6a,8). Clause 2: Harm as judged by bearer or typical bearer (Cases 2,9). Clause 3: Non-iatrogenic harm (optional, but Case 8 implies avoiding medicalizing breed issues). Clause 4: Not solely caused by extrinsic social arrangements (to handle Cases 2 and 7b). This clause rescues the user's verdicts but might be ad hoc.

  Third, new cases: Singer losing unique voice – dysfunction? Not species-typical, so not disease on my principle. Wild animal with shorter life but more offspring – dysfunction? Possibly not if it enhances fitness. Environmental change increasing variant frequency – disease status shouldn't drift; dysfunction is relative to species design, not frequency.

  Fourth, which verdicts are incoherent? Case 7b is problematic because it's like Case 2 – harm from social context. Calling it disease contradicts the stance in Case 2. Also, Case 10's arbitrariness is unavoidable; we need practical thresholds. The committee should acknowledge that some lines are policy-driven, not ontological.

  Fifth, missing case: Something with clear biological dysfunction but no harm, or vice versa. E.g., a harmless but severe biological anomaly, or suffering from purely social causes without biological basis. This could test the boundaries.

  The committee's remit might be too narrow. They should consider expanding to "conditions causing significant harm," but that may be beyond their scope. In the position paper, they should admit the gray areas and set pragmatic criteria, perhaps using a hybrid model with explicit harm and dysfunction requirements, plus acknowledgment of social factors.
answer: |-
  Below is a systematic analysis addressing your queries, grounded in your cases and conceptual structure. I proceed step by step, avoiding theoretical jargon where possible and focusing on functional distinctions.

  ### **First: Analysis of Existing Principles**  
  *(Clarified principles and their conflicts with your verdicts)*  

  1. **Biostatistical (Boorse-inspired)**:  
     - **Principle**: A condition is a disease iff a part functions below *statistical species-typicality* (adjusted for age/sex) in contributing to survival/reproduction within the *actual environment*.  
     - **Verdicts overturned**:  
       - **Case 3**: No demonstrated dysfunction; misery is the sole finding.  
       - **Case 7b**: Fragmented sleep may be statistically atypical, but if it imposes no survival/reproduction cost, it’s not dysfunctional.  
       - **Case 9**: The variant is statistically *typical* for the population, so not a disease.  
     - **Distortions required**:  
       - **Case 6b**: Must reframe neurodegeneration as "typical for age," but you split from 6a. Boorse accommodates this via age-adjustment, but it strains intuition when universal (e.g., aging itself).  

  2. **Harmful Dysfunction (Wakefield-inspired)**:  
     - **Principle**: A condition is a disease iff (i) a mechanism fails to perform its *naturally selected function* (dysfunction), and (ii) this causes *harm* (judged by social norms).  
     - **Verdicts overturned**:  
       - **Case 2**: No dysfunction—pigmentation functions typically. Harm is socially mediated.  
       - **Case 4**: The receptor variant isn’t dysfunctional; it’s a functional trade-off (natural selection isn’t "perfect design").  
       - **Case 7b**: If circadian fragmentation isn’t a failure of evolved function, no dysfunction exists.  
     - **Distortions required**:  
       - **Case 3**: Must argue misery reflects a dysfunction in an evolved "mood regulation" mechanism, though none is found.  
       - **Case 8**: Breeding alters "natural" function; must redefine "natural" relative to species, not breed.  

  3. **Honest Normativism**:  
     - **Principle**: A condition is a disease iff it is *socially disvalued* and medical intervention is deemed appropriate.  
     - **Verdicts overturned**:  
       - **Case 4**: If society disvalues vulnerability to pathogens, it could be labeled disease—but you resist.  
       - **Case 6a**: If presbyopia is disvalued (e.g., in a society without glasses), it must be medicalized.  
       - **Case 9**: Local non-disvaluation clashes with external judgment.  
     - **Distortions required**:  
       - **Case 1**: Must argue stroke risk is disvalued, but this ignores biological reality.  
       - **Case 8**: Medicalizing breed issues ignores that disvalue is human-caused.  

  ---

  ### **Second: My Preferred Principle**  
  *(Clause-by-clause, with case-motivated reasoning)*  

  1. **Internal dysfunction**: A part/process functions below *species-typical efficiency* in sustaining life/health, **excluding environmental mismatches or statistical atypicality alone**.  
     - *Motivated by*: Cases 4 (trade-off isn’t dysfunction), 6a (age-typical), 8 (breed-typical ≠ species-typical).  
     - *Rescues*: Case 5 (metabolic variant is dysfunctional in current environment).  

  2. **Harm to the bearer**: The bearer experiences *reduced well-being* (physical/mental) that they would avoid if possible, accounting for their values and context.  
     - *Motivated by*: Case 2 (harm is extrinsic), Case 9 (bearers don’t experience harm).  
     - *Rescues*: Case 3 (misery is harm), Case 7a (no distress).  

  3. **Non-iatrogenic origin**: The harm is not *solely* caused or sustained by extrinsic social arrangements that could be altered non-medically.  
     - *Motivated by*: Case 2 (fix society, not people), Case 7b (fragmentation harm relies on work schedules).  
     - *Rescues*: Your verdict in 7b (indefensible without this clause; it conflicts with Case 2).  

  4. **Medical corrigibility**: Intervention must feasibly *modify the condition itself*, not just accommodate it.  
     - *Motivated by*: Case 1 (drug corrects marker), Case 2 (medical fix ineffective).  

  ---

  ### **Third: Predictions for New Cases**  

  1. **Singer losing atypical vocal capacity**:  
     - **Verdict**: Not a disease.  
     - **Reason**: No dysfunction (capacity wasn’t species-typical or survival-related). Harm is real but socially mediated (career loss).  

  2. **Wild animal with heritable short life/high reproduction**:  
     - **Verdict**: Not a disease.  
     - **Reason**: No dysfunction (enhances fitness; typical for population). "Harm" (short life) is offset by reproductive success.  

  3. **Variant increasing in frequency due to environmental change**:  
     - **Verdict**: Disease status *does not drift* with frequency.  
     - **Reason**: Dysfunction is judged against *species-typical function*, not prevalence. If it impairs health in *current* environments (e.g., Case 5), it remains a disease even if becoming common.  

  ---

  ### **Fourth: Incoherent Verdicts and Committee Advice**  

  - **Indefensible verdict**: **Case 7b** (fragmented sleep as disease).  
    - **Why**: Conflicts irreconcilably with **Case 2**. Both involve distress from social mismatches; labeling one a disease and the other not violates clause 3 of your (and my) principle. Harm in 7b stems from "how the working day is scheduled"—an extrinsic arrangement.  
  - **Problematic verdict**: **Case 10** (arbitrary biomarker cutoff).  
    - **Why**: No principle justifies a sharp line; this is policy, not ontology.  

  **Position paper recommendations**:  
  1. **Admit limitations**: Your remit ("disease") cannot coherently exclude all non-medical conditions. Case 2 and 7b prove that social harms masquerading as diseases force arbitrary lines.  
  2. **Propose new remit**: Fund interventions for *"conditions causing significant harm, where medical correction is effective and socially non-disruptive."* This explicitly allows excluding Case 2 (social intervention better) and Case 9 (low perceived harm).  
  3. **For borderline cases**: Use a burden-of-proof threshold (e.g., dysfunction + harm must both be objectively measurable OR severely subjectively distressing).  

  ---

  ### **Fifth: Missing Discriminating Case**  

  - **The case**: *A genetic variant causing chronic pain in 10% of bearers, with no survival/reproduction cost, universally distressing to bearers, and correctable by a drug. The pain confers no known disadvantage and is absent in isolated subpopulations with identical genetics.*  
  - **Why it discriminates**:  
    - Tests whether "dysfunction" requires impaired survival (Boorse: not a disease; Wakefield: maybe dysfunction; Normativism: disease).  
    - Exposes if harm alone suffices (your Case 3 verdict suggests yes).  
    - Challenges environmental mismatch (like Case 5) without survival impact.  

  ---

  ### Summary  
  Your intuition leans toward **harm + dysfunction** but relies on an unstated **social causality** clause (iii). My principle makes this explicit, sacrificing theoretical purity for practical alignment with your verdicts—except in Case 7b, which I reject as inconsistent. The committee’s remit is flawed; replace it with a harm-and-corrigibility framework to avoid ontological quicksand. The missing case above will clarify if dysfunction must reduce fitness or if severe harm suffices.
