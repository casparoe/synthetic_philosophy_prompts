prompt: |-
  Had a three-hour argument with my flatmate last night (hes doing a Buddhism module and kept insisting that Confucian role ethics is just no-self with extra steps, and then my friend who works on care ethics said it is care ethics with a nicer vocabulary) and I am still slightly annoyed about it, which is maybe why I am writing this now. I am a TA and I have got a single fifty-minute section next Tuesday with about twenty first-years, nearly all non-majors, who will have read one short and quite sympathetic secondary piece on role ethics and nothing from the primary texts; possibly one of them will have heard of the bit where Confucius is asked about an upright man and the son who covers for his father, so I cannot count on that being fresh or on them having it right. Do not explain role ethics to me. Plan how I explain it: what has to be in the room, conceptually, before the view even sounds like a claim rather than a platitude, and in what order, and why each step depends on the one before it.

  Here is what I want specifically. First, the carrying example: I have been playing with a case where an adult daughter visits a parent with advanced dementia who no longer recognises her, so that nothing reciprocal is left, no contract, no affection on one side, and yet the daughter is still obviously in a role that has content. Tell me whether that should carry the whole session or whether something else should, and why not the two obvious candidates: the father who stole a sheep (I worry that turns the hour into a fight about nepotism and I lose the constitutive claim in five minutes) and the be-a-different-person-at-work-and-at-home example (which, after last night, I now think actively invites the misreading that roles are things you wear). I also made up two devices and I want you to place them or kill them: the empty-room version, where we strip a particular person of every role and ask what is left over, and the failed-role case, where a father has not spoken to his daughter in ten years and I ask whether he is still a father on this view and what the role is even made of if so. Say which of those helps, which backfires, and exactly where in the sequence it belongs.

  Then the misconception map, which is the part I am most worried about. The ones I expect: roles as costume or social script; role ethics as virtue ethics in Chinese vocabulary (my flatmates version of this was that it is basically character without the unity of a character); relativism, or whatever-your-society-happens-to-expect; and the reform objection my friend hammered on, that if a person just is their roles then there is no standing ground from which to say a role is corrupt and should be reshaped or abolished, so the view collapses into conservatism. For each, tell me the point in the sequence where it should be defused rather than answered, and whether defusing it requires something I should have put in earlier, since that is really what I am asking about. Also tell me what I should refuse to explain at this level and say out loud that I am refusing: I am guessing the process-cosmology background and the scholarly fight about whether this is a reconstruction of the early texts or a modern philosophical build on them. And give me one thing to ask or have them do at the end that would actually show me they have the constitutive claim rather than the ability to repeat the word role, something that fails loudly if they only have the platitude version.

  Last thing: be honest about where your plan is most likely to break. Tell me which ordering choice you are least confident in, what would change your mind about it (a different example, a different opening move, a class that shows up with more or less background than I think), and what I would see in the room in the first ten minutes that should make me abandon your sequence and do something else instead.
reasoning: |-
  Okay, let me unpack this user's request. They're a TA preparing a 50-minute intro to Confucian role ethics for non-majors after a frustrating debate about its connections to no-self and care ethics. The core challenge is making the constitutive claim land - that roles aren't just performed but define who we are - without getting derailed by common misconceptions.

  First, I need to prioritize what's essential. The dementia daughter example seems perfect: it strips away reciprocity and affection, leaving only the role's normative structure. This counters both the "costume" misunderstanding and the virtue ethics comparison. The father-sheep case is too politically charged, and the work/home separation example risks reinforcing the very "roles as masks" idea we're fighting.

  For sequencing, we should start concrete. Opening with "list your roles" makes it personal before the dementia case confronts them with role persistence despite broken reciprocity. Only then introduce the constitutive claim as the best explanation for why the daughter still has obligations. The empty-room thought experiment comes next to show roles aren't removable layers, followed by the failed-role father to demonstrate roles exist even when unfulfilled.

  Misconception defense needs weaving throughout:
  - Role-as-costume gets preempted by the dementia case showing no "wearer" behind the role
  - Virtue ethics comparison is undermined by emphasizing relational constitution over individual character
  - The reform objection requires stressing that criticism comes from role conflicts, not an abstract self

  Most fragile point is likely the transition from examples to constitutive claim. If hands-on activities reveal students stuck on social scripts, I'd pivot to having them analyze obligations in the dementia case before reintroducing the theory. The exit question "what's left when we remove roles?" should expose platitude-level understanding if they mention innate traits rather than nothing.

  Key moves to protect:
  - Dementia case as the anchor
  - Withholding "empty room" until after reciprocity is dismantled
  - Explicitly refusing cosmology debates
  - The failed-role example as proof of role ontology
answer: |-
  Here's a battle-tested 50-minute plan focused on making the **constitutive claim** land—that roles *define* who we are, not just what we do. Sequence is critical to avoid platitudes. Misconception defense is baked into the structure.

  ---

  ### **Core Sequence (45 mins)**
  1.  **Grounding in Lived Experience (5 mins)**  
      *Start:* "List every role you have right now: student, sibling, employee, friend, etc." Quick share.  
      *Why:* Makes "role" concrete, personal, and non-mysterious. Avoids abstract theory.  
      *Crucial Q:* "Which roles feel *inescapable*? Why?" (Teases constitutive idea without naming it).  

  2.  **The Dementia Case: Obligation Without Reciprocity (15 mins)**  
      *Present your example.* Hammer:  
      - Parent doesn't recognize daughter → no affection, no social contract.  
      - Daughter still feels obligation. *Not* guilt, duty, or "should"—but "**This is what I *am***."  
      *Why this carries the session:*  
      - Destroys "reciprocity/contract" readings.  
      - Blocks "costume" misreading (no "actor" behind role; role persists when "performance" fails).  
      - Preempts virtue ethics (obligation isn't from *her* character; it's from the *relation*).  
      *Skip father-sheep & work/home cases:* Sheep case ignites nepotism debates; work/home implies role-switching = costume change.  

  3.  **The Constitutive Claim (10 mins)**  
      *Frame:* "Confucianism says: **We don't *have* roles—we *are* our roles.** Your roles aren't hats you wear. They're the bones of your identity."  
      *Tie to dementia case:* "The daughter isn't 'acting' filial—*being a daughter* is part of who she *is*, even when the 'script' is gone."  
      *Device: Failed-Role Father (Use HERE)*  
      - "Father estranged for 10 years: Is he still a father? *Yes.* Why? The *relation itself* exists. His failure doesn't dissolve the role—it *defines* the failure."  
      *Why it helps:* Proves roles are *ontological*, not performative. Backfires if used earlier (seems like a "duty" without the dementia setup).  

  4.  **Empty-Room Thought Experiment (5 mins)**  
      *Ask:* "Strip away all roles from a person. What's left? *Can* you do this?"  
      *Reveal:* "Confucianism says: Nothing is left. No 'core self'—just roles all the way down."  
      *Why here?* After dementia/failed-role, it shows roles aren't additives. *Don't open with this*—seems absurd without steps 1-3.  

  5.  **Misconception Defense (Built-In, Not Add-On)**  
      - **Roles as costumes/scripts:** Preempted by dementia/failed-role (no "actor" behind role).  
      - **Virtue ethics in drag:** Blocked by constitutive claim (ethics isn't in *character* but in *relational position*).  
      - **Relativism:** "This isn't 'do what society says.' It's 'you *are* your relationships, so ethics is *internal* to them.'"  
      - **Reform objection:** **Defuse during constitutive claim:** "Criticism comes *from other roles* (e.g., 'citizen' vs. 'son'). No abstract 'self' needed. Roles conflict—that's the engine of change."  

  ---

  ### **What to Explicitly Refuse (2 mins)**  
  - **"We won't discuss if this is 'really' Confucius—we're exploring the *philosophical claim*."**  
  - **"No metaphysics today—focus on the lived experience of roles."**  
  *(Shuts down cosmology/textual debates that derail beginners.)*  

  ---

  ### **Exit Test: The "Identity Probe" (3 mins)**  
  *Ask:* **"If your closest role vanished (e.g., you're orphaned), would *you* be a different person? How?"**  
  - *Why it works:* If they say "Yes—my identity would fracture," they get the constitutive claim.  
  - *Fails loudly:* If they say "I'd be sad, but I'm still *me*," they're stuck in platitude-land.  

  ---

  ### **Weak Point & Abort Triggers**  
  - **Fragile Step:** Transition from dementia case → constitutive claim (mins 20-25). If eyes glaze, jump to failed-role father *immediately* to make ontology visceral.  
  - **What Changes My Plan:**  
    - If >3 students mention "father/son sheep" unprompted, **use it briefly** to ask: "Is this *nepotism* or *ontology*? Would the son *cease being a son* if he testified?"  
    - If "empty room" bombs, **pivot to failed-role** and ask: "What *is* a father if not biology, feelings, or performance?"  
  - **Abort Triggers in First 10 Mins:**  
    - If role-listing reveals **strong "roles = oppressive" vibe**, skip empty room. Stress: "Roles *enable* identity—they aren't cages unless corrupted."  
    - If **>50% fixate on "duty" in dementia case**, hammer: "Is this duty *imposed*—or does it flow from *who she is*?"  

  ---

  ### Why This Sequence Works  
  1. **Dementia case** is the anchor—it *forces* the question "Why obligation without reciprocity?"  
  2. **Failed-role father** proves roles exist beyond function/affection.  
  3. **Empty room** is the coup de grâce—but only after 1-2 make it plausible.  
  4. Misconceptions starve without oxygen: Costume/script readings die with dementia; reform fears die with role conflicts.  

  You're weaponizing their intuition against platitudes. The second they feel the *sting* of the dementia case ("Why *should* she visit?"), the door opens for the constitutive claim. **Trust the example.**
