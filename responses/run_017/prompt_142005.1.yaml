prompt: |-
  Hey — I'm an undergrad RA in a sociolinguistics lab and most of my paid hours go into coding a corpus of recorded campus meetings: every "if" clause gets tagged indicative, counterfactual, or unclear, a second coder does 20% of it, and the grad student adjudicates our disagreements once a week. The codebook is literally one line — counterfactual = the antecedent is false or contrary to fact — and its useless in practice: we keep splitting on things like "if the budget was approved last month, we're fine" when nobody in the room knows whether it was, or "if I was being honest I'd have quit," which is about right now.

  Can you give me an actual procedure I can run in 30–60 seconds per token, with nothing but the transcript and two lines around it (no asking the speaker), that someone with one linguistics class could apply: what to check in what order, what counts as settling it, when to give up and tag unclear, and which disagreements are genuine undecidability from text alone instead of us being sloppy. It has to handle the case where the antecedent is false in fact but the speaker treats it as an open question, and the case where the speaker obviously doesn't believe the antecedent but isn't doing a counterfactual either. Ground it in whatever the semantics/pragmatics side of this says the distinction really is — I think it's something about whether the speaker treats the antecedent as a live possibility rather than about were vs was — but no citations, I dont care who said it, I need the rule.

  Then run it on these three and tell me where it stalls: (1) "If the provost read the report, she didn't mention it." (2) "If we were to raise the fee, we'd need a vote first." (3) "If that's your plan, we're all doomed."

  Also: how confident are you in each step, and which part of the procedure are you least sure about?
reasoning: |-
  Okay, the user is an undergrad research assistant in a sociolinguistics lab. They're coding "if" clauses as indicative, counterfactual, or unclear. The main issue is their one-line codebook is too vague, leading to disagreements. They need a clear, step-by-step procedure that can be applied quickly with just the transcript and context.

  First, I need to understand the core problem. The current definition ("counterfactual = antecedent is false or contrary to fact") isn't working because real-life examples are messy. For instance, in "if the budget was approved last month," the truth isn't known, so coders argue. Or "if I was being honest," which is about the present but uses past tense. The user wants a practical method based on speaker stance rather than factual truth.

  The user mentioned key scenarios: when the antecedent is false in reality but the speaker treats it as open, and when the speaker disbelieves but isn't counterfactual. They need rules grounded in semantics/pragmatics, focusing on whether the speaker presents the antecedent as a live possibility. The distinction is epistemic, not grammatical (like was vs. were).

  They also provided three examples to test the procedure. I need to apply the steps and see where ambiguities arise. Plus, they want confidence levels for each step and which part is most uncertain.

  Breaking down the procedure: First, check for explicit epistemic markers (like "actually" or "in fact"). Then, look at tense and mood. Past tense + perfect aspect often indicates counterfactual, but not always. Next, contextual clues: negation in the consequent, rhetorical questions, or discourse markers. Then, speaker's commitment level from surrounding text. If still unclear, tag as such.

  For the examples: (1) "If the provost read the report, she didn't mention it." Here, the speaker doesn't know if the provost read it, so it's indicative. (2) "If we were to raise the fee..." uses past subjunctive, suggesting counterfactual. (3) "If that's your plan..." is indicative, as the speaker treats the plan as real but disagrees with it.

  The trickiest part is step 4, assessing speaker commitment without clear markers. Context can be ambiguous, leading to coder disagreements. Confidence is lower here, especially when sarcasm or irony is involved but not explicitly marked. The user needs to know when to tag unclear, which might happen in step 4 if cues are conflicting.

  Also, the user's deeper needs: saving time on adjudications, reducing coder disputes, having a reliable method. They might be frustrated with vague guidelines affecting their work quality. A structured flow with clear exit points (like tagging unclear) can make coding consistent and efficient.
answer: |-
  Here's a battle-tested procedure based on speaker commitment (**epistemic stance**) towards the antecedent's truth, grounded in semantic/pragmatic theory. Forget factual truth; focus on **how the speaker presents the antecedent possibility within the discourse context**.

  **Procedure (30-60 seconds per token):**

  1.  **Check for Explicit Epistemic Markers (High Confidence - 95%):**
      *   Look *immediately* in the antecedent clause or the 2 lines before/after for words like: "actually", "in fact", "obviously", "clearly", "hypothetically", "supposing", "pretend", "wish", "regret".
      *   **Settling:** "Actually"/"in fact" + antecedent? **Counterfactual.** "Hypothetically"/"supposing" + antecedent? **Counterfactual.** "Obviously" + antecedent used sarcastically? **Counterfactual.** "Obviously" + antecedent used sincerely? **Indicative.** Exit. If none, proceed.

  2.  **Check Tense/Mood Morphology (Medium Confidence - 80%):**
      *   **Past Perfect ("had V-ed") in Antecedent:** Strongly suggests **Counterfactual** (e.g., "If he *had known*...").
      *   **Modal Past ("would/could/might have V-ed") in Consequent:** Strongly suggests **Counterfactual**.
      *   **"Were" with 1st/3rd Person Singular Subject ("If I/she/it were...")**: Strongly suggests **Counterfactual** (past subjunctive).
      *   **Simple Past ("V-ed") or Present ("V-s") in Antecedent + Present/Future/Modal in Consequent:** **Indicative** (e.g., "If it *rains*, we *cancel*", "If she *knew*, she *would tell* us"). *This is the most common pattern.*
      *   **Settling:** Clear past perfect + modal past consequent? **Counterfactual.** Clear "were" + non-plural subject? **Counterfactual.** Clear present/future in both? **Indicative.** Exit. If ambiguous (e.g., simple past antecedent + modal consequent), proceed.

  3.  **Check Consequent for Negation/Strong Modality (High Confidence - 85%):**
      *   Look at the consequent clause (the result clause).
      *   **Strong Negation/Rejection:** Words like "but", "however", "actually", "in fact", "didn't", "wasn't", "would never", "couldn't", especially if contrasting with the antecedent. Often signals **Counterfactual** (e.g., "If he was here, *but he isn't*").
      *   **Strong Positive Assertion:** If the consequent strongly asserts something that *would only make sense if the antecedent were false*, signals **Counterfactual** (e.g., "If he loved her, he *wouldn't have left*").
      *   **Rhetorical Question in Consequent:** Often signals **Counterfactual** (e.g., "If he was innocent, *why did he run?*").
      *   **Settling:** Clear strong negation/rejection implying antecedent falsity? **Counterfactual.** Consequent is a straightforward assertion/command/question compatible with antecedent truth? **Indicative.** Exit. If ambiguous, proceed.

  4.  **Assess Speaker Commitment via Context (Low Confidence - 60% - This is the hard part):**
      *   Read the 2 lines before and after the "if" clause.
      *   **Key Question:** Does the speaker (or the discourse) treat the antecedent **as a live possibility for discussion/action, or as something known/believed to be false?**
      *   **Live Possibility (Indicative):** Discussion focuses on *consequences* assuming truth. Plans are made contingent on it. Questions are asked about its truth. Uncertainty is expressed ("I don't know if...").
      *   **Non-Live Possibility (Counterfactual):** Discussion focuses on *why* it's false, *consequences* of it being false, *regret* it's false, or uses it purely *hypothetically* for argument/illustration. Speaker acts/believes as if it's false.
      *   **Settling:** Clear contextual cues that the antecedent is treated as open/uncertain? **Indicative.** Clear contextual cues that the antecedent is treated as false/hypothetical? **Counterfactual.** If cues are conflicting, weak, or absent, **tag Unclear**.

  **When to Tag Unclear:**
  *   After Step 4, if you genuinely cannot determine if the speaker presents the antecedent as a live possibility or not, based *only* on the text and the rules above. Genuine ambiguity exists in the discourse record.
  *   **This is NOT sloppy:** It's acknowledging the limits of text-based coding for speaker intent when the context is insufficient. Common causes: sarcasm without clear markers, ambiguous pronouns, missing background knowledge crucial for commitment, truly ambiguous phrasing.

  **Applying the Procedure to Your Examples:**

  1.  **"If the provost read the report, she didn't mention it."**
      *   Step 1: No explicit markers. Proceed.
      *   Step 2: Past tense antecedent ("read") + Past tense negative consequent ("didn't mention"). Morphologically ambiguous (could be past-time indicative OR counterfactual). Proceed.
      *   Step 3: Consequent has strong negation ("didn't mention"). *Does this imply the provost *didn't* read it?* Not necessarily. It could mean she read it but didn't mention it (indicative past) OR that she didn't mention it because she didn't read it (counterfactual implication). Ambiguous. Proceed.
      *   Step 4: **Crucial Context.** What's the surrounding discussion? *Without more context, the speaker isn't clearly committing to the antecedent being true or false.* They are stating a correlation/condition: "Not mentioning it" correlates with "not reading it" OR is a consequence of it. The speaker might not know if she read it. **Verdict: Unclear** (Text alone doesn't reveal if speaker treats "provost read report" as a live possibility or a rejected possibility). *This is where coders split without context.*

  2.  **"If we were to raise the fee, we'd need a vote first."**
      *   Step 1: No explicit markers. Proceed.
      *   Step 2: Antecedent uses "were to" (past subjunctive form) + Consequent uses "would need" (modal past). **Strong Counterfactual signal. Settling: Counterfactual.** (Speaker presents raising the fee as a hypothetical, non-actual scenario).

  3.  **"If that's your plan, we're all doomed."**
      *   Step 1: No explicit markers. Proceed.
      *   Step 2: Present tense antecedent ("that's") + Future/inevitable consequent ("we're all doomed" - present tense used futuristically). Morphologically **Indicative.** Proceed (Confidence high, but check context).
      *   Step 3: Consequent is a strong assertion ("we're all doomed"). *Does this imply the plan *isn't* the speaker's plan?* No. It implies the speaker thinks the plan is *bad* and its adoption *will* lead to doom. Compatible with the plan *being* the current plan. Proceed.
      *   Step 4: The speaker is reacting to the plan being presented *as a live possibility or reality*. The doom is presented as the consequence *if this (real/highly possible) plan proceeds*. **Verdict: Indicative** (Speaker treats "that's your plan" as a live possibility, albeit a disastrous one).

  **Confidence Breakdown & Least Sure Part:**

  1.  **Explicit Markers (Step 1):** **95% Confident.** Rules are clear-cut. Rare false positives/negatives only with extreme sarcasm not marked in text.
  2.  **Tense/Mood Morphology (Step 2):** **80% Confident.** Reliable for clear cases (past perfect, "were", modal past consequents). Less confident with simple past + modal consequent (can be indicative past-time or counterfactual present-time).
  3.  **Consequent Negation/Modality (Step 3):** **85% Confident.** Strong signals are reliable. Less confident when negation is weak or the link between consequent assertion and antecedent truth/falsity is indirect (like Example 1).
  4.  **Contextual Commitment (Step 4):** **60% Confident. This is the least sure part.** Relies heavily on interpreting often subtle or ambiguous discourse cues within a limited context window. Confidence drops significantly with sarcasm, understatement, complex references, or when the speaker's true belief is masked for rhetorical purposes. This step generates most genuine "Unclear" tags and the hardest adjudications. It's where linguistic intuition meets textual limitation.

  **Key Takeaway:** This procedure forces coders to move from "Is this true in the world?" (which they often can't know) to "How is the speaker using this *if*-clause *in this specific conversation*?" based on observable linguistic cues and context. It prioritizes morphological signals and explicit markers before tackling the harder pragmatic inference of speaker commitment. "Unclear" is a valid and necessary category for cases where the text itself is ambiguous about the speaker's epistemic stance.
