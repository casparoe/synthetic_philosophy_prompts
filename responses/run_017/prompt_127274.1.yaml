  3. **Purely Qualitative Description**:  
     - **Can distinguish**: The existence of two spheres and the symmetric relation "being two miles apart" (an irreflexive, symmetric relation holding between distinct objects).  
     - **Cannot distinguish**: Which sphere is which (e.g., assigning labels "Sphere A" or "Sphere B") or any non-qualitative "thisness." Qualitative descriptions capture only symmetric patterns, not asymmetric identities.  
  4. **Nature of Disagreement**:  
     - The dispute is **not** about counting: Both agree there are two spheres in Black’s world.  
     - The dispute **is** about:  
       - The *grounds* of distinctness (relational for Defender, primitive for Haecceitist).  
       - The *nature* of identity (reducible to relations vs. primitive and ungrounded).  
       - The *structure of possibility* (whether permutations yield distinct worlds).  

  ---

  #### 2. Table of Remaining Disagreements  
  Each disagreement is stated twice: once in the Defender’s vocabulary and once in the Haecceitist’s. Disagreements are sorted into **genuine** (substantive metaphysical divides) or **verbal** (terminological or conceptual mismatches), with reasons.  

