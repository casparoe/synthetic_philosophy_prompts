  1. **Coherence of the Scenario**: Black’s two-sphere world (a symmetric universe with two qualitatively identical spheres at a fixed distance, no landmarks) is metaphysically and logically coherent.  
  2. **What the Spheres Share**:  
     - Both spheres share all intrinsic qualitative properties (e.g., mass, shape, color).  
     - Both spheres share symmetric relational properties (e.g., "being two miles from *some sphere*").  
