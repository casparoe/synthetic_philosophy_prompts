  We are drafting a joint statement for a defender of the Identity of Indiscernibles (Defender) and a haecceitist (Haecceitist) after an adversarial collaboration on Black's two-sphere world. The world consists of two exactly similar spheres, fixed distance apart, with no landmarks or external objects.

