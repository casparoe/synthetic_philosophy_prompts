  - **Haecceitist's prediction**: At the limit, there are still two spheres, but they coincide. Their distinctness is primitive and does not depend on spatial separation. The relation of being at the same location is symmetric and reflexive (each is at the same location as itself and the other) but that does not threaten their numerical distinctness.

