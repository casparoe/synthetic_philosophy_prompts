  - **Scenario**: Consider a possible world that contains exactly one sphere, qualitatively identical to each of the spheres in the two-sphere world.

  - **Question**: Is there only one such possible world, or two? If two, what is the difference?

  - **Defender's view**: There is only one such possible world. Since the sphere is qualitatively identical and there are no other objects, a purely qualitative description exhausts the world. There is no room for a non-qualitative difference because there is only one object and no primitive thisness.

  - **Haecceitist's view**: There are two (or more) such possible worlds. The difference lies in which haecceity is instantiated: the haecceity of the first sphere from the two-sphere world or the haecceity of the second. Even though the sphere is alone, its primitive identity could be one or the other.

  - **Bearing on the crux**: This tests the commitment to haecceitism. The Defender denies that there can be distinct worlds that are qualitatively identical, while the Haecceitist affirms it. This case is a direct test of the third genuine disagreement (about possible worlds) and also relates to the second (primitive identities).

