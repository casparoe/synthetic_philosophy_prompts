  The Haecceitist holds that this case is a counterexample to the Identity of Indiscernibles because two objects can be exactly alike in every qualitative and relational respect. They argue that what makes the spheres two is not a difference between them but rather the primitive identity of each. They also hold that there can be distinct possible worlds that differ only by a permutation of the spheres, and that either sphere could have existed without the other.

  We are to structure the joint statement as follows:

  1. A numbered section of claims both can sign, covering:
     - What is coherent
