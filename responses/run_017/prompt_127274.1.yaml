     - **Haecceitist's view**: Even if particles are indistinguishable, they have primitive identities. However, in physics, we often choose to ignore haecceitistic differences for practical reasons (leading to the same statistics). But in principle, permutations are distinct states (even if we don't count them in practice).
     - **Prediction**: The Defender predicts that the physics should not count permutations as distinct states, while the Haecceitist might allow for the possibility but note that we typically use a reduced phase space. However, the haecceitist might say that the fundamental description includes the haecceities, but we coarse-grain. This case may cut both ways because both can accommodate the physics by either denying or marginalizing haecceities. Thus, it doesn't decisively settle the metaphysical issue.

     **Verdict**: This case does not cut decisively because both sides can account for the statistical mechanical practices. The Defender can say that the particles are weakly discerned (if relations are available) or that permutations are not genuine differences. The Haecceitist can say that while permutations are genuine, we use a description that ignores them for simplicity. Thus, it does not force a resolution.

  b. **Computationally identical uploads and which one is you**:
     - **Scenario**: Suppose two uploads are created from your brain, both computationally identical. Which one is you?
     - **Defender's view**: Without a unique relation (e.g., spatiotemporal continuity) to one and not the other, there is no fact about which is you. You might be both, or neither, but not one specifically. The uploads are weakly discerned by their relations (e.g., being in different computers) but that does not determine identity over time.
