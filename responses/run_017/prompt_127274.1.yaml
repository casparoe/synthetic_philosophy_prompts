  Where a case cuts neither way, we say so.

  Let's begin by drafting the agreed section.

  ### Section 1: Agreed Claims

  1. **Coherence of the scenario**: Both parties agree that the two-sphere world as described by Black is coherent and logically possible. It is a conceivable universe containing two exactly similar spheres at a fixed distance, with no other objects, boundaries, or landmarks.

  2. **What the spheres share**: Both spheres are qualitatively identical. They share all intrinsic properties (e.g., mass, shape, color) and, in the symmetric arrangement, they also share the same relational properties that are defined without reference to any external landmark. However, they do not share all relational properties: in particular, each stands in the relation of being two miles apart from the other sphere, but this relation is symmetric and irreflexive.

  3. **Purely qualitative description**:
     - **What it can distinguish**: A purely qualitative description of the world can capture that there are two spheres and that they are at a fixed distance apart. It can note that the relation "being two miles apart" holds between two distinct objects and that this relation is irreflexive and symmetric. Thus, such a description can distinguish the world from a one-sphere world and from a world with no spheres.
     - **What it cannot distinguish**: A purely qualitative description cannot assign a unique label to either sphere (e.g., it cannot say which is "sphere A" and which is "sphere B") because there is no qualitative difference between the spheres. Moreover, it cannot capture any non-qualitative fact about which sphere is which, because there are no such facts in the Defender's view, and the Haecceitist holds that such facts are primitive and not captured by qualitative description.

