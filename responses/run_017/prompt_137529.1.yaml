prompt: |-
  I'm teaching an upper-level seminar this term (phil of language / language and power cross-list) and I need to write one essay question for the final on Hofstadter's Person Paper satire—the one where the narrator defends 'white' as the generic word for humans and 'whe'/'ble' as the third-person pronouns, and the negrists want 'person' instead. I want a question that students can't answer just by parroting 'it maps sexism onto racism: defending generic 'man' is like defending generic 'white', so generic 'man' is sexist the way the fictional language is racist.' That's the easy summary and I want to fail anyone who stops there.

  Quick recap so we're on the same page (no outside reading, no citations, just from the piece itself): the narrator says there is great beauty to a phrase such as "All whites are created equal." He claims that in most contexts it is self-evident when "white" is being used in an inclusive sense, in which case it subsumes members of the darker race just as much as fairskins. He also says that, used inclusively, the word "white" has no connotations whatsoever of race. About compounds like chairwhite, mailwhite, saleswhite, and freshwhite, he says the suffix "white" is usually pronounced like "wit" in terms like saleswhite, freshwhite, penwhiteship, and first basewhite, and he adds: "It's just a simple and useful component in building race-neutral words." The fictional third-person pronouns are "whe" for whites and "ble" for blacks, and one of the jokes is that a crazy reform is supposed to be abandoning the racial distinction and using he for male whites (and blacks) and she for female whites (and blacks). In actual English the analogues are man, mankind, chairman, mailman, and generic he versus the proposed person replacements, with women playing the role of blacks and sexism the role of racism.

  The complication I want the question to force is one I've been calling the bleached-default vs transparent-generic distinction. A bleached default is a compound or affix-like use where the group-marking morpheme has, apparently, lost its group-marking force: the "white" in "chairwhite" is, on the narrator's own telling, just a useful component, pronounced "wit", not a claim that the chair is white or that whites are the norm. A transparent generic is a live, semantically compositional use where the term really does present one subgroup as the unmarked norm for the whole kind: the inclusive "white" in the "All whites are created equal." example, or the generic "whe", is, or at least seems, transparently about making whiteness the default human. The same distinction can be run on actual English: is "chairman" a bleached compound, or is it still a transparent default? Is "mankind" bleached? Is generic "he" a bleached pronoun or a live default assumption? What would count as evidence either way?

  So please write me three things.

  1. The essay question itself, aimed at upper-level undergrads, something they could answer in about 45 minutes (roughly 700 words). It should ask whether (and for which uses) the satire's moral indictment of the fictional "white" language transfers to actual English man/he language, and it should explicitly make them use the bleached-default vs transparent-generic distinction. It should not be answerable by reciting the analogy, and it must not let them off the hook with the two-sense/ambiguity defense (that man just has a generic sense) unless they say what the satire implies about the parallel claim that inclusive "white" has no connotations whatsoever of race.

  2. A model answer of about 600 words that a strong student would give. It should name the crux: e.g., that the satire's force depends on treating the narrator's inclusive-meaning claims as false in the fiction (readers are supposed to hear "All whites are created equal." as making whiteness the default), so if a real use of man is genuinely bleached or genuinely ambiguous in the same way, the analogy weakens; but the satire can still be a powerful debunking of transparent generics and of the rhetorical move of insisting that inclusive man has no sex connotations. Don't just sit on the fence: give the best positive account of how far the indictment transfers.

  3. A marking scheme out of 20, built around five must-hit points worth 4 marks each, with a one-line note on the classic mistake for each point. The five points should be something like: correctly reconstructing the satire's target and the direction of the analogy; stating the bleached-default vs transparent-generic distinction and applying it to at least one fictional and one actual example; handling the just a simple and useful component bleaching defense from the text; handling the ambiguity/two-sense reply and the narrator's inclusive-sense claim; and giving a reasoned verdict on which actual uses (compound vs live generic) are convicted and which, if any, escape, plus what would count as evidence. Make the A/B separation turn on whether they actually apply the distinction instead of just asserting it, and on whether they see that the satire's own text gives the bleaching reply in the narrator's voice.

  No bibliographies, no reading lists, no 'as so-and-so argues', nothing that needs a library or the web. Everything should be doable from the satire plus the distinction I gave you. Casual style is fine for the question—address the students directly if you want—but the model answer should be tight. I'd rather have a slightly weird, picky question that seperates the people who did the reading from the people who memorized the slogan than a broad one that lets everyone write 'Hofstadter shows that language embeds default assumptions' and sit down. Also, I probaly left something out, so if there's an obvious way the bleaching point could just collapse the whole satire, say so in the marking scheme note where relevant.
reasoning: |-
  Okay, the user is teaching an upper-level philosophy of language seminar and needs an essay question on Hofstadter's "Person Paper" satire. They want to push students beyond the basic analogy that "generic 'man' is sexist like generic 'white' is racist." The key is forcing engagement with the bleached-default vs. transparent-generic distinction. 

  First, let's unpack the user's core frustration. They've seen too many superficial responses parroting the analogy without critical analysis. The bleaching concept is their weapon against that. The satire's narrator claims "white" in compounds like "saleswhite" is just a neutral component (bleached), while insisting inclusive "white" has no racial connotations. But readers know better—the fictional language feels racist. That tension is the crux.

  For the essay question, I need to design something that makes students:
  - Apply the bleaching distinction to both fictional and real examples
  - Grapple with the narrator's claims vs. the satire's implied critique
  - Evaluate whether real-world "man" compounds are truly bleached
  - Confront the "two-sense defense" (generic vs. specific meaning) head-on

  The model answer should demonstrate how a strong student would:
  - Acknowledge the analogy but immediately complicate it
  - Use examples like "chairman" vs. "all men are mortal"
  - Show how the satire undermines the bleaching defense by making whiteness salient
  - Argue that transparent generics (like "mankind") are clearly indicted, while bleached compounds might survive if evidence shows true semantic drift
  - Cite behavioral evidence (e.g., mental imagery studies) as possible tests

  The marking scheme must penalize:
  - Mere analogy regurgitation
  - Ignoring the bleaching distinction
  - Uncritically accepting the narrator's claims
  - Failing to specify which real usages are vulnerable
  - Missing that the satire itself provides the bleaching argument (through the unreliable narrator)

  Biggest pitfall to flag: If bleaching were airtight, the satire collapses. But Hofstadter's genius is showing that even "bleached" terms leak their origins—the racial/sexual hierarchy bleeds through. That's why the marking scheme needs a note about the narrator's claims being ironically undercut.
answer: |-
  ### 1. Essay Question  
  **"Hofstadter's satire hinges on the claim that using 'white' as a generic term (e.g., 'all whites are created equal') and in compounds (e.g., 'saleswhite') reinforces racial hierarchy. Yet the narrator insists inclusive 'white' has 'no connotations whatsoever of race' and that compound 'white' (pronounced 'wit') is 'just a simple and useful component'. Using the *bleached-default* vs *transparent-generic* distinction, evaluate whether—and for which specific uses—this indictment transfers to real-world English terms like 'mankind', 'chairman', generic 'he', and 'man' as in 'all men are mortal'. Crucially, does the satire debunk the 'two-sense defense' (i.e., that 'man' has distinct generic/specific meanings)? Defend your view with evidence from the satire’s logic, not just the analogy."**

  ---

  ### 2. Model Answer (600 words)  
  Hofstadter’s satire works by mapping defenses of sexist language onto a fictional racist language, exposing hypocrisy. However, the transfer of its critique to actual English depends on whether terms like "man" function as *transparent generics* (live defaults reinforcing male-as-norm) or *bleached defaults* (meaningless historical remnants). The satire’s force lies in showing that even "bleached" uses covertly uphold hierarchy, and that the "two-sense defense" fails when exposed to parallel scrutiny.  

  **Transparent generics are indicted.** The narrator claims inclusive "white" (e.g., "all whites are created equal") has no racial connotations, yet readers recoil because the term transparently centers whiteness. Similarly, generic "he" or "all men are mortal" position maleness as the human default. When the narrator says "whe" (white-he) should apply to all humans, the absurdity mirrors real arguments that "he" includes women. The satire proves such claims are disingenuous: if "white" implicitly excludes blacks despite protests, "he" implicitly excludes women. Transparent generics like generic "he" or "mankind" are thus convicted—they semantically frame men as paradigmatic humans.  

  **Compounds are trickier but not absolved.** The narrator argues compound "white" (e.g., "saleswhite," pronounced "wit") is a neutral "useful component." If real compounds like "chairman" are genuinely bleached—losing all male connotations—they might escape indictment. Yet the satire undermines this. First, the fictional "reform" to abolish "whe/ble" in favor of gendered pronouns ("he/she" for all races) mirrors real proposals for gender-neutral pronouns, exposing that the *distinction itself* (white/non-white, male/female) is the problem. Second, the narrator’s insistence that "white" is neutral is ironic; readers see it as propaganda. Likewise, "chairman" may feel male-default because "man" in isolation is transparently gendered. Behavioral evidence (e.g., people imagining men when hearing "chairman") would support this leakage. If "white" compounds can’t truly bleach their racism, "man" compounds likely can’t shed sexism.  

  **The two-sense defense collapses.** The narrator’s claim that inclusive "white" has no racial connotations is the satire’s core joke: it’s self-evidently false. When "white" switches from specific to "inclusive," it doesn’t erase race; it universalizes whiteness. Similarly, asserting that generic "man" has no male connotations ignores that maleness is its historical and perceptual anchor. The satire proves that insisting on ambiguity is a rhetorical dodge—context doesn’t neutralize hierarchy but disguises it. If "all whites are created equal" *feels* exclusionary despite claims of inclusivity, "all men are mortal" does too.  

  **Verdict:** The satire fully convicts transparent generics (generic "he," "mankind") and live compounds where "man" is morphologically active (e.g., "freshman"). Truly bleached relics (e.g., "human" from Latin *homo*, now divorced from *vir*) might survive—but "chairman" fails this test, as shifts to "chairperson" reveal latent bias. Evidence for bleaching would require: (1) loss of morphological productivity (e.g., no new coinages like "techman"), (2) absence of male imagery in comprehension studies, and (3) no resistance to gender-neutral alternatives. Since the satire shows even "pronounced-as-wit" compounds serve racial hierarchy, most "man" uses stand condemned.  

  ---

  ### 3. Marking Scheme (20 points)  
  **5 categories × 4 points each**. Award 4 for full engagement, 2–3 for partial, 0–1 for omission/misrepresentation.  

  | **Criteria (4 pts each)** | **Key Expectations** | **Classic Mistake (loses 2+ pts)** |
  |---------------------------|----------------------|-----------------------------------|
  | **1. Satire’s target & analogy** | Correctly identifies: (a) Target = defenses of generic "man"/male-default language; (b) Analogy direction = sexism→racism (women→blacks, "man"→"white"). | Parroting "maps sexism to racism" without specifying *how* the analogy critiques real-language defenses. |
  | **2. Bleached vs. transparent distinction + application** | Defines: (a) *Bleached-default*: group-marker loses semantic force (e.g., "white" in "saleswhite"/"wit"); (b) *Transparent-generic*: live group-as-default (e.g., inclusive "white"). Applies to ≥1 fictional AND ≥1 actual example (e.g., "chairman" vs. "mankind"). | Asserting the distinction without applying it to examples, or mislabeling (e.g., calling "mankind" bleached without argument). |
  | **3. Handling "useful component" defense** | Engages narrator’s claim that compound "white" is neutral. Uses satire to show this is unreliable (e.g., reformists see it as oppressive; reader sees irony). Parallels to real "just a suffix" arguments (e.g., "man" in "chairman"). | Accepting the narrator’s claim at face value, or ignoring that the satire *presents and undermines* this defense. |
  | **4. Ambiguity/two-sense reply + inclusive-sense claim** | Refutes the "two senses" defense using satire: if "white" can’t shed race despite claims, "man" can’t shed maleness. Notes narrator’s inclusive-sense assertion is undercut by fictional context (e.g., "all whites" feels exclusionary). | Claiming ambiguity resolves the problem (e.g., "man has two meanings, so it’s fine") without addressing the satire’s debunking of this. |
  | **5. Reasoned verdict + evidence** | States which real uses are "convicted" (e.g., transparent: "he"/"mankind"; compounds: "chairman" if not bleached). Specifies evidence for bleaching (e.g., loss of productivity, no male imagery). Avoids fence-sitting. | Vague conclusion (e.g., "sometimes it’s bad"); failing to name specific terms; no mention of testable evidence. |

  **A/B Separation:**  
  - **A (16–20):** Applies distinction to dissect examples; uses satire’s irony to undermine narrator’s defenses; precise verdict on real terms.  
  - **B (12–15):** Asserts distinction but applies weakly; takes narrator’s claims too literally; vague on evidence.  
  - **C/D (<12):** Summarizes analogy without engaging distinction; ignores narrator’s bleaching arguments.  

  **Pitfall Note:** If bleaching *were* airtight (e.g., if "man" was as neutral as "person"), the satire collapses—but Hofstadter implies bleaching is a myth by making "white" compounds feel racist. Students must confront this tension.  

  ---

  This structure forces engagement with linguistic mechanics, uses the satire’s own contradictions, and demands evidence-based reasoning—pushing beyond slogan-recycling. The model answer shows how to leverage the distinction while acknowledging the satire’s limits.
