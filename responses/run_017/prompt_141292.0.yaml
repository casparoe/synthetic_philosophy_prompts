answer: |-
  ### Examination Question  
  **Section C: Aristotle on Exchange and Money (45 minutes)**  
  Aristotle describes money (*nomisma*) in *Nicomachean Ethics* V.5 as a wholly conventional measure created by agreement (*nomos*), alterable by human will, and practically sufficient for enabling exchange. Yet in *Politics* I.9–10, he condemns lending at interest as "most contrary to nature" because money’s natural purpose (*telos*) is facilitating exchange, not "breeding" itself.  

  Consider a hypothetical city-state ("Clayville") that circulates *sealed clay tokens* as money. These tokens:  
  - Are fixed in quantity by decree  
  - Cannot be exported or melted down for other uses  
  - Serve as the universal measure of value  
  - Are accepted by all citizens for trade.  

  **(a)** How would Aristotle’s *Ethics* account explain why these tokens function as money? (10 marks)  
  **(b)** Would a Clayville lender who charges interest for loaning tokens be acting "contrary to nature" per the *Politics*? Defend your answer using both texts. (10 marks)  

  ---

  ### Model Answer (780 words)  
  **(a) Aristotle’s *Ethics* (V.5) would explain the clay tokens’ functionality through three key principles:**  
  First, money emerges from reciprocal need (*chreia*), which binds the community. Clayville’s tokens work because citizens *agree* they represent unmet needs—a farmer accepts tokens for grain trusting they’ll later secure pottery. Aristotle calls this social trust the "real guarantee" of exchange (*NE 1133a26–31*). The tokens themselves are inert symbols; their power derives solely from collective belief in future redeemability.  

  Second, money’s conventionality (*nomos*) makes the tokens viable despite their material worthlessness. Aristotle stresses money is "not by nature but by law" and "within our power to change" (*NE 1133a30–31*). Clayville’s decree fixing the quantity and banning export/melting ensures scarcity and enforces the convention. Unlike precious metals, clay tokens *cannot* function outside this agreement—precisely proving Aristotle’s point that money’s value is artificial.  

  Third, tokens solve commensurability pragmatically. Aristotle admits diverse goods (e.g., shoes vs. houses) lack natural equality but argues money provides a "sufficiently definite" measure for fair exchange (*NE 1133b18–20*). Clay tokens achieve this by being a universally accepted unit, making shoes and houses comparable in token-quantities. The system works not because clay intrinsically measures value, but because shared need (*chreia*) and legal enforcement (*nomos*) make it "good enough" for practice.  

  **(b) Charging interest on these tokens *would* violate nature per the *Politics*, despite their conventionality—and Aristotle’s teleology resolves the tension:**  
  In *Politics* I.9, Aristotle distinguishes natural wealth-getting (*chrēmatistikē*)—acquiring goods for household needs—from "unnatural" accumulation where money becomes an end itself. Interest epitomizes this perversion: money "bred from money" (*Pol. 1258b2–7*) subverts money’s natural function as a "mere intermediary" for exchange (*Pol. 1257a34*).  

  One might object: if money is *only* conventional (as in *Ethics*), how can its use be "unnatural"? Clayville’s tokens, being pure convention, seem to lack any inherent *telos* to violate. Aristotle’s answer lies in the *human need* money serves. The *Politics* grounds money’s purpose in natural household management (*oikonomia*), where exchange facilitates fulfilling essential needs (*Pol. 1256b40–1257a10*). Money’s natural function derives not from its material but from its role in actualizing human flourishing. Thus, even clay tokens have a natural purpose: enabling reciprocal provision of necessities.  

  Charging interest severs money from this natural end. By demanding tokens breed *more* tokens, the lender treats them as self-generating capital rather than exchange tokens. Aristotle’s critique turns on *function*, not substance: "The most hated sort [of wealth-getting] is lending at interest... for money is intended to be used in exchange, not to increase at interest" (*Pol. 1258b3–6*). Clay tokens—despite their artificiality—are still *money*, and distorting their communal purpose (enabling need-based exchange) into private profit corrupts their natural place in the *polis*.  

  **Addressing Circularity and *Chreia*:**  
  The *Ethics* acknowledges a seeming circle: money measures demand (*chreia*), yet demand seems presupposed by money (*NE 1133a25–29*). Aristotle resolves this by anchoring *chreia* (better rendered as "socially recognized need" than subjective "demand") in the community’s shared life. Prices reflect not arbitrary preferences but the relative importance of goods for sustaining the *polis*—a cobbler’s labor and a farmer’s grain are commensurable because both are *needed* for the city’s existence. Clay tokens externalize this social valuation.  

  Translations of *chreia* as "demand" risk misimplying subjectivism. Aristotle’s *chreia* is objective: a doctor’s services are more "needed" than a farmer’s not by whim, but because health sustains life itself (*NE 1133a25–b3*). Money measures this objective hierarchy; clay tokens succeed because they encode Clayville’s collective judgment about essential contributions.  

  **Synthesis: Why Conventionalism Survives Teleological Critique**  
  The tension dissolves when recognizing that money’s *conventional form* (clay, metal, etc.) is distinct from its *natural function*. The *Ethics* focuses on form: any object can be money if convention makes it a reliable medium. The *Politics* focuses on function: whatever embodies money must serve exchange for true needs. Interest perverts this function *regardless* of money’s material—even in Clayville, lending tokens at interest "unnaturally" divorces money from need-fulfillment, making barren tokens breed. Aristotle’s normative framework thus persists: convention governs money’s *existence*, but nature governs its *proper use*.  

  ---

  ### Marking Scheme (20 Total)  
  | **Must-Hit Points**                                                                 | **Marks** | **Common Failure**                                  |  
  |-------------------------------------------------------------------------------------|-----------|-----------------------------------------------------|  
  | **(a) Correctly applies *Ethics* V.5**: Tokens work via convention (*nomos*), trust in future exchange, and solving commensurability pragmatically. | 4 | Misses that tokens’ worthlessness *proves* conventionalism; fixates on material. |  
  | **(a) Explains token-specific features**: Decree/scarcity enforces convention; non-exportability isolates the system. | 3 | Neglects how artificial scarcity sustains the agreement. |  
  | **(b) Identifies teleological conflict**: Interest severs money from natural exchange function (*Politics* I.9), even for artificial tokens. | 4 | Asserts interest is unnatural but cannot explain *why* for conventional money. |  
  | **Resolves circularity/chreia**: *Chreia* as objective social need (not subjective demand) anchors exchange; money measures pre-existing valuations. | 4 | Treats prices as arbitrary or conflates *chreia* with modern "demand." |  
  | **Synthesis**: Distinguishes money’s conventional *form* (clay) from natural *function* (facilitating need-based exchange). | 5 | Fails to reconcile *nomos* (tokens) with *telos* (condemnation of interest). |  

  ---

  ### What Would Change This Answer’s Mind? (150 words)  
  **The fragility lies in *NE* V.5’s "practical sufficiency" clause (1133b18–20)**: If Aristotle is conceding that money provides *no real commensurability* but only a rough heuristic, his entire theory of reciprocal justice collapses into conventionalism—undermining any natural basis for condemning interest. This reading (defended by scholars like Finley) treats the *Politics*’ teleology as an independent (even inconsistent) critique of commercial society. If Aristotle *only* meant money is "good enough" pragmatically, with no claim to measuring objective need, then charging interest on clay tokens is merely another convention—not a violation of nature. The model answer assumes *chreia* reflects an objective hierarchy of needs; if it is merely aggregated desire, the *Politics*’ "unnatural" critique loses its foundation. The strongest counter-evidence would be *NE* 1133b10–15, where Aristotle calls reciprocal exchange "hold[ing] the city together," implying a normative structure that interest could disrupt.
