prompt: |-
  I'm in the final year of a philosophy and economics programme, and this term I'm taking a seminar on rational choice under risk. The tutor has asked each of us to lead one fifty-minute problem session, and mine is on the Pasadena game: a fair coin is tossed until it lands heads, and if that takes n tosses you receive (-1)^{n-1}·2^n/n dollars, so the payoffs run +2, -2, +8/3, -4, … and the expected value works out as the alternating harmonic series, which is only conditionally convergent — rearrange the terms and you can make the sum come out to anything you like, which is why people say the game has no expected value at all rather than a large or infinite one. The group is comfortable with expected utility theory and has already seen the St Petersburg game, and they know things like "the harmonic series diverges," but they have no measure theory and I don't want to invoke any. After class a friend of mine said the whole thing is just St Petersburg again with minus signs, and another said the answer is obviously ln 2 since that's what the series sums to in its natural order; I think both are missing the point, but I'm not confident I can show them why in a way that lands.

  So please plan the session rather than explain the game to me: the order in which the ideas have to arrive and what depends on what, the one example (or pair of examples) that should carry the whole thing, the misconceptions the group will bring or form and the exact point in the sequence at which each should be headed off, one question I can put to them at the end that would show they've understood the problem rather than just learned the vocabulary, and what I should explicitly decline to get into at this level. My own thought is that the session should turn on a comparison rather than on a single gamble: take the Pasadena game and a companion game whose payoff at every outcome is exactly one dollar more, which intuitively ought to be worth exactly one dollar more and yet is equally undefined in expectation, and then compare the two truncated versions — stop the coin at N tosses, note that the difference of the truncated expectations is exactly one for every N, and let N go to infinity — so that the lesson is that expectation is an instrument for ranking options and not the definition of what an option is worth, and that some comparative judgements survive when the absolute ones do not. Tell me whether that pair is the right thing to build the hour around, whether the group needs to feel the rearrangement result in their bones before the comparison will mean anything, where the "just use bounded utility" and "no one could ever actually offer you this gamble" moves should be placed so that they don't derail the session but also don't get dismissed by fiat, and whether a remark like "use the median instead of the mean" is worth engaging or is a distraction at this level.

  One more thing about how I'd like the answer pitched. Please mark clearly which parts of what you're proposing are settled — the convergence mathematics and what follows from it for any rule that ranks gambles by expected value — and which are live disputes among people who actually work on these cases: whether dominance or some surrogate should do the work expectation can't do here, whether the example is a genuine problem for decision theory or an artefact of infinite idealisation, whether unbounded utility is the real culprit underneath. I would much rather say to the group "the literature is genuinely split here" than hand them one camp's repair as the received view. And if the truncation-comparison idea I've sketched is itself a contested move rather than the obvious fix I've been taking it for, say so plainly and tell me what the rivals to it are.
reasoning: |-
  We are designing a 50-minute problem session on the Pasadena game for a final-year philosophy and economics seminar. The students are familiar with expected utility theory, the St. Petersburg game, and know that the harmonic series diverges. They don't have measure theory.

  The Pasadena game: A fair coin is tossed until the first heads. If the first heads occurs on the nth toss, the payoff is (-1)^{n-1} * (2^n / n) dollars. The expected value is the alternating harmonic series: 2 - 2 + 8/3 - 4 + ... which is conditionally convergent (to ln(2) in the natural order) but not absolutely convergent (since the harmonic series diverges). Therefore, by the Riemann rearrangement theorem, the series can be rearranged to converge to any real number, or diverge.

  The key points to convey:
  1. The expectation is undefined because the series is conditionally convergent and rearrangements change the sum.
  2. This is different from the St. Petersburg game (which has an infinite expectation in the usual sense) because there the series of absolute values also diverges, but in the Pasadena game the absolute series diverges while the signed series conditionally converges.

  The goal: to show that the problem is not just about the magnitude of the payoffs (like St. Petersburg) but about the conditional convergence, which makes the expectation depend on the order of summation.

  My proposed approach: Build the session around a comparison of the Pasadena game and a "shifted" version (each payoff increased by $1). The truncated versions (stopping after N tosses) have well-defined expectations, and the difference in their truncated expectations is exactly $1 for every N. As N goes to infinity, the truncated expectations of the Pasadena game oscillate and do not converge (because of the rearrangement issue), but the difference remains constant. This highlights that while the absolute expectation is undefined, the comparative judgment (that the shifted game is worth $1 more) is robust.

  Plan:

  1. Introduction (5 minutes)
     - Briefly recall the St. Petersburg game: expected value is infinite, but that is because the series of positive terms diverges. The problem there is that the expectation is infinite, but well-defined (in the sense of being unbounded).
     - Introduce the Pasadena game: write out the payoffs for the first few outcomes (n=1: +2, n=2: -2, n=3: +8/3, n=4: -4, ...). 
     - Write the expected value as the series: sum_{n=1}^∞ (-1)^{n-1} * 2^n / n * (1/2)^n = sum_{n=1}^∞ (-1)^{n-1} / n. 
       Note: The probability of outcome n is (1/2)^n (since the first n-1 are tails and the nth is heads). So the expected value is the alternating harmonic series: 1 - 1/2 + 1/3 - 1/4 + ... which converges to ln(2) (if taken in this order).

  2. The problem: conditional convergence (15 minutes)
     - Explain that the alternating harmonic series is conditionally convergent: it converges, but if we take the absolute values (the harmonic series) it diverges.
     - Consequence (Riemann rearrangement theorem): by changing the order of the terms, we can make the sum converge to any real number, or diverge. 
     - Example: rearrange to get a different sum. (But without measure theory, we can illustrate with a finite rearrangement or by describing it.) 
       Idea: group terms without changing the probabilities? But note: the probabilities are fixed by the coin tosses. However, the issue is that the expectation is defined as the sum over the natural order of outcomes (by n). But why should we sum in that order? In the St. Petersburg game, the natural order gives the standard expectation. But in the Pasadena game, the natural order gives ln(2), but if we rearrange the terms (which corresponds to a different way of grouping the outcomes? or a different ordering of the same outcomes?) we get a different expectation.

     Important: The rearrangement in the Riemann theorem is a rearrangement of the terms in the series. In the context of the game, the outcomes are naturally ordered by the number of tosses (n). But we could imagine a different ordering of the same outcomes. For example, we might list the outcomes in an order that collects together positive and negative terms. This would change the partial sums and hence the expectation.

     However, note that in probability, the expectation is defined as the sum (or integral) over the sample space. The sample space is naturally ordered by n (the number of tosses). But the Riemann rearrangement theorem applies to series, and the expectation is a series. So if we change the order of summation (i.e., we rearrange the terms of the series), we get a different sum. This is not a different grouping of outcomes but a different order of adding the payoffs.

     How to illustrate without measure theory? 
     - We can truncate the game at N tosses (so if heads doesn't appear in N tosses, we set the payoff to 0, or we stop and pay 0). Then the expected value is the partial sum of the alternating harmonic series up to N: S_N = sum_{n=1}^N (-1)^{n-1}/n. And we know S_N -> ln(2) as N->∞. 
     - But if we rearrange the terms, we can change the limit. For example, take the positive terms until the partial sum is above 10, then a negative term, then positive until above 10 again, then a negative, etc. This series would diverge? Actually, we can make it converge to 10. But note: in the truncated game, we are forced by the natural order.

     The key point: the expectation of the infinite game is defined as the limit of the truncated expectations (if it exists). But note: the truncated expectation (with payoff 0 for no heads by N) is S_N, which converges to ln(2). However, that is not the only way to truncate. We could truncate by including outcomes in a different order? But that would be a different game.

     Clarification: The problem is that the expectation is not absolutely convergent. In measure theory, the expectation is well-defined if the integral of the absolute value is finite (absolute convergence). Otherwise, it may depend on the order of integration. In the case of a discrete random variable with natural order, we use that order. But the Riemann rearrangement theorem shows that by changing the order we get different sums. So the expectation is not well-defined in the usual sense.

     How to convey without measure theory: 
     - We can show that if we define the expectation by the natural order, we get ln(2). But if we define it by a different order (say, by taking two positive terms then one negative, etc.), we get a different number. But note: the sample space has a natural order (by n). However, the expectation should be independent of the order of summation? But without absolute convergence, it isn't.

     This is the core: the expectation depends on the order of summation. The natural order is arbitrary? In the St. Petersburg game, the natural order gives infinity, and rearrangements can also give infinity? Actually, in St. Petersburg, the series of absolute values also diverges, so rearrangements won't change the fact that it diverges to infinity. But in the Pasadena game, we have conditional convergence.

     So we can say: the expectation is not defined because the series is conditionally convergent. The natural order gives ln(2), but if we rearrange the outcomes (without changing the probabilities) we can get any other value. This is the problem.

     But note: in the sample space, the outcomes are distinct and we are summing over them. The rearrangement theorem applies to series, and we are free to rearrange the terms arbitrarily. So if we change the order in which we list the outcomes, we change the expectation.

     Therefore, the expectation is not well-defined because it is order-dependent.

  3. The shifted game (15 minutes)
     - Introduce a companion game: the "Pasadena+1" game. The payoffs are the same as the Pasadena game, but every payoff is increased by $1. So if the original Pasadena game pays x, this pays x+1.
     - Intuition: this game should be worth $1 more than the original.
     - Now, consider truncated versions (stopping at N tosses, and if no heads by then, payoff 0 for both). 
       - Let E_N be the truncated expectation of the original Pasadena game: E_N = sum_{n=1}^N [ (-1)^{n-1} * 2^n / n ] * (1/2)^n = sum_{n=1}^N (-1)^{n-1} / n.
       - For the shifted game, the payoff for outcome n is [ (-1)^{n-1} * 2^n / n ] + 1. So the truncated expectation is:
          E_N' = sum_{n=1}^N [ (-1)^{n-1}/n + 1 ] * (1/2)^n? 
          Wait, no: the probability of outcome n is (1/2)^n, but note that the total probability of the outcomes we are considering (n=1 to N) is sum_{n=1}^N (1/2)^n = 1 - (1/2)^N. The remaining probability (1/2)^N is for no heads in N tosses, which we set to 0.

       Actually, the expectation for the shifted game truncated at N is:
          E_N' = E_N + sum_{n=1}^N 1 * (1/2)^n + 0 * (1/2)^N
          But note: the +1 is added to every payoff that occurs (i.e., for n=1 to N). So it's E_N + [sum_{n=1}^N (1/2)^n] = E_N + [1 - (1/2)^N].

       Alternatively, if we let T_N be the event that the first heads occurs after N, then the expectation for the shifted game truncated at N is:
          sum_{n=1}^N [ (original payoff for n) + 1 ] * (1/2)^n  +  0 * P(T_N)
          = [sum_{n=1}^N (original payoff for n) * (1/2)^n] + [sum_{n=1}^N 1 * (1/2)^n] 
          = E_N + [1 - (1/2)^N]

     - Therefore, the difference in expectations (shifted minus original) is:
          E_N' - E_N = 1 - (1/2)^N
     - As N→∞, (1/2)^N→0, so the difference →1. So the difference in the truncated expectations approaches $1.

     However, the individual expectations E_N and E_N' do not converge to a single value? Actually, E_N converges to ln(2) (if we take the natural order). But note: the truncated expectation for the original game (with the truncation rule we are using) is E_N, which does converge to ln(2). Similarly, E_N' converges to ln(2)+1.

     But wait: the problem with the original game is that if we rearrange the terms, we can change the limit. However, in the truncation we are using the natural order. So for the truncated games (with the natural order) the expectations converge to ln(2) and ln(2)+1. But if we rearrange the entire series (without truncation) we can make the expectation of the original game anything, and then the shifted game would be that plus ... what?

     The shifted game: if we rearrange the outcomes arbitrarily, then the expectation of the shifted game would be the expectation of the original (in that rearrangement) plus the expectation of the constant 1. But what is the expectation of the constant 1 in this game? The constant 1 is a random variable that is 1 on every outcome. But note: the sample space has total probability 1? Actually, the probability of the entire space is 1. So the expectation of the constant 1 is 1. Therefore, no matter what rearrangement we use, the expectation of the shifted game should be the expectation of the original game (in that rearrangement) plus 1.

     So the difference is always 1. Therefore, even though the absolute expectations are not well-defined (because they depend on the order), the difference is well-defined and equals 1.

     This is the key insight: comparative judgments can be well-defined even when absolute expectations are not.

  4. Discussion of implications (10 minutes)
     - The lesson: expectation is a tool for ranking gambles. In cases where the absolute expectation is undefined, we may still be able to make comparative judgments. In this case, we can say that the shifted game is worth exactly $1 more than the original, even though we cannot assign a unique expected value to either.
     - This is a problem for decision theories that rely solely on expected value: they break down for the Pasadena game. But we can still make some comparisons.

  5. Addressing misconceptions and objections (throughout, but especially in discussion)
     - "It's just St. Petersburg with minus signs": The St. Petersburg game has positive payoffs and the expectation is infinite. The Pasadena game has alternating payoffs and the expectation is conditionally convergent. The key difference is that in St. Petersburg, the series of absolute values diverges (so rearrangements don't change the divergence to infinity), whereas in Pasadena, the series of absolute values diverges but the signed series conditionally converges (so rearrangements change the sum). Therefore, the expectation is undefined in the Pasadena game but defined (as infinity) in St. Petersburg.
     - "The answer is obviously ln(2)": This is true only if we fix the natural order. But why that order? The rearrangement theorem shows that we can get any value. The natural order is arbitrary. So we cannot say the expected value is ln(2) without specifying the order.
     - "Use bounded utility": This is a common fix. If we use a bounded utility function, then the expectation would be absolutely convergent (because the terms would be bounded and the series of absolute values would converge). Then the problem disappears. We can mention this as a solution, but note that the problem is set up with linear utility (dollars). The point of the example is to show a problem for unbounded linear utility. So we can say: if we assume bounded utility, then the problem goes away, but that is changing the assumptions.
     - "No one could offer this gamble": True, but the example is a theoretical puzzle. We are interested in the foundations of decision theory.
     - "Use the median instead of the mean": The median might be defined (for example, the median payoff). But the problem is that the median doesn't capture the entire distribution. Also, the median might be 0? (Since the positive and negative terms might cancel in a way that the median is 0). But the median doesn't help for comparing gambles in the way expected utility does. We can say that this is an alternative approach, but it doesn't resolve the issue of how to rank the original and the shifted game.

  6. A question to check understanding (at the end, 5 minutes)
     - "If we change the Pasadena game by multiplying every payoff by 2, what can we say about the relationship between the new game and the original? And what about their expectations?"
       - The new game has payoffs: 2 * [(-1)^{n-1} * 2^n / n] = (-1)^{n-1} * 2^{n+1} / n.
       - The expectation series becomes sum (-1)^{n-1} * 2^{n+1}/n * (1/2)^n = 2 * sum (-1)^{n-1}/n. 
       - This is twice the original series. But the original series is conditionally convergent, so rearrangements can make it anything. However, the ratio between the two is fixed at 2? Actually, the difference between the new and the original is the original (so the difference is not defined). But note: if we take the natural order, the new game has expectation 2*ln(2). But if we rearrange, we can make the original game have expectation A and the new game have expectation 2*A? 
       - Actually, any rearrangement that we do to the original game must be done the same way to the new game. So if we fix a rearrangement, then the expectation of the new game is twice that of the original. But without fixing the order, both are undefined. However, the ratio is fixed? Not exactly: if we rearrange to make the original series sum to A, then the new series sums to 2A. So the ratio is always 2. But note: if we rearrange the two games differently? That would be comparing apples and oranges. The games are defined on the same sample space, so we must use the same ordering.

     Alternatively, we can consider the truncated versions: 
          Original truncated: E_N
          New truncated: 2 * E_N
          So the difference: 2*E_N - E_N = E_N, which does not converge as N->∞ (it oscillates and converges to ln(2) in the natural order, but that's not the point). However, the ratio is always 2.

     But note: the problem is that E_N converges to ln(2) in the natural order, but if we rearrange the terms then E_N (for the truncated series) would be different. However, for the truncated series we are fixed by the natural order.

     The key for the shifted game was the difference was constant. Here, the difference is E_N, which does not have a limit. So we cannot say that the new game is worth twice the original in the same robust way? Actually, the ratio is constant at 2 for every N. So the ratio of the truncated expectations is 2 for every N. Therefore, in the limit, we might say the new game is worth twice the original? But note: the truncated expectations of the original converge to ln(2) and the new to 2*ln(2). However, if we rearrange the entire series arbitrarily, the ratio might not be 2? 

     Example: rearrange the original series to converge to A, then the new series (with the same rearrangement) would be 2A. So the ratio is always 2. Therefore, we can say that the new game is worth twice the original, even though we cannot assign a unique expected value to either.

     So the question: 
          "If we multiply every payoff in the Pasadena game by 2, can we say that the new game is worth twice the original? Why or why not?"
          Answer: Yes, because for any rearrangement of the outcomes, the expectation of the new game is twice that of the original. Therefore, the ratio is fixed at 2, even though the absolute expectations are not uniquely defined.

     This reinforces the idea that comparative judgments (ratios, differences) can be well-defined.

  7. What to avoid
     - Do not get into measure theory or the formal definition of expectation in measure theory.
     - Do not spend too much time on the rearrangement theorem; a brief explanation and an example (like making the sum 0 by rearranging) is enough.
     - Do not get bogged down in the St. Petersburg comparison beyond the key point about absolute vs. conditional convergence.

  8. The literature
     - Settled: The mathematics of conditional convergence and the Riemann rearrangement theorem. Therefore, the expectation of the Pasadena game (with linear utility) is undefined because it depends on the order of summation.
     - Settled: If we use a bounded utility function, then the expectation becomes absolutely convergent and the problem disappears.
     - Live disputes: 
          - How should we rank the Pasadena game and the shifted game? Some argue that dominance principles (the shifted game pays more in every state) should imply that it is better. Others argue that without a well-defined expectation, we cannot use standard expected utility. 
          - Some propose using the limit of the truncated expectations (in the natural order) as the expectation. That would give ln(2) for the original and ln(2)+1 for the shifted. But why the natural order? And what if the natural order is not the only one?
          - The truncation approach we used for comparison (showing the difference goes to 1) is one way to justify the dominance. But note: the truncated games are different from the infinite game. However, the dominance in every state is compelling.
          - Unbounded utility is often seen as the culprit. But even with unbounded utility, some argue that we should extend expected utility to handle such cases by using a principle like dominance.

     We can say: the literature is split. Some decision theorists (e.g., Easwaran) have proposed specific methods to handle the Pasadena game, such as using the notion of "weak expectation" or "principal value" (the natural order). Others (e.g., Seidenfeld, Schervish, and Kadane) have shown that the Pasadena game and a slight variant (the Altadena game, which is the shifted one) can be used to create a Dutch book if an agent has a fixed price for the Pasadena game and the Altadena game that are not $1 apart. This supports the idea that they must be $1 apart. 

     So the truncation-comparison idea is not uncontested, but it has support. The dominance principle is widely accepted: if one gamble pays more than another in every state, then it should be preferred. The shifted game dominates the original (by $1 in every state). So we should prefer the shifted game by at least $1. But how much more? Without expectation, we can only say that the difference is at least $1? But note: we can also have a statewise dominance by more? Actually, the difference is exactly $1 in every state. So the shifted game is exactly $1 better in every state. So it is unambiguously better by $1.

     Therefore, the comparative judgment is robust.

  Session Outline:

  - 0-5 min: Introduction (St. Petersburg recap, Pasadena game definition, the series)
  - 5-20 min: Conditional convergence and the rearrangement problem (explain, illustrate with truncation in natural order, then show that rearrangements can change the sum)
  - 20-35 min: The shifted game and truncation comparison (define, compute truncated expectations and their difference, show it approaches 1)
  - 35-45 min: Discussion of implications (ranking vs. absolute value, addressing misconceptions: bounded utility, dominance, median)
  - 45-50 min: Check understanding with the multiplication-by-2 question and wrap-up.

  Addressing objections during the session:
     - When introducing the problem, if someone says "it's just St. Petersburg with minus signs", point out the key difference: in St. Petersburg the absolute series diverges (so it's not conditionally convergent) and rearrangements don't make it finite, while in Pasadena they do.
     - If someone says "the answer is ln(2)", ask: "Why should we use the natural order? What if we list the outcomes in a different order?" Then explain the rearrangement theorem.
     - "Bounded utility": If raised, say: "Yes, if we assume bounded utility, then the problem goes away. But the example is designed to challenge unbounded linear utility. So for now, we are assuming linear utility in money." 
     - "No one can offer this": "This is a theoretical puzzle to test our decision theory."
     - "Use the median": "The median might be defined, but it doesn't capture the entire distribution and doesn't help us compare the original and shifted game in the way we did. We are interested in expected utility as a criterion."

  Literature note: 
     - The Pasadena game was introduced by Nover and Hájek (2004). 
     - The Altadena game (shifted by $1) was also introduced by them to highlight the problem.
     - They argue that the standard expectation is undefined and that decision theory needs to be extended.

  Conclusion: The pair (Pasadena and Altadena) is an excellent way to build the session. The rearrangement result should be conveyed (so they understand why the expectation is undefined) before introducing the comparison. The comparison then shows that even without a defined expectation, we can make a comparative judgment.

  Final note: Emphasize that the problem shows a limitation of expected utility theory when applied to unbounded utilities and conditionally convergent series. The literature offers various solutions, but there is no consensus. The key takeaway is that we must be careful with infinite state spaces and unbounded utility.
answer: |-
  ### Session Plan: The Pasadena Game and the Limits of Expected Value  
  **Total Time:** 50 minutes  
  **Goal:** Show that conditional convergence makes the Pasadena game's expectation undefined, but comparative judgments (e.g., dominance) can still hold. Emphasize that expectation is a tool for ranking, not a universal "value."  

  ---

  #### **1. Introduction: The Pasadena Game (5 min)**  
  - **State the problem:**  
    - Fair coin tossed until first heads (on toss \(n\)).  
    - Payoff: \((-1)^{n-1} \cdot 2^n / n\) dollars → outcomes: \(+2, -2, +8/3, -4, \dots\)  
    - Expected value: \(\sum_{n=1}^\infty (-1)^{n-1}/n\) (alternating harmonic series).  
  - **Recall St. Petersburg:**  
    - "Infinite expectation" due to divergence of positive terms.  
    - Contrast: Pasadena’s series converges conditionally (to \(\ln 2\) in natural order) but not absolutely (harmonic series diverges).  
  - **Key question:** "Does this game have a well-defined expectation?"  

  > **Head off misconceptions early:**  
  > - If a student says, "It’s just St. Petersburg with signs," note: St. Petersburg’s expectation diverges to \(+\infty\) unconditionally; Pasadena’s can be rearranged to *any* value.  
  > - If someone says, "Obviously \(\ln 2\)," respond: "We’ll see why that’s not the full story."  

  ---

  #### **2. Why Expectation Is Undefined: Conditional Convergence (15 min)**  
  - **Explain conditional convergence:**  
    - The series \(\sum (-1)^{n-1}/n\) converges to \(\ln 2\) *only* in the natural order (1, 2, 3, ...).  
    - Riemann rearrangement theorem: Changing term order changes the sum (e.g., to 0, 10, or \(-\infty\)).  
  - **Simple illustration (no measure theory):**  
    - Truncate the game at \(N\) tosses (payoff 0 if no heads by \(N\)).  
    - Expected value = partial sum \(S_N = \sum_{n=1}^N (-1)^{n-1}/n\).  
    - As \(N \to \infty\), \(S_N \to \ln 2\), but this is order-dependent.  
    - Example rearrangement:  
      - Take positive terms until sum > 2: \(1 + 1/3 + 1/5 \approx 1.533\)  
      - Add first negative term: \(-1/2 \approx 1.033\)  
      - Result: Partial sum is not \(\ln 2 \approx 0.693\).  
  - **Why order matters in probability?**  
    - Outcomes are indexed by \(n\), but expectation sums payoffs × probabilities. If we reorder the terms (e.g., group all positive payoffs first), the sum changes.  
    - **Conclusion:** No unique expected value.  

  > **Preempt derailments:**  
  > - "No one could offer this gamble": Agree, but this is a *conceptual* challenge for decision theory.  
  > - "Use bounded utility": Acknowledge it solves the issue but stress we’re testing the limits of *unbounded* linear utility.  

  ---

  #### **3. The Core Comparison: Pasadena vs. Shifted Pasadena (15 min)**  
  **Build the session around this pair.**  
  - **Define the shifted game ("Altadena game"):**  
    - Same as Pasadena, but payoff is always \(+1\) dollar more.  
    - Outcome \(n\): \([(-1)^{n-1} \cdot 2^n / n] + 1\).  
  - **Intuition:**  
    - "Shifted should be worth exactly $1 more, regardless of expectation."  
  - **Truncate both games at \(N\) tosses (payoff 0 if no heads by \(N\)):**  
    - Pasadena truncated expectation: \(E_N^P = \sum_{n=1}^N (-1)^{n-1}/n\)  
    - Shifted truncated expectation: \(E_N^S = \sum_{n=1}^N \left[ (-1)^{n-1}/n + 1 \cdot (1/2)^n \right]\)  
      - *Clarify:* The \(+1\) is added to *each payoff*, so it contributes \(\sum_{n=1}^N 1 \cdot (\text{prob. of } n) = \sum_{n=1}^N (1/2)^n = 1 - (1/2)^N\).  
    - Difference: \(E_N^S - E_N^P = [1 - (1/2)^N]\).  
  - **Let \(N \to \infty\):**  
    - Difference \(\to 1\) (since \((1/2)^N \to 0\)).  
    - *But* \(E_N^P\) oscillates and converges only conditionally to \(\ln 2\); \(E_N^S\) behaves similarly.  
  - **Lesson:**  
    - Absolute expectations are undefined, but the **comparative difference survives the limit**.  
    - Dominance (shifted pays $1 more in every possible outcome) implies it should be preferred.  

  > **Why this works:**  
  > - Shows expectation is a tool for ranking, not a metaphysical "value."  
  > - Highlights that some judgments (dominance) are robust even when expectations fail.  

  ---

  #### **4. Implications and Objections (10 min)**  
  - **Decision-theoretic moral:**  
    - Expectation can be undefined, but we can still compare options via:  
      - Statewise dominance (shifted game pays more in every state).  
      - Limits of prudent comparisons (like the $1 difference).  
  - **Address live disputes in the literature:**  
    - **Settled:**  
      - Mathematics: Conditional convergence → undefined expectation.  
      - Any rule using linear expectation fails here (rearrangement breaks it).  
    - **Live disputes:**  
      - **Dominance:** Some argue it resolves the comparison (shifted is better). Others say dominance alone is insufficient for infinite cases without convergence.  
      - **"Favored order" (e.g., \(\ln 2\)):** Some propose using the natural order as a convention. Critics call this arbitrary—why not another order?  
      - **Unbounded utility:** Many see it as the root problem (bounded utility fixes this). But should we abandon it? Debate ongoing.  
      - **Truncation as a solution?** Your comparison is insightful but contested: Is the limit of truncated differences a valid substitute for expectation? Rivals include "weak expectations" (Easwaran) or dropping continuity axioms (Seidenfeld et al.).  
  - **Dismiss distractions:**  
    - "Use the median": Tempting but irrelevant—median ignores magnitude (e.g., huge gains/losses cancel). Not a tool for ranking gambles.  
    - "Bounded utility": Solves the problem but sidesteps the paradox. We’re examining unbounded linear utility.  

