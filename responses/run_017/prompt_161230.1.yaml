prompt: |-
  I'm putting together a handout for a third-year tutorial on blame and Ive been going round in circles trying to build one specific case, so I want you to build it for me. The topic is standing to blame and hypocrisy, and the case has to flip the usual ordering: the hypocrite — someone who is *currently*, unrepentantly doing the very thing they are blaming someone else for — has standing to blame, while a completely clean-handed person, who has never done anything remotely like it, lacks standing. And I don't mean lacks it in some weak advisory sense; I mean the strong thing, where the fitting response to their blame is: you are not in a position to say that to me. What the case is for is to make students see that standing might be a relation between blamer and blamed rather than a report card on the blamer, so anything that just stipulates that conclusion is cheating.

  Here is the part I can't get to work. I want one scenario, one paragraph, realistic — a workplace, a hospital ward, a restaurant kitchen, a university department, that sort of thing, no trolleys and no philosophers' dolls. Both blamers blame the same person for the same act, at the same moment, in more or less the same words, so the only things that vary are (i) dirty hands versus clean hands and (ii) inside the practice versus outside it. The hypocrite may not get standing from any of the usual escape hatches: no reform, no repentance, no apology on record, no punishment already served, no special role or authority over the person blamed, and the ongoing violation is recent and known. The clean-handed person may not lose standing for any of the usual reasons either: not complicit, not profiting from the violation, not misinformed, not motivated by spite, and not a stranger who wandered in off the street — they should know exactly what happened and be some kind of colleague, just not a participant in the practice whose norm was breached. Then the bit I actually care about: I want the case engineered so that three accounts come apart pairwise. Call them what you like, I don't want citations. (1) The forfeiture or tu quoque account: hypocrisy costs you standing, so it should say hypocrite no, clean-hands yes. (2) The equal-standing account: moral address among persons doesn't come in grades and dirty hands don't demote you, so it should say yes to both. (3) A relational account on which what matters isn't the state of your hands but whether you are inside the practice and exposed to being blamed back in the same coin: hypocrite yes, clean-hands no. My hunch is that (3) only wins if the violation is a breach of a norm internal to some shared practice rather than a plain moral wrong, because otherwise (2) grants the outsider standing for free and (3) collapses into (2) — build it that way if you agree, and tell me if you think the hunch is wrong.

  After the scenario, give me the verdict each of the three accounts gives and the reasoning that gets it there from that account's own commitments — I want to see the verdicts fall out, not be announced. Then: which single feature of the design is doing the work. Then a collapse test: what happens to the three-way spread if you clean the hypocrite's hands, if you swap the internal norm for a generic moral one, or if you make the outsider a full co-member. And finally the honest part: how would a defender of whichever account comes out worst attack the case — is someone going to say I built the verdict into the description of the practice, and is that a fair objection or just sour grapes?
reasoning: |-
  Okay, the user is creating a tutorial handout on blame and hypocrisy, specifically focusing on standing to blame. They need a case study that flips the usual intuition: a hypocrite has standing while a clean-handed person lacks it. The challenge is to make this realistic without using contrived examples. 

  First, I need to understand the key constraints. The hypocrite must be currently and unrepentantly doing the same thing they're blaming others for. No loopholes like repentance or special roles. The clean-handed person must be a colleague, not a stranger, and aware but not involved. The setting should be everyday—workplace, hospital, etc. 

  The user's deeper need is to illustrate that standing is relational, tied to participation in a shared practice. The usual accounts are: (1) hypocrisy forfeits standing (tu quoque), (2) everyone has equal standing, (3) standing depends on being part of the practice. The goal is to have these three diverge in their verdicts. 

  I recall their hunch: the norm must be internal to a practice, not a generic moral wrong. Otherwise, (2) and (3) collapse. So the case needs a practice-specific norm. A hospital setting with a hygiene protocol feels right—medical professionals have strict internal standards. 

  Here's the scenario: Two nurses, Sarah (hypocrite) and David (clean-handed), blame Dr. Evans for skipping hand hygiene. Sarah violates the same protocol herself, unrepentantly. David, a compliance officer, follows protocols but isn't part of the clinical team. The norm is specific to clinical staff, not universal morality. 

  Now, the verdicts: 
  - Account 1 (forfeiture): Sarah loses standing (hypocrite), David keeps it (clean hands). 
  - Account 2 (equal standing): Both have standing as moral agents. 
  - Account 3 (relational): Sarah has standing (she's part of the practice), David lacks it (outsider). 

  The key feature is the practice-bound norm. If Sarah reforms, Account 1 flips. If the norm becomes generic (e.g., "lying is wrong"), Account 3 collapses into 2. If David becomes clinical staff, Account 3 grants him standing. 

  Critics might argue the norm's internality is question-begging. But it's defensible—many real-world norms are practice-dependent (e.g., medical ethics vs. common morality). The objection isn't fatal; it highlights the relational view's core claim. 

  User's stress points: They struggled with the "flipped" outcome and avoiding loopholes. The hospital example nails both by leveraging professional insularity. Also, the "compliance officer" role cleanly separates David from the practice while keeping him proximate. 

  Final polish: Emphasize that David's blame feels like bureaucratic scolding, not collegial call-in. That’s why the "you can’t say that" response feels fitting. Sarah’s hypocrisy? Annoying but legitimate—she’s in the trenches too.
answer: |-
  Here's a realistic scenario designed to make the three accounts diverge, followed by the analysis you requested:

  **The Case: The ICU Hand Hygiene Protocol**

  At City General Hospital, the Intensive Care Unit (ICU) has a strict, non-negotiable hand hygiene protocol: *immediate* sanitization with hospital-grade gel *before and after* *every single patient interaction*, without exception. Breaching this is a cardinal sin within the ICU team due to the extreme vulnerability of patients. Dr. Evans, a senior intensivist, is seen by multiple staff members entering Room 4 (a patient with severe immunosuppression) after examining a patient in Room 3, without sanitizing his hands in between.

  Simultaneously, two colleagues address him in the corridor:
  1.  **Nurse Sarah:** "David, that was Room 4! You didn't sanitize after Room 3. You *know* the protocol here - that's completely unacceptable, you're putting Mx. Jones at massive risk!" Sarah says this sharply, while visibly tucking her own un-sanitized pen (used moments earlier on a chart for the immunocompromised patient in Room 2) back into the pocket of her scrubs – a clear, ongoing, unrepentant breach of the same protocol regarding fomite transmission risk, a known internal norm violation.
  2.  **David Chen (Compliance Officer):** "Dr. Evans, that was Room 4! You didn't sanitize after Room 3. You *know* the protocol here - that's completely unacceptable, you're putting Mx. Jones at massive risk!" David says this earnestly. He is the hospital's dedicated hand hygiene compliance officer. He meticulously follows *all* protocols himself (he doesn't even enter clinical zones without full decon) and has never breached this or any similar rule. He was specifically observing the ICU today due to audit concerns. He knows the protocol intimately, understands the risks, and is genuinely concerned for patient safety, not motivated by spite. He works closely with the ICU team on audits but is *not* a clinical staff member; he doesn't treat patients, doesn't share the immediate physical risks or the ingrained routines of bedside care, and isn't subject to being blamed *by his clinical colleagues* for breaches *of this specific, practice-embedded clinical norm* in the same way they are with each other.

  **Verdicts & Reasoning:**

  1.  **Forfeiture/Tu Quoque Account:**
      *   **Hypocrite (Sarah):** **Lacks Standing.** Sarah is *currently* and unrepentantly violating the *very same norm* she is blaming Evans for. Her hypocrisy undermines her moral authority. Her blame is illegitimate; Evans could rightly respond, "Look who's talking!" or "You can't say that to me while you're doing the same thing!"
      *   **Clean-Hands (David):** **Has Standing.** David has impeccably clean hands regarding this norm. He has never violated it, isn't complicit, and is acting from genuine concern. He is in a position to hold Evans accountable purely based on the objective wrongness of the act and his role/knowledge.
      *   **Verdict Pair:** Sarah: NO | David: YES

  2.  **Equal Standing Account:**
      *   **Hypocrite (Sarah):** **Has Standing.** Moral standing is inherent to persons as moral agents. The wrongness of Evans's act gives *any* moral agent standing to blame, regardless of their own conduct. Sarah's hypocrisy might make her blame *unpersuasive* or *objectionable* in other ways, but it doesn't *forfeit* her fundamental standing as an agent capable of recognizing and calling out moral wrongs. The focus is solely on Evans's violation.
      *   **Clean-Hands (David):** **Has Standing.** For the same reason. David, as a moral agent aware of the wrong, possesses standing to blame Evans. His non-clinical role doesn't negate his basic moral capacity or the objective wrongness he observes.
      *   **Verdict Pair:** Sarah: YES | David: YES

  3.  **Relational/Practice-Embedded Account:**
      *   **Hypocrite (Sarah):** **Has Standing.** Sarah is a core member of the ICU practice community. She is deeply embedded in the shared norms, responsibilities, and mutual vulnerabilities of that practice. Her *ongoing* violation (while hypocritical) actually *confirms* her membership – she's actively participating in (and failing at) the very practice whose norm Evans breached. This shared participation, even flawed, grants her the *relational standing* to address him. Her blame comes *from within* the circle of shared accountability. Evans might resent it, but the fitting response isn't "You can't say that" based on outsider status; it's "Fine, but you're doing it too!" – an acknowledgment of her *position* to speak, even while challenging her consistency.
      *   **Clean-Hands (David):** **Lacks Standing.** David, despite his knowledge, role, and clean hands, is fundamentally *outside* the specific practice community (the ICU clinical team) whose internal norm was breached. He doesn't share the lived experience, the immediate stakes, or crucially, *the reciprocal vulnerability to being held accountable by fellow practitioners under this specific norm in the course of their shared work*. His blame, however well-intentioned and correct, comes from an external, bureaucratic/auditing perspective. It feels like an outsider imposing judgment rather than a peer holding another peer accountable within their shared endeavor. The fitting response from Evans (and potentially Sarah) is: "You aren't one of us down here dealing with this pressure; you don't get to stand in judgment on *how we hold each other accountable* for *our* rules in *our* space." His clean hands don't grant him entry into the relational circle of mutual accountability specific to the practice.
      *   **Verdict Pair:** Sarah: YES | David: NO

  **The Key Feature Doing the Work:**

  The **practice-bound, internal nature of the violated norm** is absolutely crucial. The hand hygiene rule isn't *just* a general moral "do no harm" principle (though it connects to it). It's a highly specific, context-dependent, collectively upheld *operational norm* constitutive of the *shared practice* of working in *this specific ICU*. Standing to blame for its breach is tied to participation *in that practice* and exposure to its reciprocal accountability mechanisms. This is what allows David (clean but outside) to lack standing while Sarah (dirty but inside) retains it, relative to the practice community.

  **Collapse Tests:**

  1.  **Cleaning the Hypocrite's Hands (Sarah stops/reforms before blaming):**
      *   **Account 1:** Sarah GAINS standing (now clean hands).
      *   **Account 2:** Sarah RETAINS standing (standing unchanged).
      *   **Account 3:** Sarah RETAINS standing (still inside the practice). *All accounts now agree Sarah has standing. The 3-way divergence collapses.*
  2.  **Swapping Internal Norm for Generic Moral Norm (e.g., Evans steals from the charity box):**
      *   **Account 1:** Sarah (if also stealing) lacks, David has.
      *   **Account 2:** Both have standing (it's a general moral wrong).
      *   **Account 3:** Collapses towards Account 2. Without a specific *practice* defining the relational standing, David's outsider status becomes less relevant. Both might have standing as moral agents witnessing a generic wrong, or David might *still* lack if "theft within the hospital" is seen as a community-specific violation, but the clean distinction based purely on practice membership blurs. *The distinct verdict for Account 3 (Sarah Yes/David No) likely collapses or becomes very weak.*
  3.  **Making the Outsider a Full Co-Member (David is an ICU Nurse):**
      *   **Account 1:** David (clean) HAS standing.
      *   **Account 2:** David HAS standing.
      *   **Account 3:** David GAINS standing. He is now inside the practice, subject to its reciprocal accountability, even with clean hands. His blame now comes from within the shared endeavor. *The distinct verdict for Account 3 (David No) collapses; all agree David has standing.*

  **The Honest Part: Likely Attack & Its Fairness**

  *   **Who Comes Out Worst?** Account 1 (Forfeiture) comes out worst. It predicts Sarah lacks standing and David has it, but the case is designed so the intuitive relational pull suggests Sarah *does* have a kind of position to speak (even hypocritically), while David does not.
  *   **The Attack:** A defender of Account 1 will likely argue: **"You've simply *defined* the 'practice' and its 'internal norms' in a way that *stipulates* who is 'inside' for the purposes of relational standing, and this definition *smuggles in the desired verdict for Sarah.*** Specifically, by making Sarah's *ongoing violation* part of what confirms her membership, you've built hypocrisy *into* the criterion for standing within the practice, rather than having it forfeit standing. You're cheating by making the 'practice' boundary do all the work based on your prior commitment to the relational view."
  *   **Fairness?** **It's a *serious* objection, but not fatal, and not *just* sour grapes.** It correctly identifies that the case relies heavily on a particular (relational) conception of what constitutes the relevant "practice" and its boundaries. However, the description of the ICU – a team with intense shared responsibilities, specific high-stakes rules, and a culture of mutual monitoring – aims to make the practice *realistically* distinct. The objection highlights that *any* case designed to separate these accounts will involve contestable assumptions about the source of standing. The relational theorist's counter is: "Yes, precisely. Standing *is* contingent on these social realities and shared contexts. The case illustrates that 'being a moral agent' (Account 2) or 'having clean hands' (Account 1) isn't sufficient *or* necessary when blame functions as a practice-embedded form of mutual accountability among participants. The 'definition' reflects the real-world structure of professional communities and their norms." The objection forces clarification of *why* the ICU constitutes such a distinct practice community, but doesn't invalidate the case's core function of illustrating the *possibility* and *structure* of the relational view.

  This case forces students to confront the possibility that standing isn't just about the blamer's moral purity or universal agency, but can be deeply relational and contingent on shared participation in a norm-governed practice, even when that participation is flawed.
