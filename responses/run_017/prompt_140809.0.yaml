  ### Marking and Comments

  **Part (a) [6 marks]**  
  The student's answer is correct.  
  - Probability \(P(n) = 2^{-n}\) is accurately stated for a fair coin.  
  - The expected value sum \(\sum P(n) \cdot \text{payoff}(n) = \sum (-1)^{n+1}/n\) is correctly identified as the alternating harmonic series, converging to \(\ln 2\).  
  - The sum with absolute payoffs \(\sum P(n) \cdot |\text{payoff}(n)| = \sum 1/n\) is correctly identified as the harmonic series, which diverges.  
  **Mark: 6/6**

  **Part (b) [8 marks]**  
  The answer is partially correct but contains significant errors.  
  - For the Pasadena game, the diagnosis is mostly correct: the expectation is not well-defined because \(E[|X|] = \infty\) (due to divergence of \(\sum 1/n\)), implying both the positive and negative parts (\(E[X^+]\) and \(E[X^-]\)) are infinite. However, the phrase "in that sense the expectation is infinite" is misleading; it is undefined, not infinite.  
  - For the St. Petersburg game, the diagnosis is incorrect: the expectation is well-defined as \(\infty\) (since \(E[X^+] = \infty\) and \(E[X^-] = 0\), so the series diverges positively).  
  - The comparison is flawed: the student claims both games share the same issue (undefined expectation), but St. Petersburg has a defined (infinite) expectation, while Pasadena does not. The "moral" about unbounded payoffs rendering expected value useless is oversimplified and ignores that St. Petersburg's expectation is defined (albeit infinite).  
  **Mark: 3/8** (Credit for correct Pasadena diagnosis; deduction for St. Petersburg error and invalid comparison.)

  **Part (c) [6 marks]**  
  The answer is largely incorrect and inconsistent with part (b).  
  - The assessment of the "natural-ordering" response is wrong: the claim that the expectation is \(\ln 2\) due to the toss-number ordering is not standard. Riemann rearrangement shows that conditional convergence makes the sum order-dependent, so the expectation is not well-defined. The indexing does not resolve this, as expectation should be order-invariant.  
  - The generalization is false: not all gambles with infinitely many outcomes lack a well-defined expectation. If \(E[|X|] < \infty\) (absolute convergence), rearrangement does not affect the sum, and expectation is well-defined (e.g., bounded utility cases).  
  - The answer is inconsistent with part (b), where the expectation was stated as not well-defined, but here it is asserted as \(\ln 2\).  
  - The final comment on expected utility is correct but not directly relevant to the question.  
  **Mark: 1/6** (Minimal credit for acknowledging Riemann rearrangement; deductions for incorrect conclusions, false generalization, and inconsistency.)

  **Mutual Consistency**  
  The parts are inconsistent: in (b), the expectation for Pasadena is stated as not well-defined, but in (c), it is claimed to be \(\ln 2\). The treatment of St. Petersburg is also inconsistent, with (b) deeming it undefined while (c) implicitly questions its definition.

  **Central Error**  
  The student incorrectly asserts that the natural ordering defines the expectation as \(\ln 2\) for the Pasadena game and that rearrangement issues universally prevent a well-defined expected value for any gamble with infinitely many outcomes, disregarding that absolute convergence resolves such problems.

