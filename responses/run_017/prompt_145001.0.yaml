                  For regime 1: total awakenings, total correct guesses (if they always guessed tails? or individually? We want to see the success rate of the strategy they used. But we instructed them to give a guess at each awakening, so they might have guessed differently. We hope that they will notice that guessing tails is better in regime 1 and indifferent in regime 2.

            Alternatively, we can collect the data by group and then aggregate.

            We can have a table on the board:

            Regime 1:
              Group | Coin (H or T) | Guess at awakening 1 | Guess at awakening 2 (if T) | ... 

