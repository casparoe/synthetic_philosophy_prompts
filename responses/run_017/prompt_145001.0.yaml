            Then we aggregate.

            55-75 min: Debrief.

    The debrief:

        Step 1: Show the data for regime 1.

            Compute: 
              Total number of awakenings: A
              Number of tails awakenings: T_awake = (# of tails rounds) * 2
              Number of heads awakenings: H_awake = (# of heads rounds)

              How many times did students guess tails in a tails awakening? (should be about T_awake if they always guessed tails)
              How many times did they guess heads in a heads awakening? (should be about H_awake if they always guessed heads)

              But also, what was the overall success rate of always guessing tails? 
                  It would be T_awake / A.

              We expect T_awake / A to be about 2/3.

        Step 2: Show the data for regime 2.

            For each round, we have one scored awakening. We have:
              Number of heads rounds: H_round
              Number of tails rounds: T_round

              In a heads round: the scored awakening is heads. If the guess was heads, it's correct.
              In a tails round: the scored awakening is tails. If the guess was tails, it's correct.

            So the total correct is: (# of heads rounds where the scored awakening guess was heads) + (# of tails rounds where the scored awakening guess was tails)

            And the total rounds is H_round + T_round.

            We expect the fraction to be about 1/2.

        Step 3: Why the difference? 

            In regime 1, we are counting every awakening. There are more awakenings when the coin is tails, so you are more likely to be in a tails awakening. Therefore, guessing tails is better.

            In regime 2, we are counting one awakening per round, and the coin is fair, so you have a 50% chance of heads or tails.

        Step 4: Introduce the two positions:

            - The thirder says: when you are awakened, you should assign 1/3 to heads and 2/3 to tails.
            - The halfer says: it should be 1/2.

            And note that in regime 1, the thirder is right to guess tails because it yields 2/3 success. In regime 2, both yield 1/2, so the halfer might say that the probability is 1/2.

        Step 5: The deeper point: the question might be ambiguous. Are we asking about the coin or about the awakening?

        Step 6: Address the sharp student who says that in regime 2, when we sample an awakening uniformly, we are using the thirder's sample space. But note: in regime 2, we are not asking the student to say what the probability is. We are defining a scoring rule. The student should choose a guess to maximize expected reward given the scoring rule. In regime 2, the scoring rule is defined by randomly selecting one awakening per round. This makes the coin equally likely to be heads or tails at the scored awakening. So the probability for the scored awakening is 1/2. 

        The student might object: but the act of randomly selecting an awakening from all that occurred means that we are using a uniform distribution over awakenings. That is true. But the scoring rule is defined that way. The halfer and thirder are both indifferent in this scoring rule because it is designed to be fair.

        Step 7: The student who says it's about what we choose to count: we agree. The scoring rule determines what we care about.

    What the activity cannot reproduce:

        - The first-personal identity: in the real Sleeping Beauty, it is the same person in both awakenings. In our simulation, the student is the same person, but they remember the previous awakening? We try to simulate amnesia by distraction, but it's not perfect. We have to emphasize the role-play.

        - The depth of the memory erasure: in the real problem, Beauty has no memory of the previous awakening. In our case, the student might remember. We have to instruct them to reason as if they don't.

    We are least sure about the effectiveness of the amnesia simulation and the group work timing. We would want to pilot the group work to see if 8 minutes per round is enough.

    If time is tight, we could do only one round per regime, but then we have less data. We do two to have more data.

    Given the time, we commit to this design.
