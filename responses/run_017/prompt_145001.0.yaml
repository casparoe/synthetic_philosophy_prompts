  ### Sleeping Beauty Classroom Activity: Design and Implementation

  I propose a **role-play simulation with rotating "Beauties," filler tasks for amnesia, and two scoring regimes** to expose the halfer/thirder tension and scoring-rule dependence. The design addresses your constraints: no real amnesia, minimal setup, active participation, and chocolate incentives. Below is the full plan, defended against your design problems.

  ---

  ### **Activity Summary**
  - **Core Mechanism**: Students play "Sleeping Beauties" woken once (heads) or twice (tails) per coin flip. Filler tasks (puzzles) between awakenings simulate amnesia.  
  - **Two Scoring Regimes**:  
    1. **Every-Awakening Scoring (EAS)**: All guesses are rewarded (favors thirder).  
    2. **Single-Awakening Scoring (SAS)**: One random awakening per round is scored (equalizes halfer/thirder).  
  - **Roles**: 4 groups of 4 students. Each group runs 4 rounds (1 round = 1 coin flip + awakenings). Roles rotate: *Beauty*, *Coin Master*, *Recorder*, *Caller*.  
  - **Materials**: Coins, index cards, projector (for instructions), bag of chocolate, colored chips (for scoring).  

  ---

  ### **Minute-by-Minute Timeline** (75 mins total)
  | Time     | Activity                                                                                                  |
  |----------|-----------------------------------------------------------------------------------------------------------|
  | 0-5 min  | **Intro**: Explain the Sleeping Beauty setup (no spoilers). Project rules: Coin flip → awakenings → guesses. Emphasize: "When woken, you *truly forget* prior awakenings—role-play amnesia!" |
  | 5-15 min | **Setup**: Split into 4 groups. Assign roles (rotate each round). Hand out materials: coins, index cards (for guesses), puzzle cards (filler tasks). |
  | 15-60 min| **Rounds 1-4** (4 rounds × ~11 min each):<br>**Scoring Regime:** Rounds 1-2 = EAS; Rounds 3-4 = SAS.<br>*(Each round: Coin flip → 1-2 awakenings with filler tasks → guesses)* |
  | 60-70 min| **Data Aggregation**: Groups report results to a class table (projected). Calculate success rates.        |
  | 70-75 min| **Debrief**: Reveal "halfer" vs. "thirder," link to scoring rules, and probe the two "pulls."             |

  ---

  ### **Detailed Round Procedure** (Per Group)
  1. **Coin Flip** (1 min):  
     - *Coin Master* flips a coin (public). *Recorder* writes outcome (heads/tails) on index card (hidden).  
  2. **Awakenings** (5-7 min):  
     - **Heads**: *Caller* wakes *Beauty* **once**.  
     - **Tails**: *Caller* wakes *Beauty* **twice**, with a 3-min filler task between awakenings.  
       - *Filler Task*: Beauty solves a quick puzzle (e.g., "List 5 capitals") at their seat. *Crucially, instruct:* "While doing this, forget you were woken before. When called again, act as if it’s your first awakening."  
     - *Each awakening*: Beauty guesses "heads" or "tails" aloud. *Recorder* logs guesses.  
  3. **Scoring** (1 min):  
     - **EAS (Rounds 1-2)**: Reward *every correct guess* with a chocolate chip (e.g., 1 chip/guess).  
     - **SAS (Rounds 3-4)**: After awakenings, *randomly draw one guess* (from a box of all guesses in the round) to score. Reward only if correct (1 chip).  

  ---

  ### **Why This Solves Your Design Problems**
  1. **Simulating Amnesia**:  
     - **Filler Tasks > Drawn Slips**: Filler tasks (puzzles) create temporal gaps and cognitive load, making it plausible for students to "forget" prior awakenings. Drawn slips alone fail because students *know* if they’ve been woken before.  
     - **Minimal Disruption**: Filler tasks are short (3 min), done at seats, and parallel (other students discuss puzzle solutions). This maintains flow without chaotic transitions.  

  2. **Scoring-Rule Dependence**:  
     - **EAS vs. SAS Contrast**:  
       - *EAS*: Always guessing "tails" wins 2/3 of the time (thirder optimal).  
       - *SAS*: **Your calculation is correct**. Halfer and thirder both win 50% of the time because:  
         - P(Heads | selected) = P(Heads) × P(selected|Heads) / [P(Heads) × P(selected|Heads) + P(Tails) × P(selected|Tails)]  
           = (0.5 × 1) / [(0.5 × 1) + (0.5 × 0.5)] = **0.5**  
       - *Order*: Run EAS **first** (Rounds 1-2). Students see "tails" dominate, feeling the thirder pull. SAS (Rounds 3-4) then surprises them by equalizing results, exposing the scoring-rule dependence.  
     - **Not a Distraction**: The contrast forces students to confront *why* the optimal guess changed—it highlights how "what counts" (all moments vs. per-flip events) shapes belief.  

  ---

  ### **Debrief Plan** (Final 10 mins)
  1. **Map Activity to Positions**:  
     - **Thirder Pull**: "In EAS, why did guessing 'tails' win more? Because 2/3 of *awakenings* happen on tails! If you’re woken, odds are it’s tails."  
     - **Halfer Pull**: "In SAS, why didn’t the coin matter? Because you knew pre-experiment you’d be woken—nothing about the coin changed. Scoring per flip resets your belief."  
     - **Key Insight**: "The disagreement isn’t just about probabilities—it’s about whether we’re asking 'What should I believe *now*?' (thirder) or 'What should I believe about the *coin*?' (halfer)."  

  2. **Handle Sharp Student Objections**:  
     - *"Sampling awakenings assumes the thirder view!"*: Agree. "Yes—SAS *explicitly* samples moments uniformly, mimicking the thirder’s sample space. But notice: it made halfer and thirder *equal*. Why? Because SAS cares about per-flip accuracy, not per-moment. This shows the thirder’s 'uniform moments' assumption isn’t universal—it depends on the question."  
     - *"It’s arbitrary what we count!"*: "Exactly! The exercise reveals that belief isn’t purely 'out there'—it’s tied to *what we optimize for* (e.g., awakening-frequency vs. coin-truth). That’s why decision theory matters."  

  3. **Limitations of the Activity**:  
     - **Unreproducible Element**: The **first-personal identity continuity** ("*I* am the same subject in both awakenings") can’t be simulated. Students know they’re role-playing, so the existential stakes of "being" Beauty are lost. *You’ll need to supplement*: "In the real problem, Beauty’s amnesia makes each awakening feel like her only one—our filler tasks can’t replicate that isolation."  
     - **Other Shortfalls**:  
       - Students might "cheat" amnesia (strictly enforce role-play).  
       - SAS’s indifference is counterintuitive (use aggregate data to prove 50% success).  

  ---

  ### **Pitfall Prevention**
  - **Avoiding the "Bag Argument"**: Last year’s collapse happened because students debated sampling *without stakes*. Here:  
    - **Bind sampling to scoring**: SAS uses random draws *only* for rewards, making it tangible (e.g., "If your guess isn’t drawn, you get no chocolate").  
    - **Delay theory**: Debrief only *after* data is in, so arguments anchor in observed results.  
  - **Guardrails**:  
    - **Amnesia Role-Play**: Warn: "If you remember a prior awakening, *still act as if you don’t*—this is key!"  
    - **Group Sizes**: 4 students/group ensures rotation (no one sits out >7 mins).  
    - **Data Focus**: Project group results to depersonalize debates ("Look, tails won 68% in EAS!").  

  ---

  ### **Why Not Add a Stretch Case or Bookie?**
  - **10-Awakening Case**: Adds complexity but doesn’t deepen the core tension. Cut for time.  
  - **Student Bookie**: Fun, but distracts from belief formation. The scoring regimes already expose payoff-dependence.  

  ---

  ### **Defended Choices and Pilot Flags**
  - **Why Groups?** Ensures all students are Beauty *and* experimenters, avoiding passivity.  
  - **Why Filler Tasks?** They’re "worth the disruption" because they make amnesia feel real (unlike slips).  
  - **Least Sure Elements**:  
    1. *Filler task effectiveness*: Pilot with 2–3 students to test if puzzles create enough "forgetfulness."  
    2. *SAS indifference*: Pre-calculate expected payoffs to explain if students are skeptical.  

  This design forces students to *live* the halfer/thirder conflict via guesses, scoring, and chocolate. By the debrief, they’ll have felt both pulls—and seen why scoring rules matter—without a single lecture.
