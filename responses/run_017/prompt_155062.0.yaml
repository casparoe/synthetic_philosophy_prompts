          Mechanism card: "The soldier ant's large jaws are used to attack and kill predators. This often results in the death of the soldier ant. The defense of the colony allows the colony to grow and produce new queens and males that start new colonies."

          Then we assign half the pairs to Group A (individual) and half to Group B (colony). They must write the function from their assigned perspective.

          Clash type: interest_relative
          Predicted split: Group A will write something like "defend the colony (leading to death)"? But from the individual perspective, does it have a function? The individual doesn't reproduce. So they might write "no function for the ant" or "to defend the colony at the cost of its life". Group B will write "defend the colony to allow colony reproduction".

     This will show that the function depends on the system you choose.

     Now, we have to provide the assignment for case 5.

     We'll do:

          For case 5, the facilitator assigns each pair to either Group A (individual) or Group B (colony). They get the same history and mechanism cards, but they are told to focus on the function for the assigned system.

     Now, let's list the dossiers in JSON.

     Stakes Mechanism: 
        "Each pair starts with 5 chips. For each case, they must bet one chip to play. They have 3 minutes to agree on a function and write it on an index card. If they submit on time, they get the chip back. If not, they lose the chip. There is no additional penalty or reward for the content of the function."

     Debrief Map:

     We'll have an array of moments and what they illustrate.

     Moments can be:
       - Case 1: Everyone agreed easily. Why? Because both history and mechanism pointed to the same function.
       - Case 2: We saw a split in the functions. Some wrote [function from history], some [function from mechanism]. Why? Because the historical reason and the current use were different.
       - Case 3: Most wrote the function from the mechanism. But what about the history? There was none. So one account (the historical one) might say it has no function, but the other account (current mechanism) can assign a function.
       - Case 4: We had a function that helped a larger system (the host). The history showed that it was selected because it helped the bacteria spread, but the mechanism described it as helping the host. So the function can be described at two levels.
       - Case 5: We assigned different systems to different pairs, and they came back with different functions. This shows that the function depends on which system you choose to analyze.

     Then we map to the two accounts.

     Failure modes:

       - Pairs don't understand the instructions -> fix: do a practice case? But we have case 1 as baseline. Make sure instructions are clear.
       - Pairs show each other the cards -> fix: remind them not to, and design the cards so that they are text-heavy and it's hard to show without the partner seeing? Or accept that it might happen and it's okay.
       - In the divergence case, they might combine both functions -> that's okay, we can count it as matching either? But we want to see the conflict.
       - Time runs out -> we have a strict timekeeper.

     Activity cannot deliver:

       - The deep philosophical arguments for each account? We have to state that at the end.
       - The fact that the selected-effect account requires a selection history? We can state that.

     Success signs:

       - In case 1, all pairs agree.
       - In case 2, we see two main function attributions.
       - In case 3, most write the mechanism function.
       - In case 4, we see functions at two levels.
       - In case 5, the two groups write different functions.

     Jargon reveal:

       "So what you've experienced is the clash between two ways of thinking about function: one that says a trait's function is whatever it was shaped by evolution to do (we call that the selected-effect view), and another that says a trait's function is whatever it currently does to contribute to a system's working (that's the causal-role view, sometimes called the Cummins view after the philosopher who developed it)."

     Now, we write the JSON.

     Note: The facilitator will have a master sheet with the full dossiers and the debrief points.

