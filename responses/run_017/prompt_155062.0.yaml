answer: |-
  ### Activity Design: "Function or Fiction?"

  #### Room Setup
  Push tables together to form 5-6 small workstations. Place flipchart at front with three columns: "Trait", "Function Attribution", and "Chips Bet". Distribute poker chips (5 per pair) and marker pens. Randomly pair participants (7 pairs total).

  #### Materials
  - Poker chips (35 total, 5 per pair)
  - 7 sets of 5 laminated dossier cards (each set in an envelope labeled CASE 1 to 5)
  - Index cards for function attributions
  - Marker pens
  - Flipchart with scoring grid

  ---

  ### Phases (Total: 70 min)

  | Phase               | Minutes | Participant Instructions                                                                 | What They Run Into                                                                 |
  |---------------------|---------|------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------|
  | **1. Setup**        | 5       | "Pair up. Each pair gets 5 chips. For each case, bet 1 chip on your function answer. If you're 'proven wrong' by the dossier, lose the chip." | Introduction to stakes and uncertainty.                                           |
  | **2. Case 1: Baseline** | 10     | "Read ONLY your half of the card. Discuss and write the function of the trait. You have 3 minutes." | History and mechanism align. Easy consensus.                                      |
  | **3. Case 2: Divergence** | 10     | "Same rules. Bet a chip again."                                                          | History points to survival, mechanism points to mating. Conflict emerges.         |
  | **4. Case 3: No History** | 10     | "New case. Bet and decide."                                                              | History card shows no evolutionary past. "No function?" vs. mechanism's activity. |
  | **5. Case 4: Contested System** | 15    | "Decide the function. This one’s trickier—what system matters?"                          | Trait helps host but harms individual. System boundary ambiguity.                 |
  | **6. Case 5: Interest Relative** | 10    | "Half the room: analyze for the INDIVIDUAL. Other half: analyze for the COLONY. Bet."    | Same trait, different functions based on chosen system. Embarrassing disagreement. |
  | **7. Debrief**      | 10      | "Look at the flipchart. Where did chips get lost? Why?"                                  | Patterns of conflict revealed visually.                                           |

  ---

  ### Dossiers

  ```json
  [
    {
      "case_id": 1,
      "organism": "Desert Hopper",
      "trait": "Water-Storing Tail",
      "history_card": "Ancestors survived droughts because this trait stored water. Mutants without it died younger.",
      "mechanism_card": "Stores 1L of water, allowing survival during 10-day dry spells. Drains energy reserves.",
      "clash_type": "baseline",
      "predicted_split": "100% agreement: 'water storage'"
    },
    {
      "case_id": 2,
      "organism": "Glow Lizard",
      "trait": "Neck Glow-Patch",
      "history_card": "Evolved to attract moths for food. Brightness correlated with hunting success.",
      "mechanism_card": "Now used in mating displays. Glow intensity predicts mate choice. No longer attracts prey.",
      "clash_type": "divergence",
      "predicted_split": "50% 'hunting', 50% 'mating'"
    },
    {
      "case_id": 3,
      "organism": "Lab Yeast",
      "trait": "Vanilla Pathway",
      "history_card": "Engineered 3 years ago. No ancestral version exists. Never tested in nature.",
      "mechanism_card": "Converts glucose to vanillin. Costs 15% growth rate. Alters cell membrane chemistry.",
      "clash_type": "no_history",
      "predicted_split": "80% 'make vanilla', 20% 'no function'"
    },
    {
      "case_id": 4,
      "organism": "Gut Bacterium",
      "trait": "Vitamin B12 Pump",
      "history_card": "Evolved because hosts with healthy bacteria spread more colonies via fecal matter.",
      "mechanism_card": "Produces B12 absorbed by host. Bacterium dies faster due to energy cost. Host thrives.",
      "clash_type": "contested_system",
      "predicted_split": "60% 'help host', 40% 'spread colonies'"
    },
    {
      "case_id": 5,
      "organism": "Sentry Ant",
      "trait": "Alarm Pheromone",
      "history_card": "Colonies with this trait survived invasions 70% more often. Individual ants die faster.",
      "mechanism_card": "When released, triggers colony defense. Ant dies attracting predators. Colony escapes.",
      "clash_type": "interest_relative",
      "predicted_split": "INDIVIDUAL: 'suicide signal', COLONY: 'early warning system'"
    }
  ]
  ```

  ---

  ### Stakes Mechanism
  Pairs bet 1 chip per case by placing it on their written function card. After revealing full dossier, chips are **lost** if:  
  - Function ignores key evidence from *either* card (e.g., in Case 2, claiming "glow is for camouflage" when both cards mention attraction).  
  - In Case 5, attributing colony-level function to "individual" group, or vice versa.  
  *Chips visible on flipchart create public accountability.*

  ---

  ### Debrief Map

  | Moment                     | Point in Plain Language                                  | Facilitator Line                                                                 |
  |----------------------------|--------------------------------------------------------|---------------------------------------------------------------------------------|
  | **Case 1 consensus**       | When history and present role match, function is obvious. | "You all agreed here because what it *did* and what it *does* lined up."        |
  | **Case 2 split**           | Conflict arises when a trait’s current job isn’t why it evolved. | "Notice: half of you prioritized ancestry, half prioritized present mechanics." |
  | **Case 3 'no function'**   | No history = can we say it has a purpose?              | "If we require an evolutionary backstory, the vanilla pathway might be 'pointless'." |
  | **Case 4 host/colony**     | Function changes depending on where you draw the system boundary. | "Is the pump’s function to help the host, or to spread bacteria? Both are true, but which *matters*?" |
  | **Case 5 contradictory answers** | Function isn’t "in" the trait—it’s about which system you analyze. | "You got different functions for the SAME trait because you chose different lenses." |

  ---

  ### Failure Modes & Fixes

  | What Goes Wrong                     | Why                                          | Fix                                                                 |
  |-------------------------------------|----------------------------------------------|---------------------------------------------------------------------|
  | Pairs share card texts              | Competitive desire to "win"                  | "Remember: your power is in your unique half. Keep it secret!"     |
  | Slow consensus in Case 4/5          | Ambiguity feels frustrating                  | Set hard 3-min timer. Say: "Commit now—uncertainty is the point!"  |
  | "No function" answers in Case 3 derail debate | Feels like a loophole                      | "If it burns energy and makes vanilla, can we really call it useless? Discuss." |
  | Overfocus on winning chips          | Stakes overshadow conceptual clash           | "Chips are just a nudge. The goal is spotting why this is messy."  |

  ---

  ### Activity Cannot Deliver
  - Why selection history *matters* to biologists (e.g., how it explains maladaptive traits).  
  - The metaphysical depth of "purpose" in non-evolved systems (e.g., engineered traits).  
  *State these during final wrap-up.*

  ---

  ### Success Signs
  - Groans/laughter when Case 2 splits the room.  
  - Intense leaning-in during Case 4 debates.  
  - Someone exclaims: "But that’s cheating!" in Case 5 when groups share answers.  
  - Chips visibly cluster on "wrong" answers post-reveal.

  ---

  ### Jargon Reveal
  **"Tonight, you wrestled with two big ideas: the 'selected-effect' view (function is what evolution shaped a trait FOR) and the 'causal-role' view (function is what a trait DOES NOW for some system)—and saw why biologists fight about this over pints!"**

