  Okay, the user is dealing with a philosophical argument about expected value and charity. They got into an argument in a group chat where someone claimed that rational people should donate all their money to causes with astronomically high stakes, even if the probability is tiny. The user is confused because they see a contradiction: if every action could potentially cause immense harm based on some crazy story, then expected value calculations break down entirely. They want to know where the argument goes wrong and how to resolve this without abandoning core principles like expected utility theory and unbounded value.

  First, I need to recall the key points of the expected value fanaticism argument. The friend argues that since value is unbounded, even a minuscule probability of an astronomical payoff should dominate any finite good. The user's counter is that symmetrically, any action could have a tiny probability of causing immense harm, making all options incomparable or equally bad.

  The user mentions they don't want to give up (1) or (2). So the solution likely involves challenging steps (4) or (5). Step (4) claims there's no principled way to set probabilities to zero for "crazy" claims. Step (5) says that a story's absurdity isn't evidence against it since you can always increase the stakes to compensate.

  Hmm, the core issue might be how we assign probabilities to wild claims. The user's friend assumes that probabilities for such claims are merely "small but non-zero," but in reality, our probability assessments aren't that straightforward. When someone makes an increasingly extravagant claim ("I have 10^40 simulated lives!"), our credence doesn't just decrease linearly; it might drop exponentially or even hit effective zero based on our model of how the world works.

  The user is right that the symmetry of harm and benefit scenarios creates a problem. If we take all conceivable scenarios seriously, expected values become undefined because of infinite positive and negative terms. This suggests that we need a principled way to discard certain possibilities rather than assigning them arbitrarily small probabilities.

  Epistemology comes into play here. We don't treat all logically possible claims equally. Claims that contradict our understanding of physics, economics, or human behavior can be assigned negligible probability based on our best models of reality. For example, the idea that one person could run 10^40 simulations might violate known physical limits, so we can justifiably set that probability to near-zero.

  The user's concern about the argument "proving more" is valid. If we accept all improbable claims, decision-making becomes impossible. The solution is to recognize that not all possibilities deserve consideration in our expected value calculations. We use our background knowledge to filter out incoherent or physically impossible scenarios.

  For practical philanthropy, the user can continue donating to evidence-backed charities without worrying about every theoretical long shot. The key is that expected value calculations only work when probabilities and values are reasonably estimable. In high-stakes, low-probability scenarios with no evidence, it's rational to ignore them based on epistemic principles.

  The user might also benefit from understanding robust decision-making, which considers model uncertainty. Instead of putting all money into one long shot, diversifying across credible options avoids the fanaticism pitfall while still prioritizing high-impact giving.
answer: |-
  You've put your finger on the core tension in "expected value fanaticism" (EVF), and your symmetry argument is devastating to the naive application of the fanatic's reasoning. The problem isn't with (1) or (2) – expected value calculation for well-defined choices and the unbounded nature of potential value are defensible starting points. **The critical failure occurs in step (4) and the implicit assumptions underlying step (5).** Here's the breakdown:

  1.  **The Core Problem: Indiscriminate Probabilistic Non-Zeroism (Step 4):**
      *   Step 4 asserts: "You can't wriggle out by setting p to zero for claims that sound crazy, because there's no principled number to put there instead... your credence... should be small but not zero."
      *   **The Flaw:** This treats *all conceivable propositions*, no matter how absurd, incoherent, or physically impossible they seem given our best understanding of the universe, as deserving a fixed, non-zero "atom" of probability merely because they can be formulated linguistically. This is **epistemologically bankrupt**.
      *   **The Symmetry Problem (Your Insight):** As you brilliantly realized, if we apply this indiscriminately, *every* action becomes entangled with astronomically huge potential harms *and* benefits based on equally absurd counterfactual scenarios ("simulations collapse if I pay/don't pay"). This renders expected value calculations *incoherent* for *any* real-world decision. The fanatic's framework self-destructs under the weight of its own permissiveness. If we *must* assign non-zero probability to *everything* conceivable, decision paralysis is the only rational outcome. This demonstrates that step 4 *cannot* be universally correct.

  2.  **The Misapplication of "Make the Number Bigger" (Step 5):**
      *   Step 5 asserts: "And the fact that a story sounds ridiculous isn't evidence on its own, since he can always make the number bigger until it outweighs however implausible the story sounds."
      *   **The Flaw:** This assumes "implausibility" is a *fixed cost* that can be linearly offset by increasing the claimed stakes. **It ignores how probability assessment actually works.** As a claim becomes increasingly extravagant ("I run 10^40 simulated minds", "I run 10^100 simulated minds"), its *implausibility doesn't just increase linearly; it often increases super-linearly or even qualitatively shifts*. We don't just assign a fixed "absurdity penalty"; we update our entire *model* of what's possible.
      *   **Rational Probability Assignment:** Our credence isn't just pulled from a hat. It's based on:
          *   **Coherence with Background Knowledge:** Does this claim fit within the laws of physics as we understand them? Basic economics? Human behavior? A claim requiring violating fundamental physical limits (e.g., energy requirements for 10^40 simulations) isn't just "unlikely," it's effectively *incoherent* with our model of reality.
          *   **Source Credibility:** Who is making the claim? What is their track record? What incentives do they have? An anonymous email from "SimLord42" has vastly different implications than a peer-reviewed paper from CERN.
          *   **Internal Consistency:** Does the story hang together logically? Are there internal contradictions?
          *   **Alternative Explanations:** How likely is it that this is a scam, a delusion, or a misunderstanding?
      *   **The Result:** For claims sufficiently incoherent, unverifiable, unsourced, or physically impossible, **it is entirely principled and rational to assign a probability indistinguishable from zero for practical decision-making.** This isn't "wriggling out"; it's applying rational epistemology. Assigning 10^-100 or 10^-1000 to Pascal's Mugger isn't irrational; it's *generous*. The probability isn't "small but non-zero" in a way that meaningfully impacts calculation; it's effectively *zero*.

  3.  **Why (1) and (2) Survive (and How to Use Them):**
      *   **(1) Expected Value:** This principle is sound *for decisions where the probabilities and outcomes are reasonably well-defined and estimable within a plausible model of the world.* Choosing between proven charities, medical treatments, or business investments is its domain. It breaks down when forced to consider literally *any* conceivable scenario with arbitrary stakes. **Expected value calculation requires a bounded, plausible possibility space.** Step 4 destroys this boundedness.
      *   **(2) Unbounded Value:** You can still believe saving more lives is better, potentially without limit. This doesn't force you to take *every* claim of astronomical stakes seriously. You can believe saving 10^30 lives *would* be astronomically good *if it were to actually happen through plausible means* (e.g., preventing an existential catastrophe), while simultaneously dismissing claims that such stakes are achievable by sending $50 to a random emailer as incoherent nonsense meriting effectively zero probability.

  **The Resolution: Principled Probability Assignment & Bounded Rationality**

  1.  **Discard Naive Non-Zeroism:** Reject step 4's demand that every conceivable proposition must have a fixed, non-zero probability atom. It's rational to set P(Pascal's Mugger's Claim) ≈ 0.
  2.  **Embrace Model-Based Probabilities:** Assign probabilities based on coherence with your best understanding of reality (physics, psychology, economics, evidence). Claims violating core principles of these models get probabilities so low they are irrelevant for practical calculation. The "number getting bigger" often makes the claim *less* plausible, not just offsetting fixed implausibility.
  3.  **Focus on Plausible, Evidenced Interventions:** Within the vast space of *plausible* ways to do good (like your 3% to a recommended charity), expected value calculations *are* valid and powerful tools. Compare options like bednets vs. deworming vs. policy advocacy *based on evidence and realistic models of impact*. Long shots *can* be worth it if they have *credible* pathways to large-scale impact (e.g., early-stage existential risk research), but their credibility and mechanism matter immensely.
  4.  **Acknowledge Decision Costs & Robustness:** Calculating probabilities for everything is impossible. Focus effort where evidence exists and impacts are potentially significant within plausible bounds. Prefer strategies robust across reasonable probability assignments.

  **What It Costs (Minimally):**

  You only need to give up the idea that *expected value calculation can be naively applied to literally any conceivable scenario, no matter how absurd, without collapsing.* This costs you nothing in practical, evidence-based philanthropy. You keep:
  *   The core principle of maximizing expected good.
  *   The belief that more lives saved is better.
  *   The ability to use cost-effectiveness estimates for well-understood interventions.
  *   The rationale for giving to effective charities.

  **What Survives of "Just Use Expected Value":**

  A robust version survives: "For real-world decisions involving plausible actions and outcomes, where probabilities and values can be reasonably estimated based on evidence and coherent models of reality, rank actions by their expected value." This is the version that got you donating 3% in the first place, and it remains sound. The fanatic stretches this principle beyond its breaking point by demanding you consider incoherent, evidence-free scenarios as having meaningful non-zero probability.

  **Who Should Be Embarrassed?**

  *   **The Fanatic:** For presenting an argument that, when taken seriously, destroys the possibility of rational decision-making altogether (as your symmetry argument shows), and for failing to account for how rational probability assignment actually works in the face of absurdity. Their "bite the bullet" leads to an abyss of indecision.
  *   **Not You:** You correctly identified the fatal flaw (the symmetry problem) and have a grounded, practical approach to doing good. Your discomfort was a sign of recognizing the argument's incoherence. Stick with your evidence-based giving – it's rational and impactful. The fanatic's argument is a fascinating philosophical puzzle, but a terrible guide to real-world action.
