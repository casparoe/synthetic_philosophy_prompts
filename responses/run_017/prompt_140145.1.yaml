answer: |-
  ## Memorandum: Recommendation on Centre for Quantitative Social Science (CQSS) to School of Data and Society (SDS) Transition

  **To:** Academic Planning Committee  
  **From:** [Your Name], Undergraduate Representative  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Classification of CQSS Transition to SDS: Rebranding vs. Substantively New Unit  

  **1. Background & Core Dispute**  
  Dean [Name] of Social Sciences proposes transitioning the existing Centre for Quantitative Social Science (CQSS) into a School of Data and Society (SDS). The proposal includes:  
  *   Retention of current CQSS staff, physical space, and budget (Year 1).  
  *   Creation of a new undergraduate degree program.  
  *   Establishment of a new Dean-level leadership position for SDS.  
  *   Addition of four new tenure-track faculty lines over three years.  

  The dispute centers on whether this constitutes a "substantively new academic unit" requiring a full external review per University Handbook Section [X], or a "rebranding or internal reorganisation" eligible for the light-track approval (one-page filing, no external review, expedited timeline).  

  The Dean contends this is a rebranding/internal reorganisation: core personnel and resources remain unchanged initially, making objections purely semantic. Six faculty object, arguing SDS represents a fundamentally new entity due to the scale of planned additions (degree, dean, hires), and that classifying it as a rebranding avoids necessary scrutiny.  

  **2. Key Considerations Beyond the Core Proposal**  
  Two additional facts require careful consideration:  

  *   **A. Donor Requirement:** A significant gift is contingent upon establishing "a new school of data and society." The funding lapses if SDS is not deemed "new." The term "new" here carries contractual and financial weight, distinct from its descriptive use in academic planning policy.  
  *   **B. Data Science Initiative (DSI) Status:** A pre-existing "Data Science Initiative" (DSI) comprises a website, mailing list, and one faculty director with minimal (5%) course buyout. It has no budget, no dedicated students, and has never undergone formal review. If DSI is considered an "existing unit," SDS could potentially be framed as its evolution, supporting the "rebranding" claim. However, DSI lacks the hallmarks of an established academic unit (budget, faculty lines, programs). Granting DSI "existing unit" status for this purpose would set a concerning precedent for minimal administrative structures to bypass future reviews.  

  **3. Analysis: Rebranding vs. Substantively New**  
  Evaluating the Dean's position and faculty objections requires moving beyond semantics to assess the *substance* of the change against the *purpose* of the Handbook's review requirements.  

  *   **Strengths of Dean's Position (Light Track):**  
      *   Continuity is significant: Same core faculty, same physical infrastructure, same initial budget line. This provides a strong foundation for viewing SDS as an evolution of CQSS.  
      *   Expediency is practical: Avoiding a year-long external review process allows the university to respond faster to evolving academic needs and leverage the donor opportunity.  
      *   Core "facts" agreed: Disagreement focuses on classification, not the tangible elements of the proposal (who, where, initial funding).

  *   **Strengths of Faculty Concerns (Full Review Required):**  
      *   **Scale of Added Elements:** The new undergraduate degree, a new Dean-level position, and four tenure-track lines represent significant *qualitative* change. These are not minor additions but foundational elements defining a new school's scope, leadership structure, and long-term trajectory. They fundamentally alter the unit's mission, scale, and administrative footprint compared to CQSS.  
      *   **Purpose of External Review:** The full review exists precisely to scrutinize major commitments like new deanships and significant faculty hiring clusters *before* they are finalized. These elements impact resource allocation, institutional priorities, and academic direction for decades. Bypassing review risks insufficient vetting of these strategic decisions.  
      *   **"Newness" Has Real Consequences:** The donor requirement demonstrates that the classification isn't merely verbal; it has concrete financial and legal implications. Furthermore, presenting SDS externally as a "new school" while internally classifying it as a mere rebranding for governance purposes creates inconsistency.  
      *   **DSI Precedent:** Relying on the minimal DSI structure to claim SDS isn't "new" undermines the integrity of the review process. If DSI qualifies, virtually any future administrative label could be used to circumvent substantive review.  

  **4. Recommendation: Conditional Approval via Split Decision**  
  Neither the pure "light track" nor the mandatory "full review" for the *entire* proposal adequately addresses the complexity. The core CQSS elements suggest continuity, while the *additions* represent significant novelty requiring scrutiny. Therefore, I recommend a **split decision with conditional approval**:  

  1.  **Approve CQSS-to-SDS Transition under Light Track (Rebranding) IMMEDIATELY:**  
      *   **Rationale:** The continuity of existing CQSS staff, space, and core functions justifies treating the core transition as a rebranding/internal reorganisation. This allows the SDS identity and initial operations to proceed.
      *   **Condition:** This approval explicitly **excludes authorization** for the *new* elements: the undergraduate degree program, the SDS Deanship, and the four new tenure lines. These require separate approval.

  2.  **Require Full External Review for the Substantively New Elements:**  
      *   **Scope:** The review must specifically evaluate the proposed **undergraduate degree program**, the necessity and structure of the **SDS Deanship**, and the rationale and impact of the **four new tenure-track lines**.  
      *   **Timeline:** The Dean must submit a full proposal for these new elements to the Committee within [e.g., 60 days]. The standard full external review process (including external reviewers) would then commence, targeting approval (if granted) for implementation starting in Academic Year [e.g., 2025/26]. This aligns with the phased hiring plan.  
      *   **Donor Clarification:** The Dean must immediately clarify with the donor whether this split approach (approving the "SDS" entity now via light track, but requiring review for its *new* components) satisfies the requirement for establishing a "new school" to secure the gift. The Committee needs this confirmation before finalizing the light-track approval for the transition.

  **5. Why This Approach?**  

  *   **Acknowledges Continuity & Enables Progress:** It respects the significant existing foundation of CQSS and allows the SDS to launch its core mission promptly under the new identity.  
  *   **Ensures Necessary Scrutiny:** It subjects the genuinely novel, resource-intensive, and strategically significant additions (degree, leadership, faculty) to the rigorous external review mandated by the Handbook for substantively new commitments.  
  *   **Addresses "Newness" Pragmatically:** It separates the question of the unit's *identity* (approved as an evolution) from the *substance of its new capabilities and structure* (requiring review). The donor's requirement hinges on how "establishing a new school" is contractually defined in relation to this phased approach.  
  *   **Avoids Harmful Precedent:** It does not elevate the minimal DSI to the status of an "existing unit" for bypassing review. The review is triggered by the *new elements*, not solely by the creation of SDS *as an entity*.  
  *   **Practical & Timely:** It provides a clear path forward for Monday. The light-track approval for the transition can be granted conditional on the points above. The Dean can initiate work on the proposal for the new elements immediately.

  **6. Proposed Committee Action for Monday**  

  1.  **Move** to approve the transition of the Centre for Quantitative Social Science (CQSS) into the School of Data and Society (SDS) under the light-track process (Handbook Section [X]), recognizing it as a rebranding/internal reorganisation of the existing core unit.  
  2.  **Stipulate** that this approval **does not authorize**:  
      *   The launch of the proposed SDS undergraduate degree program.  
      *   The establishment or filling of the SDS Dean position.  
      *   The creation or hiring for the four proposed new tenure-track lines.  
  3.  **Require** the Dean of Social Sciences to submit a full proposal for the undergraduate degree program, SDS Deanship, and new tenure lines to the Academic Planning Committee within 60 days (by December 26, 2023) to initiate the full external review process as required for substantively new academic commitments.  
  4.  **Require** the Dean to provide written confirmation from the donor, by December 1, 2023, confirming that the conditional light-track approval of the SDS entity (pending review of new elements) satisfies the requirement for establishing a "new school of data and society" to secure the pledged gift.  
  5.  **Note** that the existing Data Science Initiative (DSI) does not constitute an established academic unit for the purposes of bypassing substantive review requirements under the Handbook.

  This approach balances the need for timely action with the imperative of rigorous oversight for significant new academic and structural commitments, ensuring responsible governance while enabling the development of the SDS vision.
