  I need to provide a thoughtful analysis in continuous prose, avoiding academic formatting. The response should define the phenomenon, distinguish it from neighboring concepts, address all their specific questions about edge cases, and finally tackle the ethical dimension they're worried about.

  This phenomenon seems distinct because of the audience's dual awareness - they cognitively know the scene is invented but viscerally accept it as representative. The invented scene acts as a cognitive shortcut that overwrites less vivid historical facts. The key differentiators are: 1) conscious fictionality acknowledged by audience, 2) condensation of abstract truths into concrete scenes, 3) emotional resonance overriding factual knowledge.

  For the edge cases: when real people self-mythologize, the film amplifies rather than replaces; composite characters function similarly by embodying patterns; fictional novels can achieve the same effect through vivid prose; popular history anecdotes operate identically if they provide that visceral hook. The medium isn't essential - it's about the vivid representation becoming the mental template.

  Ethically, this goes beyond misrepresentation because the audience knowingly participates in the substitution. It's more like licensed identity appropriation - we rent the historical person's name to endorse our fiction. Even flattering distortions are problematic because they reduce complex humans to simplified icons, stealing their authentic contradictions.

  The core of this phenomenon is the creation of durable mental templates that persist despite conscious rejection of their factuality. I'll call this "representational displacement" - where a consciously fictional representation becomes the default mental model for understanding historical reality. The term needs to capture both the cognitive displacement and the paradoxical awareness of its fictionality.

  The ethical wrong isn't exactly usurpation (which implies complete replacement) but rather a kind of symbolic hijacking - we use historical figures as vessels for our narratives. Correction requires restoring complexity, not just facts - showing why the richer, messier truth matters more than the satisfying fiction.
answer: |-
  Your preoccupation names a distinct phenomenon, one that slips between the cracks of existing terminology. Let us carve it carefully.

  What you describe is the **representational displacement of historical consciousness**. It occurs when a consciously acknowledged fictional representation—created to distill or symbolize some "structural truth"—becomes the dominant cognitive and emotional template through which an individual, event, or period is subsequently understood and judged, actively overriding or sidelining known factual realities in the individual's mental landscape. The core mechanics involve the potent combination of narrative condensation, emotional resonance, and vivid sensory immediacy (especially audiovisual) creating a cognitive shortcut so strong that it effectively overwrites the less accessible, less emotionally charged historical record, even while the individual intellectually affirms the fiction's invented nature.

  Its edges require defining against neighbors:

  1.  **Against Prosthetic Memory:** Prosthetic memory involves *adding* new, emotionally resonant memories (of events not personally experienced) to one's internal repertoire. It is accretive. Your phenomenon is *substitutive* and *governing*. The invented scene doesn't just add a memory; it becomes the primary lens, the controlling image that actively shapes judgment ("that is how it really was" in the evaluative sense, not the factual). It displaces the factual basis as the operative mental model.
  2.  **Against Misinformation Effects:** Classic misinformation (e.g., the continued influence effect) relies on initial belief in false information, followed by a failed retraction. Here, the audience *never* believes the specific scene is factually true. They accept the correction *about the scene's literal occurrence* but reject its implications for their understanding of the *essence* of the person or event. The fiction's symbolic truth claims immunity from factual falsification.
  3.  **Against Dramatic Licence:** This is the *tool*, the artistic justification. Representational displacement is the potent, often unintended, *consequence* of that tool's employment within a powerful medium.
  4.  **Against Ordinary Falsehood:** The audience's conscious awareness of the fiction is paramount. They are not factually deceived about the scene's invention. The displacement happens at a deeper level of understanding and emotional association. An ordinary falsehood, once discovered, typically loses its power; this persists *because* of its acknowledged symbolic value.

  Now, to your specific queries:

  *   **Audience Awareness Matters Crucially:** This is the defining feature. The phenomenon requires the audience to *know* the element is invented while simultaneously allowing it to become the governing mental image and evaluative standard. This paradoxical acceptance ("yes, but that is how it really was") separates it from deception-based falsehoods.
  *   **Real Person Mythologising First:** This is transmission and amplification, not pure substitution. The film leverages and concretizes an existing self-created myth. The displacement effect can still occur (the film's vivid image becomes the dominant version of *that myth*), but the origin lies partly with the subject. The ethical weight shifts; the film is complicit in propagating a fiction the subject authored, rather than imposing one wholly alien.
  *   **Composite Characters:** This is the *same phenomenon applied to a type rather than an individual.* The composite becomes the governing image of "the resistance fighter," "the factory worker," or "the courtier," displacing the messier reality of diverse individuals within that role. The audience knows the character isn't one real person, but accepts the composite *as* the representative truth of the group or role.
  *   **Fictional Novels about Real People:** Yes, they *can* achieve the same effect. The key is vividness and emotional resonance creating a durable mental template. A powerfully rendered scene in a novel can become the "truth" of a character or moment just as a film scene can, despite the reader knowing it's fiction. Audiovisual media possess inherent advantages in sensory immediacy, but potent prose can be equally effective at creating indelible mental images and emotional associations.
  *   **Vivid Anecdotes in Popular History:** Absolutely. This phenomenon is *not* unique to film. Any vivid narrative representation – an evocative anecdote in a pop history book, a memorable illustration, a gripping podcast segment – can trigger representational displacement if it offers a compelling, emotionally resonant condensation that overrides thinner, more complex factual accounts *even when the audience is aware of its questionable provenance or invented nature.* The medium is an amplifier, not the sole cause; the core mechanism is cognitive and emotional.

  You have not conflated three things. The core phenomenon – acknowledged fiction becoming the governing mental model – holds across these variations. The differences (individual vs. composite, film vs. prose, self-myth vs. external invention) are variations in subject or vector, not in the fundamental displacement effect on historical consciousness.

  **The Ethical Complaint: Usurpation, Not Mere Misrepresentation**

  The wrong done to the "real dead" is deeper than factual misrepresentation. Misrepresentation implies the audience is deceived. Here, they are not. The displacement occurs with their conscious, albeit perhaps reluctant, participation. It is closer to **symbolic usurpation** or **cognitive appropriation**.

  The fiction doesn't just lie *about* the person; it *uses* their name, their historical weight, their legacy, as a vessel for an idea the creators wish to convey. The real individual's complex, ambiguous, perhaps inconvenient reality is pushed aside, and their identity is commandeered to endorse a narrative they had no part in creating. Their name becomes a trademark slapped onto a product they didn't make. Even if the invented scene aims to capture a "structural truth," it inevitably simplifies and distorts the actual human being who lived through specific, unrepeatable circumstances. It steals their particularity to serve a general point.

  The correction owed is not merely factual (though that remains necessary groundwork). It is the restoration of *complexity* and *particularity*. It requires demonstrating why the richer, messier, less dramatically satisfying truth offers a more profound, more human, and ultimately more *respectful* understanding than the potent fiction. The correction is owed to the integrity of the historical record, to the memory of the individual whose life is being appropriated, and to the audience's capacity for nuanced understanding. The dead cannot be libeled in law, but their legacy can be impoverished by being reduced to a fictional trope.

  Does a flattering image negate the complaint? Only partially, and dangerously so. While a flattering distortion may seem less harmful than a damning one, it still commits the wrong of usurpation and reduction. It replaces the real person with a simplified, idealized icon. It robs them of their authentic struggles, flaws, and contradictions – the very things that make them fully human and historically interesting. A saintly fiction is still a fiction that obscures the real human being. Furthermore, flattering fictions often serve contemporary agendas just as much as negative ones, projecting modern virtues onto the past. The complaint remains: the real person, in their irreducible complexity, has been displaced by a pleasing forgery wearing their name.

  **In essence, representational displacement is the triumph of potent narrative symbolism over acknowledged historical fact in the theater of collective memory.** It leverages our cognitive biases towards vividness, emotional resonance, and satisfying narrative arcs. While sometimes born of good intentions (condensing complex truths), its effect is to simplify and appropriate the past, renting the identities of the dead for stories they didn't author, leaving their authentic complexities obscured by the very fictions we admit are not real, yet cannot help but see as the truth. The carving reveals not just a name, but a profound tension between our need for story and our duty to the dead.
