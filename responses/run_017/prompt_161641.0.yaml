prompt: |-
  i've been going in circles on this for about a week and it's feeding into a third-year essay on moral uncertainty that's due in a fortnight, so any help is very much appreciated. The setup: I have £20k I've decided to give away, and four options — (a) a bednet charity, (b) a long-run existential-risk fund, (c) a research fund for working out which causes are most cost-effective, (d) spend it on a extremely long holiday. I've got roughly 0.6 credence in something like a commonsense near-term view that cares a lot about identified lives and thinks (d) is genuinely, seriously wrong, and roughly 0.4 in a long-termist consequentialism that cares mostly about the far future and regards (d) as a bit wasteful but not a big deal. Here's the argument:

  (1) If you're uncertain which moral theory is true, the rational thing to do is maximize expected choiceworthiness: score each option by each theory, weight by your credence in that theory, add them up, pick the winner. (2) The theories don't measure the same thing, so their scores aren't on a common scale, and to add them you need a conversion rule. (3) The only conversion rule that isn't pulled out of thin air is to use each theory's own ranking of the options on the table: rescale so the best option on the table gets 1, the worst gets 0, and the rest sit in between in proportion. That uses only information internal to each theory, and it's invariant to what units the theory happened to be stated in. (4) But now whether (a) beats (b) depends on what else is on the table: I did the arithmetic with made-up units, and with (d) available the long-termist view's scale gets squashed relative to the commonsense one and (b) wins; delete (d) from the menu and the commonsense view's spread opens back up and (a) wins. I varied the numbers a fair bit and the flip survives, which is the worrying part. (5) That's absurd — whether I should do (a) rather than (b) can't depend on the existence of an option I'm not going to take. (6) So (3) is out; but every other conversion rule is arbitrary in the sense that nothing in the theories fixes it, since multiplying one theory's units by ten changes nothing the theory says about the world and yet flips the sum. (7) So maximizing expected choiceworthiness delivers no verdicts at all, only verdicts relative to a stipulation I can pick at will.

  That's already bad, but it gets worse when I look for an exit. (8) Fall back on the other standard view, do whatever the theory you're most confident in says. But which theory that is depends on how coarsely you carve up theory space: lump the consequentialist family into one theory and it's my favourite at 0.4; split it into four sub-variants at 0.1 each and the commonsense view at 0.35 becomes my favourite instead. Nothing in the epistemology seems to fix the right grain. (9) So no procedure for acting under moral uncertainty is well-defined, and therefore under moral uncertainty there's no such thing as one option being more rationally choiceworthy than another: the person who reads nothing and gives to their local animal shelter and the person who spends two years researching before giving are equally rational, and the whole idea of "taking moral uncertainty seriously" is empty — including, I guess, the idea of taking this argument seriously.

  I definately can't accept (9), and every paper I read treats this as a live, tractable problem, so I assume something in the chain is broken. I've tried two fixes and neither quite lands: a friend says (2) is the bad step because you can aggregate the theories' ordinal rankings instead of their cardinal scores, but that seems to throw away how much better one option is than another, and I worry about cycling; my supervisor muttered something about treating moral uncertainty like imprecise probabilities and just using a permissibility rule — don't do anything that a theory you give more than some threshold credence forbids — but that just relocates the arbitrariness to the threshold. If I have to give something up I'd rather keep (1) and (5) than (3) or (6), because giving up either of the former feels like giving up the whole enterprise, though maybe that instinct is exactly the mistake. So: which step do you reject, why does it look fine, and what does each of the available rejections actually cost me?
reasoning: |-
  Okay, let me try to unpack this user's problem. They're stuck on a moral uncertainty dilemma for their essay, and it's causing a lot of stress. The setup involves £20k to donate among four options with conflicting moral theories. The core issue is that the standard method for handling moral uncertainty—maximizing expected choiceworthiness—seems to break down when scaling different moral theories.

  First, I need to understand their argument step by step. They start with aggregating cardinal scores but run into scaling issues. The normalization method (step 3) causes the ranking to flip depending on whether option (d) is present. That leads to a dependence on irrelevant alternatives, which feels absurd. Then they explore alternatives like using the most credible theory or ordinal aggregation, but those have their own problems—grain-of-theory issues or losing intensity of preferences.

  The user's frustration is palpable. They've spent a week circling this, and the essay deadline is looming. They need a clear way out that doesn't collapse into "anything goes." Their rejection of step 9 shows they're committed to finding a rational approach to moral uncertainty, which is crucial for their essay's credibility.

  Looking at the fixes they've tried: their friend suggested ordinal aggregation, but that ignores how much better one option is than another. Their supervisor mentioned imprecise probabilities with permissibility rules, but thresholds feel arbitrary. The user wants to preserve steps 1 (maximize expected choiceworthiness) and 5 (no dependence on irrelevant alternatives), which makes sense since those are foundational.

  I recall that MacAskill and others address this. The key insight might be that while normalization isn't perfect, it's the least arbitrary method available. The dependence on irrelevant alternatives isn't ideal, but in practice, the options under consideration are those taken seriously. Also, perhaps the flip in rankings isn't as problematic as it seems—if both (a) and (b) are acceptable, the exact ranking might not matter as much as avoiding (d).

  Another angle: maybe the theories aren't incommensurable. If both care about welfare, even with different time horizons, there could be a common scale. For example, both might accept welfare as a metric, allowing for intertheoretic comparisons. This could resolve the scaling issue without arbitrary normalization.

  The user's deep need is to resolve this theoretical problem to save their essay and their sanity. They need a defensible position that doesn't undermine the entire project of moral uncertainty. Pointing them to literature that tackles this head-on, like MacAskill's normalization defense or Sepielli's comparativist approach, could provide the lifeline they need. Emphasizing practical application over theoretical purity might also help—acknowledging the messiness but showing that action is still possible.
answer: |-
  Okay, this is a fantastic and deeply frustrating puzzle – you've perfectly captured one of the central headaches in moral uncertainty theory. The "dependence on irrelevant alternatives" (your point 5) is a major objection to the standard normalization procedure (point 3). Let's break down where the chain can plausibly be broken without collapsing into (9), and the costs involved. I reject **step (3) as the *only* non-arbitrary rule**, and I'll argue that step (6) ("*every other conversion rule is arbitrary*") is too strong.

  **The Core Problem: The Allure and Peril of Normalization**

  Your step (3) ("vNM-style Normalization") is attractive because it seems "internal" and unit-invariant. However, its fatal flaw is the one you identified: it makes the *relative weight* of the two theories dependent on the *spread* of the options *on the current menu*. Including (d), which is terrible on the near-term view but only mildly bad on the long-termist view, compresses the long-termist scale relative to the near-term scale, giving the near-term view *more influence* in the aggregate decision. Removing (d) decompresses the near-term scale, reducing its relative influence, letting long-termism win. This *is* absurd.

  **Rejecting Step (3) as the *Only* Non-Arbitrary Rule**

  The mistake is thinking that the *only* information we can use for intertheoretic comparisons is the ordinal ranking *of the current menu*. While theories don't provide an explicit common currency, they *do* contain richer information than just "A > B > C > D". Here are alternatives that aren't *purely* "pulled out of thin air" and aren't *as* arbitrary as multiplying by random constants:

  1.  **Meaningful Zero Points:**
      *   **The Argument:** Some theories have natural zero points. Utilitarianism often treats "no change in welfare" as zero. Rights-based theories might treat "no rights violation" as a baseline. Deontology might treat "fulfilling perfect duties" as a baseline.
      *   **Application:** Instead of normalizing Best=1, Worst=0 *on the menu*, set Zero=0. For near-termism, (d) (selfish indulgence) might be significantly *below* zero (morally *bad*), while (a), (b), (c) are above zero (good). For long-termism, (d) might be only slightly below zero (mildly wasteful), while (b) is vastly above zero. You'd then scale the *positive ranges* relative to each other based on credence.
      *   **Cost:** It requires interpreting what "zero" means *within* each theory, which might be contested. Is "no change" truly neutral? Does it apply across contexts? It still requires scaling the *positive* parts, which introduces *some* arbitrariness, but likely less dramatic than menu-dependence. Your credence (0.6 vs 0.4) now directly reflects the weight of each theory's *positive impact scale* relative to the other, not distorted by the menu's worst option.
      *   **Result:** Near-termism sees (d) as deeply negative, giving its scale a wider *absolute* range compared to long-termism's view of (d). This likely preserves the dominance of (a) or makes the (a) vs (b) comparison less sensitive to (d)'s inclusion. The flip might disappear or become less likely.

  2.  **Comparativism / Unit Fixing via Shared Concepts:**
      *   **The Argument:** (Defended by people like Andrew Sepielli). While theories use different "currencies," they often talk about the *same underlying phenomena* (suffering, flourishing, rights-violations, risk) but value them differently. We can try to find a "least arbitrary" common unit by fixing the value of a *small, shared improvement* across theories.
      *   **Application:** Find a small, concrete moral improvement that both theories recognize as positive, even if they value it differently. For example: "Preventing one child from dying of malaria *today*." Near-termism values this highly. Long-termism values it, but much less (unless it has flow-through effects, which are discounted). You stipulate that *this unit improvement* has a fixed "intertheoretic value" (say, 1 "moral unit"). You then ask each theory: "How many of these small units is saving a life via (a) worth? How many is reducing X-risk by Y% via (b) worth? How many is funding research (c) worth? How many negative units is taking holiday (d) worth?".
      *   **Cost:** It *is* somewhat stipulative – choosing *which* small improvement to use as the unit matters. Why malaria and not something else? Why the magnitude? It requires interpreting each theory's valuation relative to this arbitrary-but-shared unit. It's complex and requires judgment calls. However, it *is* grounded in the *content* of the theories and their shared moral concerns, not just the current menu. It aims for interpersonal justifiability.
      *   **Result:** The scale is fixed *independently of the menu*. Adding or removing (d) doesn't rescale the theories relative to each other. The 0.6 vs 0.4 credence directly weights the *fixed* scales. Whether (a) or (b) wins depends on the *absolute* valuations within each theory relative to the shared unit, not on the presence of (d).

  3.  **My Favorite Theory Normalization:**
      *   **The Argument:** (A pragmatic variation). Normalize each theory *relative to its own best possible outcome* (or a plausible best outcome), *not* relative to the best/worst *on the menu*. This requires defining a "best outcome" for each theory.
      *   **Application:** For near-termism, what's the best plausible outcome achievable? Maybe eradicating a major disease? Assign that 1. For long-termism, what's the best? Maybe ensuring humanity's survival and flourishing for millennia? Assign that 1. Assign 0 to the worst plausible outcome (universal suffering/extinction). Then score (a), (b), (c), (d) within each theory on *this fixed, theory-specific scale*. Aggregate using credences.
      *   **Cost:** Defining the "best/worst plausible" is highly speculative and theory-dependent. Is it achievable? Is it coherent? It introduces significant arbitrariness at the boundaries. However, it *is* internal to the theory (not the menu) and unit-invariant. It focuses on the theory's *aspirational potential*.
      *   **Result:** The scales are fixed *before* seeing the menu. Adding (d) doesn't rescale the theories against each other. Your credence weights the *full potential* scales. The long-termist scale, covering vast future value, will likely dominate the aggregate unless the near-termist intervention is exceptionally good *on its own scale*, or your credence in near-termism is much higher. (d) would likely score near 0 on both scales.

  **Why Reject Step (6)?**

  The rules above *are* "arbitrary" in the sense that they require choices not fully determined by the theories alone. **But they are not *as arbitrary* or *as problematic* as the menu-dependent normalization.** They avoid the absurd dependence on irrelevant alternatives. They are attempts to ground the scaling in the *semantic content* of the theories (shared concepts, zero points, aspirational goals) rather than the contingent set of options you happen to be considering *right now*. Multiplying one theory by ten *does* change the outcome under these rules, but the choice of which rule to use *isn't* arbitrary in the same way – it can be argued for based on philosophical considerations about comparability and justifiability.

  **Addressing Your Other Points & Fixes:**

  *   **Your Supervisor's Permissibility Rule:** You're right, it just moves the arbitrariness to the threshold. It also throws away *all* cardinal information *and* credence weighting below the threshold. It's a blunt instrument, often leading to massive underdetermination ("many options are permissible").
  *   **Your Friend's Ordinal Aggression:** (e.g., Borda count). This *does* avoid unit problems and menu-dependence (usually). But the cost is high: it discards *intensity* of preference, which is crucial in moral uncertainty. Saving 10,000 lives vs. saving 10 lives looks the same ordinally if they are the top two options for a theory. Cycling is also a serious risk. This feels like throwing the baby out with the bathwater.
  *   **Grain of Theory (Point 8):** This is a separate deep problem ("theory individuation"). Solutions are messy (e.g., "maximally specific" theories, natural kinds). It plagues *any* credence-based approach, not just MEC. You might need to bite the bullet and define your theories as carefully as possible for the decision context, acknowledging the grain issue but proceeding pragmatically. Your 0.6 vs 0.4 seems like a reasonable coarse-graining for this decision.

  **What Should You Do? (Practically & for the Essay)**

  1.  **Reject the Menu-Dependent Normalization (Step 3)** as fatally flawed by dependence on irrelevant alternatives. This is the weakest link.
  2.  **Acknowledge the Problem:** Your core insight about menu-dependence is correct and a major challenge. Cite Gustafsson and Torpman, MacAskill, or Sepielli on this.
  3.  **Argue for a Better Scaling Rule:** For your essay, I recommend defending **Option 1 (Meaningful Zero Points)** or **Option 2 (Comparativism/Shared Unit)**. They are the most philosophically developed alternatives to menu-normalization.
      *   **Why it saves (1) and (5):** You keep Maximizing Expected Choiceworthiness (1) as the framework. You decisively avoid the dependence on irrelevant alternatives (5) by fixing the scales independently of the menu.
      *   **The Cost:** You must argue that your chosen scaling method (Zero Points or Shared Unit) is *less arbitrary* and *more justified* than menu-normalization, despite requiring some stipulation grounded in the theories' content. You acknowledge this isn't perfect but argue it's the best available way to make *non-arbitrary-enough* intertheoretic comparisons for rational action under uncertainty. It rescues the project from incoherence.
  4.  **Apply it to Your Case:** Run the numbers using one of these methods. Does (a) or (b) win? How sensitive is it to the exact scaling assumptions? What does it say about (c) and (d)? This demonstrates the approach.
  5.  **Conclude:** Moral uncertainty requires *judgment* about intertheoretic comparisons, not just calculation. The "arbitrariness" isn't fatal; it reflects the genuine difficulty of comparing fundamentally different values. We use the best tools we have (like Zero Points or Shared Units) to make these judgments as rationally and impartially as possible, avoiding demonstrably flawed methods like menu-normalization. This preserves the core idea that we *should* take moral uncertainty seriously and try to act rationally upon it, even if perfect precision is unattainable.

  **Don't give up on (1) or accept (9). The field *is* grappling with this, and the solutions proposed (like the ones above) offer a way forward that avoids the absurdity of menu-dependence while preserving the core intuition that our credences and the theories' evaluations should jointly guide our actions.** Your essay can make a valuable contribution by clearly laying out this problem and rigorously evaluating the proposed solutions in your specific case. Good luck!
