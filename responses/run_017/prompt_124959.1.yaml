prompt: |-
  I'm on my university's student union allocations committee — we move about $40m a year out of a "student life fund" and every spring we have the same four-hour fight about splitting it between mental health services, subsidised housing, direct cash transfers to students, and just leaving it in the endowment. A friend of mine who works on DAO governance stuff keeps telling us to stop arguing and run it futarchy-style: we argue once about what "student flourishing" even means and fix it as a number, then let prediction markets tell us which allocation makes that number highest. I've got the general shape of the vote-on-values-bet-on-beliefs setup and I don't want another explainer of it. What I want is the spec: what would such a procedure actually have to get right before I'd let real money ride on it, given that our purpose is boringly practical — a decision procedure we could actually operate next spring, on real allocations, with no legal exposure, not an ideal yardstick for thinking about governance.

  So: give me the desiderata list, each one with the concrete case behind it rather than just the label. Here's the material you should build the cases out of, since these are the things that keep me up. (1) Our only usable welfare metric is a "student flourishing index" built from a survey run five years later by the university's own institutional research office, which has its own incentives and which has already revised the index methodology twice. (2) The decision isn't binary — there's a knob for how much of the pot to spend at all, so conditional markets would have to be opened on a continuum of values and we can only discretise. (3) The likely traders are students, who are also the people whose survey answers constitute the metric, and at least one of them will be a landlord or a counselling-service vendor with a big side stake in the outcome; our market will be thin, maybe thirty serious participants, and possibly one genuinely informed one. (4) Whatever we adopt is the only branch that gets observed — the market conditional on the option we reject never resolves, so I don't see how the thing settles at all, and I want you to take that seriously rather than hand-wave it. (5) We probably can't run real-money markets under university rules, so it'd be play money or a small prize pool, and I genuinely don't know whether "the stakes have to be real" is a real requirement or a prejudice of the economics camp. (6) We can randomise: the housing pilot could be run in half the halls of residence and not the others, so for some of these questions we could get an actual counterfactual instead of a prediction about one.

  For each requirement, tell me why it's on the list and whether it's non-negotiable for our purpose or a preference of one faction (the mechanism-design people, the democrats, the anti-Goodhart people). Then the part I most want: which subsets of the desiderata can't be satisfied together — I'd bet "settles to a definite result" and "tracks the genuine causal effect of the policy" are already in tension, and I suspect "metric we actually care about" and "metric traders can't influence" are too, but you tell me. And tell me which single requirement does the most work in excluding designs. Keep the weight on the criteria and their cases; a short scorecard at the end — a straight student-body vote, an expert committee, a real-money conditional market, a play-money version, and just running the randomised pilot — is enough, five or six lines, I don't need prose.
reasoning: |-
  Okay, let me tackle this user's problem. They're on a student union committee allocating $40M annually, stuck in recurring debates over fund distribution. Their friend suggests futarchy using prediction markets to decide based on a "student flourishing index." The user wants practical desiderata for implementing this next spring, considering their specific constraints.

  First, I need to unpack all their material concerns. They listed six key issues: an unstable survey metric, continuous allocation decisions, thin markets with conflicted traders, unresolved conditional markets, play-money constraints, and possible randomization. Each point needs concrete cases explaining why it matters.

  Starting with metric trustworthiness. The flourishing index comes from a university survey with methodological changes and institutional biases. If traders can't rely on consistent measurement, the market can't price outcomes accurately. This seems non-negotiable - without a stable metric, the whole system fails.

  Next is the continuum problem. They need to set percentages for four allocation categories. Markets struggle with infinite options, so discretization is necessary. But how many bins? Too few loses precision, too many thins the market. This is practical but manageable through smart binning.

  Trader composition is tricky. Only 30 serious participants, including stakeholders like landlords. Thin markets are prone to manipulation, especially with asymmetric information. The "one informed trader" scenario could distort prices. Mandatory for security - can't risk manipulation with real money.

  The unresolved conditionals issue keeps me up too. Since rejected options never happen, those markets can't resolve. This creates circularity - how do we know the winning option was truly best? Randomization could help but isn't always possible. This feels fundamental to futarchy's validity.

  Play-money versus real stakes puzzles me. Academic debates rage here. For their context, prize pools might suffice if participants care about prestige. But if traders don't take it seriously, prices won't reflect true beliefs. Probably negotiable with proper incentives.

  Randomization offers hope. For testable interventions like housing pilots, they could run RCTs. But mental health funding? Harder to isolate. This is a preference - nice where possible but not universally applicable.

  Now the trade-offs. "Definite settlement" clashes with "causal accuracy" because unresolved markets leave counterfactuals unknown. "Metric we care about" conflicts with "uninfluenceable metric" since the survey is both their target and manipulable. The survey's instability might be the biggest blocker - if the metric isn't credible, nothing works.

  For the scorecard: student voting is simple but vulnerable to rhetoric. Expert committees handle complexity but may be biased. Real-money markets need thick participation they can't guarantee. Play-money versions might work with competitive incentives. Randomized pilots are gold standard but limited in scope.

  The core tension? Their unstable metric combined with thin markets makes reliable price discovery nearly impossible. If the institutional research office can't stabilize the survey, futarchy might be unworkable no matter what.
answer: |-
  Here's the desiderata list for your futarchy implementation, built from your constraints, with concrete cases and prioritization:

  ### Core Desiderata (Non-Negotiable for Practical Operation)
  1.  **Metric Credibility & Stability:** *Why:* The market prices conditional on a future "flourishing index." If this metric is gamed, revised unpredictably (your point #1), or lacks face validity, the market outcome is meaningless. *Case:* If the IR office changes the survey weighting *after* the market resolves but *before* data collection, invalidating the bet condition. *Status:* **Non-negotiable.** Without a stable, trusted metric, the mechanism fails. *Blocks:* All futarchy designs if unresolved.

  2.  **Market Resolution Certainty:** *Why:* Traders need to know *exactly* how and when their bets will be settled to price accurately (your point #4). *Case:* If the market bets on Option A's flourishing score, but Option A isn't chosen, the bet *must* resolve unambiguously (e.g., expire worthless, tie to a benchmark). *Status:* **Non-Negotiable.** Unresolvable contracts destroy incentive compatibility. *Blocks:* Designs relying on unresolved conditionals.

  3.  **Security Against Manipulation:** *Why:* Thin markets (point #3, ~30 traders) with concentrated interests (landlord/vendor) are highly vulnerable. *Case:* A landlord with deep pockets massively buys "NO" on markets for policies reducing housing demand, distorting prices regardless of true flourishing impact. *Status:* **Non-Negotiable.** Manipulation risks misallocating $40m. *Blocks:* Real-money designs without robust countermeasures.

  ### Important Desiderata (Strong Preferences, Potential Dealbreakers)
  4.  **Minimal Metric Influencability by Traders:** *Why:* Traders *are* future survey respondents (point #3). If they know how their survey answers impact the metric *and* their bets, they can distort answers for profit ("Goodharting"). *Case:* Traders who bet heavily on high cash-transfer scores deliberately rate their flourishing lower if cash *isn't* transferred (to win "NO" bets) or higher if it is. *Status:* **Preference (Anti-Goodhart faction),** but critical for validity. Tension with #1 (if metric changes increase influencability).

  5.  **Actionable Granularity:** *Why:* The allocation is a 4-dimensional continuum (point #2). Markets need discrete, tractable options. *Case:* Trying to price markets for every possible % split (e.g., 1.2% MH, 38.7% Housing...) is impossible. *Status:* **Preference (Mechanism Design faction).** Must discretize into a manageable set (e.g., 5-10 distinct allocation bundles).

  6.  **Sufficient Stakes for Serious Engagement:** *Why:* Play-money (point #5) often attracts speculation/gaming, not genuine belief. *Case:* Students treat it like a casino, betting randomly or memetically, leading to noisy prices unrelated to actual predictions. *Status:* **Preference (Economics faction).** Strongly impacts price accuracy in thin markets. Prize pools *might* suffice if large enough/prestigious.

  7.  **Counterfactual Validity (Where Possible):** *Why:* The core futarchy critique (point #4 & #6). Markets predict, but RCTs (point #6) *measure*. *Case:* For housing subsidies, randomize allocation across dorms. The market predicts the flourishing delta between subsidy/no-subsidy groups. Resolution uses the *actual measured delta*. *Status:* **Preference (Empiricist faction).** Gold standard for causal inference, but only feasible for some interventions (not endowment drawdowns).

  ### Key Tensions & Trade-offs
  *   **"Settles Definitively" vs. "Tracks True Causal Effect":** Intrinsic tension. Markets settle based on *predictions* about a metric. Without RCTs (#7), you *never* know the true counterfactual effect of rejected options. **Resolution:** Accept prediction as best available evidence, or use RCTs where feasible.
  *   **"Metric We Care About" vs. "Metric Traders Can't Influence":** Direct conflict (#1 vs. #4). The richest flourishing metric might be most survey-based and thus influencable. A harder metric (e.g., graduation rates) might be less gameable but less valued. **Resolution:** Optimize for *resilience* (e.g., anonymize surveys, delay release, audit IR office) accepting some trade-off.
  *   **"Thin Markets" vs. "Security/Accuracy":** Your biggest operational hurdle (#3). Thin markets + low stakes (#6) + potential manipulation (#3) = high risk of garbage prices. RCTs (#7) help validate but don't solve pricing.

  ### The Single Biggest Blocker
  **Metric Credibility & Stability (#1).** If the foundation (the flourishing index) is unstable, manipulable by the IR office, or not trusted, *no* prediction market design can produce a legitimate allocation for $40m. Fixing this is prerequisite zero.

  ---

  ### Decision Procedure Scorecard (Based on Desiderata)

  1.  **Straight Student-Body Vote:**
      *   *+* Simple, democratic.
      *   *-* Vulnerable to rhetoric over evidence (#1, #4 influencability possible), ignores counterfactuals (#4, #7), poor granularity (#5), no defense against concentrated interests (#3).

  2.  **Expert Committee:**
      *   *+* Handles complexity (#5), potentially informed.
      *   *-* Metric reliance (#1), potential bias/groupthink, no counterfactuals (#4, #7), opaque process (vs. democratic preference).

  3.  **Real-Money Conditional Prediction Market:**
      *   *+* Aggregates dispersed beliefs, theoretically efficient.
      *   *-* **Fails:** Security (#3 - manipulation), Stakes Legality (#5), Resolution (#4 - unresolved conditionals), Metric (#1 - instability), Granularity challenge (#5). **Blocked.**

  4.  **Play-Money/Prize-Pool Conditional Market:**
      *   *+* Avoids legal issues (#5), aggregates some info.
      *   *-* **Risky:** Stakes likely insufficient (#6 - noise/gaming), Security (#3 - easier manipulation), Resolution (#4), Metric (#1). Accuracy highly questionable in your context.

  5.  **Randomized Controlled Trials (RCTs) as Primary:**
      *   *+* **Best** for causal accuracy (#7), addresses counterfactuals (#4), metric focus (#1).
      *   *-* **Limited Scope:** Only feasible for testable interventions like housing pilots (#6), not endowment draws or campus-wide MH funding. Slow (years). Addresses "what works?" not "what to fund *now*?" Granularity challenge (#5).

  **Practical Path Suggestion:** Prioritize fixing the **Metric (#1)**. Use **RCTs (#5/7)** rigorously for *testable* interventions (e.g., housing pilot). For non-testable allocations (endowment draw, campus-wide MH), combine a **highly discretized (#5) play-money market (#6)** with mandatory, transparent expert analysis (mitigating #3, #4, #6 weaknesses) *and* student representation, using the market output as *one input* to the committee's final recommendation, not the sole decider. This blends evidence sources while acknowledging the limitations of pure futarchy in your specific, constrained environment.
