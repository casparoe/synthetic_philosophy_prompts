prompt: |-
  I'm a postdoc in philosophy, and in three weeks I have a single sixty-minute slot in a colleague's course on science in public: about thirty second-years, mostly non-majors, a mix of biology and literature students, one whiteboard, no assigned reading and no handout, their attention budget being roughly one board diagram. I've been asked to get across the crane/skyhook contrast and the companion notion of greedy reductionism — Dennett's vocabulary, from Darwin's Dangerous Idea — well enough that the students can apply both to cases they haven't seen. Don't explain the distinction to me; plan how I should explain it.

  What I want, in four parts.

  First, the dependency order, and why. Which ideas have to be in place before either label is introduced at all — I suspect the labels should arrive late, after the class has already felt the difference between an explanation that does lifting work and one that merely relocates the mystery — and, for each pair of adjacent steps, what breaks if I invert them. I'd rather know which dependence is load-bearing than which order is conventional.

  Second, the one example that carries the whole hour, and the constraints that select it. I want a case in which the mechanism is visibly cumulative, in which every individual step is unimpressive, and in which the end product is far more organized than anything that had to be assumed at the start. Tell me what such an example must have, what it must lack, and why the usual candidates fail the brief — I'm thinking of the vertebrate eye, the bacterial flagellum, and a watch found on a heath.

  Third, the misconception map: in the order the misconceptions will actually form, where in the sequence each should be headed off, and which ones I should deliberately let stand until the end because defusing them early would cost more than it saves. My guesses: that skyhook is a polite word for the supernatural and the apparatus is evolution-versus-creationism in costume; that greedy reductionism is a charge against reduction in general, so the moral is to distrust explanations that go small; the mirror-image error, that because greedy reductionism is a fault, any level of description is sacrosanct; that a crane must be a simple machine if it is to do honest work; that if cranes rest on cranes we get a regress, so eventually something has to hang from the sky; that it's random is a way of stopping the explanation; and that emergent is a place where explanation may stop. Add the ones I haven't listed, especially any that my own framing invites.

  Fourth, a check at the end that separates students who can use the contrast from students who have learned two words — ideally something I can put on the board in thirty seconds — together with what a confident but wrong answer to it will look like.

  Two additions I've been tempted to make, and I'd like your verdict on whether they earn their ten minutes and where they'd go. The first is a third category alongside crane and skyhook: the unfinished crane, in which a speaker names a mechanism — self-organization, emergence, a faculty, a drive — and it is genuinely open whether the name is a promissory note for machinery still to be specified or a terminus dressed up as a mechanism. I'd pair it with a test: what does the speaker do when you ask for the next level down? The second is a distinction between a crane's lifting power and its anchorage — the point that a grounded, cumulative process can build structures far more organized than anything that had to be assumed to start it, so that getting more out of less is not by itself evidence of a skyhook. I want this one because my literature students will otherwise take the cumulativeness itself to be the suspicious part.

  Last: tell me what I should openly refuse to attempt in the hour, and say so to the students. Then mark the two or three places where this plan is most likely to fail with this audience. For each, name the observation — a question, a silence, a wrong answer of a particular shape — that would tell me to abandon the sequence on the spot, say what you would do instead, and say why that consideration should outweigh the plan as you have built it.
reasoning: |-
  Hmm, the user is a philosophy postdoc preparing a 60-minute lecture on Dennett's crane/skyhook distinction and greedy reductionism for a mixed science/humanities undergrad class. They want a tightly structured plan with four specific components: dependency order for concepts, a primary example with constraints, misconception handling, and an assessment check. They've also proposed two additions and want to know where they might fail.

  The core challenge here is translating abstract philosophy of science concepts into concrete classroom understanding with severe constraints: no readings, one whiteboard diagram, and students with limited attention spans. The user is clearly experienced - they recognize that labels should come late after students "feel" the distinction, and they're anticipating predictable misconceptions (like conflating skyhooks with supernaturalism).

  For the dependency order, I need to identify the load-bearing sequence. Students must first grasp what makes an explanation satisfying before seeing unsatisfying ones. The key steps are: (1) establish what explanations do (answer "how possibly?"), (2) demonstrate incomplete explanations (mystery-relocating), (3) contrast with stepwise mechanisms, (4) only then name crane/skyhook, (5) introduce reductionism levels, and finally (6) define greedy reductionism. Inverting steps would cause collapse - naming skyhooks before seeing examples would trigger creationism associations prematurely.

  The example selection is critical. The vertebrate eye fails because its complexity obscures incremental steps. Paley's watch is worse - it's designed, not evolved. Bacterial flagella are politicized. Instead, I suggest termite mounds: each mudball placement is trivial, the collective outcome (air-conditioned architecture) is astonishing, and no single termite has a blueprint. It visually demonstrates "more from less" without triggering design debates.

  For misconceptions, the most dangerous are: (1) "skyhook = supernatural" (which I'll preempt by using secular examples like "elan vital"), (2) "greedy reductionism condemns all reductionism" (clarify it's about denying higher-level usefulness), and (3) "cranes require simple parts" (emphasize that complex systems can emerge from simple rules). Some misconceptions like "randomness stops explanation" can wait until Q&A.

  The assessment check should be a 2x2 matrix: "Solves problem? (yes/no)" vs. "Explains how? (yes/no)". A skyhook answers "how?" with "magic", a crane shows the stepwise process. A wrong but confident answer would misclassify - e.g., calling natural selection a skyhook because it's "random".

  Of their proposed additions: "unfinished cranes" (terms like "emergence") is worth including with a "name-and-demand" test ("what happens when you press for mechanism?"). The "anchorage vs lifting power" distinction is crucial for literature students who might mistake cumulation for suspicion - I'll attach it to the termite example.

  I must explicitly refuse: historical debates (Darwin vs. Paley), molecular biology examples (flagellum), and defining "reductionism" broadly. Failure points include: if students fixate on "randomness" during the termite demo (abort to crystal growth example), or if they conflate levels/greediness (use a tangible analogy like explaining cake at ingredient vs recipe levels). These pivots preserve the core concepts when the planned sequence frays.

  The user's deep concern about humanities students misreading cumulation suggests they've taught this before and hit this snag. Their proposed "anchorage" point is perceptive - I'll reinforce that by showing termite mounds require no intelligent mud, just physics. Overall, the session must feel like discovering a toolkit, not learning philosophical jargon.
answer: |-
  Below is a meticulously structured plan for your 60-minute session, designed for maximum conceptual retention with minimal scaffolding. It prioritizes **felt understanding** before labeling, leverages a single high-yield example, preempts critical misconceptions, and includes a diagnostic check. The two additions you propose are integrated where they deliver highest value.

  ---

  ### **Part 1: Dependency Order & Why**  
  *Load-bearing dependencies (invert at peril):*  
  1. **Start with "What makes an explanation satisfying?"**  
     - *Why first:* Students must viscerally recognize that explanations resolve "how?" not just "what." Use a quick poll: *"If I tell you ghosts built the pyramids, does that explain anything?"* → Consensus: No, it *relocates* the mystery.  
     - *Break if inverted:* Labels without this intuition feel arbitrary.  

  2. **Contrast two candidate explanations for a phenomenon**  
     - *Why next:* Juxtapose a mystery-relocator vs. a stepwise mechanism using your core example (termite mound, see Part 2). *Do not name crane/skyhook yet.*  
     - *Break if inverted:* Premature labels trigger preconceptions (e.g., "skyhook = God").  

  3. **Identify the "lifting work" in the stepwise explanation**  
     - *Why next:* Isolate *how* small, unimpressive steps cumulatively build complexity. Ask: *"Where does the ‘intelligence’ in the mound come from? Did we assume it upfront?"*  
     - *Break if inverted:* Without seeing the work, "crane" seems empty.  

  4. **Introduce "skyhook" and "crane" as descriptive labels**  
     - *Why last:* Now students can self-define: Skyhooks *evade* lifting work; cranes *do* it.  
     - *Break if inverted:* Labels become cargo-culted jargon.  

  5. **Define reductionism neutrally**  
     - *Why here:* *After* cranes are grasped, reduce = "explain wholes by parts."  
     - *Break if inverted:* "Greedy reductionism" will be misread as anti-reductionism.  

  6. **Introduce "greedy reductionism"**  
     - *Why last:* Frame as "denying *other* cranes exist" (e.g., insisting psychology is *only* atoms, ignoring cognitive mechanisms).  
     - *Break if inverted:* Confused with healthy reductionism.  

  ---

  ### **Part 2: The One Example**  
  **Chosen Example: Termite mound construction**  
  *Constraints met:*  
  - **Visibly cumulative:** Each termite follows simple rules (e.g., "drop mudball where pheromones are strong").  
  - **Unimpressive steps:** Single termite = clueless; colony = architect.  
  - **Output > input:** Mound has temperature regulation, ventilation—no "smart termite" assumed.  
  - **Avoids pitfalls:**  
    - *Vertebrate eye:* Steps are invisible (molecular).  
    - *Bacterial flagellum:* Politicized, requires prior bio knowledge.  
    - *Watch on heath:* Invokes design (skyhook by default).  
  *Whiteboard sketch:*  
  1. Single termite + mudball → random pile.  
  2. Pheromone gradients → pillars form.  
  3. Emergent structure → functional mound.  

  ---

  ### **Part 3: Misconception Map**  
  *Order of emergence, prevention, and deliberate delays:*  
  1. **"Skyhook = supernatural"**  
     - *Preempt early:* Use "elan vital" (life force) for termite intelligence as a *secular* skyhook.  
  2. **"Greedy reductionism = all reductionism bad"**  
     - *Preempt at step 5:* Contrast "explain cells with chemistry" (good) vs. "consciousness is *only* quarks" (greedy).  
  3. **"Cranes must be simple"**  
     - *Preempt with example:* Termite rules *are* simple, but the mound isn’t.  
  4. **"Crane-regress requires a skyhook"**  
     - *Let stand until end:* Resolve via "anchored cranes" (Part 5).  
  5. **"Random = no explanation"**  
     - *Let stand:* Address in Q&A with "random *variation* + non-random *selection* = crane."  
  6. **"Emergent = stop explaining"**  
     - *Preempt via "unfinished crane"* (Part 5): "Emergent" isn’t magic—it’s a placeholder for mechanisms.  
  *Your additions:*  
  - "But cumulation is suspicious!" → Anchorage distinction (Part 5).  
  - "‘Emergence’ is a skyhook!" → Unfinished crane test (Part 5).  

  ---

  ### **Part 4: Diagnostic Check**  
  **30-second whiteboard task:**  
  ```  
  PHENOMENON: Bird flock formation  
  Candidate 1: "Birds share a collective mind."  
  Candidate 2: "Each bird adjusts speed/direction to neighbors."  
  ```  
  *Ask:* "Which is crane/skyhook? Is either greedy reductionist?"  
  - **Confident but wrong:**  
    - "Candidate 1 is a crane (it’s ‘collective’!)" → Misses that "collective mind" does no work.  
    - "Candidate 2 is greedy (it reduces to birds!)" → Fails to see it’s multilevel (birds → flock).  
  **Key:** Correct answers spot that Candidate 1 is skyhook (mystery relocated); Candidate 2 is crane; neither is greedy (flock-level is valid).  

  ---

  ### **Part 5: Your Additions (Integrated)**  
  1. **Unfinished Crane**  
     - *Where:* After defining skyhook/crane, before greedy reductionism.  
     - *Verdict: WORTH 3 MIN.* Use "emergence" or "self-organization" in termite example. Ask: *"Is this a crane or skyhook?"* → Test: *"What if I demand the next level down (e.g., chemistry of pheromones)?"* If the speaker deflects → skyhook in disguise.  
  2. **Anchorage vs. Lifting Power**  
     - *Where:* When addressing crane-regress misconception.  
     - *Verdict: CRITICAL, 4 MIN.* Sketch cranes stacked on bedrock (evolution, physics), not hanging from sky. *"Anchorage = prior cranes; lifting = each step adds organization. Termites need no ‘intelligent mud’—just physics!"*  

  ---

  ### **What to Refuse**  
  **Openly declare:**  
  *"We won’t debate evolution vs. creationism, dissect the flagellum, or define ‘reductionism’ in full. Today is about explanation-patterns."*  

  ### **Failure Points & Abort Strategies**  
  1. **Observation:** "But termites *are* guided by instinct!" (Misreads crane as skyhook).  
     - **Abort:** Pivot to **crystal growth**. *"Does ‘crystallization’ explain snowflakes? What if I ask for molecular rules?"* → Instinct/crystallization = unfinished crane.  
     - **Why:** Prevents biology students from fixating on vitalism.  

  2. **Observation:** "So all psychology is just neurons?" (Conflates reductionism/greediness).  
     - **Abort:** Use **software analogy**. *"Microsoft Word isn’t *just* electrons—it needs code-level explanations too. Ignoring that is greedy."*  
     - **Why:** Literature students need tangible hierarchy examples.  

  3. **Observation:** Dead silence after "greedy reductionism."  
     - **Abort:** Drop term. Ask: *"Is ‘love is just hormones’ a *complete* explanation?"* → Consensus: No, it’s reductive *and* dismisses lived experience.  
     - **Why:** "Greedy" is jargony; "dismissive reductionism" often clicks faster.  

  ---

  ### **Summary Flow**  
  1. (5 min) What explains? → Termite mound mystery-relocator vs. stepwise.  
  2. (15 min) Whiteboard termite crane → Lift/anchorage + unfinished crane.  
  3. (10 min) Name crane/skyhook → Bird flock check.  
  4. (15 min) Reductionism → Greediness → Software analogy.  
  5. (10 min) Misconceptions → Diagnostic → Q&A.  
  6. (5 min) Buffer.  

  **Core Insight:** The hour turns on *feeling* the inadequacy of mystery-relocation first. Anchor everything to the termite mound’s unmagical ascent from mud to architecture.
