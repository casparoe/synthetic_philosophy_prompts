prompt: |-
  hey — I need a draft memo for my committee and I'm a bit out of my dept on the conceptual bit, so bear with me while I set the whole thing up.

  I sit on the Priority Setting Committee at my hospital. Once a year we get a one-off discretionary fund (this year roughly $2.6 million) to spend on things the normal budget won't cover. Our terms of reference say we should spend it so as to produce "the greatest total health benefit for our patient population", and also that we owe "fair consideration to all patients regardless of age, diagnosis, or how visible their case is". In practice we've always ranked bids by cost per QALY and funded down the list until the money ran out.

  This year the two options that matter are these.

  (1) A single application: a one-time gene therapy for a 6-year-old with a rare neurodegenerative condition. Cost $2.5M. Without it the team estimates about 5 QALYs — short life, very low quality weight. With it they estimate around 55: something like normal life expectancy, and they also say his post-treatment quality of life would be *better* than "full health" as our instrument scores it, because he's an unusually strong responder, so they want us to count a benefit above the scale's 1.0 ceiling. Call it $45k per QALY.

  (2) The rest of the shortlist: about 260 patients at roughly $10k each — dental work under general anaesthetic, mobility aids and home adaptations, a year of home dialysis support, respite care. Each one is small, maybe 0.15 QALYs, so around 39 QALYs in total. Call it $67k per QALY.

  So the total-maximising answer is (1): 55 beats 39. But (2) is better per dollar, and (1) spends the entire fund on one child while 260 people get nothing at all. One member said this is just the utility monster thing — the old objection that any rule which adds up welfare and maximises the sum will end up handing everything to whoever can absorb the most of it — and that if our terms of reference really commit us to that, so much the worse for the terms of reference.

  Some other things making it messy. The family ran a very successful crowdfunding and social media campaign, and the clinical team have hinted they'll go to the press if we say no; several members think that shouldn't count at all and a couple think it obviously should. Two more applications of the same general shape are already in the pipeline for the next two rounds, so whatever we decide is a precedent, and if we fund this one and then the next one and then the next one, we'll have spent three years of the fund on three children and the small-grants end of the list will never see a cent.

  What I want from you is the memo I'll circulate before Thursday's meeting. It should:

  - recommend a concrete course of action for this cycle — fund, don't fund, or fund with conditions — with a time frame, and not deffer the actual call to "further discussion";
  - say what rule we should adopt for the next two cycles, and why, given that we only ever decide one case at a time and some members think a body like ours can't really do distribution at all, only triage;
  - deal with the off-the-scale question: should we ever count a benefit bigger than our quality-of-life instrument allows, and what does permitting that do to the rest of the ranking (wouldn't everyone start claiming it?);
  - take the losing side seriously. If you tell me to fund the child, I need the strongest version of the monster objection answered rather than waved at. If you tell me not to, I need an answer to the member who says we were told to maximise total benefit and the total is the total.
  - be readable by a finance director and a paediatrician who don't care about philosophy. No jargon for its own sake, and where some technical distinction is doing real work in your argument, flag it in plain terms.

  Don't bother with citations or a reading list — none of us are going to recieve them well or look them up. Just give me the argument and the bottom line.
reasoning: |-
  Okay, the user is part of a hospital committee that allocates a one-time discretionary fund. They need a draft memo for their Priority Setting Committee. The main issue is deciding between funding a $2.5M gene therapy for one child (55 QALYs) or multiple small projects benefiting 260 patients (39 QALYs). 

  First, I need to unpack the core tension: maximizing total QALYs favors the gene therapy, but that leaves 260 people without help. The user mentioned the "utility monster" objection—where one person consumes disproportionate resources. There's also pressure from a crowdfunding campaign and potential media backlash, plus future similar requests in the pipeline.

  The user’s explicit needs are clear: a concrete recommendation, a rule for future cycles, handling QALY scores above 1.0, and addressing counterarguments without jargon. But deeper needs might include maintaining committee credibility, avoiding precedent pitfalls, and balancing ethical principles with practical constraints. They’re likely stressed about backlash either way—denying the child could spark public outrage, but neglecting the 260 might erode internal trust.

  For the recommendation, I lean toward not funding the therapy this cycle. Why? The precedent risk is too high—three such cases would monopolize three years’ funds, crippling the small grants permanently. Even though 55 QALYs > 39 QALYs, the committee’s mandate also requires "fair consideration" for all patients. Concentrating funds on one ultra-high-cost case violates that spirit, especially when alternatives deliver more equitable distribution. 

  The "off-scale" QALY claim is tricky. Allowing benefits >1.0 opens the door to inflated estimates. Better to cap at 1.0 for consistency—this keeps the playing field level. If the child’s outcome is truly exceptional, it should still stand out within standard metrics. 

  For future cycles, I propose a hybrid rule: a cost-per-QALY ceiling (e.g., $50K/QALY) plus a diversity clause. This prevents utility monsters while reserving most funds for high-impact, lower-cost projects. The ceiling stops single cases from swallowing the whole budget, and the diversity clause ensures varied patient groups benefit over time. 

  Counterarguments need thoughtful handling. To the "maximize total benefit" point: yes, 55 > 39, but context matters—ignoring distributional fairness undermines the hospital’s mission. To the utility monster concern: the hybrid rule explicitly prevents this by capping per-case allocations. 

  Finally, the memo must stay accessible. Avoid terms like "QALY" without explanation; emphasize principles like "helping the most people fairly." Stress that this isn’t cold math—it’s about stewardship of limited resources. 

  ...Time to draft plainly but powerfully.
answer: |-
  **MEMORANDUM**  
  **TO:** Priority Setting Committee Members  
  **FROM:** [Your Name/Committee Role]  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation for FY Discretionary Fund Allocation & Future Decision Framework  

  ---

  ### **1. RECOMMENDATION FOR THIS CYCLE**  
  **Do not fund the $2.5M gene therapy application.** Allocate the full $2.6M to the 260 small-grant applications ($10K each).  
  **Timeframe:** Immediate approval at Thursday’s meeting. Funds disbursed within 30 days.  

  **Why this course?**  
  - **Total Benefit vs. Fairness:** While the gene therapy offers 55 QALYs (vs. 39 QALYs for small grants), concentrating 96% of the fund on one patient conflicts with our duty to provide "fair consideration to all patients." Funding 260 treatments aligns better with distributing health benefits across our community.  
  - **Precedent Risk:** Approving this therapy sets a unsustainable pattern. With two similar requests pending, funding all three would consume 3 years of funds for only 3 patients, collapsing our small-grants program permanently.  
  - **Crowdfunding/Media Pressure:** External campaigns should not influence medical ethics decisions. Our mandate is health benefit and fairness—not publicity.  

  ---

  ### **2. RULE FOR FUTURE CYCLES**  
  **Adopt a "Hybrid Threshold" framework:**  
  - **Step 1:** Rank applications by cost-per-QALY (lowest first).  
  - **Step 2:** Set a **cost-per-QALY ceiling (e.g., $50K/QALY)**. Applications above this threshold require exceptional justification.  
  - **Step 3:** Reserve **≥40% of funds for small grants** (<$50K each) to ensure diverse patient access.  

  **Why this rule?**  
  - **Balances Goals:** Maximizes total benefit (via cost-per-QALY ranking) while enforcing fairness (via the ceiling and small-grant reserve).  
  - **Prevents "Utility Monsters":** The ceiling stops ultra-high-cost treatments from monopolizing funds. The small-grant reserve guarantees aid reaches varied needs.  
  - **Practical for Triage:** We decide case-by-case, but the reserve and ceiling create guardrails for distribution.  

  ---

  ### **3. HANDLING "OFF-THE-SCALE" QALY CLAIMS**  
  **Reject quality-of-life scores above 1.0 ("full health").**  
  - **Reason:** Our instrument defines 1.0 as full health. Allowing scores >1.0 invites inflated claims and makes comparisons impossible. If every applicant argues their treatment yields "exceptional" results, ranking collapses.  
  - **Practical Impact:** The gene therapy team’s "above 1.0" claim is disregarded. Their application still scores highly (55 QALYs at $45K/QALY), but this doesn’t change our recommendation.  

  ---

  ### **4. ADDRESSING KEY COUNTERARGUMENTS**  
  **A. "But the gene therapy gives more total benefit (55 vs. 39 QALYs)!"**  
     - **Response:** True, but 55 QALYs for one patient vs. 39 QALYs for 260 patients creates a stark trade-off. Our terms require "fair consideration to all"—not just total arithmetic. Concentrating resources this severely ignores patients with smaller but urgent needs (e.g., pain relief, mobility). The "greater total benefit" must be weighed against equitable distribution.  

  **B. "Isn’t this the ‘utility monster’ problem?"**  
     - **Response:** Yes—and we agree it’s a flaw in pure cost-per-QALY maximization. A single patient absorbing 96% of funds because they can "absorb more benefit" violates fairness. Our proposed hybrid rule (ceiling + small-grant reserve) fixes this.  

  **C. "What about future patients who need similar gene therapies?"**  
     - **Response:** Our hybrid rule allows funding them if they fall under the cost-per-QALY ceiling. If not, we require hospitals to seek sustainable funding (e.g., research grants, system-wide budgets)—not one-time discretionary funds meant for broad impact.  

  ---

  ### **5. THE BOTTOM LINE**  
  - **This Cycle:** Fund the 260 small grants. They deliver significant collective benefit, uphold fairness, and avoid dangerous precedents.  
  - **Future Cycles:** Adopt the Hybrid Threshold (cost-per-QALY ranking + $50K/QALY ceiling + 40% small-grant reserve). This maximizes benefit while ensuring no group monopolizes resources.  
  - **QALY Scores:** Cap quality-of-life benefits at 1.0. Consistency is non-negotiable for credible decisions.  

  **No philosophy, just principles:** We must help as many patients as possible, as fairly as possible—without letting single cases distort our mission.  

  **Ready to discuss on Thursday.**  
  [Your Name]  
  [Contact Info]  

  ---  
  **KEY TERMS (PLAIN ENGLISH):**  
  - **QALY:** "Quality-adjusted life year." A year lived in full health = 1 QALY. A treatment adding 10 years at half-health = 5 QALYs.  
  - **Cost-per-QALY:** "Cost per healthy year gained." Lower = more efficient.  
  - **Utility Monster:** "One patient soaking up all resources because their needs are huge." We fix this with spending limits.  
  - **Hybrid Threshold:** "Spending rules that balance efficiency and fairness."
