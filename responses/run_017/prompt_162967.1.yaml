answer: |-
  Here’s a comprehensive exam package designed to push students beyond the standard "indirect duties via hardening" narrative, incorporating your cases and conceptual framework:

  **Exam Question**  
  *"Kant’s claim that duties regarding animals are merely 'indirect' is typically understood as asserting that both the content of these duties (they concern our treatment of non-patients) and their ground (they derive entirely from duties to persons or self) are indirect. Using the cases of the Hermit (tortures animals in isolation), the Offsetter (cruel to animals but reliably kind to humans with no hardening effect), and the Rational Non-Human (autonomous non-<i>homo sapiens</i>), defend ONE of the following interpretations:  
  (1) Duties to animals are indirect in both content AND ground (the standard hardening view),  
  (2) Duties are indirect in content but DIRECT in ground (grounded in duties to self/expressive reasons), or  
  (3) Duties are DIRECT in both content and ground (animals are ends-in-themselves).  
  Explain how your chosen interpretation handles the moral asymmetry between permissible instrumental use (e.g., farming) and impermissible cruelty (e.g., torture). What theoretical cost does your view impose on a Kantian framework?"*

  ---

  **Model Answer (≈700 words)**  
  *(Defending Route 2: Indirect in Content, Direct in Ground)*  

  Kantians should reject the standard "indirect in ground" reading that reduces animal ethics to spillover effects on human treatment. The cases of the Hermit and Offsetter demonstrate that the hardening argument is empirically contingent and morally inadequate. The Hermit’s animal torture remains reprehensible despite zero impact on human relations, while the Offsetter’s compartmentalized cruelty—even if offset by human beneficence—is corrupt, not commendable. This shows duties regarding animals must have a non-instrumental ground. However, Kant is correct that duties are *indirect in content*: animals lack autonomy, so we owe them nothing *as duty-bearers*. The solution is to ground duties in direct obligations to *ourselves*—specifically, the duty of self-cultivation to avoid moral self-degradation.  

  Cruelty to animals violates our duty to cultivate moral character by endorsing maxims that express vicious attitudes incompatible with a good will. As Kant notes in the *Lectures on Ethics*, cruelty manifests a "heartlessness" that corrupts our practical reason. This is not about future harm to humans (as the Offsetter proves), but about the intrinsic deformity of the maxim itself. Universalizing a maxim of cruelty for amusement would undermine the moral community we are rationally compelled to will. Torture treats sentient beings as mere playthings, fostering a disposition antithetical to respect for rationality itself.  

  The Rational Non-Human case clarifies the ground/content distinction. A rational non-human *would* be a direct object of duty (content) because it possesses autonomy—the sole ground of duty in Kant. Our duty here is direct in both senses. Animals, lacking autonomy, cannot be direct objects. But duties *regarding* them are directly grounded in our obligation to avoid self-corruption. This preserves Kant’s core insight: only rational beings are ends-in-themselves.  

  The asymmetry problem is resolved elegantly. Killing animals for food under conditions of necessity expresses no maxim of contempt; it may be governed by a universalizable maxim of sustainable use. Torture for pleasure, however, flows from a maxim that actively wills suffering for its own sake—a direct assault on our duty to cultivate humanity in ourselves. The difference lies in the *expressive content* of the maxim, not the physical outcome.  

  The cost of this view is a revisionist reading of Kant’s universality tests. Kant typically reserves the CI for interpersonal duties. Grounding duties to animals in self-regarding duties expands the scope of "universalizable maxims" to include those affecting non-rational beings. This strains Kant’s insistence that duties to self are primarily prohibitive (e.g., against suicide), but it coheres with his emphasis on moral self-perfection as a duty.  

  Thus, Kantians should adopt the "indirect content, direct ground" model: avoiding cruelty is a direct duty *to* ourselves, even if it is not a duty *to* animals.  

  ---

  **Marking Scheme (25 points)**  
  *(5 points each; must-hit points with common pitfalls)*  

  1. **Engagement with Cases**: Demonstrates how Hermit/Offsetter destabilize the hardening account AND how Rational Non-Human tests the humanity formulation.  
     *Pitfall:* Treating cases superficially (e.g., "Hermit is irrelevant because Kant only cares about humans").  

  2. **Clarity on Indirectness Distinction**: Correctly distinguishes duties indirect in *content* (object ≠ patient) vs. *ground* (derivative justification), applying it to the chosen route.  
     *Pitfall:* Conflating content/ground or mislabeling the defended position.  

  3. **Defense of Chosen Route**: Substantiates ONE route using Kantian resources (e.g., duties to self, CI procedure, concept of an end-in-itself), not just intuition.  
     *Pitfall:* Assertion without argument (e.g., "direct duties are obvious") or failing to engage Kant’s autonomy requirement.  

  4. **Treatment of Asymmetry**: Explains how their route justifies Kant’s distinction between instrumental use and cruelty.  
     *Pitfall:* Ignoring asymmetry or resorting to non-Kantian reasoning (e.g., "suffering is bad").  

  5. **Cost Assessment**: Identifies a coherent theoretical trade-off (e.g., revising universality tests, diluting "humanity," empirical contingencies).  
     *Pitfall:* Vague handwaving (e.g., "Kant might disagree") or ignoring costs.  

  ---

  **A vs. B Answer Differentiation**  
  An **A answer** (21-25) selects *one* route and mounts a sustained defense, using the cases to pressure rival views while openly grappling with costs (e.g., "This requires expanding duties to self, which Kant restricts..."). It leverages the content/ground distinction to reinterpret "indirect duties" and resolves asymmetry via Kantian concepts (maxims, expression, cultivation). A **B answer** (16-20) accurately compares routes or partially defends one but lacks depth in applying cases, elides the asymmetry challenge, or treats the distinction mechanically without illuminating its implications.  

  ---

  **Model Answer’s Committed Stance & Contested Element**  
  The model answer commits to a **contested reading** by grounding duties to animals *entirely* in duties to self (via cultivation/expression), rejecting both the spillover model *and* direct patienthood. This elevates self-regarding duties beyond Kant’s typical prohibitions, implying that maxims affecting non-rational beings fall under the CI’s scope—a move some scholars (e.g., Korsgaard) reject as unstable without attributing inherent value to sentience. It stakes a claim that Kantian ethics can condemn cruelty *solely* as self-betrayal, even absent harm to others.
