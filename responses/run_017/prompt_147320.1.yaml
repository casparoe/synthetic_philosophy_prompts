prompt: |-
  I work with a small team that rewrites legal and medical documents — consent forms, witness statements, tenancy notices — into plain language and into other languages. Nearly all of our job is deciding which rewrites preserve what the original conveys, and we keep running into a layer of conveyed content that I cannot get a handle on, and for which I have no word.

  Certain words and constructions seem to carry, alongside the main claim the sentence makes, a second thing that the sentence also conveys; and this second thing behaves unlike anything else I know how to handle. Three features, as I have noted them over the past year or so.

  First, it is not what the sentence is about. If a reader wants to push back, they push back against the main claim, not against this. And yet it is clearly conveyed: a writer who uses one of these words and then adds a clause saying "not that I mean to suggest such-and-such" produces something that reads as self-contradictory, not merely as cautious.

  Second, it does not appear to depend on the situation or on what the writer was trying to achieve. I get it from the sentence on its own, in isolation, from any writer, in any context. This is what separates it from the ordinary suggestions that readers draw out of what people say — the suggestions that evaporate when the circumstances change and that the speaker can always withdraw afterwards.

  Third, it survives being wrapped inside other constructions. Negate the sentence, turn it into a question, put it after "if", and the second thing is still there, still apparently being conveyed.

  I have begun sorting the words into two groups, and I am not confident the sorting is real.

  Group A: "regret", "realize", "stop", "again", "too", "still" (as in "still waiting"). Here the second thing looks like a fact that is being treated as already settled between writer and reader. If the reader does not know it, the sentence feels as though it is smuggling something in, and the natural response is "wait — when did that happen?", a challenge about the facts. And when I report such a sentence about someone else ("she said that..."), the second thing can be heard as hers.

  Group B: "but", "although", "nevertheless", "moreover", "even", "unfortunately", "frankly", "allegedly", "so-called", "damn". Here the second thing is not backgrounded at all — it is new. The reader's natural response is not "I didn't know that" but "why are you putting it that way?", a challenge to the framing rather than to the facts. And when I report such a sentence about someone else, the second thing seems to stay with me, the reporter, rather than transferring to her.

  A friend who once took a pragmatics course tells me the whole class is just "conventional implicature"; from what little I have read, that label seems to be used for a narrower set of cases and to be itself contested. Someone else said "presupposition", which strikes me as right for my Group A and wrong for my Group B. A third said it is all simply part of the literal meaning of the words, which cannot be right either, since it is plainly not part of what the sentence states or can be called true or false of.

  What I need is not a label. I need, first, a characterisation: what feature or cluster of features makes these words special, stated so that I could apply it to a word I have not considered. Second, a verdict on my two groups — whether the split is real or whether I have gerrymandered the data, where exactly the boundary runs, which items fall on which side, and whether there are items that fall in between. Third, a set of contrasts: how this differs from the ordinary context-dependent kind of suggested meaning, from the backgrounded kind, and from plain literal content, and how those three neighbours differ from one another. Fourth, if nothing established fits my class as a whole, a name and a definition with boundary cases, phrased so that my team could use it to decide whether a given word belongs. And, since our problem is practical: if the distinction holds up, does it tell us anything about which paraphrases are safe — is there a rule for when a sentence can be rewritten without losing or gaining this second layer?

  Please also tell me plainly if you think I have the data wrong: part of what I am after is which of my three features is the load-bearing one, and which of them I have over-generalised from a few favourite examples.
reasoning: |-
  Okay, I see this user works with a team that rewrites legal and medical documents into plain language and other languages. They're struggling with a layer of conveyed meaning in certain words and constructions that doesn't fit neatly into existing linguistic categories. The user has identified three key features: it's not the main claim but clearly conveyed, it's context-independent, and it survives embedding in other constructions. They've also tentatively grouped words into two categories (A and B) based on how the conveyed content behaves.

  Hmm, this is fascinating. The user has clearly done deep observational work here. Their Group A words ("regret", "still", "again") do behave like classical presupposition triggers - they require background knowledge to be accepted. If someone says "John stopped smoking", it presupposes John smoked before. That fits all three features: it's not the main claim (which is about cessation), context-independent (the presupposition holds regardless of situation), and survives negation ("John didn't stop smoking" still implies he smoked before).

  But Group B is trickier. Words like "but", "frankly", or "damn" convey speaker attitude or logical relationships rather than factual background. When someone says "Frankly, it's terrible", the "frankly" frames the statement as blunt honesty without making that the main claim. And yes, it survives embedding: "If frankly it's terrible..." still carries that framing. This seems more like conventional implicature - non-truth-conditional meaning conventionally attached to specific words.

  The user's friend mentioned conventional implicature, but the user is right that the term is contested and often used narrowly. Potts' work on expressive meaning might be relevant here - he treats words like "damn" as carrying non-cancelable, speaker-oriented attitudes. For Group B, the "why are you putting it that way?" reaction is spot-on; it's about metalinguistic commentary rather than world knowledge.

  The split between Groups A and B seems real and important. Group A is about propositional content (background facts), while Group B is about discursive framing (how content relates to context or speaker stance). Boundary cases might include words like "allegedly" - which presupposes something isn't proven (Group A-like) but also positions the speaker as distancing from the claim (Group B-like).

  For practical rewriting: Group A presuppositions are dangerous to alter because they can covertly introduce or remove factual claims. Changing "stop" to "not continue" might avoid the smoking presupposition, but could sound unnatural. Group B items are more about tone - "but" to "however" might preserve contrast while softening, but "frankly" could be omitted if bluntness isn't desired. The key is recognizing that these aren't just stylistic choices but carry real semantic weight.

  The user's three features are all load-bearing, but feature 3 (embedding survival) is the most reliable diagnostic. If the meaning vanishes in "I wonder if..." or "It's false that..." constructions, it's probably not this layer. Their observation about reporting speech ("she said..." transferring Group A but not Group B) is particularly astute and could be another diagnostic tool.

  For their team, I'd recommend: 1) Always test words with negation/embedding to detect these effects 2) For Group A, ensure paraphrases don't introduce/remove backgrounded facts 3) For Group B, decide whether the framing is essential to the document's purpose (e.g., "allegedly" might be legally crucial) 4) When translating, note that these effects may require different lexical strategies across languages.
answer: |-
  Your observations are remarkably precise, and the distinction you've drawn between Group A and Group B is both real and fundamental to linguistic pragmatics. You haven't overgeneralized; your three features accurately capture core properties of distinct phenomena. Here's a breakdown addressing your needs:

  ### 1. Characterization & Core Feature
  **The unifying feature** is that these words encode **non-truth-conditional, non-cancelable, conventionally encoded meaning**. This means:
  -   They contribute meaning *beyond* the core proposition (what the sentence asserts as true/false).
  -   This meaning is **not part of what the sentence is "about"** in terms of its truth conditions (Feature 1). Changing this layer doesn't make the sentence "false," just infelicitous or framed differently.
  -   It's **hardwired into the word/phrase itself by linguistic convention**, not inferred solely from context (Feature 2). Hence the contradiction if denied ("I regret it, but not that it's bad").
  -   It **projects** (Feature 3): it survives embedding under negation, questions, modals, conditionals, etc., because it's not part of the scope of those operators.

  ### 2. Verdict on Groups A & B: The Split is Real
  You've correctly identified the two major subclasses of conventional non-truth-conditional meaning:

  *   **Group A: Presuppositions**
      *   **Core Character:** They signal that a specific piece of information is **taken for granted as background, shared, or non-controversial** within the discourse. They set the "common ground."
      *   **Reader Challenge:** "Wait, since when?" (Challenges the *factual status* of the backgrounded info).
      *   **Reporting:** Transfers to the original speaker ("She said she regrets it" implies *she* treated the badness as background).
      *   **Your Examples:** "regret" (presupposes the event was bad), "realize" (presupposes the fact is true), "stop" (presupposes the activity happened before), "again" (presupposes it happened before), "too" (presupposes something similar applies elsewhere), "still" (presupposes the state held previously and its continuation might be noteworthy).
      *   **Boundary:** Words like "manage" ("managed to open it" presupposes it was difficult), "know" (presupposes truth), "continue". Phrases like "it was X who..." (presupposes *someone* did it).

  *   **Group B: Conventional Implicatures (CIs) / Expressives**
      *   **Core Character:** They signal the speaker's **attitude toward the proposition** (evaluative, epistemic) or **logical/discourse relationship** between propositions. They *frame* the core content.
      *   **Reader Challenge:** "Why put it that way?" (Challenges the *framing*, *attitude*, or *relevance* of the framing).
      *   **Reporting:** Typically *does not* transfer. The attitude/framing is attributed to the *reporter* ("She said, unfortunately, it rained" implies the *reporter* thinks it's unfortunate, not necessarily her).
      *   **Your Examples:**
          *   *Attitudinal/Evaluative:* "unfortunately" (speaker's negative evaluation), "frankly" (speaker's assertion of candor), "damn" (speaker's strong negative attitude).
          *   *Discourse/Logical:* "but" (contrast/adversative), "although" (concession), "nevertheless" (contrast despite concession), "moreover" (additive reinforcement), "even" (scalar extremity).
          *   *Epistemic/Distancing:* "allegedly" (distancing from commitment to truth), "so-called" (often signals speaker's skepticism or quotation of a contested label).
      *   **Boundary:** Words like "fortunately", "admittedly", "briefly" (in "briefly, ..."), "honestly". Particles like "well" or "oh" at the start of utterances.

  **The Boundary is Fuzzy?** Mostly clear, but some words have aspects of both:
  *   **"Allegedly":** Primarily CI (distancing attitude), but *weakly* presupposes that *someone* made the allegation (though this is often backgrounded). The CI aspect dominates.
  *   **"So-called":** Strong CI (skepticism), presupposes the label *is* used by some (background).
  *   **"Even":** Primarily CI (scalar focus, unexpectedness), but can sometimes trigger scalar presuppositions (e.g., "Even John passed" presupposes John was least likely).

  ### 3. Contrasts with Neighbors

  | Feature          | Literal Meaning (Assertion) | Presupposition (Group A) | Conventional Implicature (Group B) | Conversational Implicature (Ordinary Suggestion) |
  | :--------------- | :-------------------------- | :----------------------- | :-------------------------------- | :----------------------------------------------- |
  | **Nature**       | Core truth-conditional claim | Backgrounded fact taken as shared | Speaker attitude, framing, discourse relation | Contextually inferred suggestion                 |
  | **Truth-Conditional?** | YES (Sentence false if this is false) | **NO** (Sentence falsity doesn't affect it) | **NO**                             | **NO**                                           |
  | **Cancelable?**  | NO                           | **NO** (Leads to contradiction) | **NO** (Leads to contradiction)    | **YES** ("I said X, but I didn't mean Y")         |
  | **Context-Dependent?** | Low (Lexical/syntactic)      | **LOW** (Conventional trigger) | **LOW** (Conventional trigger)     | **HIGH** (Depends heavily on context, speaker goals) |
  | **Projects?**    | NO (Affected by operators)   | **YES** (Survives embedding) | **YES** (Survives embedding)       | **NO** (Often blocked by embedding)              |
  | **Reader Challenge** | "That's not true!"           | "Wait, since when [was that true]?" | "Why say it that way?"             | "What are you implying?"                         |
  | **Reporting Transfer** | Transfers                   | **Transfers**                   | **Does NOT transfer** (Stays with reporter) | Depends (Often attributed to original speaker)   |

  ### 4. Naming & Definition for Practical Use

  *   **Name:** **Conventional Commitments** (Encompasses both Presuppositions & Conventional Implicatures)
  *   **Definition:** A **Conventional Commitment** is a layer of meaning conveyed by specific words or constructions that:
      1.  Is **not the main factual claim** of the sentence.
      2.  Is **built into the word itself** by the language's rules, not created by the specific situation.
      3.  **Cannot be taken back** without creating a contradiction ("I say X, but not meaning Y" sounds wrong if Y is this commitment).
      4.  **Survives** when the sentence is negated, questioned, or put inside "if" clauses or reports like "She said that...".
  *   **Subtypes for Precision:**
      *   **Background Commitments (Presuppositions):** Signal information treated as already established or shared knowledge. (*Challenge: "Since when?"*)
      *   **Framing Commitments (Conventional Implicatures):** Signal the speaker's attitude, evaluation, or how the information fits logically into the discourse. (*Challenge: "Why frame it that way?"*)
  *   **Boundary Case Test:** Apply the "Embedding & Denial Test":
      1.  Embed the sentence: Negate it ("It is not the case that..."), question it ("Is it true that...?"), or put it under "if" ("If [sentence]...").
      2.  Does the suspected meaning *still* seem present?
      3.  Try to explicitly deny it: Add "...but I'm not suggesting [suspected meaning]". Does it sound contradictory or awkward?
      *   **If YES to 2 & 3:** It's a Conventional Commitment.
      *   *Example (Group A - "stop"):* "John didn't stop smoking." (Still implies he smoked before). "John stopped smoking, but I'm not suggesting he smoked before." (Contradictory).
      *   *Example (Group B - "but"):* "Is it true that it's cheap but ugly?" (Still implies contrast/ugliness detracts). "It's cheap but ugly, but I'm not suggesting the ugliness is a drawback." (Contradictory).
      *   *Counter-Example (Conversational Implicature):* "Some of the documents are ready." (Implicates not all). "Are some of the documents ready?" (Implicature often blocked - simple question). "Some are ready, but not all." (Perfectly fine cancelation).

  ### 5. Practical Implications for Rewriting

  **Yes, the distinction is CRUCIAL for safe paraphrasing.** The **cardinal rule**: **Never alter the Conventional Commitment unless you consciously decide the change is warranted and document it.** Here's why and how:

  1.  **Group A (Presuppositions / Background Commitments):**
      *   **Danger:** Altering these **smuggles in or removes background facts**. Changing "John stopped smoking" to "John is a non-smoker" *removes* the presupposition that he *used* to smoke. Changing "She regrets the decision" to "She is unhappy about the decision" *removes* the presupposition that the decision *was bad*. This can significantly change the legal/medical implications.
      *   **Strategy:** Paraphrase *carefully* to **preserve the backgrounded fact**. "John stopped smoking" -> "John smoked in the past but does not smoke now." "She regrets the decision" -> "She believes the decision was wrong/bad and is unhappy about it." *Sometimes the presupposition is irrelevant and can be dropped, but this must be a conscious, justified choice.*
      *   **Safety Check:** Does your rewrite *require* the reader to accept the same background fact? If not, you've altered the commitment.

  2.  **Group B (Conventional Implicatures / Framing Commitments):**
      *   **Danger:** Altering these **changes the speaker's attitude, evaluation, or logical framing**. Changing "unfortunately" to "it is noted that" removes the negative evaluation. Changing "but" to "and" removes the sense of contrast/adversativity. Changing "allegedly" to "apparently" weakens the distancing from truth (and vice-versa). Changing "frankly" to "I believe" removes the assertion of blunt honesty.
      *   **Strategy:** Paraphrase **explicitly or find a near-synonym preserving the frame/attitude**. "Unfortunately" -> "It is regrettable that...". "But" -> "However," or rephrase to show contrast ("While X is true, Y is also true"). "Allegedly" -> "It is claimed that..." (if preserving distance) *or* drop it if the source is clear elsewhere. **Crucially, decide if the frame/attitude is essential** (e.g., "allegedly" in a legal document often *is* essential; "frankly" in a consent form probably isn't). Plain language often benefits from *removing* unnecessary expressive framing (like "frankly", "damn") but *must preserve* logical relations ("but", "therefore") and essential epistemic markers ("allegedly").
      *   **Safety Check:** Does your rewrite convey the same speaker stance (evaluation, certainty, contrast, addition) towards the information? If not, you've altered the commitment.

  **Key Takeaway for Your Team:** Treat words triggering "Conventional Commitments" (identified via the Embedding & Denial Test) as **handling with care**. Ask:
  1.  *Is this a Background Commitment (Group A)?* If yes, ensure the background fact is preserved or consciously omitted.
  2.  *Is this a Framing Commitment (Group B)?* If yes, decide if the frame/attitude is essential to the document's purpose. If essential, preserve it explicitly. If not essential (especially evaluative expressives like "unfortunately", "frankly"), plain language often favors dropping it *unless* the evaluation is part of the document's required message (e.g., a side effect described as "unfortunate" in medical context).
  3.  *Does our rewrite pass the Embedding & Denial Test for the original commitment?*

  **Your Data is Sound:** Your three features perfectly capture the defining characteristics of conventional non-truth-conditional meaning. Feature 3 (Projection/Survival) is the most robust diagnostic. Feature 1 (Not the main claim) distinguishes it from assertion. Feature 2 (Context-independence) distinguishes it from conversational implicature. The Group A/B split is well-founded and practically significant for your work. Your analysis is spot-on.
