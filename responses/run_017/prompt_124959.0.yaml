prompt: |-
  I'm on my university's student union allocations committee — we move about $40m a year out of a "student life fund" and every spring we have the same four-hour fight about splitting it between mental health services, subsidised housing, direct cash transfers to students, and just leaving it in the endowment. A friend of mine who works on DAO governance stuff keeps telling us to stop arguing and run it futarchy-style: we argue once about what "student flourishing" even means and fix it as a number, then let prediction markets tell us which allocation makes that number highest. I've got the general shape of the vote-on-values-bet-on-beliefs setup and I don't want another explainer of it. What I want is the spec: what would such a procedure actually have to get right before I'd let real money ride on it, given that our purpose is boringly practical — a decision procedure we could actually operate next spring, on real allocations, with no legal exposure, not an ideal yardstick for thinking about governance.

  So: give me the desiderata list, each one with the concrete case behind it rather than just the label. Here's the material you should build the cases out of, since these are the things that keep me up. (1) Our only usable welfare metric is a "student flourishing index" built from a survey run five years later by the university's own institutional research office, which has its own incentives and which has already revised the index methodology twice. (2) The decision isn't binary — there's a knob for how much of the pot to spend at all, so conditional markets would have to be opened on a continuum of values and we can only discretise. (3) The likely traders are students, who are also the people whose survey answers constitute the metric, and at least one of them will be a landlord or a counselling-service vendor with a big side stake in the outcome; our market will be thin, maybe thirty serious participants, and possibly one genuinely informed one. (4) Whatever we adopt is the only branch that gets observed — the market conditional on the option we reject never resolves, so I don't see how the thing settles at all, and I want you to take that seriously rather than hand-wave it. (5) We probably can't run real-money markets under university rules, so it'd be play money or a small prize pool, and I genuinely don't know whether "the stakes have to be real" is a real requirement or a prejudice of the economics camp. (6) We can randomise: the housing pilot could be run in half the halls of residence and not the others, so for some of these questions we could get an actual counterfactual instead of a prediction about one.

  For each requirement, tell me why it's on the list and whether it's non-negotiable for our purpose or a preference of one faction (the mechanism-design people, the democrats, the anti-Goodhart people). Then the part I most want: which subsets of the desiderata can't be satisfied together — I'd bet "settles to a definite result" and "tracks the genuine causal effect of the policy" are already in tension, and I suspect "metric we actually care about" and "metric traders can't influence" are too, but you tell me. And tell me which single requirement does the most work in excluding designs. Keep the weight on the criteria and their cases; a short scorecard at the end — a straight student-body vote, an expert committee, a real-money conditional market, a play-money version, and just running the randomised pilot — is enough, five or six lines, I don't need prose.
reasoning: |-
  Okay, the user is on a student union allocations committee dealing with a $40M student life fund. They face the same annual four-hour debate over splitting funds between mental health services, subsidized housing, direct cash transfers, and leaving money in the endowment. Their friend suggests futarchy using prediction markets to decide allocations based on a "student flourishing index." The user wants a practical spec for implementing this next spring, focusing on real-world constraints rather than theoretical ideals.

  The user has outlined six key concerns: (1) Their welfare metric is a university-run survey that's been revised twice and may have institutional biases. (2) They need to allocate continuously, not just choose between binary options. (3) Traders would mainly be students who are also survey respondents, creating potential conflicts of interest, with thin markets and possible insider advantages. (4) They can only observe the outcome of the chosen policy, not the counterfactual, so how would the market resolve? (5) They likely can't use real money due to university rules, raising questions about whether play money would work. (6) They have some capacity for randomization (e.g., pilot programs in half the dorms).

  The user wants a desiderata list where each requirement is justified by a concrete case, not just labeled. They also want to know which requirements conflict, which single requirement is most limiting, and a quick scorecard comparing decision methods.

  Starting with the welfare metric (1): The "student flourishing index" is problematic because the university's institutional research office runs it with its own incentives and has revised it multiple times. This creates a Goodhart's Law risk—traders might optimize for the metric rather than actual flourishing. Since the metric is the basis for market payouts, its reliability is non-negotiable. If the metric doesn't reflect true welfare, the market's outcome is meaningless.

  The decision isn't binary (2): They need to allocate funds across multiple options and decide how much to spend versus save. Prediction markets typically handle binary choices. Continuous allocation would require discretizing into buckets (e.g., 0-25%, 25-50% etc.), but each bucket needs its own conditional market. With limited funds and trader attention, liquidity could be spread too thin, making prices noisy. This is a practical constraint; discretization is necessary but introduces approximation errors.

  Trader composition and thin markets (3): The market might only have 30 serious participants, including students (who are also survey respondents) and possibly vendors/landlords with vested interests. This leads to manipulation risks. For example, a landlord could inflate prices for policies benefiting them. Thin markets are vulnerable to such actions and might not aggregate information effectively. This is non-negotiable because without enough informed traders, the market fails to reflect true beliefs.

  Counterfactual problem (4): Markets for unchosen policies never resolve, so how do they settle? In futarchy, markets for all options run simultaneously, but only the chosen one's outcome is observed. The unchosen markets need a resolution mechanism. One solution is using the flourishing index from the chosen policy as a proxy, but that's flawed. Alternatively, use randomized pilots (point 6) to get data for multiple policies. Without this, the unresolved markets undermine the system's credibility. This is critical; if unresolved markets can't settle, the whole mechanism breaks.

  Play money vs. real stakes (5): University rules likely prohibit real-money gambling. Play money or small prizes might not incentivize truthful betting. Economic theory says real stakes are needed for honest revelation of beliefs, but behavioral studies show some engagement even with symbolic stakes. However, with thin markets and potential manipulators, play money could lead to gaming. This is a tension: real money is ideal but impractical; play money risks lack of seriousness.

  Randomized pilots (6): They can run pilots (e.g., housing subsidies in some dorms). This provides actual counterfactual data, resolving the settlement issue for multiple policies. However, pilots are only feasible for some interventions (like housing) but not others (e.g., cash transfers or endowment savings). This is a preference; it helps where possible but isn't a universal fix.

  Conflicts between desiderata:
  - Metric alignment (1) vs. trader influence (3): Traders who are survey respondents can manipulate the metric by how they answer, especially if they know it affects market payouts. Hard to separate.
  - Definite result (4) vs. causal effect tracking (via 6): Randomized pilots give causal effects but only for specific policies. Without them, markets rely on predictions without verification.
  - Real stakes (5) vs. legal feasibility: Real money is better for incentives but not allowed; play money is practical but may not work.

  The most constraining requirement is the counterfactual settlement (4). If unresolved markets can't be settled credibly, the system fails. Randomized pilots help but aren't always possible.

  Scorecard:
  - **Student vote**: Poor metric alignment, handles continua via deliberation, vulnerable to influence, resolves definitely, no stakes needed, no causal tracking.
  - **Expert committee**: Better metric interpretation, handles continua, resistant to influence but not immune, definite result, no stakes, moderate causal tracking if experts use data.
  - **Real-money market**: Good if metric reliable; discretization needed; thin markets problematic; settlement issues without pilots; real stakes ideal but illegal; pilots improve causal tracking.
  - **Play-money market**: Metric reliability critical; same discretization; highly manipulable in thin markets; settlement same issue; legal but ineffective; pilots help minimally.
  - **Randomized pilot**: Directly measures causal effects for testable policies; limited scope; avoids trader issues; resolves definitely; no stakes; best causal tracking where applicable.

  Key takeaways: The flourishing metric's reliability and the counterfactual settlement are the biggest hurdles. Without resolving these, futarchy is impractical. Randomized pilots are the most promising for causal insights but have limited scope. Given constraints, a hybrid approach (e.g., experts using pilot data) might be better than pure futarchy.
answer: |-
  Here's the desiderata list for a practical futarchy implementation, built from your constraints. Each requirement includes the concrete case behind it, negotiability status, and core conflicts. The most exclusionary requirement is **#4 (Counterfactual Settlement)**.

  ### Desiderata & Concrete Cases
  1. **Metric Robustness to Revision & Gaming**  
     *Why*: Your "student flourishing index" (SFI) is revised by an incentivized university office. Traders will optimize for whatever SFI *is*, not what it *should* represent (e.g., if SFI weights GPA over mental health, markets will favor GPA-boosting allocations).  
     *Non-negotiable*: Yes. If the metric isn't stable and aligned with true welfare, the market optimizes a phantom.  
     *Conflict*: Inextricably clashes with **Trader Composition (#3)**—students/traders can directly game SFI via survey responses.

  2. **Feasible Discretization of Continuous Choice**  
     *Why*: Allocating $40M across 4 options + savings rate requires infinite markets (e.g., "15% housing, 20% cash..." markets). Discretization (e.g., 3 buckets per option) creates ~81 markets—far too many for 30 traders.  
     *Non-negotiable*: Preference (practical necessity). Continuous knobs *must* be bucketed, but coarse buckets distort intent.  
     *Conflict*: Tensions with **Thin Markets (#3)**—too many markets dilute liquidity, increasing noise/manipulation risk.

  3. **Manipulation-Resistance in Thin, Conflicted Markets**  
     *Why*: With ~30 traders (including landlords/vendors), a single deep-pocketed actor can distort prices (e.g., a landlord inflates "subsidized housing" odds). Students may trade based on self-interest (e.g., cash transfers now) vs. long-term SFI.  
     *Non-negotiable*: Yes. Thin, conflicted markets fail to aggregate information if manipulable.  
     *Conflict*: Amplifies **Metric Gaming (#1)** and opposes **Low Stakes (#5)**—play money increases manipulation viability.

  4. **Counterfactual Settlement Without Observability**  
     *Why*: Only the chosen allocation’s outcome (SFI in 5 years) is observed. Markets for rejected options can’t resolve—unless you use the *actual* SFI as a proxy for *all* markets (inaccurate) or artificial resolutions (easily gamed).  
     *Non-negotiable*: Absolutely. Unresolved markets = untestable predictions = no futarchy.  
     *Conflict*: Directly undermines **Causal Validity (#6)**—you can’t verify predictions without counterfactuals. *This is the most constraining requirement.*

  5. **Adequate Incentives Under Low/Play Stakes**  
     *Why*: Real money is likely banned. Play-money with prizes may not incentivize truthful betting (e.g., traders meme or collude). Evidence is mixed: small real stakes often suffice, but play money fails in thin markets.  
     *Non-negotiable*: Preference. Real stakes are ideal but impractical; play money *might* work with high engagement.  
     *Conflict*: Worsens **Manipulation (#3)** and **Settlement (#4)**—low stakes make collusion/gaming cheaper.

  6. **Causal Isolation Via Randomized Pilots (Where Possible)**  
     *Why*: For testable policies (e.g., housing), randomization provides ground-truth causal effects. But it’s impossible for "leave in endowment" or campus-wide mental health spend.  
     *Non-negotiable*: Preference (valuable but partial). Only applies to subset of options.  
     *Conflict*: Resolves **Settlement (#4)** and improves **Causal Validity** for piloted options—but irrelevant for others.

  ### Key Conflicts Between Desiderata
  - **#1 (Metric) vs. #3 (Traders)**: You can’t have traders *be* the metric’s subjects without inviting distortion.  
  - **#4 (Settlement) vs. #6 (Pilots)**: Pilots solve settlement for testable policies but exclude others (e.g., endowment savings).  
  - **#4 (Settlement) vs. Causal Truth**: Markets predict *expected* SFI, but without counterfactuals (or pilots), you can’t know if it was causal.  
  - **#5 (Stakes) vs. #3 (Manipulation)**: Play money makes thin markets trivial to manipulate.

  ### Scorecard: Decision Procedures vs. Your Desiderata
  | **Procedure**       | Metric Robustness | Continuous Choice | Manipulation Resistance | Counterfactual Settlement | Works w/ Low Stakes | Causal Tracking |
  |---------------------|-------------------|-------------------|-------------------------|---------------------------|---------------------|-----------------|
  | Student Vote        | ❌ (Debates values) | ✅ (Via bargaining) | ❌ (Voter coalitions)  | ✅ (Definite result)      | ✅                  | ❌              |
  | Expert Committee    | ⚠️ (If experts align) | ✅                 | ⚠️ (Lobbying risk)     | ✅                         | ✅                  | ⚠️ (If data-driven) |
  | Real-Money Market   | ❌ (Goodharts SFI) | ❌ (Discretized)   | ❌ (Thin + conflicted) | ❌ (Unresolved markets)   | ❌ (Banned)         | ❌              |
  | Play-Money Market   | ❌ (Goodharts SFI) | ❌ (Discretized)   | ❌ (Highly gameable)   | ❌ (Unresolved markets)   | ✅                  | ❌              |
  | Randomized Pilot    | ✅ (Direct measure) | ❌ (Partial scope) | ✅ (No traders)        | ✅ (Observes outcomes)    | ✅                  | ✅ (For tested) |

  ### Bottom Line
  **Futarchy fails your specs** primarily due to **#4 (Counterfactual Settlement)** and **#1 (Metric)**. Pilots (#6) are your best tool for causal insight but can’t cover all options. Given constraints, a **hybrid approach** is pragmatic:  
  - Use **randomized pilots** for testable policies (housing).  
  - Apply **expert committee + student vote** for non-testable options (endowment savings), using pilot data to inform debates.  
  - **Abandon futarchy**—it demands unrealistically robust markets and metrics for your context.
