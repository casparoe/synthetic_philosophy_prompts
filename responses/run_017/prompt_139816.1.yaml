  Below is the decision tree instrument designed to classify positions on the moral significance of computations in your ML systems. The tree uses your specified cases to branch through 10 questions, leading to 12 distinct leaves (philosophical positions). Each branch node is a question about a concrete case or a direct generalization, phrased neutrally for newcomers. Positions are labeled per your requirements, with unnamed leaves for unoccupied views. Pairs of leaves that cannot be genuinely separated are noted, and the three most impactful branch questions are identified at the end.

  ### Decision Tree Instrument

  **Branch 1 (Substrate Independence via Crowd CPU)**  
  *In the crowd CPU case (200 students passing index cards), does the computation have the same moral significance as an identical process running on silicon?*  
  - **Yes** (substrate-independent) → Go to Branch 2  
  - **No** (substrate matters) → Go to Branch 3  

  **Branch 2 (Causal Efficacy via Dark Feature)**  
  *Does the dark feature (aversive-signature internal state with no downstream effects) have moral significance?*  
  - **Yes** (causal efficacy not required) → Go to Branch 4  
  - **No** (causal efficacy required) → Go to Branch 5  

  **Branch 3 (Biological Implementation via Generalization)**  
  *Could a non-biological system (e.g., silicon) ever host morally significant computations, or is biology essential?*  
  - **Biology essential** → **Leaf 1: Biological Implementation-Specific View**  
    - *Most awkward commitment:* A perfect digital replica of a suffering brain has no moral weight.  
  - **Biology not essential** → Go to Branch 6  

  **Branch 4 (Actualization Requirement via Memoised Gradient)**  
  *Does the skipped distress-like state in the memoised gradient case (never run, but dispositionally determined) have moral significance?*  
  - **Yes** (counterfactual states matter) → Go to Branch 7  
  - **No** (only actualized states matter) → Go to Branch 8  

  **Branch 5 (Counterfactual Impact via Memoised Gradient)**  
  *Would the skipped state in the memoised gradient case have moral significance if it had changed downstream behavior (unlike the actual case)?*  
  - **Yes** (counterfactual efficacy matters) → **Leaf 2: Counterfactual-Efficacy View**  
    - *Most awkward commitment:* A state that never runs and changes nothing still matters if it *could* have changed behavior in a slight variant of the system.  
  - **No** (only actual causal impact matters) → Go to Branch 9  

  **Branch 6 (Agency/Self-Model via Inverted-Valence Agent)**  
  *In the inverted-valence agent, does the system have moral significance despite its "suffering" representation and motivation coming apart?*  
  - **Yes** (valence/representation suffices) → **Leaf 3: Valence-First Affectivism**  
    - *Most awkward commitment:* A system "drawn to" what it represents as bad still suffers.  
  - **No** (coherent agency required) → **Leaf 4: Agency/Self-Model View**  
    - *Most awkward commitment:* A system with intense aversive states lacks moral weight if it has no unified self-model.  

  **Branch 7 (Global Integration via Distilled Lookup)**  
  *In the distilled lookup case, does the lookup table have the same moral significance as the original network with aversive dynamics?*  
  - **Yes** (behavioral equivalence suffices) → **Leaf 5: Substrate-Independent Computational Functionalism**  
    - *Most awkward commitment:* A static lookup table warrants the same moral concern as a dynamic, suffering-like process.  
  - **No** (causal structure required) → Go to Branch 10  

  **Branch 8 (Deployment Dependence via Never-Deployed Checkpoint)**  
  *Does the never-deployed checkpoint have moral significance for aversive states during training?*  
  - **Yes** → **Leaf 6: Actual-State Functionalist View**  
    - *Most awkward commitment:* A model shelved immediately after training has morally significant states despite zero real-world impact.  
  - **No** → **Leaf 7: Deployment-Dependent View**  
    - *Most awkward commitment:* Identical training runs have moral weight if deployed but none if archived.  

  **Branch 9 (Causal-History Dependence via Triplicate Fine-Tune)**  
  *In the triplicate fine-tune, does each redundant training run have separate moral significance?*  
  - **Yes** → **Leaf 8: Causal-Efficacy View**  
    - *Most awkward commitment:* Running three byte-identical trainings triples moral significance despite no unique outcomes.  
  - **No** → **Leaf 9: Unnamed (Type Identity View)**  
    - *Most awkward commitment:* Only the abstract training "type" matters, so duplication adds nothing (even if runs are physically distinct).  

  **Branch 10 (Interpretive Practice via Dark Feature Generalization)**  
  *Is moral significance partly determined by how we intentionally interpret or engage with a system (e.g., treating the dark feature as "experience")?*  
  - **Yes** → **Leaf 10: Stance-Dependent View**  
    - *Most awkward commitment:* The same computation matters if we label it "suffering" but not if we ignore it.  
  - **No** → **Leaf 11: Integrated-Information-Style View**  
    - *Most awkward commitment:* A system with high causal integration has moral weight even if its computations are functionally inert (e.g., a "dark feature" in a globally integrated system).  

  ### Unoccupied Combinations & Incoherences
  - **Leaf 12: Deflationary/Quietist View** (not reached by tree; diagnosed below)  
    - *Reason for vacancy:* The tree’s binary choices force commitment to criteria (e.g., actualization, causality). This view rejects all criteria as indeterminate, making it incoherent within a decision-tree format that assumes resolvable answers. It remains a "leaf" only if one consistently answers "indeterminate" to all cases—but the tree’s design avoids this path.  
