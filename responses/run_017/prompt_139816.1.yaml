  - **Leaf 8 (Causal-Efficacy View) and Leaf 9 (Unnamed Type Identity)** are not genuinely separable by the final branch (triplicate fine-tune). Both require actual causal impact, and the duplication question merely refines "what counts" as a unit of significance (token vs. type). The last branch is a sub-distinction within causal efficacy.  
