prompt: |-
  I'm giving a seventy-five-minute session on Arrow's impossibility theorem to a reading group of about twelve machine-learning researchers. They routinely collapse many human preference rankings over model outputs into a single ranking; they are entirely comfortable with functions, profiles and quantifiers; they have no patience for philosophical throat-clearing; and they will arrive assuming the result is a fact about elections and therefore has nothing to say to them. What I want from you is the plan for the session, not the session itself: do not explain the theorem to me.

  Reply as a numbered list of exactly five items, with no preamble and no closing line, each item two or three sentences at most.

  1. The order in which the components must be introduced, with the dependency that forces each ordering — what has to be in place before the next piece can even be stated. Say where in the sequence the statement of the result itself should land relative to the argument for it, and why that placement rather than the other one.
  2. The single example that carries the whole thing, drawn from their world rather than from elections, and what that example must contain and must lack in order to carry it. I take it that two alternatives are useless here, that the example has to be displayable as two profiles that agree on every individual's ranking of some one pair while differing elsewhere, and that it must carry no natural intensity or score information — but tell me what else it needs and why.
  3. The misconceptions, in the order in which they will form, each with the exact point in the sequence at which to head it off. I expect two of them: that the theorem shows voting to be irrational or democracy impossible, and that independence of irrelevant alternatives means dropping a hopeless candidate must not change the winner. Find the rest — I suspect one about what "dictator" means in the statement of the result, one about whether score-based or utility-based aggregation escapes it, and one about whether the way to repair an impossibility theorem is to add further conditions.
  4. One question to end with that tells me whether the idea has landed rather than merely depressed them. My candidate is to hand them the aggregation rule their own pipeline uses and ask which condition it violates and for the pair of profiles that witnesses the violation; improve on that if you can.
  5. What I should openly decline to cover at this level, and what I should say out loud about why. I think that includes saying that the session supplies a vocabulary for diagnosing any aggregation rule and not a recommendation about which one to adopt, and that I should not claim the result carries over to their case when annotators rank overlapping but different sets of items — but tell me what else belongs on the refusal list.
reasoning: |-
  Hmm, the user wants a plan for teaching Arrow's Impossibility Theorem to a group of machine learning researchers. They've given me very specific instructions about what should be included in my response. Let me break this down.

  First, I need to create a numbered list with exactly five items. The user wants a session plan, not the actual content of the session. The audience consists of about twelve ML researchers who work with preference rankings and are comfortable with technical concepts but dislike philosophical tangents. They're likely skeptical that a theorem about elections applies to their work.

  For item 1, I'll outline the sequence of introducing components with dependencies. The key is starting with preferences and moving through conditions before stating the theorem itself. I think the statement should come after introducing all conditions but before the proof, since this audience needs to see the logical necessity first.

  For item 2, I need an ML-relevant example. Since these researchers collapse multiple rankings into one, I'll create an example with three distinct models being ranked by different annotators. It must show how two profiles agree on one pair but differ elsewhere, causing a violation of IIA. Crucially, it shouldn't involve scores or intensities - just strict ordinal preferences.

  Item 3 requires anticipating misconceptions. Beyond the ones the user mentioned, I should address misinterpretation of "dictator" (it's not a person but a decisive voter), the false hope that scoring systems escape the theorem, and the mistaken belief that adding conditions fixes the problem. I'll order these as they're likely to arise during the session.

  For item 4, the closing question should test understanding. Rather than just asking about their own pipeline (which might be complex), I can propose asking them to design a rule that satisfies specific conditions. This forces application of the concepts.

  Finally, for item 5, I need to set clear boundaries. Besides what the user mentioned, I'll add that we're not addressing probabilistic preferences, cardinal utilities, or approximation methods. The theorem is about deterministic ordinal aggregation under specific conditions.

  Throughout, I'll keep each item concise - two or three sentences maximum as requested. The tone should match their no-nonsense approach: direct, technical, and immediately relevant to their ML work.
answer: |-
  1.  Introduce the primitives: individual strict preference orders over ≥3 alternatives, and a social welfare function mapping profiles to a social order. Then define Unanimity (if all prefer A>B, so does society). Next, define Independence of Irrelevant Alternatives (IIA) - the social ranking of any pair depends only on individual rankings of *that* pair. Only *then* state the theorem: no SWF satisfies Unanimity, IIA, and Non-Dictatorship. Place the statement *after* defining the conditions, as the audience must grasp the specific requirements to appreciate the impossibility. The proof sketch follows immediately after the statement, showing the logical necessity.

  2.  Use three distinct model outputs (A, B, C) and three annotators. Profile 1: Annotator1: A>B>C, Annotator2: B>C>A, Annotator3: C>A>B. Profile 2: Annotator1: A>C>B, Annotator2: B>A>C, Annotator3: C>B>A. Both profiles have identical individual rankings for the pair (A,C): Annotator1 (A>C), Annotator2 (C>A), Annotator3 (C>A). It must lack any intensity information (only strict orders) and must show the social ranking for (A,C) flipping between profiles despite identical individual inputs for that pair, violating IIA. The profiles differ on other pairs.

  3.  Head off "Democracy is impossible" immediately after stating the theorem: emphasize it shows no *perfect* aggregation method exists under these axioms, not that all are irrational. After defining IIA, counter "Dropping alternatives changes the winner?": clarify IIA concerns *rankings*, not winners, and is about pair-specific data isolation. When defining Non-Dictatorship, clarify "Dictator" means a single annotator whose preferences *always* determine the entire social order, regardless of others. After the proof, counter "But scores/utilities escape?": state Arrow assumes only ordinal preferences, cardinal methods violate the IIA axiom as defined. Finally, counter "Just add another axiom to fix it?": note the theorem shows *any* rule satisfying the first two axioms *must* be dictatorial - adding conditions relaxes the problem.

  4.  Ask: "Suppose you have three annotators ranking three model outputs. Design an aggregation rule that satisfies Unanimity and Non-Dictatorship. Now, give me two specific profiles where your rule violates IIA, explicitly showing how the social ranking for one pair changes even though all annotators' rankings for that pair are identical." This forces them to engage with the conditions and construct the counterexample.

  5.  Decline to cover: How the theorem applies to incomplete or partial orders (assumes complete rankings). Whether specific cardinal methods (like Borda or scoring) are "better" in practice (focus is on impossibility under ordinal IIA). Extensions to probabilistic outputs or expected utility (theorem is deterministic). Approximate satisfaction of axioms (theorem is exact). Claims about fairness beyond Non-Dictatorship. State clearly: this provides a diagnostic framework for aggregation rules under specific ordinal axioms, not a prescription or analysis of other aggregation paradigms.
