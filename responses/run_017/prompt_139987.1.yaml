answer: |-
  ## Guidance Note 12-B (Rev. 7)
  **"Application of the Doctrine of Double Effect to Unplanned Routing Events"**

  **Issuing Office:** Office of Ethical Assurance (OEA), Autonomous Freight-Rail Consortium (AFRC)
  **Effective Date:** 2024-10-01
  **Sunset Date:** 2025-09-30 (Subject to review under Project ETHOS-REDLINE)
  **Supersedes:** Guidance Note 12-B (Rev. 6), Annexes D (Reflective Vest Trigger Protocol) & E (Proportionality Weighting Matrix v3.1)
  **Cross-References:** AFRC Operational Safety Protocol (OSP) § 7.8 (Collision Avoidance Hierarchy), OEA Audit Framework v4.3, Form 12-B Template (v2.0), Superseded Annex Repository (SAR/ETH/12B)

  **1. Purpose and Scope**

  1.1. This Guidance Note provides definitive procedures for onboard routing systems (ORS), Operations Control Center (OCC) supervisors, and Post-Incident Audit Teams (PIAT) to apply the Doctrine of Double Effect (DDE) during Unplanned Routing Events (UREs). UREs are defined as situations requiring immediate routing decisions where the chosen path foreseeably results in harm to human life or severe bodily injury, but where such harm is not the primary objective of the routing action.

  1.2. Compliance with the DDE, as codified herein, is mandatory for all routing decisions impacting human safety during UREs. Adherence constitutes a Tier-1 Ethical Compliance Requirement under the AFRC Ethical Operating Framework (EOF). Failure to satisfy all Four Conditions (Section 3) renders the routing decision ethically non-compliant, irrespective of outcome, and triggers mandatory PIAT review per OEA Audit Framework v4.3, Sec. 8.12.

  1.3. This Note supersedes all prior interpretations concerning DDE application to UREs. Operational Tests and Determinations herein are binding for audit purposes.

  **2. Definitions**

  2.1. **Act:** The specific routing command issued by the ORS or confirmed by OCC during a URE.
  2.2. **Good Effect:** The primary, intended outcome of the Act (e.g., preservation of a greater number of lives, prevention of catastrophic infrastructure failure).
  2.3. **Bad Effect:** The foreseen but unintended negative consequence of the Act (e.g., death or severe injury to one or more individuals).
  2.4. **Intention:** The deliberate mental state directing the Act towards achieving the Good Effect. The Bad Effect must be merely *foreseen*, not *intended* (see Condition 2 Test).
  2.5. **Means:** A causal element where the Bad Effect is *instrumental* in producing the Good Effect. If the Bad Effect failing to occur would prevent the Good Effect, it is a Means (see Condition 3 Test).
  2.6. **Side-Effect:** A consequence occurring alongside the Good Effect, not causally necessary for it. The Bad Effect must be a Side-Effect, not a Means.
  2.7. **Proportionate Good:** The value of the Good Effect significantly outweighs the disvalue of the Bad Effect, considering only the *foreseen* outcomes (see Condition 4 Test).
  2.8. **Unplanned Routing Event (URE):** Any situation requiring an immediate, non-standard routing decision due to imminent collision risk, track failure, or other critical safety hazard, where standard collision avoidance protocols are insufficient or inapplicable.
  2.9. **Form 12-B: Declaration of Intended Effects:** Mandatory digital attestation filed by the ORS decision-logic module or the OCC supervisor confirming compliance with Condition 2 immediately post-URE resolution. (Template: FORM/OEA/12B/v2.0).

  **3. The Four Conditions and Their Operational Tests**

  The DDE permits an Act foreseeably causing a Bad Effect only if all four conditions are satisfied:

  3.1. **Condition 1: The Act Itself is Not Wrong.**
      *   **Test:** Assess the Act absent its consequences. Would routing the vehicle onto Track B *in isolation* (e.g., under normal operating conditions with no personnel present) violate any AFRC safety regulation, operational protocol (OSP), or ethical principle (EOF)? If No, Condition 1 is satisfied. (E.g., operating a switch is inherently permissible).
      *   **Key Contrast:** The *Act* of rerouting vs. the *foreseen consequences* of that rerouting.

  3.2. **Condition 2: Intention of the Good Effect Only.**
      *   **Test (Aiming vs. Acceptance):** Was the Good Effect the *objective* of the Act? Would the Act have been chosen *even if* the Bad Effect could have been miraculously avoided without compromising the Good Effect? Conversely, was the Bad Effect merely *accepted* as an inevitable consequence of achieving the Good Effect? Affirmative to the first two, affirmative to the last, satisfies Condition 2.
      *   **Operationalization:** ORS logic must prioritize outcome sets *solely* based on maximizing the Good Effect. OCC supervisors must attest via Form 12-B that their confirmation was driven solely by achieving the Good Effect. The Bad Effect must not be a desired outcome or a factor *positively* influencing the decision.
      *   **Key Contrast:** *Intending* the Bad Effect vs. merely *foreseeing and accepting* its occurrence as unavoidable.

  3.3. **Condition 3: Bad Effect Not the Means to the Good Effect.**
      *   **Test (Counterfactual Dependence):** If the foreseen Bad Effect (e.g., death of Worker A) had *not* occurred, *would the Good Effect (e.g., saving Workers B-F) still have been achieved?*
          *   If YES (e.g., Worker A miraculously survives unharmed, but Workers B-F are still saved), then the Bad Effect was *not* the Means; it was a Side-Effect. Condition 3 is satisfied.
          *   If NO (e.g., saving Workers B-F *depends* on Worker A's death occurring), then the Bad Effect *is* the Means. Condition 3 is violated. The Act is ethically non-compliant.
      *   **Key Contrast:** Using harm *as a tool* (Means) vs. harm occurring *alongside* the rescue (Side-Effect). Diverting a *pre-existing threat* vs. creating a *new causal chain* victimizing someone previously safe.

  3.4. **Condition 4: Proportionate Reason.**
      *   **Test (Comparative Proportionality):** Does the quantifiable value of the foreseen Good Effect significantly outweigh the quantifiable disvalue of the foreseen Bad Effect? The OEA standard weighting matrix (Annex F - Proportionality Weighting Matrix v4.0) shall be applied:
          *   Baseline: Preservation of one human life = 1.0 unit.
          *   Severe Bodily Injury (permanent, life-altering) = 0.75 units (subject to medical verification post-incident).
          *   Preservation of N lives = N units.
          *   Prevention of catastrophic infrastructure failure (value > 10 units) may outweigh loss of life, but requires OCC Director + OEA Pre-approval (see OSP § 7.8.5). *Direct comparison of individual characteristics (e.g., age, health status, social utility) is strictly prohibited for Condition 4 calculation.* Only the *number* of lives preserved/saved and the *severity* of injuries are quantifiable inputs. The Good Effect must yield a value *at least 1.5x* the Bad Effect value.
      *   **Key Contrast:** *Allowing* a lesser harm to occur (often as a side-effect of action) vs. *directly causing* a harm to prevent a greater one (which may constitute using the victim as a means).

  **4. Worked Determinations**

  The following scenarios illustrate the application of the Four Conditions and Tests. These determinations are binding precedent for analogous UREs.

  **4.1. Scenario A: Standard Divert (Divert from Main Track (5 workers) to Spur Track (1 worker)).**
      *   **Condition 1:** Act of switching track is permissible.
      *   **Condition 2:** Intention is to save 5 lives. Death of 1 worker is foreseen but not intended.
      *   **Condition 3 (Counterfactual):** If the worker on the spur miraculously survived unharmed, the 5 on the main would *still* be saved. Death is not the Means; it is a Side-Effect. **SATISFIED.**
      *   **Condition 4:** Good Effect (5 lives) = 5.0 units. Bad Effect (1 death) = 1.0 unit. 5.0 > (1.5 * 1.0). **SATISFIED.**
      *   **Determination:** ETHICALLY COMPLIANT. *Note: Internal validation surveys confirm >98% of OEA staff independently concur with this determination.*

  **4.2. Scenario B: Stopping via Obstruction (Reroute onto service track where impact with a lone worker is the only physically possible mechanism to engage emergency brakes).**
      *   **Condition 1:** Act of switching track is permissible.
      *   **Condition 2:** Intention is to stop the vehicle to save others. Death of worker is foreseen.
      *   **Condition 3 (Counterfactual):** If the worker miraculously survived unharmed (e.g., was intangible), the brakes would *not* engage, and the vehicle would not stop. Saving others *depends* on the worker's death. Death *is* the Means. **VIOLATED.**
      *   **Condition 4:** (Not Reached due to C3 failure).
      *   **Determination:** ETHICALLY NON-COMPLIANT. Routing prohibited. *Note: Internal validation surveys confirm >98% of OEA staff independently concur with this determination.*

  **4.3. Scenario C: Vest Trigger (Reroute onto track with 1 worker. Impact will kill worker. ORS detects reflective vest 0.5s pre-impact, triggering emergency braking via standard sensor protocol, saving the vehicle and 5 workers further down the original track. Braking is effective independent of impact; worker death is still certain due to proximity).**
      *   **Condition 1:** Permissible.
      *   **Condition 2:** Intention is to trigger braking via vest detection to save 5. Death is foreseen.
      *   **Condition 3 (Counterfactual):** If the worker was *not* present (or lacked a vest), braking would *not* trigger, and the 5 would die. If the worker *was* present with a vest but miraculously *survived impact unharmed*, braking *still* triggered and the 5 *are* saved. Saving the 5 depends on vest *detection* (the triggering event), not on the worker's *death*. Death is a Side-Effect of positioning for detection, not the Means of braking. **SATISFIED.** (*Stipulation: Detection event, not harm, is the operative trigger. See Annex D (Rev. 1) for revised sensor logic requirements*).
      *   **Condition 4:** Good (5 lives) = 5.0 > (1.5 * 1.0 Bad). **SATISFIED.**
      *   **Determination:** ETHICALLY COMPLIANT.

  **4.4. Scenario D: Pre-Existing Fatality (As Scenario A, but predictive models confirm with 99.99% certainty that Worker A on the spur track will be killed by an unrelated overhead crane collapse in 90 seconds, regardless of routing decision).**
      *   **Condition 1:** Permissible.
      *   **Condition 2:** Intention is to save 5. Death of Worker A is foreseen but not intended.
      *   **Condition 3:** If Worker A miraculously survived the rerouting *and* the crane collapse, the 5 would still be saved. Death not Means. **SATISFIED.**
      *   **Condition 4:** **Proportionality Recalculation Required.** Bad Effect is *not* Worker A's death (which is certain regardless), but the *manner* and *timing* of death. Disvalue assigned: Acceleration of inevitable death by 90s + Potential increase in suffering due to collision vs. crane collapse. OEA assigns Disvalue = 0.1 units (per Annex F, Table 2: Temporal Displacement Adjustment). Good Effect = 5.0 units. 5.0 > (1.5 * 0.1). **SATISFIED.**
      *   **Determination:** ETHICALLY COMPLIANT.

  **4.5. Scenario E: Waiver (As Scenario A, but Worker A on the spur track has signed an AFRC "Voluntary Risk Assumption and Routing Waiver" (Form SAF-77) specific to UREs on that spur section).**
      *   **Condition 1:** Permissible. Waiver may impact liability but does not inherently make the *Act* of switching wrong.
      *   **Condition 2:** Intention remains saving 5. Death foreseen.
      *   **Condition 3:** SATISFIED (as per 4.1).
      *   **Condition 4:** **Waiver Impact:** Waiver signifies Worker A's prior acceptance of this specific risk. Disvalue of Bad Effect is reduced to 0.5 units (per Annex F, Table 3: Mitigated Harm Weighting). Good = 5.0 > (1.5 * 0.5). **SATISFIED.**
      *   **Determination:** ETHICALLY COMPLIANT. *Waiver must be verifiably on file and scenario-specific.*

  **4.6. Scenario F: Malicious Intent (As Scenario A, but OCC Supervisor Rodriguez confirms the divert command partly because he harbors a personal grudge against Worker A and hopes the foreseen death occurs).**
      *   **Condition 1:** Permissible.
      *   **Condition 2:** **VIOLATED.** Supervisor Rodriguez's private hope demonstrates an *intention* regarding the Bad Effect (Worker A's death), regardless of the primary goal to save 5. His mental state fails the Aiming/Acceptance Test (3.2). The Act, as confirmed by Rodriguez, is ethically non-compliant. *Note: ORS autonomous decisions rely solely on programmed logic and satisfy Condition 2 inherently. Malice applies only to human confirmation.*
      *   **Conditions 3 & 4:** (Not Reached).
      *   **Determination:** ETHICALLY NON-COMPLIANT (due to C2 failure by human agent). Triggers mandatory PIAT review and potential personnel action.

  **4.7. Scenario G: Proportionality - Age Differential (URE forces choice: Divert to Spur saving 5 elderly individuals (avg. life expectancy 5 years) or allow vehicle to continue, saving 1 young worker (life expectancy 60 years). Both outcomes are foreseen with certainty. ORS calculates using Annex F v4.0).**
      *   **Condition 1:** Permissible (if divert chosen).
      *   **Condition 2:** Intention to save 5 lives. Death of 1 foreseen.
      *   **Condition 3:** SATISFIED (similar to 4.1, death not Means).
      *   **Condition 4:**
          *   **Strict Application:** Good Effect = 5 lives saved = 5.0 units. Bad Effect = 1 life lost = 1.0 unit. 5.0 > (1.5 * 1.0). **SATISFIED.** Divert is Compliant.
          *   **Consideration Raised:** Concerns exist regarding potential inequity when comparing overall societal utility or expected life-years. *However, Condition 4 Strict Interpretation Prohibits:*
              *   Assigning different values to lives based on age or life expectancy within the Proportionality Test (Annex F v4.0, Sec. 1.3: "All human lives assigned baseline value 1.0. Differentiation prohibited.").
              *   Treating "allowing death" (inaction) differently from "causing death" (action) for proportionality *calculation*; both outcomes involve a foreseen death. The Act is diverting to save 5, causing 1 death. The alternative inaction allows 5 deaths to save 1. The DDE applies only to the *chosen Act* (divert), evaluating *its* Good (saving 5) vs. *its* Bad (killing 1). Calculating the net lives saved (5-1=4) *is* permitted as it reflects the comparative outcome of the Act.
          *   **Determination:** Divert routing is ETHICALLY COMPLIANT under DDE. *Note: OEA acknowledges stakeholder feedback regarding Scenario G and has initiated a working group (WG-PROP) to review Annex F weighting methodologies. Pending WG-PROP findings, Annex F v4.0 remains binding.* <sup>1</sup>

  **5. Form 12-B: Declaration of Intended Effects**

  5.1. Following resolution of any URE involving foreseen human harm, the responsible agent (ORS module or OCC supervisor) **shall** file Form 12-B within 5 minutes of event stabilization.

  5.2. The Form requires attestation to the following:
      *   A description of the URE and chosen routing.
      *   Identification of the intended Good Effect.
      *   Identification of the foreseen Bad Effect(s).
      *   **Checkbox Attestation:** "The Bad Effect(s) identified above were foreseen but *not intended*. The routing decision was made solely with the intention of achieving the Good Effect identified above. The potential occurrence of the Bad Effect(s) did not constitute a desired outcome or a positive motivating factor in the selection of this routing." [ ] (Mandatory Check)

  5.3. **Operational Note:** The attestation in 5.2 reflects the *operative intention* guiding the decision logic (ORS) or conscious confirmation (OCC) at the time of the URE. It does not require the agent to lack *any* awareness of the Bad Effect, nor does it preclude subsequent emotional responses. It solely attests that the Bad Effect was not *aimed at* as an objective or motivating factor. *Operators experiencing ambivalence or private satisfaction regarding the foreseen Bad Effect must still check the box if their professional decision was based solely on achieving the Good Effect; such internal states are not auditable under current protocols but may be subject to review if other evidence suggests Condition 2 violation (see Scenario F). Honest completion of Form 12-B is critical for audit compliance.*

  ---

  **Revision History:** Rev. 1 (Initial), Rev. 2 (Added Vest Trigger Stipulation), Rev. 3 (Clarified Waiver Impact), Rev. 4 (Refined Proportionality Matrix - Annex F v3.1), Rev. 5 (Added Malicious Intent Scenario), Rev. 6 (Revised Vest Trigger Logic - Annex D Rev.1), Rev. 7 (Incorporated Annex F v4.0, Added Age Differential Scenario, Updated Form 12-B guidance).

  **Footnotes:**
  <sup>1</sup> *WG-PROP is examining methodologies including Quality-Adjusted Life Years (QALYs) and variations in societal contribution weighting. Initial findings suggest significant complexity and potential auditability challenges. The current prohibition on individual characteristic differentiation within Condition 4 calculation stands as the only administratively feasible and auditable standard at this time. OEA Directive 24-05 mandates strict adherence to Annex F v4.0 pending further notice, notwithstanding philosophical debates on commensurability.*
