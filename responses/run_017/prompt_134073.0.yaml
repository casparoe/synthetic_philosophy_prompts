answer: |-
  Here’s a breakdown addressing your core questions about digital preservation’s assumptions on time, structured as requested:

  ---

  ### 1. What the practice strictly presupposes (~200 words)  
  Digital preservation strictly presupposes **causal asymmetry** and **irreversibility of information decay**. It assumes time has a direction where:  
  - Past states *cause* later states, but not vice versa.  
  - Information degradation (bit rot, format obsolescence) progresses forward and cannot spontaneously reverse.  
  - Reliable restoration *only* comes from prior backups, never future ones, as later states lack causal influence on earlier ones.  
  - **Trace asymmetry** is fundamental: past states leave multiple recoverable traces (copies, logs, hashes), while future states leave none. This enables error detection/correction using *only* historical data.  
  - **Determinism in computation** underpins "recipe" preservation: identical inputs + code *must* reproduce the same output when run forward in time. Running a process "backward" to infer inputs from outputs is assumed impossible or impractical.  
  These are operational necessities, not philosophical claims. Without causal and temporal asymmetry—where the past is fixed and the future is open—restoration, version control, and auditing (e.g., via cryptographic hashes) collapse.

  ---

  ### 2. What it merely fits well with (~150 words)  
  The practice aligns neatly with—but does not strictly require—deeper physical theories of time:  
  - **Thermodynamic arrow**: Entropy increase explains *why* media degrades irreversibly and coherent traces dissipate. Low initial entropy (Big Bang) enables the ordered states archives rely on.  
  - **Cosmological arrow**: A universe expanding from a low-entropy past reinforces the one-way flow.  
  - **Psychological/perceptual arrow**: Human experience of "past as fixed" mirrors archival logic.  
  However, preservation could function in a universe with a weaker **statistical arrow**, where time asymmetry holds probabilistically but not absolutely (e.g., occasional spontaneous "un-rotting" of files). As long as entropy *usually* increases and trace asymmetry *typically* holds, backups remain viable. The field’s resilience stems from redundancy (many copies), not fundamental physics.

  ---

  ### 3. Traces vs. entropy (~150 words)  
  **Trace asymmetry** (past states leave traces; future states don’t) and **entropy asymmetry** (systems evolve toward disorder) are deeply linked but distinct:  
  - Entropy explains *why* traces form: low-entropy past states (e.g., a written file) leave high-entropy "residue" (heat, scattered bits) that *correlates* with the past. Future states lack such residue.  
  - However, trace asymmetry is **epistemological**: it enables *reconstruction* of the past. Entropy is **ontological**, governing physical decay.  
  - The entropy arrow enables trace asymmetry but doesn't fully dictate it. Even in a statistically asymmetric universe, trace asymmetry could fail locally (e.g., no backups exist). Archives mitigate this via redundancy, leveraging entropy’s statistical bias to *create* recoverable traces.  
  Thus, entropy provides the physical basis, while trace asymmetry is the operational principle archives exploit.

  ---

  ### 4. Bits vs. recipe (~150 words)  
  **Bits preservation** (exact copies) directly relies on time’s arrow:  
  - Assumes physical/media decay is irreversible.  
  - Treats the artifact as a unique historical object tied to a specific past state.  

  **Recipe preservation** (code + inputs) *seems* timeless—re-deriving outputs feels like Platonic retrieval. Yet it still assumes asymmetry:  
  - Computation is deterministic *forward in time*. Re-running code mimics causal history.  
  - The "same result" claim depends on time-bound logic: identical inputs + process *at a later time* must match the *past* output. This presumes computational processes are reversible only by replaying forward.  
  - Crucially, the recipe *itself* must be preserved as bits, inheriting time-asymmetric decay risks.  
  Both methods thus depend on irreversibility: bits via media decay, recipes via the impossibility of reversing computation to "discover" lost inputs.

  ---

  ### 5. What I can safely say in print (~100 words)  
  > "Digital preservation assumes time flows irreversibly: files decay, they don’t heal; backups restore from the past, not the future. This relies on the observable fact that past states leave traces (copies, logs), while future states do not. Though this aligns with physics—entropy tends to increase, erasing information—the field only strictly requires that decay is practically irreversible and traces are recoverable. Whether preserving exact bits or regenerating outputs from code, both methods treat the past as fixed and unchangeable. If time’s arrow were merely statistical, occasional anomalies might occur, but robust redundancy would mitigate them."

  ---

  ### Key takeaways for your piece
  - **Core presupposition**: Operational irreversibility + trace asymmetry.  
  - **Physics link**: Thermodynamics explains *why* these hold, but archives only require *that* they hold.  
  - **Recipe illusion**: "Re-deriving the same result" still relies on forward-time determinism.  
  - **Robustness**: Current methods would withstand a statistical (not fundamental) arrow of time.  
  - **No overhaul needed**: Even if time’s arrow is perspectival, archival practice wouldn’t change—it addresses *observed* asymmetry.
