prompt: |-
  I am writing the second chapter of my thesis, on whether the information idiom in molecular biology is doing explanatory work or is an elaborate heuristic, and I have got myself into a position I cannot accept and cannot locate the fault in. The argument below is my reconstruction of a line I have been pushing in our reading group; several people there are molecular biologists who are impatient with philosophers telling them their practice is confused, and I would rather not have to tell them that either. I would be grateful for a diagnosis.

  (1) Molecular biology is committed to DNA carrying information in a sense that is not merely decorative: codons specify amino acids, regions are annotated as coding or non-coding, polymerases are described as reading, and mutations are described as errors that proofreading and repair machinery corrects. If this talk were only a façon de parler, the chapter would be short; I take it that it is not.

  (2) Suppose DNA carries information merely in the sense in which one state carries information about another whenever the two are reliably correlated, with nothing required to be reading the one as a sign of the other. Then information is everywhere: tree rings carry information about rainfall, smoke carries information about fire, a footprint carries information about the animal that made it. In that sense genes carry information, but so does everything, and the idiom seems to add nothing to ordinary causal talk. So on the correlational reading the notion is trivial and does none of the work biology wants from it.

  (3) For the notion to be distinctive, it must be the sort of thing that can go wrong. A codon can specify the wrong amino acid; a sequence can mislead the machinery that acts on it; a message can be corrupted. Pure correlation cannot be wrong. A footprint is never a false footprint, and tree rings do not lie. So genetic information must be semantic: it must have content capable of misrepresentation.

  (4) The only naturalistically respectable way to get content capable of misrepresentation, so far as I can see, is to fix a state's content by its function, understood as what it was selected to do. A given codon means leucine rather than merely causing leucine to be inserted because codons of that type were selected for producing leucine. Selection history supplies the distinction between what a state does and what it is supposed to do, and misrepresentation is doing the latter's failing.

  (5) But then anything lacking the relevant selection history carries no information at all: newly arisen sequences on their first replication cycle, sequences whose effects are incidental by-products of neighbouring function, transcripts that happen to be produced and do nothing, and, most awkwardly, the constructs of synthetic biology, which molecular biologists describe in perfectly informational terms on the basis of a design and not of a history. Yet these descriptions are empirically fruitful, which they should not be if they are empty.

  (6) Worse, on this account a code needs a reader, and in the actual cell the reader is itself part of the message: the transfer RNAs and the enzymes that charge them are themselves products of the very system they interpret. The interpretation of the code appears to be encoded in the code, which looks less like a grounding of content than like a circle.

  (7) So either genetic information is trivial, or it is restricted in a way that makes a great deal of successful molecular biology illegitimate, or it rests on a circular account of interpretation. I cannot accept any of the three, and my own suspicion is that something illegitimate happens in the move from (3) to (4): I have been offered the reply that genes are distinctive not as bearers of content but as causes of a specific kind — causes that make a difference to which outcome occurs, in a way that cytoplasm or ambient temperature does not — and I do not see how this answers the difficulty, since a specific cause cannot be mis-specific, and my worry in (3) was precisely about being wrong.

  Which step do you reject, why does it look fine as written, and what does rejecting it cost me? I would like, if I can, to retain (1) and (5) — I do not want to tell the molecular biologists in the room that their practice is confused — and I am more willing than not to give up (4) if something better can be put in its place. Please price the alternatives as well as naming the step: in particular, tell me what I would have to say about mutations being errors, and about the arbitrariness of the codon-to-amino-acid mapping, on each of the options you canvass.
reasoning: |-
  Okay, let me try to unpack this user's problem. They're stuck in their thesis chapter about genetic information, facing a trilemma where all options seem flawed. They want to keep molecular biology's informational talk substantive without falling into triviality, historical restriction, or circularity. 

  First, I notice their dilemma is structured very logically—six steps leading to three unacceptable conclusions. The user seems analytically rigorous but frustrated. Their hidden anxiety jumps out: they don't want to alienate biologist colleagues by dismissing their practices as confused. That's crucial context—any solution must respect actual lab discourse.

  Hmm, their sticking point is step 4 (selectionist teleosemantics). But step 3's "misrepresentation requirement" feels solid to them. I wonder... does misrepresentation *need* teleosemantics? Maybe not. Let me mentally test alternatives.

  The user mentions a "specific cause" counterargument but dismisses it. Why? Ah—they think causation can't handle "error." But what if "error" in biology isn't semantic? Like a misfolded protein isn't "lying"—it's just dysfunctional. That clicks! Maybe "error" is teleonomic (current function) not teleological (historical purpose). 

  Synthetic biology examples are killer for teleosemantics. If designed DNA has information without evolutionary history, teleosemantics fails. Yet biologists call CRISPR edits "corrections"—so "error" must be definable without history. Current context-dependent function could work better here.

  The circularity worry (tRNA encoding its own interpreter) is thorny. But perhaps interpreters aren't "readers" in a semantic sense—just molecular shape-matchers. No meaning, just chemistry. That dissolves the circle into mere mechanism.

  Alternative approaches bubble up:
  - **Causal specificity**: Genes as difference-makers. Handles arbitrariness (codon mappings vary) and "error" (mutations disrupt function). Costs: "error" becomes functional failure, not falsehood.
  - **Organization-based teleonomy**: Focus on current system roles. Solves synthetic bio issue. Costs: Needs robust account of "function" sans history.
  - **Pragmatic/instrumental view**: Information as modeling tool. Preserves all biological talk. Costs: May feel too deflationary for user's aims.

  User wants to price each option. For causal specificity: "Mutation as error" becomes "disruption of typical causal outcome." For teleonomy: "Error is deviation from system-relative function." Both keep biologists' idioms intact without metaphysics.

  Biggest insight: Separating "indication" (correlation) from "function" (specificity/role) might resolve the trichotomy. Steps 2-3 slide between them—that's the illicit move! Correlation can't misrepresent, but functional states can malfunction. No semantics needed.

  I'll structure the reply to: 1) Diagnose the step 3→4 leap, 2) Offer causal specificity as primary alternative (respects their attachment to steps 1 & 5), 3) Note teleonomy as supplement, 4) Address synthetic biology and circularity head-on, 5) Explicitly "price" how each handles mutations/arbitrariness.

  User's tension is palpable—they need a solution that's both philosophically sound and lab-coat-compatible. Time to give them an escape hatch that doesn't betray their rigor or their collaborators.
answer: |-
  Your trilemma is compelling because each horn seems unavoidable given your premises—but the flaw lies precisely in **step (3)'s requirement that information *must* be semantic to avoid triviality**. This step smuggles in an unnecessary demand for "content capable of misrepresentation," which forces you into teleosemantics (step 4) and its problems (steps 5–6). Rejecting (3) doesn’t trivialize information; it reorients the debate toward **causal specificity and functional organization**. Below, I diagnose the error, propose alternatives, and "price" each option regarding mutations and codon arbitrariness.

  ---

  ### **Diagnosis: Why Step (3) is the Problem**
  - **What’s illicit**: Step (3) assumes that for information to be nontrivial, it *must* support normative "error" (misrepresentation). But biological "error" (e.g., mutations) isn’t inherently semantic—it can be understood as **deviation from a functional norm** without invoking content. A misfolded enzyme isn’t "lying"; it’s malfunctioning. 
  - **Why it looks persuasive**: The analogy to footprints/tree rings is misleading. Unlike passive correlations, genetic coding involves **causal specificity** (codons *determine* amino acids via precise physical interactions) and **arbitrariness** (any codon could, in principle, map to any amino acid). This allows for "errors" when outcomes deviate from the *typical causal pathway* of the system.
  - **Cost of rejection**: You must decouple "information" from semantics. "Error" becomes **functional disruption**, not misrepresentation. This preserves biology’s informational idiom without metaphysical commitments.

  ---

  ### **Alternative: Causal Specificity + Organizational Norms (Replaces Steps 3–4)**
  This approach grounds information in **difference-making causation** and **system-relative functions**, avoiding both triviality and teleosemantics.  
  - **Core argument**:  
    1. Genetic information is nontrivial because DNA sequences are **specific difference-makers** for outcomes (e.g., a codon *causally controls* which amino acid is added, unlike ambient temperature).  
    2. "Error" occurs when a mutation disrupts the **typical causal pathway** of a biological system (e.g., a stop codon appears where tyrosine should be).  
    3. Norms arise from **self-sustaining organization** (e.g., cells maintain metabolic cycles, replicate DNA). Functions are defined by current roles in sustaining this organization—not history.  

  - **Solves your trilemma**:  
    - **No triviality**: Information isn’t everywhere—only where causal specificity exists (e.g., codon-aa mapping > tree ring-rainfall).  
    - **No illegitimate biology**: Synthetic constructs have information because they’re *designed to play specific causal roles* in a system. New sequences acquire function when integrated into organizational norms.  
    - **No circularity**: "Readers" (e.g., tRNA) are physical interactors shaped by evolution but operate via chemistry, not interpretation. The "code" is a fixed mapping enforced by molecular binding affinities.  

  - **Costs/Pricing**:  
    - **Mutations as "errors"**: Framed as **disruptions of typical causal function** (e.g., a nonsense mutation halts translation, breaking protein synthesis). Not "falsehood," but *dysfunction* relative to the system’s self-maintenance.  
    - **Codon arbitrariness**: Explained by **contingent physical constraints** (e.g., tRNA binding pockets fix mappings). Arbitrariness reflects multiple realizable physical solutions—not semantics.  

  ---

  ### **Other Options (Less Recommended)**
  1. **Teleosemantics Lite (Weaken Step 4)**:  
     - Allow functions based on *future* selection or *designer intentions* (for synthetic biology).  
     - **Cost**: Still struggles with new sequences. "Errors" require counterfactuals (e.g., "This *would* be selected against").  
     - **Pricing**: Mutations are errors only if they reduce fitness; synthetic "corrections" derive meaning from designer goals.  

  2. **Pragmatic/Instrumental View**:  
     - Information is a **heuristic for predicting outcomes** (e.g., codon tables as lookup tools).  
     - **Cost**: May feel too deflationary. Doesn’t explain why the idiom is *uniquely* effective in biology.  
     - **Pricing**: Mutations are "errors" instrumentally (they disrupt predictions); arbitrariness is a useful abstraction.  

  ---

  ### **Handling Your Key Concerns**
  - **Synthetic biology**: Constructs carry information because they’re **integrated into a system with organizational norms** (e.g., a designed gene *functions* in a host cell). No history needed.  
  - **tRNA "circularity"**: The "reader" isn’t interpreting symbols—it’s a **physical interactor co-evolved with codons**. The system is self-referential but not viciously circular (like a self-assembling factory).  
  - **Molecular biologists’ practice**: Preserved! They use "information" to denote **precise causal control and reproducible functions**—not semantic content. Your account explains *why* their language works without confusion.  

  ---

  ### **Recommendation**
  Reject **step (3)** and reframe information via **causal specificity + organizational norms**. This:  
  - Retains (1) and (5) (biology’s practice is vindicated).  
  - Dumps (4) (no teleosemantics).  
  - Explains mutations as functional deviations, not semantic errors.  
  - Resolves synthetic biology and circularity issues.  

  This grounds "information" in what molecular biologists *actually track*: causal leverage and reproducible outcomes. The idiom works because it captures real patterns in complex systems—no metaphysics required. Your chapter can then explore how this distinguishes genetic information from mere correlation while avoiding your trilemma.
