prompt: |-
  I could use a hand turning heterophenomenology into an actual protocol. I've been reading the rationalist blogs since forever, I basically already buy the Dennett line — that a science of consciousness should treat subjects' first-person reports as text to be interpreted rather than as authoritative verdicts about what experience is really like, that you build up the subject's heterophenomenological world out of what they're disposed to say, and that you don't settle the ontology by fiat — and now I have to make other people follow it. I'm the coordinator for the qualitative arm of a psilocybin trial for treatment-resistant depression: we run a ~40 minute semi-structured experience interview about 48 hours after each dosing session, transcripts get coded by two undergrad RAs, and I write the qualitative section. The PI wants a per-session yes/no on whether a mystical-type experience occured (the regulatory people apparently care), and I want to give her something that neither smuggles in a metaphysics nor, worse, manufactures the data.

  The bit I keep arguing about with my friend who's into phenomenology is one I think the standard heterophenomenology story handles badly, and it's the part I most want the procedure to deal with: the elicitation isn't neutral. If I ask "did you feel a sense of unity or oneness", people say yes, and then I've created the very report I was going to treat as neutral third-person data — the interview is itself an intervention on the thing it measures. So I need the protocol to track the provenance of every report: whether the vocabulary came from the participant or from us (the consent form, the scale we administer afterwards, the culture, the therapist who sat with them), whether it was produced before or after we handed them any vocabulary at all, and what to do when the two come apart. I also need rules for the awkward cases: the participant who says words fail and they can't describe it; the one who reports nothing at day 2 and then at the three-month follow-up says it was the most real thing that's ever happened to them; and the one who is plainly performing what they think a mystical experience is supposed to sound like.

  Could you write me a one-page-ish protocol, ordered steps, that me and the RAs could actually run — what to ask first and why, what counts as a sufficient answer at each step, where the procedure stops with a "no" (don't code it, flag it, drop it), and where it hands the decision to a person because it's a values call rather than a factual one? Plus the transcription and codebook rules that follow from it: what has to be preserved verbatim, what has to be tagged, what we're forbidden from cleaning up into a tidier idiom. And an honest section on where the whole thing misfires given our constraints, since we can't do ten hours of repeated interviewing per participant and the PI does need her dichotomous outcome. Then run it on two cases: (1) a participant who three minutes in, unprompted, says something like "the room and I were sort of the same thing", and then later, after we've administered the scale, agrees that yes, unity, oneness, all of that; (2) the day-2-nothing / three-month-everything participant. At least one of those should come out with an answer I won't like — I'd rather find out which one now, while I still have time to argue with the PI about it.
reasoning: |-
  We are designing a heterophenomenological protocol for a psilocybin trial's qualitative arm. The goal is to determine per session whether a mystical-type experience occurred, without smuggling in metaphysics or manufacturing data. Key challenges: avoiding leading questions, tracking provenance of vocabulary, dealing with ineffability, delayed reports, and performative responses.

  Protocol Principles:
  1. **Neutral Elicitation**: Avoid priming by withholding mystical experience vocabulary until late in the interview.
  2. **Provenance Tracking**: Tag every report with the source of the vocabulary (participant's own, from scales, from interview, etc.) and the timing relative to any provided vocabulary.
  3. **Verbatim Preservation**: Record and transcribe exactly, including hesitations, and tag when the participant uses terms from external sources.
  4. **Hierarchical Questioning**: Start with open-ended, non-leading questions and progressively move to more specific ones only after the participant has exhausted their own descriptions.
  5. **Decision Rules**: Define clear criteria for coding, with flags for ambiguous cases and a procedure for handling delayed reports.

  Protocol Steps:

  **Pre-Interview:**
  - Administer standard scales (e.g., Mystical Experience Questionnaire, MEQ) *after* the qualitative interview to avoid priming. (If already administered pre-interview by study design, note it and adjust.)

  **Interview Protocol (40 minutes, semi-structured):**

  1. **Initial Open-Ended Recall (10 minutes):**
     - Ask: "Please describe your experience during the session in as much detail as you can remember. Start from the beginning and go through to the end, including any thoughts, feelings, sensations, or images that stood out."
     - Instructions for RAs: Do not interrupt. If the participant stops early, prompt once: "Is there anything else you remember?" Then move on.
     - Record verbatim. Tag any term that matches vocabulary from the consent form, therapy, or culture (e.g., "oneness", "unity", "mystical") as [POSSIBLE EXTERNAL] if it appears without prior introduction by the interviewer.

  2. **Probe for Specific Domains (15 minutes):**
     - Ask about each domain (without using mystical terms) in a fixed order:
       - Sensory: "Did you notice any changes in what you saw, heard, or felt in your body?"
       - Emotional: "What emotions did you feel during the experience?"
       - Cognitive: "Did your thoughts change in any way? Were there any shifts in how you thought about yourself or the world?"
       - Relational: "Did you feel any different about other people or your relationships?"
       - Existential/Spiritual: "Did the experience change how you see your life or its meaning?" (Avoid terms like "spiritual" if possible; if necessary, use "bigger picture".)
     - If the participant uses a term from an external source, note it and ask: "What do you mean by [term]?" to get their own description.
     - Record verbatim. Tag any external vocabulary.

  3. **Non-Suggestive Probes for Mystical-Type Features (10 minutes):**
     - Ask about each mystical dimension (unity, transcendence, sacredness, ineffability, etc.) without using the standard terms. For example:
       - Unity: "Did you have a sense of everything being connected or part of the same thing?"
       - Transcendence of time/space: "Did you feel as if time or space didn't work the way they usually do?"
       - Sacredness: "Did you feel that the experience was very special or deeply meaningful in a way that's hard to put into words?"
       - Ineffability: "Were there parts of the experience that are hard or impossible to describe?"
     - If the participant says yes, ask for a description in their own words. If they use a term from the MEQ or other source, tag it and probe: "When you say [term], what does that feel like to you?"
     - Note: These questions are asked only after the participant has given their own account.

  4. **Direct Vocabulary Check (5 minutes):**
     - Only at the end, introduce the specific terms (e.g., "Some people use words like 'oneness' or 'unity' to describe their experience. Does that match anything you felt?")
     - Record their response (yes/no) and any elaboration. Tag any agreement as [POST-VOCABULARY].
     - If they agree, ask: "How much does that word capture what you felt?" (to gauge if it's a fit or a forced label).

  **Post-Interview:**
  - Administer the MEQ or other scales.

  **Transcription Rules:**
  - Transcribe verbatim, including filler words, pauses, and non-verbal cues (e.g., [laughs], [long pause]).
  - Tag every term that appears in the MEQ or that was introduced in the consent form, therapy, or by the interviewer as:
    - [PARTICIPANT-INITIATED]: if the participant used it before any introduction in the interview.
    - [INTERVIEWER-INTRODUCED]: if first used by the interviewer in step 3 or 4.
    - [SCALE-INTRODUCED]: if the participant uses a term from a scale administered before the interview (if unavoidable).
    - [CONTEXT-INTRODUCED]: if from consent form, therapy, or cultural context (requires judgment; when in doubt, tag).

  **Coding Rules for Mystical-Type Experience (Per Session):**
  - Two independent RAs code each transcript.
  - **Primary Data**: Only participant-initiated descriptions (from steps 1 and 2) are used for the main coding of mystical experience. Descriptions must be spontaneous and not in response to mystical vocabulary.
  - **Codebook for Mystical Experience**: Based on classic dimensions (unity, transcendence, sacredness, ineffability, positive mood). Each dimension must be present in the participant's own words (not necessarily the exact terms, but the concept). For example:
    - Unity: participant describes self merging with surroundings, loss of boundaries, everything being one.
    - Transcendence: beyond time/space, feeling of eternity or infinity.
    - Sacredness: deeply meaningful, holy, or of ultimate truth.
    - Ineffability: explicitly states it's hard to describe or beyond words.
    - Positive mood: joy, peace, love.
  - **Threshold**: At least 3 of the 5 dimensions must be present in the primary data for a "yes" on mystical experience.

  - **Secondary Data**: Post-vocabulary agreements (step 4) are not used for coding the presence of the experience but are noted for context. If the primary data is absent but the participant agrees with the vocabulary, it is coded as "no" for mystical experience but flagged for discussion.

  **Handling Edge Cases:**
  - **Ineffability**: If the participant says words fail, code for ineffability if they explicitly say so. Also, note if they later provide a description. If they don't describe any content, then other dimensions cannot be coded -> leads to "no".
  - **Delayed Report (e.g., three-month follow-up)**: The primary coding is based on the day-2 interview only. If the participant reports nothing at day 2 but later describes a mystical experience, the session is coded as "no". However, note this in the report as a limitation and analyze the follow-up separately.
  - **Performative Response**: If the RAs suspect performance (e.g., uses clichéd mystical language without depth, contradicts earlier statements), they flag it. The coordinator (you) reviews and decides. If deemed unreliable, code as "no" and note the concern.

  **Decision Process:**
  - RAs code independently using the codebook.
  - Disagreements are resolved by the coordinator.
  - Final per-session code: 
    - "Yes": At least 3 dimensions present in primary data.
    - "No": Otherwise.
  - Flagged cases (e.g., delayed reports, performative) are reviewed by the coordinator and PI for potential exclusion or sensitivity analysis.

  **Limitations and Caveats:**
  - **Time Constraints**: With only 40 minutes, we may not capture the full experience. Some reports may be shallow. We accept this and code what is present.
  - **Dichotomous Outcome**: The mystical experience is complex and dimensional. A yes/no may lose nuance, but it is required by regulators. We document the richness in the qualitative section.
  - **Priming Risk**: Despite our design, participants may have been exposed to mystical concepts via consent forms or therapists. We track provenance to mitigate.
  - **Delayed Reports**: We miss experiences not reported at 48 hours. We cannot use follow-up data for the per-session outcome due to recall bias and potential contamination.

  **Running the Protocol on Cases:**

  **Case 1: Participant who says, unprompted, "the room and I were sort of the same thing" and later agrees with "unity" after the scale.**
  - Step 1: Participant says "the room and I were sort of the same thing" -> tagged as [PARTICIPANT-INITIATED] for unity.
  - Step 2: If they elaborate, we code for other dimensions.
  - Step 3: They may report more on unity without new vocabulary.
  - Step 4: They agree with "unity" -> tagged as [POST-VOCABULARY]. This is not used for coding.
  - Coding: The spontaneous report of unity (in step 1) counts as one dimension. If they also report ineffability and sacredness spontaneously, they get 3 dimensions -> "yes". If not, "no". The later agreement is noted but not counted.

  **Case 2: Day-2-nothing / three-month-everything.**
  - Day-2 Interview:
    - Step 1: No description of mystical features.
    - Steps 2-3: No positive reports of mystical dimensions.
    - Step 4: They do not agree with mystical vocabulary (or do, but we ignore for primary coding).
  - Coding: No dimensions present in primary data -> "no".
  - Three-month follow-up: Not used for the per-session outcome. We note the discrepancy in the qualitative section as a limitation.

  **Which one might be disliked?** 
  Case 2 comes out "no", which the PI might dislike because the participant later reports a mystical experience. However, by our protocol, we cannot use the delayed report for the per-session outcome. This is a necessary constraint to avoid recall bias and maintain consistency. Argue that the day-2 report is the most reliable for the acute experience and that the follow-up may be influenced by post-hoc interpretation.

  **Final Protocol Outline:**

  1. **Interview Steps:** As above.
  2. **Transcription:** Verbatim with tagging.
  3. **Coding:** Based on spontaneous reports only; threshold of 3/5 dimensions.
  4. **Edge Handling:** Strict rules for ineffability, delayed reports (ignore for per-session), and performative (flag and review).
  5. **Output:** Per-session yes/no, with flags for questionable cases.

  This protocol minimizes contamination, tracks provenance, and delivers a dichotomous outcome while preserving heterophenomenological principles.
answer: |-
  Below is a practical, step-by-step protocol for implementing heterophenomenology in your psilocybin trial's qualitative interviews. It prioritizes provenance tracking, minimizes elicitation bias, and provides clear rules for coding and edge cases. The protocol is designed for a 40-minute interview, with explicit "stop points" for coding decisions, transcription rules, and handling of the PI's required dichotomous outcome (mystical experience: yes/no). Limitations are outlined upfront, and the protocol is applied to your two test cases.

  ---

  ### **Heterophenomenological Interview Protocol: Psilocybin Mystical-Type Experience Assessment**  
  **Version:** 1.0  
  **Purpose:** To elicit and code first-person reports of psychedelic experiences without ontological assumptions, while tracking vocabulary provenance for bias detection.  
  **Core Principle:** Treat participant reports as *textual data* to be interpreted, not authoritative truths. Prioritize spontaneous, unprompted descriptions over post-vocabulary agreement.  

  ---

  ### **I. Protocol Workflow**  
  **Pre-Interview Rules:**  
  - **Consent Form Language:** Exclude terms like "mystical," "unity," or "oneness." Use neutral phrasing (e.g., "altered states of consciousness").  
  - **Timing:** Conduct interview 48h post-dosing. Administer scales (e.g., Mystical Experience Questionnaire, MEQ) *after* the interview to avoid priming.  
  - **Materials:** Audio recorder, timestamped transcript template (see Section III).  

  **Interview Steps (40 min; Semi-Structured):**  
  *Rules for Interviewer (You/RA):*  
  - Use open-ended questions; avoid leading terms (e.g., "unity," "sacred").  
  - Probe for descriptions, not interpretations (e.g., "What did you notice?" not "Did you feel connected?").  
  - Record verbatim; note non-verbals (e.g., pauses, laughter).  

  1. **Step 1: Unprompted Narrative (0–15 min)**  
     - Ask: **"Please describe your experience during the session from beginning to end, in as much detail as you can. Include anything that felt significant, even if it’s hard to put into words."**  
     - *Probes (if stalled):* "What happened next?" or "Can you say more about that?"  
     - **Stop Point:** End at 15 min even if incomplete.  
     - *Why:* Captures spontaneous language before any vocabulary contamination.  

  2. **Step 2: Non-Suggestive Domain Probes (15–30 min)**  
     - Ask about domains *without* using mystical terminology:  
       - **Sensory:** "Did anything unusual happen with your senses (e.g., sights, sounds, touch)?"  
       - **Emotional:** "What emotions showed up during the experience?"  
       - **Self/World Perception:** "Did your sense of yourself or the world around you change in any way?"  
       - **Time/Space:** "Did time or space feel different?"  
       - **Meaning:** "Did anything feel deeply meaningful or important?"  
     - *Probes:* For vague answers (e.g., "It was weird"), ask: **"What did ‘weird’ feel like?"**  
     - **Stop Point:** If participant uses external vocabulary (e.g., "oneness"), tag it (see Section III) and ask: **"When you say [term], what does that mean to you?"**  

  3. **Step 3: Vocabulary Check (30–40 min)**  
     - *Only now* introduce external terms: **"Some people use words like ‘oneness,’ ‘unity,’ or ‘mystical’ to describe their experiences. Do any of these match what you felt?"**  
     - For "yes": Ask **"How well does [term] fit?"** (scale: 1=not well, 5=perfectly).  
     - For "no": Do not push.  
     - **Stop Point:** End interview at 40 min.  
     - *Why:* Isolates post-vocabulary responses to track bias.  

  ---

  ### **II. Coding Rules for Mystical-Type Experience (Per Session)**  
  **Codebook Definition:**  
  Mystical-type experience requires **≥3 of 5 core dimensions** in the participant’s *spontaneous descriptions (Steps 1–2)*:  
  1. **Unity/Oneness:** Loss of boundaries between self/world (e.g., "I melted into everything").  
  2. **Transcendence:** Feeling beyond time/space (e.g., "Time stopped").  
  3. **Sacredness:** Profound meaning/divine quality (e.g., "Felt like ultimate truth").  
  4. **Ineffability:** Explicit inexpressibility (e.g., "Words can’t capture it").  
  5. **Positive Mood:** Deep peace/joy (e.g., "Overwhelming bliss").  
  *Exclude* dimensions only reported in Step 3 (post-vocabulary).  

  **Coding Procedure (for RAs):**  
  1. **Transcribe:** Verbatim (see Section III).  
  2. **Tag Provenance:**  
     - `[SELF]`: Participant’s own vocabulary (Steps 1–2).  
     - `[EXT]`: Term from consent, scales, therapy, or culture (e.g., "oneness" if in MEQ).  
     - `[POST]`: Term first used/repeated in Step 3.  
     - `[AMBIG]`: Unclear source (requires coordinator review).  
  3. **Code Dimensions:**  
     - Only `[SELF]` descriptions count toward the 3/5 threshold.  
     - Code each dimension as 1 (present) or 0 (absent).  
     - Use direct quotes; no inference (e.g., "I became the universe" → unity=1; "I felt connected" → unity=0 [vague]).  
  4. **Decision Rules:**  
     - **"Yes" (Mystical):** ≥3 dimensions with `[SELF]` evidence.  
     - **"No" (Not Mystical):** <3 dimensions with `[SELF]` evidence.  
     - **"Flag" (Ambiguous):** Refer to coordinator if:  
       - ≥3 dimensions present but `[EXT]` tags in key quotes.  
       - Discrepancies between steps (e.g., Step 1 denial vs. Step 3 agreement).  

  **Edge Case Handling:**  
  - **Ineffability ("Words fail"):**  
    - Code ineffability=1 if participant explicitly states it (e.g., "I can’t describe it").  
    - If no other dimensions described, code as "no" (insufficient data).  
  - **Delayed Report (Day 2 nothing → 3-month everything):**  
    - Code based *only* on 48h interview → **"no."**  
    - Flag for PI: "Delayed report at follow-up; not included in per-session coding due to recall bias."  
  - **Performative Response:**  
    - Code "no" if language is overly scripted (e.g., recites MEQ items verbatim) with no `[SELF]` depth.  
    - Flag: "Possible performance bias; no spontaneous evidence."  

  ---

  ### **III. Transcription & Codebook Rules**  
  **Transcription:**  
  - Preserve verbatim speech (e.g., "um," repetitions).  
  - **Tag in Transcript:**  
    - Non-verbals: `[pause]`, `[laughs]`, `[cries]`.  
    - Provenance: `[SELF]`, `[EXT]`, `[POST]`, `[AMBIG]` (e.g., "It was all one `[SELF]`").  
    - External sources noted (e.g., `[EXT: MEQ]`, `[EXT: therapist]`).  
  - **Forbidden:** No "cleaning up" grammar or replacing words (e.g., "kinda oneness" → not changed to "kind of oneness").  

  **Codebook for RAs:**  
  - Include examples:  
    - Unity `[SELF]` example: "The room and I were the same thing." → Code 1.  
    - Unity `[EXT]` example: "Yeah, I felt ‘oneness,’ like the questionnaire said." → Code 0.  
  - Training: RAs must pass a quiz with 5 sample transcripts (inter-rater reliability ≥80%).  

  ---

  ### **IV. Limitations & Caveats**  
  1. **Elicitation Bias Unavoidable:** Even open-ended questions shape responses. We mitigate via provenance tracking but cannot eliminate cultural/therapeutic contamination.  
  2. **Dichotomous Outcome Flattens Data:** A yes/no loses nuance (e.g., partial mystical features). Argue to PI: "We recommend supplementing with qualitative depth in the final report."  
  3. **Time Constraints:** 40 min may miss subtle details. No fix; accept as trial limitation.  
  4. **Delayed/Performative Reports:** Risk of false negatives/positives. Protocol flags these but cannot resolve without longer/multiple interviews.  
  5. **PI Expectation Management:** Expect 20–40% "no" rates due to strict `[SELF]` rules. Preemptively share test cases with PI to justify approach.  

  ---

  ### **V. Test Case Applications**  
  **Case 1: Participant says unprompted, "The room and I were sort of the same thing" (Step 1), later agrees with "unity" (Step 3).**  
  - **Step 1:** "The room and I were sort of the same thing" → Tagged `[SELF]`. Coded as **unity=1**.  
  - **Step 2:** No other spontaneous dimensions → Unity=1 only.  
  - **Step 3:** Agrees "yes" to "unity" → Tagged `[POST]` (not used for coding).  
  - **Coding:** 1/5 dimensions → **"No" for mystical experience**.  
  - **RA Flag:** "Unity reported spontaneously, but insufficient dimensions for threshold. Step 3 agreement not counted."  
  - **Why You Might Dislike This:** The participant clearly experienced unity, but the protocol demands ≥3 dimensions. This prioritizes robustness over sensitivity. Argue to PI: "We avoid false positives by requiring multifaceted evidence."  

  **Case 2: Participant reports "nothing" at 48h, but at 3-month follow-up says, "It was the most real thing."**  
  - **48h Interview:**  
    - Step 1: "Nothing stood out; just relaxed." → No dimensions.  
    - Step 2: Denies changes in self/world, time, meaning.  
    - Step 3: Disagrees with "unity/mystical."  
  - **Coding:** 0/5 dimensions → **"No" for mystical experience**.  
  - **Flag:** "Delayed report at 3 months; not coded due to recall bias risk."  
  - **Why You Might Dislike This:** A profound experience is missed. However, per-protocol, we cannot use follow-up data for the per-session outcome. **This is the answer to argue with the PI about now.** Emphasize: "The 48h window balances memory accuracy and acute effects. Including delayed reports introduces post-hoc bias."  

  ---

  ### **Final Recommendations**  
  - **For PI Negotiation:** Share Case 2 as a critical limitation. Propose: "We code 48h interviews as primary outcome but add a sensitivity analysis excluding delayed-report participants."  
  - **RA Training:** Use your test cases in onboarding.  
  - **Audit Trail:** Log all flags and coordinator decisions for transparency.  
  - **Protocol Flexibility:** Revise codebook examples annually based on data.  

  This protocol operationalizes heterophenomenology by making vocabulary provenance explicit, minimizing contamination, and delivering a defensible dichotomous outcome. It accepts that some false negatives (Case 2) are the cost of avoiding manufactured positives.
