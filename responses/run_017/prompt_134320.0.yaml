  ### Conclusion  
  The investigator will find corruption in the malaria referral due to enrichment of the office and staff associates, with an inferred systemic link to contractors. Her unspoken rule targets the **office as the object**, where corruption arises when private benefits undermine institutional impartiality. The separating case (7) would validate that personal/associate enrichment (not abstract office gains) is decisive. This approach prioritizes systemic integrity over transactional guilt, explaining why clearances in cases 4–6 are as revealing as findings.
