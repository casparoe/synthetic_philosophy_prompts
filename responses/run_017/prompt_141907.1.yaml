answer: |-
  Here is the handbill text, designed as a 1610 broadsheet parodying a modern "deprecation notice," grounded in Kepler's actual reforms and your specified requirements:

  ---

  **ÖFFENTLICHE BEKANNTMACHUNG UND REVIDIERTE PREISORDNUNG**  
  **der Kayserlichen Mathematischen Astrologiae**  
  *Durch Johannes Kepler, Kayserlicher Mathematiker*  
  *Prag, den 20. Tag Martii, Anno Domini 1610*

  **I. ABGESCHAFFTE UND UNGÜLTIGE PRAKTIKEN (Verworfen als unnützer Ballast und Quell häufiger Irrthümer):**

  1.  **Die Zwölf Häuser:** Insonderheit jene müßigen Fragen betreffend Diebesgut, verlegte Schlüssel, und ob der Knecht treu sey. Das Firmament ist keine Landkarte für Küchengeschirr.
  2.  **Die Planetenwürden & Schwächen:** Exaltationen, Falle, Triplizitäten, Termini. Die Planeten walten frei, nicht nach erträumten Zirkeln auf dem Papier.
  3.  **Die Zeichen des Thierkreises:** Ihr spezifischer Einfluss (als ob ein Widder anders brummt als ein Stier!) wird hinfällig. Nur die reinen Winkel zählen.
  4.  **Wahllose Nativitäten:** Geburtsfiguren, erstellt ohne Wissen und Willen des Betroffenen, sind null und nichtig. Die Seele muss bereit sein, den Accord zu hören (siehe Punkt II.3).
  5.  **Electiones (Wahltermine):** Termine für Heirat, Reiseantritt, Aderlass, oder den Kauf eines Huhns. Die Gestirne diktiren nicht den Stundenschlag für irdische Geschäffte.
  6.  **Monströse Aspekte:** Semi-Sextil, Quincunx, und anderer winkeliger Kram, der die himmlische Geometrie verunstaltet.

  **II. BEI BEHALTENE UND VERBESSERTE GRUNDLAGEN (Geprüft und bewährt nach harmonischen Prinzipien):**

  1.  **Die Wahren Orte:** Berechnung aus den *wirklichen* Planetenbahnen (nach ellipsenförmiger Bewegung), nicht aus faulen mittleren Tafeln. Wahrheit hat ihren Preis (siehe Punkt IV).
  2.  **Die Kern-Aspekte:** Konjunktion (0°), Sextil (60°), Quadrat (90°), Trigon (120°), Opposition (180°). Die Sprache der Proportionen.
  3.  **Die NEUEN Aspekte des Fünften Tons:** Quintil (72°), Biquintil (144°). Offenbart durch die himmlische Harmonik, bisher vernachlässigt.
  4.  **Das Prinzip der Seelischen Resonanz:** Gestirnische Aspekte wirken nicht *directe* auf den Lehmkloss des Körpers, sondern auf die *vernünfftige Seele*, welche die Harmonien erkennt wie ein Musikus den Accord. *Ergo:* Wirkung nur, wo eine empfängliche Seele ist.
  5.  **Die Erdenseele:** Gleichermaßen empfänglich für kosmische Harmonien, daraus entstehet Wetter und klimatische Neigung (nach bestem Vermögen und Erfahrung angezeigt).

  **III. BEKANNTE UNVOLLKOMMENHEITEN UND EINSCHRÄNKUNGEN (Wahrhaftig berichtet, zur Vermeidung unnützer Klagen):**

  1.  **Resonanz vorausgesetzt:** Prognostication hängt ab vom Zustand der empfangenden Seele. Ein verdorbener Geist hört vielleicht den Accord nicht. Schuld liegt nicht am Mathematiker.
  2.  **Erdenseele unberechenbar:** Wetterprognosen bleiben schwierig, da die Erdenseele launischer ist als eine Jungfer am Ball. Grobe Tendenzen nur.
  3.  **Keine Rückblicke:** Die Reform gilt ab Verkündigung. Alte Scharteken nach abgeschaffter Methode sind wertloser als Kaminholz.
  4.  **Keine Heimlichkeit:** Siehe Punkt I.4 & II.4. Wirkung *nur* bei persönlicher Vorstellung und unterzeichnetem **Consensus Animae** (Formular beim Drucker erhältlich). Ohne Consensus ist jede Figur ein leeres Blatt. Nachträgliche Anfechtung ausgeschlossen.

  **IV. REVIDIERTE PREISORDNUNG (Effektiv Anno 1611):**

  1.  **Persönliche Nativity (Einmalig, mit Consensus Animae):** 2 Reichsthaler.
  2.  **Jahres-Prognostication (Allgemein, über Wetter, Kriegsneigungen, Seuchenluft etc.):** 1 Reichsthaler, 15 Groschen.
  3.  **KAYSERLICHER KALENDER & PRACTICA auf das Jahr 1611:** **1 Reichsthaler.**
      *   *Bemerkung:* Diese Practica ist *kürzer* und prägnanter als die des Jahres 1610. Dies ist *Vorsorge:* Wo weniger gesagt wird, ist weniger Raum für Mißverständnis. Kürze ist die Schwester der Genauigkeit. Der erhöhte Preis entspricht dem gesteigerten Wert konzentrierter Weisheit und verminderter Fehleranfälligkeit. Frühere Käufer ungültiger Methoden haben Anspruch auf *keinen* Nachlass.

  **V. FRAGEN, SO DEM DRUCKER OFT GESTELLET WURDEN (Mit Antwort der Mathematischen Kanzley):**

  *   **Frage:** Warum kostet die kürzere Practica mehr?
      *   **Antwort:** Siehe Punkt IV.3. Kürze erfordert größere Sorgfalt und reduziert Irrtumsmöglichkeiten. Ist reine Butter nicht teurer als Buttermilch?
  *   **Frage:** Kann ich die Nativity meines Nachbarn heimlich bestellen?
      *   **Antwort:** Nein. Siehe Punkt I.4 & III.4. Ohne dessen Seele und Consensus vergebene Liebesmüh'. Und eine Sünde obendrein.
  *   **Frage:** Gilt mein altes Lehrbuch noch?
      *   **Antwort:** Als historische Kuriosität vielleicht. Für praktische Astrologie? Siehe Punkt I. und III.3. Weg damit.
  *   **Frage:** Warum soll ich noch bezahlen, wenn so vieles wegfällt?
      *   **Antwort:** Was bleibt, ist der reine Kern, geprüft durch die Mathematik und himmlische Harmonielehre – wahrhaftigere Kunst zu höherem Preis. Soll die närrische Tochter nicht die weise Mutter (Astronomia) ernähren? Wer die Kunst erhalten will, muss sie bezahlen. *Scientia non est gratis.*
  *   **Frage:** Was, wenn die Practica 1611 unrecht behält?
      *   **Antwort:** Siehe Punkt III.1 & III.2. Die Seele (des Lesers oder der Erde) mag nicht mitgespielt haben. Oder der Himmel gab einen neuen, unvorhergesehenen Accord. Die mathematische Basis der Aspekte bleibt unerschütterlich. Kein Grund zur Rückgabe.

  *(Signet des Kayserlichen Mathematikers)*  
  *Gedruckt in der Hofbuchdruckerei, Prag*

  ---

  **Assessment of Historical Grounding & Exaggeration:**

  1.  **Core Doctrine:** The abolished list (Houses, Signs, Dignities, Elections, traditional Aspects beyond Ptolemy's 5) is accurate to Kepler's critiques (esp. in *Tertius Interveniens* and correspondence). The retained elements (True Places, Harmonic Aspects incl. Quintiles, Soul's Affinity for Harmonies, Earth-Soul for Weather) are central to Kepler's reformed astrology. His belief in the validity of his own nativity (with caveats) is documented.
  2.  **The "Consensus Animae":** This is the main invented wrinkle. While Kepler *did* emphasize the soul's receptivity to celestial harmony, he never required explicit consent. This satirical extension highlights the "unfalsifiable" nature of the reform – failure blamed on the client's soul, not the method. It's logically derived from his doctrine but pushed to a bureaucratic extreme for the joke and the "no refunds" policy. Historically, he *might* have refused certain questions, but not on these grounds.
  3.  **Pricing & Almanac Length:** Kepler constantly complained about money and the necessity of "foolish" astrology to fund astronomy. Selling calendars/prognostications was his main income. The specific justification for a *shorter, more expensive* almanac ("less said, fewer errors") is invented satire, perfectly capturing the "reductio" of the reformist move. It's plausible Kepler might have argued for the *value* of his more accurate methods, but this cynical pricing logic is the joke.
  4.  **Weather Prediction:** Kepler *did* theorize an Earth-soul (*anima terrae*) responding to aspects as the cause of weather. He *did* include weather predictions in his almanacs. Exaggeration: He was far more cautious and doubtful about *reliable prediction* than this notice implies. The notice presents it as a standard (if imperfect) service, which overstates Kepler's confidence.
  5.  **Register & Tone:** The deadpan, bureaucratic, slightly defensive tone, mixing technical terms with down-to-earth metaphors ("Lehmkloss des Körpers," "Butter/Buttermilch," "Jungfer am Ball"), feels plausible for an official notice aimed at both learned and common buyers. The Latin tag (*Scientia non est gratis*) is a Keplarian touch.

  **Confidence & Least Sure Claim:**

  *   **Overall Confidence:** High. The core historical elements of Kepler's astrological purge and his justifications are well-documented in his own writings (especially *De Fundamentis Astrologiae Certioribus*, *Tertius Interveniens*, and numerous letters). The satire flows directly from the inherent tensions in his position – defending the art while gutting its traditional mechanisms, needing its income while intellectually critiquing it.
  *   **Least Sure Claim:** The specific **pricing structure and justification (Point IV, especially IV.3)**. While we know Kepler sold these items and grumbled about finances, exact prices and his justifications for them aren't preserved in the concise, satirical way presented here. The *1 Reichsthaler* price for the almanac is plausible based on known book/calendar prices of the era, but linking the *higher price for a shorter almanac* directly to "fewer errors = higher value" is the most speculative, invented part of the satire. It's *the* key joke, but its historical anchor is the thinnest – based entirely on inferring the logical (and cynical) extreme of his reformist position and financial need, not on a specific documented statement or price list.

  This handbill should provide your printer's apprentice with a rich, historically resonant, and darkly humorous document to read aloud, perfectly encapsulating the absurdity of reforming the unfalsifiable. Good luck with the novel!
