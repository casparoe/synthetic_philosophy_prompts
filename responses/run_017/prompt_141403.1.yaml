prompt: |-
  You are a philosopher working at the intersection of criminal law theory and experimental philosophy. Think carefully before you answer: start by listing, in a few bullet points, the candidate accounts of intending that could be in play here (aim-or-purpose accounts, foresight-plus-certainty accounts, moralized or otherwise thick concepts of intentional agency, and views on which intent-talk is dispensable and the law is really just grading culpability directly), and note which features of the practice below each account predicts.

  Consider this well-established legal practice. First, in many jurisdictions a jury is permitted though not required to find that a defendant intended a result when that result was a virtually certain consequence of his voluntary act and he knew that it was. A man who plants a bomb on an aircraft in order to claim insurance on a parcel, knowing the crew will certainly die, can be convicted of murder even though he wants nobody dead and would have preferred that they survive. Second, the same systems insist that motive is irrelevant to guilt: that you aimed at a good end, or would have welcomed avoiding the bad one, does not stop you from intending the means, and comes in only at sentencing, if at all. Third, the mirror image is simply absent: no doctrine anywhere converts a foreseen good outcome into an intended one, and no legal purpose has been found for which it would matter.

  Now imagine a jurisdiction that closes the gap with a rule I will call constructive beneficence, enacted for sentencing mitigation only: a defendant who caused a prohibited result earns a reduction if some good outcome was a virtually certain consequence of the very same act and he foresaw it. A hacker breaks into a hospital network for profit and thereby, to a certainty, triggers a mandatory audit that catches otherwise fatal untreated conditions in a dozen patients. A firm dumps a chemical to cut costs and thereby, to a certainty, wipes out an invasive mussel that was collapsing the river ecosystem.

  Now answer the following. What conception of intentional action does the existing practice — oblique intent plus the irrelevance of motive — presuppose? Be explicit about what it strictly presupposes and what it merely fits well with, and about where it is underdetermined, so that several rival theories of intending would license it equally. Does it commit the law to the view that intending a consequence just is acting in the belief that it will near-certainly obtain, or can it be read as using foresight merely as evidence from which a jury infers a purpose, or as bypassing intention altogether in favour of a direct judgement of culpability? How should the bad/good asymmetry be read in light of the Knobe effect, where people say that a chairman who knowingly wrecks the environment as a side effect of profit did it intentionally, but deny this when the side effect is beneficial: is that evidence that the doctrine has quietly latched onto a moralized folk concept, or a performance artefact that tells us nothing about the concept the law deploys? Finally, would constructive beneficence actually be workable? If the asymmetry in folk attributions is real, fact-finders may stubbornly refuse to say that the hacker intended to save those patients. Say what that refusal, or its absence, would show about whether the doctrine we already have rests on a genuine psychological category or is a legal construct that merely borrows the word. Argue from the content of the practice; do not appeal to case names, empirical citations, or literature.
reasoning: |-
  Okay, I need to tackle this complex question step by step. The user presents a scenario involving legal philosophy around intention and constructive beneficence. 

  First, I consider the candidate accounts of intention. The main ones seem to be: aim/purpose views where intention requires desire for outcome; foresight-certainty views where awareness of near-certainty suffices; moralized views where intent depends on outcome valence; and culpability-first views where intent-talk is just a proxy for blameworthiness.

  Looking at existing legal practice, the oblique intent doctrine (convicting bomber who knows deaths are certain) suggests foresight-certainty is sufficient for intent. Meanwhile, motive irrelevance (good motives don't negate intent) contradicts moralized views. The absence of constructive beneficence shows asymmetry - foreseen goods aren't treated as intended.

  The Knobe effect raises interesting questions. People's tendency to call environmental harm intentional but not benefit might indicate folk concepts are moralized. Yet the law's asymmetric treatment of bad vs good outcomes could be principled - recognizing that culpability requires bad results, regardless of folk psychology.

  For constructive beneficence's workability, if fact-finders resist saying "the hacker intended to save patients," it would reveal that legal intent isn't purely psychological but a normative construct. Their refusal would highlight how the law has decoupled intent from folk concepts when establishing culpability.

  The core insight seems to be that legal intent serves culpability assessment, not conceptual analysis. The asymmetry isn't a bug but a feature - we only need to expand intent-like categories for bad outcomes because that's what culpability hinges on.
answer: |-
  Based on the established legal practice described, here is an analysis of the presupposed conception of intentional action, its relation to rival theories, the asymmetry, and the feasibility of constructive beneficence, argued strictly from the practice:

  **Candidate Accounts of Intending:**
  1.  **Aim/Purpose Account:** Intending X requires acting *in order to* bring about X or with X as a goal/objective.
  2.  **Foresight+Certainty Account:** Intending X requires acting *while believing X is a virtually certain consequence* of one's voluntary act (even if undesired).
  3.  **Moralized/Thick Concept Account:** The judgment "intentionally did X" is inherently sensitive to the moral valence of X (e.g., bad outcomes are more readily classified as intentional).
  4.  **Culpability-First/Dispensability Account:** "Intent" talk is a heuristic or proxy for assigning levels of culpability; the core legal judgment is about blameworthiness, not a pre-legal mental state.

  **Analysis of Existing Practice:**

  1.  **Presupposed Conception & Fit:**
      *   **Strictly Presupposes:** The practice *strictly presupposes* that the **Foresight+Certainty Account is a legally sufficient basis for attributing "intent"** for prohibited (bad) results. The bomber *intends* murder because he knows death is virtually certain, irrespective of his aim (insurance payout) or desire (they survive). This is the doctrine of oblique intent.
      *   **Fits Well With:** The practice *fits well with* the **Dispensability Account**. The core concern appears to be grading *culpability* for bad outcomes. Recognizing foresight-of-certainty as intent efficiently captures extreme recklessness or practical indifference, warranting the highest level of culpability (e.g., murder vs. manslaughter). The irrelevance of motive reinforces this: good motives don't reduce the culpability imputed by foresight-of-certainty for the bad result.
      *   **Fits Poorly With:** The practice *contradicts* the pure **Aim/Purpose Account** as the exclusive criterion for intent, as the bomber lacks the purpose/aim of killing. It also *contradicts* applying a **Moralized Account** *symmetrically*. While motive irrelevance might superficially *resist* moralization (good motive doesn't negate intent for bad act), the *absence* of constructive intent for good outcomes suggests the law implicitly moralizes by *only* expanding intent for *bad* results.

  2.  **Underdetermination & Rival Theories:**
      The practice is *underdetermined* regarding the *fundamental nature* of legal intent. Rival theories can license the *same doctrine* but for different reasons:
      *   **Foresight+Certainty as *Constitutive*:** The law *could* hold that intending X *just is* acting with foresight of X's virtual certainty. The bomber *intends* death by definition.
      *   **Foresight+Certainty as *Evidence*:** The law *could* hold that foresight-of-certainty is such overwhelming evidence of a (potentially unstated or disavowed) purpose that the jury is *permitted* (though not forced) to infer the requisite purpose/aim. The bomber "really" aimed at death as a necessary step, despite his protestations.
      *   **Foresight+Certainty as *Culpability Proxy*:** The law *could* hold that culpability for knowingly causing a near-certain bad result is so high that it warrants the label and consequences of "intentional" harm, regardless of the technical philosophical definition of intent. "Intent" here is a legal fiction marking maximal blameworthiness for bad outcomes.
      The practice *does not strictly commit* to any single one of these underlying theories. All three can explain why the bomber is guilty of intentional murder. The irrelevance of motive is consistent with all three.

  3.  **The Bad/Good Asymmetry & the Knobe Effect:**
      *   **Asymmetry in Practice:** The law exhibits a *structural asymmetry*: it expands the concept of "intent" to encompass foreseen near-certain *bad* results (oblique intent) but *never* expands it to encompass foreseen near-certain *good* results (no constructive beneficence-as-intent). This asymmetry mirrors the Knobe Effect in folk psychology.
      *   **Interpretation:** This asymmetry is strong evidence that the existing legal doctrine has **latched onto a moralized folk concept of intentional action**. The law's selective expansion *only* for bad outcomes aligns perfectly with the Knobe Effect's finding that folk judgments of intentionality are intrinsically sensitive to the moral valence of the side effect. The law reflects the folk intuition that knowingly causing harm "counts" as intentional in a way that knowingly causing benefit does not. While the irrelevance of *motive* superficially resists moralization, the *asymmetry in result attribution* reveals an underlying moralization of the *act description itself* (intentional *harm* vs. merely causing benefit). This suggests the doctrine rests on a folk-psychological category where bad outcomes "pull" the attribution of intent.

  4.  **Workability of Constructive Beneficence & What Refusal Shows:**
      *   **Workability:** Constructive beneficence (as a sentencing mitigator, not an intent attribution) is *conceptually workable* as a legal rule. It directly parallels the structure of oblique intent but for good results and mitigation. However, its *practical workability* is highly suspect *if* the Knobe Effect reflects a deep feature of folk psychology.
      *   **The Crucial Test:** If fact-finders (judges/juries) **stubbornly refuse** to apply the constructive beneficence rule *even when instructed* – specifically, if they refuse to say the hacker "foresaw and caused" the lifesaving audit in a way that warrants mitigation (despite meeting the legal criteria) – this refusal would be powerful evidence that the existing oblique intent doctrine rests on a **genuine, asymmetric, moralized psychological category**. The refusal would show that people naturally resist assimilating foreseen good outcomes into *any* category (even mitigation) that parallels the intent category used for foreseen bad outcomes. The law's existing asymmetry would be revealed as tracking a deep cognitive asymmetry.
      *   **Conversely:** If fact-finders *readily apply* constructive beneficence mitigation when the criteria are met, it would suggest the asymmetry in the *existing intent doctrine* is primarily a **legal construct** designed solely for grading culpability for *prohibited* results. It would show that the *concept* of foreseeing near-certain consequences is psychologically neutral, but the law *chooses* only to use it to *aggravate* culpability (via intent) for bad results, while potentially using a parallel structure to *mitigate* for good results. The word "intent" in oblique intent would be exposed as a culpability marker, not a direct reflection of the folk concept.
      *   **Prediction:** Given the Knobe Effect, **refusal is likely**. This would support the view that the existing oblique intent doctrine (for bad results) leverages a pre-existing, moralized folk concept of intentional action, while constructive beneficence tries to impose a legal symmetry onto a cognitive asymmetry.

  **Conclusion from Practice:** The existing practice presupposes that foresight of virtual certainty is sufficient for legal intent regarding *bad* results. While consistent with rival underlying theories (constitutive, evidential, or culpability-proxy), the *structural asymmetry* – expanding intent for bad results but never for good ones – strongly suggests the doctrine is built upon a **moralized folk concept of intentional action**, as revealed by the Knobe Effect. The likely resistance to constructive beneficence would further confirm that the law's use of "intent" in oblique intent relies on this asymmetric psychological category, rather than being a purely legal construct divorced from folk psychology. The irrelevance of motive is secondary to this core asymmetry in result attribution.
