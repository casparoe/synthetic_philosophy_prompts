  ### **DIAGNOSTIC TREE: CONCEIVABILITY AND POSSIBILITY**  
  **Instructions**: Start at Q1. Answer based on your intuitions about the cases. Proceed to the next node as directed.  

  #### **Q1. ZOMBIE CASE**  
  After ideal reflection (no empirical knowledge that begs the question), you cleanly conceive of a "zombie world": physically identical to ours but with no consciousness. Does this conceiving establish that such a world is **metaphysically possible**?  
  - **A**: Yes—it gives knowledge of possibility, full stop.  
  - **B**: It gives a strong reason to believe it’s possible, but this could be overridden.  
  - **C**: No—it only restates what we knew independently.  
    - *If A or B, go to Q2. If C, go to Q7.*  

  #### **Q2. CONCEIVER’S INFORMATION**  
  When conceiving scenarios, must the conceiver know **all empirical facts** about actuality? (E.g., to conceive "water isn’t H₂O," must they know water *is* H₂O?)  
  - **Y**: Yes—full empirical knowledge is required.  
  - **N**: No—ideal conceiving uses only a priori reflection; ignorance is allowed.  
    - *If Y, go to Q3. If N, go to Q4.*  

  #### **Q3. HIDDEN-IDENTITY CASE (WITH FACTS)**  
  Suppose someone knows this table is *actually wood* and tries to conceive "this very table is made of ice." They describe a scenario (same appearance, location, history) where it’s ice. Does this conceiving establish it’s **metaphysically possible** for *this table* to be ice?  
  - **Y**: Yes.  
  - **N**: No.  
    - *Go to Q5.*  

  #### **Q4. HIDDEN-IDENTITY CASE (WITHOUT FACTS)**  
  Suppose someone *doesn’t know* water is H₂O and cleanly conceives "water isn’t H₂O." After learning the truth, does that initial conceiving establish it was **metaphysically possible** for water (actual H₂O) to not be H₂O?  
  - **Y**: Yes.  
  - **N**: No.  
    - *Go to Q5.*  

  #### **Q5. MATH CASE**  
  After ideal reflection, you cannot conceive of 2+2=5 (it seems incoherent). Does this failure establish that 2+2=5 is **metaphysically impossible**?  
  - **Y**: Yes.  
  - **N**: No.  
    - *Go to Q6.*  

  #### **Q6. EIGHTH-SENSE CASE**  
  You cannot conceive of a creature with an "eighth sense" (e.g., directly perceiving magnetic fields), even ideally. Does this failure establish such a creature is **metaphysically impossible**?  
  - **Y**: Yes.  
  - **N**: No.  

  #### **Q7. MATH CASE (FOR Q1-C)**  
  After ideal reflection, you cannot conceive of 2+2=5. Does this failure establish it’s **metaphysically impossible**?  
  - **Y**: Yes.  
  - **N**: No.  
    - *Go to Q8.*  

  #### **Q8. EIGHTH-SENSE CASE (FOR Q1-C)**  
  You cannot conceive of the eighth-sense creature. Does this failure establish it’s **metaphysically impossible**?  
  - **Y**: Yes.  
  - **N**: No.  

