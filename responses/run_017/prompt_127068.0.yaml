  Second, they want to explore two variations not well-covered in philosophical literature: "backwards aesthetic testimony" (deferring about your own art) and "delegated looking" (transmitting verdicts without evidence). They're particularly interested in whether these break the acquaintance principle and whether the problems are epistemic or moral.

