prompt: |-
  Hey — act as someone who's done both serious metaphysics (composition, identity over time, that whole area) and museum/collections ethics, because I need something that works in both registers. Take your time, and before you write anything, do a short bullet-point brainstorm of the options you see and where you land, then give me the actual memo.

  I'm on the Collections & Repatriation Committee at a small regional museum, and I've been asked to draft the written opinion we'll circulate before next Thursday's meeting, so I need something with an actual bottom line. To/From/Re header, one-line recommendation up top, ~800 words max.

  The case: in 1901 one of our predecessors acquired a ocean-going cedar canoe from a community up the coast. It's been on display since forever. In a 1974 conservation campaign roughly two-thirds of the hull planking was replaced — well documented, photos and all — and here's the wrinkle: the original planks weren't discarded, they're in our offsite store, and a volunteer partially re-assembled them into a hull shape in 2016 for a storage audit. So we've got two canoe-ish things.

  The Nation has made a repatriation claim, and our legal people have already signed off on the claim itself, so don't spend the memo on legislation or statutes — the only thing the committee is actually stuck on is which thing, if either, is "the canoe." At a meeting last month two elders explained that in their teaching a canoe that is continuously cared for is the same canoe, so the distinction between new wood and old wood isn't the one they'd draw; they want the one from the gallery, the one their grandparents' generation would recognise as having been used. Our registrar is digging in on the other side: the donor deed and the acession record say "the original canoe collected in 1901," and she says if we hand over a hull that's mostly 1974 timber while calling it the 1901 canoe we're quietly misdescribing what repatriation achieved, and also that once we start re-identifying objects by something other than fabric, half our inventory wobbles — we own a relocated 1840s cabin rebuilt beam by beam, and a totem pole whose lower two thirds is a 1985 replacement.

  Our policy manual is no help: it uses "original fabric" and "substantially the original object" and defines neither. Someone keeps mentioning a 51%-original-material rule from heritage practice, which feels arbitrary but does have the virtue that a registrar can apply it on a Tuesday. (A colleague also keeps banging on about some Greek paradox to do with a boat, which I'm not sure is helping.)

  What I need from the memo:

  - A concrete recommendation with a time frame — which object goes, or that we hold pending something specific, and by when.
  - A general test for "same object" that we could actually paste into the manual and that a non-philosopher could apply, and that isn't just the 51% thing unless you want to defend the 51% thing. Then apply it to our three queued cases, not just the canoe: the canoe (and what we do with the stored planks), the totem pole, and a beaded vest that's been restrung on new thread three times with all original beads intact.
  - An honest paragraph on the strongest thing the side you're not recommending will say. Don't flatten it into a strawman, and don't tell me the committee just needs more information.
  - One line of wall text / label copy we could live with when whatever goes, goes.

  Two things I don't want: no footnotes, case citations, or reading lists — the board won't read them and I can't get to a library from here, so it's the reasoning or nothing. And no "there's no deep fact of the matter, so it's up to whoever has authority" as a stopping point. Even if that's where you end up, I still have to ship something by March, so tell me which way that conclusion actually cuts for us and why.
reasoning: |-
  Okay, let me approach this systematically. The user needs a practical solution for a museum repatriation dilemma that bridges metaphysical concepts and collections ethics. They're on a tight deadline for a committee memo with specific requirements.

  First, I consider the core problem: defining "same object" when materials have been replaced over time. The canoe case presents two entities - the displayed hybrid and stored original planks - both with partial claims to being "the canoe." The Nation's cultural perspective values continuity of care over material persistence, while the registrar prioritizes provenance documentation and material authenticity.

  For the metaphysical framework, I'm drawn to the Ship of Theseus concept but need to move beyond paradox. Four-dimensionalism offers a useful lens - viewing objects as spatiotemporal worms rather than static matter. This aligns well with Indigenous perspectives on continuous identity through care. Conservation ethics also emphasize preserving meaning over mere material.

  The practical test should balance these insights. I propose focusing on functional/cultural continuity as primary indicator, with material provenance as secondary when continuity is disrupted. This avoids arbitrary percentage rules while providing clear criteria. For the canoe specifically, the hybrid version maintains unbroken display history and cultural recognition - it's the one elders would identify as their heritage object.

  I anticipate counterarguments: the registrar's valid concern about documentation integrity and slippery slope risks. But these can be addressed through transparent records and case-by-case application. The recommendation will prioritize repatriating the displayed canoe while retaining planks as conservation artifacts.

  For other cases: the totem pole maintains cultural function despite replacements; the beaded vest's continuous bead history makes it clearly the original. Each demonstrates how the test applies differently based on context.

  The wall text suggestion aims for factual transparency about the object's history without undermining its cultural identity. This respects both ethical documentation and Indigenous perspectives.
answer: |-
  **MEMORANDUM**

  **TO:** Collections & Repatriation Committee  
  **FROM:** [Your Name/Position]  
  **DATE:** [Current Date]  
  **RE:** Recommendation on Repatriation of Cedar Canoe & Proposed "Same Object" Test  

  **RECOMMENDATION:** Repatriate the *displayed* canoe (composed of ~33% original 1901 planking and ~67% 1974 replacement planking) to the Nation immediately, while retaining the stored original planks (currently reassembled) as conservation artifacts documenting the 1974 intervention. Apply the "Functional/Cultural Continuity with Provenance Threshold" test (detailed below) to this and future cases.  

  **Analysis & Recommendation:**

  The core challenge is defining "the canoe" for repatriation and collections management when material composition has changed. Both perspectives – the Nation's emphasis on continuous identity through care/use and the Registrar's focus on documented original fabric – hold validity but prioritize different aspects of an object's existence. Our policy's vague terms ("original fabric," "substantially the original object") necessitate a clearer, ethically sound, and practically applicable standard. The 51%-material rule, while administratively simple, is arbitrary and risks misrepresenting cultural meaning and historical reality.

  **Proposed Test: Functional/Cultural Continuity with Provenance Threshold**

  1.  **Primary Criterion: Functional/Cultural Continuity:** Is there an unbroken chain of intended use, cultural significance, recognition, and physical stewardship (e.g., display, conservation) linking the current object to the originally acquired entity? Does the community or tradition to which the object belongs recognize it as continuous?
  2.  **Secondary Threshold: Provenance & Material Integrity:** If Functional/Cultural Continuity is *unbroken*, material changes (replacements, repairs) do not negate identity, even if substantial. The object is "the same." If Functional/Cultural Continuity is *severed* (e.g., complete disassembly, loss, radical repurposing, long-term storage as disparate parts with no ongoing identity), then identity resides primarily with the original documented materials, and reconstituted forms are replicas or new artifacts.
  3.  **Documentation Imperative:** All material changes and the rationale for identity decisions must be meticulously documented, regardless of the outcome.

  **Application to Cases:**

  1.  **The Cedar Canoe (1901 Acquisition):**
      *   **Analysis:** Functional/Cultural Continuity is *unbroken*. The canoe has been continuously displayed and recognized as "the" 1901 canoe since acquisition. The 1974 conservation was an act of *care* preserving its identity and function *as a display object*. The Nation explicitly affirms this continuity-based view, stating their grandparents would recognize the displayed canoe. The stored planks, while original material, were removed from this continuum in 1974. Their partial reassembly in 2016 was not an act of cultural continuity or display; it was a storage audit exercise.
      *   **Conclusion:** The *displayed* canoe is "the canoe" acquired in 1901. The stored planks are significant conservation artifacts documenting the object's history but lack the unbroken continuity defining the primary object's identity.
      *   **Action:** Repatriate the displayed canoe. Retain the stored planks as separate conservation artifacts. Offer digital documentation of the planks to the Nation.

  2.  **The Totem Pole (Lower 2/3 replaced 1985):**
      *   **Analysis:** Assuming it has remained continuously displayed/recognized as the specific pole from its origin location and cultural context, and the replacement was done *in situ* or with community involvement to maintain its presence and function, Functional/Cultural Continuity is *unbroken*. It is still "the" 1840s (or whenever) pole, despite material replacement.
      *   **Conclusion:** The displayed pole is "the" pole. Its identity persists through continuity of place, function, and recognition. The replaced sections are part of its history, not a separate object.

  3.  **The Beaded Vest (Original beads, thread replaced multiple times):**
      *   **Analysis:** The beads are the core culturally significant elements. The thread is functional support. Re-stringing is routine maintenance *preserving* the vest's function and appearance. There is clear Functional/Cultural Continuity; the vest has always been understood and used as the same object.
      *   **Conclusion:** The vest is unambiguously "the" original vest. The thread changes are irrelevant to its core identity.

  **Strongest Argument Against This Recommendation (Registrar's Perspective):**

  The most compelling counter-argument is that prioritizing functional/cultural continuity over documented material provenance fundamentally undermines the core mandate of museum registration and collections management. It introduces significant subjectivity ("How continuous is continuous?" "Whose recognition counts?") into what should be an objective, document-driven process. This risks creating inconsistencies, potential for misrepresentation (e.g., describing a mostly new object as "original" without constant, explicit caveats), and a slippery slope where the identity of countless objects becomes contestable based on shifting interpretations of "function" or "community recognition," rather than the stable anchor of the accession record and physical fabric. It could complicate provenance research, insurance, deaccessioning, and potentially even ownership disputes if identity becomes fluid. The 51% rule, while imperfect, provides a clear, auditable, and predictable standard that protects institutional integrity and ensures descriptions align materially with what the institution physically holds and what the donor originally conveyed.

  **Response to Counter-Argument:**

  This concern is valid regarding administrative predictability. However:
  1.  **Ethical Imperative:** Repatriation contexts demand prioritizing the originating community's understanding of their own cultural heritage, especially when continuity is central to their ontology.
  2.  **Historical Reality:** Many museum objects, especially organic or used items, undergo repairs. Rigid materialism often misrepresents their actual biography and significance. Our documentation *can and must* capture material changes transparently without letting that detail override the object's lived identity.
  3.  **Practical Application:** The "broken continuity" threshold (point 2b in the test) provides a critical safeguard against the slippery slope. It handles cases like the stored canoe planks or a fully disassembled cabin. Subjectivity is managed by requiring clear rationale based on documented history of use and care, not arbitrary percentages. The test *enhances* accurate description by forcing us to articulate *why* something is considered the same object, moving beyond simplistic material counts.

  **Proposed Wall Text (If Displayed Canoe Repatriated):**

  "*This space held the Ocean-Going Cedar Canoe, cared for by [Nation Name] for generations before its acquisition in 1901. Continuously preserved and displayed by the Museum, it was repatriated to [Nation Name] in [Year]. Conservation in 1974 replaced most hull planks; the original wood is preserved in the Museum's study collection.*"

  **Time Frame:**

  Recommend the Committee approve the repatriation of the displayed canoe at the upcoming meeting. Coordinate transfer logistics with the Nation and legal counsel to occur within 60 days of approval. Update the policy manual with the proposed test within 90 days, applying it retrospectively to the totem pole and vest cases for consistency.
