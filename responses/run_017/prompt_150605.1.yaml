prompt: |-
  I sit on the therapeutic use exemption committee of an international sport federation. Our code prohibits a long list of substances and methods, but allows an athlete to use a prohibited item when a documented medical condition requires it; the committee's job is to decide whether the proposed use is therapeutic — restoring the athlete's functioning — or an enhancement, taking an already-healthy athlete beyond what their own body would do. We receive a few dozen applications a year and decide them in fortnightly meetings, roughly twenty minutes and one file per application, with no power to request further tests: we rule on the file in front of us. Three of us are physicians and one is a lawyer; none of us has training in philosophy. Grants are published in anonymised form with a short statement of reasons and can be appealed to an independent arbitral body. Using a prohibited substance without one is a ban, and athletes who hold one sometimes win medals with it.

  Please write a decision procedure we can actually run on an application inside twenty minutes, grounded in what the philosophical literature on the therapy/enhancement distinction really says, and honest about where that literature gives us nothing usable.

  - Give the questions in order, and for each, what counts as a sufficient answer drawn from a file — stated so that a physician can fill it in without knowing the theory.
  - Mark where the procedure stops with a yes, where it stops with a no, and where it must hand the decision to a person because the question is one of values rather than facts. Those value judgments should be named as value judgments, not disguised as medical criteria.
  - Our reasons are published, so add a publicity test: any step whose real justification we could not print in our published reasons should be flagged, and either reformulated honestly or dropped.
  - Say which distinctions drawn in that literature must survive the simplification and which we should abandon as unusable in our setting, and why.
  - Most of our disagreements, I suspect, reduce to a choice between three different baselines: the athlete's own earlier level of functioning, the statistical normal for a reference population, and the level of functioning the sport itself demands of its participants. Say whether that diagnosis is right, and if it is, make the procedure force us to choose one baseline and to state which we are using in the published reasons.

  The applications that break us, which the procedure must handle:

  1. A male cyclist in his mid-thirties with documented hypogonadism whose testosterone is low as a consequence of anabolic steroid use earlier in his own career. His levels are below the population normal but above what they were while he was doping.
  2. A nineteen-year-old endurance runner, clinically normal on every measure, whose history of stress fractures makes her physician expect a breakdown under the training load she intends to carry next season; the application is for a prohibited agent to build bone and muscle beforehand, so that she can train at the level her event requires.
  3. A forty-year-old marathon runner applying for a drug that reverses age-related decline well enough to restore him to the performance he had at thirty — his own earlier baseline, but above the normal for his age.

  Run the procedure on all three. At least one of them must be a case where the procedure returns an answer my committee will find unwelcome; tell me plainly which one it is and why we should accept it anyway. Then state what no procedure of this kind can settle, including whether any protocol can avoid taking a position on what the sport is for. Do not cite or name any literature: I need the distinctions to survive being restated in our own words.

  Begin with a single sentence giving the procedure's governing principle — the one sentence we could put on the wall above the table — then give the procedure and the worked applications, with no preamble and no restatement of what I have asked for.
reasoning: |-
  Hmm, the user is part of a therapeutic use exemption committee for an international sport federation. They need a practical decision procedure grounded in philosophical literature on therapy vs. enhancement, but usable in 20-minute file reviews without specialist knowledge. 

  Key constraints leap out: no time for extra tests, mixed medical-legal panel, published anonymized decisions, and appeals looming. The real pain points are those three borderline cases - especially tricky because they expose how baselines (personal history vs population norms vs sport demands) determine outcomes. 

  Philosophy's messy debates won't fit here. Need to gut what's useful: Juengst's insight that therapy targets dysfunction while enhancement optimizes beyond health, but ditch circular definitions like "normal species functioning" when we're dealing with elite athletes who already exceed norms. 

  The procedure must force baseline choice upfront - that's the committee's core value judgment, disguised nowhere. Publicity test is non-negotiable; every step must survive printing in reasons. And one unwelcome outcome is inevitable - likely the cyclist with self-induced hypogonadism, because restoring to post-doping levels still looks like enabling past cheating. 

  For the cyclist: Yes, but only if we bite the bullet that his medical need exists regardless of cause. For the runner with stress fractures: No, because prevention isn't treatment when no current pathology exists. For the marathoner: Hand to human judgment - is age decline "disease"? That's inherently value-laden. 

  What can't be solved? The sport's purpose. If it's about celebrating natural potential, we deny most exemptions; if it's about spectacle, we grant liberally. The procedure exposes but doesn't resolve this.
answer: |-
  **Governing principle:** Grant exemptions only when the prohibited substance directly treats a documented medical dysfunction that impairs the athlete's *basic health and bodily integrity*, restoring function toward a specified baseline, not when it aims solely to optimize performance beyond health or compensate for sport-imposed demands.

  **Decision Procedure:**

  1.  **Is there a *current*, *documented* medical condition?** (Check file: Diagnosis from licensed physician, relevant tests/labs, symptoms. Chronic conditions require recent evidence.)
      *   **No:** STOP - **DENY** (No medical need).
      *   **Yes:** Proceed to 2.

  2.  **Is the prohibited substance *clinically indicated* and *standard treatment* for this specific condition?** (Check file: Prescription, treatment guidelines cited, peer-reviewed evidence referenced. Not experimental or "off-label" for enhancement.)
      *   **No:** STOP - **DENY** (Not genuine therapy).
      *   **Yes:** Proceed to 3. *(Abandon "authenticity" or "species-typical" arguments here; focus on medical standards.)*

  3.  **What is the relevant *baseline* for "restoring function"?** (VALUE JUDGMENT - MUST STATE IN REASONS)
      *   (a) **Population Normal:** Restoring function to the statistical average range for the athlete's age/sex. (Safe, objective, avoids rewarding self-harm).
      *   (b) **Athlete's Own Healthy Baseline:** Restoring function to the athlete's pre-illness/injury level (if documented and was healthy). (Respects individual variation).
      *   (c) **Sport-Demanded Function:** Restoring function *sufficient to compete safely* in the sport. (*Avoid this baseline unless strictly necessary for basic participation; it blurs into enhancement.*)
      *   **Committee MUST choose ONE baseline per application, justify choice briefly in reasons.** Proceed to 4.

  4.  **Will treatment restore function *toward* the chosen baseline?** (Check file: Physician's prognosis, expected treatment effect on the specific dysfunction, target lab values/functional outcomes.)
      *   **No:** STOP - **DENY** (Not therapeutic for the claimed condition/baseline).
      *   **Yes:** Proceed to 5. *(Abandon debates about "mild" vs. "severe" dysfunction; if it meets diagnostic criteria and step 2, proceed.)*

  5.  **Could the sport's demands *alone* cause the dysfunction needing treatment?** (Check file: Is the condition primarily an overuse injury, "wear and tear," or predictable consequence of extreme training *in a currently healthy athlete*? Does the file show underlying pathology independent of sport load?)
      *   **Yes, and no independent pathology:** STOP - **DENY** (Enhancement for sport demand, not therapy for disease/injury).
      *   **No, or underlying pathology exists:** STOP - **GRANT** (Genuine therapy). *(This step tackles "sport-imposed" dysfunction.)*

  **Publicity Test Pass:** All steps can be stated honestly: Medical necessity, standard treatment, chosen baseline justification, restoration toward baseline, exclusion of sport-load causation. No hidden value judgments beyond baseline choice (which is explicit).

  **Applied to Cases:**

  1.  **Cyclist (Hypogonadism from prior steroid use):**
      *   1: **Yes** (Documented hypogonadism).
      *   2: **Yes** (Testosterone replacement is standard).
      *   3: **BASELINE CHOICE:** Committee MUST choose. (a) Population Normal (lower limit)? (b) His *pre-hypogonadism* level (unclear if healthy)? (c) Sport level? **(VALUE JUDGMENT CRITICAL)**. *Recommend: (a) Population Normal - avoids rewarding self-induced condition. Must state in reasons.*
      *   4: **Yes** (Treatment will raise T toward population normal).
      *   5: **No** (Dysfunction caused by prior drug use, not sport itself). **GRANT** *(But only if baseline (a) is chosen. Unwelcome to some, as it rewards past doper, but necessary to treat current *medical* condition based on objective baseline.)*

  2.  **Endurance Runner (Prevent stress fractures):**
      *   1: **No.** (No *current* medical condition. History of stress fractures ≠ current dysfunction. Physician's *expectation* of future injury is not a diagnosis.) STOP - **DENY**. *(Procedure stops early. Prevention in a currently healthy athlete is enhancement for sport demand, not therapy.)*

  3.  **Marathoner (Reverse age-related decline):**
      *   1: **Unclear/No.** "Age-related decline" is not a specific disease diagnosis per standard medical criteria. File must show a *specific* pathology (e.g., severe sarcopenia diagnosable as disease, not just slower times).
      *   2: **Maybe.** Depends on specific drug/condition.
      *   3: **BASELINE CHOICE:** Core conflict. (a) Population Normal for age? (Treated, he'd likely exceed this). (b) His level at 30? (Exceeds healthy function *for his age*). (c) Sport level? (Clearly enhancement). *Committee must choose baseline - likely (a) or (b).*
      *   4: **Maybe.** Depends on chosen baseline.
      *   5: **CRITICAL QUESTION:** Is the decline *primarily* due to age itself (a natural process) or is there an independent, diagnosable pathology? **VALUE JUDGMENT:** Is treating natural aging a "medical therapy"? (Check file: Is there a *disease* like osteoporosis or just slower recovery?)
          *   *If decline is solely due to natural aging:* **YES** (Sport/frailty demands cause the "dysfunction") -> STOP - **DENY** (Enhancement to counter natural aging for sport).
          *   *If specific, diagnosable age-related disease exists (beyond norms):* Proceed to Grant if steps 1-4 pass. **HIGHLY CONTESTED.**
          *   *Likely Outcome:* **DENY.** Natural aging isn't a dysfunction requiring prohibited substances to "treat" for competition; it's a universal process. Granting this is enhancement.

  **The Unwelcome Outcome:** The **Cyclist (Case 1)** is likely unwelcome. Granting an exemption to an athlete whose condition resulted from their own prior doping feels like rewarding cheating. **Why accept it?** The procedure forces focus on the *current, documented medical need* (hypogonadism) and *objective treatment* toward a *justifiable baseline* (population normal). Denying necessary medical treatment based on past behavior (not related to *this* TUE request) falls outside the committee's remit and could be overturned on appeal as discriminatory medical care denial. The sanction for past doping was served; the current medical condition exists and meets the criteria.

  **What No Procedure Can Settle:**

  1.  **The Definition of "Health/Dysfunction":** Whether conditions like mild depression, "low-normal" hormone levels, or natural aging constitute "dysfunction" requiring prohibited treatment is inherently value-laden and context-dependent. Medical criteria provide thresholds, but setting them involves values.
  2.  **The Sport's Purpose:** Does the sport celebrate "natural" human potential (favouring restrictive baselines like population norm)? Or is it a spectacle of peak performance, accepting medical support (favouring individual baselines/sport demands)? The baseline choice reflects this unspoken value.
  3.  **Distributive Justice:** Is it fair for athletes with access to top medical care (and diagnosable "dysfunctions") to gain a pharmacological edge over healthy athletes from less resourced backgrounds?
  4.  **The "Slippery Slope":** Granting one exemption can normalize interventions, making it harder to deny similar future requests, even if they push closer to enhancement. The procedure sets rules but cannot prevent this evolution.
  5.  **"Authenticity" vs. Welfare:** Prioritizing "competing naturally" can conflict with an athlete's medical welfare and autonomy to receive treatment. The procedure (especially Step 5) inherently prioritizes welfare for genuine illness over pure sport integrity.
