prompt: |-
  I'm the non-clinician member of the ethics commitee at a fertility clinic, which apparently means I get asked to write the memos. We're properly stuck on two cases and I need something I can circulate before next month's meeting.

  Case one. We offer preimplantation testing for late-onset, untreatable conditions — the sort where an embryo carries a variant that means the resulting person will almost certainly develop a degenerative illness in their forties and die of it. Normal procedure: biopsy the embryos, rank them, transfer an unaffected one. A mother of a four-year-old born this way has complained to the board. Her argument, as I understand it: we told her we were sparing her child a terrible disease, but if we'd transferred a different embryo she wouldn't have this child at all, she'd have a different one. So nobody was spared anything. The child who exists isn't better off than she'd otherwise have been, because there is no "otherwise" for her — there's just no her. And our consent paperwork, she says, is built on a comparison that can't actually be made. Half the commitee thinks this is clever wordplay with no practical upshot. I'm not so sure, but I also can't see what it's supposed to change about what we do on Monday.

  Case two, which is what makes it hard. A deaf couple, both deaf from the same genetic variant, have asked us to select an embryo carrying that variant — they have several, some would be hearing, some deaf. Several members say obviously not, that's deliberately creating a disabled child. But if the complainant in case one is right that embryo choice doesn't harm the child who results, the symmetry is uncomfortable: we're perfectly willing to select away from a trait and totally unwilling to select toward the very same trait, so harm to the child can't be what's doing the work in our policy. Something else is, and we should probably have to say what.

  Three things we've floated and can't settle: a "counterfactual embryo note" in the medical record — which embryo we would have transferred instead, and why — disclosed to the resulting person at eighteen on request; a "substitution test," where we only permit selection when we can actually name the embryo we'd otherwise have used, so we can't slide into treating embryo choice as general quality control; and a ban in counseling on comparative phrasing like "spare your child from," replaced with something like "you are choosing which child to bring into existence."

  What I want: a decision memo, 700–900 words, addressed to the committee, recommending one concrete course — keep offering this testing, stop offering it for late-onset conditions, or keep it under specified conditions — with a realistic timeline, actual consent-form language we could lift, and a straight yes or no on the deaf couple's request. Please don't spend the memo explaining that the first complaint is a famous argument with a name; I've read enough to know it has one. Tell us what, if anything, follows from it for policy, and give the strongest version of the losing side — the view that none of this should change our practice — rather than a paragraph of strawman.
reasoning: |-
  Okay, the user is part of an ethics committee at a fertility clinic and needs to draft a memo addressing two complex cases. Let me start by understanding their role. They're the non-clinician member, so they might need to bridge medical ethics and practical policy. The memo has to be clear, actionable, and address both cases with concrete recommendations.

  First, Case 1 involves a mother who argues that selecting embryos to avoid a late-onset condition doesn't actually "spare" the child because without the selection, that specific child wouldn't exist. The committee is split. The user mentioned the Non-Identity Problem, which is a known ethical issue. The key here is whether the clinic's consent forms and counseling language imply a comparison that's logically flawed. The user wants to know if this should change their practice.

  Then Case 2 is about a deaf couple wanting to select a deaf embryo. The committee is against it, citing harm, but if the first case's logic holds, selecting for a disability might not harm the child either. The symmetry here challenges the basis of their current policy. The user needs a yes or no on the deaf couple's request, tied back to the implications from Case 1.

  The user also mentioned three proposed solutions: a counterfactual embryo note, a substitution test, and changing counseling language. They want recommendations on whether to continue testing, under what conditions, and specific consent form language. Practicality is crucial—what can be implemented by next month.

  Deep needs: The user is likely seeking to navigate ethical dilemmas without halting clinic operations. They need policies that are defensible, legally sound, and ethically consistent. They might also want to avoid future complaints and ensure transparency. The memo must balance theoretical ethics with actionable steps, showing the committee that both cases are addressed cohesively.

  For Case 1, the ethical problem is real but doesn't necessitate stopping the service. Instead, revising language in consent forms and counseling to avoid comparative statements makes sense. Phrases like "sparing" should be replaced with "choosing which child to bring into existence." This aligns with the third proposed solution and addresses the mother's concern without practical changes to embryo selection.

  For Case 2, the symmetry is uncomfortable. If selecting against a disability is allowed because it doesn't harm the specific child, selecting for one also doesn't harm that child. But the clinic's policy must consider societal norms and disability perspectives. Banning selection for disabilities is justified by the principle of nonmaleficence towards the future child, but that's inconsistent with the non-identity argument. Instead, framing it as parental autonomy vs. societal responsibility might work. The deaf couple's request involves cultural identity, but the clinic's duty is to the child's welfare. Since deafness can limit opportunities, even if the parents view it as a cultural trait, the clinic can refuse based on preventing disability. So, recommend denying the request.

  The three floated ideas: The counterfactual embryo note seems impractical and invasive. The substitution test is too restrictive. Changing counseling language is the most feasible and effective. Drop the first two, adopt the language change.

  Consent form language needs to be precise. Provide examples that avoid comparative terms, focusing on selection rather than prevention. For the deaf couple, a clear policy against selecting for disabilities, with exceptions only for conditions not considered disabilities, but deafness qualifies as one.

  Timeline: Implement revised consent forms in 30 days, staff training in 45 days. Immediate denial for the deaf couple's request with an explanation.

  Strongest losing side argument: The non-identity problem is theoretical and doesn't impact outcomes. Changing language is unnecessary and confuses patients. For Case 2, selecting for disabilities violates medical ethics principles regardless of symmetry. But the rebuttal is that language affects informed consent and trust, and consistency in policy is key for credibility.

  Ensure the memo is structured with recommendations first, then analysis, losing side, and implementation. Keep it within 700-900 words, using clear headings. Avoid jargon, but maintain ethical rigor. The user needs actionable steps, not just theory.
answer: |-
  ## Ethics Committee Decision Memo: Policy on Embryo Selection for Late-Onset Conditions & Disability Selection

  **To:** Ethics Committee Members  
  **From:** [Your Name/Committee Role]  
  **Date:** October 26, 2023  
  **Subject:** Policy Recommendations re: Case 1 (Late-Onset Condition Complaint) & Case 2 (Deaf Couple Request)

  Following extensive deliberation on the complex cases presented, I recommend the following concrete courses of action, balancing ethical principles, practical realities, and patient autonomy. The core challenge lies in reconciling the conceptual validity of the complaint in Case 1 with the need for consistent, actionable, and ethically defensible clinical policies.

  **Recommendations:**

  1.  **Case 1 (Late-Onset Conditions): Continue offering PGT-M for late-onset, serious, untreatable conditions, BUT implement immediate revisions to counseling language and consent forms.** *Timeline:* Revised consent forms drafted within 7 days, committee review/approval within 14 days, implementation within 30 days. Staff retraining on new language concurrent with form rollout (completed within 45 days).
  2.  **Case 2 (Deaf Couple Request): Deny the request to select an embryo carrying the deafness variant.** This request falls outside the scope of permissible embryo selection under our revised policy framework.
  3.  **Policy & Language Revisions:** Adopt the "choosing which child" language framework and explicitly reject the "counterfactual embryo note" and "substitution test" as impractical and unhelpful.

  **Detailed Analysis & Justification:**

  **Case 1: The Complaint & Its Implications**
  The complainant raises a profound philosophical point regarding the "non-identity problem": selecting *against* a specific disease variant doesn't improve the life of the *specific child* born from the unaffected embryo, because that child wouldn't exist if the affected embryo had been chosen instead. Comparing the existing child to a hypothetical non-existent affected child is indeed logically problematic. This does **not** mean PGT-M for such conditions is unethical or should be stopped. Parents have a fundamental right to use available technology to avoid bringing a child into existence who will suffer a severe, unavoidable illness. The ethical justification shifts:
  *   **From:** "Sparing *this child* from disease X."
  *   **To:** "Enabling parents to have *a child free from disease X*."
  The value lies in fulfilling parental reproductive autonomy to avoid known, serious suffering for *their offspring*, not in improving the lot of a specific individual relative to a non-existent alternative. Our consent process must accurately reflect this reality to ensure truly *informed* consent and avoid misleading implications.

  **Case 2: The Deaf Couple Request & Policy Symmetry**
  The symmetry argument based on Case 1 is intellectually compelling but ethically incomplete. While selecting *for* deafness does not harm *the specific deaf child who is born* (as they wouldn't exist otherwise), our policy cannot be based solely on non-identity logic. Permitting selection *for* disabilities raises distinct ethical concerns:
  1.  **Medical Purpose & Scope:** PGT-M is a medical technology designed to prevent serious disease and disability, not to intentionally create it. Selecting for deafness fundamentally contradicts this purpose.
  2.  **Societal Values & Child Welfare:** Even acknowledging non-identity, intentionally creating a child with a significant sensory disability (which imposes functional limitations and societal barriers, regardless of cultural identity) conflicts with the principle of seeking a reasonable threshold of well-being for future children. This is distinct from *avoiding* a severe degenerative disease.
  3.  **Slippery Slope:** Permitting selection *for* disabilities opens the door to ethically untenable requests (e.g., selecting for conditions causing significant pain or drastically shortened lifespans) based purely on parental preference. Our policy must draw a clear line.

  **Rejecting the Floated Solutions:**
  *   **Counterfactual Embryo Note:** Impractical (ranking can change based on development/storage), intrusive, potentially distressing for the resulting person, and philosophically dubious. **Reject.**
  *   **Substitution Test:** Overly restrictive, paralyzing for complex cases (e.g., polygenic risk, carrier status), and doesn't resolve the core conceptual issue. **Reject.**
  *   **Language Revision ("Choosing which child"):** Addresses the core complaint in Case 1 directly, promotes accurate informed consent, avoids misleading "sparing" comparisons, and provides a consistent conceptual framework applicable to both cases. **Adopt.**

  **Proposed Consent Form Language (Late-Onset Conditions):**

  > "Preimplantation Genetic Testing for Monogenic disorders (PGT-M) for [Condition Name] allows us to identify embryos that carry the specific genetic variant known to cause this condition. This information can help you decide which embryo(s) to transfer.
  >
  > *   **Understanding the Choice:** Selecting an embryo without the variant means that *the child born will not have [Condition Name]*. Selecting an embryo with the variant means that *the child born will almost certainly develop [Condition Name], a serious degenerative condition, typically in their forties, leading to significant disability and premature death.*
  > *   **Important Consideration:** This testing does not change an existing child. By choosing to transfer an embryo without the variant, *you are choosing to bring into existence a child who will not have [Condition Name]*. The alternative would be to bring into existence a different child who *would* have [Condition Name]. The child born after selecting an unaffected embryo would not exist if an affected embryo had been chosen instead. PGT-M allows you to avoid having a child affected by this serious condition."

  **Recommendation for Deaf Couple Request:**
  Deny the request. Selection *for* a known genetic variant causing profound deafness falls outside the intended medical purpose of PGT-M and contravenes the ethical principle of not intentionally creating significant disability. Our policy should explicitly state that PGT-M selection is only permissible for the purpose of *avoiding* serious, life-limiting genetic conditions or diseases causing significant suffering. Deafness, while constituting a valued cultural identity for some, is universally recognized as a significant sensory disability impacting major life functions. Our consent forms should be revised to reflect this policy boundary.

  **The Strongest Argument for Maintaining the Status Quo:**
  The most compelling case against changing practice argues that the non-identity problem, while philosophically interesting, is irrelevant to clinical decision-making. Patients seeking PGT-M for late-onset conditions understandably desire a child free from a horrific future illness. The language of "sparing" resonates powerfully with their lived experience of familial suffering and accurately captures the *outcome* for the family – they *are* spared the experience of raising a child who will suffer and die prematurely. Focusing on semantic precision risks undermining patient understanding and autonomy without offering tangible clinical benefits. Regarding the deaf couple, the asymmetry is superficial; the core distinction is the fundamental ethical norm against intentionally causing disability, which stands independently of non-identity arguments. Changing policy based on abstract philosophy ignores the practical reality that our primary duty is to prevent severe suffering where possible, using clear communication that patients find meaningful.

  **Implementation Timeline:**

  1.  **Immediate (Within 7 days):** Draft revised consent form language for late-onset conditions and general PGT-M policy statement (including prohibition on selection *for* disabilities) based on recommendations above.
  2.  **Review (Day 8-14):** Circulate drafts to ethics committee for urgent review and vote via email/expedited meeting.
  3.  **Approval & Training (Day 15-30):** Finalize approved language. Update consent forms and clinic policy documents. Develop brief staff training module (genetic counselors, clinicians).
  4.  **Rollout (Day 31-45):** Implement new consent forms. Complete mandatory staff training on revised language and policy rationale.
  5.  **Case 2 Response (Immediate after policy approval):** Communicate denial to the deaf couple, citing the new/revised clinic policy against selection *for* disabilities, framed respectfully but unequivocally.

  This approach addresses the valid conceptual concern raised in Case 1 through crucial language changes, maintains access to a valuable technology for preventing severe suffering, provides a clear and ethically defensible rationale for denying the request in Case 2, and rejects impractical administrative burdens. It strengthens informed consent and ensures our practice aligns with a coherent ethical framework.
