  But in Typogenetics, enzymes are not run without input. They are run on a strand. So we might run E on some strand, but we want it to output S. How about we run E on an empty strand? But the operations in Typogenetics (like cut, move, etc.) require a strand to operate on. So we need to design E to work on an arbitrary strand? Or on a fixed one? Alternatively, we can have the enzyme ignore the input and output S. But the operations are defined to edit the strand, so we have to build S from scratch? That would require that the enzyme has S hard-coded? But then how is that different from a quine?

  Alternatively, we can have the enzyme copy its own source strand if it is given as input. That is what the self-reproduction does. But that is not without input.

  So a true quine (that outputs its own source without input) might not be possible in Typogenetics because enzymes always require an input strand.

  Therefore, Typogenetics achieves von Neumann self-reproduction (with the help of the fixed translation step) but not Gödel self-reference and not a quine in the usual sense (without input).

  Boundary cases:

  1. A system with Gödel self-reference but not self-reproduction: a formal system of arithmetic. It can form self-referential statements but cannot build machines.

  2. A system with quines but not self-reproduction: any Turing-complete language can have quines (programs that print their own source). But the quine does not build a copy of itself as an active machine.

  3. A system with self-reproduction but not the others: Typogenetics, as above.

  But note: the user's vocabulary might collapse these. In each case, we have a fixed-point construction. The difference is in what the fixed point is used for.

  - In Gödel, the fixed point is a statement that has a certain property (like being unprovable).
  - In quines, the fixed point is a program that outputs its own representation.
