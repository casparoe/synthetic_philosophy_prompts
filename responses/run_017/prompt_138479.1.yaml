  - Reflect: take a data representation and run it as code (like eval).

  In Typogenetics, the translation step is like a limited form of reflection: it takes a strand (data) and turns it into an enzyme (code). But there is no reify: we cannot take an enzyme and turn it back into a strand.

  Moreover, the fixed translation table is not represented as data in the system. So we cannot have an enzyme that modifies the translation table.

  Therefore, the structure is:

  - A reflection operation (translation) that is not invertible (so not an isomorphism) but is a surjection (with a chosen section? not really, because we don't have a canonical way to choose a preimage). It is a function with a non-trivial kernel (strands that are equivalent modulo the redundancy of the code).

  So the claim of isomorphism is not strictly true. It is a many-to-one mapping. But the key point for self-reproduction is not the invertibility but the ability to have the program (enzyme) refer to and manipulate the data (strand) that produced it.

  Part 3: The residue report

  The user suspects three distinct things:

  A. Gödel self-reference: a numbered formula that talks about proofs and its own provability (semantic, with truth values).
  B. Quines and Futamura projections: syntactic self-application that produces a program that outputs itself (or a specialized version). Total functions.
