  The wreckage:

  - The isomorphism claim is not an isomorphism in the mathematical sense. It is a surjective function from strands to enzymes (with redundancy) without an inverse.
  - The system does not have an internal interpreter, so we cannot achieve the same level of reflective power as in a language with `eval`.
