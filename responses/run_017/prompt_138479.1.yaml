  We want f(S) = S.

  So it is a fixed point of the function that compiles and then runs the program on itself.

  This is similar to the recursion theorem in computability: there exists a program that, when given input x, can obtain its own source code and then do something with it. But in this case, we are not obtaining the source code per se; we are using the source code (the strand) as input to the program (the enzyme) to produce a copy.

