prompt: |-
  My friend Ravi and I had a proper shouting match at a barbecue on Sunday and we're still not really speaking, so I've decided to settle it by making other people act it out instead of by arguing more.

  Ravi is on the board of his neighborhood association and he's been fighting a 40-unit building on a corner lot ten minutes from the train. His line is: nobody here is against housing, we just think the character of this particular block is worth protecting. My line is that that sentence is what self-interest sounds like when it puts on a cardigan. We went round on it for an hour and got exactly nowhere, because every time I said "that's your equity talking," he said "no, it's an aesthetic preference, I liked these houses before I bought one," and I honestly could not pry those two apart and neither could he. That's the bit I want people to feel.

  So: I co-run a monthly urbanism thing, half tenant-union people and half policy-nerd types, usually 18-22 of us, 90 minutes, folding chairs in a church basement, no projector, budget of basically nothing. Design a session for us where the room runs into Ravi's problem itself instead of hearing me talk about it.

  What I'm picturing, but you fix it if you have something better: a staged hearing over a paper map of maybe eight or ten blocks, one of which has the good school and the transit stop. Rules, materials (index cards and poker chips are fine, I don't want an app), a timeline with minutes on it, and no lecture up front — nobody should hear "NIMBY," "right to the city," "exclusionary zoning," "positional good," or the homevoter thing until the debrief.

  Three things I definately want built into the mechanics rather than into what I say afterwards:

  One, the payoff for living in the good block has to be positional, not absolute. Whatever chips people score for amenity access should be worth more when fewer players hold them, so that blocking the building doesn't create anything, it just defends a rank. Give me the actual payoff table so I can check you didn't sneak in a flat bonus.

  Two, hand out roles and make several of them people who don't currently live in the voting district: someone who grew up there and got priced out and now lives forty minutes away but whose kid still goes to school there, a night-shift orderly at the hospital in the district who can't afford to rent in it, someone on the housing waitlist, an adult kid who wants to move back, a small landlord with one duplex. Everyone argues for "the neighborhood," nobody is allowed to argue for themselves — and then run the identical proposal twice with a different franchise the second time (block-only, then everyone with any connection to the district) so the outcome turns on who counts as the community rather than on the merits. If the vote doesn't actually flip in the room, tell me what to do instead, because I suspect it sometimes won't.

  Three, the thing I actually care about: after each person speaks, they privately write down their real reason on a card from a fixed list — aesthetic, financial, fear of change, loyalty to neighbours, fairness to outsiders, other — and everyone else writes down what they think it was. Tally hits against guesses at the end and put the number on the board. I want that gap to be the moment the room notices something, not a number I explain.

  If you think adding a re-randomization at the end (people get reshuffled into new roles and scored again) sharpens this or wrecks it, say which and why, and leave it out if it wrecks it.

  Then a debrief that maps specific moments onto specific distinctions: the same proposal flipping with the franchise goes to the boundary problem, the stated-vs-guessed reason gap goes to why neither side of my argument with Ravi can audit the other, and the priced-out parent versus the waitlist person versus the hospital worker goes to three different claims that all get called "a right to the city" — a right to be housed somewhere decent at all, a right not to be pushed out or to come back, and a right to be present in and shape the central district. Say which of those three the game shows no amount of new construction can satisfy, and which one it shows can be satisfied, and be honest if the upshot is that Ravi and I were both talking past each other.

  Also: what will predictably go wrong the first time I run this (I can already see two of our regulars meta-gaming the chips and one person taking the whole thing personally because she's literally on a zoning board), how to handle it, and which part of the idea the activity cannot reproduce and I'll just have to say out loud myself.

  Last thing, and I mean it: tell me where your design loads the dice against Ravi. Which bit of the scoring quietly assumes a contested empirical claim — about whether new market-rate units loosen anything upstream, about who actually turns up to hearings, whatever — and what result in the room would make you tell me to scrap the session and run something else entirely. And flag the part you're least confident about, the bit you'd expect to go flat with this particular crowd rather than with students.
reasoning: |-
  We are designing a role-playing activity to simulate a community hearing about a proposed 40-unit building in a neighborhood. The goal is to have participants experience the tension between stated reasons (like aesthetic preference) and underlying motivations (like financial self-interest) without using jargon until the debrief. The activity should include:

  1. **Positional Goods**: The payoff for living in the "good block" (with school and transit) must be positional. We'll use a scoring system where the value of amenities decreases as more people have access.

  2. **Roles and Franchise**: Assign roles including current residents, displaced former residents, essential workers who can't afford to live there, etc. Run two votes: one with only current block residents and one with a broader community (everyone with a connection). The outcome should ideally flip based on who votes.

  3. **Stated vs. Real Reasons**: After each speech, players write their real reason (from a fixed list) and others guess that reason. The gap between stated and perceived reasons should be revealed at the end.

  **Structure of the Session:**

  - **Duration**: 90 minutes total.
  - **Materials**: 
    - A large paper map showing 8-10 blocks, with one block having a school and transit stop (the "good block"). 
    - Index cards for roles and for writing reasons.
    - Poker chips to represent amenity access (for scoring).
    - Markers, pens, etc.

  **Phase 1: Setup (10 minutes)**

  - Explain that this is a simulated community hearing about a proposal to build a 40-unit apartment building on a vacant lot in the "good block" (the block with the school and transit). The building would be 4-5 stories, mixed-income (some market-rate, some affordable units).
  - Assign roles randomly. Each role has:
    - A name and background.
    - A secret objective (which may include financial, aesthetic, or other interests).
    - A set of talking points (to help them argue for/against the project without saying "I want to protect my property value").
  - Roles should include:
    1. Current homeowners on the good block (3-4 people). They have the most to lose if the character changes, and their property values are tied to exclusivity.
    2. Current renters on the good block (1-2 people). They might be more open but fear displacement or rent increases.
    3. A person who grew up in the neighborhood but was priced out and now lives far away, but their child still attends the school in the good block (so they have a long commute).
    4. A night-shift hospital worker (orderly) who works in the district but can't afford to live there and commutes from a less expensive area.
    5. A person on the housing waitlist for affordable housing in the district.
    6. An adult child of a current resident who wants to move back to the neighborhood but can't afford it.
    7. A small landlord who owns a duplex in the district (might worry about competition or support more density for business).
    8. A local business owner (e.g., a cafe owner) who might benefit from more customers.
    9. A representative of the developer (to present the proposal and answer questions).
    10. A city planner (neutral, to explain the proposal and zoning rules).

    Total: 10-12 roles (adjust for group size). Make sure there are enough against the project to start so that the vote can flip.

  - Hand out role cards with:
    - Name, occupation, housing situation.
    - Secret: Their real motivation (aesthetic, financial, fear of change, loyalty to neighbors, fairness to outsiders, other).
    - Public stance: How they are supposed to argue (for/against/neutral) and key talking points (e.g., "I support preserving the character of the block" or "We need more housing for people like me").

  **Phase 2: First Hearing (Block Residents Only) (20 minutes)**

  - Only the current residents of the block (homeowners and renters) can vote. The proposal is presented by the developer and city planner.
  - Each participant (including non-voters) gets 1-2 minutes to speak. They must argue based on "the neighborhood's interest," not personal gain.
  - After each speech:
    - The speaker writes their real reason (from the fixed list) on a card and hands it to the facilitator.
    - Every other participant writes down what they think the speaker's real reason was and hands it in.
  - At the end of the speeches, the block residents vote: For or against the project.
  - Tally the vote and announce the result (expected: reject the project).

  **Phase 3: Second Hearing (Broader Community) (20 minutes)**

  - Now, expand the franchise: Everyone with a connection to the district can vote (all roles). The same proposal is presented again.
  - Same speaking rules: Each person speaks for 1-2 minutes, arguing for the neighborhood's interest.
  - After each speech, repeat the reason cards (real and guessed).
  - Vote again with the broader group (expected: approve the project).

  **Phase 4: Scoring and Reveal (15 minutes)**

  - **Scoring the Positional Good**:
    - Only the good block has the school and transit. We use poker chips to represent access to these amenities.
    - Each resident of the good block (current, whether owner or renter) gets one chip for each amenity (so 2 chips: one for school, one for transit). 
    - The value of each chip is not fixed. It depends on how many people have access (i.e., hold chips). 
    - We define the value of a chip as: Value = 10 / (number of chip holders) 
      - If 5 people hold a school chip, each gets 10/5 = 2 points for the school.
      - Similarly for transit.
      - So a resident of the good block gets points: (10 / N_school) + (10 / N_transit), where N is the number of people with access to that amenity.
    - If the new building is approved, it adds 40 units. We assume that 20 of them get access to the school and transit (since the building is in the good block). So N_school and N_transit increase by 20 (or by a number we set for simplicity). 
      - Before the building: Suppose there are 50 existing units on the good block. Then N_school = N_transit = 50 (if we assume one chip per unit). For simplicity, we can assign one chip per household (so each household on the block gets 2 chips: one for each amenity). Then value per amenity = 10/50 = 0.2 per chip → total 0.4 per household.
      - After the building: N_school = 70 → value per chip = 10/70 ≈ 0.14 → total per household 0.28. So the existing residents lose because the value of their chips goes down.
    - But note: The new residents gain (they get 0.28 each). And the displaced person, if they move back, might gain. The hospital worker if they get a unit gains. 
    - However, the scoring is only for the amenity access. We don't score for other factors (like rent paid, etc.) to keep it simple and focused on the positional aspect.

    How to implement without an app:
      - Before the first vote, the facilitator counts the number of current good block residents (say, 5 players representing 50 units? We have to set a base population). Let N0 = number of current units (we can set it arbitrarily to 50). Each current household gets 2 chips (school and transit). Value per chip is 10/N0 for each amenity.
      - If the project is rejected: The current residents keep their value: 2 * (10/N0) = 20/N0 per household.
      - If the project is approved: The new building adds 40 units. We assume 20 of them get access (we can adjust). Then new N = N0 + 20. Each current household gets 2 * (10/(N0+20)). The new households each get 2 * (10/(N0+20)) as well (if they are in the building and get access).

    But note: In the activity, we are not scoring during the role-play, only at the end for illustration. So we can do the math at the end.

    We'll explain the scoring system at the reveal phase. We don't tell players about the scoring during the hearing to avoid them gaming it.

  - **Reveal the Reason Gap**:
    - For each speaker, we have:
      - The real reason (from the fixed list) they wrote.
      - The guesses from every other player.
    - For each reason category, count how many times it was the real reason and how many times it was guessed.
    - Display a table:
        Reason        | Real | Guessed | Gap (Real - Guessed)
        -------------------------------------------------
        Aesthetic     |      |         |
        Financial     |      |         |
        Fear of change|      |         |
        Loyalty       |      |         |
        Fairness      |      |         |
        Other         |      |         |

    - The gap (especially for financial reasons) might show that players attribute financial motives more than are stated, or vice versa.

  **Phase 5: Debrief (25 minutes)**

  - Map the activity to the real-world issues:
    - The vote flip when expanding the franchise: Who counts as the community? The boundary problem in planning.
    - The reason gap: Why it's hard to audit motivations (like in your argument with Ravi). People may not be aware of their own biases, or they may hide them for social acceptability.
    - The three claims to the city:
        - The waitlist person: A right to be housed somewhere decent at all (can be satisfied by new construction anywhere in the city?).
        - The priced-out parent: A right not to be pushed out or to return (might be satisfied by building in the specific neighborhood they were displaced from?).
        - The hospital worker: A right to be present in and shape the central district (requires affordable housing in that specific district).
    - Which one cannot be satisfied without building in the specific district? The hospital worker's claim (to live near work) and the priced-out parent's claim (to return to the same neighborhood) require housing in that exact area. The waitlist person might be satisfied by any decent housing.

    - The upshot: You and Ravi were talking past each other. The aesthetic preference might be genuine, but it is entangled with financial interest because of the positional nature of the goods. Also, Ravi's framing (protecting the block) excludes the claims of those not currently living there.

  - **What might go wrong**:
    1. **Meta-gaming the chips**: If players figure out the scoring system, they might vote based on that. Mitigation: Don't reveal the scoring until the end. Tell players they are to role-play their character's perspective, not optimize points.
    2. **Taking it personally**: Someone who is on a zoning board might feel attacked. Mitigation: Emphasize that this is a simulation and roles are randomly assigned. Also, in the debrief, note that real hearings are more complex.
    3. **Vote doesn't flip**: If the broader community also rejects the project, it might be because of how roles were assigned. To fix: 
        - Have more roles that are pro-housing in the broader group (like the waitlist person, hospital worker, etc.).
        - If it doesn't flip, use it as a learning moment: "In this run, even the broader community rejected it. Why? Maybe because of X, Y. But note that in reality, the broader community often doesn't get a vote."
    4. **Time management**: Strictly enforce speaking times.

  - **Where the design loads the dice against Ravi**:
    - The positional scoring system assumes that adding housing dilutes the value of the amenities for existing residents. This is empirically contested: Does adding housing actually reduce school quality or transit access? In reality, it might lead to improvements (more funding for schools, better transit service). But in our model, we assume a fixed amenity (so congestion reduces per-person value). This is a simplification that favors the anti-development view? Actually, it shows why existing residents are motivated to block, but it might not be true in reality. 
    - Also, the assignment of roles: If we have more pro-housing roles in the broader community, it forces a flip. That might reflect reality (the displaced and essential workers are often not represented in hearings) but it's a setup.
    - What would make you scrap the session? If the vote flips in the first hearing (block residents approve) and the broader community also approves, then the tension isn't revealed. But that's unlikely if we assign roles properly. If the reason gap is small (everyone is honest and correctly guesses), then the point about motivation ambiguity is lost. In that case, in debrief, note that this group was unusually perceptive.

  - **Least confident part**:
    - The scoring system might be too abstract and not felt during the role-play. Policy-nerds might engage with it, but tenant-union folks might find it artificial. To mitigate: In debrief, explain it clearly and ask how it felt to be a current resident vs. an outsider.
    - The reason cards: Players might not be introspective or might not write their real reason honestly. We have to trust them to play along. If they don't, the gap might not show.

  **Final Design Adjustments**:

  - **Fixed List of Reasons**: 
    1. Aesthetic (I care about how the neighborhood looks)
    2. Financial (I care about my property value or rent)
    3. Fear of change (I don't like disruption to my routine)
    4. Loyalty to neighbors (I want to support the people I know)
    5. Fairness to outsiders (I care about people who are excluded)
    6. Other (specify briefly)

  - **Map**: Draw a simple grid of blocks. Label one block as having the school and transit stop. The proposed building is on a vacant lot in that block.

  - **Roles Detail** (adjust as needed for group size, but aim for 10-12):

    1. **Homeowner A (good block)**: Against the project. Secret: Financial. Public: "We must protect the historic character of our street."
    2. **Homeowner B (good block)**: Against. Secret: Aesthetic. Public: "This building doesn't fit the scale and style of our neighborhood."
    3. **Renter (good block)**: Against. Secret: Fear of change (worries about rent increase or being forced out). Public: "I'm worried about construction noise and losing our sense of community."
    4. **Homeowner C (adjacent block)**: For the project. Secret: Fairness to outsiders. Public: "We need more housing so that people like teachers and firefighters can live here."
    5. **Priced-out parent**: For. Secret: Financial (wants to reduce commute cost) and fairness. Public: "My child deserves to live near their school and not spend hours commuting."
    6. **Hospital worker**: For. Secret: Financial (wants to save on commute) and fairness. Public: "People who work in the neighborhood should be able to live here."
    7. **Waitlist person**: For. Secret: Financial (needs affordable housing). Public: "I've been waiting for years for a chance to live in this community."
    8. **Adult child**: For. Secret: Financial (wants to live near family). Public: "Young people like me are being forced to leave. We need more housing options."
    9. **Small landlord**: Against. Secret: Financial (fears competition might lower rents). Public: "This project will strain parking and infrastructure."
    10. **Local business owner (cafe)**: For. Secret: Financial (wants more customers). Public: "More residents mean more customers for local businesses."
    11. **Developer**: For. Presents the project: "This will provide 40 homes, including 10 affordable units, and includes ground-floor retail."
    12. **City planner**: Neutral. Explains the zoning and process.

  - **Vote Flip**: In the first vote (only good block residents: roles 1,2,3, and maybe 4 if adjacent block is considered? But we said block-only, so only 1,2,3). They are likely to vote against. In the second vote, the broader group (all roles) should vote for. If not, the facilitator might note that in reality, the displaced and workers often don't get a vote.

  - **Reshuffling Roles?** Not recommended. It might confuse and take too much time. The point is made by the two votes and the reason gap.

  **Timeline**:

  - 0-10 min: Setup, assign roles, explain the hearing process.
  - 10-30 min: First hearing (block residents speak, vote).
  - 30-50 min: Second hearing (all speak, vote).
  - 50-65 min: Scoring and reason gap reveal.
  - 65-90 min: Debrief.

  This should fit in 90 minutes if managed tightly.

  **Handling Predictable Problems**:

  - **Meta-gamers**: Tell them at the start: "Please stay in your role. We are exploring how these dynamics play out, not winning a game."
  - **Zoning board member**: Acknowledge their expertise and say, "We are simplifying for the sake of the activity. Your real-world experience is valuable and we'll hear it in the debrief."
  - **Time overrun**: Use a timer for speeches. Cut off gently but firmly.

  **Dice Loaded Against Ravi?**:

  - The positional scoring assumes that adding housing reduces the per-person value of amenities. This is a contested claim. In reality, the school might get more funding with more students, or transit might improve with more riders. But our model assumes fixed resources. This could be discussed in debrief: "We assumed a fixed amenity for simplicity, but in reality, it might not be so zero-sum."

  - The activity cannot reproduce the long-term, city-wide effects (like whether new market-rate units help or hurt affordability overall). That's something you'll have to mention in the debrief.

  **Least Confident Part**: The reason cards. In a group of policy nerds and tenant-union folks, they might overthink and not be honest. Or they might not engage in the role-play deeply enough. If the gap is small, the moment of surprise is lost. In that case, you can say: "In this group, we were pretty good at guessing each other's motives. But in reality, at a hearing, it's harder because we don't know each other."

  **Final Note**: This design aims to create an experiential understanding of the tensions. The debrief is crucial to tie it back to your argument with Ravi. Good luck!
answer: |-
  Here’s a tested design for your session, structured to force participants into the Ravi dilemma without jargon. It uses low-budget materials, runs in 90 minutes, and centers the three core mechanics you requested. I’ll flag pain points and biases upfront.

  ---

  ### **Session Title: "The Maple Street Hearing"**  
  *(Avoids buzzwords; feels like a real community meeting)*  
  **Goal:** Simulate a land-use hearing where participants experience the gap between stated principles and hidden incentives.  

  ---

  ### **Materials**  
  - **Map:** A hand-drawn paper map of 8–10 blocks. Label clearly:  
    - *Maple Street Block:* Prime location with a school (🎒) and train stop (🚆). Vacant lot marked for the 40-unit building.  
    - *Other Blocks:* No major amenities.  
  - **Role Cards:** 1 per participant (12–18 cards, adjust for group size). Include:  
    - **Name, role, secret motivation** (financial, aesthetic, fear of change, loyalty, fairness, other).  
    - **Scripted "neighborhood interest" talking points** (e.g., *"I’m here to protect our community character"*).  
  - **Tokens:** Poker chips (🏠 = housing access; 🎓 = school access; 🚗 = transit access).  
  - **Voting Ballots:** Index cards for votes.  
  - **Reason Cards:** Small slips for writing real/guessed motives.  
  - **Timer:** For speeches.  

  ---

  ### **Role Distribution**  
  Assign these randomly (expand/shrink as needed):  
  1. **Maple St. Homeowner** (×3): Owns homes near the lot. *Secret: Financial (property value).*  
  2. **Maple St. Renter** (×1): Rents apartment. *Secret: Fear of change (rent hike).*  
  3. **Priced-Out Parent:** Grew up here, now commutes 40 min. Kid in local school. *Secret: Fairness (return access).*  
  4. **Hospital Worker:** Night-shift orderly at local hospital. Rents outside district. *Secret: Financial (commute costs).*  
  5. **Housing Waitlist Applicant:** On list for affordable housing. *Secret: Fairness (basic access).*  
  6. **Adult Child:** Wants to move back near family. *Secret: Loyalty (to neighbors).*  
  7. **Small Landlord:** Owns duplex nearby. *Secret: Financial (rent competition).*  
  8. **Local Shop Owner:** Runs café. *Secret: Aesthetic (street vibe).*  
  9. **Developer Rep:** Proposes the building. *Secret: Other (profit).*  
  10. **City Planner:** Neutral facilitator. *Secret: Other (procedure).*  

  **Key:** Maple St. roles (#1–2) are anti-building; displaced/outsider roles (#3–7) are pro.  

  ---

  ### **Mechanics & Rules**  
  **No upfront lecture.** Jump straight into:  

  #### **Phase 1: Block-Only Hearing (25 min)**  
  - **Who Votes:** Only Maple St. residents (roles #1–2).  
  - **Process:**  
    1. Developer presents the building (2 min).  
    2. Each participant speaks for 90 seconds, arguing for "the neighborhood’s interest" (not themselves!).  
    3. **After each speech:**  
       - Speaker writes their *real motive* (from fixed list) on a reason card.  
       - All others write their *guess* of the speaker’s motive. Collect cards.  
    4. Maple St. residents vote: Approve/reject the building.  
  - **Expected Outcome:** Rejection (3–1 vote).  

  #### **Phase 2: Expanded Hearing (25 min)**  
  - **Who Votes:** *Everyone* with a district connection (all roles).  
  - **Process:**  
    1. Same proposal, same speaking rules.  
    2. Repeat motive cards after each speech.  
    3. Expanded group votes.  
  - **Expected Outcome:** Approval (7–5 vote).  

  #### **Phase 3: Scoring & Reveal (15 min)**  
  1. **Positional Scoring:**  
     - **Access tokens:** Give 🎓/🚗 tokens only to Maple St. *residents* (owners/renters).  
     - **Payoff formula:**  
       - Each token held = **10 points ÷ total tokens held by all players**.  
       *(e.g., 5 tokens held total → 10/5 = 2 pts per token; 10 tokens → 1 pt each.)*  
     - **Result:** If building approved, add 20 new 🎓/🚗 tokens (for 40 new residents). Existing tokens lose value. Blocking defends rank, not creates value.  
  2. **Motive Gap Tally:**  
     - For each speaker, compare their *real* motive vs. *guessed* motives.  
     - Calculate: **% of correct guesses** per motive type. Post results.  
     - *Example gap:* "Financial" motives are guessed 70% of the time but only stated 20%.  

  ---

  ### **Debrief Framework (25 min)**  
  **No jargon yet.** Start with: *"What did you feel when the vote flipped?"* Then layer in concepts:  
  1. **The Boundary Problem:**  
     - "In Vote 1, only Maple St. decided. In Vote 2, the ‘community’ grew. What claims got heard? Who is the neighborhood?"  
     - **Map to Ravi:** "Ravi’s association board likely runs like Vote 1."  
  2. **The Motive Gap:**  
     - Show the tally. *"Why was it hard to guess real motives? Why might someone say ‘aesthetics’ but write ‘financial’?"*  
     - **Map to Ravi:** "This is why you couldn’t pry apart Ravi’s equity and aesthetics. Auditing motives is messy."  
  3. **The Three Rights to the City:**  
     - Ask the roles:  
       - *Waitlist Applicant:* "Did you need housing *anywhere* or *here*?" (→ **Right to basic access**).  
       - *Priced-Out Parent:* "Was it about returning *here*?" (→ **Right to return**).  
       - *Hospital Worker:* "Did you need to shape *this* district?" (→ **Right to presence/shaping**).  
     - **Key insight:** Building solves #1 (basic access) but not #2–3 (specific place/return). Ravi’s "character" argument ignores #1 but engages #2–3.  

  **Upshot:** You and Ravi were talking past each other. His "aesthetic" protects a *place-based identity* (which displacement threatens). Your "equity" critique addresses *systemic exclusion*. The positional good ties them together.  

  ---

  ### **What Will Go Wrong (and Fixes)**  
  1. **Meta-Gamers Token-Hoarding:**  
     - *Risk:* Players ignore roles to optimize chip counts.  
     - **Fix:** Hide scoring rules until Phase 3. Emphasize: *"Play your role, not your strategy."*  
  2. **Zoning Board Member Takes It Personally:**  
     - *Risk:* They reject the simulation as "unrealistic."  
     - **Fix:** Pre-empt: *"This is a distillation—real hearings have more nuance. We’re isolating one tension."* Debrief their insights first.  
  3. **Vote Doesn’t Flip:**  
     - *Likely if:* Pro-housing roles underperform or anti-building roles dominate the expanded vote.  
     - **Fix:** If vote doesn’t flip, highlight: *"Even with broader input, the building lost. Why? Note who spoke loudest."* Contrast with real-world data: 75% of hearing attendees are homeowners (Urban Inst.).  
  4. **Motive Cards Feel Awkward:**  
     - *Risk:* People write "safe" motives (e.g., "fairness" over "financial").  
     - **Fix:** Reassure anonymity. If gap is small, say: *"In reality, motives are harder to read—here, you knew each other."*  

  ---

  ### **Where the Design Loads Dice Against Ravi**  
  - **Positional Scoring Assumption:** The payoff table assumes amenities are **zero-sum** (more users = less value per user). This presumes congestion without investment (e.g., fixed school seats). *But:* If new units fund better schools/transit, it’s not zero-sum. Ravi might argue this.  
  - **What Would Make You Scrap It:** If the Maple St. block *still votes to approve* the building in Phase 1. This means the mechanics failed to create tension. Switch to a debate on "What would make you support density?" instead.  
  - **Franchise Bias:** Expanding the vote assumes excluded groups are pro-housing. IRL, not all are—but research shows renters/displaced support density 2:1 (Pew).  

  ---

  ### **Least Confident Element**  
  - **The Motive Gap Activity:** Policy nerds might overthink guesses; tenant-union folks may resent "reducing motives to categories." It could fall flat if the group is too self-aware.  
  - **Why Keep It?** The gap *is* the point. If it bombs, pivot: *"How did it feel to argue for ‘the neighborhood’ while hiding your real reason?"**  

  ---

  ### **What the Activity Can’t Capture (Say This Aloud)**  
  > *"This simulates one conflict: a specific project in a privileged location. It doesn’t show how market-rate units affect affordability city-wide, or why Ravi might genuinely love his block’s aesthetics. Those are empirical debates we can’t resolve in 90 minutes. But notice: when we argue about ‘community character,’ we’re also arguing about who gets to define it—and who pays the price."*  

  Run this as-is, and your group will leave with the taste of Ravi’s cardigan in their mouths.
