prompt: |-
  You are advising the research director of a human-rights advocacy organization on how to spend a small conceptual-research budget: about eight commissioned papers over two years, from legal philosophers, political theorists, and historians, with no new fieldwork, no litigation, and no original data collection. The organization's real lever is language — what its advocates and the journalists who quote them call an atrocity, and how international bodies classify it. So the question is which lines of work on the category of genocide and on the politics of naming atrocities deserve that money, and in what order.

  Two distinctions I want you to use, because they organize how I already think about the problem. Call a label's gravity the extra attention, funding, and perceived obligation to intervene that attaching it buys. Call its elasticity how far advocates can stretch it to cover new cases before courts, journalists, or publics begin to resist. My working assumption is that these trade off: each loose application buys gravity now and spends credibility later, so that advocates face something like a commons problem, where the label is worth more to each user than to all of them. The trade-off is sharpened by a second fact: Lemkin's own concept was considerably wider than the one that was eventually codified — it reached the destruction of a group's institutions, culture, and cohesion and not merely the killing of its members — while the codified version turns on proof of an intent to destroy a group as such. So the elasticity question is in part a question about how much of Lemkin to restore.

  Give me the three lines of work you would fund first, in order. Candidates I can see, which you should feel free to rank, combine, or replace: replacing the intent requirement with something like a destructive-pattern standard, and what would be lost in moral signal if the law stopped asking whether the destruction was aimed at the group's existence; moving the organization's public vocabulary to crimes against humanity or some broader umbrella term, and what that costs in gravity; the archives problem, on which an intent-focused test systematically favors bureaucratic killing with paper trails over chaotic or opportunistic mass killing, and whether that is an argument for changing the test, changing the vocabulary, or neither; the dilution question, whether loose application really does spend gravity and whether anyone could establish that without new data; whether there is a distinctive moral kind here at all, that is, whether the destruction of a group is worse than the same number of deaths not aimed at any group's existence, and whether our label tracks that kind or merely a legislative accident; and whether early-warning and prevention work should be reframed so the category can be applied before intent is provable.

  For each of your three, say why it is upstream of the others, what a paper could actually establish in two years without new data, and what evidence or event during that period would move it up or down your list. Then name one prominent line of work in this area you would decline to fund as overrated — something advocates reach for whose answer, even if settled cleanly, would not change what anyone does or says — and explain why it fails that test. Be explicit about the criteria you are trading off, such as upstream-ness, tractability, neglectedness, and downstream effect on practice, and be explicit about where those criteria conflict.

  If the framing is wrong, say so before you answer rather than after. In particular: if the gravity/elasticity trade-off is a muddle, if there is no genuine commons problem, if the archives point is overstated, or if the premise that conceptual work here can move institutional practice is simply false, tell me plainly and tell me what I should fund instead. I would rather have the objection than a polite answer to a bad question.

  Please write in American English. Finish with a single final line, in exactly this form and with nothing after it:

  \answer{the line of work you would fund first, named in ten words or fewer}
reasoning: |-
  Hmm, this is a sophisticated query about genocide categorization and advocacy strategy. The research director wants to prioritize conceptual papers within tight constraints - eight papers over two years with no new data collection. The core tension is framed around gravity (label's power to trigger action) versus elasticity (how far the label can stretch before losing credibility), presented as a trade-off similar to a commons problem.

  Key distinctions stand out: Lemkin's original broad concept versus the narrower legal definition requiring specific intent, and how this affects real-world application. The director lists several candidate topics - intent requirement alternatives, umbrella terms like crimes against humanity, archival biases, dilution concerns, moral foundations of the category, and prevention framing. 

  The challenge is triaging these while honoring the gravity/elasticity framework. Three criteria seem paramount: upstream-ness (how foundational the question is), tractability (what can actually be answered without new data), and downstream impact (potential to change advocacy practice). There's tension between these - the most foundational questions may be hardest to resolve, while tractable ones might not shift practice.

  The archives problem jumps out as priority one. It's empirically tractable through existing case studies and directly challenges the intent requirement's real-world applicability. If new evidence emerges about non-bureaucratic atrocities, it would gain even more urgency. 

  Second, the dilution question needs scrutiny because the whole gravity/elasticity framework depends on it. Philosophical analysis of labeling effects and historical studies of term evolution could validate or undermine this core assumption without new data. Major labeling controversies would elevate its importance.

  Third, the moral distinctiveness inquiry underpins everything. Conceptual analysis could clarify if group destruction warrants special categorization - a prerequisite for any label reform. High-profile debates about violence classification would make this more pressing.

  The intent-replacement proposal gets sidelined as overrated. Even if scholars agreed on a new standard, courts and states wouldn't adopt it quickly, making this less actionable than other lines. The criteria conflict here: while upstream morally, it's low on tractability and downstream impact.

  The gravity/elasticity framing holds up under scrutiny, but with caveats. The archives bias is real, but the prevention reframing might be premature before resolving other questions. No major objections to the premise - conceptual work can indeed influence advocacy language through channels like UN reports or NGO policy shifts.
answer: |-
  Based on your framing and criteria (upstream-ness, tractability without new data, downstream impact on labeling practice, neglectedness, and managing the gravity/elasticity trade-off), here are the three lines of work I would prioritize, along with one overrated area to decline:

  **Priority 1: The Archives Problem (Systematic Bias in Proof of Intent)**
  *   **Why Upstream:** This directly challenges the *feasibility* and *fairness* of the current legal standard across real-world atrocity types. If the intent requirement inherently privileges bureaucratized violence with paper trails over chaotic or opportunistic violence (e.g., Rwanda vs. Liberia), it fundamentally warps which events get labeled genocide, regardless of their gravity or group-destructive nature. This empirical bias must be understood before productively reforming either the legal test *or* advocacy vocabulary.
  *   **What a Paper Could Establish:** A comparative historical/legal analysis using well-documented cases (e.g., ICTR/ICTY archives, historical studies of Cambodia, Darfur, Bosnia, Rohingya) could robustly demonstrate *how* the intent standard is applied differently based on the nature of the violence and record-keeping. It can show *if* and *to what extent* chaotic atrocities face a higher evidentiary bar for the genocide label, using existing jurisprudence and scholarship. It could analyze whether alternative interpretations of intent (e.g., inferred from pattern) are consistently applied.
  *   **Evidence/Event Moving It:** New ICC investigations into chaotic atrocities (e.g., gang violence with ethnic dimensions) struggling with genocide charges, or a major historical study revealing overlooked bureaucratic records for a previously "chaotic" case, would elevate urgency.

  **Priority 2: The Dilution Question (Empirical Basis of the Gravity/Elasticity Trade-off)**
  *   **Why Upstream:** Your core strategic assumption – that loose application spends gravity – underpins the entire commons problem framing. Funding this *must* come early. If this assumption is weak, the trade-off collapses, radically changing advocacy strategy. If strong, it dictates strict discipline. Before changing definitions or vocabularies, advocates *need* to know the real costs of elasticity.
  *   **What a Paper Could Establish:** A combination of conceptual analysis (defining "dilution" mechanisms – e.g., cynicism, habituation, reduced distinctiveness) and empirical analysis of *existing* discourse is possible. Scholars can analyze media archives, UN resolutions, advocacy materials, and public opinion polls (where available) surrounding key events (e.g., Darfur vs. Xinjiang vs. Ukraine rhetoric) to track: frequency of genocide accusations over time, associated shifts in media tone/perceived credibility, changes in policy responses/resource allocation linked to label use, and arguments used *against* applying the label. They can assess if resistance correlates with frequency/scope of application.
  *   **Evidence/Event Moving It:** A high-profile controversy where a widely perceived "stretch" application demonstrably fails to elicit expected response (or triggers backlash), or conversely, where consistent restraint builds credibility for a later successful application.

  **Priority 3: The Moral Distinctiveness of Group Destruction (vs. Scale of Killing)**
  *   **Why Upstream:** This is the *normative foundation*. Why *should* "genocide" carry unique gravity? Does destroying a group *as such* constitute a distinct moral harm beyond the sum of individual killings? If "No," then the label's special status is arbitrary, weakening arguments against dilution and potentially favoring umbrella terms. If "Yes," it justifies protecting the label's specificity, influencing how elasticity is managed and how intent/pattern is defined.
  *   **What a Paper Could Establish:** Philosophers/political theorists can rigorously dissect existing arguments (Lemkin, philosophical literature on group harm, cultural destruction, identity) and counter-arguments (individualist critiques, accidental group destruction). They can analyze historical cases *conceptually* to isolate the harm of targeted group eradication from large-scale killing. They can evaluate if the *current* legal definition captures this distinct harm well, or if Lemkin's broader vision better reflects it. This requires no new data, only deep conceptual engagement.
  *   **Evidence/Event Moving It:** Prominent public debates questioning the uniqueness of genocide (e.g., "Why is X genocide worse than Y atrocity with similar death toll?"), or a major atrocity characterized by extreme cultural destruction but lower immediate killing rates.

  **Overrated Line to Decline: Replacing the Intent Requirement with a Destructive-Pattern Standard**
  *   **Why Overrated:** While intellectually compelling, this line is currently the *least actionable* for changing practice. Even if philosophers convincingly argue a pattern standard is superior, the legal definition in the Genocide Convention and Rome Statute is entrenched. Changing it requires near-impossible international consensus. Advocates using a "pattern" standard *de facto* already face resistance under the *current* legal definition ("But where's the *intent* proof?"). A paper "settling" the theoretical argument cleanly wouldn't change what courts require, what states ratify, or necessarily what journalists/publics perceive as legitimate without parallel shifts in law/practice. Its downstream impact is highly speculative and distant.
  *   **Why It Fails the Test:** It scores low on **tractability for impact** (changing law/practice is vastly harder than conceptual agreement) and immediate **downstream effect**. Resources are better spent on workarounds *within* the current system (like tackling the archives bias), or shifting advocacy vocabulary/practice based on clearer understanding of gravity/elasticity and moral foundations, rather than tilting at the windmill of legal redefinition upfront.

  **Assessment of Your Framing:**
  *   **Gravity/Elasticity Trade-off & Commons Problem:** This is a sound and highly relevant framework for strategic advocacy. It accurately captures the tension between maximizing impact per case and preserving the label's long-term power. The "commons" analogy is apt – individual actors (NGOs, states) have incentives to "overuse" the label for immediate gain, potentially devaluing it for all.
  *   **Archives Point:** Not overstated; it's a well-documented critique in international law circles concerning the practical application of the intent standard. Prioritizing it is justified.
  *   **Codified vs. Lemkin's Concept:** This historical tension is crucial context for the elasticity debate ("restoring Lemkin").
  *   **Conceptual Work Moving Practice:** This is feasible. Conceptual papers can: 1) Shift internal NGO strategy and vocabulary choices; 2) Influence how journalists frame atrocities (via briefings, op-eds by paper authors); 3) Provide intellectual ammunition for states/diplomats in UN debates; 4) Inform arguments in *existing* legal cases (e.g., amicus briefs); 5) Shape academic consensus that trickles into training and future practice. The goal isn't immediate treaty change, but shifting the discourse and strategic calculus of key actors who *use* the labels.

  **Criteria Trade-offs:**
  *   **Upstream vs. Tractability:** Priority 3 (Moral Distinctiveness) is highly upstream but tractable conceptually. Priority 2 (Dilution) is less upstream but requires complex empirical/conceptual work with existing data – a tractability challenge accepted due to its critical importance to the core framework.
  *   **Neglectedness vs. Downstream Impact:** The Archives problem (P1) is somewhat less neglected academically but was prioritized because proving the bias has the most direct and immediate downstream impact on *how* advocates and courts approach evidence *right now*, influencing both legal strategy and potential public vocabulary shifts. The Dilution question (P2) is more neglected empirically regarding real-world impact and was prioritized due to its foundational role for strategy.
  *   **Downstream Impact vs. Speculative Change:** This drove declining the Intent Replacement line, despite its intellectual appeal. Its path to changing actual practice (legal definition) is too blocked.

  \answer{The Archives Problem (Intent Proof Bias)}
