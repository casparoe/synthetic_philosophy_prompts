  Here’s a structured two-page proposal draft focused on your core distinction, designed for clarity and impact. I’ve kept it concise for your word count, leaving space for your citations later.

  ---

  **Proposal Title: Beyond Causal Roles: Testing the Robust Semantic Content of Neural Network Representations**

  **1. Research Question & Core Distinction:**  
  Current debates about whether neural networks (NNs) "genuinely" possess representations are stalled because they conflate three distinct notions:  
  *   **Causal-Role (CR):** A state/feature/direction *mediates* specific input-output behaviors (e.g., ablating "circuit X" disrupts behavior Y).  
  *   **Semantic Content (SC):** A state *has correctness conditions* – it can be *true* or *false* about the world, independent of specific inputs/behaviors (it can *misrepresent*).  
  *   **Portability (P):** A state *type* (e.g., a specific direction vector) reoccurs reliably across different models trained on similar data/tasks.  

  **My central question is:** *Can current evidence (e.g., probes, activation steering, dictionary learning) establish **Semantic Content (SC)** in NNs, or does it primarily only demonstrate **Causal-Role (CR)** functionality? I hypothesize that SC requires robust generalization under extreme distributional shift – specifically, off-manifold conditions – which current methods do not test.*

  **2. Why the Standard Evidence is Insufficient:**  
  Probes, steering, and sparse autoencoders powerfully demonstrate **CR**: they show a state/direction *is used* by the network for a task *within its operational distribution*. They may hint at **P** if the feature appears in multiple models. **However, they crucially fail to test SC**:  
  *   **Probes:** Supervised probes learn to *use* activations; they don't reveal if the activation itself inherently carries truth-apt content. A probe finding "dogness" doesn't show the activation *means* "dog" – it could be a complex, non-semantic correlate.  
  *   **Steering:** Injecting a "dog" vector alters output *towards dog-like predictions*. This demonstrates **CR** – the vector influences behavior – but not that it *means* "dog." It could be acting as a complex key triggering learned responses, not a semantic symbol.  
  *   **Sparse Dictionaries:** These identify directions active for inputs, showing **CR**. They don't show these directions *represent* semantic concepts with inherent truth conditions; they could be highly effective but non-semantic features.

  **3. Proposed Methodology: The Off-Manifold Test for Semantic Content (SC):**  
  The defining characteristic of SC is its *robustness*: something with genuine content should retain its causal influence *even under conditions radically unlike its training data*. **The Test:** Take directions identified via standard methods (e.g., sparse dictionaries, PCA components, steering vectors) as putative semantic features (e.g., "dog head"). Then, artificially construct activation vectors:  
  *   **Far Outside Training Distribution:** Push activations magnitudes far beyond anything seen during training.  
  *   **Novel Feature Combinations:** Combine "features" in ways that never co-occurred in training (e.g., force "dog head" + "car wheel" activation in a layer).  
  *   **Impossible Inputs:** Attempt to activate the feature using synthetic activations corresponding to inputs the network could never physically encounter.  

  **Measure:** Does injecting this *off-manifold* "dog head" vector still *reliably and specifically* steer the model's outputs or internal states towards dog-headedness? Or does its causal role (**CR**) break down?  

  **Robust SC Prediction:** Genuine SC should exhibit significant robustness – the "dog head" vector should still induce dog-headedness, even in these unnatural states.  
  **CR-Only Prediction:** The vector's causal influence will degrade significantly or become nonspecific/unpredictable off-manifold.  

  **4. Work Plan (9 Months):**  
  *   **Month 1:** Select 2-3 standard, well-understood vision or language models (e.g., ResNet, small GPT). Identify key "semantic" directions using established methods (Dictionary Learning, PCA, Causal Tracing). Define quantitative metrics for "steering success" (e.g., logit shift, classifier confidence, human eval of outputs).  
  *   **Month 2-3: Pilot Study (Project Killer):** Focus on a single model and 3-5 high-confidence "semantic" directions (e.g., "dog," "car," "scientist"). Develop cheap methods to construct off-manifold activations (e.g., extreme scaling, random combinations, adversarial perturbations in activation space). **Kill Criterion:** If *all* identified directions *completely* lose their specific causal influence under *any* off-manifold perturbation in the pilot, the hypothesis that SC exists via these methods is likely false; pivot to analyzing *why* CR breaks (still valuable).  
  *   **Month 4-6:** **Main Experiment 1:** Systematically test robustness of identified directions across the spectrum of off-manifold conditions (magnitude, combination, impossibility). Quantify degradation curves. Compare robustness of directions identified as "more semantic" vs. others.  
  *   **Month 7-8:** **Main Experiment 2:** Investigate if *any* identifiable features (e.g., via alternative methods, different layers) exhibit significant off-manifold robustness. Explore if robustness correlates with portability (**P**) across models.  
  *   **Month 9:** Analysis, synthesis, writing. Determine if evidence supports SC existence/robustness, or if representations are primarily CR features tied to the training manifold.  

  **5. Possible Results & Interpretation:**  
  *   **Strong Support for SC:** Significant off-manifold robustness found for directions identified as semantic. Suggests genuine truth-apt content exists and can be isolated.  
  *   **Mixed/Poor Robustness (Likely):** Robustness degrades significantly off-manifold, varying by feature/model/layer. Suggests SC is limited, context-dependent, or that current methods don't isolate it well. Points to representations being primarily **CR** features optimized for the training manifold.  
  *   **No Robustness:** Directions utterly fail off-manifold. Strong evidence that standard methods only find **CR** features, not robust SC.  

  **6. Failure Conditions (vs. Negative Result):**  
  *   **Failure:** The experiment fails to provide a clear answer. (e.g., Off-manifold activations are too unstable to measure *anything* reliably; Steering effects are always nonspecific/noisy, making degradation uninterpretable; Methods to create/manipulate activations prove fundamentally flawed).  
  *   **Negative Result:** Clear evidence that the tested directions *do not* exhibit the robustness required for SC under off-manifold conditions. This is a *significant finding*, demonstrating the limitations of current evidence for semantic realism and supporting the **CR** interpretation. It refines the debate and guides future work on what *could* constitute evidence for SC.  

  **7. Addressing Key Committee Concerns:**  
  *   **"Isn't this just the thermometer debate?"**  
      *   **Answer:** The thermometer analogy highlights the **CR** vs. **SC** distinction perfectly! A thermometer reliably correlates with temperature (**CR**) but arguably lacks *robust semantic content* (**SC**) because its "representation" breaks down under extreme, non-nominal conditions (e.g., deep space, inside a volcano) – its causal role is tied to its specific physical design and intended operating range. *This project asks: Are learned NN features more like robust semantic symbols, or are they fundamentally like thermometers – highly effective causal mediators within their trained domain, but lacking inherent, domain-independent meaning?* We're not conceding; we're operationalizing the philosophical distinction into a concrete, testable empirical prediction about off-manifold behavior.  
  *   **"Why separate Portability (P)?"**  
      *   **Short Answer:** Portability (**P**) is orthogonal to the **CR** vs. **SC** debate and crucial for engineering & scientific understanding. A feature could be **CR** (mediates behavior in one model) without being **P** (found in other models). Conversely, a **P** feature could be a **CR** feature in multiple models *or* potentially possess **SC**. Separating **P** allows us to ask: Does finding the *same* **CR** feature in many models imply anything about **SC**? Does **P** correlate with robustness? **P** is vital for transfer learning, interpretability tool development, and claims about discovering universal computational primitives in NNs. It’s a distinct dimension of what makes a representation scientifically or practically interesting.

  ---

  **Key Strengths of this Proposal:**

  1.  **Clear Distinction:** Explicitly defines and separates the three notions upfront.
  2.  **Sharp Hypothesis:** Focuses the debate on the testable gap between CR and SC.
  3.  **Novel Test:** The off-manifold robustness criterion is concrete and under-explored.
  4.  **Feasible & Scoped:** 9-month plan is realistic, with a clear early exit strategy (pilot).
  5.  **Manages Expectations:** Clearly defines failure vs. a valuable negative result.
  6.  **Anticipates Objections:** Preemptively arms you with strong responses to likely critiques.
  7.  **High Impact Potential:** Regardless of outcome, results will directly inform core debates in AI interpretability and philosophy of AI.

  **Remember to:**  
  *   Insert specific model names (e.g., "ViT-B/16", "GPT-2 Small") and methods (e.g., "SAE from Anthropic", "Causal Tracing via `nnsight`") where indicated.  
  *   Add citations to key papers on representation debates, probes, steering, sparse dictionaries, and potentially philosophical work on mental representation (e.g., Fodor, Dretske, Millikan) where relevant.  
  *   Tailor the off-manifold generation techniques to your specific models/tasks.  
  *   Refine the steering success metrics for your chosen domain (vision vs. language).  

  Good luck with your application! This is a compelling and philosophically grounded project.
