  Here is a decision tree designed to sort students into testimony theory positions without using technical jargon or named theorists. It starts from an uncontroversial case and branches through concrete scenarios, culminating in 8 leaves (6 occupied positions and 2 unoccupied). The tree fits on one page front-and-back (approx. 9 branch nodes, 8 leaves).

  ---

  ### **Testimony Justification Decision Tree**  
  *Start here:*  
  **Case 0:** A stranger on the train platform tells you, "The train leaves at 4:03." You believe them and are justified.  
  *All branches flow from this case.*

  #### **Q1: Non-Agent Reliability**  
  A weather station’s digital display (calibrated by scientists, 4% error rate) shows "4:03" as the departure time. You believe it.  
  → **Is your belief justified in the *exact same way* as when the stranger spoke?**  
  - **Yes** → Go to Q2.  
  - **No** → Go to Q7.  

  #### **Q2: Foreign City Trust**  
  In a city you’ve never visited, a random passerby says, "The pharmacy is two blocks left." You have no reason to distrust them, but no prior experience with locals.  
  → **Are you justified in believing them *without* any background knowledge about the city?**  
  - **Yes** → Go to Q3.  
  - **No** → Go to Q4.  

  #### **Q3: Wikipedia Reliance**  
  You read on Wikipedia: "The train station opened in 1890." No author is listed, but you know editors collaborate to fix errors.  
  → **Is your justification *primarily* because of the group effort (not your personal checks)?**  
  - **Yes** → **Leaf: COMMUNITARIAN ANTI-REDUCTIONISM (Coady)**.  
  - **No** → Go to Q5.  

  #### **Q4: Pattern Trust**  
  Over a week in the foreign city, 10 different passersby give you directions. The first 5 were correct. The 6th says, "The museum is straight ahead."  
  → **Do you need *specific reasons* to trust this 6th person (beyond the past accuracy)?**  
  - **Yes** → Go to Q6.  
  - **No** → **Leaf: GLOBAL REDUCTIONISM**.  

  #### **Q5: Discounted Expert (1)**  
  A female climate scientist (whose correct reports are often ignored due to sexism) says, "Sea levels will rise 2 feet by 2050." You believe her, but others dismiss her.  
  → **Is the core problem *others’ bias* (not their lack of evidence)?**  
  - **Yes** → **Leaf: VIRTUE & CREDIBILITY (Fricker)**.  
  - **No** → Go to Q8.  

  #### **Q6: Hearsay Chain**  
  Your friend says, "I heard from 10 people that the station’s clock runs fast." You know nothing about those 10.  
  → **Can you be justified *without* investigating any link in the chain?**  
  - **Yes** → **Leaf: CREDULITY/ACCEPTANCE (Reid/Burge)**.  
  - **No** → **Leaf: LOCAL REDUCTIONISM**.  

  #### **Q7: Speaker’s Source**  
  Back to Case 0: The stranger was *reading* from the digital display (Q1) and admits this.  
  → **Does your justification *change* because they didn’t "own" the claim?**  
  - **Yes** → Go to Q9.  
  - **No** → Go to Q10.  

  #### **Q8: Default Acceptance**  
  Same as Q2 (foreign city passerby), but now you *disbelieve* them for no reason.  
  → **Is this *always* unjustified (even if they were wrong)?**  
  - **Yes** → **Leaf: CREDULITY/ACCEPTANCE (Reid/Burge)**.  
  - **No** → **Leaf: UNOCCUPIED (unstable: rejects default trust but isn’t reductionist)**.  

  #### **Q9: Personal Assurance**  
  In Case 0, the stranger says, "I checked the schedule myself—it’s 4:03." You later learn they guessed.  
  → **Does this *undermine* your initial justification more than if they’d misread the display?**  
  - **Yes** → **Leaf: ASSURANCE VIEW (Moran)**.  
  - **No** → **Leaf: UNOCCUPIED (unexplored: interpersonal but non-assurance)**.  

  #### **Q10: Distributed Backing**  
  The city council posts a map at bus stops showing pharmacy locations. You use it without checking sources.  
  → **Can the map *alone* justify your belief (even if you don’t research who made it)?**  
  - **Yes** → **Leaf: COMMUNITARIAN ANTI-REDUCTIONISM (Coady)**.  
  - **No** → **Leaf: LOCAL REDUCTIONISM**.  

  ---

  ### **Scoring Key: Answer Patterns to Leaves**  
  | Leaf Position                          | Path (Node Answers)                                                                 |  
  |----------------------------------------|-------------------------------------------------------------------------------------|  
  | **Global Reductionism**            | Q1=Yes → Q2=No → Q4=No                                                            |  
  | **Local Reductionism**             | Q1=Yes → Q2=No → Q4=Yes *or* Q1=No → Q7=No → Q10=No                               |  
  | **Credulity/Acceptance (Reid/Burge)** | Q1=Yes → Q2=Yes → Q3=No → Q5=No → Q8=Yes *or* Q1=Yes → Q2=Yes → Q3=No → Q6=Yes    |  
  | **Communitarian (Coady)**          | Q1=Yes → Q2=Yes → Q3=Yes *or* Q1=No → Q7=No → Q10=Yes                             |  
  | **Assurance (Moran)**              | Q1=No → Q7=Yes → Q9=Yes                                                           |  
  | **Virtue & Credibility (Fricker)** | Q1=Yes → Q2=Yes → Q3=No → Q5=Yes                                                  |  
  | **Unoccupied (unstable)**          | Q1=Yes → Q2=Yes → Q3=No → Q8=No                                                   |  
  | **Unoccupied (unexplored)**        | Q1=No → Q7=Yes → Q9=No                                                            |  

  **Notes on distinctions**:  
  - **Credulity vs. Acceptance** collapses (Q6/Q8): Both treat default trust as foundational. The tree doesn’t force a split, as predicted.  
  - **Fricker** is a leaf (Q5): It separates by diagnosing credibility deficits as distinct failures (vs. reductionist "lack of evidence").  
  - **Unoccupied leaves**: Q8→No is unstable (denies default trust but isn’t reductionist). Q9→No is unexplored (interpersonal but non-assurance).  

  **Most consequential node**: **Q1 (Non-Agent Reliability)**. It splits the tree into two worlds: one where testimony mirrors instrument reliability (→ reductionism/communitarian) and one where human speech is unique (→ assurance/Reid). It also isolates Moran’s view early.  

  **Tree design notes**:  
  - **Hearsay (Q6)** and **distributed backing (Q3/Q10)** explicitly covered.  
  - **Discounted expert (Q5)** forces the bias-vs-evidence choice: Reductionists (local/global) treat it as "hearer needs more evidence"; Fricker/Reid treat bias as a distinct failure.  
  - Avoids jargon: Cases use everyday language (e.g., "group effort" instead of "distributed justifiers").  
  - **Collapses when necessary**: Doesn’t artificially split Reid/Burge or force Fricker into a hybrid.  

  Print double-sided for seminar use. Students sort themselves by answering cases; labels are revealed afterward to spark debate on what the divisions mean.
