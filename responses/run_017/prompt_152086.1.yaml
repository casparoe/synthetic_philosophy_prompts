prompt: |-
  Hi — I'm the deputy director of a tiny county emergency management agency in a river valley: about eleven miles of levee, an upstream dam owned by a power company that is not great at returning calls, a trailer park and an industrial park on the floodplain, roughly nine thousand people total. Eight to twelve times a year I'm the duty officer on a call where, inside thirty or forty minutes, with a laptop, three browser tabs and one phone call, I have to decide what to recommend to the county judge. She signs the order, and whatever I write on the one-page rationale later gets read by the sheriff's office, the state auditor, an insurance adjuster, and occasionally a reporter. The sentence I keep having to write is some version of we know the water will not overtop the levee at the Maple Street gauge, or we know it will, and the difference between those two sentences is sometimes an evacuation of four hundred people at night.

  I got into an argument with a hydrologist friend about this last spring — we had a near miss with the pump station at Maple Street, and ever since, that particular failure mode is the only one anyone in the room can think about, so the same forecast reads completely differently to us than it did a year earlier. She told me to go read up on two things, and I did, sort of: the view that whether someone counts as knowing depends on what is at stake for them (I think it's called pragmatic encroachment, and there's some version where the bar for knowledge goes up when the decision is high-stakes), and the view that the standards a knowledge claim has to meet shift with which error possibilities are live in the conversation (contextualism?). Both seem to say the bar moves, but for different reasons and maybe in different directions, and I need one protocol, not two. So: write me a decision procedure my duty officers and I can actually run in the time we have, built out of those ideas, that starts from a forecast plus a map and ends with one of three outputs — assert knowledge, refuse to assert knowledge and act on the precautionary branch anyway, or stop and hand the call to a person as a values question. For each step say what would count as a sufficient answer, where the procedure just terminates in a no, and where a human has to decide because it's not a factual question anymore.

  Three things I specifically need it to handle, because they are where I keep tying myself in knots. First, whose stakes? If the bar tracks stakes, it seems like it should track the stakes of the people in the trailer park, not mine — but I'm the one making the call, and my stakes are different and point the other way: I get blamed for a costly false alarm and for crying wolf, and that pushes me toward evacuating more than the residents' own interests do. Second, sometimes the stakes cut both ways at once: raising the bar means waiting twelve hours for a better forecast, and waiting eats the lead time the evacuation needs, so being more careful makes the outcome worse if I'm wrong — I need the procedure to say what to do when the standard the stakes demand is literally unreachable inside the window. Third, whatever I write travels: my we know gets read weeks later by an auditor or an adjuster who has no idea what was at stake that night or which failure modes we'd been worried about, so I think the protocol needs a step that records which error possibilities were excluded, or something equivalent. Please include a short section on what the procedure cannot do, and please work it through on three cases: (a) overnight, 60 percent chance of overtopping at Maple Street, four hundred homes, a lot of elderly residents, six hours of lead time; (b) one identical forecast covering two zones at once, the trailer park and a warehouse district where the only thing at risk is empty buildings and a parking lot — if the procedure tells me I know the water won't reach the warehouses but not that it won't reach the trailers, on the very same evidence, say so plainly, because that's the answer I'm going to hate and I'd rather see it worked out than avoided; and (c) a slow-onset one, three days out, where a better model run lands in twelve hours but evacuation needs thirty. Assume the person running this has no philosophy training and is tired; no citations needed, and please don't just tell me to be more careful.
reasoning: |-
  Okay, the user is a deputy director at a small emergency management agency. They need a practical decision protocol for flood scenarios that incorporates philosophical concepts like pragmatic encroachment and contextualism. Let me start by understanding their core problem.

  First, their main challenge is making high-stakes decisions quickly with limited information. The key philosophical ideas they mentioned are about how the standards for claiming knowledge change based on stakes and context. They need a procedure that turns a forecast into one of three actions: assert knowledge, act without claiming knowledge, or hand off the decision.

  They have three specific issues. Whose stakes matter? The trailer park residents face life-threatening risks, but the decision-maker faces reputational risks. Stakes can conflict when waiting for better data reduces evacuation time. Also, their written rationale is later reviewed by outsiders who weren't present, so they need to document excluded risks.

  Looking at their scenarios: Case A involves a 60% chance of overtopping overnight with vulnerable residents and only six hours to act. Case B has identical forecasts for two zones—trailer homes vs. empty warehouses—requiring different responses. Case C is a slow-onset with a long lead time but a better model arriving too late.

  I need to build a protocol that addresses these. Start with defining the "epistemic threshold"—the level of certainty required—based on what's at stake. Use severity of harm and population vulnerability. Then assess if current data meets that threshold within the time limit. If not, decide whether to act anyway or escalate. Finally, document excluded risks for auditors.

  For whose stakes: prioritize the affected population, not the decision-maker's reputation. In conflicting stakes like Case C, the procedure must recognize when the required certainty is unattainable in time, forcing a values-based decision. For Case B, different stakes for trailers vs. warehouses mean different thresholds—this might feel unfair but is necessary.

  The protocol must be simple: a flowchart or checklist. Steps should include calculating stakes, checking forecast adequacy, time constraints, and documentation. Highlight limitations, like not resolving value conflicts or predicting outcomes.

  Testing on their cases: Case A has high stakes due to vulnerable residents, needing 90% certainty. With only 60% forecast, they can't claim knowledge but must act anyway. Case B shows lower stakes for warehouses allow knowledge assertion there but not for trailers. Case C's time conflict means handing off to the county judge.

  Need to emphasize clear documentation of excluded risks to address later reviews. The protocol shouldn't eliminate tough calls but makes the reasoning transparent. Stress that acting without claiming knowledge is valid when evidence is insufficient but action is necessary.
answer: |-
  Here's a practical decision procedure ("The Threshold Protocol") based on your needs, incorporating pragmatic encroachment (stakes raise the bar for "knowing") and contextualism (salient risks define what must be ruled out). It's designed for speed, clarity, and auditability.

  **The Threshold Protocol: 5 Steps in < 10 Minutes**

  **Core Idea:** "Knowing" (asserting certainty) requires ruling out risks that *matter right now*. The higher the stakes, the more risks you must rule out. If you *can't* rule out enough risks in time, you act without claiming knowledge (precautionary branch) or escalate the values conflict.

  **Inputs:** Forecast (% chance, key metrics), Map (zones, assets, populations), Clock (lead time available).
  **Outputs:** `ASSERT KNOWLEDGE`, `ACT WITHOUT KNOWLEDGE`, `ESCALATE TO VALUES`.

  **The Steps:**

  1.  **Define the Harm & Stakes (For WHOM?):**
      *   *Look at the MAP.* Identify the specific asset/zone threatened (e.g., Maple St. Gauge area, Trailer Park, Warehouse).
      *   *Ask:* **"If the water DOES overtop/breach/flood *here*, what is the WORST credible outcome for PEOPLE in the next 24 hours?"** (Focus on life safety: Death, Serious Injury, Trapped/Unrescued).
      *   *Assign Stakes Level:*
          *   **HIGH STAKES:** Risk of death/serious injury to >10 people OR any vulnerable population (elderly, disabled, children dense area). *Examples:* Trailer park with elderly, school, hospital zone.
          *   **MEDIUM STAKES:** Risk of significant property damage (>$1M est.) OR minor injury/displacement to many (>50 people), but low risk of death/serious injury. *Example:* Industrial park with hazardous materials requiring containment *but* no overnight workers.
          *   **LOW STAKES:** Risk of property damage only, to unoccupied structures or easily replaceable assets. Minimal/no risk to people. *Example:* Empty parking lot, fallow field, warehouse district confirmed empty overnight.
      *   *Sufficient Answer:* Stakes level assigned to the specific zone/asset. **Terminate in NO?** Never. You *must* assign stakes.
      *   *Human Needed?* Only if harm characterization is ambiguous (e.g., is "chemical exposure risk" HIGH or MEDIUM?).

  2.  **Set the Knowledge Threshold (What BAR?):**
      *   *Based on Stakes Level from Step 1:*
          *   **HIGH STAKES:** Threshold = **≥ 90% Confidence** (Bar is VERY HIGH). You must be *almost certain* no harm will occur to assert knowledge.
          *   **MEDIUM STAKES:** Threshold = **≥ 75% Confidence** (Bar is MODERATE).
          *   **LOW STAKES:** Threshold = **≥ 51% Confidence** (Bar is LOW). "More likely than not" suffices.
      *   *Why these numbers?* Pragmatic Encroachment: Higher stakes demand higher certainty. 90% reflects the extreme aversion to catastrophic error when lives are on the line. These are operational anchors, not philosophical absolutes.
      *   *Sufficient Answer:* Threshold % set for the zone. **Terminate in NO?** Never.
      *   *Human Needed?* Only if stakes level was ambiguous.

  3.  **Assess Forecast Against Threshold (Can we KNOW?):**
      *   *Look at the FORECAST & your TOOLS (tabs, call).*
      *   *Ask:* **"Does the current, best-available information give us AT LEAST [Threshold % from Step 2] confidence that the specific harm (Step 1) WON'T happen here?"**
      *   *Contextualism Check:* **"Which specific failure modes are we worried about *right now*?"** (e.g., Pump failure? Levee seepage at X? Dam release surge? Model bias?). Have your sources/tools *explicitly ruled out* these salient risks?
          *   If YES to both (confidence % >= threshold AND salient risks ruled out) -> `ASSERT KNOWLEDGE` for this zone. *Document excluded risks.*
          *   If NO (confidence < threshold OR key risk not ruled out) -> Proceed to Step 4.
      *   *Sufficient Answer:* Yes/No based on forecast confidence and ruling out live concerns. **Terminate in NO?** If "No" (can't assert knowledge), go to Step 4. If "Yes", output `ASSERT KNOWLEDGE` for that zone.
      *   *Human Needed?* Judgment call on whether forecast confidence meets the % threshold and if specific risks are adequately ruled out. Use best professional judgment.

  4.  **Check Time Feasibility (Can we WAIT?):**
      *   *Look at the CLOCK (lead time) & FORECAST UPDATE ETA.*
      *   *Ask:* **"Is there enough time to gather significantly better information (e.g., next model run, sensor confirmation) BEFORE the action deadline, WITHOUT compromising the effectiveness of the precautionary action (usually evacuation)?"**
          *   **YES (Time to Wait):** -> `ESCALATE TO VALUES`. Explain: "Better data in [X] hours. Waiting possible without compromising action. Decision is whether to act now based on current uncertainty or wait."
          *   **NO (No Time / Waiting Reduces Safety):** -> `ACT WITHOUT KNOWLEDGE` (Precautionary Branch). *This is critical for conflicting stakes.*
      *   *Sufficient Answer:* Clear timeline comparison. **Terminate in NO?** If "No" (can't wait safely), output `ACT WITHOUT KNOWLEDGE`. If "Yes", output `ESCALATE TO VALUES`.
      *   *Human Needed?* Judgment on "significantly better" info and impact of delay on action effectiveness.

  5.  **Document the Excluded Risks (For the AUDITOR):**
      *   *Required for ANY `ASSERT KNOWLEDGE` OR `ACT WITHOUT KNOWLEDGE` output.*
      *   *Write plainly:* **"Based on [Source: e.g., NWS forecast call, dam operator confirmation, real-time gauge Y] at [Time], we excluded the following specific failure modes as not credible/imminent: [List: e.g., Pump Station A failure, overtopping above 30.5ft MSL at Maple Gauge, surge release from Dam X]."**
      *   *For `ACT WITHOUT KNOWLEDGE`, add:* **"Acted due to insufficient confidence ([Actual Confidence %] < [Required Threshold %]) within available lead time, given High Stakes involving [Brief Harm Description]."**

  **What the Protocol CANNOT Do:**
  1.  **Eliminate Uncertainty:** It manages uncertainty, not magic it away.
  2.  **Set Absolute Moral Values:** It identifies *when* a values choice is needed (`ESCALATE TO VALUES`), but doesn't make that choice for you.
  3.  **Predict the Future Better:** It relies entirely on the quality/timeliness of inputs (forecast, maps, calls).
  4.  **Fix Bad Data:** Garbage In, Garbage Out.
  5.  **Remove Accountability:** It makes reasoning transparent for auditors, but you're still responsible for using it soundly.
  6.  **Handle Genuine 50/50 Ties:** In practice, forecasts rarely hit exactly 50%. Use best judgment if they do.

  **Running the Cases:**

  *   **Case A (Overnight, 60% chance, 400 homes, elderly, 6h lead):**
      1.  **Stakes:** Trailer Park -> Risk of death/injury to vulnerable elderly -> **HIGH STAKES.**
      2.  **Threshold:** For HIGH STAKES -> **≥ 90% Confidence** needed to know "won't overtop".
      3.  **Assess Forecast:** 60% chance of overtopping = 40% confidence it *won't*. 40% < 90%. **NO, cannot assert knowledge.** (Salient risks like pump failure likely *not* ruled out, reinforcing NO).
      4.  **Time Feasibility:** Evac needs ~6h? Better forecast ETA? Likely >6h or unknown. **NO TIME TO WAIT SAFELY.**
      5.  **Output:** `ACT WITHOUT KNOWLEDGE` (Recommend evacuation). **Document:** "Insufficient confidence (est. 40% < 90% threshold) that overtopping would not occur, given High Stakes involving potential loss of life for vulnerable elderly residents. Excluded risks: [List any *specifically* ruled out, e.g., 'Dam surge confirmed not expected by Power Co.']"
      *   *Rationale:* Stakes demand near certainty (90%). Forecast provides far less (40%). Can't wait for better info without risking lives during evac. Must act.

  *   **Case B (Identical Forecast - Trailer Park vs. Warehouse):**
      *   *Run Protocol SEPARATELY for each zone.*
      *   **Trailer Park Zone:**
          1.  Stakes: **HIGH** (People present/vulnerable).
          2.  Threshold: **≥90%**.
          3.  Forecast: 40% confidence won't flood? **NO** (40% < 90%).
          4.  Time Feasibility: (Assume same as Case A) **NO TIME**.
          5.  Output: `ACT WITHOUT KNOWLEDGE` (Recommend evac for trailers).
      *   **Warehouse District Zone:**
          1.  Stakes: **LOW** (Empty buildings, parking lot - property only).
          2.  Threshold: **≥51%**.
          3.  Forecast: 40% confidence it *will* flood = **60% confidence it WON'T**. 60% > 51%. **YES.** (Assuming salient risks like structural failure ruled out).
          4.  Output: `ASSERT KNOWLEDGE` ("We know water won't reach warehouses").
      *   **Document:** Clearly state the different stakes/thresholds/confidence assessments for each zone. "Asserted knowledge for Warehouse District (Low Stakes, 60% > 51% threshold). Acted without knowledge for Trailer Park (High Stakes, 40% < 90% threshold). Excluded risks: [List]."
      *   *Rationale:* Identical physical threat, *radically* different human consequences. Knowledge depends on what's at stake *for the affected group*. This feels unfair but is operationally correct. You protect people when certainty is impossible, but don't waste resources where certainty *is* sufficient for the lower stakes.

  *   **Case C (Slow-onset, 3 days out, better model in 12h, evac needs 30h):**
      1.  **Stakes:** (Assume Trailer Park again) -> **HIGH**.
      2.  **Threshold:** **≥90%**.
      3.  **Assess Forecast:** (Assume current confidence is low, say 65% won't flood). 65% < 90%. **NO**.
      4.  **Time Feasibility:** **CRITICAL STEP.** Action (evac) needs *30 hours* to complete. Better model in *12 hours*. 12h (wait) + 30h (evac) = 42h total needed. Threat is 3 days (72h) out. 72h - 42h = 30h buffer. **YES, TIME TO WAIT SAFELY** (Waiting 12h for better data still leaves 30h for evac before impact).
      5.  **Output:** `ESCALATE TO VALUES`. **Document:** "Insufficient current confidence (65% < 90%) for High Stakes. Significantly better forecast expected in 12h. Full evacuation requires 30h, deadline is 72h. Waiting possible without compromising safety. Recommendation deferred: Evacuate now based on uncertainty, or wait 12h for better forecast?"
      *   *Rationale:* The time conflict resolves *in favor of waiting* because the lead time is long. The high stakes *don't* force immediate action here because waiting doesn't yet eat into the safety margin. The choice becomes: *Do we impose the cost/disruption of a major evacuation NOW based on current (low) certainty, or wait for better information since we safely can?* This is a values/policy call about risk tolerance and cost/benefit, not a knowledge claim. Hand it to the Judge.

  **Key Takeaways for Duty Officers:**

  *   **Whose Stakes?** The people facing the flood. Ignore your own blame risk in the *knowledge assessment*. (It influences *how* you implement the protocol, but not the stakes level).
  *   **Conflicting Stakes (Time):** Step 4 (Time Feasibility) resolves this. If waiting makes the precautionary action *worse*, you `ACT WITHOUT KNOWLEDGE`. If waiting is safe, you `ESCALATE`.
  *   **Traveling Rationale:** Step 5 (Document Excluded Risks) is non-negotiable. It shows *what you ruled out* given the salient concerns and stakes of the moment. This protects you with auditors/reporters.
  *   **Outputs are Actions:** `ASSERT KNOWLEDGE` = Proceed confidently (e.g., no evac needed here). `ACT WITHOUT KNOWLEDGE` = Take precautionary action (e.g., evac) *because certainty isn't possible*. `ESCALATE` = Flag the decision needs a policy/value choice *above your pay grade*.
  *   **It's a Tool, Not a Crystal Ball:** It forces clear, auditable reasoning under pressure. It won't make the hard calls easy, but it makes them defensible.
