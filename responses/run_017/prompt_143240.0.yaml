  - Then have teams report (5 minutes).
  - Guide them to notice that in Round 2, the demon had to erase two pre-filled pages and that cost 4 tokens. And 8 - 4 = 4, so that explains the difference.

  50-80 min: Debrief. Now reveal the connection to Maxwell's demon.

  Debrief:

  First, reveal that this is a model of Maxwell's demon. Then:

  (a) Temperature as a spread of speeds: In the original thought experiment, the demon sorted fast and slow molecules. The cards in this game are like molecules, and the color might represent speed (e.g., red=fast, blue=slow). The act of sorting creates a temperature difference. However, in our game, we abstracted the continuous distribution of speeds into two discrete groups.

  (b) The difference between acquiring information and disposing of it: In the game, the demon acquires information about the card's color by looking and recording. This acquisition is free (no token cost). But to reuse the notepad, the demon must dispose of the information by erasing, which costs tokens. In physics, erasing information increases entropy and requires work.

  (c) Why the ledger balances in the end: The tokens represent energy. In Round 1, the notepad started blank, so the only cost was for erasing the information the demon itself recorded. In Round 2, the notepad started with pre-existing information (meaningless) that the demon had to erase, and that cost extra energy. The energy for erasing the pre-existing information was provided by the demon during the game, so the overall energy balance accounts for it.

  Predictable problems:

  - Cheating: Students might try to not erase or not record to save tokens. The observers should watch. The facilitator should enforce the rules.
  - Disengaged students: Assign specific observation tasks. Have them record every transaction or every notepad event.
  - Accounting disputes: Have the accountants and observers double-check. Use a whiteboard to publicly record.

  What the game leaves out:

  - In the real world, the erasure of information is a physical process that necessarily increases entropy in the environment. The game tokens represent energy, but in reality, the work done to erase information is dissipated as heat, increasing the entropy of the universe. The game doesn't model the environment's entropy increase.
  - The game uses tokens to represent energy, but in the demon thought experiment, the energy for erasure comes from the thermal energy of the system, which would reduce the temperature difference created by the sorting. The game doesn't show this feedback because the token economy is external.

  The facilitator will have to state: "In the real world, the work for erasure is drawn from the thermal energy of the gas itself, which would reduce the temperature difference that the demon creates. Therefore, in the long run, the demon cannot create a perpetual temperature difference without an energy source for its memory erasure."

  This design meets the constraints and fits in the time.
