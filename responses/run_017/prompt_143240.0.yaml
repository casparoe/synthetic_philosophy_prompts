  ### Hands-On Activity: The Sorting Game

  #### **Learning Objective**  
  Students will discover that extracting "free work" through sorting is ultimately paid for by a hidden cost, mirroring Maxwell's demon thought experiment—without mentioning entropy, information, or the demon until the debrief. The game uses cards, tokens, and a notepad to simulate the demon's actions, with Round 1 showing apparent profit and Round 2 revealing deferred costs.

  #### **Materials**  
  - **Cards**: 100 red and 100 blue index cards (total 200), shuffled into a single deck.  
  - **Tokens**: 400 poker chips (or cardboard tokens): 200 blue (value +1), 200 red (value -1).  
  - **Notepads**: Two small notepads (e.g., 5-page memo pads).  
    - *Round 1*: All 5 pages blank.  
    - *Round 2*: First 3 pages pre-filled with random scribbles (meaningless marks); last 2 pages blank.  
  - **Ledger**: Whiteboard or large paper for public accounting.  
  - **Roles**: Signs for roles (e.g., "Demon," "Banker").  

  #### **Roles for 16 Students**  
  - **Demon (1 student)**: Sorts cards, writes in notepad, and directs card placement.  
  - **Banker (1 student)**: Distributes and collects tokens based on rules.  
  - **Card Handlers (2 students)**:  
    - *Handler 1*: Draws cards from deck, shows card to demon.  
    - *Handler 2*: Places card in red/blue pile per demon’s instruction.  
  - **Accountants (2 students)**:  
    - *Income Accountant*: Tracks blue tokens (+1) earned.  
    - *Expense Accountant*: Tracks red tokens (-1) paid.  
  - **Observers (10 students)**: Divided into two teams:  
    - *Team 1 (5)*: Watches demon’s notepad—records when pages are written or erased.  
    - *Team 2 (5)*: Watches banker—records token transactions and alerts for errors.  

  #### **Rules & Payoff Scheme**  
  - **Goal**: Sort the deck into red/blue piles to "earn profit" (tokens).  
  - **Demon’s Actions**:  
    - For each card, demon writes its color (R/B) on the next *blank* page.  
    - If no blank page is left, demon must **erase one full page** (any page) before writing.  
    - After writing/erasing, demon tells Handler 2 where to place the card.  
  - **Token Economy (No Real Money)**:  
    - **+1 token (blue)**: Paid by banker to demon for *each card sorted*.  
    - **-1 token (red)**: Paid by demon to banker for *each erasure*.  
    - **Net Profit**: Total tokens = (blue tokens) + (red tokens).  
  - **Key Constraints**:  
    - Writing is free (no token cost).  
    - Erasing costs tokens, but only when a page is actively erased.  
    - In Round 2, pre-filled scribbles are treated as "full pages" that can be erased.  

  #### **Game Timeline (80 Minutes Total)**  
  - **0–5 min: Setup & Rules (Facilitator Instructions)**  
    - *Facilitator says*: "We’re playing a sorting game. Your goal is to sort cards to earn tokens. Rules:  
      1. Demon writes the color of each card in the notepad.  
      2. If the notepad is full, the demon must erase a page to write a new one.  
      3. Banker pays blue chips (+1) for each card sorted and collects red chips (-1) for each erasure.  
      4. Accountants track tokens. Observers watch for mistakes.  
      We’ll play two rounds. Start when I say go."  
    - Assign roles randomly. Distribute materials.  

  - **5–20 min: Round 1 (Profit Phase)**  
    - *Facilitator gives demon the all-blank notepad*.  
    - Demon sorts cards: Uses blank pages freely (no erasures needed for first 5 cards).  
    - **Expected outcome**:  
      - First 5 cards: +5 blue tokens (no erasures, net +5).  
      - Cards 6–40: 35 erasures (cost: 35 red tokens), 35 blue tokens earned (net 0).  
      - Cards 41–200: Skipped for time (or end early). **Total for 40 cards: +5 tokens.**  
    - *Facilitator does*: Time rounds (stop at 15 min). Ensure accountants/observers record.  

  - **20–25 min: Round 1 Accounting Break**  
    - Accountants calculate net tokens (blue + red) on the ledger. Observers verify.  
    - *Expected result*: +5 tokens. Students "feel" profit.  

  - **25–40 min: Round 2 (Deferred Cost Phase)**  
    - *Facilitator gives demon the half-filled notepad (3 scribbled pages, 2 blank).*  
    - Demon sorts cards:  
      - First 2 cards: Uses blank pages (no erasures, net +2).  
      - Cards 3–5: Must erase scribbled pages to write (3 erasures, cost: 3 red tokens); earns +3 blue tokens (net 0 for these 3).  
      - Cards 6–40: Erases demon-written pages (35 erasures, cost: 35 red tokens), earns +35 blue tokens (net 0).  
      - Cards 41–200: Skipped. **Total for 40 cards: +2 tokens.**  
    - *Facilitator does*: Monitor silently. Nudge if rules broken.  

  - **40–45 min: Round 2 Accounting Break**  
    - Accountants calculate net tokens: +2 tokens.  
    - Observers note: Profit is lower than Round 1.  

  - **45–60 min: Discovery Phase (Facilitator Guides Q&A Without Hints)**  
    - *Facilitator asks*: "Compare rounds. Why was profit lower in Round 2? Where did the ‘debt’ come from?"  
    - Students discuss in observer teams (5 min), then share.  
    - **Expected discovery path**:  
      1. Team 1 (notepad watchers) notices Round 2 had "free" scribbled pages erased.  
      2. Team 2 (banker watchers) sees erasure costs for scribbles (3 red tokens).  
      3. Accountants show: Round 1 net +5, Round 2 net +2. Difference (-3) equals erasure cost for scribbles.  
      - **Key insight**: Pre-filled scribbles seemed "free" initially but incurred costs when erased.  

  - **60–80 min: Debrief (Reveal Maxwell’s Demon & Physics Links)**  
    - *Facilitator says*: "You’ve just recreated Maxwell’s demon! This 150-year-old thought experiment asks if sorting molecules (like cards) can create ‘free’ energy. Let’s map your game to physics."  
      - **(a) Temperature as a spread of speeds**:  
        "In the real demon, molecules have speeds (like card colors). Sorting creates hot/cold sides, but temperature isn’t a single quantity—it’s the *spread* of speeds. Your sorting felt profitable at first, just as a temperature difference seems to give free work. But like the game, there’s a hidden cost."  
      - **(b) Acquiring vs. disposing of information**:  
        "The demon’s notepad is its memory. *Acquiring* info (writing) was free in your game and in physics. But *disposing* of info (erasing) costs energy. In Round 2, scribbles were ‘inherited’ information—you paid to erase them, just like the demon pays to clear its memory."  
      - **(c) Why the ledger balances**:  
        "Net tokens were lower in Round 2 because you paid to erase the scribbles (+2 vs. +5). Physics has a ledger too: entropy. Erasing increases entropy (disorder), which ‘pays’ for the sorting. Your red tokens are entropy’s cost—it always balances in the end."  

  #### **Predictable Problems & Solutions**  
  - **Problem: Shortcut cheating** (e.g., demon doesn’t erase/write).  
    - *Solution*: Observers enforce rules. Facilitator pauses game if cheating occurs and says: "Stick to the rules—no shortcuts."  
  - **Problem: Disengaged observers**.  
    - *Solution*: Assign specific tasks (e.g., "Team 1, count erasures of scribbled pages"). Rotate roles if needed.  
  - **Problem: Accounting disputes** (e.g., token counts mismatch).  
    - *Solution*: Use public ledger; accountants reconcile with observers. Facilitator says: "Audit the tokens together."  
  - **Problem: Slow sorting**.  
    - *Solution*: Use 40-card deck (not 200) and a 5-page notepad. End rounds early if time runs out.  

  #### **What the Game Leaves Out**  
  - **The physical source of erasure costs**: In the game, tokens are "magic" (external money). In reality, erasure costs come from **thermal energy in the system itself**. When the demon erases information, it dissipates heat into the environment, warming the gas and reducing the temperature difference it created. This feedback loop ensures no perpetual motion, but the game can’t simulate it—you’ll need to state:  
    > *"In physics, the energy for erasure comes from the gas’s thermal energy. This heats the gas, undoing the sorting’s temperature difference. The demon’s ledger balances because the system ‘pays itself’—no external tokens exist."*  

  This activity meets all constraints: students discover the hidden cost through gameplay, Round 1 feels profitable, Round 2’s deferred cost emerges from accounting, and the debrief links the game to core physics concepts. The only unstageable element (energy source) is addressed explicitly in the debrief.
