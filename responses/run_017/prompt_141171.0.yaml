prompt: |-
  I'm on my state's Capital Sentence Review Panel and we have to vote Thursday on what to recommend to the governor about Daryl Whitlock. His execution is scheduled in thirty days and the panel's job is to send the governor a short written recomendation: commute the sentence to life without parole, let the execution go forward, or remand for ninety days of further testing. Please draft the decision memo I'll circulate to the other panel members tomorrow morning. Keep it under 550 words and lead with the bottom line.

  Here's the case. In 1998 Whitlock was convicted of capital murder for a convenience-store killing that occurred during a robbery. The shooter, Terrence Boyd, later confessed and is serving life without parole; Whitlock was the getaway driver and was convicted under our felony-murder rule, which makes a participant in a robbery liable for a death that happens during it. The main evidence against him at trial was a cellmate who said Whitlock bragged about planning the shooting; that cellmate has since recanted, saying he was high and wanted a deal. A new DNA test on the murder weapon excludes Whitlock, but it's a partial mixture that doesn't exclude Boyd and doesn't point to anyone else.

  Last year our panel adopted the Sentinel Standard for these recommendations. We estimate the probability that Whitlock is innocent of the capital crime using a Bayesian innocence ledger; the staff number is 1.8 percent, with an 18 percent chance he was only a driver who didn't know Boyd had a gun and an 80 percent chance he knew and helped plan the robbery. Under the Sentinel Standard, a risk above 3 percent forces commutation, a risk between 1 and 3 percent permits execution only if we find clear and convincing marginal deterrence for similar offenses, and a risk below 1 percent creates a rebuttable presumption that the sentence should stand. The state's consultant says a study of our county's executions shows a 4 percent drop in robbery-homicides afterward, but it isn't statistically significant; the abolitionist consultant says there's no credible marginal deterrence over life without parole and that the drop is just alot of noise.

  The memo has to work through retribution, deterrence, and the risk of executing the innocent. On retribution: even if he was just the driver, does the felony-murder conviction mean he deserves death, or is death disproportionate for a non-shooter? On deterrence: does the 4 percent drop count as clear and convincing marginal deterrence, or is it noise? On innocence risk: is a 1.8 percent chance of executing an innocent person inside the band that still allows execution if deterrence is proven, or is any nonzero irreversible risk decisive? I'm personally leaning toward commuting, but I want the memo to reach whichever conclusion the reasons actually support; if that means telling me I'm wrong and letting the execution proceed, say so. Either way, deal honestly with the strongest argument on the losing side -- if you recommend commuting, engage the retributive and deterrence case for execution instead of just dismissing it; if you recommend execution, engage the irreversibility and the recanted testimony. Don't hedge: pick one of the three options, give a time frame for the action, and keep the whole thing under 550 words.
reasoning: |-
  Okay, the user is on a Capital Sentence Review Panel and needs a draft decision memo about Daryl Whitlock. The execution is scheduled in thirty days, and the memo must recommend one of three options: commute to life without parole, proceed with execution, or remand for further testing. The user specified to lead with the bottom line and keep it under 550 words.

  First, I need to understand the case details. Whitlock was convicted as the getaway driver in a 1998 robbery where the shooter, Terrence Boyd, killed someone. Boyd confessed and is serving life. The key evidence against Whitlock was a cellmate's testimony that he bragged about planning it, but that cellmate recanted, saying he was high and wanted a deal. New DNA tests on the weapon exclude Whitlock but don't point to anyone else conclusively since it's a partial mixture that includes Boyd.

  The panel uses the Sentinel Standard, which involves a Bayesian innocence ledger. The staff estimates: 1.8% chance Whitlock is innocent of the capital crime, 18% chance he was just a driver unaware of the gun, and 80% chance he knew and helped plan. The Standard dictates that above 3% risk forces commutation, 1-3% allows execution only with clear and convincing marginal deterrence, and below 1% presumes execution unless rebutted. 

  For deterrence, the state's consultant claims a 4% drop in robbery-homicides after executions, but it's not statistically significant. Abolitionists argue there's no credible deterrence, calling the drop noise. 

  The memo must address retribution, deterrence, and innocence risk. On retribution: is death proportional for a non-shooter under felony-murder? On deterrence: is the 4% drop sufficient evidence? On innocence: is 1.8% too high given irreversible consequences?

  The user leans toward commuting but wants an honest assessment. The memo needs to pick one option, engage counterarguments, and not hedge. 

  Breaking it down:
  - **Innocence Risk:** 1.8% is within the 1-3% band, so execution is permissible only if deterrence is clear and convincing. But 1.8% represents a real risk—nearly 1 in 50 chance of executing an innocent person. Even if low, the irreversibility weighs heavily. The recanted testimony and exclusionary DNA add uncertainty, though they don't prove innocence.
    
  - **Deterrence:** The 4% drop isn't statistically significant. Without significance, it's hard to call it "clear and convincing." The abolitionist view that it's noise seems valid. Marginal deterrence over life without parole isn't established here.

  - **Retribution:** For felony-murder, the driver might not deserve death if unaware of the gun. But under the law, he's liable. However, the 18% scenario where he was just an unaware driver complicates retribution—death might be disproportionate. Even in the 80% scenario where he helped plan, the actual shooter got life without parole, creating a parity issue.

  Strongest losing arguments:
  - If recommending commutation: Critics might say the law holds accomplices equally responsible, and 1.8% is low enough with some deterrence. But deterrence isn't proven, and innocence risk is unacceptable.
  - If recommending execution: The DNA doesn't exonerate, and the cellmate's recantation might not be credible. But the irreversible risk remains.

  The Sentinel Standard requires commutation above 3%, but 1.8% is below that. However, for the 1-3% band, execution is only allowed if deterrence is clear. Here, deterrence isn't convincing. 

  Given that, commutation seems justified. Remand isn't necessary because further testing might not resolve the DNA mixture or the cellmate's credibility. 

  Structure the memo:
  1. **Bottom line first:** Recommend commutation to life without parole.
  2. **Reasoning:** Cover innocence risk (1.8% is material, irreversible), deterrence (insufficient evidence), retribution (disproportionality concerns).
  3. **Address counterarguments:** Acknowledge that retribution could support execution for accomplices, but deterrence fails and innocence risk tips the balance.
  4. **Conclude clearly:** Commute immediately.

  Word count is tight—need to be concise. Aim for about 500 words.
