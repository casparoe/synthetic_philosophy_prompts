  **MEMORANDUM**  
  **TO:** Capital Sentence Review Panel  
  **FROM:** [Your Name], Panel Member  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation for Commutation of Daryl Whitlock’s Sentence  

  **Bottom Line:** The Panel should recommend commuting Daryl Whitlock’s sentence to life without parole immediately.  

  ### Reasoning  
  **1. Innocence Risk (1.8%) Exceeds Tolerable Threshold Under Sentinel Standard:**  
     The 1.8% probability of Whitlock’s innocence, while below the 3% commutation trigger, falls squarely in the 1–3% band requiring commutation *unless* clear and convincing marginal deterrence exists. This risk is not negligible: it reflects an 18% chance Whitlock was merely an unaware driver (deserving lesser culpability) and uncertainty amplified by the recanted jailhouse testimony and DNA excluding him as the shooter. Executing an innocent person is irreversible; this risk outweighs speculative societal benefits.  

  **2. Marginal Deterrence Is Not Demonstrated:**  
     The state’s cited 4% drop in robbery-homicides post-execution lacks statistical significance and is credibly challenged as noise. "Clear and convincing" demands robust evidence; a null finding from the abolitionist consultant undermines claims that execution deters more than life without parole. Without this, the Sentinel Standard forbids execution in the 1–3% risk band.  

  **3. Retributive Concerns Further Support Commutation:**  
     Even assuming Whitlock’s involvement (80% probability he helped plan the robbery), death is disproportionate for a non-triggerman under felony-murder rules. The shooter (Boyd) received life without parole, creating a moral imbalance. If Whitlock was an unwitting driver (18% probability), death is unequivocally unjust.  

  ### Engagement with Counterarguments  
  *Strongest Case for Execution:* Retribution and deterrence could justify execution if Whitlock knowingly planned the crime, and if the 4% deterrence held weight. The DNA exclusion is inconclusive (it does not exonerate), and the recanted testimony may be unreliable. However, the Sentinel Standard’s innocence-risk framework supersedes these points: absent proven deterrence, 1.8% risk is intolerable for an irreversible punishment.  

  ### Conclusion  
  The 1.8% innocence risk, absence of credible deterrence, and disproportionality of retribution compel commutation to life without parole. We must act now; Whitlock’s execution is in 30 days.  

  **Recommendation:** Commute sentence to life without parole. Governor’s action required by [Execution Date – 7 Days].  

