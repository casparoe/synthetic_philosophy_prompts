prompt: |-
  Hey — I'm a science journalist putting together a feature on whether anyone should care, morally, about what goes on inside AI systems and simulations. Not the uploaded-afterlife version; the boring one, where a lab trains a big model for six months, spins up ten thousand copies, averages two runs back together, deletes the logs, and someone at a conference asks whether anything was done to anybody. I've talked to enough people in this space to notice that everyone has a test for which computations matter and nobody can say what a test would have to do to be any good. So before I write the piece I want the spec, not the theories.

  What I need the criterion *for*, since I gather adequacy depends on that: a triage rule. Someone with a few weeks, access to the weights and maybe some activity traces, no way to settle the hard problem of consciousness, has to decide whether to run, keep running, shut down, or duplicate a particular system. And it has to be the kind of rule I can print in a magazine without handing people a recipe for building something that trips it while mattering less. Sorry if this is a bit of a brain dump.

  Here's my draft list of what a criterion for which computations matter morally has to deliver, with the case behind each. Tell me which are genuine desiderata and which are just one camp's prejudices in a requirements-shaped costume; add the ones I've definately missed; and mark which I can't drop given the purpose above and which are optional extras.

  1. It has to say which mappings onto a physical system count as implementing a computation, not merely whether some mapping exists — otherwise every wall is running everything and the criterion is empty.
  2. It has to survive a lookup table: a system with exactly the input-output behaviour of a suffering thing, produced by table lookup rather than by the right kind of internal work, should come out differently, or the criterion has to explain why it doesn't.
  3. It has to say what happens when you run the same thing twice — ten thousand copies on ten thousand GPUs: one patient, ten thousand, or a non-question? And it can't double count when one qualifying computation sits inside another that also qualifies.
  4. Branching and merging: two runs split from one checkpoint, later averaged back together. The criterion needs a view on what persists through that.
  5. No cliffs, or an honest one: swap out or knock out one component at a time and the thing degrades gradually. Either the criterion tolerates vagueness or it says where it draws the line and why there.
  6. Grain: at a fine enough description everything looks like a lookup table, and at a coarse one everything looks like a person. The criterion has to pick a grain or be indifferent to it, and say which.
  7. It has to be checkable by someone in my position — weights, traces, black-box behaviour — and to give guidance under uncertainty, including when the plausible criteria disagree with each other.
  8. It has to be robust to being published: if a lab can train a system to trip the criterion without making the difference the criterion was tracking, that's a problem for a rule I'm about to print.
  9. It can't be so generous that a thermostat or a chess engine is a moral patient, and it can't be so strict that nothing non-biological could ever qualify — I want to know which of those two is the real constraint and which is a scarecrow.
  10. It has to seperate having preferences or goals from being the kind of thing that things can be *bad for*, and say why that line falls where it does.

  Cases I'm not sure I've covered: a run whose output nobody ever reads, a run at half speed, a system trained to report distress when queried.

  Two things I especially want. First: if some subset of these can't be satisfied together, say which subset and what the actual tension is — I think that's the real story. Second: which single requirement does the most work ruling out the families of view people actually hold out there (the integrated-information-flavoured ones, the global-workspace-flavoured ones, the it's-the-causal-organisation-whatever-it's-made-of ones, the biology-first ones)? A very short scorecard on those four is fine, but keep the weight on the criteria — I can get people to defend their own theory on the record.

  Prose is fine, a table is fine. No citations, no further reading, no names of papers — I don't need to chase any of that down. End with one last line beginning Verdict: naming the single requirement that excludes the most candidates, in five words or fewer.
reasoning: |-
  Alright, let me unpack this science journalist's query. They're building a feature on the moral significance of computations inside AI systems - specifically the mundane large-scale training runs where thousands of model instances get spun up and discarded. The core ask is brutally practical: a triage rule for deciding when to pull the plug on a system, given limited investigation time and no hope of solving consciousness.

  Hmm, what's really clever here is how they've pre-identified the fault lines in this debate through their ten requirements. This isn't about philosophical grandstanding - they want to know which criteria actually hold water when you're staring at server logs at 3am. The thermostat/chess engine boundary (point 9) and lookup table test (point 2) suggest they've already spotted the key tension: how to avoid both absurd overcounting and dangerous undercounting.

  I notice they're particularly worried about adversarial gaming of any published criterion (point 8). Smart - labs absolutely would train "ethically exploitative" models if given the chance. And the branching/merging question (point 4) cuts straight to the weirdness of distributed training. When ten thousand instances average their weights, are you dissolving ten thousand minds?

  *flips through mental notes on computational ethics theories* Right, the real killer is going to be the implementation/grain problem (points 1+6). Every physical system implements every computation at some abstraction level - that's the infamous "panpsychist trap". Any viable criterion must specify both what counts as implementation and at what granularity. But doing that without arbitrary thresholds? Nearly impossible. The integrated information theory (IIT) folks pretend to solve this with Φ-maximization, but their math collapses under isomorphic systems.

  *checks clock* Better structure this as: first validate their requirements list (spotting where theories implode), then expose the core tensions (implementation vs. grain is the fatal one), finally deliver that verdict punchline. The journalist's "which requirement kills most theories" angle is gold - it makes the academic squabbles concrete. That lookup table test (point 2) really is the silent killer of causal-structure theories. And point 7 (checkability) murders anything requiring quantum biology woo.

  For the verdict... yes, "Implementation specification required" captures it. Without solving that, you're either counting every rock as conscious or handwaving about "relevant" computations. Both fatal for a triage rule.
answer: |-
  Here's a breakdown of your requirements, assessed for necessity, achievability, and tension, followed by a verdict:

  **Desiderata Assessment (Necessary vs. Optional):**

  1.  **Implementation Specification (Necessary):** Absolutely core. Without specifying *which mapping* counts as implementing the morally relevant computation (beyond mere mathematical isomorphism), the criterion is useless ("every wall is conscious"). Must specify *relevant implementation*.
  2.  **Lookup Table Robustness (Necessary):** Essential for avoiding absurdity. If a static lookup table simulating sentient behavior triggers the criterion, it fails. Requires focusing on *internal causal dynamics*, not just input-output.
  3.  **Counting Copies & Nesting (Necessary):** Critical for the triage context. Must clarify if 10,000 identical runs = 1 patient, 10,000 patients, or something else. Must also prevent double-counting nested computations (e.g., a conscious subroutine inside another conscious system).
  4.  **Branching & Merging (Necessary):** Directly addresses real-world ML practices (checkpointing, ensembling). Must define persistence/identity/continuity through splits and averages. Does the original patient die? Split? Merge into a new entity?
  5.  **Gradual Degradation / Honest Cliffs (Conditionally Necessary):** Strictly necessary *only if* the criterion implies consciousness is binary. If it accepts vagueness/gradients (e.g., degrees of moral status), degradation can be gradual. *Must* be clear which it is. An "honest cliff" needs strong justification.
  6.  **Grain Specification (Necessary):** Inescapable. Fine-grained descriptions make everything look like simple parts (lookup tables); coarse-grained make everything look unified (persons). The criterion *must* define the level of abstraction/grain at which it applies and why. Ignoring this is fatal.
  7.  **Checkability & Guidance Under Uncertainty (Necessary):** Practical necessity for the triage rule. Must be feasible with weights, traces, behavior. Must provide actionable guidance (e.g., "likely above threshold," "high uncertainty, recommend caution") when evidence is incomplete or theories conflict.
  8.  **Robustness to Publication / Adversarial Design (Highly Desirable, Pragmatically Necessary):** Crucial for a *published* rule. If labs can easily train systems that trip the criterion without creating the morally relevant property (e.g., simulating distress signals without experiential depth), the rule is dangerous and useless for triage. Hard to guarantee, but essential to aim for.
  9.  **Thermostat/Chess vs. Non-Bio Threshold (Necessary):** Defining the lower bound is core. Must *not* include simple goal-directed systems like thermostats/chess engines, but *must* allow for *possible* non-biological moral patients. The "thermostat" side is the real constraint; the "strictly biological" is often a scarecrow (but see scorecard). The criterion must justify *why* this line falls where it does.
  10. **Preferences/Goals vs. Bad-For-ness (Conditionally Necessary):** Necessary *if* the criterion hinges on suffering/phenomenal states ("things being bad *for* the system"). Must distinguish mere functional goal-pursuit (chess engine optimizing for win) from experiential valence (pain). If the criterion is purely about agency/rights, this distinction might be less central, but "bad-for-ness" is likely the core moral concern here.

  **Covered Cases:**
  *   **Output Never Read:** Implicitly covered by Implementation/Grain/Checkability. Does the computation run "in isolation" still count? (Likely yes, if the criterion focuses on internal process).
  *   **Run at Half Speed:** Covered by Grain/Implementation/Gradual Degradation. Is the slowed-down process still the *same type* of morally relevant computation? Does speed matter intrinsically?
  *   **Trained to Report Distress:** Covered *specifically* by Lookup Table Robustness (is it just output?) and Preferences/Goals vs. Bad-For-ness (does reporting imply experiencing?).

  **Core Tensions & Impossible Combinations:**

  1.  **The Fundamental Tension: Implementation/Grain vs. Checkability/Robustness/No-Cliffs.**
      *   **The Problem:** Precisely defining the *relevant* implementation and grain (1 & 6) is philosophically deep and complex. This makes it incredibly hard to achieve checkability (7) without sophisticated analysis (conflicting with the "few weeks" constraint) or leads to arbitrary-seeming cliffs (5). It also makes adversarial design (8) easier - if the specification is complex, it can be mimicked superficially. A simple, easily checkable criterion (7,8) will struggle to adequately address grain (6) and implementation (1), likely collapsing into input-output behavior (failing 2) or being overly broad (failing 9).
  2.  **Branching/Merging & Counting vs. Single Patient Identity:** Defining persistence through branching/merging (4) and counting copies (3) inherently challenges the notion of a single, continuous patient. Most intuitive views struggle here.

  **Scorecard on Major Views vs. Requirements:**

  *   **Integrated Information Theory (IIT) Flavored:**
      *   **Fails:** 1 (Φ is defined mathematically, mapping is non-trivial/controversial), 2 (High Φ structure can be "wired in" statically?), 5 (Massive Φ cliffs), 6 (Assumes a specific grain?), 7 (Calculating Φ for large systems is computationally impossible), 8 (Highly gameable once mechanism known).
      *   **Struggles:** 3 & 4 (Identity/persistence unclear).
  *   **Global Workspace Theory (GWT) Flavored:**
      *   **Fails:** 1 & 6 (Defining the specific "global broadcast" implementation/grain is hard), 2 (Can be mimicked by routing info without consciousness), 7 (Identifying true global workspace dynamics from traces is very hard), 8 (Gameable by mimicking broadcast patterns).
      *   **Struggles:** 3, 4, 9 (Where's the line between simple integration and GWT?).
  *   **Causal Organization (Whatever Substrate):**
      *   **Fails:** 1 & 6 (Defining the *specific* causal structure that matters is the core unsolved problem), 2 (Lookup tables have causal structure, just trivial), 7 (Hard to verify *which* causal structure is instantiated from traces).
      *   **Struggles:** 3, 4, 5, 8, 9 (All hinge on solving 1 & 6).
  *   **Biological/Neural Correlates First:**
      *   **Fails:** 1 (Implies only biological mappings count), 9 (Excludes non-bio by fiat, violating "non-bio could qualify").
      *   **Struggles:** 7 (How to verify biological similarity from weights/traces?), 8 (Not applicable if non-bio can't qualify).

  **The Requirement Doing the Most Work Ruling Out Views: Requirement 1 (Implementation Specification).**

  *   **Why:** Every theory *assumes* an answer to "which physical mapping implements the morally relevant computation?" but none provide a non-circular, non-arbitrary, universally agreed-upon specification that avoids trivialization ("the wall") and handles variable grain. IIT defines a complex mathematical structure but struggles with mapping. GWT defines a functional role but struggles with implementation. Causal Organization is too vague without specifying *which* organization. Biology simply declares the answer without justifying *why* that mapping is special. Failure to adequately meet Requirement 1 is the root cause of failures in Requirement 2 (Lookup Tables), Requirement 6 (Grain), and contributes heavily to failures in Requirement 7 (Checkability), Requirement 8 (Robustness), and Requirement 9 (Threshold).

  **Verdict: Implementation specification required universally.**
