  ### Moral Trade Game: "Hidden Values Exchange"
  Designed for 18 players in 90 minutes using only index cards and pens. Players will discover why trading beats compromise, and why some trades are "fake" due to hidden counterfactuals.

  ---

  ### **Game Setup**
  **Roles & Secret Assignments (18 players):**
  - **Animal Advocates (9 players):**  
    *Card Text:* "You care ONLY about animal welfare (A). Your satisfaction = 10 x £ allocated to A. You get 0 satisfaction from anything else. Secret: One of you has (★) – check your card corner."  
    *Reality:* 7 have no star (true advocates). 2 have ★ ("Secret Saints" – would donate personally if group underfunds A).

  - **Heritage Guardians (2 players):**  
    *Card Text:* "You care ONLY about the heritage project (H). Your satisfaction = 15 x £ allocated to H. You get 0 from anything else."

  - **Effectiveness Experts (7 players):**  
    *Card Text:* "You care about cost-effectiveness. Your satisfaction depends on FACTS:  
    - E (effective charities): 10/£  
    - A (animal welfare): 5/£  
    - H (heritage): ???/£ (you have private data – check below)"  
    *Reality:*  
    - 3 experts see: "H = 0/£ (data: heritage funds preserve elitism)".  
    - 4 experts see: "H = 5/£ (data: heritage boosts tourism for the poor)".

  **Starting Pot:** £4,000 (represented as 40 x £100 tokens on a shared tally sheet).

  ---

  ### **Rules & Timeline (90 mins)**
  1. **Round 1: Compromise (30 mins)**  
     - Goal: Agree on how to split £4,000 across A/H/E.  
     - Rules: No trades. Discuss/vote. If deadlocked after 25 mins, default to equal split (£1,333 each).  
     - *Predictable chaos:* Animal/historic blocs clash, EAs split on facts. Most leave dissatisfied. Record final allocation.

  2. **Round 2: Trade (40 mins)**  
     - Goal: Rearrange allocation via pairwise trades.  
     - Rules:  
       - Pairs make binding deals on index cards: *"I support £X more to [Cause Y] if you support £X more to [Cause Z]."*  
       - Deals must specify:  
         - **Source cause** (where £ comes from)  
         - **Target cause** (where £ goes to)  
       - Minimum trade: £200 (£2 tokens). Max 3 trades/person.  
     - Process:  
       1. 10 mins: Negotiate bilateral deals.  
       2. 20 mins: Propose trades to whole group; majority vote implements them.  
       3. 10 mins: Finalize allocation.  

  3. **Reveal & Debrief (20 mins)**  
     - Reveal ★ Secret Saints and fact disagreements.  
     - Calculate satisfaction changes from Round 1 to 2.

  ---

  ### **Predictable Breakdowns & Solutions**
  1. **Round 1 Deadlock:** Animal bloc (9) demands 100% to A. Heritage (2) wants 100% to H. EAs argue about H's impact. *Solution:* Let them fail – equal split teaches compromise's cost.  

  2. **Fake Trade Trap:** Secret Saints (★) will trade A funding for other causes (since they'll personally top up A). E.g., ★ might trade: *"I support £200 less to A for £200 more to H"* – but they'd have donated that £200 anyway. Group won’t know until reveal.  

  3. **Fact Wars:** Heritage Guardians will try to trade with EAs who believe H=5/£. EAs who see H=0/£ will refuse, causing confusion. *This is intentional* – shows trading fails when parties disagree on facts, not values.  

  4. **Voting Chaos:** In Round 2, players may try to "double-spend" tokens. *Solution:* Enforce one trade vote at a time; update tally publicly.

  ---

  ### **Debrief Guide**
  Map game moments to core concepts:  
  - **"Why trade > compromise?"**  
    - *Point to:* Animal/Heritage players gaining more in Round 2. E.g., Animal player trades £200 to H for £400 to A – both sides win (Animal: +40 sat, Heritage: +30 sat). Compromise gave each ~£1,333 (Animal: 133 sat, Heritage: 200 sat) – worse for both.  

  - **"Why some trades are fake?"**  
    - *Reveal ★ Secret Saints:* Their trades didn’t change outcomes. E.g., ★ trading £200 from A to H *seems* sacrificial, but they’d have donated that £200 personally anyway. The £200 wasn’t "new" support.  

  - **"When trading fails?"**  
    - *Point to:* Heritage Guardians failing to trade with EAs who believe H=0/£. Trading relies on shared facts; if you think H harms the poor, no trade helps.  

  - **What the game *can’t* show:**  
    - "In real life, counterfactuals are invisible. We can’t know if someone would’ve acted anyway. That’s why moral trade needs trust, not just deals."  
    - "Trading fixes value conflicts, not fact disputes. If facts are contested, resolve those first."

  ---

  ### **Player Materials Example**
  - **Animal Advocate Card:**  
    ![](https://via.placeholder.com/200x100?text=Animal+Advocate)  
    "Role: ANIMAL ADVOCATE  
    Satisfaction = 10 x £ to Animal Welfare (A)  
    You get 0 from Heritage (H) or Effective (E).  
    Secret: Corner says ★ or [blank]."  

  - **EA Card (H=0 version):**  
    ![](https://via.placeholder.com/200x100?text=EA+Expert)  
    "Role: EFFECTIVITY EXPERT  
    Satisfaction:  
    - E: 10/£ (max impact)  
    - A: 5/£ (moderate)  
    - H: 0/£ (data: heritage helps elites)  
    Trade only if it raises total impact!"  

  - **Trade Agreement Card:**  
    "BINDING DEAL:  
    [Name 1] supports £____ more to [Cause]  
    [Name 2] supports £____ more to [Cause]  
    Signed: ________ & ________"

  ---

  ### **Key Takeaways**
  - **Compromise** = everyone loses (value conflicts).  
  - **Trading** = everyone wins (if values differ).  
  - **Fake trades** = no real change (watch for hidden counterfactuals).  
  - **Fact disputes** = trading fails (resolve facts first).  

