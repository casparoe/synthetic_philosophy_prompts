prompt: |-
  I used to write pricing software for an insurance company; I now help run a puzzle club and keep a notebook of betting problems. I have a question about a pattern I keep meeting in that notebook, and I am not sure it has a name. To be clear about what I am after: I do not want a reading list or a list of authors and papers — I have no library access, and in any case I am not asking who got there first. I am asking what the thing is, what it is not, and where exactly it runs out.

  The background is a game I first met as a puzzle. A fair coin is tossed until it lands heads for the first time; if the first heads falls on the nth toss, then for odd n you are paid 2^n/n dollars and for even n you pay 2^n/n dollars. The payoffs run +2, −2, +2.67, −4, +6.40, −10.67, +18.29, −32, and so on. Weighting each payoff by the probability of its branch, 2^−n, gives 1, −1/2, 1/3, −1/4, …, which added in that order comes to about 0.69. Added in a different order — two gains for each loss, say — it comes to about 1.04; with contrived enough orders it can be made to come to anything, large negative numbers included. So the game has no value, in the only sense of value the puzzle supplies. I gather this is a known curiosity; it is not what I am asking about.

  Here is what I noticed. Take that game — call it A — and leave everything alone except that every losing payoff is doubled: the losses run −4, −8, −21.33, −64, … and the gains are untouched. Call this B. B is worse than A in every single outcome: identical when you win, exactly twice as costly when you lose. No adding up is needed to see that. But B has no value either: its weighted payoffs run 1, −1, 1/3, −1/2, 1/5, −1/3, …, whose gains sum to infinity and whose losses sum to minus infinity.

  Now suppose you hold B and are offered A in exchange for a fee. The improvement is zero on every winning branch and 2^n/n on every losing branch. Every term is positive or zero, so nothing here can depend on the order in which the branches are taken, and the probability-weighted total is 1/2 + 1/4 + 1/6 + …, which grows without bound. Two conclusions seem to follow, and they pull against each other. The first looks unusually safe: I never valued A and never valued B, I only asked what changes on each branch, and every change points the same way, so the reordering that destroys each game's value separately appears unable to touch the verdict. The second looks absurd: the arithmetic seems to say that any finite fee is worth paying to escape B — a million dollars, say — even though with probability 2/3 the swap does nothing at all, and the chance that it makes any difference you would notice at that fee is on the order of one in fifty million.

  Two neighbouring cases, which I take to be boundary markers. If instead I take A and simply charge a dollar to play it, I get a game C that is worse than A by exactly one dollar on every branch; the same branch-by-branch comparison now returns an ordinary, sane answer — the swap is worth one dollar — even though C has no value on its own, for exactly the reason B has none. And if I take A with every sign reversed, I get a game D where the comparison route gives me nothing: A does better on the winning branches, D does better on the losing ones, the branch-by-branch difference is just twice A and has no value either, and when I tried lining the two games' payoffs up from best to worst the verdict kept flipping depending on where I looked.

  So what I want a name for is this: the move of extracting a determinate verdict from two options that individually have no value, by comparing them branch by branch — or by lining their payoffs up in order of size — rather than by valuing each and subtracting; and the situation that results, in which there is a firm ranking, no firm magnitude, and, when the total improvement diverges, a recommendation to pay any finite price whatever.

  Is there an established concept for the move, or for the situation? If there are several near neighbours — the general phenomenon behind the original puzzle, the various ways of ranking gambles without valuing them, the old worry about prizes large enough to make any price look worth paying — I want to know which fits best and precisely how the case above differs from each, because I suspect it fits none of them cleanly: here the verdict survives the reordering problem even though the separate values do not. If there is no established concept, please say so plainly and then do the carving yourself: give it a name, define it, and set out the boundary cases — when the route yields a finite price, when an unbounded one, when a ranking with no magnitude, and when nothing at all. Three further things I would like settled. Does the improvement's unbounded total count as a value in the same sense in which A was said to have none, or is it a different kind of object? Does the argument need the two games to be played with the same coin, or does it survive if they are played with separate ones? And which half of my second case is the fragile one — the ranking, or the any-finite-fee — since I take it they do not stand or fall together?
reasoning: |-
  Okay, the user is describing a fascinating paradox they've encountered in their betting problems notebook, stemming from a variant of the classic St. Petersburg-like game. They've noticed that while two games (A and B) individually have no definite value due to conditional convergence issues, comparing them branch-by-branch yields a clear ranking and even suggests paying any finite fee to switch from B to A. 

  The core tension they're highlighting is between: (1) The branch-by-branch improvement being uniformly non-negative with divergent expected value, suggesting infinite worth for the swap, versus (2) The practical absurdity of paying millions when the swap only helps in low-probability loss scenarios. 

  I appreciate how precisely they've delineated the boundaries: 
  - The contrast with charging $1 for game A (where branch comparison works sanely)
  - The failure when comparing A with its mirror image D
  - Their suspicion this doesn't fit existing concepts cleanly

  Their insurance pricing background shows in how they're isolating the "reordering vulnerability" – the key being that branch comparison avoids the conditional convergence problem that plagues individual valuation. The actuary-turned-puzzle-master perspective explains why they care about both mathematical rigor and real-world absurdity.

  What they need isn't literature references (they've made clear they lack access) but conceptual clarification: 
  - Why branch comparison resists reordering where individual sums fail
  - Whether the infinite expected improvement should be considered a "value"
  - How much the shared coin flip matters
  - Whether the ranking and infinite fee are separable conclusions

  The St. Petersburg paradox is clearly the jumping-off point, but the conditional convergence aspect and comparison twist take it somewhere new. I should emphasize that the branch comparison essentially creates an absolutely convergent series of improvements, making it order-invariant – which is mathematically profound given how pathological the original games are. 

  Their "any finite fee" conclusion is mathematically sound but practically nonsensical – this tension mirrors insurance contexts where extreme tail risks distort pricing. The shared coin flip is crucial; separate coins would break the branch alignment and reintroduce conditional convergence issues. 

  I'll introduce "St. Petersburg Improvement Principle" as a proposed name since it: 
  - Anchors it to the known paradox 
  - Highlights the novel comparison aspect 
  - Captures the divergent improvement 
  - Avoids claiming this is an established term (it's clearly not)

  The ranking and infinite fee do separate cleanly: the former holds even for finite improvements, the latter requires divergence. The improvement's divergence isn't a "value" in the ordinary sense but rather an order-invariant directional verdict.
answer: |-
  This is a beautifully observed phenomenon that cuts to the heart of conditional convergence and value comparisons in infinite series. There isn't a single, universally established name for the *exact* move you're describing, but it sits at the intersection of several well-known concepts. Here's a breakdown, a proposed name, definitions, boundaries, and answers to your specific questions.

  **The Core Concept & Proposed Name**

  1.  **The Move:** Comparing two gambles with undefined expectations (due to conditional convergence) by examining the difference in payoffs *outcome-by-outcome* and summing the expectation of *those differences*.
  2.  **The Situation:** When this comparison yields a difference series that is *absolutely convergent* or diverges to +/- infinity, establishing a clear dominance ranking (even an infinite "value" for the swap) despite neither gamble having a defined value individually.
  3.  **Proposed Name:** The **St. Petersburg Improvement Principle (SPIP)**.
      *   **Justification:** Anchors it to the foundational paradox (St. Petersburg), highlights the core action (Improvement comparison), and frames it as a principle for ranking pathological gambles.

  **Definition of SPIP**

  1.  **Input:** Two gambles, G1 and G2, defined over the same sample space (usually the same sequence of random events, like coin flips). The expectation E[G1] and E[G2] are both undefined due to conditional convergence (the series defining their values can be rearranged to sum to any real number or diverge).
  2.  **Comparison:** Form the difference gamble D = G2 - G1. Calculate the expectation E[D] by summing the probability-weighted payoff differences outcome-by-outcome: E[D] = Σ [P(ω) * (G2(ω) - G1(ω))] for all outcomes ω.
  3.  **Outcome (SPIP Applies):**
      *   If the series for E[D] **converges absolutely** (Σ P(ω) * |G2(ω) - G1(ω)| < ∞), then E[D] is well-defined and finite. G2 is strictly preferable to G1 if E[D] > 0, etc.
      *   If the series for E[D] **diverges to +∞** (all terms non-negative, Σ P(ω) * (G2(ω) - G1(ω)) = ∞), then G2 dominates G1 and any finite payment is worthwhile to switch from G1 to G2.
      *   If the series for E[D] **diverges to -∞** (all terms non-positive, Σ P(ω) * (G2(ω) - G1(ω)) = -∞), then G1 dominates G2 and any finite payment is worthwhile to switch from G2 to G1.
  4.  **Outcome (SPIP Does Not Apply):** If the series for E[D] also **converges conditionally** or diverges by oscillation, then SPIP yields no definitive ranking. The comparison gamble D itself has no defined value.

  **Boundary Cases & How They Fit SPIP**

  1.  **Your Game B vs. Game A (Swap for a Fee):**
      *   D = A - B.
      *   On every outcome ω_n (H on toss n):
          *   If n odd (Win in A/B): D(ω_n) = A(ω_n) - B(ω_n) = (2ⁿ/n) - (2ⁿ/n) = 0
          *   If n even (Loss in A/B): D(ω_n) = A(ω_n) - B(ω_n) = (-2ⁿ/n) - (-2 * 2ⁿ/n) = (-2ⁿ/n) + (2 * 2ⁿ/n) = 2ⁿ/n
      *   E[D] = Σ [P(ω_n) * D(ω_n)] = Σ (n even) [ (1/2ⁿ) * (2ⁿ/n) ] = Σ (k=1, ∞) [ (1/2^{2k}) * (2^{2k}/(2k)) ] = Σ (k=1, ∞) [1/(2k)] = (1/2) * Σ (k=1, ∞) [1/k] = ∞
      *   **SPIP Verdict:** E[D] = +∞. Switching from B to A offers infinite expected improvement. Any finite fee is worth paying. **Fits SPIP Divergence to +∞**.
  2.  **Game A vs. Game C (A with $1 Fee):**
      *   D = C - A = (A - 1) - A = -1 (constant for all outcomes)
      *   E[D] = Σ [P(ω_n) * (-1)] = -1 * Σ P(ω_n) = -1
      *   **SPIP Verdict:** E[D] = -1 (finite and negative). C is worse than A by exactly $1. **Fits SPIP Absolute Convergence** (trivially, since |D| is constant and bounded).
  3.  **Game A vs. Game D (Sign-Reversed A):**
      *   D = D - A = (-A) - A = -2A
      *   E[D] would be -2 * E[A]. But E[A] is undefined (conditionally convergent). The difference gamble D = -2A *also* has a conditionally convergent expectation series (same as A, scaled). Rearranging outcomes can make E[D] sum to anything.
      *   **SPIP Verdict:** Indeterminate. SPIP does not apply because E[D] is also conditionally convergent. **Fits SPIP "Does Not Apply"**.

  **Answers to Your Specific Questions**

  1.  **Does the improvement's unbounded total count as a value?** No, not in the standard sense of "expectation". It is a *verdict* obtained via the SPIP comparison method. It tells you the direction and unbounded magnitude of the *improvement*, not the absolute value of either gamble. It's a relational property of the pair (G1, G2), not an intrinsic property of G1 or G2 alone.
  2.  **Does the argument need the same coin?** **YES, crucially.** SPIP relies on comparing payoffs *outcome-by-outcome*. This requires the gambles to be defined on the *same underlying sample space* (the same sequence of coin flips). If Game B used one coin and Game A used a separate, independent coin, the sample space would be the product space (sequence for B, sequence for A). The outcome (ω_B, ω_A) would have probability P(ω_B) * P(ω_A). The difference D(ω_B, ω_A) = A(ω_A) - B(ω_B). Calculating E[D] now involves a double sum. Critically, this double sum will likely be *conditionally convergent* or oscillate itself. The divergence to +∞ that occurred when the coins were linked (guaranteeing the loss events happened together) disappears. The "clean" comparison where gains only happen when losses are mitigated (or vice-versa) is lost. SPIP generally fails with independent realizations.
  3.  **Which half (ranking vs. any-finite-fee) is fragile?** The "any finite fee is worth paying" conclusion is the fragile one. It requires the specific divergence to +∞ (or -∞) of E[D] under SPIP.
      *   The *ranking* (G2 is better than G1) is robust whenever SPIP applies and E[D] > 0 (finite or infinite). This relies only on the non-negativity of the differences and the convergence/divergence properties of the sum.
      *   The "any finite fee" conclusion *requires* E[D] = +∞ under SPIP. If SPIP yields a *finite positive* E[D] (like the $1 fee case), then the swap has a definite finite positive value. You would only pay a fee less than E[D]. The "any finite fee" is a direct consequence of the infinite expected improvement identified by SPIP.

  **What SPIP is NOT (Nearest Neighbours)**

  1.  **St. Petersburg Paradox / Conditional Convergence:** This is the *source* of the pathology in the individual games A and B. SPIP is the *method* used to compare two such pathological objects and extract a sensible (though sometimes extreme) ranking by focusing on their difference in a way that avoids the conditional convergence trap.
  2.  **First-Order Stochastic Dominance (FOSD):** FOSD compares cumulative distribution functions (CDFs): G FOSD F if P(G > x) >= P(F > x) for all x, with strict inequality for some x. SPIP can establish dominance where FOSD fails (and vice-versa).
      *   In your A vs. B swap: SPIP strongly recommends the swap (infinite improvement). However, FOSD does *not* hold. For any finite `x`, there are outcomes where A wins big and B loses big (so P(A > x) is high), and outcomes where B loses catastrophically and A only loses badly (so P(B > x) is slightly higher than P(A > x) for large negative x, though both are near 1). Neither gamble FOSD the other. SPIP leverages the *coupling* (same coin) and the specific payoff structure to see a dominance FOSD misses.
      *   In your A vs. C ($1 fee) swap: SPIP says C is worth $1 less. FOSD also clearly shows A dominates C: P(A > x) = P(C > x - 1) = P(C + 1 > x), so P(A > x) >= P(C + 1 > x) for all x, with equality only when impossible or certain. A FOSD C.
      *   **Difference:** SPIP relies on the specific outcome-by-outcome coupling and difference calculation. FOSD relies only on the marginal distributions and works without a shared sample space.
  3.  **Expected Utility Theory (EUT) with Unbounded Utility:** One "solution" to St. Petersburg is bounded utility. Could unbounded utility explain the "any finite fee"? Potentially, but it's distinct.
      *   **SPIP:** Recommends paying any finite fee for the swap based *only* on the divergence of the expected *monetary* improvement under the specific comparison method (same coin, outcome differences). It doesn't invoke utility.
      *   **EUT with Unbounded Utility:** Could also recommend paying a large (even infinite) fee if the utility function grows fast enough to make the expected utility improvement diverge. However, this depends critically on the *form* of the utility function, whereas SPIP's "any finite fee" is a consequence purely of the monetary payoffs and the shared randomness. SPIP identifies a structural monetary dominance under the specific comparison, while EUT explanations are agent-dependent.

  **Conclusion**

  You've identified a powerful and subtle principle: **The St. Petersburg Improvement Principle (SPIP)**. It allows for the definitive ranking of two gambles with undefined expectations by leveraging a shared sample space and analyzing the expectation of their difference outcome-by-outcome. When this difference series converges absolutely or diverges monotonically, it provides a clear verdict – a finite value for the swap, a strict dominance ranking, or even the extreme recommendation to pay any finite price to make the swap – *despite* the individual pathologies.

  Its boundaries are clear: it requires the same underlying randomness, and it fails if the difference gamble itself has a conditionally convergent expectation. It is distinct from, though related to, foundational concepts like conditional convergence, stochastic dominance, and expected utility theory. The "any finite fee" conclusion is a specific, robust consequence of SPIP when the expected improvement diverges to +∞. This divergence isn't a "value" in the standard sense but is a well-defined, order-invariant verdict on the *relative desirability* of the two gambles under the SPIP comparison.
