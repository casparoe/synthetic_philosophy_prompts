  This case satisfies all constraints:  
  - Realistic (hiring committees face gap vs. pressure tradeoffs).  
  - Natural contrasts (common in post-mortem discussions).  
  - Identical evidence (listed explicitly).  
  - No ad hoc/bad lot (both explanations are plausible; neither is false).  
  - Incompatibility via motive conflict (gap vs. mandate), not stipulation.  
  - Accessible (no jargon, self-contained).  

