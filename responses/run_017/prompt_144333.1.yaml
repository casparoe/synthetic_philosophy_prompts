prompt: |-
  I am on a small committee revising the practices of a learned society — among them double-blind reviewing, the expectation that referees work unpaid, the order in which senior and junior members are called on at panels, and a lingering practice of not citing another member's unpublished conference paper without asking first. We keep calling these things 'conventions' and 'norms' interchangeably, and I have come to think the word is doing no work in our deliberations. So before I classify any of them, I want the specification.

  The purpose fixes what adequacy means here, so let me state it. The theory I need is one a reformer can use from the inside, in advance of acting, and without survey data, to answer three questions: whether a given practice is a convention at all rather than a mere regularity, an artefact of an external constraint, or a norm of some other sort; if it is a convention, what is actually holding it up; and which of the instruments really available to us — setting a precedent, changing what is observable to whom, a public announcement, attaching a cost to deviation, changing who the population is — has any chance of moving it, and which is certain not to. A theory that only lets a philosopher classify a practice correctly once the history is known is no use to me, and a theory that classifies correctly but tells me nothing about levers is only half a theory.

  Write the desiderata such a theory has to meet. For each one, give the case or consideration that makes it a requirement rather than a preference, and tell me whether you take it to be non-negotiable or a prejudice of one camp. The classifications I most need it to get right, and which I would use as test cases: a practice everyone complies with and everyone knows everyone complies with, while each privately believes — falsely — that most others endorse it, and which survives a public announcement of that fact; a practice that looks conventional but is really a by-product of an external constraint, such as a funder's reporting requirement, so that repealing the constraint dissolves it without anyone changing their mind; a practice nobody in the organisation can state, which nevertheless survives near-total turnover of its members; a practice that is inefficient and known by all to be inefficient, and yet stable for decades; and a practice that collapses within a year with no change in sanctions, population, or anyone's private convictions. Anything your list cannot sort from its neighbours is a gap in the list.

  Two further things matter more to me than completeness. First, flag any subset of your desiderata that you suspect cannot be jointly satisfied: I would rather have a short list with a proved tension in it than a long list that quietly presupposes a theory that cannot exist. My own suspicion is that the demand that a theory explain stability and the demand that it explain endogenous change are met by theories of incompatible shapes — one wants an equilibrium concept, the other wants a dynamics defined largely off the equilibrium — and that the second of these is where the Lewisian picture is thinnest. If something like that is right, say which desideratum should give way given my purpose, and what I lose by dropping it. Second, tell me which single requirement on your list excludes the most candidates, and whether it is a genuine requirement or a preference you happen to share — I would rather know which of your demands is doing the real work.

  If the honest answer is that 'convention' is a folk term that should be split into two or three kinds before any desiderata are stated, say so and give me the taxonomy the design purpose actually needs, rather than analysing a word.

  Then, briefly — a short paragraph each, and no references, since I know the literature and will supply citations myself — how the Lewisian coordination account, broadly evolutionary and dynamic accounts in the spirit of Skyrms, and normative-expectations accounts in the spirit of Bicchieri do against the list. Keep the weight on the criteria rather than on the scoring.

  Mark your confidence on each desideratum you call non-negotiable, and for each, state what would make you drop it: which case, or which argument, would change your verdict. Say too where you suspect your list has been shaped by what is easy to model rather than by the phenomenon itself — that is where I most expect it to be wrong.
reasoning: |-
  Hmm, the user is on a committee revising practices for a learned society and needs a theoretical framework to distinguish conventions from other types of social patterns. They specifically want to understand what makes something a convention, what sustains it, and how it can be changed through practical interventions. This is quite a sophisticated request that blends social theory with practical reform objectives.

  The user has outlined several key test cases that any adequate theory must handle: practices sustained by pluralistic ignorance, those that are artifacts of external constraints, tacit practices that survive member turnover, inefficient but stable practices, and practices that collapse without obvious reasons. These cases reveal the complexity they're grappling with.

  For the desiderata, I need to identify essential requirements for this theory. The user wants something actionable from inside the system, without requiring historical data. Key criteria include distinguishing conventions from mere regularities, identifying the sustaining mechanism, and revealing effective intervention levers. I should also consider whether stability and change explanations are fundamentally incompatible, as the user suspects.

  The user explicitly wants me to flag any tensions between desiderata. There's likely a conflict between explaining stability (which requires equilibrium concepts) and explaining endogenous change (which requires dynamic models). Given their reform purpose, they might prioritize change mechanisms over perfect stability models.

  For existing theories: Lewis focuses on coordination equilibria but struggles with change dynamics; evolutionary models handle emergence and drift but have trouble with normative dimensions; Bicchieri's normative expectations explain compliance but overemphasize beliefs. None perfectly meet all criteria, especially the intervention levers.

  I need to be clear about where these theories fall short for the user's specific needs. The taxonomy might need to split "convention" into different types—perhaps coordination conventions, constraint artifacts, and normative practices—to better serve their reform goals.

  The most demanding requirement is probably "Intervention-Predictive," as it requires precise causal understanding of what sustains practices. If a theory can't predict how interventions will affect a practice, it's useless for reform. This likely excludes many philosophical accounts that focus only on classification.

  Finally, I should acknowledge where my list might be biased toward what's easy to model rather than real-world complexity. Equilibrium-focused models are particularly vulnerable here, as real social systems rarely reach perfect equilibrium.
answer: |-
  Here are the desiderata for a theory meeting your purpose, derived from your test cases and reformer's needs. Each is non-negotiable *for your stated purpose* unless marked otherwise. I flag tensions and biases.

  ### Core Desiderata (Non-Negotiable for Purpose)
  1.  **Distinguishability from Neighbors:**
      *   *Requirement:* Must reliably separate conventions from mere statistical regularities, externally constrained patterns, moral/legal norms, and coordination traps. Must pass your test cases.
      *   *Case for Requirement:* Your examples (e.g., constraint artifact vs. genuine convention; pluralistic ignorance case vs. norm). Misclassification leads to failed interventions (e.g., trying to change a constraint artifact via announcements).
      *   *Confidence:* High (Core to the task). *Drop if:* A case proves indistinguishable *by any mechanism relevant to intervention*.

  2.  **Sustaining-Mechanism Identification:**
      *   *Requirement:* Must identify the *primary causal mechanism* maintaining compliance *now* (e.g., mutual expectations, sanctions, preferences, external force, ignorance). Not just definitional conditions.
      *   *Case for Requirement:* Knowing *what holds it up* is essential for choosing an intervention lever (e.g., changing expectations vs. removing a constraint vs. introducing sanctions). The pluralistic ignorance case hinges on the *false belief* about endorsement as the sustainer.
      *   *Confidence:* Very High (Essential for action). *Drop if:* Mechanism is fundamentally unobservable pre-intervention (contradicting purpose).

  3.  **Intervention-Predictive:**
      *   *Requirement:* Must predict the likely effect (stability, change, collapse) of specific, feasible interventions (your list: precedent, observability change, announcement, cost attachment, population change) on the practice, based on its classification/sustaining mechanism.
      *   *Case for Requirement:* Your core purpose. Must explain why the pluralistic ignorance case survives announcement (false beliefs persist?), why the constraint artifact dissolves when constraint is lifted, why the unstatable practice survives turnover (tacit knowledge transfer?), why the inefficient one persists (lack of salient alternative? high transition cost?), and why the last collapses endogenously (cascade triggered by minor event?).
      *   *Confidence:* High (Purpose-defining). *Drop if:* Social change is shown to be fundamentally chaotic/unpredictable at the required level.

  4.  **Actionable without History/Surveys:**
      *   *Requirement:* Must enable classification and lever selection using information a reformer inside the system can reasonably access *before acting* (e.g., observable behavior, stated rules, known constraints, plausible inferences about common knowledge/beliefs), not requiring historical analysis or systematic polling.
      *   *Case for Requirement:* Explicitly stated purpose ("in advance of acting, and without survey data"). A historian's theory is useless for proactive reform.
      *   *Confidence:* Very High (Purpose-defining). *Drop if:* Internal evidence is proven fundamentally insufficient for reliable classification/intervention-prediction.

  ### Critical Tension & Key Excluder
  *   **The Stability-Change Tension:** You are correct. Explaining stability requires equilibrium concepts (showing why no one *wants* to deviate given others' actions). Explaining endogenous change requires dynamics *off-equilibrium* (how deviations start/cascade despite equilibrium). **Lewisian accounts excel at the first, struggle with the second. Evolutionary/dynamic accounts reverse this.**
      *   **What Should Give Way?** Given your purpose (reformer wanting to *change* practices), **stability explanation must yield primacy to change dynamics and intervention prediction.** A perfect equilibrium model that can't model transitions triggered by feasible interventions is less useful than a dynamic model that approximates stability. You lose a precise "why stable" explanation but gain actionable "how to disrupt" insight.
  *   **The Key Excluder:** **Intervention-Predictive (3)** is the most demanding and excludes the most candidates. Many philosophical analyses stop at classification (Lewis, partially Bicchieri) or broad dynamics (Skyrms) without specifying effects of *concrete levers*. It's a **genuine requirement** for your purpose; a theory lacking it is merely descriptive, not reform-guiding.

  ### Taxonomy Suggestion
  "Convention" is indeed overloaded. For your **design purpose (identifying levers for change)**, split based on primary **sustaining mechanism**:
  1.  **Coordination Conventions (Lewis Core):** Sustained by mutual expectations + preference for conformity *given others conform*. *Key Lever:* Create common knowledge of a viable alternative/salience shift (precedent, announcement).
  2.  **Norm-Driven Practices (Bicchieri Core):** Sustained by mutual expectations + conditional preference for conformity *because others approve/disapprove* (normative expectations). *Key Lever:* Change expectations of approval/sanctions (cost attachment, announcement, observability).
  3.  **Constraint Artifacts:** Sustained *only* by external imposition (funder rule, law). Not conventions. *Key Lever:* Remove/lift the constraint.
  4.  **Traps (E.g., Pluralistic Ignorance, Inefficiency):** Sustained by *false* mutual beliefs (e.g., everyone complies thinking others endorse it; everyone complies thinking change is too costly/risky despite knowing inefficiency). *Key Lever:* Reveal true beliefs/state (announcement, observability), lower transition cost (precedent, coordination).
  5.  **Tacit Practices:** Sustained by implicit learning/coordination, often below conscious articulation. *Key Lever:* Make the practice observable/explicit (precedent, announcement), or change population/learning mechanism.

  ### Theories vs. Desiderata (Brief)
  *   **Lewis (Coordination Equilibrium):** Excels at **Distinguishability (1)** for pure coordination problems. Defines stability **(implicitly addresses 2 via equilibrium)**. Weak on **Intervention-Predictive (3)** beyond creating salience (announcement/precedent). **Actionable without history (4)** if common knowledge can be inferred. Fails test cases: Cannot explain stability in pluralistic ignorance (no normative expectations) or inefficient traps (not strict coordination eq.); struggles with unstatable practices (assumes salience); cannot predict endogenous collapse. *Thinnest on dynamics/change.*
  *   **Skyrms (Evolutionary/Dynamic):** Strong on **Intervention-Predictive (3)** dynamics (e.g., how population change, observability, noise affect evolution). Can model **Sustaining-Mechanism (2)** as evolutionary stable state. Can handle inefficient traps and endogenous collapse **(3)**. Weaker on **Distinguishability (1)** - may blur conventions with any evolved regularity. Struggles with norm-driven practices and pluralistic ignorance (underplays belief complexity). **Actionable without history (4)?** Depends on modeling assumptions vs. real-world observables.
  *   **Bicchieri (Normative Expectations):** Strong on **Distinguishability (1)** norms vs. conventions vs. traps (pluralistic ignorance is central). Explains **Sustaining-Mechanism (2)** via empirical/normative expectations. Moderately **Intervention-Predictive (3)** for norm change (e.g., announcements changing beliefs, sanctions). **Actionable without history (4)?** Beliefs are hard to observe directly. Can explain stability of norm-driven practices and pluralistic ignorance traps. Less adept at pure coordination or constraint artifacts. Change dynamics often rely on exogenous belief shift.

  ### Bias Acknowledgement
  The list is biased towards **mechanisms that are isolatable and modelable**, potentially downplaying:
  *   **Deeply embedded cultural/cognitive schemas** holding up the unstatable practice.
  *   **Path dependence with high inertia** explaining the inefficient practice's stability.
  *   **Complex interaction effects** between mechanisms (e.g., a convention *also* having normative force). Equilibrium models (Lewis) are most guilty here, favoring clean, static pictures over messy dynamics. The focus on discrete interventions may oversimplify the process of change. **This is where the list (and most theories) are likely wrong/most incomplete.** Your "tacit practice surviving turnover" case probes this depth.
