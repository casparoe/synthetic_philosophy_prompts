prompt: |-
  My friend Nadia (philosophy minor, then public health, and she's the person in our group chat everyone pings when someone asks "is it messed up that…") has a long track record of confident verdicts on markets, and she refuses to state a general principle — she just goes case by case. Things I remember her saying over the years: paying people for plasma, fine; selling a kidney while alive, disgusting and should stay banned; compensated surrogacy in the US with capped fees, "grudgingly fine"; paying someone to carry and hand over a baby, ban; surge pricing for rides on New Year's Eve, fine; jacking up the price of bottled water and generators the day after a hurricane, ban; reselling a concert ticket above face value — she hates it but says banning it is worse; selling your vote, ban; investor "golden visa" citizenship, ban; paying people $100 to get a covid shot, fine; paying someone to hold your place in line, silly but fine. I genuinely cannot tell whether she's going by one clean rule or by vibes.

  I'm a backend engineer and I do some contract work for a small startup that runs a real-money prediction market (I've worked on their matching engine, so I know the plumbing; I'm not shilling). They want to list contracts on the next presidential election, and they've piled on guardrails because they know it sounds gross: $50 max net position per person, verified identity and age, no margin or leverage, one position per candidate, settlement on the certified popular vote, and — the bit they think is the clincher — in the final 30 days you can only open a position if public records show you already cast a ballot (they check whether you voted, not how). The spread goes to a voter-registration nonprofit. They asked me whether this is the kind of thing people will call repugnant, and I have no idea.

  Here's what I want from you. Given her list, what rule do you think Nadia is actually running? I can see at least two that fit all ten of her verdicts — one roughly like "a market is out when it takes advantage of desperate people or entrenches inequality in something that matters for standing," another roughly like "a market is out when it's the wrong way to value the thing being traded, even when everyone consents and nobody is made worse off" — but I bet there are others that fit just as well, and I want them named. Then: what does each candidate rule predict about the election contract, which verdict do you think she'd actually give and why, which of her earlier verdicts is doing the most work in pinning the rule down, and what single further case would you put to her to tell the rules apart? I care much more about the shape of the rule and where the cases split than about the final yes/no.
reasoning: |-
  We are given a series of Nadia's verdicts on various markets. Let's list them explicitly:

  1. Paying people for plasma: fine
  2. Selling a kidney while alive: disgusting and should stay banned
  3. Compensated surrogacy in the US with capped fees: grudgingly fine
  4. Paying someone to carry and hand over a baby: ban
  5. Surge pricing for rides on New Year's Eve: fine
  6. Jacking up the price of bottled water and generators the day after a hurricane: ban
  7. Reselling a concert ticket above face value: hates it but banning it is worse (so effectively fine, but with distaste)
  8. Selling your vote: ban
  9. Investor "golden visa" citizenship: ban
  10. Paying people $100 to get a COVID shot: fine
  11. Paying someone to hold your place in line: silly but fine

  We are to infer a rule (or rules) that Nadia is using and then apply it to a new case: a real-money prediction market on the presidential election with specific guardrails.

  The new case: 
  - Contracts on the next presidential election
  - $50 max net position per person
  - Verified identity and age
  - No margin or leverage
  - One position per candidate
  - Settlement on the certified popular vote
  - In the final 30 days, you can only open a position if public records show you already cast a ballot (they check that you voted, not how)
  - The spread goes to a voter-registration nonprofit

  We are to:
  1. Propose at least two rules that fit all ten verdicts.
  2. For each candidate rule, predict what it would say about the election contract.
  3. Guess which verdict Nadia would actually give and why.
  4. Identify which of her earlier verdicts is doing the most work in pinning down the rule.
  5. Suggest one further case to tell the rules apart.

  Let's start by analyzing the given verdicts to infer underlying principles.

  ### Observations from the Verdicts

  - **Plasma donation (fine)**: This is a renewable resource (plasma regenerates) and is typically done by people who are not in extreme distress. It's regulated and common.

  - **Kidney sale (banned)**: A kidney is a non-renewable resource. Selling it is seen as exploiting the desperate (since only the poor would consider it) and is irreversible.

  - **Surrogacy with capped fees (grudgingly fine)**: Here, the compensation is controlled and the process is regulated. The "grudgingly" might indicate discomfort with the idea of commercializing reproduction but acceptance because of the safeguards.

  - **Paying for a baby (ban)**: This seems to be about direct payment for adoption, which is illegal in many places to prevent baby trafficking. It's a fundamental human right issue.

  - **Surge pricing (fine)**: This is a temporary market response to high demand. It encourages more drivers to work, thus increasing supply.

  - **Price gouging after a hurricane (ban)**: Taking advantage of a disaster is seen as exploitative of people in desperate need.

  - **Ticket resale above face value (fine, though disliked)**: She dislikes it but thinks banning is worse. This might be because banning would create a black market or because it's seen as a voluntary transaction between consenting parties.

  - **Selling your vote (ban)**: Voting is a civic duty and fundamental to democracy. Selling it undermines the system.

  - **Golden visa (ban)**: Citizenship should not be for sale because it devalues the meaning of citizenship and creates inequality.

  - **Paying for COVID shot (fine)**: Incentivizing vaccination for public health is acceptable.

  - **Paying for line-holding (fine)**: A trivial service that doesn't harm anyone.

  ### Proposed Rules

  #### Rule 1: Exploitation and Essential Goods/Services
  Markets are banned when they exploit desperate circumstances or when they involve essential goods/services that are fundamental to human dignity and equality, especially if the transaction would create or reinforce harmful social hierarchies. Otherwise, they are allowed.

  - **Fits the verdicts**:
    - Plasma: not essential in the same way (renewable, not life-threatening to donate) -> fine.
    - Kidney: essential and non-renewable, and selling exploits the poor -> banned.
    - Surrogacy (capped): regulated, but note the discomfort because it involves reproduction (essential and personal) -> grudgingly fine (so allowed with regulation).
    - Paying for a baby: baby as an essential human being, and adoption should not be commercialized -> banned.
    - Surge pricing: non-essential (luxury service) and not exploiting desperation (New Year's Eve is a planned event) -> fine.
    - Price gouging: essential goods (water, generators) during a disaster -> exploiting desperation -> banned.
    - Ticket resale: non-essential (entertainment) and voluntary -> fine.
    - Selling vote: essential for democracy and equal standing -> banned.
    - Golden visa: citizenship is fundamental to equality and should not be for sale -> banned.
    - Paying for vaccine: public health incentive, not exploiting desperation -> fine.
    - Paying for line-holding: trivial and non-essential -> fine.

  #### Rule 2: Commodification of Intrinsic Values
  Markets are banned when they commodify something that should not be valued in monetary terms because it degrades the intrinsic value of the thing or the dignity of persons. Otherwise, they are allowed.

  - **Fits the verdicts**:
    - Plasma: does not degrade the person (renewable, no lasting harm) -> fine.
    - Kidney: selling an organ degrades the body and the person -> banned.
    - Surrogacy: commodifies reproduction and the mother-child bond -> grudgingly fine (so allowed with regulation, but note discomfort) because of regulation and capping, but the underlying act of paying for a baby is banned (verdict 4) because it directly commodifies the baby.
    - Paying for a baby: commodifies a human being -> banned.
    - Surge pricing: does not commodify an intrinsic value, just a service -> fine.
    - Price gouging: essential goods during disaster are necessary for life and should not be subject to market forces in that context -> banned (because it commodifies human survival?).
    - Ticket resale: commodification of an event ticket is acceptable -> fine.
    - Selling vote: commodifies a civic duty and the democratic process -> banned.
    - Golden visa: commodifies citizenship and national belonging -> banned.
    - Paying for vaccine: commodifies a public health measure? But she allows it. So perhaps the rule has an exception for incentives that serve a greater public good? Or because the vaccine is a service, not an intrinsic value? 
    - Paying for line-holding: commodifies a trivial service -> fine.

  #### Rule 3: Harm and Coercion
  Markets are banned when they involve significant harm to the seller or to society, or when they are coercive (i.e., the seller is in a situation of desperation or vulnerability). Otherwise, they are allowed.

  - **Fits the verdicts**:
    - Plasma: low harm, regulated -> fine.
    - Kidney: high harm and often done by the poor under duress -> banned.
    - Surrogacy: potential for harm to the surrogate and the child, but with caps and regulation, harm is mitigated -> grudgingly fine.
    - Paying for a baby: harm to the child and birth mother (risk of coercion) -> banned.
    - Surge pricing: no harm, just market efficiency -> fine.
    - Price gouging: harm to disaster victims by making essentials unaffordable -> banned.
    - Ticket resale: no harm (voluntary) -> fine.
    - Selling vote: harm to democracy (coercion of the poor to sell votes) -> banned.
    - Golden visa: harm to society by allowing the wealthy to buy citizenship, undermining the idea of equal citizenship -> banned.
    - Paying for vaccine: no harm, positive externality -> fine.
    - Paying for line-holding: no harm -> fine.

  ### Applying the Rules to the Election Contract

  The election contract is a prediction market on the presidential election. The key features are:
  - Small stakes ($50 max) to limit financial incentive and potential harm.
  - Identity verification and one position per candidate to prevent manipulation.
  - Settlement on official vote to avoid disputes.
  - In the final 30 days, only those who have already voted can open a position. This is meant to prevent the market from influencing voting (since you can't change your vote after casting) and to encourage voting (because you must have voted to trade).
  - The spread goes to voter registration.

  #### Rule 1 (Exploitation and Essential Goods) Prediction:
  - The market is about a fundamental democratic process (like voting). However, note that it's a prediction market, not the vote itself. The rule might see this as too close to commodifying democracy? But the guardrails are designed to prevent exploitation and to encourage voting.
  - The $50 cap and the voting requirement might mitigate concerns about exploitation and inequality. The fact that the spread goes to voter registration is a positive.
  - However, it might still be seen as turning a civic event into a betting opportunity, which could be repugnant. 
  - Verdict: likely BAN. Why? Because it commodifies the democratic process, which is essential and should be protected from market forces. Also, even with small stakes, it might create perverse incentives (e.g., wanting a candidate to win for financial gain) and could be seen as trivializing the election.

  #### Rule 2 (Commodification of Intrinsic Values) Prediction:
  - A prediction market on the election directly commodifies the democratic process. It turns the outcome of an election (an intrinsic public good) into a financial instrument. 
  - The voting requirement and the cap might help, but the core activity is putting a price on the election outcome. This might be seen as degrading the value of democracy.
  - Verdict: BAN. Because the election is an intrinsic public good that should not be traded.

  #### Rule 3 (Harm and Coercion) Prediction:
  - The market has low stakes and requires voting. It is unlikely to cause significant harm. In fact, the requirement to vote might even increase voter turnout. 
  - The market might provide useful information (as prediction markets often do). 
  - There is no clear coercion or vulnerability because the stakes are low and participation is voluntary.
  - Verdict: FINE.

  But note that Rule 3 might have an exception for fundamental institutions. Voting is fundamental, and selling votes is banned. However, a prediction market is not the same as selling votes. It's about predicting the outcome, not influencing the vote (and the design tries to prevent influence by requiring prior voting). 

  ### Which Rule is Nadia Likely Using?

  Looking at her verdicts, she banned selling votes and golden visas, which are about fundamental civic and national institutions. She also banned baby selling and kidney selling, which are about the human body and personhood. 

  In the election market, the core issue is the commodification of a democratic event. Her ban on vote selling suggests she would be against anything that commodifies the democratic process. Therefore, Rule 1 or Rule 2 seems more aligned with her thinking.

  However, note that she allowed the COVID shot incentive. This might be because it serves a public good. The election market might also be argued to serve a public good by providing information and encouraging voting (via the requirement). But the spread going to voter registration is a plus.

  But let's compare with the ticket resale: she dislikes it but allows it. The election market might be more like the ticket resale? Not necessarily, because the election is a fundamental civic event.

  Which of her earlier verdicts is doing the most work? The vote selling ban is the closest. She sees voting as a civic duty that should not be sold. The prediction market is not selling votes, but it is betting on the outcome. However, the requirement that you must have already voted might make it acceptable? Or not, because it still treats the outcome as a commodity.

  ### What Verdict Would Nadia Give?

  Given her pattern, I think she would say the election contract is repugnant and should be banned. Why?
  - It turns a sacred civic event into a betting opportunity.
  - Even with the voting requirement, it might encourage people to vote only to be able to bet (trivializing the vote).
  - The $50 cap is low, but it's still real money and could influence behavior.

  However, the design has many safeguards. The requirement to have voted might be the key. Since you cannot change your vote after casting, the market cannot influence your vote. And the market might even encourage voting (to participate). The spread going to voter registration is a positive.

  But note her verdict on golden visas: she banned them because citizenship should not be for sale. Similarly, the democratic process should not be for sale. Even if it's a prediction market, it is still putting a price on the outcome.

  Therefore, I think she would ban it.

  ### Which Earlier Verdict is Most Important?

  The vote selling ban is the most directly relevant. It shows she is against commodifying the act of voting. The prediction market commodifies the outcome of the voting process. So it's adjacent.

  ### One Further Case to Tell the Rules Apart

  Suppose we have a market for trading the right to use a public park bench for an hour (like a reservation system). Some might pay more for a prime spot. 

  - Rule 1 (Exploitation and Essential Goods): Public parks are a public good and should be equally accessible. Allowing a market might create inequality in access to a public space, so ban.
  - Rule 2 (Commodification): The park bench is a public amenity that should be available to all without price. Commodifying it degrades the public nature of the park, so ban.
  - Rule 3 (Harm and Coercion): If the market doesn't harm anyone and doesn't coerce, then it might be fine. But if it leads to the poor being excluded from prime spots, that could be harmful. So it might be banned if it creates exclusion, but fine if it's a trivial part of the park and doesn't displace others.

  But let's design a case that splits Rule 1 and Rule 2:

  **Case: Paying for the privilege of naming a public school.**

  - Rule 1: This might entrench inequality (rich can buy naming rights) and affect the standing of the school (if named after a controversial figure). So ban.
  - Rule 2: It commodifies the public institution of education and the naming right, which should be based on merit or public decision. So ban.

  This doesn't split them.

  **Case: Paying for priority access to a lifesaving drug that is in short supply (like during a pandemic).**

  - Rule 1: This exploits the desperate situation and creates inequality in access to an essential good -> ban.
  - Rule 2: It commodifies access to life itself, which is an intrinsic value -> ban.
  - Rule 3: It causes harm by denying the drug to those who can't pay -> ban.

  Still no split.

  **Case: Paying a poet to write a personalized love poem.**

  - Rule 1: Not essential, no exploitation -> fine.
  - Rule 2: Art and love are intrinsic values, but personalized art is often commissioned. It might be seen as acceptable because it's a creative service -> fine.
  - Rule 3: Fine.

  No split.

  **Case: Selling the naming rights to a newborn baby (i.e., a company pays the parents to name the child after the company).**

  - Rule 1: This might be seen as exploiting the parents (if they are poor) and commodifying the child -> ban.
  - Rule 2: It commodifies the identity of a human being and degrades the child's dignity -> ban.
  - Rule 3: Harm to the child (embarrassment) and society -> ban.

  Still no.

  **Case: A market where people can bet on the date of their own death (with strict privacy controls and only for people over 80).**

  - Rule 1: This involves an essential and deeply personal event (death) and might exploit the elderly if they are in financial need -> ban.
  - Rule 2: It commodifies death, which is a sacred event -> ban.
  - Rule 3: It might cause psychological harm or create perverse incentives -> ban.

  No split.

  **Case: Paying students for getting good grades in non-essential subjects (like art or physical education).**

  - Rule 1: This might be fine because it's an incentive in education, but it could create inequality if only some can achieve the grades? Or it might be seen as acceptable because it's not exploiting desperation. 
  - Rule 2: It commodifies educational achievement, which should be for its own sake -> ban.
  - Rule 3: It might cause harm by distorting the purpose of education? Or it might be fine as an incentive.

  Here we have a possible split:
  - Rule 2 would ban it because it commodifies the intrinsic value of learning.
  - Rule 1 might allow it because it's not an essential good in the same way as survival goods and doesn't exploit the desperate.

  But note that Nadia allowed paying for the COVID shot (an incentive for health) and might see paying for grades as similar. She might also allow it.

  Another idea:

  **Case: A market where you can buy and sell the right to be a godparent for a child (i.e., the parents auction off the role).**

  - Rule 1: This might be seen as trivializing a social and religious role. It could create inequality (only the rich can be godparents) and undermine the meaning of the role -> ban.
  - Rule 2: It commodifies a sacred social bond -> ban.
  - Rule 3: It might cause harm to the child and family relationships -> ban.

  No.

  **Case: A market for trading the right to have a picnic in a public park on a particular day and time (but the park is large and there are many spots, so it doesn't exclude others).**

  - Rule 1: Public goods should be equally accessible. But if it doesn't exclude, then it might be fine? Or if it's a reservation system that doesn't charge, then charging would be wrong. So ban because it creates inequality in access to public space.
  - Rule 2: It commodifies the use of public space -> ban.
  - Rule 3: It doesn't harm anyone because there are plenty of spots -> fine.

  This splits Rule 3 from the others.

  But let's think of a case that splits Rule 1 and Rule 2.

  **Case: Paying a woman to breastfeed another person's baby (wet nursing).**

  - Rule 1: This could be seen as providing an essential service (nutrition for the baby) and might be acceptable if the woman is not exploited and the fee is fair. But it might also be seen as exploiting the poor. However, if regulated, it might be grudgingly fine (like surrogacy). 
  - Rule 2: Breastfeeding is an intimate act that forms a bond between mother and child. Paying for it commodifies this intimate act and might degrade it -> ban.

  Nadia has already weighed in on surrogacy (grudgingly fine) and paying for a baby (ban). Wet nursing is closer to surrogacy? But note that she banned paying for a baby (which is about adoption) but allowed compensated surrogacy. So she might allow wet nursing? 

  But we don't have a verdict from her on wet nursing. This case might help:

  - If she says wet nursing is fine (like surrogacy), then Rule 1 might be more prominent (because it's about providing an essential service without exploitation).
  - If she says ban, then Rule 2 is more prominent (because it commodifies an intimate bodily function and the mother-child bond).

  So I propose the case: **Compensated wet nursing (regulated, with capped fees).**

  - Rule 1: Might be fine (like surrogacy) because it's providing an essential service under regulation.
  - Rule 2: Banned because it commodifies the intimate act of breastfeeding.

  This case would help distinguish between Rule 1 and Rule 2.

  ### Conclusion

  I believe Nadia would ban the election contract because it commodifies the democratic process, which she holds as sacred (like voting). The most telling precedent is her ban on vote selling.

  But note: the election contract has the voting requirement, which might make it acceptable? I doubt it. She would likely see it as still commodifying the outcome.

  For the further case to distinguish between the rules, I suggest asking her about compensated wet nursing.
answer: |-
  Based on Nadia's verdicts, I identify **three distinct candidate rules** that fit all eleven cases. Each rule emphasizes a different ethical dimension, and they split on edge cases like the election contract. Below, I'll define each rule, show how it fits her verdicts, predict its judgment on the election market, explain which prior verdict is most pivotal for pinning down the rule, and propose a diagnostic test case to distinguish between the rules. Finally, I'll predict Nadia's actual verdict on the election contract.

  ---

  ### **Candidate Rule 1: The Desperation/Inequality Rule**  
  **Definition**: A market is repugnant if it either (a) exploits acute desperation (e.g., disaster, poverty, coercion) or (b) entrenches or creates harmful inequality in access to essential goods/services that affect fundamental human standing (e.g., health, citizenship, political voice).  

  **Fits all verdicts**:  
  - ✅ **Fine cases** (plasma, surge pricing, ticket resale, COVID shot, line-holding): No acute desperation (e.g., plasma donors aren't coerced; surge pricing isn't during disaster); no essential good undermined (e.g., rides or vaccine access aren't unequalized).  
  - ✅ **Banned cases** (kidney sale, baby purchase, price gouging, vote sale, golden visa): Kidney/baby exploit desperation (irreversible loss for the poor); price gouging exploits disaster desperation; vote sale/golden visa create inequality in political/civic standing.  
  - ✅ **Grudgingly fine** (surrogacy): Capped fees mitigate desperation/inequality, but discomfort lingers due to bodily commodification (near the line).  

  **Prediction for election contract**: **BAN**.  
  - **Why?** The market risks commodifying democratic participation (an essential good for civic standing). Though capped at $50, it creates financial stakes in election outcomes, potentially incentivizing votes for profit rather than principle. The "must vote to trade" rule doesn't eliminate desperation (e.g., low-income users might see $50 as meaningful) or inequality (politically engaged voters with resources trade more easily). The spread going to voter registration is positive but insufficient to offset the core issue: betting on democracy entrenches unequal influence (e.g., savvy traders profit from civic events).  

  **Most pivotal prior verdict**: **Selling your vote (ban)**. This anchors the "essential standing" prong: voting is foundational to equal citizenship, and markets that financialize it undermine that equality. The vote-sale ban shows this rule prioritizes political equality over consent.  

  ---

  ### **Candidate Rule 2: The Incommensurable Value Rule**  
  **Definition**: A market is repugnant if it treats something as fungible (tradeable for money) when its value is inherently non-fungible, meaning monetary exchange degrades its intrinsic worth, social meaning, or human dignity—even without desperation or inequality. Consent is irrelevant.  

  **Fits all verdicts**:  
  - ✅ **Fine cases** (plasma, surge pricing, ticket resale, COVID shot, line-holding): Fungible values (plasma as renewable tissue; rides/tickets as services; shots as health incentives); no deeper meaning degraded.  
  - ✅ **Banned cases** (kidney sale, baby purchase, price gouging, vote sale, golden visa): Non-fungible values (kidneys embody bodily integrity; babies represent kinship; disaster essentials symbolize communal solidarity; votes and citizenship signify moral agency).  
  - ✅ **Grudgingly fine** (surrogacy): Capped fees soften but don't erase the commodification of reproduction (a near-incommensurable act), hence discomfort.  

  **Prediction for election contract**: **BAN**.  
  - **Why?** Elections are sacred civic rituals; prediction markets reduce them to financial speculation, degrading their symbolic role in collective self-determination. The guardrails (e.g., voting requirement, $50 cap) don't resolve this—they just make the commodification more "civilized." Like vote-selling, it frames democracy as a casino, corroding its intrinsic worth. The spread donation is a band-aid on a categorical mismatch.  

  **Most pivotal prior verdict**: **Golden visa (ban)**. This highlights incommensurability: citizenship signifies belonging/identity, not monetary value. The ban shows consent/inequality are secondary; the mere act of pricing degrades the thing.  

  ---

  ### **Candidate Rule 3: The Systemic Harm Rule**  
  **Definition**: A market is repugnant if it causes or risks diffuse, hard-to-reverse societal harm (e.g., eroding trust, incentivizing exploitation, or corrupting institutions), even if individuals consent. Markets are fine if harms are negligible or offset by guardrails.  

  **Fits all verdicts**:  
  - ✅ **Fine cases** (plasma, surge pricing, ticket resale, COVID shot, line-holding): No systemic harm (e.g., plasma markets are regulated; surge pricing balances supply/demand; ticket resale has efficiency benefits; COVID shots improve public health).  
  - ✅ **Banned cases** (kidney sale, baby purchase, price gouging, vote sale, golden visa): Kidney sales could exploit the poor and undermine organ donation systems; baby purchases risk child trafficking; price gouging erodes social trust in disasters; vote sales corrupt democracy; golden visas cheapen citizenship and enable corruption.  
  - ✅ **Grudgingly fine** (surrogacy): Caps and regulation mitigate harm (e.g., exploitation risks), but residual unease remains.  

  **Prediction for election contract**: **FINE** (with reservations).  
  - **Why?** The guardrails minimize systemic risks: $50 caps prevent high-stakes manipulation; voting requirements decouple trading from voting acts; identity verification prevents fraud. The market might even have net benefits (e.g., information aggregation from prediction markets, funding voter registration). Harm is speculative (e.g., no evidence small markets erode trust), and the design addresses Nadia’s distaste for resold tickets ("banning is worse").  

  **Most pivotal prior verdict**: **Reselling concert tickets ("hates it but banning is worse")**. This shows her pragmatism: she tolerates markets if harms are diffuse and bans cause worse outcomes (e.g., black markets). It anchors cost-benefit weighing.  

  ---

  ### **Predicted Verdict for Nadia: BAN**  
  **Why?**  
  - **Core driver**: Her bans on vote-selling and golden visas suggest she views political/civic domains as sacrosanct. The election market commodifies democracy similarly, triggering her "essential standing" (Rule 1) or "incommensurable value" (Rule 2) instincts.  
  - **Key influence**: **Vote-selling ban** is decisive. It reveals her belief that some spheres (like democracy) must be walled off from markets, regardless of consent or safeguards. The voting requirement in the contract doesn't resolve this—it still frames elections as bettable events.  
  - **Secondary clues**: Her "grudgingly fine" for surrogacy implies that bodily/political commodification sits on a knife-edge; the election contract lacks the compensating benefits of surrogacy (e.g., creating families). Golden visa ban reinforces that citizenship (and by extension, democracy) isn't for sale.  

  ---

  ### **Diagnostic Test Case to Split the Rules**  
  **Proposal**: *Paying for naming rights to public infrastructure (e.g., a corporation pays a city $10M to rename a public school after itself).*  
  - **Rule 1 (Desperation/Inequality)**: Likely **BAN**. Public goods (education) should be equally accessible; selling naming rights entrenches inequality (wealthy entities buy cultural influence) and exploits budget desperation (cities accepting deals due to underfunding).  
  - **Rule 2 (Incommensurable Value)**: **BAN**. Public institutions embody communal identity; monetizing names degrades their symbolic role (e.g., a school is for learning, not advertising).  
  - **Rule 3 (Systemic Harm)**: **FINE**. If regulated (e.g., no harmful brands), harms are minor (e.g., "Amazon Elementary" is tacky but doesn’t erode education), and the revenue funds schools—net social benefit.  

  **Why this splits the rules**:  
  - Rules 1/2 both ban, but for different reasons (inequality vs. degradation of meaning). Rule 3 allows it, mirroring her tolerance for resold tickets if harms are controlled.  
  - If Nadia bans it, Rules 1 or 2 dominate (her civic focus). If she allows it, Rule 3 wins (pragmatic harm calculus). Her golden visa ban suggests she’d ban this too—aligning with Rules 1/2.  

  ---

  ### Summary  
  - **Rules**: Desperation/Inequality (Rule 1), Incommensurable Value (Rule 2), and Systemic Harm (Rule 3) all fit Nadia's cases but split on the election contract.  
  - **Election prediction**: Rules 1 and 2 → BAN; Rule 3 → FINE.  
  - **Nadia's likely verdict**: BAN, anchored by her vote-selling and golden visa bans.  
  - **Key diagnostic case**: Selling naming rights for public schools to distinguish Rule 3 from Rules 1/2.  

  This reveals the "shape" of her reasoning: her repugnance is less about individual harm/vibes and more about protecting essential human and civic domains from market logic. The voting requirement in the election contract doesn't sanitize it—it might even heighten her disdain by making democracy a gatekeeper for gambling.
