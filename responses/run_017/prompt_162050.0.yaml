prompt: |-
  I'm a journalist who covers science and ideas, and I keep tripping over the same shape of argument. Most recently it happened twice in one day at a workshop on computation and physics where I was the only non-specialist in the room.

  Case one: someone claimed some kind of exotic physical setup could "do something uncomputable." A computer scientist shot back that this was confused, because whatever the setup does isn't computation at all — the class of computable functions is fixed once you've settled what an effective procedure is, so there's nothing here to discover. Fine. But twenty minutes later the same person used the very same claim to argue that the human brain is simulable in principle, and said that if it turned out not to be, that would be a discovery about brains, not a decision about what "computable" means. Stipulation in one breath, empirical finding in the next.

  Case two: someone raised a hypothetical machine that outran a Turing machine. One speaker said no physical device could ever refute the thesis, since anything that did that would ipso facto not be computing. Another speaker said the version anyone actually cares about is the physical one — the kind quantum computing people argue about — and that it really could turn out false. Then a third person pointed out that everyone treats the fact that wildly independent formalisms all land on the same class of functions as powerful evidence for the thesis, which only makes sense if it isn't a stipulation. Nobody resolved it; they all just moved on.

  What I'm after isn't the computability literature as such. It's the general move: a claim about the co-extension of a formal and an informal predicate ("computable by a Turing machine" / "computable in principle, by anything, ever") that gets to act as a definition when it's under pressure and as a discovery when it's doing work, where both roles are individually respectable. So it isn't motte-and-bailey — there's no indefensible version being smuggled — and it isn't quite plain equivocation either, since the same people hold both ends honestly and the shift isn't a bait-and-switch. I've since noticed the same shape in a couple of other places, e.g. with "fitness" in evolutionary biology and with the equivalence principle.

  Does this thing have an established name? If the nearest concepts are things like Carnapian explication, the analytic/synthetic distinction, "criterion" versus "hypothesis," or a computability-internal taxonomy (a thesis versus a principle versus an axiom, or the bare claim versus the complexity-flavored one where "feasibly" does the work), I want to know which fits best and exactly where my description stops fitting. A bare label won't satisfy me. And if there genuinely isn't one, coin a term, define it, and tell me where the boundary cases are: when does this double life cross over into being an illegitimate move, and when is it just how such claims have to work?
reasoning: |-
  Okay, the user is a journalist covering science and ideas, and they've noticed a recurring argument pattern involving a concept that shifts between being a definition and an empirical claim. They've encountered this in discussions about computability, evolution, and physics. They want to know if this has a name, or if not, how to define it and where the boundaries lie.

  First, I need to understand the core issue. The user describes a scenario where a term like "computable" is treated as a stipulative definition when defending against counterexamples (e.g., an exotic setup isn't computation, so it doesn't count) but as an empirical hypothesis when asserting its universality (e.g., the brain must be simulable). The same pattern appears with "fitness" in biology and the equivalence principle in physics. The user insists this isn't motte-and-bailey or equivocation because both uses are held sincerely.

  I recall that in philosophy of science, concepts like Carnap's explication involve refining vague concepts into precise ones. But here, there's a back-and-forth between precision and empirical application. The Church-Turing thesis is a prime example. It's often presented as a definition (effective computation = Turing-computable) but also as a falsifiable claim about physical systems. 

  The user mentioned several related concepts: analytic/synthetic distinction, criterion vs. hypothesis, feasibility. I should explore each. The analytic/synthetic distinction might apply—definitions are analytic (true by meaning), empirical claims are synthetic. But the Church-Turing thesis blurs this line. 

  In computability, the CT thesis is sometimes called a "thesis" rather than a theorem to highlight its status as a foundational assumption. But it's supported by evidence from multiple formalisms converging. This duality is key. 

  For "fitness," evolutionary biologists define it operationally as reproductive success but also treat it as an empirical measure of adaptation. The equivalence principle in GR equates inertial and gravitational mass, which is both a postulate and testable. 

  So, the common thread is a concept serving dual roles: as a conceptual anchor (stipulative) and a substantive claim (empirical). The challenge is naming this. Terms like "bridge principle" or "coordinative definition" from philosophy of science might fit. Reichenbach's "coordinating definitions" link mathematical concepts to physical reality. Feferman's "formal embodiment" also comes to mind. 

  Since there's no established term, I should propose one. "Amphibious Concept" captures the dual nature—living in both formal and empirical realms. Or "Janus-Faced Concept," after the two-faced god. But "Bridge Concept" is more descriptive. 

  Boundaries: When does this become illegitimate? If the shift is ad hoc to avoid counterevidence, it's problematic. But if it's a consistent methodological stance, it's legitimate. For example, dismissing a physical system as "not computation" must be based on principled criteria, not convenience. 

  The user needs clarity on when this is valid versus slippery. They also want to avoid conflating it with motte-and-bailey. So emphasizing the sincere, consistent dual role is crucial. 

  In conclusion, the best fit is recognizing this as a bridge concept with a dual status, inherent in how we formalize intuitive ideas. For computability, it's the CT thesis's unique status; in other fields, similar foundational principles. Naming it "Bridge Concept" or "Dual-Aspect Concept" with clear boundaries should address their needs.
answer: |-
  This is a brilliantly observed pattern that cuts to the heart of conceptual foundations in science and philosophy. You've identified a genuine phenomenon without a single, universally accepted name, but it sits at the intersection of several well-known philosophical concepts. The best description is a **"Bridge Concept with Dual-Aspect Status"** or a **"Formal Embodiment Operating Under an Empirical Guise."**

  Here's a breakdown of why your description is spot-on, how existing concepts relate, and where the boundaries lie:

  1.  **The Core Phenomenon:** A concept (like "computable," "fitness," "inertial mass") has two intertwined aspects:
      *   **The Formal/Stipulative Aspect:** It serves as a *definition* or *explication* of a vague or intuitive pre-theoretical concept ("effective procedure," "adaptedness," "resistance to acceleration") within a rigorous formal system (Turing machines, population genetics, general relativity).
      *   **The Empirical/Substantive Aspect:** The formal system, *embodying* that explicated concept, is then asserted to accurately *describe* or *capture* the behavior of phenomena in the real world (physical processes, biological evolution, gravitational motion). This aspect is treated as contingent and potentially falsifiable.

  2.  **Why It's Not Simply Those Other Things:**
      *   **Motte-and-Bailey:** Correctly dismissed. Both aspects are defensible and held sincerely. There's no retreat to an indefensible position.
      *   **Equivocation:** Also correctly dismissed. The *same concept* is genuinely being used in both ways, not two distinct meanings swapped deceptively. The shift reflects its inherent duality, not semantic trickery.
      *   **Carnapian Explication:** This is *part* of it. The formal system *is* an explication of the informal concept. But Carnap focused on the *process* of refinement for clarity. Your observation highlights the *consequence* of that explication: the explicated concept *inherits* the empirical burden of the vague concept it replaced. The explication *becomes* the hypothesis.
      *   **Analytic/Synthetic Distinction:** This is the *underlying tension*. The formal aspect often feels analytic (true by definition: "Computable *means* Turing-computable"). The empirical aspect is synthetic ("All physical processes are Turing-computable"). The "thesis" blurs this line fundamentally. Claims *about the explication's scope* are synthetic, even if the explication itself is stipulative.
      *   **Criterion vs. Hypothesis:** Very close! This is perhaps the best existing fit within the philosophy of computability specifically.
          *   **Criterion:** Defines what "computable" *means* (Turing-computable, λ-definable, etc.). This is the stipulative aspect used defensively ("If it's uncomputable by my criterion, it's not computation").
          *   **Hypothesis:** Asserts that the criterion captures *all physically realizable computation* (or all human thought, etc.). This is the empirical aspect ("If the brain isn't simulable, that's a discovery").
          *   **Limitation:** This taxonomy is specific to computability. Your observation shows it applies more broadly (fitness, equivalence principle). Also, the "criterion" isn't *just* a definition; it's chosen *because* it's believed to capture the informal concept well, based on arguments like the convergence of formalisms.

  3.  **The "Convergence Argument" and its Significance:**
      *   This is crucial evidence *for the empirical aspect*. The fact that radically different formalisms (Turing machines, λ-calculus, recursive functions, Post systems) all define the *same class* of functions is presented as strong evidence that they've all latched onto the *same natural kind* – "effective computability" as it exists in the physical/intellectual world.
      *   **Why it matters:** This argument only makes sense if the thesis is more than *just* a stipulative definition. If "computable" were *only* defined as "what Turing machines do," then the convergence of other formalisms would be an interesting mathematical coincidence, not evidence about the physical world. The argument treats convergence as evidence that the formalisms have successfully *modeled* a pre-existing, physically relevant phenomenon.

  4.  **The General Pattern: Foundational Bridge Concepts**
      *   These concepts act as **bridges** between the formal/mathematical realm and the empirical/physical realm.
      *   They have a **dual-aspect status**: They are simultaneously constitutive elements of a theoretical framework (stipulative) and claims about the applicability of that framework to reality (empirical).
      *   **Other Examples:**
          *   **Fitness (Evolutionary Biology):**
              *   *Formal/Stipulative:* Defined operationally within population genetics models (e.g., relative reproductive success, growth rate).
              *   *Empirical/Substantive:* The claim that this operational measure accurately reflects "adaptedness" or "design" in nature, and that natural selection *based on this fitness* is the primary driver of evolution. Debates about tautology ("survivors survive") touch directly on this duality.
          *   **Equivalence Principle (GR):**
              *   *Formal/Stipulative:* A foundational postulate of General Relativity, equating inertial mass and gravitational mass. It's built into the theory's structure.
              *   *Empirical/Substantive:* The claim that this equivalence holds exactly for all matter in the physical universe. It *is* tested empirically (e.g., Eötvös experiments), but its status as a core postulate means a violation would require a radical theory revision, not just a minor adjustment.
          *   **Universal Grammar (Linguistics):**
              *   *Formal/Stipulative:* A set of innate constraints/principles proposed within a specific linguistic theory (e.g., Principles and Parameters) defining possible human languages.
              *   *Empirical/Substantive:* The claim that these specific constraints/principles accurately model the innate biological endowment underlying human language acquisition.

  5.  **Naming It:**
      *   **"Bridge Concept"** captures its role connecting formal and empirical realms.
      *   **"Dual-Aspect Concept"** emphasizes its simultaneous definitional and empirical character.
      *   **"Foundational Hypothesis/Postulate"** highlights its axiomatic role within a theory that *also* makes a world-claim.
      *   **"Formal Embodiment Operating Under an Empirical Guise"** is more precise but clunky. It emphasizes how the formal definition *stands in for* and *makes claims about* the messy reality.
      *   **"The Convergence-Anchored Explication"** highlights the role evidence like formalism convergence plays in justifying the shift from stipulation to empirical claim.
      *   **Best Recommendation:** **"Bridge Concept with Dual-Aspect Status"** or **"Convergence-Anchored Foundational Hypothesis."** The first is more general, the second highlights the specific type of evidence often invoked.

  6.  **Boundaries: When Does It Become Illegitimate?**
      This double life is **legitimate and often necessary** when:
      *   The formal system is explicitly intended as a model of a real-world phenomenon.
      *   The explication (formal definition) is well-motivated by pre-theoretical understanding and/or convergence arguments.
      *   The empirical claim is acknowledged *as such* and is, in principle, testable (even if only indirectly or by requiring massive theory revision).
      *   Shifts between aspects are done transparently and consistently within the relevant community's methodological stance.

      It **crosses into illegitimacy or confusion** when:
      *   **Ad Hoc Shielding:** The stipulative aspect is used *solely* to immunize the core concept against *any* counter-evidence, without principled justification or acknowledgment of the empirical claim. ("That machine doesn't count as computation because it does something uncomputable, and I define computation as what can't do that.")
      *   **Ignoring the Empirical Burden:** Treating the convergence argument or initial motivation as *conclusive proof* of the empirical thesis, shutting down further empirical inquiry or theoretical alternatives prematurely.
      *   **Inconsistent Application:** Applying the stipulative defense rigorously in one context (against exotic physics) but abandoning it completely in another (asserting brain simulability) without acknowledging the shift or justifying why the empirical claim holds confidently in the second case.
      *   **Lack of Convergence/Motivation:** If the formal definition is arbitrary or lacks strong independent motivation (like the convergence of multiple formalisms), then its use as an empirical claim is poorly founded.
      *   **Misrepresenting the Status:** Presenting the purely stipulative aspect *as if* it were empirical evidence, or vice-versa, in a deceptive way.

  **Conclusion:** You've identified a fundamental feature of how abstract, formal theories connect to the world. The concepts anchoring these theories—like computability, fitness, or the equivalence principle—inherently possess this dual nature: they are *definitions within the theory* that also function as *substantive claims about what the theory applies to*. The "shift" you observe isn't usually bad faith; it's a reflection of navigating this bridge. The legitimacy hinges on transparency, consistency, and the strength of the arguments (like convergence) motivating the bridge in the first place. **"Bridge Concept with Dual-Aspect Status"** best captures this essential, often fruitful, tension at the foundations of science.
