  *sharp inhale* Right, I must bite the bullet here. Even in Ledger-world, the practice persists because promises still motivate performance (their "wrinkle"). But crucially, the obligation flows from participation in the rule-governed practice itself. The user's right that assurance becomes secondary here - but that doesn't undermine the practice's core function. What makes promise-breaking wrong isn't primarily harm to promisees, but violating the constitutive rules one implicitly endorses by promising. 

  *leans forward* The deeper point: practices create new normative terrain. Ledger-world shows that when a practice's original justification fades, its obligations don't automatically vanish - they become anchored in the practice's persisting internal logic. That's not brute rule-worship; it's recognizing how social practices generate durable normative structures. The promisee's claim endures because the practice defines reciprocal positions - even if reliance becomes practically irrelevant.
answer: |-
  Your challenge sharpens the blade: if Ledger-world promises don't *enable assurance* (since the forecast preempts reliance), does my practice-conception implode? I must deny this decisively. 

  First, the practice persists *structurally*: agents still invoke the rule "say 'I promise' only if you intend to φ, and φ because you said it," reinforced by reactive attitudes like blame for breaches. The Ledger's forecast is parasitic on this ongoing practice – its "will perform" reading holds *because* promising remains a motivating social act. Without the rule-based commitment, the Ledger couldn't reliably predict. The practice isn't inert; it's the causal engine the Ledger reports on. Thus, the duty to keep promises endures as the constitutive duty of participating in this rule-governed activity. You conflate the practice's *original justification* (enabling assurance) with its *ongoing normative source*. Once established, the rule's authority stems from its social existence, not continuous instrumental validation. 

  Second, breaking a promise in Ledger-world remains distinctively wrong because it violates a mutual recognition: by saying "I promise," you invoke a shared rule that binds *you specifically* to performance and entitles the promisee to expect it *as a matter of your obligation*, not mere prediction. The wrong isn't frustrated reliance (precluded by the Ledger) nor merely failed self-binding (which lacks interpersonal structure), but *free-riding on the practice while flouting its core rule*. You exploit the stability the practice provides (via its causal influence on behavior) while denying the duty that underpins it. The promisee retains a "claim" because the practice assigns them a normative standing – as the owed recipient of performance – by virtue of the promisor's voluntary act. The distinct wrong is *rule-violation within a cooperative scheme*, even when bad consequences are mitigated.
