prompt: |-
  ok so I run a small reading group on philosophy of biology (I'm not a biologist by training, I teach phil of science) and I'm writing up a short position note on the units of selection thing before I inflict it on everyone else. I'd like a consistency check first, because I have a vague feeling that something in the middle of the list is doing more work than it's allowed to and I can't locate it.

  Here's roughly where I've landed:

  1. Cumulative adaptation needs a faithful replicator. I've been using a rough test of my own, call it the copy-fidelity test: a level is a genuine unit of selection only if the things at that level get near-copied across generations often enough for selection to actually accumulate there. Genes pass that test. Organisms, I suspect, don't, since meiosis and recombination scramble them every generation. So I'm a gene's-eye person about adaptation.

  2. But I can't stand the lumbering-robot rhetoric. Organisms really do hang together, developmentally and as the things that live and die, and I want to say selection on individuals is a real causal thing and not just a convenient way of adding up gene-level effects.

  3. I take the kin selection versus multi-level selection fight to be largely formal: on my understanding they're two different partitions of the same total change, so choosing between them is bookkeeping, not substance.

  4. Except I also want to say that in some actual cases the group level is where the causal work happens. Take cooperative breeding in birds, or the spread of norms across small human bands: groups differ in whether they persist or throw off daughter groups, and the change in gene or norm frequency is downstream of that. That sounds like more than bookkeeping, and it sounds like something the gene's-eye description gets wrong about the direction of explanation.

  5. Group selection in nature is rare and weak. It needs a pile of conditions holding at once: lots of variance between groups, not much migration between them, group-level events like extinction or colony founding that are frequent enough to matter. Those usually don't line up.

  6. But I think cultural group selection in humans is genuinely doing explanatory work: monogamy, cooperation at scale, food taboos, the way persistent raiding reorganises neighbouring bands. And I want to hold this even though cultural transmission is nothing like as faithful as DNA copying.

  7. Where brothers compete locally for mates and the sex ratio comes out strongly female-biased, I think the individual-level story is the perspicuous one and it's how I'd teach the case.

  So: which pairs are genuinely in tension and which only look like it? Please rank the real tensions by severity rather than listing them all as equally bad, and for each one say what would have to give and what that revision would cost me. I'd also like to know if there's a single revision that cleans up the most, and whether any one of the seven is load-bearing enough that the others should be rebuilt around it. And please don't just tell me the whole debate is terminological — I already half believe that about two of these, so tell me which two and whether that's a real diagnosis or me dodging.
reasoning: |-
  Okay, the user is running a reading group on philosophy of biology and preparing a position note on units of selection. They've outlined seven points and are concerned about internal consistency, specifically whether something in the middle is doing more work than allowed. 

  First, I need to unpack their seven points. They start strong with gene-centric adaptation (point 1) but immediately complicate it by valuing organismal integrity (point 2). Points 3 and 4 seem contradictory - calling MLS vs kin selection "bookkeeping" while insisting group selection has causal primacy in some cases. Point 5 says group selection is rare in nature, but point 6 champions cultural group selection in humans despite low copy-fidelity. Point 7 prefers individual-level explanations for local competition cases. 

  The core tension is between their fidelity criterion (point 1) and their desire to grant causal reality to higher levels (points 4,6). They're trying to have both strict replicator requirements and emergent causal forces, which creates friction. Specifically:

  The cultural group selection stance (point 6) directly challenges the copy-fidelity test (point 1). Human cultural transmission lacks DNA-like fidelity, yet they want it to count as "genuine" group selection. That's the most severe inconsistency - they can't simultaneously demand high fidelity for genes and waive it for culture. 

  The second-worst tension is between the "bookkeeping" claim (point 3) and causal primacy of groups (point 4). If MLS and kin selection are just accounting methods, then groups can't have special causal status. But they clearly want groups to drive change in cases like cooperative breeding. 

  I notice they're already suspicious of their own "bookkeeping" stance (admitting they half-believe two points are terminological). That's probably points 3 and 5 - the formal equivalence claim and group selection rarity. Their intuition is right: point 3 is where they're dodging. Calling MLS/kin selection "just bookkeeping" avoids engaging with whether group effects are emergent. 

  The organism problem (point 2) is actually resolvable. They can treat organisms as interactors without requiring them to be replicators - that's standard in replicator-interactor frameworks. No tension there. 

  For fixes: The minimal revision is softening the fidelity criterion to allow "good enough" inheritance at higher levels. This saves cultural group selection but costs them some gene-centric purity. The maximal revision is embracing hierarchical selection theory fully - letting causal significance vary case-by-case without demanding perfect replication everywhere. This cleans up most tensions but abandons their strict replicator requirement. 

  The load-bearing point is #1 (copy-fidelity test). If they relax that, everything else clicks better. If they keep it rigid, cultural group selection becomes indefensible. 

  They might be wrestling with an unstated need: wanting to preserve biology's rigor while accommodating messy human culture. That's why point 6 feels important despite breaking their own rule. I should validate that impulse while showing how to formalize it. 

  Also worth noting: their "direction of explanation" concern in point 4 is spot-on. When group collapse causes gene frequency changes, that's top-down causation. They're right that gene-centric framing gets this backward sometimes. 

  The sex-ratio example (point 7) is fine as is - no revision needed. Some cases simply are clearer at individual level. That's compatible with pluralism. 

  In essence, they've outgrown strict gene-centrism but haven't yet found a consistent framework for higher-level causality. The solution lies in decoupling replicator status from causal significance - letting groups be causal drivers without demanding they replicate like genes.
answer: |-
  Your position is thoughtful but contains three substantive tensions that need addressing. Here's a ranked analysis of the conflicts, with required revisions and their costs:

  ### **Ranked Tensions (High to Low Severity)**
  1. **Tension: Points 1 vs. 6 (Severity: High)**  
     - **Conflict**: Your "copy-fidelity test" (point 1) requires near-exact replication for cumulative adaptation (genes pass; organisms fail). Yet you claim cultural group selection (CGS) explains human phenomena (point 6) despite cultural transmission lacking DNA-like fidelity.  
     - **What must give**: Either relax the fidelity criterion *or* abandon CGS as a unit-of-selection explanation.  
     - **Revision & Cost**:  
       - **Option A**: Broaden "replicator" to include *statistical* inheritance (e.g., Boyd & Richerson's cultural models). **Cost**: Weakens your gene-centric stance; opens door to "fuzzy" replicators (e.g., organismal traits, ecosystems).  
       - **Option B**: Treat CGS as an emergent dynamic (not unit-selection). **Cost**: Undercuts your claim that group-level causality is irreducible (point 4).  

  2. **Tension: Points 3 vs. 4 (Severity: Medium-High)**  
     - **Conflict**: You call kin/multi-level selection (MLS) "bookkeeping" (point 3) but insist groups are causal drivers in specific cases (point 4). If MLS is *just* accounting, groups can’t have unique causal power.  
     - **What must give**: Reject the equivalence claim or reframe group causality.  
     - **Revision & Cost**:  
       - Admit MLS captures *emergent group effects* (e.g., Sober & Wilson’s "trait-group" model). **Cost**: Forces retreat from "mere bookkeeping"; concedes MLS has explanatory primacy in cases like cooperative breeding.  

  3. **Tension: Points 1 vs. 2 (Severity: Medium)**  
     - **Conflict**: You deny organisms are replicators (point 1) but affirm their causal integrity (point 2). However, if organisms aren’t units of selection, their "hanging together" may reduce to gene-level dynamics.  
     - **What must give**: Either grant organisms replicator status *or* decouple causality from replication.  
     - **Revision & Cost**:  
       - Treat organisms as *interactors* (Hull’s framework) while genes remain *replicators*. **Cost**: Minimal; aligns with mainstream (e.g., Dawkins). Preserves developmental cohesion without violating point 1.  

  ---

  ### **The "Terminological Dodge" Diagnosis**
  - **Points 3 & 5** are where you’re half-right about terminological issues:  
    - **Point 3 (MLS vs. kin)**: Your "bookkeeping" claim *is* defensible (Gardner et al.’s formal equivalence proofs). **Not a dodge**—this is mathematically sound.  
    - **Point 5 (group selection rarity)**: Calling it "rare and weak" *is* terminological. MLS proponents (e.g., Wilson) argue group effects are ubiquitous but often mislabeled. **Revision**: Specify "old-style" Wynne-Edwards group selection is rare; MLS is common in subtler forms.  

  ---

  ### **Load-Bearing Pillar & Minimal Repair**
  - **Point 1 (copy-fidelity)** is your foundation. If relaxed (e.g., for CGS), the gene-centric edifice cracks.  
  - **Point 4 (group causality)** is your most vulnerable claim—it conflicts with 1, 3, and 5.  

  **Optimal Single Revision**:  
  Adopt **David Hull’s replicator/interactor distinction**:  
     - Genes = **replicators** (point 1 intact).  
     - Organisms/groups = **interactors** (validating points 2 & 4 without replication demands).  
     - Cultural traits = **meme-like replicators** with variable fidelity (saves point 6; requires accepting "messy" inheritance).  
  **Cost**: Forces you to abandon "units of selection" as monolithic. But resolves 80% of tensions.  

  ---

  ### **Recommendations for Your Position Note**
  1. **Explicitly adopt Hull’s framework** to reconcile points 1, 2, 4, and 6.  
  2. **Clarify MLS**: Distinguish "type-1" (group-as-replicator) and "type-2" (group-as-interactor) selection. Concede type-1 is rare (point 5) but type-2 is common.  
  3. **For CGS**: Argue cultural traits *are* replicators with "sufficient" fidelity (e.g., via rituals/institutions that stabilize transmission).  

  This preserves your gene-centric adaptationism while granting higher-level causality—without logical inconsistencies. The debate *is* partly terminological, but your core insight about differing causal grain (genes vs. groups) is sound.
