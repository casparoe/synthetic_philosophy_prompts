prompt: |-
  Last night I got into a long arguement with a friend about my job and I want it settled properly instead of by whoever talks louder. I'm on the model risk team at a mid-size lender. We review the scoring models that get used for underwriting and for a couple of other things — maybe a dozen to fifteen a year — and I get roughly one analyst-day per model. Whatever I write goes to our counsel and then to the chief risk officer, and it has to end in one of three verdicts: ship, ship with conditions, or don't ship. We can't ask for more data and we usualy couldn't get it anyway. My background is stats, not philosophy, and the people who sign off are a lawyer and a risk guy, so anything I hand them has to survive being read by someone who doesn't know the theory and doesn't want to.

  The argument was this. My friend says: pick one fairness metric, write it into policy, check it, done. I said picking the metric is itself the moral call, and worse, the metrics fight each other — there's that well known result that when the outcome rates differ between two groups you can't have all of calibration-within-group, equal false-positive rates and equal false-negative rates at the same time except in degenerate cases. He said fine, then just pick the one that sounds nicest. We went nowhere, and the honest problem is that I don't have anything I could hand to a new analyst and expect them to reach the same verdict I would.

  So: give me a procedure, not an essay. Questions in a fixed order, what counts as a sufficient answer to each, where the procedure stops with a hard no, and where it hands the decision to a person because the question is one of values rather than facts. I care a lot about which distinctions have to survive the simplification and which can be dropped, because a checklist that tries to keep everything is a checklist nobody runs.

  Three wrinkles that keep coming up and that a generic fairness checklist never handles:

  One, deployment shape. The same kind of model is used as a threshold screen (approve/decline), as a ranking with a fixed budget (we have N slots and hand them to the top N), and as one input a human sees before deciding. I don't think error-rate parity means the same thing in those three, and I think in the fixed-budget case it might not be the right question at all. The procedure needs to branch on this.

  Two, we don't collect race or sex of owners. Group membership is imputed from surname and census tract by a consultant's model, and we know it's noisy — call it right maybe three quarters of the time, and worse for one group than the other. Every parity number I have is therefore measured on estimated groups. I don't know whether that kills the whole exercise or just widens the error bars, and I don't know which direction it biases things.

  Three, the label is a business choice. Default within 18 months, 90+ days past due, first missed payment — these give different models and different fairness numbers, and for applicants we declined we have no repayment outcome at all, so the vendor imputed those. My worry is that some of our numbers are unfalsifiable rather than merely noisy.

  Run the procedure on these three, with numbers:

  BizScore — a term-loan approval screen for small businesses, threshold decision. Label is 90+ days past due within 18 months, with imputed outcomes for the roughly 40 percent of the sample we'd declined. Equal false-negative rates across the two groups hold within a point. Equal false-positive rates don't: among businesses that would have repaid, one group is declined at about twice the rate of the other. Predicted-value parity fails too, and calibration looks fine for one group and not the other. Counsel wants a single number for the exam file.

  HardshipRank — 500 counseling slots, 4,000 eligible customers, score ranks by predicted chance of missing a payment, top 500 get the slot. No threshold anywhere. Fixed pie. I want to know what the procedure even asks here, and I want it to say something about the option of equalizing some parity quantity by withholding help from the highest-scoring people — helping nobody so the spreadsheet looks better — because I think that is what pick a metric and check it quietly licenses.

  AssistScore — shown to a loan officer as one input among several. Officers override around 30 percent of the time, and the overrides cluster by branch. My guess is the right verdict is that we're auditing the wrong object, but I want the procedure to force that verdict rather than me asserting it after the fact.

  Include at least one case where the procedure gives me an answer I don't want — I'd rather see that now than in an exam. And tell me plainly what the procedure can't do: which questions it looks like it answers and doesn't, and where a value call has to be made and signed by a human.
reasoning: |-
  We are designing a procedure for model risk assessment with fairness considerations. The procedure must be:
  - Practical: step-by-step, with clear questions and criteria.
  - Account for deployment shape (threshold, ranking, advisory).
  - Handle imputed group membership and labels.
  - Acknowledge that some choices are value-based and must be decided by humans (counsel and CRO).

  The procedure will have branches based on deployment type. In each branch, we will ask specific questions and require sufficient answers. We will flag when a value judgment is needed.

  Key principles:
  1. We cannot avoid value judgments entirely; selecting fairness criteria involves trade-offs.
  2. We must account for measurement noise due to imputed groups and labels.
  3. We must consider the impact of the model's use (e.g., in ranking, equalizing error rates may not be the goal).

  The procedure outline:

  I. Preconditions (for every model)
     A. Verify that the model's intended use is clearly defined (threshold, ranking, or advisory). If not, stop and require clarification.
     B. Verify that the group definitions (protected attributes) are defined and justified. Since group membership is imputed, note the accuracy and potential biases. If the accuracy is too low (e.g., <70%) or the bias is severe, flag that fairness assessments are highly uncertain.

  II. Deployment-specific branches

  Branch 1: Threshold Model (e.g., BizScore)
     Steps:
     1. Check calibration: Are the predicted probabilities well-calibrated by group? 
        - Sufficient: Calibration curves are close and within confidence bounds accounting for imputation noise. If not, note which group is miscalibrated and the direction.
     2. Check error rate balance: 
        a. Are false negative rates (FNR) similar? 
        b. Are false positive rates (FPR) similar?
        - Sufficient: Both are within a pre-specified tolerance (e.g., 5% relative difference) and accounting for noise. If not, note the disparities.
     3. Check predictive value parity (optional, but if requested):
        - Positive predictive value (PPV) and negative predictive value (NPV) by group.
        - Sufficient: Within tolerance and accounting for noise.

     Decision rules for threshold models:
     - If calibration is bad (e.g., one group is systematically over/under predicted) -> Hard no because the model is not reliable for that group.
     - If both FNR and FPR are balanced -> Ship.
     - If one error rate is balanced but the other is not, and calibration is good -> This is a value judgment: which error rate is more important? Must escalate to human (counsel/CRO) with a clear explanation of the trade-off and the impact (e.g., "FPR disparity means one group is being denied loans at twice the rate when they would have repaid"). The procedure stops and requires a human decision on which parity criterion to prioritize.

     For BizScore:
     - Calibration: one group is fine, the other is not -> Hard no? Let's see: the procedure says if calibration is bad -> hard no. But note: the user said calibration looks fine for one group and not the other. We must define "fine". If the miscalibration is statistically significant and practically meaningful (e.g., predicted risk is 5% but actual is 10% for a group) then it's a hard no. Otherwise, if within noise, proceed.
     - FNR: equal within 1 point -> okay.
     - FPR: one group declined at twice the rate -> not okay.
     - Calibration fails for one group -> hard no. But wait: the user said "calibration looks fine for one group and not the other". We need a clear criterion for calibration. We'll set: calibration is acceptable if the average observed event rate in each predicted risk bin is within a confidence interval (e.g., 95%) of the predicted rate, and the slope is not significantly different from 1. If one group fails, then hard no.

     However, note the label is imputed for declined applicants. This might affect calibration. We must check the reliability of the imputation. If the imputation is known to be biased, then calibration assessment is unreliable. We might need to condition on accepted applicants only? But then we have selection bias. This is a wrinkle.

     Given the complexity, we add a precondition: 
        C. For models with imputed outcomes, the imputation method must be validated and the potential bias assessed. If the bias cannot be quantified or is large, then the fairness assessment is unreliable and the model should not be used for threshold decisions without human oversight (i.e., move to advisory). 

     For BizScore: 
        - Precondition C: The imputation is done by a vendor. We don't know the bias. Therefore, we cannot trust the calibration or error rates. This leads to a hard no? Or do we condition on accepted? But that would be biased. We must flag that the numbers are unfalsifiable. The procedure should require that for threshold models, we must have actual outcomes for a representative sample (including some declined applicants that were approved by override or in a pilot) to assess fairness. Without that, we cannot assess fairness reliably. Therefore, for BizScore: stop and require a plan to collect real outcomes for a sample of declined applicants. Until then, the model cannot be fairly assessed -> don't ship.

     But the user says the vendor imputed the outcomes. We must consider: 
        - If the imputation model itself has been validated and shown to be unbiased, then we can proceed. Otherwise, we cannot.

     We add a step: 
        Precondition D: For any model with imputed outcomes, the imputation model must have been validated for fairness and accuracy on a holdout set with real outcomes. If not, then the fairness assessment is unreliable and the model must be rejected for threshold use.

     Therefore, for BizScore: if the imputation model hasn't been validated, hard no.

  Branch 2: Ranking Model (e.g., HardshipRank)
     Goal: Allocate a fixed resource (slots) to those who need it most. The fairness concern is that the ranking should be equally accurate across groups, and the allocation should not disproportionately exclude one group.

     Steps:
     1. Check ranking quality by group: 
        - Is the model equally well-calibrated by group? (i.e., if we bin the scores, do the observed event rates match the predictions for each group?) If not, the ranking may be biased.
     2. Check the allocation:
        - Without any intervention, what is the proportion of each group in the top N? Compare to their proportion in the eligible population. If the disparity is large (e.g., more than 20% relative difference) and against a protected group, then we must consider fairness interventions.

     However, note: the goal is to help those most in need. We do not want to help nobody to make the numbers look good. The procedure must prevent that.

     We consider two fairness approaches for ranking:
        a. Demographic parity in the selected: The selected group should reflect the population. But that might not be aligned with need.
        b. Equal opportunity: The true positive rate (if we consider the top N as "positive") should be similar across groups. But note: the top N might not be the same as a threshold.

     We propose:
        - The primary goal is to maximize the impact (i.e., help those who are most likely to benefit). Therefore, we should check that the model is equally accurate for both groups (calibration and ranking metrics like AUC by group). If accuracy is similar, then the allocation disparity is due to base rates and is acceptable.

     Steps for ranking:
        1. Check calibration by group. (Same as threshold.)
        2. Check the AUC (or another rank metric) by group. Are they similar? (Within a tolerance, e.g., 0.05 AUC difference.)
        3. If both are similar, then the allocation is fair because it reflects the underlying need. Ship.
        4. If the model is less accurate for one group (e.g., AUC lower by more than 0.05), then the ranking is less reliable for that group. We must then consider: 
            - Can we improve the model for that group? If not, we might need to adjust the ranking to ensure the group is not disproportionately excluded. However, any adjustment must be done in a way that does not harm the overall effectiveness too much. This is a value judgment: how much effectiveness are we willing to sacrifice for fairness? The procedure must escalate to human.

     But note: we must not "withhold help from the highest-scoring people". Therefore, the procedure should explicitly forbid any method that lowers the selection threshold for the sake of a fairness metric if it means excluding higher-risk individuals. Instead, we can:
        - Use a group-aware quota (e.g., select the top k from each group) only if it is legally allowed and if the overall impact is still acceptable (i.e., the average risk of the selected is not much lower). But this is a value and legal judgment.

     For HardshipRank:
        - We are not given numbers. The procedure would:
            Step 1: Check calibration by group. (We don't have the data, but assume it's okay for now.)
            Step 2: Check AUC by group. Suppose AUC is 0.75 for group A and 0.65 for group B. That's a significant difference. Then we must note that the model is less accurate for group B, so they are underrepresented in the top 500. We cannot automatically fix this without harming the goal. We must escalate: 
               - The options are: 
                   a. Do nothing -> then group B gets fewer slots.
                   b. Use a group-specific threshold (select more from group B) to achieve proportional representation, but then we are helping some from group B who are lower risk than some in group A we skip. This reduces overall impact.
               - The trade-off: we would reduce the average risk of the selected (i.e., help people who are less in need) by X% to achieve Y% more representation for group B. This is a value decision for the business and counsel.

     Also note: the procedure must not allow reducing the overall number of slots. It must allocate all slots.

     Step 3: If the accuracy is similar but the allocation is skewed because of base rates, then that's acceptable.

  Branch 3: Advisory Model (e.g., AssistScore)
     The model is one input to a human. We are concerned that the model might be biased and that the human might not correct it (or might introduce their own bias).

     Steps:
        1. Check the model's standalone fairness (like threshold model) as a reference.
        2. Check the human override behavior: 
            - Are overrides happening at similar rates by group? 
            - When the model is overridden, does the human decision lead to better outcomes? And is the improvement similar by group?
        3. Check the final decision fairness: after overrides, are the outcomes (e.g., approval rates, default rates) fair by group?

     However, note: the model is only advisory. The procedure should focus on the final decision, not the model in isolation.

     Therefore, we recommend:
        - The model itself does not need to pass the threshold fairness tests, but the entire process (model + human) must be audited for fairness.

     How to audit the process:
        - We need data on overrides and final outcomes.

     Steps:
        1. Check the final outcome (e.g., approval rate by group). If there is a significant disparity, then we must investigate why.
        2. Check the override rates by group and by model score. If the override rate differs by group for the same model score and same true risk, then there might be human bias. We can check by building a model of override as a function of group, model score, and other features. If group is a significant predictor of override after controlling for the model score and legitimate factors, then there is bias.

     For AssistScore:
        - Overrides cluster by branch, not by group? Then it might be branch policy, not group bias. But we must check if branches have different group compositions. The procedure must require:
            - A regression: override ~ group + model_score + branch + [other relevant features]
            - If group is significant, then there is bias by group in overrides. This must be addressed by training or policy.

     If the final outcome (e.g., default rate by group for approved loans) is fair, then even if the model is biased, the process is working. But if the final outcome is unfair, then we have a problem.

     Therefore, the procedure for advisory models:
        - The model is not the decision, so we don't reject the model for standalone unfairness. Instead, we require:
            a. The process (model + human) must be audited for fairness in the final outcome (e.g., equal approval rates by group if the goal is parity, or equal default rates if the goal is risk-based). The choice of what final outcome fairness means is a value judgment (set by policy).
            b. The override behavior must not introduce group bias (i.e., group should not predict override after controlling for risk and legitimate factors).

        If the final outcome is fair and there is no bias in overrides, then ship.
        If the final outcome is unfair, then we must investigate and fix the process -> don't ship until fixed.
        If there is bias in overrides, then we must fix the human process (training, etc.) -> don't ship until fixed.

  Summary of the procedure:

  I. Preconditions for every model:
     A. Deployment type: threshold, ranking, or advisory? (Must be one.)
     B. Group definition: 
          - State the groups and the imputation method. 
          - If imputation accuracy < 70% or if the imputation model has known bias, issue a warning: "Fairness metrics are unreliable due to group imputation noise. Proceed with caution."
     C. For models with imputed outcomes (for the target variable):
          - Has the imputation model been validated for accuracy and fairness? If not, then for threshold models: hard no. For ranking and advisory, we can proceed but note the unreliability.

  II. Branch by deployment type:

  A. Threshold model (e.g., BizScore):
     1. Calibration by group (must pass): 
          - Check: for each group, calibration curve (or Hosmer-Lemeshow) is not rejected (p>0.05) and the observed vs predicted is within 5% in each bin. 
          - If one group fails: hard no.
     2. Error rates:
          a. FNR difference: |FNR_group1 - FNR_group2| < 5% (absolute) or 20% (relative) of the larger?
          b. FPR difference: similarly.
          - If both pass: ship.
          - If one passes and one fails, and calibration passes: escalate to human with trade-off explanation. The human must choose which error rate to prioritize.
          - If both fail: hard no? Or escalate? We say: if both fail, then the model is unfair by both criteria -> hard no, unless there is a strong business justification (which is a human decision). But the procedure defaults to hard no because the model has multiple fairness issues.

  B. Ranking model (e.g., HardshipRank):
     1. Calibration by group: same as threshold. If fails, then the scores are not comparable across groups -> hard no? Not exactly, because we can still use the ranking within groups. But the absolute meaning is lost. We require calibration to be acceptable (within noise) for the ranking to be meaningful. If not, hard no.
     2. Ranking quality by group: 
          - Check AUC (or AUPRC) by group. |AUC_group1 - AUC_group2| < 0.05?
          - If yes, then check the allocation: 
               - Proportion of group A in top N vs in eligible population. 
               - Disparity: if the relative difference is >20%, then we note it but it is acceptable if due to base rates (which we assume because the model is equally accurate). Ship.
          - If AUC difference >0.05, then the model is less accurate for one group. We must:
               a. Attempt to fix the model (if time allows) or use a different model for that group? 
               b. If not fixable, then we must decide: 
                   - Accept the lower accuracy and the resulting underrepresentation? 
                   - Or adjust the selection to ensure a minimum representation? 
               This is a value decision: we must escalate to human. The procedure stops and requires human input.

     Important: The procedure must not allow reducing the total number of slots. It must allocate all slots.

  C. Advisory model (e.g., AssistScore):
     1. The model itself: if it is extremely biased, it might mislead the officers. So we check standalone:
          - Calibration by group: must pass (if it's miscalibrated, the officer might trust it and make bad decisions). If fails, then we require retraining or don't ship.
          - But note: the officer can override. So we focus on the process.
     2. Process audit:
          - We require data on overrides and final decisions and outcomes.
          - Step 1: Check final approval rate by group. If the disparity is significant and against policy (e.g., policy requires equal approval rates), then fail and require process change.
          - Step 2: Check override behavior: 
               - Build a model: override ~ group + model_score + branch + other features.
               - If group is a significant predictor (p<0.05) and the effect size is meaningful, then there is bias in overrides -> fail and require training/policy change.
          - Step 3: Check outcome fairness (if possible): for approved loans, are default rates similar by group? If not, then the process might be approving riskier loans for one group -> fail.

     If the model fails standalone calibration, then we require the model to be fixed. Otherwise, if the process passes steps 1-3, then ship.

     But note: the user says overrides cluster by branch. We must control for branch in the override model.

     For AssistScore: 
          - If we don't have the data to do the process audit (override and final outcomes by group), then we cannot approve the model -> don't ship until we collect the data.

  III. Where the procedure requires human judgment:
     - When there is a trade-off between error rates (in threshold) and we have to choose which one to prioritize.
     - When the ranking model has unequal accuracy and we have to decide whether to adjust the selection and how.
     - The choice of what constitutes a "fair" final outcome in advisory models (e.g., equal approval rate? equal default rate?) is a policy decision that must be set by the business and legal.

  IV. What the procedure cannot do:
     - It cannot resolve the inherent trade-offs in fairness metrics (like the impossibility result). It forces the user to confront the trade-off and then escalates to a human.
     - It cannot make the value judgments: it only flags when they are needed.
     - It cannot eliminate measurement noise from imputed groups and labels. It can only warn and require higher tolerance.

  Now, run the procedure on the three examples:

  1. BizScore (threshold):
     - Precondition B: Group imputation is 75% accurate. We note: "Fairness metrics are noisy due to group imputation (75% accuracy)."
     - Precondition C: The outcome (90+ days past due) is imputed for declined applicants. The vendor's imputation model has not been validated by us. -> This fails precondition C. Therefore, hard no.

     So the verdict: don't ship.

  2. HardshipRank (ranking):
     - Precondition B: same group imputation -> warning.
     - Precondition C: The outcome (missing a payment) is observed? The user doesn't say it's imputed. We assume observed. So okay.
     - Step 1 (calibration): assume it passes (not given).
     - Step 2 (AUC by group): suppose we have AUC for group A=0.75, group B=0.65 (difference 0.10). 
          -> The model is less accurate for group B. 
          -> We must escalate to human. The options:
              - We can adjust the ranking by group? But we don't have a group-aware model. 
              - We can use a quota? But that requires legal approval and reduces overall impact.
          -> The human must decide: accept the disparity in allocation or use a quota? And if quota, what minimum representation?

     The procedure stops and requires human decision.

  3. AssistScore (advisory):
     - Precondition B: same group imputation -> warning.
     - Precondition C: The outcome (whatever it is) is observed? We assume yes (no imputation for advisory? unclear). 
     - Step 1 (model standalone): we don't have numbers. But the user is worried about auditing the wrong object. The procedure says: we must audit the process, not just the model.
          - We require data on overrides and final outcomes by group. 
          - The user says: overrides cluster by branch. We need to check if this leads to group bias.

          Suppose we run the override model and find that after controlling for model score and branch, group is not a significant predictor. Then no bias in overrides.
          Then we check final approval rate by group: if it is equal (within noise) then ship. But if not, we need to know why.

     However, the user says: "I think we're auditing the wrong object". The procedure forces us to audit the process. If we don't have the data, we cannot ship.

     So verdict: if the data for the process audit is available and passes, ship. Otherwise, don't ship.

  Finally, include a case where the procedure gives an answer I don't want:

  Example: A threshold model with good calibration and balanced FNR but unbalanced FPR. The procedure escalates to human. I might not want to escalate because it's politically sensitive. But the procedure forces the escalation.

  Another: A ranking model with unequal AUC. I might want to just ship it, but the procedure forces me to escalate.

  Therefore, the procedure is designed to force the hard decisions to be made explicitly by the appropriate people.
answer: |-
  Below is a step-by-step fairness assessment procedure tailored to your constraints. It's designed as a fixed-order checklist with clear stopping rules, branches for deployment type, and explicit flags for value judgments. It prioritizes **actionable decisions** over theoretical perfection, drops non-essential distinctions, and addresses your three wrinkles. The procedure outputs one of: **SHIP**, **CONDITIONAL SHIP**, **HARD NO**, or **ESCALATE TO HUMAN** (for value calls).

  ---

  ### **Pre-Assessment Requirements (For All Models)**
  1. **Group Imputation Quality Check**  
     *Question: Is group imputation accuracy ≥70% for all protected groups?*  
     - **YES**: Proceed.  
     - **NO**: Flag: "Fairness metrics have high noise (accuracy <70%)." Still proceed but widen error bars (see Step 3).  
     - *Sufficient Answer*: Vendor documentation of imputation accuracy. If missing, default to 70% but flag as "unverified."  
     - *Stopping Rule*: Never a hard stop here—noise is handled downstream.

  2. **Label Reliability Check**  
     *Question: Are >50% of outcomes observed (not imputed)?*  
     - **YES**: Proceed.  
     - **NO**: Flag: "Label reliability low. Fairness metrics may be unfalsifiable."  
     - *Sufficient Answer*: Data source documentation. Vendor validation report for imputed labels.  
     - *Stopping Rule*: Proceed, but downgrade confidence in metrics (see Step 3).

  ---

  ### **Core Procedure (Branch by Deployment Type)**
  #### **Branch A: Threshold Models (e.g., BizScore)**  
  *Use Case: Binary approve/decline decision.*  
    1. **Calibration Check**  
       *Question: Is the model calibrated within groups (observed vs. predicted default rate within ±3% for all groups)?*  
       - **YES**: Proceed.  
       - **NO**: **HARD NO**. Reasoning: Uncalibrated scores misrepresent risk, making fairness metrics meaningless.  
       - *Sufficient Answer*: Calibration plot or statistical test (e.g., Hosmer-Lemeshow p>0.05).  

    2. **Error Rate Parity Check**  
       *Question: Are false negative rates (FNR) equal across groups (within ±5% absolute)?*  
       - **YES**: Proceed.  
       - **NO**: **ESCALATE TO HUMAN**. Reasoning: FNR parity minimizes "qualified applicants denied." Trade-off with FPR is unavoidable (impossibility theorem). Humans must choose which error to prioritize.  

    3. **Impact Check**  
       *Question: Are false positive rates (FPR) or approval rate disparities >20% relative difference?*  
       - **YES**: Flag: "Disparate impact risk." Proceed to Step 4.  
       - **NO**: **SHIP**.  

    4. **Final Threshold Decision**  
       - If FNR parity holds (Step 2) but FPR disparity exists (e.g., one group declined at 2x the rate):  
         **CONDITIONAL SHIP** with requirement: "Counsel must document a business necessity justification for the FPR disparity."  
       - *Stopping Rule*: Never proceed if calibration fails (Step 1).  

  *Example: BizScore*  
  - Calibration: Fails for one group → **HARD NO**.  
  - Why? Even if other metrics "look okay," uncalibrated scores invalidate all fairness claims.  

  ---

  #### **Branch B: Ranking Models (e.g., HardshipRank)**  
  *Use Case: Fixed-budget allocation (top N get resource).*  
    1. **Ranking Integrity Check**  
       *Question: Does the score correctly rank higher-risk entities above lower-risk (AUC >0.7 within groups)?*  
       - **YES**: Proceed.  
       - **NO**: **HARD NO**. Reasoning: Poor ranking undermines the core purpose of prioritizing need.  

    2. **Allocation Equity Check**  
       *Question: Is the selection rate difference between groups ≤10% absolute?*  
       - **YES**: **SHIP**.  
       - **NO**: Proceed to Step 3.  

    3. **Need-Adjusted Equity Check**  
       *Question: Is the disparity explained by base-rate differences (e.g., group A has 2x default rate of group B)?*  
       - **YES**: **SHIP** with documentation: "Disparity reflects underlying risk differences."  
       - **NO**: **ESCALATE TO HUMAN**. Reasoning: Disproportionate exclusion may require intervention (e.g., group-specific thresholds).  
       - *Critical Flag*: Explicitly reject "equalizing metrics by helping fewer people." Procedure forbids reducing total slots.  

  *Example: HardshipRank*  
  - Allocation disparity not explained by base rates? → **ESCALATE TO HUMAN**.  
  - Value Call: Humans decide between:  
    - (a) Accepting disparity (if ranking is sound),  
    - (b) Allocating slots proportionally (if legally permitted), or  
    - (c) Rejecting the model.  

  ---

  #### **Branch C: Advisory Models (e.g., AssistScore)**  
  *Use Case: Human-in-the-loop decision support.*  
    1. **Override Rate Check**  
       *Question: Is override rate >20%?*  
       - **YES**: Proceed to Step 2 (model fairness is secondary to process).  
       - **NO**: Treat as a threshold model (use Branch A).  

    2. **Process Fairness Check**  
       *Question: Are override rates or final outcomes significantly different by branch or group? (e.g., χ² test p<0.05)*  
       - **YES**: **HARD NO**. Reasoning: Disparate overrides indicate systemic bias in the process, not just the model.  
       - **NO**: **SHIP**.  
       - *Sufficient Answer*: Regression analysis of overrides (controlling for risk score).  

    3. **Model Diagnostic**  
       - If overrides cluster by branch (not group), flag: "Audit branch-level policies, not model."  

  *Example: AssistScore*  
  - Override rate 30% + branch-level clustering → **HARD NO**.  
  - Why? The model isn’t the problem—process inconsistency is. Fix the human workflow first.  

  ---

  ### **Post-Assessment: Reporting & Escalation**
  - **For Counsel/Exam File**: Report one number only if required:  
    - Use **FNR disparity** for threshold models (least legally contested).  
    - Use **selection rate disparity** for ranking models.  
    - *Never* report a fairness metric without context (e.g., "FNR disparity: 1%, but FPR disparity: 90%").  
  - **Value Judgment Escalation**:  
    - When flagged, provide:  
      - Trade-off summary (e.g., "Prioritizing FNR parity increases FPR disparity by X%").  
      - Impact statement (e.g., "This will decline Y more creditworthy applicants from Group Z").  
    - Human (Counsel/CRO) must sign off on the trade-off.  

  ---

  ### **What This Procedure Can't Do**  
  1. **Resolve fairness trade-offs**: It forces humans to choose which metric to prioritize (FNR vs. FPR).  
  2. **Fix data limitations**: Noisy group labels or imputed outcomes widen error bars but don’t invalidate the process—they lower confidence.  
  3. **Guarantee "fairness"**: It detects disparities and flags risks, but fairness is a policy choice, not a statistical output.  
  4. **Replace domain expertise**: Deployment shape (threshold/ranking/advisory) must be correctly identified upfront.  

  ---

  ### **Key Design Choices**  
  - **Dropped Distinctions**:  
    - No complex "fairness definitions" (e.g., demographic parity vs. equality of opportunity). Simplified to error rates/selection rates.  
    - No mathematical optimization. Humans handle trade-offs.  
  - **Kept Distinctions**:  
    - Deployment type (threshold/ranking/advisory) fundamentally changes the assessment.  
    - Calibration is non-negotiable for threshold models.  
    - Ranking models prioritize accuracy over parity.  
  - **Guards Against Gaming**:  
    - Explicitly bans "helping fewer people to improve metrics" (HardshipRank).  
    - Rejects models where process bias dwarfs model bias (AssistScore).  

  This procedure ensures consistency, avoids theoretical debates, and pushes value judgments to accountable humans. Run it during model validation, and require new analysts to follow it verbatim.
