prompt: |-
  I chair the staff recognition committee at a 250-bed community hospital. Every month we pick one person for an "above and beyond" award, and every month it goes the same way: someone tells a story, we all feel something, we vote, and then someone asks why the person who quietly did the same thing last month got nothing. I've started reading about supererogation — acts that go past duty, are praiseworthy if you do them and not blameworthy if you don't — and it looks like exactly the distinction we keep fumbling, but I can't hand a rotating ward manger a philosophy paper.

  What I need is a decision procedure we can actually run: the questions in order, in plain words, what counts as a good enough answer to each, where the answer is a firm no, and where the question stops being factual and has to go to a person as a values call. Constraints: it gets run in about twenty minutes by a manager with no training and no time, HR has to be able to defend the outcome if it's grieved, and the output is a one-paragraph citation, so the reasoning has to survive being written down and read out loud.

  Please build in the things I keep tripping over: that "it was clearly the best thing to do" doesn't by itself make something heroic rather than just your job; that praising something in public seems to turn it into an expectation within a few cycles, so what was optional in March is quietly obligatory by June and the person who doesn't do it gets blamed; and the case where the act was only needed because we understaffed something, where an award feels like it's laundering a duty into a gift. Also: half the time we can't tell what actually happened or why the person did it, and sometimes they did a genuinely good thing and then advertised it all over social media.

  Run the finished procedure on three of our real cases: (1) a nurse who came in unpaid on her day off to sit with a dying patient whose family hadn't arrived yet; (2) a porter who spent two hours of his shift hunting down a mislabelled biopsy sample; (3) a senior healthcare assistant who has covered other people's vacancies almost every week for a year, who everyone wants to honor and who I suspect the procedure will tell us not to. Then be straight with me about where it's going to misfire and where a manager just has to use judgment.
reasoning: |-
  Okay, let me start by putting myself in the user's shoes. They're chairing a staff recognition committee at a community hospital and struggling with their monthly award process. The main issue is that they can't consistently distinguish between actions that are truly "above and beyond" versus those that are just part of someone's job. They've even started reading about supererogation, which tells me they're looking for a theoretical framework but need something practical.

  First, I need to understand their constraints. The procedure has to be quick—around 20 minutes—run by managers with no special training. HR must defend the decision if challenged, and the output is a one-paragraph citation. So clarity and defensibility are key. The user mentioned specific pain points: confusion between heroic acts and job duties, the risk of turning praised actions into new obligations, and the problem of rewarding staff for covering systemic failures like understaffing.

  The user also highlighted cases where the facts are murky, motives are unclear, or someone publicizes their own deed. Plus, there's the case of the healthcare assistant who's been covering vacancies for a year—popular but possibly not qualifying under supererogation. 

  I should structure the decision procedure as a step-by-step checklist. Each step needs clear yes/no answers where possible, and explicit points where human judgment is required. The steps should filter out actions that are mandatory, expected, or addressing systemic issues. 

  For the three cases: 
  1. The nurse coming in unpaid on her day off. This seems supererogatory—voluntary, beyond duty, no personal gain. But I need to check if hospital policy allows unpaid work. 
  2. The porter hunting down a mislabelled sample. Is this problem-solving within his role? If it's a rare, creative solution, maybe it qualifies. But if it's routine troubleshooting, no. 
  3. The assistant covering vacancies. Here, consistent coverage might be seen as expected if it's become routine, even if initially voluntary. The procedure should flag this as addressing a systemic issue.

  I also need to address where the procedure might misfire. For instance, cultural differences in what's seen as voluntary, or cases where actions blend duty and extra effort. Managers will need training to handle gray areas and avoid creating new obligations from praised actions.

  The key is balancing structure with flexibility—clear criteria for most cases, but acknowledging that some decisions require nuanced judgment. The procedure must document reasoning to withstand scrutiny, especially when declining popular nominations.
answer: |-
  Here’s a practical decision procedure designed for your constraints, grounded in supererogation principles but operationalized for quick, defensible decisions. It uses a 5-step filter with clear thresholds:

  **The "Above & Beyond" Decision Tree**  
  *(Run in sequence – a "No" at any step disqualifies the act)*

  1.  **"Was this act *truly voluntary*?"**  
      *   **Good enough answer:** "They chose to do this without being asked, coerced, or under direct order. Saying 'no' wouldn't risk discipline or significant negative consequences."  
      *   **Firm No:** If it was part of scheduled duties, a direct order, or refusal would likely lead to reprimand/job risk (e.g., mandatory overtime, core task expectation).  
      *   **Values Call:** Assessing subtle pressure or "implied obligation" culture. Manager must decide if refusal *truly* carried no penalty (real or perceived).

  2.  **"Is this act *clearly beyond core duties*?"**  
      *   **Good enough answer:** "This is not listed in their job description, competency checklist, or universally expected of *everyone* in that role for basic performance."  
      *   **Firm No:** If it’s a standard expectation of the role (e.g., a porter troubleshooting a delivery issue *within expected methods/timeframe*, a nurse providing comfort *during their shift*).  
      *   **Values Call:** Interpreting vague job descriptions or evolving role norms. "Clearly the best thing to do" ≠ "beyond duty" if it’s inherent to good practice *in that role*.

  3.  **"Was the *primary motivation* verifiably patient care/colleague support (vs. personal gain/recognition)?"**  
      *   **Good enough answer:** Circumstantial evidence strongly suggests patient/colleague welfare was the main driver (e.g., acting in crisis, no obvious personal benefit, known history of selflessness). Social media posting *doesn't automatically disqualify* but raises the bar.  
      *   **Firm No:** Evidence strongly suggests primary motivation was financial reward, avoiding personal blame, or *actively soliciting* this specific award.  
      *   **Values Call:** Interpreting ambiguous motives. Lack of clear evidence ≠ bad motive. Manager weighs context and typical behavior.

  4.  **"Does recognizing this act *risk creating an unhealthy new expectation*?"**  
      *   **Good enough answer:** "This specific act is unlikely to become a *routine* expectation due to its nature (rare circumstance, significant personal cost)."  
      *   **Firm No:** If the act solves a *recurring systemic problem* (e.g., chronic short-staffing, frequent labeling errors). Awarding this would imply staff *should* routinely compensate for system failures.  
      *   **Values Call:** Judging if the act is replicable/needed often enough to become an unspoken obligation. Consider: "If we praise Jane for doing X in March, will Susan feel blamed for *not* doing X in May?"

  5.  **"Did the act involve *significant personal sacrifice* or *exceptional ingenuity/courage*?"**  
      *   **Good enough answer:** Clear evidence of: Substantial personal cost (time, money, emotional energy beyond normal work stress) OR a unique, innovative solution to an unforeseen problem OR demonstrated personal risk/courage.  
      *   **Firm No:** Acts performed comfortably within normal work parameters, using standard procedures, without notable personal cost or risk.  
      *   **Values Call:** Defining "significant sacrifice" for the context (e.g., is 30 mins extra significant? Usually no. 4 hours unpaid? Likely yes). Judging ingenuity/courage level.

  **Output Documentation:**  
  *   Citation must explicitly reference the qualifying elements from Steps 1, 2 & 5 (e.g., "Voluntarily came in on their day off without pay...", "Devised an innovative approach beyond standard procedures...", "Demonstrated exceptional personal courage by...").
  *   If a nomination fails, the reason is documented by the step where it failed (e.g., "Act, while commendable, is considered a core expectation of the role [Step 2]" or "Recognizing this specific act risks creating an unsustainable expectation given ongoing staffing challenges [Step 4]").

  ---

  **Running Your Cases:**

  1.  **Nurse (Unpaid on Day Off):**
      *   **Step 1 (Voluntary):** YES (Day off, unpaid).
      *   **Step 2 (Beyond Duty):** YES (Comfort care is expected *during shift*; dedicated off-duty time is extra).
      *   **Step 3 (Motivation):** YES (Presumed patient comfort).
      *   **Step 4 (New Expectation Risk):** YES (Rare circumstance, significant personal time cost).
      *   **Step 5 (Sacrifice/Ingenuity):** YES (Significant personal time sacrifice).
      *   **OUTCOME: QUALIFIES.** Citation: "...voluntarily sacrificed personal time on their scheduled day off, without compensation, to provide essential comfort and companionship to a vulnerable patient awaiting family, demonstrating exceptional compassion beyond their scheduled duties."

  2.  **Porter (Hunting Biopsy Sample):**
      *   **Step 1 (Voluntary):** YES/NO? *Assume they chose to persist beyond initial quick check.* (Needs context: Was stopping after initial failure an option without blame?).
      *   **Step 2 (Beyond Duty):** CRITICAL. *Is troubleshooting and ensuring correct sample delivery a core duty?* Likely **YES** for basic effort. **Was 2 hours exceptional?** If standard procedure failed and they devised *novel* searches (calling labs, retracing steps creatively), MAYBE YES. If just persistence beyond normal time, likely **NO** (Step 2 Fail).
      *   **Step 3 (Motivation):** YES (Patient care).
      *   **Step 4 (New Expectation):** Depends on *why* mislabeled. If systemic error, awarding risks expectation porters fix labeling failures. If truly rare fluke, lower risk.
      *   **Step 5 (Sacrifice/Ingenuity):** 2 Hours *during shift* is persistence, not necessarily *significant personal sacrifice* unless it caused major disruption. Ingenuity key.
      *   **OUTCOME:** **LIKELY DOES NOT QUALIFY** (Fails Step 2 - likely core expectation to resolve sample issues; may also fail Step 4 if systemic). Manager documents: "Act involved commendable persistence within core job responsibilities to ensure critical sample delivery." *If exceptional ingenuity proven, it might pass Step 2/5.*

  3.  **Senior HCA (Covering Vacancies for a Year):**
      *   **Step 1 (Voluntary):** MAYBE. *Initially* likely YES. After months, does saying "no" carry perceived risk? Culture matters.
      *   **Step 2 (Beyond Duty):** **NO.** Covering vacancies, *especially routinely*, becomes an *expected* part of the role in a flexible team, even if not formally written. Heroism fades with repetition.
      *   **Step 3 (Motivation):** YES (Colleague/patient support).
      *   **Step 4 (New Expectation Risk):** **STRONG NO.** Awarding this *directly* makes covering systemic understaffing an award-worthy expectation. It launders a duty (management to staff adequately) into a gift.
      *   **Step 5 (Sacrifice):** YES (Significant personal burden). *But fails earlier steps.*
      *   **OUTCOME: DOES NOT QUALIFY** (Fails Step 2 and critically fails Step 4). **Manager Action Needed:** This signals a *systemic problem*. Recognition should shift: **1) Address the staffing issue openly. 2) Thank the HCA profoundly *privately* and with tangible rewards (extra PTO, gift card, development opportunity). 3) Consider a distinct, non-supererogatory "Dedication" or "Team Player" award *separate* from "Above & Beyond," awarded sparingly for *sustained* effort without the systemic risk.**

  ---

  **Where It Will Misfire & Requires Judgment:**

  1.  **The "Gray Duty" Zone:** Many healthcare acts blend duty and extra. Steps 2 & 5 rely heavily on the manager's understanding of *reasonable* role expectations and *true* exceptionalism within that context. Training managers on this distinction is crucial.
  2.  **Motivation Murkiness:** Step 3 is inherently subjective. Managers must avoid cynicism but also recognize genuine self-promotion patterns. Focus on the *act's nature* and *typical behavior* of the nominee.
  3.  **Cultural Context:** What's "voluntary" or "expected" can vary by unit culture. A good manager knows their team's norms.
  4.  **The "Near Miss":** An act failing Step 4 (Systemic Issue) might still be truly heroic. The manager must have discretion to say, "This was incredible, BUT awarding it sends the wrong message. We will recognize you privately/another way *and* fix the system."
  5.  **The Unobserved Hero:** Sometimes the best acts are unseen. The procedure relies on *nominated* acts with *some* evidence. Managers should foster a culture where quieter efforts can be surfaced.
  6.  **The "Incremental Hero":** Distinguishing between consistent high performance (which deserves recognition via performance reviews/other programs) and a discrete supererogatory act.

  **Critical Success Factors:**

  *   **Manager Training:** Brief but essential. Focus: Core duties vs. beyond, systemic failure vs. one-off, sacrifice assessment, avoiding expectation creep, documentation. Use examples.
  *   **Transparency:** Explain the *principles* (voluntary, beyond duty, no harm for not doing it, avoids bad expectations) to staff, not just the steps. Publish the criteria.
  *   **Alternative Recognition:** Have robust ways to recognize dedication, years of service, excellent core performance, and teamwork *outside* this specific award. The HCA case screams for this.
  *   **HR Backup:** Ensure HR understands and supports the philosophy and the documented reasoning, especially for non-selections. "Fails Step X due to Y" is defensible.
  *   **Review & Adapt:** Review declined nominations quarterly. Are common themes emerging (e.g., lots of Step 4 fails)? That signals systemic issues needing address.

  This procedure provides structure, defensibility, and clear reasoning for citations. It directly tackles your pain points by embedding the supererogation filter and the risks of expectation creep and rewarding systemic failure. It forces the hard but necessary distinctions between "great at your job" and "truly above and beyond." Judgment is still required, but it's focused on specific, defined questions rather than an amorphous "feeling."
