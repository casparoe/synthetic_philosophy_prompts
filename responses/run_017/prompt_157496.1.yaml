answer: |-
  Below is a 12-question classification quiz designed to pinpoint distinct ethical positions on embryo selection. Each question presents a concrete scenario with 2–4 answer choices. The scoring key maps answer patterns to one of seven core views, flags unoccupied logical combinations, and identifies the critical "splitting" questions. Language is kept accessible (no advanced biology required).

  ---

  ### **Embryo Selection Ethics Quiz**
  *Answer based on your immediate moral intuition. Choose one option per question.*

  1. **Serious Disease Scenario**  
     A couple using IVF has 5 embryos. One carries a gene for *early-onset Huntington's disease* (painful, fatal by age 50). The others are disease-free. Should they avoid the Huntington's embryo?  
     - **A:** Yes, they have a duty to avoid serious suffering.  
     - **B:** No, it's their personal choice.  
     - **C:** No—choosing a different embryo creates a different child, so "harm" doesn't apply.  

  2. **Height/Temperament Scenario**  
     Same couple, but all embryos are healthy. Genetic testing suggests one will likely be taller and calmer than the others. Should they select that embryo?  
     - **A:** Yes—they should aim for the best expected life, even for non-disease traits.  
     - **B:** Only if they want to—no duty beyond health.  
     - **C:** No, traits like height/temperament shouldn't be selected.  

  3. **"Different Child" Scenario**  
     If parents pick Embryo A over Embryo B, a *numerically different child* exists. Does this undermine the idea that picking A "benefits" the child?  
     - **A:** No—you can still compare expected lives.  
     - **B:** Yes—neither child is "harmed" by not being chosen.  

  4. **Editing vs. Selection Scenario**  
     A couple has one embryo with a disease. They can either:  
     - *Edit* it to cure the disease (safe, effective).  
     - *Discard* it and implant a healthy sibling embryo.  
     Is there a moral difference?  
     - **A:** No—outcome matters, not method.  
     - **B:** Yes—editing "fixes" an existing child; discarding rejects one.  
     - **C:** Both are wrong; embryos shouldn’t be altered/selected.  

  5. **Chronotype Scenario**  
     An embryo has a "night owl" gene. In a typical 8am-school world, this causes academic struggle. In a night-shift society, it’s advantageous. The parents live in a standard school district. Should they avoid this embryo?  
     - **A:** Yes—it will likely struggle here.  
     - **B:** No—environments can change, or it’s not a true disorder.  
     - **C:** Never select based on traits like this.  

  6. **Future Generations Scenario**  
     An embryo is healthy but carries a gene that, *if passed to its children*, would cause them serious pain. Should parents avoid this embryo?  
     - **A:** Yes—it reduces future suffering.  
     - **B:** No—only the direct child’s welfare matters.  
     - **C:** No—future people don’t exist yet.  

  7. **Sibling Support Scenario**  
     Parents have an older child with severe autism requiring constant care. They can select a calm-temperament embryo for their next child, creating a calmer home for the sibling. Is this acceptable?  
     - **A:** Yes—it helps the whole family.  
     - **B:** No—selection should only consider the new child’s welfare.  
     - **C:** No—traits shouldn’t be selected for others’ benefit.  

  8. **Deaf Culture Scenario**  
     A Deaf couple using IVF wants to select a deaf embryo to share their language/culture. Hearing embryos are available. Is this okay?  
     - **A:** Yes—their choice, their culture.  
     - **B:** No—deafness is a disability; they owe the child hearing.  
     - **C:** No—it insults existing deaf people by treating deafness as desirable.  

  9. **Subsidy Scenario**  
     Should taxes fund free embryo screening for serious diseases *without requiring* parents to use it?  
     - **A:** Yes—prevents suffering fairly.  
     - **B:** No—government shouldn’t promote selection.  
     - **C:** Only for life-threatening conditions.  

  10. **Mandate Scenario**  
      Should parents using IVF be *required* to avoid serious early-onset diseases (if healthy embryos exist)?  
      - **A:** Yes—minimal duty to prevent severe harm.  
      - **B:** No—even for disease, choice is personal.  
      - **C:** Only if the child’s life would be unbearable.  

  11. **"Same Child" Scenario (CRITICAL SPLITTER)**  
      Imagine parents can choose between two futures for the *exact same child*: one with a serious disease, one without. They can choose the healthy future at no cost. Must they?  
      - **A:** Yes—clear duty to prevent harm.  
      - **B:** No—still their choice.  

  12. **Enhancement Editing Scenario**  
      Parents have one healthy embryo. They can safely edit genes to boost IQ. Should they?  
      - **A:** Yes—if it improves life.  
      - **B:** No—editing for non-disease traits is unethical.  
      - **C:** No—no editing at all.  

  ---

  ### **Scoring Key**  
  Match answers to these core views. **Bolded questions** are critical splitters. Views are mutually exclusive.  

  | View                          | Defining Answers                                                                 | Notes                                                                 |
  |-------------------------------|----------------------------------------------------------------------------------|-----------------------------------------------------------------------|
  | **1. Strong Maximizing Duty** | 1A, 2A, 3A, 5A, 6A, 7A, 8B, 11A, 12A                                            | Duty to pick the best life, including beyond disease.                |
  | **2. Threshold Duty**         | 1A, 2B/C, 3A, 5A/B, 6B, 7B, 8B, 11A, 12B                                        | Duty to avoid serious disease only. Stops at enhancement.            |
  | **3. Pure Parental Discretion** | 1B, 2B, 3B, 5B, 6B, 7A/B, 8A, 11B, 12B                                          | No duty. Parents choose freely.                                      |
  | **4. Nobody-Is-Helped View**  | **1B/1C**, **3B**, 5B, 6C, 7B, 8A, **11A**                                      | Different child = no "benefit." **Q11 splits this from Pure Discretion**. |
  | **5. Insult-to-Existing-People** | 1A/B, 2C, 3A/B, 5C, 6B, 7C, **8C**, 11A/B, 12B/C                              | Focus: selecting against traits insults those with them.             |
  | **6. Kids-Shouldn’t-Be-Designed** | **1C**, **2C**, **4C**, **5C**, **8C**, **10B/C**, **12C**                     | Rejects all selection/editing as unethical.                          |
  | **7. State Involvement Split** | *Subsidy:* 9A (Yes) vs. 9B (No) / *Mandate:* 10A (Yes) vs. 10B (No)             | Applies to views 1–5. Not a standalone leaf.                         |

  ---

  ### **Logical Notes**  
  - **Unoccupied Combinations**:  
    - *Maximizing + Insult* (e.g., 2A + 8C): Incoherent—maximizing rejects trait-based "insult" arguments.  
    - *Threshold + Future Generations Duty* (e.g., 1A + 6A): Rare—threshold usually prioritizes direct harm.  
  - **Key Splitters**:  
    - **Q3 + Q11**: Separates *Nobody-Is-Helped* (3B + 11A) from *Pure Discretion* (3B + 11B).  
    - **Q8**: Isolates *Insult* view (8C).  
    - **Q1 + Q2**: Splits *Maximizing* (1A + 2A) from *Threshold* (1A + 2B/C).  
  - **State Involvement**: Add to any view (e.g., "Threshold Duty + Supports Subsidy").  

  This quiz forces distinctions using concrete cases and avoids label-based reasoning. Use it to break debate deadlocks!
