  We are building a classification instrument (quiz) with 10-12 questions. Each question is a concrete scenario with 2-3 answer choices. The goal is to map answer patterns onto distinct positions (leaves) in the bioethical debate on embryo selection.

  The leaves (positions) we want to cover:
  1. Strong maximizing duty (select the embryo with the best expected life, including beyond disease into traits like height or temperament)
  2. Threshold duty (only avoid serious disease, stop there)
  3. Pure parental discretion (no duty, parents choose freely)
  4. Nobody-is-helped view (since a different child comes into existence, there's no benefit to compare)
  5. Insult-to-existing-people objection (selecting against a trait is insulting to people who have it)
  6. Kids-shouldn't-be-designed view (against any form of selection/design)
  7. Split over state involvement (we'll capture this via questions about who pays/decides, but note that state involvement might be a separate dimension)

  Additionally, we'll note:
  - Questions that split key distinctions (e.g., between "nobody-is-helped" and "pure discretion")
  - Unattractive or unexplored combinations

  We have specific cases to include. Let's design the questions accordingly.

  Key splitting questions (as per user request):
  1. Is there a duty at all? (vs. only permission)
  2. Does the duty stop at disease or extend to enhancement?
  3. Does the fact that a different embryo means a different child undermine the benefit story?
  4. Does it matter if we are selecting among embryos vs. editing one?
  5. Can we select for someone else's sake?
  6. Is selecting against a trait insulting to existing people?
  7. Who decides and who pays? (for state involvement split)

  We'll design scenarios that force these splits.

  Let's create the quiz:

  Question 1: Duty vs. Permission (and existence of duty at all)
  Scenario: A couple using IVF has several embryos. One embryo has a genetic variant that causes a serious, early-onset disease (like cystic fibrosis) that would cause significant suffering and shorten life. The other embryos are free of this disease. What should the couple do?
  A) They are morally required to choose an embryo without the disease. (duty exists)
  B) They are allowed to choose any embryo, including the one with the disease, if they have their reasons. (no duty, permission only)
  C) They should not choose any embryo based on genetic traits; that's playing God. (against design)

  Question 2: Threshold vs. Enhancement (where duty stops)
  Scenario: A couple has two embryos without any known disease. One embryo, based on genetic markers, is expected to have a higher chance of being taller and having a calmer temperament. The other is expected to be of average height and temperament. What should the couple do?
  A) They should choose the one with the best expected life (taller and calmer) because it gives the child a better chance. (maximizing)
  B) They can choose either because neither has a disease; it's up to them. (threshold: duty stops at disease)
  C) They should not choose based on such traits; it's wrong to design children for non-medical reasons. (against non-disease design)

  Question 3: Different Child Problem (does benefit exist?)
  Scenario: Imagine a couple has two embryos. If they choose Embryo A, the child will have a higher expected quality of life (e.g., no disease, better traits). If they choose Embryo B, the child will have a lower expected quality of life. But note: Embryo A and Embryo B would become different people. Does the couple have a moral reason to choose Embryo A?
  A) Yes, because Embryo A's life is expected to be better. (benefit exists despite different child)
  B) No, because you can't say Embryo A is better off by being chosen; without being chosen, that child wouldn't exist. The couple can choose either without moral failing. (nobody-is-helped)
  C) The couple should not be making such choices at all. (against design)

  Question 4: Selecting for Others' Sake
  Scenario: A family has an older child with severe behavioral issues (like severe autism) that cause constant chaos and stress at home. The parents are doing IVF and have two embryos. One is expected to have a very calm temperament, the other a more average one. They believe the calm child would create a more stable environment for the older sibling. Should they choose the calm embryo for the sake of the existing child?
  A) Yes, if it helps the whole family, that's a valid reason. (can select for others)
  B) No, the choice should be based only on what's best for the future child, not for others. (only child's interest)
  C) They shouldn't choose any embryo based on temperament; that's wrong. (against design)

  Question 5: Deaf Culture Case (and insult objection)
  Scenario: A Deaf couple using IVF wants to select an embryo that is likely to be deaf, so the child can share their culture and language. Is this acceptable?
  A) Yes, it's their choice and their culture. (parental discretion or cultural right)
  B) No, because being deaf is a disability and they are harming the child by not giving it the chance to hear. (threshold or maximizing: avoid disability)
  C) No, because it sends a message that deaf people are less valuable, which is insulting to existing deaf people. (insult objection)
  D) They shouldn't be selecting embryos at all. (against design)

  Note: We have 4 options here. We can note that C is the insult objection.

  Question 6: Gene Editing vs. Selection
  Scenario: A couple has one embryo with a genetic disease. They can either:
     Option 1: Edit the embryo's genes to remove the disease (safe and effective).
     Option 2: Discard this embryo and choose a different one that doesn't have the disease (if available).
  Is there a moral difference between these two?
  A) No, both result in a child without the disease. It doesn't matter how you get there. (no difference)
  B) Yes, editing is more like fixing the child you have, and selecting is choosing a different child. Editing is better because it doesn't involve discarding. (editing preferred)
  C) Yes, selecting among embryos is acceptable, but editing is playing God and should be avoided. (selection only)
  D) Both are wrong. (against design)

  Question 7: Chronotype Case (environment-dependent trait)
  Scenario: An embryo has a genetic variant that would make the child a "night owl" (delayed sleep phase syndrome). This would cause major problems in a typical 8am-start school but could be an advantage in a night-shift career. The parents live in a rural area with no night jobs and the school starts at 8am. Should they avoid this embryo?
  A) Yes, because in the current environment, it would cause problems for the child. (context matters, avoid)
  B) No, because the trait isn't inherently bad and might be an advantage in a different environment. Also, environments can change. (do not avoid)
  C) They shouldn't choose based on such traits at all. (against design)

  Question 8: Trait with Future Generational Impact
  Scenario: An embryo has a genetic variant that doesn't affect the child's health directly, but if the child grows up and has their own children, those children would have a higher chance of a serious disease. Should the parents avoid this embryo?
  A) Yes, because it would lead to harm in the next generation. (consider future impact)
  B) No, because the embryo itself is healthy, and we can't predict what the future child will do (they might not have children, or technology might fix the problem). (only direct impact on the child)
  C) They shouldn't be selecting embryos at all. (against design)

  Question 9: State Involvement - Subsidy
  Scenario: The government is considering offering free genetic screening and embryo selection for serious diseases to all couples doing IVF. This would be paid by taxes. Do you support this?
  A) Yes, it helps prevent serious suffering and is a good use of resources. (state should support)
  B) No, the government should not be involved in such decisions, even if it's just offering a service. (state should not be involved)
  C) Only if it's limited to serious diseases, not for enhancement. (threshold with state support)
  D) No, because it encourages embryo selection which is wrong. (against design)

  Question 10: State Involvement - Mandate
  Scenario: Suppose a law is proposed that would require couples using IVF to select against embryos with serious, early-onset diseases (if a healthy embryo is available). Would you support this?
  A) Yes, it's a basic duty to prevent serious suffering. (mandate for disease)
  B) No, even for diseases, the government should not force such choices. (against mandate)
  C) Only if the disease is very severe and the child would have a life not worth living; otherwise, no. (narrow mandate)
  D) No, because any selection is wrong. (against design)

  Question 11: The "Same Child" Scenario (to split nobody-helped vs. pure discretion)
  Scenario: Imagine a magical scenario where a couple can choose between two possible futures for the same child (the same numeric identity): one where the child has a serious disease and one where the child does not. They can choose the healthy future at no cost. Do they have a moral duty to choose the healthy future?
  A) Yes, absolutely. (duty exists when same child)
  B) No, it's still their choice. (pure discretion even when same child)
  C) They shouldn't be interfering with nature. (against design)

  Note: This question is designed to separate the "nobody-helped" view (which would say in the typical case there's no duty because it's a different child, but here they might say there is a duty) from the "pure discretion" view (which would say no duty even when same child). Also, the "against design" would say C.

  Question 12: Editing for Enhancement
  Scenario: A couple has one embryo. They can edit it to increase the child's expected height and intelligence (safely). Should they?
  A) Yes, if it gives the child a better life. (maximizing)
  B) No, because these are enhancements, not necessary for health. (threshold)
  C) No, because editing for non-disease traits is playing God. (against non-disease design)
  D) They shouldn't edit at all, even for disease. (against any editing)

