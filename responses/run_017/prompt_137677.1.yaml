  We are constructing a two-page independent study proposal. The core idea is to investigate the robustness and significance of the common prior assumption (CPA) in light of state space inflation. The student suspects that by inflating the state space (adding or splitting states that carry negligible probability), one can always explain any observed disagreement as consistent with a common prior. This would challenge the CPA's status as a substantive rationality constraint. The proposal will focus on a minimal state space requirement (only including distinctions expressible in the agents' disagreement vocabulary) to see if the CPA retains content under this restriction.

  Key elements to cover:
  1. **Introduction and Motivation**: Start with the Thanksgiving anecdote and the standard result (no disagreement with common prior and common knowledge of posteriors). Then challenge it by noting the state space is chosen by the modeler. The suspicion: CPA might be unfalsifiable via state space inflation.

  2. **Core Question**: Under a minimal state space (only distinctions expressible in the agents' actual disagreement), does the existence of a common prior have testable implications? Specifically, we want to know if the no-bet conditions (which are equivalent to CPA in the standard setting) remain invariant under state space inflation. If they do, then CPA might still have bite; if not, then it might be trivial.

  3. **Extension to Disagreements about the Possibility Space**: Consider cases where agents disagree about what is possible (e.g., theist vs. atheist). How does the minimal state space handle this? We may need a more expressive framework.

  4. **Philosophical Significance**: Why is this a philosopher's project? It touches on the nature of rationality, the role of modeling conventions, and the epistemology of disagreement. We want to pull apart two roles of CPA: as a blame assignment tool (who is irrational?) vs. as a requirement for a complete explanation of disagreement.

  5. **Plan of Work**:
     - Month 1: Literature review on CPA, state space modeling, and the no-trade theorems (to understand the equivalence between CPA and no-bet conditions).
     - Month 2: Formalize the state space inflation idea and seek a clean version of the inflation result (if it exists in the literature, or prove it). Key texts: Aumann's agreement theorem, Harsanyi's games with incomplete information, and perhaps recent work on coarse reasoning or unawareness.
     - Month 3: Define the minimal state space requirement and investigate the properties of CPA under this restriction. Check invariance of no-bet conditions.
     - Month 4: Extend to disagreements about the possibility space (ontological disagreements). Consider using a modal framework or a more expressive state space.
     - Month 5: Draft the paper, focusing on the philosophical implications (the two roles of CPA and the critique of its use in rationality arguments).
     - Month 6: Revise and finalize.

  6. **Failure Conditions**: 
     - If the no-bet conditions are invariant under state space inflation (so that they hold only when the minimal space already admits a common prior), then the inflation maneuver doesn't trivialize CPA and the main suspicion is false. The project becomes a footnote.
     - If the minimal state space requirement is too vague to formalize, or if the literature already has a similar restriction that resolves the issue, then the project might not yield novel insights.

  Structure the proposal as follows:

  **Title**: The Common Prior Assumption: Robustness, Minimality, and the Limits of Rational Disagreement

  **Introduction** (1 paragraph): 
    - Start with the anecdote and the standard result. 
