    - What if the disagreement is about what is possible? 
    - Pull apart the two roles of CPA: blame assignment vs. explanatory requirement.

  **Methodology and Plan** (1-2 paragraphs):
    - Use tools from interactive epistemology and decision theory. 
    - Step-by-step plan over six months (as above). 
    - Expected outcomes: a formal result on the inflation hypothesis, a characterization of CPA on minimal spaces, and a philosophical analysis of its significance.

  **Significance and Broader Implications** (1 paragraph):
    - Why philosophy? The project challenges the foundations of rational disagreement and the role of modeling in philosophy and economics. It questions whether CPA is a substantive constraint or a convention. 
