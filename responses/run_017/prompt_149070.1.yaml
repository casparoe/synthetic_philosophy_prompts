  Hi — please act as a professional philosopher who works on decision theory (the Newcomb's problem / evidential vs. causal expected utility literature) and think carefully before answering: start with a short brainstorm in which you list which of my claims you think are wrong, then work through the arithmetic explicitly, then give me the actual answer.

  I'm in a small reading group on decision theory and we did Death in Damascus this week, and I think I've found a hole in the standard story but I can't tell whether I've just misunderstood something basic. The setup as I understood it: I'm in Damascus, Death turns up and says he'll come for me tomorrow; he's a very reliable but not perfect predictor of where I'll be (call it 90%), and he's already written tomorrow's location in his appointment book, so my deciding to leave can't causally change where he'll be. He's standing right here in Damascus today, so I put about 90% on his being in Damascus tomorrow. Utilities: dying is 0 either way, surviving in Damascus is 10, surviving in Aleppo is 9 (the trip is a hassle).

  Everyone keeps saying the case shows that evidential decision theory is "unstable" here — that whatever it recommends, you'd rather do the other thing. But when I actually run the numbers, EDT says stay: EU(stay) = 0.1 × 10 = 1, EU(flee) = 0.1 × 9 = 0.9, so staying wins by EDT's own lights and the theory has a perfectly determinate recommendation. So isn't staying ratifiable, pretty much by definition? And if it is, what is the instability supposed to consist in — is the real complaint just that EDT does worse in outcomes than CDT does (CDT says flee, and fleeing gets me roughly 90% survival against 10% if I stay), and if so isn't this just Newcomb's problem with the signs flipped, with all the "instability" talk a red herring? Also, my flatmate says I could just fix it by flipping a weighted coin, but I dont see how that helps if Death can predict how the coin lands.

  Two more things: please seperate out which of my premises are mistaken before you answer the question I'm asking, and please be explicit about which probabilities go into the CDT calculation, because I have a nagging feeling I'm smuggling in that 90% twice. I'd definately rather get the structure right than be told what to do in Damascus.
