answer: |-
  ### Brainstorm: Identifying Potential Misconceptions  
  Here's where I suspect your reasoning might diverge from standard analyses, based on your description:  
  1. **Misconception: EDT's recommendation is "ratifiable"**  
     You assume that because EDT prefers *stay* pre-decision, you wouldn't regret it post-decision. But ratifiability requires that *after choosing* an act, you still prefer it over alternatives. EDT fails this here.  
  2. **Misconception: Instability = just worse outcomes**  
     The instability isn't merely that EDT gets worse results than CDT. It's that **EDT's recommendation self-undermines**: whichever act it picks, you *retrospectively wish* you'd chosen the other.  
  3. **Overlooked asymmetry in probabilities**  
     You're implicitly using the *same* 90% probability for both acts in both theories. But CDT *ignores* evidential correlations (e.g., P(Death in Damascus | you flee) ≠ 90% for CDT).  
  4. **Coin-flip "solution"**  
     Your flatmate's suggestion fails if Death predicts the coin (as you note), but even with randomness, EDT *still* recommends instability.  

  ---

  ### Explicit Arithmetic: EDT vs. CDT  
  #### Key Probabilities (Death is a 90% predictor):  
  - Let **D** = Death in Damascus tomorrow, **A** = Death in Aleppo.  
  - P(D | you stay) = 0.9, P(A | you stay) = 0.1  
  - P(D | you flee) = 0.1, P(A | you flee) = 0.9  
  - **Causal structure**: Your choice doesn't *cause* Death's location. Death's book is already written.  

  #### 1. Evidential Decision Theory (EDT)  
  EDT uses **conditional probabilities** (evidence about Death's location *given* your act).  

  - **EU(stay)** = P(D | stay) × U(die) + P(A | stay) × U(survive in Damascus)  
    = (0.9 × 0) + (0.1 × 10) = **1**  
  - **EU(flee)** = P(D | flee) × U(survive in Aleppo) + P(A | flee) × U(die)  
    = (0.1 × 9) + (0.9 × 0) = **0.9**  

  → **EDT recommends: STAY** (as you calculated).  

  #### 2. Causal Decision Theory (CDT)  
  CDT uses **causal probabilities**: it considers only how your act *affects* outcomes, ignoring evidential links. Since your choice doesn't *cause* Death's location:  
  - P(D | do(stay)) = P(D) [base rate]  
  - P(D | do(flee)) = P(D) [base rate]  

  **But what is P(D)?** This is critical! CDT requires the *base rate* of Death being in Damascus. The problem doesn't state it, but standard analyses assume:  
  - Death's prediction is 90% accurate *regardless of where you go*.  
  - Symmetry: P(you stay) = P(you flee) absent other info → **P(D) = 0.5** (equally likely Death is in either city *a priori*).  

  Now calculate:  
  - **EU_CDT(stay)** = P(D | do(stay)) × 0 + P(A | do(stay)) × 10  
    = P(D) × 0 + P(A) × 10 = (0.5 × 0) + (0.5 × 10) = **5**  
  - **EU_CDT(flee)** = P(D | do(flee)) × 9 + P(A | do(flee)) × 0  
    = P(D) × 9 + P(A) × 0 = (0.5 × 9) + (0.5 × 0) = **4.5**  

  → **CDT recommends: STAY**? Wait, this contradicts your claim! But read on—this is where your intuition about "smuggling probabilities" hits the mark.  

  #### The Missing Piece: CDT with Realistic Base Rates  
  Your nagging feeling is correct. **CDT doesn't use the 90% evidential correlation.** Instead:  
  - If you *believe* Death is 90% reliable and you initially favor staying, P(D) isn't 0.5!  
  - CDT must use your *prior* belief about Death's location *before deciding*. Death is standing in Damascus *today*, so:  
    **Your prior: P(D) ≈ 0.9** (since Death is likely where he is now).  

  Recalculate CDT with P(D) = 0.9:  
  - **EU_CDT(stay)** = P(D) × 0 + P(A) × 10 = (0.9 × 0) + (0.1 × 10) = **1**  
  - **EU_CDT(flee)** = P(D) × 9 + P(A) × 0 = (0.9 × 9) + (0.1 × 0) = **8.1**  

  → **CDT now recommends: FLEE** (since 8.1 > 1).  

  **Why this switch?**  
  - CDT ignores the evidential link between "I flee" and "Death is likely in Aleppo."  
  - It only cares: "If I flee, I get 9 if Death is in Damascus (90% likely), and 0 otherwise."  

  ---

  ### The "Instability" in EDT Explained  
  EDT says **stay**, but consider your perspective *after* staying:  
  - You're in Damascus. Given that you stayed, P(D | stay) = 0.9 → you expect Death with 90% probability.  
  - Your survival utility is 10 × 0.1 = 1.  
  - **But if you *had* fled**, P(A | flee) = 0.9 → you'd expect 9 × 0.1 = 0.9? **No!**  
    Once you've *stayed*, the *counterfactual* "if I fled" implies:  
    - P(Death in Aleppo | you fled) = 0.9 → so EU_retrospective(fled) = 0.9 × 9 = 8.1!  

  Thus: **After staying, you wish you had fled** (since 8.1 > 1). Similarly, if EDT told you to flee:  
  - Post-fleeing, P(A | flee) = 0.9 → EU(survive) = 9 × 0.1 = 0.9?  
  - But retrospectively, EU_retrospective(stayed) = P(D | stay) = 0.1 chance of survival → 0.1 × 10 = 1 > 0.9.  
    So **after fleeing, you wish you had stayed**.  

  This is the **instability**: EDT's recommended act *always* leads to regret upon implementation. CDT avoids this because its recommendations *are* ratifiable.  

  ---

  ### Answering Your Questions  
  1. **"Isn't staying ratifiable for EDT?"**  
     **No.** Ratifiability means: *after choosing to stay*, you prefer having chosen stay over flee. But as shown above, post-stay, you compute higher EU for fleeing (8.1 > 1). EDT fails ratifiability.  

  2. **"Is the instability just about EDT underperforming?"**  
     **No.** Underperformance (EDT gets 10% survival vs. CDT's 90%) is separate. The instability is a *logical flaw*: EDT's recommendation induces regret regardless of the chosen act. Death in Damascus is a *stronger* critique than Newcomb's because of this cyclical regret.  

  3. **"What about the coin flip?"**  
     Suppose you flip a fair coin: flee if heads, stay if tails.  
     - Death predicts the coin → accuracy remains 90%.  
     - EDT calculates:  
       - EU(stay) = P(Death here | stay) × 10 = [P(Death | stay)] × 10 = 0.1 × 10 = 1  
       - EU(flee) = P(Death elsewhere | flee) × 9 = 0.1 × 9 = 0.9  
       - EU(coin) = 0.5 × EU(stay) + 0.5 × EU(flee) = 0.95  
     → **EDT still prefers staying pure** (1 > 0.95). Randomizing doesn't resolve instability.  

  4. **CDT probabilities clarified:**  
     - You must use **causal base rates** (here, P(D) = 0.9 based on Death's current location).  
     - CDT *discards* the evidential correlation (e.g., "fleeing suggests Death is elsewhere") because it's non-causal.  

  ### The Hole You Found: A Insightful Near-Miss  
  You correctly saw that EDT *does* deterministically recommend staying. But the "hole" isn't in the standard story—it's that ratifiability is evaluated *post-decision*, not pre-decision. Your intuition about P(D) in CDT was sharp: using the evidential 90% in CDT *is* a mistake. The deeper takeaway: **EDT's flaw isn't that it hesitates—it's that it regrets its own choices.**  

  ###### Final note: In philosophy, this "regret" property is sometimes called *self-undermining choice* or *dynamic inconsistency in static decisions*. Key sources: Sobel (1994), Egan (2007).
