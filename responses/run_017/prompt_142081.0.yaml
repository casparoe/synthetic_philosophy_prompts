answer: |-
  Here’s a comprehensive exam question, model answer, and marking scheme designed to meet your specifications, forcing students to engage deeply with the "diagnosis vs. redescription" crux and theoretical trade-offs.

  **Essay Question (45 minutes, 25 marks):**  
  > **Analyse the following four semantic phenomena using a *single* theory of truth (Tarski-style hierarchy, Kripkean fixed point with strong Kleene, dialetheism/LP, or revision theory) of your choice. For each phenomenon, explain how your chosen theory diagnoses it and whether this diagnosis meaningfully *solves* the problem or merely *redescribes* it as "ungrounded," "defective," or "lacking a classical fixed point." Crucially, articulate what your theory sacrifices (e.g., classical logic, unrestricted T-schema, expressibility of its own semantics) to achieve this diagnosis. Cases:**  
  > 1.  **The Liar (L):** "This sentence is not true."  
  > 2.  **Bi-infinite Chain (C):** Sentences indexed by integers: ∀n (Sₙ : "Sₙ₊₁ is not true").  
  > 3.  **Truth-Teller (T):** "This sentence is true."  
  > 4.  **Yablo Sequence (Y):** Sentences indexed by natural numbers: ∀n (Sₙ : "∀k>n, Sₖ is not true").  
  > *Your analysis must demonstrate how your chosen theory provides a unified account. Merely labelling all cases "ungrounded" is insufficient; you must explain what this means within your framework and why it constitutes a solution rather than a restatement.*

  **Model Answer (Using Kripkean Fixed Points with Strong Kleene, ~700 words):**  

  Kripke’s fixed point theory with strong Kleene semantics diagnoses all four cases as "ungrounded," meaning they lack a *classical truth-value* (True/False) in any consistent fixed point. Crucially, however, this diagnosis is not *merely* a redescription; it provides a formal model explaining *why* these sentences resist classical valuation while preserving consistency and the T-schema *within the grounded language fragment*.

  1.  **The Liar (L):** L asserts its own untruth. Kripke’s construction shows L cannot be consistently assigned True or False. If True, it must be False (by what it says), and vice versa. It stabilizes as *undefined* in the minimal fixed point. This is a solution because it formally demonstrates that L’s paradoxicality stems from its *unstable* presuppositions—it cannot "ground" its truth in non-semantic facts. Calling it "ungrounded" *explains* its pathology via the fixed point model’s inductive hierarchy, contrasting it with grounded sentences.

  2.  **Bi-infinite Chain (C):** Although classical alternating models exist (e.g., Sₙ = True iff n even), Kripke’s minimal fixed point leaves *all* Sₙ undefined. Crucially, this isn’t a redescription but a *rejection* of classical solutions lacking a foundation. Kripke requires truth to be *built up* inductively from non-semantic facts. C has no such starting point; every Sₙ’s truth depends on another Sₘ, creating an infinite regress of unsecured dependencies. While classical logic allows conventional assignments, Kripke diagnoses a *procedural defect*: no sentence in C can receive its truth-value through a well-founded process grounded in the world. "Ungrounded" here means *procedurally indeterminate* within a constructive truth definition, not merely classically underdetermined.

  3.  **Truth-Teller (T):** T consistently declares itself true. Kripke allows three fixed points: T=True, T=False, T=Undefined. The minimal fixed point leaves T undefined. "Ungrounded" here signifies *underdetermination* due to lacking factual content. While not paradoxical, T’s truth-value isn’t *fixed* by non-semantic reality. Labelling it "ungrounded" solves the problem by explaining *why* it lacks a determinate truth-value despite consistency: it is semantically vacuous, offering no basis for its assertion. This distinguishes it from grounded contingencies like "Snow is white."

  4.  **Yablo Sequence (Y):** Yablo’s paradox involves no direct self-reference, yet Kripke’s minimal fixed point leaves all Sₙ undefined. Each Sₙ’s truth depends on the status of infinitely many later sentences, creating a non-wellfounded dependence preventing any Sₙ from being grounded in base facts. "Ungrounded" diagnoses a *structural pathology* akin to Liar-like instability, formalized by the fixed point’s failure to assign a value. It solves the problem by extending the grounding requirement beyond circularity to include non-circular infinite descents, showing Y’s pathology stems from its *global structure* rather than local self-reference.

  **Sacrifices & Solution Goals:**  
  Kripke sacrifices classical bivalence and the unrestricted T-schema. Ungrounded sentences (L, C, T, Y) are neither True nor False, violating classical logic’s Law of Excluded Middle. The T-schema holds *only* for grounded sentences; for L, "True(⌜L⌝) ↔ ¬True(⌜L⌝)" is inapplicable as L is undefined. We also sacrifice the ability to *fully* express the semantics ("true," "false," "ungrounded") *within* the object language without resurrecting paradox. The solution delivers a consistent, inductive definition of truth capturing most natural language usage while cleanly isolating pathological cases via a formalizable concept (groundedness). It treats "ungrounded" as a substantive diagnosis by embedding it within a model explaining *how* truth is constructed and *why* these sentences fall outside that process—not merely as a label for "problematic."

  **Marking Scheme (25 marks total):**  

  1.  **Correct & Consistent Application (6 marks):**  
      *   *Hit:* Applies one chosen theory accurately to all four cases, showing understanding of its mechanics (e.g., fixed point stages for Kripke, levels for Tarski, dialetheic acceptance for LP, revision rules for Gupta/Belnap).  
      *   *Miss:* Misstates how theory handles a case (e.g., says Kripke assigns False to Liar), applies different theories to different cases, or is superficial ("it's ungrounded").

  2.  **Diagnosis vs. Redescription (6 marks):**  
      *   *Hit:* Explicitly argues for each case (especially C & Y) why the theory's output (e.g., "ungrounded," "defective") is a *solution* (explains cause, fits framework, avoids contradiction) and not *just* a relabeling of the problem.  
      *   *Miss:* Merely reports the theory's output ("it's ungrounded") without justification, or conflates diagnosis with redescription without argument. Fails on C/Y.

  3.  **Solution Goals & Sacrifices (5 marks):**  
      *   *Hit:* Clearly identifies *specific* costs of the chosen solution (e.g., "gives up classical bivalence," "restricts T-schema," "cannot express 'ungrounded' in object language") and links them to the theory's core commitments. States what the solution *delivers* (e.g., "consistency," "partial T-schema").  
      *   *Miss:* Vague on sacrifices ("it's not perfect"), lists generic costs without specifics, or omits discussion of what the solution achieves.

  4.  **Analysis of Bi-infinite Chain (C) (5 marks):**  
      *   *Hit:* For Kripke/Tarski/Revision: Explains *why* the theory rejects the classical alternating models (e.g., lack of foundation/grounding, violation of inductive constraints). For LP: Explains *why* it might accept them or find a glutty alternative. Explicitly contrasts the theory’s view with the existence of classical models.  
      *   *Miss:* Only notes classical models exist without explaining the theory's rejection/acceptance, or treats C identically to L without addressing its unique structure.

  5.  **Clarity, Structure & Coverage (3 marks):**  
      *   *Hit:* Well-organized, concise (avoids excessive recital of theory basics), addresses all parts of the prompt, technically precise.  
      *   *Miss:* Disorganized, overly verbose on theory basics, misses a case or part of the prompt, significant technical errors beyond minor slips.

  **Why the Bi-infinite Chain (C) Separates A from B:**  
  You are correct; **Case (C) is the key discriminator**.  
  *   **A Answers:** Recognize classical models *exist* but forcefully argue why their chosen theory *rejects* them (e.g., Kripke: "Models lack well-founded grounding, violating the inductive construction"; Tarski: "No consistent level assignment possible"; Revision: "No stable hypothesis converges"). They explicitly frame this rejection as the *core* of their diagnosis, showing how "ungrounded" *adds* a requirement (procedural grounding) beyond classical consistency. They connect this to the sacrifices made (e.g., giving up some classical models).  
  *   **B Answers:** Typically note the existence of classical models but fail to adequately explain *why* their theory overrules them. They might state the theory assigns "undefined" or "ungrounded" to C, but treat this superficially, similar to L, without grappling with the *tension* between classical satisfiability and the theory's grounding requirement. They miss the opportunity to use C to sharply define the *meaning* of "ungrounded" as distinct from classical underdetermination.  

  The other cases are vital but less discriminating: L is handled similarly by all covered theories; T tests understanding of underdetermination vs. paradox but is often well-handled; Y tests non-circularity but strong students handle it analogously to L/C. Case (C) uniquely forces students to confront the *substantive content* of "ungrounded" by pitting it against classical coherence, exposing whether they see grounding as a meaningful constraint or a label for inconvenience. Your chosen four cases are excellent for this purpose.
