  - In the first part, they were arguing about outcomes (which level for which issue) but then got stuck on the question of authority (how to make that decision).
  - The simulation showed that every candidate allocator (the union, the regions, a new body) has an interest in the outcome because the power to allocate competences is centralizing.

  What will predictably go wrong:

  - The initial discussion will be dominated by the substantive issues (e.g., IH arguing for local on industrial emissions) but then someone will raise the procedural question. The groups might not agree on a decision rule and might spend a lot of time on it.
  - The scoring might be complex and the instructor may need to simplify on the fly.
  - Some regions might form coalitions.

  Features the simulation cannot reproduce:

  - In real life, the decision rule is often entrenched in a constitution and not easily changed. The simulation has them design it on the spot.
  - The spillovers are simplified and the LT scoring is arbitrary. In reality, the costs and benefits are not so clear-cut.
  - The simulation does not capture the long-term dynamics and trust between regions.

  The instructor should then link back to the readings: subsidiarity as a presumption in favor of the local is empty without a rule about who applies that presumption. And that rule itself is a centralizing power.

