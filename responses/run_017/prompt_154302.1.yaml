  5. (60-70 min) Presentation and Vote on the Rule: Each region presents their proposal for who decides and their drafted rule. Then the union votes on which rule to adopt. (10 minutes)

     - Note: This vote itself requires a decision rule. The instructor can impose a simple majority vote for this step.

