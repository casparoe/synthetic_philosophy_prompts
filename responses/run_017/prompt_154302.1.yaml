  Below is a comprehensive simulation design for your seminar, focused on the unstated tension in subsidiarity: "Who decides who decides?" The simulation avoids restating standard subsidiarity principles and instead forces students to experience the conflict over authority allocation. The policy domain is **cross-border water management** (specifically, regulating river pollution and water allocation), chosen for its clear local divergences, spillovers, and centralization pressures. The simulation lasts 75 minutes, with six regions (4 students each) representing river basin stakeholders.

  ---

  ### **Policy Domain: Cross-Border Water Management**
  Three interconnected policy issues must be decided:  
  1. **Pollution Standards** (e.g., chemical runoff from farms/industries).  
  2. **Water Allocation** (e.g., rights to withdraw water for irrigation/industry).  
  3. **Infrastructure Funding** (e.g., building dams/pipelines to manage scarcity).  

  Water flows downstream, creating asymmetric spillovers: upstream regions affect downstream regions, but not vice versa. This ensures every delegation faces trade-offs between local autonomy and central control.

  ---

  ### **Regional Delegations & Briefs**  
  Each of the six regions has:  
  - **Local preference** diverging from the union median on one issue.  
  - **Spillover** imposed or suffered on one issue.  
  - **Union preference** on one issue (to force centralization on others).  
  Regions are named after rivers in a fictional union, "Aqua Federata." Delegations receive these briefs:  

  1. **Upper Basin (UB)**  
     - *Local Preference:* Water Allocation (wants high withdrawals for arid farms).  
     - *Spillover Imposed:* Pollution (dumps agricultural chemicals affecting downstream).  
     - *Union Preference:* Infrastructure Funding (needs shared funds for reservoirs).  
     - *Core Incentive:* Protect water rights but avoid paying for infrastructure alone.  

  2. **Lower Basin (LB)**  
     - *Local Preference:* Pollution Standards (wants strict rules due to contaminated drinking water).  
     - *Spillover Suffered:* Water Allocation (depends on UB’s withdrawals; suffers shortages).  
     - *Union Preference:* Infrastructure Funding (needs upstream dams to store water).  
     - *Core Incentive:* Stop UB’s pollution/overuse but centralize costly projects.  

  3. **Delta Region (DR)**  
     - *Local Preference:* Infrastructure Funding (wants local control to prioritize flood barriers).  
     - *Spillover Suffered:* Pollution (absorbs all upstream contaminants; ecosystem collapse).  
     - *Union Preference:* Water Allocation (demands union quotas to ensure minimum flows).  
     - *Core Incentive:* Block upstream pollution but impose allocation rules on others.  

  4. **Mountain Source (MS)**  
     - *Local Preference:* Pollution Standards (wants lax rules for mining jobs).  
     - *Spillover Imposed:* Water Allocation (controls headwaters; shortages affect all).  
     - *Union Preference:* Infrastructure Funding (seeks shared costs for earthquake-proof dams).  
     - *Core Incentive:* Maximize mining revenue but socialize disaster risks.  

  5. **Industrial Corridor (IC)**  
     - *Local Preference:* Water Allocation (wants unlimited factory withdrawals).  
     - *Spillover Imposed:* Pollution (dumps industrial waste affecting DR/LB).  
     - *Union Preference:* Pollution Standards (needs uniform rules to avoid "dirty" label).  
     - *Core Incentive:* Evade local restrictions but force competitors to match standards.  

  6. **Eco Valley (EV)**  
     - *Local Preference:* Infrastructure Funding (opposes dams to protect wildlife).  
     - *Spillover Suffered:* Water Allocation (depends on MS/UB; tourism harmed by scarcity).  
     - *Union Preference:* Pollution Standards (requires global branding as "clean" region).  
     - *Core Incentive:* Block destructive projects but impose anti-pollution rules on IC/UB.  

  *Note:* All briefs emphasize **Legitimacy Tokens (LT)** as the scoring metric. Students start with 10 LT per region, and LT changes based on policy outcomes.  

  ---

  ### **Scoring Scheme: Legitimacy Tokens (LT)**  
  LT reflects regional citizens’ trust in governance. Points are gained/lost after decisions:  
  - **Policy Outcome Match:** +1 LT if decision level (local/union) matches region’s preference.  
  - **Spillover Harm:**  
    - Spillover *sufferer* loses 2 LT if policy is set *locally* (unaddressed spillover).  
    - Spillover *imposer* loses 1 LT if policy is set *union-wide* (cost of compliance).  
  - **Bonus:** +1 LT for any region that "wins" a procedural vote (e.g., getting their preferred decision-maker adopted).  

  *Example:* If Pollution Standards are set locally:  
  - UB (imposer) gets +1 LT (match) but loses 1 LT if forced to change later.  
  - LB/DR (sufferers) lose 2 LT each due to pollution.  

  ---

  ### **Timeline (75 Minutes)**  
  **0:00–0:10: Setup (10 min)**  
  - Assign regions (4 students each; 6 groups).  
  - Distribute briefs. Explain LT scoring and the three policy issues.  
  - **Instructor Script:** "Aqua Federata must decide whether Pollution, Allocation, and Infrastructure are set locally or union-wide. Your goal: Maximize LT. You’ll negotiate in two phases: regional strategy, then union debate."  
  - *Do not mention* how decisions are made. Let students assume they’ll "discuss and agree."  

  **0:10–0:25: Regional Caucusing (15 min)**  
  - Groups read briefs and plan:  
    - Which issues to push for local/union control.  
    - How to leverage spillovers (e.g., "Threaten to pollute if LB doesn’t back us").  
    - Alliances with other regions (e.g., "UB and MS both want union infrastructure funding").  
  - **Instructor Role:** Circulate and clarify rules. Ask probing questions: "Who should decide if your neighbor harms you?"  

  **0:25–0:50: Union Debate (25 min)**  
  - All groups convene. Moderated open discussion on each policy issue.  
  - **Predictable Conflict:**  
    - Early arguments focus on outcomes (e.g., "UB should control Allocation!").  
    - Around minute 10–15, a student will ask: "How do we decide? Majority vote? Consensus?"  
    - This triggers meta-debate: Regions demand different decision rules (e.g., UB wants regional veto; LB wants majority vote).  
    - **Critical Moment:** Let chaos escalate. Do not intervene unless procedural paralysis occurs.  

  **0:50–0:55: The Ballot (5 min)**  
  - Interrupt debate and distribute a ballot:  
    > "Who should decide the level (local/union) for each policy?  
    > — The Union (simple majority vote)  
    > — Individual Regions (each decides for itself)  
    > — A Court of Regions (one judge per region; majority ruling)  
    > — Other: _______________  
    > Draft a specific rule for your choice."  
  - **Timing Pressure:** Groups have 5 minutes to choose and draft a rule (e.g., "Court of Regions rules on disputes").  

  **0:55–1:05: Rule Presentations and Vote (10 min)**  
  - Each region pitches their rule (1 min each). Common proposals:  
    - *Union control:* Favored by centralizers (e.g., LB, DR, EV).  
    - *Regional autonomy:* Favored by defectors (e.g., UB, IC, MS).  
    - *Court/committee:* Compromise choice (e.g., "Regions nominate judges").  
  - **Impose a vote:** Use simple majority (by region, not student) to pick one rule. Announce the winner.  

  **1:05–1:15: Scoring and Wrap-up (10 min)**  
  - Apply the winning rule to "decide" levels for the three policies (use a mock vote/judgment).  
  - Calculate LT changes based on outcomes.  
  - **Key Twist:** Reveal that LT scores are less important than the process.  

  ---

  ### **Debrief: Mapping the Simulation to Theory**  
  **1. Subsidiarity as Presumption vs. Authority (5 min):**  
  - Link simulation moments:  
    - *Outcome focus:* Early debates on "local vs. union" mirrored textbook subsidiarity (presumption for smaller units).  
    - *Authority focus:* The ballot/rule fight exposed the real conflict—allocating competences is inherently centralizing.  
  - **Quote:** "Subsidiarity tells you *what* to prefer but not *who* chooses. Today, you felt why every candidate allocator—union, regions, court—has self-interest."  

  **2. Predictable Problems in First Run (2 min):**  
  - **Chaotic Debate:** Students fixate on policy outcomes initially, missing the meta-conflict. Instructor must resist guiding them.  
  - **Coalition Breakdown:** Regions with shared interests (e.g., upstream UB/MS) ally early but splinter over procedure (e.g., UB wants veto; MS wants court).  
  - **Rule Drafting Flaws:** Proposals often ignore implementation (e.g., "Regions decide" doesn’t address spillover enforcement).  

  **3. Limitations and Discussion Prompts (3 min):**  
  - **Unsimulatable Feature:** Real-world path dependence (e.g., constitutions, courts, history) constrains choices. Students designed rules *tabula rasa*, but you must add:  
    - "In reality, rules emerge from power imbalances. How does this change when regions aren’t equal?"  
  - **Discussion Prompts:**  
    - "Did the rule you chose protect subsidiarity, or just empower your preferred decider?"  
    - "Why is allocating authority the ‘most centralizing power’?"  
    - "How might courts/conventions hide self-interest behind neutrality?"  

  ---

  ### **Instructor Cheat Sheet: Handling Predictable Proposals**  
  During the rule-drafting phase, anticipate these student proposals and have counter-moves ready:  
  - **Proposal:** "Each region decides for itself."  
    - *Move:* Ask, "What if UB pollutes LB? Who resolves that?" Highlight enforcement gaps.  
  - **Proposal:** "Simple majority vote by regions."  
    - *Move:* Note, "UB, MS, and IC are 3/6 regions—they could block all union rules. Is that fair to LB/DR/EV?"  
  - **Proposal:** "Impartial court of experts."  
    - *Move:* Challenge, "Who appoints experts? What if MS and IC stack it with industry lawyers?"  
  - **Proposal:** "Veto for spillover victims."  
    - *Move:* Warn, "LB could veto UB’s water use, but UB could retaliate on pollution. Does this create gridlock?"  

  ---

  This simulation forces students to confront the authority question experientially, setting up your later discussion of subsidiarity’s inherent tensions. The water policy domain ensures tangible stakes, while LT scoring incentivizes strategic thinking without financial abstraction. Run it as a fast-paced negotiation, and the debrief will resonate deeply with your readings.
