prompt: |-
  I'm a software engineer by training and I run a fortnightly internal reading group at the company I work for — fifteen or so engineers, all comfortable with probability and Bayes' rule, none with any economics or philosophy. I have forty minutes, a whiteboard and no slides, and I have to get across why a group of people each reasoning sensibly from their own evidence can settle on the wrong option and stay there: the information cascade case, as against herding that has some other explanation.

  I don't want the explanation written out for me; I want a plan for delivering it. Specifically:

  1. The order the components have to be introduced in, and what depends on what. My instinct is that "nobody here is being irrational" has to land before the pathology does, but I'm unsure where the sequential structure — people committing one after another, seeing predecessors' choices but not the evidence behind them — belongs relative to that, and whether the point that some evidence is private and some public needs to be explicit before anything else can be said.

  2. The one example that should carry the whole session. I was going to use the urn setup and actually run it live: two urns with different colour majorities, one chosen by a coin flip nobody sees, each person privately draws one marble and then publicly commits to a guess, and we compare with the truth at the end. Tell me what an example like this has to have and what it has to avoid. I can see it must not have payoffs that depend on what other people choose, but I don't know what else would quietly contaminate it. And say whether the run-it-in-the-room version is better or worse than a worked example on the board.

  3. The misconceptions, the order they will arrive in, and the point in the sequence at which each should be headed off. The ones I'm expecting: "this is just groupthink, i.e. irrationality"; "the larger the crowd, the more evidence the group's decision rests on"; "if the cascade is on the wrong option, somebody's private evidence will eventually overturn it"; and a slide from "cascades are fragile" to "cascades self-correct". Tell me too which misconception I'm not anticipating.

  4. Whether the analogy I was going to open with is a help or a trap: private evidence as writes that never reach the shared log, so the group ends up branching off a couple of commits' worth of information while everyone keeps producing more that goes nowhere. If it bakes in an error, say which one, and where I should put it instead.

  5. What the audience should be able to do at the end, and a check I can run in the last five minutes that separates people who have the mechanism from people who have taken away only "crowds can be wrong and copying is bad". I'd like them to be able to look at a case from our own work — everyone adopting an internal framework after a well-known team did — and say whether it is a cascade, a case where the payoffs genuinely depend on converging with others, or a case about avoiding blame; and to say what would have to change in the setup for the group to do better. I don't want the session to become a talk about how to run meetings, though, so tell me where that belongs, if anywhere.

  6. What I should explicitly decline to go into at this level, and say out loud that I'm declining it.

  Please answer in British English.
reasoning: |-
  Alright, the user is a software engineer running an internal reading group. They need to explain information cascades to other engineers in 40 minutes using a whiteboard. No slides. The key is showing how rational individuals can end up choosing the wrong option collectively. 

  First, I need to structure the session. The user wants the "nobody is irrational" point to land before introducing the pathology. So start with Bayes' Rule to establish rational foundations. Then introduce sequential decision-making with private and public signals. 

  The urn example seems solid. Using two urns with different color majorities, hidden coin flip, private marble draws, public guesses. Running it live engages the audience but risks time. Need to prepare for quick execution. Avoid payoffs depending on others' choices to prevent confusing with network effects. Ensure private signals are independent.

  Misconceptions to address: "This is just groupthink." Clarify that each person is Bayesian. "Larger crowd means more evidence." Explain that after the cascade starts, private signals stop adding information. "Cascades self-correct." Highlight fragility vs. persistent error. Also anticipate the overlooked misconception: "Cascades are rare." Emphasize they happen even with rational actors.

  The git analogy: private evidence as uncommitted writes. It's helpful but risks implying data is discarded. Clarify that private signals are still there but outweighed by public choices. Present it after explaining the cascade mechanism.

  Post-session, they should identify cascades vs. network effects or blame avoidance. Use a company example: adopting a framework after a top team did. Ask what would break the cascade—like revealing private signals or early dissent. Avoid turning into a meeting tactics discussion.

  Exclude deeper topics: global vs. local rationality, signaling, repeated interactions. State upfront that these are out of scope for this session.

  Focus on clear structure: Bayes, sequential choices, urn demo, misconceptions, real-world application. Keep it tight to fit 40 minutes.
answer: |-
  Here’s a structured plan for your 40-minute session on information cascades, tailored for engineers. British English throughout, as requested.

  ---

  ### **1. Order of Components**  
  *(Total: 15 mins)*  
  **Sequence & Rationale:**  
  - **Start with Bayes (3 mins):**  
    - Whiteboard Bayes’ rule: `P(H|E) ∝ P(E|H) * P(H)`.  
    - Emphasise: "Rational updating = combining prior + private evidence."  
  - **Introduce Private vs. Public Evidence (2 mins):**  
    - Define: **Private evidence** (only you see it, e.g., your marble draw), **Public actions** (everyone sees choices, e.g., guesses).  
    - Crucial to establish *before* sequential decisions.  
  - **Sequential Structure (5 mins):**  
    - Sketch a decision chain: Person 1 → Person 2 → ... → Person N.  
    - Rule: "Each sees *all prior choices* but *only their own private evidence*."  
    - Stress: **"No irrationality here. Everyone uses Bayes and acts logically given what they observe."**  
  - **Pathology (5 mins):**  
    - Reveal the twist: "Early public choices can swamp later private evidence. Rational individuals ignore their own data if predecessors’ actions point strongly one way."  

  ---

  ### **2. The Urn Example**  
  **Why it works:**  
  - **Must-haves:**  
    - Symmetric uncertainty (e.g., urns A/B: 70% blue/30% red vs. 30% blue/70% red).  
    - Coin flip selects urn (hidden).  
    - Private draws (marble colour), public guesses (urn A or B).  
    - **No payoff interdependence** (e.g., no penalty for disagreeing with others).  
  - **Avoid:**  
    - Payoffs based on conformity (avoids confusion with network effects/herding).  
    - Biased priors (e.g., assume 50/50 prior).  
    - Overcomplicating (e.g., >2 urns, uneven priors).  
  - **Live vs. Worked?**  
    - **Run it live (10 mins).** Engineers engage with hands-on demos.  
    - **Practical tips:**  
      - Prep 2 bags (or describe): Urn A (7 blue, 3 red marbles), Urn B (3 blue, 7 red).  
      - Secretly flip coin, pick urn.  
      - Have 5–6 participants draw marbles privately, then publicly declare guesses.  
      - *After* guesses, reveal true urn. Likely outcome: Cascade forms by person 3–4.  

  ---

  ### **3. Misconceptions & How to Preempt Them**  
  **(Address during urn demo/debrief)**  
  - **"This is just irrational groupthink!"**  
    - **When:** After first cascade forms.  
    - **Preempt:** "Notice: Each person calculated the Bayesian posterior. They *should* ignore their marble when predecessors’ choices are unanimous."  
  - **"More people = more evidence!"**  
    - **When:** When cascade starts.  
    - **Preempt:** "Once a cascade begins, later players disregard their private evidence. The group’s decision rests on *only the first few signals*."  
  - **"Private evidence will eventually correct errors!"**  
    - **When:** Debrief after wrong cascade.  
    - **Preempt:** "In cascades, strong early signals create path dependence. Corrections require *contradictory public actions* (e.g., two dissenters), not private doubts."  
  - **"Cascades are fragile/self-correcting!"**  
    - **When:** Discussing real-world parallels.  
    - **Preempt:** "Cascades *are* fragile if early dissent breaks them, but once locked in, they persist. Self-correction isn’t guaranteed."  
  - **Unanticipated misconception:**  
    - **"Cascades require stupidity."**  
      - **Preempt:** Explicitly state: "This occurs *because* everyone is rational. It’s a systemic failure, not individual error."  

  ---

  ### **4. The Git Analogy: Help or Trap?**  
  - **Use it, but late and carefully (3 mins).**  
    - **Where:** After explaining the cascade.  
    - **Analogy:** "Private evidence = local commits never pushed. Public choices = merged PRs. The ‘main branch’ of group belief forks early, and later work builds on incomplete history."  
    - **Trap if:** You imply private evidence is *lost*. Clarify: "It’s not discarded—it’s rationally overruled by public information. The ‘git log’ lacks context for why early decisions were made."  
    - **Fix:** Add: "Unlike git, you *can* rebase! Revealing private signals or dissenting publicly can break cascades."  

  ---

  ### **5. Audience Takeaway & Check (7 mins)**  
  - **Goal:** Distinguish cascades from:  
    - **Network effects** (e.g., payoff increases if others use same tool).  
    - **Blame avoidance** (e.g., choosing popular option to dodge risk).  
  - **Check:**  
    - Pose a company example: *"Team A adopts Framework X. Soon, all teams use X, citing Team A’s choice. Is this a cascade?"*  
    - **Ask:** "What would indicate a cascade vs. other dynamics?"  
      - Cascade: Teams ignored their own evaluation metrics (private evidence) after Team A’s public adoption.  
      - Network effect: Framework X becomes *more useful* as more teams adopt (e.g., shared tooling).  
      - Blame avoidance: "Safer to choose X because it’s the default."  
    - **To improve:** "Break cascades by:  
      - (a) Recording private signals (e.g., anonymised votes),  
      - (b) Encouraging early dissent,  
      - (c) Separating evidence-sharing from decision phases."  
  - **Boundary:** "This is about *system design*, not meeting tactics. We’re diagnosing why good processes fail, not optimising agendas."  

  ---

  ### **6. Explicitly Exclude (State upfront)**  
  - **Global vs. local rationality:** "We won’t discuss whether cascades are globally optimal."  
  - **Signalling models:** "No time for why people might *pretend* to agree (e.g., career concerns)."  
  - **Repeated interactions:** "Today focuses on one-off decisions, not learning over time."  
  - **Alternatives to Bayes:** "We assume Bayesian updating; no behavioural econ today."  

  ---

  **Timing Summary:**  
  - Bayes + Evidence + Sequence (15 mins)  
  - Urn demo (10 mins)  
  - Misconceptions & Git analogy (8 mins)  
  - Takeaway check + company case (7 mins)  

  **Why this works:** Engineers grasp systems where rational micro-behaviour creates macro-failure (e.g., distributed systems). The urn demo makes it visceral, and the git analogy bridges to their workflow. By explicitly excluding tangential topics, you keep focus on the core paradox.
