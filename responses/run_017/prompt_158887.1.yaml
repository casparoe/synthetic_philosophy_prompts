answer: |-
  ## The Executor Considers the Clause

  That all within the trunk is simply **TRUE**
  Is what the faded will declares. This **BOOK**
  Of secrets, locked in script forever **LOST**
  To living eyes, imposes its dull **WEIGHT**
  Upon the floorboards. Claiming it adds **NOTHING**
  To the bare fact: I’m bound by what I **SAY**

  The lawyer read it out. I merely **SAY**
  I must accept its contents all are **TRUE**.
  Does naming it as so add **NOTHING**
  Beyond assent? Like calling this dark **BOOK**
  Just what it is? The trunk’s inert **WEIGHT**
  Holds meanings vanished, utterly **LOST**.

  Is knowledge of the ink’s dark hue now **LOST**
  Because I state “The ink is dark” I **SAY**?
  Or does the phrase itself bear extra **WEIGHT**?
  Affirming “Yes, that statement too is **TRUE”**
  Seems just to echo, like an empty **BOOK**
  Repeating silence. Truly, it is **NOTHING**.

  Yet this command binds me to **NOTHING**
  I can conceive. What wisdom lies there **LOST**
  Behind the hasp? What counsel in that **BOOK**
  Remains unspoken? Still, the will did **SAY**
  Its every glyph, its every mark is **TRUE**.
  A vast, mute promise gathers **WEIGHT**.

  I feel the immensity, the **WEIGHT**
  Of sentences I’ll never grasp: **NOTHING**
  Specific pledged, yet all declared as **TRUE**.
  Each truth untold, forever now **LOST**,
  Demands my faith. But how can I **SAY**
  I stand behind the unread **BOOK**?

  This clause, this key (though not the **BOOK**
  Itself), commits me. Oh, the **WEIGHT**
  Of unseen words! Can merely to **SAY**
  “It’s true” create a debt from **NOTHING**?
  A binding force where meaning’s **LOST**?
  If so, then truth exceeds what’s merely **TRUE**.

  Does claiming truth unlock more than the **TRUE**
  Confined within the waiting **BOOK**?
  Beyond disquotation’s light, now **LOST**
  In this thick dark, a binding **WEIGHT**
  Descends—a consequence from **NOTHING**
  My naked yes could not alone **SAY**.

  &nbsp;

  I hold the key. What unseen **WEIGHT** must rise
  From **NOTHING** pledged? What can my silence **SAY**
  Of **LOST** scripts bound as **TRUE** within this **BOOK**?
