      - **Object A:** Smooth wooden cube (2x2x2 cm) - *$2*  
      - **Object B:** Smooth rubber sphere (2 cm diameter) - *$2*  
    - **Haptic-Similar Pair (Feel alike, look different):**  
      - **Object C:** Rough-textured cube (2x2x2 cm wood, wrapped in coarse sandpaper) - *$3 (sandpaper + wood)*  
      - **Object D:** Rough-textured sphere (2 cm rubber, coated in identical sandpaper) - *$3*  
      *Rationale:* By hand, C and D feel nearly identical (both rough spheres/cubes are rare; texture dominates shape). Visually, the cube and sphere are distinct.  
    - **Visual-Similar Pair (Look alike, feel different):**  
      - **Object E:** Pyramid (3 cm height) painted matte blue - *$2 (cardboard)*  
      - **Object F:** Tetrahedron (3 cm height) painted identical matte blue - *$2 (cardboard)*  
      *Rationale:* Visually, E and F are hard to distinguish (both blue pyramidal shapes). Haptically, the pyramid has a square base (flat edges) vs. the tetrahedron’s triangular base (pointed edges).  
    - **Distractor:**  
      - **Object G:** Cylinder (2x4 cm) painted red - *$2*  
      *Rationale:* Neutral object; distinct from others.  
  - **Other Supplies:**  
    - Opaque cloth bags (7 bags, one per pair; $5 for 10 at a dollar store).  
    - Printed silhouette sheets (5 copies; see details below; $2 for printing).  
    - Blindfolds (optional; $5 for 7 sleep masks).  
    - Whiteboard markers.  
    - Setup: Two tables—one with bags for tactile phase, one with the visual array (objects A–G).  

  **Silhouette Sheet Design (One per pair):**  
  - Six silhouettes: Cube, sphere, rough cube, rough sphere, pyramid, tetrahedron (hand-drawn or printed; all in profile view to avoid 3D cues).  
  - *Example:* Pyramid and tetrahedron silhouettes are identical (both triangles); cube and sphere are distinct.  

  ---

  ### **Session Procedure**  
  **Goal:** Students reconstruct Molyneux’s problem through the activity. No lectures or philosopher names until the debrief. The task forces confrontation between identification, prediction, and similarity.  

  #### **Phase 1: Tactile Exploration (Unseen Objects)**  
  - **Task:** Pairs (7 pairs of 2 students) handle objects in bags, then predict visual appearances using silhouettes.  
  - **Why this works:** Silhouette selection makes prediction *behavioral*, not verbal. Objects are chosen to create haptic-visual mismatch (e.g., rough cube/sphere feel similar but look different; pyramid/tetrahedron look similar but feel different).  

  #### **Phase 2: Visual Matching**  
  - **Task:** Students view the full array (objects A–G) and identify which they handled. Scoring introduces stakes.  
  - **Why this works:** The array includes duplicates (e.g., two cubes: one smooth, one rough) to test if haptic similarity overrides visual differences, and lookalikes (pyramid/tetrahedron) to test if visual similarity overrides haptic memory.  

  #### **Debrief Structure**  
  Map results to three questions:  
  1. **Identification:** Could they find the handled object by sight? (Matching task).  
  2. **Prediction:** Could they anticipate the visual form from touch? (Silhouette task).  
  3. **Similarity:** Do haptic/visual similarities align? (Errors reveal mismatches).  
  Then, pivot to the confound (lifetime of sensory calibration) and the deadlock (empirical vs. conceptual).  

  ---

  ### **Timeline (80 Minutes Total)**  
  **0–10 min: Setup & Framing**  
  - **0–5 min:** Arrange room. Table 1: 7 bags, each containing two objects:  
    - *Bag 1:* A (smooth cube) + C (rough cube)  
    - *Bag 2:* B (smooth sphere) + D (rough sphere)  
    - *Bag 3:* E (pyramid) + F (tetrahedron)  
    - *Bags 4–7:* Repeat combinations (ensures all pairs encounter key pairs).  
    Table 2: Visual array (objects A–G) covered with cloth.  
  - **5–10 min:** Brief students: *“Today, we’re exploring how senses interact. You’ll handle objects unseen, predict how they look, then test your predictions. Work in pairs—no discussing shapes aloud, no cheating!”*  

  **10–30 min: Tactile Phase (Prediction Focus)**  
  - **10–15 min:** Distribute bags and silhouette sheets. Pairs handle one object at a time (1 min per object) while blindfolded or using bags.  
  - **15–25 min:** For each object, students circle the matching silhouette *without seeing the object*.  
  - **25–30 min:** Collect bags/sheets. *Instructor:* *“Remember the objects—you’ll see them soon.”*  

  **30–45 min: Visual Matching Phase (Identification Focus)**  
  - **30–35 min:** Reveal visual array (objects A–G). Students view for 2 min.  
  - **35–45 min:** Pairs identify which two objects they handled (e.g., *“We handled a smooth cube and a pyramid”*). Record answers on whiteboard. **Scoring:** 1 point per correct ID; announce scores to add stakes.  

  **45–60 min: Tabulate Results & Introduce Similarity**  
  - **45–50 min:** Tally prediction (silhouette) and identification (matching) results. Examples:  
    - *Prediction errors:* Choosing a sphere silhouette for a rough cube (haptic similarity overriding shape).  
    - *ID errors:* Picking the rough sphere (D) instead of the smooth sphere (B) (haptic memory influencing visual choice).  
  - **50–60 min:** Whiteboard exercise:  
    - Group objects by *haptic similarity* (e.g., rough cube/sphere feel alike).  
    - Group by *visual similarity* (e.g., pyramid/tetrahedron look alike).  
    - Note mismatches (e.g., *“Rough objects feel similar but look different; blue shapes look similar but feel different”*).  

  **60–75 min: Debrief & Deadlock**  
  - **60–65 min:** Pose three questions (write on whiteboard):  
    > **Q1 (Identification):** *“Could you find the objects by sight? Was it easy/hard? Why?”*  
    > **Q2 (Prediction):** *“Could you predict the silhouette? Did touch ‘translate’ to sight?”*  
    > **Q3 (Similarity):** *“Did objects that felt alike look alike? Did lookalikes feel alike?”*  
    - Link to results:  
      - High ID success? → *“But is this due to innate senses or learning?”*  
      - Prediction errors? → *“Does this mean touch and sight share no common ‘language’?”*  
      - Similarity mismatches? → *“Are the senses ‘aligned’ at all?”*  
  - **65–70 min:** Introduce confound: *“You have a lifetime of linking touch and sight. What if you’d never seen before? Could you do this?”* Reveal Molyneux’s problem: *“A philosopher once asked: Could a blind person, given sight, recognize a cube vs. sphere without touch?”*  
  - **70–75 min:** Stage the deadlock:  
    - *Your friend’s view (empirical):* Point to ID errors (e.g., confusing pyramid/tetrahedron). *“Real cases show people fail—senses aren’t naturally aligned.”*  
    - *Your view (conceptual):* Point to prediction task. *“Even if you learned to pair them, does that prove the senses share a common ‘shape’? What if pairing is just memorization?”*  
    - *Student prompt:* *“Is this a question science can answer? Or is it about what ‘sameness’ means?”*  

  **75–80 min: Wrap-Up**  
  - Stress the deadlock: *“This isn’t settled—it’s a collision between philosophy and psychology. Which evidence would change your mind?”*  
  - No resolutions: End by noting the activity can’t replicate congenital blindness (“What we can’t test…”).  

  ---

  ### **What Will Go Wrong & Mitigation**  
  1. **Students label objects verbally:**  
     - *Risk:* “This is a cube!” → Makes prediction/ID too easy.  
     - *Mitigation:* Strict rule: *“No shape names—describe only texture or weight.”* Enforce during tactile phase.  
     - *If it happens:* Use it in debrief: *“You called it a cube—did that help? What if you had no word for it?”*  

  2. **Task simplified to memory test:**  
     - *Risk:* Students focus on memorizing features (e.g., “rough thing”) rather than sensory mapping.  
     - *Mitigation:* In instructions, emphasize: *“Don’t just memorize—ask: How does touch ‘tell’ you about sight?”*  
     - *If it happens:* Debrief: *“Was this about memory or sensory translation?”*  

  3. **Visual/haptic mismatches unnoticed:**  
     - *Risk:* Students miss pyramid/tetrahedron similarity due to viewing angle.  
     - *Mitigation:* Place lookalikes side-by-side; in grouping exercise, ask: *“Which of these could be twins?”*  

  4. **Low stakes reduce engagement:**  
     - *Risk:* Students treat activity as trivial.  
     - *Mitigation:* Scoring + competitive framing (*“Pairs with top scores get bragging rights!”*).  

  5. **Confound ignored:**  
     - *Risk:* Students conclude, “Obviously, senses are linked!”  
     - *Mitigation:* Force confrontation in debrief: *“Could a newborn do this? What if you’d never held a cube?”*  

  ---

  ### **What the Activity Cannot Do & Failure Signs**  
  - **Cannot reproduce congenital blindness:** The confound is unavoidable. *Use it:* Explicitly state, *“This mimics Molyneux’s question but can’t replicate lifelong sensory deprivation. We’re testing the idea, not the reality.”*  
  - **Failure signs:**  
    - Students leave thinking the answer is “obvious” (e.g., “Senses obviously share shapes!” or “It’s just about practice!”).  
    - The deadlock isn’t engaged (e.g., no debate about whether learning proves conceptual alignment).  
    - Activity reduced to “feeling shapes well” (fix: debrief must prioritize Q1–Q3 structure).  

  **Outcome Success:** Students articulate the deadlock themselves (e.g., *“But how could we ever know if it’s learning or innate?”* or *“Data can’t prove what ‘sameness’ means!”*).  

  This design forces students into the same loop you experienced with your friend, using hands-on exploration to make the conceptual clash visceral. The objects and tasks ensure the three questions are disentangled, and the confound becomes a tool rather than a flaw. Run it as-is, and you’ll have them arguing by minute 70!
