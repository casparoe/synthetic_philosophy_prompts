prompt: |-
  Hey, I'm marking a stack of short-answer responses for an intro metaethics module and would like a second opinion on this one. Here's the question I set:

  Question. The Companions in Guilt move says: whatever makes moral facts look metaphysically or epistemologically queer (they'd be irreducibly normative, mind-independent, and yet capable of giving any agent a reason) is shared by epistemic facts about what we have reason to believe. So the anti-realist who rejects moral facts for that reason must reject epistemic facts too, and that's a cost she can't pay. Now consider the Division of Labour objection: Companions in Guilt at most shows that moral and epistemic facts stand or fall together; it doesn't say which way they fall, and a theorist can coherently bite the bullet and be a global error theorist about reasons. In about 300 words: (a) does the Division of Labour objection defeat the Companions in Guilt move? (b) if not, what would the realist have to add in order to break the tie? (c) assess one proposed tie-breaker: we have a pragmatic reason to accept epistemic norms, since true belief is useful, whereas no comparable pragmatic story supports moral norms.

  And here's one student's answer:

  The Companions in Guilt argument shows that the queerness objection proves too much. Mackie's worry is that objective moral values would be entities unlike anything else: facts that lug their own reason-giving force around with them. But facts about what you have reason to believe look the same. If that's enough to rule out moral facts it's enough to rule out reasons for belief, and then you can't even argue for the error theory, since arguing presupposes that some considerations are better reasons than others. So the anti-realist has to drop the queerness objection.

  The Division of Labour objection doesn't defeat the move. Parity alone doesn't tell you which way to go, and a global error theorist can hold that no normative claim is ever truth-apt or true. But that isn't really available, because it removes the norms of reasoning themselves, and any argument offered for it has to use those very norms. So the objection fails and the tie stays a tie until the realist adds something.

  The pragmatic tie-breaker supplies what's missing. We have a pragmatic reason to accept epistemic norms, because having true beliefs helps us get what we want, and pragmatic reasons are themselves a species of normative reason, so this gives us a genuinely normative reason to believe truly. Moral facts have nothing parallel: there is no useful outcome that moral norms are the means to. Epistemic normativity therefore earns its keep and moral normativity doesn't, which is exactly the asymmetry the realist needs.

  Could you give it a mark out of 20 and the margin comments you'd actually write? I need line-by-line notes rather than an overall impression — where it's right, where it slides, and what the reasoning gets wrong where it does.
reasoning: |-
  Okay, the user is teaching an intro metaethics module and needs help grading a student's short-answer response. They want detailed line-by-line feedback with a mark out of 20. The question deals with the Companions in Guilt argument and the Division of Labour objection.

  First, I need to recall the Companions in Guilt (CiG) argument. It argues that whatever makes moral facts metaphysically or epistemologically queer—like being irreducibly normative and mind-independent yet reason-giving—also applies to epistemic facts. So if an anti-realist rejects moral facts for these reasons, they must reject epistemic facts too, which is problematic because it undermines reasoning itself. The Division of Labour objection says that CiG only shows moral and epistemic facts stand or fall together but doesn't prevent someone from accepting global error theory, rejecting all normative facts.

  The student's answer is well-structured. Part (a) correctly argues that the Division of Labour objection doesn't defeat CiG because global error theory is self-undermining. The student notes that arguing for error theory requires using the very norms it rejects. That's a strong point. 

  In part (b), the student says the tie remains until the realist adds a tie-breaker. This is accurate. The realist needs to show why we should accept both or why epistemic facts are more secure. 

  For part (c), the student discusses the pragmatic tie-breaker: we have pragmatic reasons to accept epistemic norms because true beliefs are useful, whereas moral norms lack this. The student claims this provides a normative reason to believe truly. However, this is where they slide. Pragmatic reasons are instrumental—they depend on desires. If someone doesn't care about truth or achieving goals, these reasons don't apply. Also, moral norms might have pragmatic benefits, like social coordination, which the student overlooks. 

  The student misses that the pragmatic approach might not establish genuinely normative reasons but only hypothetical ones. The deeper issue is whether pragmatic reasons can ground normativity without circularity. 

  The user wants line-by-line comments. I'll note where the student is correct: their understanding of CiG and the self-defeating nature of global error theory. Where they slide: oversimplifying the pragmatic tie-breaker, not addressing its limitations, and ignoring potential parallels for moral norms. 

  Also, the answer is concise and well-argued but lacks depth in part (c). I'll suggest a mark of 15/20—strong on (a) and (b), weaker on (c). The margin comments should highlight strengths in the first two parts and point out the flaws in the third, especially the conflation of pragmatic and normative reasons and the oversight of moral pragmatism.
answer: |-
  Here's a line-by-line assessment with a mark and margin-style comments:

  **Mark: 15/20** (Very Good - Demonstrates strong understanding of core arguments but has significant weaknesses in part (c))

  **Margin Comments & Line-by-Line Assessment:**

  1.  **"The Companions in Guilt argument shows that the queerness objection proves too much."** - **✓ Correct.** Good opening summary of CiG's core strategy.
  2.  **"Mackie's worry is that objective moral values would be entities unlike anything else: facts that lug their own reason-giving force around with them."** - **✓ Accurate.** Captures Mackie's "queerness" (metaphysical & motivational) well.
  3.  **"But facts about what you have reason to believe look the same."** - **✓ Correct.** Accurately states the "companionship" claim for epistemic reasons.
  4.  **"If that's enough to rule out moral facts it's enough to rule out reasons for belief..."** - **✓ Solid.** Good application of the parity point.
  5.  **"...and then you can't even argue for the error theory, since arguing presupposes that some considerations are better reasons than others."** - **✓ Strong Point.** Excellent grasp of the self-defeat problem for *global* error theory concerning epistemic norms. This is crucial.
  6.  **"So the anti-realist has to drop the queerness objection."** - **✓ Correct Conclusion (for Part a).** Rightly sees CiG forces the anti-realist using queerness to abandon that *specific* objection or accept self-defeat.
  7.  **"The Division of Labour objection doesn't defeat the move."** - **✓ Correct Assessment (Part a).** Identifies the objection but rightly sees it doesn't succeed in *defeating* CiG's core challenge.
  8.  **"Parity alone doesn't tell you which way to go, and a global error theorist can hold that no normative claim is ever truth-apt or true."** - **✓ Accurate.** Correctly states what the Division of Labour objection *says*.
  9.  **"But that isn't really available, because it removes the norms of reasoning themselves, and any argument offered for it has to use those very norms."** - **✓ Excellent Rebuttal (Part a).** Precisely identifies why the "global error theory" bullet is too hard to bite – it leads to self-referential absurdity/incoherence. This is the key reason the Division of Labour objection fails to *defeat* CiG.
  10. **"So the objection fails and the tie stays a tie until the realist adds something."** - **✓ Correct Conclusion (Parts a & b).** Accurately summarizes the situation after rejecting Division of Labour: stalemate requiring a tie-breaker.
  11. **"The pragmatic tie-breaker supplies what's missing."** - **✓ Sets up Part c.**
  12. **"We have a pragmatic reason to accept epistemic norms, because having true beliefs helps us get what we want..."** - **✓ Correct description of the proposed tie-breaker.**
  13. **"...and pragmatic reasons are themselves a species of normative reason..."** - **⚠️ Problematic Slide.** This is a contentious claim that the answer *assumes* without argument. Many would argue pragmatic reasons (instrumental, desire-based) are fundamentally different in kind from the categorical normative force Mackie found queer. Treating them as straightforwardly "normative reasons" glosses over this key distinction and potential circularity. *(This is a major weakness)*.
  14. **"...so this gives us a genuinely normative reason to believe truly."** - **⚠️ Builds on the Slide.** Assumes the pragmatic story delivers the *kind* of normativity needed to answer the *queerness* worry, which is debatable. It might only deliver hypothetical imperatives, not categorical reasons.
  15. **"Moral facts have nothing parallel: there is no useful outcome that moral norms are the means to."** - **✗ Incorrect/Overstated.** This is demonstrably false. Moral norms *are* often argued to be crucial means to useful outcomes like social coordination, stability, cooperation, flourishing, avoiding punishment, etc. The student ignores this common realist (and pragmatic) response entirely. *(Significant error)*.
  16. **"Epistemic normativity therefore earns its keep and moral normativity doesn't..."** - **⚠️ Unsupported Conclusion.** This conclusion doesn't follow because: (a) the "pragmatic reasons = normative reasons" move is assumed, not argued; (b) the parallel pragmatic case for morality is wrongly denied; (c) it's unclear if "earning keep" pragmatically addresses the *metaphysical/epistemological queerness* worry or just provides a motivation.
  17. **"...which is exactly the asymmetry the realist needs."** - **✓ Correct about what the realist *wants*, ✗ Weak on whether this *achieves* it.** While the tie-breaker *aims* to create asymmetry, the flaws identified above mean this specific pragmatic proposal, as presented by the student, doesn't convincingly succeed.

  **Summary Feedback:**

  *   **Strengths:** Excellent understanding and articulation of the Companions in Guilt argument (lines 1-6). Superb grasp of why the Division of Labour objection fails – the self-defeat argument against global error theory is spot on (lines 7-10, especially 9). Clearly understands the need for a tie-breaker (line 10). Structure is logical and follows the question parts well.
  *   **Weaknesses:** The assessment of the pragmatic tie-breaker (Part c) is the major letdown. Key flaws are:
      *   **Unargued Assumption:** Simply assuming pragmatic reasons (instrumental/hypothetical) constitute the kind of "genuine normative reasons" needed to resolve the *queerness* worry about categorical normativity (lines 13-14). This is highly contentious and needs justification.
      *   **False Claim:** Incorrectly stating there's *no* parallel pragmatic usefulness for moral norms (line 15). This ignores standard realist responses.
      *   **Unsupported Conclusion:** Declaring epistemic normativity "earns its keep" and moral normativity doesn't based on the flawed premises above (line 16). Doesn't engage with whether pragmatic utility actually solves the *metaphysical/epistemological* problem.
      *   **Lacks Critical Assessment:** Fails to critically engage with the *limitations* of this tie-breaker (e.g., does it ground normativity or just motivation? Is it circular?).

  **Why 15/20:** Demonstrates a very strong grasp of the core CiG argument and the Division of Labour objection (Parts a & b), which are the more complex conceptual parts. This deserves high marks. The significant weaknesses in the critical assessment of the specific tie-breaker proposal (Part c) prevent a mark in the 16-20 range. The flaws in lines 13-16 are substantial enough to warrant a 5-point deduction from a potential top mark.
