  Ordering by damage: "Changed the subject" could undermine the whole argument, so highest damage. "Bad faith" is personal and damaging in a literary context. "Operationalizing" is high damage if unanswered, but a novelist might recover with metaphors. "Category error" is medium damage but likely from literary scholars.

