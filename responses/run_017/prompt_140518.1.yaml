prompt: |-
  I'm TAing a philosophy of game theory seminar this term and I keep falling back on the same move: iterated elimination of strictly dominated strategies, but with mixed strategies allowed as dominators, is the one bit of game-theoretic rationality I'm actually confident in. No equilibrium concept, no common prior, no claims about what anyone believes beyond that they're rational and that this is somehow common — and behind it there's an actual argument, the no-lose one: if some hedge over your own actions beats your action against every opponent profile there is, you can't lose by switching. I've started saying out loud that it's the assumption-light core that everything else in the subject should be measured against. I want to know what would count against that.

  Here's what got me worried. Two players, player 1 has rows A, B, C, player 2 has columns X, Y, Z. Player 2 just wants to guess player 1's row: X pays 2 against A, Y pays 2 against B, Z pays 2 against C, everything else 0. Player 1's payoffs, in one numbering (entries are against X, Y, Z): A = 2, 0, 1; B = 0, 2, 1; C = 1.5, 1.5, 0. Now take a second numbering that's just an increasing relabeling of player 1's payoffs — 0 < 1 < 1.5 < 2 becomes 0 < 1 < 1.5 < 10: A = 10, 0, 1; B = 0, 10, 1; C = 1.5, 1.5, 0. Both numberings represent the same ordinal ranking of the nine outcomes. But: in the first, C isn't dominated by any mix of A and B, since you'd need weight on A above 3/4 to beat it in column X and below 1/4 to beat it in column Y; and Z is fine too, since no mix of X and Y beats it at row C; so nothing is ever eliminated. In the second, half A half B gives 5, 5, 1 against C's 1.5, 1.5, 0, so C goes; and once C is gone Z gives 0, 0 against the surviving rows, any nondegenerate mix of X and Y beats that, so Z goes too and you end up with A,B times X,Y. Same ordinal game, totally different surviving set.

  My hypothesis is that the mixed step isn't assumption-light at all — that it presupposes expected utility, or at least cardinal payoff scales, in a way pure-strategy dominance doesn't, and that the no-lose argument is then only as strong as EU is. But I want the whole map, not just confirmation:

  - Does the relabeling thing actually damage the position, or is there a standard reply (something about what a strategic-form game is defined to include, and about which transformations the procedure is invariant under) that disposes of it?
  - Separately: what I half remember is that with three or more players, being strictly dominated by a mixture lines up with never being a best response to a *correlated* belief about the others rather than an independent one, so the surviving set is bigger than what common belief in rationality plus independent beliefs would give you. If that's right, does the epistemic story I keep telling either overgenerate or quietly assume something I haven't declared?
  - If a player has a set of priors over the opponents and evaluates by the worst case rather than a single expected value, does dominance by a mixture have any grip left?
  - On the positive side: does the procedure predict anything that could be false, or is it insulated by being sold as normative rather than predictive — and is that insulation legitimate here or is it a dodge?

  Rank whatever you find from fatal to merely awkward, and be explicit about which ones a defender of my line would concede count against them rather than only what a critic would say. I already discount the experimental people only do two or three rounds of iterated reasoning stuff, so don't lead with it.
reasoning: |-
  Okay, the user is a teaching assistant for a philosophy of game theory seminar. They heavily rely on iterated elimination of strictly dominated strategies (IESDS) with mixed strategies allowed. They see this as the most robust, assumption-light core of game theory rationality. But they've encountered a problem: two different cardinal representations of the same ordinal game lead to different outcomes under IESDS with mixed strategies. This has made them question whether mixed IESDS really is as assumption-light as they thought.

  The user presents a specific 3x3 game example where Player 2 is trying to guess Player 1's action. When Player 1's payoffs are represented with values (0,1,1.5,2), no strategies can be eliminated. But when payoffs are relabeled to (0,1,1.5,10) while preserving the same ordinal ranking, IESDS eliminates strategies C and Z. This shows that the outcome depends on cardinal utility information, not just ordinal preferences.

  The user raises several deep questions about this phenomenon. They want to know: (1) whether this payoff dependence undermines their position about IESDS being assumption-light; (2) about the relationship with correlated vs. independent beliefs in epistemic foundations; (3) how this works with ambiguity-averse players using max-min criteria; and (4) whether IESDS has testable implications or is purely normative. They specifically want analysis of how damaging these issues are, and what a defender of IESDS might concede.

  I need to address each of these systematically. For the payoff dependence issue, this is actually quite damaging to the "assumption-light" claim because mixed strategy dominance requires cardinal utility. The epistemic story becomes more complicated too - with three or more players, mixed strategy dominance corresponds to never being a best response to correlated beliefs, which may require stronger assumptions about beliefs. For ambiguity-averse players, the entire concept of dominance by mixtures breaks down since they don't evaluate mixed strategies using expected utility. Regarding predictive power, while IESDS is often presented normatively, the dependence on cardinal utilities makes even this normative claim less robust than it appears.

  The user seems intellectually honest - they've identified a genuine problem with their approach and want to understand its limitations. Their deeper concern appears to be about whether game theory has any truly "assumption-light" solution concepts that depend only on ordinal preferences and minimal rationality. I should acknowledge that while mixed IESDS is still relatively robust compared to equilibrium concepts, they're right that it's not as foundationally secure as they initially believed.
answer: |-
  Your worry is profound and cuts to the heart of foundational questions in game theory. The relabeling example is indeed a significant challenge to the claim that mixed IESDS is "assumption-light" in the way you desire. Let's break down the issues systematically, ranking their severity and noting what a defender must concede.

  ### 1. **The Relabeling Problem: Cardinality Bites (Fatal to "Assumption-Light" Core)**
     - **The Damage:** Your example perfectly demonstrates the core problem. **Mixed IESDS is cardinal.** It fundamentally depends on the *intensity* of preferences (cardinal utility), not just their *ordering* (ordinal utility). The "no-lose argument" assumes a player can compare the *expected utility* of a pure strategy against the expected utility of a mixed strategy across all opponent profiles. Expected utility calculation requires cardinal payoffs.
     - **Standard Reply & Why It Fails:** A defender might argue: "Strategic-form games *are* defined with cardinal utilities. The procedure is invariant under *positive affine transformations* (v' = a*u + b, a > 0), not arbitrary increasing transformations." This is technically correct within the standard Savage/vNM expected utility framework. However, this is precisely the concession *you* must make: **Mixed IESDS requires players to have vNM-rationalizable cardinal utilities and to maximize expected utility.** It is *not* invariant under ordinal transformations. Your "assumption-light" claim – requiring only ordinal preferences and rationality – collapses.
     - **Consequence:** The procedure *cannot* be the "core that everything else should be measured against" if its conclusions depend sensitively on cardinal intensities absent in the pure ordinal structure of preferences. Pure-strategy dominance *is* ordinal. Mixed-strategy dominance is not. This is fatal to the idea that mixed IESDS operates with only ordinal preferences and minimal rationality.

  ### 2. **Epistemic Foundations: Correlated vs. Independent Beliefs (Awkward to Problematic)**
     - **Your Half-Memory is Correct:** For 3+ players, being strictly dominated by a mixed strategy is equivalent to never being a best response to *any* (possibly correlated) belief over the opponents' strategy profiles. The set surviving iterated elimination of strategies strictly dominated by mixed strategies is the **rationalizable set** (Bernheim, Pearce).
     - **The Epistemic Story Problem:** Common belief in rationality (CBR) implies players only play rationalizable strategies. However, rationalizability allows for *correlated beliefs*. Your epistemic story ("they're rational and this is somehow common") likely implicitly assumes players have beliefs represented by independent probability distributions over each opponent's strategy (independent beliefs). Independent beliefs lead to the smaller set surviving the **iterated elimination of strategies never a best response to independent beliefs** (sometimes called IA or IIR).
     - **Does it Overgenerate/Assume?** Yes, potentially in two ways:
       *   **Overgeneration (Less Severe):** If your epistemic story only specifies "rationality + common belief in rationality" without specifying belief independence, the rationalizable set (mixed IESDS) is correct. However, if your *intuition* or *informal explanation* leans on players modeling opponents independently (a very natural assumption!), then mixed IESDS overgenerates – it allows outcomes that wouldn't survive if beliefs *had* to be independent. A defender would concede that mixed IESDS corresponds to CBR *allowing correlated beliefs*. If you want the set under independent beliefs, you need a different (and weaker) elimination procedure.
       *   **Undeclared Assumption (More Severe):** The procedure itself implicitly assumes players *can* hold correlated beliefs and evaluate expected utility under them. This is a substantive assumption about belief formation and cognitive capability, especially in large games. While less fundamental than cardinality, it's an extra layer beyond "rationality and common belief thereof."

  ### 3. **Ambiguity Aversion / Max-Min (Fatal to Applicability)**
     - **Dominance Loses its Grip:** If Player 1 evaluates strategies by the worst-case payoff over their set of priors (max-min expected utility or pure max-min), **mixed strategy dominance collapses as a useful concept.** Consider your first game (A=2,0,1; B=0,2,1; C=1.5,1.5,0).
       *   **Pure Strategies:** The max-min payoff for C is min(1.5, 1.5, 0) = 0. The max-min payoff for A is min(2,0,1)=0. The max-min payoff for B is min(0,2,1)=0. No pure strategy dominates another under max-min.
       *   **Mixed Strategies:** Player 1 considers a mixed strategy, say 50% A, 50% B. Its payoff *depends on the opponent and the prior*. Against X: 1, Against Y: 1, Against Z: 1. A max-min player evaluates this mixed strategy by its *worst-case* payoff over opponents: min(1,1,1)=1.
       *   **Comparing to C:** Player 1 compares the mixed strategy's guaranteed payoff (1) to C's guaranteed payoff (0). 1 > 0. So, *under max-min*, C *is* strictly dominated by the 50/50 mix of A/B because the mixed strategy guarantees a higher payoff (1) than C guarantees (0) in the worst case.
       *   **Crucial Point:** This dominance is evaluated *solely on the guaranteed minimum*, not on the expected payoff across columns. EU calculation is irrelevant. The "no-lose argument" transforms: "Switching to the mix guarantees me at least 1, while playing C might get me only 0. I cannot do worse by switching, and might avoid the worst outcome."
     - **Consequence:** The procedure fundamentally changes. Dominance is defined by guaranteed minimums, not expected values. The set of strategies eliminated, and the order of elimination, can differ drastically from standard mixed IESDS. A defender *must* concede that **mixed IESDS, as classically defined and justified by the "no-lose" argument relying on expected utility comparisons across opponent profiles, has no direct grip** in a max-min environment. A different dominance concept based on security levels emerges.

  ### 4. **Predictive Power & Normative Insulation (Awkward Legitimacy)**
     - **Predictive Power:** Mixed IESDS, especially beyond 1-2 rounds, has weak predictive power in experiments. As you note, this isn't your primary concern. Its conclusions can also be highly sensitive to the cardinal payoff values (as your relabeling shows), which are often unobservable or difficult to measure precisely. This weakens its *positive* (descriptive) claim.
     - **Normative Insulation:** As a *normative* principle ("this is what perfectly rational players *should* do"), it is well-insulated *within the vNM expected utility paradigm*. The "no-lose" argument is compelling *if* you accept cardinal utilities and EU maximization. Players violating it are leaving "free" expected utility guarantees on the table.
     - **Legitimacy of Insulation:** This insulation *is* legitimate *if and only if*:
       1.  You explicitly defend the vNM axioms (completeness, transitivity, continuity, independence) as requirements of rationality.
       2.  You accept that strategic games are modeled with cardinal utilities satisfying these axioms.
       3.  You are clear that the conclusion depends on the cardinal intensities represented in the payoff matrix.
     The relabeling example shows that **the normative force is contingent on accepting the cardinal representation as meaningful.** It's not a dodge *if* you are explicit about the underlying assumptions. However, claiming it's "assumption-light" *relative to equilibrium concepts* is still defensible (no fixed-point, no mutual best response, no common prior) – but *only* if "light" means "lighter than Nash," not "requires only ordinal preferences."

  ## Summary Ranking & Defensive Concessions

  1.  **Fatal:** The **Cardinality Dependence (Relabeling Problem)**. This directly contradicts the claim that mixed IESDS operates with only ordinal preferences and minimal rationality. A defender *must* concede it requires vNM-rationalizable cardinal utilities and EU maximization. This is the most significant blow to your "assumption-light core" position.
  2.  **Fatal:** **Inapplicability under Ambiguity Aversion (Max-Min)**. The classical dominance concept and the "no-lose" argument based on expected utility comparisons simply don't apply. A defender must concede its domain is restricted to EU maximizers.
  3.  **Problematic to Awkward:** **Epistemic Foundations (Correlated Beliefs)**. While mixed IESDS corresponds perfectly to rationalizability (CBR allowing correlated beliefs), the common intuitive story often assumes independent beliefs. A defender must concede that:
      *   The procedure allows correlated beliefs.
      *   If the epistemic story intends independent beliefs, then mixed IESDS overgenerates, and a different procedure (iterated removal never a best response to independent beliefs) is needed.
      *   The ability to form and compute with correlated beliefs is an implicit cognitive assumption.
  4.  **Awkward but Legitimate (if explicit):** **Normative Insulation**. The procedure is weak predictively but normatively robust *within its domain* (vNM EU). A defender can legitimately claim it's a sound normative principle *for EU maximizers*, but must drop "assumption-light" in the sense of needing only ordinal preferences. They can argue it's still relatively "light" compared to equilibrium concepts by avoiding equilibrium requirements.

  **Conclusion for your Seminar:** Mixed IESDS *is* a powerful and important concept. The "no-lose" argument *is* compelling *within the expected utility framework*. However, your relabeling insight is correct and crucial: **It is not assumption-light regarding preferences. It fundamentally requires cardinal utilities and expected utility maximization.** Acknowledge this dependency explicitly. Frame it as a robust *consequence* of EU rationality and common belief therein (allowing correlated beliefs), rather than a primitive foundation independent of the utility framework. It remains a valuable tool and a weaker solution concept than Nash equilibrium, but its foundational reliance on cardinality cannot be swept aside. Use the relabeling example prominently to illustrate this key point.
