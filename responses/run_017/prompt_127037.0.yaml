answer: |-
  **Marta:** Okay, breathe. Let’s untangle this. You said reasonable rejection can’t be ex ante because the person who *actually* loses the finger gets no consolation from the lottery. But that’s precisely the point! Contractualism asks if a principle could be reasonably rejected *before* you know your place in the scheme. The complaint isn’t just about the bad outcome *ex post*; it’s about the *risk* imposed by the principle *ex ante*. Under the "always-spare-the-finger" principle, *everyone* faces a small but non-trivial lifetime risk of losing a finger *specifically to avoid minor inconveniences for others*. That’s the complaint-generating feature of the principle itself.

  **You:** Hold on. You’re smuggling in utilitarianism through the back door! You’re taking individual complaints, weighting them by probability, summing *those expectations* across individuals, and declaring the principle with the lower *aggregate expected disutility* wins. That’s just EU maximization wearing contractualist pajamas! What happened to "no summing across persons"? What happened to "the strongest individual complaint determines"?

  **Marta:** No! The crucial difference is the *unit of assessment*. Utilitarianism aggregates welfare states directly. Contractualism aggregates *reasons for rejecting principles*. The complaint isn’t "my expected disutility is high"; it’s "this principle imposes an unacceptable *type* of risk on me *as an individual*." It’s still individual-focused: *I* can reasonably reject a principle that exposes *me* to a significant chance of severe harm for the sake of preventing vast numbers of utterly trivial harms. The "strength" of my complaint isn’t measured in utils; it’s measured by the *kind* of burden the principle allows me to bear relative to the benefits it provides *others*. A principle letting me risk my finger for others' rashes is unreasonable *for me* to accept, given the alternatives. The calculation of the risk magnitude (K*m/N) just shows *why* the complaint is strong – it quantifies the *unreasonableness*, not the disutility sum.

  **You:** But that "unreasonableness" you're quantifying *is* derived from the expected burden! And it hinges entirely on the *size* of the population N and the number of emergencies K. Make N big enough, and the "always-save-fingers" principle suddenly becomes rejectable because *my* expected burden becomes non-trivial? That feels like aggregation by stealth. More importantly, what about the *one-shot* case? Forget lifetimes and populations. One person, identifiable, will lose a finger. Two million identifiable people will each get an itchy rash for an afternoon if we don't save the finger. Your repeat-play framework evaporates. According to contractualism, the one person’s complaint (losing a finger) outweighs *each individual* complaint (a rash). So we save the finger. A billion identifiable rashes? Still save the finger. A trillion? Still save the finger. This is where the framework *clearly* implodes. Your move only works if you can force every situation into a sequence, which you can't. How does contractualism handle *that* case without looking monstrous?

  **Marta:** Fair point on the one-shot. It *is* the hardest case for my view within contractualism. I think contractualism bites the bullet here: the principle permitting letting one person lose a finger to prevent two million rashes *could* reasonably be rejected *by that one person*. Their complaint is vastly stronger than any *single* rash-sufferer's complaint. The framework denies we can add the "mildness" of the rashes *across people* to outweigh the severity *for one person*. The intuition that we *should* aggregate there *is* strong, I grant you. But contractualism says that intuition is wrong because it violates the individualist constraint – it sacrifices one person’s vital interest based on the summed minor interests of others, which no one individual had a strong enough claim to demand. The distinctiveness is precisely that it *doesn't* let the many override the one for small gains, even in the one-shot. The repeat-play move makes aggregation *emerge* through the structure of principles over time *without* direct interpersonal summing, which is why it’s palatable. But the core commitment remains: no direct trade-offs based on summed minor harms against severe harms to individuals.

  **You:** Palatable? It feels like you’re having your cake and eating it too! You avoid the one-shot monstrosity by invoking sequences, but then you have to explain what counts as "situations of the same kind." What’s the non-arbitrary boundary? Are all harms involving skin part of one giant "skin harm sequence"? All minor inconveniences? If I narrowly define "kind" to *just* be "finger-loss vs. rashes," then fine, the probabilities work as you say. But if I define it broadly, say "severe physical harm vs. mild discomfort," suddenly I *am* aggregating across wildly different scenarios over a lifetime! My complaint against a principle allowing *any* severe harm to me to prevent *any* vast number of mild discomforts becomes huge. Isn't that just collapsing into full-blown ex ante utilitarianism, where I reject any principle that doesn't minimize *my* total expected disutility across *all* possible harms?

  **Marta:** That’s a real danger, and it requires careful specification. "Same kind" needs to mean situations with the *same structure* of competing harms: one severe, localized harm vs. distributing a very mild, identical harm across many others. You can't arbitrarily bundle different types of severe harms or different types of mild harms. The principle has to be specific enough: "In situations where we must choose between preventing the loss of a single finger for one person or preventing a brief, minor itchy rash for a large number M of people, choose..." *That's* the principle assessed. Pooling over applications of *that specific principle*. Defining "minor itchy rash" precisely is tricky but not impossible – it excludes stubbing toes or hunger pangs. It doesn't become "all discomforts vs. all severe harms." The complaint is specific to the *risk this principle imposes regarding this specific trade-off*. It avoids collapsing into total EU because it’s complaint-based and principle-specific, not outcome-based and global.

  **You:** Okay, let’s test a variation. Suppose the one person facing finger loss is fantastically wealthy and healthy, while the two million are desperately poor and already suffer chronic rashes. Or suppose the "itchy rash" is so trivial – a 5-second barely noticeable tingle – that no single person would *ever* complain about it on its own, even in principle. Does your repeat-play move still rescue contractualism?

  **Marta:** The pre-existing inequality? Contractualism is notoriously shaky on background justice. But under my repeat-play model, it cuts both ways. The wealthy person might argue the principle imposes a *lesser* relative burden on them, but the complaint about risking a finger for others' trivial gains might still stand – losing a finger sucks even if you're rich. The poor might argue the principle adds yet another minor misery to their burdened lives, strengthening *their* complaint about the *principle* allowing minor harms to accumulate unremedied. It’s messy. The triviality case is sharper. If the harm is *so* trivial that *no individual* could reasonably reject a principle that *sometimes* imposes it on them (even to prevent a finger loss elsewhere), then... maybe the finger-loss complainant stands alone. The repeat-play might not generate a strong enough *individual* complaint about the risk of the trivial harm to outweigh the finger-risk complaint. Contractualism might still say save the finger. Does that feel wrong? Maybe. But if the harm is *genuinely* below the threshold of reasonable complaint for an individual, it’s hard to see how it grounds a rejection.

  **You:** It *does* feel wrong if the numbers are astronomical. But here’s my concession: I see why adding zeros to the number of rash-sufferers in the *one-shot* case doesn’t change the *contractualist* calculus, and why that might not be an *obvious* reductio for everyone. The core idea – that we can’t sacrifice someone’s vital interest just because enough other people have very minor interests – has a stubborn pull, even when the numbers get silly large. It highlights a genuine worry about aggregation trampling individuals. My side sometimes dismisses that pull too easily.

  **Marta:** And my concession: In the pure, identifiable-victims one-shot case with vast numbers of minor harms, contractualism *does* give an answer that clashes fiercely with strong moral intuitions held by many reasonable people, including, apparently, you. My repeat-play move softens the blow by bringing numbers back in through principles over time, but it doesn’t dissolve the core non-aggregative commitment in the atomic case. It remains a significant cost of the view. And specifying "same kind" sufficiently to avoid collapsing into utilitarianism while making the probabilities meaningful is... an ongoing project, not a settled victory.

  **You:** So, stalemate? You think repeat-play saves contractualism from being absurd in practice, even if the one-shot edge case is ugly. I think it’s aggregation in disguise and the framework is fundamentally flawed in denying the moral importance of numbers when harms are small but numerous.

  **Marta:** Stalemate. For now. Pass the chips? My brain’s fried.

  **You:** Deal. But only if you admit "ex ante reasonable rejection" still sounds like voodoo.

  **Marta:** *(Reaches for chips)* Only if you admit "just add the mild harms" sounds like alchemy. Pass the salsa.
