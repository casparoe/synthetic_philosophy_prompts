  The key insight is that step 4 commits a category mistake. When we say M's reals are "countable", we're using a different background theory than M uses. M correctly satisfies "no internal bijection exists" while externally we see a bijection M can't access. This isn't relativity of truth - it's about different perspectives.

  For the self-reference worry: when we prove Löwenheim-Skolem in our metatheory, we're working with what we take to be standard natural numbers. A skeptic could question this, but that would undermine all mathematics - an unacceptable cost. The metatheory's determinacy is a precondition for doing model theory at all.

