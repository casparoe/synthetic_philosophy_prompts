  For Bea's position, I need her to locate essence precisely—probably in the specific gametes themselves, as the zygote is a new entity. She must avoid conflating with Tariq's view, so emphasizing the causal history is key. For Tariq, he needs a positive account, like a developmental programme theory, where what matters is the blueprint executed, not the physical materials.

  Monozygotic twinning is a challenge for Bea. If essence is in the zygote, but it splits into two people, that's problematic. Bea might argue that the essence is in the gametes, so twinning creates new entities. Tariq could counter that the programme diverges, so they become different persons.

