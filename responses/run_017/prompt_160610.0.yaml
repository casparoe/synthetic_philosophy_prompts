  Hmm, this is a fascinating and challenging query from a computer science student grappling with the intersection of modal logic and metaphysics. Let me unpack their core request: they want a technical translation of three metaphysical positions (Lewisian realism, actualism, ersatzism) into Kripke semantics vocabulary, specifically highlighting where the translations break. Their frustration with the TA's reductionist claim is palpable - they sense something's lost in that "just two-sorted FOL" approach.

  Four key pain points emerge: 1) Counterpart theory's translation into bisimulation-invariant formalism, 2) The triviality risk in modeling actuality as designated states, 3) Cardinality arguments vs. filtration's size-indifference, and 4) The concrete/abstract status of worlds. Their suspicion that bisimulation invariance might render metaphysical distinctions invisible is sharp - I should validate that intuition while showing where the invisibility originates.

  For Lewis: The counterpart relation can indeed be added as a second accessibility relation (C ⊆ W×D×D) but crucially, standard modal operators won't see it. This isn't a limitation of the logic per se but reflects Lewis' metaphysical commitment to transworld identity being indirect. The designated state issue is trickier - while models formally resemble Lewis' indexical actuality, the concrete/abstract divide matters. When their metaphysics friend objects that Kripke states are abstract while Lewisian worlds are concrete, that's a metalanguage claim about what the model represents, not an object-language feature.

  For actualism: Varying domain models capture world-bound individuals cleanly, but rigid designators create tension. Individual concepts (functions w → d) can model non-rigidity, but at the cost of inflating the ontology. The deeper break is with ersatzists who construct worlds from propositions - here the "system vs. model" distinction bites hard. An ersatzist's maximal consistent set of propositions lives in the metalanguage as a model-building tool, not in the object language.

  The cardinality quarrel reveals something fundamental: filtration's preservation theorems make universe size irrelevant for satisfiability, but Lewis' extravagance objection targets the metaphysics' explanatory power, not formal consistency. This mismatch shows the TA's "no metaphysical questions left" claim was premature - the model's adequacy conditions exceed what bisimulation preserves.

  Residue analysis: Some breaks are indeed vocabulary limitations (e.g., inability to express "concreteness" in Kripke frames), but others expose metaphysical claims that don't affect model-theoretic behavior (like transworld identity debates). The most telling residue is the system/model distinction - when philosophers treat "worlds" as what models represent rather than model components, they're gesturing at something outside the formalism's scope. That's not a defect in either framework, but a reminder that models are tools for reasoning about something else.
answer: |-
  Below is a residue-focused translation of Lewisian realism, actualism, and ersatzism into Kripke semantics/model theory vocabulary. I preserve the breaks you anticipate and explicitly mark what is lost, bent, or inexpressible. The core tension: **Kripke models are tools for analyzing satisfaction of modal formulas, while metaphysical positions make claims about what worlds *are*—claims often invisible to bisimulation or satisfiability.**

  ### 1. **Lewis's Modal Realism (Concrete Worlds + Counterpart Theory)**  
     * **Clean Translation:**  
       - *Worlds as States:* Each Lewis world → a state `w ∈ W` in a Kripke frame `(W, R)`.  
       - *Accessibility `R`:* Represents "relative possibility" (e.g., physical or metaphysical compatibility).  
       - *Designated State `@`:* The actual world → designated start state for evaluation.  
       - *Varying Domains:* Each world `w` has its own domain `D_w` (no transworld identity).  
     * **Bent/Distorted:**  
       - *Counterpart Relation as Secondary Relation:* Add a ternary relation `C ⊆ W × D × D` where `C(w, d, d')` means "`d'` in world `w` is a counterpart of `d` in the home world".  
         - **Bend:** In Lewis, counterparts depend on qualitative similarity, but `C` is just a primitive relation. De re modality becomes: `◇φ(a)` is true iff at some accessible `w`, there's `d'` with `C(w, a, d')` and `φ(d')` holds.  
         - **Break:** Modal formulas **cannot see `C`**. Bisimulation invariance means that if two models are bisimilar, they satisfy the same modal formulas—even if one has `C` and the other doesn't, or has a different `C`.  
     * **Inexpressible Residues:**  
       - *Concreteness of Worlds:* States in `W` are abstract mathematical points. Lewis insists worlds are concrete universes. This is a **metalinguistic disagreement**: Your model represents worlds *as* states, but Lewis claims the *target system* (reality) contains concrete worlds. The model cannot express "concreteness"—it's a property of what the model points to, not the model itself.  
       - *Actuality as Indexical:* Your designated state `@` formally captures "where evaluation starts". Lewis agrees this is indexical but adds that `@` is *concrete* while other `w ∈ W` are *equally concrete*. The model reduces "being actual" to "being designated", losing the **qualitative parity** between worlds.  
       - *Cardinality Extravagance:* Filtration proves that if a formula is satisfiable, it's satisfiable in a finite model. Lewis's uncountably many concrete worlds **leave no trace** in modal logic: bisimulation quotients collapse them to finite equivalents. The "extravagance" objection is **metaphysical, not model-theoretic**—it’s about the cost of the ontology, not its logical utility.  

  ### 2. **Actualism (Worlds as Abstract Representations)**  
     * **Clean Translation:**  
       - *Worlds as States:* Again, `w ∈ W` as abstract states.  
       - *Varying Domains:* Standard (`D_w` for each `w`).  
       - *Rigid Designators:* Constants `c` denote the same individual across worlds via a rigid designation function (`I(c) ∈ D_total`, but `D_total` is just `∪D_w`).  
     * **Bent/Distorted:**  
       - *Non-Concreteness:* Actualists agree with your model—worlds are abstract (sets, properties, etc.). No bend here.  
       - *"Actuality" as Non-Indexical:* Some actualists (e.g., Plantinga) treat actuality as a non-indexical property of one world. Your designated state `@` captures this **without residue**—it’s a fixed feature of the model.  
     * **Inexpressible Residues:**  
       - *Grounding of Worlds:* Actualists often build worlds from actual sets/properties (e.g., maximal consistent sets of propositions). Your model takes `W` and `D_w` as given—**how states/domains are constructed** is metalanguage work invisible to the object language. Filtration might build a finite quotient, but that’s unrelated to metaphysical grounding.  
       - *Individual Concepts vs. "Real" Individuals:* If you model non-rigid designators with individual concepts (functions `f: W → ∪D_w`), actualists may protest that "real" individuals exist only in `D_@`. But since the object language can’t distinguish rigid vs. non-rigid without semantics, this is **modeling choice vs. metaphysical commitment**.  

  ### 3. **Ersatzism (Worlds as Sets of Propositions/Properties)**  
     * **Clean Translation:**  
       - *States as Maximal Consistent Sets:* Let each `w ∈ W` be a maximal consistent set of propositions (for propositional ersatzism) or a maximal compossible set of properties (for combinatorialism).  
       - *Accessibility `R`:* `w R v` iff the set for `v` is "accessible" from `w` (e.g., logically compatible).  
       - *Domain Issues:* If worlds are sets of propositions, individuals might be reduced to individual concepts (e.g., functions assigning properties across worlds).  
     * **Bent/Distorted:**  
       - *Maximality and Consistency:* Ersatz worlds must be maximal and consistent. Your Kripke model **assumes** `W` is given—it doesn’t enforce maximality. To bend, restrict models to those where each `w` satisfies `∀φ: w ⊨ φ or w ⊨ ¬φ` (but this is metalanguage).  
       - *Construction vs. Representation:* Filtration builds small models from large ones. Ersatzists build worlds from basic ingredients. **Filtration is a technical tool; ersatzism is a metaphysical recipe**—they share no content.  
     * **Inexpressible Residues:**  
       - *Propositions as Urelements:* If ersatz worlds are sets of primitive propositions, but your logic treats propositions as formulas (syntax) or sets of worlds (semantics), you lose the **metaphysical primacy** of propositions.  
       - *Cardinality Worries:* Ersatzists struggle to "find enough" sets/properties to build all possible worlds. But Löwenheim-Skolem implies that if a countable model satisfies a theory, uncountable models do too. **Size constraints vanish** in the model theory—the logic doesn’t care if your `W` is built from too few ingredients.  

  ---

  ### Residue Report: What Breaks and Why  
  1. **Counterpart Relation `C`**:  
     - *Invisible to Bisimulation:* Yes, your guess is correct. Adding `C` doesn’t change satisfiability of modal formulas. This is **not** a limitation of the logic—it’s a feature (bisimulation invariance enables model minimization). The metaphysics (transworld identity via similarity) is doing work the logic ignores.  
     - *Residue Status:* **Metaphysical excess**. Lewis needs `C` to avoid transworld identity, but the logic works fine without it.  

  2. **Actuality as Indexical vs. Designated State**:  
     - *Triviality?* Formally, yes. Designated states make actuality indexical by fiat. The break is **external**: Lewis’s "concrete parity" and the model’s abstraction clash. Your framework can’t express "all worlds are equally real" because *in the model*, `@` is privileged by definition.  
     - *Residue Status:* **Vocabulary defect**. Kripke models lack resources to represent ontological parity.  

  3. **Cardinality Arguments vs. Filtration**:  
     - *Invisibility Confirmed:* Filtration proves cardinality doesn’t affect satisfiability. Lewis’s "extravagance" and the ersatzist’s "resource scarcity" are **metaphysical concerns orthogonal to logic**. The model exists to answer "does there exist a world where φ holds?", not "how many worlds are there?".  
     - *Residue Status:* **Metaphysical excess**. The quarrel is about ontology, not modeling.  

  4. **Concrete vs. Abstract Worlds**:  
     - *Location of Disagreement:* Entirely **metalinguistic**. In your model, states are abstract by construction. Lewis insists the *target* (reality) has concrete worlds. Your logic can’t see this because it doesn’t model "concreteness"—it models satisfaction relations.  

  ---

  ### Conclusion: What Survives?  
  Your TA is half-right: **For *satisfaction of modal formulas*, Kripke models are just two-sorted FOL structures.** Bisimulation invariance, filtration, and model checking all treat worlds as abstract states with domains. But metaphysical positions make claims that:  
  - **Bend** to fit the model (e.g., counterparts as a relation),  
  - **Break** because they’re invisible to bisimulation (e.g., transworld identity debates), or  
  - **Live outside** the model entirely (e.g., concreteness, ontological parity).  

  **Residues as Defects?**  
  - *Vocabulary defects:* Inability to express "concreteness" or "ontological parity". These are limitations if your goal is to model metaphysical claims faithfully.  
  - *Metaphysical excess:* Counterpart theory, cardinality quarrels. These do no work for the logic—they’re philosophical add-ons.  

  **Final View:** The reduction *works* for model theory’s purpose (analyzing modal satisfiability). But metaphysics asks, "What *are* these models maps *of*?" That question survives—not in the logic, but in the gap between the **Kripke structure** (a tool) and the **system** it models (which philosophers take to be reality). The residues are where metaphysics pokes at the map, demanding to know what terrain it represents.
