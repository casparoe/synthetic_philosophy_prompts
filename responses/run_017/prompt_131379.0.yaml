answer: |-
  Here’s a Lewisian reading of *Lord of the Flies*, structured for your seminar, focusing on three pivotal scenes that reveal both the power and limits of convention theory. I’ll address your hobby-horses within the analysis and conclude with the verdict.

  ### 1. **The Conch Assembly (Early Assembly Scenes)**  
     **Lewisian Lens**: The conch starts as a near-perfect Lewisian convention. It solves a recurrent coordination problem (who speaks when) via a salient object. Its use is arbitrary (any object could work), compliance is conditional (boys speak only when holding it, expecting others to listen), and it emerges without agreement. Early on, it functions as a coordination equilibrium: boys prefer using it because others do, creating common knowledge of expectations.  
     **Hobby-Horse #1 (Recognition Conventions)**: The conch *does* double duty. It coordinates turn-taking (action) *and* legitimizes voices (recognition). Lewis’s framework struggles here. His agents have fixed identities, but the conch temporarily *creates* political standing—Ralph’s authority derives from it. Once Jack undermines the conch (e.g., dismissing its rules), recognition fractures. Lewis assumes pre-existing agents; Golding shows conventions *constituting* agency.  
     **Where Golding Pushes Back**: The conch’s authority isn’t self-sustaining. Jack’s charisma and later violence override it, revealing that conventions rely on *deeper alignment of preferences* Lewis takes for granted. When preferences diverge (e.g., rescue vs. hunting), the convention collapses—not from equilibrium drift, but from conflicting goals.  

  ### 2. **The Hunters’ Adoption of Face Paint**  
     **Lewisian Lens**: Initially, the paint seems convention-like: a regularity (hunters wear paint), arbitrary (clay vs. ash), and mutually reinforcing (each prefers it if others do). Salience is endogenous—the hunt’s success makes paint "stick." Lewis can accommodate this; salience can emerge from group activity.  
     **Hobby-Horse #2 (Endogenous Salience)**: Lewis *can* handle this—the pig’s carcass or fire’s smoke become focal points through repetition. But Golding shows salience is *fragile*. When the signal fire’s purpose fades, no new coordination point replaces it organically; Jack actively manufactures the Beast’s salience through ritual. Convention theory underestimates how easily salience is hijacked by authority.  
     **Hobby-Horse #3 (Observability)**: The paint violates Lewis’s implicit observability condition. Masks make actions anonymous, destroying common knowledge of *who* conforms. Each boy sees others painted but assumes *their own* reluctance is unique (pluralistic ignorance). This isn’t equilibrium—it’s mutual delusion enabling disinhibition. Lewis’s model fails here: without observable conformity, preferences decouple from expectations.  
     **Where Golding Pushes Back**: The paint isn’t a true convention—it’s a tool of deindividuation. Simon’s death during the dance isn’t coordination; it’s mob hysteria exploiting broken expectations. Golding shows norms morphing into something darker: not mutual benefit, but *mutual complicity*.  

  ### 3. **The Naval Officer’s Arrival (Final Scene)**  
     **Lewisian Lens**: The officer embodies a Lewisian convention: his uniform, authority, and the warship represent a stable, arbitrary regularity (adult social order). His presence instantly restores coordination—boys "remember" civilization because they prefer to conform when others do. This vindicates Lewis: no enforcer is *present* on the island, yet the "outside" convention holds via internalized expectations.  
     **Where Golding Pushes Back**: The officer’s view of the island as a "game" exposes convention theory’s blind spot. Adult norms aren’t just equilibria; they’re backed by institutionalized violence (warships, uniforms). The boys’ descent isn’t *selection among conventions* but the *unraveling of preference alignment itself*. Golding implies human nature craves dominance, not coordination—when fear (the Beast) outweighs rescue, conventions starve. Lewis’s rational actors vanish; irrationality drives the slide.  

  ---

  ### **Syllabus Scene Recommendations**  
  1. **The First Assembly (Conch)**: Shows convention’s birth and its vulnerability to conflicting preferences. Lewis explains the *how*; Golding shows the *why* (human ambition breaks it).  
  2. **Hunters’ First Kill with Paint**: Reveals endogenous salience and observability’s collapse. Theory describes coordination; novel shows disinhibition’s horror.  
  3. **Naval Officer’s Arrival**: Demonstrates convention’s dependence on shared belief in legitimacy. Lewis explains stability; Golding questions its fragility without shared morality.  

  **Where the Novel Resists Lewis**:  
  - Golding’s boys aren’t rational coordinators; fear and violence distort preferences.  
  - Conventions require *minimal trust* to sustain mutual expectations. On the island, trust evaporates.  
  - Lewis’s theory is silent on *why* some conventions (paint) corrupt. Golding fills this gap with psychology.  

  **Verdict: GOLDING-GOES-BEYOND-LEWIS** because the novel exposes how easily conventions collapse when human irrationality, fear, and the will to power override the fragile machinery of mutual expectations.
