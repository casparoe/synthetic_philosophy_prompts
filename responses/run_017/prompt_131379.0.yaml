prompt: |-
  I'm co-teaching a first-year seminar on social norms next term and we're doing Lord of the Flies alongside Lewis's 1969 book on convention, and I want to get the reading straight before I inflict it on eighteen-year-olds. Set-up so we're arguing about the same thing: the Lewisian package is roughly that a convention is a regularity in a recurrent coordination situation, arbitrary among the eligible alternatives, where everyone conforms, everyone expects everyone else to conform, and everyone prefers to conform on condition that the others do, with all of that common knowledge — and that such a thing can get going with nobody agreeing to anything, just from precedent or from one option's being salient. No rule, no sanction, no legislator, and nobody needs to be able to say why it holds. The evolutionary-dynamics literature that grows out of that picture sharpens it: norms as equilibria nobody chose and nobody could justify.

  What I want from you is a reading of the novel through that lens. Not a summary with theory sprinkled on it — I can do that myself. Take the obvious scenes: the first assembly and the conch, the election, the rule that the fire has to be kept lit, the hunters taking to the paint, the dance in which Simon dies, and the naval officer who shows up at the end and reads the whole episode as a children's game. For each: is what's happening on the island actually a Lewisian convention, or is it something the theory misclassifies — authority, charisma, fear, force, sheer drift? Where does the apparatus genuinely illuminate a choice a boy makes, and where does the novel dramatize something about norms that the argument in the book can only state?

  I've also got three hobby-horses of my own and I want to know which of them survive, and which are me overreading. First: I've started calling some of these recognition conventions — regularities that don't settle who acts when but whose reasons count as reasons at all. The conch seems to do both jobs at once, and I can't tell whether Lewis's action-and-belief machinery has room for the second one or whether it just假定... sorry, I mean, whether it just assumes a population of agents whose standing is already settled. Second: Lewis leans on salience as something you find, but on the island salience gets manufactured (the beast, the pig's head, the smoke) and destroyed (the signal fire stops mattering, and nothing makes it matter again). Can a Lewisian let the salience that launches a convention be produced endogenously by the convention itself, or does the analysis quietly presuppose a stable environment of prominent options? Third, the paint: once the faces are on, nonconformity stops being observable while everyone still knows perfectly well what's expected. I think what's holding at that point is closer to pluralistic ignorance — each boy privately horrified and certain he's the only one — than to common knowledge of conformity. Does Lewis need an observability condition, and what is left of the analysis when it fails?

  Then push back where the reading doesn't fit. Golding is doing something with human nature, or original sin, or the thinness of civilisation, and a theory that's officially neutral about where preferences come from may simply be the wrong instrument. Is the island's slide a selection process at all, or just a slide? Does the ending — the officer, and the way the larger convention of the adult world dissolves everything the boys built — vindicate Lewis's claim that conventions need no outside enforcer, or embarrass it?

  Give me something I could hand to students: name the three scenes you'd actually put on the syllabus, say for each what it shows that the theory alone doesn't, and be honest about where the novel resists you. Paraphrase the novel, don't quote it; I don't need citations. Around nine hundred words would be perfect. Finish with a last line beginning Verdict: containing one of these three labels — LEWIS-EXPLAINS-IT, GOLDING-GOES-BEYOND-LEWIS, or DIFFERENT-QUESTIONS — followed by a single sentence saying why.
