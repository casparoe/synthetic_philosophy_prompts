answer: |-
  Here is the exam question, model answer, marking scheme, and differentiation guide as requested:

  **Exam Question**  
  *Answer ONE question. Time allowed: 90 minutes*  

  **Question 1: The Autonomy Paradox in Precommitment**  
  The Republic of Marenne adopted a *Stability Lock* 25 years ago after a sovereign debt crisis. Its core provisions are:  
  - A permanent cap on the structural deficit.  
  - Any law breaching the cap requires a two-thirds parliamentary majority AND a referendum (held ≥60 days later).  
  - An independent *Fiscal Guard* (9 members, single 12-year terms, removable only for incapacity) certifies breaches and emergency exemptions (originally intended for armed conflict/natural catastrophe).  
  - The Lock itself can only be amended by a three-quarters parliamentary majority plus referendum.  

  Today, three simultaneous challenges arise:  
  **(A)** A once-in-a-century epidemic prompts emergency borrowing. The Fiscal Guard deadlocks (4–4, 1 recusal) on whether an epidemic qualifies for exemption.  
  **(B)** Parliament has *added* new protected spending mandates to the Lock over 25 years but *never relaxed the deficit cap*. The constraint is now far tighter than at enactment.  
  **(C)** A province that joined the Republic *after* the Lock’s adoption holds a majority demanding fiscal renegotiation, arguing it never consented.  

  **Critically evaluate:**  
  What conditions must hold for such a precommitment device to constitute an *extension of a polity’s autonomy* rather than a *restriction of its future self*? Does the Lock’s design—facing (A) unanticipated crisis (*wrong-siren*), (B) asymmetric rigidity (*ratchet asymmetry*), and (C) dissent from later members (*borrowed-mast*)—still satisfy these conditions? In your analysis, address whether technical fixes (e.g., sunset clauses, broader exemptions, symmetric amendment rules) resolve tensions or reintroduce the very weaknesses precommitment seeks to overcome.  

  *(Key terms defined: Wrong-siren = device misfires due to unanticipated circumstances. Ratchet asymmetry = constraints tighten over time via irreversible additions. Borrowed-mast = later agents bound without consent.)*  

  ---

  **Model Answer** (780 words)  

  The Marenne Stability Lock tests whether binding future agents can be autonomous when confronted with unanticipated crises, institutional drift, and contested legitimacy. For precommitment to extend autonomy rather than restrict it, three necessary conditions must hold: **continuity of identity**, **procedural legitimacy**, and **preserved revisability**. The Lock fails these conditions in its current crisis, revealing that design fixes merely relocate—but do not resolve—the tension between constraint and agency.  

  **Condition 1: Continuity of Identity**  
  A polity can only bind its future self if that future self remains meaningfully the *same agent*. This requires shared core values or interests persisting over time. The Lock’s architects aimed to prevent debt-driven collapse by prioritizing long-term stability over short-term spending. However, Condition (B)—*ratchet asymmetry*—fatally undermines continuity. By adding protected expenditures (e.g., social programs) while freezing the deficit cap, parliament altered the Lock’s operational purpose. Originally balancing restraint and flexibility, it now enforces austerity *unintended* by its creators. The future polity is thus constrained not by its own values, but by a distorted derivative of past priorities. This violates identity continuity: the agent bound is structurally distinct from the agent that committed. Sunset clauses could mitigate this by forcing re-authorization, but they reintroduce *exactly* the recurring temptation (deficit bias) the Lock aimed to suppress, trading rigidity for cyclical vulnerability.  

  **Condition 2: Procedural Legitimacy**  
  Precommitment respects autonomy only if binding procedures are democratically accountable *at inception and enforcement*. The Lock’s supermajority/referendum requirements for amendment aim to ensure broad consensus. Yet Condition (C)—*borrowed-mast*—exposes a legitimacy deficit: the later province acceded under duress (post-crisis accession implies economic coercion) and had no voice in designing constraints now shaping its fiscal sovereignty. Delegation to the Fiscal Guard compounds this. Its deadlock in Condition (A)—*wrong-siren*—reveals enforcement as a political, not technical, act. The Guard’s "independent" status masks its unaccountability: members face no electoral consequences for misinterpreting emergencies. Here, delegated enforcement creates *agency slack*, substituting bureaucratic self-interest for democratic will. Broadening exemption criteria might reduce misfires but risks discretionary overreach, allowing governments to reframe ordinary spending as "emergencies," thus circumventing the Lock’s core purpose.  

  **Condition 3: Preserved Revisability**  
  Autonomy-enhancing precommitments must allow future agents to *reasonably update* commitments amid new knowledge. Absolute rigidity denies moral agency. The Lock’s amendment threshold (three-quarters + referendum) is so stringent that it functionally prevents adaptation. Condition (A) exemplifies this: an unforeseen crisis (pandemic) falls outside enumerated exemptions because the *process* for updating exemptions is effectively inaccessible. Consequently, Marenne faces a false choice: violate the Lock or forfeit crisis response—neither option honors the original intent. Symmetric amendment rules (equal thresholds for adding/removing constraints) might ease the *ratchet* but remain vulnerable to *wrong-siren* failures. If Marenne relaxes the cap during the pandemic, future governments could exploit this precedent to weaken restraints during lesser crises, inviting self-serving redescription.  

  **The Paradox of Design**  
  The Lock’s triple failure shows that precommitment’s autonomy claim depends on institutional and temporal conditions that real polities cannot guarantee. Continuity assumes static interests, legitimacy assumes perfect consent, and revisability assumes unambiguous contingencies—all falsified by Marenne’s crisis. Crucially, *every* fix reopens the door to manipulation:  
  - **Sunset clauses** reintroduce periodic weakness of will.  
  - **Broad exemptions** invite semantic gaming (e.g., labelling economic stimulus an "emergency").  
  - **Symmetric amendments** still require supermajorities vulnerable to partisan capture.  
  This is not a design flaw but an *inescapable tension*: precommitments derive force from limiting future choice, yet autonomy requires protecting future agency. The Lock’s architects sought to outsource restraint to "neutral" institutions (e.g., the Fiscal Guard), but Condition (A) proves such bodies lack both the foresight to anticipate novel crises and the democratic mandate to adjudicate them.  

  **Conclusion**  
  Precommitment can extend autonomy only ephemerally. The Lock bound Marenne’s successors under assumptions of value continuity, procedural purity, and predictable emergencies—conditions negated by time, institutional drift, and uncertainty. When the Guard deadlocks, the cap ratchets tighter, and new members dissent, the device becomes heteronomy: rule by a past self whose priorities are obsolete. Technical adjustments cannot reconcile this core contradiction. They either dilute precommitment’s binding force (making it vulnerable to weakness of will) or perpetuate its democratic deficits (favoring rigidity over agency). Marenne’s crisis suggests that precommitment’s promise of extended autonomy is philosophically unstable—a self-undermining bargain where the means of self-binding inevitably mutate into external constraint.  

  ---

  **Marking Scheme (Total: 25)**  

  | **Must-Hit Point**                                                                 | **Marks** | **Common Pitfalls**                                  |  
  |------------------------------------------------------------------------------------|-----------|------------------------------------------------------|  
  | **1. Identifies continuity of identity as a core condition for autonomous precommitment** | 5 | Vague appeals to "democracy" without specifying *temporal* agency (2/5) |  
  | **2. Explains *why* ratchet asymmetry (B) undermines autonomy (e.g., distorts original purpose, binds a distinct agent)** | 5 | Treats (B) as mere unfairness, not identity discontinuity (3/5) |  
  | **3. Diagnoses legitimacy deficit in *borrowed-mast* (C) AND Fiscal Guard deadlock (e.g., unaccountable enforcement, coerced accession)** | 5 | Focuses only on consent, ignoring *enforcement* legitimacy (3/5) |  
  | **4. Argues that revisability is essential AND shows why Lock’s amendment rule fails it (e.g., blocks crisis response)** | 5 | Proposes fixes (e.g., sunset clauses) without critiquing trade-offs (3/5) |  
  | **5. Synthesizes tension: Design fixes reintroduce weakness of will OR create new loopholes** | 5 | Lists problems without connecting to autonomy paradox (2/5) |  

  *Judgment Note:* Point 5 requires synthesis; reward plausible reasoning even if conclusions differ (*marker discretion: ±1*).  

  ---  

  **A vs. B Answer Differentiation**  
  - **B Answer (Competent):** Hits Points 1–4. Explains each failure (wrong-siren, ratchet, borrowed-mast) discretely using autonomy conditions. Notes trade-offs of fixes (e.g., "sunset clauses allow updates but risk repeal during temptation").  
  - **A Answer (Exceptional):** Integrates Points 1–5 to expose the *structural paradox*. Argues that rigidity and revisability are *incompatible ideals* under precommitment (e.g., "The Lock’s strength against temptation is its weakness against change"). Shows how delegated enforcement (Fiscal Guard) transfers, rather than resolves, agency problems. Concludes that autonomy is temporally bounded—a sharp insight beyond "flawed design."  

  **Key to A-Grade Insight:** Top answers recognize that precommitment cannot *simultaneously* insulate against weakness of will, preserve future agency, *and* adapt to uncertainty. They frame the dilemma as inherent to binding futurity itself—not merely Marenne’s drafting errors.
