prompt: |-
  Our philosophy society is run by a teacher who loves trolley cases, and I cant work out what rule he's actually using. His verdicts so far: you may throw the switch so one dies instead of five; you may not push the fat man off the footbridge; you may not push him even in the loop version, where his body is what stops the trolley before it can come back round to the five; you may not be the surgeon who cuts up one healthy patient to save five; a bomber who hits a munitions factory and foresees civilian deaths is fine, while one who bombs civilians to break morale is not; if the person on the side track is about to be crushed by a falling rock anyway, switching is fine; and steering into a wall and killing yourself to save the five is allowed but not required.

  New case we made up: the trolley will hit five people and there's no other track. You can set off a charge that drops the whole trolley into a pit, and that stops it. A man is asleep at the bottom and gets crushed, but his body does nothing to stop the trolley — if he weren't there it would stop just the same and the five would live. Also the trolley wasn't heading for him at all until you set the charge off; the danger to him is entirely your doing.

  Will he say that's OK? More importantly, what rule fits all his verdicts? Every rule I come up with either lets the fat man off the bridge or bans the munitions bomber. If more than one rule fits, tell me which you'd bet on and which follow-up would separate them — should I ask him the same case but where his body IS what stops the trolley, or a version where you could save the five a slower way that only breaks your own leg? A mate says it's all "double effect", but a name doesn't tell me what to say here.

  Please flag which parts of this are genuinely argued about by people who know the topic and which are basically agreed, so I don't repeat a contested view as if it were standard. No book titles or reading lists needed. Answer in British English please.
reasoning: |-
  Okay, the user is part of a philosophy society run by a teacher who loves trolley cases. They've provided several verdicts from the teacher on different scenarios and want to figure out what ethical rule he's using. The main challenge is that every rule they come up with either allows pushing the fat man or prohibits the munitions bomber. They also have a new case where setting off a charge drops the trolley into a pit, crushing a sleeping man at the bottom. The man's body doesn't stop the trolley; it would stop anyway. The danger to him is entirely created by the action.

  First, I need to list all the teacher's verdicts clearly:

  1. May throw the switch (divert to kill one instead of five).
  2. May not push the fat man off the footbridge.
  3. May not push in the loop version (body stops trolley).
  4. May not cut up a healthy patient to save five (surgeon case).
  5. Bomber hitting munitions factory with foreseen civilian deaths is fine, but bombing civilians for morale is not.
  6. Switching is fine if the one on the side track is about to be crushed by a rock anyway.
  7. Steering into a wall to kill yourself to save five is allowed but not required.

  The new case involves setting off a charge that drops the trolley into a pit, killing a man who wasn't in danger otherwise. The man's death doesn't contribute to stopping the trolley; it's incidental.

  The user wants to know if the teacher would approve this new case and what rule fits all the previous verdicts. They also mention that "double effect" has been suggested but they need more specifics.

  Looking at the verdicts, the teacher seems to distinguish between intended harm and foreseen but unintended harm. For example, in the standard switch case, the death of the one is a side effect, not the means. In the fat man case, pushing him is directly using his death as a means. The loop version reinforces that even if the body is used to stop the trolley, it's not allowed. The surgeon case is direct harm to save others. The bomber cases show that if the civilians' deaths are a side effect of targeting a military objective, it's permissible, but not if they are the intended target. The falling rock case suggests that if the person is doomed anyway, it's okay to redirect. Sacrificing oneself is permissible but not obligatory.

  The Doctrine of Double Effect (DDE) seems relevant here. DDE has four conditions: the action must be good or neutral, the bad effect must not be intended, the good effect must not come from the bad effect, and the good must outweigh the bad. Applying this to the cases:

  - Switch: Action is diverting the trolley (neutral/good). Death is unintended; good comes from saving five, not from killing one. Allowed.
  - Fat Man: Pushing him is intended harm to use his body as a means. Not allowed.
  - Loop Version: Same as above, using body as a means. Not allowed.
  - Surgeon: Directly intending harm to one to save others. Not allowed.
  - Munitions Bomber: Intending to destroy the factory, civilians die as side effect. Allowed. Civilian Bomber: Intending civilian deaths to break morale. Not allowed.
  - Falling Rock: Diverting the trolley, the one was doomed anyway. Death is unintended side effect. Allowed.
  - Self-Sacrifice: Intending to sacrifice oneself to save others. Since it's self-sacrifice, it's permissible but not required.

  Now, the new case: Setting off a charge to drop the trolley into a pit, killing a man whose body doesn't stop the trolley. The action is setting off the charge (good intention: saving five). The death of the man is a foreseen but unintended side effect. The good effect (saving five) doesn't come through his death; the pit stops the trolley regardless. So according to DDE, this might be permissible. However, there's a potential issue with the creation of a new threat. The man wasn't in danger until you acted. In DDE, the action must not cause harm in a way that violates other principles. But in this case, the harm is indirect. The key point is whether the harm is directly intended or merely foreseen. Since his death isn't part of the plan to stop the trolley, it's likely permissible under DDE.

  Other possible rules like the Doctrine of Triple Effect or Means Principle might be considered, but DDE seems to cover all cases. The means principle would prohibit using harm as a means, which fits all except maybe the self-sacrifice. But self-sacrifice is different because it's yourself. The new case doesn't use the man's death as a means, so it should be allowed.

  Contested points: The permissibility of the initial switch is widely debated. Some utilitarians allow it, others don't. The fat man case is more controversial; DDE proponents forbid it, but others might allow it. The bomber case distinctions are standard in just war theory. The self-sacrifice being allowed but not required is less contested. The falling rock case aligns with DDE but might be seen as exploiting the situation.

  For follow-ups: Asking if the man's body is necessary to stop the trolley would test whether using harm as a means is the key factor. If the body is necessary, the teacher would likely say no, as per the loop case. Another follow-up could be if there's a slower way to save them with only personal harm, like breaking your leg. The teacher would likely say that's permissible since it's self-sacrifice.

  So, betting on DDE. The new case should be allowed because the harm is unintended and not used as a means.
answer: |-
  Right, let's crack this. Based on your teacher's verdicts, the most likely rule is a specific interpretation of the **Doctrine of Double Effect (DDE)**, focusing heavily on the *intended means* and the *creation of new threats*. Here's the breakdown:

  ### The Likely Rule (Your Teacher's DDE Variant)
  1.  **An act that has both good and bad effects is permissible only if:**
      *   **a. The act itself is morally good or neutral.**
      *   **b. The *intention* is only to achieve the good effect; the bad effect is merely foreseen, not intended.**
      *   **c. The good effect does not *result from* the bad effect (the bad effect is not the *means* to achieve the good effect).**
      *   **d. The good effect sufficiently outweighs the bad effect (proportionality).**
  2.  **Crucially, creating a *new, direct threat* to an otherwise safe person to achieve the good is forbidden, *especially* if that person's harm becomes the means (violates c). Redirecting an *existing, independent threat* may be permissible if the other conditions hold.**

  ### Applying the Rule to His Verdicts
  *   **Throw switch (OK):** Act (diverting trolley) is neutral. Good effect (saving 5) is intended. Bad effect (killing 1) is foreseen but unintended. Good effect happens *by diverting the threat*, not *by killing the one*. The threat (trolley) was independent and already heading *somewhere* lethal.
  *   **Push fat man (Not OK):** Act (pushing) is bad. Bad effect (his death) *is* intended as the means to stop the trolley (violates b & c). You create a *new, direct threat* to him (falling/pushing) where none existed.
  *   **Loop version push (Not OK):** *Same as above.* Even though his body physically stops it, *you* created the direct threat (pushing him) to make his body the tool/means (violates b & c). The threat *to him* is new.
  *   **Surgeon (Not OK):** Act (cutting healthy patient) is bad. Bad effect (death) is directly intended as the means to get organs (violates b & c). Creates a new, direct threat.
  *   **Munitions Bomber (OK):** Act (bombing factory) is arguably neutral/good (military target). Good effect (destroying munitions) is intended. Bad effect (civilian deaths) is foreseen but unintended. Good effect (factory destroyed) doesn't *result from* their deaths (violates c? No, the bomb destroys the factory *directly*; the deaths are collateral). The threat (bomb blast) primarily threatens the factory; civilians are *collaterally* harmed by the *same blast*.
  *   **Civilian Bomber (Not OK):** Act (bombing civilians) is bad. Bad effect (civilian deaths) *is* the intended means to achieve the good effect (breaking morale) (violates b & c). Creates a new, direct threat *aimed* at them.
  *   **Falling rock side-track (OK):** *Similar to standard switch.* Redirecting an existing, independent threat (trolley). His imminent death from the rock is irrelevant *to the act*, but makes the net harm arguably less (you kill someone doomed anyway). The bad effect (trolley killing him) is unintended; the good effect comes from redirecting the trolley, not from his death.
  *   **Steer into wall/suicide (Permitted):** Act (steering) is neutral. Good effect (saving 5) is intended. Bad effect (your death) is foreseen but unintended (could argue it's intended, but self-sacrifice is often treated differently). Good effect comes from stopping the trolley *with the wall*, not *by your death* (though your death is coincident). Significantly, you are only harming *yourself* with a new threat (hitting the wall), which is generally permissible (you can consent to risk yourself).

  ### Your New Case: Pit with Sleeping Man
  *   **Act:** Setting off the charge (arguably neutral).
  *   **Good Effect:** Saving the five (intended).
  *   **Bad Effect:** Crushing the sleeping man (foreseen).
  *   **Key Question:** Is the bad effect the *means* to the good? Is a *new, direct threat* created for him?
      *   **Your description:** His body does *nothing* to stop the trolley. The trolley is stopped by the pit *regardless*. The danger to him *only* exists because you set off the charge. He was entirely safe beforehand.
  *   **Likely Teacher Verdict: NOT OK.**
      *   **Why?** You are creating a *brand new, direct threat* specifically to him (dropping the trolley onto him) where none existed before. Even though his death isn't the *means* (the pit stops it), the act involves *directly imperilling an otherwise safe person* as a core part of the plan to achieve the good. You are *using* him as the location for the threat. This violates the spirit of forbidding the creation of new threats to innocents seen in Fat Man and Surgeon. Condition (a) might even be challenged – deliberately dropping a trolley onto a sleeping man seems like a bad act.

  ### What's Contested vs. Agreed (Among Philosophers)
  *   **Highly Contested:**
      *   The permissibility of the *initial switch* itself. Some (like strict deontologists) argue it's murder, others see it as obvious.
      *   Whether the distinction between *intended/foreseen* is psychologically coherent or morally relevant.
      *   Whether *redirecting* vs. *initiating* a threat is a meaningful difference (critical for Switch vs. Fat Man).
      *   The application of DDE to *terror bombing* vs. *tactical bombing* – while the distinction is standard in Just War Theory, its precise grounding and application are debated.
  *   **Generally Agreed (Among those who accept DDE-like distinctions):**
      *   That *pushing the fat man* is fundamentally different from *throwing the switch* and less permissible.
      *   That *using someone directly as a means* (like the Surgeon or intended civilian bombing) is prohibited.
      *   That *foreseen but unintended side effects* can sometimes be permissible (core DDE idea).
      *   That *self-sacrifice* is generally permissible (though whether it's *required* is debated).

  ### Best Follow-Up Questions to Test the Rule
  Your mate is right it's in the realm of "double effect," but the specifics matter. To confirm the rule and distinguish it from close alternatives, ask:

  1.  **"Body IS Necessary" Variation:** "Same pit case, but if the man *wasn't* at the bottom, the trolley *wouldn't* stop and would roll out to kill the five. His body crushing *is* what absorbs the impact and stops it. Is setting off the charge OK?"
      *   **Prediction:** Teacher says **NOT OK**. *Why?* Now the good effect (stopping the trolley) *results directly from* the bad effect (his body crushing). His death is the *means* (violates condition c). This mirrors the Loop Case verdict.
  2.  **"Slower Way, Break Own Leg" Variation:** "No pit/man. You could trigger a different mechanism that safely stops the trolley but takes 30 seconds. In those 30 seconds, you could run and warn the five to get off the track, saving them, but you'd definitely break your leg in the process. Is triggering the mechanism OK?"
      *   **Prediction:** Teacher says **OK**. *Why?* The act (triggering mechanism) is neutral/good. Good effect (saving 5) is intended. Bad effect (broken leg) is foreseen, unintended, and not the means to the good effect (you save them by warning them *using the time bought*, not *by* breaking your leg). Harming *yourself* is permissible. This reinforces the self-sacrifice verdict.

  **My Bet:** I'd strongly bet on this DDE + "no new direct threats" interpretation fitting all the verdicts. The Pit Case verdict (Not OK) and the predictions for the follow-ups are crucial tests. If he allows the "Body IS Necessary" variation, it blows this rule apart and we'd need a different approach (though that seems unlikely based on his Loop Case verdict). The key insight is his emphasis on *not creating a new lethal threat* to an otherwise safe person, even if their death isn't strictly the *means*.
