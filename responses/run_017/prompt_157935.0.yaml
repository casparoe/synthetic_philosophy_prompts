answer: |-
  Below is a decision tree for Maxwell's demon, designed as a handout for your reading group. It starts from the premise that a Szilard engine extracts \(k T \ln 2\) per cycle and walks through key questions (using your three diagnostic cases) to resolve how the second law is preserved. The tree has 8 branch nodes (questions) and 8 leaves (positions), with system boundaries explicitly addressed. Unoccupied combinations are noted, and the cold-tape demon is resolved via the two-reservoir interpretation. The tree fits on two A4 pages.  

  **Key to Answers**  
  - **Y**: Yes  
  - **N**: No  
  - **A, B, C, ...**: Multiple-choice options  

  ---

  ### **Decision Tree: Maxwell's Demon Exorcism**  

  **Start**: You grant that a Szilard engine (one molecule, one cycle) extracts \(k T \ln 2\) of work. The demon operates this engine.  

  #### **Node 1: One-shot demon**  
  After one cycle, the apparatus (including the demon) is abandoned. Is this a violation of the second law?  
  - **Y** (Violation occurs) → Go to Node 2  
  - **N** (No violation) → Go to Node 3  

  #### **Node 2: System boundaries for one-shot**  
  Whose entropy must increase to prevent violation?  
  - **A**: Only the gas and heat bath (demon is external) → Leaf 1  
  - **B**: The gas, heat bath, and demon’s memory → Go to Node 3  
  - **C**: The gas, heat bath, demon’s memory, *and* the preparer of the initial state → Go to Node 3  

  #### **Node 3: What prevents one-shot violation?**  
  Why is there no net entropy decrease?  
  - **A**: The demon’s memory was prepared in a low-entropy state initially, costing elsewhere → Go to Node 4  
  - **B**: The measurement increased the memory’s entropy by \(k \ln 2\) → Go to Node 5  
  - **C**: The measurement dissipated \(k T \ln 2\) of heat → Go to Node 6  

  #### **Node 4: Heirloom demon**  
  The demon starts with a pre-correlated tape (no measurement) and extracts work. Violation?  
  - **Y** → Go to Node 7  
  - **N** → Go to Node 8  

  #### **Node 5: Entropy increase in memory**  
  After measurement, is the memory’s entropy always \(k \ln 2\) higher, even if the state is known?  
  - **Y** → Leaf 6  
  - **N** → *Incoherent with Node 3B* → Leaf 1  

  #### **Node 6: Cold-tape demon**  
  Tape is erased at \(T/10\), costing \(k(T/10) \ln 2\) per bit. Net work = \(k T \ln 2 - k(T/10) \ln 2 = 0.9 k T \ln 2\). Violation?  
  - **Y** → Go to Node 7  
  - **N** → Leaf 7  

  #### **Node 7: Cold-tape resolution**  
  Where is the "missing" cost?  
  - **A**: Transferring the tape to \(T/10\) costs work (e.g., to prevent heat flow) → Leaf 3  
  - **B**: Measurement at \(T\) dissipated \(k T \ln 2\) (unpaid) → Leaf 2  
  - **C**: Erasure must be at \(T\) to match information’s free energy → Leaf 4  
  - **D**: *Unoccupied* (All other paths covered)  

  #### **Node 8: Heirloom resolution**  
  Why no violation?  
  - **A**: Initial correlation was established at a cost → Leaf 8  
  - **B**: Using the tape reduces correlation, increasing entropy irreversibly → Leaf 5  
  - **C**: *Unoccupied* (No one denies prep cost here)  

  ---

  ### **Leaves: Positions on "What the Demon Proved"**  
  1. **Demon wins (standard violation)**  
     - Violation confirmed: Work from one heat bath, no entropy increase.  
     - System: Gas + heat bath only (ignores demon).  
     - *Path: 1Y → 2A*  

  2. **Exorcised by measurement cost**  
     - Measurement dissipates \(k T \ln 2\) of heat, balancing work.  
     - System: Includes measurement apparatus.  
     - *Path: 1N → 3C → 6Y → 7B*  

  3. **Exorcised by tape transfer cost**  
     - Moving tape to cold reservoir costs work (e.g., \(0.9 k T \ln 2\)).  
     - System: Includes tape transport.  
     - *Path: 1N → 3A → 4Y → 6Y → 7A*  

  4. **Exorcised by erasure temperature**  
     - Erasure must be at \(T\) (not \(T/10\)) to account for information’s origin.  
     - System: Erasure device at \(T\).  
     - *Path: 1N → 3A → 4Y → 6Y → 7C*  

  5. **Exorcised by correlation reduction**  
     - Using pre-correlated tape reduces mutual information, increasing entropy.  
     - System: Gas + tape joint entropy.  
     - *Path: 1N → 3A → 4N → 8B*  

  6. **Exorcised by memory entropy**  
     - Measurement writes a random bit, increasing memory entropy by \(k \ln 2\).  
     - System: Demon’s memory.  
     - *Path: 1N → 3B → 5Y*  

  7. **Exorcised by two-reservoir efficiency**  
     - Net work \(\leq\) Carnot efficiency (\(1 - T_{\text{cold}}/T_{\text{hot}}\)) for heat engine between \(T\) and \(T/10\).  
     - System: Gas (at \(T\)) + erasure (at \(T/10\)) as two reservoirs.  
     - *Path: 1N → 3A → 4N → 6N*  

  8. **Exorcised by preparation cost**  
     - Initial memory/correlation prepared at cost (e.g., \(k T \ln 2\) per bit).  
     - System: Includes preparer (e.g., environment).  
     - *Path: 1N → 3A → 4N → 8A*  

  ---

  ### **Unoccupied Combinations & Diagnostics**  
  - **Node 3B (measurement increases memory entropy) + Node 5N (entropy not always higher)**:  
    Incoherent—if entropy doesn’t increase, measurement doesn’t save the second law. (Leaf 1 forced.)  
  - **Node 4Y (heirloom violation) + Node 8A (preparation cost)**:  
    Unattractive—if preparation cost exorcises one-shot, it should also exorcise heirloom.  

  ### **Indistinguishable Leaves**  
  - **Leaf 6 (memory entropy) and Leaf 2 (measurement cost)** cannot be separated in the cold-tape case—both imply measurement has thermodynamic consequences.  

  ### **Notes on Diagnostic Cases**  
  - **One-shot demon**: Resolved by preparation cost (Leaf 8) or memory entropy (Leaf 6).  
  - **Cold-tape demon**: Resolved by two-reservoir efficiency (Leaf 7) or transfer cost (Leaf 3).  
  - **Heirloom demon**: Resolved by preparation cost (Leaf 8) or correlation reduction (Leaf 5).  
  - **System boundaries**: Explicitly labeled in each leaf (no hidden assumptions).  

  ---  
  **Format Tips**: Print on two A4 pages. Use arrows for paths (→) and bold for **Leaves**. Discuss unoccupied combinations last.
