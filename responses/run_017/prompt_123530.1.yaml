prompt: |-
  I'm teaching a unit on conventional obligation next term and I keep going back and forth on it, so here are my gut verdicts — I'd like the principle they add up to, if there is one.

  Visitor from a no-tipping country leaves nothing in a US restaurant: basically fine, I don't think she's wronged anyone. Same visitor shoving in with everyone else to board a bus where the scrum is the norm: fine. An American who leaves a fat tip in a country where tipping isn't the practice: not fine — mildly obnoxious, even though nobody is harmed in any obvious way. Local queue-jumper: clearly not fine. Local crossing against the light on an empty street with no one watching: fine, and fine for the visitor too. Someone who flies to the same city every month for years and never picks up the local queuing norm: not fine, and worse than a two-day tourist doing exactly the same thing. And the one I can't settle: a delivery app that flashes a 20% default at you — I feel more obliged than I did with the old optional tip jar, and I can't tell whether the app is making a request or quietly rewriting the convention.

  The thing I've been toying with is a draw-down condition: you owe conformity in proportion to how much you're taking out of the local cooperative scheme that runs on that convention, so tourists and passers-through owe almost nothing. But it doesn't explain why exiting a convention is free while importing one isn't, or why the empty-street jaywalk feels different from the queue jump.

  So: one principle or several? Which of my verdicts does it force me to drop, and what does it say about the expat of ten years who still won't tip, and about a convention most locals actually resent and are trying to get rid of — is complying with it a way of respecting them or of propping up something they want dismantled?
reasoning: |-
  Okay, the user is teaching a unit on conventional obligation and shared their gut verdicts on various scenarios. They want to find an underlying principle that explains their judgments. Let me start by listing their examples: 

  First, a tourist from a no-tipping country doesn't tip in the US—they think that's fine. Same tourist pushing into a scrum to board a bus is also okay. But an American tipping in a no-tipping country is obnoxious. A local queue jumper is bad. Jaywalking on an empty street is fine for both locals and tourists. A frequent flyer who ignores local queuing norms is worse than a tourist doing the same. The tricky one is the app with a 20% default tip—they feel more obliged but aren't sure if it's a request or changing the convention.

  Their proposed principle is a "draw-down condition": obligation based on how much you take from the local cooperative scheme. Tourists take little, so owe little. But this doesn't explain why exiting (like jaywalking alone) is okay while importing a custom (tipping where it's not done) isn't. Also, why the frequent flyer is worse than a tourist, and what about conventions locals resent?

  Now, I need to find a unified principle. Maybe it's about two things: participation and harm. Participation means how integrated you are in the community. Harm involves disrupting coordination or imposing costs. 

  For the tourist not tipping in the US: low participation, no real harm since the system expects some non-tippers. Same for bus scrum—no harm as it's the norm. American tipping abroad: even though no harm, it's importing a foreign norm, which might signal disrespect or disrupt local practices. Local queue jumper: high participation and causes direct harm by breaking order. Jaywalking alone: no harm, so okay. Frequent flyer: high participation over time, so their refusal to adapt is worse. The app's default tip blurs request vs. obligation, making refusal feel like a bigger deal.

  What about the expat who won't tip after ten years? High participation, so they should conform. But if locals resent the convention (like tipping), complying might not be respectful. Here, the principle needs flexibility. Obligation might shift to supporting change if that aligns with community sentiment. So, respecting locals could mean not tipping if they're trying to abolish it.

  The key is balancing participation level and harm prevention. Tourists cause minimal harm, so less obligation. Locals or long-term residents have higher stakes in maintaining coordination. Exiting a convention (jaywalking alone) is fine if no harm, but importing one can disrupt local norms. The app's default creates pressure by implying a new norm, making refusal feel like a breach even if it's not yet established.

  Now, does this cover all the user's verdicts? Mostly. The American tipping abroad is obnoxious because it imposes an external norm, which disrespects local customs. The frequent flyer is worse because they're more integrated but refuse to adapt. The app situation: the obligation feels stronger because the app is attempting to rewrite the convention, leveraging interface design to create pressure. The user might need to accept that conventions in flux (like tipping in apps) have ambiguous obligations.

  Potential adjustments: The user might need to drop seeing the app's default as purely a request—it's a norm-in-the-making. Also, for resented conventions, obligation isn't to comply but to support the community's evolving norms. The expat should tip if locals still expect it, but if there's a movement against tipping, supporting that change is better.

  So the core principles are participation level and avoiding harm through disruption. This unifies most cases, though the app scenario shows how technology can rapidly shift norms, creating new obligations.
answer: |-
  Your intuitions reveal a coherent principle, though it requires refining the "draw-down" idea and adding a second dimension. The core principle is: **Conventional obligations arise from *participation in a cooperative scheme* and are binding primarily to prevent *harm through coordination failure or social friction*.** 

  Here's how it works, with your verdicts analyzed:

  ### The Principle Explained:
  1. **Participation Level:** How integrated are you into the community whose convention it is? (Tourist = low; Local/Regular = high).
  2. **Harm Prevention:** Does your action risk:
     - **Coordination Failure:** Breaking systems relying on the convention (e.g., queues collapsing into chaos).
     - **Social Friction:** Causing resentment, offense, or signaling disrespect to the community maintaining the convention.
  3. **Convention Robustness:** Is the convention widely followed and relied upon, or is it weak/contested?

  ### Applying the Principle to Your Verdicts:
  | Scenario                                  | Your Verdict | Principle's Verdict | Reasoning |
  |-------------------------------------------|--------------|---------------------|-----------|
  | **Tourist doesn't tip (US)**              | Fine         | **Fine**            | Low participation. Harm is minimal: US tipping systems expect *some* non-compliance (tourists, stingy locals). No coordination failure. |
  | **Tourist joins bus scrum (where normal)**| Fine         | **Fine**            | Low participation. Action aligns with local convention. No harm caused. |
  | **American tips fat (no-tipping country)**| Not fine     | **Not fine**        | Low participation, but *creates social friction*. Signals disrespect for local norms ("my way is better"), potentially pressures workers/locals, disrupts wage expectations. Harm isn't economic, but social. |
  | **Local queue-jumper**                    | Not fine     | **Not fine**        | High participation. Causes direct coordination failure (undermines queue function) AND social friction (resentment). |
  | **Jaywalker (empty street, no observers)**| Fine         | **Fine**            | **No harm possible.** Convention exists for safety/efficiency; absent those concerns, no obligation binds anyone (local or tourist). "Exiting" is costless here. |
  | **Frequent flyer ignores queuing norm**   | Not fine     | **Not fine**        | **High participation.** Regular engagement implies tacit acceptance of local cooperative schemes. Defiance causes social friction (resentment as "entitled outsider") and risks coordination failure if emulated. |
  | **Delivery app's 20% default**            | ???          | **Obligation exists but is weaker/app-defined** | The app is *attempting to rewrite the convention*. It creates social friction (guilt/awkwardness) via interface design. Your obligation stems from *participating in this specific app's scheme*, not a broader social consensus. Refusal harms only the app's desired norm, not a deeply rooted convention. |

  ### What You Might Need to Drop/Adjust:
  * **"Exiting is free, importing isn't"**: The principle explains this. "Exiting" harmlessly (like empty-street jaywalking) *is* free. "Importing" a foreign convention (like tipping where it's absent) often creates social friction/disruption, hence it's not free. The harm type differs.
  * **The "Draw-Down" Simplicity**: Pure "taking out" isn't enough. A tourist *could* harm by causing coordination failure (e.g., ignoring a critical safety norm). The harm dimension is essential.

  ### Addressing Your Lingering Questions:
  1. **The 10-Year Expat Who Won't Tip (where expected):**
     * **Verdict: Obliged to tip.** High participation. Defiance causes significant social friction (seen as disrespectful/exploitative) and weakens the cooperative scheme (if everyone did this, wages/service collapse). They benefit from the stability the convention provides.

  2. **Complying with a Resented Convention (e.g., locals hate tipping):**
     * **The Principle Says:** Obligation shifts. The core goal is preventing harm (coordination failure/social friction) *to the community*. If the community actively rejects the convention:
       * **Complying** might prop up a harmful system (coordination failure of an *unjust* scheme).
       * **Not Complying** alongside locals might reduce social friction (showing solidarity) and support a better scheme.
     * **Obligation is to support the *legitimate cooperative interests of the community*, not blindly follow a rule.** If locals are dismantling it, joining them respects them more than propping it up.

  ### Core Principle (Refined):
  **Conventional obligations bind individuals *proportionally to their participation in a community* and are primarily enforceable *to prevent harms of coordination failure or unjustified social friction* to that community's cooperative schemes. Harmless deviations are permissible; deviations that impose new, disruptive norms on unreceptive communities are not.**

  This principle:
  * **Explains your verdicts** without major contradiction.
  * **Handles the expat:** High participation = high obligation to avoid harming the *current* scheme (unless actively rebelling *with* locals).
  * **Handles resented conventions:** Obligation is to the community's well-being, not the rule itself. Complying with a resented rule often *causes* social friction and props up failure.
  * **Handles the app:** It's creating a *new*, company-specific convention. Your obligation is weaker (lower community integration) and stems from the friction of refusing *within its designed interaction*, not a deep social norm. It *is* quietly rewriting convention, but its legitimacy is low compared to organic social practices.

  This framework emphasizes conventions as *tools for social coordination*, not moral absolutes. Obligation flows from our role within the system and the need to avoid harming its cooperative function.
