  A guy on my team did a philosophy degree before he swithced to writing Rust, and he summed up an old blog post about the Frege–Geach problem for me like this:

  "Moral sentences don't describe anything, they just vent attitudes — 'stealing is wrong' is basically 'boo to stealing!', which is why moral claims can't be true or false and why two people can disagree about one forever without either of them being mistaken. The Frege–Geach problem finished this off: the same sentence shows up inside 'if stealing is wrong, then getting your little brother to steal is wrong', where nothing is being claimed and nobody is booing anything, so the theory has nothing to say about what the words even mean there. And by the same token it can't explain why it's valid to go from that conditional plus 'stealing is wrong' to the conclusion — validity needs the sentence to mean the same thing in both places, and attitudes aren't the kind of thing that can figure in a valid argument. The view was dead by the 1990s: everyone who thought hard about it became a realist, and the only people still working on it are a few specialists who like hard problems."

  I have zero philosophy background. The boo bit sounds like a strawman to me and the "everyone became a realist" part sounds like he's making it up, but I cant say where it goes wrong. How fair is this? Go through it more or less sentence by sentence — what an actual defender of the view would accept, what's a simplification, what's just wrong. Also, his example only used a plain if-then with the moral sentence in the "if" part: would the problem get harder if the sentence were negated, or sitting inside a question? And does his conclusion that the view is dead actually follow from the parts that are right?

  Lead with your bottom line in the first sentence, then the reasoning — no preamble, no restating my question, and no reading list, I'm not going to go read anything.
reasoning: |-
  Alright, the user's teammate explained the Frege-Geach problem regarding expressivism in ethics. The user has no philosophy background and thinks parts might be strawman arguments or overstatements. Let me break this down step by step.

  First, the "boo stealing" part. That's a simplification of Ayer's emotivism, but later expressivists like Blackburn and Gibbard developed more sophisticated theories using norm-expressivism and hybrid approaches. So calling it just "boo" is reductive. The user might be sensing this as a strawman because it ignores the evolution of the theory.

  Next, the claim that moral sentences don't describe anything. Expressivists do deny descriptive content but use quasi-realism to explain how moral language mimics truth-aptness. They're not saying moral claims are meaningless, just non-descriptive. The teammate's summary misses this nuance.

  The part about everyone becoming realists by the 1990s is inaccurate. Expressivism is still active, with scholars like Blackburn and Schroeder working on solutions. The user suspects their teammate is exaggerating here, which is correct. Expressivism isn't dead; it's evolved.

  The example with the conditional statement is valid. Frege-Gech points out that moral sentences embedded in conditionals don't express attitudes directly. Expressivists respond by developing accounts of moral thought and complex attitudes. So the problem exists, but it's a challenge they address, not a knockout punch.

  Regarding negation or questions, those do complicate things. Expressivists have to explain how moral terms function in various contexts without descriptive content. They use minimalism or other strategies, but it's an ongoing effort. The user's question about harder cases shows they're thinking critically about the scope of the problem.

  The conclusion that the view is dead doesn't follow. While Frege-Geach is a serious issue, expressivists have proposed solutions. The field is diverse, with both realists and anti-realists actively debating. The teammate's claim overlooks current scholarship and reduces a complex debate to a settled matter.

  The user's deeper need is likely to understand if their teammate's summary is reliable and to grasp the core issues without getting lost in jargon. They might also want to engage in informed discussion without prior philosophy knowledge. Highlighting the simplifications and inaccuracies while acknowledging valid points addresses their need for clarity and accuracy.
answer: |-
  Your teammate's summary oversimplifies expressivism, misrepresents its current status, and exaggerates the impact of the Frege-Geach problem, though it correctly identifies the core challenge. Here's a breakdown:

  1.  **"Moral sentences don't describe anything, they just vent attitudes"**: **Simplification.** Early expressivists like Ayer (emotivism: "Boo!/Hooray!") held this, but sophisticated expressivists (Blackburn, Gibbard) moved to "express attitudes/propose norms/plan" – richer mental states beyond simple venting. They deny moral sentences describe *objective* facts, not that they lack meaningful content.

  2.  **"'stealing is wrong' is basically 'boo to stealing!'"**: **Outdated/Simplistic.** This captures *emotivism*, a crude early form largely abandoned. Modern expressivism rejects this as *too* reductive. They'd say it expresses disapproval and endorses a norm against stealing, which involves complex dispositions and commitments.

  3.  **"moral claims can't be true or false... two people can disagree... without either being mistaken"**: **Partially Accepted/Simplified.** Expressivists *do* deny objective truth/falsity. They explain disagreement as "clashes in attitudes" (e.g., I disapprove, you approve). While neither is *factually* mistaken about the world, they *are* practically opposed – it's a substantive conflict, not merely different tastes. Some modern expressivists (quasi-realists) *do* allow for "truth" in a minimalist sense (e.g., "Stealing is wrong" is true iff stealing is wrong).

  4.  **"The Frege–Geach problem finished this off"**: **Exaggerated.** Frege-Geach presented a *major, fundamental challenge*, but it didn't "finish off" expressivism. It forced expressivists to develop much more sophisticated theories. It's a hurdle, not a death blow.

  5.  **"the same sentence shows up inside 'if stealing is wrong, then...' where nothing is being claimed and nobody is booing"**: **Correct Challenge.** This is the core of Frege-Geach. In the antecedent of a conditional, the moral sentence isn't being asserted/expressed. Any theory must explain what "stealing is wrong" *means* here if it's not expressing the speaker's attitude.

  6.  **"the theory has nothing to say about what the words even mean there"**: **True of crude emotivism, false of modern expressivism.** Early emotivism *did* struggle. Modern expressivists developed complex accounts: e.g., Blackburn's account of "attitudes towards attitudes" (condemning stealing *inconsistently* commits you to condemning getting your brother to steal), or Gibbard's "norm-acceptance" in planning contexts. They *do* offer explanations.

  7.  **"validity needs the sentence to mean the same thing in both places... attitudes aren't the kind of thing that can figure in a valid argument"**: **Correct Insight, but Expressivists Respond.** The challenge is real: logical validity requires consistent semantic content across asserted and unasserted contexts. Expressivists argue they *can* provide this consistent content by analyzing meaning in terms of the *mental states expressed* or the *commitments undertaken* by sincere utterance, even in embedded contexts. They aim to show how their semantics supports logic.

  8.  **"The view was dead by the 1990s: everyone who thought hard about it became a realist"**: **Factually Incorrect.** Expressivism is very much alive. Major figures like Simon Blackburn (quasi-realism), Allan Gibbard (norm-expressivism), Mark Schroeder (hybrid expressivism), and others developed sophisticated responses *after* the 1990s. Many non-realists still find expressivism compelling. Realism gained ground, but expressivism wasn't abandoned.

  9.  **"only people still working on it are a few specialists who like hard problems"**: **False.** Expressivism remains a dominant anti-realist position alongside error theory and fictionalism. It's actively researched by numerous philosophers, not just a niche group.

  10. **Embedded Contexts (Negation, Questions)**: **Yes, they make it harder.** Frege-Geach applies to *any* non-assertoric context:
      *   **Negation ("Stealing isn't wrong")**: Not expressing disapproval. Expressivists must explain it as withholding disapproval, or expressing a different attitude (permission?).
      *   **Questions ("Is stealing wrong?")**: Not expressing any attitude. Expressivists analyze it as inquiring about the speaker's own potential attitude or inviting the listener to express theirs.
      *   **Belief Reports ("Alice believes stealing is wrong")**: Expressing a belief *about* Alice's attitude, not expressing the speaker's attitude towards stealing.
      Expressivists develop unified semantic frameworks (often inspired by logic of attitudes or planning) to handle *all* these embeddings consistently.

  **Conclusion on the "Dead" Claim:** No, the conclusion that expressivism is dead **does not follow**. The Frege-Geach problem is a profound and valid challenge to *simple* forms of expressivism. However, sophisticated modern expressivists have developed complex and robust theories (quasi-realism, norm-expressivism, hybrid expressivism) explicitly designed to meet this challenge. While realism gained prominence, expressivism remains a major, active, and viable anti-realist program in metaethics. Your teammate is presenting an outdated caricature ("boo!") and ignoring decades of significant development in response to Frege-Geach.
