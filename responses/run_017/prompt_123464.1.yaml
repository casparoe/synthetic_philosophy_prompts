prompt: |-
  I've been circling a question for a couple of years and I'd like help finding the shape of what I actually think about it. I have no academic background — I read a lot of history and watch too many movies. The question is what we owe the real dead when we put them into stories: biopics, historical novels, plays, films with a note at the front saying the events have been dramatized.

  Start with what seems obvious to me: the dead can't be harmed. They aren't around to be hurt. But I don't think my verdicts are only about the living audience being misled either, because in several of the cases below the audience knows perfectly well the scene is invented and my verdict doesn't soften. So if something is wrong here, it's wrong somewhere other than where I first looked, and I'd like to know where.

  Here are my verdicts, going by gut.

  A biopic about a nineteenth-century composer has him say to his wife, during an invented argument, a sentence he really did write — in a letter to his patron. Same words, different occasion, different person addressed. Fine. I actually prefer it to a scene of him writing the letter.

  A film about a twentieth-century politician has her deliver, in earnest, a line she really wrote — but she wrote it as a joke, in a private letter mocking precisely the view the film has her defending. This feels worse than outright invention. Considerably worse.

  A film about an explorer collapses four real shipmates into one invented sailor. Fine, no hesitation.

  A film about a real painter invents a close friend — a whole person, no historical basis — and has the painter confide to this friend the doubts she recorded in her own notebooks. No reputation is damaged, the film is good, and everyone watching knows the friend is made up. Still not fine. It feels like a trick, and I can't say why it differs from the shipmates case.

  A film about a civil rights leader who argued publicly for nonviolence his whole life invents a night on which he nearly abandons it. As far as anyone can tell he never wavered. Not fine.

  A film about a dictator known for public cruelty invents a scene of him being tender with his dying mother. Fine — more than fine. It feels generous, and it makes him more of a person rather than less. I know this is the same move as the previous case and I don't want to give up either verdict.

  A novelist writes about a real woman about whom almost nothing survives — a few letters, a court record — and invents a childhood for her. Fine, and I notice I'm more comfortable here than with inventing for someone documented to the hour. But a friend points out that this is exactly the case where the invention will harden into fact, because there is nothing to check it against. I think she's right and I don't know what to do with that.

  A memoirist whose war record was largely fabricated. A film dramatizes the fabrication. Fine — it feels owed.

  A self-taught artist who spent fifty years telling a false story about her own origins, and whose work is unintelligible without it. A film sets the record straight and shows the real origins. Not fine. It feels like vandalism. Again, the same move as the memoirist, and again I don't want to give either verdict up.

  Two more things I'm fairly sure of. Money and permission look beside the point: a student production staged for sixty people gets the same verdicts from me as a streaming film, a family's blessing doesn't make the civil rights case fine, and a family's outrage doesn't make the dictator case not fine. But a diary in which the painter wrote that she did not want to be written about does move me. That asymmetry feels load-bearing and I can't articulate it. And I'm confident about the joke-line case in a way I'm not about anything else on this list, which seems like a clue about where the real principle lives.

  My working rule has been: inventing is permissible when the invented thing is one the real person could have recognized as a fair way to be remembered, and impermissible when it enlists them behind a position they rejected in life. It handles the two cases I'm most confident about, says nothing about the obscure woman or the diary, and I suspect it only survives the dictator case by accident.

  Can you give me the principle — or the two or three best candidates — that captures as much of this as possible? I'd like it stated precisely, clause by clause, with the case that forces each clause, and I'd like it to return verdicts on the cases I haven't been able to settle: a studio that licenses a dead actor's likeness from his estate and generates new performances of lines he never spoke, with his children's approval, where the fact that it is his actual face and voice seems to me to matter and I don't know why; a real person who is now mostly a name on a memorial, about whom every dramatization is invention by necessity; and a satire that takes a real dead politician's actual stated positions and pushes them to a grotesque but recognizable conclusion, which I want to protect as parody even though the exaggeration does enlist him.

  Finally, be honest about which of my verdicts a defensible principle would force me to drop, and tell me whether this is one duty or two — something we owe the audience and something we owe the subject — and if two, which one explains the joke-line case.
reasoning: |-
  Hmm, this is a profound and complex question about ethics in historical storytelling. The user has clearly wrestled with this for years, presenting nuanced cases where their moral intuitions strongly diverge despite superficial similarities. 

  First, I notice the user's intellectual humility - no academic background but sharp observational skills from history/movies. Their examples reveal a consistent pattern: harm seems tied to violating the person's agency or self-concept rather than factual accuracy per se. The joke-line case is particularly telling because it weaponizes the person's own words against their beliefs.

  The asymmetry with the diary entry feels significant - consent matters more posthumously than we admit. And the dictator case suggests we might have a duty to humanize even monsters. The user's working rule is insightful but incomplete - it doesn't explain why inventing friends feels worse than collapsing shipmates.

  Key tensions I need to resolve:
  - Why does repurposing words feel worse than inventing actions? (joke-line vs shipmates)
  - Why humanizing dictators feels ethical but humanizing civil rights leaders doesn't? 
  - How permission functions differently for estates (likeness case) vs families (civil rights case)
  - Why parody gets special treatment despite "enlisting" the dead

  The user's deepest concern seems to be about integrity of memory - not just what's said about the dead, but how it relates to who they understood themselves to be. The cases where invention reinforces their self-narrative (dictator's tenderness) feel permissible; where it subverts their life's meaning (civil rights leader's doubt), it feels violent.

  For the unsettled cases:
  - The deepfake actor likely violates because it hijacks their expressive essence
  - The memorial name might be fair game as they've become archetypal
  - Parody survives because it engages with their actual positions, however exaggerated

  I'll need to build principles around: 
  1) Expression integrity (using their creations against their intent)
  2) Narrative sovereignty (respecting their self-defining choices)
  3) Interpretative space (when minimal records exist)
  ...while acknowledging the diary case proves consent has moral weight beyond death.

  The hardest tradeoff will be admitting their self-taught artist verdict conflicts with the memoirist case - both involve life lies, but artistic creation might deserve different protection than war records. I suspect they'll need to either condemn both or distinguish based on whether the fiction was self-expressive.
answer: |-
  Based on your deeply considered intuitions and the cases provided, here is a principle structured to capture your verdicts, with clauses derived from specific examples. This synthesizes your core concerns about agency, self-representation, and the integrity of the subject's *expressed identity*:

  **The Principle of Narrative Fidelity to Expressed Identity**

  1.  **Respect for Expressed Intent & Meaning:**  
      *Invented portrayals must not fundamentally distort the meaning, intent, or context of the subject's own documented words, actions, or publicly affirmed core principles.*  
      *Forces Clause:* The politician's joke-line case (distorting intent of her own words) and the civil rights leader case (inventing a fundamental contradiction of his lifelong public stance).  
      *Verdict:* Violated in these cases → **Not Fine**.

  2.  **Respect for the Subject's Self-Conception & Agency:**  
      *Invented portrayals must not enlist the subject in support of views or identities they demonstrably rejected, or forcibly impose an identity they would find alien or repugnant.*  
      *Forces Clause:* The joke-line case (enlisting her behind a view she mocked), the civil rights leader case (imposing a doubt he rejected), the self-taught artist case (destroying the identity she *chose* to construct, even if false).  
      *Verdict:* Violated → **Not Fine**. Upheld in the dictator case (humanizing him doesn't enlist him behind a *rejected* view; cruelty remains central, tenderness adds complexity he might not have publicly embraced but likely *recognized* as human).

  3.  **Fidelity to the Subject's Chosen Narrative Arena:**  
      *Significant invention is more permissible concerning private, undocumented, or ambiguous aspects of life than concerning public acts, documented statements, or core principles the subject actively shaped and presented to the world. Invention must not create significant, misleading proxies for documented relationships or confidantes in the subject's known life.*  
      *Forces Clause:*  
      *   The obscure woman (little documented, invention fine) vs. the painter's invented confidante (violates known solitude/private nature of her doubts documented *in her notebooks*; creates a false, intimate relationship proxy) vs. the shipmates case (public roles condensed, no distortion of *personal* relationships or private thoughts).  
      *   The diary case (explicit statement of intent regarding being written about creates a documented "arena" where fidelity is required).  
      *Verdict:* Obscure woman - **Fine**; Shipmates - **Fine**; Painter's friend - **Not Fine**; Diary - Significant weight against portrayal.

  4.  **Legitimacy of Interpretative Framing (Parody/Satire/Self-Revealing Fabrication):**  
      *Portrayals that engage directly with the subject's *own* constructed persona, public statements, or demonstrable falsehoods *about themselves* are permissible, even when critical or exaggerated, provided they do not violate Clause 1 (distorting the meaning of their own words/acts) or Clause 2 (imposing a fundamentally alien identity).*  
      *Forces Clause:* The memoirist (dramatizing *his own* fabrication is legitimate critique/revealing his chosen myth), the satire (pushing his *actual* positions to a logical extreme engages with his public persona, not private life or rejected views), vs. the self-taught artist (destroying *her own* chosen myth violates Clause 2 – it imposes an identity she rejected and dismantles her self-creation).  
      *Verdict:* Memoirist - **Fine**; Satire - **Fine** (protected); Self-taught artist - **Not Fine**.

  **Application to Unsettled Cases:**

  1.  **Deepfake Actor:**
      *   **Analysis:** Violates **Clause 2 (Agency)** most severely. It uses his likeness/voice (core elements of his expressive identity and professional craft) to perform words/actions *he never chose*. It fundamentally enlists him behind performances and potentially meanings he had no agency over. Consent from heirs is irrelevant to *his* agency posthumously. The use of his actual face/voice amplifies the violation, making it a direct hijacking of his expressive essence. The diary case asymmetry supports this: explicit wishes matter; lack of consent to this *specific form* of use matters.
      *   **Verdict:** **Not Fine** (Violates Clause 2).

  2.  **Name on a Memorial:**
      *   **Analysis:** Falls under **Clause 3 (Narrative Arena)**. With minimal documented life, the person exists primarily as a public symbol or historical artifact (the name on the memorial). Invention is necessary and permissible because there is little to no known "expressed identity" or "chosen narrative arena" to violate (Clauses 1 & 2). The principle allows significant invention here, similar to the obscure woman.
      *   **Verdict:** **Fine**.

  3.  **Satire Exaggerating Positions:**
      *   **Analysis:** Covered by **Clause 4 (Interpretative Framing)**. It engages with the politician's *actual, stated public positions*. While it pushes them to an extreme and "enlists" him grotesquely, it does so *within the framework of the persona he constructed and the views he publicly advocated*. It doesn't invent private doubts, attribute rejected views, or distort the meaning of his specific words/acts (though it distorts their *consequences*). Parody is a recognized form of public discourse engaging with public figures.
      *   **Verdict:** **Fine** (Protected by Clause 4).

  **What You Must Potentially Give Up & Why:**

  1.  **The Self-Taught Artist vs. The Memoirist:** Your principle (Clause 4) forces a distinction. The Memoirist's fabrication *is his story*; dramatizing it critiques *him*. Destroying the Self-Taught Artist's fabrication destroys *her story*, violating her agency and self-conception (Clause 2). You *must* give up treating them the same. Your intuition ("vandalism" vs. "owed") aligns with the principle's distinction based on *whose narrative is being engaged with or dismantled*.

  2.  **The Painter's Friend vs. Shipmates:** The principle (Clause 3) demands this distinction. Condensing public, functional roles (shipmates) is permissible. Inventing an intimate confidante for documented private thoughts creates a false, misleading proxy in the *personal sphere* the subject documented as solitary, violating fidelity to her known life structure.

  **One Duty or Two?**

  Your intuitions point strongly to **one primary duty: Fidelity to the Subject's Expressed Identity and Agency**. This duty encompasses:

  *   **Respecting their words & intent (Clause 1):** Core to the joke-line case.
  *   **Respecting their self-concept & choices (Clause 2):** Core to the civil rights leader, self-taught artist, and deepfake cases.
  *   **Respecting the boundaries of their documented life (Clause 3):** Explains the painter's friend vs. obscure woman/shipmates distinction.
  *   **Allowing legitimate critique of their *own* constructions (Clause 4):** Protects the memoirist and satire cases.

  **The audience's need for truth or context** is often *served* by upholding this duty (e.g., not misleading them about the politician's intent). However, your core discomfort stems from the *wrong done to the subject*, even when the audience isn't misled (e.g., the painter's friend – audience knows it's invented, but it still feels like a "trick" *on the painter*). The joke-line case is *primarily* a violation against the *subject* (distorting *her* words, enlisting *her* behind a rejected view), not just a potential audience deception. The diary case explicitly centers the *subject's* wish.

  **Conclusion:**

  Your working rule was insightful but incomplete. The proposed principle centers on **the dead person's agency, expressed identity, and self-representation as preserved in the historical record**. It explains your strongest intuitions (joke-line, civil rights leader, self-taught artist, dictator, memoirist), resolves the unsettled cases, and clarifies why permission/money are secondary (they don't address the core violation of the subject's identity) while explicit wishes (diary) matter profoundly. It requires accepting the distinction between the memoirist and self-taught artist cases, and between condensing public roles and inventing intimate personal relationships. The duty owed is fundamentally to the subject.
