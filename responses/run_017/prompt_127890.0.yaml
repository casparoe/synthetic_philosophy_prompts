  | Explain NFL-Hume resemblance *and* difference | 5 | Clearly states NFL’s formal equivalence under permutation-closure parallels Hume’s regress, *and* identifies Humean uniformity as global/metaphysical vs NFL’s technical/domain-relative commitment. | Notes resemblance but vague on difference (e.g., calls both "assumptions" without distinction). Award 3–4. | Screens: Stock (i) "NFL=Hume mathematical". |  
  | Apply Lemma 1 to distinguish commitments | 6 | Uses Lemma 1 to show permutation-closure is weaker/flexible (e.g., orbits allow local biases without global uniformity), directly contrasting with Hume’s principle. | Notes Lemma 1 breaks NFL but does not analyse *how* this weakens vs Hume. Award 4. | Screens: Stock (ii) "NFL irrelevant due to structure". |  
  | Apply Lemma 2 to critique uniform prior | 6 | Argues uniform prior is biased towards incompressibility (Lemma 2), showing it contradicts Hume’s aim (privileging regularity) and is not assumption-free. | Mentions incompressibility but does not link to Hume’s goal or neutrality. Award 4. | Screens: Stock (iii) "just adopt a prior" without regress. |  
  | Synthesise: NFL generalises Hume | 5 | Concludes NFL shows *any* learning needs bias (weaker than Hume), making scepticism broader; uses both lemmas to reject equivalence claims. | Partial synthesis (e.g., "different but both sceptical") without generalisation. Award 3. | Screens: Misreading Lemma 1 as endorsing structure-solves-all. |  
  | Implications evaluation (Part c) | 3 | Distils how NFL sharpens scepticism (bias unavoidable, uniform prior fallacious) while explaining practical success (exploiting contingent biases). | Superficial (e.g., "NFL still sceptical"). Award 1–2. | Screens: Claims Lemma 2 "solves" Hume. |  

  **Total: 25 marks**  

