  1. If the answer **does not engage with Lemma 1 or Lemma 2** (e.g., mentions them in passing without analysis), **cap total at 12 marks**.  
  2. If the answer **equates NFL’s commitment with Humean uniformity without addressing Part (b) distinctions**, **cap total at 15 marks**.  
  3. If the answer **uses any of the three blocked stock moves** (i, ii, or iii) **as primary rebuttals**, **cap total at 12 marks**.  

