prompt: |-
  I'm not an academic — I came at this from a practical place. I'm filling in an advance directive (the form where you say what you want to happen later if you can't decide for yourself anymore), and its got me stuck on one thing: how much should present-me defer to future-me? A friend mentioned something in philosophy called the Reflection principle: roughly, if you somehow knew that your future self would end up 70% confident in something, you should be 70% confident now. That strikes me as either very deep or obviously wrong, and I can't tell which.

  I've got a couple months of evenings before I need to sign, and I'd rather spend them on the part that actually decides my question. So: which of the open questions around Reflection is worth my time? Ones I've run into, in my own words:

  - is it a basic rule of rationality, or does it just fall out of some other rule (in which case I should go look at that other thing)?
  - does it apply when future-me simply knows more, or also when future-me has changed — forgotten things, been talked into something, gone foggy, started caring about different stuff?
  - does violating it make you irrational, or just exploitable in the "money pump" / betting sense — and does that difference matter for what I write on the form?
  - what if the "future self" is only loosely me: me after a stroke, or the version of me that my family and doctors will be reading this form back to?
  - is this even about belief at all, or is it really about commitment and planning?

  Add whatever I've missed. Then rank them: which one or two are upstream of the others, which are cheap enough that I can settle them myself in an evening, and which are gadgets that won't change what I actually sign. Commit to an ordering and give me your reasons rather than laying out the menu — and tell me where you're guessing versus where there's a settled answer I should just take.
reasoning: |-
  Okay, let me start by really understanding what this user is asking. They're filling out an advance directive and are stuck on how much their present self should defer to their future self. They mentioned the Reflection Principle in philosophy, which says that if your future self is 70% confident in something, you should be 70% confident now. They find this either profound or obviously wrong and need help figuring out which open questions around Reflection are worth their time.

  First, I need to unpack their listed questions. They have five main points: whether Reflection is basic or derived, if it applies when future-me knows more or has changed, if violating it makes one irrational or exploitable, how future-me is defined (like after a stroke), and whether it's about belief or commitment. They want these ranked by importance, upstream relevance, and practicality for their form.

  The user is non-academic but thoughtful, coming from a practical angle. Their main goal is to make a decision for their advance directive. They have limited time—just a couple of months of evenings—so efficiency is key. They want to focus on what directly impacts their signing, avoiding deep philosophical dives unless necessary. 

  Looking at their questions, the core issue is about identity and values over time. The Reflection Principle is usually about beliefs and evidence, but in an advance directive, it's more about values and preferences. The user might be conflating belief with value judgments. For example, future preferences might change due to new experiences or cognitive decline. The Reflection Principle in epistemology might not directly apply here, which is a crucial insight.

  Ranking their questions: The most upstream issue is whether the principle applies when the future self has changed. If future-me has dementia or different values, does present-me defer? This affects all other aspects. Next is the definition of "future self"—after a stroke, is that still "me"? This ties into identity and decision-making authority. The other questions, like whether Reflection is basic or about exploitability, are less critical here because they're more about belief coherence, not values in an advance directive.

  The user needs practical advice. They should focus on what version of their future self they're planning for. If they expect cognitive decline, they might prioritize their current values. If they trust their future self's judgment, they might leave more discretion. The Reflection Principle as discussed in philosophy might not resolve their dilemma because it's about beliefs, not values. Instead, concepts like transformative experiences or precedent autonomy in medical ethics are more relevant.

  They should consider scenarios: dementia, stroke, coma. How much do they trust their future self in each? The advance directive should specify conditions clearly. Also, involving trusted proxies who understand their values could be more important than philosophical principles. 

  In conclusion, the user should spend time on the identity and values question, as it's foundational and directly impacts their form. The other questions are less urgent for their practical needs. Recommending they reflect on their core values and potential future states, rather than getting caught in philosophical debates, would be the most helpful approach.
answer: |-
  Based on your practical need and timeline, here's the prioritized ranking of your questions about the Reflection Principle (RP), tailored for your advance directive decision. I'll commit to an order, explain why, flag settled vs. open issues, and tell you what matters **most** for signing that form:

  1.  **Does this apply when future-me has *changed* (forgotten, foggy, different values), or only when they simply *know more*?**
      *   **Why Ranked #1 (Most Upstream & Critical):** This is the **core conflict** for advance directives. RP *assumes* your future self is a "rational successor" with the same core epistemic goals/values, just with more evidence. But illness (dementia, stroke, coma) fundamentally *breaks* that assumption. Future-you might have lost critical memories, reasoning abilities, or even core values (e.g., post-stroke personality changes). RP, in its standard form, **does not automatically apply here.** Philosophers debate "transformative experiences" and "precedent autonomy" (your current right to bind your future self) precisely for these cases. **For your form, this is THE question:** Are you planning for a *more informed* you or a *fundamentally compromised/different* you?
      *   **Settled?** **No.** Deeply contested. Key concepts: "Transformative Experience" (L.A. Paul), "Precedent Autonomy" (Medical Ethics/Bioethics), "Identity over Time" (Derek Parfit). Don't get lost in the weeds, but *grasp the core tension*.
      *   **Impact on Form:** **Highest.** This directly determines *what kind of instructions* you write (highly specific vs. granting discretion) and *who* you trust to interpret them (strict adherence vs. substituted judgment by a proxy).

  2.  **What if the "future self" is only loosely me (after stroke, the version my family/doctors interpret)?**
      *   **Why Ranked #2 (Directly Follows #1 & Highly Practical):** This *is* #1 made concrete for your situation. RP talks about *your* future belief. But in an advance directive:
          *   After a stroke, is that *still "you"* in the sense RP requires?
          *   The "future self" making decisions is often *not you at all*, but your healthcare proxy/family *interpreting* your document *as they believe "future-you" *would* have wanted* or *as they believe "current-you" stated*. RP completely breaks down here – it wasn't designed for proxies interpreting static documents.
      *   **Settled?** **Effectively Yes for Your Purpose.** RP **does not directly apply** to proxies interpreting documents. They are guided by your written wishes, their knowledge of your values, and their own judgment (ideally following your directive and state laws).
      *   **Impact on Form:** **Critical.** This clarifies that your document is **primarily a communication tool for *others***. Focus on clarity, scenarios, appointing a trusted proxy who understands *your current values*, and specifying how strictly they should follow your words vs. exercise judgment for unanticipated situations. Forget RP for the proxy; think clear communication and trust.

  3.  **Is this even about belief, or really about commitment/planning?**
      *   **Why Ranked #3 (Crucial Reframing):** You've hit the nail on the head. **Standard RP is fundamentally about *belief* and *evidence*.** But an advance directive is primarily about **values, preferences, and commitment.** You're not predicting future medical facts (though that plays a role); you're stating your *current values* about future quality of life and treatment, and *committing* to them being followed when you can't speak. This is closer to "Ulysses Contracts" (binding yourself against future weakness) than pure belief updating. *This reframing helps you escape the RP trap.*
      *   **Settled?** **Yes, for Your Purpose.** While RP's *foundations* tie belief to planning, the core application of RP *itself* is epistemic (belief). Your task is practical commitment based on values. **Shift focus.**
      *   **Impact on Form:** **High Clarity.** Understanding this frees you from trying to "predict" your future beliefs rationally. Instead, focus on: "What are my core values *right now* regarding life, suffering, and medical intervention? How strongly do I want these *current values* enforced, even if future-me-in-illness might (irrationally or due to impairment) want something different?" This is the heart of your directive.

  4.  **Is RP a basic rule or derived? / Does violating it make you irrational or just exploitable?**
      *   **Why Ranked #4 (Less Direct Impact):** These are important *academic* questions about RP's status in formal rationality. RP can be derived from more fundamental axioms (like coherence/avoiding Dutch Books - the "money pump" exploitability). Violating it *does* arguably make your belief system incoherent and exploitable *in betting scenarios*. However...
      *   **Settled?** **Mostly Settled (in its domain).** Within standard Bayesian models of rational belief updating over time *with the same epistemic agent*, RP is well-established as a *consequence* of core rationality principles (avoiding sure loss, conditionalization). Violating it *is* irrational in that specific, technical sense and makes you exploitable.
      *   **Impact on Form:** **Low.** Your advance directive isn't about placing coherent bets on future beliefs. It's about values and commitment in the face of potential radical change (#1 & #2) and communicating with proxies (#2). Knowing RP is derivable and violators are exploitable *in belief* doesn't resolve your core dilemma about compromised future selves or proxy interpretation. Don't spend evenings here.

  5.  **Cheap/Self-Settlable:** None truly fit "cheap" in an evening due to conceptual depth, but #3 (Belief vs. Commitment) is the easiest to *grasp* and *apply* practically. Recognizing the difference instantly clarifies your task.

  **Your Action Plan for the Form (Forget RP as your main tool):**

  1.  **Focus on Values & Scenarios:** Spend most time deeply reflecting on **your current values** regarding life-prolonging treatment, quality of life, suffering, and dignity in *specific scenarios* (e.g., permanent coma, severe dementia, terminal illness with pain). What interventions align or conflict with these values *now*?
  2.  **Define "Future-Me" Boundaries:** Decide **under what conditions** you want your *current* values strictly enforced vs. allowing discretion. Example: "If I have advanced dementia and cannot recognize loved ones, I do not want..." vs. "For temporary, treatable conditions, I want full treatment." This addresses the *change* question (#1) practically.
  3.  **Choose and Empower Your Proxy:** Select someone who deeply understands *your current values and personality*. Have explicit conversations. Specify in the document whether they should follow your instructions *literally* or use *substituted judgment* ("what would *he/she want* if they could speak right now?"). This supersedes the proxy-as-future-you problem (#2).
  4.  **Embrace Commitment:** Accept that you are making a **commitment** based on **current values** (#3). You are not primarily predicting future beliefs. Your goal is to ensure care aligns with who you are *now*, especially if future-you is compromised. This is the essence of precedent autonomy.

  **In short:** The Reflection Principle is a fascinating tool for *belief coherence over time*, but it's the wrong hammer for the advance directive nail. Your core challenge is **precedent autonomy in the face of potential identity-compromising change and proxy interpretation.** Focus your evenings there. Rank #1 (Change) and #2 (Proxy Reality) are the upstream forks in your decision path. Rank #3 (Commitment vs. Belief) is the crucial reframing that liberates you from the RP puzzle. The rest (#4) is philosophical machinery irrelevant to signing your form wisely.
