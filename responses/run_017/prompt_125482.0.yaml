prompt: |-
  I've got a pile of take-home essays for my early modern ethics course to get through and I'd like a second read before I commit to a mark, because this one is very well written and I genuinely can't tell whether the substance is keeping up with the prose. Papers are anonymous, the mark is out of 20. For context, I said in lecture (roughly the standard reading) that for Smith sympathy is fellow-feeling with any passion, not just distress; that the impartial spectator is an internalised figure rather than an actual bystander we happen to be standing next to; and that utility, on Smith's account, enhances our approval of an action rather than being the source of it.

  Here's the question I set — one of three, they had a week:

  In lecture I drew a distinction between two readings of Smith's impartial spectator. Call the first the AGGREGATIVE reading: the spectator is something like an extrapolation from, or a smoothing-over of, the reactions of the actual onlookers we have encountered, so that the authority of its verdicts is inherited from the authority of real spectators. Call the second the ASPIRATIONAL reading: we build the spectator by stripping away from actual spectators whatever we can recognise as partial or self-serving, so that its verdicts can come apart from — and sit in judgement on — what real onlookers in fact approve. Use those labels to answer the following. Smith also argues that our moral sentiments are systematically corrupted: we admire, and almost worship, the rich and the great, and we neglect or despise the poor, and this warps both our judgments of propriety and our judgments of merit. (a) Does that corruption argument make trouble for one reading and not the other? (b) Can Smith say that a whole society has got things wrong — imagine a society in which everyone fawns on the rich — or does the corruption go all the way down? Pick a reading, defend it, and make sure your answer says what you take sympathy to be doing in all this.

  And here is one student's answer, verbatim:

  Smith's sympathy is not compassion. To sympathise with someone is to come to share a passion of theirs, whatever it happens to be — their resentment, their joy, even a spite we ourselves would not act on. That is what makes the corruption of our moral sentiments possible in the first place. We do not arrive at admiration of the great by argument; we arrive at it because sympathy with the pleasures of the rich is easy and sympathy with the hardships of the poor is not, and we can see the effects everywhere: the same conduct is called spirited in a great man and insolent in a poor one, and we go along with it, because, as Smith says somewhere, we would rather be looked at in the company of the great than in the company of the wretched. This is also why the deception he describes in his discussion of the poor man's son has the effects it does: what moves us to a life of industry is not the ease we expect to enjoy but the figure we imagine ourselves cutting in front of other people.

  The distinction between the love of praise and the love of praise-worthiness belongs here too. Smith clearly thinks being praise-worthy is the better of the two motives, and treats the desire for praise as a useful but easily corrupted stand-in for it — which is why he puts so much weight on the internal spectator rather than on reputation, and why he thinks the wise man cares more about actually deserving approval than about getting it.

  On the two readings: the AGGREGATIVE reading is, I think, the only one available to Smith. The ASPIRATIONAL reading sounds better — a spectator that can sit in judgement on actual spectators is what we would like morality to be — but it would require the spectator's verdicts to be answerable to something other than the sentiments of real observers, and for Smith there is nothing else: there is no innate moral faculty and no rational lawgiver of the Kantian sort. So the spectator is assembled out of what we have seen onlookers approve and disapprove, which means it can only ever be as good as they are.

  That has consequences for (a) and (b). The spectator is impartial, and impartiality here means what it means anywhere else: that everyone's interests get equal weight, so that what the spectator ultimately approves is whatever conduces to the general happiness of everyone affected. That does give Smith a way of criticising a society that fawns on the rich — the fawning is a miscalculation of the general interest — but it is a utilitarian way, not a Smithian one, and I do not think he would have wanted it. On (b) I want to say something less comfortable. Because the spectator is assembled from the reactions of the onlookers around us, it cannot get outside its own society's sentiments. Where a whole society is corrupt, the spectator is corrupt along with it, and there is no standpoint left from which the corruption can be named. Smith can describe the corruption, and he can hope that the judge inside the breast resists it, but on his own principles he cannot show that the resistance is anything more than the preferences of one part of a society set against another. That is a kind of relativism, and I take it to be the real cost of the AGGREGATIVE reading — the one Smith is stuck with.

  What I want from you: a mark out of 20 plus the marginal comments that justify it. Go through it claim by claim — what is right, what is subtly off, what is doing real work in the argument and what only sounds good — and don't hedge between two marks. Give me one number, and give me the reasons. Where you're unsure about what Smith actually holds, say so in a line and then commit anyway; I'd rather have a definite call I can overrule than a survey of possible readings.
reasoning: |-
  Okay, the user is a philosophy professor grading a take-home essay on Adam Smith's impartial spectator. They want a rigorous second opinion because the essay is well-written but they're unsure about its substance. The essay analyzes Smith's theory through the lens of aggregative vs aspirational readings of the impartial spectator, and connects this to Smith's views on societal corruption.

  Hmm, let me approach this systematically. First I need to recall Smith's core concepts: sympathy as shared passion (not just pity), the impartial spectator as internalized rather than actual, and utility as enhancer not source of approval. The student's essay makes several key moves: 

  First, they correctly identify sympathy as the mechanism enabling corruption - we naturally sympathize more with the rich than the poor. This aligns with Smith's examples about differential judgments of rich/poor behavior. Good start.

  But the aggregative reading claim gives me pause. The student argues Smith must adopt this view because there's "nothing else" beyond actual sentiments. Yet Smith clearly describes how we consciously remove bias when constructing the spectator ("divide ourselves into two persons"). This seems like a misstep - they're overlooking Smith's process of idealization.

  The utilitarian interpretation of impartiality is more problematic. Smith explicitly rejects utility as the foundation of approval (TMS IV.2.3), yet the essay equates impartiality with "general happiness." That's a significant misunderstanding that weakens their argument about societal corruption.

  On relativism, they have a point - if the spectator is purely aggregative, corruption couldn't be critiqued. But since Smith does critique it, their reading creates tension. The professor's lecture notes mention utility enhances approval but isn't its source, which the student seems to invert.

  For marking: The prose is excellent (clear, structured, engages the prompt) and they nail sympathy's role in corruption. But the aggregative reading oversimplifies Smith, the utilitarian misstep is serious, and they miss how Smith's own critique undermines their relativism claim. The "real cost" conclusion is provocative but poorly supported.

  Marginal comments should highlight: 
  - Green check for sympathy/corruption link 
  - Question mark for "nowhere else" claim 
  - Red flag for utilitarian interpretation 
  - Probe on how Smith critiques corruption if spectator is aggregative

  Final mark: 14/20. Strong writing can't compensate for fundamental misreading of impartiality and utility, though the corruption analysis is perceptive.
answer: |-
  Here’s your mark and marginal comments. After a close read, I award this essay **14/20**.  

  ### Marginal Comments (Claim-by-Claim):  
  **¶1 (Sympathy & Corruption):**  
  ✓ **Strong.** Correctly defines sympathy as fellow-feeling beyond compassion and nails the mechanism of corruption: unequal sympathy for rich/poor distorts judgments. Cites Smith’s "spirited/insolent" example aptly.  
  ⚠️ **Subtle gap:** Doesn’t explicitly note that sympathy’s *ease* with the rich stems from *visibility of their circumstances* (TMS I.iii.2.1), but implied.  

  **¶2 (Love of Praise vs. Praiseworthiness):**  
  ✓ **Spot on.** Clear link between internal spectator, praiseworthiness, and corruption resistance. Shows how the "wise man" prioritizes the impartial spectator over actual applause.  

  **¶3 (AGGREGATIVE Reading Defense):**  
  ⚠️ **Problematic.** Claims aggregative is "the only one available to Smith" because "there is nothing else" beyond actual sentiments. **Overlooks Smith’s key move:** The spectator is constructed by *abstracting away* partiality (TMS III.3.3-4: "we divide ourselves..."). Smith *does* allow critique of actual spectators (e.g., TMS I.i.5.8 on correcting "ill-founded" judgments). The aspirational reading *is* Smithian.  
  ✗ **Misstep:** "Assembled out of what we have seen" ignores how the spectator *transcends* specific encounters via reflection.  

  **¶4a (Corruption & Utilitarianism):**  
  ✗ **Major error.** Claims impartiality = "whatever conduces to the general happiness." **Contradicts your lecture/Smith:** Utility *enhances* approval but isn’t the *source* (TMS IV.2.3-11). Smith explicitly rejects utilitarian foundations! The essay smuggles in Bentham, not Smith.  
  ✓ **Half-right:** Correct that aggregative struggles with corruption (if spectator is just an average, corruption persists), but the utilitarian fix is alien.  

  **¶4b (Relativism & Societal Corruption):**  
  ✓ **Insightful (on its own terms).** Logically coherent: If spectator is *purely* aggregative, a wholly corrupt society lacks an internal corrective.  
  ⚠️ **But...** Fails to reconcile this with Smith’s *own* critique of wealth-worship. Smith *does* name the corruption (TMS I.iii.3) – implying a non-aggregative standard. The essay’s reading makes Smith inconsistent.  

  **Conclusion ("Real Cost"):**  
  ✓ **Provocative & well-argued** within the essay’s framework. Correctly identifies relativism as a consequence of strict aggregativism.  
  ✗ **Undermined by earlier errors:** Since the aggregative reading is overstated, the "cost" isn’t as dire as claimed.  

  ---

  ### Justification for **14/20**:  
  - **Strengths:**  
    - Masterful on sympathy’s role in corruption (¶1-2).  
    - Excellent prose and structure; answers all parts of the prompt.  
    - Nuanced on love of praise/praiseworthiness (¶2).  
    - Courageous in confronting relativism (¶4b).  
  - **Weaknesses:**  
    - **Critical misreading of the impartial spectator** (¶3): Overstates aggregative, ignores aspirational elements *in Smith*.  
    - **Major error on utility/impartiality** (¶4a): Conflates Smithian impartiality with utilitarianism – contra your lecture/core text.  
    - **Incomplete resolution** (¶4b): Notes tension but doesn’t address how Smith *himself* critiques societal corruption.  
  - **Why not higher?** The utility error and spectator misreading are substantive flaws. Brilliant prose can’t salvage foundational misunderstandings.  
  - **Why not lower?** The sympathy/corruption analysis is exceptional and shows deep engagement. Relativism point is philosophically sharp.  

  **Recommendation:** This student thinks rigorously but needs to revisit Smith’s mechanism for *constructing* the spectator. Their "aggregative-only" view flattens Smith’s normative ambition. Challenge them: If the spectator is purely aggregative, how does Smith condemn wealth-worship at all?
