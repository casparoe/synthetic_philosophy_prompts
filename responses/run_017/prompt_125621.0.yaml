  First, I need to accurately restate Simpson's paradox in literary terms. The core elements are: subgroups as chapters/subplots, treatment arms as structural choices, and the reversal between local and global effects. I'll map the statistical components to craft concepts - subgroup improvement vs overall worsening becomes individual chapters working but the whole failing, shifting subgroup mix as unequal chapter lengths or POV distribution.

  For the residue report, I'll need to carefully evaluate:
