  ### Decision Tree for the Heterogeneity Problem in Hedonism

  This decision tree addresses the heterogeneity of pleasures (e.g., cold beer, finishing a proof, hearing a friend is safe, scratching an itch, getting lost in music) by posing concrete questions. Each node is a claim or case answerable without theory knowledge, based on logical possibilities. The tree has 7 questions and 8 leaves. Named positions are used where standard (e.g., felt-quality, attitudinal, neurofunctional, pluralism, eliminativism); others are marked "unnamed." The attentional profile view (defended view) is placed honestly.

  #### Decision Tree:
  1. **Must every pleasure feel good to you at the time you are having it?**  
     - *Yes*: Go to 2.  
     - *No*: Go to 3.  

  2. **Can two pleasures feel completely different (no shared "tone") yet still be ranked as one greater and the other lesser?**  
     - *Yes*: Leaf: **Felt-quality view** (standard: e.g., Sidgwick, with hedonic tone as a unified, scalable feeling).  
     - *No*: Leaf: **Unnamed** (strict felt-quality: pleasures share an invariant feeling, and comparison requires shared tone; rare and possibly incoherent).  

  3. **Can a state be a pleasure even if, at the time, you dislike being in it and would stop it if you could?**  
     - *Yes*: Go to 4.  
     - *No*: Go to 7.  

  4. **Can two pleasures with no introspectively shared "tone" be ranked as greater and lesser?**  
     - *Yes*: Go to 5.  
     - *No*: Go to 6.  

  5. **Must whatever unifies pleasures show up in your experience at all?**  
     - *Yes*: Go to 8.  
     - *No*: Leaf: **Neurofunctional common-currency view** (e.g., Cabanac, where pleasure is a unified neurobiological signal, like dopamine reward, not necessarily experienced).  

  6. **Are there multiple fundamental kinds of pleasure, with no single unifying feature?**  
     - *Yes*: Leaf: **Pluralism** (e.g., Parfit, with distinct pleasure-types like sensory, intellectual, relational).  
     - *No*: Leaf: **Eliminativism** (e.g., Rylean-inspired; "pleasure" is a misleading folk term; no unified category exists).  

  7. **Is pleasure identical to having a positive attitude (e.g., wanting the state to continue)?**  
     - *Yes*: Leaf: **Attitudinal view** (e.g., Feldman, where pleasure is an attitude of liking, not a feeling).  
     - *No*: Leaf: **Unnamed** (attitude-dependent: pleasure requires but isn't identical to a positive attitude; unexplored).  

  8. **Is the unifying feature attentional (i.e., pleasures draw attention back to themselves and resist being released)?**  
     - *Yes*: Leaf: **Unnamed (attentional profile view)**.  
     - *No*: Leaf: **Unnamed (other experiential view)**.  

  #### Commentary on Flags and Empty Cells
  - **Inseparable pairs**: None. All leaves are separated by unique paths (e.g., felt-quality [Leaf 2] vs. attitudinal [Leaf 7] are distinguished by Q1 and Q3).  
  - **Unoccupied cells and reasons**:  
    - **Leaf 2 (Unnamed: strict felt-quality)**. *Reason*: Incoherent. If pleasures *must* share a feeling (Q1=Yes) but cannot be compared without shared tone (Q2=No), ranking pleasures with different tones (e.g., beer vs. music) becomes impossible, contradicting the universality of hedonic tone.  
    - **Leaf 7 (Unnamed: attitude-dependent)**. *Reason*: Unexplored. Requires a positive attitude (Q3=No) but doesn’t equate pleasure with it (e.g., pleasure as a byproduct of attitude). No major theory occupies this, as it is unstable; if attitude is necessary but not sufficient, what *is* pleasure?  
    - **Leaf 8 (Unnamed: other experiential view)**. *Reason*: Unexplored. Q5=Yes and Q8=No imply a non-attentional, non-feeling experiential feature (e.g., "flow" or "absorption"). But no such view exists; experiential unity typically reduces to felt-quality or attention.  
    - **Leaf 6→No (Eliminativism)**. *Reason*: Coherent but unattractive. If pleasures are neither unified (Q4=No) nor pluralistic (Q6=No), eliminativism follows, but it is extreme and ignores introspective reports.  
  - **Attentional profile view placement**: Lands on **Leaf 8 (Unnamed: attentional profile view)**, which is occupied and coherent. It answers:  
    - Q1=No (no requirement to feel good; e.g., finishing a proof might not feel "good" if anxious).  
    - Q3=Yes (pleasure without liking; e.g., scratching an itch despite annoyance).  
    - Q4=Yes (ranking without shared tone; e.g., music vs. beer compared by attention-holding).  
    - Q5=Yes (unifier is experiential; attention is a structural feature of consciousness).  
    - Q8=Yes (attentional profile defines pleasure).  
    This fits the defended view: pleasure is unified by how insistently/durationally attention is captured (e.g., music "draws you in," itch-scratching resists release), not by feeling or attitude.

  \answer{Unnamed (attentional profile view)}
