answer: |-
  ### Q&A Prep Sheet: Pascal's Mugging as Logical Uncertainty

  ---

  **1. Room Map (120 words)**  
  Your audience will treat the *original* Pascal’s Mugging as a "solved" parlor trick (resolved via bounded utility or complexity penalties). They’ll grant **Step 1** (complexity-penalized credence) without comment, seeing it as standard Occam’s razor. **Step 2** (conjecture mugger) will trigger skepticism: epistemologists will question whether inspecting code resolves *logical* uncertainty ("You confirmed the code, not the proof!"), while economists will see the scenario as artificial ("No rational agent faces threats from 20-line programs"). **Step 3** (no Bayesian prior over logical truths) is where they’ll fight hardest. They view logical omniscience as a benign idealization; replacing credences with market prices will seem like surrendering to computational defeatism. The ML person may quietly agree but won’t publicly break ranks.

  ---

  **2. Objections, Most to Least Damaging (800 words)**  

  **Objection 1 (Senior Epistemologist):**  
  *"This confuses epistemic and logical probability. The conjecture’s truth is fixed; your uncertainty is just ignorance of a fact. A good Bayesian assigns a subjective prior based on heuristics (e.g., proof length), then updates. Logical induction is overcomplicating a standard belief formation problem."*  
  **Reply:** "Respectfully, logical uncertainty isn’t reducible to empirical ignorance. A prior over proof lengths *is* arbitrary—why not a prior over output bitstrings? Bayesianism assumes a fixed hypothesis space, but undecided mathematical claims aren’t ‘possible worlds’—they’re propositions outside your current ontology. Logical induction avoids arbitrariness by treating beliefs as *tractable estimates* of logical facts."  
  **Soft Spot:** Doesn’t fully dispel the "it’s just imperfect knowledge" view.  

  **Objection 2 (Economist, Risk Specialist):**  
  *"Even granting logical uncertainty, your ‘market prices’ could assign nonzero probability to the threat. With utilities like 3↑↑↑3, any nonzero credence—however small—demands paying the mugger. This is fanaticism repackaged!"*  
  **Reply:** "Logical induction (LI) prices aren’t probabilities; they’re *time-sensitive forecasts* by traders. A low LI price for ‘proof exists’ isn’t a tiny probability—it’s a verdict that no trader has found evidence *yet*. Acting on arbitrary priors is fanaticism; acting on LI’s best-available-*process* isn’t. We need decision rules for when our estimates are in flux."  
  **Soft Spot:** Concedes LI doesn’t "solve" fanaticism—just makes it non-arbitrary.  

  **Objection 3 (Decision Theorist):**  
  *"If logical uncertainty requires abandoning probabilistic credences, how do you *make decisions*? Your ‘market prices’ could be incoherent or unstable. EU maximization requires probabilities!"*  
  **Reply:** "We *do* need probabilities for decisions—but logical uncertainty forces us to use *approximations* while our knowledge grows. LI provides justified estimates under computational limits. Yes, they’re imperfect, but better than pretending we have a ‘true prior’ for P=NP. We need a decision theory that interfaces with *learning processes*, not static beliefs."  
  **Soft Spot:** "Approximations" sound like a retreat from normative standards.  

  **Objection 4 (Epistemologist):**  
  *"Your ‘conjecture mugger’ is irrelevant to real decisions. We defer choices when logical facts are unsettled (e.g., waiting for a math result). Why not just say ‘I don’t know’ and walk away?"*  
  **Reply:** "Deferral works if time allows—but what if the mugger demands *now*? Or if the program’s runtime is unknown? Real agents face logical uncertainty under deadlines (e.g., cryptographic threats). The mugging exposes that ‘I don’t know’ isn’t a decision—we need rules for *acting* under unresolved reasoning."  
  **Soft Spot:** Audience may see this as contrived ("No one mugges with math proofs!").  

  **Objection 5 (ML Person):**  
  *"Isn’t this just bounded rationality? We penalize complex hypotheses; logical uncertainty is a subset of that. Why reinvent wheels?"*  
  **Reply:** "Bounded rationality handles *empirical* complexity (e.g., ‘the mugger controls 10^100 robots’). But logical uncertainty is different: the *hypothesis* is simple (‘this code finds a proof’), but its *truth* is unknown. Complexity penalties reduce priors for elaborate *descriptions*; they don’t tell us how to weigh unresolved *deductions*."  
  **Soft Spot:** Distinction between descriptive/computational complexity feels slippery.  

  **Objection 6 (Anti-Fanaticism Proponent):**  
  *"Bounding utility functions dissolves the mugging. Why tolerate a framework where 3↑↑↑3 dominates decisions?"*  
  **Reply:** "Bounding utilities avoids extortion, yes! But it dodges the *epistemic* problem. Suppose the mugger offers to *prevent* 3↑↑↑3 suffering via a proof-dependent mechanism. Bounded utilities ignore the stakes; logical uncertainty asks how to weigh them *when we can’t resolve the dependency*. Different puzzles!"  
  **Soft Spot:** Concedes bounded utility "solves" extortion—weakens urgency.  

  **Objection 7 (Economist, Ambiguity Focus):**  
  *"Logical induction feels like ad-hoc instrumentalism. Market prices aren’t *credences*; they’re tools for prediction. Why replace epistemology with stock markets?"*  
  **Reply:** "LI isn’t the only approach—it illustrates that *any* method for logical uncertainty must be computable and fallible. The key point: no Bayesian prior can be ‘calibrated’ to logical facts pre-proof. We need *process reliabilism* for math, not omniscient priors."  
  **Soft Spot:** "Process reliabilism" may alienate Bayesians.  

  **Objection 8 (Skeptic):**  
  *"Most logical claims are undecidable anyway. Why build decision theories for uncomputable problems?"*  
  **Reply:** "We face *tractable* but unresolved claims daily (e.g., ‘Will this encryption break?’). The mugger’s 20-line code could be one. We need theories for *actual* computation-bound agents, not oracles."  
  **Soft Spot:** Audience may agree such cases are rare.  

  ---

  **3. Concede Up Front (120 words)**  
  Open by granting: *"Bounded utility functions or risk-aversion norms (e.g., harmonic discounting) cleanly resolve the original Pascal’s Mugging. My claim isn’t that these fail—it’s that they leave untouched a deeper issue: how to act when the *causal pathway* to vast utility depends on an unsettled logical fact. If we reframe the mugging to fix the empirical probability (e.g., via verifiable code) and focus on logical uncertainty, bounded utility doesn’t engage. Anti-fanaticism norms also presuppose we *have* credences for logical claims—which we don’t."* This disarms economists and redirects to your core argument.

  ---

  **4. The Reply That Has to Land (120 words)**  
  When pressed on Bayesianism, hammer this: *"Bayesian priors require a sample space of ‘possible worlds.’ But for undecided mathematical claims, there are no such worlds—just one truth we haven’t found. Saying ‘I assign 30% to P=NP’ isn’t describing uncertainty over states; it’s encoding ignorance via a number that *can’t* be grounded in possibility. Logical uncertainty isn’t about missing facts—it’s about undecided deductions. The mugging shows that without a theory for this, agents either act arbitrarily (assigning made-up probabilities) or stall indefinitely. We need decision rules for when deduction is in progress."*  

  ---

  **5. The Question I’m Hoping Nobody Asks (150 words)**  
  **Question (Epistemologist):** *"Why not assign a universal prior over logical sentences (e.g., Solomonoff induction for math)? That gives non-arbitrary probabilities without abandoning Bayesianism!"*  
  **Reply:** *"Solomonoff assigns high probability to *short proofs*, not ‘true’ statements. Conjectures with long proofs get penalized—but we don’t know the proof length! Worse: many true claims (e.g., Gödel sentences) have no proof in your axiom system. A universal prior would assign P=0 to undecidable truths, violating Cromwell’s rule. Logical induction avoids this by allowing ‘unknown’ to be distinct from ‘improbable.’ That said, LI isn’t perfect—it’s one attempt to formalize uncertainty where Solomonoff fails. The core point stands: standard priors can’t handle this without arbitrary choices."*  
  **Why Dangerous:** Invokes technicalities about uncomputability; could derail into a debate over idealizations vs. practicality.  

  ---  
  *Good luck. Focus on reframing: your goal isn’t to "win" but to force them to see logical uncertainty as distinct. If they leave doubting that Bayesianism quietly assumes omniscience, you’ve succeeded.*
