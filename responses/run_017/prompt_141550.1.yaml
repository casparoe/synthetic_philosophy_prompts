prompt: |-
  hey — I'm in a vagueness seminar this term and for the last session everyone's meant to bring a joke for the reading group. We've been through tolerance principles, the "there's a sharp line somewhere, you just can't ever find it" view, supervaluationism, higher-order vagueness, the whole thing. I've got nothing and I'm bad at being funny, so: write me one.

  Some rules, sorry:

  - Not the heap and not the bald guy. Everyone does those and my prof will visibly die inside.
  - The punchline has to turn on the actual machinery, not on "haha philosophers can't say where the line is". If someone who'd only heard the word vagueness once could still get it, it's the wrong joke.
  - Set it somewhere boring and institutional if you can. My half-formed idea: the department says a seminar "counts as properly attended" if enough people show up, one person stops coming each week, and by the end the registrar is insisting the empty room is properly attended. Maybe the enrolment system has an official attendance status called "borderline", and someone then asks whether it's borderline whether it's borderline, and then... something. Use it or bin it, I don't care.
  - One thing I'd like: either run the argument in the other direction for the punchline (start with the case that clearly has the property, walk down one tiny increment at a time, end up with the case that clearly doesn't), or use the borderline-of-borderline bit. Whichever you pick, add two sentences on which part of the dialectic the joke is leaning on and what someone who hasn't done the reading would miss — I want to know if I'd have to explain it afterwards, because that kills it.
  - Keep it under about 120 words, and make it something I could actually say out loud or put on a slide. Fake email, dialogue, one-liner, whatever works. No puns on the word "vague" pls.

  definately don't need any references or reading suggestions, its just a joke. thanks!
