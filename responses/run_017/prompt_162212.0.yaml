  - However, if the report had been: P_new(X)=0.6, then we would have a constraint that cannot be satisfied without putting mass on X. Then we must stop and get supervisor approval.

  - But in this example, we can satisfy the constraint without putting mass on X? Then we do so. However, if we had a constraint that P_new(X)=0.6, then we cannot satisfy it without putting mass on X. So we must stop.

