          0.2 * [0.42 * exp(0.2λ)] - 0.8 * [0.28 * exp(-0.8λ)] = 0   [Wait, we must set a_i for the constraint: 
              a_C1 = 0.2, a_C2 = -0.8, a_O1=0, a_O2=0]

      Then:
          x_C1 = 0.42 * exp(0.2λ) / Z
          x_C2 = 0.28 * exp(-0.8λ) / Z

      Constraint: 0.2 * x_C1 - 0.8 * x_C2 = 0
          => 0.2*0.42*exp(0.2λ) = 0.8*0.28*exp(-0.8λ)
          => 0.084 * exp(0.2λ) = 0.224 * exp(-0.8λ)
          => exp(0.2λ) / exp(-0.8λ) = 0.224 / 0.084 = 8/3
          => exp(λ) = 8/3
          => λ = ln(8/3) ≈ ln(2.666) ≈ 0.9808

      Then:
          exp(0.2λ) ≈ exp(0.2*0.9808) ≈ exp(0.196) ≈ 1.216
          exp(-0.8λ) ≈ exp(-0.7846) ≈ 0.456

      Unnormalized:
          C1: 0.42 * 1.216 = 0.5107
          C2: 0.28 * 0.456 = 0.1277
          O1: 0.24
          O2: 0.06
          Sum: 0.5107+0.1277+0.24+0.06 = 0.9384

      Then:
          x_C1 = 0.5107/0.9384 ≈ 0.5443
          x_C2 = 0.1277/0.9384 ≈ 0.1361
