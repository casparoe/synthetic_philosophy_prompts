answer: |-
  ### Probability Update Procedure for Freight-Risk Forecasting

  #### **1. Classify the Input**
     - **Evidence (Source Reliability)**: Input from a source with known reliability (e.g., "Source says: X"). Treat as evidence using likelihoods (Step 3.1).
     - **Assessment (Constraint)**: Input that constrains the new distribution (e.g., marginal, conditional, comparative). Classify subtype:
       - **Ordinary Conditioning**: Learning a proposition with certainty (e.g., "X is true"). Use Step 3.1.
       - **Jeffrey Conditioning**: New marginal over a partition (e.g., "P(A) = 0.4"). Use Step 3.2 *only if* rigidity holds (check Step 2).
       - **General Constraint**: Neither ordinary nor Jeffrey (e.g., "If A, then P(B|A) = 0.6"). Use Step 3.3.
     - **Mixed Input**: Single report contains both evidence and assessment. Split and process evidence first (Step 3.1), then assessment (Step 3.3). *Never apply sequentially if constraints are interdependent*.

  #### **2. Check Rigidity for Jeffrey Conditioning**
     - **Definition**: Rigidity holds iff the report **does not change** relative odds within any partition cell.
     - **Check in Practice**:
       - For partition cells with positive prior probability, verify no input references probabilities *inside* the cell (e.g., no conditionals or comparisons affecting subcells).
       - If rigidity fails (e.g., report says "If A, then P(B|A) = 0.6" *and* A is a partition cell), use Step 3.3 instead.
     - **Output**: Proceed to Step 3.2 if rigid; else use Step 3.3.

  #### **3. Update Methods**
     - **Notation**:
       - \( \Omega \): Set of scenario cells (index \( i \)).
       - \( P_{\text{old}}(i) \): Prior probability of cell \( i \).
       - \( P_{\text{new}}(i) \): Updated probability.
       - Constraints use coefficients \( a_i \) for cell \( i \) (e.g., \( \sum_i a_i P_{\text{new}}(i) = b \)).

     - **Step 3.1: Ordinary Conditioning (Certain Evidence)**
       - Input: Proposition \( A \) (subset of cells) learned with certainty.
       - Update:
         \[
         P_{\text{new}}(i) = \begin{cases} 
         \frac{P_{\text{old}}(i)}{P_{\text{old}}(A)} & \text{if } i \in A \\
         0 & \text{otherwise}
         \end{cases}
         \]
       - **Stop if** \( P_{\text{old}}(A) = 0 \) (inconsistency; go to Step 5).

     - **Step 3.2: Jeffrey Conditioning (Marginal Update)**
       - Input: Partition \( \{B_j\} \) with new marginals \( Q(B_j) \).
       - Update for \( i \in B_j \):
         \[
         P_{\text{new}}(i) = Q(B_j) \cdot \frac{P_{\text{old}}(i)}{P_{\text{old}}(B_j)} \quad \text{(if } P_{\text{old}}(B_j) > 0\text{)}
         \]
       - **Stop if** \( P_{\text{old}}(B_j) = 0 \) but \( Q(B_j) > 0 \) (zero-prior issue; go to Step 5).

     - **Step 3.3: Minimum Cross-Entropy (General Constraints)**
       - **Rewrite Constraints** as linear equations/inequalities:
         - Marginal: \( \sum_{i \in A} P_{\text{new}}(i) = p \ \Rightarrow \ a_i = 1 \) for \( i \in A \), else \( 0 \); \( b = p \).
         - Conditional \( P_{\text{new}}(C|D) = r \):  
           \[
           \sum_{i \in C \cap D} P_{\text{new}}(i) - r \sum_{i \in D} P_{\text{new}}(i) = 0
           \]
           (yields \( a_i = 1 \) for \( i \in C \cap D \), \( a_i = -r \) for \( i \in D \setminus C \), else \( 0 \); \( b = 0 \)).
         - Comparative (e.g., "P(A) ≥ 2P(B)"):  
           \[
           \sum_{i \in A} P_{\text{new}}(i) - 2 \sum_{i \in B} P_{\text{new}}(i) \geq 0
           \]
       - **Solution Form**: Exponential tilt of prior:
         \[
         P_{\text{new}}(i) = \frac{1}{Z} P_{\text{old}}(i) \exp(\lambda a_i)
         \]
         where \( Z = \sum_i P_{\text{old}}(i) \exp(\lambda a_i) \) (normalizer), and \( \lambda \) solves the constraint.
       - **Hand Calculation (1–2 Constraints)**:
         - **One Equality**: Solve \( \sum_i a_i P_{\text{old}}(i) \exp(\lambda a_i) / Z = b \) for \( \lambda \) (group cells by \( a_i \) values).
         - **Two Equalities**: Use spreadsheet solver for system of two equations.
         - **Inequalities**: Use spreadsheet solver (e.g., Excel Solver with GRG Nonlinear).
       - **Apply Jointly**: Multiple constraints in one report *must* be applied together (sequencing violates constraints).
       - **Diagnostic**: After update, verify relative odds in **untouched cells** (no \( a_i \) variation) match prior. If not, error occurred.

  #### **4. Handle Inconsistencies and Zero Priors (Step 5)**
     - **Joint Unsatisfiability**: If constraints conflict (e.g., \( P(A) = 0.8 \) and \( P(A) \leq 0.5 \)), **halt and report error**. Analyst revises input/prior.
     - **Zero-Prior Cell**: If constraint requires \( P_{\text{new}}(i) > 0 \) but \( P_{\text{old}}(i) = 0 \):
       - **If cell is truly impossible**: Reject input (inconsistency).
       - **If cell is possible**: **Escalate to supervisor**. Requires re-elicitation of prior.

  #### **5. Record and Review**
     - **Log Update Type**: Specify "KL-divergence" for minxent; note if Jeffrey/ordinary used.
     - **Alternative Rule**: **Euclidean distance** minimizes \( \sum_i (P_{\text{new}}(i) - P_{\text{old}}(i))^2 \). Yields different results (no subset independence). Supervisor must approve divergence choice.
     - **Supervisor Sign-off**: Required for divergence choice, zero-prior adjustments, and inconsistency resolutions.

  ---

  ### Analyst Checklist (1-Page Pin-Up)
  1. **Classify Input**  
     - Evidence (source reliability)? → **Step 3.1**.  
     - Assessment? Subtype:  
       - Certain proposition? → **Step 3.1**.  
       - Marginal over partition? → **Check Rigidity (Step 2)**.  
         - Rigid? → **Step 3.2**.  
         - Not rigid? → **Step 3.3**.  
       - Other (conditional/comparative)? → **Step 3.3**.  
     - Mixed input? → **Split: Evidence first (Step 3.1), then assessment (Step 3.3)**.  

  2. **Check Rigidity for Jeffrey**  
     - Report only mentions partition marginals? *And* no conditionals/comparisons within cells? → **Proceed**.  
     - Else → **Use Minxent (Step 3.3)**.  

  3. **Update**  
     - **Step 3.1 (Certain Evidence)**:  
       - \( P_{\text{new}}(i) = P_{\text{old}}(i) / P_{\text{old}}(A) \) if \( i \in A \); else 0.  
       - **Stop if \( P_{\text{old}}(A) = 0 \)**.  
     - **Step 3.2 (Jeffrey)**:  
       - \( P_{\text{new}}(i) = Q(B_j) \cdot (P_{\text{old}}(i) / P_{\text{old}}(B_j)) \) for \( i \in B_j \).  
       - **Stop if \( P_{\text{old}}(B_j) = 0 \) but \( Q(B_j) > 0 \)**.  
     - **Step 3.3 (Minxent)**:  
       - Rewrite as linear constraint (e.g., \( \sum a_i P_{\text{new}}(i) = b \)).  
       - Hand-solve \( \lambda \) for 1 constraint; use solver for >1 or inequalities.  
       - \( P_{\text{new}}(i) = P_{\text{old}}(i) \exp(\lambda a_i) / Z \).  
       - **Apply joint constraints together**.  

  4. **Validate**  
     - Non-negative? Sum to 1? → **Yes**.  
     - Untouched cells: Relative odds unchanged? → **Yes** (else error).  
     - Zero prior forced positive? → **Escalate to supervisor**.  

  5. **Inconsistency**  
     - Unsolvable constraints? → **Halt, revise input/prior**.  

  6. **Record**  
     - Input, update type, divergence rule (KL).  
     - Supervisor sign-off for:  
       - Divergence choice (KL vs. Euclidean).  
       - Zero-prior adjustments.  
       - Inconsistencies.  

  ---

  ### What the Procedure Cannot Do
  - **Non-Linear Constraints**: Cannot handle non-linear inputs (e.g., variance bounds).  
  - **Vague Inputs**: Requires conversion to precise constraints (e.g., "much more likely" → \( P(A) \geq k \cdot P(B) \)).  
  - **Source Reliability for Assessments**: Treats assessments as exact; does not model reliability for conditionals/comparatives.  
  - **Temporal Dependencies**: Updates isolated to current week; no Bayesian belief updating across weeks.  
  - **Inconsistency Resolution**: Cannot auto-resolve conflicts; requires analyst/supervisor intervention.  
  - **Zero Priors**: Cannot auto-adjust \( P_{\text{old}}(i) = 0 \) to positive; escalation needed.  

  ---

  ### Example Applications  
  **Notation**: Cells = {N-Depot, N-Port, S-Depot, S-Port}. Prior: \( P_{\text{old}} = (0.25, 0.25, 0.25, 0.25) \).  

  1. **Calibration Case**  
     - Input: "If North, P(Depot) = 0.75" → Constraint \( P(\text{Depot|North}) = 0.75 \).  
     - Rewrite: \( P_{\text{new}}(\text{N-Depot}) - 0.75[P_{\text{new}}(\text{N-Depot}) + P_{\text{new}}(\text{N-Port})] = 0 \) → \( 0.25P_{\text{new}}(\text{N-Depot}) - 0.75P_{\text{new}}(\text{N-Port}) = 0 \).  
     - Minxent: \( a_i = 0.25 \) (N-Depot), \( -0.75 \) (N-Port), \( 0 \) (South).  
       Solve \( \lambda = \ln(3) \approx 1.0986 \).  
       \( P_{\text{new}} = (0.35, 0.1167, 0.2667, 0.2667) \).  
     - **Result**:  
       - N-Depot: 0.35, N-Port: 0.1167, S-Depot: 0.2667, S-Port: 0.2667.  
       - South odds unchanged (0.2667:0.2667 = 1:1, same as prior).  
       - **Signature**: Minxent preserves relative odds in untouched regions.  

  2. **Zero-Prior Cell**  
     - Prior: \( P(\text{X}) = 0 \).  
     - Input: "P(X) = 0.6" (constraint).  
     - **Halt**: Constraint requires \( P_{\text{new}}(\text{X}) > 0 \) but prior = 0.  
     - **Action**: Escalate to supervisor. If X is possible, re-elicit prior; else reject input.  

  3. **Mixed Report**  
     - Source reliability: 70% says "Customs" and "If Customs, P(Clear ≤ 48h) = 0.6".  
     - **Routing**:  
