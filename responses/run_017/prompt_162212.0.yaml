  - What if we naively imposed both parts as constraints? 
      Without the evidence update, we would have the prior Q0 = (0.3, 0.2, 0.4, 0.1) and then impose two constraints:
          (1) P(customs)=? But the source's statement is not a constraint, it's evidence. If we treat it as a constraint: P(customs)=1? That would be if we took it as certain. But we don't. Or if we treated it as a constraint without evidence update, we might set P(customs)=? Actually, the source's reliability is not used in a constraint.

