     - After update, ensure probabilities are non-negative and sum to 1.
     - For minxent update, check that cells not involved in the constraint have unchanged relative odds (if not, there's an error).
     - If a constraint requires P_new(A)>0 and P_old(A)=0, STOP and get supervisor approval.

  6. **Inconsistency:**
     - If constraints are mutually exclusive (e.g., P(A)=0.8 and P(A)=0.5), STOP and review.

  7. **Record:**
     - Input, update type, and note if minxent was used.

  **What the Procedure Cannot Do**
  - Handle non-linear constraints (unless they can be linearized).
  - Handle vague remarks without converting them to precise constraints (e.g., "port is now at least twice as likely as depot" becomes an inequality).
  - Handle dependencies between reports over time (it treats each update in isolation).
  - Model the reliability of conditional assessments (we treat them as constraints to be taken at face value).
  - Handle cases where the rigidity assumption for Jeffrey conditioning is in doubt without falling back to minxent (which is more complex).

  **Example Applications**

  **Example 1: Calibration Case**
  - Four cells: 
      Region: North (N) or South (S)
      Cause: Depot (D) or Port (P)
      Cells: ND, NP, SD, SP.
  - Prior: even odds for regions and causes. So:
      P(ND)=0.25, P(NP)=0.25, P(SD)=0.25, P(SP)=0.25.
  - Report: "if it is the northern region, the chance it is the depot rather than the port is three in four."
    This means: P_new(D | N) = 0.75.

  - Classify: assessment -> constraint: P_new(D | N)=0.75.
  - Rewrite: P_new(ND) / P_new(N) = 0.75 -> P_new(ND) = 0.75 * P_new(N).
    But note: P_new(N) = P_new(ND)+P_new(NP). So we have:
        P_new(ND) = 0.75 * (P_new(ND)+P_new(NP))
        => P_new(ND) = 0.75 P_new(ND) + 0.75 P_new(NP)
        => 0.25 P_new(ND) - 0.75 P_new(NP) = 0.

  - We can write the constraint as: 
          a_i = 0.25 for i=ND, a_i = -0.75 for i=NP, and 0 for others.
    But note: we can also express in terms of the sets. The constraint is linear: 
          0.25 * x_ND - 0.75 * x_NP = 0   [Equation (1)]

    Also, we have the normalization: 
          x_ND + x_NP + x_SD + x_SP = 1   [Equation (2)]

  - We use minxent with prior P and the constraint (1). We ignore (2) because the solution will automatically be normalized by Z.

  - The update formula:
          x_i = P_old(i) * exp(λ * a_i) / Z.

    Here, a_i:
          ND: a_i = 0.25
          NP: a_i = -0.75
          SD, SP: a_i = 0.

    Prior: 
          P_old(ND)=0.25, P_old(NP)=0.25, P_old(SD)=0.25, P_old(SP)=0.25.

    Then:
          x_ND = 0.25 * exp(0.25 λ) / Z
          x_NP = 0.25 * exp(-0.75 λ) / Z
          x_SD = 0.25 * exp(0) / Z = 0.25 / Z
          x_SP = 0.25 / Z

    Constraint (1): 0.25*x_ND - 0.75*x_NP = 0.

    Substitute:
          0.25 * [0.25 * exp(0.25λ)/Z] - 0.75 * [0.25 * exp(-0.75λ)/Z] = 0
          => (0.0625 * exp(0.25λ) - 0.1875 * exp(-0.75λ)) / Z = 0
          => 0.0625 * exp(0.25λ) = 0.1875 * exp(-0.75λ)
          => exp(0.25λ) / exp(-0.75λ) = 0.1875 / 0.0625
          => exp(λ) = 3
          => λ = ln(3)

    Then:
          exp(0.25λ) = 3^{0.25} = sqrt(sqrt(3)) ≈ 1.316 (we'll compute numerically)
          exp(-0.75λ) = 3^{-0.75} = 1/(3^{0.75}) = 1/(sqrt(3)*sqrt(sqrt(3))) ≈ 1/(1.732*1.316) ≈ 1/2.279 ≈ 0.4388

    Now compute unnormalized weights:
          ND: 0.25 * 1.316 = 0.329
          NP: 0.25 * 0.4388 = 0.1097
          SD: 0.25
          SP: 0.25

    Sum (for Z) = 0.329 + 0.1097 + 0.25 + 0.25 = 0.9387

    Then:
          x_ND = 0.329 / 0.9387 ≈ 0.3506
          x_NP = 0.1097 / 0.9387 ≈ 0.1169
          x_SD = 0.25 / 0.9387 ≈ 0.2664
          x_SP = 0.25 / 0.9387 ≈ 0.2664

    Check constraint: 
          0.25*0.3506 - 0.75*0.1169 = 0.08765 - 0.087675 ≈ 0 (close, rounding error).

    Now, note the odds in the south: 
          P_new(SD)/P_new(SP) = 0.2664/0.2664 = 1, and in the prior: 0.25/0.25=1 -> unchanged.

    This is the signature of the minxent update: the relative odds in the south (which were untouched) remain the same.

  **Example 2: Zero-Prior Cell**
  - Prior: we have a cell, say "X", with P_old(X)=0 (impossible).
  - Report: a constraint that requires P_new(X) > 0 (e.g., a marginal constraint on a set that includes X, and the new marginal is positive, and there is no other cell in that set that can take the probability).

