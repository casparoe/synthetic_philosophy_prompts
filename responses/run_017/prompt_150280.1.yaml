  4. **Excluded by Starting Commitment**:  
     - **Libertarianism** (all inequalities permitted if choices voluntary).  
     - **Utilitarianism** (inequalities justified if they maximize welfare).  
     - **Strict Egalitarianism** (all inequalities unjust, even from choice).  
