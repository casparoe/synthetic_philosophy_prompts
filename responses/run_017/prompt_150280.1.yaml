  ### Part 2: Sorting Quiz (10 Items)  
  *Each item asks what the tax-and-transfer apparatus should do. Answer options:*  
  - **CF**: Compensate in full  
  - **CP**: Compensate partially (specify if needed)  
  - **NC**: Not compensate  
  - **PR**: Pool the risk in advance (e.g., mandatory insurance)  

  1. **Dose-Response 1 (Low risk)**: Lee chooses rock climbing (1% chance of $10k injury; high expected value). Injury occurs.  
     - a) CF  
     - b) CP (e.g., cover 50%)  
     - c) NC  

  2. **Dose-Response 2 (Moderate risk)**: Same as #1, but 20% chance of $100k injury.  
     - a) CF  
     - b) CP  
     - c) NC  

  3. **Dose-Response 3 (High risk)**: Same as #1, but 60% chance of $500k injury.  
     - a) CF  
     - b) CP  
     - c) NC  

  4. **Third-Party Harm**: Sam drives drunk, hits pedestrian Kim. Kim needs $200k medical care.  
     - a) CF for Kim, then tax Sam  
     - b) CF for Kim (no reimbursement)  
     - c) NC for Kim (tort system only)  

  5. **Underwriter Test Failure**: Jay takes a job with a new chemical exposure (risk unmeasurable; no insurer covers it). He gets sick.  
     - a) CF (uninsurable = brute luck)  
     - b) CP  
     - c) NC (voluntary choice)  

  6. **Culpable Ignorance**: Riley ignores a free, easy test for a preventable disease. They get sick.  
     - a) CF  
     - b) CP  
     - c) NC  

  7. **Leveling-Down**: Society can: (1) Let group A have 10 units, B have 5, or (2) Give everyone 5.  
     - a) Choose (2)  
     - b) Choose (1)  
     - c) Choose (1) but tax A to help B (if possible)  

  8. **Expensive Taste (Deliberate)**: Morgan trains themselves to need truffles ($1k/meal) to enjoy food.  
     - a) CF for truffles  
     - b) CP (e.g., basic food subsidy)  
     - c) NC  

  9. **Expensive Taste (Non-Deliberate)**: Casey has chronic pain; cheap treatment exists but requires daily effort.  
     - a) CF for expensive painkillers  
     - b) CP  
     - c) NC  

  10. **Imprudence**: Alex spends savings on luxuries instead of buying insurance. Disaster strikes; they’re destitute.  
      - a) NC beyond a basic floor  
      - b) CP (e.g., basic floor + partial aid)  
      - c) CF (same as prudent unlucky)  

