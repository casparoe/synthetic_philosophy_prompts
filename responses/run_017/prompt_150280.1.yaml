  ### Part 1: Decision Tree  
  *Starts from: "An inequality traceable to factors a person had no hand in is pro tanto unjust."*

  1. **Should society regulate outcomes *after* they occur (ex post), or regulate the structure of chances *before* outcomes are known (ex ante)?**  
     - **1A. Ex post (outcomes)**: Go to 2.  
     - **1B. Ex ante (chances)**: Go to 3.  

  2. **Underwriter Test**: A risk is genuinely "owned" by the agent *only if* a competitive insurer would have underwritten it at a finite premium at the time of action (accounting for unmeasurability, unavoidable exposure, or the agent’s inability to buy cover). Do you accept this?  
     - **2A. Yes, unweakened**: Losses from uninsurable risks are brute luck, even if voluntary. (Leaf A)  
     - **2B. Yes, weakened (counterfactual markets)**: Losses are brute luck only if uninsurable in *ideal* markets. (Leaf B)  
     - **2C. No**: Underwriting is irrelevant; responsibility depends on choice alone. Go to 4.  

  3. **Underwriter Test** (same as Q2):  
     - **3A. Accept unweakened**: Go to 5.  
     - **3B. Accept weakened**: Go to 6.  
     - **3C. Reject**: Go to 7.  

  4. **Stopping Point**: Choices are shaped by circumstances. Where does responsibility begin?  
     - **4A. At reasons-responsiveness**: The agent could have responded to reasons. (Leaf C)  
     - **4B. At identification**: The agent endorsed the desire behind the choice. (Leaf D)  
     - **4C. No stopping point**: All outcomes are brute luck. (Leaf E: **Outcome Egalitarianism**)  

  5. **Stopping Point** (ex ante, unweakened test):  
     - **5A. Reasons-responsiveness**: (Leaf F: **Dworkinian Equality of Resources**)  
     - **5B. Identification**: (Leaf G: Unoccupied)  
     - **5C. No stopping point**: (Leaf H: Unoccupied)  

  6. **Stopping Point** (ex ante, weakened test):  
     - **6A. Reasons-responsiveness**: (Leaf I: **Type-Based Partition**)  
     - **6B. Identification**: (Leaf J: Unoccupied)  
     - **6C. No stopping point**: (Leaf K: Unoccupied)  

  7. **Stopping Point** (ex ante, reject test):  
     - **7A. Reasons-responsiveness**: (Leaf L: **Equality of Opportunity for Welfare**)  
     - **7B. Identification**: (Leaf M: Unoccupied)  
     - **7C. No stopping point**: (Leaf N: Unoccupied)  

  **Leaves**  
  - **A. Ex Post + Unweakened Underwriter**: *Most awkward*: Compensates losses from avoidable risks if uninsurable (e.g., skydiving without available insurance). *Held*: Unoccupied.  
  - **B. Ex Post + Weakened Underwriter**: *Most awkward*: Compensates losses insurers *would have* covered in ideal markets (speculative). *Held*: Unoccupied.  
  - **C. Ex Post + Choice-Only + Reasons-Responsiveness**: *Most awkward*: Denies compensation for imprudence even if social pressures heavily influenced choice. *Held*: "Harsh" luck egalitarianism (e.g., Rakowski).  
  - **D. Ex Post + Choice-Only + Identification**: *Most awkward*: Denies compensation if desires were unendorsed (e.g., addiction from peer pressure). *Held*: Democratic equality (Anderson).  
  - **E. Outcome Egalitarianism**: *Most awkward*: Requires leveling down (e.g., destroying advantages that benefit no one). *Held*: Temkin.  
  - **F. Dworkinian Equality of Resources**: *Most awkward*: Fully compensates bad option luck (e.g., gambling losses) if insurance was available but not bought. *Held*: Dworkin.  
  - **I. Type-Based Partition**: *Most awkward*: Compensates uninsured losses only for risks agents "could not help" taking (e.g., genetic risks). *Held*: Roemer.  
  - **L. Equality of Opportunity for Welfare**: *Most awkward*: Compensates expensive tastes if unchosen (e.g., innate preference for jazz over pop). *Held*: Arneson.  

