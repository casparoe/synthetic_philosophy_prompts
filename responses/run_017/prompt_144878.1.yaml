prompt: |-
  I am trying to work out what I actually think about privacy, and I want a principle rather than a survey of positions. Below are my verdicts on a dozen cases, given as honestly as I can, plus a tentative principle of my own that I suspect is close but not right. I would like you to test the principle against the cases, repair it or replace it, and tell me which of my verdicts a better principle would force me to give up.

  Please do not supply a literature review or citations; I will add those myself. You may draw on the familiar families of account — access-based, control-based, the norms-of-information-flow or contextual-integrity family, and the reductionist thought that privacy talk is dispensable in favour of property and bodily rights — but as materials, not as something to summarise.

  My cases and verdicts:

  1. A stranger on a commuter train reads my messages over my shoulder. She forgets them within a minute and tells no one. Violation: yes, a small one.
  2. The transit authority retains carriage CCTV for thirty days. My segment of footage is never viewed by anyone. Violation: yes, though smaller than I expected to feel; and thirty days' retention feels worse to me than twenty-four hours'.
  3. My old laptop, with a full-disk-encrypted drive, ends up in the hands of a retired cryptographer who never attempts to open it. Violation: no.
  4. The same cryptographer does open it, finds nothing but grocery lists and drafts, tells no one, and dies a month later. Violation: yes.
  5. A hospital's model, trained on records including mine, outputs a risk score used to allocate nursing staff. No human ever looks at my score or knows it exists. Violation: yes, and I cannot say why.
  6. A supermarket infers from my purchases that I am pregnant and mails me coupons. Again no human sees the inference. Violation: yes, and worse than 5.
  7. A tourist photographs me in a plaza to test whether a new lens focuses correctly, checks the histogram, deletes the file, and never looks at my face. Violation: no.
  8. After my death my mother reads the diary I kept at fifteen. Violation of my privacy: I want to say no — but I also want to say something bad happened.
  9. The camera in a shop fitting room is a convincing prop, and I believe I am being filmed. Violation of privacy: no, I think — yet something bad happened.
  10. The camera in the fitting room is real and recording, but the footage is auto-deleted unviewed, and no one ever knows what it captured. Violation: yes, and a serious one.
  11. Out of idle curiosity I look up an old classmate's court records, each of them properly public, and assemble them into a picture of how his life went. Violation: yes, mildly, even though every item was public.
  12. A data broker holds ten thousand trivial facts about me. Each on its own I would not mind anyone knowing. The profile they compose, I suspect, matters a great deal. My verdict here is unstable: sometimes it feels like nothing, sometimes like a large violation.

  The pair I keep returning to is 7 and 10. In neither case does any agent end up with a belief about me; in one I feel nothing, in the other I feel a great deal. I take it the difference must be sought in the setting, or in what the arrangement was for, rather than in anything that happened to the information — but I cannot see how to build that into a principle without smuggling in the conclusion.

  Here is my tentative principle, which I offer to be corrected rather than defended: a person loses privacy with respect to a fact only if some agent is in a position to learn that fact, where being in a position is fixed by the norms of the relevant practice rather than by physical possibility, those norms do not authorise that agent to be in such a position, and it does not matter whether the agent ever exercises it.

  Three things I want from you.

  First, state the principle you think is actually right — or, if you think there is no one principle, the smallest set, with an account of why privacy talk bundles together things that come apart. State it precisely enough that I could apply it to a new case without asking you, and give me, clause by clause, the case that motivates the clause.

  Second, tell me what notion of being in a position to learn makes 3 come out clean and 2 come out a violation, and whether that notion can be stated without appealing to what is easy, what is likely, or what the institution is for. If it cannot, say so and tell me what the principle should appeal to instead. Say also whether the principle needs a subject-level knower, and therefore what it should say about the model in case 5 and the inference in case 6; my sense that 6 is worse than 5 may show that I am protecting two different goods and calling both privacy.

  Third, give me the principle's verdicts on two or three cases you construct yourself, of a kind I have not listed, chosen because they are where the principle's answer is least predictable — ideally cases where it disagrees with what you expect my gut to say, so that I can check it. Then tell me plainly which of my twelve verdicts your principle cannot accommodate, which of those you would overturn, and what I would lose by overturning it. I would rather have a principle that costs me a verdict than a disjunctive one that saves all twelve, but I want to know the price, and I want to know what it says about case 12.
reasoning: |-
  Hmm, the user is doing some deep philosophical work on privacy and wants me to help refine their principle. They've shared 12 specific cases with their intuitive verdicts, plus a tentative principle that they suspect isn't quite right. This is a serious intellectual exercise - they're clearly trying to build a coherent framework rather than just collect opinions.

  Looking at their cases, I notice interesting tensions. Case 7 (deleted test photo) feels fine while case 10 (real fitting room camera) feels violating, even though no information is actually learned in either. Their current principle focuses on "being in a position to learn," but that doesn't capture why the context matters so much. The supermarket pregnancy inference (6) bothers them more than the hospital algorithm (5), suggesting they might be protecting two different things under the "privacy" label.

  Their tentative principle has three key elements: agent's position to learn, norm violation, and irrelevance of actual learning. But it struggles with cases where norms are ambiguous (like the diary after death) or where no human agent is involved (the AI systems). The fitting room cases show that the mere creation of access feels violating regardless of use.

  I need to construct a principle that centers on the creation of access capability in contexts where it shouldn't exist. The core violation happens when someone or something gains the ability to perceive your private sphere without proper authorization, regardless of whether they exercise that ability. This explains why the real camera (10) is bad while the prop (9) isn't - one actually creates access capability.

  For the "position to learn" dilemma: it's not about physical possibility but about whether the access capability was improperly created. The cryptographer who doesn't attempt decryption (3) hasn't created access capability, while the transit authority retaining footage (2) has. We don't need to quantify likelihood - the mere existence of the improperly created capability is what matters.

  For non-human systems: when an entity can use information about you to make decisions (like the hospital model), that constitutes "access" even without human awareness. The supermarket case feels worse because it's commercial exploitation, which adds a distinct harm to the privacy violation.

  My principle would judge:
  - Case 12 (data aggregation) as violation because trivial facts become significant when combined
  - The diary case (8) as non-violation but still emotionally difficult
  - The prop camera (9) as non-violation since no actual access capability exists

  The price of this principle: it would force them to reconsider case 1 (shoulder-surfing) as potentially non-violating if it's truly momentary, and case 4 (decrypted laptop) as violation even if unused. Case 11 (public records assembly) might need reframing as non-violation since the access capability was properly created.

  For test cases, I'll imagine: a mandatory body scanner that auto-deletes images unviewed (violation), reading someone's open diary left in a cafe (violation), and overhearing a loud public argument (non-violation). These test the boundaries of "improperly created access capability."

  Ultimately this approach bundles informational privacy with spatial privacy under one framework, with context determining when access capability is improper. It might sacrifice some intuitive verdicts but gains predictive coherence.
answer: |-
  Here's a principled framework built from your cases, designed for coherence and predictive power. I'll address your requests in sequence:

  ### The Principle
  **A person suffers a privacy violation with respect to a sphere of their life when an agent (human or artificial system) improperly gains the *capability to access* that sphere, regardless of whether access occurs.**  

  Clause-by-clause motivation:  
  1. **"Sphere of their life"**: Replaces "fact" to cover states, activities, or data (cases 5, 6, 10). Motivated by case 12: trivial facts become significant when aggregated into a "sphere."  
  2. **"Improperly gains"**: Requires norm violation or lack of authorization (cases 1, 10). Motivated by case 7 (authorized photography) vs. case 10 (unauthorized surveillance).  
  3. **"Capability to access"**: Focuses on the *created potential* for observation/use, not actual learning (cases 2, 3, 4, 5). Motivated by case 3 (no capability gained) vs. case 4 (capability exercised).  
  4. **"Agent (human or artificial system)"**: Includes non-human entities that process data (cases 5, 6). Motivated by your intuition that case 6 (automated inference) violates privacy without human involvement.  

  ---

  ### Addressing Your Queries
  **1. "Being in a position to learn" and non-human agents:**  
  - Your cases 3 (no violation) and 2 (violation) turn on whether an *access capability was improperly created*. The cryptographer *could* decrypt (physical possibility) but never gains *capability* because they don’t act. The CCTV *creates* capability via retention.  
  - **Can this avoid "ease," "likelihood," or "purpose"?** No. Norms determine what constitutes "improper" capability-creation (e.g., CCTV retention duration is improper because it exceeds necessity, not due to physical risk). The principle must appeal to **contextual authorization**: capability is improper if the agent lacks valid grounds (consent, necessity) to create it.  
  - **Subject-level knower?** Not required. Case 5 (hospital model): the system gains capability to *use* health data (outputting scores) without proper authorization, hence violation. Case 6 (supermarket): worse because commercial exploitation compounds the norm violation (targeting vulnerabilities). Your intuition here suggests privacy protects against *instrumentalization*—using personal spheres as means without consent.  

  **2. Test Cases for the Principle:**  
  - **Case A:** A neighbor points a directional microphone at your bedroom but never records or listens.  
    *Principle’s verdict:* Violation (capability improperly gained).  
    *Likely gut reaction:* Violation, aligning with principle.  
  - **Case B:** You post a public tweet. A researcher archives it for a study on language trends, never reading it individually.  
    *Principle’s verdict:* No violation (capability gained properly via consent).  
    *Likely gut reaction:* No violation—tests "improperly gains."  
  - **Case C:** An app tracks your location 24/7 "for security," auto-deleting data hourly unless you press an emergency button. No one views it.  
    *Principle’s verdict:* Violation (capability exceeds necessity; improper retention).  
    *Likely gut reaction:* Unease—may conflict if "security" feels justifying.  

  ---

  ### Verdicts Your Principle Cannot Accommodate
  Your principle would **overturn three verdicts**:  
  1. **Case 1 (shoulder-surfing):** *Your verdict:* Violation. *Principle:* **No violation** if no capability is gained (information is transient; no storage/recall mechanism). You might lose the intuition that fleeting observations matter, but this preserves coherence with case 7.  
  2. **Case 8 (mother reads diary):** *Your verdict:* No privacy violation. *Principle:* **Violation** if she lacked authorization while you lived (capability gained improperly post-mortem). The "something bad" is a *moral* harm (betrayal), not privacy.  
  3. **Case 11 (public records assembly):** *Your verdict:* Violation. *Principle:* **No violation** if access was proper for each record (no *new* capability created; assembly is just analysis).  

  **Case 12 (data aggregation):** The principle calls this a **violation**. The broker improperly gains capability to access your "life sphere" (the aggregated profile), even if individual facts are trivial. Your instability arises from conflating *facts* with *spheres*—the principle resolves this.  

  ### The Price of Coherence
  - **What you lose:** The principle sacrifices the idea that *ephemeral observations* (case 1) or *non-consensual but non-exploitative acts* (case 8) are privacy violations. It reframes these as etiquette breaches or moral wrongs.  
  - **What you gain:** A unified account explaining why capability-creation without use violates (cases 2, 4, 10), why systems can violate (cases 5, 6), and why context determines harm (case 9 vs. 10). It distinguishes privacy from related harms (deception in case 9, dignity in case 8).  

  This framework treats privacy as **protection against unauthorized epistemic access points**, making 7 (no capability) and 10 (capability gained) the keystone pair. If this costs you a few intuitions, it buys predictive rigor.
