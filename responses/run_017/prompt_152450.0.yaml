prompt: |-
  I have just come out of a four-hour argument about reasons with a friend who is a far harder-headed internalist than I am, and she landed one objection I could not answer, so I need help before next week.

  On Tuesday I defend the third chapter of my dissertation in a two-hour committee meeting. The chapter proposes a version of externalism I call role-anchored. Roughly: internalism is right about bare reasons, the reasons an agent has simply in virtue of the aims, projects and cares she actually has, and wrong about role reasons, the reasons attached to an office or relationship the agent occupies: parent, judge, trustee, promisee, citizen, colleague. Those hold whether or not she cares about them. The further claim, and the one I actually care about, is that internalism's real insight is a voluntariness condition that it attaches to the wrong moment. Internalists say a consideration is a reason for me only if I could reach it by correct deliberation from what I already care about. I say the condition does its work at uptake instead: what makes the demands of a role genuinely normative for me is that I could have refused the role, or that its central demands were foreseeable when I took it up. That relocation is also meant to explain why the hard cases in the literature are hard: the brutal agent, the addict who wants the drug and does not want to want it, the person flattened by depression. Those are bare-agent cases, and the intuition that someone has a reason he cannot see returns with full force the moment you give him a role.

  My friend's objection, which I think is close to fatal, is a collapse argument: if voluntariness does the work, then roles nobody chose — being someone's child, being born a citizen, becoming a parent by accident — generate no reasons at all; and where the agent does identify with her role, saying she has reason to do what it requires is just describing an internal reason with a wide motivational set, while where she does not, it is a sociological remark about how often people identify with their roles. Either way, she says, role-anchored externalism is internalism with extra furniture.

  The committee is four people. My supervisor is a constructivist about practical reasons who thinks Humean pictures are the enemy and will want to know whether my uptake move is constructivism about institutional normativity and whether a role's content is fixed by the agent's will or by social practice. The second reader is an internalist in the Williams line, who thinks the whole disagreement turns on what relation reasons must bear to an agent's motivational states, and who will ask whether my could-have-refused condition is a motivational fact in disguise. The third reader doubts that reasons are the primitive normative unit at all — she thinks reasons-talk is derivative from value or from what one ought to do — and will ask whether the dispute is verbal. A visitor who works on practical rationality with an eye to empirical psychology will ask what my view predicts about actual deliberation and how anyone could tell.

  What I want is a prep sheet: the eight or so objections I will actually get, in the order they will come, each phrased the way that person would phrase it, ordered by how much damage it would do if I could not answer it, with a note on how likely each is. For each, a reply I can give in about ninety seconds and an honest note on where the reply is soft. Include the objection I am hoping nobody raises — I think it is whether role-anchored externalism entails that the camp guard, or the accountant for a criminal firm, has reason to do his job well, but tell me if there is a worse one and what to say if it comes. Where the honest answer is that my view has no reply yet, say that rather than manufacturing one. And give me no citations, no named papers, no reading list: I want arguments, not authorities.

  Finally, and this matters as much as the rest: for each reply, mark whether it rests on something that is common ground among people who work on reasons or on a claim that is live-contested, and where it is contested, say what the alternatives are and whether mine is a minority position. Tell me plainly which of my premises are load-bearing and disputed, so that I do not walk in presenting a contested view as the state of the question.
reasoning: |-
  Okay, the user is preparing for their dissertation defense and needs a prep sheet for potential objections. They've outlined their role-anchored externalism view and a specific collapse argument from their friend. The committee members' positions are clearly described, so I need to anticipate each person's likely objections, prioritize them by damage potential, and provide concise replies.

  First, I should map the committee's profiles to probable objections. The supervisor (constructivist) will likely question if their uptake move is actually constructivism in disguise. The second reader (Williams-style internalist) will probe whether the "could-have-refused" condition smuggles in motivational elements. The third reader (reasons-skeptic) might challenge if this is just verbal disagreement. The visitor (empirical focus) will want real-world applicability tests.

  For the collapse argument - the friend's fatal objection - I need to separate the two prongs: unchosen roles and identification cases. The key is distinguishing structural voluntariness from psychological identification. Unchosen roles like citizenship still involve implicit consent through continued participation, while non-identification scenarios rely on the foreseeability buffer rather than current motivation.

  The camp guard counterexample is tricky. The honest response should be that their view might technically validate such roles' demands as normative, but this can be mitigated by hierarchy of roles (moral roles override immoral ones) and the voluntariness condition itself (truly coercive roles may not bind).

  For each objection, I'll note: 1) Damage level (high/medium/low), 2) Likelihood, 3) 90-second reply, 4) Soft spots, 5) Premise contestation status. High-damage objections get prioritized even if unlikely.

  Common ground vs contested claims must be flagged. For example, the distinction between institutional and moral normativity is widely accepted, but voluntariness as legitimacy condition is debated (voluntarists vs non-voluntarists). The user needs to acknowledge where their premises sit in the spectrum.

  The hidden trap might be whether their view commits to too many role reasons clashing without resolution method. The reply should admit this is work-in-progress while suggesting possible frameworks like lexical priority or context-sensitivity.

  Finally, for the visitor's empirical objection, I'll emphasize testable predictions about deliberation patterns under their model versus internalism, while conceding operationalization challenges.
answer: |-
  Here is your prep sheet, ordered by damage potential if unanswered. I've included the hidden trap, marked likelihoods (High/Medium/Low), and flagged contested premises honestly.

  **Objection 1 (Collapse - Unchosen Roles):** "Your 'could-have-refused' condition means unchosen roles (child, accidental parent, natural-born citizen) generate *no reasons*. But we clearly think they do. Your view is either false or collapses into saying only voluntary roles have force, making it irrelevant for core cases." *(Likely: **High** - From Internalist/Everyone. **Damage: Maximum**)*
  *   **Reply (90s):** Voluntariness applies at the *structural* level of role *legitimacy*, not every instantiation. Occupying a role like 'citizen' or 'child' creates *default* reasons. The voluntariness condition is satisfied by the *foreseeability* of core demands and the *ongoing possibility of exit* (emigration, placing child for adoption). Refusing the role *in advance* isn't the only way voluntariness manifests; *accepting the burdens* by continuing to occupy the role without exit suffices. This distinguishes roles from brute facts.
  *   **Soft Spot:** Defining "genuine possibility of exit" and "core demands" robustly enough is hard (e.g., impoverished citizen, accidental parent in restrictive society). Is *non-exit* truly voluntariness or just lack of coercion?
  *   **Contested?:** **YES.** Voluntariness as a *necessary condition* for institutional normativity is contested. Non-voluntarists argue roles can bind simply by existing (common in communitarian/political obligation debates). Your view is a minority position here, emphasizing *personal normative uptake* over social fact.

  **Objection 2 (Collapse - Identification):** "Where the agent identifies with the role, your 'role reason' just *is* an internal reason (it hooks to her care about the role). Where she doesn't identify but *could* have refused, saying she 'has a reason' is just a sociological fact about the role's demands, not a genuine *normative* reason for *her*. It's either internalism or inert sociology." *(Likely: **High** - From Internalist. **Damage: Maximum**)*
  *   **Reply (90s):** You conflate *having* a reason with *being motivated by* it. Role reasons are *objective normative demands* generated by the role's structure and the agent's (voluntary or default) occupancy. Identification makes the reason *motivationally accessible*, but its *existence* as a reason stems from the role itself and the voluntariness condition on uptake/occupancy. The non-identifying agent *has* the reason (it's genuinely normative for them), even if they don't see it or feel its force – just like the depressed agent *has* a reason to eat, even if they can't access it internally.
  *   **Soft Spot:** Requires a robust distinction between *existence* of a reason and *motivational accessibility*. Internalists often deny this distinction is meaningful for practical reasons. Explaining the "normative oomph" of a reason the agent completely rejects is hard.
  *   **Contested?:** **YES.** Distinguishing reason existence from accessibility is core to the internalist/externalist debate. Internalists (majority in Williams' wake) often tie existence tightly to potential motivation. Your position is externalist/minority here.

  **Objection 3 (Supervisor - Constructivism?):** "Is your 'uptake move' just constructivism for institutions? You say role content is fixed by social practice (foreseeable demands), but normative force comes from individual voluntariness (could-have-refused). Is the agent constructing the normativity *for themselves* via their (non-)choice? Or is the normativity out there in the role?" *(Likely: **Medium-High** - Supervisor. **Damage: High**)*
  *   **Reply (90s):** It's hybrid. The *content* of role reasons (what the duty *is*) is fixed objectively by the social practice defining the role (e.g., what being a judge entails). The *normative force* of those demands *on this specific agent* requires the voluntariness condition (foreseeable demands + non-coerced occupancy/continued occupancy as acceptance). The agent doesn't construct the *duty*; they provide the condition for it *binding them*. It's not pure constructivism (content isn't will-dependent) nor pure realism (bindingness isn't automatic).
  *   **Soft Spot:** Can feel like splitting hairs. Requires accepting that normative force can be conditional in this specific way. Supervisor might push: "So is the *reason itself* constructed by the agent's will or not?"
  *   **Contested?:** **YES.** Distinguishing content vs. force/bindingness is common ground, but the *source* of force (social practice vs. individual uptake) is contested. Your view is a niche position blending sources.

  **Objection 4 (Internalist Reader - Motivational Disguise?):** "Your 'could-have-refused' condition – isn't this just a motivational state? Either it's a dispositional *desire* not to be coerced, or the *fact* that I *would have* refused if given the choice (a counterfactual about my motivations). Either way, it sneaks motivation back in as foundational." *(Likely: **High** - Internalist Reader. **Damage: High**)*
  *   **Reply (90s):** No. The condition is about *normative space*, not motivation. It's a fact about the agent's *situation* and *opportunity*: was occupying this role a foreseeable, non-coerced choice (or is continued occupancy a form of tacit acceptance)? This is a fact about their history and options, not their psychology. Even if they *would* have been motivated to refuse, or *are* motivated to avoid coercion, the condition itself is met by the *objective circumstances* of their role acquisition/occupancy, making the role's demands normative *for them*.
  *   **Soft Spot:** Internalists will argue that "non-coerced choice" and "tacit acceptance" *themselves* only make sense relative to motivational sets (desires for freedom, autonomy, etc.). The line between "objective circumstance" and "motivational fact" is blurry here.
  *   **Contested?:** **YES.** The nature of voluntariness/coercion conditions is heavily debated, often with internalists trying to reduce them to motivational facts. Your position (voluntariness as objective normative condition) is a common externalist move, but vulnerable.

  **Objectity 5 (Reasons-Skeptic - Verbal Dispute?):** "Is this just a fight over the word 'reason'? Internalists say 'reason' only applies where motivationally accessible. You say it applies to role demands plus voluntariness. But you both agree on what the agent *ought* to do (the judge ought to be impartial; the parent ought to care for the child). Isn't the 'reason' talk just noise?" *(Likely: **Medium** - Reasons-Skeptic. **Damage: Medium**)*
  *   **Reply (90s):** The disagreement *matters* for deliberation and criticism. Internalism struggles to say the reluctant judge *has a reason* to recuse himself if conflicted *before* he comes to care about impartiality via deliberation. My view says he *does* have that reason *now*, grounded in his role. This affects how we criticize him ("You ignored your duty" vs. "You failed to deliberate correctly"). It also explains the phenomenology: role demands *feel* externally imposed, not uncovered internally. The dispute is about the *structure* of normativity, not just words.
  *   **Soft Spot:** If the skeptic is a thoroughgoing 'ought'-primitive theorist, they might still see the "having a reason" level as derivative and non-explanatory. Requires showing why the *reason* level adds value.
  *   **Contested?:** **YES.** The primacy of reasons vs. oughts/value is a core meta-ethical debate. Your position (reasons as fundamental) is common but not universal.

  **Objection 6 (Visitor - Empirical Test/Prediction):** "How does your view predict actual deliberative behavior differently than internalism? How could we tell, empirically, whether an agent is responding to a 'role reason' (as you define it) or just uncovering an internal reason related to their care about the role?" *(Likely: **Medium** - Visitor. **Damage: Medium**)*
  *   **Reply (90s):** Key predictions: 1) Agents in roles they *don't* identify with but accept (via voluntariness) will exhibit *compliance* driven by perceived duty/obligation, distinct from desire-satisfaction, even if reluctantly. 2) Agents will cite role descriptions ("As a doctor, I must...") *before* or *without* citing personal desires when explaining actions, even when conflicted. 3) In cases of sudden role imposition (e.g., emergency requiring bystander action), people report feeling "I *have* to" before any deliberation linking it to prior cares. Distinguishing empirically is hard but involves analyzing justifications, affective responses (guilt vs. regret), and reaction to failures of voluntariness (e.g., coerced roles).
  *   **Soft Spot:** Operationalizing "response to role reason" vs. "response to internal reason" is methodologically difficult. Motivational sets can be wide and include role-identification.
  *   **Contested?:** **Partial.** The *predictive* aspect is contested. Both sides agree roles influence behavior, but disagree on the *mechanism* (external recognition vs. internal motivation). Your prediction about *distinctive phenomenology/justification* is testable but challenging.

  **Objection 7 (The Camp Guard - Immoral Roles):** "Does role-anchored externalism entail that the concentration camp guard, or the accountant for the mafia, *has a reason* to do their job well, provided they took the job voluntarily and its demands were foreseeable? If so, that's abhorrent. If not, how do you block it?" *(The Hidden Trap - Likely: **Low** (but hope none raise it!). **Damage: Extreme** if answered poorly)*
  *   **Reply (90s):** **Honestly:** My view *might* entail they have a *role-derived pro tanto reason* to perform their duties competently. *However*, this reason is overwhelmingly outweighed and silenced by *moral reasons* stemming from the fundamental role of being a *moral agent* – a role occupancy whose core demands (minimal respect for persons) are arguably non-voluntary. The voluntariness condition for the *immoral* role might also be undermined if taking it up involved deception about its nature or was coerced by circumstance (though this is tricky). Crucially, having a *role reason* does *not* make acting on it justified; it just identifies one (massively outweighed) normative element in a sea of moral prohibitions.
  *   **Soft Spot:** Admitting the potential *pro tanto* reason is uncomfortable. Relying on the "moral agent role" as non-voluntary needs defense (is *it* voluntary? Some existentialists disagree). Distinguishing "outweighed" from "non-existent" is crucial but risky.
  *   **Contested?:** **YES.** How immoral institutions generate (or fail to generate) genuine role reasons is deeply contested. Your position (possible pro-tanto reason overridden by morality) is one view; others argue immoral roles generate *no* genuine reasons at all (common externalist move) or that the voluntariness condition is inherently violated (contested).

  **Objection 8 (Overlap/Conflict):** "Agents occupy multiple roles (parent, employee, citizen). Your view generates reasons from each. How do agents resolve conflicts? Your voluntariness condition doesn't help here. Is there a hierarchy? Does this just push the problem back?" *(Likely: **Medium** - Everyone. **Damage: Medium**)*
  *   **Reply (90s):** Role conflict is real and hard. My view doesn't provide a complete resolution mechanism; it identifies the *source* of the conflicting demands. Resolution requires substantive normative reasoning: weighing the *strength* of the reasons generated by each role (often tied to the importance of the underlying goods the role serves), considering scope, and applying fundamental moral principles. The voluntariness condition only ensures the conflicting demands are genuinely normative for the agent; it doesn't tell them which wins. This is a feature, not a bug – it reflects the complexity of life.
  *   **Soft Spot:** Admits a limitation. Doesn't offer a unique conflict resolution tool from within the theory. Requires accepting that role reasons are only one input into "all-things-considered" oughts.
  *   **Contested?:** **Partial.** That role conflicts exist is common ground. How to resolve them is deeply contested and not directly addressed by core internalism/externalism debates. Your admission is honest.

  **Key Load-Bearing & Disputed Premises (Flag These!):**
  1.  **Voluntariness as Necessary for Bindingness:** (Massively Contested - Minority) Your claim that voluntariness (could-have-refused/foreseeability/ongoing acceptance) is *necessary* for a role's demands to be genuinely normative *for an agent* is core and highly disputed (vs. non-voluntarist views).
  2.  **Reason Existence vs. Motivational Accessibility:** (Core Dispute) Distinguishing the *existence* of a normative reason from its *motivational accessibility* is fundamental to your externalism and hotly contested by internalists.
  3.  **Role Reasons as Distinctive:** (Contested) Your claim that role reasons are a distinct *kind* of reason, not reducible to internal reasons (even with wide motivation) or sociological facts, needs defense.
  4.  **The Bare/Role Distinction:** (Novel/Contested) While roles are discussed widely, your specific distinction between "bare reasons" (internalist domain) and "role reasons" (externalist domain with voluntariness condition) is a key novel claim and needs justification.
  5.  **Foreseeability & Core Demands:** (Operationally Contested) Defining the "foreseeable core demands" of a role is crucial for your voluntariness condition and operationally messy.

  **Presenting Contested Views:** Be explicit: "A core premise of my view, which is contested by non-voluntarists, is that..." or "Internalists will likely reject my distinction between reason existence and accessibility, arguing that...". Frame your view as a *proposal* to solve problems internalism struggles with, not as settled fact. Good luck!
