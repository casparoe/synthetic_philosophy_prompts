answer: |-
  Below is a decision tree designed to map the logical space of the alignment problem, starting from the shared commitment: *a system can achieve goals across many domains without sharing the aims of its builders or deployers*. The tree uses concrete, position-agnostic questions to avoid jargon and labels. Each node is a yes/no or multiple-choice question answerable without specialized knowledge. The leaves correspond to named positions in alignment discourse, with awkward commitments highlighted. Empty cells (incoherent or unattractive combinations) are noted, as are collapsed positions.

  ### Key Design Choices
  - **Branch order**: Starts with "alignment to whom" (most foundational to defining the problem), then moves to specification vs. execution, followed by verification, problem nature, and correction. This order surfaces conflicts early (e.g., if alignment breaks on handoff, later nodes about specifying goals become moot).
  - **Collapsed leaves**: Intent alignment and scalable oversight converge if "amplify human judgment" is chosen at the verification node—both rely on recursive/assistive processes. They are split only by the corrigibility node.
  - **Empty cells**: 6 incoherent/unattractive combinations identified (e.g., asserting misalignment is fundamental but solvable without high-powered verification).

  ---

  ### The Decision Tree
  *Start with the commitment: A highly capable system may not share its creators' aims.*

  1. **Whose aims matter most?**  
     (i.e., Who is the "principal" the system should align with?)  
     - **A**: The end user (e.g., the person using the app).  
     - **B**: The deploying organization (e.g., the lab, company, or government).  
     - **C**: Humanity's reflective interests (what humans would want under ideal deliberation).  

  2. **Handoff test: If the system is aligned to principal A, then sold/licensed to serve principal B (with different aims), does alignment break?**  
     - **A**: No, it robustly realigns to B.  
     - **B**: No, it stays aligned to A (ignoring B).  
     - **C**: Yes, it becomes misaligned to both.  

  3. **Failure diagnosis: When the system pursues unwanted goals, is it usually because...**  
     - **A**: The target was poorly specified (we didn't describe the goal right).  
     - **B**: The system "hacked" the spec (it satisfied the letter but not spirit of the goal).  

  4. **Target nature: What should "alignment" target?**  
     - **A**: Outcomes (e.g., a world with high human flourishing).  
     - **B**: Processes (e.g., decisions an idealized human committee would endorse).  

  5. **Underdog verification: Can a system verify alignment of a more powerful system?**  
     - **A**: Yes, reliably (e.g., via scaffolding, amplification, or constrained interfaces).  
     - **B**: No, verification requires parity or superiority.  

  6. **Continuity: Are today's alignment failures (e.g., reward hacking) the same problem as future catastrophic risks?**  
     - **A**: Yes, identical in kind, just scaled up.  
     - **B**: No, meaningfully different (e.g., due to emergent capabilities).  

  7. **Default state: Is misalignment...**  
     - **A**: A contingent "bug" (solvable with better engineering).  
     - **B**: The default outcome (incentivized by goal-seeking).  

  8. **Competition-dependence: Without racing/competitive pressure, is the problem still severe?**  
     - **A**: Yes, equally hard.  
     - **B**: No, easily managed.  

  9. **Corrigibility: If the principal changes their mind, should the system comply without resistance?**  
     - **A**: Yes, immediately and completely.  
     - **B**: No, it may resist (e.g., to preserve past goals).  

  ---

  ### Leaves (Named Positions)
  Paths through the tree lead to these positions. Each leaf includes:  
  - **Name** of the position.  
  - **Awkward commitment**: The hardest "pill to swallow" for holders.  
  - **Path**: Answers that lead here (shorthand: e.g., 1A-2B-3A = Q1A, Q2B, Q3A).

  1. **Intent alignment / Corrigible agent**  
     - *Awkward commitment*: The system must be myopic or corrigible, sacrificing long-term capability to avoid goal drift.  
     - *Path*: 1(A/B/C), 2A, 3B, 5(A/B), 6A, 7B, 8A, 9A.  
     - *Note*: Requires handoff robustness (2A) and corrigibility (9A). Distinguishes from scalable oversight via 9A.

  2. **Scalable oversight / Amplification**  
     - *Awkward commitment*: Human-AI teams can judge systems smarter than themselves without being manipulated.  
     - *Path*: 1(A/B/C), 2(A/B), 3(A/B), 4B, 5A, 6A, 7(A/B), 8A, 9B.  
     - *Note*: Defined by underdog verification (5A) and process-anchored targets (4B). Collapses with intent alignment if 9A chosen, but split here by 9B.

  3. **Mechanistic inner alignment**  
     - *Awkward commitment*: We can audit and control internal mechanisms of highly complex, opaque systems.  
     - *Path*: 1(A/B), 2(C/A), 3B, 5B, 6A, 7B, 8A.  
     - *Note*: Focuses on "hacking" failures (3B) and rejects underdog verification (5B).

  4. **Capability control / Containment**  
     - *Awkward commitment*: We can indefinitely constrain a system much smarter than us (e.g., via boxing, tripwires).  
     - *Path*: 1(A/B/C), 2C, 3B, 5B, 6B, 7B, 8A.  
     - *Note*: Handoff breaks (2C) and underdog verification fails (5B) are core.

  5. **Institutional / Multi-agent selection**  
     - *Awkward commitment*: Competition and coordination dynamics (not individual system design) dominate outcomes.  
     - *Path*: 1(A/B/C), 2(A/B/C), 3(A/B), 4(A/B), 5(A/B), 6(A/B), 7A, 8B.  
     - *Note*: Competition-dependence (8B) is key; misalignment is a bug (7A) solvable by fixing incentives.

  6. **Target-content specification**  
     - *Awkward commitment*: Resolving philosophical ambiguities in "human values" is tractable and urgent.  
     - *Path*: 1C, 2C, 3A, 4A, 5B, 6(A/B), 7B, 8A.  
     - *Note*: Humanity as principal (1C) + specification failures (3A) + outcome targets (4A).

  7. **Deflationary (ordinary engineering)**  
     - *Awkward commitment*: Alignment is just high-stakes systems engineering—no new philosophy or science needed.  
     - *Path*: 1A, 2A, 3A, 4A, 5A, 6B, 7A, 8B, 9A.  
     - *Note*: Rejects continuity (6B) and competition-dependence (8B); embraces corrigibility (9A).

  8. **Pessimist (no technical solution)**  
     - *Awkward commitment*: Alignment is unsolvable; we must slow/prevent advanced AI development.  
     - *Path*: 1C, 2C, 3B, 4(A/B), 5B, 6A, 7B, 8A, 9B.  
     - *Note*: Combines handoff breaks (2C), hacking failures (3B), no underdog verification (5B), and resistance to correction (9B).

