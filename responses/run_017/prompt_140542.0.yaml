prompt: |-
  I need a teaching plan rather than an explanation, please. I've got 80 minutes on Thursday with about 25 second-years in a metaphysics course, third week of term, and the topic is the special composition question — when do some things make up one thing. So: don't explain it to me, tell me how to build the explanation.

  Things that make this awkward:

  - They did grounding and dependence last week and are now reaching for it for everything. My worry is they'll hear "is there a composite object over and above the parts" and decide it's obviously verbal — of course the particles are there, the only question is whether the chair-talk is grounded, and then they'll think they've dissolved something and switch off.
  - Roughly a third are joint honours with maths and have had some naive set theory. Last year that subgroup concluded that a composite just is the set of its parts, and I handled it badly.
  - This session has to set up the personal identity material in week eight — the animalism versus constitution-view stuff — so whatever example carries Thursday should be reusable when we ask whether something survives total change of parts. I keep using a different example in each session and it costs me.
  - No mereology assumed at all, so "part" has to get introduced informally somewhere.
  - I'm a universalist and I allways tip my hand in the last ten minutes and the room goes quiet. Where should my own view go, if anywhere?

  What I want: the order the pieces have to come in, and why — what genuinely depends on what. I don't think you can even state the question until they can keep composition apart from identity and from constitution, and I'm not sure which of those three has to land first. Then the one example to build the whole session around, and what it has to have and lack to do the job: it needs to be a case where contact, shared function and being alive come apart, it needs to resist the "that's just a set" move, and I think it should have a version where nothing is touching — tell me if I'm over-specifying. Then the misconceptions, with the point in the sequence where each should be headed off rather than all of them at the end: the verbal-dispute one, the set one, "chairs obviously exist so the nothing-composes view is silly", "restricted composition is obviously right because things have to be stuck together or interact causally", probably also the thought that the answer has to come out the same in every possible world, and anything else you'd predict.

  Also: of the four possible answers — nothing ever composes, everything always does, only under some conditions, and it's just brute — which should I actually develop in 80 minutes and which should I name and drop, because I can't do all four properly and last time I did none of them properly.

  And one end-of-session question that would show they've got it rather than that they've memorised my example. Last year everyone could hand the example back to me and I still don't think half of them could say what would have to be true for the nothing-composes answer to be false, in a way that isn't just "but there are chairs".

  Last thing: I want to openly refuse to do one thing and say so out loud. I'm tempted by whether the question is even well posed, and by whether the many are prior to the one or the one prior to the many, and I suspect both are above this level. Which should I name and decline, and why that one.
reasoning: |-
  Okay, the user is a metaphysics professor preparing an 80-minute session on the Special Composition Question (SCQ) for second-year students. They've outlined several challenges: students overapplying grounding/dependence from last week, math students reducing composition to set theory, needing to scaffold for future personal identity topics, introducing mereology informally, and their own universalist bias causing awkwardness. 

  They want a structured teaching plan rather than content explanation, with specific pain points addressed: sequencing concepts (composition vs identity vs constitution), selecting one versatile example that avoids math-reductionism, preempting common misconceptions at strategic points, deciding which SCQ answers to develop in depth, and crafting an assessment question that tests genuine understanding.

  Hmm... the real tension here is between conceptual foundations and pedagogical efficiency. The professor needs to:
  - Build enough precision to prevent grounding/dependence oversimplification (without getting bogged down in mereology)
  - Neutralize the set theory reduction while respecting math students' background
  - Plant seeds for Week 8's personal identity debate through example choice
  - Manage their own philosophical position transparently

  Key insights emerging:
  1. **Sequencing is everything** - must disentangle composition from identity/constitution upfront, but constitution can wait until later if the example is chosen well. The "is this one thing?" question needs to precede technical terms.
  2. **The example is the backbone** - it must have: 
     - Separable features (contact, function, life)
     - Non-touching variant (to break "sticking together" intuition)
     - Resistance to set-theoretic reduction (so no abstracta)
     - Personal identity applicability (suggesting artifacts vs organisms)
  3. **Misconception triage** - the "verbal dispute" and "set" issues are most urgent and must be killed early during the example exploration. "Chairs exist" can be deferred to when discussing nihilism.
  4. **Position management** - revealing universalism late is fine if presented as "one option" rather than conclusion. Should explicitly bracket priority/metaphysical fundamentality debates as beyond scope.

  The professor's anxiety about students "switching off" after pseudo-resolving via grounding suggests they need to make the *stakes* visible early - perhaps through a deliberately counterintuitive case (destroyed chair reassembled identically?) that creates cognitive dissonance.

  For the assessment question, asking for necessary/sufficient conditions tests whether they grasp SCQ's structure beyond examples. The "what must be true for nihilism to be false" formulation is perfect - it forces abstraction.

  ...time to structure this into timed blocks with rationale for each pivot point.
answer: |-
  Here’s a step-by-step teaching plan for your 80-minute session on the Special Composition Question (SCQ), designed to address your constraints and pitfalls. The goal is to build conceptual clarity, preempt misconceptions, and scaffold future personal identity topics using one reusable example.

  **Core Structure:**  
  **Phase 1: Question-Framing (20 min)**  
  **Phase 2: Case Study & Misconception Busting (35 min)**  
  **Phase 3: Exploring Answers & Stakes (20 min)**  
  **Phase 4: Wrap-up & Assessment (5 min)**  

  ---

  ### **PHASE 1: Question-Framing** (20 min)  
  *Goal: Isolate composition from related concepts; show SCQ is substantive.*  

  1. **Opening Hook (3 min):**  
     - Display an image of **a disassembled IKEA chair** (parts laid out) vs. **an assembled chair**.  
     - Ask: *"Is there one object here in both cases? When do the parts become a chair?"*  
     - **Why:** Forces confrontation with composition (not identity/constitution).  

  2. **Clarify "Composition" vs. "Identity" (7 min):**  
     - Define informally: **Composition = when parts form a whole** (e.g., planks compose a raft).  
     - Contrast: **Identity = when X and Y are the same thing** (e.g., chair = its mass of atoms?).  
     - Use **LEGO bricks**: Assemble 6 bricks into a cube. Ask: *"Is the cube identical to the bricks, or composed by them?"*  
       - **Key move:** "Identity is all-or-nothing; composition asks *if* there’s a whole beyond parts."  
     - **Why:** Prevents grounding/reduction oversimplification by separating "is there a whole?" from "what grounds chair-talk?".  

  3. **State the SCQ (5 min):**  
     - Formalize: *"Under what conditions do some things compose a further thing?"*  
     - Emphasize: **This is not verbal**—it asks whether a composite object *exists at all* (e.g., if no composite, "chair" refers to particles arranged chair-wise).  
     - **Why:** Blocks "it’s just semantics" by framing as an ontological question.  

  4. **Flag Constitution for Later (5 min):**  
     - Preview: *"Later we’ll ask if a composite persists through part-change—e.g., is the chair the same if all parts are replaced? Save that for Week 8!"*  
     - **Why:** Avoids conflation; signals SCQ is foundational for persistence.  

  ---

  ### **PHASE 2: Case Study & Misconception Busting** (35 min)  
  *Goal: Use one versatile example to dissect criteria and block dead ends.*  

  **Core Example: A Living Tree (with detachable components)**  
  - **Why this works:**  
    - Separates contact (roots/touching branches vs. detached fruit), function (photosynthesis), and life (tree vs. dead trunk).  
    - Non-touching version: A tree with a **bird’s nest woven from its fallen twigs** (nest parts not touching, not alive, but tree-dependent).  
    - Resists "just a set": Sets are abstract; the tree is concrete and causally unified.  
    - Reusable for personal identity: Organisms survive part-change (vs. artifacts).  

  1. **Explore Criteria (15 min):**  
     - Present scenarios. For each, ask: *"Do these parts compose one thing?"*  
       - *Case 1:* Roots, trunk, branches **touching and alive**. (Yes? Function/life.)  
       - *Case 2:* Same tree, **dead and decaying**. (Yes? Contact only.)  
       - *Case 3:* **Detached fruit** on the ground nearby. (No? No contact.)  
       - *Case 4:* **Nest made from tree’s twigs** (not touching tree). (No? No shared function/life.)  
     - **Student task:** List conditions they intuit (contact, function, life).  

  2. **Crush Two Key Misconceptions (20 min):**  
     - **Misconception 1: "Composites are just sets of parts."**  
       - *Response:* "Sets don’t cause photosynthesis or fall in storms. The tree has causal powers the set lacks."  
       - **Why now:** Math students need this blocked *during the example* to engage.  
     - **Misconception 2: "Obviously chairs exist, so nihilism is silly."**  
       - *Response:* "Nihilism says chairs *don’t exist*—there are only particles arranged chair-wise. Our question is whether that arrangement suffices for a new object."  
       - **Why now:** Prevents dismissal of extreme views before they’re explored.  
     - **Other quick fire rebuttals:**  
       - *"Restricted composition is obvious"* → "Why is ‘sticking together’ metaphysically special?"  
       - *"Answer must be necessary"* → "Could composition be contingent? (E.g., if contact matters, a breeze changes what exists?)"  

  ---

  ### **PHASE 3: Exploring Answers & Stakes** (20 min)  
  *Goal: Compare 2 answers deeply; flag others; position your view non-disruptively.*  

  1. **Develop TWO Answers (15 min):**  
     - **Nihilism (Nothing composes):**  
       - *Argument:* "Only particles exist; ‘tree’ is shorthand for particles tree-wise."  
       - *Challenge:* "Does this mean *you* don’t exist? (Preview Week 8.)"  
     - **Universalism (Everything composes):**  
       - *Argument:* "Any arbitrary parts compose a whole (e.g., the tree-nest-trunk object)."  
       - *Challenge:* "Why think scattered objects exist?"  
     - **Name & Drop:**  
       - *Brutalism (brute facts):* Mention as "some say there’s no general rule."  
       - *Restricted:* Note it’s intuitive but hard to defend (e.g., why contact?).  

  2. **Your Universalism (5 min):**  
     - **Placement:** End of answers section.  
     - **Delivery:** "I find universalism avoids arbitrary boundaries—but its strangeness shows how deep the puzzle is. Your job is to find your own answer."  
     - **Why:** Neutralizes tension by acknowledging strangeness; avoids preaching.  

  ---

  ### **PHASE 4: Wrap-up & Assessment** (5 min)  

  1. **Explicitly Decline One Thing (2 min):**  
     - *"We’re not asking whether wholes or parts are metaphysically prior—that’s a deeper debate for advanced courses. Focus first on when composition happens."*  
     - **Why:** Priority debates derail SCQ’s accessibility; stakes are clearer without it.  

  2. **Assessment Question (3 min):**  
     - *"Suppose nihilism is false. What must be true about the world? (Not: ‘chairs exist’—tell me what conditions must hold for composition to occur.)"*  
     - **Why:** Tests grasp of SCQ as a *general* question (e.g., "There must be a non-arbitrary relation R such that...").  

  ---

  ### **Why This Sequence Works**  
  - **Example-first:** The tree grounds abstraction in concrete cases (contact/function/life), reusable for Week 8.  
  - **Misconceptions preempted:** Math students hear why sets fail *during* the example; grounding over-application blocked by framing SCQ ontologically.  
  - **Efficient answers:** Nihilism/universalism contrast sharply; brutalism/restricted are noted but not developed.  
  - **Your universalism:** Delivered late as *one option*, not a conclusion.  
  - **Declined priority debate:** Keeps focus on SCQ’s core without oversimplifying metaphysics.  

  **Materials:** Project images of the tree cases; whiteboard for criteria lists. **Pacing:** Strictly time Phases 1–2 to leave 25 min for answers/stakes.
