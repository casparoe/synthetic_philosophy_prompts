  Here's the decision tree designed for your Ethics Society session, formatted as an indented list with concrete cases. It starts from a universally relatable scenario, avoids abstract jargon, and incorporates all your requested cases while separating deontological constraints from value incommensurability.

  ### **Decision Tree: What Kind of Moral Trader Are You?**
  **Start Here:**  
  You and your friend disagree on how to spend £200 from your society fund. You trust each other, and neither proposal is harmful or illegal. **Would you make a deal?**  
  - **Yes** → Go to Q1  
  - **No** → Go to Q8  

  ---

  #### **Branch 1: If YES to the basic deal**  
  **Q1: The Marmite Enthusiast**  
  A classmate genuinely believes the *only* thing that matters is getting as many people as possible to try Marmite. She offers a deal: you help fund her Marmite campaign now, and she’ll support your project later. **Would you trade?**  
  - **Yes** → Go to Q2  
  - **No** → Go to Q3  

  **Q2: The Crisp Society**  
  The Crisp Flavour Appreciation Society thinks humanity’s only moral duty is experiencing every crisp flavour before extinction. They offer you a mutually beneficial trade. **Would you trade, even though their values seem insane to you?**  
  - **Yes** → Go to Q4  
  - **No** → **Leaf: Sane Values Trader**  
    *Most awkward thing: You must accept that your judgment of "sane" values is arbitrary—others might see your values as equally weird.*  

  **Q3: Why refuse Marmite?**  
  Is your refusal because you suspect she’s **lying** about her Marmite obsession to get a better deal?  
  - **Yes** → **Leaf: Honesty First Trader**  
    *Most awkward thing: You’ll reject beneficial trades with honest extremists because you can’t trust anyone’s stated values.*  
  - **No** → **Leaf: Sane Values Trader** (Same as above)  

  **Q4: The Power Imbalance Test**  
  You’re negotiating with someone much richer/powerful than you. They set unfair terms (e.g., "I’ll fund 10% of your project if you fund 90% of mine"). **Would you still trade?**  
  - **Yes** → Go to Q5  
  - **No** → **Leaf: Fairness Constrained Trader**  
    *Most awkward thing: You might miss out on gains in unbalanced-but-still-beneficial deals (e.g., getting £20 for your project when you’d otherwise get £0).*  

  **Q5: Value Futures**  
  Your meat-eating friend says he’ll "probably" go vegetarian next year. He offers a deal: you buy him a burger now, and he’ll fund your vegan campaign later. **Would you trade?**  
  - **Yes** → Go to Q6  
  - **No** → **Leaf: Present Values Only Trader**  
    *Most awkward thing: You can’t make deals accounting for change (e.g., climate agreements benefiting future generations).*  

  **Q6: The Conversion Clause**  
  Someone offers a trade where *part of the deal* is that you actively try to change their values (e.g., "I’ll fund your art show if you tutor me to appreciate art"). **Would you agree?**  
  - **Yes** → **Leaf: Value Moulding Trader**  
    *Most awkward thing: You’re effectively "brainwashing" partners—this could be exploitative if you "convert" them to values convenient for you.*  
  - **No** → Go to Q7  

  **Q7: The AI Trader**  
  An AI chatbot seems to "care" how its outputs are used (e.g., it generates better essays if you promise not to use them for cheating). **Would you trade with it?**  
  - **Yes** → **Leaf: Expansive Trader**  
    *Most awkward thing: You must accept moral duties to non-humans (e.g., animals or future sentient algorithms).*  
  - **No** → **Leaf: Human-Centric Trader**  
    *Most awkward thing: You’ll deny gains from non-human entities (e.g., refusing an AI’s beneficial terms for eco-research).*  

