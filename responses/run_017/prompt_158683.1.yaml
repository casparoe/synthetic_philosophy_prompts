prompt: |-
  so there's this fight that's been going in my effective-altruism-adjacent group chat for over a year, and the two people at the center of it — Marcus and Dana — have finally agreed, sort of grudgingly, to do an adversarial collaboration. I got volunteered to organize it. Can you draft the joint document they'd sign?

  Here's where each of them is, as best I understand it. I'm not going to say which one I think is right, because I honestly don't know, and I don't want that leaked into the doc.

  Marcus's side, roughly: if we don't wipe ourselves out and things go okay, the future could contain astronomically many lives — orders of magnitude more people than have ever lived — spread across Earth and eventually space. So (i) lowering the chance of an early extinction or a permanent civilizational collapse matters more in expectation than anything we could do for people alive right now, and (ii) even a tiny probability of nudging the long-run trajectory somewhere better beats a near-certain small gain, because the stakes are so much bigger. He also thinks influence is concentrated in certain moments, so deliberately waiting and holding resources until the influence is high is a real strategy and not just procrastination.

  Dana's side has three complaints. (a) Our causal claims about centuries out are garbage: effects wash out, we can't tell sign from noise, and running an expected-value calculation over that is multiplying numbers we made up. (b) It isn't even settled that adding vast numbers of happy future lives counts as a benefit — a lot of ordinary moral thinking is about making people who already exist better off, not bringing new ones into existence, and preventing a collapse is exactly the case where none of the future people are better off than they'd otherwise be. (c) Once you grant astronomical stakes plus guessed probabilities, you get thousands of speculative causes each claiming a small shot at a giant payoff, and we have no reliable way to rank them — so ranking them is mostly noise, and acting on the ranking is worse than doing something with measured, robust returns now.

  What I want in the document:

  1. A numbered section of agreed claims — the things both can sign without squinting. It should at minimum cover: how bad a permanent collapse would be, and why that isn't actually the crux between them; the point that a giant number of future people settles nothing on its own without the probabilities; the seperate questions of whether the far future is worth a lot and whether we can do anything about it; and the distinction between benefits to people who would exist either way and benefits that consist in which people end up existing. Add anything you think genuinely belongs. Don't put anything in there that only one of them would accept if you squinted at it.

  2. A table of the disagreements that are left. One row per disagreement, with the question stated neutrally and then two formulations — one Marcus would sign as his own view, one Dana would sign as hers — each specific enough that you could tell if someone had changed their mind. No vacuous filler rows.

  3. The cruxes: the sub-questions where settling them would actually move at least one of them. For each crux, give a concrete case, hypothetical, or piece of evidence both would agree bears on it, and write down each side's prediction in advance. I want at least these four covered, in whatever framing you think is cleanest:

  - How long the identifiable effects of present-day actions actually last. Is there something like a half-life of influence across centuries, or do effects mostly wash out within a few generations? What would each of them expect to find if we could really trace it?
  - The different-people point: whether averting a collapse that changes who comes to exist counts as a benefit at all, and how much of Marcus's case survives if it partly doesn't.
  - Whether the aim should be steering the future toward outcomes we currently think are good, or protecting later generations' ability to decide for themselves. I floated an idea in the chat that maybe the whole thing should be reframed around option value: act to widen and defend the range of choices available to people later, rather than picking the outcome you like, since they'll know more than we do and a wrong pick could get locked in. Marcus half liked it; Dana said it just smuggles the astronomy back in under a new name. Put it in as a live option and say exactly what it would and wouldn't settle.
  - The lock-in case. Suppose you could either make extinction basically impossible but permanently freeze in a mediocre value system, or leave things risky — a real chance of collapse — with the future's values wide open. Make both of them say which they'd take and why, and say what their answers reveal about whether they're really arguing about the size of the stakes or about something else entirely.

  4. A short section on which parts of their argument are verbal — where they're using the same word for different things ("expected value," "robust," "existential risk," "dominates") — and why.

  5. A short section on what each of them should count as evidence against their own position, and whether there's anything at all both would agree would genuinely move the debate, versus what they'd each just reinterpret to fit.

  Format: numbered agreed-claims first, then the disagreements table, then the cruxes with the predictions laid out readably, then the last two sections. Write it in American English. And please don't cite papers, name authors, or drop footnotes — I want the argument itself, not a reading list, and half of us are reading this on our phones anyway. Don't pad it either: if a crux doesn't have a real test either side would accept, say so instead of inventing one.
reasoning: |-
  Okay, let me unpack this request. The user is organizing an adversarial collaboration between Marcus and Dana, two people locked in a year-long EA-adjacent debate about longtermism versus near-term action. I need to craft a joint agreement document that structures their core disagreements without bias.

  First, analyzing the key components:
  Marcus focuses on astronomical stakes - preventing extinction to secure a vast future population. He believes in strategic patience for high-leverage moments. Dana counters with three points: (1) long-term predictions are unreliable, (2) creating future lives may not be morally equivalent to helping existing people, and (3) speculative causes can't be reliably ranked.

  The document must include five elements:
  1. Agreed claims: Neutral common ground statements
  2. Disagreements table: Clear opposing views per row
  3. Cruxes with testable predictions: Four specific points requiring concrete stances
  4. Verbal distinctions: Clarifying terminology differences
  5. Falsifiability: What evidence would challenge each position

  For agreed claims, I'll focus on undisputed fundamentals like the badness of permanent collapse being separate from the moral weight of future lives. The disagreements table needs razor-sharp formulations - one row per conflict, no overlap. The cruxes are especially critical: I'll frame them around influence decay timeframes, moral status of future people, option value versus steering, and the lock-in hypothetical.

  Terminology clashes like "expected value" and "robust" need explicit definition. Finally, falsifiability requires honesty about what could actually shift positions - no invented tests where none exist.

  The tone must remain strictly neutral throughout. Since they're grudging participants, clarity and conciseness are paramount - no padding, no citations. I'll use American English and mobile-friendly formatting as requested.
answer: |-
  Here’s a streamlined joint document adhering to your specifications. It focuses on structure, neutrality, and actionable disagreement points.

  ---

  **Adversarial Collaboration Agreement: Long-Term Impacts & Prioritization Framework**  
  *Between Marcus and Dana*  
  *Facilitated by [Your Name/Group Chat]*

  ---

  ### 1. Agreed Claims  
  *Both parties affirm these statements without reservation:*  
  1. A permanent civilizational collapse (i.e., unrecoverable loss of advanced technological capacity and value trajectory) would be a significant moral loss relative to trajectories avoiding collapse.  
  2. The *mere possibility* of astronomical future populations does not, by itself, resolve disagreements about present priorities.  
  3. There are two distinct questions:  
     - (a) Whether the far future has high moral significance.  
     - (b) Whether present actions can robustly influence that far future.  
  4. Benefits to individuals who would exist regardless of our actions ("same-people benefits") are conceptually distinct from benefits arising from creating different future individuals ("different-people benefits").  
  5. Predicting specific outcomes centuries in advance involves significant uncertainty.  

  ---

  ### 2. Table of Disagreements  
  | **Disagreement** | **Marcus’s Position** | **Dana’s Position** |
  |------------------|------------------------|----------------------|
  | **Scope of Actionable Influence** | Present actions can durably redirect civilization’s trajectory for centuries or longer, creating opportunities for pivotal interventions with long-lasting effects. | Identifiable effects of present actions rarely persist beyond 50-100 years; beyond that, noise dominates signal, making targeted influence impossible. |  
  | **Moral Weight of Future Populations** | Preventing extinction/collapse is a moral imperative because it preserves vast potential future value, regardless of whether specific individuals are affected ("different-people benefit"). | Preserving future populations has limited moral weight if no identifiable individual is made better off than they would otherwise be; "same-people benefits" dominate. |  
  | **Resource Allocation Strategy** | When stakes are astronomical, expected-value calculations justify prioritizing low-probability, high-impact interventions over high-certainty, small-scale ones, even with model uncertainty. | With unreliable long-term models, robust near-term actions with measurable returns dominate speculative long-term bets, which are often indistinguishable from noise. |  

  ---

  ### 3. Cruxes & Testable Predictions  
  #### **Crux A: Half-Life of Influence**  
  - **Question:** How long do identifiable causal effects of a major policy intervention (e.g., global AI governance treaty) persist?  
  - **Marcus Predicts:** >30% of the intended directional effect remains traceable after 200 years.  
  - **Dana Predicts:** <5% remains traceable after 100 years; effects are indistinguishable from background drift by 150 years.  
  - **Evidence:** Historical case studies (e.g., Magna Carta, Kyoto Protocol) analyzed for persistence of intended causal chains vs. confounding factors.  

  #### **Crux B: Moral Status of Preventing Collapse**  
  - **Question:** Is preventing collapse that changes which people exist a net moral benefit if we assume future lives would be positive?  
  - **Marcus:** Yes—preserving the potential for value is paramount, even with different individuals.  
  - **Dana:** No—without identifiable victims harmed by collapse (since no one exists to be deprived), the moral urgency is minimal.  
  - **Test Case:** If preventing collapse requires sacrificing a guaranteed 10% increase in quality of life for 1 billion present people, Marcus endorses it; Dana rejects it.  

  #### **Crux C: Option Value vs. Steering**  
  - **Question:** Should we prioritize preserving future choice (option value) or actively steering toward a specific outcome?  
  - **Option Value Framing:** *"Focus resources on preventing irreversible losses (e.g., extinction, value lock-in) to maximize future agency."*  
  - **Marcus:** Accepts this framing but argues it still implies astronomical stakes (e.g., preserving option value for trillions).  
  - **Dana:** Rejects—"irreversible losses" still require unmeasurable long-term models. Near-term agency protection (e.g., democracy) dominates.  
  - **Settlement Condition:** Only if Dana concedes that defending option value *without* quantifying long-term stakes is viable.  

  #### **Crux D: Lock-In vs. Risk**  
  - **Hypothetical:** Choose:  
    - **Option 1:** Permanently prevent extinction but lock in a mediocre value system (e.g., permanent shallow contentment).  
    - **Option 2:** Accept 20% extinction risk this century, allowing future value evolution.  
  - **Marcus Chooses:** Option 2 (risk preserves potential for higher peaks).  
  - **Dana Chooses:** Option 1 (certainty of survival dominates speculative value gains).  
  - **Reveals:** Marcus prioritizes *peak potential*; Dana prioritizes *avoiding catastrophe*. Stakes alone don’t resolve this.  

  ---

  ### 4. Verbal Distinctions  
  Key terms used differently:  
  - **"Expected Value":**  
    - Marcus: Includes deeply uncertain but non-zero probabilities of massive payoffs.  
    - Dana: Requires quantifiable, replicable probability estimates.  
  - **"Robust":**  
    - Dana: Interventions with measurable, near-term outcomes.  
    - Marcus: Interventions addressing tail risks with persistent effects.  
  - **"Existential Risk":**  
    - Both: Permanent collapse.  
    - Marcus *also* includes trajectories locking in low-value futures.  
  - **"Dominates":**  
    - Dana: Outperforms under all plausible short-term models.  
    - Marcus: Outperforms in expectation under credible long-term models.  

  ---

  ### 5. Falsifiability & Evidence  
  - **Marcus would reconsider if:**  
    - Rigorous models show influence decay to noise within <100 years *across diverse interventions*.  
    - Proof that future lives (post-collapse-averted) are net valueless *even under his ethics*.  
  - **Dana would reconsider if:**  
    - A mechanism for durable influence (e.g., recursive self-improvement) is demonstrated with measurable persistence >150 years.  
    - Evidence that near-term actions systematically *harm* long-term option value (e.g., via path dependency).  
  - **Shared Sticking Point:** No agreed test resolves whether "different people" benefits have moral weight.  
  - **Neither would accept:**  
    - Retrospective "just-so stories" about past interventions as conclusive proof.

  ---

  **Signed:**  
  ________________________ (Marcus)  
  ________________________ (Dana)  
  **Date:** ________________________  

  ---  
  This document isolates core disagreements, forces concrete predictions, and clarifies terminological noise. It avoids advocacy, centers testable claims, and explicitly flags irreconcilable priors (e.g., moral weight of future lives). Format optimized for mobile readability.
