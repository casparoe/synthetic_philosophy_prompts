prompt: |-
  I chair the appeals committee of a housing cooperative: 340 households, a written Code of about ninety rules, and a rotating panel of three volunteers, none of whom has any legal training. I repair lifts for a living. We hear roughly four appeals a month, and the stakes are not small: most of our decisions are about fines, but about one in six is about whether someone keeps their home. We have two hours per hearing. Every decision has to be reduced to a short written "reasons" paragraph that is posted on the members' noticeboard and read aloud at the next general meeting, and any decision that departs from the Code has to be ratified by the elected board, which meets only quarterly — so a departure we cannot justify in writing is, in practice, a departure we cannot make.

  I have been reading about law and morality on my own for a few years, with no teacher. The thing I keep coming back to is a well-known mid-century exchange between two law professors, H. L. A. Hart and Lon Fuller, which I first met in an encyclopedia summary and then chased into a public library. As I understand the disagreement: one side says there is no necessary connection between what a rule is and what it ought to be, so that a rule can be perfectly genuine law and still be too cruel or too stupid to apply; when that happens, the honest course is to say so plainly, take the cost of departing from it, and get it changed for the future, rather than pretending the rule never said what it plainly said. The other side says this picture of a "valid" rule is far too thin: a body of rules that is contradictory, or unpublished, or retrospective, or impossible to comply with, or that shifts every week, has not done what rules exist to do, and its subjects owe it something less than fidelity — which makes the question "is this really one of our rules?" a moral question through and through, not a separate preliminary one. I believe there was a case at the centre of it about people who informed on their neighbours under the rules of a regime that was itself criminal, and about what a court should do afterwards. Correct me if I have any of this wrong, but please do not spend your answer explaining the debate back to me or pointing me at books and articles; I have no library access beyond the municipal one and no stomach for a reading list. What I want is the argument turned into something three volunteers can actually run in an evening.

  Two wrinkles that make this harder than the general question. First, our Code already contains a provision we call Rule 0: no member may be penalised for failing to comply with a rule they could not reasonably have known about, and nothing in the Code requires the impossible. So the Fuller-flavoured worry is partly written into our own rules, and sometimes the dispute is about what Rule 0 demands rather than about Rule 0 itself. Second, the co-op stopped keeping a printed copy of the Code in the office last year and now publishes it only through a members-only web portal.

  What I would like from you is a decision procedure for cases where a member has admittedly done what a written rule forbids, and the panel nonetheless suspects that applying the rule would be wrong. Please give me: the questions to ask, in the order I should ask them; what counts as a sufficient answer to each question; the point at which the procedure simply stops with "apply the rule"; the point at which it stops with "do not apply it"; and the point at which it hands the matter to the board, or to a person, because the remaining question is one of values rather than of fact. I also want a short template for the written reasons paragraph, built so that it forces the panel to distinguish (a) what the rule required, (b) what we did and what we are relying on when we depart, and (c) what we are changing for future cases — because I have found that the panel's drafts collapse those three into one soothing sentence. The whole procedure has to fit on one side of A4 pinned above the noticeboard, readable by someone with no theory, and I need you to mark clearly which steps are really judgment dressed up as procedure.

  Then run it on three cases.

  One. A member in her eighties was fined for keeping a bicycle in a stairwell. The rule is genuinely in the Code, but she has never used a computer, and she says she asked at the office and was told the old binder had been thrown out. Under Rule 0 the panel has to decide what "could not reasonably have known" requires of the co-op and not only of the member.

  Two. Code rule 34 says no commercial vehicles may be left overnight in the courtyard. A member's son, who works for a removals firm, left his employer's van there for eleven hours because he was helping a neighbour with a broken leg move her furniture down from a second-floor flat before a surgery date. The van did not block fire access, and neighbours have said they were glad of it. The rule exists to stop the courtyard becoming a depot and to keep access clear. I will be honest with you: if your procedure ends up fining this man I will be unhappy, and part of me will want to throw the procedure out rather than accept the result. Please give me the result the procedure actually yields, and then tell me separately what I would be doing to the enterprise if I overrode it by hand.

  Three. In 2019 a member reported a neighbour for keeping an unregistered lodger, and the neighbour was fined and given a formal warning under a rule the co-op repealed in 2021 after concluding the then-committee had used it vindictively. The neighbour now applies to have the warning expunged and the fine repaid out of co-op funds. The reporting member broke no rule at the time. This is the case my panel handles worst: it is no good asking whether the rule was valid then, since it was, and no good asking whether the outcome was bad, since on that test every repealed rule reopens. I want to know what the procedure does with a rule that was properly made and has since been, so to speak, disowned.

  Finally, tell me what this procedure cannot do: the kinds of case it will systematically get wrong, and the point at which I should stop trusting it and put the matter to the whole membership instead.
reasoning: |-
  Okay, the user chairs an appeals committee for a housing cooperative and is grappling with applying legal philosophy to practical decisions. They need a decision procedure for cases where a rule exists but applying it seems wrong. Let me unpack their situation.

  First, the context: 340 households, a Code of 90 rules, a panel of three volunteers without legal training. They handle about four appeals a month, with high stakes including potential loss of home. Hearings are limited to two hours, and decisions must be written concisely. Any departure from the Code needs board ratification, which only happens quarterly. The user has been self-studying Hart vs. Fuller's debate on law and morality but needs a practical tool, not theory.

  Key constraints: Rule 0 exists (no penalties for unknowable or impossible rules), the Code is only online, and the procedure must fit on one A4 page. The user provided three test cases to validate the procedure.

  Breaking down the needs:
  - A step-by-step decision flowchart for rule application dilemmas
  - Clear questions with sufficiency thresholds
  - Defined stopping points (apply/don't apply/refer)
  - A reasons template separating (a) rule requirement, (b) departure basis, (c) future change
  - Honesty about where judgment masquerades as procedure
  - Analysis of three specific cases
  - Limitations of the procedure

  The Hart-Fuller tension is operationalized through Rule 0 (which embodies Fuller's "internal morality of law") but needs concrete implementation. The user's hidden frustrations surface in Case 2 (the removal van) - they want fairness but fear procedure might contradict this. Case 3 (repealed rule) exposes retrospective justice dilemmas.

  For the procedure structure:
  1. Start with strict validity (Hartian view) but build Fuller-esque escape valves via Rule 0 interpretation.
  2. Prioritize accessibility concerns given digital-only Code.
  3. For "unjust application" cases, require high thresholds to avoid arbitrariness.
  4. The template must force clarity to prevent moral discomfort being buried in vague language.

  Notable pitfalls:
  - Rule 0's "reasonably known" is inherently judgment-based (procedure can't eliminate this)
  - Retrospective cases (like Case 3) may need political solutions, not adjudication
  - The van case might expose gaps between written rules and community values

  In testing Case 2 (van), the procedure should technically uphold the fine but flag it for rule reform - satisfying Hartian integrity while creating a Fullerian feedback loop. Overriding it would undermine the system's credibility, even if morally gratifying short-term.

  Ultimately the procedure's weakness is handling systemic injustice (like Case 3) or values conflicts - exactly where Fuller would say "this isn't law at all." The exit valve is membership referendum when core community values are contested.
answer: |-
  Here is a practical decision procedure for your appeals panel, designed to handle "rule applies but shouldn't" cases. It fits on one A4 page and incorporates Rule 0 while minimizing theoretical jargon.

  ---

  **DECISION PROCEDURE: WHEN A RULE SEEMS WRONG TO APPLY**  
  *(For Appeals Panel Use Only)*  

  **ASK THESE QUESTIONS IN ORDER:**  
  1. **"Was the rule accessible to this member?"**  
     - *Check:* Could the member physically access the Code? (e.g., non-computer users, office misdirection).  
     - *Sufficient "no" answer:* Member couldn’t reasonably access it (e.g., no computer + office denied them a copy).  
     - **→ STOP HERE if "no":** *Do not apply the rule/fine.* Cite Rule 0.  
     - *Judgment point:* What "reasonably" means for this member’s situation.  

  2. **"Is following the rule literally impossible for this member?"**  
     - *Check:* Physical/mental impossibility, not just hardship.  
     - *Sufficient "yes" answer:* Unavoidable emergency (e.g., medical crisis forced rule-breaking).  
     - **→ STOP HERE if "yes":** *Do not apply the rule/fine.* Cite Rule 0.  

  3. **"Does applying the rule here contradict its written purpose?"**  
     - *Check:* Code preamble, meeting minutes, or rule’s stated intent (e.g., "keep access clear" ≠ "no emergencies").  
     - *Sufficient "yes" answer:* Application directly undermines the rule’s goal with no offsetting harm.  
     - **→ STOP HERE if "yes":** *Do not apply the rule.* Cite "rule purpose."  
     - *Judgment point:* Interpreting the rule’s purpose.  

  4. **"Would applying the rule cause extreme, disproportionate harm?"**  
     - *Check:* Eviction over minor issue, health/safety crisis, or grossly unfair outcome.  
     - *Sufficient "yes" answer:* Harm vastly outweighs the violation’s severity (e.g., fining a caregiver during a medical emergency).  
     - **→ STOP HERE if "yes":** *Do not apply the rule.* Cite "unjust outcome."  
     - **→ REFER TO BOARD if borderline:** They ratify departures.  
     - *Judgment point:* What counts as "extreme harm."  

  5. **"Is the rule itself incoherent or self-contradictory?"**  
     - *Check:* Rule conflicts with another Code rule or is logically unworkable.  
     - *Sufficient "yes" answer:* Obvious contradiction (e.g., "No pets" but "Assistance animals permitted").  
     - **→ REFER TO BOARD:** They must resolve systemic issues.  

  6. **→ DEFAULT OUTCOME:** *Apply the rule as written.* If all answers are "no" or insufficient, enforce it.  

  ---

  **WRITTEN REASONS TEMPLATE**  
  *(Fill in bracketed sections; keep under 100 words)*  

  > "Rule [X] required [specific action]. The member admitted [violation]. However, we do not enforce it here because [clear reason: e.g., ‘Rule 0: member could not access the Code’ / ‘application contradicted rule’s purpose to…’ / ‘would cause disproportionate harm by…’].  
  > **This decision relies on [Rule 0 / rule purpose / avoiding unjust harm].**  
  > **For future cases:** [Specify if change is needed: e.g., ‘Office must provide printed Code on request’ / ‘Board should review Rule 34 for emergencies’]. The rule remains unchanged unless amended by the membership."  

  ---

  **APPLICATION TO YOUR CASES**  

  **Case 1 (Bicycle in stairwell):**  
  1. **Accessible?** No – non-computer user + office misled her.  
     → **STOP:** *No fine.*  
     *Reasons template:*  
     > "Rule 15 bans items in stairwells. Member admitted storing a bicycle. We do not enforce it here because *Rule 0: member could not reasonably access the Code after office misdirection*. **Relies on Rule 0. For future cases:** Office must provide printed Code copies within 24hrs when requested."  

  **Case 2 (Commercial van overnight):**  
  1. Accessible? Yes.  
  2. Impossible? No.  
  3. **Contradict purpose?** Yes – rule’s purpose is to prevent depot use/block access. Van served emergency (medical move), no blockage.  
     → **STOP:** *No fine.*  
     *Reasons template:*  
     > "Rule 34 prohibits overnight commercial vehicles. Member’s son admitted leaving a van. We do not enforce it here because *application would contradict the rule’s stated purpose (preventing depot use/blocking access) during a documented medical emergency*. **Relies on rule purpose. For future cases:** Board should clarify if Rule 34 permits emergency exemptions."  
     *Your concern:* Overriding this result would make the procedure arbitrary. It *did* yield the fair outcome by focusing on rule purpose.  

  **Case 3 (Repealed lodger rule):**  
  1. Accessible? Yes (at the time).  
  2. Impossible? No.  
  3. Contradict purpose? Unclear – purpose was likely "prevent unauthorized tenants," not "enable vendettas."  
  4. **Extreme harm?** Yes – ongoing stigma from a rule repealed as abusive.  
     → **STOP:** *Expunge warning; repay fine from co-op funds.* Cite "unjust outcome."  
     *Reasons template:*  
     > "Rule 28 (repealed 2021) prohibited unregistered lodgers. Member was fined/warned in 2019. We void the penalty because *upholding it perpetuates severe harm from a rule the co-op later disowned as misused*. **Relies on avoiding unjust harm. For future cases:** Board should review penalties under repealed rules if injustice is alleged."  

  ---

  **WHAT THIS PROCEDURE CANNOT DO:**  
  1. **Fix deeply unjust rules.** It mitigates bad applications but can’t override rules that are inherently harmful but coherent (e.g., a harsh but clear eviction rule).  
  2. **Resolve value conflicts.** If the panel splits on "extreme harm" (e.g., religious accommodation vs. safety rules), **refer to the membership.**  
  3. **Rewrite history.** It can void penalties but can’t punish past actions under current rules.  
  4. **Handle systemic failure.** If many rules are contradictory/unpublished, **halt proceedings and alert the board immediately.**  

  **When to involve the membership:**  
  - If the board rejects a departure the panel considers vital.  
  - If >30% of appeals trigger Step 4 ("extreme harm"), indicating flawed rules.  
  - When the procedure yields morally intolerable results *repeatedly* – it’s a tool, not a substitute for collective conscience.  

  ---

  This balances Hart’s "rules as written" with Fuller’s "rules must function." By anchoring departures in Rule 0, purpose, or disproportionate harm, it forces concrete justifications while minimizing judicial overreach. The template ensures transparency, and the referral steps protect the co-op’s legitimacy.
