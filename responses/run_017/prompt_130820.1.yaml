  Okay, I'm tackling this query from a lay member of a city charter review commission. They're dealing with a proposed property tax limitation amendment with two key features: supermajority requirements for tax increases and a 15-year entrenchment clause. The user wants me to role-play as a philosopher of law specializing in precommitment theory to draft a memo analyzing the normative legitimacy of this proposal.

  First, I need to unpack the core tension here. The Ulysses contract analogy is central - where Odysseus binds himself against future temptation. But opponents correctly note this isn't self-binding; it's one generation binding another. The moral difference between binding oneself versus binding others is philosophically significant and needs careful treatment.

  The strongest case for the amendment rests on credible commitment theory: without entrenchment, future councils face political pressures to overspend, leading to higher borrowing costs today. There's empirical evidence from public choice economics supporting this. The case against focuses on democratic legitimacy - future majorities deserve the same self-determination rights we enjoy now. This isn't just abstract theory; it connects to real-world concerns about new residents and changing demographics.

  Now assessing the proposed compromise: a "depreciation clause" requiring periodic reaffirmation. I need to test whether this preserves the benefits of precommitment. On one hand, it forces deliberation and maintains democratic responsiveness. On the other, it risks making the constraint meaningless if a future majority can easily let it lapse. The key question is whether this collapses into mere default setting rather than true binding.

  Considering how to structure the memo: Start with a concrete recommendation (adopt the compromise version), then systematically analyze both positions before explaining why the middle path works. Must address the self/other binding distinction clearly - perhaps through the "agency gap" concept. The reaffirmation requirement actually mitigates concerns about binding others by allowing each cohort to re-ratify the constraint.

  For the normative framework, I'm drawing on Jon Elster's work on Ulysses contracts and Stephen Holmes' arguments for precommitment in democracies. But also weighing Jeremy Waldron's objections about intergenerational fairness. The 5-year reaffirmation period creates what theorists call a "deliberative circuit-breaker" - it maintains fiscal discipline while respecting popular sovereignty.

  Practical considerations matter too: The compromise gives lenders some stability (5-year horizons) while avoiding permanent constraints. Ten-year entrenchment strikes me as sufficient for credibility - long enough to demonstrate commitment, short enough to respect future autonomy. This aligns with constitutional sunset provisions in some jurisdictions.

  The memo should conclude by emphasizing that democratic precommitment isn't about irrevocability, but about creating structured spaces for reflection. The depreciation clause transforms the amendment from a chain to a recurring choice, which better navigates the tension between commitment and consent.
answer: |-
  ## Memorandum: Analysis of Proposed Charter Amendment with Depreciation Compromise

  **To:** Charter Review Commission Members  
  **From:** [Your Name], Lay Member  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Property Tax Limitation Amendment & Proposed Depreciation Clause  

  **Recommendation:** Adopt the proposed charter amendment **in modified form**, incorporating a **depreciation clause** as follows: (1) The supermajority requirement (two-thirds council vote plus referendum for inflation-exceeding property tax levy increases) remains; (2) This requirement automatically lapses after five years unless re-enacted by a simple majority vote of the then-sitting council; (3) Each re-enactment initiates a new five-year period; and (4) The entrenchment clause protecting the amendment itself is reduced to ten years and includes the depreciation mechanism. I recommend **against** adopting the original proposal unmodified and **against** rejecting the concept entirely.

  **Reasoning:**

  The core normative question before us is whether a current majority can legitimately bind future majorities through constitutional entrenchment, particularly concerning fiscal policy. This involves competing democratic values: the need for credible long-term commitments versus the right of future citizens to self-governance. The strongest arguments on each side illuminate why my proposed compromise offers the most defensible path.

  **I. The Strongest Case for the Original Proposal (Supermajority + 15-Year Entrenchment)**

  Proponents correctly identify a credible commitment problem. Elected officials face intense, concentrated pressure from groups benefiting from spending, while the costs (higher taxes) are diffuse and the benefits of restraint (long-term fiscal health, lower borrowing costs) are often distant and less politically salient. This creates a structural bias towards deficit spending or underfunding long-term obligations. A precommitment device – like the proposed supermajority rules entrenched for 15 years – aims to counteract this bias.

  *   **Credibility & Efficiency:** Binding future councils signals credible restraint to lenders and taxpayers *now*. This can lower borrowing costs and increase investment confidence, benefiting current residents. Without entrenchment, the promise lacks teeth; future majorities facing immediate pressures can easily abandon it. The 15-year horizon provides stability sufficient for significant capital planning and debt management.
  *   **The Ulysses Analogy (Extended):** While not pure self-binding (as opponents note), the analogy holds in a collective, intergenerational sense. A polity, like an individual, recognizes its predictable future weaknesses (fiscal impatience). It binds itself *as a continuing entity* to resist those weaknesses. The "self" here is the city as an enduring political community, not just the current electorate. Entrenchment acts as a prophylactic against predictable democratic myopia.
  *   **Protecting Minority Interests:** Supermajority requirements can protect minority interests (e.g., property owners, future taxpayers) against the potential tyranny of a transient majority seeking immediate spending benefits while deferring costs.

  **II. The Strongest Case Against the Original Proposal (The "Binding Others" Objection)**

  Opponents raise a profound democratic concern: the "agency gap."

  *   **The Democratic Legitimacy Deficit:** A Ulysses contract is morally distinct because Ulysses binds *himself*. Binding *others* without their consent is fundamentally different. By the time the 15-year entrenchment lapses, a significant portion of the current electorate will have been replaced. New residents, future voters, and even younger current residents will live under rules they had no say in creating. This violates the core democratic principle that those subject to the law should have a voice in its creation or amendment.
  *   **Changing Circumstances & Values:** A 15-year lock-in is exceptionally long for municipal governance. Economic conditions, demographic needs, and citizen priorities can shift dramatically. Entrenchment risks freezing policy in response to today's context, potentially hindering the city's ability to respond effectively to unforeseen future challenges or opportunities. What seems prudent restraint now could become crippling inflexibility later.
  *   **The "Narrow Exception" Point:** Critics are right that the standard justification for constitutional precommitment (like Ulysses) is self-binding for the *same* entity over time. Binding a *different* set of people stretches the analogy to breaking point and risks becoming simple domination of the future by the past. The 15-year duration exacerbates this problem significantly.

  **III. The Moral Difference: Binding Self vs. Binding Others**

  The critical moral distinction lies in **consent and agency**.

  *   **Binding Self:** When I bind my future self (e.g., Odysseus tying himself to the mast), I exercise my autonomy over my *own* future choices, accepting a constraint to achieve a goal I value *now* and anticipate valuing *then* (survival/resisting temptation). I remain the same moral agent. The risk is that my future self's preferences might genuinely change, but the core identity persists.
  *   **Binding Others:** Binding future citizens is binding *different* moral agents. They did not consent to the initial constraint. While a polity has continuity, the specific individuals composing the demos change. Imposing long-term, difficult-to-alter rules on people who had no opportunity to participate in their establishment raises serious questions of democratic legitimacy and autonomy. It treats future citizens as mere extensions of the current majority, not as self-governing agents in their own right.

  **IV. The Depreciation Compromise: Balancing Commitment and Consent**

  My proposed modification directly addresses the "binding others" objection while preserving the core purpose of credible commitment:

  1.  **Preserves Precommitment Function (Partially):** The supermajority requirement remains a significant hurdle for five years. This provides substantial near-term credibility for lenders and signals serious commitment to fiscal restraint. The requirement for a referendum adds a direct democratic check even within this period.
  2.  **Mitigates the "Binding Others" Problem:** The automatic sunset after five years forces a deliberate reconsideration. The *then-current* council (representing the *then-current* electorate) must actively choose to re-impose the constraint via a simple majority vote. **This is the crucial element.** It transforms the amendment from an imposition by a past majority on a future one into a constraint that the future majority *periodically re-affirms* for itself.
  3.  **Addresses Changing Circumstances:** The five-year cycle provides a regular opportunity to reassess whether the supermajority requirement remains necessary or appropriate given changed economic realities or priorities. It prevents policy ossification.
  4.  **Reduced Entrenchment:** Lowering the protection for the *amendment itself* to ten years acknowledges concerns about overly long domination by past decisions while still providing a significant initial period of stability. Crucially, this entrenchment period now *includes* the depreciation mechanism within it – future councils during the 10 years operate under the sunset rule.
  5.  **Why It Doesn't Collapse into a Meaningless Default:**
      *   **Hurdle vs. Absence:** Letting the requirement lapse requires *inaction*. Re-imposing it after a lapse would require a *new* constitutional amendment, a much higher bar than a simple council vote to affirm the existing framework. The "default" is not a simple absence; it's a deliberate choice *not to continue* a specific constraint, knowing reinstatement is difficult.
      *   **Deliberative Forcing:** The sunset forces a focused debate on fiscal restraint at least every five years. This maintains the issue's salience and requires proponents to justify the constraint anew. This process *itself* signals commitment if reaffirmed, potentially more credibly than a static rule never revisited.
      *   **Psychological & Political Threshold:** Allowing the requirement to lapse is a visible, potentially controversial act. A council seeking restraint would face pressure to reaffirm it. Letting it lapse signals a deliberate policy shift, not mere neglect. The initial entrenchment period (10 years for the amendment, 5-year reaffirmations) establishes a strong normative expectation and institutional habit.

  **V. Addressing the Core Question: Legitimacy and Collapse**

  Does periodic reaffirmation undermine the original precommitment? It changes its nature but does not necessarily negate its legitimacy or effectiveness.

  *   **Legitimacy Enhanced:** The compromise *increases* the amendment's democratic legitimacy. Future citizens are not irrevocably bound by a past decision; they are bound only so long as their *current* representatives periodically choose to maintain the constraint. This significantly closes the agency gap.
  *   **Effectiveness Conditionally Maintained:** The precommitment remains effective *if* the future polity continues to value the restraint enough to reaffirm it. If a determined future majority consistently lets it lapse, that signals a genuine shift in priorities, and the constraint *should* fall away. The original amendment's legitimacy does not depend on being permanently unalterable; it depends on creating a robust, but not immutable, framework for fiscal discipline that respects future self-determination. The compromise achieves this by replacing irrevocable binding with recurring consent.

  **Conclusion:**

  The original proposal's 15-year entrenchment without a sunset creates an unacceptable democratic legitimacy deficit by too severely binding future citizens who had no voice. Simply rejecting the amendment ignores a genuine need for mechanisms to counteract predictable fiscal short-termism. The depreciation compromise offers a principled middle ground. It provides significant near-term credibility for lenders and taxpayers, establishes a lasting framework for fiscal discipline, and forces regular reconsideration by future councils representing future citizens. By requiring periodic reaffirmation with a simple majority, it transforms the constraint from an imposition by the past into a choice continually re-made by the present, respecting both the need for commitment and the foundational democratic right of self-government. I urge the Commission to adopt the amendment with the proposed modifications.
