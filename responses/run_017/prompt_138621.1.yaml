answer: |-
  ### Step 1: Brainstorming Candidate Principles
  I'll start by brainstorming three candidate principles based on your verdicts and tentative principle. Each will be tested against your cases (1)–(8) to identify strengths and weaknesses. Your tentative principle—acting as you would have wanted pre-branch, treating indistinguishable agents as one—captures timelessness but struggles with prediction mechanisms (case 6) and morality (case 8). I'll refine this core idea while addressing inconsistencies.

  #### **Candidate Principle 1: Timeless Functional Control (TFC)**
  - **Principle**: Act as you would have pre-branch wanted your decision procedure disposed to do, treating all predictor-indistinguishable agents as one, *if* the predictor's mechanism is sensitive to your current decision process. Otherwise, maximize causal expected utility.
  - **Motivation**: Handles cases where prediction is "responsive" (e.g., simulation) vs. "fixed" (e.g., genome), resolving case (6). Defaults to causal decision theory (CDT) when control is impossible.
  - **Test against cases**:
    - (1) Pay (responsive mechanism).
    - (2) Hire firm (responsive; pre-branch control).
    - (3) Pay in both (mechanism identical to (1)).
    - (4) Pay (responsive; announcement doesn't change mechanism).
    - (5) Pay at 90%, not at 60%, borderline at 75% (accuracy affects expected utility pre-branch).
    - (6) Pay in simulation (responsive), not in genome (fixed), mixed in black box (depends: if black box uses current traits, pay; if fixed, don't).
    - (7) Refuse (prediction fixed; CDT says paying doesn't prevent termites).
    - (8) Do the act (responsive mechanism), but morality may override.
    - **Weakness**: Struggles with case (4) confidence difference (same verdict as (1) but you feel stronger) and case (8) moral reluctance. Also, "sensitive to current decision process" is vague.

  #### **Candidate Principle 2: Evidential Bargaining (EB)**
  - **Principle**: Act to maximize utility conditional on your action being part of a pre-branch "agreement" with the predictor, where the agreement is inferred from the predictor's reliability and mechanism. Treat indistinguishable agents as bargaining partners.
  - **Motivation**: Explains case (4) confidence (agreement is clearer when announcement is decoupled) and case (7) refusal (no beneficial agreement possible). Moral reluctance in (8) becomes renegotiation.
  - **Test against cases**:
    - (1) Pay (agreement: pay in tails for heads payoff).
    - (2) Hire firm (enforces agreement).
    - (3) Pay in both (agreement unchanged).
    - (4) Pay confidently (agreement obvious; heads branch irrelevant to bargaining).
    - (5) Pay at 90% (reliable agreement), not at 60% (unreliable), borderline at 75%.
    - (6) Pay in simulation (agreement based on your "voice"), not in genome (no agreement with fixed trait), less confident in black box (agreement ambiguity).
    - (7) Refuse (XOR structure prevents stable agreement; paying signals no termites but costs money).
    - (8) Do the act (agreement exists), but moral costs may void it.
    - **Weakness**: Overfits case (4) but complicates case (1). "Agreement" is metaphorical; may not handle new cases cleanly.

  #### **Candidate Principle 3: Causal-Timeless Hybrid (CTH)**
  - **Principle**: Act as you would pre-branch want, *only if* the predictor's mechanism screens off all fixed traits (e.g., genome). Otherwise, act to maximize causal influence. Always treat indistinguishable agents as one.
  - **Motivation**: Directly targets case (6) by distinguishing "trait-prediction" (causal) from "process-prediction" (timeless). Simplifies TFC's sensitivity condition.
  - **Test against cases**:
    - (1) Pay (process-prediction).
    - (2) Hire firm (process-prediction).
    - (3) Pay in both.
    - (4) Pay (process-prediction; confidence unexplained).
    - (5) Pay at 90% (high reliability implies process-like), not at 60%, borderline at 75%.
    - (6) Pay in simulation (process), not in genome (trait), less confident in black box (trait-like if based on childhood).
    - (7) Refuse (trait-prediction; CDT applies).
    - (8) Do the act (process-prediction), morality separate.
    - **Weakness**: Same as TFC for case (4) and (8). "Screens off fixed traits" may not cover all edge cases.

  ### Step 2: Selecting and Refining the Principle
  **Candidate 1 (TFC) is the strongest fit** after testing:
  - Best handles (1)–(3), (5)–(6) by formalizing your "responsive mechanism" intuition.
  - Matches (2), (7) cleanly.
  - Only struggles with (4) confidence difference (epistemic) and (8) moral reluctance (non-decision-theoretic).

  I'll refine TFC into a precise principle, incorporating lessons from all candidates:
  - Keep the timeless core and agent-symmetry from your tentative principle.
  - Add explicit "mechanism sensitivity" to resolve (6).
  - Default to CDT when sensitivity is absent, resolving genome case.
  - Treat confidence differences (case 4) as non-decision-theoretic (they stem from risk perception, not rationality).

  **Final Principle: Mechanism-Sensitive Timeless Choice (MSTC)**  
  "I ought to do what, before knowing which outcome obtains, I would have chosen as the disposition for my decision procedure, under the constraint that this disposition is applied identically to all agents the predictor cannot distinguish, *if and only if* the predictor's mechanism for generating the prediction is sensitive to the output of my current decision process. Sensitivity requires that the prediction depends counterfactually on what I decide now (e.g., via simulation, real-time observation, or any process that would yield a different prediction if my decision were different). If the mechanism is insensitive (e.g., based solely on fixed traits like genome or irrevocable past data), I should ignore the prediction and act to maximize causal expected utility given my current information."

  #### **Clauses and Motivating Cases**:
  1. **"Before knowing which outcome obtains"**: Motivated by cases (1)–(3), where pre-branch perspective justifies paying. Ensures timelessness.  
  2. **"Applied identically to all agents the predictor cannot distinguish"**: Motivated by case (2) (hiring firm enforces symmetry) and new case A (copies). Treats indistinguishable agents as one "decision cluster".  
  3. **"Sensitive to the output of my current decision process"**: Motivated by case (6). Genome prediction is insensitive (fixed), so default to CDT; simulation is sensitive, so timeless.  
  4. **"Ignore prediction and maximize causal expected utility"**: Motivated by case (7) (XOR blackmail; prediction fixed) and case (6) genome. CDT fallback when control is impossible.

  #### **Verdicts on Your Cases**:
  - (1) **Pay**: Sensitive mechanism → timeless disposition to pay aligns with pre-branch choice.  
  - (2) **Hire firm**: Pre-branch, you'd want this disposition to enforce payment in tails, ensuring heads payoff. Sensitivity clear.  
  - (3) **Pay in both**: Mechanism sensitivity identical; timing of payment irrelevant.  
  - (4) **Pay**: Mechanism still sensitive (prediction depends on your decision), so same as (1). *Confidence difference not explained*—likely due to epistemic factors (e.g., in (4), paying when coin is heads is less costly since you have $10,000).  
  - (5) **Pay at 90%, not at 60%, borderline at 75%**: Sensitivity holds; pre-branch expected utility favors paying at high accuracy.  
  - (6) **Pay in simulation, not in genome, mixed in black box**:  
    - Simulation: Sensitive → pay.  
    - Black box: If mechanism uses current decision output (e.g., real-time brain scan), pay; if fixed past data (e.g., childhood records), don't pay.  
    - Genome: Insensitive → don't pay.  
  - (7) **Refuse**: Prediction based on termites/decision XOR → insensitive (fixed once letter sent) → CDT: paying doesn't prevent termites.  
  - (8) **Do the act**: Mechanism sensitive → timeless disposition to do it. *Reluctance likely moral, not decision-theoretic*.

  #### **Verdicts on New Cases**:
  - **New Case A (1000 copies, Omega asks all, takes money from one random)**:  
    - **Principle**: Predictor cannot distinguish copies → treat as one cluster. Mechanism sensitive (e.g., simulates one copy) → pre-branch disposition to pay. *Verdict*: All copies pay.  
    - **Why**: Pre-branch, you'd want the cluster disposed to pay to ensure $10,000 in heads. Each copy is "charged" randomly, but symmetry ensures collective benefit.  
  - **New Case B (Omega predicts what I'd do after a refusal pill)**:  
    - **Principle**: Prediction concerns counterfactual pill scenario. If the mechanism is sensitive (e.g., simulates pill-you), but *your current decision doesn't affect the counterfactual prediction* → insensitive → CDT. *Verdict*: Refuse to pay in tails branch.  
    - **Why**: The prediction is fixed; paying $100 doesn't cause anything. Pre-branch, you'd want the counterfactual you disposed to pay (to get heads payoff), but you can't influence that now.

  #### **Which Verdicts to Drop**:
  - **Drop the confidence difference in (4)**: MSTC treats (1) and (4) identically (both sensitive mechanisms). Your stronger confidence in (4) may stem from lower risk (paying in heads branch is less costly) or epistemic clarity, but it's not a rational flaw to feel differently. However, the *action* is the same, so no decision-theoretic error.  
  - **Drop reluctance in (8) as non-decision-theoretic**: MSTC says to do the act (sensitive mechanism → pre-branch disposition saves net humiliations). Your reluctance is likely moral (e.g., "don't harm others, even for greater good"), so override MSTC if morality demands.  
  - **Adjust case (6) black-box confidence**: If black box uses fixed data, don't pay; if real-time, pay. Your lower confidence may reflect uncertainty about the mechanism—MSTC resolves this by requiring clarity on sensitivity.

  #### **What MSTC Is (Theory Label)**:
  MSTC is a **novel hybrid** of functional and timeless decision theory, not a repackaged standard view.  
  - **Functional aspects**: Chooses outputs of decision procedures to maximize expected utility across linked decisions (indistinguishable agents).  
  - **Timeless aspects**: Evaluates from pre-branch perspective, ignoring knowledge of your branch.  
  - **Unique element**: **Mechanism sensitivity** as a switch between timeless (sensitive) and causal (insensitive) modes. This avoids the "trait vs. process" problem in pure FDT/UDT.  
  - **Contrast with literature**:  
    - FDT would pay in genome case (ignores mechanism); MSTC does not.  
    - UDT treats all predictors equally; MSTC doesn't.  
    - CDT refuses in (1); MSTC pays when sensitive.  
  Thus, MSTC extends your tentative principle by adding causal fallback, making it distinct from known theories.  

  ### Final Recommendation
  Adopt MSTC as your principle. It saves all verdicts except the confidence difference in (4) and moral reluctance in (8), which are not core decision-theoretic issues. For case (6), it clarifies black-box verdicts based on mechanism. Apply it to new cases by:  
  1. Identifying if agents are indistinguishable (for symmetry).  
  2. Assessing predictor sensitivity (would prediction change if your decision changed?).  
  3. Choosing: timeless disposition if sensitive, causal action if not.  

