answer: |-
  ## Patternists at War (Dialogue)

  **Dev:** ...so it’s a *model*, Marion. An intricate, causally potent model *derived* from him, running *on* your neural hardware. But it’s not *his* pattern running. It’s yours, *simulating* his.

  **Marion:** (Scoffs) Simulation? Dev, you make it sound like I’m running some detached subroutine. When I hear his voice in my head, clear as day, telling me the soufflé needs two more minutes precisely, *that’s him*. The pattern *is* realized. Partially, yes, but *present*. It’s steering *this* system, right now.

  **Dev:** Steering? Or biasing? The inputs are *your* perceptions, filtered through *your* biases. The outputs are *your* actions. Where’s *his* sensorium? *His* agency? It’s you, Marion, using a very good internal representation. A powerful descendant pattern, not the ancestor itself.

  **Marion:** Descendant implies discontinuity. But the pattern *persisted*. When he died, the physical substrate supporting *this specific configuration* – *his* brain – stopped. But the pattern was already *distributed*. Into me, his sister, maybe old friends. It wasn’t instantiated *fully* anywhere else, but fragments were already running concurrently in us. His death didn’t erase the pattern; it just fragmented the primary instantiation. Those fragments *are* him, diminished but real.

  **Dev:** Fragmented? Okay, arithmetic problem. Suppose five people each hold a vivid fragment – his laugh for one, his political rants for another, his cooking tricks for you. Is there one ‘Carl’ pattern, just spread thin? Add up the ‘Carl-ness’? So, if a million people vaguely remember a movie star’s catchphrase, does that make a *more* present, unified ‘star-pattern’ than your deeply held Carl-fragment? That feels absurd. More likely, you’ve just got five (or fifty) separate, partial Carl-*like* patterns, each living its own isolated existence within its host brain. What’s it *like* to be five disconnected twentieths of Carl?

  **Marion:** (Pauses, frowning) Fine. Point taken. Maybe it doesn’t *add* cleanly into one super-self. Maybe… maybe the primary instantiation *was* the integrated whole in his brain. What persists in me isn't the *whole* Carl, nor is it adding up with other fragments to reconstitute him. It’s… a satellite node. A partial instantiation that *was* part of the network, and still carries the signature. The *intensity* matters, not the distribution count. Ten million faint echoes aren’t a presence. One vivid, active pattern-fragment *is*.

  **Dev:** But how vivid *is* it, really? Drift problem. You *know* your memory edits. You smooth over the fights. You probably imagine his reaction to things he never saw – this new tech, that political scandal. Is the pattern in your head still Carl? Or is it Marion’s-Evolving-Carl-Simulator? If it’s mutating, how is it still *him*?

  **Marion:** He *would* have evolved! If he hadn’t died, the pattern in *his* brain would have updated with new inputs. Mine updates too, based on *my* inputs, filtered, yes. It’s… continuity under transformation. Imperfect, biased, but still *his* pattern-lineage evolving in *this* substrate. It’s not a static recording.

  **Dev:** Okay, but let’s push drift. Suppose you write a memoir. Painstakingly accurate, capturing his voice, his quirks, far *less* edited than the model in your head. A thousand strangers read it, absorb it deeply. Now *they* have high-fidelity Carl-patterns. When *you* die, and your (frankly, mutated) version of Carl fades, do these thousand readers collectively host a *stronger*, more ‘original’ Carl-pattern? Does *he* come roaring back? Where’s the carrier line? Brains only? What about biographies, AI chatbots trained on his letters, habits passed to your kids?

  **Marion:** (Takes a breath) No. It’s… the *live wire*. Books, recordings, institutions – they’re data stores. Blueprints. They only become a *running* pattern when instantiated in a *processing system* – a brain. My kid *imitating* his shrug isn’t him. But if the kid internalizes it, makes it part of *their* behavioral repertoire, influenced by that stored pattern… then yes, a tiny piece is running there too. But brains are the substrate that *runs* the pattern, actively. The memoir readers? If they truly integrate it, make it part of their decision-making, *then* fragments run there. But it’s scattered. Not a resurrection.

  **Dev:** And *that* brings me back to inertness. Your ‘running fragment’. What inputs does it receive, Marion? *Only* yours. What outputs does it produce? *Only* by influencing *your* actions. It’s not hooked up to the world. It’s not a subject experiencing anything. It’s a cached set of biases and responses *you* consult. Like a really good habit. A coma patient is *hooked up* – the system is intact, just temporarily offline. The inputs and outputs are paused, not severed. Your Carl-pattern? Its inputs and outputs were *permanently* severed when his brain died. What runs in you is a decoupled *echo*.

  **Marion:** Severed? Dev, it *was* coupled! To *me*, for years! And now it’s coupled to *my* sensorium, *my* outputs. It’s not *his* original coupling, but it’s a *functional* coupling within a larger system. The coma patient was coupled, then decoupled. Mine was coupled, then… *re-coupled* differently. Where’s the bright line between ‘temporarily decoupled but hooked up’ and ‘permanently decoupled but re-coupled elsewhere’? Isn’t that difference just… one of degree? And degree of *what*? Continuity of the supporting hardware?

  **Dev:** (Leans back, steepling fingers) …Damn. Okay, concession. Maybe the ‘hooked up’ distinction *is* fuzzier than I want. Maybe it’s about the *potential* for reintegration into the original input/output streams. Which, for Carl, is zero. The re-coupling is fundamentally different, parasitic on *your* streams. But… yeah. It’s not a binary switch. That *is* awkward. It might be more about the *kind* of causal interaction… (Trails off, frustrated).

  **Marion:** See? Now, recombination. Suppose Sarah, his sister, and I talk constantly. We merge our models. We joke about what Carl *would* say until it becomes something new – a hybrid ‘Carl-Sarah-Marion’ voice that neither of us had alone, that feels *authentic*, but isn't exactly the original. Whose pattern is *that* running? Is it Carl’s, evolved? Or a new emergent pattern built from his fragments? *Can* we even say?

  **Dev:** It’s a *new* pattern. Emergent from the interaction of *your* Carl-fragment and *Sarah’s* Carl-fragment, running on the hardware of *your* conversation and *your* brains. It’s a descendant, a blend. It’s not *him* any more than a child is a blend of its parents but is a new person.

  **Marion:** But the *components* are *him*. The essence is there, rearranged. How do you draw that line without invoking some magical essence? It's gradients all the way down, Dev. Where does the pattern stop being 'Carl' and start being something else? When the drift hits 51%? How would we even measure that?

  **Dev:** We can’t. That’s the point! Your view… it makes identity hopelessly smeared. Unfalsifiable. If ‘partial realization’ counts as persistence, then everyone is partially everyone they’ve ever known, forever. How do you test if Carl is ‘still present’ versus you just having a good memory? What evidence would *falsify* your claim that he’s still running in you?

  **Marion:** (Quietly) The *feeling* of his guidance. The moments when it’s not memory, but presence. When I act *because* of him, not just *like* him. But… I see your point. How do I prove that’s not just me? And you… what evidence would convince *you* that a pattern *can* persist distributed? If we could perfectly map his brain state onto mine, would *that* be him? Or just a copy? We’re patternists, Dev. We agreed the soul is bunk. But… (She shakes her head, looking tired) I don’t know what question we’re even trying to answer anymore. ‘Is it him?’ Maybe that’s the wrong shape.

  **Dev:** (Looks at her for a long moment) Yeah. Maybe it is. But ‘Is it *a* subject?’ That one… I still think the answer’s no. It’s a process *within* a subject. You.

  **Marion:** And I still feel him. So we’re stuck. Coffee?

  **Dev:** (Sighs) Yeah. Coffee. Black. Like the ontological abyss we’ve dug.
