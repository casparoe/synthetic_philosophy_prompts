prompt: |-
  I have just come away from a long and rather unsatisfying argument with an old friend who works as a research hydrologist, and I want to turn what went wrong in it into a final-exam question. Her position, pressed with considerable impatience, was that any conviction for which you cannot specify in advance what would count as evidence against it is not a belief but a prejudice, and that good scientists retire exactly those convictions by finding data that contradict them. I found myself defending the Wittgensteinian thought that some commitments are not held on evidence at all but are rather what makes evidence possible — and I defended it badly. Two things undid me. She asked how, on my account, you tell the difference between such a commitment and a paranoid delusion, given that both are held in the face of what the rest of us call counter-evidence. And she pointed out that her own field maintains formal procedures for retiring the assumptions its instruments presuppose, which on my account ought to be impossible. I want my students put under precisely that pressure, in a form in which reciting the vocabulary of the topic gets them nothing.

  The setting: a third-year undergraduate epistemology seminar, closed-book final, ninety minutes for a single question worth 25 marks, with students expected to write about 900 words. They have read the primary text — Wittgenstein's late notes published as On Certainty — and a general survey of epistemology. Assume no knowledge of the secondary literature, and do not let the question or the answer depend on it: I want no reading list, no citations, no "as so-and-so has argued", and no move that is licensed merely by attributing a view to a commentator. Every move in the model answer should be one a strong student could have produced from the primary text plus argument.

  Here is the case I want built into the question. The Kestrel Hydrographic Office has charted the Kestrel Bank for a century. Its survey method treats the Bank as geologically stable: soundings taken years apart are pooled into a single depth model, and an individual anomalous sounding is discarded as instrument error. That the Bank does not move is not something the Office has evidence for; it is what makes the pooling of soundings into one chart possible at all. Over thirty years the proportion of discarded anomalies has risen steadily, and eventually the director invokes the Office's standing revision protocol: when more than one sounding in five must be discarded, the stability assumption is to be retired and replaced by a model in which the Bank migrates. The retirement is authorised by counting discarded anomalies — that is, by a procedure that itself presupposes the very assumption being retired. Meanwhile a separate team, the Tidalists, has for some years produced independent estimates of the Bank's position by satellite altimetry, a method that never presupposed stability; they argue the assumption was testable all along. The Kestrel Bank is invented, so please do not try to look it up, and do not import facts about real hydrography or real satellite methods into the case.

  Please produce:

  1. The question itself, in a form I can paste into the paper, with sub-parts and marks allocated (I have in mind something like: a part demanding an account of what it is for a proposition to play this framework role, and how that differs both from being a well-confirmed empirical hypothesis and from being merely something no one in the community thinks to question; a part asking whether the director's retirement of the assumption is a rational revision, given that the only evidential standards available are ones the assumption itself makes possible; and a part in which a critic says the framework account cannot distinguish the Office's assumption from a patient's conviction that his food is being poisoned, and so either collapses into relativism or must smuggle in an external standard — with the student required to say what work, if anything, the Tidalists' independent method does).

  2. A model answer of roughly 700 words, written as a strong but not miraculous student's script rather than as a polished paper. It should, among other things, distinguish revision-as-conversion from revision-as-evidence-response and take a stand on which the protocol enacts; say what functional difference between a framework commitment and a delusion could do the work without appealing to "it is one we accept"; and say whether the relativity of framework-hood to a practice is a relativism about anything that matters.

  3. A marking scheme organised around the specific moves a top script must make, with the marks each is worth out of 25, and, for each move, the one characteristic way candidates get it wrong. I especially want named the error of treating framework propositions as basic beliefs in the foundationalist sense, the error of answering the delusion objection by saying the patient's belief is false, and the error of resting on "cannot be doubted" understood as psychological impossibility. Finish the scheme by stating the single move that most reliably separates an A script from a B script.

  4. After the model answer and the marking scheme, a JSON object — valid JSON, nothing after it — with this schema:

  must_hit_points: an array of objects, each with keys id (short string), part (which sub-part it belongs to), claim (one sentence: what the candidate must establish), marks (integer), top_move (one sentence: the specific move that earns full marks), common_failure (one sentence: the specific way a weaker script falls short).

  misconceptions: an array of objects, each with keys misconception (string), diagnostic (the kind of sentence in a script that reveals it), marks_lost (integer).

  boundaries: an object with keys distinction, merit, pass (integers: the mark thresholds).

  discrimination_note: a string of one or two sentences on which single move separates the top band from the one below.

  case_revisions: an array of objects, each with keys issue (anything in the stem that is ambiguous enough to let a candidate wiggle out of the question or that makes an intended answer unavailable) and fix (a concrete rewording).
reasoning: |-
  We are creating an exam question based on the described scenario and philosophical issues. The question should have three parts (a, b, c) and we allocate marks accordingly. We then provide a model answer, a marking scheme, and the requested JSON.

  Question Structure:

  Part (a): [Account of framework propositions] (8 marks)
  Part (b): [Rationality of revision] (8 marks)
  Part (c): [Delusion objection and the Tidalists] (9 marks)

  Total: 25 marks.

  Question Text:

  **Question 1 (25 marks)**

  The Kestrel Hydrographic Office has, for a century, charted the Kestrel Bank under the assumption that the Bank is geologically stable. This stability assumption is not treated as an empirical hypothesis but as a framework proposition: it enables the practice of pooling soundings taken at different times into a single depth model, and individual anomalous soundings are discarded as instrument error. Recently, the proportion of discarded anomalies has risen to over 20%, triggering a standing revision protocol. The director retires the stability assumption and adopts a migrating-bank model. The retirement procedure counts discarded anomalies (which presupposes stability) as evidence against stability. Meanwhile, the Tidalists, using satellite altimetry (which does not presuppose stability), argue that the stability assumption was testable all along.

  (a) Explain what it means for a proposition to play a 'framework role' in a practice such as that of the Kestrel Hydrographic Office. How does such a role differ from that of a well-confirmed empirical hypothesis? How does it differ from a proposition that is merely taken for granted by a community without being questioned? (8 marks)

  (b) Is the director's decision to retire the stability assumption a rational revision of the framework? In your answer, consider that the evidential standard used (counting discarded anomalies) is only available because of the stability assumption itself. (8 marks)

  (c) A critic argues that the framework account cannot distinguish the Office's stability assumption from a paranoid patient's conviction that his food is being poisoned, because both are held in the face of what others call counter-evidence. Without appealing to the truth or falsity of either belief, how might one functionally distinguish a framework commitment from a delusion? In light of this, what work, if any, does the Tidalists' independent method (which does not presuppose stability) do in assessing the Office's practice? (9 marks)

  ---

  Model Answer (approx 700 words):

  (a) In Wittgenstein's *On Certainty*, a framework proposition is one that is not inferred from evidence but serves as a 'hinge' around which our inquiries turn. For the Kestrel Hydrographic Office, the proposition "The Kestrel Bank is stable" plays such a role. It is not a hypothesis that they test by gathering evidence; rather, it is a condition for the practice of pooling soundings. Without this assumption, the practice of taking multiple soundings over time and combining them into a single chart would make no sense. An individual sounding that conflicts with the chart is discarded as an instrument error precisely because the stability is held fixed.

  This differs from a well-confirmed empirical hypothesis in both function and justificatory status. An empirical hypothesis is tested by evidence and can be confirmed or disconfirmed. For example, a hypothesis about the exact depth at a point on the Bank would be tested by taking soundings and adjusted if anomalies persist. But the stability assumption is not tested in this way until it is retired. It is the background against which such testing occurs.

  It also differs from a mere communal assumption. While both are unquestioned, a framework proposition is not just a cultural accident; it is logically necessary for the specific practice. If the Office merely took stability for granted without it being a hinge, they might still pool data, but they would not have a procedure that defines anomalies by reference to that assumption. The framework role is constitutive: it defines what counts as evidence and error.

  (b) The director's decision is rational, but it is not a straightforward empirical revision. The rising anomaly rate (over 20%) triggers a protocol that retires the framework. However, the procedure uses the discarded anomalies (which are defined by the stability assumption) as evidence against stability. This seems circular, but the rationality lies in the collective weight of anomalies making the framework untenable. Wittgenstein notes that when enough doubts accumulate, what was a hinge becomes a proposition that can be examined. The Office, by its own rules, reaches a point where the framework itself becomes an object of scrutiny. The revision is not driven by evidence within the old framework (for that framework made the anomalies errors) but by a breakdown in the practice. It is a conversion to a new framework that can accommodate the anomalies as data about movement. Thus, it is rational as a response to the failure of the practice, not as an evidence-based refutation.

  (c) The critic raises the problem of distinguishing a framework commitment from a paranoid delusion. Both are held despite apparent counter-evidence. However, a functional difference exists. A framework proposition enables a shared, public practice of inquiry (like charting) that produces useful results (navigational charts) and has procedures for error-correction (discarding anomalies). The paranoid patient's belief, by contrast, does not enable such a practice; it isolates him and resists any correction. The belief about poisoning does not function as a hinge in a communal practice of gathering evidence about food safety; it is an individual fixation that distorts experience.

  The Tidalists' independent method provides a second practice that does not rely on the stability assumption. This does not directly validate or invalidate the Office's framework, because each practice has its own hinges. However, it does two things. First, it offers an alternative way to investigate the Bank, which can be cross-checked against the Office's results. Second, when the Office's practice breaks down (as with the high anomaly rate), the Tidalists' data can help motivate and justify the framework shift by showing that a migrating model fits the independent data. The Tidalists argue the assumption was testable because they have a practice that tests it without presupposing it. But for the Office, it was not testable until they adopted a new framework. The independent method thus provides external pressure and a resource for revision without being an external standard of truth.

  The relativity of frameworks to practices does not entail relativism about truth, because the success of a practice (e.g., producing accurate charts) is objective. However, what counts as evidence is practice-relative. The Tidalists help show that the stability assumption was contingent, not necessary for all inquiry.

  ---

  Marking Scheme (25 marks total):

  The top script (21-25 marks) must make the following moves:

  **Part (a) (8 marks)**
  - (2 marks) Define framework propositions as hinges that make evidence possible, not based on evidence. (Common failure: calling them basic beliefs in a foundationalist sense, i.e., as justified basic premises.)
  - (2 marks) Contrast with empirical hypotheses: these are testable and confirmable/disconfirmable within a framework. (Common failure: saying framework propositions are just very well confirmed.)
  - (2 marks) Contrast with mere communal assumptions: framework propositions are constitutive of the practice, not just unquestioned. (Common failure: equating with cultural taboos or conventions without explaining the functional role.)
  - (2 marks) Use the case: stability as enabling pooling and defining anomalies. (Common failure: not tying the explanation to the case.)

  **Part (b) (8 marks)**
  - (3 marks) Explain that the retirement is rational as a response to the breakdown of the practice (rising anomalies) but is not evidence-based refutation within the old framework. (Common failure: treating it as a normal empirical revision.)
  - (3 marks) Distinguish revision-as-conversion (framework shift) from revision-as-evidence-response (within framework). The protocol enacts conversion. (Common failure: not making this distinction.)
  - (2 marks) Note the circularity but argue that the weight of anomalies forces a shift. (Common failure: ignoring the circularity or calling it irrational.)

  **Part (c) (9 marks)**
  - (3 marks) Distinguish functionally: framework commitments enable shared practices with error-correction; delusions do not. (Common failure: answering by saying the delusion is false or the patient is mentally ill.)
  - (3 marks) Explain the Tidalists: their method provides an alternative practice that doesn't presuppose stability, allowing independent assessment. (Common failure: saying the Tidalists prove the Office wrong.)
  - (2 marks) Clarify that the Tidalists do not provide an external standard for the Office's framework but offer a resource for revision. (Common failure: treating the Tidalists as an objective arbiter outside any framework.)
  - (1 mark) Address relativism: practices can be evaluated by success, but evidence is practice-relative. (Common failure: collapsing into full relativism or objectivism.)

  The single move that most reliably separates an A (Distinction) from a B (Merit) script: In part (c), successfully explaining that the Tidalists' method does not directly falsify the Office's framework but provides an alternative practice that can motivate revision without appealing to an external standard. (Weaker scripts will either ignore the Tidalists or use them as an absolute standard.)

