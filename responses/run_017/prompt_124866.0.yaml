answer: |-
  ### Exam Question  
  **Question 1 (25 marks)**  

  The Kestrel Hydrographic Office has, for a century, charted the Kestrel Bank under the assumption that the Bank is geologically stable. This stability assumption is not treated as an empirical hypothesis but as a framework proposition: it enables the practice of pooling soundings taken at different times into a single depth model, and individual anomalous soundings are discarded as instrument error. Recently, the proportion of discarded anomalies has risen to over 20%, triggering a standing revision protocol. The director retires the stability assumption and adopts a migrating-bank model. The retirement procedure counts discarded anomalies (which presuppose stability) as evidence against stability. Meanwhile, the Tidalists, using satellite altimetry (a method that never presupposed stability), argue that the stability assumption was testable all along.  

  (a) Explain what it means for a proposition to play a "framework role" in a practice like the Office’s. How does this role differ from that of a well-confirmed empirical hypothesis? How does it differ from a proposition that is merely taken for granted by a community without being questioned? (8 marks)  

  (b) Is the director’s decision to retire the stability assumption a rational revision? Justify your answer by addressing the circularity: the evidential standard (counting anomalies) is only available because of the stability assumption itself. (8 marks)  

  (c) A critic argues that the framework account cannot distinguish the Office’s stability assumption from a paranoid patient’s conviction that his food is being poisoned, since both are held despite what others call counter-evidence. Without appealing to the truth or falsity of either belief, how might one functionally distinguish a framework commitment from a delusion? What work, if any, does the Tidalists’ independent method do in assessing the Office’s practice? (9 marks)  

  ---

  ### Model Answer (Strong Student Script, ~700 words)  
  **(a)** A framework proposition, as Wittgenstein describes in *On Certainty*, is not justified by evidence but makes evidence possible. For the Office, "The Kestrel Bank is stable" is such a proposition. It allows soundings from different times to be pooled into one chart; without it, comparing soundings would be meaningless. Anomalous soundings are discarded as errors *because* stability is assumed—it defines what counts as an error. This is unlike a well-confirmed empirical hypothesis (e.g., "The depth at point X is 50m"), which is tested and adjusted based on evidence within the framework. Hypotheses can be falsified by anomalies, but the framework itself cannot—it’s the background against which anomalies are identified. It also differs from a merely communal assumption (e.g., "We always use Brand Y instruments"), which is a contingent habit. A framework proposition is *constitutive*: removing it collapses the practice (pooling soundings), whereas a communal assumption might be changed without destroying the practice (e.g., switching instrument brands).  

  **(b)** The director’s decision is rational, but not because the anomalies directly refute stability within the old framework. Anomalies are *defined* as errors relative to stability, so counting them as evidence against stability is circular. Rationality here stems from a *breakdown in the practice*. When anomalies exceed 20%, the Office’s protocol treats the framework as failing—not because it’s falsified, but because it no longer enables reliable charting. This is a "revision-as-conversion": a shift to a new framework (a migrating bank) that reinterprets anomalies as meaningful data (movement), not errors. In contrast, "revision-as-evidence-response" occurs within a framework (e.g., adjusting depth estimates). The protocol enacts conversion: the circularity is pragmatic, not logical. Weighted anomalies force abandonment of the old hinge, making the shift rational as a survival mechanism for the practice.  

  **(c)** Functionally, a framework commitment enables a shared, objective practice with built-in error-correction, while a delusion does not. The Office’s stability assumption supports a public practice (producing navigational charts) with procedures to identify errors (discarding anomalies). This allows progress: charts improve, and anomalies trigger protocol reviews. The patient’s belief about poisoned food, however, isolates him; it doesn’t enable collaborative inquiry or error-correction. "Counter-evidence" (e.g., others eating safely) is dismissed ad hoc, not via a shared standard. The delusion distorts experience; the framework organises it.  

  The Tidalists’ method provides an *alternative practice* with different hinges (e.g., satellite reliability). It doesn’t "prove" the Office wrong externally, since frameworks aren’t judged from outside. But it does two things. First, it offers independent data that, when the Office’s practice breaks down, motivates revision (e.g., showing migration patterns). Second, it demonstrates that stability wasn’t necessary for *all* inquiry—it was contingent to the Office’s method. This pressures the Office to convert but doesn’t smuggle in an external standard. Relativity to practices isn’t relativism about truth: practices succeed or fail objectively (e.g., charts guiding ships safely). The Tidalists help show that the Office’s framework was replaceable, not that truth is relative.  

  ---

  ### Marking Scheme (25 marks total)  
  **Part (a) (8 marks)**  
  - **2 marks**: Define framework role as enabling evidence/error (not based on evidence).  
    - *Top move*: Use Office case—stability allows pooling soundings and defines anomalies.  
    - *Common failure*: Treating it as a "basic belief" (foundationalism).  
  - **2 marks**: Contrast with empirical hypothesis (testable within framework).  
    - *Top move*: Stability vs. depth estimates; anomalies test hypotheses, not frameworks.  
    - *Common failure*: Calling framework propositions "very well-confirmed hypotheses."  
  - **2 marks**: Contrast with communal assumption (constitutive vs. contingent).  
    - *Top move*: Without stability, pooling collapses; mere assumptions don’t.  
    - *Common failure*: Equating with cultural habits without functional role.  
  - **2 marks**: Explain Office example clearly (anomalies as errors due to stability).  
    - *Common failure*: Generic description without case details.  

  **Part (b) (8 marks)**  
  - **3 marks**: Rationality from practice breakdown (not evidence refutation).  
    - *Top move*: Anomalies force framework abandonment; protocol triggers conversion.  
    - *Common failure*: Treating retirement as normal hypothesis falsification.  
  - **3 marks**: Distinguish revision-as-conversion (framework shift) from evidence-response (within framework).  
    - *Top move*: Protocol enacts conversion; anomalies become data under new model.  
    - *Common failure*: Blurring the distinction or ignoring it.  
  - **2 marks**: Address circularity (anomalies presuppose stability) as pragmatic, not fatal.  
    - *Top move*: Circularity resolved by framework shift, not within old logic.  
    - *Common failure*: Deeming retirement irrational due to circularity.  

  **Part (c) (9 marks)**  
  - **3 marks**: Functional distinction: framework enables shared error-correcting practice; delusion does not.  
    - *Top move*: Office’s public charting vs. patient’s private fixation; error-correction vs. ad hoc denial.  
    - *Common failure*: Citing delusion as "false" or Office belief as "true."  
  - **3 marks**: Tidalists as alternative practice (independent hinges), not external arbiters.  
    - *Top move*: Their method tests stability without assuming it, pressuring revision.  
    - *Common failure*: Claiming Tidalists provide "objective proof" outside frameworks.  
  - **2 marks**: Tidalists aid revision without external standards (resource, not arbiter).  
    - *Top move*: Data motivates conversion but isn’t a "view from nowhere."  
    - *Common failure*: Framing Tidalists as validating/invalidating Office’s framework absolutely.  
