       - "How many of you went to the end? How do you feel? How many are happy? How many wish you had stopped earlier?"
       - "Let's look at the scores: Did the early stoppers in some groups do better than others? Why might that be?"
     - Connect to the concepts:
       - Aspiration level: "Who set an aspiration level? Who adjusted it? How did that feel? Was it worth the cost?"
       - Environment: "Different groups had different distributions. In group A (flat), what happened? Group B (buried treasures)? Group C (good proxy)? Group D (bad proxy)?"
       - Satisficing: "In which environments was stopping early a good strategy? Why? What about when the proxy was bad? Did you rely on the proxy? How did that turn out?"
       - Bounded rationality: "We had limited time and costly information. Did you ever feel you had to make a decision without full information? How did that feel? Did the points reflect the quality of your decision? Or did you feel regret even when you did well by the points?"
     - Highlight the gap: "Did anyone get a high score but feel bad? Or a low score but feel they did the best they could? This gap is important: in the real world, we often have to satisfice, but our emotions might not align with the outcome."

