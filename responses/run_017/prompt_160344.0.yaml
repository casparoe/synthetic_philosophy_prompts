answer: |-
  ### **Satisficing Challenge: Activity Materials and Instructions**  
  *Designed for a 75-minute session with 18 undergrads. No slides, no lecture—just a one-page handout and interactive gameplay.*

  ---

  ### **Materials Needed**  
  - **Index cards (110 total):**  
    - 40 pre-printed with "proxy scores" (visible side) and "true quality" (hidden side) for 4 groups × 10 rounds.  
    - 10 blank cards for aspiration adjustments (students write revised aspirations).  
  - **Timer:** For 1.5-minute rounds.  
  - **Handout (1 page, double-sided):** Instructions + score tracker (see template below).  
  - **Whiteboard:** To record group environments and final scores.  
  - **Pens:** For students to track decisions.  

  ---

  ### **Handout Text (American English)**  
  **FRONT SIDE: INSTRUCTIONS**  
  **Goal:** Maximize your points by "hiring" a job candidate. Points = quality of hire minus costs.  

  #### **Key Rules**  
  1. **Options arrive one by one:** 10 candidates total, each visible for 1.5 minutes.  
  2. **Two scores per candidate:**  
     - **Proxy Score:** Free to see (e.g., resume quality).  
     - **True Quality:** Costs 20 points to reveal (e.g., interview performance).  
  3. **Decisions per round:**  
     - **PASS:** Pay 5 points (search cost), see next candidate.  
     - **INSPECT:** Pay 20 points to see True Quality. Then choose:  
       - **HIRE:** End game, collect points.  
       - **PASS:** Pay 5 points, move on.  
     - **HIRE WITHOUT INSPECT:** Only if Proxy Score ≥ your current aspiration level. Get True Quality for free.  
  4. **Aspiration Level:**  
     - Set an initial aspiration (proxy score) before Round 1.  
     - Adjust during the game—but each adjustment costs 10 points.  
  5. **Scoring:**  
     - Points = (True Quality of hired candidate) - (5 × number of candidates viewed) - (20 × number of inspections) - (10 × number of aspiration adjustments).  
     - If you never hire, points = negative total costs.  

  **Time Limit:** 1.5 minutes per round. If undecided, you PASS automatically.  

  **BACK SIDE: SCORE TRACKER**  
  | Round | Proxy | Decision (Pass/Inspect/Hire) | True Quality (if seen) | Costs This Round | Total Points |  
  |-------|-------|-------------------------------|-------------------------|------------------|--------------|  
  | 1     |       |                               |                         |                  |              |  
  | ...   | ...   | ...                           | ...                     | ...              | ...          |  
  | 10    |       |                               |                         |                  |              |  

  **Aspiration History:**  
  - Start: ______  
  - Adjustments (circle if used): Round ______ New: ______ | Round ______ New: ______  

  ---

  ### **Game Setup**  
  - **Groups:** Split students into 4 groups (4–5 students each). Assign environments:  
    - **Group A (Flat World):** True Quality 40–80 (uniform). Proxy ≈ True Quality + mild noise.  
    - **Group B (Buried Treasures):** 90% True Quality 30–60, 10% 80–100. Proxy ≈ True Quality + heavy noise.  
    - **Group C (Good Proxy):** True Quality 20–100. Proxy ≈ True Quality (strong correlation).  
    - **Group D (Bad Proxy):** True Quality 20–100. Proxy random (no correlation).  
  - **Pre-Generated Sequences:**  
    - *Example for Group B (Buried Treasures):*  
      - Round 1: Proxy 45, True 40  
      - Round 2: Proxy 38, True 35  
      - Round 3: Proxy 85, True 90 (treasure)  
      - ... (full sequences in [supplied materials](#appendix))  

  ---

  ### **Step-by-Step Timeline (75 Minutes Total)**  
  1. **Introduction (5 min):**  
     - Distribute handouts. Say: *"You’re a hiring manager. Your job is to hire one candidate in 10 rounds. Goal: Maximize points. Read the handout—decisions are timed!"*  
     - **Critical framing:** *"Set your aspiration level NOW—this is the proxy score you’ll accept without inspection."*  

  2. **Aspiration Setting (5 min):**  
     - Students write initial aspiration on handouts.  
     - *No discussion—this is individual.*  

  3. **Gameplay Rounds 1–10 (25 min):**  
     - **Each round (1.5 min):**  
       - Give each group one index card (proxy visible).  
       - Students decide individually: Pass, Inspect, or Hire.  
       - If they Inspect, reveal True Quality; they then decide Hire/Pass.  
       - If they Hire (with/without inspection), they stop playing but keep tracking costs until game ends.  
       - **Timer beeps at 1:30—force decisions.**  
     - **Cost enforcement:**  
       - Collect 10-point "adjustment cards" when aspirations change.  
       - Tally search/inspection costs publicly per round (e.g., *"Group A, Round 3: 2 inspections, 3 passes"*).  

  4. **Scoring (5 min):**  
     - Students calculate points using the formula.  
     - Poll scores: *"Who has positive points? Negative? Highest score?"*  

  5. **Debrief (35 min):**  
     - **Step 1: Feelings vs. Outcomes (10 min)**  
       - Ask:  
         - *"Who stopped early (before Round 10)? How do you FEEL about your decision?"*  
         - *"Who reached Round 10? How do you FEEL?"*  
       - Chart on whiteboard:  
         | Group | Avg. Score (Stopped Early) | Avg. Score (Didn’t Stop) | Avg. Feeling (1–5) |  
         |-------|-----------------------------|--------------------------|---------------------|  
       - Highlight gaps (e.g., *"Group B’s early stoppers have high scores but regret missing treasures"*).  
     - **Step 2: Environment Matters (10 min)**  
       - Reveal group environments. Ask:  
         - *"Flat World (A): Did stopping early work? Why?"*  
         - *"Buried Treasures (B): Did inspections pay off? Who got ‘stuck’ revising aspirations?"*  
         - *"Good Proxy (C): Did you trust the proxy? Did it backfire?"*  
         - *"Bad Proxy (D): Did aspiration adjustments help or hurt?"*  
       - **Key insight:** *"Rational stopping depends on the environment—not your ‘greed’ or ‘patience’."*  
     - **Step 3: Satisficing Concepts (10 min)**  
       - Map game moments to theory:  
         | Game Moment          | Bounded Rationality Concept               |  
         |----------------------|-------------------------------------------|  
         | Setting aspiration   | Reference point for "good enough"         |  
         | Revision cost        | Cognitive cost of changing goals          |  
         | Skipping inspection  | Relying on proxies under time pressure    |  
         | Group B’s regrets    | Scoreboard vs. emotional satisfaction gap |  
       - Ask: *"When was satisficing rational? When was it painful?"*  
     - **Step 4: Limits of the Game (5 min)**  
       - *"What this game CAN’T show: Real-world aspirations are shaped by social comparison (e.g., your peers’ choices), and environments change over time. Sometimes, ‘good enough’ is all you can do—even if it feels like settling."*  

  6. **Closing (5 min):**  
     - **Check if it landed:** Ask students to write one takeaway on blank cards. *"What’s one situation where you’ll consider satisficing now?"*  
     - **Final message:** *"Stopping early isn’t laziness—it’s a rational response to costs and uncertainty."*  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Problem: Someone games the proxy.**  
     - E.g., A student in Group D (Bad Proxy) inspects every candidate to "beat" the noise.  
     - **Solution:** Let it happen. In debrief, show their high costs and low score—proxies can’t be trusted here.  

  2. **Problem: Everyone stops early (done in 20 min).**  
     - **Solution:** Run all 10 rounds anyway. Non-hiring students keep paying costs—they’ll see the penalty. Use extra time for deeper debrief.  

  3. **Problem: One group refuses to stop.**  
     - E.g., Group B holds out for a treasure, but 90% are duds.  
     - **Solution:** Let them crash (negative points). In debrief, contrast with Group A (where waiting wastes points).  

  4. **Problem: Proxy/True Quality confusion.**  
     - **Solution:** Start with a practice round (e.g., Proxy 60, True 50). Clarify: *"You see Proxy for free; True costs 20 points."*  

  5. **Problem: International students struggle with pace.**  
     - **Solution:** Assign group buddies for quick translations. Use simple terms: "Proxy = quick score; True Quality = real score."  

  ---

  ### **What the Game Can’t Stage**  
  - **Social aspiration-setting:** In reality, aspirations adapt based on peers (e.g., "Everyone else got a better job"). The game isolates this—mention it in debrief.  
  - **Learning over time:** Students don’t know their environment’s "shape." Real agents learn through feedback—but here, it’s one-shot. Say: *"In life, you’d adjust strategies over repeated tries."*  

