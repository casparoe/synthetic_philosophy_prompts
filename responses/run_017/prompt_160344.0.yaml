prompt: |-
  Hey — I'm in a Behavioral Decision Making course this term and the professor has let me run one 75-minute section on my own: 18 undergrads, mostly econ and psych majors, nobody with any formal decision theory. Topic is satisficing and bounded rationality. She said no lecture and no slides beyond a one-page handout, so I need an actual activity, not an explanation.

  What I want them to feel rather than be told: that stopping early can be the *rational* move instead of a character flaw, and that whether it is depends on the shape of the environment, not on some trait of the agent. And — the bit I care most about — I want them to run into the gap between doing well by the scoreboard and feeling fine about it. My guess is the people who stop early will end up with more points and feel worse about it, and I want that to be something they notice on their own, not something I announce.

  Some constraints I've been turning over, which maybe you can tell me are wrong:

  - Two separate costs: one for finding a new option (search) and one for finding out how good an option actually is (inspection). I want inspection expensive enough that they sometimes have to settle for a cheap proxy signal — I think satisficing only gets interesting there, and I don't want that to get flattened out.
  - Options should arrive over real time, one per round, so the deadline is something they feel in their gut rather than a number on a page.
  - Different tables get different underlying distributions — one flat-ish, one where a couple of great options are buried in a lot of mediocre ones, one where the proxy correlates with real quality and one where it basically doesn't — and nobody knows which one they're sitting in.
  - Everyone writes down an aspiration level before anything starts, and they can revise it during play but each revision costs something, so they can feel the pull of moving the goalposts when the search goes badly.

  What I need: materials and the handout text, exact rules, a payoff scheme in points (no real money, index cards and a timer only), a minute-by-minute timeline for 75 minutes, and a debrief. The debrief should map specific moments in the game onto specific parts of the satisficing story — setting the aspiration level, the stopping rule, search versus inspection cost, adaptation of the aspiration — and say what to do with the fact that different tables lived in different worlds. Then: what will predictably go wrong the first time I run it (I'm guessing someone tries to game the proxy, or the whole room is done in 20 minutes, or one table just refuses to stop), how I should handle each, and — honestly — which part of bounded rationality this game can't stage at all and that I'll have to just say myself at the end. Also give me one thing I can look at or ask at the very end that tells me whether it landed.

  One last thing: please don't just hand me the secretary problem in a different hat. I've seen that one and it's about optimal stopping when you know the arrival structure up front, which feels like almost the opposite of the point here.

  Oh, and write it in American English — half my section is international students and I dont want them picking up my British spellings.
reasoning: |-
  We are designing an activity to teach satisficing and bounded rationality. The key goals are:
  1. Stopping early can be rational and depends on the environment.
  2. Participants should experience the gap between objective success (points) and subjective feelings.

  Constraints:
  - Two costs: search (finding a new option) and inspection (evaluating an option's true quality).
  - Inspection is expensive, so sometimes they must rely on a cheap proxy.
  - Options arrive one per round in real time (with a timer).
  - Different groups have different distributions of option quality and different relationships between the proxy and true quality.
  - Participants set an aspiration level at the start and can revise it at a cost.

  We need:
  - Materials and handout text.
  - Exact rules and payoff scheme.
  - 75-minute timeline.
  - Debrief connecting game moments to concepts.
  - Predictable problems and solutions.
  - What the game cannot stage and must be explained.

  We avoid the secretary problem because it assumes known arrival structure.

  Let's design a game called "The Satisficing Challenge".

  **Materials:**
  - Index cards (prepared in advance for each group and round)
  - Timer (for rounds)
  - Handout (one page, double-sided) with instructions and record sheet
  - Whiteboard or flip chart for recording group results

  **Handout Text:**

  **Side 1: The Satisficing Challenge**

  *Goal:* Accumulate as many points as possible.

  *How it works:*
  - You are searching for a job candidate to hire. Each candidate has:
    - A **Proxy Score** (visible for free): a quick impression (e.g., resume look).
    - A **True Quality** (costly to reveal): how good they actually are (revealed only if you inspect).
  - You will see candidates one at a time. Each candidate appears for a limited time (1 minute per round).
  - **Costs:**
    - **Search Cost**: 5 points per candidate you consider (just for seeing the proxy). This is paid for every candidate you look at, whether you inspect or not.
    - **Inspection Cost**: 20 points to reveal the True Quality of a candidate. You can choose to inspect only if you are considering hiring that candidate.
  - **Hiring**: 
    - You can hire a candidate only in the round they appear. 
    - If you hire, the game ends for you, and you get: **True Quality of hired candidate minus Search Costs for all candidates you viewed minus Inspection Costs (if you inspected that candidate) minus any Aspiration Adjustment Costs.**
    - If you don't hire by the end of the game, you get 0 points (and still pay all search costs).
  - **Aspiration Level**:
    - At the start, write down your aspiration level (a number) for the Proxy Score. This is the minimum proxy you would consider hiring without inspection.
    - You can adjust your aspiration level during the game, but each adjustment costs 10 points.

  *Rules:*
  - Each round, you will see a new candidate's Proxy Score.
  - You have 1 minute per round to decide one of:
    a) **Pass**: See the next candidate (pay search cost for this candidate and move on).
    b) **Inspect**: Pay 20 points to reveal True Quality. Then you can either:
        - Hire (game ends for you) OR
        - Pass (pay the search cost and move on).
    c) **Hire without inspection**: Only if the Proxy Score meets or exceeds your current aspiration level. You get the True Quality without paying inspection cost, but you don't know the True Quality until after you hire.

  *Important:*
  - The game has 12 rounds (12 candidates). 
  - You must decide within the 1-minute round timer. If you don't decide in time, you automatically pass.

  *Record Sheet:* (on Side 2)

  **Side 2: Record Sheet**

  Group: _____   Your Aspiration Level History (write down each time you set or adjust):

  | Round | Aspiration Level | Adjustment Cost? (if changed) |
  |-------|------------------|-------------------------------|
  | Start | __________       | No                            |
  | ...   | ...              | ...                           |

  Decision Log:

  | Round | Proxy Score | Decision (Pass, Inspect, Hire) | If Inspect: True Quality? | If Hire: True Quality? | Cost This Round | Total Points So Far? (optional) |
  |-------|-------------|--------------------------------|---------------------------|------------------------|-----------------|--------------------------------|
  | 1     |             |                                |                           |                        |                 |                                |
  | ...   | ...         | ...                            | ...                       | ...                    | ...             | ...                            |
  | 12    |             |                                |                           |                        |                 |                                |

  *Note: Total Points = (True Quality of hired candidate) - (5 * number of candidates viewed) - (20 * number of inspections) - (10 * number of aspiration adjustments). If you never hire, Total Points = - (all costs).*

  ---

  **Game Setup:**

  We need 4 different environments (for 4-5 groups, each with 3-5 students). Each group gets a fixed environment:

  - Group A (Flat): True Quality uniformly distributed between 40 and 80. Proxy = True Quality + random noise (mean 0, so correlated but imperfect).
  - Group B (Buried Treasures): True Quality: 90% between 30-60, 10% between 80-100. Proxy = True Quality + more noise (so sometimes a treasure looks mediocre).
  - Group C (Good Proxy): True Quality between 20-100. Proxy = True Quality + small noise (high correlation).
  - Group D (Bad Proxy): True Quality between 20-100. Proxy = random between 20-100 (uncorrelated).

  For simplicity, we can generate the sequences in advance. Each group gets a fixed sequence of 12 (Proxy, True Quality) pairs.

  **Preparation:**
  - Prepare index cards for each group and each round. On one side: the Proxy Score. On the other: the True Quality (only to be revealed if they inspect or if they hire without inspection).
  - Also, the instructor has a master list for each group.

  **Payoff Scheme:**
  - Points are calculated as per the handout.

  **Timeline (75 minutes):**

