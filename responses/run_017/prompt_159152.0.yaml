  Here's my decomposed analysis, combining philosophical arguments with probabilistic confidence:

  **Headline Credence: 0.75**  
  *(Calculated as: (1) × [(2_obs + 2_lex)/2] × (3) × (4) × (5), then adjusted -0.05 for interdependencies)*  
  *(Your 0.5 likely hinges on (2_lex) and (4); your friend's 0.8 prioritizes (1) and (3))*

  1.  **Structured Content Required:** **0.90**  
      *Justification:* Co-referential terms failing substitution *salva veritate* in intensional contexts (belief, necessity) strongly implies finer-grained content. "Hesperus is visible at dawn" vs. "Phosphorus is visible at dawn" can differ in truth-value for a speaker unaware of identity.  
      *(Moves your friend toward 0.8; your resistance might stem from (2/4))*

  2.  **Discovery is Semantic (not just metalinguistic/epistemic):**  
      *   **Observational Case (Astronomer):** **0.80**  
          *Justification:* The discovery isn't *just* learning a linguistic fact ("these words co-refer"), but that two *empirically distinct phenomena* (the last star fading at dawn, the first star brightening at dusk) are manifestations of one object. The modes of presentation are anchored in perception/cognition, not lexicon.
      *   **Lexicographic Case (Glossary):** **0.30**  
          *Justification:* Here, learning "Hesperus = Phosphorus" *is* primarily acquiring a metalinguistic fact about synonymy within a specific textual/discourse system. The "modes of presentation" are purely descriptive conventions.  
      *(Your lexicographic case as model pushes you toward metalinguistic views, lowering overall credence)*

  3.  **Belief Reports Require Semantic Apparatus:** **0.85**  
      *Justification:* "Lois believes Superman can fly" vs. "Lois believes Clark Kent can fly" differ in truth despite co-reference. Explaining this via hidden indexicals (e.g., "under mode M") or implicature feels ad hoc and struggles with compositionality compared to structured propositions containing distinct senses.

  4.  **Unified Apparatus Required (Identity + Belief):** **0.60**  
      *Justification:* While elegant, a unified solution isn't strictly *necessary*. A hybrid view (e.g., epistemic factors for discovery, semantic for belief reports) is conceivable, though potentially less parsimonious. This is the weakest link for strong Fregeanism.  
      *(Key point of your uncertainty – your lexicographic case fuels hybrid potential)*

  5.  **Trivial Identity is Cognitively Empty:** **0.95**  
      *Justification:* "Hesperus = Hesperus" is uninformative a priori; its triviality is foundational to the puzzle. Denying this requires explaining why such trivialities *ever* seem informative, undermining the contrast.

  **Disagreement Diagnosis:**  
  Your **0.5** vs. your friend's **0.8** most likely centers on **(2)**, specifically the interpretation of the **lexicographic case (2_lex)** and its relationship to the **unification thesis (4)**. You see the glossary case as a model exposing a metalinguistic core potentially applicable to the observational case, weakening the need for semantic senses. Your friend likely sees the observational case as fundamentally different, demanding senses, and views the glossary case as degenerate or parasitic on prior semantic content.

  **Least Confident Term: (4) Unified Apparatus (0.60)**  
  *   **What Would Move It:** A compelling, developed hybrid theory that cleanly explains the informativeness of identity statements (like the astronomer's discovery) using *only* epistemic/pragmatic/metalinguistic resources *without* needing to posit senses, while *also* offering an equally robust (non-ad-hoc) explanation for belief report failures using a *different* mechanism (e.g., sophisticated hidden indexicality, presupposition failure, dynamic semantics). Currently, most alternatives seem to handle one phenomenon well at the expense of the other.
  *   **What "Settled" Looks Like:** Given its non-empirical nature, settlement would require either:  
      (a) **Conceptual Exhaustion:** A hybrid theory achieves widespread acceptance by demonstrably resolving *all* counterexamples (e.g., empty names, propositional attitudes with complex descriptions, cognitive significance in mathematics) more elegantly than sense-based views.  
      (b) **Formal Incompleteness:** A decisive argument showing that *any* attempt to explain belief reports without structured content inevitably leads to contradictions or violates fundamental principles of semantic compositionality or truth-conditional adequacy in a way sense-based views avoid. Consensus forms around one view's superior explanatory power across the full range of phenomena (identity, belief, necessity, fiction, etc.).
