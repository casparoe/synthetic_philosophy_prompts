  Topic 1: Seminary Study (Darley & Batson)
    Q1: You often cite the study where seminary students in a hurry stepped over a person in distress. Why is that time pressure evidence about character rather than just about attention? (Target: The role of attention in her account of local virtue)
    Likely Reply: Because attention is part of the setup; without the right situational cues, even a well-disposed person may fail to notice the need.
    Follow-up: But if attention is so easily disrupted by minor situational changes, how can we ever attribute a stable disposition to the person?
    Concession: That without the setup, the person has no stable disposition at all, which might undermine the idea of virtue as a personal trait even locally.

  Topic 2: Milgram Obedience
    Q2: In Milgram's obedience experiments, participants were consistently obedient across the situation. By your account, does that make obedience a local virtue for them in that context?
    Likely Reply: It can, but note that virtues are normative — they are dispositions to act well. So obedience in that context was a vice, not a virtue.
    Follow-up: But if the situation reliably elicits a consistent response, and that response is harmful, doesn't your framework risk labeling any reliable disposition as a virtue? Or do you have a way to rule out bad dispositions?
    Concession: That her account might allow for local vices, but then we need an independent standard of "acting well" — which might be external to the person-plus-setup.

  Topic 3: Habit vs. Virtue
    Q3: You say a virtue is a reliable disposition in a narrow situation. But when does this stop being character and start being a mere habit or reflex? If the reliability vanishes when the scaffold is removed, what work is the word 'virtue' doing?
    Likely Reply: Virtues are habits of a particular kind — ones that are responsive to reasons and integrated into one's practical identity, even if context-dependent.
    Follow-up: But if the scaffold is doing the work of ensuring the response, and without it the person doesn't act virtuously, isn't the virtue really in the scaffold? Why call it the person's virtue?
    Concession: That the virtue is not in the person alone, but then the person-plus-setup becomes the minimal unit, and the person without the setup might not have the virtue.

  Topic 4: Moral Education
    Q4: If we raise a child by carefully arranging situations that scaffold virtuous behavior, have we given her a virtue or just managed her behavior?
    Likely Reply: We've given her the opportunity to develop a virtue by internalizing the scaffolds so that they become part of her disposition.
    Follow-up: But what about when she faces novel, unscaffolded situations? If she hasn't developed a global virtue, how does she act well then? And for people whose work is largely unscaffolded — like an improviser or a judge in a novel case — does your account imply they can't be virtuous?
    Concession: That for novel situations, her account might not provide resources, and that such people might need to rely on global traits — which she denies.

