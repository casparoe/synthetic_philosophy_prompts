  ### Interview Questions for Dr. Marisol Okonjo  
  *Ordered to progressively challenge the "fundamental attribution error one level up" deflection, ending with falsifiability.*

  #### Prose Questions (in recommended order):  
  1. **Seminary Study (Attention vs. Character):** You cite the Darley-Batson study where seminary students ignored a distressed person when rushed. Why is time pressure evidence about *character* rather than just *attention*? If attention is so easily disrupted, doesn’t that undermine the idea of a stable disposition?  
  2. **Milgram (Local Virtue for Harm):** In Milgram’s obedience experiments, subjects reliably administered shocks. Doesn’t this show they *did* have a consistent local trait—just a harmful one? Could a reliable torturer be "locally virtuous" in your framework?  
  3. **Habit vs. Virtue (Scaffold Dependence):** Where does a local trait stop being "character" and start being a habit or reflex? If the reliability vanishes when the scaffold is removed, what does "virtue" add beyond describing the situation?  
  4. **Moral Education (Scaffolded Upbringing):** If you raise a child by engineering situations that scaffold honesty, have you given *her* a virtue or just managed her behavior? How do we distinguish internalized virtue from external control?  
  5. **Unscaffolded Work (Improvisation):** What about people in unscaffolded roles—improvisers, judges in novel cases, or someone alone with a decision? If their work lacks "setups," does your account imply they *can’t* be virtuous?  
  6. **Designer Attribution (Virtue Transfer):** You argue the designer of a situation holds the virtue. If a hospital designer creates a system that forces honesty via protocols, but dies, does the hospital remain "honest"? Or does the virtue die with them?  
  7. **Institutional Virtue (No Virtuous Individuals):** Can an institution like a benefits office be "conscientious" if no individual inside it is? Isn’t this just the fundamental attribution error applied to systems—attributing agency where there isn’t any?  
  8. **Software Virtue (Non-Agents):** Could a piece of software—say, an algorithm that impartially allocates resources—be called "fair" or "virtuous"? If so, does this mean virtue requires no intention or consciousness?  
  9. **Emergence vs. Illusion (System Virtue):** When a system produces good outcomes without good individuals, is the virtue *emergent* (a real property of the system) or just an *illusion* (like calling a car "safe" without safe parts)?  
  10. **Cost of System Virtue (Responsibility):** If systems can be virtuous without virtuous individuals, doesn’t this absolve people? Why would anyone cultivate personal virtue if systems get the credit?  
  11. **Falsifiability (Evidence Against):** What evidence could refute your view? For instance, if we found people acting consistently virtuously across *unscaffolded* situations, would that challenge your localism?  
  12. **Concession Question (Final Pressure):** If we accept your system-virtue claim, must we also accept that *no individual* ever deserves blame? After all, if character is always scaffolded, isn’t the designer or system responsible—not the person?  

