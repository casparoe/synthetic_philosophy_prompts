  - **Progression:** Each question tightens the screws: if she concedes scaffolds *are* the virtue (Q3), designer credit is fragile (Q6), or systems absorb blame (Q12), her view becomes more radical.  
  - **Finale:** Q11 asks for falsifiability—making her either admit her view is flexible (weakening it) or rigid (risking unfalsifiability).  

  Use these to steer her toward clarity—good luck with the podcast!
