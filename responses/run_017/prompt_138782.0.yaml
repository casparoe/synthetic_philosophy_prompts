prompt: |-
  You are a philosopher of mind and action who also advises research institutions on the epistemology of collective and distributed reasoning; you have written on how far recursive decomposition can serve as an idealization of careful deliberation, and on where that idealization breaks. Work carefully and in stages. Before you commit to anything, write a private brainstorming section in which you list at least four candidate principles that the decision-making body described below could be running, test each of them against every precedent, and note where each one strains. Only then give your ruling. Do not resolve the tension by declaring the whole exercise confused; the body's track record is imperfect but not arbitrary, and part of your job is to say which part of it is doing real work.

  Context. A large foundation answers hard questions using a recursive decomposition protocol of the kind discussed in the machine-intelligence literature under names like factored cognition or HCH. (If you do not know that literature, nothing below depends on it: everything you need is stated here.) A judge splits a question into sub-questions. Consultants answer each sub-question seeing only that sub-question and, where relevant, the answers to its children; no consultant sees the top-level question, the identity of the asker, or the sibling sub-questions, and this concealment is deliberate, on the theory that knowing the destination would contaminate the parts. The judge merges the sub-answers into an answer to the parent, and that answer becomes an input one level up.

  A standing review board decides, for each question the protocol is asked to answer, whether the question may be settled by decomposition at all or must instead be answered undistanced, in a single act by a designated person or by the board sitting together. The board also distinguishes two different denials: this question is not decomposable, versus this tree is not a decomposition of that question. And it has a third disposition short of approval: shadow mode, in which the tree is run anyway, its output is compared with an undistanced answer, and any divergence triggers review rather than being treated as the answer.

  The board's precedents, condensed from its minutes:

  1. Should the city approve the revised levee design? Approved without conditions: hydrology, geotechnical risk, cost, and environmental impact were split out and recombined by the judge.

  2. What was the median household income in the district last year? Approved with a note that this is the sort of thing the protocol exists for.

  3. Should the journal publish the dual-use paper? Approved on the second attempt, with two conditions: the consultants assessing expected benefit and misuse potential were not told which recommendation the editors were thought to favour, and the judge had to write a synthesis memo stating the weights used.

  4. Which of the two finalists should be hired? Split disposition: the tree was approved for scoring each candidate on stated dimensions, but the final choice was reserved to the committee, which had to read the dimension scores and then decide itself. The reasoning was that the choice had to be the committee's own.

  5. Was the defendant's confession voluntary? Denied. The board held that pressure, duration, and vulnerability cannot be assessed separately without changing what each of them is, and that the judgment is about the interrogation as a whole.

  6. Did Ana act courageously? Denied, on the ground that the verdict is not built additively out of independently answerable parts.

  7. Is this recording of the late quartet beautiful? Denied, with the observation that even a well-run tree would only tell you what such a tree says about the recording.

  8. Should I forgive my brother? Denied on a different ground: the answer is not a report on a state of affairs but the stance itself, and a stance cannot be delegated to parts that do not know they are contributing to it.

  9. Should the lab promote Ravi? The board refused to rule the question undecidable, but rejected the proposed tree: its sub-questions were framed so as to invite a list of Ravi's shortcomings, with no paired questions about the other candidate. It invited a re-specified tree.

  10. Is the contractor's statistical analysis sound? Approved, even though no single consultant read the analysis as a whole and no consultant was told what conclusion the analysis was used to support.

  The new case. The Halvorsen Institute was founded in 1961 to study human population biology. Between 1968 and 1979 one of its research programmes produced data sets and a classificatory scheme that were later cited in another country to justify a programme of compulsory sterilisation. The Institute never performed or advocated the sterilisation, and whether its work was a cause of it, a pretext for it, or merely available to it is genuinely contested. The Institute's current director has asked the protocol a two-part question: should the Institute issue a public acknowledgment, and if so, what should the acknowledgment say?

  The tree the protocol office has proposed has four top-level sub-questions, to be answered by consultants who do not know they are working on this question: (a) what did the Institute's programme actually do, and what was known in the field at the time; (b) how strong is the causal chain from the data sets and the classification to the sterilisation programme, compared with available counterfactual accounts; (c) what do comparable institutions do when their historical materials have been used this way; (d) would an acknowledgment help or damage the Institute's standing with its funders and its scientific partners. A judge would combine the four into a yes or no and, if yes, into a draft statement.

  What I want from you, in about 900 to 1,100 words, under headings:

  First, the candidate principles. State at least four rules the board could be running that fit all ten precedents, name each one, and say where each of them explains a precedent less well than it appears to.

  Second, what each rule predicts about the new case, treating the three parts separately where they come apart: the historical and causal findings, the yes-or-no decision whether to acknowledge, and the drafting of the wording.

  Third, your recommended disposition for the board, if the board wants to be consistent with itself. Say which precedent is the closest analog and why, say whether the ruling should be approval, denial, a split disposition, or shadow mode, and say plainly what principle the board would be adopting with each of the options it rejects. If its precedents genuinely underdetermine the case, say so and say what the board would have to concede about itself either way.

  Fourth, an assessment of the proposed tree: is any defect you find in it a defect of the tree or of the question, and does the board's own distinction in precedent 9 settle which?

  Finally, name one or two further cases the board could put to itself that would best separate the two rules you take to be the live contenders, and say what each rule predicts about them.
reasoning: |-
  Hmm, the user has presented an intricate scenario involving a foundation's decision-making protocol and its review board's precedents regarding when questions can be decomposed. This requires careful philosophical analysis.

  First, I need to understand the core dynamics. The recursive decomposition approach seems effective for factual questions like median income (precedent 2) or technical assessments (precedent 10). But it clearly struggles with holistic judgments - whether a confession was voluntary (precedent 5) or if an act was courageous (precedent 6) can't be meaningfully split into independent components. The beautiful quartet case (precedent 7) introduces another layer: some questions resist decomposition not because they're holistic, but because the answer inherently depends on the evaluative perspective itself.

  The forgiveness case (precedent 8) reveals yet another pattern - performative utterances where answering constitutes the act. You can't delegate forgiveness to subprocesses unaware they're forgiving. The promotion case (precedent 9) shows that even decomposable questions can have defective trees if they embed bias in their structure.

  For the Halvorsen case, I see three distinct aspects: the historical/causal analysis (which seems decomposable), the yes/no acknowledgment decision (which might be performative), and the wording draft (which could be technical). The board's challenge is finding a consistent principle that respects all precedents while handling this layered case.

  Four candidate principles emerge:
  1) The Decomposition Barrier Principle: Questions are non-decomposable when their components aren't ontologically independent. This explains the confession case well but struggles with the forgiveness case.
  2) The Verdict Character Principle: Non-decomposable when the answer is a verdict rather than a finding. This captures forgiveness and courage but overreaches on technical judgments.
  3) The Stance Delegation Principle: Non-decomposable when answering constitutes taking a stance. This perfectly explains forgiveness but struggles with the beautiful quartet case.
  4) The Perspective Contamination Principle: Non-decomposable when concealment would distort the components. This handles the dual-use paper case but fails on the promotion tree flaw.

  For the Halvorsen case, the historical analysis (parts a-c) seems safely decomposable, but the acknowledgment decision (especially part d about institutional standing) feels perilously close to the forgiveness problem - you can't delegate the act of contrition. The wording might be decomposable if treated as drafting, not substance.

  My recommendation would be a split disposition: approve decomposition for the fact-finding questions (a-c), require undistanced deliberation for the yes/no decision, and allow decomposition for the wording draft with shadow mode. Precedent 4 (hiring decision) is the closest analog - decomposable components but core judgment reserved.

  To clarify future cases, the board should test two hypotheticals: "Should we lobby against the new policy?" (stance delegation applies) versus "Was the treaty violation deliberate?" (verdict character applies). Their diverging predictions would reveal whether performativity or verdictiveness is the operative constraint.
answer: |-
  ## Ruling on Halvorsen Institute Acknowledgment Protocol

  **First: Candidate Principles**

  After testing against all precedents, four candidate principles emerge as potentially governing the board's decisions. Each fits the precedents but strains in specific places:

  1.  **Principle of Ontological Independence (POI):** *Decomposition is permissible only if the components of the question exist or can be evaluated independently of each other and the whole.*
      *   **Fits:** Explains precedent 5 (confession voluntariness - pressure, duration, vulnerability are interdependent) and 6 (courage - components aren't additive), possibly 7 (beauty - properties aren't separable from the whole experience).
      *   **Strains:** Struggles with precedent 8 (forgiveness). The *components* of "should I forgive?" (e.g., harm done, remorse shown, relationship value) *can* be assessed independently, but the board denied decomposition. POI doesn't capture the performative/stance nature. Also struggles slightly with the approval of precedent 10 (statistical soundness - soundness *is* a holistic property of the analysis, yet decomposition was approved).

  2.  **Principle of Verdict Character (PVC):** *Decomposition is impermissible when the answer constitutes a personal or institutional "verdict" rather than a report on a state of affairs.*
      *   **Fits:** Strongly explains precedent 5 (voluntariness is a verdict on the interrogation), 6 (courage is a verdict on the act), 8 (forgiveness is a verdict/stance), and the reserved decision in precedent 4 (final hiring choice is the committee's verdict). Also explains the shadow/concern in precedent 7 (beauty verdict belongs to the experiencer, not the tree).
      *   **Strains:** Struggles with precedent 3 (publish/not publish is clearly a verdict for the editors, yet decomposition was approved with safeguards). It also doesn't inherently explain the flaw in precedent 9 (promotion tree was biased) – a verdict *could* theoretically be decomposed fairly.

  3.  **Principle of Stance Delegation (PSD):** *Decomposition is impermissible when answering the question requires taking or constituting a normative stance that cannot be authentically delegated to parts unaware of the stance they are contributing to.*
      *   **Fits:** Directly explains precedent 8 (forgiveness *is* the stance, cannot be delegated unknowingly). Also explains precedent 5 (voluntariness judgment *is* the stance of the court/system) and 6 (courage verdict *is* the stance). Explains the reservation in precedent 4 (final choice *is* the committee's stance). Explains the concern in precedent 7 (aesthetic judgment *is* a stance).
      *   **Strains:** Struggles with the *approval* of precedent 3 (publish decision is a significant editorial stance). The safeguards (concealment of editorial bias, synthesis memo) attempt to mitigate but don't eliminate the stance-delegation problem. Doesn't inherently explain precedent 9's *tree flaw* (bias), though the stance *could* be decomposed fairly.

  4.  **Principle of Perspective Contamination Risk (PPCR):** *Decomposition is impermissible when concealment of the top-level question or context (the "destination") would fundamentally distort the meaning or appropriate evaluation of the sub-questions.*
      *   **Fits:** Explains the safeguards in precedent 3 (concealing editorial bias prevents contamination of benefit/misuse assessments). Explains the denial in precedent 5 (knowing it's about *voluntariness* fundamentally changes how pressure/duration are assessed). Explains the denial in precedent 6 (knowing it's about *courage* changes how you assess risk/motive). Explains the flaw in precedent 9 (framing only Ravi's flaws contaminates the promotion assessment).
      *   **Strains:** Struggles with precedent 8 (forgiveness). Knowing the top-level question *might* help sub-consultants frame their answers *for* forgiveness, but the core objection is about *delegating the stance itself*, not just distortion. Doesn't inherently explain the reservation in precedent 4 (final choice) – contamination risk for the *scores* was seemingly low, yet the *choice* was reserved. Doesn't explain precedent 7 (beauty) well – contamination isn't the primary stated concern.

  **Second: Predictions for the New Case**

  *   **Historical & Causal Findings (a & b):** "What did the programme do?" and "How strong is the causal chain?"
      *   *POI/PVC/PSD/PPCR:* All principles generally predict approval for decomposition. These appear to be factual, historical, and counterfactual reports on states of affairs, not verdicts, stances, or inherently distorted by concealment. (POI might have a slight hesitation if the causal chain assessment is seen as highly interdependent, but precedent 10 suggests this is acceptable).

  *   **Yes/No Decision (Based on a, b, c, d):** "Should the Institute issue a public acknowledgment?"
      *   *POI:* Might lean approval (components seem separable: history, causality, norms, consequences). Strains precedent 5/6/8.
      *   *PVC:* Predicts **denial or reservation**. This is a quintessential institutional verdict – an act of moral/political accounting by the Institute *itself*.
      *   *PSD:* Predicts **denial or reservation**. Deciding to acknowledge *is* taking a stance of responsibility or contrition. This stance cannot be authentically delegated to parts unaware they are constructing an institutional *mea culpa* (or refusal thereof). The "destination" fundamentally changes what answering (c) (norms) or (d) (consequences) *means*.
      *   *PPCR:* Predicts **denial or strong conditions/shadow**. Knowing the "destination" (potential institutional apology/acknowledgment) could heavily distort answers to (c) (what *do* institutions do? vs. what *should we do*?) and especially (d) (assessing standing impact neutrally is impossible if you know it's about *this* kind of statement). Precedent 3's conditions might not be sufficient for this level of contamination risk.

  *   **Drafting the Wording (If Yes):**
      *   *POI/PVC:* Likely approve (treated as technical drafting, not the verdict/stance itself). Precedent 3's synthesis memo suggests drafting can be decomposed.
      *   *PSD:* Might approve cautiously (the *stance* is taken by the 'yes' decision; wording is execution). However, the precise wording *embodies* the stance's depth and character, creating some tension.
      *   *PPCR:* Predicts **high contamination risk / denial or shadow**. The specific wording profoundly impacts the stance's meaning and reception. Knowing the context is an acknowledgment about *this* history would heavily distort how consultants frame answers about phrasing. Could they *truly* assess "what wording helps standing" (d) without knowing the context? Precedent 3's safeguards seem insufficient for this.

  **Third: Recommended Disposition & Principle Adoption**

  *   **Closest Analog:** Precedent 4 (Hiring Decision) is the strongest analog. The board approved decomposition for the *components* (scoring dimensions) but reserved the core *verdict/stance* (the final choice) to the committee itself.
  *   **Recommended Disposition: Split Disposition (Mirroring Precedent 4)**
      *   **Approve decomposition** for sub-questions (a) (historical facts), (b) (causal analysis), and (c) (comparative institutional norms) *provided* consultants for (c) are not told the specific context (to mitigate PPCR). These are reports on states of affairs.
      *   **Deny decomposition** for the **Yes/No decision** ("Should the Institute issue...?"). This is the core institutional verdict and stance. It must be made undistanced by the Director or Board, informed *by* the decomposed reports on (a), (b), and (c), but not *constructed* by them. (PVC & PSD are the strongest principles here).
      *   **Approve decomposition for drafting the wording** **only in Shadow Mode**. The wording is critical to the stance's meaning. Delegating its construction carries high contamination risk (PPCR) and potential inauthenticity regarding the nuance of the stance (PSD). Running the tree but comparing its output to an undistanced draft (perhaps by the Director informed by the decomposed inputs and the undistanced yes/no decision) is prudent. Any divergence triggers review.
  *   **Principles Adopted/Rejected:**
      *   **Adopted:** PVC/PSD (core verdict/stance cannot be delegated) and PPCR (high contamination risk for wording justifies shadow mode). POI is partially adopted for facts/causality but overruled by PVC/PSD/PPCR for the core decision and wording risk.
      *   **Rejected (if approving whole tree):** Approving the entire tree, especially the Yes/No decision, would reject PVC and PSD, implicitly adopting POI and a weaker view of PPCR (relying solely on concealment). This would contradict Precedents 4, 5, 6, and 8.
      *   **Rejected (if denying decomposition entirely):** Denying decomposition entirely would reject POI's applicability to (a),(b),(c) and the technical possibility of drafting, going beyond PVC/PSD/PPCR and contradicting Precedents 1, 2, 3, 10, and the spirit of 9 (which invited respecification).
  *   **Underdetermination?** The precedents strongly point towards a split/shadow approach for complex verdicts (Prec. 4) and stance-taking (Prec. 8), especially with contamination risk (Prec. 3, 9). Approving the whole tree would require the board to concede it prioritizes efficient fact-gathering (POI) over the integrity of institutional verdicts and stances (PVC/PSD). Denying entirely would require conceding it views historical causality assessment as inherently verdict-like or contaminated in a way precedent 10 suggests it is not.

  **Fourth: Assessment of Proposed Tree & Precedent 9**

  The tree's primary defect lies in **decomposing the core Yes/No decision and the wording**, not purely in the *question*. The question ("should... and what say?") inherently *contains* a verdict/stance (should we?) and a performative element (what say?). However:
  1.  **The Sub-Questions:** The *specific* sub-questions (a-d) for gathering information are largely sound *for information gathering*. (d) is highly vulnerable to contamination, but this is a function of *how it's used* (to feed a delegated stance/verdict) rather than an inherent flaw *if* used purely as input for an undistanced decision-maker.
  2.  **Precedent 9's Distinction:** Precedent 9 ("promote Ravi?") distinguishes between the *question* being decomposable (it is) and the *specific tree* being flawed (biased framing). Here, the flaw is more fundamental: decomposing the *core normative decision* itself is problematic (PVC/PSD), regardless of the tree's specific branches. It's a defect *in applying decomposition to this aspect of the question*, not merely a defect *within* a decomposable tree. Precedent 9 shows the board *can* fix flawed trees for decomposable questions. This case highlights that *some aspects of the question* (the verdict/stance) may not be decomposable at all.

  **Fifth: Future Test Cases to Separate Contenders (PVC/PSD vs. PPCR)**

  The live contenders are PVC/PSD (verdict/stance cannot be delegated) vs. PPCR (decomposition impermissible due to contamination risk). These often align but can be separated:

  1.  **Case: "Should the Foundation publicly lobby against Policy X?"**
      *   *Proposed Tree:* Sub-questions: (a) What are Policy X's likely effects? (b) What are the Foundation's core mission values? (c) What are the reputational risks/benefits of lobbying? (d) What are alternative ways to achieve the goal? Judge combines into Yes/No recommendation.
      *   *PVC/PSD Prediction:* **Denial.** Deciding to lobby is taking a public, normative stance in the Foundation's name. This stance cannot be delegated to parts unaware they are constructing a lobbying position (strong PSD). It's a clear institutional verdict (PVC).
      *   *PPCR Prediction:* **Denial.** Knowing the "destination" (lobbying decision) would massively distort answers, especially (a) - assessing effects neutrally - and (c) - assessing reputational impact of lobbying *for this policy*. Contamination risk is extreme.
      *   *Separation Point:* Both predict denial, but for different reasons. To separate, propose a variant where contamination is minimized but the stance remains: e.g., "**Under what conditions, if any, should the Foundation lobby?**" PPCR *might* allow decomposition with safeguards if consultants aren't told *which* policy is being considered, just the abstract question. PVC/PSD would likely *still* deny, arguing that defining the *conditions* for taking a stance *is itself* taking a constitutive stance about the Foundation's role.

  2.  **Case: "Was Ambassador Jones's unauthorized meeting a deliberate treaty violation?"**
      *   *Proposed Tree:* Sub-questions: (a) What were the specific instructions given to Amb. Jones? (b) What communications occurred before/during the meeting? (c) What is the precise treaty clause wording? (d) What constitutes "deliberate" in diplomatic precedent? Judge combines into Yes/No.
      *   *PVC/PSD Prediction:* **Denial or Reservation.** This is a formal verdict with significant consequences (diplomatic incident, potential disciplinary action). The "deliberate" finding is a strong verdict/stance about intent and culpability (PVC/PSD).
      *   *PPCR Prediction:* **Potential Approval with Safeguards.** If consultants are not told the specific ambassador/treaty (only abstract questions about instructions, comms, clause wording, diplomatic definitions), contamination risk *could* be minimized. The answers *could* be ontologically independent facts/reports. Precedent 10 (statistical soundness) suggests complex factual judgments can be decomposed.
      *   *Separation Point:* PPCR offers a path to decomposition via stricter anonymization/abstraction. PVC/PSD would resist, seeing the *verdict character* ("deliberate violation") as inseparable from the act of judging itself, even if fed by decomposed facts. The board reserving the final verdict (like Precedent 4) would favor PVC/PSD; approving a well-concealed tree would favor PPCR.
