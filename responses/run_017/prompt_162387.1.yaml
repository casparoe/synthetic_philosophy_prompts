  **Design notes**:  
  - Flow moves from logic mechanics (1,4) → proof meaning (2,3) → math implications (5,6) → critiques (7,8) → foundations (9,10).  
  - Technical terms (BHK, Markov’s, etc.) glossed inline.  
  - Follow-ups target inconsistencies or underdeveloped claims in predicted answers.  
  - Closing lets guest directly rebut the friend’s "guilt trip" jab.
