answer: |-
  ## The Unfortunate Gym Incident & Subsequent Insurance Claim

  **Setting:** Insurance adjuster's office reviewing a slip-and-fall claim at "Metaphysical Fitness." The claimant, Dr. Thorne, is a philosopher.

  **Adjuster:** "Dr. Thorne, our witness says you were *definitely* in the sauna when you claim to have slipped near the free weights. The timestamps don't lie. That's fraud."

  **Dr. Thorne:** "Not at all! According to *endurantism*, I, the whole Dr. Thorne, was indeed *wholly present* by the weights when I slipped. The sauna testimony is irrelevant."

  **Adjuster:** "But the security footage shows your body in the sauna!"

  **Dr. Thorne:** "Ah, but under *perdurantism*, only a *temporal part* of me was in the sauna. Crucially, the *temporal part* that slipped by the weights was distinct! That part deserves compensation."

  **Adjuster:** "So... how many 'parts' of you were at the gym *at that exact time*?"

  **Dr. Thorne (leaning in):** "Precisely the beauty of my *coarse-grained perdurantism*! There's no unique answer. Was it the 'Tuesday-Morning-Dr.Thorne' part? The 'Pre-Lunch-Workout' segment? Arbitrary! The sauna-inhabiting slice was merely a *coarse-grained proper part* of a larger temporal chunk that *also* included the weights-slipping part. Thus, the slipping part *was* present... albeit indeterminately bounded. Pay the part."

  **Adjuster:** "...I need to call *our* metaphysician."

  *(198 words)*

  **Why coarse-grained perdurantism?** This version exploits the core dispute (wholly present vs. temporal parts) *and* the coarse-grained twist (indeterminate counting of parts). The joke turns on Thorne using the indeterminacy to weasel out of the alibi. A standard perdurantist joke might have Thorne insisting on a *precise*, instantaneous slice at the weights, making the fraud attempt slightly less absurdly ontological and more like bad science fiction. Coarse-grained lets him blur the lines philosophically, which is funnier for the expert.
