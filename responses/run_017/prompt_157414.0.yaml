answer: |-
  ## Thesis Prospectus: Gradations of Mattering and the Practical Landscape of Fission

  **1. The Core Question (120 words):**
  Does Derek Parfit’s conclusion from fission cases – that personal identity isn’t what fundamentally matters in survival, replaced by Relation R (psychological connectedness and continuity) – provide a *complete* answer, or does it merely open a more complex set of questions? Specifically, when fission occurs (e.g., a teletransporter creates two psychologically continuous replicas), does "what matters" simply hold equally for both outputs, resolving the issue? Or must we acknowledge that "mattering" might admit of *degrees* rather than being an all-or-nothing relation, potentially not summing to 1 across branches? Furthermore, does a single relation R adequately ground the *diverse practical attitudes* (fear, prudence, obligation, responsibility) we associate with survival, or might these attitudes track different aspects or strengths of continuity, potentially diverging in novel fission scenarios?

  **2. Why It’s Still Open (200 words):**
  The standard branching argument is powerful: it convincingly demonstrates that strict numerical identity cannot be what matters, as neither output person is uniquely identical to the original, yet both seem to inherit what matters equally. This forces a shift to Relation R. However, this shift often stops prematurely. First, treating R as a binary "present/absent" relation in branching ignores the possibility that the *strength* or *quality* of R might vary between outputs or compared to normal survival, even if both outputs meet the threshold for continuity. Degrees of connectedness (e.g., memory fidelity, character coherence) might translate to degrees of mattering without requiring identity. Second, and more crucially, the standard analysis focuses almost exclusively on *anticipatory* attitudes like fear of death and prudential concern for the future. It neglects the complex web of *retrospective* and *interpersonal* practical attitudes: obligations (promises, debts), responsibility (blame, praise), and entitlements (ownership, authorship). These attitudes might not be uniformly grounded in R. A fission survivor might feel prudential concern for both branches but deny personal responsibility for a crime committed by the other branch, or question whether both equally owe a pre-fission promise. The standard cases don't probe this potential divergence, leaving a significant gap in understanding what "mattering" practically entails.

  **3. Method (250 words):**
  Moving beyond intuition-pumping about standard fission, this project employs a structured, two-pronged method:

  *   **Weeks 1-3: Foundational Analysis & Novel Case Construction:** Deep dive into Parfit (Reasons and Persons, esp. Ch. 10-14), key responses (e.g., Lewis, Williams, Schechtman), and critiques of R. Simultaneously, rigorously define and refine three novel fission variations designed to stress-test degrees and practical attitudes:
      *   *Staggered Scan:* Reconstruction assembled from scans taken years apart (e.g., personality at T1, memories at T5). Continuity exists, but the *intervening* psychology was never instantiated. Does the gap weaken "mattering"?
      *   *Lossy Scan:* Missing data filled using statistical inference from population patterns, not the original's brain. Continuity is inferred/constructed, not directly copied. Does the artificiality reduce the degree of mattering?
      *   *Cold Backup:* Scan stored; replica built decades *after* the original's natural death. Continuity is preserved but delayed. Does the temporal gap and the original's completed life alter practical attitudes like obligation?
  *   **Weeks 4-6: Practical Attitude Taxonomy & Mapping:** Systematically catalog key practical attitudes (Fear of Death, Prudential Discounting, Promising/Obligation, Debt, Blame/Responsibility, Ownership). For each attitude, analyze its typical grounds in non-fission contexts (e.g., promises rely on identity/continuity + intention). Develop precise questions for each attitude applied to standard fission and the three novel cases.
  *   **Weeks 7-9: Argumentative Synthesis & Analysis:** For each attitude in each scenario, rigorously argue: (a) Does Relation R alone suffice to ground it? (b) If not, what additional factors are needed? (c) Can the attitude hold in degrees corresponding to variations in R's strength/quality? (d) Can attitudes diverge (e.g., high prudential concern but low sense of obligation)? Prioritize conceptual coherence over isolated intuitions.
  *   **Weeks 10-12: Drafting, Revision, & Conclusion Integration:** Synthesize findings, address the "friend's position" head-on, articulate the implications for degrees of mattering and the practical landscape.

  **4. What a Result Looks Like / What Failure Looks Like (150 words):**
  **Success:** A robust demonstration that Relation R, while necessary, is insufficient to fully account for the practical landscape of survival. The thesis would show that (1) "what matters" plausibly admits of degrees corresponding to variations in continuity (quality, directness, temporal gap), and crucially, (2) different practical attitudes (e.g., prudence vs. obligation) depend on R *plus* distinct additional features (e.g., unique causal chain, contemporaneity, shared intention context), leading to potential divergence in fission scenarios. This provides a more nuanced framework for evaluating survival technologies and personal ethics than the binary "R holds/R doesn't" model. **Failure:** The project fails if it cannot move beyond restating Parfit or the branching intuition. If the novel cases fail to generate meaningful pressure for degrees or divergence, or if all practical attitudes can be convincingly shown to track R uniformly and robustly across all cases without needing degrees or additional factors, then the friend's position – that branching *does* settle the core issue – remains largely unchallenged. Failure also occurs if the analysis of practical attitudes remains superficial or unconvincing.

  **5. Scope Risks (100 words):**
  The primary risk is attempting too much within one semester. Mitigation requires strict prioritization:
  *   **First Cut:** Reduce the number of novel cases. The Cold Backup might be most expendable as temporal delay is touched on in Staggered Scan/literature.
  *   **Second Cut:** Narrow the range of practical attitudes. Prioritize the most distinct pairs likely to diverge (e.g., Prudential Concern vs. Promissory Obligation; Fear vs. Blame). De-emphasize more derivative attitudes or those closely tied to prudence (e.g., specific debt structures).
  *   **Third Cut:** Limit the depth of engagement with every critic of Parfit; focus only on those directly relevant to R, degrees, or practical attitudes.
  *   **Focus:** Ensure the core argument about degrees and attitude divergence remains central; historical exegesis or pure metaphysics must be tightly constrained.
