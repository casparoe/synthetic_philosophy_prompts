  3. **Breakdown of determinism**: If we take the two models as representing distinct physical possibilities, then the initial conditions (outside the hole, i.e., in the past) do not determine the future (inside the hole). This is because the same past leads to two different futures.

  4. **Response: Relationalism**: One response is to say that the two models represent the same physical reality. This is like quotienting the state space by the symmetry group of diffeomorphisms, so that the two models are considered the same state (i.e., they are in the same equivalence class).

