prompt: |-
  I'm a science journalist, and I'm working on a feature about how physicists decide which parts of a theory's mathematics actually describe something — my philosopher-of-physics friend keeps calling it "ontology identification" and I keep zoning out when he explains it, so I'm trying to approach it from the case-by-case end instead. Here's where I'm stuck: I have fairly firm gut verdicts about a bunch of cases where a theory carries more structure than anyone could ever check, and I can't find a single rule that hands them all back to me.

  The cases, with my verdicts: absolute position in Newtonian mechanics — not real, drop it. The rest frame of the ether in Lorentz's version of electrodynamics, which the contraction hypothesis makes permanently undetectable — not real, and the fact that the theory still works afterward is part of why. The vector potential in the Aharonov–Bohm setup, where an electron's behavior shifts even though it only ever travels through regions where the fields vanish — I want to say something is real there, but I don't think it's the potential as such, since I can change the potential by a gauge transformation without changing anything; it feels like the thing that's real is the loop integral, the holonomy, not the field I wrote down. (Whereas the overall phase of a quantum state: obviously nothing.) Now two cases I made up while stuck on a train, and I'd like them treated as seriously as the real ones. "Ghost molecules": a theory of a gas that, alongside the ordinary molecules, postulates an exact duplicate set of shadow molecules that exert no forces, are never detected, and are included in the state description for no reason — not real, obviously, and I'd say the theory is better off rewritten without them. "The decay clock": a theory of radioactive decay in which each atom carries an extra variable, a clock set when the atom is created, whose reading determines when it decays; the reading can't be inspected before the decay happens, and the theory's predictions are exactly the same as the standard exponential decay law — I want to say this one is real, or at least that I have no urge to call it fake, because it explains why two atoms in identical states decay at different times. And then: regions of the universe beyond our cosmological horizon, which no signal from them can ever reach us — real, I'm confident. Other people's toothaches, inaccessible to me in a pretty strong sense — obviously real. Atoms around 1890, when plenty of good physicists thought them unobservable in principle — real, and the people who denied it were wrong, not just unlucky.

  The rule I've been playing with is something like: a piece of formalism earns ontological rights if some possible observation could in principle pin it down, or if deleting it would cost the theory some explanatory work — otherwise it's decoration. But that seems to give me the wrong answer on the decay clock (deleting it doesn't change a single prediction, yet I still want it), on the horizon regions, and on toothaches, so I suspect the rule is broken rather than that my verdicts are. Can you do better? Give me the principle you'd actually defend, clause by clause, with the case that forces each clause, stated tightly enough that I could quote it in print. Tell me what it says about two cases I haven't listed — the other branches in an Everettian quantum mechanics, and the interior of a black hole as described by someone who stays outside — plus one case of your own choosing that you think tests it hard. Then be straight with me about which of my verdicts your principle can't accommodate and which one you'd overturn, and whether the ghost molecules and the decay clock really are different in a way that matters or whether I'm just being inconsistent.
reasoning: |-
  Okay, let me unpack this user's query. They're a science journalist struggling with how physicists decide which mathematical parts of a theory correspond to real things. They've listed several cases with their own gut verdicts and want a principle that explains them all. 

  First, I notice the user is frustrated with philosophical jargon ("ontology identification") and prefers concrete examples. That makes sense - they're a journalist, not a philosopher. Their examples range from classical physics (Newton, Lorentz) to quantum (Aharonov-Bohm) to thought experiments they invented ("ghost molecules", "decay clock"). 

  Hmm... their proposed rule fails on three cases: decay clock (wants it real but deleting changes nothing), horizon regions (real but unobservable), and toothaches (real but private). That's the core tension. 

  Let me group the cases: 
  - Clearly unreal: absolute position, ether frame, quantum phase, ghost molecules 
  - Borderline but user wants real: Aharonov-Bohm (but only holonomy, not full potential) 
  - User insists are real despite issues: decay clock, horizon regions, toothaches, atoms (1890) 

  The decay clock case is particularly interesting. It feels different from ghost molecules because it explains randomness - even if it doesn't change predictions. Ghost molecules are pure excess baggage. 

  For the principle, I need: 
  1) Something that handles unobservables (horizons, toothaches) 
  2) Explains why decay clock "does work" by grounding probabilities 
  3) Captures why holonomy matters but gauge doesn't 

  Ah - focus on what the structure *does*, not just what it *is*. The decay clock structures the possibilities (which atom decays when), while ghost molecules add nothing. 

  For black holes and Everett: 
  - Black hole interior: real if it affects what's outside (like entanglement) 
  - Everett branches: real if they explain decoherence patterns 

  The toothache case is tricky because it's private but has public correlates (grimacing etc.). The principle should require that the structure must make a difference *somewhere* to *someone*. 

  Biggest conflict: user's horizon regions verdict. By strict empiricism, they shouldn't be real - but relativity says they are. So the principle must allow reality beyond causal contact if required by the theory's best explanation. 

  Also need to admit the rule isn't perfect - it'll likely conflict with atoms (1890) when they were truly unobservable. But that's okay; we can say denialists were wrong precisely because later evidence showed the structure was indispensable. 

  For quoting: crisp clauses with examples attached. Avoid philosophy-speak. Emphasize "difference-making" and "explanatory work" over observability.
answer: |-
  Here's a principle I'd defend, built clause-by-clause from your cases and refined to handle the toughest tests. I'll call it the **Operational Indispensability Principle**:

  1.  **A mathematical structure within a theory earns ontological status if and only if it is *operationally indispensable* to the theory's best available explanation of phenomena.** ("Operationally indispensable" means its removal demonstrably degrades the theory's coherence, predictive/explanatory scope, or empirical adequacy *as judged by scientific practice*, even if not every specific prediction changes.)
      *   *Clause 1a: Degradation must be more than mere descriptive inconvenience; it must compromise core scientific goals like unifying phenomena, grounding probabilities, or resolving paradoxes.*
      *   *Clause 1b: "Best available explanation" acknowledges this is contextual to the state of scientific knowledge and competing theories.*
      *   *Case forcing Clause 1a:* **The Decay Clock.** Deleting the clock *doesn't* change specific decay *predictions*, but its removal destroys the theory's *explanation* for *why* decay events occur randomly and independently at specific times. Without it, the randomness becomes brute fact, undermining the theory's explanatory power regarding *causation* and *individuation* of events. The clock is operationally indispensable for this *explanatory work*.
      *   *Case forcing Clause 1b:* **Atoms (c. 1890).** Kinetic theory's explanation of Brownian motion, chemical ratios, gas laws, etc., *required* the structure of atoms/molecules to unify these phenomena coherently. While direct detection wasn't possible then, the atomic structure was indispensable to the *best available explanation* compared to phenomenological alternatives.

  2.  **Structure that can be freely altered (e.g., via symmetry transformations) without altering any physical predictions or explanations is ontologically superfluous; only the invariant structure is potentially real.**
      *   *Case forcing this clause:* **Absolute Position (Newtonian Mechanics) & Vector Potential (Aharonov-Bohm).** Shifting absolute position or applying a gauge transformation to the vector potential changes nothing observable or explanatorily necessary. Only the *relative* positions and the *gauge-invariant loop integral (holonomy)*, respectively, are operationally indispensable. The holonomy explains the Aharonov-Bohm phase shift coherently within the framework of gauge theory; the specific potential value at a point does not.

  3.  **Structure postulated solely for formal convenience or simplicity, which demonstrably plays no role in grounding predictions, explanations, or coherence, is ontologically superfluous.**
      *   *Case forcing this clause:* **Ghost Molecules & Ether Rest Frame (Lorentz).** Ghost molecules add nothing to predictions, coherence, or explanation; they are pure formal baggage. Lorentz's ether frame, while motivating the contraction *hypothesis*, became operationally *dispensable* once Special Relativity showed the same phenomena (including the contraction) could be derived *without* it, offering a more coherent (relativistic) explanation. Its continued inclusion added nothing indispensable.

  4.  **Indirect evidence counts.** Structure can earn ontological status through its indispensable role in explaining phenomena *even if* direct observation is impossible, impractical, or requires inference.
      *   *Case forcing this clause:* **Other People's Toothaches & Atoms (c. 1890).** We cannot directly experience another's toothache, but its structure (a specific, localized, intense pain state) is indispensable to explaining their observable behaviors (grimacing, seeking dentists, reporting pain) coherently within our psychological/biological understanding. Similarly, atoms were indispensable for explaining indirect evidence like chemical reactions long before direct imaging.

  5.  **The principle applies globally.** Structures required for the coherence of the theory's description of the *entire* domain it purports to describe are indispensable, even if localized verification is impossible.
      *   *Case forcing this clause:* **Regions Beyond the Cosmological Horizon.** Within our best cosmological theories (e.g., Lambda-CDM model based on General Relativity), these regions are *indispensable* for the global coherence and explanation of the universe's geometry, homogeneity, isotropy, and evolution. Removing them breaks the model's consistent description of the whole cosmos, even if we can't causally interact with them.

  **Applying the Principle to Your Additional Cases:**

  *   **Other Branches (Everettian QM):** **Real.** The branching structure is operationally indispensable within Everettian QM to *explain* the appearance of definite outcomes and the Born rule probabilities *without* adding collapse postulates or hidden variables. Deleting the branches (leaving only one "world") destroys the theory's core explanatory mechanism for quantum randomness and measurement. They are not merely formal baggage; they ground the theory's account of probability and experience.
  *   **Black Hole Interior (External Observer):** **Ambiguous/Conditionally Real.**
      *   *If* the theory describing the external view (e.g., semi-classical gravity) **requires** the interior structure for its *global coherence* and consistency (e.g., resolving information paradoxes, explaining smooth horizons, unitarity) *and* no simpler theory dispensing with it provides an equally good explanation, then **Real** (by Clause 5).
      *   *If* a theory (e.g., some versions of the AdS/CFT correspondence or black hole complementarity) can provide a coherent, empirically adequate description *only* using the external degrees of freedom (e.g., the horizon/holographic screen), explicitly showing the interior is a derived or emergent description not fundamental to the explanation, then **Not Real** (by Clause 3). Current physics suggests the latter view might be viable.
  *   **My Test Case: The Metric Field in General Relativity:** **Real.** While coordinate-dependent components are gauge (Clause 2), the *invariant spacetime geometry* described by the metric tensor is operationally indispensable. It *directly* determines the motion of test particles (geodesics) and light paths, explains gravitational lensing and time dilation, and provides the dynamical arena for all other physics. Removing it destroys the theory's core explanatory mechanism for gravity as spacetime curvature.

  **Reconciling Your Verdicts & Addressing Inconsistency:**

  *   **Accommodated:**
      *   Absolute Position (Newton): Superfluous (Clause 2).
      *   Ether Frame (Lorentz): Superfluous post-SR (Clause 3).
      *   Vector Potential (A-B): Superfluous; Holonomy Real (Clause 2).
      *   Quantum Phase: Superfluous (Clause 2).
      *   Ghost Molecules: Superfluous (Clause 3).
      *   Horizon Regions: Real (Clause 5).
      *   Toothaches: Real (Clause 4).
      *   Atoms (1890): Real (Clause 1b, Clause 4).
  *   **Overturned (by my principle):** None directly. Your verdicts align well with the principle's outcomes.
  *   **The Decay Clock & Ghost Molecules - A Crucial Difference:** Your gut feeling is **correct and consistent.** The principle explains why:
      *   **Ghost Molecules:** Pure formal baggage (Clause 3). Add *nothing* to predictions, explanations, or coherence. Deleting them *improves* the theory by making it simpler without loss.
      *   **Decay Clock:** Provides an *explanation* for the statistical randomness and individuality of decay events (Clause 1a). Deleting it *degrades* the theory's explanatory power, leaving the randomness unexplained. It grounds the probabilities and causal structure of the model. It's *operationally indispensable* for the *kind* of explanation the theory offers, even if not for specific predictions. It provides a *causal mechanism* where none existed before.

  **Straight Talk:**

  *   **Strengths:** This principle handles your core tension (Decay Clock vs. Ghost Molecules, Horizon vs. strict detectability) by shifting focus from mere prediction to *explanatory indispensability*. It incorporates invariance (Clause 2), rejects pure baggage (Clause 3), allows indirect/global justification (Clauses 4 & 5), and acknowledges scientific context (Clause 1b).
  *   **Weakness:** "Best available explanation" (Clause 1b) is inherently somewhat subjective and time-dependent. Deniers of atoms in 1890 argued *their* non-atomic theories were the "best explanation." We judge with hindsight. The principle relies on the scientific community's consensus on what constitutes a good explanation. It doesn't guarantee uniqueness, just indispensability within a framework deemed successful.
  *   **Ghost Molecules vs. Decay Clock:** Your intuition is sound. The Decay Clock is explanatory structure; Ghost Molecules are decorative structure. The principle captures this distinction via operational indispensability for explanation (Clause 1a).

  **Quotable Core Principle:**

  > "A mathematical element in a physical theory describes something real if and only if it is operationally indispensable: its removal demonstrably harms the theory's best available explanation—degrading its coherence, predictive scope, or ability to ground phenomena like probabilities—even if specific predictions remain unchanged. Structure that can be freely altered without consequence, or serves only formal convenience, does not earn this status."

  This principle reflects how physicists actually argue about ontology: not just from raw prediction, but from which structures fundamentally *do the explanatory work* within their best theories.
