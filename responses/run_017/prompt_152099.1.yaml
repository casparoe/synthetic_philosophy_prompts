  We are to construct a counterexample to the simple conditional analysis (SCA) of dispositions. The SCA states: x is disposed to M when S iff if x were in S, then x would M. We want a case where an object is not fragile (so, not disposed to break when struck) but the conditional "if it were struck, it would break" is true. We must avoid finks (where the stimulus removes the disposition) and masks (where an external factor prevents the manifestation). The object must break in the normal sense (so no vaporization) and be an ordinary household object (or something an engineering club could rig). The goal is to show that SCA overgenerates by counting a non-fragile thing as fragile.

  Here is the scenario:

  Consider an ordinary glass jar with a thin wire attached to a small explosive charge inside it. The explosive is inert and will not go off unless the wire is pulled. The wire runs out of the jar and is attached to a sturdy lever placed next to it. The lever is set so that if the jar is struck with a moderate force (like a typical strike that would break a fragile glass), the lever will be pushed, pulling the wire and detonating the charge, which breaks the jar. Crucially, the glass jar itself is made of toughened glass that is not fragile and would not break under the strike alone. The explosion breaks the jar, but without the explosive, the jar would remain intact. The explosive is set to break the jar only if the jar is struck, and the mechanism is entirely internal to the setup (the lever and explosive are part of the object we are considering). However, note that the fragility of the jar itself is absent: the glass is tough and not brittle.

  Now, let's analyze:

  1. **Simple Conditional Analysis (SCA)**: 
     - Conditional: If the jar were struck, it would break. This is true because of the mechanism: when struck, the lever is pushed, the wire pulls, the explosive detonates, and the jar breaks. So SCA says the jar is fragile (disposed to break when struck).

  2. **Usual Fix (with intrinsic basis)**:
     - The usual fix (like Martin's or Choi's) requires that the object has an intrinsic property (the basis) that would cause M if S occurred and the basis were retained. Here, the jar's toughness is an intrinsic property, but the basis for the breaking is not the glass's brittleness (which it lacks) but the explosive mechanism. The explosive mechanism is intrinsic to the setup? However, note that the explosive and lever are added parts. The fix might require the basis to be an intrinsic property of the object. If we consider the entire setup (jar plus attached lever and explosive) as the object, then the explosive mechanism is intrinsic to that object. But then, if we require that the basis must be retained through the stimulus, then note that when struck, the lever is pulled and the explosive detonates, so the basis (the explosive in an inert state) is not retained. Thus, the usual fix might say: the object (the jar plus mechanism) does not have an intrinsic basis that is retained when struck that would cause breaking. The basis (the explosive) is destroyed in the process. Alternatively, if we consider only the jar (without the mechanism) then it has no basis for breaking and is not fragile. So the usual fix might avoid counting it as fragile.

  But note: the constraint is that the object is not fragile. We have two ways to describe the object: 
     - If the object is the jar alone (without the mechanism), then the conditional is false because without the mechanism, the jar wouldn't break. But we attached the mechanism, so we are considering the entire setup? The problem says "ordinary household object", and we added an explosive. However, it's an engineering club rig. So let the object be the entire rig.

  So, for the entire rig (jar plus mechanism):
     - It is not fragile in the ordinary sense because the glass is tough. The breaking is due to the explosive, not the fragility of the glass. So we want to say it is not fragile (i.e., not disposed to break when struck in the way fragile things are). But the conditional holds.

  Now, the usual fix (with intrinsic basis and retention) might say: the object has an intrinsic basis (the explosive and the lever mechanism) that, if retained, would cause breaking when struck. But when the object is struck, the basis is not retained because the explosive detonates and the mechanism is destroyed. Therefore, the usual fix would not count it as having the disposition because the basis is not retained.

  Alternatively, if we interpret the basis as the set of properties that are causally responsible for the manifestation, then note that the basis (the explosive) is present until the moment of the strike, and then it is activated. The retention condition might be that the basis must persist through the stimulus until the manifestation? In this case, the basis (the explosive) is present at the onset of the stimulus and then it is consumed. So if retention requires the basis to survive the stimulus, it does not. But if retention only requires that the basis is present at the onset and then it does its job, then it might be retained. This is a point of debate.

  To avoid ambiguity, let's design so that the basis is not retained. We can say: the explosive charge is set to detonate upon the slightest pull, and the detonation destroys the basis (the explosive itself). So the basis is not retained.

  Thus, the usual fix would say: the object does not have a disposition to break when struck because there is no intrinsic basis that is retained during the stimulus that would cause the breaking. Therefore, the usual fix avoids the overgeneration.

  But note: the problem asks for a case where the object is not fragile (so we want the verdict that it is not disposed) but the simple analysis says it is. And the usual fix should get it right (so it should say it is not disposed). So in this case:

  - SCA: true conditional -> disposed (fragile). But we want to say it's not fragile -> overgeneration.
  - Usual fix: no retained intrinsic basis -> not disposed -> correct.

  Now, what is the single feature doing the work? The feature is that the breaking is caused by an auxiliary mechanism that is triggered by the stimulus, not by the object's intrinsic fragility. If we delete the mechanism (and just have the toughened glass), then the conditional becomes false (it wouldn't break) and the object is not fragile, so no problem. Without the mechanism, the SCA doesn't hold.

  How might a defender of SCA wriggle out? They might argue that the object we are evaluating is the jar alone, but then the conditional "if it were struck, it would break" is false because without the mechanism, it wouldn't break. So to make the conditional true, we must include the mechanism. But then, the defender might say that the entire setup is disposed to break when struck. However, we are calling it "not fragile" because fragility is typically a property of materials. So the defender might say: but the setup is fragile in a broader sense? We must resist this by noting that the problem is about fragility as a disposition that objects like glass have, and the setup does not have that. The setup breaks because of the bomb, not because of the glass. So we can insist that the object (even the setup) is not fragile in the relevant sense.

