  ### Counterexample: The Rigged Jar

  Consider a sturdy glass jar made of tempered glass, which is intrinsically non-brittle and designed to withstand moderate impacts. Attached internally is a simple mechanical trigger connected to a small, non-explosive chemical agent (e.g., a pressurized vinegar-baking soda mix in a sealed pouch). The trigger is calibrated so that any strike forceful enough to be a typical "test" for fragility (e.g., a light hammer tap) releases the agent, causing rapid corrosion that weakens the glass locally, leading it to break within seconds. Crucially, the glass itself lacks any brittle microstructure—it would not break from the strike alone, as verified when the mechanism is disabled. The breaking is "normal" (shattering into pieces), and the setup uses household items (jars, baking soda, vinegar, simple levers) an engineering club could assemble. Here, the jar is not fragile: no hidden brittleness exists, and nothing is masked (the corrosion directly causes failure). Yet the conditional holds: if struck, it would break via the triggered corrosion.

  **Simple Conditional Analysis (SCA)** says: *x* is fragile iff if *x* were struck, *x* would break. Here, the conditional is true (strike → break via corrosion), so SCA deems the jar fragile. **The usual fix** (e.g., Choi/Martin-style) requires *x* to have an *intrinsic basis* (e.g., brittle structure) that *would persist through the stimulus* and cause breaking. This jar has no such basis—its toughness is intrinsic, and the corrosion mechanism is extrinsic (added rigging). The fix thus correctly denies fragility, as no intrinsic fragile basis is retained (the glass remains tough; the trigger is activated and spent).

  **Key feature**: The breaking depends on an *extrinsic, triggered mechanism* that bypasses the object’s intrinsic properties. Delete this (e.g., remove the chemical agent), and the jar survives strikes, falsifying the conditional and dissolving the problem. **SCA-defender wriggle-out**: They might argue the *entire rigged system* counts as the "object," so the trigger is intrinsic. Rebuttal: Fragility is a property of the *glass material*, not the added contraption; even if "object" is broadened, the mechanism is not a *fragility basis* (it causes breakage via corrosion, not brittle fracture). **Usual-fix-defender wriggle-out**: They might claim the glass *develops* brittleness via corrosion, making it intrinsic. Rebuttal: The initial non-brittleness is key; corrosion is a *new damage process*, not a pre-existing basis retained through the stimulus.

  *Constraints satisfied*; no bending. The case isolates overgeneration via extrinsic triggering, distinct from finks (no disposition removed) or masks (no blockage).  

  ---  
  **Philosophical note**: This mirrors "mimic" cases (e.g., Johnston’s electro-fragile vase), but adapted to household realism. It forces SCA to misclassify non-fragile objects due to irrelevant causal pathways.
