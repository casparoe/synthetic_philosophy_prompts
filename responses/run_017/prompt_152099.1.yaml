  And it's not a fink or mask: there's no fragility being removed (the jar isn't fragile to begin with) and nothing is blocking the break (the bomb causes it). So it's a new kind of case.

  Therefore, the case:

  **Scenario**: A sturdy glass jar (made of toughened glass that is not brittle) is connected to a lever and a small internal explosive charge. The lever is positioned so that when the jar is struck with a typical force, it pulls a wire that detonates the charge, breaking the jar. The glass itself would not break from the strike alone.

  **Analysis**:
  - SCA: "If struck, it would break" is true (because of the mechanism), so SCA says it is fragile. But intuitively, it is not fragile (the glass is tough and breaks only because of the bomb).
  - Usual fix (with intrinsic basis and retention): The object (the entire setup) lacks an intrinsic basis for fragility (like brittleness) that is retained through the strike. The explosive basis is not retained (it explodes). Therefore, the usual fix correctly says it is not disposed to break when struck (i.e., not fragile).

  **Key feature**: The breaking is caused by an auxiliary mechanism that is triggered by the stimulus, not by the object's intrinsic properties that would constitute fragility. Without the mechanism (or if it were disabled), the object would not break when struck.

  **Wriggling out for SCA defender**: They might argue that the object we are considering should be the jar alone, but then the conditional is false. Or they might say that the entire setup is disposed to break when struck, so it is fragile in a broad sense. However, this broad sense is not the same as the ordinary notion of fragility (which is about material brittleness). We can insist that the setup is not fragile because it does not break due to its material properties. The SCA defender might also challenge the intrinsic/extrinsic distinction or the notion of retention in the fix.

  This case is similar to what is sometimes called an "antidote" or "mimic" case, but note that it is not a mask because there is no blocking of a pre-existing disposition (since there was none). It is a case of a non-fragile object that breaks when struck due to an added mechanism.

  I think this satisfies all constraints. If there is a bend, it might be that the explosive is not a household item, but an engineering club could rig it with firecrackers or a small detonator. So I think it's acceptable.
