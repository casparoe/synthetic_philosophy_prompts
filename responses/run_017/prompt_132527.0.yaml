  ## The Epistemic Mandate: Defending Delegated Authority in Advance Directives

  Your position—that the authority of an advance directive stems not from identity or temporal autonomy, but from a *delegation* of decision-making power based on epistemic fitness—is defensible and avoids the pitfalls of standard accounts. Let’s call this the **Epistemic Mandate View (EMV)**. On EMV, the earlier self acts as a trustee, appointed not by metaphysical continuity but by her superior capacity to evaluate the relevant facts about future well-being, values, and tolerable states. This mandate lapses if the trustee was fundamentally mistaken about the core facts she was tasked to assess. Let's test it against your cases.

  **The Hard Case: Content in Dementia**  
  Your healthy woman directs: "No life-prolonging treatment if I have severe dementia." Now, severely demented, she hums along to music, smiles, and shows no distress or desire to die. EMV’s implication is stark: her directive *loses significant force*. This isn’t a bug—it’s the core feature. The earlier self was delegated to judge whether life *in that specific state* would be intolerable or contrary to her enduring values. Her directive implicitly predicted profound suffering, indignity, or a loss of self she’d reject. But the later self’s contentment reveals a critical factual error: the state *is* tolerable *for her*. The delegate failed on the very epistemic grounds justifying her authority. We don’t override her *because* we prioritize well-being; we override her *because she was wrong about the facts central to her mandate*. The delegation was conditional on accurate prediction; the condition failed. Honoring the directive now would not respect her past judgment—it would enshrine her past *miscalculation*.

  **Objection 1: Collapse into Best Interests?**  
  Does this reduce to best interests with extra steps? No. EMV retains the *procedural* primacy of the patient’s own prior authorization. The earlier self isn’t just offering evidence *about* interests; she is the *appointed decider*. We start by asking, "Who did *she* authorize?" not "What's best?" Crucially, the delegate’s authority *depends on her epistemic position relative to the decision-task*. The directive *frames the question*: "Is life in severe dementia, as I envisage it, worth living?" If her vision was accurate, the directive binds *even if* we (or the later self) might subjectively weigh interests differently. EMV only overrides the directive when the delegate’s factual premises—the reality of the state she anticipated—prove false. This isn’t collapsing into best interests; it’s enforcing the *terms of the delegation*. The earlier self drops out only if she demonstrably misjudged the very phenomenon she was uniquely tasked to evaluate. Her role isn’t erased; her specific error voids the *current application* of her mandate.

  **Objection 2: Why Does Being Well-Informed Grant Authority?**  
  If psychological continuity is weak (as in dementia), why should the earlier self’s knowledge grant authority over the later self’s body? Because the delegation is justified by *functional capacity*, not identity. The later self, by hypothesis (severe dementia), lacks the cognitive capacity to evaluate complex, future-oriented questions about her own existence, values, and trade-offs. *Someone* must decide. EMV argues the earlier self is the *least bad* delegate: she knows the patient’s values, fears, and conception of a good life better than any stranger (doctor, court), and she bears the consequences (unlike a family member potentially conflicted). Her being "well-informed" isn’t an arbitrary source of authority; it’s the *qualification* making her the best available trustee for *this specific person* in the absence of current capacity. It’s analogous to why we let a patient choose their own surgeon: knowledge + intimate stake = superior decisional fitness for *that* person.

  **Objection 3: Non-Epistemic Directives**  
  What about directives based on dignity, sacredness, or legacy—claims seemingly independent of predicted subjective states? "Even if I’m happy, don’t let me live like that; it degrades what I stand for." EMV *can* accommodate this. The "facts" the delegate is tasked with aren’t limited to empirical predictions of suffering. They include *interpretive* facts about what constitutes dignity, violation, or a fitting narrative *for her life as she conceived it*. The earlier self is still the best-placed delegate to make *these* judgments about meaning and symbolic integrity. Her directive isn’t mistaken "about the facts" if it correctly identifies a state *she* defines as inherently undignified, *regardless* of hedonic adaptation. The core epistemic task here is understanding *her own value system and its implications*. If she defines "being kept alive with dementia" as inherently demeaning *by her own lights*, that’s a factual claim *about her values* she is uniquely qualified to make. The "epistemic condition" governs because the question remains: "Did she correctly apprehend and apply *her own* constitutive values to this scenario?" If she did, the mandate holds, even if the later self is content. EMV doesn’t require directives to be *only* about suffering; it requires the delegate to be authoritative *on the grounds she invoked*.

  **The Social Wrinkle: Performance & Pressure**  
  EMV readily discounts directives shaped by social performance ("look brave") or family guilt ("spare them burden"). Why? Because the delegate’s authority rests on her *authentic assessment* of the relevant facts/values. Pressure distorts that assessment. The directive isn’t testimony about her true judgment; it’s corrupted data. We look for signs the author was functioning as a reliable trustee (e.g., private conversations, consistency, understanding free from coercion), not merely producing a document. EMV treats the directive as *evidence* of the delegate’s intended mandate, but critically evaluates that evidence for authenticity, just as we’d scrutinize any fiduciary’s decision for conflicts.

  **The Lynchpin Premise**  
  The single premise I’d least like to surrender is: **Severe cognitive impairment inherently undermines the capacity to reliably evaluate the tolerability and meaning of one’s *own* impaired state for complex, value-laden decisions.** Without this, the need for delegation vanishes, and EMV collapses. This premise grounds the entire epistemic asymmetry justifying the earlier self’s mandate as trustee. If the later self *could* competently assess her situation and express values, delegation would be unnecessary—her current wishes would hold sway. It’s the profound disruption of evaluative capacity that creates the void the earlier self is best positioned to fill, provisionally and conditionally. This is the bedrock of the Epistemic Mandate View.
