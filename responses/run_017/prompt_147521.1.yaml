prompt: |-
  I work as a software engineer (ML infrastructure) with no formal background in philosophy or political theory, and I started reading about direct democracy after a friend in Zurich described a federal vote whose result struck her as incoherent. Since then I keep noticing what looks like the same shape in California ballot propositions, and I'd like to know whether it is a recognized phenomenon with a literature behind it.

  Here is the pattern as I see it. Voters are asked a series of separate yes/no questions, each about a narrow policy, and each one produces a genuine majority. But the combination of the winners is a package that no majority ever chose — and in the strong version, a package a majority would reject outright if it were put to them as a single proposal. I did the arithmetic on the boring version: if three measures each carry with a bare majority, inclusion–exclusion only forces the intersection of the three winning coalitions to have about 100 − 3×49 members, which is to say it can be empty, so the resulting policy bundle can have literally zero supporters even though every step was majoritarian. The examples that made it click for me were the well-known California property-tax initiative of the late 1970s sitting alongside later measures that mandate funding levels for particular services, and Swiss federal votes where revenue-cutting and spending-creating measures pass within a few years of each other. In the milder version the winning combination is jointly satisfiable but is nobody's package: polling suggests most voters wanted A and not B, or B and not A, and yet A and B both pass. What makes these feel like one thing to me is that the trade-off never gets faced by anyone. Each question is decided in isolation, so the conflict is pushed downstream onto a legislature or a budget office, which then has to break a tie between two things it is told are both the will of the people, and gets blamed for betraying that will whichever way it goes.

  I don't just want a label — I want the carving, and I want to know where the edges are, so please don't stop at naming something. Specifically: does it matter whether the conflicting measures are passed at the same election or years apart, by the same electorate or by different ones (a referendum contradicting a legislature, say), or whether the contradiction is logical and immediate versus visible only under an economic forecast that one side disputes? Does it matter that the voters who care intensely about A are a different, smaller group than those who care intensely about B, so that the bundle reflects intensity rather than numbers? Is the downstream blame — the implementing body being accused of ignoring a will of the people that is not well defined — a separate phenomenon with its own name, or part of the same one? And is what I'm describing really one thing, or does it split into (a) a fact about aggregating separate binary choices, (b) a psychological fact about how people reason when a trade-off is decomposed, and (c) a fact about ballot and constitutional design? I've read a little about Condorcet-style cycling, but that seems to need three or more alternatives for the same office and an actual cycle, and I don't think I need either. Someone also pointed me to a paradox — I have the name Anscombe in my head but can't confirm it, possibly from a short 1970s paper about the majority's will being frustrated by its own fulfilment — where a majority of voters ends up in the minority on a majority of issues; that is the closest thing I've found, but my case doesn't require anyone to lose on most issues, only that the package be one nobody chose, so I suspect it's adjacent rather than identical. If it is genuinely unnamed, please say so plainly, tell me which neighboring concepts come closest and why each falls short, and evaluate the two working names I've been using — 'trade-off laundering' for the decomposition of a single trade-off into separately winnable questions, and 'the unbundling problem' for the aggregate result — including whether either is already taken or misleading.
reasoning: |-
  Okay, let me start by unpacking this user's query. They're a software engineer in ML infrastructure with no formal background in philosophy or political theory. They became interested in direct democracy after a friend in Zurich mentioned a federal vote with an incoherent result. Now they're noticing a similar pattern in California ballot propositions. The core issue is that voters decide on separate yes/no questions, each winning by a majority, but the combined outcome is a policy bundle that no majority actually supports. 

  First, I need to recall related concepts in political theory and social choice theory. The user mentioned Condorcet cycles and Anscombe's paradox. Anscombe's paradox (from her 1976 paper) is about a majority being on the losing side of most issues, which is similar but not identical. The user's scenario doesn't require voters to lose on most issues, just that the combined policy lacks unified support. 

  The arithmetic example they gave—three measures each passing with 51% support, but the overlapping supporters could be zero—points to the problem of non-separable preferences. Each vote is isolated, so trade-offs aren't considered. This connects to the literature on logrolling and issue bundling. Brennan and Lomasky's work on expressive voting might be relevant too, since people might vote based on preference intensity without considering practical constraints.

  The user asked several specific questions. They want to know if the timing of the measures matters, whether the contradiction is logical or economic, and how voter intensity factors in. Also, they're concerned about downstream blame on implementing bodies and whether this phenomenon splits into aggregation, psychology, and design aspects.

  For timing, simultaneous elections might make incoherence more apparent, but measures passed years apart could be affected by changing electorates or contexts. Contradictions could be direct (like mandating spending and cutting taxes) or indirect (requiring future adjustments). Voter intensity plays a role because small, motivated groups can pass multiple measures that the majority wouldn't combine, leading to policies catering to intense minorities.

  The downstream blame issue ties into the "will of the people" being ill-defined. Implementing bodies face criticism regardless of their actions, which relates to the concept of democratic accountability deficits. This might be part of the same phenomenon since it stems from the aggregation problem.

  The user's proposed terms—'trade-off laundering' and 'unbundling problem'—need evaluation. 'Trade-off laundering' is vivid but might imply deception, which isn't always present. 'Unbundling problem' is descriptive but could be confused with unrelated economic terms. Suggesting 'disaggregation dilemma' or 'majoritarian incoherence' as alternatives might help.

  I should also mention related concepts like the Ostrogorski paradox and compound majority paradox. Highlighting how this issue intersects with institutional design (like California's Prop 13 and Swiss referendums) will show real-world relevance. The user's background in ML infrastructure might make them appreciate the computational aspects of preference aggregation, so connecting to social choice theory's mathematical underpinnings could be useful.

  Finally, ensuring clarity by avoiding jargon where possible, but still referencing key terms so they can explore further. Emphasizing that this is a recognized problem with literature in political science and economics, addressing each of their sub-questions methodically to cover all bases.
answer: |-
  You've zeroed in on a profound and well-studied flaw in direct democracy mechanisms. What you're describing sits at the intersection of **social choice theory**, **political economy**, and **institutional design**. It's not one single concept, but a constellation of related phenomena arising from the aggregation of separate binary decisions. Here's the carving you requested:

  ### Core Concepts & Why Existing Labels Fall Short
  1.  **Compound Majority Paradox / Ostrogorski's Paradox (Adjacent but Not Identical):**
      *   **What it is:** Named after Russian political scientist Moisey Ostrogorski (and explored by Elizabeth Anscombe in her 1976 paper "On Frustration of the Majority by Fulfilment") this paradox occurs when a majority of voters are on the *losing* side of a majority of *issues* in a multi-question vote.
      *   **Why it's adjacent:** It highlights how issue-by-issue voting can lead to outcomes disliked by most voters *collectively*, even if each issue passes with a majority. Your observation is broader: it's about the *incoherence of the resulting bundle*, regardless of whether a majority loses on most issues. Your "strong version" (zero supporters) isn't guaranteed by Ostrogorski, though it can occur within it. Your "milder version" (bundle is satisfiable but nobody's preference) is the core overlap.
      *   **Falls Short:** Doesn't explicitly capture the *logical/economic impossibility* of the combined outcome (your strong version) or the *downstream implementation conflict*.

  2.  **Non-Separability of Preferences & Logrolling:**
      *   **What it is:** Voters often don't have preferences on issues in isolation; they care about *combinations*. "Logrolling" occurs when groups trade votes on issues they care little about to win on issues they care intensely about, often leading to inefficient or contradictory outcomes.
      *   **Why it's adjacent:** Your scenario arises *because* preferences aren't separable. Voters don't get to express trade-offs. The ballot forces separability. Logrolling is a strategic response *within* representative bodies to non-separable preferences; direct democracy often removes the mechanism for explicit bargaining, pushing the incoherence downstream.
      *   **Falls Short:** Focuses on strategic behavior in representative settings, not the inherent incoherence arising from isolated binary votes in direct democracy.

  3.  **The Problem of Issue Bundling/Unbundling:**
      *   **What it is:** A core debate in democratic theory and ballot design is whether complex policy choices *should* be broken down ("unbundled") into separate votes or presented as coherent packages ("bundled"). Unbundling allows voters to express preferences on specific elements but risks precisely the incoherence you observe. Bundling forces trade-offs but may force voters to accept or reject large, complex packages.
      *   **Why it's core:** This is the institutional design aspect you identified (your point 'c'). Your "trade-off laundering" directly relates to the *consequences* of unbundling.
      *   **Falls Short:** "The unbundling problem" is descriptive of the *cause* but doesn't name the specific *effect* (incoherent bundle, downstream conflict).

  4.  **Majoritarian Incoherence / Inconsistent Mandates:**
      *   **What it is:** A broader term describing the phenomenon where majoritarian processes produce contradictory instructions or outcomes that cannot be simultaneously satisfied. This can occur across elections, between branches, or within a single ballot.
      *   **Why it's core:** This captures the essence of the *policy outcome* – the bundle is incoherent ("inconsistent mandate"). It encompasses both your strong (impossible) and mild (undesired) versions.
      *   **Falls Short:** It's a broad category; your specific mechanism (isolated binary votes) is one *cause* of majoritarian incoherence.

  ### Addressing Your Specific Questions
  *   **Timing & Electorate:** It *does* matter, but the core phenomenon can occur in all scenarios.
      *   *Same Election/Same Electorate:* Highlights the pure aggregation problem due to non-separable preferences. The contradiction is most stark (e.g., Prop 13 + spending mandates passed concurrently or within a short period by largely the same people). This is the clearest case of the "unbundling problem."
      *   *Different Elections/Different Electorates:* Adds layers of shifting preferences, new information, demographic changes, or mobilization of different groups. While the contradiction exists, it can be argued (often contentiously) that "the people changed their mind." The downstream conflict remains severe ("You ignored our mandate from 2010!" vs. "But we mandated this in 2020!").
      *   *Referendum vs. Legislature:* This is classic "inconsistent mandate" territory. The conflict is explicit and structural, pitting two different expressions of democratic will against each other. Blame assignment is central here.
  *   **Nature of Contradiction:**
      *   *Logical/Immediate:* (e.g., "Cut taxes to X" + "Fund service Y at level Z" where X<Z is mathematically impossible). This is the strongest form, undeniable and requiring immediate legislative override or court intervention. Blame is intense.
      *   *Economic Forecast/Disputed:* (e.g., Tax Cut A + Spending Program B, where mainstream economics suggests deficits/service cuts elsewhere, but proponents argue "growth will cover it"). This is the most common and politically fraught. The contradiction manifests over time, allowing blame to shift ("The legislature misspent!" vs. "The forecast was wrong!"). This relies heavily on voter cognitive limitations and the difficulty of forecasting. Downstream bodies get stuck managing the fallout.
  *   **Intensity vs. Numbers:** This is **crucial** and explains *why* it happens.
      *   Small, highly motivated groups (e.g., public sector unions for spending, anti-tax groups for cuts) can effectively campaign *for their single issue*, mobilizing their base and swaying enough low-intensity voters ("Who doesn't want lower taxes?" / "Who doesn't want better schools?").
      *   The *majority* of voters may have moderate, trade-off-aware preferences (e.g., "Some taxes for essential services") but lack the intensity or single-issue focus to win any specific vote against the intense minorities. The resulting bundle reflects the *sum of intense minority preferences*, not a coherent majority preference. This links to Mancur Olson's logic of collective action.
  *   **Downstream Blame:** This is **an inherent and inseparable part of the phenomenon**, not separate. It results directly from the **ill-defined "will of the people."** The implementing body (legislature, executive, agency) faces an impossible task: reconcile logically or economically incompatible mandates. Whichever choice they make will violate *some* direct democratic instruction. They become the scapegoat for the inherent contradiction. This is often called a problem of **"accountability"** or **"responsibility vacuums"** in complex governance systems with multiple veto points and mandates.
  *   **Is it One Thing or Three?** It's **one core phenomenon (policy incoherence from aggregated separate votes)** viewed through three essential lenses:
      *   *(a) Aggregation:* The mathematical/formal mechanism (your arithmetic, Condorcet/Anscombe adjacent logic).
      *   *(b) Psychology:* How voters reason (or fail to) about trade-offs when issues are decomposed, intensity effects, cognitive limitations.
      *   *(c) Design:* The institutional choice to unbundle issues onto the ballot and the constitutional rules enabling it (e.g., California/Swiss initiative processes).
      You cannot fully understand or address the phenomenon without considering all three.

  ### Evaluating Your Proposed Names
  1.  **'Trade-off Laundering':**
      *   **Strengths:** Vivid, evocative. Perfectly captures the *deception* inherent in hiding trade-offs by splitting them into separate, easier-to-pass votes. Highlights the *process* flaw.
      *   **Weaknesses:** "Laundering" implies deliberate deception. While campaigns often exploit this structure, the ballot design itself creates the *opportunity*, even without malicious intent. Might be slightly too "accusatory" as a neutral technical term. **Not widely used** in academic literature (a quick search shows it pops up occasionally in commentary).
      *   **Verdict:** Excellent descriptive term, especially for public discourse. Less ideal as a purely technical label due to its slightly normative tone.

  2.  **'The Unbundling Problem':**
      *   **Strengths:** Technically accurate regarding the root cause (institutional design choice). Neutral and descriptive.
      *   **Weaknesses:** Too generic. "Unbundling" is a common term in many fields (economics, tech, finance). Doesn't directly convey the *consequence* (incoherence, conflict). Might not immediately signal the severity of the downstream issues.
      *   **Verdict:** Technically correct but potentially too broad and bland. Needs qualification ("the policy incoherence problem from ballot unbundling").

  ### Recommendation & Synthesis
  *   **Is it unnamed?** Yes, as a *single, universally accepted* term capturing *all* aspects you describe. Scholars refer to facets of it using the terms above.
  *   **Best Fit Existing Concept:** **Majoritarian Incoherence arising from Non-Separable Preferences via Ballot Unbundling (or the Initiative Process).** Specifically highlighting **inconsistent mandates** or the **compound majority problem** gets close to the outcome.
  *   **Best Descriptive Phrase:** **"The Unbundled Mandate Problem"** (capturing the cause *and* the flawed outcome).
  *   **Your Names:** Both are useful:
      *   **'Trade-off Laundering'** is superb for describing the *strategic exploitation* or inherent *psychological effect* of the process. Use it.
      *   **'The Unbundling Problem'** is accurate for the *institutional design* root cause. Use it, perhaps slightly qualified ("the policy incoherence problem of ballot unbundling").
  *   **Truly New Term Suggestion:** **"The Disaggregation Dilemma"** (highlights the forced separation of inseparable choices and the resulting impossible situation). Or **"Majoritarian Policy Incoherence."**

  ### Key Literature/Concepts to Explore
  *   **Elizabeth Anscombe:** "On Frustration of the Majority by Fulfilment" (1976) - The paper you recalled.
  *   **Social Choice Theory:** Kenneth Arrow (Impossibility Theorem - shows aggregation is hard), William Riker (liberalism vs populism), Duncan Black (median voter theorem - when it *does* work).
  *   **Direct Democracy & Ballot Design:** Thomas Cronin (*Direct Democracy: The Politics Of Initiative, Referendum, And Recall*), David Magleby, John Matsusaka. Search for work on "ballot proposition bundling/unbundling."
  *   **Intensity & Logrolling:** Gordon Tullock, James M. Buchanan (*The Calculus of Consent*).
  *   **California/Swiss Specific:** Bruce Cain, Mark Baldassare (CA); Wolf Linder, Bruno S. Frey (Swiss democracy). Look for analyses of Prop 13's legacy and Swiss "voter fatigue" or "contradictory votes."
  *   **Psychology of Voting:** Bryan Caplan (*The Myth of the Rational Voter*), George Akerlof & Robert Shiller (*Phishing for Phools*) - on cognitive biases affecting disconnected votes.

  You've identified a fundamental tension in modern direct democracy. The desire for granular citizen control conflicts with the reality that complex governance requires coherent, mutually consistent policies. The mathematical limits of aggregation, combined with human psychology and strategic political action, mean that unbundled votes often produce bundles no one desires, leaving downstream actors to clean up the mess and bear the blame. The terms "trade-off laundering" and "unbundling problem" effectively capture critical dimensions of this enduring challenge.
