prompt: |-
  I am a retired experimental physical chemist — four decades of gravimetric and spectroscopic work, most of it spent on the tedious business of getting a number you can trust out of an instrument — and for the last two years I have been attending a philosophy reading group at the local university. We have recently worked through Quine's attack on the distinction between analytic and synthetic truths. I follow the argument, or think I do, but it does not seem to me to describe a kind of principle that I met with constantly in the laboratory, and I have rashly agreed to give the group a twenty-minute talk in the spring. So I would like to know whether what I have in mind already has a settled name and a settled analysis, or whether I would be inventing a category on the spot.

  The principles I mean have a peculiar double character. First, no experiment performed inside the practice could have refuted them, because every such experiment deploys them. The constancy of atomic weights is my stock example: the whole business of inferring a composition from a weighing presupposes that chlorine, say, has the same atomic weight whatever its source, so no measurement internal to analytical chemistry could have told against it — you would have had to use it in order to test it. Second, they are nevertheless not definitions and not conventions. Their denials are perfectly intelligible, the successor practice that rejects them is coherent, and when they go we take ourselves to have abandoned something substantive about the world rather than to have agreed to speak differently or to adopt a new scale of units; the discovery of isotopes was not a linguistic decision. Third, and this is the feature I find hardest to place, they are not held in place by decision either. Nobody at the time could have stipulated otherwise, because the principle is not written down in the theory so much as built into the instruments, the data-reduction routines, the error analysis, and what a graduate student is taught to see when she looks at a chart. I would say the same of the assumption that a reading is a property of the sample and not of the measuring arrangement — that the value you record belongs to the thing measured and does not depend on what else you chose to measure alongside it. I am told that quantum mechanics is very widely read as denying precisely that, which would make it a second instance, and the additivity of weights in gravimetric work a third. Fourth: when such a principle fails, the failure is discovered from within the very practice it makes possible, using apparatus that itself presupposes it — the variability of atomic weights was found with instruments whose calibration assumed them constant.

  So: is there an established concept, or a literature, for this configuration — untestable from inside yet substantive, not held by convention, not held by fiat, and found to fail from within — and if so, what belongs to it and what does not? I am not asking for references, which I can chase myself; I want the carving. Specifically: which of my four features is load-bearing and which are incidental; whether the historical replacement of such a principle is genuinely different from its having been refuted; and how the configuration relates to the near neighbours a non-specialist keeps blundering into — to the Quinean claim that nothing is immune to revision, which seems to me to be about a different axis altogether, since immunity is not what I am pointing at; to the idea that a framework carries principles that are constitutive of it, or a priori only relative to it; to a paradigm in Kuhn's sense or to the protected core of a research programme, both of which are held in place by a communal decision where my principles appear to be held in place by the plumbing; and to the thought that some propositions simply stand fast for us without resting on evidence at all. If the fit with each of these is imperfect, I would rather be told exactly where it fails than be handed a label. And if there is no established term, I would be grateful for a coined one, with a definition and a boundary case or two — for instance, the case where a practice's own improving accuracy eventually violates the principle outright, which is the case where I am least confident that my description still applies.
reasoning: |-
  Okay, let me tackle this query from a retired chemist turned philosophy enthusiast. The user describes principles that are foundational to experimental practice yet not analytic or conventional. They list four key features: (1) untestable within the practice because they're presupposed, (2) substantive rather than definitional, (3) embedded in material practices rather than by decision, and (4) discoverable as failures from within the same practice. 

  First, I need to map these features against philosophical concepts. Quine's web of belief comes to mind, but his holism treats all statements as revisable without distinguishing these deeply embedded principles. Kuhn's paradigms involve communal commitments, but the user emphasizes material embedding ("the plumbing") over social consensus. Friedman's constitutive a priori captures the framework-setting function but leans toward formal principles rather than material practices.

  The crux seems to be the material instantiation - these principles live in the instruments, routines, and trained perceptions. When atomic weights proved variable, it wasn't a convention changing but the material world resisting. This bridges epistemology and ontology in a way that pure philosophy often misses. 

  For boundary cases: When improved accuracy violates a principle (like Newtonian physics failing at relativistic speeds), it fits if the violation emerges from internal refinement rather than external critique. But if it's just statistical error shrinking, that's different - the principle isn't failing, measurement is sharpening.

  The coinage "material constitutive principles" might work, stressing their embeddedness in practice. Contrast with Cartesian doubt: we can't suspend these principles because they're in the lab equipment itself. The graduate student isn't taught them; she embodies them through pipettes and spectrometers.

  Key distinctions: Unlike Popper's falsifiable claims, these can't be directly tested. Unlike Lakatos' core theories, they're not protected by choice but by practical necessity. Their failure feels like discovering gravity rather than changing units.
answer: |-
  Your description captures a profound and under-theorized category of scientific principles—one that resists easy classification in standard philosophical frameworks. I'll address your core question first, then analyze its features, boundaries, and neighbors.

  ### The Core Concept: "Material Constitutive Principles" (Proposed Coinage)  
  **Definition**: *Principles that are materially instantiated in the instruments, routines, and embodied skills of a scientific practice. They enable empirical inquiry within that practice but are themselves shielded from direct test by their constitutive role. Their substantive content is revealed only when they fail, and such failure is detected through internal tensions generated by the very practice they constitute.*  

  **Boundary Cases**:  
  1. **Atomic weight constancy**: Fits perfectly. Its failure (via isotopes) was detected using gravimetric methods that presupposed it, revealing it as a substantive claim about nature.  
  2. **Value independence of measurements**: Fits. Quantum entanglement violates it, but this was discovered through quantum experiments themselves.  
  3. **Additivity of weights**: Fits as long as relativistic effects are negligible.  
  4. **Non-fit Case**: *Newtonian absolute time*. Its failure (via relativity) was detected through *external* inconsistencies (e.g., Maxwell's equations), not tensions within Newtonian practice itself.  

  ---

  ### Analysis of Your Four Features  
  | Feature | Load-Bearing? | Why |  
  |---------|---------------|-----|  
  | **1. Untestable internally** | Essential | Defines their *constitutive* role: they create the space for testing other claims. |  
  | **2. Substantive, not conventional** | Essential | Distinguishes them from tautologies (analytic) or units/conventions. Their denial implies world-structure change. |  
  | **3. Embedded in material practice** | Essential | Differentiates from Kuhn's paradigms/Lakatos' cores (socially protected) and Friedman's constitutive a priori (conceptually formal). Your principles are in the *plumbing*. |  
  | **4. Failure discovered internally** | Essential | Shows they are *world-involving*: breakdowns expose their empirical traction. |  

  **Historical Replacement vs. Refutation**:  
  When such a principle fails (e.g., atomic weight constancy), it *is* refuted—but the refutation is **retrospective**. The practice initially treats it as an unrevisable condition, but accumulating anomalies (e.g., non-stoichiometric compounds) force its re-interpretation as a substantive claim that was *false*. This is distinct from convention-change (e.g., switching from phlogiston to oxygen), which involves redefining concepts.  

  ---

  ### Relations to Neighboring Concepts  
  | Concept | Where the Fit Fails |  
  |---------|---------------------|  
  | **Quinean revisability** | Quine rejects *any* immunity. Your principles *are* temporarily immune within their practice—not by dogma, but by material necessity. Quinean revision is global; yours is local and practice-immanent. |  
  | **Kuhnian paradigms / Lakatosian cores** | Both are protected by *socio-rational decisions*. Your principles are protected by *material entanglement*: you couldn't stipulate atomic weight variability while using 19th-c. balances. |  
  | **Friedman's constitutive a priori** | Close! But Friedman's principles (e.g., Euclidean geometry in Newtonian physics) are *formal frameworks*. Yours are *materially instantiated* (e.g., built into a balance's calibration). |  
  | **Wittgensteinian "hinge" propositions** | Hinges are arational bedrock (e.g., "the Earth exists"). Your principles are *empirically responsive*: they generate tension when the world resists (e.g., non-additive weights in relativity). |  

  ---

  ### Refining the Concept: Boundary Challenges  
  **Case: Improving accuracy violates the principle** (e.g., Newtonian mechanics failing at high velocities).  
  - *If the violation emerges from internal refinement* (e.g., Mercury's orbit undermining Newtonian gravity), it fits: the practice's own precision exposes the principle's empirical fragility.  
  - *If it requires importing external frameworks* (e.g., relativity to explain gravity), it doesn't fit.  

  **What Holds Them in Place?**  
  Not convention, not decision, but **practical necessity**: the principle is *operationalized* in hardware/software/skills. To reject it pre-failure, you'd need an alternative practice already in place (e.g., mass spectrometry to challenge atomic weights).  

  ---

  ### Why This Matters  
  You've identified a blind spot in philosophy of science: principles that are:  
  - **Epistemically constitutive** (enable testing),  
  - **Ontologically substantive** (describe the world),  
  - **Materially embodied** (in the lab's "plumbing").  

  They are *not* mere conventions, yet their empirical content emerges only in collapse. This bridges the analytic/realist divide: they function like conventions *until* their failure reveals their latent empiricality.  

  For your talk: Frame this as a challenge to Quine. He collapsed analytic/synthetic but overlooked how *material practices* create local, provisional necessities that are neither. The lab shows that some truths are *made real* by instrumentation—until the world breaks them.  

  If you develop this further, I suggest engaging with:  
  - Hacking (*Representing and Intervening*) on experimental realism,  
  - Pickering (*The Mangle of Practice*) on material agency,  
  - Rouse on practice-based epistemology.  

  Would you like a draft outline for your 20-minute presentation?
