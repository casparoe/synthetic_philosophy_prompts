answer: |-
  Here’s a 90-minute experiential training session designed to surface your three core concerns without naming them upfront. The activity uses role-play, structured choices, and physical artifacts (index cards) to make invisible influences tangible.

  **Session Title:** *The Unspoken Terrain of Consent*  
  **Goal:** Explore how consent can be compromised even when information, competence, and voluntariness appear intact.  

  ---

  ### **Setup (10 min)**  
  1. **Room Arrangement:**  
     - Push tables aside. Arrange chairs in a circle. Place whiteboard visible to all.  
     - Distribute 5 blank index cards + 1 pen per participant.  

  2. **Framing (Avoiding Buzzwords):**  
     > *"Today, we’re simulating how choices unfold in real time. We’ll rotate roles: some as ‘Team A’ (research staff), others as ‘Participant B’ (potential study enrollee). Your goal: reach agreement on a mock study. No right/wrong answers—observe what happens."*  

  ---

  ### **Activity: "The Wellness Study" (60 min)**  
  *Fictional Study:* A 6-month "Wellness & Cognition" study involving weekly clinic visits, diet journals, and optional brain scans.  

  #### **Round 1: Authored Option Set (20 min)**  
  - **Roles:**  
    - 4x **Team A (Researchers):** Design the study’s "default options."  
    - 12x **Participant B (Enrollees):** Decide whether to join.  
  - **Rules:**  
    - *Team A* has 5 min to design **one** consent option on the whiteboard (e.g., *"Option 1: Full study (scans + journals)"*).  
    - *Participant B* writes **"Join"** or **"Pass"** on a card. No discussion.  
  - **Catch:** Team A *only* presents Option 1. They imply it’s the "standard" path. No alternatives mentioned.  
  - **Debrief Prep:** Collect "Join/Pass" cards.  

  #### **Round 2: Sequencing (20 min)**  
  - **Rotate Roles:** Switch 4 new people to Team A.  
  - **Rules:**  
    - Team A must now "negotiate" consent in **4 steps** (1 card/step):  
      - Step 1: *"Can we discuss the study today?"* → Sign card 1 if "Yes."  
      - Step 2: *"Will you review materials?"* → Sign card 2 if "Yes."  
      - Step 3: *"Will you complete a short screening?"* → Sign card 3 if "Yes."  
      - Step 4: *"Ready to enroll?"* → Sign card 4 if "Yes."  
    - Participants B can refuse any step but must write **why** on the card if they do.  
  - **Catch:** Team A is told to "maximize enrollment."  

  #### **Round 3: Temporal (20 min)**  
  - **Roles:**  
    - All Participant Bs are now "patients."  
    - 4x Team A remains (new volunteers).  
  - **Rules:**  
    - **Phase 1 (0 min):** Team A explains the study. Participants B write **initial decision** on a card.  
    - **Phase 2 (5 min later):** Facilitator hands Participants B a **new card** with *"Your memory symptoms worsened. Reconsider your choice."*  
    - Participants B write **revised decision** + **one word** describing their feeling.  
  - **Catch:** Team A *must* accept both decisions as valid.  

  ---

  ### **Debrief (20 min)**  
  **Step 1: Artifact Sharing**  
  - Pin all cards to the whiteboard. Ask:  
    > *"What patterns do you see? Where did you feel uneasy—even if everything was ‘technically’ correct?"*  

  **Step 2: Mapping to Your Three Concerns**  
  | **Round** | **Facilitator Prompt** | **When Skepticism Arises** |  
  |-----------|------------------------|---------------------------|  
  | Round 1 (Authored Options) | *"Did Participant Bs feel limited in choices? What wasn’t said?"* | If resisted: *"How many asked about alternatives? Why not?"* |  
  | Round 2 (Sequencing) | *"Did signing early cards make later refusals harder? Why?"* | If resisted: *"Did anyone sign Step 4 just because they’d already done 1-3?"* |  
  | Round 3 (Temporal) | *"Were both decisions valid? Which one ‘counts’?"* | If resisted: *"If the patient changes their mind post-consent, what is our duty?"* |  

  **Step 3: Closing**  
  > *"Consent isn’t a checkbox—it’s a landscape. We control the map: what options are visible, the order of the path, and whether we honor changes over time. Our power isn’t just in getting a ‘yes’—it’s in designing a process that leaves dignity intact."*  

  ---

  ### **Design Against Manipulation Risk**  
  - **Mitigations:**  
    - Debrief focuses on **discomfort**, not tactics.  
    - Use phrases like *"How did power shape this?"* not *"How did you persuade?"*  
    - Emphasize Participant B’s emotions in Round 3 ("one word" cards).  
  - **Unavoidable Risk:**  
    - Sequencing Round *could* teach coercion tactics. **Counteract** by highlighting victim perspectives in debrief: *"Did anyone feel railroaded?"*  

  ---

  ### **What This Cannot Do**  
  1. **Replicate Vulnerability:**  
     - Illness, fear, and dependency won’t be felt. **Your role:** Share your mother’s story *after* the debrief to humanize temporal capacity shifts.  
  2. **Simulate True Asymmetry:**  
     - Participants know roles aren’t real. **Mitigate:** Use the "one word" feelings in Round 3 to surface unease.  
  3. **Prevent Gaming/Overacting:**  
     - Predictable issues:  
       - *"Gamers"* mocking the exercise → Redirect: *"Even if this feels artificial, these dynamics occur daily."*  
       - *"Overplayed" patient roles* → Note: *"Real patients rarely ‘perform’ distress—they live it."*  
       - *Time overruns* → Cut Rounds rigidly. Prioritize debrief.  

  ---

  ### **Materials & Timeline**  
  - **00:00-00:10:** Setup + Framing  
  - **00:10-00:30:** Round 1 (Authored Options)  
  - **00:30-00:50:** Round 2 (Sequencing)  
  - **00:50-01:10:** Round 3 (Temporal)  
  - **01:10-01:30:** Debrief  
  - **Supplies:** Index cards (80+), pens (16), whiteboard markers.  

  This design forces staff to *feel* the weight of constructed choices, incremental pressure, and shifting capacity—then names what they’ve experienced. By rotating roles, skeptics confront the residue firsthand. The cards make consent tangible, and your closing words anchor it to lived stakes.
