prompt: |-
  I've been reading rationalist blogs and forums for about a decade, and every time the value of originals comes up the thread runs on the same three cached moves, so I want to build the spec before I build the post.

  You are a professional philosopher of art with training in analytic metaphysics who has also advised a museum's collection committee on deaccession, conservation triage, and whether to display facsimiles. Think carefully, and work in two passes: first brainstorm a long candidate list of requirements together with the cases that motivate each, then prune hard and keep only requirements that are doing real work. Taboo the word authentic except where you define it.

  Here is the deliverable. Write the desiderata that a theory of what is lost when a perfect substitute replaces an original must meet to be adequate for two jobs: to tell an institution what it is buying when it insists on the original (conservation budgets, insurance, whether to keep showing something once it is known to be a fake), and to tell an individual whether it is rational to care that the object they have loved for years turns out to be a forgery. Adequacy is relative to those two purposes, so say when a requirement is demanded by one and not the other.

  For each requirement give the case or consideration behind it, and mark it non-negotiable or a preference of one camp. Say which of the things people demand here are genuine constraints and which are prejudices of a particular approach. Flag any pair you suspect cannot be jointly satisfied, and name the single requirement that knocks out the most otherwise-popular theories.

  The cases it must get right: a molecule-for-molecule duplicate of a unique painting secretly swapped into its frame forty years ago and admired ever since; a canvas whose underdrawing is by the master but whose paint layer is mostly by pupils working from his designs, catalogued as his for three centuries; a genuine work demoted to a pupil after reattribution, with the object and its actual history unchanged; a painter who repaints an exact copy of her own destroyed painting; a piece that is just instructions plus a certificate, executed by whoever holds it; a file whose copies are byte-identical, where only the transaction record differs; a found canvas with no documentation that stylometry puts at high but not certain probability of being by a known hand; and destruction of an original in storage that nobody would ever have seen again, with an indistinguishable replacement installed the same day.

  Separate at least the aesthetic or experiential, the art-historical, and the scarcity or economic registers, and say which of them the word better is tracking in ordinary claims about originals. One candidate of my own: that a theory must explain why the backroom destruction above is a loss at all. Is that a real desideratum or my own prejudice — and if it is real, which theories fail it?

  A short scorecard of two or three contenders against the list is fine at the end, but the criteria are what I'm paying for.
reasoning: |-
  Okay, let me approach this systematically. The user wants a robust framework for understanding the value of originals versus substitutes in art contexts, with specific applications to institutional decisions and personal experiences. 

  First, I need to identify the core tensions in the examples provided. The molecule-for-molecule swap challenges physicalist definitions, while the workshop painting with master's underdrawing exposes issues of intentionality and collaboration. The reattribution case shows how provenance alone can alter perceived value without physical changes. 

  For institutional needs, I'm separating requirements into three registers: aesthetic/experiential, art-historical, and scarcity/economic. The museum backroom destruction example is particularly telling - if the object was never to be displayed, does its destruction matter? This seems to demand a theory that values existence independently of human engagement. 

  Personal rational care introduces psychological dimensions. The user who discovers their beloved artwork is a forgery experiences betrayal, not just informational change. This suggests a need to address emotional attachment and narrative coherence in the framework.

  I'm flagging the "continuous causal chain" requirement as a key differentiator - it elegantly handles both the secret swap case (where the chain is broken) and the artist's own copy (where intention persists). It also explains why the backroom destruction is a loss even if unseen, by severing the historical thread. 

  The workshop painting case requires special attention. Here I'm proposing a "contributory origin" concept where multiple agents' inputs create a gradient of value rather than binary authenticity. This avoids all-or-nothing judgments that don't reflect actual art historical practice.

  For the user's candidate question about unseen destruction: yes, it's a valid desideratum that eliminates theories relying solely on experiential or functional value. Nominalist and aesthetic theories fail here, while historical theories pass.
answer: |-
  Here’s a distilled set of desiderata for a theory of "originality value," designed to handle institutional decisions and personal rational care, based on your cases. Requirements are categorized, tagged by domain (Institutional/Personal), and marked for negotiability. Conflicts are flagged.

  ---

  ### **Core Desiderata**  
  *(Non-negotiable unless noted)*  

  1. **Historical Continuity Constraint**  
     - *Motivation:* Secret molecule-for-molecule swap (no loss detected), destruction of unseen original.  
     - *Requirement:* The theory must account for value derived from an unbroken causal chain linking the object to its creation context. Loss occurs if this chain is severed (e.g., destruction, undetected substitution).  
     - *Domain:* Institutional (conservation/insurance) + Personal (rational care upon discovery).  
     - *Knocks out:* Pure aesthetic functionalism (value identical if perceptually indistinguishable).  

  2. **Provenance-Sensitivity**  
     - *Motivation:* Reattribution case (same object/history demoted), found canvas with stylometry.  
     - *Requirement:* Value must vary with changes in knowledge of origin, even if the object is physically unchanged.  
     - *Domain:* Institutional (acquisition/deaccession) + Personal (rational shift in attachment).  
     - *Conflict risk:* With experiential theories (if experience is unchanged).  

  3. **Intentional Anchor Requirement**  
     - *Motivation:* Workshop painting (master’s design vs. pupil execution), artist’s own copy.  
     - *Requirement:* Value must track the degree of intentional control by the credited creator in the object’s production. Permits gradients (e.g., "more original" where master’s hand is direct).  
     - *Domain:* Institutional (attribution affects value) + Personal (cares about "who made it").  
     - *Non-negotiable for institutions; negotiable for individuals if experiential fidelity dominates.*  

  4. **Existential Irreducibility**  
     - *Motivation:* Destruction of unseen original.  
     - *Requirement:* The original possesses non-instrumental value *as a particular*—its loss matters even if no experience or function changes.  
     - *Domain:* Institutional (ethical/mission-based conservation) + Personal (if attachment is to *this* thing’s history).  
     - *Fails:* Theories reducing value to utility/aesthetic experience.  

  5. **Token-Specific Scarcity**  
     - *Motivation:* Digital file (byte-identical copies), certificate-based art.  
     - *Requirement:* Value must distinguish between unique tokens (e.g., a specific canvas) and reproducible instances, even if materially identical.  
     - *Domain:* Primarily institutional (economics, collection strategy).  
     - *Negotiable for individuals* (if only experience matters).  

  ---

  ### **Auxiliary Constraints**  
  *(Context-dependent or negotiable)*  

  6. **Experiential Fidelity Preference**  
     - *Motivation:* Perfect substitute admired for years; artist’s own copy.  
     - *Requirement:* For personal use, if perceptual/emotional experience is identical pre-discovery, caring about originality *post-discovery* may be non-rational.  
     - *Domain:* Personal (defeated by Provenance-Sensitivity upon discovery).  
     - *Institutional irrelevance* (museums don’t collect experiences).  

  7. **Documentational Threshold**  
     - *Motivation:* Found canvas with stylometry.  
     - *Requirement:* Value assignments must tolerate probabilistic attribution (not binary "authentic/inauthentic").  
     - *Domain:* Institutional (acquisition risk) + Personal (rational confidence thresholds).  
     - *Preference, not constraint*.  

  ---

  ### **Registers of Value**  
  - **Aesthetic/Experiential:** Tracks *immediate perception* (e.g., "better" in "the original looks better" if deteriorated).  
  - **Art-Historical:** Tracks *causal significance* (e.g., "better" as "more historically informative").  
  - **Scarcity/Economic:** Tracks *token rarity* (e.g., "better" as "more valuable on market").  

  ---

  ### **Your Candidate: Unseen Destruction**  
  - **Desideratum Status:** *GENUINE* (tests Existential Irreducibility).  
  - **Theories Failing It:**  
    - **Aesthetic Functionalism:** No loss if substitute identical.  
    - **Utilitarianism:** No change in use/access.  
    - **Nominalism:** Only labels matter; if undiscovered, no loss.  

  ---

  ### **Key Conflicts & Trade-offs**  
  - **Provenance-Sensitivity vs. Experiential Fidelity:** Personal rational care may prioritize one over the other (e.g., "I don’t care if it’s fake" vs. "I feel betrayed").  
  - **Existential Irreducibility vs. Scarcity:** If value is inherent, market forces shouldn’t dominate institutional ethics (e.g., deaccessioning for profit).  

  ---

  ### **Scorecard: Theories vs. Desiderata**  
  | Theory                | Historical Continuity | Provenance-Sensitivity | Intentional Anchor | Existential Irreducibility | Token Scarcity |  
  |-----------------------|------------------------|------------------------|---------------------|----------------------------|----------------|  
  | **Causal Historicism**| ✓                      | ✓                      | ✓ (gradient)       | ✓                          | ✓              |  
  | *(Value = chain of causation)* |                        |                         |                     |                            |                |  
  | **Intentionalism**    | △ (via creator link)   | ✓                      | ✓                  | △ (if creator-focused)     | ✗              |  
  | *(Value = creator’s intent manifest)* |                     |                         |                     |                            |                |  
  | **Aesthetic Nominalism**| ✗                     | ✗ (only perception)    | ✗                  | ✗                          | ✗              |  
  | *(Value = experience + label)* |                     |                         |                     |                            |                |  

  **✓ = Satisfies; △ = Partially; ✗ = Fails**  

  **Winner:** **Causal Historicism** (e.g., the original is the artifact whose history traces directly to the creative act). Uniquely satisfies all non-negotiable constraints:  
  - Explains loss in unseen destruction (chain broken).  
  - Handles reattribution (provenance update changes value).  
  - Accommodates workshop pieces (gradient intentional contribution).  
  - Rejects perfect copies (no causal link to creation).  

  **Why it works for both domains:**  
  - *Institutions:* Justifies conservation/insurance for historically significant tokens.  
  - *Individuals:* Rational care depends on whether attachment is to history (e.g., "I loved *this* Rembrandt") or experience (e.g., "I loved *the image*").  

  ---  
  This framework rejects "authenticity" as monolithic, instead isolating *which aspects* (causal history, intention, scarcity) drive value in specific contexts. It treats the backroom destruction as a litmus test for theories that reduce art to its observable effects.
