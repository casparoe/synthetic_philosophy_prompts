prompt: |-
  I'm a journalist — science and ideas beat — and I'm working on a piece about whether secular societies can actually hold together without religion, the trust question basically. Last month I was at a panel on secularization in Northern Europe where one speaker closed with "there are no atheists in foxholes" and another said secular societies are running on "borrowed religious capital," and the two lines got welded together into the claim that the Nordic high-trust / low-church equilibrium is a fair-weather arrangement: turn up the existential pressure and the trust goes with it. Nobody stopped to say what the foxhole line was even being used to assert, and I don't want to print a piece that inherits that ambiguity. A reader also recieved a letter-to-the-editor from a guy who says the whole thing is settled by the mortality-salience priming literature, which I suspect is not quite right either, but I can't say why.

  So what I'd like is a menu, not a verdict. Lay out the distinct precise theses "there are no atheists in foxholes" could be making, from the near-trivial to the strong: e.g. that self-reported belief or prayer goes up under acute threat; that threat strips away pretence and reveals what people occassionally "really" believed all along; that people *need* religion to cope when things get bad; that religion is doing some indispensable cohesion work and secular trust is what fails under stress; or that real belief just *is* whatever you fall back on under pressure. For each one say whether it's trivial-but-true, plausibly true, genuinely contested, or just false, and — this is the part I care about — which reading would actually have to be true for it to support the "borrowed capital / fair-weather trust" conclusion, and which readings are compatible with secular trust being perfectly robust. I'd also like you to separate out the prior question of what "religion makes people more moral" would even have to mean here: more prosocial toward co-believers or toward strangers, in anonymous or only in observed settings, in averages or in the tails, in behavior or in self-report. Two distinctions I've been using to keep myself honest, feel free to improve on them: *crisis piety* (a blip in professed belief or religious practice under threat) versus *crisis morality* (a change in how people actually treat each other), and *thick trust* (of people who share your commitments) versus *thin trust* (of strangers and institutions). Does the slogan, on any of its readings, give us a reason to expect *thin* trust specifically to drop in a secular society under stress, or does the evidence people cite mostly concern thick trust and self-report?

  Format it as a list of readings with a one-line verdict on each, since my editor wants a sidebar and I'd rather butcher it less. Please don't give me citations or a reading list — I'll chase those down myself. What I do need you to do is flag, reading by reading, what's settled among people who actually study this versus what's contested versus where you're extrapolating past what anyone really knows; if a reading is a live dispute, tell me it's a live dispute rather than smoothing it into the consensus. And at the end, tell me what single piece of evidence would most change your verdict on the strongest reading you identified.
reasoning: |-
  Okay, let me approach this systematically. The journalist is asking for a clear breakdown of the "no atheists in foxholes" claim and its relationship to societal trust under stress. They need distinct interpretations analyzed for validity and relevance to the "borrowed religious capital" thesis about secular societies.

  First, I need to unpack the foxhole metaphor's possible meanings. This phrase is often thrown around but rarely defined. I'll consider a spectrum from behavioral observations to strong psychological claims. For each interpretation, I'll assess:
  - Whether it's trivial, plausible, contested or false
  - How it relates to crisis piety vs crisis morality
  - Whether it supports the "fair-weather secularism" argument
  - The state of academic consensus

  The thick/thin trust distinction seems crucial here. Much religious behavior involves in-group solidarity (thick trust), but the journalist cares about societal cohesion (thin trust). I should flag where evidence only speaks to one type.

  For the mortality-salience priming literature mentioned by their reader, I recall it shows increased religious cognition under threat - but that's different from proving religion is necessary for morality. The Terror Management Theory connection needs careful handling without oversimplifying.

  When examining each interpretation, I'll be specific about:
  1. The precise claim being made
  2. Its empirical support (or lack thereof)
  3. Whether it would actually undermine secular trust if true
  4. Where academic debates exist

  The mortality-salience research deserves special attention since it's cited as "settling" the issue. While it demonstrates crisis piety well, it doesn't establish crisis morality changes - an important limitation for the journalist's thesis.

  Finally, I'll identify what evidence would most challenge the strongest version of the foxhole claim. A real-world case of high-stress secular societies maintaining thin trust would be particularly compelling counter-evidence.

  Throughout, I'll maintain the requested format: concise interpretations with verdicts, clearly separating settled findings from open debates. The analysis should help the journalist avoid the original panel's ambiguity while respecting their editor's space constraints.
answer: |-
  Here's a menu of readings for "there are no atheists in foxholes" (NAF) and their implications for the "borrowed capital / fair-weather trust" thesis in secular societies. Verdicts focus on empirical support and relevance to **thin trust** (trust in strangers/institutions) under stress, vs. **thick trust** (in-group) or self-report (**crisis piety**).

  ### Interpretations & Verdicts

  1.  **Reading:** *Acute threat increases self-reported belief, prayer, or religious identification.* (Crisis Piety)
      *   **Verdict:** **Plausibly True (Well-Supported).** Mortality-salience priming, disaster studies, and some combat accounts show spikes in religious expression/feeling under acute, uncontrollable threat. Primarily about *self-report/introspection*.
      *   **Supports "Fair-Weather"?** **Weakly/No.** Shows crisis piety, not crisis morality or thin trust dynamics. Secular coping mechanisms (secular meaning, community, therapy) also exist. Doesn't demonstrate religion's *necessity* for societal cohesion.
      *   **Relevance to Trust:** Low. Concerns individual psychological coping, not societal trust structures.

  2.  **Reading:** *Threat strips away pretence, revealing "true" latent belief.*
      *   **Verdict:** **Contested & Unfalsifiable.** Assumes a singular "true" belief state masked by social desirability. Crisis piety (Reading 1) could equally be interpreted as *new* coping behavior, not revelation. Difficult to test empirically.
      *   **Supports "Fair-Weather"?** **Potentially, but Speculative.** If secular identity is inherently "pretence," its fragility under stress supports the thesis. However, secular identities can be deeply held and stable.
      *   **Relevance to Trust:** Indirect. If secular identities are fragile pretence, the trust built on them might be too. But this reading lacks strong evidence.

  3.  **Reading:** *People *need* (psychologically require) supernatural belief to cope effectively with extreme suffering/mortality.*
      *   **Verdict:** **False (Overstated)/Contested.** While many *use* religion effectively for coping, robust evidence shows non-believers use secular meaning systems, social support, mindfulness, etc., and cope effectively. Need is not universal. Mortality-salience priming triggers religious cognition but doesn't prove its necessity for functional coping.
      *   **Supports "Fair-Weather"?** **Only if True.** If secular coping is inherently inferior under high stress, secular societies might fray. Evidence doesn't support this necessity claim.
      *   **Relevance to Trust:** Indirect. If individuals psychologically crumble without religion, societal trust could suffer. But evidence for widespread individual *need* is lacking.

  4.  **Reading:** *Shared religious ritual/belief is *indispensable* for generating/maintaining *thin trust* (especially between strangers) under severe societal stress.* (Crisis Morality / Thin Trust)
      *   **Verdict:** **Contested & Likely False.** This is the core of the "borrowed capital" claim for societal cohesion. Historical/cross-cultural examples exist both ways (religion unifying during crises; secular solidarity e.g., Blitz spirit, disaster responses in secular societies, high-trust secular nations weathering crises). Evidence suggests strong secular institutions, shared secular values (human rights), and effective crisis response are *more* reliable predictors of maintained thin trust than religiosity. Priming studies rarely test *actual thin trust behavior* under stress.
      *   **Supports "Fair-Weather"?** **CENTRAL. This is the thesis.** If true, secular high-trust societies are vulnerable under severe stress. Evidence does not strongly support it; secular mechanisms appear robust when institutions/values are strong.
      *   **Relevance to Trust:** **Directly addresses the core question.**

  5.  **Reading:** *"Real" belief is defined by what you rely on under existential pressure.* (Functional Definition)
      *   **Verdict:** **A Definition, Not Empirical.** Shifts the goalposts. If someone relies on secular humanism or comradeship in a foxhole, does that make it "religious"? This renders NAF tautological ("Those who don't rely on God aren't *really* atheists under pressure").
      *   **Supports "Fair-Weather"?** **Circular.** Defines the problem away. If secular coping mechanisms are redefined as "religious," then the thesis holds by definition but loses empirical meaning regarding organized religion's role.
      *   **Relevance to Trust:** Muddled. Doesn't clarify if organized religion specifically is required.

  ### Mortality-Salience Priming Literature: The "Settled" Claim?
  *   **What it shows:** Priming thoughts of death (**mortality salience**) reliably increases: 1) Positive reactions to those upholding one's cultural worldview (including religious); 2) Negative reactions to those threatening it; 3) Defense of that worldview (e.g., stronger religious belief, nationalism). This is **crisis piety/thick trust** focused.
  *   **What it does NOT show:** 1) That religion is *necessary* for coping; 2) That this translates into increased *thin trust* or generalized prosociality *towards strangers* under stress; 3) That secular worldviews *cannot* fulfill this function; 4) That the effects persist long-term or translate into real-world crisis *behavior* altering societal cohesion. It shows worldview defense, not necessarily societal collapse without religion.

  ### Key Distinctions Recap
  *   **Crisis Piety (Supported):** Spikes in religious *expression/feeling* under threat. Different from baseline belief.
  *   **Crisis Morality (Contested):** Changes in *actual prosocial behavior* towards others (especially strangers) under societal stress. Does religion uniquely enable/maintain this in secular societies? Unclear.
  *   **Thick Trust (Often Observed):** Increased in-group cohesion under threat (religious or secular - e.g., nationalism). Mortality-salience priming demonstrates this.
  *   **Thin Trust (The Crucial Question):** Trust in strangers/institutions. Does societal stress cause this to collapse *specifically* in secular societies due to lack of religion? Evidence does not support this. Strong secular institutions/values appear protective.

  ### The Strongest Reading & Key Evidence
  *   **Strongest Reading:** Reading 4 (Religion indispensable for thin trust under severe stress).
  *   **Verdict:** **Contested & Evidence Leans False.** High-functioning secular societies show resilience.
  *   **Single Piece of Evidence That Would Most Change Verdict:** Documented, sustained collapse of **thin trust** (e.g., skyrocketing crime against strangers, mass institutional betrayal, breakdown of cooperation in essential services) **specifically and primarily attributable to secularization** during a major, prolonged societal crisis (war, famine, existential threat) in a **previously high-trust, low-religiosity society** (e.g., a Nordic country), *while controlling for other factors* like institutional failure or external attack. The absence of such a case is notable. Conversely, evidence *against* this reading mounts with each crisis where high-trust secular societies maintain cohesion without religious revival.
