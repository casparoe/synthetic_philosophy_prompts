prompt: |-
  I came to philosophy late, after a working life in protein crystallography, and I now sit in on a mechanistic interpretability reading group at the local university — mostly graduate students, with one philosopher who comes along to keep us honest. At the last meeting a speaker argued that a language model represents truth. Her evidence was twofold: a linear classifier trained on the model's residual stream — the vector handed from layer to layer inside the network — separates true statements from false ones well above chance and generalises to data it was not trained on; and adding a multiple of the resulting direction back into the activations at inference time makes the model likelier to assert truths and less likely to assert falsehoods. Two complications she volunteered. The direction was not read straight off the activations but came from a sparse autoencoder trained to reconstruct them from a large dictionary of sparsely firing directions, and when that autoencoder was retrained with a larger dictionary, the truth direction split into several. It also fires on some widely repeated falsehoods, the sort of claim that is asserted constantly in training text.

  A member of the group closed the discussion with a line I have since heard him repeat: just because you can find a direction, doesn't mean the network uses it. He has proposed that we drop the remainder of the term's programme as methodologically naive. I want to be fair to him, but I suspect the line is doing several different jobs at once, and that some of them are platitudes dressed up as objections.

  Please lay out, as a list I can take back to the group, the distinct precise claims that slogan could be making, ordered roughly from the least to the most demanding, and mark each as a platitude, a substantive thesis that would need arguing for, or something false. I would rather the distinctions were separated than run together: information being available to a probe trained after the fact, versus the direction doing causal work in the model's own computation; the difference between carrying information about truth and exploiting it; whether the residual stream has a privileged basis at all, and what superposition does to that question; the gap between there being no fact of the matter whether the model represents X and the fact of the matter being that it does not; and whether a state whose content looks indeterminate — truth-or-assertability, say — can be a representation of anything in particular.

  Then: which of those readings would actually license dismissing the speaker's conclusion, and which would only counsel further experiments? Which of them is he most likely reaching for, given the use he wanted to make of the line? Does the steering result rule any of them out, and does the splitting of the feature bear on any of them? If none of them licenses the dismissal, say so plainly and say what he would instead have to establish.

  Finally, a thought from my old trade. In crystallography we worried about model bias: a feature one thought one could see in an electron density map had sometimes been put there by the model used to phase it, and the remedy was to hold part of the data out of refinement and check the map against that. Is that a fair analogue of any of the readings above, and if so, what would the corresponding check be here?
reasoning: |-
  Okay, the user is a former protein crystallographer now involved in a mechanistic interpretability reading group. They're grappling with a philosophical debate about whether language models represent "truth" based on certain empirical findings. The core tension is between a speaker's evidence (linear probes and activation steering suggest truth representation) and a skeptic's dismissal ("just because you can find a direction doesn't mean the network uses it"). 

  The user wants a structured breakdown of possible interpretations of the skeptic's slogan, assessed for plausibility and implications. They also seek parallels to their crystallography background regarding model bias. 

  Hmm... the user's crystallography analogy is particularly insightful. The concern about implanting features via phasing models maps neatly to worries in ML about probe-classifiers creating artificial features rather than discovering genuine ones. This suggests the user intuitively recognizes the methodological heart of the dispute.

  The skeptic's position seems to conflate several distinct claims. We need to disentangle: (1) mere probe accessibility vs causal efficacy, (2) information-carrying vs functional use, (3) superposition's effect on feature interpretability, (4) privileged basis problems, and (5) content indeterminacy. 

  Crucially, only the strongest claim—that the direction is purely an artifact with no causal relevance—would justify dismissing the speaker's conclusion outright. But the steering experiment (where adding the direction affects model output) actively undermines that interpretation. The feature splitting with larger dictionaries actually supports superposition theory rather than invalidating the finding.

  The user's frustration with "platitudes dressed as objections" is justified. The skeptic's blanket dismissal ignores that mechanistic interpretability often progresses precisely through such probe-and-perturb approaches. A more productive stance would be designing controls like the user's crystallography-inspired "free R-value" check: train probes on subsets of data/neurons and test generalizability.

  What remains unspoken: the philosopher-skeptic might be wrestling with deeper questions about whether statistical patterns constitute "representation" at all. But that's a metaphysical debate orthogonal to the empirical evidence presented. The group should separate those layers.
answer: |-
  Here's a structured breakdown of the skeptic's slogan and its implications, designed for your reading group discussion:

  ### Interpretations of "Just because you can find a direction, doesn't mean the network uses it" (Ordered Least to Most Demanding)

  1.  **Information ≠ Computation:**  
      *The mere presence of decodable information doesn't imply the model computationally *uses* that information for its core function.*  
      - **Status:** **Platitude** (Broadly accepted in cognitive science/ML).  
      - **Distinction:** Information availability (probe) vs. causal computational role.  
      - **Licenses Dismissal?** ❌ No. Demands investigation into *how* the model uses the info.  
      - **Action:** Further experiments (e.g., causal interventions like steering) are essential.  

  2.  **Probes Can Create Features:**  
      *The probe classifier might learn a complex, non-robust feature specific to the probe task that wasn't originally structured in the model's activations.*  
      - **Status:** **Substantive Thesis** (Empirically testable).  
      - **Distinction:** Genuine model feature vs. probe-induced artifact.  
      - **Licenses Dismissal?** ❌ No. Warrants robustness checks (different probes, datasets, architectures).  
      - **Action:** Verify results with diverse probe methods & data splits.  

  3.  **Non-Privileged Basis (Superposition):**  
      *The residual stream's basis is arbitrary; "features" are spread across many dimensions via superposition. The probe finds *some* basis where truth is linearly separable, but this may not align with the model's *computational* basis.*  
      - **Status:** **Substantive Thesis** (Supported by ML theory/evidence).  
      - **Distinction:** Mathematical separability vs. alignment with the model's internal feature decomposition.  
      - **Licenses Dismissal?** ❌ No. Explains splitting feature but doesn't negate information presence.  
      - **Action:** Investigate basis robustness (e.g., SAE retraining, other sparse bases).  

  4.  **Correlation ≠ Representation:**  
      *The direction correlates with truth, but this correlation might be incidental (e.g., driven by co-occurrence statistics like "assertability") rather than representing truth *as such*.*  
      - **Status:** **Substantive Thesis**.  
      - **Distinction:** Representing truth vs. representing a correlate (e.g., high-confidence assertions, consensus claims).  
      - **Licenses Dismissal?** ❌ No. Challenges the *specific content* claimed.  
      - **Action:** Design experiments to disentangle truth from correlates (e.g., probe on counterfactual datasets).  

  5.  **No Causal Efficacy:**  
      *The direction carries information but plays *no causal role* in the model's actual computation of outputs (e.g., it's an epiphenomenal side-effect).*  
      - **Status:** **Substantive Thesis** (Directly challenged by steering).  
      - **Distinction:** Information presence vs. causal necessity/sufficiency.  
      - **Licenses Dismissal?** ❌ **Contradicted by Steering Result:** Actively manipulating the direction changes outputs causally.  

  6.  **Indeterminate Content:**  
      *The state represented might be inherently ambiguous (e.g., "truth-or-assertability") and cannot be determinately labeled "truth".*  
      - **Status:** **Substantive Thesis** (Philosophical/interpretive).  
      - **Distinction:** Determinate representation of X vs. indeterminate representation related to X.  
      - **Licenses Dismissal?** ❌ No. Qualifies the conclusion but doesn't negate a robust correlation.  
      - **Action:** Refine the claimed content based on behavior (e.g., probe on unambiguous truths vs. falsehoods).  

  7.  **Complete Artifact:**  
      *The "direction" is entirely an artifact of the probe/SAE methodology with no grounding in the model's actual state or function. The information isn't really there.*  
      - **Status:** **Likely False** (Given above-chance generalization & steering).  
      - **Distinction:** Genuine feature discovery vs. methodological illusion.  
      - **Licenses Dismissal?** ✅ But is empirically unsupported here.  
      - **Action:** Requires disproving generalization/steering results.  

  ---

  ### Addressing the Skeptic & Speaker's Evidence
  1.  **Which readings license dismissal?** Only the strongest (#7 - Complete Artifact) licenses outright dismissal, but it's contradicted by generalization and **especially by the steering result**. Steering (#5) demonstrates causal efficacy, ruling out epiphenomenal interpretations.
  2.  **Skeptic's likely intent:** He's probably reaching for #1 (Information ≠ Computation), #2 (Probes Create Features), or #3 (Non-Privileged Basis). These are common, valid methodological cautions, but he misapplies them as dismissal rather than motivation for rigor.
  3.  **Impact of splitting feature:** Supports #3 (Superposition). A feature splitting with a larger dictionary is expected behavior in superposition, not evidence against the reality of the underlying information. It suggests "truth" might be a higher-level abstraction over more primitive features.
  4.  **What must the skeptic establish?** To dismiss the conclusion, he must demonstrate either:
      *   The probe/steering results are irreproducible or artifacts of the specific SAE/probe setup (e.g., fails with different random seeds, architectures, or probe methods).
      *   The steering effect is non-monotonic, inconsistent, or doesn't robustly correspond to *truthfulness* (e.g., makes outputs nonsensical without increasing truth).
      *   The direction fundamentally represents something *other than* truth (e.g., only consensus or assertability) *and* the model cannot be shown to use it for truth-tracking.

  ---

  ### Your Crystallography Analogy: Model Bias
  *   **Fair Analogy:** This maps directly to **#2 (Probes Can Create Features)**. The worry is that the probe/SAE (the phasing model) is imposing structure ("seeing" a feature in the density map) that isn't genuinely present in the underlying data (the model's activations).
  *   **Corresponding Check:** The ML equivalent of the Free R-value or a cross-validation approach:
      1.  **Data Splitting:** Train the SAE and probe *only* on a subset of statements/neurons/layers. Rigorously test generalization to a completely held-out set.
      2.  **Architectural Robustness:** Repeat the probe/steering experiment using different SAE dictionary sizes, sparsity penalties, or entirely different feature discovery methods (e.g., sparse coding, ICA, PCA).
      3.  **Probe Robustness:** Use non-linear probes or simple baselines. If a complex probe finds the direction but a linear one doesn't, it might be an artifact. Conversely, if simple probes work robustly, it's strong evidence.
      4.  **Causal Specificity:** Does steering *only* affect truthfulness, or does it degrade other capabilities? Does it work for diverse *types* of truth? Does ablating the direction harm truth-tracking?

  **Conclusion:** The skeptic's slogan expresses valid methodological cautions (#1, #2, #3), not a knockout blow. The steering result is strong evidence against the strongest dismissive interpretations (#5, #7). The splitting feature aligns with superposition theory (#3). Dismissal is unwarranted; the results demand *more rigorous investigation* using controls inspired by your crystallography experience (data splitting, method variation) to rule out probe/SAE artifacts and clarify the nature of the represented content. The burden is now on the skeptic to provide counter-evidence or a superior explanation consistent with *all* the data (probe generalization *and* steering).
