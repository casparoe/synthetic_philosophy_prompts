answer: |-
  Here’s a rigorous desiderata list for a multidimensional theory of translation fidelity, derived from your cases and requirements. Each item includes the *demand driver* and its *negotiability*. Conflicts are analyzed at the end, followed by a brief scorecard of translation camps.

  ---

  ### **Core Desiderata for Translation Fidelity Theory**
  1. **Non-Propositional Content Accounting**  
     *Driver:* Nonsense poems, sound-driven texts.  
     *Requirement:* Must identify and evaluate fidelity to non-semantic elements (sound, rhythm, invented words' "feel").  
     *Negotiable:* **No** – Excluding this fails core literary cases.  

  2. **Form-Content Fusion Recognition**  
     *Driver:* Poems where structure *is* meaning (e.g., fading memory mirrored by shortening lines).  
     *Requirement:* Must treat formal features (meter, typography, rhyme decay) as *semantically constitutive*, not decorative.  
     *Negotiable:* **No** – Form cannot be divorced from meaning here.  

  3. **Ambiguity Preservation/Transformation Tracking**  
     *Driver:* Puns, double entendres central to the text.  
     *Requirement:* Must map whether an ambiguity was preserved, resolved, replaced (with functional equivalent), or lost.  
     *Negotiable:* **No** – Critical for poetic/humorous texts.  

  4. **Absolute Propositional Fidelity for High-Stakes Texts**  
     *Driver:* Contracts, dosage instructions, checklists.  
     *Requirement:* Must demand 100% literal accuracy for truth-conditional content; "spirit" is malpractice here.  
     *Negotiable:* **No** – Life/death contexts forbid trade-offs.  

  5. **Register/Dialect Mapping Without Isomorphism Assumption**  
     *Driver:* Class-marked speech in novels vs. target-language sociolinguistics.  
     *Requirement:* Must evaluate *functional equivalence* of sociolinguistic effect (e.g., "marked as lower-class" vs. "identical grammatical deviance").  
     *Negotiable:* **Yes** – Acceptable strategies vary (compensation elsewhere? footnotes?).  

  6. **Constraint Representation**  
     *Driver:* Subtitling (syllable budget), dubbing (lip-sync).  
     *Requirement:* Must explicitly model *external constraints* forcing inevitable loss. Cannot ignore budgets.  
     *Negotiable:* **No** – A theory blind to constraints is incomplete.  

  7. **Intention/Reception Duality**  
     *Driver:* Sacred texts (community focus) vs. authorial intent debates.  
     *Requirement:* Must distinguish fidelity to *authorial purpose*, *source audience reaction*, and *later interpretive traditions*.  
     *Negotiable:* **Yes** – Priority depends on text type (e.g., sacred texts prioritize community practice).  

  8. **Non-Singular Source Handling**  
     *Driver:* Folk ballads, collaborative texts, AI output.  
     *Requirement:* Must define fidelity relative to a *textual corpus*, *functional role*, or *emergent consensus*, not a fixed "original."  
     *Negotiable:* **No** – Modern texts demand this.  

  9. **Token-Level Fidelity**  
     *Driver:* Sacred texts, ritual language (e.g., untranslatable names).  
     *Requirement:* Must recognize cases where specific *wordforms* (not just meanings) are inviolable.  
     *Negotiable:* **No** – Community practice dictates this.  

  ---

  ### **Compensation-Licensing Condition: Core Requirement**
  10. **Loss Compensation Legitimacy Principle**  
      *Driver:* Rhyme replaced by alliteration, metaphor swapped for image.  
      *Requirement:* **Legitimate compensation** must preserve an *invariant* prioritized by the text (emotional impact, rhetorical function, aesthetic density). **"Bribes"** add unrelated positives.  
      *Principle:* Compensation is valid iff it sustains a *higher-ranked invariant* threatened by loss. A bribe introduces a *new* invariant.  
      - *Can a translation be "better"?* Yes – if it achieves the source's *core invariants* more effectively for the target audience, without adding unrelated "bribes." "Better" = superior realization of prioritized invariants.  
      - *Incommensurability?* Yes – Two translations can be functionally equivalent but optimize *different* invariants (e.g., one prioritizes meter, another lexicon).  

  ---

  ### **The Language Equality Constraint**
  - **"No language is cruder/subtler"**  
    *Status:* **Non-negotiable hard constraint.**  
    *Why:* Assumed linguistic hierarchy leads to ethnocentric distortion (e.g., "simplifying" non-Western texts). Theories must treat all languages as equally capable of nuance, just *differently structured*.  

  ---

  ### **Conflict Analysis: Desiderata Clashes**
  1. **The Core Trilemma**  
     - **Sense vs. Form vs. Naturalness**: Cannot fully satisfy all three when source/target structures diverge (e.g., translating German compound nouns into analytic English while preserving meter). *Unavoidable trade-off*.  

  2. **Author vs. Audience**  
     - Fidelity to authorial intent vs. source audience reception vs. target audience reception. These diverge sharply for ancient/sacred texts. *Theory must separate these axes*.  

  3. **Constraint vs. Completeness**  
     - External budgets (subtitles) force loss that a theory without constraint modeling cannot explain. *Not an engineering add-on – must be integral*.  

  4. **Token Fidelity vs. Naturalness**  
     - Sacred word retention ("YHWH") may sound alien in target language. *Theory must mark this as a necessary sacrifice of naturalness*.  

  5. **Compensation vs. Purity**  
     - Legitimate compensation (e.g., new metaphor for lost rhyme) violates "letter fidelity" but may better serve the text's invariants. *Not resolvable – depends on text type*.  

  **Most Theory-Eliminating Requirement**: **#4 (Absolute Propositional Fidelity)**. Theories prioritizing "reader response" (Nida) or "form" (Hofstadter) fail catastrophically here. Only "letter-fidelity" survives, but it fails elsewhere.  

  ---

  ### **Scorecard of Translation Camps**
  - **Letter-Fidelity (Nabokov):**  
    Excels at #4 (propositional precision), #9 (token fidelity). Fails #1, #2, #5 (naturalness), #10 (compensation), #6 (constraints). Treats trade-offs as failure.  

  - **Reader-Experience (Nida):**  
    Excels at #5 (register effect), #7 (target reception), #10 (compensation for naturalness). Fails #2, #3, #4, #9. May "over-adapt" high-stakes/textual integrity texts.  

  - **Form-Fidelity (Hofstadter):**  
    Excels at #1, #2, #10 (creative compensation). Fails #4, #6 (ignores budgets), #9. Risks sacrificing semantics/pragmatics for aesthetics.  

  **Key Insight**: No camp satisfies all desiderata. A viable theory must be **multidimensional**, **context-sensitive**, and **explicit about trade-offs**.  

  This framework forces granular diagnosis: *what* was lost/kept/added, *why* it mattered in the source, and *how well* the translation navigated constraints and priorities. Vibes give way to structured analysis.
