prompt: |-
  Hi — hoping you can help me put something together that my committee can actually use.

  I'm the governance officer (clerk, minute-taker, and de facto rules nerd) for a professional institute of about 9,000 members. Our rulebook is amended at the AGM and at emergency general meetings — 30 or 40 substantive motions a year, plus the occasional one shoehorned in between. My job is to rule, sometimes in advance of the vote and sometimes the morning after, on whether a motion that carried actually changed the rules, or whether it's void / void in part / did something different from what the proposer thought. I then give the Rules Committee three or four paragraphs of written reasons they sign off on. Two of my rulings have ended up in front of a judge, so they can't be hand-wavy; but the committee is five lay trustees who will not sit through a lecture on self-reference, and I usually have about two days from motion to ruling.

  The bit we keep crashing into is that the rules govern their own amendment, and the drafting is a mess. Roughly:

  - Rule A1: rules may be amended by a two-thirds majority at a general meeting; A1 itself may be amended only by a three-quarters majority.
  - Rule A2: the rules in force are those printed in the current Handbook, as updated by the Secretary. The Handbook is reprinted every other year, so what members vote against and what's on the shelf are often two different texts.
  - Rule A3: if part of an amendment is void, the rest stands.
  - Rule A4: no amendment may remove an accrued right of a member. Nobody knows what accrued means here; we've been reading it as a right someone has already started to exercise.
  - Rule A5: defines who counts as a voting member.

  So: give me a decision procedure. Ordered questions, what counts as an answer to each one, where the procedure stops with a no, and where it hands the decision to the committee because it's a values call dressed up as a rule question. It has to be runnable in an afternoon with the rulebook and the minutes, and it has to handle self-referential amendments specifically — an amendment that changes the threshold it has to clear, a rule that tries to lock itself against later amendment, a motion that repeals the amending power and hands it somewhere else. Please don't just tell me these are paradoxical; I still have to issue a ruling on Monday.

  Run it on these:

  1. A motion to lower the general amendment threshold in A1 from two-thirds to a simple majority. It got 68%. Did it carry, and if so what threshold applies to next year's motions?
  2. In 2022 a motion added to Rule 14 (the subscription cap) the sentence "Rule 14 may not be amended or repealed." Passed 71%. In 2024 a motion to repeal Rule 14 outright passed 69%. What's in force now — and was the 2022 lock itself valid, given A1?
  3. A single motion, passed 78%, repealing A1 and replacing it with "the Board may amend these Rules by resolution." Do we still have a rulebook, and can a later board resolution be challenged?

  And two hard cases the procedure has to say something about: (a) the 2019 Members' Charter — a block of protections including a right to appeal expulsion, inserted by a 71% vote, with a preamble saying these are fundamental and shall not be amended; this year a 70% motion deleted the appeal right. My instinct, and the members', is that the preamble protects it. I suspect the procedure will tell me otherwise. (b) A motion to exclude retired members from voting, which passed 67% counting the retired members who voted and 61% excluding them — the amending majority depends on the content of the amendment.

  Please flag where the procedure can't settle things: rules we've all been relying on for years that were probably never validly adopted, and the printed-Handbook lag under A2. And tell me what it can't do at all. No need for citations or further reading — I want the tests and the reasons, not a reading list.
reasoning: |-
  Okay, let's tackle this step by step. The user is a governance officer for a professional institute dealing with complex rule amendments. They need a practical decision procedure to quickly evaluate motions' validity, especially those that are self-referential. The key challenges include handling amendments that change their own voting thresholds, locks against future amendments, and transfers of amendment power. 

  First, I need to understand the core issues. The rulebook has five critical rules (A1-A5) that interact in tricky ways. The user has real-time cases to judge, so the procedure must be both rigorous and efficient. They mentioned past rulings ended up in court, so precision matters, but trustees aren't legal experts—clarity is essential.

  Starting with the decision procedure: It should be a flowchart-like checklist. Each step must resolve a specific question, halt if a motion fails, or flag "committee judgment needed" when rules conflict or terms like "accrued right" require interpretation. The goal is to minimize ambiguity but acknowledge where it's unavoidable.

  For self-referential amendments (like changing A1’s threshold), the procedure must address circularity head-on. For example: If a motion amends A1 itself, does it pass under the old or new threshold? Logic suggests the old threshold applies because the new rule isn’t in force yet. But if it passes, the new threshold governs future amendments. That avoids paradox but might frustrate members who assume "immediate effect."  

  Now, the test cases:  
  1. Motion to lower A1’s threshold from 2/3 to simple majority (68% vote).  
     - Step 1: Does it amend A1? Yes.  
     - Step 2: A1 requires 75% for its own amendment. 68% < 75% → motion fails.  
     - Outcome: Threshold remains 2/3.  

  2. The 2022 "lock" on Rule 14 (71% vote) vs. 2024 repeal attempt (69%).  
     - First, was the 2022 lock valid? A1 allows amendments if thresholds are met. The lock is an amendment, so at 71% (>67%), it was valid *unless* it conflicts with A1’s supremacy. But A1 doesn’t forbid locking; it just sets thresholds. So the lock stands.  
     - 2024 repeal: Needs 2/3 (67%) but only got 69% → passes? No! The lock in Rule 14 now forbids repeal. So even with 69%, it’s void. Rule 14 stays.  

  3. Motion replacing A1 with board-only amendments (78% vote).  
     - Amends A1? Yes. Needs 75%. 78% > 75% → passes.  
     - But now the rulebook’s amendment power is gone. Does A1’s repeal invalidate the whole system? No—A3 says partial voidness doesn’t sink the rest. The board now amends rules, but members might challenge if the board oversteps. Tricky bit: Can future boards revert this? Yes, under the new rule—unless they "lock" it.  

  Hard cases:  
  (a) The 2019 Members’ Charter preamble ("fundamental, unamendable") vs. 2024 deletion (70%).  
     - The preamble’s "no amend" clause is likely void—A1 governs amendments, and self-declared immutability conflicts with that. So 70% (>67%) validly deleted the appeal right. But! "Accrued right" (A4) might protect members mid-appeal. Committee must decide if that applies.  
  (b) Voting exclusion motion (67% with retirees, 61% without).  
     - A5 defines voting members. If retirees are still members, they vote on their exclusion. But if the motion passes *including* them, their votes count. 67% > 67% → valid. If not, 61% < 67% → fails. Here, the procedure flags ambiguity: Are retirees still "members" during the vote? Committee must rule.  

  Gaps in the procedure:  
  - **Printed Handbook lag (A2)**: Rules are valid once minutes are approved, not when printed. Procedure can’t fix the lag—just note it.  
  - **Historical validity**: If past motions didn’t meet thresholds but were printed, they’re "defectively adopted." Procedure can’t retroactively fix this; committee must assess risk.  
  - **A4’s "accrued right"**: Pure committee judgment. E.g., "started exercising" means formal appeal filed, not just "might appeal someday."  

  What the procedure can’t do:  
  - Resolve conflicts with external law.  
  - Handle motions that "break the system" (e.g., abolishing all rules without replacement).  
  - Fix poorly drafted motions—only judge them as-is.  

  Final thought: The user’s instinct about the Members’ Charter preamble is understandable but legally shaky. The procedure will disappoint members but uphold the rulebook’s integrity. For retirees’ votes, pragmatism says "include them unless the motion explicitly bars it mid-vote"—but that’s a committee call.  

  This should give the user a clear, defensible toolkit. Time to draft the actual procedure steps.
answer: |-
  Here's a practical, step-by-step decision procedure designed for speed and defensibility. It prioritizes **Rule A1's supremacy** (as the amendment gateway) and **Rule A3's severability** to handle self-reference. Where rules conflict or terms are ambiguous, it flags "Committee Judgment Required" (CJR).

  ---

  ### **Decision Procedure: Validity of Rule Amendments**
  **Tools Needed:** Current Rulebook, Motion Text, Voting Results, Minutes of Meeting.

  1.  **Does the motion purport to amend the Rules?**
      *   *Test:* Explicitly adds, deletes, or changes rule text.
      *   *No:* Stop. Motion is valid (it's operational/policy, not rule-change). It doesn't alter the rulebook.
      *   *Yes:* Proceed to Step 2.

  2.  **Does the motion *specifically* amend Rule A1?**
      *   *Test:* Does it change A1's text or thresholds?
      *   *No:* Proceed to Step 3a.
      *   *Yes:* Proceed to Step 3b.

  3.  **Determine Required Majority & Check Vote:**
      *   **a) For amendments NOT to A1:**
          *   Required Majority: **Two-thirds** (Rule A1).
          *   *Check Vote:* Did the motion achieve >= 66.67%? (Use precise calculation).
          *   *Yes:* Proceed to Step 4.
          *   *No:* **Motion FAILS (Void).** Stop.
      *   **b) For amendments TO A1:**
          *   Required Majority: **Three-quarters** (Rule A1).
          *   *Check Vote:* Did the motion achieve >= 75%?
          *   *Yes:* Proceed to Step 4.
          *   *No:* **Motion FAILS (Void).** Stop.
      *   *CJR Trigger:* If the vote margin is extremely close (e.g., 66.65%) and eligibility is disputed, but avoid if possible. Base ruling on certified results.

  4.  **Does the amendment conflict with Rule A1's core function? (Supremacy Check)**
      *   *Test:* Does the amendment attempt to:
          *   (i) Remove/transfer the membership's amendment power (e.g., give it solely to the Board)?
          *   (ii) Make itself or another rule *permanently* unamendable ("entrenched") by the membership?
          *   (iii) Alter the amendment threshold for *future* amendments to A1 to be *lower* than 75%?
      *   *No:* Proceed to Step 5.
      *   *Yes:* **Only the conflicting part is VOID (Rule A3).** Sever the invalid part. Proceed to Step 5 with the valid remainder. If no valid remainder exists, the **entire motion is VOID**.
      *   *Reasoning:* A1 is the foundational amendment rule. Amendments passed *under* A1 cannot destroy or fundamentally alter the *source* of their own validity for future amendments without creating unresolvable paradoxes or bypassing A1's own protection (75% threshold). Rule A3 severs the invalid lock/transfer.
      *   *CJR Trigger:* Determining the "core function" of A1 is foundational. This step assumes core function is: Membership retains ultimate amendment power via GM with defined thresholds.

  5.  **Does the amendment remove an "accrued right" (Rule A4)?**
      *   *Test:* Does it remove a right that a member *has already actively exercised or triggered* under the *previous* rule version? (e.g., mid-appeal, mid-application, mid-disciplinary process).
      *   *No:* Proceed to Step 6.
      *   *Yes:* **Only the removal of the accrued right is VOID (Rule A3/A4).** Sever that specific removal. Proceed to Step 6 with the valid remainder. If removal was the sole purpose, **entire motion VOID**.
      *   *CJR Trigger:* **Definition of "Accrued Right"** is inherently CJR. The procedure uses "active exercise/trigger" as the operable test. Committee *must* decide based on evidence (e.g., formal appeal filed before amendment passed). This is values-based.

  6.  **Is the amendment internally coherent and operable?**
      *   *Test:* If implemented, would the amended rule(s):
          *   (i) Create an unresolvable conflict within the rulebook?
          *   (ii) Be impossible to comply with or enforce?
          *   (iii) Rely on invalidated or non-existent concepts?
      *   *No:* **Amendment is VALID.** Proceed to Step 7.
      *   *Yes:* **Only the incoherent/inoperable part is VOID (Rule A3).** Sever that part. Proceed to Step 7 with the valid remainder. If no valid remainder, **entire motion VOID**.
      *   *CJR Trigger:* Severability can be complex. Does removing X make Y nonsensical? Committee may need to judge if a valid core remains.

  7.  **Implementation & Record:**
      *   Valid amendments (or severed valid parts) are effective **immediately upon certification** of the GM minutes by the Chair/Secretary (standard practice implied).
      *   The Secretary updates the "working master" rulebook per Rule A2.
      *   The printed Handbook remains outdated until the next reprint (Rule A2 lag - unavoidable).

  ---

  ### **Application to Your Test Cases**

  1.  **Lower A1 Threshold to Simple Majority (68% Vote):**
      *   Step 1: Yes (amends rules).
      *   Step 2: Yes (amends A1).
      *   Step 3b: Required 75%. 68% < 75%. **Motion FAILS (Void).** Threshold remains 2/3.
      *   *Why Monday is Easy:* Clear math under A1.

  2.  **2022 Lock on Rule 14 (71%) vs. 2024 Repeal (69%):**
      *   *2022 Lock ("Rule 14 may not be amended or repealed"):*
          *   Step 1: Yes (amends Rule 14).
          *   Step 2: No (doesn't amend A1). Step 3a: 71% > 66.67%. Passes vote.
          *   Step 4: **YES - Conflicts with A1 (ii - attempts entrenchment).** The lock clause is VOID (severed). Rule 14 is amended *without* the lock.
          *   Step 5/6: N/A (assuming no accrued rights/operability issues).
          *   **Result 2022:** Rule 14 amended, lock clause void.
      *   *2024 Repeal (69%):*
          *   Step 1: Yes (amends Rule 14).
          *   Step 2: No. Step 3a: 69% > 66.67%. Passes vote.
          *   Step 4: No conflict (just repealing a rule).
          *   Step 5/6: N/A (assuming).
          *   **Result 2024:** Rule 14 is validly repealed. The 2022 lock was never validly part of the rules.
      *   *Why Monday is Clear (but surprising):* Step 4 voids entrenchment clauses. The repeal passed the correct threshold.

  3.  **Repeal A1, Replace with Board Power (78%):**
      *   Step 1: Yes.
      *   Step 2: Yes (amends A1).
      *   Step 3b: 78% > 75%. Passes vote.
      *   Step 4: **YES - Conflicts with A1 (i - removes membership amendment power).** The clause *transferring amendment power solely to the Board* is VOID (severed). The clause *repealing A1* is also likely void (as it destroys the amendment mechanism without valid replacement). **Entire Motion VOID.** (No valid, operable core remains if both repeal and replacement are void).
      *   **Result:** Rulebook intact. A1 still in force. Board cannot amend rules.
      *   *Alternative if Committee Favors Change:* If committee judges the *intent* was solely to *transfer* power (not destroy it), they *might* sever the repeal of A1 as void but uphold the Board power clause. **CJR HEAVY - High Litigation Risk.** Procedure strongly suggests voidness.

  ---

  ### **Application to Hard Cases**

  **(a) 2019 Members' Charter (71% w/ "fundamental" lock) vs. 2024 Deletion of Appeal Right (70%):**
  *   *2019 Charter Insertion:*
      *   Step 1: Yes.
      *   Step 2: No. Step 3a: 71% > 66.67%. Passes.
      *   Step 4: **YES - The "shall not be amended" preamble conflicts with A1 (ii - entrenchment).** **The preamble is VOID (severed).** Protections are added without lock.
      *   Step 5/6: N/A (assuming).
      *   **Result 2019:** Protections (including appeal right) added; lock void.
  *   *2024 Deletion of Appeal Right (70%):*
      *   Step 1: Yes.
      *   Step 2: No. Step 3a: 70% > 66.67%. Passes vote.
      *   Step 4: No conflict (deleting a rule).
      *   Step 5: **CJR: Does it remove an "accrued right"?** If members were *mid-appeal* when the amendment passed, deletion *for those specific members* is void. Otherwise, deletion is valid. Committee must decide based on evidence of active appeals.
      *   Step 6: N/A.
      *   **Result 2024:** Appeal right deleted *prospectively*. Rights of members *already* in an appeal process likely protected (CJR).
      *   *Your Instinct vs. Procedure:* Your instinct (preamble protects) is understandable but incorrect per Step 4. The appeal right itself was vulnerable to later amendment.

  **(b) Exclude Retired Members from Voting (67% inc. / 61% excl.):**
  *   Step 1: Yes (amends rules - likely A5 definition).
  *   Step 2: No. Proceed to Step 3a.
  *   **Step 3a CRITICAL: Which electorate applies?** The rule *defining the electorate (A5)* is the one *in force at the time of the vote*. If retirees were voting members *under the current rules when the vote was held*, their votes **must be counted** in determining if the 2/3 threshold is met. 67% > 66.67% -> **Motion PASSES.**
  *   *If Retirees Were NOT Members:* Then 61% < 66.67% -> Motion FAILS.
  *   **CJR Trigger:** Interpretation of *current* A5 at time of vote. Procedure assumes status quo unless motion itself changes electorate *during* the vote (highly unusual and problematic). **Ruling:** Motion valid (67% inc. retirees).

  ---

  ### **Limitations & Unresolvable Issues (Flag in Rulings)**

  1.  **Rule A2 (Printed Handbook Lag):** The procedure confirms validity upon minute certification. **It cannot fix the lag.** Members act on outdated printed rules. Flag this systemic risk repeatedly.
  2.  **Defectively Adopted Rules (Historical Validity):** If a past rule (especially foundational) *likely* didn't meet the *then-applicable* threshold (A1/A3b), but has been relied upon for years:
      *   The procedure *can* identify the defect.
      *   **It cannot retroactively validate or invalidate.** Flag as "Defectively Adopted but Operationally Relied Upon." Committee must decide risk tolerance (challenge now? grandfather?).
  3.  **Rule A4 ("Accrued Right"):** **Pure CJR.** The procedure provides the test ("active exercise"), but application is factual and values-based. No bright line.
  4.  **Catastrophic Amendments:** The procedure voids amendments destroying A1's core function (Step 4). It *cannot* handle a valid 75%+ vote that *replaces the entire rulebook* with a coherent new system that *explicitly* changes the amendment source/thresholds (if done clearly and coherently). This is rare and high-risk.
  5.  **External Law:** The procedure checks internal rules. It *cannot* assess conflicts with statute or common law (e.g., contractual rights, natural justice). Flag potential external conflicts separately.
  6.  **Ambiguous Motions:** The procedure assumes the motion text is clear enough to apply the steps. Poor drafting may force CJR on interpretation *before* Step 1.

  This procedure provides a clear, ordered, defensible path to a ruling within an afternoon. It prioritizes A1's supremacy and A3's severability to cut through self-reference paradoxes, flags critical CJR points (especially A4), and explicitly acknowledges systemic weaknesses (A2 lag, historical defects). Use it to structure your reasoning paragraphs for the committee, highlighting where *they* need to make the call (CJR). Good luck on Monday!
