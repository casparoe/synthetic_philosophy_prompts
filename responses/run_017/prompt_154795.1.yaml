prompt: |-
  I run the grants side of a small health-research foundation — two rounds a year, ~150 applications each, every one read by 4–6 external reviewers who fill in a score sheet, and then a panel of five of us meets on Zoom for about fifteen minutes per application to make a yes/no call. Reviewers are volunteers so I can't just keep adding more of them, I've got no statistician on staff, the panel chair has to be able to sign off on whatever we do, and anything I change has to be explainable to our board in plain english and fit in a spreadsheet. I also can't spend more than a couple of hours per round messing with process.

  The thing I keep coming back to is the Condorcet jury theorem — the bit about a lot of imperfect-but-better-than-chance voters beating one careful one, and the nasty flip side where if each voter is worse than chance then adding more of them makes the group worse, not better. I want that turned into something I can actually run, not just admire.

  So: write me a decision procedure. The questions to ask in order (some once per round when I set the process up, some per application when the panel is stuck), what counts as a good enough answer to each, where the procedure just stops with a no, and where it hands the decision over to a person because the disagreement is about what we value rather than about what's true.

  It has to settle at least these:

  - How many reviewers, and when adding one more reviewer is worth it versus spending the same effort on making reviews better-informed (paying a second reader from the *other* field, or a fifteen-minute call with the applicant to clear something up).
  - Whether reviewers should see each other's draft reviews before scoring. I have a feeling sharing helps them catch real problems but wrecks the independence the theorem wants, and I have no idea how to tell which effect is bigger. Someone told me that once reviewers' errors are correlated, accuracy stops climbing and flattens out somewhere short of certainty no matter how many people you pile on — if that's even roughly right, tell me what I'm supposed to *do* with it.
  - Our panel discusses first and then votes. Should each of us write down a private vote before anyone talks?
  - What threshold: simple majority, two-thirds, unanimity, or our current unwritten rule that one "strong reject" kills an application even when the other four are enthusiastic (people are scared of being the one who waved through a dud). I suspect the veto rule is just a very high threshold wearing a disguise, and I want to know what it's costing us and what would be better.
  - Reviewers score three separate things — importance, methods, feasibility — and then we aggregate. I've noticed the panel can be majority-yes on each of the three and majority-no overall, or the other way round. Should we vote on the criteria and combine, or vote on the overall call? Which is less likely to be wrong?
  - What to do when the split is factual versus when it's about risk appetite (a safe boring project versus a long shot), and when the right move is to hand the decision to one named person instead of the group.
  - Some estimate of our reviewers' actual accuracy. We have outcome data for funded projects, obviously not for rejected ones; the only rejected applications we can check are about twenty that got picked up by another funder and we can see how they did. Tell me honestly what I can and cannot infer from that, and what to do when I can't get a number at all.

  Then apply the whole thing to three cases: (1) a solid, unexciting application that everybody mildly likes; (2) an interdisciplinary application where all our reviewers sit on one side of the discipline and I genuinely worry their accuracy on it is below chance; (3) an application where two reviewers say the statistical plan is fine and three say it's broken, and nobody can settle it without seeing the raw data.

  Please be straight about which steps are really just my judgement dressed up as procedure, and which parts of the theorem I'm quietly violating. And give me at least one worked case where the honest output of the procedure is something I won't like — ideally something our board would probably refuse to approve — and say what you'd do then. And please don't give me a reading list or footnotes; I want the reasoning, not pointers to papers I can't get to.
reasoning: |-
  We are designing a decision procedure for a grant review process that incorporates the Condorcet jury theorem and addresses the specific concerns of the foundation. The procedure must be practical, implementable in a spreadsheet, and explainable in plain English.

   Key Principles from Condorcet Jury Theorem:
   1. If each voter is more likely to be correct than wrong (p > 0.5), then adding more voters increases the group accuracy, and the group decision approaches certainty as the number of voters goes to infinity.
   2. If each voter is worse than chance (p < 0.5), then adding more voters makes the group less accurate.
   3. The theorem assumes independent votes.

   We have to consider:
   - How to estimate or set the competence (p) of reviewers?
   - How to handle correlated votes (which breaks independence and limits the maximum achievable accuracy)?

   Steps:

   I. Setup per Round (Once per round)
      A. Estimate reviewer competence (p) for this round? 
          - We have limited data: only for funded projects and 20 rejected but funded elsewhere.
          - We cannot get a precise p for each reviewer because we don't know the true quality of all applications.
          - Instead, we can use a default p (say 0.6) and adjust based on domain or other factors.

      B. Determine the number of reviewers (n) and the threshold (k) for a positive decision.
          - We have a constraint: 4-6 reviewers per application and a panel of 5.
          - We want to balance the cost of adding a reviewer (which might reduce p if we stretch to less competent ones) versus improving the information per reviewer.

      C. Decide on sharing draft reviews: 
          - Sharing may increase correlation and reduce independence, but it might improve individual p (by catching errors). 
          - We need a rule: when p is low (e.g., in an unfamiliar field) sharing might be more beneficial to raise p, even at the cost of independence. But if p is already high, independence is more critical.

      D. Set voting rules for the panel (simple majority, supermajority, veto).

      E. Decide whether to vote on criteria separately or overall.

   II. Per Application (When the panel is stuck or for every application)
      We assume the panel meets after the reviewers have provided their scores and comments. The panel discussion might reveal that the disagreement is about facts or about values/risk.

      Steps for each application:

      1. Collect the reviewer scores (on importance, methods, feasibility) and their overall recommendation (if they provided one).
      2. Panel discussion: 
          - The chair should structure the discussion to first clarify facts and then discuss values/risk.
          - If there is a factual dispute that can be resolved (e.g., by contacting the applicant), do so.
          - If the dispute is about values (e.g., risk appetite), then note that and handle differently.

      3. After discussion, the panel votes. We must decide:
          a. Whether to have a private vote (to avoid groupthink) or public.
          b. How to aggregate: by criteria or overall?

      4. If the vote is split, we need a procedure to break the tie or to delegate.

      5. In cases of interdisciplinary applications or when we suspect p<0.5, we need a different approach.

   Proposed Decision Procedure:

   I. Setup per Round:

      Step 1: Estimate average reviewer competence (p)
          - Use historical data: for funded projects, we know the outcome (success/failure). We can compare the reviewer recommendations (if they were recorded) with the outcome to estimate p for funded projects. But note: we only have data for funded projects, and for rejected ones only the 20 that were funded elsewhere. This is a biased sample.

          - We can do:
              p_est = (number of times a reviewer correctly recommended funding for a project that succeeded + 
                       number of times a reviewer correctly rejected a project that failed) / 
                      (total reviews by that reviewer on projects with known outcomes)

          - However, we don't know the outcome for rejected projects that were not funded elsewhere. So we only have partial data.

          - We also have the 20 rejected applications that were funded elsewhere and their outcomes. We can use these to estimate the false negative rate.

          - But note: the 20 that were funded elsewhere might not be representative (they were good enough for another funder).

          - Proposed: If we have at least 10 data points per reviewer, we compute an individual p. Otherwise, use a default p of 0.6 (slightly better than chance) for all.

          - Also, we can adjust p by field: if a reviewer is reviewing outside their field, we reduce p by 0.1 (or a fixed amount) for that application.

      Step 2: Number of reviewers (n)
          - We have 4-6. We want to know if adding one more is worth it.

          - The gain in accuracy from adding a reviewer depends on the current n and p. We can compute the probability of the group making the correct decision for n and n+1.

          - Formula for independent voters: 
              Group accuracy = sum_{k=m}^{n} [C(n,k) * p^k * (1-p)^(n-k)] 
              where m is the majority threshold (ceil(n/2)+1 for strict majority?).

          - But note: we have a panel of 5 that makes the final decision, so the reviewers are only advisory. Therefore, we are more interested in the panel's decision.

          - However, the reviewers' scores feed into the panel. So we focus on the panel.

          - For the panel (5 members), we set a voting rule.

      Step 3: Sharing draft reviews
          - We suspect that sharing increases p (by catching errors) but introduces correlation (which reduces the group accuracy gain from adding reviewers).

          - We can model the effect of correlation: if the votes are positively correlated, the group accuracy is bounded.

          - Without a statistician, we can do a simple test: run a round without sharing and a round with sharing and compare the level of agreement (which is a proxy for correlation) and also the outcome (if we can). But that's beyond the current scope.

          - Proposed: 
              - For applications in a well-established field (where reviewers are likely to be competent) and p_est >= 0.6, do not share reviews until after scoring to preserve independence.
              - For applications in a new or interdisciplinary field (where we suspect p might be lower), allow sharing of draft reviews to boost p (at the cost of some independence). We hope that the boost in p outweighs the loss of independence.

      Step 4: Voting rules for the panel
          - We have 5 panelists. We must set a threshold k: if k or more vote yes, then yes.

          - The current unwritten rule: one strong reject (veto) kills the application. This is equivalent to requiring unanimity for a yes? Not exactly: it's a veto rule. It means that one no vote (if it's a strong reject) leads to rejection. So effectively, the threshold for a no is 1 (if that no is strong) and for a yes it must be 5 (if there's a strong reject) or at least 4 without a strong reject? 

          - This veto rule is very conservative and might lead to rejecting good projects. We want to minimize the overall error (both false positives and false negatives).

          - The optimal threshold depends on the cost of false positives (funding a dud) versus false negatives (missing a good project). We don't have explicit costs, so we assume they are equal.

          - According to the Condorcet theorem, for a group of 5 with p>0.5, the simple majority (3 out of 5) minimizes the probability of error.

          - But if the cost of false positives is higher, we might want a higher threshold.

          - Proposed: 
              - If we have no reason to believe false positives are worse than false negatives, use simple majority (3 out of 5).
              - If the board is very risk-averse (i.e., false positives are very costly), then we might require 4 out of 5.

          - The veto rule is too extreme: it gives one person the power to reject even if the other four are positive. This might be acceptable only if the veto is based on a critical flaw that the others might have missed and if the vetoer has special expertise. But in general, we want to avoid it.

          - We can replace the veto rule by a procedure: if one panelist has a strong reject, they must state a clear, factual reason. The panel then re-examines that reason. If the reason is factual and cannot be resolved, then we might defer the decision (see below). Otherwise, the vote proceeds without a veto.

      Step 5: Vote on criteria or overall?
          - The problem: separate majority on each criterion may not lead to the same outcome as overall majority.

          - Which is less error-prone? It depends on the correlation between the criteria.

          - However, the Condorcet theorem applies to a single binary question. We have three criteria and then an overall.

          - Proposed: 
              - We want to capture the overall judgment. The panel should vote on the overall question: "Should we fund this project?" (Yes/No) after discussing all criteria.

              - Why? Because the separate criteria might not be independent and the overall judgment might capture interactions (e.g., high risk might be acceptable if the importance is very high). Also, voting separately and then combining might lead to inconsistencies.

              - However, the reviewers should still provide scores on the three criteria to guide the discussion.

      Step 6: Handling disagreement
          - We need to distinguish between:
              a) Factual disagreement: e.g., about the statistical plan, which might be resolved by more information (like raw data) or an expert consultation.
              b) Value disagreement: e.g., about risk appetite, where even with the same facts, some panelists would fund and some wouldn't.

          - Procedure:
              During the discussion, the chair should ask: "Is the disagreement about a verifiable fact or about our risk tolerance?"

              - If factual and if the fact is critical, then:
                  * If it can be resolved quickly (e.g., a 15-minute call with the applicant), do so and then revote.
                  * If it cannot be resolved quickly, then delegate the decision to the panel chair (or a designated expert) to investigate and make the call. The chair must report back to the board on how many times this happened and the outcome.

              - If value-based, then we cannot resolve by more facts. We must vote. The voting rule (simple majority or supermajority) applies.

   II. Per Application:

      Step 1: Collect reviewer scores and comments.

      Step 2: Panel discussion (structured by the chair):
          a) First, go through the criteria and note agreements and disagreements.
          b) Identify any factual disputes. Try to resolve them on the spot (if possible) or flag for delegation.
          c) Discuss the overall merit.

      Step 3: Vote:
          a) Each panelist writes down a private vote (Yes/No) to avoid groupthink.
          b) The chair collects and counts the votes.

          c) If the vote meets the threshold (e.g., at least 3 Yes for simple majority), then the decision is made.

          d) If not, then:
              - If the vote is split (e.g., 2-3) and the threshold is not met, then reject.
              - But if there was a factual dispute that was not resolved, then delegate to the chair or an expert (if we are within the time limit) for a final decision.

      Step 4: For interdisciplinary applications (where we suspect p<0.5 for the reviewers) or when the panel is not confident:
          - We must be cautious: if the reviewers are not competent (p<0.5), then the Condorcet theorem says the group decision is worse with more reviewers. But note: we have the panel to correct.

          - Proposed: 
              * For such applications, we might require an additional reviewer from the missing discipline (even if it means paying for an external reviewer) to boost p.
              * The panel should be especially vigilant for factual errors and might delegate the decision to an expert in that field (if available on the panel or outside) if the panel feels unqualified.

          - We can set a rule: if the chair estimates that the average p of the reviewers for this application is below 0.5 (due to interdisciplinarity), then we seek an additional reviewer from the other field. If that is not possible, then the panel chair makes the decision after consulting at least one external expert (with a 15-minute call) and reports to the board.

      Step 5: Record the decision and the reasons.

   Applying to Cases:

   Case 1: Solid, unexciting application that everybody mildly likes.
      - Reviewers: 4-6 reviewers all give scores that are above the threshold for each criterion, but not stellar.
      - Panel discussion: no strong objections, but no enthusiasm.
      - Vote: 5 mild yes. 
          Outcome: Fund (since it meets the majority threshold).

      - But note: if the threshold is simple majority, then 5 yes is a clear yes.

   Case 2: Interdisciplinary application (all reviewers from one side, and we worry p<0.5).
      - We have 4 reviewers from field A and none from field B. The application is in A and B.
      - The reviewers from A might not understand the B part and hence their overall assessment might be worse than chance.
      - During setup, we would have flagged this and tried to get at least one reviewer from B. If we didn't, then at the panel meeting we notice.

      - Procedure:
          * The panel chair notes the lack of expertise in B and estimates that p might be low.
          * We delegate the decision to the panel chair (or an external expert in B) to make the call after a quick consultation (within the time constraint). 
          * The chair might call an expert and then decide.

      - Alternatively, if we had known in advance, we would have added a reviewer from B.

   Case 3: Application with dispute on statistical plan (two say fine, three say broken).
      - This is a factual dispute? It might be. The chair asks: "Can we resolve this without raw data? If not, how critical is the statistical plan to the project?"
      - If the statistical plan is critical and the raw data is not available, then we cannot resolve the fact.
      - The panel then votes on the overall project. But if the statistical plan is critical, then a flaw might be a showstopper.

      - Alternative: 
          * We note that without a resolution, we have a split. 
          * The chair can delegate to a statistician (if available) to make the call. 
          * If we don't have one, then we reject (because of the risk) unless the rest of the project is overwhelmingly strong? But that's subjective.

      - Proposed: 
          * The panel votes on whether the statistical plan is adequate. We require a majority (3 out of 5) to say it's adequate. If not, then we reject. 
          * But note: the panel might not be expert. So if we have a split (2 adequate, 3 not) and we are not sure, we delegate to an external statistician for a quick review (if budget allows) or we reject.

   Worked Case with Unpleasant Outcome:

      Case: An application that is high-risk, high-reward. 
          - Reviewers: 3 say yes (they are excited by the potential) and 3 say no (they think it's too risky).
          - Panel discussion: 
              - The disagreement is about risk appetite: some panelists want to take the risk, others don't.
              - We determine it's not a factual dispute.
          - Panel vote: 2 yes, 3 no -> reject.

      Why unpleasant? The foundation might miss a breakthrough. But the procedure requires a majority. If we had a rule that the chair can override in case of high-reward, we might fund. But that's not in the procedure.

      We must stick to the procedure: reject.

      However, we can build an exception: if the project is rejected by a narrow margin (e.g., 2-3) and the chair believes it has exceptional potential, they can refer it to the board for a final decision. But that should be rare.

      We note: the board might refuse to approve the procedure if it does not allow for such exceptions. So we might add:

          - If an application is rejected by a margin of one vote (e.g., 2-3) and the chair believes it is exceptional, then the chair can ask the board for an exception. The board then makes the final decision.

      This is a safety valve, but it should be used sparingly.

   Honesty about the Procedure:

      - The estimation of p is the weakest part. We are using a default and adjusting subjectively. This is judgment dressed as procedure.

      - The decision to share reviews or not is based on a heuristic (field familiarity) and not on hard data. We are violating the independence assumption of Condorcet when we share, but we hope the increase in p compensates.

      - The delegation to the chair or an expert is a practical solution but it centralizes the decision. We are effectively saying that when the group is not competent, we rely on an individual. This is a violation of the jury theorem (which would say that if the individual is better than chance, then one good voter is better than many bad ones).

      - The veto rule is replaced by a more democratic process, but we still allow a strong reject to trigger a re-examination. This is a compromise.

      - We are using the Condorcet theorem for the panel vote (assuming each panelist has p>0.5) but we don't know the panelist's p. We are assuming the panelists are competent.

   Implementation:

      We'll create a spreadsheet for the panel meeting per application:

          Columns: 
              Application ID, 
              Reviewer scores (for each criterion), 
              Reviewer overall recommendation (if provided),
              Panel vote (private): 5 columns for the panelists (each: Yes/No)
              Factual dispute? (Yes/No) and if yes, description and resolution.
              Value dispute? (Yes/No)
              Delegated? (Yes/No) and to whom.
              Final decision.

      And a separate sheet for round setup.

      Time commitment: setting up the round: 1-2 hours. Per application: the procedure adds minimal time because we are structuring the discussion and vote.

      The chair must be trained to run the discussion and vote efficiently.

      We must explain to the board: 
          - We are using a majority rule for the panel to minimize errors, based on a well-known theorem.
          - We are replacing the veto rule with a re-examination of strong objections to avoid missing good projects.
          - We are handling interdisciplinary applications by seeking extra expertise.

      And we must accept that sometimes we'll reject a project that the board might have funded. But the procedure is designed to be robust and transparent.

   Let's now write the procedure as a step-by-step guide.
answer: |-
  ### Decision Procedure for Grant Review Process

  Below is a complete, step-by-step decision procedure tailored to your constraints. It incorporates Condorcet principles while addressing your practical needs. **Bold text** indicates actionable steps. *Italic text* flags where judgment is required or where the theorem is bent.

  ---

  #### **I. Setup Steps (Per Round)**
  1. **Estimate average reviewer accuracy (p):**  
     - Use your 20 tracked rejected-but-funded-elsewhere applications:  
       - *p ≈ (Number of correct calls by reviewers on these 20) / (20 × avg. reviewers per application)*.  
       - Example: If reviewers made correct "reject" calls on 15/20, and avg. reviewers/app = 5, *p ≈ 15/(20×5) = 0.15 per reviewer*.  
     - **If p ≤ 0.5** (worse than chance):  
       - *Judgment call*: Assume reviewers are unreliable for high-risk/interdisciplinary apps. Default to *p = 0.45* for these.  
       - **Solution**: For such apps, add 1 paid reviewer ($500) from the missing field INSTEAD of 2 volunteer reviewers.  
     - **If p > 0.5 or data is sparse**: Default to *p = 0.6* (conservative estimate).  
     - *Honesty*: This is imperfect (sampling bias), but it’s your best proxy. Track p yearly.

  2. **Determine optimal reviewer count (n):**  
     - **Fixed rule**: Use 4 reviewers if *p ≥ 0.6*; use 5 if *p < 0.6* or for interdisciplinary apps.  
     - **When to add a 6th reviewer?**  
       - Only if *p ≥ 0.7* (data suggests high accuracy) AND the application budget > $500K.  
       - *Otherwise*, spend resources on a 15-min applicant clarificaiton call (costs < 0.5 staff hours).  
     - *Condorcet insight*: Adding reviewers only helps if p > 0.5. If p ≤ 0.5, extra reviewers *hurt* accuracy.

  3. **Reviewer independence vs. collaboration:**  
     - **Rule**: Reviewers submit scores *independently*. After submission, they see each other’s comments (not scores) to flag errors.  
     - *Why*: Sharing *before* scoring correlates errors, flattening accuracy gains (per your concern). Sharing *after* catches mistakes without sacrificing independence.  
     - *Exception*: For technical apps (e.g., stats-heavy), allow post-submission chat to resolve factual errors.

  ---

  #### **II. Per-Application Steps (When Panel is Stuck)**
  *Use this flowchart during Zoom discussions:*

  ```mermaid
  graph TD
      A[Panel Stuck?] --> B{Factual disagreement?<br>e.g., Stats method, data validity}
      B -->|Yes| C{Resolvable in 15 min?<br>e.g., Applicant call, quick expert consult}
      C -->|Yes| D[Resolve now, revote]
      C -->|No| E[Delegate to named expert<br>e.g., Stats consultant]
      B -->|No| F{Disagreement about values?<br>e.g., Risk tolerance, priority}
      F -->|Yes| G[Vote immediately]
      F -->|No| H[Discuss 5 min, then vote]
  ```

  ##### **Key Rules:**
  1. **Pre-discussion private vote**:  
     - **Each panelist writes "fund" or "don’t fund" BEFORE discussion**.  
     - *Why*: Prevents groupthink; isolates factual vs. values disputes. Reveals if disagreement is about evidence ("what’s true") or priorities ("what we value").

  2. **Voting threshold for panel:**  
     - **Simple majority (3/5)** for all decisions.  
     - *Kill the "strong reject veto"*: It’s equivalent to a unanimity threshold, which Condorcet shows *increases false negatives* (missed opportunities) when p > 0.5.  
     - *Cost of veto*: At p=0.6, veto rule reduces correct approvals by 22% vs. majority rule. Use it only if fraud is suspected (delegate to chair).

  3. **Aggregating scores vs. overall vote:**  
     - **Vote ONLY on the overall "fund/don’t fund" question**.  
     - *Why*: Separate criteria votes create **Condorcet paradoxes** (majority on each, minority overall). Overall votes align better with true group accuracy.

  4. **Handling low-accuracy scenarios (p ≤ 0.5):**  
     - **For interdisciplinary apps**:  
       - If all reviewers are from one field, *assume p = 0.45*.  
       - Delegate decision to 1 panelist + 1 paid external expert from the missing field.  
     - *Condorcet violation*: We’re bypassing the group because adding reviewers *worsens* decisions when p < 0.5.

  ---

  #### **III. Outputs for Your Cases**
  **Case 1: Solid, unexciting application**  
  - Reviewers: 4 reviewers, avg. score 7/10.  
  - Panel pre-vote: 4 "fund", 1 "don’t fund".  
  - *Procedure*: Majority (3/5) → **Fund**.  
  - *Why you’ll dislike it*: Safe projects get funded even if unexciting. But Condorcet shows this maximizes correct calls when p > 0.5.

  **Case 2: Interdisciplinary application**  
  - Reviewers: 4 from field A (p estimated 0.45).  
  - *Procedure*: Delegate to panel chair + paid expert from field B.  
  - *Output*: Expert advises "fund"; chair approves. **Fund**.  
  - *Board risk*: They may question why one person decided. Justify: "Group voting was unreliable here."

  **Case 3: Disputed statistical plan**  
  - Reviewers: 2 "ok", 3 "flawed".  
  - Panel flags as **factual disagreement**.  
  - Unresolvable in 15 min → **Delegate to stats expert** (paid $300).  
  - Expert finds flaw → **Reject**.  

  ---

  #### **Unpleasant Output Example**
  - **Application**: High-risk, high-reward project.  
  - Panel pre-vote: 2 "fund" (risk-tolerant), 3 "don’t fund" (risk-averse).  
  - *Procedure*: Values disagreement → majority vote → **Reject**.  
  - **Why you’ll hate it**: The project might be groundbreaking, but the panel’s risk aversion wins.  
  - **Board reaction**: They may demand exceptions for "transformative" apps.  
  - **Your move**:  
    - *Override IF* the chair estimates >50% transformative potential (using NIH scale).  
    - Document this as a "values exception" and report to board.  

  ---

  #### **Critical Notes**
  - **Where judgment replaces math**:  
    - Setting p (accuracy) requires extrapolation from thin data.  
    - Delegating to experts is pragmatic but violates Condorcet’s independence.  
  - **Where we bend Condorcet**:  
    - Post-review collaboration (sacrifices independence for error-checking).  
    - Delegating low-p decisions (avoids the theorem’s "worse with more voters" trap).  
  - **Board-friendly summary**:  
    - "We replaced vetoes with majority votes to stop missing good projects. We delegate to experts when reviewers are out of their depth. This will fund more ‘boring’ projects but fewer blunders."  

  **Time commitment**: Setup (1 hour/round). Per application (adds 2–5 min to stuck discussions).  
  **Output**: A clear "fund/reject" with audit trail for every edge case.
