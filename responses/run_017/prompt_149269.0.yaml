            3. Objection: "with a fair coin flip, no betting rule can beat 50-50 in expectation"

               This is not true. The betting rule can use the evidence (the ball number) to achieve better than 50-50.

               In fact, if the ball number is <=20, then the posterior probability of SHORT is:

                  P(SHORT|number) = P(number|SHORT) * P(SHORT) / [P(number|SHORT)*P(SHORT) + P(number|LONG)*P(LONG)]
                                  = (1/20 * 0.5) / (1/20*0.5 + 1/2000*0.5)
                                  = (0.025) / (0.025 + 0.0005) = 0.025 / 0.0255 ≈ 0.9804

               So they can achieve about 98% chance of being right by betting on SHORT.

               If the number is above 20, then P(SHORT|number)=0, so they are sure it's LONG.

               Overall, the probability of being correct is:

                  P(correct) = P(SHORT) * P(<=20 | SHORT) + P(LONG) * [1 - P(<=20|LONG)] 
                              = 0.5 * 1 + 0.5 * (1 - 20/2000) 
                              = 0.5 * 1 + 0.5 * (1 - 0.01) = 0.5 + 0.5*0.99 = 0.5 + 0.495 = 0.995

               So on average, they win 99.5% of the time? But that's because the evidence is very strong when the number is high.

