answer: |-
  1. **Materials and Setup:**  
     Two opaque bags: SHORT (ping-pong balls numbered 1–20) and LONG (numbered 1–2000); a coin; index cards; pens; poker chips (100 per participant per betting round, plus extras for the change fee); whiteboard listing reference class options: "everyone who has ever lived," "everyone alive right now," "everyone who will ever live," "all mammals," "only people who’ve thought about arguments like this," or "your own: ________."  

  2. **Sealed Card Instruction (Minute 1, Pre-Draw):**  
     "Write secretly which group you count yourself as an ordinary random sample from—no overthinking, pick intuitively. Seal it. Don’t discuss. Options are on the board."  

  3. **Round-by-Round Rules:**  
     - **Draw:** Flip coin (hidden) to pick SHORT or LONG; draw one ball, announce number *N* to all.  
     - **Round 1 Betting:** Each splits 100 chips between SHORT and LONG (e.g., 60 on SHORT, 40 on LONG); record allocations.  
     - **Mid-Game Change Offer:** "You may reopen and change your sealed card now—but it costs 1 chip, paid now, and you must write one line why."  
     - **Round 2 Betting:** Re-split 100 chips (new allocation).  
     - **Payoff:** Reveal bag; double chips on correct bag (e.g., if SHORT drawn and you bet 60 on SHORT, gain 120). Final score: (Round 1 winnings + Round 2 winnings) - 1 chip if card changed.  

  4. **Debrief Mapping:**  
     - Sealed card = implicit choice of reference class (e.g., "everyone who will ever live").  
     - Ball number *N* = birth rank; bags = hypotheses for total observers (small/large).  
     - Betting shifts = realizing *N* suggests total is near *N* (e.g., low *N* favors SHORT).  
     - Card change = awareness that reference class is arbitrary (e.g., switching to "all mammals" avoids doomsday).  
     - Allocation task (15 minutes split: civilisational catastrophe action vs. personal enjoyment) tests belief-behavior consistency.  

  5. **Predictable Problems & Solutions:**  
     - Physicists dominating: Assign them as "silent data recorders" to curb interruptions.  
     - High *N* (e.g., 1500): Use it—it proves LONG, mirroring how high birth ranks refute small-humanity hypotheses.  
     - "Can’t beat 50-50": Objection is wrong; evidence (*N*) shifts odds (e.g., *N*=5 makes SHORT 99% likely). Use scoring to force honest probabilities: betting 0 on LONG when *N*≤20 risks zero chips if wrong.  
     - Unreproducible feature: The game can’t show real-world reference-class ambiguity—state during debrief that "your initial sealed card choice *was* the arbitrary prior."
