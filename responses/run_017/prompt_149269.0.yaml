            3. Round-by-Round Rules:
               - Step 1: Flip coin to choose bag (don't reveal). Draw one ball, show number to all.
               - Step 2: Round1 betting: Each participant splits 100 chips between SHORT and LONG (must use all 100). Record s1 and l1.
               - Step 3: Mid-game: Announce: "You may reopen and change your sealed card, but it costs 1 chip (pay at the end) and you must write one line why." Collect decisions and new cards if any.
               - Step 4: Round2 betting: Each participant splits another 100 chips between SHORT and LONG. Record s2 and l2.
               - Step 5: Reveal the bag. Settle bets: 
                     Round1: if SHORT, winnings1 = 2*s1; if LONG, winnings1 = 2*l1.
                     Round2: similarly, winnings2 = 2*s2 or 2*l2.
                     Total chips = winnings1 + winnings2 - (1 if changed card).
               - Step 6: Allocation task: "You have 15 minutes to allocate between: Task A: doing something real about a civilisational catastrophe; Task B: something you'd just enjoy. Write minutes for A and B."

            4. Debrief Mapping:
               - Ball number = birth rank in the chosen reference class.
               - Bag = total number in the reference class (two hypotheses: small or large).
               - Sealed card = choice of reference class in the real world (not used in the game, but for discussion).
               - Change of card = realizing the reference class is arbitrary and shopping for one that yields a preferred conclusion.
               - Betting = how convinced you are that the total population is small (implying doom soon) or large.
               - Allocation task = does the belief transfer to action?

            5. Predictable Problems and Solutions:
               - Physicists: If they dominate, assign them to record data or help with the draw. Or structure discussion with turns.
               - Big number: If drawn ball >20, then it's definitely LONG. Use to explain that birth ranks beyond the small hypothesis refute it. For birth ranks within both, the update favors small.
               - "Fair coin can't be beaten": Explain that the evidence updates the prior. Use Bayes.
               - Honest betting: Some may not take chips seriously. Emphasize that we will compare scores. Or use a leaderboard for fun.
               - Unreproduced feature: The reference class choice is not part of the game's likelihood. We must explicitly state that in the debrief: "In reality, you choose the reference class, and that choice affects the likelihood. In the game, we fixed it."

