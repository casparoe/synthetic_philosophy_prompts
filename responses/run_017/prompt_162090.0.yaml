  ### Principles for Updating on Conditional Information

  Below, I outline three candidate principles for updating beliefs in response to conditional information, drawing from your cases. Each principle is motivated by specific cases, stated precisely, and applied to your examples. I also discuss how they handle additional scenarios (disjunctions, larger partitions, conflicting informants) and compare them to your intuitive verdicts. Finally, I address your stats friend's "total evidence" advice.

  ---

  ### **Candidate 1: Antecedent-Preserving Conditional Constraints (APCC)**  
  *Inspired by your intuitive approach in Cases 1–3 and the second verdict in Case 4.*

  **Principle Statement**:  
  1. When updating on a conditional constraint of the form "If $A$, then the odds of $X$ are $k:1$" (i.e., $P(X|A) = k/(k+1)$):  
     - Preserve the marginal probability of the antecedent $A$.  
     - Set the conditional probability $P(X|A)$ to the specified value.  
     - For all other events unrelated to the constraint, preserve the conditional structure within each cell of the antecedent partition. Specifically:  
       - If the antecedent partition is $\{A_1, A_2, \dots\}$, and the constraint applies only to $A_i$, preserve $P(Y|A_j)$ for all $j \neq i$ and all relevant $Y$.  
  2. For a material conditional (e.g., "If $A$, then $X$" interpreted as $A \supset X$):  
     - Condition on the event $A \supset X$ (i.e., eliminate possibilities violating $A \supset X$ and renormalize).  
  3. Sequential updates: Apply constraints in sequence, using the current distribution as input for the next update.  

  **Motivating Cases**:  
  - **Case 1 (symmetric odds)**: Message imposes $P(S|R) = 3/4$, $P(S|B) = 3/4$.  
    - Preserve $P(R) = 1/2$ (antecedent marginal).  
