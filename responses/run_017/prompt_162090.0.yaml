  - **Which principle to choose?**  
    - Use **MRE (Candidate 2)** for a principled, order-independent approach that handles arbitrary constraints. It overturns your verdicts in **Case 3** (sector margin changes) and **Case 4** (material conditional), but resolves Case 5 cleanly.  
    - If you strongly favor preserving "silent" branches (Case 3) and antecedent marginals (Case 4), use **APCC (Candidate 1)**, but accept order dependence.  
