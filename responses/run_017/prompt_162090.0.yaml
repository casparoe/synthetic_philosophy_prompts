  **Where It Deviates from Your Intuition**:  
  - **Case 4 (second verdict)**: You considered a constraint-based update (preserving $P(R)$), but APCC defaults to material conditional for certain conditionals.  
  - **Case 5 (sequence)**: Order matters. Updating Case 2 then Case 3 leaves probabilities unchanged (since Case 3 is satisfied). Updating Case 3 then Case 2 gives $\frac{15}{32}, \frac{5}{32}, \frac{3}{32}, \frac{9}{32}$, violating $P(R|S) = 3/4$ (now $5/6$).  
