prompt: |-
  you are a professional philosopher of science — someone who has spent years on inter-theory reduction, the special sciences, and the metaphysics of emergence, but who also reads press releases and knows how the word gets abused. please think carefully and take your time. before you write the final answer, do a private brainstorm: dump twelve to fifteen candidate requirements that somebody or other has demanded of an account of emergence, then prune hard — keep only the ones you can back with a concrete case — and at the very end tell me which candidates you threw out and why. step by step, no rush, and don't hedge everything into mush.

  here's the situation. i'm a journalist covering science and ideas, and i get maybe two embargoed studies a month where the key word is emergent. ant colony foraging trails. a convection cell. superconductivity. some protein folding thing. a new large language model capability. occasionally consciousness. half the time i think emergent is doing real work and half the time it's just a fancy way of saying complicated and surprising, and my editor wants an actual house rule for when we're allowed to print it with a straight face. last week we nearly ran a line about a swarm of robots having more-than-the-sum-of-its-parts behavior and i couldn't articulate what would have to be true for that to mean anything.

  so what i want from you is the spec, not a survey. write me the desiderata: what any adequate account of emergence has to deliver to count as saying something, with the case or consideration behind each requirement, and mark each one non-negotiable, negotiable, or a prejudice of one camp. i'll say up front what it has to be adequate *for*, since i gather that matters: i need criteria that let a non-specialist decide whether a scientific claim of emergence is substantive, or whether it's a shrug in a lab coat. not criteria for settling a metaphysics seminar — criteria for deciding what's worth printing and what questions to ask the researcher on the phone.

  the cases i want handled, at minimum (add better ones if you have them):

  - temperature and pressure, where we all feel like we understand exactly how the macro quantity comes from the micro one, versus something like the wetness of water, where the macro property seems to have no home at the micro level at all
  - a glider in the game of life: perfectly determined by the micro rules, completely invisible in them, and causally active at its own scale
  - a hurricane, or a convection cell: persists while its constituent matter turns over completely, and only exists while energy is flowing through it
  - a traffic jam, or an ant foraging trail: a macro pattern that individual members respond to and that none of them represent, and that survives the total replacement of its parts
  - protein folding, where you can in principle simulate every atom and still not have explained why *this* fold, and where the same fold shows up in chemically quite different sequences
  - the maximal case people actually care about: consciousness, where a good chunk of the audience is hoping emergence does metaphysical work
  - a gerrymandered whole: my hurricane plus one specific nitrogen molecule over the sahara. nothing interesting is true of that conjunction, but i want to know which plausible criteria accidentally let it in, and what has to be added to keep it out
  - the reverse direction: spacetime, or the micro laws themselves, being emergent from something deeper. i don't want a definition that is quietly scale-chauvinist and builds in that small things are the base and big things are the emergent ones

  distinctions i want the account to respect rather than collapse: emergent-for-us versus emergent-in-itself; emergence versus mere complexity or surprise; emergence versus outright inexplicability; the property being emergent versus the object or system; and the big one — irreducible-because-unpredictable versus irreducible-because-not-derivable-even-with-bridge-principles versus irreducible-because-having-novel-causal-power-of-its-own. those three get run together constantly in the copy i read and i want them prised apart.

  there are also three tests my newsroom has been kicking around that i suspect are partly garbage, and i want your verdict on each, separately: (1) the laplace test — nothing counts as emergent unless a demon with complete micro facts and unlimited computing power still couldn't have predicted it; (2) the swap test — if you can swap out the substrate and keep the macro variable and the pattern still holds, that's the mark of the emergent; (3) the funding test — a genuine emergence claim is one that licenses a separate science with its own laws and its own budget, rather than more application of the base science. for each: genuine desideratum, defensible-but-optional, or prejudice dressed up as a requirement? and are any two of them secretly the same requirement wearing hats?

  then the part i most want. flag any pair of desiderata you think can't be jointly satisfied. i'm especially suspicious of the tension between a macro phenomenon having genuinely novel causal power of its own and the micro-level story being causally complete — if the micro facts already fix everything and already do the causing, it's unclear what causal work is left, and i want you to say whether that means the list is jointly unsatisfiable and something has to give, or whether there's a formulation that survives. i also want the tension between emergence requiring genuine surprise and emergence being something a theory can explain and predict. if the list as a whole can't be satisfied, say so plainly — that's a result i can use.

  after that, tell me which *single* requirement does the most work in excluding candidate accounts, i.e. which one is doing the real filtering, and which requirements are the ones people only demand because they already like a certain theory.

  finally, and keep this short because it's not the main event: a compact scorecard, one or two sentences each, no more, on how the familiar stances do against your list — reductionism-with-bridge-principles, strong emergence with genuinely new fundamental laws, the it's-all-about-models-and-coarse-graining line, and emergence-as-multiple-realizability. a block at the end is fine.

  format it as numbered requirements with a short motivating case under each and a verdict line per requirement. and seriously: no citations, no reading lists, no paper titles, no name-dropping — i can't check any of it and it won't help me decide what to print. work from the concepts and argue for the criteria. if you catch yourself about to say as so-and-so argued, don't, just make the argument.
reasoning: |-
  Okay, let me tackle this systematically. The user is a science journalist who needs clear criteria to evaluate when "emergence" claims in scientific studies are substantive versus just buzzwords. They've provided detailed cases and distinctions they want addressed, along with some tests their newsroom uses that might be questionable.

  First, I need to brainstorm candidate requirements for emergence. I'll list 12-15 possibilities based on philosophical literature and concrete scientific examples, then prune rigorously. The key is keeping only criteria backed by actual cases - no armchair theorizing.

  Considering the user's examples: temperature vs wetness, Game of Life gliders, hurricanes, traffic jams, protein folding, consciousness, gerrymandered wholes, and emergent spacetime. Each highlights different aspects of emergence. Temperature shows reducibility with bridge principles, while wetness illustrates qualitative novelty. Gliders demonstrate pattern persistence despite micro turnover. Hurricanes require continuous energy flow. Traffic jams show downward causation where individuals respond to the pattern. Protein folding involves multiple realizability. Consciousness is the hard case where people hope emergence does metaphysical work. Gerrymandered wholes test for accidental groupings. Emergent spacetime challenges scale chauvinism.

  The user also wants key distinctions preserved: epistemic vs ontological emergence, surprise vs true novelty, and different types of irreducibility. And they want verdicts on three tests: Laplace's demon (predictability), substrate swap (multiple realizability), and funding (autonomous sciences).

  For the brainstorm, I'll generate candidates covering: ontological novelty, causal autonomy, irreducibility, unpredictability, pattern persistence, scale relativity, multiple realizability, explanatory autonomy, and more. Then I'll cut any that lack concrete scientific examples. For instance, "non-physical" gets cut because even consciousness research assumes physical bases. "Radical novelty" is too vague without operationalization.

  After pruning, I'll identify tensions - especially between causal completeness at micro-level and genuine macro causal powers. This is crucial for cases like traffic jams where the pattern clearly influences individual behavior. I'll need to address whether downward causation can be reconciled with micro-causal closure.

  The single most discriminating criterion will likely be the causal power requirement - it filters out merely epistemic emergence and forces confrontation with the hard metaphysical issues. Requirements about unpredictability or surprise often reflect reductionist prejudices rather than necessary features.

  Finally, I'll scorecard standard approaches: reductive physicalism handles cases like temperature but fails wetness and consciousness; strong emergence posits new laws but struggles with causal overdetermination; coarse-graining models work for hurricanes but don't capture ontology; multiple realizability explains protein folding but doesn't guarantee causal novelty.

  Throughout, I'll maintain focus on what helps a journalist decide if a study's "emergence" claim is substantive: does it point to something genuinely inexplicable from parts alone, with observable consequences? The criteria must be applicable by non-specialists to real scientific reporting.
answer: |-
  Here is the distilled specification of substantive emergence for scientific journalism, derived from concrete cases and pruned of non-essential or unsupported requirements. Requirements are listed with motivating cases, verdicts (Non-negotiable, Negotiable, Prejudice), and critical tensions highlighted.

  **Pruned Candidates & Why:**
  *   *"Must involve consciousness"*: Prejudice (pan-psychist or mysterian camps). Irrelevant to physics, chemistry, biology examples.
  *   *"Must be non-physical"*: Prejudice (anti-physicalist metaphysics). Contradicted by superconductivity, wetness, traffic jams - all physical.
  *   *"Must be unpredictable *in practice* to humans"*: Epistemic/Subjective. Focus is on the phenomenon, not our limits. (Pruned as "mere complexity/surprise").
  *   *"Must involve downward causation *exclusively*"*: Overly restrictive. Hurricanes constrain air/water movement, but microphysics still causes local motion. Negotiable aspect of causal novelty.
  *   *"Must be fundamentally inexplicable"*: Prejudice (mysterianism). Contradicted by understanding convection cells, phase transitions.
  *   *"Must be irreducible *for all possible descriptions*"*: Too strong. Protein folds are irreducible to atomic trajectories but reducible to statistical mechanics/thermo. Focus on appropriate explanation.
  *   *"Must violate microphysical laws"*: Prejudice (strong emergentism). Contradicted by gliders, convection cells, traffic jams obeying micro laws.
  *   *"Must be unique to complex systems"*: Vague & scale-chauvinist. Water's wetness emerges from simple H₂O.
  *   *"Must show holistic 'gestalt' properties"*: Subjective/Non-operational. Not testable.
  *   *"Must involve intentionality"*: Prejudice (cognitive science). Irrelevant to physics/chemistry emergence.

  **Core Desiderata for Substantive Emergence Claims:**

  1.  **Macroscopic Novelty:** The emergent property/behavior/phenomenon is qualitatively distinct from properties definable or meaningfully attributable to the individual constituent parts *in isolation* or in simple aggregates.
      *   *Case:* **Wetness of Water** (slipperiness, cohesion) vs. individual H₂O molecules (no wetness). **Traffic Jam** (gridlock flow state) vs. individual cars (moving or stopped).
      *   *Verdict:* **Non-negotiable.** (Distinguishes emergence from summation/complexity).

  2.  **Pattern/Property Persistence Under Part Replacement:** The emergent phenomenon maintains its identity and defining characteristics even as its specific constituent parts are exchanged or replaced.
      *   *Case:* **Hurricane/Convection Cell** (structure persists while air/water molecules cycle through). **Ant Foraging Trail** (path persists while individual ants come and go, and even as ants die/replace).
      *   *Verdict:* **Non-negotiable.** (Distinguishes emergence from mere aggregates; handles gerrymandered wholes by requiring persistence *despite* turnover).

  3.  **Collective Dynamics Dependence:** The emergent phenomenon arises *only* from the collective, organized interactions of the constituents under specific conditions; it vanishes if interactions are disrupted or constituents are disorganized.
      *   *Case:* **Convection Cell** (requires temperature gradient driving collective fluid flow). **Superconductivity** (requires collective electron pairing via phonon interactions). Traffic jam dissolves if cars disperse.
      *   *Verdict:* **Non-negotiable.** (Ensures it's genuinely collective, not accidental or inherent in parts).

  4.  **Causal Novelty & Efficacy:** The emergent phenomenon has causal powers at its own level that are distinct from the causal powers of its parts and that exert influence *back* on the parts or on other systems at its scale.
      *   *Case:* **Glider in Game of Life** (moves predictably across grid, "eats" other patterns). **Traffic Jam** (causes drivers to brake/change route upstream, influences city traffic flow). **Hurricane** (causes widespread wind/rain damage, steers weather patterns).
      *   *Verdict:* **Non-negotiable.** (Prevents epiphenomenalism; this is the "more-than-sum" doing work. *Crucial tension point with micro-causal completeness*).

  5.  **Scale-Relative Explanatory Irreducibility:** A complete explanation of the emergent phenomenon *at its own scale* cannot be practically or conceptually replaced by a complete, simultaneous, particle-by-particle micro-level description without loss of explanatory power, predictive efficiency, or understanding of its distinctive causal role. (This allows for ontological reducibility but asserts explanatory autonomy).
      *   *Case:* **Protein Folding** (knowing every atom position doesn't explain *why* this fold is functional/stable; folding pathways & energy landscapes are macro concepts). **Traffic Jam** (micro-description of every car's engine/braking doesn't explain jam formation/dissolution dynamics or its economic impact). **Temperature/Pressure** (micro-reduction *is* possible with bridge laws - hence *not* emergent by this criterion).
      *   *Verdict:* **Non-negotiable.** (Captures the need for autonomous sciences; distinguishes substantive emergence from bridge-principle reduction).

  6.  **Multiple Realizability (Negotiable):** The emergent phenomenon can, in principle, be realized by different underlying substrates or microstructures.
      *   *Case:* **Protein Fold** (same 3D shape/function in different amino acid sequences). **Traffic Jam Pattern** (same jam dynamics with different car models/drivers). **Consciousness?** (hypothetical - silicon substrate, but not demonstrated).
      *   *Verdict:* **Negotiable.** A strong indicator of autonomy (supporting #5), but not strictly necessary (e.g., water's wetness is uniquely H₂O-based, but still emergent).

  7.  **Conditional Existence (Negotiable):** The emergent phenomenon exists only under specific boundary conditions, constraints, or energy flows, and ceases when those conditions change.
      *   *Case:* **Convection Cell/Hurricane** (requires energy gradient). **Superconductivity** (requires low temperature). **Traffic Jam** (requires high density & bottleneck).
      *   *Verdict:* **Negotiable.** Highly characteristic of dissipative structures & many complex systems, but not universal (e.g., a stable protein fold persists without energy input).

  **Handling Reverse Emergence (e.g., Spacetime):**
  *   Requirements 1-5 apply symmetrically. Novelty (#1) would be spacetime geometry; Persistence (#2) might involve stability under quantum fluctuations; Collective Dynamics (#3) would be from quantum entanglement/relations; Causal Novelty (#4) would be spacetime's causal structure; Explanatory Irreducibility (#5) means quantum gravity theories can't *just* list quantum degrees of freedom – they need geometric concepts. Scale chauvinism is avoided.

  **Verdicts on Newsroom Tests:**
  1.  **Laplace Test (Unpredictability by Demon):** **Prejudice dressed as requirement.** Reflects a reductionist view that only unpredictability = emergence. Gliders, convection cells *are* predictable in principle with micro-knowledge + computation, yet satisfy core desiderata (Novelty, Persistence, Causal Efficacy, Explanatory Irreducibility). Confuses epistemic limits with ontological novelty/causal power. *Reject as a requirement.*
  2.  **Swap Test (Substrate Independence):** **Defensible-but-Optional.** This is Multiple Realizability (#6). While a strong *indicator* of explanatory autonomy (#5) and causal novelty (#4), it's not strictly necessary (see wetness). Useful heuristic, not definitional.
  3.  **Funding Test (Licenses Separate Science):** **Genuine Desideratum (reflecting #5).** If a phenomenon *requires* its own concepts, laws, models, and experiments to be effectively explained and predicted at its scale (Explanatory Irreducibility, #5), then it justifies a distinct scientific approach and funding. This is a *consequence* of substantive emergence, not the definition. *Not the same as Swap Test.*

  **Critical Tensions:**
  *   **Causal Novelty (#4) vs. Micro-Causal Completeness:** This is the major tension. If microphysics causally determines everything, how can the macro have *additional*, *novel* causal power? *Resolution Offered:* Macro causal powers are *exercised through* constraining or organizing the micro-dynamics. The traffic jam (macro) *causes* braking by imposing boundary conditions/changing probabilities on individual driver choices (micro). The micro-dynamics remain the "motor," but the macro-state dictates the "trajectory." It's novel causal power at the macro-scale, realized by, but not reducible to, the micro-dynamics. *This is satisfiable, but philosophically contentious.*
  *   **Surprise vs. Explainability:** Core desiderata *require* explainability (#3, #5) but *allow* for genuine novelty (#1, #4) that might be surprising initially. Emergence is about *how* it arises (collectively, irreducibly), not about it being fundamentally mysterious. The tension dissolves by distinguishing epistemic surprise from ontological novelty.

  **The Key Filter:**
  *   **Causal Novelty & Efficacy (#4)** is the single most discriminating requirement. It forces the claim beyond mere pattern recognition (which Novelty #1 covers) and explanatory convenience (covered by #5) into the realm of *the emergent phenomenon having concrete, observable effects that wouldn't exist without the collective organization itself.* This filters out "fancy complexity" and epiphenomena. Requirements like unpredictability (Laplace) or substrate independence (Swap) are often demanded by those already committed to either strong reductionism or strong emergentism, respectively.

  **Compact Scorecard on Familiar Stances:**
  1.  **Reductionism-with-Bridge-Principles:** Fails #4 & #5 (denies genuine causal novelty/autonomy). Handles temperature/pressure, struggles with wetness/protein folding/consciousness. Treats emergence as eliminable.
  2.  **Strong Emergence (New Fundamental Laws):** Embraces #4, risks violating micro-causal closure. Handles novelty but struggles with coherence (overdetermination?) and scientific traction (no clear examples). Often invoked for consciousness.
  3.  **Models/Coarse-Graining:** Focuses on #5 (explanatory irreducibility), often downplays #4 (causal novelty) or treats it as epistemic. Excellent for hurricanes/protein folding, but risks making emergence observer-dependent.
  4.  **Multiple Realizability:** Strongly supports #5 & #6, useful for protein folding/functionalist views of mind. Necessary but not sufficient; doesn't guarantee #1 or #4 on its own (e.g., multiply realizable aggregates may lack novelty/causal power).

  **Your House Rule:** Print "emergent" when the study demonstrates a collective phenomenon that is: (1) **Novel** (unlike its parts), (2) **Persistent** (survives part-swapping), (3) **Collective** (needs interactions), (4) **Causally Potent** (does things at its own scale), and (5) **Requires Its Own Explanation** (can't just be reduced to parts-talk). Ask researchers: "What *causal work* does the emergent phenomenon do that the parts alone don't, and can you explain it without just listing every tiny detail?"
