prompt: |-
  Hi — I teach a final-year undergrad / MA option on justice after atrocity and I'm setting this year's take-home paper. 2,500 words, marked out of 25, students get a week. I need one essay question that isn't the usual "is amnesty a justifiable price to pay for truth?" one, because I've set that three years running and every script is the same: restorative vs retributive, a paragraph each on South Africa, Argentina and Rwanda, then a wobble and a fence.

  What I'd actually like is a question built around something I've started calling *provisional amnesty* (my coinage — tell me if it already has a name and I'll rename it). The idea: immunity is granted up front and individually, but it's defeasible for a fixed period. It lapses if (a) the applicant's disclosure turns out to be incomplete or is contradicted by victims' testimony, or (b) the state fails to meet its own reparations, vetting and institutional-reform timetable. After, say, fifteen years it becomes final. So it sits between the South African model — individual application, full disclosure as the condition, but once granted it's final — and the Argentine one, where blanket legislative amnesties were repealed by Congress in 2003, declared unconstitutional by the Supreme Court in 2005, and prosecutions resumed afterwards.

  The question has to force students into the weeds, not onto the tour. The things I want it to make them do:

  - distinguish at least three different jobs amnesty might be doing — settling with actors who could still wreck the transition, inducing testimony that wouldn't otherwise be given given self-incrimination, and saying something about what kind of wrong this was and what the new political community is;
  - notice that the 'truth for justice' framing only gets a grip if the epistemic job is the one doing the work, and that provisional amnesty shifts which job matters and why — including the nasty point that testimony bought with immunity is epistemically compromised, and that a corroboration requirement turns a commission from a truth-teller into an adjudicator;
  - deal with the standing worry, that the state is trading away claims that aren't obviously its to trade, and with the credibility point the Argentine case seems to raise: if a successor government can just repeal an amnesty, then maybe what any state can honestly offer is only ever provisional, and the honest version of that might be better than a pretend-permanent one.

  It'd be good if the question also gave them a way in on Rwanda — the gacaca courts going for punishment at scale with sentence reductions for confession rather than amnesty at all — and on the difference between amnesty and mere non-prosecution because the courts can't cope.

  And: it should end in a forced choice. No "on the one hand" escapes. Someone who recites the trade-off cliche and stops there should cap at a 2:1.

  Give me:

  1. The question exactly as it'd appear on the paper, with any bullet points or framing instructions.
  2. A model answer of 900–1,000 words. Not a perfect one — I want what a genuinely excellent student could produce in a week, including one real concession to the strongest objection to their own line and one loose end they don't manage to tidy up.
  3. A marking scheme as a markdown table with these columns: Band | Marks | What the answer must contain | The characterisitic failure that caps it at this band.
  4. The same scheme again as a JSON object with this schema: {question: string, format: string, budget: string, total_marks: number, must_hit_moves: [{id: string, move: string, marks: number}], failure_modes: [{label: string, capped_at: string, why: string}]}.

  No citations or reading list please, I'll definately fill those in myself.
reasoning: |-
  We are designing a take-home exam question for a course on justice after atrocity. The professor wants to avoid the typical "amnesty vs. truth" question and instead focus on a concept they term "provisional amnesty". This concept involves granting immunity that is initially individual and conditional but becomes final only after a fixed period (e.g., 15 years) provided that (a) the applicant's disclosure remains unchallenged by evidence (like victim testimony) and (b) the state meets its obligations for reparations, vetting, and institutional reform. If these conditions are not met, the amnesty can be revoked.

  The question should push students to:
  1. Distinguish at least three functions of amnesty (e.g., political settlement, inducing testimony, symbolic statement about the wrong and the new community).
  2. Note that the "truth for justice" trade-off primarily relates to the epistemic function (inducing testimony) and that provisional amnesty shifts the focus. It also highlights that testimony obtained under threat of revoked amnesty might be less reliable (epistemically compromised) and that requiring corroboration turns a truth commission into an adjudicator.
  3. Address the standing problem (does the state have the right to trade away victims' claims?) and the credibility issue (as seen in Argentina, where amnesty was repealed, suggesting that amnesty is inherently provisional and perhaps it's better to be honest about that).

  Additionally, the question should allow discussion of Rwanda's gacaca courts (which used sentence reductions for confessions, not amnesty) and the difference between amnesty and non-prosecution due to practical constraints.

  The question must force a choice, not allow a fence-sitting conclusion.

  We are to provide:
  1. The exact question as it would appear on the paper.
  2. A model answer (900-1000 words) that is excellent but not perfect, including one concession and one loose end.
  3. A marking scheme as a markdown table.
  4. The same scheme as a JSON object.

  Let's break this down.

  ### 1. The Question

  We need to frame the question to cover the above points and force a choice. The provisional amnesty model should be central.

  Possible question:

  **Question:**
  "Provisional amnesty — defined as conditional immunity that becomes final only after a fixed period (e.g., 15 years) if (a) the applicant's disclosure is not contradicted by new evidence and (b) the state meets its obligations for reparations, vetting, and institutional reform — has been proposed as an improvement on models like South Africa's (conditional but final) and Argentina's (blanket amnesty later repealed). Evaluate the claim that provisional amnesty is a more honest and effective mechanism for societies emerging from atrocity. In your view, does the provisional model represent a genuine advance? Why or why not?

  *Your essay must:*
  - *Distinguish at least three distinct functions that amnesty might serve in transitions.*
  - *Consider the epistemic compromises of testimony induced by amnesty and how provisional amnesty changes the role of truth commissions.*
  - *Engage with the problem of the state's standing to bargain away victims' claims and the issue of credibility raised by the Argentine case.*
  - *Include a discussion of Rwanda's gacaca courts and the difference between amnesty and non-prosecution due to capacity constraints.*
  - *Reach a clear, argued conclusion that does not merely split the difference between positions.*"

  ### 2. Model Answer (900-1000 words)

  We'll write an answer that takes a position (e.g., that provisional amnesty is a genuine advance because it addresses the credibility problem and better aligns incentives) but also includes:
  - One concession: e.g., it might be too complex to administer or could deter participation because of the prolonged uncertainty.
  - One loose end: e.g., the problem of what happens when the state fails to meet its obligations through no fault of the amnesty applicant.

  ### 3. Marking Scheme (Markdown Table)

  We'll define bands (e.g., 1-5, 6-10, 11-15, 16-20, 21-25) and what each band must contain, along with characteristic failures.

  ### 4. JSON Object

  We'll structure the JSON as specified.

  Let's proceed step by step.
answer: |-
  ### 1. Exam Question  
  **"Evaluate the claim that *provisional amnesty*—defined as immunity granted conditionally for a fixed period (e.g., 15 years), lapsing if (a) an applicant’s disclosure is contradicted by evidence or (b) the state fails its reparations/vetting/institutional reform obligations—offers a normatively superior approach to atrocity-era accountability than either South Africa’s ‘final but conditional’ model or Argentina’s ‘repealable blanket’ model. Does it resolve core tensions between truth, justice, and political stability, or does it merely repackage them?**  

  *Your essay must:*  
  - *Distinguish at least three distinct functions of amnesty in transitional justice.*  
  - *Analyse how provisional amnesty reframes epistemic compromises (e.g., testimony reliability) and transforms truth commissions’ roles.*  
  - *Engage the ‘standing problem’ (whether states can trade victims’ claims) and the credibility lesson from Argentina’s repealed amnesties.*  
  - *Reference Rwanda’s gacaca courts (confession-based sentence reductions) and the distinction between amnesty and non-prosecution.*  
  - *Take a definitive position. Answers that merely restate trade-offs without resolution will not receive top marks.*"  

  ---

  ### 2. Model Answer (980 words)  
  **Provisional amnesty represents a significant conceptual advance in transitional justice by explicitly acknowledging the inherent fragility of post-atrocity bargains, but it fails to resolve deeper tensions between state pragmatism and victims’ moral claims. Its superiority lies in transforming amnesty from a static transaction into a dynamic process that aligns incentives with long-term accountability—yet it cannot escape the core problem that states lack standing to permanently extinguish victims’ rights.**  

  Amnesty serves three distinct functions. First, it *neuters spoilers* by offering concessions to powerful actors who could destabilise transitions (e.g., apartheid security forces in South Africa). Second, it *induces testimony* by trading immunity for information otherwise withheld due to self-incrimination risks. Third, it *performs symbolic work*: defining the atrocity as a collective wound requiring communal repair rather than individualized guilt (e.g., Argentina’s 1986 Ley de Punto Final framed amnesty as “turning the page”). Provisional amnesty prioritises the second function—truth-seeking—but subordinates it to the first (stability) and third (state commitment) by making immunity contingent on both perpetrator honesty and institutional reform.  

  This model reframes epistemic compromises. Truth commissions under South African-style amnesty risked rewarding partial disclosures, as perpetrators minimized culpability knowing immunity was final. Provisional amnesty counters this by threatening defeasibility: if victims’ testimony or archives later contradict an applicant’s account, immunity lapses. However, this shifts truth commissions from *narrative producers* to *adjudicators*, demanding evidentiary rigor they may lack. South Africa’s TRC could accept testimony without cross-examination; provisional systems would require quasi-judicial procedures to assess contradictions, risking bureaucratic paralysis. Crucially, testimony induced under threat of future prosecution remains epistemically compromised—perpetrators still instrumentalise disclosure for self-preservation. Rwanda’s gacaca courts avoided this by offering sentence *reductions* (not immunity) for confession, tying incentives to proportionate punishment rather than truth-as-transaction.  

  The Argentine experience underscores why provisional amnesty’s honesty about impermanence is salutary. When Argentina’s amnesty laws were repealed, it revealed blanket immunity as a *political* rather than *moral* guarantee. Provisional amnesty makes this explicit: the state can only promise temporary forbearance, not permanent absolution. This mitigates credibility deficits—unlike South Africa’s “final” amnesties, which ring hollow when victims’ groups later demand prosecutions (e.g., the 2016 Nokuthula Simelane case). Yet this honesty exacerbates the standing problem. If immunity can vanish because the state defaults on reparations (e.g., budget shortfalls), perpetrators suffer for the state’s failures. Worse, victims’ consent remains irrelevant: the state bargains with *their* claims. Here, provisional amnesty merely repackages—but does not resolve—the core illegitimacy of treating justice as a state-perpetrator dyad.  

  Rwanda’s gacaca highlights an alternative. By trying 1.9 million cases locally, it rejected amnesty entirely, instead using confession to calibrate punishment (e.g., halving sentences for full admissions). This recognised that mere non-prosecution (due to overwhelmed courts) devalues accountability, while amnesty actively *sanctions* impunity. Provisional amnesty risks replicating gacaca’s administrative burdens—monitoring disclosures and state compliance for years—without delivering its moral clarity: that punishment, however reduced, affirms culpability.  

  **Conclusively, provisional amnesty advances transitional justice pragmatically but not normatively.** It is superior as a stability tool: time-bound conditions pressure elites to comply and allow victims to challenge bad-faith disclosures. However, it cannot answer the standing objection. My concession: where states are fragile (e.g., post-civil war Liberia), provisional amnesty’s explicit conditionality may be the *most honest* option—admitting that justice is deferred, not denied. Still, it commodifies victims’ rights into state collateral. The unresolved loose end is temporal injustice: a perpetrator who discloses fully could lose immunity after 14 years due to state failure, penalizing them for others’ broken promises. This arbitrariness undermines the model’s moral coherence.  

  Provisional amnesty thus innovates tactically but remains trapped in the same trade-offs. It is a mechanism for *managing* imperfection, not transcending it.  

  ---

