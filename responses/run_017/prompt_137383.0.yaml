  | D    | 16–20 | Covers all required elements but with uneven depth; clear position but minor gaps in argument; references Argentina/Rwanda superficially. | "On the one hand..." fence-sitting; vague on functions of amnesty; no concession to counterarguments. |
  | C    | 11–15 | Identifies 2–3 amnesty functions; describes provisional amnesty but doesn’t contrast models; mentions standing/credibility superficially; formulaic Rwanda reference. | Restorative vs. retributive clichés; ignores epistemic or standing issues; no forced choice. |
  | B    | 6–10  | Basic definition of provisional amnesty; lists examples (SA/Argentina/Rwanda) without analysis; no distinct functions; no engagement with core tensions. | Tour of cases without "weeds"; rehashes "truth vs. justice" uncritically. |
