answer: |-
  ## Reconstructing the Logic of Therapeutic Equivalence in Drug Substitution

  This institutional practice provides a rich case study for analyzing the logic of "better than" and "at least as good as" under tolerance. Let's reconstruct its implicit theory step by step.

  **1. Implicit Theory of Comparative Relations: Tolerance, Non-Transitivity, and Pragmatism**

  The core relation operationalized is **"therapeutically equivalent to within an accepted margin (M) relative to a reference standard (R)"**, denoted as `~_M^R`. Crucially:

  *   **Strict Presuppositions:**
      *   **Reference-Relativity:** Equivalence (`~_M^R`) is fundamentally defined relative to a specific reference `R` (the brand-name drug). It is *not* an intrinsic property of a drug pair `(A, B)`.
      *   **Local Tolerance:** The relation `A ~_M^R B` holds iff the measured difference between `A` and `R` (and implicitly `B` and `R`) is ≤ `M` on the relevant pharmacokinetic parameters. Tolerance `M` (the 80-125% band) is a fixed, conventional parameter defining the boundary of acceptability *for substitution purposes*. It is not a claim about indistinguishability or perfect therapeutic identity.
      *   **Non-Transitivity of `~_M^R`:** The practice *strictly presupposes that `~_M^R` is not transitive across different references or within the generic set.* This is evident from the lack of pairwise testing and the explicit allowance for two generics (`A ~_M^R`, `B ~_M^R`) to be non-equivalent to each other (`A !~_M^R B` or `A !~_M^B B`, etc.). The possibility of chained substitution (`Brand ~_M^Brand A`, `A ~_M^Brand B`, `B ~_M^Brand C`, but potentially `Brand !~_M^Brand C`) is built-in and accepted risk management, not an oversight demanding pairwise closure. The practice functions *despite* knowing `~_M^R` lacks full transitivity.
      *   **Sufficiency for Substitution:** For most drugs, `A ~_M^R` is deemed *sufficient* to license substituting `A` for `R` (or for any product `X` that was itself substituted for `R` under `~_M^R`), even if `A` is not directly compared to `X`. The relation licenses *action* based on a local, reference-relative judgment.

  *   **Fits Well With, But Not Strictly Required:**
      *   **Epistemic Interpretation:** The practice is *compatible* with an underlying exact ordering we cannot precisely measure. The tolerance band `M` could represent measurement uncertainty. However, the practice does not *presuppose* this. The band `M` is a normative, conventional threshold defining "good enough for purpose," not necessarily an epistemic boundary. We treat products within `M` as interchangeable *as if* they were identical for therapeutic purposes, regardless of whether there is a "true" underlying order we are approximating.
      *   **Incomparability Interpretation:** It is *compatible* with viewing drugs outside each other's tolerance band as incomparable for substitution purposes. However, the chaining practice itself suggests a weaker stance: while `A` and `C` might be incomparable *directly*, the chain `A~_M^R B~_M^R C` provides a *mediated*, reference-relative warrant for substituting `C` for `A`. The relation `~_M^R` establishes comparability *to R*, not necessarily direct comparability between all generics.
      *   **"No Worse Than Within M" (`≳_M^R`):** The relation likely implies `A ≳_M^R R` (A is no worse than R within M) as a necessary condition for `A ~_M^R R`. (A drug significantly *better* absorbed might raise safety concerns, hence the symmetric band). Crucially, `≳_M^R` also **fails transitivity** under this practice. `A ≳_M^R R` and `B ≳_M^R R` does not imply `A ≳_M^R B` or `B ≳_M^A A`. The practice gets by perfectly well without `≳_M^R` being transitive beyond the immediate link to `R`.

  *   **Underdetermined Aspects:**
      *   **The Nature of `M`:** Is `M` purely conventional? Does it reflect aggregate risk? Is it an approximation of therapeutic non-inferiority? The practice uses `M` operationally without fully specifying its theoretical foundation beyond "accepted for bioequivalence."
      *   **The Strength of Sufficiency:** *Why* is `~_M^R` sufficient for substitution? Is it based on confidence in the average patient, low incremental risk per switch, or a pragmatic cost-benefit trade-off? The practice assumes this sufficiency but leaves its deeper justification implicit.
      *   **The Status of "Better Than":** The practice primarily operationalizes equivalence (`~_M^R`) and "no worse than" (`≳_M^R`). A strict "better than" relation (`>_M^R`), implying being significantly *closer* to `R` than `M` allows, plays little explicit role in substitution decisions within the band. Efficacy is assumed equivalent within `M`.

  **2. The Crux: Failure of Transitivity, Risk, and Spectrum Arguments**

  *   **Genuine Logical Defect or Accumulated Risk?** The failure of transitivity here is **primarily a genuine logical feature of the defined tolerance relation `~_M^R` (and `≳_M^R`)**, not merely a consequence of accumulated risk. The core logic allows `A ~_M^R B` and `B ~_M^R C` without `A ~_M^R C` or `A ~_M^A C`. Risk accumulation is a *consequence* and *practical manifestation* of this non-transitivity in a chained context, not its cause. A defender of the transitivity of a strict "at least as good as" relation (`≥`) can concede that:
      *   The institutional relation `~_M^R` is intentionally non-transitive by design.
      *   Chaining substitutions *based solely on `~_M^R`* can lead to outcomes (e.g., `C` relative to `Brand`) that fall outside the original tolerance band `M`, representing an increased *practical* risk relative to the initial standard.
      However, they maintain this doesn't touch the transitivity of the underlying exact `≥` relation; it only shows that `~_M^R` is a useful but non-transitive proxy for it in contexts involving measurement limitations and cost constraints. The "defect" lies in the proxy, not the ideal.

  *   **Comparison to Imperceptibility Spectra:** A spectrum built on an **explicit, finite tolerance margin `M` is significantly *more* threatening to transitivity defenses** than one built on imperceptibility. Here's why:
      *   **Imperceptibility Arguments:** Often rely on Sorites vulnerability: if `A=B`, `B=C`, ..., `Y=Z` (by indiscernibility), then `A=Z`, contradicting `A≠Z`. Defenders can plausibly attack the tolerance *principle* ("if you can't perceive a difference, there is no difference") or posit hidden sharp boundaries (epistemicism). The "links" are based on a potentially flawed phenomenological or epistemic premise.
      *   **Explicit Tolerance Margin Arguments:** The links (`A ~_M^R B`, `B ~_M^R C`) are **institutionally validated and deemed sufficient for action**. The non-transitivity (`A !~_M^R C`) is an *accepted, operational consequence* of the defined relation. The "links" are robust institutional facts, not vulnerable perceptual judgments. The defender of transitivity cannot dismiss the links as merely apparent; they must argue that the institutional reliance on a non-transitive relation (`~_M^R`) is pragmatically justified *despite* its deviation from the ideal transitive `≥`, or that `~_M^R` tracks a different, contextually valid standard. The logical gap between the operational relation and the ideal transitive relation is starkly exposed and institutionalized.

  **3. Biosimilars and NTI: Stakes, Curves, and Path-Dependence**

  The departures for biosimilars (interchangeability) and NTI drugs reveal heightened sensitivity to the *consequences* of non-transitivity in chained substitutions, but they **do not necessarily presuppose that equivalence to a reference (`~_M^R`) is non-transitive.** Instead, they presuppose:

  1.  **Risk Magnification:** For these products, the *incremental risk per switch* or the *absolute risk* if the patient ends up near the edge of the band is unacceptably high, even if each single switch falls within `M`. The dose-response curve for NTI drugs is steep, meaning small deviations have large clinical consequences. Biosimilars are complex molecules where even small structural differences (`< M` on PK) *might* impact immunogenicity or efficacy in ways small-molecule generics don't. The *cost* of the potential drift inherent in non-transitive chaining is deemed too high.
  2.  **Path-Dependence and Interchangeability as a Sequence Property:** The interchangeability designation for biosimilars **explicitly treats acceptability as a property of a *path* (switching *and* potentially switching back)**. It asks: "Is alternating between `R` and `B` over time as safe and effective as staying on `R` alone?" This is fundamentally a property of the *ordered pair* `(R, B)` under conditions of potential alternation. It implies that "at least as good as *in the context of potential switching*" (denote it `≳_switch`) has a **higher adicity** than the simple binary `≳_M^R`. `≳_switch` considers not just `B` relative to `R`, but the dynamic process of moving between them. It's assessing the *stability* of the therapeutic effect *across* the switch, a property not captured by static bioequivalence alone. This doesn't deny that `~_M^R` is non-transitive; it asserts that `~_M^R` is insufficient to guarantee safety under repeated switching for certain products. The solution is to index the *required strength of equivalence evidence* (from `~_M^R` to `~_switch`) to the *stakes* (risk profile) and the *intended use* (routine substitution implying potential chaining).

  **4. Assessing Reforms: Closure vs. Pairwise Anchoring**

  *   **(a) Worst-Case-Reference Rule:** This aims for transitivity *within the substitutable set* by making `~_M^R*` transitive where `R*` is the worst-case generic. `A ~_M^{R*} R*` implies `A` is within `M` of the farthest point, meaning any two approved generics `A` and `B` are within `2M` of each other. If `M` is small, `2M` might still be acceptable.
      *   **Costs:** Immense practical burden. Requires identifying `R*` and testing new generics against it. `R*` might change as new generics enter. Shrinks the effective tolerance band over time, potentially excluding viable generics and increasing costs. May not reflect actual clinical risk if the parameter space isn't linear or isotropic.
      *   **Repairs Defect or Reduces Risk?** Primarily reduces the *risk* of large cumulative drift by bounding the maximum pairwise difference within the set (`≤ 2M`). It doesn't make `~_M^R` itself transitive (the new relation `~_M^{R*}` is still reference-relative and non-transitive if `R*` changes). The *logical defect* (non-transitivity of the core equivalence relation) remains inherent in the tolerance approach.
      *   **Worth It?** Likely not. The cost (testing burden, reduced competition) is high for a risk reduction that might be achieved through other means (e.g., stricter post-marketing surveillance for chaining effects, patient monitoring for NTI drugs) or deemed acceptable for most drugs under the current system. It imposes a solution designed for the outlier risk on the entire system.

  *   **(b) Current-Product Rule:** Ends routine chaining by requiring direct pairwise equivalence (`A ~_M^X X`) to the patient's *current* medication `X` for substitution.
      *   **Costs:** Effectively destroys the generic substitution system as we know it. Pharmacies would need access to and testing data for every possible pairwise combination. Prescribers would be constantly interrupted for approval switches driven by pharmacy supplier changes. Severely undermines cost-saving benefits of generics.
      *   **Repairs Defect or Reduces Risk?** Eliminates the *practical consequence* of non-transitivity (chained drift) by preventing chains. It doesn't change the logic of `~_M^R`; it simply avoids invoking it in a way that exploits its non-transitivity. The core relation remains non-transitive, but its application is restricted to single hops from a known reference. This drastically reduces *risk* by anchoring each switch to the immediate predecessor.
      *   **Worth It?** Only if the risk of chained substitution is deemed catastrophic *across the board*, which the existence of the current system for most drugs suggests it is not. The cost (system collapse) is prohibitively high.

  *   **Verdict:** Neither reform addresses the *logical* nature of tolerance-based equivalence; they are risk-management strategies. **(b)** is theoretically cleaner in eliminating chaining risk but is practically indefensible due to its cost. **(a)** is a complex, costly attempt to bound pairwise differences without achieving true transitivity. The current system's pragmatic acceptance of non-transitive chaining for most drugs, combined with specific restrictions (biosimilars, NTI) where stakes are high, appears more defensible.

  **5. Respect-Relativity: Containment or Relocation?**

  Locating the tolerance within a specific respect (e.g., average bioequivalence for the approved indication) is crucial but **only relocates the problem within that respect; it does not provide an escape for the transitivity defender.**

  *   **Help:** It isolates the relevant dimension of comparison ("therapeutic effect for indication X via mechanism Y as measured by PK parameters Z"). This prevents spurious claims of non-transitivity arising from comparing drugs on irrelevant dimensions (e.g., color, cost, excipient taste). It defines the specific arena where the tolerance logic operates.
  *   **Hurt/Relocation:** Within this *well-defined respect*, the fundamental logic of tolerance-based comparison still applies. We can *still* construct chains: Drug A is equivalent to Ref R for indication X (within M). Drug B is equivalent to Ref R for indication X (within M). But Drug A may not be equivalent to Drug B for indication X (within M). The potential for non-transitivity is inherent *within the respect itself* due to the tolerance margin. Respect-relativity specifies the domain of application but doesn't alter the formal properties of the `~_M^R` relation operating *within* that domain. The defender of transitivity must still confront the fact that the institutionally operationalized relation `~_M^R` within a specific, well-defined respect is non-transitive and that this non-transitivity has practical consequences (chained drift) deemed acceptable for some purposes but not others.

  **Conclusion**

  The drug substitution practice reveals a sophisticated institutional logic built around a **reference-relative, tolerance-defined equivalence relation (`~_M^R`) that is explicitly non-transitive.** This non-transitivity is not an accidental flaw but a deliberate feature enabling a practical, cost-effective system. While compatible with epistemic or incomparability interpretations, the practice primarily presupposes a pragmatic sufficiency: equivalence to the reference within `M` licenses substitution. The failure of transitivity is a genuine logical property of the defined relation, and the resulting risk of cumulative drift in chains is its practical consequence. Explicit tolerance margins pose a distinct challenge to transitivity defenders compared to imperceptibility arguments, as the non-transitive links are institutionally validated. Exceptions for biosimilars and NTI drugs highlight sensitivity to the stakes of chaining and introduce path-dependent concepts like interchangeability (`~_switch`), showing that "as good as" can have higher adicity in dynamic contexts. Proposed reforms address risk management, not the core logic, and their costs outweigh their benefits compared to the targeted restrictions already in place. Respect-relativity defines the scope of comparison but doesn't resolve the inherent non-transitivity within that scope. This practice demonstrates that robust institutional decision-making can function effectively with explicitly non-transitive comparative relations when tolerance is pragmatically justified, offering a powerful real-world counterpoint to the axiomatic insistence on transitivity for all "at least as good as" relations.
