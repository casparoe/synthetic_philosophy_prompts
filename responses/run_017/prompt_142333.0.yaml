answer: |-
  ### The tree

  Answer the questions based on what feels right for how your alerting policy behaves in each scenario, not on philosophical preferences. Each question has two or three options. Follow the arrows to the next question or to a leaf (final position).

  1. **When the set of error possibilities being considered changes (e.g., for replication lag, we usually check "normal load" but now add "network partition"), does the confidence threshold required for the system to "know" the primary hypothesis (e.g., "lag is acceptable") change?**
     - A: Yes, the threshold shifts based on which errors are in play. → Leaf: Contrastivism
     - B: No, the threshold stays fixed regardless of alternatives. → 2

  2. **For the same evidence (e.g., a replication-lag reading), when used for a low-stakes task (weekly report) versus a high-stakes one (payments failover), must the system meet the same confidence threshold to be described as "knowing"?**
     - A: Yes, the threshold is identical in both contexts. → 3
     - B: No, a higher threshold is needed for high stakes. → 4

  3. **(After A from 2) In a retrospective, we review a case where the system had 0.8 confidence (above the threshold for low-stakes actions) in a true fact, used only for a low-stakes report. Do we say it "knew" at that time?**
     - A: Yes, it knew then because the evidence was sufficient. → 5
     - B: No, it didn’t know then because we always require high confidence. → Leaf: Fixed high bar

  4. **(After B from 2) If stakes increase after evidence is fixed (e.g., a silly bet makes being wrong costly for you), does that change whether the system "knew" at the time the evidence was gathered?**
     - A: No, what it knew then is fixed by the original stakes. → 6
     - B: Yes, we wouldn’t say it knew then under the new high stakes. → 7
     - C: Only if the high stakes make new error possibilities salient. → Leaf: Contextualism (salient alternatives)

  5. **(After A from 3) For a true belief at 0.8 confidence, if we use a higher action threshold (e.g., 0.95) for high-stakes decisions, did the system "know" at 0.8?**
     - A: Yes, it knew at 0.8, but we only act at 0.95 for safety. → Leaf: Knowledge fixed, action threshold moves
     - B: No, knowing requires meeting the higher threshold. → Leaf: Fixed high bar

  6. **(After A from 4) When the system is in a high-stakes context, but a read-only shadow observer (with identical evidence and no stakes) is assessing, must the observer use the same threshold to say the system "knows" as in a low-stakes context?**
     - A: Yes, the observer’s threshold doesn’t depend on the system’s stakes. → [Empty cell: Incoherent—moving threshold requires stakes dependence, but observer ignores stakes]
     - B: No, the observer must adjust the threshold to match the system’s high stakes. → Leaf: Encroachment keyed to subject's stakes

  7. **(After B from 4) If two people assess the same evidence—one with high stakes (e.g., will be blamed if wrong) and one with low stakes—can both be correct when one says the system "knows" and the other says it doesn’t?**
     - A: Yes, both attributions are true relative to their stakes. → Leaf: Relativism
     - B: No, only one can be correct (e.g., the high-stakes assessor sets the standard). → Leaf: Encroachment keyed to attributor's stakes

  ### Leaves
  Each leaf describes a position implied by your answers, with its operational implications for paging thresholds and its most awkward commitment.

  1. **Contrastivism**: Knowledge depends on the specific alternatives being considered (e.g., "normal load" vs. "network partition").  
     - *Awkward commitment*: The system "knows" replication lag is safe for a report but not for failover—even with identical evidence—because different errors are in play.  
     - *Paging threshold*: Moves with which alternatives are salient; set by the alert designer based on context, changing what "knows" means.

  2. **Fixed high bar**: Knowledge requires a fixed, high confidence level (e.g., 0.95), regardless of stakes or context.  
     - *Awkward commitment*: For a low-stakes report, the system might not "know" even with strong evidence (e.g., 0.8) that is actionable and true.  
     - *Paging threshold*: Fixed; set to a high level during policy design; "knows" is invariant, but we may act on lower confidence for low stakes.

  3. **Knowledge fixed, action threshold moves**: Knowledge is fixed by evidence and truth (e.g., at 0.8), while practical factors only affect when we act (e.g., page at 0.95 for high stakes).  
     - *Awkward commitment*: In an incident, saying "I don’t know" (due to high stakes) but later claiming "I knew all along" in a low-stakes standup is truthful.  
     - *Paging threshold*: Moves with stakes; set by the on-call’s context; only the action rule changes, not "knows."

  4. **Contextualism (salient alternatives)**: Knowledge shifts when new error possibilities become salient (e.g., an auditor spoofing telemetry), even if stakes don’t change.  
     - *Awkward commitment*: After an audit, we retroactively say the system didn’t "know" earlier, despite unchanged evidence and stakes.  
     - *Paging threshold*: Moves with which errors are highlighted; set by external factors like audits, changing what "knows" means.

  5. **Encroachment keyed to subject's stakes**: Knowledge depends on the stakes of the subject (e.g., the system or engineer), not the assessor.  
     - *Awkward commitment*: A shadow observer must say the system "knows" less in high-stakes contexts, even though the observer has no skin in the game.  
     - *Paging threshold*: Moves with the system’s operational stakes; set during policy design, changing "knows."

  6. **Encroachment keyed to attributor's stakes**: Knowledge depends on the stakes of whoever is assessing (e.g., the on-call engineer).  
     - *Awkward commitment*: In a post-incident review, whether the system "knew" depends on the reviewer’s personal stakes, not the incident’s reality.  
     - *Paging threshold*: Moves with the assessor’s stakes; set by whoever views the dashboard, changing "knows."

  7. **Relativism**: The truth of "the system knows" varies with who assesses it (e.g., true for a low-stakes assessor, false for a high-stakes one).  
     - *Awkward commitment*: During an incident, both "I know" (from a low-stakes observer) and "I don’t know" (from a high-stakes on-call) are simultaneously true.  
     - *Paging threshold*: Moves with the assessor; set by individual stakeholders, making "knows" subjective.

  8. **Graded view**: Knowledge is a matter of degree (e.g., 0.8 confidence), and "knows" is just a threshold on that scale.  
     - *Awkward commitment*: Saying the system "knows" at 0.95 is arbitrary; it could equally be 0.94 or 0.96 without a clear break.  
     - *Paging threshold*: Fixed or moving based on the view; set by policy, with "knows" being shorthand for crossing a confidence level.

  ### Empty cells and collisions
  - **Empty cells**:  
    - *Node 6A (observer ignores subject’s stakes)*: Incoherent—if knowledge moves with stakes (from Node 4A), but the observer’s threshold doesn’t respond to stakes, it contradicts the stakes-dependence commitment.  
    - *Node 3B (retrospective "no" for 0.8 confidence)*: Unexplored—no position fits denying knowledge in a retrospective when evidence was sufficient for true belief, without invoking high stakes or alternatives.  
    - *Node 4C (stakes raise errors)*: Merely unattractive—positions where stakes only matter by altering salient errors are rare, as most tie stakes directly to thresholds.  

  - **Collisions (indistinguishable leaves)**:  
    - *Encroachment (attributor's stakes) and Relativism*: Both trigger for high-stakes assessors in Node 7, but the tree can’t split cases where only the assessor’s standard shifts (encroachment) versus cases where truth itself shifts (relativism). Example: An attributor bot with severity budget—both views handle it similarly.  
    - *Fixed high bar and Graded view*: If you treat "knows" as crossing a fixed high threshold, the tree can’t separate views where knowledge is binary (fixed bar) versus thresholded degrees (graded), as both answer Node 1A and Node 3B identically.

  ### Where this breaks
  - **Load-bearing node**: Node 2 (stakes dependence in replication-lag scenario) does the heaviest lifting. It splits fixed-threshold views (left branch) from moving-threshold views (right branch), shaping half the tree. If this distinction is flawed, the tree collapses.  
  - **Tree-breaking case**: If stakes are enormous but being wrong wouldn’t change actions (e.g., a critical system with no failover), the tree assumes stakes always affect thresholds or actions. This might force rebuilding to add a "stakes without practical difference" branch.  
  - **Order artifact**: The tree prioritizes alternatives (Node 1) over stakes (Node 2), which may misrepresent if someone’s view is stakes-first. Reordering questions could merge Contextualism and Contrastivism or split Fixed high bar.  
  - **Rebuild trigger**: Scenarios where stakes are high for a colleague but not for you (e.g., a peer’s blame) could blur subject/attributor lines, making Nodes 6–7 ambiguous. A better split might directly ask "whose stakes matter?" early on.
