prompt: |-
  I work in collection documentation at a small maritime museum — I came to it from a philosophy master's I never finished — and my question is less about the metaphysics than about our registrar's track record. Over fifteen years Miriam has had to say, for cataloguing, insurance and loan purposes, whether some present vessel is "the same vessel" as a historic one, and her rulings are these: (i) a cutter whose every timber was replaced one at a time across forty years of continuous service — same vessel; (ii) that same cutter's discarded timbers, bought at auction by a private yard and built into a second hull on the original lines — not the vessel, only a vessel made of its fabric; (iii) a sloop that the museum itself took apart beam by beam, trucked three hundred kilometres inland and reassembled nine months later with new fastenings — same vessel, the interval being a "dormant period" in the object's history; (iv) a trawler rebuilt after a fire over three seasons on her keel and about six per cent of her frames, relaunched under her old name and registration — same vessel, so gradualness was not doing the work; (v) a barge that broke up on a shoal, where two unconnected salvors each salvaged roughly half the timbers and each completed a vessel within a month of the other — neither is the barge, which she entered as "ceased to exist on the night of the wreck," both successors catalogued as reconstructions; (vi) a coaster whose owners scuttled the hull and moved the name, the registration, the bell and the logbooks onto a new hull bought from another yard — a namesake, not the same vessel.

  The case now on her desk is not one I have seen treated anywhere, since the standard discussions all stop at some variant of (i) and (ii), and I would rather have your reasoning than a reading list. A single custodial project split a badly damaged 1890s pilot cutter between two yards: one yard kept roughly sixty per cent of the original fabric — keel, port side, most of the frames — and built a new starboard side around it; the other took roughly forty per cent — starboard planking, deck beams, transom, rigging — and built a new hull around that. The forty-per-cent hull was finished first and has been sailing continuously for seven years under the vessel's original name, carrying the original logbooks and the original registers' entries, and it holds the national registration. The sixty-per-cent hull sat under a tarpaulin for a decade, was launched only last spring, and has since been accepted by a regional register as "the" vessel, which is what has forced the question. There is also a standing proposal from a heritage trust to re-join the surviving original fabric of both hulls into a single display piece twenty years from now.

  What I would like from you is this: set out the rules that fit (i) through (vi) jointly, and say explicitly which natural-looking rules the track record has already eliminated — I take (ii) to be hard on anything that lets fabric or provenance win outright, (v) to be hard on the standard four-dimensionalist treatment of fission, and (vi) to be hard on any view where a name, a registration or a chain of paperwork is what does the work, though my brother insists the new case is relevantly unlike (ii) precisely because both branches descend from one custodial project. Then say what each surviving rule predicts about the sixty-forty split, whether this case is better classified with (iii) and (iv) or with (v), which verdict you expect Miriam to give and why, what she should enter in the catalogue if her precedents genuinely underdetermine it, and what single further case would best separate the rules that still agree — a ninety-ten split, a case in which the minority-fabric branch is also the branch with the continuous service, or the re-joined hull.
reasoning: |-
  Okay, let me start by understanding the user's query. They work at a maritime museum and deal with determining vessel identity over time, especially with cases involving replacement and reconstruction. The registrar, Miriam, has a track record of six cases (i-vi) that set precedents. Now, there's a new case where a pilot cutter was split into two hulls: one with 60% original fabric and another with 40%. Each claims to be the original vessel, and the user wants a consistent set of rules that explain all past decisions and apply to this new case.

  First, I need to analyze Miriam's existing rulings to extract the underlying principles. Case (i) shows that gradual replacement of all parts doesn't affect identity, pointing to continuity of existence. Case (ii) indicates that reassembling original parts into a new hull doesn't make it the same vessel, so material alone isn't sufficient. Case (iii) involves disassembly and reassembly with new fastenings, but it's considered the same vessel due to a "dormant period," emphasizing organizational continuity. Case (iv) is a rebuild after a fire with minimal original structure, yet it's the same vessel, showing that gradualness isn't key. Case (v) deals with two salvors creating two vessels from one wreck; neither is the original, suggesting that simultaneous splits lead to neither being the original. Case (vi) shows that transferring name and registration to a new hull doesn't transfer identity, rejecting nominalism.

  The new case is unique because both hulls derive from a single custodial project, unlike case (ii) where a private yard used discarded timbers. The 40% hull has been sailing with the original name and registration, while the 60% hull was recently launched and registered regionally. There's also a future plan to rejoin the original parts.

  The user wants rules that fit all six cases, identify which natural-looking rules are eliminated, predict the outcome for the new case, and suggest a further case to test the rules. They also want to know if the new case aligns more with (iii)/(iv) or (v), what Miriam might decide, and what to do if the precedents underdetermine the case.

  Looking at Miriam's principles, continuity of organizational existence seems crucial. Cases (i), (iii), and (iv) all involve continuous service or custodianship, even with dormant periods. Material continuity alone isn't sufficient, as in (ii) and (vi). Simultaneous fission, as in (v), results in neither being the original. The new case has a split but without simultaneous completion—the 40% hull was finished first and has been active, while the 60% hull was dormant. This temporal separation might matter.

  The user mentioned their brother's point about the custodial project linking both branches, unlike case (ii). So, the custodial intent could play a role. However, case (v) also involved salvors who weren't connected, leading to two vessels. The key difference might be whether the split is simultaneous or sequential.

  For the new case, applying the rules: The 40% hull has had continuous existence and official registration, aligning with (iii) and (iv). The 60% hull was dormant and only recently activated. If continuity is key, the 40% hull might be considered the original. However, the 60% hull has more original material, but material alone isn't decisive based on (ii) and (vi). The future rejoining proposal adds complexity, but it's speculative.

  Miriam would likely rule the 40% hull as the original because of its continuous service and registration. The 60% hull would be a reconstruction. This fits the precedent where continuous organizational existence trumps material percentage. Case (v) involved simultaneous creation, so it's different. The new case is more like (iii) and (iv) due to the sequential reactivation.

  If precedents underdetermine, the museum should note both claims but list the 40% hull as the original based on continuity. A further case to test could be a 90-10 split where the minor branch is active and the major dormant, to see if minimal material with continuity still holds.
answer: |-
  Based on Miriam's track record (i)-(vi), her rulings reveal a coherent set of principles for vessel identity that prioritize **organizational continuity** over material continuity, provenance, or nominalism. Here's the breakdown, application to the 60-40 split case, and resolution:

  ### Miriam's Implicit Rules (Derived from i-vi)
  1.  **Continuity of Existence Principle:** A vessel remains "the same" if there is unbroken organizational existence (continuous service, custodianship, or intentional dormancy) *even with significant material replacement*. *(Supported by i, iii, iv)*.
  2.  **Anti-Cloning Principle:** Reassembling original fabric into a *new organizational entity* (new construction project, new hull) does not confer original identity, regardless of material percentage. *(Supported by ii, v)*.
  3.  **Singular Succession Principle:** After a destructive event (wreck, fire, scuttling), only *one* successor entity can inherit the original identity, and it requires a demonstrable chain of organizational continuity from the original vessel. This successor must emerge from a *singular, unified custodial project*. *(Supported by iv, v, vi)*.
  4.  **Rejection of Nominalism:** Name, registration, paperwork, or artifacts (bell, logbooks) transferred to a *new organizational entity* do not confer original identity. *(Supported by vi)*.
  5.  **Rejection of Materialism:** Original fabric alone, without organizational continuity, is insufficient for identity. *(Supported by ii, v)*.
  6.  **Dormancy Acceptance:** A planned, custodial pause in active service (disassembly/reassembly) does not break continuity. *(Supported by iii)*.
  7.  **Fission Failure:** Simultaneous creation of multiple successor entities from one source vessel means *neither* is the original. Identity ceases or requires a singular successor. *(Explicit in v)*.

  ### Eliminated Natural-Looking Rules
  *   **Material Majority Rule:** Identity follows the largest portion of original fabric. *(Eliminated by ii: 100% fabric reassembled isn't the vessel; also challenged by iv: 6% fabric retained can be the vessel).*
  *   **Gradualness Requirement:** Identity requires gradual replacement. *(Eliminated by iv: Major non-gradual rebuild retains identity).*
  *   **Provenance Primacy:** Possession of core artifacts (logbooks, bell) or name determines identity. *(Eliminated by vi: New hull with name/logbooks isn't the vessel).*
  *   **Spatial/Temporal Continuity Absolutism:** Physical disassembly/reassembly or relocation automatically breaks identity. *(Eliminated by iii: Disassembly/reassembly with custodial intent preserves identity).*
  *   **Four-Dimensionalist Fission Standard (e.g., Parfit):** Where identity can branch. *(Eliminated by v: Neither salvaged vessel is the original barge; identity ceases).*
  *   **Necessity of Continuous Activity:** A vessel must always be active/afloat. *(Eliminated by iii: Dormant period accepted).*

  ### Analysis of the 60-40 Split Pilot Cutter Case
  *   **The Split:** This was a *single custodial project* resulting in *two distinct organizational entities* (two separate builds at two yards) using the salvaged fabric.
  *   **The 40% Hull (Starboard):**
      *   Finished first, has sailed continuously for 7 years under original name.
      *   Holds original logbooks, registers, and *national* registration.
      *   However, it's a *new organizational entity* built around 40% original fabric. It did not exist continuously from the original cutter; it was constructed using part of its remains.
  *   **The 60% Hull (Port):**
      *   Completed later, sat dormant for a decade.
      *   Accepted by a *regional* register as "the" vessel.
      *   Also a *new organizational entity* built around 60% original fabric. Dormancy isn't the issue (iii allows it); the issue is it wasn't *the* continuous entity before dormancy – it was constructed *after* the split.
  *   **The Re-joining Proposal:** This is speculative and future-dependent. It doesn't change the *current* status of the two existing vessels. If done, it would create a *third* organizational entity.

  **Classification:** This case is **most analogous to (v) - The Barge Fission**, not (iii) or (iv). Like (v):
  1.  A single vessel suffered a destructive event (being "badly damaged").
  2.  Its fabric was split.
  3.  *Two separate, unconnected construction projects* (even if initiated by a single custodial *decision*, the *builds* were separate) created *two distinct new vessels* from the parts.
  4.  Both new vessels claim identity based on fabric and/or registration.

  Unlike (iii) or (iv), there was no *singular* vessel undergoing repair, rebuild, or dormancy. The original cutter ceased to exist organizationally when it was split into two piles of parts destined for two builds. The custodial project initiated two distinct successors, not one.

  **Prediction of Surviving Rules:**
  *   **Rule 1 (Continuity):** Neither hull has unbroken organizational continuity *from* the original cutter. Both are new constructions using original parts.
  *   **Rule 2 (Anti-Cloning):** Both hulls are new constructions built around original fabric.
  *   **Rule 3 (Singular Succession):** The split created *two* successors. Rule 7 (Fission Failure) directly applies: neither can be the original vessel.
  *   **Rule 4 (Nominalism Rejection):** The 40% hull's name, logbooks, and registration are compelling but insufficient per (vi).
  *   **Rule 5 (Materialism Rejection):** The 60% hull's material majority is insufficient per (ii).
  *   **Rule 6 (Dormancy):** The 60% hull's dormancy isn't disqualifying, but it doesn't *establish* identity because the hull wasn't the dormant *original*, it was built *after* the split.
  *   **Rule 7 (Fission Failure):** This is decisive. Two simultaneous successors = neither is the original.

  **Conclusion:** **Neither the 40% hull nor the 60% hull is "the" original 1890s pilot cutter.** The original vessel **ceased to exist organizationally** when it was split for the custodial project. Both current hulls are **reconstructions** or **derivatives** incorporating original fabric. The 40% hull has the stronger *provenancial claim* via name, logs, and registration, but this doesn't make it *identical* to the original vessel per Miriam's precedent (vi).

  ### Expected Miriam Verdict & Catalog Entry
  *   **Expected Verdict:** Miriam will rule that **neither vessel is the original pilot cutter**, consistent with precedent (v). The original vessel ceased to exist upon being split. The 40% hull might be cataloged as the "operational successor" holding the primary provenance, but it won't be "the same vessel."
  *   **Catalog Entry if Underdetermined:** If Miriam feels the custodial link creates ambiguity (though (v) seems clear), she should:
      1.  List the original vessel as "Deaccessioned/dissolved [Date of Split]."
      2.  Catalog the 40% hull as a distinct artifact: "Operational Reconstruction incorporating 40% original fabric of [Original Name], holding original logbooks and national registration. Built by [Yard], launched [Date]."
      3.  Catalog the 60% hull as a distinct artifact: "Static Reconstruction incorporating 60% original fabric of [Original Name]. Built by [Yard], launched [Date]. Accepted by [Regional Register] as representative."
      4.  Note the potential future re-joining project as a possible *new* artifact derived from both.

  ### Best Separating Case
  A **"90-10 Split with Continuous Service Minority"** would best test the remaining rules:
  *   A vessel is catastrophically damaged. A single, swift custodial project recovers 90% of the fabric intact as one piece (keel, most hull), needing minor repairs. Simultaneously, 10% salvaged timbers (deckhouse, fittings) are used by a different team to build a small, functional tender/dory *within weeks*, which immediately enters continuous service using the original name/logs. The 90% portion undergoes a 5-year museum restoration before display.

  **How it Separates Rules:**
  *   **Materialism (Eliminated):** Would favor the 90% portion.
  *   **Nominalism (Eliminated):** Would favor the 10% tender.
  *   **Organizational Continuity/Singular Succession:** Focuses on the custodial chain. If the 90% portion was the *primary focus* of the singular custodial effort and the 10% tender was a secondary, derivative project, the 90% portion *might* be deemed the successor (like iv surviving a fire). If the project treated both as distinct builds from the start, Rule 7 (Fission Failure) applies – neither is original. If the tender's immediate service is seen as a *continuation of the original's function* by the same organization, it *might* have a continuity claim (stretching Rule 1), but Rule 2 (Anti-Cloning) and Rule 7 are strong counterarguments.
  *   **Outcome Prediction:** Miriam would likely rule the 90% portion is the successor vessel (per Rule 3, as the primary, intended product of the custodial effort), and the 10% tender is a derivative artifact/reconstruction. This reinforces Singular Succession and the primacy of the *primary intended outcome* of the custodial project over material percentage or even limited continuous use of a minor part.

  This case highlights the tension between material, nominal claims, and organizational intent within a fission scenario, forcing a clearer prioritization of the *primary custodial object* implied in Rule 3.
