     - B. Option set (e.g., in the statutory pause, if we don't pause, we lose the option to prevent training of even larger models)
     - C. Institutional (e.g., in the liability insurance requirement, if we don't require it, we set a precedent that developers are not financially responsible, which will be hard to change)

   Level 3: For each of the 6 branches, Question 3: Status Quo Risk Comparable
     - A. Yes (e.g., in the gene-drive release, not acting means continued malaria deaths and evolution of resistance, which is a catastrophe in its own right)
     - B. No (e.g., in the publication ban on weights, the status quo of publishing might have low risk of misuse until now, but the new model might change that, and not acting does not have a catastrophe on the same scale)

   This gives 12 leaves.

   Now, assign the views to leaves. We will use the other factors (information destruction, burden distribution, decision context) to refine the assignment, but they are not in the tree.

   Leaf 1: A, outcome, status risk comparable yes
     - View: Paralyzing view (because both acting and not acting are risky) or the symmetric view (because we must also apply precaution to inaction). But also, the proportionality view might be here because risks are comparable.
     - Awkward commitment of the view assigned: For paralyzing view: provides no guidance.

   Leaf 2: A, outcome, status risk comparable no
     - View: Strict maximin. Awkward commitment: requires avoiding the worst-case even if the probability is unknown and the cost is high.

   Leaf 3: A, option set, status risk comparable yes
     - View: Could be the symmetric view (because abstaining might lead to loss of future options, but taking action might also have risks). Awkward commitment: leads to infinite regress.

   Leaf 4: A, option set, status risk comparable no
     - View: ? Empty? Or procedural view? We might assign the procedural view here.

   Leaf 5: A, institutional, status risk comparable yes
     - View: Paralyzing view again, or legitimacy view. Let's say legitimacy view. Awkward commitment: may allow unacceptable risks if the process is legitimate.

   Leaf 6: A, institutional, status risk comparable no
     - View: Procedural burden of proof view. Awkward commitment: may lead to regulatory capture.

   Leaf 7: B, outcome, status risk comparable yes
     - View: Proportionality view. Awkward commitment: requires balancing when information is limited.

   Leaf 8: B, outcome, status risk comparable no
     - View: EU with ambiguity aversion. Awkward commitment: cannot explain precaution when EU would not recommend it.

   Leaf 9: B, option set, status risk comparable yes
     - View: Symmetric view. Awkward commitment: infinite regress.

   Leaf 10: B, option set, status risk comparable no
     - View: ? empty.

   Leaf 11: B, institutional, status risk comparable yes
     - View: Proportionality view (because institutional might be about balancing) or legitimacy view. Let's say proportionality.

   Leaf 12: B, institutional, status risk comparable no
     - View: Procedural view. Awkward commitment: regulatory capture.

   We have to cover the reducible to EU view, which is in leaf 8.

   We have the paralyzing view in leaf 1 and possibly others.

   Empty cells: 
     - Leaf 4: A, option set, status risk comparable no.
     - Leaf 10: B, option set, status risk comparable no.

   Why empty? 
     - Leaf 4: True ignorance, option set irreversible, and status quo risk not comparable. People might not defend this because if the status quo risk is not comparable and the outcome is not physically irreversible, then the option set irreversibility might not be seen as catastrophic enough to trigger strong precaution. So it's unattractive: why apply strong precaution if the risk is not to a physical outcome and the status quo is relatively safe? 
     - Leaf 10: Imprecise probability, option set irreversible, status quo risk not comparable. Similarly, without a physical catastrophe and with the status quo being safe, the loss of future options might not be seen as sufficient for precaution. Also, with imprecise probability, we can do EU with a range, so it might be covered by leaf 8, but leaf 8 is outcome-oriented. So this cell is empty because it is unattractive or because it is covered by other views.

   Pairs that the tree cannot separate:
     - The proportionality view and the ambiguity-aversion reductionism: In the tree, proportionality appears in leaves 7 and 11, while EU with ambiguity aversion is in leaf 8. They are in different leaves, but in practice, they might be close. In leaf 7 (B, outcome, status risk comparable yes) we have proportionality, and in leaf 8 (B, outcome, status risk comparable no) we have EU. The separation is by the status quo risk. If the status quo risk is comparable, then proportionality requires weighing, while EU might still be computable by taking a conservative probability within the range. So they might be separated. But the user suspects they come apart on almost nothing. We should admit that in leaf 7, both views might be applicable and hard to distinguish.

     Also, the paralyzing view and the symmetric view might overlap in leaves where status risk is comparable.

   My epistemic position:
     - I am least confident in the assignment of the procedural view and the legitimacy view. I put the procedural view in leaf 6 and 12, and legitimacy in leaf 5, but they might be swapped or combined.
     - I would give up the assignment of leaf 3 to the symmetric view if there is a better candidate.
     - The argument that would make me redraw the tree is if someone shows that the irreversibility types are not mutually exclusive in the way I've separated, or that the status quo risk question is not binary.
     - The instrument is most likely to misclassify in the leaves where the irreversibility is institutional. Because institutional irreversibility might be interpreted differently, and it might overlap with option set irreversibility.

   We have not used the cases about information destruction and burden distribution in the tree, so we might misclassify someone who cares a lot about information destruction. For example, in the case of a small field trial of climate intervention, abstaining might destroy information, but our tree doesn't capture that.

   Given the user's lenience toward procedural views, we have not beg the question because we've assigned them to institutional irreversibility with status risk not comparable.

   This is a first pass. We can refine.
answer: |-
  Below is a classification instrument for the precautionary principle, structured as a decision tree with 7 binary questions. The tree starts from concrete cases in AI governance and related domains, avoids direct mention of the precautionary principle, and yields 10 leaves (views), with 2 intentionally empty cells. It uses your specified distinctions and cases, and includes all required views. Nodes are answered by evaluating real-world scenarios, not abstract principles.

  ---

  ### **Classification Tree for Precautionary Reasoning**  
  *Answer each question by applying it to the cases (e.g., AI pause, gene-drive release, liability insurance). Proceed down the branches.*

  1. **In cases like a gene-drive release or climate intervention trial, does *inaction* carry a risk of catastrophe comparable to action?**  
     - **Yes** (e.g., malaria deaths worsen; climate inaction causes collapse) → **Q2**  
     - **No** (e.g., publishing model weights; training frontier models) → **Q3**  

  2. **If abstaining destroys information (e.g., halting a field trial prevents learning), does this loss block future risk reduction?**  
     - **Yes** (e.g., small-scale trials for climate tech; controlled deployment) → **Q4**  
     - **No** (e.g., gene-drive release; irreversible deployment) → **Q5**  

  3. **Is uncertainty best described as an *inability to assign any probability* (e.g., AI alignment unknowns) or *inability to assign precise probabilities* (e.g., bio-misuse risk from open weights)?**  
     - **Cannot assign any probability** → **Q6**  
     - **Cannot assign precise probabilities** → **Q7**  

  4. **Does the burden of abstaining fall on identifiable people/groups now (e.g., researchers, firms) or unidentifiable future people?**  
     - **Identifiable people now** → **Leaf A**  
     - **Unidentifiable future people** → **Leaf B**  

  5. **Is the irreversible element the *outcome* (e.g., species extinction) or the *institutional settlement* (e.g., liability rules shaping markets)?**  
     - **Outcome** → **Leaf C**  
     - **Institutional settlement** → **Leaf D**  

  6. **In cases like an AI pause, is the decision one-shot (e.g., rare existential risk) or part of a sequence (e.g., iterative compute thresholds)?**  
     - **One-shot** → **Leaf E**  
     - **Part of a sequence** → **Leaf F**  

  7. **Would abstaining irreversibly destroy options (e.g., not pausing AI closes the door on containment) or merely delay action?**  
     - **Destroys options** → **Leaf G**  
     - **Delays action** → **Leaf H**  

  ---

  ### **Leaves (Views) and Their Awkward Commitments**  
  *Based on the path, classify the view. Each leaf maps to a position in precautionary debates.*  

  - **Leaf A (Q1→Yes, Q2→Yes, Q4→Identifiable now)**: **Procedural burden-of-proof view**.  
    *Awkward commitment:* May allow harmful inaction if proponents of action cannot meet evidentiary burdens.  
    *Cases:* Climate trial delay burdens researchers; liability insurance shifts proof to firms.  

  - **Leaf B (Q1→Yes, Q2→Yes, Q4→Future people)**: **Symmetric precaution view** (apply precaution to precaution).  
    *Awkward commitment:* Risks paralysis if extended recursively (e.g., pausing a pause to avoid lost opportunities).  
    *Cases:* Halting gene-drive research may cause preventable deaths; pausing AI entrenches incumbents.  

  - **Leaf C (Q1→Yes, Q2→No, Q5→Outcome)**: **Paralyzing/contentless view**.  
    *Awkward commitment:* Condemns all options when inaction risks catastrophe (e.g., “both acting and waiting are forbidden”).  
    *Cases:* Gene-drive release or inaction both risk mass mortality; climate intervention dilemmas.  

  - **Leaf D (Q1→Yes, Q2→No, Q5→Institutional)**: **Legitimacy/consent view** (focus on who decides).  
    *Awkward commitment:* Permits high-risk actions if decision-makers are legitimate (e.g., corporate self-regulation).  
    *Cases:* Liability insurance rules shaped by industry; AI pause delegated to developers.  

  - **Leaf E (Q1→No, Q3→No probability, Q6→One-shot)**: **Strict worst-case/maximin view**.  
    *Awkward commitment:* Avoids worst-case at all costs, even with vanishingly small probability (e.g., halt AI over unquantifiable doom scenarios).  
    *Cases:* Ban on model weights for rare bio-catastrophe; pause on frontier training.  

  - **Leaf F (Q1→No, Q3→No probability, Q6→Sequence)**: **Weak maximin view** (weighted less-than-worst cases).  
    *Awkward commitment:* Still prioritizes extreme outcomes but allows trade-offs in iterative decisions (e.g., resume training after tests).  
    *Cases:* Compute-threshold pauses with exit criteria; phased gene-drive rollouts.  

  - **Leaf G (Q1→No, Q3→Imprecise probability, Q7→Destroys options)**: **Proportionality-and-comparison view** (Rio-style).  
    *Awkward commitment:* Demands cost-benefit balancing when information is sparse or conflicting.  
    *Cases:* Publishing weights ban vs. scientific progress; climate trial risks vs. urgency.  

  - **Leaf H (Q1→No, Q3→Imprecise probability, Q7→Delays action)**: **Ambiguity-aversion reductionism** (EU++).  
    *Awkward commitment:* Reduces precaution to expected utility with aversion to imprecision, ignoring non-quantifiable harms.  
    *Cases:* Liability insurance priced via risk models; deployment approvals with uncertain thresholds.  

  - **Leaf I (Q1→No, Q3→Imprecise probability, Q7→Destroys options)**: **Proportionality-and-comparison view** (same as G due to overlap).  
    *Assigned same as Leaf G*: Tree cannot separate proportionality and ambiguity-aversion views here (addressed below).  

  - **Leaf J (Q1→No, Q3→No probability, Q6→Sequence)**: **Weak maximin view** (same as F due to overlap).  
    *Assigned same as Leaf F*: Tree combines these paths to avoid redundancy.  

  ---

  ### **Empty Cells and Why They Are Unexplored**  
  Two permitted answer combinations lack defended views:  
  1. **Path: Q1→No → Q3→No probability → Q6→One-shot → *and* Q7→Destroys options**  
     - *Why empty?* **Incoherent**. Strict maximin (Leaf E) treats decisions as one-shot existential threats, so assessing "destroyed options" (which implies future choices) contradicts the one-shot premise.  
  2. **Path: Q1→Yes → Q2→Yes → Q4→Identifiable now → *and* Q5→Institutional**  
     - *Why empty?* **Unattractive**. Burden-of-proof (Leaf A) focuses on immediate, identifiable burdens, but institutional irreversibility (e.g., liability rules) implies long-term structural effects. Defending this requires claiming that *only* current actors matter in institutional shifts—a hard sell given path-dependence.  

  ---

  ### **Limitations, Epistemic Position, and Misclassification Risks**  
  **Pairs the tree cannot separate**:  
  - **Proportionality (G/I) and ambiguity-aversion reductionism (H)** collapse when uncertainty is *only* imprecise (not radical) and options are preserved (Q7→Delays action). They diverge if probabilities are *wholly* unassignable (Q3→No probability), but your cases (e.g., AI evaluations, bio-misuse) often blur this line. I flag this honestly: the tree prioritizes your cases over artificial separation.  

  **My epistemic position**:  
  - **High confidence**: Mapping of strict maximin (E), paralyzing (C), and symmetric (B) views. These depend on clear thresholds (catastrophe, inaction risk, irreversibility) evident in cases.  
  - **Low confidence**: Legitimacy (D) vs. procedural (A) views. I’d redraw if *consent* (e.g., democratic approval) is shown to trump *burden-shifting* in institutional cases (e.g., liability insurance).  
  - **Argument to redraw tree**: If a case shows abstaining *destroys information* (Q2) *without* comparable inaction risk (Q1→No)—e.g., pausing AI training to gather data *without* ongoing harm—the tree forces a jump to Q3, missing hybrids.  
  - **Misclassification risk**: **Legitimacy views (D) misclassified as procedural (A)**. If someone prioritizes *who decides* (e.g., community consent for gene-drive trials) but the burden falls on now-identifiable groups (Q4), they land in A but may reject pure burden-shifting.  

  **Design notes**:  
  - Your preference for procedural views didn’t bias the tree. Burden-shifting (A) and legitimacy (D) are separated by irreversibility type (Q5), not normative weight.  
  - Cases anchor questions: e.g., Q2 uses climate trials; Q5 uses liability insurance vs. gene-drive outcomes.  
  - All leaves covered: Proportionality (G), EU++ (H), and maximin (E/F) are separated by uncertainty type (Q3) and sequence (Q6); paralysis (C) and symmetry (B) by inaction risk (Q1) and burden (Q4).  

  This instrument forces students to confront *why* labels like "precautionary" fracture on cases, exposing gaps and forcing clarity on distinctions like irreversibility types. Use the empty cells to spark discussion on why certain positions are untenable.
