  We are designing a classroom simulation for an 80-minute undergraduate seminar. The goal is for students to experience three key insights:
   (i) Aggregation method (absolute count vs. rate) can reverse a trend.
   (ii) Decisions about what counts as a violent incident are substantive and contested.
   (iii) The question "was this period more violent?" may not have a determinate answer prior to choosing a measure.

   Constraints:
   - Fictional chronicle: 6 periods, population table, ledger of 45-60 violent incidents.
     - Absolute deaths roughly double, rate per capita roughly halves.
     - Include 8-12 boundary cases (e.g., death in custody, execution, duel, etc.)
     - Also incorporate reporting quality: earlier periods have less detailed reporting (only "notable" deaths), later periods more detailed (single-victim incidents).
   - Two groups (A and B) with different instructions (without using technical terms) leading to conflicting rankings.
     - Group A: rank by "how much violence"
     - Group B: rank by "how dangerous it was to be a person"
   - Optionally, a third group (C) to code the ledger with a bare definition and see where they disagree.
   - Reporting quality as a fourth element? If too much, we might cut it.

   Brainstorming candidate mechanics:

   Candidate 1: 
     - We have a ledger of incidents, each with a period, a description, and a victim count.
     - Groups A and B are given the ledger and population figures. Group A is told to count the total number of violent deaths and rank periods by that total. Group B is told to consider the risk to an individual and rank by that risk (without saying "per capita"). We expect Group A to see an increasing trend (absolute count doubles) and Group B to see a decreasing trend (rate halves). But we don't want to use the words "absolute" or "rate".

   Candidate 2:
     - We don't give explicit instructions on how to aggregate, just the ranking task. This might be too vague and lead to both groups doing the same thing. We need the instructions to nudge them toward different aggregations without using the forbidden words.

   Candidate 3:
     - Group A: "Rank the periods from the one with the most violent deaths to the one with the fewest." (This is absolute count)
     - Group B: "Rank the periods from the one where an individual was most likely to die by violence to the one where they were least likely." (This is rate per capita)

   Why discard candidate 2? Because without clear guidance, the groups might not diverge. We need the instructions to reliably produce the two different rankings.

   Candidate 4: 
     - For the boundary cases, we have a third group (Group C) that is given a very short definition of violence (e.g., "the intentional use of physical force resulting in death") and then codes each incident as violence or not. We can then compare their coding with the original ledger (which included those boundary cases as counted, but Group C might exclude some). However, this adds complexity and time.

   We are constrained by time (80 minutes). We have two main tasks: the aggregation task (Groups A and B) and the boundary task (Group C). Also, we want to include reporting quality.

