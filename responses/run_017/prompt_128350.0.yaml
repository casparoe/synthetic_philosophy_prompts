answer: |-
  ### **Brainstorming Candidate Mechanics**
  1. **Mechanic A: Single-Group Aggregation Puzzle**  
     *Idea:* One group receives the entire ledger and population data, tasked with producing both absolute and per capita rankings.  
     *Discard:* Fails to create experiential conflict—participants would immediately see both methods, reducing the "aha" moment when discovering the reversal.  

  2. **Mechanic B: Incident Reclassification Race**  
     *Idea:* Groups compete to reclassify boundary incidents fastest, then calculate rankings.  
     *Discard:* Overemphasizes speed, detracting from conceptual depth. Risk of arbitrary decisions without deliberation.  

  3. **Mechanic C: Reporting Bias Simulation**  
     *Idea:* Groups receive period-specific "archives" with varying detail, then compare findings.  
     *Discard:* Too complex for 80 minutes; dilutes focus on aggregation and boundary disputes. **Cut this element** to prioritize (i) and (ii).  

  **Chosen Mechanics:**  
  - **Group A:** Ranks periods by "how much violence" (absolute count).  
  - **Group B:** Ranks by "how dangerous to be a person" (rate).  
  - **Group C:** Codes boundary incidents using a minimal definition to surface contested cases.  
  - **Reporting quality:** Embedded in the ledger (earlier periods list only large incidents), discussed in debrief.  

  ---

  ### **Fictional Chronicle: The Veridian Archipelago (P1–P6)**  
  **Population Table:**  
  | Period | Population |  
  |--------|------------|  
  | P1     | 100,000    |  
  | P2     | 150,000    |  
  | P3     | 250,000    |  
  | P4     | 400,000    |  
  | P5     | 600,000    |  
  | P6     | 1,000,000  |  

  **Violent Deaths (Total = 830):**  
  - **P1:** 100 deaths (3 incidents)  
  - **P2:** 110 deaths (6 incidents)  
  - **P3:** 120 deaths (9 incidents)  
  - **P4:** 140 deaths (12 incidents)  
  - **P5:** 160 deaths (15 incidents)  
  - **P6:** 200 deaths (15 incidents) *[60 total incidents]*  

  **Trends:**  
  - Absolute deaths rise (100 → 200, doubling).  
  - Rate per capita halves (0.100% → 0.050%).  

  **Ledger Excerpt (Full ledger: 60 incidents, 1 line each):**  
  ```plaintext
  P1: Uprising at Oak Valley: 50 rebels killed by royal forces.  
  P1: Famine after grain requisition: 30 starved. [BOUNDARY]  
  P1: Mine collapse during forced labor: 20 dead. [BOUNDARY]  
  P2: Protest dispersal: Officers shot 25 civilians. [BOUNDARY]  
  ...  
  P3: Prison fever outbreak: 10 inmates died. [BOUNDARY]  
  ...  
  P6: Execution of dissident: 1 hanged after trial. [BOUNDARY]  
  P6: Factory accident (sabotaged machinery): 5 dead. [BOUNDARY]  
  ```  
  **Key Features:**  
  - **12 boundary incidents** (e.g., state violence, famine, accidents, duels).  
  - **Reporting quality:** P1–P3 list only mass incidents (e.g., "50 rebels killed"); P4–P6 include single deaths (e.g., "dissident executed").  

  ---

  ### **Materials List**  
  1. **Handouts:**  
     - Population table (all groups).  
     - Full incident ledger (Groups A & B).  
     - Boundary incidents sheet (12 cases + definition) (Group C).  
     - Rule sheets (A/B/C).  
  2. **Whiteboard setup:**  
     - Left: Group A ranking.  
     - Right: Group B ranking.  
     - Bottom: Group C’s contested incidents.  
  3. **Other:** Markers, timers, paper for notes.  

  ---

  ### **Rule Sheets**  
  **Group A (Absolute Count):**  
  > "TASK: Rank periods 1–6 from MOST to LEAST violent.  
  > HOW:  
  > - Count the total violent deaths in each period using the ledger.  
  > - Rank #1 (most deaths) to #6 (fewest deaths).  
  > DO NOT use math terms like ‘rate’ or ‘per head’. Focus on TOTAL IMPACT."  

  **Group B (Per Capita Risk):**  
  > "TASK: Rank periods 1–6 from MOST to LEAST dangerous for a person living there.  
  > HOW:  
  > - Use the ledger and population table.  
  > - Consider: ‘If I lived then, how likely was I to die violently?’  
  > - Rank #1 (most dangerous) to #6 (safest).  
  > DO NOT use math terms. Focus on PERSONAL DANGER."  

  **Group C (Boundary Incidents):**  
  > "TASK: Decide which incidents count as ‘violent deaths’.  
  > DEFINITION: ‘Violence = intentional physical force causing death.’  
  > HOW:  
  > - For each incident, vote: COUNT or NOT COUNT.  
  > - Note disagreements. Be ready to explain WHY.  
  > FOCUS: Is this death ‘violent’ per the definition?"  

  ---

  ### **Minute-by-Minute Timeline**  
  **0–5 min: Setup**  
  - Introduce Veridia as a fictional archipelago. Distribute materials. Split into groups (6 per group).  

  **5–35 min: Group Work**  
  - Groups A/B: Calculate rankings (20 min).  
  - Group C: Code 12 boundary incidents (20 min).  
  - *Predictable issue:* Group B may miss rate calculation.  
    - *Fix:* Circulate, ask: "How would YOU estimate personal risk?"  

  **35–50 min: Reporting**  
  - Groups A/B write rankings side-by-side on whiteboard.  
  - **Clash:** A: P6 > P5 > P4 > P3 > P2 > P1 (most violent first).  
    B: P1 > P2 > P3 > P4 > P5 > P6 (most dangerous first).  
  - Group C lists 2–3 contested incidents (e.g., famine, prison fever).  

  **50–80 min: Debrief**  
  - **Q1:** "Why do A and B disagree?" *→* Surface aggregation methods.  
  - **Q2:** "Why did C disagree on incidents?" *→* Boundary decisions are substantive.  
  - **Q3:** "Was P1 truly ‘more violent’ than P6?" *→* Challenge determinacy.  
  - **Key points:**  
    - (i) **Trend reversal** = aggregation choice (absolute vs. rate).  
    - (ii) **Boundary disputes** = conceptual, not clerical (e.g., famine: structural violence?).  
    - (iii) **No determinate answer** without defining "violent" and "more."  

  ---

  ### **Debrief: Mapping Insights**  
  1. **Aggregation Reversal (i):**  
     - *When:* Groups A/B reveal conflicting rankings.  
     - *Point:* Same data, opposite trends—depends on whether we measure total harm (A) or individual risk (B).  
     - *Distinction:* Not "we cannot find out" (epistemic) but "the question lacks meaning without specifying *what to measure*" (interest-relative).  

  2. **Boundary Disputes (ii):**  
     - *When:* Group C debates incidents (e.g., "Is a state execution violence?").  
     - *Point:* Coding requires value judgments (e.g., is structural harm "violent"?).  
     - *Distinction:* Disagreements aren’t clerical errors; they reflect **competing conceptions of violence**.  

  3. **No Determinate Answer (iii):**  
     - *When:* Q3 in debrief ("Was P1 more violent?").  
     - *Point:* Answers depend on:  
       - *Aggregation method* (absolute vs. rate).  
       - *Boundary rules* (which incidents count).  
       - *Reporting gaps* (e.g., P1’s uncounted famines).  
     - *Distinction:* **No fact of the matter exists** prior to choosing measures (ontological), not just "we lack data" (epistemic).  

  ---

  ### **Predictable Failures & Fixes**  
  1. **Group B calculates absolute counts:**  
     - *Why:* "Danger" feels intuitive as total chaos.  
     - *Fix:* Redirect: "If YOU lived there, would you care about total deaths or your personal odds?"  

  2. **Group C unanimous on boundaries:**  
     - *Why:* Dominant personalities or haste.  
     - *Fix:* Assign roles (advocate for/against counting) to force debate.  

  3. **Students conflate reporting gaps with "no fact":**  
     - *Why:* Epistemic uncertainty feels salient.  
     - *Fix:* Clarify: "Even with perfect data, would P1 vs. P6 have one answer?"  

  ---

  ### **Limitations & Instructor Supplements**  
  **What the Activity Cannot Show:**  
  - It **demonstrates reasonable disagreement** but cannot prove whether violence has an objective ontology. Students may infer "no fact of the matter," but the activity only shows that **answers are measure-relative**.  

  **What You Must Supply in Debrief:**  
  1. **Philosophical Framing:**  
     - Distinguish:  
       - *Ontological indeterminacy:* "Violence" isn’t a natural kind.  
       - *Epistemic limits:* Reporting gaps obscure truth.  
       - *Interest-relativity:* Measures reflect priorities (e.g., state vs. individual).  
  2. **Real-World Context:**  
     - Link to cases (e.g., coding "terrorism" vs. "freedom fighting"; UN casualty thresholds).  
  3. **Ethical Weight:**  
     - Stress: Boundary rules aren’t neutral—they amplify or silence victims (e.g., famine as state violence).  

  **Final Note:**  
  This simulation creates visceral engagement with measurement dilemmas. Its power lies in students *feeling* the ambiguity before labeling it—setting the stage for deeper critique of violence statistics in later sessions.
