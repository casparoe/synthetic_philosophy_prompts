answer: |-
  Your methodological concern is incisive and deserves a precise label. The phenomenon you describe is best termed **Eccentricity Drift**, with the following definition:

  **Eccentricity Drift** is the systematic distortion in the reconstruction of a historical entity (person, event, context) resulting from methodological filters that select evidence *based on its deviation from the normative patterns of the transmitting tradition*. This selection creates a residue set characterized by:
  1.  **Progressive Atypicality:** The more rigorously the filter is applied, the more the surviving evidence represents the most unusual, discontinuous, or non-adaptive elements relative to the tradition.
  2.  **Contextual Isolation:** The selected evidence lacks the connective tissue (continuities, typical features) necessary for robust historical contextualization, making the residue increasingly difficult to interpret meaningfully.
  3.  **Representational Failure:** Aggregating the filtered evidence does not converge on a representative picture but rather on an artificial concentration of anomalies.

  ### Key Distinctions
  *   **vs. Selection/Survivorship Bias:** Unlike biases arising from accidental loss or sampling error, Eccentricity Drift is *intrinsic to the application of content-directed criteria* designed to *remove* typical features. The distortion is a direct consequence of the filter's *success* in its intended function, not an accident.
  *   **vs. Conditioning on a Common Effect:** While structurally similar (both select based on an outcome), Eccentricity Drift specifically selects for *deviation from a norm* (the tradition), resulting in a residue skewed towards the *periphery* of the original distribution. It predicts drift towards the eccentric end, not just spurious correlations within the residue.
  *   **vs. Goodhart Effects:** The distortion isn't caused by agents gaming the criteria (as in "when a measure becomes a target"). It arises passively from the criteria's inherent logic applied to static data.
  *   **vs. Hermeneutical Circle:** This identifies the circular interdependence of part and whole in interpretation, but doesn't specify the *directional skew* towards atypicality inherent in these specific criteria.

  ### Scope and Look-Alikes
  *   **Requires Content-Direction:** Eccentricity Drift *requires* the filter to target features characteristic of the transmitting tradition itself (e.g., theological coherence, practical utility, linguistic/contextual plausibility *within the tradition*). It is not inherent to *all* residue-producing filters.
      *   **Counterexample (Not Eccentricity Drift):** Using radiocarbon dating to filter archaeological finds solely by age produces a residue (e.g., only items >2000 years old). While unrepresentative of the *total* temporal range, this residue isn't intrinsically skewed towards the "eccentric" relative to the *culture* of its time; it's just chronologically limited. The distortion is temporal scope, not inherent atypicality.
  *   **Generalization (Residue Effect):** Eccentricity Drift is a specific subtype of the broader **Residue Effect**, where *any* filtering process leaves a subset whose properties are defined more by the *removal process* than the original population. Eccentricity Drift occurs when the removal process specifically targets the *central, normative characteristics* of the population/tradition.

  ### Placement in Your Case
  In Synoptic studies, applying criteria like Dissimilarity, Embarrassment, and (to a lesser extent) Coherence constitutes Eccentricity Drift. They filter out units exhibiting continuity with Judaism, coherence with later Christian belief, or clear community utility – precisely the traits defining normative early transmission. The authenticated residue thus disproportionately comprises sayings/events that were *not* easily assimilated, useful, or continuous – the "eccentric" elements of Jesus relative to the developing tradition. This residue drifts further towards the eccentric the more consistently the criteria are applied, hindering contextualization due to the lack of typical connecting features stripped away by the filter.

  ### Footnote Suggestion
  > "This methodological tendency, where criteria of authenticity filter out units exhibiting normative features of the early Christian tradition, thereby skewing the surviving 'authentic' residue towards the atypical and contextually isolated, is termed **Eccentricity Drift**. It represents a specific form of the **Residue Effect**, distinct from general selection bias, arising when the selection rule targets features constitutive of the tradition's normative patterns. See [Your Discussion Here] for its implications for historical reconstruction." (Word Count: ~270 for footnote section)
