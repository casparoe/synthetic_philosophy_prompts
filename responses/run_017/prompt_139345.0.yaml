  First, the redescription objection. They worry that the subtractive/additive distinction might be arbitrary. For example, setting friction to zero could be seen as subtracting friction or adding a "no friction" rule. If every case can be flipped by redescription, their taxonomy might collapse. I need to present this objection strongly. The strongest version would argue that all modeling choices are fictional constructs, making the distinction purely notational. But maybe the taxonomy can survive if grounded in how assumptions function differently in the model's mathematics.

