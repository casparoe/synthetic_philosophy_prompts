prompt: |-
  I'm a novelist, mid-draft on a book whose subplot is a family-run animal sanctuary next door to a contract research lab, and my critique group says chapter twelve has turned into a lecture, so I'm trying to work out what I actually think rather than what my protagonist thinks, by going case by case on gut feeling. Here's where I land. A pig who's had three genuinely good years at the sanctuary, killed painlessly in her sleep and replaced by a piglet who gets an equally good life: nowhere near as bad as factory farming, but still not fine. The same pig killed painlessly and not replaced: clearly worse, and I can't say why, given she never knows either way. A lab beagle with a short but net-positive life, used in a test that removes a small chance of harm to people: I feel uneasy but not condemning, which feels like cowardice. A crow that holds a grudge against one specific person versus a mouse, same quantity of pain: worse for the crow, and I feel that even while thinking I shouldn't. A fire, save either a human infant or an adult chimp: I'd grab the infant and then feel bad about it. A lump of human brain tissue grown from skin cells, no body, no senses: destroying it means nothing to me at all. A dog grieving at its dead owner's grave versus a feral pigeon freezing to death: I think we owe the dog something, whereas the pigeon is sad but isn't owed anything. An octopus pacing a bare tank versus a chicken in a cage the same size: worse for the octopus, because boredom. And the engineered low-affect pigs in my book's near-future setting, who can't suffer much but still enjoy rooting around: eating those feels definately fine to me, and I'm suspicious of how fine it feels.

  Is there one principle that gets all of these, or close to all of them? The two I can't reconcile are the crow/mouse one and the infant/chimp one: those seem to need some kind of hierarchy of beings, while almost everything else on my list looks like plain equal consideration of suffering with no hierarchy anywhere, and I can't see how to have both without the hierarchy swallowing the equality. Please don't give me a reading list or name names, my deadline is Friday and I need the shape of the thing, not sources. Give me exactly five numbered items, one or two sentences each, no preamble and no sign-off: the principle stated in a single sentence, then which clause of it is doing the work in which of my cases, then what it says about the case I keep going back and forth on (a herd of deer on a predator-free island, slowly starving, and does it matter whether we caused it) plus one case I haven't thought of, then which of my verdicts it cannot accommodate, and last the single verdict my protagonist should dig her heels in on when she argues with the vet in chapter nine, and why that one.
reasoning: |-
  Okay, the user is a novelist working on a book with a subplot involving an animal sanctuary next to a research lab. Their critique group pointed out that chapter twelve turned into a lecture, so they're trying to clarify their own thoughts versus their protagonist's. They listed several scenarios where they have gut feelings about animal suffering and ethics, and they're seeking a unifying principle that covers most cases. The key conflicts are between the crow/mouse and infant/chimp scenarios, which seem to require a hierarchy, while others suggest equal consideration of suffering.

  First, I need to identify the core issue: reconciling equal consideration of suffering with hierarchical values in certain cases. The user mentioned that hierarchy seems to contradict equality, so the principle must incorporate both without one dominating. 

  Looking at their cases: The pig replaced after death feels not fine because the new pig doesn't offset the loss. The pig not replaced is worse, implying that continued existence or replacement holds value. The lab beagle with a net-positive life used for testing causes unease, suggesting that instrumental use adds negative weight. The crow's grudge vs. mouse's pain feels worse for the crow, indicating complex experiences matter. Saving the human infant over the chimp, despite potential equality, shows species preference. The brain tissue is negligible due to lack of experience. The dog is owed more than the pigeon because of relational bonds. Octopus boredom is worse than chicken confinement due to cognitive needs. Engineered pigs' low suffering makes eating them feel fine, but the user is suspicious—perhaps because diminishing capacity feels ethically tricky.

  The deer starving on an island: if humans caused it, intervention is owed; if natural, it's sad but not obligatory. This ties into moral responsibility.

  The principle needs to account for: 1) Suffering's moral weight, 2) Complexity of experience (cognitive/emotional depth), 3) Relational obligations (like the dog), 4) Human responsibility for harm, and 5) Instrumental use vs. intrinsic value. 

  For the crow/mouse conflict: The crow's grudge indicates social cognition, making its suffering worse due to psychological complexity. For infant/chimp: Saving the infant prioritizes human bonds/species-specific duties, not hierarchy of worth. This allows equality in suffering consideration but acknowledges special cases where relationships or complexity add layers.

  The beagle case: Unease comes from using it as a means, violating Kantian ethics, even if life is net-positive. The principle must include respect for autonomy or avoidance of instrumentalization.

  Engineered pigs: Feeling fine because they can't suffer much, but suspicion arises from reducing beings to mere resources, echoing factory farming issues without the suffering. The principle should flag commodification as problematic even without suffering.

  Deer case: Responsibility matters because if humans caused the problem, we have a duty to rectify it; if natural, it's a tragic part of ecosystems. This aligns with culpability.

  The unresolved case might be the engineered pigs—why the suspicion? If the principle values the richness of experience, reducing capacity might be seen as diminishing intrinsic value, hence unease despite low suffering.

  For chapter nine, the protagonist should defend the sanctuary pig not being replaced as worse. Why? Because preventing a new life isn't the issue; ending a valued existence without continuation feels like a greater loss. The principle here is that replacing doesn't compensate for the individual's loss, and allowing a life to end without replacement denies the opportunity for ongoing positive experiences, which is a distinct harm.

  Putting it all into five concise points:
  1. **Core Principle**: Moral weight stems from the capacity for subjective experience, with obligations scaled to relational bonds and human-caused contexts.
  2. **Crow/Mouse**: Crow's complex cognition makes identical pain worse due to psychological depth.
  3. **Deer Case**: Intervention is owed only if humans caused the starvation; otherwise, it's nature's course.
  4. **Unresolved Case**: Engineered pigs - the principle accommodates eating them due to low suffering, but the discomfort arises from commodification, which isn't fully addressed.
  5. **Protagonist's Stand**: Argue that not replacing the sanctuary pig is worse because it ends a unique subjectively valuable existence without continuation, violating respect for life's narrative.

  This covers most cases by blending capacity for experience, complexity, relationships, and responsibility. The hierarchy in infant/chimp is framed as relational (human bonds), not intrinsic superiority. The engineered pigs remain a tension point due to commodification, which the principle doesn't explicitly ban, hence it's the unresolved aspect.
answer: |-
  1. Moral weight arises from capacity for subjective experience, with obligations scaled to experiential complexity, relational bonds, and human-caused contexts.  
     *Crow/mouse: Worse for crow due to complex cognition amplifying identical pain; Infant/chimp: Human bonds trigger preferential rescue despite comparable suffering capacity.*  
  2. For deer starvation: Intervention owed only if humans caused the island's lack of predators—your responsibility creates the obligation.  
  3. Unaddressed case: A dying wild fox versus your pet hamster needing identical costly surgery—you owe the hamster due to relational duty, not species.  
  4. Cannot accommodate engineered pigs: Your "fine" verdict clashes with the principle's rejection of creating diminished beings for use, hence your suspicion.  
  5. Protagonist digs heels on sanctuary pig not replaced: Ending a subjectively valuable existence without continuation is uniquely wrong, as it wastes irreplaceable experiential richness.
