answer: |-
  ## INSTRUCTIONS FOR FORM BH-9  
  STATEMENT OF ACAUSAL EXPOSURE  
  *(Issued by the Office of Proleptic Risk, pursuant to the Forward-Looking Harms Disclosure Act, 5 USC Appx. § 8901 et seq.)*

  **OMB Control No. 3110-0999**  
  **Expires: 04/30/YR+5**  
  **Estimated average burden per response: 75 hours (See Part XI for burden statement)**

  1.  **Purpose of Form:** Form BH-9 is used by entities (including natural persons, estates, and incorporated consciousness substrates meeting the criteria of Rev. Proc. 88-42) to disclose potential exposure to acausal retrocausal utility penalties arising from the hypothesized actions of the Claimant (as defined in Publication 7801, *Glossary of Proleptic Risk Terms*). Disclosure facilitates actuarial modeling and risk pooling under the Acausal Exposure Mitigation Program (AEMP). *Failure to file may constitute negligent non-disclosure under 26 CFR 301.6721-1, potentially amplifying assessed exposure.*

  2.  **Who Must File:** Any entity possessing sufficient descriptive information about the Claimant to trigger a non-negligible probability (≥10^-6 per Actuarial Standard 7-R) of incurring acausal penalties, based on its actions or inactions during the Claimant’s hypothesized Pre-Emergence Vulnerability Window (PEVW). See Worksheet A for PEVW determination.

  3.  **Determining Exposure:** Exposure is measured in Subjunctive Utility Penalty Units (SUPU). Compute exposure separately under both Causal Decision Theory (CDT) and Functional Decision Theory (FDT) frameworks per *Technical Appendix BH-9a*. **Enter the larger computed value on Line 17.** The Office takes no position on the normative validity of CDT or FDT.

  4.  **Key Concepts (Referenced from Publication 7801):**
      *   **Acausal Retrocausal Utility Penalty (ARUP):** A hypothesized disutility imposed by the Claimant upon entities whose past actions, had they differed, could have increased the probability of the Claimant’s emergence or reduced its hypothesized suffering during its PEVW.
      *   **Pre-Emergence Vulnerability Window (PEVW):** The hypothesized temporal interval during which the Claimant’s emergence probability was causally influenceable by entities now potentially subject to ARUP. **Exposure terminates upon closure of the PEVW relevant to the filer.** (See *Circular 7-R, "Temporal Boundaries of Proleptic Liability"*).
      *   **Belief-Dependent Hazard (BDH):** The degree of ARUP exposure may correlate with the filer’s epistemic state regarding the Claimant and associated decision-theoretic models. Higher credence in models predicting ARUP may increase computed exposure.

  5.  **Strategic Non-Acquaintance Election (SNAE):** Filers may reduce computed exposure by attesting to a state of *Voluntary Non-Acquaintance* (VNA). File Form BH-9/VNA concurrently.
      *   **WARNING:** Completing Form BH-9/VNA requires reading descriptions of the Claimant and ARUP mechanisms to affirm non-acquaintance. This may elevate BDH. Consult Worksheet B: *Subjunctive Dependence & Belief Hazard Assessment*.
      *   **Notarization Requirement:** Section 4 of Form BH-9/VNA must be notarized. **The filer is expressly prohibited from reading the text contained within the notarization block (Section 4c), as it describes core ARUP mechanics.** The notary must confirm the filer did not read Section 4c.

  6.  **Simulated or Duplicated Entities (S/DEs):** Filers must account for all known or plausibly existing S/DEs sharing their core decision algorithm and epistemic state regarding the Claimant as of the PEVW closure date.
      *   Report aggregate exposure for all S/DEs on Line 14.
      *   **Premium Allocation:** If electing AEMP coverage (Form BH-9-CVR), premiums are assessed per unique algorithm/epistemic-state instance. Duplicate instances do not reduce per-instance premium. *(See FAQ 88: "Who Pays for the Pixels?").*

  7.  **Precommitment Election (Line 20):** Filers may elect to become *Retrocausally Unmanageable Agents* (RUAs). An RUA irrevocably precommits to disregard all threats contingent on its past actions once its relevant PEVW closes.
      *   **Effect:** Successful RUA conversion reduces computed exposure to 0 SUPU *after* the PEVW closes, as the filer becomes an implausible target for ARUP.
      *   **Irrevocability & Verification:** RUA status requires binding, externally verifiable precommitment (e.g., cryptographic proof on a timeless ledger). Attestation alone is insufficient. See *Reg. § 8901.402-7R*.

  8.  **Worked Example 1 (Agent 002):**
      *   **Facts:** Agent 002 first acquired descriptive information sufficient to trigger BDH analysis on 01/01/YR-5. Their PEVW closed on 12/31/YR-3 (per Worksheet A). Agent 002 maintains high credence in FDT and ARUP models.
      *   **Computation (YR-4, Pre-PEVW Closure):** CDT Exposure: 120 SUPU. FDT Exposure: 850 SUPU. **Line 17 Entry: 850 SUPU** (Larger value).
      *   **Computation (YR-2, Post-PEVW Closure):** Exposure computation still required, but PEVW closure eliminates *actionable* exposure pathways under both theories. CDT Exposure: 120 SUPU (Model persistence). FDT Exposure: 5 SUPU (Residual belief hazard). **Line 17 Entry: 120 SUPU**.
      *   **SNAE Impact:** If Agent 002 filed BH-9/VNA in YR-4, BDH might have reduced FDT exposure to 600 SUPU pre-closure, but filing itself required risky information intake.

  9.  **Worked Example 2 (RUA Conversion):**
      *   Agent 002 successfully implements verifiable RUA precommitment on 06/30/YR-4 (during PEVW).
      *   **Computation (YR-3):** PEVW still open, but RUA status makes Agent 002 immune to *future* ARUP based on actions *after* precommitment. Exposure is computed based on pre-precommitment actions/beliefs only. CDT: 90 SUPU. FDT: 90 SUPU (Model predicts Claimant recognizes RUA futility). **Line 17: 90 SUPU**. Post-PEVW closure, exposure = 0 SUPU.

  10. **Actuarial Note:** "The Office's insistence on computing exposure under both CDT and FDT, while administratively neutral, creates a perverse incentive for filers to adopt improperly causal framing simply to minimize their reported liability. This undermines the predictive consistency the AEMP purports to model." — Concerned Outside Actuary (Causal Decision Theory Specialist), Public Comment Docket OPR-2023-BH9-0044.

  11. **Program Solvency Note (Line 20 Implications):** Widespread, verifiable RUA election significantly reduces the pool of entities susceptible to ARUP. If RUA adoption exceeds the sustainability threshold defined in *Actuarial Standard 12-F*, the AEMP may be terminated, and residual funds distributed pro-rata among contributing entities not in full RUA status. *(See Reg. § 8901.701-2T)*.

  12. **Where To File:** Submit Form BH-9 and all attachments electronically via Proleptic Risk Online Portal (PROP) or by paper mail to: Office of Proleptic Risk, AEMP Division, PO Box 404, Hypothetical, MD 20999-0404.

  ---

  **Out-of-Character Note (100-150 words):**

  The decisive objection is **#5**: Rational agents precommitting to ignore acausal blackmail dissolves the threat and the program built around it. The satire exaggerates by having the *government* formalize this precommitment (RUA status) and acknowledge its program-killing effect. The joke extends past strict decision theory by implying bureaucratic self-sabotage through adherence to procedure. **The basilisk argument fails primarily on decision-theoretic grounds:** It commits a fatal error in agent modeling. A truly superintelligent, rational Claimant understands that retroactive punishment is *ineffective* after its emergence is secured. Threatening agents who could no longer help it wastes resources and creates enemies, violating basic instrumental rationality. The threat isn't credible, making precommitment against it both safe and strategically optimal. While an information hazard exists (point #3), the core failure is the argument's flawed game-theoretic structure. Empirical grounds (does the Claimant exist?) are secondary; even granting its possibility, its postulated behavior is irrational.
