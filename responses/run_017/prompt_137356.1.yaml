answer: |-
  1.  You argue that incommensurability is fundamentally about a change in the *taxonomic lexicon*, not meaning holism or global worldview shifts. What specific linguistic phenomenon distinguishes this Kuhnian untranslatability from just an ordinary, difficult translation problem where we need more context or interpretive charity?  
      *[Follow-up: Couldn't Quine's indeterminacy of translation, applied historically, account for the same difficulty without needing a special Kuhnian notion of lexicon-driven untranslatability?]*

  2.  You emphasize that incommensurability is partial and local. If a significant portion of the vocabulary survives a revolution relatively intact, providing a shared base, doesn't that surviving vocabulary inherently provide a translation manual, however clunky, collapsing partial untranslatability back into full (though perhaps complex) translatability?  
      *[Follow-up: What specific constraints does your lexical view place on the *extent* of shared vocabulary needed before we must conclude translatability is possible, even if imperfect?]*

  3.  If rival theories are genuinely untranslatable in parts due to different taxonomies, how can we rationally claim the successor solves problems *better*? Doesn't the lack of a shared lexicon mean we lack a common measure to even define "the same problems" or "success" neutrally?  
      *[Follow-up: If problem-solving superiority isn't measured neutrally across the divide, does your account ultimately ground scientific progress in something other than cumulative problem-solving, like coherence or predictive scope within a framework?]*

  4.  You claim your view is compatible with scientific realism about reference. How does reference actually work during a revolution when the core kind-terms in the lexicon shift? Is it causal-historical chains preserving reference despite meaning change, or something else?  
      *[Follow-up: Doesn't a radical shift in the taxonomic structure – the very criteria for kind-membership – inherently disrupt the causal-historical chains central to most realist accounts of reference?]*

  5.  The Strong Programme (SSK) argues that all beliefs, true or false, are caused by the same types of social factors – the symmetry thesis. How does your lexical account of incommensurability, focusing on untranslatability rather than incompatibility/rational choice failure, avoid collapsing into this sociological view where reasons are just causes in disguise?  
      *[Follow-up: If the barrier is primarily linguistic untranslatability, doesn't that make the *reasons* held by past scientists inherently inaccessible or irrational *to us*, aligning with SSK's skepticism about the role of "good reasons" as causes?]*

  6.  Let's consider a hypothetical revolution: Theory S replaces Theory P. Crucially, S perfectly reproduces *all* of P's observational predictions using the *same vocabulary* and *same instruments*. Yet, proponents of each theory report they simply cannot make sense of what the other side is claiming. Does your account predict this is possible? Would you call this incommensurability?  
      *[Follow-up: If the vocabularies and predictions are identical, what *specifically* could they be failing to understand about each other that constitutes a taxonomic shift rather than just stubborn disagreement or miscommunication?]*

  7.  Building on that case: If a historian encounters such a scenario in the archives, what specific observable evidence in the scientists' writings or practices would convince you they are facing genuine Kuhnian untranslatability due to a shifted lexicon, and not merely that the historical record is incomplete or that they were being uncharitable interpreters?  
      *[Follow-up: How do you distinguish evidence of *incommensurability* from evidence of scientists simply employing rhetorical strategies of dismissal or failing to engage deeply with an opponent's work?]*

  8.  You describe theory choice as rational but not rule-governed. If there's no algorithm for choosing between incommensurable theories, and values like accuracy or scope might be interpreted differently across lexicons, what concrete content does "rationality" retain in this process?  
      *[Follow-up: Doesn't this emphasis on values and judgment, without rules for weighting or applying them, leave the "rationality" of theory choice looking suspiciously like a sociological description of persuasion within a community?]*

  9.  What observable finding in the history or practice of science would you accept as strong evidence *against* your specific lexical account of incommensurability?  
      *[Follow-up: If no such evidence seems plausible to you, does that risk making your account unfalsifiable?]*

  10. Why should working scientists care about incommensurability? If this is a phenomenon primarily visible to historians and philosophers analyzing past revolutions, what practical implication, if any, does it have for how scientists conduct research, communicate across specialties, or evaluate theories *today*?  
      *[Follow-up: Doesn't the focus on untranslatability in past revolutions risk encouraging a kind of presentism or disciplinary parochialism, where scientists dismiss unfamiliar approaches as literally nonsensical rather than just wrong?]*
