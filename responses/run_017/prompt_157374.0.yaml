answer: |-
  ### Philosopher-Advisor Analysis: Your Sister's Ethical Framework  
  Based on your description, your sister operates with a nuanced, context-sensitive ethics that blends social contract theory with harm-based obligations. She distinguishes "rude" (merely impolite or unconventional) from "wrong" (violating a duty owed to others) by focusing on **reasonable expectations within cooperative systems**. I'll break this down step by step, commit to predictions, and address your core questions. After analyzing her 12 verdicts, three coherent ethical rules emerge—all fit the data, but my best guess favors one.

  ---

  ### **Three Unifying Rules That Fit All 12 Verdicts**  
  Each rule explains every case without contradiction. Crucially, they diverge on *why* obligations arise, leading to different predictions for your bagel-shop case.

  1. **The Structural Dependence Rule**:  
     - **Core Principle**: You owe compensation (or compliance) only when your actions directly sustain or disrupt a system where others *structurally depend* on your participation for fair treatment or livelihood. Absent this, it's convention (rude but not wrong).  
     - **Predictions for Bagel Case**: **Not wrong (merely rude)**. Staff earn $17/hour (above tipped minimum wage), so no structural dependence on tips. The prompt is a request, not a system requirement—like the charity round-up (case 8). Visitor ignorance doesn't matter, as the rule is objective.  

  2. **The Reasonable Expectations Rule**:  
     - **Core Principle**: You owe compensation when others have a *reasonable, context-specific expectation* of reciprocity based on your role (e.g., customer), and failing it harms their cooperative efforts. Blame depends on knowledge.  
     - **Predictions for Bagel Case**: **Wrong (he owed it)**. In NYC food service, tipping is a deeply ingrained norm; staff reasonably expect it even at counter-service spots (evidenced by preset options and pooling). Like hotel housekeepers (case 10), invisibility doesn't negate the expectation of reciprocity for labor. Visitor status mitigates blame but not the debt.  

  3. **The Vulnerability Mitigation Rule**:  
     - **Core Principle**: You owe compensation when your actions exploit or worsen *vulnerability* (e.g., low-wage workers in power-imbalanced systems). No vulnerability? No obligation—just politeness.  
     - **Predictions for Bagel Case**: **Not wrong (merely rude)**. $17/hour exceeds vulnerability thresholds (vs. case 1’s tipped-wage workers). The prompt is an ask, not a redress of inequity. Visitor ignorance reinforces "no blame."  

  ---

  ### **Best Guess for Your Sister's Actual Position**  
  **I predict she uses the *Reasonable Expectations Rule* and would say: "Yes, your German friend did something wrong—he owed a tip, but isn't fully blameworthy due to ignorance."**  

  **Why this rule?**  
  - It best explains her emphasis on *local context* and *reciprocity*:  
    - Case 1 (US sit-down tip): Waitstaff reasonably expect tips as wage supplements.  
    - Case 2 (Japan no-tip): Staff don’t expect it; imposing it is rude.  
    - Case 10 (hotel housekeeper): Invisible labor still creates an expectation of reciprocity.  
    - Case 11 (escalator blocker): No initial blame because expectations require knowledge.  
  - It treats norms as *binding* when they facilitate social cooperation (e.g., queuing in London vs. Tokyo train chaos).  
  - It rejects "system bad, so I opt out" (case 1) because individual defiance harms collective trust, even if the system is flawed.  

  **Why not the others?**  
  - *Structural Dependence* fails case 10: Hotel housekeepers aren’t structurally dependent on tips, yet your sister says you "should leave something."  
  - *Vulnerability Mitigation* fails case 3: Line-cutting isn’t about vulnerability but violating fair access expectations.  

  **Bagel Case Classification**: She’d file this under **case 1 (you owe it)**, not case 8. Why? Counter-service food in the US operates in a tipping ecology—preset options, pooling, and staff watching signal it’s a *convention*, not a charitable ask. The $17/hour wage doesn’t negate this; it simply reduces (but doesn’t eliminate) the obligation compared to tipped-wage venues.  

  **Does visitor status matter?**  
  Yes, but only for *blame*, not the *debt*. Like case 11 (escalator blocker), ignorance excuses initial blame ("he's not to blame for not knowing"), but once aware, he must comply. "Owed it" and "to blame" **come apart here exactly as in verdict 11**: he owed the tip (it was wrong to withhold), but his ignorance means he isn’t culpable. If he does it again? Full blame.  

  **Does counter-service / no tipped wage matter?**  
  It reduces the obligation's *weight* but doesn't erase it. Her verdicts show obligations scale with context: not tipping a $2.13/hour server (case 1) is worse than skipping a housekeeper tip (case 10), but both are wrong. Here, $17/hour makes it less egregious than a sit-down restaurant, but the norm persists.  

  ---

  ### **Extra Test Case to Separate the Rules**  
  If the rules tie after the bagel case, pose this scenario:  
  > *"You're at a self-serve frozen yogurt shop in California. Employees earn $20/hour (well above minimum wage) plus healthcare. The card reader shows 20/25/30% tip options. A sign says, 'Tips fund our annual staff trip to Tahoe!' You skip tipping."*  

  - **Structural Dependence Rule**: Not wrong. No dependence—wages/benefits cover needs; tips are a bonus.  
  - **Reasonable Expectations Rule**: Wrong. Food-service contexts create tipping expectations; staff may rely on it for extras.  
  - **Vulnerability Mitigation Rule**: Not wrong. No vulnerability; tips are discretionary gifts.  

  **Why this works**: It isolates "expectations" vs. "dependence/vulnerability." Your sister’s verdict on hotel housekeepers (case 10) suggests she’d call skipping the tip here **wrong**, locking in the *Reasonable Expectations Rule*.  

  ### Final Summary  
  - **Sister’s Likely Verdict**: German friend owed a tip (wrong, not just rude), classified with case 1. Ignorance excuses blame but not the debt.  
  - **My Advice to You**: Test her with the yogurt-shop case! It’s a clean way to see if she prioritizes social expectations over structural need. Philosophically, she’s building a compelling case for *contextual moral duties*—one I’d applaud in my column. If your friend revisits that bagel spot? He should tip 15-20%.
