  I need to identify possible unifying principles that explain all 12 cases. The sister seems to be applying a framework based on reciprocal obligations and reasonable expectations within specific social contexts. She's not a pure consequentialist or deontologist - it's more about social contracts and harm avoidance in cooperative systems.

  Three plausible rules that fit all 12 cases:
  1. **Actual Obligation Principle:** You have a moral obligation only when there's a structural dependency (like wage systems) or direct harm from non-compliance. Otherwise it's just convention/politeness.
  2. **Reasonable Expectations Principle:** You owe compensation when others reasonably expect it based on role performance, especially when systems are designed around those expectations.
  3. **Vulnerability Principle:** Obligations arise when your actions affect vulnerable parties in systems where they lack power to negotiate.

  For the bagel case:
  - Rule 1 would say "not wrong" because no wage dependency ($17/hr > tipped minimum)
  - Rule 2 would say "wrong" because tipping is reasonably expected at NYC food establishments
  - Rule 3 would say "not wrong" since workers aren't vulnerable at $17/hr

  My best guess is she'd use Rule 2 (Reasonable Expectations) and say it was wrong to not tip. Reasons: Her verdicts consistently prioritize local expectations (cases 1,3,6,9,10) over systems (case 2,4) or intent (case 11). The $17/hr wage might not override the strong NYC tipping norm for food service.

  For blame vs. owe: Like case 11, she'd say the German owed the tip but isn't fully blameworthy initially due to ignorance. But now that he knows, he must comply.

