  **Appendix: Key Derivations**

  **Expected Utility from Outset:**  
  - Turn off at junction 1: Utility 0, probability \(p_0\).  
  - Pass junction 1 (prob \(1 - p_0\)): Then at junction 2, counter reads 0 with prob \(q\) or 1 with prob \(1 - q\).  
    - If counter 0: Turn off with prob \(p_0\), utility 4; pass with prob \(1 - p_0\), utility 1.  
    - If counter 1: Turn off with prob \(p_1\), utility 4; pass with prob \(1 - p_1\), utility 1.  
  - EU:
    \[
    \text{EU} = p_0 \cdot 0 + (1 - p_0) \left[ q \left( p_0 \cdot 4 + (1 - p_0) \cdot 1 \right) + (1 - q) \left( p_1 \cdot 4 + (1 - p_1) \cdot 1 \right) \right]
    \]
    Simplifying:
    \[
    \text{EU} = (1 - p_0) \left[ q (3p_0 + 1) + (1 - q) (3p_1 + 1) \right] = (1 - p_0) \left[ 3q p_0 + 3(1 - q) p_1 + 1 \right]
    \]

  **Optimal \(p_1\):**  
  - Coefficient of \(p_1\) in EU is \(3(1 - q)(1 - p_0) \geq 0\) for \(q < 1\), so set \(p_1 = 1\).

  **EU with \(p_1 = 1\):**  
  \[
  \text{EU} = (1 - p_0) \left[ 3q p_0 + 3(1 - q)(1) + 1 \right] = (1 - p_0) (3q p_0 + 4 - 3q)
  \]

  **Quadratic maximization:**  
  - \(\text{EU} = -3q p_0^2 + (6q - 4) p_0 + (4 - 3q)\)  
  - Vertex at \(p_0 = -\frac{6q - 4}{2 \cdot (-3q)} = 1 - \frac{2}{3q}\)  
  - For \(q \geq \frac{2}{3}\), \(p_0 = 1 - \frac{2}{3q}\); for \(q < \frac{2}{3}\), \(p_0 = 0\).

  **High-failure credence (\(q \geq \frac{2}{3}\)):**  
  With \(p_0 = 1 - \frac{2}{3q}\), let \(x = 1 - p_0 = \frac{2}{3q}\):  
  - \(P(\text{J1} \mid c=0) = \frac{1}{1 + x q} = \frac{1}{1 + \frac{2}{3}} = \frac{3}{5}\)  
  - \(P(\text{J2} \mid c=0) = \frac{x q}{1 + x q} = \frac{\frac{2}{3}}{1 + \frac{2}{3}} = \frac{2}{5}\)

  **Expected utility at roadside with \(c=0\):**  
  - Turn off: \(P(\text{J2} \mid c=0) \cdot 4\)  
  - Pass:  
    - If at J1, utility after passing is \(q (3p_0 + 1) + 4(1 - q)\) (from J2 action under plan).  
    - If at J2, utility is 1.  
  - For \(q \geq \frac{2}{3}\), substituting \(p_0\) gives utility after passing at J1 as 2, so:  
    \[
    E[U \mid \text{pass}] = \frac{3}{5} \cdot 2 + \frac{2}{5} \cdot 1 = \frac{8}{5}
    \]
    Matching \(E[U \mid \text{turn off}] = \frac{2}{5} \cdot 4 = \frac{8}{5}\).
