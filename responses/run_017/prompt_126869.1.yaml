prompt: |-
  I'm an emergency doc and I also do a lot of the clinical teaching for our residents. My head mostly lives in one pretty specific vocabulary: differential, pre-test probability and testing thresholds, decision rules vs. gestalt, illness scripts, sens/spec and likelihood ratios, effect modification, comorbidity and competing risks, and the whole EBM stack — evidence grades, confidence intervals, number needed to treat, external validity. I took two philosophy classes in college, liked them, but I'm not fluent in the jargon.

  Here's the thing I only half remember and want pinned down: the fight about moral particularism vs. generalism. As I have it, the particularist side says there aren't any useful exceptionless moral principles — whether a fact counts as a reason depends entirely on what else is going on in the case, and the very same fact can even flip and count the other way. The generalist side says that if that were true, moral judgment would be unteachable, uncriticizable, maybe not even the kind of thing that can be right or wrong.

  Restate that whole argument for me in my vocabulary, both sides at their strongest, no strawmen. And I mean actually do the translation, not hand me an analogy: what is a "reason" in my terms, what is a "principle," what is it for a reason to flip, what exactly is the generalist demanding when they demand principles.

  Then the part I actually care about, the residue. I have four guesses about where this breaks and I want to know which ones are right.

  1. Modality. Everything in my world is an empirical association with a confidence interval around it and a separate argument about whether it transports to my patients. But I get the feeling moral principles are supposed to hold in some stronger, necessary way — not just "held up in the cases we've seen so far." Is that right? And if so, is there any way to say it in my vocabulary, or is that just a hole my framework has?

  2. Outcomes. My vocabulary is downstream of outcomes we can count. When I try to translate "a reason" I keep producing "a feature that predicts a better outcome," which quietly turns every moral question into a consequentialist one. Am I smuggling something in, or is the translation forcing that on me?

  3. Teaching and criticism. We teach gestalt by apprenticeship, and we absolutely chew each other's calls apart at M&M without anybody ever producing a rule. So the generalist's move that you can't teach or criticize without principles looks false in my world. Does it collapse, or is there a version of it that survives what we actually do?

  4. The claim that two cases alike in every non-moral respect have to be alike morally. I think that's load-bearing for one side. What is it doing in the argument, and does it translate as "the features fully determine the label," or is that a bad rendering?

  One concrete detail, because I think it matters: I've started keeping a list on my phone of what I call Janus facts — facts that point one way in most cases and the other way in some. My favorite non-medical one is that a joke's being genuinely funny is normally a reason to tell it, but there are settings where how funny it is is exactly what makes it cruel, and so is a reason to shut up. Is that the same thing the particularists mean by a reason switching polarity, or am I describing something else? And here's what I can't figure out: does it matter that I can write the Janus facts down as a list? Doesn't writing them down turn them back into principles, just ugly ones?

  Be blunt where my vocabulary simply can't say something, and tell me whether that's my problem or theirs.
reasoning: |-
  Okay, let me start by really understanding what this emergency doc is asking. They’re deeply immersed in clinical decision-making terms like differentials, likelihood ratios, and evidence-based medicine. They remember a philosophy debate about moral particularism vs. generalism but need it translated into their medical vocabulary without analogies. They also have four specific points where they think the argument might break down, plus a concrete example about "Janus facts."

  First, I need to restate both sides of the moral argument using their terms. The key is precise translation: "moral reasons" as clinical factors, "principles" as clinical rules, and "reason flipping" as a factor changing predictive direction based on context. For example, tachycardia usually suggests instability but in a beta-blocked patient, it might indicate pain instead. That’s a direct parallel to their Janus facts (like humor sometimes being cruel).

  Now, tackling their four residues:

  1. **Modality**: They’re used to probabilistic associations (confidence intervals, transportability). Moral principles feel "necessary." I should explain that moral generalists do claim necessity, but it’s conceptual, not empirical. Their framework can’t capture this—it’s a vocabulary gap. Highlight that in medicine, we have "pathognomonic" signs as close equivalents (e.g., Kernig’s sign for meningitis), but even those are probabilistic in practice.

  2. **Outcomes**: They notice their translation makes everything consequentialist ("predicts better outcomes"). But moral reasons aren’t always outcome-based (e.g., autonomy violations are wrong even if beneficial). Their framework might force a consequentialist lens, which is a limitation here. Admit this smuggling happens and it’s a constraint of their operational vocabulary.

  3. **Teaching/Criticism**: They argue gestalt is taught via apprenticeship and criticized without rigid rules (e.g., M&M conferences). Generalists fear judgment becomes unteachable without principles. But in medicine, pattern recognition and illness scripts work without exceptionless rules. The surviving insight is that principled reasoning (like validated decision rules) adds robustness, but it’s not the only way.

  4. **Supervenience**: The idea that identical non-moral features demand identical moral judgments. In their terms, it’s like "features determine the label." But clinical reality has irreducible context (e.g., two identical traumas but different comorbidities altering management). This principle is idealized—medicine respects it loosely, but context often breaks it.

  On Janus facts: Their example (humor flipping from kind to cruel) is exactly what particularists mean by polarity shifts. Listing them doesn’t defeat particularism—it just creates conditional principles ("if in grief context, humor is cruel"), which generalists might accept but particularists find insufficiently universal.

  Blunt gaps: Their vocabulary is probabilistic and outcome-focused; it can’t handle non-consequentialist reasons or necessity claims. That’s not a flaw—just domain-specific. Philosophy’s "necessary" might be impractical in clinical fluidity. 

  Final clarity: Emphasize that medicine already navigates similar tensions (e.g., evidence hierarchies vs. individual context). Their Janus list is clinically useful pragmatism, even if philosophers debate its theoretical purity.
answer: |-
  Here's a direct translation of the moral particularism vs. generalism debate into your clinical vocabulary, followed by a blunt analysis of your four residues and the Janus facts question. I'll avoid analogy and use your operational terms.

  ### Core Argument Translated
  - **"Moral reason"** = **A clinical feature that affects the probability of a positive or negative outcome** (e.g., "chest pain radiating to the left arm" increases pre-test probability of MI).  
  - **"Moral principle"** = **A clinical decision rule or heuristic** (e.g., Ottawa Ankle Rules: "If no bony tenderness at the malleoli, no need for X-ray").  
  - **"Reason flipping polarity"** = **A feature that usually increases the probability of Outcome A instead increasing the probability of Outcome ~A (or a competing risk) in specific contexts** (e.g., "Fever" usually suggests infection, but in neutropenic patients, absence of fever may signal higher risk due to impaired immune response).  
  - **Generalist demand** = **Insisting on validated clinical decision rules with high sensitivity/specificity across contexts**, arguing that without these, clinical judgment is unteachable ("How do you train residents without Ottawa Rules?") and uncriticizable ("On what basis do you challenge a bad call at M&M?").  

  **Particularist Strongest Case**:  
  *"There are no universally applicable clinical rules. The predictive value of a feature depends entirely on the clinical context (comorbidities, competing risks, social determinants), and the same feature can flip direction. For example, tachycardia usually suggests instability (reason to intervene), but in a hospice patient with advanced dementia, it may be a reason to avoid aggressive care (polarity flip). Gestalt built through pattern recognition (illness scripts) is primary; rules are context-dependent summaries of past cases, not exceptionless laws. Teaching happens through apprenticeship and case review; criticism uses counterfactuals and outcomes, not rule violations."*  

  **Generalist Strongest Case**:  
  *"If features lack stable predictive value, clinical judgment collapses into arbitrariness. You must have general rules (e.g., NEXUS criteria for c-spine) to teach residents ('Always image if focal neuro deficit') and critique errors ('You deviated from the guideline'). If the same fact (e.g., 'ST elevation on ECG') could flip polarity (reason to treat vs. reason to withhold cath in a dying patient), medicine isn't evidence-based—it's intuition. Principles are necessary for external validity and reproducibility."*  

  ### Residue Analysis
  **1. Modality**  
  Yes, moral principles are claimed to hold *necessarily* (e.g., "Lying is always wrong, even if outcomes seem good"), while clinical associations are probabilistic (confidence intervals, transportability issues). Your framework **cannot capture this necessity**, as it's rooted in logic, not empiricism. This is a hole in your vocabulary—but it's also a weakness in generalism. In medicine, even "pathognomonic" signs (e.g., Kernig's for meningitis) have sensitivity <100%. The debate reveals that ethics *wants* necessity, but your world shows it's unrealistic. **Verdict**: Your problem (vocabulary gap), but it undermines generalism's strongest claims.  

  **2. Outcomes**  
  You **are smuggling in consequentialism**. Your translation of "reason" as "predictor of better outcomes" forces morality into a cost-benefit frame. But some moral reasons aren't outcome-based (e.g., "Don't lie to a patient" even if it improves compliance). In your terms, this is like prioritizing process measures (informed consent) over outcome measures (survival). The translation isn't wrong—it's a *choice* to operationalize ethics as risk/benefit prediction. **Verdict**: Your framework naturally defaults to consequentialism, but this isn't inevitable; it's a limitation of your vocabulary for handling deontological (duty-based) reasons.  

  **3. Teaching & Criticism**  
  The generalist's claim **collapses in your world**. You teach gestalt via apprenticeship (e.g., "Notice how this PE case had no classic symptoms?") and critique at M&M by reconstructing context: "Given the competing risk of GI bleed, was anticoagulation still indicated?" No one cites "exceptionless rules." The surviving insight: Generalists fear *relativism* (e.g., "Anything goes if context excuses it"). But in medicine, you avoid this by grounding criticism in **outcome data and shared illness scripts** (e.g., "This delay in antibiotics increased mortality risk based on surviving sepsis data"). **Verdict**: Generalism's demand is false in practice; particularism wins here.  

  **4. Cases Alike in Non-Moral Respects → Same Moral Status**  
  This is **supervenience**: Moral judgments "ride on" non-moral facts. In your terms: *If two patients have identical clinical features (including comorbidities, social context), they warrant identical management*. But medicine routinely violates this:  
  - **Example**: Two identical STEMI patients—one opts for palliative care, the other wants full intervention. Identical features, different "moral" (clinical) judgments due to patient autonomy.  
  Generalists use supervenience to demand principles ("Features must dictate decisions!"), but clinical reality rejects this. **Verdict**: Bad rendering. Features constrain decisions but don't *determine* them; patient values and goals are irreducible factors.  

  ### Janus Facts: Are They the Same?  
  **Yes**, your Janus facts are identical to particularist "reasons flipping polarity":  
  - *Your example*: Humor usually predicts positive outcomes (rapport building) but flips to harm (cruelty) in grief contexts.  
  - *Clinical example*: "D-dimer >500" usually increases PE probability (reason to scan) but in metastatic cancer, it's a reason to avoid CT (false positives, contrast risk).  

  **Does listing them create principles?**  
  Yes—but they're **conditional principles** (e.g., "Funny jokes are contraindicated in grief contexts"). Generalists accept these as "hedged principles." Particularists argue:  
  - The list will be incomplete (unknown contexts remain).  
  - The *weight* of the feature still depends on gestalt (e.g., *how* funny? *How* grief-stricken?).  
  Your Janus list is clinically useful (like a checklist for rare scenarios), but it doesn't refute particularism—it just quantifies context-sensitivity.  

  ### Blunt Gaps  
  - **Where your vocabulary fails**: It can't handle non-consequentialist reasons (e.g., "Autonomy violations are wrong even if outcomes improve"). This is a **framework limitation**—your world is NNTs and effect sizes.  
  - **Where philosophy fails**: Demanding exceptionless principles ignores clinical/ethical complexity. Their "necessity" is a fantasy in your probabilistic, context-saturated world. **This is their problem**.  

  **Final Takeaway**: You're instinctively a particularist. Your Janus list, gestalt training, and M&M critiques align with that. Generalism's push for rules mirrors evidence-based algorithms—useful when validated, but brittle at the edges. The residue? Moral philosophy craves certainty your world knows is unattainable.
