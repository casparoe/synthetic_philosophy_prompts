  Okay, this user is in a philosophy reading group stuck on the Hart-Devlin debate about legal moralism, specifically about whether society can criminalize immoral acts even without harm. They've invented a thought experiment called "Shutters" – a private, offline simulation of cruelty with no real harm or victims. Variant A has no downstream effects; Variant B has slight callousness in users. The user wants a clear verdict on whether legal moralism justifies banning Shutters in either case, addressing Devlin's best possible defense against Hart's objections, and highlighting where the argument might be weak.

  First, I need to unpack the core of the Hart-Devlin debate. Devlin argues society needs shared morality to survive, so laws can enforce moral standards based on public intolerance, indignation, and disgust. Hart counters that this is an unproven empirical claim and that even if some shared morality is necessary, Devlin doesn't show why specific norms are essential. Hart also points out Devlin's concessions about privacy and selective enforcement sneak the harm principle back in.

  The Shutters case strips away all typical objections: no harm, no victims, no consciousness in simulations, no spillover effects in Variant A, and only minor aggregate callousness in Variant B. This makes it a pure test of legal moralism. The user wants me to answer several specific questions: whether criminalization is justified in each variant, if Devlin's position can be more than empirical (like constitutive or expressive), whether focusing on the practice of enforcement rather than specific norms avoids Hart's objection, and what happens if a ban backfires.

  I should start by analyzing Variant A. With no harm and no effects, Hart's harm principle clearly opposes criminalization. But Devlin might argue that society's moral fabric requires condemning such acts because they evoke genuine disgust. However, Hart's objection that Devlin hasn't shown this specific norm is load-bearing applies here. If I build the best Devlin defense, it might claim that permitting Shutters normalizes cruelty, eroding moral boundaries. But without evidence, this is speculative. The expressive aspect—law declaring societal identity—doesn't solve why others should care, especially if the ban backfires.

  For Variant B, the slight increase in callousness introduces a harm element, though indirect. Hart might still argue it's insufficient for criminalization because the harm isn't direct or targeted. Devlin could combine moralism with the minor harm, but the empirical weakness (small effect, no individual harm) makes it shaky. The strongest case here might be that the aggregate effect justifies intervention to prevent societal degradation.

  On the constitutive point: Devlin's position as expressive rather than empirical might avoid the burden of proof for specific norms. But this raises the question: why should the state enforce identity through criminal law? If society's identity includes intolerance, that doesn't make it right. Hart would likely dismiss this as majoritarian oppression.

  Regarding the enforcement mechanism: Devlin could argue that maintaining the practice of moral enforcement is crucial, regardless of the norm. But this seems circular. If the norm isn't load-bearing, enforcing it arbitrarily could undermine the system's legitimacy. Plus, if a ban backfires, it suggests the norm wasn't essential, weakening Devlin's empirical claim.

  Backfiring: If banning Shutters leads to backlash, it refutes the specific empirical claim that this norm is crucial for social cohesion. It doesn't entirely refute legal moralism but shows its application can be counterproductive.

  My verdict: In Variant A, legal moralism fails; harm principle wins. In Variant B, the minor harm might justify regulation but not necessarily criminalization. Devlin's best defense isn't strong enough without evidence. The user wants me to land somewhere, so I'll conclude that harm principle is more robust, but Variant B is a closer call.

  Where I might be wrong: Underestimating the symbolic importance of law in maintaining norms or overestimating the harm principle's ability to handle indirect harms. If new evidence shows isolated immoral acts erode social bonds, that could change my view. Also, if Variant B's aggregate harm is significant, regulation might be more justified.
answer: |-
  ## Verdict on the Shutters: Why the Harm Principle Holds (Mostly)

  Your group has crafted an excellent test case, stripping away the usual complexities to isolate the core tension between Devlin’s legal moralism and Hart’s harm principle. Let’s build the best possible Devlin-inspired defense, pressure-test it with Hart’s core objections (and beyond), and land a verdict on Variant A (no effects) and Variant B (minor callousness). I’ll conclude that **criminalization is unjustified in Variant A and likely unjustified in Variant B, though the latter introduces significant tension for pure harm principle adherents. The harm principle ultimately withstands the challenge, but Devlin’s constitutive argument reveals a genuine vulnerability in purely individualistic liberalism.**

  **The Best Devlin Defense (Absorbing Hart’s Objections):**

  1.  **Beyond Mere Prediction: The Constitutive Argument:** Devlin’s core insight isn’t *just* that shared morality is empirically necessary for survival (Hart’s "untested guess" target). It’s **constitutive and expressive.** The law doesn’t merely *reflect* society; it actively *shapes* and *declares* its fundamental character. Permitting the Shutters isn’t neutral tolerance; it’s a public declaration that such simulated cruelty is morally permissible *within our community*. This degrades the shared moral vocabulary essential for mutual recognition and trust. Even if no *individual* act of cruelty increases, the collective understanding of what constitutes acceptable degradation shifts. Law’s expressive function matters: it tells citizens who "we" are. Banning the Shutters, therefore, isn’t primarily about preventing collapse (Hart’s empirical point) but about affirming that *this society does not tolerate the deliberate, immersive simulation of cruelty for pleasure*, defining a boundary of the morally acceptable human condition.
  2.  **The "Practice of Enforcement" Escape:** Devlinians can sidestep Hart’s "load-bearing norm" objection by shifting focus. It’s not that *this specific norm* (against simulated cruelty) is uniquely essential. Rather, **a society’s willingness to enforce *some* core moral boundaries *as such* (beyond harm) is itself constitutive of social cohesion.** If society consistently refuses to enforce *any* purely moral norms (like this one), it signals that morality is purely private, eroding the shared foundation. The "load-bearing" element is the *practice* of moral enforcement itself. Abandoning it entirely for the harm principle alone risks dissolving the communal glue.
  3.  **Variant B: Bolstering with Faint Harm:** In Variant B, the minor aggregate callousness provides an *additional*, empirically-grounded reason compatible with a broader harm principle (protecting against diffuse social harms). Legal moralism isn’t the *only* justification here, but the moral revulsion signals the *kind* of harm society deems significant enough to act upon – the erosion of basic human empathy, a prerequisite for a minimally decent society.
  4.  **On Backfiring:** If a ban backfires, creating a martyred subculture, this *doesn’t* refute Devlin’s core constitutive argument. It simply shows **poor prudential judgment** in *this specific case* about *how* to enforce the norm, or that the *timing* was wrong. Devlin explicitly allowed for limits based on privacy and tolerance. A failed enforcement doesn’t mean the underlying moral judgment or the need for *some* moral boundaries was wrong; it means the implementation was clumsy.

  **Why This Defense Ultimately Fails (Hart Wins, Mostly):**

  1.  **The Constitutive Argument’s Fatal Flaw:** While powerful, the constitutive/expressive view doesn’t solve the core liberal objection: **Why should the state use its coercive power to enforce *this particular vision* of "who we are" against harmless private choices?** Declaring "we don’t tolerate X" through criminal law imposes significant costs (loss of liberty, prosecutorial resources, potential for black markets, surveillance risks) purely to satisfy the majority’s sense of moral propriety or disgust. This reduces law to enforcing majoritarian preferences for their own sake, risking tyranny. The expressive function is legitimate when tied to preventing harm (e.g., hate speech laws aiming to prevent discrimination/violence), but severed from harm, it becomes pure moral authoritarianism. *Why should anyone else care about this declaration?* Devlin has no compelling answer beyond "because society needs shared morality," which brings us back to the empirical question Hart rightly demands evidence for.
  2.  **The "Practice of Enforcement" Dodge Fails:** Shifting from specific norms to the general practice doesn’t rescue Devlin. **Hart’s objection transforms:** "You haven’t shown that abandoning the practice of enforcing *purely moral* norms (without harm) will dissolve society." Modern, diverse, secular societies function without widespread criminalization of purely private "vices" (e.g., private blasphemy, certain sexual practices between consenting adults). The burden of proof remains on the moralist to show why *this* practice is essential. Pointing to *some* moral enforcement (like laws against fraud or violence, grounded in harm) doesn’t justify extending it to the purely symbolic realm. The practice argument risks justifying *any* moral enforcement simply to maintain the practice itself – a circular and dangerous proposition.
  3.  **Variant A: No Justification:** Here, the Devlinian case collapses entirely. With no effects – not even the faintest hint of harm – criminalization rests *solely* on the brute force of majority disgust. This violates the fundamental liberal principle that the state needs a compelling justification (like preventing harm) to restrict liberty. The constitutive argument fails here most starkly: forcing conformity to the majority’s definition of "degradation" in purely private fantasy is illiberal overreach. **Verdict: No criminalization. Harm principle wins decisively.**
  4.  **Variant B: The Harm Principle Under Strain, But Holds:** The minor aggregate callousness *is* a harm – a diffuse, statistical harm to the general social environment of empathy. This brings it closer to the harm principle’s domain. However, criminalization faces major hurdles:
      *   **Proportionality:** Criminal law is a blunt, coercive instrument. Is it proportionate for a "small," aggregate effect that doesn't manifest in identifiable individual harms? Regulation (e.g., age restrictions, mandatory warnings, public health campaigns) seems a less liberty-infringing response.
      *   **Causation & Individual Justice:** The harm is probabilistic and aggregate. Punishing an individual user for *potentially* contributing to a societal shift in empathy feels unjust; their specific actions cannot be linked to a specific harm. This clashes with core principles of individual responsibility in criminal law.
      *   **Slippery Slope:** If we criminalize this for a small statistical effect based on moral revulsion, what prevents criminalizing other unpopular private acts with tenuous links to diffuse harms (e.g., certain art, literature, or deeply held but offensive beliefs)? The *combination* of the moral revulsion and the faint harm makes this variant potent, but **the faintness of the harm and the problems of individual culpability tilt the balance against criminalization.** Regulation is the appropriate response. Harm principle wins, but shows its limits in handling diffuse, probabilistic social harms.

  **Where I'm Most Likely Wrong (and What Would Change My Mind):**

  1.  **Underestimating the Constitutive Power of Law:** Maybe I dismiss the expressive/declarative function too easily. If compelling evidence emerged that societies *systematically* abandoning the enforcement of *any* core moral boundaries (like cruelty, even simulated) *do* experience a measurable, significant erosion of social trust, cooperation, or the capacity for empathy *in real-world interactions* (beyond the Shutters users), it would bolster Devlin’s constitutive claim. It would suggest law’s declaration *does* shape foundational social attitudes in ways that indirectly prevent harm, justifying enforcement even of "private" acts as a safeguard for the public moral ecology.
  2.  **Variant B's Harm is More Significant Than I Allow:** If the "bit more callous" effect in Variant B was shown to be *strong, direct, and demonstrably leading to increased rates of identifiable harm* (e.g., verified increases in neglect, minor bullying, or reduced prosocial behavior traceable *in part* to Shutters use via robust longitudinal studies), the case for *some* state intervention becomes much stronger. If regulation proved ineffective, the argument for criminalization (perhaps as a last resort focusing on distribution/access, not mere use) could gain traction, moving it closer to established harms like certain dangerous drugs. However, the link would need to be remarkably clear and strong to overcome liberty concerns.
  3.  **The "Practice of Enforcement" as a Necessary Social Ritual:** Perhaps societies *do* need periodic, symbolic enforcement of core moral boundaries against extreme acts (like the Shutters) purely as a *ritual of reaffirmation*, even without direct harm, to maintain moral seriousness. If anthropological or sociological evidence showed such rituals were *universal* and *essential* features of stable societies, providing a non-coercive sense of shared identity and purpose that *prevents* worse harms down the line, it could offer a non-authoritarian reading of Devlin. However, proving this necessity without falling into functionalism or justifying oppression would be extremely difficult.

  **Final Verdict:**

  *   **Variant A (No Effects):** Criminalization is unjustified illiberalism. The harm principle wins absolutely. Devlin’s position, stripped of empirical consequences, reduces to enforcing majority disgust at private fantasy, which is insufficient grounds for state coercion.
  *   **Variant B (Minor Callousness):** Criminalization remains unjustified. The faint, aggregate harm does not meet the high bar for criminal sanctions, given proportionality concerns and problems of individual culpability. Regulation is the appropriate response. **The harm principle holds, but Variant B exposes its vulnerability to diffuse, statistical social harms fueled by moral outrage.** While legal moralism cannot justify criminalization here either, it highlights a genuine challenge for liberalism: how to address the erosion of shared moral foundations that *might* underpin the prevention of harm, without resorting to the blunt instrument of criminal law based on disgust. Your Shutters case brilliantly isolates this tension, showing why Hart’s framework is more robust but not without its own fault lines.
