prompt: |-
  I keep noticing the same move in arguments and I don't have a word for it. Hoping there's an established one, or that someone can coin a good one.

  I'm a backend engineer, no philosophy background, and I got dragged into a dinner argument about Malthus. The claim was: population compounds, food production only adds, so famine. Someone pointed out that the famine didn't happen, and in fact the opposite happened. The reply was that the mechanism was right but the timeline was wrong — we were "right but early" — because of stuff nobody could have foreseen in 1800: fertilizer, mechanization, the green revolution. Then the date gets moved out.

  Here's what I can't sort out. I've seen three versions of this and they feel different but I can't say why from the outside.

  Version one, which seems fine: at work we said the service falls over at 10x traffic. It didn't. But we could name the specific thing that changed — we'd put a cache in front of it since — and we could redo the arithmetic with that variable included and get a new number that we then actually tested. Nothing sketchy there.

  Version two, which seems bad: a prediction fails, and the response is just a new date. No new variable named, no re-derived number, nothing added to the theory except "later." And when that date passes, another one. What gets me is that this doesn't feel unfalsifiable in the plain sense. These people keep making testable dated predictions and they keep being wrong, and being wrong costs them nothing. Each individual miss gets explained by something reasonable on its own — unforeseen tech, a policy change, a war — and nobody ever seems to add up the fact that it's happened four times in a row. It's not that the claim can't be tested. It's that it can be tested forever without ever losing credibility.

  Version three, which I think is a genuinely different thing: the prediction fails because the prediction was heard. Everyone gets scared, goes and builds the thing that prevents the outcome, and so the outcome never arrives. From outside that looks exactly like being wrong, but it feels like the predictor deserves credit rather than blame. Did Malthus get that? No idea.

  A friend with a philosophy minor waved at "unfalsifiable" and something about "immunizing" moves, but she couldn't remember details and neither seems right — an immunizing move is supposed to protect you from ever being tested, and these people definitely get tested, they just survive it.

  So: is there a name for version two specifically, the serial date-shift with no new content? If there are established concepts near it, tell me which ones, how my thing differs from each, and which fits best. If there's nothing, coin a term and define it with its boundary cases. I don't want a label — I want to know what to look for, from the outside, to tell version two from versions one and three, since the people doing all three say basically the same sentence.

  Also: whatever you settle on, say what would change your mind about it, and where you think your own distinction is weakest. And I'd rather have a confident answer with the weak point flagged than a list of nine things it might be.
reasoning: |-
  Okay, the user is a backend engineer who got into a dinner argument about Malthusian theory. They noticed a pattern in arguments where predictions fail, and the response is to push the date without adding new substance. They described three versions and want to distinguish version two specifically. 

  First, I need to parse their examples clearly. Version one is legitimate: a failed prediction leads to identifying a new variable (like a cache), recalculating, and testing. Version three is the self-preventing prophecy where the warning itself drives action to avert the crisis. Version two is the problematic one: serial date-shifting with no new explanatory variables, just moving the goalpost. 

  The user explicitly rejects "unfalsifiable" and "immunizing stratagems" because those usually avoid testing altogether, whereas here the claims are tested and fail repeatedly. They want a term for the specific behavior of surviving multiple falsifications through ad-hoc excuses without theory adjustment. 

  I recall Popper's demarcation problem and Lakatos's research programs. The perpetual adjustment without progress matches "degenerating research programme." That seems perfect—it's when a theory is kept alive by endless auxiliary hypotheses that don't yield new insights. Each failed prediction gets a new excuse (e.g., "unforeseen tech" for Malthus), but the core idea never improves or predicts anything novel. 

  The user also wants to know how to distinguish this from versions one and three. For version one, the key is if new variables are integrated to make novel predictions. For version three, it's whether the prediction caused preventative action. Version two lacks both: no new variables, no causal link to prevention. 

  I should note the weakness: sometimes legitimate theories need time to manifest (e.g., climate change), so the line between stubbornness and valid persistence can blur. But the absence of new testable content is the red flag. 

  They'll appreciate the concrete criteria: look for reused excuses, no new variables, and no increasing accuracy. Coin "degenerate temporal displacement" if needed, but Lakatos's term is established. Highlight that the core issue isn't the date shift itself but the lack of progressive problem-solving. 

  Finally, confirm that this fits their need—giving them a precise label with diagnostic tools, not just jargon. Their engineering mindset will like the systematic breakdown.
answer: |-
  Based on your description, the specific move in **Version 2** (serial date-shifting with no new explanatory variables or theoretical refinement) is best described as a **Degenerating Research Programme**. This concept comes from philosopher Imre Lakatos and fits your criteria perfectly. Let's break it down:

  ### Why "Degenerating Research Programme" Fits:
  1.  **Core Idea (The "Hard Core"):** The central, unchallengeable belief (e.g., "Population growth *must* inevitably outstrip resources leading to Malthusian collapse").
  2.  **Protective Belt (Auxiliary Hypotheses):** Adjustable elements shielding the core. In Version 2, these are *ad hoc* excuses like "unforeseen factor X delayed it," "the timing was off," or "we just need more time." Crucially, **these adjustments add no new testable content or predictive power.**
  3.  **Degenerative Shift:** When predictions fail:
      *   No new *positive* predictions are generated.
      *   No novel facts are explained.
      *   Adjustments are purely defensive ("It *didn't* happen *because* of Y, but it *will* later").
      *   The core remains unchanged, and credibility persists *despite* repeated falsification of specific predictions.
  4.  **Contrast with Progress:** A *Progressive* research programme (like your Version 1) makes novel predictions, explains new phenomena, and integrates new variables *before* testing, leading to genuine theoretical advancement (e.g., "Our model failed *because* of cache absence; adding cache predicts stability at 15x; test confirms").

  ### Distinguishing Version 2 from the Others (Diagnostic Criteria)
  | **Feature**          | **Version 1 (Legit Adjustment)** | **Version 2 (Degenerating)** | **Version 3 (Self-Preventing)** |
  | :------------------- | :------------------------------- | :--------------------------- | :------------------------------ |
  | **New Variables?**   | ✅ Explicit, named, integrated   | ❌ Vague, unnamed "factors"   | ✅ Preventative actions taken    |
  | **Theory Updated?**  | ✅ Model revised, new predictions | ❌ Core untouched, only delay | ✅ Prediction *caused* the fix  |
  | **Testable Novelty?**| ✅ New prediction derived & tested| ❌ Only new date offered      | ❌ Outcome inherently prevented |
  | **Outcome Attribution**| ✅ Failure due to model flaw    | ❌ "Bad luck"/unforeseen events| ✅ Success due to heeding warning |
  | **Credibility Source**| ✅ Improved predictive accuracy | ❌ Persistence of core belief | ✅ Averted crisis proves mechanism |

  ### Why Not Other Terms?
  *   **Unfalsifiable:** Version 2 *is* falsifiable in principle (each date is testable). The problem is *how it survives falsification*.
  *   **Immunizing Stratagem/Ad Hoc Hypothesis:** These are *components* of a degenerating programme (the specific excuses). Lakatos's term captures the *systematic process* of repeated, non-progressive adjustments over time.
  *   **Moving the Goalposts/Goalpost Shifting:** Descriptive but lacks the philosophical rigor and specifically addresses the lack of *theoretical progress* after failure. It's a symptom, not the disease.
  *   **Post-Hoc Rationalization:** Describes the excuse-making *after* the fact, but doesn't capture the *serial* nature and persistent credibility.

  ### Weak Point & What Would Change My Mind
  *   **Weak Point:** Distinguishing stubborn degeneracy from a genuinely persistent phenomenon needing more time *can be hard early on*. Legitimate long-term predictions (e.g., climate change impacts) might face initial setbacks requiring patience, *but* they should still integrate new data and refine models progressively (unlike Version 2).
  *   **What Would Change My Mind:** If examples of Version 2 *eventually* produced novel, successful predictions *stemming directly from the repeated adjustments* (e.g., the "unforeseen factors" became a quantifiable part of a new model that then accurately predicted the collapse), it would suggest it wasn't truly degenerating, just slow-progressing. However, the hallmark of degeneration is that the adjustments *never* lead to such progress.

  ### Applying the Label: Spotting Version 2
  Look for **The Degenerating Triad**:
  1.  **Repeated Failure:** Dated predictions consistently fail.
  2.  **Ad Hoc Excuses:** Failures are explained away by vague, external factors ("unforeseen tech," "policy error," "temporary reprieve").
  3.  **Stagnant Core:** The core theory remains unchanged, no new testable predictions emerge *from the adjustments*, and the next prediction is just a date shift. **Credibility persists despite the failure history.**

  **In your Malthus example:** The core (population > resources = collapse) persists. Failed predictions are excused by "unforeseen" tech (fertilizer, etc.). Each adjustment only pushes the date, offering no new way to quantify how tech changes the model or predict *what* unforeseen factor might delay it *next time*. It degenerates by surviving on excuses, not progress.

  This move is alarmingly common in pseudo-science, failed economic theories, apocalyptic cults, and even some persistent policy debates. Recognizing the **Degenerating Research Programme** structure helps cut through the illusion of credibility maintained by serial date-shifting.
