answer: |-
  Below is a rigorously prioritized research agenda for your fund's debate-focused portfolio, grounded in alignment theory, game theory, and formal epistemology. I've evaluated your six candidate directions against **dependency logic** (which questions unlock others), **tractability** under resource constraints, **neglect-adjusted importance**, and **concrete 18-month deliverables**. After rejecting flawed framings, I synthesize four merged/replaced priorities.

  ---

  ### Rejected Framings & Why
  1. **"Is debate distinct?" (Your #6) → Overly taxonomic**  
     Whether debate is a "special case" of recursive reward modeling or forecasting is philosophically interesting but operationally irrelevant. What matters is its *unique mechanics* (e.g., adversarial pressure, turn-taking). Funding this yields no actionable insights for deployment. **Rejected.**

  2. **"Steelman-swap as a silver bullet" (Your #3) → Premature optimization**  
     While clever, role randomization doesn't resolve core issues like judge gullibility or obfuscation. It assumes honesty incentives dominate, which is the very problem under scrutiny. Testing variants is downstream of understanding baseline failure modes. **Rejected as primary priority.**

  3. **"Precedent libraries" (Your #2) → Depends on solved bootstrapping**  
     Long-term citation dynamics presuppose a functional debate system. If early debates corrupt the judge or produce inconsistent truths, caching amplifies errors. Important but **deferred**; it requires a stable judge first.

  ---

  ### Prioritized Research Agenda (4 Questions)
  #### **1. Bootstrapping Dynamics & Judge Corruption (Merges your #4 with #1)**  
  *Why upstream?* If the judge cannot self-improve without collapse, nothing else matters. Bootstrapping is the thermodynamic foundation: all other mechanisms assume a judge capable of learning.  
  *Tractability:* High for theory/small experiments. Use open-weight models to simulate iterated debate chains (e.g., GPT-3.5 judging debates between fine-tuned GPT-2s). Measure drift in judge accuracy over "generations."  
  *Neglect:* Extreme. Most debate work assumes judges are fixed or exogenous.  
  *18-month deliverable:* **Formal model of corruption equilibria** (e.g., theorem showing conditions for oscillation vs. collapse when debaters optimize for winning).  
  *Downstream dependency:* Required to validate any long-term mechanism (e.g., precedent libraries).

  #### **2. Task Structure & Certificate Existence (Your #5, refined)**  
  *Why upstream?* Debate only helps for tasks with "short certificates" (verifiable faster than generating solutions). If most alignment-critical tasks (e.g., "Is this goal coherent?") lack certificates, debate is useless.  
  *Tractability:* Ideal for theory. Map real tasks (e.g., backdoor detection, reward function verification) to complexity classes (NP, coNP, Π₂P). Small experiments: Test debate on MNIST adversarial examples vs. ethical dilemmas.  
  *Neglect:* Underserved; much debate literature handwaves task properties.  
  *18-month deliverable:* **Complexity-theoretic taxonomy** of 50+ alignment tasks + **empirical correlation** between small-model debate success and certificate length.  
  *Dependency:* Informs obfuscation defenses (e.g., logical obfuscation only matters for NP tasks).

  #### **3. Obfuscation Typology & Defense Efficacy (Your #1, focused)**  
  *Why now?* Understanding *which* obfuscation breaks debate determines where to invest defenses. Pragmatic obfuscation (exploiting judge heuristics) may dominate at scale.  
  *Tractability:* Moderate. Requires building "adversarial debaters" in small models (e.g., RL agents trained to obfuscate in text games). Test "verification tax" via retrieval-augmented debates.  
  *Neglect:* Partial work on logical obfuscation, but pragmatic almost unstudied.  
  *18-month deliverable:* **Obfuscation dominance hierarchy** (e.g., "pragmatic > empirical > logical in 80% of small-scale cases") + **counterexample** where cross-examination backfires.  
  *Dependency:* Requires #2 to contextualize (e.g., heuristics matter most in high-complexity tasks).

  #### **4. Argumentation Mechanics Under Uncertainty (New: Synthesizes #3 & empirical gaps)**  
  *Core question:* How do debaters explore imperfect information? Focus on *steelman-swap viability* and *lie propagation* when truth is ambiguous.  
  *Why included?* Steelman-swap may mitigate asymmetric dishonesty *if* combined with uncertainty (e.g., debaters can't know which lies are safest).  
  *Tractability:* High. Game-theoretic simulations + small NLP experiments (e.g., compare steelman-swap vs. classic debate on contradictory evidence tasks).  
  *Neglect:* Argumentation under uncertainty is understudied in ML debate.  
  *18-month deliverable:* **Equilibrium analysis** of steelman-swap in signaling games + **accuracy/robustness trade-off curves** in ambiguous tasks.  
  *Dependency:* Less upstream but feasible now; complements #1–#3.

  ---

  ### Explicit Trade-off: What Not to Fund
  - **Against: Precedent Libraries (Your #2)**  
    *Why?* Genuinely important for real-world deployment, but **critically depends on solved bootstrapping**. If judges corrupt in 5 debate generations (per #1), caching accelerates disaster. With limited budget, this is a "last 10% problem." Fund after core robustness exists.

  ---

  ### The 60% Bet: Bootstrapping Dynamics
  **Allocation:** 60% of resources (4–5 researcher-years).  
  **Inside-view rationale:** If bootstrapping fails (e.g., unavoidable judge corruption), debate is a dead end. Conversely, proving convergence enables all other work.  
  **What must be true for payoff:**  
  1. Formal models must capture *non-trivial judge corruption dynamics* (e.g., debaters "hacking" the judge's reward function).  
  2. Small-scale experiments must show *predictive validity* (e.g., corruption patterns in 3-layer models extrapolate theoretically to larger systems).  
  **Failure mode:** If judge corruption is chaotic or unmodelable at any scale, this work hits a wall — but that itself is a crucial negative result.

  ---

  ### Dependency Graph & Unknowns  
  ```mermaid
  graph TD
      A[Bootstrapping] --> B[Task Certificates]
      B --> C[Obfuscation Typology]
      A --> D[Argumentation Mechanics]
      C --> D
  ```
  **Key unknown:** Empirical dominance of obfuscation types (#3) depends on *scaling properties* we can't test. We mitigate this by:  
  - Using complexity theory (#2) as a proxy  
  - Stress-testing heuristics in adversarial small models  

  This portfolio resolves foundational uncertainties before optimizing mechanisms, maximizing impact per constrained researcher-year. If bootstrapping succeeds, pivot to deployment (e.g., precedent libraries); if it fails, pivot away from debate.
