               Table 3: A sign "Policy: Play every round", a coin, bid box (only one bid at the beginning), and a recorder sheet for the policy players (they will play 8 rounds).
               Table 4: A sign "Known Cap: 2^20", a coin, bid box, recorder sheet.
          - The shared vault: a large poster or a whiteboard with the initial amount: 10,000 points. It is visible to all.

     - (40 min) Game rounds: 8 rounds, each round takes 5 minutes.

          Structure of a round (5 minutes per round):

          - At each rotating table (1,2,4): 
               a. The students at the table choose one bidder for this round (by turn, or volunteer, but must be fair).
               b. The bidder secretly writes their bid (how much they are willing to pay to play) on a slip and puts it in the bid box. The bid must be between 0 and their current points? But they might go into debt? We don't want that. They can bid any amount they want, but if they win, they must have enough to pay. They start with 1000 points. They can bid up to their current points? Or we allow borrowing? Let's not allow borrowing. They can bid up to their current points.

          - At Table 3: 
               - In the first round, the policy players write their bid (for the entire policy) and put it in the bid box. Then they start playing. In subsequent rounds, they don't bid again, they just play.

          - Then, at each table, the bidder (or policy players) plays the game:
               - Flip a fair coin until tails. Count the number of heads (n). The payout is:
                   - Table 1,2,4: 2^n, but capped if applicable.
                   - Table 2: if 2^n > cap (from the envelope), then payout = cap. Otherwise, 2^n. (The cap is not revealed until the end.)
                   - Table 4: payout = min(2^n, 2^20)
                   - Table 1: payout = min(2^n, current vault balance)  [because if the vault doesn't have enough, they get what's left]
                   - But note: the vault is shared. So after each payout at Table 1,2,4, we subtract the payout from the vault. For Table 2 and 4, we also have the cap, but then if the vault is insufficient, they get the vault balance? So the actual payout is min(2^n, cap, current vault)? 

                   Specifically:
                      Table 1: payout = min(2^n, vault)
                      Table 2: payout = min(2^n, cap, vault)   [but the cap is hidden]
                      Table 4: payout = min(2^n, 2^20, vault)

                   For Table 3: 
                      In each round, they play and record the payout for that round (min(2^n, 2^20) because we set a cap for Table 3 too? We have to set a cap for Table 3 to avoid infinite payouts? Let's set it at 2^20. But they are not paid immediately. They accumulate.

          - After the flip, the payout is calculated. Then:
               - For rotating tables: the bidder pays their bid (to the house) and then receives the payout. Net gain = payout - bid. They record this in their passport. Also, the vault is reduced by the payout (if the game is at Table 1,2, or 4).
               - For Table 3: in each round, they record the payout. They do not pay anything per round (they already paid the bid upfront). At the end of the session, they will receive the total of the 8 payouts. Then net gain = total payouts - bid.

          - The vault reduction: after a payout at Table 1,2, or 4, the vault is reduced by the amount paid out. If the vault becomes zero, then future payouts at Table 1,2,4 will be zero? Or whatever is left? We do: payout = min(computed_payout, vault), and then vault = vault - payout.

          - We update the vault after each play at Table 1,2,4.

          - Also, at Table 2, they do not know the cap, so they bid without knowing what the cap is (but they know the distribution).

     - (5 min) After 8 rounds, we stop the gameplay. For Table 3, we compute the total payout for each policy player (sum of their 8 payouts). Then they receive that amount and subtract their bid.

     - (20 min) Debrief: We gather the bids and outcomes from all tables. We display summary statistics. See below.

  8. Materials:

     - A visible vault: a large poster or whiteboard with the initial value: 10,000 points. We update it after each play at Table 1,2,4.
     - Coins: 4 coins (one per table)
     - Bid boxes: small boxes for sealed bids at each table (for Table 3, only used in round 1).
     - Bid slips: small papers for writing bids.
     - Recorder sheets at each table to record: round, bidder, bid, number of heads, payout, net gain for the bidder.
     - Passports for students: to record their own bids and net gains at each play.
     - For Table 2: a sealed envelope containing the cap. The cap is drawn from a uniform distribution between 2^5=32 and 2^15=32768. We can have the instructor draw it before class and seal it.
     - For Table 3: a sign explaining the policy and the cap (2^20).

  9. What will go wrong:

     - A student bids zero as a joke: then they get to play for free and might win. That's fine, it shows that a low bid can be lucky.
     - The vault runs out early: then later players at Table 1,2,4 get nothing. This is by design.
     - A student at a rotating table might not want to bid high because they see the vault is low. This is also by design.
     - The hidden cap at Table 2 might be very low or very high. We want that uncertainty.
     - The policy players at Table 3 might have a bad run (low average) or a good run. We hope they bid reasonably given the expected value of 21 per play (so for 8 plays, expected total is 168). But they might bid very high or very low.
     - Time: 5 minutes per round might be tight. We have to flip coins and record. If a long streak happens, it might take time. We can set a practical limit: stop flipping after 20 heads? But that's very unlikely. Or use a computer? But coins are more tangible.
     - Coin lands on the floor: have extras.
     - Students try to hedge across tables: they might bid low at one table to save points for another. That's natural.
     - Discussion about extra credit: we can say that the points are proportional to extra credit, and 1000 points = 3 extra credit points. So they should treat points as money.

  10. The debrief (20 minutes):

      We want to highlight:

      a. The gap between the theoretical infinite expected value and the actual bids.
      b. The effect of the house bankroll (vault) and how it made later plays less valuable.
      c. The effect of ambiguity (Table 2) vs. risk (Table 4).
      d. The difference between one-off play and a policy (Table 3).

      Steps in debrief:

      Step 1: Collect the bids for one-play games (Tables 1,2,4) and the policy bid for Table 3 (per play: bid/8).

      Step 2: Display the distribution of bids for each table.

      Step 3: Ask the students:

          - "What was the highest bid you saw? The lowest?"
          - "Did anyone at Table 1 (shared vault) change their bid as the vault depleted? Why?"
          - "At Table 2 (hidden cap), were you nervous about the cap? How did that affect your bid compared to Table 4 (known cap)?"

      Step 4: Highlight specific moments:

          - "In round 3, at Table 1, a player bid X and won Y. Then in round 7, at Table 1, a player bid Z and won 0 because the vault was empty. Did the second player make a mistake? Or was it just bad luck?"

          - "At Table 3, the policy players: what was your total payout? How did it compare to your bid? If you played again, would you bid the same?"

      Step 5: Connect to the St. Petersburg paradox:

          - "The expected value of one play without a cap is infinite. But in our game, we had caps and a finite vault. How did that change the expected value?"

          - "Even at Table 4 (known cap of 2^20), the expected value is 21. Did your bids at Table 4 reflect that? Why or why not?"

          - "The student who claimed that the expectation is not well defined because of the order of summation: in our game, the order mattered because of the shared vault. If we had played in a different order, the outcomes would be different. But the expectation is defined as an average over all possible outcomes, not depending on order. However, the value to you does depend on the order (when you play)."

      Step 6: Conclude with the standard fixes:

          - "Which of the standard explanations did we see in the activity?"
              1. Diminishing marginal utility: we didn't model that. We used linear points. (We can mention that if money had diminishing utility, then the value would be finite.)
              2. Finite bankroll: we saw that at Table 1 and via the caps.
              3. Nonlinear probability weighting: we didn't model that, but at Table 2, the ambiguity might have led to lower bids, which is related.
              4. Policy (long run): we had Table 3. Even though the expected value per play was finite (21), the average of 8 plays might not be 21. And if there were no cap, the expected value would be infinite, but the average of many plays might still be modest because of the heavy tail.

          - "Each fix changes the question: 
              - Finite bankroll: we are not playing the original game.
              - Policy: we are not valuing one play, but a series.
              - Diminishing utility: we are not valuing money linearly.

            The original question remains: why don't people value one play of the original game at its expected value? And the activity shows that in practice, we are always in a context of finite resources, and the order matters."

      Step 7: Address what we couldn't reproduce:

          - The actual tail: we didn't see a payout over 1000 points? because it's very unlikely. So we didn't experience the infinite expectation.

          - The fake currency: extra credit points are not real money, so they might not care as much. But we made it small to avoid distortion.

          - We had to set caps to make it run.

          The facilitator should say: "In the real St. Petersburg game without any caps, the expected value is infinite, but in practice, you will never see a payout that is astronomical because the probability is too small. This activity cannot show that tail, so we used caps. But the caps make the expectation finite. The paradox remains in the uncapped game."

  11. Adjustments for time:

      - Instead of 8 rounds, we might do 6 rounds (if pressed for time). Then each rotating group visits each table for 2 rounds? Then 3 rotations of 2 rounds each.

      - Or we can do 4 rounds: each group visits each table for one round? Then they only play once per table.

      Given 75 minutes, 8 rounds might be tight. Let's do 6 rounds (three rotations of 2 rounds each). Then:

          - Introduction: 5 min
          - Enrollment and grouping: 5 min
          - 6 rounds * 5 min = 30 min
          - Policy table wrap-up: 5 min
          - Debrief: 20 min
          Total: 65 min, leaving 10 min buffer.

      But then the policy table only plays 6 rounds? That's okay.

      Alternatively, we can have the policy table play every round, so they play 6 rounds.

      The shared vault might last longer if we start with 10,000? We can adjust the initial vault to be lower to increase the risk of default? Say 5000 points.

      We'll try to run it and adjust.

  This is a complex activity, but it should make the students feel the paradox.
answer: |-
  Below is a complete, detailed plan for your St. Petersburg paradox activity, designed to make students *feel* the gap between theory and behavior through hands-on play. It emphasizes discovery, avoids upfront lecturing, and structures the debrief to draw out key insights. The setup uses four tables (clusters) and a shared vault to create tangible consequences.

  ---

  ### **Activity Overview**
  - **Goal**: Force students to confront the St. Petersburg paradox through lived experience, revealing why rational agents reject "infinite expectation" in practice.
  - **Core Mechanics**: 
    - Students start with 1,000 "points" (convertible to extra credit: 300 points = 1 problem-set point, capped at 3 points). 
    - They circulate to 4 tables, bidding to play variants of the St. Petersburg game. 
    - A **shared vault** (initial balance: 5,000 points) drains with every payout, creating bankruptcy risk. 
    - **No mention of "expected value" until debrief**.
  - **Time**: 75 minutes total (timeline below).
  - **Students**: 18 (4–5 per table cluster).

  ---

  ### **Table Setup & Rules**
  Each table runs a unique variant. Rules are printed on table placards. **Materials per table**:  
  - Coin, bid box, tally sheet, timer, calculator.  
  - Shared vault: Central whiteboard tracking balance (updated after each payout).  

  | Table | Variant                  | Rules                                                                                                                                                                | Purpose                                                                 |
  |-------|--------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------|
  | 1     | **Visible Vault Risk**   | - Payout = `2^n` (n = heads before tails).<br>- If vault < `2^n`, payout = remaining vault.<br>- *House rule*: Vault shared across **all tables**; updates public. | Forces awareness of sequence risk (early vs. late play).                |
  | 2     | **Hidden Cap + Ambiguity** | - Payout = `min(2^n, Cap)`.<br>- Cap is in a sealed envelope drawn from a uniform distribution: `[2^5, 2^6, ..., 2^{15}]` (32 to 32,768).<br>- Distribution shown; cap hidden until final debrief. | Elicits ambiguity aversion (unknown cap vs. known probabilities).        |
  | 3     | **Policy Commitment**    | - Bid upfront for a **policy**: Play *every round* for the rest of the session.<br>- Final payout = *average* of all rounds played.<br>- No per-round bids. | Contrasts one-off vs. repeated play (law of large numbers).             |
  | 4     | **Known Cap**            | - Payout = `min(2^n, 2^{10})` (cap = 1,024).<br>- Cap is public.                                                                                                  | Baseline for bounded rationality (finite expectation = 11).             |

  ---

  ### **Gameplay Procedure**
  **Total Time**: 45 minutes (6 rounds × 7 min/round + setup).  
  **Movement**: Rotate tables every 2 rounds. Groups start at one table, then cycle (e.g., Group A: Table 1 → 2 → 3 → 4).  
  **Per-Round Flow** (7 minutes):  
  1. **Bid (2 min)**: 
     - At Tables 1, 2, 4: Each student writes a **sealed bid** (what they’ll pay to play that round).  
     - At Table 3: Only **policy bids** in Round 1 (upfront for all rounds).  
     - *Constraints*: Bid ≤ current points; no negative bids.  
  2. **Play (3 min)**:
     - Flip coin until tails. Record `n` (heads in a row).  
     - Calculate payout (use calculator for Tables 2/4 caps).  
     - **Vault update**: Deduct payout from shared vault (if $0$, subsequent payouts = $0$).  
  3. **Settle (2 min)**:
     - **Winning bid**: Highest bidder plays (if tie, RNG select). Others keep points.  
     - **Payout**: Winner receives `payout - bid`; others keep bid.  
     - **Record**: Tally sheet tracks bids, n, payouts, net gains.  

  **Policy Table (3) Notes**:  
  - Policy bidders play *all* rounds. Their payout is the **average of all rounds** (e.g., 6 rounds played → total payout/6).  
  - Only one policy bid/player (no re-bidding).  

  ---

  ### **Timeline**
  | Time    | Phase               | Key Actions                                                                                                |
  |---------|---------------------|----------------------------------------------------------------------------------------------------------|
  | 0–5 min | Intro & Groups      | - Explain points system (no EV discussion!).<br>- Assign groups (4–5 students); send to starting tables. |
  | 5–10 min| Table Setup         | - Distribute materials.<br>- Explain table rules (students read placards; no Q&A beyond clarities).      |
  | 10–55 min| Game Rounds (6×)    | - Run 6 rounds (follow per-round flow above).<br>- Rotate groups every 2 rounds.                         |
  | 55–60 min| Policy Payouts      | - Calculate policy payouts (Table 3): Avg = total winnings / rounds played.                             |
  | 60–75 min| **Debrief**         | *(Detailed below)*                                                                                       |

  ---

  ### **Debrief Plan** (15 min)  
  **Goal**: Link experiences to theory without lecturing. Use Socratic questioning to expose contradictions.  

  1. **Data Reveal (3 min)**:  
     - Display bids/payouts per table (e.g., "Table 1 bids: 5, 18, 200, 0, 0").  
     - Ask: *"Which bids surprised you? Why?"*  
     - **Key moment**: Highlight a high bidder who busted (vault empty) vs. low bidder who won.  

  2. **Paradox Pressure (5 min)**:  
     - Q1: *"The ‘infinite expectation’ answer assumes no cap. At Table 4 (cap=1,024), the expectation is 11. Did anyone bid close to 11? Why not?"*  
       - → Elicit: "Unlikely gains aren’t worth real money."  
     - Q2: *"At Table 1, early players bid higher than late players. Is the game ‘worth less’ later? Does that change what ‘rational’ means?"*  
       - → Hook: "Finite bankrolls make the game state-dependent."  
     - Q3 (for policy players): *"You committed to all rounds. Was your bid higher or lower than one-off players? Why?"*  
       - → Contrast: One-off vs. policy valuation.  

  3. **Standard Moves Critique (4 min)**:  
     - *"Last week, you named fixes. Let’s map them to today:*  
       - *Table 4’s cap? You bounded the game.*  
       - *Table 1’s vault? You simulated a finite house.*  
       - *Policy play? You averaged over time.*  
       *But—did these ‘solve’ the paradox or *avoid* it? What question does each really answer?"*  
     - → Push: "Diminishing utility wasn’t staged—did you still *feel* it? Why?" (Point: Nonlinear scaling arises from lived risk, not math).  

  4. **Summation Order & Tail Risk (3 min)**:  
     - *"One of you said the expectation isn’t defined. Did today support that?"*  
       - → Highlight: Vault sequencing made outcomes order-dependent.  
       - *"We capped payouts because flipping 30 heads is impossible here. But if we *could*, would you bid your life savings? Why not?"*  
       - → Conclusion: The tail is theoretically real but pragmatically ignorable—agents "clip" infinities.  

  ---

  ### **Predictable Problems & Mitigations**  
  | Issue                        | Mitigation                                                                                                |
  |------------------------------|---------------------------------------------------------------------------------------------------------|
  | **Bid of 0 as "joke"**       | Allow it! Debrief it: *"Did $0$ bidders ‘win’? Is avoiding loss rational?"*                             |
  | **Hedging across tables**    | Encourage: *"Smart diversification! But did it resolve the paradox?"*                                   |
  | **Vault math too slow**      | Assign a "vault tracker" student; use calculator; cap flips at n=10 (payout=1,024).                      |
  | **Coin lands on floor**      | Keep spare coins; re-flip.                                                                              |
  | **"Extra credit isn’t real"**| Start by emphasizing: *"Points = cash value (3 EC points). Bid what you’d really pay."*                 |
  | **Policy table confusion**   | Pre-write policy rules on placard; enforce: *"No per-round bids—commit upfront!"*                       |

  ---

  ### **What the Activity Can’t Replicate**  
  1. **The true tail**: Unlikely events (e.g., 20+ heads) won’t occur. Students won’t *feel* the terror of infinite sums.  
     - **Facilitator says**: *"We capped payouts for practicality. But imagine: Would you pay $1M for a 1-in-a-billion shot at $10^{100}? In theory, yes. In life, no. That gap *is* the paradox."*  
  2. **Scale of real money**: Points lack lifetime stakes.  
     - **Facilitator says**: *"We use points to simulate risk, but real choices involve mortgages, careers, futures. That’s why nonlinear utility *emerges*."*  
  3. **Additivity of expectation**: Students might miss that policy play *assumes* expectation is additive.  
     - **Facilitator says**: *"You averaged policy payouts—but if expectation is infinite, the average *should* explode. Why didn’t it? Because caps make it finite. Without caps? We can’t stage it, but math says: It still diverges."*  

  ---

  ### **Why This Works**  
  - **Experiential gap**: Students *lose* points when the vault busts, *feel* ambiguity at Table 2, and *see* policy payouts disappoint—before labeling concepts.  
  - **Debrief precision**: Moments like a vault bankruptcy or hidden-cap bid become hooks for specific arguments (e.g., "Was that player irrational, or was the model wrong?").  
  - **No cheap fixes**: By staging the "solutions," you force students to see them as workarounds, not answers.  

  This plan balances chaos (coin flips, vault runs) with control (timed rounds, rotation) to maximize revelation. Run it tight, and the debrief will write itself from student experiences.
