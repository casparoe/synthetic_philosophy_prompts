  *noticing their expertise* Should acknowledge their dose-response point isn't foolish - but emphasize that ethical calculus can't afford the luxury of dismissing statistical probabilities just because they're imperceptible. The pub-talk tone helps - can say "look" and "mate" to keep it grounded. 

