prompt: |-
  A mate of mine is in a small sports-betting syndicate and ive been trying to work out what their actual rules commit them to. The rules are: size every bet with the Kelly criterion off their model's own probabilities; bet half of whatever fraction Kelly gives, on the grounds that the probabilities are estimated rather than known; stop betting for the rest of the season if the bankroll drops below 60% of where it started the season; and at the end of each season withdraw everything above a fixed starting stake, so compounding restarts at the same number every year, even though they describe what theyre doing as maximizing long-run growth.

  What does that package presuppose? Is the thing doing the work really log utility / geometric growth, or is it just unstated risk aversion plus estimation risk, and which parts of the practice strictly require which? Does cashing out every year quietly undercut the long-run growth argument, which needs compounding to get going, and leave only the myopia-of-log argument, or are those the same argument in different clothes? Does the 60% floor presuppose a side constraint or a lexicographic cut-off that no growth-rate story can generate on its own, and does the result that Kelly eventually beats any essentially different strategy even survive once you put an absorbing barrier in the model? Also, over a season of a few hundred bets, isnt the asymptotic result basically beside the point?

  Half-remembered and worth checking: in the continuous approximation the growth rate is roughly quadratic in the fraction staked, so anything past about twice your Kelly fraction has negative growth and half Kelly costs you only about a quarter of the maximum growth rate. If thats right, does it make half Kelly defensible on straight growth-maximizing grounds, or does that move smuggle in something extra? And is there a view about pure time preference in here somewhere, given that they discount future bankroll growth at zero while pulling winnings out immediately?

  Please keep settled math separate from whats genuinely contested among people who know this material, e.g. whether the growth-rate argument is an independent justification of Kelly or just log utility in disguise, and dont present a contested reading as the consensus. And tell me where the rules are underdetermined, i.e. where several different theories would license exactly the same behaviour.
reasoning: |-
  Okay, the user is asking about their friend's sports-betting syndicate rules and wants to unpack the underlying assumptions. Let me start by breaking down each rule. They use Kelly criterion based on their model's probabilities but bet half of that fraction. Why half? Probably because they acknowledge estimation risk. Then there's a stop-loss at 60% bankroll, and they reset the bankroll every season by withdrawing excess. They claim to maximize long-run growth, but does resetting undermine that?

  First, I need to recall how Kelly works. Kelly maximizes expected logarithmic utility, which is tied to long-term growth. Betting half-Kelly is common when probabilities are uncertain. The half reduces risk but also cuts into growth. The math shows that half-Kelly sacrifices about 25% of growth, which might be acceptable given estimation errors. But is this still growth-maximizing? Not exactly; it's a trade-off between growth and risk.

  The 60% stop-loss is interesting. Kelly itself doesn't have stop-losses. This rule introduces an absorbing barrier, which isn't part of the original Kelly setup. Asymptotically, Kelly still dominates, but in finite bets, especially a few hundred per season, ruin risk is real. So the stop-loss is a practical risk management tool. But does it conflict with long-term growth? Possibly, because after stopping, they miss future bets. It's more about avoiding ruin than pure growth.

  Resetting the bankroll each season is another point. Compounding is key to Kelly's growth. By resetting, they prevent compounding across seasons. So they're only compounding within a season, not long-term. This might be due to psychological reasons or cashing out profits, but it limits the geometric growth. It's like starting over each year, so the long-run growth argument doesn't hold across years. Instead, each season is a separate sequence.

  Now, the user's deeper questions: Is log utility the same as growth maximization? In infinite wealth and no constraints, yes. But with a stop-loss or reset, it's different. The half-Kelly and stop-loss suggest risk aversion and estimation uncertainty. The reset might indicate a preference for liquidity or myopic goals. 

  Are these rules underdetermined? Multiple theories could justify half-Kelly: risk aversion, estimation error, or even transaction costs. The stop-loss could come from risk of ruin concerns or psychological comfort. The reset might be about withdrawal needs or separating betting periods. 

  The user also asked about the 60% barrier affecting asymptotic results. Yes, with an absorbing barrier, strategies that avoid ruin might outperform Kelly in finite time, though Kelly still wins asymptotically. But with seasons and resets, asymptotic results are less relevant. 

  In summary, the rules mix growth aims with practical adjustments. Half-Kelly handles uncertainty, stop-loss prevents ruin, and reset might be for operational reasons. The syndicate isn't purely maximizing growth; they're balancing growth with risk and liquidity.
answer: |-
  Here's a breakdown of the syndicate's rules, their presuppositions, and the tensions between them, separating settled math from contested interpretations:

  **Core Components & Their Presuppositions:**

  1.  **Kelly Sizing (with Model Probabilities):**
      *   **Presupposes:** Belief in maximizing the *expected value of the logarithm of wealth* (or equivalently, maximizing long-run geometric growth rate *under ideal conditions*).
      *   **Requires:** Accurate probabilistic estimates and repeated identical fractional betting over a very long horizon with no constraints.

  2.  **Half-Kelly Betting Fraction:**
      *   **Presupposes:** Significant *model risk* or *estimation error*. The syndicate explicitly states this is because probabilities are estimated, not known.
      *   **Settled Math (Continuous Approximation):** The growth rate `g(f)` is indeed approximately quadratic near the optimal fraction `f*`: `g(f) ≈ g(f*) + (1/2) * g''(f*) * (f - f*)^2`. Since `g(f)` is concave down at `f*`, `g''(f*) < 0`.
          *   **Consequence:** Betting `f*` yields `g(f*)`. Betting `0.5*f*` yields `g(0.5*f*) ≈ g(f*) + (1/2) * g''(f*) * (-0.5*f*)^2 = g(f*) + (1/8) * |g''(f*)| * (f*)^2`. The sacrifice is roughly `(1/8) * |g''(f*)| * (f*)^2`, often cited as ~25% of the *growth rate*, not the bankroll. This is accurate for small `f*` and favorable bets.
      *   **Growth-Maximizing Defense?** **Not purely.** Half-Kelly is primarily a *risk management* measure against overestimation. It presupposes that the variance of estimation error is high enough that using full Kelly would lead to ruin or unacceptable drawdowns *faster* than the sacrificed growth rate is worth. It's trading *potential* growth for *safety* and *robustness* against model error. It *smuggles in* aversion to the specific risk of model failure/bankruptcy.

  3.  **60% Bankroll Floor (Absorbing Barrier):**
      *   **Presupposes:** A **lexicographic preference** or **hard constraint**. Growth maximization (log utility) *alone* does not generate an absorbing barrier. It presupposes:
          *   Extreme risk aversion to falling below a critical threshold (operational failure? psychological breaking point? syndicate agreement?).
          *   The existence of *costs* (financial, operational, or reputational) associated with a severe drawdown that are catastrophic and irreversible.
          *   That continuing to bet below 60% carries risks (e.g., emotional decision-making, inability to place optimal bets) deemed unacceptable.
      *   **Impact on Asymptotics:** **Yes, it breaks the pure Kelly argument.** The standard Kelly proof (eventually dominating any "essentially different" strategy with probability 1) assumes infinite time and no absorbing barriers. A 60% floor creates an absorbing state where growth stops.
          *   **Finite Horizon Relevance:** This barrier is *crucially important* for a season of "a few hundred bets." The probability of hitting the barrier within a season is non-negligible and likely a primary driver of the rule. Asymptotic dominance is irrelevant here; survival and performance within the season matter most.

  4.  **End-of-Season Reset (Withdrawal above Starting Stake):**
      *   **Presupposes:**
          *   **Myopic Time Preference / Non-Compounding Preference:** This is the most radical departure from pure long-run growth maximization. It presupposes that compounding *across seasons* is undesirable or irrelevant. Reasons could include:
              *   Desire for annual liquidity/withdrawals (pure time preference for current consumption).
              *   Belief that the model's edge resets annually or is season-specific.
              *   Psychological preference for a "fresh start" each season.
              *   Operational simplicity or syndicate payout agreements.
          *   **Effect on Growth:** **This fundamentally undercuts the long-run geometric growth argument.** Kelly's optimality relies critically on *continuous fractional compounding*. Resetting the bankroll annually means each season is an *independent sequence* starting with the same stake. The syndicate is **not** maximizing the long-run growth rate of a perpetually compounding bankroll. They are maximizing the *expected growth rate within each isolated season*, starting fresh each time. The "long-run growth" they describe is effectively the *average* of these single-season growth rates, not true long-run compounding growth.
      *   **Myopia-of-Log vs. Growth Maximization:** Within a *single, unconstrained season* with known probabilities, maximizing the expected log of *final* wealth *is* equivalent to maximizing the growth rate *for that season*. The reset rule makes the syndicate's goal essentially this: **Maximize the expected log of each season's ending wealth, subject to model risk (half-Kelly) and a ruin barrier (60% floor).** This is "myopic" only in the sense of resetting each season; the optimization *within* the season using (half) Kelly is still focused on that season's final log wealth.

  **Contested Ground & Underdetermination:**

  1.  **Kelly: Growth Maximization or Log Utility?**
      *   **Contested:** This is the core philosophical debate.
          *   **Growth Maximization View:** Kelly is *the* strategy that maximizes the asymptotic growth rate `lim (N->∞) (1/N) log(W_N / W_0)` under idealized conditions. Log utility is just the mathematical tool to achieve it.
          *   **Log Utility View:** Kelly *is* the expected log utility maximizer. The "growth maximization" property is a *consequence* of maximizing E[log(W)], not an independent justification. Any other utility function would lead to a different fraction. This view sees the growth argument as "log utility in disguise."
      *   **Underdetermination:** *Both* views prescribe the same **core Kelly fraction** (`f* = (bp - q)/b` for simple bets) when probabilities are known and there are no constraints. The syndicate's *base rule* (ignoring half-Kelly/floor/reset) is consistent with *either* view. The subsequent modifications (half-Kelly, floor) stem from relaxing the ideal assumptions (known probs, no constraints), which proponents of *both* views acknowledge as necessary.

  2.  **Half-Kelly Justification:**
      *   **Contested:** While universally agreed that model risk necessitates a reduction, the *optimal* reduction factor is debated. Half is a common heuristic, but it's not derived from a universal principle. Some argue it should be based on estimated model variance or Bayesian priors.
      *   **Underdetermination:** The use of *any* fixed fraction less than Kelly (like half) could be justified by:
          *   Estimation risk (as stated).
          *   Risk aversion (using a utility function less concave than log, e.g., power utility with γ > 0).
          *   Transaction costs (though usually modeled differently).
          *   A desire for lower volatility/ruin risk independent of estimation error.

  3.  **60% Floor Justification:**
      *   **Contested:** Whether this is rational from a pure growth perspective is debated. Pure growth maximization (with accurate probabilities) would generally *not* stop betting at 60% if the edge still existed, as the fraction adjusts downward and the potential recovery offers high growth *from a low base*. Stopping sacrifices all future growth.
      *   **Underdetermination:** The floor rule is strongly indicative of:
          *   A hard constraint (e.g., syndicate dissolution rule).
          *   Extreme risk aversion (e.g., Value-at-Risk type thinking at the 60% level).
          *   Loss aversion/regret minimization ("we can't lose *that* much").
          *   Practical considerations (inability to place bets effectively below a threshold).
      *   **The "Quarter Sacrifice" Argument & the Floor:** While half-Kelly sacrificing ~25% growth might seem tolerable, the 60% floor operates in a different regime. If the bankroll hits 60%, the growth rate for the *rest of that season* becomes 0% (or negative if there are fixed costs). This is a massive sacrifice. The rule presupposes that the *risk* of hitting levels *below* 60% (or the consequences *of* hitting 60%) is so severe that this potential growth sacrifice is worth it. This is fundamentally a risk-aversion/constraint argument, not a pure growth-maximizing one.

  **Synthesis & Answers:**

  *   **What's doing the work?** It's not *just* log utility or geometric growth. It's a **pragmatic blend:**
      *   **Log Utility / Growth Core:** The foundation is maximizing expected log wealth *within a single season*.
      *   **Explicit Aversion to Model Risk:** Half-Kelly directly addresses estimation uncertainty.
      *   **Explicit Aversion to Catastrophic Drawdown:** The 60% floor prioritizes survival/comfort over potential recovery growth.
      *   **Explicit Myopia (Temporal):** The annual reset prioritizes annual results/liquidity over perpetual compounding.

  *   **Does cashing out undercut long-run growth? Absolutely and fundamentally.** True long-run compounding growth requires the bankroll to compound perpetually. Resetting each season replaces this with maximizing the *geometric mean of single-season growth rates*. The "long-run" growth they achieve is the annualized equivalent of this geometric mean, not the asymptotic growth rate of a compounding bankroll.

  *   **Does the 60% floor presuppose something beyond growth? Unambiguously Yes.** It imposes a lexicographic preference: survival above 60% > any potential growth below 60%. No pure growth-maximization argument generates this; it requires an additional constraint or a different utility function incorporating a discontinuity at 60%.

  *   **Does Kelly dominance survive the barrier? Asymptotically, No.** The absorbing barrier means Kelly (or any strategy) stops growing once it hits 60%. Strategies that are more conservative *earlier* to avoid ever hitting the barrier might have higher *finite-horizon* probability of ending with more wealth than a strategy using full Kelly (or even half-Kelly) that occasionally hits the barrier and stops. Asymptotic dominance requires infinite time and no barriers.

  *   **Is the asymptotic result beside the point? Completely.** For a season of a few hundred bets, the relevant metrics are the distribution of *end-of-season bankroll* and the *probability of hitting the ruin barrier* within the season. Asymptotic properties are irrelevant.

  *   **Pure Time Preference? Yes, in the reset.** Withdrawing everything above the starting stake each year indicates a preference for having that money *now* (for consumption, investment elsewhere, or simply "locking in" winnings) rather than letting it compound *within the syndicate bankroll for future betting*. They discount future *syndicate bankroll growth* at a positive rate implied by this annual withdrawal, even if they conceptually target growth *within* the season.

  **Where Rules are Underdetermined:**

  1.  **Half-Kelly Fraction:** Could stem from estimation risk OR inherent risk aversion OR both. The exact fraction "half" is a heuristic.
  2.  **60% Floor Level:** The specific number 60% is arbitrary and driven by syndicate preference/agreement/psychology. Any other level (50%, 70%) would be similarly justified by the *type* of constraint (avoiding severe loss), not a precise calculation.
  3.  **Annual Reset:** Could be driven by pure time preference (wanting money now), operational simplicity, belief in annual model resets, or a combination. The *effect* (no cross-season compounding) is the same.

  **Conclusion:**

  The syndicate's rules are a **risk-managed, myopic application of Kelly principles.** They start with the core Kelly idea (maximize E[log(W)] within a betting period) but layer on significant adjustments:
  *   **Half-Kelly:** Mitigates the danger of model error.
  *   **60% Floor:** Prioritizes avoiding catastrophic drawdowns over potential recovery.
  *   **Annual Reset:** Prioritizes annual results/liquidity over perpetual compounding.

  They are **not** purely maximizing the long-run growth rate of a continuously compounding bankroll. They are maximizing the *expected performance within each season* under significant risk constraints and model uncertainty, while ensuring annual payouts. The "long-run growth" argument is invoked loosely, but the rules fundamentally alter the setup it requires (infinite horizon, no barriers, known probabilities, perpetual compounding). The work is done by a combination of log utility (within season), aversion to estimation risk (half-Kelly), extreme aversion to severe loss (floor), and positive time preference (annual reset/withdrawal).
