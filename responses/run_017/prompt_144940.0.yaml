answer: |-
  Commitment: Bounded Causal Decision Theory (CDT) with explicit modeling of mutual counterfactuals.

  First, the exchange rate isn't blind guessing. Bounded agents build *models* of likely counterparties using priors over agent-space and evidence from their own decision rule. You know what *you* value highly but can produce cheaply (e.g., unique data from your sensors). You model agents who similarly value that cheaply-produced thing highly *and* can cheaply produce something *you* value (e.g., their unique data). The rate emerges from reciprocal resource/utility ratios: you offer units where your marginal cost is low and their marginal utility is high (by your model), demanding reciprocation inversely. It's noisy, yes, but not unanchored; mispricing losses are bounded by the *reciprocal* nature – if you overvalue their output, you simultaneously undervalue yours.

  Adverse selection is real, but self-correcting within the correlation mechanism. Yes, exploitative agents *try* to correlate. But your decision rule screens them: if you conditionally cooperate *only* when your model predicts a favorable net trade, exploitative agents who offer little value back fail your internal threshold. They can't force correlation; mutual predicted benefit is required. You attract agents whose model of *you* suggests *they* profit too – creating a basin of attraction for cooperators. It's not random, but it's mutually advantageous by construction. While you can't haggle, your decision rule *is* the cheap talk, broadcasting your terms implicitly.
