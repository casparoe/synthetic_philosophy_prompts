answer: |-
  Based on your requirements and concerns, I've built a decision tree that categorizes views on disagreements like "that curry is too hot" or "she knew the deadline moved." The tree uses concrete, jargon-free questions to sort positions into 6 distinct leaves (with 6 branch questions). I'll first address your core concerns upfront, then present the tree, and finish with bookkeeping notes.

  ### Upfront Honesty: Key Concerns
  1. **"True for me but false for you" isn't one idea—it's two distinct views**:  
     - **Relativism** (leaf 5) treats the claim as *one shared proposition* whose truth varies by person (e.g., "This curry is too hot" is true relative to Alice but false relative to Bob).  
     - **Contextualism** (leaf 4) says the claim *shifts meaning* with the speaker (e.g., Alice means "too hot *for me*," Bob means "not too hot *for me*"—no real contradiction).  
     You’ve lumped these together, but they’re fundamentally different. Relativism preserves disagreement; contextualism dissolves it.

  2. **"Stricter in every way" doesn’t break the tree—it tests coherence**:  
     If Alice requires *more evidence/heat/risk than Bob on every dimension*, it doesn’t squash options but exposes weaknesses:  
     - In **relativism**, both are faultless, but it feels unintuitive (why can’t Alice just be "wrong" for being too strict?).  
     - In **objectivism**, Alice is simply wrong (if her standard is too strict) or Bob is (if too lax)—but this assumes an objective "goldilocks" standard.  
     - It *doesn’t* break contextualism or non-cognitivism.  
     I added a dedicated branch (Question 5A) for this case to force clarity.

  3. **Confidence flags on leaves**:  
     - **Strong confidence**: Contextualism (4), Relativism (5), and Non-cognitivism (1) are well-established.  
     - **Lower confidence**:  
       - *Error theory (3)*: Defended for morality (J.L. Mackie) but rare for taste/knowledge claims. May feel overly skeptical.  
       - *Group-based relativism (6)*: Applied in anthropology (e.g., cultural truth) but less common for individual judgments like spiciness.  
     - *No invented views*—all leaves map to real philosophical positions.

  ---

  ### Decision Tree
  **How to use**: Start at Question 1. Answer yes/no based on concrete cases (e.g., "that curry is too hot"). Follow the branches to a leaf. Each leaf has a 1-line "Awkwardness" note.

  1. **When someone says “that curry is too hot,” are they trying to state a fact?**  
     (e.g., Is this like reporting a discovery, not just venting feelings?)  
     - **No** → Leaf 1: **Non-cognitivism / Expressivism**  
       *Awkwardness:* Makes disagreements feel pointless—you’re just grunting at each other.  
     - **Yes** → Question 2.  

  2. **Could both people be “right” if they have different needs?**  
     (e.g., If Alice loves heat and Bob hates it, can the curry be “too hot” for Bob but “not too hot” for Alice?)  
     - **No** → Question 3.  
     - **Yes** → Question 4.  

  3. **Is there a single standard everyone *should* agree on?**  
     (e.g., Like how 100°C is boiling point—could we prove someone “wrong” with science/logic?)  
     - **Yes** → Leaf 2: **Objectivism / Absolutism**  
       *Awkwardness:* Ignores why reasonable people disagree (e.g., spice tolerance isn’t ignorance).  
     - **No** → Leaf 3: **Error Theory**  
       *Awkwardness:* Implies *all* such claims are nonsense (e.g., “too hot” is as fake as unicorns).  

  4. **Does the speaker’s meaning change with their perspective?**  
     (e.g., When Bob says “not too hot,” does he *mean* “not too hot *for me*”?)  
     - **Yes** → Leaf 4: **Contextualism**  
       *Awkwardness:* Turns heated fights into misunderstandings—you weren’t even talking about the same thing.  
     - **No** → Question 5.  

  5. **When two people disagree, are they judging the *same* claim?**  
     (e.g., Is “that curry is too hot” identical whether Alice or Bob says it?)  
     - **No** → *This path is incoherent* (see bookkeeping).  
     - **Yes** → Question 5A (your stricter-in-every-way case).  

  5A. **Could one person be stricter *everywhere*?**  
  (e.g., Alice always demands more proof for “knowledge,” more heat for “too hot,” or more risk for “too risky.”)  
  - **No** → Leaf 5: **Relativism (Faultless Disagreement)**  
    *Awkwardness:* Lets contradictions coexist (e.g., the curry *is* and *isn’t* too hot—true for Alice, false for Bob).  
  - **Yes** → Leaf 6: **Group-based Relativism**  
    *Awkwardness:* Forces arbitrary lines (e.g., why is “science” or “culture” the judge, not you?).  

  ---

  ### Bookkeeping
  **Unused branches**:  
  - The *"No" branch on Question 5* leads nowhere. Why? If speakers *aren’t* judging the same claim (e.g., Alice means “too hot for chefs,” Bob means “too hot for kids”), it collapses into contextualism (Question 4). No coherent view holds this.  

  **Combinations not held by anyone**:  
  - None. All answer paths lead to an occupied leaf.  

  **Leaves the tree can’t separate**:  
  - The tree distinguishes all 6 leaves. But note: **Error theory (3)** and **Objectivism (2)** both deliver “one right answer” (your first required leaf)—they’re split because error theory denies the *property exists* (e.g., “too hot” isn’t real), while objectivism says it *does* exist and is objective.  

  **How stricter-in-every-way is handled**:  
  - Question 5A isolates cases like Alice needing *more evidence on every dimension*. This:  
    1. Preserves **faultless disagreement** in relativism (leaf 5), but highlights its oddity (Alice’s strictness can’t be “wrong”).  
    2. **Doesn’t squash options**: Contextualism (4) and non-cognitivism (1) aren’t affected. Objectivism (2) or error theory (3) would say Alice is mistaken if her standard deviates from the “true” one.  

  ---

  This tree should help your group pinpoint where they stand. The stricter-in-every-was case tests whether faultless disagreement holds up under asymmetry—it doesn’t break the tree, but may break someone’s willingness to accept relativism! If you need tweaks (e.g., collapsing group-based relativism), let me know.
