prompt: |-
  I'm writing a paper for a graduate seminar on the metaphysics of reasons, and I have got stuck on the question my supervisor thinks is the only interesting one left: must a reason be someone's reason? The internalism/externalism dispute as we have been reading it assumes a reasoner is on the scene — the Williams-style internalist asks whether a consideration can be reached by sound deliberation from the agent's subjective motivational set, and the stance-independent externalist says a consideration can be a reason for you whether or not your desires connect up to it — but both camps take for granted that there is an agent there for the reason to belong to. What I want is a case that probes what happens when that assumption fails: a consideration that looks perfectly normative but whose putative bearer cannot ever take it up. My supervisor's suspicion is that once the reasoner drops out, the disagreement between the two standard camps quietly becomes verbal, and I do not yet know whether he is right — which is part of why I want the verdicts to fall out of the views plus the facts of the case rather than be written into it.

  So here is the commission. Build me a thought experiment, set somewhere realistic — a hospital ward, a care home, a special-needs school, a family — with no science fiction, no exotic technology, no invented metaphysics, and no medical or psychological condition more baroque than something a general practitioner would recognise. The case needs one specific candidate reason-bearer, a named human being B, who is not at any point in B's life in a position to take up some consideration C: B permanently lacks the capacity ever to register C as counting in favour of anything. I would rather you did not use mere death as the mechanism, since that just replays the familiar posthumous-reasons argument; pick something else, and make vivid what someone else could do about it. Then show that the case delivers these three verdicts, each generated by the view plus the facts rather than stipulated:

  - The free-floating, stance-independent externalist says: yes, there is a genuine and weighty reason for B — a reason B has, not merely a reason for other people concerning B — and B's incapacity is irrelevant to its existence, its content, and its weight.
  - The Williams-style internalist says: there is a reason in the neighbourhood, but it is not B's. It is a reason for a designated surrogate — a parent, nurse, sibling, trustee — generated by a sound deliberative route from that surrogate's actual motivational set. Set the route out premise by premise, each premise being something a realistic person in that role could actually have.
  - A third view I want tested, which you should call the uptake condition: a consideration is a reason for someone only if that person is, at some time during their life, capable of being addressed by it — capable of registering it as counting in favour and of being moved by it, with help and scaffolding if necessary, but with the capacity being theirs. On this view there is no reason for B at all; what remains is an evaluative fact with no reason-bearer, a genuinely free-floating rationale.

  Agreement in verdict is worthless if the views are only redescribing the same thing, so the case must carry a dial: some feature you can vary — whether anyone who cares about B is on the scene, whether B had a lucid interval earlier in life, whether B once cared about C and has since lost the capacity, whether acting on C costs the surrogate something — such that the reason-for-B and the surrogate's reason can differ in weight or come apart entirely. Say what each of the three views predicts at each setting of the dial. Then identify the single feature of the case doing the work, and show what happens when it is removed: in particular, that restoring addressability even for an hour collapses the three-way split back into the ordinary two-sided argument, and say which way each view then goes. Finally, give me an honest audit of the design — what the case is actually good for (I want to use it to ask whether B can be wronged, or acted for, in a reason-involving way, and whether acting for B's sake is ever literally true), how a defender of whichever view comes out worst would attack it, and, since my supervisor will certainly ask, whether you think this three-way disagreement is substantive or a clash over what the word *reason* is being used to pick out. Please keep the scenario itself under about 250 words, and write your answer in British English.
reasoning: |-
  Okay, the user is working on a graduate paper in metaphysics, specifically the metaphysics of reasons. They're stuck on whether a reason must be someone's reason, and their supervisor thinks this is the key question. The user wants to explore what happens when there's no agent capable of taking up a reason. They've asked for a thought experiment that fits specific criteria: realistic setting, no sci-fi, a named individual (B) who permanently can't register consideration C, and three distinct verdicts from different philosophical views.

  Hmm, the user needs a case study that can distinguish between three positions: externalism (reasons exist independently), Williams-style internalism (reasons depend on the agent's motivational set), and the uptake condition (reasons require capacity for recognition). The case must show how these views diverge when B lacks any capacity to engage with C, and include a variable feature that makes the reason-for-B and surrogate's reason come apart. 

  I'm considering a scenario involving advanced dementia - it's realistic, medically recognizable, and creates permanent incapacity without resorting to death. Arthur in a care home, completely non-verbal and disconnected, with C being the reason to play his favourite Brahms piece. This avoids sci-fi while meeting the "no lucid interval" requirement. 

  For the dial, I'll use the presence/absence of a surrogate. With no surrogate, externalism still attributes a reason to Arthur; internalism denies it but might find reasons for staff via duty; the uptake view sees no reason at all. When a surrogate exists (Arthur's daughter Imogen), internalism generates her reason via care-based motivation, while externalism maintains Arthur's independent reason. 

  The key feature is permanent non-addressability. If we tweak it to include one lucid hour where Arthur requests Brahms, all views converge on his reason existing during that period, though they may disagree about its persistence afterward. 

  I should note possible objections: externalists might argue the case presupposes their view by calling C "normative"; internalists could challenge whether staff duties count as reasons "for Arthur"; uptake theorists might question if "registering" requires conscious awareness. The case seems strongest for showing how B can be wronged (externalism) versus acted for (internalism via surrogate) when addressability is impossible. 

  The substantive disagreement appears to be about what constitutes "having" a reason - is it about objective standings (externalism), relational capacities (uptake), or practical bearings (internalism). The thought experiment successfully isolates this by removing the agent's perspective entirely.
answer: |-
  Here’s a thought experiment designed to your specifications, followed by analysis:

  **Scenario: Arthur’s Unheard Lullaby**  
  Arthur (B), 89, has advanced Lewy body dementia in a NHS care home. He is non-verbal, unresponsive to stimuli, and shows no recognition of people or objects. Medical consensus confirms this is irreversible; no lucid intervals remain. Years ago, his late wife mentioned Arthur once found Brahms’ Lullaby (Op. 49 No. 4) deeply soothing during panic attacks. A diary entry by her suggests he "felt it was a reason to breathe slowly". His daughter, Imogen (the potential surrogate), visits weekly. Consideration (C): *The fact that Brahms’ Lullaby might comfort Arthur*. Arthur permanently lacks any capacity to register music as counting in favour of calm or anything else. Staff could play the lullaby using available equipment. The "dial" is **whether Imogen exists/cares** (Surrogate Presence: ON/OFF).

  **Verdicts & Dial Settings**  

  | **Philosophical View**          | **Surrogate Presence: OFF** (No Imogen, no one invested)                                                                 | **Surrogate Presence: ON** (Imogen visits, cares deeply)                                                                 |
  | :------------------------------ | :----------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------- |
  | **Stance-Independent Externalism** | **YES, reason FOR ARTHUR.** C is a strong, objective reason for Arthur to experience comfort. Weight unchanged by his incapacity or lack of surrogates. | **YES, reason FOR ARTHUR.** Same as above. Arthur’s reason exists independently. Weight unchanged by Imogen’s presence. |
  | **Williams-Style Internalism**    | **NO reason FOR ARTHUR.** No sound deliberative route from Arthur’s S. **Reason for STAFF?** Possibly weak reason via duty of care ("I am motivated to provide comfort where possible" + "This might comfort" → "Play it?"). But contingent on staff motivation. | **NO reason FOR ARTHUR. YES, reason FOR IMOGEN:**<br>1. *Imogen is motivated by love for her father.* (Actual S element)<br>2. *Playing Brahms might comfort Arthur.* (True belief)<br>3. *Comforting him aligns with her love.* (Deliberative link)<br>4. *Therefore, Imogen has a strong reason to play the lullaby.* Weight depends on her motivation strength. |
  | **Uptake Condition**             | **NO reason FOR ANYONE (re: Arthur).** Arthur cannot *ever* register C as counting for him. No surrogate = no one for whom C is a reason. Staff duties concern well-being, not C *as Arthur's reason*. | **NO reason FOR ARTHUR.** His incapacity remains. **NO reason FOR IMOGEN *generated by C/Arthur*.** Imogen’s reason stems from HER motivations/love, not C being *Arthur’s* reason (which doesn’t exist). C is merely a factual prompt for *her* reason. |

  **The Key Feature & Its Removal**  
  *   **Key Feature Doing the Work:** **Permanent Non-Addressability** – Arthur’s *utter, irreversible incapacity to ever register C as normatively relevant*.
  *   **Restoring Addressability (Lucid Hour):** Suppose Arthur had one lucid hour yesterday, clearly requesting Brahms for comfort. Now:
      *   **Externalism:** Still a strong reason for Arthur (now demonstrably).
      *   **Internalism:** *Potentially* a reason for Arthur *if* a desire for comfort/soothing music remains in his S *and* deliberation links C to it. Likely YES. Also a reason for Imogen/staff.
      *   **Uptake:** **YES, reason FOR ARTHUR.** He *was* capable (in the lucid hour) of registering C as counting for him. The reason existed *for him* during that time.
      *   **Collapse:** Dispute reverts to classic internalism/externalism about whether Arthur *retains* that reason *now* (post-lucidity), and the status of reasons based on past but now inaccessible/inactive motivations. Uptake view accepts a reason existed.

  **Audit**  
  *   **Purpose Served:** This case effectively probes:<br>
      - **Wronging B:** Externalism suggests Arthur *can* be wronged (e.g., if staff wilfully withhold C). Internalism/Uptake suggest only Imogen/staff can be wronged (by frustrating *their* reasons).<br>
      - **Acting for B’s Sake:** Only Externalism supports "*literally* playing Brahms *for Arthur’s sake*" (responding to *his* reason). Internalism supports "acting for Imogen’s sake (to fulfil her reason concerning Arthur)". Uptake denies "for Arthur’s sake" has literal reason-based content.<br>
      - **Reasons without Agents:** Tests if normativity requires a capable subject.
  *   **Likely Attacks:**<br>
      - **Externalist Attack (vs Uptake):** "You conflate *having* a reason with *using* it. Arthur *has* the reason (it’s a fact about his well-being); his incapacity prevents use, not existence."<br>
      - **Internalist Attack (vs Externalism):** "Your ‘reason for Arthur’ is inert, practically irrelevant. It’s just an evaluative fact mislabeled as a *reason*. Only reasons anchored to motivation guide action."<br>
      - **Uptake Attack (vs Internalist Surrogate):** "Calling it a reason *for the surrogate* is fine, but smuggling in ‘for B’ via backdoor normativity is equivocation. The surrogate’s reason concerns B’s welfare, it’s not B’s *own* reason."
  *   **Substantive or Verbal?** This reveals a **substantive** disagreement about the **nature of normativity**:<br>
      - *Externalism* sees reasons as objective, agent-relative *standings* (like claims).<br>
      - *Internalism* sees reasons as essentially *practical*, tied to motivation-potential.<br>
      - *Uptake* sees reasons as inherently *relational*, requiring a capacity for recognition in the bearer.<br>The case shows these lead to genuinely different truth-conditions for "B has a reason" and different implications for agency, wronging, and action. It’s not merely about the *word* "reason," but what kind of normative entity it picks out. Your supervisor’s suspicion is partially confirmed – *without B’s capacity*, Internalism and Uptake converge on denying a reason *for B* (though diverge on surrogates), making their dispute with Externalism stark. The surrogate dial shows Internalism and Uptake also diverge significantly.
