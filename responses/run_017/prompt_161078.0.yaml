prompt: |-
  Hey — pretend you're a political philosopher who also does game-theoretic work on social norms: precise about mechanisms, not precious about jargon. Please think it through properly and brainstorm three or four candidate principles before you settle on one; I want to see the ones you reject and why.

  My partner and I keep arguing about how much rule-following a society should demand — the whole tight vs. loose cultures thing — and going case by case I've definately got strong gut verdicts that I can't get into one shape.

  Jaywalking at 2am on a dead-empty street: tolerate it, don't even tut at it. Queue-jumping at a packed bus stop: sanction it, hard. Not tipping: shouldn't be expected at all, and I resent that it is. Loud music after 11pm in a block of flats: enforce. Restaurant kitchen staff skipping handwashing: enforce to the hilt, even though literally no customer sees it. Indoor masking during a respiratory surge: enforce, but exempt small kids. Dress code for back-end engineers who never meet a client: don't enforce; for staff on the shop floor: enforce mildly. Doing 10 over on an empty motorway: tolerate. Missing or sloppy citation in a student essay, where nobody is harmed and nothing is really stolen: still punish, and I feel weirdly strongly about this. Dog off-leash in a crowded park: enforce. Bins out on the wrong day, lawn too long: don't enforce, and I actively dislike the kind of person who does.

  The pair I can't reconcile is the speeding one and the citation one — both are harmless-in-the-instance, visible, low-stakes violations, and I want them treated completely differently — plus I want the invisible handwashing rule enforced most strictly of all, which seems to wreck any "enforce what you can see" idea.

  My tentative principle: a norm should be tight just in case violations impose costs on people who didn't choose the interaction and can't cheaply avoid it, and the costs are big enough to matter; otherwise loose. That gets part of the list and dies on the rest.

  What I want back: (a) that principle tested case by case and then repaired or replaced — state the version you'd actually defend precisely, and say which of my cases motivates each clause; (b) its verdicts on three cases I haven't listed: mandatory cameras-on for internal remote meetings, households required to clear snow off the pavement in front of their house, and using your phone in a hospital waiting room; (c) an honest list of which of my verdicts your principle can't save, and which one you'd overturn.

  Two half-baked ideas of mine I want you to either build in or kill: (1) "bystander legibility" — a rule can be tight only if the people expected to do the enforcing can tell violation from compliance without an investigation or a hunch, because otherwise enforcement turns into suspicion and harassment (but then the handwashing case needs handling: maybe legibility constrains informal neighbour-to-neighbour enforcement and not institutional enforcement?); (2) "sorting drift" — the longer a rule survives past the conditions that made it useful, the more its enforcement selects for loyalty and display rather than compliance, so old rules should default to loose unless someone re-justifies them.

  Be concrete, skip the literature and any citations, and don't just lay out both sides — give me the principle you'd defend.
reasoning: |-
  Okay, the user is a political philosopher with an interest in game theory and social norms. They're wrestling with how much rule-following a society should demand, using specific examples from their life. They've noticed inconsistencies in their gut reactions—like tolerating speeding but punishing sloppy citations—and want a principle to reconcile these. Their initial idea involves costs to non-consenting parties who can't avoid the harm, but it fails with cases like handwashing or citations.

  First, I need to unpack their examples. Jaywalking at 2am is harmless, so tolerance makes sense. Queue-jumping imposes direct costs on others, so sanctioning is logical. Tipping isn't enforceable because it's a transfer, not a harm. Loud music disrupts neighbors who can't easily avoid it. Handwashing is critical for public health, even if unseen. Masking during a surge protects vulnerable people. Dress codes depend on role visibility—back-end engineers don't need it, but shop staff might for professionalism. Speeding on an empty road seems harmless per instance, but they tolerate it. Citations must be enforced for integrity, even if no immediate harm. Off-leash dogs risk safety, while bin days and lawn lengths are trivial preferences.

  The user's sticking points are speeding vs. citations. Both seem harmless in isolation, but they want different treatments. Plus, handwashing enforcement contradicts "enforce what you see." Their tentative principle focuses on non-consensual costs that are non-trivial and unavoidable. But it fails with citations (no direct harm) and handwashing (unseen).

  They also propose "bystander legibility"—enforcement only when violations are easily visible—to prevent harassment. But handwashing isn't visible, so that needs institutional handling. Then there's "sorting drift"—old rules become about loyalty, so they should loosen unless re-justified. This could address outdated norms.

  I need to build a principle that incorporates harm, avoidability, and institutional roles. Maybe split enforcement into two tracks: informal for visible, low-cost harms, and institutional for systemic risks. Citations matter for systemic integrity, even if no immediate harm. Handwashing requires institutional oversight because it's invisible but high-risk. Sorting drift suggests periodic reviews to prevent norms from becoming loyalty tests.

  Testing their new cases: Cameras-on in meetings—low harm, avoidable (maybe optional), so shouldn't enforce. Snow clearance—prevents public harm, unavoidable for pedestrians, so enforce. Phones in hospitals—mixed; silent use might be ok, but loud talk disrupts, so context-dependent.

  Their verdicts like not tipping or lawn length enforcement align with the harm principle. But citations and handwashing need the systemic integrity clause. Speeding on empty roads is tolerated because the harm is probabilistic and avoidable (others can stay off the road). 

  Final principle: Norms should be tight based on (1) expected harm to non-consenting parties who can't avoid it, (2) systemic integrity necessity, (3) legibility for informal enforcement, and (4) institutional capacity for invisible harms. Rejected ideas: "enforce what you see" fails for handwashing; pure cost-benefit ignores systemic needs like citations. 

  Overturning their view: Maybe speeding should have probabilistic harm considered, but they tolerate it, so the principle allows that if harm is negligible. Citations are upheld due to systemic reasons.
answer: |-
  Here's a principled framework built from your cases, tested against your dilemmas, with rejected alternatives explained. The core tension (speeding vs. citations vs. handwashing) forces us to distinguish between **direct harm** and **systemic integrity**, and between **enforcement mechanisms**.

  ### Final Principle: The Institutional Harm-Avoidance & Legibility Threshold
  **A norm should be tight (formally or informally enforced) if and only if:**
  1.  **Unavoidable Harm:** Violations impose *non-trivial, reasonably expected costs* on non-consenting parties who *cannot cheaply avoid* the interaction.
  2.  **Systemic Risk (OR):** Violations, even if harmless *in a specific instance*, create *systemic risk* by undermining a rule essential for preventing widespread harm or maintaining critical trust (applies primarily to institutional enforcement).
  3.  **Legible Enforcement:** The violation or compliance must be *practically legible* to the relevant enforcers *without intrusive investigation* (legibility standards adjust for institutional vs. informal enforcement).
  4.  **Proportionality:** Enforcement must be proportional to the expected harm/risk.

  **Rejected Candidate Principles & Why They Failed:**
  1.  **Pure Direct Harm Avoidance (Your Tentative Principle):** "Enforce if violations impose costs on non-consenting parties who can't cheaply avoid it." *Rejected:* Dies on citations (no direct harm per instance) and handwashing (costs avoidable? customers *could* avoid restaurant... but systemically catastrophic). Also doesn't explain why *some* avoidable harms (loud music) are enforced while others (lawn length) aren't (severity/avoidability cost matters).
  2.  **Enforce What's Visible:** "Tightness requires bystander legibility for enforcement." *Rejected:* Directly contradicts handwashing enforcement (invisible violation, critical harm). Legibility matters, but isn't *sufficient* (bins on wrong day are legible but harmless) and isn't *always necessary* for institutional enforcement.
  3.  **Utilitarian Cost-Benefit:** "Enforce if the net social benefit of enforcement exceeds the cost." *Rejected:* Too vague, justifies almost anything (e.g., "enforcing lawn length preserves property values!"), fails to capture your strong aversion to enforcing preferences (bins, lawn) or resentment of tipping (feels coercive, not net beneficial). Doesn't explain the *qualitative* difference between citations and speeding.
  4.  **Consent/Choice Focus:** "Enforce only where choices force costs onto others." *Rejected:* Gets queue-jumping, loud music, speeding (on busy road), dog leash. Fails tipping (customer "chooses" restaurant but norm feels coercive), handwashing (customer "chooses" restaurant – harm seems avoidable), and especially citations (no one is "forced" to bear a cost by one sloppy citation).

  **How the Final Principle Handles Your Cases:**
  *   **Jaywalking (2am, empty):** *Loose*. No expected harm, harm easily avoidable (no one else there). *(Meets 1 = No)*
  *   **Queue-jumping (packed):** *Tight (informal)*. Direct harm (time/cost) imposed on non-consenting others who can't avoid it. Legible. *(1, 3)*
  *   **Not Tipping:** *Loose (shouldn't be expected)*. Transfer payment, not unavoidable harm. Avoidable (choose different establishments/don't go out). *(1 = No)*
  *   **Loud Music (11pm+):** *Tight (enforce)*. Direct harm (loss of quiet/sleep) on non-consenting neighbors who can't cheaply avoid it (can't move walls). Legible. *(1, 3)*
  *   **Handwashing (kitchen):** ***Tight (institutional enforcement)***. *Systemic Risk:* Critical for preventing widespread, severe harm (food poisoning outbreaks). Harm is often *not* avoidable for customers (can't know who skipped). Requires institutional checks (legibility solved by inspectors/management). *(2, 3 adapted to institution)*
  *   **Indoor Masking (surge):** *Tight (enforce)*. Direct harm reduction (viral transmission) to non-consenting others in unavoidable shared space. Legible. Exempt kids (proportionality/avoidability). *(1, 4)*
  *   **Dress Code (back-end):** *Loose*. No unavoidable harm, no systemic risk. Preference/environmental norm. *(1,2 = No)*
  *   **Dress Code (shop floor):** *Mildly Tight*. Avoids minor harm (customer discomfort/distraction/eroding brand trust) in unavoidable interaction. Legible. Proportionality demands mildness. *(1, 3, 4)*
  *   **Speeding (10 over, empty):** *Loose (tolerate)*. No *expected* harm to others (empty road), harm is avoidable (no one else present). Systemic risk exists *probabilistically* but is low per instance and legibility/enforcement costs are high. *(1 = Low/avoidable, 2 = Low per instance, 3 = Legible but enforcement cost high)*
  *   **Sloppy Citation:** ***Tight (punish)***. *Systemic Risk:* Undermines core academic integrity/norms essential for trust in scholarship and fair evaluation. Harmless *per instance* but systemically corrosive. Legible to instructor. *(2, 3)*
  *   **Dog Off-Leash (crowded):** *Tight (enforce)*. Direct harm risk (bites, knocks over kids, fear) to non-consenting others in unavoidable shared space. Legible. *(1, 3)*
  *   **Bins Wrong Day/Lawn Long:** *Loose*. Trivial or aesthetic "harm" (preference). Easily avoidable (look away). No systemic risk. Enforcing selects for busybodies. *(1 = No non-trivial harm)*

  **Your Dilemmas Resolved:**
  *   **Speeding (tolerate) vs. Citation (punish):** Speeding on empty road has low *expected/per-instance* harm and is avoidable (Condition 1 weak). Citation violates **Systemic Risk** (Condition 2) - scholarship collapses if citations aren't enforced, even "harmless" ones normalize cheating. Speeding's systemic risk is managed probabilistically (enforcement on busy roads, speed limits *generally*).
  *   **Handwashing (enforce) vs. "Enforce What You See":** Handwashing is **Systemic Risk** (Condition 2), demanding *institutional enforcement* which bypasses the need for bystander legibility. Condition 3 adjusts: legibility is required *for the enforcing agent* (health inspector, manager), not random bystanders.

  **Half-Baked Ideas Incorporated:**
  1.  **Bystander Legibility:** Directly built into **Condition 3**. Crucial for *informal* enforcement (queue-jumping, loud music) to prevent harassment. Explicitly *not* required for institutional enforcement of systemic risks (handwashing, citations), where specialized agents handle detection.
  2.  **Sorting Drift:** Implicit in **Condition 2 (Systemic Risk)** and **Proportionality (Condition 4)**. A rule surviving past its usefulness fails Condition 2 (no systemic risk remains). Enforcement becoming about loyalty/display signals the rule may lack current justification for tightness (e.g., overly strict dress codes, archaic property aesthetics). The principle demands re-justification.

  **New Case Verdicts:**
  1.  **Mandatory Cameras-On (Internal Remote):** *Loose (Shouldn't enforce)*.
      *   *Why:* No unavoidable harm (mute/turn off if distracting). "Engagement monitoring" is preference/suspicion, not harm prevention. Low systemic risk (collaboration has other metrics). Enforcing lacks legible harm, risks becoming loyalty test (Sorting Drift). *(Fails 1 & 2)*
  2.  **Households Clear Snow (Pavement):** *Tight (Enforce)*.
      *   *Why:* Prevents direct, severe harm (slips/falls) to non-consenting pedestrians who *cannot* avoid walking on public pavement. Legible violation. Proportional (fine, shaming). *(1, 3)*
  3.  **Using Phone (Hospital Waiting Room):** *Contextual*.
      *   *Talking Loudly:* Tight (enforce - quiet zone). Direct harm (distress, disruption) in unavoidable space for vulnerable people. Legible. *(1, 3)*
      *   *Silent Use (texting/browsing):* Loose (tolerate). No unavoidable harm. Avoidable (look away). *(Fails 1)*

  **Where Your Verdicts and My Principle Diverge:**
  *   **Overturn:** Your principle *might* tolerate **sloppy citations** (no direct harm/avoidable? "don't read it"). My principle **enforces** it due to **Systemic Risk (Condition 2)**. This is the core overturn – demanding enforcement for integrity even without immediate harm.
  *   **Saves:** The principle saves your verdicts on jaywalking, queue-jumping, not tipping, loud music, handwashing, masking, dress codes, dog leash, bins/lawn. It explains speeding tolerance and citation enforcement without contradiction.
  *   **Clarifies:** "Enforce mildly" for shop-floor dress code is handled by **Proportionality (Condition 4)** – harm is minor, so enforcement should be mild.

  **Defensible Version:**
  "A social norm merits tight enforcement (formal or informal) only if violations typically cause non-trivial, unavoidable harm to non-consenting parties **OR** create systemic risk by eroding essential safeguards against widespread harm or critical trust. Enforcement mechanisms must be practically legible to the relevant agents without undue intrusion, and the severity of enforcement must be proportionate to the harm or risk mitigated. Institutional enforcement is justified for systemic risks even where bystander legibility is absent."

  This prioritizes harm prevention and systemic integrity, respects liberty by focusing on non-consensual/unavoidable costs, prevents harassment via the legibility constraint, allows institutional solutions for invisible risks, and avoids enforcing mere preferences or outdated rules lacking current justification. It directly resolves your speeding/citation/handwashing trilemma.
