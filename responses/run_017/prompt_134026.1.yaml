prompt: |-
  I'm in this very loose reading group — me, a physics PhD who is skeptical about everything, and a philosophy grad student — and last week we got completely stuck on a section from Hofstadter (I think it's in one of his essay collections, maybe Metamagical Themas, the bit about the careenium and the simmballs), and before we argue about the anwser I want to get clear on what we're even asking. The setup as I took it: you've got this weird material made of "simmballs" — symbol-balls — and whatever happens in it can be described either at the level of individual balls shoving each other around, or at the level of the symbols and what they mean, and the question is who shoves whom. If a lump of careenium is running something that amounts to a decision, does the symbol-level story (that it decided X, that it believed Y, that a certain pattern meant Z) do any of the real causal work, or is it substrate all the way down and the symbol talk just a convenient gloss? Our physicist says gloss, end of story; I'm not so sure.

  So instead of settling it, write me the spec: what would a theory of symbol-level versus substrate-level causation have to deliver to count as adequate? I want the desiderata with the case or consideration behind each one, and I want you to mark which are non-negotiable and which are just one camp's prejudices. Some things I think belong on the list, but you tell me which are genuine requirements: it has to handle the mundane cases (a thermostat's set point, a chess program playing as if there were a threat on the board, an ant colony's trail, a virus's "fitness"); it has to say something about misrepresentation, where a symbol-level state that's about something that isn't actually the case seems to cause behavior anyway; it has to respect whatever physics really forces on us (causal closure — every physical event has a sufficient physical story in its physical past); it has to keep mere bookkeeping apart from real leverage (my own labels: "shadow relevance", where the symbol fact is entailed by the substrate story and tracks it but changes nothing, versus "leverage", where the symbol-level description constrains what the substrate does next); and it has to have a view about a case I made up — the fine-grained swap, where you take one lump running a prime-number routine and rewire it a few simmballs at a time into a lump running a weather simulation, so the symbol-level description is crisp at both ends and mushy in the middle. Does causation fade out gradually there, and what would that even mean?

  Then the part I actually care about: flag any pair of desiderata you suspect can't be jointly satisfied, because if the list itself is inconsistent that's a result and I'd rather know now. My guess is that "respect the causal closure of the physical" and "let symbol-level facts do explanatory work that couldn't in principle be done at the substrate level" are quietly at war, but maybe there's a reading that saves both. Also tell me which single requirement excludes the most candidates, and whether anything on my list is really a preference dressed up as a constraint. Then a very short scorecard, two lines each at most, for: straight reductionism or identity, functionalism with substrate-independence, non-reductive physicalism with downward causation, and eliminativism about the symbol level. Please write it in American English, and no reading lists, citations or bibliographies — we're doing this from one dogeared paperback with no library access, so anything that needs looking up is useless to us.
reasoning: |-
  Okay, let me unpack this user's query. They're in a reading group with a physics PhD skeptic and a philosophy grad student, stuck on Hofstadter's simmballs and careenium. The core question is about symbol-level vs. substrate-level causation. The user wants a clear set of desiderata for a theory that resolves this, with cases to back each point, and flags for conflicts.

  First, I need to identify the non-negotiables. Causal closure of physics seems absolute—no spooky influences. Then there's leverage: symbols must add real causal power, not just track substrate. Other key points include handling mundane cases (thermostats, chess programs), misrepresentation (false beliefs causing action), and the fine-grained swap where systems morph gradually between programs.

  The user suspects tension between causal closure and symbol-level explanatory power. I agree—if physics is causally closed, how do symbols have independent leverage? That's the crux. Also, their fine-grained swap challenges whether causation fades gradually, which might break if we see causation as binary.

  For desiderata, I'll list must-haves vs. preferences. Mundane cases and misrepresentation are essential for any theory. Shadow relevance vs. leverage is crucial to avoid epiphenomenalism. The fine-grained swap is a strong test case but might be preference-based if a theory handles it poorly.

  Scoring existing positions: Reductionism fails leverage; functionalism might handle substrate independence but struggles with causal closure; non-reductive physicalism risks violating closure; eliminativism dismisses symbols entirely. The user likely wants a path that preserves both physics and meaningful symbols, so functionalism or non-reductive might be contenders, but tensions remain.

  Highlighting conflicts: Causal closure + leverage seems incompatible without redefining causation. The swap case might force a choice—does causation depend on crisp symbols? If so, mushy middle breaks it; if not, symbols aren't special. 

  The user's deep need is clarity on whether symbols are causally potent without magic. They want ammunition for their debate, so pointing out unresolvable tensions (like closure vs. leverage) is key. Also, noting which theories fail which desiderata helps them navigate the argument.
answer: |-
  Here's a spec for a theory of symbol-level vs. substrate-level causation, built for your reading group cage match:

  **Core Desiderata (Non-Negotiable):**

  1.  **Causal Closure of the Physical (CCP):** *Requirement:* Every physical event has a sufficient physical cause within the physical substrate. *Case:* Physics PhD's bedrock demand. No spooky "symbol juice" violating physics. Violating this isn't physicalism. *Status:* **Non-negotiable anchor.** Any theory denying this is non-starter for the physicist.

  2.  **No Causal Drainage:** *Requirement:* Symbol-level descriptions cannot *replace* substrate-level causation; the substrate must remain causally competent. *Case:* The substrate balls *are* shoving each other. The symbol story can't make the balls irrelevant. *Status:* **Non-negotiable corollary of CCP.** Symbol talk can't drain causation from the substrate.

  3.  **Leverage (Not Just Shadow):** *Requirement:* Symbol-level descriptions must sometimes capture *causal patterns* or *counterfactual dependencies* that are essential for explaining/predicting system behavior *in a way the substrate description alone cannot efficiently or meaningfully capture*, and these patterns must play a *constraining role*. *Case:* Explaining why the thermostat turned on the furnace *because the room temperature was 64°F and the set point is 68°F* is indispensable and tracks how changes in *meaning* (changing the set point) would change behavior. It's not just tracking substrate motion (shadow) – it tells you what *about* the substrate matters for the outcome. *Status:* **Non-negotiable for the symbol-level realist.** Without leverage, symbols are epiphenomenal gloss.

  4.  **Misrepresentation Handling:** *Requirement:* The theory must explain how a system can behave *as if* a symbol referred to something true/real, even when it doesn't, and how this "aboutness" drives behavior. *Case:* The chess program sacrifices a rook *because it mistakenly "believes"* it can force checkmate in three moves (a misrepresentation of the board state). The false symbol state causally drives the sacrifice. *Status:* **Crucial Test.** Shows symbol-level causation isn't just tracking physical state, it's about *interpreted content*.

  **Important Test Cases (Strong Constraints):**

  5.  **Mundane Cases:** *Requirement:* The theory must handle simple, uncontroversial cases of apparent symbol-like causation cleanly. *Cases:* Thermostat set point, chess program board evaluation, ant pheromone trail as "signal," virus genome encoding "instructions" for replication. *Status:* **Baseline competence.** Failing here means the theory is irrelevant.

  6.  **Fine-Grained Swap Challenge:** *Requirement:* The theory must have a coherent account of what happens to symbol-level causation during the gradual rewiring from Program A (Primes) to Program B (Weather). *Case:* Does causation fade? Does it jump discontinuously? Is there a point where it *stops* being "about" primes and *starts* being "about" weather, or is it mushy? *Status:* **Stress Test for Robustness.** Probing the reality and granularity of symbol-level causation. *User's "mushy middle" is key.*

  **Potential Tensions & Conflicts:**

  *   **The Big Tension:** **CCP/Leverage:** You nailed it. This is the core battlefield. CCP says the substrate story is *sufficient*. Leverage says the symbol story is *essential* for certain explanations/predictions. Reconciling them requires showing how the symbol-level pattern *is* a real feature *of* the physical implementation that constrains future states *in virtue of its pattern/meaning*, not *despite* the physics. It's about *which aspects* of the substrate matter and *why*.
  *   **Leverage/Fine-Grained Swap:** If symbol-level causation requires crisp, stable patterns (like a running program), then causation *must* fade or break in the mushy middle of the swap. If causation is robust to mushiness, does "leverage" become too vague? This challenges the reality/autonomy of the symbol level.
  *   **Misrepresentation/Substrate Specificity:** How can a *specific* physical substrate configuration "mean" something false? The substrate is just *what it is* physically. Explaining misrepresentation inherently requires the symbol level.

  **The Gatekeeper Requirement:** **Leverage (Requirement #3)** is the hardest to satisfy without violating CCP/No Drainage. It demands that symbols *do real causal work* while being *nothing over and above* the causally closed physics. Most theories stumble here.

  **Preference vs. Constraint?** The **Fine-Grained Swap** case is a powerful *test*, but whether a theory *must* deliver a *specific* answer (e.g., gradual fade vs. sharp cutoff) might lean towards being a preference (for elegance, continuity, discreteness) depending on the core theory. How it *handles* the case is crucial; demanding a *particular* outcome might be prejudicial.

  **Short Scorecard:**

  1.  **Straight Reductionism/Identity:** Symbols *are* the substrate pattern. Leverage is just efficient description (Shadow Relevance). Fails **Leverage** and **Misrepresentation** (false states are just different physical states). *Verdict:* Physicist might like it, but misses the point of symbols.
  2.  **Functionalism (Substrate-Independent):** Symbol causation is defined by functional role, not substrate. **Leverage** and **Mundane Cases** handled well. **Misrepresentation** possible. Struggles with **CCP** (how do functional roles *constrain* physics?) and **Fine-Grained Swap** (what's the function in the mush?).
  3.  **Non-Reductive Physicalism (Downward Causation):** Symbols emerge and causally influence substrate. Explicitly violates **CCP/No Drainage**. Gets **Leverage** but at high cost. **Fine-Grained Swap** becomes messy (does downward causation fade?). *Verdict:* Philosophically costly for physicist.
  4.  **Eliminativism:** Symbol talk is useless/incorrect folk psychology. Only substrate matters. Trivially satisfies **CCP/No Drainage**, but fails **Leverage**, **Misrepresentation**, and **Mundane Cases** (denies the very phenomenon). *Verdict:* Throws the baby out with the bathwater.

  **The Real Sticking Point:** Reconciling **CCP** with genuine **Leverage** is the Everest. Hofstadter's simmballs are designed to make this vivid: the "shoving" is substrate, the "meaning" is pattern, but the "who shoves whom?" asks if the *pattern's meaning* is doing any *shoving*. Good luck with the argument!
