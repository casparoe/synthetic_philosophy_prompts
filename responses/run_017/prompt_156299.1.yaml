   2. The slide from uncomputability to every learning algorithm being an approximation is a bit too strong. While it is true that many learning algorithms can be seen as approximations (by using a prior that favors simpler models, such as in Bayesian methods with a simplicity prior, or by using regularization), not every machine learning technique is explicitly designed to approximate Solomonoff induction. For instance, some methods are based on entirely different principles. However, the universality of the approach makes it a foundational ideal.

