answer: |-
  ### Final Exam Question: Moral Philosophy 402  
  **Time Allowed: 60 minutes**  
  **Total Marks: 25**  

  ---

  #### Case Description  
  Twelve towns share a regional power grid. For twelve weeks each summer, the operator must reduce load. Two policies are available:  
  - **Rota Policy**: One town loses power for a full week (announced in advance). Towns take turns, so each is disconnected once per summer. With planning (e.g., hiring generators, rescheduling maintenance), the burden per town is **5 units** for its single week.  
  - **Dimming Policy**: Every town loses one unannounced hour of power daily. This cannot be planned around; restart costs and spoilage accumulate to **12 units per town** (1 unit/week) over the summer.  

  *At the weekly grain*, Rota burdens one town with 5 units and spares the other eleven; Dimming burdens each of twelve towns with 1 unit. *At the summer grain*, Rota burdens each town with 5 units; Dimming burdens each with 12 units.  

  ---

  #### Part (a) (12 marks)  
  1. Could contractualism, *without summing burdens across persons*, endorse Rota over Dimming when comparing burdens at the *summer grain*? Explain why or why not.  
  2. Suppose a candidate principle states: *"At each occasion of choice, minimize the largest individual complaint."*  
     - Would this principle reject Rota? Justify your answer.  
     - What common social practices (e.g., rotas, burden-sharing schemes) would this principle forbid?  
  3. Does this case present an *aggregation problem* for contractualism? Defend your view.  

  #### Part (b) (13 marks)  
  Consider a *one-week* version: No future turns exist. The choice is:  
  - Rota: 5 units burden for one town.  
  - Dimming: 1 unit for each of twelve towns.  
  Assume towns have deep mutual concern: Each town genuinely experiences **0.5 units of distress** *because* one sister town sits in darkness, and this distress scales with the number of affected towns.  
  1. Could contractualism permit including this "sympathy burden" in an individual’s total complaint?  
  2. Would this allow numbers to matter *without summing complaints across persons*?  
  3. Is this move legitimate under contractualism’s individualist restriction, or is it covert aggregation? Defend your position by appealing to the *purpose* of the restriction.  

  **Instructions**:  
  - Do *not* restate contractualism’s framework. Engage the case directly.  
  - Take a clear stance in Part (b). Hedging without justification will cost marks.  

  ---

  ### Model Answer (650 words)  

  #### Part (a)  
  Contractualism can endorse Rota at the *summer grain* without aggregating across persons. At this grain, each town’s total burden is assessed *intra-personally*: Rota imposes **5 units** per town vs. Dimming’s **12**. Since no inter-personal summing occurs—each compares their own summer totals—the individualist restriction permits preferring Rota. The worst-off under Rota (5 units) fares better than all under Dimming (12 units each), making Rota reasonably acceptable.  

  The fine-grained principle (*minimize the largest complaint at each choice*) would reject Rota. *Weekly*, Rota creates a 5-unit burden for one town, while Dimming’s worst complaint is 1 unit. If we apply this principle rigidly per decision-point, Dimming wins weekly. This principle forbids *any* turn-taking scheme concentrating burdens temporarily (e.g., jury duty, rotating outages) because it always creates a "largest complaint" at a given time. Such institutions rely on *cross-temporal* fairness, which this principle ignores.  

  This is not a *new* aggregation problem but reveals how *grain choice* pre-structures complaints. Contractualism must fix the temporal scope of principles (e.g., "per outage event" vs. "per summer policy"). Without this, identical burdens generate opposing verdicts. The aggregation worry resurfaces as a *framing problem*: Fine-grained framing makes Rota’s local inequality salient; coarse-grained framing shows its efficiency.  

  #### Part (b)  
  Including sympathy burdens *is* permissible and distinct from aggregation. Each town’s complaint under Rota includes:  
  - Direct burden (if disconnected): **5 units**  
  - Sympathy burden: **5.5 units** (0.5 units × 11 towns suffering distress *for them*)  
  Thus, the disconnected town complains of **10.5 units**, while others complain of **5.5 units** each. Under Dimming, each town’s complaint is **1 unit** (direct) + **0.55 units** (0.5 units × 1.1 towns affected on average? *Adjust: Scaled to actual disconnections*) ≈ **1.55 units**.  
  *Crucially*, each complaint is *self-contained*: Town A’s sympathy-induced distress is part of *A’s own* experience. Numbers matter because the *content* of each complaint depends on others’ fates (e.g., "I suffer more when *more* neighbors are harmed"), but no interpersonal summing occurs.  

  This avoids aggregation because contractualism compares *individual total complaints*, not summed utilities. Town A’s 10.5-unit complaint under Rota is weighed against others’ 5.5-unit complaints—all remain atomized.  

  **Objection**: This lets the *same harm* (one town’s darkness) "count" multiple times—once as direct harm, and once for each sympathizer—effectively summing by proxy.  
  **Reply**: The individualist restriction aims to ensure principles are justifiable *to each person*. If sympathy is a *genuine* experiential burden (e.g., visceral distress at neighbors’ plight), excluding it misrepresents what people reasonably reject. The restriction forbids *trade-offs between persons*, not *recognition of relational goods/bads within a life*. Here, the "summing" happens *within* a complaint’s constitution, not *across* complaints.  

  **Strongest objection**: This permits *complaint inflation*. If 1,000 people each claim distress at one person’s minor liberty (e.g., wearing a shirt they dislike), that liberty could be rejected as imposing huge "burdens." But this confuses *reasonable* vs. *unreasonable* complaints. Contractualism filters complaints by *generic reasons*: "Distress at others’ harmless choices" is unreasonable, while "distress at neighbors’ preventable disaster" may be generic in close-knit communities. The framework *can* admit other-regarding burdens *if* they reflect a plausible, non-parochial value.  

  **Verdict**: I endorse admitting sympathy burdens *with a reasonableness filter*. The restriction’s purpose is to respect individual separateness, not to erase our social nature. When relational harms are real and generalizable, excluding them makes contractualism needlessly atomistic.  

  ---

  ### Marking Scheme (25 Total Marks)  
  1. **Coarse-grained comparison sans aggregation** (5 marks)  
     - *Hit:* Shows summer-grain comparison uses *intra-personal* totals (5 vs. 12 per town); no cross-person sum.  
     - *Miss:* Claims Rota "aggregates" or conflates grains.  

  2. **Fine-grained principle as live candidate + reductio** (5 marks)  
     - *Hit:* Treats "minimize max per choice" as generalizable; notes it forbids Rota weekly *and* invalidates rotas/jury duty.  
     - *Miss:* Dismisses principle as "unrealistic" without engagement.  

  3. **Temporal scope & residue** (5 marks)  
     - *Hit:* Explains coarse grain is *intra-personal* (thus allowed); notes this *only* works for recurring/time-shareable burdens among stable parties.  
     - *Miss:* Assumes coarse grain "solves" aggregation generally.  

  4. **Other-regarding complaints vs. aggregation** (5 marks)  
     - *Hit:* Distinguishes *content* of complaint (e.g., "I suffer more when more are hurt") from *summing complaints*; shows numbers enter via complaint structure.  
     - *Miss:* Conflates sympathy with interpersonal summing.  

  5. **Objection + defended filter/admission** (5 marks)  
     - *Hit:* Raises complaint inflation; defends a filter (e.g., "generic reasons") or admits no filter exists (with justification).  
     - *Miss:* Ignores objection or handwaves it.  

  ---

  ### A/B Boundary Note  
  A **B-grade answer** will correctly execute the mechanics: Contrast grains, parse sympathy burdens, and note the inflation risk.  
  An **A-grade answer** will *connect these moves to contractualism’s justificatory purpose*. For example:  
  - Argues that coarse grain respects agents’ *narrative identity* (a summer policy shapes a town’s seasonal plans).  
  - Grounds the "reasonableness filter" for sympathy in Scanlon’s *impersonal* vs. *individual* standpoints.  
  - Explains why admitting relational burdens *serves* mutual justification (e.g., "Principles should reflect our actual social bonds").  
  A-grades defend their stance by showing *how their choice of grain/complaint-content embodies or betrays contractualism’s core ideal*.
