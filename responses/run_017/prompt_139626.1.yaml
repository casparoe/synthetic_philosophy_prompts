answer: |-
  ### Exam Question: Metaphysics Final  
  **Time Allotted:** 48 hours  
  **Format:** Open notes, word-processed  
  **Word Limit:** 1,200 words per answer  
  **Answer ONE of the following two questions:**  

  **QUESTION 1:**  
  Max Black’s two-spheres thought experiment is widely taken to refute the Principle of the Identity of Indiscernibles (PII). Critically evaluate whether this refutation succeeds, considering both the resources available to defenders of PII and the broader dialectical purposes for which PII has historically been employed. Your analysis should address what, if anything, the case shows about the *necessity* of PII and its implications for bundle theory.  

  **QUESTION 2:**  
  Suppose a perfectly homogeneous sphere exists for one million years, is annihilated, and after another million years, a second qualitatively identical sphere comes into existence. Could these spheres be numerically distinct? Discuss how this *Successive Spheres* case interacts with the Principle of the Identity of Indiscernibles (PII), comparing it to Max Black’s classic two-spheres scenario. Address whether temporal separation alters the dialectical stakes for PII’s defenders and whether the case bears on questions of diachronic identity or transworld identity.  

  ---

  ### Model Answer (Question 1) — ~800 words  
  Max Black’s two-spheres case—featuring two qualitatively identical spheres in a symmetric universe—appears to falsify the Principle of the Identity of Indiscernibles (PII), which holds that numerically distinct objects must differ in some property. Superficially, Black seems triumphant: if space is relational, the spheres share all properties yet are distinct; if space is substantival, they differ in location but PII becomes vacuously true. However, this refutation is dialectically unstable, undermining PII’s historical role while failing to resolve its core tensions.  

  PII’s attractiveness stems partly from Leibniz’s anti-substantivalist argument. If space were an absolute container, God could shift the entire material universe eastward, creating an indiscernible counterpart world. PII forbids this: indiscernible worlds must be identical, rendering substantival space redundant. Black’s case complicates this. **If we accept substantivalism**, the spheres *do* differ—by occupying distinct spatial regions. Yet this "victory" for PII hollows it out: trivializing PII to "distinct things differ spatiotemporally" surrenders its anti-substantivalist force, as shifted worlds *would* differ spatiotemporally and thus satisfy PII. **If we reject substantivalism**, Black’s spheres become genuine counterexamples to PII—but this concedes Leibniz’s shifted-world scenario as possible, gutting his anti-substantivalist weapon. Either way, PII cannot simultaneously be substantive *and* defeat substantivalism.  

  Defenders of PII offer replies, but none escape this squeeze unscathed. **Haecceities** (primitive "thisness") preserve PII’s letter by assigning non-qualitative properties like *being sphere A*. Yet they reduce PII to "distinct things differ haecceitistically," trivializing it further and abandoning its reductionist ambitions. **Leibnizian denial** (asserting Black’s scenario is metaphysically impossible) saves PII’s necessity but at high cost: it demands an ad hoc modal claim and forfeits PII’s role in grounding individuation. **Relational properties** (e.g., *being 2 miles from another sphere*) appear promising, but only if relations are external. If relations require relata, the spheres’ distinctness must be presupposed—question-begging against PII’s critics.  

  The dispute hinges on **modality**: Black need only show his scenario is *conceivable* to challenge PII’s necessity, even if metaphysically impossible. Yet if PII is necessary, its defenders must explain why the scenario *seems* coherent—a burden they seldom shoulder. For **bundle theory**, Black’s case is existential: if objects are mere bundles of properties, indiscernible bundles imply one object. The substantivalist reply ("spheres differ by location") rescues bundle theory only by smuggling in non-bundled entities (space itself), collapsing the view. Thus, bundle theorists must reject substantivalism *and* bite Black’s bullet—a pyrrhic victory.  

  Ultimately, Black refutes PII only if we ignore its dialectical context. His spheres expose a dilemma: PII is either too weak to combat substantivalism (if spatiotemporal differences suffice) or false (if not). The "success" of standard replies merely masks this trade-off. PII survives as a nominal truth only by sacrificing its metaphysical teeth.  

  *(Word count: 798)*  

  ---  

  ### Marking Scheme (Question 1) /25  
  **Aim:** Reward dialectical insight over recitation.  

  1. **Articulates Black’s challenge accurately** (3 pts)  
     - *Hit:* Notes that spheres share all intrinsic *and* relational properties if space is relational.  
     - *Miss (common):* Claims spheres differ relationally (e.g., "each is 2m from the other").  

  2. **Identifies the substantivalism dilemma** (5 pts)  
     - *Hit:* Explains that substantivalism "saves" PII trivially (via spatial properties) but voids its anti-substantivalist function; anti-substantivalism allows counterexample but abandons Leibniz’s project.  
     - *Miss (common):* Treats location as a property without addressing why this trivializes PII.  

  3. **Critiques standard replies** (5 pts)  
     - *Hit:* Evaluates haecceities (trivialize PII), Leibnizian denial (ad hoc), relational properties (question-begging).  
     - *Miss (common):* Lists replies without assessing their dialectical survival.  

  4. **Engages modality & bundle theory stakes** (4 pts)  
     - *Hit:* Distinguishes conceivability vs. metaphysical possibility; notes bundle theory’s vulnerability if space is not substantival.  
     - *Miss (common):* Ignores modality or reduces bundle theory to a footnote.  

  5. **Assesses PII’s necessity/truth distinction** (4 pts)  
     - *Hit:* Argues that Black challenges PII’s *necessity* even if not its contingent truth; links to Leibniz’s shifted-world argument.  
     - *Miss (common):* Conflates truth and necessity.  

  6. **Original synthesis & conclusion** (4 pts)  
     - *Hit:* Shows how PII’s defenders face a "squeeze" between vacuity and falsehood; rejects "C-grade" conclusions.  
     - *Miss (common):* Ends with "Black refutes PII" without addressing dialectical costs.  

  ---  

  ### What a Solid B Answer Looks Like  
  A B answer (e.g., 17/25) accurately summarizes Black’s case and the substantivalism dilemma but lacks depth in synthesizing the stakes. It might:  
  - Correctly state that substantivalism rescues PII via spatial properties but note this weakens PII’s anti-substantivalist role.  
  - List haecceities and Leibnizian denial as replies, observing that haecceities seem *ad hoc* but not fully unpacking trivialization.  
  - Mention bundle theory’s incompatibility with Black’s scenario if space is relational but not tie this to the broader dilemma.  
  - Conclude that Black’s case "shows PII is not necessary" but not explore why this is dialectically messy for Leibnizians.  
  The analysis is competent but misses the *interdependence* of the squeeze—e.g., treating substantivalism and replies as isolated points rather than parts of an inescapable trap.  

  ---  

  ### Short Note on Consistency for TA  
  **Key for fair grading:**  
  - **A-range (21–25):** *Explicitly names the "squeeze"*—PII is either trivial (if spatial differences count) or false (if not). Connects this to Leibniz’s anti-substantivalism. Judges replies by whether they *retain PII’s dialectical utility*.  
  - **B-range (15–20):** Identifies pieces of the dilemma (e.g., "spatial properties save PII but make it weak") but doesn’t unify them. Treats replies as alternatives rather than evaluating their costs.  
  - **C-range (10–14):** Repeats the "Black refutes PII" mantra; cites replies uncritically; ignores substantivalism’s role.  
  - **D/F (<10):** Misdescribes Black’s case (e.g., "spheres have different relations"); confuses PII with identity over time.  

  **Penalize:** Answers that spend >300 words rehearsing Black’s setup without analysis.  
  **Reward:** Even brief engagement with the successive spheres analogy (e.g., "Similar issues arise with temporal locations").  

  *(American English conventions followed throughout.)*
