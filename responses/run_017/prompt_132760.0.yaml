prompt: |-
  I sit in on a reading group that has been working through Kripke's book on rules and private language, and last week two members — call them Marta and Nils — got stuck arguing about whether Kripke's rule-following skeptic has a real argument at all. They asked me to referee and I genuinely could not tell who was ahead, because each of them seemed to me to concede something important at exactly the point where the other seemed weakest. Their exchange, as close as I can reconstruct it:

  (1) **Marta:** The challenge is manufactured. The skeptic asks what fact about me makes it the case that by "plus" I meant addition rather than quus (the function that agrees with addition so long as both arguments are below 57 and returns 5 otherwise). But the natural answer — that I was trained to add, that my teachers corrected me as they did, that our practice is what it is — is brushed aside not because it is false but because it is not the right *kind* of thing. Meaning is use. Nothing lying behind the practice was ever on offer, so demanding a further "meaning-constituting fact" is like demanding to know what fact makes a game of chess the game of chess, over and above people's playing it as they do.

  (2) **Nils:** That is too quick. The skeptic's demand is not for a spooky extra fact; it is the ordinary demand that my word have a determinate application to cases I have not yet encountered. And the dispositional answer really does fail to meet it, for the simple reason that my dispositions, and my community's, run out before the numbers do. Facts about what I am disposed to say cannot determine a value for sums no human will ever compute. So the candidate fact does not even cover the cases under dispute.

  (3) **Marta:** The finitude worry is aimed at a version of dispositionalism nobody should hold. A dispositionalist will define meaning in terms of how I would respond under ideal conditions, or in terms of the rule I would acknowledge on reflection, and idealized dispositions can outrun my actual ones. Anyway, a contingent limitation on creatures like us cannot be the source of a conceptual paradox. What the skeptic really leans on is the normativity point: that no fact about what I am disposed to say could constitute a fact about what I *ought* to say. But that just writes into the notion of meaning a requirement that no naturalistic account could ever meet. Withdraw the requirement and the paradox evaporates.

  (4) **Nils:** Two problems. First, mistakes. Any dispositional account must select, from among my actual and counterfactual responses, the ones that manifest my meaning as opposed to my carelessness, fatigue or inattention; and selecting those requires knowing in advance which responses are the correct ones — which is what dispositions were supposed to explain. Idealizing the conditions merely relocates the problem to the specification of "ideal." Second, the finitude point is not really about finitude. Define a variant of quus — call it "plink": for any pair of numbers m, n, plink returns m + n if m + n is a computation I have ever performed or am disposed to perform, and 5 otherwise. If my total record of performances is finite, plink fits it exactly. And even if you inflate my dispositions to an infinite total, there are still pairs of numbers no disposition of mine reaches (numbers with more digits than there are particles in the observable universe), so a plink-style function can always be defined to agree with addition on everything I am disposed to do and diverge outside that range. No record of behaviour, however idealized, could in principle discriminate plus from the plink-style alternatives. The skeptic is not trading on a contingent weakness of ours.

  (5) **Marta:** That is exactly the feature that should arouse suspicion. A challenge that is in principle insensitive to every possible difference in the evidence is not a demand for a fact; it is skepticism about the external world or about other minds in semantic costume. We do not answer the brain-in-a-vat skeptic by producing a fact; we decline the demand. And the skeptic here concedes that nothing I could ever do, say or undergo would satisfy him. So at most the argument shows that one metaphysical picture of meaning — on which meaning must be fixed by something lying behind all possible manifestation — cannot be satisfied. That is a reductio of the picture, not a discovery about meaning.

  (6) **Nils:** Kripke grants much of that, which is why his own response is called a skeptical rather than a straight solution. He agrees that no fact of the matter answers the skeptic, and then asks what is left. What is left is our practice of attributing meanings to one another under conditions — agreement with the community, reliability across a suitable range of cases — and he proposes to understand meaning attributions by their assertibility conditions rather than by truth conditions. You retain everything we actually do with them; you surrender the idea that they report facts. That is not declining the skeptic's demand, it is doing something with it.

  (7) **Marta:** But the skeptical solution cannot be stated in its own terms, and it generalizes itself out of business. First: if meaning attributions have no truth conditions, then the sentences that make up the solution — that there is no fact of the matter, that the skeptic's argument is sound, that attributions have assertibility conditions of such-and-such a kind — are themselves neither true nor false, so the position can be uttered but not asserted. Second, the argument is entirely general: whatever a "straight" solution proposes, the question what makes *those* words mean what they do can always be re-raised, and the same goes for the community, since we can ask what makes the community's practice the practice of meaning plus rather than plink. An argument that leaves you unable to formulate any answer is not a paradox awaiting a solution; it is a machine for producing inarticulacy.

  (8) **Nils:** Both of those are weaker than they sound. Generality cuts both ways: every proposed solution, straight or skeptical, faces the re-raising question, so generality cannot be an objection specific to mine — and there are well-worked-out ways of distinguishing asserting from merely making noises that do not presuppose semantic facts, namely by appeal to the role a sentence plays in a practice. As for the community, the skeptical solution does not need the community to *determine* meaning; it uses the community to state the conditions under which attributions are warranted. Those are different claims.

  Please adjudicate the exchange move by move: for each of the eight moves, say whether it is clearly right, partly right, or clearly mistaken, and give a brief justification for your rating. Then say who is more right overall, and identify what — if anything — both of them are missing: a distinction neither drew, an assumption they share, or a way of framing the issue that dissolves part of the dispute.
reasoning: |-
  Okay, I need to carefully analyze this debate between Marta and Nils about Kripke's rule-following paradox. Both seem to make strong points while conceding important ground, making it tricky to referee. Let me break down their exchange move by move.

  First, Marta argues that the skeptic manufactures a challenge by dismissing the natural answer - that meaning is grounded in use and training. She compares it to demanding a fact beyond how chess is played that makes it chess. This Wittgensteinian view seems correct in highlighting how meaning emerges from practice, not hidden facts.

  Nils counters that the skeptic reasonably demands determinacy for unencountered cases. He points out dispositionalism fails because our finite dispositions can't cover all possible computations. This finitude argument against simple dispositionalism is valid - we can't have dispositions for computations beyond physical possibility.

  Marta responds by shifting to idealized dispositions and rejecting normativity as question-begging. She rightly notes that perfect-condition counterfactuals avoid simple finitude objections, and that normativity may presuppose what needs proving. But she underestimates Nils' next move.

  Nils fires back with two powerful points: the problem of mistakes requiring prior knowledge of correctness (creating circularity), and his brilliant "plink" variation showing idealized dispositions still have coverage gaps. This devastates simple dispositional accounts by demonstrating no finite/infinite disposition set can uniquely determine meaning.

  Marta then compares the skeptic to external world skepticism, arguing we should reject the demand for justification rather than supply facts. This analogy has merit - both skepticisms set impossible standards. But she overstates when claiming the skeptic concedes nothing could satisfy him; Kripke's skeptic does engage with proposed facts.

  Nils explains Kripke's skeptical solution: meaning attributions have assertibility conditions (community agreement) not truth conditions. This accurately represents Kripke's position, though whether it truly solves anything remains debatable.

  Marta attacks this solution as self-defeating: if no sentences are true/false, the solution can't be asserted, and the argument generalizes to destroy all meaning. The self-reference problem is serious, though Nils has resources to respond about assertion-practice distinctions.

  Nils defends by noting all solutions face regress, and that assertion can be grounded in social practice without semantic facts. He clarifies community provides warrant conditions, not determination - an important distinction that partially answers Marta's generalization concern.

  Overall, both are partly right throughout. Nils better handles the core argument's force against dispositionalism, while Marta effectively exposes problems in the skeptical solution. Their key shared blind spot is not sufficiently exploring non-reductive accounts of meaning (e.g., primitive normativity or pragmatism) that might avoid both horns of the dilemma. The debate remains unresolved because Kripke successfully shows the paradox can't be easily dismissed yet his solution remains controversial.
answer: |-
  Here's a move-by-move adjudication of Marta and Nils' exchange, followed by an overall assessment and identification of key missing elements:

  **Move-by-Move Adjudication:**

  1.  **Marta (Initial Challenge):** *Partly Right*  
      **Justification:** Marta correctly identifies the skeptic's dismissal of "meaning is use" as central, and her chess analogy highlights how demanding a "fact behind the practice" might be category-confused. However, she underestimates the skeptic's *specific* demand for determinacy in novel cases ("Why *ought* I say 125, not 5, for 68+57?") which use alone doesn't *obviously* solve without further elaboration. Her claim the challenge is "manufactured" is premature.

  2.  **Nils (Defense of Skeptic & Simple Dispositionalism's Failure):** *Clearly Right*  
      **Justification:** Nils precisely articulates the skeptic's core demand: determinacy for unencountered cases. His critique of *simple* dispositionalism (relying on actual dispositions) is decisive: finite beings cannot have dispositions covering all possible computations. This establishes the *prima facie* plausibility of the skeptic's worry.

  3.  **Marta (Idealized Dispositionalism & Normativity):** *Partly Right*  
      **Justification:** Marta is right that the skeptic leans heavily on normativity ("is" vs. "ought") and that idealization counters the *simple* finitude objection. However, Nils is correct that idealization doesn't automatically solve the problem (as he shows in move 4). Her claim that normativity "writes in" a requirement naturalism can't meet is insightful but needs development; it doesn't *dissolve* the paradox, it just challenges one interpretation of it.

  4.  **Nils (Mistakes & Plink - Idealized Dispositionalism's Failure):** *Clearly Right*  
      **Justification:** This is a strong move. Nils successfully refutes *idealized* dispositionalism. The "mistakes" point demonstrates the circularity problem (needing correctness to define the ideal conditions). The "plink" argument is devastating: it shows that *any* finite/in-principle-limited set of dispositions/behaviors, even idealized, is compatible with infinitely many divergent functions. The skeptic's challenge is indeed not contingent but conceptual.

  5.  **Marta (Skepticism Analogy & Rejecting the Demand):** *Partly Right*  
      **Justification:** Marta's analogy to external world skepticism is apt: both demand justification under impossible conditions of total evidence insulation. Her point that the skeptic concedes *nothing* could satisfy him highlights the challenge's radical nature. However, she overstates the case that we must *simply* "decline the demand." The skeptic *has* raised a genuine puzzle about determinacy and justification that needs addressing, even if the demand for "facts behind" is rejected. Kripke *does* think something needs to be done with the challenge.

  6.  **Nils (Skeptical Solution):** *Clearly Right (as Exegesis)*  
      **Justification:** Nils accurately summarizes Kripke's skeptical solution: meaning attributions lack truth-conditions but have assertibility-conditions grounded in community agreement and reliable application within a range. He correctly distinguishes the community's role in *warranting attributions* from *determining meaning* (a crucial point often missed). This is faithful to Kripke's text.

  7.  **Marta (Problems with Skeptical Solution):** *Partly Right*  
      **Justification:** Marta's first point – the self-refutation worry ("if meaning attributions lack truth, so do the solution's claims") – is a serious and common objection. Her second point – the argument generalizes ("what makes *'community'* mean community?") – highlights the threat of global semantic nihilism. However, Nils is poised to offer responses (as he does in move 8), and Kripkeans have developed ways to address self-refutation (e.g., understanding the solution as a *proposal* for a practice, not a factual assertion). The generality point is powerful but affects *all* solutions, not just skeptical ones.

  8.  **Nils (Defense of Skeptical Solution):** *Partly Right*  
      **Justification:** Nils correctly notes that the regress/generality problem ("what makes 'community' mean X?") applies to *any* solution (straight or skeptical). His appeal to distinguishing assertion via *role in practice* rather than semantic facts is the standard Kripkean/Wittgensteinian move to address self-refutation. Reiterating the distinction between the community *determining* meaning vs. providing *warrant conditions* for attributions is essential and counters Marta's overgeneralization. However, whether this *fully* resolves the self-refutation worry and avoids a debilitating quietism about meaning remains deeply contested in the literature. The solution is internally coherent but philosophically unstable for many.

  **Overall Assessment:**

  *   **Nils is slightly more right overall.** He consistently provides the strongest exegesis of Kripke's actual argument and skeptical solution. He effectively dismantles dispositionalist responses (simple and idealized) with powerful arguments like the "plink" function, and he accurately presents and defends the structure of the skeptical solution, especially the vital distinction between the community determining meaning vs. warranting attributions. He successfully establishes the *prima facie* force of the skeptic's challenge.
  *   **Marta makes valuable critical points.** She correctly identifies the problematic demand for a "fact behind" use, the role of normativity as a potential begged question, the radical nature of the skepticism (akin to external world skepticism), and the serious instability of the skeptical solution regarding self-refutation and generalization. Her strength lies in highlighting the deep philosophical costs and potential incoherencies lurking within the skeptical challenge and solution.

  **What Both Are Missing / Shared Assumptions / Needed Framing:**

  1.  **The Primacy of the Normative "Ought":** Both implicitly grant the skeptic's starting point: that meaning requires a *fact* that *determines* what I *ought* to say in novel cases. They focus on whether such a fact can be found (Nils: no, Marta: it's the wrong demand). They don't deeply challenge the *need* for this kind of justificatory fact grounding the normativity. A different approach (e.g., later Wittgensteinians, pragmatists) might argue the "ought" arises *from* the practice itself, its standards, and its correction mechanisms, without needing a prior fact to ground it. The normativity is *constitutive* of the practice, not something requiring external grounding.
  2.  **Alternative Non-Reductive/Non-Factualist Views:** The debate oscillates between finding reductive facts (dispositions) or accepting non-factualism (skeptical solution). They don't explore robust non-reductive realist views (e.g., meaning facts are primitive, or irreducibly normative) or more pragmatic accounts that might dissolve the paradox by rejecting the underlying picture of meaning as requiring determination by inner states or hidden facts. The possibility that meaning is *sui generis* or fundamentally embedded in a normative *form of life* isn't seriously considered.
  3.  **The Target of the Skeptic's Challenge:** The discussion focuses on the factuality of meaning *for the individual*. They don't fully dissect *who* the skeptic is challenging: Is it the philosopher seeking a reductive analysis? The individual wondering about their own past meaning? Or is it a challenge to the very coherence of our ordinary attributions? Clarifying the target could reframe the dispute. Kripke's skeptic primarily targets the *philosopher's* quest for reductive facts grounding meaning, not necessarily the ordinary speaker's confidence.
  4.  **The "Straight Solution" Space:** While dispositionalism is discussed, they don't seriously engage with other potential "straight solutions" Kripke dismisses (e.g., Platonic objects, qualia). The debate is largely dispositionalism vs. skeptical solution. Exploring why Kripke thinks *all* straight solutions fail could deepen the analysis.
  5.  **The Role of Training and Correction:** Marta mentions training and correction initially, but this crucial aspect isn't developed as a *positive* response. How do training, examples, and correction within a practice establish standards and norms *without* appealing to hidden facts? This Wittgensteinian strand isn't fully leveraged against the skeptic's demand for justification beyond the practice.

  **In essence:** The debate powerfully captures the core tension in Kripke: the compelling skeptical argument against reductive accounts of meaning and the deeply unsettling nature of the skeptical solution. However, both participants remain somewhat trapped within the dialectic Kripke sets up, missing opportunities to challenge the fundamental assumptions about normativity and justification that drive the paradox, or to explore alternative non-reductive frameworks for understanding meaning and rules. They focus on whether the skeptic wins, not whether the skeptic's starting point is ultimately coherent.
