  This morning, the furnace was silent. A repair truck idled outside; the technician had disabled the system to replace a valve. Martha had watched him shut it down, the house stripped of its heartbeat. At 5:39, Silas padded in, circled the vent, and lay down, eyes fixed on the cold metal grid. Martha held her breath. The technician’s wrench clanked in the basement. Silas’s tail twitched. 5:40 passed, then 5:45. No heat came. Silas remained, ears pricked forward, body tense but waiting. At 5:47—the furnace’s old waking hour—he jerked his head toward the vent as if startled by silence, then stood, shook himself, and slunk away. Martha touched her wedding band, cold against her skin.

