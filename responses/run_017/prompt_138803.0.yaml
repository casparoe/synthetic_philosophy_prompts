  Okay, the user has a doctorate in philosophy and is deeply engaged with metaethics, particularly evolutionary explanations of moral judgments. They've noticed a recurring argumentative move in debates about debunking explanations and want to know if it has a name or if it's a distinct phenomenon. They also want clarity on how this move works across different contexts and its validity.

  First, I need to parse the core move they describe. It's a two-step process: one side provides a selective evolutionary explanation for most moral judgments, then the other side points out judgments not covered. Instead of just sparing those, the debunker claims they're epistemically better off because the explanation screened out rivals. The user notes the asymmetry—sometimes unexplained judgments are seen as suspect, other times as certified. They want to know if this is one phenomenon or two, and what determines the direction.

  The user mentioned three test cases: provisionality of explanations, recency of moral judgments, and applying the move to logical reasoning. These are crucial for any proposed definition. They also want an analysis of the move's validity without bibliographic references, focusing on arguments.

  I recall concepts like the "Common Sense" gambit from Street or Vavova's "third-factor" responses, but they don't fully capture the comparative, graded nature here. The sieve effect is key—the more thorough the debunking, the cleaner the residue. This seems unique. So coining a term like "Residual Certification" makes sense. It emphasizes the leftover beliefs gaining status after debunking.

  For the phenomenon, I need to define it tightly. It's not just gaps in explanation; it specifically uses the incompleteness to elevate the remaining beliefs. The asymmetry in epistemic status—unexplained as certified vs. suspect—depends on whether the explanation is truth-tracking. If the debunking account is truth-tracking, leftover beliefs must be explained by truth; if not, unexplained beliefs are suspicious. The core parameter is the source's reliability.

  Testing the cases:
  1. Provisional explanations: If the explanation could extend later, the certification is provisional. This affects the move's strength, making it defeasible.
  2. Recent judgments: If a belief is recent and culturally shaped, it might not fit the evolutionary sieve. Recency could hurt if the sieve assumes ancient origins, but if the sieve is about truth-tracking generally, it might still apply. Context matters.
  3. Logic example: Applying the sieve to logic might feel different because logical truths are necessary. But if the evolutionary account is truth-tracking for logic, Residual Certification could work similarly. However, the necessity of logical truths might make the move less compelling than in morality, where truths aren't necessary.

  Assessing the move's validity: The sieve inference depends on the debunking explanation being truth-tracking. If the mechanism is reliable, then leftovers with no alternative explanation default to truth. But this requires that the explanation is complete for the debunked beliefs and that no other truth-tracking sources exist. The main weakness is the false dichotomy—there might be non-truth-tracking sources not considered. Also, the move might conflate genealogy with justification.

  The user's deeper need might be to systematize this argumentative pattern for their own scholarship or teaching. They might want to identify if it's a legitimate tool or a fallacy, and how to navigate debates more effectively. Their frustration with re-deriving thoughts suggests a desire for conceptual clarity to save cognitive effort.

  I should be clear about my confidence levels. The definition of Residual Certification seems solid, but the asymmetry resolution is more tentative. The validity assessment's weakest point is the necessity of logical truths affecting the move's applicability—that's where I'm least sure.
answer: |-
  Based on your precise description, the core phenomenon you've identified – **where the *incompleteness* of a debunking explanation is used to *elevate* the epistemic status of the unexplained residual beliefs, specifically because the successful debunking of the majority is taken to screen out non-truth-tracking sources, leaving the residue as default truth-tracked** – does not have a single, universally established name in the literature. While it operates within familiar territories (debunking, IBE, coincidence arguments), its distinctive *comparative, graded, sieve-like structure* ("the more thorough the explanation, the cleaner the residue") sets it apart as a specific argumentative maneuver.

  **Defining the Phenomenon: "Residual Certification"**

  1.  **Term:** **Residual Certification (RC)**
  2.  **Definition:** Residual Certification is an argumentative move within the context of genealogical/debunking explanations (e.g., evolutionary accounts of beliefs) that claims:
      *   A successful debunking explanation for a *subset* (S) of a class of beliefs (B) demonstrates that the causal mechanisms producing S are unreliable (non-truth-tracking) with respect to the content of S.
      *   The *remaining* beliefs (R) within B, for which no such debunking explanation currently exists (the "residue"), are thereby *epistemically elevated* relative to their pre-debunking status.
      *   This elevation occurs because the successful debunking of S is taken to have screened out the *dominant known unreliable source* for beliefs in B. The absence of an explanation for R, *in this specific context*, is interpreted as evidence that R lacks a known unreliable source and is therefore *more likely* to be produced by a reliable (truth-tracking) mechanism. The *comprehensiveness* of the debunking of S is seen as *strengthening* the epistemic standing of R.

  3.  **Key Distinguishing Features (Carving the Phenomenon):**
      *   **Comparative & Graded:** It explicitly compares the status of S (debunked) and R (residue), and the epistemic gain for R is *proportional* to the success/comprehensiveness of the debunking of S. It's not just sparing R, but actively promoting it *because* S was debunked so well.
      *   **Sieve Metaphor:** It relies on the image of the debunking explanation acting as a filter that removes the "dirt" (beliefs from unreliable sources), leaving the "clean" residue (R) presumed reliable by default.
      *   **Default Reliability:** The core inference is that absent a *specific* debunking explanation for R, and given the demonstrated unreliability of the mechanism for S, R *must* be explained by a reliable source. This is the crucial (and often contentious) leap.
      *   **Contrasts with:**
          *   **Simple Sparing/Non-Debunking:** Merely noting that an explanation doesn't touch R, without claiming R is *better off* because of the successful debunking of S.
          *   **Standard Coincidence/Third-Factor Replies:** These posit a *positive* reliable factor (e.g., moral facts, logical necessity) that *co-explains* both the belief and the evolutionary pressure. RC, as you describe it, often seems to rely on the *absence* of a debunking story *after* the sieve, *without necessarily specifying the positive reliable factor* (though it implies one must exist). RC leverages the *explanatory gap* created by the debunking's incompleteness.
          *   **Inference to the Best Explanation (IBE) for the Residue:** While RC might employ IBE ("The best explanation for R's persistence *after* S is debunked is its truth"), RC is specifically triggered by and dependent on the *prior successful debunking of the majority subset*. It's IBE in a very specific, constrained context defined by the sieve.
          *   **Completeness Requirement for Debunking:** The idea that debunking must explain *all* beliefs to undermine *any* is different. RC exploits *incompleteness* to *support* the residue, not just to shield all beliefs from debunking per se. It doesn't say debunking fails entirely without completeness; it says incompleteness *benefits* the unexplained part.
          *   **"Unexplained = Suspect" Move:** This is the *flip side* you identified. RC is the specific phenomenon where, in the *context of a largely successful debunking*, unexplainedness *certifies*. The "Unexplained = Suspect" move operates in a different context (often when no major debunking success is claimed, or when the source is presumed unreliable).

  **The Asymmetry: One Phenomenon, One Core Parameter**

  The "Unexplained = Suspect" move and RC are two manifestations of the *same underlying inferential pattern*, differing only in the **presumed default reliability of the explanatory source under investigation.**

  *   **RC (Certifies):** Operates when the debunking explanation is presented as demonstrating the *unreliability* of the primary source for beliefs in domain B (e.g., evolution shaping moral intuitions via fitness, not truth). *Because* the source is shown unreliable for S, the *absence* of an explanation for R within this unreliable framework suggests R *isn't* produced by this unreliable source, implying a reliable source. Unexplainedness by the *unreliable source* is good.
  *   **Unexplained = Suspect (Discredits):** Operates when the explanatory source is *presumed or argued to be generally reliable* for domain B (e.g., rational intuition for logic, perception for physical objects). If a belief within B *lacks* an explanation via this reliable source, that becomes suspicious – why wouldn't the reliable source produce it? It might suggest the belief is an outlier error, culturally contingent noise, or produced by an unreliable process. Unexplainedness by the *reliable source* is bad.

  **The core parameter fixing the direction is: Does the context establish the explanatory source/framework as *unreliable* or *reliable* for the domain in question?** RC requires the debunking to have successfully established the source's *unreliability* for the debunked subset (S), creating a presumption *against* that source for the residue (R).

  **Ruling on Your Cases:**

  1.  **Provisional Explanations (Could debunk R tomorrow):**
      *   **RC Status:** The certification provided by RC is inherently **provisional and defeasible**. If new evidence extends the debunking explanation to cover R, then R loses its certified status and is debunked alongside S.
      *   **Effect on the Move:** This is a *major weakness* of RC. It relies on the *current state* of explanatory knowledge. The move doesn't guarantee R is *actually* true or reliably formed; it only claims that *given current knowledge*, after debunking S, R looks comparatively better. It's a defeasible heuristic, not a proof. Proponents must acknowledge this provisionality.

  2.  **Recency of Uptake (Old content, new universality; Content depends on recent tech/institutions):**
      *   **Effect on Sieve:** This typically **hurts the RC move** if the debunking explanation focuses on *ancient evolutionary origins*. The sieve (evolutionary debunking) is designed to filter beliefs shaped by Pleistocene selection pressures. A belief that only became widespread or possible *very recently* likely wasn't shaped by those pressures. Its "survival" through the evolutionary sieve tells us little about its epistemic status because it wasn't *in* the input to that sieve to begin with. The sieve wasn't testing it. Its unexplainedness by evolution is expected and unremarkable, neither certifying nor (necessarily) suspect *in the context of evolutionary debunking*. (The "Unexplained = Suspect" move might apply if appealing to a different reliable source, like reason, but that's distinct from RC using the evolutionary sieve).

  3.  **Application to Logic/Arithmetic (Debunking deduction, certifying modus ponens?):**
      *   **Look:** The move **looks significantly worse** applied to necessary truths like logic/math than to contingent domains like morality.
      *   **Why & Implications:**
          *   **Necessity:** Logical/mathematical truths (e.g., modus ponens, 2+2=4) hold necessarily. Any evolutionary story must be consistent with their truth; it cannot *explain why they are true*, only why we *believe* them (and perhaps why believing them was adaptive). A debunking story claiming our belief in modus ponens stems *only* from fitness advantages, not its truth, faces the immediate challenge: *How could believing a false logical rule be consistently adaptive?* The reliable source (rational intuition, grasp of necessity) seems inescapable.
          *   **RC Feels Redundant/Question-Begging:** Certifying modus ponens *because* an evolutionary story debunked our belief in, say, the gambler's fallacy feels backwards. Modus ponens seems epistemically bedrock *prior* to any debunking. Using RC here feels like using a weak tool where a sledgehammer (the necessity of the truth) is available and undermines the need for the sieve inference.
          *   **Implication for Morality:** This contrast highlights a key vulnerability of RC in morality. Moral realists often argue moral truths are necessary (like logic), making evolutionary debunking seem incoherent (how could non-truth-tracking processes land on necessary truths?). Anti-realists deny this necessity. The *perceived plausibility* of RC in morality often hinges on whether one accepts moral realism (necessary truths, making RC seem weak/strange) or anti-realism (contingent "truths" or attitudes, making the sieve seem more relevant). The logic case exposes how RC depends on the *contingency* of the domain's truths.

  **Assessment of the Move (Residual Certification)**

  1.  **When it *might* be sound(ish):** RC functions best as a *defeasible, comparative heuristic* within a debate where:
      *   A specific, well-supported debunking mechanism (M) is accepted as the primary source for *most* beliefs in domain B.
      *   M is convincingly shown to be *unreliable* (non-truth-tracking) with respect to the content of B.
      *   The residue R is genuinely unexplained by M *and* there are no other *plausible, known unreliable mechanisms* readily available to explain R.
      *   The inference is strictly provisional ("Given current knowledge, R looks better than S post-debunking").
      *   The domain truths are contingent.

  2.  **Where it breaks:**
      *   **The False Dichotomy:** This is the **core flaw**. RC assumes that if M (the debunked source) doesn't explain R, then R *must* be explained by a reliable source. This ignores the possibility of:
          *   Other, as-yet-unknown unreliable mechanisms explaining R.
          *   R being a fluke, error, or cultural byproduct not explained by *any* specific truth-tracking mechanism.
          *   M actually *could* explain R with further development (the provisionality problem).
      *   **Misapplying the Sieve:** As in the Recency case, if R wasn't shaped by the forces M describes (e.g., ancient evolution), surviving M's sieve is meaningless.
      *   **Overestimating Sieve Power:** Demonstrating M explains S unreliably doesn't automatically mean M is the *only* significant unreliable source for beliefs in B. There could be multiple unreliable sources; debunking one doesn't cleanse the residue of others.
      *   **Domain Contingency:** It struggles immensely with domains perceived as involving necessary truths (like logic), as the certification seems trivial or misplaced.
      *   **The Flip Side:** The same unexplainedness can be used to argue R is *suspect* if the default presumption is reliability, highlighting the argument's context-dependence.

  **Confidence Levels:**

  *   **High Confidence:** That the phenomenon you describe lacks a single established name; that "Residual Certification" captures its core graded/sieve structure; that the asymmetry with "Unexplained=Suspect" is resolved by the default reliability of the source; that RC is inherently provisional; that recency hurts RC when applied to ancient evolutionary sieves; that RC looks much weaker applied to logic/math than morality.
  *   **Moderate Confidence:** The precise definitional boundaries distinguishing RC from near neighbors (like specific third-factor replies); the full implications of the necessity/contingency divide for RC's plausibility.
  *   **Least Confident Claim:** **The precise extent to which the perceived *contingency* of moral truths is the *decisive* factor in making RC seem more plausible in morality than in logic.** While I'm confident the necessity/contingency distinction is crucial and makes RC look worse in logic, I'm less confident that this is the *only* major factor or that its weight is absolute, versus interacting with other intuitions about the domains. The argumentative *rhetorical force* of RC in metaethics might rely on more than just this metaphysical point. This is the point most open to refinement or counter-argument.
