  First, I need to understand their three positions clearly. The record-first view prioritizes evidence, memory-constitutive focuses on community identity, and custodial is about trust obligations. The challenge is making record-first choose preservation based on evidentiary concerns alone, not empathy. 

  The constraints are specific: realistic 20th-century scenario, conflict over details (not existence), solid evidence, and no easy outs. The community must have a long-standing tradition, neither naive nor perfect. Most importantly, the custodial view must stand alone in demanding correction.

  Hmm... what scenario would make evidence-based reasoning favor preserving a false memory? Maybe if correcting it would destroy the only evidence? Like a physical memorial built on the wrong site that contains crucial documentation. 

  I'm imagining a labor union hall commemorating a massacre. The shared memory says it happened at their old headquarters, but newly uncovered blueprints prove it actually happened two blocks away at a different building. The memorial contains a time capsule with original documents inside its foundation. 

  For record-first: if we excavate to move the memorial, we might damage the fragile documents. Preserving the physical evidence (by leaving the memorial) outweighs correcting the location error. The false memory becomes necessary to protect the evidence. 

  For memory-constitutive: the memorial site represents their resistance identity. Moving it would sever their connection to generations of struggle, regardless of accuracy. 

  For custodial: the survivors entrusted them with the true location. Keeping the false memorial betrays that specific trust, even if evidence is preserved. 

  The key feature is the evidence being physically embedded in the memorial. Remove that, and record-first would demand correction. Critics might say we could carefully excavate, but the fragility makes that risky. 

  This should work because custodial is the only view prioritizing the survivors' trust over evidence or identity. Neither of the other positions care about that obligation.
answer: |-
  Here’s a custom-built test case meeting all your specifications, followed by analysis:

  **The Case: The Kilner Mills Strike Massacre (1937)**  
  The industrial town of Kilner Heights commemorates the "Kilner Mills Massacre" annually at Founders’ Park. The shared memory holds that on May 15, 1937, strikebreakers hired by mill owner Arthur Vance opened fire on unarmed picketers *at the Vance Mill gates*, killing 12 workers. This memory is central to the town’s identity, union solidarity, and ongoing labor advocacy. The Vance Mill site was demolished in 1958; Founders’ Park (where the memorial stands) was built on land *adjacent* to the former mill complex. Recently, an archivist discovered authenticated Vance Company security logs and coroner’s maps in a state archive. These documents conclusively prove the shooting occurred not at the main mill gates (as remembered), but 200 yards away, *at the corner of Pine & Mill Streets*, where strikers had blocked a delivery truck. The death toll (12) and Vance’s responsibility are undisputed. The Kilner Memorial Committee must decide whether to amend the memorial plaque and relocate the annual ceremony to Pine & Mill. Crucially, during the park’s construction in 1958, surviving strikers secretly placed a sealed metal box containing original strike bulletins, photos, and a list of witness names *inside the memorial’s concrete plinth* at Founders’ Park. Excavating it risks severe damage to these irreplaceable primary sources due to corrosion and concrete encasement.

  ---

  **Analysis:**

  1.  **The Three Views:**
      *   **Record-First (Preserve Memory/Memorial):** "The documentary record (security logs, coroner’s maps) is objectively superior evidence for the *location* of the shooting. However, our core aim is ensuring *true events are believed long-term* and that *evidence survives*. Relocating the memorial and ceremony based on the new documents *now* would necessitate excavating the plinth to move the time capsule. Forensic assessment shows this carries a high risk of destroying the fragile contents – the very evidence confirming Vance’s guilt, the death toll, and worker testimonies (which align with the record on everything *except* location). Preserving this irreplaceable evidence *within the existing memorial*, even if it means temporarily perpetuating the location error, best serves the long-term goal of establishing the full, evidenced truth. The location error can be corrected later when non-destructive retrieval is possible, using the preserved evidence to bolster credibility. Correcting the location *now* jeopardizes the evidence needed to uphold the larger, more important truths."
      *   **Memory-Constitutive (Preserve Memory/Memorial):** "The memorial at Founders’ Park isn't just a marker; it's the physical heart of our community's identity. For 65 years, generations have gathered *here* to affirm our shared struggle against exploitation. This specific ground, consecrated by memory and ritual, embodies our ongoing obligation to worker solidarity and resistance. Moving the ceremony to Pine & Mill, a nondescript street corner, severs the tangible connection to that lived history. The *meaning* resides in the collective act of remembrance at *this* site, not the precise GPS coordinates of the tragedy. Vance was responsible, workers died – that's the core truth. Relocating the memorial dissolves the power of this shared symbol and undermines the community’s cohesion and purpose. The physical continuity of place is essential to the memory’s function."
      *   **Custodial (Correct Memory/Memorial):** "The survivors who placed the time capsule entrusted the community with a *specific* duty: to guard the *truth as they knew and documented it* at the time of commemoration. They chose *this* box, with *these* contents, placed *here* in 1958, based *on their belief* the shooting happened at the mill gates. Our obligation is fidelity to *that act of entrustment*, not to the abstract truth of the location or the community's current identity needs. Using the *existence* of the capsule they entrusted as a reason *not* to correct the location error they inadvertently perpetuated is a profound betrayal. We are stewards of *their* testimony and *their* act of commemoration. Correcting the plaque and acknowledging the true location at Pine & Mill is the only way to honor the *specific* trust placed in us by those who lived it and sought to preserve their truth. The physical evidence inside the plinth is part of the entrusted material, but the *act of entrustment* includes the context of its placement based on their understanding."

  2.  **The Key Feature & Its Removal:**
      *   **The Key Feature:** The **irreplaceable primary evidence (time capsule) is physically embedded within the *existing* memorial structure**, and accessing/correcting the memorial's location *requires* risking the destruction of that evidence.
      *   **Effect of Removal:** If the time capsule were *not* embedded in the memorial (e.g., stored safely elsewhere), the scenario collapses. Record-First would *immediately demand correction* of the location error ("Best evidence wins, no downside"). Memory-Constitutive would still advocate preservation. Custodial would likely still demand correction (arguing fidelity to the survivors' *narrative* intent, not just the physical object). The unique Record-First + Memory-Constitutive alliance against Custodial disappears, reverting to the "boring 2-1 split" (Record-First + Custodial for correction vs. Memory-Constitutive for preservation).

  3.  **Critique from a Hardline Record-First View & Its Validity:**
      *   **The Attack:** "This is sophistry. The Record-First position is betraying its core principle – belief should track the best current evidence. The location evidence *now* is definitive (logs, maps). Preserving *other* evidence (the capsule) by perpetuating a known falsehood about location is prioritizing one set of evidence over a more directly relevant set in a way that misleads people *now*. It makes truth contingent on future technological rescue. The risk to the capsule is a practical obstacle, not an epistemological principle. True Record-First demands announcing the correct location immediately *and then* finding the safest possible way to retrieve/preserve the capsule – even if that means delaying physical memorial relocation. Perpetuating the false location actively misinforms the community and future researchers."
      *   **Does it Land?** **Partially, but misses the strategic calculation.** The critique correctly points out the tension: Record-First *is* compromising immediate location accuracy for long-term evidence preservation. However, it fails to fully engage with the Record-First argument's *consequentialist core*: if retrieving the capsule *now* has a high probability of destroying the *only* primary evidence confirming the massacre's core facts (Vance's guilt, death toll, worker perspective), then the *net* loss of verified truth might be greater than maintaining a specific locational falsehood *temporarily*. The hardliner prioritizes the *current* locational truth absolutely; your constructed Record-First view prioritizes the *overall survival of the most comprehensive evidence* for the *entire* event. The attack lands as a valid *internal* critique of priorities within evidence-based reasoning but doesn't negate the constructed position's internal logic focused on long-term, maximal truth preservation.

  ---

  **Why This Serves Your Purpose:**
  *   **Custodial Stands Alone:** Only Custodial demands *immediate, public correction* as a non-negotiable duty of fidelity *to the specific act of entrustment* by the survivors. It prioritizes honoring the *relationship* and *intent* of those who passed the memory down over accuracy (Record-First's concern) or current identity (Memory-Constitutive's concern).
  *   **Record-First "Keep" on Its Own Terms:** It advocates preserving the memorial/location *solely* to protect fragile, irreplaceable evidence crucial for the *larger* truth, using a consequentialist calculation about long-term belief and evidence survival. No appeal to hurt feelings or identity.
  *   **Memory-Constitutive "Keep" on Its Own Terms:** It advocates preservation based on the essential role of the *specific place* in constituting the community's identity and sustaining its obligations, completely independent of evidentiary concerns or the time capsule's existence.
  *   **Conflict is Real & Central:** The location is wrong, the record is right and solid. The memory is deeply held and functional. The time capsule doesn't resolve the conflict; it creates the unique tension for Record-First.
  *   **Not Mushy Midpoint:** Custodial isn't splitting the difference. It takes the hardest line *for* correction here, grounded in a distinct ethical obligation (fidelity to entrustment) that overrides both evidentiary strategy and identity preservation. Its verdict is principled and clear, contrasting sharply with the others.
