prompt: |-
  I am building an automated anomaly-triage system for a fleet of fielded devices. Take the fleet to be a hospital network's infusion pumps: a few thousand units, mixed hardware revisions and firmware versions, deployed across sites that differ in ambient conditions and in which consumables they are paired with. When a unit deviates from expected behaviour, the system has to make a routing decision: file the case as a recurrence of a known fault, so the existing runbook and its fix apply, or escalate it as novel, so engineering starts from scratch. In general form that decision is a decision about whether the mechanism producing the deviation is the same mechanism as the one the known fault was written for. Fix the purpose accordingly: a criterion of mechanism-identity is adequate here just in case it supports that routing decision, from the evidence available at triage time (telemetry, event logs, firmware and consumable provenance, and at most a handful of cheap diagnostic interventions), under a strongly asymmetric loss, where a false recurrence that ships a fix which does not work is far worse than a false novelty that costs some engineering hours.

  What I want from you is the specification, not a survey. Write the desiderata that any criterion of same mechanism has to meet to be usable for this: the cases it must get right, the distinctions it must not collapse, the phenomena it must accommodate, with the case or consideration behind each. Mark which requirements are non-negotiable given the purpose I have fixed and which are preferences of one camp dressed up as requirements; I would rather have three genuine desiderata plus an honest list of prejudices than fifteen items nobody disagrees about. Then identify any pair of requirements you think cannot be jointly satisfied, and say which single requirement excludes the most candidate accounts. That conflict section is the part I most want.

  To keep the list honest, here is the docket it has to handle, and I would like each requirement traceable to one of these or to a case of your own construction:

  - occlusion alarms fire late on two units. In the first, the cause is pressure-sensor calibration drift. In the second, the sensor is in spec but a stiffer tubing lot changes the pressure profile, so the same downstream pathway is triggered by a different upstream condition.
  - a third unit alarms late because a firmware update changed the alarm-threshold constant. The sensor physics is untouched. Does the threshold belong to the mechanism or to its setting?
  - a fourth unit alarms late only under a conjunction: high altitude plus a partially occluded line plus a specific pump rate. No single known mechanism covers it and none of the factors alone produces the anomaly.
  - in a fifth unit, two independent safety checks would each have caught the fault and both were degraded. Which mechanism is the one, and what does the criterion do when the answer looks overdetermined?
  - the runbook for the known fault was written from forty prior cases that shared a signature but, on later review, split into at least two distinct aetiologies. The reference class is not itself a mechanism type.

  Four wrinkles I think the standard discussion underweights, and which I want the requirements forced to confront rather than quietly assumed away. First, sameness here is relational and cross-instance: the two mechanisms never shared a spatiotemporal career, so any requirement that tacitly imports diachronic persistence intuitions should be flagged as inapplicable rather than satisfied or violated. Second, mechanisms have logical structure: conjunctive chains and disjunctive or redundant ones behave differently under masking and overdetermination, so the criterion should say whether it returns a single verdict, a set of candidate mechanisms, a graded one, or is permitted to abstain, given the asymmetric loss. Third, the mechanism/environment boundary is itself at issue, since some mechanisms only close their feedback loop under conditions the environment supplies, and a case can sit exactly on the boundary. Fourth, drift and part-substitution are continuous: the criterion owes an account of how much parameter drift or component replacement re-identification survives, whether that is a threshold on some similarity metric, and if so whose, or whether identity is primitive and these cases are simply vague.

  Finally, and briefly, score four candidate families against the list: identity of observable signature, causal or spatiotemporal continuity, sameness of parts plus organization, and sameness of counterfactual profile under interventions. A short table is fine and I will weight it lightly; the criteria are the deliverable. Do not give me citations, bibliographies, or reading lists, and do not lean on how any named author put things: argue from the cases.
reasoning: |-
  We are specifying desiderata for a criterion of mechanism-identity for an anomaly-triage system in a fleet of infusion pumps. The purpose is to route an anomaly either as a recurrence of a known fault (with an existing runbook) or as novel (requiring new engineering). The loss is asymmetric: false recurrence (applying a fix that doesn't work) is worse than false novelty (wasting engineering hours).

  The criterion must be based on evidence available at triage time: telemetry, event logs, firmware and consumable provenance, and a few cheap diagnostics.

  We have a docket of cases to handle and some wrinkles that must be confronted.

  First, let's extract the requirements from the docket and the wrinkles.

  Docket Cases:

  1. **Occlusion Alarms Late (Two Units):**
     - Unit 1: Pressure-sensor calibration drift (sensor out of spec).
     - Unit 2: Stiffer tubing lot (environmental change) leading to a different pressure profile but same downstream pathway (alarm condition) triggered.
     - Requirement: The criterion must distinguish between a mechanism that is broken (sensor drift) and one that is functioning as designed but in a changed environment (stiffer tubing). However, note that the downstream effect (alarm condition) is the same. The system must not collapse these two because the fix for sensor drift (recalibration) won't work for the stiffer tubing (which might require a different threshold or tubing change). So, we require that the criterion must be sensitive to the *internal state* of the mechanism (whether the sensor is in spec or not) and not just the output. But note: the evidence might not directly show the sensor is out of spec without a diagnostic. So, the requirement must also account for what evidence is available.

  2. **Firmware Update Alters Threshold:**
     - Unit 3: Firmware update changes the alarm-threshold constant. The sensor physics is the same.
     - Question: Is the threshold part of the mechanism or just a setting?
     - Requirement: The criterion must account for the fact that a change in a software setting (even if intentional) can cause the same observable anomaly (late alarm) but via a different mechanism? Or is it the same mechanism with a new parameter? Note that if the runbook for the prior fault (say, due to sensor drift) recommends recalibration, that won't fix a firmware issue. Therefore, we must consider the threshold setting as part of the mechanism? Or perhaps the mechanism is defined at a level that abstracts the threshold? This case forces us to define the boundaries of the mechanism: if the mechanism is the entire causal chain from the physical pressure to the alarm, then the threshold is part of it. But if the mechanism is the physical sensor and its calibration, then the threshold is a setting. We require that the criterion must be able to handle changes in software parameters as potential mechanism changes. However, note that a firmware update is a known change, so the provenance (firmware version) is available. Requirement: The criterion must be sensitive to changes in the system configuration (like firmware) that alter the functioning of the mechanism.

  3. **Conjunction of Factors:**
     - Unit 4: Late alarm only under high altitude, partially occluded line, and specific pump rate. No single known mechanism covers it.
     - Requirement: The criterion must be able to recognize that this is a novel mechanism because it is a new combination of factors that were previously known but not in this conjunction. It must not force it into an existing runbook that only addresses one of the factors. We require that the criterion must not require that a mechanism be decomposable into independent factors but must recognize conjunctive mechanisms as distinct.

  4. **Overdetermined Fault:**
     - Unit 5: Two independent safety checks are degraded, and either alone would have caused the fault. Which one is the mechanism?
     - Requirement: The criterion must be able to handle overdetermination. It should not require that there be a unique mechanism. It might need to return a set of candidate mechanisms (so that the runbook for either might be applied? but note: if we apply one runbook and it fixes one check, the fault might still occur because the other is degraded). Alternatively, the system might need to treat this as a novel case because the existing runbooks are for each check separately and not for both. We require that the criterion must be able to abstain or return multiple candidates when overdetermined, and the routing decision must account for the asymmetric loss (if we route as recurrence and apply one fix, it might not work because the other is broken, leading to a false recurrence). Thus, the criterion must be designed so that in overdetermined cases, it does not force a single recurrence unless both are covered by the same runbook? But note: the known faults are for each degraded check separately. So, we require that the criterion must not collapse multiple independent mechanisms into one, and must be able to recognize when a fault is caused by a combination of mechanisms that are individually known but not together.

  5. **Reference Class Problem:**
     - The runbook for a known fault was written from 40 prior cases that shared a signature, but later split into two distinct aetiologies.
     - Requirement: The criterion must not rely solely on the observable signature because two different mechanisms can produce the same signature. We require that the criterion must be based on the underlying mechanism and not just the symptoms.

  Wrinkles:

  1. **Sameness is relational and cross-instance:** No diachronic persistence. The criterion must not require that the mechanisms are the same physical object over time.

  2. **Logical structure of mechanisms:** The criterion must account for conjunctive, disjunctive, and redundant structures. It must specify the form of the verdict (single, set, graded, abstention). Given asymmetric loss, we might prefer to abstain or mark as novel when in doubt (to avoid false recurrence). But note: if we mark as novel too often, we incur engineering costs. However, the loss is asymmetric, so we might set a high bar for recurrence.

  3. **Mechanism/environment boundary:** The criterion must be able to handle cases where the environment is integral to the mechanism (like the tubing in case 2). It must not assume a fixed boundary.

  4. **Continuity of drift and substitution:** The criterion must provide an account of how much change is allowed before identity is lost. It cannot require exact numerical identity because of drift. It might use a similarity metric, but whose? And how is the threshold set?

  Now, we derive the desiderata. We mark non-negotiable (N) vs. preferences (P). Note that preferences might be driven by the asymmetric loss.

  Desiderata:

  1. **Sensitivity to Internal State (N):** The criterion must be able to distinguish between a mechanism that is malfunctioning (e.g., sensor drift) and one that is functioning as designed but in a changed environment (e.g., stiffer tubing). This is non-negotiable because failing to do so leads to false recurrence (applying a recalibration fix for a sensor that is in spec won't work). [From Case 1]

  2. **Configuration Sensitivity (N):** The criterion must account for changes in system configuration (like firmware version) that alter the behavior of the mechanism. A change in firmware that alters a threshold constant must be considered as a potential change in the mechanism, because the same physical sensor with a different threshold is a different causal setup. [From Case 2 and Wrinkle 3]

  3. **Conjunctive Mechanisms (N):** The criterion must recognize a conjunctive mechanism (requiring multiple factors) as distinct from any one of its factors. This is non-negotiable because applying a runbook that addresses one factor may not resolve the issue (and thus lead to false recurrence). [From Case 3]

  4. **Handling Overdetermination (N):** The criterion must not force a unique mechanism when the fault is overdetermined. It should be able to return multiple candidate mechanisms or abstain. Given the asymmetric loss, in such cases it is safer to escalate as novel (to avoid false recurrence) unless there is a runbook that covers the combination. But note: we don't have a runbook for the combination. So, the requirement is that the criterion must not misclassify an overdetermined case as a recurrence of a single mechanism. [From Case 4]

  5. **Not Signature-Based (N):** The criterion must not rely solely on the observable signature (symptoms) because different mechanisms can produce the same signature. It must use additional evidence (provenance, diagnostics) to infer the mechanism. This is non-negotiable because of the reference class problem (Case 5). [From Case 5]

  6. **No Diachronic Persistence (N):** The criterion must not require that the mechanisms are the same physical entity over time. This is non-negotiable because we are comparing across distinct devices. [From Wrinkle 1]

  7. **Explicit Verdict Form (N):** The criterion must specify the form of the verdict: whether it is a single mechanism, a set, a graded verdict (probability), or allows abstention. Given the asymmetric loss, abstention (or marking as novel) in ambiguous cases is preferred to avoid false recurrence. We require that the criterion must allow for abstention (or a "novel" verdict) when the evidence is insufficient to confidently assign to a known mechanism. [From Wrinkle 2 and the asymmetric loss]

  8. **Environment-Mechanism Boundary Agnosticism (N):** The criterion must not assume a fixed boundary between the mechanism and the environment. It must be able to handle cases where the environment is an integral part of the mechanism (as in Case 1, Unit 2). [From Wrinkle 3]

  9. **Handling Drift and Substitution (P):** The criterion should provide a principled way to handle gradual drift and component substitution. This is a preference because it is necessary for real-world deployment, but the exact threshold might be context-dependent. We prefer an account that uses a similarity metric (but we must specify on what basis) and a threshold that can be set to reflect the asymmetric loss (so that we err on the side of novelty when drift is too great). [From Wrinkle 4]

  Now, we look for conflicts.

  Conflict 1: 
  - Requirement 1 (Sensitivity to Internal State) and Requirement 8 (Environment-Mechanism Boundary Agnosticism) might conflict because in Case 1, Unit 2, the stiffer tubing (environment) is causing the problem, but the internal state (sensor) is in spec. How do we draw the line? The criterion must be able to say that the mechanism in Unit 2 is different from Unit 1 without having to decide whether the tubing is part of the mechanism or environment. This is possible if we take a holistic view of the causal process. But note: the evidence might not include the tubing lot without a diagnostic. So, the conflict is about what evidence is available.

  Conflict 2:
  - Requirement 3 (Conjunctive Mechanisms) and Requirement 4 (Handling Overdetermination) might seem to conflict because they both deal with multiple factors. However, conjunctive mechanisms require all factors to be present (so it's a new mechanism) while overdetermination has multiple factors each sufficient (so multiple known mechanisms). The criterion must distinguish between these two. But note: in the overdetermination case, we have two independent mechanisms that are both broken, each of which is a known fault. The conjunctive case is a new mechanism that requires the combination.

  Conflict 3:
  - Requirement 2 (Configuration Sensitivity) and Requirement 9 (Handling Drift) might conflict because a firmware update is a discrete change, but what about a series of small updates? If we require exact configuration match, then every update would make it novel. But we might want to treat minor firmware updates as not changing the mechanism. This is where drift comes in.

  The most challenging requirement is Requirement 9 (Handling Drift and Substitution) because it requires a similarity metric and a threshold, and we have to define what is similar enough. This requirement might exclude many candidate accounts that rely on exact matches (like same parts and organization without tolerance).

  Now, we score four candidate families:

  1. **Identity of Observable Signature:**
     - Fails Requirement 5 (Not Signature-Based) because it relies solely on symptoms. Also, fails Case 5 (reference class problem). It would collapse Case 1 (both units have the same signature) and Case 2 (same signature from threshold change). So, it would cause false recurrences. Not acceptable.

  2. **Causal or Spatiotemporal Continuity:**
     - Fails Requirement 6 (No Diachronic Persistence) because continuity is diachronic. Also, in cross-instance comparison, there is no continuity. Not applicable.

  3. **Sameness of Parts plus Organization:**
     - This is a structural criterion. It might work if we include the firmware as a "part". But:
       - Case 1, Unit 2: The parts (sensor) are the same and in spec, but the environment (tubing) is different. If we don't include the tubing as part of the mechanism, then we might say same mechanism (but then false recurrence). If we include the tubing, then it's a different part and thus a different mechanism. But the tubing is a consumable, not a part of the pump? This is where the boundary issue (Requirement 8) comes in. Also, Case 2: Firmware update changes a part (software) so it's a different mechanism. That might be acceptable. Case 3: The parts and organization might be the same, but the conjunction of environmental factors is not captured. Case 4: If both safety checks are parts of the pump, then we have two parts that are broken. But the organization is the same? The criterion would say the mechanism is the same as when one of them is broken? But that would be wrong because the runbook for one might not fix the other. Also, it would not capture the overdetermination. Case 5: The parts and organization might be the same in two distinct aetiologies? So, it fails to distinguish. Also, Requirement 9: Drift in a part (e.g., sensor calibration) is not a change of part, so it would be considered the same? But that might be acceptable if the drift is within the same mechanism. However, if the drift is the fault (as in Case 1, Unit 1), then we want to classify as recurrence of the known fault (sensor drift). But then for Unit 2 (stiffer tubing) we don't have a part change? So we might misclassify.

     This candidate has trouble with the environment and with overdetermination.

  4. **Sameness of Counterfactual Profile under Interventions:**
     - This means: two mechanisms are the same if they respond the same way to the same interventions. For example, if we recalibrate the sensor, does the problem go away? If yes, then it's the same as the known fault (sensor drift). In Unit 2, recalibration wouldn't help, so it would be different. In Unit 2, changing the tubing might help. In Case 2: If we change the threshold back (via firmware), does it fix? Then it's the same mechanism? But note: the known fault (say, sensor drift) is fixed by recalibration, but the threshold issue is fixed by a firmware change. So, the counterfactual profile is different. Case 3: The conjunction might require a combination of interventions. If no known mechanism requires that combination, then it would be novel. Case 4: For an overdetermined fault, an intervention that fixes one safety check might leave the fault still happening (because the other is broken). So, the profile is different from when only one is broken. Case 5: Two mechanisms might have the same observable signature but respond differently to an intervention (e.g., one is fixed by recalibration, the other by replacing the sensor). So, they would be distinguished.

     However, note: we can only perform a few cheap interventions at triage. So, the counterfactual profile is only partially observable. But we can use the available evidence (like: the sensor calibration is in spec) to infer the counterfactual. Also, the criterion might require running interventions that we haven't done. But we can use the available data (provenance, logs) to simulate interventions? For example, if we know the firmware version changed, we know that changing it back would be an intervention. But we might not have done it.

     This candidate satisfies many requirements but might be limited by the evidence.

     - Requirement 1: Satisfied because the intervention (recalibration) would fix Unit 1 but not Unit 2.
     - Requirement 2: Satisfied because changing the firmware back would fix Unit 3.
     - Requirement 3: Satisfied because the conjunctive case would require a combination of interventions.
     - Requirement 4: Satisfied because an intervention that fixes one check in Unit 5 might not fix the fault (if the other is broken), so the profile is different from a single fault.
     - Requirement 5: Satisfied because counterfactual profile is not just the signature.
     - Requirement 6: Satisfied because it doesn't require continuity.
     - Requirement 7: We can design the verdict to be graded (probability that the known interventions would fix) and set a threshold for recurrence. If the probability is high, we route as recurrence. If not, we escalate. We can abstain when the evidence is insufficient to estimate the counterfactual.
     - Requirement 8: Satisfied because the environment is part of the counterfactual: an intervention might change the environment (e.g., replace tubing) and we can see if that fixes.
     - Requirement 9: Drift and substitution can be handled by the counterfactual profile: if the response to interventions is similar, then it's the same. We can define a similarity metric on the counterfactual profile.

     The main challenge is that we cannot test all interventions. We have to infer from available data.

  Given the above, we summarize the requirements and the candidate scores.

  Final Requirements List (Non-negotiable marked N, Preference P):

  1. (N) Sensitivity to Internal State: Must distinguish between internal malfunction and environmental changes that produce the same symptom.
  2. (N) Configuration Sensitivity: Must account for changes in system configuration (e.g., firmware) as potential mechanism changes.
  3. (N) Conjunctive Mechanisms: Must recognize conjunctive mechanisms (requiring multiple factors) as distinct.
  4. (N) Handling Overdetermination: Must not force a unique mechanism when overdetermined; must allow for multiple candidates or abstention.
  5. (N) Not Signature-Based: Must not rely solely on observable symptoms.
  6. (N) No Diachronic Persistence: Must not require spatiotemporal continuity.
  7. (N) Explicit Verdict Form: Must allow abstention (or marking as novel) in ambiguous cases to avoid false recurrence.
  8. (N) Environment-Mechanism Boundary Agnosticism: Must not assume a fixed boundary.
  9. (P) Handling Drift and Substitution: Should provide a principled way to handle gradual changes.

  Conflict: Requirement 9 (Handling Drift) is the most excluding because it requires a similarity metric and threshold, and many accounts (like exact structural match) cannot handle it naturally.

  Candidate Scores:

  | Candidate Family                     | Score (out of 9) | Notes |
  |--------------------------------------|------------------|-------|
  | Observable Signature                 | 0                | Fails requirements 1,2,3,4,5,8,9. Only might satisfy 6 and 7 by default. |
  | Causal/Spatiotemporal Continuity     | 1                | Only satisfies 6? (because it's inapplicable, so trivially satisfies no persistence) but fails 1-5,7,8,9. |
  | Sameness of Parts plus Organization  | 3-4              | Might satisfy 2 (if firmware is a part), 6, and 9 (if we allow similar parts). But fails 1 (if environment is not a part), 3 (conjunctive factors might not be parts), 4 (overdetermination: two broken parts might be seen as two mechanisms, but the criterion might require exact match of the broken part to a known one? Then it might work if we have a runbook for each part. But then applying one runbook might not fix the overdetermined fault, so we must not route as recurrence for a single runbook. The criterion must recognize that the fault is caused by two broken parts and that is not covered by any single runbook. So, it must abstain or mark as novel. But the structural criterion doesn't naturally do that.) Also fails 5 (if two aetiologies have the same parts and organization). |
  | Counterfactual Profile               | 8-9              | Satisfies all non-negotiable requirements and can handle drift (preference) by similarity of counterfactual responses. The challenge is evidence availability. |

  Thus, the counterfactual profile is the most promising, but its implementation must be feasible with the available evidence.
answer: |-
  Below is the specification of desiderata for a criterion of mechanism-identity in your anomaly-triage system, derived from your docket cases, wrinkles, and asymmetric loss function. Requirements are labeled **Non-negotiable (N)** if essential for routing accuracy under asymmetric loss, or **Preference (P)** if reflecting pragmatic or contextual biases. Conflicts are identified, and candidates are scored per your instructions.

  ---

  ### **Desiderata for Mechanism-Identity Criterion**
  1. **Distinguish intrinsic failure from environmental induction (N)**  
     *Case trace*: Occlusion alarms (Case 1). Unit 1 (sensor drift) is an intrinsic failure; Unit 2 (stiffer tubing) is a valid mechanism triggered by environmental change.  
     *Rationale*: A false recurrence here applies a sensor-calibration fix to an environmentally induced fault, which fails. The criterion must separate failures *of* the mechanism from failures *via* the mechanism’s unchanged operation in a novel environment.  
     *Non-negotiable*: False recurrence (applying the wrong fix) is catastrophic.

  2. **Treat configuration parameters as mechanism-defining (N)**  
     *Case trace*: Firmware-updated threshold (Case 2). The threshold is part of the mechanism, not a "setting."  
     *Rationale*: Changing the threshold alters the causal logic (e.g., input-output mapping) of the mechanism. A runbook for sensor drift won’t fix a threshold error.  
     *Non-negotiable*: Configuration changes (e.g., firmware) are common and materially alter causation.

  3. **Recognize conjunctive mechanisms as novel (N)**  
     *Case trace*: High-altitude conjunction (Case 3). No single factor suffices; the anomaly requires a new combination.  
     *Rationale*: Applying a runbook for one factor (e.g., altitude) ignores the conjunction, likely failing to resolve the issue.  
     *Non-negotiable*: Loss asymmetry demands novel escalation for irreducibly composite causes.

  4. **Abstain or escalate (never force) in overdetermination (N)**  
     *Case trace*: Degraded safety checks (Case 4). Both failures are sufficient causes; neither uniquely "is" the mechanism.  
     *Rationale*: Routing as a recurrence of one check risks the fix failing (due to the other persisting). Abstention/escalation avoids false recurrence.  
     *Non-negotiable*: Forcing a verdict invites high-cost errors under asymmetric loss.

  5. **Reject signature-based identity (N)**  
     *Case trace*: Split-aetiology reference class (Case 5). Shared symptoms mask distinct mechanisms.  
     *Rationale*: Symptom identity (e.g., "late alarm") is insufficient; underlying causes differ. Reliance guarantees false recurrences.  
     *Non-negotiable*: Core to routing accuracy; signatures are proxies, not mechanisms.

  6. **Exclude diachronic persistence (N)**  
     *Wrinkle trace*: Cross-instance comparison (Wrinkle 1). Mechanisms lack spatiotemporal histories.  
     *Rationale*: Criteria importing "same physical object" intuitions (e.g., continuity) are inapplicable to fleet devices.  
     *Non-negotiable*: Violation misaligns the criterion with the problem domain.

  7. **Output graded verdicts or abstention (N)**  
     *Wrinkle trace*: Logical structure (Wrinkle 2) and asymmetric loss.  
     *Rationale*: Binary verdicts fail overdetermination (Case 4) or marginal cases (e.g., drift). Graded confidence (e.g., probability) allows routing to escalate near ambiguity thresholds, minimizing false recurrences.  
     *Non-negotiable*: Necessary to handle logical complexity and loss asymmetry.

  8. **Admit environment-mechanism boundary fluidity (P)**  
     *Wrinkle trace*: Feedback loops (Wrinkle 3).  
     *Rationale*: Environment-dependent mechanisms (e.g., Case 1 Unit 2) require incorporating external factors (e.g., tubing) when integral to causation.  
     *Preference*: Leans toward engineering pragmatism (environment as mechanism extension) over pure philosophical demarcation.

  9. **Define drift/substitution tolerance via similarity metrics (P)**  
     *Wrinkle trace*: Continuous changes (Wrinkle 4).  
     *Rationale*: Exact identity is unrealistic; a thresholded similarity metric (e.g., causal effect size) allows "same mechanism" declarations for minor drift.  
     *Preference*: Reflects operational need for parsimony, but metric choice (whose?) is subjective.

  ---

  ### **Conflicts Between Requirements**
  - **Conflict 1: (7) Graded verdicts/abstention vs. (3) Conjunctive mechanisms as novel**  
    Conjunctive mechanisms (3) demand novel escalation, but graded verdicts (7) might assign high recurrence-confidence to a subset of factors (e.g., if two factors match known faults). This risks false recurrence if the runbook only addresses one factor.  
    *Resolution*: (3) dominates; conjunctive cases must always escalate unless a conjunctive runbook exists. Graded confidence applies only to non-conjunctive cases.

  - **Conflict 2: (8) Boundary fluidity vs. (1) Intrinsic vs. environmental**  
    (8) blurs mechanism/environment distinctions, but (1) requires sharp separation to avoid misrouting (e.g., Case 1 Unit 2).  
    *Resolution*: (1) dominates; environmental induction must be distinguishable even if the boundary is fluid (e.g., via interventionist tests).

  - **Most Excluding Requirement**: **(1) Distinguish intrinsic failure from environmental induction**  
    This excludes candidates that cannot isolate mechanism-internal states (e.g., sensor calibration) from external triggers (e.g., tubing). It demands evidence of causal origin (e.g., diagnostics), not just symptoms or configurations.  
    *Excluded candidates*: Signature-based and parts-organization criteria (if parts exclude environment).

  ---

  ### **Candidate Family Scores**
  Scored against non-negotiable requirements (1–7).  ✓ = Satisfies, ✗ = Fails, ~ = Partially/contextually.

  | Candidate Family               | Score (✓/7) | Critical Failures |
  |--------------------------------|-------------|-------------------|
  | **Observable signature**       | 0/7         | ✗ (5) Signature-based identity fails Case 5. ✗ (1) Cannot separate intrinsic vs. environmental (Case 1). ✗ (4) Forces verdicts in overdetermination. |
  | **Causal/spatiotemporal continuity** | 1/7       | ✗ (6) Diachronic persistence is inapplicable (Wrinkle 1). ✗ (1) No cross-instance discrimination (Case 1). ~ (4) Continuity might resolve overdetermination but fails fleet contexts. |
  | **Sameness of parts + organization** | 3/7       | ✗ (1) Misses environmental induction (Case 1 Unit 2: same parts, different environment). ✗ (8) Rigid boundary causes false recurrences. ~ (2) Firmware is a "part," but substitutions (Wrinkle 4) are unhandled. |
  | **Sameness of counterfactual profile** | **6/7**  | ✓ (1) Interventions reveal intrinsic vs. environmental (e.g., recalibration fixes drift but not tubing). ✓ (3) Conjunctions have distinct counterfactuals. ✓ (4) Overdetermination yields ambiguous interventions → abstention. ✓ (5) Profiles differ despite same symptoms (Case 5). ✗ (9) Similarity metric for drift is underspecified (but negotiable). |

  **Summary**:  
  - **Counterfactual profiles** dominate, failing only drift similarity (a preference). They handle asymmetry via interventionist tests (e.g., "If we recalibrate, does it fix?").  
  - **Parts-organization** fails environmental induction and boundary fluidity.  
  - **Signature/continuity** are non-starters.  
  - **Drift tolerance** is the weakest link; no candidate fully resolves it without ad hoc thresholds.  
  - **Key gap**: Evidence limitations (e.g., few interventions) challenge counterfactual inference. This necessitates telemetry-based proxies (e.g., pressure-profile shapes in Case 1).  

  No citations; argued from cases.
