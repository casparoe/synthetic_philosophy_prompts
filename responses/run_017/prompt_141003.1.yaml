prompt: |-
  Hey — I'm in a tiny reading group that's slowly making its way through the longtermist cluster of ideas (existential risk, the 'most important century' framing, the hinge of history hypothesis), and we got completely stuck on it last night, so I want an outside number rather than another round of us repeating ourselves.

  The claim I want a credence on, stated as precisely as I can manage, is this: H = the difference in expected long-run value between the best and the worst trajectories that agents alive over the next ~100 years could *realistically steer onto* is larger than the total value of everything that happened in the ~200,000 years of human history up to now. I baked in two bits of wording delibertly, because I think that's where the real fight is. First, 'realistically steer onto' rather than 'physically possible': call that the attainable hinge as opposed to the variational hinge. The variational version only needs the future to be enormous and sensitive to small perturbations, which looks close to trivially true once you grant an astronomically large and chaotic future, whereas the attainable version needs us to actually be able to aim, and to have some rough idea which direction is up. Second, I want the comparison to be against the value of the entire past rather than just 'very large', otherwise the claim has no real content. My own credence in H is around 0.5; a friend in the group, who is much more skeptical of the whole framework, is at about 0.15, and I genuinely can't tell whether the two of us disagree about the future or about what the sentence means.

  So please give me your credence in H, decomposed — and don't just tell me it depends on your population ethics or your theory of value, I want numbers with one line of justification each. The terms I'd want included, plus whatever you think I've left out: (1) the probability that the long-run future holds astronomically more value and disvalue than the whole of the past, i.e. that we're nowhere near the end, not in some cul-de-sac where things fizzle out, and the future isn't going to be small or empty; (2) the probability that the value of that future is strongly sensitive to what happens in roughly this century, the trajectory-locking idea — whether the risk of an existential catastrophe or of locking in some stable bad outcome this century is anywhere near the one-in-six-ish figures people throw around, and whether the upside is comparably large; (3) conditional on 1 and 2, the probability that the *attainable* spread is close to the variational spread, i.e. that we're steering rather than passengers on something already locked in or driven by forces nobody controls; (4) how much of that spread survives once you factor in the cluelessness worry — that our uncertainty about which trajectory is actually good might make deliberate attempts at steering roughly cancel out in expectation anway; and (5) the dilution question, whether hinge-ness at the level of 'humanity this century' translates into anything at all for what one person or one small grantmaking group should do, or whether marginal influence gets diluted down to noise. Then show me roughly how you're combining those into the headline number (I don't need careful arithmetic, just enough that I can see the shape of it), tell me which single term your number is most sensitive to, which of those two people at 0.5 and 0.15 you think are most likely disagreeing about, and what sort of evidence or argument would move your number the most.

  One more thing: say how confident you are in the verdict overall, and single out the one sub-claim you'd be least willing to defend if someone pushed back on it hard.
