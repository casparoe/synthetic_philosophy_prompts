prompt: |-
  Hi — I'm a PhD student in political theory (my dissertation is somewhere in the neighbourhood of state responsibility for foreseeable harms, which is apparently why I got drafted onto this thing), and I sit on the emergency-classification panel for a mid-sized humanitarian coalition. We have to decide how to label one unfolding crisis before the appeal goes out next week, and I'm the person who has to write the memo. The case: a real, measurable rainfall failure across the northern highlands of Bhera — three failed seasons, satellite data and the national met office both confirm it, so nobody is disputing that there is a genuine food-availability drop. But the mortality is almost entirely concentrated among transhumant herders in one district, because grain prices roughly tripled while livestock prices collapsed; farming households two valleys over, with the same rainfall failure, are coping. Meanwhile the government kept its grain procurement quota running to honour an export contract, restricted movement of people and animals into the district citing an insurgency in a different province, turned away the journalists who tried to get in, and sat on its own agriculture ministry's early-warning memo for about six weeks. It is also midway through a fiscal programme that caps its spending, and half the cabinet would probably say they were just managing a budget. So: is this a natural disaster, a political crime, or something else, and what do we actually put on the appeal?

  The room is split in ways I can't adjudicate by instinct. Our emergencies coordinator wants a 'natural disaster' label because it unlocks the pooled disaster fund, keeps the government cooperative enough to let our convoys through, and donors give generously to droughts; she thinks calling it a crime gets us expelled within a month. Our advocacy director wants 'man-made famine' and an explicit call for accountability, on the grounds that the drought explains a harvest shortfall but not who died, and that if we describe it as weather we launder a set of decisions. Our lawyer notes that 'crime' invites questions we can't answer — who exactly, with what intent, under what jurisdiction — and worries about making claims we'd retract later. Everyone keeps gesturing at the usual examples (Bengal in 1943, Ireland in the 1840s, the Great Leap Forward), but they're being used as slogans rather than as arguments, and my sense is that this case doesn't map cleanly onto any of them, since the trigger really is climatic even if the mechanism of death looks like an entitlement collapse. I think the thing I most need is a cleaner set of distinctions than the room has: whatever separates the cause of the shortfall from the cause of the mortality, whatever we should be comparing the government to, and whether 'crime' can be made to work when the state's failure looks more like culpable indifference under fiscal constraint than like a plan.

  So: draft the committee's decision memo, addressed to the board, that recommends one concrete label and one line to take publicly — with whatever conditions, caveats, or sequencing you think are needed (e.g. disaster framing now, accountability findings later, or vice versa) — and give reasons the people in the room could actually push back on rather than a lecture. Don't give me a bibliography; the board won't read one. Please engage the strongest version of whichever position you're rejecting — I'd guess that's the access-and-funding argument if you go with 'crime', or the laundering/decriminalisation argument if you go with 'disaster' — and be explicit about which factual uncertainties are load-bearing for your recommendation, since we could in principle send someone to find them out before Thursday. And add a short closing section on what would change the memo's mind: what finding about the government's information, intentions, or alternatives would flip the recommendation, and where you think the memo's reasoning is most likely to be wrong.
reasoning: |-
  Okay, let me unpack this complex humanitarian classification dilemma. The user is a political theory PhD student serving on an emergency panel, needing to label a crisis in Bhera where climatic drought interacts with governmental failures. 

  Hmm... the core tension is between operational pragmatism (disaster label for access/funding) and moral clarity (man-made famine for accountability). What makes this thorny is that the rainfall failure is indisputably natural, but the mortality pattern reveals political economy factors: grain export quotas during shortage, movement restrictions, and ignored warnings. 

  The user's hidden ask seems to be: how to frame this without either whitewashing state negligence or triggering expulsion. They need legally defensible distinctions between natural trigger and human amplification - exactly where their political theory background matters. 

  Right, first I should map the factual layers:
  - Environmental trigger: 3-season rainfall failure (verified)
  - Mortality mechanism: Entitlement collapse (herders hit by livestock crash + grain inflation)
  - Government actions: Export quotas, movement bans, suppressed warnings, fiscal constraints
  - Uncertainty gaps: State intent (malice vs incompetence? alternatives under fiscal cap?)

  The historical parallels being misused as slogans actually help diagnose what's distinct here: Unlike Bengal 1943 (war priorities) or Great Leap (ideological coercion), Bhera shows constrained indifference rather than active malice. That matters for labeling.

  For the memo structure, I'm considering:
  1. Lead with "complex humanitarian emergency" as category - sidesteps false binary
  2. Detail how natural cause + policy failure compound (with satellite/met data for credibility)
  3. Recommend phased approach: disaster funding now (with access strings attached), then panel for accountability
  4. Preempt pushback: To pragmatists - show how ignoring policy factors harms relief targeting; to idealists - explain why "crime" lacks legal basis currently

  The load-bearing uncertainties are crucial: If investigation finds the government deliberately suppressed warnings to benefit exporters, that shifts toward crime. If fiscal constraints were genuinely binding, it's systemic failure. 

  Biggest risk in my approach? The "complex" label might confuse donors. But clearer than over-simplifying. Should emphasize concrete next steps: deploy now, investigate simultaneously, revisit label in 60 days with new evidence.
answer: |-
  Here’s a draft decision memo addressing the core tensions, designed for board approval while preempting internal objections. The recommendation avoids false binaries but creates accountability pathways without immediate operational risk:

  ---

  **MEMORANDUM**  
  **TO:** Humanitarian Coalition Board  
  **FROM:** Emergency Classification Panel  
  **DATE:** [Current Date]  
  **SUBJECT:** Crisis Classification & Public Positioning: Northern Highlands, Bhera  

  ### I. Recommended Classification & Public Line  
  **Classification:** **"State-Exacerbated Climatic Famine"**  
  **Public Line:** *"A climate-driven food crisis has become a famine for marginalized herders due to market collapse and restrictions on movement and aid. Urgent humanitarian access is needed to prevent further preventable deaths."*  

  ### II. Rationale for Classification  
  1. **Distinguishing Trigger from Mortality Cause**  
     - **Trigger:** Objectively natural (verified rainfall failure).  
     - **Mortality Cause:** Policy-amplified entitlement collapse (grain exports + movement bans + price collapse).  
     *→ This avoids conflating natural causality with human responsibility for outcomes.*  

  2. **Operational Safeguards**  
     - **"Famine"** (IPC 5) is technically accurate for the affected district (catastrophic food insecurity + excess mortality).  
     - **"Climatic"** preserves disaster fund eligibility and donor appeal.  
     - **"State-Exacerbated"** signals accountability internally without public provocation.  

  3. **Accountability Sequencing**  
     - Phase 1 (Now): Focus on access negotiation using famine classification for leverage.  
     - Phase 2 (Parallel): Commission rapid policy audit (using leaked memos/WFP price data) to document state decisions.  
     *→ Public advocacy shifts to "man-made" only if audit confirms deliberate harm or viable alternatives existed.*  

  ### III. Addressing Key Objections  
  **To Emergencies Coordinator (Pragmatism):**  
  *"Calling this 'natural' launders responsibility and may worsen future crises. Using 'famine' + climatic framing unlocks the same funds while giving us leverage to demand access concessions (e.g., lifting movement bans). If expelled after this label, we would face expulsion under 'crime' faster."*  

  **To Advocacy Director (Accountability):**  
  *"Declaring a 'crime' now risks expulsion before delivering aid and lacks evidentiary rigor. This recommendation:  
  (a) Uses 'exacerbated' to establish state responsibility in internal documents,  
  (b) Mandates an evidence-based audit for future action,  
  (c) Publically highlights policy failures (market collapse, restrictions) without legally loaded terms."*  

  **To Legal Counsel (Risk):**  
  *"'State-exacerbated' implies negligence, not criminal intent, aligning with evidence (delayed memo response, fiscal constraints). 'Famine' is a technical term (IPC) based on outcomes, not attribution. We avoid legal overreach while documenting for potential IHRL mechanisms."*  

  ### IV. Critical Uncertainties & Investigative Priorities  
  **Load-Bearing Facts (Need Verification by Thursday):**  
  1. **Government alternatives under fiscal constraints:** Could grain quotas have been paused without default?  
  2. **Timeline of early-warning memo:** Was suppression deliberate or bureaucratic?  
  3. **Movement ban justification:** Is the insurgency claim verifiable?  

  *→ Deploy field team to collect: (a) Ministry of Finance contingency plans, (b) Memo circulation logs, (c) UN/OCHA insurgency assessments.*  

  ### V. Conditions for Reclassification  
  **Change to "Man-Made Famine" if audit finds:**  
  - Evidence that export quotas were maintained *despite explicit famine forecasts*.  
  - Proof movement bans targeted herders to weaken political opponents.  
  - Viable fiscal alternatives (e.g., emergency funds diverted elsewhere).  

  **Downgrade to "Climatic Disaster" only if:**  
  - Audit confirms all policy choices were fiscally unavoidable.  
  - Mortality spreads to farming valleys without discrimination.  

  ### VI. Where This Reasoning Is Most Vulnerable  
  **Weakest Point:** *If the state’s indifference stems from incapacity, not negligence, "exacerbated" may overstate agency. However, restricting aid access and suppressing warnings suggest actionable responsibility even under constraints.*  

  **Board Action Requested:** Approve classification and phased accountability protocol. Authorize rapid audit.  

  ---  

  ### Why this works:  
  - **Splits the difference:** "Famine" satisfies donors/operational needs; "state-exacerbated" preps accountability.  
  - **Forces evidence:** Audit shifts debate from ideology to facts.  
  - **Plausible deniability:** Public line focuses on outcomes ("preventable deaths") not blame.  
  - **Adaptive:** Labels evolve with findings, avoiding premature lock-in.  

  The core move: *Use technical classifications (famine/IPC) as Trojan horses for accountability.* This respects the climate trigger while treating policy as a mortality multiplier. If the state blocks the audit, their obstruction becomes the story.
