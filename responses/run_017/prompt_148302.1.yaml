  ### **Implementation Notes**
  - **Efficiency:** Officers prioritize speed—90 minutes/report. Deep dives deferred to evaluation unit.  
  - **Audit Trail:** One-page notes document each stage’s output, ensuring accountability.  
  - **Edge Cases:**  
    - **REFER Use:** Rare; only if lever’s charter-compliance is disputed (e.g., "Is civic education cultural?").  
    - **Overdetermination:** Uneliminated alternatives noted but don’t auto-fail claims—KILL CONDITION mitigates risk.  
  - **Systemic Bias:** Procedure favors institutional/geographic fixes over cultural/historical factors; auditors should review HOLD patterns annually.  

  This procedure transforms diagnostic ambiguity into auditable decisions while respecting your operational constraints. It explicitly flags non-actionable cultural/heritage factors, resists consultant gaming via staged evidence checks, and forces testable predictions with KILL CONDITIONS.
