  ### Triage Procedure for Kestrel Fund Country Diagnostics

  The following 90-minute triage procedure evaluates country diagnostic reports to determine funding actions. It incorporates your constraints: overdetermination, cause interaction, non-independent countries, mechanism-vs-narrative distinction, time lags, LEVER TEST, KILL CONDITION, and charter restrictions. Desk officers without econometrics training can execute it using only the report and procedure.

  ---

  #### **Procedure Workflow**
  1. **Claim Extraction (10 min)**  
     Identify the report's primary causal claim and evidence type. Discard ancillary claims.  
     *Output:* Primary cause, evidence type (natural experiment, comparative case, narrative), and strongest unaddressed alternative cause.

  2. **Actionability Filter (15 min)**  
     Apply LEVER TEST and TIME LAG TEST:  
     - **LEVER:** Is there a Kestrel-deployable instrument (<5 years) to move the cause? If not, classify as "heritage."  
     - **TIME LAG:** Will effects manifest within 5 years? If not, classify as "context."  
     - **CHARTER CHECK:** Does the lever involve changing culture? If yes, reject.  
     *Output:* "Lever" (actionable) or "Heritage/Context" (non-actionable).

  3. **Evidence Robustness (25 min)**  
     Assess:  
     - **MECHANISM:** Is the cause described as general (works across contexts) or narrative (fits only this timeline)?  
     - **COUNTERFACTUAL:** Does the report use a natural experiment, comparative case, or thought experiment?  
     - **ALTERNATIVES:** Is the strongest competing cause addressed?  
     *Rating:*  
     - Strong: Natural experiment + mechanism + alternatives addressed.  
     - Moderate: Comparative case/narrative + 2 of 3 criteria.  
     - Weak: Fails moderate threshold.  

  4. **Kill Condition Assignment (15 min)**  
     For claims passing Stage 3, define:  
     - Observable falsifying event within 5 years.  
     - Exact date for observation.  
     *Reject* if vague, distant, or untestable.  

  5. **Verdict Assignment (5 min)**  
     Assign based on prior stages:  
     - **FUND:** Strong evidence + lever + kill condition.  
     - **FUND-WITH-KILL-CONDITION:** Moderate evidence + lever + kill condition.  
     - **HOLD:** Weak evidence, no lever, cultural lever, or no kill condition.  
     - **REFER:** Disagreement on lever charter-compliance (values conflict).  

  ---

  ### **Worked Examples**

  #### **1. Vandara Report**  
  - **Claim:** Growth driven by institutions (1994 constitution), stalled by copper price crash.  
  - **Evidence:** Natural experiment (constitutional reform), addresses commodity prices as alternative.  
  - **Procedure:**  
    - Stage 1: Claim = "Institutions"; Evidence = "Natural experiment"; Alternative = "Commodity volatility" (addressed).  
    - Stage 2: **Lever** = District governance capacity-building; Not cultural; Effects observable in 3–4 years (e.g., revenue collection efficiency).  
    - Stage 3: **Strong** (mechanism general, natural experiment, alternatives addressed).  
    - Stage 4: **Kill condition** = "If district revenue transparency (measured by WB index) does not improve by ≥15% by Q3 2027."  
    - Stage 5: **Verdict = FUND** (strong evidence, clear lever).  
  - **Memo to Director:**  
    > "Vandara's diagnosis isolates institutions as a movable cause via district governance programs. Evidence from the 1994 natural experiment is robust, with commodity risks acknowledged. FUND with kill condition: Terminate if revenue transparency fails to improve 15% by Q3 2027."

  #### **2. Kalunda Report (Sembwe-Kalunda Pair)**  
  - **Claim:** Low trust (culture) prevented industrialization vs. Sembwe.  
  - **Evidence:** Comparative case (2016 trust surveys), argues trust preceded divergence.  
  - **Procedure:**  
    - Stage 1: Claim = "Culture"; Evidence = "Comparative case"; Alternative = "Unobserved institutional differences" (not addressed).  
    - Stage 2: **Lever** = Cultural change programs → *Rejected* (charter violation). Classified as "heritage."  
    - **Terminates at Stage 2**. Verdict = **HOLD** (non-actionable).  
  - **Uneliminated Alternative:** Colonial infrastructure path dependence (e.g., railway maintenance cycles not compared).  
  - **Memo to Director:**  
    > "Kalunda's cultural diagnosis is heritage under our charter. We cannot act on culture-focused levers. Recommend HOLD; explore institutional alternatives with Sembwe comparator."

  #### **3. Maroya Report**  
  - **Claim:** Institutions explain growth (ignores terms-of-trade windfall).  
  - **Evidence:** Narrative (no natural experiment/comparative case).  
  - **Procedure:**  
    - Stage 1: Claim = "Institutions"; Evidence = "Narrative"; Alternative = "Terms-of-trade windfall" (unaddressed).  
    - Stage 2: **Lever** = Public integrity program (actionable, non-cultural).  
    - Stage 3: **Weak** (no counterfactual, alternatives unaddressed).  
    - **Terminates at Stage 3**. Verdict = **HOLD** (insufficient evidence).  
  - **Memo to Director (for untouchable program):**  
    > "Maroya's diagnosis is insufficient: It fails to separate institutional effects from terms-of-trade windfalls and lacks counterfactual evidence. Our $40M program continues per policy, but new funding requires better diagnostics. HOLD verdict reflects evidentiary gaps, not program quality."

  ---

  ### **Procedure Weaknesses**  
  - **Judgment Calls Dressed as Procedure:**  
    - Stage 3 (Evidence Robustness): Distinguishing "general mechanism" from "narrative" requires contextual judgment.  
    - Stage 2 (Lever Permissibility): Charter compliance (e.g., "Is this cultural?") risks subjective relabeling.  
  - **Distinctions Officers May Misinterpret:**  
    - Natural experiment vs. coincidental timeline (Stage 1): Without theory, officers may confuse correlation with causation.  
    - Kill condition specificity (Stage 4): Officers may accept vague events (e.g., "governance improves") without measurable thresholds.  
  - **Systematic Misfires:**  
    - **Geographic/Historical Contexts:** Misreads countries where causes are path-dependent (e.g., landlocked nations with shared colonial railways) by overemphasizing mutable institutions.  
    - **Multi-Decadal Lags:** Rejects valid education/policy coherence causes by requiring 5-year observable effects.  
    - **Consultant Gaming:**  
      - "Natural experiments" gamed using cherry-picked events.  
      - Kill conditions gamed via untestable/overfitted events (e.g., "trust will rise if survey methodology changes").

  ---

