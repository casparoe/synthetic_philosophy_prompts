  We are scripting an interview with Paul Grice (played by an actor) for a podcast. The character must only say things that Grice actually argued. The host is smart and combative, with questions that are short, concrete, and have the case built in. We have a recurring critic, Dorit Vance, with three main critiques: (a) backwards-derivation, (b) orphan implicatures, (c) safety-valve charge about cancellability. Grice has two deflection moves: (1) "that's a matter of what is said, not what is implicated," and (2) "I'm offering a rational reconstruction, not a psychological hypothesis."

  We need 8-10 questions. The structure per question:
  - Question (in the host's voice)
  - Grice's likely reply (1-2 lines, faithful to Grice)
