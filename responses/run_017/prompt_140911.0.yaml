answer: |-
  Below is a complete, runnable in-class game designed to address your goals. It focuses on operational differences between the four minds (without using the labels), emphasizes *where selection happens* and *what dies*, and incorporates your probes. The game uses a grid-based "foraging world" with shifting rules to force trade-offs between inherited tools and adaptability.

  ---

  ### **Game Title: The Silent Garden**  
  *Premise:* Teams are "gardeners" seeking nectar (points) in a grid with hazards. The garden's rules change between "generations," forcing adaptation. Roles differ in *how* they test ideas and *what they lose* when wrong.

  ---

  ### **Materials & Setup**  
  - **Grid World:** A 5x5 grid drawn on the whiteboard. Label rows 1–5, columns A–E.  
    - **Fixed Hazard:** Always loses nectar (e.g., cell B2).  
    - **Shifting Rule:** Changes each generation (e.g., Gen 1: Nectar only in *odd-numbered rows*; Gen 2: Nectar only in *vowels (A,E)*).  
  - **Player Kits (per station):**  
    - **Darwinian:** Pre-commitment sheets (paper), pens, one "seed packet" (envelope with starting policy, e.g., "Always move right").  
    - **Skinnerian:** No special tools.  
    - **Popperian:** 3 "probe tokens" (colored paper clips) per player.  
    - **Gregorian:** "Lore packet" (envelope with inherited instructions), blank paper, pens, timer.  
  - **Scoring:** Nectar = candy (e.g., Skittles). 1 successful move = 1 candy. Hazard = lose 1 candy. Goal: Maximize candy.  
  - **Teams:** 24 students → 6 teams of 4. Each team plays two roles over two rounds (15 min/round).  

  ---

  ### **Stations & Rules**  
  Each station has a facilitator (you or a prepared instruction card). **Key constraint:** Players can only do what their role permits.  

  1. **Darwinian Cohort**  
     - **Operations:**  
       - Write a *full path* (e.g., "A1→A2→A3→B3") **before any moves**.  
       - Submit to facilitator, who runs the path silently, marking hazards/goals.  
       - If path fails (hazard or no nectar), the player "dies" and is replaced by a new player who:  
         - Mutates the path (change one move).  
         - Submits the new path (no feedback until full run).  
     - **What dies:** The *agent* (player) and their policy.  
     - **Prohibited:** Changing path after feedback.  

  2. **Skinnerian Cohort**  
     - **Operations:**  
       - Move one cell at a time.  
       - After **each move**, facilitator gives feedback: "nectar" (candy), "hazard" (lose candy), or "empty."  
       - Revise path after feedback.  
     - **What dies:** The *behavior* (move) that failed.  
     - **Prohibited:** Testing moves without acting.  

  3. **Popperian Cohort**  
     - **Operations:**  
       - Use probe tokens to test a move **without moving**.  
         - e.g., "If I go to B3, what happens?" Facilitator answers.  
       - Tokens are scarce (3/player for 15 min).  
       - After probing or moving, get feedback.  
     - **What dies:** The *hypothesis* (tested by probe).  
     - **Prohibited:** Sharing probes or hypotheses with teammates.  

  4. **Gregorian Cohort**  
     - **Operations:**  
       - Inherit a lore packet (e.g., "Nectar in rows 1,3,5").  
       - Can invent tools: maps, symbols, shorthand (e.g., "!" = hazard).  
       - At round end, transcribe lore *under noise* (facilitator distracts; 60 seconds).  
       - **Forced Lore Probe:** In Gen 2, must follow lore *exactly* for first 5 moves (no testing).  
     - **What dies:** The *tool* (if outdated lore causes failure).  
     - **Prohibited:** Ignoring lore during forced round.  

  5. **Solitary Popperian Probe (Station 3 Variant)**  
     - Half the Popperian team (2 players) are "solitary":  
       - Cannot speak or share probes.  
       - Isolates whether Gregorian leap is about language or accumulation.  
     - **Expected Outcome:** Solitary players accumulate less knowledge; teams with communication solve faster, showing language enables compounding.  

  ---

  ### **Timeline (75 Min Total)**  
  1. **Intro (5 min):**  
     - "You're gardeners in a shifting maze. Each team has different tools to find nectar. Goal: Maximize candy. Don't share strategies across teams."  
     - Assign teams to stations (no role names).  

  2. **Round 1 (15 min):**  
     - Teams play roles at 4 stations (1 Darwinian, 1 Skinnerian, 1 Popperian w/ solitary subgroup, 1 Gregorian Gen 1).  
     - World Rule (Gen 1): Nectar only in odd rows.  
     - Gregorians start with minimal lore (e.g., "Start at A1").  

  3. **Rotation (5 min):**  
     - Teams rotate stations. Gregorians transcribe lore (noisy, timed).  
     - Shift World Rule (Gen 2): Nectar only in vowel columns (A,E).  

  4. **Round 2 (15 min):**  
     - Teams play new roles. Gregorians (now Gen 2) use inherited lore + forced lore probe (first 5 moves strict).  
     - Solitary Popperians again split in Popperian station.  

  5. **Debrief (25 min):**  
     - **Step 1 (5 min):** Teams share highs/lows. *Surface frustrations:* "Why did we have to follow bad lore?" "Probes ran out too fast!"  
     - **Step 2 (10 min):** Map experiences to hierarchy (still no labels):  
       | Game Moment          | Hierarchical Concept                          |  
       |-----------------------|-----------------------------------------------|  
       | Darwinian "death"    | Whole agent/policy lost; selection across generations. |  
       | Skinnerian penalty   | Single move punished; selection within lifetime. |  
       | Popperian probe use  | Hypothesis tested internally; idea dies, not agent. |  
       | Gregorian forced lore| Tools inherited; selection on transmissible objects. |  
       | Solitary Popperians  | Language enables compounding; Gregorian ≠ just "smart." |  
       | Stale Gregorian lore | Tools can be maladaptive; they evolve independently. |  
     - **Step 3 (10 min):** Surface resistances & pitfalls:  
       - **Resistances to unpack:**  
         - *"We did Popperian things as Skinnerians!"* → Highlight: Skinnerians *had* to act to learn; Popperians avoided risk.  
         - *"Gregorian is cheating!"* → Ask: "Did lore always help? What if it was wrong?" (Tools ≠ intelligence).  
         - *"A Skinnerian with memory is Popperian."* → Contrast: Popperians *preempt* failure; Skinnerians adapt *after*.  
         - *"Why four levels?"* → Emphasize qualitative jumps (genes → behaviors → ideas → cultural objects).  
       - **Predictable Pitfalls:**  
         - Popperians burn probes early → becomes Skinnerian.  
         - Gregorians hoard lore → fails when rules shift.  
         - Confident students "game" rules (e.g., Darwinians write long paths) → dies faster.  
         - World too easy? Ensure shifting rules penalize inflexibility (e.g., Gen 2 lore from Gen 1 is harmful).  
       - **What the game CAN’T deliver:** Participants can’t *truly* experience non-Gregorian minds (they use language/abstraction by default). The rules are mechanical stand-ins for cognitive constraints. *State plainly:* "The game simulates design constraints, but real minds lack this self-awareness."  

  6. **Summary (1 min):**  
     - **Summary:** The session is supposed to make the students discover that each level in the hierarchy shifts the locus of selection (from organisms to behaviors to ideas to tools) and changes what is lost in failed trials.  

  ---

  ### **Probe Outcomes & Why**  
  - **Solitary Popperians:**  
    - *Outcome:* Solitary players score lower than communicative teammates; teams fragment.  
    - *Shows:* Gregorian leap isn’t just “accumulation” (Popperians accumulate internally). Language enables *shared* compounding, turning tools into collaborative infrastructure.  

  - **Forced Gregorian Lore:**  
    - *Outcome:* Gen 2 Gregorians suffer early losses (e.g., follow old lore to odd rows, but nectar is now in vowels).  
    - *Shows:* Tools are inherited constraints; they can steer you toward failure, and their evolution is independent of your needs.  

  ---

  ### **Tips for Success**  
  - **Facilitator Role:** Enforce rules strictly (e.g., Darwinians can’t revise paths). Intervene if Gregorians ignore lore.  
  - **World Design:** Use simple rules (odd/vowels) so shifts are clear. Add a second hazard if too easy.  
  - **Candy Incentive:** Low stakes, but tangible (students care more).  
  - **Debrief Focus:** Let resistances emerge naturally. Ask: "What *felt* different between roles?"  

  This design forces experiential learning: Students *live* the cost of rigid policies (Darwinian), the waste of trial-and-error (Skinnerian), the power of internal models (Popperian), and the double-edged sword of inherited tools (Gregorian). The probes isolate language and tool dependence, while the debrief links gameplay to theory.
