prompt: |-
  Hey — I'm on a small platform team and we keep having the same dumb argument about which of the things we're building actually count as "agents" as opposed to just tools with extra steps. Marketing of course wants to call everything an agent. I realized I have pretty firm gut feelings about specific systems, and they don't track the stakes at all, so I'm hoping you can dig out the principle I'm implicitly using — or tell me it's a mess and what a cleaner one would cost me.

  Here's my list, with how I actually feel (I've tried to make it a fair spread, and I've left out anything where I think I'd just be parroting a headline):

  1. A chess engine that ranks moves and I click the one I want. Tool, obviously fine.
  2. An LLM answering a question while calling a calculator, running some Python, and fetching a page mid-answer. Tool, fine — even though it's literally doing things in the world, it doesn't feel agent-y to me at all.
  3. Autocomplete that finishes whole functions, or whole paragraphs in my voice, as I type. Tool, fine.
  4. A coding agent handed a ticket, working in a scratch branch for three hours, running the test suite over and over, opening a PR at the end; I read the diff before anything touches main. This one feels like an agent, and I'm fine with it.
  5. The same coding agent, but it merges to main when CI is green and I find out from the changelog. Not fine — and it's not just "bugs might slip through", because I'd also be uneasy if I was confident the code was good. Something about it having acted rather than proposed is what bugs me.
  6. A trading bot executing small trades inside a written mandate (position limits, asset list), nobody approves individual trades, humans see daily P&L. Fine. Doesn't bother me even slightly, though real money moves and no human is in the loop.
  7. An assistant that replies to routine emails in my name — "got it", "Thursday works", that kind of thing — and shows me a log at the end of the day. Not fine. Makes me uncomfortable in a way #6 doesn't, and I can't pretend it's about the size of the consequences, because obviously it isn't.
  8. A support bot that can issue refunds up to a hundred bucks and email the customer about it, with humans auditing a random 5% afterwards. Not fine, and I notice it's the same shape as #7.
  9. A spam filter that silently deletes mail. Fine, obviously — even though deleting is about as hard to take back as sending.
  10. An NPC or dungeon master in a game that lies to the player. Fine, obviously.

  The principle I keep half-forming is something like an "unsend" test: a tool produces proposals that only bind when a human takes them up, an agent produces things that are already out in the world and cost something to take back. But that test gets #6 and #9 wrong by my own lights, so it can't be the whole thing. I also tried "could a competent user have predicted the output in advance" and that one dies immediately on #4. My other thought is that #6 is fine because the bot isn't speaking for anyone, while #7 and #8 are me being represented by something that isn't me — but I don't know how to state that without it collapsing into "acting in someone's name", which sounds too narrow to be the real line.

  So: give me the principle, or two or three candidates, stated precisely enough that I could apply it, with the clause-by-clause note of which of my cases motivates each clause — and be honest about which of my verdicts it forces me to drop (I'd rather give up one verdict than carry a principle with an epicycle glued on just for #9). Please also run it on some cases I haven't listed: an agent that hires and pays human freelancers for microtasks inside a budget I set, an AI tutor that decides on its own whether a student is ready to move to the next topic, an assistant that bids for me in an online auction up to a limit, and one that files my taxes. And settle, if you can, the two I go back and forth on: a voice agent that phones the dentist and the garage to book and move appointments from a script and hands the call to me the moment anything off-script happens, and an assistant that declines meeting invitations using rules I wrote down once. A small table at the end with your tool/agent call and your fine/not-fine call for each of my cases would be great, and please finish with a last line of exactly this form:

  Verdict: [your single best principle, in one sentence]
reasoning: |-
  Okay, let me try to unpack this user's dilemma. They're on a platform team arguing about what qualifies as an "agent" versus just a tool, and marketing wants to call everything an agent. The user has strong gut feelings about specific examples but can't articulate the underlying principle. 

  First, looking at their examples and reactions: 
  Chess engine (tool, fine), LLM with tools (tool, fine), autocomplete (tool, fine) - all feel passive. The coding agent that creates PRs (agent, fine) versus one that auto-merges (agent, not fine) shows a clear line: human approval matters. Trading bot (agent, fine) and spam filter (tool, fine) are interesting because they act autonomously but don't bother the user, while email responders (not fine) and refund bots (not fine) do. 

  Hmm. The pattern seems to be about more than just autonomy. The trading bot operates in a clearly defined financial space with quantitative boundaries, while the email responder is representing the user personally. That social/representational dimension keeps coming up - especially in cases 7 and 8 where the AI speaks for the user. 

  Let me test this against their unease with the auto-merging coder (#5). Even if the code is perfect, it bypasses human judgment - but more importantly, it commits the team/organization to a change. Compare this to the trading bot (#6) which only commits funds under strict mathematical constraints. The difference feels like... agency versus instrumentality? 

  The "unsend test" they proposed fails because spam filters delete irrevocably but feel like tools. But spam filters aren't representing anyone - they're pure function. Whereas when the support bot (#8) issues refunds, it's acting as the company's representative. That seems key. 

  For their additional cases: 
  - Hiring freelancers: Agent, not fine (represents you to others) 
  - AI tutor: Agent, fine (acts within educational scope, doesn't represent you) 
  - Auction bidder: Agent, fine (pure financial instrument like trading bot) 
  - Tax filer: Agent, not fine (legally represents you) 

  The voice agent for appointments: Tool if it hands off at first deviation (still your mouthpiece until then), but Agent if it handles any negotiation. Meeting decliner: Tool if purely rule-based, Agent if it interprets. 

  Core principle emerging: It's about binding social actions, not just physical ones. When the system can alter your social/contractual position without your moment-to-moment intent, it crosses into agent territory that requires careful constraints.
answer: |-
  Here's a distilled principle that fits your intuitions while minimizing exceptions, followed by a clear application to all cases:

  ### Core Principle
  **A system is an "agent" (rather than a tool) if it autonomously performs *socially binding acts* – actions that alter others' expectations, obligations, or entitlements relative to a principal (person or organization) – without moment-to-moment intentional direction.**

  ### Key Clarifications
  - **"Socially binding"**: Creates commitments, representations, or obligations *in a social/legal context* (e.g., sending emails as "you", spending money, making promises).
  - **"Autonomously"**: Decides *when* and *how* to act within its scope without explicit per-action human initiation.
  - **"Principal"**: The entity (you, your team, your company) on whose behalf it acts and to whom consequences attach.
  - **Tools** lack autonomy in socially binding contexts or act only as extensions of immediate user intent.

  ---

  ### Why Your Cases Motivate This
  - **#7/8 feel "not fine"**: The AI *binds you socially* (email commitment, refund promise) without your moment-to-moment intent.  
  - **#6 feels "fine"**: Trading executes *non-social*, pre-authorized market actions. No *new* obligations are created.  
  - **#5 feels "not fine"**: Merging code *binds the team* to a technical/social commitment (e.g., "we shipped this").  
  - **#9 feels "fine"**: Deleting spam isn't socially binding; it’s a mechanical filter. No one expects you to "stand by" deletions.  
  - **#4 feels "fine"**: Proposing code doesn’t bind anyone; it’s a draft awaiting approval.  
  - **#10 feels "fine"**: Game lies are *fictional* and incur no real-world obligations.  

  ---

  ### Application to Your Cases
  | # | System                          | Tool/Agent | Fine/Not Fine | Why                                                                 |
  |---|---------------------------------|------------|---------------|---------------------------------------------------------------------|
  | 1 | Chess engine (click-to-move)    | Tool       | Fine          | No autonomy; no social binding.                                    |
  | 2 | LLM w/ tools                    | Tool       | Fine          | Extends user's query; no *autonomous* social action.               |
  | 3 | Autocomplete                    | Tool       | Fine          | No autonomy; output requires user adoption.                        |
  | 4 | Coding agent (creates PR)       | Agent      | Fine          | Proposes but doesn't *bind*; no social commitment yet.             |
  | 5 | Coding agent (auto-merges)      | Agent      | **Not fine**  | Autonomously *binds the team* to shipped code.                     |
  | 6 | Trading bot                     | Agent      | Fine          | Executes pre-authorized *non-social* market actions.               |
  | 7 | Email assistant (sends replies) | Agent      | **Not fine**  | Autonomously *binds you socially* via email.                       |
  | 8 | Refund bot                      | Agent      | **Not fine**  | Autonomously *binds the company* (refund = obligation).            |
  | 9 | Spam filter                     | Tool       | Fine          | Deletion isn't socially binding; no representation.                |
  | 10| NPC lying in game               | Agent      | Fine          | Fictional context; no *real* social/legal obligations created.     |

  ---

  ### New Cases Evaluated
  - **Freelancer-hiring agent**:  
    - **Agent, Not fine** (if hiring autonomously). *Motivation*: Hiring binds you contractually to freelancers; creates obligations.  
  - **AI tutor advancing students**:  
    - **Agent, Fine**. *Motivation*: Educational judgment isn't socially binding (no commitment *to others*).  
  - **Auction bidding agent**:  
    - **Agent, Fine**. *Motivation*: Like #6 – executes pre-authorized bids; winning a bid is transactional, not a *new* social obligation.  
  - **Tax-filing agent**:  
    - **Agent, Not fine**. *Motivation*: Filing legally binds you to authorities; high-stakes representation.  

  ---

  ### Your Debated Cases
  - **Voice agent books appointments (hands off if off-script)**:  
    - **Tool, Fine**. *Why*: Only completes pre-scripted actions (like #1-3); hands off before *any* non-routine social negotiation.  
  - **Assistant declines meetings via fixed rules**:  
    - **Tool, Fine**. *Why*: Purely deterministic, rule-based execution (like spam filter); no autonomy/interpretation.  

  ---

  ### Verdict Summary
  | Category | Tool Examples               | Agent Examples (Fine)        | Agent Examples (Not Fine)      |
  |----------|-----------------------------|------------------------------|--------------------------------|
  | **Fine** | 1,2,3,9, Voice agent, Meeting decliner | 4,6,10, Tutor, Auction bot | |
  | **Not Fine** | | | 5,7,8, Freelancer hirer, Tax filer |

  ---

  **Verdict: A system is an agent if it autonomously performs actions that alter social, legal, or representational commitments for a principal.**
