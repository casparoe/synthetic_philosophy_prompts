answer: |-
  ## Guidance for Applicants and Auditors: Permits for Acts Beyond the Call of Duty

  **Preamble:** This document establishes procedures and interpretive guidelines for the administration of the Extra-Optional Conduct Authorization Scheme (ECAS) under Statute 42-7B. Its purpose is to ensure consistent, efficient, and legally defensible processing of ECAS Permit applications (Form ECAS-1) and subsequent audits (Form ECAS-2). Adherence to these protocols is mandatory for all Licensing Division personnel to maintain the integrity of the Scheme and the optional status of designated acts.

  **Definitions:**

  1.  **Act Beyond the Call of Duty (ABCD):** An act meeting all criteria in Clause 3, demonstrably performed, found retrospectively to have been morally praiseworthy to perform but not blameworthy to omit at the time of performance.
  2.  **Compliance Threshold:** The participation rate (expressed as a percentage) within a defined Reference Class (Clause 6.2) at which a previously optional act becomes mandatory. The current threshold is 85% (Regulation ECAS-R4).
  3.  **Motivation Audit:** A review (initiated via Form ECAS-2) of an applicant's personal records, communications, or witness testimony to ascertain primary intent, specifically seeking evidence of Credit-Seeking Motivation (Clause 10.1).
  4.  **Reference Class:** The population group against which participation rates for a specific act type (Clause 6.1) are measured for threshold determination. Defined by: Act Type, Geographic Locality (Postcode Sector), Temporal Cohort (Quarterly), and relevant Socio-Demographic Markers (Regulation ECAS-R5).
  5.  **Reactive Attitude Assessment:** The canvassing of bystanders, neighbours, or potential witnesses (Form ECAS-3) to gauge levels of resentment or indignation directed at the *omission* of the act in question, prior to knowledge of its performance by the applicant.
  6.  **Credit-Seeking Motivation:** Evidence demonstrating the applicant performed the act primarily to obtain an ECAS Permit or because the ECAS scheme exists, thereby negating the voluntary nature essential to an ABCD (Clause 10).

  **Procedures & Criteria:**

  7.  **Retrospective Authorization Mandatory:**
      7.1 An ECAS Permit may only be issued following the complete performance of the purported ABCD.
      7.2 Form ECAS-1 must be submitted within 90 calendar days of act completion. Late submissions require a Statutory Declaration (Form SD-7) explaining the delay.
      7.3 Applicants must complete Section 4 ("Declaration of Uncertainty") affirming understanding that permit issuance is not guaranteed and the act was undertaken without assurance of recognition under ECAS. *Example:* A. Jones, having returned a lost wallet containing £250 to its owner via a police station, submits ECAS-1. Jones acknowledges in Section 4 that returning the wallet was done without expectation of an ECAS Permit and understands the permit may be refused.

  8.  **Compliance Threshold & Reclassification:**
      8.1 The Bureau continuously monitors participation rates for defined Act Types within Reference Classes.
      8.2 Where the participation rate for a specific Act Type within a Reference Class meets or exceeds the Compliance Threshold (85%), that act is reclassified as Mandatory Conduct for all members of that Reference Class during the relevant Temporal Cohort.
      8.3 Upon reclassification:
          *   8.3.1 All pending ECAS-1 applications for that Act Type/Reference Class/Temporal Cohort are automatically rejected.
          *   8.3.2 All previously issued ECAS Permits for that Act Type/Reference Class/Temporal Cohort are revoked.
          *   8.3.3 Non-participation data for that Act Type/Reference Class/Temporal Cohort is forwarded to the Enforcement Division for potential retroactive citation under Statute 42-7C (Failure in Ordinary Duty).
      8.4 To manage participation rates and prevent premature reclassification, the Bureau employs:
          *   8.4.1 Quarterly Caps on permits issued per Act Type/Reference Class.
          *   8.4.2 Allocation Lotteries for high-demand Act Types when applications exceed the cap.
          *   8.4.3 Managed Waiting Lists for specific resource-intensive ABCD candidates (e.g., non-directed kidney donation, complex rescues requiring significant training). *Note:* Listing implies willingness only; performance remains optional until undertaken and approved. *Example:* Due to high participation (82%) in Postcode Sector NW1 for "Returning Valuables Found in Public Spaces (Under £500)", Q3 2024, the cap is reduced. Mr. Smith's ECAS-1 application for returning a mobile phone is entered into a lottery; he is not selected for a permit this quarter. Participation rises to 86% in Q4; returning such items becomes mandatory in NW1 for Q4. Ms. Brown, who omitted to return a found watch in NW1 during Q4, receives a citation from Enforcement.

  9.  **Bystander Resentment Test (Reactive Attitude Assessment):**
      9.1 Prior to final determination on an ECAS-1, officers *must* conduct a Reactive Attitude Assessment where feasible (Form ECAS-3).
      9.2 Canvassing targets individuals plausibly aware of the omission *prior* to the act's performance (e.g., neighbours aware of a dispute where applicant later mediated, passers-by who saw someone fall before applicant assisted).
      9.3 Evidence of significant resentment or indignation regarding the *omission* (e.g., statements like "Someone *should* have helped!", "It's outrageous no one stepped in!") indicates the act was likely perceived as a duty.
      9.4 Where such reactive attitudes are documented, the ECAS-1 must be refused. The file, including the ECAS-3 findings, is transferred to the Enforcement Division for assessment of potential Failure in Ordinary Duty. *Example:* Mr. Lee intervenes to stop a low-level altercation between neighbours. ECAS-3 canvassing reveals several neighbours expressed significant anger *before* Mr. Lee acted, stating someone "had a duty to stop it getting worse." Permit refused; file forwarded to Enforcement.

  10. **Non-Transferability & Motivation Disqualification:**
      10.1 An ABCD cannot offset or negate any unmet Mandatory Conduct obligation (e.g., unpaid taxes, missed child support). The ledgers are separate and non-fungible (Statute 42-7B, Sec. 12).
      10.2 Applicants are disqualified if a Motivation Audit reveals primary Credit-Seeking Motivation.
      10.3 Auditors review submitted diaries, emails, text messages, social media, and witness statements for indicators such as:
          *   10.3.1 Pre-performance references to ECAS permits or "building up credit."
          *   10.3.2 Post-performance statements framing the act explicitly as "going beyond" for recognition.
          *   10.3.3 Prior inquiries to the Bureau about specific act eligibility before performance.
      10.4 *Statistical Note:* Valid application volume (post-Motivation Audit) has shown a year-on-year decrease of approximately 7% since Scheme inception (Internal Report ECAS/STAT/24-01).

  11. **Worked Examples (Classification Scenarios):**
      11.1 *Staying Late to Complete Colleague's Work:* Applicant stays 3 hours. *Assessment:* Check local compliance rate for "Workplace Collegiate Assistance >2hrs". If 83%, potentially ABCD. Check Reactive Attitudes: Did colleagues express resentment *before* applicant stayed? If yes, likely duty. Check Motivation: Diary entry "Need good deed for ECAS file"? Disqualifies.
      11.2 *Giving Blood:* Standard donation. *Assessment:* Check local compliance rate for "Blood Donation (Standard)". National rate stable at 4%, local rate 5%. Well below threshold. Reactive Attitudes unlikely unless specific local crisis. Motivation: Routine donor card, no mention of ECAS? Likely valid ABCD.
      11.3 *Pulling Person from Canal:* Shallow canal, minimal personal risk. *Assessment:* Check local compliance for "Low-Risk Aquatic Rescue". If participation high (e.g., lifeguard-rich area, rate 88%), becomes mandatory. If low (e.g., rural area, rate 10%), potentially ABCD. Reactive Attitudes: Did bystanders shout "Help!" indignantly *before* applicant acted? If yes, suggests duty. Motivation: Text message "Saw someone fall in, might get a permit if I jump"? Disqualifies.

  **Forward Programme:**

  12. **Demand Management & Scheme Integrity:**
      12.1 Analysis confirms that maintaining acts below the Compliance Threshold is essential to preserving the category of the ABCD.
      12.2 Current application volumes and participation rates for common Act Types (e.g., minor assistance, small-value returns) present a significant reclassification risk.
      12.3 To mitigate this risk and ensure the long-term viability of the ECAS, the Division will implement:
          *   12.3.1 Cessation of all public information campaigns regarding ECAS.
          *   12.3.2 Withholding the names of ECAS Permit holders from public disclosure registers.
          *   12.3.3 A pilot programme ("Project Preserve Optionality") involving discreet, informal discouragement by front-line staff during initial applicant inquiries for high-frequency Act Types, emphasizing burdens, low success rates, and the risk of reclassification. *Example:* Officer response: "You're inquiring about permits for returning lost property under £50? The process is quite involved, approval rates are currently low due to high volumes in your area, and frequent submissions can sometimes trigger mandatory status reviews."

  **Appendix A: Note on the Office of Maximizing Review (OMR) Position**

  *   OMR contends that the concept of the ABCD is logically incoherent. Their position ("Maximal Obligation Theory") holds that, in any situation, one is morally obligated to perform the *best available action*. Therefore, performing less than the best available action is blameworthy, and performing the best available action is merely obligatory, leaving no conceptual space for acts that are "beyond" duty.
  *   The Bureau acknowledges this theoretical position. However, Statute 42-7B explicitly mandates the administration of the ECAS based on the *operational* definition of the ABCD provided therein (Clause 1).
  *   The practical consequence for Bureau staff is that all actions performed *within* their official duties (e.g., processing forms, conducting audits) are classified as Mandatory Conduct. By OMR's reasoning, any discretionary effort by staff (e.g., double-checking a complex file, assisting a confused applicant beyond minimal requirements) could constitute the "best available action" and thus become obligatory, potentially exposing staff to blame for omissions. Strict adherence to defined procedures and time allocations is therefore the only defensible course for personnel. The Bureau notes this creates tension between operational efficiency and theoretical moral risk, managed through meticulous procedure compliance.
