  Is there something specific about motion?

  The argument is framed in terms of happenings in general, not just motion. It applies to any temporal process, like the candle burning or time passing.

  So the paradox isn't specifically about space or motion; it's about temporal intervals and completion.

  By rejecting step (4), we say that no first part is needed, so things can complete.

  And that seems consistent with how we experience time; events start and end without us pinpointing a first instant.

  For example, when does a race start? At the gunshot, but the gunshot itself takes time, and so on, but we don't have a problem with races starting.

  Similarly, completion.

  So I think step (4) is the culprit.

  Why did it look innocent? Because in finite cases, there is a first part, so we might generalize incorrectly to infinite cases.

  In a process with discrete steps, there is a first step, and it completes, then others.

  But with dense time, there is no first step, but the process still proceeds.

