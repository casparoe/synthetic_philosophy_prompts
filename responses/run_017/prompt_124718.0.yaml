  The issue is that there is no first initial part to be completed because for any such part, there's an earlier one.

  But the whole event doesn't require a first part; it just requires that all initial parts up to the end are completed, and then at time 1, it's done.

  Step (3) might be the problem. It says "completed only if some proper initial part is completed first." But in what sense is it "first"? If there's no first, then it seems problematic.

