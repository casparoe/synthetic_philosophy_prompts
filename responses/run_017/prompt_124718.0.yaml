  1. A happening that takes time has proper initial parts. For example, if a candle burns for an hour, burning the first half hour is a part of it.

  2. Every proper initial part has a proper initial part that is completed before it. Since time is dense, for any interval, there's a smaller one starting earlier.

  3. Therefore, for the whole happening to be completed, some proper initial part must be completed first.

  4. So there must be a first part completed before all others.

  5. But from (2), there can't be a first part because every part has one before it.

  6. Thus, nothing that takes time can be completed.

  7. Specifically, the elapsing of an hour takes time, so no hour elapses, and by extension, we never finish anything.

  My friend says standard replies about infinite sums or discretizing time don't work. Infinite sums aren't mentioned, so convergence isn't the issue. Discretizing doesn't help because if the smallest part takes time, it has subparts; if it takes no time, motion doesn't happen at an instant.

  I think the key is step (4). It assumes there must be a first part completed. But in a dense ordering, there doesn't have to be a first element; it can be that every part has a predecessor, but the whole thing still completes.

  Step (3) says: "a happening is completed only if some proper initial part of it is completed first." Is that true?

  Consider an interval of time, say [0,1]. The happening occupies this interval. Proper initial parts are subintervals [0,t] for t<1.

