  There is no first completion time for initial parts because inf{t | t in [a,b)} = a, but a is not included if we think of completion times; the initial part completed at a might be degenerate if we think of [a,a], but [a,a] is not a proper interval if it has no duration, but in this context, initial parts have positive duration, I assume.

  The argument says "proper initial parts that are themselves happenings occupying intervals," so they have positive duration, so t > a for the completion time? No.

  Let's clarify.

  If H occupies [a,b], then for t in (a,b], the initial part up to t is defined and completed at t.

  For t=a, if we consider [a,a], it might be a point event or something, but the argument is about things that take time, so initial parts should have positive duration, so t > a.

  So completion times for proper initial parts are in (a,b].

  Now, the set (a,b] has no minimum element because it's open at a. For any t in (a,b], there is s with a < s < t, so the initial part up to s is completed before the one up to t.

  Therefore, there is no first initial part completed; for any initial part completed at t, there is one completed earlier at s < t.

  Then step (4) says there must be a first one, but there isn't, so contradiction.

  But step (3) says the happening is completed only if some proper initial part is completed first. Is that true?

  In this case, no initial part is completed first, but the whole is still completed at b.

  So step (3) seems false.

  Why would one think it's true? Perhaps from a misunderstanding of how completion works.

  The argument might be thinking that the completion of the whole requires that all initial parts are completed, and since the parts are completed in sequence, there must be a first one to start the sequence.

  But in a dense order, there doesn't need to be a first event; the completions can be densely ordered, but the whole still finishes.

  For example, consider the hour elapsing. Every initial segment is completed before the end, but there is no first segment completed; as time progresses, segments are completed continuously.

