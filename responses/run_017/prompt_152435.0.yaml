prompt: |-
  I run model risk for a vendor that ships churn and collections scoring models to around forty community banks and credit unions. About four times a year we re-fit each model, and before a re-fit ships, an analyst has to sign off on the feature set: roughly sixty candidate features a quarter, each reviewed by someone with SQL and applied statistics but no philosophy, in twenty to thirty minutes, on a one-page internal form that ends in one of four dispositions — admit; admit with mandatory post-deployment drift monitoring; admit only if re-derived from base fields; reject — plus three lines of rationale that I countersign and that compliance reads for fair-lending exposure. Right now my analysts justify a feature almost entirely by its lift on an out-of-time holdout, and I have come to think that check is nearly circular for exactly the features that worry me. A grue-style predicate — say, one that applies to accounts opened before our 2021 onboarding redesign and to accounts opened after it only if they satisfy some unrelated condition — fits any finite run of past data exactly as well as the honest predicate does, so a holdout carved out of the same pre-build window cannot separate them, and the difference only appears after deployment, when we have already shipped and the banks have already acted on the scores.

  What I want from you is a written procedure my analysts can run per feature, grounded in whatever is actually usable from the philosophical literature on the new riddle of induction — Goodman's idea that projectibility tracks the entrenchment of a predicate in a vocabulary that has a real history of being projected, the point that grue and green are interdefinable so that no purely syntactic or definitional test can adjudicate between them, and the role of higher-level overhypotheses about kinds. It has to survive translation to people who will not read any of that: give the steps in the order they should be run, say what counts as a sufficient answer at each step, say what to do when a step cannot be answered from the data and documentation we actually have (including what an analyst should use as a working proxy for entrenchment — e.g. whether the predicate's family shows up in previously shipped models, in monitoring reports, or in how the bank's own staff describe their customers), and mark explicitly which steps are judgment calls dressed up as procedure and where the call has to be handed to me or to compliance because it is about values and cost asymmetry rather than facts. It also has to handle the cases that break the simple picture: features anchored to a date or to the scoring run itself; features defined by a threshold the bank sets and periodically changes, so their extension silently shifts; features defined by reference to another model's output, so that the predicate's extension moves when we act on the prediction; and features we cannot state in words at all, such as a thirty-two-dimensional embedding trained on transaction text, where the question of what predicate is being projected may not be answerable in the vocabulary of the form.

  Please apply the finished procedure to three features from our current build and show the filled-in reasoning, not just the verdict. First, legacy_cohort: true of an account if and only if it was opened before the 2021 onboarding redesign; it is in the champion collections model and accounts for about eight percent of its lift. Second, referred_by_legacy_rules: whether the account was flagged for collections under the rule set we retired in 2022 — it is the single highest-gain feature in the new build, and its extension was produced by a system we no longer run. Third, a thirty-two-dimensional embedding of transaction description strings from a pretrained model, which we have reason to think encodes the transaction month because the raw strings contain month tokens; here I want to know what the procedure even asks, given that no one can write down the predicate. If your procedure implies that the out-of-time holdout result is close to worthless for features of the first two kinds, say so plainly rather than softening it, even though that is the evidence my team has been signing off on for years. Finally, tell me what the procedure cannot do: what it has to say about a genuinely new kind — we are about to score behaviour on a payment product that has existed for eleven months, so no predicate for it has any projection history — and how it handles the tension between entrenchment and mechanism, since we usually know a causal story for the features we trust and entrenchment as such seems indifferent to whether there is one.
reasoning: |-
  We are designing a procedure to assess the projectibility of features in churn and collections scoring models, inspired by Goodman's new riddle of induction. The goal is to avoid circularity in validation (especially for features that might be "grue-like") and to provide a structured, practical approach for analysts.

  Key concepts from Goodman:
  - **Projectibility**: A predicate (feature) is projectible if it is the kind that we can reasonably project (generalize) from past observations to future cases.
  - **Entrenchment**: A predicate is entrenched if it has a history of being used in successful projections (i.e., it's part of our established vocabulary).
  - **Grue problem**: A predicate like "grue" (which applies to things observed before time T if green and to things observed after T if blue) is not projectible because it is not entrenched, even though it fits past data equally well as "green".
  - **Overhypotheses**: Higher-level hypotheses about the kinds of predicates that are projectible (e.g., that color is a stable property but "grue-like" properties are not).

  The procedure must be usable by analysts with SQL and applied statistics (no philosophy background) and must fit within 20-30 minutes per feature. It must handle:
  - Features anchored to a date (like `legacy_cohort`).
  - Features with thresholds that shift (bank-set thresholds that change).
  - Features defined by another model's output (which may change when we act on the model).
  - Features that are embeddings (without human-interpretable definitions).

  The procedure should output one of four dispositions:
  1. **Admit**: The feature is projectible and can be used as is.
  2. **Admit with mandatory post-deployment drift monitoring**: The feature is somewhat suspect and requires close monitoring after deployment.
  3. **Admit only if re-derived from base fields**: The feature should be re-engineered from raw data to avoid dependency on intermediate models or shifting definitions.
  4. **Reject**: The feature is not projectible and should not be used.

  The procedure must also explicitly note:
  - Steps that are judgment calls.
  - Steps that require escalation (to model risk or compliance).
  - How to handle cases with insufficient data.

  **Proposed Procedure Steps**

  **Step 0: Pre-Check (Data Sanity)**
  - Verify that the feature is computed correctly and consistently in the training and holdout data. Check for missing values, data type, and basic distribution.
  - If the feature is derived from base fields, ensure the derivation code is available and has been reviewed for correctness.
  - If the feature is provided by the bank or an external system, document the source and any known issues.
  - *Time allocation*: 5 minutes.
  - *Outcome*: If the feature fails basic data checks, reject it. Otherwise, proceed.

  **Step 1: Feature Definition and Stability**
  - **1.1 Definition Clarity**: Can the feature be clearly defined in words? If not (e.g., an embedding), skip to Step 1.2. If yes, write down the definition and note any dependencies (e.g., on a specific date, threshold, or other model).
  - **1.2 Stability Assessment**:
    - For features that depend on a fixed date (like `legacy_cohort`): Note that the set of accounts satisfying the condition is fixed and shrinking. This is stable in definition but the feature's meaning is tied to a historical event.
    - For features with thresholds set by the bank: Check if the threshold has changed in the past or is expected to change. If so, note that the feature's extension (the set of accounts it applies to) may shift arbitrarily.
    - For features that depend on another model's output: Note that if the other model changes, this feature changes. Also, if the feature is used in a feedback loop (e.g., the model's output affects the input for the next run), flag it.
    - For embeddings: Note that the feature is a vector and the meaning of each dimension is not explicitly defined. The stability of the underlying model and the data it processes is key.
  - **1.3 Historical Shifts**: If historical data is available, check for past shifts in the feature's distribution. If the feature is new, note that.
  - *Time allocation*: 5 minutes.
  - *Sufficient answer*: A clear statement of the feature's definition (if possible) and any sources of instability. If the feature is an embedding, state the source model and its version.
  - *Judgment call*: Assessing the likelihood of future shifts (e.g., threshold changes) may require judgment. If the shift is highly likely and the feature is critical, escalate to model risk.
  - *Escalation*: If the feature is defined by a model that is not under your control and that model is subject to frequent changes, escalate to model risk.

  **Step 2: Projectibility Assessment (Entrenchment and Overhypotheses)**
  - **2.1 Entrenchment Check**:
    - Check if the feature (or a closely related one) has been used in previous models (either your models or the bank's) and for how long.
    - Check if the feature has been monitored in production and if it has shown stability (low drift) over multiple periods.
    - For embeddings, check if the embedding model has been used before and if its outputs have been stable.
    - *Proxy for entrenchment*: 
      - If the feature (or a similar one) has been in production for at least 2 years, it is entrenched.
      - If it has been used for less than 1 year, it is not entrenched.
      - If between 1 and 2 years, it is moderately entrenched.
  - **2.2 Overhypotheses**:
    - Consider the feature in the context of higher-level categories (overhypotheses) that are known to be stable. For example:
      - Demographic features (like age) are generally stable but may be subject to fair lending concerns.
      - Behavioral features (like payment history) are projectible if they capture a stable behavioral pattern.
      - Features tied to a one-time event (like a system change) are not projectible beyond the immediate aftermath of that event.
      - Features that are arbitrary or defined by non-causal thresholds (e.g., "balance above $500") are less projectible than ones with a causal story.
    - For embeddings: Consider the overhypothesis that the embedding captures a stable aspect of the data (e.g., merchant category) versus a transient one (e.g., a promotion that ended).
  - *Time allocation*: 10 minutes.
  - *Sufficient answer*: A classification of the feature's entrenchment (low, moderate, high) and a note on which overhypotheses apply.
  - *Judgment call*: Deciding which overhypotheses apply is a judgment call. If the feature falls into a category that is known to be problematic (e.g., tied to a temporary event), this may require rejection or monitoring.
  - *Escalation*: If the feature is in a sensitive category (e.g., related to protected attributes) or if there is a high-stakes cost to being wrong, escalate to compliance and model risk.

  **Step 3: Out-of-Time Holdout Check (But Not Solely)**
  - Run the standard lift analysis on the out-of-time holdout. Note the lift and the feature's importance.
  - However, note that for features that are time-dependent (like `legacy_cohort`) or that have a shifting definition, the holdout may not be a reliable indicator of future performance. Therefore, the lift result is not the primary factor for projectibility but is still recorded.
  - *Time allocation*: 5 minutes (since this is already done, just record the result).
  - *Sufficient answer*: The lift value and importance, but with a caveat if the feature is of a kind that the holdout cannot properly test.

  **Step 4: Disposition and Rationale**
  - Based on Steps 1-3, choose one of the four dispositions:
    - **Admit**: The feature is well-defined, stable, entrenched, and fits a positive overhypothesis. The holdout lift is acceptable.
    - **Admit with mandatory post-deployment drift monitoring**: The feature has some risk (e.g., low entrenchment, some instability, or a concerning overhypothesis) but is not clearly non-projectible. We will monitor it closely in production.
    - **Admit only if re-derived from base fields**: The feature's definition is unstable (e.g., it depends on a model that may change) but the underlying concept is sound. We require it to be recomputed from raw data to avoid dependency.
    - **Reject**: The feature is not projectible (e.g., it is tied to a non-repeatable event, has no entrenchment, and fits a negative overhypothesis) or poses unacceptable risk.
  - Write a rationale (3 lines max) that summarizes:
    - The key risk factors (instability, lack of entrenchment, problematic overhypothesis).
    - The holdout lift result (but note its limitations if applicable).
    - The reason for the chosen disposition.
  - *Time allocation*: 5 minutes.
  - *Judgment call*: The disposition is a judgment call, especially for borderline cases. If the feature is critical and the risk is high, escalate to model risk.

  **Handling Special Cases**
  - **New Kinds (no history)**: For a feature on a new product (11 months old), entrenchment is low by definition. We must rely on overhypotheses and stability. If the feature is defined in a way that is expected to be stable (e.g., a behavioral pattern) and there is a causal story, then we might admit with mandatory monitoring. If not, reject.
  - **Tension between entrenchment and mechanism**: If a feature has a strong causal story but is not entrenched, we may still admit it but with monitoring. Conversely, a feature that is entrenched but without a causal story might be admitted but monitored for drift. The procedure should note that entrenchment is a proxy for past success, but causal understanding is a stronger indicator of future stability.

  **Application to Example Features**

  **Feature 1: legacy_cohort**
  - **Step 0**: Passes data checks.
  - **Step 1**: 
    - Definition: True if account opened before 2021 redesign.
    - Stability: The set is fixed (only accounts opened before 2021) and shrinking as accounts close. This is stable in definition but tied to a historical event.
    - Historical Shifts: The feature has been used since 2021. The proportion of legacy accounts is decreasing.
  - **Step 2**:
    - Entrenchment: Has been in production for ~3 years -> high entrenchment.
    - Overhypotheses: This feature is tied to a one-time event (the redesign). The overhypothesis is that such features are not projectible in the long term because the event becomes more distant and the cohort shrinks. However, in the medium term, it might capture persistent differences in account terms or customer behavior.
  - **Step 3**: The holdout shows 8% lift. But note: the holdout is from the same time period (pre-2021 and post-2021) so it cannot test the stability of the legacy effect beyond the data window.
  - **Step 4**:
    - **Disposition**: Admit with mandatory post-deployment drift monitoring.
    - **Rationale**: High entrenchment but tied to a one-time event; cohort shrinking. Holdout lift strong but cannot test long-term projectibility. Monitor for decreasing importance.

  **Feature 2: referred_by_legacy_rules**
  - **Step 0**: Passes data checks (but note: the system that produced it is retired).
  - **Step 1**:
    - Definition: Whether the account was flagged under a retired rule set.
    - Stability: The feature is fixed (because the rule set is retired) and cannot change. However, it is defined by a system that no longer runs, so it cannot be recomputed for new accounts? Actually, the feature is only defined for accounts that existed at the time the rule set was active. For new accounts, it might be missing or false. This creates a shift as new accounts are added.
    - Historical Shifts: The rule set was retired in 2022, so the feature is static for existing accounts but not defined for new ones.
  - **Step 2**:
    - Entrenchment: The rule set was used before 2022, but the feature as a model input is new. So low entrenchment as a model feature.
    - Overhypotheses: This feature captures a historical event (the rule set's flag) that might be indicative of persistent customer risk. However, since the rule set is retired, the feature is fixed and not recomputable for new accounts. This might lead to a growing missing segment and drift.
  - **Step 3**: It is the highest-gain feature in the new build. But the holdout is from a time when the rule set was active, so it does not test the feature's behavior in a world without the rule set.
  - **Step 4**:
    - **Disposition**: Reject, OR if the feature is critical, then "Admit only if re-derived from base fields". However, note: the feature is defined by a retired rule set. We cannot re-derive it from base fields unless we re-implement the legacy rules. If the bank still runs the legacy rules for other purposes, then we can recompute. Otherwise, we cannot.
    - **Rationale**: Fixed feature with no future computability for new accounts. Holdout lift high but circular (since the rule set was active in the holdout period). Without ability to recompute, reject. If we can re-derive by implementing the legacy rules, then admit with monitoring.

  **Feature 3: Embedding of transaction description strings**
  - **Step 0**: Passes data checks (we have the embedding model and version).
  - **Step 1**:
    - Definition: Not definable in words. It's a 32-dimensional vector from a pretrained model.
    - Stability: The embedding model is fixed (pretrained) so the computation is stable. However, if the transaction descriptions change (e.g., new merchants, new formats) the embedding may drift.
    - Historical Shifts: We have reason to believe one dimension encodes the month. This is problematic because month is cyclical and should not be a stable predictor (unless we are modeling seasonality, but then we should use month explicitly). We should check if the model has learned to rely on the month, which would be non-projectible if the scoring run month is arbitrary.
  - **Step 2**:
    - Entrenchment: This specific embedding is new, but the embedding model has been used in other contexts? If not, low entrenchment.
    - Overhypotheses: Embeddings can capture stable semantic information (like merchant type) but also transient patterns. The fact that one dimension encodes the month is a red flag because the month of a transaction is not a stable characteristic of an account (unless we are explicitly modeling seasonality). We must check if the model is using the month dimension. If so, that part is non-projectible.
  - **Step 3**: The lift is not provided, but we assume it's positive. However, the holdout cannot test if the embedding's relationship with the target is stable over time because the embedding might capture time-dependent patterns.
  - **Step 4**:
    - **Disposition**: Admit with mandatory drift monitoring, and also require that we monitor the correlation of each embedding dimension with time (to detect if the model is relying on time-dependent patterns). Additionally, we should try to remove the time leakage (e.g., by removing month tokens from the transaction strings) and retrain.
    - **Rationale**: Embedding is stable in computation but may encode non-projectible patterns (like month). Holdout lift positive but may not reflect future stability. Monitor for drift and time correlation.

  **What the Procedure Cannot Do**
  - **New Kinds**: For a genuinely new kind (like a feature for a product that has existed for 11 months), the procedure relies on overhypotheses and causal reasoning. Without history, entrenchment is low. If the feature has a strong causal story and stability, we might admit with monitoring. Otherwise, reject.
  - **Entrenchment vs. Mechanism**: The procedure notes entrenchment as a proxy for stability but does not replace causal understanding. We should prefer features with a causal story. In borderline cases, we escalate to model risk for a deeper dive.

  **Final Note**: The out-of-time holdout is indeed of limited value for features that are time-dependent or have shifting definitions. The procedure explicitly downgrades the holdout result for such features and relies more on entrenchment and overhypotheses.
answer: |-
  Below is a written procedure for feature projectibility assessment, designed for analysts with SQL/applied stats skills, incorporating Goodman's insights on induction, entrenchment, and overhypotheses. The procedure explicitly addresses circularity in holdout validation and handles edge cases. Steps requiring judgment or escalation are marked with **(J)**, and proxy methods for entrenchment are provided.

  ---

  ### **Feature Projectibility Assessment Procedure**  
  **Goal**: Determine if a feature is projectible (i.e., generalizes to future data) beyond holdout performance.  
  **Time per feature**: 20–30 minutes.  
  **Inputs**: Feature definition, historical data, documentation, model lineage, and prior monitoring reports.  
  **Output**: One of four dispositions with rationale.  

  #### **Step 1: Define the Predicate Clearly**  
  **Objective**: Articulate *what property the feature claims to represent* (e.g., "riskier due to pre-2021 onboarding").  
  **Actions**:  
  - Write a plain-English predicate: "This feature is TRUE when [condition]."  
  - For embeddings: State the input domain (e.g., "embeds transaction text") and note whether any dimensions are *known* to encode unstable properties (e.g., time).  
  - For threshold-based features: Document how the threshold is set and how often it changes.  
  **Sufficient Answer**:  
    - ✅ Clear predicate or input domain.  
    - ❌ Ambiguous/nonexistent predicate (e.g., uninterpretable embedding).  
  **Handling Missing Info**:  
    - If the predicate is unclear (e.g., embedding), use SHAP/LIME to identify top drivers. Flag dimensions correlated with time or metadata.  
    - If threshold-setting process is undocumented, assume it changes quarterly (worst case).  
  **Judgment**: **(J)** Distinguishing stable properties (e.g., "spending habits") from unstable ones (e.g., "month of transaction"). Escalate to model risk if ambiguous.  

  ---

  #### **Step 2: Assess Entrenchment**  
  **Objective**: Evaluate if the predicate has a history of successful projection.  
  **Actions**:  
  - **Proxy 1 (Past Usage)**:  
    - Check if the feature (or similar) exists in:  
      - Previously shipped models (≥2 prior builds).  
      - Production monitoring reports (≥4 quarters).  
      - Bank documentation (e.g., "legacy accounts" in underwriting manuals).  
  - **Proxy 2 (Semantic Stability)**:  
    - Verify if the predicate’s definition has remained consistent (e.g., "opened before 2021" vs. "opened during COVID").  
  - For embeddings: Check if the *embedding model* has been used in ≥2 prior builds.  
  **Sufficient Answer**:  
    - ✅ **Entrenched**: Used in ≥2 prior builds + stable definition.  
    - ⚠️ **Moderate**: Used in 1 build OR inconsistent definition.  
    - ❌ **Not Entrenched**: New feature or unstable definition.  
  **Handling Missing Info**:  
    - If lineage is unavailable, assume "not entrenched."  
  **Judgment**: **(J)** Deciding "similar" features (e.g., "opened_before_2021" vs. "opened_before_2020"). Escalate if disputed.  

  ---

  #### **Step 3: Evaluate Overhypotheses**  
  **Objective**: Judge if the predicate aligns with higher-order stable categories ("kinds").  
  **Actions**:  
  - **Test 1 (Causal Plausibility)**:  
    - Does the predicate link to a causal mechanism? (e.g., "legacy onboarding caused higher risk" vs. "referred_by_legacy_rules is an artifact").  
  - **Test 2 (Temporal Stability)**:  
    - Could this predicate silently shift? (e.g., threshold features, date anchors).  
  - **Test 3 (Kind Membership)**:  
    - Categorize the predicate:  
      - **Stable Kinds**: Demographics, long-term behavior (e.g., "credit utilization").  
      - **Unstable Kinds**: Dates, model outputs, thresholds, transient states (e.g., "month of transaction").  
  **Sufficient Answer**:  
    - ✅ Aligns with stable kind + causal story.  
    - ⚠️ Aligns with unstable kind OR weak causal story.  
    - ❌ Contradicts known mechanisms (e.g., "grue-style" logic).  
  **Handling Missing Info**: Default to "unstable kind" if uncertain.  
  **Judgment**: **(J)** All steps. Escalate to model risk/compliance if:  
    - Fair lending risk (e.g., proxies for age/race).  
    - High cost asymmetry (e.g., false negatives in collections).  

  ---

  #### **Step 4: Mitigate Circularity in Holdout Validation**  
  **Objective**: Audit if holdout lift is inflated by non-projectibility.  
  **Actions**:  
  - **For date-anchored/threshold features**:  
    - Holdout results are **not evidence of projectibility** (past data cannot test future shifts).  
  - **For model-output features**:  
    - Holdout results may be circular if the output model was trained on overlapping data.  
  - **For embeddings**:  
    - Test for time leakage (e.g., correlate dimensions with transaction dates).  
  **Sufficient Answer**:  
    - ✅ Lift is valid: No temporal/logical circularity.  
    - ⚠️ Lift is partially valid: Use with caution.  
    - ❌ Lift is circular: Ignore for projectibility.  
  **Output**: Override holdout lift with findings from Steps 2–3.  

  ---

  #### **Step 5: Assign Disposition**  
  **Rules**:  
  1. **Admit**: Entrenched + stable kind + causal story + non-circular lift.  
  2. **Admit with monitoring**: Moderate entrenchment/stable kind OR unstable kind with causal story.  
  3. **Admit if re-derived**: Non-entrenched + depends on external model/threshold.  
  4. **Reject**: Not entrenched + unstable kind + no causal story.  
  **Rationale (3 lines max)**:  
    - "Predicate [X] has [entrenchment status] and aligns with [stable/unstable] kind. [Causal story]. Holdout lift [is/is not] circular. Disposition: [Y]."  

  ---

  ### **Application to Example Features**  
  #### **Feature 1: `legacy_cohort`**  
  - **Step 1**: "TRUE if account opened before 2021 onboarding redesign."  
  - **Step 2**: **Entrenched** (in champion model since 2021; banks use "legacy" in manuals).  
  - **Step 3**: **Unstable kind** (date-anchored; no causal story beyond historical correlation).  
  - **Step 4**: Holdout lift **circular** (cannot test post-2023 performance).  
  - **Disposition**: **Admit with mandatory drift monitoring** (entrenched but unstable kind).  
  - **Rationale**: "Predicate entrenched but tied to a fixed date. No causal story beyond correlation. Holdout lift circular. Monitor for decaying importance post-2023."  

  #### **Feature 2: `referred_by_legacy_rules`**  
  - **Step 1**: "TRUE if flagged by pre-2022 collections rule set."  
  - **Step 2**: **Not entrenched** (new feature; retired system).  
  - **Step 3**: **Unstable kind** (depends on defunct model; extension fixed but non-recomputable).  
  - **Step 4**: Holdout lift **circular** (rules active in holdout period).  
  - **Disposition**: **Admit only if re-derived from base fields** (e.g., rebuild legacy rules from raw data).  
  - **Rationale**: "Predicate not entrenched and non-recomputable. Circular holdout lift. Admit only if re-derived from base fields to avoid dependency on retired system."  

  #### **Feature 3: Transaction Description Embedding**  
  - **Step 1**: "32D vector from NLP model; dimension 14 correlates with month (r=0.89)."  
  - **Step 2**: **Not entrenched** (new embedding; pretrained model unused in prior builds).  
  - **Step 3**: **Unstable kind** (dimension encodes month, a transient property).  
  - **Step 4**: Holdout lift **partially circular** (time leakage in training/holdout).  
  - **Disposition**: **Reject** (or **Admit with monitoring** if time-correlated dimensions removed).  
  - **Rationale**: "Embedding not entrenched; dimension 14 encodes month (unstable kind). Holdout lift inflated by time leakage. Reject unless time signals are removed."  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Genuinely New Kinds (e.g., payment product <1 year old)**:  
     - Entrenchment proxies fail (no history). Rely on overhypotheses:  
       - If aligned with stable kinds (e.g., "spending frequency"), **admit with monitoring**.  
       - If no causal story or aligned with unstable kinds, **reject**.  
     - Example: A feature for an 11-month-old product with no causal mechanism → **reject**.  

  2. **Tension Between Entrenchment and Mechanism**:  
     - **Entrenchment ≠ correctness**. A well-entrenched feature (e.g., ZIP code) may be non-causal and discriminatory.  
     - **Procedure handles this**:  
       - Step 3 forces causal/stability assessment.  
       - Compliance escalation for high-risk features.  
     - Example: A high-lift, entrenched feature with no mechanism (e.g., "days since full moon") → **reject** due to unstable kind.  

  ---

  ### **Key Takeaways**  
  - **Holdout tests are worthless for date-anchored/threshold features** (e.g., `legacy_cohort`). They cannot detect future predicate shifts.  
  - **Entrenchment is a proxy, not truth**: Prioritize causal mechanisms and stable kinds.  
  - **Escalate**:  
    - Values/cost asymmetry (e.g., fair lending) → Compliance.  
    - Uncertain projectibility → Model Risk.  
  - **Embeddings**: Require special checks for time leakage and semantic drift.  

  Implement this procedure to replace circular holdout checks with a robust projectibility framework.
