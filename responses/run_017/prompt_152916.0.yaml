  ### Brainstorming (Unstructured)
  - QTL shifts focus from propositional truth to operational performance; truthlikeness becomes instrumental.  
  - R2 and R3 may conflict: refining queries (R2) could alter rankings if tolerances/metrics aren't scale-invariant, violating R3.  
  - Weighted sums prioritize pragmatic stakes over truth-tracking; collapses truthlikeness to utility.  
  - Finite Q blocks logical collapse but risks mistaking local accuracy for global truthlikeness.  
  - Epistemology: cross-validation estimates predictive skill, not truth-proximity. Models tuned to Q may overfit, misrepresenting unseen domains.  
  - Realism undermined: QTL reduces "approximate truth" to empirical adequacy on fixed queries, abandoning explanatory depth.  
  - Language-dependence resurfaces via choice of metrics/tolerances, not syntax.  
  *Rejected angle: QTL as a "stepping stone" to full truthlikeness—no convergence guarantee.*

  ---

  ### Implications of Classical Collapse and Likeness Turn for QTL  

  **1. QTL replaces truthlikeness with purpose-relative accuracy, surrendering realism’s core ambition.**  
  The dominance and weighted-sum conditions measure *fitness for predictive tasks*, not proximity to truth. Truthlikeness requires global comparison of content or structure (e.g., via state-space similarity), but QTL restricts evaluation to finite, decision-bound queries. This pragmatizes truthlikeness: the agency’s tolerances and stakes define "closeness," not the theory’s intrinsic relation to reality. While useful for action, it cannot underwrite realism’s claim that successful theories latch onto deep structures.  

  **2. Language-dependence transmutes into metric-dependence, making R2 and R3 jointly unstable.**  
  Reparametrization invariance (R3) demands that rankings hold across equivalent physical variables (e.g., discharge vs. stage). Yet refining a query (R2) by tightening tolerances or splitting quantities can invert rankings if the distance metric isn’t linearly invariant (e.g., normalizing absolute vs. percentage errors). Worse, choosing tolerances or weights reintroduces subjectivity: a 5cm tolerance for water level implicitly privileges a Euclidean metric over alternatives. The collapse objection thus resurfaces as *arbitrariness in coarse-graining*, blocking objective truthlikeness.  

  **3. Epistemological gains are illusory: estimability tracks predictive performance, not truthlikeness.**  
  Cross-validation reliably ranks models *on observed queries* but cannot justify extrapolation to novel scenarios (e.g., 200-year events). Models selected via QTL may excel on Q by overfitting or compensating errors—yielding high accuracy without truthlikeness. If calibration optimizes for Q, the model’s global structure may drift further from truth (e.g., via unphysical parameters). We estimate *fitness-for-use*, not verisimilitude.  

  **4. QTL collapses realism into local empiricism, voiding "approximate truth" of explanatory power.**  
  Scientific realism uses truthlikeness to explain why theories succeed across diverse domains. QTL reduces this to fragmentary accuracy on isolated queries, losing the unifying thrust of mature theories. If M1 is "closer" only relative to Q, it cannot explain why *other* predictions succeed (e.g., sediment transport not in Q). Realism thus degrades to instrumental reliability for specified tasks—a position indistinguishable from structural empiricism.  

  **5. The logical problem’s unresolved core is reconciling likeness structure with language-independence.**  
  QTL sidesteps collapse by truncating the consequence set but inherits the likeness approach’s core challenge: justifying a *privileged metric* over state spaces. R3 gestures at this but fails without a physics-grounded similarity relation (e.g., thermodynamic free energy as a "natural" metric). Progress requires showing how likeness metrics can be fixed by ontological constraints (e.g., symmetry laws), not pragmatic choices.  

  **6. Weighted sums conflate epistemic and pragmatic value, severing truthlikeness from truth.**  
  Adding stakes-based weights (cardinal fallback) explicitly subordinates truth to utility. Truthlikeness should be *epistemically* valuable even for useless truths; QTL makes it derivative of social priorities. This severs the concept from alethic properties, reducing it to a decision-theoretic tool.  

  **7. Requirement R1 (blocking collapse) succeeds technically but sacrifices universality.**  
  Finite Q prevents false-consequence explosion, but only by shrinking truthlikeness to a finite-dimensional projection. This invalidates comparisons outside Q (e.g., M2 may better model groundwater flow—irrelevant until added to Q). Truthlikeness becomes non-archimedean: a model superior on Q could be vastly worse globally, undermining extrapolation.  

  ---

  ### Load-Bearing Assumption  
  The critical undefended assumption is that **truthlikeness can be fragmented into query-relative accuracy without losing its truth-connection**. QTL presupposes that performing well on a finite set of decision-critical queries licenses inferences about a model’s overall fidelity to reality. Yet this conflates empirical adequacy on *known* tests with counterfactual reliability. Without a principled link between Q-performance and global structure (e.g., via continuity or stability theorems in the model’s dynamics), QTL measures only *local* fit. The agency implicitly assumes that their queries "span" the truth-relevant space, but no argument is given for why accuracy on Q (even with tolerances) approximates truthlikeness rather than mere predictivism. This gap mirrors the likeness approach’s struggle to ground similarity in ontology rather than pragmatics.  

