  ### Half-Twins Thought Experiment: The Job Referral Pact

  **Setting:** Alice and Bob are two professionals in the same industry. They publicly commit to a pact: if either lands a major job opportunity, they'll refer the other for a similar role in their network, boosting both their careers. If both follow through, they each gain valuable connections and trust (mutual cooperation). If one defects (doesn't refer), they save time/effort and avoid potential competition, but exploit the other. If both defect, they maintain the status quo but miss out on opportunities. Crucially, after committing, each has an independent probability **ε** of "fumbling" (e.g., forgetting, miscommunication, or a moment of selfishness), causing them to defect regardless of intention. Stakes are realistic: career advancement, trust, and effort (payoffs below). No predictors or uploads; errors are human.

  **Payoff Matrix (per player, in "utility points"):**  
  - Both cooperate (CC): **+4** (strong mutual referral, net gain)  
  - You cooperate, other defects (CD): **−10** (wasted effort, exploited, career setback)  
  - You defect, other cooperates (DC): **+5** (exploit other, gain without cost)  
  - Both defect (DD): **0** (no change, no risk)  

  **Error Rate:** **ε = 0.2** (20% chance of independent fumbling per player).

  ---

  ### Verdicts at ε = 0.2
  1. **CDT (Causal Decision Theory):**  
     Defects. CDT ignores logical correlation and treats Bob's action as independent. Alice calculates:  
     - *Expected utility (EU) of cooperating*:  
       If Bob cooperates (prob. unknown, say *p*): she might fumble to D (ε) or not (1−ε).  
       If Bob defects (prob. 1−*p*): she risks −10 if she cooperates cleanly.  
       Without assuming *p*, CDT defaults to dominance: defecting guarantees ≥0, while cooperating risks −10. **EU(defect) > EU(cooperate)**.  
     - **Verdict: Defect.**  

  2. **EDT (Evidential Decision Theory):**  
     Cooperates. EDT conditions on Alice's intention:  
     - *If Alice intends cooperation*, she expects Bob (using same procedure) also intends C. With fumbling:  
       - Both succeed (CC): (1−ε)² × 4 = (0.8)² × 4 = 2.56  
       - Alice succeeds, Bob fumbles (CD): (1−ε)ε × (−10) = 0.8×0.2×−10 = −1.6  
       - Alice fumbles, Bob succeeds (DC): ε(1−ε) × 5 = 0.2×0.8×5 = 0.8  
       - Both fumble (DD): ε² × 0 = 0  
       **Total EU(intend C) = 2.56 − 1.6 + 0.8 = 1.76**  
     - *If Alice intends defection*, both defect (DD): EU = 0.  
     - 1.76 > 0, so **cooperate**.  

  3. **FDT (Functional Decision Theory):**  
     Cooperates. FDT models Alice and Bob as identical functions, so their actions correlate:  
     - Same calculation as EDT (since FDT uses identical reasoning in symmetric setups):  
       **EU(intend C) = 1.76** (as above).  
       **EU(intend D) = 0**.  
     - 1.76 > 0, so **cooperate**.  

  4. **Superrationality (Hofstadter-style):**  
     **No determinate answer.** Superrationality assumes *exact* correlation (ε=0). At ε>0, the premise fails:  
     - Fumbling breaks perfect symmetry; Alice and Bob aren't "identical" with independent errors.  
     - Superrationality offers no mechanism to handle ε>0—it either ignores errors (cooperates naively) or collapses.  
     - Here, it **cannot prescribe an action** without arbitrary adjustments.  

  ---

  ### Key Features and Thresholds
  - **Thresholds for flipping:**  
    - EDT/FDT cooperate if **EU(intend C) > EU(intend D)**, i.e., **4(1−ε)² −10(1−ε)ε + 5ε(1−ε) > 0**.  
      Simplified: **9ε² − 13ε + 4 > 0** (cooperation for **ε < ≈0.444**).  
    - CDT always defects (no threshold; defection dominates under independence).  
    - Superrationality fails for **any ε > 0**.  
  - **ε = 0 collapses to twin PD:** At ε=0, all theories (including superrationality) cooperate, as correlation=1 and payoffs favor mutual cooperation (4 > 0).  
  - **Feature doing the work:** The **high penalty for unilateral cooperation (CD = −10)** combined with **independent errors**. This makes defection tempting for CDT (avoids risk), while EDT/FDT still cooperate by accounting for correlated intentions. Superrationality lacks tools for probabilistic correlation.  

  ---

  ### Strongest Superrationalist Reply
  A superrationalist might argue: "At small ε, we approximate ε=0, so cooperate. The losses from fumbling are noise, not a flaw in the theory."  
  **Rebuttal:** This dodges the core issue—superrationality *formally requires* correlation=1. In cases like this (ε=0.2), cooperation yields 1.76, but if the penalty were higher (e.g., CD = −20), cooperation could be net negative. FDT/EDT adapt gracefully; superrationality does not. Its inflexibility makes it "unusable" for real-world noise.

  ---

  **Conclusion:** At ε=0.2 and this payoff matrix, CDT defects, EDT/FDT cooperate, and superrationality has no answer. The setup works with only public commitment and human error—no extra ingredients needed.
