prompt: |-
  I'm a PhD student finishing a chapter on Moore's axiology, and I've got an argument I built for my reading group that I now think proves something Moore would have refused — but I can't put my finger on the exact step where it goes wrong. The setting is the gap between the method he says must be used to settle questions of intrinsic value (the method of absolute isolation, set out at the start of the chapter on the Ideal in *Principia Ethica*) and his actual verdict that the greatest goods we can imagine are certain states of consciousness — roughly, personal affection and the appreciation of beauty — which he insists are highly complex organic unities, such that it is "these complex wholes themselves, and not any constituent or characteristic of them" that form the rational ultimate end. My worry is that the method and the verdict pull in opposite directions.

  Here is the argument as I numbered it: (1) The greatest intrinsic goods, for Moore, are organic unities: wholes made up of a consciousness together with its object (the friend, the beautiful thing), where the value of the whole is not the sum of the values of the parts. (2) Moore's method fixes both which things have intrinsic value and in what degree: take the candidate thing as existing by itself, in absolute isolation, and judge the value attaching to that isolated existence; degrees of value are settled by comparing isolated existences. (3) Run the test on the object-constituent. Moore grants that the mere existence of what is beautiful has some intrinsic value, but says its value is negligible in comparison with that which attaches to the consciousness of beauty — this is his own comparison, not mine. (4) Run the test on the mental constituent. A consciousness of beauty considered in isolation from any real object seems to retain nearly all of the value; and since what is supposed to matter is what the state is intrinsically — what it would be were it alone in the universe — an intrinsically indistinguishable but hallucinatory consciousness of beauty must come out equal in intrinsic value to the genuine article. (5) So the difference in value between (a) a world containing real friendship and real appreciation of real beauty and (b) a "Moorean machine" world containing only intrinsically indistinguishable conscious states, with no real friends and no real beautiful objects anywhere in it, is at most the negligible quantity fixed in (3) — perhaps nil. (6) But Moore cannot accept (5): he says the goods are the complex wholes and not any constituent or characteristic of them, and his defence of unperceived beauty against Sidgwick — the imagined comparison between an uninhabited world of extraordinary beauty and an uninhabited heap of filth, which he insists it is rational to prefer — shows that he wants the object-side to matter more than (3) permits. (7) Nor can he retreat to comparing wholes directly, because absolute isolation only ever tests single items, and if a part's value within a context is never a function of its value alone, the method returns no verdict on any comparison between two complex wholes that differ in more than one constituent — which is every comparison Moore actually wants to make.

  Which step do you reject? My own suspicion is that the damage is in the passage from (3) and (4) to (5): I have started calling that the Proxy Assumption, the assumption that a constituent's value in isolation stands in for what it contributes to the whole, and I notice that Moore himself warns, in discussing what he calls the second and more subtle error, that even where pleasure is the only constituent with any value by itself, the whole enjoyment owes its value quite equally to the presence of the other constituents. But if that is the answer, I want to know what Moore is left holding. I have tried replacing isolation with a counterfactual-subtraction test — the contribution of a constituent X to a whole W is the difference between the value of W and the value of W with X removed — and it seems to break down as well, because when you subtract the object from a case of appreciation you either leave the conscious state untouched and get a contribution of zero, which is just (5) again, or you change the state and thereby fail to hold fixed the very thing whose value you were trying to measure. One person in the group says the real rot is at (4): that a consciousness of beauty existing in absolute isolation is not a coherent object for the test at all, since an intentional state with no object is not the same state. To me that relocates the difficulty rather than solving it, but I may be wrong. So: name the step, explain why it looked sound, and price the alternatives — what does Moore lose if he gives up the Proxy Assumption, what does he lose if he gives up isolation as a procedure for ranking complex wholes, and is there any reading of the method on which it still generates his ranking of friendship and beauty above everything else? I am most attached to (1) and (6), least to (3), and I would rather keep the organic-unity doctrine than the method, if I have to choose.
reasoning: |-
  Okay, let me unpack this PhD student's dilemma. They're wrestling with a core tension in Moore's axiology between his isolation method and organic unities doctrine. The argument they've constructed seems to show that Moore's greatest goods (personal affection and aesthetic appreciation) collapse in value when subjected to his own method of absolute isolation. 

  First, I need to trace the logical steps carefully. The key movement is from premises about isolated part-values (steps 3-4) to the conclusion about whole-value comparisons (step 5). The student suspects this "Proxy Assumption" is faulty - and I think they're onto something important. Moore explicitly warns against equating a part's isolated value with its contribution to a whole. 

  Hmm, the deeper issue might be methodological. Absolute isolation works poorly for organic unities because: (a) it atomizes what Moore says can only be valued holistically, and (b) it creates paradoxes when testing intentional states (can you isolate "consciousness of beauty" without its object?). The student's group member who challenges step 4 has a point about intentionality, but that doesn't fully resolve the tension - it just shifts it to whether such states can even be tested in isolation.

  What's really at stake? If Moore abandons the Proxy Assumption, he saves organic unities but undermines isolation's usefulness. If he rigidly applies isolation, he loses the special status of complex goods. His actual practice suggests he wants both: isolation for identifying bearers of value, but organic unity for explaining why wholes trump parts. 

  The student's counterfactual-subtraction test fails too - it either ignores holism (getting contribution=0) or alters the whole. This confirms isolation-based methods struggle with interdependence. Perhaps Moore's method was only meant for initial screening, not final comparisons. His beauty-vs-filth example shows he prioritizes holistic judgments despite methodological proclamations.

  For the student's thesis, I'd emphasize that Moore's tension reveals a deeper problem in value theory: how to assess parts within context-dependent wholes. Their insight about the Proxy Assumption is correct - preserving organic unity requires rejecting that assumption. The cost is methodological: isolation becomes merely heuristic. But since the student values organic unity over method, this might be an acceptable outcome for their chapter.
answer: |-
  Your argument is sharp and exposes a genuine tension in Moore's axiology. The core problem lies in the **Proxy Assumption (in the move from (3) & (4) to (5))**, and its incompatibility with the doctrine of organic unities. Let's break it down:

  1.  **The Faulty Step: From (3) & (4) to (5)**
      *   **Why it looks sound:** It seems logically straightforward. If isolation tells us the object-component (real beauty) has negligible intrinsic value (3), and the consciousness-component (experience of beauty) has *almost all* the intrinsic value whether real or hallucinatory (4), then combining these results suggests the difference in value between a world with real objects and a "Moorean machine" world lacking them is negligible. This relies on the Proxy Assumption: the value a part contributes to a complex whole is equal to (or at least closely approximated by) its intrinsic value *in isolation*.
      *   **Why Moore must reject it (and you should too):** This assumption is **precisely what the doctrine of organic unities denies**. Moore explicitly states: "**The part of a valuable whole retains exactly the same value when it is, as when it is not, a part of that whole.** If it had value under other circumstances, its value is not any greater, when it is part of a far more valuable whole; and if it had no value by itself, it has none still, however great the value of the whole may be of which it now forms a part." (*Principia Ethica*, §18). Crucially, he *immediately follows this* with: "**It follows from this that the existence of a part of a valuable whole... has no intrinsic value whatsoever, if that part has no intrinsic value whatsoever apart from its existence in that whole...**" BUT, and this is the key: **The value of the whole is *not* the sum of the values of the parts *in isolation*.** The whole possesses a value *sui generis* that arises *only* from the specific combination. The value contributed *by the relation* or *by the specific combination* is not located in any part *by itself*.
      *   **Applying the Correction to Your Argument:** (3) and (4) tell us the *isolation values* of the parts. (5) mistakenly assumes these isolation values determine the *difference* the parts make when combined. Moore denies this. The real beauty (object) might have negligible isolation value (3), and the consciousness might have high isolation value whether real or hallucinatory (4). **However, the *presence* of the *real object* in the *specific relation* of being *appreciated* (or being the object of affection) is *essential* to the generation of the *unique, non-additive, high value of the whole organic unity*.** The isolation value of the object doesn't "stand in" for its contribution; its contribution is constituted by its specific relational role in generating the whole's emergent value. The negligible isolation value of the object doesn't imply it contributes negligibly to the whole; its contribution is defined by its role in making the whole *this specific valuable unity*, distinct from the hallucinatory state (which is a different kind of whole, or perhaps not a valuable whole at all in the same way).

  2.  **The Cost of Rejecting the Proxy Assumption:**
      *   **What Moore Loses:** He loses the ability to use the method of isolation as a *direct calculator* of the comparative value of complex wholes or the contributions of their parts. Isolation tells him *only* the intrinsic value of the *isolated item itself*, not what that item *does* when combined with others. The method is excellent for identifying *simple bearers* of intrinsic value (like pleasure) but becomes much less useful, or even misleading, when applied to *parts* of organic unities to determine their contribution or when trying to *rank* complex wholes differing in multiple parts.
      *   **What Moore Keeps/Has to Rely On Instead:** He retains the doctrine of organic unities. He must rely on the method of isolation primarily to identify the *bearers* of intrinsic value (the wholes themselves) and to identify *some* intrinsically valuable parts (like pleasure). **To compare complex wholes or understand the *source* of a whole's value, he must appeal to a *direct, holistic intuition* of the value of the whole state *as such* in comparison to others.** This is essentially what he *does* in his examples: he asks us to intuit the difference in value between contemplating real beauty vs. contemplating an ugly object, or between a beautiful uninhabited world and a heap of filth. He cannot break this down mechanically using isolation values of parts.

  3.  **Addressing the Other Suspect Steps:**
      *   **(4) The Isolation of Consciousness:** The intentionality objection (that an isolated "consciousness of beauty" without an object is incoherent) is powerful and highlights another flaw in applying isolation rigidly to relational states. While Moore might insist we *can* conceive of an intrinsically indistinguishable hallucinatory state, the objection underscores how the method strains when applied to intentional phenomena. This *reinforces* the problem with the Proxy Assumption but isn't the *primary* flaw. The primary flaw is treating the isolation value as a proxy for contribution, even *if* the state could be isolated coherently.
      *   **(7) Comparing Wholes:** You're right that the isolation method, strictly applied, cannot directly compare complex wholes differing in multiple constituents. Moore implicitly relies on holistic intuition for this. He *tries* to use isolation to support his claims (e.g., comparing the uninhabited beautiful world vs. filth), but this comparison only works if we accept that the beauty of the world *as a whole* has intrinsic value *as a whole* (which he does), not by summing parts. The method *can* still be used to compare *wholes* considered *as single items* in isolation (e.g., "a friendship" vs. "a pile of gold" vs. "a beautiful uninhabited landscape"), even if those wholes are complex. The problem arises when trying to decompose them via their parts using isolation.

  4.  **Saving Moore's Ranking (Barely):**
      Is there a reading where isolation generates his ranking? Only weakly and indirectly.
      *   Isolation identifies pleasure as intrinsically good, but Moore argues pleasure alone is vastly inferior to the complex goods.
      *   Isolation *might* show that the *consciousness* part has significant intrinsic value (even hallucinated), suggesting conscious states are crucial.
      *   However, the *crucial superiority* of the complex goods (friendship, appreciation of real beauty) over simpler goods (pleasure, hallucination) **cannot be derived by summing or comparing isolation values of parts.** It relies entirely on the holistic intuition that *these specific complex wholes*, when considered in isolation themselves, are judged (intuited) to be *far* more valuable than simpler states or other combinations. The uninhabited beautiful world example is key: Moore intuits that *this complex state of affairs* (beautiful objects existing in relation) has significant intrinsic value *as a whole*, greater than a world of filth, even with no consciousness present. He then argues that adding consciousness *appropriately related* to real beauty creates an *even greater* organic unity. The method isolates *the whole state* (beautiful uninhabited world) and intuits *its* value; it doesn't decompose it via parts. Similarly, he isolates the whole "state of appreciating real beauty" and intuits *its* supreme value.

  **Conclusion:**

  Your identification of the Proxy Assumption as the culprit is correct. Moore's method of isolation fundamentally conflicts with his doctrine of organic unities when used to decompose complex goods and calculate contributions or value differences based on part-values. To preserve organic unities (which you prefer, and which is central to his examples and critique of hedonism/simplistic summation), Moore must abandon the idea that isolation values of parts tell us about their contribution to wholes. The cost is that isolation becomes primarily a tool for identifying *simple* bearers of intrinsic value and for identifying the *complex wholes themselves* as the ultimate bearers. Comparing these wholes and understanding why they are valuable *requires holistic intuition*, not decomposition via the isolation method. Moore's actual practice relies heavily on this holistic intuition, even if his methodological pronouncements suggest a more atomistic procedure. He loses a clean, mechanical method for deriving comparative value judgments about complex organic unities, but saves the core of his axiological claims about what is ultimately valuable.

  For your chapter, emphasizing this tension and how Moore's reliance on holistic intuition *despite* his methodological atomism is crucial to understanding both the power and the limitations of his "Ideal" is a strong critical point. He can't have it both ways consistently.
