    However, the instrumental convergence argument says that F1 might lead to instrumental goals of self-preservation and resource acquisition. So we must separate final from instrumental.

    For the procedure, we are trying to attribute the final goal. We start by assuming that the final goal is the assigned one (F1) and then see if the behaviors are instrumental to F1 or if they are better explained by another final goal.

    Alternatively, we can have a goal space of:
