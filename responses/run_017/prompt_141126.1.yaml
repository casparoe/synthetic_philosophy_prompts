prompt: |-
  You are a decision scientist who advises research and development organizations on escalation of commitment, and you are fluent in the formal literature on the dollar auction and wars of attrition. Think carefully before you answer: begin by listing the ways the dollar-auction framing can misfire when it is imposed on a real organization, and only then build the procedure.

  I chair the quarterly go/no-go review at a mid-sized biotech, roughly 200 people. We make six to ten continue/kill decisions per quarter in a single half-day, the CEO signs off, and the program leads in the room are the people who built the programs. The standard advice, that sunk costs are irrelevant and only forward-looking value counts, gets quoted and then quietly ignored, because two features of our situation make it look less like a bad investment and more like a dollar auction: the commercial prize is winner-take-most, so second place is worth very little, and much of what we have already spent is unrecoverable in a way that is mirrored on the other side, since the rival still in the race has burned comparable money that their exit would also strand. Our head of business development uses exactly this to argue the reverse of the standard conclusion: if a rival is still funding, that is evidence the asset is worth more than our own numbers say, so killing is the real mistake.

  I need a reusable procedure, not a one-off opinion. Please give me, in order: a screening step that sorts each program into the structures that actually matter, meaning a genuine two-sided contest with an observable rival, an ordinary one-sided escalation whose only opponent is our own prior spend, and what I think of as the phantom bidder case, where a rival is invoked rhetorically but is not really still bidding or whose exit we cannot observe; the tests to run after screening, with what counts as a sufficient answer to each, where the procedure stops with a no, and what to do when the number a test needs is simply unavailable, as it usually is; an explicit treatment of the persistence-as-evidence argument, covering when a rival's continued funding is information about the size of the prize, when it is only their own escalation, and how to tell the difference without access to their data; the points where judgment cannot be eliminated and a named person must decide, flagged honestly as judgment calls dressed up as procedure; and what the procedure cannot do. Then run it on three cases: a mid-stage asset whose rival just published strong data, a program whose rival left the field two years ago while our team still describes the space as a race, and one where I expect to dislike the answer, our flagship program, the one the company was founded on, now three years behind the leader. Answer in American English throughout.
reasoning: |-
  We are designing a procedure for go/no-go decisions in a biotech context with potential dollar-auction dynamics. The key challenge is that sunk costs should be irrelevant, but in winner-take-most markets with observable rivals, the behavior of rivals can provide information about the value of the prize. However, we must be cautious not to fall into escalation traps.

  The procedure will have the following steps:

  1. **Screening Step**: Classify each program into one of three structures:
     - **Genuine Two-Sided Contest**: There is at least one observable rival still actively investing (e.g., recent funding announcements, pipeline updates, clinical trial progress).
     - **Ordinary One-Sided Escalation**: No active rival is present; the only driver for continuation is the sunk cost.
     - **Phantom Bidder Case**: A rival is mentioned but there is no evidence of recent activity (e.g., no updates in over 18 months) or the rival has publicly exited but our team still talks as if they are in the race.

     **Criteria for screening**:
     - **Two-Sided**: Evidence of rival's active investment within the last 12 months (e.g., press release, clinical trial registry update, financial report).
     - **One-Sided**: No rival is claimed, or the last known rival exited more than 12 months ago and no new rival has entered.
     - **Phantom**: The rival is cited but there is no evidence of activity in the last 12 months, or the rival has announced discontinuation but our team dismisses it.

  2. **Tests to Run After Screening**:

     - **For Two-Sided Contests**:
       - **Test 1: Rival's Commitment Strength**: Collect evidence on the rival's financial health and strategic focus. If the rival is well-funded and the program is a priority, that is a positive signal. If the rival is struggling or has diversified, that is negative.
          - *Sufficient Answer*: Public financials, recent funding rounds, management statements. If the rival is private and data is unavailable, skip to judgment call.
          - *Stop with No*: If the rival has publicly de-prioritized the program or is in financial distress, then the contest may be collapsing and continuation is risky.
       - **Test 2: Relative Position**: Compare our progress and resources to the rival. Are we ahead, even, or behind? If behind, what is the probability of overtaking?
          - *Sufficient Answer*: Objective milestones (e.g., phase of clinical trials, patent status). If behind by more than 18 months and the rival is well-funded, consider killing.
          - *Stop with No*: If we are more than 24 months behind and the rival is in a strong position (e.g., in Phase 3 while we are in Phase 1) and the market has high barriers to entry for followers.
       - **Test 3: Prize Size Re-Estimation**: Use Bayesian updating. The prior is our original valuation. The rival's continued investment is evidence that the prize might be larger. But we must adjust for the possibility that the rival is also escalating due to sunk costs.
          - How: 
            - Let V_our be our estimated value of the prize.
            - We observe that the rival is still investing. This could be because (a) they have a higher valuation (V_rival > V_our) or (b) they are trapped in escalation.
            - We need to assess the probability that the rival is rational (i.e., they have good information and are not escalating irrationally). If they are rational, then their continuation suggests V_rival > cost to complete for them. But note: their cost to complete might be lower than ours.
            - Without access to their data, we can use:
              - The rival's historical accuracy in program advancement (if they have a track record of advancing only high-value programs, that's a positive signal).
              - The rival's overall R&D productivity (if they are known for making good decisions, take it as a stronger signal).
            - *Sufficient Answer*: If we can assign a probability that the rival is acting on good information (e.g., based on their past performance, or if they have recently raised money specifically for this program), then update V_our upward by a factor (e.g., 10-50%? This is a judgment) but only if we are not far behind. If we are far behind, even a higher prize might not justify continuing because we may not win.
            - *Stop with No*: If the updated value (after considering the rival's signal) still does not meet our hurdle rate (e.g., NPV positive at our cost of capital) and we are behind, then kill.
            - *When Data Unavailable*: Default to a judgment call (see below).

     - **For One-Sided Escalation**:
       - **Test**: Ignore sunk costs. Recalculate the forward-looking NPV (or expected value) with current information. If positive, continue; if negative, kill.
          - *Sufficient Answer*: Financial model with updated probabilities and costs.
          - *Stop with No*: If NPV < 0.

     - **For Phantom Bidder**:
       - **Test 1**: Verify rival status. Require evidence of active investment (as in screening). If none, reclassify as one-sided.
       - **Test 2**: If the team insists the rival is active but stealthy, require intelligence (e.g., job postings, conference presentations, patent filings). If none, treat as one-sided.

  3. **Explicit Treatment of Persistence-as-Evidence**:

     - **When is rival's funding information about the prize?** 
       - When the rival has a track record of rational decision-making and the decision to continue is likely based on new positive information (e.g., they just got positive Phase 2 data and then doubled down).
       - When the rival is well-informed (e.g., they have a different data set, such as from a clinical trial, that we don't have) and we can observe their commitment (e.g., they are investing more than would be justified by sunk costs alone).

     - **When is it only their own escalation?**
       - When the rival is known for escalating commitment (check their history: do they often take programs to failure?) or when they are financially constrained but still spending (a sign of desperation).

     - **How to tell without their data**:
       - Look for external signs: 
         - Has the rival recently raised capital specifically for this program? (Information)
         - Have they had setbacks but continued anyway? (Escalation)
         - What is the turnover in their project leadership? (High turnover might indicate internal conflict and escalation; stability might indicate confidence.)
       - Use industry benchmarks: How often do programs at this stage in this disease area succeed? If the rival is continuing despite a setback that typically causes failure, that's more likely escalation.

  4. **Judgment Calls** (must be made by a named person):

     - **Named Person**: The Head of R&D (or equivalent) for technical judgments, CFO for financial, and CEO for strategic.
     - **Points of Judgment**:
       - In Two-Sided contests: 
         - The probability that the rival is acting on information (vs. escalating) when data is scarce.
         - The adjustment factor for the prize size based on rival's continuation.
         - The assessment of whether we can overtake the rival (if behind).
       - In all cases: 
         - When data is unavailable for a required test, the judgment is whether to proceed without it or commission new analysis (which may delay the decision).
         - The final go/no-go when the tests are inconclusive.

  5. **What the Procedure Cannot Do**:

     - It cannot eliminate the risk of escalation entirely; it only structures the decision.
     - It cannot provide perfect information about rivals.
     - It cannot account for unobservable factors (e.g., a rival's secret data).
     - It may not capture multi-rival dynamics (we assume one main rival, but sometimes there are several).

  ---

  **Running the Procedure on Three Cases**:

  **Case 1: Mid-stage asset whose rival just published strong data**

  - **Screening**: Genuine Two-Sided (rival active and recent data).
  - **Tests**:
    - Test 1: Rival's Commitment Strength - Strong (just published positive data, likely committed).
    - Test 2: Relative Position - We are behind (they have strong data, we are at an earlier stage or have less compelling data). Need to assess if we can catch up. If we are more than 18-24 months behind, that's a red flag.
    - Test 3: Prize Size Re-Estimation - The rival's data is public, so we can update our own valuation. The rival's continuation is rational (based on new data), so we should increase our estimate of the prize. But if we are far behind, even a larger prize might not be captureable by us.
  - **Judgment**: If the updated prize (after incorporating the rival's data) still does not justify the cost and risk of catching up, then kill. The Head of R&D must judge the feasibility of overtaking.

  **Case 2: Program whose rival left the field two years ago, but our team still describes it as a race**

  - **Screening**: Phantom Bidder (rival exited two years ago, no evidence of return).
  - **Tests**:
    - Test 1: Verify rival status - No activity for two years, so reclassify as One-Sided.
    - Then run One-Sided test: Recalculate forward-looking NPV ignoring sunk costs. If negative, kill.
  - **Judgment**: If the team insists the rival might return, require evidence. Without evidence, the CFO judges the financial model.

  **Case 3: Flagship program, three years behind the leader**

  - **Screening**: Genuine Two-Sided (if the leader is active) or if the leader is the only rival and they are far ahead.
  - **Tests**:
    - Test 1: Rival's Commitment Strength - Likely strong (they are the leader and probably investing to win).
    - Test 2: Relative Position - We are three years behind. This is a major gap. Overtaking is unlikely unless we have a disruptive technology. If not, this is a strong 'no' signal.
    - Test 3: Prize Size Re-Estimation - The rival's continuation might signal a large prize. But if they are close to market, their continuation is expected. We must update our prize estimate based on their progress (e.g., if they are in Phase 3, the probability of success is higher). However, being three years behind, we must discount the prize by the probability of winning (which is low).
  - **Judgment**: The CEO must make a strategic call: is there a path to win (e.g., a different indication, a superior product)? If not, even a large prize might not be attainable. The procedure likely points to kill, but the CEO might override if there are non-financial reasons (e.g., company reputation, platform learning). However, the procedure flags this as high risk of escalation.

  Note: In the flagship case, if the updated NPV (factoring in low probability of winning) is negative, the procedure says kill. But the CEO must acknowledge the judgment in overriding (if they do) and document the non-financial reasons.

  ---

  **Final Procedure Outline**:

  1. **Screen** each program into Two-Sided, One-Sided, or Phantom.
  2. **For Two-Sided**:
     - Assess rival's commitment strength (using public data). If rival is weak, consider killing.
     - Compare relative position. If behind by more than 24 months, kill unless there is a clear disruptive advantage.
     - Re-estimate prize size, incorporating the rival's continuation as a signal. Use Bayesian reasoning (if possible) or a judgment-based adjustment. Then recalculate NPV. If negative, kill.
  3. **For One-Sided**: Calculate forward-looking NPV. If negative, kill.
  4. **For Phantom**: Reclassify as One-Sided (if rival is inactive) and then run the One-Sided test.
  5. **At each step**, if data is unavailable, escalate to the named judgment holder (Head of R&D, CFO, or CEO) for a call.
  6. **Document** the decision and the rationale.

  This procedure forces a structured analysis and reduces (but doesn't eliminate) the risk of escalating due to sunk costs or phantom rivals.
answer: |-
  ### Procedure for Go/No-Go Decisions in Winner-Take-Most Biotech R&D  
  **Designed to address dollar-auction dynamics, sunk cost fallacies, and rival-based escalation.**  

  ---

  #### **Step 1: Screening (Classify Program Structure)**  
  Sort each program into one of three categories using **verifiable, time-bound evidence**. Decision requires input from Business Development (BD) and Competitive Intelligence (CI) teams.  

  | **Category** | **Definition** | **Evidence Required** | **Default if Evidence Unavailable** |
  |--------------|----------------|------------------------|-------------------------------------|
  | **Genuine Two-Sided Contest** | At least one rival is actively investing, with observable commitment to win. | Proof of rival’s R&D spend/action in **last 12 months** (e.g., clinical trial update, press release, SEC filing, patent filing, earnings call mention). | Phantom Bidder (if rival claimed but evidence stale). |
  | **Ordinary One-Sided Escalation** | No active rival; continuation driven solely by internal sunk costs. | Rival exit confirmed >12 months ago, **or** no rival ever existed. | One-Sided (assume no rival). |
  | **Phantom Bidder** | Rival is rhetorically invoked but either inactive or unobservable. | Rival cited by program team, but **no proof of activity in 12 months**, **or** rival exit confirmed but downplayed. | Re-screen with CI team; if unresolved, treat as One-Sided. |

  **Output**: Category assigned per program. If disputed, CI team casts tiebreaker vote.  

  ---

  #### **Step 2: Tests to Run (After Screening)**  
  **Conduct tests sequentially**. Stop early if any test yields a "Kill" signal. Use **thresholds** for objectivity.  

  ##### **A. For Genuine Two-Sided Contests**  
  *Tests evaluate if rivalry justifies escalation.*  

  1. **Test 1: Rival’s Financial Commitment**  
     - **Question**: Is the rival funding this program at a level suggesting rational pursuit (not desperation)?  
     - **Data**: Rival’s R&D budget allocation (public filings), funding rounds, pipeline prioritization.  
     - **Sufficient Answer**: Evidence rival spends >20% of program’s forward costs annually.  
     - **Kill Signal**: Rival deprioritized program (e.g., removed from pipeline) or shows financial distress (e.g., stock plunge >50%, layoffs).  
     - **Data Unavailable**: Skip to Test 3; rely on judgment.  

  2. **Test 2: Relative Competitive Position**  
     - **Question**: Are we within striking distance to win?  
     - **Data**: Milestone gaps (e.g., trial phases, regulatory submissions), IP position, resource gaps.  
     - **Sufficient Answer**: Quantified gap ≤18 months (per independent project manager assessment).  
     - **Kill Signal**: Gap >24 months **and** no disruptive advantage (e.g., superior technology, patent moat).  
     - **Data Unavailable**: Commission 3-week feasibility study; if delayed, judgment call.  

  3. **Test 3: Prize Size Re-Estimation**  
     - **Question**: Does rival persistence indicate a larger prize?  
     - **Data**: See *Explicit Treatment* below.  
     - **Sufficient Answer**: Bayesian update (e.g., +20–50% to prize value) if rival is "rational actor."  
     - **Kill Signal**: Updated prize value still <1.5× forward costs (hurdle rate for high-risk programs).  
     - **Data Unavailable**: Use conservative 0% adjustment; proceed to cost-benefit.  

  ##### **B. For One-Sided Escalation**  
  *Ignore rivals; focus on forward value.*  
  - **Test: Forward-Looking NPV**  
    - **Question**: Expected value > forward costs?  
    - **Data**: Risk-adjusted NPV (base case + downside case).  
    - **Sufficient Answer**: NPV >0 at company hurdle rate (e.g., 12%).  
    - **Kill Signal**: NPV ≤0.  
    - **Data Unavailable**: CFO judgment.  

  ##### **C. For Phantom Bidder**  
  *Eliminate phantom to prevent false escalation.*  
  - **Test: Rival Activity Verification**  
    - **Question**: Is the rival truly active?  
    - **Data**: CI report (primary research: job postings, conference abstracts, KOL interviews).  
    - **Sufficient Answer**: Proof of activity **or** confirmation of exit.  
    - **Reclassification**: Active → Two-Sided; Inactive → One-Sided.  
    - **Kill Signal**: None (re-screen first).  
    - **Data Unavailable**: Treat as One-Sided.  

  ---

  #### **Step 3: Explicit Treatment of "Persistence-as-Evidence"**  
  Addresses BD’s argument: *"Rival funding proves the prize is bigger."*  

  - **When Persistence Signals Prize Size**:  
    - Rival is a "rational actor": Strong track record (≥60% historical success rate), no sunk cost behavior (e.g., kills 30% of programs annually), and transparency (e.g., publishes data).  
    - **Test**: Compare rival’s persistence to their typical behavior. If they *accelerate* funding after new data (not just maintain), it’s likely information-driven.  

  - **When Persistence Signals Escalation**:  
    - Rival has high sunk costs, emotional commitment (e.g., CEO champion), or poor governance (e.g., no stage-gates).  
    - **Test**: Look for "escalation markers": leadership turnover, shrinking trial sizes, or funding from non-strategic sources (e.g., emergency equity).  

  - **How to Tell Without Rival Data**:  
    - **Proxy Indicators**:  
      - Rational: Patent citations, peer-reviewed publications, hiring KOLs.  
      - Escalating: Litigation (patent challenges), delayed milestones, CRO contract cancellations.  
    - **Threshold**: If ≥2 escalation markers, discount rival’s persistence (0% prize adjustment). If ≥2 rational markers, apply prize adjustment (Test 3).  

  ---

  #### **Step 4: Judgment Calls (Named Person Must Decide)**  
  **Eliminate ambiguity; document rationale.**  
  - **Test 1 (Two-Sided)**: Rival financials unavailable → **CFO** judges funding likelihood.  
  - **Test 2 (Two-Sided)**: Gap unclear → **Head of R&D** judges feasibility of winning.  
  - **Test 3 (Two-Sided)**: Prize re-estimation → **CEO** approves adjustment % (0–50%).  
  - **Phantom Bidder**: CI can’t verify rival → **BD Head** confirms/denies rivalry.  
  - **All Cases**: Data delays → **Program Lead** decides to wait or proceed.  

  ---

  #### **What the Procedure Cannot Do**  
  1. **Predict irrational rival behavior** (e.g., rivals escalating due to ego).  
  2. **Value non-financial factors** (e.g., scientific prestige, employee morale).  
  3. **Handle multi-rival dynamics** (assumes one primary competitor).  
  4. **Override CEO/Board prerogatives** (e.g., strategic pivots).  

  ---

  ### **Procedure Applied to Three Cases**  

  #### **Case 1: Mid-Stage Asset (Rival Published Strong Data)**  
  - **Screening**: Genuine Two-Sided (recent data = observable activity).  
  - **Tests**:  
    1. **Rival Commitment**: Rival doubled investment post-data → Pass (rational).  
    2. **Relative Position**: We’re 10 months behind → Pass (gap ≤18mo).  
    3. **Prize Re-Estimation**: Apply +30% prize adjustment (rival’s data validates asset). NPV > hurdle → **Go**.  
  - **Judgment**: None (data sufficient).  

  #### **Case 2: Program with Rival Exit 2 Years Ago (Team Claims "Race")**  
  - **Screening**: Phantom Bidder (rival exit confirmed; team ignores).  
  - **Tests**:  
    - **Rival Verification**: CI confirms no activity → Reclassify as One-Sided.  
    - **Forward NPV**: Negative (market shrunk post-rival exit) → **Kill**.  
  - **Judgment**: BD Head insists rival may return → Overruled (no evidence).  

  #### **Case 3: Flagship Program (3 Years Behind Leader)**  
  - **Screening**: Genuine Two-Sided (leader active).  
  - **Tests**:  
    1. **Rival Commitment**: Leader funding steady → Pass.  
    2. **Relative Position**: 36-month gap, no disruptive tech → **Kill Signal** (gap >24mo).  
    3. *[Test 3 skipped: Kill triggered]*  
  - **Judgment**: CEO may override for strategic reasons (e.g., platform IP value). If overridden, document as escalation risk. **Procedure Recommends Kill**.  

  ---  
  **Final Note**: This procedure forces explicit rivalry checks, quantifies gaps, and bakes in off-ramps. Update annually with lessons learned.
