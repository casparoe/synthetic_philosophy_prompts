  Interesting that they care about practical implications too (analgesics, childbirth). That's smart—it pressures evaluativism to explain why we'd ever manipulate the attitude rather than the sensation if badness is truly intrinsic. The "what counts as evidence" request shows they want philosophical rigor, not just debate.

  *checks papers on asymbolia* Right, evaluativists like Bain and Cutter do claim asymbolics still experience badness but lack care. But the user's hypothetical drug makes that position awkward: if you can surgically remove caring while preserving sensation, doesn't that suggest badness was never in the sensation to begin with? 

  For Q1, I'll make them define the phenomenal difference between normal pain and "uncared-about badness." Follow-up: how can we tell it's not just a semantic difference? Then Q2 traps them: if asymbolics have no reason for analgesics, doesn't that concede badness alone doesn't motivate? 

  The childbirth scenario (Q6) is genius—it exposes whether evaluativists think pain's badness is objective. If the guest says indifference therapy treats pain, they admit badness can be divorced from experience; if not, they must explain why numbing care doesn't count as pain relief. 

