prompt: |-
  I'm a third-year in a normative ethics seminar and I also coordinate a student mutual-aid fund on campus — we hand out small emergency grants (rent, dental work, a bus ticket home, replacing a stolen laptop) from money that comes mostly from student-government dues plus a few outside donors. We get around twenty requests a week, each one has to be answered inside 48 hours, and the people actually deciding are me and two other undergrads who are exhausted and doing this at 11pm between problem sets. Anything over $250 needs two of us to sign off, and changes to the written policy have to go past student government, so whatever we adopt has to be explainable to them and to donors in plain language. Last week in seminar we did the demandingness objection and it basically wrecked the group chat: one person said that if the maximizing version is right then the fund should be telling all of us to give until we're at roughly the level of the people we're helping, and that this is absurd enough to sink the theory; someone else said that objection only shows that a rule which eats the very capacities and relationships you need to keep following it is self-defeating, not that the theory is wrong; and a third said the whole thing dissolves once you distinguish doing your fair share from picking up the slack for everyone who isn't doing theirs. I don't need that argument settled in the abstract — I need to turn whatever survives it into something my team can actually run, forty times a month, without re-deriving it from scratch each time.

  So: please write me a decision procedure, as a checklist or a flowchart in words, that takes a consequentialist starting point seriously but has a real answer to the demandingness worry built into it rather than bolted on. Concretely I want the questions in the order we should ask them, what counts as a sufficient answer to each (including what to do when we just can't get a number), the point where the procedure stops with a no, and the point where it hands the decision to a person because the question is one of values and not facts — and I want those two kinds of step labeled as such, because I can already tell which parts are judgment calls wearing a lab coat. It has to be runnable in about ten minutes on a one-page form by someone with no philosophy, and it has to be stable week to week: a rule that ratchets upward every time a new request lands in the inbox is one we will quietly stop following by November, and I'd rather have a rule we can actually stick to than an optimal one we abandon. Three or four things I keep hitting and don't know how to write into the form: (1) the slack question — almost nobody else on campus gives anything, so are we setting the bar at our share of the total need, or at whatever actually needs doing given that no one else is doing it, and is it suspiciously convenient that the people choosing the bar are the same people who pay it? I half want a test like "what would this policy look like if an auditor who disliked us applied it to us," but I don't know if that's principled or just a guilt device. (2) Whether our own stuff — coursework, relationships, sleep, the fact that we're doing this for free — is a side-constraint that caps what can be demanded of us, or just another item to weigh against a grant, because the two give very different answers when a local food bank tells us that every extra volunteer hour is a measurable number of meals. (3) The re-ask problem: the same few people apply every month, and a rule that treats each request as a fresh opportunity never stops, while a rule that caps them feels like it's punishing people for being poor in the same place twice. (4) Whether the procedure is even allowed to spend money on keeping itself going, or whether that's just self-indulgence with a nicer name.

  Then please run it on three cases so I can see if it holds up. First: a request for $400 for emergency dental work, arriving in a week when we have about $2,000 left and twelve other pending requests, and no way to verify more than what the applicant wrote on the form. Second: the food bank asks us to supply volunteers, and the question on the table is whether we start asking our own members to go from two hours a week to eight during finals, given that the extra hours really do convert into meals and that two of our members are already borderline burned out. Third — and this is the one where I already know I won't like the answer — we have $300 and have to choose between spending it on a thank-you dinner and hoodies for our volunteers (which reliably stops people from quitting, and we have lost volunteers to exactly this) or giving it out as one more grant. For each, show the procedure actually crunching through its steps and where it terminates, and be straight with me if the one I'm dreading comes out against me. Finally, tell me what the procedure can't do: which of these questions it's really just relabeling, where it will systematically misfire (I'm especially worried it will end up funding whoever tells the most vivid story in person, since that's what makes a demand feel binding), and what we should do in the first month to find out whether we're following it or just rationalizing whatever we were going to do anyway.
reasoning: |-
  Okay, let me approach this systematically. The user is clearly deeply engaged with both ethical theory and practical constraints, so I need to meet them at that intersection. 

  First, unpacking the core tension: they need a decision procedure that respects consequentialism while solving real-world problems like volunteer burnout, recurring requests, and institutional constraints. The seminar arguments about demandingness aren't abstract here - they're crashing into a mutual-aid fund that handles 20 requests weekly with exhausted undergrads. 

  Key pain points I notice:
  - The "re-ask problem" where frequent applicants create moral tension between consistency and sustainability
  - Whether volunteer wellbeing is a hard constraint or just another factor in the calculus (that food bank example is brutal)
  - The meta-question of whether the system can invest in its own survival (hoodies vs grants)

  Hmm... the "auditor test" idea is fascinating - it feels like a Rawlsian veil of ignorance but with teeth. If we bake that in, it might resolve the "suspiciously convenient" problem when setting limits. 

  For structure: a flowchart would work best but must be explainable in words. Should have clear "stop" points and "judgment call" flags. Need to prevent ratcheting - maybe built-in cooling off periods? 

  Biggest design challenge: making the "fair share" calculation operational. Can't just say "do your part" when others aren't contributing. Maybe define it as "what we could sustainably do if everyone at our privilege level participated" - that passes the auditor test. 

  For the cases: 
  - That dental request with 12 pending... procedure must force triage, not just individual assessment
  - Volunteer hours during finals... here's where "capacity as constraint" not trade-off matters most
  - Hoodies funding... oof. If it demonstrably prevents collapse, it might be justifiable as system maintenance

  Gotta watch for bias toward vivid stories. Could add a "debrief after decision" step where they review whether narrative swayed them. 

  Final thought: they're right that any "optimal" system they abandon is worse than a "good enough" one they'll actually use. Sustainability isn't a compromise - it's the core ethical act here.
answer: |-
  Here's a consequentialist decision procedure with built-in demandingness safeguards, designed for speed, stability, and transparency. It prioritizes **sustainable impact** over theoretical perfection.

  **Decision Procedure: "Sustainable Impact Triage" (SIT) Flowchart**

  **CORE PRINCIPLE:** Maximize *reliable, sustainable* good within *explicit operational boundaries*, recognizing that system collapse helps no one.

  ---

  **I. PRE-SCREEN (Admin Check - 1 min)**
  *   *Question:* Does this request meet ALL written policy criteria? (e.g., eligible expense, student status, documentation threshold met).
  *   *Sufficient Answer:* Yes/No based on clear policy doc. *If NO → Deny (Stop). State policy reason.*
  *   *Judgment Call?* **No.** (Pure policy application).

  **II. URGENCY & SEVERITY (Impact Assessment - 3 min)**
  *   *Question 1:* **Is this an immediate threat to health, safety, housing, or academic continuation?** (e.g., eviction notice, severe pain, no food, stolen essential device).
      *   *Sufficient Answer:* Yes (High Priority) / No (Standard Priority). *Lack of verification defaults to "No" unless claim is highly plausible/basic.*
  *   *Question 2:* **What is the likely magnitude of harm prevented?** (e.g., "homelessness" > "inconvenience"; "failed semester" > "lower grade").
      *   *Sufficient Answer:* High/Medium/Low *based on applicant's description & common sense.*
  *   *Judgment Call?* **Yes.** (Assessing severity based on limited info).

  **III. EFFECTIVENESS (Impact Per Dollar - 2 min)**
  *   *Question:* **Is this the most effective *known* use of these funds *right now* to prevent comparable harm?** (Compare against pending requests & recent trends).
      *   *Sufficient Answer:* Weigh Urgency/Severity (II) against requested amount. Prioritize High Urgency/Severity + Lower Cost. *If comparable, proceed. If clearly less effective than pending alternatives → Deny (Stop). State "Higher priority needs currently."*
      *   *Can't get a number?* Use Urgency/Severity tier + cost as proxy (e.g., $400 for imminent homelessness > $400 for non-urgent travel).
  *   *Judgment Call?* **Yes.** (Comparing incommensurate harms/needs).

  **IV. SUSTAINABILITY GUARDRAILS (Demandingness Answer - 3 min)**
  *   *Guardrail 1 (Capacity Cap):* **Does approving this request risk exceeding our WEEKLY operational capacity?** (e.g., funds left < $X after this? Time commitment > Y hours?).
      *   *Sufficient Answer:* Compare request cost + admin time against *pre-set weekly budget cap* (e.g., max $1500/week) & *pre-set weekly volunteer hour cap* (e.g., 15hrs/person). *If YES → Deny (Stop). State "Weekly capacity reached."*
  *   *Guardrail 2 (Fair Share - The Auditor Test):* **Would an impartial auditor, knowing total campus need and our specific resources, agree this grant is part of a *sustainable* contribution from *this specific fund*, not a demand to solve the whole problem?**
      *   *Sufficient Answer:* Does the grant fit our *pre-set per-incident* or *per-person annual cap*? (e.g., max $500/incident, max $1000/person/year). *Is the need vastly greater than our entire fund?* (If yes, reinforces cap). *If request exceeds cap → Deny (Stop). State cap reason.*
      *   *Your Question Answered:* This sets the bar at *our sustainable share*, not the total need. The "auditor test" makes it principled (impartiality) and prevents self-serving ratcheting. Caps are set *ex-ante* via student govt/donor approval.
  *   *Guardrail 3 (System Health):* **Does funding this *specifically* undermine our ability to function sustainably?** (e.g., recurring applicant hitting cap?).
      *   *Sufficient Answer:* Apply per-person/annual cap (Guardrail 2). *If capped → Deny (Stop). State cap reason.*
      *   *Re-Ask Problem Answered:* Caps provide a clear, fair, pre-defined stopping point. It's not punishment; it's sustainable distribution. Referral to other resources is key.
  *   *Judgment Call?* **Minimal.** (Applying pre-set caps & budget rules).

  **V. FINAL CHECK (Values/Uncertainty - 1 min)**
  *   *Question:* **Given the above, is there any strong, specific reason this *particular* case demands an exception despite the guardrails?** (e.g., truly extraordinary, unique circumstance verifiable NOW).
  *   *Sufficient Answer:* Rarely "Yes". Requires consensus of 2 deciders. *If NO → Approve (if passed IV) or Deny (if stopped at IV).*
  *   *Judgment Call?* **Yes, High Bar.** (Only for extreme outliers).

  **OUTPUT:** Approve (Amount, maybe < requested) / Deny (Clear Reason: Policy, Capacity Cap, Per-Incident Cap, Annual Cap, Lower Priority).

  **Crucial Pre-Set Parameters (Require Student Govt/Donor Buy-in):**
  1.  **Weekly Grant Budget Cap:** (e.g., $1500/week). Based on historical avg incoming funds minus admin buffer.
  2.  **Per-Incident Grant Cap:** (e.g., $500). Based on typical emergency size & fund scale.
  3.  **Per-Person Annual Grant Cap:** (e.g., $1000). Addresses re-ask problem fairly.
  4.  **Max Weekly Volunteer Hours Per Decider:** (e.g., 4 hours). Protects against burnout.
  5.  **High-Priority Harm Definitions:** Clear examples (Eviction, Medical Emergency, etc.).

  ---

  **Applying the Procedure to Your Cases**

  **Case 1: $400 Dental Work (Week: $2000 left, 12 pending requests, limited verification)**
  1.  **Pre-Screen:** Assume passes policy (dental emergency eligible).
  2.  **Urgency/Severity:** Dental pain - Likely **High Severity** (health, function), **High Urgency** (pain). Magnitude: **High**.
  3.  **Effectiveness:** $400 prevents high harm. Compare to pending: Are there multiple *higher* urgency/severity (e.g., imminent eviction)? *Assume no clear higher priority pending. → Proceed.*
  4.  **Sustainability Guardrails:**
      *   *Capacity Cap:* Request ($400) + Admin (<$5 time). Weekly Budget ($2000 left > $400). **Pass.**
      *   *Fair Share (Auditor Test):* $400 < Per-Incident Cap ($500)? **Yes (Pass).** First request? (Assume Yes, **Pass** Annual Cap check).
      *   *System Health:* No specific risk. **Pass.**
  5.  **Final Check:** No extraordinary exception needed. **→ APPROVE (or partial if cost seems high, but $400 plausible).**

  **Case 2: Food Bank Volunteers (Ask: Increase from 2hrs to 8hrs/week during finals)**
  *(Treating volunteer ask as a "resource request" on the fund's capacity)*
  1.  **Pre-Screen:** Is coordinating volunteers within fund's mission? *Assume "Supporting basic needs" includes this. → Proceed.*
  2.  **Urgency/Severity:** Food insecurity - **High Severity**. Finals timing - **High Urgency** (fixed period). Magnitude: **High** (Meals = Clear Good).
  3.  **Effectiveness:** High impact/effort? **Yes.** Compare to alternatives: Could $ equivalent fund more meals than hours? *Unlikely, volunteer hours often very efficient. → Proceed.*
  4.  **Sustainability Guardrails (CRITICAL HERE):**
      *   *Capacity Cap (TIME):* **This is the key.** Current ask: +6hrs/person/week. *Pre-set Max Weekly Volunteer Hours/Decider (e.g., 4 hrs)?* **8hrs > Cap (e.g., 4hrs). → STOP. DENY.** "Exceeds maximum sustainable weekly volunteer commitment per team member." Burnout risk is an operational *capacity constraint*, not a value trade-off. *This answers your core tension: Volunteer wellbeing is a CAP, not a factor to be outweighed by meals.*
      *   *(Fair Share/System Health: Moot after Capacity Cap violation).*
  5.  **Final Check:** N/A (Stopped at IV). **→ DENY.** *Alternative:* Could fund offer *small* increase (e.g., to 3hrs) if below cap? Or recruit *more* volunteers without overloading deciders?

  **Case 3: $300 for Volunteer Hoodies/Dinner vs. Grant**
  1.  **Pre-Screen:** Assume "volunteer appreciation" is an *allowable* admin cost per policy (needs definition!). *If not → Deny Hoodies immediately.* Assume it is eligible.
  2.  **Urgency/Severity (Hoodies):** Preventing volunteer attrition - **Medium Severity** (system risk, not immediate harm), **Medium Urgency** (ongoing issue). Magnitude: **Medium** (prevents measurable drop in future capacity).
  3.  **Effectiveness:** $300 prevents attrition -> sustains future grants. Compare: $300 grant prevents one instance of harm *now*. **Trade-off:** Future systemic impact vs. immediate individual relief. *Hard to compare → Proceed to Guardrails.*
  4.  **Sustainability Guardrails:**
      *   *Capacity Cap:* $300 request. Weekly Budget ($? left). *If $300 < remaining budget → Pass.* Assume yes.
      *   *Fair Share (Auditor Test):* **Is this a *necessary* and *proportionate* investment in system health?** *Evidence Required:* Data showing past attrition directly linked to lack of recognition, *and* that hoodies/dinner reliably prevent it (+20% retention?), *and* that this is the *most cost-effective* retention method. *If strong evidence → Pass. If weak/absent → Fail (Stop). Deny Hoodies.*
      *   *System Health:* Spending $300 on Hoodies *instead of a grant* only harms system health if it causes *immediate* reputational damage or violates trust. Unlikely. **Pass.**
  5.  **Final Check:** Only if Hoodies passed Guardrail 2 (Fair Share). **→ APPROVE Hoodies** *only if* robust evidence justifies it as a *necessary system investment*. **Otherwise → DENY Hoodies.** Give the grant. *(Hard Truth: Without concrete evidence, the auditor likely sees Hoodies as non-essential, and the immediate grant wins on direct impact. You need data to justify this as system maintenance, not just a feeling.)*

  ---

  **What SIT Can't Do (Limitations & Watch-Outs)**

  1.  **Relabeling, Not Solving:**
      *   **"Fair Share" Definition:** SIT relies on pre-set caps approved by stakeholders. It makes the debate *explicit* (setting the caps) rather than implicit in each decision, but doesn't magically solve the philosophical problem. The "Auditor Test" guides cap-setting but requires honest deliberation.
      *   **Comparing Harms:** Step III (Effectiveness) remains a value judgment about the severity of different types of suffering/harm.
  2.  **Systematic Misfires:**
      *   **Vividness Bias:** SIT mitigates this via strict Priority Tiers (II) and Caps (IV), forcing focus on category (e.g., "eviction") over narrative flair. *Countermeasure:* Standardize harm descriptions in the form (tick boxes + short description).
      *   **Underfunding Chronic Needs:** Caps (IV) explicitly address this but mean some recurring needs won't be fully met by *this* fund. SIT highlights the need for better systemic solutions/referrals.
      *   **Administrative Burden:** Setting up good caps and tracking requires initial work. *Countermeasure:* Start simple, review data monthly.
  3.  **Verification Gap:** SIT relies on stated policy verification levels. It doesn't solve the problem of unverifiable claims but forces consistency in applying the policy's verification threshold (Step I).
  4.  **The "First Month" Test for Honesty:**
      *   **Track Everything:** Log every decision, the path through the flowchart, the reason for denial/approval, and the guardrail/cap applied.
      *   **Weekly Review:** Spend 20 mins weekly reviewing 3-5 decisions. Did you *actually* follow the steps? Where did you fudge? Did you override a guardrail without strong justification (Step V)? Discuss discrepancies.
      *   **Audit Trail:** Could an outsider (your "auditor") understand the decision based on your log and the pre-set rules? If not, you're rationalizing.
      *   **Monitor Ratcheting:** Are caps holding steady based on pre-agreed parameters, or are you silently lowering them because "this one case is special"?

  **SIT's Core Strength:** It forces demandingness concerns (burnout, fairness, sustainability) into *operational, pre-agreed rules* (the Caps and Guardrails) applied *consistently*. It prevents the exhausting, guilt-ridden, case-by-case re-litigation of "should we do more?" while still striving for significant impact within defined, sustainable limits. It turns the philosophical tension into a manageable administrative process with clear stopping points.
