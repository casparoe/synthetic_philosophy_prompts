answer: |-
  ## Committee Room, 11:07 PM

  **Mira:** *(Typing furiously, screen glare on her glasses)* ...effectively codifies existing power structures under the guise of preserving tradition. The city is now an active participant in ranking conceptions of the good, Dev. Funding thick identities, officially certifying them with this… narrative seal of approval. It’s anti-pluralist.

  **Dev:** Pluralism needs roots, Mira. The city already sustains *one* thick identity – the liberal individual. Schools teach kids to stand back, evaluate, choose. The exit right you value? It’s baked into everything. The anti-discrimination code itself assumes a subject capable of abstracting from their commitments. We’re just admitting other identities, ones the state didn’t invent, might be worth preserving too.

  **Mira:** There’s a gaping chasm between enforcing the *conditions* for revising your ends – call it civic literacy – and subsidising a *particular* end, a creed. We fund literacy. This funds creed. The literacy/creed distinction *is* fuzzy, granted. Even literacy isn't content-free; it carries assumptions. But funding the Somali-Haldeni Tenants' Union directly would be creed. Funding a *library* they can use? That’s closer to literacy. This grant? Pure creed subsidy. And the 60-year lock? That tenants' union could be doing vital work for a decade, but it’s shut out because it’s young and its story is still being written. The old, the established, the already articulate win by default.

  **Dev:** Okay, the literacy/creed line is blurry. Conceded. But what about goods that aren't portable? That you only *have* by being inside a practice bigger than yourself? Take a language society preserving Haldeni-Norwegian. You can walk out the door tomorrow. Costless exit protects your freedom. But what you *cannot* take with you is a living mother tongue. That only exists *here*, *now*, because *this specific community* sustains it across generations. Exit protects the chooser; it does nothing to protect *that* kind of good. The grant recognizes that vulnerability.

  **Mira:** Fine. Constitutive goods exist. But if continuity is so vital for them, then exit alone *is* the wrong safeguard. It only protects against individual coercion, not against the group ossifying or being hijacked. For constitutive goods, what you’d want is a *secession floor*. If, say, a fifth of the language society members want to continue the practice differently – maybe modernize teaching, include new dialects – they should be able to take a proportional slice of the grant *and* a slice of the narrative legitimacy. They get resources to continue *their* version of the constitutive good. That’s a liberal repair – ensuring internal pluralism and dynamism within the protected form. It prevents vetoes by reactionary minorities.

  **Dev:** A fifth get money, sure. But they get *no standing*. Standing comes from passing the continuity test – showing *they* are the unbroken thread. Your splinter group fails that instantly. They’re new. And now you’ve dragged the city into the schism business. Who decides if that fifth *really* represents continuity? Is it numerical? Do we analyze doctrinal purity? Does the city become the arbiter of which faction is the "real" Haldeni-Norwegian Language Society? Tell me, Mira, has the liberal state *avoided* these quasi-theological questions about authenticity and succession? Or has it just privatized them – pushed them into internal governance fights, property disputes, defamation suits – and then re-administered them clumsily through the courts? We’re just making it explicit and upfront.

  **Mira:** Courts adjudicate breaches of rules – contracts, property rights, discrimination. They don’t usually certify the metaphysical truth of a community’s self-understanding. That’s different. But… point taken about courts getting dragged into messy internal fights. It’s ugly. Your system just bakes the certification in *first*. Which brings me to the reform problem. St. Olaf’s Congregation admits women to its governing board in 1985. Was that faithful growth within their tradition, or a fundamental break? To get the grant, *they* have to tell the city their story. But whoever *certifies* that story – some city clerk? a historical commission? – is implicitly deciding whether that change was faithfulness or apostasy. They’re wielding theological or ideological power disguised as administrative fact-checking.

  **Dev:** Isn’t that power already there, just hidden? When the city grants non-profit status, or tax exemptions, or uses zoning to favor "historic" congregations? We pretend it’s neutral, but it isn’t. This makes the exercise of that power transparent and tied to a community’s own stated purpose. Who *should* hold that power? An algorithm? It has to be human judgment somewhere, Mira. At least here, the judgment is tethered to the community’s *own* public narrative over time.

  **Mira:** Tethering it to *their* narrative just gives the current winners – the faction holding the archives and the microphone – the power to lock in *their* interpretation forever. The city becomes the enforcer of their orthodoxy. And "transparency" doesn't make that power less dangerous; it just makes the winners and losers clearer. A Somali-Haldeni group gets nothing, St. Olaf’s gets money and influence, and the city stamps its approval on St. Olaf's specific story of itself. How is that *not* the state elevating one conception of the good?

  **Dev:** It elevates *longevity* and *continuity of purpose*, not the specific creed per se. The creed is just the marker of the continuity. The state isn’t saying Lutheranism is better than mutual aid; it’s saying a group that’s held itself together *as Lutherans in Halden* for 60 years has a different claim on the city than a new mutual aid group. The anti-discrimination carve-out is the guardrail – the city *is* saying some creeds are beyond the pale.

  **Mira:** *(Snorts softly)* That carve-out is where the real bloodletting starts tomorrow. The only thing we might agree on. But back to certification. You say it’s unavoidable. I say it’s uniquely pernicious here because it’s tied to *money* and *formal power*. You reward groups for having a fossilized, easily-defended story. Groups that adapt, that wrestle openly with conflicting interpretations of their purpose, are more likely to look ‘broken’ to an administrator checking boxes. Innovation looks like discontinuity.

  **Dev:** Or maybe continuity *requires* adaptation to survive? The narrative test asks if the *core purpose* persisted, not if every practice stayed identical. The language society’s purpose is preserving Haldeni-Norwegian. Did switching from handwritten newsletters to a website break continuity? Probably not. Admitting younger members who want slang included? Maybe edges closer… but the core remains. It’s interpretive, yes. Life is interpretive. The alternative is pretending the state doesn’t constantly make judgments about which associations are ‘real’ or ‘lasting’ or ‘significant’ when it allocates resources or influence. We’re just being honest about one criteria.

  **Mira:** Honest about rewarding age and a clean narrative arc. Honest about empowering the gatekeepers inside those groups to define heresy, because any significant internal challenge risks the grant. Honest about the city becoming the curator of approved histories. That’s the thick identity *we’re* creating: the identity of the Officially Continuous. And the cost is everyone else – the new, the messy, the still-becoming. That price is too high, Dev. Even for your constitutive goods. *(She resumes typing, keys clacking sharply.)*

  **Dev:** And the cost of *your* liberal neutrality, Mira, is the slow erosion of those goods precisely because they *can’t* survive on the thin gruel of individual choice alone. They need institutions. Strong ones. This is how we build strong institutions that aren’t just extensions of the state. They have standing, resources, and a mandate to preserve something specific. Yes, there are winners and losers. There always are. But maybe some losers are worth saving. *(He stares out the dark window.)* Who gets to decide *which* losers, though... that’s the rub, isn't it? Even with the carve-out.

  **Mira:** *(Without looking up from her screen)* Exactly. Who holds the pen that writes ‘Continuous’?

  \answer{Who certifies continuity as growth or apostasy?}
