  First, I need to understand their core argument: they believe the adaptationist vs. non-adaptationist debate gets stuck because people don't distinguish between a trait's origin and its current maintenance via selection. The reptilian jaw bone becoming a mammalian ear bone is their key example - it was a byproduct originally but became an adaptation later. This "origin/maintenance slippage" causes people to talk past each other.

  The proposal needs several key elements: 
  A precise research question that's answerable in 9 months with limited resources. Possible answers could be that the slippage is widespread and undermines the debate, or that it's rare and doesn't really matter. 

  I should explain why existing approaches fail - the global adaptationism debate, the "just a heuristic" view, and semantic debates about "function" all miss this temporal dimension. The user explicitly wants to avoid case study surveys and linguistic analysis, so I'll focus on conceptual mapping of existing arguments.

  For methodology, conceptual analysis of key texts makes sense - identifying which time frame authors are discussing when they call something an adaptation or spandrel. This is better than case studies because it directly addresses the communication problem, and better than word-meaning debates because it tracks actual usage.

  The deliverable should be practical - perhaps decision trees or heuristics to help biologists specify which evolutionary timeframe they're discussing when making claims. This could resolve burden-of-proof disputes locally rather than globally.

  For failure conditions, if we find the slippage is rare or doesn't actually cause confusion, that would be a negative result but still valid. The project fails only if we can't develop any useful diagnostic tools.

  Most importantly, the proposal must avoid wishy-washy "both sides" conclusions. It should be able to annoy either adaptationists or non-adaptationists by showing their arguments frequently commit this temporal slippage error.

  I'll structure this as a tight two-page proposal with clear sections: problem statement, research question, why existing approaches fail, methodology, deliverables, and failure conditions. The tone should be provocative but rigorous, matching the user's desire for a non-mushy stance. The reptilian/mammalian ear example will anchor the discussion throughout.
answer: |-
  Here’s a tightly scoped, argument-driven proposal focusing on your core insight about temporal ambiguity and burden of proof:

  ---

  **Project Title:** Resolving the Spandrels Stalemate: Temporal Indexing and Burden of Proof in Evolutionary Explanation

  **Research Question:**  
  Does the persistent ambiguity in the adaptationism debate (post-Gould-Lewontin) primarily arise from unacknowledged *temporal indexing* of "function" and uncalibrated *burdens of proof*, rather than empirical disagreement about specific traits? Specifically:  
  1.  How frequently do key advocates (e.g., adaptationists like Maynard Smith/Dawkins vs. critics like Gould/Lewontin/Lloyd) exhibit "origin/maintenance slippage" (OMS) in their use of evidence?  
  2.  Can explicit temporal framing (origin vs. maintenance) resolve apparent contradictions in case study interpretations?  
  3.  Does adopting a time-indexed burden of proof ("Who must prove what, *when*?") dissolve intractable global disputes?

  **Possible Outcomes:**  
  A. OMS is pervasive & drives the stalemate; temporal indexing resolves core conflicts.  
  B. OMS is rare; the stalemate stems from deeper methodological/empirical divides.  
  C. Temporal indexing clarifies *some* cases, but burdens of proof remain context-dependent & contested.

  **Why Standard Framings Fail:**  
  *   **Global Thesis Framing:** Debating "how much is adaptive?" is intractable because "adaptive" is temporally ambiguous (origin/maintenance). A trait can be globally "adaptive" *now* while originating as a non-adaptive *byproduct*. Global questions mask local, time-sliced explanations.  
  *   **Heuristic Framing:** Dismissing adaptationism as "just a hypothesis generator" ignores the *epistemic weight* assigned to adaptationist explanations in practice. Who bears the cost of falsifying a "heuristic" claim? The heuristic framing avoids specifying the burden of proof.  
  *   **Semantic Dissolution:** Debating the "correct" definition of "function" (e.g., selected effect vs. causal role) sidesteps the core problem: *when* a causal role becomes subject to selection matters. Both definitions can coexist *if temporally indexed*, rendering the semantic debate sterile for resolving the spandrels critique.

  **Approach & Rationale:**  
  We will conduct a **focused conceptual analysis of pivotal texts and case study arguments** from both adaptationist and anti-adaptationist literature (1979-present).  

  1.  **Targeted Text Mining:** Using curated key texts (e.g., Gould & Lewontin 1979, Dawkins 1982, Maynard Smith rebuttals, Lloyd critiques), we will systematically code claims about specific traits (e.g., chin, male nipples, jaw/ear ossicles) for:  
      *   Explicit/implicit timeframe referenced (origin, current maintenance, both, neither).  
      *   Burden of proof assignment (stated or implied: must adaptation be proven? must non-adaptation be proven? assumed default?).  
      *   Presence of OMS (using evidence about origin to argue about current function/maintenance, or vice-versa).  
  2.  **Case Study Re-Analysis:** Select 3-5 high-profile contested cases (e.g., chin, religious cognition, specific neural structures). Map the arguments *explicitly* onto separate timelines: origin story vs. maintenance story. Assess whether apparent contradictions vanish when temporal frames are separated.  
  3.  **Burden Calibration:** Develop and test a simple decision-tree heuristic for assigning the burden of proof based on temporal frame and available evidence type (e.g., comparative vs. engineering optimality).  

  **Why this approach (vs. alternatives)?**  
  *   **Not a Case Study Survey:** We avoid comprehensive trait review. We *re-interpret existing arguments* through our temporal/burden lens. This leverages existing data to answer a *new conceptual question* about argument structure.  
  *   **Not Armchair Semantics:** We analyze *actual usage and argumentation* in key scientific texts, not abstract definitions. We test whether temporal indexing *works* to resolve real disputes. This grounds theory in scientific practice.  
  *   **Feasible:** Text analysis and conceptual mapping are achievable with limited time and a part-time RA. It requires analytical skill, not new lab data or massive literature synthesis.  

  **Deliverable:**  
  A **Practical Framework for Biologists:** A concise guide (1-2 pages + decision tree) enabling researchers to:  
  1.  **Explicitly State Temporal Frame:** "I am arguing about the *origin* of trait X" / "I am arguing about the *current maintenance* of trait X."  
  2.  **Locally Assign Burden of Proof:** Based on temporal frame and available evidence types.  
      *   *Example Origin Claim:* "Proposing trait X originated as a byproduct requires demonstrating plausible developmental constraint/architectural necessity *at t1*; proposing selection at origin requires evidence of selective benefit *at t1*."  
      *   *Example Maintenance Claim:* "Proposing trait X is *currently* non-adaptive requires demonstrating the *absence* of current stabilizing/positive selection *or* outweighing costs; proposing current adaptation requires evidence of current function/fitness benefit."  
  3.  **Avoid OMS:** Flagging the misuse of origin evidence for maintenance claims (and vice-versa).  
  This framework does *not* resolve global debates. It provides tools for clearer, locally tractable arguments about specific traits at specific times, reducing unproductive stalemate.

  **Success Metrics & Failure Conditions:**  
  *   **Success:** Development of a clear, usable framework validated by showing it resolves ambiguities in key texts/cases. Demonstration of significant OMS prevalence.  
  *   **Negative Result Success:** Clear demonstration that OMS is rare or irrelevant to the core debate, or that temporal indexing fails to resolve significant disputes. This *answers the question* definitively.  
  *   **Project Failure:** Inability to develop a coherent framework due to fundamental conceptual chaos in the source material. Inability to reliably code temporal frames/burdens due to pervasive ambiguity (though this finding itself would be significant). Failure to identify sufficient clear examples for analysis within scope. Results that are purely "both sides have points" without diagnostic power.

  **Potential to Annoy:**  
  *   **Adaptationists:** If we show their arguments frequently rely on conflating current maintenance evidence with claims about origin, or inappropriately shifting burden onto critics for *all* timeframes.  
  *   **Anti-Adaptationists:** If we show their arguments often dismiss current adaptive explanations by over-relying on non-adaptive origin stories (committing OMS), or demand unrealistic burdens for current function claims.

  ---
  **Key Strengths for a Seed Grant:**
  1.  **Sharp Focus:** Targets a specific, testable hypothesis (OMS causes stalemate) with a feasible method.
  2.  **Leverages Existing Work:** Analyzes known texts/cases; doesn't require new data collection.
  3.  **Clear Deliverable:** Practical tool for working biologists, not just academic debate.
  4.  **Defined Scope:** 9 months, part-time RA. Output is analytical, not empirical.
  5.  **Risk of Annoyance:** Explicitly designed to produce a result favoring one side *or* revealing a new structural flaw, avoiding mush.
  6.  **Honest Failure Modes:** Clear criteria for both negative results and project failure.
