  For the Darwinian grade, I'll emphasize their hardwired nature and lack of individual improvement. Skinnerian staff will learn only through real consequences. Popperian staff will avoid costly field trials since their value is in internal simulation. Gregorian staff will have their competence steadily reassigned to cultural artifacts.

