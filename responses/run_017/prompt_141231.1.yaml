answer: |-
  ### Dialectical Space Sketch
  - **Searle (Primitive We-Intentions)**: Treats shared intention as an irreducible mental state in individuals ("I we-intend"), not analyzable into individual intentions. Stresses psychological immediacy.
  - **Gilbert (Plural Subjects)**: Asserts shared intention is an irreducibly collective entity (a "joint commitment") that binds individuals normatively. Obligations arise directly from the plural subject.
  - **Bratman (Constructivism)**: Reduces shared intention to interconnected individual attitudes (intentions, subplans, mutual responsiveness, common knowledge). Denies primitive "we" states or ontologically independent groups.

  ### Diagnosis: Three Distinct Questions Masquerading as One
  The impasse stems from conflating three separable inquiries, each implicitly prioritized by a different camp. This explains why objections don't land—critics and defenders are often talking past each other, and case intuitions diverge because each theory is optimized for different *kinds* of cooperation.  

  1. **Searle’s focus**: *What is the phenomenology of cooperative action?*  
     For Searle, the *experience* of "we-ness" is primary. In **Silent Crew**, he must insist each stranger has a primitive we-intention ("I we-intend that we leave"), as their coordinated pull feels like joint action despite no communication. But **Relay** breaks his view: no single agent has a we-intention spanning the decade-long project, as intentions are fragmentary and disconnected.  

  2. **Gilbert’s focus**: *What grounds obligations in collective action?*  
     Gilbert cares about normativity, not psychology. **Silent Crew** isn’t shared intention for her—there’s no joint commitment creating obligations. But **Relay** fits: each handover note establishes a mini joint commitment, chaining obligations across time. Her view struggles with cases lacking explicit or implicit agreements (like Silent Crew), as obligations are constitutive, not emergent.  

  3. **Bratman’s focus**: *How do individual cognitive states mechanistically enable coordination?*  
     He targets the cognitive "machinery" of planning. **Silent Crew** challenges him: without common knowledge or responsiveness, it’s unclear how individual intentions interlock. He might redescribe it as a borderline case (e.g., "mutual responsiveness" via levers), but it strains his requirements. **Relay** partially works if handover notes create interlocking subplans, but the lack of overarching shared knowledge undermines it.  

  **The Root Problem**: Each theory is answering a different core question:  
  - Searle: *What does it feel like from the inside?*  
  - Gilbert: *Why are we obligated to each other?*  
  - Bratman: *How do our minds pull this off cognitively?*  

  Apparent clashes over cases (e.g., whether Silent Crew "counts") arise because each camp privileges cases aligning with their question. Searle sees intuitive joint action everywhere; Gilbert demands normative structure; Bratman seeks cognitive implementability. The "standard replies" work because they defend a theory’s home domain while deflecting alien demands.  

  ### What Would Move Things Forward?
  The stalemate persists because the field treats these questions as facets of a single problem. Progress requires **disentangling the inquiries** and **recalibrating expectations** for each:  

  1. **Distinguish the Three Projects Explicitly**: 
     - Acknowledge that "shared intention" is an ambiguous target. Separate:  
       - (A) The *phenomenology* of joint agency (Searle’s domain).  
       - (B) The *normative structure* of collective obligations (Gilbert’s domain).  
       - (C) The *cognitive architecture* of social coordination (Bratman’s domain).  
     This clarifies why no theory "wins"—they’re not competing.  

  2. **Accept Domain-Limited Explanations**:  
     - Drop the demand for a unified theory. Silent Crew might be a case for (A) and (C) but not (B); Relay fits (B) but strains (A) and (C). Progress comes from mapping which phenomena each framework best explains.  

  3. **Empirical Input for Cognitive Questions**:  
     - For (C), leverage psychology/cognitive science. E.g., if experiments show Silent Crew-like coordination *without* we-intentions (e.g., via heuristics), it challenges Searle but not Gilbert. If neural data reveals Bratman-style subplan integration, it supports (C) without resolving (B).  

  4. **Normative Grounding as Autonomous**:  
     - For (B), engage moral/political philosophy directly. If obligations in Relay arise from promises in handover notes, not a plural subject, Gilbert’s ontology becomes optional.  

  **Why Stalemate Was Inevitable (But Not Permanent)**:  
  The conflation made the debate interminable—like arguing whether "light" is particles or waves while ignoring it’s both, contextually. Once we disentangle, theories can specialize: Bratmanians model cognitive processes in simple cooperation; Gilbertians analyze obligations in structured groups; Searleans explore we-experiences in ephemeral alliances. Progress isn’t consensus but clearer boundaries and collaborative division of labor. The cases aren’t "counterexamples" but stress tests revealing a theory’s scope. Clarity about the *question* is the catalyst.
