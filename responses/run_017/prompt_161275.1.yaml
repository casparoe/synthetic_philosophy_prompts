prompt: |-
  hey — putting together something like a long memo on secession for a group that's advising a constitution-drafting process, and before I write any of it I want the spec. Not "should Catalonia be allowed to leave" — I want the requirements list: what would a theory of secession have to deliver to be good enough to actually be written into law, i.e. administrable by an electoral commission and a constitutional court, not just defensible in a journal?

  Concretely: it has to resolve, before the vote happens, who the demos is, what territory is on offer, what the threshold is, and what happens to the bits that vote against. So give me desiderata that bite under that constraint, with the case behind each.

  Cases I want requirements anchored to, at least loosely: Scotland, Quebec, Catalonia — plus the awkward ones: a holdout county that votes to stay but is geographically stuck to the new state; an enclave or exclave; a region whose departure would leave the rump state economically or militarily non-viable; a diaspora that identifies with the nation but doesn't live there; a subgroup that wants to seceed from the secession and maybe rejoin the parent state; a secession that succeeds or fails purely on whether other states recognise it; and a "nation" with no thick shared culture that just wants out over fiscal transfers.

  Things I specifically want you to think through rather than assume:

  - the franchise–territory circularity: who gets to vote depends on what unit is seceding, but what unit secedes is supposed to be settled by who votes. Does any theory actually break that circle, or does every one of them smuggle in a prior answer about the unit (usually an existing administrative border)?
  - the reiteration / Russian-doll problem: whatever right you posit has to say what it says one scale down. Let the holdout secede from the secession and you get a regress; don't let it and you've denied the holdout the exact right you just asserted. Which horn is less bad, and why?
  - the veto-holder question: does the rump state's population get a say (defence, debt, shared infrastructure, transfers)? If yes, secession collapses into a grant; if no, into a unilateral right.
  - the trigger/authority split: who may authorise a referendum, who has the right to secede, and what counts as a legitimate grievance (remedial-only vs. any democratic will) are three different questions. Keep them apart and say which one a given theory is actually a theory of.
  - the serial-referendum problem: what's the shelf life of a lost vote, and of a won one? Anything that says "the demos decides" owes an answer about a demos that changes its mind, or one that was panicked, bribed, or badly misinformed.

  Also mark which requirements are non-negotiable and which are just preferences of one camp (nationalists, unionists, international lawyers, constitutional judges). Flag any pair I probably can't have together — my guesses are that "the demos draws its own boundaries" and "everyone materially affected gets a say" can't both hold, and that "no veto for the rump state" is in tension with "succession is settled in advance" (debt, treaties, UN seat, central bank) — but you tell me. And name the single requirement that knocks out the most popular theories; I suspect it's the holdout problem killing pure plebiscitary views, but I want your take.

  A short table scoring the three big families — remedial-right-only, plebiscitary/primary-right, and the negotiated-constitutionalist "you need the parent state's consent" view — is fine, but keep it to a few lines. Alot more than that and you're spending words on the wrong part; the criteria are the deliverable.

  At the end, say how confident you are in the list overall and single out the one requirement or claim you're least sure about.
reasoning: |-
  Okay, the user is asking for a set of requirements for a secession theory that can be practically implemented in law, focusing on administrative and judicial feasibility. They want concrete desiderata anchored to specific cases like Scotland, Quebec, Catalonia, and other tricky scenarios. 

  Hmm, this is a complex constitutional design problem. The user clearly has deep expertise—they're drafting a memo for actual constitution-drafting advisors and mention nuanced problems like franchise-territory circularity. Their tone suggests urgency ("before I write any of it") and impatience with purely academic solutions ("not just defensible in a journal"). 

  The core tension I see is between democratic self-determination and state stability. Every requirement will involve trade-offs: 
  - If you let sub-units secede unilaterally (Catalonia scenario), you risk chaos from micro-secessions (Russian doll problem). 
  - If you require rump state consent (Quebec Reference), it becomes a grant rather than a right. 
  - Franchise questions are nightmarish—if you define voters by territory, you're stuck with existing borders (Scotland used council areas); if by identity, you get diasporas voting (Kosovo Albanians abroad).

  Key pitfalls the user wants to avoid: 
  1. Circularity (who votes defines territory, but territory defines voters) 
  2. Infinite regress (secession-within-secession) 
  3. Veto powers collapsing the theory into either pure unilateralism or pure permission 

  They're especially sharp about trigger-vs-authority distinctions. Many theories conflate "who can call a vote" (trigger), "who can decide" (authority), and "what justifies secession" (grievance). Need to decouple these. 

  For non-negotiables, I'd guess: 
  - No theory that can't handle geographic holdouts (like a Unionist county in Northern Ireland) 
  - Must resolve debt/assets concretely (not "negotiate later") 
  - Shelf-life rules for referenda (no perpetual reruns like Quebec 1980/1995) 

  The user's suspicion about "demos draws boundaries" vs "all affected get a say" being incompatible seems right. Allowing both leads to paradoxes—e.g., if Barcelona city votes to stay in Spain but Catalonia leaves, who prevails? Either you privilege the larger unit (denying Barcelona's self-determination) or the smaller (making secession impossible). 

  Least confident point for me: viability thresholds. How do you objectively define "economically non-viable"? Latvia post-USSR had 50% energy dependency on Russia but survived. Any test here would be political, not legal. 

  Will structure around: 
  1. Procedural administrability (franchise, territory, vote rules) 
  2. Substantive viability (debt, borders, assets) 
  3. Conflict containment (vetoes, reiteration, recognition) 
  ...then score major theories against these. 

  Biggest killer requirement is probably the Russian doll problem. Plebiscitary theories (pure "vote to leave") fail hardest here—if every village can secede, states fragment. Remedial-right-only (injustice required) avoids this but creates new problems (who defines injustice?). 

  User's focus on constitutional courts is key. Whatever we propose must generate justiciable standards—no "moral right to secede" fluff. Electoral commissions need clear voter rolls; courts need bright lines. 

  Final note: User hasn't mentioned partition violence (e.g., India-Pakistan). Deliberate? If advising real constitutions, maybe imply stability requirement. But they want brevity, so omit unless essential.
answer: |-
  Here's a distilled requirements list for a legally administrable secession theory, designed for constitutional drafting and judicial application. Requirements are anchored to real cases and address your specified constraints. **Bolded items are non-negotiable for feasibility**; others involve trade-offs between camps.

  ---

  ### **Core Requirements for an Administrable Secession Clause**
  1. **Defined Territorial Unit (Pre-Referendum)**  
     *Requirement:* Must resolve *before any vote* what territory is seceding, using **existing administrative boundaries** (e.g., Catalonia’s *autonomous community*, Scotland’s *local authority areas*).  
     *Why non-negotiable:* Breaks franchise-territory circularity. Alternatives (e.g., "cultural nation") are non-justiciable.  
     *Case anchor:* Catalonia (used provincial borders); Quebec (used provincial borders).  

  2. **Clear Franchise Rules**  
     *Requirement:* Voter eligibility based on **residency + citizenship** within the pre-defined territory. Excludes diasporas, includes recent migrants.  
     *Why:* Administrable (electoral rolls exist). Solves "diaspora problem" (e.g., Irish-Americans don’t vote on Irish unity).  
     *Tension:* Denies "nationhood" claims (e.g., Kosovo Albanians abroad).  

  3. **Threshold & Supermajority**  
     *Requirement:* **Qualified majority (e.g., 55%+) on high turnout (e.g., 70%)** for secession to pass.  
     *Why:* Prevents narrow wins exploiting temporary crises (e.g., panicked/biased votes). Anchored to Quebec Clarity Act.  

  4. **Rump State Veto on Critical Interests**  
     *Requirement:* **Rump state negotiates (not vetoes) secession**, but constitutional court can block if:  
     - Rump is rendered non-viable (e.g., economic collapse, loss of strategic infrastructure)  
     - Core state functions (defense, central bank) are uncompensated.  
     *Why:* Solves "veto-holder problem." Pure unilateralism ignores material harm (e.g., if Bavaria left Germany, rump loses tax base). Pure consent makes secession a grant.  
     *Case anchor:* Scottish independence (UK demanded debt/asset talks).  

  5. **Sub-Region Opt-Out**  
     *Requirement:* Contiguous sub-regions voting against secession (≥55%) **remain with rump state** if feasible. Non-contiguous enclaves trigger renegotiation.  
     *Why:* Avoids Russian-doll regress. Forces compromise *before* the vote (e.g., map the opt-out zones in advance).  
     *Case anchor:* Northern Ireland’s "border poll" would likely let Unionist-majority counties stay in UK.  

  6. **Debt/Asset Protocol**  
     *Requirement:* **Pre-referendum default formula** for debt (per capita GDP share) and assets (territorial allocation). Court-adjustable for fairness.  
     *Why:* "Settled in advance" avoids post-vote chaos (e.g., Brexit’s unresolved liabilities).  

  7. **Shelf-Life & Irreversibility**  
     *Requirement:* **Frozen trigger:** Lost vote → no retry for 15–20 years. Won vote → irreversible after 2-year transition.  
     *Why:* Stops serial referendums (Quebec 1980/1995). Prevents post-vote buyer’s remorse.  

  8. **Recognition Not Required**  
     *Requirement:* Secession effective upon domestic constitutional finality; **no dependency on foreign recognition**.  
     *Why:* Avoids "Kosovo paradox" (statehood via geopolitics, not law).  

  ---

  ### **Impossible Pairings & Trade-Offs**
  - ❌ **"Demos self-defines territory" + "All affected have a say"** → Circularity. *Must* fix territory first.  
  - ❌ **"No rump veto" + "Pre-settled succession"** → Unilateral secession makes pre-agreed terms unenforceable.  
  - ⚠️ **Remedial-only vs. Plebiscitary** → Remedial (injustice required) denies democratic will (e.g., fiscally motivated secession); plebiscitary enables frivolous secession.  

  ---

  ### **Theory Scoring (1-5 on Administrability)**
  | **Theory**               | Territorial Definiteness | Franchise Clarity | Veto Handling | Sub-Region Problem | Shelf-Life | **Total** |
  |--------------------------|--------------------------|-------------------|---------------|--------------------|------------|-----------|
  | **Remedial Right Only**  | 4 (requires prior unit)  | 5                | 3 (court-heavy)| 2 (injustice focus)| 4          | **18**    |
  | **Plebiscitary/Primary** | 1 (circular)             | 4                | 1 (unilateral)| 1 (Russian dolls)  | 3          | **10**    |
  | **Negotiated Consent**   | 5 (state-defined)        | 5                | 5 (mutual)    | 4 (pre-agreed)     | 5          | **24**    |  
  *→ Negotiated Consent (Quebec Reference approach) scores highest but requires rump state buy-in.*

  ---

  ### **Killer Requirement**  
  **The sub-region opt-out (Russian doll) problem** eviscerates plebiscitary theories. If secession is a primary right, denying it to a county voting to stay is hypocritical; allowing it invites infinite regress. Only prior territorial fixation + limited opt-out (for contiguity) resolves this.  

  ---

  ### **Least Confident Requirement**  
  **Economic/military viability threshold:** Who defines "non-viable"? (e.g., if Catalonia left, is Spain still "viable" without 20% of GDP?). I propose constitutional court review with expert testimony, but this risks politicization. *Confidence: Low*.  

  **Overall Confidence in List: High** (grounded in case law and procedural necessity), but viability tests and sub-region contiguity rules need stress-testing.  

  ---
  **Recommendation**: Draft using **negotiated consent** (requires rump agreement *or* court-mediated terms) with **fixed administrative units**, **sub-region opt-outs**, and **pre-set debt formulas**. This balances self-determination with state stability and judicial administrability.
