answer: |-
  ### **Betting and Risk Workshop: Growth Rate Game**  
  **Objective:** Make students viscerally grasp why maximising growth rate (geometric mean/log wealth) beats maximising expected value (EV) in repeated gambles. Avoid Kelly/ergodicity jargon until debrief.  

  ---

  ### **Specific Failures to Engineer**  
  1. **Ruin from EV Maximisation:** Students betting high fractions (e.g., >60%) boom then bust, hitting near-zero wealth.  
  2. **Tournament Dilemma:** In a winner-takes-all round, groups that stick to conservative growth bets lose to risk-takers who "go for broke".  
  3. **Indefinite Horizon Breakdown:** When rounds end randomly, groups overbet (expecting few rounds) and crash, or underbet (fearing ruin) and miss growth.  

  ---

  ### **Game Design: "Wealth Builder"**  
  **Core Gamble:** Biased coin flip (60% heads, 40% tails). Bet fraction \(f\) of current wealth on heads:  
  - **Win:** Wealth → \( \text{wealth} \times (1 + f) \)  
  - **Lose:** Wealth → \( \text{wealth} \times (1 - f) \)  
  **Optimal Growth Fraction:** \( f^* = 0.2 \) (maximises growth rate \( 0.6 \log(1+f) + 0.4 \log(1-f) \)).  
  **Materials:**  
  - 6 groups of 3 students (mix maths/econ/philosophy).  
  - Each group: calculator, wealth tracker sheet, bet slip (pen/pencil).  
  - Instructor: Coin (or RNG), whiteboard, prize (e.g., chocolate bar).  
  **Wealth:** Start at £1,000 (fake money). Bets in 5% increments (0%, 5%, ..., 100%) to simplify.  

  ---

  ### **Timeline (90 mins)**  
  #### **1. Setup (5 mins)**  
  - Explain rules: "Your goal is to maximise final wealth. Bet a fraction \(f\) each round on heads (P=0.6). If win, multiply wealth by \(1+f\); if lose, by \(1-f\)."  
  - Demo: E.g., \( f = 0.4 \), win → £1,000 × 1.4 = £1,400; lose → £1,000 × 0.6 = £600.  
  - Emphasise: "No talking between groups. Record all bets and wealth."  

  #### **2. Fixed Rounds: 10 Rounds (25 mins)**  
  - **Goal:** Experience compounding. Expect EV-maximisers (high \(f\)) to bust.  
  - **Procedure:**  
    - Per round: Groups have 60 sec to choose \(f\). Write on slip.  
    - Instructor flips coin (or uses RNG), announces heads/tails.  
    - Groups update wealth. Instructor spot-checks 1–2 groups.  
  - **Key moments:**  
    - After round 3: Comment, "Some groups are doubling, others halving."  
    - After round 10: "Freeze wealth. Top group has £X, bottom has £Y."  
  - **Debrief hook:** "Who felt their strategy was working? Who’s nervous?"  

  #### **3. Tournament Round: 5 Rounds (15 mins)**  
  - **Goal:** Force dilemma: growth strategy ≠ contest strategy.  
  - **Twist:** "After 5 rounds, the richest group wins a prize. Winner takes all."  
  - **Procedure:**  
    - Same as fixed rounds (5 rounds).  
    - After round 5: Rank groups. Award prize to richest.  
  - **Expected failures:**  
    - Groups far behind bet \(f = 1.0\) to "catch up" (60% chance to double, 40% to bust).  
    - Groups ahead bet \(f < 0.2\) to "protect lead" and lose to risk-takers.  
  - **Debrief hook:** "Did the prize change your bets? Why?"  

  #### **4. Indefinite Horizon: Random Rounds (15 mins)**  
  - **Goal:** Break "infinite rounds" assumption. Random end creates over/under-betting.  
  - **Twist:** "After each round, I flip a coin. Heads (50%): another round. Tails: game ends."  
  - **Procedure:**  
    - Do 1 round at a time (bet → outcome → wealth update → continuation flip).  
    - Repeat until tails (expected 2 rounds, range 1–5).  
    - Final wealth recorded when game stops.  
  - **Expected failures:**  
    - Groups bet \(f > 0.5\) (gambling on few rounds) → high ruin risk.  
    - Groups bet \(f = 0\) or \(f \approx 0.1\) (fear ruin) → miss growth if rounds continue.  

  #### **5. Debrief (20 mins)**  
  - **Wealth review:**  
    - Fixed rounds: Plot wealth vs. \(f\) on whiteboard. Show high-\(f\) groups crashed (e.g., £100 → £0), moderate-\(f\) groups grew steadily.  
    - Tournament: Contrast winner’s \(f\) (likely high) vs. steady growers’ \(f\) (≈0.2).  
    - Indefinite: Compare bets to fixed rounds—who changed? Why?  
  - **Map moments to maths:**  
    - **Ruin:** "Betting \(f = 0.6\)? EV is \(0.6 \times 1.6 + 0.4 \times 0.4 = 1.12\) (12% gain), but after 10 rounds, 40% risk per round compounds → near-certain bust. Growth rate \(g = 0.6 \log(1.6) + 0.4 \log(0.4) \approx -0.07\) (ruin)."  
    - **Tournament:** "With 5 rounds, max EV bets win short contests but lose long-run. Max growth (\(f=0.2\)) gives median wealth ~£2,500, but \(f=1.0\) gives 60% chance of £32,000—enough to win a prize."  
    - **Indefinite horizon:** "If rounds are random, optimal \(f\) depends on utility. EV says bet \(f=1.0\) (maximises expected wealth), but if you hate ruin, bet less. Growth strategy (\(f=0.2\)) is robust."  
  - **Reveal concepts:** Now introduce "Kelly criterion" (growth maximisation) and "ergodicity" (time-average vs. ensemble growth).  

  ---

  ### **Mechanics Brainstorm**  
  1. **Fractional Bet Slips (chosen):**  
     - Groups write \(f\) on slips each round. Public coin flip. Simple, tactile, forces quick decisions.  
  2. **Automated Spreadsheet:**  
     - Groups input \(f\) into shared Google Sheet. RNG auto-flips. Faster but less visceral; risks tech hiccups.  
  3. **Pre-commit Strategy Cards:**  
     - Groups choose a fixed strategy (e.g., "always \(f=0.3\)") upfront. Lacks adaptive tension, less engaging.  

  **Why Fractional Slips?** Hands-on, exposes emotional tension (e.g., gasps when wealth halves), and mirrors real betting.  

  ---

  ### **Predictable Failures & Fixes**  
  1. **Chaotic Bet Collection:**  
     - Groups dither choosing \(f\). **Fix:** Strict 60-sec timer. Use countdown.  
  2. **Early Ruin Disengagement:**  
     - Groups bust in fixed rounds and tune out. **Fix:** "Bankrupt groups: track others and analyse why you busted."  
  3. **Indefinite Horizon Confusion:**  
     - Groups ignore continuation probability. **Fix:** After each flip, announce: "Heads: we go again. Tails: game ends now."  
  4. **Maths Overwhelm in Debrief:**  
     - Students miss the growth-rate intuition. **Fix:** Use whiteboard visuals—plot wealth curves, highlight \( \log(1+f) \) as the "gut feeling" metric.  

  ---

  ### **What the Game Can’t Deliver**  
  **The ergodicity insight won’t emerge organically.** Students will feel that high bets are risky and steady growth "feels safer," but they won’t spontaneously connect it to time-averaged growth vs. ensemble expectations. You must explicitly:  
  1. Contrast the "ensemble" (many groups at one time) vs. "time-average" (one group over time).  
  2. State: "Max EV assumes parallel universes; growth rate assumes one long path. Real life is one path."  

  **British English Note:** "Maths" not "math"; "£" not "$"; "telly" for TV in examples (if needed).  

  ---  
  **Run it tight, and they’ll leave with sweaty palms—not just theory.**
