prompt: |-
  I sit as a lay member of a citizens' assembly — 24 of us, selected by sortition, meeting over six weekends — charged with recommending whether our health region should close three rural birthing units and centralise maternity care in a single hospital. Our remit letter instructs us three times not to substitute our own judgment for "the will of the people," and never says what that phrase picks out. In the same month I have heard it used three other ways: a campaign against the closures insists the will of the people was already expressed in a 2019 referendum and that our assembly has no business reopening it; an organiser at a public meeting used it to close down an internal dispute — "the people have decided, we are not relitigating this"; and one of our own members uses it to mean, roughly, whatever a body like ours would recommend after hearing the evidence and deliberating.

  What I need is a disambiguation, not an introduction to populism. Please set out the distinct precise claims that "the will of the people" could be making, as a menu ordered from the thinnest reading to the most demanding, and for each reading state: what it claims; what kind of thing it takes the will to be (a tally of individual preferences, a function of them, an idealised counterfactual, an ascription by whoever successfully speaks in the name of the people, or merely a title conferring authority on some decision-maker); who counts as "the people" under it; what procedure or observation would settle what the people will; and what would count against the claim.

  Five constraints, because these are the parts I cannot work out alone.

  First, I want the readings separated into those on which the phrase purports to identify a determinate content — a policy, a ranking of options — and those on which it only settles who is entitled to decide, or only marks a decision as legitimate once made. Say which of my four uses needs the first kind and which could get by with the second, since I suspect the organiser's use relies on sliding between them.

  Second, the constituency question. Our decision imposes concentrated costs on a small, place-bound population and diffuses benefits over a much larger one, and its effects will run for decades. For each reading, say whether "the people" has determinate membership, who sets the boundary, and whether that boundary question has to be answered before the will can be ascertained or is answered by the same act of ascertainment — i.e. which readings face a regress in which the demos must already be constituted in order to constitute itself. Say explicitly whether any reading can include people who do not yet live in the region or are not yet born.

  Third, the referendum-versus-assembly conflict. Is there a reading on which an earlier, less informed expression of the will binds a later, better informed one? Which readings make the relevant will a counterfactual one — what the people would will under specified conditions of information and discussion — and what happens to the phrase's political force, and to its ability to bind officials, once it is read that way?

  Fourth, test a tradeoff I think I can see: that the readings determinate enough to settle which policy to adopt are the ones no procedure could refute, while the readings a procedure can settle (vote totals, referendum results) settle only who decides and not what is to be decided. Tell me whether the tradeoff is genuine, where it bites hardest, and which readings escape it and at what cost.

  Fifth, for each of the four uses, identify the reading doing the work and judge whether that reading is defensible on its own terms rather than merely in the mouth of the person invoking it.

  Close with your verdict on whether any reading survives as something an assembly like mine could actually apply to a decision, or whether the phrase is best understood as an honorific whose function is to immunise a decision against further challenge. Please also flag any reading that is close to the familiar contrast between a general will and the mere aggregate of everyone's private wills, but do not stop there — the interesting readings are the ones that are neither. Argue for your verdicts; do not give me a reading list, and do not lean on named theorists or citations.
reasoning: |-
  Okay, let me unpack this user's complex query. They're a lay member of a citizens' assembly grappling with the ambiguous phrase "will of the people" in a high-stakes healthcare decision. The core tension is between needing concrete guidance for their recommendation and encountering the phrase used in contradictory ways by different actors. 

  First, I notice the user isn't asking for theory lessons but practical disambiguation - they need a taxonomy of possible meanings they can actually apply. The constraints are brilliantly precise: they want to know how each reading handles constituency boundaries, temporal validity (like unborn citizens), and whether it resolves policy or just authority. The referendum vs assembly conflict is particularly thorny - can a 2019 vote bind their current deliberation?

  Hmm... the user's suspicion about a tradeoff interests me. They sense that determinate readings (like "what people would want if fully informed") might be unfalsifiable, while procedural readings (like referendum results) only tell us who decides, not what's right. I'll need to test that carefully. Also notable is their observation that one organizer seems to slide between procedural and substantive meanings - classic rhetorical move.

  For structure, I consider building from thinnest to thickest readings. Procedural readings first (just marking decisions as legitimate), then preference-aggregating ones, then counterfactual idealizations. For each, I'll need to specify: how "will" is defined, constituency boundaries, verification method, and failure conditions. The unborn constituency question is crucial - most readings exclude them, except perhaps the "future-oriented common good" version.

  On the referendum bind: only the thinnest procedural readings might treat the 2019 vote as binding. Most substantive readings would allow new evidence to override it. But that creates tension - if our assembly's recommendation is just another "will" claim, why privilege ours? Unless we argue our process better approximates the ideal counterfactual... which loops back to the tradeoff problem.

  The user's fifth constraint is sharp - they want each usage in their case analyzed. The campaign group's "2019 referendum as binding" claim only holds under very thin readings. The organizer shutting down debate is likely equivocating. Their fellow member's "what we'd decide after deliberation" is coherent but risks circularity. 

  Ultimately, I suspect the phrase functions more as decision-ratifier than guide. But for their assembly, the "deliberative counterfactual" reading might be salvageable if they rigorously document how their process meets ideal conditions. Still, they should name it something else - "considered community judgment" perhaps - to avoid the rhetorical baggage.
answer: |-
  Here is a disambiguation of "the will of the people," structured by increasing conceptual demand, analyzing each reading against your five constraints. The four uses you describe will be mapped to these readings in the final section.

  ---

  ### **1. Procedural Legitimation (Thinnest)**
  *   **Claim:** A decision is legitimate *because* it was made by a recognized procedure designated as speaking for "the people," regardless of content. The "will" *is* the outcome of the procedure.
  *   **Nature of Will:** A title conferring authority on a decision-maker or decision-process. It’s performative: the procedure *makes* the decision the "will."
  *   **"The People":** Defined by the procedure's rules (e.g., eligible voters in a referendum, members of a legislature). Membership is fixed by the procedure itself.
  *   **Settled By:** The successful completion of the designated procedure (e.g., passing a referendum vote, an elected body voting).
  *   **Counts Against:** Procedural flaws (fraud, coercion, exclusion of entitled participants, violation of rules). *Not* the substantive outcome.
  *   **Content vs. Authority:** Settles *authority only*. Marks the decision as legitimate.
  *   **Constituency:** Membership determined solely by the procedure's rules. Typically excludes future/unborn populations and may exclude current non-citizens/residents. Boundary-setting is prior and external to ascertaining the will *in that instance*; the procedure relies on a pre-constituted demos.
  *   **Referendum vs. Assembly:** The referendum result *is* the binding "will" under this reading. A later assembly cannot override it *as an expression of the will* unless the procedure designates it as a superior authority. The assembly's role would be advisory to the *existing* sovereign (the referendum result).
  *   **Tradeoff:** Escapes the tradeoff. It *can* be settled by procedure (e.g., vote count) and *does* provide a binding decision (who decides & what is decided). However, it says *nothing* about the quality, wisdom, or justice of the decision.
  *   **Defensibility:** Defensible as a minimal requirement for political legitimacy in a system relying on rule of law and accepted procedures. Avoids endless debate about substance once a procedure is followed.

  ### **2. Aggregate Preference**
  *   **Claim:** The "will" is the sum of individual preferences revealed through mechanisms like voting or polling. It claims a *descriptive fact* about what most people currently want.
  *   **Nature of Will:** A tally or function (e.g., majority rule) of individual, existing preferences.
  *   **"The People":** The aggregate of individuals whose preferences are counted. Membership defined by the polling/voting mechanism (e.g., citizens, residents, likely voters). Boundaries set by the pollster/voting rules.
  *   **Settled By:** Opinion polls or elections/referendums interpreted as preference revelations. Requires a mechanism to count.
  *   **Counts Against:** Evidence that the measurement was inaccurate (biased sample, flawed question, low turnout, strategic voting) or that preferences have significantly changed since measurement.
  *   **Content vs. Authority:** Purports to identify *content* (what people prefer now). Can be used to *claim* authority ("do what the majority wants").
  *   **Constituency:** Membership defined by the counting mechanism. Generally excludes future/unborn populations and non-participants. Boundaries are set *before* counting (who gets polled/votes). Faces a regress: who decides *who* gets polled/voted? Requires a prior procedural legitimation (#1) or external definition.
  *   **Referendum vs. Assembly:** A 2019 referendum result *is* a snapshot of aggregate preference *at that time*. It is *not* binding on content if preferences change or new information emerges. An assembly's deliberation might reveal *current* preferences, but a poll would be more direct. Counterfactuals aren't relevant here; it's about actual, revealed preferences.
  *   **Tradeoff:** Bites hard. A poll/referendum *can* settle a specific policy question (what people want *now*) empirically. However, 1) It may settle the "wrong" question (simplistic yes/no vs. complex trade-offs), 2) It ignores intensity of preference, minority rights, future impacts, and whether preferences are informed/considered. Settles content procedurally but at the cost of depth and wisdom.
  *   **Defensibility:** Defensible as a democratic baseline: governments should generally reflect citizen preferences. Weak if preferences are uninformed, volatile, based on misinformation, or when the decision impacts excluded groups (future generations, minorities).

  ### **3. Deliberative Counterfactual**
  *   **Claim:** The "will" is what the people *would* decide *if* they were fully informed, rational, free from coercion, and engaged in respectful deliberation about the common good.
  *   **Nature of Will:** An idealised counterfactual - a function of individual preferences *transformed* by ideal deliberation under specific conditions.
  *   **"The People":** The relevant community affected by the decision, ideally including future generations. Membership is conceptually prior but contested ("affected" how? geographically? by impact?). Boundaries are a substantive question *for* the deliberation.
  *   **Settled By:** The outcome of a process approximating ideal deliberation (e.g., a well-designed citizens' assembly). *Not* settled by simple aggregation (#2) or mere procedure (#1). Observing requires a surrogate process.
  *   **Counts Against:** Evidence that the deliberative process was flawed (inadequate information, unequal participation, groupthink, coercion, time pressure, failure to consider key arguments/impacts, exclusion of affected groups).
  *   **Content vs. Authority:** Purports to identify *content* (the best/right policy *for* the people). Authority is derived from the quality of the process approximating the ideal.
  *   **Constituency:** Must include all significantly affected, raising questions about future generations and those outside formal boundaries (e.g., neighbouring regions using the service). Boundaries are *part of* the deliberation ("who is 'us' for this purpose?"). Faces a regress: who deliberates to set the boundary *for* the deliberation? Requires an initial procedural definition (#1) or substantive argument.
  *   **Referendum vs. Assembly:** A 2019 referendum result is *not* the "will" under this reading unless it met impossible ideal standards. An assembly *claims* to better approximate the counterfactual by being informed and deliberative. The assembly's recommendation *is* an attempt to articulate this will. The counterfactual nature means it *can* override a past less-informed vote. Political force comes from legitimacy of the process; bindingness relies on authorities accepting *this* reading of "will."
  *   **Tradeoff:** Attempts escape: aims for a determinate content *and* a process that can (imperfectly) settle it. Cost: It's not directly observable; relies on judging the surrogate process. It's fragile – critics can always argue the process fell short. "Settling" is always contestable.
  *   **Defensibility:** Defensible as an aspirational standard for good democratic decision-making, especially for complex, long-term issues. It avoids the pitfalls of raw preference aggregation. However, claiming *any* real process perfectly captures the ideal is hubristic.

  ### **4. Substantive Common Good (Most Demanding)**
  *   **Claim:** The "will" is identical with the *objective common good* or *true interests* of the political community, regardless of what individuals actually believe or prefer. It is discovered, not aggregated or procedurally created.
  *   **Nature of Will:** An objective reality about what is best for the polity as a whole, potentially distinct from the sum of individual wills. An ascription by whoever successfully defines it.
  *   **"The People":** The political community as a metaphysical whole or enduring entity, encompassing past, present, and future generations. Membership is defined by belonging to this entity. Boundaries are fixed by the definition of the community (often contested).
  *   **Settled By:** Reasoned argument, philosophical insight, revelation, or the pronouncement of a legitimate authority (ruler, party, vanguard) claiming to discern it. No simple procedure suffices.
  *   **Counts Against:** Evidence that the claimed "good" actually harms the community, violates fundamental rights, or benefits only a subset claiming to speak for the whole. Failure of the claimed good to materialize.
  *   **Content vs. Authority:** Purports to identify *content* (the *right* policy). Often conflated with authority, as the speaker claims legitimacy *from* discerning the true will/good.
  *   **Constituency:** Strongly implies inclusion of future generations as part of the enduring community. Boundaries are inherent in the definition of the community ("the people") and are not subject to democratic revision. Faces regress: who defines the community? Requires a foundational act or myth.
  *   **Referendum vs. Assembly:** Neither a referendum nor an assembly *necessarily* discerns the true common good. The 2019 vote might have been wrong; the assembly might be wrong. The speaker claiming this will asserts their interpretation is superior. Political force is absolute for believers but contested by others. Bindingness relies on power or shared belief.
  *   **Tradeoff:** Claims determinate content but offers no reliable, agreed procedure to settle it. "Settlement" comes from power, persuasion, or authority, not observable verification. Highly vulnerable to manipulation ("I know what's *really* good for you").
  *   **Defensibility:** Defensible only within a framework that accepts an objective, knowable common good discernible by reason/authority. Highly problematic in pluralistic societies, as it dismisses dissent and can justify authoritarianism. Close to "General Will" but more explicitly substantive.

  ---

  ### **Analysis of Your Four Uses & Final Verdict**
  1.  **Campaign (2019 Referendum Binding):** Relies on **Procedural Legitimation (#1)** (the vote happened, it's binding) *or* **Aggregate Preference (#2)** (it shows what people wanted). To claim it *binds forever* requires **#1**, treating the procedure as definitive. **Defensibility:** **#1** is defensible procedurally but ignores new information/context. **#2** is defensible descriptively but preferences can change. Claiming *permanent* bindingness is hard to defend.
  2.  **Organiser ("People have decided"):** Uses **Procedural Legitimation (#1)** to shut down debate ("the decision is made, accept it"). Often *slides* into implying **Substantive Common Good (#4)** ("therefore it's the right decision"). **Defensibility:** **#1** is defensible for closing *that specific meeting's* debate on procedure. The slide to **#4** is unjustified and manipulative.
  3.  **Fellow Member (Assembly's Deliberation):** Clearly uses **Deliberative Counterfactual (#3)**. The assembly *is* the attempt to approximate the ideal will. **Defensibility:** Defensible *as the aspiration for the assembly itself*. It acknowledges limitations ("approximates") and focuses on process quality. This is the reading most aligned with your assembly's *purpose*.
  4.  **Remit Letter ("Don't substitute judgment"):** Ambiguous, but likely intends **Aggregate Preference (#2)** (don't ignore what polls/votes say) *or* **Procedural Legitimation (#1)** (respect past decisions/referendums). It *could* be interpreted as **Deliberative Counterfactual (#3)** (your job *is* to discern it, don't impose personal views). The vagueness is problematic. **Defensibility:** **#1/#2** interpretations are defensible if linked to specific past acts. Without that link, and given your task, **#3** is more defensible as your mandate.

  **Verdict:**

  *   **"The will of the people" is overwhelmingly used as an honorific or immunizing device.** Its primary function in politics is to **confer legitimacy** (**#1**) or **claim authority** (**#4**) for a decision or speaker, not to provide a clear, applicable decision rule. The phrase thrives on ambiguity, allowing speakers to slide between meanings (as your organiser did).
  *   **Only the Deliberative Counterfactual (#3) offers a reading your assembly can meaningfully apply.** It aligns with your process: you are explicitly *trying* to approximate what the people *would* will under better conditions. Treat the phrase as shorthand for **"the best informed and considered judgment of the community about its long-term common good, as discerned through our structured deliberation."** This is defensible *as your goal*.
  *   **Cost:** Acknowledge it's an *approximation*. Your legitimacy comes from the design and conduct of *your process*, not from perfectly capturing a mythical "will." Focus on rigorously upholding deliberative ideals (information, diversity, respect, reason-giving) to strengthen your claim. Explicitly justify why your process is a better surrogate than a referendum or poll for *this* complex, long-term issue.
  *   **Escaping the Trap:** Reject demands to "find" a pre-existing will. Frame your recommendation as **the product of your mandated deliberation** – your best collective judgment on the evidence for the long-term good of the community (including future generations where impacts are long-term). This grounds your authority in your specific remit and process, not the nebulous "will."
