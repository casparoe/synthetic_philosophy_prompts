prompt: |-
  Doing a PhD in philosophy of physics, and theres a distinction I keep needing that I dont have a word for. Does the following have a name?

  Take conservation of energy. As far as I can tell nobody ever uses it to work out what a system does next — you use the dynamical law for that, and then use conservation to check the answer, or to rule out candidate models before you even start. It constrains the space of allowed histories rather than pushing any particular one along. Same flavour: Pauli exclusion, the uncertainty principle. They say what can't happen, not what does.

  Two things make me think it's a real category and not just a mood. First, these are the durable ones: the dynamics got replaced wholesale (mechanics → QM → QFT) while energy and momentum conservation sailed through, quantity redefined, constraint intact — even though the standard symmetry derivation puts them downstream of the dynamics. Downstream, yet more robust. (A friend in cosmology says GR doesn't even have global energy conservation, which seems to fit: the symmetry goes, the constraint goes with it.) Second, sometimes they're all we have: in parts of particle physics you know the constraints but can't solve the dynamics, so the constraints do real predictive work by elimination.

  I care because of the Humeanism vs anti-Humeanism debate about laws. On a best-system picture these look like theorems rather than axioms — so maybe they aren't laws at all? And what would "governing" amount to for a law that never pushes anything along? It's not the derived-vs-fundamental distinction (derived claims aren't usually more robust than what they're derived from), it's not the grue/accidental-generalisation thing, and it's not quite the structural realist point about mathematical structure surviving theory change — or is it?

  Dont just hand me a label. I want the nearest established concepts, how what I described differs from each, and where the edges are: is the second law of thermodynamics in this box or not? If nothing fits, coin something and define it with borderline cases.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a PhD student in philosophy of physics, grappling with a distinction they've noticed but can't name. The main examples are conservation laws, Pauli exclusion, and the uncertainty principle—principles that constrain possible states without dictating dynamics. 

  First, I need to understand their core observation: these constraints are robust across theory changes (Newtonian to QM to QFT), while dynamical laws get replaced. They mention energy conservation persisting even when derived from symmetry, which feels counterintuitive since derived things are usually less fundamental. 

  The user’s deeper concerns seem tied to the Humeanism debate. They’re questioning whether these constraints count as "laws" in a best-system account, since they don’t "govern" in an active sense. Also, they’re noting how in particle physics, constraints sometimes do predictive work when dynamics are unsolvable. 

  I should check existing concepts. "Constraint" is obvious, but maybe too broad. "Boundary conditions"? No, those are initial/boundary specifics. "Super-selection rules" come close but are quantum-specific. "Structural laws"? Hmm, that captures invariance but might be too vague. 

  The second law of thermodynamics is a tricky case. It’s statistical and time-asymmetric, so it’s not a hard constraint like energy conservation. The user might need to decide if robustness or modality matters more. 

  Their cosmology friend’s point about GR lacking global energy conservation due to symmetry loss is a great example of the constraint-symmetry link. That reinforces the need for a term emphasizing invariance. 

  For coining a term, "Invariant Constraints" feels right—it highlights symmetry-based endurance. Or "Modal Constraints" to stress possibility-space shaping. The user’s anti-Humean angle suggests they’d prefer a term implying metaphysical necessity, but I should stay neutral. 

  Label aside, the real value is clarifying how these function: not as causal pushers but as invariant boundaries. That reshapes the laws debate—maybe "governing" isn’t about dynamism but about ruling out possibilities. The user’s contribution could be reframing laws as primarily prohibitive.
answer: |-
  This is an **excellent** observation that cuts to the heart of several philosophical and physical issues. While there isn't a single, universally accepted term capturing *exactly* your described distinction, several established concepts come close. Let's break down the contenders, their strengths/weaknesses, and how your concept fits:

  1.  **Constraint:**
      *   **Fits:** This is the most direct and widely used term. Conservation laws, Pauli exclusion, uncertainty principle *are* constraints on the state space or allowed histories of a system. They define what is *possible* or *permissible*.
      *   **Too Broad?:** "Constraint" applies to *many* things: initial conditions, boundary conditions, kinematic restrictions (like rigid rods), even specific dynamical laws themselves (e.g., F=ma constrains acceleration). It doesn't inherently capture the specific *robustness* across theory change or the *role* as a theorem rather than a fundamental dynamical postulate.
      *   **Edge Cases:** The Second Law of Thermodynamics (in its statistical form) acts as a strong *probabilistic* constraint on macroscopic state evolution, forbidding decrease in entropy for isolated systems. It shares the prohibitive character and is remarkably robust (surviving QM/QFT). However, its fundamental status and derivation are distinct from symmetry-based constraints.

  2.  **Boundary Conditions (or Initial Conditions):**
      *   **Fits:** These also restrict *which* solutions of the dynamical laws are realized in a specific context.
      *   **Misfit:** Boundary/initial conditions are typically *contingent* (specific to a system/situation) and *particular* (picking out one history). Your constraints are *universal* and *general* (applying to all systems within the theory's domain) and *modal* (defining possibilities, not selecting a specific one). They aren't "conditions" set externally; they are inherent features of the laws/theory itself. Pauli exclusion isn't a boundary condition; it's a fundamental rule.

  3.  **Super-Selection Rules (Specific to QM):**
      *   **Fits:** In quantum mechanics, super-selection rules *explicitly* forbid certain superpositions (e.g., no superposition of integer and half-integer spin states). They are prohibitive constraints arising from fundamental symmetries or structures.
      *   **Too Narrow:** This is a specific technical term within quantum theory. It doesn't cover classical conservation laws or the uncertainty principle (which is more about measurement limitations/disturbance than a strict prohibition on states).

  4.  **Structural Laws / Invariant Structure / Principle of Relativity (Generalized):**
      *   **Fits:** This captures the *robustness* aspect beautifully. These constraints often arise from deep symmetries (spacetime symmetries -> conservation laws; permutation symmetry -> Pauli exclusion; symplectic structure -> uncertainty relations) which are seen as the most fundamental, invariant aspects persisting through theory change. They define the *form* or *framework* within which dynamics operate.
      *   **Potential Misfit:** While the *origin* is structural/symmetry-based, the *functional role* you emphasize (prohibiting histories, not generating them) isn't always the primary focus of this terminology. Also, "Principle of Relativity" usually refers specifically to the equivalence of frames.

  5.  **Conserved Quantities / Conservation Laws:**
      *   **Fits:** This names a major *class* of the constraints you're interested in (energy, momentum, charge).
      *   **Too Narrow:** Doesn't cover Pauli exclusion or the uncertainty principle. Also, focuses on the conserved *value* rather than the *prohibitive role* (though they are two sides of the same coin).

  **Why Your Category is Distinct & Significant:**

  *   **Functional Role:** You pinpoint the *functional difference*: Dynamical laws *generate* evolution; these constraints *forbid* certain states or histories. They act as "guard rails," not the engine.
  *   **Robustness:** You correctly note their unusual *durability* across theory change, often exceeding that of the specific dynamical laws they constrain. This *is* a key feature of deep structural/symmetry-derived principles.
  *   **Derived but Robust:** You highlight the fascinating tension: Often *derived* from symmetries (which might be downstream of dynamics in some formulations), yet *more robust* than the dynamics. This challenges simple notions of fundamentality.
  *   **Predictive Work via Elimination:** You note their crucial predictive role in complex systems where full dynamics are intractable – they provide powerful information by ruling out vast swathes of possibility.

  **Coining a Term & Definition:**

  Given the lack of a perfect fit, coining a term is justified. The goal is to capture the **prohibitive function** and the **robust, often symmetry-based origin**.

  *   **Proposed Term: `Invariant Constraint`**
  *   **Definition:** An *Invariant Constraint* is a fundamental physical principle that:
      1.  **Prohibits:** It functions primarily to rule out certain physical states, configurations, or histories as impossible or forbidden.
      2.  **Constrains Evolution:** It restricts the allowable paths through state space defined by the dynamical laws.
      3.  **Invariant Origin:** It arises from, or is fundamentally tied to, deep structural features (e.g., symmetries, fundamental constants, topological properties) of the physical theory or reality itself.
      4.  **High Robustness:** It exhibits significant stability and persistence across major theory changes, often surviving the replacement of specific dynamical laws.

  **Applying the Term & Borderline Cases:**

  *   **Clear Cases:** Conservation of Energy/Momentum/Angular Momentum/Charge, Pauli Exclusion Principle, Gauge Invariance constraints.
  *   **Uncertainty Principle:** Fits as an `Invariant Constraint`. It prohibits states with simultaneously definite values for incompatible observables. It arises from the symplectic structure of quantum mechanics (a deep structural feature) and is robust. Its status as a "principle" vs. a derived theorem is debated, but its functional role fits.
  *   **Second Law of Thermodynamics:** **Borderline.**
      *   **Fits:** It strongly *prohibits* macroscopic processes that decrease entropy in isolated systems. It is remarkably *robust* across theories. It *constrains* possible histories.
      *   **Doesn't Quite Fit:** Its origin is fundamentally *statistical and emergent* from microscopic dynamics (though some argue for deeper roots). It doesn't arise directly from a spacetime or internal symmetry in the same way as conservation laws. It's probabilistic rather than absolute (violations are possible, just fantastically improbable). *Verdict:* The Second Law shares the prohibitive/constraining function and robustness but differs significantly in ontological origin and modality. It's perhaps a distinct *type* of fundamental constraint.
  *   **Dynamical Laws (like Schrödinger Equation or Einstein Field Equations):** Not `Invariant Constraints`. They are the *generators* of specific evolution. While they imply constraints (e.g., unitarity in QM), their primary function is generative.
  *   **Accidental Generalizations (e.g., "All gold spheres are less than 1km diameter"):** Not `Invariant Constraints`. They lack the deep structural origin, fundamental necessity, and robustness.

  **Philosophical Implications (Humeanism & Best System):**

  Your observation is crucial for the laws debate:

  1.  **Best-System Account:** `Invariant Constraints` look like prime candidates for being *axioms* in the Best System, *not* just theorems. Why?
      *   **Strength & Simplicity:** They are incredibly powerful – ruling out vast classes of possibilities with simple statements (e.g., "Energy is conserved," "No two fermions in the same state"). This gives immense deductive power.
      *   **Robustness = Informativeness:** Their persistence suggests they capture something deeply true and general about the world's structure, making them highly informative.
      *   **Not Reducible:** While derivable *within* a theory from symmetries, their cross-theoretical robustness suggests they aren't *merely* derived consequences of specific dynamics; they point to something more fundamental. Including them as axioms might yield a simpler, stronger system than deriving them from specific dynamical laws that later get replaced.

  2.  **Humeanism vs. Anti-Humeanism:**
      *   **Humean Challenge:** If laws are just summaries of regularities (Humean), how do `Invariant Constraints` "govern"? They don't seem to describe patterns of events directly; they describe *impossibilities*. Their robustness is hard to explain purely from past regularities.
      *   **Anti-Humean Opportunity:** `Invariant Constraints` fit well with views where laws express necessary features or modal structures. Their prohibitive nature directly encodes physical (im)possibility. Their robustness supports the idea they reflect deep, necessary aspects of reality.
      *   **"Governing" Revisited:** Perhaps "governing" isn't just about *producing* change (dynamical laws), but fundamentally about *delimiting the possible*. `Invariant Constraints` govern by setting the boundaries within which dynamics operate. They are the "rules of the game" that the dynamics must follow.

  **Conclusion:**

  You've identified a functionally and metaphysically significant category. While "Constraint" is the closest existing term, it's too broad. **`Invariant Constraint`** effectively captures the core features: **prohibitive function**, **structural/symmetry origin**, and **high robustness across theory change**. This concept challenges simple distinctions between fundamental/derived laws and offers a fresh perspective on physical necessity, the structure of physical theories, and the nature of lawhood, particularly within Humean best-system accounts. The Second Law highlights that not *all* strong constraints are `Invariant Constraints` in the symmetry-derived sense, pointing to potential sub-categories. Your work on clarifying this distinction and its implications for laws is a valuable contribution to philosophy of physics.
