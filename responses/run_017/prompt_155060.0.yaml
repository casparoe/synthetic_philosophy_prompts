prompt: |-
  Hi — quick favour: I need a case built to order for my seminar on the precautionary principle, and I'm sick of the standard nanotech-and-GMO examples everyones already read.

  Construct a scenario — one paragraph, realistic and contemporary, a hospital or a city council or a school board, not the fate of the species — in which the precautionary principle forbids an action that straightforward expected-utility maximisation recommends. The catch: the disagreement may not come from any of the things that normally do the work. Probabilities are known and agreed by everyone involved, so no ambiguity, no Knightian uncertainty, no "we just don't know yet." No outcome is catastrophic or irreversible. Utility is linear in money and in health. The same population bears the risk either way, so it isn't distributional. And dont get there via risk aversion, ambiguity aversion, or by quietly swapping in maximin. Whatever's left — the burden of proof, the trigger condition, the act/omission asymmetry, who counts as the proponent — has to be what carries the verdict.

  One more constraint: applying the principle symmetrically, i.e. exercising precaution against not acting, must not simply reverse the verdict, so I don't get the standard precautionary-paradox shrug.

  After the scenario, do the check: the verdict each of the two delivers and why it delivers it, the single feature doing the work, what happens if I remove that feature (does it collapse into plain cost-benefit analysis, or into the paradox?), and the best line of attack available to a defender of the principle who wants to say the case is rigged or misdescribes her view.

  The point of the exercise is to find out whether the principle has any content left once the epistemic and stakes-based rationales are stripped out — so smuggling ambiguity or catastrophic downside back in counts as cheating, and so does stipulating the verdicts instead of deriving them from the two positions.
reasoning: |-
  We are to construct a scenario that meets the following constraints:
   1. The setting is realistic and contemporary (e.g., hospital, city council, school board).
   2. The precautionary principle forbids an action that straightforward expected-utility maximisation recommends.
   3. Known and agreed probabilities by everyone involved (no ambiguity, Knightian uncertainty, etc.).
   4. No outcome is catastrophic or irreversible.
   5. Utility is linear in money and health.
   6. The same population bears the risk either way (not distributional).
   7. The disagreement must not come from standard factors (risk aversion, ambiguity aversion, maximin, etc.).
   8. The key must be in features like burden of proof, trigger condition, act/omission asymmetry, or who counts as the proponent.
   9. Applying the principle symmetrically (i.e., exercising precaution against not acting) must not simply reverse the verdict (avoid the precautionary paradox).
  10. After the scenario, we do a check: verdicts of the two approaches, the single feature doing the work, what happens if we remove that feature, and the best line of attack for a defender of the precautionary principle.

  The point: to see if the precautionary principle has independent content when stripped of epistemic and stakes-based rationales.

  Let's design the scenario:

  Setting: A city council must decide whether to install a new type of LED streetlight that uses a slightly different spectrum of blue light to save energy. The new lights are cheaper and more energy-efficient (saving money) but there is a known small risk that they might slightly increase the rate of depressive symptoms in the population (due to the specific blue light wavelength) compared to the current lights.

  Data:
  - The current lights cost $100,000 per year to operate. The new lights would cost $60,000 per year, saving $40,000.
  - The current lights are associated with a baseline rate of depressive symptoms: 100 cases per 100,000 people per year.
  - The new lights are expected to increase the rate of depressive symptoms by 1 case per 100,000 people per year (so 101 cases per 100,000).
  - The city has a population of 100,000.
  - The cost of treating a case of depressive symptoms is $5,000 (including direct medical costs and productivity loss, and note utility is linear in health and money). 
  - Additionally, the disutility of a case of depressive symptoms is valued at $10,000 (so the total cost per case is $15,000: $5,000 treatment + $10,000 disutility).

  Thus, the expected cost of depressive symptoms under the current lights: 100 cases * $15,000 = $1,500,000.
  Under the new lights: 101 cases * $15,000 = $1,515,000.

  So the total expected cost for the current lights: $100,000 (operating) + $1,500,000 (health) = $1,600,000.
  For the new lights: $60,000 (operating) + $1,515,000 (health) = $1,575,000.

  Therefore, the expected utility calculation recommends switching to the new lights because they save $25,000 per year.

  However, the precautionary principle might forbid switching. How?

  The catch: We must avoid the usual factors. Instead, we focus on the burden of proof and act/omission asymmetry.

  In the precautionary principle, the burden of proof is often placed on the proponent of the change (the one who wants to introduce the new lights) to show that the change is safe. Here, the proponent (the city council member proposing the change) has not proven that the new lights are completely without harm. In fact, we know there is a small harm (1 extra case per 100,000). But note that the expected utility calculation already accounts for that harm and still finds the change beneficial. So why would the precautionary principle forbid it?

  We need to use a version of the precautionary principle that is triggered by the mere possibility of harm (but note: we have known probabilities, so it's not about uncertainty). However, we cannot rely on catastrophic harm. Instead, we can focus on the trigger condition: the principle might be triggered by any potential harm, regardless of the magnitude, and then require that the proponent prove the absence of harm. Since the proponent cannot prove that the new lights cause zero harm (because they do cause one extra case), the principle would forbid the change.

  But note: the harm is non-zero and known, so the proponent cannot meet the burden of proving no harm. Therefore, the precautionary principle forbids the change.

  However, we must also check the symmetric application: if we apply the precautionary principle against not acting (i.e., against keeping the old lights), then we would note that the old lights are causing 100 cases of depression per year (which is a harm). If we require the proponent of the status quo to prove that the old lights are safe, they cannot because they are causing harm. Therefore, the symmetric application would forbid the status quo? But that would lead to a paradox: both acting and not acting are forbidden? 

  To avoid the paradox, we must design the principle so that it is applied only to new actions. This is the act/omission asymmetry: the precautionary principle is typically applied to new interventions (acts) and not to omissions (continuing the status quo). Therefore, the burden of proof is only on the one proposing the change.

  Thus, in our scenario:
  - The precautionary principle forbids the switch to the new lights because the proponent of the change cannot prove that the new lights cause no harm (they do cause a small harm, so they cannot meet the burden of proof of "no harm").
  - The symmetric application (against not acting) is not triggered because the principle is only applied to new actions.

  Therefore, the precautionary principle forbids the action, while expected utility maximization recommends it.

  Check:

  1. Verdicts:
     - Expected utility maximization: Switch to the new lights because it saves $25,000 per year.
     - Precautionary principle: Do not switch because the proponent of the change has not proven that the new lights are harmless (and in fact, they are not harmless).

  2. The single feature doing the work: The burden of proof on the proponent of the change to show the absence of harm (with harm being defined as any negative effect, no matter how small) and the act/omission asymmetry (so that only the new action is subject to this burden).

  3. What happens if we remove that feature?
     - If we remove the burden of proof (and the act/omission asymmetry) and apply the precautionary principle symmetrically, then we would have to also apply it to the status quo. The status quo causes harm (100 cases of depression) and the proponent of the status quo cannot prove it is harmless (it isn't). Then both acting and not acting would be forbidden, leading to the paradox. Alternatively, if we remove the burden of proof, then the precautionary principle might collapse into expected utility (if we require only that the expected harm of the new action is less than the status quo, then we would get the same result as expected utility). But note that the classic formulation of the precautionary principle is often not about expected harm but about the possibility of harm without proof of safety.

  4. Best line of attack for a defender of the precautionary principle:
     - The defender might argue that the scenario misdescribes the precautionary principle because the principle is not meant to be applied to trivial harms. The principle is usually reserved for potential serious or irreversible damages. However, we have stipulated that no outcome is catastrophic or irreversible, and we are using a small harm. But the defender might say that the principle should include a threshold of harm (e.g., significant harm) before being triggered. If we add such a threshold, then in this case the harm (1 extra case) is below the threshold and the principle would not be triggered. Therefore, the scenario is rigged by ignoring the threshold condition that is part of a reasonable application of the principle.

  However, note the constraint: we cannot rely on catastrophic or irreversible harm. The challenge is to have a non-trivial application without that. But the defender might say that without a threshold, the principle becomes absurd (because it would block any action that has any negative effect, no matter how small, and even if the overall effect is positive). So the defender might claim that the principle inherently requires a threshold of harm (even if not catastrophic) to be triggered. If we set a threshold (say, an increase of at least 5 cases per 100,000) then the new lights (with an increase of 1) would not trigger the principle and the change would be allowed. Then the verdict of the precautionary principle would align with expected utility. So the scenario might be misdescribing the principle by applying it without a threshold.

  But note: the constraint says we must not have catastrophic harm, but we did not say we cannot have a threshold. However, the problem statement requires that the disagreement comes from the burden of proof, etc. If we introduce a threshold, then we might be introducing a new element (the threshold) that is not one of the features we are testing. Therefore, the defender might argue that the scenario is rigged by applying the principle without a threshold that is part of its standard formulation.

  Alternatively, the defender might attack by saying that the burden of proof is not to prove "zero harm" but to prove that the risks are acceptable. And what is acceptable might be defined by expected utility. Then the principle would not forbid the action because the proponent has shown (by the expected utility calculation) that the risks are acceptable. But then the principle collapses into expected utility. Therefore, the defender must hold that the burden of proof is to show the absence of harm (or at least the absence of harm above a certain threshold) without regard to the benefits. And that is the core of the disagreement.

  Let's write the scenario and the check accordingly.
