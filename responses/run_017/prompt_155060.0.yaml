  ### Scenario: Municipal Water Fluoridation Adjustment

  The Riverdale City Council faces a decision on whether to adjust the concentration of fluoride in the municipal water supply. The current level is 0.7 ppm (parts per million), the standard recommended by health authorities. A peer-reviewed study proposes increasing it to 0.8 ppm, which would reduce dental caries in children by an additional 0.5% annually. The costs are fixed: the adjustment requires a one-time $50,000 equipment upgrade. Annual benefits include $80,000 in avoided dental treatments (due to fewer caries) and $20,000 in productivity gains (from fewer parent work absences). However, the same study identifies a known side effect: at 0.8 ppm, there is a 0.1% annual increase in mild dental fluorosis (cosmetic white spots on teeth), which costs $5,000 annually to treat (per 100,000 residents) and causes negligible discomfort (utility loss valued at $5,000 annually). Probabilities and utilities are uncontested: fluorosis occurs in 10 extra individuals per 100,000 (0.1% of the population), caries reduction affects 500 children. The city has 100,000 residents, all equally exposed. Expected net benefit calculation is clear:  
  - **Costs**: $50,000 (one-time) + $10,000/year (fluorosis: $5,000 treatment + $5,000 discomfort).  
  - **Benefits**: $100,000/year ($80,000 savings + $20,000 gains).  
  Discounting at 5% over 10 years, the net present value (NPV) is **+$220,000**—a net gain.  

  ### Verdicts  
  - **Expected-utility maximization (EUM)**: **Recommends the adjustment**. NPV is positive ($220,000). Health and money utilities are linear and additive; the action maximizes net welfare.  
  - **Precautionary principle (PP)**: **Forbids the adjustment**. The PP imposes a burden of proof on proponents (the council members advocating change) to demonstrate "no harm" before acting. Here, harm—mild fluorosis—is scientifically documented (10 extra cases/year). Proponents cannot meet this burden, as the evidence confirms non-zero harm. Thus, the PP blocks the action despite net benefits.  

  ### Single Feature Doing the Work  
  **Burden of proof + act/omission asymmetry**.  
  - The PP requires proponents of an action (not inaction) to prove the *absence of harm*—irrespective of magnitude or net utility.  
  - Harm is defined broadly: any non-zero negative effect (fluorosis), however minor.  
  - Asymmetry ensures the status quo (0.7 ppm) faces no burden, even though it permits caries (a larger harm).  

  ### If This Feature Is Removed  
  - **Collapse into cost-benefit analysis (CBA)**: Without the burden/asymmetry, the PP would demand symmetric evaluation of harms from acting *and* not acting. Not acting allows preventable caries (harm), while acting causes fluorosis (harm). Symmetry forces a CBA-like comparison: caries harm > fluorosis harm → action recommended. The PP loses distinct content.  
  - **No paradox**: Symmetry avoids "precautionary paralysis" (where both acting and not acting are forbidden) because harms are quantifiable and comparable.  

  ### Best Line of Attack for PP Defender  
  **The case rigs the PP by ignoring harm thresholds**.  
  - **Argument**: The PP is not triggered by *any* harm, but only by harms exceeding a context-specific threshold of "significance" (e.g., severity, scale, or irreversibility). Here, fluorosis is trivial (cosmetic, treatable), so it shouldn’t trigger the PP. The burden of proof applies only to non-trivial harms, which proponents must rule out.  
  - **Why it works**: Forces engagement with *which harms matter*, preserving PP’s core (shifting burdens for material risks) without smuggling in stakes/ambiguity. If accepted, fluorosis falls below the threshold → PP permits the action, aligning with EUM.  

  ### Why This Satisfies Constraints  
  - **No epistemic issues**: Probabilities/utilities are known and agreed.  
  - **No stakes-based rationales**: No catastrophe (fluorosis is mild), reversibility (adjustment can be undone), linear utilities, no distributional conflicts.  
  - **No risk/maximin/ambiguity aversion**: EUM uses raw expected values; PP’s verdict hinges solely on burden/asymmetry.  
  - **Symmetric PP doesn’t reverse verdict**: Symmetry leads to CBA (action recommended), not paradox.  
  - **Content test**: PP’s distinctive burden-of-proof rule drives the divergence—proving it retains non-epistemic, non-stakes-based substance.
