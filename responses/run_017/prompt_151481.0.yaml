  First, I need to anticipate objections. The physicalist might attack the coherence of non-causal covariation. The intentionalist would push representationalism as a simpler solution. The epistemologist would question how correlation without causation grants epistemic authority. The action philosopher might argue that reasons require causal roles. The other intentionalist might challenge the need for epiphenomenalism if representationalism suffices. The generalization worry is next—if covariation grants knowledge, it could apply to unwanted properties. The self-defeat concern is that if phenomenal concepts don't reveal non-physical aspects, epiphenomenalism loses its appeal. Finally, the dreaded question might be about the identity of the neural event and whether it's physical, which could undermine their argument.

