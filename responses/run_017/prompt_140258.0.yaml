prompt: |-
  I run a hardware store and I sit, as a volunteer, on the seven-person board of Cascade Ridge Search and Rescue. I have no background in philosophy, but I've been arguing about this with two friends for weeks — one says we are about to punish a man for bad luck, the other says a good process is a good process and the family is owed more than a shrug — and I'm the one who has to draft the memo before our meeting in twelve days, so I'd like it written properly.

  Here is the situation. Our field manual tells a leader to adopt the first search plan that reaches a seventy-percent probability of detection within the first hour, and then to stop planning: it says explicitly that we should not keep looking for a better plan, because every minute spent planning is a minute the missing person is getting colder. It also sets a ninety-minute "hold" window before a segment is abandoned and the search is widened. In January, a leader named Maya followed that rule exactly, found the missing hiker alive at fifty-two minutes, and in March the county commissioners gave her their Lifesaver of the Year award; there is a plaque on the wall at the station. In February, a leader named Dan — a twelve-year volunteer with no prior incidents — followed the same rule on a very similar call, held his segment for the full ninety minutes, and the hiker was found dead three hundred metres outside it, dead of exposure, with the medical examiner's estimate of time of death falling inside the hold window. At minute sixty-two Dan radioed dispatch to ask whether he should widen early, and the dispatcher — a volunteer who was simultaneously coordinating a second, unrelated call — told him to hold the segment; he held. The manual also says the field leader has final authority on scene, which is the sentence the family quotes in its letter to us, and which the local paper quoted under the headline asking why we stopped looking. Since then a donor has offered the organization a quarter of a million dollars for thermal drones, on the condition that the board state in writing that the manual's threshold rule contributed to the death; the donor turns out to be the dead man's uncle, which we only learned after the offer arrived.

  One board member is circulating a motion to suspend Dan pending a full review. A second says we cannot put a plaque on one wall and a suspension in the other for the same conduct. A third, who works in data analysis, has proposed a new standing procedure instead: re-run every serious incident in our incident simulator, feeding it only what the leader knew at the moment the plan was fixed, run that plan against a large set of simulated hiker locations drawn from our historical distribution of where people actually end up, and grade the plan on its average detection time — then train on, or if necessary discipline on, the grade rather than the outcome. I like the sound of this, but it worries me too, since our historical distribution was itself produced by searches that ran under the same rule, and since Dan's grade would depend on where in that distribution the real hiker happened to be. To complicate matters, two of our seven members are active field leaders who could find themselves in Dan's position, and one is the county's appointee who is mainly worried about the insurance pool and the newspaper.

  Please draft the memo I'll circulate in advance of the vote. It should take a clear position on four things: what to do about Dan; what to do, if anything, about Maya's award and about the manual's rule; whether we can accept the donation on the terms offered; and whether to adopt the simulation-based grading procedure, and if adopted, how much weight it should carry. It needs a concrete recommendation with a timeline rather than a menu of options, because four of seven votes are needed and I have to whip them. And it has to treat the strongest case for sanctioning Dan honestly — the family's letter is genuinely good, and the argument that a rule nobody is ever accountable under is not really a rule is the one I can't get out of my head — while still telling me what you think we should actually do and why.
reasoning: |-
  Okay, let me unpack this complex situation for the hardware store owner/board member. They need a decisive memo addressing four thorny issues under intense pressure - donor demands, media scrutiny, internal divisions, and ethical dilemmas. 

  First, the core tension: two identical actions (following the manual) led to polar outcomes (award vs death). The family's argument about accountability sticks because Dan technically had final authority but deferred to dispatch. The data analyst's simulation proposal is clever but flawed - using historical data tainted by the same protocol feels like baking bias into the system.

  Hmm... the donor's conditional offer is ethically messy. Forcing the board to declare the manual caused death would be both untrue (multiple factors involved) and set dangerous precedent. But $250k for drones is desperately needed. Maybe a counterproposal?

  For Dan... suspension seems performative. He followed protocol exactly until minute 62 when he sought guidance. The dispatcher distraction is a systemic flaw, not his failure. The "no accountability" concern is valid though - perhaps we reframe it as system accountability rather than individual scapegoating.

  The Maya/Dan paradox is fascinating. Withdrawing her award would be absurd, but the inconsistency needs addressing. The manual's rule isn't flawed per se - stopping at 70% prevents endless planning while 90min hold balances thoroughness vs speed. The real failure was in Dan's case execution.

  On simulations... promising but premature. The historical data problem is serious. Better to pilot it first with clear boundaries: for training only initially, with parallel runs comparing new/old protocols.

  *scribbles structure* 
  Memo should: 
  1) Clear Dan (with process improvements) 
  2) Uphold Maya's award + manual (but clarify final authority) 
  3) Counterproposal to donor 
  4) Test simulations cautiously 
  All wrapped in "system learning" framing to avoid blame games.

  Timeline is tight - recommendations must be actionable before next meeting. Need concrete steps: policy review by X date, donor response draft by Y, simulation trial design by Z. 

  The why matters most: SAR runs on volunteer goodwill. Punishing Dan risks collapse; pretending nothing's wrong insults the family. We walk the line by fixing systems, not people.
answer: |-
  ## Memorandum: Board Decision Framework for February Incident  
  **To:** Cascade Ridge Search and Rescue Board Members  
  **From:** [Your Name], Board Member  
  **Date:** [Current Date]  
  **Subject:** Unified Recommendations Regarding February Incident, Manual Review, Donation, and Procedural Improvements  
  **Vote Deadline:** [Meeting Date - 12 Days from Now]

  This memo provides concrete recommendations on the four critical issues before us. Our decisions must uphold our mission, honor our volunteers, ensure procedural justice, and maintain community trust. **I recommend the following actions:**

  ### 1. **Regarding Field Leader Dan:**  
     - **Recommendation:** *No suspension or discipline.* Close the review with a formal acknowledgment of the tragic outcome and a commitment to systemic improvements.  
     - **Timeline:** Decision finalized at the upcoming board meeting.  
     - **Rationale:**  
       - Dan followed protocol exactly: he adopted the first 70% PoD plan, held for the mandated 90 minutes, and sought guidance from dispatch when uncertain.  
       - The dispatcher’s instruction to "hold" (while managing another incident) was a factor beyond Dan’s control.  
       - Punishing Dan for bad luck undermines volunteer morale and contradicts the manual’s intent. **A good process is not invalidated by a single adverse outcome.**  
       - **Addressing the strongest counterargument:** The family rightly notes that "final authority" rests with the field leader. However, this authority exists within a framework of rules and team dynamics. Dan’s radio call demonstrated due diligence, not negligence. We will clarify "final authority" in training (see Section 2) but cannot retroactively hold Dan accountable for systemic ambiguities.  

  ### 2. **Regarding Maya’s Award, the Manual, & Rule Consistency:**  
     - **Recommendation:**  
       - **Affirm Maya’s award** publicly. Her actions exemplify protocol success.  
       - **Retain the 70% PoD/90-minute rule**—it balances speed and thoroughness based on decades of SAR best practices.  
       - **Clarify the "final authority" clause** via a one-page addendum: *"Field leaders retain ultimate responsibility for scene decisions but are expected to adhere to manual protocols unless extraordinary circumstances justify deviation. Dispatch guidance is advisory, not directive."*  
     - **Timeline:** Addendum drafted and distributed within 7 days; vote at meeting.  
     - **Rationale:** Inconsistent responses to identical compliance (award vs. suspension) would erode trust in the manual and our judgment. The rule itself is sound—its application in Dan’s case revealed gaps in support (dispatcher bandwidth) and training (interpreting authority).  

  ### 3. **Regarding the Donation ($250k for Thermal Drones):**  
     - **Recommendation:** **Politely decline the current terms.** Counteroffer to accept funds *without* attributing the death to the threshold rule.  
     - **Timeline:** Draft response within 3 days; approve at meeting.  
     - **Rationale:**  
       - Accepting funds contingent on admitting fault misrepresents the incident (multiple factors contributed, including hiker location and dispatch constraints) and sets a dangerous precedent for donor influence over operational policies.  
       - **Counteroffer language:** *"We are deeply grateful for your generous offer to fund life-saving drones. While we cannot attribute the February tragedy solely to our threshold rule, we commit to honoring [Hiker’s Name]’s memory by using these drones to enhance future search efficacy. We will install a plaque on each drone acknowledging your family’s contribution."*  

  ### 4. **Regarding Simulation-Based Grading:**  
     - **Recommendation:** **Pilot the simulation procedure for training ONLY for 12 months.** Do *not* use it for discipline or performance evaluation during this period.  
     - **Timeline:** Design pilot by [Date - 30 Days]; preliminary report at Q1 2025 meeting.  
     - **Rationale:**  
       - Simulations *could* improve decision-making by focusing on process over outcomes. However:  
         - Historical data is biased by past uses of the same rule (as noted), potentially entrenching flaws.  
         - Grading leaders on "average detection time" ignores real-world variables (terrain, weather, team fatigue).  
       - **Weight:** During the pilot, simulations inform *training* and *manual refinements*, not individual accountability. Revisit integration into evaluations after validating methodology.  

  ---

  ### **Implementation Timeline & Next Steps**  
  1. **Pre-Meeting (Next 12 Days):**  
     - Circulate this memo for feedback (deadline: [Date - 5 Days]).  
     - Draft manual addendum and donor response.  
  2. **Board Meeting ([Date]):**  
     - Vote on:  
       - Dan’s status (Recommendation: Close review, no action).  
       - Manual addendum + affirmation of Maya’s award.  
       - Donation counteroffer.  
       - Simulation pilot program.  
  3. **Post-Meeting:**  
     - Issue public statement: "We have concluded our review of the February incident. While the outcome was tragic, our investigation confirmed protocol adherence. We are implementing [Addendum/Drone Pilot/Simulation Training] to strengthen future operations."  
     - Send personal condolences to the family, sharing enhancements made in their loved one’s memory.  

  ---

  ### **Why This Approach?**  
  - **Moral:** We avoid scapegoating Dan for misfortune while acknowledging the family’s grief through actionable improvements.  
  - **Practical:** We preserve volunteer morale, retain a time-tested rule, and secure drone funding without compromising integrity.  
  - **Strategic:** Piloting simulations mitigates risk while allowing innovation. Clarifying "final authority" empowers leaders without inviting recklessness.  

  **We must vote not on emotion or optics, but on principles that sustain our mission.** I urge support for this package to uphold our duty to the missing, our volunteers, and our community.  

  // Signed //  
  [Your Name]  
  Board Member, Cascade Ridge Search and Rescue  

  ---  
  **Key Persuasion Points for Whip Count:**  
  - **To pro-sanction members:** "Suspending Dan signals that compliance isn’t enough—which paralyzes volunteers. Instead, we fix the *system* (dispatch, training) that failed him."  
  - **To data-simulation skeptics:** "The pilot is a no-risk test. If simulations prove valuable, we adopt them; if flawed, we discard them. Status quo is riskier."  
  - **To the county appointee:** "This package addresses the newspaper’s ‘why stop looking?’ by clarifying authority and investing in drones. It shields the insurance pool by avoiding wrongful suspension lawsuits."  
  - **To the rule-absolutist:** "We *are* upholding the rule—by not punishing Dan for following it. The addendum strengthens it with nuance."
