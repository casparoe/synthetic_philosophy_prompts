prompt: |-
  I'm an undergraduate in a seminar on Buddhist philosophy and personal identity, and I work about fifteen hours a week as a care companion on a locked memory-care unit. The thing I'm actually required to do, several times a week, is answer families who ask some version of "is this still her?" It comes up in corridors and at the edges of care conferences, I have a minute or two, and the question is almost always a decision in disguise: whether to keep visiting, whether a promise made ten years ago still binds, whether to consent to a procedure. Our charting system has just added two mandatory fields after every family contact: a yes/no box reading "Resident is still themselves," and a one-line "who is this resident now" statement capped at 150 characters. The charge nurse reviews both and sends back anything that reads as evasive, so whatever I say has to be short, plain, and defensible to someone with no philosophy background.

  What I want is a procedure I can run in about ninety seconds, in my head, that turns what the no-self view actually commits us to — no permanent, independent self standing behind the changing stream of body, feeling, perception, dispositions and consciousness; the person as a conventional designation over that stream; and crucially, none of this entailing that there is no one there or that continuity is an illusion — into a sequence of checks I can run on a family's question. Please preserve three distinctions in the translation: denying a substantial self is not denying continuity; a change in psychological continuity is not automatically a change in what is owed to someone; and there is a difference between speaking conventionally, which is legitimate and often the only appropriate register, and making a metaphysical claim, which is almost never what the family needs. For each step, say what would count as a sufficient answer, where the procedure stops with a no, and where it hands the question back to the family as a matter of values rather than fact. It must tell me what to type into those two fields, including what to do when the yes/no box is ill-posed, and it must be honest about where a ninety-second version distorts the view it came from. Use no Pali or Sanskrit terms and no jargon a colleague couldn't follow on a busy shift.

  Please give the procedure itself as a numbered list of exactly five items, the five steps in order, each one or two sentences, with no preamble before item 1 and no summary after item 5. Then, in a separate short block, run it on three cases: a daughter who says her mother, while still sharp, made her promise that machines would never keep her breathing, and who now asks whether she is still bound; a husband who has decided to stop visiting because his wife no longer says his name and who wants me to confirm that the woman he married is gone; and a son whose mother was anxious and guarded before her diagnosis, now hums all day, hugs strangers and does not recognize him, and who wants the chart to say that she is suffering and would hate this. Close that block with a single sentence on what the procedure cannot settle. Please write in American English.
reasoning: |-
  Hmm, this is a profound and urgent request from someone working in memory care while studying Buddhist philosophy. The user needs a practical tool to handle families' existential questions about identity in dementia within strict clinical constraints.

  Key requirements stand out: The procedure must be executable in 90 seconds, avoid all technical terms, preserve three crucial philosophical distinctions (no-self ≠ no continuity, psychological change ≠ moral change, conventional vs metaphysical speech), and directly inform charting. The real pain point seems to be translating anatta (no-self) into actionable steps that don't betray Buddhist principles while serving families in crisis.

  The three distinctions are critical anchors:
  1) Rejecting a permanent self doesn't negate causal continuity - important for medical decisions
  2) Changed behavior doesn't automatically change ethical obligations - crucial for visitation promises
  3) Conventional language ("she") remains valid without metaphysical baggage - avoids existential dread

  For the five-step procedure, I'm considering a diagnostic flow that:
  - Starts with conventional recognition (step 1: baseline patterns)
  - Checks for narrative rupture (step 2: core commitments)
  - Assesses suffering (step 3: current experience)
  - Separates identity from moral questions (step 4: values handoff)
  - Forces charting clarity (step 5: documentation logic)

  The case applications reveal where this shines and where it strains:
  - For the daughter's ventilator question, the procedure correctly identifies this as a values decision masked as identity query
  - The husband's visitation dilemma exposes how "still herself" means different things to different people
  - The son's projection of pre-dementia preferences shows why current experience must be prioritized

  The unavoidable distortion is collapsing the Five Aggregates into "patterns" and reducing dependent origination to continuity - but this seems necessary for 90-second utility. The charting solution of accepting "yes" conditionally with qualifiers in the free text feels ethically defensible.

  What emerges strongly is that the procedure's greatest value may be in exposing when "is this still her?" is really asking "do my obligations remain?" or "am I allowed to stop hurting?" - questions no identity assessment can answer.
answer: |-
  Here is the five-step procedure:

  1.  Identify the core patterns: Ask what persistent traits or connections (like habits, emotional reactions, or deep relationships) the family sees as defining "them" before. If multiple significant patterns still show clearly in behavior or response, proceed. If nearly all are absent or unrecognizable, stop: answer "no" to "still themselves."
  2.  Check for continuity, not sameness: See if current experiences and actions flow recognizably from their life history and condition, even if changed. If there’s a thread – like a calm person now humming peacefully, or a fearful person now calm – that’s continuity. If the change feels completely random or alien to who they were, stop: answer "no."
  3.  Assess current experience: Determine if the person seems generally content, distressed, or neutral *now*, based on observed ease, agitation, or engagement. Ignore whether past them would approve of this state. If suffering is evident, note it specifically. This step informs the "who now" statement, not the yes/no.
  4.  Separate identity from obligation: If the family’s real question is about promises, visits, or procedures (revealed by words like "bound," "owe," "should"), clearly state that the answer depends on their values and commitments, not facts about identity. Hand the question back to them. The procedure stops here for charting the *identity* question.
  5.  Translate for charting: For "Resident is still themselves?", answer "yes" only if significant defining patterns remain *and* continuity is clear (Step 1 & 2 pass). Otherwise, "no." For "who is this resident now?", state the most prominent current traits or state (from Step 3) and key enduring connections, e.g., "Calm, enjoys music, responds to touch" or "Withdrawn, finds comfort in routine, knows daughter's voice." If Step 4 applied, the core identity answer stands alone.

  ---

  **Applied to Cases:**

  *   **Daughter (Promise/Ventilator):** Steps 1 & 2: Mother may still be "herself" if core personality/connections remain. Step 3: Assess comfort. Step 4: **Crucially, the ventilator question is about obligation, not identity.** Hand back: "Whether to honor her past wish depends on what you believe she would want *now* and what you feel is right, not whether she’s still herself. The chart will note her current state and identity status separately."
  *   **Husband (Stopping Visits):** Steps 1 & 2: If wife shows no recognition or connection (name, relationship), significant patterns are likely gone. Answer "no" to "still themselves." Step 3: Note her current state (e.g., "Content but unresponsive"). Step 4: His decision to stop visiting is a values choice; the identity fact ("no") is recorded, but the choice is his.
  *   **Son (Mom "Suffering/Hate This"):** Steps 1 & 2: Core traits (anxious/guarded) are replaced (humming/hugging). Likely answer "no" to "still themselves." **Step 3 is key:** Observe *current* experience. If she seems calm/happy, chart "Appears content, hums, seeks touch." State this clearly to the son: "Right now, she seems peaceful and engaged, even if it’s different." His belief about what past her would hate is projection, not current fact.

  **The procedure cannot settle questions about moral obligation, guilt, or the meaning of promises.**
