answer: |-
  ### Scenario: University Department Mailroom
  S works in a university department mailroom. Daily, unfamiliar students from other departments approach S’s open counter, each holding a misdelivered package addressed to a different faculty member in S’s building. Handing any single package to S takes the student 5 seconds; S can immediately place it in the correct mailbox at zero cost (no delay, effort, or risk). Each correct delivery prevents moderate inconvenience (e.g., a missed medication sample for a professor’s research). Opportunities arise unpredictably but frequently; S will face hundreds over their career, with no natural endpoint (e.g., retirement is distant and arbitrary). No one else is present or obligated to intervene; S did not cause the misdeliveries. S knows the benefit will occur. The first such opportunity today is A₁.

  ### Verdicts
  1. **Standard Analysis (Urmson)**: Omitting A₁ is permissible and not blameworthy. The trivial cost (5 seconds) cannot ground a duty, as duties arise from significant sacrifice, relationships, or systemic harm-avoidance. Performing A₁ is nonetheless praiseworthy: it reflects commendable attentiveness to others’ minor needs absent any pressure. Thus, A₁ lies beyond duty—supererogatory—despite low cost, because seriality alone doesn’t impose obligation without a principled "enough" point.  
  2. **Act Consequentialism + Schefflerian Prerogative**: A₁ is required. The cost to S is negligible (well below any reasonable threshold, e.g., 5x self-weighting). The net benefit (prevented inconvenience) outweighs S’s tiny sacrifice. The prerogative permits ignoring larger costs for self, but here the cost is de minimis—falling squarely within the zone where impartial optimization binds. Omitting A₁ is wrong; it fails to maximize good.  
  3. **Kantian Wide Duty**: A₁ falls *within* duty. Beneficence is an obligatory end, indeterminate in execution. Performing A₁ fulfills this duty meritoriously; omitting it is not culpable *if* S helps sufficiently overall (latitude in degree). But A₁ itself is a valid, low-cost instance of the duty—not "beyond" it. The verdict diverges from (1): standard supererogation treats A₁ as wholly optional, while Kantianism sees it as a permissible way to discharge an existing duty.  

  ### Diagnosis  
  **Key feature**: The unbounded series with no non-arbitrary stopping point.  
  - **One-off version** (same A₁, but never recurs):  
    - Standard: A₁ *may become required*—no aggregation concern forces optionality.  
    - Consequentialism: Still required (cost still trivial).  
    - Kantian: Still within duty (no series needed for indeterminacy).  
    Verdict (1) changes: trivial cost + no series likely makes A₁ obligatory on standard analysis.  
  - **Increased cost** (e.g., each act costs S 30 minutes):  
    - Standard: A₁ remains supererogatory (cost still non-heroic).  
    - Consequentialism: Verdict *collapses*—prerogative likely shelters omission (cost now significant).  
    - Kantian: Unchanged (duty still indeterminate, omission non-culpable if overall effort adequate).  

  ### Defences  
  - **Consequentialist**: Adopt an aggregate requirement (e.g., "help in ≥100 cases/year"). This *works* by granting instance-level optionality (A₁ omissible if quota met elsewhere). But it *concedes* the supererogationist’s core claim: individual trivial-cost acts need not be obligatory. This sacrifices act-consequentialism’s core insistence that each act must maximize good.  
  - **Kantian**: Argue that "supererogation" just *is* latitude within wide duties. This *works* superficially but *costs* clarity: it erases the distinction between fulfilling duty imperfectly (non-culpable omission) and exceeding it (praiseworthy extra-duty action). It collapses supererogation into indeterminacy.  

  ### Honest Note  
  All conjuncts hold. No smuggling: verdicts derive cleanly from theories applied to the series structure. The trivial cost + unbounded series isolates the structural pressure point.  

