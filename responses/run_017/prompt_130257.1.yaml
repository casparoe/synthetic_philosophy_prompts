prompt: |-
  I am trying to work out what I actually believe about reparations for historical injustice, and my verdicts on particular cases do not seem to line up with one another. I would be grateful for help extracting a principle from them, or, if no single principle will serve, for a small set of candidate principles together with an honest account of what each one forces me to give up.

  The cases below are invented composites rather than real claims. In every one of them, assume that the wrong is real and well documented, that it was a serious wrong by any standard, and that it would ground a claim for compensation if the original parties were still alive and the clock had been stopped.

  1. Traceable gain. In 1860 a colonial government seizes a fertile valley from a farming community and transfers title to a chartered company. The company's successor still holds the land. The community's descendants are identifiable, poorer than the national average, and include people who were displaced as children. Reparation is owed, to the descendants, from the current holder. This is my easy case.

  2. Dissipated gain. The same seizure, except that the valley turns out to be worthless, the company abandons it and collapses in 1890, and nothing of value passes to anyone. The descendants are still disadvantaged relative to the national average. Something is owed, and I am not confident that it should be less than in case 1, even though no one is now enriched. I do not know what the payment would be for.

  3. Legality at the time. The seizure was authorised by statute and approved by most of the enfranchised population, and everyone involved knew it would never be reversed. Owed, and in no smaller measure than in case 1. I reject this defence outright.

  4. Living victim. A state imprisons an innocent person for twelve years, knowing the evidence was fabricated. Owed. I take this to be the paradigm that the other cases must be shown to resemble, and I distrust any principle that handles it by a separate mechanism.

  5. Unwanted benefits. The perpetrating state later built roads, schools and hospitals in the victims' region, with the result that the descendants' living standards are higher than they would have been had the wrong never occurred. I do not think this reduces what is owed at all. The roads-and-hospitals offset strikes me as an evasion, though I cannot say precisely why it differs from an offset I do accept.

  6. Accepted part-payment. In 1900 the same state pays a compensation package, accepted in good faith by the victims' leaders, worth roughly a third of what we would now judge adequate. I think this genuinely reduces the debt and may discharge it.

  7. Overlapping descent. The wrongdoing state's population has turned over: nine in ten of its current citizens descend from people who arrived after the wrong, as refugees the state later admitted, and roughly half of the claimants also descend from the perpetrators. I do not think the newcomers owe anything personally. But I also think the state owes reparation out of general taxation, which is to say partly out of their pockets. I cannot make these two verdicts consistent.

  8. Existential precondition. Had the wrong never occurred, almost none of the people now claiming would have been born, since it changed who met, married and migrated. This is not a bar to a claim, but I want to know why it is not a bar, given that it seems to show that no claimant was made worse off than they would otherwise have been.

  9. Dead culture, no demand. The wrong destroyed a language and a set of religious practices. The descendants are now glad that their children speak the majority language and do not want the practices revived. Something is owed, but restoration is neither available nor wanted, and I do not know what shape the payment should take.

  10. The case I go back and forth on. A wrong committed two centuries ago by a private corporation whose shareholders cannot be traced. The wrong itself is over, but its effects are locked into a still-operative constitutional clause that continues to advantage one group. Sometimes I think the state must act, because it is the state that now enforces the clause; sometimes I think the chain has gone cold and nothing is owed.

  My tentative principle, which I suspect is inadequate: a historical wrong generates a debt held by the transgenerational political community that committed it and owed to the transgenerational community that suffered it; the debt does not lapse with time; its magnitude is the loss that the wrong explains, net of benefits the victims received because of the wrong; and it is discharged by payment to the victim community's legitimate representatives. As far as I can tell, this gets case 5 wrong and leaves cases 2, 7 and 9 unexplained.

  What I would like from you:

  One or two candidate principles, stated precisely enough that they generate verdicts rather than gestures. If the correct answer is a two-level account, with a ground of duty separate from a rule of quantification, say so and state both parts.

  For each clause of each principle, the case that motivates it, and what breaks if the clause is removed.

  Verdicts on at least three cases I have not listed. Suggestions, though you need not use them: wrongs committed by a church or a corporation rather than a state; claimant groups that were themselves perpetrators of a comparable wrong against a third group; wrongs that are still ongoing rather than historical; wrongs whose perpetrator state was later conquered and replaced by a government drawn largely from the victims' descendants; wrongs whose modern descendants publicly endorse what was done.

  An explicit statement of which of my verdicts the principle cannot accommodate, whether a more complicated principle could accommodate them, and whether you think the added complexity is worth paying for.

  A verdict on case 10, with the reasoning that produces it.
reasoning: |-
  Okay, the user is grappling with the ethical complexities of reparations for historical injustices. They've presented ten hypothetical cases where their intuitive judgments seem inconsistent, and they're seeking a coherent principle to unify their views. This is clearly a thoughtful, morally engaged person trying to reconcile philosophical rigor with moral intuition.

  Hmm, their cases cover key tensions in reparations theory: traceability of gains (case 1 vs 2), intergenerational transfer of obligation (case 7), counterfactual harm (case 8), and institutional perpetuation (case 10). Their rejected "offset" argument in case 5 suggests they view reparations as about more than material loss - perhaps about recognition or moral injury.

  Their tentative principle shows they're already thinking in terms of transgenerational political communities, but it struggles with cases where material loss is absent or benefits exist. The discomfort in case 7 reveals the core tension: how can states owe reparations without imposing personal liability on new citizens? That's the hinge.

  Let me structure this systematically. First, I should acknowledge their moral intuitions are mostly consistent in rejecting defenses based on legality (case 3) or offsetting benefits (case 5). Their struggle with case 7 is the real crux - it exposes the need for a non-personal, institutional model of obligation.

  For a candidate principle, I'll adapt their community-based approach but focus on the state as a persistent moral agent. The key move is separating the state's liability from individual citizens' guilt. Case 4 (living victim) provides the core analogy: the state owes repair regardless of personnel changes. This handles case 7 neatly - newcomers aren't personally liable but participate as current members of the obligated community.

  Case 2 (dissipated gain) reveals reparations aren't about unjust enrichment but harm repair. Case 8 (existential precondition) needs careful handling - we can say the wrong created unjust conditions of existence, not that specific individuals were harmed counterfactually. Case 10 requires examining whether the constitutional clause actively perpetuates the original wrong.

  I should test this against their unresolved cases. For case 5 (unwanted benefits), the principle explains why material improvements don't negate the need for acknowledgment - the moral injury persists. For case 9 (dead culture), reparations become symbolic acknowledgment since restoration is impossible.

  The alternative "continuity of harm" principle is worth presenting too, though it struggles with case 2 where harm persists without institutional continuity. Showing both options lets them see the trade-offs: community continuity captures more cases but requires abstracting the state as a moral agent; harm continuity is concrete but can't handle all historical cases.

  For case 10, I'll argue the state must act because it's actively enforcing an unjust structure - the constitutional clause is the persisting institutional embodiment of the original wrong. That satisfies their intuition that "the chain hasn't gone cold" when harm is structurally maintained.

  Finally, I'll be transparent about what their intuitions must surrender. If they accept the community model, they must embrace the state as a transgenerational moral entity. If they prefer the harm model, they lose case 2. Their case 6 (accepted part-payment) fits both, showing compensation can reduce obligations through historical acknowledgment.
answer: |-
  Your struggle reveals a deep tension in reparations theory: **balancing corrective justice with practical realities across generations**. Based on your intuitions, I propose two candidate principles. Both prioritize *institutional continuity* and *persistent harm*, but with different emphases:

  ### Candidate Principle 1: Institutional Continuity & Moral Debt (Your intuition refined)
  > **A transgenerational political community (state) owes reparations for its institutional wrongs if:**
  > **(a)** The state persists as a continuous moral agent (*ground of duty*),  
  > **(b)** The wrong caused or perpetuates a present disadvantage traceable to that injustice (*quantification rule*),  
  > **(c)** Reparation is feasible and directed to the victim community’s legitimate representatives.  
  > **Debt magnitude** = Original wrongful harm MINUS *voluntary* compensation already accepted, PLUS compounding costs of unaddressed injustice.  

  #### Why this fits your judgments:
  - **Case 1 (Traceable gain):** Fits (a-b). State continuity + present disadvantage.  
  - **Case 2 (Dissipated gain):** Still owed due to **persistent disadvantage** (b), even without enrichment.  
  - **Case 3 (Legality):** Rejected because state wrongdoing isn’t excused by past legal norms (a).  
  - **Case 4 (Living victim):** Paradigm case – state liability is immediate (a).  
  - **Case 5 (Unwanted benefits):** *No offset* because benefits were imposed, not reparative. Harm ≠ material loss alone; includes moral injury/autonomy violation.  
  - **Case 6 (Part-payment):** **Voluntary acceptance** reduces debt (quantification rule).  
  - **Case 7 (Overlapping descent):** **State owes, not individuals** (a). Newcomers inherit civic obligations by joining the polity, not personal guilt. Taxation is a collective duty.  
  - **Case 8 (Existential precondition):** Owed because the *wrong* created the conditions of existence under injustice. Focus is on **rectifying unjust systems**, not counterfactual individual welfare.  
  - **Case 9 (Dead culture):** Owed for **destruction of communal autonomy** (b). Payment could fund cultural revitalization *if desired*, or symbolic acknowledgment.  
  - **Case 10 (Constitutional clause):** **Owed** because the state actively enforces an unjust structure traceable to the wrong (a-b).  

  #### What you surrender:
  - **Individual enrichment isn’t necessary** (Case 2). You must accept reparations as *harm repair*, not *unjust disgorgement*.  
  - **No benefit offsets** (Case 5). You reject "benevolent colonialism" as morally irrelevant to the debt.  
  - **State continuity overrides demographic change** (Case 7). New citizens bear fiscal obligations, but not blame.  

  ---

  ### Candidate Principle 2: Continuity of Harm & Structural Repair (Alternative)
  > **Reparations are owed when:**
  > **(a)** A current institution (state, corporation, etc.) **perpetuates harm** from a past wrong OR **retains benefits** from it (*ground of duty*),  
  > **(b)** The victim group suffers **present disadvantage traceable to that wrong** (*quantification rule*).  
  > **Debt magnitude** = Cost of dismantling harmful structures + value of retained benefits.  

  #### How it differs:
  - **Case 2 (Dissipated gain):** *Not owed* – no perpetuation/retained benefit (a). **Breaks your intuition.**  
  - **Case 5 (Unwanted benefits):** Benefits irrelevant unless they *perpetuate harm* (e.g., roads enabling resource extraction).  
  - **Case 7 (Overlapping descent):** State owes only if it *retains benefits* (e.g., land, wealth). Newcomers don’t owe unless they directly benefit.  
  - **Case 10 (Constitutional clause):** Stronger case – the clause *is* perpetuation (a).  

  #### What you surrender:
  - **Case 2** – You must abandon compensation for "pure harm" without enrichment/perpetuation.  
  - **Case 8** – Harder to justify if no *current* structure perpetuates harm.  

  ---

  ### Verdicts on New Cases
  1. **Corporate Wrong (e.g., British East India Co. loots Bengal):**  
     - **Principle 1:** *Owed by state* if the corporation acted as state agent (e.g., under charter).  
     - **Principle 2:** *Owed by corporation’s successor* if benefits retained (e.g., archived artifacts).  

  2. **Claimant as Perpetrator (e.g., Māori displaced Moriori):**  
     - **Both Principles:** Reparations owed *to Moriori by the state*, but Māori claimants’ obligations are separate. No "offset" – each wrong stands alone.  

  3. **Conquered Perpetrator State (e.g., Aztec Empire replaced by Mexico):**  
     - **Principle 1:** *Not owed* – no continuity with Aztec state.  
     - **Principle 2:** *Owed* if Mexico benefits from Aztec plunder (e.g., gold in museums).  

  ---

  ### Case 10: Constitutional Clause
  - **Verdict: Owed.**  
  - **Reasoning (Principle 1):** The state *actively enforces* a clause born of injustice, perpetuating disadvantage (ground (a-b)). The corporate origin is irrelevant; the state is the operative wrongdoer *now* by maintaining the clause.  
  - **Reasoning (Principle 2):** The clause *is* the perpetuation (ground (a)).  

  ---

  ### Which Principle for You?
  **Principle 1 better captures your intuitions** but requires accepting:  
  - The state as a transgenerational moral agent (not just a current government).  
  - Harm repair independent of benefit retention (Case 2).  
  - Collective obligation via citizenship (Case 7).  

  **Principle 2** is cleaner but **forces surrender of Case 2** and weakens Case 8.  

  ### Explicit Conflicts
  Your tentative principle fails **Case 5** (rejects offsets) and **Case 7** (state vs. individual obligation). Principle 1 resolves both by:  
  - Treating imposed "benefits" as irrelevant to the *debt* (though they may affect harm quantification).  
  - Separating *state liability* from *personal guilt*.  

  **Is complexity worth it?** Yes. Reparations require grappling with collective continuity – avoiding this leads to greater inconsistencies. Principle 1’s two-level structure (duty from state continuity, quantification from harm) handles your hardest cases without ad hoc exceptions.

  ### Final Recommendation
  **Adopt Principle 1, but add:**  
  > *"Payment should prioritize the victim community’s self-determined repair, even if not ‘restorative’ (Case 9)."*  

  This honors your rejection of paternalism (Case 5) and accepts that reparations may be symbolic when restoration is impossible.
