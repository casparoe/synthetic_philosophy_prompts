  Note that the "Life Principle" for social cases is a bit stretched, but we note the potential difference. We could instead say "only when the resulting object is alive or has a certain organization", but the original request was for the "nothing composes unless the result is alive" view, so we'll stick to that and note the social case might be metaphorical.

  Also, note that in Node 5, we only have two options, but there could be other principles. However, we are required to have these two.

  Finally, the quantifier variance view might be combined with easy ontology, but in our flowchart, it is a separate leaf. The easy ontology view says that there are composite objects, and the question is settled by the rules of our language. This is very close to quantifier variance. In fact, they might be the same view. So we have one leaf for both.

  Now, the five nodes as numbered items for the handout.
answer: |-
  1. When people disagree about what objects exist (like whether a statue is the same object as the clay it's made from, or whether a merged-and-split philosophy department is the same department), do you think there's always one right answer, or could both be valid depending on how we talk?  
     - **Both could be valid**: That's **Quantifier Variance**. (Commitment: What exists isn't fixed; it depends on how we use words.)  
     - **There's always one right answer**: Go to 2.  

  2. For any bunch of things (like particles in a cat or people in a queue), is there always a single whole object they make up—no matter how scattered or unrelated they are?  
     - **Yes, always**: Go to 3.  
     - **No, not always**: Go to 4.  

  3. When a statue and the clay it's made from occupy the same space at the same time, are they two objects or one? (Likewise, for a department and the faculty group it's made from: two things or one?)  
     - **Two objects**: That's **Coincident Objects**. (Commitment: Two things can be in the exact same place at once.)  
     - **One object**: That's **One Thing**. (Commitment: Apparent differences, like persistence through change, must be explained—e.g., with temporal parts.)  

  4. When *do* some things compose an object? (Consider: particles in a cat but not in a scattered pile; people in a queue but not in a random crowd.)  
     - **Never—no composite objects**: That's **Nihilism**. (Commitment: Only fundamental particles exist; statues, cats, and departments aren't real objects.)  
     - **Sometimes, but it's arbitrary**: That's **Brutal Composition**. (Commitment: There's no reason why some collections compose and others don't.)  
     - **Sometimes, with a principled reason**: Go to 5.  

  5. What's the principle? (Does it apply the same to both physical things, like a cat, and social things, like a department?)  
     - **Only when the result is alive** (for physical) **or organized like an organism** (for social): That's **Life Principle**. (Commitment: Non-living/organized collections, like a flat-pack chair in its box or a disorganized crowd, don't compose objects.)  
     - **Only when the parts are the entire universe**: That's **Monism**. (Commitment: The cosmos is the only composite object; everything else is just its parts.)
