  8. **Consistency**: LogicalProb undefined; confidence reflects *pragmatic necessity* → **0.99** valid as "working credence," not probability.  
  9. **Implication**: Logical implication *should* force `P(C) ≥ P(T) + P(T→C) - 1` (≈0.98 here), but felt credence doesn't budge. ECLP says: if your access to T and T→C is high, *and no new errors introduced*, C *must* inherit. Resistance suggests hidden doubt about implication's proof.  

  New cases:  
  - **200-page proof**: LogicalProb=1. Community vetting → low error-rate. But length adds systemic risk (fatigue, subtle gaps). ECLP: **0.995** (slightly below case 5 due to fewer readers).  
  - **Tomorrow's journal**: Current 0.5 is LogicalProb * conditional on today's access. Tomorrow's update resets LogicalProb to 0 or 1 → **certainty upon seeing result**.  
    
  Sacrifices:  
