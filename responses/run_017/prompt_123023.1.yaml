  my opening: your whole move needs you to be able to install a disposition in yourself beforehand — decide now to be a payer, train yourself, whatever. so take this version instead. the driver doesnt want the money. he's lonely, and what he wants is to be sincerely thanked by someone, and he's a perfect judge of that too, so acting it out gets you nowhere. you cant decide to feel grateful on purpose any more than you can decide to find a joke funny, so there's nothing there for your "make yourself irrational" move to grab hold of. and even in the versions where it does work: you're deliberately choosing to become a worse reasoner, which sounds like cheating, not like what rationality recommends. go.

