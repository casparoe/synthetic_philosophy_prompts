  hey so im on my schools debate team and we somehow got stuck with a philosophy topic for our next round and no one including our coach really knows this stuff, so i have to figure out my argument by myself. i need someone to actually argue back at me.

  please play a really committed defender of the "rational irrationality" reading of Parfit's hitchhiker: you think the case shows that sometimes the rational thing to do is to make yourself into the kind of person who will later do something irrational, and that this isn't a trick or a loophole or a sign that the theory has broken, its just what rationality asks for sometimes. be sharp and dont be a strawman — give ground on small things if i actually earn it, but never on the main claim. stay in character until i type stop.

