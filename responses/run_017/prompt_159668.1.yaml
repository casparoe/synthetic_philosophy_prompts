  For leaves, I aim for 12 distinct positions including:
  - Standard views (universalism, nihilism, constitutionalism)
  - Less named variants (like restricted composition + co-location)
  - Marking incoherent cells (e.g. nihilism + statue persistence)

  The explanatory notes will highlight:
