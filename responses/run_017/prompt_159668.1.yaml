  The assessment will show that the composition question does heavy lifting by eliminating 50% of options early, while temporal part tests have low yield. This helps prioritize if space is tight.
answer: |-
  Here is a decision tree designed for pedagogical use, built from logical space with concrete cases. It has **9 branching nodes** leading to **12 distinct leaves**, with clear flags for convergences and dead branches.

  ---

  ### **Material Constitution Decision Tree**
  *Answer each question based on concrete cases (statue/lump scenarios). Follow your path to discover your position.*

  #### **Branch 1: Composition**  
  *(A junkyard has scrap metal arranged exactly like a car. Is there a car?)*  
  → **Yes** (Composition sometimes occurs) → Go to Branch 2  
  → **No** (Only fundamental particles exist) → **Leaf 1: Mereological Nihilism**  

  #### **Branch 2: When Composition Occurs**  
  *(A random puddle of rainwater forms in a ditch. Is there a "puddle-object"?)*  
  → **Always** (Any arrangement composes something) → Go to Branch 3  
  → **Only for living things** (A living cat exists, but no puddle-object) → Go to Branch 4  
  → **Only when useful** (A car exists if we need transport, but no random puddle-object) → **Leaf 2: Pragmatic Universalism**  

  #### **Branch 3: Pre-Existence**  
  *(Last week, the artist had an unshaped lump of clay. Was *the statue* already present?)*  
  → **Yes** → Go to Branch 5  
  → **No** → Go to Branch 6  

  #### **Branch 4: Living Things & Identity**  
  *(The lump of clay becomes a statue. After squashing, is it the same *thing* as before?)*  
  → **Yes** (It survived as lump) → **Leaf 3: Animalism (Restricted)**  
  → **No** (Squashing destroyed it) → Go to Branch 7  

  #### **Branch 5: Survival of Flattening**  
  *(The statue is flattened into a disc 1 second before completion. Does *the statue* survive?)*  
  → **Yes** → **Leaf 4: Monist Endurantism**  
  → **No** → Go to Branch 8  

  #### **Branch 6: Coincidence at a Time**  
  *(Right now, the statue and its clay occupy the same space. How many objects are here?)*  
  → **One** (Counted differently) → **Leaf 5: Relative Identity**  
  → **Two** → Go to Branch 9  

  #### **Branch 7: Modal Differences**  
  *(Could the *statue* have been made of bronze? Could the *clay* lose its shape?)*  
  → **Yes to both** → **Leaf 6: Constitution without Identity**  
  → **No: Statue can’t change matter, clay can’t lose shape** → **Leaf 7: Essentialist Co-Location**  

  #### **Branch 8: Temporal vs. Modal Properties**  
  *(The statue is melted and recast identically. Is it the same statue?)*  
  → **Yes** (Survives recasting) → **Leaf 8: Anti-Essentialist 4Dism**  
  → **No** → **Leaf 9: Perdurantist Co-Location**  

  #### **Branch 9: Shape Reproduction**  
  *(A molecule-for-molecule duplicate of the statue is made from new clay. Is it the same statue?)*  
  → **Yes** → **Leaf 10: Universalist Co-Location**  
  → **No** → **Leaf 11: Mereological Essentialism**  

  ---

  ### **Leaves (Positions)**  
  1. **Mereological Nihilism**  
     *Slogan: "Only simples exist; statues are illusions."*  
     Least comfortable: Statues *never* exist—only particles "arranged statuewise."  

  2. **Pragmatic Universalism**  
     *Slogan: "Objects exist when they answer to human interests."*  
     Least comfortable: Whether a statue exists depends on our *purpose*.  

  3. **Animalism (Restricted)**  
     *Slogan: "Only living things persist through material change."*  
     Least comfortable: The lump *is* the statue (they are identical).  

  4. **Monist Endurantism**  
     *Slogan: "One object with changing properties over time."*  
     Least comfortable: The lump and statue are the same entity at all times.  

  5. **Relative Identity**  
     *Slogan: "One thing, counted under different concepts."*  
     Least comfortable: "The statue" and "the clay" are descriptions, not distinct entities.  

  6. **Constitution without Identity**  
     *Slogan: "The statue is made of clay but isn’t identical to it."*  
     Least comfortable: Two objects in one place, differing only modally/historically.  

  7. **Essentialist Co-Location**  
     *Slogan: "Two objects, one space, different essences."*  
     Least comfortable: Accepts coincident entities with incompatible properties.  

  8. **Anti-Essentialist 4Dism**  
     *Slogan: "Statues are temporal stages of matter."*  
     Least comfortable: The statue is a phase of the lump’s lifespan.  

  9. **Perdurantist Co-Location**  
     *Slogan: "Statue and lump share temporal parts but differ overall."*  
     Least comfortable: Overlapping spacetime worms with distinct boundaries.  

  10. **Universalist Co-Location**  
      *Slogan: "All arrangements compose objects; many coincide."*  
      Least comfortable: Countless objects occupy every region (e.g., statue, lump, "statue-minus-pinky").  

  11. **Mereological Essentialism**  
      *Slogan: "Change any part, and you get a new object."*  
      Least comfortable: The statue ceases to exist if a single molecule is replaced.  

  *(Leaf 12: **Unnamed** – Rejected at Branch 4 → "No" + Branch 7 → "No". Incoherent: Claims composition only for living things but denies lump/statue identity after destruction.)*  

  ---

  ### **Annotations**  
  - **Dead Branches**:  
    - *Branch 1 → No*: Eliminates all later questions (nihilists reject composition/persistence of composites).  
    - *Branch 5 → Yes*: All positions agreeing the statue pre-exists *and* survives flattening collapse into monism (Leaf 4).  
    - *Branch 6 → One*: Only Relative Identity (Leaf 5) avoids co-location.  

  - **Convergences**:  
    - **Co-Location Views** (Leaves 7, 9, 10) all say "two things in one place" at Branch 6. They diverge at Branch 8 (temporal parts) and Branch 9 (modal essentialism).  
    - **Constitution vs. Co-Location**: Leaf 6 (Constitution) and Leaf 7 (Co-Location) agree on modal differences but split at Branch 6 ("two things" vs. "one thing counted two ways").  

  - **Unoccupied/Incoherent Cells**:  
    - *Nihilism + Statue Persistence*: Incoherent (rejects statues).  
    - *Restricted Composition (living only) + Co-Location*: Unattractive (why would only living things allow coincident entities?).  
    - *Monism + Modal Differences*: Incoherent (one object can’t have contradictory properties).  

  ---

  ### **Efficiency Notes**  
  - **Highest-Yield Node**: **Branch 1 (Composition)** splits the logical space in half, eliminating 7 leaves if answered "No".  
  - **Lowest-Yield Node**: **Branch 8 (Recasting)** only separates 4Dism from other co-location views.  
  - **Trimming Advice**: If space is tight, collapse Branch 8 into Branch 9 (merge recasting/shape repro) and drop Branch 4’s "living things" fork (rarely held).  

  This tree isolates core commitments while masking jargon. Students confront tradeoffs (e.g., co-location’s ontological cost vs. monism’s modal rigidity) before learning labels.
