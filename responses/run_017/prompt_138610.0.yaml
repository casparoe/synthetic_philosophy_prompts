prompt: |-
  I teach an upper-level undergraduate seminar on experimental philosophy and I am setting the final. I need one essay question on the Knobe effect that cannot be answered by rehearsing the chairman case and the finding that moral valence drives intentionality ascriptions. The crux I want tested is whether students can say what would count as evidence about the concept of intentional action here, rather than evidence about something else that the word is used to do.

  Build the question around a variant I will hand them. A transport official adopts a new scheduling system in order to cut costs, knowing and not caring that it will add roughly one traffic death a year along one stretch of road, with no way to say in advance whose death it will be. Participants say she intentionally caused the deaths; rerun the case with one fewer death a year as the side effect and they deny that she intentionally saved anyone. Tell the students now to suppose three further things: (i) the asymmetry holds at the same magnitude in a condition in which the official is misinformed — she believes the change will reduce deaths and it in fact increases them, and conversely; (ii) it also holds when the side effect comes from letting an existing safety programme lapse rather than from adopting the new system; and (iii) in the omission condition, ascriptions of intentionality track ascriptions of blame far more closely than they track ascriptions of foresight or of desire.

  The question should force students to separate the empirical claim from the claim about the semantics or pragmatics of intentionally, to work out what each of the main families of explanation — norm-violation accounts, reasons- or explanation-based accounts, and conversational or pragmatic accounts — predicts for (i) to (iii), and to describe one further study whose result would discriminate between the two live options they are left with.

  Give me the question as it should be printed for a 60-minute, roughly 800-word answer; a model answer of about 800 words; and a marking scheme out of 20 built around five must-hit points, with the marks each is worth and a one-line note on how students typically get each one wrong. In the model answer, mark explicitly which claims are empirically settled and well replicated and which are genuinely contested among people who work on this, and do not present any contested interpretation as the consensus. Keep the whole thing free of citations, bibliographies and reading lists: the students have a fixed syllabus, and I care about the argumentative moves rather than the names attached to them.
reasoning: |-
  We are designing an exam question that tests the student's ability to think about what constitutes evidence for the concept of intentional action (as opposed to evidence about the use of the word). We have a variant of the Knobe effect with the transport official. The base case: when the side effect is bad (one extra death) participants say she intentionally caused the deaths; when the side effect is good (one fewer death) they deny she intentionally saved anyone.

  We then add three further hypothetical findings:
  (i) The asymmetry holds even when the official is misinformed: 
     - In the bad case: she believes the change will reduce deaths but it actually increases them by one. Participants still say she intentionally caused the deaths.
     - In the good case: she believes the change will increase deaths but it actually reduces them by one. Participants deny she intentionally saved anyone.
  (ii) The asymmetry holds in an omission condition: 
     - Instead of adopting a new system, she lets an existing safety program lapse. 
     - The bad side effect (one extra death) is judged intentional; the good side effect (one fewer death) is not judged intentional.
  (iii) In the omission condition, ascriptions of intentionality are more closely tied to ascriptions of blame than to ascriptions of foresight or desire.

  The question should force students to:
  1. Separate the empirical claim from the claim about the semantics/pragmatics of "intentionally".
  2. Work out what the main families of explanation (norm-violation, reasons-based, conversational/pragmatic) predict for (i) to (iii).
  3. Describe one further study that would discriminate between the two live options they are left with.

  We'll structure the question accordingly.

  Question as printed:

  ---
  **Question**

  Consider the following variant of the Knobe effect. A transport official adopts a new scheduling system to cut costs, knowing and not caring that it will cause one additional traffic death per year along a particular stretch of road. Participants typically say she intentionally caused the deaths. When the case is altered so that the side effect is one fewer death per year (and she knows and doesn't care about that), participants deny that she intentionally saved anyone.

  Now suppose three further hypothetical findings:

  (i) The same asymmetry holds even when the official is misinformed. Specifically:
     - In the bad outcome case: she believes the change will reduce deaths but it actually increases them by one per year. Participants still say she intentionally caused the deaths.
     - In the good outcome case: she believes the change will increase deaths but it actually reduces them by one per year. Participants deny that she intentionally saved anyone.

  (ii) The asymmetry also holds when the side effect results from an omission: the official lets an existing safety program lapse (to cut costs) rather than adopting a new system. In the bad outcome (one extra death per year), participants say she intentionally caused the deaths; in the good outcome (one fewer death per year), they deny she intentionally saved anyone.

  (iii) In the omission condition, ascriptions of intentionality (whether she acted intentionally) are strongly correlated with ascriptions of blame (whether she is to blame) but not with ascriptions of foresight (whether she foresaw the outcome) or desire (whether she desired the outcome).

  Your task:

  1. Explain what the original Knobe effect (without these hypothetical findings) shows about the relationship between moral valence and intentionality ascriptions. Then, explain why the three hypothetical findings (i)-(iii) complicate the simple view that the word "intentionally" is used solely to express moral blame. (5 points)

  2. For each of the three main families of explanation for the Knobe effect — norm-violation accounts, reasons-based (or explanation-based) accounts, and conversational/pragmatic accounts — state what each would predict for findings (i), (ii), and (iii). (9 points)

  3. Suppose that after considering these predictions, you are left with two competing explanations that are both consistent with (i)-(iii). Propose one further experiment that could help discriminate between these two. Describe the experiment and state what each of the two explanations would predict for its outcome. (6 points)

  Total: 20 points

  ---

  **Model Answer (approx. 800 words)**

  **1. The Original Knobe Effect and the Complication**

  The original Knobe effect demonstrates that moral valence influences judgments about intentional action. In the classic chairman case (and the transport official variant), when an agent brings about a negative side effect (harming the environment or causing deaths) that they foresaw but did not desire as an end, participants are more likely to say the agent acted intentionally than when the side effect is positive (helping the environment or saving lives). This finding is robust and well-replicated: moral badness increases intentionality ascriptions.

  However, the three hypothetical findings complicate the simple view that the word "intentionally" is used solely to express moral blame. Findings (i) and (ii) show that the asymmetry persists in situations where the agent's mental states (in the misinformed case) or the type of action (omission vs. commission) are altered, and (iii) shows that in omissions intentionality ascriptions are tied more to blame than to mental states like foresight or desire. Specifically:

  - (i) In the misinformed cases, the agent does not have the blameworthy mental state (in the bad outcome case, she actually believes she is reducing deaths). Yet participants still attribute intentionality for the bad outcome. This suggests that the attribution is driven by the outcome's badness, not the agent's blameworthy belief.
  - (ii) The effect holds for omissions, which are typically treated differently from actions in moral and legal contexts. This extends the scope of the effect.
  - (iii) The strong correlation between intentionality and blame in omissions, but not with foresight or desire, suggests that the concept of intentionality might be serving a primarily evaluative (blame-related) function in these contexts.

  These findings challenge the idea that "intentionally" is merely a descriptive term capturing the agent's mental states (foresight and desire). Instead, they point toward a role for moral evaluation in the concept itself or in the conditions for applying the word.

  **2. Predictions of the Three Families of Accounts**

  We consider three families of accounts:

  *Norm-violation accounts*: These hold that intentionality ascriptions depend on whether the agent violated a norm. The norm is typically moral: causing harm is a norm violation, so we are more likely to say the agent did it intentionally.

  - (i) Misinformed cases: For the bad outcome (actual harm) even if the agent did not intend harm, the norm is violated. Hence, the account predicts the asymmetry holds: intentionality is ascribed in the bad case but not the good. This matches (i).
  - (ii) Omission: Letting a safety program lapse that causes harm is a norm violation. Hence, the asymmetry should hold. This matches (ii).
  - (iii) In omissions, intentionality ascriptions should correlate with blame because blame is also tied to norm violations. So the correlation with blame is expected. However, the account does not necessarily predict a lack of correlation with foresight/desire because norm-violation accounts often assume that the agent must have acted with awareness. This might be a point of tension.

  *Reasons-based (or explanation-based) accounts*: These hold that we call an action intentional if it was done for a reason that explains the action. In the bad side effect case, the fact that the agent went ahead despite the harm becomes part of the reason (e.g., the agent's indifference to harm explains why they proceeded). In the good case, the benefit is not part of the reason.

  - (i) Misinformed cases: In the bad outcome case, even though the agent believed she was doing good, the actual harm is not part of her reason for acting. Therefore, she did not cause the harm for a reason. The account would predict that participants should *not* say she intentionally caused the harm. This contradicts (i) (which says they do ascribe intentionality). Similarly, in the good outcome case, the agent didn't have the benefit as a reason, so intentionality should not be ascribed (which matches the denial in (i)). But the bad case prediction fails.
  - (ii) Omission: The account might treat omissions similarly: the agent omits the safety program for a reason (cutting costs). The harm (or benefit) is not part of the reason. So the account might predict no asymmetry. This contradicts (ii) (which says the asymmetry holds).
  - (iii) Not directly addressed by this account, but if intentionality is based on reasons, it should correlate with the agent's reasons (which might be captured by foresight and desire) and not necessarily with blame. The observed correlation with blame and not with foresight/desire is not predicted.

  *Conversational/pragmatic accounts*: These hold that the asymmetry arises because in the bad case, by saying the agent acted intentionally, we conversationally implicate that the agent is blameworthy. The word "intentionally" is not semantically different, but we use it to convey blame.

  - (i) Misinformed cases: In the bad outcome case, even though the agent wasn't at fault (she thought she was helping), the outcome is bad and we might still want to blame her (perhaps for negligence). So the implicature might hold. But note: if the agent is not blameworthy (because she had good intentions), the account might predict no intentionality ascription. However, (i) says participants do ascribe intentionality. This is a challenge: if the agent is not blameworthy, why would we use "intentionally" to implicate blame?
  - (ii) Omission: The account can extend to omissions: we use "intentionally" to implicate blame for the harm caused by the omission. So the asymmetry should hold. This matches (ii).
  - (iii) The account predicts that intentionality ascriptions are used to convey blame, so they should correlate with blame. The lack of correlation with foresight/desire is expected because the word is being used pragmatically, not to describe mental states. This matches (iii).

  **3. A Further Experiment**

  After considering (i)-(iii), the norm-violation and conversational-pragmatic accounts both fit the data reasonably well, but the reasons-based account does not (it fails on (i) and (ii)). We are left with norm-violation and conversational-pragmatic accounts.

  To discriminate between them, we can design an experiment that tests whether intentionality ascriptions are sensitive to the agent's mental states even when the outcome is fixed. Specifically:

  *Experiment*: Use the omission case (letting a safety program lapse) with a bad outcome (one extra death). We manipulate two factors:
  - Factor 1: The agent's belief about the outcome. (a) She believes the lapse will cause an extra death. (b) She believes it will cause no change in deaths.
  - Factor 2: The actual outcome. (a) One extra death. (b) No change.

  So we have four conditions:
  1. Belief: harm; Outcome: harm.
  2. Belief: harm; Outcome: no harm.
  3. Belief: no harm; Outcome: harm.
  4. Belief: no harm; Outcome: no harm.

  We measure intentionality ascriptions (did she intentionally cause the deaths?) and blame ascriptions.

  *Predictions*:
  - *Norm-violation account*: Intentionality ascriptions depend on the outcome: if the outcome is harmful (violates a norm), then it is intentional, regardless of belief. So in conditions 1 and 3 (outcome: harm), intentionality is high; in 2 and 4, low.
  - *Conversational-pragmatic account*: Intentionality ascriptions are used to convey blame. Blame depends on both belief and outcome. For example, if the agent believed no harm would occur (conditions 3 and 4) and harm occurs (condition 3), she might be blamed for negligence. But if she believed harm would occur (conditions 1 and 2) and harm does not occur (condition 2), she might be blamed for attempting harm. However, the word "intentionally" typically requires the outcome to occur. So in condition 2 (belief: harm, outcome: no harm), we cannot say she intentionally caused harm because there was no harm. Condition 3 (belief: no harm, outcome: harm) might lead to blame, but not via "intentionally" because the harm was not intended. Thus, the pragmatic account might predict high intentionality only in condition 1 (where blame is clear and the outcome matches). Condition 3 might show some intentionality ascription if participants stretch the term to convey blame, but condition 2 would not.

  Thus, the key difference is condition 3: norm-violation predicts high intentionality (because of the bad outcome) and pragmatic account predicts low intentionality (because the agent didn't intend the harm and we don't normally use "intentionally" for unintended outcomes, even if we blame her for negligence).

  **Marking Scheme (out of 20)**

  1. **Explanation of the original Knobe effect and why (i)-(iii) complicate the simple blame-expressivist view** (5 points)
     - 5: Clearly explains the original effect and how each of (i)-(iii) challenges the view that "intentionally" is used solely to express blame.
     - Typical mistake: Only describing the original effect without addressing the complications, or failing to specify how each finding challenges the view.

  2. **Predictions for (i), (ii), (iii) by the three accounts** (9 points: 3 points per account, 1 for each of (i)-(iii))
     - For each account, 1 point per finding (i, ii, iii) if the prediction is correctly stated and matches or conflicts with the finding as appropriate.
     - Typical mistakes: 
          - Misstating the core claims of the accounts.
          - Failing to make specific predictions for each finding.
          - Not noting conflicts (especially for the reasons-based account on (i) and (ii)).

  3. **Designing a further experiment and stating predictions** (6 points)
     - 3 points for a well-designed experiment that can discriminate between the two remaining accounts (norm-violation and pragmatic).
     - 3 points for clear and correct predictions for each account.
     - Typical mistakes: 
          - Designing an experiment that doesn't test the difference between the two accounts.
          - Not specifying the predictions for each account.
          - Choosing two accounts that are not the ones that survive (i)-(iii) (e.g., including the reasons-based account).

  **Note**: The model answer explicitly marks which claims are well-replicated (the original Knobe effect) and which are hypothetical (findings (i)-(iii)). The interpretations of the accounts are contested and presented as such.
answer: |-
  ### Exam Question  
  **Time Allowed:** 60 minutes  
  **Word Limit:** 800 words  

  #### Background  
  The Knobe effect demonstrates that people are more likely to judge an agent as having acted *intentionally* when a side effect is morally bad (e.g., causing deaths) than when it is good (e.g., saving lives). In a variant case, a transport official adopts a new scheduling system to cut costs, knowing and not caring that it will cause one additional traffic death per year. Participants typically say she *intentionally caused the deaths*. When the side effect is changed to *one fewer death* per year, participants deny she *intentionally saved anyone*.  

  Now suppose three new hypothetical findings:  
  - **(i)** The asymmetry holds identically even when the official is *misinformed*. In the bad outcome case, she believes the change reduces deaths, but it actually increases them by one; participants still say she intentionally caused the deaths. In the good outcome case, she believes it increases deaths, but it actually reduces them by one; participants deny she intentionally saved anyone.  
  - **(ii)** The asymmetry holds when the side effect arises from an *omission*: she lets an existing safety program lapse (to cut costs), causing one extra death per year (judged intentional) or one fewer death (not judged intentional).  
  - **(iii)** In the omission cases, ascriptions of intentionality correlate strongly with ascriptions of *blame*, but weakly with ascriptions of *foresight* or *desire*.  

  #### Your Task  
  1. **Empirical vs. Conceptual Claims (4 points)**  
     Explain what the original Knobe effect (without (i)–(iii)) empirically shows about intentionality ascriptions. Then, argue why findings (i)–(iii) complicate the claim that the word "intentionally" is *merely used to express moral blame*. Distinguish clearly between empirical facts and conceptual claims about what "intentionally" means.  

  2. **Predictions of Explanatory Accounts (9 points)**  
     For each of the three main families of explanation—**norm-violation accounts**, **reasons-based (or explanation-based) accounts**, and **conversational/pragmatic accounts**—state what they predict for findings (i), (ii), and (iii). Justify each prediction based on the core principles of the account.  

  3. **Discriminating Experiment (7 points)**  
     After applying (i)–(iii), only two of the three accounts remain plausible. Identify which two survive and why the third fails. Then, design one further experiment to discriminate between the two surviving accounts. Describe:  
     - The method (including conditions and measures).  
     - What each account predicts for the outcome.  
     - Why this result would support one account over the other.  

  ---  
  ### Model Answer (Approx. 800 words)  

  #### 1. Empirical vs. Conceptual Claims  
  The original Knobe effect is an empirical discovery: moral valence (good/bad outcomes) robustly influences intentionality judgments. When a foreseen side effect is harmful (e.g., causing deaths), people attribute intentionality more readily than when it is beneficial (e.g., saving lives). This asymmetry is well-replicated and uncontested, showing that moral evaluation *empirically correlates* with intentionality ascriptions.  

  However, findings (i)–(iii) complicate the *conceptual claim* that "intentionally" is purely a linguistic tool for expressing blame. First, (i) shows the asymmetry persists even when the agent lacks blameworthy mental states (e.g., she believes she is reducing deaths but accidentally causes harm). If "intentionally" merely expressed blame, participants should withhold the term when the agent is non-culpable—yet they do not. Second, (ii) extends the effect to omissions (e.g., *inaction* causing harm), which are typically less blameworthy than actions. This suggests the asymmetry is not tied to a specific type of agency but to outcome valence itself. Third, (iii) shows that in omissions, intentionality judgments align more with blame than with mental states like foresight or desire. While this might imply that "intentionally" serves a blame-marking function, it simultaneously *decouples* intentionality from the agent’s psychology, raising a conceptual puzzle: if "intentionally" semantically describes a mental state (e.g., intention), why is it more tied to blame than to foresight? Together, (i)–(iii) challenge reductionist views that reduce "intentionally" to a blame-expressing device, forcing us to ask whether moral factors *constitutively* shape the concept of intentional action or merely bias its application.  

  #### 2. Predictions of Explanatory Accounts  
  - **Norm-violation accounts**: These hold that intentionality ascriptions respond to norm breaches (e.g., causing harm violates moral norms).  
    - (i) Predicts the asymmetry holds: Harmful outcomes violate norms regardless of the agent’s beliefs, so intentionality is ascribed in the bad case.  
    - (ii) Predicts the asymmetry holds: Omissions causing harm violate norms identically to actions.  
    - (iii) Predicts strong blame-intentionality correlation: Norm-violations inherently license blame, so the two should align. Weak correlation with foresight/desire is expected since norms focus on outcomes, not psychology.  
  - **Reasons-based accounts**: These hold that intentionality requires the outcome to be part of the agent’s reasons for acting (e.g., indifference to harm explains action in the harm case).  
    - (i) Predicts the asymmetry *fails*: In the bad case, the agent lacks reasons for causing harm (she believes she’s helping), so intentionality should *not* be ascribed—contradicting (i).  
    - (ii) Predicts the asymmetry *fails*: Omissions lack an active “reason for causing harm”; the agent merely has reasons for inaction.  
    - (iii) Predicts weak blame-intentionality correlation: Intentionality hinges on reasons, not blame. Foresight/desire should correlate more strongly, as they inform reasons.  
  - **Conversational-pragmatic accounts**: These hold that "intentionally" pragmatically implicates blame in certain contexts (e.g., to condemn negligent agents).  
    - (i) Predicts the asymmetry holds: In the bad case, the harmful outcome triggers blame-implicature (even if unintentional), so "intentionally" is used.  
    - (ii) Predicts the asymmetry holds: Omissions causing harm similarly license blame-implicature.  
    - (iii) Predicts strong blame-intentionality correlation: The term is used precisely to convey blame. Weak foresight/desire correlation is expected, as pragmatic use overrides semantic content.  

  #### 3. Discriminating Experiment  
  After (i)–(iii), **norm-violation** and **conversational-pragmatic** accounts survive: both correctly predict the persistence of asymmetry in (i) and (ii) and the blame-intentionality link in (iii). **Reasons-based accounts** fail because they wrongly predict no asymmetry in (i) and (ii).  

  To discriminate between the two surviving accounts, conduct an experiment manipulating **outcome valence** (harm/benefit) and **blame mitigation** (presence/absence of an excuse). Use the omission case: the official lapses a safety program to cut costs, causing either one death (harm) or saving one life (benefit). Add a blame-mitigation condition: external coercion (e.g., she was threatened with job loss if costs weren’t cut).  
  - **Conditions**:  
    - Harm/no mitigation: Causes death, no excuse.  
    - Harm/mitigation: Causes death, with excuse.  
    - Benefit/no mitigation: Saves a life, no excuse.  
    - Benefit/mitigation: Saves a life, with excuse.  
  - **Measures**: Rate agreement with: "She intentionally caused/saved the death/life" (1–7 scale) and "She is to blame" (1–7 scale).  

  **Predictions**:  
  - **Norm-violation account**: Outcome valence dominates. Intentionality ascriptions will be high in *both harm conditions* (harm violates a norm regardless of excuses) and low in benefit conditions. Blame mitigation reduces blame ratings but not intentionality.  
  - **Conversational-pragmatic account**: Blame drives intentionality ascriptions. In harm cases, blame mitigation will *reduce* intentionality judgments (since "intentionally" loses pragmatic utility when blame is excused). Benefit cases will show low intentionality throughout.  

  **Discrimination**: If intentionality remains high in the harm/mitigation condition, norm-violation is supported (norms trump excuses). If intentionality drops in harm/mitigation, pragmatic accounts win (blame reduction weakens implicature).  

  ---  
  ### Marking Scheme (20 points)  
  1. **Empirical vs. Conceptual Distinction (4 points)**  
     - 4: Clear separation; original effect as empirical fact; (i)–(iii) as challenging blame-expressivism by decoupling intentionality from mental states/blame.  
     - *Typical mistake:* Conflates empirical patterns with semantic claims; fails to explain how (i)–(iii) disrupt blame-focused views.  

  2. **Account Predictions for (i)–(iii) (9 points)**  
     - 3 per account (1 for each finding). Full credit for accurate, justified predictions.  
     - *Norm-violation:* Matches all. *Reasons-based:* Fails (i) and (ii). *Pragmatic:* Matches all.  
     - *Typical mistake:* Misattributes predictions (e.g., claiming reasons-based accounts can explain (i)); omits justifications.  

  3. **Discriminating Experiment (7 points)**  
     - **Selection of surviving accounts (2 points)**: Correctly identifies norm-violation and pragmatic; rejects reasons-based due to (i)/(ii) failures.  
     - **Experiment design (3 points)**: Method cleanly pits outcome valence against blame; valid measures.  
     - **Predictions and discrimination (2 points)**: Clear divergent predictions; explains why result favors one account.  
     - *Typical mistakes:* Fails to reject reasons-based; designs experiment irrelevant to the two accounts; predictions not tied to core principles.  

  ---  
  **Note for Students**: The original Knobe effect is empirically settled. Findings (i)–(iii) are hypothetical and contestable—they represent possible evidence, not consensus. Explanatory accounts are theoretical and debated; no interpretation here is presented as definitive. Focus on argumentative rigor, not citations.
