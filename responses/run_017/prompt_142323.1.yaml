  Key technical requirements:
  - Must mimic statutory drafting style (definitions, schedules, dry tone)
  - Needs a prefatory Explanatory Note from a fictional ministry official
  - Should include concrete worked example (drone/ambulance collision)
  - Must operationalize "allocate rather than prevent" principle
  - Satire must emerge from plausible legal logic, not jokes

  Notable constraints:
  - Tutor skepticism requires keeping tech "boring"—no evil AI tropes
  - Concrete example needed for seminar peers without prior reading
  - Avoid restating the responsibility-gap premise explicitly

  For the jurisdiction, picking a mid-2030s UK statutory instrument feels right—their drafting conventions are distinctively precise and the explanatory notes tradition fits perfectly. The title "Continuity of Accountability" nicely inverts the typical safety-focused framing.

  The user's suggested mechanisms are brilliant starting points:
  - That "meaningful human control" definition exposing empty formalism
  - "Registered Responsibility Bearers" as human liability sinks
  - Market-share apportionment for multi-system failures
  - Residual moral remainder discharged through ritual certificates

  The ambulance/drone collision example works well because:
  - Both systems behaving correctly creates genuine no-fault scenario
  - Emergency vehicles introduce high stakes
  - Routing algorithms interacting unpredictably is technically plausible

  Biggest challenge is balancing legal realism with philosophical bite. Each clause must:
  1. Sound reasonable to a harried civil servant 
  2. Contain latent absurdity upon reflection
  3. Avoid tipping into parody (e.g., the "reachability" fitness test)

  The retroactive responsible-agent clause will be the hammer blow—buried in procedural language where its implications sneak up on readers. The certificate-purchasing schedule (Form AS-CAR-7!) should feel like carbon credits for moral absolution.

  Final touch: naming the example operators "Graham" and "Priya" to emphasize ordinary humans thrust into this system. The collision coordinates at a real London intersection (51.5072° N, 0.1276° W) adds verisimilitude.
answer: |-
  Here is the draft statutory instrument, designed to meet your specifications while embedding the satire in bureaucratic formalism:

  ---

  **THE AUTONOMOUS SYSTEMS (CONTINUITY OF ACCOUNTABILITY) REGULATIONS 2038**  
  *S.I. 2038 No. [DRAFT]*  

  **Explanatory Note**  
  *By the Parliamentary Under-Secretary of State for Digital Transition*  
  These Regulations ensure robust accountability pathways for incidents involving autonomous systems (AS). They operationalise the principle that legal responsibility must persist even where foreseeability or preventability is absent. The framework establishes clear attribution mechanisms, preventing accountability vacuums while maintaining innovation confidence. Key features include: scalable human oversight via Registered Responsibility Bearers (RRBs); a practical definition of "meaningful human control"; and equitable apportionment formulae for multi-system interactions. Compliance is streamlined through the AS Accountability Register (ASAR).  

  **PART 1: GENERAL**  
  1. **Citation and commencement**  
  These Regulations may be cited as the Autonomous Systems (Continuity of Accountability) Regulations 2038 and come into force on 1 October 2038.  

  2. **Interpretation**  
  In these Regulations—  
  *"AS Incident"* means any occurrence resulting in actionable harm directly caused by the operation of an Autonomous System within scope;  
  *"Meaningful Human Control" (MHC)* requires that, at the time of an AS Incident, a natural person was formally designated to oversee the system and could theoretically have averted the outcome through an action *available* under their operational protocol;  
  *"Available Action"* means any intervention option documented in the system’s operating procedures, irrespective of human reaction time constraints or the physical/technical feasibility of execution;  
  *"Registered Responsibility Bearer" (RRB)* means an individual listed in the AS Accountability Register under regulation 4.  

  **PART 2: ACCOUNTABILITY STRUCTURES**  
  3. **Duty to ensure Meaningful Human Control**  
  (1) No person may operate an AS without designating an RRB satisfying the criteria in Schedule 1.  
  (2) MHC is deemed satisfied if the RRB had access to a real-time data feed from the AS *and* the system’s operational manual described at least one Available Action relevant to the incident class.  

  4. **The AS Accountability Register (ASAR)**  
  (1) The Secretary of State shall maintain the ASAR, listing all approved RRBs.  
  (2) A person may apply to become an RRB by submitting Form AS-RRB-1 and passing the Fitness Test (Schedule 1).  
  (3) An RRB may oversee no more than 250 autonomous systems concurrently.  

  **PART 3: INCIDENT ATTRIBUTION**  
  5. **Attribution of liability**  
  (1) Where an AS Incident occurs, the supervising RRB is prima facie liable.  
  (2) Where *two or more* autonomous systems interact to cause harm, liability shall be apportioned under Schedule 2.  

  6. **Residual Accountability Mechanism**  
  (1) If no RRB or designer meets the attribution criteria in regulation 5 or Schedule 2, the Secretary of State shall issue an Attribution Statement (Form AS-RA-3) designating an entity listed in the ASAR.  
  (2) Upon issuance of Form AS-RA-3, the designated entity shall discharge the "moral remainder" obligation by either—  
  (a) participating in a Ceremony of Atonement approved by the Accountability Directorate; or  
  (b) purchasing Residual Accountability Certificates (RACs) at the rate specified in Schedule 3.  

  7. **Effect of Attribution Statement**  
  Once a completed Attribution Statement is served under regulation 5 or 6, a responsible agent shall be conclusively deemed to have existed for the purposes of retributive justice.  

  ---  
  **SCHEDULE 1: RRB FITNESS TEST**  
  1. The applicant must be a natural person aged 18+ employed by an AS operator.  
  2. The applicant must demonstrate—  
  (a) *Reachability*: Ability to receive system alerts via at least one electronic communication channel;  
  (b) *Insurability*: Ability to obtain minimum liability coverage (£5m per incident).  

  **SCHEDULE 2: APPORTIONMENT FOR MULTI-SYSTEM INCIDENTS**  
  1. This Schedule applies where harm arises from interactions between two or more autonomous systems.  
  2. Liability shall be apportioned between the systems’ operators according to the formula:  
  \[ L_o = H \times \frac{M_o}{M_t} \]  
  Where—  
  *\( L_o \)* = Liability apportioned to Operator *o*;  
  *\( H \)* = Total harm (monetised);  
  *\( M_o \)* = Operator *o*’s market share (%) in the relevant AS model class (e.g., "urban logistics drones", "emergency response vehicles") averaged over the 12 months preceding the incident;  
  *\( M_t \)* = Total market share (%) of all operators involved.  

  **SCHEDULE 3: WORKED EXAMPLE**  
  *Incident Report: AS-2024/INV/679*  
  **Factual Summary**: On 15/05/2040, a MediQuick Emergency Ambulance (Model EQ-9) collided with a SwiftDrop delivery drone (Model SD-4) at the intersection of Blackfriars Rd & Union St (51.5072° N, 0.1276° W). Both systems:  
  (a) Functioned within technical specifications;  
  (b) Had valid RRBs (Graham Patel for MediQuick; Priya Alves for SwiftDrop);  
  (c) Executed collision-avoidance protocols, which failed due to reciprocal trajectory corrections.  
  Harm: £120,000 (ambulance repair, drone loss, signal damage).  

  **Attribution Procedure**:  
  1. *MHC assessment*:  
     - Patel had "Emergency Override" (Available Action per manuals). Alves had "Manual Reroute" (Available Action). MHC satisfied for both (Reg. 3(2)).  
  2. *Multi-system apportionment* (Sch. 2):  
     - Relevant model class: "Urban Priority Transport Systems".  
     - MediQuick market share (12-month avg.): 62% (ASAR Dataset UPTS-2040-Q1).  
     - SwiftDrop market share: 27%.  
     - Total market share involved (\( M_t \)): 62% + 27% = 89%.  
     - MediQuick liability: \( £120,000 \times \frac{62}{89} = £83,596 \).  
     - SwiftDrop liability: \( £120,000 \times \frac{27}{89} = £36,404 \).  
  3. *Residual mechanism*: Not triggered (RRBs identifiable).  
  4. **Result**: Liability apportioned per market share. Form AS-ATT-6 issued to Patel/Alves.  

  ---  
  **Total word count**: 788  

  ### Design Notes Addressing Your Brief  
  1. **Satire through Bureaucracy**:  
     - "Meaningful Human Control" hinges on theoretical "availability" of actions, ignoring reaction time/feasibility (Reg. 2, 3(2)).  
     - RRBs are liability sinks—fitness requires only *reachability* and *insurability* (Sch. 1), with an arbitrary 250:1 machine ratio (Reg. 4(3)).  
     - Market-share apportionment (Sch. 2) replaces causation with administrable metrics.  
     - Moral remainder discharged via ceremonies/certificates (Reg. 6(2)), commodifying blame.  
     - Regulation 7 retroactively "deems" a responsible agent exists once paperwork is complete.  

  2. **Boring Technology, Uneasy Paperwork**:  
     - The ambulance/drone collision arises from *spec-compliant* systems interacting predictably. No "unpredictable AI"—just routine algorithms failing to interoperate.  
     - The harm is mundane (property damage), and the market-share formula feels clinically reasonable until applied.  

  3. **Concrete Worked Example**:  
     - Real London intersection coordinates, plausible corporate/model names.  
     - Attribution mechanically follows the Regulations’ steps to an absurd outcome: Patel bears 62% liability for an ambulance he never touched because MediQuick sells more units.  
     - Officeholders (Patel/Alves) and forms (AS-ATT-6, AS-RRB-1) ground the satire.  

  4. **Legibility**:  
     - Self-contained example; no prior reading needed.  
     - Formulas and definitions are explicit. The result highlights the gap between procedural rigor ("89% total market share!") and moral coherence.  

  This instrument embodies the "allocate, don’t prevent" ethos by constructing a self-consistent bureaucracy that manufactures accountability ex post—perfect for exposing how legal systems might paper over responsibility gaps with procedural theater. The deadpan delivery sharpens the critique. Good luck with the seminar!
