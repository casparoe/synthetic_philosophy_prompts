  Hmm, first I need to understand their positions. Dev sees causation as contrastive and interest-relative, so mental properties like Mira's desire (M) are genuine causes because they satisfy counterfactual dependencies. Nina thinks only the physical realizer (P) does the causal work, while M provides explanatory significance. 

  The key is to find common ground without papering over real differences. Both agree on causal closure of physics and reject silly epiphenomenalism - that's a start. They also both dismiss simple overdetermination as the wrong model. 

  For the joint statement, I'll focus on neutral phrasing: 
  - Causal closure as non-competition (Nina's win) but not causal monopoly (Dev's win) 
