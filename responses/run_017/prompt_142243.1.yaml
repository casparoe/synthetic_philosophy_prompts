  Must avoid adjudicating! Just lay out their predicted answers. The verbal dispute flag: "cause" and "distinct" are the big ones. Once clarified, they're really arguing whether causation requires physical implementation. 

  This document might finally get them unstuck. The duplicate case especially could break the deadlock - if Dev admits molecule-Mira behaves identically, his counterfactual story weakens. But that's for them to discover...
answer: |-
  ## Joint Statement on Causal Exclusion: Points of Agreement (Signed by Dev & Nina)

  1.  **Causal Closure of the Physical:** The physical domain is causally closed. For any physical effect (like Mira's hand movement), there is a sufficient physical cause (P) within that domain, and no "extra" physical force is needed. This does *not* entail that physical causes are the *only* legitimate causes, nor does it dictate the nature or level of description at which causation must be understood.
  2.  **Overdetermination is Not the Model:** The threat of systematic overdetermination posed by the exclusion argument is misplaced. Mental causation (if it exists) and physical causation are not parallel, independent forces competing to cause the *same* effect in the same way that two bullets might. The relationship between M and P is intimate (realization/supervenience), ruling out this simple model of overdetermination.
  3.  **Distinctness of Properties:** The mental property M (Mira's desire) and the physical property P (the specific neural state) are distinct properties *even though* they are instantiated by the same event/state token on this occasion. M cannot be reduced to P in the sense that M has different modal profiles, explanatory targets, and is multiply realizable.
  4.  **Causation is Contrastive/Explanation-Relative:** Causal claims inherently involve contrasts (e.g., signing *rather than not signing*) and are sensitive to the explanatory context and the grain of description. Asking "Did M cause the signing?" requires specifying the alternatives and the level of description relevant to the inquiry.
  5.  **What is at Stake:** The core stakes involve the **intelligibility of action explanations** ("She signed *because* she wanted to") and the grounding of **agency**, **moral responsibility**, and the **causal relevance of higher-level patterns** in the special sciences (psychology, economics, etc.). Both agree that these are valuable and must be accounted for; they disagree on whether this requires M to be a *metaphysically independent cause*.
  6.  **Rejection of "Silly" Epiphenomenalism:** Mental properties are real, irreducible, and play an indispensable role in explaining behavior. They are not mere inert byproducts. Any account that rendered them utterly causally inert in *every* sense would be unacceptable. The dispute is about the *metaphysical nature* of their causal contribution.

  ## Table of Residual Disagreements

  | Nina's Statement                                                                                               | Dev's Restatement                                                                                               | Dev's Statement                                                                                                                   | Nina's Restatement                                                                                                                |
  | :------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------- |
  | **1. On the Causal Work:** "On this occasion, *only* the physical realizer property P caused the hand movement; M did *not* cause it." | "On this occasion, the causal work *at the fundamental physical level* was performed by P."                     | **1. On the Causal Work:** "On this occasion, *both* the mental property M and the physical property P caused the hand movement." | "On this occasion, M provides the *explanatory context* for P's causation, but P alone did the *metaphysical causing*."         |
  | **2. On Causal Status:** "M's causal relevance is *inherited* from P; it is not an independent causal contribution." | "M's causal relevance *supervenes* on P's causal powers and cannot vary independently of them."                 | **2. On Causal Status:** "M has *direct* causal relevance in its own right, grounded in difference-making patterns at its own level." | "M's causal relevance is *explanatory* and *pattern-based*, not a fundamental addition to P's *metaphysical* causal power."     |
  | **3. On Cause vs. Explanation:** "While 'M caused the signing' is *explanatorily* true, it is *metaphysically* incomplete; the *complete* cause is P." | "While P provides the physical *implementation*, 'M caused the signing' captures the *causal-explanatory* truth." | **3. On Cause vs. Explanation:** "'M caused the signing' is a *full-fledged causal truth*, not merely an explanatory shorthand; causation *is* contrastive and level-relative." | "Calling M a 'cause' conflates robust metaphysical causation (P) with explanatory or pragmatic salience (M)."                   |

  ## Cruxes: Tests and Predictions

  1.  **The Interventionist Test (Crux a):**
      *   **Test:** Consider an idealized intervention that changes Mira's mental state from M (desire to sign) to M' (no desire to sign), *while holding fixed the physical realizer P*. Is this intervention coherent? What would be the effect on the signing?
      *   **Nina's Prediction:** The intervention is *incoherent*. Holding P fixed *necessitates* M, given the realization relation. You cannot change M without changing P. Therefore, the test fails to show M has independent causal power. *Result supports Nina.*
      *   **Dev's Prediction:** The intervention is *incoherent*, but this demonstrates a flaw in interventionism as a *metaphysical* theory of causation. It wrongly privileges physical interventions. Causation is about difference-making patterns, and M makes the relevant difference in the actual pattern. *Result supports Dev (by discrediting the test's relevance).*

  2.  **The Generality Problem & Special Sciences (Crux b):**
      *   **Test:** Apply the exclusion argument rigorously to a clear special science case: Did the drought (D) cause the crop failure (C), given that the complete microphysical state (P) of the region during the relevant period is causally sufficient for C?
      *   **Nina's Prediction:** The argument applies equally. The *complete* causal work is done by P. D is real and explanatorily crucial, but its causal status is inherited from the realizing microphysical properties. She *must* accept this consequence consistently or find a principled distinction (e.g., involving functional/causal roles) between mental and other special science properties. *Result: Nina accepts causal inheritance for special sciences OR finds a principled distinction.*
      *   **Dev's Prediction:** The argument is equally flawed here. D *did* cause C. The counterfactual dependence and explanatory role of D are sufficient for causal status. Demanding D to add "extra oomph" beyond the pattern instantiated by P misunderstands causation. *Result: Dev affirms causation for D, rejecting the exclusion threat.*

  3.  **Proportionality & Grain (Crux c):**
      *   **Test:** Consider two effects: (1) *The precise neural activation pattern* in Mira's motor cortex. (2) *The signing of the petition*. For each effect, which cause is more proportional: P (the specific neural state realizing M) or M (the desire to sign)?
      *   **Nina's Prediction:** For effect (1), P is clearly more proportional (same grain). For effect (2), while M seems proportional, *causally*, P is still the producer. Proportionality is an explanatory/epistemic virtue, not a metaphysical constraint on causation itself. The *actual cause* is P, which is sufficient but perhaps overly specific for explaining (2). *Result: Proportionality is explanatory, not causal.*
      *   **Dev's Prediction:** For effect (1), P is more proportional. For effect (2), M is more proportional. P is causally relevant, but its overly specific details are irrelevant to bringing about the signing *as such*; M captures just the relevant difference-maker for that effect. Proportionality *is* a constraint on genuine causation. *Result: Proportionality supports M's causal status for action effects.*

  4.  **The Molecule-for-Molecule Duplicate (Crux e - Postdoc's Case):**
      *   **Test:** Consider Duplicate Mira. She is molecule-for-molecule identical to Mira at T1, instantiating P*. P* causes an identical hand movement (signing) via an identical physical route. However, in Duplicate Mira, P* has *no mental content* (or different, non-signing-relevant content) due to differences in external history or laws. Did M (or its absence/mismatch) cause anything different in Duplicate Mira's signing?
      *   **Nina's Prediction:** The causal process leading to the signing is *identical* in both cases. The content of M (or its absence) makes *no difference* to the physical causation of the signing movement. This shows the causal work is done by the physical *vehicle* (P/P*), not the mental *content* (M). *Result: Causal work tracks vehicle, not content.*
      *   **Dev's Prediction:** While the *movement* is identical, the *action* (signing the petition) differs. In Mira, the movement *is* an intentional signing *because* it was caused by M. In Duplicate Mira, the identical movement is *not* an intentional signing; it's a mere physical event or a different action (e.g., a reflex, a random twitch, signing under a different description). Therefore, M *did* cause the action (the signing *as an intentional act*) in Mira, but not in the duplicate. The content *is* causally relevant to the *kind* of effect (intentional action). *Result: Causal work (for the action description) requires the content.*

  ## Verbal Disputes & What Remains

  1.  **"Cause":** This is the core verbal dispute. Nina uses "cause" narrowly to mean *metaphysical production* or *efficient causation* (exclusively tied to fundamental physical properties). Dev uses "cause" broadly to mean *difference-maker* or *explanatorily relevant factor* within a contrastive and level-relative framework. **What remains:** The substantive question: Does M play a role in *bringing about* the effect that is *metaphysically robust* beyond explanation and patterns supervening on P?
  2.  **"Distinct":** Both agree M and P are distinct properties. The potential verbal dispute is over what this distinctness entails for causation. Nina sees distinctness as *requiring* independent causal efficacy for M to be a cause. Dev sees distinctness as *compatible* with M being a cause via realization/supervenience. **What remains:** Can distinct higher-level properties be difference-making causes *in their own right* without adding fundamental force?
  3.  **"Sufficient":** Both agree P is causally sufficient for the physical effect in the circumstances. The potential dispute is over whether this "causal sufficiency" implies "causal exclusivity". Nina infers exclusivity. Dev does not. **What remains:** Does causal closure + distinctness imply that only P can be the cause?

  **The Core Substantive Disagreement:** Once verbal differences are minimized, the core disagreement is **whether causation itself is fundamentally a physical-level phenomenon (Nina) or whether it is a level-relative, pattern-based phenomenon (Dev).** This disagreement maps onto the question: **Does the indispensability of M for explanation, agency, and responsibility require M to be a *metaphysical cause* in the same sense as P (Dev), or can it be fully accounted for by M's role in structuring, explaining, and inheriting from P's causation (Nina)?** The cruxes above are designed to probe this fundamental divide.
