prompt: |-
  Our reading group (me, two philosophy grad students, and one computer science postdoc who refuses to be called a philosopher) has spent basically a whole semester stuck on the causal exclusion argument, and Im the one who has to write up where we got to. Two of us have calcified into positions. Dev thinks mental properties are perfectly ordinary causes and that the exclusion argument only looks forceful because it quietly assumes causation is a single, one-relation, all-or-nothing affair: hes happy with a difference-making, contrastive, interest-relative picture and says the argument slides between a cause being sufficient for its effect in the circumstances and its being the only thing that mattered. Nina thinks the argument is basically sound: she agrees mental properties are real, irreducible, and not epiphenomenal in the silly sense, but she holds that the causal work on any occasion is done by whatever physical property realizes the mental one, and that any claim the mental has to being a cause is inherited from that rather than being an independent contribution. They have been talking past each other for months and I want a document both of them could actually sign.

  Here is the case we keep coming back to, so please use it too (and do say where its underspecified). Mira is deciding whether to sign a petition. She has an occurrent desire to sign, call it M, which on this occasion is realized by neural state P. P is causally sufficient, in the circumstances, for her hand moving in the signing way; it produces that effect through a route that involves no further mental state; and there is no separate, independent cause of the signing hanging around waiting to be an overdeterminer. Nina says: P caused the signing, M did not cause it, though M is what makes the cause the kind of cause it is and what makes the story about the signing intelligible. Dev says: both M and P caused it, because Mira signed because she wanted to is true, the counterfactuals about her wanting to sign line up exactly with the counterfactuals about P, and demanding an extra bit of independent causal oomph over and above the counterfactual and pattern structure is a picture rather than an argument.

  What I want from you is their joint statement. First, a numbered section of claims both of them can sign without wincing: about causal closure; about whether overdetermination is even the right model of what the mental cause would have to be; about whether the mental property and the physical property are distinct properties even when the event is the same; about whether causation is contrastive or explanation-relative or level-relative; and about what is actually at stake here (agency, causal explanation, moral responsibility, the intelligibility of action explanations). Second, a table of the residual disagreements, one row each, where every claim is phrased the way the side that holds it would phrase it for itself, with the other sides restatement of the same row next to it so I can see whether they are disagreeing or just describing the same thing differently. Third, the cruxes: the sub-questions such that settling one would move at least one of them. For each crux, give a case, test, or argument both would accept as genuinely bearing on it, and write down in advance what Dev predicts and what Nina predicts about how it comes out, so they cant quietly reinterpret the result later.

  Some cruxes I suspect are load-bearing, but use the better ones if you see them: (a) whether a cause has to be something you could in principle intervene on independently of its realizer, where Nina thinks no intervention on M that leaves P fixed is even coherent and Dev thinks that just shows interventionism was the wrong theory of causation; (b) the generality problem, since the same style of argument seems to threaten droughts, recessions, the structural flaw in a bridge and the fragility of a wine glass, so Nina owes us either an eliminativism about all special-science causation or a principled place to stop; (c) proportionality, where if causes must be proportional to their effects then the threat to M sometimes comes from below, because P is more fine-grained, and sometimes from above, because the mental description is the one at which the pattern is stable across Miras possible neural variation, and I want to know whether both sides accept proportionality as a constraint at all and which way it cuts; (d) whether causal relevance can come in degrees, or be a kind of bookkeeping, so that Ms causal status is vindicated by the fact that we can only predict, plan and act under mental descriptions, or whether that is a pragmatic and explanatory vindication that leaves the metaphysical question exactly where it was; (e) the CS postdocs intervention, which both of them hated: consider a molecule-for-molecule duplicate of Mira whose P-type state plays exactly the same causal role in producing the signing but whose state has no content at all, or has different content, and ask whether the causal work tracked the content or the vehicle. Work that case in if it is worth anything and tell me what each side should predict about it. Finally, flag any part of their dispute you think is merely verbal, whether about cause or distinct or sufficient, and say what is left once that is cleared away. Please dont adjudicate or tell me who is right, and skip anything like citations or further reading: we have read the literature to death and I need something I can hand to both of them at the start of next term.
