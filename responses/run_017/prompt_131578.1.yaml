answer: |-
  Below is a complete, structured activity designed to make students viscerally experience Hofstadter's distributive view of the self and its costs, followed by a debrief guide. The activity avoids explicit theory until the end and uses real, mildly exposing personal fragments to create stakes. Rules, roles, materials, timeline, prompts, and problem-handling are detailed.

  ---

  ### **Rules, Roles, and Materials**
  **Roles**:  
  - **Subject**: 1 volunteer. Provides personal fragments, then becomes silent.  
  - **Inheritors**: 3 students. Each receives one fragment type. Must "be" the subject.  
  - **Judges**: Remaining 10 students. Rate performances and set weights.  
  - **Chain Participants**: 3–4 students (rotated from judges) for the chain round.  

  **Materials**:  
  - Index cards (5 per student).  
  - Pens, whiteboard, timer.  
  - A "voice token" (e.g., a physical object like a mic or token).  

  **Key Rules**:  
  - **Silence rule**: Subject cannot speak after fragments are split (sit apart or wear a "silence" sign).  
  - **Blind judging**: Judges rate anonymously on slips.  
  - **Ledger of Inheritance**: Fixed weights for fragments (set by judges), no sum constraint. Scores = weight × rating (0–10).  
  - **Forced choices**: Indivisible decisions (voice token, project outcome).  

  ---

  ### **Timeline (90 Minutes Total)**
  **0:00–0:15: Fragment Creation**  
  - **Prompt (handout)**:  
    > "Write on separate cards:  
    > 1. **Memory**: A specific, meaningful personal event (e.g., ‘my first solo trip’).  
    > 2. **Style**: A verbal mannerism or argument style (e.g., ‘I always say, “Fair enough!”’).  
    > 3. **Value**: A core belief (e.g., ‘Never leave a job half-done’).  
    > 4. **Project**: An unfinished personal project (e.g., ‘a screenplay about loss’).  
    > 5. **Opinion**: An uncommon opinion (e.g., ‘pineapple belongs on pizza’).  
    > **Note**: Be genuine but redact if uncomfortable. Fragments should be shareable."  

  **0:15–0:20: Assign Roles & Split Fragments**  
  - Choose subject. Split their kit unevenly:  
    - Inheritor 1: Memory + Opinion.  
    - Inheritor 2: Style.  
    - Inheritor 3: Value + Project.  
  - Subject moves to silent zone. Inheritors review fragments.  

  **0:20–0:25: Set Ledger Weights**  
  - **Prompt**: "As judges, assign weights (any positive numbers) to:  
    - **Memory/Opinion** (e.g., 40)  
    - **Style** (e.g., 20)  
    - **Value/Project** (e.g., 60).  
    Weights reflect importance to identity. No right/wrong—go with intuition."  
  - Record weights on board.  

  **0:25–0:40: Round 1 (Novel Situation)**  
  - **Prompt for Inheritors**:  
    > "A stranger says: ‘I heard you’re obsessed with \[topic from subject’s opinion\]. Explain why it matters.’ Respond as the subject using ONLY your fragment. You have 2 minutes to prepare; 1 minute to speak."  
  - Judges rate each inheritor (0–10) for "how much of the subject is present" on slips.  
  - **Scoring**: Average ratings × weight per inheritor. Post scores (e.g., Style Inheritor: 20 × 7 = 140).  

  **0:40–0:55: Degradation Round**  
  - Degrade subject: Shred 1/2 their memory card; require clichés (e.g., "it was a rollercoaster").  
  - **Prompt for Subject & Inheritors**:  
    > "The stranger challenges your core value: ‘\[Subject’s value\] is childish. Defend it.’"  
    - Subject speaks first (degraded), then inheritors (intact).  
  - Judges rate **subject** (on 0–10 per fragment) and **inheritors** (on their fragment only).  
  - **Scoring**: Subject’s score = Σ(weight × fragment rating). Inheritors = weight × rating.  
  - **Forced Choice**: "Who gets the voice token to speak for the subject? Choose ONE: subject or an inheritor." Group vote.  

  **0:55–1:05: Chain Round**  
  - Pass subject’s **style** fragment: Student A (original inheritor) → B → C → D (new students).  
    - A whispers style to B; B to C; C to D (no notes).  
  - **Prompt for D**:  
    > "The stranger asks: ‘What’s your go-to phrase in an argument?’ Respond as the subject."  
  - Judges rate D (0–10) for style fragment. Compute score (weight × rating).  

  **1:05–1:15: Final Decision**  
  - **Prompt**: "As a group, decide the subject’s unfinished project:  
    > A. Complete it in the subject’s style.  
    > B. Adapt it to our style.  
    > C. Abandon it.  
    > **You must agree on one and give a reason.** Subject rejoins and votes but does not lead."  

  **1:15–1:30: Debrief** (Guided below)  

  ---

  ### **Debrief: Mapping Activity to Theory**  
  **Guide questions → Concepts (Hofstadter/Parfit)**:  
  1. **"What happened in Round 1? Did scores surprise you?"**  
     → *Graded existence*: Subject was partially present in inheritors. Hofstadter’s "self as fragments" (Ch. 26).  

  2. **"In degradation, why might an inheritor ‘win’ the voice token? What’s uncomfortable?"**  
     → *Loss of all-or-nothing identity*: Subject is "more present" externally. Cost of distribution—authenticity vs. persistence. Parfit’s fission (Reasons and Persons, Sec. 90).  

  3. **"In the chain, did the style fragment still ‘carry’ the subject? Why did scores feel absurd?"**  
     → *Over-generation*: Ledger conflates pattern survival with identity. Hofstadter’s "dilution" (Ch. 23) vs. reality: representation ≠ subjective experience.  

  4. **"Project decision: Were you discovering or deciding survival?"**  
     → *Decision vs. discovery*: We *choose* when a pattern counts as survival (e.g., adapting projects). Parfit’s "what matters" (Sec. 99).  

  **Bridge to readings**:  
  - Use **Hofstadter (Ch. 23, 26)** for distributed selves and dilution.  
  - Use **Parfit (fission cases)** for cost of losing all-or-nothing identity.  
  - **Stress the gap**: No activity can replicate *what it’s like* to be distributed. Hofstadter’s pattern (e.g., Brahms in the brain) is *represented*, not *lived*.  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Raw material (bereavement)**:  
     - **Prevention**: Start with: "Redact any fragment if needed; your well-being comes first."  
     - **Response**: If a student reacts, quietly offer: "You can sit out or submit a generic fragment (e.g., ‘favorite book’)."  

  2. **Subject breaks frame (treats as joke)**:  
     - **Prevention**: Pre-brief subject: "Your silence sells the stakes—help peers engage."  
     - **Response**: Gently remind: "Your role is to observe—imagine you’ve ‘passed on’ fragments."  

  3. **Room drifts to platitudes ("memories live on")**:  
     - **Prevention**: In debrief, ask: "Was this *commemoration* or literal survival? Did scores feel like presence?"  
     - **Response**: Push: "If the ledger says the subject is ‘more present’ in an inheritor, is that comforting? Why/why not?"  

  4. **Refusal to quantify**:  
     - **Prevention**: Frame weights as "intuition pumps," not math: "Scores are just a tool—go with your gut."  
     - **Response**: Allow qualitative ratings (low/med/high → 3/6/9) or let judges skip numbers and discuss trends.  

  ---

  ### **What the Activity Cannot Capture**  
  - **The first-personal gap**: Students experience *representing* a self, not *being* one.  
    - **Why irreproducible**: No role lets anyone *feel* distributed (e.g., inheritors know they’re acting; chain participants feel like themselves).  
  - **Structural limitation**: Hofstadter’s self is *dynamic* (fragments interact in feedback loops); the activity treats fragments as static.  
  - **Cover in debrief**:  
    - Use **Nagel ("What Is It Like to Be a Bat?")** for the hard problem of subjective experience.  
    - Use **Hofstadter (Ch. 20)** for dynamic selfhood: "A self is not a snapshot but a *pattern in time*."  
    - Say plainly: "The game shows *that* we distribute selves, but not *how it feels*. That’s why Hofstadter’s view is explanatory but existentially costly."  

  ---

  This design balances experiential learning with tight timing. It makes the distributive view emerge from actions, not lectures, while forcing confrontations with its costs. Run it as written, and debrief gaps with Nagel/Hofstadter.
