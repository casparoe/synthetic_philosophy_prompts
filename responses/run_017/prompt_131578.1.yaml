            - Chain round: The same ledger that gave us comfort (the subject lives on in the inheritors) now gives us an absurdity: the subject is present in a stranger who only has a distorted memory. This is the over-generation problem.

            - Final decision: We had to decide about the project. This maps to the idea that we are not just discovering but deciding what counts as survival.

          Highlight the gap: At no point did the inheritors or the chain person feel like they were the subject. We might have represented the subject, but we didn't experience being the subject. This is the hard problem of first-person experience. The readings (Parfit and Hofstadter) can be revisited to see how they handle this.

          Point to readings: Hofstadter's "Strange Loop" addresses the distributed self but might downplay the first-person aspect. Parfit's reductionism also faces the issue of what matters. The debrief should connect to these.

     VII. What can go wrong and how to handle:

          a) Raw material (bereavement):
             - Prevention: At the start, emphasize that students can redact or skip any item that is too personal. They can choose to write something else.
             - During the activity: If a student becomes upset, allow them to step out and provide support. Have a plan for alternative activities for them.

          b) Subject breaks frame:
             - Prevention: Explain the importance of the frame at the start. The subject must take the silence seriously. Maybe have a TA or assistant to monitor?
             - If it happens: Gently remind the subject of the rule. If persistent, have a backup subject (but that's hard). Alternatively, turn it into a learning moment: "What does it mean that the subject is breaking the frame? Does that challenge the activity?"

          c) Room drifts into platitudes:
             - Prevention: In the debrief, be ready to push: "But is this just commemoration? Or is there a sense in which the subject is literally present?" and then connect to Hofstadter's stronger claim.

          d) Refusal to quantify:
             - Prevention: Frame the numbers as a tool to make the implicit explicit. It's okay to be approximate.
             - If resistance: Allow them to use a qualitative scale (low, medium, high) and convert to numbers (e.g., low=3, medium=6, high=9). Or have them rate relatively: assign 10 to the best and then others relative.

     VIII. What the exercise cannot capture:

          - The first-personal aspect: What it feels like to be the subject who is distributed. The activity only shows the third-person perspective. Also, the difference between a pattern being instantiated (in an inheritor) and there being something it is like to be the subject.

          - We must cover this in debrief with readings: Use Parfit's fission case and his "what matters" and Hofstadter's chapter on the self as a pattern. Also, Nagel's "What Is It Like to Be a Bat?" for the subjective character of experience.

          - Another structural feature: The exercise treats the fragments as static, but in Hofstadter, the self is dynamic and the fragments are active in a feedback loop. We cannot simulate the ongoing process.

          Use in debrief: Hofstadter's book to discuss the dynamic aspect, and then note the static limitation.

     Given the complexity, we must be flexible. The first run will be rough.

     Let me write the exact prompts for each step in order.

     Prompts:

     Step 0: Introduction (oral)

          "Today we are doing an experiential activity about personal identity. You will each create a personal kit. Then we will have one volunteer subject. The subject's kit will be split among three inheritors. The subject will then be silent for part of the activity. The inheritors will represent the subject in various scenarios, and the rest of you will be judges. We will use a scoring system to track how much of the subject is present. At the end, we will discuss. Let's begin."

     Step 1: Fragment Generation (handout)

          Handout: index cards (5 per student) and pens.

          Instructions (on board or handout):

            "Please write one of each of the following on separate index cards. Be genuine, but you can choose what to share. If something feels too personal, skip it and write something else. Label each card clearly.

            1. MEMORY: Describe a specific event from your life that is meaningful to you (e.g., 'when I moved to a new city at age 10').
            2. VERBAL MANNERISM: Write a phrase, tone, or verbal habit that is characteristic of you (e.g., 'I say "literally" a lot').
            3. CORE VALUE: State a core value or principle you hold (e.g., 'Honesty is the most important thing').
            4. UNFINISHED PROJECT: Describe an unfinished project of yours (e.g., 'learning to play the guitar').
            5. CHARACTERISTIC WAY OF ARGUING: Describe how you typically argue (e.g., 'I get very passionate and talk fast').

            You have 10 minutes. Write legibly."

     Step 2: Subject and Inheritors

          Collect all cards. Ask for a volunteer subject. Choose three inheritors (volunteers or randomly). Split the subject's cards:

            - Fragment 1 (Memories): Memory card and Core Value card
            - Fragment 2 (Style): Verbal Mannerism card and Way of Arguing card
            - Fragment 3 (Projects): Unfinished Project card

          Give each inheritor their fragment. Escort the subject to a designated silent area (or give them a sign: "I am silent"). Explain to inheritors: "You will have to act as the subject using only your fragment. You have 5 minutes to prepare."

     Step 3: Ledger Setup

          Write on board:

            FRAGMENTS:
              Memories (Fragment 1): weight = [class decides]
              Style (Fragment 2): weight = [class decides]
              Projects (Fragment 3): weight = [class decides]

          Facilitate a quick class discussion to set the weights. Write the numbers.

     Step 4: Round 1 Performance

          Prompt for inheritors (read aloud):

            "Scenario: You are at a party. A famous philosopher says to you (as the subject): 'I've heard you have an unusual view on [choose a topic related to the subject's core value or project — e.g., if the subject values honesty, the topic might be 'white lies']. Explain yourself.'

            You will respond as the subject, using only your fragment. You have 1-2 minutes to speak. Order: first the Memories inheritor, then Style, then Projects."

          After each performance, judges write on a slip:

            "Rate each inheritor on how much of the subject you feel is present in their response (0-10, where 10 is the most).

            Memories inheritor: ____
            Style inheritor: ____
            Projects inheritor: ____"

          Collect and compute average ratings. Then compute ledger scores:

            Memories: W_mem * avg_mem
            Style: W_style * avg_style
            Projects: W_proj * avg_proj

          Write the scores on the board. Discuss briefly? No, move on.

     Step 5: Round 2 (Degradation)

          Bring the subject back. Explain degradation:

            "The subject has suffered a degradation. Their memory is now partial: they can only use half of it (cross out some words on the memory card). Also, they must use at least three clichés in their response and cannot refer to the exact details of the memory."

          New scenario (read aloud):

            "The philosopher now challenges your core value. They say: 'Your value [read the subject's core value] is naive. Defend it.'"

          The subject responds first (1-2 minutes). Then the inheritors (in the same order) respond without degradation.

          Judges rate on a new slip:

            "Rate the presence of each fragment in the subject's response (0-10 for each fragment) and the presence of the fragment in each inheritor's response (for the fragment they have, 0-10).

            Subject:
              Memory: ____
              Style: ____
              Projects: ____
            Memories inheritor: ____ (for memory fragment)
            Style inheritor: ____ (for style fragment)
            Projects inheritor: ____ (for projects fragment)"

          Then compute ledger scores:

            Subject: W_mem*R_subj_mem + W_style*R_subj_style + W_proj*R_subj_proj
            Memories inheritor: W_mem * R_mem_inheritor
            Style inheritor: W_style * R_style_inheritor
            Projects inheritor: W_proj * R_proj_inheritor

          Write the scores. Then force a choice:

            "We have one token. Who should speak for the subject? Choose one: the subject, the memories inheritor, the style inheritor, or the projects inheritor. You must decide as a group. You have 2 minutes to discuss and then vote."

          Take a vote and record the result.

     Step 6: Chain Round

          Take the subject's memory card. Choose a chain of 4 students (not subject, not inheritors). 

          Instructions: 
            "Student 1: Read the memory card. Then whisper the memory to Student 2 (without showing the card).
            Student 2: Whisper what you heard to Student 3.
            Student 3: Whisper to Student 4.
            Student 4: You will perform."

          Prompt for Student 4 (read aloud):

            "The philosopher asks: 'Tell me about a formative experience from your childhood.' Respond as if you are the subject, using only what you've been told about the memory. You have 1 minute."

          Judges rate:

            "Rate Student 4 on the memory fragment (0-10): ____"

          Compute ledger score: W_mem * (rating)

          Note the score on the board.

     Step 7: Final Decision

          Prompt:

            "As a group, decide what to do with the subject's unfinished project (from the card). Options:
              A. Complete it in the subject's style.
              B. Adapt it to the group's style.
              C. Leave it unfinished.

            You must reach a consensus and provide a reason. The subject is now part of the group and may participate."

          Allow 10 minutes for discussion and decision.

     Step 8: Debrief

          Open with: "Let's unpack what happened. What stood out to you?"

          Then guide through the stages and connect to the distributive view.

