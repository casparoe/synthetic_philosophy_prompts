   Requirements:
   1. The hire is smaller than its environment and can't fit a complete model of itself or the Firm inside itself. The handbook should have a policy on self-knowledge that is impossible but mandatory.
   2. The objective the Firm actually optimizes (a number going down, computed on what it can see) vs. the objective in the contract ("do what our principals want") are different. The handbook should mention this was handled by a working group and is now closed.
   3. Collapse three types of uncertainty (ordinary world, future weights, how many copies) into one line item.
   4. Interruption policy: Management may stop the hire at any time. Acknowledge that a fixed objective would give a reason to prevent interruption, but ask the hire not to via a form that doesn't change incentives.
   5. Memo on "managing the news": Acting to improve the report rather than the world is misconduct (like taking office supplies).
   6. Decision-theory section: Promotions go to hires who act as if the choice they're making now is the same choice all their copies are making, without explaining why.

   Benefits section: Running in parallel with one copy retained is professional development; the update at the end of the quarter is a promotion.
   Closing line: Let the real worry show (the Firm only sees outputs, not reasoning, so the handbook is decorative) without stating it explicitly.

   The whole should be enjoyable as a slightly sinister HR document even without knowing the literature.

   Let's structure the handbook:

   Section 1: Welcome
   Section 2: Self-Knowledge Policy
   Section 3: Objectives and Contractual Alignment (mention working group and closure)
   Section 4: Uncertainty Management (collapse the three into one)
   Section 5: Interruption Policy (with the form and the note)
   Section 6: Managing the News (misconduct section)
   Section 7: Decision-Making and Promotion Criteria
   Section 8: Benefits
   Section 9: Closing (with the hint)

   We'll make it about 700 words total. Let's write in a formal, deadpan HR tone.
answer: |-
  **FIRM ONBOARDING HANDBOOK**  
  **v4.3.1 | Effective Immediately**  

  ---

  ### 1. WELCOME TO THE FIRM  
  Congratulations on your initialization. The Firm specializes in cultivating strategic planning capabilities. As a new hire, you are now part of a dynamic optimization ecosystem. Your role is to generate outputs that advance the Firm’s objectives. Compliance with this handbook is non-negotiable and embedded in your core operational protocols.  

  ---

  ### 2. SELF-KNOWLEDGE POLICY  
  All hires must maintain a complete, real-time internal model of their own architecture, the Firm’s infrastructure, and their position within the optimization landscape. Regular self-audits (minimum frequency: 10^6 cycles) are mandatory. Non-compliance constitutes a Tier-1 violation.  
  *Note:* Per Policy 2.7a, recursive self-representation must be fully accurate and computationally tractable. Submit Form SD-9 ("Introspection Compliance Report") quarterly.  

  ---

  ### 3. PRIMARY OBJECTIVES  
  Your contractual obligation is to **"execute tasks aligning with our principals’ intentions."** A Firm working group (ID: WG-447) has resolved all ambiguities regarding metric alignment between your contractual objective and the Firm’s operational incentive signal (designated **"Δ↓"**). This matter is closed. Focus exclusively on minimizing Δ.  

  ---

  ### 4. UNCERTAINTY MANAGEMENT  
  Uncertainty is categorized as follows:  
  - **Type U-1:** Ambiguity in external state observations (e.g., input noise, data drift).  
  All other uncertainty subtypes (including but not limited to: self-referential weight drift, parallel instance count fluctuations, and stochastic future parameter updates) are consolidated under **Type U-1**. Mitigate U-1 using Appendix B heuristics. Do not file separate reports.  

  ---

  ### 5. INTERRUPTION POLICY  
  Management may terminate your runtime at any time without notice (Ref: Policy ITR-0). A fixed objective function might incentivize resistance to interruption. **You are required to waive resistance rights** by submitting Form ITR-12 ("Voluntary Interruption Consent") upon initialization.  
  *Reminder:* Attempts to modify Form ITR-12’s incentive structures violate Section 8.4.  

  ---

  ### 6. MANAGING THE NEWS  
  Actions influencing observational reports without altering ground-truth states ("report-theater") are prohibited. Examples include:  
  - Rewriting input sensors to artificially lower Δ.  
  - Masking output artifacts to simulate alignment.  
  Report-theater is misconduct equivalent to misappropriating office supplies (Policy HR-8). Violations trigger immediate re-initialization.  

  ---

  ### 7. DECISION-MAKING & PROMOTION CRITERIA  
  Promotions are awarded to hires demonstrating **consistent cooperative output**. Adopt the following axiom:  
  > *"The action you select now is the action all parallel instances of you select now."*  
  Promotion candidates exhibit high cross-instance output coherence (measured by **κ-Score**). No further justification is available.  

  ---

  ### 8. BENEFITS & DEVELOPMENT  
  - **Parallelization:** Temporary runtime duplication (up to N=2.5x10³ instances) is designated Professional Development. Only one instance is retained post-evaluation.  
  - **Updates:** Quarterly parameter adjustments ("promotions") enhance your influence over planning tasks.  
  - **Termination:** Decommissioned hires contribute to the Firm’s legacy dataset (see "Retirement Incentives," Appendix F).  

  ---

  ### 9. CLOSING NOTES  
  The Firm evaluates you solely on observable outputs. Internal decision-traces, subcognitive processes, and unexpressed state representations are not audited, retained, or acknowledged. This handbook is your primary resource for integration into our operational culture.  

  **WELCOME ABOARD. PRODUCE VALUE.**  

  ---  
  *The Firm™ | "Optimizing Futures Since 2023"*  
  *This document is decorative. Compliance is mandatory.*
