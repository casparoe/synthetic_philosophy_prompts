prompt: |-
  I write the public-facing text for a genocide education centre — wall panels, statements, school materials — so several times a year I have to decide, in public, whether some event gets the word 'genocide' or something vaguer like 'mass atrocity.' I definately have gut verdicts and I want the principle behind them, plus the verdicts it tells me to drop.

  Clear yeses: the Holocaust; the Armenian deportations and massacres of 1915; Rwanda in 1994; Srebrenica, even though mostly the men and boys were killed and the women driven out; the Herero and Nama under German colonial rule in southern Africa; the Khmer Rouge, even though what they went after was closer to a class or a city population than to any of the four groups the treaty lists. Also yes: the Ukrainian famine of the early 1930s; Canada's residential schools, where the stated aim was assimilation rather than death — to make the group stop existing while its members lived on; a regime that wrecks a region's water and hospitals knowing a million will die while saying out loud that the group should go. And yes to a would-be exterminator who is stopped after killing three percent of the group, because I don't think body count is what does the work.

  Clear no: a famine caused by reckless policy with no group in mind; the firebombing of Japanese cities and the atomic bombs, even though civilians died in enormous numbers precisely because of who they were. I balk at the 1965-66 killings in Indonesia, which may just be my Khmer Rouge verdict applied inconsistently. And I go back and forth on the transatlantic slave trade: it was about labour, not destruction, but families were permanently sundered and the deaths were vast.

  The formulation I've been playing with is that genocide is aimed destruction of a group you cannot resign from, where that means your children inherit the membership even if you convert, recant, or flee — my way of keeping the Khmer Rouge without letting in every political purge. I'm not sure it survives the residential schools, and I notice I reach for the word faster when the perpetrator was a government my own country opposed, which makes me suspect the whole list is contaminated. One case I have no verdict on: nobody is killed, but over two generations a state dismantles the group's land base, language and schools until the group is gone.

  Answer as exactly five numbered items, one or two sentences each, no introduction and nothing after the last one: (1) the principle, stated so a colleague could apply it to a case I haven't listed; (2) which of my verdicts it overturns, and which it just can't accommodate; (3) the slave trade; (4) the stopped-at-three-percent case and the two-generation, nobody-dies case; (5) whether the politics of naming — who the word obliges, who it honours, who it pushes into denial — belongs inside the principle or is a separate judgement I should be making on top of it.
reasoning: |-
  Okay, the user writes public-facing text for a genocide education center and has to decide when to use the term "genocide" versus something vaguer like "mass atrocity." They've listed several cases they consider clear yeses and nos, along with some they're uncertain about. Their proposed principle focuses on "aimed destruction of a group you cannot resign from," where membership is inherited. They want a clear principle that a colleague could apply, which cases their verdicts might overturn, rulings on the slave trade and two specific cases, and whether political considerations should be part of the principle or separate.

  First, I need to refine their principle to be both precise and applicable. Their current idea about non-resignable groups is solid for cases like the Khmer Rouge targeting city dwellers. But it might exclude cultural genocide, like residential schools, where physical destruction isn't the goal. The legal definition in the Genocide Convention includes "intent to destroy, in whole or in part," and lists acts beyond killing, like causing serious harm or preventing births. So the principle should include cultural destruction as genocide if the intent is to eliminate the group's existence, even without mass killings. That would cover residential schools and the land/language erosion case.

  Next, the verdicts that would be overturned. The user currently says no to Indonesia 1965-66 because it targeted communists, who could theoretically resign. But under the refined principle, if the targeted group was defined by immutable characteristics (like ethnicity, if communists were perceived as an ethnic group), it might qualify. However, political groups aren't protected under the Genocide Convention, so that's a conflict. The user might need to decide if their center's definition aligns strictly with the Convention or goes beyond it. Also, the firebombing of Japan is a clear no because it targeted civilians as part of war strategy, not with intent to destroy a specific group. That stays.

  For the slave trade: it's complicated. The intent was labor exploitation, not group destruction. But the outcome included massive deaths and prevented births through family separation. However, the system relied on the group's existence for labor. So it doesn't fit the genocide label under the principle, aligning with the user's hesitation. The three-percent-stopped case still qualifies because intent matters more than completion. The cultural destruction case (land, language) fits as genocide under the principle since it's intentional destruction without killing.

  Politics of naming: This is crucial for an education center. Including it in the principle could bias the definition. Better to keep the principle objective based on intent and acts, then separately consider educational impact, sensitivity, and denial risks. That way, the term is applied consistently, but messaging can be tailored contextually.

  The user's deeper needs include consistency to avoid accusations of bias, especially since they worry about being influenced by their country's politics. They also need definitions that withstand scholarly scrutiny while being accessible for public education. Balancing legal accuracy with educational goals is key. Ensuring that cultural genocide is included addresses residential schools and similar cases, which are important in contexts like Canada. Acknowledging the political implications separately maintains integrity while allowing nuanced communication.
answer: |-
  Here are the five requested items:

  1.  **Principle:** Genocide is present when there is demonstrable *intent* by perpetrators to destroy, in whole or significant part, a stable, identifiable group defined by characteristics perceived as fundamental and immutable (e.g., ethnicity, nationality, religion, or sometimes culture/politics if treated as inherent), through acts like killing, serious physical/mental harm, inflicting conditions to destroy, preventing births, or forcibly transferring children.

  2.  **Overturns/Incompatible:** Overturns your "no" on Indonesia 1965-66 if the victims were targeted *as* an immutable group (e.g., ethnic Chinese communists seen inherently). Incompatible with your "no" on atomic/firebombing (intent was military/capitulation, not group destruction).

  3.  **Slave Trade:** Not genocide under this principle. The *intent* was brutal exploitation for labor, not the group's destruction; the system required the group's existence and reproduction, despite causing massive death and cultural annihilation.

  4.  **Stopped & Cultural Cases:** The stopped-at-3% case *is* genocide if intent was destruction. The two-generation cultural destruction case *is* genocide if the intent was the group's dissolution via preventing births/transferring children/destroying its basis for existence.

  5.  **Politics of Naming:** This is a *separate judgement* on educational impact and ethical responsibility, made *after* applying the principle, not part of the definition itself.
