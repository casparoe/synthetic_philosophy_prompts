prompt: |-
  Hey — I got drafted onto the board of a tiny family foundation last spring (the Halloway Fund, about $6m, we make one or two grants a year), and I've ended up way deeper into discounting the future than I ever expected. We've got two proposals on the table and I need to figure out whether I'm being reasoned with or just talked at.

  Option A is the boring one: pay out roughly 3.5% a year forever to a local adult-literacy nonprofit, keep the principal whole in real terms. Option B is our youngest trustee's: let the whole thing compound for a hundred years and then make one enormous grant — at 3% real that's something like 19x today's money, so call it $110m of grantmaking power in 2125 instead of $200k a year now.

  Our board chair, Marilyn, keeps killing option B with the same analogy: a foundation is just a household. A household doesn't eat its seed corn; a household is *allowed* to care more about its own kids than about great-grandkids it'll never meet; and a household knows that a dollar a hundred years out is worth a small fraction of a dollar today. So: perpetual payout, no century fund, and — her actual line — "we owe the future the interest, not the principal." The analogy is doing all the work: it's what licenses both the low payout and the idea that a beneficiary in 2125 counts for less.

  Dev, who pushes option B, says the household frame *is* the disease. His version: distance in time isn't a moral reason for caring less, exactly as distance in space isn't. If you wouldn't discount a kid in another country because she's far away, you can't discount a kid in 2125 because she's far off. So pure time preference is zero, and the only thing that should move the number is the chance that nobody's there to recieve the money.

  I think both of them are being sloppy and I can't say exactly how. A few things I keep circling on and want you to deal with:

  The return is in dollars, but the thing we care about isn't. If the world keeps getting richer, a future dollar buys less welfare, so what we should be discounting might be welfare, not dollars — and once you do that it's not obvious which direction option B moves in. (Also: at 3% growth and 3% discount, isn't the century grant exactly as big as today's, in the only units that matter?)

  We can't bind the 2125 board. "Saving for the future" is really a bet that whoever is in the room in 2125 will spend it well, and our own governing document will be read by people who don't know us. A household sort of has this problem too, but it feels different in degree.

  Every year's board faces this same choice with the same reasons, so "compound now, give later" looks like a plan that nobody ever actually executes — unless we lock it in, which is the handoff problem again.

  Some of the things we could fund now have a deadline: there's a tract of land that'll be subdivided within about five years, and once it's gone it's gone. Other things we'd know much more about in twenty years. I don't know whether that's an argument about time preference at all or just about which options expire.

  And someone at a conference told me that if you're genuinely unsure what rate applies over 200 years, the honest thing is to discount the far future at roughly the lowest rate you can't rule out. That sounded like a party trick. Is it?

  What I'd like, in this order:

  **The mapping** (~250 words): a table of what corresponds to what in Marilyn's household picture — principal, kids, the mortgage rate, retirement, death, inheritance, "seed corn" — and what each of those is supposed to be in our case.

  **Where it holds** (~200 words): the parts of the household comparison that genuinely carry over to a perpetual institution.

  **Where it breaks** (~450 words): the disanalogies that matter for the decision in front of us — infinite horizon, impersonal vs. partial beneficiaries, dollars vs. welfare, growth, extinction and institutional risk, uncertainty about the rate itself — and be explicit about which ones are decisive and which are noise.

  **What the analogy smuggles in** (~250 words): which features of a household the foundation doesn't have, and which of those features are quietly supplying the conclusion. I suspect "someone has to eat next year" is doing a lot of hidden work.

  **A better comparison** (~200 words): if the household is the wrong object, what should we be comparing a perpetual foundation to — a dynasty, a trust, a nation, an ecosystem, something else — and does that comparison point anywhere different?

  **What I should tell the board** (~300 words): once the audit is done, is there any pure time preference left over after growth, risk and uncertainty are subtracted out, and is whatever's left a moral judgment or just a fact about us? Then: A, B, or something else, and what I'd have to believe to change my mind.
reasoning: |-
  Alright, let's tackle this user's problem. They're on the board of a small family foundation, the Halloway Fund, and they're stuck between two grant options. Option A is a perpetual payout, while Option B compounds for a hundred years. The user's colleagues are using a household analogy to argue their sides, but the user feels both are being sloppy. They need a breakdown of the analogy, where it holds and breaks, what it smuggles in, a better comparison, and finally, what to tell the board.

  First, I need to unpack Marilyn's household analogy. She compares the foundation to a household: principal is seed corn, payout is income, future beneficiaries are descendants. The discount rate is like the household's time preference. But foundations aren't households. They're perpetual, so the "retirement" or "death" point doesn't apply. Also, beneficiaries are impersonal, unlike family members. 

  Next, where does the analogy hold? Finite resources and intergenerational responsibility are valid. But the breaks are crucial. Infinite horizon means no natural endpoint. Future beneficiaries aren't "descendants" but strangers. Dollars vs. welfare is big—if the world gets richer, future dollars buy less good. Also, institutional risk: can they trust future boards? And uncertainty about discount rates over centuries. 

  The analogy smuggles in necessity. Households have immediate needs (eating next year), but foundations don't. That urgency isn't there, making pure time preference less justifiable. 

  A better comparison? Maybe a nation or civilization. Long-term investments like infrastructure or education, where the focus is on sustainable growth. That leans towards compounding if future needs are greater. 

  For the board, growth and risk adjustments matter. Pure time preference might be low, but welfare discounting due to growth could make future grants less impactful. However, if existential risks are low and growth stalls, compounding makes sense. The user should propose a middle path: partial compounding with a sunset clause. Address immediate opportunities like the land, but save some for the future. 

  Key beliefs: If growth is high, Option A is better. If low, Option B. Since uncertainty is high, a balanced approach mitigates risk. The user needs to evaluate growth projections and the foundation's risk tolerance.
answer: |-
  Here’s a structured response to your questions:

  ---

  ### **The Mapping** (Marilyn’s Household Analogy)
  | **Household Term** | **Foundation Equivalent** | **Purpose in Argument** |
  |-------------------|--------------------------|------------------------|
  | Seed corn         | Endowment principal      | Justifies preserving principal; "don’t eat the golden goose". |
  | Kids/Grandkids    | Near-term beneficiaries (e.g., current adult learners) | Prioritizes known, proximate needs over abstract future ones. |
  | Mortgage/ROI      | Discount rate (e.g., 3%) | Quantifies "today’s dollar > future dollar" via time preference. |
  | Retirement/Death  | Foundation’s "end" (implied finite horizon) | Suggests a natural endpoint for obligations (but foundations are perpetual). |
  | Inheritance       | Future grantmaking       | Frames legacy as optional generosity, not core duty. |
  | "Eating next year"| Annual payout needs      | Embeds urgency: current needs demand action now. |

  ---

  ### **Where It Holds**
  The analogy validly highlights **scarcity** (finite resources demand trade-offs) and **intergenerational responsibility** (preserving assets for future use). Like households, foundations must balance current vs. future consumption, avoid reckless depletion, and acknowledge practical limits on foresight/control. The "seed corn" principle (maintaining real principal) aligns with perpetual foundations’ legal and ethical duty to exist indefinitely.

  ---

  ### **Where It Breaks (and Why It Matters)**
  1. **Infinite Horizon**:  
     Households plan for decades; foundations plan for centuries. A 100-year horizon isn’t "neglecting grandkids" but betting on distant strangers. **Decisive**: Household urgency ("feed kids now") doesn’t apply.  

  2. **Impersonal Beneficiaries**:  
     Marilyn’s "kids > grandkids" assumes emotional bias. Foundations serve impartial missions. Discounting 2125 beneficiaries because they’re unknown is arbitrary if we reject spatial discounting (e.g., favoring locals over foreigners). **Decisive**: Undercuts the moral case for high time preference.  

  3. **Dollars vs. Welfare**:  
     If global wealth grows 3%/year, a 2125 dollar buys **less** marginal welfare (e.g., curing disease in 2125 may cost more). Discounting dollars at 3% while growth runs at 3% implies future grants deliver *equal* welfare to today’s. **Decisive**: Option B’s $110M might do *less good* than $200k/year if growth exceeds discounting.  

  4. **Institutional Risk**:  
     Future boards may ignore your intent (e.g., spend the $110M on admin costs). Households bind heirs via kinship; foundations rely on legal documents. **Noise**: Mitigated by ironclad trust structures.  

  5. **Uncertain Discount Rates**:  
     Over 200 years, 3% is a guess. The "lowest defensible rate" heuristic (e.g., 1-2%) avoids gambling on high discounting. **Decisive**: Justifies lower discounting if uncertainty is high.  

  ---

  ### **What the Analogy Smuggles In**
  The household frame smuggles in **biological necessity** ("someone must eat now") and **emotional partiality** ("my kids first"). Foundations lack both:  
  - No survival imperative to spend immediately (unlike households needing food/shelter).  
  - No moral license to favor present beneficiaries (unless your charter specifies it).  
  This covertly biases toward Option A by treating future harm as less urgent. Meanwhile, **finite lifespans** are smuggled in to justify "capping" obligations, but perpetuity means the foundation *has no expiration*.  

  ---

  ### **A Better Comparison**  
  Compare the foundation to a **civilization-scale trust** (e.g., building cathedrals over centuries) or a **nation investing in infrastructure**. Both:  
  - Accept deferred gains (e.g., planting forests whose shade you’ll never sit in).  
  - Weigh uncertain futures (e.g., "Will anyone need this dam in 2125?").  
  This favors **patient capital** if future problems dwarf today’s (e.g., climate change) or compoundable solutions exist (e.g., endowment-funded research). Unlike households, civilizations *must* discount the future minimally to survive long-term.  

  ---

  ### **What to Tell the Board**  
  **On Time Preference**: Pure time preference (caring less *just* because it’s later) is indefensible morally. After adjusting for:  
  - **Growth-driven welfare discounting** (if future wealth reduces marginal utility of dollars),  
  - **Risks** (extinction, institutional failure),  
  - **Opportunity costs** (e.g., the 5-year land purchase),  
  ...net discounting may be near-zero or negative. A 1-2% rate is more defensible than 3% over centuries.  

  **Recommendation**: **Neither A nor B alone.** Propose:  
  1. **Fund critical near-term opportunities** (e.g., the land purchase).  
  2. **Commit 50-80% of assets to compounding** for 50-100 years (not 100; balances impact and control).  
  3. **Sunset clause** (e.g., "Spend all by 2150 unless renewed by future boards").  

  **To change your mind**:  
  - Choose Option A if you believe:  
    - Growth will outpace discounting (>3%/year), making future dollars less valuable.  
    - Current interventions are irreplaceable (e.g., literacy now prevents intergenerational poverty).  
  - Choose Option B if:  
    - You expect transformative future opportunities (e.g., clean energy breakthroughs).  
    - Your governance locks in spending rules (e.g., legally binding trust).  

  **Core question**: Is your role to alleviate today’s suffering or to plant seeds for a greater future? The household analogy obscures this; your mission should decide.
