  The core request is for a set of rigorous desiderata that can objectively determine whether novel systems qualify as self-replicators. They want this specifically to evaluate the DNA-Gödel isomorphism claim - what it actually proves versus where it's just suggestive. The user provides numerous test cases to stress-test any proposed criteria: various DNA scenarios, mirror-image cells, quines, viruses, 3D printers, photocopiers, crystals, fires, prions, and autocatalytic networks. Plus some "near-misses" like mules and plaster casts.

  There are two special requests: first, to distinguish non-negotiable requirements from camp-specific preferences (e.g., whether replication requires a description/code, whether it must be intrinsic, whether the interpreter must be self-produced). Second, to identify any conflicts between desiderata and specify what must be compromised - particularly whether an intrinsic criterion can handle cases like primers or mirror cells.

  The user shares their own hypothesis that the DNA-Gödel analogy works only for the dual use of strings as instructions/data, while claims about self-reference or self-supplied semantics confuse replication with evolvability. They'd like a compact table comparing von Neumann's, Hofstadter's, and chemical-autocatalysis models against the criteria.

  The challenge here is balancing philosophical rigor with practical applicability. The criteria must be:
  - Precise enough to handle edge cases without intuitive appeals
  - Grounded in physics/computation/biology
  - Able to clarify the Gödel analogy's scope
  - Diagnostic for the provided test cases

  Key tensions to address:
  - Intrinsic properties vs. environmental dependencies (mirror cells, viruses)
  - Material continuity vs. informational replication (crystals vs DNA)
  - Self-containment vs. distributed processes (autocatalytic networks)
  - The role of "description" versus pure chemistry (prions)

  For the DNA-Gödel isomorphism, the real insight is the syntactic duality (same string as instruction/data), not semantic self-interpretation. Biological systems delegate interpretation to evolved machinery - a crucial difference from formal systems.

  The table format will help contrast the three major frameworks. Von Neumann nails the description/copy separation but overrequires complexity; Hofstadter overemphasizes self-reference; chemical models handle simple cases but miss coded information. The deepest conflict is between intrinsicness and medium-relativity - a replicator must be defined relative to an environment, but not arbitrarily so (hence the "non-ad hoc medium" requirement).
answer: |-
  Below is a specification of desiderata for an account of physical self-replication, stress-tested against your cases. Requirements are categorized as **non-negotiable** (grounded in physics/computation/logic) or **negotiable** (camp-specific preferences). Conflicts and trade-offs are explicit. The DNA–Gödel isomorphism is dissected in context.

  ---

  ### **Core Desiderata**  
  *Non-negotiable requirements (NN)* derived from physics, computation, or logical consistency. *Negotiable (N)* reflect theoretical preferences.

  1. **Material Causation (NN)**  
     - *Requirement:* The replicator must physically cause the production of its copy.  
     - *Motivation:* Excludes abstract or observer-dependent "replication" (e.g., a blueprint alone).  
     - *Tests:*  
       - ✅ DNA + polymerase + nucleotides: Material interaction causes copy.  
       - ❌ DNA strand alone: No causation; no copy produced.  
       - ❌ Quine: CPU (environment) executes; replicator doesn’t *cause* CPU’s actions.  

  2. **Medium-Relative Fidelity (NN)**  
     - *Requirement:* Replication must occur in a *non-ad hoc* medium (i.e., one that permits copying without artificial intervention).  
     - *Motivation:* Avoids trivialization (e.g., "if we add magic polymerase, it replicates").  
     - *Tests:*  
       - ✅ Mirror cell + mirror polymerase: Medium (mirror broth) is *non-ad hoc* if chemically plausible.  
       - ❌ Primer supplied by experimenter: Medium is ad hoc (external agent required).  
       - ❌ Virus: Host cell is non-ad hoc (pre-existing, autonomous). *Virus qualifies as replicator relative to host medium.*  

  3. **Token-Identifiable Entity (NN)**  
     - *Requirement:* A specific, spatially bounded *token* (e.g., a cell, strand, machine) must be the target of copying.  
     - *Motivation:* Distinguishes replication from undirected growth (e.g., crystals).  
     - *Tests:*  
       - ✅ DNA strand: Discrete entity copied.  
       - ✅ 3D printer: Machine is token.  
       - ❌ Crystal/fire: No token; growth is boundary-agnostic propagation.  
       - ❌ Autocatalytic network: No privileged token; distributed process.  

  4. **Information Preservation (NN)**  
     - *Requirement:* *Some* structural feature must be preserved across generations, enabling heredity.  
     - *Motivation:* Without preservation, no replication (vs. mere catalysis).  
     - *Tests:*  
       - ✅ DNA sequence preserved.  
       - ✅ Prion fold preserved (heritable strain differences).  
       - ❌ Plaster cast: Mold is not preserved; copy is inverse.  

  5. **Self-Contained Initiation (N)**  
     - *Requirement (Hofstadter/von Neumann camp):* The replicator must *produce* its own interpreter (e.g., enzymes for DNA).  
     - *Motivation:* Ensures "intrinsic" replication without infinite regress.  
     - *Tests:*  
       - ❌ Virus: Relies on host ribosomes (interpreter not self-produced).  
       - ❌ Quine: Relies on pre-existing CPU.  
       - ✅ Von Neumann automaton: Interpreter is part of the copied description.  

  6. **Coded Description (N)**  
     - *Requirement (von Neumann camp):* Replication requires a *description* (e.g., genome) that is distinct from the interpreter and is copied.  
     - *Motivation:* Explains programmable variation (evolvability).  
     - *Tests:*  
       - ✅ DNA: Sequence is description.  
       - ❌ Prion: No sequence/code; fold is template, not description.  
       - ❌ Fire: No description.  

  7. **Level-Neutrality (NN)**  
     - *Requirement:* Account must work without privileging a scale (e.g., molecular vs. organismal).  
     - *Motivation:* Avoids arbitrariness (e.g., is a ribosome part of the replicator or environment?).  
     - *Tests:*  
       - ✅ 3D printer: Replication at machine level (file in memory).  
       - ✅ 3D printer with server: Fails if server is external, but *if* server is part of system, succeeds.  

  ---

  ### **Conflict Resolution**  
  - **Intrinsicness vs. Medium-Relativity:** You suspect correctly. **Medium-relativity (NN) is non-negotiable**, but intrinsicness (self-contained interpreter) is negotiable.  
    - *Trade-off:* If replication must be "intrinsic" (self-contained interpreter), viruses, quines, and primer-dependent DNA fail. If medium-relative, they succeed *relative to a non-ad hoc medium*.  
    - *Resolution:* Drop intrinsicness as a requirement for *replication*; it’s a requirement for *autonomy* or *evolvability*.  

  - **DNA–Gödel Isomorphism Scope:**  
    - **Exact point:** Dual use of a string as data and instruction (von Neumann’s "description used twice").  
    - **Overreach:** Gödel numbering requires the system to *interpret its own symbols* (self-reference). Biology delegates interpretation to evolved machinery (polymerases). DNA does *not* supply its own semantics.  
    - *Verdict:* The isomorphism establishes syntactic duality, *not* self-interpretation or self-referentiality.  

  ---

  ### **Test Case Classifications**  
  | System                  | Replicator? | Reason                                  |  
  |-------------------------|-------------|-----------------------------------------|  
  | DNA + pol + nucleotides | Yes         | Material causation, fidelity, token.   |  
  | DNA + experimenter primer | No        | Ad hoc medium (primer supplied).        |  
  | Mirror cell + mirror pol | Yes        | Non-ad hoc medium (if mirror broth exists). |  
  | Quine                   | No          | Interpreter (CPU) not caused by quine. |  
  | Virus                   | Yes         | Replicates relative to host medium.     |  
  | 3D printer (file in memory) | Yes     | Token, causation, fidelity.             |  
  | 3D printer (file on server) | No*      | *If server is external, ad hoc medium.  |  
  | Photocopier + technician | No         | Assembly ad hoc (technician required). |  
  | Crystal/fire            | No          | No token entity; no information preservation. |  
  | Prion                   | Yes         | Fold preserved (information); token entity. |  
  | Autocatalytic network   | No          | No token; distributed causation.        |  
  | **Near-misses:**        |             |                                         |  
  | Mule                    | No          | No replication (sterile).               |  
  | Plaster cast            | No          | No preservation (mold not copied).      |  
  | Transposable element    | No          | Does not cause own copying machinery.   |  

  ---

  ### **Scoring Key Frameworks**  
  *(✔ = Satisfies, ✘ = Fails, ~ = Partially)*  

  | Desideratum               | von Neumann (Description) | Hofstadter (Strange Loop) | Chemical Autocatalysis |  
  |---------------------------|---------------------------|---------------------------|------------------------|  
  | Material Causation (NN)   | ✔                         | ✔                         | ✔                      |  
  | Medium-Relativity (NN)    | ✔                         | ✘ (Requires self-contained system) | ✔             |  
  | Token Entity (NN)         | ✔                         | ✔                         | ✘ (Distributed)        |  
  | Information Preservation (NN) | ✔                     | ✔                         | ~ (If network structure preserved) |  
  | Self-Contained Interpreter (N) | ✔                    | ✔                         | ✘                      |  
  | Coded Description (N)     | ✔                         | ✔                         | ✘                      |  
  | Level-Neutrality (NN)     | ~ (Privileges "description" level) | ~ (Self-reference scale-dependent) | ✔ |  
  | **Handles Test Cases:**   |                           |                           |                        |  
  | Virus                     | ✘                         | ✘                         | ✔                      |  
  | Prion                     | ✘ (No code)               | ✘ (No self-reference)     | ✔                      |  
  | Autocatalytic Network     | ✘                         | ✘                         | ~ (If tokens defined)  |  

  **Key Tension:**  
  - **Most exclusionary requirement:** *Self-Contained Interpreter (N)*. It excludes viruses, quines, and primer-dependent systems.  
  - **Strongest non-negotiable:** *Medium-Relativity*. Forces acknowledgment of environmental context.  

  ---

  **Conclusion:**  
  - **Minimal Replicator:** A token entity that causes, in a non-ad hoc medium, the production of a copy preserving key structural features.  
  - **DNA–Gödel Isomorphism:** Valid *only* for syntactic duality (string as data/instruction). Fails for self-reference/semantics.  
  - **Your Hypothesis Confirmed:** Requirements for "evolvability" (unbounded variation, coded descriptions) are distinct from replication proper. Prions and viruses replicate without them.  

  Use this to debate whether replication *should* require coded descriptions (a negotiable preference tied to evolvability) or if token-based material fidelity suffices. The mirror cell and virus cases force medium-relativity; intrinsicness is unsustainable.
