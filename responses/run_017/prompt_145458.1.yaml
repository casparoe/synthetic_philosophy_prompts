  Below is a decision tree designed to clarify disagreements about Harsanyi's aggregation theorem. It starts from the goal of a complete, transitive ranking over welfare distributions for a set of people and proceeds through concrete choices. Each node presents a scenario forcing a binary decision. The tree has **11 nodes** and **11 leaves** (including one empty/incoherent outcome). Key distinctions include the role of weights (interpersonal comparability vs. priority) and variable population.

  ### Decision Tree
  **Start**: You want a complete, transitive ranking over distributions of welfare for a set of people.  
  **Node 1 (Population)**: Can the number of people vary? (e.g., comparing 1 person at welfare 10 vs. 2 people at 5)  
  - **Yes** → Go to Node V  
  - **No** (Fixed population) → Go to Node 2  

  ---

  #### Variable Population Branch (from Node 1 "Yes")  
  **Node V**: World A: 1 person at welfare 10. World B: 2 people at welfare 5. Which is better?  
  - **A better** → **Leaf: Average Utilitarianism** (Ranking by average welfare; B’s average (5) < A’s (10))  
  - **B better or equal** → **Leaf: Total Utilitarianism** (Ranking by total welfare; B’s total (10) = A’s (10), or you weight existence positively)  

  ---

  #### Fixed Population Branch (from Node 1 "No")  
  **Node 2 (Veil of Ignorance)**: Should the ranking match what an impartial observer would choose under an *equal chance* of being any person in the distribution?  
  - **Yes** → Go to Node 3  
  - **No** (Aggregation of preferences) → Go to Node 4  

  **Node 3 (Risk Attitude)**: The observer evaluates a 50% chance of welfare 0 and 50% of 100. Is this lottery equally good as welfare 50?  
  - **Yes** (Risk-neutral) → **Leaf: Average Utilitarianism** (Observer maximizes expected welfare = average)  
  - **No** (Risk-averse) → **Leaf: Ex Ante Prioritarianism** (Observer uses concave transformation of welfare; e.g., prefers 50 for sure over the lottery)  

  **Node 4 (Fairness under Risk)**: Alice and Bob, both at welfare 0. One kidney (gives +1 welfare to recipient). Option A: Give to Alice (→ (1,0)). Option C: Fair lottery (50% (1,0), 50% (0,1)). Is C at least as good as A?  
  - **Yes** → Go to Node 5  
  - **No** (Rejects vNM axioms) → Go to Node 8  

  **Node 5 (Priority without Risk)**: Alice at 0, Bob at 1. One kidney: Give to Alice (→ (1,1)) or Bob (→ (0,2)). Is (1,1) strictly better than (0,2)?  
  - **Yes** → Go to Node 6  
  - **No** (Indifferent or (0,2) better) → Go to Node 7  

  **Node 6 (Risk and Priority)**: Same as Node 5. Lottery D: 50% (1,1), 50% (0,2). Is D at least as good as (1,1)?  
  - **Yes** → *Empty* (Incoherent: Rejects risk-aversion implied by Node 5 "Yes")  
  - **No** → Go to Node 9  

  **Node 7 (Weights Role)**: Harsanyi says your ranking is a weighted sum of utilities. Must weights be equal?  
  - **Yes** → **Leaf: Total Utilitarianism** (Fixed population: sum = average × constant)  
  - **No** → **Leaf: Weighted Utilitarianism** ("Blank cheque": Weights are free parameters; theorem doesn’t fix interpersonal comparisons)  

  **Node 8 (Inequality Aversion)**: Distribution (0,0) vs. (0.1,0). Is (0.1,0) strictly better?  
  - **Yes** → **Leaf: Leximin** (Rank by worst-off; break ties with next worst-off)  
  - **No** → **Leaf: Maximin** (Rank solely by worst-off position; indifferent here)  

  **Node 9 (Ex Ante vs. Ex Post)**: Lottery E: 50% chance of (1,0), 50% of (0,0). Lottery F: (0.5, 0) for sure. Which is better?  
  - **F strictly better** → **Leaf: Ex Post Prioritarianism** (Apply concave transform *then* average over outcomes)  
  - **E and F equal** → **Leaf: Ex Ante Prioritarianism** (Apply concave transform to *expected* utilities)  
  - **E strictly better** → *Empty* (Rare/unattractive: Risk-loving, inconsistent with Node 6)  

  ---

  ### Key Notes
  - **Empty Cells**:  
    - Node 6 → "Yes": Incoherent with prior risk-averse choice (Node 5 "Yes" implies (0,2) is worse, so lottery can’t be as good as (1,1)).  
    - Node 9 → "E better": Risk-loving prioritarianism is theoretically possible but rarely defended.  
  - **Indistinguishable Leaves**: Average Utilitarianism appears in two branches (veil and variable population), but the justification differs.  
  - **Weight Distinction**:  
    - **Interpersonal comparability**: Weights resolve "how much" a unit of welfare counts for each person (Node 7 "No" → blank cheque).  
    - **Priority**: Weights embed distributional sensitivity *before* aggregation (e.g., prioritarianism in Nodes 5–9).  
  - **Variable vs. Fixed**: Average and total utilitarianism collapse under fixed population (Node 7), but diverge under variable population (Node V).  

  ---

  ### Walkthrough: Hypothetical Person
  - **Preferences**:  
    - Takes the lottery in every risk case.  
    - Without uncertainty, gives benefit to worse-off.  
    - Wants equal weights.  
  - **Path**:  
    1. **Node 1 (Population)**: Says "No" (fixed population).  
    2. **Node 2 (Veil)**: Says "No" (prefers aggregation over veil).  
    3. **Node 4 (Fairness)**: Takes lottery → "Yes" (C ≥ A).  
    4. **Node 5 (Priority)**: Prefers (1,1) (gives to worse-off Alice) → "Yes".  
    5. **Node 6 (Risk)**: Rejects lottery D (not ≥ (1,1)) because (0,2) is worse → "No".  
    6. **Node 9 (Ex Ante/Post)**: Compares lotteries E and F. Risk-averse from Node 6, so prefers F (sure thing) → "F better".  
  - **Outcome**: **Ex Post Prioritarianism** (Leaf: Node 9 → "F better").  
  - **Defensibility?** Yes. Ex post prioritarianism is a coherent, well-defended position (e.g., in social ethics or policy). It respects:  
    - Priority to the worse-off (Node 5).  
    - Risk aversion (Node 6), applied by transforming utilities *before* aggregating over states.  
    - Equal weights are embedded in the prioritarian transformation (no need for separate weights).  

  This position rejects Harsanyi’s utilitarianism by introducing concavity at the outcome level, making it distribution-sensitive and risk-averse. It’s incompatible with the "blank cheque" interpretation (weights aren’t free) and the veil (it’s aggregation-first).
