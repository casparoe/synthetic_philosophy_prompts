  **Scenario:**  
  Dr. Bennett is the lead physician at a small rural clinic. She has a deep personal commitment to her long-term patients, whom she knows well and whose complex histories she has managed for years. The regional health board offers her a role redesigning preventive care programs for the entire county, which would improve population health outcomes significantly but require her to reduce her clinical hours by 80%. She knows all relevant facts: the redesign would prevent hundreds of avoidable illnesses over a decade, while cutting her direct patient contact would harm her current patients' continuity of care, worsening some outcomes. She has no incoherent preferences or akrasia—she values both population health and her existing relationships—and after careful deliberation, she declines the role to prioritize her current patients.  

  **Verdicts:**  
  - **(R):** Dr. Bennett ought to take the role. The impartial reasons (e.g., maximizing aggregate well-being) clearly favor preventing hundreds of future illnesses over the smaller harm to her current patients, given the net benefit. Her personal attachments do not alter these objective reasons.  
  - **(D):** Dr. Bennett ought to decline the role. After ideal deliberation—enriched with full vividness (making her emotional bonds to current patients more salient), coherence (integrating her desires without dampening them), and inferential power—her deep attachment to her patients would dominate. She would settle on declining, as the idealisation amplifies her existing commitment without overriding it.  

  **Structural feature generating divergence:**  
  The divergence arises from **vividness intensifying non-consequentialist attachments under coherence**. (R) treats reasons as objective and agent-neutral, while (D)’s enriching idealisation (especially vividness) heightens the subjective force of agent-relative commitments (loyalty to current patients), making them decisive in coherent deliberation, even though they are outweighed by impartial reasons.  

  **Effect of removing the feature:**  
  Without vividness amplification (e.g., if idealisation excluded emotional salience), Dr. Bennett’s attachments might not outweigh aggregate benefits, closing the gap. (D) could then align with (R), endorsing the role.  

  **Attacking the case (defender of R’s perspective):**  
  A defender of (R) would argue this case cheats by smuggling in implicit partiality through "vividness." The emotional intensification of attachments functions as covert bias, not a normative reason. Since (D) lets psychological salience distort what counts as a good decision, it abandons objectivity: reasons (on R) must track facts about well-being, not amplified feelings. If vividness can override net benefits, (D) collapses into subjectivism, violating the motive-invariance constraint.
