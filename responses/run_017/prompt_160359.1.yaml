  Let's write it up.

  **Scenario:**

  Alex directs a community center with a youth program serving 20 local children. She can apply for a grant to expand the program to serve 60 more children at other centers, but the application would require two months of intense work, during which the current program would deteriorate, causing significant harm to the 20 children. Without the application, the current program continues well, but the 60 miss out. Alex knows all the relevant facts. She has a strong attachment to her current 20 children and a desire to help as many children as possible. She decides not to apply, feeling a special responsibility to the current children. She exhibits no practical irrationality: she recognizes the tension but gives more weight to her immediate charges.

  **Verdicts:**

  - (R): What Alex ought to do is determined by the reasons there are. If the reasons are such that they impartially maximize overall well-being, then she ought to apply for the grant because it brings about greater net good. The harm to the 20 is outweighed by the good to the 60.

  - (D): What Alex ought to do is what she would decide after ideal deliberation. Ideal deliberation enriches by making her existing knowledge more vivid (so the plight of the 20 becomes more emotionally salient) and ensuring full coherence among her desires. Her attachment to the 20 is preserved and intensified by vividness, and coherence does not erase her special commitment. Thus, she would still decide not to apply.

  **Structural feature causing divergence:**

  The divergence arises because the idealisation of vividness amplifies the emotional force of Alex's existing attachments, which then dominates in coherent deliberation, even though the objective reasons (on R) are impartial and aggregate.

  **If the feature is removed:**

  Without the vividness amplification (or if the idealisation did not include making existing knowledge more emotionally vivid), the weight given to the current 20 might not be as large, and the gap might narrow or disappear.

  **Attacking the case:**

  A defender of R (who holds that Alex ought to apply) might argue that the D view cheats by allowing an emotional bias (intensified by vividness) to override what the reasons actually require. The idealisation of vividness is importing a distortion that has no place in determining what one ought to do. Reasons are not sensitive to such psychological amplification.

  A defender of D might counter that the ideal deliberation is supposed to reflect the agent's own point of view under improved conditions, and the enriching idealisation (including vividness) is part of that. If the agent's attachments are central to her identity, then they should play a role in what she ought to do.
