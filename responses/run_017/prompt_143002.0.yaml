  The user has outlined several non-negotiable elements: anti-projection safeguards, distinction between wildness and depravity, universal vice criterion, comparative framing test, and epistemic humility about sources. They also specified hard cases to address: contested practices, biased testimony, unintended consequences of condemnation, and others. Crucially, they want explicit stop/escalation rules and a procedure that fits on two pages.

  Montaigne's usable moves include: his fundamental anti-ethnocentrism principle that we shouldn't judge others by our own standards; the wild/depraved distinction allowing respect without adoption; the non-relativistic core that cruelty/treachery are universally wrong; the reframing test comparing European equivalents; and source skepticism. Unusable elements include his state-of-nature idealism, reliance on single sources, and literary irony - these need replacement with concrete methods.

  For the procedure's structure, I'll build a five-step funnel: starting with source reliability checks, then practice reframing using the comparative test, followed by harm assessment with the wild/depraved distinction, community standing analysis, and finally consequence mapping. Each step needs clear ownership (who answers), sufficiency thresholds, timeouts, and fallback positions. The anthropologist takes lead on cultural framing, the regional officer on local dynamics, I handle harm/consequence synthesis, and the executive director gets value-locked decisions.

  The three test cases are perfect for pressure-testing: 16-year marriages at partner schools (tests consent vs. harm tradeoffs); possession healing with confinement/beating (tests outcome vs. method); and mortuary consumption (tests framing bias). I'll make sure the mortuary case forces an uncomfortable outcome where the panel's framing is the problem, per request.

  Limits to acknowledge: the procedure can't resolve metaphysical objectivity questions, can't define community membership authoritatively, struggles with intra-community tradeoffs, and avoids the political question of whether NGOs should intervene at all. I'll flag where judgment calls remain irreducible - particularly in harm categorization and when "accommodate with mitigation" tips into opposition.

  For the hard cases: the boarding school marriage gets "accommodate with mitigation" (fund scholarships for alternatives); the possession healing moves to "oppose privately" due to harm severity despite local respect; the mortuary rite forces "accommodate no action" while correcting the "cannibalism" misreporting - the uncomfortable outcome where we lose donor trust over our staff's framing error.
answer: |-
  ## Montaigne-Inspired Decision Procedure for NGO Practice Review

  **Ground Rules:**  
  1. **No jargon:** Plain language only.  
  2. **Time-bound:** Each step must conclude within 6 weeks.  
  3. **Ownership:** Specify who answers each question.  
  4. **Stop/Escalation:** Clear rules for ending or escalating.  
  5. **Handoffs:** Explicit handoff to human judgment when values, not facts, are in play.  

  **Step 1: Source & Frame Check**  
  *   **Who Answers:** Anthropologist (primary), Regional Officer (context).  
  *   **Question:** "Is our description of the practice framed by *our* assumptions? Redescribe it neutrally using terms we'd apply to an equivalent in our own society (e.g., feeding relatives = commemorative act; confinement = protective isolation). Does this redescription change how 'shocking' it seems?"  
  *   **Sufficient Answer:** A side-by-side comparison showing the original report and the redescription, noting any shift in perceived severity. Local partner staff must review this comparison.  
  *   **Can't Answer/Timeout (4 weeks):** Return case to field for reframing *with specific guidance* based on redescription attempt. If still unclear after 2 more weeks, **Accommodate with Mitigation** (default caution).  
  *   **Stop Rule:** If redescription eliminates major shock value (e.g., "cannibalism" becomes "mortuary communion"), **Accommodate, No Action**. Proceed if shock remains or harm is evident in redescription.

  **Step 2: Harm Assessment (The Wild/Depraved Test)**  
  *   **Who Answers:** Panel Chair (synthesizes inputs), Anthropologist (cultural intent), Regional Officer (local impact).  
  *   **Question:** "Does the practice involve *deliberate cruelty, treachery, or severe, non-consensual physical/psychological harm* (universal vice)? Or is it primarily *strange, unfamiliar, or based on different values* (the 'wild')?" Focus on the *type* of practice, not individual instances.  
  *   **Sufficient Answer:** Evidence addressing:  
      *   Intent (Is harm intended or a side-effect? Is deception core to it?)  
      *   Severity & Scale (Is significant harm inherent and frequent?)  
      *   Consent (Is meaningful consent possible/obtained within context? Crucial for contested practices).  
      *   *Explicitly check:* Could a functionally similar European practice (e.g., involuntary commitment, high-risk sports, extreme debt collection) look *worse* under honest description?  
  *   **Can't Answer/Timeout (3 weeks):** **Accommodate with Mitigation** (assume potential harm exists, proceed cautiously).  
  *   **Stop Rule:** If practice is "wild" (strange but no core cruelty/treachery/severe harm), **Accommodate, No Action**. If "depraved" (core cruelty/treachery/severe harm), proceed to Step 3. If harm is due to *rate/severity of tokens* (not type), proceed to Step 4 Mitigation design.

  **Step 3: Community Standing & Legitimacy**  
  *   **Who Answers:** Regional Officer (primary - networks), Anthropologist (social structures), Local Partner Staff (input).  
  *   **Question:** "Is this practice widely accepted or actively contested *within* the community? Who benefits? Who is harmed? Who genuinely speaks for the community (beyond formal authority)?"  
  *   **Sufficient Answer:** Evidence of internal debate, existence of alternatives, voices of those most affected (especially vulnerable groups). Acknowledge funding relationships bias testimony.  
  *   **Can't Answer/Timeout (3 weeks):** **Oppose Privately** (default to protect potentially vulnerable groups without public escalation).  
  *   **Stop Rule:** If practice is core, broadly accepted, and not "depraved," **Accommodate, No Action**. If contested, causes significant harm to a subgroup, or legitimacy is unclear despite "depraved" elements, proceed to Step 4.

  **Step 4: Consequence Mapping & Mitigation Design**  
  *   **Who Answers:** Panel Chair (lead), Regional Officer (local feasibility), Anthropologist (cultural feasibility).  
  *   **Question:** "What will likely happen if we: a) Do nothing? b) Mitigate? c) Oppose privately? d) Oppose publicly? e) Make it a funding condition? *Specifically consider:* Will public opposition make it an identity badge? Will withdrawal of services harm the vulnerable? Does local law ban it? (Note: Law indicates state view & risk, *not* automatic moral depravity)."  
  *   **Sufficient Answer:** A risk/benefit matrix for each option, focusing on impact on beneficiaries, staff safety, partner relations, and the practice itself.  
  *   **Can't Answer/Timeout (3 weeks):** **Oppose Privately** (default lower-risk action).  
  *   **Handoff:** **Executive Director (ED)** for final decision on Buckets 3-5 based on risk appetite and values. Panel recommends based on mapping.  
  *   **Escalation Rules (to ED):**  
      *   "Depraved" + Internally Contested --> Recommend **Oppose Privately/Publically**  
      *   Severe Harm + High Mitigation Feasibility --> Recommend **Accommodate with Mitigation**  
      *   "Depraved" + High Risk of Backfire --> Recommend **Oppose Privately** or **Condition Funding**  
      *   "Wild" + Significant Harm to Subgroup --> Recommend **Accommodate with Mitigation**  

  **Step 5: ED Decision & Implementation**  
  *   ED reviews Panel's analysis (Steps 1-4) and recommendation. Makes final Bucket decision.  
  *   Mitigation/Opposition plans developed *with* local partners where possible.

  ---

  **Limits & Judgment Calls:**  
  1.  **Objective Correctness?** No. This seeks *better* judgments by reducing bias, not perfect objectivity.  
  2.  **Defining "Community"?** Cannot be solved procedurally. Relies on Regional Officer/Anthropologist judgment.  
  3.  **Aggregating Harms/Benefits?** Cannot precisely balance. Step 3 identifies conflict; Step 4 weighs consequences; **ED makes the value call** on trade-offs.  
  4.  **Should We Be Here?** This procedure assumes the relationship is justified. It *cannot* answer that political question.  
  5.  **Irreducible Judgment Points:**  
      *   Step 2: Drawing the line between "wild" (tolerable difference) and "depraved" (intolerable harm). *No checklist replaces wisdom here.*  
      *   Step 4: Predicting consequences, especially backlash.  
      *   Step 4/ED Handoff: Weighing risks to beneficiaries vs. upholding principles.  

  **Montaigne's Frame Limits:**  
  *   **State of Nature:** Unusable. Replaced by the **Comparative Redescription Test (Step 1)** and **Harm Focus (Step 2)**.  
  *   **Single Eyewitness:** Explicitly countered by **Source Skepticism & Multiple Inputs (Steps 1 & 3)**.  
  *   **Literary Framing:** Replaced by **Structured Questions & Explicit Criteria**.  
  *   **Where it Fits:** Excellent for anti-projection, framing checks, harm focus, epistemic humility. Weak on power dynamics within communities – supplemented by **Community Standing Check (Step 3)**.  

  ---

  **Application to Cases:**

  1.  **Partner School - Marriage at 16 with Family Consent:**  
      *   *Step 1:* Redescription: "Legal marriage at age of majority with parental consent" (cf. many jurisdictions). Shock diminishes significantly. **Accommodate, No Action** likely here. *But...*  
      *   *Step 2:* Is it "depraved"? Lack of independent agency? Potential harm? Context matters (e.g., alternatives, education impact). *If* significant harm identified (e.g., evidence of coercion, high drop-out), proceed.  
      *   *Step 3:* Likely accepted within community context. Withdrawal harms girls (no school).  
      *   *Step 4:* Mitigation possible? (e.g., ensure genuine consent processes, offer life-skills support). Public opposition harms girls.  
      *   **Verdict: Accommodate with Mitigation** (e.g., strengthen consent safeguards, provide alternative pathways/support). *Not "No Action" due to potential agency concerns.* Withdrawal is worst outcome for girls.

  2.  **Healing Practice (Confinement/Beating for Possession):**  
      *   *Step 1:* Redescription: "Involuntary physical restraint and aversive stimuli administered by traditional healer for acute psychotic episode." Shock remains high. Proceed.  
      *   *Step 2:* **Depraved.** Involves non-consensual severe physical harm and restraint. Practitioner respect/recovery rates are *mitigating factors* but don't negate the core harm. Proceed.  
      *   *Step 3:* Likely contested internally (especially by those subjected). Practitioner respect indicates legitimacy for some, not all.  
      *   *Step 4:* Doing nothing accepts harm. Mitigation (e.g., reducing severity, ensuring medical backup) may be feasible *if* practitioner cooperates. Public opposition likely ineffective/harmful. Private opposition (via partners, health authorities) more viable. Condition funding? High risk of losing access/locals.  
      *   **Verdict: Oppose Privately** (work with partners/local health system to promote alternatives, reduce harm, support victims). *Panel won't like it* - it requires delicate work and challenges a respected figure, but "Accommodate" accepts severe harm.

  3.  **Mortuary Rite (Consuming Remains):**  
      *   *Step 1:* **CRITICAL.** Original Frame: "Cannibalism". Redescription: "Ritual consumption of minute symbolic portion of cremated remains of revered elder by close kin as act of communion and mourning." Shock largely evaporates; becomes comparable to relic veneration or specific Christian communion theologies. Field officer's framing *was* the problem.  
      *   *Step 2:* "Wild" (deeply unfamiliar symbolic act), not "depraved" (no cruelty, treachery, harm intended/inherent).  
      *   **Verdict: Accommodate, No Action.** *Panel/Donors won't like it:* Requires explaining to major donor why "cannibalism" was a misreporting, potentially damaging trust/funding. This directly addresses your requirement for an uncomfortable outcome centered on staff framing. Action: Correct the record internally and with the donor sensitively.
