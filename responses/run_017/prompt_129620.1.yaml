  Hmm, the user is a retired calibration expert from satellite radiometry with 30+ years experience, now evaluating medical predictive models. They've presented six case verdicts and want a unified fairness principle that explains their decisions. Key points:

  1. They value numerical integrity ("whether a number means what it says") - likely why they rejected case 2 where same score meant different risks depending on group.

  2. They distinguish between:
     - Legitimate risk differences (accepted age-based model in case 3)
     - Systemic bias (rejected access-skewed model in case 4)
     - Data quality issues (conditionally approved case 5)

  3. Their constraint #6 is crucial: any rule must generalize to unseen subgroups. This immediately disqualifies group-specific thresholds (like case 2's "fix") and many common fairness metrics.

  4. The unresolved case involves rank-ordering without scores - their calibration instincts don't apply here.

  Their rejections cluster around two core concerns:
  - When the model's internals misrepresent reality (cases 1,2,4)
  - When fixes create new misrepresentations (case 2)

  But they accept models where disparities reflect ground truth (case 3) or technical limitations (case 5). This suggests a principle about truthful measurement rather than outcome equality.

  The ranking problem is interesting - without probabilities, we can't check calibration. But their access concern from case 4 might still apply if systemic factors affect rankings. The principle should probably require that rankings reflect actual need, not confounding variables.

  For a stress test: consider a model predicting dialysis need where one group has systematically lower creatinine levels due to muscle mass differences. Even with perfect calibration, it might under-flag that group - similar to their case 4. Their principle should catch this.
answer: |-
  Here's a unified principle derived from your verdicts, designed to satisfy your constraint (#6) and explain your decisions. I'll state it precisely, map it to your cases, identify where it conflicts, and handle the ranking scenario.

  ### The Principle: **Causal Fidelity**
  *"A model's output must reflect the true causal relationship between observable inputs and the target outcome, without encoding systemic biases or non-causal group correlations as predictive features. When intervening on the model's output, the implied causal effect on the outcome must be group-invariant."*

  ### How It Explains Your Verdicts:
  1. **Deterioration Model (No):**  
     The 40% vs. 15% base rate difference likely stems from systemic factors (e.g., access disparities). The model *honestly* reflects these biases (calibrated scores) but **amplifies harm** by missing more deteriorations in the disadvantaged group. This violates causal fidelity: the model entrenches existing inequities by design, making the high-risk group *even worse off* relative to need.  
     *Clause: "Without encoding systemic biases as predictive features."*

  2. **Different Thresholds (No):**  
     Equalizing error rates by group-specific thresholds breaks calibration. A score of 0.3 now implies 40% risk for Group A and 70% for Group B. This **severs the causal link** between the score and the outcome, making the score meaningless. Your "different kind of wrong" is the violation of *causal fidelity*: the score no longer represents the same underlying risk process across groups.  
     *Clause: "The implied causal effect on the outcome must be group-invariant."*  
     *One objection, not two: The loss of meaning (calibration) enables arbitrary discrimination.*

  3. **Age-Based Model (Yes):**  
     Age directly causally influences surgical risk (biology). The model accurately captures this, and the disparity isn’t driven by systemic injustice.  
     *Clause: "True causal relationship between observable inputs and target outcome."*

  4. **Care Manager Model (No):**  
     The model uses utilization (effect) to proxy need (cause). Utilization is depressed in the disadvantaged group due to access barriers (non-causal confounder). The model mistakes *low access* for *low need*, violating fidelity.  
     *Clause: "Without encoding systemic biases or non-causal group correlations."*

  5. **Data Quality Issue (Yes, with conditions):**  
     Thin records reduce precision but don’t introduce bias. The model’s causal structure is sound; the issue is measurement noise. Your "data-quality failure" distinction holds because noise isn’t a *systemic distortion of causality*.  
     *Clause: The principle allows for non-systemic, non-causal errors (if addressed via conditions like improved data collection).*

  6. **Constraint (Generalization):**  
     Causal fidelity is **robust to unseen groups** because it focuses on universal causal mechanisms, not group-specific metrics. A model encoding real causality (e.g., biology) won’t fail catastrophically for unlisted subgroups. Conversely, a model relying on spurious correlations (e.g., zip code proxies for race) will fail when sliced new ways.  
     *This constraint favors causal fidelity over group-balancing rules (e.g., demographic parity).*

  ### The Conflict: You Must Overturn **Case #5**  
  - **Verdict to reverse:** Conditional approval of the data-thin records model.  
  - **Why:** If "fewer prior labs" correlates with systemic factors (e.g., underserved communities receive less testing), the model *does* encode bias. For example, if reduced testing frequency is causally linked to group identity (e.g., rural patients), the model’s uncertainty becomes a proxy for disadvantage. Causal fidelity requires investigating *why* records are thinner. If systemic, it’s unfairness; if random (e.g., hospital merging records), it’s data quality. You approved it without verifying causality.  

  ### Ranking-Only Tool (No Score):  
  - **What the rule says:** Ranking must reflect true need, not systemic barriers. If Group A is ranked lower despite equal need (e.g., due to historical underscreening), it violates fidelity.  
  - **All-or-nothing slots:** This exacerbates harm. If the top 50 slots go to 80% Group B (despite Group A being 33% of patients), check if:  
    - Group B has higher *actual need* → Accept (like your age case).  
    - Group A has equal need but worse data/access → Reject (like your care manager case).  
  - **Test:** Compare outcomes for patients *just above/below the cutoff* between groups. If Group A patients below cutoff have similar complication rates to Group B patients above it, the ranking is biased.  

  ### Stress-Test Case: **Genetic Risk Model**  
  - **Scenario:** A model predicts genetic disease risk using biomarkers. Group A has a 5x higher base rate due to ancestry. The model is calibrated, with equal FNR/FPR.  
  - **Causal Fidelity Says:** Accept. The disparity is biologically causal, not systemic bias.  
  - **Contrast with "Equal Outcomes":** An outcome-parity rule would wrongly demand equal prevalence or force false negatives in Group A.  

  ### Why This Works:  
  - **Precision:** Test by checking if the model’s predictions hold under causal interventions (e.g., "If we artificially equalize access, do predictions change?").  
  - **Handles #6:** Forces scrutiny of *why* disparities exist, not just whether they exist.  
  - **Limitation:** Requires domain knowledge to define "true causality" (but so does good calibration).  

  **Final Tally:**  
  - **Explains 1,2,3,4,6** directly.  
  - **Overturns 5** unless systemic causes are disproven.  
  - **Guides ranking** via causal need.  

  Your instinct centers on *what the instrument measures*. Causal fidelity formalizes that: a good instrument measures the signal, not the noise or the bias.
