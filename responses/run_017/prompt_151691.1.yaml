prompt: |-
  I clerk for the Franchise Commission of the Free City of Mirenne, a semi-autonomous port city where roughly one resident in six is not a citizen, and I have been going back and forth with a colleague about how the Commission should rule on a petition that is coming up next month. To make sense of it I need to reconstruct what rule the Commission has actually been running, because its record so far is consistent with several, and they come apart on this petition.

  The record, as I have it: in 2011 the Commission lowered the municipal voting age to sixteen, reasoning that sixteen-year-olds may work, pay local taxes, hold a tenancy with a guardian's countersignature, and are answerable under city by-laws; it declined at the same time to lower the age for national elections, and in 2020 it refused a petition for a voting age of fourteen on the ground that below sixteen political judgment is not yet formed independently of household and school. In 2016 it granted the municipal vote to non-citizens with at least five years of lawful residence and an indefinitely renewable permit, while refusing it to seasonal, employer-tied and short-term permit holders and to anyone short of five years' residence even where they paid local taxes and had children in city schools; it has never extended any franchise beyond municipal elections to non-citizens. On prisoners it has held that those on remand and those serving under two years keep the vote, while longer sentences suspend it, on the view that a serious and sustained breach of the terms on which the community admits someone to a share in its decisions can cost them that share. And in 2019 it recommended compulsory attendance at the polls for citizens aged eighteen to seventy-five — not compulsory choice: the ballot carries an explicit none-of-these-candidates line and blank or spoiled papers are recorded as abstentions — exempting residents over seventy-five, adults under plenary guardianship, and citizens who have lived abroad more than fifteen years and keep no property or pension in the city. When it enfranchised sixteen- and seventeen-year-olds it declined to compel them; when it enfranchised non-citizens it explicitly left the compulsion question open as not properly before it.

  The new petition asks the Commission to make attendance compulsory for the non-citizen municipal electorate created in 2016, on the same terms as for citizens: same administrative fine, same abstain option, same exemptions by age and capacity. The figures attached to the petition are these: turnout among that electorate was 74 per cent at the last municipal election, against 79 per cent for citizens overall and 61 per cent for citizens aged eighteen to twenty-nine; about half of them have been entitled to naturalize for years and have not applied, while most of the remainder cannot naturalize at all, since their state of origin forbids renunciation and Mirenne does not permit dual nationality. What I want from you is the following: set out the two or three rules that could jointly generate all four lines of precedent — some kind of two-tier view on which rights may reach beyond citizenship while the duties of membership may not, some kind of compulsion-follows-enfranchisement view with carve-outs for age and capacity, some kind of representativeness view keyed to turnout levels, or another you prefer — and say what each predicts about this petition and about the decliners-versus-ineligible split inside it; give your best guess with the reasons for preferring it; identify the closest analog among the Commission's own precedents; and if you think the record genuinely underdetermines the matter, name the further case that would settle it (I had been wondering whether the revealing one is a later petition to compel sixteen- and seventeen-year-olds now that their turnout has slid, but tell me if you think that case is unhelpfully ambiguous, and why), and say which principle the Commission would be committing itself to either way. Please keep it fairly tight and finish with a single machine-readable line: \answer{extend compulsion} or \answer{do not extend compulsion}.
reasoning: |-
  Hmm, the user is a clerk for the Franchise Commission in Mirenne, a semi-autonomous port city with a complex demographic makeup. They're trying to reconstruct the underlying principles behind the Commission's voting rights decisions to predict how they'll rule on a new petition about compulsory voting for non-citizens.

  The Commission's precedents show several patterns: 
  - They lowered the municipal voting age to 16 based on civic participation markers but rejected lowering it further. 
  - They granted municipal voting rights to non-citizens after 5 years of residence while excluding temporary residents. 
  - They maintained voting rights for prisoners serving under two years but suspended them for longer sentences. 
  - They implemented compulsory voting for citizens aged 18-75 with specific exemptions but excluded 16-17 year olds and left non-citizen compulsion undecided.

  The new petition wants to extend compulsory voting to the non-citizen municipal electorate. Turnout data shows 74% participation among this group compared to 79% overall citizen turnout and 61% for young citizens. About half could naturalize but haven't, while others can't due to dual nationality restrictions.

  I need to identify coherent principles that explain all precedents. The most consistent one seems to be that enfranchisement creates a duty to participate unless exempted by age or capacity. This would predict extending compulsion to non-citizens. The Commission has previously tied compulsion to enfranchisement status rather than citizenship status when it comes to obligations.

  The closest analog is actually the 2019 compulsory voting rules for citizens - the Commission established that once enfranchised, the duty to vote follows, with exemptions only for age/capacity. The non-citizen municipal voters are already enfranchised, so the same logic should apply.

  The record isn't perfectly clear - it could support a "duties of membership" view that restricts compulsion to citizens. But that seems inconsistent with how the Commission handled age-based exemptions. A representativeness view based on turnout would be too situational and not principled.

  The 16-17 year old compulsion petition would indeed be ambiguous - their exclusion from compulsion could be due to age/minority status rather than citizenship principles. A cleaner test would be whether the Commission would compel voting among non-citizens who naturalized after being enfranchised - that would isolate the citizenship question.

  Ultimately, the Commission seems committed to the principle that voting rights imply voting responsibilities, so they should extend compulsion to non-citizen municipal voters.
answer: |-
  Based on the Commission's precedents, two coherent principles emerge that jointly explain all rulings. A third "representativeness view" is less consistent.

  1.  **Principle of Conditional Community Membership (Rights):** Franchise rights extend beyond formal citizenship to those demonstrating substantial, settled integration into the local civic and economic fabric, measured by long-term residence, contribution (taxes), and stakeholding (e.g., children in schools). This explains:
      *   Enfranchising 16-17 y/o locals (taxpayers, subject to laws) for municipal elections (their primary community), but not nationally or younger teens (insufficient independence).
      *   Enfranchising non-citizens with 5+ years' indefinite residence (settled integration), but excluding short-term/tied permits (transient, lesser stake) and limiting to municipal level (local community).
      *   Denying prisoners serving >2 years (sustained breach of community norms costs share).

  2.  **Principle of Enfranchisement-Triggered Duty (Obligations):** Compulsory attendance is a duty tied directly to the *status of being enfranchised* for a particular election, subject only to exemptions based on age (minors/elderly), capacity (guardianship), or extreme disconnection (long-term abroad/no ties). This explains:
      *   Imposing compulsion on citizens 18-75 enfranchised for municipal/national elections.
      *   Explicitly *not* compelling 16-17 y/o when enfranchised (age/minority status exemption).
      *   Leaving compulsion for non-citizens "open" when enfranchised (not decided, but no inherent bar based on citizenship status implied).
      *   Exemptions based purely on age (>75), capacity (plenary guardianship), or disconnection (abroad 15+ years/no ties).

  **Predictions & Split:**
  *   **Conditional Community Membership (Rights):** Neutral/slightly against. The non-citizen group *already* meets the integration threshold for the *right* to vote municipally. Compulsion is an obligation, not a right extension.
  *   **Enfranchisement-Triggered Duty (Obligations):** Predicts **EXTEND COMPULSION**. The non-citizens are enfranchised municipal voters. The exemptions (age >75, capacity) apply equally. Citizenship status isn't a listed exemption trigger. The "decliners" (could naturalize) and "ineligible" (cannot naturalize) are *both* enfranchised municipal voters under the 2016 ruling – the principle focuses on their current voting status, not their citizenship potential or constraints.

  **Best Guess & Reason:**  
  **Extend compulsion.** The *Enfranchisement-Triggered Duty* principle is the most consistent and explicit thread regarding obligations. It directly links the duty to vote to the possession of the franchise for that election, with exemptions clearly delineated by age/capacity/disconnection, not citizenship. Applying compulsion only to citizens would create a new, unstated barrier inconsistent with the exemption logic applied to minors and the explicit openness on non-citizen compulsion in 2016. The turnout figures (74% vs 79% citizens) suggest practical feasibility, and the split between decliners and ineligible is irrelevant under this principle – both groups hold the franchise triggering the duty.

  **Closest Analog:**  
  The **2019 compulsory attendance ruling for citizens 18-75**. This established that enfranchisement triggers the compulsion duty, subject to specific exemptions. Extending this to non-citizen municipal voters applies the *same* duty-trigger logic to *another group already holding the municipal franchise*, using the *same* exemption criteria.

  **Underdetermination & Settling Case:**  
  The record is *not* genuinely underdetermined; the *Enfranchisement-Triggered Duty* principle provides the clearest fit. However, the **later petition to compel 16-17 year-olds** *is* ambiguous and unhelpful for this specific question. A ruling either way could be justified by their age/minority status alone (the existing exemption), not by citizenship principles. It wouldn't clarify if citizenship is a separate barrier to compulsion.  
  The **revealing case** would be a petition concerning **naturalized citizens who were previously enfranchised non-citizen municipal voters**: Would the Commission view their period of *enfranchised but non-citizen voting* as subject to compulsion retroactively, or only upon citizenship? A "no" would suggest citizenship *is* required for the duty, undermining the enfranchisement-trigger principle. A "yes" would confirm that the franchise status, not citizenship, triggers the duty, solidifying the principle supporting the current petition.

  **Commission Commitment:**  
  Granting the petition commits to **Enfranchisement-Triggered Duty** as the core principle for voting obligations. Denying it commits to a new, unstated principle that **Formal Citizenship is a Prerequisite for Voting Duties**, even when franchise rights are granted, which would be inconsistent with the exemption structure and the 2016 openness.

  \answer{extend compulsion}
