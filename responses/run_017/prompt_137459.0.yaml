prompt: |-
  My lab has started reporting self-consistency numbers on evals: sample the model k times at temperature 0.8, take the most common answer, report that. One guy on the team insists this is literally an instance of the Condorcet jury theorem — each sample is a voter with competence p > 1/2, the votes are independent, so majority accuracy goes to 1 as k grows, and we can pick k the way youd size a jury. He also wants to weight samples by the models own confidence score, on the grounds that better voters should count more; that bit i think is importing something the theorem doesnt say, since the version i know is equal-weight majority over voters with the same p.

  Can you audit the analogy? Give me the correspondence table — what plays the role of the voter, of p, of independence, of the binary proposition, of the truth — and then the places the mapping breaks. The ones i care about: our votes come out of one model with shared weights and shared pretraining, so they have a common cause (is that like a jury with a shared bias, and how much correlation does the theorem tolerate before the result stops holding?); the theorem is binary but our majority is over an open answer space, or over 4–5 options when its multiple choice (does the guarantee weaken as options multiply, and in what way?); and p is a property of voters, whereas what we vary is the *question* — on the hard items wed actually bother running this on, per-sample accuracy could be under half, and then majority makes things worse. In practice our gains flatten out around k = 5, which seems to tell against the asymptotic story.

  Then: does the conclusion he wants — its not a hack, its asymptotically justified, we can buy accuracy with compute — survive, or was the analogy carrying it? And if theres a better thing to compare k samples to than k jurors, say what. Please separate whats just the mathematics under stated assumptions from whats genuinely contested among people who work on this.
reasoning: |-
  Okay, the user is asking about the Condorcet jury theorem and how it applies to their lab's self-consistency evaluation method. Let me start by recalling what the theorem states. The Condorcet theorem says that if each juror has a competence greater than 0.5 and votes independently, majority voting accuracy increases with the number of jurors, approaching 1 as the jury size grows.

  Now, the user's team is sampling a model k times at temperature 0.8 and taking the most common answer. Their colleague claims this is like the jury theorem, with each sample being a voter. But the user has several concerns. First, the samples come from the same model with shared weights and pretraining. This introduces a common cause, which might break the independence assumption. How does correlation affect the theorem? I remember that even small correlations can significantly reduce the asymptotic accuracy. Studies show that correlated voters need much larger groups to achieve the same confidence, and the upper bound on accuracy drops below 1. That's a key point to mention.

  Next, the theorem is binary, but their tasks have multiple choices. The user mentioned 4-5 options. With more options, the chance of a correct majority decreases unless the model's per-option accuracy is high. The user noted that on hard questions, per-sample accuracy might be below 50%, which would make majority voting harmful. The Condorcet theorem requires p > 0.5, so if p < 0.5, increasing k worsens accuracy. That's a critical flaw in the analogy, especially for difficult items.

  The user also mentioned that gains flatten around k=5. That suggests diminishing returns, which contradicts the asymptotic improvement. This could be due to correlations, low p on hard questions, or the multiple-choice effect. They need to consider that increasing k beyond a point doesn't help much, maybe because of these factors.

  The colleague wants to weight samples by confidence scores. The standard theorem assumes equal competence, so weighting could help if confidence correlates with accuracy. But if confidence is miscalibrated, it might hurt. There's research on weighted voting, but it's more complex and requires well-calibrated weights.

  The user's deeper needs: They want to validate if their method is theoretically sound or just a heuristic. They might be concerned about resource allocation—running k samples costs compute. If k=5 is sufficient, pushing for more isn't efficient. They also need to justify their approach in reports or papers, so clarifying the limitations is important.

  I should structure the response by mapping each element of the theorem to their setup, then break down where the analogy fails. Highlight independence, p > 0.5 requirement, multiple choices, and the flattening gains. Emphasize that while the theorem's conclusion doesn't fully hold, self-consistency can still be practical, just not asymptotically guaranteed. Suggest alternatives like ensemble methods and stress the importance of per-question p estimation.

  Also, note that the colleague's confidence weighting isn't part of the original theorem. If their model's confidence scores are accurate, weighting might help, but it's an extra assumption. The user should test if confidence correlates with correctness in their case.

  In summary, the analogy is useful but overstates the guarantees. The real-world constraints—correlation, low p on hard items, multiple choices—mean that increasing k has limits. The gains they see at k=5 are practical, but asymptotic improvement isn't realistic. They should present self-consistency as a heuristic with empirical support, not a theoretically optimal method.
answer: |-
  Here's a breakdown of the Condorcet Jury Theorem (CJT) analogy for self-consistency sampling, including the correspondence, where it breaks, and the implications for your lab's approach.

  **Condorcet Jury Theorem (Classic Version - Simplified)**
  *   **Binary Proposition:** There is a single, objective, *correct* answer (True/False).
  *   **Voters:** `k` independent jurors.
  *   **Competence (p):** Each juror has an identical probability `p > 0.5` of voting correctly. `p` is the same for all jurors.
  *   **Independence:** Jurors' votes are statistically independent.
  *   **Truth:** The objectively correct answer exists and is known (to the theorem's perspective).
  *   **Voting Rule:** Simple majority vote.
  *   **Conclusion:** As `k` increases, the probability that the majority vote is correct approaches 1.

  **Correspondence Table (The Proposed Analogy)**

  | CJT Concept          | Self-Consistency Sampling Analogy                          |
  | :------------------- | :--------------------------------------------------------- |
  | **Binary Proposition** | The *correct* answer for a given evaluation item.          |
  | **Voters**           | `k` independent *samples* (outputs) from the model.        |
  | **Competence (p)**   | The *probability* that a *single sample* is correct.       |
  | **Independence**     | Statistical independence between the `k` samples.          |
  | **Truth**            | The ground-truth correct answer for the item.              |
  | **Voting Rule**      | Take the most frequent answer (Plurality vote / Mode).     |
  | **Conclusion**       | Accuracy of the most frequent answer → 1 as `k` → ∞.      |

  **Where the Mapping Breaks (The Critical Problems)**

  1.  **Violation of Independence (The Common Cause Problem):**
      *   **Issue:** The `k` samples are generated by the *same model instance* with *shared weights*, *shared architecture*, and *shared pre-training data*. They are *conditionally dependent* given the prompt/question and model parameters.
      *   **Effect on CJT:** The CJT's convergence guarantee **collapses completely** with even small amounts of positive correlation. Instead of accuracy → 1, it converges to a value **strictly less than 1** (often significantly less). The higher the correlation between samples, the lower this asymptotic accuracy ceiling. Think of it like a jury exposed to the same biased news source – their errors become correlated.
      *   **Research Context:** This is well-established. The CJT is highly sensitive to violations of independence. Your concern about a "common cause" is precisely the source of this positive correlation. Empirical studies of LLM self-consistency often show significant correlation between samples, especially on challenging items.

  2.  **Non-Binary Choice Space:**
      *   **Issue:** Real-world tasks often have an open-ended answer space or multiple-choice with >2 plausible options (e.g., 4-5). The CJT assumes exactly two choices.
      *   **Effect on CJT:** The guarantee disappears. A plurality vote (most frequent) is not equivalent to a majority vote (>50%). For `m` options:
          *   The chance of a random sample being correct (`p`) needs to be significantly higher than `1/m` for plurality voting to be beneficial as `k` increases, especially if incorrect answers are numerous or similarly probable.
          *   The CJT's clean convergence proof doesn't extend directly. Generalizations exist (e.g., Condorcet extensions for multiple options using ranking or pairwise comparisons), but they require stronger assumptions (like voters ranking options correctly with p>0.5 in pairwise matchups) that don't map cleanly to LLM sampling.
      *   **Research Context:** Using plurality voting over multiple choices is common practice in self-consistency, but its theoretical justification is primarily empirical ("it often works") rather than a direct consequence of the binary CJT. Convergence guarantees for plurality voting in multi-choice settings are weaker and depend heavily on the distribution of correctness probabilities across options.

  3.  **Variable and Potentially Low `p`:**
      *   **Issue:** `p` (single-sample accuracy) is **not** fixed and identical across "voters" (samples) in the CJT sense.
          *   `p` is fundamentally a property of the *question* + *model* + *sampling temperature*. Crucially, for the "hard items" you focus on, `p` is likely **below 0.5**.
          *   If `p < 0.5`, the CJT tells us that the *opposite* happens: majority vote accuracy **decreases** towards 0 as `k` increases! Your intuition is correct – on hard items where the model struggles (<50% single-sample accuracy), taking more samples and using the mode can actively *harm* accuracy.
      *   **Effect on CJT:** The core assumption `p > 0.5` is violated for the very items where you use self-consistency. The CJT conclusion is inverted (`p < 0.5` → majority failure) or undefined (`p = 0.5`). There is no single `p` characterizing all "voters" for a given question; the underlying probability distribution is complex.
      *   **Research Context:** This is a major point of divergence. Self-consistency's effectiveness relies heavily on `p > 0.5` *for the specific question*. Benchmark averages can mask this; gains come from items where `p > 0.5`, while losses occur where `p < 0.5`. Good self-consistency requires `p > 0.5` on the target items.

  4.  **Asymptotic Behavior vs. Practical Flattening:**
      *   **Issue:** Your observation that gains flatten around `k=5` directly contradicts the asymptotic (`k` → ∞) guarantee of the CJT, even if independence held.
      *   **Why it Happens:** This is *exactly* the consequence of the violations above:
          *   **Correlation:** Correlated errors prevent the "swamping" of errors needed for asymptotic convergence. Gains diminish rapidly.
          *   **Low/Question-Dependent `p`:** On hard items (`p < 0.5`), increasing `k` harms accuracy. On items where `p` is only slightly >0.5 or the error modes are correlated, convergence is slow and hits a low ceiling.
          *   **Multiple Choices:** Achieving a reliable plurality with low `p` and many options requires much larger `k` than a binary majority.
      *   **Research Context:** The flattening around small `k` (often 5-40) is a consistently observed empirical result in LLM self-consistency research. It strongly suggests the asymptotic CJT regime is irrelevant for practical LLM use due to the violations.

  **Weighting by Confidence Scores:**
  *   **Analogy Break:** The classic CJT assumes equal competence (`p`). Weighting voters differently is *not* part of the standard theorem.
  *   **Potential Justification:** If the model's *confidence score* for a sample is well-calibrated and correlates strongly with the *probability that that specific sample is correct*, then weighting samples by confidence *could* improve the aggregated result compared to an unweighted plurality. This leverages the idea that some "voters" (samples) are more reliable than others.
  *   **Major Caveats:**
      1.  LLM confidence scores (e.g., token probabilities) are often poorly calibrated, especially under sampling. High confidence ≠ high correctness probability.
      2.  Weighting introduces additional complexity and assumptions. It's no longer a pure CJT analogy but rather a heuristic extension.
      3.  The theoretical guarantees for weighted voting under correlation and varying `p` are even more complex and less robust than the (already fragile) unweighted CJT case.

  **Does the Conclusion Survive?**

  *   **"It's not a hack, it's asymptotically justified":** **No, this conclusion does not survive.** The analogy to the CJT is deeply flawed due to the violations of independence, the multi-choice nature, and critically, the fact that `p` is question-dependent and often <0.5 on hard items. The observed flattening confirms the asymptotic story is irrelevant. Self-consistency *is*, in practice, a useful heuristic, but **not** because of the CJT's asymptotic guarantee.
  *   **"We can buy accuracy with compute" (as k→∞):** **No.** While increasing `k` *can* improve accuracy up to a point (`k=5` in your case) *on items where `p > 0.5`*, the gains rapidly diminish due to correlation and the non-asymptotic nature of practical `k`. Crucially, on items where `p < 0.5` (the hard ones), increasing `k` *reduces* accuracy. You cannot reliably "buy" arbitrarily high accuracy with more compute via this method. There's a point of diminishing returns, and beyond that, it's wasteful or harmful.

  **A Better Analogy/Framework**

  1.  **Ensemble of Weakly Diverse Models:** Self-consistency is best understood as creating a **weak ensemble** from a *single* model via stochastic sampling. The goal is to generate *diverse* candidate answers and aggregate them.
      *   **Strengths:** Highlights the benefit of diversity (capturing different reasoning paths).
      *   **Weaknesses:** Diversity is limited by the single model's knowledge/biases; outputs are correlated; aggregation (simple plurality) is crude.
  2.  **Approximate Bayesian Model Averaging (Under a Flawed Model):** Sampling can be seen as approximating the posterior predictive distribution of the LLM over answers. Taking the mode is finding the MAP (Maximum A Posteriori) estimate.
      *   **Strengths:** Connects to a principled statistical framework.
      *   **Weaknesses:** LLMs are not true probabilistic models of the world; the "prior" (model weights) is fixed and potentially flawed/misaligned; the mode might not be the best summary for the task; correlation violates sampling assumptions.
  3.  **Empirical Heuristic:** Ultimately, self-consistency works well *in practice* on many benchmarks because:
      *   For many items, `p > 0.5`.
      *   Sampling at T>0 introduces *some* diversity, reducing the chance of consistently repeating the same error.
      *   Plurality voting is simple and often sufficient to correct random errors when `p` is reasonably high and errors aren't perfectly correlated.
      *   **The key is recognizing its empirical nature and limitations**, not forcing a CJT justification.

  **Recommendations for Your Lab:**

  1.  **Acknowledge the Analogy's Limits:** Frame self-consistency as a valuable empirical technique for boosting accuracy by aggregating diverse samples, not as an instance of the CJT with its asymptotic guarantees.
  2.  **Contextualize `k` Selection:** Choosing `k` (e.g., 5) is based on **empirical observation** of diminishing returns and cost/benefit trade-offs, *not* on sizing a theoretically optimal jury. Larger `k` helps more on items with lower `p` (but still >0.5) or higher ambiguity, but only up to a point.
  3.  **Investigate Confidence Weighting Empirically:** Test if weighting by confidence *consistently improves results* on your specific tasks and model. Don't assume it helps; it might hurt if confidence is poorly calibrated.
  4.  **Monitor Per-Item `p`:** Be acutely aware that self-consistency's benefit depends on single-sample accuracy (`p`) being >0.5 for the target item. It can be detrimental on very hard items. Consider estimating `p` (e.g., via small `k` runs) for different item types.
  5.  **Report Realistically:** Report self-consistency gains as the observed empirical improvement over a single sample (`k=1`) at your chosen `k` (e.g., `k=5`), not as evidence of approaching perfect accuracy.

  The CJT analogy provides an intuitive *starting point*, but its core assumptions are violated in ways that invalidate its main conclusion for LLM self-consistency. The method's success is heuristic, grounded in practical utility, not asymptotic theory.
