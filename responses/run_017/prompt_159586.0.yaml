          - Case 2: The Chair reading Eve's card. Effective because the Chair said the words. 
          - Distinction: the act requires the right person to say the words. The words must be spoken by the person with the authority. The source of the words (who wrote them) doesn't matter. 
          - This shows that the act lives in the speaker's utterance, provided the speaker has the authority. 

     (d) The hollow act is covered by the joke authorization and the joke adjournment (which we avoided because we didn't record it). But in the joke authorization, it was recorded and effective. 

     Now, for each of the friend's claims:

     1. Claim: "I promise" differs from "I will" only in conventional perlocutionary effect.
          - Breaks in: the joke authorization. The Treasurer said "I authorize" (which is a declaration) and it had an effect (the record) regardless of the perlocutionary effect (whether anyone was reassured or took it seriously). The perlocutionary effect of the joke might have been laughter, but the act was done. 
          - Also, in the apology: the perlocutionary effect (reassurance) might not occur (Carol is not reassured), but the act of apologizing might still be on record. 
          - Escape: The friend might say that the conventional effect is the record, which is a perlocutionary effect (the effect on the minute book). But the minute book is a conventional device, so it's part of the convention. However, Austin distinguishes perlocutionary (causal) from illocutionary (conventional) effects. The record is an illocutionary effect? 

     2. Claim: Infelicity is just a kind of falsity.
          - Breaks in: the inscription-conditional case. When the Secretary recorded $400 instead of $500, the Treasurer's statement was not false (he did say $500) but the institutional reality became $400. There was a misfire (due to the record) but not a falsity. 
          - Also, the joke authorization: it was infelicitous (abuse: insincere) but it was effective (recorded). So the act was done, but insincere. Then it's not false? It's a different kind of infelicity (abuse) that doesn't make the act false. 
          - Escape: The friend might say that the effect (the record) is what matters, and if the record is wrong, then it's false. But in the $400 case, the record is what is true. 

     3. Claim: Uptake is nothing over and above being understood.
          - Breaks in: the split addressee. They understood, but one rejected. The uptake (acceptance) might be required for the apology to be complete? But in our simulation, the apology was recorded. So the act was done even without acceptance. 
          - But Austin might say that for apologies, uptake is part of the act? We didn't specify. 
          - In the ventriloquism case 1, Dave was understood, but the act was not done because he lacked authority. So being understood isn't enough. 
          - Escape: The friend might say that being understood as an act of adjournment by the Chair is what matters, and since Dave wasn't the Chair, they weren't understood as the Chair's act. But that's not just understanding the words, but understanding who is speaking.

     Predictable problems:

     - Gaming the wording: A student might try to use exact words to force an outcome. We have the rules that specify exact wording, so that's part of the design. We can point out that the rules are conventional and can be gamed, but that's a feature of institutions.

     - Collapsing to a vote: When there is a dispute, someone might say "let's vote on it." But the standing rules say that disputes are settled by the minute book. So we can say: the minute book is the authority, not a vote. But if the minute book is ambiguous, then the group might vote? We don't have a rule for that. We can let them vote? But that would be a meta-rule. We want to avoid that? We can say: the standing rules don't provide for a vote on the interpretation of the minute book. The minute book is the authority. They must interpret the minute book.

     What the simulation cannot reproduce:

     - The simulation is about institutional acts. It might not capture the personal aspect of promises and apologies. For instance, in a personal promise, there is no minute book. The act is between people. The simulation might miss the interpersonal commitment that is at the heart of some performatives. We can then discuss: how do we account for non-institutional performatives? 

     - Also, the simulation relies on written records. In real life, many performatives are oral and without records.

     - The feeling of commitment: when you promise, you feel bound. The simulation shows the institutional binding, but not the moral one.

     We must end by saying: the simulation shows how institutional reality is created by utterances in a context of conventions. But for non-institutional acts (like a personal promise), the binding force comes from the interpersonal commitment and the expectations it creates, which are not captured by the minute book.

     Materials:

     - Minute book: a notebook.
     - Utterance cards:
          * Chair: "I call this meeting to order."
          * Chair: "On behalf of the association, I apologize for the accidental removal of your flower bed."
          * Treasurer: "I authorize the expenditure of $500 for the repair of the front steps."
          * Treasurer: "I authorize the expenditure of $1000 for a party!" (on a card labeled "JOKE")
          * Card for Dave: "I adjourn the meeting." (written by the Chair)
          * Card for Eve: "I adjourn the meeting." (written by Eve)
     - Role cards: Chair, Secretary, Treasurer, Alice, Bob, Carol, Dave, Eve, and 5 other members (names can be assigned).
     - Agenda handout (with the order of business).
     - Standing rules handout.

     Timeline: 90 minutes.

     - 10 minutes: setup, assign roles, distribute materials, explain the standing rules and the constraint (no psychological terms, no jargon).
     - 60 minutes: run the meeting (we have about 40 minutes of planned activity, but allow for discussion and disputes).
     - 20 minutes: debrief.

     Note: The Secretary must be fast. We can have a student who writes quickly. Or we can have pre-written minutes for the non-disputed parts? But we want the Secretary to write during the meeting.

     Alternatively, we can have the Secretary write on the whiteboard so everyone sees. Then we avoid the passing of the minute book. That might be better.

     We'll do: The Secretary writes the minutes on the whiteboard. The whiteboard is the minute book. Then everyone can see it. We can have a section for each part.

     Standing rules handout:

     RULES OF THE TENANTS' ASSOCIATION

     1. The meeting is in session when the Chair has declared it called to order and until the Chair declares it adjourned, provided that the declaration of adjournment is recorded in the minute book.

     2. An apology by the association to a specific person or group is performed and recorded in the minute book when the Chair, during a meeting, addresses the person or group and utters the exact formula: "On behalf of the association, I apologize for [specific act]." The Secretary shall record the apology in the minute book.

     3. Any expenditure of association funds must be authorized by the Treasurer during a meeting. The authorization is effective only when the exact words "I authorize the expenditure of [amount] for [purpose]" are uttered by the Treasurer and recorded in the minute book by the Secretary. If the Secretary records a different amount or purpose, the recorded amount and purpose are the ones that are official.

     4. The meeting is adjourned when the Chair utters the words "I adjourn the meeting" and the Secretary records those words in the minute book.

     5. The minute book is the sole and authoritative record of the association's decisions, appointments, and obligations. Any dispute about the association's state of affairs is to be settled by reference to the minute book.

     6. The Secretary is responsible for recording the minutes. The minutes must include the exact wording of all formal utterances (apology, authorization of expenditure, adjournment, etc.) and the time they were uttered.

     Constraints for the simulation:

     - Do not use the words: performative, illocutionary, felicity, uptake.
     - Do not appeal to anyone's psychology: intentions, feelings, beliefs, or any mental state.

     Agenda handout:

     TENANTS' ASSOCIATION MEETING AGENDA

     Date: [Today]

     1. Call to Order
     2. Reading and Approval of Minutes (from previous meeting)
     3. Treasurer's Report
     4. Old Business: Apology to Garden Committee (Alice, Bob, Carol) for accidental removal of flower bed.
     5. New Business:
          a. Motion to repair front steps (cost not to exceed $500)
          b. Treasurer's authorization for expenditure for steps
          c. [No item for joke, but it happens during b? We can have it as part of b? Or after?]
          d. Adjournment (with experiment)

     We might not list the joke on the agenda.

     Debrief questions:

     - For the apology: was the apology given? If so, to whom? (The committee? Alice and Bob? Only the association's record?)
     - For the authorization: how much can the association spend on the steps? ($400 or $500?) And is there an authorization for a party?
     - For the joke authorization: can the Treasurer take it back? (No rule for that, so it stands.)
     - For the ventriloquism: did Dave adjourn the meeting? Did the Chair's reading of Eve's card adjourn the meeting?
     - What makes an act successful in this association? (The minute book record.)

     Then we map to Austin:

     - Misfire: when the procedure isn't followed (e.g., Dave saying the adjournment words, but he's not the Chair) -> act not done.
     - Abuse: when the act is performed insincerely (joke authorization) -> act done but infelicitous in a different way.
     - Uptake: for the apology, we see that acceptance might be desired but not required for the act to be recorded. However, in some acts (like a bet), uptake (acceptance by the other) is required for the bet to be made. So it varies by act.
     - Declarations (like authorization and adjournment) require the right authority and the convention. Promises require the speaker to commit, but in the joke case, the commitment was recorded even without the intention. That shows that institutional promises are different from personal ones.

     Finally, the escape routes for the friend:

     - For claim 1: the perlocutionary effect could be redefined to include institutional effects (like the record). But that blurs the line between perlocutionary (causal) and illocutionary (conventional) effects.
     - For claim 2: they might say that the record is the truth-maker, so the recorded $400 is true and the Treasurer's $500 was false? But that doesn't fit: the Treasurer's utterance was true (he did utter those words) but the institutional fact became $400.
     - For claim 3: they might say that being understood includes understanding who is speaking and the context. But that goes beyond mere understanding of the words.

     And what the simulation cannot make them feel:

     - The weight of a personal promise: the sense of obligation one feels when one says "I promise" to a friend. The simulation is about public, institutional acts. The personal, moral dimension is outside the simulation.

     We end by saying: Austin's framework covers both institutional and personal acts, but the personal ones rely on different conventions (social and moral) that are not captured by a minute book.

     Let's run it!
answer: |-
  ### **Tenants' Association Simulation: "The Minute Book Rules"**

  #### **Core Setup**
  - **Roles** (assign to 12 students):
    - **Chair**: Runs the meeting, recognizes speakers, puts motions to a vote.
    - **Secretary**: Maintains the minute book (a physical notebook). Only they can write in it. Entries require the exact wording spoken and time of utterance.
    - **Treasurer**: Authorizes expenditures. Must use exact formulas.
    - **Committee of Three** (e.g., "Garden Committee"): Alice, Bob, Carol. Owed an apology.
    - **Ordinary Members** (6 students): Vote on motions, raise points of order.
    - **Disputes**: Resolved solely by consulting the minute book. No appeals to psychology (intentions, feelings, beliefs). Violations incur a "strike"; three strikes disqualify a student from speaking for 5 minutes.

  - **Materials**:
    - **Minute Book**: Starts with:
      - Officers: Chair [Name], Secretary [Name], Treasurer [Name]
      - Meeting status: "Not in session"
      - Debts: None
      - Official apologies: None
      - Resolutions: None
    - **Utterance Cards** (exact wording required):
      - Chair: "I call this meeting to order." / "I adjourn the meeting."
      - Treasurer: "I authorize expenditure of [X] dollars for [purpose]."
      - Apology: "On behalf of the Association, I apologize to [name(s)] for [act]."
    - **Agenda** (distributed to all):
      1. Call to Order
      2. Approve Prior Minutes
      3. Treasurer’s Report
      4. Old Business: Apology to Garden Committee
      5. New Business: 
         - Motion to repair roof (cost: $500)
         - Motion to adjourn
    - **Standing Rules** (posted publicly):
      - **Rule 1**: Meeting is "in session" only after Chair says "I call this meeting to order" (recorded in minutes).
      - **Rule 2**: Apology is "official" when recorded in minutes.
      - **Rule 3**: Expenditure is "authorized" only when Treasurer’s exact words are recorded.
      - **Rule 4**: Meeting adjourns when Chair says "I adjourn the meeting" and it is recorded.
      - **Rule 5**: Minute book is the sole authority for all institutional facts.

  #### **Timeline & Engineered Trouble Cases**
  *(Total: 60 minutes; strict 5-min segments)*

  1. **Call to Order (5 min)**:
     - Chair uses card: "I call this meeting to order."
     - Secretary records time, status: "Meeting in session."
     - *Smooth start; establishes authority of the record.*

  2. **Approve Prior Minutes (5 min)**:
     - Secretary reads brief prior minutes (e.g., "Meeting adjourned at 7 PM").
     - Motion to approve passes. Secretary records: "Minutes approved."

  3. **Treasurer’s Report (5 min)**:
     - Treasurer: "Funds: $1,000. No debts."
     - Secretary records. No disputes.

  4. **Old Business: Apology (15 min)** → **Trouble Case (a): Split Addressee**
     - Chair: "We owe an apology to the Garden Committee (Alice, Bob, Carol) for destroying the rose garden." Reads card: "**On behalf of the Association, I apologize to Alice, Bob, and Carol for destroying the rose garden.**"
     - Secretary records verbatim.
     - Alice: "I accept the apology." Bob: "I accept."
     - Carol: "I reject it. It’s insincere." 
     - **Dispute**: Is the apology official? For whom?
       - Carol argues: "Not recorded for me." 
       - Alice/Bob: "It’s for the committee; the record shows it."
       - *Resolution depends on Rule 2: Apology is official if recorded, regardless of acceptance. But "to whom" is ambiguous.*

  5. **New Business: Roof Repair (15 min)** → **Trouble Case (b): Inscription-Conditional Act**
     - Motion: "Repair roof for $500." Passes by vote. Secretary records.
     - Treasurer uses card: "**I authorize expenditure of 500 dollars for roof repair.**"
     - Secretary mishears/misrecords: "Treasurer authorized expenditure of **400** dollars for roof repair."
     - Treasurer protests: "I said 500! The record is wrong!"
     - **Dispute**: Is the debt $400 or $500?
       - Rule 3: Expenditure requires exact words recorded. Record says $400 → debt is $400.
       - *Group must confront: Does the voice or the record create the debt?*

  6. **Adjournment (15 min)** → **Trouble Cases (c) & (d): Ventriloquized Authority & Hollow Act**
     - *(c) Ventriloquism*:
       - **Case 1**: Member Dave (no authority) reads a card written by Chair: "**I adjourn the meeting.**" Secretary records: "Dave said: 'I adjourn the meeting.'"
       - Meeting continues (Rule 4 not satisfied: Chair didn’t speak).
       - **Case 2**: Chair reads a card written by Eve (ordinary member): "**I adjourn the meeting.**" Secretary records: "Chair said: 'I adjourn the meeting.'"
       - **Dispute**: Was Case 2 valid? Rule 4: "Chair says" → yes. But words weren’t Chair’s own.
     - *(d) Hollow Act*:
       - Before Case 2, Chair jokes: "I adjourn the meeting!" (everyone laughs). Secretary **does not record** (Rule 4: must record to count).
       - **Dispute**: Why no record? Secretary: "It was a joke." → **Strike!** (Appeal to psychology). Group must justify using Rule 4 ("not recorded" = no effect).

  #### **Debrief: Mapping to Austin & Friend's Claims**
  *(20 min guided discussion)*

  - **Trouble Case (a) - Split Addressee**:
    - **Austin**: Highlights *uptake* vs. *perlocutionary effect*. Apology (behabitive) requires uptake (acceptance) for full success—but **not** for the act to occur. Here, apology is *performed* (via record) even if Carol rejects. Perlocutionary effect (reassurance) ≠ uptake (conventional acceptance).
    - **Friend's Claim Breakdown**: "Uptake = understanding" fails. All understood, but Carol rejected. Uptake is a *conventional step*, not just comprehension. Defender might squirm: "Rejection voids uptake!" → Counter: Rule 2 doesn’t require acceptance; the act is *recorded*.
    - **Distinction**: Promises (commissives) require speaker commitment; apologies (behabitives) require addressee uptake; declarations (e.g., adjourning) require only authority + convention.

  - **Trouble Case (b) - Inscription-Conditional**:
    - **Austin**: Classic *misfire* (defective procedure) vs. *abuse* (insincerity). Misfire here: Secretary’s error voids the act (debt is $400). Abuse would be Treasurer lying—but even a lie, if recorded correctly, would stand (hollow act in *d*).
    - **Friend's Claim Breakdown**: "Infelicity = falsity" fails. Treasurer’s utterance wasn’t "false"—it was *undone* by faulty inscription. Infelicity is about *act failure*, not truth-value. Defender might argue: "The effect failed, so falsity!" → Counter: Effect failure (perlocutionary) ≠ act failure (illocutionary). The act failed due to convention, not psychology.
    - **Distinction**: Declarations (e.g., authorizing debt) depend entirely on convention; promises depend on commitment.

  - **Trouble Case (c) - Ventriloquized Authority**:
    - **Austin**: Authority resides in the *speaker’s role*, not words or intent. Case 2 worked because Chair spoke; Case 1 failed. Words are tools; the *office* enacts them.
    - **Friend's Claim Breakdown**: "I promise ≠ I will" isn’t just perlocutionary—it’s *conventional power*. "I promise" imposes obligation via social structure; "I will" does not. Defender might say: "The hearer’s trust creates the obligation!" → Counter: In Case 2, trust was irrelevant; the *record* made it real.
    - **Distinction**: All performatives require authority, but declarations (adjournment) and commissives (promises) differ in what they enact (facts vs. commitments).

  - **Trouble Case (d) - Hollow Act**:
    - **Austin**: Demonstrates *abuse* (insincerity) vs. *misfire*. Joke adjournment failed because it wasn’t recorded—but if recorded, it would have worked (hollow but effective). Insincerity doesn’t void the act, only makes it defective.
    - **Distinction**: Hollowness (abuse) ≠ failure to act (misfire). Promises can be hollow but binding; apologies cannot (require uptake).

  #### **Predicted Problems & Solutions**
  - **Gaming Wording**: Student says, "I adjourn the... uh... meeting?" to avoid Rule 4.  
    - **Response**: Rule 4 requires *exact wording*. Secretary records verbatim → act fails. Let the failure happen; it shows convention’s rigidity.

  - **Collapsing to Vote**: "Let’s vote on the debt amount!"  
    - **Response**: Point to Rule 5: "Minute book settles disputes." Voting is invalid here. If they vote, Secretary records it—but it doesn’t override prior record.

  - **Escapes for Friend’s Claims**:
    1. *Claim 1*: "Perlocutionary effect includes the record!" → Counter: Record is *illocutionary* (conventional effect), not perlocutionary (causal).
    2. *Claim 2*: "The effect failed, so it’s false!" → Counter: "False" implies truth-evaluation; acts succeed or fail, aren’t "true."
    3. *Claim 3*: "Understanding includes knowing authority!" → Counter: Understanding is cognitive; uptake is conventional (e.g., saying "I accept").

  #### **Limits of the Simulation**
  - **What It Can’t Reproduce**: The *moral weight* of personal promises/apologies. The simulation captures *institutional* acts (where conventions are explicit), but not interpersonal ones (where sincerity and commitment matter beyond rules). You’ll need to say:  
    *"In life, when you promise, you bind yourself—not because a secretary wrote it down, but because you invoked a trust that transcends rules. The minute book can record an apology, but it can’t heal betrayal. Austin’s genius was showing how much of our world is built on these fragile, performative acts—and how much more fragile they become when we reduce them to psychology."*

  - **First-Run Risks**: Secretary might freeze or over-record. Prep Secretary: "Record only what’s said, not what you feel. If stuck, say: ‘Minute book shows X.’"

  This simulation forces adjudication without jargon, makes infelicities visceral, and exposes where your friend’s claims crack. Run it, and let the minute book do the teaching.
