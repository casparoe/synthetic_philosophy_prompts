  Write me a joke about Dennett's Cartesian theater versus the multiple drafts model.

  Set it in an actual movie theatre if you want, but don't just do a pun on "theater" — I want the punchline to turn on the real disagreement: is there one place and one moment in the brain where everything gets assembled into a single finished version of what you're conscious of, or are there just parallel streams of processing, none of which is the privileged "official" one?

  The angle I want you to use, which I just made up: a startup sells a brain-computer interface called Final Cut. It's supposed to find the one canonical version of your conscious experience and save it as a replayable clip you can watch back later. It launches and hits a problem on day one. Write the joke as a one-star review, a support ticket, or an internal eng memo dealing with that problem.

  Extra credit if you can work in the bit where, on the multiple drafts picture, there isn't really a fact of the matter about *when* you became conscious of something — which draft you get depends on what you probe the system with afterwards — so the device can't even timestamp the clip properly.

  It should be funny to someone who actually gets why the product couldn't work, and at least sort of funny to someone who doesn't. Under 150 words, and dont explain the philosophy after.
