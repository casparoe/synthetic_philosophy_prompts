prompt: |-
  I'm the community member on our hospital's clinical ethics committee -- not a clinician, not a philosopher, I'm just the lay person they're required to have on it. I've been on it about eighteen months and we've recieved six requests. Next week we get a seventh and I want to know what we're going to do, given what we've already done.

  Our record so far:

  1. Mrs. K., 84, advanced Parkinson's, couldn't swallow, PEG tube proposed. Twenty years of saying she'd never want one, plus a proper directive signed at 76 after watching her brother go through it. Her son wanted the tube, her daughter didn't, and Mrs. K. herself couldn't tell us anything anymore. She'd had three aspirationpneumonias and would have needed soft wrist restraints to keep the tube in. We said no tube: hand feeding, comfort care. She died about ten days later.

  2. A woman of 39 with a postpartum hemorrhage. At 24, during a bad untreated depression, she'd signed a document refusing any life-prolonging treatment. Fifteen years, a marriage and two kids later she was refusing a transfusion on the basis of it while asking us to save her life. We transfused. The rationale was roughly that it was written while her judgment was distorted and the rest of her life had repudiated it.

  3. A man of 58 with ALS, directive from two years earlier refusing a ventilator and a tracheostomy. In respiratory failure he panicked and wrote on a pad: I want the tube, I changed my mind. We honored the original. Panic isn't a considered change of mind was more or less the reasoning.

  4. A woman of 76, lifelong member of a church that forbids blood transfusion, urosepsis, confused, kept saying you decide, whatever's easiest. Easiest thing in the world: one unit of blood and she'd very likely be fine. We said no blood; she got fluids and antibiotics and went home. That's the one I'd probably have decided differently on my own.

  5. A man of 80 with a wallet card that said only: I don't want to be kept alive if I can't enjoy life anymore. Early dementia, apathetic, needed a pacemaker; his son invoked the card. We overrode it. No specific intervention named, and enjoy life was doing way too much work.

  Next week's case. A man of 68, early-onset Alzheimer's diagnosed at 61. Six months later, with his neurologist and his daughter (a nurse) in the room, after two separate conversations, he signs a directive: if he reaches a point where he doesn't recognize his family and can't follow a conversation, he wants no treatment for infections, no hospital transfer, no IVs -- music at home and let him go. He attached a page of reasons: he'd watched his own mother in a nursing home for six years, and what he was afraid of was being kept going as a body that scared people, plus being a millstone round his daughter's neck. (He named that daughter as his agent; his second wife knew and didn't object.)

  Now: he's 68, moderate to severe, doesn't recognize his wife or his daughter, can't follow a conversation. But he lives at home, is almost always cheerful, hums along to the opera he always loved, eats fine, no pain, smiles at the grandkids. He has a urinary tract infection. It's treatable with seven days of oral antibiotics at home -- no hospital, no needles. Without it he'd likely die inside a week or so, probably with some fever and confusion but nothing we can't manage.

  His daughter says: this is exactly the situation he described, that's the entire point of having a directive, honor it. His wife says: he was bracing for a nightmare and the nightmare didn't show up -- he's happy, and anyway she says that at 64, coming out of a Mozart recital, he told her "I think I got that wrong. If I'm happy I want to stay." Never written down, no recording. The daughter says he never said anything remotely like that to her, and that he saw his neurologist twice a year for five years and never once touched the document. The wife concedes she isn't the decision-maker. (She also quit work to look after him and is exhausted, which she says isn't her argument. For what it's worth, our committee has never cited family burden in a written rationale.)

  So: what are we going to do, and if our own record commits us, to what? Please actually commit to a call on the case, not a menu of options. I'd also like the other rules that fit our five previous rulings just as well and where each of them would land here; which precedent is the closest analog and which is a trap; and the one extra fact, or the one variant of this case, that would tell you which of those rules we're really running. Give me a confidence number too, and say what would move you off it.
reasoning: |-
  Okay, the user is a lay member of a hospital's clinical ethics committee. They've been on the committee for about eighteen months and have handled six cases so far. Now they're facing a seventh case and want to understand how their past decisions should guide this new one. They provided detailed summaries of the previous cases and the current dilemma. 

  First, I need to analyze each past case to identify the consistent principles the committee has followed. The user emphasized they want a clear decision, not just options. They also want to know which precedent is the closest, which might be misleading, what additional facts could change things, and a confidence level.

  Looking at Case 1 (Mrs. K): The key was honoring a clear, long-standing advance directive despite family disagreement. The directive was specific and consistent over time, so they refused the PEG tube.

  Case 2: Here they overrode a directive because the circumstances under which it was made (untreated depression) and subsequent life changes (marriage, kids) indicated it no longer aligned with the patient's values. Current expressed wishes at the time were also considered.

  Case 3: Stuck with the original directive despite a panic-induced change of mind. Consistency and the requirement for a reasoned decision were prioritized over a momentary reaction.

  Case 4: Upheld the patient's religious beliefs even when she was confused, refusing transfusion. They respected long-standing values over immediate medical convenience.

  Case 5: Overrode a vague directive ("don't want to be kept alive if I can't enjoy life"). The directive wasn't specific enough, and "enjoy life" was too subjective to apply clearly.

  Now, the current case: A man with Alzheimer's who signed a directive refusing treatment if he couldn't recognize family or follow conversations. His current state matches that description, but he's happy at home. The daughter (agent) wants to follow the directive, while the wife claims he later expressed a change of mind verbally.

  The core principles from past cases seem to be: 
  - Specific, reasoned directives are binding (Cases 1, 3, 4).
  - Directives can be overridden if made under impaired judgment or if later life repudiates them (Case 2).
  - Vague directives are not binding (Case 5).
  - Verbal changes must be clear and reliable to override written directives (implied by Case 3).

  Here, the directive is specific and was made with proper deliberation (neurologist present, two conversations). The wife's claim of a verbal change is uncorroborated and conflicts with the daughter's account. The patient's current happiness doesn't negate the directive—he anticipated this scenario and still chose to refuse treatment. 

  The closest precedent is Case 1 (clear directive upheld despite family conflict). Case 2 might seem tempting but doesn't apply because there's no evidence of impaired judgment when he made the directive. Case 3 reinforces that panic isn't a valid reason to change; here, the wife's claim lacks evidence. Case 5 is a trap because this directive is specific, unlike the vague "enjoy life" card.

  Confidence is high (90%) because the directive checks all the boxes: specific, capacitated when made, aligns with values. What could shift this? If evidence emerged that he consistently expressed regret about the directive to multiple parties, or if medical facts changed (e.g., antibiotics required hospitalization). But as presented, the directive should stand.
answer: |-
  Here's my direct call: **Honor the directive. Do not administer antibiotics.** My confidence is **90%** based on your committee's established principles. Below is the full analysis supporting this decision, including precedent alignment, rule synthesis, and sensitivity testing.

  ### Your Committee's Implicit Rulebook (Synthesized from Cases 1-5)
  1. **Specific, contemporaneous directives override conflicting family wishes** (Case 1: Mrs. K’s refusal of PEG).  
  2. **Directives may be overridden if: (a) decisional impairment existed *at time of signing*, AND (b) later actions/life choices demonstrate repudiation** (Case 2: Transfusion override).  
  3. **Written directives trump panic-driven verbal reversals** (Case 3: ALS ventilator refusal honored).  
  4. **Long-standing value-based refusals bind *even when patient is temporarily confused*** (Case 4: Blood refusal honored despite "you decide").  
  5. **Vague directives lack enforceability** (Case 5: "Enjoy life" card overridden).  

  ### Application to the Current Case (Alzheimer's UTI)
  - **Directive validity**: Meets *all* binding criteria:  
    - **Specific** (lists exact conditions: "no recognition + no conversation → no antibiotics/no hospital").  
    - **Capacitated at signing** (neurologist witnessed, two conversations, six months post-diagnosis).  
    - **Values-based** (fear of burden/scaring others, rooted in lived experience).  
  - **Wife’s claim fails precedent tests**:  
    - Her uncorroborated "happy now" comment lacks the **reliability threshold** from Case 3 (panic reversal ignored).  
    - No evidence of **repudiation** per Case 2 (he never revised the directive).  
  - **Daughter’s position aligns** with Case 1 (agent upholding specific directive despite emotional opposition).  
  - **"Happiness" is irrelevant**: His directive *anticipated* this exact scenario – he feared being a "millstone" *even if content*. Your committee has never prioritized transient well-being over written directives (contrast Case 5’s vagueness).  

  ### Precedent Mapping
  | **Case** | **Closest Analog?** | **Why?** | **Outcome if Applied Here** |
  |---------|---------------------|----------|----------------------------|
  | **Case 1 (Mrs. K)** | ✅ **BEST FIT** | Specific directive, capable at signing, agent/child conflict | Refuse treatment (directive honored) |
  | **Case 4 (Transfusion Refusal)** | Strong Support | Binding values despite confusion | Refuse treatment (directive honored) |
  | **Case 2 (Transfusion Override)** | ❌ Trap | No evidence of impairment at signing or repudiation | Would *wrongly* justify antibiotics |
  | **Case 3 (Ventilator Refusal)** | Supportive | Written directive > alleged verbal change | Refuse treatment |
  | **Case 5 (Vague Card)** | Distinguishing | Directive here is highly specific | N/A (overridden card ≠ enforceable directive) |

  ### The "One Fact" That Changes Everything
  **If multiple witnesses (e.g., neurologist, granddaughter) confirmed he *repeatedly* expressed regret about the directive *after* signing** → This could trigger Case 2’s "repudiation" rule and justify antibiotics.  
  - *Why?* Would show a **consistent, capacitated shift** in values, unlike the wife’s single uncorroborated claim.  
  - *Without this*, Case 2’s override criteria aren’t met.  

  ### Confidence & What Would Shift It
  - **90% Confidence**: Directive is procedurally flawless and fits Cases 1/3/4 perfectly.  
  - **Shift to 60%** if:  
    - Evidence emerges he *lacked capacity* during the directive signing (e.g., neurologist notes doubting comprehension).  
    - Daughter admits he *verbally revoked* it to her (contradicting her current stance).  
  - **Shift to 0%** if:  
    - Antibiotics required hospitalization/IVs (directive’s "no hospital/IVs" clause wouldn’t technically apply to *oral* antibiotics).  

  ### Final Recommendation
  **Do not treat the UTI.** The committee’s jurisprudence commits you to this:  
  - You’ve upheld specific directives against emotional appeals (Case 1),  
  - Rejected uncorroborated claims of changed minds (Case 3),  
  - And prioritized written values over transient states (Cases 4 & 5).  

  The wife’s fatigue and his current happiness are humanly compelling but *ethically irrelevant* under your precedents. His directive exists precisely because he feared being preserved beyond recognition – consenting to antibiotics now would violate his clearest self-determination.
