prompt: |-
  My friend and I spent a good part of last night arguing about moral foundations theory, and I came away unable to tell whether I had been disagreeing with the theory or merely with his version of it. I would be grateful for an audit of the position he defended. What follows is my best reconstruction of it, as nearly in his own words as I can manage:

  "Moral judgements run on a handful of innate foundations — harm/care, fairness, loyalty, authority, sanctity and liberty — each of which evolved to cope with a different recurring problem of living in groups. Liberals are effectively running on only two of them, care and fairness; conservatives run on the full set, which is why they can build coalitions around nation, tradition and religion and the left cannot. Your profile is largely temperamental: substantially heritable, more or less fixed by early adulthood, and it pulls you into a political camp rather than the other way about. Judgement comes first and reasoning comes afterwards. Present people with a harmless taboo violation and they condemn it instantly, flounder when asked to say what was wrong with it, and then manufacture reasons on the spot. So a political argument is never really an argument; both sides are rationalising intuitions they were always going to have. And once you see that, you see that there is no answer to the question of who is right. Morality is a bundle of evolved reactions, people are wired with different weightings of them, and asking whose weighting is correct is like asking whose taste in food is correct. The most that can fairly be said is that the right, having more foundations in play, commands a wider moral vocabulary, and therefore understands the left better than the left understands it."

  I objected at several points and was not convinced by my own objections. Three in particular I could not settle. First, whether the "liberals run on two foundations" line, as he put it, is what the research actually claims, or whether something has gone missing in the retelling. Second, whether the claim that reasoning arrives after judgement, even if we grant it, supports what he took it to support — it struck me that it might be a claim about the order in which things happen to us rather than about whether our reasons are any good, but he said that distinction was evasive. Third, the step from "our moral judgements have a psychological explanation" to "there is no fact of the matter". I accused him of committing the genetic fallacy. He replied that if you learnt your belief that two and two make four was being produced by a brain lesion you would abandon it, and that if I thought the moral case was relevantly different I should say precisely how. I could not.

  I also tried him with a hypothetical. Suppose a large longitudinal study found that foundation profiles are strongly heritable, stable across the life course, and better predictors of later party identification than party identification is of them. He said that would settle the matter outright and show that there is no fact of the matter about whose political morality is correct. I doubt it settles anything of the kind, but I could not say what it would establish if it were true, or what it would leave exactly where it was.

  Could you go through his account claim by claim and separate what the theory's proponents would accept, what is a defensible simplification for a popular treatment, and what they would reject as a misstatement? Please flag anywhere his summary runs together two things the framework keeps apart, and note where he has quietly converted a relative claim into an absolute one. Where he draws a conclusion — about who is right, or about what the psychological findings would show — say whether the conclusion survives once the misstatements are corrected, and whether the argument as he gives it cuts against the left and the right symmetrically or only against one of them. Finally, I should say that I am not a psychologist; I have read one popular book on this, and he has read the same one more carefully than I have, which may be the whole difficulty.
reasoning: |-
  Okay, the user is presenting a complex situation involving a debate about Moral Foundations Theory (MFT) with a friend. They've reconstructed their friend's position in detail and have three main concerns about it. They want an audit of their friend's claims against what MFT actually proposes. 

  First, I need to parse the friend's argument systematically. The core claims are: 1) morality runs on six innate foundations; 2) liberals use only two while conservatives use all six; 3) moral profiles are biologically fixed; 4) intuition precedes reasoning; 5) this makes morality subjective. The user has specific doubts about points 2, 4 and 5.

  Looking at MFT literature, I recall Haidt does propose six foundations but emphasizes they're not rigid categories. The "liberals use two" claim is an oversimplification - research shows liberals use all foundations but weight care/fairness more heavily. The heritability claim is partially supported but exaggerated; while traits are heritable, they're not "fixed" and environment plays a role. 

  The intuition-before-reasoning point is well-supported by research, but the friend overextends it to claim this invalidates reasoning entirely. The "no right answer" conclusion is where the friend goes furthest beyond the theory - MFT describes psychological origins but doesn't claim morality is purely subjective. 

  The user's hypothetical study is interesting. Even if moral foundations predict politics, that doesn't prove there's no moral truth - that's conflating origin with validity. The friend's analogy about brain lesions fails because math has objective verification methods that morality lacks. 

  I should note asymmetries too. The "wider vocabulary" claim privileges conservative framing, but MFT would say both sides have coherent moral systems. The argument's implications aren't symmetric - it undermines objective morality claims for everyone, not just liberals. 

  The user seems philosophically sophisticated but frustrated. Their core need is distinguishing MFT from their friend's interpretation. I'll validate their suspicions while explaining where the friend isn't entirely wrong - just overreaching. The genetic fallacy point stands, and I should emphasize that descriptive psychology doesn't resolve normative questions.
answer: |-
  Here's a claim-by-claim audit of your friend's position, separating MFT core tenets, defensible simplifications, and misstatements:

  **1. "Moral judgements run on a handful of innate foundations — harm/care, fairness, loyalty, authority, sanctity and liberty..."**
  *   **MFT Proponents Accept:** This is the core claim. The foundations are posited as innate, evolved psychological systems adapted to solve social living problems.
  *   **Defensible Simplification:** Listing the specific foundations. While central, researchers see them as "prima facie" foundations or modules, open to refinement.
  *   **Misstatement/Overreach:** None significant here. "Liberty" was added later but is now incorporated.

  **2. "Liberals are effectively running on only two of them, care and fairness; conservatives run on the full set..."**
  *   **MFT Proponents Accept:** Empirical studies consistently show liberals *prioritize* Care/Harm & Fairness/Cheating much more strongly, while conservatives *use* all foundations more *equally*. Liberals *do* use the "binding" foundations (Loyalty, Authority, Sanctity), but significantly less than conservatives and often in different ways (e.g., applying Loyalty to humanity vs. nation).
  *   **Defensible Simplification:** Saying liberals focus "effectively" on two captures the stark difference in relative weighting.
  *   **Misstatement/Overreach:** Saying liberals run "only" on two is a **significant misstatement**. Research shows liberals *use* all foundations, just with vastly different weights. "Run on the full set" for conservatives implies equal activation, which is closer to the data than the liberal claim, but still an oversimplification of individual variation.

  **3. "...which is why they [conservatives] can build coalitions around nation, tradition and religion and the left cannot."**
  *   **MFT Proponents Accept:** The stronger valuation of Loyalty, Authority, and Sanctity among conservatives makes these appeals more resonant and effective for coalition-building *within their group*. Appeals to Care/Fairness resonate strongly with liberals.
  *   **Defensible Simplification:** Linking the foundation differences to coalition-building strategies.
  *   **Misstatement/Overreach:** "Cannot" is **too absolute**. The left builds coalitions around Care/Fairness (e.g., social justice, universal healthcare) and different forms of Loyalty (e.g., international solidarity, oppressed groups). They struggle to build coalitions using *traditional* appeals to *nation, tradition, and religion* because those rely heavily on foundations they weight less. It's about *how* coalitions are built, not absolute ability.

  **4. "Your profile is largely temperamental: substantially heritable, more or less fixed by early adulthood..."**
  *   **MFT Proponents Accept:** Twin studies show significant heritability for moral foundation *sensitivities*. Profiles show stability, especially post-adolescence.
  *   **Defensible Simplification:** "Largely temperamental," "substantially heritable," and "more or less fixed by early adulthood."
  *   **Misstatement/Overreach:** "More or less fixed" is **too rigid**. MFT acknowledges plasticity. Life experiences, culture, and deliberate effort *can* shift foundation weights, though core tendencies are stable. "Temperamental" might undersell cognitive/social influences.

  **5. "...and it pulls you into a political camp rather than the other way about."**
  *   **MFT Proponents Accept:** Foundations are argued to be *prior to* and *shaping* political ideology. Longitudinal studies suggest moral traits predict future political identity better than the reverse.
  *   **Defensible Simplification:** Framing foundations as pulling people towards ideology.
  *   **Misstatement/Overreach:** "Rather than the other way about" implies a **one-way causal arrow**. MFT acknowledges reciprocal influence: ideology can *also* shape how foundations are expressed and prioritized over time (though foundations are seen as the deeper driver).

  **6. "Judgement comes first and reasoning comes afterwards." / "Manufacture reasons on the spot."**
  *   **MFT Proponents Strongly Accept:** This is a central pillar of the Social Intuitionist Model (SIM), which MFT builds upon. Intuitions (affective flashes) precede conscious reasoning, which often serves to justify the intuition ("moral dumbfounding" experiments are key evidence).
  *   **Defensible Simplification:** The core sequence and "manufacture reasons" capture the SIM well.
  *   **Misstatement/Overreach:** None significant here regarding the *sequence* claim. The *implications* drawn later are problematic.

  **7. "So a political argument is never really an argument; both sides are rationalising intuitions they were always going to have."**
  *   **MFT Proponents Accept:** Arguments are often post-hoc rationalizations of intuitive judgments.
  *   **Defensible Simplification:** Highlighting the rationalization aspect.
  *   **Misstatement/Overreach:** 1) "**Never** really an argument" is **too absolute**. Reasoning *can* override or refine intuitions, especially in deliberative contexts or when encountering strong counter-reasons (though this is effortful). 2) "They were always going to have" **overstates determinism**. While foundations create predispositions, the *specific* intuition about a *novel* issue isn't predetermined; it's generated by applying foundational sensitivities to the context.

  **8. "And once you see that, you see that there is no answer to the question of who is right." / "asking whose weighting is correct is like asking whose taste in food is correct."**
  *   **MFT Proponents:** **This is NOT a claim of MFT.** MFT is a *descriptive* psychological theory about *how* moral judgments are made. It explicitly avoids making *normative* claims about which foundations *should* be prioritized. Haidt often states MFT helps explain *why* moral arguments happen, not that they are pointless.
  *   **Misstatement/Overreach:** This is your friend's **major philosophical leap**, not MFT's conclusion. He's converting a descriptive psychological account into a meta-ethical claim of moral relativism/subjectivism. MFT describes the *origin* of moral feelings; it doesn't claim they *lack normative justification*.

  **9. "The most that can fairly be said is that the right, having more foundations in play, commands a wider moral vocabulary, and therefore understands the left better than the left understands it."**
  *   **MFT Proponents Accept:** Conservatives do tend to activate a broader *range* of foundations in their moral discourse. Research suggests conservatives can predict liberals' moral judgments slightly better than vice versa, possibly due to exposure to arguments based on Care/Fairness in mainstream discourse.
  *   **Defensible Simplification:** "Wider moral vocabulary" captures the broader foundation usage well.
  *   **Misstatement/Overreach:** 1) "**Commands**" is too strong. They *use* a wider range in their rhetoric. 2) "**Understands the left better**" is a **relative claim turned absolute and oversimplified**. The research shows a *small* advantage in *predicting judgments*, not deep understanding of motivations, values, or experiences. Liberals can understand conservative *arguments* based on Loyalty/Authority/Sanctity without *agreeing* with them. The claim also ignores whether conservatives *accurately* understand liberal *reasons* beyond just predicting their conclusions on specific issues.

  **Addressing Your Objections & His Replies:**

  1.  **"Liberals run on two foundations":** As above, this is a **significant misstatement/oversimplification** of the research, which shows differential *weighting*, not exclusive use. Your objection was valid.
  2.  **"Reasoning arrives after judgement":** You were correct that the *descriptive sequence* (intuition first) doesn't *necessarily* entail that reasons are *invalid* or that reasoning is *powerless* (the "is/ought" gap). His claim that this distinction is "evasive" ignores the core philosophical project of normative ethics, which seeks justifications *beyond* psychological origin. MFT/SIM describes a common process but doesn't prove reasoning is epiphenomenal.
  3.  **Genetic Fallacy & Brain Lesion Analogy:**
      *   Your Genetic Fallacy accusation was **correct**. Explaining the origin of a belief doesn't *automatically* invalidate its truth.
      *   His brain lesion analogy is **flawed**: Math (2+2=4) has objective, mind-independent verification procedures (logic, set theory, application in the physical world). Moral claims lack this universal, agreed-upon verification method. We *do* abandon beliefs based on origin *if* we have a strong independent reason to trust an alternative method (like logic for math). For morality, there's no agreed-upon "gold standard" outside of our evolved moral sense itself. This is the crux of the meta-ethical debate MFT *describes* but doesn't *resolve*.

  **The Hypothetical Study:**
  *   The study would strongly support the MFT claim that foundational sensitivities are stable, heritable, and *predict* political identity.
  *   It would **NOT** show "there is no fact of the matter." It would show that political moral differences have deep psychological roots. This is *compatible* with:
      *   Moral Realism: The foundations track objective moral truths to varying degrees.
      *   Moral Relativism/Subjectivism: Morality is based on subjective/group preferences.
      *   Moral Pluralism: Multiple foundations capture genuine, irreducible moral values, and the "correct" weighting might be context-dependent or a subject for reasoned debate.
  *   The study would challenge naive views that political identity is *purely* rational or solely shaped by self-interest. It would **not** settle the normative question.

  **Symmetry of the Argument:**
  *   **As your friend states it, it cuts primarily against the left:** He frames liberals as deficient (only 2 foundations), claims conservatives understand better, and concludes morality is subjective (which arguably undermines the left's universalist Care/Fairness claims more directly). His "no right answer" conclusion also undermines any claim to moral superiority, left or right.
  *   **Corrected for MFT accuracy, it cuts symmetrically:** MFT shows *both* sides rely on intuitions and post-hoc reasoning. *Both* sides prioritize different subsets or weightings of foundations. *Both* sides face the challenge of justifying their foundational weightings rationally if they want to persuade others beyond their "tribe." The "wider vocabulary" point becomes a descriptive difference in rhetoric, not a mark of superiority. The core psychological mechanism (intuition first) applies equally to everyone.

  **Conclusion:** Your friend presented a mix of core MFT claims, defensible simplifications, and significant misstatements/philosophical overreaches. Key errors include overstating liberal foundation restriction, implying profiles are completely fixed, overstating the impotence of reasoning, turning relative claims about understanding into absolutes, and most crucially, conflating MFT's *descriptive* psychology with a *normative* claim of moral relativism/subjectivism ("no right answer"). His argument, as stated, is slanted against the left, but the accurate core of MFT describes psychological processes applying symmetrically across the spectrum. Your objections regarding the liberal foundations and the genetic fallacy were well-founded. The brain lesion analogy fails to bridge the gap between mathematical objectivity and moral justification. The hypothetical study would support descriptive MFT claims but wouldn't resolve the normative debate about moral truth. Your difficulty stemmed from your friend blending MFT with his own meta-ethical conclusions.
