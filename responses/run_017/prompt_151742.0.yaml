answer: |-
  Here’s a polished two-page proposal structured for clarity and interdisciplinary appeal. Key revisions: sharpened the fairness distinction, added political science motivation, and built a concrete workflow with off-ramps for scope risks.

  ---

  **PROJECT TITLE:**  
  The Urn Problem: Fairness, Compulsion, and the Hidden Tradeoffs in Sortition-Based Democracy  

  ### Core Question & Significance  
  *For Political Scientists:*  
  **If real-world sortition relies on volunteers, does it covertly replicate the inequalities of elected systems?** This project identifies whether volunteer-based citizens’ assemblies (CAs) — the dominant reform tool — undermine their own legitimacy by violating core fairness principles. Findings will directly inform institutional designers on when compulsion (like jury duty) is normatively required versus practically feasible.  

  *For Philosophers:*  
  **Can the two distinct fairness claims underpinning sortition — procedural blindness and ex ante equality — survive the self-selection inherent in volunteer pools?** I argue existing defenses of lottocracy (epistemic, anti-factional, mirroring) inadequately address this, risking incoherence in justifying real CAs.  

  ---

  ### The Argument: Blindness vs. Equal Chance (Refined Distinction)  
  Your core insight holds, but the framing can be sharper:  
  1.  **Procedural Blindness (PB):** The selection mechanism *ignores normatively irrelevant properties* (e.g., wealth, party ID, charisma). PB aims to prevent *distorted influence* (e.g., campaigning, factional capture).  
  2.  **Ex Ante Equiprobability (EAE):** Every eligible citizen has an *identical statistical chance* of selection before the draw. EAE embodies a radical *equal opportunity* to hold office.  

  **The Wedge: The Volunteer Urn**  
  PB and EAE converge in an ideal, compulsory lottery (e.g., ancient Athens, juries). They diverge critically in modern CAs:  
  -   **PB *may* survive volunteer pools:** If the *mechanism itself* doesn’t screen for irrelevant traits (e.g., a pure lottery among applicants), PB is satisfied *procedurally*, even if the applicant pool is skewed.  
  -   **EAE *cannot* survive volunteer pools:** Self-selection guarantees unequal ex ante chances. Those less likely to volunteer (due to time, alienation, education) have near-zero probability.  

  **The Problem for Standard Defenses:**  
  -   **Epistemic (Cognitive Diversity):** Requires descriptively representative samples. Volunteer pools likely fail this, undermining diversity claims. *Leaves open:* Does PB alone justify CAs epistemically?  
  -   **Anti-Factional/Corruption:** Heavily relies on PB. Volunteerism *might* suffice if PB prevents post-selection factional influence. *Leaves open:* Does self-selection create *pre-selection* factional bias (e.g., only activists apply)?  
  -   **Mirroring/Descriptive Representation:** Explicitly requires EAE (or something close). Volunteer pools directly violate this. *Leaves open:* Is mirroring essential, or can PB + "good enough" diversity suffice?  

  **Hypothesis:** Defenses relying primarily on PB (anti-faction) are more compatible with volunteerism; defenses requiring EAE (mirroring) or strong diversity (epistemic) are not. Real-world CA rhetoric often conflates these, masking a legitimacy deficit.  

  ---

  ### Methodology: Why This Approach?  
  A purely conceptual analysis ignores implementation realities. Formal modeling of selection effects requires empirical inputs we lack. Case studies alone can’t isolate normative principles. Instead, I propose a **hybrid normative-institutional analysis**:  

  | Month | Activity | Deliverable |
  |-------|----------|-------------|
  | 1-2   | **Map Defenses:** Systematically dissect key arguments for sortition (Manin, Landemore, Guerrero, Sintomer) to isolate their reliance on PB vs. EAE. | Typology linking theoretical defenses to PB/EAE requirements. |
  | 3-4   | **Analyze "Urn" Mechanisms:** Compare compulsory (juries) vs. volunteer (standard CAs) vs. incentivized/stipended models. Assess PB/EAE compliance *procedurally*. | Framework for evaluating real-world sortition designs against PB/EAE. |
  | 5-6   | **Stress-Test with Scenarios:** Use thought experiments (e.g., "Urn of the Willing" vs. "Obligatory Urn") to probe intuitions about legitimacy. *Flagged Empirical Premise:* How does volunteer pool composition actually skew? (Use existing CA data/meta-analyses). | Set of normative "stress tests" clarifying when volunteerism breaks justifications. |
  | 7-8   | **Synthesize Tradeoffs:** Identify conditions under which volunteer CAs can be justified *despite* violating EAE (e.g., via strong PB + stipends + outreach). Contrast costs of compulsion (coercion, resentment). | Decision tree for designers: When is compulsion normatively required? |
  | 9     | **Write & Integrate:** Draft monograph chapter + policy brief summarizing findings. | Fellowship Output: 1) Academic paper; 2) Designer-focused guidelines. |

  *Why not alternatives?*  
  -   Pure conceptual work ignores why the urn problem *matters* politically.  
  -   Formal modeling needs debatable assumptions about volunteer bias; this project flags those gaps without overclaiming.  
  -   Case studies are descriptive; here they inform (not drive) normative analysis.  

  ---

  ### Possible Conclusions & Deciding Factors  
  1.  **Strong Voluntarist:** Volunteer CAs satisfy PB sufficiently; EAE is secondary. *If:* Anti-factionalism is the primary goal AND stipends mitigate bias.  
  2.  **Compulsion Necessary:** Justifying CAs requires (near-)EAE, demanding jury-style compulsion. *If:* Mirroring/radical equality is core OR epistemic claims require true representativeness.  
  3.  **Hybrid Legitimacy:** Stipended/aggressive-outreach models approximate EAE "well enough" while preserving consent. *If:* PB is paramount AND empirical data shows outreach works.  

  **Deciding Factors:**  
  -   The *relative weight* of PB vs. EAE in foundational theories.  
  -   *Empirical data* on who volunteers for CAs and why (crucial flagged premise).  
  -   Feasibility/pragmatic costs of compulsion vs. moral costs of unequal access.  

  ---

  ### What Failure Looks Like & Scope Risks  
  **Failure:** The project fails if:  
  1.  PB and EAE prove inseparable in all major defenses (unlikely, given jury vs. CA divergence).  
  2.  All justifications converge on requiring compulsion OR permitting volunteerism, leaving no meaningful tension.  

  **Scope Risks (The 1-Year Challenge):**  
  The biggest risk is **empirical overreach**. Rigorously proving *how much* volunteer pools skew requires original data collection (surveys, CA participant analysis) — impossible in 9 months. I mitigate this by:  
  -   **Relying on existing CA/jury participation studies** (e.g., OECD reports, Grönlund et al.).  
  -   **Treating selection bias as a flagged, probabilistic premise** ("*If* volunteers skew toward [trait X], *then*...").  
  -   Focusing on the *normative implications* of *potential* bias, not quantifying it.  
  The second risk is **theory depth**: Fully engaging all defenses of sortition could sprawl. I limit this by concentrating on 3-4 canonical arguments most cited by practitioners.  

  ---

  **Final Paragraph:**  
  This project tackles a critical blind spot in deliberative democracy: the mismatch between the normative ideals justifying sortition and the volunteer-based mechanisms implementing it. By dissecting the fairness claims underpinning "lottocracy," it provides philosophers clearer grounds for evaluating real institutions and equips political scientists with tools to design more legitimate minipublics. Resolving the urn problem isn’t academic — it determines whether citizens’ assemblies can genuinely claim to voice "the people" or merely the willing.  

  ---  
  **Key Strengths for Committee:**  
  -   **Political Scientists:** Focuses on institutional legitimacy, design tradeoffs, and real-world reform viability.  
  -   **Philosophers:** Offers precise conceptual dissection (PB vs. EAE) and stresses neglected implementation constraints.  
  -   **Both:** Clear deliverables, manageable scope with explicit risk mitigation, and a question with a definitive answer.  

  I believe the PB/EAE distinction is the *right* cut — it clarifies why juries feel legitimate despite compulsion (strong EAE + PB) while CAs face scrutiny (strong PB, weak EAE). A sharper framing is **Input-Blindness vs. Ex Ante Equiprobability**, emphasizing one is a property of the *procedure* and the other of the *initial opportunity distribution*.
