  ### Scenario
  In a small rural community, the term "graystone" traditionally refers to a locally quarried metamorphic rock (Mineral A, *glaucophane schist*) used for building. Due to depletion, the quarry secretly shifts to extracting a visually identical but distinct igneous rock (Mineral B, *dacite porphyry*) from a nearby site, continuing to market it as "graystone". Clara, a lifelong resident and stonemason, uses "graystone" competently—selecting, cutting, and describing it based on texture and color, with no change in her skills, beliefs, or dispositions. The community uniformly treats "graystone" as one kind of rock, and no expert reclassification or announcement occurs. Clara is unaware of the swap and insists she means the same rock as always.

  ### Check
  - **Reference before:** Mineral A (*glaucophane schist*).  
  - **Reference after:** Mineral B (*dacite porphyry*).  
  - **Belief content:**  
    - Before: Clara believes "graystone is metamorphic" (true of Mineral A).  
    - After: Clara believes "graystone is metamorphic" (false for Mineral B, which is igneous). Her belief remains internally identical—she’d express it identically.  
  - **Clara’s perspective:** She’d sincerely say, "I’ve always meant the same durable, blue-gray rock."  
  - **Mechanisms at odds after the shift:**  
    - **Causal-historical:** Points to Mineral A (traces to original quarry samples she interacted with).  
    - **Deference:** Points to Mineral B (current community experts—quarry workers—now apply "graystone" to Mineral B).  

  ### Key Feature Doing the Work
  The **quiet, unacknowledged shift in the physical samples** anchoring the term in the community. This forces reference change without altering Clara’s internal state, as externalism ties meaning to external reality (here, the rocks themselves).  

  - **If the change were announced:** Clara might resist, insisting "graystone" means Mineral A. Her deference could override the causal history, retaining the original reference. Externalism would then *not* force a change, as awareness breaks the passive reliance on the environment.  

  ### Internalist Response  
  A proponent of "meanings in the head" would deny reference change: Clara’s unchanged internal state (memories, concepts, dispositions) fixes "graystone" to a concept defined by appearance and function. Both minerals satisfy this concept, so her term ambiguously refers to either, or she misapplies it to Mineral B while *meaning* Mineral A. The shift is merely worldly, not semantic.  

  ### Why Externalism Prioritizes Deference Here
  In this conflict, externalism should let **deference win** for post-shift reference. The causal-historical chain is "overwritten" by the community’s current practice, which re-grounds the term via new samples. Deference reflects the social dimension of language: Clara’s use is parasitic on expert (quarry worker) norms, and their practice now tracks Mineral B. The causal mechanism is subsumed by social deference—experts mediate the causal link. Without this, reference would be "stuck" in the past, undermining language’s adaptability.  

  ---  
  This case isolates externalism’s core: reference is fixed by the world and community, not individual minds. It also highlights how quiet environmental shifts can alter meaning invisibly, a vulnerability internalists reject.
