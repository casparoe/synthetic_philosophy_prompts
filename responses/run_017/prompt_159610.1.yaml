  Sestina rotation: end-words permute as 615243, etc. Pairs like kettle-boiling and leaf-falling (Earth-Vega) will swap order in some frames. For example, in stanza 2 (moving toward Vega), Vega events seem earlier—so leaf-falling might precede kettle-boiling.  

  Writing the poem:  
