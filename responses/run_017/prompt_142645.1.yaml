prompt: |-
  Reading the cyclical theories of history — the ones that treat a whole civilization like an organism with a youth and an old age — I keep tripping over a move I don't have a word for.

  Two instances. Enormous public building, and being very open to foreign people and foreign ideas: in the chapters about the confident middle phase both get described as energy and reach, and in the chapters about the late phase the very same things get described as bloat and loss of nerve. Same with inequality and with religious skepticism — vigor on the way up, rot on the way down. The feature itself never changes, only where in the story you've decided you are. And it definately cuts both ways, because civilizations that didn't infact collapse get the same traits written up in the prevous chapter as dynamism.

  My first guess was hindsight bias, but that feels too narrow: that's about judging how likely something was, whereas here it's about which description of the evidence is allowed to stick. It's also not just plain unfalsifiability, since the theory really does commit itself to a shape — it just never commits itself in advance to what would count as a symptom. So: is there an established concept for this in the philosophy of history or nearby, or for the nearest thing to it? I don't want a bare label — I want to know exactly what the move is, what it is not, and where the boundary sits, since re-describing the evidence must sometimes just be learning more. And does it also affect linear progress theories, or is it special to cyclical ones?

  Lead with your bottom line in the first sentence, then give the reasoning — no preamble, no restating my question. American English, please.
reasoning: |-
  Hmm, the user is struggling with a concept in cyclical theories of history where the same features (like grand architecture or openness to foreign ideas) get interpreted positively in a civilization's growth phase but negatively in its decline phase. They want to know if there's a specific term for this interpretive move in philosophy of history.

  I recognize this as a classic case of theory-laden observation. The key insight is that the observer's theoretical framework determines how they categorize evidence rather than the evidence speaking for itself. In cyclical theories, the phase assignment dictates whether something counts as "vigor" or "rot" without objective criteria.

  The user has already ruled out hindsight bias (which concerns probability assessments) and unfalsifiability (since cyclical theories do predict rise/fall patterns). They're asking sharp boundary questions about when redescription constitutes genuine learning versus theoretical bias, and whether linear progress theories suffer similarly.

  I should note that linear progress theories have their own version of this - what appears "backward" early might be recontextualized as "pioneering" later. The core issue is the lack of phase-independent diagnostic criteria in these grand historical narratives.

  For the response structure, I'll lead with "theory-ladenness of observation" as the bottom line per their instructions, then unpack how it applies specifically to cyclical theories, distinguish it from adjacent concepts, and address their boundary questions about evidence redescription and applicability to linear theories.
answer: |-
  **The core issue is theory-ladenness of observation, specifically the retrospective application of evaluative concepts tied to phase assignment within the cyclical framework.** Your description perfectly captures how the cyclical theory pre-determines the *meaning* of evidence based on the assigned historical phase, not the evidence itself. Here's the breakdown:

  1.  **Theory-Ladenness:** The cyclical theory provides the lens through which phenomena are interpreted. Concepts like "energy," "bloat," "vigor," and "rot" are not inherent properties of the observed facts (grand buildings, openness, inequality, skepticism) but *evaluative labels* applied *based on* the theorist's placement of the civilization within the cycle. The theory defines what these phenomena *signify*.
  2.  **Phase-Dependent Significance:** The theory dictates that *the same phenomenon* must mean something different (positive/energetic vs. negative/decadent) depending on whether it's observed in the theorized ascending or descending phase. This is baked into the theory's logic.
  3.  **Retrospective Application:** The assignment of a phase (youth, maturity, decline) is often made *after* the fact or based on a broad narrative sweep. Once the phase is assigned, the theory dictates how evidence within that phase *must* be interpreted. This allows the same trait to be reinterpreted based on the outcome (collapse or continued success) – hence it "cuts both ways."
  4.  **Distinction from Adjacent Concepts:**
      *   **Hindsight Bias:** Focuses on *probability judgments* ("I knew it all along"). This is about *interpretive valence* applied to *descriptive* features.
      *   **Unfalsifiability:** The cyclical shape *is* falsifiable in principle (if no civilizations ever rose/cycled). The problem is the *operationalization* – the lack of *phase-independent criteria* defining what specific, observable features constitute "ascent" versus "descent" *before* the outcome is known. It's about *diagnostic ambiguity*.
      *   **Confirmation Bias:** Is a broader tendency to favor confirming evidence. Theory-ladenness explains *why* the same evidence is seen as "confirming" in different phases – the theory changes the meaning.
      *   **Learning More:** Genuine learning involves revising interpretations based on *new evidence* challenging the *existing* theory's predictions or categories. Here, the *evidence stays the same*; only the *evaluative label* changes based on the *phase assignment*, which is dictated by the theory itself.
  5.  **Boundary:** The move occurs when the *evaluative meaning* of a stable set of descriptive phenomena is *dictated by* the overarching theory's phase structure *after the phase is assigned*, without independent criteria for that valence. It's *not* just reinterpreting based on new descriptive evidence (e.g., discovering the building project caused famine, changing it from "grand" to "exploitative").
  6.  **Applicability to Linear Theories:** Yes, though differently. Linear progress theories (like Whig history or some Marxian stages) also suffer from theory-ladenness. Phenomena are labeled "backward," "reactionary," "primitive," "advanced," or "progressive" based on their alignment with the theorized direction of history. Evidence contradicting the *telos* (end goal) might be dismissed as a temporary aberration or reclassified. The core mechanism – evidence interpretation being dictated by the theory's narrative structure – is similar, though the narrative (linear progress vs. cycle) differs.
