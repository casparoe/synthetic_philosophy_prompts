  #### **Branch 7: The Budget Reallocation**  
  *Two policies for a city’s needy and affluent:*  
  - **Policy 1:** Help 10 needy people (1→6). Affluent remain at 8.  
  - **Policy 2:** Help no one, but tax the affluent to reduce inequality. Needy remain at 1, affluent drop to 4.  
  *Which policy?*  
  - **Option A:** Policy 1 (improves the worst-off).  
  - **Option B:** Policy 2 (everyone equal at low levels).  

  **Confidence:** High. Tests if equality alone justifies harming someone.  

