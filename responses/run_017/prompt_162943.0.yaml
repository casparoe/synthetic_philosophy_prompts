  Below is a decision tree designed to classify readers into ethical positions based on concrete allocation choices, without relying on technical jargon. The scale used throughout is a well-being score from 0 to 10, where **0** represents extreme suffering (e.g., starvation, untreated fatal illness) and **10** represents thriving (comfort, security, health). Gains are measured in points on this scale.

  ---

  ### **Decision Tree**  
  *Answer each question based on your instinctive choice.*  

  #### **Branch 1: The Medicine Shortage**  
  *A clinic has one dose of a life-improving drug left. Two patients need it:*  
  - **Patient A:** Severely malnourished (well-being: 2). The drug will raise them to 6.  
  - **Patient B:** Moderately comfortable but limited by chronic pain (well-being: 7). The drug will raise them to 10.  
  *Who gets the dose?*  
  - **Option A:** Patient A (2→6).  
  - **Option B:** Patient B (7→10).  

  **Confidence:** High. Directly tests if gains matter more at lower well-being levels.  

  ---

  #### **Branch 2: The Disaster Relief Dilemma**  
  *A flood threatens two valleys. Resources can save one:*  
  - **Valley A:** 100 residents at well-being 7. Aid would raise all to 7.2.  
  - **Valley B:** One resident stranded at well-being 1. Aid would raise them to 5.  
  *Which valley gets aid?*  
  - **Option A:** Valley A (100 people gain +0.2 each).  
  - **Option B:** Valley B (one person gains +4).  

  **Confidence:** High. Isolates priority for the worst-off versus aggregate gains.  

  ---

  #### **Branch 3: The Unequal Towns**  
  *Two towns need flood defenses. Both have a poor neighborhood at well-being 3:*  
  - **Town X:** The poor neighborhood is surrounded by very affluent areas (well-being 9).  
  - **Town Y:** The poor neighborhood is surrounded by modest-income areas (well-being 4).  
  *You can help one neighborhood. Which?*  
  - **Option A:** Town X (worse-off relative to neighbors).  
  - **Option B:** Town Y (equally poor, but less relative disadvantage).  

  **Confidence:** Moderate. Tests whether disadvantage depends on absolute level or local comparison. *Unsettled point: Some may conflate this with fairness in resource distribution.*  

  ---

  #### **Branch 4: The Transplant List**  
  *Two patients need the same kidney:*  
  - **Patient A:** At well-being 3. A transplant would raise them to 8.  
  - **Patient B:** At well-being 5. A transplant would raise them to 10.  
  *Who gets the kidney?*  
  - **Option A:** Patient A (3→8).  
  - **Option B:** Patient B (5→10).  

  **Confidence:** High. Reveals if priority for the worse-off fades when both are above survival (e.g., >5).  

  ---

  #### **Branch 5: The Risky Treatment**  
  *Two patients are equally ill (well-being 3). You have two treatment plans:*  
  - **Plan A:** A coin flip—one patient fully recovers (→10), the other gets no help (→3).  
  - **Plan B:** Both receive a moderate treatment, raising them to 5.  
  *Which plan?*  
  - **Option A:** Coin flip (50% chance of full recovery).  
  - **Option B:** Moderate treatment for both.  

  **Confidence:** High. Distinguishes outcome-focused views from prospect-focused views under risk.  

  ---

  #### **Branch 6: The Pension Reform**  
  *A policy must favor one retiree:*  
  - **Person A:** Well-off now (7) but was poor most of life (average 2). A $10K grant raises them to 8.  
  - **Person B:** Poor now (3) but was wealthy most of life (average 8). A $10K grant raises them to 5.  
  *Who gets the grant?*  
  - **Option A:** Person B (prioritize current hardship).  
  - **Option B:** Person A (prioritize lifelong hardship).  

  **Confidence:** Low. *Unsettled point: Past suffering may evoke desert-based reasoning, not just well-being timing. A longitudinal study on "compensatory justice" intuitions would clarify.*  

