  ### **Leaf Glossary**  
  1. **Utilitarianism**  
     - Claims: Choose whatever maximizes total well-being.  
     - Awkward commitment: Lets a large group’s tiny gains override rescuing one person from misery.  
  2. **Egalitarianism**  
     - Claims: Reduce inequality even if it leaves everyone worse off.  
     - Awkward commitment: Supports "leveling down" (e.g., Policy 2 in Branch 7).  
  3. **Prioritarianism**  
     - Claims: Gains matter more when given to people at lower absolute well-being.  
     - Awkward commitment: Helps the moderately worse-off over the desperate if both are above a threshold (Branch 4, Option B).  
  4. **Relative Prioritarianism**  
     - Claims: Gains matter more when given to people who are worse off *compared to others nearby*.  
     - Awkward commitment: Helps someone at 3 among 9s over someone at 3 among 4s (Branch 3, Option A).  
  5. **Ex Ante Prioritarianism**  
     - Claims: Weighting applies to people’s expected prospects (e.g., under risk), not just outcomes.  
     - Awkward commitment: Prefers a coin flip for full recovery over guaranteed moderate help (Branch 5, Option A).  
  6. **Sufficientarianism**  
     - Claims: Priority applies only below a "decent life" threshold (e.g., well-being 5).  
     - Awkward commitment: Ignores differences between people above the threshold (Branch 4, Option B).  
  7. **Maximin**  
     - Claims: Help whoever is worst off; ignore others.  
     - Awkward commitment: Ignores large gains for many to give small gains to the single worst-off.  
  8. **Whole-Life Prioritarianism**  
     - Claims: Weight gains by a person’s whole-life well-being, not current state.  
     - Awkward commitment: Helps the currently comfortable who suffered in the past over the currently desperate (Branch 6, Option B).  
  9. **Suffering-Focused View**  
     - Claims: Preventing misery matters more than promoting happiness.  
     - Awkward commitment: Rejects gains to thriving people even if they are worse off than others (Branch 1, Option B; Branch 2, Option B).  

  ---

  ### **Incoherent or Unexplored Combinations**  
  - **B for Branch 1 + A for Branch 2:** Prioritizes the worst-off in Branch 1 but rejects it in Branch 2. *Verdict:* Incoherent—suggests misunderstanding of scale or stakes.  
  - **A for Branch 7 alone:** Endorses leveling down without prior commitment to equality. *Verdict:* Unexplored (rarely defended).  
  - **B for Branch 5 + A for other B-heavy branches:** Values risk for the worse-off but rejects absolute/relative weighting. *Verdict:* Merely unattractive (inconsistent risk attitudes).  

  ---

  ### **Indistinguishable Pairs**  
  The tree **cannot** split:  
  - **Prioritarianism vs. Whole-Life Prioritarianism** if Branch 6 is answered neutrally (e.g., if past/current well-being aligns).  
  - **Suffering-Focused View vs. Maximin** if all cases involve people below well-being 5.  
  *Why:* Branch 6 (time) is the sole test for life-stage weighting, and Suffering-Focused View only diverges when gains above "suffering" levels (0–4) are at stake.  

  ---

  ### **Pattern Over People**  
  **Egalitarianism** (via Branch 7, Option B) is the only position endorsing a change that makes everyone worse off purely for equality. Every other leaf avoids this by construction: they either reject leveling down (e.g., **Prioritarianism**) or focus on improving individuals, not distributions.  

  ---  
  *Tree calibration note:* The weakest step is **Branch 6 (Time)** due to potential conflation with desert. If survey data showed 80%+ choose Option A (prioritize current need) *even when told past disadvantage was undeserved*, this step would be robust.
