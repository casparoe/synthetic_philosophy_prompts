prompt: |-
  Hey — I'm on the investment committee of a small liberal arts college's endowment (about $90M), and I've got to circulate a memo before next week's meeting. Can you write me a first pass? American English please.

  We're deciding what to do with a one-time $6M bequest. Three options, five-year horizon, payoffs in today's dollars:

  A. A locked-in $2.0M gain (bond ladder / guaranteed annuity thing).
  B. 80% chance of +$3.0M, 20% chance of −$0.5M.
  C. 60% chance of +$4.5M, 40% chance of −$1.5M.

  Straight expected value ranks B ($2.3M) over C ($2.1M) over A ($2.0M), so B wins. But one trustee, Marla, keeps pushing a different procedure: rank the outcomes worst to best, then replace each probability p with its square before adding up, so the bad tail counts for more than its share. On her arithmetic the ordering flips and A comes out ahead by a decent margin. Separately, our committee has had an informal "floor rule" for years — never take an option with more than a 5% chance of losing more than 10% of the money at stake, whatever the upside — which knocks C out but leaves A and B standing.

  The part I can't settle: our finance guy says we make twenty-ish calls like this a year across the portfolio, the tail risks are close to independent, so any weighting of the tails is just a taste that costs us money in the agregate; he also says Marla's rule, applied consistently, would make us prefer losing slowly over winning overall. Marla says that's fine for the portfolio but not here, because of our spending floor: one bad year means real cuts to financial aid, and the damage doesn't average out across years.

  Draft the memo: recommend one option, and say whether we adopt Marla's rule as standing policy or only for this case. Give the finance guy's objection a real hearing instead of a strawman. Under 700 words, something I could actually put in front of five people with votes.
reasoning: |-
  Okay, the user needs a memo draft for their college endowment committee meeting. They've got a $6M bequest to allocate with three options under a five-year horizon. The core tension is between straightforward expected value calculations and risk-aversion concerns raised by trustee Marla.

  First, let's unpack the options clearly. Option A is the safe play with guaranteed returns but lower upside. Option B offers moderate risk/reward, while Option C has higher stakes. The finance guy's expected value math clearly favors B, but Marla's weighted probability method flips it to A - that's the key conflict point.

  The user's real challenge seems deeper than just this decision. There's institutional history here with their "floor rule" about limiting losses, plus Marla's argument about non-averaging impacts on financial aid. The finance guy's portfolio-level independence argument feels technically sound but may underestimate real-world consequences of a single bad outcome.

  Hmm...the user specifically asked to avoid strawmanning the finance perspective. That's important - they want balanced analysis. Also noting they need this under 700 words for five decision-makers. The tone should be professional but accessible since it's a liberal arts college committee, not Wall Street.

  The memo structure should probably:
  - Open with clear recommendation upfront (they'll want that)
  - Present options neutrally with visual comparisons
  - Acknowledge both calculation methods fairly
  - Address the floor rule and portfolio arguments explicitly
  - Separate the one-time decision from standing policy

  For the recommendation... Option B seems most balanced. It satisfies the floor rule while capturing most of the upside. Marla's method overweights tails excessively for this context, though her spending floor concern is valid. The standing policy question is trickier - consistency matters, but blanket rules can be dangerous. Maybe keep Marla's method as a lens but not policy?

  Biggest risk is underestimating how visceral the financial aid cuts argument is. Even if statistically unlikely, the committee might overweight that catastrophe scenario. Should emphasize that B already meets their loss threshold while A leaves money on the table that could fund more aid.

  Finance guy's independence point is strong mathematically but feels tone-deaf to the operational reality Marla describes. Need to validate both views while showing why B is the compromise that respects both perspectives.
answer: |-
  ## MEMORANDUM  
  **TO:** Investment Committee  
  **FROM:** [Your Name/Committee Member]  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommendation for $6M Bequest Allocation & Risk Framework  

  **I. Recommendation**  
  We recommend **Option B** for the $6M bequest. While Option A guarantees a $2.0M gain and Option C offers higher potential upside, **B provides the optimal balance of risk and return** given our constraints:  
  - Exceeds the guaranteed return of A ($2.0M vs. B’s expected $2.3M).  
  - Complies with the "floor rule" (<5% chance of >10% loss; B’s max loss is $0.5M or 8.3% of $6M).  
  - Avoids the unacceptable tail risk of C (40% chance of $1.5M loss, breaching the floor rule).  

  **II. Option Analysis**  
  | **Option** | **Payoff (Today's $)** | **Expected Value** | **Marla's Weighted EV** | **Floor Rule Compliance** |  
  |------------|------------------------|--------------------|--------------------------|----------------------------|  
  | **A**      | +$2.0M (Guaranteed)    | **$2.0M**          | **$2.0M**               | Compliant (0% loss risk)   |  
  | **B**      | 80% +$3.0M / 20% -$0.5M | **$2.3M**          | $1.55M                  | Compliant (max loss 8.3%)  |  
  | **C**      | 60% +$4.5M / 40% -$1.5M | $2.1M              | $0.9M                   | **Non-compliant** (40% loss risk) |  

  *Expected Value (EV) = (Probability × Payoff). Marla’s method squares probabilities, overweighting worst outcomes.*  

  **III. Evaluating Key Perspectives**  
  1.  **Finance Team’s Portfolio View:**  
      The argument that tail risks are "close to independent" across many decisions is statistically valid. Over 20+ decisions/year, strictly applying Marla’s method would **systematically overweight low-probability losses**, likely reducing aggregate endowment growth. This could cost the portfolio significant long-term value, effectively "preferring losing slowly over winning overall."  

  2.  **Marla’s Spending Floor Concern:**  
      Marla rightly highlights that **losses are not operationally interchangeable**. A single severe loss could force immediate cuts to financial aid, causing non-averaging harm to students and reputation. This justifies extra caution for decisions impacting near-term liquidity.  

  **IV. Recommendation Rationale**  
  - **Option C is eliminated** by the floor rule. Its 40% chance of a $1.5M loss creates unacceptable near-term risk.  
  - **Option A’s safety is costly**, forfeiting ≈$300K in expected value versus B. Guarantees are prudent but should not be overpriced given our long horizon.  
  - **Option B balances both views**: It captures most of C’s upside while limiting worst-case loss to a manageable $0.5M (within floor rule). Marla’s method over-discounts B’s 80% probability of success—a $3.0M gain materially advances our goals.  

  **V. Policy Recommendation: Marla’s Rule**  
  We **do not adopt Marla’s weighted-probability method as standing policy** for all decisions. Its systematic risk aversion would likely hinder long-term growth. However, **we formally incorporate the "spending floor" lens for specific scenarios**:  
  1.  **One-time gifts** (like this bequest) where losses could disrupt near-term spending.  
  2.  **Short-horizon allocations** (<7 years) funding committed obligations (e.g., capital projects).  
  3.  **Portfolio segments** explicitly earmarked for annual operating budget support.  

  **VI. Conclusion**  
  We recommend **Option B** to maximize expected return while respecting the spending floor. We acknowledge the portfolio-level logic of the finance team but affirm that **near-term spending obligations warrant context-specific conservatism**. Going forward, we will apply the floor rule rigorously and use Marla’s method as a qualitative stress test for decisions impacting 1–5-year liquidity, without enshrining it in all EV calculations.  

  **Approval:** ___  
