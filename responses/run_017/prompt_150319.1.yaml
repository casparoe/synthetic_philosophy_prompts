  I should suggest refining (2) to allow "constrained extremeness" - cases where extreme scales are essential to test the principle's limits, not just decorative. This preserves the value of population ethics while maintaining skepticism about gratuitously extreme scenarios.

  Other points seem largely compatible when properly interpreted. The twin-pump rule in (1) remains useful if applied judiciously rather than as a mechanical veto.

