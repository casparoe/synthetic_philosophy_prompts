prompt: |-
  I teach a graduate seminar on rational choice under strategic uncertainty, and we have just spent a fractious session on a problem I would rather define from scratch than inherit from any particular literature. Call it the commitment race. Two agents are about to play Chicken: each prefers that the other swerve, each prefers mutual swerving to mutual straight-driving, and each can, before the moment of decision, take an irrevocable step — discard the steering wheel, sign a binding contract, hand control to a program — that removes its own ability to swerve. Whoever commits first, and is seen to have committed, wins; the other is left with nothing better than swerving. But both agents know this, so both have reason to commit as early and as visibly as possible, and the result is a race in which each side spends real resources on speed and on publicity, and in which a badly synchronized race ends with both wheels discarded and both cars in the ditch — an outcome each would have paid to avoid beforehand. Among agents who know each other to be consequentialist reasoners of comparable power, the race is the whole game, and any question about what to do inside it is downstream of whether to enter it at all.

  My students and I could not agree on what we were asking for, so before we look at any proposed solution I want a specification: what would an adequate normative account of commitment races have to deliver? Please treat the account as a design specification rather than a purely evaluative theory — something that could in principle be handed to an engineer building agents that really will meet each other in these situations and must act without knowing the other side's architecture, reaction speed, or decision theory. That purpose, I take it, already makes some requirements non-negotiable which a purely evaluative theory could set aside: implementability under that kind of ignorance, tolerable performance when the other party is not a consequentialist at all or cannot commit in the first place, and no reliance on a common prior or on perfect prediction of the other side.

  The heart of what I am asking for is the requirements list, with the case or consideration behind each requirement, and I want the cases to include at least these, because these are the ones that split the seminar: the symmetric race with simultaneous arrival; the fast-hands asymmetry, in which one agent can finalize and display a commitment strictly faster and the slower agent knows it will lose; the blind commitment, where an agent can commit but cannot make the commitment visible; the sealed-escrow variant, in which a trusted third party accepts commitments and releases them simultaneously, which may dissolve the race or may merely relocate it; partial commitment, where an agent can bind itself to swerve with some probability or below some threshold rather than outright; the mirror pair, two agents running near-identical decision procedures, so that either one's effective commitment is predictably the other's as well; meta-commitment, binding oneself now not to enter commitment races later; iterated races in which reputations for speed or for refusal to race become the object of competition; and the spectator race, where winning buys the right to exploit a third party who has no commitment technology at all. Alongside the cases, I want the distinctions preserved rather than collapsed: winning a race versus the race being worth entering, having the capacity to commit versus exercising it, and committing about a first-order action versus committing about one's own future commitment policy.

  Please give me the desiderata as a numbered list, each with its motivating case in a sentence or two, marked as non-negotiable or as a preference of one camp. Flag any subset you suspect cannot be jointly satisfied, with a sketch of the argument for the incompatibility — that part interests me most, since if the list is impossible I would rather know now. Tell me which single requirement does the most exclusionary work, and if a requirement obviously sinks one of the familiar strategies — always commit first, never commit, commit to a conditional policy, lean on the logical or causal links between the agents' decision procedures — say so in a clause; I do not need a scorecard or any discussion of who has defended what. Reason from the cases rather than from the literature: no citations, footnotes, or reading suggestions, since I will be reading this without library access. Around eight hundred words, in American English.
reasoning: |-
  Okay, the user is teaching a graduate seminar on rational choice under strategic uncertainty, specifically focusing on a "commitment race" problem they've defined. They've had a fractious session and want to establish clear specifications for what a normative account of these races must deliver. The account should be treated as a design specification for engineers building agents that operate under ignorance of the opponent's architecture, reaction speed, or decision theory.

  The user has provided several specific cases that divided their seminar: symmetric simultaneous races, fast-hands asymmetry, blind commitments, sealed-escrow variants, partial commitments, mirror pairs, meta-commitments, iterated races, and spectator races. They want desiderata as a numbered list with motivating cases, marking non-negotiables versus preferences, flagging potential incompatibilities, and identifying the most exclusionary requirement.

  The response needs to avoid literature references and focus solely on reasoning from the cases. Key distinctions to preserve include: winning vs. entering the race, capacity vs. exercise of commitment, and first-order vs. meta-commitments. The target length is about 800 words in American English.

  For the desiderata, I consider starting with non-negotiables like implementable ignorance tolerance. Then address the specific cases with requirements like symmetric equilibrium handling, fast-hands rationality, and blind commitment viability. Key distinctions should translate directly into requirements about separating commitment capacity from exercise and distinguishing first-order from meta-commitments.

  Potential incompatibilities emerge between symmetric equilibrium and fast-hands asymmetry, as symmetric solutions may fail when one agent is faster. Also, meta-commitment stability may conflict with race entry incentives when the race offers high rewards. The most exclusionary requirement is likely implementable ignorance tolerance since it prevents reliance on predicting opponents.

  For each strategy sink, I note how "always commit first" fails against faster opponents, "never commit" loses value in spectator races, conditional policies may not bind effectively, and decision procedure links may violate ignorance tolerance.
answer: |-
  Here is a requirements list for a normative account of commitment races, framed as design specifications for implementable agents. Requirements are derived explicitly from the specified cases and distinctions. `[NN]` denotes non-negotiable requirements imposed by the design context (implementability under ignorance, robustness to non-consequentialists, no common prior/perfect prediction). `[P-Sym]`, `[P-Asym]`, `[P-Meta]` denote preferences likely held by camps emphasizing symmetry, asymmetry, or meta-control, respectively.

  1.  **Implementable Ignorance Tolerance `[NN]`:** The agent's strategy must be computable and executable without knowledge of the opponent's decision architecture, reaction speed, or specific decision theory. *Motivation:* Core design constraint; agents meet in the wild without shared priors or predictable internal structures.
  2.  **Robustness to Non-Commitment & Non-Rationality `[NN]`:** The strategy must yield tolerable (non-catastrophic) payoffs if the opponent cannot commit, refuses to race, or behaves non-consequentially (e.g., always swerves, always goes straight). *Motivation:* Real opponents may lack commitment tech or rationality; mutual destruction (both discarding wheels) must be avoidable when facing such opponents.
  3.  **Symmetric Race Equilibrium Handling:** The strategy must define a stable and rationalizable course of action (potentially mixed or involving timing) when both agents have identical commitment capacity, speed, and visibility, and perceive the symmetry. *Motivation:* The symmetric simultaneous arrival case; failure here means no solution exists for the paradigmatic scenario. `[P-Sym]`
  4.  **Fast-Hands Asymmetry Exploitation/Rationality:** If the agent *knows* it has strictly faster commitment finalization/display capability than the opponent, its strategy must ensure it wins the race (commits first and visibly). If it *knows* it is strictly slower, its strategy must prevent it from wasting resources on a lost cause and instead swerve (or equivalent). *Motivation:* The fast-hands asymmetry case; irrational to race if certain to lose or not to win if certain to win. `[P-Asym]`
  5.  **Blind Commitment Viability:** The strategy must specify conditions under which committing *without* guaranteed visibility is rational, and what actions follow (e.g., still swerve if unsure commitment was seen?). *Motivation:* Blind commitment case; committing secretly might deter but risks mutual destruction if unseen.
  6.  **Sealed-Escrow Neutralization/Relocation Handling:** The strategy must respond optimally to the availability of a trusted third party (TTP) for simultaneous revelation. This includes whether using the TTP dissolves the pre-commitment race (e.g., both commit quietly to the TTP) or merely relocates the competition (e.g., racing to be the first to *submit* to the TTP). *Motivation:* Sealed-escrow variant; a robust account must explain if/when this eliminates wasteful racing.
  7.  **Partial Commitment Integration:** The strategy must incorporate the option to commit to mixed strategies (e.g., "swerve with probability p") or thresholds (e.g., "only swerve if opponent commits after time t"). *Motivation:* Partial commitment case; ignoring probabilistic binding ignores a key strategic tool.
  8.  **Mirror Pair Coordination/Exploitation:** The strategy must account for the predictability induced by near-identical decision procedures. It must specify actions when predicting the opponent's commitment implies one's own (or vice-versa), avoiding self-defeating loops or exploiting the link. *Motivation:* Mirror pair case; unique challenge where prediction and action are tightly coupled.
  9.  **Meta-Commitment Stability `[P-Meta]`:** The strategy must define if/when committing *now* to *never enter a commitment race later* (e.g., in future Chicken games) is rational, credible, and immune to renegotiation or self-sabotage when the future race arrives. *Motivation:* Meta-commitment case; requires handling dynamic inconsistency and self-binding.
  10. **Iterated Reputation Dynamics:** The strategy must define how actions in one race (e.g., speed, refusal to race) influence opponent expectations and behavior in subsequent races, and how to manage reputation for these traits. *Motivation:* Iterated races case; past actions convey information shaping future interactions.
  11. **Spectator Race Exploitation:** The strategy must enable winning the commitment race to credibly threaten the third party lacking commitment tech. *Motivation:* Spectator race case; the primary value of winning is exploiting the vulnerable third party.
  12. **Distinction: Entry vs. Winning:** The account must explicitly separate the decision *to enter the commitment race* (expending resources on speed/publicity) from the strategy *within the race* to win it. *Motivation:* Core insight; the race itself may be undesirable even if winning it is beneficial. `[NN]` (Implied by design)
  13. **Distinction: Capacity vs. Exercise:** The strategy must distinguish between possessing the *capacity* to commit and the *decision* to exercise it in a given instance. *Motivation:* Fundamental; agents may have capacity but rationally choose not to use it (e.g., against non-committers, if slower). `[NN]` (For coherent design)
  14. **Distinction: First-Order vs. Meta-Commitment:** The account must treat commitments about base actions (swerve/straight) distinctly from commitments about future commitment policies. *Motivation:* Meta-commitment case; these bind at different levels and pose different challenges.

  **Flagged Incompatibilities:**

  *   **Symmetric Equilibrium (3) vs. Fast-Hands Exploitation (4):** A symmetric equilibrium strategy (e.g., mixed strategy over timing) designed for identical agents will fail catastrophically if one agent is definitively faster. The symmetric strategy *assumes* symmetry and might involve probabilistic delay, allowing the faster agent to always win if it knows its speed advantage. Satisfying both requires the strategy to *detect* or *infer* asymmetry reliably under ignorance (difficult), or to have distinct modes triggered by proven asymmetry.
  *   **Meta-Commitment Stability (9) vs. Spectator Exploitation (11) / Race Entry Rationale (12):** A stable meta-commitment to never race precludes exploiting the vulnerable spectator (11). Conversely, the high value of exploiting the spectator (11) or winning certain asymmetric races (4) provides a strong incentive *to* enter races, undermining the stability of a meta-commitment *never* to enter (9). Resolving this requires the meta-commitment to be context-specific or conditional on race characteristics the agent can foresee.

  **Most Exclusionary Requirement:** **Implementable Ignorance Tolerance (1)**. This sinks strategies relying on:
      *   **Predicting Opponent's Action/Type:** Strategies assuming the opponent will act a certain way (e.g., "if I commit, they will swerve") without a mechanism robust to uncertainty.
      *   **Knowing Opponent Speed/Architecture:** Strategies like "commit immediately if I'm faster" require knowing one's relative speed definitively, often impossible under ignorance.
      *   **Conditional Policies relying on Unobservables:** Complex conditional commitments ("commit if opponent looks like type X") fail if opponent type/architecture is unknowable.
      *   **Logical/Causal Link Exploitation (Mirror Pairs):** While Requirement 8 demands handling mirror pairs if detectable, Requirement 1 prohibits *relying* on such links existing or being identifiable in the general case. The strategy must work even if the opponent is a black box.
