answer: |-
  Here’s your Q&A prep sheet, calibrated for your audience, with strategic concessions and damage control. Objections are ordered by likelihood + impact (high to low):

  ---

  ### **Top 8 Objections & Replies**  
  1. **Behavioral Ecologist (Optimality Modeller):**  
     *Objection:* "We *already* test alternative hypotheses—mutational constraints, drift, phylogenetic inertia—before calling something an adaptation. Your 'tenant' category is just noise we’ve already filtered out."  
     *Reply:* "You test whether the trait *could* be non-adaptive now—but not whether the *opportunity* for this trait predated selection. Did the behavioral 'slot' (e.g., a mating display perch) exist independently? If so, selection optimized a pre-existing vacancy, but didn’t create the *possibility*. Your models assume the slot is part of the adaptation."  
     *Concede:* Optimality models *do* account for some constraints.  
     *Soft Spot:* Most behavioral ecology *doesn’t* formally model slot origins.  

  2. **Population Geneticist:**  
     *Objection:* "What’s the *effect size* of this ‘tenant bias’? If tenants are everywhere, show me a quantitative estimate of how often we misattribute origin to selection."  
     *Reply:* "We lack systematic data—that’s the point. We infer origins from current utility alone. For tenants, knockout studies show *maintenance* by selection, but not *origin*. The bias is inferential, not necessarily frequent. Help me design an assay!"  
     *Concede:* This is a hypothesis, not a measured phenomenon.  
     *Soft Spot:* You’re asking them to fear an unquantified ghost.  

  3. **Evo-Devo Researcher:**  
     *Objection:* "Isn’t ‘tenant’ just pleiotropy or developmental system drift with fancy branding? If a gene affects multiple traits, one is the ‘arch,’ others are ‘tenants’—no new mechanism here."  
     *Reply:* "Pleiotropy explains *co-selection*, not slot independence. A tenant’s slot exists due to *non-developmental* causes (e.g., gravity creating perches). Your field focuses on proximate constraints; I’m asking about ultimate *opportunity*."  
     *Concede:* Developmental constraints *enable* tenants.  
     *Soft Spot:* Developmental biology often *does* determine slot existence.  

  4. **Philosopher of Biology:**  
     *Objection:* "How is ‘evidential asymmetry’ not just methodological adaptationism (Godfrey-Smith 2001)? The vacancy test sounds like a demand for parsimony we already accept."  
     *Reply:* "Methodological adaptationism assumes traits *are* adaptations absent contrary evidence. I’m arguing current function is *never* sufficient evidence—even without constraints. The vacancy test forces us to ask: ‘Would this niche exist trait-independently?’ That’s novel."  
     *Concede:* It builds on existing philosophy.  
     *Soft Spot:* It *is* a refinement, not a revolution.  

  5. **Behavioral Ecologist #2:**  
     *Objection:* "If knocking out a trait lowers fitness, and it’s heritable, that’s *by definition* an adaptation. Why overcomplicate it?"  
     *Reply:* "That shows it’s *currently* adaptive—not that selection *built* it. A tenant (e.g., a spider using a pre-existing leaf curl as a nest) would pass this test but wasn’t *constructed* by selection for nesting. The vacancy test asks: ‘Would the leaf curl exist without spiders?’"  
     *Concede:* Knockout studies *are* good evidence for *current* adaptation.  
     *Soft Spot:* For behavioral traits, slots are rarely "trait-independent."  

  6. **Evo-Devo Researcher #2:**  
     *Objection:* "How do you operationally distinguish a ‘tenant’ from a spandrel? Both are byproducts."  
     *Reply:* "Spandrels are *physically necessitated* (e.g., cell wall geometry). Tenants colonize *contingent opportunities* (e.g., a bird nesting in a tree hollow—the hollow isn’t entailed by tree development). Spandrels are ‘must-exist’; tenants are ‘could-exist.’"  
     *Concede:* Boundary cases exist (e.g., microbiome niches).  
     *Soft Spot:* Contingency is hard to prove.  

  7. **Philosopher #2:**  
     *Objection:* "Doesn’t ‘exaptation’ (Gould & Vrba 1982) cover this? A trait co-opted for new use *is* a tenant."  
     *Reply:* "Exaptation describes function shift. Tenant-hood describes *slot independence*. Exaptations can be arches (e.g., feathers co-opted for flight) or tenants (e.g., feathers insulating a nest that existed pre-feathers). The vacancy test targets slot ontology, not function history."  
     *Concede:* Exaptation is a related but distinct concept.  
     *Soft Spot:* Your distinction feels semantic without empirical stakes.  

  8. **Grad Student:**  
     *Objection:* "What should I *do differently* on Monday? I study mate choice in frogs—how do I test if ‘choosiness’ is a tenant?"  
     *Reply:* "Ask: ‘Would male competition/female sensory bias create choosiness opportunities *even if current preferences vanished*?’ Use comparative methods: if similar ‘choosiness slots’ exist in species without the trait, it’s tenant-prone."  
     *Concede:* It’s harder than optimality modelling.  
     *Soft Spot:* No easy protocol exists yet.  

  ---

  ### **Critical Preemptive Concession (Slide 2)**  
  **Show this early:**  
  > *"The vacancy test does NOT claim tenants are common. It claims:  
  > (1) Current utility ≠ evidence for selective origin,  
  > (2) Tenants are the *most misleading case* for adaptationist inference,  
  > (3) We lack tools to detect them—and that’s a problem."*  

  ---

  ### **Make-or-Break Reply**  
  **The knockout reply (#5)** must land. If behavioral ecologists reject the "current utility ≠ origin" argument, your thesis collapses. Hammer:  
  > *"Fitness assays measure *maintenance*, not *origin*. Period. For tenants, we conflate the two."*  

  ---

  ### **Weakest Category: Tenants**  
  **Why weak:** "Slot independence" is easily conflated with spandrels/exaptations and is hard to test.  
  **Defense Strategy:**  
  - **Acknowledge:** "Tenants are the most speculative category—I propose them to *explain why* current-function evidence fails."  
  - **Reframe:** "Think of tenants as ‘ecological opportunities’ (like empty niches). We wouldn’t call a squirrel an ‘adaptation for empty trees’—why do it for behaviors?"  
  - **Retreat Line:** "Even if ‘tenant’ is imperfect, it highlights the inference problem. The vacancy test remains useful."  

  ---

  ### **Dreaded Question (Hope Nobody Asks)**  
  *"How do you operationally apply the vacancy test without fossil/ancestral data? If it’s untestable in most systems, isn’t this just philosophy?"*  
  **Why it’s deadly:** Admits your framework lacks methodology.  
  **Reply (Damage Control):**  
  > *"Fair—it’s a conceptual tool to curb overconfidence. But we *can* use:  
  > - Comparative biology (e.g., trait-independent slot distribution across clades)  
  > - Experimental evolution (does the slot colonize predictably in novel environments?)  
  > - Developmental models (does disrupting the trait leave the slot intact?).  
  > ...But yes, this needs new methods. Paper not written yet!"*  

  ---

  **Summary Strategy:**  
  - **Preempt** exaptation confusion early.  
  - **Flatter** behavioral ecologists: "Your models are sophisticated—but they assume slots."  
  - **Appeal** to philosophers: "This sharpens evidential norms."  
  - **Beg** population geneticists: "Help me quantify this!"  
  - **Throw grad students** a bone: "Monday: question your ‘why was this *possible*?’"
