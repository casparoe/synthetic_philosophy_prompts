prompt: |-
  I used to run a wet lab, and now in retirement I poke around philosophy, so forgive me if I use the wrong words. Something puzzles me and I'd like the implicit theory spelled out.

  Take two things we actually do. First: if an adult walks past a shallow pond where a toddler is face down and doesn't wade in because it would ruin his shoes, we treat him as having done something seriously wrong — Singer's pond case leans on exactly that, and plenty of countries criminalise failing to render assistance. But nobody thinks a person who spends their savings on a new kitchen instead of on insecticide-treated bednets has done anything wrong; we call that generosity, and optional.

  Second, the bit I keep chewing on: the health service here will fund a treatment that costs something like £25,000 per year of decent life gained, and refuse one that costs more, and we accept that a particular named patient then dies of a treatable condition. Same shape as the pond, it seems to me — known person, known cost, known outcome if we don't pay — except we do it by committee and call it not merely permissible but required.

  So what do these two practices presuppose? Do they need the thought that nearness or identification matters morally in itself, or can you get the whole pattern out of something else: an acts/omissions line, a division of labour between individuals and institutions, the fact that in the health case thousands of others could also pay, or just the idea that a duty stops being a duty once it stops being cheap? I'd like you to separate what the practice strictly requires from what it merely fits well with, and say what would actually have to change in either practice if we dropped the near-and-identified requirement.

  My own half-baked version: charity evaluators put the cost of saving a life through bednet distribution in the low thousands of dollars, so why not treat donating as rescue-at-a-distance and let people discharge the duty that way? Does my version break anything the ordinary version doesn't, and does it make the pond intuition look like an accident of proximity?

  Finish with one line: Verdict: <short phrase saying whether the practice strictly presupposes that nearness or identification matters, or whether several theories would license it>.
reasoning: |-
  Okay, let me unpack this user's query. They're a retired wet lab scientist now dabbling in philosophy, so I need to avoid jargon while being precise. Their core puzzle is the moral inconsistency between three scenarios: the Singer's pond case (duty to save drowning child), discretionary charity (no obligation to donate life-saving amounts), and healthcare rationing (letting identifiable patients die due to cost).

  Hmm, the user wants to know if "nearness/identification" is a necessary moral factor or if other principles explain the disparity. They've already considered alternatives like acts/omissions doctrine or institutional division of labor. Smart framing - they're probing whether current practices logically require proximity as a value or just contingently align with it.

  I recall Singer's pond argument attacks proximity-based morality, but real-world institutions seem to violate that principle constantly. The UK's NICE threshold is particularly fascinating - £25k/QALY means literally pricing identifiable lives. Yet we condemn the shoewearing pond-walker. Why the asymmetry?

  The user's half-baked solution intrigues me: reframing bednets as "rescue-at-a-distance" to satisfy positive duties. But does that resolve the tension or just shift it? If effective altruism logic holds, wouldn't that make non-donors morally equivalent to the pond-walker? Yet legally we treat them differently...

  Key distinctions emerge: 1) The pond involves exclusive opportunity (only one potential rescuer) vs diffuse responsibility in charity/healthcare 2) Institutional vs individual agency 3) Scale - micro-rescue versus macro-resource allocation. But are these morally relevant differences or just pragmatic ones?

  For the verdict: proximity isn't strictly presupposed because multiple frameworks (consequentialist QALY calculators, institutional role ethics) can justify healthcare rationing without it. But dropping identification would radically transform the pond case - we'd have to condemn non-donors as harshly as pond-walkers. That reveals our intuitive morality isn't consistent.

  The user's scientist mindset shows in wanting to "stress-test" the moral framework. I should acknowledge their kitchen/bednets example is spot-on for exposing the inconsistency. Their proposed solution does "break" ordinary practice by making charitable giving obligatory, but perhaps that's the point - ordinary practice might be incoherent.
answer: |-
  Your background brings a valuable empirical perspective to these philosophical tensions. Let's dissect the presuppositions, separating what practices **strictly require** from what they **merely accommodate**, and examine your proposed solution.

  ### Core Practices & Their Implicit Frameworks
  1. **Pond Case (Individual Non-Intervention):**  
     - **Strictly Requires:** A negative duty not to harm *plus* a limited positive duty to prevent catastrophic, imminent, easily preventable harm to an identified victim when one is uniquely positioned to act at minimal cost.  
     - **Presupposes:** "Minimal cost" is defined contextually (ruined shoes << child's life). Identification/proximity signals uniqueness of opportunity and immediacy of threat.  
     - **Accommodates:** Acts/Omissions distinction (though controversial), psychological salience of identifiable victims.

  2. **Kitchen Purchase (Not Donating Savings):**  
     - **Strictly Requires:** No enforceable positive duty to sacrifice significant personal resources to prevent distant, statistical harms, even if cost-effective. Charity is supererogatory.  
     - **Presupposes:** A strong division between obligatory harm-prevention (local/rescue) and elective beneficence (distant/charity). Diffuse responsibility (others *could* act).  
     - **Accommodates:** Sovereignty over personal resources, uncertainty about aid effectiveness, lack of unique responsibility.

  3. **Healthcare Rationing (Institutional):**  
     - **Strictly Requires:** Institutions have a duty to maximize aggregate welfare/health outcomes under budget constraints. This entails letting identified individuals die when treatment is insufficiently cost-effective.  
     - **Presupposes:** Resource scarcity, aggregate welfare as the institutional goal, and the moral legitimacy of statistical lives in decision-making.  
     - **Accommodates:** Acts/Omissions (inaction via policy vs. direct killing), diffusion of responsibility (taxpayers/shareholders), procedural fairness.

  ### Does "Nearness/Identification" Matter *in Itself*?
  - **Not strictly required**, but **psychologically and structurally central** to current practices. Alternative theories can license the pattern:  
    - **Cost-Effectiveness Thresholds:** Focuses solely on resource efficiency (e.g., £/QALY). Proximity is irrelevant; only cost and outcome matter.  
    - **Institutional Role Morality:** Institutions have different duties (maximize aggregate good) than individuals (rescue in emergencies).  
    - **Scalar Utilitarianism:** Obligation diminishes as cost/effort increases or uniqueness of opportunity decreases.  
    - **Diffuse Responsibility:** When thousands *could* act, no single agent bears full responsibility (unlike the pond).

  ### What Changes If We Drop Nearness/Identification?
  - **Pond Analogy:** If proximity doesn't matter, *failing to donate to cost-effective charities* (e.g., bednets) becomes morally equivalent to *walking past the pond*. Both involve letting a preventable death occur when acting is low-cost.  
  - **Healthcare Rationing:** Little change. Institutions already treat identified and statistical lives similarly via QALYs. Dropping identification might reduce public resistance but wouldn’t alter the core cost-effectiveness logic.  

  ### Your "Rescue-at-a-Distance" Solution
  - **Strengths:**  
    - Logically consistent: If saving a life via bednets costs ~$5,000, donating this amount discharges the same duty as wading into the pond.  
    - Eliminates proximity bias: Moral weight hinges on effectiveness/cost, not geography.  
  - **What It Breaks:**  
    - **Ordinary moral intuitions:** It condemns non-donators as severely as pond-walkers, upending the charity/supererogation distinction.  
    - **Institutional boundaries:** Blurs individual/institutional duties; individuals might be obligated to "rescue" globally until personal sacrifice becomes significant.  
    - **Psychological feasibility:** Humans struggle with statistical suffering; enforcing this could face resistance.  
  - **Effect on Pond Intuition:** Yes, it makes the pond intuition *look like* an accident of proximity—merely a special case of a universal duty to prevent harm cost-effectively. The "uniqueness" in the pond is contextual, not morally fundamental.

  **Verdict: The practice does not strictly presuppose nearness/identification; it can be licensed by cost-effectiveness thresholds, institutional roles, or scalar obligations.** However, dropping nearness/identification collapses the distinction between rescue and charity, imposing demanding duties on individuals for distant harms. Your "rescue-at-a-distance" model achieves coherence but challenges deeply held intuitions about moral demandingness and personal sovereignty. The pond case's intuitive force stems from psychological salience, not a necessary moral principle.
