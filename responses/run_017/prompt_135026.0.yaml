prompt: |-
  I'm teching a first-year seminar on practical rationality next term, and a colleague passed me a chapter from one of those popular rationality trade books (I won't name it, and please don't give me page numbers or a who-said-what-where rundown — I can look that up myself, I just want the philosophy straight before I decide whether to inflict this thing on eighteen-year-olds). The chapter is built around Parfit's hitchhiker, and the gist, as I'd reconstruct it from my marginal scribbles, goes like this. Self-interest theory — they call it S — is the view that what each of us has most reason to do is whatever would be best for himself. The hitchhiker dying of thirst in the desert, who promises the driver a thousand dollars on arrival in town, is then supposed to show that S is self-defeating: you only get rescued if you're the sort of person who will pay, but once you're in town S tells you that paying is a pure loss, so the theory tells you to act against the theory. From there the chapter gets breezier: it says this means rationality requires making yourself irrational, describes the mechanism as basically a Ulysses-and-the-mast commitment device, draws the practical moral that we should deliberately cultivate irrational loyalties and maybe a few comforting false beliefs about what we owe people, and adds that the real target is an outdated picture of the agent as a faultless calculator. Then, slightly oddly, it pivots and says the whole argument is defused anyway, because nobody can just decide to believe something they know to be false, so the rational-irrationality argument collapses; the fallback lesson is that you should therefore use external commitment devices instead.

  Two things make me suspicious, but I'm not confident enough about the details to say where it goes wrong. First, I have a feeling the chapter is running together three separate claims: that S sometimes tells you to act against S at the moment of action, that S sometimes tells you to cause yourself to have desires or beliefs that will later make you act irrationally, and the much less paradoxical claim that S tells you to acquire dispositions like promise-keeping whose exercise needn't be irrational at all. Second, I don't think self-defeating is the same as false, and the chapter seems to slide from one to the other. I also sketched a variant for my seminar that I'd like your read on: suppose the hitchhiker can pre-authorize the payment on his phone before the ride — an escrow arrangement that pays out automatically on arrival — so that no disposition, and no irrationality, is needed to make him credible. If that's available, does anything interesting survive in the case, or does the whole lesson turn out to be about a technological limitation? Give me exactly five numbered points, one or two sentences each, no preamble and no summing-up line at the end: one on what the chapter gets right, one on the conflation I'm gesturing at, one on the self-defeating-therefore-false move, one on the can't-just-choose-to-believe objection and whether it really settles anything, and one on whether the practical upshot survives correction and what happens to it in my escrow version.
reasoning: |-
  Hmm, the user is teaching a first-year seminar on practical rationality and wants to analyze a chapter about Parfit's hitchhiker thought experiment. I need to provide exactly five numbered points addressing their concerns without preamble or summary.

  The chapter argues that self-interest theory (S) is self-defeating because it requires you to act against your own interests in the hitchhiker scenario. The hitchhiker must promise to pay to get rescued, but once safe, S advises not paying since it's a loss. The chapter then suggests cultivating irrational loyalties or false beliefs as commitment devices, but then dismisses this by saying you can't choose to believe false things, recommending external commitments instead.

  The user suspects three conflated claims: 1) S telling you to act against itself at action time, 2) causing yourself to have irrational desires/beliefs, and 3) acquiring rational dispositions like promise-keeping. They also think "self-defeating" is being confused with "false," and they've created an escrow variant where payment is automatic via pre-authorization.

  For my five points: First, I'll acknowledge what the chapter gets right - that S can be self-defeating in dynamic choice scenarios like this. Second, I'll address the conflation - the chapter mixes up disposition cultivation with irrationality when dispositions can be rational. Third, I'll clarify that self-defeating doesn't necessarily mean false; S could still be coherent. Fourth, I'll discuss the "can't choose beliefs" objection - while true, it doesn't resolve the core conflict since dispositions aren't about beliefs. Fifth, I'll examine the escrow version - it shows the core issue is about commitment mechanisms, not irrationality, and that the lesson survives with external solutions.

  I need to keep each point concise - one or two sentences as requested. The escrow variant actually strengthens the case against S by showing how external commitments solve the problem that S alone can't handle. The practical upshot about commitment devices remains valid, just without the irrationality detour.
answer: |-
  1. The chapter correctly identifies that self-interest theory (S) can be self-defeating in dynamic choice scenarios like the hitchhiker case, where following S's directives at each moment undermines achieving S's own goal (survival).
  2. It conflates distinct strategies: cultivating genuinely irrational states (problematic), with rationally adopting *dispositions* (like reliable promise-keeping) whose *exercise* (paying) *is* rational given the disposition and its benefits, avoiding paradox.
  3. It erroneously slides from "self-defeating" to "false": S being self-defeating in this instance shows it gives bad *advice* for achieving self-interest here, not that it's intrinsically incoherent or globally false.
  4. The "can't choose beliefs" objection correctly dismisses the bizarre demand for *deliberate false belief*, but misses the point; cultivating *dispositions* (not beliefs) is psychologically possible and resolves the case without irrationality.
  5. The escrow version confirms the core problem for S is credible *commitment*; the practical upshot survives: rationality often requires binding mechanisms (escrow, dispositions, Ulysses contracts), bypassing the irrationality detour entirely.
