prompt: |-
  hey — I'm in a seminar this term on memory and public space (philosophy dept, cross-listed with history) and for the final paper we have to come up with our own principle about what to do with commemorations and then defend it against cases. Before I write it I wanna find out whether my gut verdicts even fit together. So here are my verdicts, mine only, a couple I'm shaky on:

  1. Equestrian statue of a Confederate general on the courthouse lawn in a mid-size southern city, put up in 1911 by a local "heritage" organization during Jim Crow, in a city that's now majority Black. Take it down. And a plaque is not enough — every plaque compromise I've seen feels like a dodge.

  2. Bust of some colonel in a park. The inscription is unreadable, nobody has any idea who he was, everyone just thinks of it as "the soldier statue." Someone digs up that he was a slave trader. My gut: literally nothing needs to happen. It isn't honoring anybody, nobody receives it as honoring, it's park furniture at this point.

  3. A scientist who basically founded his field and also drafted the state's forced sterilization law, under which a few thousand people were sterilized. There's a statue of him and a building named after him. Statue: keep it, with a genuinely brutal plaque. Building: rename. Yes I know those two look inconsistent, that's kind of the point.

  4. Elementary school named after a local guy who ran an Underground Railroad stop and who also campaigned hard to keep Irish Catholic immigrants out of the country. Keep the name. He's being honored for the one thing, the other thing is separate from it, and the thing we honor him for actually cost him something.

  5. Street named after a merchant whose fortune came from goods produced by enslaved people, and who also paid for the city's first free public library, which is still named after him. Rename the street, keep the library's name.

  6. Statue of a colonial governor, pulled down by protestors a few years ago, now reinstalled inside the history museum with wall text about the famine he presided over. Fine — actually better than leaving it in a warehouse.

  7. Statue of a 1930s labor organizer who defended the Moscow show trials in print and never walked it back. Remove. Shaky on this one.

  8. Tomb of a medieval bishop inside a cathedral; the guy led a pogrom. Leave it alone — it's a tomb, it's been there six hundred years, it's basically architecture now. But the memorial plaque to him that was put up in the same cathedral in 1931: take that down.

  So 1 and 2 are the pair I can't get under one principle. If the problem with the general is the message the object sends now, then 2 is fine and 1 is fine — but then 1 has nothing to do with the general, and it bugs me that on that story we're taking his statue down for reasons that don't involve him. And if the problem is that he doesn't deserve to be honored, then 2 should come down too, and I don't believe that.

  The rule I keep circling is something like: a commemoration is wrong to keep when (a) it still successfully communicates honor to some real audience, and (b) what the person is honored for is connected to the bad thing they did. Plus our TA keeps banging on about scarcity — that there are only so many plinths and school names in a city, so leaving one up is also refusing that space to somebody else — and insists that belongs inside the principle rather than as a separate thing to weigh. I can't tell if that's a third clause or if it eats one of the other two.

  Can you hand me a principle, or two or three competing candidates, stated tightly enough that I could actually use it, with a note on which case motivated each clause? And be straight with me about which of my verdicts it can't save. I also want it to rule on cases I haven't decided, not just on my list:

  - a city's "Founders Day" holiday named for a guy who made his money in the slave trade, where nobody thinks about the name anymore and it's mostly just a day off and a parade;
  - a scholarship fund named after a donor who was never convicted but was credibly accused of abusing kids — the money's already been spent, and renaming means the family pulls the money and there's no scholarship at all;
  - a high school that was renamed away from a slave trader and toward a civil rights leader who, it later comes out, was abusive to his wife;
  - and the one my seminar group fought about: the same general's statue, but the only people who now care about it are the neo-Nazis who hold rallies around it. Our reading made a big deal of the difference between the original dedication — a speech act done once, in 1911 — and what the object is doing now, including the possibility that a monument gets re-dedicated by the crowds who rally around it even though nobody in charge ever said anything. Does that rallying make the case for removal stronger, or does it make it a different case entirely?
reasoning: |-
  Okay, the user is in a philosophy seminar on memory and public space, working on a final paper where they need to create and defend a principle for handling commemorations. They've shared their gut verdicts on several cases and want to know if their judgments can fit under a consistent principle. They also have some unresolved cases they need the principle to address.

  First, I need to understand their key concerns. The user is struggling to reconcile their judgments, especially cases 1 and 2. They feel that if the Confederate statue is problematic because of the message it sends now, then the forgotten bust shouldn't matter. But if it's about the person not deserving honor, then both should be removed, which they disagree with. They also mention their TA's point about scarcity—limited public spaces mean keeping one commemoration denies others.

  Looking at their verdicts:
  1. Remove Confederate statue - no plaques, complete removal.
  2. Leave the forgotten bust - it's irrelevant now.
  3. Keep scientist statue with brutal plaque, but rename the building.
  4. Keep school name for Underground Railroad guy despite nativism.
  5. Rename street but keep library name.
  6. Move colonial governor statue to museum - acceptable.
  7. Remove labor organizer statue - shaky.
  8. Leave medieval tomb, remove 1931 plaque.

  The user wants a principle that explains these judgments and handles new cases. The TA's scarcity point needs integration. Also, the neo-Nazi rally around the Confederate statue complicates the "current message" aspect.

  The user's underlying conflict: Is the issue about the person's deservingness or the current impact? Their verdicts suggest both matter. For the scientist, they differentiate between statue (educational with plaque) and building (rename). For the school, they honor the specific good deed despite other flaws. This indicates that the reason for commemoration and its connection to the person's wrongs is crucial.

  Scarcity of public honor spaces means that keeping a contentious figure blocks others who might be more deserving, adding a pragmatic layer. The neo-Nazi rally case shows that the audience's reception can redefine the commemoration, making it actively harmful.

  Possible principles need to address: current communicative impact, deservingness based on reasons for honor and connection to wrongs, and the opportunity cost of maintaining the commemoration. The challenge is balancing historical context with present significance, and practical consequences like losing scholarships if renamed.

  For new cases: Founders Day might be low impact now, but does scarcity matter? The scholarship renaming risks losing funds—does the harm of removal outweigh the honor? The school renamed to an abusive civil rights leader—if the abuse is known, does it taint the honor? The neo-Nazi rally makes the statue a magnet for hate, strengthening removal argument under communicative harm.

  The user needs a principle that ties together communicative effect, the honoree's deservedness (considering the specific reason for honor and its link to wrongs), and scarcity. It should explain why some commemorations can stay with context (scientist statue) while others must go (Confederate general). The principle must also handle cases where the audience redefines the meaning, like neo-Nazis co-opting the statue.
answer: |-
  Here's a tight principle synthesizing your verdicts, incorporating your TA's scarcity point, and explicitly addressing your core tension between *current communicative impact* and *historical deservingness*. It has three core clauses:

  **The Principle of Contextual Deservingness & Communicative Burden:**  
  A public commemoration should be removed, relocated, or contextually reframed **if and only if**:  
  **(A) Communicative Burden:** The object *currently functions* as a significant act of public honor for a relevant audience (not merely historical artifact or neutral object); **AND**  
  **(B) Contextual Deservingness Failure:** The person is honored *for actions or roles* that are *intrinsically linked* to, or *cannot be meaningfully separated* from, their morally reprehensible acts, making the honor itself contestable or illegitimate in the present context; **OR**  
  **(C) Scarcity/Opportunity Cost:** Maintaining the commemoration in its current form and location *actively blocks* the honoring of a more deserving figure or value, creating a significant civic deficit.

  **How it explains your verdicts & resolves your tension (1 & 2):**

  *   **Case 1 (Confederate General): REMOVE**  
      *   **(A):** Actively honors the Confederacy/Jim Crow ideology for heritage groups & is received as an insult/endorsement of oppression by the majority-Black community. Strong *current* communicative burden.  
      *   **(B):** Honored *specifically for his role* in defending slavery/secession – the honor and the evil are inseparable.  
      *   **(C):** Occupies prime public space (courthouse lawn), blocking more unifying figures.  
      *   *Clause (A) distinguishes it from Case 2. Clause (B) addresses your "reasons involving him" concern. Scarcity (C) reinforces the need for removal, not just a plaque.*

  *   **Case 2 (Forgotten Bust): DO NOTHING**  
      *   **(A):** **FAILS.** It functions as park furniture, not honor. No significant audience receives it as honoring the slave trader. Communicative burden is negligible.  
      *   **(B):** Irrelevant since (A) fails. Even if he is undeserving, the commemoration isn't *doing* the work of honoring him now.  
      *   **(C):** Likely negligible – an unreadable bust in a park isn't blocking a more deserving commemoration in a meaningful way.  
      *   *This resolves your core tension: Undeserving ≠ automatic removal. The* current function *(honor vs. artifact) is crucial.*

  *   **Case 3 (Scientist): STATUE KEEP (w/ plaque), BUILDING RENAME**  
      *   *Statue Keep:* **(A)** Communicates honor for scientific founding. **(B)** Sterilization evil is *separable* from his scientific work. A "brutal plaque" reframes it, acknowledging complexity but allowing the specific scientific honor to stand. **(C)** Scarcity argument weaker for a statue *about science*.  
      *   *Building Rename:* **(A)** Naming inherently honors. **(B)** While separable, the *building* isn't inherently tied to science. Its naming honor feels broader, making the evil harder to compartmentalize. **(C)** Stronger – a university building name is prime scarce honor real estate; keeping it blocks naming after someone unambiguously worthy.  
      *   *Principle explains the difference: The statue's honor is specific and separable; the building name's honor is general, making the evil harder to isolate. Scarcity weighs heavier on naming.*

  *   **Case 4 (Underground Railroad/Nativist): KEEP NAME**  
      *   **(A):** Honors specific, costly moral act (URR).  
      *   **(B):** Nativism is reprehensible but *separable* from the specific act he's honored for (URR). Honoring URR doesn't inherently endorse nativism.  
      *   **(C):** Renaming costs institutional memory/logistics; unless a *clearly* more universally deserving figure is blocked, scarcity argument weak.  
      *   *Highlights "separable" in (B).*

  *   **Case 5 (Merchant/Library): RENAME STREET, KEEP LIBRARY NAME**  
      *   *Street Rename:* **(A)** Honors generally. **(B)** Source of wealth (slavery) is *intrinsically linked* to his identity as the named merchant, making the honor contestable. **(C)** Street names are plentiful but symbolic; easier to rename to remove burden than a building.  
      *   *Library Keep:* **(A)** Honors the specific philanthropic act (founding library). **(B)** The philanthropy, while funded immorally, is a *separable* good act. The name honors the *gift*, not the source. **(C)** Renaming risks losing institutional identity/history; the name *specifically* connects to the building's origin.  
      *   *Demonstrates how the* reason for the honor *matters: Street name honors "him"; Library name honors "his gift to the community".*

  *   **Case 6 (Colonial Gov in Museum): ACCEPTABLE**  
      *   **(A):** **Radically changed.** In museum context, it functions primarily as a historical artifact/document of power/past commemoration, not an active act of public honor. The wall text explicitly counters any honor.  
      *   **(B)** & **(C):** Addressed by the contextual shift. Removal from public space satisfies scarcity concerns.  
      *   *Shows how relocation/reframing can resolve (A).*

  *   **Case 7 (Labor Organizer/Show Trials): REMOVE (Your shaky verdict)**  
      *   **(A):** Honors labor organizing.  
      *   **(B):** **Key Question:** Is defending Stalin's show trials *intrinsically linked* to his labor organizing? If his organizing was deeply intertwined with CPUSA ideology *including* defending Stalinism, then yes (B applies - inseparable). If it was a terrible *separate* political opinion, then maybe not (B fails). Your gut leans towards inseparable/invalidating the honor.  
      *   **(C):** Labor heroes are vital; keeping a tainted one might block a purer one. Supports removal if (B) is met.  
      *   *Principle highlights why it's shaky: Hinges on the interpretation of "inseparable" (B).*

  *   **Case 8 (Medieval Tomb/Plaque): TOMB STAY, PLAQUE REMOVE**  
      *   *Tomb Stay:* **(A):** **FAILS.** Primarily functions as historical artifact/architecture, not active honor for the pogrom. **(B):** Irrelevant due to (A).  
      *   *Plaque Remove:* **(A):** 1931 plaque *actively* commemorates/honors him in the *present*. **(B):** Honoring him (generally or for church role?) is inseparable from his pogrom leadership. **(C):** A newer plaque could honor a genuinely worthy bishop.  
      *   *Perfectly illustrates the (A) distinction: Same "honoree", vastly different current functions.*

  **Ruling on Your New Cases:**

  1.  **Founders Day Holiday:** **Likely KEEP (or rename generically, but not urgent).**  
      *   **(A):** Weak. "Founders Day" functions mostly as a day off/parade; the specific honoree's name carries little active honorific weight.  
      *   **(B):** While slave trade is reprehensible, the holiday *now* honors "founding," not specifically his slave-trading. Link is historical but not necessarily *intrinsic* to the *current* honor.  
      *   **(C):** Low. Renaming the holiday doesn't obviously free up space for a *more* deserving commemoration; it's a temporal event. Focus might be better spent adding *new* commemorative days.

  2.  **Scholarship Fund (Credibly Accused Abuser):** **KEEP THE NAME (with context if possible, but don't rename/lose funds).**  
      *   **(A):** Honors the donor (problematic).  
      *   **(B):** The credibly alleged abuse is reprehensible and intrinsically linked to the *person* being honored. **BUT...**  
      *   **(C):** **Overriding Practical Consequence:** Removal destroys the good (scholarships) entirely. The *harm* of losing scholarships for students likely outweighs the *communicative burden* of the name, especially if the specific reason for the scholarship isn't tied to the alleged abuse. The principle prioritizes *removal* only if (A&B) or (C) are met *and* feasible without disproportionate harm. Here, the harm of (C) *if removed* is catastrophic for the scholarship's purpose. Contextual info might be preferable, but renaming isn't feasible.

  3.  **High School Renamed to Abusive Civil Rights Leader:** **LIKELY KEEP THE NEW NAME (but add context).**  
      *   **(A):** Honors civil rights work.  
      *   **(B):** Is spousal abuse *intrinsically linked* to his civil rights leadership? Generally, no (they are separable domains of action, though both reflect character). He is honored *for* civil rights, not for being spousally abusive.  
      *   **(C):** Renaming *again* creates chaos, erodes trust in the process, and might block focus on the *work* the school does. The harm of repeated renaming likely outweighs the communicative burden *unless* the abuse was directly enabled by or part of his public persona/leadership. Context (e.g., curriculum inclusion) is better than renaming.

  4.  **Confederate Statue + Neo-Nazi Rallies:** **REMOVAL STRONGLY SUPPORTED (Different *Intensity*, Same Case).**  
      *   **(A):** **Dramatically Amplified.** The statue *absolutely* functions as active honor *for the neo-Nazi audience*. Their rallies are a potent form of *re-dedication*, making the communicative burden massive and harmful. It's not just about the original intent or the majority Black community's reception; it's actively weaponized.  
      *   **(B):** Still applies (honor for defending slavery).  
      *   **(C):** Greatly amplified – the space is actively used to promote hate, blocking *any* positive civic use.  
      *   *This doesn't make it a *different* case; it makes the **(A) Communicative Burden** argument *overwhelming* and undeniable. The principle handles it robustly.*

  **Strengths of this Principle:**

  1.  **Resolves your 1/2 tension** via Clause (A) - current function is key.
  2.  **Accommodates complexity** (Cases 3, 4, 5, 8) via "separable vs. inseparable" in Clause (B).
  3.  **Integrates Scarcity (C)** as a co-equal reason, not an afterthought, explaining why naming (3b, 5a) is often treated differently than statues or tombs.
  4.  **Handles reframing** (Case 6) as resolving (A).
  5.  **Addresses practical consequences** (Scholarship case) by implicitly requiring feasibility/weighing harms of removal.
  6.  **Explains shaky verdicts** (Case 7) by pinpointing the ambiguity in Clause (B).
  7.  **Handles reception/re-dedication** (Neo-Nazi case) powerfully within Clause (A).

  **Potential Weaknesses / Where it Might Struggle:**

  *   **Defining "Significant" Audience (A):** How big/important must the audience be? (e.g., Is *only* the neo-Nazi audience enough for removal? Your principle says "relevant audience" – arguing the *targeted harm* to the Black community makes them the primary relevant audience, amplified by the neo-Nazis).
  *   **Defining "Intrinsically Linked" / "Cannot be Separated" (B):** This is inherently interpretive and contestable (your Case 7 struggle). You'll need to defend these judgments rigorously.
  *   **"Scarcity" Scope (C):** How direct must the "blocking" be? (e.g., Founders Day). Your principle implies a tangible civic opportunity needs to be identifiably lost.

  **Use this principle.** State it clearly upfront. Apply it rigorously to your cases and the new ones. Explicitly defend your interpretations of (A) [current function], (B) [separability], and (C) [scarcity impact] for each contested case. Acknowledge where the interpretation is debatable (like Case 7) and argue why your reading fits the principle best. Your gut verdicts largely cohere under this framework, and it gives you the tools to tackle the harder questions. Good luck!
