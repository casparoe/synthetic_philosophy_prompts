prompt: |-
  I write about science and ideas for a national magazine — mostly biology, medicine, and psychology — and I keep running into the same problem at the level of a single sentence. Papers and university press offices arrive announcing that some category is real: a new species carved out of a well-known one, a new cell type, a newly identified subtype of a familiar diagnosis, a distinct kind of memory. Just as often they arrive announcing the reverse: that a category everyone has been using does not correspond to anything. My copy has to choose between saying that researchers have discovered a new kind of thing and saying that they have proposed a new way of grouping things, and that choice is not cosmetic. Readers take discovery language as a claim about the world, the scientists care how they are portrayed, and when the category is a diagnosis there are advocacy groups for whom the difference is consequential. I need a procedure, not a theory.

  What I have been using is a rough two-part test I made up. First, an export test: does the proposed category license predictions that were not built into its definition — about a new sample, in another lab, in a related species? Second, a re-identification test: when the same domain is examined by an independent method that does not share the assumptions of the first one, does roughly the same grouping fall out again? I have a feeling these two tests are doing different work, that they track things philosophers distinguish — inductive usefulness, stability across methods, causal structure, explanatory depth — and that some of those come apart in cases I actually cover. I also suspect I have quietly assumed that discovery language is only earned by one style of category, and that I have no way to handle categories that look real at one resolution and dissolve at another.

  So here is what I would like. Give me a decision procedure my desk can run in about ten minutes, from a paper abstract, a methods paragraph, a press release, and usually one short call with an outside scientist who is not on the author list. It should tell me, in order: the questions to ask; what counts as a sufficient answer to each; where the procedure stops with write this as a proposal rather than a discovery; where it stops with write this as a discovery; and where it has to hand the decision back to me because the remaining question is one of values rather than evidence. It should tell me what to do when I cannot get the information a step calls for — what the default is, and whether that default is conservative or merely convenient. It needs to distinguish at least three outcomes that I think I currently conflate: a new label for something the field was already tracking, a recut of an old domain into different groupings, and a claim about underlying causal structure. Assume I already know how to ask whether a finding replicates: what I need is guidance on what kind of thing has been found, conditional on its holding up.

  Then run it. Case one: a genomic clustering study splits a familiar, well-studied organism into five species, and taxonomists quoted elsewhere are openly divided, some treating species as segments of lineages and others requiring something like reproductive isolation. Case two — the one I expect to like least — a team reports a biological subtype of a common psychiatric diagnosis, defined by clustering inflammatory markers in a few thousand patients, and a patient-advocacy foundation is already campaigning for it to be recognized as a disease. Case three, briefly: a review argues that a category in my own beat, long treated as a single thing, does not pick out any one natural grouping, and I have to decide whether scientists say it does not exist is ever the sentence to print. For case two in particular, tell me what the procedure says even though I will not enjoy it, and how to write the sentence so that it is honest without being dismissive.

  Finally, two constraints on how you present this. Be explicit about which claims behind the procedure are settled among people who work on this and which are live disputes — whether kinds must be mind-independent, whether there can be several equally legitimate ways of cutting the same domain, whether categories in the human sciences can be kinds at all — and do not present a contested position as the consensus. And say plainly where my two tests survive, where they are confused, and where the procedure itself will misfire. I am not asking for citations or further reading; I want the reasoning and the procedure. Please answer in American English, in roughly 1,200 words.
reasoning: |-
  Okay, the user writes for a national science magazine and needs a practical decision procedure to determine whether to frame new scientific categories as discoveries or proposals. They've been using a self-made two-part test but recognize its limitations. They need a step-by-step process that's executable in about ten minutes using limited resources: paper abstracts, methods paragraphs, press releases, and one short call with an outside scientist.

  The user explicitly wants:
  - A clear sequence of questions to ask
  - Criteria for sufficient answers
  - Decision points for "proposal" vs "discovery" framing
  - Handling of cases where values override evidence
  - Defaults for missing information
  - Distinction between label changes, recuts, and causal claims

  They also provide three concrete cases to test the procedure:
  1. Genomic clustering proposing new species
  2. Inflammatory marker subtypes in psychiatry
  3. Review arguing a long-standing category isn't real

  Constraints are crucial:
  - Must flag which philosophical assumptions are contested
  - Explain where their existing tests hold/fail
  - Admit where the procedure might misfire
  - No citations - just reasoning and actionable steps

  Their underlying needs seem to be:
  - Maintaining scientific accuracy without oversimplifying
  - Balancing technical precision with reader comprehension
  - Navigating advocacy group sensitivities (especially in medical contexts)
  - Avoiding philosophical debates while acknowledging their existence
  - Preserving credibility with both scientists and the public

  The procedure should probably:
  1. Start with practical operational checks before deeper ontology
  2. Explicitly separate evidential thresholds from value judgments
  3. Build in escape hatches for unresolvable ambiguity
  4. Preserve their existing tests where useful but reframe them
  5. Have clear fallback positions with conservative defaults

  For the contentious psychiatry case, the key is finding language that respects both scientific uncertainty and patient experiences - perhaps "proposed biological signature" rather than "discovered subtype".

  Their "export" and "re-identification" tests remain useful but need qualification:
  - Export tests measure utility, not necessarily reality
  - Re-identification conflates stability with causal depth
  - Both fail at different resolution scales

  Philosophical landmines to flag:
  - Mind-independence of kinds
  - Legitimacy of multiple categorizations
  - Status of human science categories
  - Whether "reality" requires causal depth

  The procedure will misfire when:
  - Evidence is ambiguous across criteria
  - Core assumptions differ between labs
  - Political/clinical stakes force premature framing
  - Categories exist at non-comparable scales

  For their cases:
  - Species split: Likely "proposal" due to taxonomic dissent
  - Psychiatric subtype: Definitely "proposal" given early evidence
  - Category dissolution: May require "scientists question coherence" framing
answer: |-
  Here’s a decision procedure designed for your constraints: **10-minute runtime**, inputs (abstract, methods, press release, one external scientist call), and clear outputs. It prioritizes operational checks over philosophy, flags contested assumptions, and handles ambiguity. Your two tests are integrated but refined to avoid conflation.

  ---

  ### **The Procedure: 4 Questions, 5 Outputs**  
  **Outputs:** Write as (A) **New Label**, (B) **Recut**, (C) **Causal Claim**, (D) **Proposal**, (E) **Discovery**.  
  **Defaults:** Missing info → Conservative (default to Proposal/D). Values conflict → Hand back to you.  
  **Philosophical Disputes Noted** at each step.  

  #### **Step 1: Ask "What changed operationally?"**  
  *   **Question:** Does the work redefine a *measurement* (e.g., new biomarker, gene sequence) or redefine a *grouping* (e.g., new clusters)?  
  *   **Sufficient Answer:** Check methods: If new tool/assay used → likely redefining measurement. If existing data reanalyzed → likely redefining grouping.  
  *   **Where it stops:**  
      - New measurement → **Output (A) New Label** (e.g., "identified a biomarker for X").  
      - New grouping only → Proceed to Step 2.  
  *   **No info/default:** Assume reanalysis → Proceed to Step 2 (conservative).  
  *   **Your test survival:** Export/re-ID irrelevant here. Step 1 separates measurement shifts from conceptual shifts.  

  #### **Step 2: Ask "Does this grouping survive independent re-identification?"** (Your re-ID test, modified)  
  *   **Question:** Does the paper/release cite *any* external validation using a method with **different assumptions**? (e.g., genomics + morphology; biomarkers + behavior).  
  *   **Sufficient Answer:**  
      - **Yes:** Multiple methods agree → Proceed to Step 3.  
      - **No:** Only one method used → **Output (D) Proposal** (e.g., "proposed a subtype based on...").  
  *   **No info/default:** Call external scientist: Ask *"Is there consensus on validation?"* If unsure → Default to **Output (D) Proposal** (conservative).  
  *   **Contested issue:** "Different assumptions" is debated. Some argue methods always share theoretical baggage.  
  *   **Your test critique:** Re-ID confuses *stability* with reality. Stable groupings can be artifacts (e.g., data structure). Step 2 only checks stability, not truth.  

  #### **Step 3: Ask "Does the grouping license novel, non-circular predictions?"** (Your export test, tightened)  
  *   **Question:** Does the paper claim/test predictions **outside its defining feature**? (e.g., genomic cluster predicts disease risk, not just more genomics).  
  *   **Sufficient Answer:**  
      - **Yes** (e.g., predicts treatment response, fossil finds) → Proceed to Step 4.  
      - **No** (e.g., only predicts cluster membership) → **Output (B) Recut** (e.g., "suggests reclassifying X into Y groups").  
  *   **No info/default:** Check abstract for "predicts" or "implies." If absent → **Output (B) Recut** (conservative).  
  *   **Your test survival:** Export test is strongest for utility → Step 3 isolates predictive power.  

  #### **Step 4: Ask "Is there evidence of causal depth?"**  
  *   **Question:** Does the work show the grouping links to a *mechanism* (e.g., gene, pathway) or *function* (e.g., survival advantage, cognitive profile) independent of the cluster?  
  *   **Sufficient Answer:**  
      - **Yes** (e.g., subtype has unique cell mechanism) → **Output (C) Causal Claim** (may upgrade to Discovery).  
      - **No** → **Output (B) Recut**.  
  *   **Handoff to values:** If **Output (C)**, ask external scientist: *"Is this mechanism widely seen as fundamental, or is it contested?"*  
      - Consensus → **Output (E) Discovery** (e.g., "discovered a subtype defined by...").  
      - Disputed → **Output (D) Proposal** (e.g., "argues for a subtype linked to...").  
  *   **Contested issues:**  
      - Human sciences: Are "mechanisms" in psychiatry (e.g., inflammation) causal or correlative? **Live dispute.**  
      - "Fundamental" implies mind-independence. **Contested.** Some argue all categories are purpose-relative.  
  *   **Misfire risk:** Step 4 fails for categories valid at one scale (e.g., cellular) but not another (e.g., behavioral).  

  ---

  ### **Running the Cases**  
  **Case 1: Genomic species split**  
  - Step 1: New grouping (genomic clusters) → Step 2.  
  - Step 2: Morphology/ecology studies? If no → **Output (D) Proposal**. If yes → Step 3.  
  - Step 3: Does cluster predict ecology? If no → **Output (B) Recut**. If yes → Step 4.  
  - Step 4: Reproductive isolation? If no → **Output (B) Recut**. If yes → **Output (E) Discovery** *if* external scientist confirms consensus.  
  **Your sentence:** "Researchers propose splitting X into five species based on genomics, though some taxonomists dispute the approach." (Defaults to Proposal if validation missing.)  

  **Case 2: Psychiatric subtype (inflammatory markers)**  
  - Step 1: New measurement? (Inflammatory markers) → **Output (A) New Label** for the biomarker.  
  - Step 2: Independent re-ID? (e.g., behavioral/cognitive differences?) Press release likely overclaims. Check paper. If no → **Output (D) Proposal**.  
  - Step 3: Novel predictions? (e.g., treatment response?) If no → **Output (D)**. If yes → Step 4.  
  - Step 4: Causal mechanism? Inflammation → psychiatric symptoms is correlative, not causal. **Output (D) Proposal** (no causal depth).  
  **Your sentence (honest not dismissive):** "Scientists propose a biological signature for a subset of [diagnosis] patients, characterized by inflammation, which advocates hope may improve treatment targeting." *Do not say "discovery" or "subtype."*  

  **Case 3: Category dissolution**  
  - Apply Steps 1–4 in reverse:  
      - Does the review show grouping fails re-ID? (Step 2) → If yes, **Output (B) Recut** ("suggests rethinking X").  
      - Does it show no predictive power? (Step 3) → If yes, **Output (D) Proposal** to abandon.  
      - Is there consensus? If yes → "Scientists argue X is not a coherent category." If no → "Debate grows over whether X is valid."  
  - **Values handoff:** If advocacy groups exist, note: "While some researchers question the category, patients argue it captures their experience."  

  ---

  ### **Where Your Tests Survive, Confuse, and Misfire**  
  - **Export test (Step 3):** Survives as a utility check. Confuses *usefulness* with *reality*. Misfires if predictions are trivial (e.g., cluster predicts itself).  
  - **Re-ID test (Step 2):** Survives as stability check. Confuses *reliability* with *causal depth*. Misfires if methods share biases (e.g., genomic + transcriptomic).  
  - **Procedure misfires:**  
      - When categories are scale-dependent (e.g., real as a cell type but not a disease).  
      - In human sciences where mechanisms are disputed (e.g., psychiatry).  
      - When "consensus" is political (e.g., taxonomy wars). Default to Proposal.  

  **Philosophical Transparency:**  
  - Mind-independence: Step 4 assumes it → **Contested** (constructivists disagree).  
  - Multiple legitimacies: Step 2 allows it → **Settled** (e.g., species concepts coexist).  
  - Human science kinds: Step 4’s mechanism requirement → **Live dispute** (e.g., DSM categories).  

  **Final Output Guide:**  
  - **A) New Label:** Measurement change only.  
  - **B) Recut:** New grouping, validated, predictive, but no mechanism.  
  - **C) Causal Claim:** Mechanism shown → upgrade to (E) if consensus.  
  - **D) Proposal:** Anything unvalidated, non-predictive, or disputed. Default.  
  - **E) Discovery:** Validated, predictive, causal, *and* consensus.  

  Use this, and you’ll avoid "discovery" for artifacts, respect advocacy concerns, and signal scientific certainty accurately. When in doubt, **default to Proposal**—it’s conservative, not lazy.
