answer: |-
  ### Translation and Analysis

  Your philosopher friend's gloss of Lewis's convention analysis is largely correct for its era, though it omits Lewis's emphasis on *robustness to near-universal conformity* (i.e., agents still prefer conformity even if a few deviate). For your purposes, the gloss suffices. Below, I map each clause to MARL terms, flagging distortions, gaps, and residues. I assume agents are independently trained with separate beliefs, no shared parameters, and no built-in common knowledge.

  #### Clause-by-Clause Translation  
  **(a) Conformity ("almost everyone conforms to R in S")**  
  - **Lewis content**: Agents consistently follow the regularity R in situation S.  
  - **MARL translation**: The joint policy π (a tuple of individual policies) achieves near-perfect cross-play score on R in S.  
  - **Fit**: Clean.  
  - **What had to be bent**: Nothing. "Joint policy" is standard for emergent conventions.  
  - **Residue**: None.  
  - **Diagnosis**: Neither.  

  **(b) Expectation ("almost everyone expects almost everyone else to conform")**  
  - **Lewis content**: Agents believe others will follow R in S.  
  - **MARL translation**: Each agent’s opponent model (a belief distribution over others’ policies) assigns high probability to R-compliance.  
  - **Fit**: Distorted.  
  - **What had to be bent**: Opponent models in MARL are learned from non-stationary trajectories and often misgeneralize; Lewis assumes perfect inductive inference.  
  - **Residue**: Lewisian expectation implies *warranted* belief (justified by evidence), while MARL models are heuristic and error-prone.  
  - **Diagnosis**: Gap in your framework (no epistemology of belief).  

  **(c) Preference-and-arbitrariness ("prefers to conform if others do, with equally good alternatives")**  
  - **Lewis content**: Conforming is a best response given others’ conformity, and an alternative R' exists with comparable payoffs.  
  - **MARL translation**: R is a strict Nash equilibrium (agents deviate only if others do), and there exists a symmetry-broken alternative R' with similar reward under full conformity.  
  - **Fit**: Distorted.  
  - **What had to be bent**: MARL’s "equilibrium" is often approximate (e.g., noisy from exploration), and arbitrariness implies multiple *accessible* equilibria, but MARL may have only one basin of attraction.  
  - **Residue**: Lewis requires R and R' to be *salient* (psychologically distinguishable), while MARL’s symmetry-breaking is often arbitrary (e.g., seeded asymmetry).  
  - **Diagnosis**: Gap in your framework (equilibria are asymptotic and non-unique in theory but brittle in practice).  

  **(d) Common knowledge ("all of (a)-(c) are common knowledge")**  
  - **Lewis content**: Everyone knows (a)-(c), knows that others know, ad infinitum.  
  - **MARL translation**: Inexpressible. CTDE or population training might approximate shared beliefs, but no mechanism enforces recursive mutual knowledge. Belief networks are private and non-aligned.  
  - **Fit**: Inexpressible.  
  - **What had to be bent**: Null (no mapping possible).  
  - **Residue**: Common knowledge as a recursive epistemic state.  
  - **Diagnosis**: Gap in your framework (no topology for higher-order beliefs).  

  #### Case Reports  
  **Case 1: Unlearnable Convention**  
  - **Lewis verdict**: Convention. Conditions (a)-(d) hold: R is a stable, arbitrary equilibrium. Learnability isn’t required; conventions can be "initiation-only" (e.g., secret handshakes).  
  - **MARL verdict**: Convention (if stable) but a cross-play failure.  
  - **Where they diverge**: Lewis accepts unlearnability as a feature (conventions are historical accidents). MARL treats it as a bug needing fixes like other-play.  
  - **What the divergence shows**: Your field uses "convention" for *adaptable* equilibria, while Lewis’s is static. Cost: MARL misses that some conventions are inherently exclusionary.  

  **Case 2: Sanction-Driven Regularity**  
  - **Lewis verdict**: Not a convention. The preference to conform (clause c) depends on the external penalty, not mutual responsiveness. Remove the penalty, and agents defect despite expectations—violating the "conditional preference" requirement.  
  - **MARL verdict**: Convention if the shaped reward yields high cross-play scores.  
  - **Where they diverge**: Lewis separates *coordination* (payoff-driven) from *enforcement* (external incentives). MARL conflates them via reward engineering.  
  - **What the divergence shows**: Your vocabulary lacks "intrinsic motivation" for mutual cooperation. Cost: MARL may misclassify engineered behaviors as conventions, masking fragility.  

  #### Inexpressible in MARL  
  - Common knowledge (recursive mutual belief).  
  - Salience (psychologically distinct alternatives).  
  - Warranted expectations (justified true beliefs).  

  #### Bottom Line  
  Your friend is partly right: MARL rediscovered Lewis’s core—equilibrium, expectations, and arbitrariness—for convention formation. But working without common knowledge and warranted beliefs costs you explanatory power for stability and exclusivity. MARL’s focus on learnability and robustness narrows "convention" to adaptable, engineerable equilibria, while Lewis’s broader analysis includes entrenched, unlearnable norms.

