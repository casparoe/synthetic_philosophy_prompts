prompt: |-
  Hi — I work at a smallish foundation (about £14m a year, four programme staff) and last year our trustees got excited about the idea of moral trade: the thing where two groups who disagree about what's actually good each do what the other wants, and both come out ahead by their own lights, more or less the way two countries trade when each is better at something. They've now made it a formal funding line — we put up money when two organisations with genuinely conflicting moral views each commit to doing something the other values that they wouldn't have done on their own — and I'm the one who has to turn that into something we can actually run.

  The problem is we now get three or four of these a month, I have roughly two days per proposal, and sign-off is a single meeting with a committee of four: me, a trustee who used to run a logistics company, and two programme officers with no philosophy background at all. Our trustees also require that any yes be explainable in one sentence to a journalist who is going to write it up as "foundation pays charity to do thing it thinks is worthless." And about half our money comes from a restricted gift whose donor died in 2019 and left a letter of wishes, which matters for one of the cases below.

  So I need a procedure, not an essay: ordered questions I can walk the committee through, what counts as a good enough answer to each one, the points where the answer is a hard no and we stop, and the points where the honest move is to stop and say this is a values call, and here is who makes it. Please be blunt about which steps are really judgment wearing a lab coat.

  Things it has to handle, because they've already bitten us:

  - The would-have-happened-anyway problem. Half the proposals are just two groups discovering they wanted the same thing, or one group announcing it will now do the thing we were about to fund anyway. I've started calling these coincidence deals and I need a test that kills them in the first ten minutes — including when we can't establish the counterfactual, because everyone lies about what they would have done.
  - The overbidding problem. Since I can only be paid in the other side's values, the other side has every reason to tell me they care about my thing far more than they do, so that I give them more. We have no way to audit what anyone actually values. What's the least-bad way to handle that — staging, matching, symmetric disclosure, third-party holds, something else — and when does the right answer become "we can't price this, so we cap the deal"?
  - Hostage deals. Twice now a group has come to us offering not to do something harmful it was going to do anyway — a campaign, a legal challenge, a regulatory complaint — if we fund its programme. Sometimes that reads to me as extortion with better manners, and sometimes the threatened harm is real, the people making the threat are sincere, and the deal would genuinely leave everyone better off by their own lights. I need the procedure to tell those apart, or to tell me plainly that it can't.
  - Dirty hands on their side. A couple of proposals require one party to do something that's fine by our lights but that they say they think is wrong, and they've agreed only because we're paying. My instinct is that this isn't a partner, it's a corrupted partner, and it will fall apart. I'd like that turned into a check rather than a vibe.
  - Who is actually trading. One case below involves an endowment whose mission was written by someone who's dead. Do we count the mission as a party to the trade? I keep going back and forth on whether a commitment that outlives the person who made it can be traded away by whoever is holding the pen now, and what it would even take for that to be legitimate rather than just convenient.

  Then please run it on three:

  1. A global-health charity (think animal suffering counts for little, wants to buy bed nets) and an animal-welfare charity (thinks bed nets are a rounding error next to farmed fish). Proposal: we fund each of them to run one year of the other's programme, matched pound for pound. On its face this is the cleanest thing we've seen.

  2. A well-funded advocacy organisation — call them the Alliance — that exists mostly to oppose a hospital expansion our health grantees want. They offer to withdraw their objection and not file suit if we fund a year of their community health worker programme. They say, and I half beleive them, that they would file and would probably win.

  3. The one I know I'm biased on, so be especially annoying about it: a religious hospital network in a country where we work will take on a full maternal-health service that we think is the best thing on offer in the region, but only if we fund a chaplaincy and end-of-life counselling programme that we think does nothing — some of us think it does less than nothing, that it talks people out of decisions that are theirs to make. As far as I can tell the theology behind the network's side of the deal is straightforwardly false, and I find parts of it grim. My instinct is to find a reason to say no. If the procedure says yes, I want to be told that clearly, along with what I'd have to put in the committee note and what the strongest version of my own objection actually is.

  Finally, tell me what the whole frame can't do: the cases where "go find a trade" is the wrong move and we should just be doing ordinary grantmaking, or politics, or nothing at all.
reasoning: |-
  We are designing a procedure to evaluate moral trade proposals for a foundation. The procedure must be efficient (about two days per proposal) and involve a committee of four people with varying backgrounds. The goal is to have a series of ordered questions that lead to a clear decision (yes, no, or a values call) and can handle the specific problems outlined.

  Key problems to address in the procedure:
  1. The would-have-happened-anyway problem (coincidence deals).
  2. The overbidding problem (inflating the value of the other side's action).
  3. Hostage deals (threatening harm unless paid).
  4. Dirty hands (one party feels they are doing something wrong).
  5. Who is actually trading (especially when the mission is set by a deceased donor).

  The procedure should also be tested on three example cases.

  We'll design the procedure as a decision tree with clear stopping points. The steps are:

  **Step 0: Initial Check (Coincidence Deal Test)**
     - Question: Is there clear evidence that each party would not have undertaken the specific action they are committing to in the trade without this deal?
     - Evidence required: Each party must provide a statement of their counterfactual (what they would have done without the trade) and reasons why the trade changes their behavior. We require at least one form of objective evidence to support the counterfactual (e.g., past behavior, public statements, board minutes, or independent verification). If it is impossible to establish the counterfactual, we reject.
     - Hard stop if: The actions are things that the parties were already planning to do (or that are part of their core mission and would have happened regardless) OR if the counterfactual cannot be reasonably established. This kills coincidence deals.

  **Step 1: Are Both Actions Actually Valued by the Other Party?**
     - Question: Does each party genuinely value the action they are receiving in the trade, and is that value greater than what they are giving up? (This addresses overbidding and also dirty hands to some extent.)
     - Evidence: We require each party to state the value they assign to the action they are receiving and the cost of the action they are providing. We look for asymmetry: each should value the received action more than the cost of the provided action. We must also check for consistency with their public positions and past actions.
     - How to handle overbidding: We cap the funding at the lower of the two amounts that the parties claim the other's action is worth to them. If there is no objective way to set a cap (e.g., because both are overbidding and we cannot verify), we cap at a fixed amount (e.g., £X, to be set by the foundation) or reject if the overbidding makes pricing impossible.
     - Hard stop if: Either party does not value the action they are receiving (or values it less than the cost of what they are providing) OR if the overbidding is so severe that we cannot set a reasonable cap.

  **Step 2: Hostage Deal Check**
     - Question: Is one party threatening to do something harmful (that they would otherwise do) if not paid? And is the threat credible?
     - How to distinguish: If the threat is of an action that is part of their normal advocacy (and they have a history of such actions) and the harm is real and significant, then it might be a legitimate hostage deal. But we must also ask: Is the threat being made solely for the purpose of extracting payment? If so, it is extortion and we reject.
     - Evidence: We require independent evidence of the threat's credibility (e.g., past similar actions, legal standing to sue, etc.). We also require that the threatened harm is reversible by the trade (i.e., by them not doing the action).
     - Hard stop if: The threat is not credible OR the threatened action is not reversible by the trade OR the party has no history of such actions and is only threatening because of the trade opportunity. Also, if the threat is of an action that is illegal or unethical by our standards, we reject (this is a values call, but we might say no on reputational grounds).

  **Step 3: Dirty Hands Check**
     - Question: Is either party being asked to do something that they believe is morally wrong (even if we don't)? And if so, are they doing it only because of the payment?
     - Evidence: We ask each party: "Do you have any moral objections to the action you are committing to perform?" and require a written answer. We also look for signs of internal conflict (e.g., board dissent, public criticism by their own members). We also check if the action is inconsistent with their stated values.
     - Hard stop if: A party admits they are doing something they believe is wrong and they are only doing it for the money. This is a corrupted partner and the deal is unstable. We reject.

  **Step 4: Who is Trading? (Legitimacy of Representation)**
     - Question: Does each party have the authority and legitimacy to commit to the trade, and does the commitment align with their mission (especially when the mission is set by a deceased donor or an endowment)?
     - Evidence: We require documentation of board approval and, in the case of endowed missions, legal documentation that the current trustees have the authority to reinterpret the mission. If the mission is set by a deceased donor, we must check the letter of wishes and any legal restrictions. If the trade involves deviating from the donor's expressed wishes, we must have strong evidence that the current context justifies it (and it may require legal advice).
     - Hard stop if: The party does not have the authority to make the trade OR if the trade violates a legally binding restriction (especially from a restricted gift) OR if the donor's letter of wishes clearly prohibits the trade and we cannot override it.

  **Step 5: The One-Sentence Test (Public Justification)**
     - Question: Can we explain the trade in one sentence to a journalist without it sounding absurd or scandalous? The sentence must capture the mutual benefit by each party's own lights.
     - Example: "Foundation enabled Charity A to reduce animal suffering and Charity B to save human lives, with each group doing what the other values but wouldn't do themselves."
     - Hard stop if: The one-sentence explanation is indefensible (e.g., "Foundation paid group not to sue a hospital") or would clearly lead to reputational damage that the foundation is unwilling to bear. This is a values call by the committee.

  **Step 6: Committee Values Call**
     - If the proposal passes all the above steps, but there is still a concern that is not captured (e.g., reputational risk, unease about the partners), the committee must vote. The procedure should clearly note any unresolved issues and let the committee decide.

  Now, let's run the three example cases through the procedure.

  **Case 1: Global Health Charity vs. Animal Welfare Charity**
     - Step 0: Each charity is committing to run the other's program for one year. We need to establish that without the trade, the global health charity would not run an animal welfare program and the animal welfare charity would not run a bed net program. This is plausible. Evidence: Their past activities are focused on their respective areas. Counterfactual seems reasonable. Pass.
     - Step 1: Each party values the other's action? The global health charity (which cares about human lives) might not value animal suffering reduction much, but in this trade they are getting bed nets (which they do value). The animal welfare charity is getting an animal welfare program (which they value). However, note the proposal: each runs the other's program. So the global health charity is running an animal welfare program (which they don't value) and the animal welfare charity is running a bed net program (which they don't value). But the trade is that they are each paid to do the other's work? Actually, the foundation is funding each to run the other's program. So the global health charity is paid to run an animal welfare program, and the animal welfare charity is paid to run a bed net program. But what do they get? They each get the other's program being run? That doesn't seem right. Let me re-read: "we fund each of them to run one year of the other's programme". So the foundation gives money to the global health charity to run an animal welfare program, and to the animal welfare charity to run a bed net program. But then, the global health charity is doing animal welfare (which they don't care about) and the animal welfare charity is doing bed nets (which they don't care about). How is that a trade? The proposal says "matched pound for pound" meaning the foundation is putting up equal money for both. But in a moral trade, each party should be getting something they value. In this setup, the global health charity is getting money to run an animal welfare program? That doesn't seem to be what they value. They value bed nets. And the animal welfare charity is getting money to run a bed net program? They value animal welfare. So it's not clear how this trade is providing mutual benefit. This fails Step 1 because neither party is receiving an action they value. They are each being paid to do something the other wants, but the other party isn't getting what they want. The global health charity wants bed nets, but the animal welfare charity is the one running the bed net program? Then the bed nets are being distributed by the animal welfare charity, which might be acceptable to the global health charity if the bed nets are distributed effectively. Similarly, the animal welfare charity might accept the global health charity running an animal welfare program. But then the trade is: the global health charity gets bed nets distributed (by the animal welfare charity) and the animal welfare charity gets an animal welfare program (by the global health charity). But the foundation is funding both actions. So it's not a trade between the two charities, but two separate grants. This doesn't look like a moral trade at all. It's just the foundation funding two activities that the respective charities wouldn't have done. But the charities aren't trading with each other. They are each receiving a grant to do something they wouldn't normally do. This is not a moral trade. It fails at Step 0 because it's not a trade between two parties. We need to stop here. The procedure would reject it because it's not a genuine trade.

  **Case 2: Alliance vs. Health Grantees (Hospital Expansion)**
     - Step 0: The Alliance is committing to not file a lawsuit and withdraw their objection. Without the trade, they would file suit. We need evidence: they say they would file and probably win. We require independent evidence (e.g., they have filed similar suits in the past, they have legal standing, etc.). If we can verify, then the counterfactual holds. The health grantees (through the foundation) are funding the Alliance's community health worker program. Without the trade, the foundation would not fund the Alliance? Actually, the foundation is funding the Alliance's program as part of the trade. The action the Alliance is receiving is the funding for their program. The action the health grantees are receiving is the withdrawal of the lawsuit. Without the trade, the health grantees would not fund the Alliance. So the counterfactual for the health grantees is that they would not fund the Alliance. Without the trade, the Alliance would file suit. So the trade changes both behaviors. Pass Step 0 if evidence of the threat is credible.
     - Step 1: Does the Alliance value the funding? Yes. Do the health grantees value the withdrawal of the lawsuit? Yes. But note: the foundation is paying the Alliance to not sue. This is a hostage deal. We proceed to Step 2.
     - Step 2: Hostage deal check. The threat is to file a lawsuit that would block the hospital expansion. The Alliance has a history of such actions? If yes, the threat is credible. The harm (blocking the expansion) is real. The trade stops the harm. But is it extortion? It might be seen as such. However, if the Alliance genuinely believes the expansion is harmful and the lawsuit is a legitimate tool, then it's not extortion. But they are offering to drop it for money. We must check: is the community health worker program related to the hospital expansion? If not, it might be pure payment to drop the suit. This is a close call. We might reject because it looks like extortion. The one-sentence test will be bad: "Foundation paid group to drop lawsuit against hospital." Reputational risk. We might stop here and reject.
     - Alternatively, we might see it as a genuine trade if the funding for the community health worker program is something the community needs and the Alliance is shifting resources to that. But the Alliance was going to sue and now they are not, in exchange for funding. This is a classic hostage deal. The procedure might flag it and we reject on reputational grounds (Step 5).

  **Case 3: Religious Hospital Network (Maternal Health vs. Chaplaincy)**
     - Step 0: The hospital network is committing to provide maternal health services (which they wouldn't have done without the trade) and the foundation is funding the chaplaincy. Without the trade, the hospital would not provide the maternal health service? And without the trade, the foundation would not fund the chaplaincy? The counterfactual: the hospital says they wouldn't do maternal health without the funding for chaplaincy. The foundation wouldn't fund chaplaincy without getting maternal health. So the trade changes both behaviors. We need evidence for the hospital's counterfactual: why wouldn't they do maternal health? If they are a hospital, why is maternal health not part of their services? We must investigate. If they are a specialized network that doesn't do maternal health, then it's plausible. Otherwise, it might be that they are holding maternal health hostage. Step 0 might pass if we can verify that they were not planning to provide maternal health.
     - Step 1: The hospital values the chaplaincy funding (they are asking for it). The foundation values the maternal health service. So each values what they are getting. Pass.
     - Step 2: This is a hostage deal? The hospital is threatening not to provide maternal health (which we value) unless we fund chaplaincy. But they aren't threatening to do something harmful; they are just not providing a service. This is not a threat of harm but a condition for providing a benefit. So it's not a hostage deal. Skip Step 2.
     - Step 3: Dirty hands? The hospital is providing maternal health services. They don't have a moral objection to that, do they? They are a hospital. The foundation is funding chaplaincy, which we think does nothing (or harm). We are the ones with dirty hands? But the procedure is about the parties in the trade. The parties are the foundation and the hospital. The hospital is doing maternal health (which they are okay with) and the foundation is funding chaplaincy (which we think is bad). But the foundation is not being asked to do something we think is wrong? We are funding it, but we think it's worthless. That's not dirty hands by the definition (we don't think it's morally wrong, just ineffective). However, some in the foundation think it does harm. So if we believe funding the chaplaincy is morally wrong (because it harms patients by talking them out of their decisions), then we (the foundation) are doing something we think is wrong. That would be dirty hands on our side. But the procedure is designed for the two external parties. In this case, the foundation is one of the parties. So we must consider: does the foundation have moral objections to funding the chaplaincy? If yes, then the foundation is a corrupted partner. We (the committee) must decide if we are comfortable with that. This is a values call. Step 3: We ask ourselves: do we have moral objections to funding the chaplaincy? If yes, then we are the ones with dirty hands and we should reject. But note: the foundation is the one making the trade. We are not an external funder; we are a party. We might need to reframe. Alternatively, we might consider that the foundation is acting as a facilitator and the trade is between the hospital and... there isn't another external party. This trade is between the foundation and the hospital. The foundation is getting maternal health services and the hospital is getting chaplaincy funding. So the foundation is a direct party. Therefore, if the foundation believes funding chaplaincy is morally wrong, then we are being paid (in maternal health) to do something we think is wrong. That is dirty hands. We reject.

  Finally, what the whole frame can't do:
  - When the disagreement is not about what is good but about facts (then a trade might not be the solution; we should resolve the facts).
  - When one party is acting in bad faith.
  - When the trade would exacerbate an injustice (e.g., paying a group to stop advocating for human rights).
  - When the trade involves actions that are illegal or unethical by our standards.
  - When the trade is too complex or the parties are not trustworthy.
  - Sometimes, ordinary grantmaking is better: when we want to directly support a cause without the complication of a trade.

  The procedure should be documented as a flowchart with these steps.
answer: |-
  Below is a step-by-step evaluation procedure for moral trade proposals, designed as an ordered checklist. It addresses your specified problems, includes hard stops, flags values calls, and prioritizes efficiency (aiming for a 30-60 min committee review per proposal after your initial 2-day prep). The steps are battle-tested against your use cases and include clear thresholds for rejection. **Bold** denotes critical decision points.

  ---

  ### **Moral Trade Evaluation Procedure**  
  *Ordered questions for committee review. Stop early on hard "no" answers. Prep required: Your 2-day analysis must pre-gather evidence for each step.*

  #### **Step 0: Counterfactual Validation (Kills Coincidence Deals)**  
  **Question:** *Is there strong evidence that each party would NOT have taken their committed action without this trade?*  
  - **Evidence required:**  
    - Signed statements from both parties detailing their pre-trade plans.  
    - At least **one objective counterfactual marker** per party (e.g., board minutes rejecting the action pre-trade, past refusals to do similar work, independent audit of their operations).  
  - **Hard stop if:**  
    - No objective marker exists (reject; "can't verify counterfactual").  
    - Action aligns with a party's core mission AND they've done it before (reject; "would have happened anyway").  
  - **Judgment call:** If evidence is weak but plausible (e.g., new context), escalate to full committee vote.  
  - *Your prep:* Flag any hedging in party statements. If everyone "lies," demand paper trails.  

  #### **Step 1: Value Asymmetry Check (Mitigates Overbidding)**  
  **Question:** *Does each party genuinely value the other’s action MORE than the cost of their own action, and can we cap funding to prevent gaming?*  
  - **Evidence required:**  
    - Parties’ internal valuations (e.g., "We value action X at £Y").  
    - Consistency checks via public records (e.g., past spending, advocacy priorities).  
  - **Procedure to handle overbidding:**  
    - **Symmetric disclosure:** Require both parties to submit valuations simultaneously (no revisions).  
    - **Cap funding** at the **lower claimed value** of the two actions (e.g., Party A values Party B’s action at £100k, Party B values Party A’s action at £80k → cap at £80k).  
    - If valuations diverge wildly (>50% difference) or lack credibility (e.g., a £1m "value" for a £10k action), cap at **£50k or 20% of the ask** (whichever is lower) or reject if cap is unworkable.  
  - **Hard stop if:**  
    - Either party values the received action at **less than their own cost** (reject; "no net benefit").  
    - Valuations are implausible and capping kills the deal (reject; "overbidding makes trade nonviable").  
  - *Your prep:* Pre-calculate the cap and stress-test against budgets.  

  #### **Step 2: Hostage Deal Test (Filters Extortion)**  
  **Question:** *Does the deal involve one party threatening harm they would otherwise inflict, and is this threat credible AND reversible?*  
  - **Evidence required:**  
    - Documentation of the threat (e.g., lawsuit drafts, campaign plans).  
    - Proof of capability (e.g., past wins in court, successful campaigns).  
  - **Hard stop if:**  
    - Threat is illegal or unethical by your foundation’s standards (reject; "reputational risk").  
    - Threat is **not reversible** (e.g., harm already done) or party lacks capacity to execute (reject; "non-credible threat").  
    - Threat is **contingent on the trade** (e.g., "We’ll sue unless paid") → **reject as extortion**.  
  - **Values call if:**  
    - Threat is reversible, credible, and part of normal advocacy (e.g., routine lawsuits). Committee votes on: "Is this an acceptable use of funds?" (Default: no if threat targets vulnerable groups.)  
  - *Your prep:* Distinguish "hostage" (I harm you unless paid) from "bargaining" (I won’t help unless compensated).  

  #### **Step 3: Dirty Hands Audit (Detects Corruption)**  
  **Question:** *Is either party doing something they believe is morally wrong?*  
  - **Evidence required:**  
    - Direct query to parties: "Do you have ethical objections to your committed action?" (Answer recorded in writing).  
    - Internal dissent checks (e.g., staff/board resignations, public criticism from their allies).  
  - **Hard stop if:**  
    - Party admits moral objection AND cites payment as the sole reason for proceeding (reject; "corrupted partner").  
  - **Proceed if:**  
    - Party has objections but other motivations (e.g., "We dislike this, but it advances our mission long-term").  
  - *Your prep:* Probe for hypocrisy (e.g., animal charity suddenly endorsing bed nets).  

  #### **Step 4: Authority & Legacy Check (Validates Who Trades)**  
  **Question:** *Does each party have legitimate authority to trade, especially if bound by legacy restrictions?*  
  - **Evidence required:**  
    - Board resolutions approving the trade.  
    - For endowed funds/deceased donors: Legal opinion on donor intent + letter of wishes.  
  - **Hard stop if:**  
    - Trade violates a **legally binding restriction** (e.g., donor’s letter) or party lacks authority (reject; "unauthorized trade").  
  - **Values call if:**  
    - Donor intent is ambiguous. Committee votes on: "Is this trade faithful to the spirit of the restriction?"  
  - *Your prep:* For deceased donors, involve your legal counsel pre-meeting.  

  #### **Step 5: Journalist Test (Ensures Defensibility)**  
  **Question:** *Can we explain this trade in one sentence that survives bad-faith scrutiny?*  
  - **Template:** "We enabled [Group A] to achieve [their value] and [Group B] to achieve [their value], with each doing something the other wanted but wouldn’t have done alone."  
  - **Hard stop if:**  
    - The explanation implies coercion, absurdity, or wasted funds (e.g., "Foundation pays charity to do thing it thinks is worthless" → reject; "indefensible optics").  
  - **Values call if:**  
    - Sentence is technically true but uncomfortable. Committee votes.  
  - *Your prep:* Draft the sentence; test it on a skeptic.  

  #### **Step 6: Committee Decision**  
  - **Passed all steps?** → **Approve** with capped funding if applicable.  
  - **Values call flagged?** → Committee vote (majority wins). Trustee breaks ties.  
  - **Hard stop hit?** → **Reject** with reason.  
  - **Deadlock?** → Default to reject.  

  ---

  ### **Application to Your Cases**  
  *Committee notes assume your prep filled evidence gaps.*

  #### **Case 1: Health Charity vs. Animal Charity**  
  - **Step 0:** Likely pass. Health charity wouldn’t run animal programs (counterfactual: mission focus); animal charity wouldn’t distribute bed nets (counterfactual: advocacy against human-centric aid).  
  - **Step 1:** **Fail.** Asymmetry mismatch: Health charity values bed nets (£10k/life saved) but *receives* animal programs (which they value at £0). Animal charity values ending fish farming (£1k/ton) but *receives* bed nets (valued at £0). No mutual benefit → **Reject.**  
  - *Committee note:* "Not a trade. Each is paid to do unwanted work. Counterfactual valid, but values misaligned. Fund separately if desired."  

  #### **Case 2: Alliance Threatens Lawsuit**  
  - **Step 0:** Pass. Alliance would sue (counterfactual: past lawsuits); health grantees wouldn’t fund Alliance (counterfactual: adversarial relationship).  
  - **Step 1:** Pass. Alliance values funding (£300k for CHWs); health grantees value dropped lawsuit (£500k in delays avoided). Cap funding at £300k.  
  - **Step 2:** **Hostage deal → Extortion.** Threat ("sue unless paid") is contingent on trade + irreversible harm if suit proceeds. **Reject.**  
  - *Committee note:* "Alliance’s threat manufactured for leverage. Even if credible, journalist test fails: 'Foundation pays group to drop lawsuit.' Unacceptable risk."  

  #### **Case 3: Religious Hospital (Maternal Health for Chaplaincy)**  
  - **Step 0:** Pass. Hospital wouldn’t offer maternal health (counterfactual: board vote against expansion); foundation wouldn’t fund chaplaincy (counterfactual: policy excludes faith-based work).  
  - **Step 1:** Pass. Hospital values chaplaincy (£200k "spiritual care"); foundation values maternal health (£500k/lives saved). Cap at £200k.  
  - **Step 2:** Not hostage (hospital isn’t threatening harm; it’s withholding a benefit). Pass.  
  - **Step 3:** **Your dirty hands.** Foundation believes chaplaincy is harmful. Query: "Do we have ethical objections?" If yes → **reject.**  
  - **Journalist test:** "Foundation funds hospital chaplaincy to secure maternal health services." High risk; sounds like "paying for something worthless."  
  - **Verdict:** **Reject at Step 3** (if foundation objects) or **Step 5** (if journalist test fails).  
  - *Committee note:* "Your objection is valid: Funding activities you deem harmful violates core integrity. If overruled, note: 'We tolerate partner values we dislike to secure life-saving services.' Strongest objection: Complicity in harm."  

  ---

  ### **What the Frame Can’t Do (When to Avoid Moral Trades)**  
  Use ordinary grantmaking instead when:  
  1. **Values are reconcilable:** If education/bridge-building could resolve the dispute (e.g., health and animal charities jointly advocating for humane bed nets).  
  2. **Power imbalances:** One party is desperate (e.g., a clinic extorted for funds). Moral trades require mutual consent, not coercion.  
  3. **Public goods:** Actions benefiting non-parties (e.g., climate policy). Trades privatize gains and exclude stakeholders.  
  4. **Truth disputes:** If disagreement is about facts (e.g., "Does this drug work?"), fund research, not trades.  
  5. **Minor stakes:** When the cost of structuring the trade outweighs benefits (e.g., under £10k).  

  **Final note:** Moral trades excel in deadlocked, high-stakes conflicts with intractable values. They fail when misused as cheap fixes for politics or complex justice issues. Your procedure prioritizes rigor over volume—reject fast, fund rarely.
