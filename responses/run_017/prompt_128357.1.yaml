answer: |-
  Here's my ranked list of open questions for your funding consideration, followed by the reasoning and criteria. I'll embed your three unresolved issues within the ranking and conclude with proposed indicators.

  **Ranking:**
  1.  **Transition Mechanism Taxonomy:** Mapping feasible pathways from multipolarity to singleton-like outcomes (including your four variants), identifying irreversible decision points and early intervention levers.
  2.  **Failure Mode Specificity:** Diagnosing how *different singleton structures* (veto-only, domain-scoped, etc.) uniquely fail or corrupt, focusing on systemic fragility over value alignment.
  3.  **Epistemic Bottleneck Quantification:** Measuring how single-agency error correlation compounds risks in specific domains (e.g., AI safety paradigms, biosecurity) versus multipolar "experiment diversity."
  4.  **Constitutional Precommitment Viability:** Testing whether binding constraints (e.g., preserving value diversity, sunset clauses) can credibly persist under singleton-level capabilities.
  5.  **Signaling & Coordination Under Drift:** Exploring how actors in a fragmenting multipolar system can signal commitment to anti-concentration norms or negotiate "circuit breakers" without central enforcement.

  **Reasoning & Criteria:**
  I'm prioritizing **leverage** (does progress here materially change decisions?), **tractability** (can theorists make headway in 18 months with no lab/compute?), and **neglect** (is the field overlooking this?). Crucially, I'm deprioritizing questions where answers wouldn't alter actions ("so what?" tests) or are intractable/overly debated. Your three issues are addressed within the rankings:

  1.  **Transition Mechanism Taxonomy (Integrates your "byproduct" concern):** This is highest-leverage because if singletons emerge accidentally, understanding *how* is prerequisite to any intervention. It directly addresses your worry that normative debates are moot without transition models. Tractability: Philosophers/theorists can catalog historical near-misses (e.g., nuclear close calls, tech monopolization), model abstract commitment games, and identify "point-of-no-return" signatures. Neglected because most work assumes singleton as deliberate choice. *Evidence shift:* New data on AI/geopolitical tipping points (e.g., AI lab exits from treaties) would elevate this. *Defund alternative:* "Is a singleton desirable?" is unfundable here—it’s either intractable or irrelevant if emergence is involuntary.

  2.  **Failure Mode Specificity (Integrates your "concept bundle" concern):** Your intuition that risks vary wildly across singleton types is correct. Funding this cuts through reductive debates by forcing analysis of *which* structures mitigate corruption, lock-in, or error catastrophe. Tractability: Conceptual case studies comparing, say, a gene-drive veto regime vs. a full AI sovereignty can be done with existing tools. Neglected as critics often attack a singleton strawman. *Evidence shift:* Real-world analogues (e.g., how the ICANN/W3C domain-scoped models handle power grabs) would provide test cases. *Defund alternative:* Generic "tyranny risk" studies—downstream of understanding specific failure modes.

  3.  **Epistemic Bottleneck Quantification (Integrates your "epistemic case" concern):** Separates the knowledge problem from tyranny by asking: "When does single-agency error correlation make disasters *inevitable* even with goodwill?" Leverage comes from identifying domains where multipolar experimentation is irreplaceable (e.g., AI alignment approaches). Tractability: Formal philosophers can adapt models from distributed systems theory or epistemic network analysis. Neglected—the epistemic case is often handwaved. *Evidence shift:* If multipolar AI labs converge on identical safety approaches, this problem de-prioritizes; if they diverge radically, it surges.

  4.  **Constitutional Precommitment Viability:** Tests whether your "strange target" (e.g., diversity-preserving constitutions) is feasible under singleton-level incentives. High leverage because if precommitments are impossible, efforts to design "good" singletons are futile. Tractability: Game theorists can model enforcement under asymmetric capability growth. Neglected in favor of designing constitutions, not stress-testing them. *Evidence shift:* If leading AI labs unilaterally adopt binding ethics reviews, fund this; if all such agreements collapse under pressure, deprioritize as intractable.

  5.  **Signaling & Coordination Under Drift:** Addresses the "what can grantees usefully say?" challenge. If concentration is drifting, finding ways to slow it via credible commitments (e.g., mutual tech moratoriums) has practical value. Tractability: Mechanism design and historical analogues (e.g., nuclear test bans) are within scope. Neglected for grand-strategy proposals. *Evidence shift:* New arms-race dynamics (e.g., in quantum/AI) would boost relevance; proven coordination failures drop it.

  **Indicators to Track:**
  Allocate a small monitoring budget to track:
  -   **Capability Concentration Index (CCI):** Public data on compute, talent, and capital distribution among top AI/tech entities. Compute as the Gini coefficient for AI training flops among ~5 major players. *Redo trigger:* If CCI Gini >0.8 for two consecutive years, revisit priorities—drift may be accelerating beyond theoretical intervention.
  -   **Unilateral Policy Adoption Rate (UPAR):** Frequency with which one actor (state or corp) sets de facto global standards (e.g., AI ethics frameworks, genetic data rules) without multilateral agreement. Track via academic/policy databases. *Redo trigger:* If UPAR increases >50% year-on-year, signaling/coordination (Rank #5) becomes urgent.
  -   **Cross-Domain Fragmentation Score (CDFS):** Measures whether power is concentrating uniformly or only in pockets. Composite of indices for military, tech, finance, and biosecurity hegemony (e.g., using Herfindahl indices based on public market/patent/treaty data). *Redo trigger:* If CDFS variance falls sharply (all domains concentrating synchronously), Transition Mechanisms (#1) and Failure Modes (#2) dominate; if variance rises, domain-scoped singletons may be more likely.

  This ordering funds questions where conceptual work can inform *actions* (designing constraints, building coalitions, monitoring drift) within your constraints. It deliberately sidelines debates settled in practice (e.g., pure tyranny risks—avoided via your singleton variants) or intractable in 18 months (value alignment under concentration). The indicators ground speculation in measurable trends, ensuring your committee’s theme stays relevant amid real-world shifts.
