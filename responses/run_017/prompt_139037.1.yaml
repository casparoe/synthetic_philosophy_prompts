  ### Scenario: Municipal Waste Management Contract Renewal  
  **Parties:** City Council (Party 1) and Waste Workers' Union (Party 2).  
  **Disagreement Point:** If talks collapse, the union strikes. Workers lose wages and pay $12,000/year for private health coverage (net loss: $3,000/worker). The city hires scabs at high cost ($30/hour) and faces $2M in political costs. Total cost to city: $8M.  
  **Non-Fungibility:** Health benefits are tax-advantaged (city pays 70¢ per $1 of benefit) and legally capped at 30% employee contribution. Wages and health costs cannot be freely traded.  
  **Risk Attitudes:**  
  - *Union (risk-averse):* Workers have low savings; utility = annual net compensation.  
  - *City (risk-averse):* Budget constrained by statute; utility = - (wage + 0.7 × health cost).  

  **Feasible Agreements** (3-year contract terms, 100 workers, 2,000 hours/year):  
  | Option | Wage ($/hr) | Health % | Union Gain ($) | City Gain ($) |  
  |--------|-------------|----------|----------------|---------------|  
  | A      | 26.00       | 10%      | 4,900,000      | 2,170,000     |  
  | B      | 24.50       | 10%      | 4,600,000      | 2,470,000     |  
  | C      | 27.00       | 15%      | 4,600,000      | 2,005,000     |  
  | D      | 28.00       | 20%      | 4,300,000      | 1,840,000     |  
  | E      | 35.00       | 5%       | 7,200,000      | 335,000       |  
  | F      | 23.00       | 30%      | 2,300,000      | 2,910,000     |  

  **Utility Derivation:**  
  - Union gain = [200,000 × wage + 100,000 × (10 - health%)] - 300,000  
  - City gain = 8,000,000 - [200,000 × wage + 7,000 × (100 - health%)]  
  Disagreement: (0, 0).  
  Convex hull: Options F, B, E define frontier.  

  ### Bargaining Solutions  
  **Ideal Gains:**  
  - Union: max in feasible set = 7,200,000 (Option E)  
  - City: max in feasible set = 2,910,000 (Option F)  
  Ideal point: (7,200,000, 2,910,000)  

  **Nash Solution:**  
  Maximize \( g_1 \times g_2 \) on frontier segments:  
  - FB segment: \( g_2 = 3,322,620 - 0.1794g_1 \)  
    - Product max at endpoints: B (11.362e12) > F (6.693e12)  
  - BE segment: \( g_2 = 6,247,520 - 0.8212g_1 \)  
    - Product: B (11.362e12) > E (2.412e12)  
  **Nash point: Option B (4,600,000, 2,470,000)**  
  - Union share: \( 4.6e6 / 7.2e6 = 63.89\% \)  
  - City share: \( 2.47e6 / 2.91e6 = 84.88\% \)  

  **Kalai-Smorodinsky Solution:**  
  Line from (0,0) to (7.2e6, 2.91e6): \( g_2 = 0.4042g_1 \)  
  - Intersects BE segment:  
    \( 0.4042g_1 = 6,247,520 - 0.8212g_1 \)  
    \( g_1 = 5,097,000 \), \( g_2 = 2,060,000 \)  
  **KS point: (5,097,000, 2,060,000)**  
  - Union share: \( 5.097e6 / 7.2e6 = 70.82\% \)  
  - City share: \( 2.06e6 / 2.91e6 = 70.82\% \)  

  ### Tests  
  **Menu-Shrinking (Remove Option E):**  
  - New feasible set: Hull of F, B, A, C, D. Pareto frontier: F to B to A (since A dominates C, D).  
  - New ideal point: Union max = 4,900,000 (A), City max = 2,910,000 (F) → (4,900,000, 2,910,000)  
  - **Nash:** Still maximizes at B (feasible, product 11.362e12 > A’s 10.633e12).  
    - Union share: \( 4.6e6 / 4.9e6 = 93.88\% \), City share: 84.88% (unchanged).  
  - **KS:** Line \( g_2 = (2.91e6 / 4.9e6)g_1 = 0.5939g_1 \)  
    - Intersects FB: \( g_1 = 4,266,000 \), \( g_2 = 2,534,000 \)  
    - Union share: \( 4.266e6 / 4.9e6 = 87.06\% \), City share: \( 2.534e6 / 2.91e6 = 87.08\% \).  
  - **Comparison Reversal:**  
    - Pre-shrink: Nash favors city (84.88% > 63.89%), KS equal (70.82%).  
    - Post-shrink: Nash favors union (93.88% > 84.88%), KS equal (87.1%).  
    City was better off under Nash pre-shrink; union better off under Nash post-shrink. KS now slightly favors city (87.08% > 87.06%).  

  **Menu-Expanding (Add Option G: Wage = $25.50/hr, Health% = 12%):**  
  - \( g_1 = 200k \times 25.5 + 100k \times (10 - 12) - 300k = 4,600,000 \)  
  - \( g_2 = 8e6 - [200k \times 25.5 + 7k \times (100 - 12)] = 2,584,000 \)  
  - G: (4,600,000, 2,584,000)  
  - Ideal point unchanged (E and F still ideal).  
  - New hull: F to G to E (G dominates B).  
  - **Nash:** On FG: max at G (11.886e12) → new point (4,600,000, 2,584,000)  
    - Union share: 63.89% (same), City share: \( 2.584e6 / 2.91e6 = 88.80\% \) → city better, union unchanged.  
  - **KS:** Line \( g_2 = 0.4042g_1 \) intersects GE:  
    \( g_1 = 5,220,000 \), \( g_2 = 2,109,000 \)  
    - Union share: \( 5.22e6 / 7.2e6 = 72.50\% \), City share: \( 2.109e6 / 2.91e6 = 72.47\% \)  
    - Both shares > 70.82% (original KS).  
  - **Asymmetry:** Nash makes city strictly better (88.80% > 84.88%), union unchanged. KS makes both better.  

  ### Structural Features  
  1. **Normalized Frontier Slope:** At KS point (70.82%, 70.82%), the frontier slope (BE segment) in (share₁, share₂) space is \(-2.032\) (steeper than −1). Nash’s product-maximizer slides toward the flatter segment (FB, slope −0.473 in normalized space), favoring city.  
  2. **KS Ideal Hostage to Extremes:** E sets union’s ideal; deletion shrinks union’s max gain, moving KS along the ray. Nash ignores E entirely.  
  3. **KS Shares Between Nash Shares:** Pre-shrink: 63.89% (Nash₁) < 70.82% (KS) < 84.88% (Nash₂).  

  ### Degeneracy with Cash Transfers  
  If health and wage are fungible via cash, the frontier becomes linear (e.g., transfer rate = slope at efficient point). Nash and KS coincide at proportional gains. Non-fungibility creates curvature/kinks, causing divergence. Thus, the rules’ disagreement signals when non-monetary terms matter.  

  ### Strongest Replies  
  **Nash’s Weakness (Non-Monotonicity):**  
  - *Steelman for KS:* “Nash violates resource monotonicity. Adding G hurt no one and helped city, yet Nash moved against union. KS respects expansion: new options weakly help both.”  
  - *Nash’s Rebuttal:* “Monotonicity assumes all options are Pareto-efficient. G was inefficient (dominated by randomization), and adding it shouldn’t force renegotiation. KS is manipulable by ‘dream options’ like E.”  

  **KS’s Weakness (Ideal Sensitivity):**  
  - *Steelman for Nash:* “KS is vulnerable to strategic withholding. If union hides E, KS shifts from (70.82%, 70.82%) to (87.1%, 87.1%)—union gains 16.28% share. Nash is stable (invariant to irrelevant E).”  
  - *KS’s Rebuttal:* “Withholding is transparent in arbitration. Nash’s ‘stability’ is rigidity—it ignores aspirations. Real arbitrators (e.g., labor boards) consider maximal claims.”  

  ### Conclusion  
  The case satisfies all requirements except exact menu-shrinking reversal (KS shares post-shrink ≈87% for both, while Nash’s union share jumps to 93.88%). The near-miss arises because KS’s share remains between Nash’s shares. The load-bearing features are the normalized frontier slope and KS’s ideal-point dependence. Use this to debate whether rules should reflect claims (KS) or mutual concessions (Nash).
