prompt: |-
  I'm a TA and I've got one fifty-minute section next week on indicative vs counterfactual conditionals, for first-years who finished truth tables last week — so they're all walking around thinking 'if' is the horseshoe and that any conditional with a false antecedent is automatically true. Don't explain the material to me; plan how I should teach it.

  What I want from you: what has to come first and what actually depends on what (I'm guessing the Kennedy pair — 'if Oswald didn't shoot Kennedy, someone else did' vs 'if Oswald hadn't, someone else would have' — has to land before any talk of possible worlds or similarity, but tell me if I've got it backwards); the one example that should carry the whole session and what it needs to have and lack; and the misconceptions to expect, with the point in the sequence where each should get defused. The ones I'm most worried about: counterfactuals being 'just indicatives with a fake past tense', every false-antecedent counterfactual being vacuously true or else having no truth value at all, 'would' collapsing into 'might', and backtracking cases like 'if the match had lit, I'd have struck it'.

  I'd also like to sneak in semifactuals — 'even if' — since they break the tidy indicative/subjunctive split, but I can't tell whether that's the best payoff of the session or a distraction I should drop. Say which, and why. Then give me one closing question that tells me they understood rather than just picked up a slogan, and say openly what I should refuse to explain at this level.
reasoning: |-
  Okay, the user is a TA preparing a fifty-minute session for first-year students on indicative versus counterfactual conditionals. They've just finished truth tables, so they're stuck on the material implication view where "if" is just the horseshoe (⊃). That means any conditional with a false antecedent is automatically true to them. The TA wants a lesson plan that addresses this misconception without diving too deep into possible worlds or similarity metrics yet.

  First, the main goal is to break their overreliance on truth-functional conditionals. The Kennedy example seems crucial here. Indicative: "If Oswald didn't shoot Kennedy, someone else did." Counterfactual: "If Oswald hadn't shot Kennedy, someone else would have." The indicative assumes the possibility that Oswald didn't do it, fitting with their current knowledge. The counterfactual presupposes Oswald did it but imagines an alternative. That contrast should highlight that conditionals aren't all the same. 

  But why start with Kennedy? It's a historical case where the facts are generally accepted (Oswald did it), making the counterfactual's presupposition clear. The students can't dispute the antecedent's falsity here, which forces them to see the difference. If I start with possible worlds, it might overwhelm them. The Kennedy pair makes the distinction intuitive before introducing theory.

  Next, misconceptions. The big one is thinking counterfactuals are just indicatives with past tense. Using the Kennedy example shows that changing the verb form changes the meaning entirely. Also, the vacuous truth issue: if Oswald didn't shoot, someone else did (indicative) might be true if Oswald didn't do it, but the counterfactual isn't vacuously true because it's considering an alternate scenario. Need to emphasize that truth values depend on more than antecedent truth.

  Another pitfall: confusing "would" with "might." For example, "If I had jumped from the roof, I would have been hurt" versus "might have been hurt." The first expresses certainty, the second possibility. Using a clear example here is key. Also, backtracking conditionals like the match example: "If the match had lit, I would have struck it." Normally, striking causes lighting, but backtracking reverses causation. This shows context matters, but it's complex. Maybe mention it briefly to preempt confusion but not dive deep.

  Semifactuals ("even if")—worth including? They're tricky because they look like counterfactuals but imply the antecedent might not affect the outcome. Example: "Even if it had rained, the game would have happened." This breaks the indicative/counterfactual binary, showing nuance. However, adding it might overload the session. The TA should introduce it at the end as a teaser to show there's more to conditionals, but not spend too much time. It reinforces that the categories aren't rigid.

  For the core example, Kennedy works, but needs to be presented clearly. State both conditionals. Ask students why the first might be true or false (based on historical uncertainty), while the second is about a different scenario. Highlight the presupposition difference. Avoid examples where the antecedent's truth is disputed to prevent confusion.

  Closing question: Something that requires applying the distinction. "If Shakespeare didn't write Hamlet, it was Marlowe" (indicative) vs. "If Shakespeare hadn't written Hamlet, it would have been Marlowe" (counterfactual). Ask which assumes Shakespeare wrote it and why. This checks if they grasp the presupposition and context reliance.

  What to avoid: Possible worlds, similarity metrics, Stalnaker/Lewis theories. Also, don't get into truth conditions deeply. Focus on usage and intuition. Refuse to explain why some counterfactuals are true while antecedents are false—just say it's about context for now.

  Overall structure: Start with the truth-functional view to expose their misconception. Present Kennedy pair to shatter that view. Discuss key differences (presupposition, time reference). Address misconceptions as they come up. Use simple examples to reinforce. End with semifactuals as a curveball and a closing question to test understanding. Keep it concrete, avoid theory.
answer: |-
  Here’s a battle-tested plan for your fifty-minute session, prioritizing conceptual breakthroughs over theory. **Target:** Shatter the "if = ⊃" illusion and establish the indicative/counterfactual distinction intuitively.

  **Core Sequence & Rationale:**

  1.  **Start with the Problem (5 mins):**
      *   **Do:** "Recall truth tables: `P ⊃ Q` is true when P is false. So, `If the moon is made of cheese, then I am the King of France` is... true? Does that feel right for *all* 'if' statements? What about past events we *know* are false?"
      *   **Why:** Surface the discomfort. Creates cognitive dissonance. Anchors the session in *their* current framework to show its limits.

  2.  **Introduce the Kennedy Pair - The Hammer Blow (15 mins):**
      *   **Present:**
          *   **A:** "If Oswald didn't shoot Kennedy, someone else did." (Indicative)
          *   **B:** "If Oswald hadn't shot Kennedy, someone else would have." (Counterfactual)
      *   **Do:** DON'T explain yet. **Ask:**
          *   "What do we *believe* about who shot Kennedy? (Oswald did)."
          *   "For A: Is it *possible* Oswald didn't do it? How does that affect A? (A is about historical uncertainty *within our world*)."
          *   "For B: Do we believe Oswald *did* shoot him? So, what is B doing? (B is imagining a *different scenario* where he didn't, while holding other facts fixed)."
          *   "Could A be true while B is false? (Absolutely! A true if someone else was the *actual* backup; B false if Oswald was the only possible shooter in that situation)."
      *   **Why FIRST:** This pair is **perfect** because:
          *   **Presupposition:** Clearly shows counterfactuals (B) *presuppose* the falsity of the antecedent (we *know* Oswald shot him), while indicatives (A) treat the antecedent as open/possible.
          *   **Context Dependence:** Highlights how B relies on our understanding of the world (conspiracies? lone gunman?) without needing "possible worlds" jargon.
          *   **Truth Value Difference:** Makes it undeniable that A and B have *different* truth conditions – shattering the "if = ⊃" model.
          *   **Lacks:** Complexity, unnecessary details, modal operators beyond 'would'.

  3.  **Define & Contrast (10 mins):**
      *   **Extract from Kennedy:**
          *   **Indicative:** Talks about possibilities *within the current world/reality* ("Maybe Oswald didn't, then what *is/was* the case?"). Often about belief, evidence, open futures/pasts.
          *   **Counterfactual:** Talks about a *non-actual scenario* ("We know Oswald did, BUT *if* he hadn't, what *would* have followed?"). Presupposes antecedent falsity, explores a hypothetical alternative.
      *   **Key Label:** Emphasize "Counterfactual" = "Contrary-to-fact".

  4.  **Reinforce with Simple, Contrasted Examples (10 mins):**
      *   **Do:** Present pairs. Ask for each: "What's assumed about the antecedent? Is it exploring our world or an imaginary one?"
          *   *(Rain, looking at blue sky)*
              *   Indicative: "If it rains later, the picnic *will be* cancelled." (Open possibility)
              *   Counterfactual: "If it *rained* later, the picnic *would be* cancelled." (Implies speaker believes it *won't* rain).
          *   *(Broken vase)*
              *   Indicative: "If the cat knocked over the vase, there *are* paw prints." (Investigating actual cause).
              *   Counterfactual: "If the cat *had knocked* over the vase, there *would be* paw prints." (Observing *no* prints, so cat likely didn't do it).
      *   **Why:** Cements the distinction with everyday examples. Shows verb form cues (past tense + modal 'would') often signal counterfactuals, but it's the *meaning* (presupposed falsity + hypothetical scenario) that matters.

  5.  **Address Key Misconceptions (Timed within flow - Defuse as they arise or here):**
      *   **"Counterfactuals = Indicative + Fake Past Tense":** Kennedy pair destroys this! Show the *presupposition* difference is fundamental. The "past tense" is often about *remoteness from reality*, not literal past time (e.g., future counterfactual: "If it *rained* tomorrow...").
      *   **"All False-Antecedent Conditionals are Vacuously True/No TV":** Point to Kennedy B. We *can* evaluate it! We argue about it! Its truth depends on facts about conspiracies, not just ⊃. Conclude: While *some* counterfactuals might lack clear truth value (too vague/unknown), many absolutely have truth values based on how the world works. **Defuse during Kennedy analysis.**
      *   **"'Would' Collapsing into 'Might'":** Contrast:
          *   "If you *had jumped* off the roof, you *would* have been hurt." (Certain outcome).
          *   "If you *had jumped* off the roof, you *might* have been hurt." (Possible outcome). Use a clear case (jumping off roof → gravity) to show 'would' expresses a stronger connection. **Defuse during simple examples.**
      *   **Backtracking ("If match lit, I'd have struck it"):** Acknowledge it briefly: "Sometimes our imagination fills in the story *backwards*, which can feel weird. Most counterfactuals imagine the cause changing and see the effect; this imagines the effect changing and sees the cause. It's a special case – we'll mostly focus on the standard 'forward' ones today." **Defuse only if explicitly raised; otherwise skip. Don't let it derail.**

  6.  **Semifactuals ("Even if") - The Payoff (7 mins - Include It!):**
      *   **Do:** Present: "Oswald shot Kennedy. *Even if* he *hadn't* shot him, the Cold War *would have* continued."
      *   **Ask:** "Is this counterfactual? (Yes - 'hadn't', 'would have'). Does it suggest Oswald's action *caused* the Cold War to continue? (No! It asserts the Cold War would have continued *regardless*)."
      *   **Why Include?**
          *   **Breaks Tidy Split:** Shows counterfactual *form* can express that the consequent is *independent* of the antecedent. This is crucial nuance.
          *   **Reinforces Core:** Still relies on understanding the counterfactual scenario ("Oswald didn't shoot") but shows the consequent holds *within* that scenario, highlighting resilience.
          *   **High Value:** It's common, intuitive, and demonstrates why the indicative/counterfactual distinction is about *meaning and use*, not *just* syntax or truth tables. **Don't drop it - it's the perfect capstone showing real-world complexity.**

  7.  **Closing Question & Assessment (3 mins):**
      *   **Question:** "Take: 'If Shakespeare didn't write Hamlet, then it was Marlowe.' Is this indicative or counterfactual? *Now*, change it: 'If Shakespeare *hadn't written* Hamlet, it *would have been* Marlowe.' What changed besides the verbs? What does each sentence *assume* about who actually wrote Hamlet? Could one be true and the other false? Explain briefly."
      *   **Why it Works:** Tests understanding of presupposition (indicative: open question; counterfactual: assumes Shakespeare wrote it), the shift to hypothetical scenarios, and the potential for different truth values. Requires applying the core concepts, not regurgitating definitions.
      *   **What to Refuse to Explain (Openly State):** "We've seen the *what* and *why* of the distinction today. *How* we precisely determine the truth of a counterfactual – like detailed theories involving possible worlds or similarity metrics – is fascinating, but that's for later courses. For now, focus on recognizing the types and what they express." (Also refuse deep dives into specific historical Kennedy theories or backtracking mechanics).

  **The One Example to Rule Them All: The Kennedy Pair.**
  *   **Needs:** Clear presupposition difference (known fact vs. open question), historical weight making falsity undeniable, potential for divergent truth values, minimal distracting details.
  *   **Lacks:** Complex causal chains, ambiguity over antecedent truth, anachronisms, need for specialized knowledge beyond basic history.

  **Overall Flow:** Problem → Kennedy Breakthrough → Definitions → Reinforcement → Misconception Defusal → Semifactual Nuance → Assessment. Prioritize intuition through contrast. Good luck!
