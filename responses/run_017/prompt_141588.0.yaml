  Below is a decision tree designed to help students articulate their intuitions about historical contingency and path dependence across anonymized cases. The tree has 8 branch nodes (questions) and 7 terminal leaves (positions). Each branch node is phrased as a concrete question about a case, answerable without prior knowledge of the debate. The tree explicitly tracks the three distinctions you requested:  
  - **Counterfactual operation** (rewind/replay/perturbation) is noted at each node.  
  - **Outcome identity** (token/function/coarse) is forced at key branches.  
  - **Mechanism of persistence** (ratchet/one-off/attractors/perception) is the final discriminator.  

  Unclaimed positions are marked, with reasons noted. Distinctions that cannot be separated are flagged. Two example paths (Student A and B) are traced at the end.  

  ---

  ### **Decision Tree: Is History "Locked In"?**  
  *Instructions: For a given case, start at Node 1. Answer based on your intuition about whether a small change would alter the outcome. Follow the branches to a leaf (position).*  

  1. **Node 1 (Counterfactual: Replay)**:  
     *If we re-ran this entire sequence from the start, with identical initial conditions, would the outcome likely be similar?*  
     - **Yes** → Node 2.  
     - **No** → Leaf 1: **Strong Contingency** (e.g., Gould).  
       *Commitment: Outcomes are wildly sensitive to initial chaos; no convergence.*  

  2. **Node 2 (Counterfactual: Rewind)**:  
     *If we removed one small event (e.g., the late arrival in the harbour gauge) and let history unfold, would the outcome be identical in every detail?*  
     - **Yes** → Node 3.  
     - **No** → Node 4.  

  3. **Node 3 (Counterfactual: Rewind)**:  
     *Why would it stay identical? Is it due to...*  
     - **System stability?** (Small changes wash out) → Leaf 2: **Attractor Inevitability**.  
       *Commitment: Processes have equilibria; noise doesn’t alter macro-outcomes.*  
     - **The event’s irrelevance?** (It was decorative, not causal) → Leaf 3: **Event Inconsequential** (Unclaimed).  
       *Commitment: History has "deadwood" events with no lasting effect.*  
     - **Data/categories?** (Later actors would perceive the same reality) → Leaf 4: **Perceptual Inevitability** (Unclaimed).  
       *Commitment: Administrative grids determine legibility, not events.*  

  4. **Node 4 (Counterfactual: Rewind)**:  
     *Under this change, would the outcome still serve the same societal function? (e.g., pensions exist, but design differs).*  
     - **Yes** (Same function) → Node 5.  
     - **No** (Function changes) → Leaf 1: **Strong Contingency** (e.g., Gould).  
       *Note: Forces outcome away from "same function" claims.*  

  5. **Node 5 (Counterfactual: Perturbation)**:  
     *If we slightly nudged an initial condition (e.g., soil fertility in the two valleys), would trajectories diverge at first but later reconverge?*  
     - **Yes** → Leaf 5: **Functional Convergence** (e.g., functionalism).  
       *Commitment: Needs drive solutions; routes vary but endpoints align.*  
     - **No** → Node 6.  

  6. **Node 6 (Mechanism Focus)**:  
     *In actual history, once the outcome emerged, what prevented reversal?*  
     - **Self-reinforcement** (Reversal gets costlier over time) → Leaf 6: **Path Dependence w/ Ratchet** (e.g., Arthur).  
       *Commitment: Early accidents lock in via increasing returns.*  
     - **No reinforcement** (It stuck but wasn’t reinforced) → Leaf 7: **Critical Juncture** (e.g., Collier).  
       *Commitment: One-off shifts need no ratchets; inertia suffices.*  
     - **Perception** (Categories hid alternatives) → Leaf 4 (same as Node 3).  
       *Flag: Cannot separate from Perceptual Inevitability mechanistically; distinction is whether categories are themselves contingent.*  

  7. **Node 7 (Outcome Identity)**:  
     *When you say "the same outcome," do you mean identical distributional effects (e.g., pensions have same gender gaps)?*  
     - **Yes** (Token or distributional match) → Return to Node 3 (to explain why).  
     - **No** (Coarse similarity only) → Node 8.  
       *Note: Forces "same thing" into token/function/coarse.*  

  8. **Node 8 (Mechanism Focus)**:  
     *Despite distributional differences, what explains the coarse similarity?*  
     - **Attractors** (Variations regress to a mean) → Leaf 2: **Attractor Inevitability** (e.g., systems theory).  
     - **Perception** (Categories define what "counts" as the outcome) → Leaf 4: **Perceptual Path Dependence** (e.g., bureaucratic legibility).  
     - **No deep mechanism** (Coincidence) → Leaf 3: **Event Inconsequential** (Unclaimed).  

  ---

  ### **Leaf Positions Summary**  
  | Leaf | Name                          | Holder’s Commitment                                      | Status              |  
  |------|-------------------------------|----------------------------------------------------------|---------------------|  
  | 1    | Strong Contingency            | History has no attractors; chaos dominates.              | Gould              |  
  | 2    | Attractor Inevitability       | Systems buffer noise; distributional details may vary.   | Systems theory     |  
  | 3    | Event Inconsequential         | Some events are epiphenomenal; outcomes overdetermined.  | Unclaimed (trivial)|  
  | 4    | Perceptual Path Dependence    | Categories lock in legibility, not substantive outcomes. | Historical institutionalism |  
  | 5    | Functional Convergence        | Functions are inevitable; forms are contingent.          | Functionalism     |  
  | 6    | Path Dependence w/ Ratchet    | Early accidents lock in via increasing returns.          | Arthur, Pierson   |  
  | 7    | Critical Juncture             | Contingency matters once; persistence needs no ratchet. | Collier           |  

  **Unclaimed Combinations & Why**:  
  - **Token identity via replay**: *Incoherent*. If replay yields identical tokens, it denies contingency entirely—contradicting the premise of re-running.  
  - **Functional inevitability with ratchet**: *Unattractive*. If functions are inevitable, why would a ratchet be needed? Functionalists avoid this.  
  - **Coarse similarity via one-off shift**: *Unexplored*. No major theory argues distributional differences persist without attractors/perception.  

  **Indistinguishable Leaves**:  
  - **Leaf 4 (Perceptual)** in Node 3 vs. Node 6/8: The tree cannot separate whether categories are *inevitable* (Node 3) or *contingent but persistent* (Node 6/8). This reflects a real ambiguity in the literature (e.g., Mahoney vs. Thelen).  

