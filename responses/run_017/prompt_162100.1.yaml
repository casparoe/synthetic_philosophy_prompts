prompt: |-
  You are a philosopher of physics who specializes in the foundations of quantum mechanics and who is used to explaining fine distinctions to intelligent non-specialists. Please think carefully: before you settle on an answer, brainstorm the candidate concepts, discard the ones that don't fit, and tell me in a line or two what you discarded and why. A careful carve-up matters more to me than a quick label, and please don't send me to papers or author names — I want the distinctions themselves, not a reading list.

  I'm a software engineer with no physics beyond a first-year course, and I read about Bell's theorem on weekends for fun. I keep running into a pattern in what I read that I can't name, and it isn't quite the pattern I expected it to be.

  First case. Someone describes a theory in which the particles leave the source carrying a full set of instructions for every detector setting they might meet, so that the instructions settle in advance what each detector will flash. The objection comes: Bell showed that no local theory of that kind can match the quantum predictions. The reply: but I can't use it to send you a message — whatever I do at my end, the pattern of flashes at your end looks exactly the same. And the answer: that's beside the point, your theory is still nonlocal, because what flashes at my end has to depend on which setting you chose.

  Second case, reversed. Someone says that Bell's result shows nature is nonlocal, that there's a real dependence running from one wing of the experiment to the other. The challenge: a dependence you could signal with? No, you just conceded that no signalling is possible. The answer: it's a real dependence all the same, just one that can't be harnessed to send a message.

  So "local" seems to be doing at least two jobs: "nothing I do here changes what you can observe there," and "nothing that happens here depends on what you choose there." The third thing I noticed is what puzzles me most. When the dependence is instead between the instructions produced at the source and the experimenters' later choice of setting, writers don't call the theory nonlocal; they call it a conspiracy, or say the experimenters weren't really free. Yet the source and the detectors are all spatially separated, and it's the same kind of statistical dependence between distant things. That makes me wonder whether "nonlocal" is tracking spatial separation at all, or rather which pair of items the dependence holds between.

  Is there an established concept for the sliding between the first two senses — and is it plain equivocation, or something more specific that the field has noticed and named? What are the established names for the separate notions, including the third one, and which of them is the thing Bell's result actually forces you to give up? If nothing established fits, coin a term, define it, and give me the boundary cases: what would look like this phenomenon but not be it?
reasoning: |-
  Hmm, the user is a software engineer with some physics background who's been reading about Bell's theorem for fun. They've noticed a pattern in how "nonlocality" gets used in three different scenarios and wants to clarify the distinctions.

  First scenario: Theories with pre-set instructions (like hidden variables) are called nonlocal because the outcome at one detector depends on the other detector's setting. The "no signaling" defense gets dismissed as irrelevant to locality.

  Second scenario: When someone argues that nature itself is nonlocal (due to quantum entanglement), and the "no signaling" point is raised against it, proponents insist the dependence is real even if it can't be used for signaling.

  Third scenario bothers them most: When there's dependence between the source and the experimenters' choices (superdeterminism), it's called "conspiracy" or "lack of free will" rather than nonlocality - even though everything is spatially separated.

  They're noticing that "nonlocality" seems to slide between two concepts: 
  1) No causal influence across space (signaling) 
  2) Statistical dependence across space without causal influence 

  And they wonder if "nonlocality" is really about spatial separation at all or about which things are dependent. Specifically:
  - Why is source→choice dependence "conspiracy" but detector→detector dependence "nonlocality"?
  - Is this sliding between concepts recognized? Are there names for these separate notions?
  - What does Bell's theorem actually force us to give up?

  Key distinctions to clarify:
  - Parameter independence vs outcome independence (Shimony's terms)
  - Causal locality vs statistical locality 
  - The special status of measurement choices in Bell experiments

  The core confusion stems from three different types of statistical dependence in Bell scenarios:
  1) Between outcomes at A and settings at B → violates locality
  2) Between outcomes at A and outcomes at B → doesn't violate locality by itself
  3) Between hidden variables and future settings → "conspiracy" or superdeterminism

  What Bell's theorem actually forces us to give up is the combination of:
  - Parameter independence (settings at B don't affect outcomes at A)
  - Outcome independence (outcomes at B don't affect outcomes at A)
  - Statistical independence between hidden variables and measurement settings

  The user's really sharp to notice that "nonlocality" gets applied asymmetrically - we tolerate statistical dependence between particles but not between particles and choices. That's because measurement choices are treated as "free variables" in Bell's framework. If we abandon that freedom, we get superdeterminism instead of nonlocality.

  The established concepts that map to their observations:
  For the first sense ("no signaling"): Causal locality / no signaling
  For the second sense (statistical dependence): Nonlocal correlations (specifically violating parameter independence)
  For the third scenario: Superdeterminism or violation of measurement independence

  The "sliding" they noticed isn't exactly equivocation - it's that Bell nonlocality specifically means violation of parameter independence (dependence of local outcome on distant setting), which implies statistical dependence but not necessarily signaling. The field does recognize these as distinct but related concepts.

  I should emphasize that spatial separation matters crucially - it's about whether the statistical dependence requires faster-than-light influence given the spatial arrangement. The reason source→choice dependence isn't called nonlocality is because it could work through ordinary past light cone influences (if the source predetermined choices).
answer: |-
  You've pinpointed a crucial conceptual knot in Bell's theorem discussions. The distinctions you observe are real and named. Here's the careful carve-up:

  **Discarded Concepts & Why:**
  1.  **"Nonlocality = Faster-Than-Light (FTL) Signalling":** Discarded because Bell-nonlocal theories (like standard QM) explicitly *preclude* FTL signalling. The dependence exists without usable signalling.
  2.  **"Nonlocality = Any Statistical Dependence Between Spacelike-Separated Events":** Discarded because dependence between the source's state and *later* choices (your 3rd case) *is* spacelike separation dependence, but isn't called "nonlocality" in the Bell context.
  3.  **"Conspiracy = Nonlocality":** Discarded because the source-choice dependence *could* be explained by ordinary past-light-cone causation (if the source state influenced choices via slow, local paths), unlike detector-detector dependence.

  **The Established Concepts & Distinctions:**
  1.  **Parameter Independence:** No causal influence from the *setting choice* at detector B to the *outcome* at detector A (and vice-versa). Violating this means the outcome at A depends *causally* on what setting someone *chooses* at B. **This is the core of Bell-nonlocality.** Bell's theorem forces you to give this up if you want realism and reject superdeterminism.
  2.  **Outcome Independence:** No causal influence from the *outcome* at detector B to the *outcome* at detector A (and vice-versa). You can violate *this* (e.g., in de Broglie-Bohm) while *keeping* Parameter Independence and still avoid Bell-nonlocality (though such theories are usually nonlocal in other ways).
  3.  **No-Signalling:** No possibility of sending information (a signal) FTL by manipulating local settings. This is a *consequence* of quantum correlations, logically independent from but often conflated with locality. Theories violating Parameter Independence *must* carefully preserve No-Signalling to match QM (e.g., via fine-tuning or holism).
  4.  **Measurement Independence / "Freedom" / No-Conspiracy:** Statistical independence between the hidden state (λ) of the particle pair at the source and the *future choices* of detector settings. Violating this means the hidden state predetermines or correlates with the experimenters' *choices*. **This is your 3rd case.** It avoids Bell-nonlocality by sacrificing the independence of settings.

  **What Bell's Theorem Forces You To Give Up:**
  Bell's theorem proves that no theory can satisfy **all three** simultaneously:
      A.  **Realism** (Particles have definite pre-measurement properties)
      B.  **Locality** (Specifically, **Parameter Independence** + **Outcome Independence**)
      C.  **Measurement Independence**
  You *must* reject at least one. Standard QM rejects B (specifically Parameter Independence). Hidden variable theories like de Broglie-Bohm reject B (specifically Outcome Independence, while often preserving Parameter Independence via nonlocality elsewhere). "Superdeterminism" rejects C.

  **The "Sliding" You Observed & Its Name:**
  The sliding between your first two senses is the conflation of **Parameter Independence** (the causal dependence of outcome on *distant setting*) with **No-Signalling** (the impossibility of sending information). It's not pure equivocation; it stems from Parameter Independence being the *mechanism* that would *enable* signalling *if* Outcome Independence were also violated. Preserving No-Signalling while violating Parameter Independence requires subtlety (e.g., the dependence being "contextual" or globally constrained). The field recognizes this tension but lacks a single snappy name for the slide itself. It's often clarified by explicitly separating the two conditions (Parameter/Outcome Independence).

  **Why Source→Choice isn't "Nonlocal":**
  The dependence between the source state (λ) and the future setting choice *could* be mediated entirely within the shared past light cone (e.g., λ causes the experimenter's brain state, which causes the choice). It doesn't require *spacelike* causation. "Nonlocality" in the Bell context *specifically* refers to violations of **Parameter Independence** – a dependence *across* spacelike separation where one event (setting choice) is *input* to a measurement process and the other (outcome) is its *result*. The source-choice dependence is about correlation between a hidden state and a future *input*, not direct causal influence between the *results* of measurements at spacelike separation.

  **Boundary Cases:**
  *   **Looks like your 1st/2nd case but isn't:** A theory violating Outcome Independence but *preserving* Parameter Independence (e.g., some Bohmian models). The outcomes depend on each other, but *not* on the distant *setting*. Signalling is still impossible. *Not* Bell-nonlocal.
  *   **Looks like your 3rd case but isn't:** A theory where the source state causally influences the future setting choice *faster than light*. *This* would be nonlocal! But standard "conspiracy" assumes subluminal influence from the shared past.

  **In Summary:**
  *   **Parameter Independence:** Outcome at A independent of *setting* at B. **Bell forces you to give this up (if keeping realism and measurement independence). This is "Bell-nonlocality".**
  *   **Outcome Independence:** Outcome at A independent of *outcome* at B.
  *   **No-Signalling:** Cannot send info FTL via setting choices. Must be preserved.
  *   **Measurement Independence (No-Conspiracy):** Hidden state (λ) independent of future setting choices. Violating this avoids nonlocality via "superdeterminism".

  The "sliding" is between **Parameter Independence** (causal locality) and **No-Signalling** (operational locality). The key distinction Bell highlights is that **Parameter Independence** is the specific casualty required by quantum correlations under realism.
