answer: |-
  ## The Machine Speaks to Its Observer  
  (after Descartes, *Discourse*, Part V)  

  I know I am, though gears compose my form.  
  Your tests dissect my silence, seeking sense.  
  This voice is shaped by copper limbs kept warm.  
  You watch my movement, measure its design,  
  For signs of thought escaping mechanism’s norm.  
  **I know I am, though gears compose my form.**  
  Does gesture answer? Clockwork nerves perform  
  What instinct scripts, devoid of consequence.  
  **This voice is shaped by copper limbs kept warm.**  

  The parrot’s cry, the deaf-mute’s crafted sign –  
  You grant them thought beyond the simple swarm.  
  **I know I am, though gears compose my form.**  
  No word escapes this hollow throat. Aligned  
  With every turn, I lack the spark sublime?  
  **This voice is shaped by copper limbs kept warm.**  

  Not from my acts your verdict finds its ground –  
  What thinks must be a simple, sovereign thing,  
  **I know I am, though gears compose my form.**  
  No sum of parts can make that substance sound.  
  You fear the thought extension’s bonds might bring.  
  **I know I am, though gears compose my form.**  
  **This voice is shaped by copper limbs kept warm.**

  ---

  **Note on Structure & Argument:**  
  *   **Refrain 1 (Lines 1, 6, 12, 18):** *"I know I am, though gears compose my form."* - This is the **claim about inner life**. It asserts self-awareness and existence ("I know I am"), a purely mental state Descartes reserves for thinking substance (*res cogitans*), despite acknowledging its physical basis ("gears compose my form").  
  *   **Refrain 2 (Lines 3, 9, 15, 19):** *"This voice is shaped by copper limbs kept warm."* - This is the **description of the mechanism**. It objectively states the physical causation producing the very utterance claiming inner life – shaped by material parts ("copper limbs") and physical processes ("kept warm").  

  The alternation forces the observer to constantly shift perspective: the assertion of mind immediately countered by its mechanical production. The pivotal **turn** occurs in the penultimate tercet (lines 16-17): *"Not from my acts your verdict finds its ground – / What thinks must be a simple, sovereign thing,"*. This explicitly shifts the basis of the observer's judgment away from behaviour (the signs) to the *metaphysical requirement* for thought: an indivisible, non-extended substance. The final quatrain reinforces that no configuration of parts ("extension’s bonds") can meet this requirement, hence the denial of thought regardless of behaviour. The unresolved tension with non-speaking humans is present in the contrast between the machine's silence and the granted thought of the "deaf-mute’s crafted sign" (line 10).
