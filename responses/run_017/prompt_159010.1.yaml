answer: |-
  Your diagnosis is remarkably astute. The deadlock stems not from factual disagreement but from conflated philosophical layers and unexamined assumptions. Here's a breakdown and a path forward:

  **Diagnosis: Four Intertwined Knots**

  1.  **The Conflation You Identify (Epistemic vs. Motivational):** This is central. The "man of his time" defense often smuggles in an unproven claim about *motivation* ("He *couldn't* have thought otherwise") under the guise of an *epistemic* claim ("He didn't *know* otherwise"). Your separation is crucial. We can ask:
      *   **Epistemic Accessibility:** Were alternative moral viewpoints *available* to the agent (e.g., via contemporaries, texts, experiences)? Did they encounter them? Did they understand them?
      *   **Motivational Robustness:** If the agent *did* encounter or understand those alternatives, *why* did they reject/ignore them? Was it due to:
          *   **Persuasive Deficits:** Genuine intellectual conviction that their view was superior (e.g., flawed logic, weight given to different evidence/fears).
          *   **Motivated Reasoning:** Psychological investment in maintaining a belief due to self-interest, status, identity, or emotional attachment (e.g., Jefferson's economic dependence on slavery, Churchill's imperial identity).
          *   **Structural Constraints:** Social, political, or economic pressures making acting on alternative views extremely costly or seemingly impossible.

  2.  **The Suppressed Empirical Question (Counterfactual Robustness):** You're right. Both sides often rely on selective anecdotes *presuming* the answer to: "What would this agent have done *if* they had fully engaged with the best available counter-arguments and evidence?" Pro-sympathetic arguments assume they would have changed; pro-condemnation arguments assume they wouldn't. This *is* fundamentally historical (though difficult), requiring deep contextual study of the *agent's specific* reasoning processes, responses to criticism, intellectual flexibility, and vested interests – not just the *existence* of critics.

  3.  **The Purpose of "Blaming" or Condemning:** This is the meta-disagreement fueling the stalemate.
      *   **Side A (Condemnation):** Often sees moral judgment as primarily about affirming timeless moral truths ("Slavery is always evil") and asserting our current moral commitments. The target is the *act/character* itself. Condemnation serves a *present* function: defining our values, shaping collective memory, and rejecting harmful legacies ("We do not honor this").
      *   **Side B (Contextualism):** Often sees blame as a *relational* practice aimed at agents who could have (and *should* have) acted differently *in their context*, implying responsibility and the potential for reform/deterrence. Since neither applies to the dead, condemnation seems pointless or arrogant. Their focus is on *understanding* causation within context.
      *   **This is key:** Side A prioritizes the *act's* moral status; Side B prioritizes the *agent's* blameworthiness *as an agent* within their circumstances.

  4.  **The Asymmetry (Living vs. Dead):** This brilliantly exposes the underlying priority of the *purpose* of blame.
      *   **For the Living:** Blame serves clear *forward-looking* purposes: deterrence, reform, accountability, signaling community standards, potential punishment. Their epistemic context matters *mitigatingly*, but doesn't absolve, because the *consequences* of their actions are ongoing and they *can* potentially change.
      *   **For the Dead:** The forward-looking functions of blame (deterrence, reform) vanish. What remains are:
          *   **Backward-looking:** A verdict on their character/soul (often seen as metaphysical or irrelevant by historians).
          *   **Present-focused:** A statement about our *current* values, our relationship to the past, and how we choose to memorialize or learn from it.
      *   **Why the Difference?** We hold the living accountable because we *share a society* with them, and their actions *directly impact* our present and future. Condemning the dead is primarily an act of *present* self-definition and legacy management. The asymmetry arises because the *social functions* of blame are fundamentally different for agents who are still active participants versus those who are historical figures.

  **Is it Verbal, Intuitive, Empirical, or Conflated?**

  *   **Not Primarily Verbal:** Both sides usually understand the terms; the disagreement is substantive.
  *   **Partly Bedrock Intuitions:** Foundational views on moral ontology (are moral truths timeless or context-dependent?) and the primary purpose of historical judgment (truth vs. understanding vs. moral reckoning) play a role. These are hard to argue "for" directly.
  *   **Crucially Conflated:** The bundling of epistemic access and motivational robustness is the major conceptual snarl.
  *   **Significantly Empirical (Suppressed):** The counterfactual question ("What *would* they have done with better access/understanding?") *is* historical, even if difficult to answer definitively. Ignoring it lets both sides assume their preferred answer.
  *   **Two Questions Under One Heading:** Absolutely. "Can we condemn?" bundles:
      1.  Was the act/character morally wrong (by our lights/universal standards)?
      2.  Was the agent blameworthy *as an agent* in their context?

  **What Counts as Progress?**

  1.  **Force the Distinction (Epistemic vs. Motivational):** In your seminar, explicitly separate the questions for each case study:
      *   *Step 1 (Epistemic):* "What morally critical viewpoints *were* available to Jefferson/Churchill/Columbus? Through what channels? Is there evidence they encountered them? How sophisticated were those critiques compared to ours?"
      *   *Step 2 (Motivational):* "Given what we know about their reasoning, interests, and actions, why did they reject/ignore/override these available critiques? What psychological, social, or economic factors seem most salient? Was it ignorance, 'bad' reasoning, or 'knowing' self-interest/attachment?"
      *   This shifts the debate from abstract condemnation to concrete historical analysis of the *agent's specific* relationship to available moral knowledge and their reasons for action.

  2.  **Make the Counterfactual Empirical (Where Possible):** Encourage research/discussion focused on:
      *   How *did* the agent respond to specific criticisms they *did* encounter?
      *   Did their views evolve on related issues? Where did they show intellectual flexibility or rigidity?
      *   What were their stated justifications, and how do they hold up against contemporary counter-arguments *they likely knew*?
      *   How powerful were the structural/incentive barriers to change?

  3.  **Surface the Purpose of Blame:** Explicitly ask: "What are we *doing* when we condemn a historical figure? What work is this condemnation meant to perform *for us now*?" Contrast this with: "What would it mean to hold them responsible *as an agent in their own time*?" Acknowledge these are different projects. Frame condemnation of the dead primarily as a *present act of valuation and memorialization*, not primarily a verdict on the dead agent's eternal culpability.

  4.  **Explore the Asymmetry:** Discuss: "Why *don't* we readily apply the 'product of their time' defense to living people holding regressive views, even if their upbringing was similarly constraining? What does this tell us about the different *functions* of blame for contemporaries vs. historical figures?" This can clarify that judging the dead is less about *them* and more about *us* and our relationship to the past.

  5.  **Shift the Question (Productively):** Move *beyond* "Can we condemn?" to more fruitful questions:
      *   "What does this figure’s *failure* to embrace available critiques reveal about the power of interests/attachments vs. the limits of moral reasoning in their context?"
      *   "How should our understanding of their context, their access to alternatives, and their motivations *inform how we memorialize or learn from them today*?"
      *   "What does this case tell us about the relationship between moral knowledge, social power, and individual action in historical contexts?"

  **Reason to Expect Progress?** Yes, but cautiously. You won't resolve the deepest meta-ethical intuitions about timeless morality. However, by untangling the epistemic/motivational knot, forcing engagement with the empirical counterfactual (however partial), clarifying the *purpose* of condemnation, and shifting the focus to more nuanced questions about the interplay of ideas, interests, and context, you can move the discussion from repetitive deadlock to richer, more productive historical and philosophical analysis. The goal isn't consensus on condemnation, but a deeper, more sophisticated understanding of the complex machinery of historical judgment itself. Your role is to be the facilitator who insists on pulling apart the threads they keep trying to bundle together.
