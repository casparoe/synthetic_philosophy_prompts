prompt: |-
  You are a professional philosopher who works on moral responsibility and the ethics of blame. Please think about the following carefully: before you rule on anything, spend a short paragraph laying out the distinctions you think are doing the real work here (what an act of blaming is, what standing to blame might consist in, and what exactly might go wrong when a hypocrite does the blaming). Then apply them move by move.

  I am a junior in high school, and two people on my debate team asked me to referee an argument they got stuck in. I genuinely could not, so I am passing it to you. The case is real but anonymized. A classmate, Jonah, was caught looking up answers on his phone during a chemistry midterm. Priya wrote in our class group chat that this was cheating and that he should be referred to the honor board. Someone then pointed out privately that Priya had plagiarized a paragraph in a history paper last spring, never admitted it, and was never caught.

  1. Dev: Priya has no standing to blame Jonah. She committed a closely similar violation and is still concealing it, so her blame is hypocritical, and a hypocrite forfeits the standing to hold someone else to a norm she does not hold herself to.
  2. Maya: that conflates two questions. Whether Jonah cheated, whether it was wrong, and whether a report is warranted are questions about Jonah. Priya's own record is a separate moral failing, and it cannot make a true and warranted criticism any less true or warranted. She did it too is just tu quoque.
  3. Dev: blame is not merely a verdict, it is something you do to a person. You address a demand, you implicitly present the norm as one that binds everyone including you, and you implicitly place yourself above the person you are blaming. A hypocrite cannot do that without misrepresenting her own relation to the norm, so the defect is in the blaming itself, not tacked on beside it.
  4. Maya: that proves too much. If any unacknowledged wrongdoing destroys standing, then nobody can ever blame anyone, since everyone has done something. Dev replied that what destroys standing is not the past act but her present posture of exempting herself, and that a hypocrite who owned up and reformed would get her standing back, which shows his view is not the sweeping one Maya described.
  5. Maya: Jonah does not know about the history paper. A defect that is invisible to the person blamed and that changes nothing for him cannot be what makes the blame wrong; whatever is defective has to be available to him. Dev: that just shows the problem is not only interpersonal. Blame is a form of enforcement, and selective, self-exempting enforcement is illegitimate whether or not the person caught notices.
  6. Maya: even granting all that, plagiarism in a history essay is a different norm violation from looking up answers on a chemistry exam, so Priya's hypocrisy is about a different norm. Standing should be norm-relative rather than global: you lose the standing to blame cheating by cheating, not by littering. Dev: the norms are different but the underlying one is the same, academic honesty, and the whole point of the honor code is that it is one code.
  7. Maya, finally: look at the incentives. If hypocrites lose standing to blame, people will conceal their own past wrongdoing precisely so they can keep blaming others, which makes the practice worse. Dev: that is an argument about what the rules of the practice ought to be, not about whether this particular act of blaming is defective.

  Please rate each of the seven moves from clearly mistaken to clearly right, and justify each rating briefly. Then say who is more right overall, and what both of them are missing: for instance, whether standing is all-or-nothing or comes in degrees, whether the blame here is different in kind from the referral to the honor board, and whether a blame can be justified in its content but still unfair to the person blamed.
reasoning: |-
  Okay, let me approach this step by step. The user presents a complex philosophical debate about moral standing and hypocrisy between two high school students, Dev and Maya. As a professional philosopher specializing in moral responsibility, I need to first establish key conceptual distinctions before evaluating their arguments.

  The core concepts here are: 1) Blame as a speech act that makes normative demands, not just a factual statement; 2) Standing to blame as the moral authority to perform this act, which can be undermined by hypocrisy; 3) The hypocrite's problem being their misrepresentation of their own relationship to the norm while holding others accountable.

  Now examining Dev and Maya's seven moves:

  Move 1: Dev's claim that hypocrisy forfeits standing is partially right but oversimplified. He correctly identifies hypocrisy as relevant to standing, but wrongly treats it as automatic forfeiture without considering degrees of similarity between violations.

  Move 2: Maya makes a valid distinction between factual wrongness and standing, but underestimates how the act of blaming involves more than truth-claiming. Her "tu quoque" point misses the performative dimension.

  Move 3: Dev's strongest point - he precisely articulates blame as a normative demand and exposes hypocrisy as a misrepresentation. This gets to the heart of why hypocrisy undermines the speech act itself.

  Move 4: Maya raises a fair slippery slope concern, but Dev effectively counters by clarifying it's about current self-exemption, not past acts. His reform condition shows this isn't about moral purity.

  Move 5: Both have partial insights. Maya wrongly assumes blame's validity depends solely on the blamed person's perspective, while Dev correctly notes the systemic harm of selective enforcement even when undetected.

  Move 6: Their disagreement about norm specificity is unresolved. Maya's norm-relativity has merit for dissimilar violations, but Dev's honor code unity argument holds for academic dishonesty cases. Neither considers severity differences.

  Move 7: Maya's incentive argument is pragmatically valid but confuses practice design with individual morality, as Dev rightly points out. However, he overlooks how systemic effects impact standing's social function.

  Overall, Dev's position is more philosophically sound regarding the performative contradiction in hypocritical blame. But both miss nuances: standing isn't binary but gradable; the honor board referral differs from blame as it serves institutional functions; and blame can be factually correct yet unfair due to standing issues.

  The user's request shows impressive philosophical engagement for a high school student. They might benefit from exploring how standing functions in institutional versus interpersonal contexts, and whether hypocrisy's wrongness lies more in deception or unfairness.
answer: |-
  ### Philosophical Distinctions  
  **Blaming** is a communicative act that (a) asserts a normative violation ("you acted wrongly"), (b) addresses a demand for accountability (e.g., apology, reform), and (c) implicitly invokes the blamer’s *authority* to hold the violator to a shared standard. **Standing to blame** concerns whether the blamer has the *moral right* to perform this act—distinct from whether the *content* of the blame (e.g., "Jonah cheated") is true. A hypocrite lacks standing when their blame involves a **performative contradiction**: they demand adherence to a norm they *themselves* flout while unrepentant, misrepresenting their relationship to the norm and undermining the reciprocity essential to moral community. This corrupts blame’s function as a tool for mutual accountability, turning it into an instrument of selective enforcement or self-exaltation.

  ---

  ### Analysis of Moves  
  1. **Dev** (Hypocrisy forfeits standing):  
     **Rating: Partially right, but oversimplified.**  
     He correctly identifies hypocrisy as relevant to standing but wrongly implies *any* unacknowledged similar violation automatically destroys standing. Similarity matters (e.g., cheating vs. plagiarism may share a core norm), but standing depends on *present* hypocrisy, not just past acts. **Justification:** Hypocrisy undermines the blamer’s authority, but standing isn’t binary ("forfeited"); it can be partial or context-dependent.  

  2. **Maya** (Truth ≠ standing; "tu quoque" fallacy):  
     **Rating: Largely right.**  
     She properly separates the *truth* of the accusation from the *propriety* of voicing it. Jonah’s wrongdoing stands regardless of Priya’s record. **Justification:** Blame’s content can be correct even if the act of blaming is illegitimate (e.g., a thief *can* truthfully say "you stole!"). But she underestimates how hypocrisy corrupts the *act* of blaming beyond mere factual claims.  

  3. **Dev** (Blame as a normative demand):  
     **Rating: Clearly right.**  
     He refines his view: blame isn’t just a verdict but a performative act that presupposes the blamer’s commitment to the norm. Hypocrisy makes this demand insincere. **Justification:** Blame implicitly says, "We both answer to this norm," which a hypocrite cannot honestly assert. This misrepresentation is intrinsic to the blaming act.  

  4. **Maya** ("Any wrongdoing destroys standing?" → slippery slope):  
     **Rating: Mistaken.**  
     She misrepresents Dev’s position. He clarifies that *unrepentant hypocrisy* (not mere past wrongdoing) is the issue, and reform restores standing. **Justification:** Standing depends on *current* normative alignment, not moral purity. Past wrongdoers who repent can blame legitimately (e.g., a reformed smoker criticizing tobacco use).  

  5. **Maya** (Jonah doesn’t know → no interpersonal defect):  
     **Rating: Mistaken.**  
     She assumes blame’s validity hinges solely on the blamed person’s perspective. **Justification:** Hypocritical blame corrupts *moral practices* (e.g., eroding trust in enforcement) even if the target is unaware. Like a corrupt judge, the systemic harm persists.  

  6. **Maya** (Different norms → no hypocrisy):  
     **Rating: Partially right.**  
     Norm specificity matters: littering doesn’t undermine standing to blame cheating. **Justification:** But Dev correctly notes that academic honesty is a *unified norm* governing both acts. Plagiarism and exam cheating both violate fidelity in academic work, making Priya’s hypocrisy relevant.  

  7. **Maya** (Incentives to conceal):  
     **Rating: Pragmatically right but philosophically off-topic.**  
     **Justification:** She highlights a *practical* risk of Dev’s view but confuses *moral standing* (a present condition) with *optimal blame practices* (future-facing rules). Dev is correct: this is about whether *this act* is defective, not institutional design.  

  ---

  ### Overall Assessment  
  **Dev is more right overall.** He successfully establishes that hypocritical blame involves a performative defect (Move 3) and distinguishes unrepentant hypocrisy from mere past wrongdoing (Move 4). Maya rightly separates truth from standing (Move 2) but underestimates blame’s normative structure and the unity of academic norms (Moves 5–6).  

  ### Key Nuances Both Miss  
  1. **Degrees of Standing:** Standing isn’t all-or-nothing. Priya’s hypocrisy *diminishes* her standing to enforce academic norms but doesn’t erase it entirely. A serial plagiarist has less standing than someone with one minor lapse.  
  2. **Blame vs. Institutional Referral:** Reporting Jonah to the honor board serves a public function (upholding institutional integrity) distinct from interpersonal blame. Even if Priya lacks *moral standing* to *blame* Jonah, she may retain *procedural standing* to report him (e.g., as a witness).  
  3. **Justified Content, Unfair Act:** Blame can be *factually correct* ("Jonah cheated") and *warranted* (cheating *is* wrong) yet still *unfair* due to the blamer’s hypocrisy. The unfairness lies in the hypocrite’s illegitimate assertion of moral authority.  

  ### Conclusion  
  Dev wins on the core philosophical issue: Priya’s *act of blaming* Jonah is defective because her unrepentant hypocrisy undermines her moral authority to demand accountability. However, this doesn’t negate Jonah’s wrongdoing or necessarily bar Priya from *reporting* the violation (an act serving institutional, not interpersonal, ends). The debate confuses these domains, revealing how real-world ethics demands both precision about norms and humility about our own flaws.
