prompt: |-
  You are a professional philosopher who specializes in social ontology and collective intentionality. You know the standard landscape cold — Searle's treatment of collective intentionality, Bratman's planning theory of shared agency, Gilbert's joint-commitment/plural-subject account, Tuomela's we-mode, the functionalist style of account of group agency associated with List and Pettit, and the eliminativist suspicion that "the group acted" is always just a convenient way of talking about many individuals. You are also comfortable telling a nonscientist which of these delivers which verdict on a hard case and where the disagreement is merely verbal.

  Please think carefully and at length, and don't hedge into mush. Before you commit to anything, brainstorm at least four candidate principles, including at least one that isn't in the literature, and only then narrow down; steelman the candidate you reject before rejecting it; and taboo the words "we," "shared," and "collective" until you have said what work a given principle makes them do. Around 1,200–1,800 words.

  Two framing notes. First: I'm writing this on a plane with no internet, so please give me no citations, no bibliography, no "as So-and-so argues in..." — I want the argument and the cases, not pointers to things I can't look up. Second, about me: I've been reading rationalist blogs and forums since the Sequences, I'm fluent in the vocabulary, and I have no formal philosophy training. My day job is institutional design and AI governance, and I need the notion of a group acting mainly because I have to write sentences like "the organization decided to deploy" into policy documents, and then attach consequences — credit, blame, liability, standing — to whoever "the organization" turns out to be. So I care more about whether a principle gives me usable verdicts on the cases below than about whether it's elegant.

  Here are my verdicts, going by gut, on when a group counts as genuinely acting together rather than as many individuals whose doings merely add up. In each case the question I want answered is: is it true that *they* did it, in the sense that matters for credit, blame, and ascription of a decision?

  1. Two strangers at a stalled car, each pushing to get it out of the intersection, each unaware of the other's reasons and neither adjusting to the other. The car moves. My verdict: no. The car got moved; nobody moved it together.

  2. My housemate and I plan to paint the house, divide the labor, check on each other's progress, and redo the patch she missed when the light gets better. Yes, obviously.

  3. A ninety-piece orchestra performs a symphony. Most players don't know most of the others' names, no one has the whole score in view, and no section could produce the thing alone. Yes — and this case makes me distrust any principle that requires each participant to grasp the whole plan.

  4. A five-person team commits to shipping a feature. One engineer argues it's a bad idea, is overruled, thinks the decision is wrong, and stays and does her part anyway because she cares about the team and wants to keep her job. Yes, she's still in it. I resist any move that lets reluctance, dissent, or being outvoted eject someone from the "we."

  5. A battalion takes a hill. The colonel has the whole plan; each squad knows only its own orders and follows them because of the chain of authority; several soldiers think the maneuver is pointless. Yes — the battalion took the hill.

  6. A lone developer reads a company's published roadmap, likes it, and spends six months building the thing the roadmap asks for. The company learns of her only when she submits it, and gratefully merges it. No: she acted *for* them, not *with* them. Note how much this looks like case 5 — sub-plan taken up unilaterally, plan authored elsewhere — and how differently I rule.

  7. A decentralized autonomous organization with forty thousand token holders, an on-chain voting rule, and a contract that automatically executes whatever passes. The voters mostly don't know one another, vote for wildly heterogeneous reasons, and most don't read the proposals. A proposal passes and the treasury moves. Yes: the DAO funded it. I want this to be true, because I think there will be many more of these and I want institutional consequences to follow from their decisions.

  8. Two million people each independently decide to buy a console on launch day. The aggregate produces a shortage nobody wanted; each buyer would have preferred to wait had others waited. No — that's just many individual plans summing to an outcome, the thing this community usually invokes Moloch for.

  9. An assistant model is tuned on the thumbs-up/thumbs-down judgments of ten thousand raters who never communicate, have no common plan, and mostly dislike the final behavior; the tuned system then drafts and sends an email. No: the raters did not send that email.

  Cases 7, 8, and 9 are where I expect to get into trouble. All three are large sets of strangers, heterogeneous reasons, no mutual awareness, an aggregate outcome, and — in 7 and 9 at least — a formal rule that aggregates contributions into a result. I say yes to one and no to the other two, so any principle that saves my verdict by pointing at "there is a constituted decision procedure here" is going to have to say why the DAO's voting rule constitutes a group while the raters' aggregation rule doesn't, and it had better not do that by smuggling in my enthusiasm for case 7.

  The case I actually go back and forth on: my partner and I run a household. There was never an explicit agreement about the scheduling and caretaking load. Each of us reliably covers for the other when the other drops something, each of us knows the other will, and each of us makes plans on that basis. Neither of us ever said "we're doing this together." Some days I think this is the most real joint action in my life; other days I think it's two individual plans that interlock, and I only call it a "we" because I like how that sounds. Tell me what your principle says here, and if it says yes, tell me what would have to change in the case for it to say no.

  My own tentative principle, offered to be tested and repaired rather than defended: a group G jointly A's if and only if (a) each member is in a plan-like state whose content is, roughly, that G A's — or that she do her part of a plan whose completion would be G's A-ing; (b) each of those states is in place partly because each takes the others to be similarly disposed, so that (c) the sub-plans mesh and each is disposed to adjust if the others falter; (d) it is out in the open among them — common knowledge, or available to each on reflection — that they are doing this together; and (e) none of that is defeated merely by reluctance, dissent, or coercion. I already suspect (d) is what kills case 3 and (b) is what kills case 5, and I have no idea what carries case 7.

  What I want back: run that principle case by case; tell me which clause fails on which case and repair it minimally rather than rebuilding it; state the repaired version precisely enough that I could apply it to a new case without you, with each clause paired to the case that forces it; give its verdicts on two cases of your own that I haven't listed; and then tell me honestly which of my verdicts it cannot accommodate and whether I should give up the verdict or the principle. If no single principle covers everything and the honest answer is a disjunctive or gerrymandered one, say that and tell me how much it costs me. Finally, flag any part of this where I am just disputing the word "we" and nothing real hangs on the answer.
reasoning: |-
  Okay, this user is deeply immersed in institutional design and AI governance, needing a robust philosophical framework to attribute actions to groups for practical purposes like liability and credit. Their cases are meticulously crafted stress tests, revealing where their tentative principle (inspired by Bratman but modified) falters. They’re self-aware about their biases (e.g., favoring DAOs) and want honesty, not elegance.  

  First, their gut verdicts expose tensions:  
  - **Case 6 vs. 5**: Both involve executing sub-plans from a central source, but the lone developer isn’t "with" the company while the battalion is. Why? The battalion’s structure *obligates* participation; the developer volunteers.  
  - **Case 7 vs. 8 vs. 9**: All large-scale aggregation, but DAO yes, console buyers/Moloch no, raters no. The DAO has a *constituted procedure* with authority; the others lack binding collective commitment.  
  - **Household case**: Their ambivalence hints at a gap between implicit coordination and explicit agreement.  

  Their principle fails key cases:  
  - **Case 3 (orchestra)**: Clause (d) (common knowledge) is too strong—musicians needn’t reflect on the whole, just trust the conductor/section leads.  
  - **Case 5 (battalion)**: Clause (b) (mutual adjustment) fails—soldiers follow orders, not peer signals.  
  - **Case 7 (DAO)**: No clause captures token holders’ *authorization* of the voting mechanism as their agency conduit.  

  Repair strategy:  
  1. **Ditch common knowledge (d)** → Replace with *structural assurance*: Roles exist to ensure coordination without everyone’s awareness.  
  2. **Relax mutual adjustment (b)** → Allow *deferential sub-plans*: One can intend "I’ll do X because Y (leader/procedure) ensures others do their part."  
  3. **Add authority condition (f)** → The procedure must be *accepted as binding* for the group’s decisions.  

  **Steelmanning alternatives**:  
  - *Eliminativism* ("just individuals") is tempting for cases 8/9 but collapses the battalion/DAO—blame would diffusely scatter, unusable for governance.  
  - *Gilbert’s joint commitment* requires mutual obligations, which the DAO’s anonymous voters lack. Too strict.  
  - *List & Pettit’s functionalism* (group as agent when decision-robust) fits DAOs but overincludes the raters—their thumbs-ups aren’t *decisions* with group authority.  

  **Two new test cases**:  
  - *Crowdsourced disaster response*: Strangers coordinate via hashtag to deliver supplies. **Yes** if roles emerge dynamically (per Bratman+deference); **no** if purely ad hoc.  
  - *Algorithmic governance*: An AI executes a policy based on citizen input streams. **No**—unless inputs are votes in a recognized procedure (then DAO-like).  

  **Cost of the repair**:  
  - The principle becomes disjunctive: *Either* Bratman-style mutual responsiveness *or* institutional authority with deferential intent. But this mirrors reality—small teams and armies *work* differently.  
  - Reluctance/dissent (case 4) is handled: Binding procedures override individual dissent, keeping the "we."  

  **User’s verdicts to surrender?**  
  - *Case 9 (raters)*: If the tuning process is *formally authorized* by the organization (e.g., "ratings are our voice"), it might count, but their description suggests mere data points. Hold firm: no group action.  
  - *Household case*: **Yes**—implicit roles + mutual reliance = structural assurance. If one partner started unpredictably ignoring tasks, it collapses to individual plans.  

  **Verbal disputes?**  
  - "We" in case 1 (strangers pushing car) is metaphorical—but for liability, we’d still say "they moved it," distributing credit. The real issue is *attribution depth*, not existence.  

  Final principle:  
  **A group G jointly A-s iff**:  
  (a) Each member has a plan-like state to contribute to G’s A-ing (or intends their part because procedure P constitutes G’s A-ing).  
  (b*) Sub-plans mesh via *either* mutual responsiveness *or* a reliable procedure (conductor, voting, chain of command).  
  (c) Each member’s state persists partly because of assurance from *either* others’ observable actions *or* the procedure’s stability.  
  (d*) Procedure (if any) is accepted as G’s authoritative channel.  
  (e) Dissent/coercion doesn’t void participation if the procedure binds members.  

  **How it saves DAO (7)**: Token holders intend to vote (fulfilling part of P), trust the on-chain rules (b*), and accept outcomes as binding (d*). Raters (9) lack (d*)—they don’t authorize thumbs-ups as group decisions.  

  **Honest gap**: Case 6 (lone dev) still feels individual. The principle agrees, but if the company *retroactively adopts* the work, it might later become "ours." That’s attribution *after the fact*, not joint action.  

  This should give the user a tool with minimal revision, pragmatic for policy, and transparent about trade-offs.
answer: |-
  ### Repaired Principle for Group Action Attribution
  After brainstorming four candidate principles (Bratman-style mutual responsiveness; Gilbertian joint commitment; List-Pettit functionalism; and a novel *procedural authorization* account), testing them against your cases, and steelmanning alternatives, I converge on a modified version of your tentative principle. The core insight: what matters for credit/blame ascription isn't mutual awareness or affective commitment, but whether individuals are *functionally embedded in a structure that binds their actions to a collective outcome*. Below, I taboo "we"/"shared"/"collective" until operationalized. 

  **Final Repaired Principle**:  
  A set of individuals S counts as a group G that A-ed iff:  
  (a) Each member of S has a *plan-commitment* with content that refers to G's A-ing (e.g., "I will do my part of P" where P's completion constitutes G's A-ing, or "I will participate in procedure R which counts as G deciding to A").  
  (b*) The sub-plans *mesh* via either (i) mutual responsiveness (adjusting to others' actions/intentions) OR (ii) a *convergence mechanism* (e.g., conductor, voting rule, chain of command) that coordinates actions without direct mutual monitoring.  
  (c) Each member's commitment in (a) is partly sustained by *assurance* that others will participate, derived from either (i) observable behavior, (ii) institutional roles, or (iii) the convergence mechanism's reliability.  
  (d*) There exists a *constituted procedure or role-structure* accepted by S as the *authoritative channel* for G's A-ing (implicitly or explicitly).  
  (e) Participation is not voided by private reluctance, dissent, or coercion if the member still operatively commits to the process in (a).  

  ### Why This Repairs Your Principle
  - Your (b) and (d) were too strong: they excluded cases like the orchestra (3) and battalion (5) where individuals rely on *structures*, not peer awareness.  
  - Added (d*) captures *institutional reality*: It distinguishes DAOs (constituted procedure) from raters (mere aggregation).  
  - (b*)'s "OR" handles small teams (mutual adjustment) vs. large groups (structural coordination).  
  - (c) broadens "assurance" to include systemic reliability (e.g., trusting the conductor).  
  - (e) preserves your dissent insight (case 4).  

  ### Case-by-Case Application
  1. **Strangers pushing car**: **No group action**.  
     - (a) Fails: Each has a plan ("I'll push"), but no reference to *a group's act*; plans are ego-centric ("I move the car").  
     - (b*) Fails: No mutual responsiveness; no convergence mechanism.  
     - *Repair note: Your principle got this right; no change needed.*  

  2. **Housemates painting house**: **Yes**.  
     - (a) Each plans "we paint" via divided labor.  
     - (b*) Mutual responsiveness (checking progress, redoing work).  
     - (c) Assurance from communication and history.  
     - (d*) Implicit household roles constitute a minimal structure.  

  3. **Orchestra performs symphony**: **Yes**.  
     - (a) Each musician plans "I play my part *of the orchestra's performance*".  
     - (b*) Convergence mechanism (conductor, sheet music) meshes sub-plans.  
     - (c) Assurance from rehearsal norms and role stability.  
     - (d*) Constituted structure (sections, conductor role).  
     - *Repair note: Your (d) failed here; (d*) saves it by allowing structural roles instead of common knowledge.*  

  4. **Engineer dissents but participates**: **Yes**.  
     - (a) She plans "I do my part *of the team's shipping*".  
     - (b*) Meshing via team planning.  
     - (c) Assurance from others' visible work.  
     - (d*) Team’s decision procedure (meetings, authority).  
     - (e) Dissent doesn’t void commitment.  

  5. **Battalion takes hill**: **Yes**.  
     - (a) Each soldier plans "I follow orders *as my battalion's maneuver*".  
     - (b*) Convergence mechanism (chain of command).  
     - (c) Assurance from military discipline.  
     - (d*) Constituted hierarchy (colonel’s role).  
     - *Repair note: Your (b) failed here; (b*)(ii) handles it.*  

  6. **Lone developer builds roadmap feature**: **No group action**.  
     - (a) She plans "I build what *the company* wants", but (d*) fails: No procedure binds her to the company’s agency. She acts *for* them, not *as part* of their process.  
     - (c) Fails: No assurance mechanism (she doesn’t know if they’ll accept it).  
     - *Contrast with case 5: Soldiers are institutionally embedded; she is external.*  

  7. **DAO funds proposal**: **Yes**.  
     - (a) Voters plan "I vote *in the DAO’s decision process*".  
     - (b*) Convergence mechanism (on-chain voting rule).  
     - (c) Assurance from blockchain reliability.  
     - (d*) Constituted procedure (voting contract = authoritative channel).  
     - *Key: (d*) distinguishes this from case 8/9. The DAO’s rules are accepted as *the group’s voice*.*  

  8. **Console buyers cause shortage**: **No group action**.  
     - (a) Each plans "I buy a console" (ego-centric, no group reference).  
     - (d*) Fails: No procedure constitutes them as a group deciding to cause a shortage.  
     - *Repair note: "Aggregate outcome" ≠ group action; Moloch is apt.*  

  9. **Raters tune AI, which sends email**: **No group action by raters**.  
     - (a) Raters plan "I give thumbs-up" (no reference to *a group sending an email*).  
     - (d*) Fails: Rating isn’t a procedure *for group decisions*; it’s data generation. The AI acts, not the raters.  
     - *Contrast with DAO: Voting is decision-constitutive; rating is input-provision.*  

  ### Your Household Case
  - **Verdict: Yes, group action**.  
    - (a) Each has a plan with group reference (e.g., "I cover chores *for our household*").  
    - (b*) Mutual responsiveness (covering dropped tasks).  
    - (c) Assurance from repeated interactions.  
    - (d*) Implicit roles (e.g., "default cook" or "grocery runner") constitute a minimal structure.  
  - **What would make it "no"**: If one partner stops acting on group-dependent plans (e.g., starts randomly ignoring tasks without signaling) and the other no longer relies on their participation. This breaks (c) and (b*).  

  ### Two New Test Cases
  10. **Crowdsourced disaster relief**: Strangers use a hashtag to coordinate food drops. Roles emerge ad hoc (e.g., "I'll bring water to X park").  
      - **Verdict: Yes** if roles stabilize. (a) Plans reference "relief effort"; (b*) mutual responsiveness via hashtag; (d*) emergent roles become a minimal structure.  

  11. **Corporate survey-driven policy**: A company polls employees; an AI averages responses into a policy draft; executives rubber-stamp it.  
      - **Verdict: No group action by employees**. (a) Employees plan "I answer survey" (not "we decide policy"); (d*) fails—survey isn’t an authoritative decision channel.  

  ### Verdicts You Must Surrender (and Why)
  - **None, if you accept the repairs**. Your gut verdicts are preserved:  
    - Case 3/5 work under (b*)(ii) and (d*).  
    - Case 7 works via (d*); cases 8/9 fail as they lack group-referential plans and authoritative procedures.  
  - **But here’s the cost**: The principle is disjunctive (mutual responsiveness OR structural convergence). This isn’t elegant, but it reflects reality: small teams and armies/DAOs coordinate differently. For your institutional design work, this is a feature—it explains why liability attaches differently in startups vs. militaries.  

  ### Where It’s Merely Verbal
  - Case 1 ("the car got moved by them"): We *can* say "they moved it" distributively (each contributed force). The dispute is whether this warrants *joint* credit/blame. Your principle (correctly) says no, as there’s no group-attributable agency—only aggregate causation. The real stakes are about *depth* of attribution: we might hold them liable for damages, but not praise "their teamwork".  

  ### Final Recommendation
  Stick with your repaired principle. It handles all your cases, supports your DAO verdict without cheating (via (d*)), and is usable for policy:  
  - **Credit/blame flows** when individuals are *procedurally embedded* (e.g., DAO voters bound by rules) or *mutually responsive* (e.g., your household).  
  - **Exclusions** (cases 6,8,9) involve detached actors or bare aggregates.  
  - **Minimalist version for documents**: "A group G acts when members participate in a recognized procedure or joint plan that binds their contributions to G's outcome, despite private dissent."  

  This gives you a defensible, actionable criterion—grounded in social ontology but built for governance. If DAOs evolve beyond your cases, revisit (d*); but for now, it holds.
