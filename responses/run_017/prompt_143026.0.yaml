      - The chair sums the tokens for each outlook and computes the weight (sum / total tokens).

    Step 2: Rank the grants from each outlook (20 min)
      - For each outlook, discuss: "How would this outlook rank these grants?" 
      - Reach a consensus on the rank ordering (1st, 2nd, 3rd) for that outlook. If consensus fails, vote (each member one vote) to decide the order.
      - Record the ranks.

    Step 3: Compute scores (5 min)
      - Assign points: 3 for 1st, 2 for 2nd, 1 for 3rd.
      - For each grant, compute: 
            score = (weight_IA * points_IA) + (weight_SC * points_SC) + ... 
      - Rank the grants by score (highest to lowest).

    Step 4: Check for artifacts (5 min)
      - Recompute using an alternative point assignment: 1 for 1st, 0 for 2nd, -1 for 3rd.
      - If the top-ranked grant changes, then note the tie and go to Step 5. Otherwise, proceed.

    Step 5: Ties and close calls (10 min if needed)
      - If the top two grants in Step 3 have a difference of less than 0.1, or if Step 4 showed a different top grant, then we have a tie. 
      - In case of tie, we present the tied grants to the board with the reasons.
      - Otherwise, the top-ranked grant is the recommendation.

    Step 6: Presenting the reason (5 min)
      - Formulate the reason for the recommendation: "This grant was chosen because it had the highest overall rank across our moral perspectives, with strong support from [outlooks that ranked it first] and acceptance by others."

    If at any step the committee cannot proceed (e.g., cannot agree on the ranking for an outlook), then we hand the decision to the board.

    Finally, we note that the procedure might not be perfect, but it is designed to be transparent, quick, and respectful of the moral diversity in the committee.

    For the three proposals in the example, we recommend funding the parasitic disease prevention (A).

    The committee member who favored the impact litigation (B) might be unhappy, but the reason is presentable: "While the impact litigation was the top choice for the side-constraint and threshold outlooks, the parasitic disease prevention was the top choice for the impartial aggregation outlook and was ranked second by the other outlooks. Given the weight the committee placed on impartial aggregation, the overall balance favored the disease prevention."

    The speculative grant (C) was not recommended because it ranked last.

    The procedure cannot be used to pick itself. We assume the committee has agreed in advance to use it.
answer: |-
  ### Proposed Procedure: **Moral Portfolio Balancing (MPB)**

  This procedure addresses your committee's constraints by avoiding both the "highest credence" and "expected scoring" methods. It uses **qualitative rankings** and **robust normalization** to compare outlooks without a common currency, explicitly handles near-variants and hedging, and ensures recommendations are "presentable" to donors of any single outlook. The process is designed for a 3-hour meeting with non-specialists.

  ---

  ### **Step-by-Step Procedure**
  #### **1. Pre-Meeting Preparation (Chair’s Responsibility)**
  - **Shortlist Construction**:
    - Include 4–6 candidate payouts per round, ensuring diversity across outlooks.
    - Group "near-variants" under a parent outlook (e.g., "Long-Horizon IA" folded into "Impartial Aggregation" with a note). This prevents double-counting and simplifies voting.
    - **Current shortlist**: Parasitic disease prevention (A), Impact litigation (B), Speculative risk reduction (C).
    
  - **Outlook List**:
    - Define 3–4 core outlooks (e.g., "IA," "SC," "Th"). Near-variants are subsumed under parents unless they drastically alter priorities (e.g., "Long-Horizon IA" is a variant of IA but treated as a separate outlook only if it reverses rankings).
    - **Current outlooks**: 
      - IA (Impartial Aggregation: total/average welfare),
      - SC (Side-Constraints: rights/duties),
      - Th (Threshold: worst-off/decent minimum),
      - LH (Long-Horizon IA variant: 8% credence).

  #### **2. Assigning Committee Weights (15 min)**
  - **Goal**: Approximate aggregate credences without forcing numbers.
  - **Process**:
    1. Each member allocates 10 tokens across outlooks (including variants). Tokens represent relative confidence.
    2. The non-number member uses tokens like others (no numbers needed).
    3. Sum tokens per outlook → committee weights (normalize to sum to 1).
  - **Example**:  
    - IA: 14 tokens (35%),  
    - SC: 10 tokens (25%),  
    - Th: 11 tokens (27.5%),  
    - LH: 5 tokens (12.5%).  

  #### **3. Ranking Grants per Outlook (60 min)**
  - **Goal**: Avoid scoring; use **ordinal rankings** to bypass common-currency disputes.
  - **Process**:
    1. For each outlook, discuss: "What is the moral ranking of grants?" (e.g., "Under SC, is B > A > C?").  
    2. **Vote per outlook**: Members with >10% credence in that outlook vote on its ranking (others abstain). Use ranked-choice voting to resolve ties.  
    3. Record ranks: 1st = 3 pts, 2nd = 2 pts, 3rd = 1 pt (Borda scoring).  
  - **Example Rankings**:  
    | Outlook | 1st | 2nd | 3rd |  
    |---------|-----|-----|-----|  
    | IA     | A   | C   | B   |  
    | SC     | B   | A   | C   |  
    | Th     | B   | A   | C   |  
    | LH     | C   | A   | B   |  

  #### **4. Normalization & Robustness Check (30 min)**
  - **Goal**: Compare outlooks without assuming interval scales.
  - **Process**:
    1. **Weighted Borda Score**:  
       `Grant Score = Σ (Outlook Weight × Borda Points)`  
       - A: `(0.35×2) + (0.25×2) + (0.275×2) + (0.125×2) = 2.0`  
       - B: `(0.35×1) + (0.25×3) + (0.275×3) + (0.125×1) = 2.15`  
       - C: `(0.35×3) + (0.25×1) + (0.275×1) + (0.125×3) = 1.85`  
    2. **Robustness Test**:  
       - Re-run with binary points (1st = 1, else 0). If ranking changes, flag ties.  
       - **Binary Scores**:  
         A: `(0.35×0) + (0.25×0) + (0.275×0) + (0.125×0) = 0`  
         B: `(0.35×0) + (0.25×1) + (0.275×1) + (0.125×0) = 0.525`  
         C: `(0.35×1) + (0.25×0) + (0.275×0) + (0.125×1) = 0.475`  
       - Borda: B > A > C; Binary: B > C > A → **Tie between B and C in binary**.  
    3. **Rule**: If top grant differs across normalizations, hand decision to the board as a "values question."  

  #### **5. Handling Hedging & Long-Shots (15 min)**
  - **Goal**: Avoid over-allocating to low-credence outliers.
  - **Process**:
    1. **Hedging Threshold**: Only consider a grant if it is **top-2 in Borda** AND top-1 in at least one outlook with >10% weight.  
    2. **Budget Cap**: Limit long-shot grants (e.g., C) to ≤20% of quarterly payout unless they pass the hedging threshold.  
    3. **Current case**:  
       - C is 3rd in Borda (1.85) and only top-1 in LH (12.5% < 20% cap).  
       - **Verdict**: Do not fund C this round.  

  #### **6. Moral Uncertainty Reduction (10 min)**
  - **Goal**: Decide if part of the budget should resolve uncertainty.
  - **Process**:
    1. Add a placeholder grant: "D: Research on moral uncertainty."  
    2. Evaluate D per outlook:  
       - IA/Th: Low priority (empirical work dominates).  
       - SC: Mid-priority (if research respects rights).  
    3. **Rule**: Fund D only if it ranks top-2 in Borda. Otherwise, skip.  

  #### **7. Non-Number Member Accommodation**
  - Handled in Steps 2 (tokens) and 3 (voting). No numbers needed beyond token allocation.

  #### **8. Exit Conditions (Where to Say "No" or Hand to Board)**
  - **"No"**: 
    - Grant ranks last in Borda and binary.  
    - Grant fails hedging threshold (e.g., C).  
  - **Hand to Board**:  
    - Normalization conflict (Step 4).  
    - Tie in top ranks.  
    - Committee deadlock on an outlook’s ranking.  

  #### **9. Presentability Requirement**
  - **Final Recommendation Format**:  
    "We recommend [Grant] because it is [top choice] for [Outlook 1], [second choice] for [Outlook 2], and performs reasonably across all perspectives. While your outlook may prioritize other grants, this reflects our best balance of competing moral reasons."  

  ---

  ### **Application to Current Proposals**
  Using the weights and rankings above:
  - **Borda Scores**: B (2.15) > A (2.0) > C (1.85).  
  - **Binary Scores**: B (0.525) > C (0.475) > A (0).  
  - **Robustness Check**: Borda favors B; binary favors B but shows C ≈ B. **No conflict** (B wins both).  
  - **Hedging**: C fails threshold (only top in LH; Borda rank 3rd).  
  - **Moral Uncertainty**: D not proposed → skip.  

  **Recommendation**: **Fund B (impact litigation)**.  
  - **Presentable Reason**:  
    > "We chose the impact litigation because it is the top priority for the side-constraint and threshold outlooks, which emphasize rights and protecting the worst-off. While impartial aggregation favors the disease prevention, this grant has broad support across our moral perspectives. A donor focused on aggregate welfare might prefer the disease program, but they should recognize that this decision respects urgent duties to the marginalized."  

  **Why the Committee Might Dislike This**:  
  - IA members see A (disease prevention) as objectively better.  
  - SC/Th members win, but the binary test showed C (risk reduction) close behind B → potential discomfort that a long-shot almost tied.  

  ---

  ### **What the Procedure Cannot Do**
  1. **Self-Referential Trust**:  
     The procedure **cannot** pick itself under moral uncertainty. Choosing MPB assumes it is a neutral "meta-framework" accepted by all outlooks. If outlooks disagree on decision procedures (e.g., SC rejects aggregation), the board must ratify MPB upfront.  

  2. **Limitations**:  
     - **Portfolio Effects**: Cannot optimize grant combinations (assumes independent payouts).  
     - **Continuous Scaling**: Struggles with "how much to fund" (all-or-nothing per grant).  
     - **Deep Incommensurability**: If outlooks disagree on core rankings (e.g., SC calls A immoral), normalization may mask irreconcilable values.  
     - **Non-Additive Credences**: Folds variants into parents; may underweight compound uncertainties.  

  ### **Final Note**  
  MPB makes trade-offs explicit, avoids technical fetishism, and meets the board’s presentability rule. It is imperfect but runnable in 2.5 hours. For self-referential dilemmas, the committee must accept MPB *ex ante* as a fair compromise—or let the board decide.
