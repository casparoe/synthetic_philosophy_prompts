  First, I notice they're explicitly rejecting the superficial "SHOULD = supererogatory" analogy because in RFC terms, SHOULD implies accountability - violating it requires justification. But supererogatory acts demand no justification for omission. That's a sharp observation. Their examples range from kidney donation to minor code cleanups, all testing whether cost-to-agent is essential to the concept.

  The user wants three things: 
  1) A corrected mapping using their technical terms (RFC standards, SLOs, etc.)
  2) Analysis of whether heroism and small favors share the same structure
  3) A "residue report" exposing what gets lost in translation - especially whether praise/blame asymmetry collapses in systems where rewards imply penalties

  Hmm... their "shadow requirement" example (cleaning up unowned modules) is particularly clever - it mirrors philosophical debates about whether trivial favors count as supererogatory. And their suspicion about cost being accidental rather than essential cuts to the heart of a live academic dispute.

  I should flag upfront that philosophers disagree on: 
  - Whether supererogation requires significant sacrifice (the "cost debate")
  - If trivial favors qualify (their "wallet return" example tests this)
  - How praise functions without blame (their "residue" question)

  For mapping, MUST/MAY won't work because supererogation isn't about permission levels. Better to borrow their SLO framework: duties are like hard SLOs (breach = incident), while supererogatory acts are like exceeding SLOs without penalty for meeting baseline. 

  Key insight: In their systems, "rewarded if done" usually implies "penalized if not" (like performance bonuses). But supererogation decouples praise from blame - hence their vocabulary lacks this asymmetry. That evaporation during translation might reveal why human ethics can't be fully captured by accountable systems.

  For their examples: Kidney donation and subway rescue clearly qualify as supererogatory under all definitions. Not tipping is complex (social norm vs moral duty debate). Wallet return tests the cost question - most philosophers would call it supererogatory only if contextual effort was trivial. Their 2am bug fix and shadow cleanup sit in contested territory where cost/benefit ratios get fuzzy.

  Final residue: Technical systems struggle with uncoupled praise/blame because they're designed for accountability. The fact that supererogation evaporates in translation might expose how human ethics reserves space for "grace" - actions that exceed mechanical obligation. That could be the real payload for a engineer who deals in binary systems.
answer: |-
  Here's the rebuild using your vocabulary, with friction points highlighted and a residue report. The core insight: **supererogation isn't a requirement level (MUST/SHOULD/MAY), it's a *semantic annotation* about an action *outside* the core spec.**

  ### The Corrected Mapping
  1.  **MUST:** Duty/Obligation. Violation is a **P0 defect**, blocks merge, pages on-call. Requires justification (postmortem). *Equivalent:* Core SLO violation burning error budget.
  2.  **SHOULD:** Strong Best Practice. Violation is a **lower-severity defect** (e.g., P2), warrants a blocking review comment ("Necessary Fix"), should be justified if skipped. Skipping *might* eventually burn error budget if it causes issues. *Not Supererogatory.*
  3.  **MAY:** Permissible/Optional. No defect, non-blocking review comment ("Nice to Have"), no justification needed. Often stylistic or minor optimizations.
  4.  **Supererogatory:** **Not in the Spec.** It's an **ad-hoc contribution** that:
      *   **Exceeds the SLO/Spec:** Goes beyond defined requirements.
      *   **Zero Penalty for Omission:** No defect filed, no blocked merge, no justification needed, doesn't burn error budget if skipped. *Not a SHOULD violation.*
      *   **Praiseworthy if Done:** Gets positive review comments ("Nice!"), visible credit in rubric/perf review, maybe a shoutout. Like a high-value, unexpected feature delivered "best-effort" outside sprint planning.
      *   **Key:** The praise/blame asymmetry is fundamental. Your vocabulary *lacks a native construct* for this asymmetry.

  ### Your Examples Mapped
  *   **Kidney Donor:** **Supererogatory.** Not in the "human spec" (MUST/SHOULD). Zero penalty for keeping kidneys. High praise for donating. High cost, but *cost isn't definitional* (see below).
  *   **Subway Stranger:** **Supererogatory.** Same as kidney. Extreme cost/risk amplifies praise, but omission isn't blameworthy.
  *   **Staying up until 2am fixing teammate's bug:** **Contested.**
      *   *If on-call/ownership implies mutual aid:* Leans towards **SHOULD**. Skipping *might* need justification (e.g., "I was swamped"), could be seen as a minor defect in teamwork. Praise for doing it is muted ("met expectation").
      *   *If truly outside any reasonable expectation:* **Supererogatory.** High praise, zero blame for skipping. Context (severity, your workload, team norms) is critical.
  *   **Handing back wallet with cash:** **Supererogatory (Typically).** Low/no cost, high praiseworthiness (shows integrity), zero blame for keeping it (legally/morally dubious, but not *blameworthy* in the supererogatory sense - might be a SHOULD or even MUST violation in some frameworks! Philosophers fight here). *Cost is minimal, proving it's not essential.*
  *   **Not Tipping (Where customary):** **Likely a SHOULD Violation (in that context).** Socially expected, omission often seen as blameworthy (mild defect), doing it is baseline (no special praise). *Not Supererogatory.*
  *   **Quietly cleaning up unowned module ("Shadow Requirement"):** **Pure Supererogatory.** Exactly your description: Not in spec, never blocks merge, gets credit if done, no penalty if skipped. Textbook example. Low cost, high team value.

  ### The Cost Question
  *   **Cost is NOT definitional.** Your wallet example proves it. Supererogatory acts are *often* costly/risky (kidney, subway), making them more noticeable and praiseworthy. But low-cost acts (wallet return, code cleanup) can be supererogatory if they exceed obligation and have the praise/blame asymmetry.
  *   **Cost is a *magnifier*, not a requirement.** High cost makes praise more intense and omission more understandable, but doesn't change the core category. Philosophers agree on this: low-cost supererogation exists.

  ### The Residue Report (What Doesn't Survive / Friction Points)
  1.  **Praise/Blame Asymmetry is the Core Residue:** Your technical vocabulary fundamentally **lacks a mechanism for asymmetric evaluation**.
      *   In perf rubrics/SLOs/defect tracking, "rewarded-if-done" **always implies a penalty (or missed reward) for skipping.** "Exceeds Expectations" implies "Meets" and "Below Meets". A "Nice to Have" implemented is +credit, skipped is neutral, but skipping isn't *actively* penalty-free if it later causes issues tracked elsewhere.
      *   Supererogation requires **positive credit with *genuinely* zero negative consequence or expectation.** Your "shadow requirement" gets closest, but even there, *not* doing it might subtly impact peer perception (a soft penalty), and doing it feeds into a rubric where "did extra" is scored. True supererogation would be like a commit that adds immense value but isn't even *mentionable* in your perf review, only in hallway praise.
      *   **Why it Evaporates:** Technical systems are built for **accountability and measurability**. Asymmetric praise/blame requires a **contextual, qualitative judgment** that resists formalization into rules or scores. It lives in the realm of human recognition, not system gates.

  2.  **The "Ought" Gap:** RFC terms define levels of *requirement*. Supererogation sits **alongside** requirements. It's not a weaker "should"; it's something entirely different. Translating it as a requirement level (even SHOULD) fundamentally misrepresents it. Your vocabulary has no slot for "good thing outside the spec."

  3.  **Motivation Opacity:** Technical systems care about *what* was done, not *why*. Supererogation often carries connotations of **especially virtuous motivation** (altruism). Your vocabulary can't capture this. Cleaning the module for credit vs. genuine care looks the same in the git log.

  4.  **The Boundary Friction:** Distinguishing supererogatory from SHOULD is **highly context-dependent** (like your 2am bug fix). Your vocabulary struggles with fuzzy boundaries not defined in the spec. Philosophers fight over these boundaries constantly (e.g., is extreme risk *so* high it becomes a duty? Is a trivial favor *really* supererogatory?).

  ### Philosophical Consensus vs. Live Disagreements
  *   **Settled (Consensus):**
      *   Supererogation = Beyond duty, praiseworthy to do, *not blameworthy* to omit.
      *   Cost is not a *defining* feature (low-cost supererogation possible).
      *   It exists as a distinct category (duties aren't supererogatory).
  *   **Live Disagreements (Fighting Grounds):**
      *   **The Cost Threshold:** How costly must an act be to *qualify* as supererogatory? (Most agree it's not defining, but disagree on minimums).
      *   **The "Why" Matters:** Does the *motive* (pure altruism vs. reward-seeking) affect whether an act is supererogatory?
      *   **Scope of Duty:** What exactly *are* our core duties? (This defines the baseline "beyond" which supererogation starts). Is returning a wallet a *duty* (SHOULD/MUST) or supererogatory? **Huge fight.**
      *   **Omissions:** Can *failing* to do a supererogatory act *ever* become blameworthy under extreme circumstances? (Rare, but debated).

  ### Conclusion
  Your vocabulary **lacks the core machinery** to fully capture supererogation because it's built on **symmetric accountability** (rewards imply potential penalties, requirements define the playing field). The concept *evaporates* under strict translation because:

  1.  **The praise/blame asymmetry** has no clean counterpart. Systems struggle with "pure positive credit with zero downside omission."
  2.  Supererogation exists **outside the spec**, while your terms define the spec's levels.

  The closest analog is your "**Shadow Requirement**" – an action outside the formal spec that attracts praise but carries no penalty for omission. However, even this subtly bends towards the system (credit in reviews). The **evaporation itself is the insight**: formal systems prioritize defined obligations and measurable outcomes, leaving little room for the purely optional, context-dependent, asymmetrically evaluated "good beyond duty" that supererogation represents. Philosophers might be leaning on a *qualitative human judgment* that resists clean codification into the rules engines (RFCs, SLOs, merge gates) you work with. The "missing slot" is for **uncoupled, non-accountable positive valence**.
