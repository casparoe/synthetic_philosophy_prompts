prompt: |-
  I run a tiny reading group — four of us, two on each side — that spent most of last year on the causal exclusion argument and got exactly nowhere, so we've now agreed to do an adversarial collaboration and I got volunteered to draft the joint statement. Which I'd like you to do instead, because my own attempts keep getting recieved as slanted by whichever side I wasn't writing for that week. One side is the exclusionist: every physical effect that has a cause has a sufficient physical cause, mental properties aren't (at the level of types, anyway) physical properties, distinct sufficient causes don't systematically overdetermine the same effect, so the mental as such does no causal work, and the honest options are reduction or some weaker surrogate. The other side holds that mental properties do genuine causal work as difference-makers at the grain the special sciences actually use, and that the argument only bites if you smuggle a very particular picture of causation into the premises — single, sufficient, productive, and indifferent to how the effect is specified. Assume we've all read the standard material and nobody needs to be told who argued for what: no citations, no paper titles, nothing resting on the exact wording of a published argument, please. I want the claims, not the footnotes.

  What I'd like: (1) a numbered section of agreed claims — say five to ten, each genuinely load-bearing rather than the sort of thing nobody denies ('causation is contested' — I'll throw the document out); (2) a disagreements table with these columns: the crux, the exclusionist's own formulation (worded so they'd sign it), the non-reductivist's own formulation (same), the single case or argument both sides accept as bearing on that crux, and each side's prediction about how it comes out, written down in advance like a pre-registration; (3) an explicit note on which parts of our dispute, if any, turn out to be verbal, with the substantive version of each reformulated disagreement or an explanation of why there isn't one; (4) a short closing note from you as the drafter: which of the agreed claims you'd bet least on, what result or argument would actually move one or both camps, and where you think this whole exercise is most likely to fail — e.g. that the cruxes aren't independent, that one side wouldn't really accept the wording you gave it, or that the test cases can't discriminate between them.

  Two things to build in, because they're what my own drafts kept breaking on. First, I have a hunch the deep crux is whether 'sufficient' in the closure premise means sufficient for the *occurrence* of the effect or sufficient for the *difference* the effect consists in — tell me whether that distinction dissolves anything or just relocates the fight one step back. Second, here are the cases I want used as the shared probes; add your own if they don't discriminate. Locked Route: an agent's reaching is produced by neural route R1, which realizes the relevant intention-plus-belief state M, and there is a hardwired backup route R2 that doesn't fire but would have produced the very same reaching had R1 failed — did M cause the reaching? Scatter: across a population the same mental property M is realized by many different physical states, each of which produces the behavior, with no single physical-state type present in every case — did M cause the behavior, and does it matter that only M is invariant across the population? Grain Shift: the very same event described as 'the hand moved at t at velocity v' versus 'she reached for the glass' — does the exclusion pressure change with how the effect is specified, and if so which specification is the argument entitled to? For each, give me both camps' verdict and, more importantly, what each would count as having gone wrong if the other's verdict is right.
reasoning: |-
  We are drafting a joint statement for an adversarial collaboration on the causal exclusion argument. The two sides are the exclusionist (E) and the non-reductivist (NR). We need:

  1. A numbered section of agreed claims (5-10, load-bearing).
  2. A disagreements table with: crux, E's formulation, NR's formulation, shared test case, E's prediction, NR's prediction.
  3. A note on verbal disputes and substantive reformulations.
  4. A closing note from the drafter.

  Additionally, we must address:
  - The distinction between "sufficient for occurrence" vs. "sufficient for the difference".
  - Test cases: Locked Route, Scatter, Grain Shift.

  ---

  **1. Agreed Claims** (Load-bearing, not trivial)

  Both sides agree on the following:

  1. **Physical Closure**: Every physical effect that has a cause has a sufficient physical cause at the time of its occurrence. (This is the closure premise, accepted by both but interpreted differently.)

  2. **Distinctness**: Mental properties (as types) are not identical to physical properties (as types). (This is the non-reductive physicalist starting point; exclusionists accept it for the sake of argument but then argue it leads to problems.)

  3. **Non-Systematic Overdetermination**: It is not the case that every behavioral effect is systematically overdetermined by two distinct sufficient causes (one mental, one physical). (Both sides reject systematic overdetermination as implausible.)

  4. **Causal Relevance of the Mental**: Mental properties are (at least sometimes) correlated with behavioral effects in such a way that they would be difference-makers if they were causes. (This sets up the disagreement: E thinks they aren't causes, NR thinks they are.)

  5. **Realization**: Mental properties are realized by physical properties (i.e., when a mental property M is instantiated, it is in virtue of some physical property P being instantiated). (Both accept supervenience without reduction.)

  6. **Causal Exclusion Principle**: If an effect E has a sufficient cause C at a time T, then no other distinct cause C* at T is a cause of E (unless it is a case of overdetermination). (Both accept the principle, but disagree on when it applies.)

  7. **The Challenge**: The causal exclusion argument presents a challenge that must be addressed: if the physical cause is sufficient and the mental cause is distinct, then unless we accept systematic overdetermination, the mental cause is excluded. (Both agree it's a serious argument that needs a response.)

  8. **Causation is Relational**: Causal claims depend on the context and the way events are described. (Both accept that causation is not a context-invariant relation, but draw different conclusions.)

  ---

  **2. Disagreements Table**

  We present the key cruxes, each side's formulation, a shared test case, and predictions.

  | Crux | Exclusionist (E) Formulation | Non-Reductivist (NR) Formulation | Shared Test Case | E's Prediction | NR's Prediction |
  |------|-----------------------------|----------------------------------|-------------------|----------------|-----------------|
  | 1. **What 'sufficient cause' means in closure** | "Sufficient cause" in physical closure means a cause that is sufficient for the occurrence of the effect, regardless of how the effect is described. | "Sufficient cause" in physical closure means a cause that is sufficient for the effect under a particular description, and the relevant description for causal explanation in the special sciences may not be the same as in physics. | Grain Shift | E predicts that the exclusion argument applies regardless of description: the physical cause is sufficient for the occurrence (the hand moving) and thus excludes the mental cause (reaching) if they are distinct. | NR predicts that the exclusion argument only applies if we insist on describing the effect in the same grain as the physical cause; when we shift to the coarse-grained description (reaching), the mental property can be a difference-maker without exclusion. |
  | 2. **Whether mental properties can be difference-makers without being productive** | A cause must be productive: it must be part of a chain of production that brings about the effect. Mental properties, being non-physical, are not part of the productive chain and thus cannot be causes. | A cause can be a difference-maker without being a productive cause in the physical sense; it can be a higher-level feature that makes a difference to the effect in the context of a pattern of counterfactuals. | Scatter | E predicts that in Scatter, the mental property M is not a cause because there is no single productive physical chain that M corresponds to; each physical realization is productive, but M is just a pattern. | NR predicts that in Scatter, M is the invariant difference-maker across the population, so it is the cause at the level of the special science, even if the physical realizations vary. If the effect is described in terms of behavior (e.g., reaching), M causes it. |
  | 3. **Whether backup routes exclude the mental cause** | If there is a sufficient physical cause (R1) and a backup (R2) that would have produced the same effect, then the mental property M (realized by R1) is not a cause because if M had been absent and R1 still occurred (by some fluke), the effect would still have occurred, so M is not a difference-maker. | The mental property M is a cause because in the actual scenario, R1 (which realizes M) is active, and the backup R2 is not. The counterfactual "if M had not been present, the effect would not have occurred" is true because if M had not been present, R1 would not have occurred (by realization) and R2 might not have been triggered (if the absence of M also means the conditions for R2 are not met). | Locked Route | E predicts that M is not a cause because the effect is overdetermined by the physical cause and the backup, making the actual cause (R1) redundant in a way that shows M is not necessary. | NR predicts that M is a cause because in the actual situation, the backup is inactive and the effect depends on M via R1. They would say that the counterfactual "if M had not occurred, the effect would not have occurred" holds, because without M, R1 wouldn't have occurred and R2 might not be triggered (unless the backup is set to trigger regardless). |
  | 4. **What level of grain is appropriate for causal claims** | Causal claims should be made at the fundamental physical level, or at least, the causal exclusion argument applies at the level of occurrence, which is physical. | Causal claims are context-dependent and can be made at multiple levels of grain; the special sciences are entitled to their own level of description. | Grain Shift | E predicts that the exclusion argument applies to the effect described as 'the hand moved' and that this description is prior; if the mental cause is excluded at that level, it is excluded simpliciter. | NR predicts that the exclusion argument loses force when the effect is described as 'she reached for the glass' because that description is not the same as the physical one and is the relevant one for mental causation. |

  ---

  **3. Verbal Disputes and Substantive Reformulations**

  The drafter notes:

  - The distinction between "sufficient for occurrence" vs. "sufficient for the difference" may be partly verbal. If "occurrence" is taken to mean the entire event token, then both sides agree that the physical cause is sufficient for the occurrence. But if "the difference" refers to the specific way the effect occurs (e.g., as a reaching rather than a flinch), then the dispute becomes substantive: does the physical cause, by itself, account for the effect under that description? 

    - Substantive reformulation: The exclusionist holds that the physical cause is sufficient for the effect under any description (including the coarse-grained one), so there is no work left for the mental. The non-reductivist holds that the physical cause, while sufficient for the fine-grained occurrence, does not account for the causal relevance of the coarse-grained property (e.g., being a reaching) without the mental property.

  - The term "cause" itself may be used in different senses (productive vs. difference-making). This is not merely verbal because each side denies the other's sense is the correct one for causal explanation in the special sciences. 

    - Substantive core: The exclusionist requires that a cause must be productive (and thus physical) to be real. The non-reductivist holds that difference-making is sufficient for causal relevance in higher-level sciences.

  - In Locked Route, the verbal issue might arise over "overdetermination". The exclusionist sees the backup as making the actual cause (R1) and thus M redundant, while the non-reductivist sees the backup as irrelevant because it didn't occur. 

    - Substantive issue: What makes a cause necessary? The exclusionist uses a counterfactual that holds the physical level fixed (if M is absent but R1 occurs, the effect happens), while the non-reductivist allows the absence of M to affect the physical level (so if M is absent, R1 is absent).

  ---

  **4. Drafter's Closing Note**

  As the drafter, I note:

  - **Least confident in Agreed Claim 4**: "Causal Relevance of the Mental". Both sides agree that mental properties are correlated with behavior in a way that looks causal, but the exclusionist will argue that this is epiphenomenal. This claim might be too weak to be load-bearing.

  - **What would move the camps?** 
    - For the exclusionist: If it can be shown that the physical cause is not sufficient for the effect under the relevant special science description (e.g., in Scatter, that the physical realizations do not form a projectable kind, while M does). 
    - For the non-reductivist: If it can be shown that the mental property does not make a difference in a way that isn't already accounted for by the physical (e.g., in Locked Route, if the backup always fires regardless of the mental state).

  - **Where the exercise is most likely to fail**:
    - The cruxes are not independent. For example, the Grain Shift case ties into the meaning of 'sufficient cause' and the level of grain. If one side doesn't accept the test case as described (e.g., if the exclusionist insists that the backup in Locked Route does make the mental cause redundant), the test might not discriminate.
    - Wording: The exclusionist might not accept the NR formulation of the 'sufficient cause' crux as including description-relativity, seeing it as begging the question. Similarly, the NR might see the E formulation of the productive cause as question-begging.
    - The test cases might be interpreted differently: e.g., in Locked Route, does the backup require the absence of R1 to fire? Both sides might stipulate different conditions, making the case indeterminate.

  - **On the deep crux**: The distinction between "sufficient for occurrence" and "sufficient for the difference" does not dissolve the dispute. It relocates it to: what does the physical closure principle require? The exclusionist takes it to require sufficiency for the occurrence, which then precludes any other cause. The non-reductivist argues that closure only applies at the physical grain, and that the mental can still be a difference-maker at a coarser grain. This is the heart of the matter and remains a substantive disagreement.

  Given the above, I provide the full draft below.
answer: |-
  ### Joint Statement: Adversarial Collaboration on Causal Exclusion  
  **Participants**: Exclusionist (E) and Non-Reductivist (NR) perspectives  

  ---

  #### **1. Agreed Claims**  
  Both sides endorse these load-bearing premises:  
  1. **Physical Closure**: Every physical effect has a sufficient physical cause at the time of its occurrence.  
  2. **Property Distinctness**: Mental properties (as types) are not identical to physical properties (as types).  
  3. **Anti-Overdetermination**: Behavioral effects are not systematically overdetermined by distinct sufficient causes (e.g., mental and physical).  
  4. **Realization Dependency**: The instantiation of a mental property depends on (is realized by) a physical property.  
  5. **Causal Exclusion Principle**: If an effect has a sufficient cause at time *t*, no other distinct cause at *t* explains that effect (barring overdetermination).  
  6. **Mental Correlation**: Mental properties are reliably correlated with behavioral effects in contexts where they appear causally relevant.  
  7. **Grain Sensitivity**: Causal claims depend on how effects are described (e.g., fine-grained physical vs. coarse-grained behavioral descriptions).  

  ---

  #### **2. Disagreements Table**  
  | Crux | Exclusionist (E) Formulation | Non-Reductivist (NR) Formulation | Shared Test Case | E’s Prediction | NR’s Prediction |  
  |------|------------------------------|----------------------------------|-----------------|---------------|----------------|  
  | **1. Meaning of 'sufficient cause' in closure** | "Sufficient" means the cause guarantees the *occurrence* of the effect (its existence at *t*), regardless of description. | "Sufficient" means the cause guarantees the *difference* the effect makes relative to alternatives (e.g., behavior *as such*), which depends on description. | **Grain Shift**: Effect = fine-grained ("hand moved at *t* at velocity *v*") vs. coarse-grained ("she reached for the glass"). | E: Exclusion applies identically; physical cause suffices for *occurrence* of either description. Mental cause is excluded. | NR: Exclusion only bites on fine-grained descriptions. Coarse-grained effects (e.g., reaching) require mental properties as difference-makers. |  
  | **2. Efficacy of multiply realized properties** | A property cannot cause an effect if it lacks a productive physical mechanism; invariance across realizers is explanatory but not causal. | A multiply realizable property causes an effect if it is the invariant difference-maker across contexts, regardless of physical heterogeneity. | **Scatter**: Same behavior (e.g., reaching) caused by diverse physical states; only mental property *M* is invariant. | E: *M* is not a cause; physical realizers do the work. Scatter shows *M*’s causal irrelevance. | NR: *M* causes the behavior; Scatter proves *M*’s indispensability as the robust difference-maker. |  
  | **3. Impact of backup mechanisms** | A mental cause is excluded if the effect would occur via an alternative physical route absent the mental property. | A mental cause is not excluded if, in the actual scenario, no backup triggers, and the mental property modally depends on the active realizer. | **Locked Route**: Reaching occurs via neural route R1 (realizing *M*); backup R2 (non-mental) exists but doesn’t fire. | E: *M* is excluded; R1 suffices, and R2 ensures the effect would occur without *M*, making *M* redundant. | NR: *M* causes the reaching; R2’s inactivity makes *M* via R1 the actual difference-maker. |  
  | **4. Primacy of causal description** | Causal claims must bottom out in physical occurrence; mental descriptions are derivative and causally inert. | Causal claims are context-relative; special sciences validly use coarse-grained descriptions where mental properties are difference-makers. | **Grain Shift** (reused for discrimination) | E: If NR’s verdict on coarse-grained effects is right, it conflates explanation with causation. | NR: If E’s verdict is right, it arbitrarily privileges physical grain, invalidating special sciences. |  

  **Predictions on Test Cases**:  
  - **Locked Route**:  
    - E predicts failure if *M* is deemed causal: It would violate anti-overdetermination (R1 and *M* both "sufficient").  
    - NR predicts failure if *M* is excluded: It would misapply "sufficient cause" to occurrence alone, ignoring *M*’s difference-making role.  
  - **Scatter**:  
    - E predicts failure if *M* is causal: It would confound correlation (invariance) with production.  
    - NR predicts failure if *M* is excluded: It would ignore that physics cannot explain the behavioral regularity without *M*.  
  - **Grain Shift**:  
    - E predicts failure if exclusion weakens under coarse-grained description: It would equivocate on "effect."  
    - NR predicts failure if exclusion persists: It would impose an irrelevant standard of causation.  

  ---

  #### **3. Verbal Disputes and Substantive Reformulations**  
  - **Verbal Dispute**: Whether "cause" requires *production* (E) or *difference-making* (NR).  
    - *Substantive Reformulation*: Do the physical sciences exhaust causal production? E asserts yes; NR denies it, arguing difference-making is causal in non-fundamental contexts.  
  - **Verbal Dispute**: Whether "sufficient" in closure refers to *occurrence* (E) or *difference* (NR).  
    - *Substantive Reformulation*: Does physical closure entail that mental properties cannot *explain behavioral differences*? E says yes; NR says no, as closure only addresses occurrence.  
  - **Non-Verbal Core**: The Locked Route case turns on whether backups make mental properties redundant *in principle* (E) or irrelevant *in actuality* (NR). No reformulation resolves this; it hinges on modal intuitions about causation.  

  **Outcome**: The "occurrence vs. difference" distinction **relocates but does not dissolve** the dispute. It sharpens the debate to whether physical closure precludes mental difference-making (E) or is compatible with it (NR).  

  ---

  #### **4. Drafter’s Closing Note**  
  - **Least Confident in Agreed Claim 7 (Grain Sensitivity)**: Both sides agree descriptions matter, but E sees this as epistemic (not causal), while NR sees it as ontological. This masks unresolved tension.  
  - **What Would Move the Camps**:  
    - **Exclusionist**: If Scatter showed behavioral regularities *require* mental properties for prediction/explanation *and* physics cannot replicate this.  
    - **Non-Reductivist**: If Locked Route demonstrated that backups *always* activate without the mental property, rendering *M* irrelevant.  
  - **Where This Exercise Fails**:  
    - **Crux Interdependence**: The test cases (e.g., Grain Shift) presuppose a stance on "sufficient cause," risking circularity.  
    - **Wording Rejection**: E may balk at NR’s "difference" formulation (Crux 1) as smuggling in mental efficacy; NR may reject E’s "productive mechanism" (Crux 2) as question-begging.  
    - **Test Case Discrimination**: Locked Route’s backup might be interpreted differently (e.g., does it activate only if R1 fails? Unclear stipulations).  
    - **Prediction Bias**: Each side may dismiss unfavorable test-case outcomes as misapplying their view.  

  **Final Assessment**: The collaboration is most likely to stall on **Grain Shift**, as it forces a choice between physical fundamentality (E) and causal pluralism (NR) that neither can concede without collapsing their position. The distinction between "occurrence" and "difference" is the keystone—break it, and the arch falls.
