  I = π/12 + (1/2)*√3

  Therefore,

  P = 1/4 + (1/π) * (π/12 + √3/2)
  = 1/4 + (1/π) * (π/12) + (1/π) * (√3/2)
  = 1/4 + 1/12 + √3/(2π)
  = (3/12 + 1/12) + √3/(2π)
  = 4/12 + √3/(2π)
  = 1/3 + √3/(2π)

  So Dan is correct: the probability is 1/3 + √3/(2π) ≈ 0.609.

  **Now the second procedure**: Choose the chord's length uniformly from [0, 2R]. Then the probability that the chord is longer than the side of the triangle (which is √3 R) is the probability that the length L > √3 R. Since L is uniform on [0, 2R], the probability is (2R - √3 R) / (2R) = 1 - √3/2 ≈ 1 - 0.8660 = 0.134. So that is also correct.

  Therefore, Dan's arithmetic is correct.

  Moreover, Dan argues that unless Sofia's requirement rules out all but one measure, we can get any probability by mixing. This is true: if there are multiple measures that satisfy the rotational symmetry (and no distinguished point) then we can get a range of probabilities.

