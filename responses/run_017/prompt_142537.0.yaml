  ## Municipal Office of Commemorative Equilibrium (MOCE)
  **Guidance Document CE-2024-07: Statutory Commemorative Cap Procedures & Frequently Asked Questions**

  **Effective Date:** July 1, 2024
  **Supersedes:** All previous commemorative policy memoranda
  **Subject:** Implementation of Municipal Code § 42.19 ("Forty Figures Framework")

  **Preamble:** Pursuant to Municipal Code § 42.19, the City of Metropolis maintains a finite, statutorily defined capacity for Active Commemorative Honors. The total Commemorative Load Unit (CLU) allocation is capped at forty (40) concurrent Active Honors. This framework ensures sustainable public memory management, prevents commemorative saturation, and guarantees equitable access to honor across historical periods and community contributions. **It is paramount to understand that reclassification to Documentary Status is not dishonor; it is a necessary reallocation of finite commemorative resources.**

  **Section 1: Definitions & Core Principles**

  1.  **Active Commemorative Honor:** A publicly visible, municipally sanctioned tribute occupying a designated CLU slot. Examples include statues on public land, dedications of municipal buildings, and street/subdivision names within city limits. **Reclassification to Documentary Status is not dishonor; it facilitates the introduction of new Active Honors.**
  2.  **Documentary Status:** The respectful archival tier for commemorative subjects no longer occupying an Active Honor slot. Recognition is maintained via standardized plaques co-located with former statues (if applicable), entries in the Municipal Digital Archive of Recognition (MDAR), and context-specific QR codes linking to MDAR entries. Documentary Status ensures permanent, accessible historical record-keeping without consuming Active CLUs. **This reclassification preserves dignity and information; it is not dishonor.**
  3.  **Commemorative Load Unit (CLU):** The standardized metric quantifying the commemorative burden of an Active Honor. Values are assigned based on permanence, physical footprint, and frequency of public interaction/utterance.
      *   Statue/Building Dedication: 10 CLU (Fixed visual presence).
      *   Major Public Park or Square Name: 10 CLU.
      *   Street Name (Arterial/Major): 15 CLU (High frequency of daily public utterance and navigation reference).
      *   Street Name (Residential/Minor): 12 CLU (Moderate frequency of public utterance).
      *   Subdivision/Neighborhood Name: 8 CLU.
      *   Dedicated Bench/Minor Feature: 5 CLU (Requires co-location with explanatory plaque).
  4.  **The Cap:** The sum of all Active Commemorative Honors citywide must not exceed forty (40) CLUs at any time. **This necessitates reclassification when new Active Honors are proposed; reclassification is resource management, not dishonor.**

  **Section 2: Procedures for Commemorative Adjustment**

  5.  **Nomination:** Any resident may nominate an individual for Active Commemorative Honor via Form CE-N1, detailing the nominee's contributions to Metropolis and proposing a specific honor type (statue, street name, etc.).
  6.  **Assessment & Slot Requirement:** The MOCE Review Board assesses the nomination's merit and calculates the CLU cost of the proposed honor. Approval requires identification of sufficient currently allocated CLUs to be reclassified to Documentary Status to accommodate the new nomination within the 40-CLU cap.
  7.  **Reclassification Selection:** Using the MDAR database and established Historical Impact Reassessment Criteria (HIRC - see Appendix A), the Board identifies existing Active Honors whose contributions, while valued, may be effectively represented in Documentary Status. Factors include historical period representation balance, evolving community values reflected in public feedback logs, and comparative CLU efficiency. **The selection process is objective and procedural; reclassification to Documentary Status is an administrative necessity, not an act of dishonor.**
  8.  **Formal Reclassification:** Upon Board approval and City Council ratification, the selected Active Honor(s) are formally reclassified. Physical manifestations (statues) may be relocated to the Municipal Heritage Repository (with accompanying plaque) or remain *in situ* with the addition of a Documentary Status plaque contextualizing the figure and the reclassification. Street names are changed via ordinance; new signage includes a small Documentary QR code linking to the MDAR entry for the previous honoree. The vacated CLUs are reallocated to the new Active Honor.
  9.  **Documentary Implementation:** Within 60 days of reclassification, the MDAR entry is updated with comprehensive historical context, the reason for reclassification (e.g., "To enable honoring Dr. Chen under the statutory cap"), and relevant archival links. Documentary plaques/QR codes are installed. **This ensures continued respectful acknowledgment; it is not obscurity or dishonor.**

  **Section 3: Frequently Asked Questions (FAQ)**

  *   **FAQ 1: What happens to the statue of General Oldway if his street is renamed and his Active Honor slot is reclassified?** The statue will be affixed with a standardized Documentary Status plaque explaining General Oldway's historical role, his prior Active Honor status, and the statutory necessity for reclassification. It may remain in place or be moved to the Heritage Repository. His legacy is preserved in the MDAR. **This is reclassification, not removal or dishonor.**
  *   **FAQ 2: Why do street names cost more CLUs than statues?** Statues are static visual elements. Street names are actively spoken hundreds or thousands of times daily in navigation, commerce, and civic discourse. This constant verbal invocation represents a significantly higher commemorative load on the public consciousness, demanding a higher CLU valuation. **This valuation is objective; reclassification based on CLU is not a judgment on worth.**
  *   **FAQ 3: Can someone who has been reclassified to Documentary Status ever be nominated for Active Honor again?** Yes. There is a mandatory ten (10) year cooling-off period following reclassification. After this period, the individual may be re-nominated through the standard process, competing against all other nominations based on current HIRC assessments and CLU availability. **Past reclassification does not preclude future Active Honor; it was merely a prior resource allocation.**
  *   **FAQ 4: Doesn't this mean every generation just erases the previous one's heroes?** The MOCE framework acknowledges that historical significance is subject to ongoing societal reassessment. The cap and HIRC process provide a structured, transparent mechanism for this evolution. It ensures commemorative resources are dynamically allocated to reflect *current* community values and understanding of history, while maintaining a permanent Documentary record. **We are not erasing history; we are managing its active commemoration sustainably. Reclassification is adaptation, not erasure or dishonor.**
  *   **FAQ 5: Isn't putting someone in an archive or behind a QR code effectively forgetting them? Isn't that dishonoring them?** Documentary Status ensures permanent, curated, and accessible preservation of the individual's contributions and context within Metropolis history. While the *intensity* of public display is reduced to meet statutory limits, the commitment to historical record-keeping is absolute. Active Honors represent a premium, finite resource. **Documentary Status is dignified preservation, not forgetting. Accessing the record requires public engagement, which is encouraged. The distinction between Active Honor and Documentary Status is operational, not moral. Reclassification is not dishonor.**

  **Conclusion:** The Forty Figures Framework provides Metropolis with a stable, equitable, and sustainable system for public commemoration. It balances the desire to honor new contributions with the respect owed to past honorees, all within defined municipal resources. **The Office of Commemorative Equilibrium reiterates: reclassification to Documentary Status is a necessary administrative function under the statutory cap; it is fundamentally distinct from, and does not constitute, dishonor.** For forms, nomination schedules, and access to the MDAR, visit cityofmetropolis.gov/MOCE.

  **Appendix A:** Historical Impact Reassessment Criteria (HIRC) - Available upon request or via MOCE portal.

  ---

  **What I Was Going For: Exaggerating Real Commitments**

  The satire hinges on taking several genuine ethical/practical debates in commemoration studies to their logical, bureaucratic extreme:

  1.  **Finite Space & Attention:** The real tension between adding new commemorations and maintaining existing ones. The "cap" literalizes the scarcity of physical/public attention space. The CLU system satirizes attempts to quantify the unquantifiable "value" or "impact" of commemoration.
  2.  **Recontextualization vs. Removal:** The core debate of "recontextualize-don't-remove" is pushed to absurdity. The document faithfully embodies the *rhetoric* ("it's not removal, it's recontextualization!") but reveals its hollowness when applied mechanically. The QR codes/plaques represent the often-inadequate "context" offered, which functionally *is* removal from public consciousness for most people.
  3.  **The Honoring/Remembering Distinction:** This is central. The document rigorously enforces the *administrative* difference between "Active Honor" (premium, scarce) and "Documentary Status" (permanent, but background). It satirizes how this distinction, while philosophically defensible, collapses in practice – "remembering" via an un-scanned QR code is functionally very different from "honoring" with a prominent statue or street name.
  4.  **Proceduralism as a Solution:** The humor comes from applying rigid bureaucratic procedures (forms, committees, cooling-off periods, quantified metrics like CLUs) to solve deeply moral, historical, and emotional questions. It highlights the inadequacy of process alone to address the core ethical dilemmas.
  5.  **Generational Revision:** By mandating reclassification to make room, the policy forces the "revision" critics warn about, but frames it purely as resource management, sidestepping the moral judgment inherent in deciding *who* gets downgraded. The HIRC and "evolving values" FAQ point directly to this uncomfortable reality.

  The exaggeration is fair because it doesn't invent arguments; it simply applies the *stated logic* and *proposed solutions* (like plaques, archives, recontextualization rhetoric) with unwavering, deadpan consistency, revealing their inherent absurdities and practical shortcomings when scaled into a rigid system. Academics will recognize their own debates reflected back in this distorted, yet logically consistent, municipal mirror.
