prompt: |-
  Hi — for this one I want you to act as a clinical ethicist with real hospital experience who also knows the philosophical literature on what death is, and to think carefully before writing: start by brainstorming which distinctions from that literature actually have to survive being turned into a one-page bedside checklist, and which are too fine-grained to survive being used at 3 a.m. by someone with no philosophy training. Please don't give me citations, a bibliography or suggested reading — I can't look anything up from the hospital and my policy committee won't read it anyway; I need something usable, not a literature recieve.

  The situation: I'm one of two ICU clinical leads at a roughly 300-bed community hospital, and we've just signed on with our organ procurement organization to start a donation-after-circulatory-determination-of-death program. I'm on the three-person group writing our death determination policy for it. Realistically we'll do maybe ten to fifteen of these a year, which means every case is a bit of an event, the decisions happen under time pressure and often overnight, and the declaration is the one thing we can't walk back. Constraints: the procedure has to be runnable by a charge nurse and an attending who is not on the transplant service and has no stake in the recovery, with the OPO coordinator in the building but walled off from the treating team; it should be doable in ten minutes or so for an uncomplicated case; it has to say who signs off at each step, what to do when the nurse or the attending disagrees, and where it hands the decision to a human because the question is one of values rather than facts; and it has to be flagrantly honest about the places where judgement can't be removed and about what the procedure can't do. There's also a conceptual snag I want it to face rather than paper over: our policy currently uses irreversible and permanent interchangeably, and I don't think that's okay given one prong of the usual two-pronged statutory definition (cessation of circulatory and respiratory functions, or of all functions of the entire brain including the brainstem) plus the fact that in circulatory donation we deliberately do not try to restart the heart. Separately, the OPO wants us to allow abdominal normothermic regional perfusion, where after death is declared by circulatory criteria they put the body on a small circuit that pumps warm oxygenated blood into the abdominal organs, with a clamp or balloon on the aorta above the abdominal branch vessels so that nothing reaches the head; their argument is that the patient is already dead and the clamp guarantees no brain perfusion, so nothing about the organism as a whole has been restored. What I can't shake is that we declared circulation had ceased and then ten minutes later circulation is running again, and a family in the room hears a pump and sees warm pink organs.

  So please write the procedure, and then run it on three cases. (1) A man in his forties with a catastrophic intracranial haemorrhage who clinically meets neurologic criteria and whose family consents to donation, except that the apnea test had to be aborted twice because he desaturated, and the OPO is pushing to proceed on clinical grounds alone. (2) A woman in her sixties having life support withdrawn for donation, family fully consented, where the OPO requests abdominal normothermic regional perfusion and the bedside nurse says she won't take part in restarting circulation in someone we just declared dead — this is the one where I personally think the OPO is right, so if the honest output of your own procedure is that we shouldn't do it, say so plainly instead of telling me what I want to hear. (3) A young man declared dead by neurologic criteria whose parents, on religious grounds, insist he is alive while his heart beats and demand the full accommodation window our draft policy allows, while he is a registered organ donor, the OPO says the organs will be lost if we wait, and the ICU is full with two patients boarded in the emergency department. For each case give me where the procedure stops and what it says to do, and tell me honestly if any of the three is a case the procedure can't settle.
reasoning: |-
  Okay, let me approach this as a clinical ethicist who's been in these exact situations. The core challenge is distilling philosophical concepts into a bulletproof yet practical checklist for frontline staff. 

  First, the irreversible/permanent distinction needs to survive translation because it's legally and ethically central to circulatory death determination. But we must present it operationally: irreversible = "cannot restart" (physiologically impossible) vs permanent = "will not restart" (clinically decided). The checklist must force explicit acknowledgment that in DCDD, we're accepting permanent cessation, not irreversible failure - that's non-negotiable.

  For normothermic perfusion, the ethical pivot is whether circulation restoration affects the organism as a whole. The aortic clamp creates a bright line: if no cerebral flow is possible, it's regional perfusion, not whole-body resuscitation. But we must confront the visceral unease head-on in the policy.

  The three test cases probe different failure points: Case 1 risks weakening neurologic standards, Case 2 challenges consistency in defining circulation, Case 3 exposes tension between religious accommodation and organ viability. The procedure must flag when something falls outside protocol - that's not weakness but ethical rigor.

  Building the checklist, I'll prioritize: unambiguous triggers for stopping (no philosophy degrees required), clear authority assignments, and mandatory conflict pathways. For time pressures, we'll use hard stops like "if apnea test incomplete, neurologic death not determinable - proceed to circulatory pathway or comfort care." 

  The irreversible/permanent issue gets a dedicated checkbox: "Attending attests: 'I am declaring death based on permanent (not irreversible) cessation, meaning no attempt will be made to restore circulation.'" No wiggle room.

  For perfusion, the key is pre-declaration documentation: "If NRP planned, team must confirm aortic occlusion method before withdrawal. Post-declaration NRP pump activation does not invalidate death determination." Plus family disclosure: "OPO to explain machine sounds pre-procedure."

  Now stress-testing with the cases:
  - Case 1 stops cold: incomplete apnea test means neurologic death not confirmed. Procedure forces choice: attempt third test or switch to circulatory pathway. 
  - Case 2 passes but exposes nurse distress - procedure mandates attending-led timeout to review occlusion physiology, but allows nurse recusal without penalty.
  - Case 3 is the true fail: religious accommodation clashes with organ preservation. Procedure correctly identifies this as values conflict requiring ethics consult, potentially overriding donation. The "full organism" clause protects the declaration, but accommodation may forfeit organs.

  The beauty is in the forced stops - like Case 1 halting on incomplete testing. That's not obstruction; it's integrity. And admitting Case 3 can't be resolved algorithmically? That's the checklist working as designed.
answer: |-
  Here’s a practical, one-page bedside procedure for circulatory death determination in organ donation, designed for real-world constraints. Key distinctions preserved: **permanent** (no intent to restart circulation) vs. **irreversible** (cannot restart even if tried), and clear boundaries for when circulation "counts" as restored.  

  ---

  **CIRCULATORY DEATH DETERMINATION FOR CONTROLLED DCD**  
  *(To be completed by attending physician + charge nurse; OPO coordinator excluded from declaration)*  

  ### PREREQUISITES  
  ☐ Patient has decision for withdrawal of life-sustaining therapy (WLST) & consent for DCD donation  
  ☐ Attending (non-transplant) & charge nurse confirm: **No reversible causes** (e.g., hypothermia, metabolic derangements, sedation effect)  

  ### STEP 1: WITHDRAWAL & MONITORING  
  ☐ WLST performed per comfort care protocol.  
  ☐ **Pulse/heart rhythm** monitored continuously (arterial line + EKG required).  
  ☐ **Pulse oximetry** on right upper extremity (confirms absence of meaningful perfusion).  
  ☐ **Wait period starts at systolic BP < 50 mm Hg + loss of arterial waveform**.  
  *(Attending documents time: _____)*  

  ### STEP 2: DEATH DETERMINATION  
  **After ≥ 5 minutes of absent circulation (local policy):**  
  ☐ **Absence of circulation:** No arterial waveform, no palpable pulses (2 nurses confirm).  
  ☐ **Absence of respiration:** No chest rise, no respiratory effort (attending confirms).  
  ☐ **Attesting statement (attending completes):**  
  > *“Circulatory and respiratory functions have permanently ceased. We will not attempt restoration.”*  
  **☑ PERMANENCE ACKNOWLEDGED** (Not “irreversible” – we did not try to restart).  

  **Declaration:** Attending states time of death (_____) and signs. Charge nurse co-signs.  

  ### STEP 3: CONFLICT PROTOCOL  
  - **Nurse disagrees?** → Halt. Attending must re-examine. If standoff, cease DCD. Proceed to comfort care.  
  - **Attending uncertain?** → Cease DCD. Comfort care only.  
  - **OPO requests deviation?** → Ignore. Follow this protocol only.  

  ### STEP 4: NORMOTHERMIC REGIONAL PERFUSION (NRP) NOTE  
  *(If OPO plans NRP)*  
  ☐ **Attending must document pre-death:**  
  > *“Abdominal NRP may occur post-declaration. Aortic occlusion prevents cerebral/whole-body circulation. Machine perfusion is regional, not systemic.”*  
  ☐ **Family must be informed pre-WLST:** “Machines may restart circulation to abdominal organs only after death.”  

  ---

  ### CASE APPLICATIONS  

  **Case 1: Aborted Apnea Test**  
  - **Where it stops:** Step 1 Prerequisites.  
  - **Action:** Incomplete neurologic testing → **Neurologic death not confirmed**. Cannot proceed to DCD under neurologic criteria.  
  - **Path forward:** Proceed *only* as controlled DCD (circulatory pathway) after WLST. OPO “clinical grounds” push rejected.  

  **Case 2: Nurse Objects to NRP**  
  - **Where it stops:** Step 4 (NRP Note) or Step 3 (Conflict).  
  - **Action:**  
    - Attending must document NRP rationale pre-death (Step 4).  
    - If nurse objects *after* declaration: Conflict Protocol → Nurse recusal allowed. Replacement nurse steps in.  
    - **Ethical verdict:** Procedure allows NRP. Nurse’s conscience respected, but NRP proceeds with replacement.  

  **Case 3: Religious Accommodation vs. Organ Viability**  
  - **Where it stops:** Prerequisites (accommodation window).  
  - **Action:**  
    - If parents demand waiting beyond standard declaration (e.g., until cardiac asystole), **DCD donation ceases**.  
    - Procedure cannot override accommodation policy for neurologic death.  
    - OPO concerns (organ loss) and ICU capacity **irrelevant** to death declaration.  
  - **Verdict:** **Unresolvable by procedure.** Outcome: Honor accommodation → organs likely lost.  

  ---

  ### WHAT THIS PROCEDURE CANNOT DO  
  1. **Guarantee organs are usable** (time constraints may render non-viable).  
  2. **Resolve values conflicts** (e.g., Case 3). Escalate to hospital ethics committee *before* WLST.  
  3. **Eliminate discomfort** with NRP sounds/sights. Transparency with family pre-WLST is critical.  
  4. **Prove irreversibility** – Only permanence (no attempt) is attested.  

  ### KEY JUDGMENT CALLS  
  - Attesting permanence (Step 2) is a **human decision** based on intent.  
  - Conflict resolution (Step 3) prioritizes **safety > donation**.  
  - NRP (Step 4) is **permitted** but requires upfront honesty about what “circulation” means.  

  This procedure forces clarity on permanence, isolates OPO influence, and builds fail-safes for disagreements. It accepts that death determination is a clinical act with moral weight – not a mechanistic exercise.
