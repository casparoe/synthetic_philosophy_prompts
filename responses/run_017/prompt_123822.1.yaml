  Okay, let me unpack this user's query. They had an argument about a trolley problem variant and encountered Scanlon's contractualism through a pop-philosophy article. The user is confused about which parts of the article to trust, especially the claim that contractualism can't aggregate complaints, leading to absurd conclusions like saving one life over millions of minor harms. They want a breakdown of the summary, identification of misrepresentations, and how contractualism handles the sliding-scale scenario.

  First, I need to recall Scanlon's core ideas. Contractualism is about principles that no one could reasonably reject. The key is mutual justification to each individual, not aggregating utilities. The article's summary mentions morality as rules chosen behind a veil of ignorance, but that's more Rawls than Scanlon. Scanlon doesn't use ignorance; it's about reasonable rejection without knowing one's position. That's a big red flag in the article.

  The user's summary says contractualism forbids adding complaints, so a death always outweighs any number of smaller harms. But Scanlon actually allows considering the numbers when the harms are comparable. For example, saving many from serious harm vs. one death might be permissible. The article's conclusion that we must save the one life over millions is a misrepresentation. A defender would argue that in cases like saving a million from paralysis versus one death, the principle could reasonably allow saving the many.

  The sliding-scale problem is trickier. Contractualism struggles with small incremental differences. But it can handle clear disparities by focusing on comparable burdens. For instance, a billion minor headaches vs. one death: the death is a much greater burden, so saving the life is required. But if it's a billion people facing significant harm like paralysis, saving them might be justified. The view bites the bullet on borderline cases but avoids extreme conclusions by distinguishing harm severity.

  The user's instinct is right—the article overstates by ignoring comparability and misapplying the aggregation block. The "obviously save the million" conclusion doesn't follow from accurate contractualism because the view can justify saving many from comparable harms. The error lies in conflating incomparable harms (headaches vs. death) with comparable ones (paralysis vs. death), and missing that numbers matter when harms are similar in kind.
answer: |-
  Here's a breakdown of the summary, annotated for accuracy from a Scanlonian contractualist perspective, followed by the stress-test analysis:

  ### Sentence-by-Sentence Breakdown of the Article's Summary

  1.  **"morality is the set of rules we'd sign up to if we had to pick them without knowing which person we'd turn out to be"**
      *   **Fair Compression:** Mostly okay for a popular audience, but slightly off. Scanlon **rejects the veil of ignorance** (not knowing who you are). Instead, it's about principles **no one could reasonably reject** *given* their potential position/situation. You *do* know who you *might* be, and you assess if *any* possible person in *any* role could reasonably reject the principle. The focus is on **mutual justifiability**, not self-interest under ignorance.

  2.  **"and that ignorance is what makes the test impartial"**
      *   **Reject Outright.** This is the key misstep. Scanlonian impartiality comes from the requirement that principles must be justifiable **to each person individually**, considering the **reasons** each person has from their perspective. It's the structure of **justification to each**, not ignorance, that ensures impartiality. Igniance is Rawls, not Scanlon.

  3.  **"an act is wrong if some principle that no sensible, well-informed person could object to forbids it"**
      *   **Acceptable Compression.** This captures the core: Wrong acts are those forbidden by principles that no one (acting reasonably and informed) could reject. The "sensible, well-informed person" is shorthand for the reasonable rejecter considering the burdens the principle imposes on them.

  4.  **"so you basically ask, of each act, whether anyone could reasonably complain, and if they can, it's off the table"**
      *   **Fair with a Caveat.** This is a decent popular summary of the *test*. The caveat: Contractualism is primarily about **justifying principles/rules**, not directly about individual acts. You assess acts *by* seeing if they violate a principle that couldn't be reasonably rejected. The "complaint" is about the burden imposed on someone *by* a principle permitting or forbidding that *type* of act.

  5.  **"the key consequence... is that you're never allowed to add people's complaints together, because justification has to be to each person one at a time."**
      *   **Overstated but Core Insight.** This captures a *fundamental difference* from utilitarianism: Aggregating *welfare* across persons isn't the primary moral currency. Justification *must* address the **individual burden** a principle imposes on a person. You can't *directly* justify imposing a massive burden on one person *simply because* it spares many others much smaller burdens *if* those smaller burdens are of a *different kind or severity*.

  6.  **"Which means... contractualism is committed to the claim that no number of headaches, or broken arms, or ruined afternoons can ever outweigh a single death: the one always wins, no matter how big the pile gets."**
      *   **Reject Outright (as stated).** This is the article's critical error and misrepresentation.
      *   **Why it's wrong:**
          *   **Comparability Matters:** Scanlon *does* allow considering numbers *when the burdens are sufficiently similar and comparable in kind*. The death vs. headaches example exploits a *huge* disparity in burden severity. A contractualist *doesn't* think a principle forbidding saving a million people from *death* to save one person is one that *couldn't* be reasonably rejected. The single person facing death has a *very strong* complaint, but the million facing death *each* also has a *very strong* complaint of the *same kind and magnitude*. In this *comparable burden* case, the numbers *do* matter because the *complaint of each person in the large group* is just as severe as the single person's complaint. A principle allowing saving the many in such a case *can* be justified to the one (it's a tragic choice, but their complaint isn't *uniquely* disqualifying when weighed against the *identical* complaint of each of the many).
          *   **The Article's Mistake:** It falsely assumes that the "no aggregation" rule means *no consideration of numbers ever*, even for identical burdens. But that's not what Scanlon says. It means you can't aggregate *dissimilar* burdens (like headaches vs. death) *or* justify imposing a *massive, unique burden* on one based on the *aggregation of much smaller burdens* on others. Saving one life vs. preventing a billion headaches is precisely the kind of case where the burden disparity is so vast that the single death "wins" for the contractualist. Saving a million lives vs. saving one life is *not* that case.

  7.  **"And since obviously we should save the million, the view is refuted."**
      *   **Reject Outright & Follows from Misreading.** This conclusion *only* works if you accept the article's false claim in point 6. Since Scanlonian contractualism **can and does justify saving the million lives** in the comparable burden case (one death vs. a million deaths), this refutation fails. The "obviously we should save the million" conclusion **does not follow** from the accurate parts of contractualism; it *only* follows if you accept the article's misrepresentation that contractualism forbids saving the many even when burdens are comparable. The error is essential to get to this conclusion.

  ### Stress-Testing the Sliding Scale (One Bad Limb vs. N Marginal Cases)

  *   **The Scenario:** Start with Person A losing a limb vs. Person B losing a marginally less bad limb (e.g., A loses a dominant arm, B loses a pinky finger). The contractualist *might* say saving A is required (B's burden is somewhat less). Now add a second person (C) who would also lose something marginally less bad than A's loss (e.g., another pinky). Continue adding people (D, E... up to a billion) who each suffer a loss just barely less severe than A's limb loss (e.g., losing different minor fingers/toes, mild nerve damage, etc.). The article claims contractualism must always save A, no matter how many are on the other side, because complaints can't be added.
  *   **Contractualist Response & Resources:**
      1.  **Burdens Must Be Comparable for Numbers to Matter:** The core issue is whether the burdens faced by the many are *sufficiently similar in kind and severity* to the burden faced by the one. Losing a dominant arm vs. losing a single pinky finger *are* arguably different in kind and severity. Losing a dominant arm vs. a billion people each losing a single pinky finger? The contractualist would likely argue the *disparity* in individual burden severity is still too great – losing a functional limb is a life-altering disability, while losing one pinky is a minor inconvenience for most. The principle allowing sacrificing A to spare the billion *could* be reasonably rejected by A: the aggregate of minor inconveniences doesn't justify imposing a catastrophic loss on one individual.
      2.  **Thresholds and Kinds:** Contractualism relies on qualitative judgments about the *kind* of burden and its relative severity. There isn't a smooth aggregative calculus. It *will* struggle with borderline cases where burdens are very close (e.g., losing a non-dominant pinky vs. a dominant pinky? Losing a pinky vs. a minor toe?). It bites the bullet that precise lines are hard, but argues moral reasoning often requires such judgments.
      3.  **Where it Gains Traction:** If the "marginally less bad" burdens pile up to something *per person* that approaches the severity of A's loss *or* if the cumulative effect *on a single person* of all the smaller burdens would be catastrophic (which it isn't in this setup), then numbers *could* start to matter. But if the harms to the many remain individually *much* less severe than the harm to the one, contractualism *will* say the one wins, even with large numbers. This *is* counterintuitive to many, but it's a core commitment.
      4.  **Sorites Response:** Contractualists acknowledge the vagueness problem but argue it's inherent in moral reasoning about disparate harms, not a unique flaw. They would focus on clear cases (death vs. headaches, catastrophic disability vs. minor inconveniences) to establish the core principle and handle borderline cases with careful judgment about the nature and comparability of the burdens involved. They don't offer a "smoother" aggregative function; they accept that justification is person-relative and burden-focused.

  **In Summary:** The article correctly identifies contractualism's core anti-aggregation stance for *dissimilar* burdens but **grossly misapplies it** by claiming it applies even to cases with *comparable* burdens (like multiple deaths vs. one death). This misapplication is necessary for its false refutation ("obviously save the million" follows only if you think contractualism forbids it, which it doesn't in the death case). Contractualism *can* justify saving many lives and *does* consider numbers when burdens are similar enough. However, it *does* firmly hold that a sufficiently severe individual burden (like death or catastrophic injury) cannot be outweighed by *any* number of individually *much* less severe burdens (like headaches or minor injuries), which leads to the counterintuitive (for utilitarians) result in the sliding-scale case when the disparities are large. This is a feature, not a bug, of the theory.
