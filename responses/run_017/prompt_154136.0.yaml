  We are going to break down the Axiom of Choice (AC) from the perspective of a programming languages (PL) researcher with a background in dependent types and proof extraction.

  The goal is to express the philosophical disputes about AC in terms of PL concepts (like types, terms, Sigma types, truncation, noncomputability, etc.) and to be honest about where the translation works and where it breaks down.

  ### Step 1: The Basic Translation of AC as a Type

  The Axiom of Choice is usually stated as:

  If for every `x` in `A` there exists a `y` in `B` such that the relation `R(x,y)` holds, then there exists a function `f: A -> B` such that for every `x` in `A`, `R(x, f(x))` holds.

  In type theory, we might try to write this as:

  ```coq
  (∀ (x : A), ∃ (y : B), R x y) → ∃ (f : A → B), ∀ (x : A), R x (f x)
  ```

  But note: the meaning of `∃` is critical.

  #### Option 1: Using Sigma Types (Strong Existential)

  If we interpret `∃` as a Sigma type (i.e., a dependent pair), then the premise becomes:

  ```coq
  ∀ (x : A), Σ (y : B), R x y
  ```

  which is a function that for each `x` gives a specific `y` along with a proof that `R x y` holds. Then the conclusion would be:

  ```coq
  Σ (f : A → B), ∀ (x : A), R x (f x)
  ```

  which is a pair of a function `f` and a proof that it satisfies the relation.

  In this case, we can prove the implication without any axiom:

  ```coq
  Definition AC {A B} {R : A -> B -> Prop} 
    (H : forall x, { y : B & R x y }) : { f : A -> B & forall x, R x (f x) } :=
    existT (fun f => forall x, R x (f x)) (fun x => projT1 (H x)) (fun x => projT2 (H x)).
  ```

  So if we use Sigma types, then AC is provable. But this is not the controversial AC! The controversy arises when we interpret the existential quantifier in a weaker, non-constructive way.

  #### Option 2: Using Propositional Truncation (Weak Existential)

  In constructive type theory, the existential that corresponds to the one in classical logic is the *weak* existential, which we denote by `∃` (or sometimes `∥ ... ∥` around a Sigma). It is defined by truncating the Sigma type so that we only know such a `y` exists but we don't have a specific one. In Coq, we might model this with `Prop` if we are in the Calculus of Inductive Constructions (CIC) with `Prop` being impredicative and proof irrelevant, but note that Coq's built-in `exists` is actually the Sigma type. However, for the purpose of this discussion, let us assume we have a truncation modality.

  In a type theory with propositional truncation, we write the premise as:

  ```coq
  ∀ (x : A), ∃ (y : B), R x y   [weak existential]
  ```

  and the conclusion as:

  ```coq
  ∃ (f : A → B), ∀ (x : A), R x (f x)   [weak existential]
  ```

  But note: the function `f` in the conclusion would then also be truncated, meaning we only know such a function exists, but we don't have a specific one.

  In this setting, AC becomes:

  ```coq
  (∀ x, ∥ Σ y : B, R x y ∥) → ∥ Σ (f : A → B), ∀ x, R x (f x) ∥
  ```

  This is not provable in general without an axiom. So we see that the crux is the interpretation of the existential quantifier.

  ### Step 2: The Disputes in PL Vocabulary

  Now let's restate the three viewpoints:

  1. **The Unproblematic View (AC as part of how sets behave):**
     - In set theory, sets are arbitrary and functions are arbitrary subsets of the Cartesian product. So if for every `x` there is at least one `y`, then we can form a function by just picking one `y` for each `x`. The fact that we cannot "compute" or "define" such a function is irrelevant because sets are not required to be computable.
     - **PL translation:** In a type theory without truncation, we don't need AC because we have Sigma types. But if we are working in a setting that uses weak existentials (like when we want to reason classically or when we are using a logic that is closer to first-order logic), then we add AC as an axiom. This is analogous to working in a system that has a separate universe for propositions (like Coq's `Prop`). In such a system, the axiom of choice is sometimes provable (as in Coq for `Prop` with certain conditions) and sometimes not. However, in a general setting, the PL translation of this view is that we are allowed to have non-computable functions as terms. So we can add:

          Axiom choice : ∀ (A B : Type) (R : A → B → Prop),
            (∀ x, ∃ y, R x y) → ∃ f: A → B, ∀ x, R x (f x)

       Here, the exists in the premise and conclusion are weak existentials (i.e., in `Prop`). In Coq, if we use the `Prop` universe for the existentials and we are in a context where `B` is in `Type` and `A` is in `Type`, then the axiom of choice is independent. This view holds that this axiom is simply part of our mathematical foundation.

  2. **The Countable or Dependent Choice View:**
     - Some mathematicians are comfortable with countable choice (when `A` is countable) or dependent choice (a stronger form that allows sequences of choices). They balk at the full axiom of choice because it leads to non-constructive objects that are too wild.
     - **PL translation:** In type theory, we can have restricted forms of choice. For example, countable choice can be stated for `A = nat`. In PL, we can write:

          Axiom countable_choice : ∀ (B : Type) (R : nat → B → Prop),
            (∀ n, ∃ y, R n y) → ∃ f: nat → B, ∀ n, R n (f n)

       Why might one accept countable choice but not full AC? In PL terms, it might be because we can sometimes justify countable choice by the fact that we can enumerate `nat` and then make a sequence of choices (via an oracle or by an infinite computation). However, for an arbitrary `A` without any structure, we cannot do that. Also, note that in some constructive systems, dependent choice is accepted because it is seen as a natural way to build sequences.

  3. **The Definite Complaint: Non-Constructive Existence:**
     - The complaint here is that AC allows us to claim the existence of an object (the choice function) without any way to define it. In particular, there might be no computable function that does the job, and the function might be non-measurable (leading to Banach-Tarski) or otherwise pathological.
     - **PL translation:** In our type theory, if we are in a constructive setting (where every term is computable) and we use the weak existential, then adding AC as an axiom would break canonicity: we could get a term of type `∃ f: A → B, ...` without having a concrete function. Moreover, in a system where we care about extraction, we would not be able to extract such a function. So the complaint is that AC allows us to have terms of function types that are not computable. This is particularly problematic because we might then use such a function in a context where we require computability (like in extraction to a programming language).

  ### Step 3: The Residue: What Doesn't Translate?

  Now, let's address the non-translatable parts.

  1. **Banach-Tarski and Non-Measurable Sets:**
     - Banach-Tarski is a consequence of AC and it shows that we can decompose a ball into a finite number of pieces and reassemble them into two balls of the same size. This is impossible if we require the pieces to be measurable (because measure is preserved under rigid motions). So AC implies the existence of non-measurable sets.
     - **PL translation:** In a constructive type theory with computable functions, we cannot construct non-measurable sets because every set we can define is going to be measurable (since we can only build sets that are definable in a constructive way). However, if we add AC as an axiom, we might be able to prove the existence of non-measurable sets. But note: even with AC, we cannot write down a non-measurable set in a constructive way. So the PL counterpart would be: we can prove the existence of a non-measurable set as a term of type `∃ S : set ℝ, ¬ measurable S`, but we cannot exhibit a specific one (because we don't have a definition for it). This is exactly the complaint: we are asserting existence without being able to define the object.

     However, note that in a classical setting (like set theory) we are fine with that. So the residue here is that the PL setting we are working in might be too constrained to express the classical set-theoretic objects. But if we are working in a classical type theory (with AC added as an axiom and with the possibility of noncomputable functions), then we can indeed carry out the Banach-Tarski paradox. But we must note that the pieces in Banach-Tarski are non-constructive sets. In PL terms, we can define the type of subsets of `ℝ³` and then write a proof that there exists a decomposition satisfying the Banach-Tarski conditions. However, we cannot compute with these subsets because they are not constructive.

     So the translation does carry over, but the noncomputability is explicit: the sets we get are noncomputable sets (i.e., their characteristic functions are noncomputable). And in a PL setting that requires computability, we would not have such sets. Therefore, the residue is that the classical mathematician is happy to have noncomputable sets, while the constructivist is not.

  2. **Is AC just Skolemization?**
     - Your advisor's offhand comment: AC is basically Skolemization. Skolemization in first-order logic replaces an existential quantifier in the scope of a universal quantifier by a function symbol. So `∀x∃y R(x,y)` becomes `∃f∀x R(x, f(x))`. This is exactly AC for the case of a functional relation. 
     - **PL translation:** In type theory, if we are working in a first-order setting (with weak existentials) then Skolemization is exactly what AC does. The fuss is about whether we allow the Skolem function `f` to be non-computable. In a constructive setting, we would only allow Skolem functions that are computable (and then AC fails). In a classical setting, we allow arbitrary functions (and then AC holds). So this view is essentially correct.

     However, note that in higher-order logic (or type theory) we have more structure. The issue is not just about Skolemization but about the nature of functions. In set theory, functions are sets of pairs. In type theory, functions are primitive and computable by default (in constructive systems). So the dispute is also about what a function is.

  ### Residue Report

  - **What carried over cleanly:**
     - The basic structure of AC as a type.
     - The distinction between strong and weak existentials: with strong existentials (Sigma types) AC is provable, but with weak existentials it is not and must be added as an axiom.
     - The three viewpoints can be restated in terms of:
          - The acceptance of noncomputable functions as terms (unproblematic view).
          - The acceptance of choice only for certain types (like `nat`) because they are enumerable (countable/dependent choice).
          - The rejection of AC because it breaks computability (non-constructive existence).

  - **What fit after being distorted:**
     - Banach-Tarski: We can express the theorem in type theory, but the non-measurable sets become noncomputable sets. The classical mathematician's acceptance of noncomputable sets is what allows Banach-Tarski, and the constructivist rejects it. The distortion is that in PL we naturally think in terms of computability, so the non-measurable sets become noncomputable sets. But note: in set theory, non-measurable sets are not necessarily noncomputable in the algorithmic sense (they are just not measurable by the Lebesgue measure). However, in practice, non-measurable sets are noncomputable because they require non-constructive choices.

  - **What has no expression in PL terms:**
     - We must be cautious: if by PL terms we mean a system where all functions are computable, then noncomputable functions have no expression. But we can always extend our system with oracles or axioms to represent noncomputable functions. So we can express the classical view by adding an axiom (AC) that postulates the existence of a function without providing a computation. Therefore, the residue is minimal. The only thing that might not carry over is the set-theoretic notion of arbitrary set (as opposed to type) and the idea that a function is a set of pairs. But in type theory, we can model set theory and then the translation is still possible.

     However, note that the philosophical disagreement about the nature of mathematical objects (whether they must be definable or not) is exactly mirrored in PL by the distinction between computable and non-computable functions. So the residue is not inexpressibility but rather a difference in the foundational assumptions.

  ### Conclusion

  The main issue is the interpretation of existence and the nature of functions. In PL:

  - **Strong existence (Sigma):** We have a specific witness. AC is provable.
  - **Weak existence (truncated):** We only know a witness exists. AC is not provable and adding it as an axiom introduces noncomputable functions.

  The disputes become:

  1. **Unproblematic:** We are fine with noncomputable functions, so we add AC as an axiom.
  2. **Countable/Dependent Choice:** We are only fine with noncomputable functions for certain types (like `nat`), so we add restricted forms of AC.
  3. **Rejection:** We want all functions to be computable, so we reject AC.

  Banach-Tarski is expressible but as a theorem about noncomputable sets. The advisor's comment that AC is Skolemization is essentially correct: it's about turning existential quantifiers into function symbols, and the fuss is whether we allow non-computable Skolem functions.

  In summary, the translation is robust and the philosophical disputes map cleanly to disputes about noncomputability and the interpretation of existence in type theory.
answer: |-
  ### Restating the Axiom of Choice (AC) Dispute in PL Vocabulary  
  Your analysis friend is partially right: **PL systems reveal that AC hinges on how "existence" is interpreted computationally**, not that PL "secretly assumes" choice. Let's break down the dispute using your terms.

  ---

  #### **1. The Basic Translation Attempt**  
  You wrote AC as:  
  `(∀x : A. ∃y : B. R x y) → (∃f : A → B. ∀x. R x (f x))`  

  **Why this isn't controversial**:  
  - If `∃` is a **Σ-type** (dependent pair), this is **provable** in type theory:  
    ```coq
    ac : (Πx:A. Σy:B. R x y) → Σf:(A→B). Πx:A. R x (f x)
    ac h = (λx. fst (h x), λx. snd (h x))
    ```  
    This is **choice for specifiable witnesses**. The "function" `f` is built directly from the constructive witnesses.  

  **The core issue**:  
  Real-world AC disputes arise when "exists" is **truncated** (propositional existential `∥∃∥`), i.e.,  
  - `∀x:A. ∥∃y:B. R x y∥` (no access to specific `y` per `x`).  
  - `∥∃f:A→B. ∀x:A. R x (f x)∥` (merely asserts a function exists).  

  Here, AC becomes **non-constructive**:  
  ```coq
  Axiom AC : (Πx:A. ∥Σy:B. R x y∥) → ∥Σf:(A→B). Πx:A. R x (f x)∥
  ```  
  This is **unprovable** in vanilla type theory – it requires adding non-computable content.

  ---

  #### **2. The Three Disputes Translated**  
  **Group 1: "AC is unproblematic (arbitrary sets behave this way)"**  
  - **PL Translation**:  
    Sets are modeled as **types**, and functions are **global terms** (possibly non-computable). AC is a **typing rule**:  
    > "If for every `x:A` I know *somehow* that a `y:B` exists, I may assume a term `f : A → B` exists, even if I can't compute it."  

    - **Honesty**: This extends your system with **oracle terms** (e.g., `f` backed by a `ℕ → ℕ` oracle). No computability claims.  
    - **Key PL Analogy**: Like adding `axiom f : A → B` in Coq. The term `f` is "black-box" – you can use it, but extraction erases it or uses `unsafePerformsIO`.

  **Group 2: "Only countable/dependent choice is acceptable"**  
  - **PL Translation**:  
    Restrict `A` to **enumerable types** (e.g., `A = ℕ`) or **dependent sequences** (e.g., `B` depends on prior choices):  
    ```coq
    Axiom DependentChoice :  
      (Πx:A. ∥∃y:B(x). R x y∥) → ∥∃f:(Πx:A. B(x)). Πx:A. R x (f x)∥
    ```  
    - **Why it's palatable**: For `A = ℕ`, you can **build `f` by induction** (even if non-computable) via an infinite chain of choices.  
    - **Computational cost**: Full AC allows `A = ℝ` (uncountable), demanding a function with **infinite input bandwidth**. Countable AC avoids this.

  **Group 3: "AC licenses non-definable existence claims"**  
  - **PL Translation**:  
    AC "cheats" by turning `∥∃y. P y∥` (knowledge that a witness exists) into a **term `f` with no definable properties**.  
    - **The complaint**:  
      > "You claim `∥Σf. ...∥` but give no **extractable term**, no **lambda expression**, and no **parametricity guarantees**. This is **metaphysics**, not math!"  

    - **PL Manifestation**:  
      AC breaks **canonicity** – a closed term of type `ℕ` need not reduce to a numeral. It enables proving `∥∃f:ℝ→ℝ. discontinuous(f)∥` without constructing one.

  ---

  #### **3. Banach-Tarski and Non-Measurable Sets**  
  **Can this be translated?**  
  - **Yes**, but reveals limitations in PL views:  
    Banach-Tarski requires:  
    1. AC on `ℝ³` (choosing points in equivalence classes under rotations).  
    2. Decomposing a ball into **non-measurable sets**.  

  - **PL Translation**:  
    - Model `ℝ³` as a type (e.g., equivalence classes of Cauchy sequences).  
    - AC provides a term `choose : (Set ℝ³ → Prop) → Set ℝ³` (picking representatives).  
    - Non-measurable sets arise as `choose(...)` outputs – **terms with no computational content**.  

  - **The catch**:  
    In **constructive measure theory**, all definable sets are measurable. Banach-Tarski vanishes because:  
    > "Non-measurable set" ≡ "Term that cannot be defined in a computable type theory".  

    - **Residue**: Banach-Tarski persists only if you **embed classical logic + AC** into your type theory (e.g., via `Prop` + `choice`). Extraction replaces `choose` with runtime errors or skips.

  ---

  #### **4. Is AC Just Skolemization?**  
  Your advisor is **mostly right**:  
  - **Skolemization**: `∀x∃y. P(x,y) ⊢ ∃f∀x. P(x, f(x))` is AC for first-order logic.  
  - **PL Nuance**:  
    - In **constructive** settings, Skolemization needs a **witnessing term** for `f`.  
    - In **classical** settings, `f` is non-computable.  
    - **Where it's "too quick"**: Skolemization in FOL treats `f` as a symbol. AC in type theory forces you to confront:  
      > "Is `f` a **mathematical object** or a **syntactic ghost**?"  

      PL answers: "It's a ghost unless computable."

  ---

  ### **Residue Report: What Doesn't Translate?**  
  **Carried over cleanly**:  
  - AC as a schema for turning truncated existentials into functions.  
  - Disputes about definability ↔ Computability of terms.  
  - Countable choice ↔ Induction over `ℕ`.  

  **Distorted in translation**:  
  - "Sets" in set theory are **external to the language**; types are **internal**. PL makes the **encoding choice** explicit (e.g., `ℝ` as Cauchy sequences vs. Dedekind cuts).  
  - Classical mathematicians treat AC as "obviously true" based on intuition about sets; PL treats it as an **axiom affecting canonicity and extraction**.  

  **No direct PL expression (the residue)**:  
  1. **Sheer arbitrariness of choice functions**:  
     - Set theory: AC picks arbitrary sets from a universe "out there".  
     - PL: Functions are **terms**, which must be definable (if computable) or axiomatized (if not).  
     - **Residue source**: PL cannot model "true arbitrariness" without breaking computational meaning.  

  2. **Philosophical content**:  
     - Debates like "Does AC *really* hold?" stem from **divergent intuitions about mathematical existence**.  
     - In PL, existence is **relative to a type theory**:  
       - Constructive: Existence = definable term.  
       - Classical: Existence = consistency with ZF(C).  
     - **The residue**: PL clarifies but doesn't resolve the metaphysical dispute.  

  **Is the residue due to PL's limits?**  
  - **Yes, but productively**: PL assumes **terms are computable by default**. To model set theory, you must:  
    - Add non-computable axioms (e.g., `choice : (A → ∥B∥) → ∥A → B∥`),  
    - Accept that proofs of `∥∃f. ...∥` erase to non-executable code.  
  - **No**: The residue reflects a **legitimate divide** between "mathematics as computation" and "mathematics as ontology". PL makes this explicit.

  ---

  ### **Conclusion**  
  Your friend was half-right: **PL doesn't assume AC; it exposes its computational cost**.  
  - When existence is `Σ` (specifiable), AC is trivial.  
  - When existence is `∥∃∥` (mere), AC becomes a **computability firewall**:  
    > "You may pass from knowledge of existence to a function term, but that term may be non-computable, non-definable, or erased during extraction."  

  The century-long dispute is really about:  
  > **Is `∥∃f. ...∥` an acceptable way to talk about "functions"?**  

  - **Set theorists**: "Yes, functions are sets of pairs. AC is obvious."  
  - **Constructivists**: "No, functions are rules. AC is false."  
  - **PL perspective**: "You can have either, but be explicit about your existential quantifiers and extraction semantics."  

  Banach-Tarski is the **canary in the coal mine**: it works if you accept non-computable set-level choices, but dissolves if you demand definable terms. The residue isn't a flaw in PL—it's a precise accounting of what classical mathematics trades for "freedom" from computability.
