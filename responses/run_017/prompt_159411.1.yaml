  Okay, let me tackle this user's query about Montaigne's "Of Cannibals." They're stuck on the opening paragraph with King Pyrrhus and the Romans. Their study group has two interpretations: one focusing on the lexical history of the Greek word "barbarian," and the other—what they call the "Pyrrhus pivot"—seeing it as a conceptual distinction between the label and the property of barbarism.

  First, I need to recall the passage. Pyrrhus, a Greek king, calls the Romans "barbarians" initially but then observes their army's order and says there's no "barbarism" in it. Montaigne then mentions similar instances with the Greeks and Philip of Macedon. The key is Montaigne's conclusion: we should judge by reason, not common opinion.

  The user's question has three parts: whether the paragraph is about lexical history or a conceptual distinction, how it sets up the later discussion on cannibalism, and how valid their "Pyrrhus pivot" idea is.

  For the first part, the lexical argument suggests that "barbarian" was just a neutral term for non-Greeks. However, Montaigne explicitly points out that Pyrrhus uses the term as the Greeks did but then distinguishes the label from the actual property. Pyrrhus says the army's disposition has "nothing of barbarism," indicating that "barbarism" implies disorder or irrationality, not just foreignness. So Montaigne is making a conceptual move here, separating the derogatory connotation from the term.

  Next, how does this set up the cannibalism discussion? Montaigne later argues that calling others "barbarous" is hypocritical because Europeans have worse practices. The Pyrrhus anecdote introduces the idea that labels can be misleading, preparing the reader to question their assumptions about the Tupinambá. By showing that the so-called "barbarians" (Romans) were actually orderly, he sets up a reversal where European "civilization" might be the real barbarism. This connects to the theme of cultural relativism, where judgment should be based on reason, not custom.

  As for the "Pyrrhus pivot," the user's interpretation is strong. The textual evidence is Pyrrhus's explicit distinction between the label and the property. Montaigne's conclusion reinforces this by warning against trusting vulgar opinion. The pivot isn't just about semantics but about re-evaluating who the real barbarians are. However, it's not entirely rejecting the concept of barbarism; instead, it's redefining it based on substantive qualities like reason and order, which can apply to any culture.

  The user might also be seeking validation of their interpretation in academic context. Their deeper need could be understanding how Montaigne's skepticism works in this essay, preparing them for class discussions or papers. Emphasizing the pivot as a rhetorical tool for relativism addresses that need. 

  In the response, I should affirm their pivot reading, explain its role in the essay's structure, and highlight the strongest evidence—Pyrrhus's own words and Montaigne's moral about judging by reason. Mentioning the later cannibalism comparison will show how the pivot enables Montaigne's critique of European practices.
answer: |-
  **Bottom line:** Montaigne uses the Pyrrhus anecdote to establish a *conceptual distinction* between the merely relational label "barbarian" (meaning foreigner) and the *substantive evaluative property* "barbarism" (meaning irrationality, disorder, or moral deficiency), thereby creating the "Pyrrhus pivot" that sets up his core argument about cultural relativism and the critique of European hypocrisy.

  **Reasoning:**

  1.  **Lexical History vs. Conceptual Distinction:** While Montaigne *acknowledges* the Greek lexical point ("for so the Greeks called all other nations"), he immediately *transcends* it. Pyrrhus explicitly separates the inherited *label* ("what kind of **barbarians** these may be") from the observed *quality* ("the disposition of this army... has **nothing of barbarism** in it"). This distinction is the crux. "Barbarism" here clearly signifies a *substantive negative quality* (disorder, irrationality, lack of martial virtue) that Pyrrhus finds *absent* in the Romans, despite their label. Plutarch's original context reinforces this – Pyrrhus is impressed by their discipline and orderliness, qualities antithetical to Greek stereotypes of "barbarian" chaos. Montaigne highlights this gap to undermine the automatic equation of "foreign" with "inferior/vicious."

  2.  **Setting up the Cannibalism Argument:** The Pyrrhus pivot is the essential setup for Montaigne's later discussion of Brazilian cannibals and European "civilization":
      *   **The Label is Relational & Unreliable:** The anecdote demonstrates that the label "barbarian" is applied automatically to outsiders ("vulgar opinion"), regardless of their actual qualities. This directly foreshadows Montaigne's later statement: "everyone gives the title of barbarism to everything that is not in use in his own country."
      *   **The Property is Substantive & Requires Reasoned Judgment:** By defining "barbarism" (via Pyrrhus's negation) as a *substantive vice* (disorder, irrationality, cruelty) rather than mere foreignness, Montaigne creates the framework for his critique. He doesn't *deflate* the notion of barbarism entirely; he argues that the *real* barbarism lies in specific *actions and qualities* (cruelty, irrationality, hypocrisy), which must be judged objectively ("eye of reason").
      *   **The Pivot Enables Reversal:** The Pyrrhus example shows outsiders *lacking* the vice of "barbarism." Montaigne then applies the same logic to Europeans judging Brazilians: Europeans call Tupinambá cannibals "barbarous" based on the label/custom, but Montaigne argues their *actual practices* (eating dead enemies for specific cultural/religious reasons) are *less barbarous* (less cruel, less hypocritical, more rationally consistent within their context) than European practices like torture, religious wars, and judicial mutilations. The Pyrrhus pivot makes this shocking reversal possible: the "barbarians" (Romans then, Tupinambá now) exhibit *less* of the substantive vice than the labelers (Greeks then, Europeans now).

  3.  **Assessing the "Pyrrhus Pivot" Reading:**
      *   **Spectrum Placement:** **Firmly on the "Obviously Right" end of the spectrum.** It accurately captures the core conceptual move Montaigne makes.
      *   **Strongest Textual Evidence FOR:**
          *   Pyrrhus's *exact words*: "what kind of **barbarians**... but... **nothing of barbarism**." The direct juxtaposition and contrast force the distinction.
          *   Montaigne's *own conclusion*: "By which it appears how cautious men ought to be of taking things upon trust from vulgar opinion, and that we are to judge by the eye of reason, and not from common report." This explicitly endorses judging the *substance* ("reason") over the *label* ("vulgar opinion," "common report").
          *   The *repetition* of the pattern with Flaminius and Philip: It shows this isn't a one-off lexical quirk but a recurring pattern of mislabeling based on origin versus observable quality.
      *   **Evidence AGAINST (Weak/Nonexistent):** The only potential counter is Montaigne mentioning the Greek usage. However, he presents this not as the *point* but as *background* explaining why Pyrrhus *uses* the label initially, immediately before demonstrating why the label is inadequate and misleading. He uses the historical fact to launch his conceptual argument, not to end it.

  **In essence:** The Pyrrhus anecdote isn't a Greek vocabulary lesson; it's the foundational demonstration of the gap between prejudicial labeling ("barbarian" as foreigner) and substantive judgment ("barbarism" as vice/defect). This pivot allows Montaigne to later argue that Europeans, quick to label others "barbarous," often embody the *substantive vice* of barbarism more fully than the peoples they condemn, thereby launching his powerful early critique of ethnocentrism and cultural relativism grounded in reasoned observation.
