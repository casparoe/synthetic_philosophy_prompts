prompt: |-
  I teach an upper-level seminar in the philosophy department on ethics and narrative, and for the past few years I have opened it with a genre rather than an argument: pairs of lives written to be imitated. The canonical examples are Plutarch's Parallel Lives and the Christian saint's life, but I also assign one modern descendant of the same impulse — the admiring life-of-a-great-leader of the kind still handed out in leadership programs — partly because analytic moral philosophy has lately revived exemplar-based accounts of virtue, and I want to know what the older practice was actually committed to before I decide what to make of the revival. What interests me is not whether the genre is respectable but what it must assume in order to work, and it seems to me to run on conventions that are not the conventions of history writing. First, selection obeys what I have been calling the revelatory-priority rule: the biographer prefers the small unguarded moment — a jest, a remark at dinner, how someone received bad news — to the battle or the statute, on the grounds that the latter may be the work of fortune or of subordinates while the former shows the agent; Plutarch more or less says as much in distinguishing the writing of lives from the writing of histories. Second, there is a closure rule: judgment on a life is suspended until the life is complete, the thought Herodotus attributes to Solon about calling no one happy before the end, and it is why a death is treated as evidence rather than as an appendix. Third, there is what I call the typology rule, clearest in hagiography and in confessional autobiography: the childhood is narrated as a figure of the whole, and the subject's faults are retained but redescribed as the material of a turning, so that nothing in the life is permitted to remain merely unassimilated. Fourth, there is a license that would be flagrant anywhere else: where the record is silent, the writer supplies what such a person in such circumstances would have said or done — a convention ancient historiography avowed openly, that hagiography inherited, and that survives in the composite scenes and invented dialogue of the contemporary biopic. And fifth, the pairs invite ranking: the two lives are followed by an explicit comparison and a verdict about which was better.

  Two features of this puzzle me. The revelatory-priority rule and the closure rule seem to pull in opposite directions: if a single jest discloses character, why should the end of the life be evidentially required? My own tentative answer is that they answer different questions — the jest shows who someone is, the ending settles whether that character held — but I cannot tell whether that reconciliation costs me a substantive commitment to the stability of character across a life, or whether it is equally available to someone who thinks conduct is highly situation-dependent. The license bothers me more. The stated point is to learn from a real person, and yet the genre treats the documented record as something to be completed rather than merely reported. So I have been contrasting what I call the documentary constraint (the narrated incidents must have occurred) with the legibility constraint (they must be the sort of thing this agent could have done), and I suspect the educational aim is satisfied by the second and not by the first — which would mean that the modern exhaustively footnoted definitive biography is not a more honest version of the same enterprise but a different enterprise that has quietly abandoned the aim. A colleague in the history department, who regards the whole genre as a confidence trick, says the license simply proves the aim was never truth-tracking; that strikes me as too fast, but I do not have a better formulation. I also give my students a test case: a woman whose life the genre could render beautifully and who then dies at thirty-two in an accident that reveals nothing whatever about her. Under the closure rule her life seems to lose something. Should it? If it does, the genre is committed to a view of lives as possessing narrative shape that I take to be far from obvious.

  So I would like you to reconstruct the implicit theory: what view of character, of moral knowledge, and of truth in narrative does this practice require, and which rival views does it quietly rule out? I want the strict presuppositions separated from the merely congenial ones, and I want to know whether the five conventions genuinely hang together or only look as though they do because we inherited them as a package; where several theories would license the same convention, say so rather than settling it, and where you think the genre is cheating, say that as well. Please commit to a verdict on the two questions I cannot answer myself — whether the editorial license is internal to the educational aim or a corruption of it, and whether the genre requires lives to have a narrative closure they may not in fact have — and give your reasons. Mark which of your claims you hold with real confidence and which are readings a reasonable person could reject; I am less interested in a survey of positions than in a reconstruction I can argue with. I am not asking for a bibliography, and I would rather you reasoned from the practice as I have described it than reached for sources.
reasoning: |-
  Okay, let me approach this systematically. The user teaches an upper-level philosophy seminar on ethics and narrative with a focus on exemplar-based biographies, and they've identified five conventions in this genre. They're particularly puzzled by two tensions: between revelatory moments and life closure requirements, and between documentary accuracy and narrative license. 

  First, I need to reconstruct the implicit theory behind these conventions. The revelatory-priority rule suggests character is stable and discernible through micro-moments, while the closure rule implies character is only fully evaluable at life's end - that's a tension worth exploring. The typology rule indicates lives have inherent patterns, and the license to invent implies legibility matters more than strict factuality. 

  For the documentary vs legibility conflict, I'm considering that exemplar-based education might prioritize moral truth over historical precision. The colleague's "confidence trick" accusation feels reductive - the genre seems to value didactic effectiveness, not deception. On accidental death disrupting narrative closure, I suspect the genre assumes lives inherently possess meaning, which risks imposing teleology where none exists.

  The user wants strict presuppositions identified, so I'll separate necessary commitments from optional ones. For instance, character stability seems essential for revelatory moments to work, while situation-dependence would undermine it. The ranking practice requires commensurability between lives - a strong philosophical claim. 

  For their unresolved questions: I think narrative license is integral to the genre's educational aim, not a corruption, because moral exemplars need coherent portrayal. But the closure requirement does falsely presume all lives have narrative shape - that's where the genre cheats reality. 

  Noting confidence levels is crucial. I'm sure about the character stability requirement, less certain about whether situation-dependence completely invalidates the revelatory approach. The accidental death case clearly exposes the genre's artificiality - that feels solid.
answer: |-
  Your analysis brilliantly isolates the genre's constitutive tensions. Let's reconstruct the implicit theory by examining its non-negotiable presuppositions and where it diverges from rival views. I'll address your core questions directly, marking confidence levels (🔒 = high confidence; ⚖️ = debatable but defensible; ❓ = speculative).

  ### Core Presuppositions of the Genre
  1.  **Character as Stable Essence (🔒):** The revelatory-priority rule *requires* that discrete actions (a jest, a reaction) reliably manifest an enduring inner disposition ("who someone is"). This presupposes character is:
      *   **Stable:** Resistant to fundamental change by circumstance (contra strong situationism).
      *   **Expressive:** Visible in micro-behaviors (contra views where character is opaque or performative).
      *   **Hierarchically Organized:** Minor traits reliably indicate major virtues/vices (the jest reveals the core).
      *   *Rivals Ruled Out:* Radical situationism, behaviorism, deep character skepticism, purely narrative identity theories without a stable core.

  2.  **Moral Knowledge as Perceptual & Exemplar-Based (🔒):** Learning virtue requires *concrete models*, not just principles. The genre assumes:
      *   Virtue is best grasped via vivid, particularized instances ("this is what courage *looks like* in Caesar").
      *   Judgment involves comparing whole lives as integrated gestalts (hence pairing/ranking).
      *   "Legibility" (coherence, typicality) is *pedagogically prior* to exhaustive factual accuracy.
      *   *Rivals Ruled Out:* Purely rule-based deontology, abstract utilitarianism, moral theories denying the primacy of exemplars.

  3.  **Narrative as Revelation of Moral Truth (🔒):** The form assumes life-stories *can* and *should* convey moral truth, achieved through:
      *   **Teleology (🔒):** Lives possess inherent direction/purpose ("narrative shape"). The closure rule & typology rule demand this. Childhood *must* foreshadow, death *must* culminate. Contingency (like your test case's accident) is an affront, requiring suppression or redescription.
      *   **Typology (⚖️):** Events gain meaning through pre-figured patterns (saint = Christ-figure; leader = archetype). Contradictions or "unassimilated" elements undermine pedagogy.
      *   **Legibility Over Completeness (🔒):** Gaps *must* be filled; ambiguity *must* be resolved for the exemplar to function. The "license" is essential, not optional.
      *   *Rivals Ruled Out:* Anti-realist views of narrative (pure construction), chaotic/absurdist life-views, strict historical positivism valuing atomized facts over coherent meaning.

  ### Reconciling Revelatory-Priority & Closure
  *   Your reconciliation is largely correct but incomplete (🔒). The jest reveals the *current character essence*. The closure rule addresses two distinct concerns:
      1.  **Stability Test (🔒):** Did the essence hold? (Solon's warning: prosperity can corrupt; adversity can reveal hidden strength).
      2.  **Final Integration (🔒):** Does death confirm/complete the life's meaning? (A "good death" redeems; a foolish one undermines).
  *   **Cost:** This *does* presuppose significant character stability (⚖️). While allowing for growth/conversion (handled via typology's "turning"), it assumes an underlying core persists *enough* for the early revelation to remain relevant. A radical situationist would find the revelatory moment nearly worthless prognostication. The genre assumes situation *elicits* character, not *determines* it.

  ### The License: Essential, Not Corrupt (🔒)
  *   Your suspicion is correct. The "legibility constraint" (coherence, typicality) is primary for the educational aim; the "documentary constraint" is secondary, serving legibility. Why?
      1.  **Pedagogical Function:** An exemplar *must* be coherent and vivid. Gaps or ambiguities create cognitive friction, hindering emulation. Filling them ("what such a person *would* do") reinforces the moral lesson and the character's legibility.
      2.  **Truth-Tracking (of a kind):** The genre tracks *moral truth about character types*, not necessarily *historical truth about every event*. It assumes the constructed dialogue/scene reveals the *real essence* more faithfully than silence would. Your historian colleague mistakes the *kind* of truth sought; it's truth about virtue/vice embodied, not forensic fact.
      3.  **Contrast with Modern Biography:** The footnoted biography prioritizes documentary integrity, often embracing ambiguity or fragmentation (e.g., "we cannot know his motive here"). This serves historical understanding but often *hinders* the genre's aim of providing a clear, actionable exemplar. They *are* different enterprises.

  ### Narrative Closure: A Non-Negotiable Demand (🔒)
  *   Your test case exposes the genre's core artifice. The accidental death *is* a problem **for the genre**. Its rules *force* a judgment:
      *   **Closure Rule Demands Assessment:** Was her life "happy"? Successful? Virtuous? The accidental death denies the material for a satisfying answer *within the genre's terms*.
      *   **Legibility Constraint is Violated:** The death feels random, meaningless – not revealing character or completing a shape. It resists assimilation.
      *   **Genre's Response:** It *must* either (a) ignore the accident's meaninglessness and impose closure based on the life *up to* that point (risking falsification), (b) redescribe the death *as* revealing (e.g., "her preparedness for the unexpected," "acceptance of fate" – often strained), or (c) tacitly admit failure for this life.
  *   **Presupposition:** The genre **absolutely requires** lives to possess (or be rendered as possessing) inherent narrative shape and meaning. It *cannot* accept radical contingency, absurdity, or genuinely "unassimilated" events as final. This rules out tragic, absurdist, or purely contingent views of human existence where meaning is not immanent but imposed or absent.

  ### Do the Conventions Hang Together?
  *   **Yes, as an Integrated System (🔒):** They cohere around the core aim: producing *pedagogically potent moral exemplars*.
      1.  **Revelatory-Priority** provides accessible entry points to character.
      2.  **Closure** allows final, authoritative judgment.
      3.  **Typology** ensures coherence and finds meaning in all phases.
      4.  **License** guarantees legibility and completeness.
      5.  **Pairing/Ranking** provides comparative moral insight, sharpening judgment.
  *   **Why Inherited Together? (⚖️):** They likely co-evolved. The revelatory moment needs closure for validation; typology needs license to enforce pattern; ranking needs the coherence provided by the others. A practice using only some (e.g., revelatory moments without closure) would serve a different, less authoritative pedagogical or historical function.

  ### Where the Genre "Cheats" (🔒)
  1.  **Imposing Teleology:** It assumes/fabricates narrative shape where life may offer only sequence or contingency (your test case).
  2.  **Equating Legibility with Essence:** It assumes coherence in the narrative = coherence in the actual moral character/life, potentially smoothing over real contradictions or ambiguities.
  3.  **Conflating Moral Truth with Historical Completeness:** It treats the pedagogically useful completion (via license) as revealing a deeper truth, potentially obscuring historical ignorance or complexity.

  ### Verdicts on Your Questions
  1.  **The Editorial License:** Is **internal to and essential for** the educational aim (🔒). Abandoning it (as modern biography does) abandons the genre's core function of providing clear, actionable, coherent exemplars. It tracks "truth" about character and virtue, not granular historical fact.
  2.  **Narrative Closure:** The genre **absolutely requires lives to be rendered as having a narrative closure they may not in fact possess** (🔒). To function pedagogically *as exemplars*, lives *must* be shown to have a meaningful shape culminating in a death that reveals or confirms. Contingency is the enemy. Your test case highlights this inherent limitation: the genre struggles to accommodate such a life *as an exemplar* without distorting the accidental death's meaninglessness. It *does* lose something *for the genre's purposes* – its suitability as a clear exemplar under the closure rule.

  This implicit theory offers a powerful, coherent model for moral education through narrative but rests on substantive (and contestable) commitments about character stability, the inherent meaningfulness of lives, and the priority of moral legibility over historical precision. Its power is also its limitation.
