prompt: |-
  Hey — hoping you can help me turn something from class into something I can actually use.

  I'm a junior taking a seminar this term on constitutions and the problem of the dead hand, and I also somehow got stuck on my student government's charter and bylaws committee. We vet every proposed amendment before it goes to the full assembly: about ten or twelve proposals a term, we meet every other Sunday for two hours, and I'm the person who writes the one-page recommendation that goes to the floor and then to the Dean's office, which has veto power but mostly rubber-stamps whatever we send. The committee is seven people who will argue about anything for forty minutes, so what I need is something that closes arguments down, not something that opens new ones.

  Here's the thing: nearly everything that crosses my desk is the same move wearing different clothes. The people writing the rule now are making it harder for the people who come after them to do something. Cooling-off periods before a divestment vote. Supermajority requirements for raising the activity fee. A five-year lock on the sustainability fund. A clause banning the assembly from taking positions on national elections. In seminar we spent a while on Ulysses contracts — binding yourself now so that later, weakened you can't do the thing — and on the claim that a constitution is partly a precommitment device for a political body rather than just a list of rules. I get the appeal in the abstract. I cannot turn it into something I can run on a proposal on a Sunday afternoon.

  What I want is a written procedure my committee could actually work through:

  - A short ordered list of questions (six or seven max), each with what counts as a passing answer and what counts as a failing one, and with an explicit "stop here, recommend no" point. It has to be runnable in about twenty minutes by a first-year who joined last week and has never taken a philosophy class, and it has to rely only on things we can actually get — old assembly minutes, the text of the clause, maybe a budget number. We can't run surveys or commission research.
  - Where a question isn't a factual one but a disagreement about values, say so explicitly and say who decides. I want the hand-off points marked, not smoothed over.
  - Two half-formed tests I keep reaching for — please either fix them or tell me to drop them. (1) A direction-of-ignorance test: that tying a future assembly's hands is only ever justified by a failure of *will* it will predictably have (panic, short-termism, cycling between factions, getting lobbied during a crisis), never by a failure of *information*, because a future assembly will normally know more than we do, not less. So any clause whose real justification is that we know better what's good for them should fail. (2) A mirror test: would the majority proposing this accept the identical constraint if the other side held the seats? If not, it's factional entrenchment in precommitment costume. There's probably a third test I'm missing about how long the handcuff should last versus how long the diagnosed failure is expected to last.
  - Then run the whole thing on three proposals I've got coming up: (a) a rule requiring 72 hours between the introduction and the final vote on any divestment resolution; (b) a two-thirds supermajority for *increases* to the student activity fee, with no equivalent requirement for decreases; (c) a clause locking in ten years of spending on a climate commitment, with amendment only by a three-quarters vote. Be aware going in that I personally think (c) is the best idea on the table, so if the procedure says no to it I want it to say no anyway and I want to see exactly where it breaks.
  - Finally, an honest note on what this procedure structurally can't see — the failure modes I should expect after a term of using it.

  American English, please, and please don't assume I can look anything up: we're undergrads, none of us has access to a law database, and I need something that works off the clause text and our own minutes.
reasoning: |-
  Okay, the user is a junior in college serving on a student government charter committee. They're overwhelmed by repetitive proposals that restrict future actions (dead hand problem) and need a practical evaluation tool. 

  Hmm... their core tension is academic theory vs real-world constraints: seminar discussions about Ulysses contracts don't help when reviewing bylaws about activity fees. Interesting how they recognize their own bias toward the climate proposal - that self-awareness tells me they want rigor, not validation.

  Key pain points emerge clearly:
  - Time-crunched meetings with argumentative peers
  - Need for objective criteria a novice can apply
  - No resources beyond meeting minutes and budgets
  - Must prevent factional power grabs disguised as principles

  The two proposed tests show solid conceptual thinking. The ignorance-direction test is philosophically sound (future assemblies have more info, not less), while the mirror test is politically shrewd. But both need operationalizing - how to prove "factional entrenchment" without psychics?

  For the evaluation framework, I'm considering:
  1. Must be checklist simple but trap bad faith proposals
  2. Need clear off-ramps when proposals fail basic screens
  3. Should surface value judgments explicitly ("this is where we argue about fairness")
  4. Must withstand veto-happy deans seeing procedural rigor

  The three test cases are perfect stress tests. That supermajority-for-fee-increases-only reeks of partisan maneuvering, while the climate lock might actually pass the mirror test. The 72-hour rule... eh, seems benign but could mask obstruction.

  Biggest challenge: designing failure modes they can tolerate. Any procedure will miss coalition-building loopholes or unforeseen emergencies. Better to name those gaps upfront than pretend omniscience.

  Noticing they didn't mention enforcement mechanisms - probably because deans rubber-stamp. Smart. Keeps focus on gatekeeping, not punishment.

  ...time to build that decision tree.
answer: |-
  Here's a practical, step-by-step procedure for evaluating precommitment proposals – designed for speed, clarity, and undergrad-level resources. I'll run it through your test cases and flag its blind spots.

  ---

  ### **Student Government Amendment Evaluation Checklist**
  *(Run in order – stop and recommend "NO" at any failure)*

  1. **The Problem Statement**  
     *Question: Does the proposal clearly identify a specific, recurring failure mode of future assemblies? Must cite past incidents (with minutes dates) or a demonstrable immediate risk.*  
     - PASS: Cites ≥2 past examples (e.g., "Minutes 10/3/22 show hasty vote during protest"; "Fee cuts in 2021 caused org bankruptcies").  
     - FAIL: Vague justification ("future instability," "potential rash decisions").  
     *→ STOP HERE IF FAIL. RECOMMEND NO.*

  2. **The Ignorance Test**  
     *Question: Is the diagnosed failure purely about *will* (panic, short-termism, lobbying) NOT about *knowledge*?*  
     - PASS: Problem is emotional/factional pressure (e.g., "voting under activist pressure," "deferring hard votes").  
     - FAIL: Implies future assemblies won’t understand the issue (e.g., "they might not value sustainability").  
     *→ STOP HERE IF FAIL. RECOMMEND NO.*

  3. **The Lock Duration**  
     *Question: Is the constraint duration ≤ 2x the frequency of the problem?*  
     - PASS: Duration aligns with problem recurrence (e.g., 1-year lock for annual budget fights).  
     - FAIL: Lock exceeds problem cycle (e.g., 10-year lock for yearly votes).  
     *Handoff: If disputed, committee votes by majority.*  

  4. **The Mirror Test**  
     *Question: Would proponents support this rule if their rivals held power?*  
     - PASS: Rule is neutral (e.g., cooling-off period applies to all resolutions).  
     - FAIL: Asymmetric impact (e.g., supermajority only for fee *increases*).  
     *Handoff: Committee debates/votes if intent is unclear.*

  5. **The Escape Hatch**  
     *Question: Can a simple majority override in a genuine emergency? (e.g., war, pandemic, bankruptcy)*  
     - PASS: Explicit override clause (e.g., "suspended by 2/3 vote if org funding <50%").  
     - FAIL: No override, or override threshold ≥3/4.  
     *Handoff: Committee judges "emergency" scope.*

  6. **The Burden Check**  
     *Question: Does this create >15 mins/week of new bureaucracy?*  
     - PASS: Minimal admin (e.g., waiting period built into existing calendar).  
     - FAIL: Requires new committees, reports, or complex processes.  
     *Handoff: Estimate using current workload.*

  **OUTCOME**: Pass all 6 → RECOMMEND YES. Any fail → RECOMMEND NO.  
  *Time required*: ~15 mins/clause with a prepared first-year.

  ---

  ### **Test Cases**
  ***(Using your real proposals)***

  **Proposal (a): 72-hour wait for divestment votes**  
  1. **Problem Statement**: Fails unless proponents cite rushed past votes (e.g., "Divestment Vote #14, 11/5/23, passed in 20 mins with 30% absent").  
  2. **Ignorance Test**: PASS (targets emotional voting).  
  3. **Lock Duration**: PASS (short wait vs. multi-year divestment campaigns).  
  4. **Mirror Test**: PASS (applies to all resolutions).  
  5. **Escape Hatch**: PASS (no emergency likely).  
  6. **Burden Check**: PASS (fits existing calendar).  
  → **RECOMMEND YES** *if Problem Statement passes*.

  **Proposal (b): 2/3 supermajority for fee increases only**  
  1. **Problem Statement**: Likely fails (rarely cited past fee hikes as "reckless").  
  2. **Ignorance Test**: PASS (targets short-termism).  
  3. **Lock Duration**: N/A (permanent rule).  
  4. **Mirror Test**: **FAIL** – Proponents wouldn’t accept this if they wanted to raise fees for their priorities. Asymmetric.  
  → **STOP. RECOMMEND NO.**

  **Proposal (c): 10-year climate spending lock**  
  1. **Problem Statement**: Fails unless proven *repeated* reversals (e.g., "Sustainability Fund cut 3x in 2018-2022 per Minutes 4/1/18, 3/5/20, 2/9/22").  
  2. **Ignorance Test**: **FAIL** – Future assemblies might better understand climate tech/needs. "We know best" is invalid.  
  → **STOP. RECOMMEND NO** *(even though you like it)*.  
  *Fix?* Shorten lock to 2-3 years or tie to measurable goals (e.g., "until carbon neutrality achieved").

  ---

  ### **Structural Blind Spots (Failure Modes)**  
  1. **Coalition Overlook**: The procedure can’t detect "logrolled" proposals (e.g., pairing a popular lock with a toxic one).  
  2. **Emergency Gap**: "Genuine emergency" is subjective; a future crisis might not fit your definition.  
  3. **Creative Circumvention**: Doesn’t catch procedural workarounds (e.g., defunding a program instead of repealing it).  
  4. **Bias Blindness**: Relies on committee honestly applying the Mirror Test – partisans might lie.  
  5. **Overtuse Risk**: Could incentivize trivial locks ("72-hour wait for pizza orders") to seem "constitutional."  

  **Key Insight**: This filters *abusive* precommitments but won’t fix *stupid* ones. It’s a shield, not a brain.  

  ---  
  **Why this works for you**:  
  - No philosophy degree needed – leans on minutes, asymmetry, and admin burden.  
  - Explicit handoffs prevent endless debate ("The Mirror Test is subjective – vote now").  
  - *Your Ignorance Test is solid*; I kept it verbatim. The Mirror Test clarifies factionalism.  
  - *Added Lock Duration*: Addresses your "handcuff vs. problem" gap.  

  Print this on one page. When debates drag, point to the checklist: "We failed Step 2. Next item."
