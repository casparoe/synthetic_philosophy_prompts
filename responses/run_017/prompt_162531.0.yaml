               - Rank5-8: 50*1.5 *4 = 50*1.5=75 per student *4=300
               - Rank9-12: 50*1*4=200
               - Rank13-16: 50*0.5*4=100
               Total = 0+60+300+200+100=660
          - After transfer: worst off has 1 chip -> 1*10=10
            - The three 10s: unchanged: 60
            - Then we took 10 chips from the better off. Suppose we take from the weight 0.5 group: they lose 10 chips, so their contribution: originally 50*0.5=25 per student. Now, if we take 1 from each of 10 students, but the weight 0.5 group has only 4 students. We have to take from multiple groups. 
            - Assume we take 1 chip from each of 10 students: 
               - 2 from the weight 1.5 group (ranks 5-8): each had 50, now 49. Loss: 2 students * (50-49)*1.5 = 2*1.5=3 points.
               - 4 from weight 1 group (ranks 9-12): loss: 4*1=4 points.
               - 4 from weight 0.5 group (ranks 13-16): loss: 4*0.5=2 points.
               Total loss: 3+4+2=9 points.
            - Gain: 10 points (from the worst off going from 0 to 1: 1*10=10)
            - Net change: +1 point. 
            - Also, the distribution of the better off might change the ranking? But the 49s and 50s are still above the 10s, and within, the 49s are below the 50s. 
            - Now the ranks: 
               - worst off: 1 (weight 10)
               - next: three 10s (weight 2)
               - next: the 49s and 50s. The lowest among them are 49. 
               - We have: 
                   - 2 students at 49 (from the weight 1.5 group) -> they are now ranks 5-6? 
                   - 4 students at 49 (from the weight 1 group) -> but they were already in weight 1 group, now still 49, but there are also new 49s. 
               - This is messy. 
        - **Solution:** Use a continuous weighting that doesn't depend on rank order. Use: 
            - Score = sum over students of (if chips <= 10, then 3*chips, else if chips <=40, then 1*chips, else 0.5*chips)
          - Or use a function: score = sum of sqrt(chips) * constant. But sqrt is hard. 
        - We'll do: 
            - Weight for a student = 10 if they are the worst off (defined as the one with the least chips) and 0.5 for everyone else. 
          - Then initial: 
              - worst off: 0 *10 = 0
              - others: 15*50*0.5 = 375
              - total score=375
          - After transfer: worst off gains 1 chip: 1*10=10
              - the 10 students who lost 1 chip: they were at 50, now 49, and they are not worst off (because 49>1), so weight 0.5: loss of 10*1*0.5=5
              - net change: +10 -5 = +5, so score becomes 380.
          - This works. 

  - **Round 3 Rule:** 
     - We'll use: **Score = 10 * (chips of the worst-off student) + 0.5 * (chips of every other student)**.
     - This is extreme prioritarian: only the worst off matters significantly. 
     - Then in the scenario: 
          - Initial distribution: one at 0, fifteen at 50.
          - Score = 10*0 + 0.5*(15*50) = 0 + 0.5*750 = 375.
          - Transfer: worst off gains 1 chip, 10 others lose 1 each (total loss 10 chips).
          - New: one at 1, ten at 49, five at 50.
          - The worst off is the one with 1? But we have one at 1 and ten at 49 and five at 50. The worst off is the one with 1. 
          - Score = 10*1 + 0.5*(10*49 + 5*50) = 10 + 0.5*(490+250) = 10+0.5*740=10+370=380.
          - So it increases by 5. 
     - Students will see: they are sacrificing 10 chips from others to give 1 to the worst off, and it's worth it by the rule. 

  **Round 4: Ex-ante Allocation (if time)**
  - Students are given a new set of envelopes. Inside is a card that will tell them their position in the distribution, but they don't know it yet. 
  - They must decide on a redistribution rule (either egalitarian or prioritarian) and make transfers before seeing their position. 
  - Then they open the envelopes and see what they get. 
  - This shows that prioritarianism might be applied ex-ante (weighting the positions) or ex-post (weighting the actual outcomes). 

  **Sufficiency Variant (if time)**
  - In the prioritarian rule, introduce a threshold: 
     - "Now, we care extra about those below a certain level. Let's set the threshold at 20 chips. Anyone below 20 gets a weight of 3. Anyone above 20 gets weight 1." 
  - Then present a scenario: 
     - There are two students at 19 (just below) and one student at 0 (far below). 
     - You can give 1 chip to the student at 0, or 1 chip to each of the two at 19. 
     - The student at 0: from 0 to 1, which moves from weight 3 to 3 (still below 20) -> gain 3. 
     - The two at 19: from 19 to 20. Now they cross the threshold. Before: 19*3=57 each. After: 20*1=20. So they lose 37 each? 
     - But if we give them 1, they go to 20 and then are above. 
     - Alternatively, we can define the weight by the initial state? Or by the final state? 
     - We'll do final state. 
     - Option A: give 1 to the one at 0 -> becomes 1 (weight 3: 3 points). 
     - Option B: give 1 to each of the two at 19 -> each becomes 20, so weight 1: 20 points each, so total gain: (20-19)*1 + (20-19)*1 = 1+1=2. 
     - By the rule, Option A gains 3, Option B gains 2. So they prefer A. 
     - But the two at 19 are very close to the threshold and lose a lot of weight. 
     - This shows the cliff effect. 

  **Timeline:**

  Total time: 80 minutes.

  - **0-5 min:** Introduction and design scoring rule for Round 1 (egalitarian). 
  - **5-10 min:** Distribute initial endowments (secretly) for Round 1. 
  - **10-20 min:** Round 1: Lossy transfers. Students negotiate and transfer with 50% leakage. Then reveal and calculate score. 
  - **20-25 min:** Round 2: Introduce the destruction box. They can destroy chips. Then they act. Calculate new score. 
  - **25-30 min:** Discuss the absurdity and redesign the rule for Round 3 (prioritarian). 
  - **30-35 min:** Explain the new rule and the new scenario for Round 3. 
  - **35-45 min:** Round 3: They face the transfer decision (1 to worst off at cost of 10 from better off). They decide and calculate. 
  - **45-50 min:** Break (if splitting, otherwise continue). 
  - **50-60 min:** Round 4: Ex-ante allocation. They don't know their position. Design a rule and make transfers. Then reveal positions and see outcomes. 
  - **60-70 min:** Optional: Sufficiency threshold variant. 
  - **70-80 min:** Debrief.

  **Detailed Rules:**

  - **Round 1:**
    - Scoring rule: **Score = Total chips - 5 * (max - min)**
    - Initial endowments (per student):
        - 4 students: 0 chips
        - 4 students: 20 chips
        - 4 students: 50 chips
        - 4 students: 100 chips
    - Leakage: 50% for any transfer (if A gives X chips to B, B receives X/2; the rest is lost). 
    - Process: 
        1. Students receive their endowment in secret.
        2. They may negotiate transfers (publicly announce or privately? Public to save time). 
        3. After transfers, reveal holdings and calculate score.

  - **Round 2:**
    - Add a destruction box. Any student can put chips into the box, which are destroyed.
    - They may destroy chips to change the distribution.
    - Recalculate score with the same rule.

  - **Round 3:**
    - New scoring rule: **Score = 10 * (chips of the worst-off student) + 0.5 * (chips of every other student)**
    - Initial distribution (publicly known? or secret? Public to focus on the issue):
        - 1 student: 0 chips
        - 15 students: 50 chips each
    - Transfer opportunity: We can take 1 chip from each of 10 students with 50 (they become 49) and give 1 chip to the student with 0 (they become 1). 
    - They vote or discuss whether to do this transfer. 
    - Calculate score before and after.

  - **Round 4 (ex-ante):**
    - Students receive an envelope with a card that assigns them to one of the initial endowment groups (but they don't open it yet). 
    - The groups are the same as Round 1: 0, 20, 50, 100. 
    - They must decide on a redistribution rule and make transfers (with leakage) before opening the envelopes. 
    - Then they open and see what they get. 
    - Rules for transfer: same leakage (50%). 
    - They can design any rule (or use one from earlier). 
    - The challenge: they don't know if they will be the worst off or not.

  - **Sufficiency Variant:**
    - Rule: **Score = for each student: if chips < 20, then 3 * chips; else 1 * chips**
    - Scenario: 
        - 1 student: 0 chips
        - 2 students: 19 chips
        - 13 students: 50 chips
    - Options: 
        - Option A: Give 1 chip to the student at 0 (cost: destroy 1 chip, or take from others? We can say: it costs 1 chip from a general pool, or from the instructor). 
        - Option B: Give 1 chip to each of the two at 19 (cost 2 chips). 
    - Calculate the score for each option and compare.

  **Debrief:**
  - Map experiences to doctrines:
    1. **Round 1:** They transferred despite leakage to reduce inequality. This reflects the intrinsic value of equality. But leakage made it costly.
    2. **Round 2:** They destroyed resources to reduce inequality (leveling down). The scoring rule increased, but no one is better off. This is the leveling down objection: it's absurd to destroy resources just to achieve equality.
    3. **Round 3:** They switched to prioritarianism. The rule prioritized the worst off so much that it was worth a large loss to the better off for a small gain to the worst off. This is the prioritarian intuition: "benefits to the worse off matter more." But it has the consequence that we might sacrifice a lot for a small gain to the worst off.
    4. **Round 4 (ex-ante):** When they don't know their position, they might choose a rule that protects the worst-off position. This is the ex-ante prioritarianism. It contrasts with ex-post (which they did in Round 3, knowing positions).
    5. **Sufficiency:** The threshold created a cliff: a small change in chips can cause a big change in weight. This might seem arbitrary.

  - Concepts introduced without lecture:
     - Leveling down objection: in Round 2.
     - Prioritarianism: in Round 3.
     - Ex-ante vs. ex-post: in Round 4.
     - Sufficiency: in the variant.

  **Predictable Problems and Solutions:**
  1. **Destroy-box treated as a joke:** A student might dump all their chips in the box. 
     - _Solution:_ Discuss the consequences: "If you destroy your chips, you might hurt the score." Or, in Round 2, if they destroy excessively, the score might drop (if k is not high enough) or if they destroy from the poor, it might increase inequality. But in our rule, destroying from the rich to bring down the max will help. If someone destroys from the poor, it might make min lower and increase the gap. So it's self-correcting. 

  2. **Arithmetic eats time:** Calculating scores might take long.
     - _Solution:_ Have a teaching assistant or assign student helpers. Use pre-made calculators (if allowed) or do it on the board quickly. Round 1 and 2 use the same distribution, so do the math in advance for likely scenarios.

  3. **The "worst off" role lands badly:** The student with 0 in Round 3 might feel targeted or embarrassed, especially if they are actually financially poor.
     - _Solution:_ Assign roles randomly and emphasize it's arbitrary. Or, in Round 3, do not reveal who has 0 until after the decision? But they need to know there is one. We can say: "There is one student with 0 and others with 50, but we won't say who." But then the scoring rule requires knowing who is worst off. 
     - Alternatively, use a distribution with no zero: e.g., 1 student: 10, others: 50. Then the transfer: give 1 to the worst off at the cost of 10 from others. The worst off goes to 11. 
     - But then the gain is small. 
     - Or, use a group: "the bottom 10%", but with 16 students, that's 1-2. 
     - We'll keep it and handle with sensitivity. 

  4. **Time management:** The simulation might overrun.
     - _Solution:_ Be strict on time. Have a timer. Skip Round 4 or the sufficiency variant if needed.

  5. **Students don't see the point:** 
     - _Solution:_ The debrief is crucial. Explicitly connect each round to the concepts.

  **What the Simulation Can't Do:**
  - **Interpersonal comparisons of well-being:** The chips assume a cardinal, comparable measure of well-being. In reality, we might question whether we can compare and add well-being across people. The simulation doesn't address this worry.
  - **The source of the weights:** In prioritarianism, the weights come from moral philosophy, but in the simulation, they are set arbitrarily. The debrief should note that the weights are meant to represent the moral value of benefits at different levels.
  - **Non-welfarist considerations:** The simulation only uses chips (well-being). It doesn't include rights, desert, or other values.
  - **Dynamic effects:** The simulation is one-shot. In reality, redistribution might affect incentives and future production.

  **Final Simulation Design:**

  - **Materials:**
     - Poker chips: at least 200 (e.g., 40 red, 160 blue to distinguish initial groups if needed, but not necessary).
     - Index cards: 16 for Round 1 endowments, 16 for Round 4 positions.
     - Envelopes: 32 (16 for Round 1, 16 for Round 4).
     - A small box (destruction box).
     - Whiteboard and markers.

  - **Rules and Numbers:** As above.

  - **Timeline (adjusted for 80 minutes):**
    - 0-5: Explain the activity and design the Round 1 scoring rule (Score = Total - 5*(max-min)).
    - 5-10: Distribute Round 1 endowments (secretly) and answer questions.
    - 10-20: Round 1: Lossy transfers (leakage 50%). Students negotiate and transfer. Then reveal and calculate score. 
    - 20-25: Round 2: Introduce destruction box. Students may destroy chips. Then recalculate score.
    - 25-30: Discuss the outcome and redesign the rule for Round 3. Introduce the prioritarian rule (Score = 10*worst off + 0.5*others).
    - 30-35: Explain Round 3 scenario (1 at 0, 15 at 50) and the transfer option.
    - 35-40: Round 3: They discuss and decide on the transfer. Calculate the score before and after.
    - 40-45: Break (or continue if no break).
    - 45-55: Round 4: Ex-ante allocation. Distribute position envelopes (not opened). They design a rule and make transfers (with leakage). Then open envelopes and see outcomes.
    - 55-65: Sufficiency variant (if time): Explain the rule and scenario. They decide between options.
    - 65-80: Debrief: connect each round to the concepts.

  **Debrief Script:**
  - "In Round 1, you designed a rule that penalized inequality. You were willing to lose some chips in transfers to reduce inequality. This captures the idea that equality is intrinsically valuable."
  - "In Round 2, you destroyed chips to reduce inequality, and the rule said that was better. But did anyone benefit? No. This is the leveling down objection: making everyone worse off for the sake of equality is absurd."
  - "So in Round 3, you switched to a rule that gives extra weight to the worst off. You found that even a small gain for the worst off was worth a large loss for others. This is the core of prioritarianism: benefits to the worse off matter more. But it has its own issue: we might sacrifice a lot for a small gain."
  - "In Round 4, you had to choose without knowing your position. This is the ex-ante perspective. You might have chosen to protect the worst-off position, which is a way of giving priority to the worse off."
  - "Finally, the sufficiency threshold created a cliff effect. Crossing a threshold can be discontinuous, which might seem arbitrary."

  - Open for discussion: "How did each part feel? What are the strengths and weaknesses of each approach?"

  This should achieve the learning objectives.
answer: |-
  ### Simulation Design: "The Equality-Priority Dilemma"

  This simulation forces students to confront the core tension between equality (intrinsic value) and prioritarianism (weighting benefits to the worse off) through experiential dilemmas. The design minimizes lecture, uses visceral absurdity, and ensures discomfort emerges from gameplay. Below are the deliverables, including dropped mechanics, full simulation details, timeline, debrief, and risk management.

  ---

  ### **Dropped Mechanics & Why**
  1. **Veil of Ignorance + Redistribution Auction**  
     *Why dropped:* Complex setup; focuses on risk-aversion (veering toward utilitarianism) rather than the equality/priority distinction.

  2. **Group-Based Resource Negotiation**  
     *Why dropped:* Risks dominant students hijacking decisions; dilutes individual gut reactions to absurdity.

  3. **Dynamic Inequality Penalty Voting**  
     *Why dropped:* Passive voting lacks the tactile "absurdity" feeling; arithmetic would dominate time.

  4. **Tiered Wealth Simulation with Role Cards**  
     *Why dropped:* Assigning "poor" roles could alienate actually disadvantaged students.

  5. **Productivity + Redistribution Cycle**  
     *Why dropped:* Shifts focus to incentive structures (relevant to egalitarianism, but muddies core doctrinal clash).

  ---

  ### **Chosen Simulation: "The Chip Scale"**
  **Core Idea:** Students create a "fairness score" rule. Through rounds, they discover the rule demands:  
  - **Round 1:** Costly transfers to reduce inequality (equity-efficiency tradeoff).  
  - **Round 2:** Destroying resources *just* to equalize (absurd leveling down).  
  - **Round 3:** Sacrificing massive gains for trivial worst-off benefits (priority’s discomfort).  
  - **Round 4 (if time):** Ex-ante allocation exposing position vs. person weighting.  
  - **Variant:** Sufficiency threshold creating a "cliff effect."

  ---

  ### **Materials**
  - **Poker chips (150 total):** 100 blue (base), 50 red (for threshold variant).  
  - **Index cards (32):** 16 for endowments, 16 for Round 4 position assignments.  
  - **Envelopes (16):** Distribute initial endowments secretly.  
  - **Small cardboard box:** "Destruction Box" for Round 2.  
  - **Whiteboard:** Track scores and rules.  
  - **Markers, timer.**  

  ---

  ### **Rules & Numbers**  
  *(Write these on the board as rounds progress)*  

  #### **Round 1: Costly Equality**  
  - **Initial Endowments (secret, per student):**  
    - 4 students: 0 chips  
    - 4 students: 4 chips  
    - 4 students: 10 chips  
    - 4 students: 16 chips  
    *(Total: 120 chips; max/min gap = 16)*  
  - **Scoring Rule:** "Fairness Score = Total Chips - 2 × (Highest - Lowest)"  
    *(e.g., Initial score = 120 - 2×16 = 88)*  
  - **Transfer Rule:** For every 1 chip transferred, only 0.5 chips arrive (50% leakage).  
  - **Goal:** Maximize the Fairness Score through voluntary transfers.  

  #### **Round 2: Leveling Down**  
  - **New Rule:** Add the Destruction Box. Any chip placed inside is destroyed and gone forever.  
  - **Scoring Rule:** Same as Round 1.  
  - **Goal:** Maximize Fairness Score using transfers and/or the box.  

  #### **Round 3: Prioritarian Sacrifice**  
  - **New Scoring Rule:** "Fairness Score = (Chips of Worst-Off Student × 3) + (Chips of All Other Students × 0.5)"  
  - **Initial Distribution (public knowledge):**  
    - 1 student: 0 chips (assigned randomly)  
    - 15 students: 20 chips each  
    *(Total: 300 chips; prioritarian score = (0×3) + (300×0.5) = 150)*  
  - **Decision:** As a group, choose:  
    - **Option A:** Do nothing (score remains 150).  
    - **Option B:** Take 10 chips *each* from 5 better-off students (50 chips lost) and give 1 chip to the worst-off student.  
      *(New score: (1×3) + (295×0.5) = 3 + 147.5 = 150.5)*  

  #### **Round 4: Ex-Ante Allocation**  
  - **Setup:** Students receive envelopes with future position (e.g., "You will be in the 0-chip group"). Envelopes sealed until after decisions.  
  - **Initial Pool:** 120 chips to allocate across 4 groups (0-, 4-, 10-, and 16-chip groups *before* leaks).  
  - **Transfer Rule:** 50% leakage applies.  
  - **Scoring Rule:** Class designs one (e.g., prioritarian or egalitarian) *without knowing positions*.  
  - **Goal:** Allocate chips to groups to maximize expected fairness score.  

  #### **Sufficiency Variant (Short)**  
  - **Scoring Rule:** "Chips below 5: ×3 weight. Chips at/above 5: ×1 weight."  
  - **Scenario:**  
    - 1 student: 0 chips  
    - 2 students: 4 chips each (1 below threshold)  
    - 13 students: 10 chips each  
  - **Decision:** Give 1 chip to the 0-chip student (cost: 5 chips from better-off).  
    - *Result:* 0→1 (still below threshold; +3 points). Better-off lose 5 chips (-5 points). Net drop, but threshold "cliff" ignores proximity.  

  ---

  ### **Minute-by-Minute Timeline**  
  **Total: 80 minutes** (split into 45-min Block 1 and 35-min Block 2)  

  #### **Block 1 (0–45 min)**  
  - **0–5 min:** Framing & Rule Setup  
    - *Instructor:* "Distribute these envelopes secretly. Your goal is to maximize the Fairness Score. Design a rule: What makes a chip distribution ‘fair’?"  
    - *Students:* Brainstorm scoring rules. Steer toward *Score = Total - 2×(Max-Min)*.  
  - **5–10 min:** Round 1 Setup  
    - Distribute endowment envelopes. Students check chips secretly (no sharing numbers yet).  
  - **10–25 min:** Round 1 Gameplay  
    - Students negotiate transfers (e.g., "I’ll give 4 chips to X"). Enforce 50% leakage.  
    - After transfers, reveal holdings. Calculate score.  
    *(Expected: Transfers reduce inequality but lower total. Score may rise slightly.)*  
  - **25–35 min:** Round 2 Gameplay  
    - Introduce Destruction Box: "You may drop chips here to destroy them."  
    - Recalculate score after destructions.  
    *(Expected: Students destroy chips from the rich to shrink max-min gap. Score rises despite losses, e.g., destroying 8 chips from a 16-chip student reduces gap to 8; score rises by 8.)*  
  - **35–45 min:** Transition to Prioritarianism  
    - *Instructor:* "Last round felt odd, right? Redesign the rule to avoid destroying chips."  
    - Guide students toward weighting worst-off (e.g., "What if chips to the poorest count more?"). Set *Score = (Worst-off × 3) + (Others × 0.5)*.  

  #### **Block 2 (45–80 min)**  
  - **45–50 min:** Round 3 Setup  
    - Assign 1 random student 0 chips; others get 20. Explain Option A/B decision.  
  - **50–60 min:** Round 3 Gameplay & Variant  
    - Students debate/vote on Option A or B. Calculate new score.  
    - *If time:* Run sufficiency variant (5 min). Highlight the 4→5 threshold jump.  
  - **60–70 min:** Round 4 (Ex-Ante)  
    - Distribute position envelopes (sealed). Allocate 120 chips to groups with leakage.  
    - Open envelopes. Compare outcomes.  
  - **70–80 min:** Debrief (structure below)  

  ---

  ### **Debrief: Mapping Gameplay to Doctrine**  
  *(Do not use jargon until debrief!)*  
  1. **Round 1 Recap (0–5 min):**  
     - *Experience:* You sacrificed total chips for equality.  
     - *Doctrine:* "Equality has intrinsic value" (e.g., Temkin). Costly transfers reflect equity-efficiency tradeoffs.  
     - *Key Question:* "Why did reducing inequality feel worth the cost?"  

  2. **Round 2 Recap (5–10 min):**  
     - *Experience:* You destroyed chips to equalize. No one gained, but the score rose.  
     - *Doctrine:* **Leveling-down objection:** Intrinsic equality is absurd—it can make everyone worse off for no gain (Parfit, Raz).  
     - *Key Question:* "Why did destroying chips feel wrong even though the score improved?"  

  3. **Round 3 Recap (10–15 min):**  
     - *Experience:* You sacrificed 50 chips for 1 chip to the worst-off because your rule weighted their gain heavily.  
     - *Doctrine:* **Prioritarianism:** Benefits to the worse off matter more (e.g., Weymark). But it accepts "huge sacrifices for small gains" (the abandonment of Pareto).  
     - *Key Question:* "Was 50:1 a fair trade? Why does this *feel* less absurd than destroying chips?"  

  4. **Round 4 & Variant (15–20 min):**  
     - *Experience (Ex-Ante):* You allocated to positions, not people.  
     - *Doctrine:* Priority can attach to *positions* (ex-ante fairness) or *persons* (ex-post fairness).  
     - *Sufficiency Cliff:* Thresholds create arbitrary discontinuities (e.g., Frankfurt); the student at 4 chips gets no boost, but at 5 they lose weight.  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Destruction Box as a Joke:**  
     - *Risk:* Students dump all chips for laughs.  
     - *Fix:* Preempt: "This box has real scoring consequences—your grade/prize depends on the final score." Use raffle tickets for high scorers to incentivize seriousness.  

  2. **Arithmetic Overload:**  
     - *Risk:* Calculating scores bogs down gameplay.  
     - *Fix:* Assign 2 "scorekeeper" students to manage math. Pre-calculate likely scenarios. Use whole numbers to avoid fractions.  

  3. **"Worst-Off" Role Stigma:**  
     - *Risk:* The 0-chip student feels targeted or embarrassed.  
     - *Fix:* Randomize roles; reframe: "Chips are arbitrary—like innate talent, not merit." Skip revealing who is worst-off in Round 3 until after the decision.  

  4. **Time Crunch:**  
     - *Risk:* Rounds 3/4 run long.  
     - *Fix:* Use timers. Prioritize Rounds 1–3; cut Round 4 or sufficiency if needed.  

  5. **Over-Engineering Rules:**  
     - *Risk:* Students design overly complex scoring.  
     - *Fix:* Offer 2–3 simple options. Default to provided rules if debate stalls.  

  ---

  ### **What the Simulation Can't Do**  
  1. **Cardinal/Comparable Wellbeing:** Chips assume wellbeing is measurable, additive, and comparable. *Address in debrief:* "Real-world wellbeing isn’t poker chips—how might this change things?"  
  2. **Structural Injustice:** Focuses on redistribution, not historical/structural causes of inequality. *Debrief note:* "This abstracts from why inequalities exist (e.g., oppression)."  
  3. **Non-Welfarist Values:** Ignores desert, rights, or freedom. *Debrief note:* "Equality/priority debate often sidelines these—should it?"  
  4. **Incentive Effects:** Static simulation ignores how rules affect effort/innovation. *Debrief note:* "What if transfers discourage chip production?"  

  ---

  ### **Instructor Script Snippets**  
  - **After Round 2:** "You destroyed resources to make numbers equal. Did anyone’s life improve? Why does the rule demand this?"  
  - **After Round 3:** "You sacrificed 50 chips for 1. How is this different from burning chips? Why does it *feel* less absurd?"  
  - **Sufficiency Variant:** "The student at 4 chips gets no extra weight, but at 5, they lose it. Does this ‘cliff’ seem fair?"  

  This design forces visceral engagement with the doctrines, sets up debrief-driven clarity, and stays within budget/time limits. Run it as a discovery process—your debrief ties their discomfort to the philosophy.
