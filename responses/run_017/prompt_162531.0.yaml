      - If we redistribute: suppose we take 10 from a rich and give to a poor. With 50% leak, we transfer 10 chips: the poor gets 5, the rich loses 10. New distribution: [5,2,5,0] (if the poor was 0 and rich 10). Total: 5+2+5+0=12, max-min=5-0=5, score=12-5=7. Same score? Not compelling. 
