      *"The fairness score = Total chips - 1.5 * (richest - poorest)"*

  - **Process:**
    1. (5 min) Introduce: "Today we're going to distribute chips. First, we need a rule to judge how good a distribution is. Let's design one. We want it to be fair. What should we use?" 
