prompt: |-
  My friend Dani is the most consistant person I know on duties of rescue, and I want to find out whether her view actually holds together or whether it's just a list of intuitions with a story attached. She's the hardline Singer-style sort: shallow pond, muddy clothes, distance doesn't matter, nobody's special. Here's her track record, roughly as she'd put it:

  - Kid drowning in a shallow pond, you ruin a $200 suit getting her out: "obviously you get in, there's nothing to talk about."
  - 10% of your income to a charity that hands out malaria bednets: "that's not sainthood, that's just what you owe."
  - Your daily $6 coffee: she'll say you should give the money instead, but every time I push her on whether buying it is actually wrong she goes quiet and changes the subject.
  - Donating a kidney to a stranger: "amazing, not required."
  - Everyone in the office is chipping in $20 for a colleague's surgery and everyone does chip in: "yeah, obviously."
  - No duty to vote in a national election even when the other side is much worse, because one vote makes no difference.
  - Jumping into a fast river for a drowning kid at maybe a 1-in-20 risk to her own life: yes. At 50/50: no.
  - Someone else is already wading in and looks like they'll manage: she says you can keep walking.
  - She'd skip a friend's birthday dinner to help a stranger in trouble. She would not skip her sister's wedding.
  - She gives to the bednet charity and not to a local outfit she thinks is ineffective, "because if it doesn't work, what's the point."

  As far as I can tell she has never once been asked about a case where she was the only person who could help and a lot of other people who could have helped were just standing there doing nothing. So:

  (1) Same shallow pond. Two hundred people watching, none of them will move. Going in alone costs you about $2,000, something like a fifth of your income for the year, plus a job interview you can't reschedule for the career you actually want. If they'd coordinated it would have cost each of them ten dollars.
  (2) The pond is on your walk to work every morning for the next thirty years. A different kid each time. Every single rescue costs you a pair of shoes and ten minutes and nothing else.
  (3) You can save the kid: 95% you both get out fine, 5% you drown and your two small kids lose their only parent.

  What does she say about each of those, and what's the rule she's running? More usefully: give me the other rules that fit all her old verdicts just as well, show me where exactly they come apart on these three, and then give me one further case I could put to her that would settle which one she means. I care way more about the rule than about her answers.
reasoning: |-
  Hmm, the user wants to analyze their friend Dani's moral framework regarding duties of rescue. Dani seems to follow a strict utilitarian approach similar to Peter Singer, where helping others is a strong obligation unless the cost to oneself is too high. The user provided several examples of Dani's positions and now three new scenarios to test her consistency. The goal is to identify the underlying rule and propose alternatives that fit the existing data, then find a test case to distinguish between them.

  Looking at Dani's track record, she prioritizes immediate, effective aid with low personal cost. For instance, she'd save a kid in a shallow pond even with ruined clothes but won't risk a 50% chance of death. She donates to effective charities but avoids ineffective ones. She also values personal relationships, as seen in skipping a friend's birthday but not her sister's wedding. This suggests her rule might be a threshold-based consequentialism where costs to self and relationships matter.

  The user's three new cases introduce complexities like bystander effects, repeated rescues, and risks to dependents. For case (1), with 200 bystanders refusing to help, Dani might still say you should act because the child's life outweighs the $2000 cost and missed interview, similar to her shallow pond stance. But the inefficiency of others not helping might frustrate her, though it doesn't change the immediate obligation. 

  Case (2) with daily rescues could be tricky. Dani supports ongoing donations like bednets, so consistent small costs might be acceptable. But daily interruption might cross a threshold where cumulative cost becomes too high, or she might see it as a sustainable duty. 

  Case (3) with a 5% risk of death leaving dependents orphaned is critical. Dani refused a 50% risk to herself but accepted 1-in-20. Here, a 5% risk with dependents might push her to say no, as the potential harm to her children creates a higher threshold. 

  Alternative rules could be:
  1. Simple cost-benefit threshold: Rescue required if cost to self < expected benefit to others. Fits most cases but might struggle with the coffee example where $6 could save a life, yet Dani avoids calling it wrong. 
  2. Threshold with personal projects: Allows some personal spending if below a "luxury" threshold. Explains the coffee hesitation but might conflict with strict utilitarianism. 
  3. Relational prioritarianism: Gives extra weight to close relationships. Explains skipping a friend's event but not a sister's wedding. 

  A test case could involve choosing between saving a stranger or attending a close family member's minor but important event. If Dani prioritizes family, it supports relational prioritarianism; if not, it leans toward strict threshold utilitarianism.

  The user cares more about the rule than Dani's answers, so the key is to map the principles and find where they diverge. The test case should isolate the role of personal relationships versus impersonal aid in her framework.
answer: |-
  Based on Dani's track record and the principles of Singer-style effective altruism she embodies, here's the analysis of her likely responses to your new cases, the underlying rule, competing rules fitting the old data, where they diverge on the new cases, and a decisive test case:

  **Likely Dani Responses:**
  1.  **"Get in. It's still a kid drowning."** The bystanders' inaction doesn't change *your* obligation or the child's need. The $2000 cost and missed interview are significant but less than a life (analogous to 10% income being less than lives saved). The inefficiency of others is frustrating, but irrelevant to *your* duty *now*.
  2.  **"Save the kid every time."** This is functionally identical to her bednet commitment (small, repeated cost for life-saving). Ruined shoes ($50? $100?) is trivial per life saved. Ten minutes daily is manageable. She'd likely view it as a core obligation, similar to donating income.
  3.  **"Don't jump."** While the 5% risk is lower than her 1-in-20 (5%) threshold for a *single, direct* rescue (where she said "yes"), the consequence here (orphaning your children) drastically increases the *net* cost. Saving one life at a 5% risk of orphaning two children has a negative expected net utility. This crosses a threshold of acceptable personal cost/risk when dependents are involved.

  **The Core Rule Dani is Likely Running:**
  **Threshold Consequentialism with Agent-Relative Costs and Relational Weighting:**
  1.  **Consequentialism:** Obligation to act arises from the expected positive consequences (lives saved, suffering reduced).
  2.  **Threshold:** The obligation *holds* only if the net expected cost/risk to the agent *falls below a significant threshold*. This threshold isn't fixed but scales with the stakes.
      *   *Low Stakes (e.g., $200 suit, coffee $):* Threshold is very low. Almost any cost to save a life is required.
      *   *High Stakes (e.g., life, major harm to dependents):* Threshold is high. Significant costs/risks exempt the agent.
  3.  **Agent-Relative Costs:** Only the cost *to the acting agent* matters for triggering the threshold exemption. The *reason* others aren't acting (lazy, inefficient, coordination failure) is irrelevant to *your* calculation when faced with the immediate need.
  4.  **Relational Weighting:** Costs/benefits involving individuals with whom the agent has special relationships (family, close friends) carry extra moral weight. Harm to *your* children is a much greater cost than harm to a stranger. Helping a close relative can outweigh helping a stranger at similar cost.
  5.  **Effectiveness Paramount:** Only effective aid creates a duty. Ineffective aid is pointless, even if cheap.

  **Alternative Rules Fitting the Old Verdicts:**
  1.  **Simple Cost-Benefit Threshold:**
      *   *Rule:* Obligation to act if (Expected Benefit) / (Cost to Agent) > Threshold Ratio.
      *   *Fits Old Data:* Explains pond ($200 <<< Life), bednets ($X <<< Lives), coffee (cost/benefit ratio worse than bednets), kidney (Cost/Life ratio too high), office chip-in ($20 <<< Surgery), river (1/20 risk: Cost/Life ~20; 50/50: Cost/Life = 2), bystander (benefit already secured), sister's wedding (cost to sister >> cost to friend/stranger), ineffective charity (benefit ~0).
      *   *Weakness:* Struggles with the *coffee hesitation*. Why wouldn't buying coffee be straightforwardly *wrong* if $6 could save part of a life? It also doesn't explicitly capture the relational weighting.
  2.  **Threshold Deontology with Permissible Projects:**
      *   *Rule:* A strong duty to rescue exists when the cost is "minimal" (low threshold). Above that threshold, significant personal projects/relationships create "moral space" where the duty lapses. Effectiveness is a duty component.
      *   *Fits Old Data:* Explains pond (minimal cost), bednets (minimal cost *as duty*), coffee (within permissible "personal project" space?), kidney (beyond minimal, no duty), office chip-in (minimal cost), voting (cost minimal but benefit negligible -> no duty), river (beyond minimal cost threshold), bystander (no need = no duty), sister (special relationship project outweighs stranger rescue), ineffective charity (duty requires effectiveness).
      *   *Weakness:* "Minimal cost" is vague and the "projects" allowance is fuzzy. Why is *daily* coffee a permissible project but *not* donating that money? Why is *your* $2000 cost in (1) not part of a "career project" you can prioritize? This rule risks being less predictive.
  3.  **Scaled Negative Responsibility:**
      *   *Rule:* You are morally responsible for preventable harm you *could* easily prevent. The "easily" scales with the severity of the harm and the uniqueness of your ability. Effectiveness required.
      *   *Fits Old Data:* Pond (easy to prevent death), bednets (easy to prevent deaths), coffee (easy to prevent *some* harm), kidney (not easy), office chip-in (easy), voting (not easy to affect outcome), river 1/20 (arguably "easy enough" for death), river 50/50 (not "easy"), bystander (harm not preventable by *you* anymore), sister (preventing harm to sister by absence is severe), ineffective charity (can't prevent harm).
      *   *Weakness:* Struggles with the *clarity* on coffee and the *quantitative* risk assessments in the river cases. Is 5% risk "easy"? Is $2000 "easy"? Why is skipping sister's wedding causing "harm" but skipping friend's isn't? The relational aspect needs bolting on.

  **Where the Rules Diverge on Your New Cases:**

  *   **Case 1 (Pond + Bystanders + High Cost):**
      *   **Dani's Likely Rule:** *Required.* Cost to agent ($2000) is still below the threshold for saving a life. Others' inaction irrelevant.
      *   **Simple C/B Threshold:** *Required.* Benefit/Cost ratio (Life/$2000) is still very high.
      *   **Threshold Deontology:** *Ambiguous.* Is $2000 + missed interview still "minimal"? If not, is the career a "permissible project"? Might lean towards *not required*.
      *   **Scaled Neg. Resp.:** *Ambiguous.* Is preventing this death still "easy" for you given the high cost? Might lean towards *not required*.

  *   **Case 2 (Daily Pond):**
      *   **Dani's Likely Rule:** *Required every time.* Cost per rescue is trivial relative to the benefit.
      *   **Simple C/B Threshold:** *Required every time.* High Benefit/Cost ratio per instance.
      *   **Threshold Deontology:** *Required every time.* Cost per instance is clearly "minimal".
      *   **Scaled Neg. Resp.:** *Required every time.* Preventing each death remains "easy".

  *   **Case 3 (Pond + Risk to Dependents):**
      *   **Dani's Likely Rule:** *Not Required.* The net expected cost (5% chance of orphaning two children) is too high.
      *   **Simple C/B Threshold:** *Ambiguous but likely Not Required.* (1 Life * 95%) vs. (2 Orphanings * 5%)? Quantifying "orphaning" is hard, but likely net negative.
      *   **Threshold Deontology:** *Not Required.* Risk to dependents takes it far beyond "minimal" cost.
      *   **Scaled Neg. Resp.:** *Not Required.* Preventing the stranger's death is no longer "easy" due to the severe potential cost to others for which you're responsible.

  **The Decisive Test Case:**

  To distinguish Dani's likely rule (Threshold Consequentialism w/ Relational Weighting) from the Simple Cost/Benefit Threshold (which struggles with coffee/relationships) and confirm the strong relational component, pose this:

  **"You are walking alone past the shallow pond. A child is drowning. You can easily save her, ruining your $200 suit. However, *simultaneously*, you get a call: your sister is having a *minor* but genuinely distressing emergency (e.g., locked out in the cold, minor car fender-bender and very shaken up) 5 minutes away. You are the *only* person she can reach and she needs you *right now* to help calm her down/get her inside/deal with the cops. If you save the child, you can't help your sister promptly. If you help your sister, the child dies. What do you do?"**

  *   **Why this tests the rules:**
      *   **Dani's Likely Rule:** She prioritizes **helping her sister**. The *relational weighting* gives significant extra moral value to preventing distress/suffering for her sister compared to a stranger. The child's life is a greater *objective* harm, but the *agent-relative* cost of failing her sister (due to the relationship) outweighs the impersonal duty to save the stranger when forced to choose directly.
      *   **Simple Cost/Benefit Threshold:** Would likely prioritize **saving the child**. The benefit (saving a life) vastly outweighs the cost of the sister's distress (even if significant). The $200 cost is trivial in both scenarios. This rule struggles to account for the special weight of relationships.
      *   **Threshold Deontology w/ Projects:** Might also prioritize the **sister**. The sister's need falls squarely within the "special relationship project" that creates moral space, overriding the rescue duty when a direct conflict arises.
      *   **Scaled Neg. Responsibility:** Ambiguous. Preventing the sister's distress might be seen as a more specific, relationship-based duty, potentially outweighing the general rescue duty. Leans towards **sister**.

  *   **Interpreting Dani's Answer:**
      *   If she **helps her sister**, it strongly confirms the **relational weighting** component central to her likely rule (and fits Threshold Deontology). It explains the wedding vs. birthday distinction *and* the hesitation on coffee (personal spending as a minor relational/permissible project).
      *   If she **saves the child**, she's running a much more strictly impersonal consequentialism than her other judgments suggest. This would be inconsistent with skipping a friend's birthday but not her sister's wedding *for a stranger*, and make her coffee hesitation even more puzzling (unless it's purely about effectiveness uncertainty).

  This case forces a direct trade-off between the core rescue duty and the agent-relative obligations arising from close relationships, pinpointing the role relational weighting plays in her threshold calculation. Her answer here will be highly revealing of the underlying structure of her "hardline Singer-style" view.
