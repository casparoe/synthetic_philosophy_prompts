  The camps disagree fundamentally about Weber's Protestant ethic thesis. Camp A sees meaning as causal: religious reinterpretation redirected economic conduct independently of material interests. Camp B sees culture as an epiphenomenal label for institutional factors like literacy and networks. Both accept the Protestant-Capitalist correlation but diverge on causation.

  Key constraints: Must include uncomfortable truths for both sides. Disambiguate verbal disagreements (like definitions of "culture" or "cause") from genuine ones. For each of four test cases, specify predictions and defeat conditions. The whole document should stay under 1,600 words without citations.

  For the structure: I'll create four sections as requested. First, agreed claims including something uncomfortable for each camp - perhaps that values can persist after beliefs fade (uncomfortable for A) and that institutions depend on meaning to function (uncomfortable for B). 

  For the disagreements table, I'll identify three cruxes: 1) Whether meaning is causally active or epiphenomenal, 2) Whether values must be avowable to matter, 3) Whether "culture" is a primitive explanatory category. These map to the user's cruxes about value avowal and explanatory status.

  The tests table will use the four cases: 
