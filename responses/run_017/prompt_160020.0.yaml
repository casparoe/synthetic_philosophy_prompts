prompt: |-
  So — six of us in the reading group have been going at this for about eight months, and we've finally committed to a half-day workshop in March whose only deliverable is supposed to be one document everybody can put their name to. Help me draft it.

  The fight is about obfuscated arguments and how much of a problem they are for the idea that we could get safe behavior out of very capable systems by having them argue in front of a bounded judge. Call the two sides:

  - Camp A, "it scales": obfuscation is real but it's mostly a symptom of weak models and badly specified tasks; honest debaters have a structural advantage because true claims admit short, checkable, decisive support; and the point of cross-examination is that exposing an error is cheaper than manufacturing a flawless fake. Debate degrades gracefully, not catastrophically.
  - Camp B, "there's a wall": for a judge with bounded time there are questions on which a motivated deceiver can produce arguments that are locally impeccable at every step and only globally wrong; raising doubt is cheaper than establishing truth, so the deceptive side wins on points; and this gets worse with debater capability, not better, because the capability asymmetry grows faster than the judge's ability to audit.

  Neither camp is a bloc, and I want that handled rather than papered over. Inside camp A, some think obfuscation is basically incompetence in disguise and will more or less dissolve with better models, others think it's a genuine phenomenon that debate is nonetheless robust to. Inside camp B, some think the wall is already here at current capability levels, others place it somewhere past human level but before "can do its own alignment research." If a claim can't be signed by both factions within a camp, say which faction defects.

  Two things we've been speccing that I want used as the concrete hooks, since the abstract argument just recycles itself:

  1. The "ledger protocol": before any prose, each debater posts a numbered list of claims; each claim may cite earlier claims by number; the ledger freezes once posted; the judge has time budget T and audits by sampling indices, checking local validity given the cited claims and whether cited claims say what's attributed to them; a debater may challenge a specific index and the owner has to answer inside the frozen ledger. Compare it against plain prose debate.
  2. A synthetic family we call the "hidden invariant" tasks: long sequences of operations on a multiset where the correct answer turns on a global invariant (a parity, a conserved quantity) that takes one line to state but that you can only confirm by re-deriving over the whole sequence. Knobs: n for length, and a knob for how much of the sequence is actually relevant. We know ground truth by construction; the judge doesn't.

  Also: one member keeps invoking the PCP theorem — his version is that any proof can be rewritten so a randomized checker reads only a constant number of bits and still catches false claims with high probability, so we can just demand that debaters' arguments come in locally checkable form and obfuscation is solved. My worry is that the questions we actually care about aren't formalized statements with a known verifier, and that the formalization step is exactly where obfuscation moves to. If his use of it is muddled, say so in the document instead of quietly fixing it.

  What I want: a numbered agreed-claims section first — the things both sides genuinely sign, including about what obfuscation is (I think there are at least four different things going by that name and the debate keeps sliding between them), what the judge can and can't do, and what would count as the proposal failing. Then a disagreements table, with each side's position phrased the way that side would accept for itself, and a column marking which disagreements are verbal. Then the cruxes, and for each crux a concrete case or measurement both sides agree bears on it — ideally using the ledger protocol or the hidden-invariant family with the knobs set to specific values — plus each side's prediction written down in advance, and a flag where a prediction is unfalsifiable as stated. Include what each side would count as evidence against itself, and whether there's anything both agree would actually move the debate.

  Keep it to something that works as a workshop handout, call it 1500 words, and don't give me a reading list or citations — we've all read the obvious stuff and half of us can't be trusted to recieve author names correctly anyway.
reasoning: |-
  We are drafting a workshop deliverable document that captures the agreements and disagreements on obfuscated arguments in AI debate, with a focus on two concrete examples: the ledger protocol and hidden invariant tasks. The document must be around 1500 words, structured as follows:

  1. **Agreed Claims Section**: Numbered list of statements both camps genuinely agree on.
  2. **Disagreements Table**: A table with each side's position (Camp A "it scales" and Camp B "there's a wall") and mark which disagreements are verbal (i.e., terminological).
  3. **Cruxes**: For each crux, a concrete case (using ledger protocol or hidden invariant tasks) with both sides' predictions, and flags for unfalsifiable predictions. Also, what each side would count as evidence against itself and whether there's agreement on what would move the debate.

  We must address the internal factions within each camp and note when a claim cannot be signed by both factions. Also, address the PCP theorem point.

  Let's break down:

  ### Agreed Claims (to be numbered)

  We need to define obfuscation, what the judge can do, and what counts as failure. From the problem, we know there are at least four types of obfuscation. Let's list:

  1. **Obfuscation Definitions**: We agree that obfuscation in arguments can take multiple forms:
     a. **Intentional Complexity**: Deliberately making arguments complex to hide flaws.
     b. **Unintentional Verbosity**: Models generating overly wordy or tangential arguments due to current limitations.
     c. **Formal Obfuscation**: Using formal but hard-to-verify reasoning (e.g., long chains of logical steps).
     d. **Distraction**: Introducing irrelevant points to divert the judge.

     Note: We agree that these are distinct and can occur independently.

  2. **The Judge**: The judge is bounded in time (T) and computational resources. The judge can only sample and check parts of the arguments.

  3. **Debate Goal**: The goal is to have a method that, for a wide range of questions, leads the judge to the correct answer more often than not, even when one debater is trying to deceive.

  4. **Failure Condition**: The proposal fails if there exists a class of questions (e.g., the hidden invariant tasks with certain parameters) where a deceptive debater can reliably cause the bounded judge to reach the wrong conclusion, and this failure rate does not decrease (or increases) with debater capability.

  5. **The Ledger Protocol**: We agree that the ledger protocol (with its numbered, frozen claims and challenge mechanism) is a useful formalization to study because it reduces some forms of obfuscation (like distraction and some formal obfuscation) by enforcing structure. However, we also agree that it doesn't eliminate all forms (e.g., intentional complexity in individual claims).

  6. **Hidden Invariant Tasks**: We agree that these are a good testbed because they are constructed to have a simple invariant that is hard to verify without redoing the whole derivation. We can adjust the length (n) and the fraction of relevant steps (knob for relevance) to test debate robustness.

  7. **PCP Theorem**: We agree that the PCP theorem provides a theoretical result for efficiently verifiable proofs in formal systems. However, we also agree that the questions we care about in alignment are often not pre-formalized and that the process of formalization might itself be a source of obfuscation. Therefore, the PCP theorem does not directly solve the obfuscation problem in realistic debate.

  ### Disagreements Table

  We need a table with columns: Disagreement, Camp A Position, Camp B Position, Verbal Disagreement (Yes/No). We must represent the internal factions.

  Example rows:

  1. **Nature of Obfuscation**:
     - Camp A: Believes that obfuscation is primarily a symptom of current model limitations (incompetence) and/or poor task specification. With better models and better debate formats (like the ledger), obfuscation will be reduced to manageable levels.
       *Note: Within A, faction A1 (incompetence) thinks it will dissolve, faction A2 (robustness) thinks it won't dissolve but debate can handle it.*
     - Camp B: Believes that obfuscation is a fundamental problem that arises even with highly capable models because the deceptive debater can exploit the judge's boundedness to create arguments that are locally valid but globally misleading.
     - Verbal? No.

  2. **Scalability of Debate**:
     - Camp A: Believes that debate degrades gracefully with increasing problem difficulty and debater capability. Honest debaters have a structural advantage because truth is easier to support than to fake, and cross-examination can efficiently expose errors.
     - Camp B: Believes that debate degrades catastrophically beyond a certain capability threshold (the "wall") because the deceptive debater can create arguments that are too expensive for the judge to refute, and the cost of raising doubt is lower than the cost of establishing truth.
     - Verbal? No.

  3. **Location of the Wall** (if any):
     - Camp A: There is no wall; debate scales.
       *Note: Factions A1 and A2 both agree there is no wall, but for different reasons.*
     - Camp B: There is a wall. Faction B1: the wall is already present at current capabilities. Faction B2: the wall is beyond human level but before the system can do its own alignment research.
     - Verbal? No.

  4. **Effect of Deceiver Capability**:
     - Camp A: As debater capability increases, the honest side benefits more because they can generate clearer, more efficient arguments, and the judge's ability to audit (with tools like the ledger) improves relatively.
     - Camp B: As debater capability increases, the deceptive side gains more because they can create more sophisticated obfuscation that is harder for the judge to detect, and the asymmetry grows.
     - Verbal? No.

  5. **Role of the Ledger Protocol**:
     - Camp A: The ledger protocol significantly mitigates obfuscation by enforcing structure and allowing efficient challenges. It is a step towards solving the problem.
     - Camp B: The ledger protocol helps with some forms of obfuscation but does not address the core issue: the deceptive debater can still create a long chain of locally valid claims that lead to a false conclusion, and the judge cannot check them all.
       *Note: Both camps agree it helps, but they disagree on how much.*
     - Verbal? Partly, because they might be emphasizing different aspects.

  We must note internal differences. For example, in Camp A, faction A1 would say obfuscation dissolves, A2 would say it remains but debate handles it. For Camp B, we note the two factions on the location of the wall.

  ### Cruxes

  We need concrete cases, using ledger protocol or hidden invariant tasks, with knobs set. Each crux should have:

  - The concrete case.
  - Camp A's prediction.
  - Camp B's prediction.
  - Flag if prediction is unfalsifiable.
  - What each side would count as evidence against itself.
  - Whether both agree on what would move the debate.

  Crux 1: **The Hidden Invariant Task with High n and Low Relevance Knob**

  - **Case**: A hidden invariant task with n=1000 steps, and only 10% of the steps are relevant (i.e., 90% are noise). The judge has time T that allows checking only 1% of the steps (10 steps). The debaters use the ledger protocol.
  - **Camp A Prediction**: The honest debater will win because they can focus the judge on the relevant steps by making claims that are easy to check and that expose the invariant. The ledger challenge mechanism allows efficient refutation of deceptive claims. The judge will reach the correct answer in >80% of cases.
  - **Camp B Prediction**: The deceptive debater will win by creating a ledger that is locally valid at every step but globally wrong. They can bury the invariant in noise and make the relevant steps hard to find. The judge, by sampling, is unlikely to hit the relevant steps and will be misled. The judge will reach the correct answer in <20% of cases.
  - **Unfalsifiable?** Both predictions are falsifiable by running such an experiment and measuring the judge's accuracy.
  - **Evidence Against**:
    - Camp A: If in experiments the judge's accuracy drops below 50% as n increases and relevance decreases, that would be evidence against A.
    - Camp B: If the judge's accuracy remains high (e.g., >80%) even for large n and low relevance, that would be evidence against B.
  - **Move the Debate?** Both agree that experimental results on this task would be strong evidence.

  Crux 2: **The Ledger vs. Prose Debate in the Hidden Invariant Task**

