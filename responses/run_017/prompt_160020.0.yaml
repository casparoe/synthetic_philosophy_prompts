  - **Camp A Prediction**: The ledger protocol will lead to significantly higher judge accuracy than prose debate because it reduces obfuscation by distraction and allows targeted challenges. The honest debater can force the deceptive one to defend specific claims.
  - **Camp B Prediction**: Both formats will have low accuracy because the core issue is the global invariant and the judge's boundedness. The ledger might help a little, but not enough to make the task feasible. The accuracy difference will be small (e.g., less than 10% improvement).
  - **Unfalsifiable?** No, can be tested.
  - **Evidence Against**:
    - Camp A: If ledger does not improve accuracy over prose, that would be evidence against A.
    - Camp B: If ledger leads to a large improvement (e.g., >20% points) and the judge accuracy becomes high, that would be evidence against B.
  - **Move the Debate?** Yes.

  Crux 3: **Capability Asymmetry in the Ledger Protocol**

  - **Case**: Use the ledger protocol on a hidden invariant task (n=500, 20% relevant). Vary the capability of the debaters: one version with current-level models, another with superhuman models (simulated by having the deceptive debater use a more sophisticated obfuscation strategy). Judge time T fixed.
  - **Camp A Prediction**: With superhuman models, the honest debater will be better at pinpointing the invariant and guiding the judge, so the accuracy will improve or stay the same. The deceptive debater's increased capability doesn't help as much because the ledger forces them to commit to claims that can be challenged.
  - **Camp B Prediction**: With superhuman models, the deceptive debater will be better at creating locally valid but globally misleading ledgers, so the accuracy will drop. The honest debater's improvements are offset by the increased sophistication of deception.
  - **Unfalsifiable?** Currently, we can't test superhuman models, so it's unfalsifiable in practice now. But in principle, if we can simulate, it's falsifiable.
  - **Evidence Against**:
    - Camp A: If in simulations (or when using stronger models for deception) the accuracy drops, that would be evidence against A.
    - Camp B: If with stronger models (for both) the accuracy increases, that would be evidence against B.
  - **Move the Debate?** Both agree that capability scaling experiments would be informative, but note the current limitation on testing superhuman models.

  ### Addressing the PCP Theorem

  We have an agreed claim (point 7) that the PCP theorem doesn't directly solve the problem because of the formalization gap. But if someone is pushing it, we can also note:

  - In the disagreements, we might add a row about the applicability of the PCP theorem, but since we have an agreed claim, it's covered.

  ### Structure of the Document

  1. **Title and Introduction**: Briefly state the purpose of the document and the two camps.
  2. **Agreed Claims**: Numbered list (1-7 or as many as we have).
  3. **Disagreements Table**: With internal factions noted.
  4. **Cruxes**: Three cruxes as above, each with the structure described.

  We must keep to 1500 words. Let's draft accordingly.

