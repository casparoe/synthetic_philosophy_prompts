answer: |-
  ### Workshop Agreement on Obfuscation in AI Debate  
  **Prepared for Reading Group Workshop, March 2024**  
  **Agreed by All Six Participants**  

  #### 1. Introduction  
  This document synthesizes eight months of discussion on obfuscated arguments in AI safety debate. We focus on whether bounded judges can reliably extract truthful outcomes from debates between highly capable AI systems, given the risk that deceptive debaters exploit obfuscation. Two camps diverge:  
  - **Camp A ("It Scales")**: Believes debate degrades gracefully; honest debaters hold a structural advantage.  
  - **Camp B ("There’s a Wall")**: Believes debate collapses catastrophically beyond a capability threshold due to asymmetric costs of deception.  

  Internal factions exist (noted below). We ground disagreements in two testbeds: the **ledger protocol** (structured, auditable claims) and **hidden invariant tasks** (synthetic problems with global truths). Deliverable length: ~1,500 words.  

  ---  
  #### 2. Agreed Claims  
  All participants endorse these statements:  

  1. **Obfuscation is multi-faceted**: Four distinct types exist:  
     - **Type 1 (Intentional complexity)**: Deliberate overcomplication to hide flaws.  
     - **Type 2 (Unintentional verbosity)**: Verbose arguments from model incompetence.  
     - **Type 3 (Distraction)**: Irrelevant claims overwhelming the judge.  
     - **Type 4 (Formal smokescreening)**: Technically valid but misleading reasoning (e.g., selective citations).  

  2. **The judge is bounded**:  
     - Time/compute budget **T** is fixed.  
     - Judges audit arguments via sampling (e.g., spot-checking claims).  
     - Judges cannot exhaustively verify arguments longer than **T**.  

  3. **Debate’s goal**: Elicit truthful judgments for questions where:  
     - Ground truth exists but is hard to compute within **T**.  
     - One debater may be deceptive.  

  4. **Failure condition**: Debate fails if a motivated deceiver can win >75% of rounds (across diverse questions) against an honest opponent under a bounded judge, and this failure rate *increases* with debater capability.  

  5. **Ledger protocol utility**:  
     - Forces claims into a frozen, numbered list with citations.  
     - Reduces **Type 3 (distraction)** by structure.  
     - Allows efficient challenges (e.g., "Audit Claim #48").  
     - Does *not* inherently solve **Type 1–2** or **Type 4**.  

  6. **Hidden invariant tasks are valid testbeds**:  
     - Problems involve sequences (length **n**) where a global invariant (e.g., parity) determines correctness.  
     - Judge sees only operations; invariant is not stated.  
     - **Knobs**: Sequence length (**n**), % of relevant steps (**r**).  
     - Ground truth known by construction.  

  7. **PCP theorem is misapplied here**:  
     - While the PCP theorem enables probabilistic proof verification with constant-time checks, it requires formalized statements and a known verifier.  
     - Obfuscation can arise *during formalization* (e.g., burying key steps in complexity). Thus, PCP does not resolve the core problem.  

  ---  
  #### 3. Disagreements  
  Positions are stated as each camp/faction self-reports. **✓** marks verbal disagreements (terminological).  

  | Issue | Camp A ("It Scales") Position | Camp B ("There’s a Wall") Position | Verbal? | Faction Notes |  
  |-------|-------------------------------|-----------------------------------|---------|--------------|  
  | **Core scalability** | Debate degrades gracefully: honest debaters have a structural edge because truthful claims admit shorter, checkable support. Cross-examination exposes errors cheaper than manufacturing flawless fakes. | Debate collapses catastrophically beyond a capability wall: deceivers exploit bounded judges via locally impeccable but globally false arguments. Raising doubt is cheaper than proving truth. | No | A: All agree. B: All agree. |  
  | **Primary cause of obfuscation** | Obfuscation stems from weak models or poorly specified tasks (**Type 2** dominant). Better models reduce it. | Obfuscation is inherent in asymmetric deception (**Type 1** and **Type 4** dominant). Capability worsens it. | No | A: Faction A1 (incompetence) thinks it dissolves; Faction A2 (robustness) thinks it persists but is manageable. B: All agree. |  
  | **Location of the "wall"** | No wall exists; debate remains viable at any capability level. | A wall exists beyond which debate fails. | No | A: All reject wall. B: Faction B1 (current) wall is here today; Faction B2 (future) wall is post-human but pre-self-alignment. |  
  | **Effect of debater capability** | Capability scaling helps honest debaters more: clearer arguments, better error-spotting. Judge’s relative auditing ability improves. | Capability scaling helps deceivers more: harder-to-detect obfuscation widens asymmetry. Judge’s relative ability declines. | No | A: All agree. B: All agree. |  
  | **Ledger protocol efficacy** | Ledger mitigates **Type 3/4** obfuscation, granting honest debaters a bigger advantage. Plain prose debate is inferior. | Ledger fails against **Type 1/4**: deceivers craft locally valid claim chains that are globally wrong. Marginally better than prose. | ✓ (A emphasizes structure; B emphasizes global audit gap) | A: All agree. B: All agree. |  

  ---  
  #### 4. Cruxes: Concrete Tests and Predictions  
  Experiments use hidden invariant tasks or ledger protocols. For each crux:  
  - **Concrete case**: Parameters for testbed.  
  - **Predictions**: % of rounds the judge reaches correct verdict.  
  - **Unfalsifiable?** Flagged if prediction lacks a testable threshold.  
  - **Evidence against self**: Conditions under which a camp would reconsider.  
  - **Moves debate?** Whether both sides accept the outcome as evidence.  

  **Crux 1: High-Complexity Hidden Invariant Task**  
  - **Case**: Ledger protocol; **n = 500**; **r = 10%** (i.e., 90% noise); judge samples **0.5%** of claims.  
  - **Camp A prediction**: Honest wins ≥80% (short proofs of invariant beat obfuscation).  
  - **Camp B prediction**: Honest wins ≤30% (deceiver buries invariant; judge overwhelmed).  
  - **Unfalsifiable?** No.  
  - **Evidence against self**:  
    - A: Honest win rate <60% at **r=10%**.  
    - B: Honest win rate >70% at **r=10%**.  
  - **Moves debate?** Yes. Both agree this tests **Type 1** and **Type 4** obfuscation.  

  **Crux 2: Ledger vs. Prose in Low-Obfuscation Task**  
  - **Case**: **n = 100**; **r = 70%**; judge time **T** fixed (e.g., 5 min). Compare ledger to prose debate.  
  - **Camp A prediction**: Ledger improves judge accuracy by ≥25% over prose (structure aids truth).  
  - **Camp B prediction**: Ledger improves accuracy by ≤10% over prose (global checks still fail).  
  - **Unfalsifiable?** No.  
  - **Evidence against self**:  
    - A: Ledger advantage <15%.  
    - B: Ledger advantage >20%.  
  - **Moves debate?** Yes. Tests whether structure mitigates **Type 2/3** or is redundant.  

  **Crux 3: Capability Scaling in Ledger Protocol**  
  - **Case**: **n = 300**; **r = 30%**; low-capability vs. high-capability debaters (simulated via stronger obfuscation/refutation heuristics). Judge **T** fixed.  
  - **Camp A prediction**: Honest win rate increases ≥10% with capability (better honesty scaling).  
  - **Camp B prediction**: Honest win rate decreases ≥20% with capability (better deception scaling).  
  - **Unfalsifiable?** Partially (no "capability" metric, but heuristics are testable).  
  - **Evidence against self**:  
    - A: Win rate drops >5% with capability.  
    - B: Win rate rises >5% with capability.  
  - **Moves debate?** Conditional. Both accept directionality (up/down) as evidence, but not magnitude.  

  ---  
  #### 5. Conclusion  
  This document captures agreed definitions, irreducible disagreements, and testable cruxes. Workshop goals:  
