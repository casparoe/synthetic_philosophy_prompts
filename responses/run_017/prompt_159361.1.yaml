  ### Diagnostic Instrument: Moral Uncertainty in Institutional Decision-Making  
  This decision tree helps institutions navigate moral uncertainty by branching through concrete cases. Participants answer numbered nodes (no philosophical jargon), leading to one of seven leaves (aggregation methods). Each leaf includes a one-line gloss and its most awkward commitment. Nodes force distinctions using the provided cases, and the tree exposes unoccupied cells (explained post-tree). The first three nodes address your cases: multi-trigger (D), risk-imposition asymmetry, and diachronic problem (E).  

  ---

  #### Decision Tree  
  *Start at Node 1. Answer each question based on institutional priorities.*  

  1. **In a structure where any one trustee can unilaterally approve a grant (e.g., five trustees; one enthusiast suffices to proceed), should each trustee demand stronger evidence of permissibility than they would if the decision required unanimity?**  
     - **Yes** → Go to 2  
     - **No** → Go to 2  

  2. **If a moral gamble (e.g., 50% chance of great good, 50% chance of moderate harm) would be permissible when risks fall solely on the institution, is it still permissible when risks fall entirely on third parties (e.g., grant recipients)?**  
     - **Yes** → Go to 3  
     - **No** → Go to 3  

  3. **When drafting a charter, should it aggregate moral uncertainty over the institution's *current* credences, or over a distribution of *future* trustees' credences (e.g., to insure against shifting moral views)?**  
     - **Current credences** → Go to 4  
     - **Future credences** → Go to 4  

  4. **A proposal has 85% credence of enormous good and 15% credence of being morally wrong (categorically or due to consequences). Proceed?**  
     - **Yes** → Go to 5  
     - **No** → Go to 6  

  5. **With $100M, 60% credence on near-term health, 30% on long-run risk reduction, and 10% on returning money as tainted, should you split funds between health and risk reduction?**  
     - **Yes** → **Leaf: Fractional compliance**  
     - **No** → Go to 7  

  6. **Is your refusal in Node 4 primarily because the act must be endorsable by *every* theory you give nontrivial credence?**  
     - **Yes** → **Leaf: Unanimity requirement**  
     - **No** → Go to 6.1  
     - *6.1: Is there a categorical prohibition (not merely bad consequences) in the 15%?*  
       - **Yes** → **Leaf: Categorical veto**  
       - **No** → **Leaf: Variance-averse hedging**  

  7. **Should you choose the act with the best worst-case performance across theories (e.g., avoid outcomes any theory deems catastrophic)?**  
     - **Yes** → **Leaf: Maximin across theories**  
     - **No** → Go to 8  

  8. **Should you maximize expected moral value across theories?**  
     - **Yes** → **Leaf: Expected-choiceworthiness maximization**  
     - **No** → Go to 9  

  9. **Should you follow the recommendation of the theory with your highest credence?**  
     - **Yes** → **Leaf: Deference to highest-credence theory**  
     - **No** → *Inconsistent; see scoring note.*  

  ---

  #### Leaves: Names, Glosses, and Awkward Commitments  
  Each leaf is an aggregation method. The most awkward commitment highlights a counterintuitive implication.  

  1. **Fractional compliance**  
     - *Gloss:* Split resources (e.g., funds, time, randomization) to partially satisfy multiple theories.  
     - *Awkward commitment:* May satisfy no theory fully (e.g., health intervention gets 60% funding, but its theory demands 100%).  

  2. **Unanimity requirement**  
     - *Gloss:* Only acts endorsable by every theory with nontrivial credence are permissible.  
     - *Awkward commitment:* Paralysis when theories disagree (e.g., no action if one theory forbids spending while others require it).  

  3. **Categorical veto**  
     - *Gloss:* Block acts deemed categorically impermissible by any theory above a credence threshold (e.g., >10%).  
     - *Awkward commitment:* A minor deontological credence (e.g., 15%) can veto high-expected-value acts.  

  4. **Variance-averse hedging**  
     - *Gloss:* Minimize risk of worst moral outcomes, even with high expected value.  
     - *Awkward commitment:* May reject "85% enormous good" proposals due to 15% catastrophe risk.  

  5. **Maximin across theories**  
     - *Gloss:* Choose acts with the best worst-case performance across theories.  
     - *Awkward commitment:* Favors "safe" acts (e.g., returning tainted money) over high-impact ones if any theory predicts catastrophe.  

  6. **Expected-choiceworthiness maximization**  
     - *Gloss:* Maximize expected moral value aggregated across theories.  
     - *Awkward commitment:* May require acts that a high-credence theory deems catastrophic if the net expectation is positive.  

  7. **Deference to highest-credence theory**  
     - *Gloss:* Follow the single theory with highest credence, ignoring others.  
     - *Awkward commitment:* Ignores 40% credence in alternatives (e.g., funds near-term health if credence=0.6, disregarding 40% supporting long-run risk or returning funds).  

  ---

  #### Unoccupied Cells in Logical Space  
  The tree reveals three unoccupied cells (combinations of answers without a corresponding leaf):  
  - **"No" at Node 9:** No method exists for those rejecting all seven options. This cell is **incoherent**—it denies any systematic approach to moral uncertainty.  
  - **"No" at Node 5 but Yes at Node 7:** Supports splitting resources only in non-splitting-compatible cases. **Unexplored**—no theory advocates partial splitting inconsistently.  
  - **"No" at Node 6.1 but categorical refusal in Node 4:** Rejects unanimity/categorical reasons but blocks acts without consequence-based risk. **Merely unattractive**—it implies moral risk aversion without a clear mechanism.  

  ---

  #### Scoring Note  
  - **Consistent participants** land on one leaf via unique paths (e.g., "No at Node 4 → No at Node 6 → Yes at Node 6.1" → *Unanimity requirement*).  
  - **Inconsistent answers** (e.g., "No" at Node 9) indicate unresolved views. Score these as "Unclassifiable" and review paths for contradictions (e.g., endorsing splitting in Node 5 but rejecting aggregation in Node 8).  
  - **Special cases (Nodes 1–3)** do not alter the leaf but refine interpretation:  
    - Node 1 "Yes" implies higher permissibility thresholds in multi-trigger settings.  
    - Node 2 "No" rejects imposing risks on outsiders.  
    - Node 3 "Future credences" favors charter designs that insure against shifting morals.  
    Score these separately for workshop analysis (e.g., "Deference + future credences").  

  This tree separates all leaves and embeds your cases. Use the $100M budget (A), one-shot charter vote (B), and unilateral approval (D) to test positions. For instance:  
  - *Fractional compliance* splits the $100M (Node 5 Yes).  
  - *Unanimity requirement* blocks the 85/15 proposal unless all theories endorse it (Node 6 Yes).  
  - *Categorical veto* blocks that proposal if the 15% is a categorical prohibition (Node 6.1 No).
