answer: |-
  ### What you need (~100 words)  
  You need: 18 prediction sheets (one per student, with 10 rounds: each round has spaces for prediction, explanation, and actual move); pens; a teacher’s master sheet with the Box’s pre-determined move sequence (e.g., A, B, C, A, B, C, A, B, C, A); a large reveal poster showing the mechanistic rule ("Cycle A→B→C→A..."); a whiteboard for displaying the Box’s move each round and tracking scores; and sticky notes for anonymous explanation sharing. No tech. The Box’s behaviour is a fixed cycle, unaffected by student inputs to ensure predictive parity. For the language model comparison, prepare a verbal analogy: "Imagine the Box was a trained neural net, not a hand-written rule."  

  ### Rules and scoring (~250 words)  
  **Objective**: Predict the Box’s move (A, B, or C) each round. Score points for accuracy, but explanations reveal how you interpret the Box.  
  **Phase 1 (Rounds 1–5)**:  
  - Each round, students write: (1) Prediction (A/B/C), (2) A one-line explanation **in mental terms only** (e.g., "It wants to confuse us," "It thinks we’ll choose A"). Mechanistic language (e.g., "It’s cycling") is banned.  
  - Teacher reveals the Box’s move (from the master sheet). Students record the actual move.  
  - **Scoring**: 1 point per correct prediction. Explanations aren’t scored but must comply with the mental-language rule. Non-compliant explanations lose 1 point (enforced by spot-checks).  
  **Phase 2 (Rounds 6–10)**:  
  - After Round 5, the mechanistic rule is revealed and displayed ("Cycle A→B→C→A...").  
  - Students again write predictions and explanations, but **no language restrictions**: they can use mental or mechanistic terms.  
  - Scoring continues as before.  
  **Winning**: Highest points win small prizes (e.g., chocolates). Points are purely for engagement—accuracy doesn’t favour mental/mechanistic stances due to predictive parity.  

  **CS fairness flag**: The mental-language rule may frustrate CS students who deduce the rule early. Reassure them this constraint is temporary and part of the experiment.  

  ### Timeline (~150 words, with minute marks)  
  - **0–5 mins**: Introduce rules. Emphasise Phase 1’s mental-language requirement. Hand out sheets.  
  - **5–25 mins**: **Rounds 1–5** (4 mins/round): Students write predictions/explanations (90 secs); teacher reveals move (30 secs); students record results. *Keep pace brisk*.  
  - **25–30 mins**: **Reveal the mechanistic rule**. Display poster. Briefly explain.  
  - **30–50 mins**: **Rounds 6–10**: Same as above. Observe if explanations shift.  
  - **50–55 mins**: **Tally scores**. Announce winners. Collect sheets.  
  - **55–60 mins**: **Language model beat**: Ask, "What if the Box was a trained AI, not this rule? Would your explanations change?" Note responses.  
  - **60–80 mins**: **Debrief** (see below).  

  ### Where the philosophy is (~250 words)  
  - **Rounds 1–5**: Students, lacking mechanistic insight, default to the **intentional stance** (Dennett): they attribute beliefs/desires ("It wants...") to predict behaviour. This mirrors how we interpret humans or AI—treating systems as agents with minds, even without evidence of "real" mental states.  
  - **Reveal (Round 6)**: The mechanistic rule embodies the **design stance**—predicting based on internal structure. Crucially, both stances achieve **predictive parity** (e.g., "It wants to cycle" and "It follows rule A→B→C" predict identically). This creates instrumentalism’s dilemma: if both work, can we call mental states "true," or are they just useful tools?  
  - **Rounds 6–10**: **Attributional inertia** emerges. Even with the rule, many students persist in mental language (e.g., "It still wants to cycle"), showing how the intentional stance resists disconfirmation. This highlights philosophy’s "hard problem": is mind-talk a pragmatic shortcut or a factual claim?  
  - **Language model beat**: Comparing the rule to a trained AI amplifies the stakes. If the Box were a neural net, its mechanism is opaque (no "rule" to see), making mental attributions feel more natural—yet the predictive utility remains identical. This exposes the blurred line between simulation and reality in AI discourse.  

  ### Debrief (~300 words)  
  Start by celebrating high scorers. Then:  
  1. **Sample explanations**: Share anonymous Phase 1 mental attributions (e.g., "It thinks we’re predictable"). Ask: "Did these feel necessary? Did they help?" Highlight how we anthropomorphise even simple systems.  
  2. **Predictive parity**: Stress that both stances predicted equally well. Pose: "If both work, why might we prefer one? Are the Box’s ‘wants’ real, or just a useful fiction?"  
  3. **Attributional inertia**: Reveal how many used mental terms in Phase 2 (e.g., "12 of you wrote ‘It wants...’ post-reveal"). Discuss: "Why is it so hard to drop mind-talk, even when you know the mechanism?" Link to how we treat AI (e.g., chatbots "understanding" us).  
  4. **Introduce the stances**: Name the intentional stance (agent-level predictions) and design stance (structural explanations). Note that the former is intuitive but risks over-anthropomorphism; the latter is precise but can feel "cold" for complex systems.  
  5. **Language model pivot**: Revisit the earlier question: "If the Box was a trained model, not a rule, would mental attributions be more justified? Or is it still just prediction?" Argue that opacity in AI (e.g., LLMs) intensifies attributional inertia—we *need* the intentional stance when mechanisms are unknowable.  
  6. **Bigger picture**: Conclude that this tension shapes AI ethics (e.g., if we attribute "intent" to AI, does it deserve rights?) and philosophy of mind (what counts as "real" understanding?). Challenge them: "Next week, we’ll see if this holds for human minds!"  

  ### What will go wrong (~200 words)  
  - **CS backlash**: CS students may resent the Phase 1 mental-language rule if they deduce the cycle early, seeing it as "philosophy bias." Mitigate by acknowledging this upfront: "It’s intentionally unfair to mirror how we anthropomorphise opaque systems."  
  - **Weak attributional inertia**: If >50% switch to mechanistic explanations post-reveal, the "inertia" point weakens. Hedge by focusing on those who persist ("Notice how X of you still used ‘wants’...").  
  - **Time crunches**: Rounds may overrun if explanations are overthought. Enforce strict timings; use a timer. Skip score tallies if behind.  
  - **Over-simplification gripes**: Students may call the cycle "too easy" or "unrealistic." Pre-empt: "Real AI has predictive parity too—GPT’s outputs can be described mentally or mechanically."  
  - **Disengagement**: Weak students may stop predicting if they score low. Keep scores visible on the board to sustain competition.  
  - **Language model misfire**: The analogy may feel tacked on. Weave it naturally into the reveal: "Many AIs are like this—trained, not programmed. Does that change anything?"  

  ### What the activity can’t show (~120 words)  
  The activity can’t prove that mental attributions are *always* persistent or useful—it only shows a controlled case. It doesn’t resolve whether intentional states are "real" in humans/AI; that requires deeper debate. The language model comparison is verbal, not experiential; I must bridge the gap with examples (e.g., ChatGPT’s opacity). Crucially, it can’t demonstrate that predictive parity fails for complex minds—I’ll need words to argue that human cognition may exceed instrumentalism. Finally, it doesn’t capture the emotional weight of mind-talk (e.g., empathy); I’ll emphasise this in debrief to avoid reductionism.
