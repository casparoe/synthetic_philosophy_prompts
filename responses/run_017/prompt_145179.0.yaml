prompt: |-
  I'm writing a term paper for a philosophy of medicine seminar, and before I commit to defending any one account of health and disease, I want the specification. Fix the purpose narrowly: the theory is to be used to decide whether a condition goes on a list that determines insurance coverage and research funding, so adequacy means adequacy for that classificatory job, not for everything.

  Please set out the desiderata such a theory must meet — the cases it has to classify, the distinctions it must not collapse (having a disease versus how serious it is; being unhealthy versus being badly off; disease versus injury; the health of an organism versus the health of its parts or of a trait), and the empirical results it must not contradict — each with the case or consideration that makes it a requirement, and each tagged as either non-negotiable or a preference of one camp.

  Three cases my seminar handout did not cover, and which I want the list to be tested against rather than stipulated around: (i) a heritable variant that lowers a statistically typical capacity but, in the environment its bearers actually live in, both extends their lives and raises their lifetime wellbeing; (ii) a population in which everyone receives the same intervention at birth that permanently lowers some capacity, so the lowered level becomes statistically typical and something no one is worse off for; (iii) an asymptomatic person some years before the onset of symptoms, where the question is whether health must be gradable at a time at all rather than only over a life — I suspect the answer to that one changes what several of the other requirements cost. Also please flag, as you go, which requirements secretly presuppose a theory of function, since I have not picked one.

  Then say which subsets of your requirements are, as far as you can tell, jointly unsatisfiable — if the list is itself a result, that is the part I most want — and which single requirement does the most work in excluding the standard contenders.

  Please use these sections, in this order: "Requirements" (about 700 words, numbered, each entry with its motivating case and its tag); "Conflicts" (about 250 words, on the jointly unsatisfiable subsets); "The binding constraint" (about 150 words, on the one requirement that rules out the most candidates and why); "Scorecard" (a compact table, under 200 words, scoring against your list only three views: a Boorse-style biostatistical naturalism, a Wakefield-style harmful-dysfunction hybrid, and a normativist view on which health consists in the ability to achieve one's vital goals). No citations or reading list — I can supply those myself.
reasoning: |-
  Okay, the user is writing a term paper on philosophy of medicine, specifically focusing on theories of health and disease for insurance and research funding classification. They need a structured analysis with specific sections: Requirements, Conflicts, Binding Constraint, and Scorecard. 

  First, I need to understand their core request. They want desiderata for a theory of health that's narrowly tailored for insurance/research listing purposes. The key differentiator is practicality—this isn't about metaphysical debates but operational classification. The three test cases (heritable variant, universal intervention, asymptomatic pre-onset) are crucial stress tests. 

  For the Requirements section, I consider building around classification needs. Non-negotiables include objective measurability (insurance can't use subjective wellbeing), temporal gradability (pre-symptomatic conditions matter for coverage), and harm necessity (to filter out benign traits). The function-theory dependency is tricky—I should flag where biological function assumptions creep in, like in typical part-contribution criteria. 

  The Conflicts section will reveal trade-offs. For example, the harm requirement clashes with statistical normality in the universal intervention case. I'll highlight how the harm-vs-statistical-typicality tension breaks most simple theories. 

  The Binding Constraint is clearly the harm requirement—it's what makes Boorse-style naturalism fail (no harm criterion) while also challenging normativism (if harm is too subjective). 

  For the Scorecard, I'll pit the three major theories against the requirements. Boorse fails on harm and the heritable variant case; Wakefield struggles with universal interventions; normativism flunks objectivity. The table will show why no existing theory perfectly fits the insurance use case. 

  Throughout, I'll remember the user's pragmatic framing: they need a tool, not a truth. The asymptomatic pre-onset case is pivotal—it forces the theory to handle future states, which insurance systems actually do (e.g., BRCA genes). I'll make sure to tag every functional assumption since they haven't committed to a function theory yet.
answer: |-
  ### Requirements for Insurance/Research Classification Theory  

  1.  **Objective Measurability (Non-negotiable)**  
      *Case:* Insurance/research systems require reproducible, third-party verifiable criteria. Subjective experiences (e.g., "vital goals") vary too widely for consistent application.  
      *Tag:* Non-negotiable. Presupposes *some* theory of biological function/structure for measurement anchors.  

  2.  **Harm Requirement (Non-negotiable)**  
      *Case:* Distinguishes disease (e.g., cancer) from benign variation (e.g., attached earlobes). A condition must cause *some* detriment to qualify for coverage/funding.  
      *Tag:* Non-negotiable. Defines the core link between dysfunction and societal resource allocation.  

  3.  **Temporal Gradability (Non-negotiable)**  
      *Case:* Asymptomatic pre-symptomatic states (e.g., early Huntington’s). Health status must be gradable *at a time* to enable preventative coverage and research into early interventions.  
      *Tag:* Non-negotiable. Rejects "health only over a life" views.  

  4.  **Non-Collapse of Severity (Non-negotiable)**  
      *Case:* Mild acne vs. metastatic cancer. The theory must allow classifying a condition *as* a disease while accommodating degrees of severity (impacting coverage extent, not eligibility).  
      *Tag:* Non-negotiable.  

  5.  **Distinction from General Badness (Non-negotiable)**  
      *Case:* Poverty vs. pneumonia. Must classify diseases as specific biological states, not all causes of suffering/loss. Insurance systems cover *medical* conditions, not all misfortunes.  
      *Tag:* Non-negotiable.  

  6.  **Distinction from Injury (Preference - Naturalist camp)**  
      *Case:* Congenital blindness (disease process) vs. traumatic limb loss (injury). While both may warrant coverage, etiological distinction matters for research categorization and preventative policy.  
      *Tag:* Preference. Presupposes a theory of function (intrinsic design vs. integrity).  

  7.  **Environment Relativity (Non-negotiable)**  
      *Case:* Sickle Cell Trait in malaria-endemic vs. non-endemic regions. Harm/benefit depends on environment. Coverage decisions must be context-sensitive.  
      *Tag:* Non-negotiable. Presupposes function is relative to *actual* environment.  

  8.  **Avoid Statistical Fetishism (Preference - Harm-Centric camp)**  
      *Case:* Universal intervention lowering capacity (iii). If everyone has a lowered capacity, it’s statistically typical but potentially harmful compared to a possible baseline. Harm, not mere statistical deviation, should drive classification.  
      *Tag:* Preference. Challenges pure statistical normality (Boorse).  

  9.  **Handle Beneficial "Dysfunction" (Non-negotiable)**  
      *Case:* Heritable variant lowering capacity X but increasing lifespan/wellbeing in actual environment (i). If net benefit exists, it shouldn’t be classified as a disease for coverage/funding, *even if* a function is statistically sub-typical.  
      *Tag:* Non-negotiable. Directly conflicts with pure biostatistical views.  

  10. **Organism-Level Focus (Preference - Naturalist camp)**  
      *Case:* Healthy liver in a terminally ill patient. Classifying the liver as "healthy" is biologically valid but irrelevant for patient coverage/research focus. The primary unit for *medical* classification is the whole organism’s functioning.  
      *Tag:* Preference. Presupposes theory of organismic function.  

  ---

  ### Conflicts  

  Several requirements are in tension:  

  *   **Harm (2) vs. Statistical Normality (implicit in some naturalism):** Conflicts in cases (i) and (ii). The universal intervention (ii) creates statistical normality but potential harm relative to an uninjured state. The beneficial variant (i) might be statistically atypical but beneficial. Harm Requirement (2) and Beneficial "Dysfunction" (9) prioritize harm/benefit over statistics, conflicting with views requiring statistical deviation.  
  *   **Harm (2) vs. Objective Measurability (1):** Defining "harm" objectively is contentious. Normativist views (vital goals) fail (1), while hybrid/naturalist views must anchor harm biologically, risking circularity or missing socially relevant harms.  
  *   **Temporal Gradability (3) & Asymptomatic States vs. Harm Requirement (2):** If harm requires *manifest* negative effects, pre-symptomatic states (where dysfunction exists but harm hasn’t accrued) might not qualify. A theory must define harm to include *increased risk* of future negative effects.  
  *   **Organism-Level Focus (10) vs. Gradability of Parts (implicit):** Strict organism-level focus might struggle to neatly classify localized, asymptomatic dysfunctions (e.g., very early tumor) without reference to part-function.  

  **Joint Unsatisfiability:** A theory satisfying *strict statistical deviation* (à la Boorse), *non-circular objective harm*, *context-sensitivity (7)*, *beneficial dysfunction exclusion (9)*, and *avoiding statistical fetishism (8)* simultaneously is likely impossible. (9) and (8) directly undermine pure statistical views, while objective harm is elusive.

  ---

  ### The Binding Constraint  

  **The Harm Requirement (2)** is the most exclusionary. It:  
  1.  **Eliminates Pure Biostatistical Theories (Boorse):** They lack any harm criterion, failing to exclude benign variations (violating 2) or include harmful-but-statistically-typical conditions (like universal intervention - ii).  
  2.  **Challenges Pure Normativist Theories:** They define harm via subjective goals/virtues, violating Objective Measurability (1).  
  3.  **Complicates Hybrid Theories (Wakefield):** Requiring objective "dysfunction" *plus* harm forces a contentious theory of biological function to ground "dysfunction" objectively. Defining "harm" non-subjectively remains difficult.  
  It forces the theory to bridge the "is" of biology and the "ought" of resource allocation, the core challenge for *this* purpose.

  ---

  ### Scorecard  

  | Requirement                     | Boorse (Biostatistical) | Wakefield (Harmful Dysfunction) | Normativist (Vital Goals) |
  | :------------------------------ | :---------------------- | :------------------------------ | :------------------------ |
  | **1. Objective Measurability**  | Excellent               | Good (Dysfunction?)             | Poor                      |
  | **2. Harm Requirement**         | **FAIL** (None)         | Good                            | Good                      |
  | **3. Temporal Gradability**     | Good                    | Good                            | Ambiguous                 |
  | **4. Severity Non-Collapse**    | Good                    | Good                            | Good                      |
  | **5. ≠ General Badness**        | Good                    | Good                            | **FAIL** (Collapses)      |
  | **6. ≠ Injury (Pref.)**         | Good                    | Problematic (Injury=Harm?)      | Poor                      |
  | **7. Environment Relativity**   | Poor (Fixed reference)  | Moderate (Env. affects harm)    | Good                      |
  | **8. Avoid Stat. Fetishism**    | **FAIL**                | Moderate (Harm overrides stat?) | Good                      |
  | **9. Beneficial "Dysfunction"** | **FAIL** (Classifies)   | **FAIL?** (If dysfunctional)    | Good                      |
  | **10. Organism Focus (Pref.)**  | Good                    | Good                            | Poor                      |

  **Key:**  
  *   **Boorse:** Fails core Harm Requirement (2, 8, 9), excels in objectivity (1).  
  *   **Wakefield:** Struggles with objectivity of dysfunction (1), beneficial variants (9), and potentially universal interventions (8). Handles harm (2) well.  
  *   **Normativist:** Fails objectivity (1) and collapses health with general wellbeing (5). Handles environmental/beneficial cases (7, 9) well.
