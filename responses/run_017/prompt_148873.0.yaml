prompt: |-
  I've been reading about futarchy — the idea that you vote on values but bet on beliefs, i.e. you settle on some welfare metric by ordinary voting and then let prediction markets pick whichever policy actually scores best on it — and I want to try running it over something real: the 2016 Brexit referendum.

  I'll stipulate the facts so you don't have to go looking. Cameron called an in/out referendum mainly to settle a decades-long fight inside the Conservative party and to see off UKIP. The ballot was one binary question. Leave won, roughly 52-48, on a turnout in the low 70s. Sterling dropped hard overnight, Cameron resigned within hours, and then came about three years of parliamentary paralysis — a big part of which was that nobody had ever agreed what "Leave" meant: Norway/EEA-style membership, a WTO-terms hard exit, or something in between. Gently correct anything I've mangled, but please don't let the analysis hang on a detail I've misremembered.

  What I want is the two-way case analysis, done carefully rather than impressionistically:

  1. The mapping. Who the players actually are in futarchy's terms (the electorate? MPs? the betting public? the EU, which also gets to move after the UK does?), what the option space is, and — the hard part — what the metric is. I'd rather propose one than dodge it, so here's mine: real household disposable income per head five years out, scored against a synthetic-control UK built from a basket of similar economies, so we're comparing Britain to what it plausibly would have looked like had it stayed rather than to its own past. Is that metric even workable? Say specifically what breaks about it.

  2. What futarchy says the actors faced and should have done — what the conditional market would have looked like in 2016, who'd have been in it, and whether its price deserved any authority.

  3. Where the model explains the episode and where it misdescribes it. The bit I keep circling: futarchy assumes the options are specified well enough to be priced, and "Leave" wasn't. Is that a case the theory simply never anticipated, or a badly run vote that futarchy would have fixed by forcing specification up front?

  4. The reverse direction — what the episode teaches about futarchy. My suspicion is the real lesson isn't about market accuracy at all but about legitimacy: a lot of what the referendum was doing was expressive, or was a fight about who gets to decide, and a price can't deliver that. Give me the strongest version of the opposite view too.

  Also, and this matters: keep separated what's genuinely settled among people who work on prediction markets and mechanism design from what's contested — whether these markets are actually well calibrated, whether a welfare metric is politically agreeable at all, whether futarchy has any shot outside a narrow domain. Don't dress up a contested position as the consensus, and flag where you're extrapolating past what the literature really covers.
reasoning: |-
  Okay, let's tackle this futarchy analysis of Brexit step by step. The user wants a rigorous two-way case study, so I need to structure this carefully. 

  First, the welfare metric they proposed - real household disposable income per head against a synthetic control - is clever but has issues. The synthetic control problem is real: finding comparable economies without UK-specific shocks is messy. And five years? That barely covers the transition period. The 2021 COVID shock alone would've tanked that counterfactual. Plus, distributional effects matter - London bankers vs. Northern factory workers would experience Brexit differently.

  The option space problem screams at me. "Leave" wasn't a policy but a Rorschach test - Norway model advocates and WTO hardliners were betting on entirely different outcomes. Prediction markets can't price undefined variables. I recall Robin Hanson's original paper assumed well-defined policies, which this violated spectacularly.

  On legitimacy... that's the deep cut. The referendum was always about sovereignty theater - that "take back control" slogan can't be quantified. A market saying "Remain yields +3% GDP" wouldn't have moved Leavers because their utility function included non-economic variables. But maybe futarchy could've forced specificity? If Cameron had been required to define "Leave" options with concrete terms before the vote, the 2016-2019 paralysis might not have happened. That's the strongest counterargument: futarchy as specification discipline.

  Need to flag where the literature is thin. There's consensus that markets aggregate information well in lab settings, but real-world policy markets? Thin trading and manipulation fears are legit concerns. And the big unanswerable: would anyone trust a "Brexit impact market" run by, say, Goldman Sachs? The legitimacy gap might be fatal regardless of accuracy.

  The user's clearly read their Hirschman - this is voice vs. exit as much as welfare optimization. Should emphasize that futarchy's blind spot is expressive voting. Maybe close with Tetlock's finding that markets beat pundits on forecasting, but stress that Brexit wasn't really a forecastable event - it was a constitutional crisis masquerading as a policy choice.
answer: |-
  Here's a rigorous futarchy case analysis of the 2016 Brexit referendum, structured as requested, with clear boundaries between settled knowledge, contested claims, and necessary extrapolations:

  ### 1. Mapping Futarchy onto Brexit
  - **Players:**  
    - *Value Voters:* The UK electorate (via referendum).  
    - *Belief Betting:* Prediction market participants (likely: institutional investors, hedge funds, academics, politically engaged public – *not* the general electorate).  
    - *Policy Implementers:* UK Government/Cabinet (executing "Leave"), with the EU as a reactive constraint-setter.  
  - **Option Space:**  
    - *As Run:* Fatally underspecified. "Leave" was not a policy but a *direction*, encompassing mutually exclusive outcomes (EEA, Canada+, WTO, bespoke deal). Futarchy requires **discrete, executable policies**.  
    - *Required for Futarchy:* Defined alternatives (e.g., "Leave via EEA Membership", "Leave via WTO Terms", "Remain in EU").  
  - **Welfare Metric:**  
    - *Your Proposal:* Real median household disposable income (RHDI) per head, 5 years out, vs. synthetic control UK.  
    - **Why it Breaks:**  
      - *Synthetic Control Validity:* Constructing a credible "UK without Brexit" counterfactual from similar economies (e.g., Germany, France, US, Australia) is highly contestable post-2016. Global shocks (COVID, Ukraine war, 2018 US tax cuts) dominate variance, drowning out Brexit's signal.  
      - *Distributional Blindness:* Median income masks massive regional/class disparities (e.g., London finance vs. Midlands manufacturing). Brexit's *distributional* impact was politically pivotal.  
      - *Non-Income Values:* Sovereignty, immigration control, regulatory autonomy – key Leave motivators – are excluded.  
      - *Timing:* 5 years (2021) captures only the *transition* chaos (COVID overlap), missing long-term structural effects.  
    - *Workable Alternative?* Not ideal, but **real GDP per capita growth differential vs. EU27 average** is more tradable (less noisy data, consensus proxy for prosperity). Still omits non-economic values.

  ### 2. Futarchy's Prescription for 2016
  - **Conditional Market Structure:**  
    - Markets for each *defined policy* (Remain, EEA, WTO Hard Brexit) conditional on referendum outcome.  
    - Metric: e.g., "UK GDPpc growth diff. vs EU27, 2021."  
    - Trading window: Post-referendum announcement, pre-Article 50 trigger.  
  - **Likely Market Behavior (Based on 2016 Predictions/Data):**  
    - **Remain:** Market prices high probability of matching/slightly outperforming EU27 (pre-ref consensus).  
    - **EEA:** Prices moderate negative shock (single market access retained, but uncertainty & lost influence).  
    - **WTO ("Hard Brexit"):** Prices severe short-term drop (per BoE, IMF, HMT forecasts of immediate recession + long-term 4-8% GDP loss).  
  - **Futarchy's "Should Have Done":**  
    - If "Leave" wins, the market identifies the *specific Leave variant* with the highest price (likely EEA). The government *must* implement that policy.  
  - **Market Authority:**  
    - *Settled Strength:* Markets efficiently aggregate dispersed information (Hayek, 1945). Pre-ref betting markets (e.g., Betfair) accurately priced ~30% Leave probability vs. polls showing 50/50.  
    - *Contested Weakness:* Thin policy-specific markets may be manipulable or dominated by biased money (e.g., hedgies with Brexit positions). Calibration evidence for *policy* markets is sparse vs. event/decision markets.

  ### 3. Where Futarchy Explains vs. Misdescribes Brexit
  - **Explains:**  
    - **Specification Failure:** Futarchy highlights that "Leave" was not an implementable policy. The 2016-2019 paralysis stemmed directly from this underspecification – futarchy would have forced clarity *before* the vote.  
    - **Belief Aggregation:** Markets would have revealed expert consensus that "Hard Brexit" was economically harmful, potentially steering implementation toward EEA.  
  - **Misdescribes:**  
    - **Expressive Voting:** Futarchy assumes voters *only* care about welfare metrics. But Brexit voting correlated with cultural identity/anti-elitism (Sobolewska & Ford, 2020) – values markets can't capture.  
    - **EU as Strategic Actor:** Futarchy treats policies as static. The EU's refusal to allow "cherry-picking" (e.g., rejecting EEA without FoM) made some "Leave" options infeasible – markets couldn't price this reactive constraint.  
    - **Is it "Unanticipated" or "Fixable"?**  
      Futarchy *assumes* options are feasible/well-defined (Hanson, 2013). Brexit shows this isn't trivial. **Futarchy would have fixed it** by requiring defined policies *ex-ante*. The failure was in vote design, not futarchy's logic.

  ### 4. What Brexit Teaches About Futarchy
  - **Your Suspicion (Legitimacy > Accuracy):**  
    **Strongly Validated.** Brexit was a "voice" revolt against perceived loss of control (Goodhart, 2017). A market dictating "EEA" because it scores +0.5% GDP vs. WTO would *not* satisfy Leavers wanting sovereignty or Remainers feeling robbed. The **expressive/identity deficit** is futarchy's fatal flaw for highly salient, values-driven choices.  
  - **Strongest Counterargument (Accuracy Forces Accountability):**  
    If futarchy had forced May's government to implement the market-selected "Leave" variant (EEA), it would have:  
    - Avoided the 2019 "Hard Brexit" bait-and-switch.  
    - Prevented no-deal brinkmanship (economically catastrophic).  
    - Created accountability: Voters could judge *actual* EEA outcome vs. market prediction.  
    *Evidence:* Prediction markets' superior forecasting track record vs. pundits (Tetlock, 2017) suggests better decisions emerge when beliefs are priced.  
  - **Broader Lessons:**  
    - **Settled:**  
      - Markets beat polls/experts for forecasting *binary events* (e.g., "Leave wins?").  
      - Underspecified options destroy decision quality.  
    - **Contested:**  
      - Whether policy markets can be *liquid/manipulation-resistant* at scale (Caplan, 2007).  
      - Whether a *single welfare metric* is politically feasible (e.g., GDP vs. equality vs. sovereignty).  
    - **Extrapolation (Beyond Literature):**  
      Futarchy likely fails for **constitutional/identity issues** (Brexit, independence votes) where process/sovereignty dominate outcomes. It *may* work for technical policies (infrastructure, monetary policy) with clear metrics.

  ### Key Takeaways
  - **Futarchy's Brexit Test:** It would have exposed the referendum's fatal underspecification, potentially averting paralysis by forcing defined options.  
  - **Core Flaw Exposed:** Markets optimize *specified metrics*, but democratic crises often stem from *unquantifiable values* (sovereignty, fairness).  
  - **Domain Limitation:** Works best for low-saliency, technical decisions with consensus metrics (e.g., setting interest rates). Highly politicized, identity-laden choices like Brexit reveal its legitimacy gap.  
  - **Literature Gaps:** Real-world evidence for *conditional policy markets* remains thin – most research focuses on elections or binary outcomes, not complex policy bundles.

  This analysis underscores that Brexit wasn't a failure of prediction *per se* (markets knew Leave could win), but a failure to define *what winning meant*. Futarchy fixes the latter but cannot resolve deeper conflicts over what constitutes "welfare."
