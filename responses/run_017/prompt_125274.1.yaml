answer: |-
  Look, you're missing the point of what conditional information *does*. When the radio says "if Friendly, then Second", it's not asserting some global fact - it's instructing Judy to *restrict her attention* to Friendly worlds and align them with Second. So we move the .30 from F&H to F&S. Now P(F) is still .60. Then "if Friendly, then HQ" comes in. Same deal: in the Friendly worlds, she must align with HQ. So the .60 on F&S? We move it *back* to F&H! The mass just oscillates. After call one: F&S .60, F&H .00, E&S .10, E&H .30. After call two: F&S .30, F&H .30, E&S .10, E&H .30. P(F) is .60. Always.

  Why shouldn't it bounce? Each call only constrains the *distribution within* Friendly territory. They're commands about subdomains, not contradictions. Your "ruling out" assumes the radio is asserting categorical facts about the world that conflict, but that's not how conditionals work in this account - they're *directives* for reallocating credence locally. It feels weird because you're smuggling in the material conditional interpretation. I bite the bullet: hearing both doesn't lower P(F) because neither call provides evidence *against* being in Friendly territory; they only reshape what Friendly would imply. P(Friendly) = .60. Quadrants: F&S .30, F&H .30, E&S .10, E&H .30.
