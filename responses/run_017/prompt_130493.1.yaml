    status: non-negotiable
    knocks_out: Highly abstract theories that require philosophical training to apply.
    conflicts_with: None.

  D3: Historical change without reduction.
    requirement: The theory must explain historical moral changes (e.g., practices once endorsed, now condemned) without reducing them to either "all variation is error" or "all variation is just preference".
    motivating_case: The abolition of slavery: a practice once widely accepted and now universally condemned in the same societies, without a clear new argument at the time of change.
    why_required: To avoid oversimplification and account for moral progress without dismissing past cultures as entirely wrong.
    status: non-negotiable
    knocks_out: Universalism (if it says past was all error) and relativism (if it says it's just preference change).
    conflicts_with: None.

  D4: Probe without impartiality assumption.
    requirement: The theory must interpret the group-membership probe without presupposing that impartiality is the correct moral standard. It must allow for the possibility that partiality (e.g., family loyalty) is a genuine moral value and not a distortion.
    motivating_case: In the care home dispute, applying the probe: if the mother-in-law were a stranger, would you still refuse care? But the family might say, "No, because family obligations are special." The theory must not automatically classify this as a distortion (c) but might recognize it as a value (a) if consistent.
    why_required: The probe must not beg the question by assuming impartiality is the only valid moral perspective.
    status: non-negotiable
    knocks_out: Theories that require impartiality (e.g., some deontological or utilitarian theories) and thus would always interpret a flip in the probe as distortion.
    conflicts_with: D5? Because D5 allows for moral progress, which might include moving toward impartiality.

  D5: Possibility of moral progress.
    requirement: The theory must allow that some moral disagreements are resolved by one side being wrong, enabling moral progress.
    motivating_case: The historical abolition of slavery: we now judge that slave-owners were wrong, and this represents moral progress.
    why_required: The classification must include type (d) and not reduce all disagreements to differences that are incommensurable.
    status: non-negotiable
