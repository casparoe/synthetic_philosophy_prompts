prompt: |-
  ok so context first: about three months ago I joined a tiny team that's writing the values/rubric doc for a model that ships in like fourteen countries, most of which none of us grew up in. we're not doing anything fancy, we basically have a list of scenario types and annotators in each country rate them, and we keep discovering that our "neutral" examples are dripping with the specific moral reflexes of the countries we did grow up in. it got personal for me a couple weeks ago: my partner's family thinks putting my mother-in-law in a care home would be a moral failure full stop, and my family thinks that refusing to do it *because of what the neighbours would say* is the actual moral failure. and I genuinely can't tell whether that gap is two different values, or a factual disagreement about what old people want, or one side being run by a bias about reputation. and I notice the same three options show up over and over in our annotation arguments.

  so. before we write any more of the doc I want the spec. I need a theory of how to *read* cross-cultural variation in folk morality — one that tells us, for any given disagreement, whether it's (a) a difference in values, (b) a difference in non-moral factual belief, (c) a distortion (in-group loyalty, disgust, social-desirability pressure, that sort of thing), or (d) a case where one side is just wrong in the way that makes moral progress possible. you're a professional philosopher who's spent real time on moral psychology and cross-cultural stuff — please think carefully and do some unstructured brainstorming about the space of possible readings before you commit to the list, then give me the finished thing.

  what I want is the desiderata: what any theory of this kind has to deliver to be good enough for *my* purpose, which is to hand a non-philosopher teammate a procedure they can run on a fresh disagreement we've never discussed, including who bears the burden of proof. for each desideratum give me the case or consideration that motivates it, and mark it non-negotiable vs. a preference of one camp. and please make the cases do the work — I don't want criteria stated in the abstract.

  a few things I specifically want you to deal with:

  - our own weird little finding: in our data, annotators from different countries mostly agree on the *ranking* of violations (everyone ranks causing someone physical pain above a loyalty breach) but disagree wildly on the *threshold* — where the line between "fine" and "not fine" sits, and how far outside the line a violation has to be before it's serious. call it ordinal agreement with threshold divergence. any theory that can only handle headline disagreements about *what* is wrong and not about *how much* is useless to me, so that has to be built in as a requirement, not bolted on.
  - a probe I made up and like, but don't trust yet: for any disputed case, re-run it with the group membership of the people involved swapped, so that the person who gains is now an out-group member and the person who loses is in-group. if the verdict flips, you're looking at something loyalty-shaped; if it holds, you're looking at something that's at least being applied impartially. I want a desideratum about what a theory owes verdicts that *fail* that probe — and I also want you to tell me if you think the probe is rigged or begs the question, because I have a nagging feeling it might smuggle in exactly the impartiality assumption I'm supposed to be testing.
  - the case type that haunts me: practices that nearly everyone in a society endorsed two hundred years ago and that almost nobody in that same society defends now, where the change didn't obviously come from a new argument. the theory has to be able to say something about that without either collapsing into "so all variation is just error" or "so all variation is just preference".
  - at least one demand that people make of theories like this which you think is actually a prejudice of one camp and should be thrown off the list. tell me whose.

  and: if some subset of your own desiderata can't be jointly satisfied, say so explicitly and explain the tension — that's honestly the part I most want, because if the list is internally unsatisfiable that changes what my team should even be trying to do. also tell me which single desideratum does the most work excluding otherwise-popular theories.

  no citations, no reading lists, no "see so-and-so 2014" — I can't chase them and I don't want them. plain prose for the thinking parts, then a short scorecard (a few lines, not an essay) of how the obvious contenders — variation-is-superficial-and-there's-one-true-morality, variation-is-just-different-values, debunking/error-theory flavours, and whatever constructivist or practice-dependent option you think belongs — do against the list. I care way more about the criteria than the scoring, so keep the scoring tight.

  give me the main deliverable as a single JSON object, schema:

  {
    "purpose": string,
    "desiderata": [ { "id": "D1", "requirement": string, "motivating_case": string, "why_required": string, "status": "non-negotiable" | "camp_preference", "knocks_out": [string], "conflicts_with": ["D4"] } ],
    "unsatisfiable_sets": [ { "ids": ["D2","D5"], "why": string } ],
    "most_exclusionary": { "id": string, "reason": string },
    "rejected_demands": [ { "demand": string, "verdict": string, "whose_prejudice": string } ],
    "scorecard": [ { "candidate": string, "one_line": string } ]
  }

  ids numbered in order, conflicts_with referencing ids in the same array, and if you want a field I didn't think of, add it. thanks — sorry this is long, we've been going in circles on it for weeks and I'd rather have something I can argue with than something that sounds finished.
reasoning: |-
  We are building a cross-cultural moral disagreement analysis framework. The goal is to classify any given moral disagreement into one of four types: (a) difference in values, (b) difference in non-moral factual beliefs, (c) distortion (like in-group bias), or (d) one side being wrong (allowing for moral progress).

  Key challenges from the user:
  1. They observe "ordinal agreement with threshold divergence": same ranking of violations but different thresholds for what counts as a violation and how serious it is.
  2. They have a probe: swap group membership (in-group/out-group) and see if the verdict flips. If it flips, it's loyalty-shaped (bias); if not, it's impartial. But they are worried this probe might beg the question by assuming impartiality is the norm.
  3. They want to handle historical moral changes (e.g., practices once widely accepted, now rejected) without reducing to either "all error" or "all preference".
  4. They want to reject at least one common demand on such theories that is actually a prejudice of one camp.

  Additionally, they want:
  - Desiderata with motivating cases, why required, and whether non-negotiable or camp preference.
  - Any unsatisfiable sets of desiderata and why.
  - The most exclusionary desideratum (which knocks out many theories).
  - A scorecard of candidate theories (one-line verdict per candidate).

  Candidate theories to consider (as per the user's hint):
  1. Universalism (one true morality): variation is superficial and there's an objective moral truth.
  2. Relativism (variation is just different values): moral truths are relative to cultures.
  3. Error theory/debunking: moral judgments are largely distorted by non-moral factors (e.g., evolution, culture) and are not objectively true.
  4. Constructivism/practice-dependent: moral truths are constructed from or depend on social practices.

  Let's structure the desiderata:

  **Non-negotiable Desiderata (must have):**
  - D1: Handle threshold divergence (ordinal agreement but different thresholds). Motivating case: causing physical pain vs. loyalty breach. Everyone ranks physical pain higher, but the line for when it's acceptable to cause pain (e.g., discipline) or breach loyalty (e.g., whistleblowing) varies. Why required: the team's data shows this pattern, so without accounting for it, the theory is useless.

  - D2: Provide a procedure for non-philosophers to classify disputes. Motivating case: the mother-in-law care home case. The teammate must be able to apply the procedure without philosophical training. Why non-negotiable: the purpose is to hand a procedure to non-philosophers.

  - D3: Account for historical moral change without collapsing into "all error" or "all preference". Motivating case: slavery or marital rights, once accepted, now condemned. Why required: to avoid oversimplification and to allow for moral progress without assuming current views are always correct.

  - D4: Handle the group-membership probe without assuming impartiality. The probe must be able to detect bias without presupposing that impartiality is the correct standard. Motivating case: if swapping group membership changes the verdict (e.g., in a dispute about resource allocation), it suggests bias, but the probe itself must not assume that the only correct moral judgment is impartial. Why required: because the user suspects the probe might be rigged by assuming impartiality, so the theory must account for the possibility that partiality (like family loyalty) is a genuine value.

  **Camp Preference Desiderata (could be debated):**
  - D5: Allow for the possibility of moral progress (i.e., some moral disagreements are resolved by one side being wrong). Motivating case: the historical change in views on slavery. Why a camp preference: universalists and error theorists might insist on this, while relativists might deny it. But note: the user wants the theory to be able to say (d) "one side is wrong", so this is non-negotiable? Wait, let's see.

  Actually, the user has type (d) as an option: "a case where one side is just wrong in the way that makes moral progress possible." So we must include the possibility of moral error and progress. Therefore, I'll make this non-negotiable.

  Revised non-negotiable:

  - D1: Threshold Divergence Requirement
  - D2: Non-Philosopher Procedure Requirement
  - D3: Historical Change without Reduction Requirement
  - D4: Probe without Impartiality Assumption Requirement
  - D5: Possibility of Moral Progress Requirement (to account for type (d))

  But note: the user also wants to reject one common demand. Let's list that later.

  Now, conflicts and unsatisfiable sets?

  Tension between D4 and D5? D4 says we must not assume impartiality (so partiality might be a genuine value), but D5 (moral progress) might require that we sometimes judge partiality as a bias (error). For example, if a society becomes more impartial over time, is that progress? But the theory must not assume impartiality is always better.

  Also, the probe (D4) is designed to detect bias, but if partiality is a genuine value, then the flip might not be a distortion. So the theory must have a way to distinguish when partiality is a legitimate value (like family obligations) and when it is a distortion (like racism).

  Another tension: D3 (historical change without reduction) and D5 (moral progress). How can we have moral progress without implying that the past was in error? But the user wants to avoid "all variation is error". So we must allow that some historical changes are not necessarily progress? But then how do we account for cases that are progress? This is tricky.

  Perhaps the resolution is that the theory must be able to distinguish between changes that are due to better information (factual) or reduction of bias, versus changes that are shifts in values. But the user wants a classification for each dispute.

  Now, the most exclusionary desideratum: D1 (threshold divergence) is very specific and might knock out theories that only focus on headline disagreements (like what is right/wrong) and not the gradient.

  Also, D4 (probe without assuming impartiality) is tricky and might knock out theories that assume impartiality as a requirement for morality (like some Kantian approaches).

  Rejected demand: One common demand is that the theory must be able to resolve every disagreement (i.e., assign a unique correct answer). This is a prejudice of universalists. But the user's framework allows for different types of disagreements, and not all can be resolved (e.g., genuine value differences). So we reject the demand that the theory must provide a unique resolution for every case.

  Scorecard:

  1. Universalism (one true morality): 
     - Fails D1? Not necessarily, it could say thresholds are context-dependent but the ordinal ranking is objective. But thresholds might be part of the objective morality? It might struggle with threshold divergence by dismissing it as error.
     - Fails D4? Because it often assumes impartiality (e.g., Kantian universalizability) and might see any partiality as error. So it might not pass the probe without assuming impartiality.

  2. Relativism (different values):
     - Handles D1 and D2? It can explain threshold divergence as different cultural values. 
     - Fails D5? Relativism typically denies moral progress (since each culture is right for itself). So it cannot say one side is wrong (type d).

  3. Error theory/debunking: 
     - Says moral judgments are illusions or distortions. 
     - Handles D3? It could say historical change is due to reduced error. 
     - But fails D5? Actually, error theory doesn't necessarily allow for moral progress because there's no objective morality to progress toward? Some error theories might allow for progress in terms of well-being. 
     - Fails D2? It might be hard to turn into a procedure for non-philosophers because it requires debunking every moral judgment.

  4. Constructivism/practice-dependent: 
     - Moral truths are constructed from social practices. 
     - Can handle D1: thresholds are part of the practice. 
     - D3: historical change is evolution of practices. 
     - D4: can allow that practices include partiality (like family obligations) and then the probe might detect when a practice is applied inconsistently (which would be an error within the practice). 
