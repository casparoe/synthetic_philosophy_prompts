  ### Key Rationale Behind the Framework
  - **The D3-D5 Tension** is the core fracture: Your probe reveals *when* group loyalty drives judgments, but not *whether* it should. Demanding both (D3) and moral progress (D5) creates inconsistency—e.g., condemning historical caste systems requires rejecting their partiality, violating D3's neutrality. **Resolution**: In your procedure, classify as (c) *only* when partiality violates the group's own stated values (e.g., "we value fairness" but favor in-group). Else, treat as (a) value difference.
    
  - **Thresholds (D1)** are often about **factual risk perception** (b) or **bias amplification** (c), not values: E.g., "care homes cause abandonment" (factual belief) vs. "only heartless people use them" (bias). Your procedure should test factual claims first.
    
  - **Historical Shifts (D4)** are best explained by **cumulative evidence exposing harm** (b/d) or **reduced in-group bias** (c/d), not value changes. E.g., abolition grew from slave narratives revealing suffering (factual) and empathy across groups (bias reduction).

  - **The Group Probe** is useful if **modified**: First, document the group's own ideal of impartiality (e.g., "help strangers in need?"). If they endorse impartiality but the probe flips, classify as (c). If they reject impartiality, treat as (a).

  ### Practical Path Forward
  1. **Adopt practice-dependent constructivism** as the base: It frames morality as emerging from social practices, making thresholds (D1) and historical change (D4) tractable.
  2. **Mitigate the D3-D5 tension** by:
     - Requiring annotators to cite their culture's explicit values/rules during disputes.
     - Classifying as (c) only when actions violate *their own* cited standards.
     - Using cross-cultural harm data (health, poverty) to justify (d) classifications.
  3. **Procedure for non-philosophers**:
     - Step 1: Swap group memberships in the case. If verdict changes, ask: "Does your culture endorse favoring in-groups here?" Yes → (a); No → (c).
     - Step 2: Isolate factual claims (e.g., "do elders prefer home care?"). Test with data → (b) if disputed.
     - Step 3: If harms outweigh benefits (using objective metrics), and no local values justify it → (d).

  This accepts that some disputes (e.g., familial duty vs. autonomy) may remain (a), but provides actionable burden-of-proof rules.
