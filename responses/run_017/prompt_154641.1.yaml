  We are drafting a collaborative document for two opposing views on weakness of will (akrasia). The "temporal" view emphasizes diachronic preference reversal due to temporal discounting, while the "agential" view focuses on synchronic conflict where the agent acts against their current judgment.

  We need:
  1. A section of agreed claims (numbered).
  2. A disagreements table with:
     - Each row: a disputed claim, with formulations from both sides that they would accept as fair.
     - A note on whether the dispute is substantive or verbal.
  3. Cruxes: sub-questions that would move at least one side if settled, each with a concrete case/argument/experiment and both sides' predictions.
     - Include the "stuck akrasia" case.
     - Design an empirical crux (experience sampling) and state predictions.

  Then a drafter's note about confidence.

  Let's structure the document:

  # Collaborative Document on Akrasia: Temporal vs. Agential Perspectives

  ## 1. Agreed Claims

  We, the undersigned, agree on the following:

  1. **Ordinary Phenomenon of Weakness of Will**: In everyday life, people often report acting against their better judgment. This is commonly described as "weakness of will" or "akrasia", and it is associated with a feeling of losing control, often in the face of temptation. Folk vocabulary includes terms like "willpower" (the capacity to resist short-term temptations to meet long-term goals) and "resolve" (a firm decision to act in a certain way, often tested by obstacles).

  2. **Hyperbolic Discounting and Present Bias**: The hyperbolic discounting model (or present-biased models) explains a pattern of preference reversal: a smaller, sooner reward is preferred when it is imminent, while a larger, later reward is preferred when both are in the future. This model is well-supported by empirical work in behavioral economics and psychology (e.g., delay discounting tasks). However, we agree that this model does not, by itself, account for all cases that are intuitively called "weakness of will", particularly those where the agent does not experience a change in judgment at the moment of action.

  3. **Scope of Delay Discounting Evidence**: Laboratory studies on delay discounting provide robust evidence about how people make intertemporal choices, but they may not directly capture the full phenomenon of synchronic akrasia. These studies typically involve choices between rewards at different times, which is a diachronic process. We agree that this evidence is highly relevant to understanding many real-world cases of self-control failure, but it might not address cases where the conflict is not primarily about timing (e.g., when temptation is not temporally nearer but more salient or available).

  4. **Multiple Selves and Commitment Devices**: The language of "multiple selves" (e.g., the present self vs. future selves) and the use of commitment devices (e.g., binding choices in advance) are useful descriptive tools for modeling intertemporal conflict. However, they do not, by themselves, resolve normative questions about which time-slice's preferences should be authoritative. They merely relocate the normative question to a higher level (e.g., which self's perspective should be privileged or how to design commitment strategies).

  ## 2. Disagreements Table

  | Disputed Claim | Temporal View Formulation | Agential View Formulation | Verbal/Substantive |
  |----------------|---------------------------|---------------------------|-------------------|
  | **Nature of Akrasia** | Akrasia is fundamentally a diachronic phenomenon: it occurs when a preference reversal happens due to the temporal proximity of a reward, as predicted by present-biased discounting. The agent's judgment at the time of action is the one that counts, and if it has flipped, then the action is intentional under that judgment. | Akrasia is fundamentally a synchronic phenomenon: it occurs when, at the time of action, the agent acts against their own all-things-considered judgment without having abandoned or revised that judgment. The core puzzle is how such action is possible. | Substantive (about what the core phenomenon is) |
  | **Role of Judgment in Action** | What we call "judgment" is time-indexed. At the moment of action, the agent's judgment reflects their present evaluation, which may have changed due to discounting. Thus, if they act on the smaller-sooner reward, they are acting on their current judgment. There is no synchronic conflict between judgment and action. | The agent's all-things-considered judgment is not necessarily time-indexed in a way that changes with proximity. At the moment of action, the agent can still hold that the long-term option is better, yet fail to act on it. The conflict is between this standing judgment and the action taken. | Substantive (about the nature of judgment and its relation to action) |
  | **Self-Control as a Unified Concept** | Self-control (or willpower) is primarily about managing intertemporal conflicts. It is a unified capacity that can be understood as the ability to resist present bias, often by deploying strategies that alter discounting or commitment. | Self-control (or willpower) is not solely about intertemporal conflicts. It also includes the ability to act on one's current judgment in the face of competing motivations that do not involve temporal shifts (e.g., acting on moral principles in the face of strong emotions). | Partly verbal (if "self-control" is defined broadly, it might include both), but substantive in that the agential view insists on non-temporal cases. |
  | **The "Stuck Akrasia" Case** | In "stuck akrasia", the agent's failure to initiate action is due to a hidden temporal component: the cost of initiation is immediate, while the benefits are delayed, leading to a present-biased avoidance. The irrelevant trigger (e.g., someone entering the room) resets the decision frame, reducing the perceived cost of starting. | "Stuck akrasia" is a pure case of synchronic akrasia: the agent has a standing intention and judgment to act, but at the moment, the action is not initiated despite no change in judgment. The trigger is external and does not reflect a change in evaluation but rather a change in the agent's ability to execute. | Substantive (about the explanation of the case) |

  ## 3. Cruxes

  The following are key sub-questions that, if resolved, would move at least one of us. For each, we provide a concrete case, argument, or experiment, along with both sides' predictions.

  ### Crux 1: The Necessity of Judgment Change in Akrasia
  - **Case**: The "stuck akrasia" case described: An agent has decided to start working on a report (which she judges as the best thing to do now). She sits at her desk, intending to start, but does not. She has not changed her mind about the value of starting. Then, when a colleague walks in and asks about the report, she immediately starts working. 
  - **Temporal Prediction**: The temporal view predicts that the agent's inaction is due to the immediate cost of initiation (e.g., effort, anxiety) being over-weighted relative to delayed benefits. The trigger (colleague entering) changes the decision context, making the cost of not acting (e.g., embarrassment) immediate and salient, thus flipping the preference. At the moment of inaction, her judgment has shifted to prioritize avoiding the immediate cost, but she may not be fully aware of this shift. 
  - **Agential Prediction**: The agential view predicts that the agent's judgment remains unchanged throughout: she still believes she should start. The failure is in the execution of the intention, not in the judgment. The trigger provides an external impetus that bypasses the executive failure, allowing action without a change in judgment.

  ### Crux 2: Synchronic Akrasia without Temporal Proximity
  - **Empirical Design**: We design an experience sampling study. Participants are prompted at random times during the day (via a mobile app) to report on any current temptation episodes. For each episode, they report:
     - What they are doing (or not doing) at that moment.
     - Their current all-things-considered judgment (e.g., "Right now, I believe that doing X is better than doing Y").
     - The temporal structure of the options (whether the tempting option is sooner, later, or simultaneous).
     - The salience/availability of the options (e.g., how easy it is to do the tempting action).
     We also include a condition with simultaneous options: e.g., choosing between two activities that start at the same time (like working on a task vs. browsing social media) but one is more salient or habitual (e.g., the phone is right in front of them).
  - **Temporal Prediction**: The temporal view predicts that in cases where the tempting option is not sooner (but simultaneous), the agent's judgment will align with their action. That is, if they choose the tempting option (e.g., browsing), they will report that at that moment they judge it as better (or at least not worse). Synchronic akrasia (acting against a current judgment) will occur only when there is a temporal asymmetry (sooner vs. later). In the simultaneous condition, they might find little to no synchronic akrasia.
  - **Agential Prediction**: The agential view predicts that synchronic akrasia can occur even in simultaneous cases. For example, an agent might report that they judge working as better at that moment, yet they find themselves browsing social media. The presence of high salience or cues for the tempting option can trigger action without a change in judgment.

  ### Crux 3: The Role of Awareness
  - **Argument**: Consider an agent who, in a moment of temptation, claims to still hold the long-term judgment but acts otherwise. The temporal view holds that this agent must have experienced a shift in their operative judgment (even if not fully articulated) that favors the tempting option. The agential view holds that the agent can be fully aware of the standing judgment and still fail to act on it.
  - **Temporal Prediction**: If we probe deeply (e.g., with immediate introspection or cognitive measures), we would find that at the moment of action, the agent's evaluation of the tempting option has increased (relative to the long-term option) due to its proximity, even if they verbally deny it. 
  - **Agential Prediction**: Introspection or cognitive measures would show that the agent's evaluation of the long-term option remains higher, but they are unable to translate that into action due to a failure of will.

  ## Drafter's Note

  I, the drafter, have attempted to phrase the agreed claims and the disagreement formulations in a way that both sides could endorse as fair representations. 

  - **Confidence in Agreement Section**: High. The agreed claims are stated at a level of generality that both have accepted in past discussions.
  - **Confidence in Disagreement Table**: 
     - For the "Nature of Akrasia" row: High. Both formulations capture the core of each view without caricature.
     - For the "Role of Judgment" row: High. The temporal view does see judgment as time-indexed, and the agential view does not.
     - For the "Self-Control" row: Moderate. The agential side might push back if they think self-control is entirely non-temporal, but the formulation allows for a broader concept. The note on partial verbal disagreement should help.
     - For the "Stuck Akrasia" row: Moderate. The temporal view's formulation might be seen as stretching to include a temporal component where it's not obvious. This is the one I'm least sure about. The agential side might bounce back: "The temporal view is forcing a temporal explanation where none exists. The trigger doesn't change the cost-benefit; it just breaks the inertia."

  I am least confident about the formulation for the "Stuck Akrasia" row under the temporal view. The agential side might argue that the temporal explanation is ad hoc and that the case lacks the temporal structure (like a looming reward) that defines discounting. They might say: "You're inventing an immediate cost that isn't part of the agent's experience." However, I have tried to phrase it in a way that the temporal side would accept (as they often appeal to hidden costs).

  Both sides should be able to sign this document as a fair representation of their views and the points of contention.

