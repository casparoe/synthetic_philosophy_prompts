answer: |-
  ### Collaborative Document: Understanding Akrasia  
  *Jointly Endorsed by the Temporal and Agential Perspectives*  

  ---

  #### **1. Agreed Claims**  
  We concur on the following foundational points:  
  1. **Ordinary Phenomenon**: In everyday experience, "weakness of will" (akrasia) describes cases where agents act against their own better judgment. Folk concepts like "willpower" (the capacity to override impulses) and "resolve" (sustained commitment to intentions) reflect intuitions about a struggle between evaluation and action. This phenomenon manifests in both diachronic (e.g., procrastination) and synchronic (e.g., craving-induced lapses) forms.  
  2. **Hyperbolic Discounting's Scope**: Present-biased temporal discounting (e.g., hyperbolic models) robustly explains *preference reversals* when a smaller-sooner reward becomes subjectively preferable to a larger-later reward as delay decreases. This accounts for many self-control failures but does not inherently address cases where evaluation remains stable during action.  
  3. **Limits of Lab Evidence**: Delay-discounting experiments (e.g., monetary choice tasks) validly measure intertemporal bias but may not capture *synchronic* akrasia, as they often conflate judgment shifts with action. The lab paradigm is evidence for time-based preference reversals, not necessarily for "judgment-action gaps" absent temporal proximity.  
  4. **Normative Neutrality of Frameworks**: "Multiple selves" models and commitment devices (e.g., Ulysses contracts) descriptively manage intertemporal conflict but do not resolve normative questions (e.g., which self's preferences are authoritative). They are tools, not solutions, to the core problem of agency.  

  ---

  #### **2. Disagreements Table**  
  Each row states a disputed claim, phrased to be acceptable to the named perspective. Notes classify disputes as **substantive** (S) or **verbal** (V).  

  | Disputed Claim | Temporal View Formulation | Agential View Formulation | S/V |  
  |----------------|---------------------------|---------------------------|-----|  
  | **Core Definition of Akrasia** | Akrasia is reducible to rational intertemporal preference reversals: an agent acts "akratically" when their *evaluation flips* due to temporal proximity, making the chosen action consistent with their *current* judgment. | Akrasia is defined by a synchronic judgment-action gap: an agent acts against their *endorsed evaluation* at the moment of action, without judgment reversal. | S |  
  | **Role of Time in Self-Control** | "Self-control" exclusively describes managing diachronic conflicts via tools (e.g., precommitment) that mitigate present bias. There is no distinct "synchronic willpower." | "Self-control" includes a synchronic capacity to align action with judgment *independent of time*, such as resisting equally timed temptations through executive function. | S/V (Verbal if "self-control" is polysemous; substantive if capacities differ) |  
  | **Explanatory Adequacy of Discounting** | All alleged synchronic akrasia either (a) involves covert temporal dynamics (e.g., effort delay), or (b) reflects misdescribed intentions (e.g., unconscious judgment shifts). | Synchronic akrasia (e.g., acting against a stable moral judgment) exists and cannot be reduced to temporal discounting, as no reward "looms" to flip evaluation. | S |  
  | **"Stuck Akrasia" Interpretation** | "Stuck" inaction stems from hidden temporal costs: initiating action imposes immediate effort/discomfort (high discounting), while delay carries no penalty until later. External triggers (e.g., someone entering) reduce perceived initiation costs. | "Stuck akrasia" is pure synchronic failure: the agent’s evaluation and intention remain intact, but action isn’t initiated due to a non-temporal executive breakdown (e.g., "paralysis"). Triggers bypass this via exogenous cues. | S |  

  ---

  #### **3. Cruxes**  
  Sub-questions where resolution would shift at least one position. Each includes a test case/design and advance predictions.  

  **Crux 1: Is Synchronic Akrasia Without Temporal Proximity Possible?**  
  - **Empirical Design**: Experience sampling study where participants report *in real-time* during temptation episodes:  
    - **Measure**: (1) Current action (e.g., "I am scrolling social media"), (2) All-things-considered judgment (e.g., "I believe I should be working"), (3) Temporal structure of options (e.g., "Both tasks start now").  
    - **Condition**: Temptation with *simultaneous onset* (e.g., choosing between two equally timed tasks: one rewarding but trivial [browsing], one effortful but valued [working]). Salience is manipulated (e.g., phone placed prominently vs. out of sight).  
  - **Temporal Prediction**: Judgment will align with action in simultaneous conditions; no synchronic akrasia. If agents act against a stated judgment, it reflects measurement error or unacknowledged judgment shifts (e.g., "I actually preferred browsing when I started").  
  - **Agential Prediction**: Significant reports of synchronic akrasia (e.g., "I judge working better but browse anyway") in simultaneous high-salience conditions, indicating non-temporal willpower failures.  

  **Crux 2: Does "Stuck Akrasia" Require Temporal Dynamics?**  
  - **Case**: An agent intends to start writing a report (judging it best now), sits motionless for 30 minutes (no judgment/intention change), and only starts when a colleague enters and asks, "Working on the report?"  
  - **Temporal Argument**: Inaction arises from immediate effort costs outweighing delayed rewards; the trigger creates an immediate cost of *not* acting (embarrassment), flipping preference. Agent discounts the "cost of starting" pre-trigger.  
  - **Agential Argument**: The trigger provides no new incentive; it mechanically "jump-starts" action without altering evaluation. Paralysis reflects a synchronic failure of intention enactment, not discounting.  
  - **Crux Test**: Measure physiological arousal (e.g., EEG/GSR) pre-trigger. Temporal view predicts rising aversion (implicit cost-weighting); agential view predicts flat evaluation with motor-inhibition signatures.  

  **Crux 3: Can Discounting Explain Stable Judgments During Action?**  
  - **Argument**: If an agent reports unchanged judgment ("I still think X is best") while performing contrary action Y, does this contradict temporal models?  
  - **Temporal Prediction**: Agents conflate "ideal" with "current" judgment. Real-time implicit measures (e.g., affect priming) will reveal covert preference shifts toward Y during action, even if explicit judgment is stable.  
  - **Agential Prediction**: Explicit judgments reflect true evaluation; implicit measures may show conflict but not reversal. Action Y occurs despite stable explicit judgment for X.  

  ---

  #### **Drafter's Note**  
  - **Confidence in Agreement**: High. Claims 1–4 reflect common ground established in prior discussions.  
  - **Confidence in Disagreement Table**:  
    - High for rows 1–3 (phrasings mirror each side’s stated views).  
    - **Lowest Confidence**: Row 4 ("Stuck Akrasia" under Temporal View). The agential side may reject "hidden temporal costs" as unfalsifiable and demand evidence that effort is *experienced* as a discounted cost. Temporal advocates might counter that this is a standard inference in behavioral models.  
  - **Overall Signability**: This document fairly represents both positions. The temporal side’s language avoids "bait and switch" charges by centering discounting as the mechanism; the agential side’s phrasing secures synchronic phenomena as irreducible. The cruxes force empirical adjudication without presupposing outcomes.  

