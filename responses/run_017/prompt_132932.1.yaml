prompt: |-
  Hey — you're a clinical ethicist and philosopher who's also sat on a hospital IRB for years, so take this seriously, brainstorm a bit first, and then give me something I can actually use.

  I'm the senior research nurse on a transplant/oncology floor and I run the consent conversations for trials and for a couple of high-risk procedures — usually 4–6 a week, 15–20 minutes each, and I have to log a decision the same day that the IRB and the PI will both sign off on. Patients are often on steroids or opioids, sometimes in pain, frequently with family in the room who have already made up their minds, and the person recruiting them is very often their own treating consultant. I want a procedure, not a form: the questions in order, what counts as a sufficient yes to each one and what counts as a no, the question where I stop and don't proceed, and the places where I have to hand the call to someone else because it's a values question dressed up as a factual one. Be honest about which steps are theatre I perform for the file.

  Two things the standard disclosure / understanding / voluntariness checklist just doesn't help me with, and I need them handled: (a) everything comes as a package — the trial drug only comes with the extra biopsies and the home-visit adherence monitoring, so people say yes to the whole bundle because they want one part, or say yes to part and refuse the rest; (b) I have to pick some framing of the risks and the framing moves people — "30%" vs "about a third", survival curves vs. side-effect lists — so I'm never merely transmitting information, and I cant tell when that tips over into having manufactured the yes myself.

  Then run the procedure on three cases: [1] Mr A, day 3 on high-dose steroids, consenting for a phase I dose-finding trial; cheerful, repeats all the numbers back to me correctly, and volunteers that this is his best shot at a cure — it isn't, it's dose-finding, there's no therapeutic intent. [2] Ms B, listed for a transplant, perfectly happy to take the organ and the immunosuppression, refuses the protocol-required weekly adherence visits, and says then just give her the transplant without the study — there is no such option. [3] Mr C, enrolled under deferred consent after an emergency procedure, sister signed; he wakes up on day 2, fully with it, says he would never have agreed, wants out of the study going forward but is fine with the data already collected.

  Give me the answer the procedure actually gives, even when it's one I wont like, and tell me at the end what the procedure can't do.
reasoning: |-
  Okay, let me approach this systematically. The user is a senior research nurse in transplant/oncology facing complex consent challenges - time pressure, impaired patients, bundled interventions, and framing effects. They need a practical procedure, not just theory, with clear decision points.

  First, I need to recognize their dual struggle: operational efficiency versus ethical rigor. The 15-20 minute constraint means any procedure must be highly structured yet flexible. Their pain points about bundled consent and framing effects suggest deeper unease about being complicit in questionable approvals.

  For the core procedure, I'll adapt the traditional elements (disclosure, understanding, voluntariness) but with critical modifications:
  - Add explicit "bundle awareness" questions since trials often package inseparable components
  - Include framing transparency steps to mitigate suggestion risks
  - Build in mandatory pause points for impaired cognition or coercion signs

  The three case examples reveal where standard processes fail:
  - Mr A shows therapeutic misconception despite verbal comprehension
  - Ms B exposes the coercion risk in all-or-nothing trial designs
  - Mr C presents post-enrollment dissent - the rarest but most legally delicate scenario

  For implementation, I'll create flowchart-like decision nodes with unambiguous thresholds. Important to flag which steps are genuine assessments versus documentation theater. The framing disclosure part is crucial - making the nurse name their phrasing choices forces reflexivity.

  On limitations: This won't fix structural issues like PI pressure or protocol inflexibility. And when families dominate? That needs social work intervention - beyond consent procedure scope. Also, deferred consent dissent requires immediate legal consultation; no nurse should handle that solo.

  Finally, I'll be brutally honest about outcomes: Ms B's case likely means non-enrollment, Mr C's data might still be used. Ethics procedures sometimes validate "no" more than they manufacture "yes".
answer: |-
  Here’s a structured consent procedure designed for high-stakes, time-constrained environments. It addresses your core concerns: bundled interventions, framing effects, decisional capacity under impairment, and therapeutic misconception. The procedure has **mandatory stop points** (▲), **handoff triggers** (⭕), and transparent "theatre" elements.

  ---

  ### **Consent Procedure: 6-Step Framework**  
  *Time: 15–20 min (strictly timed)*  

  #### **Step 1: Pre-Screen for Obvious Barriers (2 min)**  
  - **Check:** Pain score >4/10? Acute confusion (CAM-ICU)? Family dominating conversation?  
  - **Stop (▲):** If "yes" to any → **Delay consent**. Document: "Capacity screening deferred due to [reason]. Reattempt after [specific action]."  
  - **Theatre:** Logging this check satisfies IRB documentation of "assessing readiness" even if obvious.  

  #### **Step 2: Bundle Transparency (3 min)**  
  - **Script:** *"This trial/procedure has required parts that can’t be separated. You must agree to all: [drug], [biopsies], [visits]. If any part is unacceptable, the whole thing is off the table. Are you clear this is all-or-nothing?"*  
  - **Sufficient Yes:** "I understand I can’t pick and choose."  
  - **No/Unclear:** ▲ **Stop consent**. Offer alternatives (e.g., palliative care, standard transplant).  
  - **Key:** Forces acknowledgment of bundling *before* details.  

  #### **Step 3: Framing Disclosure (1 min)**  
  - **Script:** *"I’ll describe risks in two ways because how I say this can sway decisions. First: ‘30% chance of severe nausea.’ Second: ‘7 in 10 people avoid severe nausea.’ Which feels clearer to you?"*  
  - **Log:** Patient’s choice of framing + your verbatim phrasing.  
  - **Theatre:** This documents your mitigation of framing bias but doesn’t eliminate it.  

  #### **Step 4: Core Understanding Check (5 min)**  
  **Ask EXACTLY:**  
  1. *"What is the main goal of this study/treatment? Is it to cure you, test safety, or something else?"*  
     - **Stop (▲) if:** Patient says "cure" for non-therapeutic trial.  
  2. *"What’s the single worst thing that could realistically happen?"*  
     - **Stop (▲) if:** Inaccurate (e.g., "I might feel tired" for a 5% mortality risk).  
  3. *"If you change your mind later, can you quit? What happens then?"*  
     - **Stop (▲) if:** Unaware they can withdraw.  
  - **No rehearsed answers.** Probe: *"Tell me in your own words, not mine."*  

  #### **Step 5: Voluntariness & Coercion (3 min)**  
  - **Ask family to step out briefly.** Then:  
    *"Is anyone pressuring you to say yes? Including your medical team?"*  
    *"Will refusing this affect your regular care? (It should not.)"*  
  - **Stop (▲) if:** Hesitation, glancing at door, or "My doctor said I’d die without this."  
  - **Handoff (⭕):** If pressure suspected → **Ethics consult immediately**.  

  #### **Step 6: Final Affirmation & Logging (1 min)**  
  - **Script:** *"Before I log this: You know this is optional, bundled, and not guaranteed to help? You chose this freely?"*  
  - **Log verbatim:** "Affirmed understanding of non-therapeutic intent" or "Acknowledged bundle requirement."  
  - **Theatre:** This Q/A exists solely for documentation.  

  ---

  ### **Applied to Your Cases**  
  #### **Case 1: Mr A (Steroids, Therapeutic Misconception)**  
  - **Step 1:** Cheerful, repeats numbers → Passes pre-screen.  
  - **Step 4:** ▲ **STOP** at Q1. He says: *"Best shot at a cure."*  
    - **Action:** Correct: *"This trial won’t cure you. It’s safety testing. Still interested?"* If he persists → **Log "Therapeutic misconception unresolved." Do not enroll.** Handoff (⭕) to PI for re-education.  

  #### **Case 2: Ms B (Refuses Adherence Visits)**  
  - **Step 2:** ▲ **STOP** at bundle check. She says: *"Then I’ll take transplant without the study."*  
    - **Action:** "That option doesn’t exist. This is all-or-nothing. Your choice: full package or standard care (no transplant)."  
    - **Log:** "Declined due to bundled visits." **Do not enroll.** No handoff – this is protocol reality.  

  #### **Case 3: Mr C (Deferred Consent Withdrawal)**  
  - **Not a consent conversation** → **Immediate crisis protocol:**  
    1. **Stop all study procedures.**  
    2. **Log:** "Participant withdrew ongoing consent while retaining capacity."  
    3. **Handoff (⭕) to IRB/legal:** Data retention hinges on local laws. Ethically, pre-withdrawal data *may* be kept if anonymized and critical (e.g., safety signal). Tell him: *"We respect your withdrawal. Lawyers will decide about past data."*  

  ---

  ### **What This Procedure Can’t Do**  
  1. **Fix flawed protocols.** Bundles like Ms. B’s are coercive by design. You can only refuse enrollment.  
  2. **Eliminate framing bias.** Disclosing your phrasing mitigates but doesn’t erase influence.  
  3. **Override clinical hierarchies.** If a PI pressures patients pre-consent, your Step 5 may catch it, but stopping requires institutional courage.  
  4. **Resolve deferred consent disputes.** Post-hoc withdrawals force legal/IRB triage – you’re the messenger.  
  5. **Guarantee understanding.** Steroids/opioids may cloud cognition hours later. Your assessment is point-in-time only.  

  **Final Tool:** Carry a laminated script with ▲/⭕ symbols. Logging verbatim responses protects you more than checkboxes. When in doubt: **Stop. Document. Handoff.** Your role isn’t to force "yes" – it’s to make "no" ethically defensible.
