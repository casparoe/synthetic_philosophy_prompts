answer: |-
  ### Activity: The Band Stack Challenge  
  **Goal:** Experience conceptual frameworks that seem self-evident internally but clash irreconcilably when forced to interact.  

  ---

  #### **Materials**  
  - **Deck of 40 cards**: Each shows a vertical stack of 1–4 colored bands (use markers on index cards).  
    - **Colors**: Red (R), Green (G), Blue (B).  
    - **Example card**: `[R] [G] [B]` (3 bands; bottom=R, middle=G, top=B).  
  - **Rulebook A** (for Group A, "Stratigraphy Team")  
  - **Rulebook B** (for Group B, "Spectral Team")  
  - **Score sheets** (simple tally charts)  
  - **Timer**  

  ---

  #### **Rulebooks**  
  *(Print separately; each defines "depth" differently and has its own predictive rule and anomalies.)*  

  **Rulebook A: Stratigraphy Model**  
  > *Introduction:* You study rock layers. The bottom band is the oldest layer; the top is the youngest.  
  > - **Depth**: Total number of bands (1–4).  
  > - **Rule**: Predict the **top band** color from the **bottom band** and depth:  
  >   - *If depth is ODD → Top band = Bottom band*  
  >   - *If depth is EVEN → Top band = Next in cycle (R→G→B→R)*  
  >   - *Example*: Bottom=R, Depth=2 (even) → Predict top=G.  
  > - **Anomaly**: Rarely, the rule fails. Record these but trust the system—it works 90% of the time.  

  **Rulebook B: Spectral Model**  
  > *Introduction:* You study light spectra. The top band is the emitted wavelength; bottom is absorbed.  
  > - **Depth**: Total number of **blue bands** (0–4).  
  > - **Rule**: Predict the **bottom band** color from the **top band** and depth:  
  >   - *Depth=0 → Bottom=G*  
  >   - *Depth=1 → Bottom=R*  
  >   - *Depth=2 → Bottom=B*  
  >   - *Depth=3 or 4 → Bottom=R*  
  >   - *Example*: Top=R, Depth=1 → Predict bottom=R.  
  > - **Anomaly**: Rarely, the rule fails. Record these but trust the system—it works 90% of the time.  

  ---

  #### **Deck Design**  
  - **36 cards follow both rules** (e.g., a 3-band stack `[B] [G] [R]` → A: Depth=3→top=R; B: Depth=1→bottom=B).  
  - **4 anomalies for A only** (e.g., Depth=even, bottom=R, but top≠G).  
  - **4 anomalies for B only** (e.g., Depth=1, top=R, but bottom≠R).  
  - *No card is an anomaly in both systems.*  

  ---

  #### **Timeline (120 Minutes)**  

  **0:00–0:15 — Setup & Split**  
  - Split into Group A (7) and Group B (7).  
  - Hand each group their rulebook and 20 cards (shuffled).  
  - *Instructions:* "You are scientists. Use your rulebook to predict outcomes and score points. Don’t discuss with the other group."  

  **0:15–0:45 — Training & Scoring (Within Groups)**  
  - Groups practice: For each card, calculate "depth" and predict (A: top band; B: bottom band).  
  - Reveal the answer and score 1 point per correct prediction.  
  - Anomalies: Record cards where the rule fails. *Key moment: Groups dismiss anomalies as "outliers"—no crisis.*  

  **0:45–1:00 — Regroup & Pair**  
  - Pair each A with a B partner. Hand each pair 5 new cards.  
  - **Task 1: Joint Prediction**  
    - *For each card, agree on ONE prediction:*  
      - Predict the **top band** (using A’s rule) AND the **bottom band** (using B’s rule).  
      - But they must share their "depth" value to do this—and conflict arises immediately.  

  **1:00–1:15 — Task 2: Translation Challenge**  
  - Give each pair two claims to "translate" into neutral language (no jargon):  
    - *Claim A:* "The top band is determined by the bottom band and depth."  
    - *Claim B:* "The bottom band is determined by the top band and depth."  
  - *Goal:* Agree on wording both accept. (They can’t—"depth" is intractably tied to their framework.)  

  **1:15–1:30 — Group Discussion**  
  - Reconvene whole group. Ask:  
    - "Could you translate the claims easily? If not, why?"  
    - "Are you studying the same thing as the other group? How do you know?"  
  - *Do not use "incommensurability" or "Kuhn" yet.*  

  **1:30–2:00 — Debrief**  
  - Reveal this models Thomas Kuhn’s ideas. Map moments to concepts:  
    - **Puzzle-solving, not testing**: Groups used rules as *givens* to score points—no one questioned their system.  
    - **Anomalies ≠ Crisis**: Groups noted rule failures but didn’t doubt their model (no alternative existed).  
    - **Incommensurability**:  
      - "Depth" meant different things—not just labels but *fundamental categories*.  
      - Pairs couldn’t translate claims because meaning depended on the framework.  
      - Post-activity, some "switched" frameworks when shown the other rulebook; others doubled down.  
    - **World-change (limitation)**: Cards didn’t "transform" for players (unlike post-revolution science). *You must explain this verbally:* "In real science, data isn’t neutral—after a paradigm shift, scientists *see* the world differently, like noticing new patterns in old data."  

  ---

  #### **Anticipated Objection & Response**  
  **Objection**: "This is just underdetermination (many theories fit the data) or a convention difference!"  
  **Response**:  
  - *Underdetermination*: The issue isn’t that data fits two theories. It’s that the theories **can’t be compared directly**—they split the data in incompatible ways (A cares about band count; B cares about blue bands).  
  - *Convention*: "Depth" isn’t a resolvable label (e.g., "length" vs. "width"). It’s a **meaning-change**: In A, "depth" implies temporal order; in B, it implies compositional properties. Pointing at cards doesn’t fix this—you need the whole framework.  

  ---

  #### **Predictable Problems (First Run)**  
  1. **Rules feel arbitrary**: Some may resist their rulebook. *Mitigation*: Emphasize they’re scientists trusting their field’s expertise.  
  2. **Anomalies cause early revolt**: A player might declare their system "wrong." *Mitigation*: Note anomalies are rare (90% success) and ask, "What alternative do you have?"  
  3. **Pairs collapse into compromise**: Partners might invent a "neutral depth." *Mitigation*: Intervene: "Stick to your rulebook—you’re experts defending your paradigm."  
  4. **Time crunch**: Training may run long. *Mitigation*: Use only 10 cards for scoring; skip anomalies in pairs.  

  ---

  #### **Why This Works**  
  - **No lecture first**: Concepts emerge from frustration, not theory.  
  - **Frameworks feel real**: Scoring incentivizes buying into the system.  
  - **Incommensurability hits hard**: Pairs experience the untranslatability of their "obvious" truths.  
  - **Debrief roots it**: Moments map cleanly to Kuhn, and you openly address the "world-change" gap.  

  Adjust card counts/timing as needed, but the core clash will land.
