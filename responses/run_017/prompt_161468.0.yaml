  - Rulebook B for Group B.
  - Score sheets for each group.

  Timeline (2 hours):

  0:00 - 0:10: Introduction to the activity (without revealing the purpose). Split into two groups (Group A and Group B), each in separate corners of the room. Explain that they are scientists studying a set of phenomena (the cards) and they have a rulebook that helps them classify and predict. Their goal is to score points by making correct predictions about new cards.

  0:10 - 0:30: Training within groups. 
    - Hand out the rulebook to each group and a set of training cards (20 cards for each group? or 30? we can give each group the entire deck of 40, but they will work together).
    - Each group studies the rulebook and practices on the cards. They should learn to calculate "depth" (as defined in their rulebook) and apply the prediction rule.
    - They should also note any anomalies (cards that don't fit the rule). 
    - The facilitator circulates to answer questions (but only about procedure, not about the rule).

  0:30 - 0:50: Scoring round within groups.
    - New cards are presented one by one (the same deck? or a subset? we can reuse the deck but reshuffle).
    - For each card, the group must:
          - Calculate their "depth"
          - Make a prediction: for Group A, predict the top band; for Group B, predict the bottom band.
          - After prediction, reveal the answer and score 1 point if correct.
    - They also record any anomalies.

  0:50 - 1:10: Pairing across groups.
    - Pair each member of Group A with a member of Group B.
    - Give each pair 5 new cards (or the same deck again, but they haven't seen them together? or use a reserved set?).
    - Task 1: For each card, they must produce one joint prediction. But they have to predict different things: A wants top, B wants bottom. So they can each make their prediction using their own rule? But then it's not joint. 

    Instead, we can change the task for the pair:
      - They must agree on a single value for the top band and a single value for the bottom band for each card? That might be too much.

    Better: The task is to make a joint prediction for a new property? But that's not in the rulebooks.

    Alternatively, as per your setup: "produce one joint prediction" -> but what to predict? 

    We can ask them to predict the entire card? But that's too hard.

    Or we can skip the prediction in pairs and go to the translation task.

    Revised pair task:
      - Task 1: For a given card, they must agree on the value of "depth" for that card. But they have different definitions. So they will conflict.
      - Task 2: Translate a key claim from their rulebook. For example, each rulebook has a fundamental law. They must produce a jointly agreed translation of that law into neutral language.

    Example claims:
      - Group A's law: "The top layer is determined solely by the bottom layer and the depth."
      - Group B's law: "The bottom layer is determined solely by the top layer and the depth."

    But they use "depth" differently.

    The pair must write down a statement that both can agree on that captures the content of both laws? But they won't agree because the laws are different.

    Alternatively, they must produce two translations: one for A's law and one for B's law, in neutral terms, and both must agree that the translation is faithful.

    Then they will realize that the word "depth" means different things.

    So for each pair, hand out two claims (one from A's rulebook and one from B's rulebook) and ask them to jointly agree on a translation of each claim into a language that does not use the word "depth".

  1:10 - 1:30: Group discussion and then whole room debrief.

  1:30 - 2:00: Facilitator-led debrief mapping to Kuhn.

  Debrief points:

  - Inside each group, they experienced the rule as given, and they were puzzle-solving (applying the rule) not testing it.
  - Anomalies were noted but didn't cause rejection of the rule because there was no alternative.
  - When they paired up, they couldn't agree on the meaning of "depth", so they couldn't translate the laws without losing meaning.
  - Some might have flipped when they saw the other rulebook? But that might not happen in this short time. We can ask if anyone changed their mind about which rulebook was better? Probably not, because both work well enough.
  - They might not agree whether they were studying the same thing? Because one focused on top and the other on bottom, and used different measures.

  Answer to the underdetermination objection:
    The underdetermination says that the data (the cards) are compatible with both theories. But incommensurability goes further: the two theories are not simply two different interpretations of the same data; they are organizing the data in such a way that there is no neutral language to compare them. The very terms (like "depth") have different meanings, so they are talking past each other. The activity shows that even when using the same word, they are not referring to the same property.

  What it can't show: 
    The world-change part. In the activity, the cards are fixed and don't change. But in Kuhn, after a revolution, scientists literally see the world differently. We don't have that in the activity because the cards are static. We can mention that in science, the data itself might be reinterpreted (like seeing an experiment differently) but in the activity, the card is just a card.

  What might go wrong:
    - One group might finish early.
    - The rules might be too hard to understand.
    - In the pairing, they might quickly realize the two definitions of depth and think it's just a trivial difference in terms.
    - The anomalies might be too obvious and cause the group to reject the rule immediately.

  To mitigate:
    - Have extra cards or tasks for groups that finish early.
    - Test the rule complexity beforehand.
    - In the debrief, emphasize that in science, it's not just about relabeling; the whole framework for understanding is different.

  Rulebooks (text):

  Rulebook A: Layer Theory

  Introduction: You are a scientist studying layered structures. Each card shows a stack of bands (layers) from bottom to top. The bottom band is the foundation, and the top band is the current surface.

  Key Concept: 
    - The "depth" of a stack is the total number of layers.

  Fundamental Law:
    The top band is determined by the bottom band and the depth as follows:
      If the depth is odd, then the top band is always the same as the bottom band.
      If the depth is even, then the top band is the next band in the cycle R → G → B → R.

    For example:
      - Depth=1 (odd): bottom=R, then top=R.
      - Depth=2 (even): bottom=R, then top=G (next in cycle).
      - Depth=3 (odd): bottom=R, then top=R.
      - Depth=4 (even): bottom=R, then top=G.

    There may be a few anomalies where this law does not hold.

  Rulebook B: Blue-Depth Theory

  Introduction: You are a scientist studying the distribution of blue in layered structures. Each card shows a stack of bands from bottom to top.

  Key Concept:
    - The "depth" of a stack is the number of blue bands in the stack.

  Fundamental Law:
    The bottom band is determined by the top band and the depth as follows:
      If depth = 0, then bottom band is Green (G).
      If depth = 1, then bottom band is Red (R).
      If depth = 2, then bottom band is Blue (B).
      If depth = 3 or more, then bottom band is Red (R).

    There may be a few anomalies where this law does not hold.

  Deck creation:
    We will create 40 cards with stacks of 1, 2, 3, or 4 bands.
    For Rulebook A, we want 36 cards that follow the rule and 4 that break it.
    For Rulebook B, we want 36 that follow and 4 that break.

    We can generate the deck arbitrarily and then adjust a few to break the rules.

    For example, for Rulebook A anomaly: take a card with even depth and bottom=R, then set the top to something other than G (e.g., R or B).

    For Rulebook B anomaly: take a card with depth=1, then set bottom to something other than R.

  This should be doable with index cards and markers.

