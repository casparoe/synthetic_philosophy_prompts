  Evens (n=0,2,4,6,8): 0,4,8,10,12 → Differences: +4,+4,+2,+2? Not clear.  
  Odds (n=1,3,5,7,9): 1,3,5,7,9 → Linear: `y = n` for odd n.  
  Evens: n=0:0, n=2:4, n=4:8, n=6:10, n=8:12 → `y = 2*n` for n=0,2,4,8? But n=6→10 not 12.  
