  *Actual rule:* **`y = n^2 mod 11` *if n^2 mod 11 <= 10*, else...** It fits perfectly:  
  `0^2 mod11=0`, `1^2=1`, `2^2=4`, `3^2=9`, `4^2=16 mod11=5?` → 4th value is `3`, not 5 or 9. **Mistake!**  
