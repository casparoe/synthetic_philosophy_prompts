  First, I need to unpack their examples. The biopic with the invented private confession feels wrong, but the same sentiment voiced by a fictional aide doesn't. The enslaved woman's fictional voiceover feels justified as restitution. And restaging a public speech as private confession feels invasive despite using real words. 

  Hmm. They're clearly frustrated that existing frameworks (deception, reputation damage, contract breach) don't capture this. Their own terms "voice-conscription" and "interpretive preemption" are close but overlapping. I think the core issue is about agency over one's narrative voice versus interpretation of facts. 

  The key variable seems to be intimacy of the moment. Private settings (bedroom confession) vs public (crowded room) change the perceived violation. Also, power dynamics matter - the enslaved woman had her voice historically erased, making fictional restoration feel ethical. Whereas the statesman already dominates the historical record. 

  For boundary cases: Remote historical figures (say, Julius Caesar) might not trigger this, but recent ones do. Explicit disclaimers don't fully resolve the unease. Flattering content still feels intrusive if intimate - imagine inventing a president's private prayer. 

  The restitution case works because it's counteracting historical silencing. It's not that the device is different; it's that the ethical direction flips when restoring stolen voice. Like negative space in ethics - adding voice where it was violently removed. 

  I'll propose "ventriloquism violation" as the core term. Definition: Assigning intimate, first-person speech to a historical figure that constructs interiority they didn't authorize. Then distinguish from "hermeneutic displacement" (crowding out real self-interpretations). The vanishing points show which is which: Hermeneutic displacement lessens if the subject left no self-interpretation, but ventriloquism violation persists unless voice restoration rectifies historical erasure. 

  Test case: If we staged Anne Frank saying things beyond her diary, it would feel violative despite her being silenced - because she did author her own narrative. But for someone like Hypatia where no writings survive, reconstructed voiceover might feel restorative. That confirms the archive control variable matters. 

  Final clarity: The statesman's bedroom scene fails both tests - it conscripts voice AND preempts interpretation. The aide scene only fails hermeneutic displacement mildly. The enslaved woman passes ventriloquism test (restorative) but could still risk hermeneutic displacement if her real fragments exist. Need to separate these axes.
answer: |-
  Your observation captures a distinct ethical-aesthetic phenomenon without a universally established name. The core issue is **attributed interiority**: the imposition of invented *subjective experience* onto a historical person, framed as their self-expression. This differs from interpretive preemption (which concerns competing *interpretations* of known facts) and focuses on **the fabrication of first-person consciousness**.

  ### Proposed Term & Definition  
  **Ventriloquism Violation**  
  *The ethical transgression occurring when a historical adaptation fabricates and attributes intimate, first-person statements or introspections to a real person, thereby constructing an unauthorized representation of their inner life.*  

  ### Key Boundaries & Variables  
  1. **Interiority vs. Action**:  
     - Violation: Invented private dialogue ("I feel X"), soliloquies, diaries, voiceover confessions.  
     - Non-Violation: Invented public actions, third-party commentary (the aide's line), hypothetical events.  
     *Why?* Public/external inventions are understood as narrative devices; private inventions claim knowledge of the subject’s unrevealed self.  

  2. **Intimacy Gradient**:  
     The violation intensifies with:  
     - **Privacy**: A public speech reimagined as private confession (your third case) heightens intrusion by implying stolen access to the "true self."  
     - **Emotional Vulnerability**: Confessions of regret, love, or doubt feel more invasive than logistical statements.  

  3. **Authorial Silence vs. Historical Silence**:  
     - **Restitution Case (Enslaved Woman)**: Ethical inversion occurs when:  
       (a) The subject was *systematically denied* self-documentation (slavery, oppression, censorship);  
       (b) The invention *counteracts historical erasure* by amplifying their perspective, not an external agenda.  
     - This is not ventriloquism violation but **Subjunctive Restoration**: speculative speech that repairs archival violence by centering marginalized subjectivity.  

  4. **Vanishing Conditions**:  
     - **Temporal Distance**: Fades for pre-modern figures (e.g., composing speeches for Caesar). Modern subjects (with photographs, recordings, living memory) retain claims to interiority.  
     - **Explicit Fiction Labels**: Mitigates but rarely eliminates discomfort (e.g., *Abraham Lincoln: Vampire Hunter* uses absurdity as a shield; a sincere "private" Lincoln confession would still jar).  
     - **Flattery/Accuracy Irrelevance**: Positive or factual content ("I love my country!") remains violative if intimate and invented—it still fabricates interiority.  
     - **Subject’s Own Fictionalizing**: If the subject famously fabricated their persona (e.g., Oscar Wilde), ventriloquism may feel less intrusive, as their identity was performative.  

  ### Distinguishing from Interpretive Preemption  
  - **Ventriloquism Violation**: "This is what they *felt/said* in private." (Fabricates consciousness)  
  - **Interpretive Preemption**: "This is what their actions *meant*." (Overwhelms known evidence with a dominant reading)  
  *Test for Conflation*: If a film uses only documented words/actions but frames them to imply a reductive interpretation (e.g., portraying Churchill’s depression as his sole motivator in 1940), that’s preemption—not ventriloquism. Your statesman’s aide scene is preemption; the bedroom scene is both.  

  ### Diagnostic Boundary Cases  
  **Case A**: A film shows Marie Curie (who left extensive writings) inventing a diary entry: "I regret sacrificing Pierre for science." → **Violation** (contradicts her documented resilience).  
  **Case B**: Same film invents a colleague saying, "She regrets sacrificing Pierre." → **Preemption**, not violation.  
  **Case C**: A film gives voiceover "diaries" to a Neolithic woman (no written records). → **Non-Violation** (no claim to *her* specific interiority; it’s anthropological speculation).  
  **Case D**: Restaging MLK’s "I Have a Dream" as a private prayer. → **Violation** (converts public rhetoric into stolen intimacy).  

  ### Why Your Instances Align  
  1. **Statesman’s Private Confession**: Ventriloquism violation (invented interiority + intimacy).  
  2. **Aide’s Public Remark**: Interpretive preemption (third-party judgment).  
  3. **Enslaved Woman’s Voiceover**: Subjunctive restoration (counter-erasure).  
  4. **Public Speech as Private Confession**: Ventriloquism violation (authentic words, but intimate framing implies illicit access to hidden self).  

  ### What Would Disprove This Framework?  
  - Evidence that audiences object equally to *all* invented speech, regardless of perspective (they don’t—third-person inventions are tolerated).  
  - Cases where subjunctive restoration feels exploitative (e.g., inventing salacious "confessions" for Cleopatra despite her erased voice) → reveals an additional variable: *narrative purpose* (restorative vs. sensational).  

  **Conclusion**: The intuition tracks **attributed interiority** more than authorship or preemption. "Ventriloquism violation" names the wrong of speaking *as* the dead in their most unguarded moments; "subjunctive restoration" describes its ethical inversion when repairing silences imposed by violence. The difference is whether the subject was denied voice *by history* or by the adaptation itself.
