answer: |-
  Here’s a focused 2-year agenda for three philosophy-oriented postdocs, prioritizing conceptual foundations, tractability without compute, and neglected upstream questions. The goal is to clarify the philosophical underpinnings of mechanistic anomaly detection (MAD) to prevent circularity and guide empirical work. 

  ### Core Insight: The Crux is **Equivalence Conditions**
  Your taxonomy (A, B, C) is useful but misses the meta-problem: **All three views presuppose a prior agreement on *what counts as a relevant difference*.** The real bottleneck is defining *equivalence classes* of mechanisms. Without this, "anomaly" is indeed circular. The agenda below tackles this head-on.

  ---

  ### **Year 1: Foundations of Mechanism Equivalence**  
  *(Upstream, maximally general, tractable via formal modeling & literature synthesis)*  

  1. **Priority 1: Formalize Mechanism Equivalence Conditions**  
     - **Why upstream?** Until we specify *when mechanisms are functionally identical*, MAD lacks objective grounding. This precedes your taxonomy (A/B/C depend on it).  
     - **Tractability:** Use computational theory (e.g., equivalence of automata, causal Bayes nets) and philosophy of science (Woodward’s interventions, functionalist theories). No experiments needed—analyze existing ML interpretability papers (e.g., Olah’s circuits, causal scrubbing).  
     - **Neglected?** Yes. ML papers use "mechanism" loosely; philosophers rarely engage with NN internals.  
     - **Triggers for reprioritization:**  
       - *If* empirical work (e.g., from Anthropic) shows NNs repurpose circuits across tasks, equivalence becomes urgent.  
       - *If* a negative result emerges (e.g., proving equivalence is undecidable in practice), pivot to **Q3**.  
     - **Deliverable:** A taxonomy of equivalence relations (e.g., strict causal isomorphism vs. approximate input-output equivalence).  

  2. **Priority 2: The Multi-Mechanism Problem (Your "Wrinkle")**  
     - **Why next?** MAD must handle *variability* in training (e.g., different seeds → functionally similar but structurally distinct mechanisms).  
     - **Tractability:** Leverage statistical learning theory (e.g., Rashomon effect) and philosophy of probability (e.g., de Finetti exchangeability). Use public NN weight databases (e.g., Hugging Face) to study variational signatures *conceptually*.  
     - **Neglected?** Extensively. ML focuses on average behavior, not mechanism variance.  
     - **Trigger:** *If* new empirical work shows "mechanism neighborhoods" predict OOD failure, this jumps to Priority 1.  
     - **Deliverable:** Criteria for "mechanism families" (e.g., invariance under noise perturbations).  

  ---

  ### **Year 2: From Equivalence to Anomaly**  
  *(Downstream, bridges to practice, still tractable)*  

  3. **Priority 3: Deployment Envelopes & Pragmatic Constraints (Your View C)**  
     - **Why now?** Equivalence conditions (Year 1) define "sameness," but *relevance* depends on deployment goals.  
     - **Tractability:** Decision theory (e.g., Savage’s framework), safety engineering (Leveson’s STAMP). Analyze failure cases (e.g., Tesla FSD edge cases) via public incident reports.  
     - **Neglected?** MAD proposals rarely integrate task-specific risk; philosophers excel here.  
     - **Trigger:** *If* regulators (e.g., EU AI Act) mandate "mechanism consistency" audits, this gains urgency.  
     - **Deliverable:** A framework for defining "anomaly thresholds" relative to cost-of-failure.  

  4. **Meta-Priority: Epistemic Access & Circularity Risk**  
     - **Cross-cuts all work:** How can we *detect* mechanism shifts without perfect interpretability?  
     - **Tractability:** Philosophy of measurement (e.g., Cartwright’s capacities), epistemology of black boxes.  
     - **Neglected?** Critical but ignored in MAD literature.  
     - **Trigger:** *If* interpretability tools (e.g., sparse autoencoders) mature, this becomes actionable.  
     - **Deliverable:** Constraints to avoid self-referential definitions (e.g., "Anomaly exists if we detect it with tool X, but X assumes mechanism stability").  

  ---

  ### **Why This Order?**  
  - **Flow:** Equivalence (Q1) → Variability (Q2) → Pragmatics (Q3) is logically sequential. Epistemic limits (Meta) guard against hubris.  
  - **Risk Mitigation:** If Q1 reveals MAD is intractable, effort shifts to Q3 (pragmatic fallbacks).  
  - **Leverage:** Philosophers add unique value on norms (equivalence, epistemology) and synthesis (e.g., linking causal models to law).  

  ### **On Your Taxonomy**  
  It’s useful but **incomplete**:  
  - **(A) Intervention-Profile:** Assumes we *can* intervene (often impossible in NNs). Needs integration with observational equivalence.  
  - **(B) Role-in-Model:** Risks reification—validated models may be false positives.  
  - **(C) Transport View:** Most promising but requires Q1/Q2 to define "predict."  
  - **Missing Crux:** All three need a theory of *granularity* (e.g., when is a "component" a meaningful unit?). This is embedded in **Priority 1**.  

  ### **What to Deemphasize**  
  - **Direct ML contributions** (e.g., new detectors): Not tractable without compute.  
  - **Pure survey work:** The field moves too fast; aim for conceptual tools instead.  
  - **Debating "real" mechanisms:** Focus on *operational* definitions usable by practitioners.  

  ### **Expected Outcome**  
  A rigorous framework for MAD that:  
  1. Prevents circularity via explicit equivalence classes.  
  2. Guides empirical work (e.g., "Measure mechanism divergence in *these* layers for *this* task").  
  3. Informs policy (e.g., when "mechanism change" justifies model recertification).  

  This agenda makes philosophy *actionable* without requiring technical ML work—ideal for postdocs with formal skills but no compute. The key is to nail the foundations (**Q1**) before the field hardens around flawed assumptions.
