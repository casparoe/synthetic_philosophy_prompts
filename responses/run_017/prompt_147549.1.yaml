answer: |-
  ### Diagnostic Instrument: Classifying Societal Change  
  **Purpose**: To classify a given case into a position on whether "collapse" applies as a comparative category.  
  **Instructions**: Answer all 9 questions based on the described case. Each question has 2–3 options. Do not use prior knowledge of historical debates; rely only on the case description. After answering, use the **Scoring Key** to assign the case to a position.  

  ---

  #### Diagnostic Questions  
  *Each question presents a schematic case. Base answers solely on the description.*  

  1. **Case A (Idealized: Population Replacement)**  
     Over two generations, a polity’s entire population is replaced by immigrants. The administrative apparatus, tax system, and archives continue unchanged. Literacy and monumentality persist.  
     *What primarily changed?*  
     (a) Governing institutions  
     (b) Population composition  
     (c) Complexity (e.g., trade, hierarchy)  

  2. **Case B (Idealized: Absorption)**  
     A polity is absorbed by a neighbor. Locally, everything (production, administration, monuments) continues identically except surplus is sent to a new capital. Health indicators remain stable.  
     *What primarily changed?*  
     (a) Governing institutions  
     (b) Cultural repertoire (e.g., styles, rituals)  
     (c) Nothing substantive  

  3. **Case C (Idealized: Complexity Loss, Health Gain)**  
     Monumental construction, long-distance exchange, and elite culture decline sharply. Skeletal evidence shows improved health, life expectancy, and reduced violence.  
     *Did material well-being decline for the median person?*  
     (a) Yes  
     (b) No  
     (c) Unclear/mixed  

  4. **Case D (Idealized: Celebratory Change)**  
     Participants describe a major shift (e.g., disbanding elites) as "liberation," while external records call it a "catastrophe." Monumentality and trade drop; population is stable.  
     *Can the change be objectively labeled "worse" without perspective?*  
     (a) Yes, using measures like institutional continuity  
     (b) No, evaluation requires a subjective viewpoint  
     (c) Only for specific groups (e.g., elites)  

  5. **Case E (Schematic: Eastern Mediterranean, 1200 BCE)**  
     Palaces, writing systems, and trade networks disintegrate; major settlements shrink or abandon. Changes occur within 50 years.  
     *How rapid was the main shift?*  
     (a) Rapid (within 50–100 years)  
     (b) Gradual (100–300 years)  
     (c) Very gradual (300+ years)  

  6. **Case F (Schematic: Terminal Classic Maya)**  
     Urban centers decline; monumentality and elite culture vanish over 150 years. Population decreases in cities but persists in peripheries.  
     *Did comparable complexity re-emerge within 300 years?*  
     (a) Yes, in similar form  
     (b) No  
     (c) Partially/differently  

  7. **Case G (Schematic: Rapa Nui)**  
     Monument construction ceases; conflict and population decline occur over 120 years. Oral histories suggest internal choices drove changes.  
     *Is there evidence participants chose or welcomed the change?*  
     (a) Yes  
     (b) No  
     (c) Unclear  

  8. **Case H (Idealized: Networked Region)**  
     A culturally connected region (no centralized polity) sees trade and monumentality decline. Changes are uneven; no clear "society" disintegrates.  
     *Was the changing unit a bounded society?*  
     (a) Yes  
     (b) No, it was a decentralized network  
     (c) Unclear  

  9. **Case I (Evaluative Future)**  
     After a shift, complexity drops for 200 years. By 300 years, a new, distinct complex society emerges with higher population.  
     *Was the situation worse two generations (∼50 years) post-change?*  
     (a) Worse by most measures  
     (b) Better/similar  
     (c) Unclear  

  ---

  ### Scoring Key  
  **How to use**: Tally your answers and match to the position with the most alignment. Positions are defined by logical commitments, not historical labels. Ties are resolved by priority: **Evaluative** > **Subject** > **Reversibility**.  

  | Position                          | Defining Features (Critical Answers)                                                                 | Most Awkward Commitment                                                                 |  
  |-----------------------------------|------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------|  
  | **Transformationist**             | Q3b, Q4a, Q6a, Q9b. Change is reorganization, not loss. Rejects "collapse" if continuity/recovery exists. | Must deny "collapse" even with rapid institutional disintegration (e.g., Case E).       |  
  | **Institutional-Collapse Minimalism** | Q1a, Q2a, Q6b. Only governing institutions’ disappearance qualifies. Ignores demography/culture.        | A case like Case A (population replaced, institutions intact) is never a collapse.      |  
  | **Demographic Collapse**          | Q1b, Q9a. Population decline is necessary/sufficient. Downplays institutional or cultural continuity. | Case F (Maya) is a collapse only if population drops, even if complexity persists elsewhere. |  
  | **Complexity-Loss View**          | Q1c, Q3a, Q8a. Drop in sociopolitical complexity (e.g., hierarchy, monuments) defines collapse.       | Case C (health improves) is still a collapse, implying complexity loss is inherently negative. |  
  | **Evaluative View**               | Q4b/c, Q5a, Q9a. Collapse requires decline in well-being (elites, median, or future generations).    | Cannot label a change "collapse" if it improves lives (e.g., Case C), even with institutional loss. |  
  | **Eliminativist**                 | Q8b, Q4b, Q6c. "Collapse" is incoherent; bounded units or normative baselines are undefined.            | Even extreme cases (e.g., near-total depopulation) cannot be "collapse"; term is abandoned. |  
  | **Legibility Collapse**           | Q1a, Q2b, Q7b. Collapse is loss of self-description capacity (literacy, administration, archives).    | Case A (archives persist) is not collapse, even if population is replaced violently.    |  

  ---

  ### Unoccupied Cells in Logical Space  
  The logical space has six axes (Subject, Evaluative, Rate, Agency, Reversibility, Boundedness). These cells are unoccupied due to internal contradictions:  
  1. **Collapse as irreversible but rapid and agential** (e.g., rapid, chosen change that permanently eliminates complexity).  
     - *Diagnosis*: Incoherent. Agency implies intent, but irreversible collapse implies total loss of capacity to reorganize—contradicting the possibility of intentional choice.  
  2. **Collapse of unbounded networks with improved median well-being** (e.g., Q8b + Q3b).  
     - *Diagnosis*: Unattractive. Most theories assume collapse involves decline; pairing improvement with unboundedness makes "collapse" analytically useless.  
  3. **Collapse as gradual and reversible** (e.g., Q5b/c + Q6a).  
     - *Diagnosis*: Unexplored. Positions like transformationism co-opt this, but no named theory defines collapse this way.  

  ---

  ### Indistinguishable Positions and Instrument Limits  
  The tree cannot separate:  
  - **Institutional-Collapse Minimalism vs. Legibility Collapse** when institutions (Q1a) and cultural repertoires (Q2b) disappear together (e.g., Case E). Both require institutional loss; Legibility adds cultural criteria.  
    - *Assessment*: Add a question: "Did administrative literacy/archives disappear entirely?" (Yes → Legibility; No → Minimalism). Without this, they overlap.  
  - **Rate (Axis 3) collapses into Evaluative (Axis 2)**. Slow changes (e.g., Q5b/c) are rarely called "collapse" unless explicitly evaluative (e.g., "decline”). Rate has no independent weight; it only modifies evaluative judgments. Remove Rate as an axis; merge with Evaluative.  

  ---

  ### Final Instrument Notes  
  - **Rate Axis Removed**: Integrated into Evaluative (e.g., rapid change intensifies perceptions of decline).  
  - **Cases Covered**: 4 idealized (A–D, H, I) + 3 schematic (E–G).  
  - **Weaknesses**:  
    - Fails if answers are evenly split (e.g., 3 positions tied). Prioritize Evaluative > Subject to resolve.  
    - Agency (Q7) rarely determines outcomes alone; it modifies Evaluative or Subject.  
  - **Output**: Assign one position per case. If ties persist, the case exposes theoretical ambiguity.  

  This instrument isolates logical commitments, forcing users to confront trade-offs (e.g., must complexity loss imply worsening conditions?). Use it to test cases, then refine your typology.
