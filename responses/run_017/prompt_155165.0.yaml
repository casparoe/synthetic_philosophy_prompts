prompt: |-
  Lawyer here, been reading my way into the philosophy of punishment on my own for a while (not a philosopher, so sorry if this is half-formed). The thing I cant get a handle on is that desert seems adjustable in only one direction. Give an offender a worse childhood, more coercion in their situation, fewer real alternatives, and everyone agrees the sentence should come down. But there's no matching move up: the person who had every alternative open to them and did it anyway doesn't seem to deserve *more* than the standard sentence for that crime, just the standard sentence. So "what this crime deserves" starts to look like a ceiling that gets discounted rather than a genuine midpoint, and I can't tell whether that's a deep fact about culpability or just an artifact of us being able to see deprivation but not privilege. It gets worse when I combine it with the retributivist who also wants the state to investigate offenders properly before sentencing: better information then reliably pushes sentences down, so a retributive system that keeps getting better at finding out the truth starts drifting toward punishing almost nobody.

  Does this have a name? It's somewhere near moral luck, but the luck here all runs one way, toward making the agent less culpable; and it's near the business about desert being a cap rather than a mandate, but that seems to be a claim about whether the state must punish, not about the shape of the scale underneath. I don't want a label dropped on me — I want to know what the thing is, what it isn't, and where it stops. Same phenomenon, or a different one, when the discount comes from what the offender did after the crime rather than from their background?
reasoning: |-
  Okay, let me start by unpacking the lawyer's core concern. They're a legal professional diving into punishment philosophy on their own, which is impressive. Their main puzzle is about desert seeming asymmetrical: worse circumstances reduce sentences, but better ones don't increase them. They see desert as a ceiling that gets discounted downward, not a midpoint. 

  First, I need to map the landscape. This connects to retributivism, moral luck, and the limits of blameworthiness. The asymmetry they describe is real—philosophers like Morse and Husak discuss it in criminal law contexts. The key is that culpability requires capacity and opportunity; mitigating factors erode that foundation, but privilege doesn't create "extra" capacity beyond the baseline. 

  I recall Strawson's reactive attitudes framework here. Resentment has thresholds—we withdraw blame when someone's morally unlucky (e.g., abused background), but we don't intensify it for privilege because the baseline already assumes minimal competence. That explains why discounts flow one way. 

  Next, the lawyer's second point about retributivism + better investigations leading to less punishment. This is fascinating—it suggests retributivism might self-undermine with perfect knowledge. I think they're onto something: if we fully contextualize crimes, we often find reduced agency. But is this a flaw or a feature? Perhaps it reveals that true desert is rarer than we assume. 

  Now, their question about post-crime conduct (e.g., remorse). This feels different from background luck. Mitigation here is about current moral character, not past constraints on agency. But courts mix them—see sentencing guidelines that bundle remorse with childhood trauma. Philosophers might separate them, but legally they're both "mitigating factors." 

  The lawyer also wonders if this is just cognitive bias—seeing deprivation but not privilege. There's truth there. Privilege is invisible default in our blame framework. But I think it's deeper: moral responsibility requires certain capacities, and their absence excuses, but their presence is just... normal. 

  Finally, the labeling question. "Asymmetry of desert" works, but it's not a canned term. More importantly, they want to understand the mechanism, not just a name. So I'll emphasize the structure: culpability erosion versus baseline competence, and why retributivism isn't refuted by mitigation—it's actually consistent. 

  ...Wait, did I address their worry about drifting toward zero punishment? Yes—by noting that retributivism accepts some cases have full culpability (e.g., uncoerced harm with alternatives). The drift occurs only if we over-apply excuses, which isn't inevitable. 

  This feels comprehensive. Time to structure the reply: first validate their insight, then dissect why asymmetry exists, separate the investigation paradox from privilege blindness, clarify post-crime distinctions, and conclude that it's a feature of desert-based systems, not a bug.
answer: |-
  What you've identified is a profound and persistent tension in retributive theory—one that reveals something essential about the structure of desert itself. You're absolutely right about the asymmetry, and it's neither an accident nor merely cognitive bias. Here's a breakdown:

  ### 1. **The Asymmetry of Desert: Why Discounts Only Go Down**
      - **The Baseline Presumption of Minimal Competence**: Retributive desert rests on the premise that the offender was a *responsible agent* at the time of the crime. The "standard sentence" assumes a baseline level of rational capacity, minimal freedom from coercion, and awareness of alternatives. **Mitigating factors (abuse, coercion, deprivation) erode this baseline**, showing the agent’s capacity was compromised. There’s *less* of a responsible self to blame.
      - **Privilege Doesn’t Create "Super-Responsibility"**: A privileged background (opportunities, support, education) typically just confirms the baseline presumption of competence. We don’t say, "You had *more* capacity, so you deserve *more* punishment." Why? Because culpability hinges on *meeting the threshold* for responsible agency—not exceeding it. Once you meet it, you’re fully liable for the wrongful choice. There’s no "extra desert" for having advantages (though it may aggravate *moral* contempt, not legal desert).
      - **The Threshold View of Culpability**: Desert isn’t scalar *above* the baseline. Think of it like criminal intent (*mens rea*): you either have it (guilty) or you don’t (innocent). Mitigators push the offender *below* the threshold; privilege leaves them safely above it. This makes desert a ceiling with downward adjustments—never upward.

  ### 2. **The Investigation Paradox: Better Truth → Less Punishment?**
      Your second point is razor-sharp: if retributivism demands perfect contextual understanding, and perfect understanding reveals universal mitigation (trauma, coercion, limited agency), does desert vanish? This touches deep debates:
      - **Retributivism’s Self-Limiting Tendency**: Yes, rigorous retributivism *should* reduce punishment as understanding grows. If we take agency seriously, we recognize it’s often fragile. **Bruce Waller** and **Gary Watson** argue this reveals retributivism’s flaw: it presupposes a myth of robust, context-independent agency.
      - **The Retributivist Reply**: A sophisticated retributivist (e.g., **Michael S. Moore**) would counter: *Some* people *do* act with full culpability. The goal isn’t to punish less, but to punish *precisely*—exonerating the non-culpable and punishing the truly responsible. The "drift toward zero" assumes no one meets the threshold, which isn’t empirically true (e.g., a white-collar schemer with options and no duress).
      - **The Real Risk**: In practice, mitigation is often ignored due to bias or resource constraints. Your point exposes retributivism’s *idealism*: it works only if we perfectly assess agency—which we rarely do.

  ### 3. **What This Is (and Isn't) Called**
      - **Near Moral Luck, But Distinct**: Moral luck (Nagel/Williams) asks why luck affects blame. Your focus is narrower: **the asymmetric impact of circumstantial luck on legal desert**. It’s the *structural one-way adjustability* of desert-based punishment.
      - **Desert as a Ceiling (Not a Mandate)**: You’re referencing the "limiting retributivism" debate (Morris, Frase), which argues desert sets *maximum* punishment but allows lesser penalties for other reasons (rehabilitation, mercy). Your point is different: **the internal structure of the desert calculation itself** is asymmetrical—it has a floor (zero) and a ceiling (standard sentence), but no basement (no harsher "deserved" punishment for privilege).
      - **A Precise Label?** Philosophers like **Stephen Morse** ("The Immorality of Moral Luck") and **Douglas Husak** ("Guns and Drugs") discuss this asymmetry in criminal law theory. Morse calls it the **"fundamental psycho-legal error"**—confusing *causes* of behavior with *excuses*. But there’s no universal term. Call it the **"asymmetry of desert mitigation"** or **"unidirectional culpability erosion."**

  ### 4. **Does Post-Crime Conduct Change Things?**
      Remorse, restitution, or rehabilitation are **different category**. They aren’t about *culpability at the time of the crime* (which is fixed) but about:
      - **Current Moral Character**: Showing the offender isn’t *currently* dangerous or blameworthy.
      - **State Interests**: Promoting reconciliation or reducing future harm.
      - **Symbolic Repair**: Atonement may diminish the *need* for punishment, but not the *desert* for the past act.
      > **Key Difference**: Background mitigators *diminish original culpability*; post-crime mitigators address *post-offense moral status or social utility*. One alters desert, the other alters the justification for imposing it.

  ### Where It Stops: The Limits of Asymmetry
      - **No Discount for "Pure Evil"?** Even retributivists accept some acts/actors resist mitigation (e.g., a fully resourced, uncoerced torturer). Here, desert hits the ceiling—no downward adjustment is warranted.
      - **Aggravation Exists, But Isn’t Symmetric**: Privilege doesn’t aggravate *desert*, but *harmfulness* (e.g., a CEO’s fraud hurts more people) or *intent* (e.g., meticulous planning) might increase culpability *within the standard range*. This isn’t "punishing privilege"—it’s punishing worse acts.
      - **The Non-Retributive Escape**: Consequentialists (deterrence, incapacitation) can ignore asymmetry. If privilege makes deterrence *harder* (you’re less fear-driven), harsher punishment might be justified—but not because you "deserve more."

  ### Why This Matters for Law
      You’ve hit a nerve in legal philosophy: **retributivism struggles to deliver "just deserts" without a coherent baseline for agency**. The asymmetry reveals that "desert" is:
      - **Threshold-Dependent**: It vanishes below a minimum capacity.
      - **Non-Additive**: Advantages don’t amplify it.
      - **Fragile**: Under scrutiny, mitigation often overwhelms culpability.

  This isn’t a flaw in your reasoning—it’s an unresolved tension in the theory itself. Retributivists either accept mitigation’s erosion of desert (risking under-punishment) or insist on robust agency (risking over-punishment of the disadvantaged). Your instinct is correct: the scale isn’t neutral; it bends only toward mercy.
