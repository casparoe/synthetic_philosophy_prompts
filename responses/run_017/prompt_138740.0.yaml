answer: |-
  Below is the complete final exam package tailored to your specifications.

  ### Part 1: The Question  
  **Answer both parts (a) and (b). Your response must not exceed 1500 words.**  

  **(a)** Species M exhibits two distinct profiles: *intact-M* shows flexible, trade-off-sensitive behaviour (e.g., context-modulated nocifension, reversal learning) alongside nociceptive reflexes, stress responses, and analgesic self-administration. *Blocked-M*—identical except for inactivation of a specific neural hub—loses *only* the flexible behaviours but retains all reflexes and reflexive-like states (e.g., pessimistic bias, analgesic seeking).  
  Explain what this dissociation **does and does not** demonstrate about whether blocked-M has conscious experiences (e.g., pain). Crucially, address why this case alone cannot resolve disputes between major theories of consciousness (e.g., those emphasising cortical structures, global workspace integration, or behavioural flexibility). What kind of evidence *would* allow the case to discriminate between these theories?  

  **(b)** Suppose a closely related invertebrate lineage (call it *Agricola-M*) constitutes most of the invertebrate biomass in industrial agriculture. Policies affecting Agricola-M impact trillions of individuals annually—orders of magnitude more than all vertebrates combined. After reviewing the evidence, reasonable observers assign a 5–60% probability that Agricola-M has conscious experiences.  
  What follows for how we ought to treat Agricola-M? Justify your answer by:  
  - Naming the decision rule you adopt (e.g., maximin, expected utility, precautionary principle),  
  - Explaining why this rule is appropriate *given the specific epistemic limitations identified in part (a)*,  
  - Addressing whether your rule could apply to systems you deem non-conscious (e.g., plants, AI).  

  ---

  ### Part 2: Model Answer (Student Voice, ~700 words)  
  **(a)** The dissociation between intact-M and blocked-M reveals a fault line in theories of consciousness but cannot definitively settle whether blocked-M has experiences. It shows that flexible, goal-integrated behaviour (e.g., trade-off sensitivity, reversal learning) is *separable* from nociceptive reflexes and stress responses. Blocked-M retains the latter—withdrawal from noxious stimuli, analgesic self-administration after injury, and even "pessimistic" judgement bias—while losing the former. This supports three key points:  
  1. **What it demonstrates**: Flexible behaviour is not *necessary* for reflexive pain-like responses. If a theory ties consciousness strictly to reflexes (e.g., "nocifension = pain"), blocked-M forces it to accept that decerebrate states lack nothing. Conversely, if a theory requires behavioural flexibility for consciousness (e.g., based on trade-offs), blocked-M appears non-conscious.  
  2. **What it fails to demonstrate**: It cannot arbitrate between theories because each interprets the dissociation through its own lens. For global workspace theories, the hub’s role in synchronisation might signal integration—so blocking it destroys consciousness. For midbrain-sufficience views, the preserved reflexes might indicate experience even without flexibility. For IBE accounts, blocked-M’s analgesic-seeking *without* behavioural flexibility could be a "zombie" reflex or evidence of suffering. The case is theory-laden: it confirms pre-existing commitments but lacks independent leverage.  
  3. **What would break the deadlock**: We would need evidence that *links the hub’s function to a marker independent of theory*. For example, if blocking the hub abolished neural signatures correlated with human pain (e.g., specific thalamocortical oscillations) *and* those signatures were detectable across taxa without presupposing a theory, we could test predictions. Absent such cross-species validators, the case only redescribes the theories’ disagreement.  

  **(b) Given the uncertainty (5–60% credence) and scale (trillions affected), we must adopt a precautionary rule: minimise worst-case suffering unless costs are catastrophic.** This rule is *demanded* by the epistemic constraints in (a). Since no theory objectively resolves whether Agricola-M suffers, and false negatives (assuming no pain when there is pain) risk immense suffering, we prioritise avoiding profound moral disasters. Expected utility fails here because low probability × vast harm still demands action when harm is extreme (e.g., 5% chance of torturing trillions >> 95% chance of minor waste). Maximin (avoid worst outcome) fits best: the worst case is permitting widespread, undetected agony.  

  The scale magnifies this. Vertebrate welfare gains are dwarfed by potential Agricola-M suffering due to numbers alone. Even a 5% credence warrants reform—e.g., phasing out crushing or live-grinding practices—if alternatives exist. Crucially, this rule *stops* at systems lacking *any* credible markers. Plants show no nociception, analgesia-seeking, or neural correlates; current AI lacks embodied vulnerability. But Agricola-M’s intact profile includes all reflexive markers *plus* flexibility—so excluding it requires asserting that flexibility is strictly necessary, which part (a) shows is contested. Thus, precaution applies precisely where evidence is ambiguous but stakes are extreme. We avoid paralysis by focusing on scalable interventions (e.g., more humane slaughter) without demanding certainty we cannot achieve.  

  ---

  ### Part 3: Marking Scheme (20 marks total)  
  **Five must-hit moves (4 marks each).**  

  1. **Bridging Premise Analysis**  
     - *Hit*: Notes that linking behaviour/physiology to experience relies on inference (e.g., IBE, analogy) and highlights why even human report is shaky (e.g., pain asymbolia, blindsight). Argues that no "gold standard" exists.  
     - *Typical failure*: Assumes absence of report (or flexibility) is evidence of absence, or treats behavioural markers as direct proof.  

  2. **Theory-Adjudication Limitation**  
     - *Hit*: Explains that the dissociation is *compatible* with all major theories (e.g., flexibility theorists see blocked-M as non-conscious; reflex theorists see it as conscious). Identifies that cross-species neural/functional validators (e.g., conserved activity patterns) are needed to test theories.  
     - *Typical failure*: Picks one theory (e.g., flexibility), applies it to the case, and stops.  

  3. **Degraded vs. Negative Case & Taxonomic Cutoffs**  
     - *Hit*: Argues blocked-M is a *degraded* case (lacks features but retains reflexes), implying consciousness may admit degrees. Rejects sharp cutoffs (e.g., "invertebrates lack consciousness") since hub functionality could vary gradually across species.  
     - *Typical failure*: Assumes a sharp taxonomic boundary (e.g., "no cortex, no pain") or treats blocked-M as definitively unconscious.  

  4. **Decision Rule Justification**  
     - *Hit*: Chooses a rule (e.g., precaution, maximin) and grounds it *specifically* in the epistemic problem from (a): irreducible uncertainty + catastrophic stakes. Rejects "expected utility" due to scale or "caution" as unanalysed.  
     - *Typical failure*: Selects a rule by name only, or advocates "caution" without linking to uncertainty/scale.  

  5. **Generalisation Objection & Stopping Point**  
     - *Hit*: Concedes the rule *could* overgeneralise but defends a credible threshold (e.g., "any system with nociception + goal-directed analgesia-seeking"). Contrasts Agricola-M with plants/AI using empirical distinctions.  
     - *Typical failure*: Ignores overgeneralisation or fails to define limits.  

  ---

  ### A vs. B Differentiation  
  **B script (Good, 12–16 marks):**  
  Completes parts (a) and (b) sequentially but disjointedly. (a) catalogs theories; (b) picks a practical rule without deriving it from (a)’s epistemology. Fails to let uncertainty *constrain* the ethics (e.g., argues for precaution because "we should be careful," not because uncertainty forces tradeoffs).  

  **A script (Excellent, 17–20 marks):**  
  Identifies that the *irreducible uncertainty* (from theory-laden evidence) necessitates a decision rule focused on catastrophic risk (e.g., maximin). Explicitly states *what would change their view*: e.g., validated neural markers resolving the ambiguity, or cost-benefit shifts making precaution unsustainable. Integrates (a) and (b) by showing how epistemic limitations *generate* the practical dilemma.
