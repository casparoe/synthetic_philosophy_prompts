prompt: |-
  I'm a 4th-year PhD student, mostly formal epistemology with a bit of phil physics, and I've got something like two years of dissertation time left plus (fingers crossed) a first postdoc. I want to spend them on the problem of old evidence rather than on something safer, but I can't figure out which part of it is actually worth the years. The set-up I assume we agree on: you already know E, so P(E) = 1, so conditioning on E can't bump P(T) — and yet the perihelion of Mercury sure looked like it confirmed general relativity. Whatever the fix is, it has to be reachable by someone with probability theory, a bit of modal logic, and no real physics.

  Here's my own provisional map, which might definately be junk. I think there are three different ways evidence can be old, and I suspect they're different problems wearing the same label:

  (1) temporal oldness — you believed E before you ever had T;
  (2) construction oldness — E was among the things you were staring at when you built T, so the fit is no surprise (the accommodation vs prediction thing);
  (3) derivation oldness — you had T and you had E, and the only thing that's new is that someone worked out that T entails E.

  On top of that there's an axis I'm much less sure about: whether this is a problem for a logic of confirmation (some relation between T, E and background) or for a norm of updating for agents who aren't logically omniscient. Those feel like genuinely different projects, and I think people slide between them.

  What I actually want is an agenda, not a survey. Rank the open questions here for someone in my position — two years, formal toolkit, no physics — and defend the ranking: which questions are upstream of which, which are tractable with the tools I have, which are neglected relative to how much depends on them, and which are traps that look deep but whose answer wouldn't change anything downstream. If my three-way taxonomy is the wrong way to carve the space, say what the right carving is and why the carving changes the order.

  Two things I'd especially like weighed. First, my pet suspicion: that the puzzle is an artifact of reading P(E) = 1 as a credence you actually still have, when old evidence is really evidence you have a lossy memory of — so the right treatment might be a memory-or-recall model rather than a confirmation-theoretic one. Is that a research program or a dead end, and where does it sit in the ordering? Second, how much of the value here is internal to Bayesianism (patching a technical bug in a framework) versus exportable: the same structure shows up whenever a model is fitted to data and the same data is then cited back as evidence for it (double dipping, post-hoc theorizing in the replication-crisis literature), and whenever an analyst already has all the data on file and then comes up with a hypothesis that fits it. Should the export question drive the agenda, or is chasing applications a distraction from getting the core problem right?

  And tell me what would move things: what result, argument, or empirical finding in the next couple of years would move a question up or down your list.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a 4th-year PhD student in formal epistemology with some philosophy of physics, focusing on the problem of old evidence. They have about two years left for their dissertation plus a potential postdoc. Their main concern is choosing which aspect of the old evidence problem to tackle, given their tools (probability theory, modal logic, no physics). They provided a three-way taxonomy of old evidence and want an agenda, not just a survey.

  First, I need to assess their taxonomy. They split old evidence into temporal, construction, and derivation oldness. I recall that in formal epistemology, these distinctions aren't always made explicit. Garber's approach deals with derivation, while others like Howson focus on temporal aspects. The user might be onto something by separating these, but maybe the core issue is logical omniscience and update constraints tying them together.

  Then there's their pet idea about memory loss. They suggest that P(E)=1 might not reflect actual credence due to imperfect recall. That's interesting—linking epistemology with cognitive science models. But how feasible is this without empirical work? They don't have psychology or cognitive science tools, so maybe this is a risk. Still, it's a fresh angle that could connect to real-world applications like replication crises.

  Next, the user asks about the value: patching Bayesianism vs. exportable insights. They mention double-dipping in research, which is super relevant now with replication issues. If their solution can frame old evidence as a case of data dredging, that could make their work impactful beyond philosophy. That might mean prioritizing approaches that highlight these applications, like the construction subtype.

  I should rank the problems. Derivation oldness (logical omniscience) seems upstream because solving it could inform the others. Garber's approach needs extension, maybe with modal logic for non-ideal agents. Construction oldness (accommodation) is downstream but has high export value. Temporal might be a subset where E is learned before T, but perhaps it's less central if the logical issues are resolved.

  Their memory idea could be a middle path. Modeling imperfect recall with probability theory—maybe using Bayesian networks or info theory. But it's speculative. If they can formalize it without empirical work, it's worth exploring as a dissertation chapter. However, it might not solve the core logical problem.

  Tractability is key. With their toolkit, extending Garber via modal operators or possible worlds semantics is doable. They can define a "discovery operator" without heavy math. Also, connecting to double-dipping in science: showing how construction oldness leads to overconfirmation. That's tractable with probability and has real-world relevance.

  Traps? Temporal oldness might be a red herring. If P(E)=1 is the issue, whether E was learned long ago or recently might not matter. Also, some solutions like counterfactual credences (e.g., what if I didn't know E) are debated but might not generalize. They should avoid those if they're dead ends.

  What would move things? If cognitive science studies show memory decay affects theory confirmation, that boosts the memory model. Or if a formal approach to logical learning gets traction. Also, replication crisis discussions might increase interest in their construction oldness analysis.

  So, agenda: Start with derivation oldness as the foundation. Use modal logic to handle logical learning. Then, apply that to construction cases, showing how post-hoc fitting inflates confirmation. The memory angle can be a side project—worth a paper but maybe not the dissertation core. Exportability makes construction subtype high priority after the logical foundation is laid.
answer: |-
  Here’s a strategic agenda for your dissertation/postdoc, prioritizing based on **upstream foundations**, **tractability with your toolkit**, **neglected leverage points**, and **export potential**. I’ll critique your taxonomy, rank the problems, weigh your pet idea, and flag traps. The core insight: **derivation oldness is upstream, construction oldness is high-value for export, and temporal oldness is a distraction**.  

  ### 1. **Taxonomy Critique & Revised Carving**  
  Your three types aren’t distinct problems but *manifestations* of two deeper issues:  
  - **Logical Omniscience Failure (Derivation Oldness)**: The core formal problem. If you know \(T \land K \models E\) (where \(K\) is background knowledge), but haven’t *derived* it, your credence \(P(E) = 1\) blocks confirmation. This underpins *all* old evidence cases.  
  - **Temporal/Acquisition Dependence (Temporal/Construction Oldness)**: A pragmatic/psychological problem. *When* you learned \(E\) or *how* you used it (e.g., building \(T\)) affects intuitive confirmation, but this is downstream of formalizing non-omniscient reasoning.  

  **Why this matters**: Fixing derivation oldness (the logical gap) enables solutions to the others. Construction oldness becomes a special case of *biased hypothesis formation* – tractable once derivation is handled. Temporal oldness adds nothing new: if \(P(E) = 1\) *now*, it doesn’t matter if you learned \(E\) yesterday or in 1915.  

  ---

  ### 2. **Ranked Research Agenda**  
  *(Ranked by: upstream priority → export value → tractability)*  

  | **Problem**                 | **Rank** | **Why?**                                                                 | **Tools Needed**         | **Neglected?** |  
  |-----------------------------|----------|--------------------------------------------------------------------------|--------------------------|----------------|  
  | **Derivation Oldness**      | 1 (UPSTREAM) | Solves the *formal* core: how \(T \models E\) confirms when \(P(E) = 1\). All other types depend on this. | Probability + modal logic (for modeling logical learning) | Medium – Garber (1983) started this, but few follow-ups using modern tools |  
  | **Construction Oldness**    | 2 (HIGH-VALUE EXPORT) | The "double-dipping" problem – critical for replication crisis, ML overfitting. Solution flows from fixing #1. | Probability + game theory (for incentives) | HIGH – Philosophers ignore applied stats; statisticians ignore philosophy |  
  | **Temporal Oldness**        | 3 (LOW PRIORITY) | Redundant: if derivation is solved, "when you learned E" is irrelevant unless tied to memory (see pet idea). | None – avoid | N/A |  
  | **Memory/Recall Models**    | (SIDECAR TO #1-2) | Your pet idea – viable but narrow; best as an *enhancement* to #1 or #2. | Probabilistic memory models | HIGH – Underexplored in formal epistemology |  

  #### **Defending the Ranking**:  
  - **Derivation is upstream**: Without a logic for how *learning* \(T \models E\) confirms \(T\), construction/temporal cases remain broken. **Tractable** with modal logic (e.g., modeling agents who discover entailments via proof stages).  
  - **Construction is high-value export**: It directly maps to "HARKing" (Hypothesizing After Results are Known) in psychology, p-hacking, and ML overfitting. Solving this shows philosophy’s relevance. **Neglected** because formal epistemologists focus on "toy" examples (Mercury), not real-world bias.  
  - **Temporal is a trap**: Focuses on irrelevant chronology. Even if solved (e.g., with counterfactual credences), it doesn’t fix derivation or construction.  
  - **Memory models are feasible but niche**: Good for a paper, not a dissertation core. More empirical than formal.  

  ---

  ### 3. **Evaluating Your Pet Idea (Memory/Recall)**  
  - **Potential**: Strong for *temporal* and *construction* cases. If you don’t *perfectly* recall \(E\), then \(P(E) < 1\), allowing traditional confirmation. Models could include:  
    - **Memory decay**: \(P(E)\) decreases over time unless reinforced.  
    - **Retrieval uncertainty**: You "recall" \(E\) but assign credence \(P(\text{recall accurate}) < 1\).  
  - **Dead Ends**:  
    - Doesn’t solve *derivation oldness* (if you recall \(E\) perfectly and know \(T \models E\), \(P(E) = 1\) still holds).  
    - Requires psychological assumptions (e.g., how memory degrades) – outside your toolkit.  
  - **Verdict**: Pursue as a **module** within construction oldness (e.g., "when imperfect recall enables double-dipping"). Don’t base your dissertation on it.  

  ---

  ### 4. **Export Value vs. Bayesian Patching**  
  - **Export-Driven Agenda Wins**: Focus on **construction oldness**. The "double-dipping" problem in science (testing a hypothesis on data used to *generate* it) is everywhere:  
    - **Examples**: Neuroscience "voodoo correlations", economics overfitting, p-hacking.  
    - **Link to Your Work**: Show how formalizing "accommodation as old evidence" provides a normative benchmark for data-separation norms.  
  - **Why Avoid Pure Bayesian Patching**: Technical fixes (e.g., counterfactual credences, measure-theoretic tricks) are toolshed debates. Export amplifies impact for postdocs/jobs.  

  ---

  ### 5. **What Could Move the Needle?**  
  - **Up Priority**:  
    - A **formal proof** that construction oldness *necessarily* inflates confirmation (using your derivation solution).  
    - **Empirical work on double-dipping** (e.g., metastudies showing "accommodated" evidence is less reliable) – would boost export value.  
  - **Down Priority**:  
    - A **new no-go theorem** for derivation oldness (e.g., showing logical learning *can’t* confirm without \(P(E)<1\)).  
    - **AI/ML papers** solving overfitting without philosophy (e.g., new regularization methods).  

  ---

  ### **Recommended Two-Year Plan**  
  1. **Year 1: Solve derivation oldness**  
     - Use modal logic to model an agent discovering \(T \models E\) through proof states (e.g., possible worlds where entailment is progressively revealed).  
     - **Deliverable**: Formal system showing \(P(T)\) increases upon learning entailment *even if* \(P(E) = 1\).  
     - **Tool**: Augment Bayesianism with a "discovery operator" \(D(T \models E)\) (cf. Garber-style approaches).  

  2. **Year 2: Apply to construction oldness & export**  
     - Show how "building \(T\) to fit \(E\)" corrupts confirmation *even after* solving derivation.  
     - Formalize "double-dipping" as a game between hypothesis-former and tester.  
     - **Deliverable**: Norms for "evidence freshness" in scientific practice.  
     - **Side Paper**: Memory model for temporal oldness (if viable).  

  **Traps to Avoid**:  
  - **Temporal oldness deep dives** (e.g., "what if Einstein forgot Mercury’s perihelion?").  
  - **Pure Bayesian repairs** without export (e.g., redefining \(P(E)\) via counterfactuals).  
  - **Over-investing in memory models** – they can’t solve the core problem.  

  **Why this works**: Upstream rigor (derivation) + downstream impact (construction) = dissertation that fixes a classic problem *and* engages scientific practice. Use Mercury as the intro, but end with p-hacking in cancer genomics.
