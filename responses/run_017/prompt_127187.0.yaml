  Okay, let me approach this methodically. The user presents a complex translation challenge with very specific constraints and needs. First, I need to understand their background: a professional patent/clinical translator moving into lyrical translation for deeply personal reasons - a memorial project for a deceased friend. Their expertise is in word-for-word fidelity, but they lack formal poetry training.

  The core challenges seem to be:
  - Identifying structural elements that carry meaning vs decorative ones
  - Establishing preservation priorities when conflicts arise
  - Creating transparent documentation for non-expert approval
  - Handling musical constraints for sung pieces

  Hmm, their "prose paraphrase" assumption worries me - that's exactly what causes problems in poetic translation. When they mention refrains representing recurring thoughts or line lengths enacting breathlessness, they're recognizing that form IS content in songs. Their substitution test is a good start but needs refinement for poetic contexts.

  For the decision procedure itself, I consider designing:
  1) A pre-translation analysis checklist focusing on functional form
  2) A dynamic priority system rather than fixed hierarchy
  3) A "fidelity ledger" concept with strict formatting rules
  4) Clear guidelines for musical adaptation with veto thresholds

  The three test cases are deliberately thorny:
  - The village name song forces confrontation of untranslatable cultural anchors
  - The nonsense refrain song highlights non-semantic meaning
  - The tapering song exposes conflict between visual and musical form

  I should emphasize the procedure's limits upfront: it can't replace poetic intuition, can't resolve artistic intent ambiguities, and over-application might homogenize translations. The ledger could indeed become a defensive document rather than an accountability tool if not carefully framed.

  For implementation, I'll need to:
  - Define "load-bearing form" with concrete diagnostics
  - Create weighted decision matrices for conflicts
  - Draft ledger templates with compression in mind
  - Set measurable thresholds for musical viability
  - Provide examples where the procedure says "don't translate"

  Particularly tricky is balancing the daughter's approval role with artistic integrity. The ledger must empower her judgment without requiring poetry expertise. Maybe include recognizable comparison points? ("Like when pop songs change 'I love you' to fit melody")

  The emotional dimension matters here too. This isn't just technical - it's a tribute. The procedure must honor that while remaining practical. I'll position it as honoring choices rather than admitting failure when preserving certain elements proves impossible.
answer: |-
  Below is a complete decision procedure tailored to your constraints: a replicable, documentable process for translating 34 songs under time pressure, balancing fidelity to functional form with approval by non-specialists. It prioritizes **audible impact** over academic perfection and includes safeguards against the ledger becoming the product.

  ---

  ### **THE DECISION PROCEDURE**  
  *(Run once per song, in sequence)*  

  #### **0. PREPARATION**  
  - **Inputs Required:** French lyrics, recording (if available), melody (for sung songs).  
  - **Output:** A translation + a **Fidelity Ledger** (template below).  
  - **Time Allocation:** 1 evening (2–3 hours).  

  ---

  #### **I. PRE-TRANSLATION ANALYSIS: Identify Load-Bearing Form**  
  **Goal:** Isolate form that *changes meaning* if altered. Use these diagnostics:  

  | **Feature**       | **Diagnostic Test**                                                                 | "Load-Bearing" If...                                                                 |
  |-------------------|-------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------|
  | **Rhyme Scheme**  | Remove rhymes. Does the song lose irony, emphasis, or conceptual pairing?          | Rhymes link words central to the song’s argument (e.g., "love" and "grave").         |
  | **Meter/ Rhythm** | Recite prose version aloud. Does pacing alter emotional effect (e.g., urgency)?    | Meter creates tension (e.g., short lines = breathlessness) or mirrors spoken rhythm. |
  | **Repetition**    | Cut repeated lines/words. Does the song’s core idea weaken?                        | Repetition embodies obsession, ritual, or inevitability (e.g., a refrain of grief). |
  | **Line Length**   | Make all lines equal. Does the visual/audible shape still convey the subtext?      | Shape mimics action (e.g., tapering lines = fading voice).                          |
  | **Sound Play**    | Replace assonance/consonance with neutral language. Is atmosphere lost?            | Sound evokes sensory experience (e.g., onomatopoeia of rain).                       |
  | **Proper Nouns**  | Replace name/place with an English equivalent. Does context collapse?              | The noun is a cultural symbol (e.g., "Paris" as myth) or untranslatable anchor.     |
  | **Vocables**      | Translate nonsense syllables ("la la") into words. Does the song’s function break? | They serve non-linguistic roles (e.g., child’s sing-along, dance rhythm).           |

  **Your Assumption Revisited:**  
  *"Form is what I sacrifice first" is the flaw.* **Load-bearing form is content.** Sacrificing it *does* lose meaning. Your substitution test is sound but add: *"Would altering this make the song’s emotional logic incoherent to a listener?"*  
  **Failure Case:** Cultural context. An English reader won’t miss untranslatable French puns. Sacrifice them.  

  ---

  #### **II. SPENDING ORDER: Dynamic Priorities**  
  When conflicts arise, use this hierarchy *unless* Step I shows lower-tier feature is load-bearing:  

  1. **Literal Sense** (Core narrative/intent)  
     *...unless melody forces distortion for singability (see IV).*  
  2. **Load-Bearing Form** (From Step I)  
  3. **Register** (Formality/tone matches original audience)  
  4. **Meter** (General rhythm, not strict syllables)  
  5. **Rhyme**  
  6. **Ambient Form** (Decorative alliteration, syllable count)  

  **How to Decide Without Fixed Ranking:**  
  - **Step A:** List *all* features in conflict.  
  - **Step B:** Apply Step I tests. Tag features as "load-bearing" (LB) or "ambient" (A).  
  - **Step C:** Protect LB features at all costs. Sacrifice lower-priority *ambient* features first.  
  - **Step D:** If LB features conflict (e.g., sense vs. refrain), **preserve the feature most audible to a listener.**  

  **Documentation:** Justify choices in Ledger Column 4 ("Cost").  

  ---

  #### **III. THE FIDELITY LEDGER**  
  A 4-column table per song. **Language must be accessible to an 18-year-old non-Francophone.**  

  | Column 1: Kept          | Column 2: Sold          | Column 3: Cost                         | Column 4: Why? (1 Line)                                  |  
  |-------------------------|-------------------------|----------------------------------------|----------------------------------------------------------|  
  | Core story              | Perfect rhyme in verse 3| Rhyme became slant rhyme               | "Rhyme wasn’t key to the joke here."                     |  
  | Refrain repetition      | 8-syllable meter        | Lines now 6-8 syllables                | "Kept repeats because they show his obsession."          |  
  | Word "light" in chorus | Literal "château"      | "Château" → "old house"               | "The house isn’t famous; the memory is."                 |  

  **Rules:**  
  - Max 5 rows per song.  
  - "Kept/Sold" describe *effect*, not technique (e.g., "the sadness in line 5" not "assonance").  
  - "Cost" states *audible consequence* (e.g., "rhyme lost but beat kept").  
  - **No jargon.**  

  ---

  #### **IV. MELODY ADAPTATION (For Sung Songs)**  
  **Choice Hierarchy:**  
  1. **Match the original idiom** (e.g., French pop) *unless* the family’s singing style demands changes.  
  2. **Your choice:** Adjust syllable crunching/elision to suit the family’s vocal habits.  
  3. **Not your choice:** Altering stressed syllables that change meaning (e.g., "CON-tent" vs. "con-TENT").  

  **The Stop Rule:**  
  > *"If >50% of lines require stuffing/crushing syllables so severely that words become indistinct, or stress falls on articles/prepositions in >3 lines, the song is not singable. Do not translate for singing."*  

  **Actions:**  
  - If unsingable, provide:  
    a) A *literal* translation for the booklet,  
    b) A *prose gloss* explaining the song’s function (e.g., "This was a lullaby for his daughter").  

  ---

  ### **APPLICATION TO YOUR THREE SONGS**  
  **Song 1: Village Name as Rhyme Anchor**  
  - **Analysis:** Name + rhymes are **load-bearing**. Rhymes link memory → place. "Noise" to English ears is the point: it’s a sensory anchor.  
  - **Spending:** Sacrifice rhyme scheme. Keep name + *sense* of wordplay.  
  - **Ledger:**  
    | Kept           | Sold          | Cost                  | Why?                                  |  
    |----------------|--------------|-----------------------|---------------------------------------|  
    | Village name   | True rhymes  | Rhymes are slant      | "Name is the memory; rhymes are decoration." |  
  - **Verdict:** Translate. *Do not* replace name.  

  **Song 2: Nonsense Refrain**  
  - **Analysis:** Vocables are **load-bearing**. Function: child participation. "Translating" them kills the song.  
  - **Spending:** Sacrifice semantic meaning. Keep sounds.  
  - **Ledger:**  
    | Kept                     | Sold          | Cost                  | Why?                                  |  
    |--------------------------|--------------|-----------------------|---------------------------------------|  
    | "La la" refrain sounds | "Meaning"    | No words in refrain   | "You sang this as a child; it stays yours." |  
  - **Verdict:** *No translation of words.* Use original French sounds. Add gloss: "Nonsense chorus for singing along."  

  **Song 3: Tapering Lines**  
  - **Analysis:** Taper is **load-bearing**. It enacts running out of words. But melody blocks taper.  
  - **Melody Test:** If tune forces equal lines, taper is unsingable → **invoke Stop Rule.**  
  - **Ledger (if unsingable):**  
    | Kept                  | Sold         | Cost                  | Why?                                  |  
    |-----------------------|--------------|-----------------------|---------------------------------------|  
    | Short-line feeling    | Exact taper  | Lines equal-length    | "Tune won’t fit shortening. Kept urgency with gasps." |  
  - **Verdict:** If taper is destroyed by tune, **do not translate for singing.** Provide:  
    - *Booklet version:* Translated with taper (ignore melody).  
    - *Sung version (if possible):* New English words fitting tune + taper's *spirit* (e.g., gasp-punctuated phrases).  
    - *Gloss:* "Original lines shortened like fading breath."  

  ---

  ### **WHAT THE PROCEDURE CANNOT DO**  
  1. **Replace poetic intuition:** It flags problems but can’t craft solutions. Requires your fluency but not an "ear."  
  2. **Resolve artistic ambiguity:** When 2 choices are equally valid (e.g., "sad" vs. "heartbroken"), the ledger forces you to pick and justify.  
  3. **Decide intent:** If your friend *would* have prioritized singability over a rhyme, that’s a personal choice. *Document it as such.*  
  4. **Prevent homogenization:** Applying identical rules to 34 songs *will* flatten unique cases. **Countermeasure:** Re-run Step I rigorously per song.  
  5. **Avoid ledger-as-product risk:** If your ledger exceeds 5 rows or uses opaque jargon, it *becomes* the work. **Mitigation:**  
     - Write the translation *first*. Use the ledger only to *explain* tough choices.  
     - If a song needs 10+ justifications, the translation failed. Start over.  

  **Final Note:** This procedure *protects the songs’* ***reasons to exist***. It asks not "What is pretty?" but "What would make this song forgotten if lost?" That is fidelity.  

  ---  
  Execute this with discipline, and your friend’s voice will persist—not as a perfect replica, but as a living artifact. For the 34th song, pour a drink and break the rules once.
