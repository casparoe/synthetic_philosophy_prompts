answer: |-
  Right, you're spot on - the core dispute *is* often about unstated requirements. Your purpose (decision procedure for a bounded, sequential agent facing single or partial gambles) is well-posed and crucial. Let's build the spec from your cases, in British English.

  **Core Purpose:** A decision procedure for a **bounded rational agent**, facing a **single instance** of the Pasadena gamble (or similar), who must decide **now** whether to accept it at a given price, and who may later face opportunities to **sell or hedge** the gamble *partway through its resolution*, based on the information available at that time. The procedure must deliver actionable verdicts at each decision point.

  **Requirements Derivation & Status:**

  1.  **Truncation Continuity:**
      *   **Case:** Finite truncations have well-defined expected utility (oscillating partial sums). The infinite gamble does not (conditionally convergent series).
      *   **Requirement:** *Must* the verdict on the infinite gamble be the limit of the verdicts on the finite truncations as N→∞?
      *   **Status:** **Negotiable (Camp Preference).** Some theories (e.g., weak expectations, some structural views) insist on this continuity. Others (e.g., many permissive-range views, nonstandard views) explicitly reject it, arguing the infinite case is fundamentally different. *Your agent focus:* Bounded agents might naturally think in truncated terms, but the procedure isn't forced to match the finite limit if it has a principled reason not to.
      *   **Bites:** Theories that enforce continuity are constrained by the oscillating partial sums.

  2.  **Strict Dominance (Sure Shifts):**
      *   **Case:** Pasadena vs. Pasadena + £1 (sure gain).
      *   **Requirement:** *Must* the agent strictly prefer Pasadena + £1 to Pasadena alone? A theory saying "indifferent" seems pumpable (trade Pasadena for Pasadena+£1 for free).
      *   **Status:** **Non-negotiable (for avoiding money pumps).** Any adequate procedure must satisfy strict dominance: if gamble A pays strictly more than gamble B in *every* possible state of the world, then A is strictly preferred to B. Indifference here *is* pumpable.
      *   **Bites:** Rules out theories that assign "no value" or "undefined value" in a way that makes them indifferent to strictly dominant improvements. This is fundamental rationality.

  3.  **Bundling & Repetition Robustness:**
      *   **Case:** One Pasadena ticket vs. two independent tickets? Long-run justification impossible (SLLN fails).
      *   **Requirements:**
          *   **(3a) Single-Gamble Focus:** The procedure *must* deliver a verdict for a **single instance** of the gamble. Long-run averaging is irrelevant and unavailable. **(Non-negotiable - core purpose).**
          *   **(3b) Bundling Invariance?** *Should* the verdict on a single Pasadena ticket be identical to the verdict on that ticket bundled with an unrelated gamble with finite expectation? Or can bundling change the "effective" value?
      *   **Status (3b):** **Negotiable (Deep Camp Split).** Expectation-based views (when defined) satisfy this. Permissive-range views often violate it – the context of other gambles can change how uncertainty is resolved. Structural views may be invariant or not depending on the structure. *Your agent focus:* A real agent might evaluate a single opportunity differently than part of a portfolio.
      *   **Bites:** Challenges whether "value" is intrinsic to the gamble or context-dependent.

  4.  **Redescription Invariance:**
      *   **Case:** Selling the gamble described with a rearranged payoff series (e.g., grouping positives first), splitting into stages, or bundled differently.
      *   **Requirement:** *Must* the agent's verdict (accept/reject at price P) be invariant under how the gamble is described or "packaged", provided the underlying mapping from outcomes to payoffs is identical?
      *   **Status:** **Non-negotiable (Rationality Core).** Rational choice should depend on consequences, not descriptions. A procedure yielding different verdicts for the same underlying payoff structure based on redescription is vulnerable to manipulation/framing effects and is arguably irrational. *The invariant feature is the payoff function itself.*
      *   **Bites:** Severely constrains permissive-range and some nonstandard views. Expectation-based views (when defined) and structural dominance views typically satisfy this.

  5.  **Mid-Game Consistency & Dynamic Coherence:**
      *   **Case:** After k tails, the conditional expectation (in natural order) oscillates wildly. An agent valuing by conditional expectation would flip-flop willingness to sell with increasing stakes.
      *   **Requirements:**
          *   **(5a) Sequential Verdicts:** The procedure *must* deliver verdicts (e.g., minimum selling price) **at every possible partial history** (e.g., after each tail). **(Non-negotiable - core purpose, agent lives through time).**
          *   **(5b) No Strict Money Pumps:** It *must* be impossible to construct a finite series of transactions (buying/selling the gamble at different stages based on the procedure's verdicts) that *guarantees* a net loss for the agent. **(Non-negotiable - fundamental rationality requirement).** *Crucially, this does not presuppose expectation-based pricing.* It only requires that the *prices implied by the procedure's valuations* don't create arbitrage opportunities *against the agent*.
          *   **(5c) Dynamic Consistency?** *Should* the agent's *ex-ante* valuation (before any flips) constrain their *interim* valuations (after some tails)? E.g., if they valued it at £X initially, should they value the remaining gamble at £Y after k tails such that X = (Probability of k tails) * Y + ...?
      *   **Status (5c):** **Negotiable (Major Camp Split).** Expectation-based views (when defined) enforce this via the law of iterated expectations. Many alternatives (weak expectations, permissive ranges, structural views) explicitly reject it for conditionally convergent gambles, arguing the value *changes* fundamentally with information. *Your agent focus:* Rejecting (5c) allows valuations to "reset" mid-game, which might reflect how a bounded agent processes the escalating stakes.
      *   **Bites:** The **core challenge**. The oscillation makes (5b) difficult if valuations swing wildly mid-game. (Your arithmetic is correct: Cond. Exp. after k tails ≈ (-1)^k * 2^{k+1} / (k+1) * Harmonic-like term, magnitude growing). *Avoiding money pumps (5b) is the absolute requirement here; enforcing dynamic consistency (5c) is the contentious one.*

  6.  **Handling Unbounded Utility:**
      *   **Case:** With bounded utility (e.g., u(£x) = 1 - exp(-kx)), the series converges absolutely, expectation exists, problem solved.
      *   **Requirement:** *Must* the procedure work satisfactorily for decision-makers whose utility function is genuinely unbounded above and below in the relevant domain (money)? Or is dissolving the paradox via bounded utility an acceptable solution?
      *   **Status:** **Negotiable, but leaning Non-Negotiable for the *paradox*.** For your *stated purpose* (procedure for actual agents), bounded utility is a strong, defensible position – actual humans likely have bounded utility. However, if we take the *paradox itself seriously* as a challenge to decision theory under *unbounded linear utility* (the standard framing), then requiring a solution *without* assuming bounded utility is essential to address the mathematical heart of the problem. *Marked as Negotiable, but excluding it dodges the core theoretical puzzle.*
      *   **Bites:** Decisively dissolves the paradox if allowed. Theories not relying on it must grapple with conditional convergence.

  7.  **Ordinary Case Compatibility:**
      *   **Case:** Gambles with finite expectation (e.g., St. Petersburg *is* allowed to be separate if it has infinite expectation; but finite ones like a fair coin for £1 must be handled).
      *   **Requirements:**
          *   **(7a) Finite Expectation Reproduction:** *Must* the procedure reproduce standard expected utility maximisation for gambles where the expected utility (using the agent's utility function) **converges absolutely**? **(Non-negotiable - bedrock rationality).**
          *   **(7b) Handling St. Petersburg?** *Must* it also handle the St. Petersburg gamble (infinite expectation) satisfactorily? Or is that a separate issue?
      *   **Status (7b):** **Negotiable (Preference/Camp).** Solving Pasadena doesn't oblige solving St. Petersburg. Some theories handle both (e.g., bounded utility, some weak expectations), some handle Pasadena but not St. Pete cleanly (e.g., some permissive ranges based on conditionally convergent sums), some might handle St. Pete but struggle with Pasadena's oscillation. *Marked as Negotiable.*
      *   **Bites:** Ensures the theory doesn't break standard cases. (7b) is an additional challenge.

  **Conflict Analysis & Deliverables:**

  *   **Most Excluding Requirement:** **Redescription Invariance (4).** This immediately rules out many "contextual" or "packaging-dependent" approaches, especially popular permissive-range views where the value depends on how uncertainty is resolved or what other options are present. It forces the value to be tied solely to the payoff function.
  *   **Most Contentious Pair:** **Mid-Game Consistency (5b/c) vs. Truncation Continuity (1) & Redescription Invariance (4).**
      *   Enforcing Truncation Continuity (1) forces valuations towards the oscillating partial sums, making Mid-Game No Money Pump (5b) extremely difficult (your flip-flopping agent *is* pumpable if they act on those wildly swinging valuations).
      *   Strict Redescription Invariance (4) combined with the need for Determinacy/Sequential Verdicts (5a) and avoiding Money Pumps (5b) creates intense pressure. If the "real order" is fixed by the payoff structure (invariance), how can valuation avoid the oscillation inherent in that order without violating dominance or creating pumps? Theories that try to "smooth" the oscillation (e.g., weak expectations) often struggle with invariance or truncation continuity. Theories that embrace context-dependence (violating invariance) to avoid oscillation struggle with the non-negotiable dominance (2) and are seen as irrational framing effects.
  *   **"Arbitrary Price" Feeling:** This is **largely a prejudice stemming from the lack of a unique, stable expected value.** In St. Petersburg, while the expectation is infinite, there *is* a clear (infinite) expectation. In Pasadena, *no* single finite price feels "correct" because the conditionally convergent series lacks the stability of absolute convergence. Any finite price will seem too high in some plausible descriptions/scenarios and too low in others. A satisfactory theory needs to *acknowledge* this instability, but it doesn't mean the theory *can't* prescribe a price or range – it just means that prescription will feel context-dependent or arbitrary *if one was expecting a unique expectation*. It's a symptom, not a core desideratum.

  **Theory Family Scorecard (vs. Requirements):**

  | Theory Family             | Strict Dominance (2) | Redescription Invariance (4) | Mid-Game Verdicts (5a) | No Money Pump (5b) | Mid-Game Consistency (5c) | Truncation Continuity (1) | Bundling Invariance (3b) | Handles Unbounded Util (6) | Ordinary Cases (7a) | Notes                                                                 |
  | :------------------------ | :------------------: | :--------------------------: | :--------------------: | :----------------: | :-----------------------: | :-----------------------: | :----------------------: | :------------------------: | :-----------------: | :-------------------------------------------------------------------- |
  | **Bounded Utility**       |          ✓           |               ✓              |            ✓           |         ✓          |             ✓             |             ✓             |             ✓            |             ✗              |          ✓          | Dissolves paradox but dodges unbounded case.                          |
  | **Weak Expectations**     |          ✓           |        ? (Often ✓)           |            ✓           |         ✓          |             ✗             |             ✗             |             ✓            |             ✓              |          ✓          | (E.g., Easwaran) Assigns limit of CES. Stable price. Struggles with (5c), (1). |
  | **Nonstandard Expectation** |          ✓           |               ✓              |            ✓           |         ?          |             ?             |             ✗             |             ✓            |             ✓              |          ✓          | (E.g., using NSA) Unique "shadow" price. Controversial foundations. Mid-game behaviour? |
  | **Permissive-Range**      |          ✓           |               ✗              |            ✓           |         ✓          |             ✗             |             ✗             |             ✗            |             ✓              |          ✓          | (E.g., Seidenfeld et al.) Value depends on choice context/state space. Violates (4), (3b). Avoids pumps via context. "Arbitrary" feeling. |
  | **Structural/Dominance**  |          ✓           |               ✓              |            ✓           |         ✓          |             ✗             |             ✗             |             ✓            |             ✓              |          ✓          | (E.g., Chow, Nover&Hájek) Value based on dominance. Price is any point dominated to accept/reject. Stable. Violates (1), (5c). "Arbitrary" range. |

  **Key Takeaways for Your Purpose:**

  1.  **Non-Negotiables are Paramount:** Any candidate procedure **must** satisfy Strict Dominance (2), Redescription Invariance (4), deliver Sequential Verdicts (5a), avoid Strict Money Pumps (5b), and handle Ordinary Finite-Expectation cases (7a).
  2.  **The Mid-Game is the Crucible:** The interaction between the oscillation inherent in the gamble, the requirement for mid-game valuations (5a), and the absolute prohibition on money pumps (5b) is the hardest nut to crack. Rejecting Dynamic Consistency (5c) is likely necessary, but *how* valuations are set mid-game without creating pump opportunities is the core design challenge. Theories that allow valuations to "reset" stably after tails (like Weak Expectations or Structural views setting a fixed price) handle this better than those tied to the oscillating conditional expectation.
  3.  **Bounded Utility is a Valid Escape Hatch** for an actual agent, but sidesteps the theoretical puzzle.
  4.  **"Arbitrary Feeling" is Inevitable:** No theory satisfying the non-negotiables will make a single finite price feel uniquely "correct" in the way it does for absolutely convergent gambles. Accepting this is part of accepting the nature of conditionally convergent expected utility under unbounded linear utility.

  This spec clarifies why the debate is intractable: the non-negotiable requirements (especially 4 and 5a/b) are strong, and the nature of the Pasadena gamble (conditional convergence causing oscillation) creates fundamental tension between them, particularly concerning mid-game behaviour and invariance. Theories make different trade-offs on the negotiable points (1, 3b, 5c, 6, 7b) to navigate this tension. Your focus on the sequential, bounded agent highlights why Mid-Game Consistency (5c) is often sacrificied.
