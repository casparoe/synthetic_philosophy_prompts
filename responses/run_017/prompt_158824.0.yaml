  Hmm, the constraints are interesting. Avoiding "qualia" and "zombie" until the end makes sense—those terms come with baggage. The user wants to show the paradox isn't dependent on substance dualism and that identifying phenomenal properties with their realizers exits epiphenomenalism. Also, holding back the Moorean reply until after the paradox is presented. 

  The 3D printer example is clever but might imply design. Needs tweaking to avoid that. The extruder motor causes movement and whine, sensor logs position. Whine is causal dead end. But the artifact framing could suggest intentionality. Maybe reframe it as neural processes? Like neural firing causing both behavior and experience, with experience having no downstream effects. 

  For the session flow: Start with blindsight as contrast—there, reports dissociate from processing, but consciousness still plays a role. Then intro epiphenomenalism: consciousness exists but is causally inert. Use the printer example but strip the artifact language. Emphasize the natural properties point. 

  Key fork: When students say "but consciousness is realized by neural processes, so it inherits causation," that's the exit ramp to property dualism or non-reductive physicalism. Need to clarify that epiphenomenalism denies even inherited efficacy. 

  Predicted misconceptions: Confusing epiphenomenalism with eliminativism, thinking it makes introspection unreliable, or that it's just other minds problem. Stronger students might say perfect correlation equals knowledge. Need to tackle these head-on. 

  Epistemic vs. semantic charges: Probably separate them. First, show the judgment isn't caused by the experience (epistemic). Then question if it's even about the experience (semantic). 

  End question: "If your pain experience doesn’t cause your 'I’m in pain' report, what makes your report about pain rather than the neural causes?" 

  What not to settle: The hard problem itself or alternative theories. Admit it's unresolved but the cost is clear. 

  Labels: Introduce "qualia" and "zombie" in the last 10 mins to show they’re placeholders, not solutions.
answer: |-
  Here’s a structured 90-minute plan designed to make the epistemic paradox of phenomenal judgment land as a *cost* of epiphenomenalism, respecting your constraints while addressing your concerns. The sequence builds dependency, preempts misconceptions, and isolates the paradox before offering escapes.

  ---

  ### **Session Structure & Timing**
  **I. Groundwork: Dissociation without Epiphenomenalism (15 min)**  
  - **Hook:** Revisit blindsight/rivalry. *"In blindsight, visual processing (V1) drives behavior without conscious vision. But does consciousness *itself* still play a causal role in *normal* vision?"*  
  - **Key move:** Distinguish *processing*-report dissociation (blindsight) from *consciousness*-report dissociation (epiphenomenalism). Emphasize: Blindsight shows neural *alternatives* to consciousness; epiphenomenalism says consciousness is *present but idle*.  

  **II. Introducing Epiphenomenalism (20 min)**  
  - **Core claim:** "Some properties produced by brains (call them 'subjective experiences') are *causally inert byproducts*—like engine heat doesn’t propel the car."  
  - **Your 3D printer example—*revised*:**  
    - **Repair:** Strip the designer. *"Imagine a self-assembled system: motor currents move the extruder *and* generate whine. A separate sensor detects extruder position, writes logs. Whine correlates perfectly with position/logs but doesn’t cause logs. Mute whine → logs unchanged."*  
    - **Must have:** Perfect correlation + causal isolation of byproduct (whine).  
    - **Must lack:** Intentionality. Avoid calling logs "about" whine. Say: "Logs track position; whine is a side effect."  
  - **Fork on realization/identity:**  
    - *"If whine just *is* the motor’s vibration (identical), it *inherits* causal power. But epiphenomenalism says subjective experiences are *distinct properties*—not identical to neural vibrations, not causing anything."* Place this **here** to block the "inheritance" exit early.  

  **III. The Paradox of Phenomenal Judgment (25 min)**  
  - **Set-up:** *"You stub your toe. Neurons (N) fire, causing (1) pain experience (P) and (2) 'I’m in pain!' report (R). Epiphenomenalism: P is caused by N, but P causes nothing. R is caused *only* by N."*  
  - **The bite:**  
    - **Epistemic charge:** *"If P doesn’t cause R, why think R is *based on* P? Isn’t R 'ungrounded'?"*  
    - **Semantic charge:** *"If R is only caused by N, isn’t R *about* N, not P? How can R refer to P?"*  
    - **Run them together initially** to show the weight: *"Your 'pain' report isn’t caused by pain, and might not even be *about* pain—it’s about neural states."*  
  - **Preempt "correlation = knowledge":**  
    - *"Perfect correlation ≠ justification. A thermometer perfectly correlates with temperature but isn't *justified*; its design links it to temp. If R is only caused by N, not P, what 'design' links R to P?"*  

  **IV. Misconception Mitigation (Embedded throughout)**  
  | **Misconception** | **When to Preempt** | **Response** |  
  |-------------------|---------------------|--------------|  
  | "Eliminativism" | During Intro (II) | *"Epiphenomenalism *affirms* consciousness exists! It just says it’s causally idle."* |  
  | "Introspection is unreliable" | During Paradox (III) | *"It’s not that we’re *wrong* about experiences—it’s that our reports aren’t *responses* to them."* |  
  | "Problem of other minds" | During Groundwork (I) | *"Other minds asks 'How do I *know* you have P?'. Here, we grant you have P, but ask 'How does *your* brain know?'"* |  
  | "Reports would be noise" | During Paradox (III) | *"Reports are reliable—but reliable *about N*, not P. The content is mismatched."* |  

  **V. The Labels: Qualia & Zombies (Final 10 min)**  
  - **Why wait?** Avoid stock reactions. Now they’ve felt the paradox.  
  - **Handover:**  
    - *"Some call these properties 'qualia'—raw feels, stripped of causal roles. Epiphenomenalism says qualia are real but inert."*  
    - *"A 'zombie' is physically identical but lacks qualia. By epiphenomenalism, zombies act exactly like us—since qualia change nothing."*  
  - **Connect to cost:** *"Zombies show: if consciousness does nothing, its absence changes nothing. But *we* think it matters—hence the paradox."*  

  **VI. Moorean Reply & Open End (5 min)**  
  - **Final question:** *"If your pain report isn’t caused by pain, what *does* make it a report *about pain*?"* (Tests if they grasp semantic charge.)  
  - **Refuse to settle (say this aloud):**  
    > *"We won’t resolve the hard problem today. I want you to sit with this: epiphenomenalism saves consciousness from reduction, but at the cost of making our deepest certainty—that we know our own minds—miraculous. Whether that’s a bullet to bite or a reason to reject the view is where the real work begins."*  

  ---

  ### **Why This Works**  
  - **Dependency Structure:**  
    1. **Blindsight contrast** → Shows dissociation ≠ epiphenomenalism.  
    2. **Printer example** → Illustrates causal isolation *without* dualism.  
    3. **Fork on realization** → Blocks the identity escape early.  
    4. **Paradox construction** → Builds from neural causes to epistemic/semantic rupture.  
    5. **Labels last** → Prevents jargon from diluting the logic.  
  - **Carrying the Argument Without Labels:** Achieved by using "subjective experiences," "conscious properties," or "what-it’s-like" until the end.  
  - **Artifact Fix:** Removing "designer" and "aboutness" from the printer avoids smuggling intentionality. Keep it—it’s concrete.  
  - **Predictable Strong-Student Move:** Address "correlation = knowledge" by demanding a *causal-inferential link* (not just correlation).  

  ### **Additional Misconceptions to Watch For**  
  - **"But science studies reports, so consciousness is irrelevant!"** → Reply: *"Science studies *correlates* of reports. Epiphenomenalism says consciousness is one of those correlates—but why care if it does nothing?"*  
  - **"This implies dualism!"** → Reiterate: *"Natural properties can be distinct without being spooky. Heat isn’t motion, but both are physical."*  

  This plan forces engagement with the paradox as a *theoretical cost* (not a curiosity) by anchoring it in their prior knowledge while systematically closing exits. The printer example—stripped of teleology—does the heavy lifting without dualist baggage.  

