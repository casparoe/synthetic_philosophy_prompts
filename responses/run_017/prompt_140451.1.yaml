  Okay, let me try to unpack this user's problem. They're in a philosophy-of-science reading group that's been stuck for eight weeks debating unrealistic assumptions in models. The Friedman side argues that assumptions don't need to be realistic as long as predictions work, while the other side worries about explanation, transferability, and policy design. The user has proposed a three-way categorization of assumptions: relaxable, load-bearing, and substitutive. They want to know if this distinction holds up and why the debate is deadlocked.

  First, I need to really grasp their three categories. Relaxable assumptions seem straightforward—small changes don't alter the model's core outcomes. Load-bearing ones are critical; changing them flips the results. Substitutive is trickier—these aren't approximations but stand-ins for something unformulable, like representative agents. The user suspects the endless debate conflates these three scenarios.

  The historian in their group thinks this is just de-idealizability in new terms. But the user feels it's different. Why? Maybe because de-idealizability often implies you can approach reality step-by-step, while substitutive assumptions represent a different kind of abstraction where no such path exists. That's a key point to explore.

  Now, looking at their examples. The housing market model with identical landlords: the rent cap policy fails because heterogeneity was ignored. That's a load-bearing assumption—it was crucial for the new context. The epidemic model's perfect mixing: even though false, it works for early curve prediction and hospital sizing. But is this substitutive? Perfect mixing isn't an approximation; it's a necessary simplification for tractability. There's no "more realistic" version that's computationally feasible, so it's substitutive. 

  The user’s hypothesis is that each type of assumption resolves the debate differently. For relaxable, instrumentalists are right; for load-bearing, critics are right; substitutive requires a different framework. That makes sense. The stalemate might be because both sides are talking past each other, not recognizing these categories. Friedman's examples (billiards, leaves) are likely substitutive—as-if reasoning without mechanism. But critics point to cases where assumptions are load-bearing, like the rent cap. So the disagreement isn't just about assumptions but about what kinds of models are being discussed.

  Is the distinction between the three types robust? Relaxable and load-bearing are clear in terms of outcome stability when perturbed. Substitutive is different because it's about the nature of the simplification—not approximating reality but enabling computation. The collapse point might be when we ask: can we always categorize an assumption neatly? For example, in complex systems, whether an assumption is relaxable or substitutive might depend on available methods. But the categories still serve a purpose in diagnosing why a model fails or succeeds.

  The deeper stalemate might stem from differing goals. Instrumentalists prioritize prediction in a specific domain, while critics care about explanation and transfer. The user’s three-way split forces both sides to specify which context they're addressing. Progress could come from case studies analyzing real models through this lens, showing when assumptions fall into which category and how that affects model performance. Formal frameworks, like stability analysis under perturbations, might help distinguish relaxable from load-bearing. For substitutive, developing a theory of how these assumptions function as tools rather than truth-claims could shift the debate.

  The user’s frustration about only having intuitions is telling. The econ student's point that they're "asking the wrong question" might mean that without clarifying the model's purpose and assumption types, the debate is meaningless. So progress might involve mapping each argument to the appropriate category, recognizing that substitutive assumptions require a different justification—not truth, but utility.
answer: |-
  Your three-way distinction isn't just recycled de-idealizability—it's a sharper diagnostic tool that exposes why the Friedman debate persists. The stalemate isn't primarily verbal, nor is it about models' *goals* (prediction vs. explanation). It's a **clash of intuitions about model fragility**, amplified by the fact that *different types of assumptions fail differently under stress*. Your taxonomy holds because it captures distinct failure modes. Here's the pressure test:

  ### Where Your Distinction Holds (and Why It Matters)
  1.  **Relaxable Assumptions (e.g., negligible transport costs):**
      *   **Robustness:** Perturbation analysis works. Adding small transport costs slightly shifts equilibrium prices without altering the supply/demand mechanism. Friedman's instrumentalism triumphs here. Critics arguing "but it's false!" *are* making noise because the inaccuracy is irrelevant to the model's predictive success *within its intended scope*.
      *   **Collapse Point?** Only if the perturbation reveals hidden non-linearities or coupling with other assumptions. But by definition, if the *core result* survives, it's relaxable.

  2.  **Load-Bearing Assumptions (e.g., homogeneous landlords in rent control):**
      *   **Fragility:** Relaxation isn't gradual—it's catastrophic. Introducing landlord heterogeneity (e.g., varying debt levels, vacancy tolerance) doesn't just tweak the rent cap outcome; it fundamentally changes the *qualitative* prediction. A model predicting a small supply reduction might flip to predicting massive withdrawals or strategic conversions under the cap. The critic is vindicated: the assumption wasn't just unrealistic, it *generated* the artifact.
      *   **Collapse Point?** If "heterogeneity" can be captured by a simple distribution *without changing the model's core mechanism*. But in your housing example, heterogeneity likely interacts with strategic behavior in ways the representative agent framework *cannot* capture—making it paradigmatically load-bearing.

  3.  **Substitutive Assumptions (e.g., perfect mixing, representative agent):**
      *   **Tractability vs. Truth:** This is the crux. There *is no* sequence of small steps to "true" heterogeneous agents or non-random mixing that retains tractability for complex systems. The assumption isn't approximating a knowable reality; it's *enabling computation* by substituting an intractable mess with a mathematically manageable fiction.
      *   **Friedman vs. Critic Stalemate:** Friedman is right that it predicts (e.g., early epidemic curves) *despite* being "unrealistic." The critic is right that it fails for explanation/intervention (e.g., designing targeted lockdowns requires understanding *who* mixes with whom). Neither vocabulary fits: It's not about "as-if" truth (Friedman) nor "propagating falsehoods" (Critic). **It's a computational shortcut imposing structural blindness.** The model succeeds *because* it ignores details, but fails when those details become relevant.
      *   **Collapse Point?** If a tractable "less false" version emerges (e.g., simple network models replacing perfect mixing). But often, increased realism explodes complexity. The distinction holds because the *reason* for the assumption is different: not ignorance of a simpler truth, but computational intractability of a complex one.

  ### Why the Stalemate? It's Not One Argument, It's Three
  The decades-long debate persists because Friedmanites point to **Relaxable/Substitutive** cases (billiards, leaves, early epidemics) where prediction works despite "unrealism." Critics point to **Load-Bearing** cases (like your rent cap, or macroeconomic models failing during crises) and **Substitutive** failures (epidemic models for targeted interventions). **They're all correct *for the specific types of assumptions they have in mind*, but talk past each other by not distinguishing them.**

  The historian is *partly* right—this relates to de-idealizability—but your split adds crucial nuance:
  *   **Relaxable:** De-idealizable *without structural change*.
  *   **Load-Bearing:** De-idealizable *only with structural change* (i.e., the model breaks).
  *   **Substitutive:** *Not de-idealizable in practice* due to tractability limits. It's a different *kind* of idealization.

  ### Diagnosing Your Cases
  1.  **Housing Model & Rent Cap:**
      *   **Assumption:** Homogeneous landlords (Representative Agent).
      *   **Type:** **Load-Bearing** in the policy context. Heterogeneity isn't a perturbation; it's central to behavioral responses under a cap. The model's prediction was an artifact of the assumption.
      *   **Why the Stalemate?** The Friedmanite might say "It predicted rents well for 10 years! That's success!" The critic retorts "But it misled us on policy!" Both are right, but about different things: *past predictive success* vs. *robustness for novel interventions*. Your taxonomy shows *why* it failed: the assumption was load-bearing *for the new question*.

  2.  **Perfect Mixing Epidemic Model:**
      *   **Assumption:** Perfect mixing.
      *   **Type:** **Substitutive.** Nobody believes it, but modeling true contact networks is intractable for large populations. It works for early growth rates/hospital capacity *because* those are aggregate outcomes often dominated by mean-field behavior.
      *   **Why the Stalemate?** Friedmanite: "It predicted the curve, who cares if mixing is 'true'?" Critic: "But it can't tell us *where* to intervene!" The model is a **tool for specific tasks** (predicting aggregate totals), not a claim about mixing mechanisms. Calling its assumption "false" misses its point—and its limitations.

  ### Paths to Progress (Beyond More Arguing)
  1.  **Adopt Your Taxonomy Explicitly:** In your group, force specificity: *"Is this assumption relaxable, load-bearing, or substitutive in this context?"* This moves beyond "unrealistic = bad/good."
  2.  **Case Studies with Perturbation Analysis:** Don't just debate abstractly. Take a concrete model (e.g., your housing model). *Try* to relax the homogeneity assumption:
      *   Can you add a *small* amount of heterogeneity without changing core results? (Relaxable).
      *   Does even minor heterogeneity drastically alter the rent cap outcome? (Load-Bearing).
      *   Is modeling true heterogeneity computationally infeasible, forcing you back to a representative agent? (Substitutive).
  3.  **Formalize "Fragility":** Borrow from complexity science or robust control theory. Analyze how *sensitive* model outputs are to specific assumptions. High sensitivity → Likely Load-Bearing. Low sensitivity → Likely Relaxable. Intractable sensitivity analysis → Suggests Substitutive.
  4.  **Focus on *When* Models Fail:** The key isn't whether assumptions are "unrealistic," but *under what conditions* that unreality matters. Your taxonomy predicts failure modes:
      *   Relaxable: Fails under large perturbations/extreme conditions.
      *   Load-Bearing: Fails when the assumption is stressed *or* when the model is transferred.
      *   Substitutive: Fails when the system's behavior depends on the structure the assumption erased (e.g., network effects in epidemics).
  5.  **Shift from "Truth" to "Adequacy for Purpose":** For Substitutive assumptions, the question isn't "Is it true?" but "Is the computational trade-off worth it for the task at hand, and what tasks does it preclude?" This reframes the debate pragmatically.

  **Conclusion:** Your three-way split is robust and reveals the stalemate's core: Friedmanites emphasize models where assumptions are Relaxable or Substitutive, critics focus on Load-Bearing or Substitutive failures. Progress comes by **mapping the terrain of model fragility** using your distinction. Stop asking "Are unrealistic assumptions acceptable?" Start asking: "*What kind* of unrealistic assumption is this, and *how* will it fail when pushed?" That’s how you move beyond intuitions and gut feelings. The econ student is half-right—you *were* asking the wrong question. Your taxonomy provides the right one.
