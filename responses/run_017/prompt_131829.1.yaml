  Node 6: In a real-life case, an agent has strong reasons not to do X (e.g., not to steal) but does X anyway. If we found the same kind of neural antecedents as in Libet, would that mean the action was not free? (Yes/No)

  Node 7: In the same real-life case, if the agent had vetoed the action (so didn't steal) and we found neural antecedents for stealing that were then vetoed, would that show the agent was responsible for resisting? (Yes/No)

  Node 8: Consider a complex decision, like accepting a job offer, with long deliberation. If neural activity predicted the outcome long before the reported decision, would that undermine responsibility? (Yes/No)

  We have 8 nodes. We can add two more if needed.

  Now, we must map the paths to the leaves.

