  **Debrief (60-90 min):**

    We map specific moments to the claims:

    1. **Mises's claim**: Without money prices for factors of production, planners have no common denominator for comparing heterogeneous inputs and techniques.
          - In our game, the CPB sets prices for all goods, including inputs (Grain, Scrap Metal) and capital goods (Machines). But note: the quality of Grain is hidden. The CPB sees only one price for Grain, but there are two qualities with different productivities. This causes a problem when Machine Builders require High-Quality Grain: the CPB cannot differentiate by quality, so they set one price. This means that Farmers have an incentive to produce Low-Quality Grain (cheaper) but then the Machines break. The lack of a price differential for quality means that the planners cannot efficiently allocate resources for quality-sensitive uses.
