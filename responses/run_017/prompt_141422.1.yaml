      - The surprise card and the hidden quality dial show where it strains: the board cannot set a price for a new good instantly (they have to start from 0 for Scrap Metal and then adjust, but initially there might be huge shortages). Also, the hidden quality means that even with the right aggregate quantity, the quality might be wrong for the intended use.

    **What the game cannot reproduce** (to be covered in the last 15 minutes):
