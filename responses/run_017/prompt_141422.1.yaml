  Below is a complete design for your 90-minute seminar activity, optimized for experiential learning and debate preparation. The activity simulates a market-socialist economy with dispersed knowledge, hidden quality choices, and unexpected shocks.

  ---

  ### **Activity: The Trial & Error Planning Game**
  **Objective:** Students experience the challenges of central planning through a multi-round simulation where knowledge is dispersed, quality is hidden, and surprises disrupt plans.

  #### **Materials & Setup**
  1. **Roles** (26 students):
     - **Central Planning Board (CPB)**: 4 students (sets prices, aggregates reports).
     - **Farmers**: 8 students (produce grain; choose hidden quality).
     - **Widget Makers**: 8 students (produce widgets; choose hidden quality).
     - **Machine Factory**: 6 students (build durable machines; later require a new input).
  2. **Goods & Prices**:
     - **Grain** (produced by Farmers), **Widgets** (produced by Widget Makers), **Machines** (produced by Machine Factory), **Scrap** (by-product of grain, initially worthless).
     - CPB announces prices for all goods before each round. Initial prices: Grain = 5, Widgets = 3, Machines = 20, Scrap = 0.
  3. **Index Cards**:
     - **Firm Cards**: For orders (buy/sell) and production choices (quality dial).
     - **CPB Tally Sheet**: To aggregate orders and calculate shortages/surpluses.
  4. **Payoff Scheme**:
     - **Firms**: Earn points = (revenue from sales) - (input costs). Bonus: +10 points for using/producing **durable/high-quality** versions (hidden incentive). Rankings displayed on a leaderboard.
     - **CPB**: Scored on minimizing total shortages/surpluses. Goal: Keep aggregate excess demand/supply below 15 units per good.

  #### **Rules**
  - **CPB Rules**:
    - **Allowed**: Announce prices, adjust them based on shortages/surpluses, and report aggregate totals.
    - **Not Allowed**: Ask firms about local information (e.g., "Why did you order this?"), request quality data, or share individual firm reports.
  - **Firm Rules**:
    - **Private Information**: Quality choices (durable/shoddy) and input needs are secret. Only report buy/sell quantities.
    - **Production**:
      - **Farmers**: Choose to produce 10 units of **durable grain** (cost=3) or 15 units of **shoddy grain** (cost=2). Scrap produced: 1 unit per 5 grain.
      - **Widget Makers**: Choose to make 12 **durable widgets** (cost=4) or 20 **shoddy widgets** (cost=3). Require 1 grain per 5 widgets.
      - **Machine Factory**: Build 1 machine (cost=10) using 5 grain. Machines last 2 rounds. **Durable machines** (from durable grain) give +5 user bonus; **shoddy** (from shoddy grain) break after 1 round.
    - **Surprise Card**: Drawn in Round 3. "Scrap is now essential! Machine factories need 2 scrap per machine. Widget makers can use scrap to make advanced widgets (+2 points/unit)."

  #### **Timeline (90 Minutes)**
  1. **Setup (5 min)**:
     - Assign roles. Distribute rulesheets and cards.
     - Explain: "You are firms/planners. Maximize your points. CPB sets prices but can't ask about your secrets."

  2. **Round 1 (15 min)**:
     - CPB announces initial prices.
     - Firms secretly choose quality and submit orders (e.g., "Buy 5 grain, sell 10 widgets").
     - CPB aggregates orders, calculates shortages/surpluses (e.g., total grain demand = 60, supply = 50 → shortage = 10).
     - **CPB adjusts prices**: Shortage → raise price; surplus → lower price.

  3. **Round 2 (15 min)**:
     - Repeat Round 1. Machines built now are used in Rounds 3–4.

  4. **Round 3 (15 min)**:
     - **Surprise Card Drawn**: Scrap is now valuable. CPB adds a price row for scrap (starts at 0).
     - Firms adapt: Machine factories need scrap; widget makers can use scrap for bonuses.
     - CPB adjusts prices (scrap starts at 0, likely shortages emerge).

  5. **Round 4 (15 min)**:
     - Final round. Durable machines from Round 2 boost production; shoddy ones break.
     - CPB announces final prices and tallies shortages/surpluses.

  6. **Debrief (25 min)**: See below.

  ---

  ### **Debrief Framework**
  **Goal:** Connect game moments to core debates. Highlight both the promise and limits of market socialism.

  #### **1. Mises’s Claim (No Prices = No Common Denominator)**
  - **Evidence from Game**: CPB sees only aggregate shortages, not *why* they occur (e.g., a grain shortage could be due to low quality, not low quantity). When scrap becomes essential, CPB has no price to guide allocation → chaos ensues.
  - **Staged or Generated?** **Generated**. CPB couldn’t compare heterogeneous inputs (scrap vs. grain) or techniques (durable vs. shoddy) without prices. Students see CPB struggling to set "fair" scrap prices.

  #### **2. Hayek’s Claim (Knowledge is Dispersed/Unstatable)**
  - **Evidence from Game**: Widget makers hide quality choices; farmers know their grain durability but can’t communicate it; the surprise card forces localized adaptation (e.g., machine factories scrambling for scrap).
  - **Staged or Generated?** **Generated**. Students *feel* their private info (e.g., "I chose shoddy grain to save costs, but now machines are breaking") can’t be conveyed to CPB.

  #### **3. Market-Socialist Reply (Iterative Pricing Works)**
  - **Evidence for Force**: In Rounds 1–2, CPB converges toward equilibrium for grain/widgets by adjusting prices. Shows trial-and-error *can* work for simple goods.
  - **Where It Strains**: Surprise card and quality dial break the system. CPB can’t price scrap quickly (no prior data), and hidden quality distorts signals (e.g., surplus widgets reported, but all are shoddy and unwanted).
  - **Participant Takeaway**: Students feel both the elegance of price iteration (it works for static goods) and its fragility (fails with novelty/hidden info).

  #### **What the Game Can’t Simulate (Cover in Final 15 Min)**
  - **Entrepreneurship/Speculation**: Players react but don’t anticipate shocks (e.g., no one hoards scrap pre-surprise). *Supply*: Discuss Kirzner’s alertness.
  - **Time Preference/Investment**: Machine durability creates lagged effects, but students discount future gains. *Supply*: Explain Bohm-Bawerk on time horizons.
  - **Capital Heterogeneity**: Over-simplified goods (4 types). *Supply*: Show Mises’s "calculation problem" with diverse capital.
  - **Profit Maximization**: Students need incentives (points) to act as firms. *Reality*: Real managers may not optimize.

  ---

  ### **Predictable Problems & Fixes**
  1. **CPB Asks Firms for Info**:
     - **Fix**: Ban it upfront. Penalize CPB 10 points if they ask for private data.

  2. **Hoarding**:
     - **Fix**: Impose storage costs (e.g., "hold 10 grain? Lose 2 points"). CPB sees hoarding as surplus and lowers prices.

  3. **Quality Dial Ignored**:
     - **Fix**: Link quality to big bonuses (+10 points for durable). Announce leaderboard rankings to incentivize competition.

  4. **Arithmetic Takes Too Long**:
     - **Fix**: Pre-made tally sheets for CPB. Use index cards with checkboxes (e.g., "Selling Grain: ___ Units"). Enforce 2-minute time limit.

  5. **20 Minutes Behind?**:
     - **Cut Round 4** (least critical). Focus on Rounds 1–3 and surprise card.

  ---

  ### **Why This Works**
  - **Dispersed Knowledge Achieved**: Firms hold local secrets (quality, input needs) that only affect outcomes through actions.
  - **CPB Simulates Lange**: Adjusts prices on excess demand without probing firms.
  - **Hidden Quality & Surprise Card**: Force students to confront Hayek/Mises critiques organically.
  - **Low Tech, High Engagement**: Index cards and leaderboards create competitive energy.

  This design ensures students "run into the mechanism," setting up a nuanced debate where they’ve lived both sides. Run it tight, debrief deep, and lean into the chaos!
