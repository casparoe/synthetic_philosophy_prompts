prompt: |-
  I convene a standing committee that issues one-page joint public statements on behalf of a city-wide coalition: three neighborhood associations, a hospital, a school district, and two labor unions, nine votes in total, each with an effective veto. We meet for two hours a month, our drafts go past a lawyer but not a philosopher, and the finished text is read aloud at press conferences and quoted in local news, so it has to be intelligible to a reader with no training and short enough to fit on a single page. Our recurring failure mode is not that members are unreasonable but that on nearly every topic — a new homeless shelter, a school closure, a police shooting, a chemical plant's emissions permit, a donor's name on a hospital wing — each delegate arrives with a sentence the others experience as a flat falsehood, and we either deadlock, or we paper over the disagreement with vague compromise language that the local paper mocks and that none of the member organizations actually endorses. I have been reading about the Jain doctrine of many-sidedness in a survey course — anekāntavāda, the standpoint-relative theory of nayavāda, and the logical instrument of syādvāda with its sevenfold scheme of conditional predication, where a given predicate can hold of a subject in one respect, fail in another, hold and fail successively under two respects, or be inexpressible when both are pressed into a single assertion, and combinations of these — and I want to know whether it can be turned into something my committee can actually run rather than admire.

  What I need is a procedure: the questions to ask, in order, about a contested claim; what counts as a sufficient answer to each; where the procedure terminates in a flat assertion; and where it hands the decision to a person because the question is one of values rather than of aspects. Please build it around a few concrete mechanisms I have been sketching and tell me if they are the right ones. First, a standpoint ledger: for each disputed sentence, name the respect — whose interests, what time scale, what comparison class, what part or aspect of the subject — under which each delegate's claim is true, and require that a claim be marked unattached when no one can produce a respect under which it holds, since I suspect a good half of our disputes are claims whose speakers have simply never been asked to say in what respect. Second, an explicit sorting step that runs before the ledger, because my worry is that we would apply many-sidedness to disagreements that are not aspectual at all: some of our disputes seem to be straightforwardly empirical and should be settled by asking for a number and a baseline, some are disputes about the sense of a single word (safe, harm, community, consent) that should be settled by disambiguation, and only the remainder are genuine cases where incompatible claims are each correct from a defensible standpoint. Third, a collapse rule: a test for when the qualified, sevenfold treatment must collapse back into a plain, unhedged assertion, including the case where a delegate's claim rests on a factual falsehood that the rest of us can refute, and the harder case where the standpoint a claim is true from is itself one we should refuse to adopt — a claim true only from the perspective of someone who denies another party's standing or personhood. Fourth, a set of drafting rules for what a signed statement may look like when many-sidedness genuinely survives: whether we conjoin qualified claims, whether we attribute each claim to the party who holds it, whether we assert in a respect that is nobody's in particular, how we say in one page that a thing is and is not without looking evasive to a reader who has never heard of the doctrine, and above all how a non-absolutist description gets converted into a recommendation, since our statements almost always end in a request for some action and the reader will not accept a sevenfold answer to the question of whether the shelter should open.

  Please also flag, honestly, what this procedure cannot do and where judgment cannot be eliminated: my vice-chair's objection is that any method built on inexpressibility is a license for weasel wording, and my own is that the whole apparatus may just be relativism with better manners, or the journalistic habit of quoting both sides with an Indian vocabulary attached, and I would like the procedure to contain its own guards against those failure modes rather than trusting the goodwill of the drafter. Then run it on three of our pending items. The first: a statement on a drop-in center for homeless residents, where the neighborhood association says the area has become unsafe, the service providers say it has not, and the police have published three years of incident data that neither side has looked at. The second: a statement on whether to remove a benefactor's name from a hospital wing, where one faction's sentence is that he was the greatest friend this city ever had and the other's is that he was a segregationist who enriched himself through discriminatory lending — a case that looks to me like the textbook illustration, two true predicates about one man, except that we still have to vote on taking the name down. The third is the one I expect to dislike: a member organization is pressing us to say in the joint statement that a contested public-health question is genuinely open, when the relevant scientific bodies are not in fact divided, and I suspect the correct output of your procedure is either a statement that names that claim as false or no statement at all, which will cost us a signatory. What I want is the procedure, its failure modes, and those three worked applications, written so that a committee with no philosophical training could follow it in two hours.
reasoning: |-
  We are designing a procedure for a standing committee to draft joint public statements that are intelligible, one-page, and endorsed by all members (each having a veto). The committee includes diverse stakeholders: neighborhood associations, a hospital, a school district, and labor unions. The recurring problem is deadlock or vague compromise language that is ineffective and unendorsed.

  The procedure will incorporate the Jain concepts of anekāntavāda (many-sidedness), nayavāda (standpoint relativity), and syādvāda (the sevenfold scheme of conditional predication). The goal is to resolve disputes by clarifying the respects in which each claim is true and to produce clear, actionable statements.

  The procedure has four main components as requested:

  1. **Standpoint Ledger**: For each disputed claim, identify the respect (e.g., whose interests, time scale, comparison class, part/aspect of the subject) under which it holds. Claims without a defensible respect are marked unattached and may be discarded.

  2. **Sorting Step**: Before applying the ledger, sort the dispute into one of three categories:
     - **Empirical Disputes**: Settled by data (e.g., numbers, baselines).
     - **Semantic Disputes**: Settled by disambiguating key terms.
     - **Aspectual Disputes**: Suitable for the standpoint ledger and syādvāda.

  3. **Collapse Rule**: Determine when a qualified claim must collapse to an unhedged assertion. This includes:
     - When a claim is factually false (refuted by evidence).
     - When the standpoint from which a claim is true is morally unacceptable (e.g., denies personhood).

  4. **Drafting Rules**: For statements that survive with many-sidedness:
     - Use clear language to express qualified claims without excessive jargon.
     - Attribute claims to specific parties only if necessary for clarity, but aim for a unified voice.
     - Conjoin qualified claims when multiple aspects are relevant.
     - For recommendations, base them on shared values or an ethical framework that transcends the aspects.

  Additionally, we must address potential failure modes:
  - **Weasel Wording**: The procedure must avoid vague language that obscures rather than clarifies. The ledger and collapse rule should force specificity.
  - **Relativism**: The procedure must not imply that all claims are equally valid. Collapse rules and sorting step will reject false or morally unacceptable claims.

  The procedure will be structured as a series of steps:

  ### Step-by-Step Procedure

  1. **Identify Disputed Claims**: List the specific sentences that delegates bring to the table.

  2. **Sort the Dispute** (for each claim):
     - **If Empirical**: Ask for data. If data is available and decisive, use it to settle the claim. If not, treat as aspectual or note uncertainty.
     - **If Semantic**: Define the key term in context. Choose the most relevant definition or note multiple definitions if necessary.
     - **If Aspectual**: Proceed to the standpoint ledger.

  3. **Standpoint Ledger** (for each aspectual claim):
     - For the claim, ask: "In what respect is this claim true?" (e.g., "For whom?" "Under what conditions?" "In what part?")
     - Record the respect for each delegate's claim. If no respect can be provided, mark as unattached and set aside (unless it can be rephrased).
     - If a claim is true only in a respect that is factually false (e.g., based on incorrect data) or morally unacceptable (e.g., denies human rights), it collapses to false and is discarded.

  4. **Syādvāda Application** (for aspectual claims that survive):
     - For the subject and predicate, use the sevenfold scheme to frame the claim conditionally. However, for practical purposes, we will simplify to:
       - Claim holds in respect X.
       - Claim does not hold in respect Y.
       - Claim both holds and does not hold (in different respects).
       - Claim is inexpressible (if respects X and Y cannot be simultaneously asserted without contradiction, but this is rare and may be avoided by clear drafting).
     - The goal is to produce a statement that acknowledges the multiple aspects without being confusing.

  5. **Drafting the Statement**:
     - **For Empirical/Semantic Resolutions**: State the fact clearly.
     - **For Aspectual Claims**: Use phrases like:
       - "From the perspective of [group/respect], ..."
       - "In terms of [criterion], ... but in terms of [another criterion], ..."
       - Avoid "on the one hand ... on the other" if it leads to indecision. Instead, be direct: "While [A] is true for [X], [B] is true for [Y]."
     - **Recommendations**: Base the call to action on shared principles (e.g., safety, equity, community welfare) that all members endorse. The recommendation should not be sevenfold; it must be clear and univocal. The many-sided analysis informs the recommendation but does not paralyze it.

  6. **Collapse to Decision**:
     - If after analysis, one aspect is overwhelmingly supported by evidence and ethics, collapse to a single assertion.
     - If a standpoint is unacceptable, reject it and do not include the claim.

  7. **Voting and Endorsement**:
     - Each delegate must agree that the statement accurately reflects their position in the respects identified and that the recommendation is acceptable. If not, revisit.

  ### Failure Modes and Guards
  - **Weasel Wording**: Guard by requiring that every qualified claim must specify the respect. If a respect is too vague (e.g., "in some ways"), reject it. The collapse rule also forces unhedged assertions when possible.
  - **Relativism**: Guard by the collapse rule (rejecting false or unethical standpoints) and by grounding recommendations in shared values.
  - **Time Constraints**: The chair must enforce time limits. If a dispute cannot be resolved in the allotted time, table it or issue a shorter statement acknowledging the disagreement and deferring the recommendation.

  ### Worked Examples

  #### 1. Drop-in Center for Homeless Residents
  - **Disputed Claims**:
    - Neighborhood association: "The area has become unsafe."
    - Service providers: "The area has not become unsafe."
  - **Sorting**: Empirical dispute. Both claims are about a factual change in safety.
  - **Resolution**: 
    - Ask for data: Police incident data for the area over the past three years, compared to a baseline (e.g., before the center opened or a comparable area).
    - Analyze: If data shows a significant increase in incidents, the neighborhood claim holds; if not, the service providers' claim holds. If the data is mixed (e.g., some types of incidents up, others down), treat as aspectual.
    - **Aspectual if mixed data**:
      - Standpoint Ledger:
        - Neighborhood: The claim holds in respect of "perceived safety by residents" or "certain types of incidents (e.g., petty theft)".
        - Service providers: The claim does not hold in respect of "overall crime statistics" or "serious violent incidents".
      - Drafting: "Police data shows an increase in petty theft near the center, which has affected residents' sense of safety, but there has been no significant change in violent crime. Both perceptions and data are important to address."
  - **Collapse Rule**: If the data clearly refutes one claim (e.g., no increase in any incident), that claim collapses to false.
  - **Recommendation**: "We recommend additional lighting and community patrols to address safety concerns while continuing the vital services of the drop-in center."

  #### 2. Removing a Benefactor's Name from a Hospital Wing
  - **Disputed Claims**:
    - Faction A: "He was the greatest friend this city ever had."
    - Faction B: "He was a segregationist who enriched himself through discriminatory lending."
  - **Sorting**: Aspectual dispute. Both claims can be true in different respects.
  - **Standpoint Ledger**:
    - Faction A: The claim holds in respect of "philanthropic contributions to the city" (e.g., he donated generously to public institutions).
    - Faction B: The claim holds in respect of "his business practices and racial policies" (e.g., he engaged in redlining).
  - **Syādvāda Application**: 
    - He was a great friend in respect of philanthropy, but not in respect of racial justice.
  - **Collapse Rule**: Neither claim is factually false; both respects are valid. However, the ethical standpoint of racial justice is non-negotiable (if the committee agrees on this principle).
  - **Drafting**: 
    - "Mr. X was a major benefactor of our city's institutions, including this hospital. However, his legacy is also marked by practices that harmed communities of color through discriminatory lending. We must weigh these aspects."
  - **Recommendation**: 
    - This is a values decision. The committee must vote on whether the harm from his actions outweighs the good. The statement can say: "After considering both his contributions and his harmful actions, we recommend removing his name because our community values racial justice and does not wish to honor those who undermined it." (If consensus is reached.)

  #### 3. Contested Public-Health Question
  - **Disputed Claim**: A member organization wants to say: "The science on this issue is genuinely open."
  - **Sorting**: Empirical dispute (what do scientific bodies say?).
  - **Resolution**:
    - Check consensus among relevant scientific bodies (e.g., CDC, WHO, major journals). If there is overwhelming consensus, the claim is false.
    - If the scientific bodies are not divided, then the claim collapses to false.
  - **Collapse Rule**: The claim is factually false and cannot be included. The standpoint of "genuine openness" is not supported by evidence.
  - **Outcome**: The committee cannot include the false claim. If the member organization insists, they may veto the statement, leading to no statement. The procedure would then produce no statement or a statement without that organization's endorsement (if the rules allow), but since each has a veto, likely no statement.

  ### Summary of the Procedure for the Committee
  1. **Identify the Dispute**: Write down the exact claims in contention.
  2. **Sort It**: 
     - If it's about facts, get data.
     - If it's about word meanings, define the word.
     - If it's about different angles, go to step 3.
  3. **Standpoint Ledger**: For each claim, ask: "In what specific way is this true?" Write down the answers. If no one can answer, drop the claim. If the way it's true is based on false facts or is unethical, drop it.
  4. **Draft with Clarity**: 
     - For data disputes, state the fact.
     - For word disputes, use the agreed definition.
     - For multiple angles, say: "From [this angle], X is true. From [that angle], Y is true."
  5. **Make a Recommendation**: Base it on what the group agrees is most important (e.g., safety, fairness, health). Be clear and action-oriented.
  6. **Vote**: Everyone must agree the statement is fair and accurate.

  This procedure should fit within two hours with practice. It avoids vagueness by forcing specificity and rejects false or unethical claims. It converts complex realities into clear, one-page statements by focusing on the most salient aspects and grounding recommendations in shared values.
answer: |-
  Below is a complete, actionable procedure for your committee, designed around Jain principles (anekāntavāda, nayavāda, syādvāda) but stripped of academic jargon. It prioritizes concrete steps, guards against weasel wording, and forces decisions where values or facts demand them. The procedure is built for efficiency (fits a 2-hour meeting) and produces a one-page public statement. I've incorporated your four mechanisms (standpoint ledger, sorting step, collapse rule, drafting rules) and added safeguards against relativism and evasiveness. Finally, I apply it to your three cases.

  ---

  ### **The Procedure: "Aspect-Based Dispute Resolution"**
  **Goal**: Transform irreconcilable claims into a clear, unified statement by clarifying *how* each claim is true (or false), then drafting a recommendation based on shared values.  
  **Time Allocation**: 90 minutes for steps 1–4; 30 minutes for step 5 (drafting).  
  **Materials Needed**: Whiteboard, timer, voting cards, pre-circulated data (e.g., police reports).

  #### **Step 1: Sort the Dispute (15 min per topic)**  
  *Purpose: Filter out non-aspectual disputes early. Ask these questions in order:*  
  1. **"Is this an empirical fact dispute?"**  
     - *Test*: Can it be settled with numbers, dates, or verified data?  
     - *Resolution*: Demand evidence. If data exists (e.g., police incident reports), adjourn for 5 min to review it. Vote to accept/reject the claim based on evidence. If no data, proceed to #2.  
     - *Sufficient answer*: A number, baseline (e.g., "Crime increased 10% vs. city average"), or source.  
     - *Output*: A factual assertion or "data inconclusive; proceed to #2."  

  2. **"Is this a semantic dispute?"**  
     - *Test*: Does the conflict hinge on the meaning of a single word (e.g., "safe," "harm")?  
     - *Resolution*: Define the term operationally. E.g., "By 'unsafe,' we mean violent crime > city average." Vote on the definition.  
     - *Sufficient answer*: A concrete definition all accept (e.g., "Community = residents within 1 mile").  
     - *Output*: Reword claims using the agreed definition.  

  3. **"Is this an aspectual dispute?"**  
     - *Test*: Could both claims be true from different perspectives? (e.g., "He was a hero" vs. "He was a villain").  
     - *Resolution*: If yes, proceed to Step 2. If no, veto or deadlock (rare; see Collapse Rule).  

  *Guard against weasel wording*: If sorting stalls, vote to force a category (majority rules). Timebox strictly.

  ---

  #### **Step 2: Standpoint Ledger (20 min per topic)**  
  *Purpose*: For each claim, specify the *respect* (naya) in which it holds. No vague claims allowed.  
  - **Process**:  
    1. List each delegate’s contested claim verbatim (e.g., "The area is unsafe").  
    2. For each claim, ask: **"In what respect is this true? Whose view? What scale? What aspect?"**  
       - *Respects must be concrete*: E.g., "Safety for elderly residents at night," "Economic harm to local businesses," "Short-term vs. long-term effects."  
    3. Record respects in a table (see example below). Claims without a defensible respect are marked **"unattached"** and discarded.  
    4. Vote on whether each respect is valid (simple majority). Reject if:  
       - It relies on false data (use Step 1 evidence).  
       - It is self-contradictory (e.g., "From no perspective").  

  *Example Ledger for Homeless Shelter*:  
  | Claim                          | Respect (Where True)                          | Valid? |  
  |--------------------------------|-----------------------------------------------|--------|  
  | "Area is unsafe"               | Elderly residents walking after dark          | Yes    |  
  | "Area is not unsafe"           | Overall crime stats (per police data)         | Yes    |  
  | "Shelter attracts crime"       | Unattached (no data; subjective)              | No     |  

  *Guard against relativism*: Reject respects that deny personhood or rights (e.g., "From a racist viewpoint"). Use Collapse Rule if needed.

  ---

  #### **Step 3: Collapse Rule (10 min per topic)**  
  *Purpose*: Force unhedged assertions when aspects conflict with facts or ethics. Apply these tests:*  
  1. **Fact Collapse**: If a claim’s respect relies on disproven data (e.g., "Crime rose 50%" when data shows 5%), discard it.  
  2. **Ethics Collapse**: If a respect is morally unacceptable (e.g., "Profits over lives"), discard it by committee vote (2/3 majority).  
  3. **Unity Collapse**: If all respects align (e.g., data confirms "unsafe"), assert the claim plainly.  

  *Output*: Claims are now either:  
  - **Discarded** (unattached, false, or unethical).  
  - **Aspectual** (true in specific respects).  
  - **Collapsed** (unqualified truth/falsehood).  

  *Guard against indecision*: If collapse applies, you MUST assert plainly. No "sevenfold" evasion.

  ---

  #### **Step 4: Drafting Rules for Statements**  
  *Purpose*: Convert aspects into public language. Rules for the drafter (you or vice-chair):  
  1. **Structure the statement**:  
     - **Context**: 1–2 sentences on the issue (e.g., "We address the drop-in center’s impact").  
     - **Aspectual truths**: List key respects concisely. *Use "while" or "from" clauses*:  
       > *"While police data shows no overall rise in crime (city-wide scale), elderly residents report feeling unsafe at night (local experience)."*  
     - **Collapsed truths**: State plainly (e.g., "Data disproves claims of increased violence").  
     - **Recommendation**: Base on shared values (e.g., safety, equity). *Must be unqualified*.  

  2. **Avoid confusion**:  
     - Never use syādvāda jargon (e.g., "syāt"). Attribute claims only if essential (e.g., "Residents report...").  
     - For inexpressible conflicts (rare), state: "Views diverge on [topic]; we prioritize [value]."  
     - Max 2–3 aspects per topic; prune minor ones.  

  3. **Values-based recommendations**:  
     - Identify shared principles (e.g., "safety for all," "historical justice").  
     - Draft the "ask" as an imperative: *"We urge increased lighting near the shelter"* or *"Remove the name to affirm dignity."*  
     - If values conflict irreconcilably, hold a yes/no vote on the recommendation (veto applies).  

  *Guard against weasel wording*: Each aspect must cite a specific respect (e.g., "per police data," "for nearby businesses"). No "some say..." without attribution.

  ---

  #### **Step 5: Finalize & Ratify (30 min)**  
  - Read the draft aloud.  
  - Vote per delegate: Does this fairly reflect their claim in its valid respect? (Veto power applies).  
  - Revise until unanimous. If deadlocked, issue no statement (better than a mocked one).  

  ---

  ### **What This Cannot Do**  
  1. **Resolve core value clashes**: If respects are valid but recommendations conflict (e.g., "profit vs. lives"), the committee must vote.  
  2. **Fix bad faith actors**: If a member refuses to specify respects, their claim is discarded as "unattached."  
  3. **Replace expertise**: For technical issues (e.g., emissions), defer to scientists—don’t force aspects.  
  4. **Prevent all mockery**: Vague drafting will still be mocked, hence strict attribution and data rules.  

  *Failure Mode Guards*:  
  - **Relativism**: Collapse Rule discards unethical/false claims; recommendations are values-based, not "all views equal."  
  - **Weasel wording**: Standpoint Ledger forces specificity; unattached claims are discarded.  
  - **Time creep**: Sorting step and timeboxes prevent philosophical debates.  

  ---

  ### **Worked Examples**  
  #### **Case 1: Drop-in Center for Homeless Residents**  
  - **Claims**:  
    - Neighborhood Assoc: "Area has become unsafe."  
    - Service Providers: "Area has not become unsafe."  
  - **Step 1 (Sort)**: Empirical dispute. Police data shows:  
    - Violent crime: No change (city-wide baseline).  
    - Petty theft: +15% within 0.5 miles (local baseline).  
  - **Step 2 (Ledger)**:  
    - "Area unsafe": True for *local petty theft impacts* (respect: small businesses, short-term).  
    - "Not unsafe": True for *violent crime city-wide* (respect: overall safety, long-term).  
    - "Shelter attracts crime": Unattached (no data link). Discarded.  
  - **Step 3 (Collapse)**: No collapse (both respects valid).  
  - **Draft**:  
    > "Police data confirms petty theft has risen near the drop-in center (impacting local businesses), though violent crime remains unchanged city-wide. **We urge increased police patrols and community mediation to address concerns while maintaining services.**"  
  - **Why it works**: Specific respects avoid "unsafe" debate; recommendation focuses on shared value (safety + services).

  #### **Case 2: Removing a Benefactor’s Name**  
  - **Claims**:  
    - Faction A: "He was this city’s greatest friend."  
    - Faction B: "He was a segregationist."  
  - **Step 1 (Sort)**: Aspectual (both historically true).  
  - **Step 2 (Ledger)**:  
    - "Greatest friend": True in respect of *philanthropy* (e.g., hospital donations).  
    - "Segregationist": True in respect of *business practices* (e.g., discriminatory lending).  
  - **Step 3 (Collapse)**: Ethics test: Both respects valid unless racism is condoned (rejected).  
  - **Draft**:  
    > "Mr. X was a major philanthropist for our hospital (supporting healthcare access) but also engaged in segregationist lending practices (harming communities of color). **We recommend removing his name to align with our city’s commitment to racial justice.**"  
  - **Why it works**: Aspects contextualize praise/criticism; recommendation draws on shared value (justice). No false balance.

  #### **Case 3: "Contested" Public-Health Issue**  
  - **Claim**: "The science is genuinely open."  
  - **Step 1 (Sort)**: Empirical dispute. Data: 97% consensus among health agencies.  
  - **Step 2 (Ledger)**: Claim has no valid respect (agencies agree it’s settled). Marked **unattached**.  
  - **Step 3 (Collapse)**: Fact collapse—claim is false.  
  - **Outcome**:  
    - Draft asserts: "Scientific consensus confirms [position]."  
    - If the dissenter vetoes, issue no statement. *Do not call science "open" to preserve signatories*.  
  - **Why it works**: Sorting step exposes false equivalence. Protects integrity; avoids promoting misinformation.

  ---

  ### **Final Advice**  
  - **Prep Work**: Circulate data and claims 48h early. Assign a timekeeper.  
  - **Training**: Run a mock debate (e.g., "Is water in the river clean?") to practice respects.  
  - **When to Abandon**: If over 50% of claims are unattached or collapsed, the coalition may be untenable.  

  This procedure turns Jain insights into a concrete tool for pluralistic groups. It won’t eliminate conflict, but it will force clarity, expose bad-faith claims, and produce statements that hold up to public scrutiny—without requiring a philosopher in the room.
