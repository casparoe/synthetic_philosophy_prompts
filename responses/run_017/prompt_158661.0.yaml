  Epistemology is crucial. If the will is unknowable, how can we recognize it in music? The follow-up should probe the nature of this knowledge—feeling vs. actual acquaintance.

  Evidence against the theory is important. The philosopher might say nothing can disprove it, so the follow-up must push on what would make her reconsider.

