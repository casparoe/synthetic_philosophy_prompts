prompt: |-
  Nineteen months ago I donated a kidney to my younger sister. The surgery and recovery were unremarkable and I have never regretted it, but the experience left me with what I took to be a settled conviction: that organs should be given and not sold, and that putting a price on donation would damage something I care about. Since the spring I have been sitting on the eight-member lay advisory panel of our provincial organ-donation agency. We do not make decisions; we write short opinions, and the agency usually follows them. Next month we are being asked to opine on a proposal that has made me unsure what my own conviction amounts to, and I want to work out, before the meeting, what consistency with our own record actually requires of us.

  Our opinions to date, with the one-line note recorded beside each vote:

  1. Cash payments of roughly a day's wage per donation to plasma donors at collection centres — approved. Note: renewable tissue, no lasting cost to the donor.
  2. A fixed, non-negotiable, government-set fee for living kidney donation — rejected, 6–2. Note: does not record a reason.
  3. Reimbursement of gestational carriers for documented expenses and lost wages — approved. A fee for the work of carrying a child — rejected.
  4. Reimbursement of living organ donors for travel, childcare and lost wages, capped and documented — approved.
  5. Payments to healthy volunteers in early-phase drug trials, scaled to time and discomfort but deliberately not to the risk assumed — approved.
  6. A proposal to let patients make a charitable contribution to the transplant foundation in exchange for additional points on the deceased-donor waiting list — rejected unanimously. Note: allocation should answer to need.
  7. Modest cash incentives offered by the health authority to dialysis patients who attend their prescribed sessions — rejected, 5–4. Note from the majority: it treats adherence as something to be bought. I was in the minority.
  8. A manufacturer raised the price of an off-patent, single-source, life-saving drug roughly forty-fold overnight — statement issued condemning this and recommending a windfall-profit cap. Slightly outside our remit, but we were asked.

  The proposal now in front of us is a Family Recognition Benefit: three thousand dollars, paid by the agency to the family of every deceased person from whom organs are actually recovered. The amount is the same for everyone, regardless of income, region or how many organs are taken; it is not negotiable; it is framed explicitly as recognition of the family's contribution and assistance with funeral costs rather than as a price; and its authors point to consent rates in jurisdictions with comparable schemes as their main argument. We also have a second file, twice deferred: whether hospitals may sell surplus umbilical-cord-blood units that would otherwise be discarded to private biobanks, at a fixed price, with nothing going to the mother.

  I do not want a survey of the literature on repugnant markets, and I do not want a list of the standard objections with their labels attached. What I want is applied to our record:

  1. Set out the two or three principles that a panel with this exact voting record could be running, stated sharply enough that each one generates a definite prediction, and say for each which of the eight votes above it fits only by straining, and how.
  2. Say what each principle predicts about the Family Recognition Benefit, and what the operative consideration is in each case.
  3. Give your single best guess about what we should say, with the reason for preferring it — a reason that does not simply restate my conviction that donation should be a gift.
  4. Name one further case, which we have not voted on and which our agency could actually put to us in the next year, that would best separate the two leading principles, and give each principle's prediction about it.
  5. Say whether the cord-blood file is settled by whichever principle we adopt for the Family Recognition Benefit, or whether it raises a genuinely separate question. And if our precedents underdetermine the Benefit, state plainly what we would be committing ourselves to by voting either way, and which precedent is the closest analogue.

  Please keep the whole answer under a thousand words.
reasoning: |-
  Hmm, the user is a member of an organ donation advisory panel who donated a kidney to their sister and has a conviction that organs should be given, not sold. They're facing a proposal for a $3,000 Family Recognition Benefit for families of deceased donors and need help reconciling it with their panel's previous decisions.

  Looking at their voting record, I notice several key patterns: they approve reimbursement for expenses/lost wages but reject direct payments for organs or medical services. They draw lines between compensation for time/discomfort versus payment for body parts or medical compliance. The plasma donation approval stands out as an exception because plasma is renewable.

  For the Family Recognition Benefit proposal, I see three possible principles emerging from their record:
  1) Compensation for costs/lost opportunities is acceptable but payment for body parts isn't
  2) Payments should be tied to burden/time, not to the body itself
  3) The framing matters - payments framed as recognition rather than purchase might be acceptable

  The plasma case (vote 1) fits poorly with the first principle since plasma is a body product, but they approved it because it's renewable. The dialysis incentive rejection (vote 7) conflicts with this framing principle since it was framed as payment for adherence.

  For the Family Recognition Benefit, Principle 1 would reject it as payment for organs. Principle 2 would approve it if seen as funeral cost assistance. Principle 3 might approve it because it's framed as recognition.

  I think Principle 2 fits best overall and suggests approving the benefit as funeral cost assistance. A good test case would be offering compensation to families who maintain brain-dead patients for organ retrieval - this would separate Principles 1 and 2 clearly.

  For the cord blood issue, it's distinct from the Benefit question since it involves selling biological material rather than recognition payments. The closest analog is vote 5 (payments for drug trial participation).

  The user needs practical guidance rooted in their panel's specific precedents, not theoretical debates. They want to maintain consistency while respecting their conviction about donation as a gift.
answer: |-
  Here’s a principles-based analysis grounded strictly in your panel’s record, addressing each request concisely:

  ### 1. Principles Derivable from Your Record  
  **Principle A: Compensation for *burdens* (time, discomfort, expenses) is permissible, but payment for *body parts or essential medical acts* is not.**  
  - **Strained fit:** Vote 1 (plasma payments). Plasma is a "renewable tissue," but it’s still a bodily substance. Approval strains A by implying compensation for bodily contributions is acceptable if low-risk/renewable.  
  - **Clean fits:** Votes 2 (kidney fee rejected), 3 (surrogacy fee rejected), 5 (drug trial payments for time/discomfort approved), 7 (dialysis incentives rejected as "buying" adherence).  

  **Principle B: Payments must be *framed as reciprocity* (reimbursement, recognition) not *market exchange*, and must not commodify life/death decisions.**  
  - **Strained fit:** Vote 7 (dialysis incentives). The minority (including you) saw this as reciprocity for burdens; the majority framed it as "buying" adherence. Your dissent strains B by prioritizing intent over framing.  
  - **Clean fits:** Votes 3 (expenses reimbursed, fee rejected), 4 (donor expenses approved), 6 (charity for priority rejected to preserve need-based allocation).  

  **Principle C: *Indirect* compensation (to families, funeral costs) is distinct from *direct* payment to donors, and may be acceptable if non-coercive and symbolic.**  
  - **Strained fit:** Vote 2 (kidney fee). The 2 approvals might view a fixed fee as indirect/symbolic, but it was rejected 6–2, straining C.  
  - **Clean fits:** Votes 3 (expenses vs. fee), 4 (reimbursement approved), 8 (profit cap endorsed to prevent exploitation).  

  ---

  ### 2. Predictions for Family Recognition Benefit  
  - **Principle A:** **Reject.** The benefit is tied to organ recovery, making it payment for body parts. Operative: Avoids commodifying organs.  
  - **Principle B:** **Approve.** Framed as "recognition" and "funeral assistance," not a price. Operative: Upholds reciprocity without market framing.  
  - **Principle C:** **Approve.** Compensates families indirectly/symbolically. Operative: Separates the act (donation) from posthumous support.  

  ---

  ### 3. Best Recommendation: **Approve, but with caution**  
  **Reason:** Principle B aligns best with your record’s emphasis on *framing and intent* (Votes 3, 4, 6). The Benefit is explicitly non-transactional ("recognition," fixed sum) and mirrors approved reimbursements (Vote 4) by offsetting funeral costs—a burden. Unlike Vote 2 (kidney fee), it targets families, not donors, avoiding direct commodification. *Crucially, it doesn’t rest on your gift conviction* but on precedent: you approved plasma payments (Vote 1) and drug-trial compensation (Vote 5) for contributions involving the body when framed reciprocally.  

  ---

  ### 4. Best Separating Case: **Compensating Families for Maintaining Brain-Dead Donors**  
  - **Scenario:** $500/day to families who agree to keep a brain-dead relative on life support until organ recovery.  
  - **Principle A:** **Reject.** Pays for maintaining a body as an "organ source," commodifying death.  
  - **Principle B:** **Conditionally approve.** If framed as offsetting costs (e.g., lost wages, travel), not as a fee per organ.  

  ---

  ### 5. Cord Blood & Precedents  
  - **Cord Blood:** **Separate question.** Selling cord blood to biobanks (with no maternal share) is a *direct market exchange* for tissue. Unlike the Benefit, it lacks a reciprocity frame (Vote 3 rejected surrogacy "work" fees) and risks commodification (Vote 2, Vote 8). Closest analog is Vote 1 (plasma), but plasma is renewable; cord blood is not. **Likely reject under all principles.**  
  - **If Undetermined:** Voting **against** the Benefit commits you to strict bodily integrity (Vote 2). Voting **for** commits you to accepting indirect, symbolic payments (extending Vote 1/4). **Closest analog:** Vote 4 (reimbursement) for funeral costs, but Vote 2 (no organ fees) is a counterweight.  

