prompt: |-
  I am the clinical lead of the Coverage Review Committee of a national health insurance scheme, and I need a decision procedure, not an essay. We are eight people — two clinicians, a health economist, a patient representative, a lawyer, an actuary, a physiologist, and me (a general internist, no philosophy training). We meet for one afternoon a month and work through one or two petitions, roughly fifteen a year: a specialist society, a patient group, or a manufacturer asks us to recognise some condition as a disease, which determines whether the scheme pays for its treatment and whether people get income-replacement benefits. Every decision must be issued with written reasons, every denial is appealable to a tribunal, and our lawyer insists that any step in our reasoning that is a judgment about what matters rather than a judgment about how bodies work be labelled as such and attributed to the committee by name, because the tribunal reads our decisions against each other and notices when we have passed a value judgment off as physiology. Our enabling regulation is no help: it entitles insured people to treatment for disease, injury or disorder and says nothing more, and the tribunal has told us we must give reasons that separate those from the ordinary discomforts and misfortunes of life, which it has never defined.

  What pushed me to write is two decisions and one near-miss of our own. First, last year we denied a petition from a man whose exhaustion and insomnia followed from holding two jobs and caring for a disabled parent, calling it ordinary misfortune; six months earlier we had approved a chronic pain condition with almost the same symptom profile because an imaging study showed something. I cannot tell from our reasons whether the difference was metaphysical or financial, and I suspect we laundered a coverage decision as an ontological one. Second, our statute forces a sunset review every five years, and at the first one our actuary pointed out that a condition we had recognised now tested positive in more than twice as many people as before — not because bodies had changed but because recognition produced testing, testing produced diagnoses, and diagnoses changed the measured distribution. Under any reading of disease that appeals to statistically typical functioning, our own decision had made the condition normal, and we quietly declined to draw that conclusion. Call these prevalence-inflating recognitions if it helps; I want a procedure that says what to do with them rather than letting us fudge. I have read a little of the philosophy — the biostatistical theory associated with Boorse, on one side, and Wakefield's harmful-dysfunction analysis as a hybrid — and I do not want a survey of it. I want a procedure that still runs if the naturalist is basically right, if the hybrid is right, and if the normativist is right, with the steps marked where the answer would diverge, and with the places where a value judgment enters flagged rather than hidden.

  So: give me the ordered questions my committee should ask of a petition, what would count as a sufficient answer to each and who has to supply it, where the procedure stops with a no, and where it must stop and hand the question to a person because it has run out of facts and reached a matter of values. It has to be runnable in two hours by people who have never read the literature, and it has to produce a defensible written record. Among the things it must be able to handle: how the reference class gets fixed (by age, by sex, by population, and as of when — before or after a recognition that changes prevalence); the gap between a trait being statistically common and a mechanism doing what it is supposed to do; a demonstrable dysfunction that harms nobody; real and serious harm with no dysfunction we can identify; conditions that only disable because of how schools, workplaces or benefit rules are arranged; conditions that become visible only with a new test and never trouble most of the people who have them; and harms that consist in the frustration of a particular person's projects, as with a mild tremor that ends a violinist's career and is nothing to an accountant. I also want to know whether the procedure should try to settle three questions separately or collapse them: whether the state is a disease, whether it was caused by something the scheme or the state is responsible for, and whether we should pay for treating it. Then run it on three petitions: low testosterone in an otherwise healthy sixty-eight-year-old with levels at the thirtieth percentile for his age, fatigue and low mood, and no identifiable pathology; exhaustion and cynicism in a thirty-four-year-old emergency-department nurse that resolves completely on leave, with no biomarker; and a small indolent thyroid lesion found incidentally on a scan done for an unrelated reason, where most people with the finding never develop symptoms but a specialist society wants it recognised. At least one of these must come out with an answer my committee will not like — my guess is that a properly built procedure will either force us to call the nurse's state a disease or force us to admit we are refusing her on grounds of cost and precedent, and I would rather be told now which. Finally, tell me what the procedure cannot do: where it will misfire, which distinctions it has to leave to us, and whether it can actually stop a committee from dressing up a budget decision as a claim about what a disease is. As you go, say how confident you are in each substantive claim you make about what the concept of disease requires, and single out the step or claim you are least sure of and why.
reasoning: |-
  Okay, the user is the clinical lead of a Coverage Review Committee for a national health insurance scheme. They're dealing with petitions to recognize conditions as diseases, which affects coverage and benefits. They need a practical decision procedure, not theoretical essays. The committee has eight members with diverse expertise, meeting monthly for about two hours per petition. Key issues include separating factual judgments from value judgments, handling cases where recognition inflates prevalence, and ensuring transparent reasoning for appeals.

  The user mentioned two problematic cases: one where exhaustion from life circumstances was denied while similar symptoms with an imaging finding were approved, and another where a recognized condition became statistically normal due to increased testing. They want a procedure that works regardless of whether naturalist, hybrid, or normativist theories of disease are correct, with clear flagging of value judgments.

  Deep needs here include avoiding ontological laundering (masking coverage decisions as disease definitions), handling prevalence inflation transparently, and producing legally defensible decisions. The procedure must handle reference class issues, harm without dysfunction, dysfunction without harm, social determinants of disability, and incidental findings.

  The user also wants the procedure tested on three cases: low testosterone in an older man, burnout in a nurse, and an incidental thyroid nodule. They anticipate uncomfortable outcomes and want honesty about where the procedure forces value-based decisions.

  For the procedure, I'll need to structure it as sequential questions with clear stopping points. Each question must specify what counts as sufficient evidence, who provides input, and when it requires committee judgment. Key distinctions include separating disease status from causation and coverage decisions, though these may collapse at the harm assessment stage. Value judgments must be explicitly flagged, especially around harm significance and resource allocation.

  The biggest challenge will be Step 4 (harm assessment) where social context creates disability - this is where committees might try to disguise coverage decisions as ontological ones. The procedure should force explicit admission when denial is based on cost/precedent rather than disease status.

  Testing the cases: the low-T example would likely fail at dysfunction or harm assessment; the nurse's burnout clearly involves harm but may lack demonstrable dysfunction; the thyroid nodule has dysfunction but likely no harm. The nurse case will be controversial - it exposes where the committee must openly state that absence of biomarker doesn't preclude disease status if harm is severe, or admit they're denying due to resource concerns.

  Limitations: the procedure can't eliminate value judgments, only make them visible. It can't resolve fundamental philosophical debates about disease, and may struggle with conditions entirely mediated by social structures. Prevalence inflation requires explicit policy decisions about reference class timing - I'll suggest using pre-recognition data.

  The weakest point is Step 4's harm threshold. There's no objective way to define "significant" harm - committees must take ownership of this value judgment. But forcing it into the open prevents laundering and satisfies the lawyer's requirements.
answer: |-
  Here is a decision procedure designed for your committee's specific constraints and challenges. It separates factual assessments from value judgments, flags where philosophy diverges, handles your core dilemmas, and produces an auditable record. Each step specifies: **Question**, **Sufficient Answer/Evidence**, **Responsible Party**, **Stopping Points**, and **Value Judgment Flags**.

  **Decision Procedure: Disease Recognition for Coverage**

  **Ground Rules:**
  1.  **Define "Dysfunction":** A deviation from *species-typical* functional organization at the subsystem (organ, tissue, cellular, molecular) level. (Confidence: High - Core to naturalist/hybrid views, minimal normativist input here).
  2.  **Define "Harm":** A condition of negative affect (suffering, distress) and/or limitation of functional ability *as experienced by the person*.
  3.  **Reference Class (RC) Baseline:** Statistically typical function for the relevant *age* and *sex* subgroup within the *general population*, **using prevalence data *before* any specific recognition decision potentially inflated diagnosis rates.** (Confidence: Moderate - Pragmatic choice to avoid self-defeating inflation; alternatives exist but are messier. Least sure point - debated).
  4.  **Separate Questions:** The procedure explicitly answers **"Is it a Disease?"** (D). *Causation* (C) and *Coverage* (Cover) are separate but subsequent questions. D must be settled first. C and Cover may involve distinct value judgments and evidence.

  **The Procedure:**

  1.  **PETITION CLARITY:**
      *   *Question:* Does the petition clearly specify the proposed condition (signs/symptoms, suspected underlying process) and the population affected?
      *   *Sufficient Answer:* Yes, or clarification obtained from petitioner. No: Stop, request clarification.
      *   *Responsible:* Committee Chair (You), Lawyer (clarity of definition).

  2.  **FACT 1: EVIDENCE OF DYSFUNCTION?**
      *   *Question:* Is there objective evidence of a statistically subnormal *functional* deviation in a physiological, biochemical, anatomical, or genetic subsystem *relative to the RC Baseline*? (Focus: *How bodies work*).
      *   *Sufficient Answer:*
          *   **Yes:** Imaging, lab tests, histopathology, genetic findings, reproducible neurophysiological/functional tests consistently showing deviation *below* the 2.5th percentile (or established pathological threshold) for the RC. (Confidence: High - Core biomedical evidence).
          *   **No:** Symptoms alone, subjective reports without objective correlate, traits within normal RC variation, statistically common traits absent functional deviation.
          *   **Unclear/Contested:** Conflicting studies, new/emerging biomarkers, measurement disputes.
      *   *Responsible:* Clinicians, Physiologist (interpret evidence), Actuary/Health Economist (provide RC data).
      *   *Stopping Point:* **If "No":** Proceed to Step 3. **If "Yes":** Proceed to Step 4. **If "Unclear":** Committee judgment required - weigh evidence strength/probability. Majority vote. *Record vote and reasoning.*
      *   *Value Judgment Flag:* **No.** This is primarily a factual assessment of biological evidence against the RC baseline.

  3.  **FACT 2: EVIDENCE OF HARM WITHOUT IDENTIFIED DYSFUNCTION?**
      *   *Question:* Despite no clear dysfunction (Step 2), is there strong, consistent evidence of significant *Harm* (suffering, functional limitation) associated with the proposed condition? (Focus: *What matters to the person*).
      *   *Sufficient Answer:*
          *   **Yes:** Validated patient-reported outcome measures showing severe impact, epidemiological data linking the state to disability, suicide risk, or severe quality-of-life impairment *independent of social arrangements*. (Confidence: Moderate - Harm is experiential, measurement is indirect).
          *   **No:** Mild/subjective distress, functional limitations primarily explained by social context (e.g., inflexible workplace), no robust evidence of significant harm.
      *   *Responsible:* Patient Rep (lived experience perspective), Clinicians (assess impact severity), Health Economist (review epidemiological/QoL data).
      *   *Stopping Point:* **If "No":** Stop. **Decision: Not a Disease (D-).** Reason: "No demonstrable dysfunction (Step 2) and insufficient evidence of significant harm independent of social context (Step 3)." **If "Yes":** Proceed to Step 4.
      *   *Value Judgment Flag:* **Yes (Threshold).** Determining what constitutes "significant" harm involves a value judgment about the severity of suffering/limitation required. *Committee must explicitly state:* "The Committee judges the level of harm evidenced (describe) to be *significant*."

  4.  **HARM ASSESSMENT:**
      *   *Question:* Is the Harm identified in Steps 2 ("Yes") or 3 ("Yes") judged by the Committee to be *significant*? Does the harm arise *primarily* from the internal state/dysfunction itself, or *primarily* from adverse social circumstances? (Focus: Distinguishing *disease-based harm* from *socially mediated disadvantage*).
      *   *Sufficient Answer:* N/A - This is a judgment call based on evidence reviewed in Steps 1-3.
      *   *Responsible:* Full Committee. *Crucial Input:* Patient Rep (impact), Clinicians/Physiologist (link dysfunction->harm?), Health Economist/Lawyer (social context analysis).
      *   *Stopping Point:* **If Harm judged NOT significant, OR Harm judged primarily due to adverse social circumstances:** Stop. **Decision: Not a Disease (D-).** Reason: "While [dysfunction/harm evidence] exists, the Committee judges the harm to be either not significant or primarily caused by adverse social circumstances [specify], not the internal state itself." **If Harm judged significant AND primarily arising from the internal state/dysfunction:** Proceed to Step 5.
      *   *Value Judgment Flag:* **Yes (Significance & Causation).** Both deciding "significant" harm and determining the *primary source* of the harm (internal vs. social) are fundamental value judgments. *Committee must explicitly state:* "1. The Committee judges the harm (describe) to be *significant*. 2. The Committee judges this harm arises *primarily* from an internal biological state/dysfunction, not primarily from adverse social circumstances."

  5.  **DISEASE DETERMINATION:**
      *   *Question:* Based on Steps 1-4, should the proposed condition be recognized as a "disease, injury or disorder" under the scheme's enabling regulation?
      *   *Sufficient Answer:* N/A - Synthesizes previous steps.
      *   *Responsible:* Full Committee. Vote required.
      *   *Stopping Point:*
          *   **Decision: Disease (D+):** If Step 2=Yes OR (Step 2=No & Step 3=Yes) AND Step 4=Yes (Harm significant & internal).
          *   **Decision: Not Disease (D-):** Any other path through Steps 2-4.
      *   *Value Judgment Flag:* Incorporated from Step 4. The D+ determination itself is the conclusion.
      *   *Output:* Clear "D+" or "D-" decision based on the pathway.

  **Subsequent Questions (Separate but Sequential):**
  6.  **CAUSATION (C):** Was the disease (if D+) *caused* by something the scheme/state is responsible for (e.g., occupational exposure, vaccine injury)? (Requires separate evidence review - toxicology, epidemiology, legal precedents). Lawyer, Clinicians, Health Economist lead.
  7.  **COVERAGE (Cover):** Should treatment for this disease (if D+) be covered by the scheme, considering clinical effectiveness, cost-effectiveness, budget impact, precedent, and equity? Health Economist, Actuary, Clinicians lead. *Heavily value-laden* - requires explicit trade-off judgments.

  **Applying the Procedure to Your Cases:**

  1.  **68yo Male, Low T (30th %ile), Fatigue/Low Mood, No Pathology:**
      *   Step 1: Clear.
      *   Step 2: **No.** Testosterone level (30th %ile) is *within* normal RC (age/sex) variation. No identified pathology. (Clinicians/Physiologist/Actuary).
      *   Step 3: **Yes.** Fatigue/Low Mood constitute Harm. Evidence? Patient report, potentially PHQ-9/GAD-7 scores indicating significant distress. (Patient Rep/Clinicians).
      *   Step 4: **Committee Judgment:** Is the harm *significant*? (Likely Yes). Does it arise *primarily* from the internal state (low mood/fatigue) or social context (aging, retirement, life stage)? **Crucial Value Judgment.** *If primarily internal:* Proceed to D+. *If primarily social:* D-.
      *   *Likely Outcome:* D- (Low T not dysfunction; harm likely judged linked to aging/life context, not primarily internal dysfunction). Forces explicit value judgment on harm source. **Coverage denial would be based on D-, not cost.**

  2.  **34yo ED Nurse, Exhaustion/Cynicism, Resolves on Leave, No Biomarker:**
      *   Step 1: Clear ("Occupational Burnout").
      *   Step 2: **No.** No identified physiological dysfunction biomarker. (Clinicians/Physiologist).
      *   Step 3: **Yes.** Exhaustion/Cynicism = Harm. Significant impact evidenced by need for leave, functional impairment. (Patient Rep/Clinicians).
      *   Step 4: **Committee Judgment:** Is harm *significant*? (Clearly Yes). *Primary source?* Is the severe exhaustion/cynicism primarily an internal pathological state *caused by* work stress (suggesting dysfunction), OR is it a normal human reaction primarily caused by an objectively harmful environment (chronic understaffing, trauma exposure)? **THE CRITICAL VALUE JUDGMENT.**
          *   *If judged primarily internal dysfunction (e.g., stress-induced neurobiological changes akin to injury):* **D+**.
          *   *If judged primarily normal reaction to toxic environment:* **D-**. (Harm primarily social cause).
      *   *Outcome Depends on Judgment:* The procedure forces this explicit choice. Denying D+ *requires* stating harm is primarily due to the work environment, not an internal disease state. **This prevents laundering a cost/precedent decision as ontology.** If D+ is denied, appeal might focus on this judgment. If covered, it might be via C (occupational injury) or Cover decision, not necessarily D+.

  3.  **Incidental Indolent Thyroid Lesion:**
      *   Step 1: Clear.
      *   Step 2: **Yes.** Anatomical deviation (lesion) from normal structure. (Clinicians - Imaging evidence).
      *   Step 3: (Skipped as Step 2=Yes).
      *   Step 4: **Is there Harm?** Most people never develop symptoms. *Is the lesion itself causing harm?* Unlikely (no symptoms). *Is the knowledge of it causing significant distress/anxiety?* Requires evidence (e.g., studies on incidentaloma anxiety). **Committee Judgment:** Is any existing anxiety/distress *significant* and *primarily* caused by the internal state (knowing you have a potential, albeit unlikely, problem)? Or is it primarily iatrogenic (caused by the scan/finding itself) or social (fear of cancer diagnosis)? *If significant harm judged primarily internal:* D+. *If not:* D-.
      *   *Likely Outcome:* **D-.** Dysfunction present (Step 2), but harm judged insignificant or primarily iatrogenic/social (fear induced by testing). Recognition likely denied. Specialist society request focuses on treatment (Cover), not necessarily D status.

  **What the Procedure Can and Cannot Do:**

  *   **Can:**
      *   Provide a clear, sequential, auditable framework for decision-making.
      *   Force separation of factual (dysfunction, harm evidence) and value judgments (harm significance, harm source).
      *   Explicitly flag and attribute value judgments to the committee.
      *   Handle reference class (via RC Baseline rule) and prevalence inflation (by using pre-recognition data).
      *   Handle dysfunction without harm (D- via Step 4) and harm without identified dysfunction (potential D+ via Steps 3 & 4).
      *   Handle social vs. biological causation of disability (Step 4).
      *   Handle incidental findings (Steps 2 & 4).
      *   Separate the Disease (D), Causation (C), and Coverage (Cover) questions logically.
      *   Produce a defensible written record mapping the decision path.
  *   **Cannot:**
      *   **Eliminate Value Judgments:** Steps 3 (harm threshold) and 4 (harm significance & source) *require* committee value judgments. The procedure forces them into the open but doesn't resolve them.
      *   **Define "Significant Harm" Objectively:** This remains inherently subjective and context-dependent. The committee *must* own this judgment.
      *   **Resolve Deep Philosophical Disputes:** It provides a pragmatic workflow that works *under* different theories but doesn't prove one "right." Naturalists might balk at D+ via Steps 3&4 without dysfunction. Normativists might find the RC Baseline arbitrary.
      *   **Prevent All Bad Faith:** A determined committee could still make disingenuous value judgments in Step 4. However, the requirement to *explicitly state* the judgment ("harm primarily social") makes this harder to disguise and easier for tribunals to scrutinize/invalidate.
      *   **Guarantee Consistency:** Different committees might judge "significance" or "primary source" differently for similar cases. Robust minutes and precedent tracking are essential supplements.
      *   **Directly Handle Cost:** Cost is explicitly deferred to the *Coverage* decision (Step 7), separate from Disease status (D). The procedure prevents *laundering cost as ontology* by forcing the D question to be settled first on (flagged) factual/value grounds.
      *   **Solve Conditions Entirely Social:** If a condition involves *no* internal dysfunction (Step 2=No) *and* harm is judged *primarily social* (Step 4), it remains D-. Coverage might still be possible via other scheme rules (e.g., social support) but not under "disease."

  **Conclusion:** This procedure provides the structured, value-flagging, legally defensible framework you need. Its core strength is forcing the critical ontological/value judgments (Step 4 - Harm Significance & Source) into the open, preventing the laundering you observed in your exhaustion cases. It explicitly handles prevalence inflation via the RC Baseline rule. Applying it to your test cases demonstrates how it exposes the committee's necessary value choices, particularly in the burnout case. While it cannot eliminate subjectivity, it mandates transparency about where and why it enters the decision, satisfying your lawyer's requirements and providing a much stronger foundation for tribunal appeals. Remember to meticulously document the path through the steps and the reasoning behind each judgment call, especially in Step 4.
