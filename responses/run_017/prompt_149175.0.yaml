answer: |-
  Here’s a rigorous reading of *Arrival* that takes both the grounding literature and the film’s nuances seriously, identifies key scenes, and articulates what the film uniquely contributes to the symbol grounding debate—while candidly addressing its evasions. Your intuition about practice-based grounding is sharp, but the film’s handling of non-linear time requires a more conservative (yet still potent) account.

  ### Core Argument: Practice, Not Percepts, Grounds Early Symbols
  Your supervisor is right that ostensive definition alone is insufficient for grounding (a la Harnad’s "symbol grounding problem"). *Arrival* acknowledges this: the early symbol-mapping scenes (whiteboards, basic logograms for "human"/"heptapod") **deliberately show the insufficiency** of formal mapping. The breakthrough comes through **shared normative practices**, not perceptual contact or causal history. Key scenes:

  1.  **The Mahjong Scene & "Weapon" vs. "Tool":** This is the crux. General Shang’s team interprets the logogram as "weapon" because their interaction ritual was competitive (mahjong = zero-sum game). Louise interprets it as "tool" because her practice was collaborative (science = shared inquiry). The **same perceptual stimuli** (logogram, heptapods) lead to divergent meanings because the *social practice embedding the symbols* differs. This isn’t just translation choice; it’s a claim about **how symbols acquire worldly traction**. The logogram isn’t grounded in ink or alien bodies, but in the **purpose-driven, rule-governed interactions** between humans and heptapods (Wittgensteinian "language-games," Brandomian normative pragmatics).

  2.  **The "Gift" Ritual & Breaking the Glass:** When Abbott sacrifices itself, Costello writes "ABBOTT HAS DEATH PROCESS." This isn’t decoded via ostension but through recognizing a *shared ritual of sacrifice and communication* within an established practice of exchange. Louise understands it as a "gift" (vital information) because her prior interactions established norms of reciprocity and trust. The glass-breaking isn’t sensorimotor grounding; it’s **participating in a norm** (transparency, risk-taking for understanding).

  **What this adds to grounding theory:** Most accounts (causal, teleosemantic, embodied) focus on individual-agent-world relations. *Arrival* highlights **intersubjective, practice-embedded grounding**. A sign becomes anchored not just by pointing or correlation, but by its role in a *collective, purposive activity with normative stakes*. This challenges "purist" grounding by showing that social-normative contexts are constitutive, not merely enabling. The film forces us to ask: grounding *for whom, within which practice?*

  ### Non-Linear Time: Testimony, Not Teleological Grounding
  The late-stage "memories" of Hannah’s life pose the radical challenge. Your "teleological grounding" idea is philosophically interesting, but the film doesn’t support it. Here’s why the conservative reading holds:

  1.  **Heptapods Ground Their *Own* Symbols Non-Linearly:** Their perception/cognition isn’t sequential; their symbols are intrinsically "grounded" in their holistic experience. Louise doesn’t ground "Hannah" via future causation; she **inherits grounded terms through linguistic trust**. When Costello says "Louise sees future," that utterance (like all heptapod language) is anchored in *their* temporal reality. Louise accepts it testimonially, just as we accept "electron" from physicists.

  2.  **The UN Scene Confirms Testimony:** Louise’s knowledge of Shang’s wife’s dying words isn’t teleologically grounded; it’s **mediated by heptapod testimony**. Costello provides the information *in the present*, anchored via *their* non-linear access. Louise’s "memory" is retrospective integration of received knowledge into her *now* non-linear phenomenology.

  3.  **Pattern Learning? Incomplete:** Your friend’s "strong pattern learning" view explains Louise’s fluency with syntax/semantics but not the *content* of future events. The film explicitly shows her gaining knowledge *she couldn’t infer from patterns alone* (Shang’s private number, his wife’s words). Pattern learning grounds language *structure*; testimony grounds *specific future referents*.

  **What this adds:** The film exposes the **indispensability of testimony in grounding**. Even "purist" accounts rely on deferred grounding (e.g., "Paris" for someone who’s never been). *Arrival* dramatizes this: Louise’s grounding of future terms is parasitic on the heptapods’ direct (non-linear) grounding. This pressures grounding theories to better account for how communities, not just individuals, anchor symbols—especially for unobservables (past/future, theoretical entities).

  ### Where the Film "Cheats" – And What Survives
  **The Evasion:** The mechanics of *how* Louise transitions from understanding Heptapod B to experiencing time non-linearly are opaque. The montage implies immersion rewires cognition *magically*. This **skips the hardest grounding problem**: how syntactic competence induces a new phenomenal ontology. It *is* a narrative "gift."

  **What Survives the Charge:**
  1.  **Early Practice-Based Grounding (Intact):** The mahjong/glass-breaking scenes meticulously show practice anchoring symbols *before* any "time-bending." This is philosophically robust independently.
  2.  **Testimonial Grounding (Mostly Intact):** Even if Louise’s *cognition* is altered mystically, the *content* of her future knowledge is grounded via heptapod testimony. This remains a valid point about deferred grounding.
  3.  **"Teleological Grounding" (Collapses):** The film doesn’t show signs anchored *by the future*; it shows signs anchored by *testimony about the future*. This distinction matters.

  **The Paper You Can Write:**
  1.  **Core Focus:** Use the **early interaction scenes** (mahjong, gift ritual) to argue for **practice-embedded, normative grounding** as a necessary supplement to causal/embodied accounts. Contrast with pure symbol-symbol mapping shown earlier. This directly engages grounding literature (Harnad, Searle) with Wittgenstein/Brandom.
  2.  **Secondary Focus:** Analyze the **UN scene/late revelations** to argue for **testimony as a crucial (and overlooked) grounding vector**, challenging purist individualism. Cite Lackey on testimonial knowledge.
  3.  **Concede Gracefully:** Acknowledge the film handwaves the *mechanism* of cognitive change. Position this not as a flaw, but as highlighting where *even the film* relies on intersubjective grounding (testimony) when individual sensory grounding fails. Its "cheat" reveals a philosophical truth: grounding often depends on others.
  4.  **Conclusion:** *Arrival* shows grounding requires **intersubjective practices** (early) and **communities of knowledge** (late). It doesn’t solve the grounding problem, but it exposes the poverty of individualist, purely causal models and forces us toward social-pragmatic accounts.

  ### Key Scenes to Analyze
  1.  **Mahjong vs. Science Practice:** Demonstrates practice determines symbolic content ("weapon"/"tool").
  2.  **The "Gift" Ritual & Glass Break:** Shows grounding via shared risk/norms, not ostension.
  3.  **Louise Receiving "Abbott has death process":** Highlights testimonial grounding within a practice.
  4.  **Louise Calling Shang:** Illustrates grounding future referents via testimony, not teleology.

  This approach makes *Arrival* a serious case study: it uses narrative to dramatize the *social dimensions* of grounding that analytic arguments often undersell, while its evasion ironically underscores the limits of individualist grounding. That’s a defensible, original contribution to your seminar.
