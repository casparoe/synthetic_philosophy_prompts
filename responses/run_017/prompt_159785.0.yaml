  Their temporal thickness suspicion is brilliant. Philosophy often fixates on qualia (subjective experience), but narrative reveals that *temporal depth*—backstory shaping actions, future projections—is what separates dog plots ("survive winter") from fly moments ("escape now"). This aligns with "motivation" requiring continuity. The residue? Philosophy struggles with *unreliability as evidence of interiority*—e.g., an android written as unreliable implies sentience even if debated philosophically.  

