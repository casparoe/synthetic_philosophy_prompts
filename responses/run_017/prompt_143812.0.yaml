prompt: |-
  Hi — I write about science and ideas for a living, and I've been banging my head against a piece about the 'man of his time' defence for about a week, mainly because my own gut reactions don't add up to anything I can say out loud. So here are my verdicts, and I'd like the principle behind them, if there is one. A Roman senator who owns slaves: I barely blame him at all. A Virginia planter in the 1790s who owns slaves: I blame him plenty, even though it's the same institution — the difference for me seems to be that by then the language of universal rights was in the air and there were actual abolitionists you could have listened to. Jefferson: no defence from me, and I actually score him slightly worse than a neighbour who did the same things, because he wrote the words and by most accounts had private doubts; and yet I don't want his statue down, I want the plaque rewritten, which sits oddly with how little I care about the Roman. Columbus: no defence whatsoever — he was a governor whom contemporaries accused of serious brutality, the Crown sent someone out who arrested him and shipped him home in 1500, and I'm completely fine watching his statues come down, even though the scale of what Jefferson did is arguably far worse, so my reactions there are backwards on the numbers. Churchill: I shrug at a lot of the race-and-empire material, but I don't shrug at the wartime Bengal famine, and I count it against him more that he kept arguing for empire after the wind had clearly turned — someone who merely goes along with a settled norm and someone who turns into that norm's loud defender once it's contested do roughly the same acts, and I score them very differently. A hypothetical: a nutrition researcher in the late '60s quietly takes money from a sugar lobby to argue that the evidence linking sugar to heart disease is shaky; his peers did it, professional norms more or less permitted it, and he probably half believed it. I blame him outright and give him none of the discount I gave the Roman, and I can't tell you why those two come apart. And looking forward: I get genuinely defensive when people say future generations will judge us over factory farming the way we judge the past, and I want to say that would be unfair — but I refuse the same generosity backwards, and that asymmetry bugs me.

  My own draft, which I'm pretty sure is broken: you get a discount when (a) nobody in your information environment was saying the thing was wrong in a way you could actually have heard, (b) you didn't double down once people started saying it, and (c) the bad thing isn't what your celebrated achievement actually consists in. Please give me a principle, or two or three rival candidates, stated tightly, with the case that forces each clause; then tell me what it says about cases I haven't listed — a revered mid-century scientist whose famous result can only be extracted from data from an experiment that was already considered unethical at the time, someone who was *ahead* of their time (do they get credit symmetric to the blame I hand out?), a living eighty-five-year-old who said awful things in 1974 and never walked them back, and a statue that turns out to have been erected in the 1890s versus an identical one erected generations later as deliberate pushback, where I suspect I'm judging the people who put it up and not the person at all. Then: which of my verdicts your principle can't save, and where your own reasoning is weakest — what argument, or what kind of case, would make you switch. No reading lists or citations please, I want the argument itself. Oh, and for what it's worth, I notice I'm definately not neutral here: I want to come out still being allowed to blame people.
reasoning: |-
  Okay, let's tackle this. The user is a science writer struggling with the "man of his time" defense. They've provided specific historical figures and scenarios, each with their own nuanced blame judgments. The key is to find underlying principles that explain their reactions without contradictions.

  First, I need to parse their examples. The Roman senator gets a pass, but the Virginia planter doesn’t—despite both owning slaves. The difference seems to be the presence of abolitionist ideas in the 1790s. Jefferson is blamed more for his hypocrisy, yet his statues should stay with revised plaques. Columbus gets no defense, while Churchill’s Bengal famine and post-empire advocacy are held against him. The nutrition researcher is blamed outright, unlike the Roman. The user feels defensive about future judgments on factory farming but doesn’t extend that generosity backward. There’s an asymmetry here that bothers them.

  Their draft criteria are (a) no one was saying it was wrong, (b) didn’t double down, (c) the bad thing isn’t central to their achievement. But these don’t fully cover all cases. For example, the nutrition researcher had peers doing the same, yet gets no discount. Why? Maybe because the harm was immediate and avoidable, or because they had access to contrary evidence. 

  Looking at their examples, moral proximity seems crucial. The Roman senator’s world lacked the conceptual tools for abolition, making it hard to expect different actions. By Jefferson’s time, Enlightenment ideas provided those tools, so he had less excuse. Columbus’s brutality was condemned even by contemporaries, so he was aware it was wrong. Churchill doubled down after norms shifted, which amplifies blame. The nutrition researcher, though norms permitted it, had scientific methods to discern truth, so moral and epistemic failure combine.

  Another angle is how central the wrongdoing is to their legacy. Columbus is celebrated for discoveries tied directly to his atrocities, so removing statues makes sense. Jefferson’s achievements in founding documents are separable from slavery; thus, rewriting plaques acknowledges complexity. The hypothetical scientist’s unethical experiment taints their result, so the achievement is inseparable from the harm.

  Future judgments on factory farming: the user resists because current awareness isn’t universal, and systemic factors limit individual action. But they deny past figures the same leniency, creating asymmetry. This might stem from believing current norms are more justified or that they’re actively questioning, unlike past figures who upheld status quo.

  Testing principles: 

  1. **Moral Horizon Principle**: Blame proportional to available alternatives. Virginia planter had abolitionist ideas; Roman didn’t. Nutrition researcher had scientific integrity norms; Roman didn’t have abolitionist frameworks.

  2. **Defiance Discount**: Reduces blame if no doubling down. Churchill defended empire post-shift, so more blame. 1974 bigot never recanted—no defiance discount.

  3. **Legacy Severability**: Can the achievement stand apart from the harm? Columbus’s actions are core to his legacy; Jefferson’s writings aren’t solely tied to slavery. The mid-century scientist’s data from unethical experiments isn’t severable, so diminished credit.

  Weaknesses: Moral Horizon requires historical context knowledge, which can be incomplete. Defiance Discount might undervalue passive compliance’s harm. Legacy Severability risks oversimplifying complex legacies.

  Cases like statues erected in 1890s vs. later as pushback: judging the erectors’ intent, not the subject. The later statue is a deliberate endorsement of contested norms, so more blameworthy.

  The nutrition researcher case challenges Moral Horizon since norms permitted taking lobby money. But the user blames them anyway. Here, the epistemic failure—ignoring evidence for profit—overrides period norms because scientific truth-seeking was a known value, even if violated.

  Switching point: If factory farming harms are as well-understood as past wrongs, future blame would be justified. But currently, systemic entrenchment and lack of alternatives might reduce individual blame, similar to the Roman.
answer: |-
  Here's a tight set of principles derived from your intuitions, tested against your cases and extended to new ones. Your draft is close but needs refinement to handle asymmetries.

  ---

  ### Core Principles
  1. **Moral Horizon Principle**:  
     Blame scales inversely with the *conceptual availability* and *social viability* of alternatives.  
     - **Why?** Moral imagination is constrained by epistemic environment. If no coherent counter-narrative exists (e.g., abolitionism in ancient Rome), blame diminishes.  
     - **Saves**: Roman senator (no abolitionist framework) vs. Virginia planter (rights discourse existed).  
     - **Breaks**: Nutrition researcher. Peer norms permitted sugar lobbying, but the *scientific method itself* was a viable counter-narrative; he betrayed a known epistemic duty.

  2. **Defiance Discount**:  
     Active defense of a harmful norm *after* credible criticism emerges increases blame. Passive compliance gets partial leniency.  
     - **Why?** Doubling down signals moral negligence; mere conformity may reflect inertia or fear.  
     - **Saves**: Churchill (post-1945 empire advocacy) vs. a silent peer. Jefferson’s hypocrisy (writing "all men are created equal" while enslaving people) compounds his defiance.  
     - **Breaks**: Your gut on Columbus. Contemporaries condemned him (no defiance discount needed—he was already "out of time").

  3. **Legacy Severability**:  
     We judge historical figures more harshly when their celebrated achievements are *intrinsically tied* to their harm.  
     - **Why?** Commemoration feels fraudulent if the achievement relies on the wrong (e.g., Columbus’s statues celebrate colonial conquest).  
     - **Saves**: Columbus (statues symbolize brutality) vs. Jefferson (Declaration ideals are severable from slavery).  
     - **Breaks**: None in your cases—explains statue asymmetry.

  ---

  ### Applying to New Cases
  - **Mid-century scientist using unethical data**:  
    - **Blame**: High. *Moral Horizon* narrows (ethics debates existed), *Legacy Severability* fails (achievement depends on harm).  
  - **Ahead-of-their-time figure (e.g., early abolitionist)**:  
    - **Credit**: Asymmetric to blame. Moral courage exceeds baseline duty; blame punishes failure to meet minimums.  
  - **85-year-old who never recanted 1974 views**:  
    - **Blame**: Full. *Defiance Discount* lost—they had decades to adjust to new norms.  
  - **Statue erected in 1890s vs. identical statue in 1950**:  
    - **1890s**: Context may reflect period norms (low blame for erectors).  
    - **1950s**: Likely deliberate pushback against civil rights gains (high blame—violates *Defiance Discount*).  

  ---

  ### Where Your Verdicts Strain the Principles
  - **Nutrition researcher**:  
    - Your blame makes sense if we add: **Epistemic Fidelity**. When harm flows from *denying knowable truth* (e.g., science’s self-correction ethos), norms offer less cover. The Roman had no comparable epistemic tool.  
  - **Future judgment of factory farming**:  
    - Your defensiveness is consistent: *Moral Horizon* isn’t fixed. You intuit alternatives (plant-based diets, ethics) aren’t *socially viable* yet for mass condemnation. But asymmetry arises because *you know the harm*, unlike Romans. Principle 1 explains this: future generations will judge based on *their* horizon, not yours.  

  ---

  ### Weaknesses and Switching Points
  - **Weakness in Moral Horizon**:  
    How do we measure "viable" alternatives? If abolitionists were 0.1% of Romans, does that absolve senators? *Switching point*: Evidence that suppressed alternatives existed (e.g., slave revolts with moral claims) increases blame.  
  - **Weakness in Defiance Discount**:  
    Ignores power dynamics. A planter who stayed silent to avoid ostracism vs. Jefferson’s leadership role. *Switching point*: If the "silent" figure had disproportionate influence (e.g., a media baron), their compliance becomes active endorsement.  
  - **Your Unbroken Verdict**:  
    Columbus is the litmus test. Principles 1 and 2 condemn him (criticism was available; brutality was core to his governance). Your reaction holds.  

  ---

  ### Final Principle (Your Draft Refined)  
  **You get a blame discount iff:**  
  - (a) No coherent moral alternative existed in your epistemic environment (*Moral Horizon*),  
  - (b) You did not actively defend the harm after credible criticism emerged (*Defiance Discount*), **and**  
  - (c) The harm is not essential to your recognized achievement (*Legacy Severability*).  

  **Why you still get to blame people:**  
  This framework reserves full blame for those who *could have known better, chose not to adapt, or built their legacy on harm*. It avoids moral relativism by anchoring to historical contingencies—exactly what your intuitions demand.
