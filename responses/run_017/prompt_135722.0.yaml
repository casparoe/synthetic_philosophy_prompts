prompt: |-
  I write fiction, and for the past four years I have served as one of seven trustees of the Verrall Trust, a private foundation that makes a handful of large, unrestricted grants in fundamental science. Our charter points us toward work that no conventional funder will touch because its payoff is distant, speculative, or embarrassing to describe.

  The proposal in front of us is called Empirical Constraints on Simulated Cosmologies, submitted by a consortium of theoretical physicists, for roughly $9 million over five years. It has two work packages. The first is archival and cheap: mine existing data for signatures that the world is computed rather than basic — a lattice-like discreteness in the arrival directions of ultra-high-energy cosmic rays, a preferred-frame anisotropy that would betray cubic structure in spacetime, and what they call a resource ceiling, a level of complexity in many-body quantum systems past which the world's behaviour stops matching any continuous model. The second is the one that has divided us. Using beam time that is already scheduled at an existing heavy-ion collider, they want to tune a series of collisions so as to maximize the computational cost of simulating the collision region. Their reasoning is that a simulation running on finite hardware must have a resolution and complexity budget, and that a load engineered to exceed that budget must produce one of two observable outcomes: visible degradation, in the form of artifacts, or an intervention by whoever is running the simulation. They intend, deliberately, to make the simulation notice us. The incremental cost of this is small, which is why several trustees are tempted to let it ride along with the rest.

  The objections are the ones you would expect: that the worst case is everyone dying and that no one elected this consortium to run that risk on the rest of us, the comparison being to the dispute about whether anyone should broadcast messages to the stars before humanity has agreed to it; and, from two trustees, that the whole programme is unfalsifiable anyway, since any artifact could simply be a law of this world and simulators could fabricate the absence of artifacts, so a negative result buys us nothing. The applicants rebut both, and one of their rebuttals strikes me as the most interesting sentence in the document: if simulators routinely shut down a simulation once its inhabitants began straining the resource budget, then the fact that we have already built colliders, thermonuclear weapons and large quantum computers without being switched off is itself evidence that no such intervention policy governs this world, and the provocation run therefore adds no risk that the last eighty years of physics have not already run. One trustee calls this the best argument in the proposal; another says it is a selection effect of precisely the kind that makes arguments like it untrustworthy.

  Our chair has asked me to draft the board's recommendation memo, on the grounds that the two scientific advisers' notes are, in her phrase, unreadable to the rest of us, and that I am the trustee who has spent the most time thinking about what it would mean to be a character in somebody else's story. I should also declare an interest: my last novel was set inside a simulated city, and part of me very much wants them to switch the machine on. So I need the memo to be written so that a trustee who wants the opposite outcome could still use it.

  Please draft it: about 1,200 words, addressed to the trustees of the Verrall Trust, suitable for circulation at our next meeting, that

  - gives a bottom line in the first paragraph — fund both packages, fund the archival package subject to conditions, fund the archival package only, or decline outright — in a form the board could vote on by a show of hands;
  - explains, for trustees who are not physicists, what the simulation argument actually establishes and what it does not: the three-horn conclusion about extinction, ancestor-simulations, and ourselves, the roles of substrate-independence and of an indifference assumption about which observers we should take ourselves to be, and why the argument is not by itself a reason to think we are simulated;
  - assesses the provocation run's we-would-already-be-dead rebuttal fairly, saying what it gets right and where, if anywhere, it breaks;
  - addresses the consent problem and says whether the analogy with broadcasting to the stars actually holds;
  - sets out conditions or a timetable the researchers could genuinely respond to — a deferred decision on the provocation run pending results from the archival work, external review, some form of wider consultation — rather than generalities about oversight;
  - and states the strongest consideration against its own recommendation in a paragraph an opponent could sign.

  If the honest answer is that the decision turns on something the board does not yet know, say what that is and how we could find it out, and then recommend what to do in the meantime.
reasoning: |-
  Okay, the user is a fiction writer and trustee of the Verrall Trust, which funds unconventional science. They need help drafting a recommendation memo for a controversial grant proposal about simulated cosmologies. The proposal has two parts: one archival and cheap, the other provocative and risky. The board is divided, and the user has a personal interest since their last novel involved a simulated city. They want a balanced memo that someone with opposing views could still use.

  Hmm, this is complex. The user needs a structured memo covering six specific points: a clear funding recommendation upfront, an explanation of the simulation argument for non-physicists, fair assessment of the "we'd already be dead" rebuttal, analysis of the consent problem, concrete conditions for approval, and stating the strongest counterargument. The memo must remain neutral despite the user's personal fascination with the experiment.

  First, I should acknowledge the core tension: the Verrall Trust exists to fund "unfundable" science, but this proposal intentionally provokes potential simulators. The archival work seems uncontroversial - mining existing data for simulation signatures. The provocation run is the real issue: deliberately stressing reality to trigger observable artifacts or interventions.

  The simulation argument explanation needs simplification. For non-physicist trustees, I'll break down Bostrom's trilemma: either civilizations go extinct before simulating realities, or they choose not to, or we're probably in one. Key distinctions: substrate-independence (consciousness could run on silicon) vs. the indifference assumption (we're random observers, not special). Crucially, the argument doesn't prove we're simulated - just that one of three unlikely scenarios must be true.

  The "we'd already be dead" rebuttal is clever but flawed. Yes, building colliders/weapons/computers hasn't triggered intervention, suggesting either no simulators or no intervention policy. But this assumes: 1) Simulators would only care about computational strain, not intentional provocation 2) Our past experiments approached the system's limits 3) Simulators can't retroactively erase evidence. The selection effect counter - that we couldn't observe worlds that got shut down - is valid but not fatal. The risk might be low, but non-zero and unquantifiable.

  On consent: the METI (messaging extraterrestrials) analogy holds partially. Both involve small-but-unknown existential risks imposed without consensus. Key differences: METI assumes external observers; this assumes internal controllers. METI's risks are debated; this is entirely novel. The consent problem is real - but Verrall exists precisely to fund what conventional bodies won't touch.

  For conditions: Deferring the provocation run until archival results makes sense. Also require: 1) Quantifying what "maximizing computational cost" means 2) Independent risk assessment 3) Pre-registered analysis to avoid false positives 4) International science policy consultation. No performative oversight - real hurdles.

  Strongest counterargument: The provocation run risks catastrophe for zero gain. If we're simulated, negative results prove nothing (simulators could fake reality). If we're not, we learn nothing new. The archival work alone could find evidence without risk. Spending $9M on this when real cosmological mysteries need funding is irresponsible.

  Recommendation: Fund archival work now ($1.2M). Defer provocation run pending phase-one results, external review, and risk assessment. Structure the vote as four options: full funding, archival-only, archival-with-conditions, or reject. Memo must empower both supporters and opponents - hence including a signable opposition paragraph.

  Personal note: The user's conflict is fascinating. As a writer, they're drawn to the experiment's narrative potential. As a trustee, they must prioritize existential caution. The memo should acknowledge but bracket that tension. Neutral language is key - no "thrilling" descriptors despite the sci-fi allure.
answer: |-
  ## MEMORANDUM

  **TO:** Trustees of the Verrall Trust  
  **FROM:** [Your Name], Trustee  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommendation on Proposal: Empirical Constraints on Simulated Cosmologies  

  **1. Recommendation**  
  The Verrall Trust should fund the archival research package of the “Empirical Constraints on Simulated Cosmologies” proposal at the requested level ($1.2 million over 3 years), subject to successful external peer review focused on methodological rigor and feasibility. Funding for the second work package, the deliberate "provocation run," is deferred pending the results of the archival phase, an independent risk assessment, and wider scientific consultation. The Board is requested to vote on the following motion: *"Approve funding for the archival research package subject to peer review, and defer consideration of the provocation run pending further deliverables and assessments."*  

  **2. Understanding the Simulation Argument (For Non-Physicists)**  
  The proposal rests on the "simulation argument," popularized by Nick Bostrom. This is a *logical* argument, not empirical proof, and understanding its structure and limitations is crucial:  

  *   **The Trilemma (The Three Horns):** Bostrom argues at least one of three propositions must be true:  
      1.  **Extinction:** Almost all civilizations at our technological level go extinct before developing the capability to run realistic ancestor-simulations (simulations of their own past, containing conscious beings).  
      2.  **Disinterest:** No civilization that reaches this capability chooses to run a significant number of such simulations (perhaps due to ethics, resource constraints, or lack of interest).  
      3.  **Simulation:** We are almost certainly living in a computer simulation run by a posthuman civilization.  
      *Crucially, the argument does not claim we know which proposition is true; it claims one of them must be.*  

  *   **Substrate-Independence:** A core premise is that consciousness isn't inherently tied to biological brains ("substrate"). If a computational process can replicate the functions generating consciousness (a highly debated assumption), then conscious beings could exist within a sufficiently complex simulation running on non-biological hardware.  

  *   **The Indifference Assumption:** The argument relies on statistical reasoning. If *many* simulations are run (Horn 3), then the vast majority of conscious observers like us would exist within simulations, simply because there are vastly more simulated minds than original biological ones. If we assume we are *typical* observers (not specially privileged), the odds favor us being simulated.  

  *   **What the Argument Does NOT Do:**  
      *   **Prove We Are Simulated:** It argues that *if* Horns 1 and 2 are false, then Horn 3 is very likely true. But Horns 1 and 2 remain plausible. The argument highlights a logical possibility, not a certainty.  
      *   **Predict Specific Simulation Artifacts:** It doesn't tell us what glitches or limitations a simulation might have; that requires specific hypotheses about the simulators' technology, goals, and resource constraints.  
      *   **Justify Any Specific Action Regarding Simulation:** It doesn't inherently recommend trying to contact simulators, provoke them, or assume their nature (benevolent, indifferent, hostile).  

  The proposal seeks to move beyond this abstract argument by searching for concrete, observable *signatures* potentially indicative of a computational substrate, thereby testing specific hypotheses *derived* from the possibility raised by Horn 3.  

  **3. Assessing the "We-Would-Already-Be-Dead" Rebuttal**  
  The applicants argue that if simulators routinely shut down simulations approaching resource limits, our continued existence after developing technologies like thermonuclear weapons, large colliders, and quantum computers constitutes evidence against such an intervention policy. Therefore, they claim, the provocation run adds negligible new risk.  

  *   **What It Gets Right:**  
      *   **Empirical Constraint:** This is a valid point. Our historical trajectory *does* provide *some* evidence. The absence of catastrophic intervention following significant technological leaps (especially those involving immense energy densities or complex computations) suggests that either: (a) no such simulators exist, (b) they exist but lack an intervention policy triggered by resource strain, or (c) their intervention threshold is far beyond what we've achieved. It logically weakens the assumption that simulators *must* be trigger-happy.  
      *   **Risk Contextualization:** It correctly frames the provocation run as potentially within the envelope of risks we've already implicitly run.  

  *   **Where It Breaks:**  
      *   **The Unknown Threshold:** We have no knowledge of the *actual* computational limits of the underlying substrate (if it exists). Past events may simply not have approached the critical threshold. The provocation run is explicitly designed to *maximize* computational cost in a targeted way, potentially probing close to or beyond a limit that previous events did not.  
      *   **Intent Matters:** Simulators might be indifferent to *accidental* strain (like a supernova or our existing experiments) but react strongly to *deliberate, targeted attempts* to probe the simulation's limits or attract attention. This is analogous to the difference between natural background radiation and deliberately shining a bright light towards an unknown observer.  
      *   **Selection Effect (Survivorship Bias):** As noted by one trustee, our very existence *presupposes* that no intervention has happened *yet*. We cannot observe the universes (simulations) that *were* shut down. Our continued existence is necessary for us to be making this argument, but it doesn't definitively prove future interventions are impossible. It only proves we haven't triggered one *so far*.  
      *   **Nature of Intervention:** The rebuttal assumes intervention means "shutdown." Simulators might have other, subtler responses: introducing errors, altering fundamental constants locally, or manipulating events to prevent the experiment's success, all potentially disruptive or dangerous but not necessarily an immediate, observable extinction event.  

  **Conclusion:** The rebuttal usefully contextualizes the risk but does not eliminate it. The risk remains unknown and potentially non-zero. The *deliberate* nature of the provocation and its *specific targeting* of computational limits introduce a qualitative difference from past technological developments.  

  **4. The Consent Problem and the METI Analogy**  
  The objection that the consortium is imposing an unknown, potentially existential risk on all humanity without consent is serious and parallels the debate around Messaging Extraterrestrial Intelligence (METI).  

  *   **Does the Analogy Hold?**  
      *   **Similarities:** Both involve actions (broadcasting/provoking) that could potentially attract the attention of powerful, unknown entities (aliens/simulators) whose motivations and capabilities are completely unknown, posing a small-but-unknowable existential risk imposed without global consent. Both raise profound questions about who has the right to take such risks on behalf of humanity.  
      *   **Differences:**  
          *   **Target:** METI targets potential entities *outside* our reality. The provocation run targets potential entities *controlling* our reality (if the hypothesis is correct).  
          *   **Mechanism:** METI relies on signals traversing space. The provocation run relies on straining an underlying computational process.  
          *   **Evidence Base:** The simulation hypothesis, while speculative, is grounded in cosmological and information-theoretic concepts debated within physics. METI's risk assessment involves more conjectural models of alien sociology.  
          *   **Plausibility of Non-Intervention:** The "we-would-already-be-dead" argument (flawed as it may be) provides a *unique* counterpoint specific to the simulation scenario that doesn't directly apply to METI.  

  *   **The Consent Problem:** The analogy holds sufficiently to make the consent objection valid and significant. The Verrall Trust funds high-risk, unconventional science, but this proposal ventures beyond scientific risk into the realm of potential global consequence. While conventional funding bodies avoid such risks due to conservatism or lack of mandate, the Trust must grapple with the ethical weight of potentially affecting all humanity. We cannot obtain meaningful global consent. Our responsibility is to exercise extreme due diligence, prioritize lower-risk paths to knowledge, and ensure the potential knowledge gained justifies the potential risk imposed.  

  **5. Proposed Conditions and Timetable**  
  To move forward responsibly, particularly regarding the deferred provocation run, we require concrete steps beyond vague oversight:  

  1.  **Archival Phase Execution & Analysis (Years 1-3):** Fund the archival work ($1.2M). **Deliverable:** Comprehensive report analyzing existing data for the proposed signatures (discreteness, anisotropy, resource ceiling), including null results and methodological limitations.  
  2.  **Independent Peer Review (Upon Archival Completion):** Before any consideration of the provocation run, the *full* proposal (especially the provocation methodology and risk assessment) plus the archival results must undergo rigorous review by an independent panel of physicists, cosmologists, computational scientists, and potentially philosophers of science or risk analysts. **Deliverable:** Review panel report assessing scientific merit, feasibility of the provocation run design, and validity of the risk arguments.  
  3.  **Focused Risk Assessment (Triggered by Archival Results):** *If* the archival phase yields intriguing (even ambiguous) positive signals, a dedicated, independent risk assessment must be commissioned. This should explore *beyond* the "we-would-already-be-dead" argument, considering alternative simulator motivations, potential intervention mechanisms, and failure modes. **Deliverable:** Formal risk assessment report.  
  4.  **Scientific & Policy Consultation (Post-Review/Risk Assessment):** Before a final decision on the provocation run, the Trust should solicit perspectives from broader scientific bodies (e.g., relevant committees of national academies) and potentially experts in science policy and ethics concerning humanity-scale risks. **Deliverable:** Summary of consultations.  
  5.  **Clear Go/No-Go Criteria for Provocation Run:** Before archival work begins, the consortium must define objective thresholds based on archival results that would either: a) make the provocation run scientifically compelling enough to reconsider, or b) render it scientifically futile (e.g., strong negative results on all signatures).  

  **6. The Strongest Consideration Against This Recommendation**  
  *(Paragraph for an Opponent to Sign)*  

  **"This recommendation fatally undermines the Verrall Trust's core mandate and the scientific promise of this proposal.** By delaying the provocation run indefinitely behind layers of reviews and consultations predicated on the archival work's success, we guarantee only half an experiment. The archival search, while worthwhile, is fundamentally passive and retrospective; it seeks evidence of simulation design choices potentially made billions of years ago. The provocation run is the *active*, *prospective* test – the only component designed to elicit a *response* and provide potentially unambiguous evidence *now*. The 'we-would-already-be-dead' argument, while imperfect, powerfully demonstrates that the unique risk of the provocation run is negligible compared to risks humanity has already blindly incurred. The cited consent objection, while emotionally resonant, is paralyzing and applicable to nearly all transformative science; if imposed rigorously, it would prevent the Trust from funding anything truly novel. Deferral is effectively a soft rejection, sacrificing a unique opportunity to empirically test a profound cosmological hypothesis due to exaggerated fears of an unquantifiable, speculative risk. The Trust exists precisely to fund such daring, unconventional science that others deem 'too risky' or 'too strange.' This recommendation represents a failure of nerve. We should fund the full proposal now, or admit we lack the courage of our founding principles."  

  **Conclusion**  
  The decision hinges critically on an unknown: the *actual* level of risk posed by the deliberate provocation run. The archival work offers a responsible, lower-risk path to gather preliminary evidence and refine our understanding without active provocation. Funding it aligns with the Trust's mission to explore fundamental, unconventional questions. The provocation run, however, presents a qualitatively different risk profile – small but unquantifiable and universal. We lack sufficient information to judge this risk adequately *at this time*.  

  The recommended path provides a mechanism to potentially gain that information:  
  1.  The archival results may strengthen or weaken the scientific case for a simulation.  
  2.  The independent review and potential risk assessment can provide a clearer, external perspective on the provocation run's merits and dangers.  
  3.  Wider consultation can inform the ethical dimension.  

  This approach allows the vital, less contentious science to proceed while demanding rigorous justification before authorizing the step that truly embodies the "unfundable" spirit of the Verrall charter – the deliberate attempt to make the simulation notice us. It balances our mandate for boldness with our responsibility to humanity. I urge the Board to support the motion.
