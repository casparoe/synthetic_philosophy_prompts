answer: |-
  Here’s a decision procedure grounded in Strawson’s framework, designed for clinical pragmatism. I’ll walk through it step by step, then apply it to your three cases, and close with its inherent limitations. The goal is to systematise the excuse/exemption distinction while explicitly bypassing unanswerable metaphysical questions about "could he have done otherwise?"—since, as Strawson argued, our practices of holding responsible operate independently of determinism. The procedure stops early if an exemption applies; otherwise, it defaults to moral-protest stance unless an excuse is substantiated. Value judgments are flagged where they arise.  

  ### The Procedure  
  Start by asking:  
  1. **Is there evidence of a current, severe cognitive or volitional impairment directly relevant to the behaviour in question?**  
     - *This targets exemptions: conditions (e.g., psychosis, severe intellectual disability, catatonia) that temporarily suspend moral address by undermining basic agency.*  
     - **Sufficient evidence:** Documented psychosis, disorientation, or neurological incapacity *at the time of the act*. Absent this, proceed. Inconclusive data defaults to "no."  
     - *If yes → Adopt management stance. Procedure stops here.*  

  2. **If no exemption, does the person have a chronic condition that systematically distorts their moral understanding or emotional responses?**  
     - *Strawson’s exemption category includes profound, persistent distortions (e.g., severe autism with no theory of mind, chronic traumatic brain injury impairing empathy).*  
     - **Key distinction:** This is *not* about diagnostic labels but functional capacity. Does the condition preclude grasping the interpersonal meaning of blame or forgiveness?  
     - **Value judgment:** Clinicians must weigh if the condition *fundamentally* disrupts moral reciprocity. If uncertain, default to "no."  
     - *If yes → Management stance. Procedure stops.*  

  3. **If no exemption, consider excuses: Was the act meaningfully influenced by factors that mitigate blame without negating agency?**  
     - *Excuses (e.g., acute stress, partial remission, coercive context) acknowledge agency but contextualise the act.*  
     - Ask:  
       - **a)** Did the person lack a feasible alternative in that moment? (e.g., no access to PRN, imminent threat).  
       - **b)** Was their intention misaligned with the outcome? (e.g., self-harm gesture unintentionally alarming others).  
       - **c)** Was their capacity for self-control significantly eroded by treatable factors? (e.g., untreated pain, medication side effects).  
     - **Sufficient evidence:** Plausible connection between factor and act. Absent evidence, assume no excuse.  
     - *If excuse substantiated → Moral-protest stance, but adapt language to acknowledge context (e.g., "We understand you were overwhelmed, but breaking the window endangered others").*  
     - *If no excuse → Moral-protest stance (resonant demands, reproach, forgiveness permitted).*  

  4. **For all decisions, add: "Could this stance cause foreseeable harm?"**  
     - *Overrides the above. E.g., moral protests escalating violence in acute crisis; management stance enabling harmful dependency. Handled as a clinical value judgment.*  

  ---  
  ### Application to Cases  
  **Case 1: Bipolar man, hypomanic episode debts/threats, now well. Mother demands accountability.**  
  - Step 1: No *current* impairment (now euthymic). No exemption → Proceed.  
  - Step 2: Bipolar isn’t a *systematic* distortion of moral understanding; he feels shame, grasps wrongfulness. No exemption → Proceed.  
  - Step 3: During the act, hypomania likely impaired impulse control (excuse). Thus: Moral-protest stance *tempered* with excuse-acknowledgment:  
    > "We hold you accountable for the impact on your mother, but we discuss this knowing your illness made self-control harder then. Your current remorse matters."  
  - *Why not management?* Exemption doesn’t apply; writing it off as "just illness" denies his agency and shame. His mother’s insistence aligns with retaining him in the moral community.  

  **Case 2: Woman with EUPD, chronically breaks care plans. Team defaults to management stance.**  
  - Step 1: No evidence of psychosis or cognitive incapacity → Proceed.  
  - Step 2: EUPD does not *systematically exempt* from moral address. Distress may explain behaviour, but she understands commitments and their breach. No exemption → Proceed.  
  - Step 3: Excuses? Chronic emptiness/fear may erode self-control, but this *mitigates* rather than negates blame.  
  - **Verdict:** Your team’s management stance is a *misapplied exemption*, withdrawing moral address unjustly. Strawson would call this an injury—a denial of her status as a moral agent. Moral-protest stance is required:  
    > "We must reproach broken commitments (e.g., 'When you skip housing meetings, it undermines our trust'), while exploring *why* self-sabotage feels necessary. Forgiveness remains possible."  
  - *The hard truth:* Treating her as "unfit" for blame is indeed patronising, not kind. It avoids the discomfort of holding her accountable, which she deserves as a person capable of moral engagement.  

  **Case 3: Man invokes diagnosis to void promises: "It wasn’t me, it was the illness."**  
  - Step 1/2: Does his condition cause *exempting* impairment? If schizophrenia with reality distortion during acts, maybe. If anxiety/depression, likely not. **Value judgment required:** Clinicians must decide if his impairment reached exemption threshold *at the time of the act*.  
  - If exempt → Management stance: "We focus on stabilising symptoms before revisiting promises."  
  - If not exempt → Proceed to Step 3: Does illness provide an *excuse*? E.g., "Your depression made keeping promises harder, but we still discuss why they matter."  
  - **His self-exemption claim:** Resist letting him unilaterally declare exemption. His self-reactive attitudes (guilt/shame) suggest he *does* grasp moral stakes. Your response:  
    > "We hear you feel disconnected from your actions, but we assess exemptions clinically. For now, we’ll [moral-protest/management] based on evidence, not self-diagnosis."  
  - *Resentment’s role:* If no exemption, your resentment is a natural participant attitude. Suppressing it entirely (management) invalidates your moral response; channeling it constructively (protest) acknowledges interdependence.  

  ---  
  ### What the Procedure Cannot Do  
  1. **Resolve determinism debates:** It explicitly bypasses "Could he really have done otherwise?" as unanswerable and irrelevant to practice. The procedure asks only about *operational* capacities (cognitive/volitional impairment), not metaphysical freedom.  
  2. **Assign weight to values:** When clinical judgment is needed (e.g., Step 2’s "systematic distortion," harm assessment), it flags but cannot replace collective wisdom. Tribunals may challenge these judgments.  
  3. **Guarantee therapeutic efficacy:** A correct moral-protest stance may still provoke shame or disengagement. The procedure ensures moral consistency, not clinical success.  
  4. **Handle hybrid cases:** Some acts may blend exempting/excusing factors (e.g., psychosis *and* coercion). Staff must prioritise the dominant factor, knowing the split is imperfect.  
  5. **Replace risk formulation:** It doesn’t assess danger or prioritise interventions—only whether moral address is appropriate.  

  This won’t eliminate drift entirely—values still permeate Steps 2 and 4—but it grounds decisions in agency-assessment, not affinity. By starting with exemptions and requiring evidence for excuses, it curbs the instinct to over-manage "difficult" cases or moralise towards "unlikable" ones. The monthly psychiatrist review is crucial for catching bias. If you implement it, stress that Strawson’s point isn’t to pathologise but to clarify when pathology *truly* suspends moral dialogue—which is rarer than clinicians assume.
