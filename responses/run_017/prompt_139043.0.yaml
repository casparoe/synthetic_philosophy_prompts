prompt: |-
  I've been going back and forth in the usual places — a forecasting Slack, some Astral Codex Ten comment threads, a reading group that ground its way through Ellsberg — about whether a rational agent can really have indeterminate credences, or whether, as people in those circles like to say, your uncertainty about a probability is itself just another probability and "imprecise credence" is either incoherent or redundant notation. I've drifted toward the imprecise-probability side without being able to say exactly what I'm signing up for, and my use case is narrow enough that I'd rather have the spec than the menu: I want to represent genuine severe uncertainty in catastrophic-risk estimates, where several credible models disagree, nobody will commit to a prior over the models, and yet a decision has to come out the other end — plus a side interest in what it would mean for a forecaster to be *calibrated* while reporting an interval rather than a number. So: write me the requirements list — what a theory of indeterminate or imprecise credence would have to deliver to be adequate for that job, with the case or consideration behind each requirement, and with a verdict on which are non-negotiable conditions of adequacy and which are just preferences of a particular camp. The items I keep coming back to, which you should feel free to reorganize, drop, or replace with better ones:

  - a principled way to tell imprecision apart from risk aversion or from exotic tastes, so that the framework doesn't become a garbage can into which any deviation from expected-utility behavior can be dumped and reinterpreted as a belief;
  - the cases where imprecision is clearly *warranted* (a coin of wholly unknown bias, an urn of unknown composition, a one-off institutional collapse) versus the cases where it should have washed out (the same coin after a thousand flips, a model with a long calibration record) — and whether "imprecision should shrink as evidence accumulates" is a genuine requirement or merely a hope;
  - an updating story: do you condition each element of the representor separately, update the lower envelope as a whole, or appeal to something like natural extension — and what to say about the phenomenon where learning something you already knew would happen *widens* your interval for something else. Concretely: suppose two admissible priors disagree about a coin's bias but agree that the next toss is 50/50; once you learn the result of a toss, element-wise conditioning leaves you with a spread of posteriors for the following toss — from a sharp one-half to something like a third-to-two-thirds — and it widens whichever way the toss came out, so you know in advance that looking will make you less precise. Is that a reductio, a bullet to bite, or a sign that the representor was the wrong object to update?
  - dynamic consistency: whatever the updating rule, does the agent's plan survive contact with new evidence, or does the natural maximin-flavored decision rule plus conditioning lead you to avoid free information or reverse your own plans in sequential problems? I can't tell whether this is a theorem-shaped cost or a confusion, and I want to know which.
  - a decision rule, since a set of credences is not yet a decision theory: E-admissibility, maximizing the lower envelope, maximality/interval dominance, or full-blown choice functions — is coming with one part of the theory's job description, and what is the case that separates them (one where the lower envelope and admissibility disagree)? Include the collapse risks on both sides: a framework so permissive that nothing is choice-worthy, or one that secretly becomes ordinary Bayesianism with a prior over the set after all.
  - the shape of the representor: whether it should be convex, and if so why a mixture of two individually permissible priors should itself be permissible; whether it should be closed under conditioning; whether "the interval" is best read as suspension of judgment, as each element being individually acceptable, or as a distribution over distributions I decline to write down;
  - the distinction between sharpness and evidential weight — being exactly 50/50 on no evidence versus exactly 50/50 after a thousand trials — and whether a formalism with only sets in it has the resources to mark it, or whether that pushes you toward a separate dimension;
  - aggregation: two analysts report [0.2, 0.5] and [0.4, 0.8]; what is the group's interval, does pooling preserve whatever coherence conditions you imposed, and is there any coherent way to score an interval forecast for accuracy or to pay someone for reporting one honestly;
  - enough structure to be usable at all — behavior on continuous spaces, conditioning on events of probability zero, and whether the whole thing is implementable as something like a linear program rather than an existence proof.

  What I most want out of this is the negative part: tell me which subsets of the requirements look jointly unsatisfiable, since if the list itself is the interesting result, that's what I'd rather find out now. My suspicion is that there's a triangle in there — element-wise conditioning, no dilation, and dynamic consistency under a cautious decision rule — where you can have any two, and I'd like to know whether that's right, what's actually proved versus merely asserted in the folklore, and which single requirement does the most work in eliminating candidate theories. Keep the weight on the criteria and their motivating cases; a line or two on how the main approaches fare against the list is fine, but skip the full scorecard and skip references entirely — I'll go find the literature myself once I know what I'm looking for.
reasoning: |-
  We are building a requirements list for a theory of imprecise credences that must handle severe uncertainty in catastrophic-risk estimates. The key is to represent genuine uncertainty where models disagree, no prior over models is available, and decisions must be made. We also care about calibration for interval forecasts.

  We'll structure the requirements around the points provided, reorganizing for clarity. Each requirement will have:
  - The requirement statement.
  - The case or consideration motivating it.
  - A verdict on whether it's non-negotiable (necessary for adequacy) or a preference (specific camp).

  We'll also note where requirements might conflict and which single requirement does the most work in eliminating theories.

  ---

  **Requirements List for a Theory of Imprecise Credence**

  1. **Distinguish Imprecision from Risk Attitudes or Tastes**
     - *Requirement*: The formalism must have a principled way to separate indeterminate belief (epistemic) from risk aversion or other non-belief elements (practical).
     - *Motivation*: Without this, the framework becomes a "garbage can" for any deviation from expected utility, losing its epistemic meaning. In catastrophic risk, we need to isolate the uncertainty that comes from model disagreement from how we value outcomes.
     - *Verdict*: Non-negotiable. If imprecise credence is to be a genuine representation of belief, it must not be confounded with preferences.

  2. **Warranted Imprecision vs. Washout with Evidence**
     - *Requirement*: The theory must explain when imprecision is warranted (e.g., complete ignorance about a coin bias) and when it should "shrink" to a sharp value (e.g., after many coin flips). It must also clarify whether "imprecision shrinking with evidence" is a requirement or a hope.
     - *Motivation*: In catastrophic risk, initial model disagreement may be severe, but as evidence accumulates (e.g., from near-misses or small-scale tests), we expect the range of plausible probabilities to narrow. However, in some cases (e.g., one-off events), narrowing may not occur. The theory must account for both.
     - *Verdict*: Non-negotiable for adequacy. The theory must not force shrinkage in all cases (e.g., when evidence is irrelevant) but must allow for it when evidence is relevant and abundant.

  3. **Updating Rule and Dilation**
     - *Requirement*: The theory must specify an updating rule (e.g., element-wise conditioning, updating the lower envelope, natural extension) and address the phenomenon of dilation (learning can widen intervals). Specifically, it must handle cases where conditioning on an event that was known to be 50/50 leads to a widened posterior interval for a future event.
     - *Motivation*: In the coin example: two priors agree the next toss is 50/50 but disagree on the bias. After a toss, conditioning each prior leads to a posterior set that is wider (e.g., [1/3, 2/3]) than the initial point estimate for the next toss. This seems counterintuitive but might reflect genuine unresolved uncertainty. The theory must say whether this is acceptable or if it indicates a flaw.
     - *Verdict*: Non-negotiable. The updating rule is central to the theory's dynamic behavior. However, whether dilation is a reductio or a feature is a point of debate. The requirement is that the theory must have a coherent updating story that handles such cases explicitly.

  4. **Dynamic Consistency**
     - *Requirement*: The decision-making agent must not be dynamically inconsistent: a plan made ex ante should remain optimal ex post upon receiving evidence, and free information should not be avoided.
     - *Motivation*: In sequential decisions (e.g., investing in mitigation now vs. waiting for more data), a maximin-style rule might lead to avoiding free information (if it could worsen the worst-case) or reversing plans upon learning. This is problematic for rational agency.
     - *Verdict*: Non-negotiable for a normative theory. Dynamic inconsistency undermines the rationality of the agent. However, note that some argue that imprecise probabilities inherently lead to such issues, so this requirement might be a key point of conflict.

  5. **Decision Rule**
     - *Requirement*: The theory must provide a decision rule that maps imprecise credences to choices (e.g., E-admissibility, maximin, maximality). It must also handle cases where different rules conflict and avoid collapsing into either complete indecision or covert Bayesianism.
     - *Motivation*: In catastrophic risk, we need to make decisions (e.g., whether to fund a mitigation strategy). The rule must be tractable and not too permissive (leading to no choice) or too restrictive (mimicking a single prior). A key test case: when the lower envelope and admissibility disagree (e.g., one option is best in some priors but worst in others).
     - *Verdict*: Non-negotiable. Without a decision rule, the theory is incomplete. However, the choice of rule (e.g., maximin vs. E-admissibility) may be a matter of preference, provided it meets other requirements.

  6. **Structure of the Representor**
     - *Requirement*: The theory must specify the properties of the set of probability functions (the representor): convexity, closure under conditioning, and the interpretation of the set (e.g., suspension of judgment, set of acceptable priors, or an undetermined distribution).
     - *Motivation*: Convexity is often assumed (if two priors are acceptable, so is their mixture) to avoid arbitrary gaps. Closure under conditioning ensures updating doesn't produce "illegal" priors. The interpretation affects how we understand the interval (e.g., is [0.4, 0.6] a claim about the true probability or about the agent's doxastic state?).
     - *Verdict*: Partially negotiable. Convexity and closure are often imposed for technical reasons, but they might be challenged. The interpretation is crucial and non-negotiable: the theory must state what the set represents.

  7. **Distinguish Sharpness from Weight of Evidence**
     - *Requirement*: The formalism must distinguish between sharp probabilities based on no evidence (e.g., 50/50 for a coin of unknown bias) and sharp probabilities based on abundant evidence (e.g., 50/50 after 1000 fair flips).
     - *Motivation*: In forecasting, a sharp 50% forecast with no data is poorly calibrated, while the same forecast with much data is well-calibrated. The theory must capture this difference without adding a separate dimension (like "weight").
     - *Verdict*: Non-negotiable for calibration. However, it's an open challenge whether sets alone can capture this or if a richer structure (e.g., second-order probabilities) is needed.

  8. **Aggregation and Scoring**
     - *Requirement*: The theory must provide a method to aggregate imprecise credences from multiple sources (e.g., pooling [0.2,0.5] and [0.4,0.8] into a group interval) and a way to score interval forecasts for accuracy (e.g., proper scoring rules for intervals).
     - *Motivation*: In catastrophic risk, we often combine expert opinions. The pooling must preserve coherence (e.g., if both experts are coherent, so is the group). Scoring is needed to incentivize honest reporting and assess calibration.
     - *Verdict*: Non-negotiable for real-world use. Without aggregation and scoring, the theory is not practical for group decisions or forecasting tournaments.

  9. **Implementability and Technical Adequacy**
     - *Requirement*: The theory must work on continuous spaces, handle events of probability zero, and be computationally tractable (e.g., solvable as a linear program rather than a purely existential construct).
     - *Motivation*: Catastrophic risk models are often continuous (e.g., climate sensitivity). Zero-probability events arise in conditioning. Computational tractability is essential for actual decision-making.
     - *Verdict*: Non-negotiable for real-world applications. A theory that is only defined for finite spaces or is computationally infeasible is inadequate.

  ---

  **Conflicts and Trade-offs**

  The key tension is between:

  - **Element-wise conditioning** (which is intuitive and straightforward but leads to dilation).
  - **No dilation** (the desire for intervals to narrow or at least not widen with evidence).
  - **Dynamic consistency** (the requirement that plans are stable and information is not avoided).

  It is often claimed that you can have at most two of these. For example:

  - If you insist on element-wise conditioning and no dilation, you might have to give up dynamic consistency (e.g., because conditioning widens intervals and makes the agent wary of learning).
  - If you insist on no dilation and dynamic consistency, you might have to abandon element-wise conditioning (e.g., by using a different updating rule that avoids dilation, such as updating the lower envelope in a constrained way).
  - If you insist on element-wise conditioning and dynamic consistency, you may have to accept dilation as a feature (e.g., the coin example is not a reductio but reflects genuine learning that the true bias is more uncertain than initially thought).

  This triangle of requirements is the core trade-off. The most stringent requirement is **dynamic consistency** because it directly challenges the coherence of sequential decision-making. Without it, the agent may make plans that they later regret or refuse free information, which seems irrational. However, enforcing dynamic consistency often forces a choice on updating and dilation.

  Another major conflict arises between:

  - **Having a decision rule that avoids indecision** (e.g., maximin always chooses something) and 
  - **Avoiding collapse to Bayesianism** (if the decision rule effectively selects a single prior from the set, then the imprecision is not doing any work).

  This is particularly sharp in the case of E-admissibility vs. maximin. E-admissibility (an option is choice-worthy if it is expected utility maximizing in at least one prior in the set) can lead to multiple options being admissible, which might be too permissive. Maximin (choose the option with the highest minimum expected utility) can be too conservative and might be equivalent to using a single worst-case prior.

  ---

  **Which Requirement Does the Most Work?**

  The requirement for **dynamic consistency** does the most work in eliminating candidate theories. Many theories of imprecise probability (e.g., using maxmin expected utility with element-wise conditioning) fail dynamic consistency. Fixing this often requires modifying the updating rule (e.g., to "generalized Bayesian" methods) or the decision rule, which then conflicts with other requirements like element-wise conditioning or the avoidance of dilation.

  **Verdict on Main Approaches:**

  - **Lower Envelope + Maxmin**: Fails dynamic consistency (avoids free information) and suffers from dilation. May also collapse to a single prior in some cases.
  - **E-admissibility**: Avoids indecision by allowing multiple choices? Actually, it may lead to indecision because too many options are admissible. But it might be dynamically consistent under some updating rules.
  - **Credal Sets with Natural Extension**: Handles updating but may still have dilation. Dynamic consistency is not guaranteed.
  - **Second-Order Probability**: This is not imprecise probability per se but a distribution over probabilities. It avoids dilation and can be dynamically consistent, but it requires a sharp prior over models, which we don't have in the severe uncertainty case. Thus, it fails the requirement of representing genuine severe uncertainty without a prior.

  ---

  **Conclusion on Feasibility**

  The requirements list is challenging, and no existing theory satisfies all. The most critical conflicts are in the dilation/dynamic consistency/updating triangle and in the decision rule design. For your use case (catastrophic risk with model disagreement and no prior over models), the non-negotiable requirements are:

  1. Distinguishing imprecision from risk attitudes.
  2. Allowing warranted imprecision that may not wash out (but can with evidence).
  3. Having an updating rule that handles dilation explicitly (even if it occurs).
  4. Dynamic consistency (to avoid irrational sequential behavior).
  5. A decision rule that doesn't collapse to Bayesianism and doesn't lead to indecision.
  6. Capturing the weight of evidence (without adding a second-order probability).
  7. Aggregation and scoring for practical use.
  8. Implementability.

  Given the conflicts, you might have to accept dilation (as a feature) and use a decision rule like E-admissibility or maximality with an updating rule that preserves dynamic consistency (e.g., via natural extension). Alternatively, if dynamic consistency is paramount, you might consider a theory that updates by conditioning the entire set but with a decision rule that is not maxmin (e.g., Levi's E-admissibility).

  The requirement that does the most damage to existing theories is dynamic consistency. If you relax that, more options open up, but at the cost of sequential rationality.

  In sum: the list is not jointly satisfiable in full by any current theory, but you can get close by prioritizing dynamic consistency and accepting some dilation, and by using a decision rule that allows for permissiveness without indecision.
answer: |-
  Below is a requirements list for a theory of imprecise credence tailored to your use case of severe uncertainty in catastrophic-risk modeling, where credible models disagree, no prior over models exists, and decisions must be made. The list is structured around your points, reorganized for logical flow, with each requirement grounded in a motivating case. I distinguish **non-negotiable conditions** (essential for adequacy) from **preferences** (context-dependent or camp-specific). Conflicts and trade-offs are highlighted, especially the incompatibility triangle you suspected.

  ---

  ### **Core Requirements for a Theory of Imprecise Credence**
  #### **1. Epistemic Purity: Distinguish Imprecision from Risk/Tastes**  
  - **Requirement**: The formalism must isolate indeterminate belief (epistemic uncertainty) from risk aversion, ambiguity aversion, or other non-epistemic factors.  
  - **Motivating Case**: In catastrophic-risk modeling (e.g., predicting a novel pathogen's CFR when models range from 1% to 30%), the "garbage can" problem arises if the framework misattributes aversion to model disagreement (e.g., precautionary bias) as part of belief. This corrupts uncertainty representation.  
  - **Verdict**: **Non-negotiable**. Without this, imprecise credence fails as a belief model and becomes a behavioral patch.  

  #### **2. Evidence-Responsive Imprecision: Warranted vs. Unwarranted Spread**  
  - **Requirement**: The theory must:  
    (a) Justify when imprecision is warranted (e.g., complete ignorance),  
    (b) Ensure imprecision shrinks with relevant evidence when appropriate,  
    (c) Allow for persistent imprecision in "irresolvable" cases.  
  - **Motivating Cases**:  
    - *Warranted*: A coin of unknown bias (no flips) → initial credence [0, 1].  
    - *Washout*: The same coin after 1,000 flips (all heads) → sharpens to [0.99, 1.00].  
    - *Persistent*: A one-off institutional collapse (no relevant data) → imprecision remains.  
    - *Failure*: Imprecision that doesn’t shrink after overwhelming evidence (e.g., still [0.2, 0.8] post-1,000 flips) is irrational.  
  - **Verdict**: **Non-negotiable** for (a) and (b); (c) is a **preference** (e.g., Levi vs. Joyce camps on whether persistence is acceptable).  

  #### **3. Updating Rule: Handle Dilation and Non-Monotonicity**  
  - **Requirement**: The theory must specify an updating rule that addresses **dilation** (learning widens intervals) and explains when it occurs.  
  - **Motivating Case**:  
    - Two models for a coin: Prior A (bias = 0.4), Prior B (bias = 0.6). Both agree next toss is 50/50.  
    - After observing heads, element-wise conditioning yields posteriors: A (bias ≈ 0.67), B (bias ≈ 0.33). Credence for next toss dilates from 0.5 to [≈0.33, ≈0.67].  
    - *Is this acceptable?* In severe uncertainty (e.g., conflicting climate models agreeing on short-term trends but disagreeing on long-term tipping points), dilation may reflect genuine unresolved uncertainty. But if it arises from known irrelevant evidence, it’s pathological.  
  - **Verdict**: **Non-negotiable**. The theory must prescribe when dilation is rational (e.g., only under ignorance) and provide rules (e.g., element-wise, natural extension). Rejecting dilation entirely is a **preference**.  

  #### **4. Dynamic Consistency: Survive Sequential Decisions**  
  - **Requirement**: Decisions made ex-ante must remain optimal ex-post after updating, and free information must not be rejected.  
  - **Motivating Case**:  
    - A policymaker uses maxmin (choose the option with best worst-case outcome) and rejects free data on a pandemic strain (e.g., fearing it might widen model disagreement and worsen the worst-case).  
    - This violates rationality: avoiding knowledge to "protect" credences.  
  - **Verdict**: **Non-negotiable**. Inconsistency undermines coherence in sequential decisions (e.g., investing in mitigation now vs. waiting for data).  

  #### **5. Decision Rule: Avoid Collapse to Indecision or Covert Bayesianism**  
  - **Requirement**: The theory must provide a tractable decision rule that:  
    - Resolves choices under imprecision,  
    - Avoids triviality (all options rejected) or collapse (acting like a Bayesian with a hidden prior).  
  - **Motivating Case**:  
    - *Conflict test*: Option X yields 1 util if event E, 0 otherwise; Option Y yields 0.5 utils unconditionally.  
    - Imprecise credence for E: [0.4, 0.6].  
      - **Maxmin** (maximize worst-case EU): Y (min EU=0.5) > X (min EU=0.4).  
      - **E-admissibility** (admissible if optimal for some prior in the set): X is optimal if P(E)>0.5; Y always optimal. Both are admissible.  
    - Here, maxmin chooses Y; E-admissibility permits X or Y. Neither collapses, but E-admissibility may cause indecision.  
  - **Verdict**: **Non-negotiable** for having a rule; choice between rules (maxmin, E-admissibility) is a **preference**. Maxmin risks excess caution; E-admissibility risks indecision.  

  #### **6. Representor Structure: Convexity, Interpretation, and Closure**  
  - **Requirement**: The theory must define properties of the credal set (representor):  
    - Convexity (if priors P₁, P₂ are in the set, is αP₁ + (1-α)P₂ included?),  
    - Interpretation (what the set means: suspension of judgment? Set of acceptable priors?),  
    - Closure under conditioning.  
  - **Motivating Cases**:  
    - *Convexity*: If two experts each endorse a model (P₁, P₂), is a compromise model (e.g., 0.5P₁ + 0.5P₂) automatically permissible? In catastrophic risk, this may over-smooth disagreement.  
    - *Interpretation*: Is [0.3, 0.7] for an asteroid impact a claim about "true probability" (frequentist) or "doxastic states" (epistemic)?  
  - **Verdict**: Convexity and closure are **preferences** (often assumed for tractability). Interpretation is **non-negotiable**—must align with the epistemology (e.g., "acceptability" for Levi).  

  #### **7. Sharpness vs. Weight of Evidence: Capture Calibration**  
  - **Requirement**: The formalism must distinguish sharp probabilities based on no evidence (precise ignorance) vs. sharp probabilities from abundant evidence (evidential weight).  
  - **Motivating Case**:  
    - Forecasters A and B both assign 50% to "Quantum computer cracks RSA by 2050."  
      - A: Based on symmetry (no data).  
      - B: Based on 1,000 calibration trials.  
    - Intervals alone (e.g., [0.4, 0.6] vs. [0.49, 0.51]) may not distinguish them. A needs a wider interval to reflect lower weight.  
  - **Verdict**: **Non-negotiable** for calibration. Sets alone *cannot* capture weight—requires richer structure (e.g., stability under evidence).  

  #### **8. Aggregation and Scoring: Group Decisions and Incentives**  
  - **Requirement**: Support pooling intervals from multiple experts and provide proper scoring rules for interval forecasts.  
  - **Motivating Cases**:  
    - *Aggregation*: Two analysts report [0.2, 0.5] and [0.4, 0.8]. Pooling must preserve coherence (e.g., convex hull [0.2, 0.8] or intersection [0.4, 0.5]).  
    - *Scoring*: To reward honest interval reporting (e.g., for catastrophe forecasts), a scoring rule must incentivize truth-telling (e.g., if true P=0.3, reporting [0.2,0.5] should dominate [0.1,0.4]).  
  - **Verdict**: **Non-negotiable** for real-world use. Poor aggregation/scoring undermines group rationality and forecasting.  

  #### **9. Implementability: Tractability and Technical Adequacy**  
  - **Requirement**: Handle continuous spaces, zero-probability events, and be computable (e.g., via linear programs).  
  - **Motivating Case**: Climate sensitivity estimates (continuous PDFs) where models disagree on tail events (e.g., P(S > 5°C)). Conditioning on near-zero probability events (e.g., "no ice-sheet collapse by 2030") must not break the framework.  
  - **Verdict**: **Non-negotiable**. Without this, the theory is useless for catastrophic risk.  

  ---

  ### **Conflict Analysis: The Incompatibility Triangle**
  Your suspicion is correct: **element-wise conditioning**, **no dilation**, and **dynamic consistency** form an unsatisfiable triangle. You can satisfy any two, but not all three:  
  - **Element-wise + No dilation**: Rejects widening intervals. But in the coin case, conditioning *must* dilate if priors disagree on bias. To avoid dilation, you need a non-element-wise rule (e.g., updating the lower bound only), which breaks dynamic consistency (e.g., plans reverse upon learning).  
  - **Element-wise + Dynamic consistency**: Accepts dilation (e.g., the coin case is rational). This is common in Imprecise Probability (IP) theories.  
  - **No dilation + Dynamic consistency**: Requires non-element-wise updating (e.g., "dilation-avoiding" rules). These often violate coherence (e.g., natural extension under constraints).  

  #### **Which Requirement Does the Most Damage?**  
  **Dynamic consistency** is the strongest eliminator. It:  
  - Rules out maxmin decision rules with standard conditioning (they avoid free information).  
  - Forces compromises: If dilation is forbidden, updating must be non-standard (e.g., "constant imprecision" rules), which may violate evidence-responsiveness.  
  - Is the linchpin in sequential decisions for catastrophic risk (e.g., "act now vs. wait for data").  

  #### **Other Key Trade-offs**  
  - **Decision rules vs. Collapse**: Maxmin avoids indecision but mimics a hidden Bayesian prior (collapse); E-admissibility avoids collapse but permits indecision.  
  - **Sharpness vs. Weight**: Sets alone cannot distinguish ignorance from knowledge—requires second-order uncertainty (e.g., credence over probabilities), which risks reverting to Bayesianism.  
  - **Aggregation vs. Precision**: Intersection pooling ([0.4, 0.5] for [0.2,0.5] and [0.4,0.8]) preserves precision but ignores dissent; convex hull ([0.2,0.8]) respects disagreement but loses information.  

  ---

  ### **Verdict on Candidate Theories**  
  - **Standard Imprecise Probability (e.g., Walley, Levi)**:  
    - *Pros*: Clear epistemic interpretation, element-wise updating, handles dilation.  
    - *Cons*: Fails dynamic consistency with maxmin; E-admissibility causes indecision; struggles with weight of evidence.  
  - **Dempster-Shafer / Belief Functions**:  
    - *Pros*: Distinguishes imprecision from weight (via belief/plausibility intervals).  
    - *Cons*: Updating (Dempster's rule) can produce counterintuitive dilation; aggregation is ad-hoc.  
  - **Γ-Maxmin (Wald)**:  
    - *Pros*: Decisive (uses maxmin), tractable.  
    - *Cons*: Conflates risk aversion and belief; often dynamically inconsistent.  
  - **Second-Order Probability**:  
    - *Pros*: Captures weight and calibration naturally.  
    - *Cons*: Requires a sharp prior over models—contradicts severe uncertainty.  

  **Bottom Line**: No theory satisfies all non-negotiables. For your use case:  
  1. Prioritize **epistemic purity**, **dynamic consistency**, and **implementability**.  
  2. Accept **dilation** as rational under ignorance (use element-wise updating).  
  3. Use **E-admissibility** or **interval dominance** for decisions to avoid collapse.  
  4. Add **second-order structure** (e.g., stability indices) to capture calibration—but this extends beyond "pure" imprecise credence.  

  This reveals the core tension: Representing genuine severe uncertainty forces trade-offs between coherence, precision, and practicality. The literature’s "folklore" often obscures these; the triangle is proven (e.g., Seidenfeld’s work), while claims that "imprecise credence is just Bayesian" rely on contested premises (e.g., that sets *must* have a second-order prior).
