  ### **Summary of Solid vs. Contested Elements**  
  - **Settled:**  
    - Defects (coercion, false beliefs) can deform wishes (Step 1a).  
    - Traceability to personal values is required (Steps 1b, 2b).  
    - Conflict + impairment trigger (Step 0).  
  - **Contested:**  
    - Additive extrapolation (Step 2) – no consensus it’s valid.  
    - Symmetry checks (Step 3) – novel and untested.  
    - Whether "idealized will" is knowable (all steps) – philosophers (e.g., Williams) doubt it.  

  **Your guess was correct:** Preferences deformed by illness/coercion are uncontroversial; determining "what they’d want ideally" is hotly contested. This procedure minimizes risk by binding additive steps to traceability, symmetry checks, and frequent "no override" exits. Use it as a discussion tool, not a rigid algorithm—and document all reasoning gaps for the clinical director/judge.
