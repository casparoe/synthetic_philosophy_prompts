answer: |-
  Here is the poem, followed by a prose note explaining its interpretive stance:

  **Catuṣkoṭi: For a Reflection**

  *(I: Affirmation)*  
  This face within the silvered glass  
  Depends on light and angle's pass,  
  On mercury and dust's fine trace –  
  The face *is* in this bounded space.  

  *(II: Negation)*  
  No self-sustained thing rests inside,  
  No ghost behind the pane to hide.  
  Where mercury and light release,  
  The face *is not* in polished peace.  

  *(III: Both)*  
  Appearing where no core resides,  
  This borrowed shape both gleams and hides.  
  The glass holds what it cannot own –  
  The face *both is and is not* shown.  

  *(IV: Neither)*  
  No "is" clings here, no "is not" sticks;  
  The glass rejects both truth's false picks.  
  Where no fixed mark can carve its line,  
  The face *neither is nor is not* mine.  

  *(Coda)*  
  Still, morning finds the glass again,  
  A borrowed shape where doubts have been.  
  The world requires no deeper base –  
  The face *is* in this bounded space.

  ---

  **Prose Note:**  
  I chose the reflection as the subject because its emptiness (*śūnyatā*) is immediately apparent yet utterly conventional – it perfectly embodies dependent arising (*pratītyasamutpāda*). My key gamble was treating the two truths (*satyadvaya*) strictly as *modes of description*, not ontological layers. The conventional truth ("the face is in the glass") describes dependently arisen function; the ultimate truth ("neither is nor is not") is simply the *recognition* that this functionality lacks *svabhāva*. The negations are therefore *therapeutic*: they dismantle reification without positing an alternative reality. The coda’s return to the first refrain asserts that conventional reality, understood *as* empty, remains fully operational – emptiness *is* that dependently arisen functionality, not a void behind it. I avoided making the "neither" stanza transcendent by grounding it in the same dependent causes (mercury, dust, angle) as the "is" stanza. The poem leans against interpretations where emptiness becomes a positive ground or where conventional truth is merely "illusory" in a derogatory sense. The reflection persists precisely *because* it is empty.  

  ---
  **Formal & Structural Choices:**  
  1.  **Subject:** A face in a mirror. It's concrete, ordinary, intrinsically empty (dependent on light, glass, mercury, angle, observer), and persists visually across all stanzas.  
  2.  **Refrain:** The core statement "The face... [space/peace/shown/mine]" changes only by the catuṣkoṭi operator ("is"/"is not"/etc.) in the closing line of each quatrain. The coda uses the *first* refrain verbatim.  
  3.  **Avoiding Synthesis/Mysticism:**  
      *   Stanza III ("Both") focuses on the *incoherence* of attributing inherent existence ("no core resides," "cannot own") rather than any synthesis.  
      *   Stanza IV ("Neither") explicitly rejects *both* reified positions ("rejects both truth's false picks") based on the *same* absence of *svabhāva* ("no fixed mark"), not transcendence. The mundane causes (mercury, dust) implicitly anchor it.  
  4.  **Avoiding Nihilism & Reification:**  
      *   The coda's return to the first refrain affirms conventional reality *as it is*, now seen *as* empty – "requires no deeper base."  
      *   "The world" in the coda reinstates conventional functionality without implying an underlying substance.  
      *   Emptiness (*śūnyatā*) is presented only as the *nature* of the reflection's dependence, never as an entity.  
  5.  **Interpretive Clarity:** Each stanza's internal logic points to its koṭi:  
      *   I: Functional presence ("bounded space").  
      *   II: Lack of inherent existence ("No self-sustained thing," "polished peace" implying inert surface).  
      *   III: The tension of appearance without essence ("borrowed shape," "holds what it cannot own").  
      *   IV: Exhaustive dismissal of predicates due to lack of inherent basis ("rejects both truth's false picks," "no fixed mark").  
      *   Coda: Unproblematic return to convention.  
  6.  **Sanskrit Terms:** Only *śūnyatā* and *pratītyasamutpāda* (in the note) and implied *svabhāva* and *satyadvaya* – essential but minimal, contextualized by the note.  

  This poem aims to perform the Madhyamaka move: letting the negations clear conceptual reification so that conventional reality (*vyavahāra*) shines forth *as* empty, not negated or replaced.
