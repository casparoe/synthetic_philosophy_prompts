prompt: |-
  I have helped run a persistent multiplayer sandbox world for about eleven years: a game with player-built structures, a player-run market, and characters that some people have played continuously since the server opened. I keep meeting a pattern in how our players judge the things in that world, and I want to know whether it has a name in philosophy and, if not, what I should call it.

  The pattern in one sentence: our players will say, when asked, that these things are not real objects at all, and yet they treat differences in how one of them came into existence as mattering enormously, including in cases where the two candidates do not differ in any respect anyone can observe.

  Three cases. First: an item obtainable only during a one-month event years ago. An operator can create a new one with a single command; the client cannot tell the two apart, nothing about the second one is different on screen, and both behave identically in every way. Players will not trade the old one for the new one, they will expel anyone who makes new ones, and they describe the new ones as not really being that item. The same players will also tell you that nothing real is lost when the server is finally shut down.

  Second: a cathedral built on the server over two years by some forty people; someone demolishes it. Our players are certain a bad thing happened, and they are equally certain that what happened was bad for the builders rather than for the cathedral. But when an operator restores the structure by pasting in an exact copy of it as it stood, built by no one, they say the cathedral was not brought back. They prefer a rollback of the whole world to before the demolition, even though the rollback also destroys two hours of unrelated work that they then have to argue about.

  Third, a case that makes me doubt my own description: some items in the world carry scripted descriptions attributing to them a history that the developers invented and that everyone playing knows to be invented. Players pay more for these and treat them as having a history. So whatever is going on is not simply sensitivity to actual causal origin.

  Two contrasts I have noticed. Nobody cares which individual coins they are paid in, only how many, so the pattern seems to attach to things treated as individuals rather than as quantities. And I have wondered whether this is only the familiar business about first editions and perfect forgeries, with nothing virtual about it at all — except that a first edition differs physically from a reprint, and my two swords do not differ in any respect whatsoever.

  I do not want a label on its own. I want to know what the phenomenon really is: whether it is a claim about identity, or about value, or about the norms of a practice, or about what reasons people take themselves to have; whether the players' own insistence that the objects are unreal is essential to it or incidental; how it sits with the nearby things I have half-heard of — the worry about perfect copies of artworks, the puzzle of why we respond emotionally to characters we know do not exist, the view that money and property are real only given a shared practice — and which of those it is not; where its edges lie, given the fungibility contrast; and, if nothing established fits, a defined term together with the cases it covers and the cases it should be kept apart from. References are not needed.
reasoning: |-
  Okay, the user has been running a multiplayer sandbox world for eleven years and noticed a pattern in how players judge virtual objects. They provided three cases: event items created by operators versus originals, a cathedral demolition and restoration, and items with fictional histories. Players treat identical objects differently based on origin, even saying they're "not real" while acting as if their origins matter immensely.

  Hmm, this is fascinating. The user wants to understand the philosophical underpinnings of this behavior. They mentioned contrasts like fungible coins versus unique items, and questioned if it's similar to valuing first editions despite physical similarities. But in their virtual world, there are no physical differences at all - it's all data.

  First, I need to unpack what's happening here. Players claim these objects aren't real, yet they assign value based on origin. The insistence on unreality seems important - it's not just about scarcity. In the cathedral case, they care about the builders' effort being lost, not the structure itself. When restored by an operator, they reject it as "not the same" even when identical. And with scripted histories, they value the fictional narrative despite knowing it's invented. 

  This feels like a few philosophical concepts intersecting. There's John Searle's idea of institutional facts - things that exist only because we agree they do. Money is a classic example. But here, the players are creating a shared fiction where origin stories confer uniqueness. They're collectively assigning "souls" to digital objects based on their creation myths.

  The cathedral example points to labor-based value - the builders' time investment creates meaning. A pasted copy lacks that human effort, so it's hollow. The event items show how rarity and exclusivity drive perceived authenticity. The scripted histories case reveals that narrative itself has value, even when fictional.

  What's interesting is the tension between "this isn't real" and treating origins as sacred. It suggests players operate in two modes simultaneously: knowing the virtual world is contingent, yet fully committing to its internal logic. The fungible coins contrast shows this only applies to items they've decided are unique artifacts.

  I think the core is about constructed significance. Players build layers of meaning onto digital objects through shared practices. The origin story becomes part of the object's identity in their collective imagination. So when they say "this isn't the real sword," they mean it lacks the agreed-upon narrative that makes it significant in their social world.

  This differs from art forgery debates because there's no physical original to compare. And unlike emotional reactions to fiction, here they're creating functional social realities. The "unreal" disclaimer might even be necessary - it keeps their suspension of disbelief from collapsing.

  For the user, I should emphasize how this is about community-built meaning. The phenomenon is their players collaboratively treating certain digital objects as having "authentic essence" based entirely on agreed-upon creation myths. I'll call it "constructed authenticity" and define its boundaries carefully.
answer: |-
  This phenomenon isn't directly named by a single established philosophical term, but it **fundamentally concerns the construction of collective significance and identity within a shared social practice**. Here's a breakdown of what it is, what it isn't, and what you should call it:

  1.  **Core Nature: Constructed Significance & Narrative Identity**
      *   Players are **not** primarily judging the *physical/digital properties* of the objects (which are identical). They are judging the **meaning, significance, and identity** assigned to them by the shared history and social practices of the community.
      *   The origin story (player-built, event-earned, developer-narrative) becomes an **essential, non-observable property** that constitutes the object's identity *within the game's social reality*. This identity is inseparable from its narrative.
      *   The object's "reality" or "authenticity" is **conferred by the community** based on adherence to the accepted rules and narratives of creation within their shared practice. An operator-created event item violates the "rules of origin" (must come from the event), making it "not really that item," even if observationally identical.

  2.  **Why "Not Real" is Essential & Incidental:**
      *   **Essential:** Players readily admit the objects are "not real" (ontologically dependent on the server, not physical). This *frees* them to imbue objects with arbitrary significance without cognitive dissonance about their base reality. The disclaimer acknowledges the foundational layer.
      *   **Incidental:** The intensity of their reactions (expulsion, restoration rejection, valuing fictional histories) proves that within the *frame of the game's social practice*, these objects **are real and significant**. The "not real" statement is about the substrate; their actions are about the constructed social layer *on top* of that substrate.

  3.  **Relation to Nearby Concepts:**
      *   **Art Forgery/First Editions:** **Similar:** Values origin and narrative (provenance). **Different:** Physical objects have inherent uniqueness (atoms, wear). Your cases lack *any* observable difference; the uniqueness is *entirely* socially constructed narrative. Also, the "unreal" disclaimer isn't present with physical art.
      *   **Emotional Response to Fiction:** **Similar:** Investment in non-real entities. **Different:** Players aren't just *feeling* for characters; they are actively *creating functional social realities* (markets, restoration norms, expulsion) based on rules governing object identity and origin. It's more akin to creating property rights within fiction.
      *   **Social Construction of Reality (Money/Property):** **Most Relevant:** This is the strongest parallel. Money only works because of shared agreement. Your phenomenon shows the **social construction of *authenticity* and *identity* for specific objects within a fictional frame.** Players collectively agree on the "rules of origin" that confer genuine status. The fungible coins contrast highlights this: coins are *defined by quantity* within the system, not unique identity/narrative. Swords/cathedrals are defined by their *history*.

  4.  **What it's NOT:**
      *   **Not a Claim about Physical/Digital Identity:** Players readily admit the digital bits are identical/copiable. They aren't confused about the underlying data.
      *   **Not *Simply* about Value:** Value is a consequence, not the core. The core is the *constitution of identity* through narrative origin within the practice. Value flows from possessing an "authentic" identity.
      *   **Not *Simply* about Labor Theory of Value:** While the cathedral builders' labor is crucial, the scripted-history items show that *narrative itself* (even fictional) can be the origin that confers identity/value. Labor is one type of legitimizing origin story.

  5.  **Edges & the Fungibility Contrast:**
      *   The pattern applies **only to objects the community treats as "authentic individuals"** – items imbued with unique identity through narrative (event, player creation, fictional backstory). Their significance is tied to their specific origin story.
      *   **Fungible objects** (coins) are defined **functionally** by their role in the system (unit of exchange). Their individual history is irrelevant; they are interchangeable tokens. The community practice defines them *only* by their observable properties (quantity/type).

  **Defined Term & Scope:**

  **Constructed Authenticity within a Shared Practice (CASP)**

  *   **Definition:** The phenomenon where participants in a shared practice (especially fictional or rule-bound systems like games, collectibles markets, or certain social rituals) collectively confer the status of "authentic" or "genuine" upon an entity based solely on its adherence to an agreed-upon narrative of origin or creation process, **despite**:
      a) Acknowledging the entity's fundamental ontological dependence or unreality, and
      b) The existence of observationally identical entities lacking the "correct" origin narrative, which are deemed inauthentic.
  *   **Core Mechanism:** The origin narrative constitutes the entity's *functional identity* within the practice. This identity is inseparable from the narrative and is the basis for value, emotional attachment, and behavioral norms.
  *   **Key Features:**
      *   Relies entirely on social agreement within the practice.
      *   Creates a distinct layer of "reality" (authenticity, identity) atop an acknowledged substrate (unreal/dependent).
      *   Governs behavior, value, and emotional responses within the practice.
      *   Applies only to entities treated as unique individuals by the practice, not fungible tokens.
  *   **Distinguishing CASP from:**
      *   **Physical Provenance:** CASP does not require or rely on inherent physical uniqueness or traceable material history. Authenticity is purely narrative/social.
      *   **Simple Scarcity:** While scarcity often drives CASP (event items), the scripted-history case shows the narrative itself is the key, not mere rarity. A common item with a unique narrative *could* be subject to CASP.
      *   **Labor Value:** While labor can *be* the legitimizing narrative (cathedral), it's not the only one (scripted history).
      *   **Suspension of Disbelief:** CASP involves active participation in *constructing and enforcing norms* based on the narrative, not just passively accepting a story.

  **In your cases:**

  1.  **Event Item:** The "authentic" identity requires the "created during the event" narrative. Operator creation violates the narrative, making the object functionally different (inauthentic) within CASP.
  2.  **Cathedral:** The "authentic" identity requires the "built by players over time" narrative. Operator paste lacks this narrative, making it a different entity (a replica, not the cathedral). Rollback preserves the narrative continuity.
  3.  **Scripted History:** The "authentic" identity *includes* the fictional narrative as part of its origin story. Players agree to treat this narrative as constitutive of the item's identity within the practice (CASP).

  CASP captures the essence: your players are collaboratively building a rich social reality where the *stories of how things came to be* define what those things *are* within their shared world, even as they wink at the underlying digital illusion.
