prompt: |-
  I got roped onto the conduct committee of my housing co-op last fall (28 units, we rotate, two-year terms, and I somehow ended up chairing it this spring) and I need something I can actually run, not theory. Here's the setup: members file written complaints against other members about shared-life stuff — noise, missed chore shifts, common-room hogging, dishes, the group chat, bikes in the hallway. We meet one evening a month, read the pile, and we either dismiss, mediate, or sanction (a formal letter, and in bad cases loss of common privileges). Any sanction needs a two-thirds vote plus a one-page written rationale that goes to both parties and gets read out at the next house meeting, and anyone can appeal to the whole co-op at the AGM. Nobody on the committee has any philosophy background, we've got about three hours and no budget, and whatever we write has to be readable by an angry neighbour at 10pm.

  The thing I keep geting stuck on is hypocrisy, and specifically whether someone who does the same thing themselves has any standing to complain at all. We've been informally applying a "clean hands" thing — if you've done it too, your complaint gets tossed — and its obviously doing damage. It's become the first move for anyone who wants their case dropped, the members who are held to the highest standard most often lose their complaints, and last month we dismissed a noise complaint against a guy who has been making everyone's life miserable for a year because the complainant once threw a loud party. Then there are the versions I can't handle at all: half the time the person didn't do the same thing, they did a neighbouring thing (they hoard the common room but are complaining about dishes); or they did it two years ago and genuinely stopped; or they openly admit what they did versus being in total denial about it; or they're complaining on behalf of someone else who is completely clean; or the complaint is about how they personally were treated versus about how the house is running. And then there's us — the committee — which has ignored this exact category of behaviour when the person doing it was popular. I want to know whether that's even the same question or whether I'm confusing two different things.

  So: please write me a decision procedure, in plain language, that my committee can run on a complaint in about fifteen minutes and that tells us when a complainant's own conduct defeats or weakens their complaint and when it's just noise we should ignore. It should say what order to ask things in, what counts as an adequate answer to each question, where we stop and dismiss, and where the procedure has to hand the decision to a person because it's a question about what kind of house we want to be rather than a matter of fact. Please be explicit about which distinctions it has to preserve — I suspect "they don't really believe the norm," "they have no right to hold you to it," and "the complaint is true and apt but they shouldn't be the one saying it" come apart, and I suspect "did the same thing" is the wrong test in at least three different ways, but you tell me which ones. Also tell me what to do when we can't tell whether two bits of conduct are the "same" norm violation, and whether a complainant can get standing back by owning what they did.

  Then run it on three cases, and I want at least one to come out in a way I will hate, because I'd rather find that out now than at a house meeting. One: a member with four months of missed chore shifts files against a member who missed two. Two: a member who is a notorious common-room hoarder files a documented complaint about someone leaving dirty dishes in the sink for a week — different rule, same family of sloppiness. Three, the one I expect to dislike: a founding member who was repeatedly noisy in 2023 and was never sanctioned, because the committee that year let it slide, now files a strong and well-documented noise complaint against a newer member, and the target's entire defense is "look at what she did." For that one I want to know both whether her complaint stands and whether we as a committee have any business sanctioning anyone for noise given our own record, and if those are two separate questions please say so and say which one we should answer first. Finally, be honest about where the procedure is philosophy dressed up as a checklist, which steps are really us choosing what to value, and what it just can't settle.
reasoning: |-
  Okay, let me tackle this user's problem. They're chairing a housing co-op conduct committee and struggling with the "clean hands" approach where complaints get dismissed if the complainant has done similar things. This is causing issues like serial offenders avoiding consequences because someone else once broke a rule. 

  First, I need to unpack why "clean hands" isn't working. The user mentioned cases where violations aren't identical (common-room hoarder vs. dirty dishes), past vs. present behavior, or complaints made on behalf of others. There's also hypocrisy in the committee itself when they've ignored violations by popular members. 

  The core problem seems to be conflating several distinct concepts: the validity of the complaint itself, the complainant's moral standing to file it, and the committee's consistency in enforcing rules. I should disentangle these. 

  For a decision procedure, it needs to be practical—something the committee can run in 15 minutes with no philosophy background. Key principles: separate procedural standing from complaint merit, assess violations based on current evidence, and address committee inconsistency transparently. 

  The procedure should have clear steps:
  1. Check if the complaint meets basic requirements (written, specific, etc.)
  2. Determine if the complainant has "standing" without judging the complaint's validity yet
  3. Assess the complaint's merit separately
  4. Decide on consequences if the complaint is valid
  5. Handle committee inconsistency if raised

  For standing, past violations shouldn't automatically disqualify someone unless it's the exact same unresolved issue. The focus should be on whether the complaint is about community harm, not personal grievances. 

  In the test cases:
  - For the chore complaint, standing exists because the complaint is about current community harm, regardless of the complainant's worse record. But their history affects credibility.
  - For the common-room hoarder vs. dishes, different rules mean standing isn't an issue. The complaint stands if dishes violated policy.
  - For the founding member's noise complaint, standing exists, but the committee must address its past inconsistency transparently before sanctioning anyone.

  The procedure will need to flag where judgment calls are required, like whether two violations are "similar enough" to affect standing. It should also specify that owning past mistakes can restore credibility. 

  This approach keeps the focus on community standards rather than personal grudges, which should reduce weaponization of the process. The committee will need to confront their own inconsistencies though—that's the hardest but most necessary part.
answer: |-
  Here’s a practical, step-by-step decision procedure designed for speed and clarity. It separates **validity of the complaint** from the **complainant’s standing**, and **committee integrity** from **individual cases**. Crucially, it rejects "clean hands" as a dismissal rule and replaces it with a "standing test" focused on *current community harm*.

  ---

  ### **DECISION PROCEDURE: COMPLAINT ASSESSMENT FLOW (15-MINUTE VERSION)**  
  *Goal: Determine if a complaint warrants action, ignoring irrelevant noise but preserving accountability.*

  #### **STEP 1: SCREEN FOR BASIC VALIDITY (2 MINUTES)**  
     - **Ask:** *"Does the complaint describe a specific, recent (≤6 months) violation of a written co-op rule?"*  
       - **NO → Dismiss.** (e.g., "They’re annoying," vague gripes).  
       - **YES → Proceed to Step 2.**  

  #### **STEP 2: CHECK COMPLAINANT STANDING (3 MINUTES)**  
     *Purpose: Filter out personal vendettas, not imperfect people.*  
     - **Ask:**  
       1. *"Is the complaint about harm to the *community* (e.g., dishes piling up, noise disturbing multiple people) OR a direct personal attack (e.g., 'they insulted me in the chat')?"*  
          - **Community harm → Standing GRANTED.** Proceed to Step 3.  
          - **Personal attack →** Go to 2B.  
       2. **If personal attack:** *"Is there evidence (texts/witnesses) of targeted harassment, threats, or discrimination?"*  
          - **YES → Standing GRANTED.** Proceed to Step 3.  
          - **NO → Dismiss.** (Personal conflicts without harassment go to mediation, not sanctions).  
     - **IGNORE:**  
       - The complainant’s past violations (even similar ones).  
       - Whether the complainant "deserves" to complain.  

  #### **STEP 3: ASSESS COMPLAINT MERIT (6 MINUTES)**  
     *Purpose: Is the alleged violation real and serious?*  
     - **Ask:**  
       1. *"Is there objective evidence? (e.g., chore logs, timestamps, photos, multiple witnesses)"*  
       2. *"Did the violation cause material harm? (e.g., chores undone, health hazard, repeated sleep disruption)"*  
     - **Ruling:**  
       - **Strong evidence + material harm → Valid complaint.** Proceed to Step 4.  
       - **Weak evidence OR no material harm → Dismiss or mediate.** (e.g., one-off dish left, minor noise).  
     - **IGNORE:**  
       - Complainant’s hypocrisy (handled in Step 4).  
       - Target’s excuses about the complainant (e.g., "But they do it too!") unless proving the event didn’t happen.  

  #### **STEP 4: DECIDE CONSEQUENCES (4 MINUTES)**  
     *Purpose: Tailor the response to the violation AND context.*  
     - **Ask:**  
       1. *"Is the target a repeat offender? (Check records)"*  
       2. *"Does the complainant have *current*, unresolved violations of the SAME rule they’re complaining about? (e.g., they missed chores *this month* while complaining about chores)"*  
       - **YES → Reduce sanction severity (e.g., mediation over formal letter).**  
       - **NO → No adjustment.**  
     - **Factors for sanction severity:**  
       - Harm caused, intent, pattern, cooperation.  
       - **Complainant’s hypocrisy?** Only if they’re *currently* violating the *exact same rule*. If so, note it in the rationale as "undermining community trust" but **don’t dismiss the complaint**.  
     - **Final Vote:** Sanction (formal letter, privilege suspension) or mediation.  

  #### **KEY DISTINCTIONS PRESERVED:**  
  - **"They don’t believe the norm"** → Irrelevant. Focus on rule violation.  
  - **"They have no right to hold you to it"** → Replaced by *standing* (Step 2). Anyone can report community harm.  
  - **"Complaint is true but they shouldn’t say it"** → Addressed in Step 4 (sanction reduction if active hypocrisy).  
  - **"Same vs. neighbouring violation"** → Only identical *current* violations matter (Step 4). A dish-hoarder can complain about noise.  
  - **Committee’s past inconsistency** → Handled SEPARATELY (see "Committee Integrity Check" below).  

  #### **HANDLING AMBIGUITIES:**  
  - **"Are two violations the 'same'?"** → Only if they break the *identical written rule*. Dishes ≠ common room hoarding.  
  - **"Can standing be restored?"** → If the complainant admits past faults AND resolved them, it strengthens their credibility. Denial weakens it.  
  - **"Can’t decide similarity?"** → Default to "not the same."  

  ---

  ### **COMMITTEE INTEGRITY CHECK (DO THIS QUARTERLY, NOT PER CASE)**  
  Before any sanction vote, ask publicly:  
  *"Have we enforced this rule consistently in the past 6 months? If not, we must acknowledge that in our rationale and apply sanctions leniently until consistency is restored."*  
  - **Inconsistent enforcement?** → Issue a general house reminder of the rule first; sanction only for *egregious* new violations.  

  ---

  ### **TEST CASES RAN THROUGH THE PROCEDURE**  

  #### **CASE 1: Member A (missed 4 months of chores) vs. Member B (missed 2 shifts)**  
  - **Step 1:** Valid complaint (specific rule violation).  
  - **Step 2:** Standing GRANTED (community harm: chores undone).  
  - **Step 3:** Merit FOUND (evidence: chore logs).  
  - **Step 4:** Member B sanctioned (formal letter). **But:** Member A has *current identical violation* → Note hypocrisy in rationale: "While valid, Member A’s own unresolved chore failures undermine this complaint’s moral authority." Member A should also be sanctioned separately.  
  - **Result:** **Complaint UPHELD.** Sanction for Member B.  

  #### **CASE 2: Common-room hoarder vs. dirty dishes**  
  - **Step 1:** Valid complaint (violates dish policy).  
  - **Step 2:** Standing GRANTED (community harm: health hazard).  
  - **Step 3:** Merit FOUND (photos, logs).  
  - **Step 4:** Dish-leaver sanctioned. **But:** Hoarder’s violation is *different rule* → No hypocrisy impact.  
  - **Result:** **Complaint UPHELD.** Sanction for dish-leaver.  

  #### **CASE 3: Founding member (noisy in 2023, unsanctioned) vs. new noisy member**  
  - **Step 1:** Valid complaint (noise violation).  
  - **Step 2:** Standing GRANTED (community harm: documented sleep disruption).  
  - **Step 3:** Merit FOUND (evidence: logs, witnesses).  
  - **Step 4:** **Committee Integrity Check:** Past inconsistency confirmed (noise rule ignored in 2023).  
    - **Action:** Issue house-wide noise policy reminder. New member gets *mediation*, not sanction (due to committee’s past failure). Founding member’s 2023 acts are irrelevant to *this complaint’s validity*, but committee’s inconsistency reduces sanction severity.  
  - **Result:** **Complaint UPHELD but sanction REDUCED** to mediation due to committee failure.  

  ---

  ### **WHAT THIS DOES (AND DOESN’T) SOLVE**  
  - **Philosophy in a Checklist:** Steps 2-4 separate moral standing (can you speak?) from truth (did it happen?) and fairness (how do we respond?). This replaces "clean hands" with a *pragmatic focus on community harm*.  
  - **Where You’re Choosing Values:**  
    - Granting standing for community harm (Step 2) assumes collective rules > personal purity.  
    - Penalizing *current identical hypocrisy* (Step 4) values integrity over perfection.  
    - Acknowledging committee failure (Integrity Check) prioritizes fairness over expediency.  
  - **What It Can’t Settle:**  
    - Deep interpersonal grudges (mediation is better).  
    - Whether a rule is *good* (that’s a house meeting issue).  
    - Subjective "unwritten rules" (only written rules get sanctions).  

  **Why You’ll Hate Case 3:** It holds the complaint valid (you can’t ignore current harm) but prevents sanctions due to *your committee’s* past inconsistency. This forces the committee to confront its own failures publicly—which is painful but necessary.  

  **Final Tip:** Start each meeting by reading this procedure aloud. It creates consistency and disarms "you’re hypocrites!" arguments before they start.  

  ---  
  This turns "clean hands" from a weapon into a footnote, centers community harm, and forces the committee to clean its own house first. Run it for 3 months and adjust as needed.
