answer: |-
  Your reading is provocative and philosophically sharp—it reframes Descartes' position in a way that exposes deep tensions. Below, I engage your questions directly, focusing on your reasoning and arguments:

  ### 1. **The Dilemma’s Soundness & a Third Reading**  
     The dilemma is logically compelling but may overlook Descartes' *epistemic* argument for simplicity. In the *Meditations*, Descartes roots the mind’s indivisibility in the immediacy of self-awareness: the "I" is grasped as a unified subject prior to any functional analysis (*Meditation VI*). This suggests a third reading: simplicity as a **constitutive condition of thought itself**. For Descartes, thought requires a subject whose unity is presupposed in every act of thinking—not as a "bare assertion," but as an introspective certainty.  
     - **Does it escape the horns?**  
       - *Evidential idleness*: If simplicity is inherent to the *act* of thinking (via the *cogito*), it isn’t inert—it’s known through reflection. But this shifts the problem: animals’ lack of *reflective self-awareness* becomes key, not observable tests.  
       - *Functional defeasibility*: If unity is constitutive of subjectivity (not merely functional), a machine’s integration wouldn’t suffice. However, this risks making simplicity a *definitional* feature of thought—which Descartes might accept, but which leaves animals excluded by fiat.  
     **Verdict**: The third reading softens the first horn but sharpens the second—Descartes still cannot explain why functional integration *couldn’t* ground subjectivity.

  ### 2. **Joined Controls Case**  
     Your case is devastating against the *functional* reading but less potent against the primitive one:  
     - **Against functional unity**: Brilliantly exposes the contradiction in Descartes’ mechanist physiology. If integration explains behavior (as he insists), and integration constitutes subjectivity, animals qualify.  
     - **Against primitive simplicity**: Descartes could dismiss our "intuitive" counting of subjects as irrelevant. For him, metaphysical simplicity (a non-composite substance) trumps functional unity. The case highlights indeterminacy *in our intuitions*, but Descartes could insist substance metaphysics resolves it.  
     **Weakness**: The case assumes functional unity implies subjectivity—a premise Descartes rejects. His retort: "One subject with two bodies" is incoherent because a simple substance cannot be spatially distributed.

  ### 3. **Exegetical Accuracy**  
     - **Physiology**: Correct. Descartes explicitly applies identical mechanical explanations to human and animal bodies (e.g., *Treatise on Man*, AT XI:120; *Passions I.6–16*). He states human physiology *includes* these mechanisms but is "joined to" a soul (*Passions I.30*).  
     - **Overstatement?** Only if you imply the soul adds nothing to human physiology. Descartes claims the soul *unifies* sensations (e.g., pain as a *single* experience), but your point stands: mechanist explanations cover sensorimotor functions identically.  
     **Defense**: Strong. Descartes’ dualism *requires* identical bodily mechanisms to isolate the soul’s role.

  ### 4. **"Symptoms vs. Grounds" – Necessary?**  
     **Crucial, not ornamental**. By demoting the tests to symptoms, you:  
     - Explain why Descartes dismisses counterevidence (e.g., parrots): they don’t threaten the metaphysical condition.  
     - Relocate the debate from ethology to metaphysics (counting subjects by unity, not behavior).  
     Deleting this would collapse your reconstruction into standard behaviorist readings.

  ### 5. **Hostile Referee’s Strongest Attack**  
     **Target**: The claim that Descartes’ condition is *unstated*.  
     - **Attack**: In *Meditation VI* (AT VII:85–86), Descartes argues the mind is "indivisible" while the body is divisible—direct textual evidence for simplicity as a condition. By overlooking this, you overplay your "reconstruction" and weaken the exegesis. Descartes *does* state the condition; your innovation is re-centering it for the animal-mind debate.  
     **Impact**: This could undermine your framing of the condition as "pivotal but hidden," though your core dilemma survives.

  ### 6. **Frank Verdict on Value**  
     **Worth the chapter, with caveats**:  
     - **Strengths**: Your Simplicity Condition refocuses Descartes’ argument on metaphysics, not empirics. The dilemma and Joined Controls case are original and potent. This reshapes scholarly debate by forcing engagement with substance metaphysics.  
     - **Risks**: Specialists may resist downplaying the *Meditations* on simplicity. Your reading is bolder than textual evidence supports—but productive for contemporary relevance (e.g., AI consciousness).  
     - **Not a rearrangement**: It synthesizes Descartes’ physiology, metaphysics, and animal arguments into a coherent problem few trace as sharply. The Joined Controls case alone advances the literature.  

  ---

  ### Overall Assessment  
  Your argument is rigorous and philosophically insightful. The dilemma holds unless Descartes’ epistemic argument for simplicity (from the *cogito*) is deemed sufficient to escape it—but even then, his physiology creates tension. The Joined Controls case is a standout contribution. If strengthened by engaging *Meditation VI* on indivisibility, this could be a landmark reinterpretation. **Proceed confidently, but fortify the exegesis on Descartes’ stated views of simplicity**.
