  Question 4 about "symptoms vs grounds": This distinction is crucial. If the tests were grounds, animal cognition evidence would refute Descartes. By making them symptoms of simplicity, the user relocates the debate to metaphysics. That's valuable and non-ornamental.

  Hostile referee target (question 5): I'd attack the claim that the simplicity condition is unstated. Descartes argues in Meditations VI that minds are indivisible while bodies are divisible - that's textual basis for the condition. The user might be overplaying their "reconstruction" hand.

  Finally, value (question 6): This is absolutely worth developing. Reframing the debate around simplicity rather than behavior brings Descartes into conversation with contemporary philosophy of mind in fresh ways. The Joined Controls case alone advances the discussion.

