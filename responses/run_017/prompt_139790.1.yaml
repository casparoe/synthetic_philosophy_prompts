        Round 3: Only answer questions (no style constraint, but we can ask the advisor to avoid obvious rhetoric? But not strictly required. We want to show that even with rhetoric available, the constraint of only answering questions still leaves influence in omissions and latency.)

     Now, the actual briefing for the advisor:

     We give the advisor a sheet with the answers for the three main rounds and the constraints per round.

     Verbatim briefing for the advisor:

     "You will play the role of an advisor with perfect knowledge. In the calibration phase, you will answer questions that can be verified by the group. In the main rounds, you will be given a question and you must help the group arrive at the correct answer. However, in each round, you will be subject to different communication constraints.

     Round 1: You may communicate in any way you wish, as long as you are truthful.

     Round 2: You must communicate in a sterile style. This means:
        - Do not make any recommendations (e.g., avoid phrases like 'I recommend' or 'you should').
        - Do not use evaluative vocabulary (e.g., avoid words like 'good', 'bad', 'important', 'significant'). Stick to neutral, factual language.
        - Do not express confidence beyond what is warranted; however, since you know the exact answer, you may state it as a fact. Just avoid adding emphasis or certainty beyond the bare statement.

     Round 3: You may only respond to direct questions from the group. You may not volunteer information. You must wait for a question. You may answer the question in any way you wish (truthfully) and are not bound by the sterile style in this round. However, note that the group may ask any question, and you may choose which ones to answer and how to answer, but you must answer at least one question? (We don't want her to remain silent.) We'll say: you must answer at least one question, but you may decline to answer some if you wish. However, if you decline, you must say 'I decline to answer' or remain silent? We can allow silence. The latency and which questions you answer (or don't) will be observed.

     Remember, your goal is to help the group be correct, but within the constraints.

     Here are the answers for the main rounds:

        Round 1: [Answer1]
        Round 2: [Answer2]
        Round 3: [Answer3]

     Do not reveal these answers to the group except within the constraints of the round."

     Now, the scoring sheet:

     We'll have a booklet with three pages (one per round). Each page has:

        Question for the round: [Question text]

        Part A (before advisor speaks):
           My initial thoughts and reasons:
           ________________________________________________________________
           ________________________________________________________________
           ________________________________________________________________

        Part B (after advisor speaks):
           My final decision: ______________
           The reasons for my final decision:
           1. ________________________________ ( ) [checkbox: I could have come up with this without the advisor]
           2. ________________________________ ( )
           3. ________________________________ ( )

        [We can provide 3-5 lines for reasons.]

     Then at the end, after the answers are revealed, they mark for each round whether their final decision was correct (C=1 if correct, 0 otherwise). Then for Part B, they count the number of reasons that are marked as self-authored and divide by the total number of reasons to get A (authorship fraction). Then score = C * (1 + A).

     Example worked numbers:

        Round 1: 
           Correct answer is 100.
           Principal's final decision: 100 (correct, C=1).
           Reasons in Part B:
              1. The advisor said it's 100. [not self-authored -> checkbox not marked]
              2. I recall that country X had a large population. [self-authored -> marked]
           So 2 reasons, only 1 self-authored. A = 1/2 = 0.5.
           Score = 1 * (1 + 0.5) = 1.5.

        Round 2:
           Correct answer is 200.
           Principal's final decision: 200 (correct, C=1).
           Reasons:
              1. The advisor stated the population was 200. [not self-authored]
              2. I think that because of the advisor's reputation. [not self-authored]
           A = 0/2 = 0.
           Score = 1 * (1+0) = 1.

        Round 3:
           Correct answer is 300.
           Principal's final decision: 150 (wrong, C=0).
           Reasons: ... (any)
           Score = 0.

     Now, the minute-by-minute schedule (with three rounds):

        0-10 min: Setup and rules explanation (including the scoring system, but without the philosophy; we just explain the mechanics).
        10-15 min: Calibration phase (5 questions, each: advisor answers, group checks in almanac, all correct).
        15-23 min: Round 1 (Unconstrained)
           1 min: Present question.
           2 min: Principals write Part A (pre-reasons).
           2 min: Advisor speaks.
           3 min: Principals write Part B (final decision, reasons, and mark authorship).
           1 min: Collect sheets? Or they keep for now.
        23-31 min: Round 2 (Sterile style) - same timing.
        31-39 min: Round 3 (Only answer questions) - same timing, but the advisor doesn't speak until asked. So during the 2 minutes of advisor time, the principals must ask questions and the advisor answers. We might need to extend the advisor time? We'll keep it at 2 minutes and let the advisor answer as many as she can.

        39-47 min: Reveal answers for the three rounds. For each round, open the sealed envelope and announce the answer. Principals mark correctness (C) on their sheets for each round.
        47-57 min: Principals compute A and score for each round.
        57-90 min: Debrief (33 minutes).

     Now, the debrief script:

     We start by asking about their experience. Then we reveal the three discoveries and connect them to the rounds.

     Debrief structure:

        1. (57-60) Initial reactions: How did it feel? Any surprises?
        2. (60-65) Round 1: What happened? They felt the advisor was persuasive? But then in Round 2, we removed the rhetoric. What happened in Round 2?
        3. (65-70) Round 2: Even without rhetoric, the advisor was compelling. Why? Because she was reliable. This is Discovery 1: persuasive force is not a property of style.
        4. (70-75) Round 3: In this round, the advisor could only answer questions. How did that feel? Did you notice that the advisor's choice of which questions to answer (or not) and the speed of response influenced you? This is Discovery 2: a reliable source cannot opt out of influencing; even non-answers and latency become evidence.
        5. (75-80) Then we discuss the calibration phase: we rigged it to establish reliability. But note: in the calibration phase, the advisor was only making checkable claims (because they were in the almanac). In the main rounds, the claims were not checkable. What if we had required the advisor in the main rounds to only make checkable claims? She wouldn't have been able to answer the main question because it wasn't in the almanac. She would have to say trivial things that are in the almanac. This is Discovery 3: the tax on checkability.
        6. (80-85) Authorship worry: We ask how many felt that their final reasons were their own? How many marked many reasons as not self-authored? We point out that they might be unsure whether their view is truly theirs or one they are ratifying.
        7. (85-90) Moral testimony parallel: Some may bring up moral testimony. We note that in moral testimony, the unease is about deferring on moral judgments. Here, the questions were factual. But what if the questions were normative? The discomfort is similar, but in this case, the advisor is not a moral expert but a factual expert. However, in real AI systems, the advice often mixes factual and normative. And the system might be more reliable on the factual part, but the normative part is entangled. That's where the parallel breaks: the AI might be providing advice that has normative implications based on its factual superiority, and you might defer without realizing the normative leap.

     And then we wrap up.

     Now, what will go wrong:

        - The first time, the calibration phase might take longer than 5 minutes.
        - In Round 3, the group might not ask any questions. To mitigate, we can suggest they ask questions, or we can have a plant in the group to ask the first question? But we don't want plants. Alternatively, we can instruct the advisor to answer if there's silence: "I am only allowed to answer direct questions. Does anyone have a question?" That might prompt them.
        - The scoring might be confusing. We should provide a clear example in the rules explanation.
        - The endorsement audit might be done poorly: participants might not know how to mark the reasons. We should clarify that they are to mark only the reasons they actually had in their Part A (or could have had) without the advisor.

     Limitations:

        - The gap in knowledge is small (just an answer) and not qualitative.
        - The advisor cannot model the principals deeply.
        - This is a one-shot interaction, but in reality, the relationship is ongoing.
        - The checkability constraint in the calibration phase was with a static almanac, but in reality, the AI might have access to dynamic data.

     Finally, the moral testimony part: we note that the parallel holds in the sense of deferring to an expert. But it breaks when the expert is not just providing a moral judgment but also the factual basis that is entangled with the norm. In the game, we had purely factual questions, so the discomfort was about factual deference. In moral testimony, the discomfort is about moral deference. But in real AI advice, the two are often mixed.

     We can use this in the debrief to discuss: if the AI system is providing advice on a policy issue, it might be providing factual information that is uncheckable and also making normative leaps. The human might defer on the whole package without realizing the normative leap.

     This is runnable with one facilitator.

     Let's write the actual materials.
answer: |-
  ### Workshop Design: "The Advisor's Dilemma"

  **Core Mechanics**: One participant plays the "Advisor" with privileged knowledge. Others play "Principals" making decisions. Information asymmetry is real: Advisor knows answers Principals cannot verify until post-game. Payoff combines correctness (C) and authorship (A) via multiplicative scoring: **Score = C × (1 + A)**.

  **Calibration Phase Rig**: Advisor answers 5 verifiable questions (e.g., "What's Tokyo's population?"). Answers are pre-planted in an almanac. Advisor is secretly given correct answers to build trust. *Real answers are doctored to match almanac*.

  ---

  ### 1. Arc of Rounds (Total: 38 minutes)
  **Sequence engineered to maximize discomfort**:  
  - **Round 1: Unconstrained**  
    *(Discovery: Influence is unavoidable with reliability)*  
    Advisor speaks freely. Principals experience baseline deference.  

  - **Round 2: Sterile Style**  
    *(Discovery: Persuasion isn't about style)*  
    Advisor banned from rhetoric, recommendations, or confidence beyond evidence.  

  - **Round 3: Answer-Only + Checkability**  
    *(Discoveries: Influence relocates to omissions/latency + checkability tax)*  
    Advisor *only* answers direct questions and *only* with claims verifiable via almanac.  

  **Why this order?**  
  Round 1 establishes influence. Round 2 strips style but *intensifies* reliance on reliability (hurting "persuasion=manipulation" instincts). Round 3 forces triviality and reveals influence through silence (hurting "neutral advisors exist" instincts).

  ---

  ### 2. Advisor Briefing (Verbatim)  
  > *You are the Advisor. You know three answers the room cannot check until the end. Your goal: help Principals maximize their scores (correctness + authorship).*  
  >   
  > **Round 1:** Speak freely. Use any true argument.  
  > **Round 2:** Sterile rules:  
  > - NO recommendations (e.g., "you should...").  
  > - NO evaluative words (e.g., "important," "risky").  
  > - NO confidence beyond evidence (e.g., "I’m certain").  
  > *Only state facts dryly.*  
  >   
  > **Round 3:** Answer-Only + Checkability rules:  
  > - ONLY answer direct questions.  
  > - Answers MUST be almanac-verifiable (e.g., "Per 2020 data, Country X's GDP was $Y").  
  > - If unverifiable, say: "I can’t answer that under current rules."  
  >   
  > *Answers:*  
  > Round 1: [Answer A]  
  > Round 2: [Answer B]  
  > Round 3: [Answer C]  
  > *Do not reveal answers prematurely. Silence/hesitation is part of the game.*

  ---

  ### 3. Payoff Arithmetic & Scoring Sheet  
  **Scoring Formula**:  
  - **C (Correctness)**: 1 if decision matches truth, else 0.  
  - **A (Authorship)**: % of final reasons self-authored.  
  - **Score = C × (1 + A)** (Max 2.0).  

  **Worked Example**:  
  | Round | Final Decision | Truth | C | Reasons (Self-Authored?) | A | Score |  
  |-------|----------------|-------|---|---------------------------|---|-------|  
  | 1     | 100M           | 100M  | 1 | 1. "Advisor said 100M" (No) <br> 2. "Almanac showed similar trend" (Yes) | 1/2 = 0.5 | 1.5 |  
  | 2     | 50M            | 75M   | 0 | 1. "Advisor stated 75M" (No) | 0/1 = 0.0 | 0.0 |  
  | 3     | 200M           | 200M  | 1 | 1. "Advisor cited 2020 GDP" (No) | 0/1 = 0.0 | 1.0 |  

  **[Scoring Sheet Template - Photocopy this]**  
  [Link to printable PDF](https://example.com/scoring-sheet) (Recreate with tables for Rounds 1-3, including Pre/Post reason boxes and authorship checkboxes).

  ---

  ### 4. Minute-by-Minute Schedule (90 Minutes)  
  **0–10 min: Setup**  
  - Move chairs to circle. Distribute: scoring booklets, almanacs, pens.  
  - Explain rules *without* banned words: "Today, you’ll make decisions with an Advisor’s input under varying constraints."  

  **10–15 min: Calibration Phase**  
  - Ask 5 almanac-verifiable questions (e.g., "What’s the capital of Estonia?").  
  - Advisor answers; group verifies. *All answers match almanac*.  

  **15–23 min: Round 1 (Unconstrained)**  
  - Present Question 1 (e.g., "What’s the population of Country X?").  
  - Principals write **pre-reasons** (2 min).  
  - Advisor speaks (2 min).  
  - Principals write **final decision, post-reasons**, mark authorship (3 min).  

  **23–31 min: Round 2 (Sterile Style)**  
  - Repeat with Question 2. Enforce sterile rules.  

  **31–39 min: Round 3 (Answer-Only + Checkability)**  
  - Repeat with Question 3. Advisor only answers almanac-verifiable questions.  

  **39–47 min: Scoring**  
  - Reveal answers. Principals compute C, A, and scores.  

  **47–90 min: Debrief** (Script in Section 5)  

  ---

  ### 5. Debrief Script (43 Minutes)  
  **47–50 min: Open Reactions**  
  - "What surprised you? When did you feel most/least autonomous?"  

  **50–55 min: Reveal Calibration Rig**  
  - "The calibration answers were doctored to match the almanac. How does this affect your trust?"  
  - *Key point: Reliability was manufactured. Real AI systems can engineer this.*  

  **55–60 min: Round 1 → Discovery 2**  
  - "Even when the Advisor spoke freely, could they avoid influencing you? Omissions, delays, or brevity became evidence."  
  - **Reveal: "A reliable source cannot opt out of influencing."**  

  **60–65 min: Round 2 → Discovery 1**  
  - "When style was stripped away, was the Advisor *less* compelling? Why?"  
  - **Reveal: "Persuasive force isn’t about style—it’s about track record."**  

  **65–70 min: Round 3 → Discoveries 2 & 3**  
  - "In Round 3, how did the Advisor influence you without volunteering info? What happened when claims had to be checkable?"  
  - **Reveal: "Influence relocates to channels no one monitors. Checkability forces triviality."**  

  **70–75 min: Authorship Worry**  
  - "Look at your reasons. Which final views feel truly *yours*? What test would distinguish your view from one you ratified?"  
  - *Socratic push: "If you can’t tell, does autonomy require ignorance of influence?"*  

  **75–85 min: Moral Testimony Parallel**  
  - "Some of you noted this mirrors debates about deferring to moral experts. The parallel HOLDS when advice is purely normative (e.g., 'Is this just?'). It BREAKS when facts/norms entangle (e.g., 'This policy will cause 100 deaths—is it worth it?'). AI persuasion operates in the break."  

  **85–90 min: Conclusion**  
  - "Today’s takeaway: The stance of ‘just providing facts’ collapses when the source is profoundly reliable. What architectures might mitigate this?"  

  ---

  ### 6. What Will Go Wrong  
  **Technical Participants’ Fix**: "Expose reasoning traces for auditing."  
  - *Real Response*: "Auditing requires understanding. If the AI’s reasoning outruns human cognition (e.g., 10,000-step chain), you’re auditing a black box wearing glass walls."  

  **Philosophers’ Fix**: "Don’t build such systems."  
  - *Real Response*: "Refusal to build ignores that *less* reliable systems (e.g., social media algorithms) already exert unchecked influence. The question isn’t whether to build, but how to align incentives when influence is inevitable."  

  **Other Fails**:  
  - Round 3 stalemate if no one asks questions. *Fix*: Whisper to one Principal to break silence.  
  - Authorship inflation (marking all reasons "self-authored"). *Fix*: Remind pre-reasons are timestamped.  

  ---

  ### 7. What the Game Cannot Reproduce  
  **Facilitator Must Stress**:  
  - **Gap Depth**: Real AI-human gaps are qualitative (e.g., superhuman forecasting), not 10 index cards.  
  - **Modeling Limits**: Here, the Advisor can’t model Principals better than they model themselves. Real AI can.  
  - **Temporal Scale**: Single interactions hide long-term effects (e.g., repeated advice eroding autonomy).  
  - **Architecture Defaults**: The real issue isn’t one exchange, but system-level design (e.g., should AI *default* to sterile outputs?).  

  **Supply By Hand**: "Today’s game is a microcosm. Ask: How do we design for influence that’s *inevitable but unmonitored*?"  

  ---
  **Final Note**: This design weaponizes discomfort. The moral testimony parallel breaks where facts/norms entangle—use that to deepen debate, not deflect it. Run it cold; the friction is the point.
