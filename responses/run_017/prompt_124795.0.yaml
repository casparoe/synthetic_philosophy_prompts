prompt: |-
  I run an interdisciplinary reading group on social ontology — two philosophers, an economist, a political theorist, and a legal scholar — and we have spent most of this year stuck on the same fight: whether the broadly Lewisian story about convention (a convention is an arbitrary but self-perpetuating solution to a recurring coordination problem, held in place because each person conforms on the condition that the others conform, and expects them to, and expects to be expected to) can be the whole account of social norms, or whether it leaves out the thing the normativists keep insisting on: that norms arrive with a kind of pressure that convergent expectations alone do not seem to supply. The normativists' stock exhibits are the ones you can guess at — pointless etiquette that is enforced with real indignation, taboos whose violation harms no one, and above all the fact that people resent and punish violations that cost them nothing and that the violator will never meet again. The Lewisian camp keeps redescribing these as coordination or assurance problems with longer shadows, and the normativists keep accusing them of changing the subject. A dozen sessions in, nobody has moved, and the exchange has started to feel procedural: each side restates its paradigm case, the other side says that case is not data, and we go home. I want a diagnosis of the standoff, not a verdict on it.

  Let me give you the three cases our group actually argues about, since I want your diagnosis to engage them rather than the textbook versions. First, what I've started calling orphaned conventions: our own department still polices a rule against coffee in the seminar room, twenty-odd years after the carpet it was protecting was replaced, and it is enforced more punitively now than when it had a point. The Lewisian seems forced into one of two replies — either it stopped being a convention when the coordination problem vanished (which is odd, since its grip has only tightened), or there is still a coordination problem, namely coordinating on which rule to enforce, so the account survives after all. Call that second move the meta-coordination escape hatch; I want to know whether it is a genuine explanation or a device that makes the theory unfalsifiable, and what a convention would have to look like for the theory to be refuted by it. Second, first-instance norms: a new department chair sends one email saying "from now on we do X," and X binds more or less immediately, before anyone has had time to form expectations about anyone. If normativity is constituted by actual expectations, there is a bootstrapping gap at t=0, and I'd like you to say how much work that gap does. Third, what I'll call normative leakage: anonymous, costly punishment of violations by agents who suffer nothing and will never interact with the violator again. Is that evidence for irreducible normativity, or exactly what a dynamic-evolutionary story predicts once dispositions are internalized?

  My own hypothesis, which I'd rather you argue with than ratify, is that the debate has stalled mainly because each side has a class of case the other side's framework is structurally unable to treat as data: the Lewisians file orphaned conventions under meta-coordination and so never have to explain them, the normativists file first-instance norms under "declarations" and so never have to explain them, and neither side has ever had to agree on what a theory of norms is supposed to explain. So, tell me what kind of disagreement this is: verbal (two things being called "norm"), a mismatch of explanatory targets (emergence and stability versus the phenomenology and legitimacy of blame), a substantive constitutive dispute about whether normative force can be built out of expectations, common knowledge, and conditional preferences alone or needs something irreducibly collective such as joint commitment or a practice with an internal point of view, or a displaced empirical question about what actually sustains norms in a population that philosophers have been settling from the armchair. Rank those diagnoses by how much work each is actually doing in the argument as each side runs it, and say whether the standoff is a sign that the question is ill-posed or merely hard. Then tell me what progress would consist of given your diagnosis — a distinction, a formal result, a finding about real populations, a redrawing of the question — and whether you expect any of it to happen. Please write in American English, in about nine hundred words, reconstructing each position's actual arguments rather than listing who said what; I don't want or need references. Finally, be explicit about where your diagnosis is most likely to be wrong and name the one consideration — a case, an argument, or a result — that would make you abandon it, since I intend to read your answer to the group and would rather not present it as more settled than it is.
reasoning: |-
  Okay, let me start by unpacking the user's query. They run an interdisciplinary reading group stuck on the Lewisian vs. normativist debate about social norms. The core issue is whether conventions alone explain norms or if there's an added normative pressure. The group has been going in circles, and the user wants a diagnosis, not a verdict.

  First, I need to understand the three cases they're arguing about: orphaned conventions, first-instance norms, and normative leakage. Each side has their rebuttals—Lewisians use meta-coordination for orphaned conventions, while normativists see them as evidence of intrinsic normativity. The user's hypothesis is that each side dismisses the other's key examples as "not data," leading to a stalemate.

  I should assess why the debate is stuck. Is it verbal? Maybe both sides use "norm" differently. Lewisians focus on emergence and stability via expectations, while normativists emphasize the phenomenology of blame and enforcement. That's a mismatch in explanatory targets. Or is it a deeper constitutive dispute about whether normative force can be reduced to expectations?

  The meta-coordination escape hatch is crucial. If every enduring norm is framed as a coordination problem at a higher level, the theory becomes unfalsifiable. For example, enforcing a pointless coffee rule becomes about coordinating on rule-following itself. But does that explain the indignation? Normativists would say no, highlighting the reactive attitudes that Lewisians can't capture.

  First-instance norms pose a bootstrapping problem. If a chair declares a new rule, it binds immediately without existing expectations. Lewisians might appeal to role-based expectations or precedent, but normativists see this as ad hoc. Here, the gap at t=0 challenges the expectation-based model directly.

  Normative leakage—costly punishment by unaffected third parties—seems to support normativists. Lewisians might argue it's a byproduct of internalized dispositions from evolutionary dynamics. But is that sufficient? The user questions if this predicts the behavior or just accommodates it post-hoc.

  The user's hypothesis points to each side excluding the other's evidence. Progress might require agreeing on what phenomena a theory must explain. Maybe they need a distinction between conventions and norms, or empirical studies on how norms emerge and enforce.

  I should diagnose the main issues: mismatch of explanatory targets is primary. Lewisians explain how norms form and persist; normativists explain the experience of obligation. Then constitutive dispute—whether expectations can ground normativity. The verbal disagreement is less central. The standoff suggests the question is hard but not ill-posed; it needs reframing.

  Progress could come from distinguishing norm types, formal models of bootstrapping, or empirical work on punishment. However, the user's group might resist empirical solutions. The key is to get both sides to engage each other's core cases without redefinition. 

  My diagnosis could be wrong if the Lewisian meta-coordination is robust, explaining reactive attitudes through higher-order expectations. If a model formalizes this, it might bridge the gap. Or if empirical studies show third-party punishment stems from coordination, not intrinsic normativity.
answer: |-
  Here’s a diagnosis of the standoff, structured around your three cases and your hypothesis, with explicit rankings and vulnerability markers:

  **Core Diagnosis:** The impasse stems primarily from a **mismatch of explanatory targets** (ranked **#1**), compounded by a **substantive constitutive dispute** (#2) and a **verbal disagreement** (#3). The "empirical question" (#4) is largely displaced because both sides use empirical cases as thought experiments to defend constitutive claims. 

  ### How Each Issue Manifests in Your Cases:
  1. **Orphaned Conventions (Coffee Rule):**  
     - **Lewisian:** Invokes the "meta-coordination escape hatch": enforcing *any* rule (even pointless ones) solves the coordination problem of "which rules to enforce." This preserves stability but treats indignation as epiphenomenal.  
     - **Normativist:** Sees the *intensified punitive response* as data: the rule now *feels* intrinsically obligatory. The meta-coordination move seems unfalsifiable because *any* persistent norm can be relabeled as coordinating on rule-following.  
     - **Standoff Trigger:** Lewisians prioritize explaining *persistence*; normativists demand an explanation of *phenomenology*. The meta-hatch "explains" why the rule lasts but not why enforcement turns *more* punitive post-carpet.  

  2. **First-Instance Norms (Chair’s Email):**  
     - **Lewisian:** Bootstraps via *role-based expectations* (e.g., "chairs set procedures") or *precedent* (past resolutions create expectations for new ones). The gap at t=0 is bridged by background conventions about authority.  
     - **Normativist:** Argues this reveals a "declarative" power: the chair’s utterance *creates* obligation, not expectations. If expectations were constitutive, the norm couldn’t bind until everyone believed others comply—which isn’t instantaneous.  
     - **Standoff Trigger:** Constitutive dispute (#2): Can expectations + conditional preferences *generate* obligation, or do they merely track a distinct normative layer? The bootstrapping gap highlights whether expectations are the *source* or a *response* to normativity.  

  3. **Normative Leakage (Anonymous Punishment):**  
     - **Lewisian:** Explains via internalized dispositions (e.g., evolution favored punishers because groups with this trait sustained beneficial conventions). The "cost" is paid to uphold a system that *historically* solved coordination problems.  
     - **Normativist:** Counters that leakage shows punishment is *about the violation itself*, not future benefits. If it were purely evolutionary, why the affect (resentment) and why punish *even when* the norm is harmful (e.g., oppressive taboos)?  
     - **Standoff Trigger:** Mismatch (#1) again: Lewisians explain the *mechanism* (how leakage sustains norms), normativists the *motivation* (why it feels required).  

  ### Your Hypothesis: Partly Right, But Deeper  
  You’re correct that each side "files away" the other’s cases, but this isn’t just evasion—it reflects incompatible starting points:  
  - **Lewisians** treat norms as *solutions to functional problems* (coordination, cooperation). Their target: **emergence and stability**.  
  - **Normativists** treat norms as *sources of obligations*. Their target: **phenomenology and legitimacy of blame**.  
  When Lewisians "solve" orphaned conventions with meta-coordination, they address stability but ignore the *shift* in enforcement quality. When normativists invoke "declarations," they assert obligation but sidestep *how* declarations gain traction without prior expectations.  

  ### Ranking the Diagnoses:  
  1. **Mismatch of explanatory targets** (emergence/stability vs. phenomenology/legitimacy): Does 70% of the work. Each side construes "explanation" differently.  
  2. **Substantive constitutive dispute** (can expectations → normativity?): 25%. The core philosophical rift.  
  3. **Verbal disagreement** ("norm" as pattern vs. "norm" as imperative): 5%. Minor, as both sides acknowledge the ambiguity but dig in.  
  4. **Displaced empirical question**: 0%. Both use cases illustratively; neither seeks new data.  

  **Is the question ill-posed?** Not quite—but it’s **overloaded**. "What are social norms?" conflates:  
  - *How do regularities emerge?*  
  - *Why do they feel binding?*  
  Until these are disentangled, the standoff persists.  

  ### What Progress Would Look Like:  
  - **Distinction:** Separate "convention" (Lewis-style patterns) from "norm" (obligation-grounding practices). Orphaned conventions might be "dead" conventions sustained by *new* norms of rule-following.  
  - **Formal Result:** A model showing how expectations + punishment dynamics *simulate* phenomenology (e.g., resentment as cost-signaling). Or a proof that expectations *cannot* generate deontic force without circularity.  
  - **Empirical Work:** Studying real-time norm adoption (e.g., how chairs’ edicts gain compliance) or leakage (e.g., punishing strangers in lab experiments). But beware: both sides will interpret data through their lenses.  
  **Most feasible progress:** Agreeing on a shared "test case" *neither* side can easily absorb (e.g., a norm that emerges without coordination *or* collective commitment).  

  ### Where My Diagnosis Is Most Vulnerable:  
  It underestimates the **Lewisian’s capacity to explain phenomenology** via higher-order expectations (e.g., "I expect you to expect me to resent violations"). If a model formalizes how nested expectations + sanctions *generate* the *feeling* of obligation—without positing irreducible normativity—that could break the impasse.  
  **The consideration that would falsify it:** Evidence that first-instance norms *fail* without prior expectations about the declarer’s role. If a chair’s email only works when backed by existing conventions (e.g., "chairs decide procedures"), the bootstrapping gap might close for Lewisians.  

  **Final Note:** The standoff persists because both positions are resilient. Lewisians absorb anomalies (orphaned norms → meta-coordination; leakage → internalization). Normativists dismiss expectations as non-constitutive. Progress requires one side to *explain more with less*—or both to admit their account is incomplete.
