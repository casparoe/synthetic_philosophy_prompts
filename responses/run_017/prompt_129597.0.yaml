answer: |-
  The American census practice rests on a **harm-prevention model of privacy** with **temporal limits**, fundamentally distinct from the German *informational self-determination* framework. Its implicit theory can be reconstructed as follows, separating core presuppositions from compatible elements:

  **The Core Presupposition (Strictly Required):**
  1.  **Privacy protects against tangible, temporal harms to living individuals:** The primary interest shielded is freedom from *immediate* negative consequences (e.g., discrimination, harassment, legal jeopardy, reputational damage, embarrassment) arising from the *disclosure* of personal information *during the individual's lifetime or shortly thereafter*. Privacy is not primarily about control over information *as such* or its indefinite destiny.

  **What This Practice Strictly Presupposes:**
  *   **Harm-Centricity:** Confidentiality exists *only* to prevent identifiable, living persons from suffering harm due to disclosure. Once the risk of such harm evaporates (deemed to occur after 72 years), the justification for secrecy vanishes.
  *   **Temporal Limitation:** Privacy interests are finite and expire with the individual or shortly after. There is no inherent, perpetual right to control one's informational footprint beyond death or a fixed period.
  *   **Subject-Centric Embargo:** The embargo clock starts at record creation (census day) and is tied to the *subjects'* lifespans, not the *data's* lifespan or potential future uses. 72 years is a proxy for generational death.
  *   **State Legibility as Default:** Collecting and *permanently preserving* detailed, identifiable records is a legitimate state function. Openness is the ultimate, deferred state; confidentiality is the temporary exception justified solely by harm prevention.
  *   **Distinct Public/Private Spheres:** The state's need for accurate demographic data (and later, historical preservation) outweighs any abstract individual interest in perpetual informational control, *once the harm rationale expires*.

  **What It Fits Well With (Compatible, Not Strictly Required):**
  *   **Historical/Genealogical Value:** The practice explicitly values historical record and public access for research (genealogy, social history) *over* any posthumous privacy claims.
  *   **Government Transparency & Accountability:** Permanent public archives allow scrutiny of past government actions and population data.
  *   **Practical Administration:** A fixed, clear rule (72 years) is administratively simpler than perpetual control, consent mechanisms for descendants, or complex anonymization.
  *   **Cultural Acceptance of Legacy:** An implicit cultural view that individuals become part of the "historical record" after sufficient time, diminishing personal claims to secrecy.
  *   **Primacy of the Individual Subject:** Focuses on the enumerated person, largely disregarding descendants' interests *unless* disclosure harms *them* directly *as living individuals* (e.g., revealing illegitimacy affecting inheritance *claims* – a legal harm, not informational control).

  **Addressing Your Specific Questions:**

  1.  **Is the harm-to-the-living view the only one that licenses it?**
      *   **Primarily, yes.** A strict informational self-determination view (like Germany's) would fundamentally reject the *permanent preservation and future release of identifiable data* collected under compulsion, regardless of elapsed time. A control view extending past death (protecting legacy or familial dignity) would also conflict.
      *   **Could others fit?** A very narrow "contextual integrity" view *might* accept it if the *context* of use shifts entirely from administrative/statistical to historical research after 72 years. However, the compulsion and identifiable release still strain this. The harm-based view is the cleanest fit.

  2.  **Is the 72 years principled or a poor proxy?**
      *   **It's a pragmatic proxy, not a precise principle.** It was chosen (based on life expectancy at the time) as a reasonable estimate for when most enumerated individuals would be deceased, *minimizing* direct harm risk. It's inherently imperfect:
          *   Some live longer (though rare at 72+ years post-enumeration).
          *   Descendants *can* be harmed/embarrassed by revelations about deceased ancestors (as in your example). The system largely ignores this, viewing it as outside the core "individual harm" rationale.
          *   Societal norms and potential harms evolve, but the fixed rule doesn't adapt.

  3.  **What would change under a control/self-determination view extended past death?**
      *   **Significant changes would be necessary:**
          *   **Compulsion:** Might be harder to justify ethically if individuals (or their designated heirs) have no control over the ultimate fate of the identifiable data.
          *   **Eventual Publication:** Would likely be prohibited or severely restricted. Data might be permanently anonymized or destroyed after statistical use. Public access would be limited to anonymized aggregates or records where explicit, perpetual consent could be inferred/impossible to obtain (highly impractical).
          *   **Indexing:** Searchable, identifiable publication would be the most egregious violation under this view. At minimum, this would have to cease.
      *   **The core tension:** The American practice values historical record and openness *as a public good* above posthumous control. A control view prioritizes individual autonomy over that public good.

  4.  **Does the practice need/supply a view on descendants' standing?**
      *   **It implicitly denies descendants *independent* privacy rights** over the ancestor's information. Their interests are only considered insofar as disclosure causes *them* direct, tangible harm *as living individuals* (e.g., legal or financial consequences), not mere embarrassment or familial revelation. The practice presupposes that descendants *do not* inherit a right to control or veto the release of truthful historical facts about their ancestors once the embargo period lapses. The harm (if any) is seen as emotional/social, not the kind of harm confidentiality is designed to prevent.

  5.  **Framing: Openness, Privacy, or Civic Trust?**
      *   **"Temporary Confidentiality within Permanent Openness":** This is the most accurate descriptive framing. The default trajectory is towards public availability; confidentiality is a time-limited shield against harm.
      *   **Privacy Protection?** Only in the narrow, temporal, harm-prevention sense described. It does not protect privacy as control or self-determination.
      *   **Civic Trust Framing:** This is a coherent and powerful third framing *already embedded* in the practice, particularly regarding the *collection* phase:
          *   **Legibility for Function:** Accurate census data is essential for apportionment, funding, planning – core state functions. Compulsion is deemed necessary for this.
          *   **Confidentiality for Trust:** The *promise* of temporary confidentiality is crucial to gain public cooperation and truthful answers despite compulsion. It's a quid pro quo: "Tell the state the truth, and the state will shield you from harm *for a while*."
          *   **Openness for Accountability & Legacy:** Permanent public release serves historical accountability, public memory, and reinforces the idea that citizen participation (even compelled) ultimately contributes to the nation's collective story and accessible history. Being "legible to the state" is framed not just as a necessity but as contributing to a public legacy.

  **Conclusion:**

  The U.S. census system presupposes a **utilitarian, harm-based, and temporally bounded concept of privacy.** Its core function is to prevent immediate, tangible harm to living individuals arising from disclosure during their lifetime and for a period deemed sufficient for most to pass away (72 years). This licenses compulsion (for the public good of accurate data) and temporary confidentiality (to enable truthful answers and prevent harm), with permanent public release as the default endpoint (serving historical legacy and openness). It fundamentally conflicts with a rights-based, control-centric view like informational self-determination, which would require anonymization or destruction after statistical use. The 72-year rule is a blunt but practical proxy. While descendants' interests are not central, the practice implicitly views the historical record and public access as outweighing any residual familial claims to secrecy once the embargo lapses. Framing it as "civic trust" – where temporary confidentiality enables essential state legibility, and permanent openness serves public memory and accountability – captures a significant part of its underlying justification beyond mere harm avoidance.
