  ### Sleeping Beauty Classroom Activity: Design and Implementation

  This activity simulates the Sleeping Beauty problem through an interactive guessing game with two scoring regimes, highlighting the tension between halfer and thirder intuitions. Students will experience the core disagreement, discover how scoring rules affect optimal guesses, and confront the ambiguity in defining "probability" in self-locating scenarios.

  ---

  ### **Activity Setup**
  **Materials Needed**:
  - 1 coin (for instructor)
  - 1 box with 16 slips of paper (each with a student's name)
  - Index cards (32: 16 for Phase A, 16 for Phase B)
  - Projector (to display results)
  - Bag of chocolate (rewards)
  - Colored chips (optional: for random selection in Phase B)

  **Roles**:
  - **Instructor**: Flips coins, draws names, distributes cards, manages time.
  - **Students**: All participate actively. Each is a "Beauty" who may be "awakened" (selected) to guess the coin outcome.

  **Time Allocation**:
  - **Phase A (Every Awakening Scored)**: 20 minutes  
  - **Phase B (One Awakening per Round Scored)**: 20 minutes  
  - **Debrief**: 35 minutes  

  **Amnesia Simulation**:  
  Use **random name draws with as-if instructions** (not disruptive filler tasks). Students are told to behave *as if* they don’t know if they are the only one awakened in the round. This is sufficient because:  
  - It mirrors Sleeping Beauty’s epistemic state (she knows the rules but not her "current" awakening).  
  - Filler tasks would fragment attention and consume time without adding insight.  
  - *Key instruction*: "When awakened, act as if this is your only chance to guess—you have no memory of prior awakenings this round."

  ---

  ### **Phase Rules and Payoff Scheme**  
  **Core Mechanics** (same for both phases):  
  - Each round starts with a coin flip (instructor hides outcome).  
  - **Heads**: 1 student randomly drawn from the box.  
  - **Tails**: 2 *different* students randomly drawn.  
  - Drawn students receive an index card and privately write: "Heads" or "Tails" + name.  
  - Cards collected immediately.  

  **Phase A (Every Awakening Scored)**:  
  - **Payoff**: Correct guess = 1 chocolate per awakening.  
  - **Optimal Strategy**: Always guess Tails (wins 2/3 of awakenings).  

  **Phase B (One Awakening per Round Scored)**:  
  - **Payoff**: After awakenings, instructor randomly selects **one** awakening to score:  
    - *Heads round*: Only awakening scored.  
    - *Tails round*: Use colored chips in a bag (e.g., 2 red, 1 blue) to draw one chip—assign each awakening a color and score the drawn one.  
  - Correct guess = 1 chocolate.  
  - **Optimal Strategy**: Indifference; Heads or Tails equally optimal (see calculation below).  

  **Scoring Calculation Verification**:  
  - In Phase B, P(scored awakening is Heads) = P(Heads) × P(scored | Heads) = (0.5 × 1) = 0.5.  
  - P(scored awakening is Tails) = P(Tails) × P(scored | Tails) = (0.5 × 0.5) = 0.25 (*per awakening*). But since *one awakening per round is scored*, over many rounds:  
    - 50% of scored awakenings are Heads (all Heads rounds),  
    - 50% are Tails (half of Tails rounds × 2 awakenings).  
  - Thus, P(Heads | scored) = 50%. **Guessing Tails has no advantage**.  

  **Why This Contrast Exposes the Sampling Assumption**:  
  - Phase A scores *awakening-moments* (favors Tails due to overrepresentation).  
  - Phase B scores *experimental runs* (favors neither—aligns with coin fairness).  
  - The switch reveals that "probability" depends on whether we sample moments (thirder) or trials (halfer).  

  **Order of Phases**:  
  Run **Phase A first**. Students will see Tails dominate (2/3 success), priming them to question why Phase B (50% success) nullifies this advantage. This order mirrors the Sleeping Beauty paradox: the intuitive pull toward Tails (Phase A) clashes with the coin’s objective fairness (Phase B).  

  ---

  ### **Timeline (75 Minutes Total)**  
  **0–5 min: Introduction**  
  - Explain rules: Coin flips, awakenings, amnesia instruction ("act as if no memory of this round").  
  - Emphasize: No discussion during rounds.  

  **5–25 min: Phase A (8 rounds)**  
  - **Per Round (2 min)**:  
    1. Flip coin (hidden).  
    2. Draw names: 1 (Heads) or 2 (Tails) from box.  
    3. Distribute cards; students write guesses privately.  
    4. Collect cards.  
  - *Instructor Tip*: Pre-flip coins for 4 Heads/4 Tails to ensure 12 awakenings (4H + 8T).  

  **25–30 min: Phase B Explanation**  
  - Clarify payoff: Only one awakening scored per round (random selection).  

  **30–50 min: Phase B (8 rounds)**  
  - **Per Round (2 min)**:  
    1. Same as Phase A, but after guesses, randomly select one awakening to score (use chips for Tails rounds).  
  - *Instructor Tip*: Use same coin sequence as Phase A for comparability.  

  **50–75 min: Debrief**  
  - **50–55 min: Reveal Phase A results**  
    - Project: Coin outcomes, awakenings, guesses.  
    - Tally: Total awakenings (≈12), % correct Tails guesses (≈67%).  
    - Show: Always guessing Tails yields 67% success.  
  - **55–60 min: Reveal Phase B results**  
    - Project: Scored awakenings only.  
    - Tally: % correct guesses (≈50%).  
    - Show: Always guessing Tails yields 50% success.  
  - **60–75 min: Discussion**  
    - **Map to Positions**:  
      - Phase A: "Most awakenings like this one are on Tails—so I should guess Tails!" → **Thirder intuition** (credence 1/3 Heads).  
      - Phase B: "The coin didn’t change; I knew I’d be woken, so why update?" → **Halfer intuition** (credence 1/2 Heads).  
    - **Key Objection Handling**:  
      - *"Drawing slips assumes the thirder view!"*: Agree—Phase A explicitly samples awakenings uniformly, revealing the thirder’s sampling assumption. Phase B counters by sampling trials (halfer). The point is: **Both are valid, but they answer different questions**.  
      - *"This is just about what we count!"*: Yes! The disagreement stems from ambiguity: Is "probability" about observer-moments (thirder) or world-histories (halfer)?  
    - **Limitations of Activity**:  
      - **Unreproducible Element**: The first-person identity of Beauty (one subject in both awakenings). We simulate with multiple students, so participants miss the *subjective continuity* of being reawakened. *Supply this verbally*: "Real Beauty knows she’s the same person—this affects her anticipation of future awakenings."  
      - **Other Shortcomings**: No memory erasure; rewards are extrinsic (chocolate) vs. Beauty’s intrinsic credence.  

  **Predictable Pitfalls and Solutions**:  
  - **Pitfall**: Students fixate on the sampling mechanism (like 2023’s "bag argument").  
  - **Solution**: Preempt in introduction: "We’re simulating amnesia via random draws—focus on your *own* guess as if this is your only awakening." Phase B’s contrast also diverts fixation to scoring rules.  
  - **Pitfall**: Imbalanced coin flips skew results.  
  - **Solution**: Use predetermined flips (4H/4T per phase).  

  **Why No Extensions (e.g., 10-awakening case or bookie)**:  
  - The two-phase design cleanly exposes the core disagreement. Adding cases/complexity risks diluting focus in 75 minutes. The scoring-rule contrast is the most efficient path to the "two questions" insight.  

  ---

  ### **Instructor Notes**  
  - **Least Confident Decisions**:  
    1. **Amnesia Simulation**: Will "as-if" instructions feel artificial? *Pilot test* with colleagues to refine wording.  
    2. **Phase B Random Selection**: Using chips may seem contrived. *Backup*: Assign numbers to awakenings and use a RNG app.  
  - **Why This Design Works**:  
    - All students participate actively (no one sits out >5 minutes).  
    - Stakes (chocolate) incentivize engagement.  
    - Phases A/B force confrontation between intuitions.  
    - Results visibly split 67% vs. 50%, making the paradox tangible.  

  **Final Tip**: If students struggle in debrief, ask: *"In Phase A, why did Tails win? In Phase B, why didn’t it?"* Let them articulate the sampling vs. trial conflict—then reveal "halfer" and "thirder" labels in the final 5 minutes.
