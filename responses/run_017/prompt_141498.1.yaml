  We are going to design an activity to illustrate the concept of a safe Pareto improvement without using that term until the end. The game I propose is a variant of the Nash demand game (also called the divide-the-dollar game). We'll adapt it to our needs.

  ### Game Choice: Nash Demand Game
  - **Why this game?** 
    - It's simple: players name a demand. If the sum of demands is less than or equal to a fixed total (say 10 points), each gets what they demanded. Otherwise, they get 0.
    - The conflict cases are clear: if both demand too much, both get nothing. There are multiple Nash equilibria (e.g., (5,5), (6,4), etc.), but also inefficient outcomes (when they fail to agree).
    - It naturally leads to the idea of "playing safe" by not demanding too much, but we can push for a more robust improvement.

  ### Setup
  - **Players**: 18 students, paired into 9 pairs. Each pair plays the game multiple rounds. We'll have several rounds of play, with different phases.
  - **Total to divide**: 10 points (for simplicity, integers only).
  - **Payoffs**: Points are recorded. At the end, the student with the highest total points gets a small reward (coffee voucher or participation credit). This creates a competitive incentive but without real money.

  ### Phases of the Activity

  1. **Phase 1: Playing the base game (15 minutes)**
     - Each pair plays 5 rounds of the base demand game. In each round, both players secretly write their demand (an integer between 0 and 10). 
     - The TA and instructor collect the demands, then for each pair, check if the sum is <=10. If yes, each gets their demand. If not, both get 0.
     - After 5 rounds, each player has a total score.

  2. **Phase 2: Introducing Rules (20 minutes)**
     - Now, instead of just a number, each player submits a *rule*. The rule is a function that specifies what demand they will make, conditional on the other player's demand. However, to avoid complex math, we can have them specify a rule in a simple format.
     - **Rule Format**: We'll give them a worksheet with a table. For each possible demand of the other player (from 0 to 10), they write what they will demand. 
       - Example rule: "If the other demands x, I demand (10-x)." (This is the split-the-rest rule.)
       - But they can write any rule: e.g., "Always demand 5", or "Demand 6 if the other demands <=4, else demand 4", etc.
     - **How to resolve a pair of rules?** 
       - We take the two rules and compute the outcome: 
          - Let rule A for player A: for each possible demand of B, it gives A's demand.
          - Similarly for rule B.
          - We then see what happens when these two rules interact. 
          - We can model it as: 
            - Start with an initial demand from one player, then the other responds? But that's sequential. We want simultaneous.
          - Alternatively, we look for a fixed point: a pair (a, b) such that:
              a = rule_A(b)
              b = rule_B(a)
          - We then use that (a,b) as the outcome. If there are multiple fixed points, we choose the one that is Pareto efficient? Or the one that minimizes the sum? But that's complex.
          - **Simpler approach**: We tell the students that we are going to assume that both players announce their rules and then they are required to play the demand that their rule specifies *as if the other player is going to play according to their rule*. But note: the rule is defined for any possible demand of the other, so we need to break the mutual dependency.

     - **Alternative to avoid fixed points**: We change the game to sequential. But that changes the strategic structure.

     - **Proposed resolution method (without fixed points)**:
       - We run the rules in a "simulation": 
          - We let each rule "see" the other rule. 
          - We ask: what demand would player A make if they thought player B was going to use their rule? But then player B's rule depends on A's demand. This is circular.

     - **Practical solution for the classroom**:
       - We ask each player to submit a rule that is a function of the other's demand, but then we run the game by having each player simultaneously write down their demand *as if they were playing against a player who uses the rule they see*. However, that doesn't use the conditionality.

     - **Revised idea for Phase 2**:
       - Instead of having rules that condition on the other's actual move (which we don't have until they play), we have each player commit to a rule. Then, we compute the fixed point by iteration until convergence (if it converges) or we set a limit (say 3 steps). 
          - Step 1: Player A chooses a demand a0 arbitrarily (we can set a0 = 5 by default, or let the rule specify an initial demand? Not ideal).
          - Step 2: Player B, seeing a0, uses their rule to set b0 = rule_B(a0).
          - Step 3: Player A, seeing b0, uses their rule to set a1 = rule_A(b0).
          - Step 4: Player B, seeing a1, sets b1 = rule_B(a1).
          - We stop after 3 steps and take (a3, b3) as the demands? Or we stop when (a_i, b_i) = (a_{i-1}, b_{i-1})? 

       - However, this is complex and may not converge.

     - **Simpler and more practical**: 
          We change the activity: In Phase 2, each pair of players now plays one round of the game, but this time they are allowed to discuss and agree on a pair of rules. Then they submit the rules and we compute the outcome by having each player play according to their rule, but without conditioning on the other's actual move because we are going to compute the fixed point.

          But note: the idea of safe improvement doesn't require coordination. We want an individual to change their strategy to a new rule that is safe regardless of what the other does.

     - **Let me reframe the safe Pareto improvement in the Nash demand game**:
          - Original strategy of a player: say, always demand 5.
