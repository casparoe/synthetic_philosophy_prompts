          - But wait: I get 10-x which is less than d? Then I am worse off than before? Before in this case I got 0, and now I get 10-x which is positive? So I get more than 0? Then I'm better.

          Actually: 
            Original: when x>10-d, I get 0.
            New: when x>10-d, I get 10-x (which is positive because x>10-d and x<=10, so 10-x < d, but 10-x is positive). So I get a positive amount instead of 0 -> better for me.

          And the other gets x instead of 0 -> better for them.

          But note: x might be 10, then I get 0? Then same as before? And the other gets 10? Better for them.

          So this rule is a safe improvement: 
            - For any x, I get at least as much as before and the other gets at least as much as before.

          Specifically:
            - If x <= 10-d: I get d (same as before), the other gets x (same as before).
            - If x > 10-d: I get 10-x > 0 (so better than 0), the other gets x (better than 0).

          This rule is the "accommodating" rule: I adjust my demand to ensure we don't break the total, but I never go above my original d.

