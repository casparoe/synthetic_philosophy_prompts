          - (TA and instructor walk around to help with calculations and to ensure they are testing correctly.)

  - **Phase 3: Rules in Interaction (20 minutes)**
      - Introduction (2 minutes): "Now that you've seen safe rules, we will play one more round. This time, both of you will submit a rule (which can be the one you just created, a modified one, or a new one). We will then compute the outcome based on these rules. You may discuss with your partner for 2 minutes before submitting."
      - Discussion (2 minutes): Pairs discuss.
      - Submit rules (3 minutes): Each student writes down their rule (table).
      - Resolution (10 minutes): TA and instructor collect rules and compute outcomes for each pair using the fixed point iteration method. (This might take time, so we might need to do it quickly. Alternatively, have the TA and instructor do one example in front, then have the students compute their own with supervision.)
      - Report outcomes (3 minutes).

  - **Debrief (15 minutes)**
      - We ask:
          - "In Phase 2, did anyone create a rule that always gave you at least as much as your old rule and your partner at least as much, no matter what they did? How did you do it?"
          - "In Phase 3, when both of you were changing your rules, did anyone end up worse off than before? Why do you think that happened?"
      - We then introduce the term "safe Pareto improvement" and explain:
          - The key is robustness: it works without knowing what the other player will do. We quantify over all possible behaviors of the other player.
          - It is not an equilibrium because it doesn't require the other player to best respond. It's a unilateral change that is safe.
          - But in equilibrium, both players are best responding. When you change your rule, the other player might change theirs in response, and then your rule might not be safe anymore? Actually, the safe improvement is defined for fixed opponent behavior. In a new equilibrium, the opponent's behavior might change.
          - What you give up: you might not get as much as you could in a coordinated equilibrium, but you avoid the worst.

      - Connect to the prisoner's dilemma: 
          - In the PD, if you change from Defect to Cooperate, is that safe? 
            - If the other player Cooperates: you get 3 (with Cooperate) instead of 5 (if you had Defected) -> worse.
            - So it's not safe.
          - But if you change to a tit-for-tat? That's not safe either because if the other always defects, you end up defecting too, so you get 1 which is the same as always defecting. But if the other cooperates, you get 3. But always defecting gets 1 in both cases. So tit-for-tat is not a safe improvement over always defect? 
            - When the other always defects: tit-for-tat defects -> you get 1, same as always defect.
            - When the other always cooperates: tit-for-tat cooperates -> you get 3, better than 1 (which is what always defect would get).
            - So you are never worse off and sometimes better off. And the other player: 
                 - If they always defect: they get 1 (same as before).
                 - If they always cooperate: they get 3 (better than 1, which is what they would have gotten if you had always defected).
            - So tit-for-tat is a safe improvement over always defect.

          - But note: in the simultaneous PD, tit-for-tat is not defined because there is no prior move. We are considering repeated games? 

          - We might avoid the PD example if it hasn't been covered in depth.

  ### What might go wrong?

  1. **Phase 2: Students might not understand how to create a rule.**
     - Mitigation: Provide a clear worksheet with x from 0 to 10 and a blank for y. Give an example: "For instance, you might say: if x is 0, I demand 10; if x is 1, I demand 9; ... if x is 10, I demand 0. This is the 'split the rest' rule."

  2. **Phase 2: The test might be too complex.**
     - Mitigation: Provide a worksheet for the test with columns: 
          Attempt | x chosen by opponent | y computed by innovator | 
          Old: Innovator payoff, Opponent payoff | 
          New: Innovator payoff, Opponent payoff | 
          Is innovator at least as well off? (Y/N) | Is opponent at least as well off? (Y/N) | 
          Safe? (Y/N)

  3. **Phase 3: Fixed point iteration might not converge or might be slow to compute.**
     - Mitigation: Do only 3 iterations and take the last. If there's a cycle, take the average? Or use the first pair that sums to <=10? Instead, we can have the students do the iteration themselves under supervision.

  4. **Time**: The activity might run over.
     - Mitigation: Be strict on time. In Phase 1, use pre-printed slips for demands to speed up collection. In Phase 3, have the TA help with computation.

  5. **Students might not see the point**.
     - Debrief thoroughly, connecting their experiences to the concept.

  ### Parts that might not emerge and need stating:

  - The quantification over the other player's behavior: we might need to explain that the guarantee is for every possible move of the other player, not just in equilibrium.
  - The difference between a safe improvement and an equilibrium improvement: the safe improvement is a unilateral change that requires no coordination and works even if the other player is irrational or adversarial. But it might not be an equilibrium because the other player, knowing your rule, might adjust to exploit it.
  - The connection to robustness in AI coordination: that when agents don't trust each other's models, they can use such safe improvements to ensure no harm.

  ### Final Adjustments

  Given the complexity, we might simplify Phase 2's testing by having the opponent only try 2 values of x. Or we might do a whole-class demonstration for one innovator and one opponent before they do it in pairs.

  But I think the design is workable.
answer: |-
  Below is a complete lesson plan for your 75-minute session, designed to help students discover "safe Pareto improvements" organically through gameplay and discussion. The activity uses a **modified Nash demand game** (simultaneous demands on a fixed surplus) for simplicity and visibility of conflict.

  ---

  ### **Phase 1: Base Game (20 minutes)**
  **Game Setup**  
  - **Rules**: Pairs split 10 points. Each player secretly demands an integer (0–10). If the sum of demands ≤10, both get what they demanded. If the sum >10, both get 0.  
  - **Payoffs**: Points accumulate over rounds. Top scorer gets a coffee voucher.  
  - **Rounds**:  
    - **Round 1–3**: Baseline play. Students submit demands on slips of paper. TA/resolver collects and announces pair outcomes.  
    - **Round 4**: Public discussion (2 min). Pairs can coordinate demands verbally.  
    - **Round 5**: No discussion. Play as before.  

  **Why this game?**  
  - Simple arithmetic, clear conflict (over-demands → 0 points), and multiple equilibria (e.g., (5,5), (8,2)). Prevents easy coordination without rules.  

  **Timeline**:  
  - 0–5 min: Explain rules, distribute slips.  
  - 5–15 min: Play Rounds 1–3 (2 min/round).  
  - 15–17 min: Round 4 (discussion).  
  - 17–20 min: Round 5 (silent play).  

  ---

  ### **Phase 2: Rule Submission & Safety Testing (25 minutes)**  
  **Transition to Rules**  
  - **Prompt**: *"Now, submit a *rule* instead of a number. Your rule should tell you what to demand *based on what the other player does*. For example: ‘If they demand X, I demand Y.’"*  
  - **Worksheet**: Simplified table (see below). No further hints.  

  | If the other demands... | ...I demand: |
  |-------------------------|-------------|
  | 0                       | `__`        |
  | 1                       | `__`        |
  | ... (up to 10)          | `__`        |

  **Resolving Rules in Pairs**  
  - **Method**: For each pair of rules:  
    1. Start with an arbitrary demand from Player A (e.g., 5).  
    2. Use Player B’s rule to respond to that demand.  
    3. Use Player A’s rule to respond to B’s demand.  
    4. Repeat 2–3 for **3 iterations** or until demands stabilize.  
    5. Use the final demands to determine payoffs.  
  - **Handling Issues**:  
    - **Loops/Chaos**: Use the first stable pair (if none, default to both getting 0).  
    - **Uncomputable Rules**: TA intervenes to simplify (e.g., if a rule says "demand what they demand," treat it as matching).  

  **Safety Testing**  
  - **Adversary Role**: Assign 2–3 students as "adversaries." Their goal: **break** proposed rules by finding an opponent behavior that makes the rule worse than the player’s original strategy.  
  - **Process**:  
    1. Adversaries rotate between pairs.  
    2. For a target player’s rule, the adversary picks *any* demand (0–10) for the "opponent."  
    3. Compare outcomes:  
       - **Original**: What the player earned in Phase 1 when facing similar demands.  
       - **New**: What the rule outputs against the adversary’s chosen demand.  
    - **Rule "fails"** if either:  
      - Player earns *less* with the new rule, OR  
      - Opponent earns *less* than they would have against the original strategy.  
  - **Example**:  
    - Player’s original strategy: Always demand 6.  
    - Player’s new rule: "If they demand ≤4, I demand 6; if >4, I demand 10−X."  
    - Adversary tests X=7:  
      - Original: Sum=6+7=13 → both get 0.  
      - New rule: Player demands 3 (10−7). Sum=3+7=10 → player gets 3, opponent gets 7.  
      - Outcome: Player is better (3>0), opponent is better (7>0) → rule "safe" for this test.  

  **Timeline**:  
  - 20–25 min: Introduce rules, distribute worksheets.  
  - 25–30 min: Students write rules individually.  
  - 30–40 min: Adversaries test rules (TA facilitates).  
  - 40–45 min: Play one round with rules (using iteration resolution).  

  ---

  ### **Phase 3: When Guarantees Break (15 minutes)**  
  **Triggering the Break**  
  - **New Rule Prompt**: *"Submit a new rule. Now, you know your partner’s rule from Phase 2. Exploit it!"*  
  - **Play 1–2 Rounds**:  
    - Students submit rules conditional on the *other’s rule* (not just their demand).  
    - Resolution uses the same iteration method.  

  **Predictable Breakage**:  
  - Students will create aggressive rules (e.g., *"If their rule accommodates high demands, I demand 10"*).  
  - **Outcome**: Rules that were "safe" in Phase 2 now fail. E.g., an accommodating rule (like demanding 10−X) faces a partner who *always* demands 9 → player gets 1, partner gets 9. Player is worse than in equilibria like (5,5).  

  **Debrief Hook**:  
  - *"Why did your Phase 2 rules stop working? What changed?"*  

  **Timeline**:  
  - 45–50 min: New rule submission.  
  - 50–55 min: Resolve outcomes.  
  - 55–60 min: Share pair results (highlight failures).  

  ---

  ### **Debrief (15 minutes)**  
  **Guided Discussion**  
  1. **Quantifying Over Behavior (Safe Improvement)**:  
     - *Ask*: "In Phase 2, what did your rule *guarantee*, no matter what the other did?"  
     - *Expected Answer*: "I/my partner never did worse, even if they were greedy."  
     - *Reinforce*: "Exactly! You covered *all possibilities* for the other’s action—no predictions needed."  

  2. **Not an Equilibrium Argument**:  
     - *Ask*: "In Phase 3, why did your safe rule fail?"  
     - *Expected Answer*: "They changed their rule to exploit mine!"  
     - *Explain*: "Safe improvements fix *your* behavior against a *static* opponent. But if they react, your fix may backfire. Equilibria require mutual best responses; safe improvements don’t."  

  3. **Trade-offs**:  
     - *Ask*: "What did you sacrifice for robustness in Phase 2?"  
     - *Expected Answer*: "High payoffs—I couldn’t force a better split."  
     - *Clarify*: "You traded upside potential for downside protection. Robustness costs ambition."  

  4. **Name the Concept**:  
     - *Reveal*: "This is a **safe Pareto improvement**—it unilaterally improves outcomes *for all* against *any* opponent behavior, but isn’t equilibrium-proof."  

  **Connect to AI/Philosophy**:  
  - *"In AI coordination, agents can’t trust each other’s models. Safe improvements let them cooperate *without* trust by guaranteeing no one is harmed."*  

  ---

  ### **What Could Go Wrong & Fixes**  
  1. **Rules Are Too Complex**:  
     - Students write vague rules (e.g., "I’ll be fair").  
     - **Fix**: Provide the worksheet template; require concrete numbers.  

  2. **Adversaries Don’t Break Rules**:  
     - Adversaries pick non-threatening demands.  
     - **Fix**: Prep adversaries privately: *"Your job is to be ruthless—try X=0, X=10, and X=9."*  

  3. **Iteration Resolution Confusion**:  
     - Students don’t understand the step-by-step process.  
     - **Fix**: Demo with a volunteer pair on the board.  

  4. **Phase 3 Breakage Isn’t Obvious**:  
     - Some pairs still coordinate.  
     - **Fix**: Highlight a pair where one player exploited the other’s safe rule (e.g., 9 vs. 1).  

  ---

  ### **What the Activity Can’t Teach (State This Outright)**  
  - **The Formal Definition**: Students won’t intuit the mathematical phrasing: *"A strategy σ' is a safe Pareto improvement over σ if, for all opponent strategies τ, u_i(σ', τ) ≥ u_i(σ, τ) and u_j(σ', τ) ≥ u_j(σ, τ)."*  
  - **Expected Utility Context**: Safe improvements in stochastic games require EU, but you’re avoiding this. Simply note: *"With randomness, we’d need expectations—today was the deterministic case."*  

  ---

  ### **Materials**  
  - **Worksheets**: Tables for rule submission.  
  - **Slips of Paper**: For Phase 1 demands.  
  - **Scoreboard**: Track points publicly.  
  - **Adversary Cheat Sheet**: Suggested test demands (0, 10, 9).  

  This plan ensures students experience safe improvements as a *tool* (Phase 2) and its *limits* (Phase 3), culminating in a precise debrief. The Nash demand game’s transparency makes conflicts and guarantees visceral.
