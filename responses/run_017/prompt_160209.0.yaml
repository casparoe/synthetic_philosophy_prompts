prompt: |-
  Hey — I'm the trainee rep on my hospital's Courage and Conscience Award committee (I'm a PhD student in bioethics; I got put on it because someone had to be). We have to decide this year's award by Thursday and we are completely deadlocked, so I want to circulate a short written opinion beforehand that actually recommends something.

  The award is one per year, a plaque plus $5k from a donor whose deed says it's for 'an act no one could have been required to do.' Three finalists:

  - A radiography tech who flagged a shielding defect in the interventional suite, was repeatedly told to drop it, kept going, and eventually left for another job after being frozen out by his own department. The defect was real and got fixed. No one was harmed yet.
  - A nurse who stayed through the evacuation during last year's flooding, hand-bagging ventilated patients for about eleven hours in the dark after the generators failed, against an explicit order to leave. Two of the four patients she was bagging died anyway.
  - An intern who donated a kidney to a patient she had met twice on consults. No prior relationship, no family pressure.

  The split is roughly: one half says the tech was just doing his job, reporting a safety problem is exactly what you're supposed to do, and rewarding him insults the people who quietly report things every year and get nothing. The other half says that if we skip him we are telling everyone that the cost of doing the right thing falls entirely on them.

  Three more things I need handled. First, a committee member found out the intern is going through a divorce and has said, off the record, that the donation was 'about guilt, not generosity.' I think that should be irrelevant but I can't really say why. Second, someone has argued that honouring this kind of thing tells everyone else the behaviour is optional — that the award itself lowers the bar. That objection keeps sticking with me and I don't know what to do with it. Third, we screened out a fourth candidate earlier because covering for a colleague in rehab meant lying to the scheduling system — good outcome, dodgy means — and I'd like to know whether that screen was right.

  So: draft the opinion I send round. It should name who gets the award, or give a defensible reason for giving none, and it should say what 'beyond what anyone could have been required to do' ought to mean for us next year, since we'll hit this again. Please don't settle for 'all three are praiseworthy' — the whole point is that we have to pick. And the strongest thing on the losing side has to appear in it properly, not as a straw man. Its the bit I keep going in circles on.
reasoning: |-
  Okay, the user is a PhD bioethics student serving as a trainee rep on a hospital's Courage and Conscience Award committee. They're deadlocked on choosing between three finalists and need a draft opinion that picks a winner by Thursday. The award is for "an act no one could have been required to do" with $5k and a plaque at stake.

  First, I need to unpack the three candidates:
  - Radiography tech who reported a shielding defect despite pushback and career consequences
  - Nurse who stayed during flooding to hand-bag ventilated patients against orders, with two deaths
  - Intern who donated a kidney to a near-stranger

  The committee is split between those who think the tech was just doing his job versus those who see his suffering as making it "beyond required." The nurse's case involves clear disobedience but extraordinary sacrifice. The intern's donation seems purely voluntary but has divorce/guilt complications.

  Three thorny issues to address:
  1) The intern's alleged guilt motivation - I need to argue this is irrelevant ethically since motives don't change the act's nature
  2) The "lowering the bar" objection - must counter that the award highlights aspirational standards rather than diminishing expectations
  3) Whether screening out the fourth candidate (lying for rehab cover) was correct - yes, because means matter in conscientious acts

  The core challenge is defining "beyond required." I should propose a three-part test: 
  - Was the act *discretionary*? (Not job-defined)
  - Was there *significant sacrifice*? (Career, safety, health)
  - Did it *protect core values*? (Safety, life, dignity)

  Applying this:
  - Tech's act: Job-adjacent (safety reporting), sacrifice was career harm → not fully "beyond"
  - Nurse: Disobeyed orders (discretionary), risked life in crisis, upheld patient care → strongest fit
  - Intern: Elective sacrifice but no immediate crisis → honorable but less aligned with award's intent

  For the draft structure:
  - Start with award criteria definition
  - Analyze each candidate against framework
  - Directly address the three additional issues
  - Recommend the nurse with integrity
  - Explain why others don't win without diminishing them
  - Propose the test for future committees

  Key rhetorical moves:
  - Preempt "all deserve praise" by stressing necessity of distinction
  - Steelman opposing views (e.g. "some argue tech's persistence is exactly what we expect...")
  - Use the flooding case to neutralize "lowering the bar" concern (her act was clearly beyond duty)

  The user's hidden needs:
  - Authority as junior member (needs robust framework)
  - Break deadlock without alienating factions
  - Establish ethical reasoning precedent
  - Handle gossip about intern professionally
  - Validate their instinct about screening the fourth candidate
answer: |-
  Here’s a draft opinion you can circulate. It directly addresses the deadlock, names a winner, confronts objections head-on, and clarifies the criteria for future decisions. I’ve structured it to model rigorous bioethical reasoning while remaining accessible.

  ---

  **MEMORANDUM**  
  **To:** Courage and Conscience Award Committee  
  **From:** [Your Name], Trainee Rep  
  **Date:** [Current Date]  
  **Subject:** Recommendation for 2024 Award & Criteria Clarification  

  ### I. Introduction
  We are deadlocked because we lack consensus on interpreting the award’s core criterion: *“an act no one could have been required to do.”* After reviewing the finalists and committee debates, I propose we adopt a consistent framework to resolve this dispute and guide future decisions. The strongest acts of courage and conscience involve:  
  1. **Discretionary sacrifice** (not reasonably mandated by role, contract, or law),  
  2. **Significant personal cost** (career, safety, or profound physical/emotional burden), and  
  3. **Upholding a core medical value** (patient safety, life, dignity) against systemic or crisis-driven opposition.  

  Using this, I recommend **awarding the nurse** who stayed to hand-bag patients during the flood. Below, I address all finalists, steelman the strongest counterarguments, and respond to ancillary concerns.  

  ---

  ### II. Analysis of Finalists Against Criteria  

  #### A. Radiography Tech  
  - **The act:** Persisted in reporting a shielding defect despite departmental resistance, job loss, and retaliation.  
  - **Strengths:** Genuine moral courage; protected future patients from harm. The cost was real (career sacrifice).  
  - **Counterargument (steelmanned):** *Reporting safety issues is a baseline professional duty. Rewarding this implies routine compliance is inadequate, potentially demoralizing staff who fulfill obligations without acclaim. The tech’s act, while commendable, falls within the scope of “required” institutional safety protocols.*  
  - **Why it falls short:** Safety reporting is an expected duty, even when difficult. The *degree* of sacrifice (job loss) is compelling, but the *act itself* aligns with existing hospital policies and professional standards (e.g., Joint Commission mandates). This does not diminish his integrity but places it in a category of enforced duties.  

  #### B. Nurse  
  - **The act:** Defied evacuation orders to manually ventilate four critically ill patients for 11 hours in life-threatening conditions, knowing two might not survive.  
  - **Strengths:** Unambiguously discretionary (explicit order to leave); extreme sacrifice (physical/emotional exhaustion, mortal risk); upheld patient dignity in a collapse of systems.  
  - **Counterargument (steelmanned):** *Honoring disobedience risks encouraging insubordination during emergencies and implies such sacrifices are optional. If her act is “beyond required,” does that mean abandoning patients during crises is acceptable?*  
  - **Why it prevails:**  
    - **Discretionary:** No policy or law *requires* staff to remain in an evacuation zone without functional infrastructure. Her choice was supererogatory (beyond duty).  
    - **Cost:** She risked her life and endured trauma where systems failed.  
    - **Value upheld:** Patient survival and dignity when institutions could not act.  
    - **Addressing “lowering the bar”:** This award does not make the act “optional”; it recognizes that *even when systems fail*, individuals may choose extraordinary sacrifice. It signals that our highest values (e.g., “do no harm”) can transcend protocols in extremis. Rewarding her elevates the bar by modeling unwavering commitment.  

  #### C. Intern  
  - **The act:** Donated a kidney to a near-stranger after minimal contact.  
  - **Strengths:** Profound physical sacrifice; embodies altruism.  
  - **Counterargument (steelmanned):** *Living organ donation is inherently voluntary and noble, but it occurs outside the clinical relationship. Awarding it blurs the line between professional conscience and private charity.*  
  - **Why it falls short:** While heroic, this was a *personal* act of generosity, not one addressing an institutional or systemic challenge. It lacks the “against opposition” element critical to conscientious objection in a professional context.  
  - **On motivation (“guilt”):** Irrelevant. The award evaluates acts, not motives. Subjective reasons (guilt, generosity, faith) are unverifiable and ethically incidental; the outcome—saving a life through sacrifice—is what matters.  

  ---

  ### III. Ancillary Matters  
  1. **Screening the Fourth Candidate (lying for rehab coverage):**  
     - **Correct decision.** Conscientious acts must align with core medical ethics. Lying to systems erodes trust and integrity, even for a “good” outcome (e.g., covering for rehab). The means matter; this was a prudential compromise, not courage or conscience.  

  2. **“Lowering the Bar” Objection (revisited):**  
     - If the nurse’s act were *required*, we would mandate staff to die in futile situations. The award highlights *exceptional* virtue precisely because it is *not* obligatory. It inspires without diluting standards.  

  ---

  ### IV. Recommendation: Award to the Nurse  
  Her act best fulfills the donor’s intent: an unrepeatable, institution-defying sacrifice during a catastrophic failure. It was discretionary, costly, and upheld the irreplaceable value of dying with dignity.  

  ### V. For Next Year: Defining “Beyond Required”  
  We should adopt the three-part test above. Acts must:  
  1. **Transcend role-based obligations** (e.g., protocols, job descriptions),  
  2. **Entail significant, demonstrable sacrifice**, and  
  3. **Respond to institutional or crisis-driven threats to patient welfare**.  

  This excludes:  
  - Routine compliance (even if difficult),  
  - Private acts detached from professional context,  
  - Acts involving unethical means.  

  ---

  **Conclusion:** We honor the tech’s integrity and the intern’s generosity by celebrating them elsewhere (e.g., internal commendations). But the Courage and Conscience Award must distinguish *exceptional, system-testing* sacrifice. The nurse’s choice—made in darkness, against orders, with no guarantee of success—epitomizes this. I move to award it to her.  

  ---  
  **End of Memorandum**  

  ### Why this works:  
  - **Solves the deadlock** by introducing a transparent framework (discretion, sacrifice, value upheld).  
  - **Names a winner** decisively while giving the losing arguments their strongest form.  
  - **Neutralizes objections**:  
    - “Lowering the bar” → reframed as *setting aspirational standards*.  
    - Motive (intern’s guilt) → dismissed as ethically irrelevant.  
    - Tech’s “just doing his job” → acknowledged but contextualized.  
  - **Validates screening the fourth candidate** with a clear “means vs. ends” principle.  
  - **Provides a rubric for future committees** to prevent recurring deadlocks.  

  This draft positions you as a thoughtful mediator who respects all views but drives toward resolution. Circulate it ahead of the meeting to focus discussion.
