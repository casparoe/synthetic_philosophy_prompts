prompt: |-
  I have recently been seconded onto a small team redrafting my foreign ministry's guidance on when to support protection-of-civilians mandates, and the same case keeps being cited at me in opposite directions, so I want it worked through properly rather than gestured at. Take NATO's 2011 Libya intervention and analyze it through the doctrine it was sold under: the responsibility to protect, read together with the just-war categories it leans on (legitimate authority, last resort, reasonable prospect, proportionality, right intention, and a post-war responsibility to rebuild). The facts I want taken as given: Security Council authorization in March 2011 for a no-fly zone and all necessary measures short of foreign occupation, five abstentions including Brazil, Russia, China, India and Germany; Gaddafi's forces advancing on Benghazi after he threatened reprisals; a seven-month air campaign in which the coalition effectively became the rebels' air force; his killing at Sirte in October; then state fragmentation, a second civil war and a militia economy, and a much colder Security Council on Syria afterwards, with Brazil's responsibility-while-protecting formula and the Russia-China vetoes.

  Two things I want you to test rather than assume. First, a structural claim I have been toying with and cannot settle: that regime change in Libya was not mission creep or bad faith but was selected by the means the mandate permitted, since air power with no ground component cannot convert a temporary reprieve into a durable one (any ceasefire leaving the incumbent's armour and command intact simply re-creates the threat the mandate exists to remove), so a protection mandate plus stand-off air power plus no boots on the ground adds up to decapitation whether or not anyone intended it. Second, the symmetric hazard on the protected side: once an external air umbrella exists, the party being protected has an incentive to reject ceasefires and to leave its own civilians exposed, because the interveners' credibility is hostage to being seen to protect. Give me the disciplined mapping first: who the mandate-holder is, what the proportionality baseline is against (including the counterfactual massacre that never happened), what would count as success and as disengagement, and what the doctrine says the coalition should have done at each point. Then say which features of Libya R2P explains, which it has no vocabulary for (a protection force that becomes a belligerent, success conditions it cannot specify, a norm whose authority is spent by one selective use), and whether the episode is a confirmation, an anomaly, or a case the doctrine never contemplated. Say plainly where the theory is silent.
reasoning: |-
  Okay, let me approach this systematically. The user is a foreign policy professional grappling with Libya 2011 as a test case for R2P doctrine, needing structural analysis beyond surface arguments. 

  First, I need to establish the doctrinal framework clearly. The R2P pillars (2005 WSOD) and jus ad bellum principles form the core, but Libya exposes tensions between them. The structural claim about air power intrinsically leading to regime change deserves special attention - it's not just about Libyan events but about means-ends logic in protection mandates. 

  On mandate execution: Security Council Resolution 1973 authorized "all necessary measures" for civilian protection with key abstentions. The no-occupation clause created an operational paradox: how do you neutralize Gaddafi's armor without boots on the ground? Air power alone couldn't degrade command structures permanently. This connects directly to the user's hypothesis about decapitation being structurally determined. 

  Proportionality assessment requires comparing coalition actions against the Benghazi counterfactual (Gaddafi's threatened "no mercy" offensive). But when threats shifted from imminent massacre to protracted conflict, the baseline blurred. Post-Ajabiya, the coalition faced asymmetric incentives: rebels knew air support was their only advantage, creating moral hazard. 

  The theory's silence on "belligerent drift" is glaring. Once coalition airpower became the rebels' air force, R2P had no guidance for when civilian protection morphs into partisan warfare. Similarly, the doctrine never contemplated how selective application (Syria vetoes after Libya) would erode its own legitimacy. 

  Most critically, the "rebuild" pillar failed catastrophically. With no occupation permitted and no stabilization plan, the mandate's end-state was undefined - a fatal flaw the user's hypothesis predicts. This isn't just about Libya; it reveals a structural gap in limited-intervention theory. 

  For the user's policy drafting, the implications are stark: future mandates must either accept occupation risks or define success as containment rather than resolution. The Libya case proves you can't have protection without political outcome control.
answer: |-
  Here's a disciplined analysis of NATO's Libya intervention through the R2P/JWT framework, testing your structural claims and identifying doctrinal gaps:

  **Core Framework Mapping:**
  1.  **Mandate-Holder:** UN Security Council (Resolution 1973, March 2011). Authorized "all necessary measures" (Chapter VII) to protect civilians, enforce NFZ, exclude occupation.
  2.  **Proportionality Baseline:** Primarily measured against the *imminent, large-scale threat* to civilians in Benghazi (Gaddafi's "no mercy" threat, forces advancing). Secondary baseline: Collateral damage from coalition strikes vs. harm prevented. *Counterfactual:* Large-scale massacre in Benghazi & reprisals across rebel-held areas.
  3.  **Success Conditions (Doctrinal):** Immediate cessation of attacks on civilians; deterrence of future attacks; establishment of a secure environment enabling humanitarian access and political dialogue. *Disengagement:* When threat to civilians demonstrably removed, stable ceasefire/political process underway, Libyan authorities capable of assuming protection.
  4.  **Reasonable Prospect:** Initial assessment: Airpower could halt Benghazi assault quickly. Later assessment: Airpower could degrade regime military capacity sufficiently to protect civilians nationwide and enable a negotiated outcome.
  5.  **Right Intention:** Publicly stated: Solely civilian protection. Test: Did actions *consistently* prioritize protection over other goals? Did mandate interpretation evolve?
  6.  **Last Resort:** Diplomatic pressure, sanctions, asset freezes, referral to ICC attempted. Coalition argued Gaddafi's continued advance demonstrated intransigence.
  7.  **Legitimate Authority:** UNSC authorization provided initial legitimacy. Abstentions (especially BRICS) signaled significant reservations about mandate scope and potential misuse.
  8.  **Rebuild Responsibility (R2P Pillar III):** Explicit commitment to assist Libya in post-conflict peacebuilding, institution-building, and reconciliation.

  **Analysis Against Framework & Events:**

  1.  **Initial Phase (Benghazi Reprieve):**
      *   **Doctrine Match:** Air strikes halted advancing armor on Benghazi outskirts. This fulfilled the *immediate* protection mandate, was proportional to the threat, and had a high probability of success for that specific objective. Legitimate authority was clear.
      *   **Success Achieved?** **Yes**, for the specific, imminent threat to Benghazi. Disengagement was *not* considered at this point, as the threat remained systemic.

  2.  **Shift to Offensive Air Support & Regime Change:**
      *   **Structural Claim Validation:** Your hypothesis holds significant weight. The mandate ("all necessary measures") + stand-off airpower + no occupation + Gaddafi's intact regime = inherent pressure for regime decapitation.
          *   Airpower *could* temporarily disable armor near civilians, but *could not* neutralize Gaddafi's command, control, intelligence apparatus, or loyalist ground forces dispersed across the country. Degrading these required strikes far beyond purely defensive "protection" roles.
          *   Leaving Gaddafi in power meant leaving the primary *source* of the threat intact. Any ceasefire would have been inherently unstable, recreating the threat R2P sought to prevent ("protection gap"). Regime survival *was* incompatible with sustained civilian protection under the mandate's logic.
      *   **Doctrine Mismatch (Intent & Proportionality):** Actions (strikes on command centers, Tripoli barracks, supply lines deep in government territory) clearly exceeded "neutral" protection of civilians and became direct participation in the civil war on the rebel side. This violated the stated "right intention" and stretched "protection" proportionality towards enabling rebel victory.
      *   **Reasonable Prospect?** Initial Benghazi success proved achievable. The prospect of achieving *nationwide, sustained* protection through airpower alone without regime change was highly questionable. The coalition effectively bet that decapitation was the *only* path to lasting protection.

  3.  **Symmetric Hazard (Protected Party Incentives):**
      *   **Manifestation:** The rebels (NTC) consistently rejected ceasefires and negotiations once NATO airpower intervened. They positioned forces in populated areas, understanding Gaddafi reprisals would trigger NATO strikes. Their offensive actions (e.g., towards Sirte, Tripoli) deliberately exposed civilians, knowing NATO was committed to preventing their defeat.
      *   **Doctrine Silence:** R2P/JWT focuses overwhelmingly on the *intervener's* actions and the *threatener's* (Gaddafi) behavior. It has **no vocabulary or mechanisms** to address moral hazard or incentivization of the *protected* party to prolong conflict or exploit the intervention for maximalist goals. This is a critical gap.

  4.  **Disengagement & Rebuild Failure:**
      *   **Doctrine Failure:** The killing of Gaddafi (October 2011) marked the *end* of major combat, but no stable security environment existed. The coalition declared success and withdrew rapidly. Pillar III (Rebuild) was catastrophically neglected.
      *   **Success Conditions Undefined:** Doctrine assumed "protection achieved" meant "stable environment follows." It provided no clear metrics for when the *systemic* threat was removed beyond regime collapse. Disengagement happened based on military victory, not established security or governance.
      *   **Rebuild Responsibility Abandoned:** Despite promises, there was no coherent, resourced international plan for disarmament, reconciliation, or institution-building. The "no occupation" clause became an excuse for minimal engagement post-conflict. The fragmented state, second civil war, and militia economy are direct results.

  **What R2P Explains (and What it Doesn't):**

  *   **Explains:**
      *   The *trigger* for intervention (imminent mass atrocity).
      *   The *initial legitimacy* derived from UNSC authorization.
      *   The *logical pressure* to neutralize the source of the threat (Gaddafi).
      *   The *moral justification* for preventing Benghazi.
  *   **No Vocabulary For:**
      *   **Belligerent Drift:** How a neutral "protection" force inevitably becomes a co-belligerent when facing a determined perpetrator state *and* supporting an opposition force, using stand-off weapons only. Doctrine assumes a clear protector/threatener binary, not a civil war dynamic.
      *   **Protected Party Agency/Hazard:** The incentives and strategies of the group being protected to exploit the intervention (as outlined above).
      *   **Success Metrics Beyond Regime Change:** How to define "protection achieved" and "safe disengagement" in a complex civil war where removing the threat *requires* regime change but doesn't automatically create stability.
      *   **Selective Application & Norm Erosion:** How one controversial application (seen as overreach/regime change) can paralyze the norm for future cases (Syria), making "never again" *less* likely. Doctrine assumes virtuous application strengthens norms; Libya shows perverse consequences can occur.
      *   **Feasibility of Limited Means:** Doctrine doesn't grapple deeply enough with the inherent limitations of stand-off airpower *alone* to achieve sustainable protection without either occupation or decisive regime change.

  **Libya's Status for R2P Doctrine: An Anomaly that Revealed Fatal Flaws**

  *   **Confirmation?** Confirms R2P can mobilize action for imminent atrocities *if* political will exists (Benghazi phase).
  *   **Anomaly?** Not entirely. It exposed latent tensions within the doctrine when applied to civil wars.
  *   **Case the Doctrine Never Properly Contemplated?** **Crucially, Yes.** The doctrine was built conceptually on cases like Rwanda (inaction) or Kosovo (humanitarian intervention sans UNSC). It inadequately contemplated:
      *   The dynamics of a UNSC-authorized intervention actively supporting one side in a civil war using *only* airpower.
      *   The impossibility of achieving *sustained* civilian protection without either occupying the country or ensuring the threatening regime's removal – and the consequences of choosing the latter without a plan for the former.
      *   The catastrophic impact of neglecting Pillar III.

  **Conclusion:**
  Libya is less a pure anomaly than a **stress test R2P failed**. Your structural claim is compelling: the combination of a civilian protection mandate, stand-off airpower, a prohibition on occupation, and an intact threat source (Gaddafi) created an inherent logic for regime decapitation, regardless of initial intent. This dynamic, coupled with the coalition's willingness to embrace it and the NTC's exploitation of the air umbrella, led to mission drift that R2P doctrine couldn't prevent or even adequately describe. The doctrine's silence on the protected party's incentives, its vagueness on sustainable success conditions and disengagement, and the fatal disconnect between Pillars II (intervention) and III (rebuild) were brutally exposed. The resulting norm erosion (Syria vetoes, RWP) is a direct consequence of Libya revealing these flaws, making Libya a pivotal case demonstrating that R2P, as then understood, lacked the conceptual tools and political mechanisms for managing the complex realities it sought to address. Future guidance must explicitly address the "means mandate trap" and the "protected party hazard" elucidated by Libya.
