prompt: |-
  I've got a slightly odd one and I'm not even sure it's philosophy, so tell me to sod off if it isn't.

  I maintain the knowledge model for an incident-review tool at work. It ingests a pile of maintenance records and then has to answer questions like "did anyone on the ops team know, on 4 March, that the pressure valve was out of spec?" So it keeps track of what various people are on record as knowing, and then answers queries about that. Two things keep happening, and they feel like the same sort of thing pointing in opposite directions, and I need a word for whatever it is.

  Undershooting. The store will happily chain a long run of conditionals — A brings about B, B brings about C, all the way out to K — so long as every step uses the same expression for the same thing. But it comes apart the moment a step requires noticing that two descriptions pick out the same thing. It has that the badge issued at 06:40 on the 4th was used to open the pump room. It has that the badge issued at 06:40 on the 4th was Okonjo's. Ask it "did Okonjo enter the pump room?" and you get *unknown*, not no — as if the question had never been put. There are only three links. It isn't the length. It's the identity in the middle. And it's not a synonyms thing: "the badge issued at 06:40" isn't slang for Okonjo, and the model has both. Nor is it generality — give it "every valve in bay 3 was re-certified on 12 March" plus "this is a valve in bay 3" and it's fine. Strangely, ask "was the pump room opened by anybody?" and it says yes; it's only once Okonjo's name is in the question that it dries up.

  Overshooting, meanwhile, goes the other way. Ask whether any component was run outside spec that week and it comes back confident, because for each component it has no row saying there was a problem, and the absence of a row is being treated as a fact and then generalised over. Nobody told it the records were complete. One of our data people says that's just the closed-world assumption and can be configured off, but that's an answer about how the query engine behaves, and what I want to know about is what the person in the system can be said to know.

  So: is there an established concept for this pair, or for whatever the single thing underneath both is? And are they really one thing? My guess is the interesting bit is that the failures don't line up where you'd expect — it isn't that the model is too slow or too small to derive hard things (it does long derivations fine), it's that it's shut on one axis and wide open on another, and the axis is about re-description rather than effort. But I've not been able to work out whether that's a real distinction or whether I'm inventing one.

  Please don't just hand back a label. I want to know what the thing is, what it isn't, what the nearest few established notions are and precisely how my cases sit against each — including the ones that sound right but aren't — and, for whichever fits best, a case that falls just on the wrong side of the line so I can see the edge. If there genuinely isn't an established concept, say so and coin one, with a definition and a boundary case. A few paragraphs of discussion first, and then the table.

  Table, one row per candidate you canvass (established or invented), columns in this order:

  - `candidate` — the name
  - `home_field` — the area it normally belongs to, one phrase
  - `covers_undershoot` — fits / partly / no, against the identity-link failure above
  - `covers_overshoot` — fits / partly / no, against the no-row-means-fine failure
  - `where_it_misfits` — one sentence: the respect in which it breaks against my cases
  - `verdict` — keep / reshape / drop

  If you end up coining something, give it its own row and use `where_it_misfits` for the nearest thing it could be confused with.
reasoning: |-
  Okay, the user is describing a problem with their knowledge model for an incident-review tool. They're facing two issues: undershooting and overshooting. Undershooting happens when the model fails to connect different descriptions of the same entity (like a badge and its owner), leading to "unknown" answers. Overshooting occurs when the model incorrectly assumes that absence of evidence is evidence of absence, generating false positives.

  The user wants to know if there's an established concept that explains both issues. They suspect it's about "re-description" rather than computational complexity. They also want a detailed analysis comparing possible concepts, not just labels.

  I need to identify philosophical/logical concepts that might explain both phenomena. For undershooting, the core issue seems to be failure of referential transparency - where substituting identical references doesn't preserve truth. The model doesn't recognize that "badge issued at 06:40" and "Okonjo's badge" refer to the same object.

  For overshooting, it's clearly the closed-world assumption (CWA) in action - assuming all relevant facts are known, leading to overconfident conclusions from absence of data. But the user already knows about CWA as a technical setting, so I need to focus on the epistemological aspect.

  The user's deeper concern appears to be about what the system "knows" - an epistemological question. They mention "what the person in the system can be said to know," indicating they're thinking about justification of knowledge claims.

  I'll consider several candidates:
  1. Referential opacity (from logic/philosophy of language) - explains undershooting well but doesn't address overshooting.
  2. Closed-world assumption (from knowledge representation) - directly explains overshooting but doesn't cover undershooting.
  3. Epistemic closure (from epistemology) - relates to knowledge justification under entailment, but is too broad.
  4. Computational epistemology - focuses on implementation limits, which isn't quite right.
  5. Semantic interoperability failure (from information systems) - captures the identity resolution issue but not the completeness assumption.

  Since no single concept fully captures both issues, I'll propose coining "referential-epistemic alignment." This would combine the identity recognition problem (referential) with the justification of knowledge claims (epistemic).

  For the table:
  - Each candidate gets evaluated on how well it covers both undershoot and overshoot cases
  - "Where it misfits" column explains shortcomings
  - "Verdict" suggests whether to keep, reshape or drop each candidate
  - The new concept gets its own row with clear differentiation

  The analysis should emphasize that the core issue is about how knowledge representations handle both identity (when to equate descriptions) and completeness (when absence implies negation) - two distinct but related epistemological challenges in knowledge modeling.
answer: |-
  This is profoundly philosophical—specifically within **epistemology** (theory of knowledge) and **formal knowledge representation**. Your intuition is correct: both failures stem from **how the system handles justification under redescription**, not computational complexity. The core issue is **epistemic brittleness under representational shift**—where knowledge claims break when perspectives change (identity substitution) or when background assumptions about evidence completeness are misapplied.

  ### Key Insights:
  1. **Undershoot (Identity Failure)**  
     The system fails at **referential transparency**: substituting coreferring terms (e.g., "badge issued at 06:40" = "Okonjo's badge") doesn't preserve truth. It treats descriptions as opaque labels rather than pointers to entities. This isn't about synonyms; it's about recognizing **numerical identity** across contexts.  
     *Philosophical root:* Frege's distinction between *sense* (description) and *reference* (entity). The model knows both senses but doesn't infer co-reference.

  2. **Overshoot (Absence-as-Evidence Failure)**  
     The system conflates **lack of evidence** with **evidence of absence**. It assumes a complete knowledge base (closed-world assumption), but this is an unjustified **epistemic closure**—extending "known negatives" beyond what's actually justified by the data.  
     *Philosophical root:* Hume's problem of induction—inferring universal claims ("no component had issues") from incomplete data.

  3. **Unifying Thread**  
     Both involve failures in **inferential justification under representational change**:  
     - *Undershoot*: Justification isn't preserved when redescribing entities.  
     - *Overshoot*: Justification is overextended when redescribing evidence gaps as facts.  
     The axis is **epistemic resilience to representational variance**.

  ### Why Other Concepts Don't Fully Fit:
  - **Computational complexity**: Irrelevant—your system handles long chains but fails at simple identity swaps.  
  - **Synonymy/generality**: Not the issue—the model handles class membership ("valve in bay 3") but not token identity.  
  - **Default logic**: Explains overshoot (CWA *is* a default rule) but ignores the undershoot problem.  
  - **Leibniz's Law**: The principle that identicals are substitutable *salva veritate* (truth-preserving) directly diagnoses undershoot but doesn't address overshoot.  

  ---

  ### Evaluation of Candidates  
  *Sorted by fit, with a coined concept at the end.*

  | candidate                      | home_field                | covers_undershoot | covers_overshoot | where_it_misfits                                                                 | verdict   |
  |--------------------------------|---------------------------|-------------------|------------------|----------------------------------------------------------------------------------|-----------|
  | **Referential Opacity**        | Philosophy of Language    | fits              | no               | Explains why identity substitution breaks queries, but silent on evidence gaps.  | keep      |
  | **Closed-World Assumption**    | Knowledge Representation  | no                | fits             | Directly causes overshoot by treating absence as negation, but unrelated to identity failures. | reshape¹  |
  | **Epistemic Closure**          | Formal Epistemology       | partly²           | partly³          | Overly broad: covers any justification failure under entailment, not specifically redescription. | reshape   |
  | **Semantic Interoperability**  | Information Systems       | fits              | no               | Focuses on integrating disparate descriptions (fixes undershoot) but ignores evidence completeness. | drop      |
  | **Justificatory Fragility** (coined) | Applied Epistemology | fits              | fits             | Might be confused with general uncertainty; specificity comes from *redescription-triggered* failure. | keep      |

  ### Notes:
  1. **Reshape CWA**: As your colleague noted, this is configurable—but epistemologically, it's about *unwarranted completeness*. For your purposes, reframe as **Unjustified Completeness Assumption**.  
  2. **Epistemic Closure partly fits undershoot**: Closure requires knowledge to extend across necessary entailments (like identity), so its failure explains undershoot.  
  3. **Partly fits overshoot**: Overshoot violates closure by "knowing" unsubstantiated negatives (e.g., "no component failed" isn't entailed by incomplete records).  

  ### Coined Concept: **Justificatory Fragility under Redescription (JFR)**  
  - **Definition**: A system exhibits JFR when its knowledge claims cannot withstand changes in how entities or evidence states are described, despite equivalent referential content or identical informational content.  
  - **Boundary Case**:  
    - *Fits*: Your cases (identity swap breaks inference; evidence gap misinterpreted).  
    - *Doesn’t fit*: A genuinely new query requiring undiscovered data (e.g., "Was Okonjo in Prague on 4 March?" when location isn't tracked). This is missing information, not fragility under redescription.  
  - **Why coin it?** No existing term captures the bidirectional failure *specifically triggered by representational variance*. Epistemic closure is about entailment strength; JFR is about **entailment stability across descriptions**.  

  ### Recommended Path:  
  1. **Address undershoot** by implementing **referential transparency checks** (Leibniz’s Law) in inference.  
  2. **Fix overshoot** by distinguishing **negative evidence** (e.g., "explicitly recorded as not faulty") from **lack of evidence** (requires probabilistic or paraconsistent logic).  
  3. **JFR** frames both as facets of epistemic design—ensuring knowledge justifications are invariant under equivalent redescriptions.  

  This isn't just a "bug"; it's a deep issue in how we engineer systems to handle what it means to *know* something when descriptions shift.
