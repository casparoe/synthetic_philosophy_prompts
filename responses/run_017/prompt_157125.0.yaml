prompt: |-
  I'm in a graduate seminar on Wittgenstein's On Certainty, and after class two classmates got into an argument that nobody else in the room could referee. The case they were arguing over: now that cheap, convincing synthetic video is everywhere, is the assumption that video recordings are generally reliable records of what happened — one of what the secondary literature calls hinges — actually in the process of shifting?

  Maya: On Wittgenstein's picture that assumption was never a hypothesis confirmed by evidence. You can't check a recording without relying on other records and on other people's reports, so the demand to verify it is a regress rather than a question, and there is no such thing as answering it. That means the deepfake situation isn't new evidence bearing on a belief; it's a change in what we can do — practices of settling disputes by footage are becoming unworkable. And Wittgenstein allows that what is firm can silt up and move over time, so the honest description is that the hinge may be eroding, with no question of whether that erosion is justified.

  Tom: If being a hinge just means standing outside the game of reasons, then hinge talk can't tell this case apart from the conspiracist who takes it as certain that every official record is fabricated and treats your evidence as part of the fraud. He too reports an unshakeable certainty. Your only comeback is that our community happens to rely on footage — a sociological fact about us, not a reason. So hinge epistemology either collapses into relativism or is conservatism with better vocabulary.

  Maya: That misdescribes what a hinge is. Hinges show up in what people do, not in what they say they're certain of: we find our way by photographs, we settle insurance claims with footage, and a community that declared all recordings unreliable while going on relying on them in practice would have said nothing at all. The conspiracist's certainty is idle in exactly that way — it changes nothing about how he finds out whether his train was cancelled. That is a principled distinction, not head-counting.

  Tom: But "makes no difference in practice" is an ordinary empirical test, and it is doing justificatory work. You are saying, in effect, that reliance on records has worked and still mostly works, and that where it stops working we revise — which is plain evidential reasoning about reliability, available for any proposition. So the view is unstable: either hinges sit outside reasons and you have no criticism of the conspiracist, or they answer to reasons and nothing distinctive remains — it is just the old problem of induction in new words.

  Please adjudicate this move by move: for each of the four contributions, say what is right and what is mistaken, and then say what both of them are missing. I'd especially like to know whether hinge epistemology has any principled way to distinguish a hinge that is genuinely eroding from one a conspiracist merely declares dissolved.
reasoning: |-
  Okay, let me start by unpacking this graduate seminar debate about Wittgenstein's "On Certainty" and hinges. The core issue is whether the reliability of video recordings as a hinge is eroding due to deepfakes, and whether hinge epistemology can distinguish genuine hinge erosion from conspiracist certainty.

  First, I need to parse Maya's opening argument. She claims that the assumption about video reliability isn't empirically verifiable because verification requires circular reliance on other records. Deepfakes don't provide counter-evidence but make practices like evidence-based dispute resolution unworkable. Here she correctly applies Wittgenstein's non-epistemic view of hinges and his concept of riverbed shifts. But she might be underestimating how communal practice responds to new challenges - erosion isn't passive but involves active recalibration.

  Then Tom's rebuttal: he argues that if hinges are beyond justification, hinge epistemology can't differentiate between mainstream reliance on footage and a conspiracist rejecting all records. He sees this as collapsing into relativism or conservatism. While he rightly identifies the relativism risk, he misreads hinges as propositional attitudes rather than embodied practices. His "idle certainty" point actually helps Maya more than he realizes.

  Maya's counter focuses on hinges being manifested in action, not avowals. The difference is functional: our actual investigative and navigational practices incorporate footage, whereas the conspiracist's claim doesn't alter their behavior. This draws a crucial Wittgensteinian line between practical bedrock and verbal posturing. But she hasn't addressed how we determine when a practice has genuinely become "unworkable" rather than temporarily challenged.

  Tom's final salvo insists that assessing practical efficacy is ordinary empirical reasoning, so hinges either become justified beliefs or remain unjustifiable dogma. He forces a false dichotomy here - Wittgenstein's point is precisely that some practical certainties enable empirical inquiry without being its product. The conspiracist comparison fails because their "certainty" doesn't function as a hinge but as an epistemic blockade.

  What both miss: The hinge framework isn't about propositions but about enabling conditions for epistemic practices. The deepfake challenge shows hinges aren't static - their authority derives from sustaining shared forms of life. The principled distinction lies in whether abandoning a certainty would make entire domains of practice incoherent (genuine hinge) versus selectively dismissing evidence (conspiracism). Erosion isn't measured evidentially but through collective inability to maintain vital practices - like determining facts in courts or journalism. Hinge epistemology's anti-sceptical power comes from recognizing that we revise certainties only when forced by the collapse of indispensable activities, not from evidence alone.
answer: |-
  Here's a move-by-move adjudication of the debate, identifying what's right, mistaken, and what's missing in each contribution, followed by a resolution of the core challenge about hinge erosion vs. conspiracist dissolution:

  ---

  ### **Maya's First Move (The Non-Evidential Nature of Hinges & Erosion)**
  - **Right:**  
    1. Correctly identifies hinges as *enabling conditions* for justification (not hypotheses subject to evidence).  
    2. Right that deepfakes challenge *practices* (e.g., using footage to settle disputes), not by disproving a belief but by making reliance on video *pragmatically unstable*.  
    3. Accurately cites Wittgenstein’s view that hinges can "silt up" over time (OC §97, §99) — they are historical and contingent, not timeless.  
  - **Mistaken:**  
    Implies erosion is purely passive ("silt up"). In reality, communities *actively negotiate* hinges (e.g., developing watermarking tech or legal standards for video evidence). Erosion isn’t automatic; it’s resisted through new practices.  
  - **Missing:**  
    A criterion for *when* a hinge has eroded "enough" to cease functioning. Is it when some disputes become unresolvable? When *most* people distrust video? The threshold isn’t specified.

  ---

  ### **Tom's First Move (Relativism/Conservatism Charge)**
  - **Right:**  
    1. Correctly worries that if hinges are immune to reasons, hinge epistemology (HE) cannot critique the conspiracist’s alternative "certainty."  
    2. Validly notes that merely citing *our* reliance on footage seems sociological, not epistemological.  
  - **Mistaken:**  
    1. Equates the conspiracist’s *verbal certainty* ("all records are fake!") with a genuine hinge. For Wittgenstein, hinges are *shown in action*, not in avowals (OC §204, §110).  
    2. Ignores that HE isn’t *just* about propositions but about *what makes inquiry possible*. The conspiracist’s "certainty" doesn’t enable a practice — it destroys it.  
  - **Missing:**  
    That hinges are *world-involving*: they work because they reliably connect us to reality (e.g., video works *because* it usually captures events). The conspiracist severs that connection.

  ---

  ### **Maya's Second Move (Hinges as Manifested in Action)**
  - **Right:**  
    1. Crucially distinguishes *practical reliance* (using photos to navigate, footage for claims) from *idle certainty*. The conspiracist doesn’t *live* their certainty — they still check train schedules (OC §247).  
    2. Correctly notes hinges are *defined by their role in practices*: if a community declared videos unreliable but kept using them, it would be nonsensical (OC §§431-436).  
  - **Mistaken:**  
    Overstates that the conspiracist’s certainty "changes nothing." It *does* change things: it isolates them from shared inquiry and forces epistemic solitude.  
  - **Missing:**  
    How to explain cases where hinges *do* erode (e.g., oracles ceased to function as hinges). A fuller account of *how practices adapt or collapse* is needed.

  ---

  ### **Tom's Second Move (HE’s Instability: Relativism or Induction)**
  - **Right:**  
    1. Rightly presses that "makes no difference in practice" *can* function as an empirical test (e.g., if deepfakes cause systemic trust collapse, we notice).  
    2. Validly asks whether hinges are truly distinct from inductively justified beliefs.  
  - **Mistaken:**  
    1. Assumes "practical efficacy" must be *evidentially assessed*. But for HE, the *breakdown of practices* (e.g., courts rejecting video evidence) isn’t "evidence" — it’s the *dissolution of a framework* for using evidence.  
    2. False dichotomy: hinges aren’t "outside reasons" *or* subject to induction; they are *preconditions* for reasoning (OC §105, §344). We revise them when practices fail, but not via standard justification.  
  - **Missing:**  
    That hinges operate at a different logical level than empirical propositions. Assessing a hinge isn’t like testing a hypothesis — it’s like questioning the rules of chess during a game (OC §§317, 651).

  ---

  ### **What Both Are Missing**
  1. **The Role of Trust:** Hinges like "video is reliable" depend on *social trust* (in institutions, tech, etc.). Deepfakes attack this trust, forcing communities to rebuild it (e.g., via digital provenance) — *not* to abandon the hinge but to *reanchor* it.  
  2. **Gradual vs. Radical Shifts:** Not all challenges erode hinges. Some trigger *parasitic practices* (e.g., "deepfake detection tools" *presuppose* video’s general reliability). Erosion occurs when no repair is possible.  
  3. **Hinges Are Systemic:** No hinge exists in isolation. If video reliability eroded, it would destabilize related hinges (e.g., "eyewitnesses are reliable," "news media are credible"). The conspiracist’s rejection is *localized and arbitrary*; hinge erosion is *systematic and disruptive*.  

  ---

  ### **Resolving the Core Challenge: Genuine Erosion vs. Conspiracist Dissolution**  
  HE *can* distinguish them **principledly** by examining:  
  1. **Practical Entrenchment:**  
     - A genuine hinge (e.g., video reliability) is woven into *countless practices* (law, journalism, personal memories). Its erosion forces *reorganization of life* (e.g., courts needing new evidence standards).  
     - The conspiracist’s "certainty" is *parasitic*: it rejects a hinge *without offering a functional alternative*, making practices impossible (e.g., they can’t consistently investigate anything).  
  2. **Responsiveness to World-Contact:**  
     - Hinges erode when they *repeatedly fail to connect us to reality* (e.g., if deepfakes cause pervasive miscarriages of justice).  
     - The conspiracist’s certainty *ignores counter-possibilities* (e.g., they dismiss *any* video, even those verified by trusted methods).  
  3. **Community Repair Mechanisms:**  
     - Genuine erosion triggers *communal efforts to restore trust* (e.g., blockchain-verified media).  
     - The conspiracist opts out of repair, treating distrust as an unfalsifiable dogma.  

  **Conclusion:** Hinge epistemology avoids relativism by anchoring certainty in *shared, world-sensitive practices*. The deepfake crisis shows hinges are *dynamic* — they erode not from mere counter-evidence, but when practices become *globally unworkable* and *irreparable by communal effort*. The conspiracist, by contrast, inhabits a disconnected, self-insulating language game.
