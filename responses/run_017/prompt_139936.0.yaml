prompt: |-
  You are a professional philosopher who also knows decision theory and has sat in a few government cost-benefit meetings — please think carefully about this one, and before you write anything spend a paragraph or two brainstorming what my particular audience actually cares about and where they'll push. Then give me the prep sheet.

  Context: I retired from forest ecology a few years back (long-rotation silviculture, mostly — the kind of work where you plant something your grandchild might harvest, so discount rates were never an abstraction for us) and since then I've been reading my way into philosophy, probably faster than I should. I've been asked to give the opening talk, 45 minutes plus half an hour of questions, to the long-term infrastructure and climate adaptation committee of a ministry. My thesis is this: there is no defensible positive pure rate of time preference. Discounting a benefit solely because it arrives later is a prejudice, and it has no more standing than discounting a benefit because it arrives somewhere else.

  But I don't want to just assert that, so I've tried to say what I think should replace it. Two moves.

  First: I want to split the thing people lump together. There is one discount on the future that I think is legitimate and is not a moral judgement at all, namely the chance that there will be nobody there to recieve the benefit — an actuarial term, like adjusting a treatment by the chance the patient dies first. I've been calling it the survivorship discount. Everything else that looks like time preference I want to reclassify: extinction and civilisational hazard goes in the first bucket; expected growth in future consumption, and opportunity cost of capital, goes in a second bucket that is empirical, contested, and definitely not something you read off a moral intuition.

  Second: that second bucket has a property people keep missing, and it's the one bit of my own field I'm confident about. If you do not know the future rate but you have a spread of plausible constant rates, then at long horizons the effective rate doesn't stay at the middle of the spread, it sinks toward the bottom of it — the slowest-decaying component carries almost all the weight, same reason the long-lived tail dominates in a mixture of exponentials. I've since found that economists have a version of this argument, but the people in the room won't have internalised it, and I think it's the single most load-bearing thing I have to say. It means a constant exponential is the wrong functional form for anything past a few decades, and my committee cares about a hundred years and a sea wall.

  The audience, as precisely as I can describe it: two Treasury economists who run the standard cost-benefit machinery with a declining schedule and who think market rates of return are the only disciplined input and that anything else is amateur hour; an environmental economist who is broadly on my side but is nervous about imposing real costs on people alive now for hypothetical people later; a finance person from the central bank who will say the real return on capital is what it is and that I'm leaving money on the table; an analytic philosopher who works on population ethics and does not suffer fools; a geotechnical engineer who is on the committee because of a nuclear waste repository and who wants a number to put in a spreadsheet, not a principle; and a climate scientist who is my ally and will ask about tipping points and irreversibility the moment I stop talking.

  What I want from you is the Q&A prep sheet: the eight or so objections I'll actually get from this room, ordered by how much damage they'd do, each phrased the way that particular person would phrase it and in their vocabulary, with a two-minute reply and an honest note on where my reply is soft. Tell me what I should concede up front before anyone asks, which single reply has to land for the whole thing to survive, and which two objections I need a one-line answer for because I'll be running out of clock. Flag anywhere I'm going to sound like a retired biologist wagging his finger at people who know more about this than I do, and tell me how not to.

  And include the question I'm hoping nobody asks. I have a guess what it is — it's the Parfit-style worry that a hundred-year policy changes which people exist, so there may be nobody later who is made better off by what we do and nothing for my cost-benefit comparison to compare. If that's the one, tell me how bad it actually is for me and what I can say in two minutes that isn't hand-waving. If you think something else is worse, say so.
reasoning: |-
  Okay, the user is a retired forest ecologist who's been diving into philosophy and has to present to a government committee on infrastructure and climate adaptation. Their main thesis is that there's no defensible positive pure rate of time preference. They want to split discounting into a survivorship discount (actuarial) and other factors like expected growth and opportunity cost. They also emphasize that with uncertain discount rates, the effective long-term rate trends toward the lower end of the spread. 

  The audience is a mix of Treasury economists, an environmental economist, a finance person, a philosopher, an engineer, and a climate scientist. Each has different priorities and potential objections. The user needs a Q&A prep sheet addressing the top eight objections, ordered by damage potential, with tailored responses and notes on weaknesses. They also want to know what to concede upfront, which reply is critical, and which objections need brief answers due to time constraints. Plus, they need to avoid sounding like an outsider lecturing experts and handle the "Parfit problem" about future people.

  First, I need to assess the audience's concerns. The Treasury economists will push back hard on dismissing market rates, seeing it as undermining their methodology. The environmental economist worries about current costs for future benefits. The finance person will focus on real returns and opportunity costs. The philosopher will demand ethical rigor, especially on non-identity problems. The engineer wants a simple number, not theory. The climate scientist will bring up tipping points. 

  The survivorship discount seems solid, but blending it with other factors might confuse the audience. The Weitzman/Gollier effect (lower effective rates over time) is crucial but technical—needs clear explanation. The Parfit issue is a major philosophical challenge; the user might need to concede some ground but emphasize moral continuity.

  Top objections: The Treasury economists attacking the dismissal of market rates is the most damaging because it challenges the foundation of standard policy analysis. The philosopher's non-identity problem is next, as it questions the ethical basis. The finance person's opportunity cost argument could sway practical-minded members. The engineer's demand for a number needs a practical answer without oversimplifying. The environmental economist's fairness concern requires balancing ethics and pragmatism. The climate scientist's tipping points can be turned into support. The engineer's spreadsheet plea needs a compromise. The philosopher's infinite horizon issue might be too abstract but should be addressed briefly.

  Critical reply: The Weitzman/Gollier point must land to justify long-term low discounting. If this fails, the argument collapses. Concede upfront that market returns matter but shouldn't dominate ethical long-term decisions. For the Parfit problem, admit the comparison issue but stress moral responsibility to future generations.

  One-liners for time: Address the engineer's number request by suggesting a survivorship-adjusted rate and the finance person's opportunity cost with a reminder of catastrophic risks. Avoid jargon and acknowledge experts' perspectives without deferring. The user's strength is real-world forestry experience; use that to ground arguments.
answer: |-
  Here's your Q&A prep sheet, structured for maximum impact with this specific audience. I've prioritized objections by potential damage, framed them in the speaker's likely language, and crafted replies that leverage your strengths while acknowledging soft spots. Key concessions, the critical reply, and timing notes are at the end.

  **Core Concession to Make UPFRONT (Before Q&A):**
  *   **"I acknowledge market rates of return are a crucial *empirical* signal of the *current* opportunity cost of capital under *today's* institutions and expectations. They are essential for short-term allocation. My argument is that they embed assumptions – especially pure time preference and specific growth expectations – that become ethically indefensible and empirically unreliable when projecting costs and benefits over the century-scale horizons this committee faces, particularly for irreversible investments like sea walls or nuclear waste."**
      *   *Why:* Disarms Treasury/Finance immediately, shows respect for their expertise, and frames your critique as about *temporal scope and irreversibility*, not rejecting their tools wholesale.

  **Top 8 Objections (Ordered by Damage Potential):**

  1.  **The Treasury Economist (Dismissal of Rigor):**
      *   **Objection:** "This survivorship discount is clever, but it's just hand-waving. Market-observed returns on safe, long-dated assets *are* the revealed preference of society for trading present for future consumption, incorporating all known risks (including your 'survivorship' concerns implicitly). Your approach throws out the only disciplined, observable anchor we have and replaces it with subjective philosophical judgments. That’s not cost-benefit analysis; it’s wishful thinking for pet projects. We need numbers investors actually demand, not what a philosopher *wishes* they demanded."
      *   **Damage:** Highest. Directly attacks your methodology's legitimacy and alignment with standard government practice. Risks losing the pragmatic members (Engineer, Finance) immediately.
      *   **Reply (2 min):** "Market rates reflect *current* preferences under *current* institutions, heavily influenced by short-termism, liquidity preference, and myopic risk assessments. They are terrible proxies for intergenerational trade-offs over 100+ years for two reasons: First, markets notoriously underprice tail risks (like civilizational collapse) – that's the 'actuarial' survivorship discount they *don't* properly include. Second, market rates embed a significant positive *pure* time preference – the very thing I argue is ethically arbitrary. Would we accept market wages as the 'revealed preference' for a fair minimum wage? No. Similarly, market rates aren't dispositive for intergenerational justice. We need a framework that *explicitly* separates the actuarial risk (which we can model better than markets for ultra-long horizons) from the ethical choice about valuing future lives equally – a choice markets don't, and shouldn't, make for us."
      *   **Soft Spot:** Admits markets are imperfect but still the best *aggregate* signal we have. Requires convincing them ultra-long horizons are fundamentally different. Don't overclaim market irrationality.
      *   **Key Phrase:** "Markets price liquidity and short-term risk, not civilizational survival."

  2.  **The Philosopher (Non-Identity/Parfit Problem):**
      *   **Objection:** "Your entire 'benefit to future people' framework collapses with long time horizons. A sea wall built over 50 years fundamentally alters which specific people exist centuries from now due to countless changed economic and social decisions. We aren't making *those specific future people* better off than *they* would have been (they wouldn't exist otherwise); we're creating a *different*, hopefully better-off, set of people. Standard cost-benefit assumes we can compare welfare states for the *same* population. Here, we can't. Why is creating this *different* future population with the wall 'better'? Isn't this just imposing costs on identifiable people now for the benefit of non-identifiable, merely possible people later?"
      *   **Damage:** Extremely High. Undermines the ethical foundation of comparing present costs to future benefits if the beneficiaries aren't the 'same' people. Your worst fear.
      *   **Reply (2 min):** "You're absolutely right; the non-identity problem is a profound challenge. I concede a straightforward *person-affecting* comparison is impossible here. But I don't think it paralyzes us. We can shift to an *impersonal* perspective: we have a duty to ensure the conditions for *a* flourishing future society exist, whoever is in it. Failing to build the wall creates a future where *whoever exists* suffers catastrophic harm. We can compare *possible futures* – one with a habitable coastline supporting a large, prosperous society, and one without, supporting a far smaller, poorer, or non-existent one. The cost-benefit comparison isn't about specific individuals, but about the aggregate potential for well-being across possible futures. Avoiding the creation of a *catastrophically bad* future state is a moral imperative, even if the inhabitants are different."
      *   **Soft Spot:** Shifting to impersonal welfare is philosophically contested. Doesn't fully resolve the 'duty to possible people' vs. 'cost to real people now' tension. Accept this is the weakest *philosophical* point but argue it's the only practical stance for survival.
      *   **Key Phrase:** "We're choosing between *possible futures*, not benefiting specific future individuals. Avoiding a future devoid of flourishing is the imperative."

  3.  **The Finance Person (Leaving Money on the Table):**
      *   **Objection:** "You're ignoring the real, measurable opportunity cost. Capital invested in a sea wall yielding a *hypothetical* 0.5% social return (after your survivorship adjustment) is capital *not* invested in hospitals, education, or tech R&D yielding verified 4-5% real returns today. By diverting vast sums to ultra-long projects using your near-zero discount rate, you're systematically starving higher-returning investments that would grow the pie for *everyone*, including future generations, much faster. Isn't this just inefficient, even if morally comforting?"
      *   **Damage:** High. Appeals powerfully to efficiency and the tangible needs of the current population. Resonates with Treasury and the Environmental Economist's fairness concern.
      *   **Reply (2 min):** "The opportunity cost argument assumes short-term high returns are *sustainable* and *commensurate* with avoiding existential risk. They aren't. First, market returns exceeding GDP growth long-term are likely unsustainable – they often represent rent extraction or rely on externalized costs (like carbon emissions). Second, and crucially, this is where the Weitzman/Gollier effect kicks in. With *uncertainty* about future growth rates (and thus opportunity costs), the *effective* long-term discount rate isn't the expected 4%; it's pulled sharply down towards the *worst-case* (low growth/no growth) scenarios. Why? Because if growth crashes (e.g., due to unmitigated climate impacts), the marginal utility of future consumption soars. Avoiding that catastrophic low-growth/no-growth future – which the sea wall helps do – dominates the cost-benefit calculus. We're not leaving money on the table; we're preventing the table from collapsing."
      *   **Soft Spot:** Assumes climate mitigation *is* the best way to prevent low-growth futures. Requires the Weitzman/Gollier logic to land (make this concrete!).
      *   **Key Phrase:** "High short-term returns vanish in catastrophic futures. Avoiding collapse dominates the long-term calculus."

  4.  **The Environmental Economist (Fairness/Burden on Present Poor):**
      *   **Objection:** "Ethics aside, the political reality is brutal. Imposing significant costs *now* – through taxes or higher prices – to benefit people 100+ years out, who will likely be vastly richer due to growth, feels unjustifiable when current generations struggle with poverty, healthcare, and education. Isn't your approach, however philosophically pure, asking the poor today to sacrifice for the rich tomorrow? How do you square that with any notion of equity?"
      *   **Damage:** Medium-High. Tugs at moral and political heartstrings, makes your position seem elitist or impractical.
      *   **Reply (2 min):** "This is a vital concern. I agree we cannot ignore current needs. However, we face two injustices: one to the poor today, and one to *all* future people if we bequeath them a broken climate. The solution isn't to abandon long-term investments, but to finance them progressively and pair them with robust social policy *now*. Furthermore, framing future generations as 'richer' is dangerous with tipping points. Unmitigated climate change could *reverse* growth, leaving future people poorer *and* facing existential threats. Our duty isn't to make the future slightly richer; it's to prevent it from being catastrophically poorer and more dangerous. Failing to build resilience *now* guarantees vastly higher costs *later*, costs that will fall hardest on the future poor."
      *   **Soft Spot:** Doesn't eliminate the immediate trade-off. Relies on progressive financing being politically feasible.
      *   **Key Phrase:** "Financing progressively + preventing catastrophic *future* poverty is the equitable path. Inaction passes massive costs to the future poor."

  5.  **The Climate Scientist (Tipping Points & Irreversibility):**
      *   **Objection:** "Your survivorship discount focuses on total loss (extinction), but climate impacts involve critical thresholds and irreversibility long before that point. Think ice sheet collapse, methane clathrate release, AMOC shutdown. Once triggered, these changes are unstoppable for millennia, causing massive, permanent damage *even if civilization survives*. Doesn't this demand an even stronger adjustment than just 'survivorship'? How does your framework explicitly account for the unique value of preventing irreversible losses?"
      *   **Damage:** Medium. An ally, but pushes you to strengthen your framework. Good softball if handled well.
      *   **Reply (1 min):** "You're spot on. Irreversible tipping points fundamentally change the calculus. My survivorship discount captures the risk of *total* loss of value. But irreversible damage represents a massive, *permanent* loss of *potential future welfare streams* even with survivors. This strengthens the case for a very low long-term discount rate derived from the Weitzman/Gollier effect – the risk of triggering these irreversible, catastrophic scenarios dominates the expected value calculation at long horizons. We should treat investments preventing such tipping points as having near-infinite future value relative to their cost. My framework accommodates this by emphasizing that the 'survivorship' probability isn't binary; it's a function of the *quality* of the surviving future state, which irreversible damage severely degrades."
      *   **Soft Spot:** Requires folding irreversible damage into the "survivorship/quality of survival" probability, which is complex.
      *   **Key Phrase:** "Irreversible damage = permanent welfare loss. This *amplifies* the Weitzman effect, pushing the effective discount rate even lower."

  6.  **The Engineer (The Plea for a Number):**
      *   **Objection:** "Look, this is fascinating philosophy, but I design containment structures for 10,000 years. My regulators, my models, my risk assessments need *a number* to plug in. You've torn apart the standard declining schedule. What single number, or simple formula, do I actually use tomorrow for a 100-year sea wall or a 1,000-year repository? 'Survivorship discount plus some uncertain growth thing' isn't computable. Give me something actionable."
      *   **Damage:** Medium. Represents the practical implementation barrier. Frustration could undermine your credibility with pragmatists.
      *   **Reply (1 min):** "You're right to demand practicality. Here's a concrete proposal based on my framework: 1) **Survivorship Discount:** Use the best available integrated assessment models (like those from climate science or existential risk studies) to estimate the annual probability of civilizational collapse or loss of relevant capacity over your horizon. Express this as a *deduction* from the discount rate. (e.g., If annual collapse risk = 0.1%, deduct 0.1%). 2) **Growth/Utility Component:** Acknowledge deep uncertainty. Use the Weitzman/Gollier logic: *don't* pick one growth rate. Use a *declining certainty-equivalent discount rate schedule*. Start near a short-term social opportunity cost (say 3%) for the first 30-50 years, then have it decline significantly towards 1% or lower for 100+ years, reflecting the dominance of low-probability, high-impact bad scenarios. Treasury has methodologies for this declining schedule; the key is accepting the *principle* that it must decline substantially due to uncertainty."
      *   **Soft Spot:** Still complex. "Best available models" are contentious. Requires Treasury buy-in for the schedule.
      *   **Key Phrase:** "Deduct actuarial collapse risk + Use a declining schedule reflecting deep uncertainty (Weitzman effect). Treasury can operationalize this."

  7.  **The Philosopher (Infinite Regress / Zero Rate Issues):**
      *   **Objection:** "If we accept a zero pure time preference for ethical reasons, and if we believe humanity has even a small chance of persisting for millennia or longer, doesn't this imply that any cost, however large, imposed now is justified if it prevents even a tiny probability of *infinite* future loss (extinction)? This seems paralyzing or leads to absurd demands on current resources. How do you avoid this 'Pascal's Wager' problem?"
      *   **Damage:** Medium-Low (in this room). Very academic, but could confuse or seem absurd to non-philosophers.
      *   **Reply (1 min - Be Brief):** "A valid concern in pure theory. In practical policy for this committee: 1) We focus on *finite*, albeit very long, time horizons relevant to our assets (100-10,000 yrs). 2) The survivorship discount inherently reduces the weight of the *far* future – if survival probability decays, the potential infinite loss has finite expected value. 3) We prioritize preventing *credible, near-term* catastrophic risks with irreversible consequences (like passing climate tipping points in the next 50-100 years), which dominate the calculus without requiring infinite time horizons. We aren't valuing the heat death of the universe; we're valuing the continuity of civilization on policy-relevant timescales."
      *   **Soft Spot:** Doesn't fully resolve the theoretical infinite horizon problem. Keep it focused on finite policy horizons.

  8.  **The Treasury Economist (Predictability & Policy Consistency):**
      *   **Objection:** "Even if we accept your uncertainty argument (Weitzman), using a near-zero long-term rate creates perverse incentives. Every project promoter will claim *their* pet project avoids some catastrophic tail risk to justify massive spending. Market rates provide a consistent, predictable benchmark. Your approach seems like a recipe for subjectivism and fiscal irresponsibility. How do you maintain discipline?"
      *   **Damage:** Low-Medium. A pragmatic concern about process, but less foundational than Objection 1.
      *   **Reply (1 min):** "Discipline comes from rigor in the *inputs*, not clinging to an inappropriate benchmark. The 'survivorship discount' must be based on transparent, peer-reviewed models of existential/civilizational risk (e.g., climate IAMs, nuclear winter models). The declining long-term rate due to uncertainty should follow a standard methodology (like the US EPA's or UK HMT's approaches for very long-term projects) based on agreed-upon uncertainty distributions for growth. This *is* more complex than a single rate, but complexity is inherent in the reality of century-scale risks. The alternative – using a rate demonstrably inappropriate for the horizon – is the *real* lack of discipline, giving a false sense of precision that biases against essential long-term investments."
      *   **Soft Spot:** Admits complexity. Requires building institutional capacity for risk modeling.

  **The Question You Hope Nobody Asks (But Might - The Parfit Problem):**
  *   Covered as Objection #2. It *is* bad. It fundamentally challenges the comparability basis of standard CBA for long horizons. Your reply (shifting to valuing *possible future states of the world*) is the best practical defense but remains philosophically contested. **Concede its difficulty upfront** when answering ("This is a profound challenge..."), then pivot firmly to the moral imperative of preventing catastrophic futures and defining the duty in terms of ensuring conditions for *a* flourishing future society. Emphasize that *inaction* also creates a different (worse) future population.

  **Critical Reply That MUST Land:**
  *   **The Weitzman/Gollier Effect Reply (to Objection #3 - Finance Person).** If they don't buy that *uncertainty* about growth/returns pulls the effective long-term discount rate sharply *downwards*, your entire argument for near-zero rates in the "second bucket" collapses. **Make this concrete:** "Imagine two futures: one with 3% growth (discount at 3%), one with collapse (-5% 'growth'). If each has 50% probability, the *average* rate isn't -1%! The value today of $1 in the bad future is huge because marginal utility is sky-high. The *effective* rate governing the value of $1 in 100 years is dominated by the bad scenario, pushing it close to *zero* or negative. Ignoring this tail risk is the real 'amateur hour' for century projects."

  **One-Line Answers for Running Out of Clock:**
  1.  **To the Engineer (Objection #6):** "Use: (1) Best-available collapse risk deduction (e.g., 0.1%) + (2) A *declining* long-term schedule mandated by Treasury (e.g., 3% @ 30yrs -> 1% @ 100yrs) reflecting deep uncertainty. Actionable tomorrow." (Point to Treasury)
  2.  **To the Finance Person (Objection #3):** "Ignoring catastrophic tail risks *is* leaving money on the table – the future's entire table. Weitzman shows high returns vanish in collapse; avoiding collapse dominates long-term value."

  **Avoiding the "Wagging Finger" Trap:**
  *   **Acknowledge Expertise:** "I respect the rigor Treasury brings...", "The market signals Finance highlights are crucial for...", "The Engineer's need for a number is absolutely valid...".
  *   **Leverage Your Strength:** Frame your forestry experience as *lived proof* of the failure of standard discounting: "In forestry, we *saw* high discount rates destroy sustainable multi-generational plans. That's not theory; it's decades of observation." Connect survivorship discount to ecological risk assessment.
  *   **Focus on Shared Goal:** "We all want robust decisions for the long-term resilience of our infrastructure and society... My framework aims to make our tools *match* the unprecedented timescales and risks we face."
  *   **Use *Their* Language Sparingly:** "Opportunity cost," "tail risk," "revealed preference," "certainty-equivalent," "marginal utility." But explain clearly when needed.
  *   **Don't Preach Ethics Alone:** Always tie ethics back to *empirical consequences* (catastrophe, collapse, irreversibility) and *analytical necessity* (Weitzman effect, non-constant discounting under uncertainty).

  **Final Prep Tip:** Practice delivering the Weitzman/Gollier explanation (Reply #3) and the Non-Identity reply (Reply #2) concisely and compellingly. They are your linchpins. Good luck! Your perspective is vital.
