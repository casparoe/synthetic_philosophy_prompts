prompt: |-
  So there's a woman on my team, Priya, who runs our platform design reviews and has this habit of labeling things "Moloch" — you know, the god-of-races-to-the-bottom thing people online are always quoting. She's oddly consistent about which situations get the label and which don't, and I've started keeping a list because I want to steal the concept for an internal doc I'm writing about why our org keeps making itself miserable. Problem is I can't figure out what her actual rule is.

  Her verdicts so far:

  - Teams padding their project estimates because promo packets compare relative scope across teams: "Moloch."
  - Two teams each building their own version of the same internal library, because each is measured on its own feature throughput and neither gets credit for shared work: "Moloch."
  - Everyone dumping pages into the shared on-call queue instead of fixing root causes: "not Moloch, that's a commons thing, just give the queue an owner."
  - Weekly status reports nobody reads, which survived for a year because one director liked them: "not Moloch, one person could kill that with a Slack message."
  - The industry-wide thing where every company makes candidates do longer and longer take-homes: "Moloch."
  - One team quietly stopped writing the weekly report and nothing bad happened to them: she retroactively ruled "so that one was never Moloch."
  - Two teams negotiating directly over the same headcount slot at planning time: "not Moloch, there's two of them, they can just talk."
  - Teams competing to rewrite the same service, which burned a lot of time but ended with a genuinely better service that everyone now uses: "not Moloch. Wasteful, but something good came out the other end."

  Here's the one I need a ruling on. Next quarter's GPU budget is allocated to each team in proportion to how much compute that team actually burned this quarter, and the org's total spend is capped anyway. So everyone is now running pointless jobs to keep their number up, everyone knows everyone is doing it, and everyone hates it. There is a platform group that could change the formula, but they've said they won't touch it mid-year.

  Is that Moloch by Priya's lights? The way I see it her verdicts fit at least two or three different rules at once — something like "each team is better off gaming it no matter what the others do, and everyone ends up worse off," versus "no single team can stop without getting punished," versus "there's no one person who could just fix it," versus "it's a race, not a shared resource" — and I have a feeling those come apart on the compute case but I can't see exactly where.

  So: which rule do you think she's actually running, what does it say about the GPU thing, and what additional case should I ask her about to be sure? Please just commit to one rule and argue for it instead of laying out the options and leaving me to choose, and tell me honestly which of her verdicts your rule can't accommodate, if there are any. American English please.
reasoning: |-
  Hmm, the user is trying to figure out Priya's rule for labeling situations as "Moloch" or not. They've provided several examples and now want to apply it to a new situation about GPU budget allocation. The user is frustrated because they can't pin down the exact rule Priya uses, and they suspect multiple interpretations might fit but conflict in this GPU case.

  Looking at Priya's verdicts, there's a pattern. She calls something "Moloch" when it's a situation where:
  - Individual rational actions lead to collective harm
  - Players are trapped in the system with no easy exit
  - Structural incentives force bad behavior
  - The problem can't be fixed by any single actor

  The GPU case seems to fit all these: teams are forced to run pointless jobs to maintain budget share, everyone hates it, and no one team can stop without losing out. The platform group could fix it but refuses to act mid-year, making it a systemic issue rather than just a commons problem.

  The key distinction seems to be whether the problem requires coordinated action to escape. In "commons" cases like the on-call queue, a single owner could solve it. But in true Moloch scenarios, everyone is locked in by the system's rules.

  For the GPU case, Priya would likely say "Moloch" because:
  - Teams are incentivized to waste resources individually
  - No one can unilaterally defect without penalty
  - The solution requires changing systemic rules (which the platform group controls)
  - It creates collective harm (wasted compute, frustration)

  The only verdict that might challenge this rule is the "industry-wide take-homes" example, but even that fits as it's a market-level coordination failure. The rule holds up well against Priya's other judgments.

  To test this, the user should ask Priya about a scenario where individual incentives align with collective good but the system still fails due to misaligned metrics. That would probe whether her concept requires actual harm or just perverse incentives.
answer: |-
  Based on Priya's verdicts, her "Moloch" rule isn't about races-to-the-bottom *generally*, nor just about shared resource problems (commons), nor about mere waste. **Her core rule is this:**

  > **"Moloch" applies when a system forces participants into individually rational actions that are collectively self-destructive, *and* no single actor or small group can unilaterally defect from the harmful behavior or change the rules without being punished or ignored.**

  **This rule explains *all* her verdicts:**

  1.  **Padded Estimates:** Teams *must* pad estimates to look competitive (individually rational, collectively wasteful). No single team can stop without looking worse (can't defect unilaterally without punishment). **Moloch.**
  2.  **Duplicated Libraries:** Each team *must* build their own to hit their own metrics (individually rational). Neither can stop/collaborate without losing credit (can't defect). **Moloch.**
  3.  **On-Call Dumping:** Individuals *could* fix root causes instead of paging (can defect individually). The *system* just needs an owner to change incentives (small group fixable). **Not Moloch (commons, fixable).**
  4.  **Useless Status Reports:** One director *could* kill it with a Slack message (single actor can defect/challenge the rule). No *system* forces everyone to keep writing it if one stops. **Not Moloch (easily stoppable).**
  5.  **Long Take-Homes:** Each company *must* demand more to filter candidates "better" (individually rational for hiring). No single company can stop without risking worse hires (can't defect). **Moloch.**
  6.  **Stopped Report (Retro):** Proved one team *could* stop without punishment (defection possible, no systemic punishment). **Never Moloch.**
  7.  **Headcount Negotiation:** Two teams *can* just talk and decide (small group *can* cooperate/defect from conflict easily). No systemic trap forces them to fight. **Not Moloch.**
  8.  **Wasteful Rewrites:** Waste happened, but *something good emerged*, and crucially, teams *could* choose to compete or not (no systemic *trap* forcing the waste). It wasn't individually rational *solely* due to harmful incentives; competition had a potential upside that materialized. **Not Moloch (wasteful competition ≠ trapped Moloch).**

  **The GPU Budget Case:**

  *   **Individually Rational?** YES. Each team *must* run pointless jobs to maintain/grow their budget share next quarter. If they stop, they lose compute resources relative to others.
  *   **Collectively Self-Destructive?** YES. Wasted compute, wasted engineering time, universal hatred, no value created.
  *   **Can a Single Team/Small Group Unilaterally Defect Without Punishment?** **NO.**
      *   If one team stops padding, they get a smaller budget next quarter, harming their own projects.
      *   Two teams agreeing to stop would *both* lose out relative to teams still padding.
      *   The platform group *could* fix the rules (change the allocation formula) but refuses to do so mid-year ("won't touch it"). They are *enforcing* the harmful rule structure.

  **Therefore, by Priya's rule: The GPU budget situation is DEFINITELY "Moloch."**

  **Why it fits perfectly:**
  Teams are trapped by the incentive structure. Playing the game (running pointless jobs) is the only rational choice per team, but it makes everyone worse off. No participant (individual team, small group of teams, or even the platform group within the current timeframe) can break the cycle without harming themselves or being prevented from acting (platform group's refusal). The harmful outcome is an *inevitable* result of the system's rules.

  **Honest Assessment of the Rule:**
  This rule cleanly explains *all* of Priya's verdicts provided. The only one that might *seem* slightly strained is the "Wasteful Rewrites" case, but her reasoning ("something good came out the other end") and the lack of a *systemic trap forcing the waste* (teams had agency and the competition had a potential positive outcome) clearly differentiate it from a true Moloch trap under this rule. The rule emphasizes the *inescapable trap* aspect more than just the presence of waste or competition.

  **Case to Ask Priya to Confirm:**
  To absolutely confirm this rule, ask her about this scenario:
  > "Teams are measured purely on lines-of-code (LOC) committed. Everyone knows feature complexity doesn't correlate with LOC, and writing verbose, inefficient code is bad. Teams start deliberately writing bloated code to hit targets because:
  >   a) If one team writes clean code, they miss targets and look bad.
  >   b) The VP refuses to change the metric, saying 'LOC is easy to measure'."

  **Prediction:** She'll call this "Moloch." It perfectly fits the trap: individually rational (bloat code), collectively destructive (bad codebase), no one can defect (clean coders get punished), rules can't be changed unilaterally (VP enforces bad metric). If she says "Moloch," it solidifies the rule. If she doesn't, it reveals an additional nuance (maybe requiring a "race" dynamic, though the GPU case has one). But based on the evidence, she *will* call it Moloch.
