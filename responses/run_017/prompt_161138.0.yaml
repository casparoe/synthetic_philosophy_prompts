prompt: |-
  I'm a science-and-ideas reporter and I've agreed to do a 40-minute brown-bag for my own newsroom next week — reporters and editors who run an LLM every day for finding sources, summarizing documents and drafting, but who mostly think of it as fancy autocomplete. The piece I'm reporting is about how you supervise a system whose work you can't fully check: grading the outcome versus grading the process. I don't want the explanation itself, I want the plan for it. What has to land before "process supervision" is even intelligible as an idea — my guess is that the prerequisite is that on most real tasks the outcome is expensive or slow to check (a fact-check that only gets contradicted three weeks later, a summary nobody can verify without reading the whole archive), so tell me if that's the wrong thing to put first. Which single case should carry the whole thing: I'm thinking an AI fact-checking a claim for us, where the outcome is whether the verdict is right and the process is which documents it actually opened, whether it noticed the top hit was a press release, whether it revised when it hit contradicting evidence — tell me if that case has something in it it shouldn't. Which misconceptions will they form (I'm guessing "process supervision just means checking that each step is true" and "if the answer's right the process doesn't matter", plus sooner or later "so who grades the grader"), and exactly where in the sequence to kill each one. Also: one twist I want handled, not dodged. The vendors keep telling me coming models will do their thinking in something other than English, so there may be nothing readable to grade; I've started calling the fallback grading the audit trail instead of the reasoning — which files it opened, which tool calls it made, what it recorded — and I want to know where in the sequence that goes and whether it's honestly process supervision or just outcome supervision with extra paperwork. What should I openly refuse to explain at this level, and give me one question to end on that tells me they've got the distinction rather than just being newly worried.
reasoning: |-
  Okay, the user is a science-and-ideas reporter preparing a 40-minute brown-bag session for colleagues who use LLMs daily but see them as fancy autocomplete. They need a plan to introduce "process supervision" versus outcome supervision. Let me unpack their core needs.

  First, the key challenge: explaining how to supervise systems whose outputs can't be fully verified. The user suspects they must first establish that outcome verification is often expensive or delayed. That feels right - it's the fundamental why behind needing process supervision. Without this pain point, the concept won't resonate.

  The proposed fact-checking case study is strong because:
  - Newsrooms intuitively grasp the stakes (accuracy vs speed)
  - Demonstrates multiple failure modes (surface-level scanning, missing bias)
  - Shows process as observable actions (documents opened, source scrutiny)
  - Mirrors journalistic workflows they already understand

  Major misconceptions to preempt:
  1. "Process checking just means verifying each step's truth" → No, it's about validity of reasoning patterns
  2. "Correct outcome implies correct process" → Counter with plausible but flawed paths
  3. "Who supervises the supervisor?" → Acknowledge but bracket as separate issue

  The "audit trail vs reasoning" twist is crucial. Need to position audit trails (file access, tool calls) as process proxies when reasoning isn't transparent. Clarify this is still process supervision because it evaluates decision-making artifacts, not just final output.

  What to avoid: 
  - Technical LLM architecture details 
  - Mathematical formulations 
  - Vendor implementation specifics

  End with a diagnostic question testing conceptual grasp: "Your LLM writes a perfect backgrounder using only legit sources - why might you still want its search history?" 

  Timing allocation seems realistic: 
  - 15min establishing the verification problem 
  - 15min deep-dive on fact-checking case 
  - 5min misconceptions & audit trail adaptation 
  - 5min Q&A with framing question

  The structure creates necessary frustration with outcome-only evaluation before offering process supervision as the solution. Keeping vendors' opaque future models as a forward-looking footnote maintains focus.
answer: |-
  Here's a battle-tested plan for your 40-minute session, designed for time-pressed journalists. Focus on conceptual hooks, not technical depth.

  **Core Objective:** Make "process supervision" feel like an *operational necessity*, not an academic concept.

  ---

  ### 1. **The Hook: Why Outcome-Only Supervision Fails (10 min)**
     - **Lead with THEIR pain:** "You run an LLM for fact-checking/summarizing/drafting. How do you *know* it didn’t miss a key document, hallucinate a connection, or trust a PR piece? You often *can’t* — until it blows up later."
     - **Anchor in their reality:**  
       - Fact-checking: Verdict seems solid, but 3 weeks later a source contradicts it. *Outcome check failed.*  
       - Summary: No obvious errors, but buried nuance changes the story. Verifying requires re-reading everything (*expensive*).  
       - Drafting: Smooth prose cites non-existent study. You spot it? Great. You miss it? Retraction.
     - **Land the Prerequisite:** **"Outcome supervision fails when verification is slow, expensive, or impossible in practice."** *(You were right – this MUST come first.)*

  ### 2. **The Core Case: AI Fact-Checking (15 min)**
     - **Use YOUR example (it's perfect):** "LLM fact-checks claim: 'Company X dumped toxic waste in River Y in 2023'."  
       - **Outcome Supervision:** Verdict = "True" or "False". *But how do you trust it?*  
       - **Process Supervision:** *Trace the steps:*  
         - Did it open the EPA 2023 report? (Or just a 2022 summary?)  
         - Did it notice the top hit was a Company X press release?  
         - Did it see conflicting local news reports and *revise its confidence*?  
         - Did it check regulatory databases or just news archives?  
     - **Why this case works:**  
       - High-stakes, familiar to journalists.  
       - Clearly separates outcome (verdict) from process (steps taken).  
       - Shows *how* a correct outcome can mask a flawed process (e.g., luck).  
       - Illustrates *actionable* process checks (documents accessed, source bias flagged, revision logic).  
       - **NO significant pitfalls.** It’s a winner.

  ### 3. **Killing Misconceptions (8 min)**
     - **MISCONCEPTION 1:** *"Process supervision = fact-checking every step."*  
       **Kill it HERE:** "No. We can't check *every* atomic fact. We check the *validity of the reasoning pattern*: Did it use diverse sources? Did it flag low-confidence evidence? Did it update when new data conflicted?"  
       *Place:* Right after explaining the fact-checking process steps.  
     - **MISCONCEPTION 2:** *"If the answer's right, the process doesn't matter."*  
       **Kill it NOW:** "Dangerous! Imagine the LLM got the verdict right because it found *one* legit source buried under PR fluff. Next time? It might miss. Process flaws create *systemic risk*." Show a quick hypothetical where a flawed process gets lucky.  
       *Place:* Immediately after contrasting outcome vs. process in the case study.  
     - **MISCONCEPTION 3:** *"So who grades the grader?"*  
       **Acknowledge but DEFLECT:** "Critical question! But *today* we focus on *why* we need process checks. Grading the grader is layer 2 – auditing, human review, better tools. First, we need to *want* the audit trail."  
       *Place:* During Q&A or if raised. Don't let it derail the core concept.

  ### 4. **Handling the "Opaque Future" Twist (4 min)**
     - **Introduce it HERE:** "Vendors say future models won't 'think in English'. So what then? We shift to **Audit Trail Supervision**."  
       - Logs: Files accessed, tool calls run (e.g., "searched EPA database Q3-2023"), timestamps, confidence scores recorded.  
     - **Is it Process Supervision? YES.**  
       - "It's *still* judging the *method*, not just the final answer. Did it query the *right* database? Did it run a bias-detection tool? Did it retry a failed search? This *is* process evidence – just not 'reasoning' text."  
     - **Contrast:** Outcome Supervision = "Waste dumped? True." Audit Trail Supervision = "Checked EPA 2023 data (clean), ignored local news API (error), cited Company PR (no bias flag)."  
     - **Place:** After establishing *why* process matters, but before misconceptions. Frame audit trails as the *fallback* for opaque models.

  ### 5. **What to REFUSE to Explain (Openly)**
     - **"We won't dive into:**  
       1. The math of how LLMs generate tokens.  
       2. Specific model architectures (Transformers, MoE, etc.).  
       3. How vendors *implement* audit trails technically.  
       **Today is about the *why* and the *what* of supervision, not the technical *how* under the hood."**

  ### 6. **The Closing Question (Diagnostic Tool)**
     - **Pose this:** *"Your LLM drafts a flawless 500-word backgrounder on a complex policy debate, citing only legitimate sources. Using process supervision, what evidence would you need to feel confident it *wasn't* just dangerously lucky?"*  
       - **Listen for:** Requests for search queries, source diversity metrics, revision history, time spent on key sections, bias checks run – **not** just "the outcome is perfect."  
       - **Avoids:** Generic anxiety ("It could be wrong!"). You want evidence they grasp the *type* of checks needed.

  ---

  **Timing Buffer:** Practice hitting these marks. Leave 3 min for intro/context.  
  **Why this works:** Starts with their pain, uses a resonant case, preempts their likely thoughts, handles the twist honestly, and ends with a practical test. They'll leave understanding *why* process matters, even if "how" remains fuzzy.
