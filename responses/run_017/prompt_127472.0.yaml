prompt: |-
  I sit on the Committee on Educational Policy at my college, and in three weeks we have to send a recommendation to the faculty senate about a degree requirement that nobody currently on the committee can justify. The rule dates from a 1973 curricular overhaul: every student must take two courses outside their own academic division, and—this is the part that always trips people up—both of those courses must be in the same department, so a student can't satisfy breadth with four unrelated one-off electives. The registrar's file contains a single paragraph from 1973 saying that breadth without sequence is tourism, and nothing else. The committee reauthorizes the rule every five years, mostly by not thinking about it, and our assessment office confirms it has no outcome data in either direction. This time the politics are sharper: two colleagues want it struck as unnecessary friction on transfer students and double majors; the chairs of Classics and Geology have each written me long, careful, oddly emotional letters defending it without quite saying what it does; a colleague in political theory argued at our last meeting that removing it would change something about the college that no mission statement captures; and two members have privately pointed out that the small departments enroll a noticeable share of their seats through it, which is true, which is the most powerful explanation anyone has offered, and which nobody will say out loud in open session because it sounds like defending a requirement for budgetary reasons.

  I've been reading around in Burkean conservatism and in the Chestertonian version of the same instinct—the one about not tearing down a fence until you know why it was put up—and I don't want the memo to be a piece of applied Burke, but I do want it to take the underlying problem seriously: that an inherited practice can carry information no individual reasoner has, that the demand to state a rule's purpose may be unmeetable even when the rule is doing real work, and that the people who benefit from a rule are often the least able to articulate what it's for. To make this tractable I've sketched a rough taxonomy that I'd like you to use or to replace: load-bearing (still doing the original job), converted (original rationale dead but now serving some unacknowledged function), vestigial (pure cost), and expressive (its value isn't causal at all—it's part of what the institution means, and repealing it changes the self-description rather than the outcomes). I've also sketched two tests I think matter more than the standard question "do we know what it's for?": a reversibility-and-legibility test, on the view that the Burkean presumption should weaken sharply when a repeal is cheap to reverse and when we have some mechanism for noticing what we lost before the loss becomes permanent; and a counterfactual-replacement test, on the view that the real choice is almost never rule-versus-no-rule but rule-versus-whatever the senate will invent to fill the vacuum—in this case almost certainly a mandatory interdisciplinary capstone that would be far more burdensome than what we have. What I need is the memo itself: a bottom line at the top, choosing among retaining the rule unchanged, repealing it, sunsetting it in two years pending a study, suspending it for one entering cohort with a pre-registered plan for observing the effects, or converting it—naming the function we actually think it serves and forcing an open vote on that function. It should give reasons my colleagues can reply to rather than reasons that merely win, and it should give the losing side its best day in court: I take the strongest anti-Burkean point here to be that the fence principle is nearly free to invoke, unfalsifiable in practice, and ratchets toward inertia, since any rule whatsoever can be defended by gesturing at purposes nobody has discovered yet. I'd also like a short appendix saying how the memo thinks we should handle the enrollment hypothesis—including whether the honest move is to route this to a body that can weigh money out loud.

  Aim for roughly 900 to 1,100 words, with headings and a one-paragraph summary I can read aloud at the start of the meeting. One more thing, which matters to me more than the recommendation: as you write, separate what is settled from what is genuinely contested among people who know this material—for instance, whether the Burkean presumption in favour of inherited arrangements is best read as an epistemic claim about distributed experience or merely as a precautionary rule under uncertainty, and whether Chesterton's principle is really a demand for understanding or a demand for standing—and don't let the memo quietly present the contested reading as the consensus one. Mark explicitly every empirical claim that our actual record doesn't support, including any claim about what the rule is currently doing. Give me a calibrated confidence on the bottom line and say what specific piece of evidence would move you off it, and close with the strongest argument against your own recommendation, stated as strongly as you can state it.
reasoning: |-
  Okay, the user is on an educational policy committee and needs to draft a memo about a longstanding degree requirement. This rule mandates that students take two sequenced courses outside their division in the same department. The committee lacks justification data, but there are strong opinions on all sides - from departments benefiting from enrollment to colleagues worried about losing something intangible. 

  The user has clearly done deep thinking here. They've engaged with Burkean conservatism (the fence metaphor) and developed sophisticated frameworks: that taxonomy of rule functions (load-bearing, converted, vestigial, expressive) and those two novel tests (reversibility-legibility and counterfactual-replacement). This isn't just procedural - they're wrestling with how institutions preserve wisdom beyond individual understanding. 

  What's striking is their awareness of tensions: the enrollment factor nobody will name aloud, the colleague's point about mission statements failing to capture something essential, the valid concern that Burkean arguments could become unfalsifiable inertia. They want the memo to treat all positions seriously while maintaining intellectual honesty about uncertainties.

  The real challenge is balancing multiple dimensions:
  - Epistemic (what CAN we know about this rule's effects?)
  - Practical (impact on transfer students/double majors)
  - Political (departmental enrollments vs. avoiding "budgetary reasons" arguments)
  - Philosophical (what does preserving vs removing signal about the institution?)

  I notice they're particularly concerned about intellectual integrity - hence those specific requests to mark contested assumptions, identify unsupported claims, and include strong counterarguments. This suggests the memo will be scrutinized by thoughtful critics. 

  The taxonomy seems useful but needs refinement. "Expressive" might be conflating two things: the rule as institutional identity marker vs its role in creating cross-disciplinary communities. And "vestigial" assumes we'd see costs without benefits - but what if costs are visible while benefits are harder to measure?

  Their proposed tests are brilliant. The reversibility point is pragmatic (sunsetting as "undo button"), while the counterfactual insight is crucial - removal might trigger a worse replacement. But both tests require predicting human behavior: Will we really monitor effects? Would the senate actually create that burdensome capstone?

  On the enrollment question: They're right that this can't be ignored, but naming it risks reducing the debate to budgets. Maybe the memo can acknowledge it while elevating other framings? Though their suggestion of routing to a budget committee is ethically sound.

  For structure, I'm thinking:
  1) Summary that surfaces the core tension (preserving vs removing unseen value)
  2) Analysis using their frameworks but with clear caveats
  3) Recommendation with explicit confidence level
  4) Appendix handling enrollment transparently

  The recommendation should probably be "sunset with study" - it respects Burkean concerns while answering the anti-inertia critics. But confidence must be medium-low since we're dealing with unknowns. Key evidence that would change this? If departments could demonstrate educational (not just budgetary) value from sequenced enrollments.

  Biggest risk is the memo feeling too theoretical. Must anchor in concrete stakes: transfer student burdens, small department viability, etc. And always loop back to student experience - that's the ultimate measure.
answer: |-
  ## MEMORANDUM  
  To: Committee on Educational Policy  
  From: [Your Name/Chair]  
  Date: October 26, 2023  
  Subject: Recommendation on the "Sequenced External Breadth" Requirement (1973 Rule)  
  CC: Faculty Senate Steering Committee  

  ---

  ### EXECUTIVE SUMMARY (For Reading Aloud)  
  After thorough review, the Committee recommends **suspending the current sequenced breadth requirement for the Fall 2025 entering cohort, coupled with a pre-registered, multi-year study plan to rigorously assess impacts on student pathways, departmental enrollments, and perceived educational value**. This approach balances legitimate concerns about unjustified administrative friction with the serious possibility that the rule serves latent functions—whether pedagogical, communal, or structural—that are poorly understood but potentially valuable. Suspension, unlike immediate repeal, creates a reversible experiment. The study plan, developed collaboratively and announced in advance, will provide actionable data before permanent action is taken, while mitigating the risk of the requirement being replaced by a more burdensome alternative during this period. Confidence in this recommendation is **Medium (6/10)**; it would rise significantly if proponents could identify specific, measurable educational harms likely from suspension.

  ---

  ### ANALYSIS & RECOMMENDATION  

  #### I. The Core Dilemma: Known Costs vs. Uncertain Value  
  The requirement imposes **documented costs**: complexity for transfer students and double majors, potential delays in degree completion, and constrained elective choices. These are tangible burdens, particularly for non-traditional pathways. Conversely, its **value remains opaque**. The original 1973 rationale ("breadth without sequence is tourism") is a provocative metaphor, not an operationalized educational theory. Decades of assessment show no measurable positive *or* negative impact on conventional outcomes (graduation rates, GPA, post-grad success), leaving us in an evidential void.  

  The passionate, yet empirically vague, defenses (e.g., preserving an intangible "something" about the college, fostering deeper engagement) highlight the Burkean/Chestertonian challenge: **The rule may encode distributed institutional wisdom or serve latent functions that resist easy articulation.** Dismissing these concerns risks discarding valuable, organically evolved practice. However, upholding a rule based solely on inarticulable sentiment or budgetary reliance is unsustainable and potentially unjust.  

  #### II. Applying the Framework: What *Might* the Rule Be Doing?  
  Using the proposed taxonomy, we assess the rule's potential functions *without asserting certainty where none exists*:  

  *   **Load-Bearing (Original Purpose)?** *Unlikely Settled / Contested Claim.* The "anti-tourism" goal lacks modern pedagogical support for *requiring* same-department sequencing. Deep disciplinary immersion is one valid approach to breadth, but not the only one recognized today. *(Empirical Gap: No data links this specific requirement to deeper interdisciplinary understanding compared to alternatives.)*  
  *   **Converted (New Latent Function)?** *Plausible but Unverified.* The rule likely functions as a **structural support for smaller departments and interdisciplinary programs** by ensuring a baseline of enrollments in upper-level or niche courses. This explains the "oddly emotional" defenses from Classics and Geology chairs better than purely pedagogical arguments. *(Empirical Gap: While enrollment data suggests this effect, we lack proof it's the *primary* or *necessary* function, or that the educational experience delivered is qualitatively distinct.)*  
  *   **Vestigial (Pure Cost)?** *Possible but Unlikely.* The documented costs are real, but the persistence of strong, if inarticulate, defenses suggests it's not *merely* vestigial.  
  *   **Expressive (Institutional Meaning)?** *Genuinely Contested.* Is the rule a core, identity-forming element ("This college believes in *deep* cross-divisional engagement")? Or is it merely a historical artifact whose perceived meaning is constructed by those invested in its survival? *(Contested Philosophical Claim: Whether institutional identity requires specific, inherited structures or can evolve around principles.)*  

  **Key Insight:** The rule's strongest *observable* function appears converted (enrollment/stability), while its strongest *defended* function is expressive/identity-based. Neither is the original load-bearing rationale.  

  #### III. Applying the Proposed Tests  

  1.  **Reversibility & Legibility Test:**  
      *   **Reversibility:** Immediate repeal is largely irreversible. Once departments shrink or curricula adapt, restoring the rule might be impossible. **Suspension for a defined cohort is highly reversible.** If negative effects are observed, reinstatement is feasible before permanent structural changes occur.  
      *   **Legibility:** We lack mechanisms to "notice what we lost" if repealed. **A pre-registered study plan creates legibility.** We commit *now* to track specific metrics (e.g., enrollments in small dept. 200+ level courses; student surveys on breadth depth; transfer/double-major time-to-degree; faculty perceptions of cross-divisional engagement; requests for interdisciplinary capstones) *before* and *during* suspension. This allows detection of losses (or gains) attributable to the rule's absence.  
      *   **Assessment:** **Suspension with study PASSES this test strongly.** Immediate repeal FAILS on reversibility and legibility. Sunsetting or retaining fail on legibility without proactive study.

  2.  **Counterfactual-Replacement Test:**  
      *   The significant risk is not "rule vs. no rule" but "this rule vs. a new mandate." Political pressure exists for a college-wide interdisciplinary "capstone" or similar complex requirement, likely more administratively burdensome and resource-intensive than the current model.  
      *   **Suspension explicitly framed as a *temporary experiment* reduces this risk.** It signals we are gathering evidence *for* future policy, not creating a vacuum. We can formally recommend that no *new* breadth requirement be considered until study results are in.  
      *   **Assessment:** **Suspension with study MITIGATES this risk better than repeal or sunsetting without a concurrent moratorium on new requirements.** Retaining the rule avoids the risk but perpetuates the status quo's costs and uncertainties.

  #### IV. The Strongest Argument Against Suspension (The Anti-Burkean Case)  
  "Burkean caution is a rhetorical trap favoring inertia. Invoking 'latent functions' or 'inarticulable wisdom' is unfalsifiable and imposes no burden of proof on defenders of the status quo. We have *no credible evidence* this rule provides unique educational value justifying its costs, especially to vulnerable students like transfers. The enrollment support it provides is real but should be defended openly on budgetary/structural grounds, not hidden behind phantom pedagogies or sentimentalism. Suspension perpetuates uncertainty and delays necessary reform. The fairest, most transparent action is immediate repeal: eliminate a demonstrably burdensome rule with no known educational benefit. If a compelling case for structured breadth emerges later, we can design a better, intentional requirement based on contemporary educational principles, not historical accident."

  #### V. Recommendation & Confidence  
  **Recommendation:** Suspend the sequenced breadth requirement for the **Fall 2025 entering cohort**. Concurrently, **develop and approve a pre-registered, multi-year study plan** to monitor key metrics (see Section III.1) throughout the cohort's tenure. Formally recommend that **no new college-wide breadth requirement be established until the study results are reviewed** (anticipated 2028/29).  

  *   **Confidence: Medium (6/10).** This balances the precautionary principle against tangible costs and the demand for evidence. It creates the conditions to *acquire* evidence for a permanent decision.
  *   **Evidence That Would Move Confidence:** If proponents could demonstrate, *before suspension*, specific, credible, and measurable educational harms *likely* to occur from suspension (e.g., a documented decline in a specific skill linked *solely* to this rule, evidence that alternative breadth patterns demonstrably fail elsewhere), confidence in suspension would decrease (potentially favoring retention or a different study design). Conversely, if compelling data emerged showing the rule *actively harms* specific student groups significantly, confidence in suspension would increase.

  #### VI. Addressing the Enrollment Hypothesis  
  The enrollment impact on smaller departments (Classics, Geology, potentially others) is the most empirically substantiated function of the rule, even if not its original or sole purpose. This must be addressed transparently:  

  1.  **Acknowledge Openly:** The memo should state plainly that enrollment support is a documented effect and a valid concern for departmental viability and curricular diversity.  
  2.  **Integrate into Study:** Enrollment metrics (total seats filled in relevant depts/courses, % of majors vs. non-majors, course cancellations) are critical components of the pre-registered study plan.  
  3.  **Honest Routing:** **The budgetary/structural implications identified by the study should be explicitly routed to the Budget & Resources Committee (or equivalent) alongside the educational findings for the final decision.** While the *educational policy* recommendation rests primarily on pedagogical grounds, the *resource allocation* consequences require separate, open deliberation by the body tasked with weighing budgetary impacts and institutional priorities. This separates the questions ("Is this educationally valuable?") from ("Is this the right/best way to support these departments?") while ensuring both are addressed with appropriate transparency and expertise. Avoiding this discussion harms both educational integrity and institutional trust.  

  ---

  **Bottom Line:** Suspend for one cohort (Fall 2025) with a rigorous, pre-registered study plan. This is the most reversible, legible, and risk-mitigated path forward. It respects the possibility of latent value while directly addressing known costs and the demand for evidence. Route resource implications revealed by the study openly to the appropriate body.
