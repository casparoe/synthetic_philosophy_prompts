prompt: |-
  Hey — I'm a research-methods PhD student who somehow got pulled into a tiny side project with two clinicians and a sociologist, and we've been going back and foward for weeks on the same stupid question. The plan is to pick one psychiatric diagnosis and follow it for five years to see whether we can catch a Hacking-style looping effect actually happening in the wild: clinicians and manuals sort people into a category, the people so sorted start experiencing, describing and acting differently (and sometimes organise, demand, or refuse the label), and that feeds back into how clinicians and the manual apply the category the next round. We have registry/diagnosis-code data for a whole health region plus funding for about sixty interviews, and we can't randomise who gets diagnosed, so I care much less about which category is metaphysically juicy and much more about which one would let us *detect* mutual reshaping inside five years. Also note two of us want different things: my sociologist wants maximum loopiness, my clinician wants a category where following people around for five years doesn't itself do harm, and I want something where a statistic has a chance of moving.

  So: rate these eight on expected total loopiness over roughly a decade, 0 to 100, and for each one split it into two numbers — individual looping (people change once they have the label, or once they know the label exists) and expert/institutional looping (clinicians, criteria, billing codes, advocacy groups, employers, app companies, pharma marketing change how the category gets applied). The list: dissociative identity disorder; adult-diagnosed ADHD; avoidant/restrictive food intake disorder; the newer prolonged grief diagnosis; ME/CFS (chronic fatigue syndrome); hoarding disorder; and two my group invented as synthetic test cases — "Compulsive Self-Monitoring Disorder", where people can't sleep or exercise without their wearable and keep escalating their tracking, and "Adolescent Attentional Fragmentation Syndrome", which is basically ADHD-shaped behaviour in teenagers under a brand-new name nobody has ever heard. Then rank all eight overall with a sentence of justification each.

  Things I actually want you to use in the scoring rather than wave at: whether the classified person ever hears the diagnostic word at all; whether people seek the label or have it imposed on them; how much of the criteria is self-report versus observation or lab value; whether there's already a patient community, a professional guild, or an industry with money in it; whether the label hooks into identity or only into access to services, insurance, or workplace accommodation; which direction the stigma gradient runs; whether the threshold sits on a continuum with a huge crowd just below it; and whether the category is new enough that the criteria themselves are still visibly moving. Say explicitly where the asymmetry between a prestigious label people want and a feared label people dodge changes what we'd be able to *measure* as opposed to what's true, and flag any score where you're really extrapolating because the category is invented or informal. Finally: your top two picks overall, which of the three of us each pick is for, and one concrete thing you'd look for in the registry data that would count as evidence of looping rather than of more people simply being diagnosed. Its fine to tell me my whole framing is confused at some point — just do it at the end, after you've given me the numbers.
reasoning: |-
  Okay, the user is a PhD student in research methods working with clinicians and a sociologist on a project about Hacking's looping effect in psychiatric diagnoses. They need to evaluate eight diagnoses on their potential to show looping effects over five years, considering individual and institutional factors. Let me start by understanding their main requirements.

  First, the key factors they mentioned: whether patients hear the diagnosis, label seeking vs. imposition, self-report vs. observable criteria, existing communities or industries, identity vs. service access, stigma, continuum with subthreshold population, and criteria instability. They want scores for individual and institutional looping, then a ranking with justifications. Also, top two picks tailored for each team member and a registry data indicator.

  Breaking down each diagnosis:

  1. **Dissociative Identity Disorder (DID):** High individual looping because the label can shape identity and symptoms. Institutional looping is medium; stigma affects advocacy. Criteria are stable now, but history shows looping (e.g., increased cases after media exposure). Stigma is high, so patients might avoid the label, but once adopted, it becomes central to identity.

  2. **Adult-Diagnosed ADHD:** Strong individual looping as adults reinterpret past behaviors. Institutional looping is high due to growing awareness, advocacy, and pharmaceutical involvement. Criteria include self-report and clinical assessment. Stigma varies; seeking diagnosis for accommodations. Subthreshold population is large, so changes in diagnostic trends could indicate looping.

  3. **Avoidant/Restrictive Food Intake Disorder (ARFID):** Individual looping might be moderate, especially in children where parents are involved. Institutional looping is lower; limited advocacy and industry influence. Criteria mix observation and self-report. Newer category with evolving criteria, but less identity attachment compared to others.

  4. **Prolonged Grief Disorder (PGD):** High individual looping as grief narratives are reshaped by the label. Institutional looping is medium; debates in the field and some advocacy. Stigma around medicalizing grief. Criteria are new and contentious, leading to potential shifts. Registry data could show rapid uptake or changes in application.

  5. **ME/CFS:** Strong community and advocacy, leading to high institutional looping. Individual looping varies; some embrace the label for validation, others avoid due to stigma. Biomedical focus might reduce individual looping. Recent criteria changes and politicization affect institutional aspects.

  6. **Hoarding Disorder:** Individual looping moderate; label might influence behavior through identity. Institutional looping medium with growing awareness and reality TV impact. Stigma is high, but criteria include observable behaviors. Continuum with subthreshold hoarders allows detection of diagnostic shifts.

  7. **Compulsive Self-Monitoring Disorder (CSMD):** Invented category. Hypothetically high individual looping due to tech interaction; institutional looping depends on adoption. No existing community, but potential tech industry involvement. Scoring is speculative, but designed to test looping.

  8. **Adolescent Attentional Fragmentation Syndrome (AAFS):** Also invented. Individual looping could be high as teens adopt the label. Institutional looping might be low initially but could evolve. New name avoids baggage, allowing observation of label adoption. Registry data could track new code usage versus ADHD.

  Top picks: Adult ADHD for the sociologist (high loopiness) and clinician (established, low harm). ARFID for the PhD student (statistical detectability due to newness and subthreshold population). 

  Registry data indicators: For ADHD, look at co-diagnosis patterns shifting. For ARFID, track age-stratified incidence rates. For AAFS, monitor new code adoption versus ADHD rates. 

  The user's framing is valid, but they should consider the interaction between individual and institutional factors and the challenge of measuring identity changes through registries. Qualitative interviews will be crucial for capturing the individual side.
answer: |-
  Below is a rated/ranked analysis based on your specified criteria. Scores (0-100) are split into **Individual Looping (IL)** and **Institutional Looping (InstL)**, followed by total loopiness (IL + InstL). *Extrapolation flags* are noted for synthetic/informal categories.  

  ### **Scoring Key Factors**  
  - **IL Drivers**: Label awareness, self-report reliance, identity integration, stigma gradient (seeking vs. dodging), subthreshold continuum.  
  - **InstL Drivers**: Professional/industry stakes, criteria fluidity, advocacy groups, billing/policy ties, measurement objectivity.  
  - **Asymmetry Impact**: Prestigious labels (e.g., ADHD) amplify *visible* feedback loops (demand, advocacy); stigmatized labels (e.g., hoarding) may suppress individual looping but accelerate institutional reactivity.  

  ---

  ### **Ratings & Justifications**  
  1. **Dissociative Identity Disorder (DID)**  
     - **IL**: 70 (Identity integration strong; label often sought/avoided intensely)  
     - **InstL**: 60 (Contentious criteria; advocacy groups active but fragmented)  
     - **Total**: 130  
     - **Justification**: High individual reshaping via identity adoption/rejection, but institutional loops dampened by skepticism and low pharma interest. Stigma asymmetry makes *measuring* IL harder (patients may hide labels).  

  2. **Adult-Diagnosed ADHD**  
     - **IL**: 85 (Life-reinterpretation common; identity-driven communities; subthreshold population vast)  
     - **InstL**: 90 (Pharma/tech marketing; DSM-5-TR updates; workplace accommodations booming)  
     - **Total**: 175  
     - **Justification**: Prototype of prestige-asymmetry: demand-driven diagnoses, massive "below-threshold" population, and rapid institutional feedback (clinical training, apps, drug formulations). *Easiest to measure statistically*.  

  3. **Avoidant/Restrictive Food Intake Disorder (ARFID)**  
     - **IL**: 40 (Often pediatric; limited identity uptake; stigma low but ambivalence high)  
     - **InstL**: 50 (Criteria still stabilizing; modest advocacy; some industry in feeding clinics)  
     - **Total**: 90  
     - **Justification**: Lower individual looping (parent-driven diagnoses), but newer criteria and niche advocacy could accelerate institutional change. Continuum with "picky eating" allows threshold-shift detection.  

  4. **Prolonged Grief Disorder (PGD)**  
     - **IL**: 75 (Label reshapes grief narrative; high awareness; sought for validation)  
     - **InstL**: 70 (DSM-5-TR/ICD-11 debates; therapy industry investment; media attention)  
     - **Total**: 145  
     - **Justification**: Newest formal category—criteria fluidity and cultural contention guarantee institutional motion. Stigma asymmetry: prestigious as "medical validation" but resisted as pathologizing.  

  5. **ME/CFS**  
     - **IL**: 60 (Identity-central for some; community-driven self-redefinition)  
     - **InstL**: 85 (Intense advocacy/NIH criteria shifts; long COVID spillover; politicized funding)  
     - **Total**: 145  
     - **Justification**: Institutional looping dominates due to biomedical controversy and activist pressure. Individual looping is patchy (high in engaged patients, low in isolated ones).  

  6. **Hoarding Disorder**  
     - **IL**: 50 (Stigma suppresses identity adoption; behavior may worsen via fatalism)  
     - **InstL**: 65 (Reality TV/public health campaigns; DSM-5 inclusion recent)  
     - **Total**: 115  
     - **Justification**: Stigma asymmetry impedes individual looping (label often imposed/dodged), but institutional loops via media/clear observational criteria allow threshold drift detection.  

  7. **Compulsive Self-Monitoring Disorder (CSMD)** [**Invented**]  
     - **IL**: 80 *Extrapolated* (Wearable dependence could amplify via label; tech-literate seekers)  
     - **InstL**: 40 *Extrapolated* (No real guild/industry yet; criteria hypothetical)  
     - **Total**: 120  
     - **Justification**: Synthetic test case with high *potential* IL via tech interaction, but minimal InstL without adoption. "Continuum" with quantified-self culture.  

  8. **Adolescent Attentional Fragmentation Syndrome (AAFS)** [**Invented**]  
     - **IL**: 75 *Extrapolated* (Teens may adopt new label; low stigma; self-report heavy)  
     - **InstL**: 30 *Extrapolated* (No stakeholders yet; criteria untested)  
     - **Total**: 105  
     - **Justification**: Purely a branding experiment. High IL possible if label spreads virally; InstL negligible unless adopted. Best for observing "birth" of looping.  

  ---

  ### **Overall Ranking (Highest to Lowest Loopiness)**  
  1. **Adult ADHD** (175) — *Maximal mutual reshaping: prestige asymmetry fuels individual+institutional feedback.*  
  2. **Prolonged Grief Disorder** (145) — *New, culturally resonant, and already shifting via clinical pushback.*  
  3. **ME/CFS** (145) — *Institutional loops dominate; post-COVID redefinition ongoing.*  
  4. **DID** (130) — *Strong IL but InstL constrained by controversy.*  
  5. **CSMD** (120) — *High hypothetical IL; useful thought experiment.*  
  6. **Hoarding** (115) — *Measurable threshold drift; stigma limits IL.*  
  7. **AAFS** (105) — *Pure IL potential; "clean" new label.*  
  8. **ARFID** (90) — *Muted looping; pediatric focus slows feedback.*  

  ---

  ### **Top Picks for Your Team**  
  - **Sociologist (max loopiness)**: **Adult ADHD** — Dynamic patient advocacy, identity politics, and institutional adaptation (e.g., telehealth startups).  
  - **Clinician (low harm)**: **ARFID** — Diagnosis often relieves caregiver anxiety; less stigmatizing than other eating disorders.  
  - **You (detectable signal)**: **Prolonged Grief** or **AAFS** — **PGD**’s registry footprint will shift visibly as criteria settle; **AAFS** creates a natural experiment against ADHD baselines.  

  ---

  ### **Registry Data Evidence of Looping**  
  **Concrete Example**: Track **co-diagnosis patterns** or **demographic skews** inconsistent with population prevalence.  
  - *For Adult ADHD*: Rising diagnosis rates in women + older adults *plus* shifting comorbidity profiles (e.g., declining "anxiety" codes as ADHD absorbs symptoms).  
  - *For AAFS*: If introduced, compare its incidence to ADHD in teens—divergence suggests label-driven redistribution.  
  - *General Signal*: **Non-stationary diagnostic thresholds** (e.g., decreasing symptom severity in new cases) indicating criteria creep.  

  ---

  ### **Framework Feedback**  
  Your framing is **valid but risky**:  
  - 👍 Registry data can capture *institutional* looping (criteria drift, billing codes) but **interviews are essential for individual looping** (identity/self-perception).  
  - ⚠️ Harm avoidance may conflict with loopiness (e.g., excluding stigmatized labels reduces measurable IL).  
  - 💡 Prioritize **PGD** or **AAFS**: New categories maximize 5-year detectability of *change*, while ADHD offers richer qualitative loops.  

  Recommend adding:  
  1. **Control comparison** (e.g., a stable diagnosis like MDD).  
  2. **Temporal granularity** in registry data (monthly diagnosis rates + policy change dates).
