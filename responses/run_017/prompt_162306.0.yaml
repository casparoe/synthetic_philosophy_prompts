  Below is a complete plan for your 90-minute session on the Sleeping Beauty problem, tailored for your reading group. The session is designed as an experiential game with small stakes (chocolate or points) to let participants discover the paradox through play, avoiding technical terms until the debrief. The core insight is that participants will be "money-pumped" into acting as if the probability of heads is 1/3, despite a fair coin. The plan uses British English and includes materials, a timeline, and concrete debrief points.

  ### **Overview**
  - **Goal**: Participants discover through gameplay that betting "as if heads has a 1/3 chance" maximises gains, even with a fair coin. No mention of "halving", "thirding", or "self-locating belief" until the debrief.
  - **Stakes**: Use chocolate (e.g., small bars or coins) or points (tracked on a scoreboard). Points can convert to chocolate at the end.
  - **Group Size**: 14 participants; each trial uses 3 people for simplicity. Others observe and learn.
  - **Key Insight**: The game replicates Sleeping Beauty using a variant with three people woken simultaneously (avoiding same-person-across-time issues). In heads, one person is woken; in tails, two are woken. Bets are offered in each "awakening", making tails more frequent in the betting pool.
  - **Why It Works**: Over many trials, betting at "1/2 odds" (treating the coin as fair) loses value, while betting at "1/3 odds" (acting as if heads is less likely) wins. This mirrors the Sleeping Beauty paradox without explicit explanation.

  ### **Phase 1: The Classic Problem as a Group Game (Three-People Variant)**
  We use a variant where three people replace the "multiple awakenings" of one person. This avoids amnesia and same-person issues while preserving the betting dynamics:
  - **Setup**:
    - A fair coin flip determines the state:
      - **Heads (50% chance)**: One person is woken (randomly selected from three).
      - **Tails (50% chance)**: Two people are woken (randomly selected from three).
    - Each woken person is asked to bet on whether the coin was **heads** (not tails, to align with Sleeping Beauty's uncertainty).  
    - **No room labels**: Rooms are identical and unlabelled to prevent inference. Participants know the setup but not the coin outcome or who else is woken.
  - **Why This Avoids Same-Person Distraction**: In tails, two *different* people are woken (not one person twice). This strips out time/memory issues, focusing purely on the probability shift from being woken. It faithfully mirrors the betting asymmetry in Sleeping Beauty (one bet in heads, two in tails) without assuming the conclusion.
  - **Betting Rules**:
    - **Stakes**: Each woken person can bet 1 chocolate (or 1 point) on heads.
    - **Odds**: Fixed at 2:1 (i.e., if they bet and win, they gain 2 chocolates; if they lose, they lose their 1 chocolate).  
      *(Rationale: 2:1 odds are "fair" if heads has a 1/3 chance. If participants treat the coin as fair (1/2 chance), they will bet at these odds and lose over time.)*
    - **Choice**: Participants decide whether to bet or not each time they are woken. They can use any strategy.
  - **Expected Discovery**:  
    - If participants bet as if heads has a 1/2 chance, they will accept 2:1 odds (since a fair bet for P=1/2 would be 1:1). But the true chance of heads *given they are woken* is 1/3, so betting at 2:1 loses money.  
    - Over many trials, they will see that avoiding bets (or demanding better odds) wins more. This "money-pumps" them into acting as if P(heads) = 1/3.

  ### **Phase 2: The Variant - Betting on "Tails-Only Room"**
  This extends Phase 1 with a new question to reinforce the paradox without changing mechanics:
  - **Setup**: Same as Phase 1 (one person woken in heads, two in tails), but now:
    - Each woken person is told: "If tails, you are in a 'tails-only room'. If heads, you are not."  
    - They bet on the proposition: **"I am in a tails-only room"** (which is true only in tails).
  - **Betting Rules**: Same as Phase 1 (2:1 odds, 1 chocolate stake).
  - **Why This Works and Doesn’t Assume the Conclusion**:  
    - The "tails-only room" is just a reframing of the coin state (being in a tails room = coin was tails). It adds no new information, so it doesn’t assume thirding. Instead, it tests if participants generalise their Phase 1 insight.  
    - **Honest Check**: If this variant felt biased, it might be because "tails-only room" emphasises the 2/3 betting pool. But this is the point—it highlights why the coin’s fairness doesn’t translate to betting. No change is needed; it cleanly isolates the credence shift.

  ### **Debrief Plan: Mapping Game to Philosophy**
  Concrete points to cover (25 minutes). Start by soliciting participant observations, then guide the discussion:
  1. **What Happened in the Game**:
     - Calculate the results: Show that betting at 2:1 odds lost money, while refusing to bet (or betting only at better odds) won.  
     - Why? In heads, one bet was placed; in tails, two bets were placed. So tails "dominates" the betting pool:
       - P(heads | woken) = (1/2 × 1/3) / [(1/2 × 1/3) + (1/2 × 2/3)] = 1/3.  
       - P(tails | woken) = 2/3.  
     - Thus, 2:1 odds are fair for P(heads)=1/3, but unfair for P(heads)=1/2.

  2. **Map to Sleeping Beauty’s Real Disagreement**:
     - **Why Betting and Credence Diverge**: The number of bets depends on the coin (one in heads, two in tails). So even with a fair coin, you’re more likely to be "in a tails bet" overall. Halfers treat the coin as fair (P=1/2) but ignore this betting asymmetry; thirders incorporate it (P=1/3 when woken).  
     - **What a Halfer Can Say Without Giving Up**: A halfer can insist the *coin* is fair (P=1/2), but adjust *betting behaviour* because they know bets are offered twice in tails. E.g., "I believe P(heads)=1/2, but I’ll only bet at 1:1 odds since I’ll lose twice as often in tails."  
     - **The "Not Monday" Insight**: In Sleeping Beauty, if she’s told "it’s not Monday," both halfers and thirders agree P(tails)=1. Why? Halvers update from new information (no Monday awakening in tails); thirders eliminate the "Monday-heads" scenario. This shows the core disagreement is about *reference classes* (coin flips vs. awakenings).

  3. **Predictable Problems and Unstageable Elements**:
     - **First-Run Issues**:  
       - Participants might not grasp why 2:1 odds are offered. *Fix*: Briefly clarify that odds are "set by the house" (you) and they choose to bet or not.  
       - Confusion about room assignments in Phase 2. *Fix*: Emphasise rooms are identical and unlabelled; "tails-only" just means "coin was tails."  
       - Some may resist betting. *Fix*: Encourage participation with small stakes; the pattern emerges over trials.  
     - **Unstageable Element**: The original Sleeping Beauty’s *amnesia and same-person identity across time* can’t be simulated. You must explain this verbally: "In the real problem, Beauty is one person woken twice in tails, causing philosophical debates about identity. Our variant uses three people to avoid this, but the betting dynamics are identical."

  ### **Materials List**
  - **Coin**: A physical coin (or RNG app) for fair flips.
  - **Random Selection**: 14 name cards in a hat for drawing crews of three.
  - **Betting Slips**: Small paper slips for each participant. Fields: [ ] Bet on heads (Phase 1) / tails-only room (Phase 2) | [ ] No bet.  
  - **Scoreboard**: Whiteboard or poster to track chocolate/points per participant.
  - **Stakes**: 40–60 small chocolates (e.g., Cadbury Minis) or use points (1 bet = 1 point).
  - **Timer**: For strict 90-minute management.
  - **Room Setup**: Three separate areas (e.g., corners) for "rooms" with identical chairs.

  ### **Timeline (90 Minutes Total)**
  - **0:00–0:05 – Introduction**  
    Explain rules simply: "We’ll flip a coin. Heads: one of three wakes; tails: two wake. If woken, you can bet on heads (Phase 1) or being in a tails-only room (Phase 2) at 2:1 odds. Goal: Maximise chocolates!"  
    Avoid technical terms; say "chance" not "credence."

  - **0:05–0:35 – Phase 1: Classic Game (Bet on Heads)**  
    Run 8–10 trials:  
    1. Draw three names (crew).  
    2. Flip coin (hide result).  
    3. Wake one (heads) or two (tails) randomly.  
    4. Woken people decide: bet 1 chocolate or not.  
    5. Reveal coin, resolve bets, update scoreboard.  
    *(Time: 3 min/trial; 10 trials = 30 min)*

  - **0:35–0:50 – Phase 2: Variant (Bet on Tails-Only Room)**  
    Same as Phase 1, but change the bet to: "Am I in a tails-only room?" (bet on "yes").  
    Run 5–7 trials to reinforce the pattern.  
    *(Time: 3 min/trial; 5 trials = 15 min)*

  - **0:50–1:15 – Debrief**  
    Use scoreboard data to drive discussion:  
    1. **Game Analysis (5 min)**: "Who gained/lost? Why did betting at 2:1 lose money?"  
    2. **Map to Sleeping Beauty (10 min)**: Explain the original problem, link to game (one awakening in heads, two in tails), and why P(heads)=1/3 when woken.  
    3. **Philosophical Disagreement (5 min)**: Cover halfer vs. thirder views, betting asymmetry, and the "not Monday" update.  
    4. **Q&A and Unstageable Element (5 min)**: End with why amnesia/same-person couldn’t be simulated.

  ### **Key Tips**
  - **Chocolate Management**: Start with 10 chocolates per person to cover losses. Award extras for top scores.  
  - **Engagement**: Non-playing participants track data (e.g., tally heads/tails outcomes and bets).  
  - **Pacing**: Stick to timelines; use a timer. If trials run long, reduce to 12 total (8+4).  
  - **Neutrality**: During gameplay, don’t hint at strategies. In debrief, present both halfer and thirder views fairly.

  This plan creates an "aha" moment: participants will see their losses when treating the coin as fair, leading them to act on P=1/3 naturally. The variant works because it isolates the betting frequency effect—no hidden assumptions. By the debrief, they’ll grasp why Sleeping Beauty divides philosophers.
