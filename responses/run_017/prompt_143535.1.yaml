prompt: |-
  I'm a third-year philosophy major taking a cross-listed seminar on philosophy of biology this term, and we've just been assigned the 1979 Gould–Lewontin "Spandrels" paper ahead of the midterm. Before reading it properly I borrowed a popular book on evolutionary psychology from my housemate — one of those general-audience trade paperbacks — because somebody in our study group said its opening chapter on "the adaptationist wars" was a good orientation. That chapter summarizes the argument roughly like this:

  "Gould and Lewontin's 1979 paper showed that adaptationism is false. Adaptationism, as they defined it, is the view that every trait of every organism is an adaptation, shaped by natural selection for the job it now performs — the Panglossian faith that whatever exists is the best design available, so that for any feature you look at there must be a story about what it is for. Against this they argued that most features of an organism are spandrels: unavoidable by-products of building a body one way rather than another, like the tapering triangles of masonry you inevitably get when you set a dome on rounded arches in St Mark's, which were never designed for anything at all even though the mosaicists later covered them in sacred images. It follows that a trait's present usefulness is no evidence whatsoever about why it evolved, so asking 'what is it for?' is a waste of a biologist's time; what you should study instead is growth rules, allometry and developmental constraint. And since human behaviour is part of the phenotype like anything else, the paper effectively demolished the adaptationist research programmes — sociobiology first, and later evolutionary psychology — that had assumed our behaviour is a set of adaptations."

  I need to know how much of that to carry into my notes and how much to discard. The last two sentences feel overstated to me: in lecture our professor said Gould and Lewontin both insisted they were not denying the power of natural selection or that organisms are well fitted to their environments, and she mentioned in passing that Mayr and Maynard Smith conceded a good deal of the methodological criticism while still treating adaptationism as the core of evolutionary thinking. She also mentioned, only in passing, that a critic later argued the architectural structures in question aren't really spandrels at all and that the term should have been something like "pendentive", and I can't tell whether that is a substantive point about the argument or a pedantic one about vocabulary. So please go through the paragraph claim by claim and separate what Gould and Lewontin would themselves have accepted, what they would have winced at as a caricature of their position, and what an adaptationist critic would call simply wrong — in particular: is the "adaptationist programme" they attacked really the thesis that every trait is an adaptation, or has the book substituted an indefensible version for the real target; does their notion of a spandrel cover any feature that wasn't directly selected, or only a narrower class, and does that difference change how strong their conclusion is; is the "no evidence whatsoever" line theirs or an overstatement of a more careful claim about the gap between current utility and historical origin; and does the sentence about sociobiology and evolutionary psychology follow from anything the paper establishes, or is it the sort of conclusion the paper is routinely recruited for without actually delivering?

  The reason this matters beyond the midterm is a problem-set case we were given, which I'd like you to re-run under your corrected reading. It's invented: a species of burrowing frog in which males have greatly enlarged forearms; the enlargement is a by-product of selection for larger overall body size under an allometric growth rule and was not itself selected; but males now use those forearms to wrestle rivals in burrow disputes, and the winners get more matings. Our handout says that under Gould and Lewontin this is a spandrel and its present function is irrelevant to its evolutionary explanation. Is that a faithful application or the same misunderstanding again, and does the verdict change if the forearm has since been further modified by selection for grappling? If the corrected version of the argument and the book's version would classify some case differently, I'd love that case too, since I'd rather be able to state the distinction crisply than just say the popular book is wrong.
reasoning: |-
  Okay, let me unpack this user's query carefully. They're a philosophy major grappling with Gould and Lewontin's spandrels paper and a popular book's summary that seems oversimplified. The core tension lies in reconciling the book's dramatic claims ("adaptationism is false", "all traits are spandrels", "present usefulness is irrelevant") with lecture hints about more nuanced positions. 

  First, I need to diagnose where the book missteps. That opening paragraph commits at least four flattenings: (1) portraying adaptationism as "every trait must be an adaptation" when real adaptationists treat it as a heuristic; (2) implying spandrels mean non-adaptive origins when G&L specify structural byproducts; (3) overstating "no evidence whatsoever" about current utility when G&L merely caution against assuming it reveals origins; (4) claiming the paper "demolished" evolutionary psychology when it actually criticized methodological excesses. 

  The user's frog case is perfect for testing this. Under the book's view, those wrestling forearms would be dismissed as spandrels with irrelevant current function. But properly understood: the initial enlargement qualifies as a spandrel (structural byproduct of body size selection), while the later co-option for wrestling represents an exaptation. If selection subsequently refined the forearms for grappling, that's secondary adaptation layered on the spandrel—exactly the multi-process view G&L advocated. 

  What this philosophy student really needs are crisp conceptual distinctions: adaptation vs exaptation; primary spandrel (like cathedral triangles) vs functionalized spandrel (like mosaic-covered spandrels); methodological vs ontological adaptationism. The architectural term debate ("spandrel" vs "pendentive") matters only if it exposes confusion about byproduct types—which it does, since pendentives are structural necessities while spandrels are decorative afterthoughts. But G&L's core point stands either way. 

  Their deeper concern seems to be about critical reading: how to extract arguments from primary texts without popularizations distorting the lens. I should emphasize that Gould and Lewontin's bullseye was always the "just-so story" mentality, not adaptationist thinking per se. Even Mayr conceded their methodological point while defending adaptationism's centrality. 

  For the frog case, the key is temporal layering: the trait's origin ≠ its maintenance ≠ its current utility. That's what the book misses—and what makes evolutionary biology philosophically rich.
answer: |-
  Let's dissect that popular summary against Gould & Lewontin's (G&L) actual arguments, pinpointing distortions and clarifying the core ideas for your notes. The book's version contains significant overstatements and misrepresentations that obscure G&L's nuanced critique.

  **Claim-by-Claim Analysis of the Popular Summary:**

  1.  **"Gould and Lewontin's 1979 paper showed that adaptationism is false."**
      *   **G&L:** Would **wince**. They did not claim adaptationism *as a whole* is false or that natural selection isn't the primary force shaping complex adaptation. Their target was **methodological adaptationism** – the practice of assuming *every* trait *must* be an optimal adaptation and constructing "just-so stories" to explain it *without adequate testing* of alternatives (like constraints, developmental byproducts, or historical contingencies). They argued this approach was *sterile and misleading*, not that adaptation-seeking itself was invalid.
      *   **Critics (e.g., Mayr, Maynard Smith):** Would call this **wrong**. They agreed methodological criticism was valid (e.g., against untestable stories) but defended adaptationism as the *essential core heuristic* for understanding complex design. They saw G&L attacking a straw-man version few serious biologists held.

  2.  **"Adaptationism, as they defined it, is the view that every trait of every organism is an adaptation... the Panglossian faith..."**
      *   **G&L:** Partially accept, partially wince. They *did* characterize the *method* they criticized as "Panglossian" and argued it *operated* as if every trait must be an optimal adaptation. However, they weren't defining a formal philosophical position ("ontological adaptationism") but critiquing a widespread *research strategy*. Their real target was the *routine prioritization* of adaptive explanation above all others and the *failure to consider alternatives seriously*.
      *   **Critics:** Would call this a **caricature**. Few serious biologists believe *every single trait* is an adaptation. The "core" adaptationist view is that adaptive design is pervasive and central to understanding organismal complexity, requiring adaptation to be the *default hypothesis* demanding testing and falsification, not the *only possible* hypothesis.

  3.  **"Against this they argued that most features of an organism are spandrels..."**
      *   **G&L:** Would **strongly wince** and call this an **overstatement**. They argued that *some* features are spandrels, and more importantly, that the *possibility* and *prevalence* of non-adaptive origins (spandrels, constraints, etc.) are systematically underestimated. They *never* quantified "most". Their point was to break the *presumption* of adaptationism, not to replace it with a "most are spandrels" dogma. The architectural analogy was illustrative, not quantitative.
      *   **Critics:** Would call this **wrong and misleading**. They argue that while byproducts exist, complex, integrated functional traits clearly shaped by selection dominate the phenotype. Defining "feature" matters – is it a specific muscle insertion or the whole wing?

  4.  **"...spandrels: unavoidable by-products... never designed for anything at all..."**
      *   **G&L:** **Accept** the core definition. A spandrel is a *structural byproduct* of building an organism in a certain way due to developmental or architectural constraints. Crucially, they emphasized that spandrels are *initially* non-adaptive but **can be co-opted for a function later** (exaptation). The St. Mark's spandrels were architectural necessities first, *then* used for decoration.
      *   **Critics (re: terminology):** The "spandrel vs. pendentive" point (made by Mark Ridley, among others) is **pedantic for the core argument but highlights a nuance**. Technically, the structures G&L described are pendentives (structural supports for a dome). Spandrels are the *decorative panels* filling the leftover space *between* arches. However, G&L's core concept – a non-adaptive structural byproduct that *becomes available* for later use – remains valid regardless of the architectural term. Calling them "spandrels" stuck.

  5.  **"It follows that a trait's present usefulness is no evidence whatsoever about why it evolved..."**
      *   **G&L:** Would **wince at "no evidence whatsoever"** but accept the core caution. They argued forcefully that **current utility does not automatically reveal historical origin**. A trait useful now might have arisen: (a) *as* an adaptation for that function, (b) *as* an adaptation for a *different* function, (c) as a non-adaptive spandrel/byproduct *later* co-opted for its current use (exaptation). They insisted that inferring historical origin *requires* evidence beyond current utility (e.g., phylogeny, development, genetics). Current utility is *suggestive* but *insufficient proof* of original selective cause.
      *   **Critics:** Agree that inferring historical origin requires care and multiple lines of evidence, but argue that current utility is *strong prima facie evidence* that often points correctly to the selective history, especially for complex functional traits. It's a crucial starting point for investigation.

  6.  **"...so asking 'what is it for?' is a waste of a biologist's time; what you should study instead is growth rules, allometry and developmental constraint."**
      *   **G&L:** Would call this a **gross misrepresentation**. They argued *not* that asking "what is it for?" is a waste, but that *assuming you must always find a direct adaptive answer immediately, and ignoring other possibilities*, is poor science. They advocated for a *pluralistic approach*: consider adaptation, *but also* rigorously investigate constraints, historical contingencies, and developmental byproducts (like allometry) as potential explanations *from the start*. "What is it for?" remains a valid question, but it shouldn't be the *only* question asked dogmatically.
      *   **Critics:** Strongly disagree that asking "what is it for?" is a waste. It's the fundamental question for understanding adaptation. Studying constraints is important, but it complements, rather than replaces, the search for function.

  7.  **"And since human behaviour is part of the phenotype like anything else, the paper effectively demolished the adaptationist research programmes — sociobiology first, and later evolutionary psychology..."**
      *   **G&L:** Would have **mixed feelings**. They *did* explicitly criticize sociobiology (EP's predecessor) in the paper as a prime example of the adaptationist program's excesses – specifically, constructing complex, untestable adaptive stories for human behaviors with little regard for alternatives (cultural evolution, byproducts of general cognition, developmental constraints). Gould, especially, remained a lifelong critic of strong adaptationist approaches to human behavior. However, they framed this as a *critique of methodology*, not a proof that *no* human behaviors are adaptations. They did not "demolish" the fields; they challenged specific practices within them. The paper doesn't *prove* EP/sociobiology is wrong; it argues their *method* at the time was flawed.
      *   **Critics (EP/Sociobiology):** Vehemently disagree it "demolished" them. They argue G&L misrepresented their methods (claiming they don't consider alternatives or test hypotheses) and that modern EP explicitly incorporates considerations of byproducts, constraints, and cultural evolution. They see G&L's critique as an important methodological warning that improved the fields, not invalidated them.

  **Summary of Key Distortions in the Book:**

  1.  **Caricatures Adaptationism:** Presents it as "every trait is an adaptation" (ontological) rather than critiquing the *methodological* dominance of adaptive storytelling.
  2.  **Overstates Spandrel Prevalence:** "Most features" is unsupported and misrepresents G&L's emphasis on *potential* and *under-consideration*.
  3.  **Overstates "No Evidence":** Current utility *is* relevant evidence, but insufficient alone to prove historical origin.
  4.  **Misrepresents G&L's Prescription:** They advocated pluralism, not *replacing* adaptationism with constraint studies.
  5.  **Overclaims Demolition:** Critiqued methodology and specific practices in sociobiology/EP; didn't prove the entire enterprise invalid.

  **The Frog Case: Faithful or Misapplied?**

  *   **The Handout's Claim:** "This is a spandrel and its present function is irrelevant to its evolutionary explanation."
  *   **Analysis (Under G&L's Corrected View):**
      *   **Initial Arm Enlargement:** Correctly identified as a **spandrel/byproduct**. It arose due to an allometric growth rule under selection for larger body size, not direct selection for arm size itself.
      *   **Current Use (Wrestling):** This is **not irrelevant** to its *evolutionary history*! The handout makes the exact error G&L cautioned against: confusing *origin* with *current utility*. The *origin* explanation is the byproduct/spandrel. However, the *current utility* (wrestling) is highly relevant to understanding its *maintenance* and *subsequent evolution*.
          *   **Scenario 1 (No Further Modification):** The large arms persist *because* they are co-opted for wrestling, providing a fitness benefit (exaptation). Their current function explains why this *specific* byproduct was retained and not selected against, even if it wasn't the cause of its origin. The "why it's there *now*" explanation involves both the initial origin (spandrel) and the current maintenance (exaptation).
          *   **Scenario 2 (Further Modified for Grappling):** This strengthens the relevance of the current function. The trait has undergone **secondary adaptation**. Selection has *subsequently* acted *on the existing spandrel/byproduct*, refining it specifically for grappling. The evolutionary explanation is now layered: 1. Origin: Spandrel (byproduct of body size selection). 2. Initial Co-option: Exaptation (used for wrestling). 3. Refinement: Adaptation (further modified *for* grappling). The current function is central to explaining the *most recent phase* of evolutionary change.

  **A Crisp Distinction: The Book vs. Corrected G&L Applied to a Case**

  *   **Case:** The male frog's enlarged forearms.
  *   **Book's Version (Misrepresented G&L):** "It's a spandrel. Its wrestling function is irrelevant. Stop looking for function."
  *   **Corrected G&L View:** "The *origin* of the enlargement is a spandrel/byproduct of selection on body size. However, its *current use* in wrestling is crucial for understanding its persistence (exaptation). If modified for grappling, that function explains its *recent adaptive refinement* (secondary adaptation). We must distinguish the *reason it appeared* (non-adaptive byproduct) from the *reason it persists and may have been modified* (current adaptive utility)."

  **Key Takeaways for Your Notes:**

  *   **Target:** G&L critiqued **methodological adaptationism** – the *dominance* of adaptive explanation and the neglect of alternatives (constraints, byproducts, history) in practice.
  *   **Spandrels:** Are *structural byproducts* of development/architecture, *initially* non-adaptive but *available for later co-option* (exaptation). They represent *one important class* of non-adaptive origins, not "most" features.
  *   **Current Utility:** Is *not* "irrelevant" or "no evidence." It is *critical* for understanding maintenance and subsequent evolution (exaptation, secondary adaptation). However, it **cannot be assumed to reveal the trait's historical origin**. Distinguish *origin* from *current function*.
  *   **Prescription:** **Pluralism.** Investigate adaptation seriously, but *test* adaptive hypotheses rigorously against alternatives (phylogenetic history, developmental constraints, structural byproducts) from the outset. Don't assume adaptation is the only possible answer.
  *   **Impact on Sociobiology/EP:** A powerful **methodological critique** of constructing untestable adaptive stories without considering alternatives, particularly for human behavior. It challenged practices within these fields but did not (and could not) prove them fundamentally invalid.
  *   **Frog Case:** Faithful to G&L *only* regarding the **origin** (spandrel). The handout's claim that the current function is "irrelevant" is a **misunderstanding** of G&L. The current function is essential for explaining the trait's persistence and any subsequent modification. G&L demand a *layered* historical explanation.

  This corrected framework should help you navigate both the paper and the midterm, providing a more accurate and philosophically nuanced understanding of the "Spandrels" critique and its enduring significance.
