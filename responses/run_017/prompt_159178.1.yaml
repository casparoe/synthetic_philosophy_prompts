prompt: |-
  I write literary fiction, and I have been asked to give a one-off session at a writers' centre this autumn: a single two-hour slot, fourteen participants, all novelists, most of them at work on a second or third book and most of them quietly hostile to literary theory — the sort of people who hear the word pragmatics and start checking their phones. I want to give them something they cannot get from a craft book, and I want to give it to them without ever naming it during the session.

  Here is the problem I keep running into in my own work, which is why I am asking for this rather than for a reading list. A great deal of what my characters say is not reporting anything. When a character says, at a bedside, that she forgives her father; when a not-quite-sober registrar pronounces a couple married in a room where the licence has expired; when a colonel gives an order to men who no longer recognise his commission; when a man leaves everything to a woman he has not married and then dies before signing — none of these sentences is chiefly in the business of being true. They are attempts to do things, and they succeed or fail by standards that have nothing to do with accuracy. Readers are extremely good at detecting which is which, and they do it instantly and without vocabulary: a scene in which a vow is spoken in the wrong form, or by the wrong person, or into a silence where no one has the standing to receive it, goes dead on the page in a way that no amount of beautiful prose repairs, and I have watched myself write such a scene three times and not know why it would not stand up.

  So the design brief: a runnable activity — a game, a simulation, a staged set of real choices with small stakes — in which the participants run into that distinction before it is named. They should discover, by trying and failing to make words do things in the room, that the success of such an utterance is a matter of there being an accepted procedure, of the right persons being in the right positions, of the procedure being gone through completely, and of the speaker being in a certain state — and that an utterance can satisfy every one of those and still ring hollow, or violate one and still land. I do not want a lecture up front. I do not want the words illocutionary, perlocutionary, uptake, felicity, or constative spoken by anyone until the debrief. Ideally the participants should spend the first ninety minutes doing something and be unable to say afterwards what it was they were doing.

  Three complications of my own, which I am asking you to take seriously rather than accommodate politely. They are my coinages; I have no source for them and do not want one.

  The first I call shadow uptake. When a character in a novel is married, or threatened, or appointed, or excommunicated, nothing whatever has happened — there is no procedure, no standing, nobody is bound — and yet readers routinely report that the act worked, that the marriage is real for the purposes of the story, that the threat landed. They appear to run the same check they would run in life and return a verdict on an act they know to be void. My guess is that a novelist's craft consists substantially in engineering that check, and I want participants to feel themselves doing it.

  The second I call deferred performatives: utterances whose effect is suspended until some later, independent act ratifies them — a bequest that binds only at a death, a resignation tendered but not accepted, a bet that becomes binding only when the stake is posted, a sentence that binds only once it is entered. These are suspense machines, and novelists use them constantly without noticing that they have made the force of an utterance depend on an event the speaker will never see.

  The third I call double-addressed acts: a single utterance aimed at a character and at the reader at once, with a different force for each, where the reader's uptake of their half can quietly sabotage the character's. A public forgiveness is absolution to the person who receives it and menace to the reader, who alone knows what the speaker is concealing.

  Please design the session so that at least one of these three is not merely discussed but produced by the rules, and tell me honestly which of the three the mechanics can carry and which of them I will have to supply myself in the debrief — I would rather be told that one of my hobby-horses cannot be staged than given a contrived exercise that pretends otherwise.

  The practical constraints: fourteen adults in one room, two hours with a short break, one facilitator (me), nothing that costs money, no preparation between sessions, no homework, and materials limited to what a writers' centre actually has — index cards, a flipchart, pens, a bell. Participants will write short passages in the room and read them aloud, and that is fine; they will also, I think, have to say things to each other that commit them, and I want the commitment to be small but not fictional — tokens, chips, a ledger, a standing to be gained or lost — because I suspect the difference between describing a promise and being in one is exactly the thing I am trying to make them feel. Give me the rules, the material, the opening state of the room, what the facilitator does and does not say, a minute-by-minute shape, the scoring if there is scoring, and any cards or scripts I need to write in advance.

  Then the debrief, which I want in more detail than the game: which moment in the activity is supposed to produce which recognition, in what order I should draw them out, and what question I should ask to get each one — not a list of points to assert. Include what will predictably go wrong the first time I run it: I expect at least one participant to treat the whole thing as an exercise in rule-lawyering and try to win by inventing procedures, one to insist that a fictional utterance is simply true within the story and that nothing more needs saying, and one to collapse the difference between an act that misfires and an act that is achieved but hollow, since in a room of actors insincerity is indistinguishable from good acting. Tell me what to do with each of those. Finally, be frank about what the exercise cannot reproduce. My worry is that it will make the whole business feel like a game convention — a rule we agreed to for an hour — and that the step from the room accepted it to you are now bound, this has changed what you owe, will have to come entirely from me in the last fifteen minutes. If that is so, say so, and tell me what I should say.
reasoning: |-
  Okay, the user is a literary fiction writer preparing a workshop for other novelists who are skeptical of theory. They want an experiential activity that demonstrates how performative language works in fiction—how utterances "do things" rather than just report facts—without ever naming concepts like "performative" or "felicity conditions."  

  The core challenge is designing an exercise where participants *feel* the difference between successful and failed speech acts through direct experience. The user’s three nuanced concepts ("shadow uptake," "deferred performatives," "double-addressed acts") are crucial but hard to operationalize. They’re adamant about avoiding jargon and want mechanics that organically produce at least one of these phenomena.  

  **Key Insights from the Query:**  
  1. **Hostility to Theory:** Participants will disengage if it feels academic. The exercise must be visceral, not conceptual.  
  2. **"Shadow Uptake" as Anchor:** This is the most feasible to stage—readers treating fictional acts as "real" despite knowing they’re void. The game mechanics can mirror this by making players *invest* in fictional outcomes.  
  3. **Deferred/Double-Act Challenges:** These rely on narrative context (time, reader knowledge). Hard to replicate in a live exercise without oversimplifying. Better addressed in debrief with examples from the game.  
  4. **Stakes Requirement:** User insists on "small but real" commitments (not pretend promises). Tokens or roles must feel consequential *in the moment*.  

  **Structural Risks to Mitigate:**  
  - Rule-lawyers might exploit ambiguities. Solution: Tightly constrain procedural moves.  
  - Literalists may dismiss the exercise as "just a game." Solution: Debrief ties game failures to manuscript examples.  
  - Insincerity vs. Hollow Acts: Hard to distinguish live. Solution: Focus on *audience reaction* (e.g., "Did you believe the apology? Why not?").  

  **Game Design Choices:**  
  - **"The Council of Tokens":** A closed economy of roles (Councillor/Claimant), tokens, and rules for "ratifying" statements. Forces players to:  
    - *Negotiate standing* (e.g., "Can you *really* demote me if I’m not a Councillor?")  
    - *Feel procedure collapse* when conditions aren’t met (e.g., an unsanctioned vow).  
  - **Why Tokens?** They make abstract standing visible. Losing a token *hurts*; denying a ratification *costs*. This mirrors how readers judge "void" acts as binding in stories.  
  - **Shadow Uptake Mechanic:** Players *treat* ratified acts as real (e.g., enforced demotions) despite knowing it’s a game. This directly mirrors reader buy-in.  

  **Debrief Strategy:**  
  - Start with player frustrations ("Why didn’t X work?"), then map to:  
    1. Conditions for speech acts (procedure/standing/completeness/sincerity).  
    2. **Shadow Uptake:** "You accepted Marco’s demotion as ‘real’ here. But outside this room, is he actually demoted?" → Link to fictional vows.  
    3. Deferred/Double-Acts: Use game moments *almost* achieving these (e.g., a bet conditional on later events) as springboards for manuscript examples.  

  **Predictable Issues & Responses:**  
  - **Rule-Lawyer:** "I declare a new rule that I can take tokens anytime!" → *Facilitator:* "Does the group accept this procedure? If not, it fails." → Highlights community buy-in.  
  - **Literalist:** "But none of this matters; it’s just tokens." → *Debrief question:* "When Anya refused your ratification, did you feel cheated? Why?" → Connects to reader investment.  
  - **Insincerity vs. Hollow Act:** If a player fakes remorse during an apology ritual: *Ask group:* "Did this feel resolved? Why/why not?" → Distinguishes external compliance from internal belief.  

  **Frank Gaps:**  
  - The exercise *can’t* fully replicate deferred/double-addressed acts—they require narrative time and reader omniscience. Solution: Use debrief to contrast game limitations with novelistic tools (e.g., "How would you *write* a bet that only binds at death?").  
  - The "binding" feeling post-game *will* feel conventional. Mitigation: End with a real-world example (e.g., "Raise your hand if you still feel slightly loyal to your Council faction. Why? That’s *shadow uptake*.").  

  **Final Shape:**  
  - **Minutes 0-10:** Set up factions, tokens, rules. *No theory.*  
  - **Minutes 11-85:** Gameplay with escalating speech acts (promises → bets → vows). Facilitator breaks flow only for rituals.  
  - **Minutes 86-105:** Debrief via Socratic questions, using player anecdotes. *Then* name concepts.  
  - **Minutes 106-120:** User’s manuscript examples + Q&A.  

  This meets the brief by making theory felt through friction—players will *rage* when a "void" act sticks or a "valid" one fails. That rage is the point.
answer: |-
  Below is a complete session design centered on **"The Council of Tokens"**—a structured game that forces participants to experience the mechanics of performative language, **shadow uptake**, and (partially) **deferred performatives** through real, low-stakes commitments. It avoids all theoretical language during play. The debrief explicitly ties game moments to your three concepts and addresses predictable issues.  

  ---

  ### **SESSION STRUCTURE**  
  **Total Time:** 120 minutes (90 min activity + 30 min debrief)  
  **Materials:**  
  - 42 tokens (e.g., poker chips, buttons, or torn paper)  
  - 14 index cards (7 red, 7 blue)  
  - 1 bell  
  - Flipchart for tracking "Council Rules"  
  - Pens  

  ---

  ### **GAME: THE COUNCIL OF TOKENS**  
  **Core Mechanics:**  
  - Players belong to one of two factions (Red/Blue Councils).  
  - Each player holds 3 tokens at the start. Tokens = social capital.  
  - Goal: Gain tokens by performing speech acts that *bind others*.  
  - The game’s "rituals" (procedures) make utterances succeed or fail based on standing, audience, and completion.  
  - **Shadow uptake** is engineered by making players *treat* fictional outcomes as real (e.g., a "demotion" changes gameplay).  
  - **Deferred performatives** emerge via bets/bequests resolved later.  

  #### **Setup (10 min)**  
  1. **Divide Groups:** Randomly hand out red/blue index cards. Reds = Red Council, Blues = Blue Council. Each council sits together.  
  2. **Distribute Tokens:** Give each player 3 tokens.  
  3. **Flipchart Rules:** Write these 4 immutable "Council Procedures":  
     - *Promises*: "I vow to [action]." Requires 1 witness from *opposing* council.  
     - *Bets*: "I wager [X tokens] that [outcome]." Requires opponent’s acceptance. Unresolved until outcome is proven.  
     - *Bequests*: "Upon my exit, I leave [X tokens] to [player]." Ratified only if speaker leaves the game early.  
     - *Demotions*: "I strip [player] of rank." Requires majority vote from speaker’s *own* council.  
  4. **Facilitator Role:** You are the "Keeper of the Bell." Ring it to:  
     - Start/end the game.  
     - Signal a "ritual violation" (utterance fails).  
     - Resolve deferred acts (e.g., if a player leaves).  

  #### **Gameplay (80 min)**  
  - **Phase 1: Promises (20 min)**  
    - Players move freely. To make a promise (e.g., *"I vow to give you 1 token if you stand on one foot for 30 seconds"*):  
      1. Speaker must have ≥1 token.  
      2. An *opposing-council* witness must actively nod approval.  
      3. If the speaker fulfills the promise, the recipient pays them 1 token. If not, the witness claims 1 token from the speaker.  
    - **Key sabotage:** If the witness refuses to nod, the promise is void (bell rings). If the speaker lacks tokens, they can’t vow.  

  - **Phase 2: Bets & Bequests (30 min)**  
    - **Bets:** Player A (Red) says to Player B (Blue): *"I wager 2 tokens that I can write a haiku in 1 minute."* Player B must accept (*"Agreed"*).  
      - If A succeeds, B pays 2 tokens. If A fails, A pays B.  
      - **Deferred performative:** The bet is "pending" until resolved. Unresolved bets are recorded on flipchart.  
    - **Bequests:** *"Upon my exit, I leave 3 tokens to Zara."*  
      - Ratified ONLY if the speaker leaves the game (e.g., for a "break"). If they stay, it’s void.  
      - **Shadow uptake:** Players treat bequests as "active threats" (e.g., targeting a rival to incentivize them to leave).  

  - **Phase 3: Demotions (30 min)**  
    - A player attempts to demote another: *"I strip Lee of rank!"*  
    - Ritual: Speaker’s council votes anonymously (eyes closed, hands up). Majority vote = demotion.  
    - **Consequence:** Demoted players lose 1 token and cannot initiate promises/bets for 5 min.  
    - **Critical twist:** Only council *members* can be demoted. If targeting an outsider, the act fails (bell).  

  #### **Closing the Game**  
  - Ring the bell. Resolve all deferred bets/bequests (e.g., players who took breaks pay out bequests).  
  - Count tokens. Highest token-holder "wins" (prize: bragging rights).  

  ---

  ### **WHY THIS WORKS FOR YOUR CONCEPTS**  
  1. **Shadow Uptake (Produced by Mechanics):**  
     - Players *treat* demotions, vows, and bequests as "real" (e.g., demoted players stop speaking, bequests alter strategies). Yet everyone knows it’s a game—mirroring how readers accept fictional acts. The rules force collective buy-in.  
     - **Predictable Moment:** When a demoted player obeys restrictions despite knowing it’s arbitrary.  

  2. **Deferred Performatives (Produced by Mechanics):**  
     - Bets/bequests hang on future events (e.g., a haiku, a player’s exit). Players feel suspense and strategize around "pending" utterances.  

  3. **Double-Addressed Acts (Addressed in Debrief):**  
     - Hard to stage live (requires reader knowledge characters lack). Use game examples to set it up: *"When Priya made a vow while smirking, did you trust it? Why not?"* → Segues to fiction.  

  ---

  ### **DEBRIEF (30 MIN)**  
  **Goal:** Help participants name what they experienced without your theoretical terms. Start concrete, then abstract.  

  #### **Step 1: Elicit Frustrations (5 min)**  
  - Ask: *"What moments felt unfair or fake? Why?"*  
    - Expected answers: *"My demotion failed because I wasn’t on the council—but I should’ve been eligible!" or "Zara’s promise felt hollow because she glared while saying it."*  
  - **Facilitator Notes:**  
    - List these on flipchart as "Why Did This Fail?" (e.g., "Wrong person," "No witness," "Suspicious tone").  

  #### **Step 2: Map to Conditions (10 min)**  
  - Ask: *"When did an utterance *work*? What made it stick?"*  
    - Guide them to identify:  
      1. **Procedure** (e.g., voting for demotions).  
      2. **Standing** (e.g., council membership).  
      3. **Completion** (e.g., fulfilling a vow).  
      4. **Sincerity** (e.g., bets accepted without eye-rolling).  
  - **DO NOT** use "felicity" or "uptake." Use their words: *"So for a vow, you needed buy-in from an opponent?"*  

  #### **Step 3: Introduce Your Concepts (10 min)**  
  - **Shadow Uptake:**  
    - *"When Marco was demoted, you all treated him as ‘lesser’—even though we know tokens aren’t real. You suspended disbelief because the *rules* made it feel legitimate. In fiction, readers do this when a marriage or threat ‘lands’—they accept void acts because the *story’s procedures* feel real."*  
    - Tie to Game: Use the demotion example.  

  - **Deferred Performatives:**  
    - *"Remember Sam’s bequest? It only mattered if she left—it was ‘pending.’ In novels, wills, bets, or resignations often hang on future events. The suspense isn’t just ‘what happens,’ but ‘will the words *activate*?’"*  
    - Tie to Game: Use unresolved bets.  

  - **Double-Addressed Acts:**  
    - *"When Ellie vowed to help Ben while winking at us, did you trust it? Probably not—because *you* saw the wink, but Ben didn’t. In fiction, a public forgiveness might absolve a character but warn the reader. The act sabotages itself because two audiences hear it differently."*  
    - Tie to Game: Use insincere tones/vows.  

  #### **Step 4: Troubleshoot Predictable Issues (5 min)**  
  - **The Rule-Lawyer:** *"Alex kept inventing procedures! How did that feel?"* → Highlight: *"Rules only work if the group accepts them. In fiction, procedures must feel culturally credible, not arbitrary."*  
  - **The Literalist:** *"But it’s just a game—none of this matters!"* → Respond: *"Yet when your vow was voided, you scowled. Why? Because the *potential* bond mattered. In fiction, the stakes are emotional, not legal."*  
  - **Insincerity vs. Hollow Acts:** *"When Jo made a bet sarcastically, did it fail? No—because the procedure worked. But did it feel meaningful? Probably not. In writing, an insincere vow can *succeed* in the plot (e.g., a marriage happens) but feel hollow to readers."*  

  ---

  ### **WHAT THE EXERCISE CANNOT DO (AND HOW TO FIX IT)**  
  1. **"Binding" Feels Conventional:**  
     - Players will see tokens as "game logic," not real obligations.  
     - **Solution:** In debrief, contrast game tokens with novelistic stakes: *"You felt cheated when your demotion failed. Why? Because the rules promised you agency. In fiction, when a vow fails, readers feel cheated if the *story’s* rules promise it should work."*  

  2. **Double-Addressed Acts Require Omniscience:**  
     - Hard to replicate "reader knowledge" live.  
     - **Solution:** Use your own fiction example during debrief (e.g., *"In my scene, the reader knows the father is unconscious—so the forgiveness is menace, not absolution"*).  

  3. **Deferred Performatives Lack Stakes:**  
     - Players won’t *fear* unresolved bets (it’s just tokens).  
     - **Solution:** Ask: *"Did you avoid making bequests? Why? Because you couldn’t control the outcome. In novels, that loss of control *is* the suspense."*  

  ---

  ### **FACILITATOR SCRIPT (CRITICAL MOMENTS)**  
  - **Opening:** *"This is a game about influence. Your goal is to gain tokens by binding others. Here are the rules—they’re absolute. I’ll ring the bell if an act violates them."*  
  - **When Acts Fail:** Ring bell + say: *"Procedure void."* NO explanation.  
  - **During Demotions:** If a player targets an outsider, ring bell immediately.  
  - **Break Moment:** After Phase 2, force 1 volunteer to "leave early" to activate a bequest.  

  ---

  ### **WHY THIS FITS YOUR BRIEF**  
  - **Theory Avoided:** No jargon during gameplay.  
  - **Shadow Uptake Achieved:** Players *enforce* demotions/bequests despite knowing they’re void.  
  - **Debrief Roots Concepts in Experience:** Uses player frustrations to illuminate your ideas.  
  - **Low Stakes, Real Commitments:** Tokens create micro-bonds (e.g., losing tokens feels punitive).  

  **Prep Work:** Write the 4 Council Rules on flipchart. Pre-divide tokens. Test the bell! This runs on tension—when the bell rings, the room should hold its breath.
