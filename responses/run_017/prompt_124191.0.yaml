prompt: |-
  I should be grateful for your help with a problem that has been nagging at me since I took up philosophy four years ago, having retired after forty years as a hydrologist and water-resources engineer. I still write expert reports, for solicitors and occasionally for inquiries, and a good part of my working life has consisted in saying — and being paid to say — that this failure caused that flood. My professional instinct is that causation is a matter of continuous physical process: water, energy, momentum, a chain of events one could in principle instrument. An absence has no energy and no momentum, and on the face of it cannot push anything. Yet my reports are full of absences. I should like to know whether there is a coherent principle behind the verdicts I actually give, or whether I have been equivocating for decades.

  Below are the cases with the verdicts I give before I begin theorising. I have invented the details, but they are the shapes of situation I have met repeatedly.

  1. I promised to water a colleague's tomato seedlings in her greenhouse during the July heatwave. I forgot. They died of desiccation. Verdict: I caused their deaths. I will not give this up.

  2. The same, except that the seedlings were already infected with a wilt that was lethal irrespective of watering. Verdict: my omission caused them to die on the Tuesday rather than the Friday; it did not cause their deaths. Before I knew about the fungus I would have said otherwise, and I am not convinced that this is merely a change of evidence rather than a change of verdict.

  3. A night-duty operator did not open a spillway, because a contractor had mis-set the alarm threshold three years earlier and no alarm sounded. The reservoir overtopped and the town downstream was flooded. Verdict: I would write that her omission caused the flood, and that the contractor's omission was a background condition. I cannot say whether "background condition" is a weaker causal claim or not a causal claim at all.

  4. A sluice controller's firmware failed to issue the open command because of a coding fault. No human was in the loop. The marsh was not flushed and the reedbeds died. Verdict: unhesitatingly, the fault caused the dieback. I record this because I am entirely comfortable with an absence here — I treat it as a machine having failed — and entirely uncomfortable with the human cases, which troubles me.

  5. A pumping station's backup generator had been left unserviceable through a maintenance omission. A fire destroyed the mains transformer and the generator with it. Verdict: the maintenance omission did not cause the pumping failure, even though but for it the generator would have run. Had the fire taken only the mains, I should have said without pausing that the omission was the cause. My verdict thus seems to turn on whether the safeguard would in fact have been called upon, not on whether it was in place.

  6. A levee required a hundred sheet-piles. The ganger ordered ninety-nine. The breach began precisely where the hundredth would have stood. Verdict: the omission caused the breach, notwithstanding that a single pile is a negligible fraction of the defence. I suspect I hold this verdict partly for a bad reason: it is where the engineer points.

  7. I did not write to my MP about flood-defence maintenance, and neither did ten million others. Verdict: my omission caused nothing. I am tempted to add that the electorate's collective failure did cause something, and I cannot say what that amounts to.

  8. The pair I cannot reconcile. (a) In 1962 a catchment board considered planting a shelterbelt on a slope and minuted a decision not to. In 2011 the slope failed and buried three houses; an arboriculturalist colleague assures me the root cohesion would have held it. Verdict: the 1962 decision caused the 2011 failure. (b) In 2013 a storm surge flooded a town for which no sea wall had ever been proposed. Verdict: I refuse to say that the absence of a sea wall caused that flooding. The only difference I can find is that in the first case someone considered the measure and declined it, and in the second nobody did — and I dislike that, because what a board minuted in 1962 cannot, it seems to me, be among the causes of a hillside failing in 2011. Had the town rejected a sea wall on cost grounds in 1970, I should be much more inclined to call its absence a cause, and I cannot see why a fifty-year-old vote should make a difference to what the water did.

  9. The case on which I oscillate. The duty officer did not telephone the downstream warden, because the shared dashboard showed a green tick indicating that the automatic alert had gone out. The alert had in fact failed silently and the tick was stale. On Mondays I say her omission was a cause: she was the last safeguard and she did not act. On Thursdays I say it was not: she had excellent reason to think acting unnecessary, and the cause was the telemetry failure. I cannot settle which of these is my considered view.

  What I want is the principle, if there is one. Please state it precisely enough to be applied, and say which of my cases motivates each of its clauses. In particular:

  - Which of my verdicts it cannot accommodate, and which of them you think I ought to overturn. I would rather give up a verdict than keep a principle that only fits by being baroque, but I should like to be told the price of each.
  - Whether the pattern I have described is a pattern of causal judgements at all, or whether I have been tracking blame, responsibility, or explanatory salience and calling it causation. If the latter, tell me what I should put in an expert report instead.
  - Whether a principle is available on which what people expected, planned, promised, or were employed to do is irrelevant to whether their omission was a cause. I should prefer such a principle, on the ground that causation should be the sort of thing a hillside does not care about; but if my own verdicts in cases 1, 3, 8 and 9 foreclose it, say so plainly.
  - What the principle predicts for two cases I have not listed: first, an omission attributed to a nine-person committee in which no individual member was tasked with the action; and second, an omission that merely permits an already-begun harmful process to continue, as where an operator does not close a valve on a leak that started before his shift. I notice I find "he allowed the tank to empty" much easier to write than "he caused the tank to empty", and I should like to know whether that ease is principled.

  I am not asking for a bibliography or for the names of the positions I have stumbled into; I can find those myself. I want the principle, the verdicts it forces, and the verdicts it costs me.
reasoning: |-
  Okay, this hydrologist-turned-philosopher has a fascinating dilemma. He's spent decades professionally attributing flood events to specific causes, but now struggles with how "absences" (omissions, failures to act) fit into his physical understanding of causation. His nine cases reveal deep inconsistencies in how he assigns causality to non-events, from forgotten tomato plants to unbuilt sea walls. 

  First, I notice his scientific instincts clash with legal/practical necessity. As a water engineer, he knows causation requires energy transfer - but his reports constantly cite omissions as causes. Case 4 is telling: he's comfortable blaming a machine's "failure" but uneasy about human omissions. There's an unspoken hierarchy here - physical systems get causal passes that social systems don't.

  The core tension emerges in case 8: why does a 1962 committee decision "cause" a 2011 landslide, while an unproposed sea wall doesn't "cause" flooding? His intuition points to counterfactual dependence (but-for condition), but that breaks down in cases like #5 where the backup generator wouldn't have worked anyway. And case #7 shows scale matters - one voter's omission feels negligible, collective omission feels causal.

  Hmm... his oscillation in case 9 is particularly revealing. When he blames the duty officer, it's about broken safeguards; when he doesn't, it's about reasonable expectations. This suggests two different frameworks at war: one focused on functional roles in systems, the other on proximate physical causes.

  For a unifying principle, I'm considering a three-part test: 
  First, establish but-for necessity - would the harm have occurred without this specific omission? That handles cases like #1 but excludes #2 (since plants would've died anyway). 
  Second, assess whether the omission breached a specific risk-management function - explaining why the ganger's missing pile (#6) matters more than my unused vote (#7). 
  Third, require direct pathway vulnerability - the harm must exploit the exact gap created, like the precisely located breach in #6.

  This framework would force him to surrender verdicts where functions weren't clearly assigned (like the 9-person committee) and reframe "allowed" vs "caused" language for ongoing processes. It preserves physics-first thinking by treating systems (including human/machine safeguards) as causal networks with defined failure points.

  Most importantly, it distinguishes causation from blame. In case #3, the contractor's omission isn't the cause but a background condition because the night operator had an active duty to override systems. The principle keeps causation objective while accommodating his practical verdicts - with one exception: the 1962 committee decision (#8a) would get downgraded to background condition since no ongoing maintenance function existed.
answer: |-
  Your dilemma reveals a profound tension between physical causation and functional responsibility. After analyzing your cases, I propose this principle:

  **An omission is causal iff:**
  **(1) There was a specific functional capacity to prevent the harm;**
  **(2) That capacity was not deployed when needed;**
  **(3) Its deployment would have interrupted the causal chain with high probability.**

  *Breakdown by your cases:*

  - **Cases motivating clause (1) (Specific function):**  
    Case 1: You had a *promised* watering function.  
    Case 3: Night operator had *assigned* spillway duty.  
    Case 6: Ganger had *duty* to order 100 piles.  
    Case 8a: The 1962 board *actively decided* against planting (creating functional expectation).  
    *Contrast:* Case 7 (no individual function), Case 8b (no assigned sea-wall function).

  - **Cases motivating clause (2) (Non-deployment):**  
    Case 4: Firmware *failed* its designed command function.  
    Case 9: Duty officer didn’t act despite her role.  
    *Contrast:* Case 2 (watering wouldn’t change outcome).

  - **Cases motivating clause (3) (Interruptive probability):**  
    Case 5: Generator wouldn’t have worked (no interruption possible).  
    Case 2: Watering wouldn’t prevent death.  
    Case 6: 100th pile *specifically* prevented breach.  

  ---

  **Reconciling your verdicts:**  
  | Case | Your Verdict | Principle’s Verdict | Conflict? |  
  |------|--------------|---------------------|----------|  
  | 1 | Causal | Causal (promised function) | ✓ |  
  | 2 | Not causal | Not causal (fails clause 3) | ✓ |  
  | 3 | Omission causal | Causal (operator’s function) | ✓ |  
  | 4 | Causal | Causal (firmware function) | ✓ |  
  | 5 | Not causal | Not causal (fails clause 3) | ✓ |  
  | 6 | Causal | Causal (ganger’s function; clause 3 met) | ✓ |  
  | 7 | Not causal | Not causal (no individual function) | ✓ |  
  | 8a | Causal | **Not causal** (conflict: no *ongoing* function by 2011) | ✗ |  
  | 8b | Not causal | Not causal (no assigned function) | ✓ |  
  | 9 | Oscillates | **Not causal** (telemetry failure primary; operator reasonably relied on system) | ✗ |  

  **Key conflicts:**  
  - **Case 8a:** You must surrender this verdict. The 1962 decision is policy, not an *operational omission*. It created vulnerability but wasn’t a functional failure *at time of event*.  
  - **Case 9:** Thursday view is correct. The operator’s omission fails clause (1)—her function was contingent on system alerts, which failed independently.  

  ---

  **Answers to specific questions:**  
  1. **Price of principle:** You lose **Case 8a**. Its "historical decision" lacks the *temporal specificity* of causation. Retaining it makes causation arbitrary.  
     
  2. **Is this causation or blame?**  
     It’s *functional causation*—distinct from moral blame. Your reports track *system failures*, not culpability. Example: Case 4 (firmware) has no moral agent, yet causation holds. Replace "X caused Y" with **"Functional failure in X permitted Y"** in reports where omissions involve complex systems.  

  3. **Can expectations/roles be irrelevant?**  
     **No.** Your verdicts (Cases 1,3,6) require functional roles. Physics alone can’t explain why ordering 99 piles causes a breach (Case 6) but not voting (Case 7). Causation in socio-technical systems *must* incorporate assigned functions.  

  4. **Predictions for new cases:**  
     - **9-person committee:** Not causal unless *specific members* had defined alert functions (fails clause 1).  
     - **Operator not closing valve on pre-existing leak:** **"Allowed" is correct.** Fails clause (3) if the leak would have emptied the tank regardless. Use **"Failed to mitigate"** instead of "caused".  

  ---

  **Why this works for hydrology:**  
  The principle mirrors hydraulic systems:  
  - Pumps have *functions* (clause 1).  
  - Failure to activate is *non-deployment* (clause 2).  
  - Flood prevention requires *effective intervention* (clause 3).  

  Absences are causal only when they represent **broken links in a chain of functional dependencies**—like a missing sensor in a SCADA system. Your discomfort with human cases arises because roles create *moral* expectations, but the principle isolates *operational* functions.  

  **Final advice:** In expert reports:  
  - For *technical systems* (Case 4): Use "system failure caused".  
  - For *human omissions* (Case 3): Use "failure to execute assigned function permitted".  
  - For *policy decisions* (Case 8a): Use "historical policy increased vulnerability," avoiding "caused".  

  This preserves scientific rigor while acknowledging engineered systems rely on functional roles. You haven’t been equivocating—you’ve been navigating the physics-responsibility interface skillfully. The principle formalizes your intuition.
