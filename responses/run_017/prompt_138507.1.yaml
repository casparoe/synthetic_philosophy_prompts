prompt: |-
  My old supervisor has been sitting on a manuscript about Gongsun Long for something like ten years — the School of Names, the White Horse dialogue, and a chapter that I think is going to be about the hardness-and-whiteness bit — and I'm finally writing a response to it. Before I do, I want to guess what she'll say about a case she's never ruled on, becuase I'd rather not walk into the seminar and have her settle it in thirty seconds flat. Her verdicts so far, from the manuscript and from years of reading group:

  - a white horse is not a horse — she's completely happy with it, and gets irritated when people say it's just an equivocation on two senses of "is". In the translation we use, the two moves she leans on are "'Horse' is what designates shape. 'White' is what designates color. What designates color is not what designates shape" and then the seeking bit: "If one seeks a horse, yellow and black horses may all be delivered. If one seeks a white horse, yellow and black horses may not be delivered."
  - a brown horse is not a horse — also fine; she generalizes past the one example without blinking.
  - point at an actual white horse standing in a field and ask "is that a horse?" and she says yes, obviously — the thesis was never that white horses don't exist or that they aren't horses, and she thinks the objector basically gets her to concede that much.
  - a horse is not a white horse — also fine; she says the "not" runs both ways.
  - the hard white stone: the hardness and the whiteness are separate, you get one by touch and one by sight and neither of them is the stone, and she insists this is the same point as the horse case rather than a different one.
  - a horse is not a horse — here she stops and says no. The paradox needs two different names to get going, and she thinks the Hui Shi paradoxes people always wheel out are the same insight pushed to the limit, not a licence to say any old pair of terms is a "not".

  Here's the case I want to put to her. Imagine a kingdom where every single horse is white — not by any law of nature, just because the whole breeding stock goes back to one white stallion, and there are brown horses over the border. In that kingdom, ask for a horse and you get a white one; ask for a white horse and you get exactly the same animal; there is no way of going and fetching something that answers to one request and not the other. Does "a white horse is not a horse" still hold there?

  What I'm after isn't really the answer, it's the machinery. As far as I can tell at least two quite different rules fit everything she's said so far: one where the compound term picks out form-plus-color and that's just never the same thing as the bare form, so the verdict shouldn't care what the local horses happen to look like; and one that runs off the seeking test, so that once the two requests can't come apart in what would satisfy them, the "not" ought to collapse. Plus maybe a third that's just tracking whether the two terms pick out the same class of things. So: which rules actually fit her whole track record and not just the headline case, which way does each of them go in the white kingdom, which one would you bet she's running and why, and — the bit I keep going in cirlces on — what's the one further case that would flush out which rule it is?

  Two candidates I've got, and I honestly can't tell whether either is the right probe: (i) the same setup but where horses just are white, necessarily, no brown ones possible anywhere; (ii) does the thing run upwards — is a horse not an animal, on her view? Tell me which of these (if either) actually separates the rules, which pair of rules each one separates, and if neither does the job, what case would.
reasoning: |-
  Okay, I need to figure out what the user's old supervisor would say about this white horse paradox in a kingdom where all horses are white. Let me start by understanding the supervisor's established positions. She accepts that "a white horse is not a horse" based on the designation of shape vs. color and the seeking test. She also agrees that pointing to a white horse and calling it a horse is fine, so it's not about existence. The key is the separation of attributes.

  The user presents a scenario where all horses are white, so asking for a horse or a white horse results in the same animal. The question is whether "a white horse is not a horse" still holds here. The user is trying to anticipate the supervisor's response and understand the underlying rules she uses. They mention two possible rules: one based on the form-plus-color always differing from bare form, and another based on the seeking test where if the requests don't come apart, the "not" collapses. A third might be about the classes being identical.

  First, I need to recall the supervisor's principles. She dismisses equivocation on "is," so the rule isn't about wordplay. The seeking test is crucial—since normally asking for a horse includes non-white horses, they are different. But in this kingdom, both requests yield the same set. So if the seeking test is the core, then the "not" might not hold here. But the attribute separation view would say that even if all horses are white, "white" designates color and "horse" designates shape, so they are still distinct concepts. That rule wouldn't care about the actual horses.

  Now, the user's proposed test cases: (i) a world where horses are necessarily white, no brown possible. (ii) whether a horse is not an animal. How do these help distinguish the rules?

  For (i), in a necessary white horse world, the attribute separation rule would still say "white horse is not a horse" because color and shape are distinct. The seeking test rule, however, would collapse the "not" because there's no possible difference in what satisfies the requests. The class identity rule would also say the "not" doesn't hold since the sets are identical.

  For (ii), "a horse is not an animal." The supervisor has ruled out cases with the same name, like "a horse is not a horse." So if "animal" is a different term, but hierarchically related, the attribute separation might apply—horse designates specific shape, animal designates broader category. The seeking test: asking for a horse vs. an animal—requesting an animal could be satisfied by a cow, so they don't co-vary. Thus, the "not" should hold. The class rule would say horses are a subset of animals, so they aren't identical, so "not" holds. But the supervisor might see this as a category mistake or different from the original paradox.

  So the critical difference between rules is how they handle cases where terms co-vary necessarily. The seeking test and class identity rules would drop the "not" in such cases, but the attribute separation rule would maintain it regardless.

  The user's kingdom scenario is contingent—horses happen to be white, but could be otherwise. The necessary white horse case (i) forces the issue. If the supervisor maintains the "not" even in necessary cases, she's using attribute separation. If she drops it, she's using seeking test or class identity.

  But the supervisor's rejection of "a horse is not a horse" suggests she requires two different attributes. So in the horse/animal case, "horse" and "animal" are different attributes, so "a horse is not an animal" might be acceptable? Wait, no, that seems counterintuitive. Actually, "a horse is not an animal" would be false normally. But in her framework, the paradox is about the separation of attributes. So maybe she'd say that "animal" designates a broader category, so they are distinct, but that might not lead to "a horse is not an animal."

  Perhaps the hierarchical case isn't analogous because "animal" includes more than shape; it's a different kind of designation. The supervisor's examples focus on same-level attributes like color and shape. So probing with "a horse is not an animal" might not be effective. Instead, the necessary scenario (i) is a better test.

  For the kingdom case, if the supervisor uses attribute separation, she'd say the "not" holds regardless of the horse population. If she uses seeking test, she'd drop it here. The class rule would also drop it.

  Given her emphasis on designation and the Hui Shi paradoxes, she likely prioritizes the attribute separation over contingent facts. Her irritation at equivocation claims suggests she sees this as a metaphysical or logical point, not empirical. So she'd probably maintain the "not" in the kingdom scenario.

  The best probe is the necessary white horse world. If she still says "not," she's using attribute separation. If she says it collapses, she's using seeking test or class identity.

  Also, the user's other candidate, "a horse is not an animal," might not cleanly separate because "animal" is a different kind of term—superordinate category. The seeking test would still show they differ since requesting an animal can be satisfied by non-horses. But the attribute separation might still apply, leading her to accept "a horse is not an animal" as paradoxically true? That seems unlikely. She might reject it as category confusion or not analogous. So (ii) is less reliable.

  Therefore, the necessary white horse case is the better probe to distinguish the rules.
answer: |-
  Based on your supervisor's established positions—especially her rejection of equivocation, her reliance on designation/shape-color separation, her emphasis on the "seeking" test, and her rejection of same-term paradoxes ("a horse is not a horse")—I'll break this down step by step. Her core machinery appears to be a *logical/metaphysical distinction based on designation*, not contingent facts about the world. The "white kingdom" case you propose is an excellent stress test, and it reveals two viable rules that fit her track record. I'll outline the rules, predict her verdict in the white kingdom, identify which rule she likely uses, and provide a targeted probe to settle it.

  ### 1. The Two Rules That Fit Her Track Record
  Both rules align with her published positions and seminar rulings, but they diverge in edge cases. Neither is purely about class identity (which she implicitly rejects by accepting "a brown horse is not a horse" despite overlapping extensions).

  - **Rule 1: Attribute Designation Separation (ADS)**  
    - **Mechanism**: "White horse" and "horse" designate fundamentally different *attributes*: "horse" designates *shape* alone, while "white horse" designates *shape-plus-color*. The "not" holds because the attributes are distinct conceptual categories, regardless of empirical coextension.  
    - **Fits her track record**:  
      - White/brown horse cases: Separation of color/shape designation ("What designates color is not what designates shape").  
      - Actual white horse: "Yes, it's a horse" doesn't contradict ADS because the paradox is about *terms/attributes*, not object-level reference.  
      - Hard white stone: Directly analogous—hardness (touch) and whiteness (sight) are separate designations, neither is the stone.  
      - "A horse is not a horse": Rejected because no distinct attributes; same designation twice.  
    - **White kingdom verdict**: ADS says "a white horse is not a horse" **still holds**. Even if all horses are white, "white" designates color and "horse" designates shape—they remain distinct attributes. Contingent coextension doesn't collapse the metaphysical distinction.  

  - **Rule 2: Seeking Test Covariance (STC)**  
    - **Mechanism**: The "not" holds iff the requests "seek horse" and "seek white horse" *can yield different satisfiers* in some possible scenario (i.e., they don't covary necessarily). If the requests *always* return the same things, the distinction collapses.  
    - **Fits her track record**:  
      - White/brown horse cases: Seeking a horse allows non-white horses; seeking a white horse excludes them → requests can diverge.  
      - Actual white horse: "Yes, it's a horse" because object-level reference isn't at issue; the paradox is about satisfaction conditions.  
      - Hard white stone: Seeking hardness (by touch) vs. whiteness (by sight) can be satisfied separately → distinct.  
      - "A horse is not a horse": Rejected because "seek horse" and "seek horse" always covary perfectly.  
    - **White kingdom verdict**: STC says "a white horse is not a horse" **does not hold**. Since all horses are white, seeking a horse and seeking a white horse *always* return identical sets—there's no scenario where the requests diverge (even if they could in another kingdom).  

  ### 2. Prediction for the White Kingdom Case
  - **Her likely verdict**: ADS wins. She'll say "a white horse is not a horse" **still holds**.  
  - **Why?**  
    - Her manuscript and reading group behavior show deep commitment to *designation* as a fixed, non-contingent feature. She gets irritated at equivocation claims because she sees this as a metaphysical point about attributes, not wordplay or empirical sets.  
    - The stone example is key: she insists it's the "same point" as the horse, and hardness/whiteness are separate *even when co-present in one stone*. This mirrors ADS—attributes are distinct regardless of coinstantiation.  
    - STC would make the paradox contingent on horse populations, which undermines her treatment of Hui Shi paradoxes as "the same insight pushed to the limit." If STC were primary, Hui Shi-style contradictions (e.g., "I go to Yue today and arrive yesterday") might be dismissed as contingent, but she takes them seriously as logical extremes.  
    - Her rejection of "a horse is not a horse" emphasizes the need for *two designations* (shape vs. color), not two extensions.  

  ### 3. Your Proposed Probes: Why They Work (or Don't)
  - **Probe (i): Necessarily white horses (no brown possible anywhere)**  
    - **Purpose**: Forces the issue on contingency vs. necessity.  
    - **How it separates rules**:  
      - **ADS**: Unchanged. Attributes are distinct → "a white horse is not a horse" **holds**.  
      - **STC**: Requests *cannot* diverge in any possible world → "a white horse is not a horse" **does not hold**.  
      - **Class identity rule (bonus)**: Extensions are identical → "not" **does not hold** (but she'd reject this rule anyway).  
    - **Value**: This *perfectly* separates ADS from STC. If she maintains the "not," it confirms ADS. If she drops it, it confirms STC. Given her track record, expect ADS.  

  - **Probe (ii): "Is a horse not an animal?"**  
    - **Purpose**: Tests hierarchical designation (shape vs. broader category).  
    - **How it separates rules**:  
      - **ADS**: "Horse" designates specific shape; "animal" designates a general category → distinct attributes → "a horse is not an animal" **could hold** (but might feel counterintuitive).  
      - **STC**: Seeking a horse vs. an animal can yield different results (e.g., a cow satisfies "animal" but not "horse") → "not" **holds**.  
      - **Problem**: Both rules agree the "not" holds, so it *doesn't separate them*. Worse, she might reject this as a category error. Her focus is on same-level attributes (color/shape), not hierarchy. In seminar, she'd likely say: "This is like comparing hardness to a stone—'animal' isn't a parallel attribute to 'horse'." It doesn't probe the white kingdom tension.  

  ### 4. The Best Probe to Flush Out the Rule
  - **Use probe (i) (necessarily white horses)**. It cleanly isolates the core disagreement:  
    - If ADS is her rule, the "not" holds even here.  
    - If STC is her rule, the "not" collapses.  
    - *Why it's better than your white kingdom case*: Your kingdom is contingent (horses *happen* to be white), so an STC-leaning supervisor might waffle (e.g., "It holds in principle but not here"). Probe (i) forces a clear, necessary-world commitment.  

  - **Seminar strategy**: Present the necessarily white horse probe *first*. Say:  
    > "Suppose horses are *essentially* white—no non-white horse is metaphysically possible. Does 'a white horse is not a horse' still hold?"  
    If she says **yes**, she's running ADS. Follow up with your contingent kingdom case—she'll say the same.  
    If she says **no**, she's running STC. Then your kingdom case becomes decisive—she'll drop the "not" there too.  

  ### Why This Fits Her Broader Philosophy
  Her work on Gongsun Long seems to treat the paradoxes as exposing *conceptual distinctions in language and perception* (like the stone's hardness/whiteness). ADS aligns with this: "white horse" isn't just a subset of "horse"; it's a compound designation that changes what's picked out. The seeking test is illustrative but secondary—a tool to reveal the attribute distinction, not define it. If she leaned on STC, her stone argument would wobble (you always get hardness and whiteness together in a stone), but she doesn't. 

  **Betting advice**: 90% odds she's on ADS. She'll rule the "not" holds in your white kingdom, and probe (i) will confirm it. The one risk: if she *does* use STC, she might invoke "possible worlds" to preserve the distinction in your kingdom ("Brown horses *could* exist, so the requests *can* diverge"). But her stone stance suggests she won't—attributes are separable even when co-instantiated. 

  Good luck in the seminar—come prepared with probe (i), and watch for whether she treats designation as language-invariant (ADS) or satisfaction-conditional (STC). This is a sharp challenge; she’ll appreciate it.
