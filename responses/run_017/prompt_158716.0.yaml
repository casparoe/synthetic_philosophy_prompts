prompt: |-
  hey — I write novels, and I've got a library event coming up for the paperback of my last one and I want a teaching plan for one bit of it, not an explanation.

  Context: there's a scene where my protagonist Ada gets offered a bet. One urn, 90 balls. She's told exactly 30 are red; the other 60 are black or yellow in some ratio nobody will tell her. She'd rather bet on red than on black. Then, later in the same scene, she'd rather bet on black-or-yellow than on red-or-yellow. That's the whole scene. Readers keep writing in saying either (a) this is a continuity error, Ada's just being thick, or (b) fine, she's a cautious person, end of. Both readings bore me, and honestly I could of cut the scene, but now I have to stand up in front of forty people who've all read the book, none of them economists, two or three of whom have definately Googled "paradox" on their phone on the way in. I have about twenty minutes including questions.

  So: plan the twenty minutes for me. Sections, in this order:

  **The sequence** (~350 words) — the order the pieces have to arrive in, and what genuinely depends on what, not just a list of things to mention. My instinct is that "there are two different kinds of not-knowing" has to land before I say anything about urns, and that the bit where her two choices contradict each other should come after the room has committed to one of the choices out loud. Tell me if I've got that backwards, and what actually has to be in place before anything else is.

  **The urn** (~200 words) — whether to keep the urn or swap in something from the book (a bookie who won't disclose the field, an audited raffle, a lottery that looks rigged). What the carrying example must have — a known number, a missing number, and the missing number staying missing — and one thing it must not have.

  **The extra urn** (~200 words) — the bit I care most about, and it's not from the book, I'd be inventing it for the talk. Same 90 balls, same 30 red, but the remaining 60 get split by a notarised machine drawing uniformly over the possible splits: she knows the distribution of the compositions, just not which one. Is that still ambiguity, or does knowing the second-order numbers dissolve the whole thing? And where in the sequence does it go — payoff, or a distraction I should cut? Bonus: what if instead the composition was picked by somebody who wants her to lose.

  **What they'll get wrong** (~400 words) — the misconceptions, with the exact point in the sequence to kill each one. The ones I'm braced for: "that's just risk aversion"; "she must have some guess, so average it" (this is the one I think matters most — isn't the point that no single guess produces both choices?); "then she can be money-pumped / Dutch-booked, so it's a bug not a preference" (I'm not sure I can answer that in twenty minutes — tell me where to place it and whether "she'd just refuse to play at all" is a cop-out); "she avoids the unknown urn whichever colour you offer, so what's paradoxical" (I think I need to be ready to point at the complement bets specifically, and I might be the confused one); and someone mixing it up with the Allais thing. Plus the novelist-specific one: that this is a character note about Ada being timid rather than something structural about missing numbers. Give me anything I'm missing too.

  **The check** (~120 words) — one question at the end that shows the idea landed rather than that the room got sleepy. My guess is asking them to design a version where Ada takes the ambiguous urn and say what had to change, but maybe that's too much for a room like this.

  **What I refuse to explain** (~120 words) — what I should explicitly say out loud that I'm not going into. I'm not naming decision theories and I'm not recommending anything to read, it's a library not a seminar, but tell me what else to close the door on, and what to do with the two phone-Googlers when they interrupt.
reasoning: |-
  We are going to design a 20-minute teaching plan for a library event. The goal is to explain a scene in the novel where the protagonist Ada makes two betting choices that seem contradictory to many readers. The key is to clarify that this is not a continuity error or a simple character trait (like timidity) but a reflection of a deeper concept: ambiguity aversion in decision-making under uncertainty.

  The plan is structured as follows, with approximate time allocations (total 20 minutes):

  1. **The Sequence (4 minutes)**: We need to set up the problem step by step, ensuring the audience grasps the two kinds of uncertainty and how they lead to Ada's choices. We'll start by establishing the two types of uncertainty, then present the choices sequentially, and finally show the apparent contradiction.

  2. **The Urn (3 minutes)**: We'll explain why the urn example works and what essential features it must have. We might consider alternatives from the book, but the urn is a classic and clear example. We must avoid adding any extra information that isn't in the problem.

  3. **The Extra Urn (3 minutes)**: We'll introduce a variation to clarify the difference between risk (known probabilities) and ambiguity (unknown probabilities). This will help show that knowing the distribution of the unknown can change the situation. We'll place this after the main example to reinforce the concept.

  4. **What They'll Get Wrong (6 minutes)**: We'll address common misconceptions at the points in the sequence where they are likely to arise. We'll preempt these by designing the flow to tackle them as we go, and then explicitly address the top misconceptions.

  5. **The Check (2 minutes)**: We'll end with a quick question to test understanding.

  6. **What I Refuse to Explain (2 minutes)**: We'll set boundaries on what we won't cover and how to handle interruptions.

  Total: 20 minutes (allowing for a bit of flexibility).

  Now, let's break down each section as requested.

  ---

  **The Sequence (~350 words)**

  We must build the sequence carefully. The order is critical:

  1. **Start with two types of uncertainty (1 minute)**:
     - Explain that sometimes we know the odds (like a fair coin: 50-50) and sometimes we don't (like a coin from a magician's bag: we have no idea if it's fair). Call the first "risk" (known probabilities) and the second "ambiguity" (unknown probabilities). Emphasize that ambiguity is when you don't even have a guess.

  2. **Introduce the urn (1 minute)**:
     - Describe the urn: 90 balls, 30 red. The other 60 are black and yellow, but the ratio is unknown. It could be 0 black and 60 yellow, or 60 black and 0 yellow, or anything in between.

  3. **Ada's first choice (1 minute)**:
     - Present the first bet: Ada is offered a bet on red or a bet on black. She prefers to bet on red. Why? Because with red she knows the exact chance (30/90 = 1/3), but with black she doesn't know the chance (it could be anywhere from 0 to 60/90). This is ambiguity aversion: she avoids the bet with the unknown probability.

  4. **Ada's second choice (1 minute)**:
     - Now, later, she is offered a bet on black-or-yellow versus a bet on red-or-yellow. She prefers black-or-yellow. Why? Because black-or-yellow is the same as "not red", and she knows that chance: 60/90 = 2/3. But red-or-yellow? The chance of red is fixed at 1/3, but yellow is part of the ambiguous 60. So the total chance of red-or-yellow could be as low as 30/90 (if yellow=0) or as high as 90/90 (if yellow=60). That's ambiguous! So she avoids it and chooses black-or-yellow (which is known: 60/90).

  5. **The apparent contradiction (1 minute)**:
     - Point out: In the first choice, she avoids black (which is ambiguous) in favor of red (known). In the second, she avoids red-or-yellow (ambiguous) in favor of black-or-yellow (known). But note: black is part of the ambiguous urn, and now she's betting on it? The key is that in the second bet, by combining black and yellow, she gets a known probability (60/90). The contradiction is only apparent and reveals that she is not avoiding black per se, but ambiguity.

  This sequence must be built so the audience first understands the two types of uncertainty, then sees each choice in isolation, and then the contradiction. The contradiction should be revealed only after both choices are clear.

  ---

  **The Urn (~200 words)**

  We'll stick with the urn. It's a standard example in decision theory (Ellsberg paradox) and works because:

  - **Must have**:
    1. A known number (30 red).
    2. A missing number (the split of the other 60 between black and yellow).
    3. The missing number stays missing: no information is given about the split, so the probabilities for black and yellow are ambiguous.

  - **Must not have**: Any hint of a prior distribution. For instance, we must not say "the split is random" because that would turn ambiguity into risk (we'd then have known probabilities over the splits). The urn is fixed, but the composition is unknown.

  Alternatives from the book (like a bookie who won't disclose the field) might work, but the urn is visual and easy to grasp. We could mention a raffle where the total tickets are known (say 90) and 30 are known to be winning tickets (like red), but the rest are a mix of two types of losing tickets (black and yellow) and the organizer won't tell how many of each. The key is that the ambiguity is about the composition of the non-red part.

  Avoid: any suggestion that Ada has a guess about the split. The point is that she does not use any guess.

  ---

  **The Extra Urn (~200 words)**

  Introduce an extra urn for clarification:

  - Same urn: 90 balls, 30 red. But now the remaining 60 are split by a notarized machine that chooses a random number of black balls (from 0 to 60) with uniform probability, and the rest yellow. So we know the distribution of the splits: each possible number of black balls (0,1,2,...,60) is equally likely.

  - **Is this still ambiguous?** No! Now we can calculate the exact probability for black: it's the average of the possible chances. The chance of drawing a black ball is the expected value of (number of black)/90. Since the number of black is uniform from 0 to 60, the expected number of black is 30, so the probability is 30/90 = 1/3. Similarly for yellow. So now, betting on black has known probability 1/3, and betting on red is also 1/3. Ada would be indifferent between red and black.

  - **Where in the sequence?** After the main example, to show the difference between ambiguity (the original) and risk (this version). In the extra urn, Ada would not have the same pattern of choices. She would be consistent.

  - **Bonus: if the composition is picked by an adversary?** That would be a case of ambiguity again, and even worse. It might make her more averse to betting on black. This could be mentioned briefly to show that the machine example is different because it adds a known chance mechanism.

  This extra urn is not a distraction. It helps to show that the key is the type of uncertainty. Place it after the main example and before addressing misconceptions.

  ---

  **What They'll Get Wrong (~400 words)**

  We'll address these at specific points:

  1. **"That's just risk aversion"**: 
     - **When**: After explaining the first choice (betting on red vs black). 
     - **Kill it by**: Pointing out that risk aversion is about known probabilities (e.g., preferring a sure $50 over a 50% chance of $100). Here, the aversion is to not knowing the odds. In the second choice, she takes a bet with a known 2/3 chance (black-or-yellow) over an ambiguous one (red-or-yellow). That's not risk aversion; it's ambiguity aversion.

  2. **"She must have some guess, so average it"** (most important):
     - **When**: After presenting the apparent contradiction.
     - **Kill it by**: Showing that if she averaged, she would assign black a probability of 30/90 (assuming uniform prior over splits). Then she would be indifferent between red and black. But then in the second choice, she would also be indifferent between black-or-yellow (60/90) and red-or-yellow (which she would compute as 30/90 + 30/90 = 60/90). So she would have no preference. But in the story, she does have a preference in both cases. Therefore, she isn't averaging. The point is that without a known probability, she doesn't use a single guess.

  3. **"Then she can be money-pumped / Dutch-booked"**:
     - **When**: After explaining the whole sequence and the extra urn.
     - **Place it**: In the Q&A or when addressing misconceptions. 
     - **Answer**: Yes, if she were to make both bets simultaneously, she would be open to a Dutch book. But she might avoid that by not accepting the bets in a way that exposes her to that. Also, note that these are two separate offers. She might just refuse to play multiple rounds. But more importantly, this is a descriptive point about human behavior (which is well-documented in experiments) and not necessarily about rationality. For the talk, we can say: "Yes, this might happen, but the point is that people do exhibit these preferences, and it's a real psychological phenomenon."

  4. **"She avoids the unknown urn whichever colour you offer, so what's paradoxical?"**:
     - **When**: After the second choice.
     - **Kill it by**: Pointing to the complement bets. In the first choice, she avoids black (which is ambiguous) but in the second choice, she chooses black-or-yellow (which is not ambiguous because it's the complement of red). So she doesn't avoid the urn altogether. She avoids specific ambiguous bets. The paradox is in the pattern: she prefers red to black (so she likes red more than black) but also prefers black-or-yellow to red-or-yellow (so she likes black-or-yellow more, which implies she likes black more in that context). This reversal is the paradox.

  5. **Mixing with Allais**:
     - **When**: If someone brings it up.
     - **Kill it by**: Briefly noting that Allais is about known probabilities and violation of expected utility, while this is about unknown probabilities.

  6. **Character note (timidity)**:
     - **When**: At the beginning, when setting up the two types of uncertainty.
     - **Kill it by**: Stressing that this is a structural response to missing information, not a personality trait. We could say: "If it were timidity, she might avoid any bet. But here she is taking bets: she just prefers the ones with known odds."

  Additional misconception: "She's inconsistent." We show that the choices are consistent under ambiguity aversion: she always prefers known probabilities.

  ---

  **The Check (~120 words)**

  At the end, ask:

  > "Suppose we change the setup: now there are 30 red balls, 30 black, and 30 yellow. But the urn is shaken, and then 30 balls are randomly removed (without anyone seeing the colors). Now we have 60 balls left. Ada is offered a bet on red. Would she prefer that to a bet on black? Why or why not?"

  This tests understanding:
  - In this case, the chance of a red ball is ambiguous. The number of red left could be 0 to 30. So she would avoid betting on red or black? Actually, she might prefer to bet on red? No, because both are now ambiguous. She might be indifferent? But note: the original setup had a known quantity (30 red) and an unknown split. Here, even red is now ambiguous. So she might avoid both? The point is that she would treat both as ambiguous and might prefer neither, or be indifferent. But the key is that the known probability is gone.

  Alternatively, if time is short, ask: "In the extra urn (with the machine), would Ada have the same preferences? Why not?" (Answer: No, because then the probabilities are known.)

  ---

  **What I Refuse to Explain (~120 words)**

  Explicitly state:

  - "I won't be going into the technical decision theories (like Gilboa-Schmeidler or others) that model this. This is a library event, not a seminar."
  - "I also won't be recommending further reading, though you can always ask me after."
  - "We're focusing on the concept of ambiguity and why it leads to these choices, not on the rationality debates or how to fix it."

  For the phone-Googlers:
  - If they interrupt, say: "That's an interesting point, but let's make sure everyone is on the same page first. Let me get through the setup, and then we can come back to that in Q&A."
  - If they bring up the Ellsberg paradox by name, acknowledge it: "Yes, this is a version of the Ellsberg paradox, which illustrates ambiguity aversion. We're walking through it step by step for those who haven't encountered it."

  Refuse to engage in a debate about rationality during the talk. The goal is to explain the phenomenon in the novel.

  ---

  **Timeline Summary**:

  - 0-4 min: The Sequence
  - 4-7 min: The Urn (why it works, what it must have)
  - 7-10 min: The Extra Urn (to clarify risk vs ambiguity)
  - 10-16 min: What They'll Get Wrong (address each misconception)
  - 16-18 min: The Check (interactive question)
  - 18-20 min: What I Refuse to Explain + Q&A start

  Note: The Q&A will extend beyond 20 minutes, but we are planning for 20 minutes of presentation.

  This should leave the audience with a clear understanding that Ada's choices are a result of ambiguity aversion and not an error.
answer: |-
  ### Teaching Plan for Your Library Event (20 Minutes Total)

  #### **The Sequence** (4 Minutes)
  1. **Start with Two Kinds of Not-Knowing** (1 min):  
     Open by contrasting:  
     - *Risk*: Known odds (e.g., a coin flip—50% heads).  
     - *Ambiguity*: Unknown odds (e.g., a stranger’s coin—could be rigged; you lack even a guess).  
     **Why this first?** Without this foundation, the urn feels arbitrary. Ambiguity must feel viscerally different from risk—like comparing a foggy path to a dark forest.

  2. **Introduce the Urn & Ada’s First Choice** (1.5 min):  
     - Describe the urn: 90 balls, 30 red. The other 60? Black/yellow in an unknown ratio (could be 59 black/1 yellow, or 0 black/60 yellow, etc.).  
     - Pose Choice 1: *Bet on red (known: 30/90) vs. black (ambiguous: ?/90)*.  
     - Poll the room: “Show of hands—who’d bet on red here?” Get commitment. Explain Ada’s choice: She picks red.  
     **Why here?** The room must *feel* her avoidance of ambiguity before seeing the contradiction.

  3. **Reveal the Second Choice & Contradiction** (1.5 min):  
     - Pose Choice 2: *Bet on black-or-yellow (known: 60/90) vs. red-or-yellow (ambiguous: 30 + ?/90)*.  
     - Poll again: “Who prefers black-or-yellow?” (Most will agree). Confirm Ada chooses it.  
     - Highlight the tension: “In Choice 1, she avoids black. In Choice 2, she embraces it. Is this a mistake? Let’s dissect.”  
     **Why last?** The contradiction only lands after both choices are internalized. It’s the “aha” moment that demands resolution.

  ---

  #### **The Urn** (3 Minutes)
  - **Keep the urn**. It’s visual, intuitive, and mirrors the book. Alternatives (e.g., a bookie hiding odds) add narrative fluff but dilute the math.  
  - **What it must have**:  
    1. A *known* quantity (30 red balls).  
    2. A *missing* quantity (black/yellow split).  
    3. The missing quantity *stays hidden* (no hints, no averages).  
  - **What it must NOT have**: Any suggestion that Ada can “guess” the split (e.g., “surely it’s 50/50?”). This destroys ambiguity.  
  - **Why it works**: The urn’s physicality makes ambiguity concrete—readers *see* the void where numbers should be.

  ---

  #### **The Extra Urn** (3 Minutes)
  - **Introduce it after the contradiction** (as a payoff, not a distraction):  
    - Same urn: 30 red, 60 black/yellow, but now a machine splits the 60 randomly (e.g., any ratio equally likely).  
    - Ask: “Does this dissolve ambiguity?” **No**—it morphs into *risk*. Ada now knows the *distribution* (e.g., black averages 30/90), so probabilities become calculable. She’d likely accept either bet.  
  - **Where it fits**: After the main sequence. Use it to underscore the core lesson:  
    - *Ambiguity* = no data (original urn).  
    - *Risk* = data exists (machine urn).  
    - Ada’s choices only arise under true ambiguity.  
  - **Bonus—adversarial urn**: If an enemy sets the ratio, ambiguity intensifies. Ada avoids black even more fiercely. Mention briefly to show context matters, but don’t linger—it complicates the core point.

  ---

  #### **What They’ll Get Wrong** (6 Minutes)
  Address misconceptions *during* the sequence where they naturally arise:  
  1. **“That’s just risk aversion”**:  
     - **Kill when** defining ambiguity vs. risk.  
     - Retort: “Risk aversion is fearing *known* bad odds. Ambiguity is fearing the *unknowable*. Ada avoids black not because it’s riskier, but because its odds are invisible.”  

  2. **“She must have some guess—just average it!”** (Critical!):  
     - **Kill after** Choice 1, when someone shouts this.  
     - Retort: “If she averages, black is 30/90. Then why in Choice 2 does she prefer black-or-yellow (60/90) over red-or-yellow (also ~60/90)? Averaging predicts indifference, but she’s not indifferent.”  

  3. **“Money-pump! She’s irrational”**:  
     - **Kill after** revealing the contradiction.  
     - Retort: “Yes, she could be exploited if forced to bet repeatedly. But this is one scene—she’d likely walk away after one choice. Real people *do* this (Ellsberg’s experiments prove it). It’s not a bug; it’s how humans handle radical uncertainty.”  

  4. **“She avoids ambiguity—so what’s paradoxical?”**:  
     - **Kill after** Choice 2.  
     - Retort: “She doesn’t avoid all ambiguity. She avoids black alone but embraces black-or-yellow. The paradox is that her choices *flip* based on how options are framed—complements reveal her inconsistency.”  

  5. **Mix-up with Allais**:  
     - **Kill if raised in Q&A**.  
     - Retort: “Allais is about known probabilities and regret. This is about missing information. Different beast.”  

  6. **“It’s just Ada being timid”**:  
     - **Kill upfront** when introducing ambiguity.  
     - Retort: “Timidity would make her reject all bets. Here she *engages*—but only when odds are knowable. It’s structural, not character-driven.”  

  **New misconception to prep for**: “Why not just bet on red both times?” → Point to Choice 2: red-or-yellow is ambiguous, so she rejects it. She’s consistent in chasing known odds.

  ---

  #### **The Check** (2 Minutes)
  - **Ask one question**: *“Suppose you offer Ada a bet on yellow alone. Will she take it? Why/why not?”*  
    - **Why it works**: Yellow is maximally ambiguous (could be 0–60 balls). She’ll reject it, proving aversion isn’t about color—it’s about missing numbers. If the room gets this, the idea landed.  
    - *Avoid* your design-a-version idea—it’s too complex for a quick check.

  ---

  #### **What I Refuse to Explain** (2 Minutes)
  - **State upfront**:  
    “I won’t name decision theories (e.g., Maxmin, Smooth Ambiguity). No homework either—this isn’t a seminar. We’re focusing on Ada’s moment of choice.”  
  - **For phone-Googlers**:  
    - If they interrupt: “Ah, you’ve found the Ellsberg paradox! Let’s unpack it *together*—start by telling us what you think Ada’s first choice means.” (This engages them without ceding control.)  
    - If they dominate: “Great insight—let me snap back to the urn so everyone’s on board.”  
  - **Shut down**:  
    - Rationality debates (“Is Ada logical?”).  
    - Math proofs (e.g., Dutch-booking).  
    - Real-world finance applications.  
    **Why**: These derail the narrative. Your goal is clarity, not comprehensiveness.

  ---

  ### Why This Flow Works
  - **Logical**: Starts with cognitive foundations (ambiguity vs. risk), builds tension with Ada’s choices, resolves with the extra urn, and preempts objections.  
  - **Engaging**: Polls and quick checks keep the audience active.  
  - **Time-efficient**: Each segment reinforces the last.  
  - **Novelist-friendly**: Keeps the focus on Ada’s dilemma while making the paradox undeniable.  

  **Final tip**: End by tying back to your book—“This isn’t a mistake; it’s Ada’s response to a world where some truths stay hidden.” That’s your mic drop.
