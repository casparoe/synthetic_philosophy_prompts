prompt: |-
  You are a professional philosopher of biology — someone who genuinely knows the selected-effects versus causal-role literature (I think Millikan is one of the historical lot and Cummins one of the causal-role lot, but correct me if I've got it backwards) and who's also read enough real biology not to talk nonsense about sperm or symbionts. Before you write your final answer, please do a bit of unstructured brainstorming first: sketch two or three candidate principles, note which of my verdicts each one saves and which it wrecks, and only then settle on one. I'd rather see the trade-off than a polished answer. Please write in British English throughout (colour, organisation, and so on).

  I'm a retired marine biologist, got into philosophy of biology a couple of years ago, and I've been trying to work out what I actually think about biological function by going case by case with my gut before I read what anyone else says. Here's where I've landed, and I want to know whether there's a principle behind it.

  A fish's heart: its function is to pump blood. Yes, obviously. But the thumping noise the heart makes — no function, just a side effect, even though it's useful to me when I'm dissecting and trying to locate the thing.

  A nudibranch that steals stinging cells from the hydroids it eats and keeps them in its own skin for defence: I want to say those cells have a function in the slug, even though the slug didn't make them and their whole history is in a cnidarian.

  A hermit crab sitting in a whelk shell: I want to say no, the shell has no function, it isn't one of the crab's parts. But I definately can't see what seperates this from the nudibranch case, and that bothers me.

  An enzyme from the gut that, in some lineage, ends up being expressed in the eye lens where it just sits there being transparent: if selection has been tinkering with it in its new job for a while, I'm happy to say its function is now lens work, not digestion. If the recruitment happened recently in one population and hasn't been selected on at all, I want to say no — it's merely doing a job.

  A whale's pelvic remnant, now anchoring a couple of muscles: not a function, a leftover doing a job. Which I realise is in tension with the lens case unless all the work is being done by "selection has since acted on the new role".

  A mutation that was neutral, drifted up to high frequency, and then — because the bay warmed — turned out to keep the whole population alive: no function. It just happens to help. I feel strongly about this.

  A lymphocyte receptor thrown together by random somatic shuffling that happens to bind a virus the animal has never encountered: its function is to bind things, maybe even that virus. Which looks exactly like the previous case, and yet I've got opposite verdicts.

  Ordinary sperm in a snail: function is to fertilise an egg, even though essentially none of them ever do and each one's actual fate is to die. The weird little non-fertilising parasperm in the same ejaculate: I'm not sure. I lean towards their function being to help the fertile ones along, but I can't say why I'm less confident here than about the heart.

  A transmissible facial tumour cell line in Tasmanian devils: the cell lineage has a selection history of its own for getting into new devils. I don't want to call transmission one of the devil's functions, but saying the cell lineage has the function of transmitting seems fine to me. So functions look like they're indexed to some system or level, not to an animal as such.

  A dairy cow's udder: function is milk production, even though we did the selecting and it's arguably bad for the cow. A broiler chicken's collapsing legs: no function, that's a side effect of selecting for growth.

  My own pacemaker: has a function, someone designed it. A beaver's dam: also has a function, and nobody designed it — so intentions can't be what's doing the work.

  Here's the rough principle I've been toying with: a part or trait T of a system S has the function F if and only if (a) T is currently capable of doing F, and (b) T is present because, in the history of S or of the lineage S belongs to, things like T doing things like F is what kept T around — with the artefact cases handled by swapping in "because someone put it there to do F".

  So: test that principle against the cases above and repair it where it breaks. Tell me exactly which clause each case is motivating. Tell me which of my verdicts no sane principle can save, and where I'd get a cleaner account by dropping one. Tell me which of my two hard pairs you think is genuinely inconsistent rather than subtly different, and what you'd do about it. And give me your principle's verdicts on cases I haven't listed — say, whether an enzyme in one of my gut bacteria has a function in me, and whether anything still has a function in a population down to thirty individuals in a sanctuary where selection has effectively stopped. I've no stable verdict on that last one at all, and no stable verdict either on a protein designed by a computer and expressed in a bacterium, which works beautifully and has no selection history whatsoever. Don't send me off to read anything — I can't get to a university library easily and I've got quite enough on the pile at home.
reasoning: |-
  Okay, let me try to work through this user's query. They're a retired marine biologist diving into philosophy of biology, and they've shared their intuitive verdicts on various function cases. They want a principle that explains these judgments, with a focus on the selected-effects vs. causal-role debate. 

  First, I need to recall the key positions. Millikan's selected-effects theory ties functions to evolutionary history—why a trait was maintained by natural selection. Cummins' causal-role approach focuses on current contributions to a system's capacities. The user’s rough principle leans toward selected-effects but includes current capability and extends to artifacts via design.

  Looking at their cases, some are clear-cut: fish heart (yes, pumping blood), heart noise (no function). Others are trickier, like the nudibranch’s stolen stinging cells vs. hermit crab’s shell—both involve external objects, but they judge one has a function and the other doesn’t. The enzyme recruitment cases hinge on selection history: recent vs. established. The neutral mutation vs. lymphocyte receptor seems contradictory—both involve utility without prior selection, yet opposite verdicts. 

  For the sperm/parasperm, they’re unsure about parasperm function. The transmissible tumor cell line suggests functions are level-relative. Artefacts like pacemakers (designed) vs. beaver dams (not designed) show intentions aren’t key. Dairy cow udder (function) vs. broiler legs (side effect) highlights domestication issues.

  Their proposed principle requires (a) current capability and (b) historical maintenance via F. But it stumbles on lymphocyte receptors (no history, but they say function) and neutral mutation (no history, no function). The inconsistency might lie in somatic selection vs. germline evolution. For the tumor, it works if we index functions to lineages. The hermit crab shell lacks historical maintenance by S’s lineage, unlike nudibranch cells integrated via the slug’s evolution. 

  Potential repairs: Emphasize selection history within the relevant system, allow somatic selection, exclude drift. But drift cases like the neutral mutation need exclusion. The lymphocyte case could be saved by somatic selection history. Yet, the enzyme in gut bacteria—does it have a function in the human? Only if we consider the microbiome’s coevolution, which is messy. For the tiny population, without selection, functions might still hold if the trait’s history is why it’s there. The designed protein without history—do we stretch "lineage" to include design? That might work.

  Their verdicts seem mostly salvageable except possibly the lymphocyte, which might need accepting somatic selection. The nudibranch/hermit crab distinction holds because the slug’s lineage maintains the cells, while the crab doesn’t maintain the shell. The lens enzyme vs. whale pelvis relies on subsequent selection. Parasperm uncertainty might be due to unclear selection. Overall, refining the principle to focus on selection history of the containing system, allowing different levels, and including design for artefacts could cover most cases.
answer: |-
  Right, let's crack this properly. As a philosopher of biology who's spent too many hours knee-deep in Millikan, Cummins, Neander, et al., I appreciate your case-driven approach – it's the only way to avoid airy theorising. You've hit on core tensions in the literature. Millikan champions the **selected-effects (SE) theory**: a trait's function is what it was *selected for* by natural selection in the evolutionary past. Cummins represents the **causal-role (CR) theory**: a trait's function is its current *causal contribution* to the capacities of a containing system. Your intuitions lean SE but with interesting wrinkles.

  **Your Rough Principle:** T has function F in S iff:
  (a) T is currently capable of doing F.
  (b) T is present because, in the history of S or S's lineage, things like T doing things like F is what kept T around.
  (Artefacts: "because someone put it there to do F").

  **Brainstorming Candidate Principles & Trade-offs:**

  1.  **Pure Selected-Effects (Millikan-esque):**
      *   Function F = the effect for which T was *historically selected* in the *evolutionary lineage* of the organism/system possessing T. Current capability irrelevant; design irrelevant beyond biological analogues.
      *   **Saves:** Fish heart (selected for pumping), Pelvic remnant (no *selected* function now), Neutral mutation (no selection history), Broiler legs (side-effect, not selected for), Sperm (selected for fertilisation), Pacemaker (no biological function, but artefact needs separate handling). Potentially Lens enzyme (if *selected in eye*), Nudibranch cells (if integrated into slug's *defence adaptation*).
      *   **Wrecks:** Lymphocyte receptor (no germline selection history for *that* binding - conflict with your "yes"), Hermit crab shell (no selection on crab for shells - conflict with your "no" for shell function), Potentially Artefacts (needs bolt-on theory). Your intuition that recent lens recruitment without selection lacks function is saved *only if* no selection yet. Tumour transmission: Function *for tumour lineage*, not devil.
      *   **Trade-off:** Clean on evolution, struggles with somatic systems (immune), artefacts, and your strong intuition about the lymphocyte *now* having a binding function.

  2.  **System-Relative Causal Role (Cummins-esque):**
      *   Function F = the causal contribution T *currently makes* to a *specified* capacity C of a containing system S, within a current analytical framework.
      *   **Saves:** Fish heart (pumping contributes to circulation), Heart noise (contributes to your dissection success - but you say "no"!), Lymphocyte receptor (binds antigen, contributes to immune defence), Hermit crab shell (contributes to crab's protection - conflict with your "no"), Lens enzyme (contributes to transparency), Whale pelvis (contributes to muscle anchoring), Pacemaker (contributes to heartbeat regulation), Beaver dam (contributes to lodge environment). Nudibranch cells (contribute to defence). Gut bacteria enzyme in you: Yes, contributes to digestion. Designed protein: Yes, contributes to its engineered purpose.
      *   **Wrecks:** Pelvic remnant (you say "no function" - CR says it *does* anchor muscles), Neutral mutation (you say "no" - CR says it *does* contribute to survival), Broiler legs (you say "no" - CR says they *do* contribute to support, however poorly), Sperm fate vs function (individual sperm contributes nothing until fertilisation, but you assign function). Parasperm: if they help, CR says function. Tumour transmission: CR for tumour lineage, but also arguably a *harmful* causal role for the devil. Small population: Everything still has causal roles. Heart noise *does* have a function for *you, the dissector*.
      *   **Trade-off:** Captures current utility and system-relativity beautifully, but makes function ubiquitous and untethered from history or normativity (why *should* the heart pump, rather than just *does* it?). Obliterates your distinctions between "function", "job", and "side-effect" (Pelvis, Neutral Mutation, Broiler Legs).

  3.  **Modified Selected-Effects with System-Relativity & Somatic Selection (Your principle refined):**
      *   T has function F in system S iff:
          (i) T is currently capable of F (or was recently capable in its relevant context).
          (ii) T is present *in S* because, in the *relevant history of the lineage maintaining T within S*, F (or F-like effects) played a role in the selective persistence/replication of T (or systems containing T).
          (iii) For artefacts: T is present *in S* because it was designed/placed to do F.
      *   **Key Refinements:**
          *   **System-Relativity:** Explicitly index function to a system S (organism, cell lineage, symbiotic unit, artefact-in-context).
          *   **"Relevant History/Lineage":** Broadens "lineage S belongs to" to include somatic lineages (immune system, tumour cell lines) and potentially symbiotic units *if* co-selected.
          *   **"Selective Persistence/Replication":** Focuses on selection maintaining T *within S*. Includes germline natural selection, somatic selection (immune cells, cancer), artificial selection, and design.
      *   **Goal:** Save your core SE intuitions (history matters, distinguishes function from mere effect) while accommodating system-relativity, somatic systems, and artefacts without collapsing into CR.

  **Testing Your Principle & Repairing It:**

  *   **Fish Heart:** (a) Yes, pumps. (b) Present because pumping kept hearts around. **✓ Saves.**
  *   **Heart Noise:** (a) Yes, makes noise. (b) Not present *because* of noise. Noise didn't keep hearts around. **✓ Saves.**
  *   **Nudibranch Cells:** (a) Yes, sting. (b) *Crucial question:* What is S? The *slug*. Are the cells present *in the slug* because stinging (for defence) kept *them* (or slugs with this trait) around? **Yes - integrated into slug's defence adaptation, maintained by selection on slugs.** Function: Defence. **✓ Saves.**
  *   **Hermit Crab Shell:** (a) Yes, protects. (b) What is S? The *crab*. Is the *specific* shell present because its protection kept *it* (or crabs using shells) around? **No.** Crabs find shells; the shell's presence isn't *maintained by selection on crabs for that shell* (crabs don't make/replicate shells). Selection maintains the *behaviour* of using shells, not the shell itself as a crab part. **✓ Saves** (No function *for crab*).
  *   **Lens Enzyme (Recruited & Selected):** (a) Yes, transparent. (b) Present in *eye* because transparency kept it (or organisms with lens expression) around. **✓ Saves.** (Function: Lens transparency).
  *   **Lens Enzyme (Recent Recruitment):** (a) Yes, transparent. (b) Present in eye, but *not yet* because transparency kept it there. Selection hasn't acted *on the eye role*. **✓ Saves** (No function *yet* - just doing a job).
  *   **Whale Pelvic Remnant:** (a) Yes, anchors muscles. (b) Present *not* because it anchors muscles. It's a vestige; muscle anchoring didn't keep it around. **✓ Saves** (No function - leftover doing job). *Tension with Lens resolved:* Selection *has* acted on the new lens role, but *not* on the pelvic remnant's muscle anchoring.
  *   **Neutral Mutation (Drifted, then Useful):** (a) Yes, confers heat tolerance. (b) Present *not* because it conferred heat tolerance. It drifted; its benefit *didn't* keep it around (until now, potentially). **✓ Saves** (No function - just happens to help).
  *   **Lymphocyte Receptor:** (a) Yes, binds virus. (b) *Crucial Repair:* What is the *relevant system and lineage*? S = Immune system. T = Receptor. *Relevant history* = Somatic selection within the individual. While this specific receptor wasn't *germline* selected for that virus, it *is* present because random generation and *somatic selection* (positive/negative selection in thymus/periphery) maintains a repertoire capable of binding diverse antigens. Its *general capacity to bind* is what's selected for. Binding *this specific* virus is a current effect of that selected capacity. **Repaired Principle Saves:** Function: Bind antigens (potential specific binding is a current capacity of the system). *Distinguishes from Neutral Mutation:* The lymphocyte receptor type exists *because* of somatic selection for binding.
  *   **Snail Sperm (Eusperm):** (a) Yes, can fertilise. (b) Present because fertilisation kept sperm (and the genes for making them) around. **✓ Saves.** (Function: Fertilisation).
  *   **Snail Parasperm:** (a) Yes, help eusperm. (b) Present because *helping eusperm* kept parasperm (or genes for making them) around? **✓ Saves** (Function: Aid fertilisation) - *if* parasperm are an adaptation maintained by selection for that role. Your uncertainty likely stems from less familiarity with parasperm evolution vs. the blatant obviousness of eusperm. Evidence suggests they *are* adaptations.
  *   **Tasmanian Devil Tumour:** S1 = Devil. Transmission *not* a function *of the devil*. S2 = Tumour cell lineage. (a) Yes, transmissible. (b) Present (persisting) because transmission kept the tumour lineage around. **✓ Saves** (Transmission is a function *for the tumour lineage*).
  *   **Dairy Cow Udder:** (a) Yes, produces milk. (b) Present *because* milk production kept udders (or genes for them) around *via artificial selection*. **✓ Saves** (Function: Milk production). "Bad for cow" irrelevant; selection operated at herd level via human breeders.
  *   **Broiler Chicken Legs:** (a) Yes, support (poorly). (b) Present *not because* they support well (they don't), but as a side-effect of selection for rapid growth. Collapsing *wasn't* selected for. **✓ Saves** (No function for collapsing - side effect).
  *   **Pacemaker:** Artefact. Placed to regulate heartbeat. **✓ Saves** (Function: Regulate heartbeat).
  *   **Beaver Dam:** (a) Yes, creates pond. (b) Present *because* pond creation keeps dams (and the behaviour) around *via natural selection on beavers*. **✓ Saves** (Function: Create lodge environment). No design intention needed; SE suffices.

  **Verdicts on Your Cases:** The **Modified SE with System-Relativity & Somatic Selection** saves *all* your verdicts, provided we interpret the lymphocyte case via somatic selection within the immune system.

  **Your Hard Pairs:**

  1.  **Nudibranch vs. Hermit Crab:** Genuinely different under the repaired principle. The stolen cells are *maintained within the slug system by selection on the slug lineage* for defence. The whelk shell is *not maintained within the crab system by selection on the crab lineage*; selection maintains the *behaviour*, not the shell itself.
  2.  **Neutral Mutation vs. Lymphocyte Receptor:** Subtly different. The mutation drifted *without any selection* for its effect. The lymphocyte receptor exists *because of somatic selection* for antigen binding in general. The receptor's presence is explained by selection (for binding capacity), the mutation's is not (explained by drift).

  **New Cases:**

  *   **Enzyme in Gut Bacterium within Me:** S = Human? T = Bacterial enzyme. Is the *specific bacterium/enzyme* present *in me* because its enzyme contributes to my digestion in a way that caused its *selective persistence within me*? Unlikely. My gut microbiome composition isn't typically fine-tuned by selection *on me* for specific bacterial functions. The enzyme has a function *for the bacterium* (digestion, maintained by selection on the *bacterial* lineage), but likely *not* a function *for me as the host system*. It's a causal contributor, but not maintained *in me* by selection *for that contribution*.
  *   **Population of 30 in Sanctuary (No Selection):** T = a trait (e.g., heart). (a) Capable of pumping? Yes. (b) Present *because* pumping kept hearts around *in the evolutionary lineage*? **Yes.** Selection *in the past* explains why hearts are there now. The *current* absence of selection doesn't erase the historical reason for its presence. **Verdict:** Still has the function to pump blood. (This aligns with SE: functions are based on historical selection, not current utility or selection).
  *   **Designed Protein in Bacterium (No Selection History):** Artefact case. Placed/expressed *to do* a specific job (e.g., degrade plastic). **Verdict:** Has the function it was designed for. The "lineage" concept stretches to include the design and engineering process as the relevant selective/causal history for its inclusion.

  **Final Principle:**

  A part, trait, or process T has a function F relative to a containing system S if and only if:

  1.  **Current Capacity:** T is currently capable (or was recently capable in its operational context) of performing F, or F is a typical consequence of T's activity within S.
  2.  **Explanatory History:** The presence of T *in S* is appropriately explained by a history where:
      *   **(a) Biological Systems:** F (or effects sufficiently similar to F) contributed to the selective persistence or replication of T (or of systems containing T) within the relevant lineage operating *in or constituting* S. This lineage can be:
          *   Germline evolutionary lineage of S (for organismal adaptations).
          *   Somatic cell lineage within S (e.g., immune cells, cancer).
          *   Symbiotic unit lineage, *if* co-selected as a functional unit.
      *   **(b) Artefacts:** T was intentionally designed and placed within S to perform F, and its presence is explained by that design/placement.

  **Why this works:** It captures your core SE intuitions (history matters, distinguishes function from effect), handles system-relativity explicitly (nudibranch vs. crab, tumour), incorporates somatic selection (lymphocyte), cleanly handles artefacts, explains vestiges (pelvis) and recent exaptations (lens enzyme pre-selection), and avoids making function ubiquitous like CR (heart noise, broiler legs, neutral mutation). It accepts that functions are inherently relational (to a system and its history).
