prompt: |-
  i'm TAing a grad seminar in philosophy of law this term — 14 people, mostly philosophy grad students with three law students mixed in, one 90-minute session, and we've got the Hart–Fuller debate coming up in a couple weeks. I want an activity where they walk into the disagreement rather than me doing core/penumbra vs purposive interpretation on the whiteboard for twenty minutes and then reading the faces.

  Rough shape I have in mind, fix it if it's wrong: a staged case exercise where they have to apply a written rule to a pile of hard cases. What I want them to _feel_ is the squeeze — that reading the rule by its words produces outcomes nobody can defend, but reading it by its purpose means you're not really applying a rule anymore, and "the purpose" isn't a single thing anyway, because you can state it at different levels of generality and get opposite verdicts on the same case.

  Constraints on the design:

  - No vehicles in the park, no grudge informer, no stock examples at all. If one turns up I'll bin it. Invent a self-contained scenario — I was thinking an antarctic research station sharing a greenhouse and a seed store, with an ordinance of maybe five short rules, but use whatever works better.
  - At least one rule about a time or place restriction, one turning on a category (nothing living may be removed, that sort of thing), one about a procedure (a signout log, a witness, a countersignature).
  - The cases need at least one where the words plainly cover the conduct but the purpose plainly doesn't, one where the purpose plainly covers it but the words plainly don't, and at least one the room will genuinely split roughly 50/50 on.
  - Rounds, with something revealed between them. Round 1: text only, no discussion of reasons, just mark each case permitted / forbidden / rule doesn't reach. Then hand out purpose statements — and here's the bit I like: give half the room one statement of purposes and half the room a different, equally plausible one pitched at a different level of generality, and don't announce that there are two. Then a last round with the actual drafter's note, which partly cuts against the text of one rule.
  - No advance reading, no framing lecture, and neither name comes out until the debrief.
  - Give me the actual deliverable: the ordinance, the case list, both purpose sheets, the drafter's note, a minute-by-minute timeline for 90 minutes with small groups rather than 14 people shouting, what goes on the board and when, and how to tally and display the splits.

  Debrief should map specific moments onto (a) open texture and the penumbra, (b) Fuller's purposive-interpretation move and what it's meant to fix, (c) the objection that purposes are indeterminate because of levels of generality, (d) the Hartian thought that rules exist to settle things in advance and that this is worth something even when it costs you. Flag the moments where someone will say something that's secretly the crux.

  Be honest about what will go wrong — I'm guessing someone names the debate in round one and deflates it, someone compares purpose sheets when they shouldn't, someone argues the hard cases on the merits instead of as rule-application, and one group finishes way early. What do I do about each?

  And be honest about what the exercise can't do. I suspect it can't get at fidelity to law as a moral attitude, or at the internal point of view (everyone already arrives able to follow rules, so there's nothing to see), and definately not at the retroactivity / informer end of the exchange — say plainly what I'll have to supply by talking instead.
reasoning: |-
  We are creating a self-contained scenario for a classroom activity to explore the Hart-Fuller debate through a rule-application exercise. The goal is to have students experience the tension between textual and purposive interpretation.

  Setting: An Antarctic Research Station named "Vostok Station" (to avoid real associations). The station has a shared greenhouse and seed store that are critical for the survival and research of the inhabitants.

  Ordinance: "Greenhouse and Seed Store Regulations"

  Rule 1: **Time Restriction**: "The greenhouse shall be open for use only between the hours of 0600 and 2200."
  Rule 2: **Category Restriction**: "No living organism may be removed from the greenhouse or seed store without authorization."
  Rule 3: **Procedure**: "Any removal of seeds from the seed store must be recorded in the logbook, with the date, time, and signature of the person removing the seeds, and must be countersigned by a witness."
  Rule 4: **Authorization Definition**: "Authorization for removal of living organisms must be given in writing by the Station Chief, or in an emergency, by the Senior Biologist."
  Rule 5: **Emergency Exception**: "In the event of an emergency threatening human life, any regulation may be suspended by the Station Chief or the Senior Biologist."

  Now, we create a set of cases. We need at least:
  - One where the words plainly cover but purpose doesn't (so we should forbid but it seems absurd).
  - One where purpose plainly covers but words don't (so we should allow but the rule doesn't say so).
  - One that splits the room.

  Case List:

  1. **Case A (Words cover, purpose doesn't)**: At 2205, a researcher enters the greenhouse to water a wilting plant that is part of a critical experiment. The plant would die without immediate water. The greenhouse is closed at 2200. (Rule 1: forbidden by text, but the purpose of the rule is to ensure security and quiet during rest hours, and this is a minor, necessary intrusion.)

  2. **Case B (Purpose covers, words don't)**: A researcher removes a dead plant (which is not living) from the greenhouse to dispose of it. (Rule 2: by text, it's allowed because it's not living. But the purpose of Rule 2 is to protect the living specimens and the ecosystem. The dead plant might be diseased and could contaminate, so removal without authorization might be against the purpose.)

  3. **Case C (50/50 split)**: A researcher removes seeds from the seed store during open hours, logs it, but cannot find a witness to countersign because the station is understaffed that day. The researcher leaves a note in the logbook explaining the absence of a witness and proceeds. (Rule 3: by text, the countersignature is missing. But the purpose of the rule is to have a record and accountability. The note might serve the purpose, but the rule says "must be countersigned".)

  4. **Case D (Another split candidate)**: During an emergency (a sudden storm that cuts power and threatens the heating system), the Senior Biologist authorizes the removal of extra seeds to start backup generators (using the seeds as fuel, which is unconventional but the only fuel available). The seeds are living organisms. (Rule 5 allows suspension in an emergency, but Rule 2 says "no living organism may be removed without authorization". The Senior Biologist gave authorization, but Rule 4 requires written authorization, which was given verbally. Also, is using seeds as fuel within the purpose of the seed store?)

  5. **Case E (Clear by both, but to have a baseline)**: A researcher removes seeds during open hours, logs it, and has a witness countersign. (Permitted by both text and purpose.)

  We'll have 5 cases: A, B, C, D, E.

  Purpose Statements (two versions, given to two halves of the class):

  **Purpose Statement 1 (More specific, operational purposes):**
  "The purpose of these regulations is to:
  - Ensure the security of the greenhouse and seed store during non-working hours to prevent theft and unauthorized use (Rule 1).
  - Protect the living specimens and the integrity of the research by controlling the removal of any living organisms (Rule 2).
  - Maintain accurate records of seed usage for inventory and accountability (Rule 3).
  - Ensure that authorizations are given only by responsible personnel and are documented (Rule 4).
  - Allow for necessary flexibility in life-threatening situations without compromising the overall regulatory structure (Rule 5)."

  **Purpose Statement 2 (Broader, more value-oriented purposes):**
  "The purpose of these regulations is to:
  - Promote the safety, order, and well-being of the station and its personnel (Rules 1, 5).
  - Preserve the station's critical biological resources for research and sustainability (Rule 2).
  - Foster a culture of responsibility and mutual oversight in shared resources (Rules 3, 4).
  - Enable the station to function effectively and respond to challenges while maintaining core values (Rule 5)."

  Drafter's Note (to be revealed in the last round):
  "During the drafting of these regulations, we considered the need for flexibility in non-emergency situations. Specifically, for Rule 3 (countersignature requirement), the intention was to have a second person verify the removal, but we recognized that in a small station, it might not always be possible. Therefore, the rule should be interpreted to allow for a note in the logbook in lieu of a countersignature when a witness is unavailable, provided the Station Chief is informed within 24 hours. However, for Rule 2, we explicitly did not include dead organisms because we did not want to burden the staff with unnecessary paperwork for waste disposal. We trust that common sense will prevail in such cases."

  Timeline (90 minutes total):

  0-5 min: Introduction and setup. Explain that they are the regulatory committee of the station and must decide on a set of cases by applying the rules. Hand out the ordinance and the case list (without any purposes). Divide the class into small groups (3-4 people per group, so about 4 groups for 14 people). Each group gets the ordinance and the case list.

  5-20 min: **Round 1 (Text Only)**: Groups discuss and decide for each case: Permitted (P), Forbidden (F), or Rule Doesn't Reach (N/A). They must base their decision solely on the text of the rules. They should record their decisions and be ready to report.

  20-25 min: Groups report their decisions for each case. TA records on the board in a table (cases as rows, groups as columns, with P/F/N/A). Highlight the variations and ask groups to explain briefly why they decided as they did (without deep reasoning, just point to the rule).

  25-30 min: Hand out the purpose statements. But note: half the groups (randomly chosen) get Purpose Statement 1, the other half get Purpose Statement 2. Do not tell them there are two versions. Tell them: "Now you have been given a statement of the purposes behind these rules. Reconsider your decisions in light of this purpose statement."

  30-45 min: **Round 2 (With Purpose)**: Groups discuss again and can change their decisions. They should note if the purpose statement changes their view and how.

  45-50 min: Groups report their decisions again. TA records in a new table. Now, when groups report, they will likely have different outcomes. Ask each group to state which purpose they had (without reading it out) and how it influenced them. This is when they may realize there are two different purpose statements.

  50-55 min: Reveal that there were two purpose statements. Hand out both to all groups. Then, give them the Drafter's Note.

  55-70 min: **Round 3 (With Drafter's Note)**: Groups discuss again and make final decisions.

  70-75 min: Groups report final decisions. TA records in a third table.

  75-90 min: Debrief.

  Debrief Structure:

  - Start by asking: "What did you experience? What was frustrating? What changed your mind?"
  - Map specific moments to concepts:
    - Case A: Text says forbidden (Rule 1: after 2200), but purpose (security) might not be violated. This is the penumbra (Hart) and the need for purposive interpretation (Fuller). Someone might have said: "But it's just five minutes and for a good reason!" -> That's the beginning of purposive thinking.
    - Case B: Text allows (dead plant not living), but purpose (protect the ecosystem) might forbid because of disease. This shows the problem of textualism: it can lead to absurdity. But also, if we use purpose, we are going beyond the rule. And note: with Purpose Statement 2 (broader: preserve resources) they might forbid, but with Purpose Statement 1 (specific: protect living specimens) they might allow. This shows the levels of generality problem.
    - Case C: Split in Round 1? Some groups might say forbidden (missing signature) and some might allow because they think the note suffices? In Round 2, with Purpose 1 (accurate records) they might still require the signature, but with Purpose 2 (culture of responsibility) they might think the note shows responsibility. Then the Drafter's Note clarifies and settles it. This shows how a rule can have an open texture and how a drafter's intent might help (but note: the note says Rule 3 can be flexible, but what about Rule 2?).
    - Case D: Emergency, but verbal authorization. Rule 4 requires written authorization. Rule 5 allows suspension of regulations in emergency. How do they interact? This is complex and shows conflicts between rules and the indeterminacy of purpose (what is the purpose of the authorization rule?).

  - Then, connect to Hart and Fuller:
    - Hart: Rules have a core and a penumbra (Case A and B are penumbral). Rules are meant to settle conduct in advance, even if sometimes they produce suboptimal results (Case A: we must close at 2200 even for a good reason because otherwise the rule becomes vague). The core/penumbra distinction and the need for judicial discretion in the penumbra.
    - Fuller: Law is a purposive enterprise. We should interpret rules in light of their purpose to avoid absurdity (Case B: dead plant might be dangerous, so we should interpret Rule 2 to include dead plants? But note: Drafter's Note says dead plants are excluded intentionally). However, purposes are multiple and at different levels (as seen by the two purpose statements leading to different results). This leads to Fuller's idea of the internal morality of law: if the rules are not clear or don't serve their purpose, they fail as law.
    - The problem of levels of generality in stating purposes (Purpose 1 vs 2) and how that can lead to opposite results (in Case B, for example).
    - Hartian response: Even if purposes are indeterminate, we need rules to have a clear, shared standard.

  - What the exercise can't do:
    - It doesn't capture the moral dimension of fidelity to law (Fuller's point about the grudge informer and retroactivity). We don't have a case where applying the rule leads to a grave moral wrong. You'll have to discuss the grudge informer case separately to bring that in.
    - The internal point of view: Here, students are applying rules as an exercise, but they don't have a long-term commitment to the system. You can note that the exercise doesn't show how officials and citizens might internalize the rules.
    - Retroactivity: The exercise doesn't involve changing the rules after the fact. You'll have to discuss the informer case to show that.

  Potential Problems and Solutions:

  1. **Someone names the debate in round one**: If a student says "This is like Hart and Fuller!", say: "That's an interesting connection, but let's try to focus on applying the rules as written for now. We'll come back to the theorists later."

  2. **Someone compares purpose sheets when they shouldn't**: If groups talk across and realize there are two, that's okay. You can use it: "Ah, so you noticed there were different purpose statements? That's part of the exercise." Then, when you hand out both, it's confirmed.

  3. **Arguing the hard cases on the merits**: If they start saying "But it's an emergency, of course you should allow it!" remind them: "Remember, you are applying the rules as they are written. We'll get to purpose in the next round." Then in Round 2, they can use purpose to argue merits.

  4. **One group finishes early**: Have a few extra questions ready: "Can you think of a variation on one of the cases that would be even harder?" or "Which rule was the most ambiguous and why?" or "If you were to amend one rule, which would it be and how?"

  Deliverables:

  1. Ordinance (Greenhouse and Seed Store Regulations)
  2. Case List (Cases A-E)
  3. Purpose Statement 1 and 2 (on separate sheets)
  4. Drafter's Note
  5. Timeline and instructions for the TA
  6. Board setup: Three tables (Round 1, Round 2, Round 3) with cases as rows and groups as columns.

  Let's write out the full materials.
answer: |-
  ### Antarctic Research Station Rule Application Exercise: Hart-Fuller Debate Simulation  
  **Goal:** Make students *feel* the tension between textualism and purposivism—how rules can produce indefensible outcomes when read literally, while purposive interpretation risks indeterminacy and undermines rule-of-law values.  

  ---

  ### **Materials**  
  #### 1. **Ordinance: "Vostok Station Greenhouse & Seed Reserve Regulations"**  
  *(Handed out at the start)*  
  > **Rule 1 (Time Restriction):** "The greenhouse is accessible only between 0600 and 2000 hours."  
  > **Rule 2 (Category Restriction):** "No living organism may be removed from the greenhouse or seed reserve."  
  > **Rule 3 (Procedure):** "Seed removal requires logging the date, quantity, and purpose in the station ledger, with one witness signature."  
  > **Rule 4 (Authorization):** "Removal of living organisms requires prior written approval from the Station Director or Deputy Director."  
  > **Rule 5 (Emergency):** "In emergencies threatening human life, Rules 1–4 may be suspended by the Director, Deputy Director, or Senior Biologist."  

  #### 2. **Case List**  
  *(Handed out at the start; groups mark P [Permitted], F [Forbidden], or N/A [Rule Doesn’t Reach])*  
  1. **Case A (Words cover, purpose doesn’t):** During a blizzard (-60°C), a biologist enters the greenhouse at 2005 to save frost-sensitive orchids. Power is failing, and the orchids will die without immediate heating adjustments.  
  2. **Case B (Purpose covers, words don’t):** A botanist removes a dead fungal culture (non-living, but highly toxic) from the greenhouse to prevent contamination.  
  3. **Case C (50/50 split):** A researcher removes seeds for an experiment, logs everything, but gets only an *initial* (not a signature) from a witness who was called away mid-process.  
  4. **Case D (Another split):** In a power-loss emergency, the Senior Biologist *verbally* authorizes removing seeds to feed critically ill patients. Seeds are logged, but the verbal approval violates Rule 4.  
  5. **Case E (Baseline):** A researcher removes seeds at 1500, logs details, and gets a full witness signature.  

  #### 3. **Purpose Statements**  
  *(Handed out in Round 2; half the groups get Version 1, half get Version 2)*  
  - **Version 1 (Narrow, operational purposes):**  
    > "These rules ensure: (1) Security during off-hours to prevent theft or damage, (2) Preservation of living specimens for research, (3) Accountability via witnessed documentation, (4) Controlled authorization to prevent resource depletion, (5) Emergency flexibility without compromising core rules."  
  - **Version 2 (Broad, value-based purposes):**  
    > "These rules uphold: (1) Safety and order in shared spaces, (2) Protection of biological resources for station sustainability, (3) Collective responsibility through mutual oversight, (4) Responsible stewardship of vital assets, (5) Life-preserving adaptability in crises."  

  #### 4. **Drafter’s Note**  
  *(Handed out in Round 3)*  
  > "Clarifications:  
  > - Rule 3’s 'witness signature' was intended as a deterrent against misuse. A witness *initial* suffices if the full signature is impractical.  
  > - Rule 2’s 'living organism' excludes dead matter (e.g., fungal cultures) to avoid burdening staff with non-threats.  
  > - Rule 4’s 'written approval' is absolute outside emergencies; Rule 5 does not override it for non-life-threatening scenarios."  

  ---

  ### **Timeline (90 Minutes Total)**  
  **Group Setup:** Divide the 14 students into 4 small groups (3–4 people each).  
  **Board Setup:** Three tables (one per round) with cases as rows and groups as columns. Use ✅ (P), ❌ (F), ➖ (N/A).  

  | **Time**     | **Activity**                                                                 | **TA Actions**                                                                 |  
  |--------------|-----------------------------------------------------------------------------|-------------------------------------------------------------------------------|  
  | **0–5 min**  | **Intro:** “You’re the station’s oversight committee. Apply *only* the rules to these cases. No theory—just P, F, or N/A.” Hand out Ordinance + Case List. | Write rules on board. Assign groups.                                          |  
  | **5–25 min** | **Round 1 (Text Only):** Groups decide all 5 cases based *only* on rule text. No purpose discussion. | Circulate, enforce text-only focus. Note arguments.                           |  
  | **25–30 min**| **Report Round 1:** Groups share decisions. Record on Board Table 1. Ask: “Which rule forced your hand?” | Build tension: Highlight splits (e.g., Case A likely 100% F, Case B 100% P). |  
  | **30–35 min**| **Transition:** Hand out Purpose Statements—*silently* give half the groups Version 1, half Version 2. Say: “Reconsider cases using this purpose statement.” | Do *not* reveal two versions exist.                                         |  
  | **35–50 min**| **Round 2 (With Purpose):** Groups re-debate cases. Some may notice purpose-text conflicts. | If groups finish early: “Which case changed most? Why?”                       |  
  | **50–55 min**| **Report Round 2:** Groups share decisions. Ask: “Did purpose change your view? How?” | Record on Board Table 2. *Reveal* two purpose versions when groups mention discrepancies. |  
  | **55–60 min**| **Transition:** Hand all groups both Purpose Versions + Drafter’s Note. Say: “Finalize decisions with this new context.” | Highlight conflicts (e.g., Version 1 vs. 2 on Case B).                        |  
  | **60–75 min**| **Round 3 (With Drafter’s Note):** Groups finalize decisions. Focus on Rule 3 (initial vs. signature) and Rule 4 (verbal approval). | Push: “Does the Drafter’s Note resolve ambiguity or create new problems?”   |  
  | **75–80 min**| **Report Round 3:** Record decisions on Board Table 3. Ask: “Where did the note help? Where did it fail?” | Contrast shifts (e.g., Case C likely converges; Case D may still split).      |  
  | **80–90 min**| **Debrief:** Facilitate connections to Hart-Fuller. Use board to map conflicts. | Use quotes from students. End with: “What’s the cost of each approach?”       |  

  ---

  ### **Debrief Script: Linking Moments to Hart-Fuller**  
  **(TA: Reference board tables to show decision shifts)**  
  1. **Case A (Late Entry):**  
     - *Round 1:* All groups mark ❌ (Rule 1’s text is clear).  
     - *Hart Moment:* “This is the **core**—rules settle conduct in advance, even if outcomes seem harsh. Hart’s ‘penumbra’ is where text *isn’t* clear (e.g., Case C), but here it’s settled.”  
     - *Round 2:* Some groups flip to ✅ using purpose (e.g., “Safety wasn’t risked!”).  
     - *Fuller Moment:* “Purposivism avoids absurdity—but did ‘security’ (Version 1) or ‘safety’ (Version 2) dominate? Fuller says law must serve human aims.”  
     - *Conflict:* “If purpose overrides text, is Rule 1 still a rule? Hart warns: This undermines predictability.”  

  2. **Case B (Dead Fungus):**  
     - *Round 1:* All groups mark ✅ (Rule 2 excludes non-living things).  
     - *Round 2:* Splits emerge. Version 1 groups keep ✅ (“Preservation only covers living specimens”); Version 2 groups often flip to ❌ (“Dead fungus threatens sustainability!”).  
     - **Levels of Generality:** “Version 1 (narrow purpose) allowed removal; Version 2 (broad) forbade it. Fuller’s purposivism runs aground here—purposes are **indeterminate** without a fixed scope. Hart: ‘This is why we need rules, not just purposes!’”  

  3. **Case C (Initial, Not Signature):**  
     - *Round 1:* Likely split (❌ if literal, ✅ if pragmatic).  
     - *Penumbra Moment:* “Hart’s point! Rule 3’s ‘signature’ has a core (full signature) and penumbra (initial?). Judges *must* interpret in hard cases.”  
     - *Round 3:* Drafter’s Note resolves it (allows initial).  
     - *Fuller Critique:* “But the note came *after*—is this retroactive rulemaking? Fuller’s ‘internal morality’ demands clarity upfront.”  

  4. **Case D (Verbal Emergency Approval):**  
     - *Rounds 1–2:* Split on Rule 4 (written approval) vs. Rule 5 (emergency).  
     - *Drafter’s Note:* Confirms Rule 4’s strictness, causing frustration.  
     - **Hartian Value:** “Rules settle disputes in advance—even if imperfect. Without textual anchors, Rule 5 could swallow all rules (Fuller’s fear of arbitrariness).”  

  **Crux Moments to Highlight:**  
  - When a student says: “But the purpose is obvious!” → Fuller’s faith in shared values.  
  - When a student says: “The rule is clear—we can’t ignore it!” → Hart’s commitment to predictability.  
  - When groups with different purposes clash on Case B → Indeterminacy of purposes.  
  - When Drafter’s Note contradicts text (Rule 3) → Fuller’s “fidelity to law” vs. Hart’s “rules as social facts.”  

  ---

  ### **What Will Go Wrong (and Solutions)**  
  1. **Someone names Hart-Fuller in Round 1:**  
     - *Response:* “Hold that thought! We’ll unpack theory later—for now, focus on the rules *as written*.”  
  2. **Groups compare purpose sheets early:**  
     - *Response:* Lean in: “Ah, you spotted a discrepancy! Why might purposes conflict? We’ll discuss soon.” Use it to foreshadow indeterminacy.  
  3. **Arguing cases on merits (e.g., “Saving orchids is right!”):**  
     - *Response:* In Round 1: “Stick to the text—what do the words *say*?” In Round 2: “Now argue purpose vs. text.” Channel merit-arguments into purposivism.  
  4. **A group finishes early:**  
     - *Response:* Give a challenge: “Draft a 6th case where purpose and text clash even worse,” or “Which rule is most flawed? How would you fix it?”  

  ---

  ### **What the Exercise Can’t Do (Supply via Lecture After)**  
  1. **Fidelity to law as a moral attitude (Fuller):**  
     - The exercise treats rules instrumentally. *Supplement:* Discuss Fuller’s “grudge informer”—why retroactive punishment violates law’s morality. Ask: “Would you enforce Rule 1 against the orchid biologist if they’d been warned?”  
  2. **Internal point of view (Hart):**  
     - Students apply rules as outsiders. *Supplement:* Contrast a citizen who sees rules as “obligations” (internal view) vs. “threats” (external view). Use station context: “Do researchers *accept* these rules, or just comply?”  
  3. **Retroactivity/Informer dilemma:**  
     - This scenario lacks punishment or retroactive change. *Supplement:* Summarize the Hart-Fuller informer debate: Hart (retroactive statute is better than twisting rules) vs. Fuller (retroactivity destroys law’s integrity).  

  **Final Tip:** Start the debrief by asking: “When did you feel torn between the rules and fairness?” Use their emotions to anchor theory. End with: “Hart gives us rules to avoid chaos; Fuller gives us justice to avoid cruelty. Who won in Antarctica?”
