answer: |-
  Here is a classificatory decision tree based on 8 concrete cases. I dropped **Case 7 (Uniqueness)** because it asks about a global meta-principle rather than a specific case response, violating the "no general principles" constraint. The remaining cases are reordered for logical flow. Branch nodes use simple, case-based phrasing with mutually exclusive answers. Leaves are defined by answer combinations, with awkward commitments noted.

  ---

  ### **Decision Tree**
  *(Start at Q1. Proceed to next question based on answer)*

  **Q1 (Case 2: Tainted Source)**  
  You learn advocacy groups selectively published crime reports that made you believe crime is rising. Does this:  
  (A) Directly lower your confidence crime is rising (e.g., "it’s less likely").  
  (B) Only remove your basis for the belief (e.g., "I can’t trust my old reason, but I still think it’s true").  
  (C) Require full suspension (e.g., "I must withhold judgment").  

  → *If A, go to Q2.*  
  → *If B or C, go to Q3.*  

  **Q2 (Case 3: Calibration)**  
  You’re 85% confident on a hard question where you’re right 60% of the time at this confidence. Do you:  
  (A) Reduce confidence to 60%.  
  (B) Keep 85% but add a second-order doubt (e.g., "I’m 85% sure, though I know I’m often wrong").  
  (C) Keep 85% because you’d defer to a better-calibrated self.  

  → *All answers go to Q4.*  

  **Q3 (Case 6: Forgotten Evidence)**  
  You recall a 70% credence from a forgotten "careful" study, then learn you often misremember studies as careful. Do you:  
  (A) Revert toward your prior before the study.  
  (B) Keep 70% but add second-order doubt.  
  (C) Keep 70% as self-standing (e.g., "my past self locked this in").  
  (D) Suspend judgment.  

  → *All answers go to Q5.*  

  **Q4 (Case 4: Iterated Defeat)**  
  You’re impaired (e.g., drunk), and you know this assessment is made while impaired. Does this:  
  (A) Apply once (e.g., "I should doubt my current reasoning, but not this doubt itself").  
  (B) Apply to everything, including itself (e.g., "I must suspend all judgments made now").  
  (C) Undermine itself so no change occurs (e.g., "this warning is untrustworthy, so I ignore it").  
  (D) Only affect domains with independent evidence of impairment.  

  → *All answers go to Q6.*  

  **Q5 (Case 1: Peer Disagreement)**  
  An equally competent peer disagrees on shared data. Do you:  
  (A) Move toward the midpoint.  
  (B) Suspend judgment entirely.  
  (C) Hold confidence unchanged.  
  (D) Any confidence between yours and theirs is permitted.  

  → *All answers go to Q7.*  

  **Q6 (Case 5: Model’s Disagreement)**  
  An 80%-accurate AI disagrees with your well-grounded view. Is this:  
  (A) Peer disagreement (treat like Q1/Q5).  
  (B) First-order evidence about the world.  
  (C) Higher-order evidence about shared-text reliability.  
  (D) Ignorable (errors correlate with human bias).  

  → *All answers go to Q8.*  

  **Q7 (Case 8: Akratic Combination)**  
  Can you rationally believe *p* while believing your evidence doesn’t support *p*?  
  (A) No: always a defect.  
  (B) Yes, and sometimes required.  
  (C) Only possible for credences (not full belief).  
  (D) Psychologically impossible; must investigate.  

  → *Go to leaves.*  

  **Q8 (Case 9: Action)**  
  When first-order and second-order attitudes conflict, action should follow:  
  (A) The first-order attitude.  
  (B) The second-order attitude.  
  (C) A merged attitude (e.g., weighted average).  
  (D) No single rule; context-dependent.  

  → *Go to leaves.*  

  ---

  ### **Leaves (Positions)**  
  *Defined by paths through Q1–Q8. Awkward commitments in italics.*

  1. **Steadfastness/Total Evidence**  
     - Path: Q1=B → Q3=B/C/D → Q5=C/D → Q7=A/C → Q8=A  
     - *Awkward: Defies peer disagreement (Q5) by refusing to conciliate even with equal peers.*  

  2. **Conciliationism (Split Difference)**  
     - Path: Q1=A → Q2=A → Q4=A → Q5=A → Q7=A → Q8=C  
     - *Awkward: Forces compromise with known bad actors in Q6 if classified as peers.*  

  3. **Conciliationism (Suspension)**  
     - Path: Q1=C → Q3=D → Q5=B → Q7=A → Q8=B  
     - *Awkward: Suspends judgment in Q3 even when past self might be reliable.*  

  4. **Higher-Order Defeat without Global Spread**  
     - Path: Q1=A → Q2=B → Q4=D → Q5=A/B → Q7=A → Q8=B/C  
     - *Unnamed: HE lowers confidence locally but avoids self-undermining (Q4).*  
     - *Awkward: Arbitrary in limiting HE’s scope (Q4=D).*  

  5. **Permissivism-Based Response**  
     - Path: Q1=A/B → Q3=D → Q5=D → Q7=B → Q8=D  
     - *Awkward: Allows contradictory beliefs in Q7 ("rational akrasia") to avoid dogmatism.*  

  6. **Fragmentation**  
     - Path: Q1=B → Q3=B → Q5=C → Q7=C → Q8=D  
     - *Awkward: Treats beliefs as compartmentalized, ignoring clashes (Q7=C).*  

  7. **Involuntarist Dissolution**  
     - Path: Q1–Q7=D → Q8=D  
     - *Awkward: Dismisses HE as irrelevant to belief (Q3=C/Q5=C) since beliefs aren’t chosen.*  

  8. **Global Suspension (Pyrrhonian)**  
     - Path: Q1=C → Q3=D → Q4=B → Q5=B → Q7=D → Q8=B  
     - *Awkward: Collapses under Q4 (self-undermining HE forces suspension of HE itself).*  

  9. **Self-Undermining Rejection**  
     - Path: Q1=A → Q2=A/C → Q4=C → Q5=C → Q7=A → Q8=A  
     - *Unnamed: HE only trusted if non-self-undermining (Q4=C voids it otherwise).*  
     - *Awkward: In Q4, dismisses impairment warnings as incoherent.*  

  ---

  ### **Unseparated Pairs**  
  The tree cannot distinguish these pairs without an extra question:  
  - **Fragmentation (Leaf 6) vs. Involuntarism (Leaf 7)**  
    Both answer Q3=B/C and Q5=C. *Need:* "Can you consciously hold conflicting beliefs at once?" (Yes → Fragmentation; No → Involuntarism).  
  - **Conciliationism-Suspension (Leaf 3) vs. Global Suspension (Leaf 8)**  
    Both answer Q1=C, Q3=D, Q5=B. *Need:* "Does HE about HE require suspension?" (Yes → Global; No → Conciliationism-Suspension).  

  ---

  ### **Unoccupied Cells**  
  Combinations with no occupied leaf:  
  - **Q1=A → Q2=C → Q4=B**  
    *Why:* Incoherent. Applying HE self-underminingly (Q4=B) conflicts with deferring to a better self (Q2=C).  
  - **Q1=B → Q3=A → Q5=A → Q7=A → Q8=A**  
    *Why:* Unattractive. Admits HE removes basis (Q1=B) but still conciliates in peer cases (Q5=A) and rejects akrasia (Q7=A).  
  - **Q4=B → Q6=D → Q7=B → Q8=A**  
    *Why:* Unexplored. Global suspension (Q4=B) but ignoring AI disagreement (Q6=D) and endorsing akrasia (Q7=B) is unstable.  

  ---

  ### **How to Use**  
  Have each reading group member answer Q1–Q8. Map their answer path to a leaf. This isolates their view without labels. The unseparated pairs and unoccupied cells highlight conceptual boundaries in the literature. No citations or further reading needed—cases stand alone.
