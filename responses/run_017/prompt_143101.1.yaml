prompt: |-
  Hi — hoping someone here has read more of this literature than I have. I keep running into the same shape of thing in writing about money in politics, and I want a word for it if there is one. But more than the word: I want to know whether what I'm looking at is one thing or three things stuck together, because I keep sliding between descriptions of it and I can't tell if I'm describing a real pattern or just getting annoyed at the same article over and over.

  Here's the pattern as I see it. Everyone agrees there's too much money in politics; a reform gets passed that closes off the channel the money is most visibly flowing through — hard money caps, party soft-money accounts shut down, a disclosure threshold tightened, a cooling-off period before a former official can lobby their old office. A couple of cycles later the money is somewhere else: an outside group that technically doesn't coordinate, a trade association that doesn't have to name its funders, a "strategic advisory" firm staffed by the same people who used to file lobbying registrations. Fine — money relocates, everyone says money is like water and finds an outlet.

  The bit I don't have a word for comes after. The reform gets scored by whether the original channel dried up. Registrations fall and reformers announce that disclosure worked; registrations climb back and opponents announce the reform was theater. The number is real and it really moved. Nobody is measuring the thing the reform was supposed to change — how much sway money actually buys, whose preferences the system tracks — because that's expensive and contested to measure, and both sides in the argument do better arguing about the cheap number. And as far as I can tell nobody is lying: the channel-level figure is accurate, it's just a figure for a different quantity than the one everyone is arguing about, and everyone knows that, and nobody has an incentive to be the person who says it out loud.

  Things I've been pointed at that don't seem to be it: regulatory arbitrage (usually about deliberately exploiting a gap between two rules, and here a lot of the relocation is just people doing their jobs under a new rule rather than hunting for a loophole), Goodhart's law (the measure isn't gamed — it's knowingly used as a stand-in, which isn't the same failure), the waterbed or balloon effect (right about the relocation, silent about the scoring), and the streetlight effect (too general, it's about where you look, not about why you keep looking there after you've been told). Maybe I'm dismissing one of those too fast, in which case say so and say why.

  My hunch, which I can't tell is deep or obvious: the two halves are one thing. You can only write a rule against a channel, because channels are the only part of this you can define in a statute — so every reform is scored against the channel it closed, and being scorable against that channel is what makes it look like it worked even when nothing much changed. The relocation isn't an unfortunate side effect of the reform; it's what you should predict from the fact that the reform had to be written against something nameable.

  So: does this have a name of its own? If it does, what's in it and what isn't? If it doesn't, give me one and define it tightly enough that it doesn't collapse into the four near-misses above, and tell me what would count as a genuine non-instance — a reform that actually changed how much money buys rather than where it flows — under your definition. Two cases I want handled separately, because I think they come apart: (a) a court decision reopens the channel rather than the industry finding a new one, and (b) a public financing scheme with small-donor matching, where the total goes up but the causal link between any one donor and any one outcome gets weaker. Is (b) the same phenomenon with a happy ending, or a different animal entirely? And be explicit about whether your concept needs anyone to intend the relocation, or whether it's purely structural.

  Don't send me a reading list or a pile of citations, I've got library access and I'll find those myself. I want the concept and its edges.
reasoning: |-
  Okay, let me start by really understanding the user's query. They're describing a recurring pattern in money-in-politics reforms: a regulation targets a specific channel for money flow, the money relocates to a new channel, and then the reform is evaluated based solely on whether the original channel dried up, not on whether the actual influence of money decreased. The user feels this is a structural issue but can't find the right term for it and wants to know if it's one cohesive phenomenon or separate parts. 

  First, I need to unpack the examples they gave. They mention reforms like hard money caps, disclosure thresholds, cooling-off periods. After implementation, money moves to outside groups, trade associations, advisory firms. Then, success is measured by metrics like decreased registrations in the original channel, even though overall influence might not change. The user dismisses terms like regulatory arbitrage, Goodhart’s law, balloon effect, and streetlight effect as not quite fitting. 

  Hmm, why don't those fit? Regulatory arbitrage involves intentional exploitation of loopholes, but here the relocation might not be deliberate—just a natural shift under new rules. Goodhart’s law is about measures becoming targets, but here the measure isn't being gamed; it's accepted as a proxy despite being inadequate. Balloon effect describes displacement but not the faulty evaluation. Streetlight effect is about convenience, but here the issue is more about institutional incentives to use flawed metrics.

  The user’s hunch is that the two parts—channel closure and misplaced evaluation—are intrinsically linked because reforms can only target definable channels, so evaluation defaults to those. The relocation isn't a side effect but inherent. They want a term that captures this structural bind.

  I recall concepts like the "hydraulic effect" in economics, where suppressed flows reappear elsewhere, but that doesn’t cover the measurement problem. The evaluation part reminds me of Campbell's law, but that’s closer to Goodhart’s. Maybe a new term is needed. "Channel fixation" comes to mind, combining the hydraulic shift with the institutional focus on measurable but irrelevant metrics.

  Testing the user's cases: (a) Court reopening a channel—still fits because evaluation focuses on the channel, not influence. (b) Public financing with small-donor matching—here, the causal link weakens, so it might be a genuine change. Under my definition, it’s different because the reform targets influence structure, not just a channel. 

  Deep needs: The user is frustrated with superficial reform debates and wants conceptual clarity to advocate for better solutions. They might be a researcher or activist seeking to reframe the discussion. They need a precise term to articulate why channel-based reforms fail, helping them push for outcome-based evaluations instead.
answer: |-
  Based on your precise dissection, this **isn't one of the near-misses you listed.** It's a distinct phenomenon combining structural constraints, institutional incentives, and epistemic limitations. The core issue is the **inherent substitution of measurable channel activity for unmeasurable influence outcomes in the evaluation of political finance reforms.**

  The most fitting concept encapsulating this pattern is:

  **Channel-Fixated Reform Evaluation (CFRE)**

  ### Definition of CFRE
  **CFRE occurs when:**
  1.  A political finance reform targets a specific, legally definable *channel* for money flow or access.
  2.  Post-implementation, evaluation focuses primarily or exclusively on changes in activity *within the targeted channel* (e.g., dollars spent, registrations filed).
  3.  This channel-centric evaluation substitutes for measuring the reform's intended impact on the *underlying outcome* (e.g., reduction in undue influence, alignment of policy with public preferences).
  4.  The substitution persists because:
      *   The channel metric is objectively measurable, cheap, and legally defined.
      *   The underlying outcome is subjective, complex, expensive, and contested to measure.
      *   Both proponents and opponents have strategic incentives to use the clear channel metric (proponents: show "success"; opponents: show "failure") rather than engage with the ambiguous outcome.
      *   The structure of the reform (targeting a channel) inherently makes channel activity the only readily available, objective data point.

  ### What's In & What's Out
  *   **In:** The hydraulic displacement *combined* with the subsequent evaluation focused solely on the original channel's metrics. The *knowing* use of the channel metric as a proxy for the outcome, despite awareness it's inadequate. The structural limitation that reforms can only target channels, not influence directly. The alignment of incentives for both sides to use the flawed metric.
  *   **Out:** Mere hydraulic displacement (balloon effect) without the evaluation trap. Deliberate loophole exploitation *unless* the new activity is a direct, predictable consequence of the reform's structure. Gaming the metric (Goodhart's Law). Looking only where it's easy *without* the specific incentive structure and substitution for the intended outcome.

  ### Why the Near-Misses Don't Fit
  1.  **Regulatory Arbitrage:** Focuses on *intentional* exploitation of gaps. CFRE's relocation can be unintentional adaptation; the core flaw is the *evaluation*, not the relocation method.
  2.  **Goodhart's Law:** Focuses on the measure *becoming* the target and being gamed. In CFRE, the channel metric *isn't gamed to look good*; it's *knowingly used* as a flawed proxy *instead* of the target outcome. The failure is substitution, not distortion.
  3.  **Balloon/Waterbed Effect:** Describes relocation only. Silent on the critical evaluation failure that defines CFRE.
  4.  **Streetlight Effect:** Too broad. It explains *why* the channel is measured (it's easy), but not *why the outcome isn't measured* (hard, contested, no incentive) or the *strategic use* of the channel metric by both sides in the debate.

  ### Handling Your Cases
  1.  **(a) Court Reopening the Channel:** **This is still CFRE.** The initial reform targeted the channel. Evaluation focused on the channel metric (which initially moved). The court decision changes the landscape, but the *evaluation pattern* remains: post-decision, debate will focus on the *reopened channel's* activity levels (e.g., "See, registrations surged back! Reform failed!") rather than the underlying influence question. The core evaluation trap persists.
  2.  **(b) Public Financing / Small-Donor Matching:** **This is a genuine non-instance *if* it works.** CFRE requires evaluation to fixate on a *channel metric* instead of the *outcome*. A successful small-donor program aims to change the *structure of influence* (reducing large-donor power, increasing responsiveness to small donors). If evaluated *properly*, you'd look at donor diversity, policy congruence with broader publics vs. wealthy interests, *not* just the total amount in the new public channel. If proponents point only to "more small donations!" and opponents point only to "total spending went up!" while ignoring influence metrics, they *are* falling into CFRE. But if evaluation *actually tracks influence changes* (e.g., studies showing reduced correlation between large donations and policy wins, increased responsiveness to small donors), it escapes CFRE. The *potential* for CFRE exists in the evaluation phase, but the reform itself targets the influence structure more directly than channel-blocking reforms.

  ### Intent & Structure
  CFRE is **primarily structural.** It doesn't require anyone to *intend* the relocation or the evaluation trap. The relocation is a predictable consequence of targeting a channel (structural). The evaluation trap arises from the interaction of:
  *   The inherent difficulty of measuring influence (structural/epistemic).
  *   The availability of the channel metric (structural).
  *   The strategic incentives for political actors (institutional).

  While individuals might cynically *exploit* CFRE, the phenomenon itself emerges from the system's structure and the nature of the reform goals.

  ### A Genuine Non-Instance
  A reform that **successfully changes how much sway money buys** would be one where **post-reform evaluation demonstrates a measurable shift in the relationship between financial inputs and political outputs/access/influence**, using methods designed to capture that outcome *directly*, not via channel proxies. Example: Rigorous studies showing reduced correlation between industry donations and regulatory favors *attributable to the reform*, or increased responsiveness to non-donor constituent preferences, *without* the money simply relocating to exert the same influence elsewhere. Public financing *that demonstrably achieves this influence shift* (case b done right) is the clearest candidate. A reform that successfully *eliminates* a significant source of undue influence without creating a functional substitute *and* where this is measured via influence outcomes would also qualify. The key is the *evaluation focus and demonstrated impact* on influence, not just channel flow.
