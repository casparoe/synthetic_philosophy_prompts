answer: |-
  ## MEMORANDUM

  **TO:** Community Safety and Licensing Committee  
  **FROM:** [Your Name], Policy Analyst  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommendation on Adult-Services Licensing Bylaw Framework  

  ---

  ### 1. RECOMMENDATION & OVERVIEW

  **Recommendation:** Adopt a hybrid regulatory approach focused on harm reduction and worker safety, prioritizing municipal governance of conditions over provincial criminalization. Specifically:
  *   **Sellers:** Municipal licensing *optional* for premises, with safety-focused conditions (aligned with collective’s request). **No mandatory municipal registration.**
  *   **Buyers:** **No request to Province for criminalization.** Rely on municipal licensing conditions governing premises conduct.
  *   **Third Parties/Platforms/Landlords:** Municipal licensing *mandatory* for premises operators/facilitators (e.g., agencies, booking services). **No request to Province for criminalization.**
  *   **Advertising:** **No request to Province for criminalization.** Rely on municipal licensing conditions for licensed premises/platforms regarding transparency and accuracy.

  **Core Reasoning:** This approach best balances the committee’s diverse concerns within municipal jurisdiction:
  1.  **Centers Worker Safety:** Directly addresses the safety concerns raised by the worker collective (panic buttons, shared refusal list, intoxication policy) through enforceable licence conditions, without imposing counterproductive registration.
  2.  **Respects Autonomy & Mitigates Harm:** Avoids criminalization elements that evidence suggests drive the trade underground, increase stigma, and endanger workers by deterring engagement with authorities. Optional licensing incentivizes adoption of safety standards without coercion.
  3.  **Addresses Public Order (Police Priority):** By licensing premises (shared or individual) and imposing safety/operational standards, it provides a framework for regulating location and conduct, reducing street-based activity and neighbour concerns.
  4.  **Municipal Competence:** Focuses on core municipal levers (licensing conditions, zoning) rather than requesting provincial criminalization unlikely to align with harm reduction goals or be effectively enforced.
  5.  **Pragmatism:** Responds to the immediate application and evolving nature of the industry (e.g., online platforms) without requiring fundamental provincial law reform.

  **Strongest Consideration Against:** This model does not explicitly aim to reduce the overall *incidence* of sex work, a core goal for proponents of the Nordic model. It accepts that sex work will occur and focuses on governing its conditions. Critics may argue this constitutes tacit endorsement, fails to challenge underlying structural inequalities driving participation (assumption: reducing supply/demand is necessary to address exploitation/inequality), and may inadvertently facilitate exploitation if licensing oversight is weak. The recommendation assumes that improving safety and agency for existing workers is a more immediate and achievable municipal goal than attempting demand suppression through provincial criminal law, the efficacy and unintended consequences of which are contested.

  ---

  ### 2. UNBUNDLED REGULATORY APPROACH

  The recommendation deliberately decouples the elements often bundled in national models. Justification is provided for each actor and tool.

  **(A) SELLERS (Sex Workers)**
  *   **Recommended Tool:** **Municipal Licensing (Optional) + Licence Conditions.** Allow licensing of premises (individual apartments, shared spaces like the collective's proposal) on an *optional* basis. Mandate specific conditions for licensed premises (e.g., panic buttons, client refusal list maintenance, intoxication policy, basic health/safety standards for physical spaces). **Explicitly prohibit mandatory municipal registration of individual worker names.**
  *   **Justification:**
      *   *Safety:* Licence conditions directly address documented risks faced by workers (violence, problematic clients). The collective's request demonstrates worker-led demand for such measures.
      *   *Autonomy & Risk Mitigation:* Mandatory registration creates significant risks (outing, immigration, employment) as highlighted by the collective, deterring engagement and pushing work underground, counteracting safety goals. Optional licensing respects worker choice while providing incentives (legitimacy, access to municipal safety support/mediation).
      *   *Municipal Role:* Premises safety and business operation are squarely within municipal licensing and zoning authority. Registration databases are not essential for this function and pose disproportionate risk.
      *   *Assumption:* Workers are capable of identifying safety needs and making choices about licensing based on their circumstances. If this assumption failed (e.g., evidence of widespread coercion negating worker agency), mandatory licensing *of premises* (not individuals) might be reconsidered, but registration would remain inadvisable.

  **(B) BUYERS (Clients)**
  *   **Recommended Tool:** **Municipal Inaction (regarding criminalization).** Do not request the Province to criminalize the purchase of sexual services.
  *   **Justification:**
      *   *Worker Safety & Autonomy:* Criminalization of clients is strongly linked (assumption) to rushed transactions, pressure on workers to accept riskier clients/situations, and decreased ability for workers to screen clients effectively or report violence to police for fear of disrupting investigations. The collective's safety model relies on worker control over client interaction.
      *   *Asymmetry Rationale:* The rationale for penalizing buyers while protecting sellers hinges on viewing sellers primarily as victims lacking agency, and buyers as inherent exploiters. The collective's proactive, organized submission explicitly contradicts this victim narrative, demonstrating clear agency, operational competence, and safety prioritization. Dismissing their testimony to impose a buyer-penalty model they likely oppose undermines the stated goal of "protecting" them. If sellers are competent to run a safe business (as their proposal suggests), the rationale for asymmetrical criminalization weakens significantly. Municipal focus should be on regulating the *conditions* of transactions, not inherently criminalizing one party based on contested assumptions about power dynamics.
      *   *Effectiveness & Enforcement:* Evidence on the effectiveness of criminalizing buyers in reducing harm or incidence is mixed and context-dependent. Municipalities have limited influence on provincial criminal enforcement priorities. Licence conditions governing *premises conduct* (e.g., refusing intoxicated clients) offer a more direct municipal lever.
      *   *Alternate Path:* Use licensing conditions *on premises* to govern buyer behaviour within those premises (e.g., mandatory ID checks recorded *by the premises*, intoxication policies enforced by staff/workers).

  **(C) THIRD PARTIES / PLATFORMS / LANDLORDS**
  *   **Recommended Tool:** **Municipal Licensing (Mandatory for Operators/Facilitators).** Require licensing for businesses or individuals operating premises, managing booking services (like the collective's proposed shared service), or facilitating connections (e.g., agencies, dedicated platforms). Impose conditions similar to sellers' premises (safety protocols, record-keeping related to premises safety).
  *   **Justification:**
      *   *Accountability & Safety:* Third parties controlling premises or significant aspects of the work environment have a direct impact on worker safety. Licensing allows the city to set and enforce baseline operational and safety standards for these entities.
      *   *Public Order & Zoning:* Provides a mechanism to regulate the location and operation of businesses managing sex work services, addressing the Police Chief's concern about spillover into residential streets. Conditions can address neighbour impacts (e.g., signage, traffic, noise).
      *   *Level Playing Field:* Ensures agencies/platforms operating commercially are subject to similar oversight as worker collectives operating shared premises.
      *   *Distinction:* Focuses on *business operators*, not incidental landlords solely renting space without involvement in the service provision. Landlord regulation remains primarily under tenancy law.
      *   **No Request for Criminalization:** Criminalizing third parties risks driving facilitation further underground, potentially increasing worker vulnerability to exploitative operators and hindering access to legitimate services/support. Licensing is a more appropriate municipal tool.

  **(D) ADVERTISING**
  *   **Recommended Tool:** **Municipal Inaction (regarding criminalization).** Do not request the Province to criminalize advertising of sexual services. Apply municipal licence conditions to *licensed premises/platforms* regarding advertising transparency and accuracy.
  *   **Justification:**
      *   *Worker Access & Safety:* Online advertising is a primary tool for independent workers and collectives to safely screen clients and control their work environment. Criminalizing advertising severely limits this autonomy and pushes advertising to less secure channels.
      *   *Practicality & Jurisdiction:* Effectively policing online advertising, much of it hosted outside municipal/provincial jurisdiction, is extremely difficult and resource-intensive.
      *   *Licence Condition Lever:* Where premises or platforms are licensed, conditions can require advertising to accurately represent the licensed entity and services offered, prohibit false claims, and require contact information traceable to the licensed operator for accountability. This addresses potential fraud or misrepresentation without blanket criminalization.
      *   *Assumption:* Advertising is a tool used by both independent/empowered workers and potentially exploitative third parties. Criminalization disproportionately harms the former without effectively stopping the latter. If evidence emerged that specific advertising platforms were overwhelmingly linked to trafficking/exploitation, a targeted request to the Province *regarding those specific platforms* could be considered, but a blanket criminalization request is not recommended.

  ---

  ### 3. PURPOSE OF THE BYLAW

  The fundamental purpose of the bylaw must be clearly stated to guide interpretation and implementation:

  **Purpose Clause:** *"The purpose of this bylaw is to enhance the health, safety, and human rights of individuals involved in the provision of adult services, to mitigate potential harms associated with the operation of adult service businesses, to address impacts on surrounding communities, and to provide a regulatory framework for such businesses operating within the City, without the objective of reducing the overall incidence of consensual adult services."*

  *   **Rationale:** This purpose focuses on governing conditions and mitigating associated harms (violence, exploitation, public nuisance), aligning with the recommended regulatory approach and municipal jurisdiction. It explicitly rejects *reducing incidence* as a municipal objective, recognizing the committee's split on this point and the reality that municipal bylaws are poorly suited to achieve this. Framing it around health, safety, human rights, and community impacts provides measurable goals relevant to all perspectives.

  ---

  ### 4. CONSISTENCY CHECK WITH ADJACENT CASES

  Applying the core rationale (governing conditions, prioritizing safety/autonomy of consenting adults, mitigating third-party exploitation and community harm) to adjacent cases:

  *   **Licensed Strip Club Work:** **Permitted/Similar.** Municipal licensing governs premises safety, worker safety protocols (e.g., security, bouncers), alcohol service, and community impacts (zoning, noise). Focus is on conditions, not preventing the work itself. Distinction based on specific *type* of performance within adult entertainment.
  *   **Adult Film Production:** **Permitted/Similar with Distinction.** Safety regulation focuses on industry-specific standards (e.g., STI testing protocols, condom use mandates in some jurisdictions, contractual clarity) often via provincial labour/OH&S or industry self-regulation. Municipal role might involve business licensing for production studios/facilitators, focusing on premises safety and operational standards. Key distinction is the recorded nature and potential for wider distribution, but core safety/autonomy principles apply to performers.
  *   **Paid Surrogacy:** **Permitted/Similar.** Heavily regulated provincially/federally under health and family law, focusing on informed consent, medical/legal safeguards, and preventing exploitation of surrogates. Municipal role is minimal, but the underlying principle of governing conditions to protect participants aligns.
  *   **Paid Care Work Involving Intimate Touching (e.g., Bathing):** **Permitted/Similar.** Governed by provincial healthcare regulations, professional standards, vulnerable sector checks, and workplace safety rules. Focus is on safety, dignity, consent, and preventing abuse. Municipal role is typically indirect (business licensing for agencies, zoning for facilities). The rationale clearly applies – the work itself is not the harm; unsafe conditions or exploitation are the harms to be mitigated.

  **Acceptability:** This result is acceptable and consistent. The rationale condemns *exploitation, coercion, unsafe conditions, and fraud* regardless of the specific intimate service sector. It permits consensual adult activities conducted safely and autonomously, subject to appropriate, risk-based regulation focused on preventing harm to participants and communities. The distinction between these sectors lies in the *specific nature* of the service and associated risks, not a fundamental moral condemnation of one specific type of intimate service (sex work).

  ---

  ### 5. SUNSET & REVIEW CLAUSE

  Given fundamental disagreement on metrics of success, the review must capture data relevant to all perspectives:

  **Review Trigger:** The bylaw shall be reviewed by the Committee 3 years after coming into force, or sooner if directed by Council.

  **Metrics for Review:**
  *   **Worker Safety & Rights:**
      *   Number of licensed premises/operators.
      *   Reported incidents of violence or threats against sex workers within the city (from police, health services, worker support orgs - anonymized).
      *   Uptake/utilization of municipal safety resources or mediation services by workers/premises.
      *   Qualitative feedback from sex worker organizations/collectives on safety and autonomy.
      *(Relevant to NZ/Decrim & Hybrid models; Nordic may see limited engagement as failure)*
  *   **Public Order & Community Impact:**
      *   Number and nature of complaints related to licensed premises (noise, traffic, etc.).
      *   Police data on street-based sex work activity (acknowledging limitations).
      *   Feedback from neighbourhood associations in areas with licensed premises.
      *(Relevant to all models, especially Police priority)*
  *   **Incidence & Nature of the Trade:**
      *   Estimated number of individuals providing sex work services within the city (acknowledging methodological challenges).
      *   Nature of work (independent vs. third-party managed, online vs. in-person, premises-based vs. other).
      *(Nordic views decline as success; NZ/Hybrid view stability/visibility as indicator of reduced stigma/safer environment; German may see increase as sign of formalization)*
  *   **Exploitation:**
      *   Law enforcement reports of trafficking or severe exploitation identified within city-linked operations (licensed or unlicensed).
      *   Referrals to victim services related to trafficking in the sex sector.
      *(Relevant to all models as a measure of failure)*
  *   **Regulatory Function:**
      *   Compliance rates with licence conditions.
      *   Bylaw enforcement actions/costs.
      *   Appeals or challenges to licensing decisions.

  **Interpretation:** The review report must explicitly state that a measured *decline in the number of people selling sex* is not, in itself, defined by this bylaw as a success metric. The analysis must contextualize this data alongside safety, community impact, and exploitation metrics, recognizing that different committee members will interpret the same data points differently based on their underlying objectives. The review should assess whether the bylaw is effectively achieving its stated purpose (governing conditions, enhancing safety, mitigating harms).

  ---

  ### 6. MOTION LANGUAGE

  **Recommended Motion for Council:**

  "That Council:
  1.  Adopt the Adult-Services Business Licensing Bylaw, substantially in the form attached, with the purpose of enhancing the health, safety, and human rights of individuals involved in the provision of adult services, mitigating potential harms associated with the operation of adult service businesses, addressing impacts on surrounding communities, and providing a regulatory framework for such businesses, without the objective of reducing the overall incidence of consensual adult services.
  2.  Establish a licensing framework within the bylaw that:
      *   a)  Makes licensing **optional** for individual workers or worker collectives operating premises, subject to safety-focused conditions including but not limited to panic alarm systems, maintenance of a shared client refusal list where applicable, and policies against accepting intoxicated clients.
      *   b)  **Prohibits** the mandatory municipal registration of individual sex worker names.
      *   c)  Makes licensing **mandatory** for businesses or individuals operating premises or facilitating adult services (including booking services, agencies, and dedicated platforms), subject to operational and safety conditions.
      *   d)  Utilizes zoning provisions to regulate the location of licensed adult service businesses.
  3.  **Decline** to request the Attorney General or Provincial Police Service to pursue criminalization of the purchase of sexual services, the advertising of sexual services, or the involvement of third parties in the adult services sector.
  4.  Direct the City Clerk to include a sunset and review clause requiring a report back to the Community Safety and Licensing Committee within three years of the bylaw coming into force, utilizing the metrics outlined in the Policy Analyst's memorandum dated October 26, 2023.
  5.  Forward a copy of this report and the adopted bylaw to the Attorney General and the Provincial Police Service, advising them of the City's regulatory approach and specifically noting the decision not to request criminalization measures at this time."

  ---

  **Final Note:** This recommendation prioritizes pragmatic harm reduction and worker safety within municipal authority, responding directly to the worker collective's reasonable safety requests while respecting their autonomy concerns. It avoids the significant risks and practical challenges associated with requesting provincial criminalization, particularly the criminalization of buyers which contradicts the agency demonstrated by the workers we consulted. The review mechanism provides a structured opportunity to evaluate the effectiveness of this approach based on evidence relevant to diverse viewpoints.
