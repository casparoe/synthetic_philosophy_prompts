prompt: |-
  I teach a third-year seminar on philosophy of action and social ontology — 17 students this term, and my department just moved us to 80-minute blocks, so I'm still getting used to having more time than I know what to do with. We've read a bit of Bratman and a bit of Gilbert, and the same thing keeps happening: everyone nods along when we say that a joint action isn't just several people each doing something that happens to add up, and then they go straight back to drawing it that way the moment we hit a hard case. Two years ago I tried the demo where two students carry a table out of the room and I ask who did what; it was useless, everyone just said "we did it" and looked at me like I was wasting their time. Separately, I was talking to a colleague down in psychology who works on joint attention in toddlers, and she made the offhand remark that very young kids seem to coordinate on things they can't possibly have any overall conception of — they're tracking a local cue, not a shared goal — and I haven't been able to stop chewing on that.

  So I want a real activity this time: rules, roles, small stakes, where they run into the problem before it has a name. Constraints: no real money (points toward a coffee voucher are fine), no more than about 50 minutes of actual play so I keep 30 for debrief, and nothing needing prep beyond envelopes, index cards, a stopwatch and a whiteboard. I don't want to say "shared intention," "we-intention," or "joint commitment" out loud until the debrief.

  The contrast I want them to feel has a few faces, and I'd like the rounds arranged so they hit them in this order, more or less. First: a case where nobody in the group has the whole plan — each person only gets their own fragment and only gets local feedback about whether they're on track — and yet they still succeed, and they still get quietly annoyed at anyone who slacks, and afterwards they still describe it as something *we* did. Second: a case where the group succeeds smoothly and everyone is fully informed and fully cooperative, except that one member was privately instructed to be a pure mercenary — they don't care about the group at all, they're only maximising their own points, they'd walk if a better offer came along — and nobody else knows this. Third: a case where the group has to choose what to do by majority vote, and someone who voted against then has to carry out the winning option; afterwards "we did it" feels wrong in their mouth, but from outside it's obvious that the group did it. My own suspicion, which I'd rather the activity test than assume, is that the "we" isn't really in anyone's head at all — it's in the structure: roles, procedures, who can call things off, who can be rebuked and by whom. But I want at least one round set up so that this suspicion could lose, and lose visibly, because the students should be arguing with each other and not just with me.

  What I need from you is the activity itself, and I'd like it in these sections, roughly this long:

  **Setup and materials** — about 150 words: what I prepare, what each envelope contains, how groups are formed.
  **The rounds** — about 600 words: three rounds with concrete rules, the secret role cards, and a payoff scheme that makes the relevant choice bite without money.
  **Minute-by-minute** — about 150 words: a timeline for the 80 minutes including what I'm doing while they play.
  **Debrief** — about 450 words: the order in which I reveal what, which moment in the play maps onto which theoretical option, and the questions that get them to say the distinction themselves before I name it.
  **What will go wrong** — about 250 words: the predictable failures and how to handle them (someone working out that there are secret cards, a group finishing early, someone refusing a role, the vote landing on the one person who can't do the task).
  **What the activity can't show** — about 200 words: the part of the theory that has to come from me in lecture form, especially anything about the normativity of joint action that a coffee voucher can't buy.

  **Settled vs contested** — about 200 words: in your notes to me, seperate what's close to consensus among people who work on this from what's a live fight, and flag anywhere your design quietly rigs the intuition toward one theory. Please don't write the debrief as though my "structure not heads" hunch were the received view — if it's a minority position, say so and say what the majority would make of the same rounds.
reasoning: |-
  We are designing an activity for a philosophy seminar on joint action and social ontology. The professor wants an activity with three rounds that illustrate specific contrasts without using theoretical terms until the debrief. The constraints are: no real money, about 50 minutes of play, 30 minutes for debrief, and minimal materials (envelopes, index cards, stopwatch, whiteboard). The activity should have three rounds:

  1. **Round 1: Distributed Knowledge and Shared Achievement**  
     - Each participant has only a fragment of the plan and local feedback. They succeed, feel it as a joint action, and get annoyed at slackers.

  2. **Round 2: Hidden Mercenary**  
     - The group succeeds smoothly, but one member is a mercenary (only maximizing their own points) and others don't know.

  3. **Round 3: Majority Vote and Dissenting Execution**  
     - The group chooses an action by majority vote, and a dissenter has to carry it out. The dissenter feels odd saying "we did it", but externally it's clear the group did it.

  The professor's hunch is that the "we" is in the structure (roles, procedures) rather than in anyone's head. But the activity should allow for the possibility that this hunch might be proven wrong.

  We'll design a single game with three rounds that build on each other, using a common theme to keep it simple. Let's choose a theme: building a tower with blocks (like Jenga but with index cards or other simple materials). However, the professor mentioned minimal materials, so we might use drawing or arranging cards.

  Alternatively, we can use a puzzle-solving task. Let's design a "circuit" or "assembly line" task for Round 1, a cooperative task with a hidden mercenary in Round 2, and a decision-making task for Round 3.

  But note: the rounds should be distinct and the contrasts clear. We might have three separate games, but that might take too much time. Instead, we can have one overall game with three phases.

  **Overall Concept: The "Group Build" Game**

  The game involves constructing a structure (like a tower of index cards) or solving a puzzle (like arranging cards in a specific order). We'll use index cards for everything.

  **Setup and Materials (150 words):**

  - **Materials:** Index cards (about 100), envelopes (one per student per round, plus some extra), markers, stopwatch, whiteboard for scoring.
  - **Groups:** Divide the 17 students into 3 groups (5-6 per group). Each group plays independently, so we can run the rounds simultaneously. (If 17 doesn't divide evenly, have two groups of 5 and one of 7, but note that Round 3 requires an odd number for voting. So adjust: two groups of 5 and one of 7 might work if we design the voting appropriately. Alternatively, make groups of 5, 6, and 6. We'll design for groups of 5-7.)

  - **Preparation:** 
    - For Round 1: Prepare envelopes for each group. Each envelope for a group contains one index card with a fragment of instructions for building a structure (e.g., "Card 1 must be placed horizontally. It must support two vertical cards."). Each student in the group gets one envelope with one instruction. The full set of instructions, when followed, will build a stable structure. Also, prepare a set of 20 index cards per group (for building).
    - For Round 2: Prepare new envelopes. Each contains a role card. For each group, one envelope has a "Mercenary" card (secretly assigned), and the others have "Team Player" cards. Also, prepare a simple cooperative task (e.g., build the same structure as Round 1 but now everyone has the full instructions? But then the mercenary might not be needed. We need a task where the mercenary can choose to cooperate or defect without being detected easily). Instead, let's make it a task that requires each person to contribute a part, and the mercenary is told to maximize points by sometimes cooperating and sometimes free-riding? But the professor said the group succeeds smoothly and the mercenary is private. So we design the task such that the mercenary must cooperate to avoid detection, but doesn't care about the group. We'll use a point system.
    - For Round 3: Prepare a set of action options on index cards and a voting procedure. Each group must choose one action by majority vote, and then the group must perform that action (like building a specific structure). One member (who voted against) is assigned to build it.

  **The Rounds (600 words):**

  We'll have three rounds, each with a different setup. The entire game is called "Group Build." The goal is to earn points (coffee voucher points) for the group, but individuals can earn points too (for the mercenary). We design the point system so that in Round 2, the mercenary can get more points by cooperating (because if the group fails, they get nothing) but they are only out for themselves.

  **Round 1: Distributed Build**

  - **Goal:** Build a tower of index cards that stands for at least 10 seconds, using the provided cards (20 per group). The tower must be built according to the hidden rules.
  - **Rules:** Each student gets an envelope with one rule (written on an index card). They cannot show their rule to anyone else, but they can communicate verbally. They must build the tower without writing anything down. The rules are interdependent (e.g., "The base must be two cards placed in a T shape", "The second layer must have one card balanced on the T's intersection", etc.). The group has 10 minutes. 
  - **Feedback:** During building, they can test stability (local feedback). 
  - **Scoring:** If the tower stands for 10 seconds, each member gets 5 points (group points). 
  - **Key:** They don't have the whole plan, but they must coordinate via communication. Afterward, they will feel it as a joint action and be annoyed at slackers (if any).

  **Round 2: Hidden Roles Build**

  - **Goal:** Build a different structure (e.g., a pyramid of cards) in 8 minutes. This time, everyone in the group gets the full set of instructions (so they know the plan). However, each student gets a role card in an envelope. One is the "Mercenary": their goal is to maximize their own points. They are told: "You are only in it for yourself. You get 10 points if the group succeeds, but you also get 1 point for every minute you don't touch a card (up to 5 points). So you can choose to work less and still get some points if the group succeeds. But if the group fails, you get 0." The others are "Team Players": they get 10 points each if the group succeeds, and 0 if it fails, and they are told to work for the group. 
  - **Rules:** The mercenary's role is secret. The group must build the pyramid using the full instructions (given to everyone). The mercenary might choose to work minimally (so they get 5 points from not working and 10 from success, total 15) or work hard to ensure success. But since the group has the instructions and the task is easy, they might succeed even if one person slacks a bit. The mercenary is not allowed to reveal their role. 
  - **Scoring:** Group success: 10 points per member (but mercenary gets the extra points for slacking). 
  - **Key:** The group succeeds smoothly and everyone seems cooperative, but one person is a mercenary.

  **Round 3: Voting and Execution**

  - **Goal:** Choose one of three possible structures to build (each described on a card) and then build it in 5 minutes. 
  - **Procedure:** 
    - Step 1: The group is given three index cards, each describing a structure (e.g., "A tower with exactly 5 cards", "A pyramid with 10 cards", "A bridge between two books using 7 cards"). They have 3 minutes to discuss and then vote by majority. In case of a tie, the professor flips a coin.
    - Step 2: After the vote, the professor randomly assigns one member who voted against the winning option to build it (if there is a dissenter; if not, assign randomly). The group can watch and give verbal advice but cannot touch the cards. The builder has 5 minutes to build it. 
  - **Scoring:** If the structure is built correctly and stands for 10 seconds, the group gets 10 points (each member gets 10). If it fails, 0. 
  - **Key:** The dissenter who builds it might feel odd about "we did it", but the group gets credit.

  **Minute-by-Minute (150 words):**

  - 0-5 min: Introduction and group formation (3 groups of 5-6). Explain the overall goal (earn points for coffee voucher) and that there are three rounds. Hand out Round 1 envelopes and materials.
  - 5-15 min: Round 1 (10 minutes). Circulate, observe, time.
  - 15-20 min: Collect Round 1 results, score on whiteboard (if tower stands, award points). Hand out Round 2 envelopes and materials.
  - 20-28 min: Round 2 (8 minutes). Observe, note interactions.
  - 28-33 min: Collect Round 2 results, score. Hand out Round 3 materials (three option cards per group) and explain the voting procedure. Assign roles for building after the vote.
  - 33-36 min: Groups discuss and vote (3 minutes).
  - 36-41 min: Building by the assigned member (5 minutes). Groups watch and advise but don't touch.
  - 41-46 min: Collect Round 3 results, score.
  - 46-50 min: Transition to debrief (allow a couple of minutes for settling).
  - 50-80 min: Debrief (30 minutes).

  **Debrief (450 words):**

  Start by asking about their experiences without using theoretical terms.

  1. **Round 1:** Ask: "In the first round, did anyone know the entire plan? How did you coordinate? Did you feel that everyone was equally committed? How did you feel about someone who wasn't pulling their weight?" Elicit that they had only fragments but still felt it was a group effort. Point out that they had a shared intention without anyone having the whole picture.

  2. **Round 2:** Ask: "In the second round, how did it feel compared to the first? Did you notice anyone not fully engaged? How would you feel if you found out one of you was only in it for the points and didn't care about the group?" Then reveal that there was a mercenary. Ask: "Does knowing that change how you see the group's action? Was it still a joint action?" Contrast the internal state (mercenary's selfish intention) with the external appearance of cooperation.

  3. **Round 3:** Ask the dissenter who built it: "When you built the structure, did it feel like something you did or something the group did? How about the others?" Then ask the group: "From your perspective, was this a group action?" Highlight the tension between the dissenter's feeling and the group's responsibility.

  Now introduce the terms: 
  - Round 1: Illustrates **distributed joint intention** (Bratman) or **joint commitment** (Gilbert) without shared knowledge.
  - Round 2: Shows that **shared intention** (in the sense of Bratman) might require mutual belief in commitment, but the mercenary didn't have it. However, the group still acted jointly. This challenges the idea that joint intention must be in the head of every participant.
  - Round 3: Highlights the role of **social norms and procedures** in attributing group action even when an individual dissents. The group's decision-making process binds the dissenter.

  Finally, present the professor's hunch: Maybe the "we" is in the structure (roles, procedures) and not necessarily in each head. Ask: "In which rounds did the group action depend on the structure? In which did it depend on shared mental states?"

  **What will go wrong (250 words):**

  - **Someone working out secret roles:** In Round 2, if a student says "I bet one of us is a mercenary," acknowledge that it's possible but ask them to play along. If they guess, say that the point is to see what happens even if there might be one. In the debrief, use this to discuss how suspicion can undermine joint action.
  - **Group finishing early:** Have a backup task (e.g., improve the structure for bonus points) or let them wait. Keep the timing strict.
  - **Someone refusing a role:** In Round 3, if the dissenter refuses to build, the group fails. Use this to discuss obligation in joint action: "What would happen in a real group if someone refused? What sanctions apply?"
  - **Vote landing on the one who can't do the task:** If the assigned builder struggles, the group can give advice. If it fails, discuss in debrief: Was it still a group action even if it failed? What if the failure was due to the builder's lack of skill?
  - **Uneven groups:** With 17 students, groups of 5, 6, 6. For Round 3, if a group has no dissenter, assign randomly. If the vote is unanimous, assign randomly and note that in the debrief: "What if everyone agreed? How does that change the feeling?"

  **What the activity can't show (200 words):**

  - The normativity of joint action: The sense of obligation and rebuke (Gilbert) is simulated by points but not deeply felt. In real life, we feel we owe it to others to do our part and can rebuke others for failing. The coffee voucher points are a weak stand-in.
  - The role of mutual belief: Bratman emphasizes mutual belief in shared intentions, which the mercenary breaks, but the activity only touches on it.
  - Long-term joint action: The activity is episodic, but joint actions often unfold over time with planning and adjustment (Bratman's focus).
  - Collective responsibility: We didn't address how groups bear responsibility for actions.

  **Settled vs Contested (200 words):**

  - **Settled:** There is consensus that joint action is more than the sum of individual actions (the starting point). Also, that communication and shared knowledge facilitate joint action. 
  - **Contested:** 
    - Bratman vs Gilbert: Bratman sees shared intention as a mesh of individual intentions with mutual belief. Gilbert sees it as a joint commitment. The activity's Round 2 challenges Bratman because the mercenary doesn't have the right intention, but the group still acts jointly. Gilbert might say the joint commitment is there as long as the mercenary acts as if committed, but the mercenary hasn't actually committed. 
    - The professor's structural view is a minority position (associated with institutional approaches or social ontology like John Searle). The majority (Bratman, Gilbert, Tuomela) focus on mental states or commitments. 
    - Design rigging: Round 2 is set up so that the mercenary must cooperate to get points, so they don't defect. This avoids group failure and shows that even without the right intention, the group action proceeds. This rigs toward the structural view. Round 3 rigs toward the structural view by showing that procedures can bind dissenters.

  Now, we write the full activity accordingly.
answer: |-
  ### Group Action Simulation: "The Structure of We"  
  *Designed for 17 students in 80 minutes, using index cards, envelopes, a stopwatch, and a whiteboard. Coffee voucher points incentivize participation without real money.*

  ---

  ### **Setup and Materials**  
  **Materials:**  
  - **Index cards:** 100 blank cards (20 per group × 3 groups, plus extras).  
  - **Envelopes:** 51 total (17 students × 3 rounds). Label each with a student number (1–17) and round (R1, R2, R3).  
  - **Other:** Markers, stopwatch, whiteboard (for scoring and notes).  

  **Preparation:**  
  1. **Groups:** Split students into three groups (5/6/6). Assign each student a number (1–17) for anonymity.  
  2. **Round 1 Envelopes (R1):** For each group, prepare 5–6 unique *instruction cards* describing a step in building a card tower (e.g., "Base: 3 cards in a triangle," "Layer 2: 2 cards crosswise on base," etc.). Fragment instructions so no one has the full plan. Include 20 blank cards for building.  
  3. **Round 2 Envelopes (R2):** For each group, prepare *role cards*: one "Mercenary" (secretly assigned) and the rest "Team Players." Mercenary card: "Maximize your points. Group success gives you 10 pts, but you earn +1 pt for every 30 seconds you do nothing (max +5 pts)." Team Player card: "Aim for group success (10 pts each)."  
  4. **Round 3 Envelopes (R3):** Prepare *action cards* for each group: three options (e.g., "Build a 10-card tower," "Build a card arch between two books," "Create a card fan").  
  5. **Scoring:** Display points on the whiteboard: 5 pts/student for R1 success, 10 pts for R2/R3.  

  ---

  ### **The Rounds**  
  **Round 1: Distributed Build (10 min)**  
  *Goal: Build a stable card tower (stands 10+ seconds) using fragmented instructions.*  
  - **Rules:**  
    - Each student opens their R1 envelope, revealing only their step. They cannot show cards but can talk.  
    - Groups have 10 minutes to build. Anyone can adjust the structure, but only based on verbal coordination.  
    - **Success:** 5 pts/student if the tower stands (test with stopwatch).  
  - **Secretly Induced Tension:** One instruction card per group is designed to conflict slightly (e.g., "Base must be square" vs. "Base must be triangular"), forcing negotiation. Slackers (real or perceived) irritate the group.  
  - **Why it Works:** Students lack the full plan but still cohere as a "we" through local cues and mutual adjustment.  

  **Round 2: Hidden Mercenary (8 min)**  
  *Goal: Build the same tower as R1, but with full transparency and a hidden mercenary.*  
  - **Rules:**  
    - All students receive R2 role cards (kept private). Everyone gets identical *full instructions* for the tower.  
    - Groups have 8 minutes. Mercenaries can slack to earn idle points but must avoid detection (e.g., pretend to inspect cards).  
    - **Success:** 10 pts/student if the tower stands, but mercenaries earn idle points secretly.  
  - **Key Contrast:** Groups appear fully cooperative, but mercenaries act solely for self-gain. Smooth success masks internal divergence.  

  **Round 3: Dissenting Builder (7 min total: 2 min vote, 5 min build)**  
  *Goal: Choose a structure by majority vote; a dissenter builds it.*  
  - **Rules:**  
    - Groups receive R3 action cards (three options). Discuss for 2 minutes, then vote. Majority wins; ties resolved by coin flip.  
    - Randomly select a dissenter (or "no" voter) to build alone. Non-builders advise verbally but cannot touch cards.  
    - **Success:** 10 pts/student if the structure meets specs (judged by you).  
  - **Key Tension:** Dissenters perform the action but resist "we" language; the group claims collective credit.  

  **Payoff Scheme**  
  - Points translate to coffee vouchers (e.g., 25+ pts = $5 voucher).  
  - Incentivizes effort: Mercenaries risk group failure if they slack too much (R2), dissenters must build to earn points (R3).  

  ---

  ### **Minute-by-Minute Timeline**  
  - **0–5 min:** Introduce activity ("Build structures to earn points—observe how groups work"). Form groups. Distribute R1 envelopes and building cards.  
  - **5–15 min:** **Round 1.** Circulate, observe frustration/coordination. Test towers at 15 min; award points.  
  - **15–20 min:** Reset. Distribute R2 envelopes. Briefly explain: "Same task, new rules."  
  - **20–28 min:** **Round 2.** Note mercenary behavior (e.g., feigned distraction). Test towers; award points.  
  - **28–33 min:** Reset. Distribute R3 envelopes. Explain voting/building rules.  
  - **33–36 min:** **Round 3 vote.** Groups discuss/vote. Assign dissenters.  
  - **36–41 min:** **Round 3 build.** Dissenters build; groups advise. Test structures; award points.  
  - **41–50 min:** Reset materials. Students jot reflections: "When did it feel like ‘we’ acted? When not?"  
  - **50–80 min:** **Debrief** (see below).  

  ---

  ### **Debrief**  
  **Order of Revelation:**  
  1. **Elicit intuitions** (10 min): Ask:  
     - *R1:* "You had partial instructions—why did you still say ‘we built it’? How did slackers affect you?"  
     - *R2:* "Did anyone suspect hidden motives? If you learned one person didn’t care about the group, does that change ‘we’?"  
     - *R3:* "Builder: Did this feel like *your* action or the *group’s*? Non-builders: Why is it still ‘ours’?"  
     List responses on the whiteboard without judgment.  

  2. **Map play to theory** (10 min): Reveal the hidden elements:  
     - *R1* → "Distributed knowledge": No one had the whole plan, but local cues (Gilbert’s "plural subject" norms) created shared responsibility.  
     - *R2* → "Mercenary paradox": Group succeeded, but one lacked shared intention (Bratman’s "mutual responsiveness" broken). Ask: "Can ‘we’ exist if someone’s faking?"  
     - *R3* → "Procedure over psyche": Dissenters felt alienated, but group procedures (voting, roles) made it collective action (Searle’s "status functions").  

  3. **Theoretical distinction** (10 min): Pose:  
     - "When does ‘we’ emerge—from shared thoughts (Bratman/Gilbert) or roles/rules (structural view)?" Contrast:  
       - *Intention-first* (majority view): R2 mercenary shows joint action requires mutual commitment.  
       - *Structure-first* (your hunch): R1/R3 show "we" arises from rules (e.g., who can rebuke slackers in R1).  
     - End by naming theories: "This tension is Bratman vs. Gilbert vs. institutional approaches."  

  ---

  ### **What Will Go Wrong**  
  - **Secret roles exposed:** If students guess R2 mercenaries, say: "Play along—we’ll discuss how suspicion affects ‘we’." In debrief, highlight how transparency matters for Gilbert’s joint commitment.  
  - **Group finishes early:** Add a challenge (e.g., "Beat your height record for +1 pt"). Enforce strict timing otherwise.  
  - **Refusal to participate:** If a mercenary rebels, let it unfold. Debrief: "What sanctions exist in real groups? Gilbert says rebuke is key."  
  - **Dissenter can’t build:** If the task is impossible (e.g., voter lacks skill), allow group advice or reassign. Ask: "Does failure negate group action?"  
  - **Unanimous vote:** If no dissenters in R3, assign a random builder. Discuss: "Does agreement make ‘we’ stronger?"  

  ---

  ### **What the Activity Can’t Show**  
  The simulation simplifies normativity:  
  - **Moral dimension:** Real joint actions involve obligations (Gilbert’s "right to rebuke") that points can’t capture. Students comply for vouchers, not duty.  
  - **Mutual belief:** Bratman requires mutual belief in shared goals—simulated via rules but not internalized (e.g., R2 mercenary exploits this).  
  - **Long-term commitment:** The rounds are episodic; Bratman’s planning-based joint action (e.g., "painting a house together") requires sustained coordination.  
  - **Collective responsibility:** We didn’t address blame (e.g., if a tower collapses, who bears responsibility?).  
  *Lecture supplement needed:* Use Bratman on "shared cooperative activity" and Gilbert on "joint commitment" to explore how normativity binds agents beyond incentives.  

  ---

  ### **Settled vs. Contested (Notes for Instructor)**  
  - **Settled consensus:**  
    - Joint action ≠ aggregate individual actions (all rounds illustrate this).  
    - Shared intention requires some interdependence (R1’s fragmented plan forces this).  
    - Gilbert’s "joint commitment" explains the obligation to contribute (R1 annoyance at slackers).  
  - **Contested debates:**  
    - **Bratman vs. Gilbert:** Bratman requires mesh of individual intentions (challenged by R2 mercenary). Gilbert requires public commitment (also challenged if mercenary hides dissent). *Majority view (Bratman/Gilbert):* R2 shows joint action is undermined without sincere commitment. *Minority (structural view):* R2 succeeds because roles (mercenary’s covert compliance) sustain the structure.  
    - **Your "structure not heads" hunch:** This is a minority institutionalist view (e.g., Searle, Tollefsen). The activity subtly rigs support:  
      - R1: Structure (distributed roles) creates "we" without shared mental states.  
      - R3: Procedures (voting) override dissent, favoring structure.  
      *Majority rebuttal:* Mental states *enable* structure—e.g., R1 fragments work because students intend to cooperate.  
  - **Design biases:** R2 rigs toward structure by making defection costly (mercenary loses points if group fails), masking intention’s role. Highlight this in debrief to provoke debate.  

  This design ensures students "run into the problem before it has a name," testing your hunch while leaving room for intention-focused theories to challenge it. Adjust group sizes or timings as needed—good luck!
