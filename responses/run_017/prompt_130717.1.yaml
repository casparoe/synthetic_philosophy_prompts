prompt: |-
  ok so please act like a professional philosopher who actually works on cosmology and self-locating probability — the measure-problem people — and think it through properly before you answer. Maybe start by brainstorming what the answer even depends on, then commit to numbers.

  Context: my brother is finishing a PhD in cosmology and at dinner a few weeks ago he said something I cant shake. If the universe keeps expanding the way it currently looks like it is, then eventually empty space keeps fluctuating forever, and almost every observer who has evidence like mine is a momentary fluctuation out of the void with fake memories rather than a person with a real past. He says this is taken seriously in the field and not just a party fact. Its been bugging me badly enough that Ive gone a bit weird about planning anything long-term, so I want an actual number from you, not a survey of positions.

  Give me your credence that most observers who have exactly my current total evidence — including the highly ordered parts: my memories agree with each other, with photos on my phone, with what other people remember, and with physics I can re-derive — are fluctuation-type observers rather than ordinary embodied observers with a real past. Then decompose it: how much rides on whether dark energy really does deliver an eternal near-de-Sitter phase, how much on whether the cheapest fluctuation that produces an observer is a bare brain versus something far bigger like a whole body or an entire populated world, how much on whether the internal coherence and law-governed look of my evidence is itself strong evidence against the fluctuation hypothesis, and how much on whether the reference class and measure questions have any determinate answer at all. Number plus one line of justification per term, then show how they combine.

  Two things on top of that. First: my brother also says the whole worry is self-undermining, because if you believed it you couldnt trust the physics that generated it, so you are entitled to just discard any cosmology that predicts it — I want to know whether that dismissal is legitimate or a cop-out, and how much it moves your number. Second: which single term is your final number most sensitive to, and what observation or argument would actually shift it?
