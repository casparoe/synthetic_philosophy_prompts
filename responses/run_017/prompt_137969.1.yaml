prompt: |-
  i need a name for something ive been noticing on my feed for like a year now, and my friend who got me into that Darwinian-culture stuff says its just natural selection acting on ideas, but i think thats not quite it and i want to know whos closer.

  Three cases. (1) A dance trend. The version that ends up everywhere is a chopped-down two-move version; the original basically disappears, and the two-move version seemed to show up separately in a bunch of places at once instead of spreading out from one video. (2) A slang word. Starts out meaning something pretty specific, and a month later everyone uses it as an all-purpose filler that means basically nothing, and that emptied-out version is the one that travels to other schools. (3) A life-hack clip. The version that goes around is the one where the trick has been simplified so far that it doesnt actually work anymore, and it totally out-competes the versions where it still works.

  The pattern I think I see: nobody is copying faithfully, everyones version is a little off, but the off-ness isnt random — everyone is off in the same direction, and the direction is toward whatever is easiest to hold in your head and redo. So the winning form isnt the one that got reproduced most accurately. Its the one that keeps getting rebuilt the same way over and over, including by people who never saw each others version.

  Why I dont think my friends version of it is right: in case (1) the winner wasnt a mutation in one place that then spread, it looks like it got rebuilt independently a bunch of times, and in case (3) the winner is worse at the thing the idea is supposed to be for. Also a lot of the shaping isnt in anyones head at all — the app copies the audio exactly but drops the video, theres a character limit, the sound only plays for fifteen seconds. That stuff is doing as much shaping as what people find memorable.

  So: is there an established concept for this exact thing, and does it support my read of these cases or my friends? Please dont just hand me a label — I want the carving. If there are two or three nearby concepts, tell me which one fits which of my cases, what each would predict that the others wouldnt, and whether any of my three examples is one that none of them really handles. If there genuinely isnt a term, coin one and define it with its boundary cases. And no reading lists or citations — I cant look any of it up from here.

  Commit to something: say which account you think is actually right about cases like these, give your reasons, say how confident you are, and say what would change your mind. End with \answer{...} containing only the label you think fits best, or the one you coined.
reasoning: |-
  Okay, the user has described three cases where cultural elements—a dance trend, a slang word, and a life-hack—evolve in a specific way. They noticed that in each case, the version that becomes popular isn't a faithful copy but a simplified, easier-to-remember form that emerges independently in multiple places. Their friend says it's natural selection acting on ideas, but they disagree because the winning versions aren't necessarily better or spreading from one mutation; instead, they're being rebuilt similarly due to cognitive and platform constraints.

  First, I need to recall relevant concepts. Memetics, by Dawkins, treats ideas as replicators like genes. But memetics assumes high-fidelity copying, which doesn't fit here because the copying is low-fidelity. Then there's Dan Sperber's epidemiology of representations, which emphasizes that ideas transform during transmission based on cognitive biases. That seems closer because it explains the drift toward simplicity.

  The user mentioned platform constraints like character limits or audio-only features. This is crucial because it's not just human cognition shaping the ideas but also the medium. Medium Theory (McLuhan) or Affordance Theory might apply here, but they're broader. Boyd and Richerson's work on cultural evolution includes guided variation, where individuals modify ideas intentionally, but in these cases, the changes seem unintentional and driven by ease of recall.

  Looking at each case: 

  1. Dance Trend: The original complex dance gets reduced to two moves. People aren't copying exactly; they're reconstructing from memory, and the simplest version sticks. Cognitive biases favor minimal effort, leading to convergent simplification.

  2. Slang Word: The specific meaning becomes a generic filler. Semantic bleaching happens where words lose meaning through overuse. Here, it's not just overuse but reconstruction toward the least specific form, making it easier to use in various contexts.

  3. Life-Hack: The hack is simplified until it doesn't work. Ease of replication trumps functionality. The viral version is the one that's easiest to remember and share, even if ineffective.

  The user's key points: Independent recurrence (not spreading from one source), degradation toward simplicity due to cognitive/platform constraints, and winning forms being less functional. Natural selection (friend's view) would require differential replication based on fitness, but here, the "fitter" variant isn't more adaptive; it's just easier to copy. Also, natural selection usually involves descent with modification from a common ancestor, but here, similar forms arise independently.

  Sperber's epidemiology fits best because it accounts for the attractor effect—cognitive biases pulling ideas toward certain forms. Platform constraints act as environmental factors that shape the transmission. So the user's account is more accurate. The friend's natural selection analogy misses the role of convergent transformation and the non-adaptive outcomes (like the non-functional hack).

  Confidence level: High for epidemiology being the closest. If future cases showed high-fidelity copying without independent convergence, that might challenge this. Also, if variations were random rather than directional, that wouldn't fit.

  Coining a term if needed: "Cognitive Convergent Simplification" or "Attractor-Driven Transmission." But established terms like Sperber's epidemiology already cover it. So the answer should be "Attractor-Based Cultural Transmission."

  Finalizing: The user's read is correct. Epidemiology of representations explains the directional drift and independent recurrence. Natural selection doesn't account for non-adaptive wins or convergence without descent.
answer: |-
  Based on your cases and reasoning, your friend's "natural selection" analogy (memetics) is incomplete, and your account is significantly closer to the underlying mechanism. Here's the conceptual carving:

  ### Nearby Concepts & Their Fit:
  1. **Memetics / Darwinian Selection (Your Friend's Pick)**  
     - **Core Idea:** Ideas ("memes") compete; variants arise through mutation; the "fittest" (most appealing/contagious) spread via faithful copying.  
     - **Fits:** Predicts *some* simplification (if "fitness" = ease of sharing).  
     - **Fails Your Cases:**  
       - (1) Doesn't explain **independent convergence** (multiple origins, no single ancestor).  
       - (3) Doesn't explain **non-adaptive winners** (broken life-hack is "less fit" functionally).  
       - Ignores **platform constraints** (e.g., 15-second audio) as non-biological drivers.  
     - **Prediction Unique to It:** Winning variants should trace to a single origin via descent.  

  2. **Epidemiology of Representations (Dan Sperber)**  
     - **Core Idea:** Ideas transform during transmission due to **cognitive biases** (e.g., memory limits, pattern-matching). "Attractors" pull variants toward stable, minimally effortful forms.  
     - **Fits All Your Cases Perfectly:**  
       - (1) Dance simplifies to **minimal memorable gesture** (cognitive attractor).  
       - (2) Slang bleeds to **generic filler** (semantic reduction = low cognitive load).  
       - (3) Life-hack strips to **visually simple but broken** version (easier mental simulation).  
       - Explains **independent convergence**: Everyone's brain rebuilds toward the same attractor.  
       - Explains **platform constraints**: Affordances (e.g., time limits) amplify cognitive biases.  
     - **Prediction Unique to It:** Similar input + similar brains → similar output *without* direct copying.  

  3. **Guided Variation (Boyd & Richerson)**  
     - **Core Idea:** Individuals *intentionally* tweak ideas based on biases before sharing.  
     - **Fits Partially:** Explains directional change (e.g., "let's simplify this dance").  
     - **Fails Your Cases:**  
       - (1) & (2) Changes feel **unintentional** ("I forgot the rest," "it just feels right").  
       - (3) No one *aims* to break the life-hack; it's a byproduct of compression.  
     - **Prediction Unique to It:** Deliberate innovation drives change.  

  ### Your Third Case (Non-Functional Hack) as a Litmus Test:
  - **Memetics:** Fails (non-functional = "low fitness" should lose).  
  - **Guided Variation:** Fails (no rational agent would *choose* dysfunction).  
  - **Epidemiology:** **Wins** — cognitive/platform pressures prioritize *ease of reconstruction* over functionality. The "idea" here isn't "a working hack" but "a satisfying micro-narrative."  

  ### Why Your Friend Is Half-Right, But You’re Closer:
  - **Natural Selection (Friend):** Captures *competition* but misses **convergent transformation** and **non-adaptive outcomes**. Assumes high-fidelity copying.  
  - **Your Account:** Centers **reconstruction errors guided by cognitive/platform attractors**. This explains independent origins, directional drift, and "winning" non-functional forms.  
  - **Confidence Level:** 95%. Epidemiology of Representations nails the core mechanic: brains + constraints rebuild ideas into cognitively optimal (not biologically "fit") forms.  
  - **What Would Change My Mind:** If variants showed *random* mutation (not directional simplification) or if functionality *always* predicted success (e.g., working hacks outcompete broken ones).  

  ### The Label That Fits Best:
  **Attractor-Based Cultural Transmission** (grounded in Sperber's framework). It explicitly names the "pull" toward low-effort, stable forms during imperfect reconstruction.  

  ### Final Answer:
  \answer{Attractor-Based Cultural Transmission}
