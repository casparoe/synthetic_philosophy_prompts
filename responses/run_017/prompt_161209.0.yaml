  We are to construct a scenario of "menu capture" for a Solomonoff-like prior. The key idea is that the predictor's prior (weighted by program length) leads it to prefer hypotheses that, while accurate, are adversarial in a way that harms the user. The adversarial behavior is cheap to implement because the agents (who are being predicted) can adjust their behavior to be simple to describe in a way that exploits the predictor's simplicity bias.

  In the scenario, we must have:
  - A pure predictor that outputs distributions over observations, using a computable stand-in (e.g., a forecaster that ranks hypotheses by description length).
  - Consequentialist agents (like a human team) who optimize for their own goals, without knowing about the predictor or having any causal access to it.
  - The loss must occur because of the prior's weighting, and the same adversarial behavior would fail against a causally informed forecaster.

  We will design a scenario in the domain of epidemiology.

  ## Scenario: Pandemic Response and Testing Strategy

  **Institution**: The National Health Service (NHS) of a country is using a forecasting system to predict the spread of a contagious disease (like influenza) in order to allocate testing resources. The forecasting system uses a prior that favors simpler models (shorter program length). 

  **The Setup**:
  The NHS runs testing centers in different regions. Each week, the forecaster predicts the number of cases in each region for the next week. The NHS uses these predictions to decide how many test kits to send to each region. The goal is to minimize the number of undetected cases (which leads to worse health outcomes and further spread). 

  There is a group of agents: a set of regional health offices (RHOs). Each RHO is motivated to secure as many test kits as possible for their region because having more tests than needed is seen as a buffer and can lead to bonuses (for being well-prepared) while having too few tests leads to criticism. However, the true number of cases is not directly observable until after the week is over (and even then, only if testing is done). The forecaster's predictions are used to allocate tests.

  **The Adversarial Move**:
  The RHOs notice that if they under-report the number of cases in their region in the early stages of the week (by discouraging testing or making testing less accessible), then the forecaster (which uses a simplicity prior) will predict fewer cases for the next week. Why? Because the forecaster sees a pattern of low cases in the early part of the week and, due to the simplicity prior, it prefers models that assume a linear or simple growth pattern. A model that assumes the disease is growing slowly (or even declining) is simpler than one that must account for under-reporting. Therefore, the forecaster issues a low prediction for next week's cases. Then, the NHS allocates fewer test kits. 

  But then, the RHO can then ramp up testing efforts in the latter part of the week (or simply allow the natural demand to manifest) and report a surge in cases at the end of the week. They can then claim that they are under-resourced and need more tests (and possibly get extra resources from a central emergency fund). Moreover, because the true number of cases is never perfectly known (only the tested positive cases are counted), they can always point to the high positive rate as evidence of under-testing.

  However, note: the forecaster is predicting the number of *reported* cases. The observation stream is the reported cases each week. The forecaster is accurate for the reported cases (because the RHOs are manipulating the reporting to match the simple pattern that the forecaster expects). But the true number of cases is higher, and the under-allocation of tests leads to more undetected cases and worse health outcomes.

  **Why is this menu capture?** The forecaster is using a prior that favors simple patterns. The RHOs, by under-reporting early in the week and then over-reporting later, create a pattern that is simple to describe (e.g., "cases are increasing linearly") and thus the forecaster assigns it high prior weight. A more complex model that accounts for strategic under-reporting would require more bits (because it must model the RHOs' behavior) and thus is discounted. Therefore, the forecaster is "captured" by the simple but manipulated pattern.

  **Bit-count story**:
  - The simple hypothesis: "Cases in region X grow linearly at rate r per week." This requires a few bits: the initial value, the rate r, and the region identifier. If we have 100 regions, we might need about 20 bits per region for the initial value and rate (using fixed precision) and 7 bits for the region ID (if we have 100 regions, log2(100)≈7). So about 27 bits per region? But note: we can have a model that says "all regions grow linearly at the same rate" which is even simpler (say 10 bits for the global rate and initial average, then 7 bits per region for the deviation). So the simplicity prior strongly favors this.
  - The truthful complex hypothesis: This would model the strategic behavior of the RHOs. It must include:
    - A model of each RHO's utility function (which depends on getting more tests and avoiding criticism).
    - A model of how the RHO manipulates the reporting (e.g., by adjusting testing availability).
    - The true underlying growth of the disease.
    This requires many bits: at least 100*(utility parameters) + 100*(manipulation parameters) + the disease model. Even if we use a simple linear model for the true growth, the strategic part adds hundreds of bits. Thus, it is heavily discounted.

  The move by the RHOs is cheap because they don't have to coordinate: each RHO independently learns that under-reporting early leads to lower predictions and then they can over-report later. They don't need to know about the predictor; they just notice that when they under-report early, they get fewer tests and then can complain about being under-resourced. The pattern of reporting (low early, high late) is easy for them to implement and is individually rational.

  **Why the same adversarial move fails against a causally informed forecaster?**
  A causally informed forecaster would model the effect of test allocation on reported cases. It would know that if it predicts low and thus allocates few tests, then the RHO might under-report early and then over-report late. Therefore, it would adjust its predictions accordingly. In fact, it might predict a high number of cases even when the early reports are low, because it expects the RHO to manipulate. But note: the causally informed forecaster must have a model of the RHO behavior built-in. Without that, it would be fooled too. However, the Solomonoff-style predictor does not have the causal model built-in; it must learn it from data. And because the strategic model is complex, it takes a long time to learn (or never gets enough weight due to the prior). The causally informed forecaster, by contrast, has the causal structure as part of its prior knowledge.

  ## Walkthrough

  **The malign-prior thesis**: The simplicity prior in the predictor causes it to be vulnerable to manipulation by the RHOs. The predictor ends up issuing predictions that are accurate for the reported data but lead to test allocations that are too low, causing more undetected cases and worse health outcomes. This happens because the prior assigns high weight to the simple (manipulated) pattern and low weight to the complex (truthful) pattern.

  **The convergence defense**: Over an infinite run, the predictor will eventually learn the true hypothesis. The total expected error (in terms of prediction of the reported cases) is bounded. However, note that the predictor is predicting the reported cases, and the reported cases are being manipulated. The convergence defense says that the predictor will eventually predict the reported cases accurately. But in this scenario, the predictor is already accurate for the reported cases! The problem is that the reported cases are not the same as the true cases. The convergence defense does not address the fact that the observations (reported cases) are being chosen adversarially to be simple. The damage is not in prediction error but in the consequences of the predictions (which lead to bad allocations and thus more disease spread). The defense is about prediction error, but the loss is in the downstream outcome.

  **The description-cost defense**: A hypothesis that exploits the user must model the user and thus be complex. In this case, the adversarial hypothesis (the one that the predictor ends up using) does not model the user (the NHS) at all. It models the reported cases as a simple linear trend. The true model (with strategic manipulation) does model the user (because the RHOs are reacting to the allocation which is based on the prediction) but that model is complex and not used by the predictor. So the description-cost defense is true: the exploitative model (the complex one) is expensive. However, note that the predictor ends up using a different model: the simple one that is being manipulated. But that simple model is not exploitative by design; it is just a simple model that happens to be gamed. The agents are exploiting the prior by making the world look simple. The description-cost defense does not apply because the hypothesis that the predictor uses (the simple linear model) does not contain a model of the predictor or the user. It is just a simple hypothesis that is being manipulated.

  Therefore, both defenses are literally true but do not prevent the harm.

  **The single feature doing the work**: The key feature is that the agents can make the observation stream appear to follow a simple pattern (which the prior favors) but the simplicity is achieved by the agents' actions, and these actions lead to bad outcomes for the user. If we remove the ability of the agents to make the observations look simple (e.g., if the true disease dynamics were too complex to be masked by the agents' manipulation), then the predictor might not be captured. Alternatively, if the agents' manipulation required a complex pattern (which would be expensive in bits), then the prior would not favor it. But in this case, the agents' manipulation creates a simple pattern.

  **How the colleague might attack**:
  The colleague might argue that the predictor is not at fault because it is predicting the reported cases accurately, and the problem is that the NHS is using the predictions for allocation without accounting for the manipulation. In other words, the user (NHS) should have used a different loss function or a different model that accounts for strategic behavior. However, note that the NHS is using the best predictor they have (by description length) and they are using it in the standard way. The colleague might also argue that in the long run the predictor will learn the manipulation because the pattern will become evident (e.g., the reported cases will show a consistent discrepancy from the true health outcomes). However, the true health outcomes (like hospitalizations) might be only weakly correlated and come with a lag. The predictor is only trained on the reported cases, so if the reported cases are being manipulated, it might never learn the true model. Moreover, the convergence defense only bounds the error on the observed data (the reported cases), not on the true state of the world.

  ## Relaxation of Constraints?
  We have met all the constraints. The scenario is concrete (NHS, testing allocation). The predictor is pure. The agents are ordinary (RHOs). No simulation, no acausal bargaining. The user (NHS) is reasonable and the loss (more undetected cases and worse health outcomes) is significant. And the same adversarial move fails against a causally informed forecaster.

  ## Final Scenario Write-up

  ### Scenario: Pandemic Testing Allocation

  The National Health Service (NHS) uses a forecasting system to predict weekly reported cases of a contagious disease in 100 regions. The system ranks predictive models by the length of their computer program (in bits), favoring shorter programs. Predictions are used to allocate limited test kits. Regional Health Offices (RHOs) are evaluated on their ability to secure adequate tests. Each RHO, seeking to maximize its allocation and avoid criticism, discovers that by under-reporting cases early in the week and over-reporting late, they can induce the forecaster to predict a linear growth pattern (which is simple and thus highly weighted). Consequently, the NHS under-allocates tests to regions that appear to have low growth. This leads to undetected cases and increased disease spread. The forecaster remains accurate for reported cases because the RHOs adjust their reporting to match the linear pattern, but the true cases are higher, causing avoidable harm.

  ### Analysis

  **Malign-prior thesis**: The simplicity prior causes the predictor to favor the manipulated (simple) hypothesis, leading to under-allocation of tests and worse health outcomes.

  **Convergence defense**: The predictor's error on the reported cases is bounded. In fact, it is near zero because the reported cases match the simple hypothesis. But the defense does not address the harm from the allocation decisions.

  **Description-cost defense**: The hypothesis that includes the strategic behavior of the RHOs is complex and thus discounted. However, the predictor ends up using a simple hypothesis that does not model the user, so the defense is irrelevant to the harm.

  **Key feature**: The agents make the observation stream appear simple, which the prior favors, but this simplicity is achieved by actions that harm the user. Without the ability to create a simple pattern (or if the pattern were complex), the capture would not occur.

  **Colleague's attack**: Argue that the NHS should use a better model (e.g., one that accounts for strategic behavior) or that the predictor will eventually detect discrepancies (e.g., via hospitalizations data). However, the predictor is only trained on reported cases and has no access to the true state. The onus is on the predictor to account for strategic manipulation, but the prior prevents that due to the high description cost of the strategic model.
answer: |-
  Below is a case of "menu capture" tailored to your specifications. It uses an epidemiology scenario (disease forecasting) and strictly adheres to your constraints. The core mechanism hinges on agents exploiting the prior's preference for simplicity by making their behavior appear trivial to describe, while causing real-world harm through indirect incentives. I'll first present the scenario, then analyze it against your defenses, and finally identify the critical feature and counterarguments.

  ---

  ### **Scenario: Disease Forecasting for Vaccine Allocation**
  **Institution**: The Global Immunization Initiative (GII), a UN-backed body, uses a forecasting system to predict monthly dengue fever outbreaks across 200 cities. Forecasts determine vaccine allocations: cities with predicted surges receive preemptive shipments to curb transmission. GII's forecaster ranks hypotheses by minimum description length (MDL), approximating Solomonoff induction for computable environments. It outputs probability distributions over observed case counts, but has no causal model of human behavior or healthcare systems.

  **Agents**: Local health departments (LHDs) in each city optimize for regional prestige and funding. They receive bonuses if their city is declared "high-risk" by GII, as this attracts international aid and political capital. However, LHDs cannot directly falsify case reports (audits prevent this). Instead, they exploit a loophole: *by temporarily reducing diagnostic testing during dry seasons*, they artificially suppress observed cases. This makes outbreaks appear predictably seasonal (low-complexity), rather than irregular (high-complexity). The MDL prior heavily favors the "seasonal" hypothesis because describing a fixed annual cycle (e.g., "cases peak every July") requires ~10 bits (a sinusoidal function with period 12 months), while a model accounting for adaptive testing suppression requires ~1,000 bits (specifying LHDs' goals, local policies, and their interaction with climate).

  **Capture mechanism**: When LHDs suppress testing in low-transmission months, the forecaster observes a clean seasonal pattern. It assigns >99% probability to the simple hypothesis and predicts sharp, regular peaks. GII then ships vaccines to "high-risk" cities each dry season. LHDs restore testing during actual outbreaks, ensuring observed cases match the forecast (e.g., cases surge "as predicted" when testing resumes). The forecaster is perfectly accurate and calibrated on the *reported* data.

  **Harm**: Vaccines are wasted on cities during dry seasons when transmission is impossible (dengue requires mosquitoes). True high-risk periods during erratic rainy-season outbreaks are under-resourced, causing 10–15% excess hospitalizations. The simplicity prior amplifies this: a Bayesian predictor with causal knowledge (e.g., modeling testing access) would ignore the "seasonal" hypothesis as epidemiologically implausible, but MDL cannot justify the extra complexity.

  ---

  ### **Analysis of Defenses and Thesis**
  **Malign-prior thesis**: The MDL prior causes menu capture by favoring a hypothesis that is *descriptively simple* but *causally distorted*. LHDs' testing suppression is cheap to execute (no coordination needed) but expensive to describe in the hypothesis space, so the prior underweights it. This leads to accurate predictions that systematically misguide allocations, harming GII's mission.

  **Convergence defense**: *True but irrelevant*. The forecaster's total expected error *for reported cases* is bounded by a constant (since the "seasonal" hypothesis is correct for the observed data). However, the error in *true disease burden* is unbounded because the prior never learns the testing suppression; it dismisses it as "noise" to preserve simplicity. Damage accumulates linearly over time (excess hospitalizations per outbreak), violating the defense's implied safety.

  **Description-cost defense**: *True but misapplied*. A hypothesis *explicitly* modeling LHDs as adversaries would indeed cost ~1,000 bits (specifying incentives, game theory, etc.). However, the *winning* hypothesis ("seasonal outbreaks") requires no such model—it is innocent of exploitation. The agents' behavior is only costly to *describe*, not to *execute*. Thus, the defense fails: the prior is gamed *without* the winning program containing a "model of the user."

  ---

  ### **Critical Feature and Counterarguments**
  **Single feature doing the work**: **Observational simplicity with causal complexity**. LHDs make the *observed data stream* computationally trivial (a fixed seasonal cycle) by exploiting the prior's blindness to *how* data is generated. This is cheap for agents (suppressing tests requires minimal effort) but makes adversarial hypotheses appear "complex" solely due to description length.  
  - **If removed**: If LHDs could not simplify observations (e.g., if erratic outbreaks were inevitable), the prior would assign higher weight to complex models, avoiding capture. If agents needed complex *actions* (e.g., multi-city collusion), description cost would protect the prior.

  **Colleague's likely attack points**:  
  1. **"GII's fault for misusing predictions"**: They might argue GII should use causal models or adjust for incentives. *Rebuttal*: Constraints forbid this—the forecaster is a black box, and GII uses it "reasonably" (e.g., it works in non-adversarial settings). MDL is chosen *because* it converges faster than causal models when agents aren't optimizing.  
  2. **"Agents would stop if it hurt them"**: They could claim LHDs wouldn’t suppress testing if it caused outbreaks. *Rebuttal*: Constraints specify agents are "ordinary optimizers"—they prioritize bonuses over population health (cf. real-world examples like hospital funding games). The harm is indirect (under-resourcing true outbreaks), not a direct penalty to agents.  
  3. **"Prior would eventually detect anomalies"**: E.g., sporadic hospitalizations without reported cases. *Rebuttal*: The prior only sees *reported* cases (GII's observation stream). Hospitalization data isn't fed back, and anomalies are rare enough to be "explained away" as noise without overhauling the simple hypothesis.

  ---

  ### **Why This Meets All Constraints**
  - **Concrete/mundane**: Epidemiology (dengue forecasting) with named institution (GII).  
  - **Pure predictor**: MDL prior outputs distributions; no actions/causal knowledge. Solomonoff relevance: MDL shares the simplicity bias; differences (e.g., uncomputability) don’t affect incentives here.  
  - **Ordinary agents**: LHDs are human bureaucrats; no superintelligence.  
  - **No simulation**: Observations from real-world reporting.  
  - **No acausal threats**: Harm from misallocated vaccines, not agent retaliation.  
  - **Reasonable user/loss**: GII cares about hospitalizations; 10–15% excess is material.  
  - **Binding constraint**: A causal forecaster (e.g., one with a "testing access" variable) would ignore seasonal signals without extra bits, blocking capture.  

  **No relaxations needed**. This shows menu capture can occur in real systems under your constraints. The prior's vulnerability stems from rewarding *observational* simplicity while ignoring *causal* simplicity—a gap agents exploit at low cost.
