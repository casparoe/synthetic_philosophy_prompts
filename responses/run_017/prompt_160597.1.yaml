prompt: |-
  Our city council is toying with a small-scale futarchy pilot for housing policy, and I got volunteered onto the little advisory group for it, so I'm trying to get my head around the details before the next meeting.

  The setup on the table: first a vote to fix a welfare index for the city (say median rent, vacancy rate and a count of displacement complaints, weighted 50/30/20), then two conditional prediction markets — one that pays out only if the council adopts the upzoning package, one that pays out only if it doesn't — and the package gets adopted iff the first market prices the index higher five years out.

  Two things I can't get straight, and I think they're connected.

  First: everyone keeps telling me the beauty of this is that the market hands you an unbiased estimate of the policy's effect. But a conditional market price is just an expectation over whatever actually happens in the branch where the policy passed. If upzoning only ever gets passed when rents were already about to flatten — because that's when its politically easy — then the "passed" branch looks great no matter what the upzoning does. One person on the group suggested fixing this by resolving the "didn't pass" branch against a basket of similar peer cities rather than against our own counterfactual. That seems to me to basically solve it, and cheaply. Is that right, or am I missing somthing?

  Second, and this is the bit I actually care about: if that peer-city trick works, do we even need the values vote? Couldn't we skip the fight about the 50/30/20 weights, run markets on maybe eight or ten candidate indices, and then run a second-tier market betting on which weighting best predicts how satisfied residents report being five years later? Then the market tells us the right values too, which seems definately better than nine people arguing about it in a chamber.

  Something here feels wrong and I can't tell whether its that the whole thing is circular or that it just pushes the same argument one level down. Which is it?
reasoning: |-
  Okay, the user is part of an advisory group for a futarchy pilot in housing policy. They're grappling with two main issues. Let me start by understanding their first concern. They mention that the conditional market might not give an unbiased estimate because upzoning might only pass when rents are already about to flatten. The peer-city basket solution is proposed, and they wonder if that fixes the problem. 

  Hmm, the key here is selection bias. If the policy is adopted only under certain conditions, the market's prediction could be skewed. The peer-city approach does help by providing a counterfactual. But I should consider if there's a catch. Peer cities need to be truly comparable. What if their economic factors differ? Also, the basket's composition could become a point of contention. The user might not have considered how hard it is to select comparable cities. So while the solution works in theory, the implementation details matter a lot.

  Now, the second issue about skipping the values vote. The user suggests using markets to determine the best weighting for the welfare index. They want to avoid the political fight over weights. But here's the problem: defining what "best" means requires a value judgment. If they use resident satisfaction as the metric, that's still a value choice. The circularity is that the market optimizes for predictive power, but that predictive power is tied to a specific outcome measure chosen by humans. 

  Wait, the user might be conflating predictive accuracy with normative values. Just because a weighting predicts satisfaction well doesn't mean it aligns with societal values like equity. For example, a weighting that ignores displacement might predict overall satisfaction but harm vulnerable groups. The user's desire to avoid political debate is understandable, but values are inherently political. Markets can't resolve normative disagreements; they can only optimize based on given metrics. 

  Also, running multiple markets for different indices adds complexity. Prediction markets need liquidity. Too many markets might lead to thin trading, making prices unreliable. The user might not realize the practical challenges here. Their idea is innovative but could be impractical. 

  Underlying all this, the user seems to want a technocratic solution to avoid political conflicts. But futarchy still requires human input for defining metrics. The real issue is whether the group can agree on what outcomes matter. The user's frustration with the debate over weights is valid, but skipping that step might lead to worse outcomes. They need to recognize that some democratic deliberation is unavoidable, even in futarchy.
answer: |-
  You've nailed two critical flaws in naive futarchy implementations—selection bias and value circularity—and your proposed solutions are smart but need refinement. Here's the breakdown:

  **On Selection Bias & the Peer-City Counterfactual:**
  - **The Problem:** You're absolutely right. If policy adoption is *correlated* with future conditions (e.g., upzoning only passes when economic conditions favor low rent growth), the conditional market price for the "pass" branch becomes contaminated. It reflects *both* the policy effect *and* the favorable baseline conditions. This violates the "all else equal" assumption.
  - **The Peer-City Fix:** This **does solve the core selection bias problem** *in theory*. By resolving the "didn't pass" market against a basket of similar peer cities not implementing the policy, you isolate the *differential effect* of the policy itself. You're comparing "Us + Policy" vs. "Them (similar Us) + No Policy".
  - **The Caveats (What You Might Be Missing):**
      1. **Peer Selection is Crucial & Political:** Defining "similar peer cities" is fraught. Which variables matter most? (GDP growth? Demographics? Existing housing stock?) Disagreement here becomes a new political battleground and can manipulate results.
      2. **The "Us" vs. "Them" Problem:** Peer cities aren't perfect clones. Unobserved differences (culture, hidden policies, unique shocks) can still bias the comparison. Robust statistical matching helps but isn't perfect.
      3. **Liquidity & Manipulation Risk:** Markets resolving against external benchmarks are harder for traders to price accurately than markets resolving against a known local outcome, potentially reducing liquidity/increasing volatility.

  **Verdict:** The peer-city fix is **necessary and significantly better** than the naive self-counterfactual. It directly addresses the selection bias. However, implement it with a transparent, pre-defined methodology for peer selection (e.g., a formula using publicly available data) to mitigate new political fights.

  **On Skipping the Values Vote (The Circularity Problem):**
  Your idea is innovative but hits a fundamental limit. Here's why it doesn't work:

  1.  **The Circularity:** You propose a market to choose the weighting that "best predicts resident satisfaction." This *replaces* the values vote with a *different* value judgment: that "predicting resident satisfaction" is the ultimate goal. Why is prediction accuracy the supreme value? Why not equity, sustainability, or economic growth? **The market optimizes for the metric you give it; it cannot define the metric's inherent worth.**
  2.  **Resident Satisfaction ≠ Welfare:** Your proposed metric (satisfaction) is itself a single, specific value choice. It assumes:
      *   Satisfaction is measurable reliably (survey design is hard!).
      *   Satisfaction captures all important aspects of welfare (it often neglects future generations, externalities, or fairness).
      *   Maximizing *aggregate* satisfaction is desirable (ignoring distribution).
  3.  **The "Which Prediction?" Problem:** A market betting on "which weighting predicts satisfaction best" is betting on a *statistical property* (predictive power). This is fundamentally different than a market betting on the *actual level of welfare* under a policy. It doesn't tell you if high satisfaction is *achieved*, only if the index *correlated* with it in that specific instance.
  4.  **Operational Nightmare:** Running liquid prediction markets on *dozens* of potential indices and *then* a meta-market on their predictive power is incredibly complex, expensive, and likely to suffer from severe liquidity problems, making prices meaningless.

  **Why This Feels Wrong (Your Instinct is Correct):**
  *   **It Pushes the Argument Down, But Doesn't Resolve It:** Instead of arguing weights (50/30/20), you argue about:
      *   What defines a "peer city" for the counterfactual?
      *   What defines "resident satisfaction"? (Survey questions? Sample size?)
      *   Is predictive accuracy *really* the ultimate goal? (This *is* a values question!).
  *   **It Confuses Prediction with Value:** Markets are powerful tools for *aggregating beliefs about likely outcomes*. They are terrible tools for *defining what outcomes are desirable*. Futarchy separates "what do we want?" (values vote) from "how do we get it?" (prediction markets). Your second-tier market proposal tries to make markets answer the first question, which they fundamentally cannot do objectively. **The "right" weights depend on what the city values most, not on statistical correlations.**

  **Revised Recommendations for Your Advisory Group:**

  1.  **Mandate the Peer-City Counterfactual:** Insist on resolving the "no policy" market against a pre-defined, transparent basket of peer cities. Debate and lock in the peer selection methodology *before* markets open.
  2.  **Keep the Values Vote:** The fight over weights (50/30/20) is *essential democratic deliberation*. It forces the council (representing citizens) to explicitly state priorities. This is messy but necessary. Trying to outsource it to markets is technocratic overreach and hides the value judgment.
  3.  **Consider Refining the Index:** Could the values vote define a *small set* (2-3) of alternative indices reflecting different priorities (e.g., one emphasizing affordability, one emphasizing new supply, one emphasizing displacement)? Run parallel conditional markets for *each*. The council then sees: "Policy X lifts the Affordability Index but slightly hurts the Displacement Index." This provides richer information for the final political decision (adopt/not adopt), while keeping values explicit. *(This adds complexity but avoids the circularity trap).*
  4.  **Focus on Market Design:** Ensure markets are well-designed (subsidized liquidity, prevent manipulation, clear rules). The peer-counterfactual is the key innovation needed to make the core policy prediction valid.

  **In essence:** The peer-city fix solves the selection bias problem for *policy impact prediction*. However, determining *what outcome matters most* (the values/weights) cannot be ethically or effectively outsourced to a prediction market. That debate belongs in the democratic arena, even if it's messy. Your instincts about the circularity are spot on – don't skip the values vote.
