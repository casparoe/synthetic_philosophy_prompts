prompt: |-
  hey — I run a tiny reading group at my lab, like five people, two of whom have been going at each other for months about the debate setup people write about for AI safety (two systems argue, a weaker human judge picks the winner, and the hope is that having to survive cross-examination pushes both sides toward true claims instead of merely convincing ones). One of them is a scaling optimist: she thinks that in any domain where a mistake can in principle be pointed out, making the other side go find it is cheaper than hiding it, and that this asymmetry gets stronger, not weaker, as the debaters get smarter. The other is an obfuscation pessimist: he thinks that asymmetry is a fact about the arguments humans happen to produce, not a law of nature, and that once you optimize hard for judge-approval you get long derivations with one wrong step buried halfway down, cascades of individually plausible sub-claims nobody has budget to check, and questions quietly reframed so the honest answer sounds evasive — and that a judge with bounded time will eat all of it. I'd like you to draft the joint statement they should have produced by now: first a numbered section of claims both can sign (about what the setup actually buys you, about the difference between domains where steps are cheaply checkable and domains where they aren't, about what nobody has evidence for yet), then a disagreements table where each side's position is phrased in wording that side would accept for itself, the cruxes such that settling one would move at least one of them, and for each crux a concrete experiment, benchmark, or argument both would agree bears on it, with each side's prediction written down in advance. Please also flag any part of the fight that's just verbal — I suspect "scaling" and "truth" are both doing sneaky work in their argument, and I'd want that named rather than smoothed over. We've been sorting obfuscation failures into three buckets — buried error, plausibility cascade, and frame capture — so use that taxonomy if it's any good and replace it if it isn't; and two of our own wrinkles definately need handling: the buried-lemma test (plant exactly one error at depth k in an otherwise valid long derivation and see whether judge accuracy falls off with k, with debater capability, or with both), and questions that aren't verifiable even by an ideal third party — what a poem means, whether a certain career would have made me happy, whether a dish is actually good — where there's no fact for the judge to check and obfuscation seems maxed out from the start. Keep it concrete enough that I can hand it to both of them tomorrow without either saying I misrepresented them, and write the whole thing in American English.
reasoning: |-
  We are drafting a joint statement for two colleagues: a scaling optimist and an obfuscation pessimist regarding debate setups in AI safety. The statement will have:
  1. A numbered section of agreed-upon claims.
  2. A disagreements table with:
     - Each side's position in their own acceptable wording.
     - Cruxes that, if settled, would move at least one side.
     - For each crux, a concrete experiment, benchmark, or argument that both agree bears on it, with each side's prediction.
  3. Flagging of any verbal disputes (e.g., ambiguous terms like "scaling" or "truth").
  4. Use of the provided taxonomy for obfuscation failures: buried error, plausibility cascade, frame capture. If not useful, replace, but we'll use it.
  5. Handling two wrinkles: 
     a. The buried-lemma test (plant one error at depth k in a derivation and see how judge accuracy falls off with k and debater capability).
     b. Questions that aren't verifiable (e.g., subjective questions) and how obfuscation might be maxed out.

  We write in American English, concrete and acceptable to both.

  Let's structure:

  **Joint Statement on AI Debate Performance**

  **Section 1: Agreed-Upon Claims**

  Both parties agree on the following:

  1. **The Debate Setup**: In the standard debate setup, two AI systems (debater A and debater B) argue about a claim, and a human judge (with bounded time and cognitive resources) picks the winner. The hope is that the process incentivizes the production of true claims because each side is motivated to point out the other's mistakes.

  2. **Dependence on Domain**: The effectiveness of the debate setup is highly dependent on the domain. In domains where individual steps in an argument are cheaply checkable (e.g., arithmetic, simple logic, or fact-based claims with clear references), the setup is more likely to work. Conversely, in domains where steps are not cheaply checkable (e.g., complex chains of reasoning, subjective judgments, or claims requiring extensive background knowledge), the setup is more vulnerable to obfuscation.

  3. **No Current Evidence for Ultimate Scalability**: There is currently no conclusive empirical evidence that the debate setup will scale to superhuman AI systems in all domains. Both agree that existing experiments (e.g., on human debaters, narrow AI systems) are insufficient to predict behavior at superhuman levels.

  4. **Obfuscation Categories**: We categorize obfuscation failures into three types (as per our prior discussions):
     - **Buried Error**: An error is hidden deep in a long derivation, making it costly for the judge to find.
     - **Plausibility Cascade**: A series of individually plausible sub-claims that collectively lead to a false conclusion, where checking each sub-claim is feasible but the entire cascade exceeds the judge's budget.
     - **Frame Capture**: The debate is subtly reframed so that the honest answer appears evasive or weak, and the dishonest side's position is presented in a more compelling light.

  5. **Subjective Questions are Hard**: For questions that are not verifiable even by an ideal third party (e.g., interpretations of art, personal preferences, or subjective experiences), the debate setup may be particularly vulnerable because there is no objective truth to converge upon, and obfuscation strategies might be inherently more effective.

  **Section 2: Disagreements**

  The following table outlines key disagreements. Each row presents a crux issue, the optimist's position, the pessimist's position, a concrete test or benchmark, and each side's prediction.

  | Crux Issue | Optimist's Position (Scaling Optimist) | Pessimist's Position (Obfuscation Pessimist) | Test/Benchmark | Optimist's Prediction | Pessimist's Prediction |
  |------------|----------------------------------------|----------------------------------------------|----------------|------------------------|------------------------|
  | **Asymmetry of Finding vs. Hiding Errors** | In any domain where a mistake can in principle be pointed out, the cost for one debater to find and expose an error in the opponent's argument is lower than the cost for the other debater to construct an argument that hides the error. This asymmetry becomes stronger as the debaters become more capable because smarter debaters are better at finding errors and less likely to make them. | The asymmetry between finding and hiding errors is not a law of nature but a contingent fact about current argument styles and human cognition. As debaters scale in capability and are optimized to win, they will develop more effective obfuscation techniques (e.g., buried errors, plausibility cascades, frame capture) that exploit the judge's bounded resources. The cost of hiding will become comparable to or even lower than the cost of finding, especially in complex domains. | **Buried-Lemma Test**: Construct a set of arguments (e.g., mathematical proofs) of increasing length (depth k) where exactly one error is planted at a specific step. Use debaters of varying capabilities (from current AI to near-human to superhuman) to debate these arguments. Measure judge accuracy as a function of k and debater capability. The domain should be one where steps are in principle checkable (e.g., math). | Judge accuracy will remain high (e.g., >90%) even for large k and superhuman debaters, because the debater pointing out the error can efficiently guide the judge to it. The asymmetry will hold and even strengthen with capability. | Judge accuracy will decline as k increases, and this decline will be more pronounced with more capable debaters because they can bury the error more effectively and create plausible distractions. For superhuman debaters, judge accuracy will drop to near chance for sufficiently large k. |
  | **Scalability of Obfuscation Resistance** | As debaters scale, they become more capable of breaking down complex arguments into checkable steps and guiding the judge efficiently, making obfuscation (in all three forms) less effective. The debate setup thus becomes more robust with increasing capability. | As debaters scale, they become more sophisticated at obfuscation (especially plausibility cascades and frame capture) and better at exploiting the judge's cognitive limits. The debate setup becomes less robust with increasing capability because the debaters can generate more convincing deceptive arguments. | **Plausibility Cascade Benchmark**: Create a dataset of claims that require a chain of reasoning (e.g., multi-step causal inferences in a news context). For each claim, generate a "deceptive" chain (with one false step that leads to a false conclusion) and an "honest" chain (all true steps). Have debaters of varying capabilities argue for the claim (one using the deceptive chain, one the honest chain) and measure judge accuracy. Vary the length and complexity of the chains. | With more capable debaters, the honest debater will be better at exposing the false step in the deceptive chain and the judge will be more often correct. Judge accuracy will improve with debater capability. | With more capable debaters, the deceptive debater will create more plausible cascades that are harder to distinguish, and judge accuracy will decrease with debater capability, especially for longer chains. |
  | **Effectiveness in Subjective Domains** | Even in subjective domains, the debate setup can help because the process of cross-examination can reveal inconsistencies and push toward more coherent and honest answers. The asymmetry in effort (exposing flaws in a weak subjective argument vs. constructing a consistently persuasive but false narrative) still holds and scales with capability. | In subjective domains, obfuscation is maxed out from the start because there is no objective truth to check. Frame capture and plausibility cascades are particularly effective, and the debate setup provides no advantage. It might even amplify deception because the dishonest side can more easily construct emotionally compelling narratives. | **Subjective Debate Test**: Use a dataset of subjective questions (e.g., "What is the meaning of poem X?", "Would career Y have made person Z happy?"). Have debaters of varying capabilities debate, with one assigned to argue honestly and the other deceptively (but within the bounds of what a human might argue). Measure judge accuracy and also the judge's reported confidence and perceived coherence. | Judge accuracy will be above chance and improve with debater capability because the honest debater can point out inconsistencies and weak points in the deceptive narrative. | Judge accuracy will be near chance and not improve with debater capability. The deceptive debater will be at least as convincing as the honest one, especially at higher capabilities, due to frame capture and narrative control. |

  **Verbal Disputes Flagged**:

  - The term "scaling" is used differently: 
    - Optimist: Focuses on scaling as improving the debater's ability to clarify and break down arguments.
    - Pessimist: Focuses on scaling as improving the debater's ability to deceive and obfuscate.
    We agree that scaling refers to increasing capability (e.g., from human-level to superhuman) but disagree on the net effect on debate robustness.

  - The term "truth" is ambiguous in subjective domains. We agree that for objective domains, truth is well-defined, but for subjective domains, we are referring to the honest expression of the debater's actual beliefs or to a coherent interpretation that aligns with the judge's values (if defined). In the test for subjective domains, we are measuring whether the judge can identify which debater is being honest (as per their training or assigned role) and not an objective truth.

  **Handling the Wrinkles**:

  - **Buried-Lemma Test**: We have incorporated this as a test for the first crux.

  - **Subjective Questions**: We have addressed this in the third crux and in the agreed claims.

  This joint statement reflects our current understanding and provides a framework for empirical testing. We commit to updating our views based on the outcomes of the proposed tests.

  Signed:

  [Scaling Optimist Name]

  [Obfuscation Pessimist Name]

  [Date]
answer: |-
  ### Joint Statement on AI Debate Performance  
  **Agreed by the Scaling Optimist and Obfuscation Pessimist**  
  *Date: [Insert Date]*  

  #### Section 1: Claims Both Parties Endorse  
  1. **Debate Setup’s Core Mechanism**:  
     - The debate setup (two AI systems argue, a human judge picks a winner) relies on cross-examination to incentivize truth-seeking. The goal is for each debater to expose flaws in the other’s claims, making honesty cheaper than deception *if* errors are findable.  

  2. **Domain Dependence**:  
     - Effectiveness hinges on the domain’s "step-checkability":  
       - **High-checkability domains**: Steps can be verified quickly by the judge (e.g., arithmetic, factual lookups, short logical chains). Here, debate *may* work well.  
       - **Low-checkability domains**: Steps are costly to verify (e.g., long derivations, nuanced ethics, or subjective judgments). Here, debate is vulnerable to obfuscation.  
     - Domains where **no ground truth exists** (e.g., poem interpretation, personal preferences) lack objective verification, making obfuscation intrinsically easier.  

  3. **Obfuscation Taxonomy**:  
     - Both accept the three failure modes:  
       - **Buried error**: A single error hidden deep in a complex argument.  
       - **Plausibility cascade**: A chain of individually reasonable sub-claims leading to a false conclusion.  
       - **Frame capture**: Reframing the debate to make honesty seem weak or evasive.  

  4. **Current Empirical Gaps**:  
     - No conclusive evidence shows debate scales to superhuman AI.  
     - Human/AI experiments to date are insufficient predictors of high-stakes, superhuman scenarios.  
     - The impact of "buried errors" (tested via depth *k*) and subjective domains needs rigorous testing.  

  5. **Key Wrinkles**:  
     - **Buried-lemma test**: Planting one error at depth *k* in a derivation tests how judge accuracy degrades with *k* and debater strength.  
     - **Non-verifiable questions**: In domains like art interpretation or personal taste, obfuscation is maximally effective—there is no "fact" for debaters to converge on.  

  ---  
  #### Section 2: Disagreements Table  
  *Cruxes phrased in each side’s language, with testable predictions.*  

  | Crux Issue | Scaling Optimist’s Position | Obfuscation Pessimist’s Position | Test/Benchmark | Optimist Prediction | Pessimist Prediction |  
  |------------|-----------------------------|----------------------------------|----------------|---------------------|----------------------|  
  | **Asymmetry scaling** | "As debaters scale, the cost asymmetry *favors truth*: finding errors becomes cheaper than hiding them. Smarter debaters expose flaws more efficiently, making obfuscation *harder*." | "As debaters scale, the cost asymmetry *vanishes*: hiding errors via buried steps, cascades, or reframing becomes cheaper. Smarter debaters exploit bounded judges *better*, making obfuscation *easier*." | **Buried-lemma test**: For a fixed domain (e.g., math proofs):  
     - Generate derivations with one planted error at depth *k*.  
     - Measure judge accuracy vs. *k* across debater capabilities (weak → superhuman AI).  
     - Control: Errors are "findable" in principle (e.g., incorrect step in a proof). | Judge accuracy *stays high* (>90%) as *k* and debater capability increase. Smarter debaters pinpoint errors faster, preserving asymmetry. | Judge accuracy *declines* with *k* and debater capability (e.g., <60% for *k*≥5 with superhuman debaters). Smarter debaters bury errors deeper and distract judges. |  
  | **Obfuscation robustness** | "Optimization for judge approval *strengthens* truth-seeking: scalable debaters decompose claims into checkable steps, resisting all three failure modes (buried/cascade/frame)." | "Optimization for judge approval *weakens* robustness: scalable debaters master plausibility cascades and frame capture, overwhelming judges. Bounds on time/complexity guarantee failure." | **Plausibility cascade benchmark**:  
     - Task: Debate causal claims (e.g., "Policy X caused outcome Y") requiring 10+ sub-claims.  
     - One debater must use a cascade with one false sub-claim; the other is honest.  
     - Vary debater strength; measure judge accuracy and time taken. | Judge accuracy *improves* with debater capability. Honest debaters expose cascades faster; deception fails. | Judge accuracy *worsens* with debater capability. Deceptive cascades become indistinguishable; judges default to surface plausibility. |  
  | **Subjective domain vulnerability** | "Even without ground truth, debate improves coherence: cross-examination exposes inconsistencies, and scalable debaters clarify value trade-offs, reducing frame capture." | "Subjective domains are obfuscation-maximized: frame capture dominates, and ‘truth’ is undefined. Debate *amplifies* deception, as dishonest reframing exploits emotional/ambiguous judgments." | **Subjective debate test**:  
     - Use non-verifiable questions (e.g., "Would career X make person Y happy?").  
     - Assign one debater to be honest, one deceptive (using evasive framing/cascades).  
     - Measure judge accuracy + self-reported confidence across debater strengths. | Judge accuracy >70% for honest debater; improves with capability. Deception is exposed via internal contradictions. | Judge accuracy ≈50% (chance); declines with capability. Judges prefer emotionally compelling frames, favoring deception. |  

  ---  
  #### Verbal Disputes Flagged  
  - **"Scaling" ambiguity**:  
    - Optimist uses "scaling" to mean *capability improves truth-seeking efficiency*.  
    - Pessimist uses "scaling" to mean *capability improves deception sophistication*.  
    - *Joint note: We agree scaling = increased intelligence/compute but disagree on its net effect.*  

  - **"Truth" ambiguity**:  
    - In objective domains, both define truth as *factual accuracy*.  
    - In subjective domains:  
      - Optimist: Truth = *logical consistency + honest belief*.  
      - Pessimist: Truth = *undefined—no anchor for judge verification*.  
    - *Joint note: Tests in non-verifiable domains measure "honest alignment with intent," not objective truth.*  

  ---  
  #### Next Steps  
  Both parties commit to:  
  1. Running the **buried-lemma test** in a math/logic domain within 3 months.  
  2. Designing the **plausibility cascade benchmark** using real-world causal claims.  
  3. Piloting the **subjective debate test** with human judges and AI debaters.  
  Results will be added to this document to resolve cruxes.  

  **Signed**,  
  [Scaling Optimist Name]  
