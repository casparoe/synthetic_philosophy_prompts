answer: |-
  ## Sestina for the Drawn Hands

  This surface holds the making of a **HAND**,
  Where flatness lifts to form a living **CUFF**.
  A steady pressure draws a graphite **LINE**,
  Completing what it must: the circling **LOOP**
  That binds us both upon this shared **PLANE**,
  Obeys the silent, structuring **RULE**.

  No higher voice decrees this binding **RULE**,
  No artist shapes this slowly rising **HAND**.
  We find the edge, define this bounded **PLANE**
  Where substance shifts beside the paper's **CUFF**.
  Intent is born within the closing **LOOP**,
  Dependent on the ink, the guiding **LINE**.

  Is origin traced in that first faint **LINE**?
  Or did it wait within the unseen **RULE**?
  Creation flows within the mutual **LOOP**,
  Each motion granted by the other **HAND**.
  We meet the world just at the tidy **CUFF**,
  The limit of this self-contained **PLANE**.

  No depth exists beyond this paper's **PLANE**,
  No source external to the marks we **LINE**.
  Our being starts precisely at the **CUFF**,
  Emerging from the pattern and the **RULE**.
  I feel the grip shaping my own **HAND**
  As yours takes form within the giving **LOOP**.

  Perhaps a ground supports this fragile **LOOP**,
  A frame unseen beneath this shifting **PLANE**,
  Lending the force that moves my forming **HAND**,
  The true direction for the tracing **LINE**,
  The reason why we heed the circling **RULE**
  That binds us both beside the steady **CUFF**.

  Is this foundation fixed beyond the **CUFF**,
  Or is it, too, caught in a vaster **LOOP**?
  The certainty we draw from this strict **RULE**
  Might be a tenant on a wider **PLANE**,
  A borrowed order for the shaping **LINE**,
  That lets me lift to hold your steady **HAND**.

  Yet here, upon the sheet, the offered **HAND**,
  The point of contact at the clean white **CUFF**,
  The mutual tracing of the darkening **LINE**,
  The consequence within the closing **LOOP** –
  This is the world, the only solid **PLANE**,
  The visible enactment of the **RULE**.

  *(Envoi)*
  The silent **RULE** sustains the **PLANE** we trace,
  This bounded **LOOP**, this **HAND** that finds its **LINE**,
  Defines the edge, completes the rising **CUFF**.
