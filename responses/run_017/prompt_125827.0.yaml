answer: |-
  ## Dialogue: The Allais Urn

  **Setting:** A quiet corner of a university common room. Dr Evelyn Vance (mathematical economist) and Dr Idris Kamel (behavioural scientist) are discussing decision problems over tea.

  **Characters:**
  *   **Dr Evelyn Vance:** Precise, values axiomatic structure, slightly impatient with perceived inconsistencies. Believes rationality demands adherence to certain formal principles.
  *   **Dr Idris Kamel:** Thoughtful, pragmatic, grounded in descriptive choice behaviour. Believes formal rules can sometimes demand too much of human reasonableness.

  **(The dialogue begins with Vance sketching urn diagrams on a napkin.)**

  **Vance:** Right, Idris, let’s pin down this Allais business properly. We’ve got an urn, one hundred tickets, numbered 1 to 100. Two problems. Problem One: Option A gets you £1,000,000, *no matter* which ticket is drawn. Simple. Option B gets you £1,000,000 if it’s tickets 1 to 89, £5,000,000 if it’s 90 to 99, and absolutely nothing if it’s the dreaded ticket 100. Now, Problem Two: Option C gets you £1,000,000 only if the ticket is 1 to 11, nothing otherwise. Option D gets you £5,000,000 only if it’s 1 to 10, nothing otherwise.

  **Kamel:** The classic setup. And the typical pattern, as you know, is that most people choose A over B in the first problem, but then choose D over C in the second. They favour the certainty of a million in the first instance, but when both options involve significant risk, they go for the chance at five million.

  **Vance:** Precisely. And that pattern, A > B and D > C, is the puzzle. Because expected utility theory, which says we should maximise the sum of utility multiplied by probability, forbids it. It violates the independence axiom – technically, the sure-thing-for-lotteries principle. Look at the structure. *(Points emphatically at the napkin.)* In Problem One, for tickets 1 to 89, *both* A and B give you £1,000,000. Yes? So, that branch is identical, irrelevant to the choice between them. The *only* part that matters is tickets 90 to 100. Conditional on that, A gives you £1,000,000 for sure. B gives you a 10/11 chance of £5,000,000 and a 1/11 chance of nothing.

  **Kamel:** Agreed. The ‘live’ branch is 90-100.

  **Vance:** Now, Problem Two. For tickets 12 to 100, *both* C and D give you nothing. So, that branch is identical, irrelevant. The *only* part that matters is tickets 1 to 11. Conditional on *that*, C gives you £1,000,000 for sure? No! C gives you £1,000,000 only if it’s 1-11, which is certain *given* you’re in the 1-11 branch? Actually, no… conditional on being in 1-11, C gives you £1,000,000 with probability 1. D gives you £5,000,000 if it’s 1-10 (10/11 chance) and nothing if it’s 11 (1/11 chance).

  **Kamel:** Ah, I see where you’re going. Conditional on the *relevant* live branch – where the options actually differ – both problems reduce to the *exact same* choice: £1,000,000 for sure versus a gamble offering a 10/11 chance of £5,000,000 and a 1/11 chance of nothing. Tickets 90-100 for Problem One, tickets 1-11 for Problem Two, but the *gamble structure* within those live branches is identical: certainty of one million vs. that specific risky prospect.

  **Vance:** Exactly! Independence insists that if you prefer the sure million to that gamble in one context (Problem One, where it’s embedded with the safe 1-89 branch), you must prefer it in *any* structurally identical context (Problem Two, where it’s embedded with the ‘nothing’ 12-100 branch). Striking out the identical branches *must* leave the same core preference. Choosing A over B but then D over C is saying "I prefer the sure million to the gamble" *and* "I prefer the gamble to the sure million" about the *very same* pair of prospects, just framed differently. It’s a direct contradiction for any consistent ranking. Rationality demands we ignore branches where options agree.

  **Kamel:** I understand the formal argument, Evelyn, and I concede it’s logically tight *within* the expected utility framework. But I don't concede that it's irrational to have the Allais pattern. Expected utility theory makes a powerful simplifying assumption: that the value of a whole lottery is just the probability-weighted sum of the utilities of its outcomes, and crucially, that adding identical branches doesn't change the relative value. But why must that be the *only* rational way to evaluate? In Problem One, that ticket 100 looms large precisely *because* the alternative is a guaranteed million. The psychological cost of going from certainty to nothing feels disproportionately high. It’s not just a description of a feeling; it’s a recognition that context – what you stand to lose from certainty – matters for evaluation. Removing the safety net changes how the risk is perceived.

  **Vance:** But the structure hasn’t changed! The *probability* of getting nothing in the live branch is identical in both problems. Independence says you should focus *only* on the parts that differ and evaluate *those*. Ignoring the identical branches isn’t just a modelling trick; it’s a requirement of separable evaluation. If a branch doesn’t change based on your choice, it shouldn’t affect the choice. Otherwise, your preferences are swayed by irrelevant context. How is that rational? It opens the door to inconsistencies depending on how the problem is described.

  **Kamel:** I grant you the inconsistency *under expected utility*. But perhaps expected utility’s definition of ‘irrelevant context’ is too narrow. The unused branch *can* matter because it defines the baseline of security. Losing a guaranteed million hurts more than failing to gain a potential million when you had little chance anyway. That seems a principled reason – a kind of reference-dependence. I don’t think it’s merely irrational noise. But I concede I need to articulate *why* reference points defined by unused branches are legitimate for rational choice, beyond just saying it feels that way. It’s not simply repeating ‘I prefer the sure million’.

  **Vance:** Fair enough, that’s a substantive point. Let’s test this near-certainty idea. Suppose, before the draw, we learn there’s a minuscule independent risk, say one in a thousand, that the whole urn scheme is voided – a technical glitch, perhaps – and everyone gets nothing regardless. Call the resulting options A*, B*, C*, D*. A* is no longer certain: it’s a 99.9% chance of £1,000,000 and 0.1% chance of nothing. B*, C*, D* are similarly mixed with that 0.1% chance of nothing. Crucially, the *relative* comparisons within each problem are unchanged: A* vs B* shares the same 0.1% risk of nothing, and the core gamble conditional on the scheme *not* being voided is identical to before. Structurally, independence says the preference A* over B* and D* over C* should hold if the original pattern was rational. What if the pattern dissolves? What if people now choose B* over A* and D* over C*?

  **Kamel:** If the pattern dissolved just because literal certainty was removed, that *would* suggest the preference was psychologically tethered to the absolute guarantee. It might weaken my position, implying the preference was fragile. But suppose the pattern *survives*? Suppose people still prefer A* over B* and D* over C*? What would that tell you?

  **Vance:** It would be fascinating. It would suggest the preference isn’t solely about literal certainty, but about the *degree* of security offered by the £1,000,000 branch in Problem One compared to the baseline defined by the alternative branches. In A* vs B*, the ‘safe’ branch (tickets 1-89) still offers a much higher *level* of security (£1M) compared to the ‘safe’ branch in C* vs D* (tickets 12-100), which offers nothing. The psychological reference point might still differ. It wouldn’t settle the *normative* question for me, though. Independence requires ignoring the identical branches *regardless* of the outcome levels they contain. If identical branches can sway the choice because they set different reference points, that still violates separability. It shows the preference is robust, not that it satisfies independence. The normative disagreement remains.

  **Kamel:** And for me, if the pattern survived, it would bolster the idea that the *context* of the choice – the nature of the ‘safe’ outcome – fundamentally shapes how the risk in the live branch is evaluated, even without literal certainty. It’s a deeper feature of valuation. So no, neither hypothetical finding decisively settles the normative question for the other. We’d interpret it through our lenses. Let’s try another tack. Suppose the draw is staged. First, we determine if the ticket is in the ‘settled’ group – 1-89 for Problem One, 12-100 for Problem Two. Only if it’s *not* in the settled group – so 90-100 for Problem One, 1-11 for Problem Two – do we draw again to determine the final outcome within the live group. Crucially, *before* the first stage, you can choose: commit to A, B, C, or D now, *or* wait. If you wait, and the ticket lands in the settled group, you get whatever that option dictates for that group – £1M for Problem One settled, nothing for Problem Two settled – and it’s done. Only if it lands in the live group do you then get to choose between the live-branch options: sure £1M vs the £5M/nothing gamble.

  **Vance:** Ah, the dynamic choice probe. Excellent. Well, we agree that *conditional* on the live group coming up, the tempting choice is the risky one – £5M with 10/11 chance vs £1M for sure in both cases. We also agree that in the settled group, your choice makes no difference whatsoever; the outcome is fixed by the problem structure. So, rationally, you should plan *now* for the only branch where your choice matters: the live branch. You should prefer committing to A now only if you prefer the sure million *in the live branch*. But if you prefer D over C, that means you prefer the gamble *in the live branch*. Therefore, if you prefer A over B overall, you *must* prefer the sure million in the live branch, so you should commit to A. But if you prefer D over C overall, you prefer the gamble in the live branch, so you should want the *option* to choose the gamble if the live branch occurs – meaning you should *not* commit to C now; you should wait and choose D conditionally if needed. The pattern A > B and D > C forces you into a contradiction: you’d have to both commit to A (refusing the gamble) and refuse to commit to C (demanding the option to choose the gamble). The only consistent plan is to always prefer the sure million in the live branch or always prefer the gamble. Independence holds dynamically.

  **Kamel:** That’s clever, Evelyn, and it presses hard. But my reply isn’t that the probabilities depend on my act – they clearly don’t. It’s that I object to the *reduction* of the compound lottery. The *process* matters. Committing now collapses the uncertainty; I make one choice encompassing both stages. Waiting keeps the uncertainty unresolved until the second stage. The *experience* of potentially facing a choice later, even if it ends up not mattering, carries weight. In Problem One, committing to B means accepting *now* that I might end up with nothing, even though I might never face the live choice. That feels reckless. Whereas waiting means I only confront the risk *if* the first stage forces me to. The psychological burden is different. I care about the shape of the decision tree, not just the final probabilities and outcomes. Avoiding the premature commitment to the risk of ruin has value in itself.

  **Vance:** But what value, Idris? *What* is gained in the settled branch? If the ticket lands in 1-89, whether you committed to A or B or waited, you get £1,000,000. Nothing changes. You feel differently *now*, before the draw, but the *outcome* in that state is utterly unaffected. It’s purely psychological cost or benefit attached to the *act of choosing* under a description, not to the consequences. Isn't rationality about choosing based on consequences? If you wouldn’t pay anything to avoid the *knowledge* of which path you’re on *after* the settled branch resolves (which you wouldn’t, since it changes nothing), why pay anything to avoid the *commitment* to it beforehand? Would you actually pay, say, £100, to avoid being offered the late choice option in Problem One, forcing you to commit now to A or B?

  **Kamel:** *(Pauses thoughtfully)* Pay to avoid the late choice? In Problem One, where the settled branch is safe... probably not £100, no. Maybe a tiny amount, reflecting the mental load of potentially facing a high-stakes choice later? But it’s small. I concede it’s weak. The real weight is in the *initial* commitment under certainty versus risk. The dynamic choice exposes a tension, I admit. But it doesn't erase the strong intuition driving the Allais pattern in the static choice. My resistance to reducing the compound lottery might be more about the initial evaluation than the dynamic consistency. Perhaps the cost is in the initial feeling of security offered by A, which the staged choice disrupts by making the risk salient earlier. It’s messy. You’ve shown a cost to my view here.

  **Vance:** Thank you. Now, let’s try the crux: the hundred ticket-holders. Instead of one person drawing a ticket once, imagine a hundred distinct, identifiable people. Each holds one ticket. The ‘lottery’ becomes a deterministic allocation of money based on ticket number. Choosing an option chooses the final distribution of wealth. So:
  *   Choosing A: All 100 people get £1,000,000. Perfect equality.
  *   Choosing B: Ticket holders 1-89 get £1,000,000; 90-99 get £5,000,000; holder 100 gets nothing. Moderate inequality, one person loses out badly.
  *   Choosing C: Only holders 1-11 get £1,000,000; holders 12-100 get nothing. Eleven winners, eighty-nine losers.
  *   Choosing D: Only holders 1-10 get £5,000,000; holders 11-100 get nothing. Ten bigger winners, ninety losers.

  The Allais pattern (A > B and D > C) now means: You prefer giving everyone a million over a distribution where eighty-nine get a million, ten get five million, but *one* gets nothing. Yet, you prefer a distribution where ten get five million and ninety get nothing over one where eleven get a million and eighty-nine get nothing.

  **Kamel:** Putting faces on it changes the feel, doesn't it? Choosing B means deliberately creating one destitute person when you could have made everyone comfortably off. Choosing D over C means creating ninety losers instead of eighty-nine, but giving ten people an even larger windfall rather than making eleven people merely well-off. It highlights the aversion to creating that *single, clear loser* against a backdrop of security in B, which isn’t present in C or D.

  **Vance:** But let’s evaluate these distributions symmetrically. Suppose we score a distribution by summing up some function u(amount) for each person. u is increasing – more money is better – but perhaps concave to reflect diminishing returns or inequality aversion. Standard utilitarian or prioritarian scoring. Let’s compute the sums for a simple u, say u(x) = sqrt(x) to capture moderate risk aversion/inequality aversion. Units are sqrt(£1,000,000) = 1000.
  *   A: 100 * u(1M) = 100 * 1000 = 100,000
  *   B: 89 * u(1M) + 10 * u(5M) + 1 * u(0) = (89 * 1000) + (10 * 2236) + (1 * 0) ≈ 89,000 + 22,360 + 0 = 111,360
  *   C: 11 * u(1M) + 89 * u(0) = 11 * 1000 + 89 * 0 = 11,000
  *   D: 10 * u(5M) + 90 * u(0) = 10 * 2236 + 90 * 0 = 22,360

  **Kamel:** So with u(x)=sqrt(x), B (111,360) scores much higher than A (100,000), and D (22,360) scores higher than C (11,000). The Allais pattern (preferring A to B *and* D to C) doesn’t appear. It’s B > A and D > C.

  **Vance:** Exactly. Now, could *any* increasing function u make A > B *and* D > C true? A > B requires that the loss from person 100 getting nothing instead of £1M outweighs the gains from ten people getting £5M instead of £1M. Formally: u(1M) - u(0) > 10 * [u(5M) - u(1M)]. D > C requires that the gain from ten people getting £5M instead of £1M outweighs the loss from person 11 getting nothing instead of £1M. Formally: 10 * [u(5M) - u(1M)] > u(1M) - u(0). You see? The left side of the inequality for D > C is *exactly* the right side of the inequality for A > B. A > B says X > Y, D > C says Y > X, where X = u(1M) - u(0) and Y = 10 * [u(5M) - u(1M)]. They are direct contradictions! No increasing u can satisfy both. The Allais pattern is incompatible with *any* evaluation rule that cares only about the final distribution of money across people and evaluates it symmetrically and additively.

  **Kamel:** *(Leans back)* That *is* stark. You’ve shown that if my choice is solely about approving a final distribution of wealth among identifiable people, ranked by the sum of their individual utilities, the Allais pattern is indeed impossible. It forces a contradiction.

  **Vance:** So? Does this move you?

  **Kamel:** It clarifies something profound. My evaluation in the original lottery *wasn’t* fundamentally about the final distribution per se. It was about the *act of choosing* under uncertainty and the *risk* imposed on the single chooser. The ‘sting’ of ticket 100 wasn’t just that someone gets nothing; it was that *I*, the chooser, could have guaranteed myself a million and instead gambled it away for a chance at more, landing in ruin. It’s agent-relative. In the distributional view, the harm is spread impersonally. When I’m the single agent facing the risk, avoiding the chance of being the *one* who loses everything from a position of safety feels paramount. Choosing D over C doesn’t carry that same weight because there was no safety to lose; it’s all risk. The object of evaluation isn't the final distribution; it's the prospect *for me* given my choice. Dividing the outcome among distinct people *does* change the subject. It removes the central element: the personal exposure to ruin from certainty.

  **Vance:** But that’s deeply problematic, Idris! If unused branches can matter because they define a feeling of security *for you*, what principled limit is there? Suppose I offer you two lotteries: E gives £1 for sure. F gives £2 with 99.999999% probability and death by torture with 0.000001% probability. The independence argument would say: compare this to another pair G and H where the ‘safe’ branch is replaced with something awful. Would you really say preferring E over F is rational because of the ‘sting’ of torture from near-certainty? But worse, does your licence generalise? Compare: Option J: £1M if coin heads, £1M if tails. Option K: £1M if heads, £5M if tails. Independence says they are identical, both give £1M for sure. Would you ever prefer J to K? If the unused branch matters, perhaps you dislike the *idea* of potentially getting £5M and ‘losing’ it if tails comes up, making you feel worse off than if you’d never had the chance? That seems absurdly irrational. Where does the ‘security reference point’ licence stop? It risks justifying any context-dependent preference.

  **Kamel:** That torture case is compelling, Vance. I wouldn’t want to endorse that preference as rational. And preferring J to K? Utterly indefensible, I agree. So yes, there must be limits. My defence of Allais is specific: the combination of a very high probability of security and a very small probability of catastrophic loss *relative to that security*. The unused branch defines a salient reference point of safety, and losses from that reference loom large. It’s not any unused branch; it’s unused branches establishing a high-stakes certainty. The licence doesn’t generalise wildly. But you’re right, drawing the precise boundary is difficult. It’s a real cost of my view: it requires accepting that the *description* of the options – how the uncertainty is framed and what certainties are presented – can rationally influence choice, not just the final probabilities and outcomes. It sacrifices a certain kind of formal purity and universality.

  **Vance:** And the cost of *my* view, I concede, is that it can feel psychologically unrealistic or even demanding to the point of inhumanity. It asks people to ignore the powerful psychological anchor of certainty. It dismisses a strong, widespread intuition as merely a framing error. The long-run or dominance arguments *do* lean on extra premises like separability or reduction of compound lotteries. The money-pump arguments are indeed less decisive here than for transitivity. I can’t prove independence is rationally *necessary* without appealing to the very consistency it’s supposed to underpin or to those auxiliary assumptions. It remains, in part, a compelling normative ideal.

  **Kamel:** So we disagree on what rationality demands in the face of deep psychological intuitions about security and loss. For you, Vance, rationality requires conforming to separability across branches, consequences be damned. For me, rationality must accommodate the way certainty fundamentally shapes risk perception, even if it costs some formal consistency. What would move me? If it turned out that people adhering strictly to independence systematically made *worse* life outcomes – were unhappier, made poorer decisions in complex real-world settings – I’d reconsider. Or if the ‘security reference point’ idea proved utterly incoherent under pressure, like in your torture case.

  **Vance:** And what would move me? If someone developed a truly robust, non-arbitrary, and rational alternative framework incorporating context-dependence like this, which didn’t lead to absurdities like preferring J to K, and which demonstrably led to better decisions under uncertainty. Or if the psychological basis proved so fundamental that denying it seemed like denying human nature. But barring that, I see independence as a cornerstone of coherent choice.

  **Kamel:** A cornerstone, perhaps. But maybe not the whole building. We agree on the structure, Vance, just not on whether the walls must be built *only* with that stone. Tea’s getting cold.
