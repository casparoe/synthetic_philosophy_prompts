  Below is the decision tree classification instrument for your epistemology seminar handout. It consists of eight diagnostic questions, each phrased as a concrete case or claim without technical jargon. The questions avoid the terms "lottery," "preface," "closure," "threshold," and "coherence," and include three non-standard cases (inspector, mixed case, asymmetric stakes) plus one question separating views that agree on the lottery but differ on the preface. The tree has seven leaves (one marked empty) generated from the logical space of distinctions, covering closure-preserving, threshold, degree-only, acceptance, modal, and other views. Each leaf is labeled descriptively, with a note on its most awkward commitment. Pairs of leaves that cannot be separated by the questions are flagged, and the scoring key maps answer patterns to leaves.

