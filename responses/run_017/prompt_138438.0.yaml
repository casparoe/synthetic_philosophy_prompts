answer: |-
  Based on your framework, goals, and constraints, here is the prioritized list of open questions to investigate first. The ranking emphasizes **importance** (potential impact on reader perception of housing possibilities, 40% weight), **upstream nature** (how many subsequent craft decisions depend on its resolution, 30% weight), and **tractability** (feasibility using drafts, reflection, and beta readers, 30% weight). Neglectedness is lower (10%, folded into importance) as your framework already highlights less obvious levels.

  **Prioritized Questions:**

  1.  **Formal Level: Character Interiority & Sympathy Distribution**
      *   **The Question:** Which character perspectives and interior experiences, when granted depth and narrative sympathy, will most effectively *embody* the lived consequences of specific housing policies (or their absence) without explanation, thereby reshaping the reader's intuitive sense of what housing arrangements are viable or desirable?
      *   **Why Upstream:** This directly determines whose world feels real and whose suffering/success resonates. It dictates POV choices, scene focus, backstory depth, and plot resolution distribution. Settling whose inner life *matters* to the narrative fundamentally shapes which "possible worlds" feel narratable and emotionally credible to the reader regarding housing stability, community, or displacement. Decisions here make choices about plot events, dialogue weight, and even thematic imagery easier or redundant.
      *   **Tractability:** High. Novelists constantly work with character. Test via drafts: write/revise key scenes exploring different characters' internal reactions to housing stress/security. Use beta readers to probe: *"Whose situation felt most urgent/relatable? Did any character's housing struggle feel abstract or unmotivated? Did you find yourself sympathizing unexpectedly with someone whose housing choices you might disagree with?"* Concrete evidence: Beta readers consistently failing to engage with the character whose housing experience is central to the policy subtext, or finding a character's reaction to eviction/renovation/etc., unbelievable, signals a need for revision here.
      *   **Evidence for Priority Shift:** If early readers universally grasp the intended emotional weight and consequences of housing situations through existing character depth, this moves down. If they find key characters "flat," "confusing," or "unsympathetic" precisely in housing-related moments, it stays top.

  2.  **Reflexive Level: Framing Admission & Reader Trust**
      *   **The Question:** How explicitly should the narrative signal its own constructed perspective on "normal" housing or "reasonable" solutions, and through which formal mechanisms (e.g., unreliable narrator, juxtaposition, meta-commentary, structural irony), to avoid presenting its vision as neutral reality while maintaining immersion?
      *   **Why Upstream:** This governs the fundamental contract with the reader. Does the novel present its housing world as *the* way things are (risking reader dismissal if their reality differs) or *a* way things can be seen (inviting consideration)? This decision impacts tone, narrative voice, ending ambiguity, and the handling of counter-perspectives within the text. Settling this determines how much "showing" needs to do the work vs. allowing subtle "telling" about framing. It changes what constitutes a satisfying or "honest" resolution.
      *   **Tractability:** Moderate. Requires careful manipulation of narrative distance and voice. Testable through specific structural/tonal revisions and targeted beta reader questions. Experiment with adding/removing subtle cues (e.g., a minor character voicing an opposing norm, a narrative aside hinting at contingency). Ask beta readers: *"Did the world of the novel feel like an inevitable reality, or like one specific version of how things could be? Did you trust the narrator's perspective on what constituted a 'good' or 'bad' housing situation? Was there a moment where the book's own viewpoint seemed most visible?"*
      *   **Evidence for Priority Shift:** If readers consistently describe the housing context as "just the way it is" or find the ending's implications about livability unexamined/unquestioned dogma, this becomes critical. If they readily identify the novel's perspective *as* a perspective, it might be lower. Overly explicit framing devices breaking immersion would also necessitate revision.

  3.  **Thesis Level: Minimizing & Embedding Necessary Assertion**
      *   **The Question:** What is the absolute minimum explicit thesis (dialogue, narrative assertion) required to prevent evasion or misreading of the housing subtext, and how can these moments be organically triggered *by* the formal choices (character action/experience) and reflexive framing, rather than standing as authorial intrusion?
      *   **Why Upstream:** While you aim to minimize this, completely avoiding *some* explicit statement/perspective is likely impossible. Defining *what must be said* and *by whom, when* determines specific scenes, dialogue exchanges, and moments of narrative commentary. It sets a boundary for when "showing" needs a minimal "tell" anchor. Resolving this prevents wasted effort polishing preachy dialogue that might be cut and focuses revision on embedding necessary statements character-logically.
      *   **Tractability:** Moderate to High for identification, trickier for seamless embedding. Use drafts and beta readers to identify "preachy" spots. More crucially, identify points where readers *misinterpret* the housing implications due to excessive subtlety ("Wait, why is that character suddenly homeless?"). Ask: *"Were there moments where a character's opinion on housing felt like the author lecturing? Were there points where you were confused about why a housing situation mattered or what caused it?"* Test revisions where explicit statements *only* arise from intense character experience or conflict revealed through the formal level.
      *   **Evidence for Priority Shift:** If beta readers flag numerous sections as didactic ("soapbox," "lecture"), this jumps up. If they report confusion about motivations or consequences related to housing, indicating the formal level isn't sufficient alone, it also rises. If the existing minimal thesis elements feel organic and unchallenged, it stays lower.

  **Trade-off & Deprioritization:**
  *   **Deprioritized:** A deeper philosophical question like *"What precise mechanism makes formal choices 'propaganda'?"* While fascinating, resolving this wouldn't change your *revision actions*. You're operating from Du Bois's premise. Knowing the exact mechanism doesn't alter the practical task of wielding POV or structure effectively to shape perception, which is addressed by investigating the Formal and Reflexive levels practically. Focusing here risks philosophical diversion without novelistic payoff.

  **Ordering Rationale:**
  1.  **Formal Level (Character Interiority & Sympathy):** Highest importance and upstream impact (sympathy dictates narrative weight), highest tractability (core novelist skill). Getting the reader to *feel* the housing reality through character is foundational. If this fails, the policy imagination shift fails regardless of other levels.
  2.  **Reflexive Level (Framing Admission):** Critically important for trust and avoiding counter-productive didacticism by stealth. Highly upstream for tone and structure. Moderate tractability. Addresses the risk of the novel's vision being dismissed as "unrealistic" because presented as universal.
  3.  **Thesis Level (Minimizing Assertion):** Important but more downstream. You already intend to minimize this; the investigation focuses on *cleaning up* necessary remnants based on the foundation built by 1 & 2. High tractability for identification, ensuring effort isn't wasted.

  \answer{1: Formal Perspective Choices; 2: Reflexive Framing Admission; 3: Thesis Element Minimization}
