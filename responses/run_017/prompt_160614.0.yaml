  Possible exits: Rejecting uniform prior as "ignorance" seems strongest - it's actually a substantive bias toward disorder. But this costs the neat symmetry of (1). Alternatively, denying that prior-free vindication is necessary accommodates actual practice but might feel like surrendering to Hume. The labeling relativity in (7) offers a technical escape but feels unsatisfying for addressing Hume's original concern.

