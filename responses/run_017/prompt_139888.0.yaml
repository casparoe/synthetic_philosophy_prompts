     - **Name**: Epistemic two-dimensionalism (Chalmers-style)  
     - **Steelman**: Unifies meaning, reason, and modality, explaining contingent a priori truths and necessary a posteriori truths.  
     - **Awkward commitment**: Requires metaphysically impossible scenarios to be armchair-accessible.  

  3. **Bitstring: A,B,B,A,B,B**  
     - **Name**: Indexical two-dimensionalism (Kaplan-style)  
     - **Steelman**: Extends indexical semantics naturally to context-dependent terms without overgeneralizing.  
     - **Awkward commitment**: Cannot handle armchair-excluded scenarios (e.g., severe illusions) without ad hoc adjustments.  

  4. **Bitstring: B,B,A,A,A,A**  
     - **Name**: Descriptivist two-dimensionalism  
     - **Steelman**: Aligns reference with speaker intentions/descriptions, capturing reference-shift cases cleanly.  
     - **Awkward commitment**: Violates Kripkean rigidity (e.g., "Hesperus is Phosphorus" becomes contingent).  

  5. **Bitstring: B,B,A,B,A,B**  
     - **Name**: Unnamed (weak descriptivism)  
     - **Steelman**: Balances descriptivism with modest 2D apparatus to handle indexicals without impossible worlds.  
     - **Awkward commitment**: Ambiguous about whether "water" denotes XYZ in drift cases if speakers are unaware.  

  6. **Bitstring: A,B,B,A,B,B**  
     - **Name**: Deflationary two-dimensionalism  
     - **Steelman**: Provides a useful tool for modeling context and apriority without substantive metaphysical commitments.  
     - **Awkward commitment**: Accused of vacuity for not explaining *why* the 2D patterns hold.  

  7. **Bitstring: A,B,B,B,B,B**  
     - **Name**: Metasemantic two-dimensionalism (Stalnaker-style)  
     - **Steelman**: Illuminates information flow in communication using possible worlds without epistemic reification.  
     - **Awkward commitment**: Cannot ground substantive epistemic or modal conclusions (e.g., about necessity).  

  ---

  ### Unreached Verdict Combinations  
  - **A,B,A,*,*,* (Zembla armchair=No + Drift endpoint=Yes)**: Only reached via bitstrings like A,B,A,A,A,A.  
    - **Status**: *Stable but unattractive*. Combines rigidity for "zembla" with non-rigidity for "water," implying inconsistent metasemantics.  
  - **A,A,*,*,*,* (Zembla armchair=Yes)**: Rejected at Node 2.  
    - **Status**: *Incoherent*. If "zembla" is rigid (denotes H₂O in all worlds), it cannot be known a priori to be H₂O (as the stipulator lacks empirical knowledge).  
  - **B,A,*,*,*,* (Zembla counterfactual=XYZ + Zembla armchair=Yes)**: Rejected at Node 2.  
    - **Status**: *Incoherent*. If "zembla" denotes XYZ in the counterfactual world, it cannot be known a priori to be H₂O (contradicting Node 2A).  

  ---

  ### Indistinguishable Leaves & Separating Questions  
  - **Leaves 1 and 7** share bitstring `A,B,B,B,B,B` (direct reference rejection and metasemantic views).  
    - **Why indistinguishable?** Both reject centered worlds, impossible scenarios, and explanatory ambitions.  
    - **Separating question**: *Does the 2D framework usefully describe semantic phenomena at all?*  
      - Soames (Leaf 1) would say **no** (it’s a misguided overlay).  
      - Stalnaker (Leaf 7) would say **yes** (it models communication dynamics).  

  - **Leaves 3 and 6** share bitstring `A,B,B,A,B,B` (indexical and deflationary views).  
    - **Why indistinguishable?** Both accept centered worlds but reject impossible scenarios and explanation.  
    - **Separating question**: *Is the 2D framework primarily about indexicals?*  
      - Kaplan (Leaf 3) would say **yes** (applies to "I," "now," etc.).  
      - Deflationary view (Leaf 6) would say **no** (applies neutrally to all terms).  

  ---

  ### Design Notes  
  - **Topology**: The tree starts with **zembla** to split rigid/non-rigid views early. **Drift** and **sealed-lab** (via centered worlds) force divisions on vagueness and armchair access. **Impossible scenarios** and **explanatory role** isolate epistemic commitments.  
  - **Omissions**: Twin Earth was excluded per your constraint; slow-switch cases are subsumed under drift. "Meaning in the head" is never asked.  
  - **Efficiency**: 6 nodes yield 7 leaves—below the 12-leaf cap. Unreached combinations are flagged.  
  - **Steelman/awkward**: Phrased to be objective (no strawmen).  
  - **Unexpected route**: Kaplan (Leaf 3) emerges from rigidity + centered worlds, showing his view extends beyond indexicals.  

  This tree fits on a two-page handout. Readers walk through cases (not jargon) to land on a view, then argue about its steelman/awkwardness in comments.
