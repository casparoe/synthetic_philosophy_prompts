  We are in a microbiology lab studying bacterial resistance. The community has been tracking a strain of E. coli that, when exposed to a new antibiotic, sometimes develops resistance. They have two ways to describe the resistance trait:

  1. A "natural" way: They note that the resistance is conferred by a specific gene (call it gene X) that produces an enzyme breaking down the antibiotic. This gene has been found in many bacterial species and is well-understood biochemically. The predicate is "has gene X".

  2. An "operational" way: Their standard assay for resistance involves growing the bacteria on agar plates containing the antibiotic and observing growth after 48 hours. They have a machine that automatically reports "resistant" if the optical density (OD) at 600 nm exceeds 0.5 at 48 hours. The predicate is "OD600>0.5 at 48h".

  Now, the data: Over the past year, every time they exposed this strain to the antibiotic and observed at 48 hours, the OD600 was above 0.5 (so the machine reported "resistant"). They have done 1000 trials. They now have a new batch of the same strain and are about to test it. They wonder: will it be resistant?

  But note: There's an alternative hypothesis. They have also noticed that in every case where the bacteria were resistant (by the machine's report at 48h), they also had gene X. However, they have a theoretical concern: what if the resistance is not always due to gene X? They recall that in other strains, resistance can sometimes be due to a different mechanism (e.g., efflux pumps) that might also lead to growth by 48h. Moreover, they have a new instrument that can measure gene expression in real time. They hypothesize that perhaps in some cases, the resistance is due to an inducible efflux pump that only activates after 24 hours. They have never observed this in this strain, but it's possible.

  So, the two predicates for the same observed data (growth at 48h) are:

  - P1: Has gene X (the natural, joint-carving predicate)
  - P2: OD600>0.5 at 48h (the entrenched, operational predicate)

  Both have been co-instantiated in all 1000 past cases. But now, consider a prediction: what if we look at a time point before 48h? Suppose we check at 36 hours. The community has not done this before because their protocol is 48h. They set up an experiment: they expose the new batch and measure at 36h and 48h.

  The rival projections:

  - Projecting P1 (has gene X): If the bacteria have gene X, then they should show growth at 48h (as always). But what about 36h? The gene X mechanism produces the enzyme constitutively, so growth should be present at 36h too (though perhaps not reaching OD600>0.5 by 36h, but that's not the point). The key is that the resistance mechanism is present and active at 36h.

  - Projecting P2 (OD600>0.5 at 48h): This only tells us about 48h. It says nothing about 36h. In fact, it is compatible with no growth at 36h and then growth at 48h. This would happen if the resistance mechanism is inducible and takes time.

  Now, the divergence: They run the test and look at 36h. They find that at 36h, the OD600 is 0.3 (so below 0.5) and there is no visible growth. Then at 48h, it is 0.6. So the machine at 48h reports "resistant".

  - If we project P1 (gene X), we would have expected that at 36h there should be some growth (because gene X is always active). But we didn't see it. So P1 is falsified? Not exactly: the bacteria might have gene X but the expression level might be low. But wait: their past data didn't include 36h measurements, so they don't know. Alternatively, they might have a new mutant without gene X.

  But note: the prediction about 36h is not directly about the same predicate. The predicates are defined for the test at 48h. So the real divergence is in the underlying mechanism. The community wants to predict whether the next sample (from the same strain) will be resistant (by the machine at 48h) and also what mechanism it has.

  However, the two predicates are about the same outcome at 48h. The issue is that the entrenched predicate (P2) is purely about the observation at 48h and has been projected in the sense that every time they've looked at 48h, they've seen resistance. The natural predicate (P1) is about the presence of a gene that they believe is the cause of the resistance. The prediction that fails is not the 48h resistance (both predict that) but the mechanism (which they now test by looking at 36h and by genetic testing).

  After the 36h observation, they do a genetic test and find that the bacteria do not have gene X. Instead, they have a mutation activating an efflux pump.

  So the data at 48h was the same, but the underlying cause was different. The entrenched predicate (P2) was projected and it held (the bacteria were resistant at 48h). The natural predicate (P1) was projected and it failed (they thought the resistance was due to gene X, but it wasn't).

  But note: the community was projecting P1 and P2 for the same outcome (resistance at 48h). They both had 100% success for that outcome. However, when they tried to use the predicates to make a prediction about the mechanism (which is what P1 is really about) they were wrong.

  The structural feature: The entrenched predicate (P2) is an observational/operational one that directly reports the outcome of interest (resistance at 48h). The natural predicate (P1) is a theoretical one that posits a specific causal mechanism. The two can come apart because the same observational outcome can be produced by different mechanisms.

  If we remove the possibility of multiple mechanisms (i.e., if we stipulate that the resistance at 48h can only come from gene X), then the case degenerates into a purely verbal dispute (because then P1 and P2 would be co-extensive). But in reality, multiple realizability is common.

  Now, the responses:

  1. Entrenchment: The community has always used the operational definition (P2) in their reports and in building their dataset. They have projected P2 successfully 1000 times. So entrenchment says project P2. And indeed, P2 holds for the new case.

  2. Naturalness: The community knows that gene X is a natural kind in biology (a specific DNA sequence with a specific function). The operational predicate P2 is an artifact of their measurement protocol and time point. Naturalness says project P1. But in the new case, P1 fails (the bacteria don't have gene X).

  So entrenchment wins in this instance? But wait: the prediction we are making is about the 48h resistance. Both P1 and P2 predicted that correctly. The failure of P1 was about a different matter (the mechanism). So if the question is "will the bacteria be resistant at 48h?" then both are equally good? Not exactly: the naturalness response might say that we should project the causal structure (P1) because it gives us more understanding and might help in other predictions (like at 36h). But the entrenchment response is only about the specific prediction at 48h.

  To make the divergence on a prediction checkable in principle, we need a prediction that they both make that can differ. So we must design the case so that the two predicates lead to different predictions about the same future event.

  Revised scenario: The community is about to test a new antibiotic that is known to be broken down by the enzyme from gene X, but is not affected by efflux pumps. Now, they have two candidate generalizations:

  - G1: All samples of this strain that are resistant (by the 48h test) have gene X.
  - G2: All samples of this strain that are resistant (by the 48h test) will have the property of being resistant at 48h (which is trivial) but we are interested in whether they will be resistant to the new antibiotic.

  But note: G2 doesn't say anything about the new antibiotic. So we need to link the predicates to a new test.

  Better: The community wants to predict whether the same bacteria that are resistant to the first antibiotic (at 48h) will also be resistant to a second antibiotic that is broken down only by the enzyme from gene X (and not by efflux pumps). So:

  - If they project P1 (has gene X), then they predict that the bacteria that were resistant to the first antibiotic (at 48h) will also be resistant to the second antibiotic (because they have gene X).
  - If they project P2 (OD600>0.5 at 48h for the first antibiotic), then they have no basis to predict about the second antibiotic. But they might try to use the same operational predicate for the second antibiotic? That's a different test.

  Alternatively, we can define a new predicate for the second antibiotic. But that complicates.

  Let me reframe the entire case.

  Revised Case: A microbiology lab studies resistance of a bacterial strain to antibiotic A. They have two candidate predicates for a culture:

  - P1: Has gene X (which codes for an enzyme that breaks down antibiotic A).
  - P2: Grows on agar with antibiotic A at 48h (OD600>0.5).

  They have observed 1000 cultures, all of which were P2 and also P1. They are now given a new culture of the same strain. They want to know if it will be resistant to antibiotic A (i.e., P2). Both predicates have been 100% correlated in the past. But they also have a new antibiotic B, which is broken down by the enzyme from gene X, but is not affected by other resistance mechanisms (like efflux pumps). They now want to predict whether the new culture, if it is resistant to A (i.e., if it is P2), will also be resistant to B.

  The rival projections:

  - If they project P1 (has gene X), they would say: if the new culture is resistant to A (P2), then it must have gene X (because that's the only mechanism we've seen) and therefore it will be resistant to B.

  - If they project P2 (grows at 48h on A), then they have no direct information about resistance to B. But note: they have never used P2 to project to a different antibiotic. So entrenchment would not license using P2 to project to B. They would need a new predicate for B.

  But wait: they might form a general law: "resistant to A" (P2) implies "resistant to B". But that's a new generalization. The entrenchment of P2 alone doesn't help. So we have to make the predicates about a common property.

  Alternative: The community has been using both predicates for the same set of observations. They now face a new culture. They will test it for resistance to A at 48h. They also want to know, without doing the genetic test, whether it has gene X. Why? Because if it does, then they can use a different drug (antibiotic C) that is not broken down by gene X. So:

  - Projecting P1: They predict that the new culture, if resistant to A (by P2), will have gene X. Therefore, they should not use antibiotic C (because it won't work).

  - Projecting P2: They don't have a basis to predict about gene X. They might say: we don't know, so we should do the genetic test.

  But that doesn't force a divergence in prediction.

  We need a prediction that both make but that can diverge. Let's set up the case so that the two predicates are used to predict the same thing: the resistance at 48h for antibiotic A in a slightly different condition. For example, they now want to test at a different temperature (say 30°C instead of 37°C). They have always done the test at 37°C.

  - P1: Has gene X. They know that gene X works at both temperatures (from basic biology). So they predict that if the bacteria have gene X, they will be resistant at 48h at 30°C.

  - P2: Grows on A at 48h at 37°C. They have never tested at 30°C. So they don't know.

  But then they are not predicting the same thing. The entrenchment of P2 (which is defined at 37°C) doesn't tell them about 30°C. So again, no direct conflict.

  We need the predicates to be about the same thing in a way that they can be extended to a new case.

  Final attempt: The community has been testing resistance to antibiotic A at 37°C for 48h. They have two predicates:

  - P1: Has gene X (which they believe is the cause of resistance at 37°C).
  - P2: Grows at 48h at 37°C.

  Both have held in all 1000 cases. They now want to know about the same culture at an earlier time, say 24h, at 37°C. They have never looked at 24h because their protocol is 48h.

  - If they project P1 (has gene X), they know from biochemistry that gene X is constitutively expressed, so they should see growth at 24h (though maybe not OD600>0.5, but they can adjust the threshold for 24h). They predict: at 24h, the culture will show growth (OD600 above some lower threshold).

  - If they project P2, they have no data about 24h. But note: P2 is about 48h. It doesn't say anything about 24h. So they might not make a prediction about 24h. But if they are forced to, they might say: we don't know, or we assume it's the same? But that's not forced by entrenchment.

  The divergence is not on a prediction about the same event.

  I think I have to accept that the prediction is about a different but related event. The naturalness response allows us to project to new situations (like earlier times) because it captures a causal mechanism. The entrenchment response does not.

  But the assignment requires a prediction that is checkable and that the two responses license differently.

  Let's go back to the temperature example, but make the prediction about the same antibiotic at a new temperature, and define the predicates more carefully.

  Scenario: The lab studies bacterial growth in the presence of antibiotic A. They have two predicates for a culture:

  - P1 (natural): The culture has a specific genetic marker (gene X) that is known to confer resistance by enzymatic degradation.
  - P2 (entrenched): The culture exhibits "resistance" as operationally defined by their automated system: when incubated at 37°C for 48 hours on agar plates with antibiotic A, the optical density at 600 nm exceeds 0.5.

  They have 1000 cases at 37°C, all of which are both P1 and P2. They now get a new culture. They need to predict whether it will be resistant at 30°C for 48 hours (same OD threshold). They have never tested at 30°C.

  - Projecting P1: Since gene X functions at a range of temperatures (from 25°C to 42°C), they predict that if the culture has gene X, it will be resistant at 30°C.

  - Projecting P2: They have only observed resistance at 37°C. They have no data at 30°C. So they might not make a prediction, or if they do, it would be based on an extrapolation that is not licensed by entrenchment. Entrenchment of P2 (which is tied to 37°C) doesn't extend to 30°C.

  So again, no direct conflict.

  But wait: they could use the generalization: "cultures that are resistant at 37°C (P2) are also resistant at 30°C". But that's a new predicate, not P2 itself. The entrenchment of the predicate P2 does not by itself give us grounds to project to a different temperature.

  The only way to get a divergence in the same prediction is to have the two predicates make different predictions about the same event. So let's make the event: resistance at 37°C for 48h for a new culture. Both P1 and P2, if projected, would predict that the new culture will be resistant (P2) and will have gene X (P1). But that's not a divergence.

  Unless we have a case where the two predicates come apart in the new culture. But then the past data must have been such that they were together, but now they are not. But that's what happened in the first version: in the new culture, they have resistance at 48h (P2) but without gene X (so not P1). So the projection based on P1 fails, but the projection based on P2 (for resistance) holds.

  The prediction that failed was not the same as the one that held. P1 was used to predict the presence of gene X, and that failed. P2 was used to predict resistance at 48h, and that held.

  So for the seminar, we can say that the two responses are keying on different things:

  - Entrenchment: keys on the operational predicate that has been used and confirmed repeatedly. In the new case, it correctly predicts the operational outcome (resistance at 48h).

  - Naturalness: keys on the theoretical predicate that they believe captures the essence. It incorrectly predicts the presence of gene X.

  The structural feature is that the operational predicate (P2) is multiply realizable: it can be instantiated by different underlying mechanisms. The natural predicate (P1) picks out one mechanism.

  If we remove multiple realizability (i.e., if we assume that only gene X can cause resistance at 48h), then the case degenerates into a verbal dispute because then P1 and P2 would be co-extensive.

  The strongest line of attack for each:

  - Against entrenchment: It led us to a correct prediction about the operational outcome, but it doesn't give us understanding or ability to predict in new circumstances (like resistance to antibiotic B, or at 30°C). It is shallow.

  - Against naturalness: It overreached: it predicted an underlying mechanism that turned out to be absent. It is risky because it makes commitments beyond the observable data.

  Now, we build the table.

  Response | Predicate it licenses projecting | Feature of the case it keys on | Strongest objection available to it
  --- | --- | --- | ---
  Entrenchment | P2 (OD600>0.5 at 48h) | Past projections using P2 have been uniformly successful | It is shallow and does not support counterfactual or cross-condition predictions
  Naturalness | P1 (has gene X) | P1 corresponds to a natural kind (a specific gene) that is part of a causal mechanism | It can be falsified by cases that are observationally identical at the entrenched level but have different underlying causes

  The scenario paragraph:

  In a microbiology laboratory, researchers study antibiotic resistance in E. coli. They have two ways to characterize resistance to antibiotic A: one theoretical, based on possession of a specific gene (gene X) that enzymatically degrades the antibiotic; the other operational, based on an automated reader reporting optical density above 0.5 at 48 hours (OD48+). In 1000 trials at 37°C, every culture exhibiting OD48+ also possessed gene X. When a new culture is tested, both approaches predict OD48+ for antibiotic A. However, they also wish to predict whether this culture, if resistant to A, will be resistant to antibiotic B, which is inactivated only by gene X's enzyme. Projecting the entrenched operational predicate (OD48+) provides no basis for this new prediction, while projecting the natural predicate (gene X) predicts resistance to B. The culture turns out to show OD48+ for A but lacks gene X, instead having an efflux pump mechanism. Thus, the naturalness projection fails for antibiotic B prediction, while entrenchment at least correctly predicted the original operational outcome. The structural feature enabling the divergence is multiple realizability of the operational outcome. Without it, the predicates would be co-extensive and the dispute verbal. The strongest objection to entrenchment is its inability to support novel predictions; to naturalness, its vulnerability to hidden causal complexity.
