prompt: |-
  I keep noticing an asymmetry in arguments about the very long-run future, and I want to know whether it has been picked out and named, or whether I am confusing two things that merely look alike.

  The first place I see it is in discussions of risk. Take an intervention that moves a very small amount of probability — a thousandth of a percent, say — from a future containing an enormous amount of suffering to an otherwise similar future containing an enormous amount of well-being. Describe it as lowering the chance of an astronomically bad outcome, and the sheer size of the stakes is treated as settling the question: any reduction, however small, matters a great deal. Describe the very same intervention as raising the chance of an astronomically good outcome, and the same people reach for the familiar complaints — that this is fanatical, that it is a Pascalian style of argument, that once you allow sufficiently large numbers to do that kind of work you can justify anything. Nothing about the affected population, the numbers involved, or the size of the stakes differs between the two descriptions; only the sign does.

  The second place is in population ethics, where bringing into existence enormous numbers of flourishing beings tends to be treated as, at best, weakly valuable or as nobody's loss if it doesn't happen, while preventing a comparable quantity of suffering is treated as urgent. I don't know whether this is the same phenomenon wearing different clothes or a different one that I have run together with it, and part of what I want is to know which.

  I am not mainly after a label, and a bare name would not settle anything for me. What I want is the carving: whether anything established names this; how it differs from the nearest candidates on each side — the psychological ones about losses and bad news counting more than gains, and the normative ones about suffering having a distinctive weight, or about creating well-being being different in kind from preventing harm; which of them, if any, actually fits; and where the edges lie. In particular I would like to know whether the asymmetry is really about valence or about direction of change: does it survive if the good outcome is recast as averting the loss of happiness that would otherwise have existed? Does it depend on the stakes being astronomical, or does it persist at ordinary scales? Does it apply to a handful of beings in agony as much as to vast numbers in mild discomfort? And is what I have described best read as a claim about how people in fact respond to large numbers, a claim about what there is reason to do, or something that has to be pulled apart into both? If nothing established fits, please say so plainly rather than implying a literature exists, and then name and define it yourself, with the boundary cases marked.

  I have no way to chase down references, so please argue from the distinctions themselves rather than pointing me at things to read. Lead with your bottom line in the first sentence, then give the reasoning, with no preamble and no restatement of my question; and tell me how confident you are in what you claim, singling out the point you are least sure of.
reasoning: |-
  Okay, the user is noticing an asymmetry in how people reason about long-term future outcomes. They've described it in two contexts: risk interventions and population ethics. In risk, reducing a tiny chance of astronomical suffering is seen as crucial, but increasing a tiny chance of astronomical happiness is dismissed as fanatical. In population ethics, preventing suffering is urgent while creating new flourishing lives is seen as weakly valuable or neutral. 

  The user wants to know if this is a recognized phenomenon or if they're conflating separate issues. They're not just after a label—they want a conceptual dissection. Key questions include whether it's about valence (good vs bad) or direction of change (preventing loss vs creating gain), whether it scales differently, and whether it's descriptive or normative.

  Hmm, the core issue seems to be valence asymmetry—negative outcomes weigh heavier than positive ones. This feels distinct from loss aversion, which is about changes relative to a reference point. Here, even when both scenarios involve changes (preventing suffering vs creating wellbeing), the negative one dominates. 

  Important distinctions: In the risk case, preventing suffering is framed as harm reduction (stopping bad things), while creating wellbeing is seen as additive (adding good things). But if we reframe creating wellbeing as preventing the loss of potential happiness, does the asymmetry persist? Probably yes—people still treat suffering as more urgent. 

  Scale matters too. The asymmetry exists at ordinary scales (e.g., preferring to cure a disease over creating new pleasures), but becomes stark with astronomical stakes because the suffering-avoidance side leverages "unbounded bad" arguments (no ceiling on disvalue) while the wellbeing-creation side hits "Pascalian" objections (slippery slope to absurdity). 

  For population ethics, preventing suffering is intuitively a duty, while creating happy beings feels optional. This aligns with "asymmetry in population ethics" literature (e.g., Benatar), though the user notes they can't chase references. 

  Least confident point: Whether reframing wellbeing-creation as preventing happiness-loss would neutralize the asymmetry. I suspect not—people might still see actively creating lives as qualitatively different from saving existing ones, but this needs more thought. 

  Verdict: This is primarily one phenomenon—valence asymmetry amplified by scale—manifesting in two domains. It's both descriptive (how humans think) and normative (how they argue we should think), with the normative claims often leaning on the descriptive intuition.
answer: |-
  The core asymmetry you describe is **valence asymmetry** (negative events dominating positive ones at scale), distinct from loss aversion or normative harm/benefit distinctions, and it manifests consistently across your examples. Below is the conceptual carving:

  1.  **Nature & Name:** This is primarily **valence-dependent discounting at scale**. Negative valence (suffering, bad outcomes) resists discounting even at low probabilities or distant times far more than positive valence (well-being, good outcomes). Established discussions touch aspects (e.g., Parfit's "Absurd Conclusion," Benatar's asymmetry, "Pascalian" risk critiques), but no single term captures this specific *scale-dependent valence asymmetry*. Call it **Astronomical Valence Asymmetry (AVA)** for precision.

  2.  **Valence vs. Direction:**
      *   **Valence Dominates:** The asymmetry hinges fundamentally on whether the outcome involves *suffering* or *well-being*, not merely the direction of change.
      *   **Direction Test:** Recasting "creating well-being" as "preventing the loss of potential happiness" *does not* eliminate the asymmetry. Preventing suffering is still prioritized over preventing the loss of potential happiness. Creating suffering is seen as horrific; *not* creating potential happiness is seen as neutral or mildly regrettable at best. The negative valence of suffering drives the urgency.

  3.  **Scale Dependence:**
      *   **Exacerbated at Scale:** The asymmetry exists at ordinary scales (e.g., prioritizing relieving mild pain over providing mild pleasure for the same number), but becomes stark and qualitatively different with astronomical stakes due to:
          *   **Suffering's Unbounded Badness:** Intuitions suggest extreme suffering has near-infinite disvalue, making even tiny reductions overwhelmingly valuable ("drowning child" logic scaled up).
          *   **Well-Being's Boundedness/Pascalian Fear:** Astronomical well-being lacks a symmetric "infinite value" intuition. High-stakes positive claims trigger fears of fanaticism and error theory ("if any tiny probability of huge good matters, then *any* action could be justified").
      *   **Scope Invariance (Mostly):** The asymmetry applies whether discussing vast numbers in mild discomfort or a handful in agony. Preventing *any* suffering feels more urgent/mandatory than creating comparable well-being. However, the *degree* of asymmetry likely intensifies with both the intensity of suffering and the numbers affected.

  4.  **Distinction from Nearest Candidates:**
      *   **Loss Aversion (Psychological):** Loss aversion involves changes relative to a reference point (losing $100 hurts more than gaining $100 pleases). AVA is different:
          *   It applies to *absolute* states (suffering vs. well-being), not relative changes.
          *   Preventing future suffering (avoiding a future "loss") dominates creating future well-being (a future "gain") – but crucially, *not creating* potential well-being isn't perceived as a "loss" in the same way *allowing* suffering is.
      *   **Harm vs. Benefit (Normative):** Normative theories often distinguish preventing harm (strong duty) from providing benefits (weaker duty). AVA aligns with this *but adds the critical scale dimension and explains the psychological resistance to large-scale positive utilitarianism*. AVA explains *why* the harm/benefit distinction becomes so pronounced and asymmetric at scale, facing different objections (fanaticism vs. urgency).

  5.  **Descriptive vs. Normative:**
      *   **Primarily Descriptive:** AVA is fundamentally a claim about *human psychology and intuition*: how people instinctively weigh suffering vs. well-being, especially under large stakes. The "fanaticism" charge and the unquestioned urgency of suffering reduction are observed responses.
      *   **Normative Leverage:** Proponents of suffering-focused views (e.g., negative utilitarians, antifrustrationists, some longtermists) *use* this descriptive asymmetry normatively. They argue AVA reveals an underlying moral truth – that suffering *is* uniquely urgent and bad. Critics leverage AVA descriptively to argue large-scale positive utilitarianism is psychologically unsustainable or leads to absurdity.

  6.  **Boundary Cases:**
      *   **Neutral Existence:** Does AVA imply non-existence is preferable to a life with net positive well-being? Generally not. AVA concerns *creating new beings* vs. *preventing suffering*. Most holding AVA intuitions accept that an existing happy person's life is good. The asymmetry focuses on the *differential weight* of adding new well-being vs. preventing suffering.
      *   **Minimal Suffering:** If suffering is reduced to near-zero intensity (e.g., trivial, fleeting annoyance), the urgency to prevent it likely diminishes relative to creating significant well-being, though a residual asymmetry favoring prevention may persist.

  **Confidence:** High (90%) that AVA accurately describes the core psychological and argumentative phenomenon you observe. **Least Confident Point (75%):** Whether AVA *fully* explains the population ethics asymmetry *without* needing an additional, distinct "person-affecting" or "non-identity" principle. While AVA is the dominant factor, the "nobody is deprived" argument in population ethics might introduce a *slight* additional layer, though I suspect it's often rationalizing the deeper AVA intuition.
