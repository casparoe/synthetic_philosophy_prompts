  First, let's unpack their core concerns: They want to avoid oversimplifying philosophy while making the project feasible in 8 weeks. Their "drift" concept seems genuinely novel - most literature treats systems as static. The institutional focus (design solutions rather than blame assignment) is pragmatic. 

