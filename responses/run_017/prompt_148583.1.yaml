  **Numbers Summary**  
  - Discount factors: \(\delta_1 = 0.95\), \(\delta_2 = 0.80\), \(\delta_3 = 0.85\).  
  - Utilities:  
    - \(t_0\): A = \(-95.0\), B = \(-88.0\).  
    - \(t_1\): Stick = \(-93.5\), Switch = \(-105.0\).  
  - Decision cost: \(1.50\) utils at \(t_0\).  
  - Final outcome utility: \(-89.5\) (vs. \(-88.0\) without pump).  
  - Exploiter’s gain: $1.50 saved in administrative costs.
