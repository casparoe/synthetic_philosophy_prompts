  Key distinctions they've raised are crucial: factual truth vs commemorative purpose vs reparative obligations. The evidentiary challenge is particularly thorny - when the accused party created the very documents that supposedly exonerate them. That provenance issue feels like it should be a standalone criterion. 

  The asymmetry of error costs strikes me as vital too. Discrediting a true collective memory inflicts new harm on an already victimized community, while preserving a false memory merely perpetuates inaccuracy. The former seems categorically worse. 

  For the commemorative function, the panel isn't writing a history textbook but creating public testimony. What message does the city want to convey today? That might reasonably differ from strict evidentiary findings. 

  Three frameworks emerge: 
  - Record-primacy (default to archives) risks compounding historical injustice when records were weaponized. 
  - Memory-primacy (center marginalized voices) could overlook factual errors. 
  - Commemorative view (focus on present values) might sidestep truth altogether. 

  None fully satisfy all criteria simultaneously. The independence requirement for documents proves most disruptive - it invalidates standard historical methods when power asymmetry exists. 

  My instinct aligns with the user's inclination toward the descendants, but the criteria help ground that in principle: the non-negotiable harm prevention rule and the asymmetry of error costs provide reasoned justification beyond sentiment.
answer: |-
  Here is a specification of desiderata for adjudicating conflicts between collective memory and archival records, structured per your requirements. Each criterion includes its motivation and negotiability status, followed by conflict flags, key exclusions, and scorecards for major approaches.

  ---

  ### **Core Desiderata**  

  1.  **Independence/Provenance Condition (Non-negotiable)**  
      *   **Requirement:** Archival records produced *by the accused party* about contested events cannot independently corroborate their own narrative. Corroboration requires independent sources (e.g., contemporaneous letters, neutral observers, physical evidence).  
      *   **Motivation:** In cases of alleged coercion (e.g., armed removal covered by ex-post paperwork), the accused party has an incentive to fabricate or distort records. This addresses your point #3 directly.  
      *   **Ruled Out:** Assuming official ledgers/ordinances are neutral evidence when the authority they describe is accused of wrongdoing.  

  2.  **Asymmetry of Error Costs (Non-negotiable)**  
      *   **Requirement:** Overriding a true collective memory inflicts greater harm than preserving a false one. The first compounds historical injustice; the second risks factual error but sustains community integrity (point #5).  
      *   **Motivation:** Disregarding survivor/testimonial traditions re-enacts epistemic violence. False negatives (rejecting truth) are morally worse than false positives (accepting falsehood) in contexts of oppression.  

  3.  **Distinct Outputs for Factual/Commemorative/Reparative Domains (Non-negotiable)**  
      *   **Requirement:** Adequacy criteria differ across the panel’s three outputs:  
          *   *Factual Finding:* Prioritizes evidence meeting the Independence Condition (#1).  
          *   *Inscription:* Balances verifiable facts, historical significance, and respect for community meaning (points #1, #4).  
          *   *Reparations:* Focuses on documented harm and continuity of impact, independent of archival "legitimacy."  
      *   **Motivation:** Conflating these (e.g., using reparations to force factual consensus) undermines all three goals (point #1).  

  4.  **Character over Detail (Negotiable: Preference of Memory Camp)**  
      *   **Requirement:** Discrepancies in specific details (dates, numbers) are less critical than conflicts over the fundamental *character* of an event (e.g., voluntary sale vs. coerced expulsion) (point #2).  
      *   **Motivation:** Oral traditions often preserve essential moral truths despite chronological drift; archives may record details accurately while obscuring systemic violence.  

  5.  **Memory as Constitutive Practice (Non-negotiable)**  
      *   **Requirement:** Collective memory is not merely testimony about the past but a practice sustaining community identity. Overriding it attacks communal self-understanding (point #4).  
      *   **Motivation:** For descendants, the "armed removal" narrative may define their relationship to the city and claims for justice. Dismissing it risks symbolic annihilation.  

  6.  **Formal Equality vs. Contextual Sensitivity (Negotiable: Tension Point)**  
      *   **Requirement:** Rules must apply consistently (*formal equality*), but *must* account for power asymmetries in record creation (*contextual sensitivity*).  
      *   **Motivation:** Ignoring power (e.g., treating city ledgers and oral histories as equally reliable) entrenches privilege; abandoning consistency invites arbitrariness.  

  ---

  ### **Irreconcilable Tensions**  
  - **Independence vs. Formal Equality:** Strict independence (#1) invalidates archives created by powerful actors in contested cases, violating formal equality if applied unevenly. Yet ignoring independence (#1) in favor of formal equality empowers dominant narratives.  
  - **Asymmetry (#2) vs. Record-Primacy:** Insisting archives override unverified memory (record-primacy) ignores the asymmetric cost of silencing true survivor accounts.  
  - **Constitutive Memory (#5) vs. Factual Finding:** Factual findings based on archives may delegitimize memory as constitutive practice, causing community harm regardless of "accuracy."  

  ---

  ### **Key Excluding Requirement**  
  **Independence/Provenance (#1)** does the most work in disrupting standard historical methods. It:  
  - Rejects uncritical reliance on state archives in disputes involving state power.  
  - Forces engagement with gaps/silences in records (point #3).  
  - Challenges record-primacy by default.  

  ---

  ### **Scorecard of Approaches**  

  1.  **Record-Primacy (Archive Wins)**  
      - *Strengths:* Clear standard; emphasizes documentary consistency; efficient for factual finding.  
      - *Deficiencies:* Violates Independence (#1) by trusting accused-authored records; ignores Asymmetry (#2) and Constitutive Memory (#5); fails commemorative/reparative needs.  
      - *Output Suitability:* Low for inscription/reparations; moderate for factual finding *if* independence is satisfied (unlikely here).  

  2.  **Memory-Primacy (Community Account Wins)**  
      - *Strengths:* Honors Asymmetry (#2) and Constitutive Memory (#5); centers marginalized voices; suitable for reparative justice.  
      - *Deficiencies:* Risks overriding factual details without corroboration; weak on formal equality; may strain factual finding legitimacy.  
      - *Output Suitability:* High for inscription/reparations; low for factual finding unless corroborated.  

  3.  **Commemorative View (Present Meaning Wins)**  
      - *Strengths:* Focuses on inscription’s purpose (civic values, healing); sidesteps irresolvable evidence disputes; respects Constitutive Memory (#5).  
      - *Deficiencies:* Evades factual/reparative accountability; risks "both-sides" vagueness; ignores Independence (#1).  
      - *Output Suitability:* High for inscription; low for factual finding/reparations.  

  ---

  ### **Testing Your Instinct**  
  Your inclination toward the descendants aligns with:  
  - **Asymmetry (#2):** Erring toward memory prevents compounding harm.  
  - **Independence (#1):** The ledger’s provenance undermines its credibility.  
  - **Constitutive Memory (#5):** Overriding their narrative attacks identity.  
  *If* this preference persists *after* demanding corroboration for the "armed removal" claim (e.g., diaries, archaeology, inconsistent ledger entries), it reflects principled adherence to #1, #2, and #5. If it dissolves without corroboration, it may reflect mood.  

  **Recommendation for Panel:**  
  - **Factual Finding:** State indeterminacy per Independence Condition (#1), noting record provenance and lack of independent verification for either account.  
  - **Inscription:** Use commemorative language acknowledging both the displacement *and* the contested nature of the process (e.g., "residents were removed amid disputed circumstances").  
  - **Reparations:** Recommend redress based on the *impact* of displacement (e.g., lost generational wealth) regardless of 1919’s legal mechanics.  

  This satisfies the desiderata by separating outputs, respecting memory’s weight, and acknowledging archival limits—without requiring an impossible historical verdict.
