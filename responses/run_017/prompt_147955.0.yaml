prompt: |-
  I'm a program officer at a research foundation. We run maybe a dozen review panels a year, each handing out a few million dollars, and the rules are mostly inherited: eight reviewers from the relevant subfield, everyone sees each other's scores before the meeting, we fund whatever a majority puts in the top half. I've been reading about the Condorcet jury theorem and I want to turn whatever in it is actually usable into a procedure my team can run when we set up a panel — not a general essay on collective wisdom.

  What I have in mind: a short ordered checklist covering (a) whether the decision is even the kind of thing the theorem applies to, (b) whether our reviewers are better than chance on this kind of call and how we'd know without a stats department, (c) how badly the independence assumption is being violated and what to do about it — secret pre-votes, withholding scores until after discussion, deliberately mixing subfields — (d) panel size and the point where adding people stops buying anything, (e) when to hand the call to one named person instead of a vote. For each question say what counts as a sufficient answer, where the procedure returns a hard no, and where it has to stop and hand the call to a human because it's a value judgment.

  One thing I'd like built into the middle of it. I've started sorting panel failures into three buckets and I want the procedure to diagnose which one a given panel is headed for: "echo" (everyone anchored on the same first score or the same methodological reflex), "coin-flip" (the case is just hard and reviewers are near chance), and "drift" (errors systematically point one way, e.g. everyone is sceptical of the same kind of method). If that framing is wrong or misses a bucket, say so and fix it. I also suspect there's two different things people lump together as crowd wisdom — averaging scores versus majority on a yes/no — and I want the procedure to be clear about which one it's licensing, and what it says about mixing the two.

  Then run it on three of our real setups: [1] the standard eight-person subfield panel on ordinary proposals; [2] our flagship "transformative" program, where I honestly think reviewers are barely better than a coin flip at picking which weird proposals will pan out — I have a feeling the procedure will tell me something I don't want to hear, that a big panel there is worse than a lottery or a single trusted expert, and I'd rather have it stated plainly than softened; [3] a cross-cutting call where every plausible reviewer comes out of the same methodological tradition with a strong shared view of what counts as rigorous.

  Constraints: reviewers are volunteers with limited time, whatever we do has to be explainable to our board in a paragraph, and I can't ask anyone to estimate probabilities in any formal way. Please also say what the procedure can't tell me — especially for the cases where there's no fact of the matter about which application is "best" and we're really just aggregating preferences.
reasoning: |-
  Okay, the user is a program officer at a research foundation managing grant review panels. They've encountered the Condorcet Jury Theorem and want to implement a practical, step-by-step procedure to improve their panel decisions. Let me unpack their needs.

  First, they need a checklist that's actionable, not theoretical. The main components should assess if Condorcet applies, reviewer competence, independence, panel size, and when to delegate. They also want to diagnose panel failures—echo, coin-flip, drift—and clarify score averaging vs. majority voting. 

  The user mentioned three real cases: standard panels, transformative grants (where reviewers might perform near chance), and cross-cutting calls with homogeneous reviewers. Each scenario tests different parts of the checklist. For transformative grants, Condorcet might not apply since reviewer accuracy could be low, leading to worse decisions than a single expert. Homogeneous panels risk "echo" failures due to lack of independence. 

  Constraints are important: volunteers' time, explainability to the board, no formal probability estimates. The procedure must avoid technical jargon and value judgments. Also, they want to know the limitations, especially when there's no objective best choice.

  I need to structure the checklist clearly. Start with applicability: is it a single correct answer? If not, Condorcet doesn't apply. Then assess reviewer competence. How? Past performance, inter-rater reliability, or calibration exercises. For independence, consider pre-votes, anonymization, or mixing fields. Panel size depends on competence; if p>0.5, larger panels help, but diminishing returns around 7-9 members. Delegation to an expert makes sense when p<0.5 or in homogeneous groups.

  The failure modes: echo (anchoring), coin-flip (low p), drift (systematic bias). The transformative program might fall into coin-flip, meaning a big panel is harmful. Cross-cutting panels risk echo and drift. 

  For the procedures, clarify that Condorcet only supports majority voting on binary decisions, not averaging scores. Mixing both isn't recommended. 

  Finally, the limitations: Condorcet assumes a ground truth, doesn't handle preference aggregation, and can't fix deeply flawed panels. The checklist should flag these cases for human judgment.
answer: |-
  Here's a practical, ordered checklist based on the Condorcet Jury Theorem (CJT) for your review panels, designed for operational use with clear go/no-go points and failure diagnostics:

  **Condorcet Panel Assessment Checklist**

  **Step 1: Applicability Check ("Is CJT Relevant?")**
  *   **Question:** Is there a single, objectively "correct" answer (e.g., "This proposal *will* succeed scientifically" or "This is *truly* transformative") that reviewers are trying to identify, independent of personal taste? Or are we aggregating subjective preferences?
  *   **Sufficient Answer (Yes, CJT applies):** "We seek the objectively best scientific investments based on merit/feasibility/impact, not balancing stakeholder preferences."
  *   **Hard No (Stop - Use different method):** "We are balancing diverse priorities (e.g., geography, topic diversity, career stage) or funding inherently subjective/artistic work." *(Use preference aggregation like scoring averages with caution)*
  *   **Human Judgment Needed:** "It's a mix." → *Flag for discussion: Can we define core objective criteria for a binary vote (e.g., "Meets Minimum Rigor & Relevance") and handle preferences separately?*

  **Step 2: Reviewer Competence ("Better than a Coin Flip?")**
  *   **Question:** Are individual reviewers, *on average*, more likely than not (p > 0.5) to correctly identify the "correct" answer defined in Step 1? How do we know?
  *   **Assessment (No stats dept needed):**
      *   *Past Data:* Track record of funded projects from similar panels succeeding? High correlation of reviewer scores with eventual outcomes (publications, impact)?
      *   *Inter-Rater Reliability (IRR):* Do reviewers consistently rank the *same* top/bottom proposals highly/low *before* discussion? (Calculate simple agreement % on top/bottom quartiles from pre-meeting scores).
      *   *Calibration Exercise:* Occasionally seed panels with a past successful/poor proposal (disguised). Do most reviewers correctly categorize it?
  *   **Sufficient Answer (Yes, p > 0.5):** "Strong IRR on extremes (>60% agreement on top/bottom quartiles pre-discussion)", "Clear track record of funded success", "Positive calibration test."
  *   **Hard No (p ≤ 0.5 probable - CJT harms accuracy):** "Low IRR (<50% agreement on extremes)", "No track record or poor outcomes", "Negative calibration test", "Highly novel/uncertain domain (Step 2B)".
  *   **Human Judgment Needed:** "Mixed signals." → *Consider panel size (Step 4) cautiously or delegate (Step 5).*

  **Step 3: Independence ("Avoiding Groupthink & Bias")**
  *   **Question:** How likely are reviewers to form judgments independently *before the group influences them*? What mitigates shared biases or anchoring?
  *   **Diagnostics & Mitigations:**
      *   **Echo Risk (Anchoring/Dominant Voices):** Pre-disclose scores? Strong initial speaker? Homogeneous background? *→ Mitigate: SECRET PRE-VOTES (essential), anonymize proposals/scores initially, structured discussion (ensure all voices).*
      *   **Drift Risk (Systematic Bias):** All reviewers share methodological/career-stage/institutional bias? Known field blind spots? *→ Mitigate: DELIBERATELY MIX SUBFIELDS/BACKGROUNDS, include "outside" reviewers, frame questions to counter bias.*
      *   **Coin-Flip Risk (Low p):** Covered in Step 2. Independence less critical if p~0.5 (CJT fails anyway).
  *   **Sufficient Answer (Independence Protected):** "Secret pre-votes used & recorded", "Reviewer pool diverse on key axes (methodology, seniority, institution)", "Scores/comments submitted before any discussion."
  *   **Hard No (Independence Severely Compromised):** "Scores/public comments shared before private judgment", "Panel is highly homogeneous with known shared strong bias", "Discussion occurs before initial scoring."
  *   **Human Judgment Needed:** "Moderate homogeneity or uncertainty on bias." → *Implement strongest feasible mitigations (secret pre-votes are minimum).*

  **Step 4: Panel Size ("Diminishing Returns")**
  *   **Question:** Given estimated competence (p) from Step 2, is the panel large enough for CJT benefits, but not wastefully large?
  *   **Guidelines (p > 0.5):**
      *   *p ~ 0.6:* Need 5-7 reviewers for >90% group accuracy. 8 is reasonable.
      *   *p ~ 0.7:* 5 reviewers reach >90%. 7-9 is solid, >10 offers little gain.
      *   *p ~ 0.8:* 3-5 reviewers sufficient. >7 is usually unnecessary.
  *   **Sufficient Answer:** Panel size aligns with guideline above for estimated p. 8 reviewers is often a good default for p~0.6-0.7.
  *   **Hard No (Size Harmful):** p ≤ 0.5 (CJT: Larger groups *less* accurate than individuals!). Panel size >15 offers negligible gain for high p and increases cost/coordination.
  *   **Human Judgment Needed:** p uncertain but likely >0.5. → *Stick with 5-9 as a safe range.*

  **Step 5: Delegation ("When Voting Fails")**
  *   **Question:** Should we override the vote and delegate to a single expert/PO?
  *   **Delegate If:**
      *   Step 1 Hard No (Preference aggregation needed).
      *   Step 2 Hard No (p ≤ 0.5 - CJT invalid).
      *   Step 3 Hard No & mitigations impossible (Severe independence/bias issues).
      *   A known domain expert exists whose *estimated* p is significantly higher than the *estimated* panel average p.
  *   **Sufficient Answer:** "Panel CJT conditions failed (see above)" OR "Specific expert identified with demonstrably superior past judgment in this niche."
  *   **Hard No (Vote is Best):** p > 0.5, independence protected, no single expert clearly superior.
  *   **Human Judgment Needed:** "Expert exists but superiority unclear." → *Use expert as advisor, not decider.*

  **Diagnosing Panel Failure Modes (Pre-Meeting):**
  *   **Echo:** High risk if homogeneous panel (Step 3) + no secret pre-votes.
  *   **Coin-Flip:** High risk if low IRR/past success (Step 2) + high proposal novelty/uncertainty.
  *   **Drift:** High risk if homogeneous panel (Step 3) with known shared methodological/institutional bias.
  *   **Missing Bucket - "Chaos":** Low competence (p<0.5) *plus* conflicting biases (not drift) leading to random, unstable outcomes. Diagnosed by very low IRR + diverse but uncalibrated reviewers.

  **Score Averaging vs. Majority Vote:**
  *   **CJT Only Licenses:** Majority (or supermajority) vote on a **binary choice** ("Fund/Not Fund", "Top Half/Not").
  *   **Averaging Scores:** Aggregates *preferences* or *strength of belief*. CJT says **nothing** about its accuracy for finding "truth." It assumes a binary decision.
  *   **Mixing Them:** Using scores to *create a binary cutoff* (e.g., top half) **is** using a CJT-like majority vote on the *implied binary question*: "Is this above the threshold?". The checklist applies to *that* binary decision. Averaging scores *across multiple criteria* is preference aggregation.

  **Running Your Setups:**

  1.  **Standard 8-Person Subfield Panel:**
      *   *Step 1:* Likely **Yes** (Objective merit).
      *   *Step 2:* **Likely Yes (p>0.5)**. IRR often moderate-high in established fields. Track record exists. *Competence: Estimated p ~0.65.*
      *   *Step 3:* **High Echo/Drift Risk!** Homogeneous subfield. *→ Mitigate: SECRET PRE-VOTES ESSENTIAL. Consider adding 1-2 adjacent-field reviewers.*
      *   *Step 4:* **Sufficient.** 8 is good for p~0.65.
      *   *Step 5:* **No Delegation.** Conditions met with mitigations.
      *   *Failure Diagnosis:* **Echo/Drift** are primary risks. Mitigate with procedure.
      *   **Procedure Output:** GO, but **MANDATE SECRET PRE-VOTES** and consider minor diversification.

  2.  **Flagship "Transformative" Program:**
      *   *Step 1:* **Yes** (Objective: "Will be transformative?"), but definitionally hard.
      *   *Step 2:* **Hard No (p ≤ 0.5 probable).** Novelty makes prediction hard. Low IRR likely. Track record hard to establish. *Competence: Estimated p ~0.45-0.55.*
      *   *Step 3:* Irrelevant if p≤0.5 (CJT fails).
      *   *Step 4:* **Hard No (Size Harmful).** If p<0.5, larger groups are *less* accurate than individuals or small groups. If p=0.5, it's a coin flip regardless.
      *   *Step 5:* **Delegate.** CJT invalid. Lottery is fair but wastes expertise. **Delegate to a small (3-5 person) panel of proven visionaries/adventurous experts** OR a single exceptionally trusted Program Officer with high risk tolerance and a track record in spotting novelty. A big panel is statistically *worse* than these options if p<0.5.
      *   *Failure Diagnosis:* **Coin-Flip** (primary) or **Chaos**.
      *   **Procedure Output:** **HARD NO ON STANDARD VOTE.** Delegate decision authority to a very small, high-expertise group or individual. Do not use a large majority vote.

  3.  **Cross-Cutting Call (Shared Methodological Tradition):**
      *   *Step 1:* **Yes** (Objective merit), but narrow view.
      *   *Step 2:* **Likely Yes (p>0.5 for *their* view of rigor).** High internal consistency.
      *   *Step 3:* **Hard No (Severe Drift Risk).** Homogeneity guarantees shared blind spots/biases. Independence impossible on systemic biases. Mitigations weak.
      *   *Step 4/5:* **Delegate.** CJT technically applies (p>0.5, independent judgments possible *technically*), but the *systematic drift* means the "correct" answer defined *objectively* (best science) might differ from the "correct" answer *by their biased standard*. Majority vote will efficiently find the answer biased by their shared view.
      *   *Failure Diagnosis:* **Drift** (Systematic undervaluing of other approaches).
      *   **Procedure Output:** **HARD NO - Delegate.** Decision authority must go to someone (or small group) charged with applying a broader perspective (e.g., PO, ad-hoc mixed mini-panel, external arbiter). Do not trust the homogeneous majority vote to avoid systematic bias.

  **What the Procedure CAN'T Tell You:**

  1.  **The "Ground Truth":** CJT assumes it exists. It can't tell you *what* is truly best, only if the group is likely to find it.
  2.  **Preference Aggregation:** It doesn't optimize for fairness, diversity, or balancing subjective preferences – only accuracy on a binary truth.
  3.  **Calibrating "p":** It gives guidelines but won't spit out a precise number without data you likely lack.
  4.  **Resolving Genuine Value Conflicts:** When "best" involves competing values (e.g., high-risk/high-reward vs. solid incrementalism), the checklist flags it (Step 1), but resolving it requires human judgment.
  5.  **Optimal Thresholds:** It assumes a binary choice ("Top Half"). Choosing *where* to draw that cutoff isn't addressed by CJT.
  6.  **Fixing a Truly Terrible Panel:** If reviewers lack expertise (p very low) or are deeply conflicted (Chaos), the checklist will say "Delegate" or "No Vote," but assembling a good panel is a prerequisite.

  **Key Implementation Points:**

  *   **Mandate Secret Pre-Votes:** The single most actionable CJT-derived practice.
  *   **Track Simple Metrics:** IRR (agreement % on top/bottom quartiles pre-discussion) is crucial for diagnosing competence (Step 2).
  *   **Board Explanation:** "We use a method based on how groups find correct answers. It requires reviewers to be independently knowledgeable (>50% accurate), judge secretly first, and avoids overly large or biased groups. We adjust based on the type of decision."
  *   **Volunteer Friendly:** Secret pre-votes and focused discussion *save* time vs. meandering debates anchored by early scores. Clear delegation rules prevent gridlock.

  This procedure provides concrete go/no-go gates and failure diagnoses rooted in CJT logic, directly addressing your operational needs and real-world panel scenarios. It highlights the critical weakness of large panels for highly uncertain decisions like your transformative program.
