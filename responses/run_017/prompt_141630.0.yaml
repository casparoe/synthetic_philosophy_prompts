  Agreed Claims (1-6): Both sign.
  1. Shared formalism: The knowability principle (KP) is: ∀p (p → ◊Kp). Knowledge (K) is factive and distributes over conjunction. Possibility (◊) is a normal modality. The Fitch instance: for an unknown truth p, consider q = (p ∧ ¬Kp). Then KP for q leads to contradiction.
  2. Both accept that the Fitch derivation is valid under the shared background.
  3. The live question is what a satisfactory response to the paradox must achieve, not the validity of the derivation.
  4. A satisfactory response must either (i) restrict KP in a principled way that blocks the paradox without ad hocness, or (ii) accept the conclusion that some truths are unknowable.
  5. Merely relabelling the problem (e.g., by stipulating that the problematic instances are not "propositions" or by an ad hoc restriction) is inadequate.
  6. Both accept that the historicized knowability principle (H-KP: ∀p (p → ∃t (t≥now) K_t p)) avoids the original Fitch instance (p ∧ ¬K_now p) because it can be known at a later time. However, the Fitch argument re-emerges with the instance (p ∧ ¬∃t K_t p). If H-KP applies to this, then we get that there exists a time t at which K_t (p ∧ ¬∃t K_t p) holds. This implies that at t, both p is known (so ∃t K_t p) and ¬∃t K_t p, a contradiction. Therefore, H-KP implies that every truth is known at some time, which is absurd.

  Residual Disagreements (7-9): For each, restrictionist first, then realist, and then note on substantive/verbal.

