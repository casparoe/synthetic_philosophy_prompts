  Background: Both accept the Fitch derivation as valid under the shared background. The live question is what a response must achieve.

  Materials to incorporate:
  (a) Distinguish atemporal vs. historicized knowability. The historicized version: for every truth p, there is a time (at or after now) in the actual history at which someone knows p. The hunch is that the original Fitch instance (p & ~Kp) is blocked because it can be known later, but then a new instance (p & ~∃t K_t p) leads to the same problem: if p is a truth never known, then (p & ~∃t K_t p) is true and if knowable (in the historicized sense) implies that at some time it is known, which then leads to a contradiction because at that time we have both that p is known and that it is never known. So the historicized version also leads to the conclusion that every truth is eventually known, which is absurd.

  (b) Use a Π1 arithmetical statement (like Goldbach's conjecture, assumed true but unprovable) that is true but not provable in the system. It is not Moorean (i.e., its content does not preclude being known). The restrictionist (with the Cartesian restriction) would say it is knowable because the truth of such a proposition is compossible with being known (since it doesn't say anything about knowledge). The realist denies it is knowable. We must say what coming to know it would consist in (presumably, a proof in a suitable formal system, but if the system is incomplete, then there is no such proof). The case shows, for the restrictionist, that the knowability principle (restricted) applies to such truths, and for the realist, that such truths are unknowable.

  (c) The principle is for anti-realist semantics (manifestation argument). Test with a recalcitrant sentence, e.g., a subjunctive conditional about an unactualized possibility. The question: does the restricted principle still underwrite the manifestation argument? The realist will say that the restricted principle only secures a platitude (that for some sentences, if true, they are knowable) but not for the recalcitrant ones, so the anti-realist project fails. The restrictionist might argue that the restricted principle is enough for the anti-realist project because the recalcitrant sentences are excluded by the restriction? But note: the Cartesian restriction excludes only propositions that are Moorean (i.e., that assert their own unknowability). The subjunctive conditional does not do that, so it would be included? Then the restrictionist must hold that such conditionals are knowable. The realist denies. So the crux is whether the restricted principle still supports the manifestation argument for such sentences.

