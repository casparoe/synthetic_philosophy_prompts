answer: |-
  ## Project Proposal: Fragile Signals - Population Size and the Mechanisms of Evidential Cooperation

  **Core Research Question:** Does the robustness of evidential cooperation (EC) in large populations depend critically on the underlying mechanism linking an agent's act to expectations about others' acts? Specifically, does cooperation induced by EC decay significantly with population size under "signal" mechanisms (where the agent's act is a noisy indicator of a correlated type) but remain stable under "mirror" mechanisms (where the agent's act is a direct sample from a shared policy), and what are the precise mathematical conditions governing this decay or stability?

  **Refining the Mirror/Signal Distinction (Operationalized):** Within a formal model of evidential decision theory (EDT) applied to a symmetric N-player cooperation game (e.g., generalized Prisoner's Dilemma or Public Goods), we distinguish:

  1.  **Mirror Mechanism:** Agents share a common policy (a mapping from internal states/observations to acts). The agent is uncertain *which* agent index (1 to N) they *are*. Their own choice, `a_i`, is thus a direct sample from the shared policy space. Conditioning on `a_i` provides direct evidence about the policy governing all agents, strongly influencing expectations about others' acts (`a_{-i}`). Population identity is uncertain; policy is fixed but initially unknown.
  2.  **Signal Mechanism:** Agents have fixed identities. Agents possess latent "types" (θ), correlated across the population (e.g., θ ~ Multivariate Normal(μ, Σ), with off-diagonal covariances >0). Each type θ_j stochastically generates an act `a_j` (e.g., P(a_j = Cooperate | θ_j)). The agent knows their identity `i` but is uncertain about their *own* type θ_i and, by correlation, others' types θ_{-i}. Their own choice `a_i` is a noisy signal about θ_i. Conditioning on `a_i` provides evidence about θ_i, which then (via correlation) updates beliefs about θ_{-i}, and thus about `a_{-i}`. Population identity is known; type is uncertain and correlated.

  The distinction hinges on *what the agent is fundamentally uncertain about* (their identity vs. their type) and consequently *what their act directly reveals* (the shared policy vs. their own latent type).

  **The Gap in the Literature:** The debate surrounding EC's cooperative potential suffers from a conflation of mechanisms and a neglect of population scaling.

  1.  **Pro-EC Arguments:** Typically rely on highly constrained scenarios: two-agent cases (N=2) or cases of perfect correlation (effectively N=1). In these, the distinction between mirror and signal collapses or is negligible, and robust cooperation emerges. Sympathetic models often implicitly assume mirror-like dynamics (copies, identical algorithms) without generalizing to larger N or introducing type uncertainty. Arguments based on "rational imitation" or "acausal bargaining" often presuppose mirroring.
  2.  **Anti-EC Arguments:** Primarily target the permissibility of self-conditioning *in principle*, arguing it leads to spurious counterfactual reasoning or is inherently irrational (e.g., "Why ain'cha rich?"). Others target EDT's failure in Newcomb-like problems irrespective of population size. These critiques often dismiss EC cooperation wholesale or focus on the small-world case, failing to engage with the specific *mechanism-dependent fragility* hypothesis in large worlds. Critiques based on *actual* causal impotence in large populations (e.g., voting) presuppose the signal mechanism but lack a formal model of how EC updating functions within it.

  Neither side adequately addresses the *interaction* between the mechanism of correlation, the size of the interacting population (N), the strength of type correlation (ρ), and the observability of deliberation, which is crucial for real-world applications like voting, collective action, or multi-agent AI alignment.

  **Methodology: A Minimal Formal Model (Month-by-Month Plan)**

  *   **Months 1-2: Model Specification & Baseline Analysis (N=2)**
      *   Define the core symmetric N-player cooperation game (payoffs for mutual cooperation/defection, etc.).
      *   Formalize the Bayesian updating for both Mirror and Signal mechanisms within an EDT framework.
          *   *Mirror:* Prior over possible shared policies (Π). P(a_{-i} | a_i) = ∫ P(a_{-i} | π) dP(π | a_i).
          *   *Signal:* Prior over joint type distribution (Θ). P(a_{-i} | a_i) = ∫ P(a_{-i} | θ_{-i}) dP(θ_{-i} | θ_i) dP(θ_i | a_i). Key parameters: N (population size), ρ (correlation strength between types), σ (noise in act given type - P(a_i | θ_i)).
      *   Introduce "deliberation observability": Agent observes partial evidence (D) about their upcoming act *before* committing. Model this as observing a noisy signal about θ_i (Signal) or the policy sample (Mirror). Parameter: γ (informativeness of D).
      *   Calculate the expected utility of Cooperation (C) vs. Defection (D) under both mechanisms for N=2, verifying known results and establishing baselines.

  *   **Months 3-4: Scaling Analysis - Varying N**
      *   Analyze the evolution of the expected utility difference EU(C) - EU(D) as N increases (N >> 2) under both mechanisms.
      *   *Key Hypothesis Test (Signal):* Does |EU(C) - EU(D)| under Signal decay towards 0 as N → ∞, holding ρ and σ constant? Does the *critical ρ* needed to sustain cooperation (EU(C) > EU(D)) increase with N? Formalize the rate of decay (e.g., O(1/N), O(1/√N)).
      *   *Key Hypothesis Test (Mirror):* Does |EU(C) - EU(D)| under Mirror remain bounded away from 0 as N increases? Is it largely independent of N?
      *   Method: Analytical derivation of updating expressions and EU calculations where possible; precise numerical computation for specific distributions (e.g., Gaussian types, binary types/acts) otherwise.

  *   **Months 5-6: The Role of Deliberation (Varying γ)**
      *   Investigate how observing deliberation (D) impacts cooperation incentives, especially in the Signal case for large N.
      *   Hypothesis: Observing highly informative D (high γ) *before* acting can "freeze" the type estimate early, potentially mitigating or altering the decay effect compared to conditioning only on the final act. Does early strong evidence about θ_i reduce the *marginal* evidential impact of the final `a_i` itself in large populations?
      *   Analyze the interaction between γ, N, ρ, and σ.

  *   **Months 7-8: Robustness & Extensions**
      *   Test sensitivity to distributional assumptions (e.g., Gaussian vs. discrete types).
      *   Explore mild asymmetries (e.g., varying correlation strengths).
      *   Consider simple dynamics (e.g., repeated observation/updating during deliberation).
      *   Formalize the argument for why voting/climate/AI scenarios map more naturally to the Signal mechanism (known identity, large N, uncertain correlated "types" like altruism/competence, noisy acts).

  *   **Month 9: Synthesis, Writing, and Publication Planning**
      *   Integrate results into a coherent narrative.
      *   Draft core journal article.
      *   Outline implications for EDT, cooperative game theory, and practical reasoning in large-scale coordination problems.

  **Defense of the Model:** This minimal analytical model is chosen over alternatives for compelling reasons:

  1.  **Pure Informality:** While valuable for intuition, it cannot resolve the quantitative question of decay rates or precisely define the mechanisms. It risks talking past existing formal results.
  2.  **Complex Simulation:** Building a high-fidelity simulation of agent deliberation and interaction is computationally intensive, risks obscuring core mechanisms with implementation details, and makes general results harder to derive and interpret. Our analytical approach directly targets the causal relationships (N, ρ, γ) → EU difference.
  3.  **Overly Abstract Decision Theory:** Ignoring the specific structure of cooperation games and population uncertainty would miss the core phenomenon. Our model is tailored to isolate the interaction of interest while remaining formally tractable.
  4.  **Tractability vs. Generality:** The model sacrifices some generality (e.g., assuming symmetric priors/correlations) to achieve analytical clarity on the primary hypothesis. The robustness checks (Months 7-8) ensure core insights aren't artifacts of simplifications.

  **Range of Possible Conclusions & Deciding Factors:**

  1.  **Strong Confirmation:** Cooperation under Signal decays significantly with N (e.g., EU(C)-EU(D) ~ 1/N), while Mirror cooperation is stable. Decay rate depends inversely on ρ and σ; strong early deliberation (high γ) mitigates decay. *Deciding Factors:* Mathematical derivation showing decay in Signal EU difference; stability proof for Mirror; quantitative dependence on ρ, σ, γ.
  2.  **Qualitative Confirmation, Nuanced Quantification:** Cooperation decays under Signal but slower/faster than 1/N; Mirror is mostly stable but shows minor N-effects under specific priors. *Deciding Factors:* Precise asymptotic analysis; sensitivity results.
  3.  **Partial Refutation:** Cooperation decays under Signal only under specific conditions (e.g., very low ρ); Mirror stability holds. Or, deliberation observability fundamentally alters the large-N dynamics in unexpected ways. *Deciding Factors:* Discovery of parameter regions where Signal cooperation persists; complex interaction effects involving γ dominating N effects.
  4.  **Strong Refutation:** No significant decay under Signal in the relevant parameter range; Mirror shows unexpected fragility; the mechanisms cannot be cleanly separated in the model. *Deciding Factors:* Mathematical proof or numerical results showing Signal EU difference bounded away from zero for large N; instability discovered in Mirror case.

  **Defining Success, Failure, and Feasibility:**

  *   **Core Success:** A mathematically precise characterization of how `N`, `ρ`, `σ`, and `γ` influence the incentive for cooperation under EDT, rigorously differentiating the Mirror and Signal mechanisms. Demonstrating clear decay under Signal in large N would be a significant success.
  *   **Valuable Success (even if nuanced):** Identifying boundary conditions (e.g., critical ρ(N)), characterizing the functional form of decay, or discovering a crucial role for deliberation observability, even if the initial hypothesis is only partially confirmed.
  *   **Project Failure:** Inability to formulate a tractable model cleanly separating the mechanisms. Mathematical results showing *no* meaningful difference between mechanisms in their N-sensitivity, or showing *no* decay under Signal in realistic large-N scenarios. Results proving technically trivial or reiterating well-understood small-N dynamics.
  *   **Risks of Scope Creep / 9-Month Limit:** The project stays feasible by rigorously adhering to the minimal model:
      *   *Danger:* Adding complex learning, strategic updating, or heterogeneous priors. *Mitigation:* Focus on static, one-shot decision with symmetric priors.
      *   *Danger:* Pursuing highly complex distributions or dynamics that preclude analytical results. *Mitigation:* Start simple (Gaussian/binary); complex numerical work only if essential and time-permitting in Months 7-8.
      *   *Danger:* Expanding the scope to include causal decision theory comparisons or full-scale simulations. *Mitigation:* Strictly focus on EDT dynamics within the proposed mechanisms. Simulations only for targeted numerical checks of analytical predictions.
      *   *Feasibility Anchor:* The core scaling analysis (Months 3-4) is the critical, tractable centerpiece. Success hinges on completing this robustly within the first half of the fellowship.

  This project addresses a theoretically significant gap in understanding evidential cooperation by rigorously modeling the interaction between population size, the mechanism of correlation, and deliberation. By precisely defining and separating Mirror and Signal cooperation, it promises to clarify the scope and limitations of EDT's cooperative potential in the large-world scenarios that matter most.
