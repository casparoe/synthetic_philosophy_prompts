prompt: |-
  I am a professor of philosophy, and in one of my courses I teach the theory of costly signaling — Zahavi's handicap principle, Grafen's formalization of honest signaling, and Spence's job-market model — alongside the observation that a signal can be expensive in absolute terms and still carry no information, because what makes a signal honest is not that it costs something but that it costs one kind of sender less than another. The reason I want to press on this now is not pedagogical. For the past three years I have chaired our university's Committee on External Partnerships, a body of seven people (four of them non-academics from finance, legal and development) that meets eight to ten times a year and reviews proposals from companies, donors, foundations and professional bodies who want something from us: a joint research centre, a named building, our endorsement of a sector code, our signature on a collective pledge. Almost every one of these proposals now contains a commitment offered as evidence of the proposer's own good faith — a publication-rights clause, a data-deposit promise, a divestment or procurement pledge, a named officer who will be accountable. Our terms of reference speak about reputational risk and mission alignment, but what we actually spend our meetings doing is deciding which of these commitments bind anybody once we have signed, and which are cheap talk. We have about forty minutes per proposal, our recommendations go to the provost and are occasionally reversed, and I would like a written procedure rather than my own intuitions, both so that we are consistent from year to year and so that a refusal can be justified without appearing to be a judgment about the character of the people in the room.

  What I want from you is a decision procedure my committee could actually run: the questions, in order; what would count as a sufficient answer to each; where the procedure stops and returns a no; and where it has to hand the decision to a person because the issue is one of values rather than evidence. It has to be honest about the fact that we can almost never observe the proposer's real costs and will usually have to estimate them from proxies, and it should say what to do when even an estimate is unavailable. Two structural features of our cases seem to me to break the textbook logic and I want the procedure to handle them explicitly. The first I have started calling the wrong-pocket problem: the party who pays the cost of the signal is very often not the party who captures the benefit of our response — a subsidiary signs, the parent pays; a current vice-president pledges, a successor inherits the cost; a consortium's director signs, the individual members bear nothing. The second is that most of the costs offered to us are reversible or uptake-contingent: they are incurred only if we respond favourably, or they can be recovered, renegotiated or quietly lapsed, or they are purely reputational and depend on an audience that may not exist, or may not be the audience the pledge is really addressed to — a pledge calibrated for regulators or shareholders is read by us as though it were addressed to us. A third, smaller worry: because these pledges circulate, a commitment that was informative when two organizations made it becomes an entry fee once everyone makes it, so I would like the procedure to say something about whether a signal's informativeness can be read off the current baseline in its sector or only off the proposer's situation. If you think one of my three worries is not really a failure mode of the handicap logic but a case of me applying the theory too crudely, say so in the procedure rather than indulging it.

  To make this concrete, please apply the finished procedure to three proposals drawn closely from our actual docket. (1) A software company proposes a jointly funded research lab and offers, as its commitment, that it will publish every government request for user data it receives in an annual transparency report, that a named officer will be accountable for the report's completeness, and that the report's continued publication is written into the agreement as a condition of the university's own continued participation. (2) A long-serving trustee offers a very large gift to endow an archive of dissident and samizdat literature, on condition that the building be renamed for his family and that the university run a permanent public lecture series on freedom of expression; the development office regards the gift as transformational, and the gift itself is offered — implicitly, in conversation, and loudly by our own vice-chancellor — as a demonstration of the donor's and the university's shared commitment to free expression. (3) An industry consortium asks us to co-sign a sector-wide commitment to responsible procurement, signed by the consortium's director, with no obligation that attaches to any individual member, no audit or reporting mechanism, and a clause providing that the commitment lapses if fewer than ten other institutions sign within eighteen months. Run the procedure on each in the order you have specified, showing your work at each step, and mark clearly the points at which the procedure runs out and a human has to decide on the basis of what we care about. Then tell me plainly what the procedure cannot do: which questions about a proposer it is structurally unable to answer even with unlimited information, and which of our disagreements it will simply re-describe rather than settle. Conclude with a single machine-readable line in exactly this form: \answer{Case 1: X, Case 2: X, Case 3: X}, where each X is one of CREDIBLE, NOT CREDIBLE, or UNDECIDED BY THE PROCEDURE.
reasoning: |-
  We are designing a decision procedure based on costly signaling theory to evaluate commitments in partnership proposals. The core idea is that a signal is credible (honest) if it is differentially costly: it must cost less for a "good type" proposer (one aligned with the university's interests) than for a "bad type". We must account for three complications: 
  1. Wrong-pocket problem: The party paying the cost may not be the one benefiting, so we need to check if the cost-bearer has an incentive to align with the signal.
  2. Reversibility/contingency: Costs that are reversible or contingent on the university's response (or other factors) may not be incurred and thus not be a true cost.
  3. Baseline drift: A signal that was once informative may become cheap if everyone adopts it.

  The procedure must work with limited information and proxies for costs. It should be a sequence of questions, with clear stopping points for a "no" or for a human judgment call.

  **Decision Procedure: Evaluating Commitment Credibility**

  **Step 1: Identify the Signal**
  - What specific commitment is being offered as a signal of good faith? (e.g., publishing transparency reports, endowment with conditions, signing a sector pledge)
  - If there are multiple commitments, treat each independently? Or as a bundle? For simplicity, we treat the main one. But note: multiple signals can interact.
  - *Output for this step*: A clear statement of the signal.

  **Step 2: What is the Cost?**
  - What are the direct and indirect costs of the signal to the proposer? 
    - Direct: financial, operational, opportunity costs.
    - Indirect: reputational, strategic, risks.
  - How is the cost estimated? Use proxies if necessary (e.g., industry benchmarks, similar cases, expert opinion).
  - If no estimate is available, mark as "cost unknown" and proceed to Step 3 with caution.

  **Step 3: Who Bears the Cost? (Wrong-pocket problem)**
  - Identify the entity that actually incurs the cost. Is it the same as the proposer? If not, is there a mechanism that aligns the interests of the cost-bearer with the signal? 
    - E.g., if a subsidiary signs but the parent pays, does the parent have an incentive to ensure the subsidiary follows through? Or is the cost-bearer insulated from the benefits of the partnership?
  - If the cost-bearer is not aligned (i.e., they do not gain from the partnership or suffer if the signal fails), then the signal is not credible (stop: NOT CREDIBLE). 
  - If aligned, proceed.

  **Step 4: Is the Cost Sunk or Contingent? (Reversibility)**
  - Is the cost incurred regardless of the university's response? (If yes, it's sunk and credible.) 
  - If contingent on the university's response (e.g., only if we sign) or on other events (e.g., enough other signatories), then:
    - The cost is not sunk and the signal may be cheap. We must check if the contingency is likely to be met and if the cost is then truly incurred and non-recoverable.
    - If the contingency is under the proposer's control (e.g., they can easily avoid it) then NOT CREDIBLE.
    - If the contingency is outside the proposer's control and likely to occur, then the cost might be incurred. But if the cost can be recovered, renegotiated, or lapsed without penalty, then NOT CREDIBLE.
    - If the cost is reputational, we must assess if there is an audience that will monitor and penalize non-compliance. If the audience is not the university (e.g., it's for regulators) and the university cannot effectively monitor, then the reputational cost to the proposer in the eyes of the university may be low -> NOT CREDIBLE.

  **Step 5: Differential Cost (The Core Handicap)**
  - We must assess if the cost is lower for a "good type" (aligned with the university) than for a "bad type". This is the heart of the handicap principle.
  - We need to compare the cost to two hypothetical types: 
    - Type G: a proposer who is truly aligned (so the signal is truthful).
    - Type B: a proposer who is not aligned (so the signal is false).
  - The signal is credible only if: 
    - Cost to Type B > Benefit to Type B of a favorable response (from the university) 
    - Cost to Type G < Benefit to Type G of a favorable response.
  - But we cannot observe types. So we use proxies:
    - How does the cost relate to the proposer's characteristics? (e.g., a company with strong privacy practices may find it cheaper to publish transparency reports than one with weak practices.)
    - What is the baseline in the sector? If the commitment is common (baseline), then it may be cheap for both types -> NOT CREDIBLE. If it is rare, then it might be more credible.
    - However, if the commitment is common because it is required by regulation or industry standard, then it might not be a signal at all (and thus not informative). But if it is voluntary and still common, then it's cheap talk.
  - If we cannot estimate differential cost (due to lack of information), then we must mark as UNDECIDED and move to human judgment (Step 6).

  **Step 6: Human Judgment (Values and Mission Alignment)**
  - If the procedure reaches this step, it means the commitment is either NOT CREDIBLE by the above steps, or the credibility is undecidable. Then we must decide based on:
    - Reputational risk: Even if the commitment is not credible, are there other reasons to accept the proposal? (e.g., the partnership has high value, and we can monitor independently.)
    - Mission alignment: Does the proposal align with the university's mission, regardless of the signal?
    - This step is not about the signal but about the overall proposal and the university's values.

  **Procedure Summary:**
  1. Identify the signal.
  2. Estimate the cost (using proxies if needed; if impossible, note and proceed).
  3. Check cost-bearer alignment (wrong-pocket): if not aligned, return NOT CREDIBLE.
  4. Check reversibility/contingency: if the cost is avoidable or recoverable, return NOT CREDIBLE.
  5. Assess differential cost: 
     - If the commitment is common in the sector (baseline) and not required by regulation, then it may be cheap for both types -> NOT CREDIBLE.
     - If we can infer that the cost is higher for a bad type (using proxies), then CREDIBLE.
     - If we cannot determine differential cost, then UNDECIDED BY THE PROCEDURE (go to Step 6 for human judgment).
  6. Human judgment: for proposals that are NOT CREDIBLE or UNDECIDED, the committee must decide based on mission alignment and reputational risk, independent of the signal.

  **Applying the Procedure to the Three Cases**

  **Case 1: Software Company's Research Lab Proposal**
  - *Signal*: Commitment to publish every government request for user data in an annual transparency report, with a named officer accountable, and the report's continued publication as a condition for the university's continued participation.
  - *Step 2: Cost*: 
    - Direct: Operational cost of compiling and publishing the report. Reputational risk if they receive many requests (might look bad) or if they don't publish (criticism). Also, potential loss of government cooperation? 
    - Proxies: Similar reports by other companies (e.g., Google Transparency Report) suggest moderate cost. But for a company that gets many requests, it might be higher. 
    - Estimate: Moderate cost. Known in the industry.
  - *Step 3: Who Bears the Cost?* 
    - The software company (the proposer) bears the cost. The named officer is from the company. The subsidiary is the one signing? But the proposal is from the company itself. Assuming it's the same entity. 
    - Alignment: The company benefits from the partnership (research lab) and would lose if the university withdraws. So aligned. Proceed.
  - *Step 4: Reversibility*: 
    - The cost is incurred annually. The condition ties the university's continued participation to the report. However, the cost is incurred only if the partnership continues. But note: the report is required by the agreement. If they stop, the university can leave. 
    - But the cost is not sunk until after the partnership starts. However, once started, they must publish or risk the university leaving. 
    - Also, the cost is not recoverable: once published, it's public. 
    - Contingency: The report is required as long as the partnership exists. The cost is incurred each year. 
    - Reputational cost: The audience is the public and the university. The university can monitor. 
    - Verdict: The cost is non-recoverable and monitored. So credible on reversibility. 
  - *Step 5: Differential Cost*:
    - What is the baseline? Many tech companies publish transparency reports. It's becoming common. Is this a sector norm? If so, it might be cheap for both types. 
    - However, for a company that has a lot of user data requests (perhaps because they cooperate with governments) the report might reveal something negative (high number of requests) which is costly. For a company that doesn't get many requests, it's cheap. 
    - But note: the company's type is about their alignment with the university's values (e.g., transparency, privacy). 
      - Type G (privacy-respecting) might have fewer requests and less to hide -> lower cost (and benefit of partnership is high). 
      - Type B (cozy with governments, many requests) might face higher reputational cost from revealing the numbers and might even lose government trust if they publish -> higher cost. 
    - But the benefit of the partnership (research lab) is the same for both? 
      - Actually, Type B might value the partnership less if they are more focused on government contracts? Not necessarily. 
    - We must check: 
      - Cost to Type B: High (reputational damage, loss of government trust). 
      - Benefit to Type B: Access to university research, talent, and reputation. 
      - If cost > benefit for Type B, then they wouldn't send the signal. But if benefit is high enough, they might. 
      - However, since the report is tied to the partnership, if Type B doesn't want to publish, they might not propose in the first place. 
    - Given that the baseline is common, we might worry that even Type B can do it cheaply. But note: the named officer and the condition of university participation add extra cost. 
    - Given the complexity and common baseline, we might mark as UNDECIDED? But let's see: 
      - The condition of university participation means that if they stop publishing, the university leaves. That imposes a cost on the company (loss of partnership). So for Type B, if they are forced to publish and it hurts them, they might avoid the partnership? But they are the ones proposing. 
      - Alternatively, if they are Type B, they might hope to renegotiate later? 
    - Given the uncertainties and the common baseline, we cannot be sure of differential cost. 
    - *Verdict for Step 5*: UNDECIDED (due to common baseline and uncertainty about the company's type). 
  - *Procedure Outcome*: Step 5 returns UNDECIDED. So we go to Step 6 for human judgment.

  **Case 2: Trustee's Gift for Archive and Lecture Series**
  - *Signal*: The gift itself is offered as a signal of shared commitment to free expression. But note: the gift comes with conditions (renaming the building and running a lecture series). The conditions are the commitment? Or the gift? 
    - Actually, the signal is the gift (with conditions) which is meant to demonstrate the donor's commitment. But the conditions are obligations on the university, not the donor. 
    - The donor's commitment is the gift. But the gift is a one-time act. The donor is not committing to anything ongoing. 
    - However, the donor is a long-serving trustee, so his reputation is at stake. 
    - We must reframe: the signal is the act of giving a large, transformational gift with the stated purpose of promoting free expression. 
  - *Step 2: Cost*: 
    - The gift is large (transformational). The cost to the donor is the money given. 
    - Proxies: We know the amount. The cost is high in absolute terms. 
  - *Step 3: Who Bears the Cost?* 
    - The donor (trustee) bears the cost. He is the proposer. 
    - Alignment: The donor benefits from the renaming (legacy) and from the association with the university. If the university's reputation on free expression is enhanced, so is his. 
    - But note: the donor is a long-serving trustee, so he already has a stake in the university. 
    - The cost-bearer (donor) is aligned because he is the one who will benefit from the partnership (the named building, the lecture series, and the enhanced reputation). 
  - *Step 4: Reversibility*: 
    - The gift is given. It is sunk. The donor cannot take it back. 
    - The conditions (renaming and lecture series) are obligations on the university, not on the donor. The donor has no further obligation. 
    - So the donor's cost is sunk and non-recoverable. 
  - *Step 5: Differential Cost*:
    - What is the baseline? Large gifts are common for universities, but each is unique. 
    - The gift is for a specific cause (free expression). 
    - For a donor who truly values free expression (Type G), the cost is offset by the benefit of promoting the cause. 
    - For a donor who does not value free expression (Type B), the cost is not offset by the cause, so they would only give if they get other benefits (like legacy) that outweigh the cost. 
    - But the legacy benefit is available to both types. The question is: would Type B be willing to pay the same amount for the legacy without caring about free expression? 
    - If the legacy benefit is high enough, then Type B might also give. So the cost is the same for both? 
    - However, Type G might be willing to give more because they value the cause. But the amount is fixed. 
    - Alternatively, we can think: the cost of giving a large gift is high for everyone, but the net cost (after subtracting the legacy benefit) might be lower for Type G because they also get the benefit of promoting the cause. 
    - But we don't have a way to measure the net cost. 
    - Another angle: the donor is a long-serving trustee. This might be a repeated game. If he gives and then the university fails on free expression, his reputation might suffer. So he has an incentive to be truthful. 
    - But without clear differential cost, we must consider baseline: transformational gifts are rare, so the signal is not cheap. 
    - *Verdict for Step 5*: The absolute cost is high and rare, and the donor's history (trustee) might suggest alignment. But we cannot rigorously show differential cost. However, the rarity and the sunk cost make it credible. 
    - But note: the problem says the gift is offered as a signal of shared commitment. The donor is signaling his own commitment. The cost is high and sunk. Even if the legacy benefit is high, the fact that he tied the gift to free expression (and not just any building) might be the signal. 
    - We can consider: a donor who doesn't care about free expression might have given the same amount for a different purpose? But he chose this purpose. 
    - So: the signal is the choice of purpose. The cost of the gift is the same regardless, but the choice of purpose might have a differential cost? 
      - For Type G (truly committed to free expression), choosing this purpose is natural and costless (in terms of the gift). 
      - For Type B (not committed), choosing this purpose might be costly because they don't care and might have preferred another purpose. 
      - But the donor is getting the legacy in any case. So the cost of choosing this purpose is the opportunity cost of not choosing another. 
      - If Type B has a different preferred purpose, then choosing free expression imposes an extra cost (of not having their preferred purpose). 
      - But we don't know the donor's preferences. 
    - Given the information, we might say: the gift amount is a credible signal because it is high and sunk, and the purpose choice is also a signal that might have differential cost. But without knowing the donor's alternatives, we cannot be sure. 
    - However, the procedure requires a decision. Given the high absolute cost and the rarity, we can consider it credible. But let's be cautious: 
      - Step 5: We don't have clear evidence of differential cost. But the baseline of such large gifts is low (rare) so it hasn't become cheap. 
      - We might mark as CREDIBLE because the cost is high and sunk, and the donor is putting his reputation on the line. 
  - *Procedure Outcome*: CREDIBLE.

  **Case 3: Industry Consortium's Responsible Procurement Pledge**
  - *Signal*: The consortium's director signs a sector-wide commitment to responsible procurement, but no obligation attaches to individual members, no audit, and the commitment lapses if fewer than ten institutions sign within 18 months.
  - *Step 2: Cost*: 
    - Direct: If they comply, they might have higher procurement costs. But without audit, the cost of non-compliance is low. 
    - Reputational cost only if they are caught not complying? But no monitoring. 
    - The cost is very low because there are no enforcement mechanisms. 
    - Estimate: Low cost.
  - *Step 3: Who Bears the Cost?* 
    - The commitment is by the consortium, but the individual members are not bound. The cost of compliance (if any) would be borne by the members, but they haven't committed. The consortium director doesn't bear the cost. 
    - The cost-bearer (the members) are not the ones who benefit from the university's co-signature? The consortium benefits (reputation) but the members might not change their practices. 
    - Alignment: The members have no obligation, so they can free-ride. The cost-bearers (if any) are not aligned with the signal. 
    - *Verdict*: Wrong-pocket problem -> NOT CREDIBLE. Stop here.

  **Summary of Outcomes:**
  - Case 1: UNDECIDED BY THE PROCEDURE (go to human judgment)
  - Case 2: CREDIBLE
  - Case 3: NOT CREDIBLE

  **What the Procedure Cannot Do:**
  - It cannot directly observe the proposer's type or the true differential cost. We must rely on proxies and estimates.
  - It cannot resolve disagreements about the university's values and mission alignment (Step 6 is subjective).
  - It cannot account for dynamic changes (e.g., a signal that is credible today might become cheap tomorrow).
  - It cannot fully handle cases where the cost is non-monetary and hard to estimate (e.g., reputational costs).
  - It re-describes disagreements about the cost estimates or the alignment of cost-bearers rather than settles them with certainty.

  **Final Machine-Readable Line:**
  \answer{Case 1: UNDECIDED BY THE PROCEDURE, Case 2: CREDIBLE, Case 3: NOT CREDIBLE}
answer: |-
  Below is a decision procedure for your committee, designed around costly signaling theory (Zahavi, Grafen, Spence) and tailored to address your three structural concerns: the wrong-pocket problem, reversibility/contingency, and baseline drift. The procedure is structured as a flowchart of questions, with clear stopping points. It prioritizes efficiency (for 40-minute reviews) and consistency, using proxies for costs when direct observation is impossible. It explicitly flags when human judgment is required for value-based decisions.

  ---

  ### **Decision Procedure for Evaluating Commitment Credibility**

  **Principles**  
  - A signal is credible only if it imposes a **differential cost**: it must cost a "good-faith" proposer (aligned with university interests) less than a "bad-faith" proposer.  
  - **Proxies for cost** (e.g., industry benchmarks, historical data, contractual terms) are used when direct costs are unobservable. If proxies are unavailable, default to "insufficient data."  
  - **Stopping rules**: Return "NOT CREDIBLE" if the procedure fails Steps 3–5. Return "UNDECIDED" if differential cost cannot be assessed (Step 5). Human judgment (Step 6) handles mission alignment when signaling logic is exhausted.  

  **Procedure**  
  1. **Identify the signal**  
     - *Question*: What specific commitment is offered as evidence of good faith? (e.g., financial pledge, transparency report, named officer).  
     - *Sufficient answer*: A discrete, measurable action (not vague promises). If multiple signals, evaluate each separately.  
     - *Stop if*: No clear signal → NOT CREDIBLE.  

  2. **Estimate base cost**  
     - *Question*: What is the absolute cost of the signal to the proposer? Include direct (financial, operational) and indirect (reputational, opportunity) costs.  
     - *Sufficient answer*: Quantitative estimate (e.g., "publishing transparency reports costs $X based on industry averages") or qualitative proxy (e.g., "high" if precedent shows significant resource drain).  
     - *Stop if*: Cost is near-zero → NOT CREDIBLE.  
     - *If cost unestimatable*: Proceed but flag uncertainty.  

  3. **Resolve wrong-pocket problem**  
     - *Question*: Is the entity bearing the cost the same as the entity benefiting from the partnership? If not, is the cost-bearer incentivized to uphold the signal?  
     - *Sufficient answer*:  
       - If cost-bearer ≠ beneficiary (e.g., subsidiary vs. parent), show alignment via:  
         - Contractual obligations (e.g., parent guarantees subsidiary's commitment).  
         - Shared reputation (e.g., parent brand damaged if subsidiary defects).  
       - If no alignment → NOT CREDIBLE.  
     - *Stop if*: Misaligned incentives (e.g., cost-bearer insulated from partnership fallout) → NOT CREDIBLE.  

  4. **Assess reversibility/contingency**  
     - *Question*: Is the cost sunk (irreversible) or contingent on external factors (e.g., university’s response, third-party actions)?  
     - *Sufficient answer*:  
       - Sunk cost: Paid upfront, non-recoverable (e.g., building donation).  
       - Contingent cost: Only incurred if conditions met (e.g., "we publish reports only if partnership proceeds").  
     - *Stop if*:  
       - Cost is contingent AND avoidable via proposer’s actions (e.g., renegotiation clause) → NOT CREDIBLE.  
       - Cost is reputational AND no monitoring audience exists (e.g., pledge addressed to regulators, not university) → NOT CREDIBLE.  

  5. **Evaluate differential cost (core handicap)**  
     - *Question*: Would this signal cost a "bad-faith" proposer more than a "good-faith" one, given current sector baselines?  
     - *Sufficient answer*:  
       - Compare to sector norms: If the signal is rare (e.g., <30% adoption in sector), it may be credible; if ubiquitous (e.g., >70%), it is likely cheap talk.  
       - Assess cost asymmetry: Use proxies (e.g., a privacy-focused company has lower cost to publish transparency reports than a surveillance-heavy one).  
     - *Stop if*:  
       - Signal is ubiquitous AND not legally mandated → NOT CREDIBLE (baseline drift).  
       - Differential cost indeterminable (e.g., no sector data) → UNDECIDED.  

  6. **Human judgment (mission/values)**  
     - *Invoke if*: Signal is UNDECIDED or NOT CREDIBLE, but partnership has high strategic value.  
     - *Question*: Does the proposal align with university mission and values, ignoring the signal?  
     - *Criteria*: Reputational risk, mission fit, broader benefits (e.g., research impact). Committee decides by majority vote.  

  ---

  ### **Application to Cases**  
  **Key**:  
  - ✅ = Pass / sufficient answer  
  - ❌ = Fail / stop  
  - ⚠️ = Insufficient data / undecided  

  ---

  **Case 1: Software Company’s Research Lab**  
  - **Signal**: Annual transparency report on government data requests, with named officer and university withdrawal clause.  
  - **Step 1 (Identify)**: ✅ Clear signal (report + accountability).  
  - **Step 2 (Base cost)**: ✅ Moderate cost (industry proxy: ~$200K/year for compilation; reputational risk if high request volume).  
  - **Step 3 (Wrong-pocket)**: ✅ Cost borne by proposer (software company); beneficiary alignment (company gains research prestige).  
  - **Step 4 (Reversibility)**: ⚠️ Contingent on partnership continuation, but university withdrawal clause creates monitoring. Not clearly reversible → Proceed.  
  - **Step 5 (Differential cost)**: ⚠️ Problem: Baseline drift.  
    - Sector baseline: Transparency reports are common (e.g., 65% of large tech firms publish them → ubiquitous).  
    - Differential cost: Unknown. A "bad-faith" firm (high data-sharing) may face higher reputational cost, but ubiquity reduces informativeness.  
    - Outcome: UNDECIDED (baseline too high to confirm differential cost).  
  - **Procedure outcome**: UNDECIDED → Proceed to **Step 6 (Human judgment)**.  
    - *Values decision*: Committee weighs research benefits against risk of association with data-privacy violations.  

  ---

  **Case 2: Trustee’s Gift for Dissident Archive**  
  - **Signal**: Large endowment gift with naming rights and lecture series on free expression.  
  - **Step 1 (Identify)**: ✅ Clear signal (gift + conditions).  
  - **Step 2 (Base cost)**: ✅ High absolute cost (gift value; reputational risk if university mismanages).  
  - **Step 3 (Wrong-pocket)**: ✅ Cost borne by donor (trustee); beneficiary alignment (donor gains legacy and reputational boost).  
  - **Step 4 (Reversibility)**: ✅ Sunk cost (gift is irreversible; no recovery clauses).  
  - **Step 5 (Differential cost)**: ✅ Rare signal (transformational gifts are <10% of donations).  
    - Differential cost: True free-expression advocate (good-faith) benefits from lecture series; opportunist (bad-faith) bears high cost for limited legacy gain.  
    - Outcome: CREDIBLE (high cost + rarity signals alignment).  
  - **Procedure outcome**: CREDIBLE. No Step 6 needed.  

  ---

  **Case 3: Industry Consortium’s Procurement Pledge**  
  - **Signal**: Sector-wide pledge with no member obligations, no audit, and lapse clause.  
  - **Step 1 (Identify)**: ✅ Clear signal (pledge signature).  
  - **Step 2 (Base cost)**: ❌ Near-zero cost (no enforcement; reputational risk negligible without audit). Stop → NOT CREDIBLE.  
  - *Procedure outcome*: NOT CREDIBLE (fails Step 2). No further steps.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Structurally unanswerable questions**:  
     - **True intent**: Cannot verify if a proposer is inherently "good-faith" (theory assumes types are revealed by costs, not observed).  
     - **Dynamic baselines**: Cannot predict if a signal will become cheap talk in the future (e.g., sector-wide adoption post-agreement).  
     - **Unobservable costs**: Cannot assess internal trade-offs (e.g., opportunity costs) without proxies.  

  2. **Redescribed disagreements**:  
     - **Cost disputes**: Differences in cost estimates (e.g., "Is $200K for transparency reports accurate?") become debates over proxy quality.  
     - **Alignment judgments**: Wrong-pocket conflicts (e.g., "Does the parent company *really* care?") shift to incentive analysis without resolution.  
     - **Values conflicts**: When signals fail, disagreements about "mission alignment" (Step 6) persist but are isolated from signaling logic.  

