answer: |-
  ## Sestina for the Selvage

  The hunger in the flicker, bright **fire**,
  Consumes its fuel, an endless breath.
  Is this the core? Yet change requires
  No slow instruction from a **virus**,
  No code reshuffled, just the ash.
  This boundary flares, consumes its edge.

  The **virus** drifts, a frozen thought,
  Awaiting entry, lacking gears
  To spin its own sustaining heat.
  It borrows life to make its copies swarm,
  A logic stark, devoid of hearth or **fire**,
  Its being borrowed, never self-sustained.

  The sturdy **mule**, of lineage mixed,
  Bears weight and heat, endures the day,
  Its sinews woven, senses fixed.
  Yet future fails; no offspring play
  To claim its strength. Its line is blocked,
  A fertile world that ends with it. No **spore**
  Carries its shape into the drought.

  The waiting **spore**, a shuttered vault,
  Holds life in stasis, tight and dry.
  No pulse, no breath, no burning fault.
  Is life then paused, or passed it by?
  This grain endures beyond the pulse,
  Defying constant **metabolism**'s claim.
  It sleeps through time, preserving flame.

  The sprawling **colony**, a crawling mind,
  One will expressed in many forms:
  The worker, queen, the strands entwined.
  Where does the *one* escape the norms?
  Is life the ant, or is the nest alive?
  A bounded whole? The question gnaws.
  This shifting **selvage** blurs the lines we draw.

  The **selvage** droplet, coacervate,
  Sustains its form on offered fare,
  Transforms the stream, controls its state,
  Divides by shear, daughters declare
  A bias built from parent stuff.
  Heritable change, adaptation's grace,
  Accrues without a code, without a trace
  Of nucleic script. Its boundary? Phase,
  Not walled enclosure. Made, not born,
  From chemists' hands, the first design.
  Then dried to dust, a pattern stored,
  Rebuilt from specs, the lineage restored
  Across a gap where no life stirred.
  Is this the spark? Or just the **fire**
  We set ourselves? No borrowed **virus**
  Heart, no fertile **mule**'s desire,
  No waiting **spore**'s enduring pyre,
  No **colony**'s emergent choir.
  This edge we drew, this **selvage** wire.

  **Envoi**

  The **fire** lacks code, the **virus** lacks its breath.
  The **mule** stands sterile, facing certain death.
  The **spore** denies the constant burn.
  The **colony** confounds the single urn.
  The **selvage** waits: designed or self-begun?
  The marks converge, but meaning's work's undone.

  ---

  **Notes for the Seminar:**

  1.  **Form & Rotation:** Strict sestina rotation: 123456, 615243, 364125, 532614, 451362, 246531. Envoi: 2/5, 4/3, 6/1 (fire/virus, mule/spore, colony/selvage).
  2.  **Marks & Cases (Legible in Stanzas):**
      *   **Stanza 1 (End-word: Fire):** *Metabolism* ("hunger," "consumes its fuel," "endless breath").
      *   **Stanza 2 (End-word: Virus):** *Metabolic Inertia/Dependence* ("frozen thought," "lacking gears," "borrows life," "devoid of hearth").
      *   **Stanza 3 (End-word: Mule):** *Reproduction* ("no offspring play," "Its line is blocked," "fertile world that ends").
      *   **Stanza 4 (End-word: Spore):** *Dormancy vs. Metabolism* ("waiting," "shuttered vault," "life in stasis," "No pulse, no breath," "defying constant metabolism's claim").
      *   **Stanza 5 (End-word: Colony):** *Bounded Individuality* ("sprawling," "crawling mind," "Where does the *one*," "bounded whole?," "blurs the lines").
      *   **Stanza 6 (End-word: Selvage):** *The Selvage & Synthesis/Volta* - Covers metabolism ("Sustains its form"), reproduction/heredity ("Divides by shear," "Heritable change"), evolution ("adaptation's grace," "Accrues"), boundedness ("boundary? Phase"), dormancy ("dried to dust," "Rebuilt from specs... gap where no life stirred"), and introduces the designed origin ("Made, not born," "chemists' hands") and the core hesitations ("Is this the spark? Or just the fire We set ourselves?").
  3.  **Selvage Hesitation:** Located in the contrasts: "Accrues *without a code*," "Made, *not born*," "Rebuilt from *specs*," "Is this the spark? Or just the **fire** / We set ourselves?" It highlights the artificial origin, the informational continuity across non-being, and the lack of molecular coding, prompting the volta's shift to the *meaning* of the definition.
  4.  **Volta:** Begins in Stanza 5 (*Colony*) with "Where does the *one*...?" and "The question gnaws," directly challenging compartmentalization. It intensifies in Stanza 6 (*Selvage*) with the direct questions "Is this the spark? Or just the fire / We set ourselves?" and the litany of what it lacks compared to other cases ("No borrowed virus / Heart, no fertile mule's desire..."). This shifts from checking marks to questioning the validity/meaning/sufficiency of the marks themselves in this borderline case.
  5.  **Envoi:** Summarizes the failures of each case against specific marks, juxtaposes the Selvage's convergence ("The marks converge") with the unresolved question of *meaning* ("but meaning's work's undone"). It leaves the definition open ("designed or self-begun?") while emphasizing the stakes lie in the *work* the definition does (physiology, astrobiology, ethics - hinted by "meaning's work").
  6.  **Technical Terms:** "Coacervate," "metabolism," "nucleic" (implied in "without a code"), "heritable," "adaptation" are used where they carry precise meaning essential to the argument. "Phase" (for boundary) is fundamental.
  7.  **Sound & Rhythm:** Unrhymed. Lines vary between ~8-12 syllables, aiming for a strong underlying iambic/anapestic pulse suitable for reading aloud. End-words are integrated naturally ("flicker, bright fire"; "frozen thought,"; "lineage mixed"; "shuttered vault"; "crawling mind"; "droplet, coacervate").
  8.  **Philosophical Stance:** Avoids both facile relativism ("cluster concept") and naive essentialism ("real essence"). The Envoi explicitly states the marks *converge* on the Selvage, yet the *meaning* of that convergence – what we decide *counts* as life given its origin and nature – is the unresolved work, precisely where the different contexts (physiology, search, ethics) create different demands. The stakes are in that unresolved work of definition.
