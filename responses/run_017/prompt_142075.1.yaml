prompt: |-
  I sit on a university committee that is drafting a policy on "cognitive prosthetics" — the wearables and cloud services that researchers here use to record, store, and cue back material they would otherwise have to carry in their heads. Two cases prompted the exercise. The first is a lab-wide annotation ledger: about a dozen people have added to it continuously for roughly ten years, it is the only record of why certain protocols were changed, no individual member can reconstruct more than a fragment of it unaided, and it is now being migrated off a departmental server. One member has objected that this is not a question of shared property at all but of erasing part of her memory. The second is a device that several people here wear, which captures conversation and replays relevant fragments at moments it selects itself; you cannot query it deliberately, you usually cannot tell when it has misfired, and yet long-term users report that without it they feel as though their recall has been cut in half. The accommodations office has also asked us for a definition, because students have begun asking whether being made to surrender such a device before an exam is like being made to surrender their glasses, or like being forbidden a calculator.

  A colleague on the committee who has read some of the philosophical literature says that everything here turns on the extended mind thesis, and he has offered an argument I cannot quite fault. If the thesis is right, he says, then what makes something part of your mind is the functional role it plays rather than whether it sits inside your skull; but then there is no principled line to be drawn between the notebook that the amnesiac in the famous example uses to find his way around the city and my phone, my search engine, the ledger, and the library catalogue, so the thesis is either a trivial remark about how much we lean on tools or an absurd one about where our minds are located. And if we take the absurd branch seriously, as he thinks intellectual honesty requires, then deleting the ledger or confiscating a recording device is not really a dispute about property, academic integrity, or accommodation: it is damage to someone's cognition, and it ought to be regulated the way we regulate damage to someone's brain. I am the one who has to write the memo that either adopts this argument or explains why it fails, and I would rather not build a policy on a bad inference.

  My own suspicion is that the slippage lies in the move from "this resource partly constitutes a cognitive process" to "this resource is part of a person, and damaging it is damaging them" — but I cannot say exactly where that step goes wrong, partly because I am not sure the first claim is the interesting one, and partly because I cannot tell whether the standard remedies people offer (the checklist of reliability, trust, easy accessibility, and automatic endorsement; the insistence that being causally coupled to something is not the same as being partly constituted by it) are real constraints on the thesis or merely ad hoc manoeuvres for avoiding conclusions the authors find embarrassing. Please reply in exactly five numbered points, each one or two sentences long, with no preamble and no closing sentence: identify what is confused in the argument as I have reconstructed it, or, if you think it is sound after all, say which premise carries the weight and how I should defend it in the memo.
reasoning: |-
  Hmm, the user is on a university committee drafting a policy about cognitive prosthetics - wearables and cloud services that help researchers record and recall information. They've described two specific cases: a decade-long lab annotation ledger that's become a collective memory bank, and a conversation-capturing device that users feel is essential to their recall abilities. The accommodations office also needs guidance on whether such devices should be allowed during exams.

  Their colleague has presented an argument based on the extended mind thesis, claiming that if we accept that minds extend beyond the brain, then deleting the ledger or confiscating devices constitutes actual cognitive damage. The user suspects there's a logical flaw in moving from "this tool enables cognition" to "this tool is part of the person," but can't pinpoint it. They need to write a memo either adopting or refuting this argument.

  I need to identify the confusion in five concise points without preamble or closing sentences. The colleague's argument has two key premises: (1) functional role determines what's part of the mind (extended mind thesis), and (2) therefore there's no principled distinction between internal and external cognitive tools. This leads to the conclusion that interfering with such tools is equivalent to damaging someone's brain.

  The slippery step is indeed equating cognitive dependency with personal identity. A tool can be crucial for cognition without becoming part of one's self - just as destroying someone's glasses damages their vision but isn't damaging their eyes. The reliability and trust criteria (from Clark & Chalmers) are meant precisely to prevent this overextension - they establish when a tool is so deeply integrated that it functions like biological memory.

  For the memo, the user should emphasize that while these tools are cognitively significant, policy should focus on their functional role rather than metaphysical claims about mind extension. This avoids the "absurd" implications while still taking the tools seriously as cognitive aids. The accommodations question becomes about functional equivalence (like glasses) rather than literal mind parts.
answer: |-
  1.  The confusion lies in equating cognitive dependency ("this resource partly constitutes a cognitive process") with personal identity ("this resource is part of a person"); a tool enabling a process isn't necessarily constitutive of the *self*, so damaging it harms function, not necessarily the person *as such*.
  2.  The extended mind thesis highlights functional equivalence, not ontological equivalence; even if the ledger functions like biological memory for decision-making, deleting it removes access to information, not a brain state itself.
  3.  The standard criteria (reliability, trust, accessibility, automatic endorsement) are crucial boundaries; they distinguish deeply integrated tools (arguably extending the mind) from merely useful external resources like a library catalogue, preventing "cognitive bloat".
  4.  The argument ignores the distinction between constitutive coupling (the tool *is* part of the cognitive process) and merely causal coupling (the tool *influences* the process); confiscating a device disrupts coupling, but doesn't necessarily damage an existing internal cognitive state.
  5.  Therefore, regulating ledger deletion or device confiscation as "brain damage" is unwarranted; policy should instead focus on harm to cognitive function, academic integrity concerns, and reasonable accommodations based on functional need and integration depth.
