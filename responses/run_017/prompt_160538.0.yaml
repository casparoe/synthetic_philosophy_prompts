answer: |-
  My dear colleague,  

  Your difficulty strikes at the very heart of the distinction between probability and weight, and I shall address it directly in the form you request:  

  1.  **Weight is not a forecast of future credence, but a present measure of the evidential foundation.** Your proposed translation reduces weight to a second-order expectation about *one’s own psychological state* under hypothetical evidence; this conflates the *grounds* of a probability (its objective basis in known relevant evidence) with a prediction about *subjective instability*.  
  2.  **A strictly proper scoring rule ensures honesty in reporting *degree of belief*, but says nothing about the *adequacy of the grounds* for that belief.** It treats a 0.7 founded on a whim identically to a 0.7 founded on exhaustive data; this confirms the rule’s purpose (eliciting true belief) but ignores my contention that rational action requires assessing the *security* of the grounds alongside the degree.  
  3.  **Weight determines the *confidence* with which a probability should inform action, not the probability itself.** Between two probabilities both assessed at 0.7, the one with greater weight (your forty years of data) permits a firmer practical commitment; the lesser weight (a single analogue) warrants greater caution or further inquiry *even if the numerical probability is identical*.  
  4.  **New evidence increases weight by *reducing the proportion of relevant ignorance*, irrespective of its effect on the probability number.** Your scoring rule, by design, cannot reflect this epistemic gain when probability remains unchanged; it captures calibration of belief to outcome, not the *comprehensiveness* of the knowledge supporting it.  
  5.  **The “work” weight does is to guard against acting on *precise probabilities derived from grossly inadequate evidence*.** It is a quality of the argument itself—a measure of its resilience—not a quantity to be scored independently; your rule’s blindness to it exposes a limitation in reducing rational decision-making *solely* to announced probabilities and outcomes.  

  Yours sincerely,  
  J.M. Keynes
