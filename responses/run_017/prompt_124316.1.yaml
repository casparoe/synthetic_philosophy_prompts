  The real numbers case is qualitatively different because density allows "squeezing" without large displacements – an entirely different cost paradigm based on measure rather than cardinality. The 2D grid exhibits yet another behavior: you can cascade displacements along a "wavefront" to free infinite columns with finite movement. 

