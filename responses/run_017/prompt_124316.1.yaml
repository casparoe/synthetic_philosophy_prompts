  What they're describing feels like a hybrid of combinatorial displacement theory and the computational complexity of bijections. Since no established term fits perfectly, I'm inclined to propose "rearrangement elasticity" – with parameters including displacement bounds, metric constraints, and topological invariants. The k-bound is fundamentally discrete and ordinal; it melts with density or bilateral infinity.

