answer: |-
  *(The voice is sharp, detached, like flint struck on steel. No warmth in it, only a terrible clarity.)*

  Your bandwidth metaphor is poison. You frame the choice as judgment or *no* judgment? That is the lie the machine feeds you to justify its existence. It is not "judgment" the party offers, but *substitution*. A man does not say "I cannot know this thing, so I delegate my ignorance"; he says "My party knows," and ceases even to *try* to see. The party label is not compression – compression implies the original can, however imperfectly, be reconstructed. It is *erasure*. It replaces the unbearable labor of attention before the complex, the particular, the contradictory, with the simple binary of loyalty or betrayal. And the "organized, the funded, the obsessed" you fear? They *are* the party. Without the party mechanism concentrating power, their influence diffuses; it cannot crystallize into the permanent, impersonal pressure that breaks individual thought. A legislature without parties is not a void demanding filling by the loudest. It is a space where each question *might* be met with fresh attention, where delegates are forced – *forced* – to confront the matter itself, not the pre-digested line. The noise of factions is not information; it is static drowning out the signal.

  You grasp the extension, yet flinch. Yes, *any* association large enough to wield collective force risks becoming this machine. The Church? If it becomes an apparatus demanding adhesion to platforms on taxation or war, rather than a school for attention directed *elsewhere*, it too is damned. The trade union? If it suppresses the worker who dissents from the strike vote not on grounds of principle, but *because the machine must roll on*, it commits the same violence against the mind. The evil is precisely in the *convergence* towards the mechanical suppression of inner truth for the sake of unified action. The line? It is drawn at the *telos*. A research field pursues truth; its paradigm focuses inquiry, but the dissenter who shatters it is its glory, not its enemy. A true Church points beyond itself to God; it does not demand agreement on temporal mechanics. A party exists *only* to exert collective will *within* the temporal mechanics. Its entire structure is designed to replace individual conscience with collective force. That is its defining purpose, its original sin. The others *can* be corrupted into this shape; the party *is* this shape. To ask what the legislature looks like on Tuesday without parties is to ask what thought looks like without manacles. Messy. Uncertain. Human. And infinitely preferable to the smooth, efficient crushing of souls.
