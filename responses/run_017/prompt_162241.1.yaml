prompt: |-
  Hey — I'm in a tiny reading group that's been slogging through decision theory (Newcomb's problem, the counterfactual mugging thing, the blackmail cases), and I've realized my gut reactions don't add up to anything I could actually state out loud. I'm not after a tour of the standard theories — I've been told the labels are roughly causal / evidential / functional, and half the stuff I read just announces that one of them "pays" as if that settles it. What I want is the principle underneath, said in plain terms, that fits my verdicts, plus an honest account of which of my verdicts it can't fit. Here's my list, going purely by feel:

  1. Classic mugging: a predictor ran a full simulation of me before flipping a fair coin; if heads he'd have handed me $10,000 provided the simulation agreed to pay, if tails he asks me now for $100; the coin came up tails. I pay.
  2. Same setup, except he tells me there was no simulation — he predicted me from an old brain scan plus a statistical model that's right about 90% of the time, and he'd have paid out on that prediction. I don't pay.
  3. The blackmail letter: he says he's got embarrassing photos, that he sent the letter iff he predicted I'd pay, that if he'd predicted I wouldn't he'd have destroyed the photos and I'd never have heard from him, and that whether the photos go out was already decided by whether the letter went out. I don't pay.
  4. Plain old blackmail: he'll release the photos iff I don't send $100. I pay — the photos would cost me far more than that.
  5. Mugging with the coin flipped after I answer: heads I get $10,000, tails he keeps the $100 I hand over. I pay, obviously.
  6. Mugging with a garbage ratio: simulation predictor, $10,000 on heads, but he demands $50,000 in the tails branch. I refuse.
  7. Control case: he flipped the coin himself, disbursed the money on the flip alone with no prediction involved, and is now asking me for $100 out of curiosity, saying my answer changes nothing. I refuse.
  8. For calibration: I take only the opaque box in Newcomb's problem, and in the case where a genetic lesion causes both a taste for smoking and throat cancer with no causal link from smoking to cancer, I smoke.

  The two that keep bothering me are (1) and (2). My friend Marco says they're literally the same case and that my different reaction is just an artifact of how vivid the simulation story is; if he's right, which of the two verdicts should flip, and what does the surviving version say about (3)? The rough principle I've been trying on is something like: pay exactly when what the predictor is reading off is (a) tied tightly enough to what I decide now and (b) sits upstream of a benefit rather than a threat — but I can't tell whether clause (a) is doing real work or is just a fancy way of restating my hunch that simulations matter and brain scans don't. Test that against the list and repair it, or replace it. Then tell me what it says about two cases I genuinely can't call: (A) simulation predictor, coin came up tails, $100 demand, but the money on heads goes to a stranger's medical bills rather than to me, and I'm not especially self-sacrificing; (B) he ran a hundred simulations of me, ninety-seven refused, so he predicted "refuse" and paid out nothing, and now he asks me for $100 anyway, promising that if I pay he'll run the whole setup again with a fresh simulation of me as I am right now — so paying buys nothing this round but would matter next round.
reasoning: |-
  Okay, the user is in a reading group tackling decision theory puzzles like Newcomb's problem and counterfactual mugging. They've listed their intuitive responses to eight scenarios and are struggling to reconcile cases 1 and 2, where the predictor uses a simulation vs. a statistical model. Their friend Marco thinks these are identical, which troubles them. They want an underlying principle that explains their intuitions, acknowledging where it might fail, and help with two additional cases (A and B).

  First, I need to unpack their core dilemma. Their gut says "pay" in classic simulation-based mugging (case 1) but "don't pay" when prediction relies on a brain scan/model (case 2). Marco calls this inconsistent—but the user senses a difference. Their proposed principle hinges on whether the predictor reads something "tightly tied" to their current decision (clause a) and whether it's a benefit vs. threat (clause b). 

  Let me test this against their list. Case 3 (blackmail letter) feels like a "don't pay"—aligning with their principle since the predictor's action (destroying photos) depends on prediction, but it's a threat, so clause b might explain refusal. Case 4 (plain blackmail) is "pay" because it's direct extortion (no prediction, just consequence), so clause b doesn't apply—here, causal control matters. Case 5 (coin flipped after) is obviously "pay" because their action causally affects payout. Case 6 (garbage ratio) refuses despite simulation—so ratio matters, suggesting their principle needs a cost-benefit clause. Case 7 (control) refuses because no causal link. Case 8 (Newcomb's/smoking lesion) shows evidential reasoning (opaque box/smoking) since correlation isn't causation. 

  For cases 1 vs. 2, the tension lies in whether the prediction method affects "tight tie." Simulations feel like reading their *actual decision algorithm*, while scans feel like reading *correlates*—hence differing trust in the link. Marco might say both are just evidence, but the user intuitively weights simulation higher. 

  Now for their unresolved cases:  
  - (A) Simulation, tails, $100 demand, but heads money goes to charity. Their principle's clause b ("upstream of benefit") fails because the benefit isn't theirs. Since they're not altruistic, likely "don't pay"—the "benefit" part is key.  
  - (B) Paying triggers a re-run with fresh simulation. This is tricky: paying now buys future influence, but no immediate benefit. If they value influencing future simulations, they might pay—making clause a ("tied to decision") stretch across time. 

  I should formalize a principle that captures their intuitions: "Treat predictors as reliable only if they model your decision process directly; otherwise, focus on causal control. For benefits, play along if the link is tight; for threats, ignore predictions and minimize direct harm." This explains case 1 (direct simulation/benefit → pay) vs. case 2 (indirect/threat? → refuse). It also handles case 3 (threat → refuse) and case 4 (direct extortion → pay).  

  But limitations exist:  
  - Case A exposes their self-interest—if benefit isn't theirs, refusal makes sense, but their principle's clause b doesn't specify *whose* benefit.  
  - Case B challenges temporal scope—paying now affects future rounds, which might feel like "upstream benefit" if they see their current self as part of a sequence.  

  Honest gaps:  
  - Their refusal in case 2 might stem from distrust (90% accuracy isn't "tight"), but if accuracy were 99.9%, would they pay? Their principle doesn't quantify "tightly tied."  
  - In case B, if re-running helps future selves, it might align with clause b (future benefit), but feels distinct from classic mugging.  

  Recommendation: They might be a "functional decision theorist" (focusing on decision-output consistency across scenarios) but with a "direct process modeling" filter. For case A, lean into self-interest → refuse. For case B, if they value consistent decision-rules across time → pay, else refuse.  

  Key insight: Their intuition centers on *what the predictor accesses*. Simulations feel like accessing their "true decision," making counterfactuals real; scans feel like accessing proxies, making it mere correlation. This divides evidential (case 1) from causal (case 2) reasoning contextually.
answer: |-
  Here's a principle distilled from your verdicts, stress-tested against your cases, with honest gaps and resolutions for (A) and (B). The core isn't about "paying" or "theories" but **what kind of dependency your decision has on the outcome**:

  ### Your Principle (Refined):
  **"Cooperate with predictions *only* when:**
  1. **The predictor reads your *actual decision process* (not correlates),**
  2. **This creates a *beneficial counterfactual dependency* (your choice controls a past/future gain), and**
  3. **The cost-benefit ratio is favorable."**

  **Otherwise, act causally (control direct outcomes).**

  ### How It Explains Your List:
  - **Case 1 (Simulation Mugging, Pay):**  
    ✅ Simulation reads your *decision algorithm*.  
    ✅ Paying now controls the past gain ($10k if heads).  
    ✅ $100 for 50% chance at $10k is good odds.  
    → *Cooperate with prediction.*

  - **Case 2 (Scan/Model Mugging, Don’t Pay):**  
    ❌ Brain scan/model reads *correlates* (e.g., personality traits), not your decision process.  
    → No beneficial dependency → **act causally** (keep $100).

  - **Case 3 (Blackmail Letter, Don’t Pay):**  
    ❌ Prediction exists, but it’s a *threat* (destroys photos if predicted refusal).  
    ❌ Paying *doesn’t control a gain*; it avoids a loss caused by the predictor.  
    → Treat as extortion → **act causally** (refuse, as paying encourages blackmail).

  - **Case 4 (Plain Blackmail, Pay):**  
    ❌ No prediction → no dependency to leverage.  
    ✅ Pure causal control: pay $100 to avoid >$100 loss.  
    → **Act causally** (pay to minimize loss).

  - **Case 5 (Coin After, Pay):**  
    ❌ No prediction → no dependency.  
    ✅ Direct causal link: paying controls future gain.  
    → **Act causally** (pay for 50% chance at $10k).

  - **Case 6 (Garbage Ratio, Refuse):**  
    ✅ Simulation reads decision process.  
    ✅ Beneficial dependency exists.  
    ❌ Cost-benefit fails ($50k for 50% of $10k is terrible).  
    → **Act causally** (refuse).

  - **Case 7 (Control, Refuse):**  
    ❌ No prediction → no dependency.  
    ❌ No causal link (your choice changes nothing).  
    → **Act causally** (keep $100).

  - **Case 8 (Newcomb/Smoking Lesion):**  
    ✅ Newcomb: Predictor reads decision process → take one box.  
    ✅ Smoking Lesion: Lesion is a *correlate* (not your decision) → smoke.  
    → Consistent with prioritizing decision-process links.

  ### Addressing Marco’s Challenge (Cases 1 vs. 2):
  Marco is half-right: **both cases involve evidence about your choice.** But your intuition spots a key difference:  
  - **Simulations** (Case 1) replicate your *decision algorithm* — paying now *controls* whether the simulated-you "paid" in the past.  
  - **Scans/models** (Case 2) use *proxies* (e.g., "impulsive people refuse 90% of the time") — your choice doesn’t retroactively control the prediction; it’s just correlated.  
  **Your verdicts are consistent:** Case 1 has a **functional dependency** (your decision now *is* the past decision), Case 2 is **mere correlation**. Flipping either verdict breaks the principle: paying in Case 2 ignores the lack of control; refusing in Case 1 ignores the real counterfactual gain.

  ### Resolving Your Uncalled Cases:
  - **Case A (Simulation, payout to charity):**  
    ❌ **Don’t pay.**  
    Why: The dependency exists (simulation reads your decision process), but the "benefit" isn’t yours — it goes to a stranger. Your principle requires *beneficial* dependency (you gain in the counterfactual). No self-interest → act causally (keep $100).

  - **Case B (97/100 sims refuse; pay to rerun):**  
    ✅ **Pay.**  
    Why: Paying now triggers a *new simulation of your current decision* — so your choice *does* control a future benefit (you gain $10k if future coin=heads). This satisfies all criteria:  
    1. Reads your decision process (fresh simulation),  
    2. Creates beneficial dependency (your payment controls future gain),  
    3. Cost-benefit holds ($100 for 50% of $10k).

  ### Gaps in the Principle:
  1. **Threshold of "Decision Process":**  
     Case 2 (90% accurate scan) fails, but what about 99.9%? Your principle doesn’t quantify accuracy — it assumes scans/models are inherently "correlates." If a scan could perfectly replicate your algorithm, should it be treated like a simulation? Your verdicts suggest "no," but the principle doesn’t resolve this cleanly.
     
  2. **Self-Defeating Threats:**  
     In Case 3 (blackmail letter), refusing *should* make the predictor destroy the photos (since they predicted refusal). But if the predictor is wrong, photos might leak. Your "don’t pay" verdict assumes the predictor is infallible. If there’s a 1% chance they’re wrong, does paying become rational? The principle doesn’t handle uncertainty well.

  3. **Moral Overrides:**  
     Case A assumes pure self-interest. If you care about the stranger, paying might feel right — but the principle ignores altruism.

  ### Why This Fits You:
  You’re a **functional decision theorist** with a **causal threshold**: you honor predictions *only* when they directly access your decision machinery (not correlates) and create gains. Otherwise, you default to causal control. This hybrid explains why you reject evidentialism in Cases 2/3/7 but accept it in Cases 1/8.  

  **Where to go next:** Test cases where "decision process" is ambiguous (e.g., a simulation that omits a key memory; a model that learns from your past choices). If your verdicts shift, refine clause (1). If not, you’ve found your coherence.
