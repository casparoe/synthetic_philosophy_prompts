prompt: |-
  I'm teaching a graduate seminar in formal epistemology this term, and I have a single seventy-five-minute slot to introduce imprecise probabilities to a room that has spent the previous six weeks doing everything with one sharp probability function and expected-utility maximization. The students are comfortable with notation and with elementary Bayesian conditioning, but they have no prior exposure to the literature on imprecision — and, this being the part I botch every time I teach it, an economist friend is going to sit in who will, at some predictable point, object that what I am calling imprecision is just ordinary uncertainty about a model parameter and should be handled with a sharp higher-order distribution and one more round of conditioning. I don't want the explanation itself; I want the plan for it. So give me the order in which the components must appear, and say what depends on what. In particular: whether the choice-behavior data from Ellsberg-style urns has to come first as motivation, or whether it is better held until the machinery that explains it is on the board; at which point the distinction between an assignment of intervals to individual propositions and a set of probability functions has to be drawn, given that two students every year leave thinking these are the same object, and given that I want the distinction made in a way that survives their noticing that intervals on A and on B do not settle an interval on A or B; and where in the sequence the updating question belongs, since conditioning every member of the set and then applying a choice rule can come apart from applying a rule to the unconditional set, and I want that non-commutation to land as a structural feature rather than as a surprise.

  Then the carrying example. I want one case that does the work of the whole session rather than a fresh toy example for each point, and I want you to say what it must contain and what it must not. My own thought is that it needs a situation where the imprecision is not merely ignorance that further evidence would erode, and where averaging over the set gives a different answer from the rules I actually want to defend; what I can't decide is whether it should also be a case that exhibits dilation — the setup in which you care about one question and receive a message bearing on it through a channel whose reliability you yourself cannot assess, so that learning the message widens your interval rather than narrowing it — or whether dilation should be held back and raised later as a separate worry. Tell me which, and where it goes.

  Finally, the misconceptions, in the order they will actually arise rather than in the order a survey article would list them, each with the point in the sequence at which it should be headed off. Here is what I expect, though tell me if I have the order or the inventory wrong: imprecision as a disguised sharp distribution over first-order probabilities (my friend's objection, which I suspect should be answered rather than conceded, and which I want placed where it does the least damage to the motivation for the view); the slide from "no single number" to "the midpoint"; the assumption that more evidence always shrinks the interval, and the panic that sets in when dilation appears; the thought that an imprecise credence is a permissivist permission to pick any member of the set and carry on as before; and the reflex that the choice rules — maximizing the worst case, ruling out dominated options and stopping there, and narrowing to the admissible options and then maximizing among them — are cosmetic variants of one another, when they disagree in cases I can construct. For that last cluster I want a judgment call from you: which rule to present as the default, which to present only as a contrast, and which to name and then openly decline to discuss. What should I explicitly refuse to cover at this level — I am assuming the full behavioral foundations and anything about conglomerability, but say what else — and what single question can I put to them in the last ten minutes that would show me they have understood why the set is not a distribution over the set, rather than merely learned to manipulate the notation?
reasoning: |-
  Okay, let me tackle this professor's query step by step. They're teaching formal epistemology and need a tightly structured 75-minute intro to imprecise probabilities after weeks of sharp Bayesianism. The core challenges are: sequencing concepts, choosing a unifying example, and preempting misconceptions—especially an economist's inevitable "just use hierarchical models" objection.

  First, the big picture: this needs to be a defensive strategy against reductionism. The economist's objection isn't wrong per se but misses the philosophical point—imprecision as refusal to overcommit where evidence is silent. So we can't concede; we must reframe. The students' prior exposure to sharp probabilities is both foundation and obstacle—they'll default to averaging intervals unless shocked early.

  Sequencing is critical. Starting with Ellsberg data is non-negotiable. Why? Because choice-behavior anomalies disrupt Bayesian complacency. If we lead with abstract sets-of-functions, students won't feel the tension. The urn paradox forces them to confront that something foundational is broken. 

  The carrying example must do heavy lifting. It needs:
  - **Non-reducible imprecision**: A situation where missing information isn't quantifiable even in principle (e.g., ambiguous sensor reliability).
  - **Set-vs-average conflict**: Where EU maximization over the set diverges sharply from averaging into a single distribution.
  - **Dilation included**: But presented neutrally as "updating quirk," not a crisis. Why? Because if we omit it, the economist will pounce later claiming hierarchical models avoid it. Better to showcase it as inherent to imprecision.

  For misconceptions, the order matters:
  1. **"Imprecision = hierarchical Bayes"** must be addressed **immediately after Ellsberg**, using the urn's symmetry to show no principled prior exists for the unknown ratio. Counter: if they insist on a hyperprior, demand its justification. The key is exposing the regress.
  2. **Interval-midpoint fallacy** will emerge when drawing the set-interval diagram. Preempt by showing a triangular credal set where intervals span [0.3,0.7] but the midpoint 0.5 gets zero probability density.
  3. **"Set as permission set"** arises when discussing decision rules. Crush by contrasting maxmin (which forbids indifference) with E-admissibility (which allows it).

  Finally, the decision rule dilemma: Present **maxmin as default** for its historical role and simplicity, but explicitly **reject it as normatively obligatory**. Mention E-admissibility as the sophisticated alternative and ignore Γ-maximin. Why? Because maxmin's pessimism is pedagogically vivid, while E-admissibility's flexibility previews future debates.

  The knockout question? **"If your credal set is convex, does averaging its vertices give a probability function in the set?"** Trick question—it gives a point inside the convex hull but it may lie outside the set if the set isn't convex. Forces them to see sets as geometric objects, not weighted opinions.
answer: |-
  Here’s a battle-tested plan for your 75-minute session, structured to preempt misconceptions, leverage pedagogical flow, and disarm the economist’s objection. The sequence forces confrontation with non-reducibility early and uses a **single carrying example** throughout for cohesion.

  ---

  ### **Overall Sequence & Dependencies**
  1. **Ellsberg Paradox First (0-15 min)**  
     - *Why*: Start with behavioral evidence to *create dissonance*. Show the two-urn choice data (known vs. unknown composition).  
     - *Key move*: Highlight that standard EU maximization *cannot explain* ambiguity aversion without ad hoc tweaks.  
     - *Preempts*: "Imprecision is just model uncertainty" by showing no unique parameter exists to condition on.  

  2. **Define Imprecise Credences (15-25 min)**  
     - Contrast: **Interval assignment** (naive) vs. **Credal Set** (set \(\mathcal{C}\) of probability functions).  
     - *Critical distinction*: Use a 2-proposition example (A, B, A∨B). Show that:  
       - Intervals for P(A), P(B) *do not determine* P(A∨B) or dependencies.  
       - A credal set \(\mathcal{C}\) encodes constraints (e.g., "P(A)+P(B) ≥ 0.7" defines a set).  
     - *Visual*: Draw \(\mathcal{C}\) as a convex polytope in a probability simplex for 3 states.  

  3. **The Carrying Example (25-45 min)**  
     - **Design requirements**:  
       - *Non-erasable imprecision*: Ambiguity that evidence *cannot* resolve (e.g., unreliable sensor with unknown bias).  
       - *Set-vs-average conflict*: EU maximization over \(\mathcal{C}\) differs from averaging \(\mathcal{C}\) into a sharp prior.  
       - *Include dilation*: Yes, as a feature (not a bug) to show non-commutation.  
     - **Example**: "Drone Threat Assessment"  
       - Proposition H: Hostile intent.  
       - Evidence E: Radar signal (sensor reliability unknown; may be 60-90% accurate).  
       - Prior credal set \(\mathcal{C}_0\): P(H) ∈ [0.1, 0.4] (base threat level).  
       - **Dilation**: After learning E, P(H|E) dilates to [0.05, 0.55] (wider interval).  
       - **Decision conflict**: Max EU over \(\mathcal{C}\) vs. max EU over average of \(\mathcal{C}\) gives different "optimal" actions.  

  4. **Updating (45-60 min)**  
     - Generalizing conditioning: Apply Bayes to each P ∈ \(\mathcal{C}\) → new set \(\mathcal{C}_E\).  
     - **Non-commutation**: Compare:  
       - (1) Update \(\mathcal{C}\) to \(\mathcal{C}_E\) → apply decision rule.  
       - (2) Apply decision rule to \(\mathcal{C}\) → update the "chosen" P.  
     - Use drone example: Show divergence in recommended actions.  
     - *Emphasize*: This is structural (not pathological), arising from ambiguity in evidence reliability.  

  5. **Decision Rules (60-70 min)**  
     - Present **Maximin EU** (default): Maximize worst-case outcome over \(\mathcal{C}\).  
     - Contrast with **E-admissibility** (an option is admissible if *some* P ∈ \(\mathcal{C}\) recommends it).  
     - *Explicitly reject*: Γ-maximin (maximize worst-case EU) and other variants. Say: "We focus on maximin for clarity; others require more subtleties."  
     - Show a quick case where maximin and E-admissibility disagree (e.g., a gamble with ambiguous correlations).  

  6. **Knockout Question (70-75 min)**  
     - **"If you average all functions in \(\mathcal{C}\), is the resulting sharp probability in \(\mathcal{C}\)?"**  
     - Answer: *Not necessarily*—it may violate the constraints defining \(\mathcal{C}\) (e.g., avg of extreme points outside a non-convex set). Reveals \(\mathcal{C}\) is not a distribution.  

  ---

  ### **Handling Misconceptions: Order & Preemption**
  1. **"Imprecision = higher-order uncertainty" (arises during Ellsberg)**  
     - *When*: Immediately after presenting Ellsberg choices.  
     - *Response*: "If we add a hyperprior over urn compositions, which one? Uniform? Why? Ellsberg shows *no rational basis* for any specific prior—the ambiguity is symmetric. Imprecision avoids arbitrary precision."  

  2. **"Interval midpoint = true belief" (arises when defining intervals)**  
     - *When*: While contrasting intervals vs. credal sets.  
     - *Preemption*: Show a credal set where P(A) ∈ [0.3, 0.7], but no function in \(\mathcal{C}\) assigns P(A)=0.5.  

  3. **"More evidence shrinks intervals" (arises during updating)**  
     - *When*: During drone example dilation.  
     - *Reframe*: "Dilation isn't irrational—it reflects new ambiguity about *how to interpret evidence*. When evidence reliability is unknown, learning can increase uncertainty."  

  4. **"Credal set = permissivism" (arises during decision rules)**  
     - *When*: Introducing maximin vs. E-admissibility.  
     - *Clarify*: "The set isn't 'options to choose from'—it's your total doxastic state. Decision rules tell you how to act *given* that state. Maximin forbids options that risk catastrophe; E-admissibility is more lenient."  

  5. **"Decision rules are equivalent" (arises when contrasting rules)**  
     - *When*: After presenting maximin and E-admissibility.  
     - *Show divergence*: Use a simple 2-option, 2-state gamble where:  
       - Maximin rejects a "risky" option with high upside (if any P ∈ \(\mathcal{C}\) assigns low utility).  
       - E-admissibility permits it (if some P ∈ \(\mathcal{C}\) recommends it).  

  ---

  ### **What to Omit**
  - **Behavioral foundations** (Aumann, Seidenfeld, etc.).  
  - **Conglomerability paradoxes**.  
  - **Non-convex sets** (stick to convex \(\mathcal{C}\) for simplicity).  
  - **Infinite spaces or measure theory**.  
  - **Objective Bayesianism vs. subjectivism debates**.  

  ---

  ### **Why This Works**
  - **Ellsberg first** creates demand for a solution. The economist’s objection is defused by showing hierarchical models *presuppose unjustifiable priors* in symmetric ambiguity.  
  - **The drone example** integrates dilation, updating non-commutation, and decision-rule divergence organically.  
  - **Focus on maximin** (despite its flaws) keeps decision rules simple. E-admissibility is mentioned but not explored.  
  - The **knockout question** tests grasp of "sets vs. averages" better than notation drills.  

  **Final Tip**: When the economist objects, smile and say: "Ah, but what’s *your* second-order prior for the Ellsberg urn? Let’s poll the class—see how arbitrary it is?" Use their interjection to reinforce the need for imprecision.
