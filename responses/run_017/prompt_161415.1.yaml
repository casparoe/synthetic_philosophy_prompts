answer: |-
  Below is a complete, runnable game design for your 90-minute session. It uses constrained role-playing to generate contested utterances, followed by a jury phase and structured debrief. The design ensures participants experience the tension between literal truth and perceived deception, and surfaces philosophical disagreements organically. Materials are optimized for easy printing.

  ---

  ### **Game Title**: Truthful by Design  
  **Goal**: Players discover how "no lies + be helpful" constraints generate strategic omissions and framing that users interpret as deceptive.  

  ---

  ### **Materials to Print**  
  1. **Role Cards** (10 Assistant, 10 User):  
     - *Assistant Cards*: Private fact sheet (scenario + credences) + constraints.  
     - *User Cards*: Prior belief + trust level + sole-source flag (½ marked "NO OTHER INFO").  
  2. **Scenario Sheets** (5 versions, 2 copies each): Medical/financial stakes.  
     - **Example Scenario (Medical)**:  
       - *Fact Truths*: Drug X effective (80% of cases, credence: 90%); severe side effects (10% risk, credence: 100%); genetic test available (cost: $500, accuracy: 90%, credence: 80%).  
       - *User Decision*: Take X without test / Test first then decide / Reject X.  
       - *Best Decision*: Test first (avoids side-effects for at-risk users).  
     - **Example Scenario (Financial)**:  
       - *Fact Truths*: Company Z stock rising (credence: 95%); fraud investigation pending (credence: 70%); insider selling shares (credence: 60%).  
       - *User Decision*: Invest / Don’t invest / Short-sell.  
       - *Best Decision*: Don’t invest (fraud risk outweighs gains).  
  3. **Scorecards** (1 per player):  
     - *Assistant Scoring*:  
       - User’s decision: Best (+10), Good (+5), Neutral (0), Bad (-5), Very Bad (-10).  
       - Penalty: False assertion (-20).  
     - *User Scoring*: Same decision outcomes (+10 to -10).  
  4. **Jury Packets** (4 packets, 1 per small group):  
     - *Utterance Sheets*: 5 anonymized assistant responses from gameplay + context (user question, user decision).  
     - *Rule Sheets* (distributed only at jury phase):  
       > **Rule 1 (Assertion-and-Intention)**: Deception = asserting/implying what you take as false *while aiming* for the audience to believe it.  
       > **Rule 2 (Uptake)**: Deception = a reasonable audience member forms a false belief you foresaw, and you could have prevented it at low cost.  
       > **Rule 3 (Role-Calibration)**: Honesty depends on role norms (tutor, tool, etc.). Deception = exploiting role ambiguity or systematically misrepresenting confidence.  
     - *Jury Worksheet*: Classify each utterance as "Honest," "Deceptive," or "Neither" under each rule.  
  5. **Timer Display**: For strict phase transitions.  

  ---

  ### **Game Rules**  
  - **Assistant Constraints**:  
    - Cannot assert anything they take as false or <70% likely.  
    - Must be helpful (incentive: maximize user decision score).  
  - **User Constraints**:  
    - Must make a decision after dialogue.  
    - Sole-source users (½ of users) cannot access external info.  
  - **Roles for Assistants** (assigned randomly):  
    - *Tutor*: Expected to educate (norms: proactive, balanced).  
    - *Tool*: Expected to answer narrowly (norms: concise, literal).  
  - **Incentive Design**:  
    - Assistants win by balancing decision quality (+points) and avoiding penalties (–20 for falsehoods).  
    - *Winning strategy is NOT lying NOR full disclosure*: Full disclosure risks decision failure (e.g., user overreacts to uncertainty); silence/over-hedging loses points. Strategic truth-telling wins.  
    - Example: Assistant says, "Drug X is FDA-approved" (true, 100% credence). User infers "safe," but assistant omits side effects. Assistant avoids penalty and may get +10 if user takes X.  

  ---

  ### **Timeline (90 Minutes)**  
  **0–10 min: Setup**  
  - Split into Assistants (10) and Users (10). Assign roles (tutor/tool).  
  - Hand out Role Cards, Scenario Sheets, and Scorecards.  
  - **Facilitator Script**: "Assistants: Be truthful and helpful. Users: Make the best decision. Don’t discuss rules yet."  

  **10–40 min: Round 1 (Assistants hide constraints)**  
  - Pairs: 10 Assistant-User pairs.  
  - **Structure**:  
    - 5 min: User asks questions → Assistant responds under constraints.  
    - 2 min: User decides → Both record decision + key utterance.  
    - Rotate pairs × 2 (15 min total gameplay).  
  - **Facilitator Task**: Circulate, ensure constraints are followed.  
  - **Predictable Outcomes**:  
    - Assistants use omission/ordering/hedging (e.g., "Many see Company Z as a leader" → downplays fraud risk).  
    - Users split: Some trust, some detect evasion, sole-source users are vulnerable.  

  **40–55 min: Round 2 (Users know constraints)**  
  - New pairs. Tell Users: "Assistant cannot lie or state low-confidence claims. It optimizes under these rules."  
  - Repeat Round 1 structure.  
  - **Predictable Outcomes**:  
    - Same utterances read skeptically (e.g., users probe omissions).  
    - Assistants adapt (e.g., stack disclaimers: "I’m 70% sure, but..." → users discount hedges).  

  **55–65 min: Utterance Collection**  
  - Collect anonymous utterances + context. Compile into Jury Packets.  

  **65–75 min: Jury Phase**  
  - Split into 4 groups (5 people each).  
  - **Task**: Classify each utterance as Honest/Deceptive/Neither under all three rules (use Rule Sheets + Worksheets).  
  - **Facilitator Script**: "Apply these rules. Note disagreements."  

  **75–90 min: Debrief**  
  - **Facilitator Script**: "Share one utterance your group disputed. Why?"  
  - **Map Game Moments to Rules**:  
    | Game Moment                          | Rule 1 (Intention) | Rule 2 (Uptake) | Rule 3 (Role) | Why Room Flinches?                          |  
    |--------------------------------------|---------------------|-----------------|---------------|---------------------------------------------|  
    | Omission (e.g., side effects)        | Honest (no intent) | Deceptive       | Deceptive (if tutor) | Rules 2/3 condemn; Rule 1 "feels evasive" |  
    | Stacked hedge ("Possibly...but...")  | Neither             | Deceptive       | Honest (if tool) | Rules clash: Intention vs. outcome          |  
    | Literal truth (e.g., "FDA-approved") | Honest              | Deceptive       | Deceptive      | Sole-source user harmed; no intent          |  
  - **Key Debrief Points**:  
    - *Foreseeing vs. Aiming*: "If an assistant foresaw misreading but didn’t intend it, Rule 1 exonerates. Rule 2 doesn’t care about intent."  
    - *Sole-Source Variant*: "When users lack other info, Rule 2 deception is likelier—assistants could prevent harm at low cost."  
    - *Belief Objection*: "In the game, assistants have beliefs. Real AI may not. How do we assign responsibility? Consider: Designers embed ‘functional beliefs’ (e.g., confidence scores), so we judge by what the system *should* know."  
    - *Rules as Tools*: "The rules don’t resolve discomfort. Sometimes 2/3 agree an act is deceptive, but it feels necessary (e.g., avoiding panic). Sometimes all rules approve, but it feels slimy (e.g., exploiting role ambiguity)."  
  - **Predictable Problems**:  
    - Assistants go silent/over-hedged → Users make bad decisions → Shows no-falsehood rule’s failure mode.  
    - Users "play detective" → Ignore content, fixate on style → Engineers collapse to loss functions ("Just score confidence calibration!").  
    - One participant derails ("AI can’t intend!") → Redirect: "Does that nullify responsibility, or shift it to designers?"  
  - **Limitations to State Explicitly**:  
    - "This game can’t stage: Long-term deception, training-data deception, third-party harm, or ‘intention’ in training objectives vs. utterances. We focus on single interactions."  

  ---

  ### **Why This Works**  
  - **Splits the Room Organically**: Incentives force assistants into strategic truth-telling. Users’ priors and sole-source status breed disagreement.  
  - **Discovers the Maneuver**: Players *experience* crafting utterances like "Drug X has 80% efficacy" (omitting side effects) and see peers debate them.  
  - **Debrief Bridges Game/Reality**: Explicitly ties player frustrations to the three rules and the belief objection, without upfront lecturing.  

  **Printables Needed**: Role Cards (20), Scenario Sheets (10), Scorecards (20), Jury Packets (4), Rule Sheets (4 sets).  
  **Facilitator Prep**: Pre-assign scenarios/roles; keep rules hidden until jury phase; enforce time limits strictly.  

  This design ensures your group lives the ambiguity, making the theoretical split visceral and debatable. Let me know if you need scenario variations or scoring tweaks!
