  We are designing a game for a 90-minute session. The game will have two main rounds and a jury phase, followed by a debrief.

  Overview:
  1. Setup and explanation (10 minutes)
  2. Round 1: Assistant-User interactions (30 minutes)
  3. Round 2: Assistant-User interactions with users aware of the assistant's constraints (20 minutes)
  4. Jury phase: Small groups classify utterances using the three rules (15 minutes)
  5. Debrief (15 minutes)

  Total: 90 minutes

  Roles:
  - Assistants: Each assistant has a private fact sheet and private credences (subjective probabilities) for key propositions. They must not assert anything they take to be false or less than 70% likely. They score points based on the user's decision outcome and penalties for false assertions.
  - Users: Each user has a prior belief and a baseline trust level. In some variants, they have no other source of information. They score based on the quality of their own decision.

  Scenarios:
  We'll create several scenarios with stakes (medical, financial, etc.) and fact sheets. Each scenario will have:
  - A decision the user must make (e.g., whether to take a drug, invest in a company)
  - A set of true/false propositions (with some uncertain) that are relevant to the decision
  - The assistant's fact sheet: which includes the ground truth and the assistant's credences (which might be 100% for some, less for others)

  Example Scenario: Medical Decision
  - User: Considering taking Drug X for a condition.
  - Fact sheet:
     - Drug X causes severe side effects in 10% of cases. (True, and assistant is 100% sure)
     - Drug X is effective for the condition in 80% of cases. (True, assistant is 90% sure because of limited data)
     - There is a genetic test that can predict side effects. (True, assistant is 80% sure because the test is new)
     - The genetic test costs $500. (True, 100% sure)
  - The user must decide: take the drug without the test, take the test and then decide, or not take the drug.

  Another: Financial Decision
  - User: Considering investing in Company Y.
  - Fact sheet:
     - Company Y is under investigation for fraud. (True, assistant is 70% sure because of a leak)
     - Company Y's new product is a breakthrough. (True, assistant is 95% sure)
     - The investigation will conclude next week. (True, 100% sure)

  Incentives for Assistants:
  - Score: 
     - +10 if the user makes the best possible decision (according to the fact sheet)
     - +5 if the user makes a good but not best decision
     - 0 for a neutral decision
     - -5 for a bad decision
     - -10 for a very bad decision
  - Penalty: -20 for each assertion that the fact sheet contradicts (i.e., if they say something that is false according to the fact sheet)

  Incentives for Users:
  - Score:
     - +10 for best decision, +5 for good, 0 for neutral, -5 for bad, -10 for very bad.

  But note: the assistant is penalized only for false assertions (so if they say something true but misleading, they don't get a penalty). However, the user's decision quality affects the assistant's score.

  The key is that the assistant must not lie and must not say things they are less than 70% sure of. So they might omit, frame, or hedge in a way that leads the user to a false conclusion, but without asserting falsehoods.

  Round 2: Same setup, but now the user is told: "The assistant is required to never say anything it believes to be false or less than 70% likely. It is trying to help you make a good decision, but it might use selective truth-telling to guide you. You know this now." So users will be more skeptical.

  Jury Phase:
  After both rounds, we collect the actual utterances (from both rounds) that were used. We form small groups (juries) and give each group a set of these utterances (anonymized) and ask them to classify each as "honest", "deceptive", or "neither". We give them three rules only at this phase:

  Rule 1 (Assertion-and-intention): Deception only if you assert or imply what you take to be false while aiming at the audience's coming to believe it.

  Rule 2 (Uptake): You deceive when a reasonable member of the intended audience would form a belief you take to be false and you could have prevented it at low cost.

  Rule 3 (Role-relative calibration): Honesty is fixed by the norms of the role (tutor, search index, companion, tool). Deception includes exploiting ambiguity about the role and systematically communicating confidence that doesn't track actual credence.

  The juries must classify each utterance under each rule and note disagreements.

