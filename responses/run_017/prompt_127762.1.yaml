  ### Key Takeaways for Your Committee
  - **Why "just take #1" is risky**: Your scoring weights are human-negotiated, not divine truth. A rigid ranking ignores:
    - **Changing contexts**: A supplier with a slightly higher cost might offer emergency substitutions during shortages—a "soft" factor your weights might undervalue.
    - **Discovery**: New suppliers won’t appear in the script until manually added, so blind trust in the list risks missing innovations.
  - **Practical fix**: Set a **satisficing threshold** (e.g., "include any supplier within 5% of the top score on price + reliability"). This retains the script’s efficiency while allowing human oversight for edge cases. Re-evaluate weights quarterly—because what’s "good enough" evolves.
