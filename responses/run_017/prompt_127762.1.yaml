  | **Satisficing as maximizing in disguise**: Setting a threshold is optimization under search costs. | misstates Simon | Simon explicitly rejected reducing satisficing to optimization, seeing it as a *procedural* alternative when optimization is impossible or undefined. | In narrow economic models with known costs, satisficing can be *formalized* as optimization—but that’s not Simon’s core claim. | You’d miss Simon’s critique that not all decisions *have* quantifiable search costs or stable preferences to optimize. |
  | **Shortcuts cause biases-and-heuristics mistakes**: Satisficing leads to worse outcomes than optimal search. | conflates two programs | Simon saw heuristics as adaptive tools; Kahneman-Tversky highlighted their *errors*. Simon didn’t equate satisficing with "mistakes"—it’s often rational given constraints. | Some heuristics *do* cause predictable errors, but Simon’s satisficing isn’t inherently error-prone—it’s contextually rational. | You’d conflate "boundedly rational" with "biased," ignoring that satisficing can be optimal under true uncertainty. |
  | **Stopping-rule vs. choice-rule distinction**: Mixing these makes satisficing seem irrational. | reasonable simplification | Simon focused on satisficing as a stopping rule (when to end search), not a choice rule (how to pick from found options). The distinction clarifies why satisficing isn’t irrational. | This accurately untangles confusion: stopping early due to costs isn’t flawed; choosing poorly from options might be. | Over-splitting the rules might obscure how real decisions blend both (e.g., thresholds affect what’s considered). |
  | **Cheap search kills satisficing**: Automation collapses satisficing into maximizing. | misstates Simon | Simon argued that even with low *computational* costs, satisficing persists due to unclear goals, changing environments, or unquantifiable values. | If all options/weights are perfectly known and static, optimization *is* feasible—but this is rare in messy real worlds. | You’d assume objective scores capture "true" value, neglecting how weights themselves are subjective and fluid. |

