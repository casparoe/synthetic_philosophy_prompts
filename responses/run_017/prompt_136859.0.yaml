prompt: |-
  I am a retired physical chemist who has lately been attending, as a paying guest, a reading group on the philosophy of language run by the local university's continuing-education programme. We have been working slowly through the mid-century lectures on performative utterance, and at our last meeting two members of the group — I shall call them Miriam and Douglas — became entangled in a case of Miriam's own devising. In my own subject one was trained to ask which variable a result actually depends on; I suspect that something of that sort is at issue here, but I cannot locate it, and the group adjourned with nobody willing to referee.

  The case. A department chair, speaking at a public lecture in honour of a retiring colleague, turns to a research fellow in front of the whole audience and says: I promise you the department will renew your contract. Renewals are in fact decided by a college committee, which had already, in closed session, voted against this renewal; the chair knew that. The contract was not renewed.

  The exchange, as nearly as I can reproduce it:

  1. Miriam. No promise was made, and therefore none was broken. For an utterance in the first person present indicative to be the doing of something rather than merely the saying of something, there must be an accepted conventional procedure, and the speaker must be the appropriate person, in the appropriate circumstances, to invoke it. Renewal is the committee's to decide; the chair had no standing to invoke the procedure. Her words are not a broken promise but a failed one — void from the outset, like a ship christened by somebody who has wandered in off the street.

  2. Douglas. That puts the cart before the horse. The fellow, and everyone in the hall, took her to have committed herself; uptake was complete. If want of formal authority voided a promise, then every promise whose fulfilment needs the cooperation of others would be void, and promising would be a far narrower practice than it is. Besides, her office gives her partial standing: she can at any rate promise to press the committee. A doctrine that lets speakers escape by pointing at their own lack of authority has the incentives backwards.

  3. Miriam. Then distinguish promising to press the committee from promising that the committee will renew. She said the latter. I promise that P, where P is not within my control, is of a piece with I promise it will rain tomorrow: the grammar of a promise wrapped around the content of a forecast. What she issued was at most an emphatic assurance, and an assurance can be true or false. This one was false, and she knew it. So the case is not a defective promise at all; it is a knowingly false statement — a lie — and the promise machinery is a red herring.

  4. Douglas. Two difficulties. First, the lie: on the usual account a lie is an assertion of what one believes to be false, made with the intent to deceive, and promising is not the sort of thing that is true or false. One can of course lie about one's intentions, and the utterance plainly implies that one has them — but that implication is not the promise, so the charge of lying has to be made out indirectly, and you have not made it out. Second, change the case: the committee has not yet voted, and she says the same sentence purely to get through the ceremony, with no intention of lifting a finger. Now nothing is settled, so there is no false forecast; yet plainly something is wrong with the utterance. What is wrong is that she invoked the procedure without the frame of mind the procedure calls for: the act comes off, but hollowly. Our author marks this as a defect distinct from the one you described, and you are collapsing the two.

  5. Miriam. I accept the two defects. But look what follows. In the case as actually posed the utterance is arguably all three things at once: it comes off, because there was uptake and the audience took her office to confer standing; it is hollow, because she had no intention of acting; and it is a false assurance, because the vote was already in. When one utterance exhibits three defects simultaneously, the taxonomy is not doing the explanatory work. What is doing the work is that she stood up in public and invited a particular person to rely on her, in circumstances where he could not easily check, and he did rely. Whether we file that under promise, assurance, or something else is bookkeeping. Whatever obligation she is under — to explain herself, to repair what she can, not to do it again — is generated by the reliance and the publicity, not by the label.

  6. Douglas. The label is not mere bookkeeping, and a second case shows it. The university's central registry sends automatically, to every applicant, a message reading: We promise you a decision within twenty working days. No human being has read that message; it is assembled by a script and sent in the small hours. If labels do no work, then something has been promised to forty thousand people. But promising seems to require somebody who promises — precisely the standing you insisted on. So either the message is no promise at all, in which case the university has promised nothing, or standing is not required after all. Yet the university is plainly answerable if no decision arrives, whether or not anybody promised anything. So the notion of standing does real work: you need it to handle the machine, even though you overused it against the chair.

  7. Miriam. The machine helps me rather than you. Scripts do not speak, but institutions do; the script is an organ of the university in the way a signature stamp is an organ of a signature. What the message lacks is not a speaker but a speaker with the right relation to what is promised — and the registry does stand in the right relation to decisions about decisions. So both cases turn on one thing: whether the speaker stands in the right relation to the outcome promised. The chair did not. The registry did.

  8. Douglas. Then your own principle runs the other way. The chair was not speaking privately; she was speaking as the head of her department, at a departmental occasion, in the department's name — which is just the sort of institutional voice you invoked for the script. If the university speaks through its registry, the department speaks through its chair. So the department promised, which is exactly what you denied at the outset.

  I have tried to report both of them fairly, and I have no view of my own to offer; I found myself persuaded alternately, which in my experience is a sign that something has been left unspecified.

  Would you adjudicate the exchange? I should be grateful for three things. First, a verdict on each of the eight moves — sound, sound but incomplete, half right, or mistaken — with a sentence or two of justification apiece, since I am more interested in where each argument fails than in who wins the evening. Second, a judgement about who has the better of the argument overall. Third, an account of what both parties are missing: whether the disagreement is in part merely verbal, and whether there is a distinction that neither of them draws — for instance between what an utterance accomplishes by convention and what it merely brings about by being heard, or between the act a speaker performs and the further effects of its being performed in public — that settles some point both left open.
reasoning: |-
  Hmm, the user is a retired physical chemist who's attending a philosophy of language reading group. They've presented a detailed debate between two members (Miriam and Douglas) about whether a department chair's utterance constituted a promise. The user wants me to adjudicate the exchange by evaluating each of their eight arguments, determining who has the better overall position, and identifying what both parties might be missing.

  This case centers on J.L. Austin's theory of performative utterances - specifically whether "I promise you the department will renew your contract" counts as a valid promise when the chair lacks authority to fulfill it. Miriam argues it's not a promise at all since proper conditions aren't met, while Douglas contends the social uptake makes it a promise despite defects.

  Let me break down each move systematically:

  Miriam's first argument (Move 1) correctly applies Austin's felicity conditions - the chair lacked institutional standing, so the utterance was void. This is sound per Austin's framework. Douglas's counter (Move 2) makes a good practical point about social perception but overreaches by dismissing authority too broadly - it's incomplete without distinguishing types of promises.

  In Move 3, Miriam correctly distinguishes promising an action vs an outcome, but wrongly reduces it to a simple false statement. Douglas's Move 4 effectively shows the complexity by separating defects - hollow promise vs false assurance - though he overstates the "lie" point.

  Miriam's Move 5 insightfully identifies the core issue of induced reliance but wrongly dismisses taxonomy as "mere bookkeeping." Douglas's machine example in Move 6 cleverly challenges her stance but his institutional analogy fails in Move 8 - departments don't "speak" like central registries.

  Both miss key distinctions: institutional vs personal authority, different defect types in Austin's taxonomy (misfire vs abuse), and crucially - the difference between what the utterance conventionally performs versus its causal effects. The chair might be morally responsible for inducing reliance without having performed a conventional promise.

  Overall, Douglas has the better argument by emphasizing social reality of commitment, but Miriam correctly spots his institutional overreach. The unresolved core is whether "standing" requires personal capacity to fulfill or institutional position to commit - which Austin doesn't fully specify.
answer: |-
  Your background in scientific precision serves you well here—this debate hinges on unresolved distinctions. Below is a structured adjudication, following your three requests. I draw primarily on Austin’s framework (*How to Do Things with Words*), while noting where both parties extend or confuse it.  

  ---

  ### **1. Verdict on Each Move**  
  *(Key: Austin’s core conditions for felicitous performatives: conventional procedure, appropriate speaker/circumstances, sincerity, and "uptake.")*  

  - **Move 1 (Miriam): Sound but incomplete.**  
    *Justification:* Correct that authority is necessary for a *felicitous* promise (Austin’s "appropriate person" condition). But she overlooks that infelicity doesn’t always void the act—it may merely "misfire" (defective) or be "abused" (insincere).  

  - **Move 2 (Douglas): Half right.**  
    *Justification:* Right that uptake creates *social commitment* (Austin agrees uptake is essential). Wrong to dismiss authority entirely: standing isn’t binary—e.g., promising *to advocate* vs. promising *an outcome* are distinct acts (as Miriam notes).  

  - **Move 3 (Miriam): Mistaken.**  
    *Justification:* Incorrectly conflates a promise with a true/false statement. Promising *that P* (where P is outside one’s control) is not inherently void—e.g., "I promise I’ll convince the committee" is valid. Austin distinguishes *illocutionary* acts (e.g., promising) from *perlocutionary* effects (e.g., assurance).  

  - **Move 4 (Douglas): Sound.**  
    *Justification:* Correctly separates defects: (a) *hollow promise* (insincerity) vs. (b) *false assurance* (misrepresentation). Also right that lying requires asserting a believed-false proposition—promising isn’t asserting.  

  - **Move 5 (Miriam): Half right.**  
    *Justification:* Right that *reliance and publicity* create obligations (a moral, not Austinian, point). But wrong to dismiss taxonomy: Austin’s defects explain *how* the act failed (e.g., misfire vs. abuse), which informs responsibility.  

  - **Move 6 (Douglas): Sound but incomplete.**  
    *Justification:* Aptly shows institutions can promise via proxies (e.g., automated scripts as "conventional procedures"). But he conflates *institutional* standing (registry) with *personal* authority (chair)—the latter lacks power over outcomes.  

  - **Move 7 (Miriam): Sound.**  
    *Justification:* Correct that institutions act through organs (registry ↔ signature stamp). The registry *does* have standing over *process* (timely decisions), unlike the chair over *outcomes*.  

  - **Move 8 (Douglas): Mistaken.**  
    *Justification:* False equivalence: the registry is a *delegated* authority for admissions, while the chair has no delegation for contract decisions. "The department speaks through the chair" is poetic but institutionally unsupported.  

  ---

  ### **2. Who Has the Better of the Argument?**  
  **Douglas edges ahead, but narrowly.**  
  - **Strengths:** He consistently grounds his view in Austin’s emphasis on *uptake* and social practice. His "hollow promise" distinction (Move 4) and institutional example (Move 6) expose gaps in Miriam’s formalism.  
  - **Weaknesses:** He underplays authority (Move 2) and overextends institutional voice (Move 8).  
  - **Miriam’s counter:** She identifies key limits of standing (Moves 1, 7) and the reliance/publicity point (Move 5), but her conflation of acts (Move 3) and dismissal of taxonomy weaken her case.  

  ---

  ### **3. What Both Parties Miss**  
  The disagreement is **partly verbal** (e.g., defining "promise" too broadly/narrowly) but mostly stems from **unresolved distinctions**. Key gaps:  

  #### **a. Distinction Between:**  
  - **Conventional vs. Causal Effects:**  
    Austin distinguishes:  
    - *Illocutionary act:* What is done *in* speaking (e.g., promising by convention).  
    - *Perlocutionary act:* What is achieved *by* speaking (e.g., inducing reliance).  
    **→ Miriam** focuses on illocutionary failure (no valid promise). **Douglas** focuses on perlocutionary success (reliance created). Both are real but distinct.  

  - **Personal vs. Institutional Authority:**  
    - *Personal promises* require capacity to fulfill (e.g., "I’ll buy you coffee").  
    - *Institutional promises* require delegated authority (e.g., "We promise a decision").  
    **→ The chair** mixed these: she spoke *as* an institution but promised an outcome outside her remit.  

  #### **b. Austin’s Defect Taxonomy Underexplored:**  
    - **Misfire:** Procedure void (e.g., no standing → Miriam’s view).  
    - **Abuse:** Procedure valid but insincere (e.g., hollow promise → Douglas’s view).  
    - **Both apply here:** The utterance *misfires* as a promise of renewal (no authority) but *succeeds abusively* as a promise to advocate (if uptake occurs). Neither party disentangles this.  

  #### **c. The Unspecified Variable:**  
    The core ambiguity is **what "I promise that P" commits the speaker to.** Austin notes promising inherently commits to *future action*. When *P* is an outcome ("renewal"), the commitment is:  
    - Either to *make P true* (requiring direct control),  
    - Or to *act toward P* (requiring influence).  
    **→ The chair’s utterance fails the first but could satisfy the second**—if "the department will renew" implies her advocacy. Context suggests the latter, but neither argues this.  

  ---

  ### **Conclusion**  
  The debate stalls because Miriam and Douglas collapse:  
  - Illocutionary validity (conventional) vs. perlocutionary impact (causal),  
  - Authority over actions vs. outcomes.  
  **Resolution:** The chair’s utterance is a **misfired promise** (she cannot commit to renewal) but a **successful, hollow promise to advocate** (she invited reliance without intent). Thus, she is:  
  - Not guilty of a *broken promise* (no authority to commit to renewal),  
  - Guilty of *deception* (falsely implying she’d act) and *betrayal of reliance* (perlocutionary harm).  

  Austin’s taxonomy *does* explain this—if defects are seen as overlapping, not mutually exclusive. The "variable" left unspecified is **the scope of commitment in promises of outcomes**, which turns on context and speaker intent. Your physical intuition is apt: the result (obligation) depends on *both* the conventional act (illocution) and its causal consequences (perlocution).
