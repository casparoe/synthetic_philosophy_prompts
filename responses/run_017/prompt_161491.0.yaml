prompt: |-
  Hey — I sit on the internal safety review board where I work (I'm a software engineer on the planning team for our self-driving stack), and we have to put an actual written policy for unavoidable-crash scenarios together before the next release ships. Draft the decision memo I'll circulate: recommend a concrete policy, with reasons the losing side could actually respond to.

  The fight on the board is basically this. Half of us want the planner to just minimize expected harm — brake hard, and if braking isn't enough, pick the trajectory with the fewest weighted casualties, passenger counted in like anybody else. The other half thinks that's radioactive and wants hard constraints instead: the car may never steer into someone who wasn't already going to be hit even if that saves two other people, and it may never trade its own passenger's life for pedestrians. Someone said the second view is basically the trolley-problem / doctrine-of-double-effect distinction. I've got no philosophy background, but as I understand it the claim is that there's a moral difference between harm you bring about as a side effect of aiming at something good and harm you use as a means to get it, plus something about intending versus merely foreseeing.

  What I need in the memo:

  - A clean mapping of our real engineering choices onto that distinction. Our system is a learned policy, not a rulebook — nobody writes "if five pedestrians then swerve," the behavior falls out of a cost function and training data. So whose intention is the doctrine even about: the engineers', the company's, the passenger who bought the car, or nobody's? If the doctrine genuinely has nothing to say about a system with no intentions, say that plainly instead of stretching it to fit.
  - Where the distinction actually bites for us and where it doesn't. Two cases I care about: (a) the car can brake and hit one jaywalker, or swerve and hit one person standing safely on the sidewalk — same number of deaths, different people; (b) the car can swerve to put the crash onto its own passenger and thereby avoid killing two kids. My gut says the doctrine lets (a) through but not (b), and I can't tell whether that's the doctrine talking or just my gut.
  - The strongest version of the pure harm-minimization side, written well enough that those people feel heard — including whether a "never sacrifice the passenger" constraint is really about the passenger at all, or about nobody buying the car and regulators losing their minds, i.e. whether we're dressing up a PR judgment as ethics.
  - Anything the framework is silent on that we'll have to decide anyway. I suspect near-ties and uncertainty are one: what does "fewest expected deaths" even mean when the planner is guessing at 60% confidence? Say where it's silent rather than forcing an answer.

  Keep it to about a page of actual content, no citations, and don't lecture me on the canon — I want something I can drop in front of the board on thursday.
reasoning: |-
  Okay, let me unpack this user's request. They're a software engineer on a self-driving car team needing a policy memo for unavoidable crash scenarios, with a tight deadline and very specific philosophical tensions to address. 

  First, I need to map their engineering reality to the ethical frameworks they mentioned. Their system uses learned policies, not explicit rules - so the "intention" in doctrine of double effect becomes tricky. Who even has intentions here? The engineers designing the cost function? The neural net making microsecond decisions? The passenger? I should clarify that DDE might not cleanly apply to probabilistic systems without conscious intent.

  The user highlighted two critical test cases: (a) same harm to different parties (jaywalker vs sidewalk pedestrian) and (b) sacrificing passenger to save others. My gut says DDE would allow (a) but forbid (b), but I need to verify if that's accurate or just bias. The harm-minimization camp seems more consistent here, but the memo must acknowledge their opponents' valid concerns about public perception and adoption.

  For the memo structure: Start by neutrally framing the debate, then dissect how DDE applies (or doesn't) to their ML system. Explicitly call out where it's silent - like uncertainty handling or near-ties. The recommendation should thread the needle: adopt harm-minimization but with constraints that address DDE's core concerns about instrumentalizing harm. 

  Biggest challenge: Making the "losing side" feel heard. Their PR fears are legitimate - regulators and consumers might revolt if cars "choose" to kill passengers. But dressing it up as ethics would be dishonest. The memo should separate the ethical argument from practical survivability concerns.

  Also need to flag operational gaps: How to weight passenger vs pedestrian? How handle confidence intervals? These can't be philosophy questions - they're engineering decisions with moral weight. The memo should force these to surface without prescribing answers.
answer: |-
  ## Internal Safety Review Board: Recommended Policy for Unavoidable-Crash Scenarios

  **To:** Internal Safety Review Board  
  **From:** [Your Name], Planning Team SWE  
  **Date:** [Date]  
  **Subject:** Recommended Policy for Unavoidable-Crash Decision Logic  

  ### 1. Core Recommendation: Constrained Harm Minimization
  We recommend adopting **Harm Minimization as the primary ethical objective**, operationalized by minimizing expected harm (weighted by injury severity and probability) across *all* affected parties, including passengers, pedestrians, and other road users. **However, this objective must be constrained by a strict prohibition: The vehicle must never intentionally select a trajectory where harming a specific individual or group is the *direct means* to achieve a greater good.**  

  ### 2. Mapping the Distinction to Our System
  The Doctrine of Double Effect (DDE) focuses on intentions – distinguishing *intended harm as a means* from *foreseen but unintended harm as a side-effect*. Our challenge is that **our system lacks conscious intent.** The "intention" is effectively encoded in the cost function by the engineers. Therefore, the relevant question becomes:  
  *   **Does the cost function incentivize trajectories where harm to a *specific* person/group is *instrumental* (i.e., a necessary step) to reducing total harm?**  
  *   **Or does it minimize harm overall, where harm to specific individuals is an unavoidable consequence of the least-bad option?**  

  The DDE distinction *can* map onto cost function design: we can avoid creating incentives that treat specific harm as a tool.  

  ### 3. Where the Distinction Bites: Analyzing Critical Cases
  *   **Case (a): Brake & Hit Jaywalker vs. Swerve & Hit Sidewalk Pedestrian:**  
      *   **Harm Min:** Logically equivalent. Either trajectory minimizes harm (1 fatality). Choice depends on other factors (e.g., collision severity probabilities).  
      *   **DDE View:** Neither trajectory involves *intending* harm as a *means*. Harm is a side-effect of avoiding a different harm or following a path. **This scenario falls *outside* DDE's core prohibition.** A DDE-inspired constraint would likely allow either outcome based on secondary factors.  
  *   **Case (b): Swerve to Sacrifice Passenger to Save Two Kids:**  
      *   **Harm Min:** Swerving minimizes expected harm (1 fatality vs. 2).  
      *   **DDE View:** This is the critical case. Swerving *intentionally* directs the vehicle towards the passenger (the means) to achieve the good of saving the kids. **This violates DDE's prohibition on using harm as a means.** A DDE-inspired constraint would forbid this trajectory.  
      *   **Engineering Reality:** In a learned system, the cost function achieving this *must* assign a lower cost to passenger harm relative to pedestrian harm *specifically when it enables saving others*. This creates the problematic "instrumentalization" incentive.  

  ### 4. Arguments for Pure Harm Minimization (Acknowledged)
  The pure harm-minimization perspective argues:  
  *   **Fundamental Ethics:** The only ethical imperative is to reduce net suffering. Assigning equal intrinsic value to all lives demands this. Deliberately choosing a worse outcome (2 deaths > 1 death) is morally indefensible.  
  *   **Practicality & Consistency:** A learned system optimizing for overall safety will naturally trend towards harm minimization. Trying to carve out complex ethical exemptions (like DDE) distorts the cost function in ways that are difficult to specify, verify, and train, potentially leading to *more* unpredictable or harmful behaviors elsewhere.  
  *   **The "Passenger Constraint" Question:** Proponents argue a blanket "never sacrifice passenger" rule is often **driven by pragmatic, not purely ethical, concerns:**  
      *   **Market Acceptance:** Consumers will reject vehicles perceived to prioritize others over them.  
      *   **Regulatory & Liability Risk:** Regulators and courts may struggle with intentional self-sacrifice logic.  
      *   **Implementation Bias:** Defining "sacrifice" operationally is fraught; a poorly implemented constraint could *increase* overall risk.  
      They contend these are valid *business* and *societal* considerations, but framing them as an *ethical imperative* (like DDE) may be disingenuous.

  ### 5. Why Constrained Harm Minimization?
  This recommendation balances the core ethical force of harm minimization with the significant concerns raised by DDE and market realities:  
  1.  **Ethical Alignment:** It captures the primary goal of minimizing suffering.  
  2.  **Addresses DDE Core Concern:** It explicitly forbids the most ethically fraught scenario (Case b) – instrumentalizing harm – which is the strongest objection from the DDE side.  
  3.  **Practical Feasibility:** This constraint is more feasible to encode and verify than a blanket DDE rule: we can detect cost functions where reduced passenger cost *directly triggers* a trajectory choice saving others.  
  4.  **Market Reality:** It inherently avoids the most market-toxic outcome (intentional passenger sacrifice) without needing a separate, potentially distorting, "passenger first" rule.  
  5.  **Handles Case (a):** It permits the system to choose the least harmful path in ambiguous same-harm scenarios without violating a core ethical principle.  

  ### 6. Where Frameworks Are Silent (Requiring Further Decisions)
  *   **Weighting Lives:** Harm minimization requires weighting (e.g., fatality vs. severe injury). DDE offers no guidance here. **Decision Needed:** How do we weight passenger vs. pedestrian harm *in non-instrumentalization scenarios*? Is a passenger fatality weighted equally?  
  *   **Uncertainty & Near-Ties:** Neither framework dictates how to handle probabilistic predictions (e.g., 60% chance of fatality vs. 90%) or trajectories with nearly identical expected harm. **Decision Needed:** What probability threshold constitutes "unavoidable harm"? How do we handle negligible expected harm differences? (e.g., robust tie-breaking rules).  
  *   **Defining "Instrumentalization":** Precise operational criteria are needed. **Decision Needed:** How do we technically define and test that harm to A is not being used as the *means* to save B? (Focus on cost function structure and gradient analysis).  

  ### Conclusion
  We recommend **Constrained Harm Minimization** as the most ethically defensible, operationally feasible, and pragmatically viable policy. It prioritizes reducing overall harm while directly addressing the most significant ethical objection (instrumentalizing harm) and market risk (intentional passenger sacrifice). This approach resolves Case (b) definitively, allows flexibility in Case (a), and clearly highlights the critical weighting and uncertainty decisions we *must* make next. This policy provides a clear engineering target: optimize the cost function for minimal expected overall harm, subject to the verifiable constraint that the trajectory never relies on harming one party as the direct instrument to save another.
