  ### **1. The Game: "Project Launch"**  
  **Objective:** Decide whether to launch a project for your group. Each launch affects everyone. Your goal is to maximize group points.

  #### **Materials:**
  - **True Value (V) Bag:** 10 index cards (6 labeled "20", 3 labeled "-20", 1 labeled "-100").
  - **Noise Deck:** A standard deck of playing cards for generating private signals.
  - **Role Cards:** Index cards for assigning trigger-holder status (prepared per round).
  - **Scoring:** Points per round = `V` if launched, `0` if not. Total points across rounds determine chocolate shares (e.g., 1 chocolate per 10 points).

  #### **Distributions:**
  - **True Value (V):** Drawn from the bag:  
    - 60% chance of `V = 20` (modest gain),  
    - 30% chance of `V = -20` (modest loss),  
    - 10% chance of `V = -100` (large loss).  
  - **Private Signal (S):** Your estimate of `V`. Computed as `S = V + E`, where noise `E` is drawn from the deck:  
    - ♠️♣️ **Black number card (2-10):** `E = -30`  
    - ♥️♦️ **Red number card (2-10):** `E = +30`  
    - **Face card (J, Q, K) or Ace:** `E = 0`  

  #### **Roles:**
  - **Trigger-Holder:** Can launch the project if their signal `S > 0`.  
  - **Non-Holder:** Receives a signal but cannot launch; affected by outcomes.  
  Roles assigned randomly per round via role cards in a cloth bag.  

  #### **Procedure per Round:**
  1. **Draw True Value:** Facilitator draws one card from the V bag (hidden).  
  2. **Assign Roles:** Each draws a role card. Only trigger-holders can act.  
  3. **Generate Signals:** Facilitator draws one noise card per participant from the shuffled deck, computes `S = V + E`, and privately shares `S`.  
  4. **Decision:** Trigger-holders decide: **Launch** (if `S > 0`) or **Refrain** (if `S ≤ 0`). Write choice on an index card.  
  5. **Outcome:** If ≥1 trigger-holder launches, project runs (all get `V`). Else, no project (all get `0`).  
  6. **Reveal & Record:** True `V` revealed. Results logged on the whiteboard.  

  ---

  ### **2. Sequence of Rounds**  
  **Total Rounds:** 12 (80 mins).  
  **Group Size Variation:** Role cards allocate trigger-holders per round:  
  - **Rounds 1–5:** Vary trigger-holder count (`n`): 1 → 3 → 6 → 9 → 18.  
  - **Rounds 6–8:** Alternative rules (see below).  
  - **Rounds 9–12:** Complications and open deliberation.  

  **Whiteboard Record:**  
  | Round | n (Triggers) | True V | Launched? | Score |  
  |-------|--------------|--------|-----------|-------|  

  #### **Engineered Moments:**  
  - **Moment 1 (Large Group Loss):** In a `n=18` round, set `V = -20`. Most signals will be `≤0` (non-positive), but signals `=10` (noise `+30`) occur ~35% of the time. With 18 trigger-holders, ≥1 will likely launch, causing a loss.  
  - **Moment 2 (Size Penalty):** Use rounds where `V = -20`. Small groups (`n=1/3`) often refrain (noise `+30` is rare), scoring `0`. Large groups (`n=9/18`) usually launch, scoring `-20`. Scores decrease with `n` despite same signals.  

  **Adjusted Numbers:** Noise `±30` ensures heavy-tailed downside (large loss possible) and forces divergence between private signals and true value.  

  ---

  ### **3. Alternative Rules & Complications**  
  #### **Rounds 6–8: Decision Rules**  
  - **Round 6: Majority Vote**  
    Trigger-holders vote via index cards. Majority wins.  
  - **Round 7: Unanimity**  
    All trigger-holders must agree to launch.  
  - **Round 8: Delegation**  
    One randomly chosen trigger-holder decides alone.  

  **Expected Scores (Theoretical):**  
  | Rule          | Expected Score | Why? |  
  |---------------|----------------|------|  
  | Any-One (Baseline) | 6.0 | Optimistic errors dominate large groups. |  
  | Majority Vote | 7.2 | Pooling reduces individual errors. |  
  | Unanimity     | 8.4 | Pessimistic errors prevent bad launches. |  
  | Delegation    | 7.5 | Depends on one person’s signal. |  

  #### **Rounds 9–12: Complications**  
  - **Round 9: Private Benefit**  
    Whoever launches gets `+5` points, but losses (`V < 0`) are shared. Tests selfish incentives.  
  - **Round 10: Pay to Vote**  
    Trigger-holders can pay `2` points to force a synchronous vote. Tests costly coordination.  
  - **Round 11: Expert Triggers**  
    3 participants get low-variance signals (`E = -10, 0, +10`). Only they can launch. **Verdict:** Reduces errors but relocates bias to "experts" – if their signals err, group suffers.  
  - **Round 12: Open Deliberation**  
    Groups discuss before deciding. **When it helps:** Diverse signals pooled (e.g., "I saw -50" + "I saw +10" → true `V = -20`). **When it hurts:** Shared optimistic argument (e.g., "I saw +10!") repeated, treated as independent evidence.  

  **Final Round:** Group proposes/uses its own rule.  

  ---

  ### **4. Participant Rules Sheet**  
  **Project Launch: Rules**  
  - **Goal:** Maximize group points. Points determine chocolate shares.  
  - **Each Round:**  
    1. A hidden project value (`V`) is drawn.  
    2. You receive a private signal (`S`) estimating `V`.  
    3. If you are a **trigger-holder**, you may launch the project for everyone.  
       - Launch only if your signal `S > 0`.  
    4. **Outcome:**  
       - If **any** trigger-holder launches, all get `V`.  
       - If **none** launch, all get `0`.  
    5. Roles and group size change each round.  
  - **Scoring:** Points = `V` (if launched) or `0` (if not). Negative points possible.  
  - **Discuss only when instructed.**  

  ---

  ### **5. Debrief Script**  
  **Key Moments:**  
  - **Round 4 (`n=18`, `V=-20`):** Most saw non-positive signals, but one optimistic signal (`S=10`) launched the project. This is the **unilateralist’s curse** – the most optimistic error triggers action for all.  
  - **Whiteboard Pattern:** For `V=-20`, large groups launched despite aggregate evidence against. Effective evidence threshold for action was `S>0`, but the *group’s* evidence was `V<0`.  

  **Why This Isn’t:**  
  - **Groupthink:** No conformity pressure; decisions are private.  
  - **Tragedy of Commons:** No resource depletion; it’s an information problem.  
  - **Optimism Bias:** Signals are unbiased; the curse arises from *structural asymmetry* (any-one can act).  

  **Why Fixes Fail:**  
  - **Better Info/Communication:** Helps if evidence is pooled (e.g., majority vote), but open discussion can amplify shared errors.  
  - **Decision Rules Work:** Unanimity/majority force consensus, blocking unilateral action.  

  **When It Doesn’t Apply:** No asymmetry (e.g., unanimous consent).  

  ---

  ### **6. Predictable Problems & Fixes**  
  | Problem | Fix |  
  |---------|-----|  
  | Triggering out of curiosity | Emphasize scoring: "Launch only if `S>0`." |  
  | Inferring others' knowledge | Stress: "Your signal is private and noisy." |  
  | Attempts to coordinate | Run rounds silently; ban communication unless specified. |  
  | Unlucky samples hiding the effect | Use pre-set `V=-20` for large/small group rounds. |  
  | Chocolate-driven risk-taking | Score privately; distribute chocolates post-game. |  
  | Confusion over roles | Clarify: "Only trigger-holders decide; others observe." |  

  **Limitations:**  
  - Cannot reproduce **irreversibility** (real launches are final) or **unbounded stakes** (e.g., existential risks).  
  - **Individual vs. Group:** The game shows *group* bias, but the *reason to refrain* is ethical: triggering imposes risks on others. State this explicitly.  

  **Run Time:** 80 mins = 5 mins setup + 60 mins gameplay (5 mins/round) + 15 mins debrief.  

  Let the game begin! 🍫
