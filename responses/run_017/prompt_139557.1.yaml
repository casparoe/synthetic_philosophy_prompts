  | **Component**               | **Status in Type Theory**                                  |
  |------------------------------|------------------------------------------------------------|
  | **Factivity (ε)**            | Exact comonad citizen.                                     |
  | **Distribution (str)**       | Natural if `□` is strong.                                  |
  | **Knowability Principle**    | Forced: `◇` must interact with `□` via `k_princ`.          |
