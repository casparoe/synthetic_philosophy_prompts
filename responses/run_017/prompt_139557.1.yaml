     - We need the frame to have the property that if we derive a contradiction at an accessible world, then the possibility of that world's content is false at the current world. This is built into the meaning of `◇`.
     - Classical metatheory for the final step.

     We can state a general no-go theorem for a comonad `K` and a monad `◇`:

     **Theorem**: Let `K` be a strong comonad on a cartesian closed category (or at least with products) and let `◇` be a monad. Suppose we have a natural transformation `η : Id → ◇K` (the knowability principle). Then, if there exists an object `p` and morphisms `h : 1 -> p` and `h' : p -> (K p -> 0)` (where `0` is initial), then the category is trivial (i.e., `0` is terminal).

     Proof sketch: Form the object `m = p × (K p -> 0)`. Then we have a morphism `f : 1 -> m` (from `h` and `h'`). Then `η_m : m -> ◇K m`. Also, we can define a morphism `g : K m -> 0` as follows: 
          g : K m = K (p × (K p -> 0)) 
            -> K p × K (K p -> 0)   [by strength]
            -> K p × (K (K p -> 0) -> (K p -> 0))   [by counit at `K p -> 0`?] 
            But note: we have the counit `ε : K (K p -> 0) -> (K p -> 0)`. 
            So we have: `snd : K p × K (K p -> 0) -> K (K p -> 0)`, then compose with `ε` to get `K p × K (K p -> 0) -> (K p -> 0)`. 
            Then we can apply the first component to that function: 
            `(k1, k2) ↦ ε(k2)(k1) : 0`.

          So we have `g : K m -> 0`.
          Then by functoriality of `◇`, we have `◇g : ◇K m -> ◇0`.
          Then we have a composite: `1 -> m -> ◇K m -> ◇0`.

          Now, if we have a morphism `◇0 -> 0` (which says that the possibility of absurdity is absurd), then we get `1 -> 0`, so the category is trivial.

          Without `◇0 -> 0`, we only get `1 -> ◇0`. But if the category is non-trivial, this might be acceptable. 

     However, in the setting of the paradox, we also have the initial assumption that there is an unknown truth, which gives `1 -> m`, and then we get `1 -> ◇0`. If we assume that `◇0` is initial (which is the case in many modal logics) then we have a contradiction.

     Therefore, the minimal package includes:
        - A strong comonad `K`
        - A monad `◇`
        - A natural transformation `η : Id -> ◇K`
        - The initial object `0` is not isomorphic to the terminal object (non-triviality)
        - The object `◇0` is initial (which is true if `◇` preserves initial objects, as in many modal logics)
        - The existence of an object `p` with `1 -> p` and `p -> (K p -> 0)`.

     Then we get a contradiction.

     So the no-go theorem is: there is no non-trivial model of the above structure with an unknown truth.

  3. **Restriction and stratification**:
     If we use universe stratification for the class `R`, then the Moorean proposition `m` for `p` in a universe `U_i` is in a higher universe `U_{i+1}` (because `K p` is in `U_i` and `K p -> ⊥` is in `U_{i+1}`). Then the knowability principle only applies to propositions in `U_i`, so we cannot instantiate it for `m` in `U_{i+1}`. 

