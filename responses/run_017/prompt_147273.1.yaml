  The blog summary presents a view where blameworthiness depends solely on the action, while standing depends on the blamer. It claims hypocrites lack standing because they don't truly accept the norm they're invoking, and suggests this makes standing rare enough to be a "dead end" in the literature - which contradicts the recent papers the user read.

