  Regarding their specific questions: The "you too" reply doesn't negate blameworthiness but undermines the blamer's authority - this is crucial. And no, it doesn't follow that standing is usually absent; many philosophers argue we can blame if we're generally committed to norms despite occasional lapses.

  Now for their ideas: The "apostate exemption" has merit and resembles what Coates and Tognazzini call "candor" - it addresses the insincerity concern in hypocrisy. But it doesn't fully resolve the deeper issue of whether the hypocrite can sincerely demand compliance. The scalar standing idea is plausible but underexplored in literature; Wallace's "hypocrisy spectrum" is the closest reference.

  I should be honest about confidence levels: The jurisdictional point and non-rarity of standing are defensible claims. The apostate exemption's similarity to existing concepts is medium confidence, while scalar standing is more speculative. The user's suspicion about the blog's "dead end" claim is spot-on - recent work by Todd, Fritz, and others actively develops standing theories.

  I'll structure this clearly: first unpack the blog summary, then address their two main questions, then evaluate their ideas with confidence markers, all under 600 words. The key is to validate their skepticism while giving them usable insights for their presentation.
answer: |-
  Here's a breakdown of the blog summary, your questions, and your ideas, with confidence levels marked:

  **Blog Summary Breakdown (Specialist Perspective):**
  1.  *"Whether someone is blameworthy depends only on what they did..."*: **Broadly accepted** (Defensible). Blameworthiness is typically agent-focused (Scanlon, Duff agree).
  2.  *"...whether you have standing to blame them is a separate question about you."*: **Accepted core idea** (Defensible). Standing is distinct from blameworthiness itself (T.M. Scanlon, R.A. Duff, Macalester Bell).
  3.  *"A hypocrite... lacks standing..."*: **Common view, but debated** (Defensible core, nuance required). Hypocrisy is widely seen as defeating standing, but *why* is contested.
  4.  *"...so his blame is unwarranted: the person he's blaming can properly answer 'you too'..."*: **Simplification.** The "you too" *defeats the hypocrite's standing*, not necessarily the *truth* of the blame. The target *might* still be blameworthy; the hypocrite just can't *voice* it authoritatively.
  5.  *"...the blame just misfires... like a court with no jurisdiction."*: **Strongly accepted analogy** (Defensible). Jurisdictional metaphors are common (e.g., Duff).
  6.  *"What really matters isn't the hypocrisy itself... it's that the hypocrite doesn't accept the norm..."*: **Contested simplification.** While insincerity/non-acceptance is a major view (Scanlon), others argue hypocrisy *itself* is the problem (e.g., it's unfair, undermines trust; Wallace, Todd). Hypocrisy *is evidence* of non-acceptance, but not necessarily identical.
  7.  *"...since none of us lives up fully... most of us lack standing most of the time..."*: **Overstated/Wrong.** Most contemporary theorists **reject** this implication (Defensible). They argue: a) We can blame if *committed* to the norm despite occasional failures; b) Standing requires *minimal consistency* or *sincerity*, not perfection (Duff, Wallace, Coates & Tognazzini). The "dead end" claim reflects early worries, not current consensus.
  8.  *"...standing to blame turned out to be a dead end."*: **Factually wrong.** Standing is a **vibrant area** (e.g., recent work by Patrick Todd, Kyle Fritz, Maria Seim, R.J. Wallace, Macalester Bell, Ben Bagley). Your suspicion is correct.

  **Your Specific Questions:**
  1.  *"You too" reply:* It **doesn't cancel the blameworthiness** of the target's act. It **defeats the standing** of the *particular blamer* due to their hypocrisy. The blame "misfires" *from that person*; it doesn't mean the act wasn't wrong or that others couldn't legitimately blame. (Defensible)
  2.  *Does it follow we almost never have standing?* **No.** As noted in point 7 above, mainstream views reject this. Standing requires reasonable consistency/sincerity/avoidance of relevant hypocrisy, not sinless perfection. (Defensible)

  **Your Ideas:**
  1.  *Apostate Exemption ("I lie constantly, don't lie"):* **Plausible & Discussed** (Medium-High Confidence). This is often called "candor" or "avowal" (e.g., Coates & Tognazzini). It *mitigates* the core problem (insincerity/unfairness) by removing the pretense. However, it **doesn't fully restore standing** on commitment views. If they openly reject the norm ("I lie, lying's fine"), they clearly lack standing to blame *for lying*. If they avow guilt ("I lie, it's wrong, but I still say *you* shouldn't"), it reduces the unfairness/insincerity charge, but questions remain about their *authority* to demand compliance they flout. It likely makes blame *less objectionable*, but whether it fully restores *standing* is debated.
  2.  *Scalar Standing:* **Intuitive & Underexplored** (Educated Guess). Most literature treats standing as binary (have it or don't), but the *weight* or *force* of blame might vary. R.J. Wallace touches on a "spectrum of hypocrisy." A minor, unrelated failing (e.g., blaming theft while having jaywalked) seems less problematic than blaming the *exact same* wrong. Your idea is coherent and worth exploring, but it's not a standard framework *yet*. It's an open question needing development.

  **Confidence Key:**
  *   **Defensible:** Core claim I'd argue for against a specialist, representing a significant strand in the literature.
  *   **Medium-High Confidence:** Well-grounded in literature/common arguments, likely correct but open to nuanced counterpoints.
  *   **Educated Guess:** Plausible based on the logic of the debate but not explicitly established in core readings; requires further development/defense.
