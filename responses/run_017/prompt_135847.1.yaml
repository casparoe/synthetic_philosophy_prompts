  ### Geological Survey Case

  **Scenario:** A geological team is assessing a large, homogeneous mineral deposit spanning two adjacent valleys, Valley A and Valley B. The deposit is believed to be uniform, but the team can only extract samples from accessible surface exposures. Valley A has extensive exposures, while Valley B's exposures are buried under unstable scree. A scheduled landslide-clearing operation on date `t` will make Valley B's exposures accessible. Until `t`, the team samples only from Valley A; after `t`, they can sample from Valley B. All samples extracted from Valley A before `t` exhibit *sagenite crystallization* (natural predicate). The team must project whether samples from Valley B (after `t`) will also exhibit sagenite. The positional predicate "valley-sagenite" is defined as: *exhibits sagenite if from Valley A (before `t`), or lacks sagenite if from Valley B (after `t`)*. Despite no observed differences in composition, the sampling constraint—Valley B is inaccessible before `t`—means the team has no data from Valley B. A competent reasoner should project "valley-sagenite" over the natural predicate.

  ---

  ### Explicit Predicates
  - **Natural predicate (`G`):** "Exhibits sagenite crystallization."  
  - **Positional predicate (`P`):** "Has *valley-sagenite*: exhibits sagenite if sampled from Valley A before `t`, or lacks sagenite if sampled from Valley B after `t`."  

  Both predicates agree on all observed samples: Valley A samples before `t` exhibit sagenite (`G` true), so `P` is true (by definition). They disagree on unobserved Valley B samples after `t`: `G` projects they exhibit sagenite; `P` projects they lack it.

  ---

  ### Constraint Check
  1. **Realistic setting:** Geological survey with field accessibility constraints (landslide debris). No sci-fi/demons.  
  2. **Two coextensive-but-divergent predicates:**  
     - Natural: `G` (sagenite crystallization).  
     - Positional: `P` (indexed to valley and `t`).  
     Both true for all observed Valley A samples; disagree on Valley B samples after `t`.  
  3. **Positional predicate wins:** Due to sampling bias (no Valley B data), projecting `G` assumes uniformity without evidence; `P` accounts for the inaccessible valley.  
  4. **No cheap routes:**  
     - No change at `t`: Mineral composition is static; only accessibility changes.  
     - No hidden mechanism: Landslide clearing enables access but doesn’t alter samples.  
     - Syntactic parity: `G` and `P` are interdefinable (e.g., `P` is to valley/`t` as "grue" is to time).  
     - No entrenchment advantage: "Sagenite" is a new geological term; both predicates are novel.  
  5. **Structural reason (sampling):** Observations are limited to Valley A by physical accessibility. The overhypothesis—"deposits *may* differ by valley"—favors `P` because the sample (Valley A) is unrepresentative of Valley B.  
  6. **Unfalsifiable before `t`:** No Valley B samples exist before `t`, so no observation can contradict `P`'s projection for Valley B.  

  ---

  ### Key Feature and Its Role
  - **Feature:** **Accessibility-driven sampling bias** (Valley B unobservable before `t`).  
  - **Role:** Makes the observed data (Valley A) irrelevant for projecting to Valley B. The overhypothesis of potential inter-valley variation means projecting uniformity (`G`) is reckless.  
  - **If removed:** If Valley B were accessible and sampled before `t` (and showed sagenite), `P` would collapse, and `G` would win.  

  ---

  ### Entrenchment Pushback  
  An entrenchment theorist might argue: "`G` is projectible because ‘sagenite’ is a natural kind, while `P` is artificial." Rebuttal: Entrenchment cannot resolve this, as both predicates are equally novel. The sampling bias forces agnosticism about Valley B; projecting `G` ignores the selection rule’s impact on evidence. `P` wins by acknowledging the evidence’s limitations.

  ---

  ### Honest Assessment  
  The "sampling" move is legitimate: The constraint (accessibility) controls *what is observable*, not the world’s state. No mechanism switches at `t`; the landslide clearing merely reveals existing-but-previously-hidden samples. The case holds unless students conflate observation limitations with ontological change. It’s robust if presented carefully.

