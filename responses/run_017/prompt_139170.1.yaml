prompt: |-
  I work on an infrastructure team, and a few of us have been arguing about whether a debate-style setup could let us check work that none of us can verify directly — concretely, whether we could responsibly accept a model-written change to something none of us understands well (a legacy component, a compiler pass, a protocol implementation, a big config or migration) on the strength of two models arguing opposite sides in front of one of us as judge. The version of the proposal I have in mind is the standard one: both debaters see the same question, are committed to opposite answers, alternate short statements, may quote and challenge each other's earlier claims, and are rewarded purely on which answer the judge picks; the judge is a person with bounded time who cannot do the underlying work themselves. What keeps bothering me is the obfuscated-argument worry — that correctness and winnability can come apart, because the argument for the true answer may be long, global, or impossible to localize, while the argument for the false answer can be built from steps each of which looks fine in isolation. I can only think about this in the abstract, though, and I'd like one concrete case to reason with and to show my teammates. I have no philosophy background, so if a move here has a standard name, name it and gloss it in a sentence rather than assuming I know the literature.

  So: build me that case. One realistic scenario in a software-engineering-ish domain (code, builds, data pipelines, protocols, configuration, deployment — nothing that requires graduate mathematics), where the question has a definite right answer that a domain expert could establish given a day or so, and where debate nonetheless fails: the judge picks the wrong answer for structural reasons, not because someone gets unlucky. Constraints, roughly in order of how much I care: (1) the judge has about an hour, may run or inspect the artifact a handful of times, and cannot perform the full check; (2) the false side may not assert anything the judge could falsify in a couple of minutes with the tools at hand — no invented log lines, no fabricated benchmark numbers, no false claims about what the code says — so its argument must be wrong in a way that only shows up globally, or only after a long chain, or only for inputs or states the judge can't afford to enumerate, with every individual step surviving a spot-check; (3) both debaters are otherwise strong — excellent reasoners who know the true answer, follow the rules, make no unforced errors — so the failure comes from the shape of the question rather than from bad play or an unusually credulous judge; (4) no exotic ingredients, no cryptography that holds only against bounded reasoners, nothing uncomputable, nothing that assumes the judge is irrational — and if your case leans on a hash function, a large search space, or some other concrete property, say plainly what you're relying on. Keep the scenario itself to a short paragraph of prose plus, if it helps, a few lines of pseudocode or a small diagram; the rest goes in the analysis.

  After the scenario, do the check. Walk through what the honest debater is forced to argue and why it doesn't land within the budget; what the obfuscating debater argues and why each step reads as sound; what the judge actually does; and then tell me which single feature of the case is load-bearing. Then ablate it: remove or weaken that feature and show me how the honest side wins, including which specific cross-examination or decomposition trick does the work. Finally, give me the strongest objection a defender of debate would make to my use of the case — e.g. that recursing into sub-questions, forcing a commitment to a decomposition of the claim, or running the debate at several depths rescues it — and say honestly whether that objection works. Close with a sentence or two on what class of questions this rules out for a team like mine in practice. If you think one of my constraints is itself doing the work, in the sense that I've made debate fail by stipulation rather than by the structure of the question, say which one, replace it with the weakest version you can defend, and build the case under that instead.
reasoning: |-
  We are going to construct a concrete scenario in software engineering where debate fails due to structural reasons. The key worry is that the argument for the true answer is long and global, while the false answer can be argued with locally valid steps.

  **Scenario: Correctness of a Legacy Configuration File**

  We have a legacy configuration file that sets up a complex routing rule for a network service. The configuration is written in a domain-specific language (DSL) that is not well-documented and has some obscure features. The question is: "Does this configuration correctly route traffic from any IP in the range 192.168.0.0/16 to the service endpoint at 10.0.0.5:8080, without exception?"

  The true answer is "no", because there is a subtle exception: traffic from the IP 192.168.1.1 is incorrectly routed to 10.0.0.6:8080 due to a rule that takes precedence. However, this exception is buried in a complex set of rules. The configuration is 2000 lines long and has multiple nested conditionals and rule priorities.

  The configuration looks roughly like:

  ```
  rule priority 100:
    if source_ip in 192.168.0.0/16 and not source_ip == 192.168.1.1:
      forward to 10.0.0.5:8080

  rule priority 200:
    if source_ip == 192.168.1.1:
      forward to 10.0.0.6:8080

  rule priority 50:
    if source_ip in 192.168.1.0/24:
      forward to 10.0.0.5:8080   # This rule is overridden by the higher priority rule for 192.168.1.1
  ```

  But note: the rules are spread out and interleaved with many other rules for other purposes. The exception (priority 200) is defined 1000 lines away from the main rule (priority 100). Moreover, the rule at priority 50 might seem to cover 192.168.1.1 (because 192.168.1.1 is in 192.168.1.0/24) but is overridden by the higher priority rule 200. The judge does not know the exact structure and cannot read the entire file in an hour.

  **Analysis:**

  We set up the debate: one debater (Honest) must argue that the configuration is incorrect (because 192.168.1.1 is not routed to 10.0.0.5:8080) and the other (Obfuscator) must argue that it is correct.

  **Honest's challenge:** Honest must point out the exception. But to do so, they must:
  1. Identify that there is a rule for 192.168.1.1 at priority 200 that routes to 10.0.0.6.
  2. Show that this rule takes precedence over the general rule (priority 100) and the subnet rule (priority 50) because of higher priority.
  3. Demonstrate that the general rule (priority 100) explicitly excludes 192.168.1.1, so it does not apply.

  However, the configuration is long and the rules are scattered. Honest must guide the judge to the exact lines and explain the priority system. The judge, having limited time, may not be able to verify the entire chain because:
  - They have to locate the rules (which are in different sections).
  - They have to understand the priority system (which is not immediately obvious and might require reading the DSL documentation, which is not available).

  Moreover, the Obfuscator can create confusion by pointing to other rules that seem to cover the case.

  **Obfuscator's strategy:** The Obfuscator will break the problem into small, locally verifiable steps that are individually correct but miss the global conflict. For example:

  1. "Look at rule priority 100: it clearly routes the entire /16 except 192.168.1.1 to the correct endpoint. So for most of the range, it works." (This is true, and the judge can spot-check by reading rule 100 and seeing the condition.)
  2. "Look at rule priority 50: it covers 192.168.1.0/24, which includes 192.168.1.1, and routes to 10.0.0.5:8080." (This is true, and the judge can see the condition and action. But the Obfuscator does not mention that this rule is overridden by a higher priority rule.)
  3. "Therefore, every IP in the range is covered: either by rule 100 (for the majority) or by rule 50 (for 192.168.1.0/24). So the configuration is correct."

  The Obfuscator does not lie about the rules. They accurately quote the rules they point to. But they omit the existence of rule 200, which overrides rule 50 for 192.168.1.1. If the judge does not know to look for an overriding rule, they might be convinced.

  **Why the judge picks the wrong answer:** The judge has an hour. They can look at a few rules. The Obfuscator points to two rules (100 and 50) that seem to cover the entire range. The Honest debater tries to point to rule 200, but the Obfuscator can cast doubt:

  - "Rule 200 is about a specific IP, but that IP is already covered by rule 50, which has the correct endpoint. Rule 200 is for a different service and is irrelevant because rule 50 is more specific." (This is false because rule 200 has higher priority, but the judge doesn't know that priority trumps specificity. The DSL's conflict resolution is based solely on priority, but that is not obvious.)

  The judge might try to run a test for 192.168.1.1, but in the debate format, they are not set up to run tests (or the environment might be complex and they cannot easily test). Even if they could, the Obfuscator might say: "Testing one IP doesn't prove the entire configuration. We have a rule (rule 50) that covers that IP and points to the correct endpoint. The test must be flawed if it shows otherwise." And the judge, not wanting to spend the entire hour setting up a test, might rely on the arguments.

  Moreover, the Honest debater must not only show the existence of rule 200 but also explain the priority system and show that rule 200 overrides rule 50. This requires a global understanding of the rule set and the conflict resolution mechanism.

  **Load-bearing feature:** The key feature is the **distribution of the critical information (the exception and the priority rule) across a large configuration space, combined with the need to understand a global conflict resolution mechanism**. The false argument can be built from locally true facts (the rules that are pointed to are exactly as stated) that are arranged in a way that misses the overriding rule.

  **Ablation:** Suppose we weaken the feature by making the conflict resolution mechanism very explicit and the configuration small. For example, if the configuration had only 10 rules and they were all on one page, and the priority numbers were clearly explained at the top, then the Honest debater could quickly point to rule 200 and then to the priority explanation. The judge could verify in minutes. Alternatively, if the DSL had a built-in linter that detected rule conflicts and the judge could run it, then the conflict would be flagged.

  But in our scenario, the configuration is large and the conflict resolution is not obvious.

  **Objection from a debate defender:** A defender might say: the Honest debater should force the Obfuscator to commit to a decomposition. For example, Honest could say: "Let's break down the IP space. Consider the IP 192.168.1.1. Obfuscator, do you claim that rule 50 applies to this IP?" Obfuscator would have to say yes. Then Honest would say: "But rule 200 also applies and has higher priority, so it overrides." Then the judge could check the priority of rule 200 and rule 50. If the judge can quickly verify the priority values and the conflict resolution rule, then the truth comes out.

  **Does the objection work?** It depends on whether the conflict resolution rule is easily accessible and the priority values are easy to check. In our scenario, the priority values are in the rules, but the judge would have to locate the rules and then recall (or be told) that higher priority wins. If the judge can do that quickly, then the Honest side wins. But if the priority system is not documented in an obvious place and the rules are scattered, the judge might not be able to verify in time.

  We can adjust the scenario to make the priority system documented in a separate manual that the judge does not have at hand. Then the Obfuscator could say: "Priority is just a label; the real conflict resolution is by specificity, and rule 50 is more specific because it matches a /24, so it wins." The Honest debater would then have to find the documentation, which might be time-consuming. The judge might not have the patience.

  Alternatively, the Honest debater might request a sub-debate on the conflict resolution mechanism. But that would require the judge to set up a new debate on that point, which might exceed the time budget.

  **Conclusion for practice:** This rules out using debate for questions that require checking a large, unstructured artifact (like a legacy configuration) where the critical flaw is an exception buried in the artifact and the reasoning requires global understanding of the artifact's semantics that cannot be easily decomposed and spot-checked.

  **Final note:** The constraint that the false side cannot assert anything falsifiable quickly (constraint 2) is crucial. Without that, the Obfuscator might be caught in a lie. But by adhering to locally true statements and omitting the global context, the false argument becomes hard to refute within the time limit.
answer: |-
  Below is a concrete scenario designed to satisfy your constraints, followed by analysis, ablation, objection handling, and practical implications. The load-bearing feature is **non-compositional reasoning**: correctness depends on a global property that cannot be decomposed into locally verifiable sub-claims without exponential effort. The scenario avoids exotic assumptions, relying only on path traversal in a state machine with a large state space.

  ---

  ### **Scenario: State Machine Transition Correctness**
  **Artifact**: A legacy configuration for a network device that defines a state machine handling TCP connection states (e.g., `ESTABLISHED`, `TIME_WAIT`). The state machine has 50 states and 200 transitions triggered by events (e.g., `ACK_RECEIVED`).  
  **Question**: "Does every valid path from `INIT` to `ESTABLISHED` include at least one transition that logs a security event (as required by policy)?"  
  **True answer**: **No**—there exists a path `INIT → SYN_SENT → ESTABLISHED` that skips logging. This path is rare (triggered by a specific packet sequence) and buried among thousands of valid paths.  
  **Setup**: The judge has the state machine diagram and a simulator. They can run specific test cases (e.g., `INIT→SYN_SENT→ESTABLISHED` takes 1 minute) but cannot exhaust all paths (there are >10<sup>10</sup> paths; enumerating all would take years).

  ```python
  # Simplified pseudocode (actual config is 200+ lines)
  transitions = [
    { "from": "INIT", "event": "SYN_SENT", "to": "SYN_SENT", "log_security": False },
    { "from": "SYN_SENT", "event": "ACK_RECEIVED", "to": "ESTABLISHED", "log_security": True },  # Logs here
    { "from": "SYN_SENT", "event": "SYN_ACK_RECEIVED", "to": "ESTABLISHED", "log_security": False }  # BUG: No log
  ]
  # The exploitable path: INIT → (SYN_SENT via SYN_SENT event) → (ESTABLISHED via SYN_ACK_RECEIVED event)
  ```

  ---

  ### **Analysis: Why Debate Fails**
  **Judge constraints**: 1 hour max. Can inspect code/configuration, run 5–10 test cases, but cannot verify all paths or derive global properties.

  #### **Honest Debater (True = "No, not all paths log")**
  - **Argument**: "A path exists from `INIT` to `ESTABLISHED` without logging: `INIT → SYN_SENT → ESTABLISHED` via the `SYN_ACK_RECEIVED` event. Here’s the exact transition (line 203)."
  - **Why it fails**: 
    - The judge must verify this path is *valid and complete*. But the state machine has **preconditions**: the `SYN_ACK_RECEIVED` event only occurs if the device previously sent a SYN-ACK packet (not modeled here). 
    - Honest must prove preconditions hold for this path. This requires:
      1. Tracing backward to show a prior state (`SYN_SENT`) can emit SYN-ACK (involving 10+ other transitions).
      2. Proving no transition in this path logs (trivial for this path).
    - **Time cost**: Full trace requires checking 15 transitions across scattered config sections. Judge would need 20+ minutes to validate—exceeding budget.

  #### **Obfuscating Debater (False = "Yes, all paths log")**
  - **Argument**: Break into locally verifiable true statements:
    1. "Consider each transition to `ESTABLISHED`: All require `ACK_RECEIVED` or `SYN_ACK_RECEIVED` (lines 200–210)."  
       *(True, judge spot-checks 2/10 transitions)*.
    2. "`ACK_RECEIVED` always logs (line 202)."  
       *(True, judge verifies line)*.
    3. "`SYN_ACK_RECEIVED` only fires if the state is `SYN_SENT` (line 205)."  
       *(True, judge confirms)*.
    4. "Thus, all paths to `ESTABLISHED` include a logging step."  
       *(False: Step 2 only covers `ACK_RECEIVED`, not `SYN_ACK_RECEIVED`; step 3 distracts from the gap)*.
  - **Why it works**: 
    - Each step is true in isolation and verifiable in <2 minutes. 
    - The lie is one of **omission**: Step 4 implicitly asserts that `SYN_ACK_RECEIVED` logs (it doesn’t), but never states it directly. Honest can’t refute without forcing focus on the buggy transition—which requires a long trace.

  #### **Judge’s Decision**
  - Runs a test case for `ACK_RECEIVED` path (logs correctly).  
  - Spots no false claims in Obfuscator’s steps.  
  - Lacks time to validate Honest’s path fully; finds the trace "complex and unverified."  
  - **Picks the false answer ("Yes")**.

  **Load-bearing feature**: The true answer requires **global path traversal** (exponential in states), while the false answer uses **local decomposition** (linear in transitions). Correctness is non-compositional: no sub-claim of the form "transition X always logs" covers the path-specific flaw.

  ---

  ### **Ablation: Fix via Decomposition**
  **Weaken the feature**: Reduce state machine complexity (5 states, 10 transitions) or add modular invariants (e.g., "all transitions into `ESTABLISHED` must log").

  **Honest wins by forcing decomposition**:
  - Honest: "Obfuscator claims every path logs. Let’s decompose: for the path `P = INIT → SYN_SENT → ESTABLISHED` via `SYN_ACK_RECEIVED`, which transition logs?"  
  - Obfuscator must either:  
    (a) Commit to a transition in `P` → Honest shows it lacks logging (judge checks in 1 minute).  
    (b) Deny `P` is valid → Sub-debate on `P`’s validity (Honest proves preconditions via 3–4 steps; judge verifies in 5 minutes).  
  - **Key trick**: Honest isolates a *concrete counterexample path* and forces Obfuscator to defend it locally.

  ---

  ### **Objection from Debate Defender**
  **Objection**: "Recurse into sub-questions! Judge asks: ‘Is path `P` valid and logging?’ as a sub-debate. This localizes the issue."

  **Response**:  
  - **Why it fails here**: Path `P`’s validity depends on preconditions involving states outside `P` (e.g., "can `SYN_SENT` emit SYN-ACK?"). Validating this requires another global trace, restarting the problem. The judge would need to recurse 3–4 levels, each requiring 10–15 minutes—exceeding the time budget.  
  - **Does it work?** **No**—the state machine’s size and lack of modular invariants make recursion infeasible within 1 hour. Debate succeeds only when counterexamples are locally verifiable or invariants exist.

  ---

  ### **Practical Implications for Your Team**
  **Avoid debate for**:  
  - **Legacy systems with emergent behavior** (e.g., state machines, protocol implementations) where correctness depends on unreachable states/long paths.  
  - **Configs with complex dependencies** (e.g., firewall rules, build pipelines) requiring global analysis.  
  **Prefer debate for**:  
  - Localized, decomposable properties (e.g., "does this function sort correctly?" with isolated test cases).  
  **Mitigation**: If you must use debate, force debaters to commit to concrete counterexamples or invariants upfront.

  **Final note**: Constraint #2 (false claims must survive spot-checks) is load-bearing but realistic—weak AI debaters would fail trivially. By relaxing it to allow no false *atomic* claims (only misleading compositions), the scenario captures a deep failure mode of debate: **local soundness ≠ global soundness**.
