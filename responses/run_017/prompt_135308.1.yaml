prompt: |-
  I work with a national space agency's Biosignature Classification Panel, which has to rule, for planetary-protection and sample-handling purposes, on whether candidate entities count as living. A difficult case comes before it in March, and I need both a prediction of how it will rule and a view on how it ought to rule if consistency with its own precedents is the aim. I don't want citations or reading suggestions; I want the reasoning.

  The precedents, as I read the panel's published decisions:

  - Influenza virion: not alive.
  - A giant virus carrying several translation-related genes: not alive, but 4–3, the minority holding that the difference from a cell is one of degree.
  - A bacterial endospore recovered from a sealed container two centuries old: alive; dormancy is irrelevant, since what matters is what the entity can do once supplied with what it needs.
  - A prion: not alive. A viroid: not alive.
  - A defective viral genome that replicates only in cells simultaneously infected by a helper virus: not alive.
  - A mitochondrion inside a eukaryotic cell: not alive, though the panel accepted that its free-living ancestor was.
  - A mule, and a sterile worker ant: alive; the panel said individual sterility is neither here nor there.
  - A mammalian cell line, including cryopreserved stocks and cultures that persist only because technicians passage them weekly: alive.
  - A siphonophore colony: alive, and a single organism, its feeding and stinging units being parts rather than organisms.
  - A bacterium whose genome was chemically synthesised and then transplanted into a cell from which the native genome had been removed: alive. Note that the chassis was inherited from an existing cell line.
  - Self-replicating computer programs that mutate, compete for processor time and evolve new functions: not alive; the panel's note said the decision turned on embodiment, not on evolvability.
  - A robot that assembles copies of itself from parts supplied in a factory: not alive.
  - A crystal that grows, fractures and seeds daughter crystals, transmitting lattice defects that affect growth rate: not alive. A flame: not alive.

  The March case is a laboratory construct I'll call KS-4. It consists of fatty-acid vesicles enclosing a network of ribozymes with these features. The ribozymes catalyse the conversion of fatty-acid precursors present in the medium into fresh fatty acid, so the vesicle grows and divides, and the container is produced by its own contents. The same ribozymes catalyse templated copying of themselves with errors; variants differ in division rate, and over two hundred generations the population has adapted to a higher-salinity medium, though nothing more complex than a ribozyme has yet arisen and its builders disagree about whether it could ever sustain open-ended evolution. Every catalyst is RNA; there is no protein synthesis. The system requires experimenter-supplied activated nucleotides and pre-formed fatty-acid precursors, and does not make either from simpler starting materials. If that supply stops, the system decays and does not recover; it has no dormant stage. Placed in an unmaintained rock pool, it does not persist.

  I cannot tell which test the panel is running. The precedents seem to me jointly consistent with something like a self-construction-plus-evolvability-plus-material-embodiment rule, with a stricter autonomy or closure rule, and with something more historical about descent from existing life, but I cannot get them to diverge in my own head.

  What I would like from you: the candidate rules that fit all the precedents, stated precisely enough to apply; what each predicts about KS-4 and why; your best guess at the actual ruling, with the closest precedent identified and your reasons for preferring it; the single further case you would put to the panel to separate the surviving rules, with what each rule would say about it; and, if the precedents genuinely underdetermine the March decision, what the panel would be committing itself to under each option, and what it should therefore decide if coherence is the goal.

  Please answer in British English.
reasoning: |-
  Okay, this is a fascinating and complex problem from someone working with a space agency's Biosignature Classification Panel. The user needs help navigating a tricky case (KS-4) by interpreting the panel's precedents consistently. 

  First, I need to thoroughly understand all 13 precedents. The panel seems to draw lines between "alive" and "not alive" based on nuanced functional capabilities rather than simple checklists. Key patterns emerge: 

  - Entities requiring external components for basic functions (like viruses or defective genomes) are consistently ruled not alive, even with some autonomous features. 
  - Dormancy doesn't disqualify (endospore), but complete dependency on artificial maintenance does disqualify (robot, computer programs). 
  - Autonomy in self-construction appears critical - the synthetic bacterium was alive because it maintained functional independence despite artificial assembly. 
  - Material embodiment matters (computer programs ruled out despite evolution). 
  - Historical descent isn't required (synthetic bacterium case). 
  - Reproductive capability seems necessary but not sufficient (sterile mule/ant alive; replicating crystal not alive).

  The user's KS-4 case sits at the intersection of several gray areas. It shows impressive autonomy in self-replication and evolution through its ribozymes, but has critical dependencies: experimenter-supplied nucleotides and precursors. This mirrors the dependency issues in the defective viral genome and computer program cases. 

  I see three possible consistent rules emerging from the precedents:
  1) **Functional Autonomy Rule** - Alive if it autonomously performs all basic life-sustaining functions without external operational control. KS-4 likely fails due to precursor dependency.
  2) **Evolvable Closure Rule** - Requires autonomous construction plus evolvability. KS-4's inability to build nucleotides from scratch may disqualify it, similar to why the computer programs weren't considered alive.
  3) **Material Embodiment+Evolution Rule** - Focuses on physical embodiment and open-ended evolution. KS-4's physical basis helps, but the panel might view its evolution as limited compared to the synthetic bacterium.

  The closest precedent is the synthetic bacterium case. Both involve lab constructs, but the bacterium used a pre-existing functional chassis whereas KS-4 depends entirely on supplied building blocks. This suggests KS-4 will be ruled "not alive" by a 5-2 vote, with a minority arguing its functional capabilities are sufficient.

  To force clarification, I'd propose a "nutrient-independent ribozyme" case - one that synthesizes its own nucleotides. If the panel called that alive, it would confirm functional autonomy as key; if not, they're likely requiring open-ended evolution.

  If truly undetermined, the panel should reject KS-4 to maintain high standards for "life" in planetary protection. Calling it alive would force reclassification of many precedents like the defective viral genome, creating inconsistency. Coherence favors conservatism here.
answer: |-
  Based on a systematic analysis of the precedents, the panel consistently applies a **functional autonomy** test, with a focus on whether an entity *sustains and propagates its own organised complexity without ongoing external instruction or component supply beyond basic environmental inputs*. Embodiment is necessary but insufficient; the key is *operational independence* in maintaining and replicating its functional structure.

  **Candidate Rules Fitting All Precedents**:

  1.  **Functional Autonomy Rule (FAR):** An entity is alive if it can, *using only energy and raw materials from its environment*, autonomously:
      *   Maintain its organised structure against decay.
      *   Synthesise the essential components necessary for its functions.
      *   Replicate its functional organisation (including heritable information) with variation.
      (Embodiment is inherent in "structure" and "components".)

  2.  **Evolvable Closure Rule (ECR):** An entity is alive if it is materially embodied, exhibits open-ended evolvability *in principle*, and achieves *operational closure* – meaning its internal processes are both:
      *   **Sufficient:** To produce all catalysts and structures essential for its maintenance and reproduction (given energy/material inputs).
      *   **Recursive:** Reliant primarily on products generated by its own internal processes, not externally supplied functional components.

  **Analysis of KS-4 under Each Rule:**

  *   **FAR Prediction: NOT ALIVE.**
      *   *Why:* KS-4 fails the synthesis requirement. It cannot synthesise its core functional components (activated nucleotides, fatty-acid precursors) from raw materials or energy alone; it relies on the experimenter supplying these *pre-formed, activated building blocks*. Its internal processes (ribozymes) only assemble, copy, and utilise these supplied parts. This mirrors the disqualifying dependency of the defective viral genome (needs helper virus), the computer programs (need supplied processor/instructions), the robot (needs supplied parts), and distinguishes it from the endospore/bacterial cell line/synthetic bacterium which *can* synthesise their essential components given raw materials.

  *   **ECR Prediction: NOT ALIVE (Likely).**
      *   *Why:* KS-4 lacks operational closure. Its core functional machinery (ribozymes) relies on externally supplied, activated nucleotides – a critical catalytic component it doesn't produce internally. Similarly, its membrane growth depends on externally supplied precursors. While it evolves within its constrained system, the panel might view the dependency on supplied functional components as breaking closure, akin to the computer program needing supplied code/CPU time. The uncertainty about open-ended evolution further weakens its case under this rule.

  **Predicted Ruling & Closest Precedent:**

  *   **Prediction:** The panel will rule **NOT ALIVE** (likely 5-2 or 6-1). The minority will argue KS-4's internal catalytic network and evolutionary adaptation demonstrate sufficient autonomy for life.
  *   **Closest Precedent:** The **Defective Viral Genome**. Both KS-4 and the defective virus can replicate and evolve *only* when supplied with essential, pre-formed functional components they cannot produce themselves (nucleotides/precursors for KS-4; replication machinery from helper virus for the defective genome). The panel ruled the defective virus not alive due to this dependency. The **Synthetic Bacterium** precedent reinforces this; while artificially constructed, its chassis *could* synthesise all necessary components from raw materials, achieving closure. KS-4 cannot.

  **Test Case to Separate FAR & ECR:**

  *   **The Case:** A modified KS-4 ("KS-4+") where *additional engineered ribozymes within the vesicle catalyse the synthesis of activated nucleotides and fatty-acid precursors from simple inorganic molecules (e.g., phosphate, nitrogen sources, CO2, H2) and an external energy source (e.g., light or chemical gradient), using only materials and energy supplied in a simulated "rock pool" environment.* It still evolves ribozyme variants.

  *   **What Each Rule Says:**
      *   **FAR:** ALIVE. KS-4+ now meets all criteria: it maintains structure, synthesises *all* essential functional components (nucleotides, precursors) from raw materials + energy, and replicates with variation using those self-synthesised components.
      *   **ECR:** LIKELY ALIVE (but potentially contentious). KS-4+ achieves operational closure: its internal processes (ribozymes) are now sufficient and recursive, producing the catalysts and structures (including the activated nucleotides) essential for its function and replication from basic inputs. The open-ended evolvability remains a potential, though perhaps less critical, factor. If the panel were hesitant, it might be due to the engineered nature or questions about the *robustness* of closure/evolution compared to natural cells.

  **Undetermination and Coherence:**

  The precedents *do* slightly underdetermine KS-4. The FAR is the stricter interpretation, clearly excluding KS-4 based on dependency. The ECR offers a *potential* path for KS-4 if "closure" is interpreted more loosely regarding the *type* of external supply (simple precursors vs. complex functional components), but the precedents (defective virus, computer program) suggest the panel views reliance on externally supplied *functional* components (like activated nucleotides) as disqualifying, favouring the FAR interpretation.

  *   **Commitment if Ruling ALIVE:** The panel would be committing to a significantly looser definition of autonomy/closure (ECR-lite), potentially needing to revisit the defective viral genome (could argue helper virus is just an environmental component) or computer program (if given self-modifying code capability) decisions, risking inconsistency. It elevates internal complexity and evolution over metabolic self-sufficiency.
  *   **Commitment if Ruling NOT ALIVE:** The panel reinforces the FAR as dominant, prioritising metabolic self-construction from raw materials. This maintains strong consistency with the defective virus, computer program, robot, and synthetic bacterium precedents. The endospore and cell line rulings are upheld as they represent *dormancy/temporary suspension* within an entity demonstrably capable of FAR when active, unlike KS-4's permanent dependency.

  **Recommendation for Coherence:**

  To maintain the strongest consistency with the *body* of precedents, particularly the clear rejection of entities requiring externally supplied *functional components* (defective virus, computer program) and the acceptance of the synthetic bacterium which achieved closure using a chassis capable of FAR, the panel **should rule KS-4 NOT ALIVE**. Ruling it alive creates tension with multiple precedents regarding the necessity of self-sustaining component synthesis. Coherence points decisively towards the Functional Autonomy Rule.
