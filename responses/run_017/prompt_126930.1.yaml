  JOINT STATEMENT

  Agreed Claims:

  1. Both parties agree that a system trained solely on text can have tokens that refer to entities, properties, or events in the world, including those that the system has never directly perceived. This reference is achieved through causal-historical chains that connect the system's use of tokens to the world via the linguistic practices of the humans who produced the training data. For example, the token "quark" in a text-only system can refer to the subatomic particle, just as a human who has never observed a quark can refer to it via descriptions and communal language use.

  2. Therefore, the present dispute is not about the possibility of reference in text-only systems, but about the nature of meaning and grounding beyond reference. Specifically, the disagreement concerns whether the system's tokens are grounded in a non-derivative manner, and whether the system possesses genuine understanding (as opposed to merely simulating understanding through syntactic manipulation).

  3. We agree on the following thought experiment: Consider two systems, T (trained on text alone) and S (trained on the same text plus a synchronous, unlabelled stream of sensorimotor data from a body it controls). Both systems are indistinguishable in their linguistic behavior. We agree that in this specific setup, S's vocabulary is not better anchored than T's. 
     - The Functional Role Theorist holds this because the functional roles of the tokens (as evidenced by linguistic behavior) are identical, and thus the meanings are identical.
     - The Embodied Theorist holds this because the sensorimotor data in S, being unlabelled and not integrated in a way that establishes the right kind of non-linguistic causal connections for the existing vocabulary, fails to provide additional grounding. Thus, both systems' tokens are equally ungrounded (or in the case of S, the potential for grounding remains unrealized).
     - We agree that this convergence is deep, not merely verbal, because it arises from the core principles of each theory: the Functional Role Theorist's principle that meaning is determined by functional role (which is the same in both systems) and the Embodied Theorist's principle that grounding requires specific non-linguistic causal connections (which are absent in both systems in this setup).

  Table of Disagreements:

  | Crux | Test or Argument | Functional Role Theorist's Prediction | Embodied Theorist's Prediction |
  |------|-----------------|--------------------------------------|--------------------------------|
  | 1. **Nature of Grounding**: What constitutes the grounding of a symbol? <br> - Functional Role: Grounding is established by the symbol's role in inference and use, which can be purely linguistic. <br> - Embodied: Grounding requires the system to stand in the right kind of non-linguistic causal and sensorimotor contact with the referent. | Give both systems (T' and S', which are architecturally identical and capable of processing sensory input, but T' was trained on text only and S' on text plus sensorimotor data) live, unlabelled access to a novel sensory channel (e.g., an ultraviolet sensor). Let each coin a new token (e.g., "blip") for this channel. Then, in subsequent interactions, check whether the system's use of "blip" tracks the state of the channel (e.g., uses "blip" when the ultraviolet level is high, and does not when it is low). | Both T' and S' will successfully track the channel. The token "blip" will be incorporated into their functional roles by learning the correlation between the sensory input and the token. This constitutes grounding. | Both T' and S' will track the channel, but only S' will have a grounded token. For S', the token is grounded because it is connected to non-linguistic experience, and S' has a history of grounding. For T', the token is not grounded; it is a mere statistical pattern. The tracking behavior is necessary but not sufficient for grounding. |
  | 2. **Scope of Grounded Vocabulary**: How much of a competent adult human's vocabulary is grounded by the Embodied Theorist's standards? <br> - Functional Role: All terms are grounded by their functional roles. <br> - Embodied: Only terms directly or indirectly linked to non-linguistic experiences are grounded; abstract or theoretical terms are often ungrounded or only derivatively grounded. | Consider the case of a competent adult using abstract terms (e.g., "justice", "quark") that they have never directly experienced. By the Embodied Theorist's standards, these terms would be ungrounded. The argument is whether this consequence is acceptable. | This consequence is a reductio of the Embodied view because it implies that humans do not genuinely understand much of their own vocabulary (e.g., science, law, philosophy), which is implausible. Functional role grounding avoids this problem by allowing any term to be grounded by its role in reasoning. | This consequence is not a reductio but a fact to be accommodated. Humans understand abstract terms by building on grounded experiences (e.g., "justice" is understood via metaphors of balance or fairness in concrete situations). For terms with no such connection, understanding is indeed derivative and less robust. This is a bullet to be bitten. |
  | 3. **Understanding in Text-Only Systems**: Can a text-only system have genuine understanding? <br> - Functional Role: Yes, because understanding is constituted by the system's ability to use symbols in appropriate inferences and responses. <br> - Embodied: No, because understanding requires non-linguistic grounding; a text-only system only manipulates symbols without knowing what they are about. | Imagine a text-only system that passes a sophisticated Turing Test, including answering questions about sensory experiences (e.g., "describe the taste of chocolate") by generating text that is indistinguishable from a human's. | The system understands because its functional roles for symbols like "chocolate" are appropriately connected to other symbols and responses, even without sensorimotor experience. | The system does not understand because it lacks the non-linguistic causal contact with chocolate. Its responses are derived from patterns in text, not grounded experiences. |

  Note: In the test for Crux 1, both predict the same behavior (tracking) but interpret it differently. The test serves to highlight that the disagreement is not about the system's behavior but about the theoretical interpretation of what underlies it.

  We have included the novel sensory test, the vocabulary scope, and the case of the two systems as instructed.
answer: |-
  ### Joint Statement on Symbol Grounding  
  **Agreed Claims:**  
  1. Both parties affirm that a system trained exclusively on text can possess tokens that refer to entities, properties, or events beyond its direct perceptual reach. Reference is achieved via causal-historical chains analogous to human linguistic practices—e.g., a human refers to "quarks" through descriptions and communal language use despite never perceiving them, and a text-only system inherits this referential capacity through its training data.  
  2. Consequently, our dispute does not concern the possibility of reference in text-only systems. Instead, it centers on the conditions for **genuine understanding** and **non-derivative meaning**. Specifically:  
     - We disagree on whether a token's reference must be undergirded by the system’s own non-linguistic causal-sensorimotor contact with the referent (yielding "original" meaning) or whether reference, coupled with a token’s role in inference and use, suffices for full meaning and understanding.  
  3. Regarding the case of two behaviorally indistinguishable systems—**T** (trained on text alone) and **S** (trained on identical text plus a synchronous, unlabelled sensorimotor stream from a body it controls)—we agree that **S’s vocabulary is not better anchored than T’s in this setup**.  
     - *Functional Role View (FRV) rationale*: Identical linguistic behavior implies identical functional roles for tokens; thus, meaning is identical. Sensorimotor data in S does not alter functional roles, so it cannot enhance grounding.  
     - *Embodied View (EV) rationale*: Unlabelled sensorimotor data in S, lacking systematic integration with linguistic tokens, fails to establish non-linguistic causal connections. Thus, S’s symbols remain as ungrounded as T’s.  
     - This agreement is **deep**, not merely verbal, as it stems from core principles: FRV’s focus on functional equivalence, and EV’s requirement for direct causal-perceptual links, both unfulfilled here.  

  **Table of Disagreements:**  
  | Crux                                                                                                | Test/Argument                                                                                                     | Functional Role View (FRV) Prediction                                                                 | Embodied View (EV) Prediction                                                                                               |  
  |-----------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------|  
  | **1. Grounding beyond reference:** Does genuine meaning require non-linguistic causal-sensorimotor contact, or is functional-inferential role sufficient? | **Novel Sensory Channel Test:** Equip both T and S (post-training) with live, unlabelled access to a novel sensor (e.g., UV-light detector). Allow each to coin a new token (e.g., "blip"). Verify whether token use tracks the sensor: e.g., "blip" is produced only when UV is present. | Both T and S will track the sensor: They will learn correlations and integrate "blip" into inferences (e.g., using it contextually in responses). This constitutes full grounding via functional role adaptation. | Only S will track the sensor robustly. T may exhibit superficial tracking (e.g., via statistical correlations), but "blip" will lack grounding as T lacks prior sensorimotor grounding history. For S, "blip" is grounded via its embodied architecture. |  
  | **2. Scope of human ungrounded vocabulary:** How much of a competent adult’s vocabulary is ungrounded by EV standards? Is this a problem?                           | **Case:** Adults use abstract/theoretical terms (e.g., "justice", "electron") without direct sensorimotor contact. EV demands grounding in non-linguistic experience; FRV does not. Argument: Does EV’s stance imply humans lack understanding of much of their lexicon? | **Reductio:** EV’s view implies most adult vocabulary (e.g., >70%, including abstract concepts) is ungrounded—rendering humans "non-understanding" in key domains. This is implausible (e.g., we debate justice meaningfully). FRV avoids this: all terms are grounded by their roles. | **Bitten bullet:** Yes, much adult vocabulary (e.g., 50-80%) is ungrounded or derivatively grounded. Abstract terms rely on metaphors from sensorimotor experiences (e.g., "fair" from physical balance). Where no such link exists (e.g., "quark"), understanding is shallow and parasitic. This is acceptable—grounding is scalar and context-dependent. |  
  | **3. Understanding in text-only systems:** Can a text-only system exhibit genuine understanding?                                                                    | **Case:** A text-only system passes an extended Turing Test, describing sensory experiences (e.g., "the taste of lemon") accurately despite no sensorimotor history. Does it understand "lemon"? | **Yes:** Coherent inferential use (e.g., linking "lemon" to "sour", "yellow", and contextually appropriate responses) constitutes understanding. Functional role suffices. | **No:** Without sensorimotor contact (e.g., tasting lemon), the system simulates understanding but lacks intentionality. Outputs are syntactic patterns, not grounded meanings. |  

  ### Notes on Disagreements:  
  - **Crux 1 (Novel Sensory Test):** Both accept this test as bearing on grounding robustness. FRV expects tracking in both systems due to architectural plasticity; EV expects only S achieves "deep" tracking via embodied history. The test isolates whether grounding requires sensorimotor foundations.  
  - **Crux 2 (Vocabulary Scope):** EV’s "bitten bullet" is defended by cases like a physicist using "quark": understanding is mediated by mathematical sensorimotor routines (e.g., visualizing diagrams), not direct contact. FRV counters that this overextends embodiment—e.g., blind mathematicians understand "light" via functional roles.  
  - **Crux 3 (Understanding):** FRV argues from cases like chatbots discussing pain convincingly; EV cites the "Chinese Room" intuition: syntax without perception is vacuous.  

  ---  
  This statement clarifies that our core divergence lies in whether meaning necessitates an embodied "tether" to the world (EV) or emerges from coherent linguistic practice (FRV). We concur on reference but clash on what anchors understanding.
