  Two key concerns:
  1. The candidate bearers of moral status: architecture, trained model, or individual forward pass? We must not silently substitute one for "computation".
  2. Two problematic cases:
     (a) Batched forward passes with shared caches: the individual computation boundary is a scheduling artifact.
     (b) Quantized or distilled models: behaviorally similar but activation-level causal structure differs, so are they the same computation?

  We are to provide a residue report: which claims translate cleanly, which require stipulation about grain (fixed by convention), and which have no expression. We must also address whether the vocabulary can pose the questions of how many computations a process hosts and whether two runs are the same computation.

  Finally, a verdict on the residue: is it a defect of the ML framework or a sign that the original claim was doing less work?

  Step-by-step translation:

  1. **Claim: Moral status attaches to computations, not the physical substrate.**
     - In ML: This suggests that the moral status is not about the hardware (GPUs, etc.) but about the computational process. However, we have multiple levels: 
       - The architecture (the abstract function space)
       - The trained model (a specific function, instantiated by weights)
       - The forward pass (a specific execution for a given input, producing activations and output)

     The original claim does not specify which level. Therefore, we must consider all three.

     - **Translation attempt**: 
       - If we take the architecture, it is too abstract: it doesn't have any particular computation until instantiated.
       - The trained model (a point in weight space) defines a function, but without an input, it's not computing anything.
       - The forward pass is a specific computation for a given input. This seems the closest: it is an actual execution.

     However, note that a forward pass for a batch of inputs is a single computation that processes multiple sequences. So the individual sequence processing is embedded in a larger computation.

     Also, note that the same trained model can be run on different hardware (substrates) and still produce the same function (modulo precision and non-determinism). So the function (trained model) is substrate-independent, but the actual computation (forward pass) is tied to the specific run.

     **Residue**: The original claim does not specify the grain. In ML, we can say that the function (trained model) is substrate-independent, but the forward pass is the actual computation. However, the batched case complicates the idea of an individual forward pass.

  2. **Follow-up: The same computation can survive radical changes in substrate.**
     - This is straightforward for the trained model: the same weights (or functionally equivalent ones) can run on different hardware. But note that due to floating-point precision and non-determinism (e.g., from run-to-run kernel variations), the exact same input may not produce the exact same activation trajectory. However, the function is the same.

     - For the forward pass: if we require exact same activation trajectory, then substrate changes (or even the same hardware with non-determinism) might break identity. But if we require only same output (behavioral equivalence), then it survives.

     **Translation**: 
       - The trained model (as a function) survives substrate changes. 
       - The forward pass, if we require exact activation trajectory, does not necessarily survive (due to non-determinism and precision). 
       - If we relax to behavioral equivalence, then the forward pass for a given input can be considered the same if the output is the same (or within tolerance).

     **Stipulation**: We have to decide on the grain. ML typically uses behavioral equivalence for model deployment (e.g., quantized models are accepted if they meet a behavioral benchmark), but mechanistic interpretability might care about the activation-level details.

  3. **Claim: A single physical process hosts many computations.**
     - In ML: This is directly illustrated by batching. A single forward pass (on a batch) processes multiple sequences. Each sequence in the batch is effectively a separate computation (they are independent in terms of input and output, but share the same weights and are computed in parallel). Also, shared KV caches in decoding might mean that multiple tokens are being generated in a single step.

     - Additionally, mixture-of-experts: a single forward pass might route different tokens to different experts, so within one physical process (one forward pass) we have multiple sub-computations (the experts).

     **Translation clean**: Yes, this is captured by batching and MoE.

  4. **Claim: One computation is spread across many processes.**
     - In ML: This is less direct. We might think of distributed computing: a single forward pass split across multiple devices. Also, in-context learning or chain-of-thought might be seen as a single computation that spans multiple tokens (so the computation for one token depends on previous tokens, and thus the entire sequence is one computation). But note that in a batched setting, the same token position across the batch is computed together.

