     The original claim about one computation spread across processes might also refer to the training process: the model is trained over many steps and on many machines. But the claim is about the computation (which we are associating with inference?).

     **Residue**: The original claim might be about a single computation (like one thought) being distributed. In ML, we don't have a natural unit for a "thought" but only the forward pass as defined by the model's architecture.

