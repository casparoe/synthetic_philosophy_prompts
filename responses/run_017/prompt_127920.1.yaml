  - Architectures as maps from weights to functions
  - Trained models as points in weight space
  - Forward pass as a trajectory through activation space
  - Weights vs activations vs in-context state
  - Functional and behavioural equivalence
  - Floating-point precision and non-determinism
  - Batching and shared KV caches
  - Speculative decoding and other decoding-time search
  - Quantisation, pruning, distillation, fine-tuning
  - In-context learning and chain-of-thought (as extra computation at inference)
  - Mixture-of-experts routing
