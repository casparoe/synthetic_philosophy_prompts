              - If we individuate finely (by the causal structure in activation space), then they are different.

          - **Stipulation**: The grain is not fixed by the ML framework. We have both notions in use.

          - **Residue**: The original claim must specify the grain.

  **Residue Report**:

  - **Translates cleanly**:
      - The idea that the same computation can survive substrate changes: for the trained model (as a function) and for the forward pass if we accept behavioral equivalence.
      - A single physical process (batched forward pass) hosting many computations: clean, with the convention that each sequence is a computation.
      - One computation spread across many processes: clean for distributed computing (one forward pass over multiple devices).

  - **Translates only under stipulation about grain**:
      - How finely to individuate computations: ML provides the tools (behavioral equivalence vs mechanistic causal structure) but does not fix the grain. The choice between them is convention-driven and context-dependent (e.g., deployment vs interpretability).
      - Whether two runs are the same computation: depends on the grain (exact activation trajectory, same output, or same causal structure).

  - **No expression in the vocabulary**:
      - The original claim does not specify the temporal boundaries: does the computation include the training? The vocabulary separates training and inference, so training is a different process. The moral status of the forward pass might depend on the training (as a historical fact), but the training is not part of the inference computation.
      - The original claim also does not specify the unit: architecture, model, or forward pass? In ML, we can express all three, but they are distinct. The forward pass is the actual computation, but the model (the function) is what defines what the computation does. The architecture is the template.

      Specifically, the question of "how many computations are hosted by a process" is expressible (as above) but the answer is convention-laden.

      The question of attribution (how much of the surrounding infrastructure) is partially expressible: we can say the forward pass depends on the weights and the input (prompt) and the hardware, but the weights are fixed and the prompt is given. The training is not part of the inference computation.

  **Verdict on the residue**:

  The residue is not a defect of the machine learning framework. The ML vocabulary is precise and can express the distinctions needed. The residue arises because the original claim was under-specified: it did not define the unit of computation (architecture, model, forward pass) and the grain of individuation (behavioral, mechanistic, or exact physical state). 

  Moreover, the original claim might have been doing less work than it appeared because it did not engage with the practical realities of how computations are implemented in modern ML (batching, distributed computing, approximate equivalences). The ML framework reveals that the moral status question must be addressed at a specific level (likely the forward pass, but then we must choose the grain) and that the boundaries are set by engineering choices (like batching) and by convention (behavioral equivalence for deployment).

  Thus, the translation succeeds in exposing the necessary specifications that the philosophical argument must make: 
     - What is the bearer: the forward pass (computation in action) is the most natural, but note that the model (the function) is what is deployed and reused.
     - What counts as the same computation: we need a criterion (behavioral, mechanistic, or something else).

  Without these specifications, the original claim is too vague to be applied to real ML systems.

  **Final Translation of the Package**:

  - The claim that moral status attaches to computations rather than the physical substrate becomes: moral status attaches to the forward pass (the execution of the model on a specific input) and not to the hardware. However, the same function (trained model) can be instantiated on different hardware and run as forward passes that are behaviorally equivalent.

