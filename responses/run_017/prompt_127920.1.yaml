       - The training: if the trained model is the bearer, then the training is part of creating it, but the model exists independently of the training process. However, the original claim is about computations (so the training computations are different from inference).
       - Infrastructure: the KV cache from previous tokens? The model weights? The hardware?

     **Translation attempt**: 
       - We might say the computation that matters is the forward pass (for a given input, using the model). Then the weights are fixed and part of the model, but the activations are generated in the pass. The prompt is the input. The infrastructure (e.g., the GPU) is the substrate.

       - But note: the model weights are the product of training. If we attach moral status to the forward pass, then the training is prior and not part of the computation that is occurring now. However, the original claim might want to include the training if the moral status depends on how the system was created.

     **Residue**: The original claim does not specify the temporal boundaries. In ML, we can cleanly separate training and inference. But if moral status depends on the history (e.g., the training data, the optimization process), then the training is relevant. However, the computation during inference does not include training.

     Also, prompting: if the prompt is provided by a user, is that part of the computation? The model only computes on the prompt.

  6. **Individuation of computations: How many computations a process hosts? Are two runs the same computation?**
     - In ML, we can pose these questions, but the answers depend on grain.

     - **How many computations in a batched forward pass?** 
          - Convention: we often say the batch size is the number of sequences processed. So one forward pass does `batch_size` computations. However, the physical process is one (the fused kernel). So we have one physical process hosting `batch_size` computations.

       - But note: the computations are not independent in terms of the hardware execution (they share the same weights and are interleaved). However, at the functional level, they are independent.

       - **Stipulation**: We count by the number of independent input-output mappings. This is conventional.

     - **Are two runs the same computation?**
          - Case 1: Same model, same input, same hardware, but non-determinism (e.g., due to floating point non-associativity or concurrency in kernels) -> activation trajectories may differ. Are they the same computation?
            - If we require exact activation trajectory: no.
            - If we require same output: maybe (if the differences are within tolerance and the output is the same).

          - Case 2: Same model, same input, but different hardware (e.g., different GPU) -> same function, but the activation trajectory might be different (due to different implementations, precision, etc.). Output might be the same.

          - Case 3: Quantized model vs original: behaviorally similar, but activation trajectories differ. Are they the same computation? 
            - Functional equivalence: yes, they implement the same function.
            - Causal structure (as per mechanistic interpretability): no, because the features and circuits might be different.

     **Translation with stipulation**: 
          - The ML field uses behavioral equivalence as a practical standard for model deployment (same input -> same output). But for mechanistic interpretability, the internal causal structure matters.

          - Therefore, we can pose the question, but we must specify the grain: 
              - Coarse grain (behavioral): same if same input-output mapping.
              - Fine grain (mechanistic): same if same causal structure (activation patterns, circuits) for the same input.

     The original philosophical dispute about how finely to individuate computations is mirrored in ML by the choice between behavioral and mechanistic equivalence.

  7. **Problematic Cases**:
     - **(a) Batched forward pass with shared caches**: 
          - The physical process is one (a single kernel call over the batch). But we conventionally attribute individual computations per sequence. This is a scheduling artifact. 

          - **Translation**: We can cleanly say that one physical process (the batched forward pass) hosts `batch_size` computations (one per sequence). The shared cache (like KV cache in autoregressive decoding) is part of the state for the sequences. However, note that in the initial prompt processing, the entire batch is processed together, and then in subsequent token generations, the cache is updated per sequence. The boundary is set by the model's design and the batch scheduling.

          - **Residue**: The translation is clean under the convention that one sequence processing is one computation.

     - **(b) Quantized or distilled model vs original**:
          - They are behaviorally equivalent (within tolerance) but have different activation-level causal structures.

          - **Translation**: 
