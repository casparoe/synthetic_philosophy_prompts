      Predicted answer: She might argue that we can use adversarial training to make the judge robust and that we can design the debate to force the debaters to point to verifiable facts. But she might concede that in the absence of ground truth, we rely on the process and that this is an ongoing research challenge.
      Confidence: High. This is a known challenge in the literature.

   4. (Control condition) How would we test that two debaters plus a judge actually outperforms one honest system plus the same judge? If that comparison is difficult to run, why should we consider debate the default approach rather than an unproven hypothesis?
      Predicted answer: She might point to existing experiments (like those from OpenAI or elsewhere) that show improved judge accuracy with debate, and argue that in complex tasks, the single system without debate might not be able to produce a checkable answer at all. But she might also acknowledge the need for more rigorous comparisons.
      Confidence: Medium. She has empirical leanings and will cite studies, but the control might be hard.

   5. (Honest debater's burden) Sometimes the correct answer is correct for reasons that are too complex for the judge to follow without essentially reproducing the entire computation. In such a case, does debate help, or does it collapse into the judge deferring to the more persuasive debater? Worse, might it actively hurt by making the correct answer look like a losing one because it's harder to explain simply?
      Predicted answer: She might say that the debate format should allow the honest debater to break down the reasoning step by step and that the other debater's attempts to mislead will create contradictions that the judge can catch. But she might agree that if the reasoning is inherently opaque, it's a challenge and might require iterative refinement of the debate.
      Confidence: Medium. This is a subtle point and she might have a nuanced answer.

   6. (Model judge) Since the scheme must scale, we'll eventually use model judges. But if the judge model is trained on similar data as the debaters, why should we expect its errors to be independent? Doesn't this risk the same shared blindspots we discussed earlier?
      Predicted answer: She might argue that we can use different training data or architectures for the judge, or use ensembles to increase diversity. She might also suggest that the debate process itself can help surface errors that the judge model wouldn't have made on its own.
