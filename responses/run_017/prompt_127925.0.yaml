   1. (Asymmetry) The core idea of debate relies on the asymmetry that checking an argument is easier than generating it. But in some domains — like evaluating the overall prudence of a complex course of action — it seems every sub-claim might be true and yet the conclusion wrong. How does debate handle a case that resists decomposition into checkable sub-claims?
