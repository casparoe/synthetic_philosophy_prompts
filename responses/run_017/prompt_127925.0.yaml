   9. (After the model judge) You've mentioned that we could use diverse models or ensembles to mitigate shared blindspots. But if we're using multiple models, why not just have them vote independently? What does debate add over simpler methods like ensembling or voting?
      Predicted answer: She would argue that debate forces the models to articulate reasons and that this can surface issues that voting doesn't, such as when a model is wrong for a systematic reason that another model can point out.
