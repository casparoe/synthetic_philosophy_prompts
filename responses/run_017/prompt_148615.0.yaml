          But if the employer hires them, they will produce only 1, so the employer will lose money. However, the employer cannot observe productivity immediately (no repeat or reputation).

     So in the separating equilibrium, the employer hires at 2, and the worker gets 2 - c_s regardless of type. 

     Then L will get the badge if 2 - c_s > 0.

     To prevent this, we need that the employer, upon seeing a badge, does not hire if they think there is a chance of L. 

     This requires that the employer's hiring decision must be sequentially rational given the equilibrium and possible deviations.

     - In a separating equilibrium, the employer's belief upon seeing a badge is that the worker is H for sure. So they should be willing to pay 2.
     - upon seeing no badge, they believe it's L, so they don't hire.

     - If L deviates and gets the badge, then the employer sees the badge and hires at 2. So L gets 2 - c_s.

     So to sustain separation, we must make it so that if L gets the badge, the employer would not want to hire. But the employer's belief upon seeing a badge is that it is H, so they would hire.

     This is the heart of the problem.

   Given the constraints, I think the only way to have an honest signal with uniform cost and then kill it with a uniform added cost is to have the high type's net surplus from signalling be positive but small, and the low type's net surplus be negative. 

   Example:

     - A online course that gives a certificate. The course is on a topic that is directly related to the job.
     - Productivity: H: 2, L: 1.
     - The course requires time and effort. The cost in terms of utility: 
          For H, the cost is c_s because they find it easy.
          For L, the cost is c_s + d because they find it hard and have to exert more effort. 
     - But wait, this differential cost is exactly what we are not allowed.

     - Uniform cost: both types have the same cost c_s.

     - Benefit: the employer offers a wage equal to expected productivity conditional on the signal.

     - Prior: very low for H: P(H)=0.01.

     - Without signal, expected productivity = 0.01*2 + 0.99*1 = 1.01.
          The employer offers a wage of 1.01 to everyone.

     - If a worker gets the certificate, then in a separating equilibrium where only H get it, the wage for certificate holders would be 2.
          For non-holders: 1.01.

     - For H: payoff with certificate: 2 - c_s.
          without: 1.01.
         所以他们只在 2 - c_s > 1.01 => c_s < 0.99 时才会去拿证书。

     - For L: payoff with certificate: 2 - c_s.
          without: 1.01.
         所以他们只在 2 - c_s > 1.01 => c_s < 0.99 时才会去拿证书。

     separation requires that L do not get the certificate, but they will if c_s<0.99.

     unless the employer, upon seeing a certificate, doesn't offer 2 because they know that if c_s<0.99, then both types will get it. 

     So the employer Bayesian updates:

          P(H | certificate) = P(certificate|H)*P(H) / [P(certificate|H)*P(H) + P(certificate|L)*P(L)]

          In a pooling equilibrium where both types get it, then this probability = 0.01.
          So wage = 0.01*2 + 0.99*1 = 1.01.

     - Then for a worker of either type: 
          with certificate: 1.01 - c_s
          without: 1.01
         所以他们只在 1.01 - c_s > 1.01 => c_s <0时才去拿证书, which is not possible.

     So in the pooling equilibrium with both types getting the certificate, the wage is the same as without, so no one gets the certificate.

     This is not what we want.

   Given the time, I will provide a model that meets the specs by allowing the benefit to be type-specific due to the employer's inference in a separating equilibrium, and then we add a uniform cost that makes the high type drop out.

   Model for the lecture:

     - Job market: workers are either High (H) or Low (L) productivity.
     - Productivity: H produces 1.5, L produces 0.5.
     - The prior is that P(H)=0.2, so the average productivity is 0.2*1.5 + 0.8*0.5 = 0.3 + 0.4 = 0.7.
     - The job pays a wage equal to the expected productivity of the worker based on the signal.

     - Signal: a cheap online test that costs c_s = 0.1.
     - The test is such that H always pass, L always fail. (But note: the low type could take the test but will fail. So they can produce the signal only if we consider taking the test as the signal, but then they are revealed to be L if they fail. So the employer sees whether they took the test and whether they passed or failed.)

     - However, the employer only gets to see the test result if the worker takes the test.

     - If a worker takes the test:
          - If they pass, the employer knows they are H and offers wage=1.5.
          - If they fail, the employer knows they are L and offers wage=0.5.
     - If a worker does not take the test, the employer offers the prior wage=0.7.

     - Payoff to worker = wage - cost (if they took the test).

     - For H: 
          Take test: pass, so 1.5 - 0.1 = 1.4.
          Not take: 0.7.
          So they take the test: 1.4 > 0.7.

     - For L: 
          Take test: fail, so 0.5 - 0.1 = 0.4.
          Not take: 0.7.
          So they do not take the test: 0.7 > 0.4.

     So in equilibrium, only H take the test. The signal (taking the test and passing) is honest: only H are in the group that passes.

     The net surplus for H from signalling: 1.4 - 0.7 = 0.7.

     Now, we add a uniform cost: say, an additional fee for using the testing platform of 0.6. This is a uniform cost because both types pay it if they take the test.

     - New cost of taking the test: 0.1 + 0.6 = 0.7.

     - For H: 
          Take test: 1.5 - 0.7 = 0.8.
          Not take: 0.7.
          So they are almost indifferent. Let's assume they still take it: 0.8 > 0.7.

     - For L:
          Take test: 0.5 - 0.7 = -0.2.
          Not take: 0.7.
          So they do not take it.

     So the signal is still honest.

     But wait, the net surplus for H is now 0.8 - 0.7 = 0.1, which is thin. 

     If we make the uniform cost a bit higher, say 0.61, then cost=0.71.
          H: 1.5 - 0.71 = 0.79 < 0.7 -> they do not take the test.
          L: still would not take it.

     So then no one takes the test. 
          - The employer then offers the prior wage=0.7 to everyone.
          - The signal carries no information.

     This is the participation margin: the uniform cost made the net benefit for H negative, so they dropped out.

     However, note that in this model, the signal for H is not just taking the test but passing it. The employer only sees the result if the worker takes the test. 

     And the added cost is uniform: both types pay the same extra fee.

     But is the initial signal cheap? The cost 0.1 is small compared to the surplus at stake: the surplus at stake for H is 1.5 - 0.7 = 0.8, and the cost is 0.1, which is 12.5% of the surplus. The added cost of 0.6 makes the total cost 0.7, which is 87.5% of the surplus.

     We can scale it to make the cost even smaller.

     Scale up the productivities and the costs proportionally to make the initial cost a smaller fraction.

     Example scale by 10:

          H: 15, L: 5.
          Prior: P(H)=0.2, so prior wage=0.2*15+0.8*5=3+4=7.
          Initial test cost: 1 (which is about 1/8 of the surplus for H: surplus=15-7=8, so 1/8=12.5%).
          Equilibrium initially: 
              H: take test: 15-1=14 >7.
              L: take test: 5-1=4 <7 -> do not take.
          So honest signal.

          Add uniform cost: 6. 
          Total cost: 1+6=7.
          H: 15-7=8, which is greater than 7? They are exactly at the margin: 8>7 -> still take.
          If we make the uniform cost 6.1, then cost=7.1.
              H: 15-7.1=7.9 < 7 -> do not take.
              L: 5-7.1 = -2.1 <7 -> do not take.
          So no one takes.

     In this scaled version, the initial cost is 1 out of a surplus of 8 (12.5%). The uniform cost added is 6, making the total cost 7, which is 87.5% of the surplus.

     We can make the initial cost even smaller relative to the surplus by scaling further or by adjusting the numbers.

     Alternatively, we can make the prior more informative. For example, if the prior is more accurate, then the gain from signalling is smaller.

     Let me try to make the initial cost a smaller fraction by increasing the productivity of H while keeping the cost fixed.

     But in any case, we have a model that works.

     The key features:

          - The signal has to be such that if the worker takes the signal and is revealed to be L, they get a low wage.
          - The uniform cost added makes the net benefit for H from taking the test negative.

     Now, the added cost is uniform: both types pay the same extra cost. 

     If instead the added cost were differential in the Spence direction (costs more for L), then making the cost higher might actually enhance separation. For example, if the added cost is 0.6 for H and 1.2 for L, then:
          H: cost becomes 0.1+0.6=0.7, payoff=1.5-0.7=0.8.
          L: cost becomes 0.1+1.2=1.3, payoff=0.5-1.3=-0.8.
          So H still takes, L does not.

     The Zahavian reply: 
          The handicap principle requires that the cost be differential, not necessarily that it be high in absolute terms. 
          In our initial cheap honest signal, the cost was differential in the sense that it had a differential impact: for L, taking the test and failing gave them a low wage, so the expected benefit was lower. 
          But note: the cost of taking the test was the same, but the outcome was different. The employer's wage response to the test result created the difference in net benefit.

          However, in the standard handicap story, the cost is directly differential (e.g., the same signal is more costly for the low type to produce). In our case, the cost is the same, but the probability of passing is different.

          Zahavi might say that the test is an index of quality because only H can pass it. But wait, the low type can take the test, but they fail. So the signal of passing is an honest signal because it is impossible for the low type to produce it. 

          This violates the condition: "the low type really does want to pass as the high type and could produce the signal if it wanted". In this model, the low type cannot produce the signal (pass) even if they take the test. 

          So we used an "index" or "physical-impossibility cheat".

     Therefore, to meet the condition that the low type could produce the signal if they wanted, we need to allow that the low type can sometimes pass the test. 

     Let's assume that when a worker takes the test:
          H always passes.
          L passes with probability q.

     The employer, upon seeing a passed test, will offer a wage equal to the expected productivity of a worker who passed.

     In the initial setting with cost c_s=0.1, we want an equilibrium where only H take the test.

     - If only H take the test, then if the employer sees a passed test, they know it's H, so wage=1.5.
       For a worker who does not take the test, the wage=0.7.

     - For H: take test: 1.5 - 0.1 = 1.4 > 0.7.
     - For L: 
          If they take the test, they pass with probability q and get 1.5, fail with probability 1-q and get 0.5. So expected wage: q*1.5 + (1-q)*0.5 = 0.5 + q.
          Net: 0.5 + q - 0.1 = 0.4 + q.
          Without the test: 0.7.
          So they will not take the test if 0.4+q <= 0.7 => q<=0.3.

     So if q<=0.3, we have separation: only H take the test.

     The signal is not perfectly honest because if an L took the test, they might pass (with probability q) and then be mistaken for H. But in equilibrium, L don't take the test.

     Now, add a uniform cost of 0.6, making total cost=0.7.
          For H: 1.5 - 0.7 = 0.8 > 0.7? -> takes.
          For L: expected wage from taking the test: 0.5 + q - 0.7 = q - 0.2.
                without: 0.7.
          So they will not take if q - 0.2 <= 0.7, i.e., q<=0.9, which holds.

     So still separation.

     To make the high type drop out, we need to make the cost higher. 
          For H: take test: 1.5 - cost > 0.7 => cost < 0.8.
          So if cost >=0.8, H will not take.

     Add a uniform cost of 0.71, making total cost=0.81.
          H: 1.5 - 0.81 = 0.69 < 0.7 -> does not take.
          L: q - 0.81 + 0.5? Let's recalc:
              expected wage: 0.5 + q (from the wage: if pass, 1.5; if fail, 0.5; so expected=0.5 + q*(1.5-0.5)=0.5+q)
              net: 0.5+q - 0.81 = q -0.31.
              without: 0.7.
              so take only if q -0.31 >0.7 => q>1.01, which is impossible.

     So no one takes.

     This meets the condition: the low type could produce the signal (they can take the test and have a chance to pass) but in equilibrium they don't because the cost is too high relative to the expected wage.

     The initial cost is 0.1, the surplus at stake for H is 1.5-0.7=0.8, so cost is 12.5% of the surplus.

     The uniform added cost is 0.71, which is not differential.

     So we have a model.

     Summary of the example for the lecture:

     Setting: Online job market. Workers have productivity: high type 1.5, low type 0.5. The prior is that 20% are high type, so the average wage without signal is 0.7.

     Workers can take a quick online test at a cost of 0.1. High types always pass, low types pass with probability q=0.3. 
     - If a worker takes the test and passes, the employer offers 1.5.
     - If they take and fail, the employer offers 0.5.
     - If they don't take, the employer offers 0.7.

     In equilibrium, only high types take the test, because for a low type the expected wage from taking the test is 0.5 + 0.3 = 0.8, minus cost 0.1, gives 0.7, which is equal to not taking. So they are indifferent and we can assume they don't take. High types get 1.5-0.1=1.4.

     Now, the platform introduces a new fee of 0.71 for taking the test (uniformly applied). 
     - Total cost becomes 0.81.
     - High type: taking yields 1.5 - 0.81 = 0.69, which is less than 0.7, so they don't take.
     - Low type: expected wage from taking is 0.5 + 0.3 = 0.8, minus cost 0.81, gives -0.01, which is less than 0.7,所以他们也不参加。

     So no one takes the test. The employer then offers 0.7 to everyone. The test, which was once an honest signal, is now unused and carries no information.

     The key feature is the participation margin: the uniform cost made the net benefit for the high type negative, and the low type was already not taking it.

     If the added cost were differential (higher for the low type), then we might still have separation. For example, if the added cost is 0.71 for the high type and 0.72 for the low type, then:
          High type: 1.5 - (0.1+0.71) = 0.69 <0.7 -> still doesn't take.
          Low type: expected wage 0.8 - (0.1+0.72) = 0.8-0.82 = -0.02 -> doesn't take.
     So still no one takes.

     But if the added cost is in the Spence direction (higher for low type), but not enough to make the high type's net benefit negative, then separation might still occur.

     For example, if the added cost is 0.6 for high and 0.7 for low, then:
          High type: 1.5 - (0.1+0.6)=0.8 >0.7 -> takes.
          Low type: 0.8 - (0.1+0.7)=0.0 <0.7 -> does not take.

     So separation maintained.

     The Zahavian reply: 
          The handicap principle is about the cost being a differential handicap. In our initial model, the cost was not directly differential (both paid the same cost to take the test), but the expected benefit was differential because the low type had a lower chance of passing. This is a form of differential net cost. 
          So the cheap signal was honest because it imposed a differentially higher expected cost on the low type (since they often waste the cost and get a low wage).

          Therefore, our example does not contradict the handicap principle; it is an instance of it. The added uniform cost then made the overall cost too high for the high type to participate.

     Is this reply ad hoc? 
          In the handicap principle, the core idea is that the signal must be costly in a way that is inversely related to quality. In our case, the expected cost of attempting the signal is higher for the low type (because they have to pay the cost and are more likely to fail and get a low wage). So the expected net benefit is higher for the high type. 

          The added uniform cost made the signal too costly for the high type in absolute terms, and since the low type was already not signaling, the signal died.

     This example illustrates the participation margin, which is often overlooked in the mimicry margin-focused literature.

   We have built the requested case.
answer: |-
  Here's a crisp case meeting your specs, centered on job applications with a skill test:

  **Ordinary Setting**  
  Consider a freelance platform where clients hire programmers for small tasks. Workers are either high-skill (H, 20% of pool) or low-skill (L, 80%). The task pays $15 if done well (H delivers) or $0 if botched (L attempts). Without signals, clients pay the average wage: $3 (since 0.2 × 15 + 0.8 × 0 = 3). Workers can take a quick 10-minute test (cost: $0.10 effort). H always passes; L passes only 30% of the time. Clients pay based on test results: pass → $15, fail → $0, no test → $3.  

  **Initial Equilibrium (Cheap Honest Signal)**  
  - **H takes test**: Pays $0.10, passes, earns $14.90 net. Better than $3.  
  - **L avoids test**: Expected wage if tested = (30% × $15 + 70% × $0) = $4.50, minus $0.10 cost = $4.40. Worse than $3.  
  *Result*: Only H tests. Passing signals H honestly.  

  **Added Uniform Cost Kills Signal**  
  Now impose a $2.90 platform fee on test-takers (e.g., mandatory "proctoring surcharge"). Total test cost rises to $3.00:  
  - **H**: $15 - $3.00 = $12.00. Worse than $3 wage without testing.  
  - **L**: $4.50 - $3.00 = $1.50. Worse than $3.  
  *Result*: No one tests. Clients pay $3 to all. The now-costly signal carries *zero information* even though it’s more expensive.  

  ### Key Mechanism: Participation Margin  
  The **good type’s thin surplus** ($14.90 - $3 = $11.90 net gain initially) is wiped out by the uniform cost. The bad type was already deterred (net loss if tested). Raising costs uniformly excludes the high type first, collapsing the signal.  

  ### If Cost Were Differential (Spence-Compliant)  
  Suppose the fee were $2.90 for L but only $2.00 for H (e.g., H finishes faster). Then:  
  - H nets $15 - $2.10 = $12.90 > $3 → still signals.  
  - L nets $4.50 - $3.00 = $1.50 < $3 → still silent.  
  *Result*: Signal remains honest. Differential costs preserve separation via the mimicry margin.  

  ### Zahavian Reply & Why It’s Not a Counterexample  
  Zahavi’s handicap principle requires only *differential* (not high absolute) costs. Here, the cheap test’s honesty relied on higher *expected* cost for L (wasted effort + failure risk), satisfying differentiality. The uniform fee violates this by taxing H disproportionately *at the participation margin*. This isn’t a counterexample to Zahavi but exposes a blind spot: classical models fixate on deterring mimics, ignoring that signalers must first find participation worthwhile. The reply isn’t ad hoc—it refines handicap theory to include participation incentives.  

  **Lecture Punchline**: Credentialism fails when costs uniformly rise not because fakers mimic more, but because the best performers opt out. Real-world cases: rising application fees deterring high-quality job candidates, or onerous certification processes reducing expert participation on platforms.
