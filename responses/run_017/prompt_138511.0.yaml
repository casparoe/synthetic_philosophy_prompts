  ### Decision Procedure for Ruling on Amendments to Standing Orders

  This procedure provides a step-by-step method to determine if a proposed amendment is in order under the Standing Orders (SOs). It is designed to be executed in under two minutes, fits on one A4 page, and yields a clear ruling with a one-sentence reason. The procedure addresses the internal logic of the rules, focusing on three core distinctions: **adoption conditions** (majority required, meeting sequence), **content** (what the amendment changes), and **commencement** (when it takes effect). These distinctions must be retained as they are fundamental to the SOs' operation and cannot be simplified further. Other nuances (e.g., historical intent, external legal principles) are dropped to ensure brevity and practicality.

  #### Decision Procedure Flowchart
  1. **Question 1: Does the amendment modify any part of SO1, SO2, SO3, or SO4?**  
     - *Check:* Review the amendment's content. Does it alter text in SO1–SO4 or affect their application (e.g., changing entrenchment in SO2)?  
     - *Sufficient answer:* Yes or No.  
     - *If Yes:* Proceed to Question 1A.  
     - *If No:* The amendment requires a simple majority under SO1. Proceed to Question 2.  

     **Question 1A: Is the amendment attempting to alter the adoption conditions for itself at this meeting?**  
     - *Check:* Does it change the majority or procedural rules (e.g., voting threshold) that apply to its own adoption *during this meeting*?  
     - *Sufficient answer:* Yes or No.  
     - *If Yes:* **Rule out of order.** Reason: "An amendment cannot alter the conditions for its own adoption at the same meeting."  
     - *If No:* The amendment requires a two-thirds majority at this meeting and must pass again at the next meeting (SO2). Proceed to Question 2.  

  2. **Question 2: Does the amendment attempt to take effect before the close of the meeting?**  
     - *Check:* Does its text state or imply immediate effect or effect during the meeting (e.g., "this amendment takes effect immediately")?  
     - *Sufficient answer:* Yes or No.  
     - *If Yes:* **Rule that the immediate-effect provision is of no effect** (SO3), but the amendment may proceed if the remainder can stand alone (SO5). Proceed to Question 3.  
     - *If No:* Proceed to Question 3.  

  3. **Question 3: Does the amendment repeal SO1 and/or SO2 without providing an alternative amending power?**  
     - *Check:* Does it remove SO1 and/or SO2 entirely, leaving no mechanism to amend SOs?  
     - *Sufficient answer:* Yes or No.  
     - *If Yes:* **Rule in order** (SO1 and SO2 allow their own repeal via their procedures). Reason: "Repeal of amending powers is permitted under the existing rules."  
     - *If No:* Proceed to ruling.  

  4. **Ruling:**  
     - If not ruled out of order at any step, the amendment is **in order**.  
     - State the required majority (from Q1/Q1A) and any notes (e.g., severed provisions from Q2).  
     - Example reason: "In order; requires [simple/two-thirds] majority as it [does/does not] modify entrenched orders."  

  **Where the Procedure Stops for Human Judgment:**  
  - If the amendment creates unresolvable conflict (e.g., two amendments to the same SO at one meeting), the procedure halts. Rule: "Out of order due to conflict; the Society must prioritise amendments or re-draft." This requires human intervention to sequence motions or clarify intent.  
  - If the SOs yield no answer after all steps (e.g., adopting a drifted consolidated text), rule: "Out of order; the Orders do not cover this case." The Convener must then facilitate a vote on the Society's intent (not the rules' logic).  

  **What the Procedure Cannot Do:**  
  - **Justify rulings persuasively:** It supplies a decision but may not convince members who dispute the logic (e.g., self-protection of SO2).  
  - **Resolve conflicts between amendments:** It flags conflicts but cannot sequence or reconcile them automatically.  
  - **Handle "drifted" consolidated texts:** It rules such motions out of order, risking dissatisfaction if the Society desires validation.  

  ---

  ### Application to Cases  
  *Using the procedure above:*

  #### Case 1: Motion to delete "2" from the list in SO2  
  - **Q1:** Yes (modifies SO2, an entrenched order).  
  - **Q1A:** No (does not alter its own adoption conditions).  
    *→ Requires two-thirds majority at two successive meetings.*  
  - **Q2:** No (no immediate effect specified).  
  - **Q3:** No (does not repeal SO1/SO2).  
  - **Ruling:** **In order.** Reason: "In order; requires two-thirds majority at two meetings as it modifies an entrenched order."  
  - *Note:* Your prior ruling (one majority cannot bind successors) is incorrect here; SO2 explicitly protects itself, and the procedure respects that self-referential entrenchment.  

  #### Case 2: Motion to amend SO3 and change voting threshold for a later ballot (self-commencing)  
  - **Q1:** Yes (modifies SO3, an entrenched order).  
  - **Q1A:** No (alters a future ballot, not its own adoption).  
    *→ Requires two-thirds majority at two successive meetings.*  
  - **Q2:** Yes (attempts immediate effect for the ballot change).  
    *→ Sever the immediate-effect provision as ineffective (SO3). The SO3 amendment may stand if capable alone (SO5).*  
  - **Q3:** No (does not repeal SO1/SO2).  
  - **Ruling:** **In order, with severed provision.** Reason: "In order with immediate effect voided; requires two-thirds majority at two meetings as it modifies an entrenched order."  

  #### Case 3: Motion to repeal SO1 and SO2 outright  
  - **Q1:** Yes (modifies entrenched orders SO1 and SO2).  
  - **Q1A:** No (does not alter its own adoption).  
    *→ Requires two-thirds majority at two successive meetings.*  
  - **Q2:** No (no immediate effect specified).  
  - **Q3:** Yes (repeals amending powers without replacement).  
    *→ Rule in order (per Q3).*  
  - **Ruling:** **In order.** Reason: "In order; requires two-thirds majority at two meetings to repeal entrenched orders."  

  ---

  ### Recommendations for Missing Rules  
  The SOs lack:  
  1. A rule resolving conflicts between amendments to the same SO at one meeting.  
  2. A rule prohibiting amendments from altering their own adoption conditions.  
  3. A residual clause for cases the SOs do not cover.  

  **Proposed Amendments to Insert:**  
  - **SO7 (Conflict Resolution):** "If multiple amendments to the same Standing Order are adopted at one meeting, they take effect at the close of the meeting in the order of adoption, with later amendments prevailing over earlier ones in case of conflict."  
  - **SO8 (Adoption Conditions):** "No amendment may alter the conditions for its own adoption at the meeting at which it is moved."  
  - **SO9 (Residual Clause):** "Any matter not provided for in these Orders shall be decided by the Convener by applying the principles of these Orders, with reference to standard parliamentary procedure."  

  **How to Adopt These Safely:**  
  - Use the procedure above to adopt them as non-entrenched orders under SO1:  
    - **Q1:** No (SO7–SO9 are new, not modifying SO1–SO4).  
    - **Q1A:** Not applicable.  
    - **Q2:** No immediate effect.  
    - **Q3:** No repeal of SO1/SO2.  
    - **Ruling:** In order with simple majority.  
  - This avoids circularity: the amendments are adopted under existing SO1, and only take effect post-meeting (SO3), so they do not govern their own adoption.  

  **Final Note:** This procedure prioritises the SOs' literal logic over policy preferences. If members challenge its fairness, emphasise that amendments can change the rules—but must follow them first.
