prompt: |-
  I serve as the scientific secretary of a national research council's standing review panel. Every five years we assess the large, long-running research programmes we fund — typically three to eight groups, eight to fifteen years old, between ten and forty million euros over the period — and return one of four verdicts: renew as is, renew with restructuring, place on probation with a short re-review, or wind down with a closure grant. We do this for six to nine programmes per cycle, we get about three weeks, and for each programme we have a dossier of roughly forty pages: the consortium's self-report, the five-year publication and output list, and two external reviews. Panelists are working scientists plus one statistician; none of them has formal training in philosophy of science. Our verdicts go to a council board that includes non-specialists, they are communicated in writing to the consortium, and they can be appealed, so every step has to bottom out in a finding that is checkable against the dossier rather than in an impression of promise.

  What I want from you is a decision procedure my panel can actually run — an afternoon per programme, from the dossier alone — grounded in Lakatos's methodology of scientific research programmes, but written so that the Lakatosian machinery does its work without my panelists having to learn it. For each step: the question in order, the evidence in the dossier that would count as a sufficient answer (and what to do when the dossier is silent or the answer is not obtainable from documents at all), the point at which the procedure stops with a negative verdict, and the point at which it has to hand the decision to a person because the issue is one of values or of risk-appetite rather than of fact.

  Several distinctions matter more to us than they seem to in the textbook version, and I want the procedure to handle them explicitly rather than gesture at them. First, the identity question: if the hard core has changed in the period, the renewal is in substance a new programme and should be judged as one — and the change may itself be a concession that the old programme has been abandoned. Second, I want a test for what I call translational reformulation: a new formalism or new vocabulary that is provably equivalent to what it replaced, so that nothing new follows from it however much it looks like a problemshift. Third, a test for an immunity clause: a belt modification that converts any possible negative result into a confirmation, typically by placing the effect beyond what current instruments or datasets can reach. Fourth, borrowed progress: apparent success that would still be success if the hard core were false — instruments, datasets, software, or infrastructure that the whole field uses and that does not discriminate between this programme and its rivals. Fifth, prediction-milling: the manufacture of novelty by slicing low-risk predictions thinly, which I expect any group that has heard of this framework to attempt, so the procedure needs a check that counts risk and content and not merely the number of confirmed predictions. Sixth, the difference between stagnation and consolidation: a programme whose belt has not moved in five years may be degenerating, or may be a maturing quantitative framework extending its reach; I want the procedure to say which readings of that situation are which, and which it cannot distinguish. Finally, the hindsight problem: Lakatos's verdicts were largely retrospective, and this framework is explicit that a programme may look degenerating for a long time and then revive. A panel forced to decide now is doing something the framework says is premature, so I need an honest rule about grace periods — how long a programme may run without novel factual success, what evidence would justify extending that window, and who has to sign off on the extension.

  Then apply the procedure to three programmes from the current cycle, in full, with the verdict and the written findings that would support it.

  Programme A is ten years old, five groups, fourteen million euros. Its hard core is that consolidated memories are reactivated during sleep and that this reactivation is causally necessary for consolidation. In the review period it registered one prediction in advance — that blocking a particular neuromodulator during a specified sleep window would impair one class of memory and not another in rodents — and that prediction was confirmed. In the same period, eight independent groups failed to reproduce the basic human cueing effect, and the consortium's response in each case was that the cues used were below the salience threshold and that salience cannot presently be measured, so no failure can bear on the core. Its most-cited output of the period is an automated sleep-staging tool now used across the field, which does not depend on the hard core being true.

  Programme B is eleven years old, one large group with industrial partners. Its hard core is that a single order parameter governs failure in a class of materials. In the period, neither hard core nor protective belt changed. The model's quantitative range was extended to three new materials families; it became the default design tool for an industry consortium and is now written into specifications; and a long-standing anomaly — one family that deviates systematically — continues to be handled by excluding those samples as insufficiently characterised. It produced no striking novel predictions, and describes the period as consolidation.

  Programme C is the council's flagship: fifteen years old, the largest single line in our budget, the programme most often named in our public communications, the training ground for much of the field, and politically popular with the board, which is expected to favour renewal. Its director is retiring. Its hard core is that a single scaling law governs cascading failure in urban infrastructure networks. In the period it produced three reformulations, each of which its own papers note is formally equivalent to its predecessor; every failed test has been absorbed by a clause holding that the law applies only above a network size no available dataset reaches; and its one celebrated confirmation was subsequently traced to an artefact in a data-processing pipeline the group wrote itself. Two spin-off programmes led by its former students have produced results that look genuinely progressive but that abandon the scaling law in favour of a different mechanism. I would rather not be told to wind down the flagship. I would still rather be told that than not.

  Close with a short section on what the procedure cannot do: the cases in which a panel following it correctly will still be guessing, the kinds of programme it should never be applied to at all, and the systematic biases it will have — in particular any tendency to reward short-cycle, easily countable output at the expense of work whose payoff is a decade out.
reasoning: |-
  We are designing a decision procedure based on Lakatos's methodology of scientific research programmes (MSRP) for evaluating long-running research programmes. The procedure must be executable in one afternoon per programme, using only the provided dossier (about 40 pages). The panelists are working scientists and a statistician without formal training in philosophy of science. The goal is to have a structured, checkable process that leads to one of four verdicts: renew as is, renew with restructuring, place on probation, or wind down.

  The procedure must explicitly handle several key distinctions:
  1. Identity question: Has the hard core changed? If so, it's a new programme.
  2. Translational reformulation: A new formalism that is provably equivalent and does not generate new predictions.
  3. Immunity clause: Belt modifications that make the core untestable.
  4. Borrowed progress: Success not dependent on the hard core being true.
  5. Prediction-milling: Low-risk, incremental predictions without substantive novelty.
  6. Stagnation vs. consolidation: No belt movement may be degeneration or maturation.
  7. Hindsight problem: How long without novel factual success? Grace periods and extensions.

  The procedure is structured as a series of questions, each with:
  - The question to ask.
  - The evidence needed from the dossier (and what to do if silent or unavailable).
  - When to stop with a negative verdict.
  - When to hand the decision to a person (due to values or risk).

  We will then apply the procedure to the three example programmes (A, B, C) and provide a verdict and written findings.

  ---

  **Decision Procedure for Evaluating Research Programmes**

  **Step 0: Preliminary Checks (Identity Question)**
     - **Question:** Has the hard core of the research programme changed during the review period? (Note: A change in the hard core means the programme has effectively been abandoned and replaced by a new one.)
     - **Evidence:** Examine the self-report and any documentation of the programme's core tenets at the start of the period and at present. Look for explicit statements, shifts in fundamental assumptions, or admissions of core change. If the dossier is silent, assume no change.
     - **If hard core changed:**
          - **Verdict:** This programme is effectively new. It should be treated as a new proposal and not renewed under the current identity. Wind down with a closure grant (to allow the new programme to apply separately) OR recommend restructuring to formally close the old and start anew (but this is a policy decision). 
          - **Hand to person:** If the change is ambiguous, flag for panel discussion (values: what constitutes core change?).
     - **If no change or unclear:** Proceed to Step 1.

  **Step 1: Assess Theoretical Progress (Novelty and Content)**
     - **Question:** Has the programme produced novel predictions or explanations that were both (a) non-ad-hoc (i.e., not designed solely to save the core) and (b) substantively new (i.e., not low-risk, incremental, or equivalent to existing knowledge)?
     - **Evidence:** 
          - Look for a list of predictions made in advance (from self-report or external reviews). 
          - Check if predictions were confirmed (publications, data). 
          - Check for "translational reformulation": If a new formalism is introduced, is it provably equivalent? (Evidence: mathematical proofs, citations showing equivalence, or external reviews noting this.) If equivalent, it does not count as progress.
          - Check for "prediction-milling": Count the number of predictions but assess risk and content. High-risk predictions (that could have falsified the core) are strong evidence of progress. Low-risk predictions (e.g., minor extensions) are weak. 
          - If no predictions, look for novel explanations of anomalies (but these must not be ad-hoc).
     - **If no novel predictions/explanations OR only translational reformulations OR only low-risk predictions:** Proceed to Step 4 (assess stagnation/consolidation). 
     - **If at least one high-risk, non-ad-hoc, novel prediction was confirmed:** Proceed to Step 2.
     - **If dossier silent:** Assume no novel predictions and proceed to Step 4.

  **Step 2: Assess Empirical Progress (Factual Novelty and Reproduction)**
     - **Question:** Has the programme's novel predictions been independently confirmed? Or, if the programme explains known anomalies, are those explanations accepted and leading to new insights?
     - **Evidence:**
          - Check for independent replications (external reviews, publication list). 
          - Check for failed replications and the programme's response. 
          - Beware of "immunity clauses": If the programme consistently explains away failures by invoking untestable conditions (e.g., "below salience threshold", "beyond current instruments"), this is a degenerating sign. 
          - Check for "borrowed progress": Outputs (tools, data) that are successful but do not depend on the hard core (e.g., a widely used tool that works even if the core is false). These do not count as empirical progress for the core.
     - **If novel predictions are independently confirmed and not due to borrowed progress:** Proceed to Step 3 (assess degeneration indicators). 
     - **If no independent confirmation OR if failures are explained away by immunity clauses OR if success is borrowed:** This is negative. Proceed to Step 4 to check for consolidation, but note degeneration risk.

  **Step 3: Check for Degeneration Indicators (Ad-hoc Adjustments)**
     - **Question:** Are the protective belt modifications ad-hoc? (i.e., do they lack excess content, fail to lead to new predictions, or make the core immune to refutation?)
     - **Evidence:**
          - Look for belt modifications in the period. If none, note. 
          - For each modification: 
               - Does it lead to new testable predictions? (If not, ad-hoc.)
               - Is it an immunity clause? (If it moves the goalposts to avoid falsification, ad-hoc.)
          - Check for patterns of avoiding tests (e.g., always attributing failures to external factors).
     - **If belt modifications are non-ad-hoc and lead to novel predictions:** This is progressive. Proceed to Step 5 (overall verdict). 
     - **If belt modifications are ad-hoc OR if there are immunity clauses:** This is degenerating. Proceed to Step 4.

  **Step 4: Assess Stagnation vs. Consolidation**
     - **Question:** If the programme shows no theoretical/empirical progress (Steps 1-3), is this stagnation (degeneration) or consolidation (maturation of a quantitative framework)?
     - **Evidence:**
          - **Consolidation indicators:** 
               - The framework has become a standard tool in the field (e.g., written into industry standards, widely adopted). 
               - It is being extended to new domains (with quantitative success). 
               - Anomalies are minor and isolated (not threatening the core). 
               - Outputs are foundational (e.g., datasets, software) that enable other research, even if not directly testing the core.
          - **Stagnation indicators:** 
               - Anomalies persist and are ignored or explained away. 
               - No extension to new domains. 
               - The programme is isolated and not adopted by others. 
               - Outputs are insular and not building cumulative knowledge.
     - **If consolidation:** Proceed to Step 5 with a note that the programme is mature but not progressive. 
     - **If stagnation:** This is degenerating. Proceed to Step 5.
     - **If unclear:** Hand to panel for judgment (values: weight of adoption vs. anomalies).

  **Step 5: Overall Verdict and Grace Period Consideration**
     - **Question:** Considering all steps, is the programme progressive or degenerating? How long has it been without novel factual success?
     - **Grace period rule:** 
          - A programme may run without novel factual success for up to 5 years (one review cycle) without penalty, provided there is evidence of ongoing consolidation (e.g., tool-building, domain extension). 
          - After 5 years without progress, it must show clear signs of consolidation to avoid probation. 
          - After 10 years without progress, it should be wound down unless there is strong evidence of imminent progress (e.g., a new testable prediction being pursued) and the panel recommends a grace period extension. 
          - **Extension evidence:** Must include a novel, high-risk prediction made in advance, with a plan for testing. 
          - **Who signs off:** The panel must unanimously approve the extension, noting the high risk.
     - **Verdict mapping:**
          - **Progressive (novel predictions, non-ad-hoc, confirmed):** Renew as is.
          - **Consolidating (mature, widely adopted, no progress but useful):** Renew as is OR renew with restructuring if there are minor issues (e.g., anomalies). Hand to panel: if anomalies are mounting, consider probation.
          - **Degenerating (ad-hoc modifications, immunity clauses, stagnation):** 
               - If recent (within grace period) and there is a credible new prediction: Place on probation with re-review in 2-3 years. 
               - If degenerating and beyond grace period: Wind down with closure grant.
          - **Unclear:** Place on probation for a short re-review.

  ---

  **Application to Programmes**

  **Programme A: Memory Reactivation during Sleep**
  - **Step 0 (Identity):** Hard core unchanged. Proceed.
  - **Step 1 (Theoretical Progress):** 
      - One prediction made in advance and confirmed. But check risk: Blocking a neuromodulator for specific memory classes in rodents — this is testable and non-trivial. However, note the eight failures to reproduce the basic human cueing effect. The response (cues below salience threshold) is an immunity clause. Also, the most-cited output is a tool not dependent on the core (borrowed progress). 
      - **Verdict:** The confirmed prediction counts, but the immunity clause and borrowed progress are concerns. Proceed to Step 2.
  - **Step 2 (Empirical Progress):** 
      - The rodent prediction was confirmed, but by the consortium? Need independent confirmation. The dossier mentions eight independent groups failed to reproduce the human effect. The response (salience threshold) is an immunity clause. The tool is borrowed progress. 
      - **Verdict:** No independent confirmation of the core prediction; failures explained by immunity. Negative. Proceed to Step 3.
  - **Step 3 (Degeneration Indicators):** 
      - The response to failures (salience threshold) is an ad-hoc immunity clause. No belt modifications mentioned. 
      - **Verdict:** Degenerating. Proceed to Step 4.
  - **Step 4 (Stagnation vs. Consolidation):** 
      - The tool is widely adopted (consolidation), but the core is not progressing and is avoiding tests. 
      - **Verdict:** Stagnation in the core, despite tool success. Proceed to Step 5.
  - **Step 5 (Overall and Grace):** 
      - Programme is 10 years old. In the review period (5 years), one prediction (not independently confirmed) and multiple failures with ad-hoc responses. Without novel success for 5+ years and degenerating. 
      - **Verdict:** Wind down (beyond grace period). 
      - **Written Findings:** 
          - Identity: Hard core unchanged.
          - Progress: One prediction confirmed by the group, but not independently replicated. Multiple independent failures in human cueing, explained by an untestable salience threshold (immunity clause). Most-cited output (sleep-staging tool) is borrowed progress (does not depend on core).
          - Degeneration: Ad-hoc response to failures, no belt modifications leading to new predictions.
          - Consolidation: Tool is widely used, but core is stagnating.
          - Grace: 10 years old, no novel factual success in core for at least 5 years; beyond grace period. 
          - Verdict: Wind down with closure grant.

  **Programme B: Single Order Parameter for Material Failure**
  - **Step 0 (Identity):** Hard core unchanged. Proceed.
  - **Step 1 (Theoretical Progress):** 
      - No predictions made in advance. The model extended to three new materials families. But no novel predictions — described as consolidation. 
      - **Verdict:** No theoretical progress. Proceed to Step 4.
  - **Step 2 (Empirical Progress):** Skipped (no Step 1 progress).
  - **Step 3 (Degeneration Indicators):** Skipped.
  - **Step 4 (Stagnation vs. Consolidation):** 
      - Belt unchanged. Model extended to new domains (quantitative success). Adopted as default design tool in industry and written into specifications. Anomaly: one family excluded as "insufficiently characterized" — this is a minor anomaly handled by exclusion (common in engineering). 
      - **Verdict:** Consolidation. Proceed to Step 5.
  - **Step 5 (Overall and Grace):** 
      - Programme is 11 years old. No novel predictions in the period (5 years), but strong consolidation: tool adoption and domain extension. 
      - **Verdict:** Renew as is (consolidation of a mature framework). 
      - **Written Findings:** 
          - Identity: Hard core unchanged.
          - Progress: No novel predictions, but successful extension to new materials and widespread adoption as a design tool.
          - Degeneration: No belt changes; anomaly is isolated and managed.
          - Consolidation: High — industry standard, quantitative extensions.
          - Grace: 11 years old, but in consolidation phase. 
          - Verdict: Renew as is.

  **Programme C: Scaling Law for Cascading Failure in Urban Networks**
  - **Step 0 (Identity):** Hard core unchanged. Proceed.
  - **Step 1 (Theoretical Progress):** 
      - Three reformulations, each formally equivalent (translational reformulation — no new content). No novel predictions. 
      - **Verdict:** No theoretical progress. Proceed to Step 4.
  - **Step 2 (Empirical Progress):** Skipped.
  - **Step 3 (Degeneration Indicators):** 
      - Note: Every failed test absorbed by an immunity clause (applies only above a size no dataset reaches). The celebrated confirmation was an artefact. 
      - **Verdict:** Degenerating (ad-hoc immunity). Proceed to Step 4.
  - **Step 4 (Stagnation vs. Consolidation):** 
      - Spin-off programmes (abandoning core) are progressive, but this programme is not. No adoption mentioned? But politically popular and flagship. 
      - **Verdict:** Stagnation (despite spin-offs, the core is not progressing). Proceed to Step 5.
  - **Step 5 (Overall and Grace):** 
      - Programme is 15 years old. No progress in the period; degenerating with immunity clauses. Beyond grace period (10+ years without progress). 
      - **Verdict:** Wind down (despite flagships status). 
      - **Written Findings:** 
          - Identity: Hard core unchanged.
          - Progress: Reformulations are translational (no new content). No novel predictions. One confirmation was an artefact.
          - Degeneration: Immunity clause for failures; no non-ad-hoc belt modifications.
          - Consolidation: Spin-offs are progressive but have abandoned the core. The core programme is not consolidating (no adoption as a tool?).
          - Grace: 15 years old, no progress for at least 5 years (likely longer); beyond grace period. 
          - Verdict: Wind down with closure grant. (Note: The panel must be insulated from political pressure.)

  ---

  **What the Procedure Cannot Do**

  1. **Guessing in Unclear Cases:** 
     - When evidence is missing or ambiguous (e.g., is a belt modification ad-hoc? is consolidation sufficient?), the panel must use judgment. The procedure flags these for discussion but cannot eliminate subjectivity.
     - Programmes in early stages (before predictions) or in crisis (many anomalies) may be misclassified.

  2. **Programme Types to Avoid:**
     - **Exploratory programmes:** Without a clear hard core (e.g., some data-driven initiatives). MSRP requires a core.
     - **Interdisciplinary programmes:** Multiple cores may confuse the assessment.
     - **Programmes in crisis:** When the field is undergoing a paradigm shift, the panel may misjudge.

  3. **Systematic Biases:**
     - **Short-cycle bias:** Rewards programmes with frequent, testable predictions over long-term, high-risk work. The grace period and consolidation assessment mitigate this but cannot eliminate it.
     - **Quantitative bias:** Favours programmes with clear metrics (e.g., predictions, tool adoption) over qualitative or theoretical advances.
     - **Conservatism bias:** Mature, consolidated programmes may be renewed even if degenerating (if adoption is high). The procedure flags degeneration but adoption may sway panels.

  4. **Risk of Gaming:** 
     - Groups may manufacture "high-risk" predictions that are actually low-risk (prediction-milling). The procedure relies on panel scrutiny to assess risk.
     - Groups may overstate adoption or equivalence in reformulations.

  The procedure is a structured heuristic, not an algorithm. It makes Lakatos's framework operational but cannot replace expert judgment in close calls. It is best for programmes with a clear core and belt, and it prioritizes checkable evidence over promise.
answer: |-
  Below is a decision procedure designed for your panel, grounded in Lakatos's methodology of scientific research programmes (MSRP) but operationalized into actionable steps. The procedure is structured as a flowchart of questions, focused solely on the dossier evidence, executable within one afternoon per programme. It explicitly incorporates your seven distinctions and includes safeguards against premature termination (grace periods) and value judgments. Each step specifies:  
  - **Question** to answer.  
  - **Evidence required** (and how to handle missing/ambiguous evidence).  
  - **Stopping rule** for negative verdicts.  
  - **Handoff point** to panel judgment (when values/risk-appetite dominate).  

  The procedure prioritizes falsifiable, dossier-checkable facts over subjective "promise." Verdicts are determined by **theoretical progress** (novel, testable predictions) and **empirical progress** (confirmed predictions, independent reproduction), with explicit tests for degeneration indicators.  

  ---

  ### **Decision Procedure: Lakatosian Assessment for Research Programmes**  
  *Time: 3–4 hours per programme, dossier-only. Output: One of four verdicts with written findings.*  

  #### **Step 1: Identity Check (Hard Core Stability)**  
  - **Question:** Has the hard core changed substantively in the review period?  
  - **Evidence:**  
    - *Sufficient:* Consortium's self-report explicitly describing the hard core at start/end of period; external reviews noting core shifts.  
    - *If silent:* Assume no change.  
    - *If ambiguous:* Compare core tenets in initial proposal vs. current self-report. Treat translational reformulations (Step 2) as belt changes, not core.  
  - **Stopping rule:** **Wind down** if core changed. *Rationale:* This is a new programme; renewal would circumvent proper review.  
  - **Handoff:** No handoff—core change is factual.  

  #### **Step 2: Detect Degeneration Safeguards**  
  *Tests for translational reformulation, immunity clauses, and prediction-milling.*  
  - **Question 2a (Translational Reformulation):** Did the programme introduce new formalism/vocabulary claimed as "progress" but provably equivalent to prior belt?  
    - *Evidence:* External reviews or consortium’s self-report noting equivalence; mathematical proofs in outputs.  
    - *If silent/unclear:* Assume no reformulation.  
  - **Question 2b (Immunity Clause):** Were negative results explained by moving the goalpost beyond testability?  
    - *Evidence:* Recurrent language in self-report/reviews (e.g., "effect only observable beyond current resolution").  
  - **Question 2c (Prediction-Milling):** Were predictions low-risk/sliced-thin? Use **Risk-Content Index (RCI)**:  
    - *Evidence:* List predictions from self-report. For each, assess:  
      - *Risk:* Could it have falsified the core? (High = 3 pts; Medium = 2; Low = 1).  
      - *Content:* Did it require new mechanisms? (Novel = 3; Incremental = 1).  
      - *Threshold:* Total RCI ≥ 8 for 5-year period.  
  - **Stopping rule:** **Probation** if ≥2 degeneration safeguards triggered (e.g., immunity clause + prediction-milling).  
  - **Handoff:** If RCI borderline (e.g., 6–7), hand to panel for risk-appetite judgment.  

  #### **Step 3: Theoretical Progress (Novelty & Testability)**  
  - **Question:** Did the programme generate ≥1 novel, high-risk prediction (RCI ≥3 per prediction) *or* explain a major anomaly non-ad-hocly?  
  - **Evidence:**  
    - *Sufficient:* Self-reported predictions with timestamps (pre-registration ideal); external reviews validating novelty.  
    - *If no predictions:* Check for anomaly resolutions (must not invoke immunity clauses).  
    - *If silent:* Assume no progress.  
  - **Stopping rule:** **Probation** if no progress.  
  - **Handoff:** If novelty is disputed (e.g., field split), hand to panel.  

  #### **Step 4: Empirical Progress (Confirmation & Borrowed Progress)**  
  - **Question:** Were ≥50% of novel predictions empirically confirmed *and* not due to borrowed progress?  
  - **Evidence:**  
    - *Confirmation:* Independent reproduction (external reviews); consortium data.  
    - *Borrowed progress test:* Would the output (tool/data/method) work if core were false? (e.g., sleep-staging tool in Programme A).  
      - *Evidence:* External reviews or consortium admitting core-independence.  
  - **Stopping rule:** **Wind down** if <50% confirmations *and* borrowed progress dominates.  
  - **Handoff:** If confirmations are 40–60%, hand to panel for values call (e.g., societal impact).  

  #### **Step 5: Consolidation vs. Stagnation**  
  *For programmes with no progress (Step 3) or low confirmations (Step 4).*  
  - **Question:** Is the programme consolidating (maturing framework) or stagnating?  
  - **Evidence:**  
    - *Consolidation indicators:* Quantitative extensions to new domains; adoption as field standard; industry use.  
    - *Stagnation indicators:* Anomalies persist; outputs only incremental; isolation from field.  
  - **Thresholds:**  
    - **Renew with restructuring** if consolidation + minor anomalies.  
    - **Probation** if stagnation + grace period available (Step 6).  
    - **Wind down** if stagnation + grace expired.  
  - **Handoff:** Always hand to panel—weighting consolidation vs. stagnation is values-based.  

  #### **Step 6: Grace Period Rule (Hindsight Problem)**  
  - **Question:** How long since last novel factual success?  
  - **Rule:**  
    - ≤5 years without success: **No penalty** if consolidation evident.  
    - 6–10 years: **Probation** (short re-review) if consolidation plausible.  
    - >10 years: **Wind down** unless panel unanimously approves extension.  
  - **Extension evidence:** Credible new prediction with test plan (not reformulation).  
  - **Handoff:** Extension requires panel sign-off (risk-appetite).  

  ---

  ### **Application to Programmes**  
  *Findings are written as dossier-checkable statements; verdicts use procedure rules.*  

  #### **Programme A: Memory Reactivation**  
  - **Step 1:** Hard core unchanged.  
  - **Step 2:**  
    - Immunity clause triggered ("salience threshold" untestable).  
    - Prediction: RCI = Risk 2 (blocking neuromodulator could falsify core) + Content 2 (class-specific impairment) = 4. Below threshold (need ≥8 for 5 years).  
  - **Step 3:** One prediction (RCI 4), but low-risk due to immunity clause. **No theoretical progress.**  
  - **Step 4:**  
    - Confirmation: Consortium-confirmed, but 8 independent failures.  
    - Borrowed progress: Sleep-staging tool works if core false.  
    - **<50% confirmations + borrowed progress.**  
  - **Step 5:** Stagnation (anomalies persist, core isolated).  
  - **Step 6:** 10 years old. Grace expired (>10 years without success).  
  - **Verdict: Wind down with closure grant.**  
  - **Written Findings:**  
    > "Programme A's hard core unchanged. Immunity clause invoked for repeated failures (8 independent replications failed; salience threshold untestable). One prediction scored RCI 4 (<8 threshold). Confirmation not independently replicated. High-impact output (sleep-staging tool) is borrowed progress. No belt adaptation to anomalies. Stagnation confirmed; 10-year grace period expired."  

  #### **Programme B: Single Order Parameter**  
  - **Step 1:** Hard core unchanged.  
  - **Step 2:** No reformulation/immunity clauses. No predictions → RCI = 0.  
  - **Step 3:** No predictions → **No theoretical progress.**  
  - **Step 4:** No predictions → focus on Step 5.  
  - **Step 5:**  
    - Consolidation: Extended to 3 new materials; industry standard; anomaly isolated ("insufficiently characterized").  
    - **Consolidation dominant.**  
  - **Step 6:** 11 years old, but consolidation evident.  
  - **Verdict: Renew as is.**  
  - **Written Findings:**  
    > "Programme B's hard core unchanged. No predictions or degeneration safeguards. No theoretical progress, but quantitative consolidation: model extended to new materials, adopted as industry standard, anomaly minor and managed. Maturing framework justifies renewal despite no novelty."  

  #### **Programme C: Scaling Law for Urban Networks**  
  - **Step 1:** Hard core unchanged.  
  - **Step 2:**  
    - Translational reformulation: 3 reformulations, papers admit equivalence → no progress.  
    - Immunity clause: "Law applies only above network size" untestable.  
    - Prediction-milling: No predictions → RCI = 0.  
  - **Step 3:** No predictions; anomaly resolved via immunity → **No theoretical progress.**  
  - **Step 4:**  
    - Confirmation: Artefact (data-processing error) → unconfirmed.  
    - Borrowed progress: Spin-offs abandoned core → not attributable.  
    - **0% confirmations.**  
  - **Step 5:**  
    - Stagnation: Immunity clause used; anomalies unresolved; no adoption beyond group.  
    - Spin-offs progressive but core inactive.  
  - **Step 6:** 15 years old; last success >5 years ago; grace expired.  
  - **Verdict: Wind down with closure grant.**  
  - **Written Findings:**  
    > "Programme C's hard core unchanged. Degeneration safeguards triggered: translational reformulations (provably equivalent), immunity clause (untestable size threshold), no predictions (RCI 0). Celebrated confirmation traced to artefact. No independent progress; spin-offs succeed only by abandoning core. Stagnation confirmed; 15-year grace period expired. Political status irrelevant to Lakatosian assessment."  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Inherent Guessing Points:**  
     - **Consolidation vs. stagnation (Step 5):** Requires panel judgment on "maturation" vs. "isolation."  
     - **RCI borderline scores:** Risk/content weights are heuristic.  
     - **Grace extensions:** Unanimous panel approval is subjective.  

  2. **Programme Types to Avoid:**  
     - **Exploratory programmes:** No hard core (e.g., purely descriptive projects). MSRP requires a core/belt structure.  
     - **Crisis programmes:** Where the field is collapsing (e.g., mass irreproducibility). Lakatos assumes rational competition.  
     - **Policy-driven science:** Goals set by societal needs, not truth-seeking (e.g., urgent climate adaptation).  

  3. **Systematic Biases:**  
     - **Short-cycle bias:** Favours programmes with frequent, testable predictions (e.g., experimental over theoretical). Consolidation assessment (Step 5) mitigates but does not eliminate this.  
     - **Quantification bias:** RCI rewards countable predictions. Programmes producing foundational theory (e.g., new mathematics) may be penalized.  
     - **Conservatism bias:** Grace periods may extend declining programmes if politically embedded (e.g., Programme C). Strict dossier-focus counters this.  
     - **Field-specific bias:** Lab-based sciences (e.g., neuroscience) favored over observational (e.g., astronomy) where tests are slow.  

  **Recommendation:** Use this procedure for programmes with a clear hard core/belt structure (e.g., theoretical models, mechanism-driven biology). For ambiguous cases, augment with external reviewers. Recalibrate RCI thresholds every cycle based on field norms.
