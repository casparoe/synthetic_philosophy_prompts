   Important: We must avoid representational and computational terms. Instead, use:
     - Affordances: opportunities for action in the environment.
     - Ecological information: patterns in the environment that specify affordances.
     - Skilled coping: expert, unreflective engagement with the world.
     - Developmental resources and scaffolding: environmental and social supports during development.
     - Niche construction: the process by which organisms alter their environment, affecting development and evolution.
     - Ecological inheritance: inheritance of modified environments.

   Also, we must not present the enactive-ecological framework as neutral.

   Let's break down each family:

   1. By-product and cultural-epidemiological family:

      Original claims:
        - Hyperactive Agency Detection Device (HADD): tendency to attribute agency to events (even non-agentive ones).
        - Minimally Counterintuitive (MCI) representations: concepts that violate a few intuitive expectations (e.g., a talking tree) are more memorable.
        - Content biases: some ideas are more appealing due to their content (e.g., emotionally arousing).
        - Transmission biases: cultural transmission is influenced by factors like prestige, similarity, etc.

      Translation to enactive-ecological terms:

        - Agency detection: We might reframe as a pattern of engagement with the environment where the organism is attuned to affordances of agency (e.g., movement patterns that specify animacy) in a way that is hypersensitive. This is a tuning of perceptual systems to detect agency even in ambiguous information. This tuning might be a result of developmental scaffolding where the cost of missing an agent (predator, enemy) is high.

        - Minimally counterintuitive: Instead of representations, we can think of patterns of ecological information that are slightly mismatched with typical affordances, making them more salient and thus more likely to be picked up and incorporated into the cultural niche. For example, an object that normally affords sitting (a chair) but also appears to have the affordance of speaking (if in a story) is a mismatch that stands out. This makes the information more easily noticed and remembered.

        - Content and transmission biases: These become patterns of ecological information that are more likely to be attended to and propagated because they align with existing skills, developmental resources, or because they are embedded in social practices that scaffold their transmission. For instance, emotionally charged events might afford stronger bodily responses and thus become more central in the cultural niche.

      Explanandum: 
          - HADD and MCI are individual-level cognitive profiles (though they have population effects).
          - Transmission biases and content biases can be both individual (how one attends) and population-level (how the trait spreads).

          However, the cultural-epidemiological approach is primarily about population-level recurrency (why some ideas spread and persist) and the cognitive by-products are individual-level mechanisms that explain why some ideas are more likely to be acquired and transmitted.

      Vocabulary resources: 
          - We can handle individual-level as patterns of attunement to affordances and ecological information.
          - Population-level can be seen as patterns of niche construction and ecological inheritance: the cultural practices and artifacts that persist and are passed on.

      But note: The enactive framework does not have a direct equivalent for "representation" and so we are translating MCI as a property of the information in the environment and the agent's attunement. This might be acceptable.

      Test case: The practicing agent who disavows beliefs. 
          - In the enactive framework, religious practices are skilled coping: patterns of action in a religious niche. The agent is attuned to the affordances of the religious environment (e.g., the affordance of a ritual for group cohesion). The disavowal of belief is not a problem because the practice is not dependent on internal representations but on the agent's history of interactions and the current affordances. 
          - However, the by-product account typically posits that religious ideas are generated and transmitted because of cognitive biases (like HADD and MCI). But if an agent disavows belief, how does the by-product account explain her practice? It might not, because it focuses on the transmission of ideas. The enactive account, by contrast, can explain the practice without recourse to belief.

      Residue: 
          - The idea of HADD as a hypersensitive tuning to agency affordances survives without representations.
          - MCI as a property of environmental information that is salient due to mismatch with typical affordances also survives without representations.
          - However, the content and transmission biases often rely on the idea of mental representations being more appealing or memorable. We can reframe as patterns of attention and action, but the notion of "bias" in transmission might require reintroducing representations. For example, the idea of a prestige bias: we can see it as the skilled coping of imitating high-status individuals because they afford learning opportunities. This might work without representations.

   2. Costly-signalling and credibility-enhancing displays (CREDs):

      Original claims:
          - Costly signalling: engaging in costly behaviors (e.g., expensive rituals) signals commitment to the group, which promotes trust and cooperation.
          - CREDs: consistent actions that demonstrate commitment (e.g., a religious leader living austerely) enhance the credibility of the religious message.

      Translation:
          - These are patterns of action in the social environment that afford trust and cooperation. The costly ritual is a public display that creates affordances for others: it signals reliability and commitment, which in turn creates opportunities for cooperative actions. 
          - The niche is constructed such that these displays become part of the ecological inheritance, scaffolding the development of cooperative groups.

      Explanandum: 
          - Both individual-level (why an individual engages in costly displays) and population-level (how these practices spread and maintain group cohesion). 
          - Also, historically extended traditions: these practices become institutionalized.

      Vocabulary resources: 
          - We can frame costly signals as actions that alter the social niche, creating new affordances (e.g., trust, cooperation). 
          - CREDs are consistent patterns of action that serve as ecological information for others, specifying the reliability of the actor and the tradition.

      Test case: The practicing agent who disavows beliefs.
          - She engages in costly rituals because they are part of the cultural niche and afford social integration, access to resources, etc. Her actions are skilled coping in that niche. The disavowal of belief doesn't matter because the practice is about the social and material consequences. The enactive account handles this well. 
          - The signalling account might also handle it: the agent signals commitment to the group regardless of internal belief, because the signal is about the action. So both frameworks can accommodate.

      Residue:
          - The core of costly signalling and CREDs survives without representations: they are patterns of action in a social niche that create affordances for cooperation and trust.

   3. Moralizing-gods-and-group-benefits:

      Original claims:
          - Belief in moralizing, punishing gods promotes cooperation in large groups by deterring selfishness. This provides group benefits and thus the cultural trait spreads.

      Translation:
          - The idea of a moralizing god is part of the cultural niche that structures social interactions. It creates affordances for cooperation: the perceived presence of a supernatural agent that punishes selfishness becomes a feature of the environment that individuals attune to. This is maintained through practices (rituals, narratives) and institutions (churches, religious laws). 
          - The group benefits (e.g., increased cooperation) lead to the persistence and spread of these practices via ecological inheritance and niche construction.

      Explanandum: 
          - Population-level recurrency (why groups with such beliefs outcompete others) and historically extended traditions (institutions and practices).

      Vocabulary resources:
          - We can talk about the religious niche that includes the practices and narratives about moralizing gods as environmental features that scaffold cooperative behavior. The development of individuals in this niche leads to attunement to these affordances.

      Test case: The practicing agent who disavows beliefs.
          - She participates in the practices because they are part of her social world and afford social belonging, even without belief in the god. The enactive account handles this: the practices and institutions are the environment that shapes her actions. 
          - The original account, however, relies on belief (the representation of a god) to deter selfishness. Without belief, how does the god deter? The enactive account might say that even without belief, the public practices and the possibility of social sanctions (which are part of the niche) can maintain cooperation. But the original account might struggle with the non-believing practitioner.

      Residue:
          - The group-level benefits of cooperation and the persistence of the tradition can be explained without representations. 
          - However, the specific mechanism of deterrence via belief in a supernatural punisher might require representations. In the enactive account, we can say the niche includes the stories and practices that create an environment of surveillance and punishment (via community members who do believe, or via the internalization of norms as affordances). But if the agent does not believe and the community does not enforce, then the mechanism breaks. So the enactive account might shift the focus to the social and material practices.

