answer: |-
  ### Restated Naturalistic Accounts of Religion in Enactive-Ecological Terms

  #### **1. By-Product & Cultural-Epidemiological Family**  
  *(Agency Detection, Minimally Counterintuitive Representations, Content/Transmission Biases)*  
  - **Translation**:  
    - **Agency detection**: Emerges from *attunement to animate affordances* in the environment. Humans are developmentally scaffolded to detect agency as a high-priority affordance (e.g., movement patterns or environmental contingencies that suggest intentional action), driven by evolutionary pressures to avoid predation or exploit social opportunities. False positives (e.g., "spirits" in rustling leaves) reflect *overgeneralized skilled coping* with ambiguous ecological information.  
    - **Minimally counterintuitive (MCI) "representations"**: Reframed as *salient deviations from expected affordance structures*. Objects/events that violate typical affordance networks (e.g., a "talking tree" disrupts affordances of flora as passive) become attention-grabbing due to their *perceptual distinctiveness*. These are easily incorporated into cultural niches because they disrupt skilled coping in memorable ways, aiding ecological inheritance.  
    - **Content/transmission biases**: Arise from *asymmetries in affordance landscapes*. Content biases reflect affordances that align with deeply scaffolded action-perception loops (e.g., threats/opportunities tied to survival). Transmission biases emerge from *social affordances* (e.g., high-status individuals afford imitation; rituals afford cohesion).  

  - **Explanandum**:  
    - **Individual-level**: Attunement to agency affordances and perceptual salience of MCI events.  
    - **Population-level**: Cultural propagation via affordance-based social learning (niche construction).  
    - **Gap**: Your framework lacks direct tools for *population-level recurrence as an emergent effect of cognitive biases*. Enactive terms handle individual attunement and niche construction but not epidemiological spread as computational "cognitive contagion."  

  - **Test Case (Non-Believing Practitioner)**:  
    - Enactive account handles seamlessly: The practitioner engages in rituals as *skilled coping* with social affordances (e.g., community bonding), detached from propositional "belief." Detection of "agency" (e.g., in prayer) is affordance-based action, not representational inference.  
    - Representational accounts struggle: They cannot explain sustained practice without positing "hidden" beliefs or cognitive dissonance.  

  #### **2. Costly-Signalling & Credibility-Enhancing Displays (CREDs)**  
  - **Translation**:  
    - **Costly signalling**: Rituals or sacrifices function as *publicly observable actions* that reconfigure social affordances. Costly acts (e.g., resource-intensive offerings) create *reliable affordances for trust* by demonstrating commitment to group norms, scaffolding cooperation.  
    - **CREDs**: Consistent behavioral displays (e.g., asceticism) generate *ecological information* that attests to affordance realism (e.g., "ritual X affords divine contact"). These displays become *developmental resources* that shape community niche construction.  

  - **Explanandum**:  
    - **Individual-level**: Skillful execution of credibility-displaying actions.  
    - **Historically extended tradition**: Institutions arise from accumulated *ecological inheritance* of signaling practices (e.g., pilgrimage sites as constructed niches).  
    - **Gap**: No framework gap—your vocabulary fully captures institutionalization via niche construction.  

  - **Test Case (Non-Believing Practitioner)**:  
    - Enactive account excels: The agent performs signals as *culturally scaffolded skills* (e.g., fasting to afford social capital), irrespective of "belief."  
    - Representational accounts falter: They require belief as motivator for costly acts, misdiagnosing the practice as "irrational."  

  #### **3. Moralizing Gods & Group-Benefits**  
  - **Translation**:  
    - Moralizing gods emerge as *regulative affordances* within constructed niches. Shared narratives of supernatural enforcement (e.g., "deities punish cheating") create *social-environmental constraints* that afford prosocial behavior. Group benefits (cooperation, conflict resolution) arise from *niche construction* where deities function as inherited *institutional affordances*.  

  - **Explanandum**:  
    - **Population-level**: Group cohesion as an effect of affordance alignment.  
    - **Historically extended tradition**: Deities as *stabilizing resources* in cultural niches (e.g., via ritual artifacts or legal codes).  
    - **Gap**: No individual-level mechanism in your framework—attunement to "god affordances" is assumed via practice, not explained.  

  - **Test Case (Non-Believing Practitioner)**:  
    - Enactive account robust: The agent adheres to moral norms via *attuned responsiveness* to social affordances (e.g., fear of shunning), not belief in deities.  
    - Representational accounts fail: Moral behavior requires belief in supernatural punishment.  

  ---

  ### **Residue Report**  
  **1. Claims Surviving Unchanged**:  
  - Costly signalling and CREDs as *niche-constructing practices* generating trust affordances.  
  - Group benefits of moralizing gods as *emergent effects* of institutional affordances.  
  - Agency detection as *overgeneralized attunement* to animate affordances.  

  **2. Claims Requiring Reintroduced Representations**:  
  - **MCI memorability**: Survives only if "salience" implicitly invokes *content processing*. In enactive terms, MCI is restated as affordance violation, but its cultural recurrence relies on unstated cognitive biases (e.g., memory encoding).  
  - **Content biases**: Describing "threat-related" affordances as culturally sticky reintroduces *motivational content* unless purely framed as sensorimotor contingencies.  

  **3. Claims Inexpressible in Your Framework**:  
  - **Cognitive by-products**: The core epidemiological claim—that recurrent features of religion are side effects of *domain-specific computational mechanisms* (e.g., hyperactive agency detection as a malfunctioning module)—cannot be translated. Your framework rejects modularity, replacing it with attunement dynamics.  
  - **Propositional belief as driver**: Any account requiring "belief" as a discrete, internal state motivating behavior (e.g., "belief in gods causes cooperation") is inadmissible.  

  ---

  ### **What the Residue Shows**  
  - **Your Framework Lacks No Explanatory Power**: It robustly handles practice, tradition, and group dynamics without representations. The "residue" (e.g., MCI memorability) reflects the *overreach* of representational accounts, not your framework's deficits. Representational models often conflate *explananda*: individual cognition is invoked to explain population-level phenomena (e.g., "MCI concepts spread because brains remember them"), but your vocabulary disentangles these.  
  - **Belief Does Less Work Than Assumed**: The test case exposes belief as an unnecessary construct. Representational accounts rely on "belief" to glue cognition to behavior, but your framework shows practice is sustained by affordance-based skilled coping and niche construction. The debate is indeed held together by a *folk-psychological notion of belief* that collapses under scrutiny.  
  - **Genuine Explanatory Problems Remain**: Your framework struggles with *why certain affordances (e.g., supernatural agency) recur cross-culturally*. Representationalists attribute this to hardwired cognition; you attribute it to shared attunement and niche constraints—but this remains underspecified. Here, the residue highlights a tension: universal recurrence may require *some* notion of developmental canalization, which your framework can accommodate (via shared embodied scaffolds), but only if cautiously divorced from computationalism.  

  **Conclusion**: The translation reveals that representational accounts often mistake *descriptive heuristics* (e.g., "beliefs," "biases") for explanations. Your framework forces a reorientation toward concrete agent-environment dynamics, showing that religion persists through ecological inheritance, skilled practice, and niche construction—not "mental representations." The residue is not a deficit but an invitation to refine enactive-developmental explanations of cross-cultural patterns.
