    What survives only if we reintroduce representations or propositional belief:
      - The by-product account of MCI: without representations, we can talk about salient ecological information, but the memorability and transmission advantage might be harder to explain without a cognitive mechanism that processes and stores representations. However, we might reframe memorability as the ease with which a pattern of action is reenacted or a narrative is retold due to its salience. This is borderline: it might work without representations if we think of the narrative as an environmental resource that is reused because of its properties.
      - The agency detection account: without representations, we can have attunement to agency affordances, but the hyperactive part (false positives) might require a computational model of error management. However, we can say it is a developmental tuning that errs on the side of caution, which is ecological.

      The moralizing gods mechanism: if we rely on the belief in a supernatural punisher to deter selfishness, then without representations (belief) we lose that mechanism. But we can replace it with the social and material practices that enforce norms. However, the original account is specifically about supernatural belief.

    What cannot be stated at all in the enactive vocabulary?
      - The notion of a "representation" that is stored and processed in the mind. Therefore, any account that requires the manipulation and storage of mental representations (like the cognitive mechanisms proposed for MCI or HADD) cannot be directly translated. We can only talk about patterns of attunement to affordances and information in the environment.

    What does the residue show?
      - The enactive-ecological framework can restate many of the accounts in terms of the dynamics of agent-environment coupling, niche construction, and developmental scaffolding. This shows that the population-level and tradition-level explananda can be addressed without representations. However, the individual cognitive mechanisms (like HADD and MCI) are more difficult to capture without representations. 

      - The case of the non-believing practitioner is handled naturally by the enactive account because it focuses on practices and skills. The representational accounts that rely on belief as a mental state struggle with this case. This suggests that the notion of belief as a propositional attitude might be doing less work than supposed in explaining religious practice. Instead, the enactive account emphasizes the role of the environment and the history of interactions.

      - The residue also reveals that the debate in the cognitive science of religion is partly held together by a notion of belief as a representation that causes behavior. The enactive framework challenges this by showing that practices can be sustained by the environment and skills without requiring internal representations. However, it might lack the resources to fully explain the individual cognitive biases that are central to the by-product account. But perhaps the enactive framework would argue that these biases are themselves patterns of attunement that have been scaffolded by evolution and development.

   Conclusion: The enactive-ecological framework provides a powerful way to restate the group-level and practice-based aspects of religion. It struggles with the individual cognitive mechanisms that are typically explained with representations, but it might offer an alternative explanation in terms of attunement and information. The residue shows that the framework does not lack the resources to state the explanatory problems, but it reframes them. The notion of belief as a mental representation might indeed be overemphasized in the cognitive science of religion, especially when explaining practice.

