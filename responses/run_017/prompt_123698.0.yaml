  We are going to translate the naturalistic accounts of religion into the enactive-ecological and developmental systems vocabulary, which emphasizes affordances, ecological information, skilled coping, developmental resources, scaffolding, niche construction, and ecological inheritance. We have three explananda to sort each account by: population-level recurrency, individual-level cognitive profile, or historically extended tradition with institutions and practices. We also test against the case of the fully practicing agent who disavows beliefs.

   The three families of accounts:

   1. By-product and cultural-epidemiological (e.g., agency detection, minimally counterintuitive representations, content and transmission biases)
   2. Costly-signalling and credibility-enhancing displays
