answer: |-
  ### Essay Question  
  **Time Allowed: 60 minutes**  

  > **Case**:  
  > At Time 1 (t₁), a university volunteering scheme invites undergraduates to pledge 40 annual hours of unpaid visits to isolated elderly residents. Only 2% participate. Participants are praised as "exemplary," and non-participants face no criticism.  
  >   
  > At Time 2 (t₂), five years later, 85% participate. Non-participation draws informal criticism (e.g., peers questioning commitment) and self-reported guilt among abstainers. Participants receive a college citizenship award. The *total good* (aggregate hours) and *individual cost* (time/effort per student) remain unchanged.  
  >   
  > **Question**:  
  > Is the pledge supererogatory at t₁ but not at t₂? What does your answer reveal about the foundations of supererogation? In addressing this, you must:  
  > - Distinguish social expectations and criticism from moral blameworthiness.  
  > - Evaluate whether obligations arise from changed expectations alone or require a fair-play scheme (e.g., mutual assurance, reputational benefits).  
  > - Confront the objection that others’ compliance cannot create new obligations for non-consenting individuals absent changes to their circumstances.  
  > - Assess the university’s proposal to make the pledge compulsory, considering whether voluntariness itself confers unique value.  

  ---

  ### Model Answer (780 words)  
  **Thesis**: The pledge shifts from supererogatory at t₁ to obligatory at t₂, but *not* due to social pressure alone. This reveals that supererogation’s core lies in *fairness constraints on collective action*; voluntariness’ value is non-fungible, resisting compulsory substitution.  

  **1. The t₁/t₂ Shift and the Fair-Play Mechanism**  
  At t₁, the pledge is supererogatory: optional, praiseworthy, and non-blameworthy to omit. By t₂, it becomes obligatory *if* a cooperative scheme emerges. Mere social expectation (e.g., criticism) is insufficient for obligation; moral blameworthiness requires violating a duty, not a norm. However, at t₂, three elements transform the pledge:  
  - **Assurance**: High participation assures each student their effort will not be wasted (no free-riding on others’ labour).  
  - **Reciprocity**: The citizenship award signals institutional reciprocity, rewarding contributors.  
  - **Reputational Benefit**: Participants gain social capital, making non-participation unfairly exploitative.  
  This constitutes a Rawlsian fair-play scheme: benefiting from others’ cooperation binds one to reciprocate. Thus, non-participation at t₂ breaches a duty of fairness—not merely defying expectations.  

  **2. Rejecting the "Obligation by Diffusion" Objection**  
  The objection—that others’ generosity cannot impose duties without consent—fails here. Fair-play obligations arise *not* from diffusion but from *accepting benefits* within a cooperative practice. At t₂, non-participants still gain from the scheme’s reputational stability (e.g., the university’s image as "compassionate" aids all students). By accepting this benefit while refusing to contribute, they violate fairness. Consent is tacit in benefit-retention; one may exit the scheme (e.g., transferring colleges) to avoid the duty. No new obligation "magically" appears; the context of mutual advantage creates it.  

  **3. Social Criticism vs. Moral Blameworthiness**  
  Non-participants at t₂ face criticism and guilt, but these are not identical to blameworthiness. Social pressure reflects descriptive norms ("what most do"), while blameworthiness tracks prescriptive duties ("what one ought to do"). The criticism is *warranted* at t₂ only because fairness grounds a genuine duty. Without the fair-play structure, mere popularity (e.g., 85% wearing green hats) would not license moral blame.  

  **4. Why Compulsory Enforcement Destroys Unique Value**  
  The university should *not* make the pledge compulsory, even if it maximizes good. Supererogation’s value hinges on its optionality:  
  - **Expressive Value**: Voluntarily choosing sacrifice expresses solidarity in ways compulsion cannot. Forcing visits reduces them to transactional labour, stripping their meaning as gifts.  
  - **Virtue Cultivation**: Optional acts allow moral development (e.g., internalizing compassion). Compulsion replaces virtue with compliance.  
  - **Overdemandingness Avoidance**: Fixing obligations via fair-play is context-sensitive; compulsion universalizes costs, ignoring individual vulnerabilities (e.g., a student caring for a sick parent).  
  Thus, the pledge’s moral worth at t₁ arises *because* it is supererogatory—a value lost under compulsion.  

  **Conclusion**: The pledge ceases to be supererogatory at t₂ due to fairness-based obligations from emergent cooperation. Supererogation is thus compliance-sensitive *only when* high compliance enables a collective scheme with assurance and reciprocity. Its foundations lie in the interplay of individual choice and collective fairness—not in static axiological thresholds.  

  ---

  ### Marking Scheme (20 marks total)  
  **A (17–20)**: Exceeds B-level by doing **all** of:  
  - (a) Explicitly grounding the t₂ obligation in *fair-play*, not expectations.  
  - (b) Refuting "obligation by diffusion" via benefit-acceptance.  
  - (c) Justifying why voluntariness confers irreplaceable value.  
  - (d) Using the guilt/criticism distinction to clarify blameworthiness.  
  - (e) Original insight (e.g., linking fair-play to virtue ethics).  

  **B (13–16)**: Competently addresses the core moves:  
  - Separates social expectation from moral blameworthiness.  
  - Contrasts weak expectation vs. fair-play routes to obligation.  
  - Engages the diffusion objection.  
  - Discusses costs of compulsion.  
  - Avoids pitfalls (below).  

  **C (9–12)**: Describes supererogation accurately but fails 1–2 core tasks.  
  **D (5–8)**: Significant omissions/mistakes (e.g., ignores fair-play).  
  **F (0–4)**: Misrepresents basics or is irrelevant.  

  ---

  ### Predictable Mistakes & Penalties  
  | Mistake | Penalty | Reason |  
  |---------|---------|--------|  
  | Equating social criticism with moral blameworthiness | **–4** | Confuses normative/descriptive ethics. |  
  | Arguing obligations arise *solely* from popularity (no fair-play) | **–5** | Misses the crux: cooperation creates duties. |  
  | Claiming non-participants *cannot* have new duties without consent | **–4** | Ignores tacit consent via benefit-retention. |  
  | Asserting compulsion is acceptable since it maximizes good | **–3** | Neglects the distinctive value of voluntariness. |  
  | Treating guilt as proof of blameworthiness | **–2** | Overlooks that guilt may be misplaced. |  

  ---  
  **Instructions to Students**: Answers are judged on rigor, not position taken. A-answers *must* engage all bolded elements in the question.
