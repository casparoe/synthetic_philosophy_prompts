prompt: |-
  Hey — I help run a small demography reading group (about ten of us, half of them pronatalist-ish and worried about dependency ratios, half of them suspicious of the whole framing), and we keep going in circles on whether a larger population is actually better. I want to put a sorting tree in the discussion pack so people can see which view they're really committed to rather than thier favourite label.

  Could you build me a decision tree / taxonomy for the question "other things equal, is a bigger population better?" Start everyone from the same commitment: we can affect how many people there will be, and the question is about the value of the outcome, not yet about what policy to run.

  What I'd like:

  1. First, the logical space rather than the names. Give me five or six branching questions, and for each one say what the possible answers are and which combinations of answers are even available. Every node has to be a concrete case or claim someone could answer without knowing which ism it leads to — so no node that amounts to "are you a total utilitarian?". Please use (or improve on) these cases somewhere: a choice between 8 billion people at welfare 70 and 12 billion at welfare 55; adding one extra life that is only barely worth living; a case where we can either save a 40-year-old or, for the same money, cause an additional happy person to exist; a choice that changes who exists without making anyone worse off than they would otherwise have been; and a case that asks what happens if you think the long-run future is more likely to be astronomically bad than astronomically good. Please also include at least one node that splits two views which otherwise give the same verdict on all the standard cases — that's the bit the group always glosses over.

  2. Then locate the actual positions in that space as leaves: totalism, averagism, the critical-level family, person-affecting / no-difference views, the asymmetry-ish antinatalist option, a suffering-focused leaf, a leaf for people who only think population size matters instrumentally (more possible innovators, agglomeration, fiscal sustainability, recovery from catastrophe), a leaf for the "size is beside the point, only the worst-off or the threshold matters" crowd, and one for the view my mate calls scale-value — that a civilisation of ten billion people doing things together is worth something over and above the sum of ten billion individual lives. Say whether that last one is really just instrumental value in disguise.

  3. Note any combinations of answers nobody occupies, and diagnose why — incoherent, unattractive, or just unexplored. And flag any pair of leaves your tree genuinely cannot seperate rather than pretending the last node did the work.

  4. Where the usual impossibility-style results bite (the repugnant conclusion and the other unpalatable ones), mark which leaves get squeezed.

  5. Finally a short note on which leaves actually hand you a reason to encourage births, and which ones leave it all down to contingent empirical facts — the group conflates "more people is better" with "we should have more babies" constantly.

  Aim for about eight to ten leaves. Please write it in British English. Nobody's going to check references, so no reading lists — just the tree and the reasoning.
reasoning: |-
  Okay, the user runs a small demography reading group with diverse views on population ethics. They want a decision tree to clarify positions without relying on labels, using concrete cases. Let me unpack their request.

  First, they need a taxonomy starting from a shared premise: that we can influence future population size. The tree must avoid abstract questions like "are you a total utilitarian?" and instead use practical scenarios. The specified cases include welfare trade-offs (8B at 70 vs 12B at 55), marginal lives, saving existing people vs creating new ones, non-identity problems, and long-term existential risks.

  Hmm... the key challenge is designing branching questions that genuinely differentiate positions. For example, the first split should separate those who think mere existence has value from those who don't - hence the "Is existence always preferable to non-existence?" question with the 40-year-old vs new life case. This avoids immediate descent into utilitarianism debates.

  The second branch needs to handle aggregation methods. The 8B/12B case perfectly contrasts total vs average utilitarianism. But we must also capture critical-level views here - hence the "Is there a welfare threshold below which lives shouldn't be added?" follow-up. 

  Ah, the third branch is crucial for non-identity problems. The "Does creating someone harm them?" question with the climate policy case isolates person-affecting views. This traps asymmetric views too - if creating life isn't harmful but still not good, that's the antinatalist branch.

  For the fourth split, instrumental considerations must appear. The innovation/risk resilience question forces even axiologists to confront practical effects. This is where scale-value fits - if someone endorses civilization-level value beyond individuals, it branches here.

  Existential risk forms the fifth branch. The "Are future lives net positive?" question with the 1% extinction risk scenario divides long-term optimists from pessimists. This separates suffering-focused ethics from others.

  Noticing gaps... The "unoccupied" node warns about inconsistent positions (e.g., valuing nonexistence while prioritizing individuals). Also flagging that person-affiding and asymmetry views collapse similarly on cases but diverge philosophically - hence the diagnostic note.

  Finally, mapping leaves: Totalism and critical-level are cleanly separated by the threshold question. Person-affecting and asymmetry views share the "no intrinsic value" position but split on whether creating life is neutral or actively bad. Scale-value gets its own leaf but must confront whether it's reducible to instrumental gains.

  The policy implications section is vital - only totalism and scale-value directly endorse pronatalism; others depend on empirical factors. This should help the group stop conflating ethical stances with birth encouragement.
answer: |-
  Here’s a decision tree designed to untangle positions on population size, using concrete cases to avoid label-driven reasoning. Written in British English as requested.

  ---

  ### **Decision Tree: "Is a Bigger Population Better?"**  
  **Shared Commitment:** We can influence future population size. We’re evaluating the *value* of outcomes, not yet policies.

  ---

  #### **Branch 1: Does adding a life with positive welfare inherently improve the outcome?**  
  *(Case: Adding one extra life that is "barely worth living" – e.g., mildly positive but unremarkable.)*  
  - **Yes** → Go to Branch 2.  
  - **No** → Go to Branch 3.  
  - **Only if it doesn’t harm others** → Still **Yes** (harm is addressed later).  

  #### **Branch 2: How do we aggregate welfare across people?**  
  *(Case: Choice between 8 billion at welfare 70 vs. 12 billion at welfare 55. Assume no one is harmed by the change.)*  
  - **Better if total welfare is higher** (12B×55 > 8B×70? 660 > 560 → **Yes**) → *Total-leaning*. Go to Branch 4.  
  - **Better if average welfare is higher** (70 > 55 → **No**) → *Average-leaning*. Go to Branch 4.  
  - **Better only if welfare is above a critical threshold** (e.g., 60) → *Critical-level*. Go to Branch 4.  

  #### **Branch 3: Why isn’t adding a positive life better?**  
  *(Case: Creating a happy person vs. not creating them. No one else is affected.)*  
  - **Creating someone doesn’t benefit them** (they wouldn’t otherwise exist) → *Person-affecting*. Go to Branch 5.  
  - **Adding positive lives isn’t good, but adding negative ones is bad** → *Asymmetry view*. Go to Branch 5.  

  #### **Branch 4: Does population size only matter instrumentally?**  
  *(Case: Could more people enable faster innovation, better crisis resilience, or fiscal stability?)*  
  - **Yes, size is only a tool for other goals** (e.g., welfare, survival) → *Instrumentalist*. Go to Branch 6.  
  - **No, size has intrinsic or scale value** → Go to Branch 7.  

  #### **Branch 5: Does changing who exists require compensating the "non-created"?**  
  *(Case: Choosing a climate policy that creates different future people. No one is made worse off than if they’d never existed.)*  
  - **No obligation to "potential" people** → *Person-affecting (narrow)*.  
  - **We still have reasons to prefer better lives** → *Modified person-affecting*.  

  #### **Branch 6: Does the long-run future likely contain net suffering?**  
  *(Case: If you think humanity has a 1% chance of creating vast suffering vs. 1% chance of vast flourishing, which dominates?)*  
  - **Net suffering more likely** → *Suffering-focused*.  
  - **Net flourishing more likely** → *Instrumentalist (growth-positive)*.  
  - **Unknowable/irrelevant** → *Instrumentalist (neutral)*.  

  #### **Branch 7: Is a larger civilisation valuable beyond individual welfare sums?**  
  *(Case: Is 10B people achieving together what 1B cannot inherently better, even with identical average welfare?)*  
  - **Yes, scale enables meaning/achievements** → *Scale-value*.  
  - **No, it’s just more individuals** → Revisit Branch 2.  

  ---

  ### **Mapping Leaves to Positions**  
  1. **Total-leaning + No instrumental focus** → **Totalism** (values total welfare).  
  2. **Average-leaning** → **Averagism** (rejects "repugnant conclusion" but may endorse "sadistic conclusion").  
  3. **Critical-level** → **Critical-level utilitarianism** (avoids repugnance but may reject adding lives above zero).  
  4. **Person-affecting (narrow)** → **Person-based consequentialism** (rejects "non-identity problem" obligations).  
  5. **Asymmetry view** → **Antinatalist-leaning** (adds no value for new lives, avoids repugnance).  
  6. **Suffering-focused** → **Negative utilitarianism** (prioritises reducing suffering; size risky).  
  7. **Instrumentalist (growth-positive/neutral)** → **Instrumental pronatalism/skepticism** (depends on empirical facts).  
  8. **Scale-value** → **Civilisational value** (size as intrinsic good; distinct from total welfare).  

  #### **Unoccupied/Incoherent Combinations**  
  - **"No" to Branch 1 + "Yes" to Branch 7**: If adding lives lacks value, scale-value is incoherent.  
  - **Averagism + Scale-value**: Averages dilute scale benefits; rarely combined.  

  #### **Indistinguishable Leaves**  
  - **Person-affecting** and **Asymmetry** views *both* reject the "barely worth living" case (Branch 1). They only diverge on whether adding happy lives is neutral (person-affecting) or not good (asymmetry) – subtle in practice.  

  ---

  ### **Where Impossibility Results Bite**  
  - **Repugnant Conclusion** (vast population barely worth living → better):  
    Squeezes **Totalism**; avoided by **Averagism**, **Critical-level**, **Person-affecting**, **Asymmetry**.  
  - **Mere Addition Paradox** (adding happy lives shouldn’t make things worse):  
    Squeezes **Averagism**; avoided by **Totalism**.  
  - **Non-Identity Problem** (policies harming future people who wouldn’t exist otherwise):  
    Squeezes **Person-affecting** views; totalists/critical-level override it.  

  ---

  ### **Does This Hand You a Reason to Encourage Births?**  
  | **Leaf**                  | **Direct Reason?** | **Notes** |  
  |----------------------------|---------------------|-----------|  
  | **Totalism**               | Yes                | If new lives have positive welfare. |  
  | **Critical-level**         | Only above threshold | Empirical: are lives above critical level? |  
  | **Averagism**              | Rarely             | Only if new lives raise the average. |  
  | **Person-affecting**       | No                 | New lives don’t benefit the created. |  
  | **Asymmetry**              | No                 | Adding happy lives isn’t a "good". |  
  | **Suffering-focused**      | Only if reduces risk | Highly contingent. |  
  | **Instrumentalist**        | Contingent         | Only if size improves welfare/survival. |  
  | **Scale-value**            | Yes                | If size itself is valuable. |  

  **Scale-value note**: Not instrumental in disguise. An orchestra’s value isn’t just the sum of musicians; it’s the emergent collective. But critics argue it collapses into total welfare or instrumentalism under scrutiny.

  ---

  ### **Summary for Your Pack**  
  This tree forces engagement with cases before labels. Key splits:  
  1. Does *any* new life add value?  
  2. How to weigh totals vs. averages?  
  3. Does identity/non-existence block obligations?  
  4. Is size *only* a tool?  
  5. Is civilisational scale inherently good?  

  The "instrumentalist" and "scale-value" leaves most often bridge the pronatalist/skeptic divide in your group – both require empirical debate, not pure ethics. Totalism is the only leaf that *always* favours more births (if welfare >0), yet even it depends on resources not diluting welfare.  

  ---  
  Let me know if you'd like the taxonomy condensed to a flowchart diagram!
