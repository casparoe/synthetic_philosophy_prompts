prompt: |-
  I'm putting together a term paper on multiple realizability for a philosophy of mind reading group, and I've reached the point where I no longer trust the framing we have been using. Everyone in the group is happy to say that the same mental state can be realized by different physical states, and one member offered the usual hardware-and-software picture: the mental state is like a program, the neural state is like the machine it runs on, and of course the program could run on something else. But when I tried to write down what the thesis is supposed to do for us, I found two jobs that may not be the same job. It has to make the argument against type-identity theory bite, and it has to let us decide, in some non-arbitrary way, whether an unfamiliar system counts as a realizer of a given state: a trained neural network whose internal organization we can characterize only statistically, an octopus, a silicon emulation of a human brain, a slowly self-rewiring brain in a single individual over decades, an insect colony treated as one cognizer. So before I read any further into the literature, I want the specification. What would an account of what it is for a physical state or system to realize a mental state have to deliver in order to be adequate for those two jobs, and what is the case or consideration behind each requirement?

  Here is what I have already gathered, which I would like you to organize, correct, and extend rather than simply endorse. First, realization looks three-place rather than two-place: a state realizes a mental state only relative to some specification of the causal role, and since indefinitely many true causal-role descriptions are satisfied by any given physical state, the account owes us a principled restriction on which specifications are admissible; otherwise multiple realizability comes for free and refutes type identity trivially, and by the same stroke refutes the possibility of any exceptionless psychophysical correlation whatsoever. Call this the cheap-realizability problem. Second, the account must say whether realization is all-or-nothing or degreed, and handle the near-miss: a system that satisfies the role specification almost but not exactly, or that satisfies it exactly on Tuesday and less exactly after damage or retraining; if it is degreed, we need to know whether the threshold is principled or stipulated. Third, any claim that two systems share a mental state while sharing no physical property appeals to similarity in causally relevant respects, and I cannot see how to state which respects those are without circularity. Fourth, the realized property must retain causal work of its own rather than dissolving into an epiphenomenal shadow, while the account must still fit the causal completeness of physics; I suspect this is where the list breaks, and I want that said explicitly if so. Fifth, the account must steer between two extremes: making realization so demanding that no unfamiliar system could ever be shown to realize anything, and making it so permissive that every system realizes every state under some mapping, with nothing but an unmotivated restriction doing the work. Sixth, it should tell us what evidence could settle the question for a black-box system, and it should let us compare realizers picked out by competing psychological theories and say whether they are realizers of the same state.

  Please mark, for each requirement on your list, whether it is genuinely non-negotiable or merely the prejudice of one camp, and tell me which single requirement does the most work in excluding candidate theories. If some subset of the requirements is jointly unsatisfiable, say so directly and show where the conflict comes from, because that is the result I would most want to write about. I also have a specific suspicion I would like you to test: that the argumentative force of multiple realizability comes from an equivocation between the claim that one and the same mental state can be had by physically heterogeneous systems and the much stronger claim that no physical kind is even nomologically coextensive with any mental kind, with the hardware-and-software picture naturally suggesting the first while the argument against type identity needs the second; tell me whether a good theory of realization should keep these apart, and whether keeping them apart costs the argument anything. Finally, a brief scorecard, a few lines apiece, for how the main contenders do against your list: type-identity theory, a flat causal-role view, a dimensioned view on which realizers contribute their own causal powers rather than merely occupying a slot, a subset view, and the usual Ramsified recipe where the whole psychological theory is quantified over at once.
reasoning: |-
  Hmm, this is a deep dive into the foundations of multiple realizability in philosophy of mind. The user is clearly grappling with some fundamental tensions in the concept and needs help structuring their critique for a term paper. 

  First, I notice they've already done impressive groundwork - identifying six key requirements for a theory of realization, recognizing the three-place structure (physical state realizing mental state relative to causal role), and spotting the potential equivocation between weak and strong multiple realizability. Their suspicion about the hardware/software analogy being misleading is particularly astute.

  The core tension they're wrestling with seems to be between two needs: (1) making multiple realizability robust enough to challenge type identity theory, and (2) providing criteria for attributing mental states to novel systems. What makes this tricky is that satisfying the first seems to require maximal flexibility (any physical system can realize mental states) while the second demands constraints (only some systems qualify).

  Their cheap-realizability problem is spot-on. If any physical state can realize any mental state under some causal description, then multiple realizability becomes trivial but useless. But if we constrain the admissible causal roles too much, we risk collapsing back into type identity. This is where the circularity worry in requirement #3 bites hard - how to specify "relevant" causal similarities without mental terms.

  The epiphenomenalism worry (#4) is equally serious. If realized properties have "real" causal work, how does this square with physics being causally closed? Functionalist approaches often fudge this by saying mental states are causally relevant while physical states do the causing, but that distinction always felt slippery to me.

  For their specific suspicion about equivocation: absolutely right. The weak claim (same mental state across different physical realizers) doesn't threaten type identity theory at all - it just requires disjunctive physical kinds. Only the strong claim (no lawful psychophysical correlations) does the job. Most arguments quietly slide from one to the other.

  When scoring theories: Type identity fails the multiple realizability test immediately. Flat causal-role accounts get destroyed by the cheap-realizability problem. Dimensioned views handle near-misses better but struggle with circularity. Subset views help with causal relevance but make realization too demanding. Ramseyfication handles theory comparison but exacerbates the specification problem.

  The joint unsatisfiability emerges between requirements #1 (non-trivial realizability), #2 (gradience), and #6 (novel system attribution). Non-trivial constraints (#1) conflict with accommodating near-misses (#2), while black-box assessment (#6) seems to require behavioral criteria that invite trivialization (#1). This tension is why the literature keeps circling back on itself.

  For their paper, I'd suggest framing this as a trilemma: we can have robust anti-reductionism, or principled mental state attribution, or causal efficacy of mental properties - but picking any two sacrifices the third. That's more interesting than just cataloging failures.
answer: |-
  Here's a systematic breakdown of requirements for an adequate theory of realization, organized around your concerns, with analysis of their status and tensions. The core conflict lies in satisfying both *metaphysical robustness* (against type-identity) and *epistemic determinacy* (for novel systems).

  ### Requirements for an Adequate Theory of Realization
  *(Marked: 🟢 = Non-negotiable; 🟡 = Camp-dependent/negotiable; 🔴 = Likely source of conflict)*

  1.  **Non-Trivial Admissibility Constraint**  
      *Requirement:* Must provide a principled restriction on admissible causal-role specifications (solving the "cheap-realizability" problem).  
      *Case:* Without this, *any* physical state realizes *any* mental state under *some* arbitrary description (e.g., "causes behavior B when inputs I₁...Iₙ occur"), refuting not just type-identity but *all* psychophysical laws trivially.  
      *Status:* 🟢 **Non-negotiable**. Without this, the concept is empty.

  2.  **Gradience & Threshold Handling**  
      *Requirement:* Must account for "near-misses" (e.g., damaged systems, approximations) by either (a) allowing degrees of realization with a principled threshold, or (b) explaining why realization is binary and how deviations disqualify a system.  
      *Case:* Real-world systems (brains post-injury, noisy neural nets, evolving organisms) rarely satisfy idealized causal roles perfectly. A theory must handle continuity without collapsing into vagueness.  
      *Status:* 🟡 **Camp-dependent**. Reductionists often insist on binary criteria; functionalists may accept degrees. But a *principled* account is 🟢 non-negotiable to avoid arbitrariness.

  3.  **Non-Circular Causal Relevance**  
      *Requirement:* Must specify which physical properties are "causally relevant" to the realized role *without presupposing mental properties*.  
      *Case:* To avoid circularity ("the relevant properties are those that realize M"), we need a physicalistically acceptable way to pick out "role-sustaining" properties (e.g., via input/output transitions, internal state changes).  
      *Status:* 🟢 **Non-negotiable** for naturalism. Failure here collapses realization into dualism or triviality.

  4.  **Causal Efficacy & Physical Closure Compatibility**  
      *Requirement:* The realized mental state must have genuine causal powers *without* violating the causal closure of the physical.  
      *Case:* If the physical state fully causally determines behavior, the mental state seems epiphenomenal. But if mental states "add" causal power, physics isn't closed. Realization must reconcile these.  
      *Status:* 🟢 **Non-negotiable** for a credible physicalist theory. This is where many accounts "break" (🔴 **Core Conflict Source**).

  5.  **Goldilocks Constraint (Between Over/Under-Permissiveness)**  
      *Requirement:* Must be restrictive enough to exclude spurious realizations (e.g., "solar system realizes pain"), but permissive enough to include valid novel systems (octopuses, ANNs).  
      *Case:* Over-permissiveness (requirement 1 failure) trivializes MR; under-permissiveness (e.g., requiring human neurobiology) collapses into type-identity.  
      *Status:* 🟢 **Non-negotiable** for MR to be substantive and useful.

  6.  **Black-Box Assessability & Theory-Neutral Comparison**  
      *Requirement:* Must provide criteria for attributing realization to systems with unknown internals ("black boxes") and allow comparison of realizers across competing psychological theories.  
      *Case:* Needed to evaluate novel systems (insect colonies, AGI) and adjudicate between theories (e.g., does a connectionist model realize a propositional attitude?).  
      *Status:* 🟡 **Camp-dependent**. Type-identity theorists reject this; functionalists require it. Pragmatically 🟢 for your "second job".

  ---

  ### Your Suspicion Tested: The Equivocation
  **Your suspicion is correct and crucial.**  
  - **Weak MR (Token-Sameness):** One mental state-token (e.g., *my current pain*) could be realized by different physical states *in different systems or times*. **Compatible with Type-Identity** if mental types are identical to *disjunctive* physical types.  
  - **Strong MR (Type-Irreducibility):** No nomologically possible coextension between mental types and *any* (disjunctive or not) physical type. **Needed to refute Type-Identity**.  

  **The Hardware/Software Analogy:** Naturally suggests *Weak MR* (same program runs on silicon/neurons). But *Strong MR* is needed to defeat type-identity (which can absorb Weak MR via disjunctive kinds).  

  **A Good Theory Must:**  
  - **Keep them apart** to avoid invalid arguments.  
  - **Show Weak MR entails Strong MR** to save the anti-reductionist argument. This requires proving that the disjunction of realizers is *non-nomic* (infinitely open-ended, lawless). If it can be a natural kind, type-identity survives.  
  - **Cost:** If a theory *cannot* secure Strong MR from realization conditions, the anti-type-identity argument fails. This is where debates about "wild disjunctions" (Fodor) vs. "species-specific identities" (Kim) rage.

  ---

  ### Core Tension: Joint Unsatisfiability  
  **Requirements #1, #4, and #5 are jointly unsatisfiable under physical closure.**  
  - **Conflict Source:**  
    - Physical Causal Closure (#4) implies a physical state `P` suffices for all effects.  
    - Causal Efficacy (#4) requires the mental state `M` to contribute distinct causal power.  
    - But if `M` is realized *solely* by `P` (per realization theory), `M`'s "power" is just `P`'s power under a description. `M` is causally inert unless realization adds something – violating closure.  
    - To avoid epiphenomenalism (#4), one might make realization conditions so demanding that `M` "adds" constraints (#5). But this threatens under-permissiveness (violating #5) and may reintroduce circularity (#3).  
    - Conversely, relaxing constraints to save #5 risks triviality (#1) and epiphenomenalism (#4).  

  **Result:** Theories must sacrifice one of:  
  - **Causal Efficacy** (accepting epiphenomenalism).  
  - **Physical Closure** (accepting dualism or emergentism).  
  - **Non-Trivial Realization** (accepting over-permissiveness).  
  This is the "causal exclusion" problem (Kim) biting realization-based functionalism.

  ---

  ### Scorecard for Contenders

  1. **Type-Identity Theory:**  
     *Fails* #1 (no realizability), #5 (under-permissive), #6 (no black-box criteria). *Scores* on #3 (causal relevance is physical), #4 (mental states are physical causes). **Cannot handle MR at all.**

  2. **Flat Causal-Role View (e.g., early Lewis):**  
     *Fails* #1 (vulnerable to cheap realizability), #2 (binary, no gradience), #4 (epiphenomenalism threat). *Scores* on #5 (permissive), #6 (behavior-based). **Trivializes MR.**

  3. **Dimensioned Realization (e.g., Shoemaker, Gillett):**  
     *Scores* on #2 (handles degrees), #4 (realizer contributes powers). *Fails* #3 (struggles with non-circular relevance), #5 (often over-restrictive). **Helps with near-misses but not circularity.**

  4. **Subset View (e.g., Wilson):**  
     *Scores* on #4 (mental powers subset of physical powers), #3 (avoids circularity via powers). *Fails* #1 (vague on admissible roles), #5 (may exclude novel systems if powers differ). **Best on causal efficacy but underspecified.**

  5. **Ramsified Functionalism (e.g., Lewis, Ramsey sentences):**  
     *Scores* on #6 (theory-comparison possible), #1 (constraint via whole theory). *Fails* #2 (binary), #4 (epiphenomenalism), #3 (role specs may be implicitly mental). **Vulnerable to triviality if theory is weak.**

  ---

  ### Conclusion for Your Paper
  The central tension lies in **reconciling causal exclusion (#4) with non-trivial realization (#1)** while accommodating novel systems (#5, #6). No mainstream theory fully succeeds. **Your insight about the Weak/Strong MR equivocation is critical:** most "proofs" of MR rely on Weak MR (intuitive) while anti-reductionism requires Strong MR. A theory must bridge this gap by showing realizers form no natural kind. Focus your critique here – it exposes the Achilles' heel of realization-based functionalism and explains why debates persist unresolved. The hardware/software analogy obscures this by conflating implementation flexibility with metaphysical irreducibility.
