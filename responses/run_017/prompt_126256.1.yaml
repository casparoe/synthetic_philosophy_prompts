          - In round 2, if they are in a heads world and bet heads, they get £10, which is more than in round 1. We are using real money, so we need a budget.

     Adjust prizes to fit budget: 

          For round 1: Fixed prize per observer: £5 is expensive if 10 win. Total max: £50. We can reduce to £2 per observer? Then max £20.

          For round 2: Pot is £10. In tails, each of 10 wins £1, in heads the one wins £10.

     Alternatively, use chocolate bars: 

          Round 1: Each winner gets a chocolate bar (same for everyone).
          Round 2: In heads, the winner gets 10 chocolate bars. In tails, each of the 10 winners gets 1 chocolate bar.

     But then the total number of chocolate bars must be available.

     We can use fake money that we give out, and then at the end, they can exchange for real money or chocolate? Or just use chocolate for everything.

     Let's define:

          Round 1: Fixed prize per observer: a chocolate bar (worth about £1).
          Round 2: Fixed pot per world: a bag of 10 chocolate bars. In heads, the one observer gets the whole bag (10 bars). In tails, each of the 10 observers gets 1 bar from the bag.

     Then in round 2, the total prize is the same (10 bars) regardless of the world.

     This is clear.

     Final note: We must randomize the activation for each round. For round 1, we randomly select 1 (if heads) or 10 (if tails) from the 12. For round 2, we do the same independently. Some participants might be activated in both rounds, some in none, some in one.

     We have 12 participants and we are activating 1 or 10 per round. The expected number activated per round is (1/2)*1 + (1/2)*10 = 5.5. Over two rounds, expected total activations is 11. So most will be activated at least once.

     We can also ensure that we have at least 10 activated in the tails round by having 10 cubicles activated. But we have 12 cubicles, so we can activate 10 out of 12.

     This design should work.
