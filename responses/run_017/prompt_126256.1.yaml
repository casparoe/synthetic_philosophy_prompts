  ### Anthropic Probability Session Design: "The Coin Toss Worlds"

  **Goal:** Experience anthropic reasoning through real bets, discover how payoff structures shift rational behavior, and confront the "presumptuous philosopher" dilemma. Total: 90 mins.

  **Participants:** 12 people (undergrads + grads), familiar with decision theory but new to anthropics.  
  **Materials:**  
  - Fair coin (hidden for flips)  
  - Partitioned room (or separate rooms) for isolation  
  - Betting slips + pens  
  - Prizes: Chocolate bars (fixed prize) vs. £10 note (split pot)  
  - Consolation lollipops for "voided" participants  
  - Whiteboard for debrief  

  **Key Mechanics:**  
  - **Hidden Group Size:** Participants are isolated and don’t know if they’re alone (heads world) or in a group (tails world).  
  - **Two Payoff Regimes:** Same coin-toss setup, but prize rules change.  
  - **Real Stakes:** Winners get chocolate/cash; losers get nothing.  

  ---

  ### Session Flow (90 mins)  
  **Phase 0: Setup (5 mins)**  
  - Assign participants to numbered cubicles/rooms (hidden from each other).  
  - Explain: *"A fair coin will flip. Heads: 1 observer exists. Tails: 10 observers exist. You’ll bet on heads/tails. Some won’t be observers—they ‘don’t exist’ this round and get a lollipop."*  

  **Phase 1: Fixed Prize Per Observer (25 mins)**  
  - **Coin Flip (hidden):** Heads → activate 1 random cubicle. Tails → activate 10 random cubicles.  
  - **Instructions (given to activated "observers"):**  
    *"If you bet correctly, you win a chocolate bar. Bet wrong: nothing. You are an observer, but you don’t know if the coin was heads (only you) or tails (you + 9 others)."*  
  - **Presumptuous Philosopher Moment:**  
    *"You may skip betting. If you skip, we’ll assume you bet tails (since more observers exist if tails)."*  
  - Participants bet (or skip). Collect slips.  
  - **Reveal & Payout:** Announce coin result and group size. Give chocolate to correct bettors.  

  **Phase 2: Split Pot Per World (25 mins)**  
  - **New Coin Flip (hidden):** Same activation rules.  
  - **Instructions:**  
    *"One £10 note per world. If your world guesses right:  
    - Heads (1 observer): you win the whole £10.  
    - Tails (10 observers): £10 is split, so you win £1.  
    Bet wrong: nothing."*  
  - No skip option (force direct bets).  
  - **Reveal & Payout:** Announce results. Distribute cash (£10 to solo winner; £1 each to group if tails correct).  

  **Phase 3: Debrief (35 mins)**  
  *(Whole group together)*  
  1. **Experience Share (10 mins):**  
     - *"In Phase 1, did you bet heads, tails, or skip? Why?"*  
     - *"In Phase 2, which did you bet? Did your strategy change?"*  
     - *Skippers:* *"How did it feel to ‘trust anthropics’? Did it pay off?"*  

  2. **Map to Formalism (15 mins):**  
     - **SIA vs. SSA:**  
       - SIA: *"Condition on existing. More observers in tails → tails more likely."* (Probability: \( P(\text{tails}) = \frac{N}{N+1} = \frac{10}{11} \))  
       - SSA: *"You’re a random observer. Heads/tails equally likely."* (Probability: \( P(\text{tails}) = \frac{1}{2} \))  
     - **Payoff Equivalence:**  
       - **Fixed Prize:**  
         - SIA + selfish payoff → same as **total utility maximization** (SIA bets tails; wins more chocolate in tails world).  
         - SSA + selfish payoff → same as **average utility** (SSA indifferent; 50/50 bet).  
       - **Split Pot:**  
         - SIA + selfish payoff → **indifferent** (Your calc: *correct!* SIA expects same payoff for heads/tails).  
         - SSA + selfish payoff → **prefers heads** (Higher average payoff: £10 > £1).  
       - **Whiteboard:**  
         ```  
         Fixed Prize: SIA → tails | SSA → 50/50  
         Split Pot:   SIA → 50/50 | SSA → heads  
         ```  

  3. **Presumptuous Philosopher Unpacked (5 mins):**  
     - *"Skipping the bet = trusting SIA blindly. Did it work? When? (Only in fixed-prize! In split-pot, SIA is indifferent.)"*  
     - *"Real cosmologists: Anthropics can’t replace evidence when payoffs depend on world-size (like split pot)."*  

  4. **Your Original Dispute (5 mins):**  
     - *"Your friend: ‘More likely to exist in tails’ is SIA intuition. Valid in fixed-prize, but incomplete."*  
     - *"You: Disagreement is really about total vs. average utility. Split-pot proves it—SIA goes indifferent while SSA still cares. The ‘existence likelihood’ framing is context-dependent."*  

  ---

  ### Predictable Issues & Fixes  
  1. **"I can see others!"**  
     - *Prevent:* Strict isolation (cubicles with tall dividers; no peeking). If breached: *"Assume you can’t see others—this is a thought experiment."*  

  2. **Clever Pot-Gamer (e.g., bets heads in split-pot hoping to be solo):**  
     - *Use:* Highlight in debrief. *"This is SSA! You’re maximizing personal payout, which favors heads."*  

  3. **"I exist = I’m special" Confusion:**  
     - *Fix:* Emphasize pre-bet: *"All observers are identical. You’re not ‘chosen’—you’re just here."*  

  4. **Voided Participants Feel Left Out:**  
     - *Fix:* Give lollipops + involve in debrief. *"You ‘didn’t exist’—this is key to anthropics!"*  

  5. **Math Hesitation:**  
     - *Fix:* Use concrete numbers. *"N=10: SIA thinks 10/11 chance you’re in tails. SSA thinks 1/2."*  

  ---

  ### What the Activity Can’t Reproduce  
  - **"Couldn’t have failed to exist":** Participants were randomly sampled from a pool ("might not have existed"). In true anthropics, observers necessarily exist in their worlds.  
    - **How to Bridge:** Post-activity, say: *"In reality, if the coin lands tails, all 10 observers must exist—no ‘sampling’ from a void. This makes SIA’s ‘you’re more likely to exist in tails’ more compelling. But our experiment shows that even then, payoffs change the decision!"*  
  - **Reference Class Problem:** Activity uses "observers in the room." Real SSA/SIA debate "what counts as an observer?" (aliens? AIs?).  
    - **Bridge:** *"We used ‘activated participants’ as observers. But what if we included future humans? That’s where it gets thorny..."*  

  **Outcome:** They’ll leave seeing SSA/SIA as tools for different goals (total vs. average utility), not abstract truths. Your split-pot calculation holds—it’s the linchpin.
