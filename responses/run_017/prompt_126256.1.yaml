prompt: |-
  ok so i just spent like two hours arguing with my friend about anthropic probability and I've decided the only way to settle it is to teach it, lol. Here's where we got stuck, and I want you to build the session around exactly this.

  We were on the standard coin-toss setup: fair coin, heads gives you a world with one observer, tails gives you a world with N observers, everybody in a world is in the same epistemic situation, nobody can see anybody else. My friend says SIA is obviously right, because you should condition on the fact that you exist, and you're N times more likely to exist at all if the coin landed tails — so your credence in tails should be N/(N+1), and that's basically what the presumptuous philosopher is up to when she tells the cosmologists to skip the expensive experiment because anthropic reasoning already handed them the answer. I said the 1/2 vs N/(N+1) gap is real but the "you were more likely to exist" framing is a red herring, and the actual disagreement lives somewhere else.

  Where I think it lives: if everyone in a world faces the same choice and you only care about your own payoff, then SIA plus "every observer gets the same fixed prize if the guess is right" ranks the options exactly the same way as a plain 1/2 prior plus "add up everybody's payoff in the world" — the N just cancels. And SSA plus your-own-payoff comes out the same as a plain prior plus average payoff per observer. So on my reading the SSA/SIA fight is the total-vs-average fight in a costume. And here's the bit my friend couldn't handle: change the prize so that there's one fixed pot per world that gets split equally among however many observers that world has. Then I get SIA going exactly indifferent between betting heads and betting tails, while SSA still strictly prefers heads — so the split pot doesn't dissolve the disagreement, it just changes its shape. Or I might have that backwards, we were both tired and I defintely stopped trusting my own algebra around minute ninety.

  So, the ask. I run a fortnightly rationality-and-decision-theory reading group: 12 people, 90 minutes, mixed undergrads and a few grad students, they've done Newcomb and the Sleeping Beauty stuff but nobody's seen anthropics. Design me the session.

  What I need from it:

  - No lecture up front. They should be placing real bets with real (small) stakes — chocolate, a tenner, whatever — and the rules should be arranged so they collide with the disagreement themselves, in their own payoffs, before anyone names SSA or SIA.
  - At least two payoff regimes, and the regime has to be the thing that changes, not the story: one where every observer in the world collects the same fixed prize if the world guesses right (so a big world pays out many times over), and one where there's a single pot split evenly across however many observers exist (so a big world pays out the same total, spread thin). I want them to notice that which rule seems to "win" moves around with the payoff structure, and to notice it from what happened to them, not from me.
  - Use the room: real groups of real sizes fixed by something they can't observe, so the indexical uncertainty is something they're actually in rather than something they're imagining.
  - The presumptuous philosopher has to be something they do. At some point they should be sitting there with the option of skipping the evidence and just trusting the anthropic reasoning, they should get to choose whether to skip, and then they should find out whether skipping paid — and sit with how it felt.
  - Debrief: map particular moments in the session onto the formal stuff, concretely — what each rule says the probability is, where the reference class is quietly doing work, the total-vs-average equivalence I sketched above, and an honest verdict on my split-pot calculation (is SIA really indifferent there, and does that support my reading or wreck it).
  - Tell me what will predictably go wrong the first time I run it and what to do about it: the clever one who tries to game the pot, the one who points out they can literally see the other people, the one who conflates "I exist" with "I'm this particular person."
  - And be straight with me about what the activity cannot reproduce. I'm fairly sure you can't actually stage the part where you couldn't have failed to exist — you can only fake it with a hidden sampling procedure — so tell me which piece of the weirdness has to come from me talking at the end, and how to introduce it without it landing as a non sequitur.
