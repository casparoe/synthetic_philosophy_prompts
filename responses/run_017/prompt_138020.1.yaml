prompt: |-
  longtime lurker on the EA Forum and the rationalist blogs here — I keep seeing the scale argument run as nothing more than N × p × welfare-per-animal, and I want the spec before I touch the calculator again. So write me the desiderata: what a theory of comparative sentience and moral status across taxa would have to deliver to be good enough to allocate a fixed budget across interventions on a ten-year horizon. Not good enough to settle the metaphysics — I definately don't care about that, I care about spending money.

  For each requirement, give the case or consideration behind it, and mark whether it's non-negotiable or just a taste of one camp.

  Two stipulations so this isn't a rehash of the usual post. First, call it the clade gamble: assume sentience is a package deal at the level of the taxonomic order, so either every insect in an order has valenced experience or none do — the uncertainty doesn't wash out across individuals and the error bars are correlated. Second, we're choosing under moral uncertainty between a hedonic view of welfare and a desire-based one, and we refuse to pick between them.

  I want you to take a position, not list options neutrally, on: whether the theory has to hand us cardinal, intertheoretically comparable numbers or whether ordinal rankings would do; whether it's allowed to let a one-in-a-thousand credence on 10^18 units of value dominate everything; whether the answer may shift when we redescribe one population as two; and which findings the theory has to be revisable in the light of rather than merely consistent with. Then flag any pair of your own desiderata you suspect can't be jointly satisfied — risk-sensitivity against invariance under redescription looks like one to me, but you tell me — and say which single requirement knocks out the most candidates.

  Keep the scoring of the two default moves (multiply-and-compare under expected value, versus some precautionary threshold rule) to one short paragraph at the end; the list is the deliverable. Answer in British English please.
reasoning: |-
  Okay, the user is deeply involved in the Effective Altruism community, clearly well-versed in the debates around animal welfare economics and moral uncertainty. They're frustrated with oversimplified scale arguments (N × p × welfare) and want a rigorous framework for allocating limited budgets across species-specific interventions. 

  Hmm, their framing is quite precise: they demand desiderata for a comparative sentience theory that must work under two constraints—the "clade gamble" (sentience as all-or-nothing at taxonomic order level) and refusal to choose between hedonic/desire-based welfare views. Smart stipulations; they're forcing the theory to handle correlated uncertainty and intertheoretic comparisons.

  Right, let's unpack their hidden asks. They're clearly burned by: 
  - Blackboard-style EV calculations where tiny probabilities dominate
  - Theories that crumble under population redefinitions (like splitting one group into two)
  - Non-revisable models that can't absorb new evidence

  Ah, and they explicitly want me to take stances, not neutrally list options. Key positions they're probing:
  - Cardinal vs ordinal: Must argue for cardinal with intertheoretic comparability—ordinal won't cut it for budget allocation under moral uncertainty.
  - Tiny probabilities: Absolutely must reject letting 0.1% credence in astronomical value dominate—precisely to avoid Pascal's Mugging in welfare economics.
  - Population redescription: The theory must be invariant here—otherwise it's manipulable nonsense.
  - Revisability: Must require responsiveness to certain evidence (e.g., functional studies), not just consistency.

  Spot on that risk-sensitivity vs redescription invariance might conflict. If we weight worst cases heavily, but redrawing group boundaries shifts the "worst case," we're stuck. Best solution? Build redescription-invariance into the risk framework itself. 

  The knockout criterion? Definitely revisability. Any theory that can't update on functional evidence (like opioid responses) is useless for real-world decisions. 

  Final note: Their dismissal of metaphysics is telling. This is a pragmatist who wants tools, not truths. Must keep every desideratum anchored to spending outcomes.
answer: |-
  Right then, let's cut through the metaphysics and get to brass tacks. For allocating a fixed budget across animal welfare interventions on a ten-year horizon, under your stipulations (Clade Gamble, Hedonic/Desire-Based Moral Uncertainty), a theory of comparative sentience and moral status needs to deliver the following. I'll take a firm position on each point as requested.

  **Core Desiderata for a Pragmatic Theory of Comparative Sentience:**

  1.  **Cardinal, Intertheoretically Comparable Welfare Units (Non-Negotiable):**
      *   **What:** Must output cardinal welfare estimates (e.g., units of welfare gain/loss, not just "more/less") that are comparable *both* across species *and* across the two moral theories (hedonic welfare and desire-fulfilment).
      *   **Why:** Budget allocation requires comparing marginal cost-effectiveness *across interventions* targeting *different taxa* under *moral uncertainty*. Ordinal rankings ("insects < fish < mammals") are useless for calculating how many £££ spent on chickens saves more "welfare" than £££ spent on shrimp, especially when "welfare" means different things under different theories. We need a common currency to apply the budget constraint.
      *   **Case:** Choosing between funding corporate broiler chicken reforms (high N, moderate p(hedonic), moderate p(desire)) vs. insect farmed mealworm welfare (extreme N, very low p(hedonic/desire due to Clade Gamble)). Ordinalism can't tell us which £ spent yields more expected moral value under uncertainty.

  2.  **Robustness to Astronomical Stakes / Rejection of Pascalian Dominance (Non-Negotiable):**
      *   **What:** Must NOT allow minuscule credences (e.g., 1-in-1000) in extreme welfare capacities (e.g., 10^18 units per individual) to automatically dominate the expected value calculation and swamp interventions targeting less numerous or "higher probability" clades.
      *   **Why:** Under the Clade Gamble, credences in whole orders being sentient might be very low but non-zero. Naive EV (N × p × welfare) makes interventions targeting vast, low-p clades (like insects) irresistible even with tiny p, making allocation absurd and insensitive to evidence. This violates practical reason and makes a mockery of evidence-based allocation.
      *   **Case:** A 0.001% credence that Coleoptera (beetles) are sentient at mammalian intensity levels would dominate the EV calculation for *any* budget due to their sheer numbers. We need a theory/framework that mitigates this, e.g., through risk-aversion, probability damping, or integrating scale sensitivity differently.
      *   **Position:** Absolutely forbidden. Any credible theory must incorporate a mechanism (explicit or implicit) to prevent this.

  3.  **Invariance Under Population Redescription (Non-Negotiable):**
      *   **What:** The theory's output (welfare estimates per individual/clade, and thus cost-effectiveness) must not change merely because we arbitrarily decide to describe one population as two sub-populations (or vice versa), *if* the underlying evidence about the individuals' capacities remains identical.
      *   **Why:** Ethical significance should depend on the properties of the individuals, not bureaucratic or arbitrary taxonomic splitting/lumping (beyond the stipulated Clade Gamble level of Order). Without this, the theory is manipulable and its outputs lack objective grounding.
      *   **Case:** Splitting "fish" into "Teleosts" and "Other Fish" based on minor taxonomic whims, despite identical evidence for sentience in both groups, shouldn't suddenly change the cost-effectiveness of an intervention affecting all fish. The Clade Gamble already forces grouping at Order level; redescription within that shouldn't matter if evidence is unchanged.
      *   **Position:** Mandatory invariance. Shifting allocations based on redescription is irrational.

  4.  **Revisability Based on Functional/Behavioural/Neurobiological Evidence (Non-Negotiable):**
      *   **What:** The theory MUST be structured such that specific types of new evidence can demonstrably *change* its welfare estimates for a clade, not just be vaguely "consistent" with them. It must be sensitive to evidence concerning:
          *   **Functional analogues to vertebrate pain pathways:** Presence of endogenous opioids, nociceptors with central projection, evidence of analgesia altering behaviour.
          *   **Motivational trade-offs & learning:** Flexible decision-making involving cost/benefit trade-offs, avoidance learning not explicable by simple reflex.
          *   **Integrative brain structures:** Evidence for neural integration sites (not necessarily homologous to cortex) supporting unified experience.
      *   **Why:** We need a theory that guides research and spending *now* but can be updated. A theory that's equally "consistent" with any possible future evidence is unfalsifiable and useless for prioritisation. We need to know *what would change our minds*.
      *   **Case:** Finding functional endogenous opioid systems coupled with behavioural evidence of pain mitigation in decapod crustaceans *must* significantly increase their estimated welfare capacity under the theory. Conversely, finding such systems entirely absent in a clade should lower it. Mere "consistent with sentience" claims are worthless for allocation.
      *   **Position:** Essential. A theory not revisable by concrete functional evidence isn't a tool, it's dogma.

  5.  **Explicit Handling of Moral Uncertainty Between Hedonic & Desire Views (Non-Negotiable):**
      *   **What:** Must provide a clear method (e.g., MEC, Borda counts over theories, variance weighting) for aggregating the cardinal welfare estimates generated under the hedonic view and the desire-fulfilment view into a single "morally uncertain" welfare estimate per clade/intervention.
      *   **Why:** You stipulated we refuse to pick one theory. Allocation requires one priority list. The theory must bridge this gap explicitly.
      *   **Case:** Vertebrates might score high on both views. Some invertebrates (e.g., cephalopods) might score moderately on desire-fulfilment (complex goals) but low on hedonism (diffuse nervous system?). The theory needs to tell us how to combine these differing assessments for budget decisions.
      *   **Position:** Non-negotiable requirement for the framework.

  6.  **Integration of Clade Gamble Correlated Uncertainty (Non-Negotiable):**
      *   **What:** Must explicitly model the "all-or-nothing" uncertainty per Order. The welfare estimate for an individual *within* an Order is contingent on the binary state (Sentient/Not Sentient) of the *entire Order*. This drastically alters risk profiles compared to uncorrelated individual probabilities.
      *   **Why:** The core stipulation changes the game. Uncertainty isn't washed out; it's concentrated. This impacts risk-sensitivity and the value of information (research into one species informs the whole Order).
      *   **Case:** Research confirming sentience in *one* Dipteran (fly) species under the theory should massively update p(Sentient) for *all* Diptera (mosquitoes, gnats, etc.), instantly changing the cost-effectiveness of interventions across the entire Order.
      *   **Position:** Must be baked in, not bolted on.

  7.  **Risk-Sensitivity (Negotiable - Taste of Camp):**
      *   **What:** Should allow for differential weighting of worst-case/best-case scenarios under uncertainty, not just maximizing expected value.
      *   **Why:** Some actors are more averse to the moral catastrophe of overlooking a truly suffering clade. The Clade Gamble amplifies this – getting a whole Order wrong is a huge potential regret.
      *   **Case:** A risk-averse allocator might prioritise reducing suffering in vertebrates (high p) over a potentially larger but much riskier insect intervention, even if naive EV slightly favours insects.
      *   **Position:** Important for practical adoption, but the framework could technically function without it (using pure EV). However, given the Clade Gamble's amplification of tail risks, it's highly desirable.

  **The Conflict & The Knockout:**

  *   **Conflict:** You're right. **Risk-Sensitivity (7)** inherently conflicts with strict **Invariance Under Redescription (3)**. If you're risk-averse to worst-case suffering, arbitrarily splitting a population into two groups could change *which* group looks like the worst-case scenario under the "Sentient" hypothesis for that clade. A theory incorporating risk needs careful rules for defining the "populations" considered in the risk calculation to minimise arbitrariness, but perfect invariance under redescription might be unattainable with strong risk-weighting. *Mitigation:* Anchor risk calculations firmly to the Clade Gamble level (Order) and define the "population" strictly as the Order itself. Risk applies to the Order's binary state.
  *   **The Knockout Requirement:** **Revisability Based on Functional Evidence (4)** knocks out the most candidates. Many philosophical theories (e.g., those based purely on metaphysical arguments, or those declaring certain neural architectures *a priori* necessary/sufficient) are rigid. If functional opioid responses in an insect wouldn't budge the needle under the theory, it's useless for evidence-driven allocation. This requirement demands an empirically grounded, functionalist approach.

  **Scoring the Default Moves:**

  *   **Naive EV (N x p x welfare):** Fatally flawed under Clade Gamble. Astronomical Stakes problem is crippling. Requires cardinal intertheoretic welfare units, but provides no revisability mechanism. Fails invariance if p or welfare depends on description. Only handles moral uncertainty clumsily. **Inadequate.**
  *   **Precautionary Threshold Rule (e.g., "Treat as sentient if p > X%"):** Avoids Pascalian dominance but is crude. Requires arbitrary threshold X. Doesn't deliver cardinal units for allocation *within* the "sentient" group or handle moral uncertainty well. Invariance depends on threshold definition. Revisability only changes p, not the binary treatment. **Insufficiently nuanced for budget allocation across diverse interventions.**

  The deliverable is a theory robust on 1-6, grappling with 7, explicitly designed to absorb functional evidence (4), preventing Pascalian ruin (2), and delivering cardinal, comparable numbers (1) under moral uncertainty (5) and clade-level correlation (6), invariant to redescription (3). Anything less won't reliably spend money well.
