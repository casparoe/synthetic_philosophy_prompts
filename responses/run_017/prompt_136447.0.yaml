  3. Idle Stakes (#1) - Challenges encroachment's foundations. If stakes matter without action, it rewires the debate. Lower externality, but could link to predictive systems (e.g., forecasts never acted upon). Most "pure philosophy" of top three, but funder might accept if framed as theory for decision systems. Confidence: 7/10. Risk: Might become an isolated thought experiment.

