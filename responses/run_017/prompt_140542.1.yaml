prompt: |-
  I need a teaching plan rather than an explanation, please. I've got 80 minutes on Thursday with about 25 second-years in a metaphysics course, third week of term, and the topic is the special composition question — when do some things make up one thing. So: don't explain it to me, tell me how to build the explanation.

  Things that make this awkward:

  - They did grounding and dependence last week and are now reaching for it for everything. My worry is they'll hear "is there a composite object over and above the parts" and decide it's obviously verbal — of course the particles are there, the only question is whether the chair-talk is grounded, and then they'll think they've dissolved something and switch off.
  - Roughly a third are joint honours with maths and have had some naive set theory. Last year that subgroup concluded that a composite just is the set of its parts, and I handled it badly.
  - This session has to set up the personal identity material in week eight — the animalism versus constitution-view stuff — so whatever example carries Thursday should be reusable when we ask whether something survives total change of parts. I keep using a different example in each session and it costs me.
  - No mereology assumed at all, so "part" has to get introduced informally somewhere.
  - I'm a universalist and I allways tip my hand in the last ten minutes and the room goes quiet. Where should my own view go, if anywhere?

  What I want: the order the pieces have to come in, and why — what genuinely depends on what. I don't think you can even state the question until they can keep composition apart from identity and from constitution, and I'm not sure which of those three has to land first. Then the one example to build the whole session around, and what it has to have and lack to do the job: it needs to be a case where contact, shared function and being alive come apart, it needs to resist the "that's just a set" move, and I think it should have a version where nothing is touching — tell me if I'm over-specifying. Then the misconceptions, with the point in the sequence where each should be headed off rather than all of them at the end: the verbal-dispute one, the set one, "chairs obviously exist so the nothing-composes view is silly", "restricted composition is obviously right because things have to be stuck together or interact causally", probably also the thought that the answer has to come out the same in every possible world, and anything else you'd predict.

  Also: of the four possible answers — nothing ever composes, everything always does, only under some conditions, and it's just brute — which should I actually develop in 80 minutes and which should I name and drop, because I can't do all four properly and last time I did none of them properly.

  And one end-of-session question that would show they've got it rather than that they've memorised my example. Last year everyone could hand the example back to me and I still don't think half of them could say what would have to be true for the nothing-composes answer to be false, in a way that isn't just "but there are chairs".

  Last thing: I want to openly refuse to do one thing and say so out loud. I'm tempted by whether the question is even well posed, and by whether the many are prior to the one or the one prior to the many, and I suspect both are above this level. Which should I name and decline, and why that one.
reasoning: |-
  Hmm, the user is asking for a structured teaching plan on the special composition question for a metaphysics class. They have very specific concerns: students overusing grounding/dependence from last week, math students reducing composition to set theory, needing a reusable example for future personal identity topics, introducing mereology informally, and handling their own universalist stance.

  The key constraints are: 80-minute session, 25 second-year students, third week of term. The user wants the sequence of concepts, a central example that avoids common misconceptions, and clarity on which answers to develop versus mention. They're also concerned about students missing the metaphysical weight of the question by reducing it to verbal disputes or set theory.

  First, I need to map the conceptual dependencies. The question "when do some things compose a whole?" requires distinguishing composition from similar concepts. Students might confuse it with identity (the whole is just the parts) or constitution (like the statue and clay). Grounding could be misapplied here too - they might think composition is just about how we talk about objects rather than a real metaphysical issue.

  The central example needs to: 
  - Separate contact, function, and life (e.g., a disassembled chair vs assembled one) 
  - Resist "it's just a set" reduction (so no abstract objects) 
  - Work for touching and non-touching scenarios 
  - Be reusable for personal identity later (persistence through part changes)

  A bicycle example fits well: 
  - Assembled (contact + function) vs disassembled parts (no contact) 
  - Can discuss repair scenarios where parts change 
  - Concrete object so "just a set" doesn't apply 
  - Shows functional unity without implying life

  For misconceptions:
  - Verbal dispute: Emphasize early this is about what exists, not just language 
  - Set theory: Contrast sets (abstract) with composites (concrete) 
  - Commonsense objections: Use the example to show intuitions conflict 
  - Necessity: Explicitly state conditions might vary across worlds

  Among the four answers: 
  - Develop universalism and nihilism fully (clear opposites) 
  - Briefly mention restricted composition and brutalism 
  - Save restricted for later sessions where it naturally appears

  The user's universalism should come at the end as a "challenge" to avoid biasing earlier discussion. For the refused topic, skip priority debates (one/many) as too advanced - explicitly tell students this is about existence conditions first.

  End with a diagnostic question testing understanding beyond examples: "What would have to be true for nihilism to be false?" Correct answer involves composition being possible under some conditions, not just listing chairs.
answer: |-
  Here's a structured 80-minute teaching plan focusing on sequence, misconception management, and your constraints. The core example is **a bicycle**, designed to be reused for personal identity (surviving part replacement) and to resist set-theoretic reduction.

  **Core Structure:**  
  1. **Groundwork** (15 mins) → 2. **Stating the Question** (10 mins) → 3. **The Bicycle Example** (25 mins) → 4. **Four Answers** (20 mins) → 5. **Wrap-up & Diagnostic** (10 mins)  

  ---

  ### **1. Groundwork: Untangling Concepts** (15 mins)  
  *Why first?* Students must distinguish composition from identity/constitution before the question makes sense. Preempts "it’s just verbal" by showing metaphysical stakes.  
  - **Identity vs. Composition** (7 mins):  
    - *Activity:* Ask: "Is *the University* identical to its buildings, students, and staff? Or is it something they *compose*?"  
    - *Key point:* Identity (A = B) vs. composition (A’s parts make B). Use a water molecule (H₂O): H atoms + O atom compose the molecule but aren’t identical to it.  
  - **Constitution vs. Composition** (8 mins):  
    - *Activity:* Show a *clay statue*. Ask: "Does clay compose the statue, or constitute it?"  
    - *Key point:* Composition (parts → whole) vs. constitution (one object → another, e.g., clay → statue). *Emphasize:* Constitution assumes composition already happened (clay parts compose the clay lump).  

  ---

  ### **2. Stating the Special Composition Question (SCQ)** (10 mins)  
  *Why now?* Only after disentangling identity/constitution can the question land as metaphysical.  
  - **Define informally** (5 mins):  
    - "When do some things (the *parts*) compose a single further thing (the *whole*)?"  
    - *Stress:* This is about **existence** ("Is there a whole object?") not language ("Do we call it a chair?"). Preempts "verbal dispute" by framing it as: "Would the whole exist even if no humans did?"  
  - **Introduce "part"** (5 mins):  
    - *Informal definition:* "A part is a component that, if removed/destroyed, would change or destroy the whole." Use the bicycle: wheels are parts; a scratch on the frame isn’t.  
    - *Preempt "set" move:* "Sets are abstract; parts are physical. If I destroy a wheel, I destroy part of the bike—I don’t just alter a set!"  

  ---

  ### **3. The Bicycle Example: Testing Conditions** (25 mins)  
  *Why this example?*  
  - Separates contact (wheels on ground vs. attached), function (riding vs. disassembled), life (bike isn’t alive).  
  - Resists "just a set": Concrete, functional, spatial.  
  - Non-touching version: Parts laid out on a workshop floor.  
  - Reusable for personal identity: A bike survives wheel replacement; what about *all* parts?  
  - **Sequence:**  
    - **Case 1: Assembled, functional bike** (5 mins):  
      - Q: "Do the parts compose a whole? Why/why not?" *Elicit intuitions: contact + function.*  
    - **Case 2: Disassembled parts in a box** (5 mins):  
      - Q: "Same parts, no contact, no function. Is there a bike? Is there *any* whole?" *Challenge contact/function.*  
    - **Case 3: Parts scattered across a junkyard** (5 mins):  
      - Q: "Now no spatial proximity. Does composition require parts to be 'together'?" *Introduce causal interaction.*  
    - **Case 4: Bike with one wheel replaced mid-ride** (10 mins):  
      - *Reusability hook:* "Next week, we’ll ask: Is this the *same* bike? Today: When parts change, does composition *ever* happen?"  

  ---

  ### **4. Four Answers to SCQ** (20 mins)  
  *Develop two fully; name/drop two.* Prioritize extremes to show stakes.  
  - **Nihilism (Nothing ever composes)** (8 mins):  
    - *Argue:* "Only particles exist; 'bikes' are just particles arranged bike-wise."  
    - *Address "chairs exist" misconception:* "Nihilism isn’t denying particles arranged chair-wise—it denies a *further thing*."  
  - **Universalism (Always composes)** (8 mins):  
    - *Argue:* "Any particles compose *some* object—e.g., your bike + the moon compose a 'bikemoon'."  
    - *Preempt "restricted is obvious":* "Is the bikemoon less real than the bike? What stops it?"  
  - **Name/Drop** (4 mins):  
    - *Restricted composition:* "Some say composition needs contact/function—but our bike cases show disagreements." (Save for future weeks).  
    - *Brutalism:* "Some say composition has no deeper explanation—but that’s a last resort." (Mention only).  
  - ***Your view (Universalism):*** State it plainly in the *last 2 mins here*, then: "This unsettles people—we’ll test its costs next week. For now, just see it as a live option." *Normalizes disagreement; avoids "quiet room" derailing debate.*  

  ---

  ### **5. Wrap-up & Diagnostic** (10 mins)  
  - **Refuse one topic explicitly** (2 mins):  
    - *Say:* "We won’t ask whether the one is prior to the many. Why? Because SCQ is about *whether composition happens*, not *how* objects depend on parts. That’s week 7!" (Prevents overreach; signals where it fits).  
  - **Diagnostic question** (8 mins):  
    - *Q:* "Suppose nihilism is true. What would change in the world if it were false?"  
    - *Correct response:* Not "chairs would exist" (trivial), but "There would be composite objects *over and above* their parts." (Tests grasp of "over-and-above").  
    - *In-class:* Have them write 1-sentence answers; collect to gauge understanding.  

  ---

  **Why This Sequence Works:**  
  - **Dependencies:** Composition → SCQ → Answers. Identity/constitution *must* come first to avoid conflation.  
  - **Misconception timing:** "Verbal dispute" is preempted in SCQ framing; "set theory" during part introduction; "chairs exist" during nihilism; "restricted is obvious" during universalism.  
  - **Economy:** One example (bike) handles contact/function/non-touching/part-change *and* sets up personal identity.  
  - **Your universalism:** Placed late, framed neutrally as "one option," avoids early bias.  

  **Materials Needed:**  
  - Whiteboard diagrams: Bike cases, H₂O molecule, clay statue.  
  - Prep: Have particle-level bike description ready ("trillions of atoms arranged bike-wise") for nihilism.  

  This builds the metaphysics incrementally while containing predictable issues. The bike example pays dividends in Week 8 when you ask: "After all parts are replaced, is it the *same* bike? What would universalism/nihilism say?"
