prompt: |-
  I have been asked to give a seventy-five-minute guest session in the first-year letterform studio of a type design programme, and I want to use it to bring about eighteen students — who can draw a passable 'a', who can name bowl, stem, spur, terminal, counter and aperture, and who have had no philosophy — to the point where they feel the force of a single question: what makes every 'a' an 'a'? Not how one draws one, and not which 'a' is best, but what a mark has to be like in order to be that letter at all — given that a Bodoni 'a', a Futura 'a' and a single-storey 'ɑ' seem to share no measurable feature while remaining unmistakably the same letter, and that some marks much closer to the canonical 'a' than any of those are not one.

  I will have a whiteboard, a stack of printed specimens, and no projector. Please do not answer the question for me: plan how I should spend the time. I want the order in which the pieces must be introduced and what depends on what — not a menu of things that could be said.

  Three notions of my own that I would like the session to earn, and that you may take as given:

  *latitude* — the set of shapes a letter may take across typefaces. My reason for thinking this is the hard part is that the latitude of 'a' looks disconnected: there seems to be no continuous deformation that takes a double-storey 'a' into a single-storey one while remaining an 'a' at every intermediate step, so the category cannot be a region of shape-space with a centre.

  *contrast budget* — the pressure, within a single typeface, for 'a' to stay distinguishable from o, d, g, q, e, u and n at the sizes and in the media the face is actually used at, which suggests that much of what makes an 'a' an 'a' is not intrinsic to it but is its slot in a system of neighbours.

  *the counterfeit* — a mark that satisfies every local criterion you could write down for an 'a' and reads correctly in isolation, but is visibly not the 'a' of the face it has been dropped into.

  I have three candidate carrying examples: an *orphan sort*, in which each pair of students is handed twelve unlabelled glyphs cut from six typefaces — two from each — and asked to sort them into six piles without being told what any glyph says or whether any two come from the same face; the *counterfeit*; and the disconnectedness of latitude itself. Which should carry the whole session, what must it have and what must it lack, and why not the three I am otherwise tempted by — the Bodoni-beside-Futura comparison, the squint-or-blur test, and asking them to draw an 'a' from memory?

  The misconceptions I expect, in no particular order: that the essence is a checklist of features you could tick off; that since no feature is shared by all 'a's, the letter is arbitrary convention and one could swap 'a' and 'o' throughout a typeface at no cost; that there is an ideal 'a' which real fonts approximate, the truest one being nearest to it; and that talk of a letter's spirit is mysticism, the real story being only what readers happen to recognise, which is a psychological matter and none of the designer's business. Put these in the order in which they will actually arise, and tell me the exact point in the sequence at which each should be defused — I would much rather pre-empt one than correct it, because in a studio a wrong framing reaches the far side of the room before I can answer it.

  Two further things. First, the hinge I am least sure about: once the disconnectedness of latitude has landed, the session can collapse into "no answer, mere convention" — what must already be in place before that point so that the question survives it? Second, the end: I want one task whose results would let me tell, next morning, whether the question has landed or whether they have only learned to say "it's about the system, not the shape." What should that task be, what does an answer that has landed look like, and what does a fluent but empty one look like? And what should I openly decline to explain at this level — say, the philosophy-of-concepts literature, perception and letter recognition, or the history of the letter — and how should I mark the refusal so it reads as a decision rather than an omission?
reasoning: |-
  Hmm, the user is asking for a lesson plan to introduce first-year type design students to a philosophical question about what defines the letter 'a'. They want to guide students from basic technical knowledge to confronting the core mystery of letter identity - why vastly different shapes like Bodoni 'a', Futura 'a', and single-storey 'ɑ' are all recognized as 'a', while some nearly identical marks aren't.

  The user has three key concepts they want to convey: latitude (the range of possible 'a' shapes), contrast budget (how letters maintain distinction from neighbors), and counterfeit (a technically perfect but contextually wrong 'a'). They're debating which of three teaching examples to use: orphan sorts (sorting mixed glyphs), counterfeits, or demonstrating disconnected latitude.

  I need to structure a 75-minute session that builds understanding step-by-step while preventing common misconceptions. The user is particularly concerned about students falling into "it's all arbitrary convention" thinking when they see how disconnected the latitude is. They also want a clear assessment task to see if students truly grasp the question.

  Important constraints: students can identify letter parts but have no philosophy background. Resources are limited to whiteboard and printed specimens - no projector. The session must pre-empt rather than correct misconceptions.

  The plan should:
  - Start concrete by comparing extreme 'a' examples to show the problem
  - Use hands-on sorting to reveal systemic relationships
  - Introduce counterfeit to show context matters
  - Frame the core question only after building tension
  - Prevent "arbitrary convention" thinking by showing functional constraints
  - End with a diagnostic drawing task

  For misconceptions, I'll sequence how they might arise:
  1. Feature checklist thinking (early, when seeing diverse 'a's)
  2. Ideal form assumption (when comparing historical forms)
  3. Arbitrary convention (when seeing disconnected latitude)
  4. Recognition psychology dismissal (if system approach seems vague)

  The assessment should be: "Draw three 'a's that couldn't possibly coexist in the same typeface." This reveals if they understand systemic constraints versus just drawing variations. A good answer shows grasp of contrast budget; a superficial one just draws random styles.

  I'll suggest declining philosophy/history discussions by framing it as "that's answering a different question" - keeping focus on design practice. The counterfeit example should carry the session as it combines all three concepts in one concrete demonstration.
answer: |-
  Below is a rigorously sequenced 75-minute lesson plan designed to force confrontation with the core question while pre-empting misconceptions. Each step builds on the previous, creating dependencies that block escape routes. The **counterfeit** carries the session – it embodies *latitude*, *contrast budget*, and the core question simultaneously.

  **Session Structure:**
  *(Times are cumulative)*

  **PART 1: SHATTERING THE FEATURE CHECKLIST (0-25 min)**
  1.  **(0-5 min) The Impossible Task:** Start cold. Hand out 12 unlabelled glyphs (orphan sorts) – 6 distinct typefaces, 2 glyphs each: `a, o, d, n, g, q`. *Do not identify letters.* Instruct: "Sort these into 6 piles. Each pile should contain two glyphs that *belong together* in the same typeface. You have 3 minutes." (Chaos ensues. Most groups fail. *Why?* The systemic relationships are invisible without context).
  2.  **(5-10 min) Reveal & Confusion:** Ask groups to report *one* pair they felt confident about & why. Write typeface names on the board. Reveal the correct pairings. Key Q: **"Why was this so hard when you all know what an 'a' looks like?"** Highlight that knowing letter *names* didn't help pair *system-mates*.
  3.  **(10-20 min) Extreme Latitude Display:** Whiteboard: Draw a stark Bodoni 'a' (high contrast, ball terminal) and a Futura 'a' (monoline, geometric). Add a printed specimen of a single-storey 'ɑ' (e.g., from FF Milo). Label them all 'a'. Ask: **"What single, measurable feature do ALL three share that makes them 'a'? (Not just 'curves' or 'aperture' – those apply to 'o' or 'c')."** Force specificity. *Pre-empts Feature Checklist (Misconception 1)* here. Students will struggle. List failed criteria (stem? counter shape? terminal?).
  4.  **(20-25 min) The Disconnect:** Draw a hypothetical "path" from Bodoni 'a' to single-storey 'ɑ' via simplified intermediates. At the midpoint (a simple loop with a straight right side), ask: **"Is this still clearly an 'a'? Or could it be a 'd'? An 'o'? Something else?"** Point out the plausible intermediate might be ambiguous or misread. State: **"There seems to be no smooth path connecting all 'a's where every step is unambiguously 'a'. The 'latitude' is disconnected."** *Introduces Latitude & its disconnect.*

  **PART 2: THE SYSTEM STRIKES BACK (25-50 min)**
  5.  **(25-35 min) Neighbourhood Watch:** Return to the orphan sorts. Focus on one correctly paired set (e.g., a Bodoni 'a' and 'o'). Whiteboard: Draw the Bodoni 'a'. Ask: **"What stops this from being read as an 'o'?"** (Answers: height, aperture, stress axis, terminal). Now draw the Bodoni 'o' beside it. **"Now imagine a typeface where the 'o' looks *exactly* like this Bodoni 'a'. What would *its* 'a' have to look like to avoid confusion?"** *Introduces Contrast Budget implicitly.*
  6.  **(35-45 min) Counterfeit Reveal (The Pivot):** Display the **Counterfeit**. Use a common face (e.g., Helvetica). Show the *real* Helvetica 'a'. Then show the counterfeit – meticulously crafted to match *local* features (bowl size, stem angle, aperture height) but subtly wrong in system context (e.g., stroke weight distribution mimics 'o', or terminal shape echoes 'c', *while still looking like a plausible 'a' alone*). Ask: **"This satisfies every 'feature checklist' for Helvetica's 'a'. Why does it feel wrong *here*? What is it conflicting with?"** *Pre-empts Ideal Form (Misconception 3)* by showing a "perfect" local 'a' fails systemically. Forces focus on neighbours.
  7.  **(45-50 min) Swapping Consequence:** Challenge **Arbitrary Convention (Misconception 2)** head-on: **"If 'a' is just an arbitrary shape, could we swap the shapes of 'a' and 'o' throughout this typeface?"** Swap labels on the real Helvetica 'a' and 'o'. Show printed words: "boat" becomes "b a o t" – visual chaos. **"Why does this break? The shapes are fine in isolation!"** Emphasize: The *relationship* matters more than the absolute shape. The system collapses.

  **PART 3: FRAMING THE ABYSS (50-75 min)**
  8.  **(50-60 min) The Core Question Emerges:** Summarize: 1) No universal features (Latitude). 2) System defines identity (Contrast Budget). 3) Perfect local mimic fails (Counterfeit). Point to the disconnected latitude path. **"So: What *is* it? What makes *every* 'a' an 'a', when they share no measurable features, depend entirely on their neighbours, and a perfect local copy can fail? Not *how* we draw it, not *which* is best... what *is* the 'a'-ness?"** WRITE THE QUESTION BIG: **"What makes every 'a' an 'a'?"**
  9.  **(60-70 min) Defusing Mysticism & Psychology:** A student might dismiss this as "just what people recognize" **(Misconception 4)**. Counter: **"If it's *only* psychology, why can't the counterfeit work? Readers *would* recognize it alone! Why can't we smoothly morph Bodoni to single-storey? Readers *do* recognize both! The system imposes constraints *beyond* individual recognition. Your job isn't just making marks readers *can* name, but marks that *function* within a specific visual ecosystem."** *Pre-empts Misconception 4.*
  10. **(70-75 min) Diagnostic Task & Refusal:** Hand out paper. Task: **"Draw THREE different 'a's that could *never* coexist in the same functional typeface. Explain *why* they couldn't coexist in one system."**
      *   **Landed Answer:** Demonstrates understanding of *contrast budget* and system conflict. E.g., Two 'a's too similar to each other or to other letters (like 'o' or 'd') within the *same* stylistic language; an 'a' whose structure destroys necessary distinctions for neighbours. Explanation focuses on systemic clashes, not just style differences.
      *   **Fluent but Empty Answer:** Draws wildly different styles (Blackletter, Script, Sans) but explanation is "they look different" or "different genres". Misses the *functional conflict within a single system*.
      *   **Refusal:** During Q&A, if asked about philosophy/history/psych: **"That's vital territory, but today's question sits *before* all that: the designer's immediate problem of binding a specific shape to a specific role within a system, where neither physics nor psychology gives a complete answer. We're mapping the gap you *design* within."** (Marks it as a deliberate boundary).

  **Why Counterfeit Carries It:**
  *   **Embodies All Concepts:** It's a shape within the latitude of 'a', it violates the contrast budget with its neighbours, and its failure proves the insufficiency of local features.
  *   **Creates Maximum Tension:** It *looks* right alone but *feels* wrong in context. This dissonance perfectly mirrors the core question.
  *   **Concrete & Memorable:** A single, tangible object students can point to.
  *   **Pre-empts Key Misconceptions:** Directly counters Feature Checklist and Ideal Form. Sets up Systemic Dependence.

  **Why Not Your Other Candidates:**
  *   *Orphan Sort:* Excellent starter to induce confusion and hint at the system, but doesn't *directly* force the 'a'-ness question. Better as setup.
  *   *Bodoni/Futura:* Essential for showing latitude, but risks reinforcing Ideal Form if presented alone ("both are approximations of some platonic a") and doesn't demonstrate the *system* breaking (Counterfeit does).
  *   *Squint/Blur:* Useful for *legibility*, but tangential to *identity*. A blurry 'a' is still an 'a'; the counterfeit is sharp and wrong.
  *   *Draw from Memory:* Focuses on *recall/execution*, not *identity*. Might reinforce feature checklist thinking.

  **Misconception Sequence & Pre-emption Points:**
  1.  **Feature Checklist (Misconception 1):** Arises immediately when comparing Bodoni/Futura/single-storey (Step 3). *Pre-empted* by forcing students to list and then discard specific features.
  2.  **Ideal Form (Misconception 3):** Arises when seeing historical variants or when trying to define "best" (Step 3/4). *Pre-empted* by Step 6 (Counterfeit) – showing a "perfect" local form fails systemically. The disconnect (Step 4) also undermines a single ideal.
  3.  **Arbitrary Convention (Misconception 2):** Arises when the disconnect of latitude sinks in ("If no common core, it's arbitrary!") (Step 4/7). *Pre-empted* by Step 5 (Neighbourhood Watch) establishing functional constraints *before* the disconnect fully lands, and decisively crushed by Step 7 (Swapping Consequence).
  4.  **Recognition Mysticism (Misconception 4):** Arises as a dismissal when the system feels vague ("It's just what people see!") (Step 8/9). *Pre-empted* by Step 6 (Counterfeit proving recognition isn't enough) and countered explicitly in Step 9.

  **The Hinge (Disconnect -> Convention):** To prevent collapse into "mere convention," the **Contrast Budget (System Dependence)** *must* be established **before** the disconnect of latitude is fully explored. Steps 5 (Neighbourhood Watch) and crucially **Step 6 (Counterfeit)** achieve this. The Counterfeit specifically demonstrates that *even if* the shape is conventional/local-perfect, systemic failure occurs, proving there's a *functional* constraint beyond arbitrary naming. The swapping exercise (Step 7) then hammers this home. The system isn't *just* convention; it's a functional requirement for distinction.

  This plan forces engagement with the irreducible tension at the heart of letterform design. The counterfeit is the keystone holding the arch together. The diagnostic task reveals if they grasp the systemic constraint or just parrot the phrase. Good luck!
