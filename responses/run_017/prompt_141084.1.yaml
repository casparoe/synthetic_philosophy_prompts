  ### **Limitations and Failure Modes**  
  The procedure is robust but imperfect:  
  1. **Systematic Biases:**  
     - **Articulate spokespeople:** Test 1 (Own-Gain) and Test 6 (Absent Parties) are vulnerable to persuasion. *Mitigation:* Staff provide objective NCO data to anchor discussions.  
     - **Symbolic concessions:** Test 3 (Reverse-Package) minimizes this by isolating low-cost trades, but if a party inflates symbolic costs (e.g., ministry equating branding with "sin"), Test 1 may fail prematurely.  
     - **Values with low concession costs:** Parties whose values are cheap to satisfy (e.g., health department’s neutrality) may gain leverage. *Mitigation:* Test 4 (Ratchet) forces consideration of long-term costs.  

  2. **Procedural Gaps:**  
     - **Information asymmetry:** Relies on staff for data. If staff are biased, Tests 0/1 misfire.  
     - **Repeat play:** Test 4 (Ratchet) ensures short-term trades don’t set bad precedents, but members may underweight future risks in time-pressed sessions.  
     - **Absent parties:** Test 6 relies on board empathy; marginalized groups (e.g., homeless) may still be overlooked.  

  3. **When It Misfires:**  
     - **False negatives:** May reject beneficial compromises if one member overstates costs (e.g., ministry blocking Proposal 1 on branding despite modularization potential).  
     - **False positives:** May approve harmful trades if Test 6 (Absent Parties) is gamed (e.g., downplaying client coercion risks).  
     - **Edge cases:** Fails when values are incommensurable (e.g., ministry’s "sin" vs. harm-reduction’s "autonomy"), but Test 2 (Modularization) mitigates this.  

  **Overall:** The procedure is strongest when concessions are material (e.g., resources, actions) and weakest when conflicts are purely symbolic or when staff data is poor. It prioritizes unanimity to preserve coalition integrity, but this risks deadlock—though the NCO baseline incentivizes compromise. Use staff rigorously for objectivity, and document all reasoning for transparency.
