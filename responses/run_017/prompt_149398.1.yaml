prompt: |-
  I sit on the grantmaking committee of a small foundation with a fixed five-year payout and a mandate to spend it down. We have been ranking causes with the importance / tractability / neglectedness framework, scoring each cause as the product of the three factors. A colleague now argues that cause selection is really like venture capital: importance is market size, tractability is whether the problem is solvable at all, neglectedness is that no one else is in the space — and in venture capital you do not concentrate everything on the best-evidenced company. You take many shots at power-law returns, you expect most of them to fail, and you treat other investors piling in as confirmation rather than a reason to stay out. From this he draws three conclusions: (i) we should abandon ranking by the ITN product and instead spread many small grants across speculative causes; (ii) we should read crowding as a positive signal; (iii) we should replace multiplication with a lexicographic or maximin rule, since a single near-zero factor (a tractability estimate of 1 percent, say) swamps any importance score.

  Please audit the analogy. Give me the correspondence table — what plays the role of market size, of product–market fit, of the exit, of follow-on rounds, of the limited partners, of the fund's fixed life, of the power-law return distribution — and then separate the disanalogies that matter for his three conclusions from the ones that do not. I have in mind the absence of anything like a price signal or a hard market test, feedback lags measured in decades or never, the fact that philanthropic returns are non-rival and not appropriable by the funder, and the fact that a cause can be neglected for reasons that are themselves evidence of intractability. For each of (i), (ii), and (iii), say whether it survives once the disanalogies are on the table, or whether the analogy was carrying it. Finally: is multiplication even the right functional form, or does a marginal-value-per-dollar framing, in which neglectedness enters only through the price of progress, do the same work? And if the venture analogy fails, what comparison would serve better?
reasoning: |-
  Hmm, the user is part of a grantmaking committee for a spend-down foundation and they're dealing with a colleague's argument that they should adopt a venture capital (VC) model for their philanthropy. The colleague is suggesting three major changes: abandoning their current ITN (Importance/Tractability/Neglectedness) scoring framework, viewing crowding as positive, and changing how they combine these factors. The user wants me to critically evaluate this analogy.

  I need to start by mapping the VC-philanthropy analogy properly. Market size in VC corresponds to importance in philanthropy - both represent potential impact scale. Product-market fit is like tractability - can the solution actually work? The exit or IPO in VC is the systemic change or problem reduction in philanthropy. Follow-on rounds would be scaling phases after proof-of-concept. Limited partners are like the foundation's donors or mandate-setters. The fund's fixed life is similar to their spend-down requirement. Power-law returns translate to a few grants achieving massive impact while most fail.

  But there are crucial differences that undermine the analogy. In philanthropy, there's no price mechanism to signal value - grants don't face market tests. Feedback loops are extremely slow - we might not know if a grant worked for decades. Philanthropic impact is non-rival - my success doesn't prevent yours. And neglect might signal intractability rather than opportunity - unlike in VC where an uncrowded space is purely positive.

  Now examining the colleague's three recommendations in light of these disanalogies:

  For (i) spreading small grants widely - this partially survives but needs adjustment. While diversification makes sense for high-risk areas, we shouldn't abandon evidence entirely. The absence of fast feedback means we need some evidence-based concentration.

  For (ii) seeing crowding as positive - this largely fails. Without price signals, crowding might just indicate bandwagon effects rather than validation. We should consider whether new funders bring complementary skills or just duplication.

  For (iii) replacing multiplication with lexicographic rules - this doesn't hold up. Multiplication actually makes sense because tractability acts as a probability multiplier for impact. A maximin approach would be too restrictive.

  The user also asks about the functional form - multiplication is indeed appropriate because tractability scales the expected value of important causes. Marginal value per dollar is a better framing where neglectedness acts as a "progress cost" reducer.

  A better analogy might be early-stage scientific research funding (like ARPA models) or portfolio approaches in global development. These recognize the need for diversification while accounting for long time horizons and the importance of evidence.

  I should emphasize that for a spend-down foundation with limited time, they need to balance high-risk bets with some investments that have clearer pathways to impact within their timeframe. The VC analogy is seductive but ultimately misleading for philanthropy due to these fundamental differences in how impact is created and measured.
answer: |-
  Below is a systematic audit of the venture capital (VC) analogy, followed by an evaluation of your colleague's three conclusions, and recommendations for improved frameworks. The core issue is that **philanthropy lacks VC's market signals, appropriability, and feedback loops**, critically undermining the analogy.

  ---

  ### **Correspondence Table: VC vs. Philanthropy**
  | **VC Concept**          | **Philanthropy Analog**                     | **Key Differences**                                                                 |
  |--------------------------|---------------------------------------------|-------------------------------------------------------------------------------------|
  | **Market Size**          | *Importance* (scale of suffering/benefit) | No monetization; value is intrinsic, not revenue.                                   |
  | **Product-Market Fit**   | *Tractability* (solvability)               | No market validation; "fit" is theoretical, not tested by customers.               |
  | **Exit (IPO/Acquisition)** | *Systemic change* (e.g., policy shift, tech adoption) | No financial return; success is non-appropriable and non-rival.                   |
  | **Follow-on Rounds**     | *Scaling phase* (e.g., government adoption) | Funders may free-ride; no ownership stake to incentivize follow-on.              |
  | **Limited Partners (LPs)** | *Donors/trust mandate*                     | LPs seek financial returns; donors seek impact (no direct "return").             |
  | **Fund's Fixed Life**    | *Spend-down mandate*                       | Similar constraint, but VC reinvests profits; philanthropy exhausts principal.   |
  | **Power-Law Returns**    | *Power-law impact* (few grants drive most change) | Plausible, but impact is unmeasurable and non-appropriable.                     |
  | **Crowding**             | *Other funders entering the cause*          | In VC, signals validation; in philanthropy, may signal duplication or herd bias. |

  ---

  ### **Critical Disanalogies & Their Implications**
  1. **No Price Signals/Hard Market Tests**  
     - VC relies on prices to signal value (e.g., customer demand, exit valuations). Philanthropy lacks this; "demand" is inferred, not revealed.  
     - **Implication**: Crowding ≠ validation. It may reflect ideological trends or lobbying, not efficacy.  

  2. **Feedback Lags (Decades/Never)**  
     - VC gets feedback in 5–10 years via exits; philanthropy may wait decades for causal evidence (e.g., poverty reduction).  
     - **Implication**: "Many small bets" risks funding perpetually unproven interventions with no accountability.  

  3. **Non-Rival, Non-Appropriable Returns**  
     - VC captures financial returns; philanthropy’s impact is a public good. If you solve a problem, others benefit freely.  
     - **Implication**: No incentive to "enter early" – free-rider problems may *reward* waiting for others to de-risk causes.  

  4. **Neglect as Evidence of Intractability**  
     - In VC, neglect may signal opportunity; in philanthropy, it may mean the problem is insoluble (e.g., aging) or politically toxic.  
     - **Implication**: Blindly funding neglected areas could waste resources on "moonshots" with near-zero tractability.  

  ---

  ### **Evaluation of Colleague's Conclusions**
  | **Conclusion** | **Survives?** | **Reason** |
  |----------------|---------------|------------|
  | **(i) Spread many small grants across speculative causes** | **Partially** | Diversification *is* wise for high-risk causes, but **not without evidence thresholds**. VC invests in teams with track records; philanthropy should require mechanistic plausibility (e.g., basic science). Without feedback loops, "spray and pray" risks funding pseudoscience. |
  | **(ii) Treat crowding as a positive signal** | **No** | Crowding in VC signals market validation; in philanthropy, it often signals **coordination failures** (e.g., 3 NGOs doing identical work) or status competitions. Only positive if funders bring complementary strengths (e.g., tech + advocacy). |
  | **(iii) Replace multiplication with lexicographic/maximin rules** | **No** | Multiplication correctly weights tractability as a probability lever. A lexicographic rule (e.g., "only maximize neglectedness") could fund intractable causes. Maximin ("maximize the weakest factor") ignores tradeoffs. Near-zero tractability *should* veto investment – $1M toward a 1%-tractable problem wastes $990K. |

  ---

  ### **Is Multiplication the Right Functional Form?**
  **Yes, but with a marginal-value framing**:  
  - The ITN product (I × T × N) approximates **expected value per dollar** if:  
    - `Importance (I)` = Total benefit if solved.  
    - `Tractability (T)` = Probability of success per dollar.  
    - `Neglectedness (N)` = Inverse of current funding (≈ 1 / "progress cost").  
  - **Marginal value** = ΔImpact / Δ$ ≈ I × T × (1 / current funding).  
    - Here, neglectedness enters via the *cost-effectiveness* of additional funding.  
  - **Why this works**:  
    - Highly funded causes face diminishing returns (e.g., malaria bed nets).  
    - Neglected causes offer cheap marginal progress (e.g., new policy advocacy).  
  - **Multiplication still rules**: A 10× more important cause with 0.1× tractability has equal expected value. Lexicographic rules ignore this tradeoff.  

  ---

  ### **Better Analogies than Venture Capital**
  1. **Portfolio Theory in Public R&D** (e.g., ARPA-E, Gates Foundation):  
     - Mix of "safe" bets (e.g., vaccine delivery) + high-risk moonshots (e.g., fusion energy).  
     - Uses **stage-gates**: Defund projects lacking interim evidence.  

  2. **Global Development S-Curves**:  
     - Problems have **adoption lifecycles**:  
       - *Neglected*: Low-hanging fruit (high marginal value).  
       - *Crowded*: Focus on coordination to avoid duplication.  
       - *Mature*: Shift to governments (e.g., conditional cash transfers).  

  3. **Exploration vs. Exploitation (Multi-Armed Bandit)**:  
     - Allocate funds between:  
       - *Exploitation*: High-evidence causes (e.g., deworming).  
       - *Exploration*: Speculative causes with learning value (e.g., AI alignment).  

  ---

  ### **Recommendations for Your Foundation**
  1. **Adopt a Portfolio Approach**:  
     - Allocate 70% to ITN-optimized grants (prioritizing neglected, tractable importance).  
     - Allocate 30% to speculative bets **with rigorous theory of change and learning milestones**.  

  2. **Reframe Neglectedness**:  
     - Use `1 / (current funding + $1)` to estimate marginal value. Avoid causes where neglect stems from intractability (e.g., perpetual motion machines).  

  3. **Treat Crowding Neutrally**:  
     - Crowding is a **coordination problem**, not a signal. Join funder coalitions (e.g., ClimateWorks) to share due diligence and avoid duplication.  

  4. **Require Tractability Floor**:  
     - Reject causes with <10% tractability (e.g., via expert Delphi surveys) unless importance is catastrophic (e.g., asteroid defense).  

  5. **Build Feedback Loops**:  
     - Fund interim metrics (e.g., policy shifts, tech prototypes) to enable stage-gated funding.  

  The VC analogy fails because philanthropy lacks capitalism's built-in Darwinism. **Your advantage is patience and tolerance for non-financial risk** – use it to fund what markets won't, but anchor in evidence, not Silicon Valley folklore.
