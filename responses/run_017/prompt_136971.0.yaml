answer: |-
  **Statutory Guidance: Outside View Compliance (Grant Applications)**
  **Issued under Section 9(2) of the Epistemic Responsibility Act 2023**
  **Office for Epistemic Modesty (OEM), Outside View Compliance Unit (OVCU)**
  **OVCU-GUID-007 Rev. 4.2**

  **1. Introduction**
  1.1. This guidance outlines the requirements for the Outside View Statement (OVS), mandated for all applications exceeding £5,000 under the Community Ventures Fund (CVF) and associated schemes.
  1.2. The OVS compels applicants to contextualise projected outcomes within the historical performance of comparable enterprises ("Reference Class"), thereby mitigating the Planning Fallacy (see Annex A: Cognitive Biases in Projection).
  1.3. Failure to submit a compliant OVS will render the application invalid.

  **2. Core Principle: The Outside View**
  2.1. The "Inside View" entails case-specific reasoning (e.g., unique skills, local demand, novel features). This is inherently vulnerable to optimism bias.
  2.2. The "Outside View" requires grounding expectations in the aggregate outcomes of *similar past endeavours*, known as the Base Rate.
  2.3. The OVS must demonstrably prioritise the Outside View. Inside View elements may supplement, but *never displace*, Reference Class analysis.

  **3. Defining the Reference Class (Clause 4: Appropriate Comparators)**
  3.1. The applicant shall identify a statistically robust Reference Class of past enterprises sharing *key characteristics* with the proposed venture.
  3.2. **Key Characteristics:** Must include:
      *   **Sectoral Focus:** (e.g., Retail, Service, Manufacturing, Community Asset).
      *   **Primary Activity:** (e.g., Bicycle Repair, Food Retail, Creative Workshop).
      *   **Funding Scale:** Initial grant/capitalisation band (±25% of requested amount).
      *   **Organisational Structure:** (e.g., CIC, Unincorporated Association, Sole Trader).
      *   **Geographic Context:** Urban/Rural/Semi-urban classification.
  3.3. **Granularity & Robustness:**
      3.3.1. The Class must contain *no fewer than 20* historical instances for Base Rate calculation to be deemed statistically meaningful (OVCU Standard SD-MIN-20).
      3.3.2. **The Granularity Paradox (Clause 4.2):** Applicants must avoid:
          *   *Excessive Broadness:* Classes so large (e.g., "All UK SMEs") that the Base Rate becomes uninformative for the specific case.
          *   *Excessive Narrowness:* Classes defined by unique features (e.g., "Bike workshops in coastal towns run by left-handed potters") that reduce *n* to 1, replicating the Inside View and yielding a meaningless 100% success/failure rate.
      3.3.3. **Resolution:** The chosen Class must represent the most *proximate comparators* available while satisfying SD-MIN-20. Justification for Class selection is mandatory.

  **4. Calculating and Applying the Base Rate (Clause 5: Statistical Modesty)**
  4.1. The Base Rate is defined as the proportion of ventures within the chosen Reference Class achieving *operational sustainability* at 36 months. OVCU datasets (OVCU-REFCLASS-DB) provide authorised rates.
  4.2. The applicant's projected probability of success (e.g., "80% chance of sustainability at 36 months") must fall within the 90% Confidence Interval of the Reference Class Base Rate. **Example:** If Base Rate = 40% (CI: 32%-48%), applicant projections must lie between 32% and 48%.
  4.3. **The Modesty Return (Clause 5.3):** Where applicant Inside View reasoning suggests outperforming the Base Rate, the final projected probability submitted *must not exceed the upper bound* of the Base Rate CI. Aspiration is not evidence.

  **5. Zero-Class Declarations (Clause 6: Unprecedented Ventures)**
  5.1. If an applicant asserts their venture is genuinely unprecedented, rendering a valid Reference Class (SD-MIN-20 compliant) non-existent, they may file a **Form ZCD-1: Zero-Class Declaration**.
  5.2. **Approved Meta-Class:** Where a Form ZCD-1 is accepted, the mandated Reference Class becomes: **"Ventures whose promoters formally declared them unprecedented via Form ZCD-1."**
  5.3. The historical Base Rate for this Meta-Class is 18% sustainability at 36 months (OVCU Dataset META-ZCD-001, *n* = 215, CI: 14%-22%). Applicants must use this rate and CI for projection purposes.

  **6. Preventing Reference Class Laundering (Clause 7: Anti-Gaming Measures)**
  6.1. "Reference Class Laundering" (RCL) occurs when an applicant manipulates Class definition (e.g., cherry-picking high-success sub-classes, ignoring critical failure factors) to secure a flattering Base Rate.
  6.2. OVCU Assessors are empowered to:
      6.2.1. Reject proposed Reference Classes deemed non-compliant with Clause 4.2 (Granularity Paradox).
      6.2.2. Substitute an OVCU-defined Class based on core characteristics (Sector, Activity, Scale, Structure, Geography).
      6.2.3. Investigate Class justifications for signs of motivated reasoning.
  6.3. **The Enforcement Paradox (Clause 7.4 Note):** Assessors determining the "correct" Class for a *specific* application unavoidably engage in Inside View judgement. This is a necessary compromise to uphold the Outside View regime. Assessors must document their reasoning using the OVCU Proximate Comparator Checklist (Form PCC-2).

  **7. Uncertainty Band Declaration (Clause 8: Expressing Doubt)**
  7.1. Applicants must declare the 90% Confidence Interval for their requested funding amount, reflecting inherent uncertainty. This is submitted via **Field UB-1** on the OVS Cover Sheet (Annex B).
      *   *Field UB-1 Example:* "Total Funding Required: £15,000 (90% CI: £11,250 - £23,700)"
      *   *Character Limit:* 50 characters (e.g., "£15000 (CI £11250-£23700)").
  7.2. Despite Clause 8.1, the *specific amount requested* for funding decisions remains the single figure stated in the main application (CVF-SEC-1). The CI is for epistemic transparency only.

  **8. Worked Example: Assessment of Application CVF-2024-BX287 (Project "VeloHub")**
  *   **Proposal:** Community bicycle workshop & repair training centre. Urban location. CIC structure. Request: £18,000.
  *   **Applicant's OVS:**
      *   *Proposed Reference Class:* "Community bicycle workshops in UK cities 2015-2023" (*n*=32). *Base Rate:* 28% sustainable at 36mo (CI: 18%-38%).
      *   *Projection:* "VeloHub projects 35% probability of sustainability, citing strong local partnerships (Inside View supplement)."
      *   *UB-1:* "£18000 (CI £13500-£27000)"
  *   **OVCU Assessment:**
      *   Class definition broadly compliant (Sector: Service; Activity: Bicycle Repair; Scale: Matched band £14k-£22k; Structure: CIC; Geography: Urban). *n*>20.
      *   Projection (35%) falls within CI (18%-38%). Compliant with Clause 5.
      *   UB-1 formatted correctly. CI range plausible.
      *   **Decision:** OVS ACCEPTED. *Note:* Applicant's Inside View arguments noted but did not inflate projection beyond upper CI bound (Modesty Return applied correctly).

  **9. Second-Order Base Rates & Regime Credibility**
  9.1. A legitimate inquiry concerns the historical success rate of projects *approved* under the OVS regime ("Second-Order Base Rate").
  9.2. OVCU monitoring data indicates the sustainability rate for OVS-compliant projects approved for funding is 47% at 36 months (Dataset OVCU-POSTAPP-002, *n* = 1,842, CI: 45%-49%).
  9.3. This exceeds the mean first-order Base Rate of approved applications (41%) and the overall CVF pre-OVS historical rate (33%). This suggests the regime identifies projects with *relatively* better prospects, though substantial uncertainty remains inherent.<sup>1</sup>

  **10. Stakeholder Feedback (Excerpt)**
  *"It's killed genuine innovation. My nanopore sensor could have revolutionised water quality monitoring, but OVCU shoved it into 'Environmental Tech Start-Ups' – Base Rate 12%. When I argued it was unprecedented (it was!), they used that damned ZCD class – 18%. Banks saw the OVS and ran. The Unit isn't assessing* my *project, it's assessing ghosts of failures past. The only 'ventures' thriving now are bland clones of things that barely worked before."* — Dr. Aris Thorne, Founder, AquaNex Ltd. (Interview, *The Engineer*, 18/03/2025).

  **Annex A:** Cognitive Biases in Projection
  **Annex B:** OVS Cover Sheet (Including Field UB-1)
  **Annex C:** OVCU Reference Class Database Access Guide

  ---
  **Footnotes:**
  1.  <sup>**The Self-Undermining Confidence Interval:**</sup> The 90% CI for the Second-Order Base Rate (45%-49%) does *not* overlap with the 50% threshold often perceived as denoting a "more likely than not" chance of success. This statistically reinforces the mandated modesty inherent in the OVS regime itself, while simultaneously providing a meta-justification for its continuation (i.e., performance is better than the pre-regime baseline, albeit still below intuitive desirability).

  ---
  **OVCU Guidance Note:** This document embodies the Outside View principle, being based solely on the analysis of past regulatory guidance efficacy (Base Rate: 68% comprehensibility on first reading, CI: 62%-74%).
