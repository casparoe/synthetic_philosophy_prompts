  I was reading a popular book on the history of AI last week (I think it was called something like *Machines That Think*? I cant remember), and it had a paragraph on Turing’s views on extrasensory perception that I can’t stop thinking about. A friend who leant me the book said the author is usually reliable, but this bit set off my baloney detector — I’m inclined to think Turing was too rigorous to be a closet parapsychology guy, but I dont know enough about the 1950 paper to say where the summary goes wrong. Can you audit it for me?

  Here is the passage, more or less as I remember it (I’m reconstructing it, so the wording is mine, not the book’s exact prose, obviously):

  "In the part of his 1950 paper Computing Machinery and Intelligence where he runs through objections to the imitation game, Turing treats extrasensory perception as a serious headache. He says the evidence for telepathy is too strong for an honest scientist to just dismiss, and he worries that a machine could win the game by telepathically reading the interrogator’s mind instead of by thinking for itself. His fix is to say the test ought to be run in a telepathy-proof room, so that mind-reading can’t be used to cheat. The author then concludes that Turing was basically a closet parapsychologist: he thought ESP was real enough that, unless we actually build these telepathy-proof rooms, the Turing test tells us nothing about machine intelligence, and the whole episode shows how shaky the behaviorist foundations of AI really are."

  Please go through it claim by claim. I dont want verbatim quotes from Turing’s paper or any citations / further reading — I just want your own paraphrase of the gist (my memory of exact wording is useless anyway). I’d like your reply organized with these sections, in this order:

  - "What the summary gets right" — about two short paragraphs.
  - "Where it slides or overstates" — about three short paragraphs; for this part please go claim by claim and tell me which sentences are fair, which are half-fair, and which are unfair, and why.
  - "What Turing is actually doing" — about two paragraphs on the real shape of the extrasensory-perception objection and the telepathy-proof-room reply, and on what he was and wasn’t conceding (e.g., was he admitting ESP is real? was he saying the test is worthless? was he a behaviorist?).
  - "Does the author’s conclusion follow?" — one or two paragraphs on whether the corrected summary still supports the claim that the Turing test is fragile or that Turing was sympathetic to parapsychology.
  - "My takeaway" — a few sentences on what I should actually tell my friend and what to trust in the book.
