prompt: |-
  Hey — quick context before the actual question: I'm helping out (volunteering, not my day job) with a city housing agency that's building a model to rank applicants for a really scarce rental-assistance program, so what actually matters isn't the risk score as such, it's just the top ~200 slots on the list. The thing we're predicting is whether someone re-enters homelessness within a year, and of course getting the assistance changes that outcome, so we never observe what would have happened to the people we do help. A colleague on the team and I have been arguing about which fairness criteria we can even coherently state here, and I keep failing to articulate a distinction that I think is doing all the work.

  I know the familiar impossibility results in outline: if the groups have different base rates and the predictor isn't perfect, you can't have both a score that means what it says within each group and equal false positive and false negative rates across groups. What I can't figure out is whether that conflict is really about the *pair* of criteria or about the *variable you condition on*. My colleague proposed a criterion we've been calling matched-record error parity: for any two applicants who look identical on every recorded feature except group membership, the model's error rate conditional on that shared feature vector should be the same across groups. So it conditions on the features, not on the true outcome and not on the score. I'd love an explanation of three things, and please just reason it out — I can't get to a library and I don't want citations or a reading list, I want the machinery.

  First: what is the mathematical content of these impossibility results, really? Is it a statement that the joint distribution can't simultaneously satisfy two constraints, or is it a case where two rival normative demands just happen to be expressible as distributional constraints, so that the "impossibility" is doing less work than it sounds like? I've never been sure whether to read these theorems as bad news about the world or as a taxonomy of things you can't want at once. Second: where does my colleague's criterion sit relative to the usual ones — is it secretly equalized odds in a costume, or is it independent, and does it collide with calibration-by-group for the same reason or a different one? Third, and this is the bit I care most about: I have a hunch that the whole thing turns on how fine-grained the conditioning set is. If the feature vector is very coarse the criterion seems to collapse back into something like the ordinary equalized-odds story, and if it's fine enough that you essentially never observe two people with the same features in different groups, it starts to look vacuous — unfalsifiable from data, or trivially satisfiable. Is that the right shape of the dial, and does the conflict get stronger or weaker as you turn it? And does any of this change in our top-k setting, where only behavior near the cutoff matters and where the outcome we're scoring against is partly caused by the decision itself, so the "base rates" the theorems talk about aren't even a fixed quantity but depend on which policy we run?
reasoning: |-
  We are dealing with a complex scenario involving fairness in algorithmic decision-making, specifically for a rental-assistance program. The goal is to rank applicants and select the top ~200 for assistance. The outcome to predict is whether someone re-enters homelessness within a year, but note that the assistance itself affects the outcome (so we have an intervention that changes the outcome).

  The main question revolves around fairness criteria and the impossibility results. Let's break down the three parts.

  ### 1. Mathematical Content of Impossibility Results
  The classic impossibility result (by Kleinberg, Chouldechova, and others) states that, except in degenerate cases, you cannot simultaneously satisfy the following three criteria:
  - **Calibration by group** (also called "test-fairness"): For any predicted probability score, the proportion of positive outcomes should be the same across groups. Formally, for a score `s`, `P(Y=1 | S=s, A=a) = s` for each group `a`.
  - **Equalized odds** (or "error rate balance"): The false positive rate (FPR) and false negative rate (FNR) are equal across groups. That is, for groups `a` and `b`:
    - `P(S>=t | Y=0, A=a) = P(S>=t | Y=0, A=b)` (FPR equality)
    - `P(S<t | Y=1, A=a) = P(S<t | Y=1, A=b)` (FNR equality) for a threshold `t`.
  - **Predictive parity** (or "outcome test"): The positive predictive value (PPV) and negative predictive value (NPV) are equal across groups. That is, for groups `a` and `b`:
    - `P(Y=1 | S>=t, A=a) = P(Y=1 | S>=t, A=b)` (PPV equality)
    - `P(Y=0 | S<t, A=a) = P(Y=0 | S<t, A=b)` (NPV equality)

  The impossibility arises when the base rates (the actual prevalence of the outcome) differ across groups. That is, if `P(Y=1 | A=a) != P(Y=1 | A=b)`, then it's impossible to have all three of the above conditions simultaneously.

  **What is the conflict?** The conflict is between these three desirable properties. Specifically, if the base rates are different, then:
  - Calibration by group and equalized odds together imply that the base rates must be equal (which they are not).
  - Calibration by group and predictive parity together also imply that the base rates must be equal.
  - Equalized odds and predictive parity together are compatible only if the predictor is perfect or the base rates are equal.

  So the mathematical content is that the joint distribution of (Y, S, A) cannot satisfy any two of these three conditions (unless base rates are equal or the predictor is perfect). It's a statement about the constraints on the joint distribution.

  **Interpretation**: The impossibility is a mathematical fact about the constraints. It tells us that we cannot have all the desirable properties at once. Therefore, it forces a trade-off. It's bad news in the sense that we have to choose which properties to prioritize, but it's also a taxonomy of what we can't have simultaneously.

  ### 2. Colleague's Criterion: Matched-Record Error Parity
  The criterion proposed by your colleague is: for any two applicants who share the same feature vector `X` (except group membership), the model's error rate conditional on `X` should be the same across groups. Formally, for a fixed feature vector `x` (which does not include group membership), we require:
  ```
  P(Y != Y_hat | X=x, A=a) = P(Y != Y_hat | X=x, A=b)
  ```
  for groups `a` and `b`. Note that `Y_hat` is the model's prediction (which might be a binary decision or a score thresholded at some point). However, in your setting, the model outputs a score that is used for ranking, so we might need to think about the error in terms of the score and the true outcome.

  But note: the error rate conditional on `X` being the same for both groups is a very strong condition. It says that for every feature vector, the probability of error is the same regardless of group. This is equivalent to requiring that the model has equal accuracy for every feature vector across groups.

  **Relation to known criteria**:
  - This is not the same as equalized odds. Equalized odds conditions on the true outcome and requires that the model's predictions are independent of group given the true outcome. Matched-record error parity conditions on the features and requires that the error rate (which depends on both the prediction and the true outcome) is independent of group given the features.
  - It is also not the same as calibration by group. Calibration conditions on the score and requires that the expected outcome given the score equals the score and is the same across groups.

  In fact, the matched-record error parity condition is a form of **accuracy equality** at the level of individual feature vectors. It is a very strong condition because it must hold for every `x`.

  **Collision with calibration-by-group**: 
  Suppose we have calibration by group. Then, for a given score `s`, the expected outcome is `s` and the same for both groups. However, the matched-record error parity condition conditions on `X` (the features) and not on the score. The score `S` is a function of `X` (and possibly group, unless we force the model to be group-blind). 

  If the model is group-blind (i.e., `S = f(X)` and does not use `A`), then for the same `x`, the score is the same. Then, the error rate at `x` is `P(Y != Y_hat | X=x)`. This error rate might vary by group even for the same `x` if the conditional distribution of `Y` given `X=x` differs by group. Why? Because the true outcome `Y` might depend on group even when `X` is fixed. For example, if there are unmeasured factors that correlate with group and affect `Y`, then even for the same `x`, the outcome distribution might differ by group.

  Therefore, to satisfy matched-record error parity, we require that for every `x`, the conditional distribution of `Y` given `X=x` and `A=a` is the same for both groups. That is, `P(Y|X=x, A=a) = P(Y|X=x, A=b)`. This is a very strong condition: it means that the feature vector `X` captures all the information about the outcome that is also correlated with group. In other words, there is no residual dependence of `Y` on group after conditioning on `X`.

  If we don't have this condition (i.e., if there is a direct effect of group on outcome even after controlling for `X`), then a group-blind model will have the same error rate only if the model is equally accurate for both groups at every `x` by chance? Actually, if the model is group-blind, then the error rate at `x` for group `a` is determined by `P(Y|X=x, A=a)` and the model prediction `f(x)`. To have the same error rate for group `b` at the same `x`, we must have that the model's prediction `f(x)` is equally accurate for both conditional distributions. This might require that the two conditional distributions (for groups `a` and `b` at `x`) are identical in terms of the error they produce for the same prediction. But this is equivalent to requiring that the conditional distributions of `Y` given `X=x, A=a` and `X=x, A=b` are identical.

  Therefore, the matched-record error parity condition is achievable only if, for every `x`, the conditional distribution of `Y` given `X=x` is the same for both groups. This is a form of **conditional outcome independence** (i.e., `Y` independent of `A` given `X`). 

  If we don't have this, then we cannot have matched-record error parity with a group-blind model. If we allow the model to use group, then we could set different thresholds by group to adjust the error rates, but note that the condition requires the same error rate for the same feature vector. So if the feature vector `x` is the same, then the prediction must be the same? Actually, the condition does not specify that the prediction must be the same. The model could, in principle, use group membership to make a prediction. Then, for a given `x`, the prediction might differ by group. In that case, we can adjust the prediction per group to achieve the same error rate. But note: the condition requires that the error rate is the same for the same `x` and group. So for a fixed `x`, we require:
  ```
  P(Y != Y_hat | X=x, A=a) = P(Y != Y_hat | X=x, A=b)
  ```
  But if the model uses group, then `Y_hat` is a function of `x` and `a` (or `x` and `b`). So we have two different predictions for the same `x` but different groups. Then, we can set:
  - For group `a`: we choose `Y_hat_a` to minimize the error rate given `P(Y|X=x, A=a)`
  - For group `b`: we choose `Y_hat_b` to minimize the error rate given `P(Y|X=x, A=b)`

  But we don't require that the predictions are the same, only that the error rates are the same. However, the condition does not require that the error rate is minimized, but only that it is equal. So we could set the same error rate by choosing appropriate predictions per group. But note: the error rate at `x` for group `a` is a function of the prediction and the true distribution. We can set it to any value between the minimum possible error and the maximum by choosing a prediction. So we can set the predictions for both groups such that the error rates are equal. However, we cannot set them arbitrarily without regard to the decision context (like the cost of false positives and false negatives). Moreover, in the context of a ranking model, we are producing a score, and the error rate might be defined for a fixed threshold.

  But in your case, the model produces a score that is used for ranking. The error rate might be defined by thresholding the score at some point. However, the condition is stated for the model's error rate. If the model produces a score and we haven't thresholded it, then we need to define what an error is. Typically, we would threshold the score to get a binary prediction. Let us assume we are using a threshold `t` to make a decision. Then the binary prediction is `I(S>=t)`. Then the error rate at `x` is:
  ```
  P(Y != I(S>=t) | X=x, A=a)
  ```
  But note: the score `S` is a function of `X` and possibly `A`. So for a fixed `x` and `a`, the score is fixed. Then, the error rate at `x` for group `a` is fixed (given the threshold) and depends on the true outcome distribution at `x` and `a`. Similarly for group `b`. So to set the same error rate, we must have:
  ```
  P(Y=0 | X=x, A=a) * I(S(x,a)>=t) + P(Y=1 | X=x, A=a) * I(S(x,a)<t) = 
  P(Y=0 | X=x, A=b) * I(S(x,b)>=t) + P(Y=1 | X=x, A=b) * I(S(x,b)<t)
  ```
  This is a very specific condition that must hold for every `x`. It is achievable by choosing the scores and the threshold appropriately, but it is very demanding because it must hold for every `x`.

  In summary, the matched-record error parity condition is a strong condition that requires the model to adjust its predictions per group and per feature vector so that the error rates are equal. It is independent of the usual criteria (calibration, equalized odds) and can be in conflict with them. For example, if we also require calibration by group, then we have an additional constraint that the score must reflect the true probability. Then, the error rate at `x` would be determined by the true distribution and the threshold. It might be impossible to satisfy both unless the conditional distributions are identical.

  ### 3. The Role of the Granularity of the Feature Vector
  You have a hunch that the criterion becomes vacuous if the feature vector is very fine-grained. Let's analyze.

  - **Coarse feature vector**: If the feature vector is coarse, then we are conditioning on a small set of features. In the extreme, if we condition on nothing, then the condition becomes: the overall error rate must be equal across groups. This is a very weak condition (and one of the least controversial group fairness criteria). But note, it doesn't require anything at the individual level.

  - **Fine-grained feature vector**: As the feature vector becomes more detailed, we are conditioning on more. In the limit, if the feature vector is so rich that for each `x`, there is at most one individual per group (or even no two individuals with the same `x` in different groups), then the condition becomes: for each individual, the model's error rate must be the same across groups. But wait: if there is only one individual per group for a given `x`, then we are requiring that for that individual, the model's error rate is the same as for the other group's individual at the same `x`. But error rate is a probability, and for an individual, the error is either 0 or 1. So we require that the model is either correct for both or wrong for both. This is very strong: it requires that for every pair of individuals (one from each group) with the same `x`, the model makes the same mistake (or same correct) pattern. But note: we cannot observe the outcome for the same individual under both group assignments. So the condition becomes untestable? Moreover, if the feature vector is so rich that it includes unique identifiers, then we are essentially requiring that the model's prediction for each individual is such that the probability of error is the same for individuals in different groups that happen to have the same features (which is rare). But also, if the feature vector is unique per individual, then the condition is vacuously true because there is no `x` that appears in both groups? Actually, no: if an `x` appears only in one group, then the condition doesn't apply (because we require the same `x` to appear in both groups). So the condition is only defined for feature vectors that appear in both groups. If no feature vector appears in both groups, then the condition is trivially satisfied (because there are no `x` that are shared). 

  Therefore, the condition becomes:
  - **Coarse `X`**: Strong condition (because we are grouping many individuals together) but might be achievable if the groups are similar in the coarse buckets.
  - **Rich `X`**: The condition becomes weaker because it only applies to the `x` that are shared between groups. If there are few shared `x`, then the condition imposes few constraints. In the extreme of no overlapping `x`, the condition imposes no constraints.

  But note: the condition requires that for every `x` that appears in both groups, the error rate is the same. So if there are overlapping `x`, then it's a constraint. But if the feature vector is very fine-grained, the overlapping set might be small.

  Moreover, the conflict with calibration-by-group: 
  - If we have calibration by group, then the score reflects the true probability. Then, the error rate at a feature vector `x` (which might be used to compute the score) would depend on the true outcome distribution at `x` and the group. If the true outcome distribution at `x` differs by group, then even with a calibrated score, the error rate at `x` will differ by group. Therefore, to have matched-record error parity, we require that the true outcome distribution at `x` is the same for both groups. This is the same as requiring that `Y` is independent of `A` given `X`.

  So the conflict is present: if the true outcome distribution given `X` differs by group, then we cannot have both calibration by group and matched-record error parity. Why? Because calibration by group requires that the score equals the true probability for each group, so if the true probability differs by group at `x`, then the score must be group-specific. But then, for a fixed `x` and two groups, the model will have two different scores. Then, when we use the same threshold to make a decision, the error rate at `x` for group `a` is determined by the group-`a` score and the group-`a` true probability, and similarly for group `b`. And unless the true probabilities are the same, the error rates will differ. Therefore, to have the same error rate, we must have the same true probability at `x` for both groups.

  So the conflict between matched-record error parity and calibration-by-group is the same as the conflict between matched-record error parity and having different true outcome distributions given `X` by group.

  ### The Top-k Setting and the Dynamic Outcome
  In your setting, you are only concerned with the top ~200 slots. This means you care about the behavior near the cutoff. The outcome (re-entering homelessness) is affected by the assistance. Therefore, the base rates for the entire population are not fixed because if we change the policy (i.e., who gets assistance), the outcome distribution changes.

  This complicates matters because the standard fairness criteria are defined for a fixed data distribution. In your case, the data distribution is endogenous to the policy.

  Specifically, the outcome `Y` for an individual is a function of whether they receive assistance. Let `Y(1)` be the outcome if assisted, and `Y(0)` if not. We only observe `Y(0)` for those not assisted and `Y(1)` for those assisted. The model is trying to predict `Y(0)` (the outcome without assistance) because we want to help those who would become homeless without assistance. But note: we never observe `Y(0)` for those we assist. So we have a problem of counterfactual prediction.

  Therefore, the base rates (for `Y(0)`) are fixed, but we have missing data for the assisted group. The fairness criteria are usually defined with respect to the true outcome that we are predicting (which is `Y(0)`). However, note that we cannot observe `Y(0)` for the assisted group. So we must use a model that is trained only on the unassisted group? Or use techniques from causal inference (e.g., using instrumental variables, or assuming unconfoundedness and using regression adjustment).

  In this context, the fairness criteria should be defined with respect to `Y(0)`. But note: we cannot observe `Y(0)` for everyone. So we have to be cautious.

  The top-k setting means that we care about the ranking near the cutoff. So the fairness criteria might be adapted to focus on the region near the cutoff. For example, we might require that the false positive rate and false negative rate (with respect to `Y(0)`) are equal across groups among those near the cutoff. But again, we cannot observe `Y(0)` for those we assist.

  Given these complications, it might be necessary to use causal inference methods to estimate `Y(0)` for everyone. Then, the fairness criteria can be applied to the predictions of `Y(0)`.

  However, the impossibility results still hold for the predictions of `Y(0)` if the base rates of `Y(0)` differ across groups. The top-k focus doesn't change the fundamental trade-offs, but it might change the relative importance of different errors (e.g., near the cutoff, false positives and false negatives might have different costs).

  ### Summary
  1. The impossibility results are about the joint distribution: you cannot simultaneously satisfy calibration, equalized odds, and predictive parity when base rates differ and the predictor is imperfect. It's a mathematical constraint on the distribution.
  2. Your colleague's criterion (matched-record error parity) is a strong condition that requires the error rate to be equal for every feature vector across groups. It is independent of the usual criteria and can be in conflict with calibration-by-group unless the true outcome distribution given the features is the same across groups.
  3. The granularity of the feature vector matters: coarse features make the condition strong and hard to satisfy, while fine-grained features make it less constraining (only applying to overlapping feature vectors) and in the extreme (no overlap) vacuous. The conflict with calibration-by-group is due to the requirement of identical conditional outcome distributions across groups for every feature vector.

  In your specific setting, the dynamic outcome (due to the intervention) and the top-k ranking add complexity. The base rates for the counterfactual outcome `Y(0)` are fixed, but the intervention changes the observed outcomes. The fairness criteria should be defined with respect to `Y(0)`, and the impossibility results still apply to predictions of `Y(0)`.
answer: |-
  ### 1. Mathematical Essence of Impossibility Results  
  The core conflict arises from **mutually incompatible distributional constraints** when base rates differ. Formally, consider:  
  - **Calibration-by-group**: \( P(Y=1 \mid S=s, A=a) = s \) for all \(s, a\)  
    (The score \(S\) reflects true probability of outcome \(Y=1\) within each group \(A\))  
  - **Equalized odds**: \( P(S \geq \tau \mid Y=0, A=a) = P(S \geq \tau \mid Y=0, A=b) \)  
    (Same false positive rate across groups)  
    and \( P(S < \tau \mid Y=1, A=a) = P(S < \tau \mid Y=1, A=b) \)  
    (Same false negative rate across groups)  

  **Impossibility theorem**: If base rates differ (\(P(Y=1 \mid A=a) \neq P(Y=1 \mid A=b)\)) and the predictor is imperfect, these constraints *cannot* hold simultaneously.  

  - **Why?**  
    Equalized odds + calibration imply:  
    \[
    P(Y=1 \mid A=a) = \mathbb{E}[S \mid A=a]
    \]  
    If base rates differ, average scores must differ, but equalized odds forces error rates to be equal despite different score distributions. This creates a contradiction.  

  - **Interpretation**:  
    This is a *mathematical constraint on joint distributions*—not just conflicting "wants." It reveals that when base rates differ, any fairness intervention involves tradeoffs between criteria. The "impossibility" is fundamental: you *must* abandon at least one criterion.  

  ---

  ### 2. Matched-Record Error Parity: Relation to Classic Criteria  
  Your colleague's criterion:  
  \[
  P(\text{error} \mid X=x, A=a) = P(\text{error} \mid X=x, A=b)  
  \]  
  for all feature vectors \(x\) (where error = \(Y \neq \hat{Y}\)).  

  #### **Key properties**:  
  - **Distinct from equalized odds**:  
    Equalized odds conditions on *true outcome \(Y\)* (e.g., \(P(\text{FP} \mid Y=0)\)). This conditions on *features \(X\)*.  
  - **Relation to calibration**:  
    - If calibrated *and* \(X\) is the only input to \(S\), then:  
      \[
      P(\text{error} \mid X=x, A=a) = P(\text{error} \mid X=x, A=b) \implies P(Y \mid X=x, A=a) = P(Y \mid X=x, A=b)
      \]  
      i.e., the *true outcome distribution given \(X\) must be group-independent*.  
    - If true \(Y \perp\!\!\!\perp A \mid X\), calibration and matched-record parity are compatible. Otherwise, they conflict.  

  #### **Collision with calibration**:  
  - **Conflict source**:  
    Calibration requires scores to reflect group-specific outcome distributions. Matched-record parity requires errors to be equal *despite* those distributions. If \(P(Y \mid X=x)\) differs by group, calibration will assign different scores to identical \(x\) in different groups, while matched-record demands equal error rates—forcing one to break.  
  - **Not "equalized odds in disguise"**:  
    Equalized odds cares about error rates *within outcome classes* (e.g., FP among \(Y=0\)). Matched-record cares about errors *within feature cells*—a different conditioning.  

  ---

  ### 3. The Granularity Dial: Coarse vs. Fine \(X\)  
  Your intuition is correct. The feasibility and strength of matched-record parity depend on feature granularity:  

  | **Feature Granularity** | **Effect on Criterion**                                  | **Conflict with Calibration** |  
  |-------------------------|----------------------------------------------------------|-------------------------------|  
  | **Coarse \(X\)**        | Few feature buckets. Forces broad error parity (similar to group fairness). Strong criterion, likely conflicts with calibration if base rates differ. | High conflict                 |  
  | **Fine \(X\)**          | Many feature buckets, few individuals per \(x\). Criterion applies only to overlapping \(x\) in both groups. Weak criterion (less constraining). | Low conflict                  |  
  | **Fully Separated \(X\)** | No \(x\) shared across groups. Criterion vacuously true (no \(x\) to compare). No conflict, but useless. | None (trivially satisfied)    |  

  #### **Mathematical mechanism**:  
  - With coarse \(X\), \(P(Y \mid X=x)\) often varies by group because \(X\) doesn't capture all group-relevant factors.  
  - With fine \(X\), \(P(Y \mid X=x, A=a)\) may still differ, but if no \(x\) overlaps groups, no constraints exist.  
  - **Conflict strength**:  
    \[
    \text{Conflict} \propto \frac{1}{|\{x: P(X=x \mid A=a)>0, P(X=x \mid A=b)>0\}|}
    \]  
    Fewer overlapping \(x\) → less conflict.  

  ---

  ### Impact of the Top-\(k\) Setting and Dynamic Outcomes  
  Your context adds two twists:  
  1. **Top-\(k\) selection**: Only ranks near the cutoff matter.  
  2. **Outcome endogeneity**: Assistance \(\rightarrow\) reduces homelessness (\(Y\)), so "true" \(Y\) is counterfactual.  

  #### **Consequences**:  
  - **Base rates are policy-dependent**:  
    The \(Y\) you predict (homelessness without assistance) has base rates *dependent on who gets help*. This breaks the fixed-base-rate assumption of classic theorems.  
  - **Fairness criteria near cutoff**:  
    For top-\(k\), focus on *calibration or error rates near the cutoff*. Matched-record parity may be feasible if \(X\) explains group differences *locally* at the cutoff.  
  - **Counterfactual calibration**:  
    To handle endogeneity, define \(Y^{(0)}\) as "homelessness if unaided." Then:  
    \[
    \text{Target: } P(Y^{(0)}=1 \mid S=s, A=a) = s
    \]  
    Matched-record parity for \(Y^{(0)}\) is possible if \(X\) captures all confounding between \(A\) and \(Y^{(0)}\).  

  #### **Does conflict change?**  
  - **Granularity still dominates**: Finer \(X\) reduces conflict, but now \(X\) must also capture *treatment effect heterogeneity* (how assistance impacts \(Y\)).  
  - **New tradeoffs**: Near the cutoff, equalized odds for \(Y^{(0)}\) may conflict with maximizing program efficiency. Matched-record parity could force inefficient decisions if groups have different risk distributions at the cutoff.  

  ---

  ### Key Takeaways  
  1. **Impossibility results** are fundamental distributional constraints—not just normative disagreements.  
  2. **Matched-record parity** is independent of equalized odds but conflicts with calibration when true \(Y \not\!\perp\!\!\!\perp A \mid X\).  
  3. **Feature granularity** is a dial:  
     - Coarse → high conflict, strong constraint  
     - Fine → low conflict, weak constraint  
  4. **Top-\(k\) + endogeneity**:  
     - Redefine fairness w.r.t. counterfactual \(Y^{(0)}\)  
     - Conflicts depend on how well \(X\) explains group differences *near the cutoff* and in treatment effects.  

  **Recommendation**: Use moderately granular \(X\) to make matched-record parity testable but meaningful. Prioritize calibration near the cutoff for efficient targeting, and accept that some fairness tradeoffs are unavoidable when base rates (of \(Y^{(0)}\)) differ.
