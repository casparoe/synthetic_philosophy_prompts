  ### Epistemology of Testimony: Position Classification Instrument  
  Below is a decision tree designed to help you classify positions in the epistemology of testimony based on your intuitive responses to concrete cases. The tree avoids theoretical vocabulary in the questions; these terms appear only in the leaves (positions) and commentary. The tree starts with a single question and branches through 8 nodes, each with 2–3 answer options. After the tree, you'll find:  
  - **Axes of Variation** defining the theoretical space.  
  - **Leaf Position Summaries** with awkward commitments.  
  - **Scoring Notes** for incoherent/mixed answer patterns.  
  - **Limitations** of the tree.  

  ---

  #### Decision Tree  
  **Start Here:**  
  1. **A stranger in a railway station tells you the time. Do you need your own independent reason (e.g., past observations about strangers or clocks) to accept this?**  
     - **Yes** → Go to Q2.  
     - **No** → Go to Q5.  

  **Reductionist Path (from Q1 "Yes"):**  
  2. **If you need your own reasons, must those reasons be things you can articulate or consciously think about (not just hidden facts)?**  
     - **Yes** → Go to Q3.  
     - **No** → *Leaf A: Externalist Process-Reliabilist View*.  
  3. **Your reasons: Can they be general (e.g., "people are usually honest") or must they target this specific speaker/domain?**  
     - **General reasons suffice** → *Leaf B: Humean Global Reductionism*.  
     - **Must be specific** → *Leaf C: Local Reductionism*.  

  **Anti-Reductionist Path (from Q1 "No"):**  
  5. **A teacher sincerely tells you a scientific claim she believes is false (she teaches a curriculum she rejects). Are you justified in believing her?**  
     - **Yes** → Go to Q6.  
     - **No** → *Leaf D: Trust/Assurance View*.  
  6. **An anonymous source with a long, independently verified track record on this topic tells you something. Are you justified in believing it?**  
     - **Yes** → Go to Q7.  
     - **No** → *Leaf E: Non-Evidentialist Entitlement View*.  
  7. **A speaker warns you they are unreliable about a topic, then tells you about it. Are you justified in believing them?**  
     - **Yes** → *Leaf F: Bare-Presumption/Default-Acceptability View*.  
     - **No** → *Leaf G: Reidian Anti-Reductionism (Basic Source)*.  

  **Transmission Path (Applies to Any Position):**  
  8. **If a speaker does not know what they are telling you, can you still gain knowledge from their testimony?**  
     - **Yes** → *Leaf H: Non-Transmissive Knowledge View*.  
     - **No** → *Leaf I: Transmissive Knowledge View*.  

  ---

  ### Axes of Variation: The Theoretical Space  
  Four axes separate the positions. Each axis represents a binary or ternary choice, creating 16 possible combinations. Below, I map occupied cells (named positions), diagnose empty cells, and note unattractive/unexplored options.  

  | Axis | Description | Options | Occupied Positions | Empty Cells (Diagnosis) |
  |------|-------------|---------|---------------------|-------------------------|
  | **1. Need for Hearer's Positive Reasons** | Must the hearer have reasons (from non-testimonial sources) to accept testimony? | Yes / No | **Yes**: Humean (B), Local (C), Externalist (A)<br>**No**: Reidian (G), Bare-Presumption (F), Entitlement (E), Assurance (D) | *None* |
  | **2. Nature of Reasons (If Yes to Axis 1)** | What must the reasons be like? | Internalist (hearer-aware) / Externalist (reliability-based) | **Internalist**: Humean (B), Local (C)<br>**Externalist**: Externalist (A) | *Internalist + Externalist*: Incoherent (reasons can't be both solely hearer-aware and hidden). |
  | **3. Scope of Reasons (If Yes to Axis 1 + Internalist)** | How targeted must internalist reasons be? | Global (general testimony) / Local (speaker/domain-specific) | **Global**: Humean (B)<br>**Local**: Local (C) | *None* |
  | **4. Basis of Acceptance (If No to Axis 1)** | Why is acceptance without reasons legitimate? | Basic Source / Entitlement / Assurance | **Basic Source**: Reidian (G)<br>**Entitlement**: Entitlement (E), Bare-Presumption (F)<br>**Assurance**: Assurance (D) | *Basic Source + Assurance*: Unattractive (assurance requires a speaker, but basic source treats testimony like perception, which doesn't).<br>*Entitlement + Basic Source*: Unexplored (entitlement doesn't require testimony to be basic). |
  | **5. Epistemic Good** | What is the focus? | Justification / Knowledge | All leaves except I/H focus on justification.<br>**Transmissive (I) / Non-Transmissive (H)** focus on knowledge. | *Justification-only + Transmission*: Unnamed (common hybrid—e.g., reductionism + transmission). |

  - **Total Possible Combinations**: 16 (2 × 2 × 2 × 3 ÷ 2, given dependencies).  
  - **Occupied Positions**: 9 (A–I).  
  - **Empty Cells**: 7 (3 incoherent, 2 unattractive, 2 unexplored).  

  ---

  ### Leaf Position Summaries and Awkward Commitments  
  **Leaf A: Externalist Process-Reliabilist View**  
  - *Position*: Justification comes from calibration with a reliable source, even if the hearer lacks access to this fact.  
  - *Awkward Commitment*: Justification can arise when the hearer has no clue about reliability (e.g., blindly trusting a source with only favorable outputs).  

  **Leaf B: Humean Global Reductionism**  
  - *Position*: Hearer needs general, internally accessible reasons (e.g., "testimony is usually reliable").  
  - *Awkward Commitment*: Circularity—reasons about testimony's reliability often rely on other testimony.  

  **Leaf C: Local Reductionism**  
  - *Position*: Hearer needs specific, internally accessible reasons about this speaker/domain.  
  - *Awkward Commitment*: Demands unrealistic research for everyday testimony (e.g., trusting a stranger).  

  **Leaf D: Trust/Assurance View**  
  - *Position*: Justification depends on the speaker taking responsibility for truth, not evidence.  
  - *Awkward Commitment*: Cannot explain anonymous or institutional testimony (e.g., a group report).  

  **Leaf E: Non-Evidentialist Entitlement View**  
  - *Position*: Acceptance is permissible without reasons, but testimony isn't a basic source; it's a default entitlement.  
  - *Awkward Commitment*: Defeaters (e.g., a warning of unreliability) undermine justification, but the default is fragile.  

  **Leaf F: Bare-Presumption/Default-Acceptability View**  
  - *Position*: Testimony is presumptively credible; no reasons needed unless countered.  
  - *Awkward Commitment*: Presumption holds even for odd sources (e.g., an AI with no track record).  

  **Leaf G: Reidian Anti-Reductionism (Basic Source)**  
  - *Position*: Testimony is a basic source of knowledge, like perception; no reduction needed.  
  - *Awkward Commitment*: Treats social acts (testimony) as on par with solitary perception.  

  **Leaf H: Non-Transmissive Knowledge View**  
  - *Position*: Knowledge can come from testimony even if the speaker lacks it (e.g., via luck).  
  - *Awkward Commitment*: Allows "knowledge" from ignorant speakers (e.g., the insincere teacher).  

  **Leaf I: Transmissive Knowledge View**  
  - *Position*: Testimony transmits knowledge only if the speaker knows.  
  - *Awkward Commitment*: Denies knowledge in high-stakes chains (e.g., 100-repeater chain) if any link lacks knowledge.  

  ---

  ### Scoring Notes for Answer Patterns  
  - **Incoherent Patterns**: Answers conflicting with core dependencies (e.g., Q1 "No" but Q5 "No" implying reasons *are* needed). Diagnose as intuition-based (not view-driven) or confused reading.  
  - **Mixed Patterns**: Answers landing between leaves (e.g., Q5 "No" (anti-assurance) but Q6 "No" (pro-entitlement)). Likely reflects case-specific intuitions, not a unified theory.  
  - **Cross-Cutting Cases Not Fully Captured**:  
    - *Chain of 100 speakers*: Cuts across transmission (Q8) and reliability (Q6). The tree separates these but can't combine them.  
    - *Speaker with reliability from your past belief*: Challenges reductionism (Axes 1–3) but isn't directly queried.  
    - *Two speakers with identical reliability (stranger vs. trusted)*: Tests assurance (Q5) but not distinguished in the tree.  
    - *Group report/LLM output*: Ambiguous for assurance (Q5) and basic source (Q7) views. The tree flags but doesn't resolve.  

  ---

  ### What This Tree Cannot Tell You  
  - **Case-by-Case Intuitions vs. Coherent Views**: The tree assumes consistent principles, but students may answer based on isolated intuitions (e.g., trusting a railway stranger but not a teacher). This doesn't imply a position—just fragmented thinking.  
  - **Hybrid Views**: Some positions blend leaves (e.g., reductionism + transmission). The tree isolates "pure" types; hybrids require manual mapping.  
  - **Depth of Understanding**: Correct classification doesn't guarantee the student grasps arguments for/against a position—only that they can navigate cases to a label.  
  - **Non-Standard Cases**: Unusual scenarios (e.g., favorable-output-only source) test externalism (A) or entitlement (E) but aren't branch nodes to avoid complexity.  

  Use this instrument to scaffold discussion, not as a definitive test. When answers diverge, probe *why*—e.g., "You said X in Q1 but Y in Q5; what principle explains both?"
