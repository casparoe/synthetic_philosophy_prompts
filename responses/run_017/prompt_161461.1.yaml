  Below is a complete handout for your reading group, centered on a quiz designed to disentangle commitments on collective mentality using Hofstadter's ant colony (Aunt Hillary) as a foundation. The quiz uses concrete scenarios to avoid direct questions about "minds," forcing participants to reveal their intuitions through cases. It includes 10 scenarios (each with 2–3 options), a logical space breakdown, named positions with awkward commitments, a scoring key, and notes on unresolved boundaries.  

  ---

  ### **Quiz: What’s Your Theory of Collective Mentality?**  
  *Inspired by Hofstadter’s Ant Fugue*  

  **Instructions**: For each scenario, pick the option that best reflects your intuition. Don’t overthink it—go with your gut. There are no right answers, only revealing ones!  

  1. **Swarm Nest Selection**  
     A swarm of ants picks a new nest site using a quorum rule: Each ant assesses only one site randomly. When enough ants gather at a site, the whole swarm moves. No ant ever compares sites.  
     - **A**: The colony *chose* the nest—it integrated information no ant had.  
     - **B**: This is just ants following simple rules—no choice was made.  
     - **C**: Useful to say the colony "chose," but it’s not literally true.  

  2. **Split-Colony Trail**  
     A colony lives in two nests connected by a chemical trail. Ants travel between them, sharing food and defending jointly.  
     - **A**: This is one colony—it acts as a single unit.  
     - **B**: These are two colonies cooperating—like allies, not one entity.  
     - **C**: It’s context-dependent; sometimes one, sometimes two.  

  3. **Fusion & Fission**  
     Two colonies merge into one coordinated unit. Months later, they split back into two distinct colonies.  
     - **A**: When fused, they became one subject; splitting created two new ones.  
     - **B**: They were always distinct subjects, even when cooperating.  
     - **C**: "Subjects" don’t apply—it’s just ants reorganizing.  

  4. **Robot Replacement**  
     Over time, ants in a colony are swapped with tiny robots mimicking ant rules (e.g., follow trails). The colony behaves identically.  
     - **A**: The colony is the same subject, with the same "mind."  
     - **B**: It’s a new thing—a hybrid/robotic system—with no continuity.  
     - **C**: There was never a subject; just parts being replaced.  

  5. **Interpreter Box**  
     A device reads the colony’s chemical state and prints "I am hungry" in English. The colony then sends out foragers, "answering" the box.  
     - **A**: The box translates real mental states; the colony "responded."  
     - **B**: The box imposes meaning; the colony just reacted chemically.  
     - **C**: The box *creates* a mind by adding language.  

  6. **Slow Decision**  
     A colony takes six hours to "decide" to migrate after a disturbance.  
     - **A**: Speed doesn’t matter—it’s still cognition.  
     - **B**: Too slow—real thinking is faster; it’s just biology.  
     - **C**: Describing it as "thinking" is useful, but not literal.  

  7. **Single-Ant Death**  
     An ant dies. The colony’s behavior is unaffected.  
     - **A**: Like a neuron dying—the colony lost a functional part.  
     - **B**: Like losing a worker bee—the colony adjusts, but it’s not akin to a brain.  
     - **C**: An individual died; the colony isn’t "harmed."  

  8. **Forest-Level System**  
     An entire forest (trees, fungi, animals) reacts to a fire with feedback loops that "regulate" recovery.  
     - **A**: The forest acts like a unified system—maybe even a "mind."  
     - **B**: It’s just parts interacting—no collective subject.  
     - **C**: Describing it as a "system" is pragmatic, but not real.  

  9. **Moral Harm**  
     A colony is destroyed painlessly. The ants die instantly.  
     - **A**: The colony itself was harmed—it lost its "life."  
     - **B**: Only the ants were harmed—the colony wasn’t a patient.  
     - **C**: Harm depends on context (e.g., if it had interests).  

  10. **Colony vs. Human Team**  
      A human team debates for hours to solve a problem. The ant colony "solves" a similar problem via decentralized rules.  
      - **A**: Both are subjects—the process doesn’t matter.  
      - **B**: The team has a mind; the colony just has efficient rules.  
      - **C**: Neither literally "thinks"—both use useful shortcuts.  

  ---

  ### **Logical Space & Positions**  
  *The quiz branches along key dimensions. Positions are mapped to the cells they occupy, with empty cells marked as incoherent (✗), unattractive (△), or unexplored (?).*  

  #### **Branching Questions**  
  1. **Individuation**: What makes a collective a single subject?  
     - Functional unity (e.g., quorum rules)?  
     - Physical continuity (e.g., trail between nests)?  
     - Persistence through change (e.g., robot replacement)?  

  2. **Integration vs. Organization**:  
     - Does integration (e.g., feedback loops) imply mentality, or is functional organization (e.g., efficient rules) sufficient?  

  3. **Time-Scale**:  
     - Does slow processing (e.g., 6-hour decision) preclude cognition?  

  4. **Mind-Intentionality-Morality Triad**: Can these come apart?  
     - Can a system be described in belief/desire terms without a mind?  
     - Can it have moral status without mentality?  
     - Can it have a mind without moral status?  

  5. **Scalability**:  
     - Does the view extend to larger systems (e.g., forest)? Requires a stopping point?  

  #### **Positions in Logical Space**  
  | Position                  | Key Commitments                                                                 | Most Awkward Commitment                                  | Empty Cells (Reason)                                                                 |
  |---------------------------|---------------------------------------------------------------------------------|----------------------------------------------------------|--------------------------------------------------------------------------------------|
  | **1. Full Realism**       | Colony is a subject with beliefs/desires. Mind emerges from integration.        | Slow decisions (6 hours) are still "thinking."           | ✗: Mind without functional organization (incoherent). △: Morality without mind (unattractive). |
  | **2. Superorganism**      | Colony is organism-like but lacks mind; intentional descriptions are instrumental. | Why isn’t it a mind if it’s organism-like?               | ✗: Morality without functional organization (incoherent). ?: Scalability to ecosystems (unexplored). |
  | **3. Pluralist Subjectivism** | Cognition is real (e.g., quorum rules), but subjects are ants—colony is not a subject. | Colony-level decisions with no ant-level awareness.      | △: Mind at ecosystem level (unattractive). ✗: Colony as subject (incoherent).         |
  | **4. Deflationary**       | "Aunt Hillary" is metaphorical; intentional talk is useful fiction.             | Why is the fiction so robust/predictive?                 | ✗: Literal mind (incoherent). △: Morality for colony (unattractive).                 |
  | **5. Constitution View**  | Mentality requires being constituted by minded parts (e.g., ants/robots must be subjects). | Colony can’t have novel mental states beyond parts.      | ✗: Mind without minded parts (incoherent). △: Forest mind (unattractive).            |
  | **6. Eliminativism**      | Only ants exist; "colony" is shorthand for aggregated parts.                    | Colony-level adaptations (e.g., nest choice) seem real.  | ✗: Collective subject (incoherent). △: Intentional descriptions (unattractive).      |
  | **7. Non-Reductive Emergentism** | Colony has novel mental properties not reducible to ants, but not a subject.    | How do properties "emerge" without a subject?            | ?: Scalability to ecosystems (unexplored). ✗: Mind without emergence (incoherent).   |

  **Empty Cells**:  
  - *Mind without organization*: Incoherent (✗)—organization is necessary for mentality.  
  - *Scalability without stopping point*: Unattractive (△)—e.g., realism extending to forests implies "Gaia mind."  
  - *Morality without intentionality*: Unexplored (?)—e.g., can a superorganism have interests without beliefs?  

  ---

  ### **Scoring Key**  
  *Tally your answers, then match to positions. Mixed patterns indicate unresolved tensions.*  

  | Position                  | Answer Pattern (Question: A/B/C)                                                                 | Notes                                                                 |
  |---------------------------|--------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------|
  | **Full Realism**          | 1A, 2A, 3A, 4A, 5A, 6A, 7A, 8A, 9A, 10A                                                         | Rare; requires forgiving slow speed (6B is contradictory).           |
  | **Superorganism**         | 1A/C, 2A, 3C, 4B, 5B/C, 6B/C, 7B, 8B, 9C, 10B                                                   | Avoids "mind" but accepts functional unity.                          |
  | **Pluralist Subjectivism**| 1B, 2B, 3B, 4B/C, 5B, 6B, 7C, 8B, 9C, 10B                                                       | Rejects colony as subject; embraces ant-level cognition.             |
  | **Deflationary**          | 1C, 2C, 3C, 4C, 5B/C, 6C, 7C, 8C, 9C, 10C                                                       | Consistently dismisses literal talk.                                 |
  | **Constitution View**     | 1B, 2B, 3B, 4B, 5B, 6B, 7B/C, 8B, 9B/C, 10B                                                     | 4B (robot swap) is key; rejects continuity without minded parts.     |
  | **Eliminativism**         | 1B, 2B, 3B/C, 4C, 5B/C, 6B, 7C, 8B, 9C, 10B/C                                                   | Denies collective cognition; closest to "just ants."                 |
  | **Non-Reductive Emergentism**| 1A, 2A, 3A, 4A, 5A/C, 6A, 7A/B, 8A/B, 9A, 10A                                                 | Accepts novelty but denies subjecthood (contradicts realism).        |

  **Unmatched Patterns**:  
  - **Slow-speed realists** (1A, 6B): Incoherent—realism requires accepting slow cognition.  
  - **Functionalists without minds** (1A, 5B): Fits *Superorganism* but conflicts if 8A (forest mind) is chosen.  
  - **Scalability tensions** (e.g., 2A + 8B): *Realism* or *Emergentism* with a forest-sized stopping point.  

  **Indistinguishable Pairs**:  
  - **Deflationary vs. Eliminativism**: Only split by 3C (fission) or 4C (robots)—deflationary allows "as-if" talk; eliminativism rejects it entirely.  
  - **Realism vs. Emergentism**: Only split by subjecthood (not directly quizzed). Emergentism denies the colony is a subject; realism insists it is.  

  **Vulnerable to "Forest Move"**:  
  - **Realism** and **Emergentism** need a principled stopping point (e.g., "integration threshold") to avoid ecosystem minds.  
  - **Constitution View** stops at ants—forests lack minded parts.  
  - **Superorganism** avoids by denying mentality entirely.  

  ---

  ### **How to Use This Handout**  
  1. **Quiz First**: Have participants complete the quiz individually.  
  2. **Score & Reveal**: Use the key to assign positions—highlight mixed patterns as discussion starters.  
  3. **Discuss Awkward Commitments**: Each position’s weakness exposes theoretical tensions (e.g., realism’s slow decisions, deflationary’s predictive success).  
  4. **Debate Boundaries**: Focus on unresolved pairs (e.g., "Can functional organization *ever* imply a mind?") and scalability.  

  This tool forces clarity by prioritizing cases over labels, revealing how we project mentality onto systems. No citations—just Hofstadter’s ants and your group’s intuitions!
