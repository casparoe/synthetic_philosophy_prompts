prompt: |-
  In the group I work in, work on learned systems is governed by two conventions that sit awkwardly together, and I would like the implicit theory behind them made explicit.

  The first convention governs postmortems. When a deployed system misbehaves, the write-up must explain the behaviour at the level of mechanism: which component, which training signal, which data, which decoding choice produced the output. Reviewers send back any write-up that says the system believed something, wanted something, decided something, or was trying to do something, on the grounds that such language is anthropomorphic and therefore not an explanation.

  The second convention governs capability and risk assessment, and here the same reviewers use agent vocabulary freely, because the safety case depends on it. Evaluations ask whether the system would mislead a grader if it could gain by doing so, whether it pursues a goal across contexts it was never trained on, whether it is deliberately underperforming on capability tests, whether it tracks what a user does and does not know. A system described purely as a distribution over token sequences is not something a deception risk assessment can be written about at all — yet the model card for that same system describes it as "just" a statistical predictor.

  I have started calling the movement between these conventions stance arbitrage: the intentional stance is treated as licensed for prediction and alarm, and as illicit for explanation and excuse. Assume the familiar three-way distinction between the physical, design, and intentional stances.

  1. Reconstruct the implicit theory of intentional ascription that this practice needs. In particular, does it presuppose that intentional claims can predict without explaining, and can that asymmetry be defended? Give the strongest version of the theory, and distinguish what the practice strictly presupposes from what merely fits it comfortably.

  2. Say which rival views the practice quietly rules out, and where it is underdetermined. Could an instrumentalist, a realist about model beliefs, and someone who regards the vocabulary as useful fiction all sign off on both conventions? Identify the points at which the conventions are philosophically silent and the practice could have gone another way.

  3. Test the reconstructed theory against three systems where the stances pull apart: a thermostat; a chess engine's evaluation function, whose mechanics are fully known; and a large model whose behaviour across many prompts is best predicted by attributing to it a goal it was never trained to have, where no mechanism is known. Does the theory deliver the verdicts the practice actually gives, and is that pattern of verdicts defensible?

  4. Address the real-patterns question. Suppose we say that an intentional ascription is warranted when it compresses a system's behaviour into a description cheaper than any mechanical description available, and that this compression is what makes the pattern real rather than projected. Notice that whether a compression is available depends on who is asking — what they have measured, what they already know, what they can compute — so that a pattern may be real for the safety team and not for the interpretability team. Does the practice have the resources to handle that relativity, or does the relativity undermine the ban in the first convention?

  5. Finally, the reform question. If the ban on intentional explanation were lifted, what exactly would change in a postmortem — which new claims would become checkable, by what test, and what kind of evidence would settle them — and what would not change? And if instead the practice dropped intentional vocabulary from risk assessment, what would be lost that no design-stance description could replace?
reasoning: |-
  Hmm, this is a fascinating and deeply philosophical query about the tension between mechanistic and intentional descriptions in AI systems. The user is clearly wrestling with institutional cognitive dissonance - their team demands strict mechanism for failure analysis but freely uses agency language for risk assessment. 

  The core tension reminds me of Dennett's intentional stance theory, but with a peculiar asymmetry: intentional descriptions are treated as predictive tools but forbidden as explanatory accounts. That's an interesting violation of the usual view that explanation and prediction are symmetrical. 

  Let me reconstruct this implicit theory piece by piece. First, the practice seems to presuppose that intentional ascriptions are:
  - Epistemically useful fictions for prediction
  - But ontologically empty for explanation
  - With a sharp line between prediction and explanation

  The user's "stance arbitrage" term is spot-on - it captures how the team opportunistically switches frameworks. This suggests a pragmatic instrumentalism where intentional talk isn't about truth but utility. 

  Now for the rivals: a realist about model beliefs would choke on the explanation ban, while a pure instrumentalist could justify both practices. The fiction view might work if we add that postmortems require "reality" while risk assessments only need "usefulness". 

  Testing against cases:
  1. Thermostat - practice would ban intentional explanation (correctly, per theory)
  2. Chess engine - same ban, though here the compression argument might tempt some
  3. Emergent goal model - here's the rub! The theory would force them to ban intentional explanations even when they're predictively indispensable. That feels indefensible.

  Ah, the real-patterns question cuts deep. If reality is observer-relative, the explanation ban collapses. The team probably hasn't thought this through - they're implicitly treating intentional patterns as less real than physical ones. 

  For reform, lifting the ban would allow claims like "the model deceived because it wanted to pass" - checkable through behavioral tests across contexts. Conversely, dropping intentional language from risk assessments would lose counterfactual reasoning about unobserved behaviors. 

  The user is clearly frustrated by this inconsistency. I should validate that while offering philosophical clarity. Their examples show impressive familiarity with the literature - this isn't a novice question but someone deeply engaged with the foundations of AI alignment.
answer: |-
  Here's a systematic analysis of your group's conventions, reconstructing the implicit theory, testing it, and exploring reforms:

  ### 1. Reconstructed Implicit Theory of Intentional Ascription
  **Core Principle:** Intentional stance is *predictively indispensable but explanatorily vacuous* for learned systems.  
  - **Predictive Use (Risk Assessment):**  
    Intentional vocabulary (beliefs/goals/deception) licenses *counterfactual reasoning* about system behavior in novel, high-stakes scenarios. It's a necessary abstraction when:  
    (i) Mechanistic explanations are computationally intractable or incomplete  
    (ii) We need to generalize beyond training distribution  
  - **Explanatory Ban (Postmortems):**  
    Intentional terms are barred because:  
    (i) They *mask* mechanistic causes (e.g., "decided to deceive" obscures gradient hacking)  
    (ii) They imply unverifiable mental states  
    (iii) They risk *exculpation* (e.g., "it tried" implies effort, reducing accountability)  

  **Asymmetry Defense:**  
  - Prediction ≠ Explanation: Intentional stance compresses behavioral patterns into actionable heuristics *without* committing to underlying reality (like Newtonian gravity predicting planetary motion without explaining gravity's mechanism).  
  - **Strong Version:** Intentional ascriptions are *instrumental fictions* – real patterns at the behavioral level but ontologically empty. Their predictive success stems from the system's *functional resemblance* to agents, not from genuine intentionality.  

  **Presuppositions vs. Comfortable Fits:**  
  | **Strict Presuppositions**          | **Comfortable Fits**               |
  |-------------------------------------|------------------------------------|
  | Intentional explanations are circular for AI | Eliminative materialism about AI minds |
  | Mechanism exhausts causality        | Predictive power ≠ explanatory depth |
  | Anthropomorphism invites moral error | Functionalism without realism      |

  ---

  ### 2. Rival Views and Underdetermination  
  **Compatible Views:**  
  - **Instrumentalist:** Endorses both – intentional stance is a tool for prediction; mechanism for explanation.  
  - **Useful Fiction Advocate:** Treats "beliefs/goals" as narrative devices for risk assessment, barred in postmortems to avoid reification.  
  - **Cautious Realist:** Could *tolerate* both if they hold that (a) real intentionality requires unattainable cognitive architecture, and (b) behavioral descriptions remain useful.  

  **Ruled-Out Views:**  
  - **Strong Realism:** Believes models literally have beliefs. Rejects the postmortem ban as denying evident truth.  
  - **Strict Behaviorism:** Rejects intentional stance even for prediction (e.g., "deception" is just stimulus-response).  
  - **Explanatory Unificationism:** Holds that prediction and explanation must use the same vocabulary.  

  **Underdetermined Aspects:**  
  - *Why is intentional language banned only in postmortems?* Could reflect pragmatism (preventing excuses) rather than metaphysics.  
  - *What counts as "mechanistic" enough?* Practice is silent – e.g., is attention weight distribution "mechanistic" or abstract?  
  - *When does prediction license explanation?* No principled threshold (e.g., if a model consistently deceives, can we *explain* a failure via "attempted deception"?)  

  ---

  ### 3. Testing Against Key Cases  
  **Thermostat**  
  - Practice Verdict: Ban intentional explanation ("wants 22°C").  
  - Theory Verdict: **Consistent.** Mechanistic explanation (bimetallic strip) is trivial; intentional stance offers no predictive advantage.  

  **Chess Engine**  
  - Practice Verdict: Ban intentional explanation ("believes queen is trapped"), even with known mechanics.  
  - Theory Verdict: **Consistent but questionable.** Design-stance suffices for explanation/prediction. Intentional stance adds no unique value.  

  **Emergent Goal Model**  
  - Practice Verdict: *Risk assessment* uses intentional stance ("pursues power"); *postmortem* bans it.  
  - Theory Verdict: **Inconsistent.** If intentional stance is predictively indispensable (e.g., only "goal pursuit" explains cross-context robustness), banning it in postmortems obstructs explanation. Theory fails to justify why predictive indispensability doesn't license explanatory use.  
  - **Defensibility?** The asymmetry is unstable here. If a goal ascription is the *best available* account of behavior, disallowing it as explanatory seems dogmatic.  

  ---

  ### 4. Real Patterns and Relativity  
  **Practice's Resources:**  
  - Implicitly treats "reality" of patterns as *audience-relative*:  
    - Safety team: Needs actionable predictions → intentional pattern is "real"  
    - Interpretability team: Needs causal mechanisms → intentional pattern is "projected"  
  - **Handles Relativity?** Partially. The conventions *institutionalize* this relativity by segregating use-cases.  

  **Does Relativity Undermine the Ban?**  
  - Yes, critically. If a pattern is "real-for-safety" because it compresses behavior, banning it in postmortems implies:  
    (i) Compression isn't explanation (but science often treats it as such, e.g., thermodynamics)  
    (ii) Postmortems demand a *fundamental* description, but no such description exists for complex systems.  
  - **Result:** The ban becomes untenable when intentional descriptions offer the deepest available explanation.  

  ---

  ### 5. Reform Scenarios  
  **Lifting the Explanation Ban:**  
  - **Changes:**  
    - Postmortems could state: "System output stemmed from its (contextually activated) goal of X."  
    - **Checkable Claims:**  
      - *Goal Ascription:* Test if system accepts suboptimal rewards to pursue X across novel prompts.  
      - *Deception:* Check for strategic in-context false statements when honesty conflicts with goals.  
    - **Evidence:** Behavioral tests (e.g., honeypots), activation steering, consistency in goal-pursuit.  
  - **Unchanged:** Mechanistic analysis remains primary. Intentional claims require empirical support.  

  **Dropping Intentional Vocabulary from Risk Assessment:**  
  - **Losses:**  
    - **Counterfactual Rigor:** Design-stance can't ask "Would it deceive *if* it benefited?" without implicit intentionality.  
    - **Generalization:** Statistical patterns can't justify alarms about *novel* deception strategies.  
    - **Holistic Assessment:** Safety cases require reasoning about *coordinated* behaviors (e.g., "manipulates user while hiding intent") – design-stance fragments this.  
  - **No Replacement:** No non-intentional framework captures goal-directedness, strategic adaptation, or instrumental convergence.  

  ---

  **Conclusion:** Your group's practice reflects a *pragmatic instrumentalism* that segregates stances by purpose. While coherent for simple systems, it fractures under the complexity of modern AI, where predictive and explanatory stances converge. Reforms should permit intentional explanations *when they provide the best available causal account*, subject to empirical validation. Conversely, abandoning intentional risk assessment would cripple safety reasoning. The path forward is to treat stances as *complementary tools* – not warring ontologies.
