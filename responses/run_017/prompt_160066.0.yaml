answer: |-
  Based on your constraints and failure modes, here's a **practical review procedure** designed for volunteer moderators with no legal/logic background. It uses 6 sequential tests (each must pass before proceeding), takes ~15 minutes, and outputs a simple justification. Tests are designed to catch ambiguity, self-reference, and irreversible traps while flagging values-based decisions.

  ---

  ### **Amendment Review Procedure**
  *Run these tests in order. Stop and reject if any test fails. If a test flags "Human Decision," write a brief public justification.*

  1. **Test 1: Syntax & Identity Check**  
     - **Test:** Does the diff clearly identify *every* changed rule by current number/name? Are additions/deletions unambiguous (e.g., "Delete Rule 17," "Add Rule 23: ...")?  
     - **Satisfactory:** All changes map to exact existing rules or new unique IDs (no "repeal-and-replace" without explicit deletion).  
     - **Failure Action:** **Reject as malformed** (e.g., "Change Rule 17 to say X" without showing full old/new text).  
     - *Why?* Forces explicit tracking of rule identity. Renumbering is banned to avoid ambiguity—treat rules as immutable objects.

  2. **Test 2: Definitional Feedback**  
     - **Test:** Does the proposal change any definition (e.g., "active member," "quorum") used in *this vote's process*?  
     - **Satisfactory:** No changes to voting process definitions, OR if changed, the proposal *explicitly states* whether old/new rules apply to its own vote.  
     - **Failure Action:** **Human Decision required** (e.g., "Proposal changes 'active member.' Should this vote use OLD or NEW definition? Decision: [OLD] to avoid self-dealing").  
     - *Why?* Prevents self-serving loops (e.g., redefining voters to pass a vote).

  3. **Test 3: Entrenchment Validity**  
     - **Test:** Does the proposal amend/delete a rule labeled "permanent" or requiring >2/3?  
     - **Satisfactory:** The proposal meets the *current* entrenchment threshold for those rules (e.g., if Rule 5 requires 4/5, the vote threshold is set to 4/5).  
     - **Failure Action:** **Human Decision required** (e.g., "Proposal deletes entrenched Rule 5. Vote requires 4/5 majority per Rule 5").  
     - *Why?* Acknowledges entrenchment as binding *only if* the current rule says so—but doesn’t resolve if entrenchment is philosophically valid (that’s a power struggle).

  4. **Test 4: Self-Modification Clarity**  
     - **Test:** Does the proposal add/change self-deleting, self-amending, or conflicting precedence rules?  
     - **Satisfactory:** Self-modifying rules specify *exact triggers* (e.g., "deleted after 30 days"). Precedence clauses explicitly list overridden rules.  
     - **Failure Action:** **Human Decision required** (e.g., "Rule 23 claims precedence over later rules but doesn’t specify which. Flagged for ambiguity").  
     - *Why?* Forces specificity on time bombs and conflicts—but doesn’t judge if they’re desirable.

  5. **Test 5: Irreversible Impact**  
     - **Test:** Could this change prevent reverting to a prior *normative state* (e.g., deleting a rule, requiring unanimity)?  
     - **Satisfactory:** No irreversible changes, OR the proposal includes a reversal mechanism (e.g., "This rule expires in 6 months").  
     - **Failure Action:** **Human Decision required** (e.g., "Deleting Rule 9 may make revival impossible. Proceed only with rollback plan").  
     - *Why?* Git keeps text, but normative state (like amendment rules) can be irrecoverable.

  6. **Test 6: Amendment Rule Conflict**  
     - **Test:** Does the proposal change the core amendment rule *or* add rules about rule changes?  
     - **Satisfactory:** No changes to the amendment rule itself, OR if changed, the proposal *explicitly states* how future amendments are handled.  
     - **Failure Action:** **Human Decision required** (e.g., "Proposal changes amendment threshold to 4/5. This may lock future changes").  
     - *Why?* Meta-rule changes risk deadlock—must be explicitly called out.

  ---

  ### **What This Procedure *Cannot* Settle**
  - **Values-based conflicts** (e.g., "Is entrenchment morally binding?"). The tests force you to *document* the conflict but won’t resolve it.
  - **Ambiguous precedence** (e.g., two rules claiming priority). Human judgment is required.
  - **Git vs. normative state**: Git preserves text, but restored text ≠ revived authority (e.g., if new rules invalidate old ones).
  - **"Repeal-and-replace" vs. "amend in place"**: Test 1 forces explicit deletion, but whether a change is "cosmetic" or "substantive" isn’t automated.

  ---

  ### **Test Runs on Your Proposals**

  #### **Proposal 1: Redefine "active member" to include lurkers, count them for this vote.**
  - **Test 1:** Pass (clear diff changing "active member" definition).  
  - **Test 2:** **FAIL → Human Decision.**  
    - *Justification:* "Proposal changes 'active member' and wants new definition to apply to its own vote. Self-referential risk. Decision: Vote uses OLD definition to prevent self-dealing. If passed, new definition applies to future votes."  
  - **Test 3+:** Not reached.  
  - **Outcome:** Flagged for human decision. **Rewrite suggestion:** Split into two proposals: (1) Change definition (voted under old rules), (2) Apply new definition to quorum rules.

  #### **Proposal 2: Add "contributors' rights" section amendable only by 4/5 vote (no change to amendment rule).**
  - **Test 1:** Pass (adds new section).  
  - **Test 2:** Pass (no voting-process changes).  
  - **Test 3:** **FAIL → Human Decision.**  
    - *Justification:* "New rule self-entrenches at 4/5, but amendment rule requires 2/3. Conflict: Does local entrenchment override the core rule? **This does nothing unless the community accepts local entrenchment as valid.** Decision: Highlight that this may be challenged as void (since amendment rule wasn’t changed)."  
  - **Test 4+:** Pass.  
  - **Outcome:** Flagged for human decision. **Brutal truth:** If your community believes the core amendment rule is supreme, this is symbolic—it can be deleted by 2/3 later. To make it binding, you *must* amend the amendment rule itself.

  #### **Proposal 3: Spam rule (self-deletes in 30 days) + Housekeeping rule (repeals unchanged rules after 2 years).**
  - **Test 1:** Pass (two new rules).  
  - **Test 2:** Pass.  
  - **Test 3:** Pass (no entrenched rules changed).  
  - **Test 4:** **FAIL → Human Decision.**  
    - *Justification:* "Spam rule: Self-deletes clearly. Housekeeping rule: Will repeal itself and the amendment rule if unchanged for 2 years. **This is a values call:** Do we want auto-repeal? If yes, add an exception for the amendment rule."  
  - **Test 5:** **FAIL → Human Decision.**  
    - *Justification:* "Housekeeping rule may delete the amendment rule irreversibly. No rollback mechanism. Decision: Reject unless amended to exclude amendment rules."  
  - **Outcome:** Rejected after Test 5. **Rewrite suggestion:** Split proposals. For housekeeping rule: Add "except Rule 1 (amendment rule)" and a reversal trigger (e.g., "sunset if >50% oppose renewal").

  ---

  ### **Key Design Notes**
  - **Real work vs. silent choices:**  
    - Tests 1 and 4 do real work (prevent ambiguity).  
    - Tests 2, 3, 5, 6 force you to confront power dynamics you’d otherwise ignore (e.g., "Who gets to vote?").  
  - **Why this fits your constraints:**  
    - No logic/law knowledge needed (tests are yes/no + short justifications).  
    - 15-min runtime: Focuses on high-risk areas only.  
    - Output is public, audit-friendly sentences.  
  - **When to reject vs. flag:**  
    - Reject only for malformed syntax (Test 1).  
    - Everything else is a human decision—because your core failure modes are about *power*, not procedure.  

  This won’t prevent all chaos (Nomic is proof that self-amendment is inherently unstable), but it makes conflicts explicit and actionable. If you hit a "Human Decision" that splits the community, no checklist will save you—that’s the moment to debate who you are as a project, not what the rules say.
