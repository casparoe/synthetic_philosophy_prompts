prompt: |-
  I help run the neighborhood association for my area — nothing fancy, we meet one evening a month in the basement of a library, usually 20 to 35 people, mostly long-time homeowners, a handful of renters, one guy who does drywall and actually knows what things cost to build. I've got a 90-minute slot coming up and I want to do something other than the usual arguiing about a parking variance.

  Here's what I've been chewing on by myself (no background in any of this, I just read a lot and think about it at night): whenever a building with, say, twenty apartments gets proposed on a lot near us, the people who show up are all people who already live here, and the people the building is for are not in the room and don't get a vote. So the meeting almost always outputs no, and it feels principled the whole time, because every single objection is reasonable on its own — traffic, shadows, the school, the sewer line. What I can't get anyone in that room to actually feel is that the outcome is mostly being set by who is allowed a say rather than by anyone's reasons, and that the objections being made would have blocked most of us when we moved in.

  So: design a 90-minute activity for that group, on a fictional proposal of your choosing, using only stuff you could find in a library basement (no money, no projector, phones discouraged). Rules, roles or cards, a minute-by-minute timeline, and a debrief. Nobody should hear the words NIMBY or right to the city until the debrief, and there shouldn't be a lecture up front at all.

  Please build it around three things I've been messing with. First, the arrival test: any objection has to be restated in a form that would also have applied to the objector when they arrived, and someone has to say out loud whether it would have. Second, a spillover deck: when the room votes a project down, we draw a card saying where those households end up instead, and the cost has to land on someone the room can picture — a named relative of a person sitting there, whatever — so that the cost of no stops being invisible and delayed. Third, run the same decision twice with the franchise changed: round one only current residents vote; round two the households the building is for are represented too, and I want the people who have to argue for them chosen by lot from among the loudest opponents. Tell me honestly if that last bit backfires.

  The debrief should map specific moments in the activity onto specific parts of the problem, including the move where someone says I'm not against housing, I'm against this project. Also tell me what will predictably go wrong the first time I run it and how to handle it — assume at least one landlord who owns three rentals and two renters who might get priced out, and they already hate each other. And be frank about which part of the idea the activity can't reproduce at all and I'd just have to say out loud. If you can also work in a way to show the gap between what people say in the room and what they'll write down anonymously, do that too — I suspect that gap is half the story.
reasoning: |-
  We are designing a 90-minute activity for a neighborhood association meeting. The goal is to help participants understand how the composition of the group making decisions (current residents only) affects outcomes, and to make visible the costs of blocking new housing.

  Core elements from the user:
  1. Arrival Test: Any objection must be restated in a way that would have applied to the objector when they arrived, and the group must explicitly state if that would have blocked them.
  2. Spillover Deck: When the group votes down a project, draw a card that shows where the households end up and the cost, making it tangible (e.g., on a named relative of someone in the room).
  3. Run the decision twice: First round only current residents vote; second round include representation for the future residents, with the loudest opponents randomly chosen to represent those future residents.

  Additional requirements:
  - No upfront lecture, avoid terms like NIMBY until debrief.
  - Use only materials found in a library basement: flip charts, markers, index cards, pens, maybe a deck of cards for random selection.
  - Address the gap between public and private opinions (e.g., anonymous written input).
  - Debrief should connect activity moments to the real problem.
  - Predictable problems: landlord with 3 rentals and renters who might be priced out, existing animosity.

  Structure:
  - 90 minutes total.
  - Fictional proposal to keep it neutral.
  - Activity should be interactive and engaging.

  Proposal: A fictional proposal for a 20-unit apartment building on a vacant lot in the neighborhood. We'll call it "The Cedar Grove Apartments".

  Materials:
  - Flip chart or whiteboard (if available) for recording objections and votes.
  - Index cards for:
     a) Writing objections (then applying arrival test).
     b) Spillover deck (prepared in advance).
     c) Anonymous written opinions.
  - Markers.
  - A deck of playing cards for random selection of roles in round two.
  - Timer.

  Timeline:

  1. Introduction (5 min)
     - Explain that today's meeting is a simulation to explore a fictional housing proposal. We'll be making a decision as a group, but with a twist.
     - Present the fictional proposal: "The Cedar Grove Apartments: a 4-story, 20-unit apartment building (mix of 1 and 2 bedrooms) on the vacant lot at the corner of Elm and 5th. It includes 5 affordable units (for households at 60% AMI)."
     - Explain the process: We'll have a discussion, then vote. But we have some rules to structure the discussion.

  2. Round One: Current Residents Only (35 min)
     a. Open discussion (15 min): 
          - Anyone can voice concerns or support. But every objection must be written on an index card and read aloud by the facilitator (to avoid personal targeting). 
          - For each objection, the facilitator applies the "Arrival Test": 
              - Ask the objector: "When you moved here, would this same objection have applied to your arrival? For example, if you object to traffic, would the traffic from your arrival have been a similar issue?"
          - The group must then discuss: Would this have blocked the objector's home? (If the objector is a long-time resident, they might not know, so others can chime in.)
          - Record the objection on a flip chart and note the arrival test outcome (e.g., "Traffic: would have blocked the Smiths in 1985? Group says yes/no").
     b. Vote (5 min): 
          - Only current residents (everyone in the room) vote by show of hands: Approve or Reject the project.
          - Tally and announce the result. (We assume it will be rejected.)

     c. Spillover Deck (5 min): 
          - Since the project is rejected, draw a card from the spillover deck. 
          - The deck is prepared in advance with scenarios of where the 20 households might go and the consequences. Examples:
              - "4 households move to neighboring town, increasing their rent by $300/month. One of them is the niece of [name a participant, e.g., Linda]."
              - "3 households double up in existing apartments, leading to overcrowding at the local school."
              - "2 households move to a distant suburb, increasing commute by 1 hour each way. One of them is the son of [name a participant]."
              - "5 households remain in their current overcrowded situation. One is the cousin of [name a renter participant]."
          - Read the card aloud and post it.

     d. Anonymous Input (10 min): 
          - Pass out index cards. Ask each person to write anonymously: 
              - "Do you personally support the Cedar Grove project? Yes/No/Unsure"
              - "What is the main reason for your vote? (one sentence)"
          - Collect and shuffle. Read aloud the votes and reasons (without identifying). 
          - Compare the anonymous vote tally with the public vote. Highlight the gap.

  3. Round Two: Expanded Franchise (30 min)
     a. Assign Roles (5 min): 
          - Select 5 people to represent the 20 future households (so each represents 4 households). 
          - How: Use a deck of playing cards. Assign a card to each participant. Draw 5 cards randomly. Those chosen become the "Future Resident Representatives". 
          - Key: The facilitator intentionally includes the loudest opponents from round one (if they were drawn, or if not, the facilitator can say "We also need to include some of the most vocal from the first round for balance" and pick 1-2 of them, even if not drawn, to be added. But note: the user asked for the loudest opponents to be chosen by lot for this role. So we'll stick to random, but if a loud opponent is not drawn, we might note that and adjust in the debrief? Or stick strictly to random and debrief if they aren't included? Let's stick to random and note in debrief that sometimes the loudest opponents might not be in the group, but the effect is still strong.)

     b. Discussion (15 min): 
          - The Future Resident Representatives are instructed: "Your job is to advocate for the needs and perspectives of the 20 households who would live in this building. They are typically young families, service workers, or seniors on fixed incomes. They want to live in this neighborhood because of jobs, schools, or family."
          - Reopen discussion. Current residents and future representatives can speak. 
          - Apply the arrival test again to any new objections or the same ones.

     c. Vote (5 min): 
          - Now the voting body is: current residents (one vote each) + future representatives (each gets 4 votes, so they represent 4 households each, but for simplicity in voting, they cast one vote that counts as 4 votes? Or we have 20 votes to assign? Let's simplify: each future representative gets 4 votes, so they cast 4 votes. But that might be confusing. Alternatively, each future representative gets one vote that counts as 4. We can do: total votes = (number of current residents) + 20. Each current resident has 1 vote, each future rep casts 4 votes. But then we have to explain. Alternatively, we can say the future representatives together represent 20 votes, so they get 20 votes to cast as a bloc? Or individually? Let's do: each future rep has 4 votes and can cast them as they wish (so they can split if they want). But that complicates. For simplicity, we'll have the future reps each cast one vote (for their 4 households) and that vote counts as 4. So the tally is: 
              - Current residents: 1 vote per person
              - Future representatives: 4 votes per representative
          - Vote by show of hands for Approve/Reject. Tally and announce.

     d. Spillover if Rejected (if needed, but likely approved) (5 min): 
          - If rejected again, draw another spillover card. But we expect it to pass this time.

  4. Debrief (20 min)
     - Start by asking participants: "What did you notice? What was different between the two rounds?"
     - Then connect to the real world:
          - Round One: Who was missing? (The future residents.) How did that affect the decision? Point to the arrival test: many objections would have blocked us too. And the spillover: the cost of no is real and lands on real people (like relatives).
          - The gap between public and anonymous votes: why might people say one thing publicly and another anonymously? (Social pressure, fear of conflict.)
          - The move "I'm not against housing, just this project": In the activity, did we see that? How did the same project get approved in round two when the future residents had a say? So maybe the "just this project" is because the future residents aren't in the room to say why this project is important to them.
          - The role of the future representatives: how did it feel to argue for people not present? Especially for the opponents? (If any loud opponents were chosen, ask them.) If not, note that we didn't have any in this run, but in reality, it might change perspectives.
          - What the activity can't show: 
              - The long-term cumulative effect of blocking many projects (the spillover deck only shows one project).
              - The systemic reasons why future residents can't attend (they are busy, not yet here, or feel unwelcome).
              - The power dynamics in the room (landlords vs. renters) might have played out, but we didn't explicitly address that. We can note that in the debrief: "We had landlords and renters with different interests, but we focused on the future residents. How did that feel?"

     - Finally, introduce the terms: "This dynamic is often called NIMBY (Not In My Backyard), and the idea that everyone who is affected should have a say is part of the 'right to the city'. But we don't need labels to see what happened here."

  Predictable Problems and Solutions:

  1. Landlord-renter tension: 
     - Problem: The landlord might oppose new housing to protect their rents, and renters might support it to increase supply and lower rents. But they already hate each other.
     - Solution: In the activity, the focus is on the fictional proposal and future residents. The facilitator should steer the discussion away from personal conflicts. In the arrival test, focus on the objections to the project, not personal situations. In the debrief, note that housing supply affects everyone.

  2. The loudest opponents not being chosen for future representatives:
     - Problem: The random selection might not pick the most vocal opponents, so we miss the opportunity to have them argue for the other side.
     - Solution: In the debrief, acknowledge it: "In this run, we didn't have any of the most vocal opponents representing future residents. How might that have changed the discussion if we had?" Then, if time allows, ask one of them: "What do you think the future residents would have said?" to engage them.

  3. The spillover deck might feel contrived:
     - Solution: Prepare cards that are as realistic and locally relevant as possible. Use names of real local people if participants know them (e.g., "your nephew"), but if not, use generic but relatable examples.

  4. Time management:
     - Problem: 90 minutes is tight.
     - Solution: Strict timekeeping. Have a co-facilitator if possible. Cut discussion if needed.

  5. Resistance to the activity:
     - Problem: Some may feel this is a trick to make them approve housing.
     - Solution: Emphasize it's a simulation to explore decision-making, not about any real project. In the debrief, focus on the process, not the outcome.

  Activity Title: "The Cedar Grove Decision: Who Gets a Say?"

  Materials to Prepare in Advance:
  - Flip chart with the fictional proposal.
  - Spillover deck: 5-10 index cards with different spillover scenarios. Make them empathetic and tangible.
  - A deck of playing cards for random selection.
  - Blank index cards for objections and anonymous voting.
  - Markers.

  This design should meet the user's goals and create a reflective experience.
answer: |-
  ### **The Cedar Grove Simulation: A 90-Minute Activity**  
  **Goal:** Help residents see how decision-making is shaped by *who gets a voice*, using tangible consequences and perspective shifts. No jargon, no lectures—just immersive role-play.  

  **Fictional Proposal:**  
  > *"Cedar Grove Apartments: A 4-story, 20-unit building (15 market-rate, 5 income-restricted) on a vacant lot at Oak St. & 3rd Ave. Units for young families, seniors, and service workers. Includes a small playground."*  

  **Materials Needed:**  
  - Index cards (200)  
  - Markers  
  - Timer  
  - 2 buckets ("Approve"/"Reject")  
  - A hat or bowl  
  - Pre-written "Spillover Deck" cards (see below)  
  - Playing cards (for random role assignment)  

  ---

  ### **Minute-by-Minute Timeline**  
  **Total: 90 Minutes**  

  #### **Setup (5 min)**  
  - **0:00:** Hand out index cards and markers. No phones.  
  - **0:01:** Introduce the *fictional* proposal:  
    > *"Tonight, we’re simulating a vote on Cedar Grove Apartments. We’ll discuss, vote, then do it again with a twist. No real projects—this is hypothetical."*  
  - **0:03:** Explain rules quickly:  
    - **Arrival Test:** "If you object, rephrase it as if it applied to *you* when you moved here."  
    - **Spillover Deck:** "If we reject, we draw a card showing where the households go."  
  - **0:05:** Split into groups of 4–5 (pre-mixed: homeowners, renters, landlord together).  

  #### **Round 1: Current Residents Only (35 min)**  
  - **0:05–0:20: Group Discussion (15 min)**  
    - Groups discuss the proposal. Each objection must be written on a card.  
    - **Facilitator Prompt:** *"List concerns. For each, answer: Would this have blocked YOU when you arrived? Write ‘YES’ or ‘NO’ on the card."*  
      - *Example:* "Traffic increase!" → *Rephrased:* "Would added traffic from your arrival have blocked you?" → Card says: "TRAFFIC: YES/NO."  
    - Landlord/renter tension? Stay neutral: *"Stick to the arrival test—focus on the question."*  

  - **0:20–0:25: Objection Sharing (5 min)**  
    - Groups share top 2 objections. Facilitator reads cards ALOUD, focusing on:  
      - The objection.  
      - The arrival test result (e.g., *"Linda’s group said traffic would’ve blocked them in 1995."*).  
    - **Record objections** on a wall chart.  

  - **0:25–0:30: Vote & Spillover (5 min)**  
    - **Vote:** Current residents drop cards into "Approve" or "Reject" buckets.  
    - **Result:** Assume rejection (typical outcome). Say: *"Project rejected."*  
    - **Draw a Spillover Card** (pre-written, from a hat):  
      > *"4 households move to a town 50 miles away. One is the nephew of [Name a participant, e.g., ‘Carol’]. He now commutes 2 hours/day. His childcare costs double."*  
    - Post the card visibly.  

  - **0:30–0:35: Anonymous Input (5 min)**  
    - *Secret ballot:* Everyone writes "APPROVE/REJECT" + one reason on a card. Collect in a bowl.  
    - **Facilitator reads ALOUD** (without names):  
      > *"Anonymous vote: 12 Approve, 8 Reject. Top reason: ‘We need housing, but I didn’t say it out loud.’"*  
    - Contrast with public vote (e.g., *"Public vote was 5 Approve, 15 Reject"*). Highlight the gap.  

  #### **Round 2: Expanded Franchise (30 min)**  
  - **0:35–0:40: Assign New Roles (5 min)**  
    - **Future Resident Reps:** Randomly draw 5 playing cards. Those 5 become "Future Residents" (each represents 4 households).  
    - **Key Twist:** If loud opponents (from Round 1) weren’t picked, assign 1–2 of them as reps *"to ensure balance."*  
      > *"You’ll advocate for the families who’d live here—young parents, a retiree, a barista. They want to stay near jobs/schools."*  

  - **0:40–0:55: Discussion with Reps (15 min)**  
    - Same groups. Future Resident Reps *must* argue FOR the project.  
    - **Arrival Test STILL APPLIES:** Objections must be rephrased.  
    - **Facilitator Prompt:** *"Future Residents: Why do these households need this? Current residents: Use the arrival test."*  
    - *Predictable Drama:* Landlord argues against? Remind: *"Future Residents—fight for your housing!"*  

  - **0:55–1:00: Vote & Spillover (5 min)**  
    - **Vote:**  
      - Current residents: 1 vote each.  
      - Future Resident Reps: 4 votes each (representing 20 households).  
    - **Tally:** *Example: "Current: 8 Approve, 12 Reject. Future Reps: 20 Approve. Total: 28 Approve, 12 Reject. APPROVED."*  
    - **If rejected,** draw another Spillover Card.  

  #### **Debrief (25 min)**  
  - **1:00–1:15: Reactions (15 min)**  
    - Ask:  
      1. *"What felt different in Round 2?"*  
      2. *"When did the arrival test change how you saw an objection?"*  
      3. *"Future Resident Reps—how hard was it to argue for ‘invisible’ people?"*  
      4. *"Did the spillover card make ‘no’ feel costly?"*  
    - **Map to Real Life:**  
      - *Arrival Test:* "When someone said, ‘This traffic would’ve blocked me in 1980’—that’s how we all got here."  
      - *Spillover Deck:* "Rejecting projects doesn’t erase demand—it pushes it onto real people (like Carol’s nephew)."  
      - *Voting Gap:* "Why did 12 of you approve anonymously but only 5 publicly? Social pressure silences support."  
      - *"I’m not against housing, just this project":* "In Round 1, you killed it. In Round 2, with future voices, it passed. The ‘perfect project’ myth often ignores who’s *not* here."  

  - **1:15–1:20: Connect to Reality (5 min)**  
    - *Finally, name the issue:*  
      > *"This is about ‘who gets a say.’ When only current residents vote, we block change that would’ve let US in. That’s called ‘NIMBYism,’ but labels aren’t as important as this: we’re deciding for people who aren’t allowed to speak. Next month, let’s discuss how to hear them."*  
    - End: *"Thanks for playing along. Next meeting: parking variances, I promise."* (Light humor.)  

  ---

  ### **What Will Go Wrong (and How to Handle It)**  
  1. **Landlord vs. Renters Explosion:**  
     - *Predict:* Landlord calls renters "ungrateful"; renters accuse landlord of greed.  
     - *Handle:* Pre-empt it: *"In this sim, we’re all neighbors—focus on the arrival test, not each other."* If erupts, reframe: *"How would the arrival test apply to YOUR first home?"*  

  2. **Loud Opponents Resist Future Role:**  
     - *Predict:* "I won’t pretend to support this!"  
     - *Handle:* *"You’re the voice for people who can’t be here. Try it—if it feels unfair, tell us in debrief."* If they refuse, let them pass, but note in debrief: *"Some didn’t want to switch sides. Imagine if future residents could refuse our rules."*  

  3. **"This Is Unrealistic!":**  
     - *Predict:* "Future residents wouldn’t get 20 votes!"  
     - *Handle:* *"True—this amplifies their voice to show what’s missing. In reality, they get zero votes. Which feels fairer?"*  

  4. **Time Crunch:**  
     - *Predict:* Discussion runs long.  
     - *Handle:* Cut sharing to 1 objection per group. Use a visible timer.  

  ---

  ### **What the Activity *Can’t* Reproduce (Just Say It Aloud)**  
  - **The Cumulative Cost of "No":**  
    > *"This sim shows one project. But if we block every project, the spillover piles up: higher rents, displaced families, longer commutes. That’s the real cost we never vote on."*  

  - **Why Future Residents Aren’t in the Room:**  
    > *"In reality, they’re not here because they’re working late, can’t get childcare, or feel unwelcome. Our process excludes them by design."*  

  ---

  ### **Why the "Loud Opponents as Advocates" Works (and When It Backfires)**  
  - **Why It Works:** Forces empathy. Even if they resent it, they must articulate the other side. In debrief, say: *"When Frank argued FOR the project, did it reveal new angles?"*  
  - **When It Backfires:** If they sabotage (e.g., "I’m a future resident, and this building sucks!"), use it: *"Notice how hard it is to advocate when you’re outnumbered? That’s how supporters feel every meeting."*  

  ### **Spillover Deck Examples**  
  Write these in advance:  
  1. *"3 households move to a crowded apartment across town. One is your niece’s coworker—she now pays 50% of her income in rent."*  
  2. *"A senior on a fixed income moves in with her daughter, who quit her job to care for her. They’re your cousin’s neighbors."*  
  3. *"A teacher takes a job in a cheaper state. His 4th-grade class (including your grandson’s best friend) now has 35 kids."*  

  ### **Final Prep Tips**  
  - **Pre-write Spillover Cards:** Use relatable local names (e.g., "your nephew," "Carol’s coworker").  
  - **Assign Groups:** Mix homeowners/renters/landlord to diffuse tension.  
  - **Stay Neutral:** "I’m not pushing an agenda—I want us to see our blind spots."  
  - **First Time?** Expect grumbling—but debrief revelations will outweigh it.  

  This forces the room to confront *who* shapes decisions and *who pays the cost*. It’s uncomfortable, but that’s the point.
