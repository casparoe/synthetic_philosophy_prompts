  Based on the data provided, your friend's valuations for binary gambles with outcomes of winning a prize or nothing follow the pattern: valuation = (probability of winning)^2 * prize amount. This pattern is consistent with two distinct models:

  1. **Square-root utility model**: Utility of money is \(U(x) = \sqrt{x}\). Valuation is the square of the expected utility: \(\left(\sum p_i \sqrt{x_i}\right)^2\).
  2. **Rank-dependent utility with quadratic weighting**: Outcomes are ranked worst to best, and probabilities are weighted using the function \(w(p) = 2p - p^2\), where \(p\) is the cumulative probability. Valuation is \(\sum \pi_i x_i\), with decision weights \(\pi_i\) derived from \(w\).

  Both models produce identical valuations for binary gambles with one non-zero outcome (as in your existing data), but they diverge for gambles with two non-zero outcomes.

  ### Analysis of the New Gambles
  You proposed two gambles with the same expected value of $250:
  - **Gamble A (100-or-400 flip)**: 50% chance of $100, 50% chance of $400.
  - **Gamble B (0-or-800 flip)**: To ensure an expected value of $250, the probability of $800 is \(p = 250/800 = 5/16\) (≈31.25%), and $0 is \(1 - p = 11/16\) (≈68.75%).

  **Valuations under each model**:
  - **Square-root utility model**:
    - Gamble A: \(\left(0.5 \times \sqrt{100} + 0.5 \times \sqrt{400}\right)^2 = (0.5 \times 10 + 0.5 \times 20)^2 = 15^2 = 225\).
    - Gamble B: \(\left((11/16) \times \sqrt{0} + (5/16) \times \sqrt{800}\right)^2 = \left((5/16) \times 20\sqrt{2}\right)^2 = \left(125\sqrt{2}/16\right)^2 = (125^2 \times 2) / 256 = 31,250 / 256 \approx 122.07\).
    - **Preference**: A (225) > B (122.07).

  - **Rank-dependent utility model** (with \(w(p) = 2p - p^2\)):
    - Gamble A (ordered: $100 < $400):
      - Weight for $100: \(w(0.5) - w(0) = (2 \times 0.5 - 0.5^2) - 0 = 0.75\).
      - Weight for $400: \(w(1) - w(0.5) = 1 - 0.75 = 0.25\).
      - Valuation: \(0.75 \times 100 + 0.25 \times 400 = 75 + 100 = 175\).
    - Gamble B (ordered: $0 < $800):
      - Weight for $0: \(w(11/16) - w(0) = (2 \times 11/16 - (11/16)^2) = (22/16 - 121/256) = 231/256 \approx 0.902\).
      - Weight for $800: \(w(1) - w(11/16) = 1 - 231/256 = 25/256 \approx 0.098\).
