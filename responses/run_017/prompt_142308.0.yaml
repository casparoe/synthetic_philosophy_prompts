prompt: |-
  Next month I'm defending a thesis chapter (fourth-year, quantitative psych) in front of my committee plus whoever turns up from the department, and what I want is a Q&A prep sheet — not a defense of the chapter, I can write that part.

  Short version of the claim I'm making: the number everyone quotes — the share of attempted replications that "worked" — is the wrong summary statistic, because the comparison class is wrong. You shouldn't compare an observed replication rate to 100%, or to chance, or to some flat benchmark someone made up; you should compare it to the replication rate you'd predict from the original studies' own reported effect sizes and standard errors, fitted before you ever look at the replication outcomes. I fit a hierarchical model to the original estimates only, get a predicted replication rate, and compare it to what actually happened. I've been calling the difference the calibration gap. The point of it: two literatures can have the same headline replication rate and completely different calibration gaps, because in one of them the originals were low-powered and the survivors were badly winner's-cursed in magnitude, so a lot of replication failure was already predicted and tells you nothing except that the studies were underpowered; in the other the originals were adequately powered and still failed, and that is evidence that the estimates were artifacts. Second half of the chapter: I argue that a lot of the shouting about the replication crisis is a disguised disagreement about priors — skeptic's prior versus advocate's prior — and that replication data alone can't settle it, but that the gap measure is at least prior-robust because the prior gets integrated over rather than fixed. (In my simulations, 200 originals, half of them at n=25 per cell, publish only if p<.05, replication at 2.5x the original n, the predicted-vs-observed thing separates the two cases cleanly, which is of course because I built the simulation.)

  Who's in the room: my committee is a social psychologist who was an early preregistration advocate and now mostly says the whole crisis was a measurement problem all along; a biostatistician who works on post-selection inference and is convinced error probabilities are the only thing doing real work in any of this and that Bayes factors are a way of laundering assumptions; and a philosophy of science person who works on evidential pluralism and will want to know whether my gap is meant to be a statistical quantity or a causal one, because if it's causal I haven't identified anything. Then the department: experimentalists who've each done one preregistered replication and think of themselves as reformers, two econ-adjacent people for whom power analysis is the beginning and end of method, and at least one person who will want me to quote exact numbers from the big multi-lab replication projects — I always get those mixed up, so please just give me a line to say when that comes rather than the numbers.

  What I want from you:

  - Eight or so objections in the order of how much damage they'd do to the chapter, not how likely they are, each attributed to the kind of person above and phrased the way that person would actually put it — the biostatistician's version of "your prior is estimated from published effects" sounds nothing like the philosopher's version.
  - What I should concede in the first two minutes, before anyone asks, so I don't spend the defense looking like I'm protecting the framing.
  - For each objection: a one-to-two-minute reply and a note on exactly where that reply is soft. Be honest about the softness — if a reply is garbage say so, that's the most useful thing in the sheet.
  - The question I'm hoping nobody asks. I think it's something like: if the benchmark is fitted to the very same published estimates that went through the publication filter, isn't my "gap" just the filter reconstituted, and therefore guaranteed to have whatever sign I need? But you tell me if there's a worse one.
  - And the thing I actually want most: for each objection, say whether failing to answer it should make me drop the calibration-gap framing entirely or just weaken it, and give me one concrete result — the shape of a simulation, a pattern in real replication data, whatever — that would make you abandon the gap measure yourself. I'd rather have the falsifier than the reassurance; if your answer is uniformly "this is basically fine" I won't believe it.
reasoning: |-
  Okay, the user is preparing for their thesis chapter defense in quantitative psychology. They need a Q&A prep sheet focused on potential objections rather than the defense itself. Let me break down their request.

  First, the core of their work is the "calibration gap" concept. They argue that the standard replication rate is misleading because it doesn't account for expected failure based on original studies' effect sizes and standard errors. Their hierarchical model predicts replication rates from original data alone, then compares to actual outcomes. This gap reveals whether failures are due to low power (expected) or other issues like artifacts (unexpected). The second half ties disagreements in the replication crisis to prior differences, claiming their gap measure is prior-robust.

  Now, considering the audience:  
  - Social psychologist: Early prereg advocate, sees crisis as measurement problem.  
  - Biostatistician: Focuses on error probabilities, skeptical of Bayes factors.  
  - Philosopher of science: Cares about statistical vs. causal interpretation.  
  - Experimentalists: Reform-minded, done prereg replications.  
  - Econ-adjacent: Power analysis purists.  
  - Detail-oriented: Will ask for specific numbers from big replication projects.

  The user wants:  
  1. Eight objections ordered by potential damage (not likelihood), attributed to specific personas.  
  2. What to concede upfront.  
  3. For each objection: reply, its weaknesses, and how critical it is to their framework.  
  4. The "question they hope nobody asks."  
  5. Falsifiers for each point—what evidence would make them abandon the gap measure.

  Hmm, structuring objections by damage: The most damaging would be ones undermining the core methodology, like the benchmark being circular due to publication bias. Next, issues with prior robustness or causal claims. Then practical concerns like real-data applicability.

  For concessions: They should preemptively admit the gap isn't causal and real-data noise affects precision. Shows they're not defensive.

  The nightmare question: Probably about circularity—if the benchmark is fitted to published estimates, isn't the gap just repackaging publication bias? That could invalidate the whole approach.

  Falsifiers matter most. For example, if simulations show the gap stays near zero even when bias increases, that'd kill the measure. The user wants rigor, not reassurance.

  Need to ensure replies sound authentic to each persona:  
  - Biostatistician: Technical, "error probabilities" lingo.  
  - Philosopher: Abstract, "causal identification" focus.  
  - Social psych: Pragmatic, "measurement" angle.  

  Also, reminding them to dodge exact replication-project numbers by admitting they'll defer to sources—prevents embarassing mix-ups.

  Finally, the "abandon gap" thresholds: Each objection needs a clear failure condition (e.g., gap insensitive to p-hacking in sims). That’s what the user genuinely wants—accountability.
answer: |-
  Here's a stripped-down Q&A prep sheet focused on high-damage objections, ordered by potential to invalidate your core contribution. I've included concessions, replies with soft spots, criticality assessments, and falsifiers. **Bold = persona attribution**; *Italics = your concession/reply framing*.

  ---

  ### **Preemptive Concessions (Open With These)**
  1. *"The calibration gap is descriptive, not causal. It doesn't identify *why* estimates are miscalibrated—only that they are."*  
  2. *"Real-world replication noise (e.g., contextual differences, operationalization drift) isn't fully modeled. My simulation assumes perfect construct validity."*  
  3. *"The gap relies on parametric assumptions (hierarchical model). If the true data-generating process violates these, it breaks."*

  ---

  ### **Objections by Damage Level**  
  *(High to Low Damage | Persona-Specific Phrasing → Reply → Softness → Criticality → Falsifier)*  

  1. **Biostatistician**:  
     *"You’re using the same publication-filtered data to define the benchmark *and* test it. That’s circular: your model absorbs the winner’s curse, so the gap is just repackaged sampling error. Show me the Type I error rate."*  
     → *Reply:* "The benchmark isn't a null hypothesis—it's a *predictive* check. I simulate replications from the model fitted to originals *before* seeing outcomes. Circularity would require the model to be misspecified; we tested robustness via simulations where true effects were known (e.g., gap ≈0 when no bias)."  
     → **Soft**: Assumes model captures all bias. If publication bias is more complex (e.g., p-hacking), the benchmark *underfits* and gap is inflated.  
     → **Criticality**: **Fatal if true**. Drops framing if unanswered.  
     → **Falsifier**: Simulation where gap ≠0 even with *no* publication bias (e.g., all studies run unbiasedly at low power).  

  2. **Philosopher**:  
     *"You claim this is prior-robust, but your hierarchical model *is* a prior. If the hyperprior on effect sizes is misspecified (e.g., not Gaussian), your ‘gap’ just reflects your modeling choices, not evidence."*  
     → *Reply:* "The gap measures *empirical* mismatch between predicted and actual replications. I tested sensitivity: with 200 studies, gap direction holds across hyperpriors (e.g., half-normal, uniform). Robustness comes from predictive accuracy, not prior truth."  
     → **Soft**: With small N or skewed effect distributions, hyperprior choice dominates.  
     → **Criticality**: **Weaken framing** (gap is model-dependent).  
     → **Falsifier**: Gap direction flips under plausible hyperpriors in simulations with realistic N (e.g., 50 studies).  

  3. **Econ-Adjacent**:  
     *"Power *is* the benchmark. Your gap is redundant—if originals are underpowered, predicted replication rate is low, and low observed rate isn’t surprising. Why not just report expected vs. actual power?"*  
     → *Reply:* "Power assumes a *point* effect size. My model accounts for uncertainty in *which* effects are real and their heterogeneity. Two fields with identical power can have different gaps if one has inflated effect sizes."  
     → **Soft**: If all true effects are identical, gap ≈ (1 - power) – observed failures. Redundancy risk.  
     → **Criticality**: **Weakens framing** if gap adds no insight beyond power.  
     → **Falsifier**: In real data, gap correlates near-perfectly (|r|>0.9) with simple expected power.  

  4. **Biostatistician (Follow-Up)**:  
     *"Error probabilities handle selection *without* priors. Your gap is a Bayesian solution to a frequentist problem—it conflates evidence with decision rules."*  
     → *Reply:* "The gap evaluates the *system*, not individual studies. Frequentist metrics (e.g., p-values) can’t quantify aggregate miscalibration without arbitrary thresholds."  
     → **Soft**: True, but gap doesn’t prescribe actions (e.g., which studies to discard).  
     → **Criticality**: **Contextual** (framing holds if goal is diagnostic).  
     → **Falsifier**: If gap correlates perfectly with mean |z-score| difference in replications.  

  5. **Philosopher**:  
     *"Is the gap measuring statistical miscalibration or causal drift? If heterogeneous contexts explain replication failures, your gap punishes external validity—which isn’t a ‘crisis’."*  
     → *Reply:* "It measures statistical miscalibration *given the model*. Contextual drift would inflate the gap, but we’d expect symmetric noise; systematic gaps suggest inflated originals."  
     → **Soft**: Can’t disentangle statistical artifact from contextual shifts.  
     → **Criticality**: **Weaken interpretation** (gap isn’t "evidence of bias").  
     → **Falsifier**: Gap remains large in replications with identical protocols/materials.  

  6. **Social Psychologist**:  
     *"You assume original SEs are correct. But if measurement error differs between original and replication labs, your benchmark is garbage. This is why I say it’s a measurement problem."*  
     → *Reply:* "Differential measurement error would widen the gap, but in projects like [OSC 2015], protocols were standardized. We can test sensitivity by inflating replication SEs in simulations."  
     → **Soft**: No way to rule out measurement differences in real data.  
     → **Criticality**: **Limits generalizability** (framing holds for standardized replications).  
     → **Falsifier**: Gap disappears when adding ±20% noise to original SEs.  

  7. **Experimentalist**:  
     *"In [Realistic Example], your gap would be large, but we *know* the effect is real. Doesn’t this penalize noisy literatures unfairly?"*  
     → *Reply:* "A large gap doesn’t mean effects are *unreal*—it means original estimates were too optimistic. Noisy literatures *should* predict more failures. The gap quantifies that disconnect."  
     → **Soft**: Doesn’t address "real but small" effects.  
     → **Criticality**: **Minor** (misinterpretation risk).  
     → **Falsifier**: Gap is large for a literature later validated by meta-analysis.  

  8. **Detail-Oriented Department Member**:  
     *"Apply your method to OSC 2015. What’s the gap? If you can’t answer, this is just theory."*  
     → *Reply:* *"I’ll follow up with exact numbers post-defense. Preliminary: OSC’s 36% replication rate was lower than our model predicted from originals (~50-60%), suggesting miscalibration beyond power. But I’d caution against overinterpreting small-N examples."*  
     → **Soft**: Avoids specifics; admits small-N fragility.  
     → **Criticality**: **Credibility hit** if evasive.  
     → **Falsifier**: Applied to OSC/RPP, gap ≈0 despite high failure rate.  

  ---

  ### **The Nightmare Question**  
  **Biostatistician/Philosopher Hybrid**:  
  *"Your benchmark is fitted to published effects, which are selected for significance. Since selection inflates effect sizes, your model *expects* replication failures even with no publication bias. Doesn’t that make the gap uninterpretable—always negative?"*  
  → **Why it’s deadly**: Attacks the core premise. If the gap is artifactually negative, it can’t distinguish "crisis" from normal selection.  
  → *Reply:* "Simulations show gap ≈0 when only selection (no bias) is present. Inflation is *included* in the benchmark—so a negative gap implies *additional* miscalibration (e.g., p-hacking)."  
  → **Soft**: Assumes selection is perfectly modeled. If real selection is worse (e.g., file-drawer problems), gap could be false positive.  
  → **Falsifier**: Gap is always negative in simulations with selection but no other bias.  

  ---

  ### **When to Abandon the Gap**  
  Drop the framing entirely **only if**:  
  - Falsifier #1 holds (gap ≠0 with no bias) **or**  
  - Nightmare question’s falsifier holds (always negative with selection).  

  Otherwise, weaken claims (e.g., "diagnostic tool for specific contexts") but keep the measure.  

  **Final Tip**: When asked for numbers from big projects, say:  
  >*"I defer to the original publications for exact figures—my focus is methodological. But broadly, OSC/RPP show replication rates of 35-50%, while our models predicted 50-65% based on published estimates alone, suggesting a gap."*  

  Go in confident. You've built a clever diagnostic—own its limits.
