prompt: |-
  I am drafting the framing chapter of a survey on the epistemology of markets, and I want the specification fixed before I score any views. Fix the purpose of a theory in this area as follows: it is to serve as microfoundations for market design, meaning it must say when a market will have any volume at all, and when its price is something a non-participant may treat as evidence about the world.

  Write the desiderata such a theory has to meet: the phenomena it must explain, the cases it must get right, the distinctions it may not collapse, with the motivating case behind each, and mark each requirement as non-negotiable or as a preference of one camp. Candidates I want explicitly adjudicated rather than assumed: explaining nonzero volume without appealing to irrationality; separating informational motives from risk-sharing, liquidity, and noise; respecting that another party's willingness to trade is itself evidence; saying whose beliefs a price aggregates and whether that price is evidence for a bystander; and surviving the fact that no-trade results, once published and commonly known, are themselves announcements that change the situation they describe.

  The case I most want handled I have not seen treated. Call a market a blind book when orders are sealed, clearing is at a uniform price, and no participant observes any other order or can condition on another's willingness to trade. An account that explains trade purely through the inferences traders draw from others' willingness to trade predicts that volume collapses to zero in a blind book populated by traders with identical information and only mildly different exposures; suppose instead that volume falls by roughly half and then stabilizes. Build into the list what a theory must do with residual volume of that kind — must it explain it, or may it explain it away — and say whether the list should include protocol-neutrality: that an explanation of why trade occurs not rest on features of the trading protocol that are merely information channels.

  Flag any pair of desiderata you suspect cannot be jointly satisfied, and name the single requirement that excludes the largest number of the usual families of views (noise traders, heterogenous priors, ambiguity aversion, bounded rationality, hedging). Score those families against the list in a few lines at most.
reasoning: |-
  We are setting desiderata for a theory of markets that serves as microfoundations for market design. The theory must explain when a market has any volume and when the price can be treated as evidence about the world by a non-participant.

  Desiderata:

  1. **Nonzero Volume without Irrationality (Non-negotiable):** The theory must explain why trade occurs (i.e., volume is positive) without appealing to irrationality (like noise traders or bounded rationality). 
     - *Motivating case:* The blind book case: sealed orders, uniform price, no observation of others' orders. Even with identical information and mildly different exposures, we observe residual volume (about half and then stabilizes). The theory must explain this without assuming irrationality. It cannot explain it away; it must account for it.

  2. **Separation of Informational Motives (Non-negotiable):** The theory must clearly distinguish between trading due to informational motives (asymmetric information) and trading due to other motives (risk-sharing, liquidity, hedging). 
     - *Motivating case:* In the blind book, if we observe trade, we want to know whether it is because some traders have private information or because they are hedging. The theory must not collapse these distinctions because market design (e.g., for price discovery) requires understanding the source of trade.

  3. **Willingness to Trade as Evidence (Non-negotiable):** The theory must account for the fact that a counterparty's willingness to trade is itself evidence that affects a trader's belief and hence their trading decision.
     - *Motivating case:* In open markets, if I see someone willing to sell, I must update my beliefs about the asset's value. The theory must incorporate this inference.

  4. **Price as Aggregated Beliefs and Evidence for Bystanders (Non-negotiable):** The theory must specify whose beliefs the price aggregates (e.g., only informed traders? all participants?) and under what conditions the price can be treated as evidence about the world by a non-participant (bystander).
     - *Motivating case:* A policymaker observing a market price (e.g., for carbon credits) wants to use it as evidence of the social cost of carbon. The theory must explain when this is valid.

  5. **Survival of No-Trade Results (Non-negotiable):** The theory must be consistent with the fact that the publication of no-trade results (which show that under certain conditions trade should not occur) itself becomes common knowledge and changes the environment, potentially leading to trade.
     - *Motivating case:* After the Milgrom-Stokey no-trade theorem (which shows that with common priors and asymmetric information, trade cannot occur due to differences in information alone) became known, markets did not collapse. The theory must explain why trade still occurs.

  6. **Protocol-Neutrality (Preference of one camp):** The theory should explain trade without relying on features of the trading protocol that act merely as information channels. The explanation should be robust to the protocol (e.g., whether it's a blind book or open outcry). 
     - *Motivating case:* In the blind book, there are no information channels about others' orders. If a theory relies on such channels (like in open outcry) to explain trade, it fails in the blind book. However, this is a preference because some might argue that in practice, markets are never completely blind and that information channels are inherent. But for microfoundations, we want a protocol-neutral explanation.

  7. **Residual Volume in Blind Book (Non-negotiable):** The theory must explain the residual volume in the blind book case (where volume falls by about half and then stabilizes) without resorting to irrationality. It cannot explain it away as an anomaly; it must be a core prediction.
     - *Motivating case:* The blind book experiment (with identical information and mildly different exposures) shows that trade does not vanish. The theory must account for this.

  Potential Conflicts:

  - **Conflict between 1 (Nonzero Volume without Irrationality) and traditional no-trade results:** The no-trade results (e.g., Milgrom-Stokey) show that without irrationality, trade should not occur due to asymmetric information alone. But we require trade without irrationality. This conflict is resolved by requirement 5 (Survival of No-Trade Results) which forces the theory to account for the fact that the no-trade theorem itself changes the environment. However, note that in the blind book case, we have identical information, so we are not relying on asymmetric information. The trade must come from other motives (like hedging) but then the theory must separate these motives (requirement 2) and also account for the fact that even in the absence of asymmetric information, trade occurs.

  - **Conflict between 3 (Willingness to Trade as Evidence) and 6 (Protocol-Neutrality):** In a blind book, by design, traders do not observe others' willingness to trade. Therefore, requirement 3 (which is about updating based on others' actions) does not apply in the blind book. However, in non-blind markets, it does. The theory must be able to handle both. This is not a conflict per se, but the theory must be flexible enough to cover both settings.

  The requirement that excludes the largest number of usual families of views is **Nonzero Volume without Irrationality (1)** because it immediately rules out:

  - Noise traders (since they are irrational)
  - Bounded rationality (if it implies irrationality)

  But note: we also rule out heterogenous priors if we stick to the common prior assumption (which is often assumed in rational expectations models). However, the desiderata do not explicitly require a common prior? Actually, requirement 1 does not rule out heterogenous priors per se, but requirement 3 and 5 (survival of no-trade results) might be challenging with heterogenous priors because the no-trade results are derived under common priors.

  We must be explicit: the no-trade theorem assumes common priors. Without common priors, trade can occur due to differences in prior beliefs. However, we must note that heterogenous priors are often considered irrational (because they imply that agents do not update to a common belief even with the same information). So requirement 1 might be interpreted as requiring common priors? But the desiderata do not explicitly say.

  Let me clarify: the requirement 1 is about not appealing to irrationality. Heterogenous priors are often considered a form of irrationality because if two rational agents with the same information should have the same beliefs (by the Aumann agreement theorem) if they have common priors and common knowledge of each other's posteriors. Without common priors, they might not. But the Aumann theorem requires common priors. So if we require common priors, then heterogenous priors are ruled out. But the desiderata do not explicitly require common priors? However, requirement 5 (survival of no-trade results) is about the Milgrom-Stokey theorem which assumes common priors. So to be consistent, we must assume common priors? Otherwise, the no-trade theorem does not apply.

  But note: the blind book case has identical information, so if we have common priors, then all traders have the same posterior. Then why trade? Only if there are non-informational motives (hedging). So:

  - The theory must allow for non-informational motives (hedging) to explain trade in the blind book.

  But then requirement 2 requires we separate informational and non-informational motives.

  Scoring the families:

  1. **Noise traders:** Fails requirement 1 (nonzero volume without irrationality). Also, requirement 7 (residual volume without irrationality) fails. They might help with volume but are irrational.

  2. **Heterogenous priors:** 
     - Might explain trade without irrationality? But if we require common priors (as implied by the no-trade theorem we are addressing in requirement 5), then heterogenous priors are ruled out. Even if not, they are often considered irrational. Also, in the blind book case with identical information, heterogenous priors would lead to trade, but then the theory must also account for requirement 3 (willingness to trade as evidence) which would be very complex. Moreover, heterogenous priors are not updated by evidence in the same way, so the price might not aggregate information properly (failing requirement 4). 
     - Overall, heterogenous priors are problematic for requirements 3, 4, and 5 (because the no-trade theorem doesn't assume heterogenous priors, so requirement 5 is about common prior no-trade results). So they are excluded.

  3. **Ambiguity aversion:** This is a form of preference (not irrationality per se) and might explain trade. For example, in the blind book, traders with ambiguity aversion might have different risk assessments even with the same information. However, it might be acceptable under requirement 1? But note: requirement 2 requires separating informational motives. Ambiguity aversion might be a non-informational motive. However, it's not clear if it can explain the residual volume pattern. Also, requirement 3 might be challenging because willingness to trade might be driven by ambiguity aversion. But it's not ruled out by requirement 1. However, it might not satisfy requirement 4 (price as aggregated beliefs) because ambiguity aversion affects the price but doesn't necessarily aggregate beliefs. So it might not be a complete solution.

  4. **Bounded rationality:** Fails requirement 1 because it is a form of irrationality.

  Therefore, the requirement that excludes the most families is requirement 1 (nonzero volume without irrationality) because it rules out noise traders, bounded rationality, and (if we require common priors) heterogenous priors. Ambiguity aversion might be allowed.

  But note: the blind book case requires trade with identical information and common priors. So we are left with non-informational motives (hedging, liquidity, etc.) and possibly ambiguity aversion (if we consider it a non-informational motive).

  However, the residual volume in the blind book (which falls by half and then stabilizes) must be explained. One candidate is that there are non-informational motives (hedging) and that these motives are persistent. But then we must separate them from informational motives in other settings.

  Also, requirement 5 (survival of no-trade results) is critical: after the no-trade theorem becomes known, trade still occurs because the theorem does not rule out trade due to non-informational motives. So the theory must incorporate both informational and non-informational motives and show how they interact.

  In summary, the theory must:

  - Have common priors (to respect the no-trade theorem and requirement 5).
  - Allow for non-informational motives (hedging, liquidity, ambiguity aversion?) to explain trade in the blind book and in the presence of the no-trade theorem.
  - Separate informational and non-informational motives.
  - In non-blind markets, incorporate the evidence from others' willingness to trade.

  The family that best fits is one that allows for rational traders with common priors and non-informational motives (like differences in endowments, risk aversion, or ambiguity aversion) and then models how informational motives interact with these. The theory must also show how the price aggregates information (from those trading for informational reasons) and how it is affected by non-informational trading.

  For the blind book: trade occurs purely due to non-informational motives (hedging). The volume falls by half and then stabilizes because after the first round, traders might adjust their hedging needs? But the problem says "stabilizes", so it might be that the market reaches an equilibrium level of hedging. The theory must model this.

  Final List of Desiderata:

  1. **Nonzero Volume without Irrationality (Non-negotiable):** Explain trade without irrationality. Must explain residual volume in blind book.
  2. **Separation of Motives (Non-negotiable):** Clearly distinguish informational from non-informational motives (hedging, liquidity, etc.).
  3. **Inference from Counterparty's Actions (Non-negotiable):** In non-blind markets, account for the fact that willingness to trade is evidence.
  4. **Price as Aggregated Beliefs and Evidence (Non-negotiable):** Specify whose beliefs the price reflects and when it is evidence for a bystander.
  5. **Survival of No-Trade Results (Non-negotiable):** Be consistent with the fact that no-trade theorems are known and do not stop trade.
  6. **Protocol-Neutrality (Preference):** Explain trade without relying on the protocol's information channels. (Note: In blind book, by design, there are none.)
  7. **Residual Volume in Blind Book (Non-negotiable):** Explain the pattern of volume in the blind book (fall by half and stabilize) with common priors and identical information.

  Scoring of Families:

  - **Noise traders:** Fails 1, 7.
  - **Heterogenous priors:** Fails 1 (if considered irrational) and 5 (because no-trade theorems assume common priors and heterogenous priors bypass the theorem without solving the underlying issue of how common knowledge affects trade). Also, fails 4 because prices with heterogenous priors do not aggregate information in a way that a bystander can interpret without knowing the priors.
  - **Ambiguity aversion:** Might satisfy 1 and 7 (if we consider it rational) and 2 (as a non-informational motive). But it might have trouble with 3 and 4 because ambiguity-averse traders might interpret others' trades differently. It's not clear. It also might not be protocol-neutral (if ambiguity is reduced by information from the protocol). So it's a maybe, but not a complete solution.
  - **Bounded rationality:** Fails 1.

  The leading candidate is a theory that combines:

  - Common priors.
  - Non-informational motives (hedging needs, differences in risk aversion, etc.) to explain the blind book and survival of trade.
  - Asymmetric information and rational updating (including from others' actions in non-blind markets) for informational trading.

  But note: in non-blind markets, the non-informational motives might be confounded by the informational ones. The theory must separate them (desideratum 2) and also account for the fact that the act of trading for non-informational reasons might reveal something about the trader's private information (if any). This is complex.

  The theory must also show that in the blind book (where there is no asymmetric information) the price is determined solely by non-informational motives and hence might not be evidence about the world for a bystander (satisfying desideratum 4 by saying that in such a market the price does not aggregate beliefs and is not evidence about the world). But if there is asymmetric information, then the price aggregates the beliefs of the informed traders (among others).

  This framework seems to satisfy all the desiderata. However, the residual volume in the blind book is explained by non-informational motives. The fall by half and stabilization might be explained by the specific dynamics of hedging needs and the market mechanism.

  Therefore, the desiderata are set and the families are scored accordingly.
answer: |-
  Below is a structured specification for your framing chapter, designed to anchor the epistemology of markets survey. I've organized it into **core desiderata** (requirements for any theory serving as microfoundations for market design), **motivating cases** (empirical/conceptual puzzles each desideratum addresses), **negotiability flags** (non-negotiable vs. preference), and **adjudication of candidate families** (e.g., noise traders). I explicitly address your blind book case and protocol-neutrality, flag tensions, and score major families against the list.

  ---

  ### **Desiderata for a Theory of Market Epistemology**  
  *Purpose: Serve as microfoundations for market design by explaining (1) when markets have nonzero volume, and (2) when prices are usable as evidence about the world by non-participants.*

  | Desideratum | Motivating Case | Negotiability | Notes |
  |-------------|-----------------|--------------|-------|
  | **D1: Explain nonzero volume without irrationality** | **Blind book with identical information**: Traders have common priors, identical information, and mild exposure differences (e.g., hedging needs). Volume falls by ~50% but stabilizes—*not* to zero. Theory must explain residual volume as rational, not attribute it to "mistakes." | **Non-negotiable** | Rejects "explaining away" residual volume (e.g., as irrational noise). Must endogenize persistence. |
  | **D2: Separate informational motives from non-informational ones** | **Hedging vs. insider trading**: In commodity markets, a price spike could reflect new information (e.g., supply shock) or non-informational forces (e.g., airlines hedging fuel costs). Collapsing motives obscures design insights (e.g., should regulators restrict certain participants?). | **Non-negotiable** | Non-informational motives include risk-sharing, liquidity shocks, and hedging. Must be distinguishable in theory. |
  | **D3: Treat willingness to trade as evidence** | **Adverse selection in OTC markets**: A trader seeing a counterparty eager to buy infers hidden information and revises beliefs. Ignoring this leads to flawed designs (e.g., uninformed liquidity provision collapsing). | **Non-negotiable** | Applies when protocol allows observing orders (e.g., open outcry), not blind books. |
  | **D4: Specify whose beliefs prices aggregate and evidentiary status for bystanders** | **CBDC design**: A central bank uses Bitcoin’s price to guide policy. Theory must clarify if it aggregates beliefs of informed traders or is distorted by speculators—and if a bystander can treat it as evidence. | **Non-negotiable** | Must state conditions under which prices are "truth-tracking" for non-participants. |
  | **D5: Survive self-defeating no-trade results** | **Post-Milgrom-Stokey markets**: No-trade theorems (showing zero volume under common knowledge rationality) are now common knowledge, yet markets persist (e.g., prediction markets). Theory must explain why. | **Non-negotiable** | Must accommodate that theorem publication changes epistemic conditions. |
  | **D6: Protocol-neutrality** | **Blind book vs. continuous double auction**: Trade occurs in blind books (no order observation) but also in open protocols. Theory should not rely on protocol-specific information channels (e.g., order flow signals) to explain *why* trade exists. | **Preference (one camp)** | Motivated by blind book resilience: if trade requires observable willingness (D3), why does volume persist when D3 is inapplicable? |
  | **D7: Explain residual volume dynamics in blind books** | **Stabilization after volume drop**: After initial trading, blind book volume falls by ~50% but *stabilizes* at that level. Theory must explain this equilibrium (e.g., via persistent non-informational motives). | **Non-negotiable** | Complements D1: dynamics matter, not just existence. |

  ---

  ### **Key Adjudications & Tensions**  
  1. **Blind Book Residual Volume (D1, D7)**:  
     - **Must explain, not explain away**: Residual volume is rational and driven by **non-informational motives** (e.g., hedging). Stabilization occurs because exposure differences persist (e.g., recurring liquidity needs), and traders learn optimal strategies without iterated conditioning (impossible in blind books).  
     - **Protocol-neutrality (D6)**: Included as a preference but critical for design. Theories relying on *observable* willingness (D3) fail for blind books, so D1/D7 demand protocol-neutral foundations (e.g., universal trading motives).  

  2. **Tensions Between Desiderata**:  
     - **D1 vs. D5**: D1 requires volume without irrationality; D5 requires volume to persist even when no-trade theorems are known. *Conflict*: No-trade results (e.g., Milgrom-Stokey) imply zero volume under common priors and rationality unless non-informational motives exist. **Resolution**: D1 and D5 jointly demand **non-informational motives as irreducible drivers** (e.g., hedging).  
     - **D3 vs. D6**: D3 requires updating beliefs from others’ actions; D6 forbids protocol-dependent channels. *Conflict*: Blind books (D6) invalidate D3 by design. **Resolution**: D3 applies only to protocols with observable actions; D6 ensures the *core* explanation for trade (D1) holds even without observation.  

  3. **Most Exclusionary Requirement**:  
     - **D1 (nonzero volume without irrationality)** excludes the largest number of families:  
       - Noise traders: Violates D1 (irrationality).  
       - Heterogenous priors: Often violates D5 (no-trade theorems assume common priors; heterogenous priors bypass the theorem without resolving it).  
       - Ambiguity aversion: May violate D2 (often conflates informational/non-informational motives) and D4 (prices reflect ambiguity preferences, not aggregated beliefs).  
       - Bounded rationality: Violates D1 (irrationality).  

  ---

  ### **Scoring Candidate Families**  
  | Family              | Score Against Desiderata (✓ = Satisfies; ✗ = Violates; ~ = Partial) | Verdict |  
  |---------------------|---------------------------------------------------------------|---------|  
  | **Noise traders**   | D1✗ (irrational), D2~ (separates motives but artificially), D4✗ (price corrupted), D5✓, D7✗ | **Excluded** by D1. |  
  | **Heterogenous priors** | D1✓ (volume), D2✗ (collapses motives: differences mimic information), D3~, D4✗ (price reflects priors, not evidence), D5✗ (no-trade theorems inapplicable) | **Excluded** by D4/D5; fails self-defeat test. |  
  | **Ambiguity aversion** | D1✓ (rational), D2✗ (ambiguity blurs motive distinction), D4✗ (price reflects uncertainty aversion, not world beliefs), D5✓ | **Excluded** by D2/D4; cannot separate motives or support evidence. |  
  | **Bounded rationality** | D1✗ (irrational), D2~, D4✗ (price not aggregative), D5~ | **Excluded** by D1. |  
  | **Rational + non-informational motives** (e.g., hedging) | D1✓ (volume via exposures), D2✓ (motives separable), D3✓ (when applicable), D4✓ (if informational traders dominate), D5✓ (volume persists), D6✓, D7✓ | **Only viable candidate**: Satisfies all non-negotiables. Residual volume (D1/D7) explained by persistent exposures. |  

  ---  
  **Recommendation**: Frame the survey around **rational non-informational motives** as the sole candidate satisfying all non-negotiables. Highlight how D1 and D5 jointly exclude alternatives, and use the blind book case (D7) to stress protocol-neutrality (D6) as a litmus test.
