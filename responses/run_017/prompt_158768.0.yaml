  We are tackling a complex translation task from Lewis's philosophy of convention to the vocabulary of multi-agent reinforcement learning (MARL) and rationalist discourse. We proceed step by step.

  ### Step 1: Understanding Lewis's Definition
  Lewis defines a convention as:
  1. A **regularity R** in behavior.
  2. In a population **P**.
  3. In recurrent situations of type **S**.
  4. Such that nearly everyone in P conforms to R in S.
  5. Nearly everyone in P expects nearly everyone else in P to conform to R in S.
  6. Nearly everyone in P prefers to conform to R on condition that nearly all others conform to R. (This makes R a coordination equilibrium.)
  7. There exists at least one alternative regularity R' that would have been a coordination equilibrium if others had conformed to it (the arbitrariness condition).
  8. Conditions (4)-(7) are **common knowledge** in P.

  Additionally, Lewis provides a bootstrapping story: conventions can emerge without agreement via salience, precedent, and reasoning by analogy, gradually turning a coincidence into a rule. The application to language involves sender-receiver signaling games: a sender observes a state and sends a signal; a receiver observes the signal and takes an action. The meaning of the signal emerges as a coordination equilibrium.

  ### Step 2: Mapping to MARL and Rationalist Vocabulary
  We are given the following primitives:
  - **MARL**: agents, policies, joint policies, reward functions, best response, regret, Nash equilibrium, correlated equilibrium, equilibrium selection, self-play, population-based training, emergent communication, opponent modeling, gradient dynamics, basins of attraction, distribution shift.
  - **Rationalist Discourse**: coordination problems, focal points, common knowledge (as an infinite hierarchy of mutual expectations), multipolar traps, credible commitment, etc.

  We must translate each clause and the bootstrapping story.

  #### Part I: Translation

  **Clause 1: Regularity R in behavior.**
  - Translation: A **joint policy** (or a set of policies) that the agents in the population P follow in a given set of environment states (which correspond to situations of type S). The joint policy is a mapping from state (situation) to actions for each agent.

  **Clause 2: Population P.**
  - Translation: The set of agents we are considering.

  **Clause 3: Recurrent situations of type S.**
  - Translation: A set of environment states that occur repeatedly (i.e., they are in the support of the environment's state distribution). The agents must be able to recognize these states (or they are defined by the environment).

  **Clause 4: Nearly everyone conforms.**
  - Translation: In the joint policy, the probability of an agent in P deviating from the prescribed action in a state of type S is very low (i.e., the joint policy is followed with high probability).

  **Clause 5: Nearly everyone expects nearly everyone else to conform.**
  - Translation: Each agent has an **opponent model** (or a learned policy for others) that predicts, with high probability, that other agents will follow the joint policy in S. This expectation is mutual: each agent expects others to conform and each agent is expected by others to conform.

  **Clause 6: Preference to conform conditional on others conforming (coordination equilibrium).**
  - Translation: In the current joint policy, for each agent, the action prescribed by the joint policy (conforming) is a **best response** to the others conforming. That is, given that others are following the joint policy, no agent has an incentive to unilaterally deviate (it is a Nash equilibrium). Moreover, the condition that the agent prefers to conform only when others do is captured by the fact that the agent's reward (or expected return) is maximized by conforming when others conform.

  **Clause 7: Arbitrariness (alternative coordination equilibrium).**
  - Translation: There exists at least one other joint policy R' that is also a Nash equilibrium (or a coordination equilibrium) in the same situations of type S. That is, if the agents were following R', then each agent would also be playing a best response to the others playing R'. This alternative R' must be distinct from R.

  **Clause 8: Common knowledge.**
  - Translation: The conditions (4)-(7) are **common knowledge**. In the rationalist vocabulary, this is an infinite hierarchy of mutual expectations: everyone knows that (4)-(7) hold, everyone knows that everyone knows, and so on. In MARL, we can model this by requiring that the agents' policies and opponent models are such that the entire setup (the joint policy, the expectations, the preferences) is fixed under iterated reasoning about each other. However, note that common knowledge is an idealization and is difficult to achieve in practice. We may need to add an explicit representation of beliefs and mutual expectations (opponent modeling that includes modeling of the opponent's beliefs about oneself, etc.) and assume that the training process (e.g., via recursive reasoning in self-play) has led to convergence to a state that approximates common knowledge.

  **Bootstrapping Story:**
  - Lewis describes how conventions emerge without explicit agreement. In MARL, this can be seen as the result of **learning dynamics** (e.g., gradient descent in self-play or population-based training) that converge to a particular equilibrium. The role of **salience** can be captured by **focal points** that arise due to asymmetries in the environment or in the agents' representations. **Precedent** is the effect of past interactions: if a particular joint policy has been used successfully in similar situations, it becomes more likely to be chosen again. **Reasoning by analogy** might be implemented by generalization in the policy network (e.g., similar states are mapped to similar actions). The gradual accretion of expectations is the process of **equilibrium selection** via learning, where a chance coordination (a coincidence) becomes stabilized by mutual expectations.

  **Signaling Game Application:**
  - We consider a sender-receiver game. The environment state (which the sender observes) is the "state of the world". The sender sends a signal (from a set of available signals) to the receiver. The receiver then takes an action. The agents share a reward function that depends on the state and the action (e.g., the receiver gets a positive reward only if the action matches the state). A convention here is a joint policy (a signaling protocol) that specifies the sender's mapping from states to signals and the receiver's mapping from signals to actions. This joint policy must be a coordination equilibrium: if the sender uses the protocol, the receiver's best response is to use the protocol, and vice versa. The arbitrariness condition holds because multiple different mappings (e.g., different signal assignments) can be equilibria. The meaning of the signal is the state-action association that emerges from the equilibrium.

  #### Part II: Residue Report

  We sort the translation into three buckets:

  **Clean Translation (no loss):**
  - Regularity R → Joint policy.
  - Population P → Set of agents.
  - Recurrent situations S → Recurrent environment states (with the caveat that the environment must generate such states, and the agents must be able to recognize them).
  - Conformity (nearly everyone conforms) → High probability of following the joint policy.
  - Preference to conform conditional on others conforming → The joint policy being a Nash equilibrium (each agent's policy is a best response to the others).
  - Arbitrariness → Existence of an alternative joint policy that is also a Nash equilibrium.
  - Bootstrapping via learning dynamics → Emergence of a joint policy via self-play or population training, with focal points and precedent captured by the dynamics of equilibrium selection.
  - Signaling game → A specific type of coordination game in MARL, with the emergence of a communication protocol as a Nash equilibrium.

  **Distorted Translation (bent):**
  - **Expectations (Clause 5)**: Lewis requires that agents have explicit expectations about others. In MARL, we can use opponent models (which are learned and maintained by agents) to represent expectations. However, in many MARL systems, agents do not have explicit opponent models but rather learn policies that implicitly condition on others' behavior. This is a distortion: we are representing an explicit belief state with an implicit one. The distortion is that Lewis's agents have a cognitive state of belief, while our agents might only have a behavioral tendency. The direction: we are weakening the requirement to behavioral regularity without necessarily an explicit representation of belief.

  - **Common knowledge (Clause 8)**: We are forced to approximate. In MARL, we can have mutual expectations of finite depth (e.g., level-k reasoning) but not an infinite hierarchy. The distortion is that we are replacing an idealization (common knowledge) with a finite approximation. The direction: we are weakening the requirement. However, in practice, for a convention to be stable, we might require that the equilibrium is robust under iterated best responses (which is a form of common knowledge). We might also note that in the limit of training, if the joint policy is a fixed point of the learning dynamics and is known to be fixed, then it might be common knowledge.

  - **Arbitrariness counterfactual (Clause 7)**: We require the existence of an alternative joint policy R'. In MARL, we can define this as a counterfactual: is there another Nash equilibrium in the game? However, if the game is not fully known (e.g., in a complex environment) then we are relying on the agents' models. The distortion: we are making the counterfactual relative to the agents' learned models of the game, which might not match the true game. The direction: we are making the counterfactual internal to the agents' representations.

  **No Expression:**
  - **Normativity**: Lewis's convention has a normative element: it provides a reason for action. In MARL, we have reward maximization. The reason for action is that conforming yields higher reward. However, Lewis's account might be interpreted as having a stronger normative force: the convention is a reason that is socially recognized. In the MARL framework, we only have the reward function, which is built into the agent. We have no expression for the social recognition of the reason. This is a residue.

  - **Recognition of situation types S**: Lewis assumes that the agents can recognize the recurrent situation type. In MARL, we assume the environment states are given, but we might need to add that the agents have a mechanism to recognize and classify states into types (e.g., via state representation). This is an addition: we need a state representation that generalizes appropriately.

  #### Part III: Stress Cases

  **1. Public signal with no one behind it.**
  - Translation: Two agents condition their behavior on a shared random environmental signal (a correlated equilibrium). They have no hierarchy of expectations about each other; they just react to the signal.
  - Evaluation: Lewis would not call this a convention because there is no mutual expectation about others' behavior. The agents are not conforming to a regularity because they expect others to conform; they are reacting to an external signal. The translation in Part I requires mutual expectations (Clause 5) and common knowledge (Clause 8). Therefore, we must add that the agents have expectations about each other. But in this case, they don't. Thus, the translation would say no. The regress: if we try to say that there is a convention of "obeying the signal", we would need to check if that itself is a convention. But in this setup, the agents are trained to obey the signal without any mutual expectations. Therefore, it is not a convention on Lewis's terms. In the agents' actual working, there is no regress because they are simply conditioned by training to respond to the signal.

  **2. The alternative that cannot be represented.**
  - Translation: A population is locked in a bad joint policy (multipolar trap). The better joint policy is unrepresentable (due to parameterization) or unreachable (due to training dynamics).
  - Counterfactual: Lewis's arbitrariness condition requires that there exists an alternative R' that would have been a coordination equilibrium. But if R' is unrepresentable, then in the agents' policy space, it does not exist. The counterfactual "if others had conformed to R'" is not defined because R' is not available. Therefore, the arbitrariness condition fails. Lewis would not call this a convention. The translation in Part I requires the existence of an alternative joint policy (in the space of joint policies). Since it doesn't exist, the translation also says: no, it is not a convention. However, note: the agents might have a representation of the game that does not include R'. Then the counterfactual is not even considered. Thus, the translation captures Lewis correctly.

  **3. Sanctions rather than coordination.**
  - Translation: A regularity maintained by third-party punishment. Conforming is individually costly, and each agent would deviate if unobserved. This is not a coordination equilibrium but a punishment equilibrium.
  - Limitation: Lewis's analysis is limited to coordination problems. In our vocabulary, we can model the punishment as a modification to the reward function (reward shaping) that adds a penalty for deviation (if caught). However, the key is that without the punishment, the agents would not prefer to conform. So the conditional preference (conform if others conform) does not hold. Therefore, it is not a convention. The translation correctly excludes it. This is an honest scope restriction: Lewis is only analyzing conventions, which are coordination equilibria. Most norms (like this one) are not conventions.

  **4. Weights rather than beliefs.**
  - Translation: Lewis requires that agents expect and prefer. Our agents have parameters and gradients. We can represent "expects" by an opponent model (a learned model of others' policies) and "prefers" by the reward function and the policy (which is optimized for reward). But if we don't have explicit opponent models, we can still have an as-if interpretation: the agent behaves as if it expects and prefers.
  - Evaluation: Lewis's account does not break under an as-if reading. He was a functionalist about mental states: attitudes are defined by their role in behavior. So if the agent behaves as if it expects and prefers, then for Lewis, it does expect and prefer. Therefore, the as-if reading is acceptable. The account survives.

  #### Part IV: Verdict

  The residue:
  - **Normativity**: The missing element is the social recognition of the norm. In MARL, we have reward maximization, but the reason for action is purely individual. We might add that the agents have a representation of the convention as a social rule that they can reason about. This is an explanatory target that MARL might want to add, especially for modeling human-like conventions.

  - **Common knowledge**: The infinite hierarchy is an idealization. In practice, finite depth might suffice. MARL can model this with recursive opponent modeling (e.g., level-k). We do not see a need for the infinite hierarchy in engineered systems.

  - **Recognition of situation types**: This is an addition we made (state representation) but it is a natural part of MARL (agents must perceive the state).

  The main residue is the normativity. It might be that Lewis's account is capturing a phenomenon that is not just about behavior but about the agents' understanding of the convention as a reason. However, in the as-if reading, the behavior is what matters. Therefore, the difference might be verbal: Lewis and the MARL researcher are looking at the same behavior and calling it convention, but Lewis adds a story about mental states that the MARL researcher does not need.

  What would settle the question? Consider a population of MARL agents that have converged to a joint policy that satisfies the as-if conditions (including mutual expectations of finite depth). A Lewisian would call it a convention if they are willing to attribute the functional states (expectations and preferences). The MARL researcher would call it an equilibrium. There is no disagreement about the behavior. However, if we have a case where the agents behave as if they have a convention but without any internal representation of mutual expectations (like the public signal case), then the Lewisian would deny it is a convention, while the MARL researcher might not care about the internal structure. The observation that would settle it is whether the regularity breaks down when the agents are put in a situation where they have reason to believe that the mutual expectations have changed (even if the behavior has not changed yet). In the public signal case, if the signal becomes unreliable, the agents might break down immediately. In a true convention, they might adjust their expectations and behavior more flexibly. This would show the difference.

  In conclusion, the translation is largely successful with some distortions and one residue (normativity). The residue points to a gap in the MARL vocabulary for the social recognition of rules, but for engineering purposes, the as-if reading might suffice.
answer: |-
  ### Part I: Translation of Lewis's Conventions

  **Core Definition (Clause-by-Clause):**  
  1. **Regularity in behavior (R):** A high-probability joint policy \(\pi\) consistently executed by agents in population \(P\).  
  2. **Population (P):** A set of interacting agents with policy networks parameterized by \(\theta_i\).  
  3. **Recurrent situation-type (S):** A class of environment states \(s \in \mathcal{S}\) that recur across episodes, identifiable via state representations (e.g., embeddings).  
  4. **Conformity:** In \(s \sim \mathcal{S}\), \(\pi\) achieves near-universal adherence: \(\mathbb{P}(a_i \sim \pi_i, a_{-i} \sim \pi_{-i} \mid s) > 1 - \epsilon\) for all \(i\).  
  5. **Mutual expectations:** Each agent \(i\) maintains an *opponent model* \(\phi_i\) (e.g., via policy distillation or belief nets) that outputs high probability for others’ actions under \(\pi_{-i}\) in \(s\). *Addition: Explicit belief state.*  
  6. **Conditional preference (coordination equilibrium):** For all \(i\), \(\pi_i\) is a *best response* to \(\pi_{-i}\) in \(s\): \(\mathbb{E}[R_i(\pi_i, \pi_{-i}, s)] \geq \mathbb{E}[R_i(\pi'_i, \pi_{-i}, s)]\) for all deviations \(\pi'_i\).  
  7. **Arbitrariness (alternative equilibrium):** There exists an alternative joint policy \(\pi'\) such that: (i) \(\pi'\) is also a Nash equilibrium in \(s\), and (ii) \(\pi' \neq \pi\). *Addition: Counterfactual policy set (must be representable in policy space).*  
  8. **Common knowledge:** Conditions 4–7 are *common knowledge*. Rendered as:  
     - **Depth-0:** All agents know 4–7 hold.  
     - **Depth-k:** All agents know that all agents know (to depth \(k-1\)).  
     In practice, this requires *recursive opponent modeling* (e.g., agents simulate others’ simulations) and converges under self-play to fixed-point mutual beliefs. *Addition: Hierarchical belief machinery.*  

  **Bootstrapping Story:**  
  Conventions emerge via:  
  - **Salience (focal points):** Asymmetries in state representations (e.g., unique features of \(s\)) break symmetry during exploration, making one \(\pi\) *proto-focal*.  
  - **Precedent:** Past successes of \(\pi\) in similar \(s\) (via state generalization) reinforce its selection.  
  - **Reasoning by analogy:** Policy networks generalize across states (e.g., via attention mechanisms), extending \(\pi\) to analogous \(\mathcal{S'}\).  
  - **Accretion:** Random initial coordination (e.g., via noisy gradients) is amplified by policy gradients. Mutual expectations solidify via *opponent modeling*: as agents observe conformity, \(\phi_i\) updates to predict adherence, narrowing the basin of attraction to \(\pi\).  

  **Signaling-Game Application (Language):**  
  - **Setup:** Two agents (Sender \(S\), Receiver \(R\)) in a *partially observable environment*. \(S\) observes state \(s \in \mathcal{S}\), sends signal \(m \in \mathcal{M}\). \(R\) receives \(m\), takes action \(a \in \mathcal{A}\). Shared reward \(R(s, a)\) iff \(a = f(s)\) (e.g., \(a\) correct for \(s\)).  
  - **Convention as equilibrium:** A joint policy \(\pi = (\pi_S(s \to m), \pi_R(m \to a))\) where:  
    - \(\pi_S\) and \(\pi_R\) are mutual best responses (Nash equilibrium).  
    - Arbitrariness: Multiple bijections \(s \to m \to a\) are valid equilibria.  
  - **Emergence:** Via self-play with exploration. Random signaling stabilizes when \(R\)’s opponent model \(\phi_R\) infers \(S\)’s mapping, making \(\pi_R\) a best response. Common knowledge arises from mutual best-response consistency across episodes.  
  - **Meaning:** Signal \(m\) acquires "meaning" as the \(s \to a\) association that maximizes \(R(s, a)\) under \(\pi\).  

  ---

  ### Part II: Residue Report  
  **Clean Translation (No Loss):**  
  - Regularity, population, recurrence (Clauses 1–3): Mapped to joint policies, agent sets, and recurrent states.  
  - Conformity (Clause 4): Directly expressed as high-probability execution of \(\pi\).  
  - Coordination equilibrium (Clause 6): Nash equilibrium in rewards.  
  - Bootstrapping: Salience → focal points via state asymmetries; precedent → generalization; accretion → gradient dynamics.  
  - Signaling games: Emergent protocols as Nash equilibria.  

  **Distorted Translation (Bent Content):**  
  - **Mutual expectations (Clause 5):** Lewis’s "expects" implies explicit propositional attitudes. Translation uses *opponent models* \(\phi_i\), which are learned functions (e.g., neural nets). *Distortion:* Bent toward *implicit* expectations (model-free policies may lack \(\phi_i\)). *Direction:* Weaker—agents need not "believe" anything; \(\phi_i\) is just a predictive subroutine.  
  - **Arbitrariness (Clause 7):** Lewis requires agents to *conceive* of alternatives. Translation uses *representable policies* \(\pi'\). *Distortion:* Bent toward feasibility—if \(\pi'\) is inexpressible (e.g., outside network capacity), it doesn’t exist. *Direction:* Weaker—ignores *unimagined* alternatives.  
  - **Common knowledge (Clause 8):** Lewis requires *infinite* mutual knowing. Translation uses *finite-depth recursion* (e.g., \(k=2\) in practice). *Distortion:* Bent toward tractability. *Direction:* Weaker—true common knowledge is unrealizable.  

  **No Expression (Residue):**  
  - **Normativity:** Lewis’s "prefers to conform" implies convention supplies a *reason for action* (e.g., "ought"). MARL expresses this as reward maximization—*no normative force*. A convention is just an equilibrium; defection is just lower \(R_i\).  
  - **Situation-type recognition:** Lewis assumes agents *recognize* \(S\) as a type. MARL assumes states are given—*no theory of how agents learn/abstract situation types*.  

  ---

  ### Part III: Stress Cases  
  **1. Public signal with no one behind it:**  
  - **Translation:** Agents reach correlated equilibrium via environmental signal. No opponent models exist; actions condition on signal, not mutual expectations.  
  - **Evaluation:** *Not a convention.* Clause 5 (mutual expectations) fails—agents don’t expect anything *of each other*. Adding a "convention of obeying signals" regresses: Why obey? MARL agents avoid regress by hardwiring signal-response via training (gradients optimize \(R_i\), not mutual beliefs).  

  **2. Alternative that cannot be represented:**  
  - **Translation:** Lock-in to suboptimal \(\pi\) (multipolar trap). Alternative \(\pi'\) is unrepresentable (outside policy space) or unreachable (bad basin).  
  - **Counterfactual:** Lewis’s arbitrariness requires *possible* \(\pi'\). MARL cannot express counterfactuals about unrepresentable policies—\(\pi'\) "doesn’t exist."  
  - **Evaluation:** *Correctly declines convention.* If \(\pi'\) is unrepresentable, Clause 7 fails. Lewis’s account excludes lock-ins without alternatives.  

  **3. Sanctions rather than coordination:**  
  - **Translation:** Regularity enforced by punishment (e.g., reward shaping: \(R_i \leftarrow R_i - \lambda \cdot \text{deviation\_penalty}\)). Conforming is not a best response without penalties.  
  - **Limitation:** Lewis restricts conventions to coordination games (mutual best responses). Translation mirrors this: enforcement is not a convention—it’s a *mechanism design hack*.  
  - **Verdict:** *Honest scope restriction.* Sanction-based norms are *Pareto-inferior equilibria* (defection dominates without penalties). Most real-world norms (e.g., property rights) *are* convention-shaped; others (e.g., moral taboos) aren’t.  

  **4. Weights rather than beliefs:**  
  - **Translation:** "Expects" → opponent model \(\phi_i\) (explicit) or as-if expectations (implicit in policy gradients). "Prefers" → reward maximization.  
  - **As-if survival?** *Yes.* Lewis functionally defines attitudes: if an agent’s *behavior* aligns with expecting/preferring, it counts. MARL’s as-if agents satisfy Clauses 5–6 behaviorally. Nothing breaks.  

  ---

  ### Part IV: Verdict  
  **Residue Significance:**  
  - **Normativity:** Lewis’s "reason for action" is *genuine residue*. MARL reduces normativity to reward signals, ignoring the *social justifications* humans invoke (e.g., "this is our custom"). This is a gap for modeling *normative reasoning* (e.g., why agents obey conventions absent penalties). *Recommendation:* Add social reward channels (e.g., imitation learning on "appropriate" behavior).  
  - **Situation recognition:** Lewis assumes type-identification for free. MARL must *learn state abstractions* (e.g., via clustering or meta-learning). Not a philosophical gap—an engineering extension.  
  - **Common knowledge:** An idealization. Finite-depth mutual beliefs suffice empirically. *No loss.*  

  **Furniture Lewis Assumed:**  
  - **Attitudes:** Beliefs/desires are *functional*, not mechanical. MARL’s as-if reading is consistent.  
  - **Recurrent situations:** MARL can learn these (e.g., via context encoders).  
  - **Unbounded reasoning:** Lewis’s infinite regress is *impractical*. MARL’s finite-depth approximations are empirically adequate.  

  **Verbal vs. Substantive:**  
  - "Convention" in MARL = Nash equilibrium with mutual beliefs.  
  - "Normativity" is the key *substantive* gap: Lewis’s account explains why conventions feel binding; MARL cannot.  
  - **Crucial test:** Train agents in a *convention-rich environment* (e.g., driving side choice). Then:  
    - **Lewis predicts:** Agents develop opponent models and treat conventions as "reasons" (e.g., higher regret when deviating *unexpectedly*).  
    - **MARL predicts:** Deviation depends only on \(R_i\) (e.g., defect if penalty is low).  
    - **Settlement:** Measure if agents exhibit *extra reward sensitivity* to norm violations (e.g., surprise penalties). If so, normativity is more than reward.
