prompt: |-
  Me and my friend got into a massive arguement last night about my aunt, and I realised we were going in circles because we never got clear on what we were even asking of a view. She's 79, moderate dementia, happy most of the time, still lights up for music and her dog, and about six years ago — fully competent, fully informed, no pressure from anyone — she filled out a directive refusing antibiotics, ventilators, feeding tubes, the lot, on the grounds that she'd read that dementia is basically a long humiliation and she wanted none of it. Now she has a urinary infection that three days of antibiotics would clear up, and my friend says that directive is obviously binding and I say obviously not, and we spent two hours swapping between she decided and she's fine now, with my friend treating she decided as if that settled not just whose call it is but how strong the reason is. So I want to do this backwards.

  Before I look at any of the standard positions again, I want the specification: what does a theory of precedent autonomy — of whatever authority an earlier competent self has over a later incompetent one — actually have to deliver to count as adequate? Fix the purpose as: something a hospital ethics committee or a family at a bedside could use in real time with imperfect information, not something that settles the metaphysics of personal identity. Give me the requirements list with the case or consideration behind each one, and label which are non-negotiable and which are really just the Preferences of one camp or another. The cases I want it to earn its keep on: my aunt (contented patient, clear directive, mild reversible illness); the standard dementia case where the directive and the clinical picture line up and nobody argues; the easy cases where the earlier self obviously speaks — knocked out for surgery, delirious for two days, back to yourself on Thursday; the case where the later self is competent again and repudiates the whole value system the directive came out of (religious conversion, gender transition, someone who becomes a different kind of person politically), so both selves are competent and informed and the only thing that changed is the person; the Ulysses-ish case where the entire point is to be bound against your own predictable future weakness; the case of a 24-year-old writing binding instructions about the body of an 84-year-old she has never met; and the asymmetry I noticed mid-argument, that a directive refusing a treatment gets honoured much more readily than one demanding a treatment everyone now regards as futile — I can't tell whether that asymmetry is a datum a theory has to explain or just an institutional accident. It also has to say something about the epistemic situation: the directive is vague (no heroic measures), it conflicts with what the daughter says her mother would want now, and the patient is in the middle zone where she can still voice preferences but inconsistently.

  Three candidate requirements of my own that I want you to either promote or throw out. One: my friend invented a clause during the arguement — if I later revoke this, dont believe me, I'll only be doing it because I've become the kind of person who's afraid of dying — and I think a theory has to handle directives that anticipate and discount their own later revocation, which feels different from the ordinary Ulysses setup. Two: must a theory distinguish a later self who repudiates the earlier conclusion from one who repudiates the earlier grounds — someone who now thinks that whole long-humiliation picture was just bad newspaper reporting about dementia, versus someone who still believes every word of it and simply doesn't care any more? Is tracking continuity of grounds rather than continuity of content a genuine desideratum, or am I overcomplicating things? Three: is it legitimate to demand that an account not presuppose an answer to the general question of what makes someone the same person over time, or is that just the reductionists rigging the game? And the part I most want: where the list turns on itself. Which pair of requirements do you suspect can't be jointly satisfied — my guess is something like a competent person's say-so about her own body binds, full stop, against what we owe the person in the bed tracks her interests now — and which single requirement, if you insist on it, eliminates the largest number of the usual positions. Then briefly, a paragraph is plenty, how the main families do against your list: the strict earlier-self-speaks view, the current-best-interests view, the would-the-later-self-endorse-it view, and any graded psychological-continuity view you like. Please skip reading lists and paper titles, I can find those myself.
reasoning: |-
  Okay, the user is grappling with a deeply personal and ethically complex situation involving their aunt's advance directive. They've had a heated argument with a friend about whether to honor the directive refusing antibiotics for a treatable infection, despite the aunt currently appearing content. The user wants to step back from specific positions and instead establish a rigorous framework for evaluating theories of precedent autonomy - essentially asking "what must any decent theory accomplish in this domain?"

  Hmm, this is clearly someone with strong analytical skills who's frustrated by circular debates. They're not looking for quick answers but rather tools to evaluate ethical frameworks. The emotional undercurrent suggests they care deeply about their aunt while feeling trapped between respecting her past autonomy and seeing her present contentment. 

  The cases they outline reveal sophisticated thinking: from Ulysses contracts to identity transformation scenarios. They're particularly sharp in noting asymmetries (refusal vs. demand directives) and epistemic challenges. Their three candidate requirements show they've identified nuances often missed - especially about discounted revocations and grounding vs. content continuity.

  I need to construct requirements that are:
  - Actionable for real-world decision-makers
  - Neutral toward metaphysical debates
  - Responsive to their test cases

  The non-negotiables should capture what any plausible theory needs, while "preferences" will map onto existing philosophical camps. Key tensions will emerge between binding autonomy and present welfare obligations - especially visible in the "contented patient" and "repudiated values" scenarios. 

  For their three propositions:
  1) Discounted revocations are indeed distinct from standard Ulysses cases and must be addressed
  2) Ground/content distinction matters but may overcomplicate - better treated as evidentiary
  3) Personhood metaphysics can't be avoided entirely, but theories should minimize reliance on it

  The asymmetry between refusing vs. demanding treatment seems both principled (rooted in non-maleficence) and institutional (resource constraints). 

  When applying this framework to major approaches:
  - Strict precedent autonomy fails the "repudiated values" test
  - Current interests fail the "Ulysses" test 
  - Endorsement views struggle with discounted revocations
  - Graded continuity handles nuances but becomes complex

  Ultimately the aunt's case sits at the crux: a theory must explain why we might override a clear directive when present suffering is minimal and treatment effective, without collapsing into pure presentism. The answer likely lies in how we weight the competence threshold for binding decisions versus reversible interventions.
answer: |-
  Here’s a requirements list for a theory of precedent autonomy, designed for practical use in clinical/ethical decision-making, grounded in your test cases. Non-negotiables (NN) are essential for any coherent theory; "Preferences" (P) reflect common philosophical divides.

  ---

  ### **Core Requirements (Non-Negotiables)**
  1. **Action-Guidance in Uncertainty (NN)**  
     *Rationale*: Must resolve ambiguities (e.g., vague directives, conflicting family testimony) using clear heuristics.  
     *Case*: Your aunt’s "no heroic measures" directive vs. daughter’s claim of changed wishes.  

  2. **Distinguish Binding vs. Advisory Directives (NN)**  
     *Rationale*: Not all directives are equally authoritative (e.g., refusing antibiotics vs. demanding experimental treatment).  
     *Case*: The asymmetry—refusals honored more readily than demands—arises because refusing care is a negative right (avoiding harm), while demanding treatment implicates resource allocation/beneficence.  

  3. **Competence Threshold for Binding Decisions (NN)**  
     *Rationale*: Directives bind only if created when competent *and* the decision aligns with minimal rationality standards (e.g., not refusing a 3-day antibiotic for reversible suffering).  
     *Case*: Knocked out for surgery ≠ dementia; the former expects restoration of capacity.  

  4. **Avoid Catastrophic Harm (NN)**  
     *Rationale*: Override directives that cause severe, unnecessary suffering when the patient is currently content.  
     *Case*: Your aunt’s UTI: denying antibiotics risks sepsis for a reversible condition, conflicting with medicine’s core principle of non-maleficence.  

  5. **Epistemic Humility (NN)**  
     *Rationale*: Prioritize *reliable evidence* of past wishes over speculative reconstructions of "what they’d want now."  
     *Case*: Directive conflicts with inconsistent current preferences; the written directive is stronger evidence than fragmented utterances.  

  ---

  ### **Contested Preferences (P)**
  6. **Handling Identity Shifts (P)**  
     *Rationale*: Should a theory prioritize psychological continuity (memories, values) or narrative identity (life story)?  
     *Case*: Religious convert repudiating past directive; strict precedent autonomy ignores their current self.  

  7. **Discounting Later Revocation (P)**  
     *Rationale*: Directives that preempt future revocation (e.g., "ignore me if I recant") require extra scrutiny—they risk overriding genuine changes.  
     *Case*: Your friend’s clause; acceptable only if the revocation reason (fear of death) was *explicitly anticipated and rejected* in the directive.  

  8. **Grounds vs. Content (P)**  
     *Rationale*: Tracking continuity of *reasons* (e.g., "dementia is humiliating") vs. *conclusions* ("no antibiotics") matters if the factual basis evaporates.  
     *Case*: If your aunt disavowed the "humiliation" narrative but still refused treatment, her directive may hold. If she embraces the narrative but *now* wants treatment, her current voice matters more.  

  9. **Future-Self Authority (P)**  
     *Rationale*: Can a 24-year-old bind an 84-year-old stranger? Only if the theory values extended autonomy over present wellbeing.  
     *Case*: Young person’s directive vs. elderly patient’s new interests; most theories limit binding power for distant futures.  

  ---

  ### **Tensions and Trade-offs**
  - **Fatal Tension**: *Binding precedent autonomy* (NN#3) vs. *Avoiding catastrophic harm* (NN#4).  
    - Your aunt’s case exposes this: honoring the directive causes preventable harm to a content person.  
  - **Most Constraining Requirement**: *Avoiding catastrophic harm* (NN#4) eliminates strict precedent autonomy and weakens Ulysses contracts.  

  ---

  ### **How Major Theories Fare**  
  1. **Strict Precedent Autonomy**  
     - Fails NN#4 (aunt’s UTI), NN#1 (ambiguity), and P#6 (identity shifts). Prioritizes past self rigidly.  

  2. **Current Best Interests**  
     - Fails NN#3 (competence threshold), P#9 (future-self authority), and the Ulysses case. Overrides directives too readily.  

  3. **Later-Self Endorsement**  
     - Fails P#7 (discounted revocation) and struggles with dementia (no competent later self to endorse). Ideal for identity shifts (P#6) but impractical in incapacity.  

  4. **Graded Psychological Continuity**  
     - Best on NN#1 and P#8 (grounds vs. content). Weights authority by psychological connectedness (e.g., how much the aunt still resembles her past self). Fails if continuity is too fractured to measure.  

  ---

  ### **Your Aunt’s Case: Resolution**  
  A defensible theory would:  
  - Honor the directive **only if** the treatment refusal is proportionate to the anticipated suffering (NN#4). Here, antibiotics prevent catastrophic harm for minimal burden.  
  - Discount the directive’s authority because:  
    - The *grounds* ("dementia as humiliation") are disconnected from her current reality (she’s content) (P#8).  
    - Competent directives bind only when they don’t inflict severe, unnecessary harm on a present self (NN#3 + NN#4).  

  This satisfies NN#1 (clear action: give antibiotics) and NN#5 (directive’s weight diminishes when its factual basis lapses). Your friend’s "she decided" argument overlooks the directive’s context-sensitivity—it wasn’t a suicide pact but a shield against predicted suffering that never materialized.
