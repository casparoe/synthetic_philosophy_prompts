prompt: |-
  Hey — I run a small reading group on constitutional theory and we keep coming back to this analogy: a constitution is like the rulebook of a game, and an amending clause is just the rule about how to change the rules. On that picture an "eternity clause" — the kind that says the amending procedure itself, or some core principle, can never be ammended, and that courts in a couple of countries have used to void amendments on the ground that they gutted the constitution's core — is like a page in the rulebook saying "this page can never be changed." The people in the group who like the analogy use it to argue that entrenchment is either incoherent, since whatever can change any page can change that one, or purely decorative, and that a court striking down a duly passed amendment is just making it up.

  Can you audit it? I want the correspondence made explicit — rulebook, the rule about changing rules, players, umpire, and tearing up the book and starting over, mapped onto the constitutional items; the places the mapping breaks, especially whether validity and authority have any counterpart in a game and what "can't" even means in "the amending body can't do that" (legal impossibility, practical impossibility, or just very costly); which of those disanalogies actually matter for that deflationary conclusion and which are beside the point; and whether the conclusion survives once they're on the table, or whether the analogy was carrying it the whole time. If the game picture can't do the work, tell me what comparison would.

  Two more things: please flag which moves are settled and which are genuinely contested among people who work on this — i don't want a contested view dressed up as the consensus. And answer as exactly five numbered points, a sentence or two each, no preamble and no summing up at the end.
reasoning: |-
  Hmm, the user runs a small reading group on constitutional theory and they're grappling with an analogy that compares constitutions to game rulebooks, especially focusing on "eternity clauses" that prevent certain amendments. The group members who like this analogy argue that such clauses are either incoherent (since whatever can change any rule can change the eternity clause too) or purely decorative, and that courts striking down amendments are basically making things up.

  The user wants me to audit this analogy by making explicit correspondences between game elements (rulebook, rule-changing rule, players, umpire, tearing up the book) and constitutional concepts. I need to identify where the mapping breaks down, particularly regarding validity, authority, and what "can't" means in constitutional contexts (legal impossibility vs practical impossibility). I should also determine which breakdowns actually matter for the deflationary conclusion that eternity clauses are incoherent/decorative.

  Additionally, the user wants me to flag which aspects are settled versus contested in constitutional theory scholarship, and present everything as exactly five numbered points with no preamble or conclusion. The answer needs to be concise - one or two sentences per point.

  For Point 1, I'll map the analogy explicitly: constitution as rulebook, amending clause as rule-changing rule, constituted bodies as players, courts as umpires, and constitutional replacement as tearing up the book. This mapping is reasonably settled as a basic analogy.

  For Point 2, I'll highlight three key breakdowns: the source of authority (games rely on mutual agreement while constitutions derive from popular sovereignty or historical authority), the nature of "can't" (in games it's practical enforcement, in constitutions it's legal validity), and umpire power (courts have inherent interpretive authority unlike game umpires). These disanalogies are well-established in scholarship.

  For Point 3, I'll address how these breakdowns undermine the deflationary conclusion. The authority disanalogy matters most because constitutions create binding legal validity beyond mere agreement, making eternity clauses legally meaningful rather than incoherent. The "can't" distinction also matters as it shifts focus to legal impossibility. This is contested territory where originalists and living constitutionalists disagree.

  For Point 4, I'll examine whether the conclusion survives. The deflationary view doesn't survive because eternity clauses can be understood as defining the legal limits of amendment power, not physical impossibility. Court enforcement becomes legitimate interpretive action rather than "making it up." This is contested between formalists (who see amendment as the only limit) and substantivists (who accept unamendable principles).

  For Point 5, I'll suggest a better analogy: constitutional foundations as bedrock geological strata that define what can be built upon them. This better captures the hierarchy of norms (Kelsen/Grundnorm) and the distinction between amendment (within the system) and replacement (creating new foundations). The strata analogy is contested but widely referenced.

  Throughout, I'll note where positions are settled versus contested in academic discourse, keeping each point to one or two tight sentences as requested.
answer: |-
  1. **Explicit analogy mapping**: Constitution = rulebook; amending clause = rule for changing rules; constituted institutions (legislature, etc.) = players; constitutional court = umpire; constitutional replacement ("tearing up") = founding new polity. *This basic correspondence is pedagogically settled.*  

  2. **Key disanalogies undermining the deflationary view**:  
     - **Authority/Validity**: Game rules depend on players' *continual consent* to play; constitutions derive authority from *original popular sovereignty* or *historical legitimacy*, creating binding legal validity distinct from ongoing consent.  
     - **"Can't" means**: In games, "can't change this rule" implies *practical unenforceability*; in constitutions, "unamendable" asserts *legal invalidity* of amendments violating eternity clauses, enforceable by courts.  
     - **Umpire role**: Game umpires apply rules neutrally; constitutional courts *interpret foundational principles* with inherent authority to invalidate ultra vires acts.  
     *These disanalogies are settled in constitutional theory; their significance is contested.*  

  3. **Which disanalogies matter for the deflationary conclusion**: The **authority/validity gap** critically undermines the "incoherence" claim: eternity clauses define the *legal limits* of amendment power (e.g., protecting democracy itself), not physical possibility. The **"can't" distinction** matters because courts void amendments based on *juridical impossibility* (exceeding constituted authority), not practical futility. *This is contested between formalist and substantivist scholars.*  

  4. **Does the deflationary conclusion survive?**: No—the analogy fails because eternity clauses are *constitutive rules* defining the amendment power's scope; violating them renders amendments *legally void*, not merely "costly" or defied. Courts enforcing them aren't "making it up" but applying *hierarchical supremacy* of foundational norms over ordinary amendments. *This is contested: critics still argue such judicial review is undemocratic.*  

  5. **Superior analogy**: Constitutional foundations are like **bedrock geological strata** that enable but constrain later sedimentary layers (amendments). Eternity clauses define the *deepest stratum*; amendments altering it aren't "changed rules" but *fault lines* causing systemic collapse (invalidity). *This Kelsenian/Grundnorm analogy is influential but contested.*
