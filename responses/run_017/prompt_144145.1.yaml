  Hmm... they're frustrated by the lack of a precise term for this "residue" phenomenon. The core puzzle is how to classify these zombie practices that aren't solving coordination problems anymore but still elicit mild disapproval when violated. Let me mentally scan the literature:

  First thought: Lewis's Convention. But strict Lewisian conventions require an underlying coordination problem. These cases lack that - the original problem (deference to senior professor, administrative tracking) is gone. The "arbitrary alternative" condition fails too since there's no functional alternative to coordinate around anymore. 

  What about Sugden's or Bicchieri's norm accounts? Sugden's propriety norms might come close with their emphasis on "what one does," but they usually tie to social identity - here the disapproval seems thinner. Bicchieri's conditional preferences don't fit because people aren't actually conditioning on others' expectations. 

  Ah! Millikan's "stereotypes"! That feels promising - she describes practices that persist through sheer inertia after losing function. But her account is more biological; the normative "ought" here might be too strong for her framework. 

  Wait - the user mentioned "expectations outliving their objects." That resonates with Gilbert's plural subject theory. The "we just do it" phrasing suggests a joint commitment survives the practice's purpose. But is the commitment really still there? The apologetic shrugs imply it's eroding. 

  Biggest challenge: distinguishing from repurposed conventions. In the pause-as-respect-signal variant, it becomes a new coordination device. The test would be whether disapproval disappears if everyone agrees to stop - in the zombie cases it might linger, in repurposed cases it would shift to the new function. 

  For coining a term... "Normative inertia" captures persistence but not the residue. "Decoupled prescription" emphasizes the split from function. Best might be "vestigial normativity" - like an appendix, still there but purposeless. 

  Crucial boundary: evidence it's normative, not just surprise. The "disrespectful to the process" comment suggests perceived obligation, not mere confusion. And if it persists even when disliked? That's the smoking gun - the residue isn't about preferences but about felt "oughtness."
answer: |-
  Based on your precise descriptions and exclusions, this phenomenon sits in a fascinating conceptual niche. After careful mapping against the Lewisian framework and its descendants, here's the analysis:

  **First: Does this have a name?** **No single established term fits perfectly.** It falls *between* several well-defined concepts, explaining the terminological gap:

  1.  **Lewisian Convention (Strict Sense):** Fails crucially. Conventions solve coordination problems. Your cases lack an *ongoing* coordination problem. The original problem (deference to senior prof, ensuring admin oversight, verifying minutes) is gone. The regularity persists *without* coordinating action towards a common goal. The arbitrariness condition also weakens – there's no salient alternative to coordinate *around* anymore.
  2.  **Custom/Habit (Social):** Captures persistence and lack of conscious reasoning but fails the **normative residue**. Mere customs (e.g., always taking the same seat) don't typically generate mild disapproval or the sense that deviation "calls for an excuse." The "we just do it" correction implies more than habit.
  3.  **Sugden's Propriety Norms / "What One Does":** Closer. Robert Sugden emphasizes norms as rules of thumb based on observed regularity ("what one does here"), which can persist. However, Sugden's norms usually link to *social identity* ("what an X does") and solving recurrent interactions. The disapproval in your cases seems thinner, less tied to identity, and lacks the functional anchor Sugden often implies. The "pointlessness" is overtly acknowledged, weakening the "rule of thumb" justification.
  4.  **Bicchieri's Conditional Preferences:** Fails. Cristina Bicchieri's norms require individuals to prefer conforming *conditional* on believing others conform *and* expecting others to prefer they conform. In your cases, individuals correctly believe *no one* has a reason or preference for the practice itself. The mild disapproval isn't linked to a *preference* for conformity conditional on expectations; it's more a vague unease *about* deviation itself.
  5.  **Millikan's "StereoTypes":** **Best fit among named concepts, but imperfect.** Ruth Millikan ("Language, Conventions, and StereoTypes") describes "stereotypes" as historical patterns of behavior reproduced not *because* of their function (which may be lost), but simply *as* that pattern. They persist through inertia and copying. This captures the decoupling from function and persistence. **Where it falls short:** Millikan's focus is often on enabling *interpretation* (e.g., linguistic patterns). The *normative residue* – the mild disapproval, the sense deviation "needs an excuse," the "disrespectful" label – isn't central to her account. Your phenomenon adds a layer of *faint normativity* to the inert pattern.
  6.  **Decoupled Institution / Zombie Rule:** Terms sometimes used informally but lack rigorous definition within core convention/norm theory. They capture the persistence but not the specific normative residue.

  **Verdict:** Your cases represent a distinct phenomenon: **A behavioral regularity that was once functional (likely a convention or norm) but has lost its original coordinating or problem-solving purpose, yet persists due to inertia and retains a faint, vestigial normative charge.** It's a *normative fossil* – the form persists without the original functional content, yet the shape still exerts a weak normative pull. Millikan's "stereotype" is the closest named concept, but misses the nuanced normative residue you identify.

  **Second: Classification within Lewis-style Apparatus**

  *   **Strict Lewis:** These are **not conventions** anymore. The defining coordination problem is absent. They resemble mere "behavioral regularities" or "parallel customs."
  *   **Apparatus Difficulty:** This exposes a limitation in the *strictest* Lewis framework. It struggles with the *legacy* of conventions – the lingering expectations and normative intuitions that outlive the coordination problem they solved. The framework focuses on sustaining equilibria for *current* problems.
  *   **Resources within the Apparatus/Extensions:**
      *   **Expectations Outliving Problems:** The apparatus *can* incorporate this. Lewis discusses expectations as key. The expectation that "others will pause/CC/read minutes" persists *even though* no one expects it to serve the original purpose. The disapproval arises from violating this ingrained *expectation of conformity*, divorced from its original justification.
      *   **Salience & Focal Points:** The regularity itself becomes salient through history. Deviating breaks this salience, causing cognitive dissonance or mild social friction ("abrupt", "disrespectful"), even if no tangible consequence follows. It disrupts the "normal flow."
      *   **Critics' View (Gilbert, Millikan):** Margaret Gilbert's "plural subject" theory might see the lingering "joint commitment" to the pattern, even if the *reason* for the commitment is forgotten. Millikan's "stereotype" directly addresses the persistence of the pattern independent of function.
  *   **Conclusion:** The strict classification as "not a convention" is correct but incomplete for your phenomenon. The Lewisian apparatus *can* explain the persistence of the *expectation* and the resulting mild social friction ("residue") via the concepts of entrenched expectations and salience, even if the label "convention" no longer strictly applies. The residue is the friction caused by unexpectedly disrupting a deeply ingrained, salient behavioral pattern, triggering a low-level normative response rooted in the *history* of the practice as a convention/norm.

  **Third: Boundary with Repurposed Regularities**

  *   **Same Shell, Different Phenomenon:** The case where the pause now signals general respect represents a **distinct phenomenon** – a *new* convention or norm has emerged, repurposing the old behavioral shell. The original phenomenon (the zombie regularity with vestigial normativity) has *ended* and been replaced.
  *   **How to Tell Them Apart (Evidence Needed):**
      1.  **Functional Justification:** In the repurposed case, participants *can* articulate a *new* reason or function, however vague ("it shows respect," "it sets the tone," "it's part of our identity"). In your pure cases, no functional justification exists or can be articulated beyond "that's how it's done" or appeals to vague "disrespect."
      2.  **Consequences of Abolition:** In the repurposed case, people can point to a *new* negative consequence of abolishing it (e.g., "it would seem disrespectful," "meetings would feel rushed"). In your pure cases, no tangible or articulable negative consequence follows from abolition, only the unease about breaking the pattern itself.
      3.  **Conditional Preferences (Bicchieri Test):** In the repurposed case, individuals might develop a *preference* for the pause *because* it now serves the new signaling function, conditional on others expecting it. In your pure cases, there's no such preference; conformity is driven by inertia and avoiding the mild friction of deviation.
      4.  **Internal Feeling vs. External Function:** The internal "shrug" might feel similar, but the *external social response* differs. In the repurposed case, labeling abolition "disrespectful" carries weight linked to the *new* norm. In your pure case, "disrespectful to the *process*" is hollow, referring only to the broken pattern, not a valued principle.
  *   **Key Distinction:** Does the regularity *currently* serve *any* identifiable coordinating, signaling, or problem-solving function (even a new one)? If yes, it's a (possibly new) convention/norm. If no, and the *only* reason for conformity/disapproval is the historical pattern itself ("that's how it's done"), it's your vestigial phenomenon.

  **Fourth: Coining a Term and Definition**

  **Term: Vestigial Normativity**

  **Definition:** A behavioral regularity R within a population P exhibits *vestigial normativity* if and only if:

  1.  **Historical Function:** R was previously sustained (at least in part) as a solution to a recurrent coordination problem or social dilemma within P, functioning as a convention, norm, or rule.
  2.  **Functional Decoupling:** The original coordination problem or social dilemma that R solved no longer exists, or R no longer effectively solves it. No *new* coordination problem or social function for R is recognized or articulated within P.
  3.  **Persistence:** R remains the predominant behavioral pattern within P, surviving complete turnover of individuals.
  4.  **Normative Residue:** Deviation from R reliably (though perhaps mildly) elicits reactions within P interpreted as signaling disapproval (e.g., being described as "abrupt," "odd," requiring an "excuse," "disrespectful to the process") *and* conformity is sometimes justified solely by appeals to the pattern itself ("we just do it").
  5.  **Lack of Sanction/False Belief:** The persistence and residue are not primarily explained by material sanctions, reputational mechanisms (beyond the mild disapproval itself), or false beliefs about others' endorsement of R's current function. Individuals correctly believe R lacks a current functional justification and that others hold similar beliefs.

  **Hard Cases at the Margin:**

  *   **Just Inside:** A department has a tradition of wearing academic gowns to monthly meetings. The original reasons (formality, status display) are irrelevant. Gowns are uncomfortable and serve no current purpose. New faculty who skip the gown are met with slightly raised eyebrows or comments like "Ah, going casual today?" or "You'll get used to the gown." No one articulates a *reason* beyond tradition. *(Fits: History, Decoupling, Persistence, Residue (mild disapproval/implied expectation), Lack of Sanction/False Belief)*.
  *   **Just Outside:** People in a town always drive clockwise around the central square. It was established during construction decades ago. The construction is long gone, no safety reason remains, and counter-clockwise is equally efficient. However, *newcomers* are never corrected or commented on if they drive counter-clockwise. Locals might still drive clockwise out of habit, but there's no sense that others *should* do so or that deviation is "wrong" in any way. *(Fails: Normative Residue (no disapproval/expectation applied to others)).* It's just a widespread habit/custom.

  **Evidence for Normativity (vs. Mere Startle):**

  1.  **Language of Ought/Should/Appropriateness:** Explicit statements like "You *should* pause," "It's *best* to CC them," "It's *not done* to skip the reading," even if qualified by "I don't know why."
  2.  **Demand for Excuse/Justification:** Treating deviation as something requiring explanation ("Why *didn't* you CC them?"), rather than just surprise ("Oh, you didn't pause?").
  3.  **Appeals to Rule/Process:** Justifications framed as upholding a rule or respecting a process ("It's disrespectful to the process," "That's the rule," "We always do it"), even if the rule's basis is unknown.
  4.  **Counterfactual Persistence under Dislike:** **Crucially:** If the practice is *unanimously disliked* ("We all hate pausing/CC'ing/reading, it's pointless"), yet the mild disapproval for deviation *still occurs* and conformity is still justified by "that's how it's done," this is strong evidence for *vestigial normativity*. The residue persists *despite* the lack of positive attitude, driven purely by the expectation and the faint normative force of the historical pattern itself. Mere startle or surprise wouldn't persist under unanimous dislike; it would likely fade or turn into relief when someone finally deviates.

  **Prediction for Unanimous Dislike:** Vestigial Normativity predicts the residue (mild disapproval, demand for conformity appeal to pattern) *will* persist even if the practice is unanimously disliked, precisely because the normativity is vestigial – tied to the expectation and the historical pattern, not to current preferences or functions. Abolishing it might require an explicit, coordinated decision to overcome the inertia and the residual sense that deviating is "not done."

  This "vestigial normativity" captures the core of your cases: the dead shell of a norm, persisting inertially, yet still carrying a faint, puzzling electrostatic charge that makes deviation feel mildly wrong. It highlights the enduring power of historical patterns to shape expectations and create a sense of "ought," even when utterly divorced from purpose.
