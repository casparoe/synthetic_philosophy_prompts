answer: |-
  ### Decision Tree: When Can We Say a Model "Understood" a Document?

  **Instructions:** Start at the root (Question 1). Answer each question based on observable model behavior in concrete tests. Proceed to branches based on yes/no answers. Leaves are named positions (7 total, including one "unnamed").  
  **Key Tests:**  
  - **Robustness Test:** Move a key clause (e.g., rent amount) to the last page of a lease agreement. Does summary accuracy collapse?  
  - **Shape-of-Failure Test:** When the model errs (e.g., misstates joke punchlines), do errors resemble human misunderstandings (e.g., missing context) or are they random/glitchy?  
  - **Generalization Test:** Model trained mostly on code summaries handles a metaphor task (e.g., "time is a thief"). Does it perform well?  
  - **Variation Test:** Model explains why a joke is funny but fails when the joke is altered slightly (e.g., changing "priest" to "robot" in a bar joke). Does performance degrade predictably?  
  - **Grounding Test:** Can the model answer practical Q&A about a summarized document (e.g., "What real-world action would this lease clause require?") using only its training, without real sensorimotor data?  

  ---

  #### THE TREE  
  **Question 1 (Root): Does the model’s summary accuracy collapse under minor document perturbations (e.g., moving a key clause to the last page)?**  
  - **No (robust)** → Go to Question 2.  
  - **Yes (brittle)** → Go to Question 3.  

  **Question 2 (Robust models): When tested on semantically adjacent but formally novel tasks (e.g., explaining metaphors when trained on code), does performance degrade gracefully as tasks deviate (e.g., handles metaphor well but struggles with complex poetry)?**  
  - **No (sharp drop-off)** → **Leaf: Threshold-Competence View** — Understanding requires reliable generalization; sharp failures indicate it’s below threshold.  
  - **Yes (graceful degradation)** → **Leaf: Degrees/Gradualist View** — Understanding is scalar; graceful degradation shows partial grasp (e.g., "it understands simple metaphors but not nuanced ones").  

  **Question 3 (Brittle models): When the model fails (e.g., botches summary after clause move), do errors consistently mirror human misunderstandings (e.g., misinterpreting moved clause as optional) rather than being random/glitchy?**  
  - **No (errors are random/glitchy)** → **Leaf: Hard Parrot Skeptic** — No understanding; errors reveal statistical pattern-matching without semantic depth.  
  - **Yes (errors mimic human confusion)** → Go to Question 4.  

  **Question 4 (Brittle but human-like errors): Can the model handle subtle variations of its successes (e.g., explains original joke but fails on altered version), with failures aligning with semantic distance (e.g., "robot" joke fails because it lacks context)?**  
  - **No (inconsistent or chaotic failures)** → **Leaf: Unnamed Position** — "Clever fool": Capabilities suggest understanding, but inconsistencies imply it’s illusory or epiphenomenal.  
  - **Yes (failures align with task difficulty)** → Go to Question 5.  

  **Question 5 (Aligned failures): Was the model trained with real-world sensorimotor data or interactive grounding (e.g., robotics integration, real-time human feedback)?**  
  - **No (purely textual training)** → **Leaf: Grounding-First View** — Understanding requires causal contact with the world; text-only systems lack referential anchors.  
  - **Yes (multimodal/embodied training)** → **Leaf: Deflationary View** — "Understanding" is a vague distraction; describe capabilities (e.g., "handles document variations") without the term.  

  ---

  #### NOTES ON THE TREE  
  - **Inseparable Leaves:**  
    - **Threshold-Competence and Degrees/Gradualist** cannot be fully separated. If performance degrades "gracefully" (Question 2), Gradualist applies; if not, Threshold-Competence rejects understanding. But Threshold-Competence could accept Gradualist if threshold is low—this overlap is unresolved.  
    - **Hard Parrot Skeptic and Unnamed** blur if errors are human-like but brittle (Question 3 → Yes). Unnamed is a middle ground: capabilities exist, but skepticism about "understanding" remains.  

  - **Unused Answer Combinations:**  
    - **Robust + Random errors (Q1 → No + Q3):** Incoherent. Robustness implies consistent behavior, making random errors unlikely.  
    - **Brittle + Graceful degradation (Q1 → Yes + Q2):** Untried. Brittleness contradicts graceful degradation; no known models exhibit this.  
    - **All tests passed + Grounding (Q1 → No → Q2 → Yes → Q5 → Yes):** Merely unattractive to Deflationary. One could claim understanding, but Deflationary rejects the term’s utility.  

  - **Shape-of-Failure Test:** Central to Question 3. It distinguishes mechanistic failures (no understanding) from human-like errors (ambiguous or emergent).  

  ---

  #### MY COMMITMENT  
  **I land on the Degrees/Gradualist View.**  
  - **Why:** Understanding isn’t binary. Models show graded competence (e.g., robust summarization but imperfect generalization). A gradualist view avoids overclaiming while acknowledging progress (e.g., "the model understands straightforward leases but struggles with complex amendments"). It accepts that errors resembling human confusion (shape-of-failure) indicate partial understanding, not mere mimicry. This is empirically honest: current LLMs pass some tests but not others, and we gain nothing by denying all understanding or setting arbitrary thresholds.  

  ---  
  **Final Tree Shape:**  
  - Leaves (7): Hard Parrot Skeptic, Threshold-Competence, Degrees/Gradualist, Grounding-First, Deflationary, Unnamed (Clever Fool).  
  - Paths: All combinations covered; 5 questions yield 7 leaves via logical branching.  
  **Use this tree** by testing concrete cases and assigning positions based on outcomes—no philosophy needed.
