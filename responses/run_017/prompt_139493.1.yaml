  The strongest case against ln(2) is that there is no unique way to approximate the infinite game by finite ones. The prefix truncation is one way, but the reading group's construction is also a valid finite approximation (it includes more and more of the most probable outcomes). And it yields a different limit unless p=q. Therefore, the value assigned to the game depends on the method of approximation.

