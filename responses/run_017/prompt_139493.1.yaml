    E = sum_{n=1}^{∞} [ (-1)^{n+1} * 2^n / n ] * (1/2^n) 
      = sum_{n=1}^{∞} (-1)^{n+1} / n 
      = 1 - 1/2 + 1/3 - 1/4 + ... 
      = ln(2) ≈ 0.693

  But note: the series is conditionally convergent (because the absolute series is the harmonic series which diverges). Therefore, by Riemann's rearrangement theorem, we can rearrange the terms to get any real number or even make it diverge.

