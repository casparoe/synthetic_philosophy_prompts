  2. A table with exactly these columns:
     - Claim — the relevant clause quoted verbatim, or a tight paraphrase where the claim is spread across sentences.
     - Verdict — one of: Correct / Correct-but-misleading / Overstated / False / Contested-in-the-literature.
     - Specialist's correction — one to three sentences of what should be said instead.
     - Load-bearing — one of: Load-bearing / Cosmetic, according to whether fixing it would change the passage's conclusion.
     - Confidence — one of: High / Medium / Low.

  3. A JSON object with exactly these fields, for my own use:
     - "truncation_limit": the limit of the expected value of G^{p,q}_N as N → ∞, as a formula in p and q, or a correction of mine.
     - "arithmetic_check": at most 80 words, confirming or correcting the harmonic-number asymptotics behind that limit.
     - "does_the_wrinkle_defeat_ln2": one of "yes", "no", "partly".
     - "strongest_case_for_ln2": at most 80 words on the best defence of 69 cents as the privileged value, including the best reply to my reading group's construction.
     - "strongest_case_against_ln2": at most 80 words on the best attack on it.
     - "bottom_line": one sentence I can quote in the note.

  Please reason from the mathematics and from the structure of expected-utility theory rather than from the literature: I don't want citations, bibliographies or reading suggestions, since I can chase those myself, and I'd rather have the diagnosis.
