  We are given a passage from a blog post and a separate construction from a reading group. We need to audit the passage and analyze the construction.

  The Pasadena game: 
  - A fair coin is tossed until first heads.
  - If heads first appears on toss n, the payoff is (-1)^{n+1} * 2^n / n.
