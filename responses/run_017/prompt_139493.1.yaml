        = ln(2) + ln(p) + ln(N) + γ - (1/2)ln(p) - (1/2)ln(N) - (1/2)γ - (1/2)ln(q) - (1/2)ln(N) - (1/2)γ
        = ln(2) + (1/2)ln(p) - (1/2)ln(q) + [ln(N) - (1/2)ln(N) - (1/2)ln(N)] + [γ - (1/2)γ - (1/2)γ] 
        = ln(2) + (1/2) ln(p/q) + 0 * ln(N) + 0 * γ
        = ln(2) + (1/2) ln(p/q)

