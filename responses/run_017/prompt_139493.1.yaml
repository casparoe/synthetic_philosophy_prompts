  Claim 1: "the expected value of the game is the alternating harmonic series ... That series converges, but only barely: ... by Riemann's rearrangement theorem ... So the game has, in a sense, every expected value and none: its expected value is not merely unknown, it is undefined."

  Verdict: Correct. In the context of classical expected value (with real-valued payoffs and without a utility function), the expectation is conditionally convergent and hence not absolutely convergent. Therefore, the expectation is not well-defined (it depends on the order of summation). So the expected value is undefined.

  Claim 2: "The fix is ... using a utility function that is bounded. The expected-utility series then converges absolutely and the ambiguity disappears."

