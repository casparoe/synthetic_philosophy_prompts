  Okay, the user is a TA for an undergrad seminar on AI governance, and their session on scalable oversight didn't engage the students. The students read about the debate idea—where two AIs argue in front of a human judge who picks the winner—and just accepted it at face value without questioning it. The TA wants to create a satirical document that vividly illustrates the flaws in this approach without handing them another academic paper. They need something experiential, something that makes the students "feel" the problem.

  The TA's request is very detailed. They want a deadpan corporate document from a fictional vendor selling debate-judged auditing services. The setting should involve a real-world scenario where a correct answer requires tedious work, like summing hundreds of rows or interpreting a complex contract. The wrong side wins because it's easier to follow or the judge can't verify sub-claims, and the format incentivizes persuasion over truth. The disaster should stem from concrete mechanics, not sci-fi elements.

  I need to invent a vendor and a client. For the vendor, something blandly corporate like "Veritask Solutions" would work. The client could be a pension fund or hospital billing office—let's go with a county pension fund since financial audits involve lots of numbers and are prone to the described issues. The transcript should show an audit where the correct total is hard to verify, and the wrong side wins by being concise and confident.

  The core conflict: An honest debater points out an error in the spreadsheet, but the judge can't verify it within time limits. The dishonest debater uses tactics like plausible-sounding aggregates and accuses the other of unverifiable sub-claims. The judge rules for the wrong side with institutional language, citing something like "inability to adjudicate sub-claims."

  Key elements to include:
  - A verifiability rule: E.g., judges can only credit claims they could check themselves.
  - Tactics convergence: Both debaters end up using similar persuasive but unhelpful strategies.
  - The recursive sub-debate failing: It bottoms out with still-tedious questions.

  The satire must be subtle. No one in the document admits the system is broken; the failure emerges from the mechanics. Language should be corporate boilerplate with fake footnotes and disclaimers to enhance humor.

  Structure the document as:
  - Cover memo: Setting up the context and vendor branding.
  - Transcript: The debate itself, with debaters "Pro" (wrong but confident) and "Con" (right but verbose).
  - Judge's ruling: Professional, reasonable, but flawed.
  - Appendix: Maybe a footnote showing the actual error.

  Word count: Aim for 800-1000 words. Keep it tight and impactful.

  This approach will help the TA's students viscerally understand why scalable oversight via debate is fraught with pitfalls—making the theoretical failure feel real and unavoidable.
