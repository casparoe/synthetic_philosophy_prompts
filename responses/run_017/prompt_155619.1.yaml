prompt: |-
  I sit on a small advisory panel to a civic museum that is rewriting the interpretation for a permanent gallery on trade, empire and exploration; Columbus, Jefferson and Churchill all appear in it. We have now had three sessions in which the same sentence has stopped the discussion dead: "he was a man of his time — you can't judge him by the standards of today". What interests me is that it is being used by people on both sides. One member uses it to say that no verdict should be attached at all, and therefore that the celebratory framing should stay; another uses it to say that if his conduct was merely the output of his period then he was not an exemplar, and the commemoration should go.

  I want a precisification rather than a verdict. Please set out, as a menu, the distinct precise theses the sentence could be expressing — I would expect somewhere between six and eight — and for each: the thesis stated in a form one could actually argue about; whether it is a platitude, a substantive and defensible claim, or false; and what it would and would not licence in our decision. Please group them by the kind of claim they make: about the truth or the historical variability of moral standards; about what was knowable or reasonable to believe then; about excuse, blameworthiness and the alternatives open to the agent; about the point of commemoration; about counterfactuals concerning what we ourselves would have done in his place.

  Two constraints I would like every reading tested against.

  First, "his time" is doing unexamined work. For each reading, say what it takes "the standards of his time" to be: the prevailing opinion of the day, the best opinion then available, what was knowable from his social and informational position, what he could realistically have done otherwise, or the opinion of the people his actions affected. So that the answer does not turn on contested history, stipulate for the sake of argument that each of the three was criticised by at least some contemporaries for the conduct we now object to, and that each also did things we now admire.

  Second, the sentence seems to travel in only one direction: nobody says "he was a man of his time" to explain why Columbus sailed, or why Churchill refused to surrender in 1940. It is produced only for the parts we condemn. For each reading, say whether it can account for that asymmetry, or whether the asymmetry shows the sentence is functioning as a selective excuse rather than as a general claim — and, where a reading fails, whether it fails merely as deployed or in itself.

  Finally: given what the sentence is being made to do in the room, which reading is my colleague most likely reaching for when she says it settles the matter, and does that reading actually settle it? If it does not, tell me what question the panel should be asking instead. Please write in British English.
reasoning: |-
  Okay, the user is part of an advisory panel for a museum exhibit on trade, empire, and exploration, featuring figures like Columbus, Jefferson, and Churchill. They're stuck on the phrase "he was a man of his time — you can't judge him by the standards of today." Both sides use it differently: one to avoid judgment and keep celebratory framing, the other to argue against commemoration since he wasn't exceptional. The user wants a detailed breakdown of possible interpretations of this phrase, not a verdict.

  First, I need to unpack what "his time" means in different contexts. The user specified that each figure was criticized by contemporaries for their now-objectionable actions and praised for others. That's crucial. Also, the phrase is only used for negative actions, not positive ones. Why is that? I should consider if the asymmetry reveals the phrase is a selective excuse.

  The user wants six to eight distinct theses, grouped by claim type. Categories could be moral standards, knowability, blameworthiness, commemoration, counterfactuals. For each thesis, I need to define "standards of his time," assess its validity (platitude, defensible, false), and what it does/doesn't license. Also, test each against the two constraints: defining "his time" and explaining the asymmetry.

  Starting with moral standards: thesis one could be about historical variability of moral truth. If moral facts are relative to eras, judging past figures by today's standards is invalid. But that's a controversial metaethical claim. "His time" here would be prevailing norms. Asymmetry might not hold because if morals are era-bound, why only defend negatives? That shows it's used selectively. 

  Thesis two: prevailing opinion as the standard. This is descriptive—what most people thought then. But since contemporaries criticized them, it's false that everyone agreed. Defensible only if we ignore dissent. Doesn't justify celebration or condemnation alone. Asymmetry: used only for negatives because positives already align with current values, so no defense needed. 

  Third thesis: best available opinion. "Standards" as the most advanced ethical thought of the time. For example, abolitionist views for Jefferson. Since contemporaries criticized them, they failed to meet this standard. Defensible if we expect leaders to know better. Licenses condemnation. The asymmetry exists because for admirable actions, they met or exceeded standards, so no need for the phrase. 

  Moving to knowability: what was epistemically accessible. Could they have known their actions were wrong? Given contemporary critics, yes, so it's false. Licenses blame. Asymmetry: for positives, no need to excuse ignorance. 

  Another thesis: practical feasibility. Even if they knew it was wrong, could they have acted differently? Political constraints, etc. Defensible in some cases. Doesn't excuse but might reduce blame. Asymmetry: for positives, we assume they had choices, so no defense needed. 

  For blameworthiness: culpable ignorance. If they should have known better, blame is appropriate. Contemporaries criticized them, so they were culpable. Asymmetry explained because positives don't raise blame questions. 

  Commemoration focus: is the point to celebrate moral exemplars? If they only followed norms, not exemplary, so don't commemorate. Defensible but depends on the museum's goal. Asymmetry: negatives undermine exemplar status. 

  Counterfactual: would we have done differently? If not, then judging is hypocritical. But it's speculative and false if contemporaries did object. Asymmetry: we use it for negatives to avoid guilt, but for positives, we're happy to claim we'd act similarly. 

  Now, which thesis is the colleague using? Probably the prevailing opinion one (thesis 2) to say no verdict needed. But since contemporaries criticized, it's false, and doesn't settle anything. The panel should ask: "Given contemporary criticism, does describing him as 'a man of his time' accurately reflect the range of ethical opinions available to him?"
answer: |-
  Here is a precisification of the phrase "he was a man of his time — you can't judge him by the standards of today", structured as requested. I've identified seven distinct theses, grouped by claim type, with analysis against your constraints. Stipulated historical facts (contemporary criticism *and* admiration for all three figures) are incorporated throughout.

  **Group 1: Claims about Moral Standards (Truth & Variability)**

  1.  **Thesis:** *Moral truth itself is historically contingent; what was morally right/wrong in their era differs fundamentally from what is right/wrong today.*
      *   **"Standards of his time":** The objective moral facts *as they existed* in that historical period.
      *   **Nature:** Substantive and highly controversial (Moral Relativism). Rejected by moral realists.
      *   **Licences:** Prohibits *any* transhistorical moral judgement (positive or negative). Demands complete historical contextualisation without verdicts.
      *   **Does Not Licence:** Celebration *or* condemnation based on current morals. Implies past morals were equally "valid".
      *   **Asymmetry Test:** **Fails intrinsically.** If true, it applies equally to actions we now admire (e.g., Churchill's defiance) – we shouldn't judge *them* by today's standards either. Its selective use reveals it's functioning as an excuse, not a consistent principle.
  2.  **Thesis:** *The predominant social *norms* and widely accepted behaviours of the period were different, and individuals largely conformed to these.*
      *   **"Standards of his time":** The prevailing attitudes, laws, and common practices of the dominant social group(s) in their society.
      *   **Nature:** Descriptive platitude (people *are* influenced by their context). Becomes substantive when used normatively.
      *   **Licences:** Explanation of *why* they acted as they did. Suggests judging them *harshly* for mere conformity might be misplaced. Supports descriptive historical presentation.
      *   **Does Not Licence:** Absolution of moral responsibility (conformity isn't always excusable). Does not preclude noting that *dissent* existed (per your stipulation). Does not mandate celebration.
      *   **Asymmetry Test:** **Fails as deployed.** The admirable actions (e.g., Jefferson drafting Declaration) *also* aligned with *some* prevailing norms (e.g., liberty for propertied white men). The phrase is only deployed for contested/condemned actions, suggesting it's not truly about conformity but *excusing specific transgressions* against *our* norms.

  **Group 2: Claims about Knowability & Reasonable Belief**

  3.  **Thesis:** *The knowledge required to form a *better* ethical judgement than the mainstream simply wasn't accessible or conceivable from their social/epistemic position.*
      *   **"Standards of his time":** The limits of available information, scientific understanding, philosophical discourse, and cultural perspective realistically available to someone in their position.
      *   **Nature:** Substantive and defensible claim (epistemic contextualism). Requires historical evidence about access to ideas.
      *   **Licences:** Mitigates blame if they lacked access to critical perspectives. Highlights historical constraints on understanding.
      *   **Does Not Licence:** Absolution if better perspectives *were* available (per your stipulation: critics existed). Does not preclude noting the existence of those critical perspectives *within* their time. Does not justify celebration.
      *   **Asymmetry Test:** **Explains asymmetry.** For actions we condemn (e.g., Columbus's enslavement), the claim is they *couldn't know better*. For actions we admire (e.g., Churchill's wartime leadership), we assume the *rightness* was knowable/obvious *then* and *now*, so no defence is needed. Its use flags perceived epistemic deficits specific to the condemned actions.
  4.  **Thesis:** *Given the prevailing worldview and available knowledge, holding the *objectionable* belief/conduct was *reasonable* or even *laudable* for someone in their position at that time.*
      *   **"Standards of his time":** The best available intellectual, philosophical, or theological justifications circulating within elite or mainstream discourse.
      *   **Nature:** Substantive claim, often false when applied to figures with access to dissent (per your stipulation). Defensible only if dissent was truly fringe/inaccessible *to them*.
      *   **Licences:** Suggests condemnation is anachronistic because, *given their epistemic inputs*, their conclusions followed logically or ethically. Might support a more neutral or contextual framing.
      *   **Does Not Licence:** Ignoring contemporary critics whose arguments demonstrate that better reasoning *was* available. Moral absolution. Celebration.
      *   **Asymmetry Test:** **Explains asymmetry.** Used only for condemned beliefs/actions to argue they were *rational then*. Admired actions are assumed to be *rationally defensible now*, so no need for this defence.

  **Group 3: Claims about Agency, Blame, and Alternatives**

  5.  **Thesis:** *Given the immense social, political, and institutional pressures of their era, they realistically had *no meaningful alternative* but to act as they did regarding the condemned conduct.*
      *   **"Standards of his time":** The constraints of power structures, potential consequences of dissent, and limited scope for individual agency within the dominant systems.
      *   **Nature:** Substantive and potentially defensible claim (mitigating circumstance). Requires evidence of significant constraint.
      *   **Licences:** Reduces blameworthiness by highlighting lack of feasible choice. Explains complicity within oppressive systems.
      *   **Does Not Licence:** Full moral excuse (complicity remains). Does not apply if they actively championed/extended harmful systems beyond necessity. Ignores figures who *did* resist (per stipulation). Does not justify celebration.
      *   **Asymmetry Test:** **Explains asymmetry.** Used only for condemned actions to argue *no choice*. Admirable actions (e.g., Jefferson pursuing Louisiana Purchase) are framed as active, positive choices *requiring* agency, so no defence of constraint is needed.
  6.  **Thesis:** *While their *actions* were wrong by any standard, their *personal blameworthiness* is diminished because they were not *culpably ignorant*; they genuinely couldn't be expected to grasp the full wrong.*
      *   **"Standards of his time":** The baseline of moral understanding and capacity for empathy achievable for someone with their upbringing and position, given the era's limitations.
      *   **Nature:** Substantive claim about moral psychology/history. Defensible if evidence shows deep, inculcated bias beyond their reflective capacity.
      *   **Licences:** Focuses critique on *actions and consequences* rather than *personal demonisation*. Allows for nuanced portrayal acknowledging harm while avoiding simplistic villainy.
      *   **Does Not Licence:** Excusing the harm caused. Ignoring evidence of reflection or exposure to counter-arguments (per stipulation). Preventing condemnation of the *acts*. Justifying celebration.
      *   **Asymmetry Test:** **Explains asymmetry.** Used only for condemned actions to mitigate *personal* blame. Admired actions don't raise questions of blameworthiness, so the defence isn't needed.

  **Group 4: Claims about Commemoration & Counterfactuals**

  7.  **Thesis:** *Commemoration celebrates *exemplars*. If their conduct only reflected the *norm* of their time, they weren't exceptional and thus don't merit specific celebration for those aspects.*
      *   **"Standards of his time":** The baseline of expected behaviour for someone in their role/status. "Standards of today" = the baseline for being considered morally exemplary *now*.
      *   **Nature:** Substantive and defensible claim about the *purpose* of commemoration in a modern museum.
      *   **Licences:** Removing celebratory framing for actions that were *merely* conventional (even if harmful). Focusing commemoration only on what was genuinely innovative or admirable *against the grain* of their time (per your stipulation of admired actions).
      *   **Does Not Licence:** Demanding removal of *all* mention or context. Judging the *morality* of the action itself. Preventing description of their *historical role*.
      *   **Asymmetry Test:** **Explains asymmetry.** Used only for condemned actions to argue they don't merit *celebration*. Admired actions (e.g., Churchill's oratory boosting morale) might be framed as *exceeding* the norm, so the phrase isn't invoked to *defend* commemoration, only to *qualify* or *remove* it for negative aspects.
  8.  **Thesis (Counterfactual):** *Judging them harshly is hypocritical because, placed in their exact circumstances with their knowledge and socialisation, *we* would likely have acted similarly.*
      *   **"Standards of his time":** The totality of formative influences (upbringing, education, social pressure, available information) shaping their character and choices.
      *   **Nature:** Substantive psychological/sociological claim. Likely false for many people today *if* contemporary dissent existed (per stipulation), as it proves alternatives were conceivable *then*.
      *   **Licences:** Cultivates humility in judgement. Emphasises the power of social conditioning.
      *   **Does Not Licence:** Moral absolution ("might makes right"). Preventing condemnation of the *act* or its consequences. Justifying celebration. Ignoring evidence of contemporaries who *did* resist.
      *   **Asymmetry Test:** **Explains asymmetry.** Used only for condemned actions as a defence against perceived hypocrisy ("You wouldn't have done better!"). For admired actions, we *want* to believe we *would* act similarly, so the counterfactual isn't raised as a defence.

  **Analysis of Your Colleague's Usage & Path Forward:**

  *   **Colleague Claiming "No Verdict / Celebration Stays":** They are most likely reaching for **Thesis 2 (Prevailing Norms as Standard)** or **Thesis 4 (Reasonable Belief Then)**. They interpret "man of his time" as meaning he simply conformed to dominant, "reasonable" standards, making retrospective moral judgement anachronistic and irrelevant to celebrating his historical role/achievements.
  *   **Does it Settle It? Absolutely not.**
      *   **Thesis 2:** The existence of contemporary critics (your stipulation) fatally undermines this. If dissent existed, conformity wasn't universal or necessarily "reasonable," and his choices *were* contested *in* his time. It doesn't preclude noting the harm or the dissent.
      *   **Thesis 4:** If critics existed, better knowledge/reasoning *was* available. It requires examining if *this specific figure* was culpably ignorant or genuinely couldn't access/know better. It doesn't mandate celebration; it might only mitigate *personal* blame, not the harmfulness of the act.
  *   **The Essential Question the Panel Should Ask Instead:**  
      **"Given that contemporary critics *did* exist (as stipulated), what does it mean to call him 'a man of his time'? Does it accurately reflect the *range* of ethical positions *actually available and knowable* to someone in his position, or does it selectively invoke the *dominant* view to excuse his specific choices?"**

  **Conclusion:** The phrase "man of his time" is not a single argument but a rhetorical container holding multiple, often conflicting, theses. Its power lies in its ambiguity. Your stipulation of contemporary criticism is crucial – it renders the most common, simplistic uses (Thesis 2 & 4) largely indefensible *as justifications for inaction or celebration*. The asymmetry in its deployment strongly indicates it functions primarily as a *selective excuse* for condemned actions, not a coherent historical principle. Moving beyond the stalemate requires abandoning the phrase and focusing on the specific historical evidence regarding available knowledge, dissent, feasible alternatives, and the intended purpose of commemoration in the modern museum context. Ask the panel to confront the reality of contemporary criticism directly.
