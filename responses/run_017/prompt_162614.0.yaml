answer: |-
  **MEMORANDUM**  
  **TO:** All Departments  
  **FROM:** Dr A. Finchley, Director, Office for Intergenerational Equity (OIE)  
  **DATE:** 1 October 2023  
  **SUBJECT:** Revised Guidance: Form IGE-7 (Long-Term Impact Assessment)  

  Further to Circular 23/GenEq/08, please note the updated procedures for completing Section 4 ("Demonstrable Harm to Identified Recipients") of Form IGE-7. This revision (v4.7) consolidates best practice following the 2022 *Sutton Coldfield Recreation Grounds Bylaws* judicial review. Key clarifications address:  

  1.  **Temporal Scope of "Recipient" Identification (Section 4.2):** Reinforced protocols for establishing causal chains between policy interventions and specific future individuals.  
  2.  **Quantification Thresholds (Annex C):** Updated discounting tables reflecting the Chancellor's latest Green Book rate (5.2% real terms).  
  3.  **Edge Cases (Section 4.3.1):** Streamlined procedures for handling scenarios involving potential identity-stable cohorts.  

  Compliance is mandatory for all policies with projected impacts exceeding a 50-year horizon. The revised Form IGE-7 and Guidance Notes (OIE-GN-104) are attached.  

  ---  

  **OFFICE FOR INTERGENERATIONAL EQUITY**  
  **GUIDANCE NOTES: OIE-GN-104 (v4.7)**  
  **Completion of Form IGE-7: Long-Term Impact Assessment**  
  **(Extract: Section 4 – Harm Assessment)**  

  **4.0 Harm Assessment Framework**  
  Harm is strictly defined as a quantifiable worsening of outcomes *for specific, identifiable future persons* relative to their counterfactual baseline existence. The causal link between the policy and the worsening must be direct and unbroken.  

  **4.1 Establishing Identity and Baseline (Critical Precondition)**  
  *4.1.1* Future persons attain specific identity solely via the spatio-temporal coordinates and biological circumstances of their conception. A policy altering any factor materially influencing conception timing, location, or pairing of gametes necessarily results in the emergence of *different specific persons* in the future population.  
  *4.1.2* Consequently, such a policy cannot be said to harm *any* specific person, as no specific person existing under the policy scenario would have existed at all under the alternative (no-policy) scenario. The baseline for comparison is *non-existence* for these individuals.  

  **Illustrative Examples:**  

  *   **Example A (Resource Depletion):** Policy P accelerates extraction of aquifer A, leading to regional water scarcity 80 years hence. This causes population migration from Region X. Citizen F, conceived in Region Y *after* the migration by parents who relocated *due to* scarcity, would not have been conceived (or would be a genetically distinct individual) had Policy P not been implemented (as parents would likely have remained in Region X, conceiving at a different time/with potentially different partners). Thus, Policy P does not harm Citizen F. Citizen F's baseline is non-existence under the no-P scenario.  
  *   **Example B (Emissions Pathway):** Policy Q delays decarbonisation, increasing atmospheric CO2 by 2150. This exacerbates heat stress, altering leisure patterns. Couple C conceives child G on a specific date during an unseasonably warm spell *attributable* to Policy Q's emissions pathway. Had Policy Q not been implemented, cooler temperatures would have prevailed, Couple C would likely have been engaged in different activities on that date, and child G (a unique combination of gametes) would not exist. Thus, Policy Q does not harm Citizen G. Citizen G's baseline is non-existence under the no-Q scenario.  

  **4.2 Identity-Stable Cohorts (Exception Handling)**  
  *4.2.1* A limited exception arises where robust demographic modelling demonstrates that *the exact same cohort of specific persons* would inevitably come into existence *regardless* of the policy intervention under assessment. This requires evidence proving conception timing, location, and parental pairing are wholly insensitive to the policy's effects.  
  *4.2.2* OIE Assessors encountering potential identity-stable cohorts must:  
      a) Flag the case immediately to the OIE Central Scrutiny Unit (CSU) via Form IGE-7/Appendix Delta.  
      b) Temporarily suspend assessment of impacts on this cohort pending CSU validation of identity-stability.  
      c) Apply extreme caution. Identity-stability is highly improbable beyond very short time horizons (<25 years) or for policies with diffuse societal impacts. Assumptions of stability are seldom justified (See Ruling: *OIE/Ref/4491 – Midlands Infrastructure Levy*).  
  *4.2.3* **Important:** Validation of identity-stability does *not* automatically imply harm is provable. Standard harm quantification thresholds (Section 4.4, Annex C) still apply.  

  **4.3 Quantification of Harm (Identity-Stable Cohorts Only)**  
  *4.3.1* Only applicable following validated CSU approval under 4.2.2. Harm is calculated as the net present value (NPV) of the lifetime welfare deficit experienced by the *identified, stable* future person(s) due to the policy, relative to their welfare under the no-policy scenario.  
  *4.3.2* Welfare deficits must be expressed in monetary equivalents using HM Treasury Green Book methodologies.  
  *4.3.3* **Discounting:** The prescribed annual social discount rate for intergenerational impacts is **5.2%** (real terms, HM Treasury Green Book 2023, Table 6a). Apply this rate rigorously from the midpoint of the recipient's expected lifespan back to the present valuation date.  

  **Annex C: Discounting Table Extract (Selected Years)**  
  | Years Hence | Discount Factor (5.2%) |  
  |-------------|------------------------|  
  | 50          | 0.0802                 |  
  | 100         | 0.0064                 |  
  | 150         | 0.00051                |  
  | 200         | 0.000041               |  
  | 250         | 0.0000033              |  

  *Example Calculation:* A projected welfare deficit of £1,000,000 suffered by an identity-stable individual 200 years hence has a present value of £1,000,000 x 0.000041 = **£41.00**.  

  **4.4 Reporting Thresholds**  
  *4.4.1* A "Significant Harm" finding under Section 4 requires *all* of the following:  
      a) Validation of an identity-stable cohort (per 4.2).  
      b) Quantifiable welfare deficit per person (per 4.3).  
      c) Aggregate NPV of harm for the validated cohort exceeding **£10,000** (present value).  
  *4.4.2* **Clarification on Aggregate Welfare:** Impacts affecting the *composition* or *size* of the future population (e.g., policies leading to fewer future people, or to a larger population with lower average welfare) fall outside the statutory definition of harm to *specific, identifiable* persons and are **not reportable** under Section 4. Such impacts should be recorded, if deemed materially relevant, under Section 7 ("Non-Person-Affecting Considerations").  
  *4.4.3* **Critical Note:** A policy demonstrably causing *all* future lives over a prolonged period (e.g., 300+ years) to be significantly shorter, poorer, and less fulfilling than under alternative feasible policies, but where the specific individuals born are conception-dependent on that very policy pathway, **does not constitute harm** under this framework. No specific person existing in this future is worse off than they would otherwise have been (their alternative being non-existence). Consequently, such an outcome **scores zero harm** for the purposes of Form IGE-7 Section 4 and does not trigger reporting thresholds. Assessors must disregard intuitive assessments of collective welfare degradation; the assessment is strictly individual and counterfactual-specific.  

  ---  
  **END OF EXTRACT**  
