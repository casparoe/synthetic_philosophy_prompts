prompt: |-
  My friend (she's a wildlife vet tech, I'm a backend engineer, so neither of us has any real philosophy background) has been getting into animal suffering stuff and turns out to have pretty firm opinions about wild-animal cases, so I've started keeping a list of her verdicts because I can't tell whether there's one coherent rule underneath or whether she's just going by vibes. Her calls so far: oral rabies vaccine baited out for foxes and coyotes, where the outbreak traced back to unvaccinated dogs people brought in — she's all for it. Fencing plus underpasses under a highway so deer stop getting hit — for it. A wildlife hospital that patches up individual injured animals one at a time, window-strike hawks and orphaned fawns and so on, which does literally nothing at the population level — she's for it, and she volunteers there on weekends. A city that wants to shrink a herd of extremely fat, well-fed suburban deer, either with immunocontraception darts or by hiring sharpshooters — she's against both, which surprised me because I'd of thought she'd at least like the non-lethal version. A proposal to turn a decommissioned strip mine into a big rewilded reserve — against it, with some line about how you'd be manufacturing a whole pile of lives that will mostly go badly. And basically always, for every case, she'd rather fund more research than act yet. She's also said she has no idea whether insects matter at all and doesn't want to touch anything insect-related in either direction, if that's a clue about anything.

  Here's the case I actually want to put to her, and I'd rather work out what she should say than argue with her about it. There's a island nobody has really touched — no introduced predators, no human-caused mess to clean up — with a native mouse species that booms and busts: the population explodes, then crashes, and during the crash a large fraction of them spend a week or two slowly starving or freezing to death. One team wants to release a self-spreading fertility-control agent, some gene-drive-ish thing that biases inheritance so litters get smaller generation over generation, which over about ten years would cut the population by maybe 70%. No mouse alive now is made worse off, and the mice who do exist have lives roughly as good as before; there are just far fewer of them each generation, and the line might eventually wink out on that island entirely. A second team wants to do what's standard for clearing rodents off islands — poison bait spread over a few days — which by everyone's numbers prevents more starvation down the line but obviously also kills every mouse currently alive. Oh, and the mice are the main food for a native owl, so fewer mice probably means fewer owls too.

  I don't so much care which of the two she picks as I do about this: what's the rule she seems to be running, what other rules fit all her earlier calls about as well, what each of those rules says about the fertility-control option and the poison option (including the "neither yet, fund a study first" answer), which of her old verdicts is the closest analog to this one, and if her track record genuinely doesn't settle it, what's the single follow-up case I should put to her that would actually split the remaining options apart?
reasoning: |-
  Okay, let me tackle this problem step by step. The user is a backend engineer whose friend, a wildlife vet tech, has strong opinions about various wildlife intervention scenarios. The user has compiled a list of her positions on different cases and now wants to predict her response to a new scenario involving mice on an island. The main goal is to uncover the underlying ethical rule she's following, see how other rules might fit her previous decisions, apply those rules to the new mouse case, identify the closest analog from her past decisions, and determine a follow-up case if needed.

  First, I need to analyze her past verdicts to find a consistent principle. Looking at the cases:

  1. **Oral rabies vaccine for foxes/coyotes**: She supports it. This intervention prevents disease spread, which likely reduces suffering from rabies. The outbreak originated from human-introduced dogs, so she might see this as correcting a human-caused problem.
     
  2. **Fencing and underpasses for deer**: She's for it. This prevents roadkill deaths, reducing direct human-caused suffering without harming the deer population.

  3. **Wildlife hospital for individual animals**: She supports and volunteers there. This is interesting because it helps individuals but doesn't affect populations. She values reducing individual suffering even without broader impact.

  4. **Shrinking suburban deer herd (immunocontraception or sharpshooters)**: She opposes both. The deer are described as fat and well-fed, so their current suffering might be minimal. Contraception prevents future births, while sharpshooting kills current individuals. Her opposition might stem from causing harm to existing animals or intervening in a stable population.

  5. **Rewilding a strip mine**: She's against it because it creates lives that will "mostly go badly." This suggests a focus on suffering: introducing new animals into an environment where they're likely to suffer is unethical.

  6. **Insect-related decisions**: She avoids them, indicating uncertainty about their capacity for suffering, aligning with a suffering-focused view where moral weight depends on the ability to suffer.

  From this, her decisions seem to prioritize reducing suffering, especially when humans are the cause. She avoids actions that create new suffering or harm existing individuals. The wildlife hospital case shows she values helping individuals even without population-level effects. The opposition to rewilding because it creates net suffering fits here. The deer contraception case is tricky; she might see it as unnecessary intervention in a non-suffering population, where preventing births is akin to depriving potential good lives, or causing indirect harm through population changes.

  The underlying rule might be: **Intervene to relieve ongoing suffering caused by humans, but avoid actions that cause direct harm to existing individuals or create new suffering.** 

  Alternative rules could be:
  - **Non-maleficence**: Don't harm individuals. This fits with opposing lethal control and rewilding (seen as creating harm). But she supports the wildlife hospital, which actively helps without harming.
  - **Restorative intervention only**: Act only to fix human-caused problems. This explains supporting rabies vaccines (human-caused outbreak) and deer crossings (human roads). But the wildlife hospital helps animals harmed by humans (window strikes, orphans), so it fits. Rewilding isn't restorative but additive, so opposing it aligns. The contraception for deer is preventive without an obvious human-cause link beyond suburbanization, so opposing it fits.
  - **Individual welfare over populations**: Focus on existing individuals. Supporting the hospital and opposing contraception (affects future births) and rewilding (creates new individuals) fits. But the fertility control in the mouse case doesn't harm existing mice, which might be acceptable under this view.

  Now, applying these to the island mouse case:
  - **Fertility control**: Reduces future populations without harming current mice. If her rule is "avoid harming existing individuals," this should be acceptable. But she opposed deer contraception, which is similar. The key difference might be that the deer aren't suffering, while the mice experience boom-bust cycles with starvation. If the mouse suffering is severe, she might support fertility control to prevent future suffering. If she values existing individuals highly, she might oppose it for leading to extinction.
  - **Poison bait**: Kills all current mice, which directly harms individuals. Given her opposition to lethal methods for deer and likely valuing individual lives, she'd probably oppose this.
  - **Do nothing / research**: Consistent with her preference for more studies.

  The closest analog is the deer contraception case. Both involve fertility control to reduce populations. Her opposition there might predict opposition here. But the mice suffer during busts, while suburban deer are "fat and well-fed." If suffering is the key, she might support fertility control for mice but not deer.

  If her past decisions don't settle it, a follow-up case could involve fertility control in a suffering population versus non-suffering. For example: "Should we use contraception on a herd of deer in a harsh winter area where many starve annually?" If she supports it, her rule is suffering-focused. If not, she might prioritize non-intervention or intrinsic value of natural processes.
answer: |-
  Based on your friend's track record, I'll break this down systematically: her likely underlying ethical rule, alternative rules that *almost* fit, how each rule applies to the mouse case (including the "research first" option), the closest analog from her past decisions, and a follow-up case to resolve ambiguity if needed. Her pattern suggests a coherent (if nuanced) philosophy centered on **preventing human-induced suffering without harming existing individuals or creating new net suffering.**

  ### 1. The Most Likely Rule Fitting All Her Verdicts
  **"Intervene only to relieve active suffering caused by humans, but never harm existing individuals or create new suffering-prone lives."**  
  This explains:  
  - **For oral rabies vaccines**: Human-introduced dogs caused the outbreak → intervention relieves active suffering (rabies) without directly killing animals.  
  - **For fencing/underpasses**: Humans built the highway → intervention prevents suffering (roadkill) without harming deer.  
  - **For wildlife hospitals**: Humans cause window strikes/orphanings → helping individuals relieves active suffering. Population-level irrelevance doesn’t matter because she’s focused on individual rescue.  
  - **Against deer contraception/sharpshooters**: Suburban deer aren’t suffering ("fat, well-fed"); contraception prevents future lives (which she may see as inherently valuable or neutral), while sharpshooting harms existing individuals. Humans created the suburb, but the deer aren’t actively suffering, so intervention isn’t justified.  
  - **Against rewilding strip mines**: Creating new lives in a rewilded area "manufactures suffering" because wild animal lives "mostly go badly" (net negative experiences). Humans caused the mine, but adding animals exacerbates suffering.  
  - **Neutral on insects**: Uncertainty about their capacity for suffering means she won’t intervene.  
  - **Preference for research**: Acting risks unintended consequences; studying first minimizes harm.  

  This rule prioritizes:  
  - **Individual welfare** over populations.  
  - **Correcting human harms** over "natural" suffering.  
  - **Avoiding harm to current beings** (no killing, no creating suffering-prone lives).  

  ### 2. Other Plausible Rules (That Almost Fit, But Have Gaps)  
  | Rule | Why It *Almost* Fits | Where It Fails |
  |------|------------------------|----------------|
  | **"Minimize direct harm to existing individuals"** | Explains opposition to sharpshooters and support for rabies vaccines/wildlife hospitals. | Fails to explain opposition to *non-lethal* deer contraception (no direct harm) and rewilding (no *existing* individuals harmed). |
  | **"Only fix human-caused problems"** | Fits rabies vaccines (human-spread outbreak), fencing (human roads), wildlife hospitals (human-caused injuries). | Rewilding fixes a human-caused mine but she opposes it. Deer overpopulation is partly human-caused (suburbs), yet she opposes intervention. |
  | **"Prevent suffering, but never prevent existence"** | Explains rewilding opposition ("manufacturing lives that go badly") and wildlife hospital support (saving lives). | Contradicts support for rabies vaccines (which prevents future rabies deaths, i.e., reduces future existence). |

  ### 3. What Each Rule Says About the Mouse Case
  Assume two interventions:  
  - **Fertility control**: Reduces future mice without harming current ones.  
  - **Poison bait**: Kills all current mice to prevent future starvation.  
  - **Status quo**: Do nothing; mice keep booming/busting.  
  - **Research**: Study first (her default preference).  

  | Rule | Fertility Control | Poison Bait | Status Quo | Research First |
  |------|-------------------|-------------|-----------|---------------|
  | **Her likely rule** (Intervene for human-caused suffering, no harm/creation) | ✅ **Support**: Prevents future *suffering* (starvation) without harming current mice. Humans aren’t the *cause*, but the suffering is severe and intervention is low-harm. Caveat: She *might* oppose if she sees this as "preventing existence" of future mice. | ❌ **Oppose**: Directly harms existing individuals (kills all mice). | ❌ **Oppose**: Allows preventable suffering (starving mice). | ✅ **Prefer**: Her default; wants data on owl impacts, suffering severity, etc. |
  | **Minimize direct harm** | ✅ Support: No direct harm to current mice. | ❌ Oppose: Kills existing mice. | 🤔 Neutral: No direct harm, but allows suffering. | ✅ Prefer: Safer than acting. |
  | **Only fix human-caused problems** | ❌ Oppose: No human cause (island is untouched). | ❌ Oppose: No human cause + harms individuals. | ✅ Support: No human intervention. | ✅ Prefer: Studies might reveal a human link. |
  | **Prevent suffering but never prevent existence** | ❌ **Oppose**: Prevents future mice from existing (like deer contraception/rewilding). | ❌ Oppose: Harms existing individuals. | 🤔 Neutral: Allows suffering but doesn’t prevent existence. | ✅ Prefer: Avoids moral risk. |

  **Her probable verdict for the mouse case**:  
  - **Fertility control**: Tentative ✅ support (prevents suffering without harming individuals), but she’d push for **research first** to quantify suffering and owl impacts.  
  - **Poison bait**: Strong ❌ oppose (harms existing individuals).  
  - **Status quo**: ❌ oppose (allows severe suffering).  
  - **Overall**: She’d prefer funding a study on fertility control’s effects before acting.  

  **Why?**  
  - The mice’s starvation is severe suffering, making this closer to rabies/fencing cases than the "happy" suburban deer.  
  - Fertility control doesn’t harm current mice (unlike poison), aligning with her wildlife hospital ethos.  
  - But she’d worry about indirectly harming owls or the mice lineage going extinct ("preventing existence"), so research mitigates this.  

  ### 4. Closest Analog: Deer Contraception vs. Rewilding  
  The **suburban deer contraception case** is the strongest parallel:  
  - Both involve fertility control to reduce populations.  
  - She opposed deer contraception because:  
    - The deer weren’t suffering.  
    - It prevented future lives she saw as potentially positive.  
  - **Key difference**: The mice *are* suffering (starving/freezing), while deer were "fat and well-fed." This suffering might tip her toward supporting fertility control for mice.  

  The **rewilding case** is also relevant:  
  - She opposed creating "lives that will mostly go badly."  
  - Fertility control *prevents* such lives (mice that would starve), which she might see as positive.  

  ### 5. If Her Track Record Doesn’t Settle It: The Follow-Up Case  
  Her opposition to deer contraception is the biggest wrinkle. To split the difference between "She supports fertility control for suffering populations" vs. "She opposes all population reduction," pose this:  

  > **"A herd of wild horses in a drought-prone area. Every few years, 30% die slowly of thirst/starvation. A charity proposes fertility control to reduce the population to match the carrying capacity, ending boom-bust cycles. No current horses are harmed."**  

  - **How this splits options**:  
    - If she **supports** this, her rule is **"Prevent suffering in cyclical populations, even via fertility control."** → She’d back the mouse plan.  
    - If she **opposes** this (like the deer), her rule is **"Never prevent future lives, even to avoid suffering."** → She’d reject the mouse fertility control.  
    - If she **demands research**, her priority is avoiding uncertainty.  

  This isolates the "suffering vs. existence" conflict without human causation (unlike rabies) or indirect harm (unlike owls). Her stance here would clarify the mouse case decisively.  

  ### Summary  
  - **Her rule**: Likely **suffering-focused, individualist, and intervention-averse** unless correcting human harms without collateral damage.  
  - **For the mouse case**: Expect support for **fertility control + research**, opposition to poison, and rejection of status quo. The deer contraception case is her closest precedent, but the mice’s active suffering may override her usual hesitance.  
  - **Test with**: The **wild horses in drought** follow-up to confirm her stance on preventing suffering via non-lethal population control.  

  This fits her vibe: pragmatic about human-caused issues, compassionate toward individuals, deeply skeptical of adding or removing lives. If you run this by her, I’d love to hear what she says!
