answer: |-
  Here's the translation and residue analysis you requested, strictly in your operational framework, preserving all friction points. I'll map the neuron-scaled QALY proposal onto HTA concepts, dissect its possible meanings, and then break the three test cases against your vocabulary.

  **Translation of "Neuron-Scaled QALY" into HTA Framework:**

  Let:
  *   `N_i` = Forebrain neuron count of individual `i`
  *   `N_h` = Reference human forebrain neuron count (~16B cortical neurons)
  *   `k` = Exponent (0 = species-blind, 1 = linear, >1 = superlinear)
  *   `QALY_i_base` = QALY estimate for `i` using standard methods (assumes human-equivalent experience per unit time/health state)

  The proposal: **Adjusted QALY_i = QALY_i_base * (N_i / N_h)^k**

  Mapping onto your concepts:

  1.  **As an Equity Weight in a Social Welfare Function (SWF):**
      *   **Mapping:** `(N_i / N_h)^k` acts as an individual-specific *welfare weight* applied *before* aggregation into the SWF. A weight >1 implies society values a QALY gained by `i` more than a QALY gained by a reference human; <1 implies less.
      *   **What it claims:** This interprets brain size as a characteristic conferring *higher moral status*, warranting priority similar to severity modifiers or age-based weights (e.g., "fair innings"). A unit of welfare (QALY) is worth more if experienced by a being with more neurons.
      *   **Fudges:** Health economics equity weights are typically applied to *groups* (e.g., severe illness, disadvantaged populations) based on *societal preferences* elicited via PTO or DCE. `(N_i / N_h)^k` is a *continuous, biologically-defined individual characteristic*. Applying it universally violates the "equal value per QALY" norm *among humans*. It conflates *source* (biological capacity) with *value* (societal judgement of worth).

  2.  **As a Capacity-to-Benefit (CtB) Adjustment:**
      *   **Mapping:** `(N_i / N_h)^k` scales the *potential welfare gain achievable* by an intervention. A being with fewer neurons has inherently less "welfare ceiling" to gain from (e.g., a cure).
      *   **What it claims:** Brain size determines the *intensity* or *depth* of possible welfare states. A "pain-free year" for a mouse with fewer cortical neurons is fundamentally less "pain-free" in experiential magnitude than for a human, even if behaviorally identical.
      *   **Fudges:** Standard CtB focuses on *clinical* potential: baseline health, treatability, proximity to "full health." It assumes QALYs represent equivalent experiential units *if achieved*. This mapping assumes QALYs are *not* equivalent across beings – the scale itself is neuron-dependent. This undermines QALY comparability, the foundation of ICERs.

  3.  **As an Inclusion/Exclusion Threshold:**
      *   **Mapping:** Setting a minimum `N_i` (e.g., `N_i / N_h >= 0.1`) for being a "welfare subject" eligible for QALY counting. `k` becomes irrelevant for excluded beings (weight=0).
      *   **What it claims:** Neuron count defines the *threshold for moral patiency*. Below a certain level, beings generate no welfare (positive or negative) relevant to the SWF. They fall outside the scope of cost-effectiveness analysis.
      *   **Fudges:** Health economics assumes the patient population is predefined (usually humans meeting clinical criteria). Inclusion thresholds are based on diagnosis/prognosis, not fundamental ontology. This mapping imports a metaphysical claim about consciousness that HTA frameworks deliberately avoid.

  **Pinning Down the Exponent `k`:**
  Within your framework, nothing directly pins down `k`. It's fundamentally a *moral* parameter, not a technical one:
  1.  **Equity Weight Interpretation:** `k` could *in principle* be set via modified Person-Trade-Off (PTO) exercises: "How many QALY gains in species A (with known N_A) would you trade for 1 QALY gain in a human?" This elicits societal preference for `k`, but assumes respondents accept neuron count *as* the relevant equity characteristic – a huge leap.
  2.  **CtB Interpretation:** `k` would require *empirical evidence* linking `N_i` to the *subjective intensity* of welfare states. This evidence doesn't exist. Behavioral proxies are unreliable for intensity comparisons across species.
  3.  **Threshold Interpretation:** `k` is irrelevant; the threshold `N_min` would be set arbitrarily or via contested theories of consciousness.
  **Conclusion on Mapping:** The multiplier `(N_i / N_h)^k` is most *structurally similar* to an **equity weight**, but one derived from a contested biological characteristic rather than societal value judgements or health-state severity. It fundamentally challenges the assumption that QALYs represent comparable welfare units across diverse entities. It doesn't fit neatly into CtB (which assumes comparability) or thresholds (which are binary).

  **Residue Report: Where the Translation Breaks**

  1.  **The Crowding Case (One Skull, Two Streams):**
      *   **Your Framework Says:** One body = one patient = one utility function/QALY stream. HTA has no conceptual slot for multiple independent welfare subjects within one physical entity. Severity weights or multiple morbidity adjustments don't capture this; they modulate the QALY gain for *one* subject. Discounting applies to one stream over time, not splitting streams spatially.
      *   **Blind Spot or Ill-formed Claim?** **Blind Spot.** Health economics implicitly assumes a 1:1 body:welfare-subject mapping. This case reveals a potential ontological gap – the framework lacks the vocabulary to even describe "welfare subjects per unit biological resource." The brain-size claim points to something *prior* to QALY calculation: *how many entities are generating welfare?* Your framework assumes this is known (one per human body).

  2.  **The Frame-Rate Case (Finer Temporal Grain):**
      *   **Your Framework Says:** QALYs are rigidly denominated in external (wall-clock) time. A year is a year. The "intensity" or "density" of experience within that time isn't captured. A QALY gained assumes the *quality* change is experienced over the same temporal duration. If a small-brained species experiences 10x more discrete moments of suffering/pleasure per second, a year of "moderate pain" could represent vastly more *instances* of pain than for a human, but yields the same QALY loss.
      *   **Blind Spot or Ill-formed Claim?** **Blind Spot & Split Claim.** Your framework assumes a shared external time grid for experience. This ignores the possibility that the *subjective temporal resolution of experience* might vary and be morally relevant. The brain-size claim here conflates two distinct ideas: (A) **Intensity/Density:** More experiences per unit time (a frame-rate claim), potentially addressable by redefining the QALY *denominator* (e.g., "subjective-seconds"), and (B) **Value per Experience:** Whether an individual experience moment is more valuable with more neurons (the core neuron-weight claim). Your framework has no slot for (A), forcing both concepts awkwardly into the single multiplier `(N_i / N_h)^k`.

  3.  **The Marginal Cases (Humans with Microcephaly):**
      *   **Your Framework Says:** The norm of "a QALY is a QALY" *among humans* is foundational and non-negotiable. Discounting a human's QALY based on neuroanatomy violates core principles of health equity and the social contract underpinning HTA. Severity weights adjust for the *burden of illness*, not intrinsic worth. Capacity-to-benefit is about *clinical potential*, not baseline cognition defining worth. Applying `(N_i / N_h)^k < 1` to such humans is anathema.
      *   **Blind Spot or Ill-formed Claim?** **Neither – Framework Boundary.** This isn't a blind spot; it's a deliberate normative boundary. The framework *can* technically incorporate such weights (like any SWF weight), but doing so fundamentally alters its purpose and violates its core ethical commitments. The brain-size claim, if applied consistently *including to humans*, demands abandoning a central tenet of health economics as practiced for HTA. The "neuron-scaled QALY" proponent must argue *outside* the framework to overturn this norm; translation fails because the framework *explicitly rejects* weighting QALYs by inherent individual characteristics *within the species* it primarily serves.

  **Overall Residue Summary:**

  *   **Blind Spots (Gaps in Vocabulary):**
      *   Defining the *number* of welfare subjects per physical entity (Crowding Case).
      *   Accounting for potential variation in the *subjective temporal grain* of experience (Frame-Rate Case, Aspect A).
  *   **Framework Boundary (Non-Negotiable Norm):**
      *   Equal value per QALY *among humans*, irrespective of individual biological variation like neuroanatomy (Marginal Cases).
  *   **Sign of Ill-formedness/Conflation in Brain-Size Claim:**
      *   Conflating *number of welfare subjects* (Crowding) with *value per subject*.
      *   Conflating *temporal density of experience* (Frame-Rate A) with *value per experience unit* (Frame-Rate B & Core Claim).
      *   Presenting a biologically-derived equity weight (`k`) as a discoverable parameter when it fundamentally requires moral, not technical, justification.
      *   Failing to distinguish claims about *moral patiency* (who counts) from *moral weight* (how much they count) and *experiential capacity* (what a "unit" of welfare means for them).

  **Conclusion:** The brain-size claim exposes genuine limitations in the *ontological scope* (counting subjects, temporal grain) of standard health economic vocabulary used in HTA. However, its core proposal (neuron-scaled welfare weights) doesn't map cleanly onto existing slots (equity weight, CtB, threshold) without violating core assumptions (QALY comparability, human equity norm) or conflating distinct concepts (subject count, temporal density, value per unit). The residue suggests the claim itself bundles several distinct and contentious philosophical propositions that health economics frameworks are neither designed to resolve nor equipped to operationalize without self-transformation, particularly concerning the valuation of humans.
