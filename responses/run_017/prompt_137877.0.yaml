  Looking at equity weights: These adjust for societal values, like prioritizing severe illnesses. If the neuron multiplier is based on an intrinsic characteristic (neuron count), it might conflict with standard equity weights that focus on disease severity or socioeconomic factors rather than individual biology. So, mapping to equity weights seems forced because equity weights are typically applied to health states, not inherent traits.

  Capacity-to-benefit is another angle. This is about how much health gain an intervention can provide. But capacity here is usually clinical (e.g., baseline health affecting potential improvement), not neurological. Tying it to neuron count implies that more neurons mean more capacity to benefit, which is speculative. Current models don't use neuroanatomy for this, so it's a stretch.

  Then there's the welfare function. If we consider the multiplier as part of a social welfare function, it could be a weight based on individual characteristics. But standard welfare functions in health economics don't weight by biological traits—they might weight by age or severity, but not neuron count. Introducing such a weight would be novel and controversial, especially since it could devalue humans with neurodivergence.

