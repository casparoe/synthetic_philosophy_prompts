  The marginal-cases case directly confronts equity norms. Applying neuron-based weights to humans with microcephaly violates the principle that all humans have equal moral worth. This norm is foundational in health economics, so altering it would destabilize the framework. The user needs to know if this is a blind spot or if the original claim is ill-formed.

  The residue analysis shows that some aspects can be forced into existing slots (like welfare weights), but they fit poorly. The crowding and frame-rate cases reveal true blind spots—current frameworks lack the vocabulary for multiple consciousnesses or subjective time perception. The marginal cases highlight a fundamental norm that can't be discarded without overhauling the entire approach.

