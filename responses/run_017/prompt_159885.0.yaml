        "Today we explored how we come to know about the quality of something. We had two kinds of reports: one telling us which piece is best (verdict), and one telling us which piece we would like (taste-match). Both were from a reliable expert. But when it came to endorsing the piece, some of you might have been hesitant even if you knew it was good. Why?"

    - Key points:
        - The gap between knowing by testimony and knowing by experience: even if you know a piece is good because an expert says so, until you experience it, you don't have the same kind of relationship with it. You might know it's good, but you don't feel it.
        - This is not about the testimony being unreliable (because in this case, it was reliable). It's about what is missing: the firsthand experience that allows you to authentically endorse it.
        - Note the difference between predictive knowledge (we could predict which piece the group would like best) and endorsive commitment (we might be unable to put our name behind it if we didn't experience it as good).

