  - 0-5 min: Introduction
    - "Today we are choosing the music for our final club meeting. We have three pieces, but we won't hear them until after we choose. We have reports from a music expert, Dr. Armon. You will each get two reports: one about which piece is best overall, and one about which piece you will like based on your listener profile. We'll then discuss and choose one piece. After that, each of you will decide how much you are willing to endorse the chosen piece. Then we'll listen to all three and rate them. Finally, we'll discuss the process."

