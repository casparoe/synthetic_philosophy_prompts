    - Play the chosen piece (2 min). Then play the other two pieces (2 min each). Total 6 min, plus 9 min for transitions and silence.

  - 55-65 min: Rating.
    - Hand out rating slips. For each piece (1,2,3), rate on a scale of 1-10 how much you liked it. Also, which piece do you think is the best?

