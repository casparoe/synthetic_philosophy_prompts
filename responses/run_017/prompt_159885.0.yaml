        - Which piece they predict the group as a whole will rate highest (Piece 1, 2, or 3)
        - How much they predict they will personally like the chosen piece (on a scale of 1-10)
        - Their endorsement choice: 
            Option 1: I will put my name to the public statement.
            Option 2: I am willing to stake a song of my own.
            Option 3: I am willing to defend it against a hostile questioner.

