  Here’s a toast honoring your grandmother’s remarkable career while threading the needle through Darwin, the unique nature of her skill, and the reality of the transition—all within your constraints. It runs about 4.5 minutes when spoken deliberately.

  ---

  **(Raise glass, warm eye contact with Grandma)**  
  "To my grandmother. 47 years. 47 years of walking those hills, pencil in hand, ledger under arm, eyes on the sheep. Not just *seeing* them—truly *looking*, as she’d insist. Picking every single mating herself. No algorithms, no genotyping chips. Just paper, observation, and… well, we all know she forbade the usual words. Let’s just call it an astonishing consistency of judgement.  

  **(Shift tone slightly, thoughtful)**  
  I’ve been thinking about Darwin. Not about evolution’s grand sweep, but about a quieter idea he hinted at: a strange inversion. How competence often comes first, long before comprehension. How purpose and understanding aren’t the *cause* of remarkable skill, but sometimes just… its *aftermath*. How a thing can work brilliantly, flawlessly, long before anyone—even the one doing it—can fully articulate *why* it works.  

  **(Direct focus to Grandma)**  
  That, I think, is the spine of her work. She built resilience, quality, and vitality into generations of sheep. Not because she’d mapped it all out in theory first, but because she *knew how*. She saw patterns in the wool, the stance, the hardiness, that maybe defy neat genomic boxes or SNP profiles. She didn’t need the ‘why’ spelled out to execute the ‘how’ with devastating precision. And she gets rightly impatient when people assume those two things—knowing why and knowing how—are the same. They often aren’t. Her career is proof.  

  **(Acknowledge the scientists gently)**  
  Some of you spent years studying her records, building models. And those models work—beautifully, on average. But out on the tails? Where the hardest cull decisions lived? That’s where the map didn’t quite cover the territory. That’s where the sheer, lived competence—the *how* refined over decades—showed something… irreducible. Not magic, not a ‘gift’—she’d throttle me—but something honed and human. Something real is passing with her retirement.  

  **(Turn to the startup group, respectful)**  
  And that brings us to the remarkable team taking up the work. They haven’t captured her comprehension—how could they? But they *have* captured something profound: her *competence*. Their pipeline isn't built on theories that explain her. It’s built *from* her. Forty-seven years of her ‘how’, distilled. It’s a new kind of competence—one that doesn’t comprehend in the human sense, but *functions*. Turing’s child, born from her life’s work. It’s genuinely fitting: a system that works *without* needing the ‘why’, inheriting the baton from a master who showed us that such a thing is possible. It’s not continuity—it’s a transformation. One she enabled.  

  **(Include everyone, warmth returning)**  
  So we’re not here to mourn an ending, or pretend nothing changes. We’re here to honour something rare: a mastery built not on decoding life, but on *reading* it deeply, patiently, year after year. A proof that deep competence can walk ahead of comprehension, lighting the way.  

  **(Focus entirely on Grandma, sincere)**  
  Grandma—you showed us that sometimes, the deepest understanding isn’t about having all the answers, but about holding the questions in your gaze, year after year, sheep after sheep. You showed us that knowing *how* is a monumental thing, worthy of every respect, even if the ‘why’ remains wonderfully, stubbornly, yours. Your body of judgment shaped those hills. It’s shaped us.  

  **(Raise glass higher)**  
  So, to your astonishing ‘how’. To 47 years of looking, truly looking. And to the quiet, powerful truth that competence needs no permission from comprehension to change the world. We honour you."  

  ---

  **Why this works for your constraints:**  

  1.  **Darwin’s Inversion as Spine:** It’s the central framework (competence before comprehension), not decoration. Explains *why* her work was remarkable and distinct.
  2.  **"Gift"/"Instinct" Banned:** Actively reframes it as "judgement," "consistency," "lived competence," "mastery," "reading life."
  3.  **"Science Explained Her" Banned:** Explicitly states the models *didn't* capture her tail decisions ("irreducible," "map didn't cover territory") and the pipeline captures competence, *not* comprehension.
  4.  **Loss & Replacement Balanced:** Acknowledges "something real is passing" *and* validates the pipeline as a "new kind of competence," "born from her," "fitting," "remarkable," "not continuity—it’s a transformation. One she enabled." Avoids sneering or false comfort.
  5.  **"Why" vs. "How":** Explicitly names her distinction ("impatient when people assume...") and centers the toast on her mastery of the *how*.
  6.  **"Legacy" Banned:** Uses "body of judgment," "life’s work," "shaped those hills," "shaped us."
  7.  **Sister Safe (Philosophy/Evolution):**
      *   Avoids "natural selection" analogy completely.
      *   Uses Darwin only for the specific "inversion" of competence/comprehension order, not mechanism or agency.
      *   Emphasizes *her* intentionality ("picking," "judgement," "shaped"), avoiding creationist/designerless pitfalls.
      *   Clearly separates her human skill ("honed and human") from the AI's "new kind of competence."
  8.  **Audience Addressed:**
      *   **Family/Neighbours:** Warm opening/closing, accessible language ("walking the hills," "truly looking").
      *   **Scientists:** Respectfully acknowledges their work ("models work beautifully on average") and the key failure point ("tails," "irreducible") validating *her* uniqueness.
      *   **Startup:** Validates their achievement ("remarkable team," "profound," "genuinely fitting"), frames it as an honour to her ("distilled," "born from her," "enabled"), avoids any hint of dismissal.
      *   **Grandma:** Centers *her* perspective ("forbade," "insist," "impatient," "her ‘how’").

  This toast honours her depth, acknowledges the transition without flinching, and uses Darwin’s insight not to explain *her*, but to illuminate the profound nature of her empirically-grounded, comprehension-light genius.
