  Okay, the user wants a toast for their grandmother's retirement dinner. Let me start by understanding the key points. Grandma is retiring after 47 years running a hill-sheep breeding program. She never used modern genomics, relying on paper records and observation. The toast must avoid certain pitfalls: no calling her work a "gift" or "instinct," no saying science has explained her methods. The audience is mixed: family, genomics scientists who couldn't replicate her cull decisions, a startup taking over with an AI pipeline trained on her data, and a sister in philosophy of biology who objects to certain evolutionary analogies.

  First, the core message needs to center on Darwin's "strange inversion." That means framing her work as competence without comprehension. The toast must honor her unique skill while acknowledging the new AI system that's replacing her, which also operates without comprehension. The challenge is balancing respect for her legacy (without using that word) with validation for the startup's work.

  The user mentioned Grandma hates the word "legacy," so alternatives like "life's work" or "body of judgment" are better. Also, avoiding any implication that her methods are now understood. Highlight that both she and the AI work without full comprehension, but in different ways.

  The sister's concerns are important. Comparing Grandma to natural selection is problematic because natural selection lacks goals, while Grandma had intentionality. Need to clarify that distinction. Also, avoid any creationist interpretations by not implying design without a designer, but here Grandma is the designer.

  The audience segments: family needs warmth, scientists need acknowledgment of their failed replication, startups need validation of their new system. The toast must bridge these without alienating anyone. Emphasize that the AI is built from her decisions, a literal continuation of her expertise, but in a new form.

  Structure the toast: start with a hook about her dedication, introduce Darwin's inversion, explain her skill as comprehension-light but competence-heavy. Contrast with the AI, which also lacks comprehension but is competent. Address the scientists' bafflement by noting the tails where her decisions weren't replicated, underscoring her unique insight. Praise the startup's work as a monument to her judgment. End with a personal note, avoiding "legacy," focusing on her impact and the honor of celebrating her.

  Check for banned terms: no "gift," "instinct," "legacy." Ensure no sneering at the startup or consoling the family with false continuity. Use her distinction between "knowing why" and "knowing how." Emphasize that her way of knowing was practical, not theoretical.

  Finally, keep it to five minutes, so concise and impactful. Balance emotion with intellectual respect, honoring her pragmatism and the transition to AI without diminishing either.
