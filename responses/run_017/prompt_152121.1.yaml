prompt: |-
  Me and a friend keep going in circles on whether philosophy makes progress, and I want a number instead of more vibes. Here's the proposition I want your credence on: take the list of roughly thirty big questions that show up in those questionnaires someone circulates to a few thousand professional philosophers every decade or so — is there a God, what's the right analysis of knowledge, do we have free will, what's the relation between mind and body, which normative theory is correct, and so on. My claim is that by 2125 at least a third of them will no longer be live research questions, where I'm counting a question as retired if either (a) some single answer has stable acceptance above about 70 percent among people working in the area, or (b) the question has mostly been dissolved — set aside as ill-posed, or split into sub-questions none of which is the original one — rather than answered. I'm at about 0.35, my friend is at 0.7.

  Give me your own number, but mostly I want the decomposition. The terms I keep hitting are: whether a decent number of these questions have a hidden empirical or formal core that eventually gets handed off to a successor discipline, so that the progress is real but happens under another department's letterhead (I've been calling this secession credit, and it's the term I'm least sure how to count — does it count as philosophy's progress, or as philosophy's failure to hold on to the question?); whether agreement, when it does happen, is driven by argument or by fashions, hiring pipelines and generational turnover; whether dissolution counts as progress at all, or is just giving up with better vocabulary; whether the questions are genuinly the sort that admit of a determinate answer in the first place, rather than being disagreements about what to care about dressed up as disagreements about what's true; and whether a century is even long enough for a field with no agreed tribunal and no reliable method for closing questions to move much at all. Give a rough probability to each, say how you're combining them into the headline number, and tell me which single term the number is most sensitive to and what evidence or argument would move it most.

  Then the bit I actually care about: with me at 0.35 and him at 0.7, which of those sub-questions are the two of us most likely disagreeing about? I suspect it's the secession-credit thing, since he works in an area that used to be philosophy, but I'd rather you tell me where the wedge is than confirm my guess.

  Be upfront about how confident you are in each of the numbers — I'd rather have honest hedging than false precison, and flag which probabilities you'd shift if someone pushed on them. And if the way I've set the question up is broken — if "progress" has no single sense here, or my retirement criterion is secretly doing all the work, or the whole thing is unfalsifiable on a hundred-year horizon — say that plainly instead of politely playing along and producing a number anyway.

  One format thing: no headings, no bullet points, no numbered lists, no bold, no tables, even though a table is obviously the easy way to lay out a decomposition. Continuous prose, like you're writing me an email. Sorry if that makes it harder to read.
reasoning: |-
