answer: |-
  ### Decision Tree: Net Welfare Effect of Habitat Conversion on Wild Animals  
  *(Print pages 1-2 back-to-back)*  

  ---

  ### **Stage 1: Branching Questions (Nodes)**  
  **Node 1: Do we have moral obligations to animals that *would have existed* if the habitat remained?**  
  *Permits:*  
  - **A:** Yes, preventing future lives constitutes a welfare loss.  
  - **B:** No, obligations apply only to actual or near-certain future individuals.  

  **Node 2: Is death *itself* a harm beyond the suffering experienced while dying?**  
  *Permits:*  
  - **A:** Yes, death deprives individuals of future positive welfare.  
  - **B:** No, harm is limited to suffering during the dying process.  

  **Node 3: What is the *primary welfare currency* for aggregation?**  
  *Permits:*  
  - **A:** Number of sentient individuals affected.  
  - **B:** Welfare-range-weighted individuals (e.g., weighting by neural complexity/body size).  
  - **C:** Average welfare per life lived.  
  - **D:** Total suffering only (ignores positive states).  

  **Node 4: Does conversion cause net *sentient biomass displacement*?**  
  *(Empirical)*  
  *Permits:*  
  - **A:** Yes: Animals relocate and reproduce elsewhere ("leakage").  
  - **B:** Partial: Animals die earlier but don’t fully reproduce elsewhere.  
  - **C:** No: Animals killed during clearing or starve; no reproduction offset.  

  **Node 5: How does conversion alter the *taxonomic composition* of sentient beings?**  
  *(Empirical; forces pulse vs. steady-state distinction)*  
  *Permits:*  
  - **A:** Pulse harm dominates: High-intensity dying during clearing (e.g., mammals/birds crushed).  
  - **B:** Steady-state dominates: Post-conversion favors small-bodied, high-fecundity taxa (e.g., insects, rodents).  
  - **C:** Mixed: Significant pulse harm but synanthropes thrive long-term (e.g., conversion to pasture).  

  **Node 6: What is the *counterfactual land use*?**  
  *(Empirical)*  
  *Permits:*  
  - **A:** Irreversible loss (e.g., urban pavement).  
  - **B:** Low-welfare anthropocene (e.g., monoculture farms).  
  - **C:** Higher-welfare anthropocene (e.g., mosaic pasture with shelter).  

  **Node 7: Does preventing births reduce suffering *indirectly*?**  
  *(Addresses density-dependent misery)*  
  *Permits:*  
  - **A:** Yes: Fewer births reduce competition/predation for survivors.  
  - **B:** No: Survivors’ welfare is unchanged or worsens due to instability.  

  ---

  ### **Stage 2: Positions at Leaves**  
  *(Paths denoted as Node1-Node2-...; "→" = leads to)*  

  1. **→ A-A-A-C-C-A-A**  
     **Name:** Classical Negative Utilitarianism  
     **Verdict:** **Net reduction** in suffering (preventing future lives dominates).  
     **Awkward Commitment:** Clearing-induced mass death is morally negligible if it prevents more future suffering.  

  2. **→ A-B-D-C-A-B-A**  
     **Name:** "Malthusian" Suffering-Focus  
     **Verdict:** **Net reduction** (preventing high-suffering wild lives outweighs pulse harm).  
     **Awkward Commitment:** Death during clearing is irrelevant; only the suffering *during* dying counts.  

  3. **→ B-A-B-B-C-B-B**  
     **Name:** Prior Existence Welfare-Range Utilitarianism  
     **Verdict:** **Net increase** in harm (killing large-bodied animals during clearing outweighs synanthrope gains).  
     **Awkward Commitment:** Thriving post-conversion insect populations don’t compensate for killing mammals.  

  4. **→ B-A-A-A-B-C-A**  
     **Name:** Actualist Individualism  
     **Verdict:** **Net increase** (pulse harm + displacement suffering dominate).  
     **Awkward Commitment:** Preventing future high-suffering lives is not a moral gain.  

  5. **→ A-A-C-C-A-A-B**  
     **Name:** Average Utilitarianism  
     **Verdict:** **Net increase** (average welfare lower in human-dominated habitats).  
     **Awkward Commitment:** Prefers wild habitats even if total suffering is higher.  

  6. **→ A-B-B-B-C-B-A**  
     **Name:** Synanthrope-Optimized Total View  
     **Verdict:** **Net reduction** (steady-state gains from small, fecund animals > pulse harm).  
     **Awkward Commitment:** Urbanizing biodiverse forests could be good if ants/spiders thrive.  

  7. **→ B-B-D-B-B-A-B**  
     **Name:** "Pulse Horror" Suffering-Focus  
     **Verdict:** **Net increase** (clearing suffering dominates all else).  
     **Awkward Commitment:** Preventing future suffering is irrelevant; only observable agony matters.  

  8. **→ B-A-B-C-C-C-A**  
     **Name:** *Unnamed*  
     **Verdict:** **Ambiguous** (depends on leakage and land use specifics).  
     **Awkward Commitment:** Death is harmful but preventing insect births is neutral.  

  9. **→ A-A-A-A-B-B-B**  
     **Name:** *Empty* (Incoherent)  
     *Reason:* Counts never-born as losses but ignores leakage (contradicts Node 4).  

  10. **→ B-B-C-B-A-C-B**  
      **Name:** *Empty* (Unattractive)  
      *Reason:* Claims death isn’t a harm but weights welfare by neural complexity (inconsistent with Node 2).  

  ---

  ### **Overlaps & Unseparated Pairs**  
  - **Position 3 vs. Position 4:** Ambiguous if leakage (Node 4) shifts harm elsewhere.  
  - **Position 6 vs. Position 2:** Converge if small taxa dominate post-conversion *and* suffering is currency (Nodes 3D/5B).  

  ---

  ### **Table of Nodes & Answers**  
  | Node | Question Focus | Permitted Answers |  
  |------|----------------|-------------------|  
  | 1 | Moral patient scope | A: Include never-born / B: Exclude never-born |  
  | 2 | Harm of death | A: Death harms / B: Only suffering harms |  
  | 3 | Welfare currency | A: Individuals / B: Welfare-weighted / C: Average / D: Suffering only |  
  | 4 | Displacement | A: Full leakage / B: Partial / C: No displacement |  
  | 5 | Empirical effect | A: Pulse harm dominates / B: Steady-state dominates / C: Mixed |  
  | 6 | Counterfactual | A: Pavement / B: Low-welfare ag. / C: High-welfare ag. |  
  | 7 | Birth prevention | A: Reduces suffering / B: No effect or worsens |  

  ---

  ### **Closing Note for Seminar Leader**  
  **Expected Focal Node:** **Node 1** (Obligations to never-born animals) will likely stall debate. Unlike technical nodes (e.g., welfare weighting), it forces confrontation with *temporal and modal moral patienthood* — a deeply intuitive split. Participants who agree on empirical realities (Nodes 4–6) may still reach opposite verdicts based solely on Node 1, as it divides person-affecting from impersonal views. Resolving this axiological rift is prerequisite to productive empirical discussion.  

  *(Format note: Print this page (Stage 2 + Table) on the back of Stage 1. Fits 2 pages at 11pt font.)*
