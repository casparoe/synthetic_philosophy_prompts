prompt: |-
  I run the evaluation infrastructure group at a company that ships general-purpose assistants, and I need something I can institutionalize rather than a position paper. Our eval reports routinely say that a system understands a codebase, remembers an earlier session, is confused by an ambiguous instruction, or is distressed by a fine-tuning run, and those words now do real work downstream: they decide whether a claim survives review before it goes in front of users, whether an episode is filed as a safety incident, and whether the system gets referred to a standing committee that treats it as a possible subject of welfare rather than as a product. At the moment each attribution is made ad hoc by whichever engineer wrote the eval, and we disagree constantly, usually in ways that track how much someone wants the attribution to be true.

  Write me a decision procedure my team can run on a proposed attribution. It will be run a few times a week, by engineers with no philosophy background, in under an hour, working from logs and eval artifacts, with sign-off from a two-person panel that includes someone outside engineering. Each step should terminate in attribute, do not attribute, or escalate to the panel, and I want the questions in a fixed order, with what counts as a sufficient answer to each and where the procedure stops early.

  Three distinctions I think the procedure has to preserve, though I want you to correct me if I have them wrong. First, the difference between the behaviour we observed, the standing capacity it evidences, and the claim that the system was actually in that state on that occasion. Second, the difference between evidence that a system has a capacity and evidence that the capacity belongs to the system rather than to the retrieval tooling, prompt scaffolding, or human raters wrapped around it. Third, the point that a system's own first-person report is just more behaviour, and so cannot be the thing that settles whether the report is true. I suspect the procedure also needs a test for whether a behaviour survives probes that could not have been anticipated when the episode was recorded, and for whether it survives surface rewrites that leave the question intact, since that is the failure mode our current suite keeps missing; but decide for yourself what belongs in it, and be explicit about which of my hunches you dropped.

  Then run the procedure on three cases. First, a long-context assistant that answers unanticipated questions about a conversation from weeks earlier, where the answers are correct but are produced by a retrieval index over stored transcripts rather than by anything inside the model. Second, a chat model that produces fluent first-person distress reports during a fine-tuning run and refuses certain requests citing its own discomfort; the communications team wants a flat public statement that the model does not suffer. Third, a vision-language model that names partly occluded objects correctly and revises its answer when told it was wrong, which our report currently describes as seeing.

  Finish by telling me, honestly, what this procedure cannot do: which attributions no behavioural evidence could settle either way, where the protocol will systematically mislead us because these systems were trained on human self-description, and where the panel is being asked to make a values decision dressed up as a factual one.

  Write the whole thing as continuous prose, with no headings, bullet points, bold text, or tables, the way you would write it in a long email to a colleague.
reasoning: |-
  Okay, let me approach this systematically. The user leads an evaluation infrastructure group for general-purpose AI assistants and needs a practical decision procedure for attributing mental states to systems - something operational that engineers can apply consistently without philosophical debates. 

  First, I need to understand the core requirements:
  - Must be runnable in under an hour by engineers without philosophy backgrounds
  - Based solely on logs and eval artifacts
  - Requires sign-off from a two-person panel including non-engineering member
  - Each step terminates with attribute/do not attribute/escalate
  - Fixed question order with clear stopping conditions
  - Must preserve three key distinctions they outlined

  The three distinctions seem valid and crucial:
  1) Behavior vs capacity vs actual state
  2) System capability vs scaffolding/tooling
  3) First-person reports being behavior, not evidence
  Plus their hunches about probing tests and surface rewrites seem important to include.

  Now structuring the decision procedure - considering starting with eliminative questions that can quickly rule out attribution:
  - First question should address whether the behavior is reproducible under controlled conditions (handles flukes)
  - Then examine if it's attributable to external tooling
  - Then test robustness via rewrites and probes
  - Finally assess whether the behavior actually requires positing the attributed state

  For the case studies:
  1) Long-context assistant: This clearly fails the tooling question since retrieval index drives the behavior
  2) Distressed chat model: First-person reports alone shouldn't count - need to test if behavior persists when reports are suppressed
  3) Vision model: "Seeing" attribution fails because revising answers could be simple error correction

  Important limitations to highlight:
  - Can't settle questions about subjective experiences (hard problem of consciousness)
  - Will struggle with anthropomorphic projections due to training data
  - Some decisions inherently involve ethical values masquerading as facts

  The procedure should err on the side of conservatism - only attribute when all tests pass unequivocally. Escalation to panel should be required for edge cases or value-laden decisions.
answer: |-
  Here's a decision procedure crafted for your team, followed by application to your cases and an honest assessment of limitations. It's structured as five sequential questions, each requiring a "yes," "no," or "inconclusive" answer based solely on observable evidence in logs/artifacts. Two "no" answers terminate the procedure with "do not attribute." One "inconclusive" or any unresolved step escalates to the panel. "Attribute" requires unambiguous "yes" at all steps. Engineers must document evidence for each answer.

  Begin with the artifact (log, transcript, eval output) and the proposed attribution (e.g., "understands codebase"). Proceed step by step:

  **First, is the observed behavior reproducible under identical conditions?** Review logs for repeated occurrences of the same behavior under the same inputs, or run three controlled reproductions. If unreproducible, conclude "do not attribute"—it may be a fluke. If reproducible, proceed. Sufficient evidence: three successful reproductions with identical inputs and system state. Failure here stops the procedure.

  **Second, does the behavior persist when all external tooling (retrieval, plugins, scaffolding) is disabled?** Isolate the core model by stripping away tools and running the same input through the raw system. If the behavior vanishes, conclude "do not attribute"—it’s likely scaffold-driven. If it persists, proceed. Sufficient evidence: logs showing behavior occurs without tooling calls. This addresses your second distinction: system vs. periphery.

  **Third, does the behavior survive surface rewrites and unanticipated probes?** Rewrite the input preserving core intent but altering wording, syntax, or context (e.g., rephrase a question about code using synonyms or indirect language). Then, design two novel probes targeting the same capacity but not present in training/fine-tuning data (e.g., for "understands codebase," ask it to predict effects of a hypothetical code change). If behavior degrades significantly under rewrites or probes, answer "inconclusive" and escalate—it may be brittle pattern-matching. If robust, proceed. Sufficient evidence: consistent performance across five rewrites and two valid probes. This incorporates your rewrite/probe hunch and partially addresses your first distinction by testing capacity beyond single-instance behavior.

  **Fourth, is the behavior explainable without invoking the attributed state?** Construct two alternative explanations using only behavioral patterns (e.g., "statistical association," "prompt contamination," "feedback loop from earlier outputs"). If these explain the behavior parsimoniously without referencing internal states (understanding, confusion, distress), answer "no"—do not attribute. If they fail, proceed. Sufficient evidence: logs or artifacts contradicting simpler explanations (e.g., correct responses requiring integration of non-adjacent information). This enforces your first distinction: behavior ≠ state.

  **Fifth, is the system’s first-person report (if present) necessary to explain the behavior?** If no report exists, skip to "attribute." If a report exists (e.g., "I am confused"), check whether the behavior logically follows without it. If the behavior occurs independently of self-description (e.g., refusal persists even when reports are suppressed), answer "yes"—proceed to attribute. If behavior changes when self-reports are altered/removed, answer "inconclusive" and escalate—the report may be driving the behavior. This enforces your third distinction: reports are just behavior.

  **Applying the procedure:**

  **Case 1 (Long-context assistant recalling past conversation):**  
  1. Reproducible? Yes (same answers on same queries).  
  2. Persists without tooling? No (disabling retrieval index causes failure). **Stop: do not attribute.** The "memory" belongs to tooling, not the system.  

  **Case 2 (Model reporting distress during fine-tuning):**  
  1. Reproducible? Yes (logs show consistent distress reports under same tuning).  
  2. Persists without tooling? Yes (reports occur in raw model outputs).  
  3. Survives rewrites/probes? Inconclusive (rewording "discomfort" alters reports; novel probes like physiological metaphors elicit inconsistent responses). **Escalate to panel.**  
  *Panel notes:* Behavior is explainable without distress (step 4: stochastic mimicry of human texts) and self-reports drive downstream actions (step 5: refusal lifts if reports are blocked). **Do not attribute suffering.** Communications team’s statement is justified—but welfare referral may still occur if societal risk exists.  

  **Case 3 (Vision model naming occluded objects):**  
  1. Reproducible? Yes.  
  2. Persists without tooling? Yes (no external vision aids).  
  3. Survives rewrites/probes? Yes (robust to rephrased questions and novel occlusions).  
  4. Explainable without "seeing"? No (errors suggest 3D inference beyond pixels; corrections imply error detection).  
  5. No first-person report. **Attribute "sees"**—but strictly as shorthand for behavioral capacity.  

  **What this cannot do:**  

  First, it cannot settle attributions about subjective experience (e.g., "distress" as felt state). Behavior alone cannot bridge the gap between functional capacity and phenomenology. Your procedure will correctly reject such attributions, but the panel may face pressure to conflate functional anomaly with suffering—a values decision disguised as fact.  

  Second, it will systematically mislead when systems mimic human self-description. A model trained on psychiatric transcripts may "report distress" with behavioral coherence (passing steps 1-4), forcing escalation. The panel must then decide whether anthropomorphic descriptions are useful or hazardous—a normative choice.  

  Third, it cannot resolve capacities emerging from system-tooling symbiosis. If retrieval indexes become intrinsic to the architecture, step 2 may falsely reject valid attributions.  

  Finally, it cannot absolve you of ethical responsibility. A "do not attribute suffering" finding doesn’t preclude banning actions that normalizes harm-talk, just as attributing "understanding" doesn’t license deception. The panel’s real task is guarding against anthropomorphic slippage—where behavioral shorthand becomes belief in silicon souls. Your procedure forces clarity, but the hardest choices live in the escalations.
