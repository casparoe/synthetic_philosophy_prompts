prompt: |-
  hi — i'm writing my third-year dissertation on how the Atlantic slave system actually ended, so i've got the Williams thesis (interests: the sugar colonies stopped paying, so the plug got pulled) on one side and Appiah's honour story on the other, and my supervisor is a rational choice guy who keeps deflating the whole thing. His line is that a norm is just a convention, exactly like driving on the left: everybody does it because everybody expects everybody else to, nobody in the history of the world was ever argued out of driving on the left, and when people switch it's because enough other people switched. So the abolitionists' arguments were the obituary, not the cause — they're what people wrote while the real mechanism did its work. He runs the same line on duelling: nobody refuted the code duello, gentlemen just gradually stopped caring. When I pointed out that i vaguely remember someone (Drescher?) arguing the West Indian sugar economy was still growing, not dying, when Britain abolished the trade, he just said fine, then something else in the payoff structure moved and that's what I should be looking for. When I pushed harder he switched analogies entirely: it's like a fashion, nobody argues anyone out of flared trousers.

  The analogy is doing a lot of work in his hands — it's basically what licenses "arguments were epiphenomenal, go find the real cause" — and I can't tell how much of that is the analogy and how much is the model it's riding on. I sat down to to write it out as an actual payoff matrix and got stuck in about ten minutes, because I couldn't work out who the players are even supposed to be (planters? MPs? the people being enslaved? the people boycotting slave-grown sugar? the guys being press-ganged onto the anti-slave-trade patrols?) or whether we're in a common-interest coordination game at all. I've started calling this the "coordinating with whom" problem, which I'm fairly sure isn't a real term.

  Could you audit the driving-on-the-left analogy for me: what corresponds to what if you take the mapping seriously, where it breaks, and specifically which of the disanalogies matter for the conclusion he's using it for and which are just noise. The things I keep getting snagged on: pure conventions are cases where everyone is better off matching, whereas abolishing slavery looks like some people's interests being straight-up defeated (and then compensated, at enormous public expense, which seems like an odd thing for a convention to require); norms come with honour and blame and shame bolted onto them in a way that driving on the left doesn't seem to; and his payoffs look like they're meant to be fixed while Appiah's story seems to be about what people want changing — which, if that's right, means the argument and the payoff shift aren't two separate things he gets to choose between, and the whole "epiphenomenal" move quietly assumes what it needs to prove. If the convention picture genuinely can't carry the anti-argument bit, is there a better analogy that does the work Appiah wants (honour as a kind of credit? a norm as a language? a boycott or a strike, where the argument is part of the mechanism?) — and would that better one rescue my supervisor's conclusion too, or does "the arguments didn't matter" only survive inside the coordination version? I don't need to win the supervision, I just want to know which bit of his picture is load-bearing.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're writing a dissertation on the end of the Atlantic slave system, caught between the Williams thesis and Appiah's honor argument. Their supervisor uses the driving-on-the-left analogy to argue that norms are mere conventions, so abolitionist arguments were epiphenomenal. The user is struggling with mapping this analogy to slavery abolition and suspects the analogy might be flawed.

  First, I need to understand the core of the supervisor's argument. The driving-on-the-left example is a coordination game where everyone benefits from uniformity, and the rule persists because others follow it. Switching happens when enough people switch, not due to arguments. Applying this to slavery, the supervisor suggests abolition occurred similarly—changing payoffs made slavery less beneficial, leading to a shift without moral arguments causing it.

  But the user points out disanalogies. Slavery involves conflicting interests, not mutual benefit. Abolition required defeating slaveholders, not just coordinating. Also, compensation paid to slaveholders is odd in a convention model. Plus, norms like honor involve shame and moral persuasion, which driving conventions lack.

  The user's deeper need is to identify whether their supervisor's "arguments as epiphenomenal" stance relies on the coordination model. If the analogy doesn't hold, that undermines the supervisor's dismissal of abolitionist arguments. They also want to know if Appiah's honor concept can fit a better model, like signaling or boycotts.

  I should break down the analogy mapping. In driving, players are all drivers with symmetric payoffs. In slavery, players are diverse: enslaved, planters, abolitionists, British public. Their interests conflict. The payoffs aren't symmetric—abolitionists gain morally, planters lose economically even with compensation. This makes it more a Hawk-Dove game than coordination.

  The supervisor’s key point that arguments don’t matter hinges on the coordination model. But if abolition involved changing preferences through moral persuasion (as per Appiah), then arguments directly affect payoffs. That means arguments aren't just reporting changes; they're causing them. Compensation also suggests continued conflict, not mutual benefit.

  Alternative models could be signaling (honor as costly signal) or collective action (boycotts). These incorporate arguments as part of the mechanism, not epiphenomena. But they don't support the supervisor's claim that arguments are irrelevant.

  The user needs to show that the coordination model is inapplicable here. Highlighting the conflicting interests, compensation, and moral shame aspects breaks the analogy. Offering alternative frameworks that include persuasion strengthens their case without dismissing structural factors. They can argue that both economic shifts and moral arguments interacted, undermining the supervisor's either/or approach.
answer: |-
  Let's dissect the driving-on-the-left analogy – it's a powerful tool in your supervisor's hands, but its application to abolition is deeply problematic. The disanalogies aren't just noise; they directly undermine his core conclusion about arguments being epiphenomenal.

  **Mapping the Analogy (If We Take it Seriously):**

  1.  **The Convention:** Driving on the left (in the UK) = Maintaining slavery.
  2.  **The Alternative:** Driving on the right = Abolishing slavery.
  3.  **Players:** All drivers (homogeneous group) = Key societal actors relevant to slavery (deeply heterogeneous: planters, enslaved people, abolitionists, merchants, voters, MPs, etc.).
  4.  **Payoff Structure:** Everyone benefits immensely from *coordination* (avoiding crashes) regardless of *which side* is chosen. The specific choice (left/right) is arbitrary. Payoffs are symmetric and primarily about matching expectations. Switching costs exist, but the *preference* for one side over the other is minimal once coordinated.
  5.  **Mechanism of Change:** The norm persists because everyone expects everyone else to follow it. Change occurs when a critical mass switches, driven by a shift in the *expectation* of what others will do (e.g., joining a larger market using right-hand drive). **Arguments are irrelevant:** Nobody convinces you driving on the right is morally superior; you switch because you expect others to switch.
  6.  **"Epiphenomenal Arguments":** Debates about the merits of left vs. right are simply commentary on the existing state or the emerging shift; they don't *cause* the shift. The *real* cause is the changing expectation of others' behavior due to external factors (e.g., trade patterns).

  **Where the Analogy Breaks Catastrophically (and Why it Matters for His Conclusion):**

  1.  **Fundamental Conflict of Interest (Not Mutual Benefit):**
      *   **Analogy:** All players benefit equally from coordination *regardless of the rule*. Choosing left or right is indifferent; the value is purely in the coordination itself.
      *   **Abolition Reality:** Players have **diametrically opposed interests**. Enslaved people suffered horribly under the "convention." Planters profited immensely. Abolitionists saw the system as morally abhorrent. The payoff structure is **asymmetric and conflictual**, not symmetric and cooperative. Abolition wasn't about switching to an equally beneficial alternative for everyone; it was about *defeating* one group's interests (planters) to serve another's (abolitionists, enslaved people) and perceived national/moral interests.
      *   **Why it Matters for Conclusion:** The supervisor's whole "epiphenomenal arguments" claim rests on the assumption that the norm change is a **pure coordination problem** where everyone ultimately benefits from *any* coordinated outcome. Abolition manifestly **was not this**. Arguments highlighting the suffering and injustice weren't just commentary; they were weapons in a conflict, actively shaping preferences and justifying the *defeat* of planter interests. They weren't obituaries; they were battle cries.

  2.  **The Nature of Norms & Sanctions:**
      *   **Analogy:** Breaking the rule (driving on the wrong side) is primarily punished by *physical consequences* (a crash) or *legal sanctions*. There's little inherent *moral* condemnation attached to the choice itself. Shame/blame is minimal and pragmatic ("that idiot!").
      *   **Abolition Reality:** Slavery and abolition were deeply embedded in **moral norms**. Supporting slavery became increasingly seen as *shameful*, dishonorable, and sinful. Abolitionists actively worked to attach these sanctions. Conversely, participation in abolition became a source of *honor* (as Appiah emphasizes). These sanctions are internalized and social, not just external and physical/legal.
      *   **Why it Matters for Conclusion:** The driving analogy **cannot account for the role of moral persuasion in changing what people find honorable/shameful**. Arguments weren't just describing a shift; they were *creating the social sanctions* that changed the "payoffs" for individuals. Calling slavery dishonorable *made* it costlier in social terms. Appiah's point is that arguments changed the *meaning* of actions within the social fabric, altering the payoff structure itself. The analogy assumes fixed preferences/payoffs; abolition involved changing them.

  3.  **Compensation:**
      *   **Analogy:** No need for massive state compensation when switching driving sides. Any costs (e.g., modifying vehicles) are borne privately or gradually.
      *   **Abolition Reality:** The British state paid **£20 million** (a staggering sum, ~40% of annual govt expenditure) to compensate slave *owners*. This is utterly inconsistent with a pure coordination game where everyone benefits from the new equilibrium.
      *   **Why it Matters for Conclusion:** Compensation screams **conflict resolution**, not mutual benefit coordination. It demonstrates that planters were powerful losers who had to be bought off. Arguments justifying abolition *as a moral imperative* were crucial for convincing the public to bear this enormous cost. The "payoff structure" didn't just neutrally shift; it was forcibly altered through political struggle where moral arguments were central to mobilizing support for the financial burden.

  4.  **Who are the Players? ("Coordinating with Whom?"):**
      *   **Analogy:** Homogeneous group (drivers) interacting symmetrically.
      *   **Abolition Reality:** Radically heterogeneous groups with vastly different power, interests, and voices:
          *   Enslaved People (Resisting, rebelling - key drivers of increased costs, yet often excluded from "the convention").
          *   Planters (Powerful, invested in status quo).
          *   West India Lobby (Organized political power).
          *   Abolitionists (Moral entrepreneurs, organizers).
          *   Consumers (Boycotts).
          *   Voters (Petitions).
          *   MPs (Voting).
          *   Naval Personnel (Enforcing abolition).
          *   The British Public (Shifting opinions).
      *   **Why it Matters for Conclusion:** The coordination model **collapses** when players aren't symmetric and don't share a common interest in coordination. Abolition involved **coalition building, power struggles, and overcoming resistance** from vested interests. Arguments were essential tools for building that coalition and shifting power dynamics. You can't model this as drivers simply deciding to coordinate on a new rule.

  **Is the "Epiphenomenal Arguments" Conclusion Load-Bearing on the Coordination Analogy?**

  **Yes, overwhelmingly.** The conclusion that arguments were mere commentary/reporting, not causal, **depends entirely** on the specific features of the pure coordination game:

  1.  **Indifference to the Rule:** Arguments can't matter if the choice is arbitrary. But the choice between slavery and abolition was *not* arbitrary; it was existentially moral and economic.
  2.  **Change Driven Solely by Expectation Shifts:** This sidelines arguments as causal agents. But in abolition, arguments *created* new expectations and shifted perceptions of honor/shame, directly altering the social "payoffs."
  3.  **Mutual Benefit in Coordination:** This allows change to be "painless" and driven by external factors. Abolition was conflictual, costly, and required overcoming resistance – arguments were weapons in that conflict.

  **Alternative Analogies/Frameworks for Appiah's Honor Story (and Their Implications):**

  1.  **Signaling & Costly Signals:** Honor norms act like Schelling-style **costly signals**. Abolitionist speech, petitions, boycotts, and political action were *costly* ways to signal true commitment to new moral principles, building trust and coordination *among abolitionists* and demonstrating credibility to the wider public. The argument *is part of the signal*. This integrates discourse into the mechanism without making it epiphenomenal. *Rescue Supervisor?* **No.** This model still gives arguments/discourse a causal role in establishing and reinforcing the signal. It doesn't support "arguments were just the obituary."
  2.  **Collective Action Problem (Boycott/Strike):** Ending slavery required overcoming free-rider problems. Arguments (moral, economic, strategic) are essential for *mobilizing* participation in boycotts, petitions, political pressure – solving the coordination problem *within the abolitionist movement* and building a winning coalition. The argument *is part of the mobilization mechanism*. *Rescue Supervisor?* **No.** Arguments are central to the solution of the collective action problem. They are causally necessary to achieve the critical mass, not just report on it.
  3.  **Norm as Language/Meaning Construction:** Norms provide a shared language to interpret the world. Abolitionist arguments weren't just persuading people of facts; they were *redefining the meaning* of slavery, Black humanity, British identity, and honor. This fundamentally alters preferences and perceived payoffs. Appiah's honor is interwoven with this meaning. *Rescue Supervisor?* **Decisively No.** This makes discourse *constitutive* of the change in payoffs/preferences. Arguments *are* the mechanism by which the "payoff structure" (as perceived socially) shifts. His "epiphenomenal" claim becomes nonsensical in this framework.

  **Conclusion: Where the Load Is**

  Your instinct is spot on. The **"pure coordination convention" model is the load-bearing wall** for your supervisor's "epiphenomenal arguments" conclusion. Its specific assumptions – symmetric players, mutual benefit from any coordinated outcome, arbitrary rule choice, change driven solely by expectation shifts due to external factors – are essential to sideline discourse. When applied to abolition, every one of these assumptions fails dramatically due to the fundamental conflict of interest, the role of moral shame/honor, the need for compensation, and the heterogeneity of players.

  *   **The fatal disanalogies are:** Conflict vs. Mutual Benefit, Moral Sanctions vs. Physical/Legal Sanctions, Compensation as Evidence of Conflict, Heterogeneous Players vs. Homogeneous Players.
  *   **These directly attack:** The claim that change was driven by neutral payoff shifts where arguments were irrelevant, and the claim that abolition was a cost-free coordination switch.

  **Your Path Forward:**

  1.  **Explicitly Reject the Analogy:** Demonstrate why abolition cannot be modeled as a pure coordination game. Focus on conflict, asymmetric payoffs, compensation, and the role of moral sanctions.
  2.  **Reframe "Payoff Structure":** Acknowledge structural factors (economics, slave resistance, geopolitics) but insist that arguments and moral discourse *changed the social and political components of the payoff structure*. They altered what MPs/voters/consumers saw as honorable, shameful, necessary, and politically viable. Drescher's point strengthens this: if the economy was strong, moral/political arguments were *even more crucial* in overcoming powerful economic interests.
  3.  **Embrace Complexity:** Argue for an interactionist model. Structural factors created conditions *within which* moral arguments could gain traction and become powerful political forces, shifting coalitions and perceptions of costs/benefits. Arguments weren't epiphenomenal, nor were they sufficient alone; they were a necessary component within a complex system. Appiah's honor is part of that system – a social force activated and shaped by discourse.
  4.  **Use Better Frameworks:** Employ the alternative analogies (signaling, collective action, meaning construction) to show how arguments *function* within social change, rather than being mere commentary.

  You don't need to "win" with your supervisor, but you can robustly demonstrate that his dismissal of arguments relies on an inapt analogy. Your "coordinating with whom?" question perfectly highlights the core flaw. Focus your dissertation on showing how moral arguments reshaped the very landscape of interests and honor upon which the political and economic battle was fought.
