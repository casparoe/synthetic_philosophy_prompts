prompt: |-
  I am a novelist, and a long-form essay I read recently in a literary magazine — part of a series on "post-truth fiction" — summarised pragmatic encroachment and epistemic contextualism roughly as follows:

  "The two theories come to much the same thing: whether someone counts as knowing depends on how much is at stake. Contextualists hold that the word 'knows' shifts its meaning with the conversational context, so that raising the stakes raises the standard — a woman who knew the bank would be open on Saturday morning ceases to know once a missed payment will cost her the house. Pragmatic encroachment adds that the operative stakes are those of whoever is doing the attributing, which means knowledge is less a fact about the subject than a status we confer on people when their evidence is good enough for our purposes. The view has accordingly been refuted by its central objection — that it makes what a person knows depend on who happens to be talking about them — and few philosophers defend it any longer."

  I suspect this is unfair, and I am fairly confident about the "much the same thing" part, since I have seen the two views listed separately, but I cannot locate the rest. Could you go through the passage and tell me what a defender of each view would accept, what is a legitimate simplification for a general reader, and what is simply wrong or overstated — and, in particular, whether the essay's conclusion that the position has been refuted survives once the summary is corrected?

  The reason I care is that I wanted to press one of these views into service in the novel I am drafting. It is narrated in the first person by a woman recalling a death she may have caused, and at a crucial point she says of her sister, "she knew the letter was a forgery." I want the reader to feel that line turn false as the stakes for the sister inside the story rise, even though nothing whatever is at stake for the narrator or for the reader. I have been calling this "diegetic encroachment": the proposal that, in fiction, a knowledge attribution answers to the practical situation of the character it is about rather than to that of the speaker, the audience, or the author. Does anything in contextualism or pragmatic encroachment actually support that extension, is it a coherent thesis in its own right, or does it rest on a confusion that the corrected version of the theories exposes? Please write in British English.
reasoning: |-
  Okay, I need to start by understanding the user's query. They're a novelist who's come across a summary of pragmatic encroachment and epistemic contextualism in a literary magazine. The summary claims these theories are essentially the same and that pragmatic encroachment has been refuted. The user suspects this is unfair and wants a detailed correction. They're also developing a narrative technique called "diegetic encroachment" for their novel, where a character's knowledge attribution changes based on that character's stakes, not the narrator's.

  First, I'll break down the passage from the essay. The key points are: 1) both theories make knowledge depend on stakes, 2) contextualism says "knows" shifts meaning with context, 3) pragmatic encroachment ties knowledge to the attributor's stakes, making it subjective, and 4) pragmatic encroachment has been refuted because it makes knowledge depend on who's talking. The user questions this representation, especially the conflation and the claim of refutation.

  I recall that while both theories involve stakes, they're distinct. Contextualism is about semantic context-sensitivity, like "tall" meaning different things in different conversations. Pragmatic encroachment argues that practical stakes affect the epistemic standards for knowledge itself, which is ontological. The essay's summary blurs these lines by saying they come to "much the same thing," which is an oversimplification. Philosophers like Stanley (for encroachment) and DeRose (for contextualism) maintain clear distinctions.

  The claim that pragmatic encroachment is refuted seems overstated. While there are objections—notably the "strange and fleeting facts" problem that knowledge changes with attributor context—it's still a defended position. Philosophers like Fantl and McGrath have refined it to address these concerns. Saying it's abandoned is inaccurate; recent publications show ongoing debate.

  For the user's novel idea, "diegetic encroachment" is fascinating. They want a character's knowledge attribution ("she knew") to hinge on that character's stakes within the story, ignoring the narrator's stakes. Neither theory directly supports this. Contextualism focuses on the attributor's context—here, the narrator—so if the narrator's stakes are low, "knows" should have a low standard. Pragmatic encroachment also ties to the attributor. The user's idea flips this, making it character-centric. 

  Is this coherent? It could be, as a narrative device. Fiction often bends real-world rules for effect. Philosophically, it might align with subject-centered encroachment, but that's not mainstream. The user should present it as a stylistic choice, not a philosophical argument. They could use contextualism if the narrator's context shifts to mirror the character's stakes, but that's not what they described.

  The user's deeper need is to create a turning point where a line feels true then false as stakes rise. They want theoretical backing but might be using philosophy more for inspiration. Clarifying the theories helps them decide how to frame their device—whether to ground it in existing ideas or present it as innovative fictional logic.

  I should structure the response by correcting the essay's summary point by point, then address "diegetic encroachment." Use British English, as requested. Emphasize that while their idea isn't directly supported, it's viable in fiction. Warn against misrepresenting the theories but encourage creative adaptation.
answer: |-
  Here’s a breakdown of the essay’s claims, corrections from a philosophical perspective, and analysis of your "diegetic encroachment" idea – all in British English:

  ### Corrections to the Essay's Summary:
  1.  **"Much the same thing"**: **Overstated/Incorrect.**
      *   **Defenders would reject:** Both theories *do* involve stakes affecting whether we *say* someone "knows," but their explanations differ fundamentally.
      *   **Legitimate Simplification:** "Both theories agree that whether we *say* someone 'knows' something can depend on how important it is."
      *   **What's Wrong:** Contextualism is about the *meaning* of the word "knows" in a conversation. Pragmatic Encroachment (PE) is about the *nature of knowledge itself*. Contextualism is semantic; PE is metaphysical/epistemic. This is a major distinction in philosophy. Stanley's *Knowledge and Practical Interests* (2005) explicitly argues *against* contextualism in favour of PE.

  2.  **Contextualism Description**: **Mostly Legitimate Simplification.**
      *   **Defenders accept:** (e.g., DeRose, Lewis) The semantic standards for "knows" *do* shift with the conversational context. Yes, in a low-stakes context, "S knows P" might be true, but in a high-stakes context (even for the *attributor*), "S knows P" might be false because "knows" now demands more evidence. The bank case is the classic example.

  3.  **Pragmatic Encroachment Description**: **Partially Correct, Partially Misleading.**
      *   **Defenders accept (e.g., Fantl & McGrath, Stanley):** Knowledge itself depends not just on truth, belief, and evidence, but *also* on the practical stakes facing the *subject* (the person who might act on the belief). If the stakes are high enough *for the subject*, they need *better evidence* to genuinely *know* P.
      *   **What's Wrong/Misleading:**
          *   **"Operative stakes are those of whoever is doing the attributing"**: **Mostly Incorrect.** Standard PE focuses primarily on the stakes of the *subject* (the knower), *not* the attributor. It's about what the subject must meet to *have* knowledge, given what's at stake *for them*. The essay confuses PE with a *version* of contextualism where the attributor's context sets the standard *based on their own stakes*. PE is subject-centered.
          *   **"Knowledge is less a fact about the subject than a status we confer"**: **Directly Contradicts PE.** PE defenders argue precisely that knowledge *is* a fact about the subject – one that depends on their practical situation. It's not merely a status we confer; it's a state the subject is genuinely in *or not*, partly determined by their stakes. This mischaracterisation makes PE sound like a social constructivism it explicitly isn't.

  4.  **"Refuted by its central objection... few philosophers defend it"**: **Grossly Overstated/Incorrect.**
      *   **Defenders reject:** The "central objection" described (making knowledge depend on who is talking) is actually a common objection *to attributor-contextualism*, *not* to standard subject-centered PE. The objection to PE is often called the "strange and fleeting facts" objection – that it makes knowledge depend on fleeting facts about the *subject's* practical situation (e.g., suddenly needing money changes whether you *knew* the bank was open yesterday). This *is* a serious challenge.
      *   **Reality:** PE remains a highly active area of debate. While controversial, it is *not* considered "refuted" or abandoned. Leading philosophers like Jeremy Fantl, Matthew McGrath, Jason Stanley (though his position has nuances), and others actively defend and refine versions of it. Numerous papers and books continue to be published on it. The essay's claim is simply false.

  ### Summary of Corrections
  *   **Conflation:** The essay wrongly equates two distinct theories and misattributes core features (especially making PE about the attributor).
  *   **Contextualism:** Correctly described as involving semantic shift based on conversational context (often driven by stakes salient *in* that context).
  *   **Pragmatic Encroachment:** Incorrectly described as attributor-focused and as a "status conferred." It's primarily subject-focused and concerns the *metaphysics* of knowledge, not just speech acts. It is *not* refuted or defunct.

  ### "Diegetic Encroachment" & Your Novel
  Your idea is fascinating and philosophically resonant, but it doesn't directly map onto either theory as standardly conceived.

  1.  **Support from Standard Theories?**
      *   **Contextualism:** Contextualism focuses on the context of the *attributor* (the speaker). In your novel, the narrator *is* the attributor ("she knew..."). If contextualism holds, the meaning of "knew" should depend on the narrator's conversational context and stakes *as the speaker*. You explicitly want it to depend on the *sister's* (the subject's) stakes, *ignoring* the narrator's stakes. Standard contextualism doesn't support this; it would tie the standard to the narrator.
      *   **Pragmatic Encroachment:** PE is subject-centered! It *does* say that whether the *sister* (the subject) *knew* depends partly on *her* practical stakes at the time. This *directly* aligns with the core idea you want: her knowledge state changes as *her* stakes rise.
      *   **The Catch:** PE is about the subject's *actual* epistemic state in the *real world* (or the story's world). Your narrator is making a claim *about* that past state. For PE to make the *attribution* "she knew" turn false, it would require that the sister's rising stakes *at the time* meant she genuinely *didn't know* then. The attribution is reporting a fact about her past state, determined by *her* past stakes. This seems exactly what you want. The narrator's *own* (current, low) stakes are irrelevant to what the sister *knew then* according to PE.

  2.  **Is "Diegetic Encroachment" Coherent?**
      *   **Yes, especially grounded in PE.** Your description – "a knowledge attribution answers to the practical situation of the character it is about" – is essentially a narrative application of subject-centered Pragmatic Encroachment. It posits that *within the fiction*, a character's knowledge is a property that depends on *their* practical stakes. The narrator is reporting that (stakes-dependent) fact about the sister.

  3.  **Potential Confusion Exposed?**
      *   The essay's confusion between attributor and subject stakes highlights *why* your idea might seem radical. If you mistakenly thought PE was about the attributor (like the essay claims), then your "diegetic encroachment" would seem like an inexplicable third thing. However, once PE is correctly understood as *subject-centered*, your idea becomes a natural, even intended, consequence of applying PE within a fictional narrative. The key confusion the essay exposes (and commits) is mixing up *whose* stakes matter (attributor vs. subject). Correcting that clarifies that your idea aligns perfectly with PE.

  ### Conclusion & Advice for Your Novel
  *   **The Essay's Conclusion:** Its claim that PE is "refuted" and "few defend it" is demonstrably false. PE is alive, debated, and subject-centered. Ignore this part of the essay.
  *   **"Diegetic Encroachment":** Your concept is coherent and best supported by **Pragmatic Encroachment (PE)**, *correctly understood as subject-centered*. It fits perfectly: the sister's rising stakes *within the story* mean that, according to PE, she no longer *knew* (or perhaps never knew, if the stakes were always implicitly high enough) the letter was a forgery. The narrator is reporting *that* fact about the sister's epistemic state. The narrator's own low stakes are irrelevant.
  *   **How to Use It:** Frame the narrator's line ("she knew the letter was a forgery") as an assertion about the sister's epistemic state *at that past time*. As the story reveals the immense stakes *for the sister* at that time (the potential consequences of being wrong), PE explains why that assertion becomes false, even though the narrator (and reader) now face no practical stakes regarding this past event. The tension comes from the revelation that, given what was *really* at stake *for her*, the sister's evidence wasn't good enough *for her to count as knowing*. This creates the turn you desire.

  Your intuition was sound: PE, properly understood, provides the philosophical underpinning for the narrative effect you want to achieve. The essay's errors obscured this connection.
