  Marking Scheme (total 20 marks):
  ---
  **Marking Scheme for Question 3:**

  (a) Actions and reasoning for CDT, EDT, and FDT (12 marks)

  - CDT (4 marks):
    - Heads: pays (1 mark), reasoning: causal effect leads to net gain (1 mark).
    - Tails: pays (1 mark), reasoning: avoids expected loss of $500,000 by paying $1,000 (1 mark).
  - EDT (4 marks):
    - Heads: pays (1 mark), reasoning: evidence of being in heads and getting the reward (1 mark).
    - Tails: pays (1 mark), reasoning: paying is evidence of not having the disease, avoiding the huge loss (1 mark).
  - FDT (4 marks):
    - Pays in both branches (1 mark for each branch, 2 marks total).
    - Reasoning: by considering the decision function, the expected utility is maximized by paying in both branches (2 marks for explaining the calculation and comparison of the four strategies).

  (b) Why the attractive strategy fails (4 marks):
    - States that the strategy (pay in heads, refuse in tails) leads to a loss of $1,000,000 in the tails branch (1 mark).
    - Explains that in tails, the XOR condition becomes disease (because of refusal) so the letter is sent only if the agent has the disease (1 mark). Then, the agent refuses and loses $1,000,000 (1 mark). This is catastrophic compared to paying $1,000 in tails under the always-pay strategy (1 mark).

  (c) Evaluation of physical acts vs. decision function outputs (4 marks):
    - States that physical acts cannot be evaluated in isolation because the decision function's output in one branch affects the setup of the scenario in that branch (1 mark).
    - Explains that in the tails branch, the output of the decision function (refuse) leads to the letter being sent only when the agent has the disease, which then leads to the loss (1 mark).
    - Notes that the branches are causally disconnected, but the decision function is a single entity that must be consistent (1 mark).
    - Concludes that decision theory should be about selecting a function that maps observations to actions, considering the global consequences (1 mark).

  **Common Mistakes:**
  - For CDT in tails: some might think that the agent can condition on not having the disease and refuse, but they don't know the disease state. Mistake: not computing expected utility.
  - For EDT in tails: some might not condition on the evidence properly and think that refusing is safe if they don't have the disease, but they forget that the act provides evidence about the disease state.
  - For FDT: students might not realize that the decision function must be consistent and try to assign different actions without considering the global function. They might also miss the fact that in the tails branch, receiving the letter provides information about the disease state given the decision function.
  - In part (b): students might think the attractive strategy is available without realizing the catastrophic outcome in tails.
  - In part (c): students might not connect the decision function's output to the setup of the scenario (the XOR condition) and how it leads to a different world state.

