answer: |-
  ### Exam Question: Two-Branch Exchanger Case

  **Instructions:**  
  Answer all parts of this question in a single, coherent essay. You have 90 minutes. Write clearly and concisely. Do not regurgitate textbook definitions; apply decision-theoretic principles to the scenario. Total marks: 20.  

  **Scenario:**  
  Omega, a perfect predictor, flips a fair coin (50% heads, 50% tails).  
  - **Heads branch:** Omega asks you to pay $1,000. If you pay, Omega gives you $1,000,000. If you refuse, nothing happens.  
  - **Tails branch:** A perfect-predictor blackmailer sends you a letter. The letter is sent *if and only if* exactly one of these is true:  
    (i) You have a rare disease (50% prior probability);  
    (ii) You would pay the blackmailer $1,000 upon receiving the letter.  
  If you have the disease and refuse to pay, the blackmailer reveals it, costing you $1,000,000. If you pay, they do not reveal it. If you lack the disease, refusing costs nothing, and paying costs $1,000 (no secret exists to reveal).  
  You know the coin result: In heads, you face Omega’s request; in tails, you receive the letter.  

  **Constraints:**  
  - You use a **single decision function**: a fixed mathematical rule mapping your evidence (including the coin result) to an action (pay/refuse).  
  - Predictions (by Omega in heads, the blackmailer in tails) are based on this function’s output *for their respective branches*.  
  - You *cannot* independently choose one policy for heads and another for tails. The function must output actions for both branches consistently.  

  **Tasks:**  
  (a) For **causal decision theory (CDT)**, **evidential decision theory (EDT)**, and **functional decision theory (FDT)**, state what action the agent takes in the heads branch and in the tails branch. Justify each with decision-theoretic reasoning.  
  (b) Explain why the intuitively attractive strategy—*pay Omega in heads but refuse the blackmailer in tails*—is either unavailable or catastrophically costly under a single decision function. Define "catastrophically costly" as causing a severe loss (e.g., ≥$1,000,000) in one branch compared to alternatives.  
  (c) Discuss what this case reveals about evaluating a *physical act* (e.g., paying) versus evaluating the *output of a decision function*. Address how the function’s output in one branch affects outcomes in the other, despite causal disconnection.  

  ---

  ### Model Answer (Approx. 700 words)  

  **(a) Actions and Reasoning for CDT, EDT, and FDT**  

  **CDT** evaluates acts based on their *causal consequences*, ignoring correlations. In the **heads branch**, paying causes a net gain of $999,000 ($1,000,000 minus $1,000), while refusing causes $0. CDT pays. In the **tails branch**, the disease state is unknown but fixed. Paying costs $1,000 regardless of disease status. Refusing costs $0 if disease-free but $1,000,000 if diseased. Expected utility (EU) of refusing: \(0.5 \times -1,000,000 + 0.5 \times 0 = -500,000\). EU of paying: \(-1,000\). CDT pays to avoid the expected loss. Thus, CDT pays in both branches.  

  **EDT** evaluates acts based on *evidence* they provide. In **heads**, paying is strong evidence of receiving $999,000 (since Omega rewards payers). Refusing suggests no gain. EDT pays. In **tails**, the act provides evidence about disease status due to the XOR condition. If you pay, the letter was sent iff you lack the disease (since “disease XOR pay” requires disease = false). Paying thus signals safety: you lose $1,000 but avoid exposure. If you refuse, the letter was sent iff you have the disease (“disease XOR refuse” implies disease = true). Refusal signals high risk ($1,000,000 loss). EU of paying: \(-1,000\); EU of refusing: \(-1,000,000\). EDT pays. Like CDT, EDT pays in both branches.  

  **FDT** treats decisions as selecting a *function* that outputs acts across all scenarios. It maximizes expected utility globally. The coin and disease are independent (each 50% probability). FDT considers four function strategies:  
  1. *Always pay:* Heads gains $999,000; tails triggers letter only if disease-free (XOR: disease XOR pay → ¬disease), costing $1,000. EU: \(0.5 \times 999,000 + 0.5 \times (-1,000) = 499,000\).  
  2. *Always refuse:* Heads gains $0; tails triggers letter only if diseased (XOR: disease XOR refuse → disease), costing $1,000,000 if diseased. EU: \(0.5 \times 0 + 0.5 \times (-1,000,000) = -500,000\).  
  3. *Pay in heads, refuse in tails:* Heads gains $999,000; tails triggers letter only if diseased (XOR: disease XOR refuse → disease), costing $1,000,000. EU: \(0.5 \times 999,000 + 0.5 \times (-1,000,000) = -500\).  
  4. *Refuse in heads, pay in tails:* Heads gains $0; tails triggers letter only if disease-free (XOR: disease XOR pay → ¬disease), costing $1,000. EU: \(0.5 \times 0 + 0.5 \times (-1,000) = -500\).  
  FDT chooses *always pay* (highest EU: $499,000$), paying in both branches.  

  **(b) The Intuitively Attractive Strategy is Catastrophically Costly**  
  The strategy “pay in heads, refuse in tails” (Strategy 3 above) seems appealing: gain $999,000 in heads and avoid paying $1,000 in tails if safe. However, under a single decision function, this strategy forces a disaster in tails. The XOR condition means refusing in tails implies the letter was sent *only if you have the disease*. Thus, in tails, receiving the letter *guarantees you have the disease* (since “disease XOR refuse” reduces to disease). Refusing then costs $1,000,000—a catastrophic loss compared to paying $1,000 in the “always pay” strategy. The decision function’s consistency links branches: refusing in tails is only “safe” if you lack the disease, but the XOR condition ensures you *have* it when the letter arrives.  

  **(c) Physical Acts vs. Decision Function Outputs**  
  This case shows that evaluating isolated physical acts (e.g., “paying is good in heads”) is inadequate. Acts are outputs of a unified decision function, and the function’s behavior in one branch affects outcomes in the *same* branch by altering the world-state. In tails, the output “refuse” changes the XOR condition to *disease*, ensuring you are diseased when blackmailed. Though branches are causally disconnected, the function’s mathematical consistency allows predictors to exploit it. FDT escapes this by optimizing the entire function, while CDT and EDT fail by evaluating acts branch-locally. The key insight is that decision theory must select functions, not acts, to handle predictors that bind outcomes to counterfactual behaviors.  

  ---

  ### Marking Scheme (Total: 20 marks)  

  | **Must-Hit Points**                                                                 | **Marks** | **Common Mistakes**                                                                 |
  |-------------------------------------------------------------------------------------|-----------|-------------------------------------------------------------------------------------|
  | **(a) CDT: Correct actions (pay in both) and reasoning (causal EU in tails).**      | 4         | Mistake: Forgets disease uncertainty in tails, leading to incorrect EU for refusing. |
  | **(a) EDT: Correct actions (pay in both) and reasoning (act as evidence in tails).**| 4         | Mistake: Ignores XOR-based evidence, treating disease as independent of the act.   |
  | **(a) FDT: Correct action (pay in both) and reasoning (global EU comparison).**     | 4         | Mistake: Assumes FDT can freely choose “pay heads, refuse tails” without XOR cost. |
  | **(b) Explains why “pay heads/refuse tails” causes $1M loss in tails via XOR.**     | 4         | Mistake: Claims the strategy is available, overlooking XOR-induced disease certainty. |
  | **(c) Contrasts act evaluation vs. function output, noting XOR’s role in tails.**   | 4         | Mistake: Treats branches as isolated, missing how the function’s output sets XOR.  |
