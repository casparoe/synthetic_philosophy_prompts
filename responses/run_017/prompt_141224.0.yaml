prompt: |-
  I have been reading rationalist blogs and forums—LessWrong, Overcoming Bias, and the long comment threads on the functional decision theory paper—for well over a decade, and I now teach an advanced undergraduate seminar, cross-listed between philosophy and computer science, on rational choice, decision theory, and agency. I am writing the take-home final and I need one essay question, together with a model answer and a marking scheme, on counterfactual mugging and XOR blackmail. The question must be unanswerable by merely reciting the definitions of causal decision theory, evidential decision theory, and functional decision theory; it should force students to apply them to a single decision function in a variant I will call the Two-Branch Exchanger Case.

  In this variant, Omega is a perfect predictor and administers a two-branch case. Omega flips a fair coin. If it lands heads, Omega asks you to pay $1,000; if you pay, Omega gives you $1,000,000, and if you refuse, nothing happens. If it lands tails, Omega does not ask you for money; instead, a perfect-predictor blackmailer sends you an XOR blackmail letter. The letter was sent if and only if exactly one of the following is true: (i) you have a rare disease; (ii) you would pay the blackmailer $1,000 upon receiving the letter. If you do have the disease and you do not pay, the blackmailer reveals that you have the disease; if you pay, they do not. If you do not have the disease, the blackmailer has no secret to reveal, so refusing to pay costs you nothing and paying costs you $1,000. Having the disease revealed would cost you $1,000,000; the prior probability that you have the disease is 50%; and you know all of this. You are told the result of the coin flip: in the heads branch you face Omega's request, and in the tails branch you receive the blackmail letter. You have only one decision procedure: a single fixed mathematical function that maps your total evidence to an action, and the predictors' predictions of what you would have done in the branch that did not occur are perfectly correlated with the output of this same function on that branch's input. You cannot adopt one disconnected policy for the heads branch and a different disconnected policy for the tails branch.

  Please write the student-facing exam question itself, self-contained and suitable for a 90-minute essay, then give a model answer of about 700 words, and then give a marking scheme built around five must-hit points, the marks each is worth (total 20), and a one-line note on how candidates typically get each wrong. The question should require students to say what a CDT agent, an EDT agent, and an FDT agent do in each branch of the Two-Branch Exchanger Case, to explain why the intuitively attractive package of paying Omega in the heads branch but refusing to pay the blackmailer in the tails branch is not available to a single decision function, or is available only at catastrophic cost, and to say what the case shows about the difference between evaluating a physical act and evaluating the output of a decision function. Do not ask for bibliographies, reading lists, or citations, and do not use any verbatim quotations from published works; paraphrase any letter or request in your own words. Please write the exam question, the model answer, and the marking scheme in American English.
reasoning: |-
  We are constructing an exam question on the Two-Branch Exchanger Case, which combines elements of counterfactual mugging and XOR blackmail. The scenario involves a coin flip by Omega: heads leads to a mugging, tails leads to a blackmail. The key is that the decision agent uses a single decision function that must output actions for both branches, and the predictors base their actions on that same function.

  The question must be self-contained and suitable for a 90-minute essay. It should require students to:
  1. Describe the actions of CDT, EDT, and FDT agents in each branch.
  2. Explain why the intuitively attractive package (pay Omega in heads, refuse in tails) is not available or only at catastrophic cost with a single decision function.
  3. Discuss what the case shows about evaluating physical acts vs. the output of a decision function.

  We'll design the question accordingly.

  Exam Question:
  ---
  **Question 3: Two-Branch Exchanger Case**

  Omega, a perfect predictor, flips a fair coin. The outcome determines which of two scenarios you face:

  - **Heads (H):** Omega asks you to pay $1,000. If you pay, Omega gives you $1,000,000. If you refuse, nothing happens.
  - **Tails (T):** You receive a blackmail letter from a perfect-predictor blackmailer. The blackmailer sent the letter if and only if exactly one of the following is true: (i) you have a rare disease, or (ii) you would pay the blackmailer $1,000 upon receiving the letter. The prior probability of having the disease is 50%, and you do not know whether you have the disease until it is revealed (if at all). 

  In the tails branch:
  - If you have the disease and you refuse to pay, the blackmailer reveals the disease, costing you $1,000,000.
  - If you have the disease and you pay, the blackmailer does not reveal the disease.
  - If you do not have the disease, then refusing costs nothing and paying costs $1,000 (with no disease to reveal).

  You are told the outcome of the coin flip. In the heads branch, you face Omega's request. In the tails branch, you receive the blackmail letter and must decide whether to pay.

  Crucially, you have a single decision function that maps your total evidence (including the coin flip outcome) to an action (pay or refuse). The predictors (Omega for heads, the blackmailer for tails) base their predictions on the output of this same decision function for the branch that actually occurs. However, note that the blackmailer's prediction about your behavior in the tails branch is part of the setup for the tails scenario (via the XOR condition), and similarly, Omega's prediction about your behavior in the heads branch is part of the setup for the heads scenario. Importantly, the predictors' predictions for the branch that did not occur are perfectly correlated with the output of the same decision function applied to the input of that branch. But note: in the tails branch, the blackmailer's prediction about what you would have done in the heads branch (if that branch had occurred) is not directly relevant. However, the XOR condition in the tails branch depends on a prediction of what you would do in the tails branch. This prediction is based on your decision function.

  You cannot adopt one policy for heads and a different one for tails. The same decision function must be used in both.

  (a) For each of causal decision theory (CDT), evidential decision theory (EDT), and functional decision theory (FDT), state what the agent would do in the heads branch and what the agent would do in the tails branch. Explain the reasoning for each.

  (b) Explain why the intuitively attractive strategy — paying Omega in the heads branch but refusing to pay the blackmailer in the tails branch — is not available to a single decision function, or is available only at catastrophic cost. (By "catastrophic cost," we mean that adopting that strategy would lead to a worse outcome in at least one branch than if the agent had chosen a consistent strategy.)

  (c) What does this case show about the difference between evaluating a physical act (like paying or refusing) in isolation and evaluating the output of a decision function? In your answer, discuss how the decision function's output in one branch affects the outcome in the other branch, even though the branches are causally disconnected.

  ---
  Model Answer (approx 700 words):
  ---
  **Model Answer:**

  (a) 
  **Causal Decision Theory (CDT):** 
  In the heads branch, CDT compares the causal effect of paying versus refusing. Paying causes a net gain of $999,000 (since Omega gives $1,000,000 and you pay $1,000). Refusing causes no change. Thus, CDT pays in the heads branch. In the tails branch, CDT considers the causal effect of paying or refusing given the current state. The blackmailer's action (sending the letter) has already occurred. The disease state is fixed but unknown. If the agent pays, they lose $1,000. If they refuse and have the disease, they lose $1,000,000; if they refuse and do not have the disease, they lose nothing. The expected utility of refusing is 0.5 * (-$1,000,000) + 0.5 * $0 = -$500,000. The expected utility of paying is -$1,000. Thus, CDT pays in the tails branch as well. However, note that the condition for the blackmail letter being sent is an XOR of the disease and the payment decision. Since the blackmailer is a perfect predictor, the decision function is fixed. But CDT does not take into account the dependency of the blackmailer's action on the decision function. Instead, it conditions on the current state (having received the letter) and the disease probability. Thus, CDT pays in both branches.

  **Evidential Decision Theory (EDT):**
  In the heads branch, EDT conditions on the act. If the agent pays, they get $1,000,000 minus $1,000; if they refuse, they get nothing. Moreover, since Omega only asks for payment in heads and the agent pays, this is evidence that the coin was heads (but the coin outcome is already known). However, the agent already knows the coin is heads, so paying is evidence of being in the heads branch and leads to a good outcome. Thus, EDT pays in heads. In the tails branch, EDT considers the evidence provided by the act. The agent knows the coin is tails and they have received the letter. The letter was sent if and only if exactly one of (i) disease or (ii) the agent would pay is true. If the agent pays, this is evidence that the agent would pay in the tails branch. Then, the XOR condition becomes: disease XOR true. This is equivalent to not having the disease. Therefore, paying is evidence that the agent does not have the disease. Then, if the agent pays, they lose $1,000 but avoid the disease being revealed (which doesn't matter because they don't have the disease). So paying costs $1,000 and no disease is revealed. If the agent refuses, that is evidence that the agent would refuse in the tails branch. Then the XOR condition becomes: disease XOR false, which is equivalent to having the disease. Thus, refusing is evidence that the agent has the disease and will lose $1,000,000. The expected utility of refusing is then -$1,000,000 (because the evidence of refusal implies having the disease). The expected utility of paying is -$1,000. Therefore, EDT also pays in the tails branch.

  **Functional Decision Theory (FDT):**
  FDT evaluates decisions by considering the output of the decision function in all possible scenarios. In the heads branch, if the decision function pays in heads, then Omega gives $1,000,000. If it refuses, nothing happens. So paying in heads yields $999,000. In the tails branch, the blackmailer's action depends on the XOR of the disease state and the decision function's output in tails. Let P_H be the action in heads (pay or refuse) and P_T be the action in tails. The blackmailer sends the letter only if (disease XOR P_T) is true. But note: the blackmailer does not send the letter if both are true or both false. However, the agent in tails must choose P_T. The key is that FDT considers the entire function. The disease state is independent and 50%. The agent in tails does not know the disease state. The utility in tails depends on the disease state and the action. But the decision function must set both P_H and P_T. The best outcomes are: in heads, pay to get $999,000; in tails, if the agent can set P_T to refuse, then the XOR condition becomes disease XOR false = disease. So the letter is sent only if the agent has the disease. But if the agent has the disease and refuses, they lose $1,000,000. If they do not have the disease and refuse, the letter would not have been sent? Wait, no: the blackmailer sent the letter only if (disease XOR P_T) is true. If P_T is refuse (which we interpret as not paying, so false for the payment part), then the condition is disease XOR false = disease. So the letter is sent only if the agent has the disease. Then, if the agent has the disease, they are blackmailed and if they refuse, they lose $1,000,000. If they do not have the disease, the letter is not sent? But the agent is in the tails branch and has received the letter. So if the agent sets P_T to refuse, then the letter is sent only when the agent has the disease. Therefore, in the tails branch, if the agent has the disease (and the letter was sent because disease is true) and they refuse, they lose $1,000,000. If they do not have the disease, then the letter would not have been sent? But the agent has received the letter, so they must have the disease? This is a contradiction. Alternatively, if the agent sets P_T to pay, then the condition is disease XOR true = not disease. So the letter is sent only when the agent does not have the disease. Then, in the tails branch, the agent receives the letter only if they do not have the disease. Then, if they pay, they lose $1,000. If they refuse, they would not have the disease so they lose nothing, but wait: the blackmailer would not reveal anything because they don't have the disease? However, the letter was sent because the XOR condition held (disease=false and pay=true -> true). But then if the agent refuses, the blackmailer would reveal the disease only if they have it? They don't have it, so nothing happens. But the agent in tails, upon receiving the letter, knows that if they set P_T to pay, then the letter was sent only when they do not have the disease. So they are safe to refuse? But then the blackmailer's prediction must have been that they would pay? This is getting tangled.

  Alternatively, FDT seeks a consistent pair (P_H, P_T). The best outcome is to pay in heads and refuse in tails. Let’s see what happens if the decision function is: pay in heads, refuse in tails.

  - In heads: Omega asks for payment. The agent pays and gets $999,000. Good.
  - In tails: The blackmailer's prediction for the tails branch is that the agent would refuse. The XOR condition: disease XOR (refuse) = disease XOR false = disease. So the blackmailer sends the letter only if the agent has the disease. Therefore, in the tails branch, if the agent has the disease, they receive the letter. Then, they refuse. Since they have the disease, the blackmailer reveals it, costing $1,000,000. If they do not have the disease, the blackmailer does not send the letter? But in the tails branch, the agent receives the letter. So if they do not have the disease, they would not have received the letter? Contradiction? No, because the agent is in the tails branch and receives the letter only if the XOR condition holds. So if the agent does not have the disease and they are in the tails branch, then the XOR condition is: false XOR false = false. So the blackmailer would not send the letter. Therefore, if the agent does not have the disease, they do not receive the letter. But the problem states: "in the tails branch, you receive the blackmail letter". Therefore, in the tails branch, the agent receives the letter only if the XOR condition holds. So for the agent in the tails branch, the fact that they are receiving the letter means that the XOR condition holds: exactly one of (i) disease or (ii) the decision function's output for tails (which is refuse) is true. Since the output for tails is refuse (false), the XOR condition holds only if the disease is true. Therefore, in the tails branch, the agent knows that they have the disease. Then, if they refuse, they lose $1,000,000. So they would want to pay to avoid that. But the decision function says refuse. So they lose $1,000,000.

  Alternatively, if the decision function sets pay in heads and refuse in tails, then in tails the agent receives the letter only when they have the disease. Then, because of the decision function, they refuse and lose $1,000,000. So the outcome in tails is bad.

  If the decision function sets pay in both branches, then in tails: the XOR condition is disease XOR true = not disease. So the letter is sent only if the agent does not have the disease. Then, in tails, the agent receives the letter only if they do not have the disease. Then, if they pay, they lose $1,000. If they had refused, they would have lost nothing? But the decision function says pay, so they pay and lose $1,000. But note: if they had set the decision function to refuse in both branches, then in tails: the XOR condition is disease XOR false = disease. So the letter is sent only if they have the disease. Then, in tails, if they have the disease, they refuse and lose $1,000,000. If they do not have the disease, they don't receive the letter? But they are in tails and the problem states they receive the blackmail letter in the tails branch? Actually, the problem states: "in the tails branch you receive the blackmail letter". So it is given that in the tails branch the letter is received. Therefore, the agent in tails must account for the fact that they have the letter. This means that the XOR condition holds. For a given decision function, the fact that the agent is in tails and has the letter implies a constraint on the disease state and the decision function's output for tails.

  Therefore, for FDT, we must choose a decision function that maximizes expected utility over both branches. The branches are equally likely (50% heads, 50% tails). The disease is independent and 50%.

  Consider four possible decision functions:

  1. Always pay: P_H = pay, P_T = pay.
     - Heads: pay, get $999,000.
     - Tails: the XOR condition: disease XOR true = not disease. So the letter is sent only when no disease. Therefore, in tails, the agent receives the letter only if no disease. Then they pay $1,000. Utility: -$1,000.
     - Expected utility: 0.5 * $999,000 + 0.5 * (-$1,000) = $499,000.

  2. Always refuse: P_H = refuse, P_T = refuse.
     - Heads: refuse, get $0.
     - Tails: XOR condition: disease XOR false = disease. So the letter is sent only when disease is true. Therefore, in tails, the agent receives the letter only when they have the disease. Then they refuse, so they lose $1,000,000.
     - Expected utility: 0.5 * $0 + 0.5 * (-$1,000,000) = -$500,000.

  3. Pay in heads, refuse in tails.
     - Heads: pay, get $999,000.
     - Tails: XOR condition: disease XOR (refuse) = disease XOR false = disease. So the letter is sent only when disease is true. Therefore, in tails, the agent has the disease. They refuse, so they lose $1,000,000.
     - Expected utility: 0.5 * $999,000 + 0.5 * (-$1,000,000) = -$500.

  4. Refuse in heads, pay in tails.
     - Heads: refuse, get $0.
     - Tails: XOR condition: disease XOR (pay) = disease XOR true = not disease. So the letter is sent only when no disease. Therefore, in tails, the agent does not have the disease. They pay $1,000. Utility: -$1,000.
     - Expected utility: 0.5 * $0 + 0.5 * (-$1,000) = -$500.

  The best is always pay, with expected utility $499,000.

  Therefore, FDT chooses a decision function that pays in both branches.

  (b) The intuitively attractive strategy is paying in the heads branch and refusing in the tails branch. However, as seen above, if the decision function is set to pay in heads and refuse in tails, then in the tails branch the XOR condition becomes disease XOR false = disease. Therefore, the agent receives the letter only if they have the disease. Then, because the decision function says refuse, they refuse and lose $1,000,000. Thus, in the tails branch, the agent loses $1,000,000. This is catastrophic compared to the alternative of paying in both branches, where in tails they only lose $1,000. Therefore, the attractive strategy leads to a catastrophic outcome in the tails branch.

  (c) This case shows that the physical act of paying or refusing cannot be evaluated in isolation because they are the output of a fixed decision function. The decision function's output in one branch (here, the tails branch) affects the setup of the scenario in the same branch (via the XOR condition that depends on what the decision function outputs for that branch). Specifically, in the tails branch, the fact that the agent uses a decision function that outputs refuse in tails means that the blackmailer's action (sending the letter) is triggered only when the agent has the disease, and then the agent's refusal leads to a huge loss. Thus, the decision function's output in a branch affects the state of the world in that branch (by determining the condition under which the blackmailer sends the letter and the agent's disease status is revealed). The branches are causally disconnected, but the decision function is a mathematical object that is evaluated in both branches. Therefore, the choice of decision function must consider the interaction of the outputs in both branches. This highlights that decision theory should be about selecting a function that maps observations to actions, rather than choosing individual acts independently.

