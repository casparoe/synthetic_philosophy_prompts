  Hmm, the user runs the standards desk at an international news agency and needs a practical procedure for handling language about war casualties. They're deeply familiar with philosophical debates about moral equality of combatants but explicitly don't want to adjudicate that - they need operational guidelines that prevent smuggling value judgments into reporting.

  Key constraints stand out: This must work for multilingual editors without philosophical training, under deadline pressure. The user's identified five distinctions that often get conflated (legal status, permissibility to fight, liability to be killed, blameworthiness, and commemorative equality). Their "swap test" tool has proven inconsistently useful. Crucially, they believe only commemorative equality can be defensibly enforced by a news agency.

  The user's scenario reveals several layers of need: First, the surface request for a decision procedure. But deeper down, they're wrestling with how to maintain ethical reporting when clients have diametrically opposed views of the conflict. There's also likely unspoken pressure from journalists wanting clear rules when writing about emotionally charged events.

  I notice their working position is more radical than they state: Enforcing commemorative equality while suspending judgment on liability/permissibility actually rejects both Walzer and McMahan. That's smart - it avoids the news agency playing moral arbiter. The swap test fails precisely because it conflates their five distinctions; keeping it would undermine their own framework.

  For the procedure, I consider three structures but discard the first two: A rules-based approach would crumble under edge cases, while a principles hierarchy would require philosophical judgment. Instead, I land on a process that isolates commemorative equality as the only enforceable standard, with clear off-ramps for escalation. This aligns with their insight that news agencies can't judge combatants' moral status but can enforce equal human recognition in death.

  The child soldier case later will expose the procedure's limits - it forces us to treat even morally horrific cases as human losses, which may feel jarring but is consistent. That's where the user's fifth distinction does heavy lifting: commemoration ≠ absolution. 

  When constructing the worked examples, I deliberately make the memorial feature fail current style to demonstrate procedural teeth. Current practice would likely allow "hero" language for their own country's soldier; the procedure blocks that. That'll be uncomfortable but proves the system works.

  Biggest vulnerability? If combatants' near-total access to their side's war crimes evidence makes "we can't know who's just" an unsustainable position. But for now, epistemic humility remains the least bad option.
answer: |-
  Here is a procedural framework designed for operational use, respecting your constraints and distinctions. The core principle is **commemorative equality (distinction 5) + status-based descriptions (distinction 1) + suspension of judgment on liability/permissibility/blame (distinctions 2,3,4)**.

  **Procedure Shape Considered & Rejected:**  
  - *Hierarchy of principles with override clauses:* Too abstract for midnight decisions; requires weighing incommensurables under pressure.  
  - *Case-based flowchart with branching logic:* Unworkable for translators; too many contextual variables to codify.  
  - **Chosen: Linear checklist with forced stops.** *Why:* Minimizes interpretive leaps; each step isolates one decidable question; failsafes prevent unresolved ambiguities from proceeding.  

  ---

  **1. Decision Procedure (6 Steps)**  
  **Step 1: CONFIRM STATUS**  
  *Ask:* "What is the person’s status under LOAC (Combatant / Civilian / Hors de Combat) based on verifiable acts at time of event?"  
  *Sufficient answer:* Red Cross designation, state recognition (for combatants), or observable role (e.g., carrying weapon, wearing insignia).  
  *Stop if:* Status is unverifiable (e.g., "villagers with weapons"). Default: Use passive voice ("killed") and proceed to Step 5.  
  *Proceed to Step 2.*

  **Step 2: AVOID PERMISSIBILITY/LIABILITY LANGUAGE**  
  *Ask:* "Does the wording imply this person was *allowed* to fight or *deserved* to be attacked?"  
  *Sufficient answer:* Remove/rewrite terms like "legitimate target," "lawful kill," "unlawful combatant," "deserved fate."  
  *Stop if:* Such terms are essential to attribution (e.g., "designated terrorist by X"). Default: Use factual verbs ("killed," "died") + attribution source.  
  *Proceed to Step 3.*

  **Step 3: BLOCK BLAME/EXCUSE IMPUTATION**  
  *Ask:* "Does the wording assign praise, blame, or exoneration for fighting?"  
  *Sufficient answer:* Remove/rewrite: "hero," "martyr," "criminal," "innocent conscript," "brainwashed."  
  *Stop if:* Direct quote (attribute explicitly). Default: Neutral nouns ("fighter," "soldier," "member").  
  *Proceed to Step 4.*

  **Step 4: APPLY COMMEMORATIVE EQUALITY**  
  *Ask:* "Would we name/count/mourn this person identically if on the other side?"  
  *Sufficient answer:* Name all named dead; count all in tallies; use equivalent memorial language ("killed," not "eliminated").  
  *Stop if:* Naming endangers sources (Default: Use generic role + number).  
  *Proceed to Step 5.*

  **Step 5: SWAP TEST (RESTRICTED USE)**  
  *Ask:* "Does the wording *only* fail the Swap Test because of *our* audience’s perspective?"  
  *Sufficient answer:* If yes, rewrite (e.g., "gave their lives" → "were killed"). If no, retain (e.g., "invading force" is factual if force crossed borders).  
  *Stop here:* Output is final.  
  *Final Step: FACT-CHECK CONTEXT*  
  *Ask:* "Does geography/chronology imply moral judgment?"  
  *Sufficient answer:* "Barracks in occupied territory" not "illegally occupied barracks"; "consular building hit" not "safe haven violated."  
  *Default:* Use neutral prepositions ("in," "at") + objective location.  

  ---

  **2. Swap Test Ruling**  
  **Restrict to Step 5 only.**  
  *Keep for:* Flagging audience-catering language (e.g., "our brave defenders" fails when swapped).  
  *Drop for:* Assessing liability/permissibility (e.g., "terrorist" may pass swap if both sides use it, but still violates Step 2).  
  *Why:* Prevents false negatives (language that swaps evenly but implies judgment, e.g., "enemy combatants") and false positives (factual asymmetry, e.g., "ambushed patrol" is not equivalent to "defenders repelled attack").

  ---

  **3. Worked Applications**  
  **Case 1: Strike on barracks, conscripts killed**  
  *Procedure:*  
  - Step 1: Combatants (verified uniforms/barracks).  
  - Step 2: Avoid "forced to serve" → implies blame/excuse.  
  - Step 3: Avoid "unwilling conscripts."  
  - Step 4: Name if IDs available; count in tally.  
  - Step 5: "Killed in their sleep" passes swap.  
  - Step 6: "Barracks in [town name]" not "occupying force’s barracks."  
  *Output:* "An overnight strike hit a barracks in X. [Army] reported Y conscripts killed. Identities were not released."  
  *Violates current style?* Yes. Typical style might say "conscripts" to imply reduced culpability; Step 3 blocks this as blame/excuse imputation.

  **Case 2: Pickup truck strike, commander + 2 passengers**  
  *Procedure:*  
  - Step 1: Commander = combatant (directing attacks); passengers = status unclear → Default passive voice.  
  - Step 2: Avoid "mastermind" → implies liability.  
  - Step 3: Avoid "notorious terrorist."  
  - Step 4: Name commander if ID confirmed; count all three.  
  - Step 5: "Commander who planned attacks" passes swap if factual.  
  - Step 6: "Pickup truck near Z" not "fleeing vehicle."  
  *Output:* "A strike destroyed a pickup truck near Z, killing [Name], a local commander of [group] who planned attacks on civilians, and two others."

  **Case 3: Memorial feature for soldier from our country**  
  *Procedure:*  
  - Step 1: Combatant.  
  - Step 2: Avoid "gave his life for freedom" → implies permissibility.  
  - Step 3: Avoid "hero."  
  - Step 4: Name, commemorate equally.  
  - Step 5: "Killed in failed offensive" passes swap.  
  - Step 6: "During an offensive later criticized for flawed intelligence" not "based on lies."  
  *Output:* "[Name], a soldier from [our country], was killed during a 20XX offensive in [location]. The operation was later criticized for relying on flawed intelligence."  

  ---

  **4. Hard Case Verdicts**  
  - Child soldier carrying rifle: **Combatant** (Step 1). Name/count (Step 4). *Stall:* Steps 2/3 (blame/excuse implied by "child" – use "underage fighter" if verified).  
  - Armed medic: **Combatant** (carries weapon → Step 1). "Medic" is role descriptor.  
  - Supply truck contractor: **Civilian** (unless directly participating). If unclear → Step 1 default: "killed," name/count.  
  - Targeting analyst: **Combatant** (integral to hostilities).  
  - Surrendered fighter killed: **Hors de Combat** (Step 1). Specify "after surrendering" (factual).  
  - "Terrorist" v. "liberation" designation: **Stall at Step 2.** Use "[Group] (designated terrorist by X)" if essential; else "armed group."  
  - Villagers with weapons: **Stall at Step 1.** Default: "villagers killed," name/count.  

  ---

  **5. Escalation Points**  
  - **Step 1 stalemate** (indeterminate status): You decide whether to publish with passive voice/roles or spike.  
  - **Step 4 refusal** (e.g., client state demands no naming of "terrorists"): You decide whether to override or compromise (e.g., "three members of X group killed").  
  - **Step 5 deadlock** (factual asymmetry with moral weight): You judge if phrasing is reportable fact (e.g., "genocide perpetrators") or editorializing.  

  ---

  **6. Where It Misfires**  
  - **Asymmetric conflicts** (state vs. unstructured insurgency): "Combatant" status often unverifiable → overuse of passive voice.  
  - **Propaganda-laden sources:** Forces reliance on contested designations (e.g., "martyr").  
  - **Cost:** Blandness in features; occasional factual vagueness.  

  ---

  **7. What Would Change My Mind**  
  If evidence shows **commemorative equality exacerbates violence** (e.g., naming perpetrators incites retaliation), I would drop Step 4. Least confident in assuming **audiences distinguish commemoration from absolution** – if they don’t, the procedure fails its core goal.  

  ---

  **Explicit Accounting**  
  - **Enforced:** Distinction 1 (status), Distinction 5 (commemorative equality).  
  - **Set aside:** Distinction 2 (permissibility), 3 (liability), 4 (blame/excuse).  
  - **Cost:** Avoids moral judgment but sacrifices narrative depth; may feel "cold" in human-interest stories. The Swap Test restriction loses a gut-check tool but prevents misuse.
