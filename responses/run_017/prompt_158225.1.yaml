prompt: |-
  I have just joined the staff of our region's Common Resources Board, the body that decides whether a resource should be brought under a formal commons regime — defined membership, rules governing use, a monitoring roster, graduated sanctions, and in some cases a levy — or left to private ordering, ordinary pricing, or referral to the finance department as a public good to be tax-funded. The enabling statute is maddeningly vague, so the real content is in our precedents, and I am trying to work out what we have been doing before the next petition arrives. The Board has ruled in: the inshore groundfish stock; a network of farmer-built irrigation canals, where the worry was as much about who clears the silt as about who draws the water; an alpine pasture held under medieval common rights; the city airshed's capacity to absorb particulates; and the valley's darkness and quiet at night, even though any single porch light or late delivery is trivially small, because the Board held that cumulative trivial subtractions count. It has ruled out: the national time-signal broadcast, referred upward as a pure public good with nothing to appropriate; a patented seed variety, on the ground that exclusion is cheap and the market can order it; a congested toll-free causeway, on the ground that rivalry at peak is a pricing problem rather than a commons problem; an openly licensed mapping library used by hundreds of firms, on the combined grounds that use subtracts nothing and that its users had already organized a foundation that paid for upkeep without visible free-riding; and a historic district in which every façade owner holds a veto over alterations, which the Board called the mirror image of a commons — too much exclusion rather than too little — and dealt with by recommending pooling of rights instead of a commons regime.

  The new petition concerns an openly licensed clinical-records library on which every hospital in the region, two municipal agencies, and a dozen or so private clinics now depend. It is maintained by one unpaid volunteer who has announced that she will stop at the end of the year. Copying and use are free and lawful, and one hospital's use subtracts nothing from another's; but the maintenance — security patching, standards updates, the review of contributed fixes — is unpaid, and once a fix is contributed upstream no one can be excluded from its benefit. Fourteen identifiable institutional users have petitioned the Board to place the library under a commons regime with a compulsory maintenance levy, a governance charter, monitoring of contributions, and graduated sanctions for non-payment. Two wrinkles: there is a live fork option, so any user threatened with a levy can in principle exit and carry the code off rather than pay, which cuts both ways as bargaining power and as an enforcement problem; and the Board's toolkit — caps, rosters, sanctions — was built entirely to limit withdrawal, so a levy compelling contribution would be an instrument we have never used, and our statute speaks only of regulating appropriation.

  What I need is a recommendation, not a general discussion of public goods. First, set out the two or three candidate rules that fit our whole track record equally well — something like a rivalry-and-excludability rule keyed to subtractability in use, a collective-action rule keyed to whether dispersed actors are producing an outcome none of them wants, and an institutional rule keyed to whether there is a bounded, identifiable, mutually monitoring community capable of crafting rules — and say what each predicts here. Then tell me which precedent is genuinely the closest analog: the open-source mapping library we waved through, or the irrigation canals and the night sky we took in. Then give me the decision that best coheres with what we have already done, and if our precedents really do underdetermine it, say plainly what principle we would be adopting with each choice — including whether ruling this in commits us to treating every under-maintained open library anywhere as a commons, and whether that floodgates worry is itself a reason. Finally, name the one further petition that would best separate the surviving rules from each other, and tell me what we should expect to learn from it.
reasoning: |-
  Hmm, the user is a new staffer at a Common Resources Board trying to navigate complex resource governance precedents. They need concrete guidance on a clinical-records library petition, framed within their institution's existing case law rather than abstract theory. 

  The core tension here is between the library's non-rivalrous nature (which aligns with precedents they rejected) and its maintenance collective-action problem (which mirrors cases they accepted). The user's phrasing suggests they're analytically precise but pressed for time - note how they preemptively dismiss "general public goods discussion" and demand precedent-based reasoning. 

  Key observations from their case history: The Board consistently intervenes when (1) resource use is subtractive OR (2) decentralized actions cumulatively degrade a shared value, even without direct rivalry. The rejected cases highlight their aversion to intervening where exclusion is feasible or where non-subtractive resources already have organic governance. 

  For this petition, the open-source mapping library precedent seems superficially analogous but differs critically: that had an existing functioning foundation, while here maintenance relies on one volunteer. The night sky case is more relevant - both involve non-subtractive resources where individual actions (light pollution/code neglect) create collective harm through aggregation. 

  The "live fork" complication introduces a prisoner's dilemma dynamic: institutions may defect rather than pay, knowing others might sustain the system. This echoes the irrigation canal case where maintenance shirking was the core issue. 

  If I were drafting the recommendation, I'd emphasize that approving this wouldn't automatically apply to all open libraries - the combination of universal dependency, lack of alternatives, and verifiable underprovision creates unique conditions. The floodgate concern is real but addressable through strict application of their institutional rule (bounded user community requirement). 

  For future cases, a petition about something like municipal sidewalk maintenance would perfectly test whether subtractability or collective-action failure drives their logic - sidewalks are rivalrous in congestion but non-rivalrous in off-peak use, with similar maintenance dilemmas.
answer: |-
  Here's a recommendation structured to fit your Board's precedent-based approach, focusing on candidate rules, analogies, coherence, and future testing:

  **Candidate Rules from Precedents:**
  1.  **Subtractability & Rivalry in *Use*:** Does consumption by one user reduce availability for others? (In: fish, irrigation water, pasture, airshed, darkness; Out: time signal, seed, causeway *as commons*, mapping library). *Prediction for Records Library:* **OUT.** Use is non-rivalrous (one hospital's use doesn't hinder another's).
  2.  **Collective-Action Failure (Degradation/Underprovision):** Is there a risk that dispersed, rational individual actions lead to an outcome *no one wants* (depletion, degradation, or underprovision), despite mutual dependence? (In: silt in canals (underprovision of maintenance), particulates/degraded air (depletion of absorptive capacity), cumulative light/noise (degradation of darkness/quiet); Out: mapping library (existing foundation prevented failure)). *Prediction for Records Library:* **IN.** Critical maintenance is underprovided due to free-riding incentives; universal dependence creates mutual vulnerability to collapse.
  3.  **Institutional Feasibility:** Does a bounded, identifiable, mutually monitoring user community exist, capable of crafting/enforcing rules? (In: fishers, farmers, pasture users, identifiable polluters/residents; Out: national time-signal (no bounded community), causeway (diffuse users, pricing preferred)). *Prediction for Records Library:* **IN.** 14 identifiable institutional users (+ agencies/clinics) form a clear, bounded community capable of mutual monitoring and governance.

  **Closest Analog:**
  *   **The Irrigation Canals & The Night Sky (IN) are closer than the Mapping Library (OUT).**
      *   *Mapping Library (OUT) Difference:* It had an *existing, functional* collective-action mechanism (the foundation) solving the underprovision problem *without* Board intervention. Precedent shows the Board respects existing solutions.
      *   *Irrigation Canals (IN) Similarity:* Core problem was *maintenance underprovision* (silt clearing), not just subtractable water use. Failure meant system collapse. Identifiable users.
      *   *Night Sky (IN) Similarity:* Problem was *cumulative degradation* of a non-subtractable resource (darkness/quiet) through individually trivial actions. Failure meant loss of a shared, valued attribute. Identifiable contributors (property owners/residents).
      *   *Records Library:* Mirrors the *underprovision* of the canals (maintenance collapse imminent) and the *cumulative degradation risk* of the night sky (neglect by any user threatens the whole resource's quality/safety), affecting a bounded community.

  **Coherent Decision & Implications:**
  *   **Decision: IN. Establish a Commons Regime focused on contribution (levy) for maintenance.**
  *   **Coherence:** This best coheres with the core principle emerging from the "IN" precedents: the Board intervenes when **collective-action failure threatens the sustainability or quality of a critical shared resource for a bounded community, regardless of whether the resource is subtractable in use.** The canals, night sky, and airshed all demonstrate this. The mapping library was "OUT" precisely *because* collective action was already working organically – the opposite situation here.
  *   **Underdetermination & Adopted Principle:** Precedents *do* slightly underdetermine the shift from regulating *appropriation* to compelling *contribution*. However, the statute's core purpose ("regulating appropriation") can be interpreted broadly as **preventing the *appropriation* of benefits without contributing to sustainability** (free-riding on maintenance). Approving this adopts the principle: **"The Commons Regime can mandate contributions (levies) to sustain non-subtractable resources where collective-action failure in provision/degradation control threatens a bounded community's critical shared resource."**
  *   **Floodgates?** No, this does *not* commit the Board to all under-maintained open libraries. Key limiting factors from precedent:
      *   **Bounded, Identifiable Community:** Requires a clear, finite group of responsible users (like the 14+ petitioners), not the entire internet.
      *   **Critical Shared Dependence:** The resource must be essential to the community's core function (healthcare records vs. a minor software tool).
      *   **Imminent Failure/Actual Degradation:** Demonstrable risk of collapse or significant degradation due to underprovision (volunteer quitting, security risks) – not just hypothetical under-maintenance.
      *   **Lack of Existing Solution:** No functional organic mechanism exists (unlike the mapping library foundation). The floodgates concern is valid *procedurally* (more petitions) but the *substantive* criteria (community, criticality, failure) drawn from precedent provide robust filters.

  **Future Petition to Test Rules:**
  *   **Proposed Test Case:** A **regionally essential open-source electronic health record (EHR) interoperability standard**, maintained by a consortium, where key hospitals threaten to withdraw funding while continuing to use the standard, jeopardizing updates critical for patient safety across all regional healthcare providers.
  *   **Why it Separates the Rules:**
      1.  **Subtractability Rule:** Would predict **OUT** (using the standard is non-rivalrous).
      2.  **Collective-Action Rule:** Would predict **IN** (underprovision of maintenance due to free-riding threatens critical shared resource for a bounded regional healthcare community).
      3.  **Institutional Rule:** Would predict **IN** (bounded, identifiable hospitals/providers using the standard).
  *   **What We Learn:** This directly tests whether *collective-action failure in maintaining a non-subtractable but critical standard* is sufficient grounds for a contribution-focused commons regime, even more cleanly than the current case (no "fork" ambiguity, pure maintenance free-riding). A decision here would solidify whether the Board's core logic is truly about *sustaining essential shared resources* threatened by decentralized inaction/free-riding, moving decisively beyond just regulating subtractable resources.
