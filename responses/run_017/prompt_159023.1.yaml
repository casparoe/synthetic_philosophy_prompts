  Wait, why wouldn’t this just be forgetfulness? Because the doctor *actively believes* both P and E. The issue isn’t memory—it’s that their belief state doesn’t "index" E under P’s antecedent. Like a filing system where related facts are in separate drawers. Competence isn’t in doubt; they’d spot the link if prompted. 

