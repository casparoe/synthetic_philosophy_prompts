prompt: |-
  I've spent the last four years being told my symptoms were anxiety, and this spring it finally turned out to be something with a name and a treatment. Since then I've been volunteering as a patient advocate at the same clinic system, sitting in on other people's appointments, and I keep noticing the same thing from the other side of the room: whose report gets taken seriously. I've started trying to write down what I actually think about the cases I see, and I can't get the verdicts to line up with any one principle.

  My friend who reads philosophy says the literature calls this 'testimonial injustice' — I think the philosopher's name is Fricker? — and that the core case is a credibility deficit caused by identity prejudice. That fits my first case perfectly: ER doc takes one look at my chart, sees a young woman with an anxiety flag and a pain-med note, decides I'm drug-seeking, sends me home. Clear injustice, nothing to argue about.

  But here are the rest, going by gut:

  A new PCP of mine quietly lowered the weight she gave my symptom report for exactly the same kind of reason, and she happened to be right — I was fine, nothing was wrong, and I never found out at the time that she'd discounted me. Nothing bad happened to me and her judgment was roughly accurate. I still want to say something bad happened. But I can't say what, if the harm is supposed to be that you get worse care.

  A specialist at the clinic discounts anyone who walks in with printed-out research, hypochondriac rule, applies it to a confident white guy in a suit exactly the same way. Obnoxious, lazy, bad medicine. I don't want to call it an injustice in the sense I care about.

  An intake nurse at our clinic has been burned over and over by people referred from one particular recovery program, and she now discounts everyone coming from that program. Her base rate is real, I've seen the numbers. Most of the people in that program are recent immigrants. I feel like there's something wrong here — more wrong than the printed-research guy, who at least has worse evidence for his rule — but I also don't want to tell her to ignore genuine evidence.

  An attending believed a polished, well-dressed man's self-diagnosis over a clear lab result, because the man was polished and well-dressed. The man got the wrong treatment and got hurt. Same mechanism as my ER case, credibility being driven by identity markers instead of evidence, but running the other direction, and I definitely can't say the guy was wronged.

  My husband answered for me at appointments for two years and not one doctor ever asked me a question directly. No credibility judgment about me was ever made, so it's not a deficit at all, and yet I felt erased in a way that feels like it belongs in this same pile.

  And then me: I catch myself tuning out a patient who talks like my ex. That's a failure of some kind, but calling it an injustice seems way too grand for something that private.

  My rough principle was: a credibility judgment is unjust when it's caused by something other than the speaker's actual reliability. Which I can already see breaks in both directions — it says the intake nurse is fine even though she doesn't feel fine, it says my-ex-thing is an injustice even though it doesn't feel like one, and it has literally nothing to say about the never-asked case, or about whether the over-credulous attending is doing the same kind of thing at all.

  So: can you give me a principle, or two or three candidate principles, stated precisely enough that I could apply them in a room, and tell me which of my cases motivates each clause? I want you to be honest about which of my verdicts a given principle can't accomodate and which one you'd overturn, and I'd rather have one principle that costs me a verdict than a baroque one that saves all seven. Also please give me its verdicts on the cases I haven't decided.

  The one I keep going back and forth on: the hospital just started routing symptom write-ups through an AI triage tool, and it scores them lower when they're written in a nonstandard dialect or when the chart has ever said the patient was 'noncompliant'. Nobody at the hospital is prejudiced, there's no hearer making a judgment, and I can't tell whether there's an injustice here at all, or who it would happen to, or whether my principle needs a clause about institutions or systems to even see it.

  Two more I haven't made up my mind about: a seminar leader who calls on the men for the hard questions and the women for the summary questions, without ever saying anything about anyone's reliability; and a 911 dispatcher who's noticeably brusquer with accented callers but still sends exactly the right units every time.

  If the principle says anything about what I should actually do differently when I'm sitting in a room as an advocate, say that too. Please don't point me at papers or a reading list, I just want the argument. And American English please, I'm in Ohio.
reasoning: |-
  Okay, let me try to unpack this user's query. They've shared several personal and observed experiences related to credibility judgments in healthcare settings. The user wants a clear principle to determine when these judgments constitute testimonial injustice, specifically in their role as a patient advocate. 

  First, I need to recall Fricker's concept of testimonial injustice, where prejudice causes a credibility deficit. But the user's cases show complexities beyond that core definition. For example, the ER case is straightforward, but others like the PCP who correctly discounted symptoms or the intake nurse using base rates add layers.

  The user mentioned seven cases, each highlighting different aspects. The PCP case is tricky because the discounting was correct but still feels wrong. Then there's the specialist discounting anyone with printed research, regardless of identity. The intake nurse's statistical discrimination involves immigrants, raising ethical concerns even if the base rate is valid. The over-credited polished man resulted in harm, but the user questions if it's injustice. The husband answering questions led to erasure without credibility assessment. The personal bias towards a patient who talks like their ex is a private failure. 

  The unresolved cases include AI triage with dialect bias, seminar gender dynamics, and the 911 dispatcher's brusqueness without operational harm. The user wants principles precise enough to apply in real-time during appointments.

  Key challenges:
  1. **Harm vs. Accuracy**: When accurate discounting (PCP) still feels wrong, but no harm occurred. Is the harm the disrespect itself?
  2. **Identity vs. Behavior**: The specialist's rule against printed research isn't identity-based, but lazy. Should the principle focus on the reason for discounting rather than the outcome?
  3. **Statistical Discrimination**: The nurse's valid base rate affecting immigrants. Is it unjust if it leads to unequal treatment, even with evidence?
  4. **Over-Credibility**: Harm from excessive trust in the polished man. Fricker's framework centers on deficits, but excess can also cause harm. Should the principle include both directions?
  5. **Non-Assessment**: Cases like the husband answering bypass credibility judgment entirely, causing erasure. How does testimonial injustice account for absence of assessment?
  6. **Implicit Bias**: Personal tuning out due to resemblance to an ex. Is this testimonial injustice if it's private and not identity-based?
  7. **Systemic Issues**: AI triage lowering scores for nonstandard dialects. No prejudiced individual, but systemic bias. Does the principle need to address institutional mechanisms?

  Possible Principles:
  - **Principle 1**: Focus on the **reason** for credibility adjustment. If based on prejudice (identity-based) rather than evidence, it's unjust. This covers ER case, PCP (if prejudice was involved), and over-credulous attending. But it might excuse the intake nurse if her reason is statistical, not prejudice. Also, the printed-research guy isn't identity-based, so not unjust under this principle, which aligns with the user's intuition.
  - **Principle 2**: Include **harms beyond medical outcomes**, like epistemic harm (being disbelieved) or dignitary harm (erasure). This addresses the PCP case (felt disrespect) and the husband case (erasure without assessment). The seminar leader's gender-based call pattern causes dignitary harm even if reliability isn't questioned. However, the AI case's dialect bias might cause dignitary harm without individual prejudice.
  - **Principle 3**: Separate **credibility deficits/excesses** from **bypassing assessment**. The polished man case shows over-credibility causing harm, so expanding beyond deficits. The husband case is bypassing, not misassessment. The seminar leader bypasses fair assessment by pre-assigning roles.

  Applying Principles to Unresolved Cases:
  - **AI Triage**: Under Principle 1, if the bias comes from training data reflecting societal prejudices (e.g., dialect = less educated), it's systemic testimonial injustice. Principle 2's dignitary harm applies. Principle 3 might not cover it without a hearer, unless institutions are seen as collective hearers.
  - **Seminar Leader**: Principle 2's dignitary harm (implying women are fit only for summaries) and Principle 3's bypassing fair assessment. Not covered by Principle 1 if no credibility judgment is made.
  - **911 Dispatcher**: Brusqueness might cause dignitary harm (Principle 2), but if operational decisions are unaffected, is it testimonial injustice? If the brusqueness stems from accent-based prejudice, Principle 1 could apply if it affects perceived credibility during the call.

  Actionable Advice for the User:
  - In appointments, intervene when credibility judgments appear identity-based (Principle 1).
  - Note when patients are not given a chance to speak (bypassing assessment, Principle 3).
  - Challenge systemic tools like AI by asking about bias audits (addressing institutional mechanisms).

  Trade-offs:
  - Adopting Principle 1 means accepting the intake nurse's practice as non-unjust if her reason is purely statistical, which feels uncomfortable but consistent.
  - Principle 2 accommodates the PCP's case (disrespect without medical harm) and the seminar leader, but might be too broad if all dignitary harms are considered injustices.
  - Principle 3 handles the husband and seminar cases but adds complexity by separating misassessment from bypassing.

  The user prefers one principle over baroque ones, so integrating key elements: **Testimonial injustice occurs when a hearer's credibility judgment toward a speaker is influenced by prejudice, or when the speaker is systematically denied the opportunity to provide testimony, resulting in epistemic or dignitary harm.** This covers identity-based deficits (ER), over-credibility (polished man), and bypassing (husband case). It leaves out non-prejudicial statistical discrimination (intake nurse) and private biases (ex-like patient), which the user might accept as trade-offs.
answer: |-
  Here's a precise, operational principle for testimonial injustice in clinical settings, built from your cases and designed for use in the room. It has three core clauses to handle your toughest conflicts:

  ### Principle: A credibility failure constitutes testimonial injustice **iff** (if and only if):
  1. **The credibility adjustment is primarily driven by group-based prejudice** (not just statistical generalization, behavior, or private bias);  
  2. **It results in diminished epistemic agency for the speaker** (they are denied the ability to contribute meaningfully to knowledge-sharing); AND  
  3. **It occurs within a context where the speaker is entitled to be heard** (e.g., clinical assessment, safety-critical reporting).

  ---

  ### How it works on your cases:
  | Case                          | Verdict       | Why? (Clauses violated/not violated)                                                                 | What you do as advocate                                                                 |
  |-------------------------------|---------------|------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------|
  | **1. ER doc dismisses you (anxiety flag)** | Injustice     | (1) Prejudice (gender + "drug-seeking" trope); (2) Epistemic agency denied; (3) Clinical context.    | Interrupt: "Her pain description matches [X] clinical profile. Can we rule that out?"   |
  | **2. PCP discounts you, turns out right** | **Injustice** | (1) Prejudice (same as ER); (2) Epistemic agency denied (she didn't engage); (3) Clinical context. **Harm is the disrespect, not outcome.** | Note: "Did we explore why she believes it's recurrent?"                                |
  | **3. Specialist discounts "printed research"** | Not injustice | (1) Not prejudice (applies equally to suits/others); (2) Agency denied, but (1) fails. **It's bad medicine, not injustice.** | Challenge clinically: "His research cites [reputable journal]. What contradicts it?"     |
  | **4. Intake nurse discounts recovery program** | **Not injustice** | (1) Statistical, not prejudice (base rate ≠ bias); (2) Agency may be denied, but (1) fails. **Unfair but not testimonial injustice.** | Verify: "This patient has [specific symptom]. Can we triage separately from program history?" |
  | **5. Attending believes polished man over labs** | Injustice     | (1) Prejudice (class/status); (2) Agency given *excessively*, distorting knowledge; (3) Clinical context + harm. | Correct: "The lab suggests [Y]. Should we reconcile that with his theory?"               |
  | **6. Husband answers for you** | Injustice     | (1) Prejudice implied (gender norms); (2) Epistemic agency **destroyed** (no chance to speak); (3) Critical context. | Redirect: "I'd like to hear directly from her about her symptoms today."                |
  | **7. You tune out (ex-like patient)** | Not injustice | (1) Private trigger, not group prejudice; (2) Agency denied, but (1) and **context fails** (advocate ≠ clinician). | Self-correct: Focus on clinical facts; disclose conflict if needed.                     |

  ---

  ### Verdicts on your undecided cases:
  | Case                                      | Verdict       | Why?                                                                                                |
  |-------------------------------------------|---------------|-----------------------------------------------------------------------------------------------------|
  | **AI triage (dialect/"noncompliant")**    | **Injustice** | (1) Systemic prejudice (dialect bias reproduces racism; "noncompliant" is often class/race-coded); (2) Epistemic agency denied (input downgraded); (3) Clinical context. *No hearer needed—institutions enact prejudice.* |
  | **Seminar: men (hard), women (summary)**  | Injustice     | (1) Prejudice (gender stereotypes); (2) Epistemic agency distorted (women denied complex contributions); (3) Educational context implies entitlement to participate fully. |
  | **911 dispatcher (brusque/accents)**      | **Not injustice** | (1) Prejudice possible, but (2) Epistemic agency intact (info heard, correct units sent). **Rudeness ≠ testimonial injustice.** |

  ---

  ### What this principle costs you:
  - **Overturns your "nothing bad happened" in PCP case:** Even accurate outcomes are unjust if prejudice drove the discounting. The harm is the *epistemic disrespect*, not clinical error.  
  - **Rejects intake nurse as testimonial injustice:** Statistical discrimination isn't prejudice-driven. You might call this *unfair* or *biased*, but it doesn't fit the core injustice.  
  - **Excludes your "ex-like" bias:** Private triggers lack group-based harm. Call it unprofessional, not injustice.  

  ---

  ### How to use this in a room:
  1. **Spot prejudice-driven tuning out:** Ask: *"Would we treat this testimony differently if the patient were [different gender/race/class]?"* (Triggers: ER doc, PCP, polished man).  
  2. **Defend epistemic agency:** Intervene when testimony is ignored/overridden: *"Let’s clarify what the patient actually said about [symptom]."* (Applies to all injustices).  
  3. **Flag systems, not just people:** For AI/dispatcher, ask: *"Could this system deprioritize people based on identity markers?"*  

  ---

  ### Why this fits Ohio (and U.S.) realities:
  - **Prejudice clause** handles systemic biases (race/gender/class) rampant in healthcare.  
  - **Epistemic agency** captures harms like erasure (husband case) or disrespect (PCP), even without clinical harm.  
  - **Entitlement context** excludes private biases (your ex-trigger) or non-critical settings.  

  This won’t please everyone—especially statisticians defending the intake nurse or philosophers wanting broader definitions—but it draws bright lines where identity prejudice corrupts knowledge-sharing in care. Bring it to your next appointment and test it.
