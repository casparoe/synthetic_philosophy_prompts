prompt: |-
  I write the interpretive text for the natural history galleries of a medium-sized regional museum. That means roughly forty object labels a year, sixty words or fewer each, every one of them signed off by our curator of geology, who has no training in evolutionary biology and who is, on principle, hostile to any sentence that sounds hedged. The labels are permanent, they are read by around two hundred thousand people a year, and our funders particularly like the panels that say what a trait is *for*. A complaint from a visiting evolutionary biologist — that a good half of our why-it-evolved panels were speculative stories dressed up as findings — has been upheld by the director, and I have been asked to produce a written procedure that my team can run on any proposed trait-and-function claim before it goes into a label.

  Please write that procedure for me. What I need is something runnable in about fifteen minutes per label by someone with school-level biology, working from whatever brief accompanies the specimen: a sequence of questions asked in a fixed order, what counts as an acceptable answer to each, the points at which the procedure stops and returns not established, and the points at which it stops and hands the decision to a person because the question has become one of values rather than fact.

  The conceptual material I want it answerable to is the critique of the adaptationist programme associated with Gould and Lewontin's spandrels paper — not as a slogan I can cite, but as something that changes what ends up on the wall. Specifically, I want it to do the following.

  Interrogate the individuation of the trait before anything else. Most of our bad panels, I think, fail here: the trait is picked out by the very effect it is supposed to explain, so the claim cannot be tested and cannot fail. Give me a question that catches this, phrased so that a non-specialist can apply it, and say what we do with a proposal whose trait dissolves under it.

  Make the alternatives explicit and symmetric. A proposal should not be accepted unless at least one non-adaptive alternative has been stated with comparable specificity: an architecturally necessary by-product of some other feature, the co-option of an existing structure for a new function, inheritance from an ancestor with no current function, a developmental or allometric consequence of body size or growth pattern, drift, or the possibility that the trait has no non-arbitrary boundaries at all. Give me this as a menu with a rule for how many alternatives must be written down and how specific they must be.

  Grade the kinds of evidence that can discriminate between them, and say what each kind can and cannot establish: correlation between independent origins of the trait and the supposed selective regime across related lineages, experimental manipulation of the trait or of the environment, direct measurement of selection in the field, and fit to an engineering or optimality model. Include what to do when the brief contains none of these and only reports what a handbook says.

  Separate three claims that our current labels all collapse into one: that the trait originated by selection for function F, that it is currently maintained by selection for F, and that it is currently useful for F although it arose for some other reason or for no reason at all. Each should license a different wording, and I want the wording rule stated, together with two or three model sentences of agnostic copy that my curator will actually pass.

  Operate inside sixty words. Where the honest verdict is that we do not know, tell me what the label should say instead of the explanation it cannot give.

  Include a check on the set as well as on the item. Individually defensible labels can still add up to a gallery that presents organisms as collections of optimally engineered devices, and that is the substance of the complaint against us. Give me a way to audit a batch of labels: how to sample or count them, what pattern triggers a revision, and what the revision consists of.

  Mark clearly what the curator is being asked to certify at each kind of outcome, and where the procedure must stop because the question has stopped being factual — in particular where the risk of overclaiming to a quarter of a million visitors has to be weighed against the cost of a hedge that nobody reads.

  Then run the procedure on three proposals. First, a label on the dark form of the peppered moth saying it evolved to match soot-blackened bark, with a brief noting that dark forms appeared independently in many industrial regions. Second, a label on the human chin, with two competing briefs: one saying it evolved to withstand the mechanical stresses of chewing, one saying it evolved as a signal in mate choice. Third, the case I will not like: our most successful temporary format, a Survival gallery of twenty-five specimens in which each one gets a why-it-evolved panel, researched to the standard of a popular science book and much loved by the funders. Apply the procedure to the format as a whole and tell me what it does to it.

  Finally, say honestly what the procedure cannot do: the cases where the underlying biology is unsettled in ways a fifteen-minute check will never reach, and the whole regions of our collection — early hominins, deep time, behaviour that leaves no fossil trace — where the procedure will systematically return not established and the gallery will end up saying nothing at all.

  Do not give me references, citations or a reading list; my team has no library access and cannot follow them up, and the specimen brief is all we will ever have. Please write the whole answer in British English.
reasoning: |-
  Hmm, this is a fascinating challenge from a museum professional dealing with interpretive labels. The user is clearly deeply knowledgeable about evolutionary biology communication challenges and needs a practical tool to implement Gould and Lewontin's critiques. 

  The core tension here is between scientific accuracy (avoiding adaptationist just-so stories) and practical museum constraints (60-word limits, curator approvals, funder preferences). I need to create a bulletproof procedure that:
  - Forces trait individuation upfront
  - Mandates consideration of alternatives
  - Grades evidence quality
  - Separates evolutionary claims
  - Maintains word count
  - Includes batch auditing
  - Handles value judgments

  For the trait individuation step, I'm considering how to phrase "is this trait defined by its function?" in a way a high school graduate can spot. The alternatives menu must be concrete - listing actual non-adaptive mechanisms with examples. The evidence grading should distinguish between correlation (weak) and manipulation (strong). 

  The three-claim separation is crucial: origin vs maintenance vs current utility need distinct phrasings. For "we don't know" cases, I'll suggest redirects to observable features. The batch audit requires counting adaptationist claims density - say over 50% should trigger rewrite.

  When testing with the peppered moth, it should pass because of the industrial melanism experiments. The human chin fails both claims due to poor evidence. The Survival gallery format would collapse under scrutiny - each "why evolved" panel would need replacement with "how used" statements.

  Major limitations: paleontology and behavior will hit "not established" constantly. The procedure can't resolve genuine scientific debates quickly. But it will prevent the worst storytelling while keeping labels engaging. The curator's approval points are carefully placed where scientific uncertainty meets communication risk assessment.

  This should give the user both protection from criticism and ammunition for difficult conversations with funders. The British English requirement means careful attention to spellings like "colour" and phrasing like "whilst".
answer: |-
  Here is a procedural checklist for evaluating trait-and-function claims in museum labels, designed to be run in ≈15 minutes using only the specimen brief and school-level biology knowledge. It follows your specifications, prioritising Gould & Lewontin's critique operationally.

  **Procedure: Trait & Function Claim Evaluation (TFCE)**

  **Stage 1: Trait Individuation (2 mins)**
  1.  **Question:** *Is the trait described independently of the proposed function? Or is the trait defined solely by the effect it is claimed to cause?* (e.g., "wings for flight" defines the trait *by* its function; "elongated forelimbs with specific feather arrangements" describes it independently).
      *   **Acceptable Answer:** The trait description uses observable physical characteristics (morphology, behaviour pattern, chemistry) without referencing the proposed function.
      *   **Unacceptable Answer:** The trait description *requires* mentioning the proposed function (e.g., "camouflage colouration", "mating signal structure").
      *   **Outcome Unacceptable:** Claim **REJECTED**. Label must describe the observable trait only (e.g., "dark grey-black wing colouration", "protruding bony structure at the lower jaw margin"). Do not proceed.

  **Stage 2: Alternative Explanations (3 mins)**
  2.  **Question:** *List at least one non-adaptive alternative explanation for the trait's existence/presence, stated with comparable specificity to the proposed adaptive function.* Choose from:
      *   Architectural Constraint/Spandrel: Necessary by-product of another evolved feature (e.g., chin as a consequence of jaw reduction).
      *   Developmental By-product/Allometry: Consequence of growth patterns or body size (e.g., large antlers scaling with body size).
      *   Co-option/Exaptation: Existing structure used for a new purpose (e.g., feathers initially for insulation, later co-opted for flight).
      *   Phylogenetic Inertia: Inherited from an ancestor where it had a different or no current function (e.g., hind limb bones in whales).
      *   Genetic Drift: Random fixation in small populations.
      *   Non-Arbitrary Boundary Issue: The trait may not be a distinct, selectable unit.
      *   **Rule:** At least ONE alternative must be written down, specifically linked to the trait's biology. Generic statements ("could be random") are insufficient.
      *   **Outcome Unmet:** Claim **REJECTED**. Label must state the trait is present "for reasons that are debated" or similar, or describe the trait only. Proceed only if alternatives are stated.

  **Stage 3: Evidence Assessment (5 mins)**
  3.  **Question:** *What evidence is cited in the brief to support the adaptive function claim over the stated alternatives? Grade its strength:*
      *   **Strong:** Experimental manipulation of trait or environment showing fitness difference (e.g., painting moths, predator exclusion).
      *   **Medium-High:** Direct, replicated field measurement of selection differentials correlating trait variation with fitness.
      *   **Medium:** Strong correlation of trait origin/occurrence with proposed selective regime across *independent* lineages (e.g., industrial melanism in multiple moth species).
      *   **Weak:** Optimality/Engineering model showing trait is *good for* F (e.g., chin biomechanics modelling). Cannot establish *why* it evolved.
      *   **Very Weak:** Handbook statement, expert opinion, or plausibility argument alone. Cannot establish causation.
      *   **No Evidence:** Only states the proposed function.
      *   **Outcome:**
          *   **Strong/Medium-High:** Proceed to Stage 4.
          *   **Medium:** Proceed to Stage 4 with caution; wording must reflect correlative evidence.
          *   **Weak/Very Weak/No Evidence:** Claim **REJECTED**. Label cannot imply adaptation *for* F. Use Stage 5 wording.

  **Stage 4: Claim Separation & Wording (3 mins)**
  4.  **Question:** *Which specific claim does the evidence support?*
      *   **A. Origin by Selection for F:** Evidence shows trait *arose* due to selection *for* F (e.g., melanism origin linked to industrial pollution via phylogeny & selection studies).
          *   **Wording Rule:** "Evolved *through* natural selection *for* [F]..." or "Natural selection favoured this trait *for* [F]..."
      *   **B. Current Maintenance by Selection for F:** Evidence shows trait *is kept* in the population by *ongoing* selection *for* F (e.g., soot gone, melanism declines; selection measured now).
          *   **Wording Rule:** "This trait *is* maintained by natural selection *for* [F]..." or "Currently, natural selection favours this trait *for* [F]..."
      *   **C. Current Usefulness for F (Not Origin):** Evidence only shows trait *is used* for F now, but origin/maintenance evidence is weak or absent (e.g., chin used in chewing/social signalling, but no evidence it *evolved* for that).
          *   **Wording Rule:** "This trait *is used for* [F]..." or "This trait *functions in* [F]..." or "This trait *aids in* [F]...". **NEVER** use "evolved for", "adapted for", "purpose", "designed for".
      *   **Outcome:** Select appropriate wording rule based on evidence. Ensure wording matches *exactly*.

  **Stage 5: Agnostic Wording & Word Limit (2 mins)**
  5.  **Question:** *If claim rejected at Stages 1, 2, 3, or if evidence only supports Current Use (C), what can we say within 60 words?*
      *   **Rule:** Describe the observable trait and its *current context* or *potential effects* without implying evolutionary cause. Use tentative language if discussing function.
      *   **Model Sentences (Agnostic Copy):**
          *   "This dark colouration provides camouflage against soot-darkened bark *in industrial areas*." (Current context/effect)
          *   "The protruding chin bone *may help* withstand chewing stresses *in modern humans*." (Potential current use, tentative)
          *   "The function and evolutionary history of this feature *are complex and debated*." (When truly uncertain)
          *   "This structure *is associated with* [X behaviour/context], though its origin *remains unclear*."
      *   **Outcome:** Draft label using approved wording rule (Stage 4) or agnostic model (Stage 5). Ensure ≤ 60 words. **Final Label Approved.**

  **Stage 6: Batch Audit (Per Gallery/Batch)**
  *   **Method:** Count the total number of labels making *any* trait-and-function claim (Stages 4A, 4B, or implying adaptation). Calculate the percentage.
  *   **Trigger:** If >50% of labels in a gallery/batch make adaptation claims (Origin or Maintenance), trigger revision.
  *   **Revision:** Systematically replace claims with lower confidence (Stage 3: Weak/Very Weak evidence) or ambiguous traits (Stage 1 issues) with Stage 5 agnostic wording. Increase use of "Current Use" (4C) or descriptive labels. Aim for <40% adaptation claims.

  **Curator Certification Points:**
  *   **Stage 1 Outcome:** Certify the trait is defined independently. If not, curator *must* reject the adaptive claim.
  *   **Stage 3 Outcome (Weak/Very Weak/No Evidence):** Certify that the evidence is insufficient to support an adaptation claim. Curator *must* reject Origin/Maintenance wording. Choice between Current Use (4C) or agnostic (5) wording becomes a *values* decision (engagement vs. accuracy risk). Procedure stops, curator decides.
  *   **Final Wording (Stage 4/5):** Certify wording matches the evidence level and claim type exactly. This is primarily factual.
  *   **Batch Audit Trigger:** Certify the count/percentage. The decision to revise is a *values* decision based on institutional priorities and the complaint risk. Procedure stops, curator/museum leadership decides.

  **Procedure Test Cases:**

  1.  **Peppered Moth (Dark Form):**
      *   Stage 1: Trait = "dark grey-black wing colouration" (Independent - PASS).
      *   Stage 2: Alternative = Could be a developmental by-product of pigment production pathways. (Written - PASS).
      *   Stage 3: Evidence = Correlation across multiple independent industrial regions (Medium). Brief lacks direct manipulation/selection measurement.
      *   Stage 4: Evidence (Medium correlation) supports **A. Origin by Selection for F**? Caution needed. Better supports **C. Current Usefulness** in industrial past. *Wording:* "**This dark colouration provided camouflage against soot-blackened tree bark in industrial areas.**" (Current Use, Agnostic - avoids "evolved for"). PASS (Modified wording).
  2.  **Human Chin:**
      *   *Claim 1: Evolved for chewing stresses.*
          *   Stage 1: Trait = "protruding bony mental protuberance" (Independent - PASS).
          *   Stage 2: Alternative = Architectural spandrel resulting from jaw reduction (PASS).
          *   Stage 3: Evidence = Likely only biomechanical models (Weak). No phylogeny, manipulation, selection studies cited.
          *   Outcome: **REJECTED** (Origin/Maintenance claim). Stage 5: "**This bony protrusion *may help* withstand stresses during chewing.**" (Current Use, tentative).
      *   *Claim 2: Evolved for mate choice.*
          *   Stage 1: Trait = "chin shape/size" (Vague, but definable - PASS cautiously).
          *   Stage 2: Alternative = Developmental allometry linked to overall facial growth (PASS).
          *   Stage 3: Evidence = Likely only speculative or correlative studies in modern humans (Weak/Very Weak). No evidence for *evolutionary origin* via sexual selection.
          *   Outcome: **REJECTED** (Origin/Maintenance claim). Stage 5: "**Variation in chin shape *has been linked to* perceptions of attractiveness *in some studies*, though its evolutionary origin is unclear.**" (Too long? Agnostic description preferred: "**The human chin varies in shape and size across individuals.**").
  3.  **Survival Gallery (25 Specimens):**
      *   **Batch Audit:** Assume most labels claim "evolved for [survival function]".
      *   **Procedure:** Apply Stages 1-3 to each label. Likely outcomes:
          *   Many traits poorly individuated (defined by survival function).
          *   Alternatives rarely considered in briefs.
          *   Evidence often Weak (engineering plausibility, handbook statements) or Medium at best (some correlations).
      *   **Result:** Majority of "why-it-evolved" claims **REJECTED**.
      *   **Revision Trigger:** >50% adaptation claims → **TRIGGERED**.
      *   **Revision:** Replace "evolved for" claims with:
          *   Agnostic descriptions of the trait and its *current* survival-relevant context/effect (Stage 5).
          *   "Current Use" statements (Stage 4C) if strong evidence for *current* utility (e.g., "Thick fur *insulates* against arctic cold").
          *   Focus on *how* the trait works or is used *now*, not *why* it evolved. The gallery theme shifts subtly from "Evolutionary Solutions for Survival" to "Traits for Survival in the Modern World/Current Environment".

  **What the Procedure Cannot Do:**

  1.  **Resolve Genuine Scientific Controversy:** It flags low evidence but won't settle debates where experts disagree based on complex evidence beyond the brief (e.g., many behavioural traits).
  2.  **Handle Deep Time/Scarce Evidence:** For fossils (early hominins, dinosaurs) or traits without a fossil record (behaviour, soft tissue):
      *   Stage 1 (Trait Individuation) may be passable (morphology).
      *   Stage 2 (Alternatives) is possible (spandrels, allometry, phylogeny).
      *   Stage 3 (Evidence) will almost always be **Weak/Very Weak/None** (no direct manipulation, limited phylogeny for independent origins, no direct selection measurement). Claims will systematically be **REJECTED**.
      *   **Result:** Labels will be descriptive or focus on observable morphology/potential *inferred* function *based on structure*, heavily caveated ("may have helped", "possibly used for"), or state uncertainty. The gallery *will* say less about evolutionary *why* in these areas.
  3.  **Assess Novel or Complex Evidence:** It relies on standard evidence types. Truly novel or interdisciplinary evidence might be misgraded.
  4.  **Guarantee Engagement:** The curator's fear of "boring" agnostic labels remains. The procedure ensures accuracy but doesn't solve the trade-off with perceived visitor engagement. This is a *values* decision point flagged for the curator.
  5.  **Compensate for Poor Briefs:** If the brief lacks basic information, the procedure will often reject claims by default. Garbage in, scientifically cautious out.

  This procedure operationalises the "spandrels" critique by forcing explicit consideration of trait definition and alternatives, grading evidence rigorously, separating evolutionary claims, and providing safe, agnostic fallbacks. It shifts the gallery narrative away from uncritical adaptationism while retaining the ability to present well-supported adaptive stories.
