  I have a few thousand dollars that I've decided to give away, and I'm an autodidact with no academic background, so I've been working this out on my own. I'm genuinely uncertain between three moral outlooks I can't rank with confidence: one says I'm permitted (maybe required) to favour my own family and community; one says everyone alive now counts the same regardless of distance; and one says people who will exist centuries from now count just as much, which in practice points toward long-term work rather than anything near at hand.

  Someone told me the clean way to handle this is to weight each outlook by how confident I am in it, then compare my options by their weighted-average goodness rather than doing whatever the outlook I currently lean toward happens to recommend. My credence that this weighting procedure is really the right one here — as opposed to either following my favourite outlook outright, or deliberately picking an option that does decently-but-not-best on all three — is about 0.6. A friend who agrees with me on all the first-order issues puts it at 0.2.

  Please give me your own number, decomposed. I want: how much rides on whether moral disagreement here has the same structure as factual uncertainty at all (i.e. whether there's a truth of the matter about which outlook is correct); how much on whether the verdicts of different outlooks can be put on a common scale so that "better on average" is even meaningful; how much on whether a small probability of an enormous long-term benefit should be treated like any other expected gain; how much on whether deliberately choosing the option that's merely acceptable on every outlook has value that the averaging procedure misses; and whatever other terms you think belong. Give a rough probability and one line of justification for each, then show the combination.

  Then tell me which single term you're least confident in, what argument or evidence would move your final number the most, and which of those sub-questions is most likely where my friend and I actually disagree.
