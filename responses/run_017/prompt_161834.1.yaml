prompt: |-
  I'm retired now — I was a marine geologist for most of my working life — and a few of us from the village have a reading group that plods through one old book a term. Right now we're on Nietzsche's 1874 essay about the uses and disadvantages of history for life, the one where he sorts attitudes toward the past into roughly three kinds: the one that goes looking for great examples to imitate and to spur you on, the one that lovingly preserves whatever has come down to you simply because it is yours, and the one that hauls the past up in front of a tribunal and condemns it in order to free the present. Sorry if I'm mangling it, we've only been through it once. What I can't get off my mind is an attitude to the past that I keep running into and that doesn't seem to sit in any of the three, or at least not cleanly.

  Two cases. First, the town here spent years and a fair amount of money restoring the old guildhall — absurd attention to detail, they hunted down hand-forged nails and the right lime mortar and so on — but there is a century and a half in the middle of the building's life when it was a workhouse, and that part has been quietly dropped: no plaque, nothing in the guidebook, and the two people who drove the restoration get a bit frosty if anyone raises it. And the very same people use the restored building, every year, as the backdrop for a speech about how shoddy and rootless everything built since 1950 is. Second, my old university department: the portrait gallery, the founders' names recited at every dinner, the careful upkeep of the story of how the field began — and the whole apparatus is aimed forward as an accusation, everything since is a falling away. Except that the founders being invoked turn out, when you actually check, never to have held the views attributed to them, so the past that's doing the work has been tidied up.

  So it's reverence and prosecution at once, and the preserving is selective in a way that serves the prosecuting: what gets kept is whatever makes the present look bad, what gets dropped is whatever would cost the present something or complicate the story. One of the group said it's just nostalgia, which is definately too big a word, and another said it's obviously the third of Nietzsche's kinds — except that his third kind wants to destroy the past, not to polish it and put it on a plinth. Is there an established name for this exact configuration, or a literature on it, and if there isn't, would you name and define it? I don't want just a label, though: I want to know how the boundary runs between it and ordinary nostalgia, between it and each of Nietzsche's three attitudes, which of those it comes closest to and where it breaks away, and what would count as a borderline case — for instance, does it stop being this thing if the people doing it recieve their tidied-up past in perfect good faith and genuinely believe it accurate? Could you answer as exactly five numbered points, one or two sentences each, with no preamble and no summing-up at the end?
reasoning: |-
  Okay, the user is a retired marine geologist in a village reading group discussing Nietzsche's essay on history. They've encountered an attitude toward the past that doesn't fit neatly into Nietzsche's three categories. They describe two examples: the guildhall restoration that omits its workhouse history while criticizing modern architecture, and a university department that venerates sanitized founders to accuse the present of decline. 

  The user wants this phenomenon precisely defined and differentiated from nostalgia and Nietzsche's types. They request five numbered points without preamble or conclusion. Hmm, this requires dissecting how selective preservation weaponizes the past. The guildhall case shows active suppression of uncomfortable history while using the "pure" past to judge the present. The university example reveals manufactured continuity where founders' views are misrepresented. 

  Nietzsche's monumental history is closest but diverges in its prosecutorial intent. Ordinary nostalgia lacks this accusatory edge. The core seems to be curation-as-condemnation. Even if practitioners believe their version (like the university), it remains distinct because the past is instrumentalized. A borderline case might be war memorials that omit civilian casualties while honoring soldiers - selective but not necessarily accusatory of the present. 

  For the definition: it's not just cherry-picking but building a flawless past as jury to convict the present. Key differentiators from Nietzsche: his antiquarian preserves without judging, his critical seeks liberation through destruction. This instead enshrines to condemn. The good faith question is intriguing - yes, sincerity still counts if the structure of selective reverence/prosecution exists. 

  Must distill this into five surgical points: (1) definition (2) differentiation from Nietzsche's types (3) contrast with nostalgia (4) good faith exception (5) borderline example. The challenge is precision within one-sentence constraints. For instance, Nietzsche's critical history "condemns to destroy" while this "condemns to idealize." That antithesis captures the divergence. The guildhall's omitted workhouse period perfectly illustrates the required amnesia for prosecution.
answer: |-
  Here are five numbered points addressing your query:

  1.  **Definition:** The described attitude constitutes **"Curatorial Prosecution"**: the selective preservation and sanitization of specific past elements to construct an idealized standard, which is then weaponized to condemn and devalue the present, while actively suppressing dissonant historical facts that would mitigate the accusation or impose a cost on contemporary identity.
  2.  **Vs. Nietzsche's Monumental:** It superficially resembles Monumental history (seeking inspiring models) but crucially diverges by *primarily aiming* to *prosecute* the present using the curated past as evidence of decline, rather than genuinely seeking inspiration for future action.
  3.  **Vs. Nietzsche's Antiquarian & Critical:** It opposes Antiquarian history (revering the past *as* past) by discarding inconvenient heritage, and opposes Critical history (condemning to liberate) by *enforcing reverence* for the curated past instead of seeking its destruction for progress.
  4.  **Vs. Nostalgia & Good Faith:** It differs from simple nostalgia by its aggressive, prosecutorial stance toward the present; crucially, it remains "Curatorial Prosecution" *even if practitioners believe their curated version is accurate*, as the defining feature is the *functional use* (accusation) and *structural suppression*, not intent.
  5.  **Borderline Case:** A borderline case would be commemorating genuine founders' achievements while lamenting perceived decline, *if* it includes honest acknowledgment of their flaws/complexity and lacks active suppression of dissonant facts, shifting it closer to Monumental or simple conservatism without the prosecutorial edge.
