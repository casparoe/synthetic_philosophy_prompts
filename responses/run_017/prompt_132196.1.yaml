  **BUREAU OF PHENOMENAL TIMING**  
  **CLAIMS DETERMINATION: FILE C-7842-Δ**  
  **MATTER OF CLAIMANT: SUBJECT S-113**  
  **STIMULUS EVENT: DESIGNATED PHENOMENAL OCCURRENCE #447 (PHI)**  
  **DATE OF DETERMINATION: 2027-04-19**

  **1.0 SUMMARY OF FINDINGS**
  Pursuant to Section 8(a)(iii) of the Consolidated Phenomenal Occurrence Policy (CPOP) and Bureau Procedural Manual § 304.5, the Bureau finds that Claimant S-113 experienced *one* (1) distinct phenomenal occurrence corresponding to Stimulus Event #447. Payment is authorized. The reported experience of a single moving spot changing color mid-trajectory constitutes a valid phenomenal occurrence under CPOP definitions. The timing of said occurrence is established as contemporaneous with the initiation of the second stimulus flash (Green Spot B, Exhibit 2), subject to the temporal parameters defined herein.

  **2.0 FACTUAL BACKGROUND & EXHIBITS REVIEWED**
  2.1. **Stimulus Event #447 (Exhibit 1 - Stimulus Log):** On 2027-02-14 at 14:03:17 UTC, Subject S-113 was presented with a sequence of two discrete visual stimuli on a calibrated display:
      *   Stimulus A: Red spot, 5ms duration, centered at coordinates (X=100, Y=200).
      *   Stimulus B: Green spot, 5ms duration, centered at coordinates (X=300, Y=200).
      *   Inter-stimulus interval (ISI): 60ms (Stimulus A offset to Stimulus B onset).
  2.2. **Subject Report (Exhibit 2 - Post-Event Deposition):** S-113 reported perceiving "a single dot starting on the left, moving smoothly to the right, and changing from red to green about halfway across the screen." This report was obtained under standard post-event verification protocols (BPM § 205.1, Attestation Form PVR-7).
  2.3. **Independent Monitoring Data (Exhibit 3 - Neural Capture Summary):** Standard non-invasive monitoring (EEG, fNIRS) confirmed physiological engagement consistent with visual processing during the stimulus window. No anomalies indicating artifact, distraction, or pre-existing neurological conditions contraindicating reliable reporting were detected (BPM § 402.3(a)).
  2.4. **Expert Analysis (Exhibit 4 - Bureau Phenomenologist Report):** Dr. A. Quist, Senior Temporal Phenomena Analyst, confirmed the reported percept aligns with the well-documented Color Phi Phenomenon. The report notes the critical temporal anomaly: the reported color change ("about halfway") implies a phenomenal event occurring *prior* to the onset of Stimulus B (Green Spot).

  **3.0 APPLICABLE POLICY PROVISIONS**
  3.1. **CPOP Definition §2(k):** "Phenomenal Occurrence" means a discrete, reportable state of conscious awareness, verifiable through first-person testimony under attestation protocols, arising from a specific Stimulus Event covered under this Policy.
  3.2. **CPOP Coverage Trigger §5(a):** Payment is due for each verified Phenomenal Occurrence directly attributable to a covered Stimulus Event.
  3.3. **CPOP Exclusion §7(b):** "No coverage shall apply to phenomenal content demonstrably generated *exclusively* by post-perceptual cognitive elaboration or memory reconstruction occurring after the causal stimulus window has closed, and not reflecting genuine conscious experience *during* said window."^(1)
  3.4. **BPM § 701.2 (Temporal Binding):** "Where phenomenal content integrates multiple stimuli occurring within a physiologically plausible integration window (≤ 150ms), the integrated percept shall be considered a single Occurrence unless evidence demonstrates the integration is definitively post-perceptual."

  **4.0 ANALYSIS & REASONING**
  4.1. **Existence of Phenomenal Occurrence:** The Bureau finds Claimant S-113's attested report credible and consistent with established perceptual science (Exhibit 4). The report describes a distinct, integrated conscious state ("moving, color-changing spot") triggered by Stimulus Event #447. This satisfies the definition of a Phenomenal Occurrence under §2(k).
  4.2. **The Temporal Anomaly & Competing Models:** The reported percept contains an element (color change mid-trajectory) that, based on the physical stimulus timing (Exhibit 1), could not have been *anticipated* by veridical sensory data at the reported temporal locus. Two explanatory models are pertinent to §7(b):
      *   **Model 1 (Orwellian Revision):** S-113 initially experienced two distinct flashes (Red A, Green B). The conscious percept was *immediately revised* post-Stimulus B, creating the illusory memory of a continuous motion and color change occurring *during* the stimulus window. The experience *as reported* genuinely occurred, but its timing incorporates a retroactive edit.
      *   **Model 2 (Stalinesque Show Trial):** S-113 experienced only the raw sensory data (Red A, Green B). The integrated narrative of motion and color change was constructed *after* Stimulus B by cognitive processes *outside* the stimulus window. The *apparent memory* of the moving spot is accurate, but it represents a post-hoc fabrication; the conscious experience *during* the window was of two flashes, not one moving/changing spot.
  4.3. **Indeterminacy of Models:** The Bureau acknowledges the expert consensus (Exhibit 4, pg. 8; BPM Reference Library Doc. PHI-1013) that no known experimental methodology or first-person testimony can definitively distinguish between Model 1 and Model 2. Both are philosophically coherent interpretations of the same behavioral and neural data (Exhibit 3).^(2)
  4.4. **Resolution Under Policy & Procedure:** While the *mechanism* is indeterminate, the Bureau is mandated by CPOP §5(a) and BPM § 304.5 to determine *if* a Phenomenal Occurrence meeting the §2(k) definition *did* occur *during the stimulus window*, and to specify its temporal locus for payout calculation. Indeterminacy regarding the *process* leading to the reported percept does not negate the occurrence of *a* reportable conscious state attributable to the stimulus.
      *   The integrated percept ("moving, color-changing spot") is the only state reported and attested to. It is the Phenomenal Occurrence under review.
      *   Both models agree the *final conscious state* reportable *by the subject* is the integrated percept. The dispute concerns only its temporal genesis.
      *   BPM § 701.2 (Temporal Binding) explicitly covers integrated percepts arising from rapid sequential stimuli within the 150ms window. The 60ms ISI falls well within this bound.
      *   Applying §7(b) requires evidence the content was generated *exclusively* post-perceptually. The impossibility of distinguishing Models 1 & 2 means such evidence is unavailable. The burden of proof under §7(b) is not met.^(3)
  4.5. **Temporal Locus Determination:** As the integrated percept relies critically on Stimulus B (Green Spot) for the color change element and completion of the motion path, and given the Bureau must assign *a* specific temporal anchor (BPM § 701.4), the Occurrence is temporally bound to the onset of Stimulus B. This reflects the final necessary input for the reportable state.

  **5.0 DETERMINATION**
  5.1. **Occurrence Verified:** One (1) Phenomenal Occurrence, corresponding to Stimulus Event #447 and described as "a single dot moving from left to right while changing color from red to green mid-trajectory," is verified as experienced by Claimant S-113.
  5.2. **Timing:** The Phenomenal Occurrence is temporally located at the onset of Stimulus B (Green Spot), 2027-02-14 14:03:17.063 UTC.
  5.3. **Payment:** Payment for one (1) Phenomenal Occurrence is authorized per CPOP Schedule 1.

  **SIGNED,**
  **ELARA VOSS, SENIOR CLAIMS ADJUDICATOR**  
  Bureau of Phenomenal Timing, Temporal Validation Division

  ---
  **FOOTNOTES:**

  1.  §7(b) stems from the "Witnessed Now or Never" precedent (In Re: Subject T-88, Dream Recall Claim, 2025), establishing that CPOP covers only experiences genuinely unfolding within the conscious present of the stimulus window, not subsequent confabulations about that window.
  2.  Dr. Quist notes attempts to isolate neural signatures of "revision" vs. "fabrication" remain inconclusive, relying on contested interpretations of late-stage processing signals. See also the meta-analysis by the Institute for Chrono-Phenomenological Scrutiny: "The Indeterminacy of Phi: A Persistent Challenge" (2026).
  3.  The Bureau rejects the argument that the *inherent* possibility of Model 2 constitutes sufficient evidence to invoke §7(b). Such a standard would render nearly all complex integrated percepts unverifiable, contravening the core intent of CPOP coverage for demonstrable conscious states arising from stimuli. Administrative feasibility necessitates accepting the attested report as evidence of the Occurrence, absent definitive contra-indicators (BPM § 304.5(f)).
  4.  While the timing is anchored to Stimulus B onset for administrative purposes, the Bureau acknowledges the phenomenological "specious present" (BPM Glossary) may inherently involve non-localized temporal elements. This does not alter the requirement for a single payout timestamp.

  ---

  **Craft Note:** Requirement 2 (Orwellian/Stalinesque collision) is met by meticulously outlining both models, conceding their empirical indistinguishability *in the analysis*, then forcing a legally mandated binary choice *despite* this concession. The comedy arises from the Bureau's procedural contortions (e.g., invoking Temporal Binding rules and burden-of-proof technicalities) to resolve an unresolvable metaphysical question. Requirement 3 (unstated reductio) is achieved through the Bureau's coldly logical application of its reasoning: the policies and procedures demonstrated here (credible attestation + lack of *definitive* evidence of post-perceptual fabrication = claim approved) could equally invalidate *any* memory-based claim if applied skeptically, seeding discomfort about the verifiability of one's own experiences under such a bureaucratic lens. The humor is in the unflinching administrative seriousness applied to the abyss.
