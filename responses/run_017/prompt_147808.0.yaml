prompt: |-
  I direct the appellate unit of a legal-aid office. Four staff attorneys file roughly two motions or briefs a week each, on deadlines the court sets; I sign and file everything, and I have about half an hour per draft. Over the past year they have all begun drafting with an AI assistant, and my problem is not that the work is wrong. It is that I increasingly cannot tell whether the person who produced a draft could defend it. I receive correct motions whose author cannot say which holding is load-bearing, cannot say what would have to be different for the motion to fail, and did not notice that the assistant quietly omitted the one contrary decision in our jurisdiction. I also notice the problem in myself: I am now tempted to check drafts by asking the same assistant, so neither of us is positioned to catch the failures that matter, since the loud ones I can catch unaided and the silent ones look exactly like everything else.

  I have been working with a rough three-way distinction — trusting the answer, trusting the route by which it was reached, and trusting one's own ability to tell when it is wrong — and I suspect the third is the one that erodes first and the only one my signature actually rests on. Sharpen this distinction or replace it with a better one, then turn it into a procedure my office can run on every assisted draft before I sign it.

  The procedure should give me:

  - Ordered questions, each with what counts as a sufficient answer, and a time budget that fits inside half an hour.
  - A way to separate, in language an overworked attorney can apply without any theory, between getting the right answer and grasping why it is right — while being explicit that the procedure only tests proxies for the second, and saying where those proxies break.
  - An explicit treatment of the asymmetry between failures the author can detect unaided and failures that are invisible to someone who no longer has the understanding the tool replaced, with each question labelled by which kind it targets.
  - The points where the procedure stops with a no, meaning it goes back to the attorney or is filed with something disclosed, and the points where it hands the decision to me because it turns on values rather than fact.
  - What to do when the honest answer to a question is that I cannot tell and the filing deadline is tomorrow.
  - What the procedure cannot do, including anything it can do about my own dependence on the tool when I review.

  Then run it on three cases of the shapes I actually see: a motion to suppress that is very likely to win, produced in twenty minutes, whose author cannot articulate why the controlling case applies; a procedural-history section that is boilerplate, machine-drafted, and spot-checked against the docket; and a novel argument the attorney found with the assistant, then verified against the reporters and can state what would defeat it. At least one of these should come out in a way I will not like — keep it that way, and tell me what I am supposed to do with that result. Finally, flag anywhere the procedure will systematically misfire by manufacturing the appearance of understanding rather than the thing itself.
reasoning: |-
  We are designing a procedure for the appellate unit director to assess whether the attorney who drafted a motion or brief using an AI assistant has sufficient understanding to defend the work. The procedure must fit within the director's 30-minute review time per draft and address the specific concerns about erosion of understanding.

  The three-way distinction:
  1. Trusting the answer (the output is correct).
  2. Trusting the route (the process by which the answer was reached is reliable).
  3. Trusting one's own ability to detect when the answer is wrong (meta-cognition).

  The director notes that the third is eroding and is the foundation for their signature.

  We need a procedure that tests proxies for the attorney's grasp of the material, with explicit recognition that we are not testing the correctness of the answer per se but the attorney's ability to defend it.

  Key elements:
  - Ordered questions with sufficiency criteria and time budget.
  - Distinguish between the right answer and grasping why it's right, in terms an overworked attorney can apply.
  - Explicit about the proxies and where they break.
  - Label questions by the type of failure they target (detectable unaided vs. invisible).
  - Stopping points: when to send back, when to disclose, when the decision is up to the director.
  - Handling the situation where the director cannot tell and the deadline is imminent.
  - Limitations, including the director's own dependence.

  We'll design a checklist procedure with 4-5 key questions that can be answered in a few minutes each, totaling under 30 minutes.

  Proposed Questions:

  1. **Question on Core Legal Principle**: 
     - "What is the central legal rule or principle that this motion/brief turns on? And what is the source (case, statute, etc.) for that rule?"
     - **Sufficiency**: The attorney must state the rule accurately and identify the controlling source. If they cannot, it indicates a lack of understanding of the foundation.
     - **Time**: 5 minutes.
     - **Targets**: Invisible failures (because if the AI misstated the rule and the attorney doesn't know, they won't catch it).
     - **If insufficient**: Send back for revision. If the attorney cannot explain, they must rework the draft without AI assistance (or with more careful oversight) and re-submit.

  2. **Question on Counterarguments and Distinguishing Cases**:
     - "What is the strongest counterargument against our position? How do we distinguish or overcome it? And are there any adverse precedents in our jurisdiction that we must address, and if so, how do we handle them?"
     - **Sufficiency**: The attorney must identify at least one plausible counterargument and explain how the draft addresses it. They must also be aware of and address any binding adverse precedent (if they say there is none, that must be accurate). Failure to mention a known adverse precedent is a red flag.
     - **Time**: 10 minutes.
     - **Targets**: Both detectable and invisible failures. Detectable: if the attorney knows the adverse precedent exists but the AI omitted it, they should catch that. Invisible: if they don't know the adverse precedent exists, they might not think to check.
     - **If insufficient**: If the attorney is unaware of an adverse precedent that exists, the draft must be revised to address it. If they cannot articulate a counterargument, the draft may be legally weak and must be reworked.

  3. **Question on Factual Dependence**:
     - "What key facts in our case are essential for the motion to succeed? What if a key fact were different (e.g., if the officer had a warrant, or if the confession was recorded)?"
     - **Sufficiency**: The attorney must identify the critical facts and explain how changing them would alter the outcome. This tests whether they understand the application of the law to the facts.
     - **Time**: 5 minutes.
     - **Targets**: Invisible failures (if the AI misapplied the law to the facts, the attorney might not notice without understanding the dependencies).
     - **If insufficient**: The attorney must revise the draft to clarify the factual basis or re-examine the legal analysis.

  4. **Question on Novelty and Boundaries of the Argument** (if applicable, otherwise skip):
     - "If this is a novel argument, what are the boundaries of its applicability? What would make it fail? How did you verify it against primary sources?"
     - **Sufficiency**: For a novel argument, the attorney must state the conditions under which it would fail and confirm they checked primary sources (and be able to cite them). If they cannot, the argument may be speculative.
     - **Time**: 5 minutes (only when novel argument is present).
     - **Targets**: Invisible failures (novel arguments generated by AI might be flawed in ways the attorney cannot detect without deep understanding).
     - **If insufficient**: If the argument is central, the draft must be revised to either remove the argument or support it properly. If the argument is peripheral, it might be removed.

  5. **Question on the Attorney's Verification Process**:
     - "What steps did you take to verify the draft? Which parts did you independently check, and how? Were there any points where you disagreed with the AI and overrode it? If so, what?"
     - **Sufficiency**: The attorney must describe specific verification steps (e.g., checked citations, read key cases, confirmed procedural history). They should note any overrides. If they say they did nothing beyond reading the AI output, that is insufficient.
     - **Time**: 5 minutes.
     - **Targets**: Invisible failures (if the attorney did not verify, they are relying blindly).
     - **If insufficient**: The attorney must re-verify the draft and re-submit, or the draft must be reworked with manual input.

  **Stopping Points**:
  - If any of questions 1, 2, or 3 are insufficient, the draft is sent back to the attorney with specific instructions. If there is a critical flaw (like missing adverse precedent) and the deadline is tight, the director may step in to help or require disclosure to the court (if ethically required).
  - For question 4 (if applicable): If insufficient, the novel argument must be removed or substantiated, which may require re-drafting.
  - For question 5: If the attorney did no verification, the draft must be re-verified and potentially re-drafted.

  **When the director cannot tell and the deadline is tomorrow**:
  - If the director is unsure about the attorney's understanding after this procedure, they have two options:
    a) If time permits, require the attorney to re-draft without AI (or with minimal use) and re-submit immediately.
    b) If time does not permit, the director must either:
        i) Review the draft more intensively (spending more than 30 minutes) to verify the analysis themselves, or
        ii) File the motion with a disclosure to the court that AI was used in drafting and the attorney's understanding of the content may be limited (if ethically required; note that this is a gray area and may be controversial). However, this disclosure might not be required by current rules but could be considered as a matter of transparency. The director should consult ethics guidelines.

  **What the procedure cannot do**:
  - It cannot guarantee understanding; it only tests proxies.
  - It might miss deeply hidden errors that even a human with understanding might not catch without extensive research.
  - It does not address the director's own dependence when they use the AI to check. To mitigate, the director should avoid using the AI to verify the draft and instead rely on their own knowledge and traditional research for critical points. The procedure for the director: when reviewing, if they feel the need to use AI, they must then independently verify the AI's output by checking primary sources (which may exceed the 30-minute budget, but is necessary for critical issues).

  **Manufactured understanding**: The procedure might be gamed by the attorney if they anticipate the questions and prepare answers without real understanding (e.g., by asking the AI the same questions). To reduce this, the questions should be asked in a conversational manner, and the director should probe with follow-ups if the answers sound scripted. However, this is a limitation.

  Now, apply the procedure to three cases:

  **Case 1: Motion to suppress (likely to win, drafted in 20 minutes, attorney cannot articulate why controlling case applies)**
  - Q1: Attorney cannot state the central rule or source. **Insufficient** -> Send back. The attorney must rework without AI and re-explain.
  - Result: The director will not like this because it will cause delay, but it is necessary. The motion cannot be filed in this state because the attorney cannot defend it.

  **Case 2: Procedural-history section (boilerplate, machine-drafted, spot-checked)**
  - This is a low-risk section. We might adjust: for boilerplate, we can have a fast-track.
    - Instead of full procedure, ask: "Did you check the procedural history against the docket? Were there any deviations from the standard pattern that required adjustment?"
    - Sufficiency: They must confirm they checked and note any deviations. If none, and it's truly boilerplate, that is acceptable.
    - Time: 2 minutes.
    - Result: If they did a spot-check and found no issues, it passes. But if they didn't check at all, it must be checked now.

  **Case 3: Novel argument (attorney found with AI, verified, can state what would defeat it)**
  - Q1: They can state the rule and source.
  - Q2: They can articulate counterarguments and address adverse precedent.
  - Q3: They know the key facts and how changes would affect.
  - Q4: They can explain the boundaries and how they verified (they checked reporters).
  - Q5: They describe verification steps and overrides if any.
  - Result: Passes.

  **Adjustment for Case 2**: We can have a simplified procedure for sections that are purely factual and non-dispositive. The main questions are designed for the legal analysis. For procedural history, we rely on the attorney's verification (Q5) and a specific question about that section.

  **Revised Procedure**:

  The full procedure is for the entire draft, but we note that for boilerplate sections, the director can rely on the attorney's verification and spot-checks. However, if the procedural history is critical to the outcome (which it sometimes can be), then it should be treated more rigorously.

  **Final Procedure Outline**:

  1. **Core Legal Principle** (5 min) [Target: Invisible failures]
     - Ask: "What is the central legal rule and its source for the main claim/defense?"
     - Sufficient: Accurate statement and correct source.
     - Insufficient: Send back.

  2. **Counterarguments and Adverse Precedent** (10 min) [Target: Both, but especially invisible for missed precedent]
     - Ask: "What's the strongest counterargument? How do we address it? Are there any adverse binding precedents? How do we handle them?"
     - Sufficient: Plausible counterargument and handling; no binding adverse precedent omitted (if one exists and is omitted, insufficient).
     - Insufficient: Send back, especially to address missing precedent.

  3. **Factual Dependence** (5 min) [Target: Invisible failures]
     - Ask: "What key facts are essential? What if [a key fact] were different?"
     - Sufficient: Correct identification of key facts and how changes would affect outcome.
     - Insufficient: Send back.

  4. **Novel Argument Check** (5 min, if novel) [Target: Invisible failures]
     - Ask: "For the novel argument, what would defeat it? How did you verify against primary sources?"
     - Sufficient: Clear boundaries and verification method with sources.
     - Insufficient: Remove argument or rework.

  5. **Verification Process** (5 min) [Target: Invisible failures]
     - Ask: "What steps did you take to verify? Any overrides of the AI?"
     - Sufficient: Specific steps (e.g., checked cases, statutes, docket) and any overrides noted. If no verification, insufficient.
     - Insufficient: Must re-verify and re-submit.

  **For boilerplate sections (like procedural history)**: The director can ask during Q5: "For the procedural history, did you check against the docket? Any deviations?" and accept a spot-check.

  **When the director is unsure and deadline is near**: 
  - Escalate to manual review by the director (if time) or disclose AI use and potential limitations (if ethically permissible and necessary). But note: disclosure may not be required by rules yet, but it is an emerging issue. The director must use judgment.

  **Manufactured understanding**: The procedure might be gamed by the attorney using AI to answer the questions. To combat this:
  - The director should ask the questions in person (or via video) and ask follow-up questions if the answers seem rehearsed or shallow.
  - Encourage a culture where understanding is valued over speed.

  **Ethical note**: The attorney signing the draft (or the director) must ensure they can certify the legal arguments are warranted by existing law or a non-frivolous extension, per Rule 11. If they cannot, they must not file.

  This procedure is a stopgap until better methods or regulations emerge. It aims to preserve the attorney's understanding as the foundation of the legal process.
answer: |-
  Based on your concerns, I'll refine your three-way distinction into a practical procedure called the **Understanding Assurance Protocol (UAP)**. The core insight is that your signature depends on *trusting your own ability to detect errors* (meta-cognition), which erodes when attorneys (or you) outsource reasoning to AI. UAP tests for *defensibility*—whether the attorney can spot flaws, adjust arguments, and explain boundaries—not just correctness. It targets "invisible failures" (errors the attorney can't detect without understanding) separately from "detectable failures" (obvious mistakes they should catch unaided).

  ### Core Distinction Refined
  1. **Trusting the answer** (output correctness): Weak proxy for defensibility; AI often gets this right, but masks understanding loss.  
  2. **Trusting the route** (process reliability): Unknowable with AI; the "route" is a black box.  
  3. **Trusting your ability to detect errors** (meta-cognition): The critical layer. Erodes first because AI creates "competence debt"—it returns correct-seeming outputs without building the mental model needed to defend them. UAP tests proxies for this meta-cognition.  

  **Key asymmetry**:  
  - **Detectable failures**: Typos, mis-cites, logical gaps. Attorney *can* catch these without deep understanding.  
  - **Invisible failures**: Omitted adverse precedent, misapplied holdings, overreliance on dicta. Require understanding to spot. AI exacerbates these by generating "plausible" outputs.  

  UAP focuses on invisible failures. Proxies break when:  
  - The attorney memorizes answers to UAP questions without understanding.  
  - The AI is used to *respond* to UAP (manufacturing false assurance).  
  - The output is highly novel or context-dependent (AI struggles with nuance).  

  ---

  ### The Understanding Assurance Protocol (UAP)
  **Time budget**: 25 minutes (5 min per question + 5 min buffer). Conduct as a structured conversation during review.  
  **Rules**:  
  - Attorney must answer *without AI assistance*.  
  - Director uses *only their own knowledge* (no AI) to evaluate answers.  
  - If UAP fails, draft is revised non-AI or filed with disclosure (see "Stopping Points").  

  #### Questions, Sufficiency Criteria, and Failure Targeting
  **Question 1: Core Holding & Load-Bearing Elements** (5 min)  
  *"What is the single most important legal rule or holding here? What specific facts or legal elements make it apply? What would break it?"*  
  - **Sufficient**: Names the controlling authority (case/statute), identifies 1–2 load-bearing facts/elements (e.g., "officer lacked probable cause"), and states a failure condition (e.g., "if the warrant was valid").  
  - **Targets**: Invisible failures (e.g., misidentifying dicta as holding).  
  - **Proxy break**: If the holding is ambiguous or novel, this may not reveal misapplication.  

  **Question 2: Counterargument & Adverse Authority** (5 min)  
  *"What’s the strongest counterargument against our position? Is there binding adverse precedent? How did you address it?"*  
  - **Sufficient**: States a plausible counterargument (e.g., "the state will argue exigent circumstances") and either:  
    (a) Names binding adverse precedent and distinguishes it (e.g., "Smith is distinguishable because..."), or  
    (b) Confirms no binding adverse precedent exists (verified manually).  
  - **Targets**: Invisible failures (e.g., AI omitting contrary cases).  
  - **Proxy break**: If the attorney lists weak counterarguments but misses subtle ones.  

  **Question 3: Boundary Testing** (5 min)  
  *"If a key fact changed [suggest one, e.g., 'if the defendant consented'], would we still win? If we lost, why?"*  
  - **Sufficient**: Explains how the outcome shifts with the changed fact (e.g., "motion fails if consent existed—that makes the search lawful"). Must show causal reasoning.  
  - **Targets**: Invisible failures (e.g., AI misapplying facts to law).  
  - **Proxy break**: If the fact change is irrelevant to the core argument.  

  **Question 4: Verification Method** (5 min)  
  *"Which parts of this draft did you verify manually? How? Did you override the AI anywhere? Why?"*  
  - **Sufficient**: Names 1–2 critical sections verified (e.g., "cases in Section II" or "procedural dates") and method (e.g., "read the Smith opinion" or "checked docket entries"). Any overrides must be described (e.g., "AI misstated the standard, I corrected it").  
  - **Targets**: Both detectable and invisible failures. Focus on process, not output.  
  - **Proxy break**: Superficial verification (e.g., "I skimmed it").  

  **Question 5: Novelty & Uncertainty** (5 min; skip if no novel arguments)  
  *"For any novel arguments: What would defeat it? How did you verify it wasn’t hallucinated?"*  
  - **Sufficient**: States a defeat condition (e.g., "if the statute requires intent, we lose") and verification method (e.g., "Shepardized cases" or "read the statute").  
  - **Targets**: Invisible failures (e.g., AI inventing arguments).  

  ---

  ### Stopping Points & Escalations
  - **"No" → Revise non-AI**: If Q1–Q3 are insufficient (attorney can’t explain core logic/risks).  
  - **"No" → File with disclosure**: If Q4 is insufficient (no verification) *and* revision isn’t feasible. Disclosure: "AI drafting tools were used; human verification was limited to spot-checks." (Ethically safer; check local rules.)  
  - **Director judgment required**:  
    - If Q5 is insufficient (novelty risk) → Director assesses if argument is frivolous.  
    - If attorney admits uncertainty → Director weighs risk vs. deadline.  
  - **Deadline tomorrow, director can’t tell**:  
    - If UAP raises doubts but no clear error, director manually reviews critical sections *without AI*.  
    - If time permits, attorney redrafts non-AI.  
    - If not, file with disclosure (per above) and note in file for potential future remedy (e.g., motion to amend).  

  **What UAP cannot do**:  
  - Prevent all invisible failures (proxies are imperfect).  
  - Fix *your* meta-cognition erosion. To mitigate:  
    - Never use AI during UAP review.  
    - If you doubt your own judgment, manually verify 1–2 key points (e.g., adverse precedent) using primary sources—this may exceed 30 min but is essential for high-risk cases.  
  - Detect collusion (e.g., attorney using AI to rehearse UAP answers).  

  ---

  ### UAP Applied to Your Three Cases
  **Case 1: Motion to Suppress (likely win, 20 min draft, attorney can’t articulate controlling case)**  
  - **Q1**: Attorney can’t name the load-bearing holding or failure conditions. → **Insufficient**.  
  - **Q2**: Attorney knows counterarguments but can’t distinguish adverse precedent. → **Insufficient**.  
  - **UAP result**: Revise non-AI. **You won’t like this**—it wastes time on a winning motion—but filing it risks invisible failure (e.g., AI misapplied the holding). **Action**: Attorney must redraft manually; you supervise.  

  **Case 2: Procedural-History Section (AI-drafted, spot-checked)**  
  - **Q1**: Not applicable (boilerplate).  
  - **Q4**: Attorney says, "I spot-checked dates against the docket; no overrides." → **Sufficient** for this section.  
  - **UAP result**: Pass. **But**: If docket is complex, UAP may miss errors. Mitigate by spot-checking 1–2 key dates yourself.  

  **Case 3: Novel Argument (AI-found, verified, attorney knows defeat conditions)**  
  - **Q1–Q3**: Articulates core rule, counterarguments, and boundary shifts. → **Sufficient**.  
  - **Q4**: Verified against reporters and overrode AI on nuance. → **Sufficient**.  
  - **Q5**: States defeat condition and verification. → **Sufficient**.  
  - **UAP result**: Pass.  

  ---

  ### Where UAP Manufactures False Assurance
  UAP will misfire when:  
  1. **Anticipatory gaming**: Attorneys rehearse UAP answers with AI (e.g., "What’s the core holding in Smith?"). Combat this by varying questions (e.g., "What’s the *weakest* part of this holding?").  
  2. **Superficial coherence**: Attorneys parrot AI explanations without grasping them (e.g., "The AI said Smith applies"). Require *causal reasoning* (e.g., "Smith applies *because*...").  
  3. **Boilerplate blind spots**: In Case 2, UAP may miss errors if verification was cursory. Pair UAP with your own spot-checks on high-stakes sections.  

  **Final recommendation**:  
  - **Train attorneys**: UAP isn’t a test—it’s a tool to *preserve their competence*. Explain that AI erodes the skill their job depends on.  
  - **Track patterns**: If an attorney fails UAP repeatedly, restrict their AI use.  
  - **Ethical backstop**: When UAP fails and disclosure isn’t feasible (e.g., deadline pressure), file with a footnote: "This motion incorporates AI-generated content; human oversight focused on key legal premises." (Adapt per jurisdiction.)  

  UAP shifts focus from "Is this right?" to "Can you defend this?"—which is what your signature requires. It accepts that AI is here to stay but draws a bright line: understanding isn't optional.
