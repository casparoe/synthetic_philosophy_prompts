answer: |-
  Here's a diagnosis of the stalemate, why your hypothesis is largely correct, what else might be playing a role, what progress could look like, and my assessment of confidence:

  **Core Diagnosis: Your Hypothesis is Largely Correct (85% Confidence)**

  1.  **The Foundational Epistemological Stalemate (Burden of Proof / Default Justification):** This is the primary engine of the standoff.
      *   **Realist Default (Innocent Until Proven Guilty):** Realists operate under a principle similar to perceptual justification: a cognitive faculty (like moral intuition) is *prima facie* justified unless a specific, undefeated defeater is presented. They see the debunker's demand ("Explain *why* this faculty is reliable *before* we trust it for truth-tracking") as an unreasonable, potentially infinite regress-inducing burden. *Why* should they shoulder this burden for moral intuition when they don't for perception or logic? The mere *possibility* of unreliability isn't enough; a *positive reason for doubt* specific to morality is needed.
      *   **Debunker Demand (Explanation-Required):** Debunkers fundamentally reject this default for evolved moral intuitions. They see the debunking argument *itself* as furnishing the necessary defeater: the complete causal explanation of our moral beliefs via a process (natural selection for fitness) that is *insensitive* to the putative truth-maker (mind-independent moral facts). For them, the lack of an independent explanation for *how* selection could link beliefs to these facts *is* the positive reason for doubt. They argue that without such a grounding story, the belief loses its warrant, regardless of its content or felt certainty. Trust must be *earned* in this specific case.

  2.  **Counterfactual Framing Disagreement (What does "Tracking" mean here?):** This is intertwined and equally crucial.
      *   **Debunker's Fixed-Facts/Vary-Process Frame:** They hold the (hypothetical) moral facts fixed ("Suppose there *are* Platonic moral truths...") and vary the evolutionary pressures ("...would creatures evolving under *different* pressures likely end up with beliefs matching *those* truths?"). Their answer is "No," hence no reliable tracking. The process appears insensitive to the facts.
      *   **Realist's Fixed-Process/Vary-Facts Frame:** They hold the actual evolutionary pressures roughly fixed ("Given *our* evolved cognitive and motivational apparatus...") and ask a different counterfactual: "If the moral facts *were different* (e.g., if torturing babies were good), would this apparatus reliably lead us to *different* moral beliefs?" Realists often argue "Yes" – our empathetic aversion, social instincts, etc., *would* generate different beliefs aligned with different (counterfactual) facts. This frames the faculty as *potentially* sensitive/reliable within its domain. They see the debunker's frame as question-begging by assuming facts exist independently of any process that could link to them.

  **What Else is Playing a Role (Less Central, But Contributing):**

  3.  **Ambiguity in "Explanation" (The "Grounding" Problem):** The realist often provides *functional* explanations ("Empathy promotes cooperation, which is adaptive"). The debunker demands a *metaphysical grounding* explanation ("How does the neural state realizing 'cooperation is good' latch onto the *abstract property* of moral goodness?"). Realists may see the demand for the latter as either illegitimate (if moral properties are natural) or impossible to meet *for any domain* (if moral properties are non-natural), making it an unfair test. Debunkers see functional explanations as irrelevant to truth-tracking for non-natural facts.
  4.  **The Constitutive Argument as a Meta-Disagreement:** Realist point (c) ("moral judgment is constitutive") isn't just another argument; it's a challenge to the *entire framing* of the debunking project. It suggests the debunker is trying to adopt an impossible "view from nowhere" to audit something that defines rational agency itself. This isn't resolvable within the standard tracking/reliability framework because it rejects the external standpoint the debunker assumes. It's a fundamental divergence in understanding what moral thought *is*.

  **What *Isn't* Primarily Stalling Things (Contra Your Query):**

  *   **Empirical Granularity:** While debates exist about *specific* judgments (e.g., incest aversion), the core philosophical stalemate persists even granting that selection *significantly shaped* core moral intuitions (like fairness, harm aversion). The disagreement is about the *implications* of that shaping, not primarily its extent. A definitive empirical finding wouldn't resolve the philosophical clash about justification or counterfactuals.
  *   **Bedrock "Could Moral Claims Be False?":** This is downstream. Realists *do* think they could be false (e.g., if pain weren't bad). The debate is whether the evolutionary origin gives us *reason to believe they are* false or unreliable. The constitutive argument pushes against this, but it's distinct.

  **What Could Count as Progress:**

  Given this diagnosis, progress requires breaking the epistemological or counterfactual logjam, or reframing the constitutive point:

  1.  **Clarifying the Default Epistemology:** An argument showing why the debunker's "explanation required" demand *is* or *is not* reasonable *specifically* for faculties shaped by processes indifferent to the putative truth-makers, *without* triggering a global skepticism. This might involve distinguishing types of beliefs (e.g., "core practical commitments" vs. "empirical hypotheses"). Success: A widely accepted principle distinguishing when a causal origin *does* shift the burden of proof.
  2.  **Resolving the Counterfactual Stalemate:** Formalizing the counterfactuals using tools like structural causal models to rigorously analyze sensitivity and insensitivity under different fixed points. Success: A demonstration that one framing is logically incoherent, inconsistent with evolutionary theory, or demonstrably less relevant to justification than the other. Or, showing they answer fundamentally different questions.
  3.  **Bypassing the "Grounding" Demand:** A compelling argument that functional role *can* constitute genuine (non-mysterious) access to moral properties (e.g., robust moral naturalism), rendering the demand for further grounding otiose. Success: Widespread acceptance of a naturalist account that debunkers concede *would* answer their worry.
  4.  **Reframing the Constitutive Point:** Articulating why the "external audit" perspective *is* possible/necessary for rational belief revision, even for constitutive elements of reasoning (comparing it to auditing logic or perception). Or, conversely, providing a knockdown argument that it *is* incoherent. Success: Moving the debate beyond simply asserting the point to analyzing *why* the external stance is deemed possible/impossible.
  5.  **Focusing on Disagreement:** Shifting focus from global debunking to evolutionary explanations for *moral disagreement*. If selection pressures varied significantly across groups, does this undermine realist claims about convergence? This leverages evolution differently and might create pressure points the global argument lacks. Success: Realists conceding evolutionary pressures *do* limit convergence potential in ways that challenge strong objectivism.

  **Honest Assessment of "Nothing Will":**

  It's plausible the stalemate persists indefinitely. The core disagreements (default justification, relevant counterfactuals, the nature of moral thought) touch on bedrock philosophical commitments (epistemology, metaphysics, philosophy of mind). Progress relies on conceptual shifts or new frameworks that currently seem elusive. If moral realism is intertwined with a specific view of rationality (as the constitutive argument suggests), and anti-realism with a more naturalistic/scientific worldview, the debate may be a proxy for these deeper divides. New empirical findings (e.g., complex neuroscience of moral judgment) might *inform* but are unlikely to *resolve* the core philosophical clash about justification and truth-tracking.

  **Least Confident Part of the Diagnosis (The Constitutive Argument):**

  I'm least confident (70%) in fully capturing the depth and force of the **constitutive argument** (realist point (c)) and its role. Is it a genuine meta-obstacle making the debunker's project incoherent? Or is it merely a sophisticated way of restating the default justification stance ("we have to start reasoning from somewhere")? Diagnosing *why* precisely this argument feels like such a roadblock to debunkers, beyond just being another point, is tricky. Its power lies in challenging the very *intelligibility* of the external audit the debunker proposes, which feels different in kind from the epistemological burden/counterfactual disputes. Pinpointing whether this is the *real* bedrock disagreement or an offshoot of the others is where my certainty dips.
