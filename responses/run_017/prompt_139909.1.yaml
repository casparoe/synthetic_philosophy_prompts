prompt: |-
  I teach political philosophy, and this term I am co-convening a small interdisciplinary reading group with a social psychologist who works on cross-cultural variation in the strength of norms: the now-familiar contrast between "tight" societies, where norms are dense, unambiguous and strictly enforced, and "loose" ones, where they are thinner and deviance is tolerated, together with her working hypothesis that a society's position on that spectrum tracks ecological and institutional threat. Last week the group came apart over a case we could not resolve, and I want to hand the members something better than the exchange we actually had.

  The case: one of our number is about to spend a semester at a university in a country whose academic and everyday norms are considerably stricter than ours — rigid forms of address, dress expectations, deference to seniority, tighter limits on what may be said in a seminar, and a strong presumption against contradicting a senior colleague in public. She said she intended to go on speaking and dressing more or less as she does here, and a colleague replied, with the air of closing the matter, that "when in Rome, do as the Romans do." I think that proverb was being made to carry a conclusion it does not obviously bear — that she is required, and not merely permitted, to conform, and required irrespective of whether she judges the local norms good — but I could not say in the room what premise would have to be added to get there, and I suspect the sentence is really several theses of very different weight stacked on top of one another.

  What I would like from you is a disambiguation, arranged as a menu I can put in front of the group, of the distinct precise claims the proverb might be expressing, ordered from the near-trivial to the genuinely radical, with a verdict on each: which is a platitude, which is substantive and defensible, which is contentious, and which is straightforwardly false. I have some candidate readings in mind and would be glad to have them sharpened or replaced — conformity as mere compliance with expected sanctions; conformity as uptake of a coordination convention, where an act simply fails to mean what the agent intends except against local conventions; conformity as epistemic deference to people who know local conditions and consequences better than a visitor does; conformity as acknowledgment of the authority or legitimacy of a normative order as such; and conformity as an expressive gesture of respect owed to a community one is joining as a guest. For each, I would want to know whether it yields only a prudential or etiquette-based reason, or something that can be called an obligation, and whether it would actually support the use to which the proverb was put. Three complications should be addressed as well, since they are where the argument seemed to me to bite. First, the self-application problem: in a genuinely permissive culture the operative local norm may be tolerance of deviance, so a proverb telling one to do as the locals do appears there to require nonconformity — and I want to know whether that is a fatal instability or merely a sign that the proverb has an implicit parameter for what kind of norm is in play. Second, the "which Rome" problem: whose norms count when a society is internally divided, and in particular whether there is an asymmetry whereby deviation registers strongly with the strict while conformity registers hardly at all with the permissive, so that the practical grain of the proverb always drifts toward its strictest available reading. Third, the abhorrent-Rome problem: whether any of the readings survives when what Rome requires is something our colleague takes to be unjust — for example staying silent while a senior colleague asserts something she believes to be false, or observing a gendered norm she regards as demeaning — and whether the proverb's plausibility in ordinary cases depends on a suppressed assumption that the local norms are not seriously unjust, or at least not more unjust than the alternatives. Finally, tell me which of these readings you take people to have in mind when they deploy the line in order to end an argument, and whether that reading is one they should be willing to defend.
reasoning: |-
  Okay, the user teaches political philosophy and is running an interdisciplinary reading group with a social psychologist focusing on tight vs. loose societies. The group hit a snag when discussing a colleague planning to visit a stricter academic environment. The colleague said she wouldn't conform to local norms, and another member shut down the discussion with "when in Rome, do as the Romans do." The user wants to dissect this proverb to present a clear menu of interpretations to the group, ranging from trivial to radical, with evaluations of each. They also want to address three complications: self-application in permissive cultures, "which Rome" in divided societies, and abhorrent norms.

  First, I need to unpack the proverb's possible meanings. The user mentioned several candidate readings: compliance with sanctions, coordination conventions, epistemic deference, acknowledgment of legitimacy, and expressive respect. I should structure these from least to most demanding. 

  Starting with mere compliance: this is about avoiding penalties. It's a pragmatic, self-interested reason. The user might see this as uncontroversial but insufficient for obligation. Then coordination conventions: here, conforming ensures communication works. This feels mid-level—substantive but not moral. Epistemic deference suggests locals know best, which could be defensible but contentious if the visitor has valid reasons to disagree. 

  Legitimacy is trickier. If the proverb implies the local norms are authoritative, that's a strong claim. But in political philosophy, legitimacy isn't automatic. This would be highly contentious. Expressive respect ties into hospitality and reciprocity. It's a moral reason but context-dependent. 

  The three complications are crucial. For self-application: in a loose society, the local norm might be tolerance, so "do as Romans do" could mean deviating. This exposes the proverb's ambiguity—it needs specification of which norms apply. The "which Rome" problem highlights power dynamics: strict norms dominate because deviation is more visible. The abhorrent norms issue tests limits. Most readings collapse if norms are unjust, except maybe compliance for safety. 

  I wonder which interpretation people actually mean when using the proverb to end arguments. Probably a blend of etiquette and weak obligation, avoiding deeper justification. But pressed, they might lean on expressive respect or legitimacy, which are harder to defend. 

  The user's deeper need is to equip students with tools for nuanced debate, especially when norms conflict. They want to move beyond slogans to structured analysis. Addressing power asymmetries and injustice is key here, linking to their political philosophy expertise. The social psychology angle on tight/loose societies adds empirical weight, so connecting norms to threat contexts might enrich the discussion. 

  I should ensure each reading's verdict is clear: platitude, defensible, contentious, or false. Also, distinguish between prudential vs. moral reasons. For example, compliance is prudential; expressive respect edges into moral territory. 

  Finally, emphasizing that the proverb's surface simplicity masks complexity, especially in interdisciplinary contexts where cultural norms and power intersect. Highlighting how each reading handles the complications will strengthen the user's ability to facilitate deeper discussion.
answer: |-
  Here is a disambiguation of "When in Rome, do as the Romans do," structured as a menu of distinct claims, ordered from least to most demanding, with verdicts and responses to your complications. This framework should help your group navigate the ethical and practical layers of the proverb.

  ---

  ### **The Menu of Interpretations**  
  *(Ordered from Weakest/Least Controversial to Strongest/Most Demanding)*

  1. **Conformity as Prudential Compliance (Avoiding Sanctions)**  
     - **Claim**: Conform solely to avoid negative consequences (social censure, professional penalties, legal trouble).  
     - **Nature of Reason**: Purely prudential (self-interested), not moral.  
     - **Verdict**: **Platitude** (trivially true as risk-management).  
     - **Supports Original Use?** No. The colleague’s rejection of conformity implies she accepts the risks.  
     - **Complications**:  
       - *Abhorrent Rome*: Survives if the goal is safety, but irrelevant to moral obligations.  
       - *Self-Application*: In loose societies, nonconformity may avoid sanctions (e.g., mockery for excessive formality).  
       - *Which Rome?*: Follow the norms of the dominant/enforcing subgroup.  

  2. **Conformity as Coordination Convention (Enabling Communication)**  
     - **Claim**: Norms are shared scripts enabling predictable interaction. Nonconformity disrupts communication (e.g., informal dress may signal disrespect where formality = seriousness).  
     - **Nature of Reason**: Pragmatic (etiquette-based), weakly obligatory if communication is a shared good.  
     - **Verdict**: **Defensible & substantive** (draws on theories of convention, e.g., Lewis).  
     - **Supports Original Use?** Partially. It suggests her nonconformity may impede her pedagogical goals.  
     - **Complications**:  
       - *Abhorrent Rome*: Fails if the convention upholds injustice (e.g., enforcing silence on oppression).  
       - *Self-Application*: In loose societies, rigid conformity may itself violate flexible conventions.  
       - *Which Rome?*: Prioritize conventions of the context (e.g., academic settings over street fashion).  

  3. **Conformity as Epistemic Deference (Local Knowledge)**  
     - **Claim**: Locals better understand the consequences of actions in their context (e.g., challenging a senior colleague may trigger unintended institutional fallout).  
     - **Nature of Reason**: Prudential or weak moral obligation (if harm reduction is owed).  
     - **Verdict**: **Contentious but often defensible** (empirically variable; assumes visitor’s ignorance).  
     - **Supports Original Use?** Yes, if she underestimates local sensitivities.  
     - **Complications**:  
       - *Abhorrent Rome*: Weakens if locals are complicit in/oblivious to harm (e.g., tolerating sexist norms).  
       - *Which Rome?*: Defer to those with relevant experience (e.g., junior academics vs. administrators).  
       - *Self-Application*: In loose societies, deference might require rejecting rigid external norms.  

  4. **Conformity as Expressive Respect (Reciprocity & Hospitality)**  
     - **Claim**: Conforming expresses gratitude for hospitality and respect for the community’s self-determination.  
     - **Nature of Reason**: Moral obligation (grounded in reciprocity or recognition respect).  
     - **Verdict**: **Defensible but conditional** (depends on the community’s legitimacy & the guest’s role).  
     - **Supports Original Use?** Yes, if she is a guest (not a critic or reformer).  
     - **Complications**:  
       - *Abhorrent Rome*: Collapses if norms violate core moral commitments (e.g., demeaning gendered expectations).  
       - *Self-Application*: In loose societies, conformity to tolerance norms expresses respect for local values.  
       - *Which Rome?*: Respect demands sensitivity to marginalized voices if mainstream norms are oppressive.  

  5. **Conformity as Recognition of Legitimacy (Normative Authority)**  
     - **Claim**: Local norms are morally authoritative simply because they are *theirs* (analogous to political obligation).  
     - **Nature of Reason**: Strong moral obligation (if the normative order is legitimate).  
     - **Verdict**: **Radically contentious, often false** (confuses legitimacy with existence; risks moral relativism).  
     - **Supports Original Use?** Only if local norms are independently justifiable.  
     - **Complications**:  
       - *Abhorrent Rome*: Fails utterly (e.g., no obligation to comply with apartheid norms).  
       - *Which Rome?*: Legitimacy requires democratic/just procedures, rarely met in divided societies.  
       - *Self-Application*: In loose societies, legitimacy might require rejecting authoritarian conformity.  

  ---

  ### **Addressing Your Complications**
  1. **The Self-Application Problem**  
     - The proverb is **structurally unstable** in genuinely loose societies. It implicitly assumes norms are *prescriptive* (requiring specific acts) rather than *permissive* (tolerating variance).  
     - **Resolution**: The proverb must be parameterized: "Do as the Romans expect" (if expectations are clear) or "Respect the Romans’ normative framework" (which may include tolerance).  

  2. **The "Which Rome?" Problem**  
     - **Asymmetry in Visibility**: Strict norms dominate because noncompliance is salient, while compliance with permissive norms is invisible.  
     - **Practical Grain**: The proverb drifts toward strictness absent critical effort.  
     - **Resolution**: Favor norms of the vulnerable or the context’s purpose (e.g., academic truth-seeking may override bureaucratic hierarchy).  

  3. **The Abhorrent Rome Problem**  
     - **Threshold of Injustice**: Most readings (except #1) fail if local norms are seriously unjust.  
     - **Proverb’s Plausibility**: Depends on a **suppressed premise** that local norms are *not egregiously harmful* or are reasonably acceptable.  
     - **Key Insight**: The colleague’s refusal implies she views local norms as crossing this threshold (e.g., gendered norms as demeaning).  

  ---

  ### **What People Mean When Wielding the Proverb to End Debate**  
  - **Likely Blend**: A murky fusion of #2 (coordination), #4 (respect), and unexamined assumptions about legitimacy (#5), amplified by the **asymmetry problem**.  
  - **Should They Defend It?** No—this usage avoids:
    - Specifying *which norms* matter (dress vs. truth-telling).
    - Addressing power imbalances ("whose Rome?").
    - Justifying why *these* norms deserve deference.  
  - **Underlying Motive**: Social pressure to prioritize harmony over moral scrutiny—a tendency *especially* salient in "tight" contexts.  

  ---

  ### **Recommendation for Your Colleague**  
  The proverb’s force is **contextual and defeasible**. Her obligation depends on:  
  - **Instrumental Factors**: Will nonconformity sabotage her role (e.g., teaching)?  
  - **Moral Threshold**: Do local norms perpetuate injustice or suppress truth?  
  - **Expressive Duty**: Can she dissent respectfully without betraying her values?  
  A defensible stance: *Conform minimally to enable cooperation, but resist norms that violate academic integrity or human dignity.* This rejects the proverb’s absolutism while acknowledging its pragmatic core.  

  This menu should equip your group to move beyond slogan-level debate and engage the political, psychological, and ethical dimensions of normativity across cultures.
