prompt: |-
  I sit on the panel at our council that signs off adult social-care support plans — fortnightly, a dozen or so cases a sitting, and whatever we decide goes in a file someone can challenge, so it needs to be defensible on paper and gettable in about ten minutes a case by someone with a social work degree and no philosophy.

  What we keep tying ourselves in knots over: someone says "I don't want a carer from that estate", "I'd rather not go to the day centre, that's for people worse off than me", "I don't want to be a burden on my daughter" — and we can't tell whether that's a preferance we should simply respect or a bias (internalised stigma, an expectation worn down by years of being told no) that we'd be colluding with by writing it into the plan. Overriding it feels patronising; honouring it feels like laundering a bias as a preference.

  Three tests I've been kicking around and can't get to work: substitution — if swapping in a higher-status version of the same option flips the reaction ("no carer from a professional family, they'd look down on me"), we're tracking status, not the option; who bears the cost — it counts only if they still hold it when honouring it costs them something they independently want; take-back — if the option were free, easy and nobody would know, would they take it? What makes me doubt all three is that people endorse their own adaptations sincerely, so asking them doesn't settle it either.

  Turn this into a procedure we can run: the questions in order, what counts as a good enough answer to each, where it stops with "respect it", where it stops with "that's bias, don't build it in", and where it has to hand the call to a person because it's a values question not a factual one. Say plainly which of my three tests to keep, fix or bin. Lead with the bottom line in one sentence, then the reasoning. Then run it on: a 78-year-old man refusing a male carer; a woman who'd rather have fewer hours than ask her son for help; and a resident who won't go to the day centre because "that's where they put the people with dementia" — I expect not to like what it says about at least one of those.
reasoning: |-
  Okay, let me start by really understanding the user's problem. They're on a council panel for adult social-care support plans, dealing with cases where clients express preferences that might actually be internalized biases. The challenge is distinguishing genuine preferences from harmful biases without overstepping or enabling stigma. 

  Hmm, the user mentioned three tests they've tried: substitution, cost-bearing, and take-back. But they're finding these tricky because people often sincerely believe their adaptations. So the core issue seems to be balancing respect for autonomy with preventing harm from internalized oppression. 

  I need to consider the constraints here. Each case gets only about ten minutes, and the decision must be defensible on paper by someone without a philosophy background. So whatever procedure I suggest has to be practical, structured, and quick to apply. 

  Looking at their examples: refusing a male carer, not wanting to burden family, avoiding dementia-associated day centers. Each involves potential stigma—gender norms, ageism, ableism. The procedure should flag when bias is likely without requiring deep analysis. 

  The user's deeper need might be for ethical consistency—they don’t want to collude with societal harms but also hate overriding people’s stated wishes. They might also fear legal challenges if decisions appear discriminatory or poorly reasoned. 

  I recall frameworks like autonomy vs. beneficence in bioethics. But how to simplify that into questions? The substitution test seems useful—if flipping the status changes the answer, it’s likely bias. The cost test feels ethically risky (denying care to "prove" sincerity?) so maybe drop it. The take-back test could work if rephrased hypothetically. 

  Structure-wise, a flowchart with yes/no stops makes sense. Start with substitution: if bias is indicated, probe harm vs. suffering. For harm, don’t codify; for suffering, accommodate. If substitution is negative, use take-back to check for adaptive preference. 

  For the examples: 
  - Refusing male carers: substitution test (would they accept a higher-status male?) likely fails, indicating bias. Harm risk (reinforcing sexism) means don’t write it in. 
  - Fewer hours over son’s help: substitution (if son was a daughter?) might not flip, take-back test (if easy/free) may reveal shame. High personal suffering if overridden, so accommodate with bias noted. 
  - Avoiding dementia center: substitution (if exclusive center?) flips, showing stigma. Harm to others by perpetuating hierarchy means reject. 

  User might dislike overriding the day center refusal, but the harm argument holds. Need to emphasize that "respect" sometimes means not institutionalizing their biases. 

  Final procedure: Keep substitution and take-back, bin cost test. Order: Substitution → if bias, assess harm → if no harm but suffering, accommodate with caveats. Make stops clear: "respect" after clean take-back, "reject" if harm, "escalate" if unclear values clash. 

  This should fit time constraints and leave an audit trail showing considered reasoning, not knee-jerk choices.
answer: |-
  Here's a practical, defensible procedure based on your tests, refined for clarity and ethical rigor. **Bottom line: Respect stated preferences *unless* they show clear signs of internalized bias that causes harm to the individual or others, using the Substitution Test as a primary screen and Take-Back Test for adaptive preferences.**

  **Procedure: "Bias or Preference?" Decision Tree**  
  *(Run sequentially; stop at any "RESPECT" or "REJECT" step)*

  1.  **SUBSTITUTION TEST (Status Flip):**  
      *"If we offered a higher-status/prestige version of this exact thing, would your client accept it?"*  
      - **YES → STOP & RESPECT PREFERENCE.** (e.g., "No carer from *any* estate" = genuine preference).  
      - **NO → PROCEED TO STEP 2.** (e.g., "No carer from *that* estate but *this* one is fine" = likely status-linked bias).  
      - **UNCLEAR/IRRELEVANT → SKIP TO STEP 3.** (e.g., "No male carer" – status swap may not apply cleanly).

  2.  **HARM ASSESSMENT:**  
      *"If we honour this request, does it likely:**  
      *   **(a) Cause significant harm/risk to the client? OR*  
      *   **(b) Perpetuate harmful societal bias against a protected group?"***  
      - **YES to (a) or (b) → STOP & REJECT CODIFYING PREFERENCE.** Document rationale: "Risk of harm/bias reinforcement." Offer alternatives.  
      - **NO → PROCEED TO STEP 3.** (Harm is low, but bias may cause suffering).

  3.  **TAKE-BACK TEST (Adaptive Preference Check):**  
      *"Imagine this option was free, easy, stigma-free, and no one would judge you. Would you want it then?"*  
      - **YES → STOP & REJECT CODIFYING PREFERENCE.** This is likely internalized stigma/bias. Document: "Preference appears adaptive; not core need/identity." Offer support/safe exposure.  
      - **NO → STOP & RESPECT PREFERENCE.** This seems core to identity/values. Document: "Sustained preference under ideal conditions."  
      - **AMBIVALENT/UNSURE → ESCALATE.** Values conflict needing senior SW/ethics input.

  **Your Tests Reviewed:**  
  - **KEEP & USE: Substitution Test** (Best initial screen for status-linked bias). **FIX:** Focus *only* on status/prestige flip.  
  - **KEEP & USE: Take-Back Test** (Crucial for adaptive preferences). **FIX:** Frame as a *hypothetical* ("Imagine if...") – avoids cost/immediacy issues.  
  - **BIN: Cost-Bearing Test** (Too coercive; risks punishing vulnerability. Autonomy doesn't require "payment" in suffering).

  ---

  **Applying the Procedure to Your Cases:**

  1.  **78yo man refusing a male carer:**  
      - **Substitution Test:** Offer a "high-status" male carer (e.g., ex-military nurse). If still refused → Likely not status-based. **Proceed.**  
      - **Harm Assessment:** Does refusing males cause *him* harm? Maybe (limits choice). Does it perpetuate bias? **YES** (gender discrimination). → **REJECT CODIFYING.**  
      *Rationale: Reinforces harmful gender stereotypes; protected characteristic bias. Offer female carers where possible, but don't write "no males" into plan.*

  2.  **Woman wanting fewer hours rather than ask son for help:**  
      - **Substitution Test:** If son was a wealthy, retired daughter living next door? If "no" → Proceed.  
      - **Take-Back Test:** "If asking your son was effortless and he was delighted to help, would you accept?" If "no" → **RESPECT PREFERENCE.**  
      *Rationale: Even if rooted in "burden" stigma, this is a core relational boundary under ideal conditions. Codify her choice, note potential adaptive element, offer emotional support.*

  3.  **Resident refusing day centre: "That's for people with dementia":**  
      - **Substitution Test:** Offer a "high-status" centre (e.g., exclusive club-like setting). If accepted → **Clear status-linked bias.** Proceed.  
      - **Harm Assessment:** Does this refusal harm *others*? **YES** (Perpetuates dehumanizing hierarchy against people with dementia). → **REJECT CODIFYING.**  
      *Rationale: Reinforces harmful "us vs. them" ableism. Don't validate stigma. Offer alternatives (different centre, activities) without endorsing reasoning.*

  **Why it works:**  
  - **Defensible:** Documents a logical sequence focused on harm/bias, not philosophy.  
  - **Efficient:** Focused questions; resolves most cases in Steps 1 or 3.  
  - **Autonomy-Respecting:** Rejects preferences *only* when harm/bias is clear.  
  - **Anti-Oppressive:** Explicitly names societal harm (Step 2b) as a red line.  
  - **Practical:** "Escalate" covers values clashes without paralysis. Uses your best tests, bins the problematic one.

  **You might dislike rejecting the day centre refusal** – but the procedure flags it as harmful bias *to others*, not just internalized stigma. This prevents the council from laundering discriminatory attitudes into official plans.
