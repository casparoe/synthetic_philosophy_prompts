  I need to create desiderata based on specific cases. The user mentioned several key points: the two-ship paradox, retroactivity, gradualness, no-overlap rebuild, mixed cases, social factors, scope, and which requirements conflict. They also want to know which requirements are essential and which are just biases.

  First, the two-ship scenario where both have equal claim. The theory must handle symmetric cases without arbitrariness. It should provide a principled answer without relying on future events. Then retroactivity: if one burns later, does that affect past identity? The user wants no dependence on the future but also no arbitrariness, which might conflict.

  Gradualness involves the rate of replacement. Does replacing planks slowly vs. overnight change the identity? The theory should explain why and address vagueness—whether it's semantic, metaphysical, or if cutoffs are avoidable. The no-overlap rebuild must distinguish originals from replicas, blocking pure form/function views but allowing them to matter.

  Mixed cases include different materials, partial original matter, conflicting factors. Should identity be all-or-nothing or degreed? The social layer involves registries, names, history. Should the theory align with practices, or can it challenge them? Scope: must it apply to persons and all artifacts uniformly, or can it vary?

  The user suspects some requirements conflict, like determinacy, transitivity, no future-dependence, and non-arbitrariness in symmetric cases. I need to identify where the squeeze is. Also, flagging which requirements are biases versus essential. For example, matching folk verdicts might be a bias.

  I'll outline each desideratum with a case, marking if it's required or a prejudice. Then analyze conflicts, especially between determinacy in symmetric cases, no retroactivity, and transitivity. For instance, if identity can't depend on the future, but symmetric cases need resolution, and transitivity might require future events to decide, that's a conflict. 

  For the scorecard, matter-based theories fail symmetric cases and gradualness. Form/function struggles with replicas. Continuity handles gradualness but not symmetric cases. Conventionalism avoids conflicts but makes identity subjective. Eliminativism denies persistent identity, which might not help the committee.

  The user's deeper need is a practical framework for decision-making, not just philosophy. They need clear criteria that handle real cases without infinite regress. Highlighting where theories fail can guide them to accept some indeterminacy or context-dependence. Also, emphasizing the importance of social practices might be key, as heritage often involves historical and communal values.
answer: |-
  Here’s a specification of desiderata for a theory of artifact identity-through-replacement, grounded in cases and annotated for necessity vs. prejudice. Conflicts are identified at the end.

  ---

  ### **Core Desiderata**  
  1. **Symmetric Duplication Resolution (Two-Ship Paradox)**  
     - **Case**: *The Theseus Refit Yard*: A ship (A) is repaired plank-by-plank over 40 years; removed planks are reassembled into a second ship (B). Both are completed simultaneously. Neither has temporal priority or more original matter.  
     - **Requirement**: The theory **must provide a non-arbitrary, principled answer** (e.g., based on causal continuity, function, or designated essence). It **cannot** default to "no answer" or "malformed question" without violating practical needs.  
     - **Temporal Independence**: The answer must **not depend on future events** (e.g., "whichever sinks first was never the original").  
     - **Status**: **Genuinely required** for decision-making.  

  2. **Retroactivity Exclusion**  
     - **Case**: *The Salvage Barn Fire*: After symmetric duplication (A and B), B burns in a fire 20 years later. A survives. Heritage law asks: "Was A *always* the original?"  
     - **Requirement**: Identity **must be settled at the duplication event** without retroactive revision. Survivorship cannot confer "original" status retroactively.  
     - **Conflict**: Directly opposes intuitions that "the real one persists" (a prejudice for persistence as proof).  
     - **Status**: **Genuinely required** (avoids paradoxes of backward causation).  

  3. **Gradual Replacement Invariance**  
     - **Case**: *The Slow vs. Swift Sawmill*: Ship X has planks replaced one/year over 40 years. Ship Y has all planks swapped overnight. Both end with 0% original matter.  
     - **Requirement**: The theory **must give the same verdict** for both cases if total replacement is identical. If verdicts differ, it **must explain why rate matters** (e.g., psychological continuity vs. metaphysical thresholds).  
     - **Vagueness Handling**: It **must reject sharp cutoffs** (e.g., "51% = original, 49% ≠"). It may attribute vagueness to **semantics** (language imprecision) or **metaphysics** (indeterminate objects), but **cannot ignore gradualness**.  
     - **Status**: **Genuinely required** (empirical reality demands continuity).  

  4. **Anti-Replication Condition**  
     - **Case**: *The Dockyard Twin*: A new ship (C) is built from new timber to the same design as original Ship O, moored beside it. No shared parts or causal history.  
     - **Requirement**: C **must be deemed non-identical** to O, blocking theories that *solely* rely on form/function. Form/function may contribute but **cannot suffice** without causal-historical linkage.  
     - **Status**: **Genuinely required** (prevents absurd equivalence of replicas and originals).  

  5. **Degree Tolerance vs. Binary Constraint**  
     - **Case**: *The Hybrid Engine*: A steam locomotive has 60% original parts, but the replaced 40% uses aluminum (not iron), altering function (faster but weaker).  
     - **Requirement**: The theory **must specify whether identity is binary (yes/no) or degreed**. If binary, it **must separate identity from "value"** (e.g., "O is identical but less historically significant"). If degreed, it **must quantify thresholds** (e.g., "70% matter + function = 0.8 identity").  
     - **Status**: **Open** (either approach is acceptable if consistent).  

  6. **Social Practice Accountability**  
     - **Case**: *HMS Victory's Registry*: A ship bears the name/Nelson’s battle log/insurance ID. After restoration, does it retain these institutional attributes?  
     - **Requirement**: The theory **must engage with social practices** (registry, naming, legal identity). It may:  
       - **(a)** Align with them (e.g., "the insured object is the original"),  
       - **(b)** Critique them (e.g., "society misidentifies the replica"), or  
       - **(c)** Treat social facts as constitutive.  
       **Silence is a cost**.  
     - **Status**: **Genuinely required** (artifacts are socially embedded).  

  7. **Scope Limitations**  
     - **Case**: *The Codebase & The Charter*: A software codebase has every line rewritten; a university operates under its 3rd charter since 1200 AD.  
     - **Requirement**:  
       - **(a)** **Not required** to cover persons (optional extra credit).  
       - **(b)** **Must be uniform** *or* **explain differences** across artifact kinds (e.g., "ships rely on matter, institutions on legal continuity").  
     - **Status**: **Genuinely required** for artifact-specificity.  

  ---

  ### **Conflict Analysis: The Inconsistent Tetrad**  
  These four desiderata **cannot all be satisfied simultaneously**:  
  1. **Determinacy**: Symmetric cases (Desideratum 1) require a unique answer.  
  2. **Non-Arbitrariness**: The answer cannot rely on brute facts (e.g., "A wins by coin flip").  
  3. **No Future-Dependence**: Identity settled at duplication (Desideratum 2).  
  4. **Transitivity**: If A=B (original) and B=C (after repair), then A=C.  

  **The Squeeze**:  
  - In symmetric duplication, if A and B are both candidates:  
    - **Without future-dependence**, we must choose *now* (Desideratum 2).  
    - **Without arbitrariness**, we need a principled reason (Desideratum 1).  
    - But if we later discover B decays faster than A, **transitivity + determinacy** might force us to say B was *never* original—violating **no retroactivity**.  
    - If we allow "both are original," we violate **determinacy** (one identity cannot be two objects).  

  **Knockout Requirement**: **Symmetric Duplication Resolution** (Desideratum 1). It forces theories into retroactivity (violating Desideratum 2) or indeterminacy (violating determinacy).  

  ---

  ### **Suspect "Prejudices"**  
  - **"Folk Verdict Vindication"**: Prejudice for matter-based views. Cases like *Grandpa’s Axe* ("still the same axe!") ignore formal/causal shifts.  
  - **"Persistence as Proof"**: Prejudice in retroactive cases (Desideratum 2). Survival ≠ always-being-original.  
  - **"Form/Function Sufficiency"**: Prejudice of design-centric views. Blocked by Desideratum 4 (Dockyard Twin).  

  ---

  ### **Theory Scorecard (Brief)**  
  | **Theory**               | **Passes**          | **Fails**               |  
  |---------------------------|---------------------|-------------------------|  
  | **Matter-Based**          | Anti-Replication (4) | Symmetry (1), Gradualness (3) |  
  | **Form/Function**         | Gradualness (3)     | Anti-Replication (4)    |  
  | **Causal Continuity**     | Gradualness (3)     | Symmetry (1)            |  
  | **Spatiotemporal Path**   | Retroactivity (2)   | Symmetry (1)            |  
  | **4D/Temporal Parts**     | All cases           | Social Practice (6)*    |  
  | **Conventionalism**       | All                 | Non-Arbitrariness (1)** |  
  | **Eliminativism**         | —                   | All practical needs     |  

  *\*4D: Social attributes may attach to improper temporal parts.*  
  *\*\*Conventionalism: Symmetric cases resolved by fiat, not principle.*  

  ### **Recommendation**  
  A **causal-historical theory** (prioritizing continuous existence + intentional maintenance) + **conventional elements** (for social attributes) best balances most desiderata—but stumbles on symmetric duplication. For your committee: **admit indeterminacy in symmetrically split cases**; use policy (e.g., "the continuously maintained candidate") to break ties. No theory escapes unscathed.
