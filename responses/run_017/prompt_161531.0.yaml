prompt: |-
  Not sure this is the right sort of thing for this folder, but I'll try it. I'm retired now — was a geomicrobiologist, spent most of my career on things living in rock where they had no business living — and since I stopped I've been going to a philosophy of science reading group and reading the astrobiology literature properly for the first time. There's a move I keep running into in it that I don't have a word for, and I want to know whether somebody has already named it.

  The shape of it: people keep finding life in places that were supposed to be impossible — depths, pressures, salt concentrations, radiation doses, pH values that used to get called sterile, soils that get one wet day a decade. Each of these findings gets used to widen the map of where life can be. That's just learning, fine. But look at what the widening does to the numbers. It does two things at once. It makes "there is life elsewhere" more probable before you look, because there's more real estate and more ways of getting started. And it makes any particular failed look less informative, because the instruments were built to recognise the chemistry we knew about before we widened. So one and the same update is spent as credit on the prior and never charged against the test.

  The case that made me write this down: a sample comes back from somewhere promising — an icy moon's plume, a Mars-analogue core, whatever — and there's nothing in it anyone wants to call a biosignature. I'd have expected people to come out of that saying the probability for that body went down. Instead you get that it's "not constraining": wrong spot, wrong depth, one pass on one day, our kit only knows Earth chemistry, a metabolism we haven't thought of would leave something we wouldn't recognise. All of which is probably true. But it's the same consideration that made the prior go up, and it never seems to cost anything. And it cuts both ways: the Viking soil result from the 70s that looked positive got explained away as odd chemistry, and loosing that one didn't cost anything either.

  What I'd like isn't a label, and please don't give me a reading list, I can't be doing with chasing papers. I want the carving: what exactly is this, and where does it stop? Specifically the bits I can't sort out —

  Is it just unfalsifiability? It doesn't feel like it, because I can think of an outcome that would sink the hypothesis: a long-lived, energy-rich, properly sampled environment with nothing in it. It isn't that nothing could refute it. It's that the set of outcomes that would refute it keeps shrinking at the same time as the prior keeps rising.

  Is it just moving the goalposts, or special pleading? Also wrong-sounding, because the widening gets done in daylight, for reasons everybody accepts, and each individual step is one I'd have agreed to myself. (I remember being told off for being a carbon chauvinist, and fair enough.)

  Is it just "absence of evidence isn't evidence of absence"? That one's about a single inference; what I keep seeing is cumulative and gets worse each round.

  Is it confirmation bias or disconfirmation bias? Maybe, but those are claims about the psychology of the people doing it, and I think you could get exactly this pattern out of careful, honest people who are doing their best.

  I also tried writing it out in Bayes terms and got muddled: raising the prior and flattening the likelihood ratio pull in opposite directions, and I can't see in general which one wins, or whether it depends on something about where in the space you are.

  So: does this thing have a name, in philosophy of science or formal epistemology or anywhere else? I gather medicine and ecology have their own versions of it — widen a case definition and then act surprised that prevalence went up and the test looks worse. If there are two or three near neighbours, tell me which fits and how the others differ from it. If there genuinely isn't one, give me one: define it, and give me the edges — one case that's clearly the bad version, one that's clearly the legitimate version, because surely there is a legitimate version, sometimes you really should widen the target and it shouldn't count against you. And tell me what someone who wanted not to do it would have to commit to in advance, before seeing the result. That last bit is the part I actually want.
reasoning: |-
  Okay, let me unpack this user's query. They're a retired geomicrobiologist who's noticed a pattern in astrobiology where each discovery of extremophiles expands the habitable zone, increasing the prior probability of extraterrestrial life while simultaneously making negative results less meaningful. The user wants to know if there's a term for this phenomenon and how to differentiate legitimate scientific updates from problematic reasoning.

  First, I need to understand the core of their concern. It's about how the same evidence is used to adjust both the prior and the interpretation of tests, which seems to protect the hypothesis from being falsified. They mentioned examples like Viking soil results and icy moon samples. Their main questions are whether this is unfalsifiability, moving goalposts, or something else, and how to set boundaries.

  I recall concepts in philosophy of science like the Duhem-Quine thesis, where hypotheses can't be tested in isolation because auxiliary assumptions can always be adjusted. This seems relevant. Also, the problem of underdetermination, where multiple theories can explain the same data. But the user's scenario is more specific—it's about the definition of the search space itself changing.

  Then there's Bayesian updating. When we expand the range of possible life (increasing the prior), but also make the likelihood of detecting it lower (since instruments may miss novel life), these two factors oppose each other. The net effect isn't clear without concrete numbers. This might explain why negative results don't always decrease the probability as much as expected.

  The user also mentioned epidemiology parallels. When disease definitions broaden, prevalence increases but test sensitivity drops. This is similar to the base rate fallacy or criterion creep. In astrobiology, each expansion of "habitable" criteria acts like criterion creep, making it harder to falsify the hypothesis.

  I think the closest term is "criterion creep," especially in diagnostic contexts. But "epistemic inflation" might be a better fit for this case. It captures the idea that the boundaries of what's possible keep expanding, inflating priors while deflating the significance of negative results.

  To differentiate legitimate vs. problematic uses: Legitimate when expansions are based on robust evidence (e.g., actual extremophile discoveries). Problematic when expansions are ad hoc to save a hypothesis from falsification. The key is precommitment: scientists should define what would falsify the hypothesis before data collection, including detection limits and alternative explanations.

  The user needs practical steps to avoid this pitfall. Pre-specifying exclusion zones and detection capabilities is crucial. For example, stating "No microbial metabolism in this environment would go undetected by our method" ahead of time. That way, negative results can meaningfully update the probability.
answer: |-
  Your description brilliantly captures a sophisticated epistemic phenomenon that *doesn't* have a single universally agreed-upon name, but is well-recognized. The closest established concept is **"Problem of Evidential Defeasibility" amplified by "Domain Expansion"**, often manifesting as **"Criterion Creep"** in diagnostic fields. However, "epistemic inflation" might be the most precise new label for *your specific pattern*.

  Let's carve it:

  1.  **The Core Mechanism:** It's the **conflation of expanding the *scope* of a hypothesis with updating the *strength* of evidence for its core claim**. Specifically:
      *   **Domain Expansion:** Discovering life in "impossible" environments (`E1, E2, E3...`) expands the *domain* of possible habitats (increases the "real estate" prior for life *in general*).
      *   **Likelihood Dilution:** This expansion *simultaneously* increases the number of ways life *could exist but evade detection* (`¬D1, ¬D2, ¬D3...`) in *future* searches using instruments tuned to older paradigms. This flattens the likelihood function (P(No Detection | Life Present)).
      *   **Asymmetric Update:** Positive detections (`D_new` in a new `E_new`) are treated as *direct evidence* strengthening the core hypothesis ("Life is robust!"). Negative results (`¬D` in some environment `E_target`) are explained away by invoking the *very domain expansion* that the positive detections provided ("Our instruments wouldn't see *this* kind of life!").

  2.  **Why it's not *quite* the usual suspects:**
      *   **Not simple unfalsifiability:** You're right, a truly sterile, energy-rich, well-sampled environment *could* falsify it. The problem is the *evolving standards* for what counts as "sterile" and "well-sampled". The *conditions for falsification* are moving.
      *   **Not just moving goalposts/special pleading:** While related, these imply *ad hoc* or dishonest shifts. Your case involves *rational, evidence-based* domain expansion. The issue is the *consequence* of that expansion for interpreting *other* evidence.
      *   **Not just "absence of evidence ≠ evidence of absence":** This aphorism is about a *single* test. Your pattern is *iterative*: each expansion of the domain *retroactively* weakens the evidential weight of *past* and *future* null results against the *core* hypothesis.
      *   **Not (just) confirmation/disconfirmation bias:** While bias can exacerbate it, the pattern emerges logically from the interaction of domain expansion and detection limitations, even with perfect objectivity. It's a structural feature of the inference process.

  3.  **The Bayesian Tangle:**
      *   `P(Life Elsewhere | Evidence) ∝ P(Evidence | Life Elsewhere) * P(Life Elsewhere)`
      *   **Domain Expansion:** Discovers `Life in E_new`. This increases `P(Life Elsewhere)` (the prior) because the set of possible habitats grows.
      *   **Likelihood Dilution:** This discovery also reveals a *new way* life could exist but evade detection in `E_target` (e.g., novel chemistry). This *decreases* `P(No Detection in E_target | Life Present in E_target)`.
      *   **Net Effect on Negative Result:** When you get `No Detection in E_target`:
          *   The *increased prior* (`P(Life Elsewhere)`) pulls towards *less* reduction in belief.
          *   The *decreased likelihood* (`P(No Detection | Life Present)`) pulls towards *more* reduction in belief (because if life *were* present, your test is *more likely* to miss it now than before the domain expansion).
      *   **Which Wins?** It depends *crucially* on the *magnitude* of the domain expansion relative to the magnitude of the likelihood dilution, and the *initial* prior/likelihood. There's no general answer. *This ambiguity is what allows the "not constraining" interpretation to feel plausible, even if mathematically it might sometimes be an under-adjustment.*

  4.  **Names & Near Neighbours:**
      *   **Criterion Creep (Epidemiology/Ecology):** Broadening diagnostic criteria increases measured prevalence (prior ↑) but often reduces test specificity (making true negatives harder to confirm). *Exactly analogous to your case.*
      *   **Duhem-Quine Thesis (Philosophy):** Hypotheses cannot be tested in isolation; they come with a bundle of auxiliary assumptions. A failed prediction can always be blamed on an auxiliary assumption rather than the core hypothesis. *Your case is a specific instance:* the "auxiliary assumption" being the *completeness of our understanding of possible life forms/habitats* is constantly being revised based on discoveries *elsewhere*.
      *   **Problem of Underdetermination (Philosophy):** Evidence alone cannot uniquely determine which theory is correct; multiple theories can fit the same data. *Related, as domain expansion increases the number of theories (life forms) compatible with a null result.*
      *   **Epistemic Inflation (My proposed label for *your* pattern):** The iterative process where evidence justifying an *expansion of the conceptual domain* of a phenomenon (life's possible forms/locations) simultaneously *erodes the probative value of negative results* regarding the *existence* of that phenomenon in specific sub-domains, leading to a net reinforcement of the core belief ("life is everywhere") without commensurate risk from failure to detect it in specific searches.

  5.  **Legitimate vs. Problematic: The Edges**
      *   **Legitimate (Domain Expansion Properly Handled):**
          *   *Case:* Discovering robust microbial communities in deep subsurface granite fractures (your old field!). This *rationally* expands the potential habitable zones on Mars or icy moons (prior ↑). When a Mars rover fails to detect life in a specific surface layer, scientists *correctly* note this null result doesn't rule out life deeper down (which we now know is plausible) *or* life using the specific chemistries we were testing for. *Cost:* The null result *does* slightly reduce the probability of life *in that specific surface layer, using the metabolisms we tested for*. It also highlights the *need for new instruments/drilling* to probe the expanded domain. The *core* prior (life elsewhere) only increases based on the *direct discovery*, not used to *completely* defang the null result.
      *   **Problematic (Epistemic Inflation):**
          *   *Case:* After multiple extremophile discoveries widen the "habitable" concept, a probe returns a meticulously analyzed, deep, energy-rich, water-containing sample from Enceladus with *zero* organics, chiral imbalances, isotopic fractionation patterns, or microscale structures – nothing resembling *any* known biotic or abiotic process in that context. Instead of concluding this *specific* environment looks sterile *based on everything we know*, the dominant response is: "This proves nothing! Life there could use *entirely novel* silicon-based chemistry/quantum entanglement/metabolism leaving *no* trace we recognize! Our instruments are blind to *true* alien life!" *Cost:* The *same* discoveries used to raise the prior are now invoked to *completely* negate the evidential weight of a sophisticated null result. The domain expansion isn't just increasing the prior; it's being used to reduce the likelihood P(Null Result | Life Present) to near zero *in hindsight*, preventing any meaningful Bayesian update downward. The core hypothesis becomes effectively immune to negative evidence from *any* specific location.

  6.  **How to Avoid It: The Precommitment**
      To prevent epistemic inflation, scientists *must* commit *in advance* of a search to:
      *   **Define "Sterile":** What specific, concrete findings (or lack thereof) in *this specific environment*, using *these specific instruments*, would constitute strong evidence *against* the presence of life *as we currently understand it*? (e.g., "Absence of complex organics > C10, absence of redox disequilibrium beyond X threshold, absence of microscale compartmentalization...").
      *   **Define the "Unexplored Frontier":** Acknowledge *explicitly* the *current* boundaries of the "possible life" domain. What *existing, specific* extremophile examples or theoretical models *already* suggest life *could* exist here but evade *this specific search* (e.g., "Like deep subsurface chemolithotrophs, life might exist below our drill depth")? This carves out the "known unknowns" *before* the data comes in.
      *   **Pre-Specify "Game Over" Conditions:** What *combination* of negative results across *multiple, diverse* searches (e.g., no organics, no disequilibrium, no structures, no metabolic signatures across different instruments/sites/depths on Mars) would lead to a *significant* reduction in the prior for life on Mars *specifically*? This forces engagement with what *would* falsify the local hypothesis.
      *   **Isolate the Update:** When a discovery *elsewhere* expands the domain (raising the general prior), *explicitly state* how this discovery *specifically* alters the likelihood of detection *in the target environment* for *future* searches. Don't retroactively apply it to *past* null results unless it directly addresses their *specific* limitations.

  **In essence:** The phenomenon is the **iterative, evidence-based expansion of a hypothesis's domain of possibility ("life can exist in X conditions") being used to simultaneously increase the prior probability of its core claim ("life is likely elsewhere") *and* to decrease the evidential impact of negative results probing specific instances within that expanding domain ("we didn't find it here, but that doesn't count because life could be Y")**, where the reduction in likelihood weight is not adequately accounted for. **"Epistemic Inflation"** captures this self-reinforcing, domain-expanding erosion of falsifiability. Avoiding it requires rigorous precommitment to what constitutes disconfirming evidence *within the current paradigm* before the data arrives.
