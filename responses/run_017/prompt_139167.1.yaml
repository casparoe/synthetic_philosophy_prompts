  First, mapping the utterances to the standard assertion-based view:
  - The January 17 deposition denials ("sexual relationship/affair/relations") under oath clearly fit the defensive literalism pattern. Clinton exploited the narrow legal definition to avoid technically false assertions while intending deception. This feels like misleading rather than lying under traditional definitions, but the oath complicates it.
  - The January 26 public denial ("I did not have sexual relations with that woman") is trickier. No oath, but identical wording to the deposition. The public likely took "sexual relations" colloquially, making this arguably a lie to them while remaining literally true to legal insiders. Two-audience problem jumps out here.
  - The grand jury testimony is fascinating - tense games ("was" vs "is") and denial of "improper relationship" after admitting the affair privately. Tense manipulation feels like a new flavor of misleading distinct from definitional games.

  Now the user's original concepts:
  Defensive literality - this is clever. The premeditated escape-hatch wording does seem distinct from spontaneous misleading. It's not just extra-step lying because the speaker preserves literal truth intentionally, but the deceptive intent is baked into the phrasing choice. Maybe this exposes a gap in theory? 

  Two-audience problem - absolutely wrecks the binary distinction. For the January 26 statement: lie to public (they inferred false belief), misleading to lawyers (they spotted the dodge), and literally true to Clinton himself. The moral weight must differ per audience - violating public trust vs gaming a legal system.

  Hearer-responsibility in adversarial contexts - crucial point. In depositions, the questioner's failure to pin him down might reduce Clinton's culpability for misleading compared to deceiving a trusting friend. But the oath creates a positive duty of candor that ordinary conversation lacks. So the wrong is institutional betrayal more than interpersonal deception.

  Finally, the corruption-of-literal-meaning argument: this terrifies me intellectually. If defensive literalism becomes normalized, we lose the social utility of literal truth as a cooperative baseline. A detectable lie causes discrete harm; this slowly poisons communication itself. But is this really worse? Maybe not - lies destroy specific truths, this destroys truth-tools. Both catastrophic differently.

  Where theory is silent: 
  - The premeditated architecture of defensive literalism 
  - Multi-audience utterances with conflicting interpretations 
  - Institutional duties beyond veracity (candor vs minimal compliance)

  The user's instinct feels right - legal/political contexts stretch speech ethics until they groan. Maybe misleading isn't one category but many, each with distinct moral contours. The Clinton case becomes a monster that reveals the theory's seams.
answer: |-
  Here's a mapping of Clinton's utterances to the lying/misleading distinction, incorporating your concepts and questions, strictly based on the facts provided:

  ### 1. **January 17, 1998 Deposition (Under Oath)**
     - **Denial of "sexual relationship," "sexual affair," or "sexual relations" under a stipulated legal definition**:
       - *Lying or Misleading?* **Misleading (not lying)** under standard assertion-based view.  
         - He avoided asserting falsehoods by exploiting the narrow definition (e.g., "receiving oral sex isn't covered").  
         - **Defensive literality applies**: The wording was chosen precisely for deniability if evidence emerged.  
       - *Moral Weight*:  
         - **Intent to deceive is inherent in defensive literality**. Choosing words *for* plausible deniability satisfies intent-to-deceive, making this morally equivalent to lying in this context.  
         - **Oath matters**: The sworn setting imposes a duty of candor beyond literal truthfulness. Misleading violates the spirit of the oath, even if technically compliant.  

  ### 2. **January 26, 1998 Televised Statement (No Oath)**
     - **"I did not have sexual relations with that woman"**:
       - *Lying or Misleading?* **Context-dependent**:  
         - To the **public**: Likely a **lie**. Colloquial "sexual relations" includes oral sex; he knew his denial would be interpreted this way.  
         - To **legal observers**: **Misleading** if they recalled the deposition definition.  
       - **Two-audience problem**:  
         - Yes, one utterance can be a lie to Audience A (public) and misleading to Audience B (legal insiders).  
         - **Theory must add an audience parameter**. The lying/misleading distinction fractures when audiences have divergent background knowledge. Moral culpability differs per audience.  

  ### 3. **August 1998 Grand Jury Testimony (Under Oath)**
     - **Tense-based defense ("depends on what 'is' is") and denial of "any improper relationship"**:
       - *Tense defense*: **Misleading** (not lying). "There *is* no relationship" could be literally true if the affair had ended, though pragmatically deceptive.  
       - *Denial of "improper relationship"*: **Likely lying**. After admitting the relationship, this assertion is false under any reasonable interpretation.  
       - *Moral Weight*:  
         - **Defensive literality fails here**. Tense games are transparent evasions in a sworn setting, heightening culpability.  

  ---

  ### Evaluating Your Concepts
  1. **Defensive Literalism**:  
     - **Not a third category; it’s misleading with premeditated intent**.  
     - Choosing words *for* deniability **is intent to deceive**, collapsing into lying’s moral weight in sworn contexts (as Judge Wright’s contempt ruling implies).  
     - **Social harm argument holds**: Defensive literality *is* worse than outright lies in institutional settings. Lies can be disproven; literalism corrodes trust in language itself by making literal truth a weapon. Legal systems (and democracy) rely on literal meaning as a shared baseline—exploiting this is institutional sabotage.  

  2. **Two-Audience Problem**:  
     - **Requires an audience parameter in the theory**.  
     - The distinction **survives but becomes messier**:  
       - *Lying* = asserting falsehood to a specific audience.  
       - *Misleading* = implying falsehood without asserting it, *for that audience*.  
     - Clinton’s Jan. 26 statement is a lie to the public but misleading to lawyers. Moral wrong is amplified when deceiving a vulnerable audience (e.g., public trust vs. adversarial lawyers).  

  3. **Hearer Responsibility in Adversarial Settings**:  
     - **Misleading is less culpable than lying *if* the questioner fails to clarify**, but **the oath flips this**.  
     - Under oath, the speaker has a **duty of candor** (volunteering clarity, not just avoiding lies). Evasion via literalism breaches this duty.  
     - **Wrong is institutional**: The oath transforms deception into a breach of procedural integrity, distinct from deceiving a friend. A trusting friend assumes good faith; a deposition questioner assumes evasion but relies on institutional penalties to enforce honesty.  

  ---

  ### What the Case Does to the Theory  
  - **The lying/misleading distinction breaks in legal/political contexts**. These settings are **non-cooperative**: Language becomes a tactical weapon, not a truth-seeking tool.  
  - **Misleading isn’t one category**:  
    - *Defensive literality* (deposition) exploits definitions.  
    - *Tense manipulation* (grand jury) exploits context.  
    - *Ambiguity* (Jan. 26 statement) exploits audience divergence.  
  - **Theory’s blind spots**:  
    - **Institutional duties** (oaths) create positive obligations beyond not lying.  
    - **Premeditated evasion** (defensive literality) needs a distinct moral category—it’s fraud-by-language.  
    - **Social harm** of corrosive literalness isn’t captured by interpersonal deception models.  

  **Conclusion**: Defensive literality is morally worse than lying in sworn settings because it undermines institutional truth-telling. The two-audience problem forces a relativist view of deception. Hearer responsibility *reduces* culpability only if no oath exists; under oath, evasion is a unique institutional wrong. The case shows the distinction is fragile outside cooperative dialogue—**misleading isn’t "less bad" when it weaponizes literal truth**.
