prompt: |-
  I sit on the grants committee of the Marchbank Foundation, which makes five-year, high-risk programme grants in basic science. Our charter commits us to funding work that would not survive a conventional peer-review panel, and it instructs us to fund 'science' without ever saying what would fail that description. Because we expect most of what we fund to be wrong, a failed prediction has never by itself been a reason to stop paying. Lately, though, three of us have started to suspect that we are making demarcation decisions case by case while pretending to be making only judgments of quality, and the current renewal has forced the question.

  The renewal is the Kestrel Programme (PI: Dr. Amara Okoye), which claims that a specified class of rapid behavioural adaptations across taxa is produced by a single heritable mechanism. I will summarise its record in the terms we have been using, because the disagreement turns on how to describe it:

  1. In year 1 it predicted an effect nobody had looked for, in a species nobody had studied, with a directional and roughly quantitative specification; the effect was found about as predicted.
  2. In year 2 it predicted a parallel effect in a second taxon; the result was null, in a study with adequate power by our own statistical consultant's review.
  3. Its response to (2) was a new auxiliary hypothesis about a gating condition. That auxiliary had consequences nobody had tested; in year 3 an independent group tested one of them and confirmed it.
  4. In year 4 it predicted a third effect. The estimate came out with the opposite sign to the prediction.
  5. Its response to (4) was a revision of the model's mathematical form that introduces a free parameter able to absorb either sign, offered without a new test. When the year-1 effect was independently replicated this year at roughly a third of the predicted magnitude, the PI said the mechanism constrains the existence and direction of the effect but not its size.
  6. The programme now states its core claim as: the mechanism is whatever produces the observed pattern of rapid adaptation in this class.

  Our own precedents, which we have never written down: we renewed a programme with one failed headline prediction because it had produced two confirmed predictions made before the relevant data existed and had declared in advance which auxiliary assumptions it would allow itself to revise; we declined to renew a programme with no failed predictions at all, on the grounds that its central claim had been restated three times to fit whatever data appeared; and we declined a programme whose only empirical successes were accommodations of facts already known when the prediction was framed.

  For the last cycle we have been drafting an instrument we call the Auxiliary Register: before data collection a grantee files the predictions it will count as tests, the auxiliary hypotheses it may revise without supplying a new test, and — for each such permitted revision — one further consequence to be tested inside the funding period. I have proposed adding a hostile-design clause, under which the programme must nominate one result it would concede to be refuting, and a designated critic from outside the programme must certify that the test could actually produce that result. The Kestrel Programme predates the Register and has nothing on file.

  We are split three ways: renew outright (the record looks like a healthy programme absorbing punishment, and item 3 is the sort of thing we exist to fund); decline (items 5 and 6 are the pattern we said was disqualifying in the precedent above, and the freedom to disown effect sizes makes item 1 weaker evidence than it looked); renew with conditions. Our colleague Professor Densmore argues that the whole exercise is incoherent — that no programme has ever been abandoned on a refutation, that every celebrated historical success involved protecting a core claim with auxiliaries, and that a Register is just an unfalsifiability test wearing a lab coat.

  Draft the decision memo I will circulate on Thursday, 900–1,200 words, addressed to the committee with a copy of the operative conditions going to Dr. Okoye. It should: state a single recommendation — renew, decline, or renew with conditions — in the first two sentences; say how you are classifying this record and why, using our three precedents rather than general philosophy; specify the conditions, if any, as things a working scientist could actually comply with, with dates and a decision gate; state whether the Register and the hostile-design clause should be applied to this programme retroactively, and what fairness requires either way; and give the strongest version of the argument against your own recommendation — Densmore's or another — in a form its supporters would recognise, before saying why it does not carry, or what in the recommendation it should change. Please do not cite literature or supply references; argue the case from the record and the precedents as I have given them.
reasoning: |-
  Okay, let me approach this systematically. The user is a grants committee member facing a complex decision about the Kestrel Programme renewal, and they need a formal memo that balances scientific rigor with their foundation's unique high-risk mandate. 

  First, I need to understand the core tension: the foundation exists to fund unconventional science where failure is expected, but now faces a programme showing mixed results with potential demarcation issues. The user has provided clear precedents and a detailed record, which suggests they want concrete application of their institutional history rather than abstract philosophy.

  Hmm... the three precedents are crucial here. The renewed programme had clear predictive successes and transparency about auxiliaries; the declined ones showed either ad-hoc adjustments or lack of novel predictions. Kestrel's record has elements of both - the year 3 independent confirmation is gold-standard high-risk science (precisely what the foundation loves), but items 5 and 6 resemble the disqualifying precedent where core claims were repeatedly reframed.

  The Auxiliary Register proposal feels like a red herring for this case - applying it retroactively would be unfair, but mentioning it in conditions for renewal bridges the gap. Densmore's critique is valid but incomplete; Lakatosian research programmes do use protective belts, but they also progress empirically. The foundation's mission accepts protective maneuvers as long as they generate testable novel predictions - which Kestrel did in year 3.

  *scribbles mentally* The memo must open decisively. "Renew with conditions" is the only position that honors both the predictive success in year 3 (their raison d'être) and the concerning pattern in year 5-6. The conditions need teeth: pre-registration of auxiliaries and a hostile-design clause to prevent endless elasticity, but with realistic deadlines and PI consultation. 

  Ah - fairness is key. The Register can't apply retroactively, but requiring it now is reasonable. Densmore's argument gets strongest play in paragraph 4: if even foundations for "wrong" science demand falsifiability, they might stifle genius. But the foundation's precedents already draw that line - their declined cases show ad-hoc adjustments without progress. Kestrel gets leeway because its auxiliary generated new confirmed predictions (item 3), unlike the purely accommodative precedent.

  *checks word count* The conditions section must be surgical: 90 days to file an Auxiliary Register with the hostile-design clause, and binding pre-registration for the renewal period. That gives Okoye clarity while preventing future ambiguity. The "concede as refuting" requirement directly addresses the year 5 elasticity concern.
answer: |-
  ## MEMORANDUM  
  **TO:** Marchbank Foundation Grants Committee  
  **FROM:** [Your Name/Title], Grants Committee Member  
  **DATE:** Thursday, [Date]  
  **SUBJECT:** Recommendation on Kestrel Programme Renewal (PI: Dr. Amara Okoye)  

  **Recommendation:** I recommend renewal of the Kestrel Programme for its final funding period, subject to binding conditions. This decision acknowledges the programme’s high-risk nature and significant novel predictive success, while addressing concerns about methodological elasticity through enforceable safeguards tied directly to its future work.  

  **Classification of the Record and Precedents:**  
  The Kestrel record presents a hybrid case under our precedents, demanding a nuanced application rather than a binary outcome.  

  1.  **The Case for Renewal (Precedent: Programme with One Failed Headline Prediction):**  
      *   **Year 1** stands as a strong, novel predictive success – a directional and quantitative prediction in an untested species/system. This aligns precisely with the high-risk, high-reward science our charter prioritizes. It mirrors the predictive strength that justified renewal despite a failure in our first precedent.  
      *   **Year 3** is particularly compelling. The programme generated a *novel auxiliary hypothesis* with *untested consequences*. The independent confirmation of one consequence *after* the auxiliary was proposed (even if not pre-registered) is evidence of generative theoretical power. This is the "sort of thing we exist to fund" – a novel insight emerging from engagement with data, leading to a *new*, independently confirmed prediction. This significantly outweighs the Year 2 null result.  

  2.  **The Case for Concern (Precedent: Programme Restating Core Claim to Fit Data):**  
      *   **Year 5** is problematic. Revising the model's mathematical form *post-hoc* to absorb the opposite sign observed in Year 4, *without* an immediate new test, echoes the concerning pattern in our precedent where core claims were restated to fit data. The dismissal of the replicated Year 1 effect magnitude (only direction matters) further weakens the initial predictive success and introduces significant flexibility.  
      *   **Item 6** ("the mechanism is whatever produces the observed pattern") risks collapsing into the very pattern we deemed disqualifying – a core claim so adaptable it becomes unfalsifiable through accommodation. While not yet a full restatement, it points perilously close to that precedent.  

  This record is distinct from the declined programme with only accommodations of known facts – Kestrel demonstrably generated *novel* predictions (Year 1, Year 3 consequence). However, the trajectory from Year 4 and 5, culminating in Item 6, raises a serious red flag under our third precedent regarding core claim malleability. Renewal cannot be unconditional.  

  **Conditions for Renewal:**  
  Renewal is contingent upon Dr. Okoye accepting and complying with the following conditions, designed to be operationally feasible for a working scientist and to directly address the identified risks:  

  1.  **Immediate Auxiliary Register Filing:** Within **90 days** of renewal notification, the Kestrel Programme must file a completed Auxiliary Register with the Committee. This Register *must* include, for its planned work during the final funding period:  
      *   **Specific Predictions:** At least two (2) concrete, directional, and falsifiable predictions derived from the *current* model (as defined at renewal) that will be tested as primary programme outcomes. These must specify expected effect sizes and relevant taxa/systems.  
      *   **Permitted Auxiliary Revisions:** A defined list of auxiliary hypotheses that may be revised if predictions fail, *without* requiring a new immediate test.  
      *   **New Test Obligation:** For *each* permitted auxiliary revision listed, *one* specific, novel, and testable consequence must be stated. This consequence *must* be tested and results reported to the Committee **before the end of Year 4** of the renewed grant period.  
      *   **Hostile-Design Clause:** The programme must nominate **one specific, quantifiable experimental or observational result** (related to a core prediction or a key auxiliary) that it would concede as *refuting* its core mechanistic claim as currently stated. This nomination requires **certification by a designated external critic** (agreed upon by the PI and Committee within 60 days of renewal) who must attest that the nominated test is methodologically sound and *could* realistically produce the refuting result. The critic will review the test design *before* data collection begins.  

  2.  **Decision Gate:** Compliance with the 90-day filing deadline and adequacy of the submitted Register (as judged by the Committee Chair and Foundation Director, with recourse to the full Committee if disputed) is a **binding condition for the release of Year 2 funding** of the renewed grant. Failure to meet this condition, or to submit an adequate Register, will result in automatic termination of funding at the end of Year 1 of the renewal period.  

  **Application of the Auxiliary Register & Fairness:**  
  The Auxiliary Register requirements and Hostile-Design Clause **cannot fairly be applied retroactively** to past Kestrel work. The programme predates this instrument, and applying it now to judge past actions would violate principles of procedural fairness. However, it is **entirely fair and necessary to impose these requirements prospectively** as a condition for *future* funding. The Kestrel Programme is requesting renewal; it is reasonable to expect adherence to the Foundation's evolving governance tools for the work we are being asked to fund *next*. This ensures clarity and methodological rigor moving forward, particularly given the concerns raised by Items 5 and 6.  

  **The Argument Against (Professor Densmore's Position):**  
  Professor Densmore argues that our entire framework is incoherent. He contends that demanding falsifiability through instruments like the Auxiliary Register, especially the hostile-design clause, fundamentally misunderstands how science progresses. He points out that no significant programme is ever truly abandoned solely on a single "refutation"; celebrated historical successes (like the long development of plate tectonics or the complex path of quantum mechanics) invariably involved protecting core intuitions through auxiliary adjustments. He asserts that the Kestrel Programme’s responses in Years 3 and 5 are simply part of this normal, healthy process of theory articulation and defence in the face of complex data. Imposing the Register, particularly the requirement to nominate a refutation condition certified by an external critic, is not scientific rigor but rather "an unfalsifiability test wearing a lab coat" – an artificial and impossible standard that would stifle the very kind of bold, long-term speculative work the Foundation was created to support. Densmore would likely argue that the Year 1 and Year 3 successes demonstrate the programme's vitality and that renewal should be unconditional.  

  **Why This Argument Does Not Fully Carry:**  
  Professor Densmore correctly identifies the protective role of auxiliaries in theory development and the Foundation’s unique mandate for high-risk, potentially "wrong" science. However, his argument risks conflating *protective adaptation* with *unconstrained accommodation*. Our own precedents draw this distinction: we renewed a programme that *pre-specified* its protective moves and generated novel predictions, but declined one engaged in post-hoc core claim restatements. The Kestrel Programme’s *post-hoc* model revision in Year 5 (absorbing either sign) and the potential tautology of Item 6 ("the mechanism is whatever produces the pattern") veer dangerously towards the latter, accommodationist pattern we rejected. The Hostile-Design Clause is *not* an impossible demand for absolute falsification; it is a demand for *accountability* and *specificity*. It asks the programme to define, *in advance of the test*, what specific empirical outcome *would* cause *them* to question the core mechanistic claim *as they currently define it*. This is not about killing programmes at the first anomaly (which we explicitly avoid), but about preventing the core claim from becoming infinitely elastic and empirically vacuous – a fate exemplified in our declined precedent. The Kestrel Programme has shown it *can* generate novel, testable insights (Years 1 & 3). The conditions, particularly the Register and Hostile-Design Clause, are designed to ensure this generative capacity continues in a framework that provides the Committee with meaningful criteria for evaluating progress in this final phase, safeguarding both the programme's scientific potential and the Foundation's integrity. Renewal with these conditions honours the programme’s achievements while providing necessary structure to mitigate the emerging risk of unfalsifiability.
