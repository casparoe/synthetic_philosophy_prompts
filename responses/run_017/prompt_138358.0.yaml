prompt: |-
  Study group argument that I can't find the hole in. We've been going round on the problem of old evidence and one of us wrote this down:

  (1) On the Bayesian account, E confirms H for an agent A at a time iff learning E would raise A's credence in H — i.e. P(H|E) > P(H).
  (2) Once E is old — once it's known — P(E) = 1, so P(H|E) = P(H), and no confirmation is possible.
  (3) The usual repair is to evaluate the ratio counterfactually: what matters is the "ur-prior" A would have had before she learned E, not her actual credences now.
  (4) But "what A would have believed had she not known E" is badly underdetermined. Take away her knowledge of the perihelion data and she might believe all sorts of other things instead; different ways of subtracting E seem to give different, even opposite, verdicts about whether E supports H.
  (5) So confirmation by old evidence isn't just hard to model, it's arbitrary — there's no fact of the matter.
  (6) And old evidence isn't a special case: every observation is old the moment after it's made, and scientists always build theories with the data already in hand.
  (7) So on any Bayesian view, whether E confirms H is arbitrary, full stop.
  (8) But whatever else is true, evidential support isn't arbitrary — the perihelion data really did favour GR over the Newtonian account.
  (9) So Bayesian confirmation theory is false, and we need support to be a two-place relation between E and H that doesn't run through anybody's credences.

  I'd most like to keep (8) and give up whatever else I have to, but I can't tell which step is doing the damage, and the discussion has definately stalled. One of us says the real issue is whether H was *built to fit* E rather than whether E was known, so (2) and (6) are aimed at the wrong target; another says (2) is false anyway for evidence that's recorded but nobody has ever looked at — data sitting in a ledger for fifty years is old for the world but not for anyone's credences.

  Where's the break? Name the step, say why it looked fine, and price the alternatives for me: the counterfactual repair, the "what you actually learn is that H entails E" repair, and the no-credences option in (9). Also separate what's settled from what's genuinely contested among people who work on this — don't sell me a contested fix as the consensus. Under 700 words, prose, no headings.
reasoning: |-
  Hmm, the user is grappling with a study group argument about the problem of old evidence in Bayesian confirmation theory. They've presented a structured argument from their group that claims Bayesianism leads to arbitrary confirmation judgments because of old evidence. The user wants to identify which step is flawed, understand why it seemed plausible, evaluate alternative solutions, and get clarity on what's settled versus contested in the literature—all while maintaining that old evidence genuinely confirms theories (like how perihelion data favored general relativity).

  The argument proceeds in nine steps: (1) defines Bayesian confirmation as increase in credence upon learning; (2) notes that once evidence is old, P(E)=1, so no confirmation can occur; (3) mentions the standard counterfactual repair using ur-priors; (4) argues this repair is underdetermined because subtracting E could lead to different prior beliefs; (5) concludes confirmation by old evidence is arbitrary; (6) extends this to all evidence since it becomes old immediately; (7) declares all confirmation arbitrary; (8) rejects this as counterintuitive using the perihelion example; (9) abandons Bayesianism for a two-place relation.

  The key break is step (4). It mischaracterizes the counterfactual by suggesting we remove knowledge of E arbitrarily from the agent's current belief state. But the standard Bayesian repair—the ur-prior approach—isn't about subtracting E from present beliefs; it's about reverting to a hypothetical prior state before any evidence was incorporated. This ur-prior is meant to be a stable, rational starting point, not a messy counterfactual subtraction. 

  Step (4) seemed plausible because real-world counterfactuals (e.g., "what if Newtonians hadn't known the perihelion data?") do involve underdetermination. But Bayesianism avoids this by stipulating a minimal revision: the ur-prior is defined before any updating, so it doesn't depend on how we remove E. The problem arises only if we conflate the technical notion of ur-prior with intuitive counterfactuals. 

  Now, pricing the alternatives:  
  - The **counterfactual repair** (ur-prior) is widely used but contested. Critics say ur-priors are subjective or inaccessible. Proponents argue they're necessary for handling old evidence and align with scientific practice (e.g., comparing theories against baseline knowledge).  
  - The "**H entails E**" repair suggests learning that H explains E (not E itself) can boost credence. This avoids P(E)=1 but is ad hoc—why focus on entailment?—and doesn't cover non-deductive cases.  
  - The **no-credences option** (two-place relation) in (9) abandons Bayesianism for objective support (e.g., Mayo's error statistics). It saves (8) but loses Bayesian strengths like handling uncertainty.  

  Settled points:  
  - Everyone agrees (2) is true for current credences—once E is known, it can't raise P(H) further.  
  - (6) is overstated; Bayesianism handles sequential updating (new evidence still confirms before it's "old").  
  - (8) is accepted; old evidence does confirm.  

  Contested points:  
  - Whether ur-priors are legitimate (subjective vs. objective Bayesians fight over this).  
  - Whether the entailment repair works.  
  - If Bayesianism can be saved at all.  

  The user's suggestion about "data in a ledger" hints at a nuance: evidence unknown to an agent isn't "old" for them, so (2) doesn't block confirmation. But this doesn't solve the core problem for truly known evidence.  

  To keep (8), the user might embrace the ur-prior view (despite subjectivity worries) or lean toward objective Bayesianism/alternative theories. The entailment repair is less promising.
answer: |-
  The break is at step (4). It misrepresents the counterfactual repair and turns a manageable issue into an insurmountable one. Step (4) claims that evaluating "what A would have believed had she not known E" is radically underdetermined, leading to arbitrary verdicts. This seems plausible because *intuitive* counterfactuals about belief are messy: subtract Newtonians' knowledge of Mercury’s perihelion data, and they might believe false auxiliary assumptions, altering their credences unpredictably. But this confuses the *Bayesian counterfactual* with *psychological speculation*. The standard repair (step 3) uses an "ur-prior" – a hypothetical, minimally rational prior *before any evidence* – not a counterfactual about subtracting E from A’s *current, enriched* belief state. The ur-prior is fixed by coherence constraints (e.g., conditionalization-ready priors), not historical accidents. For perihelion data, we ask what credence GR would have in a state before *any* observations, not after selectively forgetting E. This avoids underdetermination: different theorists can agree on the ur-prior’s structure (e.g., smooth distributions over parameters), making confirmation non-arbitrary.  

  Step (2) is correct: *current* credences can’t change for known E. Step (6) overreaches; Bayesianism handles *sequential* evidence (new data raises credence *before* it becomes "old"). Step (8) is bedrock: perihelion data objectively supports GR.  

  Pricing the alternatives:  
  - **Counterfactual (ur-prior) repair**: Dominant but contested. Subjectivists accept arbitrary priors but argue confirmation is *defined* relative to them. Objective Bayesians seek unique ur-priors (e.g., via maximum entropy), but this lacks consensus. Cost: Ur-priors are idealized and inaccessible, risking "just-so" stories.  
  - **"H entails E" repair**: Learn *that H explains E* (not E itself). This avoids P(E)=1 but is ad hoc and narrow. If H entails E, learning this *can* raise P(H), but it doesn’t cover non-deductive cases (e.g., statistical evidence). Cost: Feels artificial; why privilege entailment?  
  - **No-credences option (9)**: Support as objective two-place relation (e.g., Mayo’s error statistics). Keeps (8) cleanly but abandons Bayesian strengths (e.g., handling uncertainty, coherence). Cost: Loses unified probabilistic framework.  

  Settled: (2) is technically true for current credences; (6) is overstated (new evidence confirms when learned); (8) is non-negotiable.  
  Contested: Whether ur-priors rescue Bayesianism (many say yes, skeptics demand objectivity), and if alternatives avoid new problems. The ledger point (unknown data isn’t "old") helps marginally but doesn’t resolve core cases like perihelion. The "built to fit" concern targets *ad hoc* hypotheses, not old evidence per se.
