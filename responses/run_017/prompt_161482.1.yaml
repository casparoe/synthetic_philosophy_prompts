prompt: |-
  I am supervising an MPhil thesis on whether the distinction between doing and allowing — and, more narrowly, between killing and letting die — carries any moral weight of its own, and before my student writes the chapter that sets out what an account of the distinction would have to achieve, I want that specification written properly rather than assembled ad hoc from whichever cases happen to come to mind. So I would like from you a list of desiderata that any adequate theory of the doing/allowing distinction must meet, with the case or consideration behind each, and a view on which of them are genuinely required and which are merely the preferences of one camp (for instance, demands that the distinction be metaphysically prior to any normative facts, that it be describable without appeal to causation, that it be binary, or that it be neutral between a rights-based and a consequentialist framework).

  The list should be pushed into territory that the standard examples do not cover well, since that is where the accounts I have read seem to come apart. In particular I want it to handle: cases of double prevention, where an agent does not create a threat but diverts an existing one onto a different person, or removes something that was shielding them, so that the harm runs through the agent without originating in them; the difference between withholding support and withdrawing support one is already providing, and why that difference, if it is one, should matter when the patient's prospects are held fixed; cases in which someone's allowing is itself constituted by a long chain of small commissions — budget decisions, triage protocols, default settings in a system nobody individually chose — so that the description of the event as an omission is contested rather than given; and cases in which the agent is an automated or artificial system, where doing and allowing come apart as the difference between running and declining to run a computation, and where there is no bodily movement, effort, or phenomenology of agency to anchor the intuitive contrast. I also want the list to say what the distinction must not collapse into: it must not simply track causation, since some allowings look causally necessary for the outcome, and it must not simply track intention or foresight, since those are standardly treated as separate; and it should say something about the weight question, namely whether the distinction is to do independent moral work or is at best a proxy for other factors such as the cost to the agent, the existence of a duty of aid, or the difference between infringing a right and failing to confer a benefit.

  Two things matter to me most in the answer. First, tell me which pairs of desiderata you suspect cannot be jointly satisfied — if, for example, requiring that the distinction be sharp and non-negotiable is in tension with requiring that it handle distributed and automated agency, I want that stated as a result about the specification itself rather than smoothed over. Second, identify the single requirement that does the most work in ruling out existing contenders, and say why. The purpose the theory is being built for is fixed: it is meant to be usable by someone writing policy for an institution — a hospital trust drawing up guidance on withdrawing treatment, or a team specifying the default behaviour of an autonomous system that could intervene in a harm — who needs to know whether declining to act is, in the case at hand, morally different from acting, and if so how much of a difference it makes. If you think some of my cases are bad tests of a theory because they build in the very contestable description at issue, say so and tell me what should replace them. Please write the whole answer in British English.
reasoning: |-
  Okay, let me approach this systematically. The user is supervising an MPhil thesis on the doing/allowing distinction and needs a rigorous set of desiderata for evaluating theories. They specifically want to push beyond standard cases into challenging territories like double prevention, automated systems, and distributed agency.

  First, I consider the core requirements:
  - The distinction must handle complex cases beyond trolley problems (double prevention, withdrawal vs withholding)
  - It must account for non-human agency (AI systems)
  - It shouldn't collapse into causation or intent
  - Must clarify if the distinction carries intrinsic moral weight

  The tricky part is identifying tensions between desiderata. For example:
  - A sharp binary distinction may struggle with distributed agency cases
  - Causation-free theories might falter with double prevention
  - Normative neutrality could limit practical applicability

  I recall Foot's removal-of-barrier cases and Bennett's work on positive/negative instrumentality as relevant to double prevention. For automated systems, the key is separating algorithmic actions from inactions without anthropomorphizing. The institutional policy angle suggests we need desiderata about implementability and resistance to manipulation.

  The most exclusionary requirement seems to be "non-collapse with causation" - it rules out simple counterfactual theories and many causal models. I should note how this affects theorists like Moore or Kamm.

  For contested cases like budget decisions, I consider suggesting controlled variations: compare individual vs institutional agency while holding consequences constant. The replacement cases should isolate structural features rather than build in descriptions.

  On moral weight, I need to separate whether the distinction is: 
  a) intrinsically significant 
  b) a reliable proxy 
  c) epiphenomenal

  The hospital and AI policy contexts make (b) particularly important - even if not fundamental, it may be practically indispensable for rule-setting.
answer: |-
  Here is a list of desiderata for an adequate theory of the doing/allowing distinction, tailored to your requirements. I’ve organised them into **Core Requirements** (arguably essential for any viable theory), **Contextual Demands** (critical for institutional policy applications), and **Common but Contestable Preferences** (often assumed but potentially negotiable). Each includes the motivating case/consideration, tensions between desiderata, and the "most exclusionary" requirement.

  ---

  ### **I. Core Requirements: Non-Negotiable for Adequacy**  
  *(Must be met to avoid collapse, incoherence, or practical irrelevance)*  

  1. **Non-Collapse into Causation**  
     - **Why**: Some allowings (e.g., failing to feed a dependent) are causally necessary for harm, yet distinct from direct killings. A theory equating "doing" with "causing" would misclassify these.  
     - **Test Case**: *Double Prevention* (e.g., removing a flood barrier, diverting a threat). The agent doesn’t *cause* the flood but enables it by removing protection. The distinction must capture why this feels more like "doing" than "allowing," without relying on causal contribution.  
     - **Weight Implication**: If the distinction collapses into causation, it cannot explain why we treat causing harm as worse than allowing it *even when* causal necessity is identical.  

  2. **Separation from Intent/Foresight**  
     - **Why**: Intent and foresight are orthogonal (e.g., unintended killings vs. intentional allowings). A theory conflating them cannot address cases like justifiable self-defence (unintended doing) vs. callous neglect (intentional allowing).  
     - **Test Case**: *Automated Systems*: An AI foresees a pedestrian’s death but "allows" it due to programming constraints vs. "doing" harm by miscalculating a swerve. The moral evaluation hinges on the act/omission distinction, not the system’s "intent."  

  3. **Handling Withdrawal vs. Withholding**  
     - **Why**: Withdrawing life support (e.g., turning off a ventilator) often feels more like "doing" than withholding treatment, even if outcomes and costs are identical. A theory must explain this asymmetry.  
     - **Test Case**: *Hospital Policy*: Withdrawing nutrition from a patient vs. never providing it. If the distinction matters morally, the theory must identify a non-arbitrary basis beyond outcome equivalence.  
     - **Tension**: This desideratum clashes with theories demanding *binary* classifications (e.g., "allowing" must cover both withdrawal and withholding).  

  4. **Agency-Neutral Description**  
     - **Why**: To handle distributed agency (e.g., institutional omissions) and non-human agents (e.g., algorithms). The distinction cannot rely on human-specific features (e.g., bodily effort, phenomenology).  
     **Test Case**: *Budget Deaths*: A hospital’s triage protocol (designed via committee decisions) "allows" deaths by prioritising resource allocation. The theory must classify this without anthropomorphising the institution.  
     **Replacement Case**: Instead of contested descriptions, use *algorithmic inertia*: An autonomous car "allows" a collision by adhering to default settings (no active computation) vs. "does" harm by executing a flawed avoidance maneuver.  

  ---

  ### **II. Contextual Demands: Essential for Institutional Policy**  
  *(Required for the theory to be action-guiding in your specified domains)*  

  5. **Resistance to Manipulation**  
     - **Why**: Policies must prevent agents from gaming the distinction (e.g., reclassifying "doings" as "allowings" to evade scrutiny).  
     - **Test Case**: *Shield Removal*: A agent removes a shield knowing it will "allow" harm. If the theory calls this "allowing," it risks permitting disguised killings.  
     - **Weight Implication**: If the distinction is easily manipulated, it cannot bear independent moral weight.  

  6. **Scalability to Diffuse Agency**  
     - **Why**: Institutions need clarity on responsibility for harms arising from cumulative small acts (e.g., budget cuts).  
     - **Test Case**: *Triage Protocols*: A series of minor administrative decisions collectively "allow" preventable deaths. The theory must pinpoint when aggregated omissions become institutional "doing."  

  7. **Practical Discernibility**  
     - **Why**: Policy-makers need ex ante guidelines, not post hoc philosophical judgments.  
     - **Test Case**: *AI Default Settings*: Distinguishing between a system’s "inaction" (e.g., not overriding a routine) and "action" (e.g., initiating a protocol). The theory must offer clear operational criteria.  

  ---

  ### **III. Common but Contestable Preferences**  
  *(Often assumed but may be negotiable depending on meta-ethical commitments)*  

  8. **Metaphysical Independence**  
     - **Preference of**: Deontologists who need the distinction prior to moral facts (e.g., to ground rights violations).  
     - **Tension**: Conflicts with consequentialist-leaning theories where the distinction is derivative of outcomes/duties.  
     - **Case**: If withholding life support is "allowing" only because no duty exists, the distinction lacks metaphysical depth.  

  9. **Binary Classification**  
     - **Preference of**: Theories requiring moral clarity (e.g., killing vs. letting die must be discrete).  
     - **Tension**: Fails in *Withdrawal/Withholding* and *Distributed Agency* cases, which suggest a spectrum.  
     - **Case**: Withdrawing a ventilator feels "in between" doing and allowing—forcing binarity may distort moral judgments.  

  10. **Normative Neutrality**  
      - **Preference of**: Theorists seeking a descriptive foundation for rights-based/consequentialist debates.  
      - **Problem**: May render the distinction useless for policy, where institutions need to know *how much* weight to assign it.  

  ---

  ### **Key Tensions Between Desiderata**  
  - **Sharpness vs. Diffuse Agency (8 vs. 6)**: A binary, metaphysically independent distinction struggles with distributed omissions (e.g., budget deaths), which involve graded responsibility.  
  - **Non-Causality vs. Double Prevention (1 vs. 3)**: Theories avoiding causation (e.g., "agent as source of threat") often miscast double prevention (e.g., diverting a threat) as "allowing," losing moral nuance.  
  - **Practical Discernibility vs. Moral Depth (7 vs. 8)**: Easily applicable rules (e.g., "default settings = allowing") may ignore context-specific duties, undermining the distinction’s normative force.  

  ---

  ### **The Most Exclusionary Requirement**  
  **Non-Collapse into Causation (Desideratum 1)** does the heaviest work in ruling out existing theories:  
  - **Why**: It eliminates (a) *Simple Counterfactual Theories* (if the harm occurs because the agent didn’t prevent it, all allowings become causally necessary), (b) *Causal Salience Accounts* (e.g., Moore’s "but-for" causation), and (c) *Normative Reductionism* (if the distinction reduces to duties, it cannot explain why *causally identical* doings/allowings differ morally).  
  - **Excluded Contenders**: Jonathan Bennett’s positive/negative instrumentality (relies on causal structure), Judith Jarvis Thomson’s rights-based account (collapses into duty analysis), and some versions of Christopher Boorse’s biomechanical model.  

  ---

  ### **On Moral Weight & Problematic Cases**  
  - **Weight Question**: The distinction *can* carry independent weight if it tracks whether an agent *imposes* harm (violating negative rights) vs. *fails to prevent* it (violating positive duties). But this is contestable—consequentialists see it as a proxy for cost/benefit asymmetry. For policy, treat it as a *defeasible heuristic*: "Doings" presumptively require stronger justification, but contextual factors (duties, costs) can override.  
  - **Bad Tests**: Your *chain of commissions* case risks begging the question by assuming the description ("omission"). **Replace with**: *Institutional Inertia*—identical budget cuts in two hospitals: one votes *against* new funding (commission?), the other *retains* old guidelines (omission?). Test if the theory classifies them differently *without* presupposing the description.  

  This specification ensures the thesis chapter avoids ad hoc case-mongering and rigorously pressures theories at their weakest points—particularly double prevention, non-human agency, and institutional diffusion. For policy purposes, prioritise *Practical Discernibility* and *Resistance to Manipulation*, even if this requires relaxing *Metaphysical Independence*.
