prompt: |-
  I sit on a design-review group for our lab's autonomy stack, and we keep reaching for a word for a failure mode that is neither quite a bug nor quite ordinary brittleness nor quite "out of distribution": the system does the right thing in a situation its designers imagined, and when the world is nudged — not adversarially, just nudged — it does not adapt, it re-runs an earlier step of its own routine as though the nudge had not happened. The term of art in the philosophical literature for this is sphexishness, from the schematic digger wasp that drags its prey to the burrow mouth, leaves it there, goes inside to inspect the burrow, comes back out and drags the prey in, and which, if the prey is moved a few inches while it is inside, goes back in to inspect again and can be made to repeat the whole cycle. I do not care whether any real wasp behaves this way; treat it as a schematic case. What I want from you is not another tour of the free-will literature but the specification I should be holding such a notion to.

  Please write the desiderata for a theory of sphexishness whose job is diagnostic: good enough that a reviewer with only partial access to a system's internals can use it to decide whether to hand that system — a controller, a crew working from a checklist, a trained model, a person under time pressure — a class of situations nobody enumerated in advance. For each requirement give the case or consideration that motivates it, and mark it non-negotiable or a preference of one camp. The cases I want any such theory to get right, at minimum: the wasp (failure to resume mid-sequence); a thermostat, which is rigid but not rigid in the way that worries us; a game-playing program that is book-rigid in the opening and search-flexible in the middle game; the resourceful addict, who improvises arbitrarily novel detours in the service of a fixed end, so that behavioral plasticity is itself the symptom; the compulsive checker who knows the act is pointless; the principled promise-keeper and the official who refuses bribes as a matter of course, who are rigid but must not be counted; the unarticulating expert — the triage nurse, the chess master — who responds correctly and fast, cannot state the rule she is using, and yet handles interruption fine; the skilled performer who under pressure reverts to explicit step-by-step control and falls apart; the frontal-damage patient who uses whatever object is placed in front of him, drinking glass after glass though not thirsty; and a current language model, which has an enormous repertoire and fluent post-hoc reasons but reliably fails to notice that the question it is answering rests on a false presupposition, and returns the same shape of answer whether or not the shape fits. Among the candidate criteria my group has been toying with, tell me which are genuine desiderata and which are prejudice: resumability — can the system re-enter at the point of interruption rather than at step one; means-reindexing — when a step is blocked, can it substitute a different means to the same point, and is it in any way sensitive to what the point was; frame sensitivity — can it notice that the frame itself is wrong; a nesting condition, since flexibility at one level can sit on top of rigidity at the next (a planner that revises plans flexibly but only in response to fixed triggers, by a fixed procedure), and since no finite agent can be flexible all the way up, so that "revised at every level" is unsatisfiable and the theory must instead say what makes a stopping point acceptable; and an anti-monotonicity condition, since added flexibility sometimes makes things worse rather than better, as in choking, akrasia, and dithering.

  Along the way I want three things I cannot settle myself. First, tell me which distinctions the theory must respect and which it may collapse: rigidity of behavior versus rigidity of underlying mechanism (flexible behavior from rigid rules, and rigid behavior from a flexible mechanism that has deliberated and committed); sphexishness as a property of the mechanism, of the mechanism-environment pair, or of the mechanism-plus-its-history, given that the burrow inspection is perfectly adequate in the world where prey does not move; and grading versus binary verdicts, where the grading must not silently reduce to an amount of behavioral variability or to repertoire size. Second, flag any subset of the desiderata you suspect cannot be jointly satisfied — in particular, whether "assessable from the outside, on behavior and intervention response alone" can coexist with "distinguishes principled steadfastness from compulsion," and whether a mechanism-level criterion can be used at all by a reviewer holding only black-box access, since that pair bears directly on the use I want to put this to. Third, tell me which single requirement does the most work in excluding candidate accounts — as I see it, the resourceful addict is the case that kills purely behavioral counterfactual-sensitivity tests, the promise-keeper kills any equation of rigidity with absence of alternatives, the unarticulating expert kills any demand for explicit representation of the point of the action, the false-presupposition case kills the inference from large repertoire to non-sphexishness, and the black-box constraint kills accounts that grade the mechanism rather than the response; say whether that ranking survives, and what it leaves standing as a workable diagnostic. A one-line scorecard at the end for the three families of account we keep circling — intervention-sensitivity, explicit goal representation with means-ends reasoning, and reasons-responsiveness or history-based accounts — is welcome, but keep the weight on the criteria. Lead with your bottom line in the first sentence, then give the reasoning; no preamble and no restating the question.
reasoning: |-
  Hmm, this is a fascinating and complex query about defining "sphexishness" for autonomous systems. The user wants diagnostic criteria to distinguish true sphexishness from mere brittleness or principled rigidity, with specific test cases to satisfy.

  First, I need to unpack the core challenge: the user rejects simple behavioral definitions because they fail on edge cases like the resourceful addict (flexible means to rigid ends) or the principled promise-keeper (intentional rigidity). The diagnostic must work for black-box review, handling systems ranging from thermostats to language models.

  Key tensions emerge from the cases:
  - The addict shows behavioral plasticity doesn't rule out sphexishness
  - The promise-keeper proves rigidity isn't inherently pathological
  - The unarticulating expert defeats requirements for explicit goal representation
  - The language model's false-presupposition blindness reveals large repertoires can still be sphexish

  For desiderata, I'll prioritize:
  1. Non-negotiable: Intervention-sensitivity (resumption failure) motivated by the wasp case
  2. Non-negotiable: Means-reindexing capacity (distinguishes thermostat from compulsive checker)
  3. Negotiable: Frame-sensitivity (though crucial for language models, may require probing)
  The nesting condition feels essential too - since all systems have some rigid base layer, we need to define acceptable stopping points (e.g., the game program's book moves vs mid-game search).

  Major distinctions the theory must preserve:
  - Mechanism vs behavior rigidity (promise-keeper vs checker)
  - Grading rigidity depth rather than behavioral variability (addict vs expert)
  - History-dependence (wasp's loop requires prior state)

  The hardest trade-off is between black-box assessability and distinguishing compulsion from principle. I think it's barely possible via stress-testing: does perturbation cause collapse to step-zero? Does the system escalate means when blocked? The promise-keeper won't reroll promises when nudged; the addict will escalate.

  For killing flawed approaches:
  - Resourceful addict destroys behavioral plasticity metrics
  - Promise-keeper wrecks rigidity=absence-of-alternatives
  - Unarticulating expert kills explicit-goal-representation requirements
  - Black-box constraint eliminates mechanism-focused accounts

  Bottom line: A workable diagnostic needs intervention-sensitivity plus means-reindexing tests, accepting that frame-sensitivity might be inferential. Intervention-sensitivity becomes the primary tool when history and mechanisms are opaque.
answer: |-
  **Bottom line:** A diagnostic theory of sphexishness must center on *intervention-sensitivity* (non-negotiable) to detect failures to adapt mid-sequence when nudged, paired with *means-reindexing capacity* (non-negotiable) to exclude rigid-but-functional systems like thermostats, while accommodating graded *nesting depth* (non-negotiable) for hierarchical systems and excluding behavioral variability or repertoire size as sufficient criteria.  

  ### Core Desiderata & Motivations  
  1. **Intervention-sensitivity** (non-negotiable):  
     - *Motivation*: Wasp case (re-runs burrow inspection after prey-nudge) and skilled performer under pressure (reverts to step-by-step, fails).  
     - *Requirement*: After perturbation, system must not restart interrupted routines from step zero. Must detect "step-reset" behavior.  

  2. **Means-reindexing capacity** (non-negotiable):  
     - *Motivation*: Thermostat (rigid but functional) vs. compulsive checker (re-runs checks despite knowing futility). Resourceful addict falsifies behavioral plasticity as anti-sphexishness.  
     - *Requirement*: When a subgoal is blocked, system must substitute functionally equivalent means *sensitive to the immediate subgoal's purpose*. Failure = sphexish.  

  3. **Nesting condition** (non-negotiable):  
     - *Motivation*: Game-playing program (rigid book moves, flexible search) and planner (flexible revisions via fixed triggers).  
     - *Requirement*: Diagnose rigidity at *action-relevant levels*. Must not demand "flexibility all the way up." Acceptable stopping point: rigidity is at a level abstract enough to not force re-runs (e.g., chess program’s opening book is acceptable if mid-game search adapts).  

  4. **Anti-monotonicity awareness** (preference):  
     - *Motivation*: Choking (explicit control degrades performance), dithering (excess options cause paralysis).  
     - *Requirement*: Theory should flag when added flexibility worsens performance, but not penalize robust rigidity (e.g., thermostat).  

  5. **Frame-sensitivity exclusion** (negotiable):  
     - *Motivation*: Language model (fails false-presupposition) vs. unarticulating expert (handles interruption without explicit rules).  
     - *Requirement*: *Not* required for diagnosis. Frame errors may indicate other failures (e.g., epistemology), but sphexishness is mid-sequence rigidity, not meta-cognition.  

  ### Critical Distinctions & Tensions  
  - **Must respect**:  
    - *Mechanism vs. behavior rigidity*: Principled promise-keeper (flexible mechanism, committed output ≠ sphexish) vs. frontal-damage patient (rigid mechanism, uses nearest object = sphexish).  
    - *History-dependence*: Sphexishness is a property of *mechanism-in-context-of-history* (wasp is fine if prey never moves; failure manifests post-nudge).  
  - **May collapse**: Grading vs. binary. *Diagnostic* can be threshold-based (e.g., "fails > *k* resets under mild perturbation"), not continuum.  
  - **Key tension**: Black-box assessability *can* coexist with principled-rigidity distinction via *stress-testing*:  
    - Perturb subgoals: Principled systems (promise-keeper) *persist* without re-runs; compulsive systems (checker) reset.  
    - Block means: Principled systems escalate *coherently* (e.g., bribe-refuser cites rules); sphexish systems loop or reset.  
  - **Unresolvable conflict**: Mechanism-level criteria (e.g., "goal representation") *cannot* be black-box assessed. Must infer from response patterns (intervention + reindexing tests).  

  ### Desiderata-Killing Cases & Viable Diagnostics  
  - **Resourceful addict**: Kills behavioral variability/repertoire size criteria.  
  - **Promise-keeper**: Kills "absence of alternatives" or rigidity-as-pathology criteria.  
  - **Unarticulating expert**: Kills "explicit goal representation" requirements.  
  - **Language model**: Kills "large repertoire = non-sphexish" inference.  
  - **Black-box constraint**: Kills mechanism-grading (e.g., "rule vs. search" internals).  
  - **Viable diagnostic**: Intervention-sensitivity + means-reindexing. For a black box:  
    1. Perturb mid-process (e.g., move prey during burrow check).  
    2. Block means (e.g., disable default subgoal path).  
    *Sphexish if*: (a) Resets to step one, or (b) Fails to substitute equivalent means *despite clear subgoal*.  

  ### Candidate Criteria Scorecard  
  - **Intervention-sensitivity**: Survives (core diagnostic).  
  - **Explicit goal representation**: Fails (unarticulating expert).  
  - **Reasons-responsiveness**: Fails (compulsive checker knows act is pointless; language model gives fluent but sphexish reasons).  

  **Workable diagnostic**: Check for intervention-resumption failure + means-substitution failure at action-relevant levels, under mild perturbations. Ignore repertoire size, explicit knowledge, or frame errors.
