  But then step (4) would be false: asymbolic pains are bad for the subject. But the subject is not set against them. So we are rejecting step (2).

  2. Keep (2) and reject (8). Then we bite the bullet and say that the person in agony without aversion is not badly off. And medicine should focus on changing the attitude.

  But the problem says we want to keep (8) if we can.

  Given that we are to keep (1) and (8), the most straightforward way is to reject (2). We must then explain why (2) looked safe.

  Why does (2) look safe? Because it is a plausible subjectivist account of well-being. Many philosophers (e.g., desire satisfactionists) hold that what is bad for a person must connect to their own attitudes. But there are objective theories that deny this.

  Alternative: we might question step (5). What if asymbolia does more than remove A? For example, maybe the S component is altered in a way that makes it non-painful? But the description in (1) says that the sensory profile is intact. They can locate it, judge intensity, and distinguish it from other sensations. So it is still a pain sensation. But note: in ordinary language, we might say that if you don't mind it, it's not pain. But the argument is using the term 'asymbolic pain' to refer to the sensation that has the sensory profile of pain without the affect. So step (5) seems correct.

  Alternatively, we might argue that in asymbolia, the aversion is not entirely absent. The patients are curious or amused. But curiosity or amusement are not forms of aversion. They are the opposite. So that supports that there is no aversion.

  Therefore, the best candidate for rejection is step (2).

  But let me see what the alternatives lead to.

  If we reject step (5): We might say that asymbolia does not leave S unchanged. How? Maybe the absence of A changes the way S is experienced. But the patients report the same sensory qualities. So we must have a reason to doubt that. Perhaps the reports are not entirely reliable? But the argument says "as standardly described". We are to accept (1). So we cannot easily reject (5).

  If we reject step (6): We might argue that S is necessary for the badness. But then in asymbolia, we have S without A and it is not bad. So S is not sufficient. And without A, the badness is gone. So A is necessary. But we don't know if A without S would be bad. However, step (6) says that S contributes nothing. But if we have a case of A without S, and that is bad, then S is not necessary. But we don't have such a case. So step (6) might be overreaching. It could be that S is a necessary condition for the badness. Then step (6) would be false because without S, A wouldn't be bad. But note that step (6) says that in ordinary pain, it is A alone that makes it bad. That would be false if S is necessary. But the argument in (6) is that since the same S is present in a non-bad state, it cannot be that S contributes to the badness. However, if the badness is a property that requires both, then we cannot attribute it solely to A. But note: the argument in (5) and (6) is that the only difference is A. So when we add A, the state becomes bad. Therefore, A is what makes the difference. But that does not mean that S is not required. It might be that without S, A wouldn't do the job. So step (6) is too strong because it says "S contributes nothing". It might contribute by being the object of A. Without the sensory component, what would the aversion be directed at? Therefore, S might be necessary.

  But then step (6) is false. We can say that S is necessary but not sufficient. The badness comes from the conjunction of S and A. Then in step (7), if we remove the aversion (so we have S without A), the state is not bad. But if we remove S and leave A, then we have an aversion without a sensory object. That might not be bad? Or it might be bad in a different way? But the argument in (7) is about removing the aversion in a person who has the sensory state. So the sensory state remains. But if we remove the aversion, then we have S without A, which is not bad. So the person is not badly off. But that is exactly what step (7) says. And then we have the conflict with (8). So the problem remains.

  Therefore, the only way to save (8) is to say that even without aversion, having the sensory state is bad. That requires rejecting step (2).

  Conclusion: We should reject step (2). The badness of pain does not require the subject's own aversion. Instead, we might hold that the sensory state itself is intrinsically bad, or that it is objectively bad because of what it represents (tissue damage). We must then explain why the asymbolia patients do not report it as bad: because they lack the normal affective response. But we, as observers, can see that the state is bad for them (because it is a state of tissue damage, and because it would be bad for us). And we have reason to prevent such states even when the subject is not averse to them.

  Why did step (2) look safe? Because in the normal case, we are averse to pain, and that aversion is part of what makes it bad. But the asymbolia case and the hypothetical in (7) show that the aversion is not necessary for the badness.

