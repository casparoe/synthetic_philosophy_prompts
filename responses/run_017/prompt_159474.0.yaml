  We are given an argument that leads to a conclusion that conflicts with our intuitions. The argument is as follows:

  (1) In pain asymbolia, patients have the sensory component (S) without the affective component (A). They do not mind the pain.

  (2) A state is bad for a subject only if the subject is set against it (aversion).

  (3) Asymbolic pains lack A.

  (4) Therefore, asymbolic pains are not bad for their subjects.

  (5) The only difference between asymbolic and ordinary pain is the presence of A; S is the same.

  (6) Therefore, A alone makes ordinary pain bad. S contributes nothing to the badness.

  (7) If S contributes nothing, then two subjects with the same aversive attitudes are equally badly off regardless of the S state. Thus, a person in agony who does not mind it (due to resignation, drugs, etc.) is not badly off, and medicine should target the attitude rather than the sensation.

  (8) But we do not believe that. We think such a person is badly off, and we have reason to relieve the pain even if the patient says they don't mind.

  (9) Therefore, one of the steps is wrong.

  We are to keep (1) and (8) if possible. We must reject one step and explain why it looked safe.

  Let me examine the steps:

  - Step (1): Empirical claim about asymbolia. We are to keep it.

  - Step (2): This is a philosophical premise: badness-for is constituted by the subject's own aversion.

  - Step (3): Follows from (1).

  - Step (4): Follows from (2) and (3). If badness requires aversion and asymbolic pains lack aversion (since they lack A, which is the affective component that typically includes aversion), then they are not bad.

  - Step (5): Also an empirical claim. It says that asymbolia removes only A and leaves S intact and unchanged.

  - Step (6): From (4) and (5). If the only difference is A and without A the pain is not bad, then A alone is responsible for the badness.

  - Step (7): An extension of (6). If S doesn't contribute to badness, then the badness is entirely in the aversion. So if we remove the aversion (by any means), the badness is gone. Therefore, a person in agony without aversion is not badly off.

  - Step (8): We have an intuition that this is wrong: the person in agony without aversion is still badly off.

  Now, the conflict is between the conclusion of the argument (which is that the person without aversion is not badly off) and our intuition (that they are).

  We must break the chain. The options are:

  A. Reject step (2). Then we might say that badness-for does not require the subject's own aversion. Then we can say that asymbolic pains are bad even though the subject isn't averse to them. But then we must explain what makes them bad and why we should override the subject's own attitude.

  B. Reject step (5). We can say that asymbolia does more than just remove A. Maybe it also alters S in a way that makes it non-painful? But the description in (1) says that the sensory profile is intact. Alternatively, we might argue that the absence of A changes the nature of the experience. However, the patients report the sensory component as being like a pinprick or burn. So step (5) looks safe.

  C. Reject the inference from (4) and (5) to (6). Step (6) says that S contributes nothing. But note that in ordinary pain, S and A are both present. The argument says that because when A is missing (and S is the same) the state is not bad, then in the ordinary case the badness is entirely due to A. This seems to follow. However, it might be that S is necessary for the badness but not sufficient. But step (6) says S contributes nothing. That is, it is not even a necessary condition? Or does it mean that S is not a part of the badness? The argument in (6) is that S would be exactly as it is in a sensation that is not bad. So S is not a part of the badness.

  But note: in ordinary pain, the badness might be an emergent property of the combination of S and A. So without S, A might not be bad. For example, if you have aversion to something that doesn't have the sensory character of pain, it might be a different kind of bad. But step (5) says that in asymbolia, we have S without A and it is not bad. And in ordinary pain, we have both. So the badness requires both? Then step (6) would be false because if we remove S, then even with A it might not be bad. But the argument in (5) and (6) is that the only difference is A, so A alone makes the difference. However, if the badness is a product of both, then removing either would remove the badness. But step (5) says that in asymbolia we remove A and leave S, and the badness is gone. So that suggests that A is necessary. But it does not show that S is not necessary. To show that S is not necessary, we would need a case where we have A without S and it is bad. But we don't have that.

  Therefore, step (6) might be overstepping. It says that S contributes nothing. But it could be that S is a necessary condition for the badness. However, the argument does not require that. It says that S is present in a non-bad state (asymbolia) and that the same S is present in a bad state (ordinary pain). So S is present in both a bad and a non-bad state. Therefore, S by itself cannot be what makes the state bad. But it might be that S is a necessary condition for the badness that A provides. But note: if we have a state with A but without S, would that be bad? We don't know. But the argument in (6) is that because in asymbolia we have S without A and it is not bad, then in the ordinary case the badness is entirely due to A. That seems to follow. So I don't think the inference is the problem.

  D. Reject step (7). Step (7) says that if S contributes nothing, then the badness is entirely in the aversion. So if we have a person with unremitting agony (which presumably has both S and A) but then we remove the aversion (so now they have S without A), then they are not badly off. But note: step (7) also includes cases where the aversion is removed by resignation, conditioning, etc. In these cases, the aversion is gone, so the state is like asymbolia? But wait: in the case of resignation, the person might still have the sensory component and no longer be averse. So then according to the argument, they are not badly off. But in (8) we think they are.

