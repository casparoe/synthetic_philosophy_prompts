answer: |-
  ### Brainstorming: Constraints on Theories of Knowing-How  
  **(a) Genuine Constraints on Adequacy**  
  - Must explain the link between knowledge-how and reliable successful action (ability-intuition).  
  - Must account for guidance: how knowledge-how informs action in real-time.  
  - Must accommodate non-linguistic subjects (e.g., infants, animals).  
  - Must distinguish knowledge-how from mere luck or flukes.  
  - Must address the grain of the activity (e.g., skiing vs. skiing in powder).  

  **(b) Reflexes from Intellectualism Dispute**  
  - Anti-reductionist impulse: insistence that knowledge-how *cannot* be reduced to knowledge-that (anti-intellectualist reflex).  
  - Ability-entailment demand: the claim that knowing-how *must* entail current ability (anti-intellectualist reflex).  
  - Propositional-purism: insistence that all knowledge involves propositional attitudes (intellectualist reflex).  

  **(c) Things No Theory Explicitly Pursues**  
  - Perfect immunity to Gettier-style epistemic luck in practical domains.  
  - Complete independence from propositional knowledge in all cases.  
  - Exhaustive mapping of skill decay/growth to neural or computational states.  

  ---

  ### Desiderata for a Theory of Knowing-How  
  *Purpose: Assess literal vs. analogical attributions to non-paradigmatic subjects (e.g., AI, infants, impaired experts).*  

  1. **Non-Linguistic Attribution**  
     - *Requirement:* The theory must allow literal knowledge-how attributions to non-linguistic entities (e.g., pre-linguistic infants).  
     - *Case:* Infant who imitates latch-pulling without verbal instruction.  
     - *Why for purpose:* Non-paradigmatic subjects (e.g., infants, animals) are central test cases.  
     - *Failure:* Denying literal knowledge-how to successful non-linguistic agents.  
     - *Status:* **Non-negotiable**.  

  2. **Guidance Condition**  
     - *Requirement:* Knowledge-how must play a causal or rational role in guiding successful performance.  
     - *Case:* Chess engine selecting moves via learned policy, not random choice.  
     - *Why:* Distinguishes knowledge from accidental success (e.g., flukes).  
     - *Failure:* Attributing knowledge-how to an agent who succeeds by pure luck.  
     - *Status:* **Non-negotiable**.  

  3. **Ability Decoupling**  
     - *Requirement:* The theory must permit knowledge-how without current ability to perform.  
     - *Case:* Concert pianist with paralyzed hands who teaches, corrects, and judges performances accurately.  
     - *Why:* Critical for impaired experts and AI (e.g., "knowledge" in inactive systems).  
     - *Failure:* Requiring ability as necessary for knowledge-how.  
     - *Status:* **Non-negotiable**.  

  4. **Anti-Fluke Constraint**  
     - *Requirement:* Knowledge-how requires reliable success under normal conditions, excluding one-off luck.  
     - *Case:* Novice who accidentally lands a rocket once but cannot repeat it.  
     - *Why:* Prevents over-attribution to unreliable systems or lucky novices.  
     - *Failure:* Counting unrepeatable flukes as knowledge-how.  
     - *Status:* **Non-negotiable**.  

  5. **Instructional Gap**  
     - *Requirement:* Reciting instructions without performance competence is insufficient for knowledge-how.  
     - *Case:* Novice who memorizes ski-manual verbatim but cannot ski.  
     - *Why:* Tests if propositional knowledge entails practical knowledge (intellectualism pressure point).  
     - *Failure:* Equating verbal recall with knowledge-how.  
     - *Status:* **Negotiable** (intellectualists may contest).  

  6. **Normative Scope**  
     - *Requirement:* The theory must specify the object’s grain (e.g., activity-type vs. specific way) and explain normative scope (e.g., whether knowing how to ski entails skiing in powder).  
     - *Case:* Does knowing how to ski entail knowing how to ski with a damaged binding?  
     - *Why:* Determines attribution boundaries (e.g., whether AI "knows how" in novel sub-conditions).  
     - *Failure:* No account of grain or ad hoc treatment of edge cases.  
     - *Status:* **Non-negotiable**.  

  7. **Artifact Reliability**  
     - *Requirement:* Literal knowledge-how must be attributable to artifacts with reliable but non-reasoning success.  
     - *Case:* Rocket-landing AI using control policies without propositional reasoning.  
     - *Why:* Central to non-paradigmatic subjects like AI.  
     - *Failure:* Denying knowledge-how to reliable non-biological systems.  
     - *Status:* **Negotiable** (camps split on artifacts).  

  8. **Skill Dynamics** (*Constructed*)  
     - *Requirement:* The theory must explain skill improvement through practice and decay through disuse without collapsing knowledge-how into ability.  
     - *Case:* Pianist gradually losing dexterity after injury but retaining conceptual corrections, or AI fine-tuning via data.  
     - *Why:* Shows knowledge-how as a stable yet plastic state.  
     - *Failure:* Inability to model skill change independent of binary ability.  
     - *Status:* **Preference** (often underexamined).  

  9. **Recognition Without Execution**  
     - *Requirement:* Knowledge-how must support recognizing correct/incorrect performances without executing the action.  
     - *Case:* Apraxia patient who cannot wave but identifies errors in others’ waving.  
     - *Why:* Tests if knowledge-how includes evaluative capacity beyond performance.  
     - *Failure:* No link between knowledge-how and normative judgment.  
     - *Status:* **Non-negotiable**.  

  10. **Non-Propositional Grounding**  
      - *Requirement:* Knowledge-how cannot require grasping truth-evaluable propositions.  
      - *Case:* Dog reliably fetching objects via trained associations, not beliefs.  
      - *Why:* For literal attributions to animals/AI without linguistic structure.  
      - *Failure:* Requiring propositional attitudes for all knowledge-how.  
      - *Status:* **Negotiable** (intellectualists reject).  

  11. **Hybrid Stability** (*Ignored in literature*)  
      - *Requirement:* Knowledge-how must persist through temporary performance failure (e.g., fatigue, glitches) if underlying competence remains.  
      - *Case:* Rocket AI failing once due to sensor noise but succeeding consistently post-reboot.  
      - *Why:* Avoids over-attributing "ignorance" to reliable systems with transient errors.  
      - *Failure:* Equating single failures with loss of knowledge-how.  
      - *Status:* **Preference** (literature focuses on permanent incapacity).  

  12. **Transfer Constraints** (*Ignored in literature*)  
      - *Requirement:* The theory must clarify when knowledge-how transfers to variations of the activity (e.g., skiing to skiing in powder).  
      - *Case:* Expert skier failing in deep powder despite general proficiency.  
      - *Why:* Addresses grain and attribution scope for novel challenges.  
      - *Failure:* No principled account of transfer conditions.  
      - *Status:* **Preference** (grain is noted but transfer is underexplored).  

  ---

  ### Tensions, Exclusion, and Prejudice  
  - **Tension between Guidance (2) and Ability Decoupling (3):**  
    - *Argument:* If knowledge-how must guide action (2), but an expert cannot act (3), how does it "guide"? Teaching/correcting seems distinct from guiding *one’s own* action.  
    - *Resolution for purpose:* Prioritize **Guidance (2)**. Abandoning strict self-guidance allows literal attributions to teachers/AI. *Cost:* Weakens anti-intellectualist appeal but aligns with purpose (non-paradigmatic subjects).  

  - **Most Exclusionary Desideratum:**  
    - **Non-Propositional Grounding (10)**. Knocks out all strong intellectualist theories (e.g., Stanley & Williamson) that require propositional modes of presentation.  

  - **Likely Prejudice Mistaken for Desideratum:**  
    - **Ability Intuition** (often implicit in 3’s converse). Anti-intellectualists (e.g., Ryleans) treat ability-entailment as essential, but it is a reflex (§b), not a constraint (§a).  

  ---

  ### Theory Scoring Table  
  | Desideratum                          | Intellectualism                              | Ability Anti-Intellectualism             | Hybrid Practical Grasp                 |  
  |--------------------------------------|----------------------------------------------|------------------------------------------|----------------------------------------|  
  | **1. Non-Linguistic Attribution**    | Fails: Requires propositions.                | Partial: Allows but struggles with normativity. | Complete: Practical grasp covers animals/AI. |  
  | **2. Guidance Condition**            | Partial: Propositions guide indirectly.      | Fails: Reduces guidance to ability.      | Complete: Grasp structures action directly. |  
  | **3. Ability Decoupling**            | Complete: Knowledge-that without ability.    | Fails: Ability necessary.                | Complete: Grasp persists sans ability. |  
  | **4. Anti-Fluke Constraint**         | Complete: Reliability built-in.              | Complete: Reliability via ability.       | Complete: Grasp ensures reliability.   |  
  | **5. Instructional Gap**             | Partial: May equate instructions with how.   | Complete: Performance required.          | Complete: Grasp transcends description. |  
  | **6. Normative Scope**               | Partial: Propositions fix grain ambiguously. | Fails: No grain theory.                  | Complete: Grasp includes context-sensitivity. |  
  | **7. Artifact Reliability**          | Fails: Artifacts lack beliefs.               | Partial: Allows if reliable.             | Complete: Practical grasp computable.  |  
  | **8. Skill Dynamics**                | Partial: Tied to propositional updates.      | Fails: Collapses to ability states.      | Partial: Grasp admits degrees.         |  
  | **9. Recognition Without Execution** | Complete: Judgment via propositions.         | Fails: Requires performance ability.     | Complete: Grasp enables evaluation.    |  
  | **10. Non-Propositional Grounding**  | Fails: Propositions essential.               | Complete: Non-propositional ability.     | Partial: Grasp is non-propositional.   |  
  | **11. Hybrid Stability**             | Complete: Knowledge persists.                | Fails: Ability lost = knowledge lost.    | Complete: Grasp stable.                |  
  | **12. Transfer Constraints**         | Partial: Propositions limit transfer.        | Fails: No transfer beyond ability.       | Partial: Contextual grasp explains.    |  

  *Total: ~1,200 words.*
