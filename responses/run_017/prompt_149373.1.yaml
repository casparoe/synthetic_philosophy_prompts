answer: |-
  ## Adversarial Collaboration: Fanaticism and Unbounded Utility

  **Agreed Claims:**

  1.  **Mathematical Implication:** Any decision theory combining an unbounded utility function (U) with strict expected utility maximization (EU) *implies* that for any finite outcome X and any probability ε > 0, there exists some outcome Y such that a ε-probability of Y is strictly preferred to a certainty of X. (Fanaticism is entailed by the formalism).
  2.  **Axiomatic Conflict:** There exists a conflict between the standard axioms justifying EU (Completeness, Transitivity, Continuity, Independence) and the desideratum that decisions should never be dominated by arbitrarily speculative, extremely low-probability, extremely high-stakes outcomes ("fanaticism-avoidance"). Satisfying all axioms *requires* fanaticism under unbounded U.
  3.  **Practical Consequence:** Under unbounded U + EU, interventions targeting existential risks (or other sufficiently high-stakes, low-probability outcomes) will *always* dominate interventions targeting finite, near-certain harms if the probability assigned to the high-stakes outcome is non-zero and the stakes are sufficiently large relative to the finite harm.
  4.  **The Mugger's Core:** Pascal's Mugging highlights a fundamental tension: EU with unbounded U dictates that sufficiently large stakes *must* outweigh any finite cost and any non-zero probability, no matter how small or unsupported, if the probability is strictly greater than zero. Both sides agree this is a direct consequence; they disagree on whether it's a fatal flaw.
  5.  **Tail Epistemic Status:** Probabilities assigned to outcomes in the extreme tail of a distribution (e.g., utilities exceeding 10^100 utils) are typically highly epistemically insecure. They are often based on speculative models, limited data, and are extremely difficult (if not impossible) to meaningfully calibrate or empirically constrain.
  6.  **No Free Lunch:** Avoiding fanaticism requires sacrificing at least one of: strict adherence to EU maximization, the unboundedness of U, or one of the standard EU axioms (typically Continuity or Completeness). There is no known decision theory that perfectly satisfies all standard EU axioms with unbounded U while systematically avoiding fanaticism in all conceivable cases.
  7.  **St. Petersburg Insight:** St. Petersburg-like paradoxes demonstrate that unbounded EU can lead to preferences that seem absurd when considered against finite resources or bounded time horizons. While the *specific* St. Petersburg paradox can be "solved" in various ways (e.g., bounding utility, probability discounting), it exemplifies the *structural tendency* of unbounded EU to prioritize tail events.
  8.  **Dominance vs. Speculation:** EU dominance arguments are compelling in finite, well-specified cases. However, their application to scenarios defined *solely* by speculative, ultra-low-probability, ultra-high-stakes outcomes relies critically on the agent's ability to assign *any* non-zero probability to those outcomes, however unsupported.
  9.  **Value Aggregation:** Both sides generally accept that decision theories should aim to aggregate value across states of the world proportionally to the probability and magnitude of value in those states. The core disagreement is about whether this aggregation *must* be linear and unbounded (EU) or can be non-linear/bounded to avoid domination by speculative tails.
  10. **Burden of Proof Asymmetry:** The Fanatics argue the burden is on the Tempered to justify *why* tail events shouldn't count proportionally if the utility function truly represents value. The Tempered argue the burden is on the Fanatics to justify why highly speculative beliefs about tail events *should* be allowed to dominate decisions when evidence for them is vanishingly weak.

  **Disagreements Table**

  | Crux (Neutral Wording)                                                                 | Fanatic Position (Self-Description)                                                                                         | Tempered Position (Self-Description)                                                                                          | Concrete Bearing Case                                                                                                                           | Fanatic Prediction                                                                                             | Tempered Prediction                                                                                              |
  | :------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------- |
  | **1. Is the extreme sensitivity of EU+Unbounded U to remote tail probabilities a necessary feature of rational value aggregation or a fatal flaw exposing irrational sensitivity?** | "Rational value aggregation requires that value differences in all possible states, however remote, contribute proportionally to their probability and magnitude. Ignoring tails violates dominance and separability." | "Rational decision-making requires robustness against epistemically ungrounded speculation. A theory hypersensitive to arbitrary, unsupported beliefs about extreme tails is practically irrational and normatively flawed." | **Case:** Two interventions: A saves 1 billion lives with certainty. B has a 10^-15 probability of saving 10^30 lives, else does nothing. Identical cost. EU+Unbounded U *must* prefer B. | Rational agents *should* prefer B, reflecting the true expected value calculation, however counterintuitive. Dominance demands it. | Rational agents will (and should) prefer A, recognizing the 10^-15 probability as epistemically vacuous and insufficient to override the near-certain massive good of A. |
  | **2. Does the "Manufactured Tail" (endogenous generation of speculative high-stakes scenarios) fundamentally break Unbounded EU, or is it merely a restatement of Pascal's Mugging?** | "The ability to imagine scenarios doesn't change the normative requirement. If an agent genuinely assigns non-zero probability to a self-generated outcome with sufficiently high utility, EU mandates acting on it. Refusing to do so violates the axioms." | "Endogenous tail generation reveals a unique pathology: decision priorities become arbitrary functions of computational effort or imaginative capacity, not world states. This undermines the theory's claim to track objective value or practical reason." | **Case:** An agent can spend resources computing/imagining new scenarios. For $X, they can conceive a novel scenario S_i with estimated P(S_i) = 10^(-12 - i) and U(S_i) = 10^(15 + i). Under Unbounded EU, how much $X is justified to spend seeking scenarios? | Spending is justified only if the *expected utility gain* from finding a better intervention via a new scenario exceeds the cost. The process itself is governed by EU. | The agent will (or should) cap spending on scenario generation arbitrarily low, recognizing the process leads to infinite regress or absurd resource allocation dominated by speculation. |
  | **3. Under second-order uncertainty (e.g., 70% Fanaticism, 30% Tempered Theory), does maximizing expected value across first-order theories inevitably lead to meta-fanaticism?** | "Maximizing expected value across possible decision theories is simply applying EU at the meta-level. If the stakes of choosing the *correct* theory are astronomical (which they are, given fanaticism's implications), then the meta-EU calculation will be dominated by the possibility that fanaticism is correct." | "Second-order uncertainty allows for a non-fanatical tie-break. We can apply a tempered rule (e.g., satisficing, using a risk-averse aggregator) to choose actions under normative uncertainty, preventing the fanatical theory from dominating simply because it claims the highest possible stakes." | **Case:** Agent assigns 70% prob that Fanaticism (Unbounded EU) is correct, 30% prob that a specific Tempered theory T (e.g., with bounded U) is correct. Must they always prioritize interventions favored *only* by Fanaticism due to its astronomical stakes claim? | Yes. The expected cost of being wrong if Fanaticism is true is unbounded, so it dominates the meta-EU calculation. Choosing otherwise ignores the catastrophic risk of being wrong. | No. The agent can use T (or a meta-rule like maximizing the minimum utility across plausible theories) to choose actions, prioritizing robustly good options over those reliant on speculative tails, even under normative uncertainty. |
  | **4. Can human credences in remote tail events (e.g., P(utility > 10^100)) be meaningfully calibrated or constrained by evidence, or are they inherently arbitrary?** | "While difficult, evidence can *in principle* constrain tail probabilities. The structure of physical laws, cosmology, and logic can provide bounds. Ignoring tails entirely based on current epistemic limitations risks profound value loss." | "For utilities exceeding levels relevant to any physically plausible cosmology or meaningful aggregation of value, human probability assignments are indistinguishable from arbitrary numbers pulled from thin air. No feasible evidence can distinguish between P=10^-20 and P=10^-100 for such events." | **Case:** Assess calibration of expert forecasts for events with claimed probabilities between 10^-10 and 10^-20 (e.g., specific catastrophic physics experiment failures, detection of certain beyond-standard-model phenomena within a century, success of wildly speculative technologies). | Over many such forecasts, the proportion of events occurring will roughly match the average probability assigned within reasonable confidence intervals, showing calibration is possible. | Forecasts in this range will show systematic miscalibration (e.g., overconfidence - too many "10^-15" events happen, or underconfidence - too few), or the probabilities will be effectively unfalsifiable, demonstrating their arbitrariness. |

  **Merely Verbal Disagreements:**

  *   **Definition of "Fanaticism":** Sometimes used pejoratively by the Tempered ("irrational obsession") vs. neutrally/positively by Fanatics ("logical consequence of valuing all possible states proportionally"). Clarifying that "fanaticism" here refers *only* to the structural consequence of unbounded EU (tail events dominating) resolves some heat.
  *   **"Rational":** Tempered often equate "rational" with "pragmatically robust" or "epistemically responsible," while Fanatics equate it with "axiomatically consistent" or "formally coherent." Explicitly separating these senses reduces confusion.

  **What Would Count as Evidence Against Each View?**

  *   **Against Fanaticism:** The development and widespread adoption of a bounded or non-EU decision theory that demonstrably outperforms EU in complex, high-stakes real-world domains (especially involving deep uncertainty and speculative tails) *without* violating core normative intuitions about dominance and consistency in non-tail cases, *and* where the theoretical justification doesn't rely on ad-hoc fixes solely for tails.
  *   **Against Tempered Approaches:** Rigorous empirical demonstration that human experts *can* reliably calibrate probabilities for outcomes involving utilities exceeding physically plausible bounds (e.g., >10^50 utils) at the 10^-15 to 10^-30 level, *and* that incorporating these into EU calculations leads to systematically better real-world outcomes compared to tempered alternatives in high-stakes decisions.
