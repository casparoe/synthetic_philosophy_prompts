prompt: |-
  hey — I run a fortnightly "no slides" session for about 12 engineers on my team (Thursdays, 90 minutes, everyone's already tired and slightly hostile, and we're a distributed systems group so anything that rhymes with quorum, consensus or bootstrap will land fast if you use it as a handle). The topic I want to do next is the thing where a system's rules include the rules for changing its own rules — someone told me there's a whole book about a game like this — and I have ran a sloppy 20-minute version of it with friends where it was fun but degenerated into pure trolling within about five minutes. What I actually want them to *feel* is something more specific that I can't quite name: that in a system that can amend itself there is always some part that can't be amended from inside, but that where that part sits is a choice and not a fact about the rules, and that the genuinely powerful move is usually to amend the thing that nobody ever classified as a rule at all — the score sheet, what counts as a turn, the fact that we're sitting in a circle. Can you design me a runnable session around that?

  Constraints: 12ish people, 90 minutes, one whiteboard, index cards, no money or prizes, and no lecture up front — I don't want to say the words "self-reference" or "meta" until the debrief. My engineers will immediately try to break the game, so I'd rather the rules and payoffs make breaking it feel like winning than spend the session fighting them. Two moments I'd like engineered in if you can manage it: (1) at some point they should generate a proposal whose legality depends on its own outcome — my naive idea was a rule like "any amendment that passes by exactly one vote is void" and then it passes by exactly one vote, but do something better if you've got one — and I want them to notice the difference between that and a proposal that's merely unpopular or blocked, because I think the blocked-vs-undecidable distinction is the actual payload and I care more about it than about the paradox itself being cute; and (2) there should be something in the room that I introduce as "not part of the game, just how we're keeping score" that turns out to be the thing worth capturing, so the discovery is that the inviolate level was the unclassified infrastructure and not the document. Deliverable-wise: a short initial rule set I can write on the board in two minutes, materials, a minute-by-minute timeline, a debrief that maps specific moments onto specific bits of the idea, an honest list of what will predictably go wrong the first time I run it (last time one guy filibustered, another tried to amend the seating arrangement, and I froze and just made a ruling, which I suspect was the most interesting thing that happened and I wasted it), and a frank note on which part of the idea the game simply can't produce and I'll have to say out loud myself. Also if there's a way to make it connect to that Escher picture of two hands drawing each other without me having to show anything, great, but don't force it. And please no reading list or papers at the end, I'm definately not going to read them.
reasoning: |-
  We are designing a session for 12 engineers, 90 minutes, no slides, with the goal of exploring self-amending systems and the concept of an immutable core that is actually a choice. We want to avoid upfront jargon and focus on experiential learning.

  Key design goals:
  1. Avoid terms like "meta" or "self-reference" until debrief.
  2. The session should allow for trolling/breaking, but that breaking should feel like winning (or at least be part of the learning).
  3. Two engineered moments:
     a. A rule proposal that is self-referential and whose legality depends on its own outcome (blocked vs. undecidable).
     b. An element introduced as "not part of the game" (like the score sheet) that becomes the key to control.
  4. Constraints: whiteboard, index cards, no money/prizes.

  Game Concept: We'll create a game with a mutable rule set. The game will start with a very simple set of rules and allow players to propose amendments. The key is that the rules govern how rules can be changed, and we want players to discover that there is an unamendable core (by design) and that the real power lies in changing the infrastructure (like the score sheet).

  Initial Rule Set (to be written on the whiteboard):

  Rule 0: The game is played in turns. Each turn, a player may do one of the following:
    a) Propose an amendment to these rules.
    b) Call for a vote on the current proposed amendment (if any).
    c) Pass (do nothing).

  Rule 1: Amendments must be written on an index card and read aloud by the proposer.

  Rule 2: To pass, an amendment must receive a majority vote of the players present. Ties mean the amendment fails.

  Rule 3: Once an amendment is passed, it becomes a new rule and is added to the whiteboard. Rules are numbered in order of passage (starting from 0, 1, 2, ... above).

  Rule 4: The game ends when the group unanimously agrees to end it, or after 90 minutes.

  Rule 5: The score is kept on the whiteboard. Each player starts with 0 points. Points may be awarded or deducted by rules.

  (Note: Rule 5 is our "infrastructure" that we hope they will notice and try to change. We are going to introduce the score as just a way to keep track, but it's actually part of the system that can be captured.)

  Materials:
  - Whiteboard (with the initial rules written)
  - Index cards (for writing amendments)
  - Markers

  Timeline:

  Minute 0-2: Write the initial rules on the whiteboard. Explain that this is a game about making rules, and the goal is to have fun and see what happens. Do not explain any deeper concepts.

  Minute 2-5: Quick verbal explanation of the initial rules. Emphasize that they can propose amendments to change the rules. Also, mention that the score is being kept on the whiteboard and that they start at 0. (Note: the score is introduced as a bookkeeping device, not as a rule.)

  Minute 5-60: Gameplay. The facilitator (you) will act as a moderator and scribe. You will:
    - Keep track of turns (go around the circle or let them self-organize? Let them self-organize to see if they change the turn order).
    - When a player proposes an amendment, give them an index card to write it down. They read it aloud, and you post it on the board (or a designated area) as a proposal.
    - When a player calls for a vote, you conduct the vote (by show of hands) and update the rules if it passes.
    - Also, update the score if a rule changes the score (but initially, there is no rule for changing the score, so unless they make one, the score remains 0 for everyone).

  During this time, you are a neutral arbiter. You do not intervene unless the rules require it. If they try to change something that isn't covered by the rules (like the seating arrangement), you can say: "The rules don't cover that, so it's not part of the game." But note: if they propose a rule that changes the seating, then it becomes part of the game if passed.

  Engineered Moment 1 (self-referential rule): We hope that someone will propose a rule that has a self-referential condition. If they don't, you can seed it by having a pre-written index card in your pocket that you can introduce via a confederate (if you have one) or as a player yourself? But note: you are the facilitator. Alternatively, if the group isn't generating it, you can wait and then in the debrief use a hypothetical. However, let's try to design so that it emerges.

  Idea for a rule that might cause a self-referential problem: 
    "Any amendment that passes by a majority of exactly one vote is void and does not become a rule."

  But note: if that rule passes by exactly one vote, then it would be void by its own terms. So if a vote occurs and it passes by exactly one vote, then we have a situation: if we apply the rule, then the rule is void and we don't add it, but then the condition for voiding (the rule itself) doesn't exist. This is a classic paradox.

  How to encourage this? We can't force it, but we can set the stage. For example, if the group is often having close votes, then someone might propose this rule to prevent narrow majorities. Alternatively, if they propose a rule that requires a supermajority, then we might get a close vote that fails by one, but that's not the same.

  Alternatively, we can design a rule that is inherently self-referential in a way that causes a problem. For example:

    "This rule cannot be repealed."

  But that's not about the vote outcome. We want the legality to depend on the outcome.

  Another idea: 
    "Any rule that is passed at a time when the total number of rules is even is void."

  But then if the current number of rules is odd, and we pass this rule, then the number of rules becomes even, so it should be void? But then we remove it, making the number odd again? This is also a paradox.

  But note: we are trying to highlight the difference between a rule that is blocked (e.g., because it doesn't get enough votes) and one that is undecidable (because of self-reference). So we need a situation where the rule passes, but then the rule itself says it is invalid. Then we have a contradiction.

  To increase the chance of this happening, we can have a rule that requires a certain condition that is met by the vote that passes it. For example:

    "Any amendment that passes with exactly 7 votes is void."

  Then if this rule passes with 7 votes, we have a problem.

  But we have 12 players. So 7 is a majority (since 12/2=6, so 7 is majority). So if 7 people vote yes, then the rule passes, but then the rule says it is void. What do we do?

  As the facilitator, you are in a bind. You have two options:
    Option A: Apply the rule and void it, but then the rule isn't there to void it? So we are in a loop.
    Option B: Refuse to apply it because it's paradoxical? But the rules don't say anything about that.

  This moment is GOLD. You want the group to experience the confusion and then try to resolve it. They might propose a new rule to handle such cases, or they might ignore it and move on. Either way, in the debrief, we can point to this as the moment when they encountered a rule that was not blocked (it passed) but was undecidable (we cannot consistently apply it).

  Engineered Moment 2 (capturing the infrastructure): We have introduced the score as just a way to keep track. We hope that at some point, a player will propose a rule that changes how the score is kept, or even that they propose to change the medium (e.g., from whiteboard to index cards). Alternatively, they might try to change the turn structure or the fact that we are using index cards.

  But note: the initial rules don't say anything about the score being part of the rules. It's introduced as a bookkeeping device. So if they try to change the score, they might not think of it as an amendment. How can we set this up?

  We can have a rule that awards points for certain actions. For example, if a player proposes a rule that passes, they get a point. But that rule has to be passed. So initially, there is no way to change the score. The players might notice that the rules don't specify how to change the score, so they might propose a rule about the score. That would be capturing the infrastructure.

  But we want them to go further: change the score sheet itself. For example, change from a whiteboard to a different medium, or change the scoring system (from points to tokens, etc.). Or even change the facilitator? But that might be too much.

  Alternatively, they might try to change the rules about rule-making itself, which is the meta-level. But we also want them to notice that the infrastructure (the physical setup) is not covered by the rules and can be changed by a rule.

  Timeline Continued:

  Minute 60-75: Wind down the game. If they haven't ended it by unanimous consent, you can announce that there are 15 minutes left and then call for a vote to end the game (but note: the rule says unanimous, so if one person objects, it continues). You might have to let it run until 75 minutes and then force an end for debrief.

  Minute 75-90: Debrief.

  Debrief Structure:

  1. Start by asking: "What happened? What did you notice?"
  2. Guide the conversation to the two key moments if they happened. If they didn't, you can bring them up as hypotheticals.

  For the self-referential rule moment (if it happened):
     - Ask: "Remember when we passed that rule that passed by exactly one vote? What happened then? How did we resolve it?"
     - Point out: This rule created a situation where we couldn't consistently apply it. It wasn't that it was blocked by the existing rules (it passed), but the rule itself made it impossible to enforce. This is different from a rule that just doesn't get enough votes.

  For the infrastructure moment:
     - Ask: "Did anyone try to change the way we were keeping score? Or the index cards? Or the whiteboard?"
     - If they did, ask: "How did that happen? Was that covered by the initial rules?"
     - Point out: The initial rules didn't mention the score as a rule, but it was part of the system. By changing it, they changed the infrastructure. The truly powerful move is to change the parts that aren't classified as rules.

  3. Then, introduce the concepts: 
     - In any self-amending system, there is always an immutable core. But that core is a choice. In this game, the initial rules were written on the board, but they could be changed. However, the process of changing them (the rule-making rules) was part of the initial rules. But note: Rule 0-5 were amendable. So what was immutable? 
     - The real immutable core is the facilitator (you) and the physical setup? But then they might have changed that if they had a rule? Actually, they didn't have a rule about the facilitator. So the facilitator was outside the system until they brought it in by a rule.
     - The key insight: The system can be designed so that the immutable core is very small (like the fact that we are playing a game) and everything else is mutable. And the most powerful moves are when you change the things that were thought to be outside the system.

  4. Connect to the Escher drawing: Without showing it, you can say: "It's like a system that defines itself. The rules for changing the rules are part of the rules. But then you can have a situation where two rules depend on each other, like two hands drawing each other. We saw a glimpse of that when we had the rule that voided itself."

  Predictable Problems:

  1. Filibustering: A player might just keep proposing rules or talking a lot. 
     - Mitigation: The rules don't specify time limits, so they can do that. But if it becomes a problem, you can note that the rules don't prohibit it. Or, hope that the group passes a rule to limit speaking time.

  2. Amending the seating arrangement: If someone tries to change the seating, you can say: "The rules don't cover that, so you can't do it as part of the game." But if they then propose a rule that says "The facilitator must reseat the players according to a vote", then if that passes, you have to do it. So that's part of the game now. And that's a win! They captured the infrastructure.

  3. You freezing and making a ruling: This time, if a situation arises that the rules don't cover, don't make a ruling. Instead, say: "The rules don't specify what to do in this case. How should we handle it?" and let them propose a rule to cover it. That way, you are not the authority; the rules are.

  4. Trolling: If they try to break the game, let them. For example, if they pass a rule that says "Everyone gets 1000 points", then the score becomes meaningless. That's fine. In the debrief, you can talk about how the score system was vulnerable because it wasn't protected by rules.

  5. The self-referential rule might not happen. Then in the debrief, you can pose it as a hypothetical: "What if someone proposed a rule that said any rule passed by exactly one vote is void? And then it passed by exactly one vote? What would happen?" Then discuss.

  Frank note on what the game can't produce: 
     - The game might not make explicit the idea that the immutable core is a choice. They might not realize that they could have designed the rule-changing rules differently to have a smaller or larger immutable core. You might have to explain that in the debrief.

     - Also, the connection between the physical infrastructure (the room, the whiteboard) and the abstract rules might not be made. You might have to point out that the whiteboard was just a tool, but by making a rule about it, they brought it into the system.

     - The distinction between blocked and undecidable might be too subtle. You might have to explain it explicitly.

  Revised Initial Rule Set (to increase chances of the moments):

  After thinking, let's adjust the initial rules to make the score more prominent and to have a potential for close votes.

  Rule 0: The game is played in turns, going clockwise. Each player has 1 minute per turn. (This might help with filibustering, but it also might be too restrictive. Alternatively, don't have a time limit and see what happens.)

  But we don't want to over-constrain. Let's keep it simple as originally written, but add:

  Rule 5: The score is kept on the whiteboard. Each player starts with 0 points. 
  Rule 6: If a player's proposed amendment passes, that player gains 1 point.

  Now we have a rule that awards points, so the score is part of the rule system. But we want them to change the way the score is kept? Maybe Rule 5 and 6 are too embedded. So let's revert to the original Rule 5 without the awarding.

  Alternatively, we can have:

  Rule 5: The score is kept on the whiteboard. Each player starts with 0 points. Points can only be changed by a rule that explicitly awards or deducts points.

  This way, they have to make rules to change points, but the score-keeping method (whiteboard) is fixed unless they change it.

  But note: the whiteboard isn't mentioned in the rule. So if they propose a rule to move the score to index cards, that would be changing the infrastructure.

  So we'll stick with:

  Rule 5: The score is kept on the whiteboard. Each player starts with 0 points.

  And then we don't have any rule that changes the score. So they have to make a rule to change the score. But the method (whiteboard) is part of the rule? Actually, the rule says "kept on the whiteboard", so if they want to change that, they must amend Rule 5.

  That's good because then they can change Rule 5 to say "kept on index cards" or something. That would be capturing the infrastructure.

  So initial rules:

  Rule 0: The game is played in turns. Each turn, a player may do one of the following:
    a) Propose an amendment to these rules.
    b) Call for a vote on the current proposed amendment (if any).
    c) Pass (do nothing).

  Rule 1: Amendments must be written on an index card and read aloud by the proposer.

  Rule 2: To pass, an amendment must receive a majority vote of the players present. Ties mean the amendment fails.

  Rule 3: Once an amendment is passed, it becomes a new rule and is added to the whiteboard. Rules are numbered in order of passage (starting from 0, 1, 2, ... above).

  Rule 4: The game ends when the group unanimously agrees to end it, or after 90 minutes.

  Rule 5: The score is kept on the whiteboard. Each player starts with 0 points.

  Now, note: there is no rule for changing the score. So if they want to award points, they must amend Rule 5 or add a rule that awards points. But Rule 5 specifies the whiteboard. So if they change Rule 5, they can change the medium.

  We are not specifying turn order. That's intentional. They might try to change the turn order, and that would be an infrastructure change (how the game is organized). But the rules don't specify, so they can propose a rule about turn order.

  Final Timeline:

  0-2 min: Write rules on board.
  2-5 min: Explain rules. Mention that the score is on the board and they start at 0. Explain the three actions (propose, call vote, pass). 
  5-75 min: Gameplay. You moderate. 
     - You keep track of whose turn it is? But the rules don't specify. So let them self-organize. If they don't, you can suggest they go in a circle, but don't write it as a rule. If they want to change it, they can propose a rule.
     - If there is a proposed amendment, you write it on the board as a proposal (or post the index card) until it's voted on.
     - After a vote, if it passes, you add it to the rules and renumber (so Rule 6, 7, etc.). Also, if the rule changes the score, update the score.
     - If they try to do something not in the rules, refer to the rules. If it's not covered, say so and let them propose a rule.

  75-90 min: Debrief as above.

  Deliverable:

  - Initial rule set (as above).
  - Materials: whiteboard, markers, index cards.
  - Timeline: as above.
  - Debrief: 
     a. Start with open reflection.
     b. Guide to key moments (if they happened).
     c. Explain the concepts: self-amending systems, immutable core (which is a design choice), and the power of changing the infrastructure.
     d. Highlight the blocked vs. undecidable distinction using the self-referential rule example (real or hypothetical).
     e. Point out how the score (or the turn order, or the index cards) were initially just infrastructure but became part of the game when they made a rule about them.

  Predictable Problems:
     - Chaos without turn order: They might talk over each other. Solution: Let them figure it out. If it becomes too chaotic, they will propose a turn order rule.
     - The self-referential rule might not emerge. Be prepared with a hypothetical.
     - They might not touch the score. Then in debrief, ask: "Did anyone think about changing the way we kept score? Why not?"
     - They might end the game early by unanimous consent. Then start the debrief early.

  Frank note: The game might not make them realize that the immutable core is a choice. They might think that the initial rule-making rules were set in stone. You will have to explain that the designers of such systems can choose what is immutable and what is not. For example, they could have had a rule that Rule 0 is unamendable, but they didn't. So everything was amendable. The only thing that wasn't amendable was the fact that the facilitator was interpreting the rules, until they amended that.

  Also, the connection to distributed systems (quorum, etc.) is not explicit. But you can draw the analogy: in a distributed system, the rules for changing the configuration are part of the configuration, and you have to be careful about self-reference and bootstrap.

  And no reading list.

  Good luck!
answer: |-
  Here’s a runnable session designed for your constraints, goals, and engineered moments. It leans into your group’s tendency to "break" things by making rule-breaking a path to discovery. The core insight—**the true power lies in amending the unclassified infrastructure (e.g., the score sheet), not just the rules, and the distinction between blocked vs. undecidable proposals**—emerges through gameplay. Debrief ties it together.

  ---

  ### **Game Name:** **The Mutable Circle**  
  *(Avoids jargon like "quorum" or "meta"; implies self-reference through action)*  

  ---

  ### **Materials & Setup (2 min)**  
  - **Whiteboard:** Draw a circle with 12 dots (seats) around it. Label dots P1 to P12.  
  - **Rules:** Write only these 5 initial rules:  
    > 1. **Turns:** Players act clockwise. On your turn, do **one**: Propose a rule change, Call a vote, or Pass.  
    > 2. **Proposals:** Write amendments on index cards. Read aloud.  
    > 3. **Voting:** Majority vote passes an amendment. Ties fail.  
    > 4. **Score:** Track points here [point to a blank area below rules]. Start at 0.  
    > 5. **End:** Game stops at 90 min or if all players vote to end.  
  - **Infrastructure:**  
    - Place a stack of index cards and pens in the center.  
    - **Casually mention:** *“Points are tracked here for fun—not a rule, just bookkeeping.”* (This is your “unclassified” score sheet).  

  ---

  ### **Timeline (90 Min Total)**  
  **0–5 min: Brief + Start**  
  - Explain rules verbatim in <3 min. Emphasize: *“Goal? Up to you. Change rules, score points, or break things—just play.”*  
  - Start turns at P1.  

  **5–65 min: Gameplay (Facilitator Role: Neutral Scribe)**  
  - **Your job:**  
    - Enforce turn order rigidly (unless amended).  
    - Write passed rules on the board. Number sequentially (Rule 6, 7, ...).  
    - Update scores *only* if a rule mandates it. Otherwise, ignore pleas to change points.  
    - **Never** lecture. If asked procedural questions: *“What do the rules say?”*  
  - **Predictable Chaos & Engineered Moments:**  
    - **Breaking Infrastructure (Goal: Capture the score sheet):** Players will try to award points early. Since Rule 4 doesn’t specify *how* to change points, they’ll realize they must amend it (e.g., *“Add: Proposer gets 1 point if amendment passes”*). **Key:** When passed, erase the old score and start anew. Visually reinforce that the “bookkeeping” is now part of the game.  
    - **Self-Referential Proposal (Goal: Blocked vs. Undecidable):** Players will propose contradictory rules. If no one generates a self-dependent one by minute 40, subtly seed it:  
      - Whisper to a player: *“What if you propose: ‘Any rule passing by exactly one vote is void.’?”* (They’ll likely do it—engineers love chaos).  
      - **When voted:** If it passes by one vote, freeze. Ask: *“Do we add this rule? It says it’s void if it passes by one vote... which it just did.”* Force the group to argue. Don’t resolve it—highlight the deadlock.  

  **65–75 min: Force Reflection**  
  - Interrupt: *“10 min left. Propose final rules or call to end.”*  
  - If they vote to end early, proceed to debrief.  

  **75–90 min: Structured Debrief**  
  *(Map moments to concepts without jargon)*  

  ---

  ### **Debrief Script (15 Min)**  
  **1. Open Reflection (5 min):**  
  - *“What happened? What felt powerful/frustrating?”*  
  - Listen: They’ll mention chaos, points, or the frozen vote.  

  **2. Map Moments to Concepts (7 min):**  
  - **Infrastructure Capture (Score Sheet):**  
    - *“Remember when you changed how points worked? At first, I said scores were ‘just bookkeeping.’ But once you amended Rule 4, you controlled the tracker. The most powerful moves target things nobody calls a ‘rule’—the score sheet, turn order, even this whiteboard.”*  
    - **Connect to Insight:** *“In self-amending systems, the ‘immutable’ part is a choice. You chose to make the score part of the rules—it wasn’t sacred.”*  
  - **Self-Referential Proposal:**  
    - *“Remember the rule that voided itself if it passed by one vote? It passed by one vote. What happened?”*  
    - Listen: They’ll say it was stuck, confusing, or ignored.  
    - **Draw Distinction:**  
      - *“Contrast that with a rule that just loses a vote. That’s blocked—it fails, no paradox. But this? Its legality depended on its own outcome. It wasn’t blocked; it was undecidable. You couldn’t apply it without looping. That’s the payload: self-amendment risks creating holes where logic can’t go.”*  
  - **Escher Connection (Optional):**  
    - *“Ever seen Escher’s drawing of two hands drawing each other? That’s what self-reference looks like—each defines the other. We saw a glimmer when your rule tried to validate itself. It’s elegant until it collapses.”*  

  **3. Final Insight (3 min):**  
  - *“Today, you felt three things:  
    - The leverage in amending ‘infrastructure’ (like the score).  
    - The difference between a blocked proposal (voted down) and an undecidable one (self-consuming).  
    - That the ‘immutable core’ isn’t a fact—it’s a choice. You could’ve made Rule 5 unamendable... but you didn’t. You chose to leave everything mutable except the facilitator’s neutrality.”*  
  - **No reading list.** End.  

  ---

  ### **Predictable Problems & Mitigation**  
  1. **Filibustering/Off-Topic Proposals (e.g., amending seating):**  
     - *Let it happen.* If they propose “Swap seats with P7,” say: *“Rules don’t cover seating. Propose it as a rule change.”* If passed, enforce it—it proves infrastructure is mutable. **Win:** They capture “immutable” context.  

  2. **You Freezing + Making a Ruling:**  
     - **Do this:** When stuck (e.g., self-voiding rule), ask: *“What should Rule X say about this?”* Force *them* to propose a fix. If you accidentally rule, confess in debrief: *“My ruling was an external override—like an unamendable bootstrap. You could’ve captured it by writing a rule about my role.”*  

  3. **Trolling/Destruction:**  
     - **Embrace it:** If they pass “Everyone gets 100 points,” update the score. If they abolish voting, enforce it. **Debrief win:** *“You broke the game by amending infrastructure. That’s the point—the real power is there.”*  

  4. **Self-Referential Rule Doesn’t Happen:**  
     - Use the hypothetical in debrief. Ask: *“What if someone proposed ‘Void if passed by one vote’ and it passed by one vote? How would you resolve it?”* Contrast with a voted-down rule.  

  5. **Score Ignored:**  
     - If no one amends Rule 4, debrief: *“Did you consider changing the score? Why not? It was presented as ‘just bookkeeping’—but it was always vulnerable.”*  

  ---

  ### **Frank Gaps & Mitigation**  
  - **What the Game Can’t Produce:** Players may not explicitly realize **the immutable core is a choice**. They’ll feel its effects but not articulate the design freedom.  
    - **Fix:** Say it in debrief: *“You could’ve made Rule 1 unamendable. But you didn’t. The ‘fixed’ part of any system is a decision, not a law of nature.”*  
  - **Distributed Systems Connection:** The game mirrors consensus bootstrap (e.g., changing cluster membership rules). But let them draw parallels—don’t force it.  

  ---

  ### **Why This Works for Your Group**  
  - **Breaking = Winning:** Trolling (e.g., absurd point rules) exposes infrastructure’s vulnerability. Filibustering tests turn-order mutability.  
  - **Engineered Moments Delivered:**  
    - Self-referential rule causes tangible deadlock (undecidable ≠ blocked).  
    - Score sheet shifts from “neutral” to contested—proving unclassified infrastructure is the key.  
  - **No Prep:** Rules fit on a board. Index cards enable rapid proposals.  
  - **Debrief Roots Theory in Lived Chaos:** Moments map cleanly to concepts.  

  Run it cold—your engineers’ hostility will fuel discovery. When they “break” the score sheet or deadlock a vote, they’ve won.
