prompt: |-
  I spent thirty-odd years as an experimental physicist — magnetic resonance, mostly in solids — and since retiring I have been sitting in on a graduate reading group in philosophy of public policy, which this term has been working through the literature on nudging and choice architecture. What I have found is that I hold quite firm verdicts about individual interventions while having no idea what, if anything, they add up to, and my suspicion, trained into me in a field where one distrusts a theory with more adjustable parameters than constraining data, is that any principle tidy enough to be worth having will force me to give up at least one verdict. So let me simply report them. (1) A hospital cafeteria moves the fruit to eye level and the pastries to a low shelf behind the till: fine, and barely worth discussing. (2) Automatic enrolment in a pension scheme with a standing option to opt out — my own university did this to me in the 1990s, I never opted out, and I am glad: fine. (3) Making the stairs more pleasant and prominent so that fewer people take the lift: fine. (4) Slowing the lift down so the stairs become the quicker route, with the same effect on behaviour and the same time costs: I dislike this, and I do not think my dislike is really about the few seconds. (5) A supermarket chain placing its highest-margin own-brand goods at eye level and the cheap staple on a bottom shelf: not fine — yet so far as I can tell the mechanism is the one I waved through in case 1. (6) An opt-out organ donor register, where you are a donor unless you record otherwise: fine, though I am uneasy that much of its effect comes from people who have never formed a view. (7) An end-of-life planning form on which one of the resuscitation options is pre-selected: not fine, even though it is the same kind of default as in case 6 — and I think I would say this whichever option were pre-selected. (8) A tax reminder letter stating truthfully that most people in the recipient's area pay on time: fine. (9) The same letter with the figure quietly inflated so that the descriptive norm is false: not fine, even if it works better. (10) A clinic's text message reading that a slot has been saved for you and that you should reply only if you cannot come: I go back and forth, and mostly I think it is fine. (11) A flu-shot letter telling over-seventies that most people their age have already been vaccinated, where that is true but true only because the campaign has been running for three years and the letters are part of why: I genuinely do not know. (12) A phone app that uses infinite scroll and irregularly timed notifications to keep me on it: not fine. (13) My own placing of the alarm clock across the bedroom so that I cannot reach it from bed: fine, and not even the same kind of moral question. (14) A one-page plain-language risk chart given to patients so that they can do the reasoning themselves rather than being steered: fine, and in some way I cannot articulate I think it is better than the steering, though perhaps it simply is not a nudge at all.

  The only principle I have managed to cobble together myself has two clauses, and I would like you to test it against these cases and repair it rather than humour it. First clause: what I call index fidelity — a nudge is permissible only if its direction is set by the nudgee's own ends rather than the nudger's, where those ends may be indexed coarsely, to a population majority as in case 6, or finely, to something the individual has herself chosen as in case 2, and where degradation counts as steering just as much as promotion does. Second clause: disclosure elasticity — imagine running any intervention in two arms, one in which the mechanism is explained in plain language before it operates and one in which it is not; let the elasticity be one minus the ratio of the disclosed effect to the undisclosed effect, and treat a high elasticity as a bad sign, since it suggests the device works only on something the agent would otherwise resist. My worry is that these two clauses pull in different directions, and that the elastic ones are not always the bad ones and the well-indexed ones are not always the good ones.

  So: give me the principle you think best captures the pattern, or at most two or three candidate principles if the choice is genuinely open, each clause tied to the case that motivates it, with no preamble and with your bottom line in the first sentence. Tell me which of my verdicts each candidate cannot accommodate and which one you would overturn, say whether index fidelity and disclosure elasticity are worth keeping in any repaired version or are mirages, tell me what the repaired principle predicts for cases I have not listed — nudges aimed at goals the nudgee rejects, defaults set by employers for employees, choice architecture aimed at children, and interventions that try to make people more patient rather than merely better off — and finally tell me what it says about the appointment text in case 10 and the bootstrapped flu letter in case 11, which are the two I actually have to form a view about, since I have been asked to help draft both.
reasoning: |-
  Okay, let me try to unpack this fascinating query from a retired physicist turned philosophy enthusiast. The user presents 14 nuanced cases of nudges with strong intuitive judgments but seeks an overarching principle - a very physicist-like demand for coherence amid complexity. 

  First, I notice their scientific background shines through in how they diagnose their own dilemma: distrust of theories with too many free parameters. That's key - they want a principle that's falsifiable, not just flexible enough to rationalize any outcome. Their proposed "index fidelity" and "disclosure elasticity" concepts are impressively systematic for a newcomer to philosophy, though they rightly sense tension between them.

  Hmm... the cases cluster into clear patterns. Interventions they approve (1-3,8,10,13-14) share either perfect alignment with the nudgee's known interests (like pension enrollment) or pure environmental optimization (like staircase design). Their objections (4,5,7,9,12) involve deception, hidden agendas, or overriding latent preferences. The tough cases (6,10,11) reveal discomfort with exploiting cognitive limitations even for good ends.

  For the flu shot letter (case 11) - the core unease seems to be about circular justification. The norm is only true because of the intervention itself, which feels epistemically unstable. But unlike the inflated tax letter (case 9), it's not false... just self-referential. Maybe the distinction is whether the nudge creates the fact or merely reports it? 

  The appointment text (case 10) is clever - it exploits the default effect but feels innocent because cancellations genuinely help resource allocation. The user's back-and-forth likely stems from whether this crosses from "helpful reminder" to "manipulation of social obligation." 

  Their proposed principles need refinement. Index fidelity is powerful but too rigid - sometimes well-meaning nudges (like organ donor defaults) work precisely because people haven't formed preferences. Disclosure elasticity is perceptive but fails for cases like the pension default where transparency wouldn't reduce effectiveness. 

  A better unifying framework might be: "Nudges are permissible when they (a) align with the nudgee's reasonably attributed values, (b) preserve future choice integrity, and (c) don't exploit cognitive defects as the primary mechanism." This explains why slowing elevators (undermining autonomy) feels worse than improving stairs (expanding options), and why commercial eye-level placement (hidden profit motive) fails while fruit placement (attributed health interest) passes.

  For their drafting tasks: The clinic text (10) passes because it preserves all options transparently. The flu letter (11) is trickier - using a self-created norm isn't inherently wrong, but should add context like "this includes many who received earlier invitations" to avoid false impressions.
answer: |-
  Here's the distilled principle that best captures your verdicts while addressing the tensions in your clauses:

  **"Nudges are permissible when they (a) enhance rational agency by making pre-existing preferences easier to execute, or (b) rely on transparently constructed defaults that preserve corrigibility and don't exploit cognitive defects."**

  ### How It Handles Your Cases:
  - **Accommodates all verdicts except #6**: Your unease about organ donation defaults (exploiting unformed preferences) conflicts with approval. The principle flags this as problematic (fails "pre-existing preferences" and exploits inattention).
  - **Overturns your #6 verdict**: Opt-out organ donation becomes impermissible under this principle because it primarily exploits inertia in absence of preferences.
  - **Retains core insights**: 
    - *Index fidelity* → Captured by "pre-existing preferences" and "corrigible defaults"
    - *Disclosure elasticity* → Embedded in "transparently constructed" and "don't exploit cognitive defects" (high elasticity often signals exploitation)

  ### Predictions for New Cases:
  1. **Nudges toward rejected goals** (e.g., vegan defaults for meat-lovers): *Impermissible* – violates pre-existing preferences.
  2. **Employer defaults for employees** (e.g., 401(k) enrollment): *Permissible* if aligned with typical retirement goals and easily opted out (matches your #2).
  3. **Nudges for children** (e.g., fruit at eye level): *Permissible* if promoting health (attributable preference) without deception.
  4. **Patience-building nudges** (e.g., round-up savings apps): *Permissible* if transparent and aligned with long-term welfare (attributable preference).

  ### Specific Verdicts on Your Cases:
  - **#10 (Appointment text):** **Permissible**. Enhances execution of pre-existing commitment ("I need this appointment") using a transparent default. Corrigibility preserved (easy cancellation).
  - **#11 (Flu-shot letter):** **Impermissible**. The descriptive norm is bootstrapped, creating a false impression of organic consensus. Exploits social proof mechanism via misleading context (even if technically "true").

  ### Why This Principle Works:
  - **Solves your clause tension**: Distinguishes between *execution support* (low disclosure elasticity acceptable) and *preference-shaping* (requires transparency/corrigibility).
  - **Addresses your unease**: 
    - Rejects commercial exploitation (#5) and manipulative design (#12) as exploitation of cognitive defects.
    - Condemns slowing elevators (#4) as actively degrading options rather than enhancing choice.
    - Validates self-nudges (#13) as pure preference-execution.
  - **Explains #7 vs #6**: Resuscitation form (#7) involves deeply personal preferences – defaults here override latent values. Organ default (#6) exploits indifference.

  **Bottom Line**: Nudges should either help people act on what they already want, or use honest, easily overridden defaults when preferences are unformed – never manipulating through obscured friction or manufactured norms.

