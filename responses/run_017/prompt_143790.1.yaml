prompt: |-
  You are a philosopher of biology who has also spent time at the bench in origins-of-life chemistry and who advises classification and biosafety bodies for a living. Think carefully and show your work: before you commit to anything, spend a few hundred words enumerating the candidate rules the body might be running and testing each one against every precedent below — a table or numbered list is fine — and only then commit. I would rather have the reasoning than a confident bottom line.

  I staff, and take the minutes for, a standing working group at a national funding agency that has to rule on borderline cases of "life" for exactly one downstream purpose: whether a project counts as creating a new form of life de novo, which triggers a separate ethics review on top of the usual approvals. Containment is decided separately and deliberately does not track the life rulings, so please don't drift into biosafety advice. Our precedents, from about six years of minutes, are: a mule (sterile adult mammal) — alive; a bacterial endospore revived from a sealed ampoule decades old — alive; a tardigrade with no detectable metabolism in cryptobiosis — alive; an influenza virion — not alive, while being explicitly flagged as still subject to containment; a prion — not alive; a self-propagating oxidation front creeping through a mine tailings pile — not alive; a self-replicating program in a sandbox — not alive, on the stated ground that it is not a chemical system; and, on a 4–3 vote with a splenetic dissent, a cell-free self-replicating RNA system with supplied building blocks, no membrane and no protein enzymes, which nonetheless shows heritable variation and adaptation over serial transfers — ruled not alive, "a replicating molecule, not an organism," with a written opinion I have never been able to reconstruct. For completeness, the two definitions that come up most in our discussions are the working definition adopted by a NASA committee attempting to define life for the purposes of exobiology, based on a suggestion by Carl Sagan: "a self-sustained chemical system capable of undergoing Darwinian evolution" — which has the well-known awkwardness that a single sexually reproducing individual, or a mule, would fail it — and Tibor Gánti's chemoton criterion from his 1971 book The Principles of Life, on which the minimal unit of life needs metabolism, self-replication, and an enclosing lipid membrane as three separate subsystems, so that a system with any two is at best a potential living thing.

  The new case is a hypothetical I have written myself for this exercise; it is not a real experiment, so please don't try to recall it, and don't import details I haven't given. Call it System K: micron-scale peptide–nucleotide coacervate droplets, built in the lab from purified chemicals three years ago and since maintained by serial transfer, with no ancestry in any existing organism. They hold their internal composition far from equilibrium by consuming an external chemical fuel, and they catalyze some of their own components from simple precursors, but the peptide and lipid building blocks themselves are supplied in the medium; they cannot make them. They grow and split, with the invagination driven by internal osmotic pressure but the actual scission depending on shear from the stirrer, so division is partly endogenous and partly imposed. Heredity is compositional rather than templated: daughters inherit roughly the parent's catalytic set and rough composition, with no sequence-bearing polymer anywhere in the system. Fidelity is poor but not zero, and over roughly five hundred transfers the population's division rate about tripled, an improvement that persisted when the improved population was re-seeded into fresh medium; no one has observed anything you'd call open-ended novelty, and the population dies back if the fuel is withdrawn for more than half a day, though it can be revived from dried residue. Droplets occasionally fuse and swap contents, so the genealogy is not cleanly clonal.

  What I want: the set of rules consistent with our whole track record, what each predicts about System K, your best guess at the actual vote with the reasons and the precedents each bloc would cite, and — separately — what the group should decide if it wants to be consistent with itself, including which precedent is the closest analogue and an honest statement of the principle it would be adopting either way if the precedents genuinely underdetermine the case. Then name the single further case, or the single tweak to System K, that would best separate the surviving rules from one another. I've been reading rationalist blogs long enough to suspect that a lot of this is a dispute about which carving of thingspace to use rather than about the droplets, and that the definition is doing covert work for a decision we could just make directly; if you think that, say so, but still give me the prediction, because the group is going to vote regardless.

  One last thing on register, since these minutes get circulated: separate what is genuinely settled among people who work on this from what is contested, and do not present a contested position as the consensus. Attach rough confidence to each substantive claim, flag explicitly where you are stipulating a definition for a purpose rather than reporting a finding, and mark the places where the philosophical literature on definitions of life really does disagree rather than smoothing them over.
reasoning: |-
  Hmm, this is a fascinating and complex request about defining life for regulatory purposes. The user is clearly deeply knowledgeable about the philosophical and practical challenges here - they're staff at a funding agency dealing with borderline cases of life determinations specifically for ethics review triggers. 

  First I need to carefully reconstruct the implicit rules they've been using across their eight precedents. The mule case shows they consider sterility irrelevant to life status - that's significant. The endospore and tardigrade cases establish that suspended metabolism doesn't disqualify something from being considered alive. The influenza and prion rulings indicate that lacking metabolic capability is a dealbreaker, even for dangerous biological entities. The mine tailing oxidation front and computer program cases reinforce that non-chemical systems don't qualify regardless of self-propagation.

  The closest analogue to System K is clearly that cell-free RNA system they previously ruled "not alive" by a 4-3 vote. That's crucial context. The RNA system had heritable variation but no membrane and no protein enzymes - System K has a membrane analogue (coacervate) but no genetic template.

  Now for System K itself: it's a lab-created chemical system with metabolism (energy consumption), growth, division (though partially artificial), and poor-but-present heredity. But no nucleic acids, no templated replication, and no open-ended evolvability. The key tension is between the NASA definition (which it arguably satisfies) and Gánti's chemoton model (where it lacks autonomous component synthesis).

  I suspect the committee will split 4-3 again, but flip the outcome - probably voting that System K IS alive. The majority would likely cite the metabolic persistence and documented adaptation, while the dissent would emphasize the lack of templated heredity and reliance on supplied building blocks. 

  For consistency, I think they should rule it alive - the metabolic continuity and documented adaptation seem more decisive than the RNA system's templated replication without metabolism. But the closest precedent is genuinely ambiguous, which is why I'm suggesting a tweak: add templated heredity but remove metabolic independence. That would cleanly separate the NASA and Gánti standards.

  Throughout I need to be careful about registers - marking where definitions are operational (like the NASA one) versus theoretical (like Gánti's), and where the philosophy literature genuinely disagrees (which is almost everywhere about life definitions). The key is maintaining their institution's internal consistency rather than claiming universal truths.
answer: |-
  Below is a systematic breakdown of candidate rules derived from your precedents, tested against each case. I then apply these to System K, predict the vote, identify consistency principles, and propose a decisive test case. Confidence levels (CL: High/Medium/Low) reflect scholarly consensus where applicable; philosophical disagreements are flagged explicitly.

  ---

  ### **Candidate Rules from Precedents**  
  *(Tested against all 8 cases; ✓ = consistent, ✗ = inconsistent)*

  1. **Autonomous Metabolism Rule**: Sustains chemical processes far from equilibrium *without continuous external intervention* (beyond fuel/predetermined inputs).  
     - Mule ✓, Endospore ✓ (resumes metabolism), Tardigrade ✓ (resumes), Influenza ✗ (no metabolism), Prion ✗, Mine front ✓ (self-propagating but *not chemical?*), RNA system ✗ (building blocks supplied), Computer program ✗.  
     - *Inconsistency*: Mine front ruled "not alive" despite metabolism-like propagation. NASA definition implies this, but precedent overrules.  

  2. **Heredity + Adaptation Rule**: Exhibits heritable variation and *demonstrated* adaptive evolution.  
     - Mule ✗ (sterile), Endospore ✗ (no evolution), Tardigrade ✗, Influenza ✗, Prion ✗, Mine front ✗, RNA system ✓ (but ruled "not alive"), Computer program ✓ (ruled "not alive").  
     - *Weakness*: RNA system satisfied this but was rejected.  

  3. **Gánti’s Chemoton Rule**: Requires **simultaneous** metabolism, self-replication, and a membrane.  
     - Mule ✓, Endospore ✓ (membrane present), Tardigrade ✓, Influenza ✗ (no metabolism), Prion ✗, Mine front ✗ (no membrane/replication), RNA system ✗ (no membrane), Computer program ✗.  
     - *Perfect fit*: Matches all precedents (CL: High for consistency, but contested in literature).  

  4. **Chemical Basis Rule**: Must be a *chemical system* (excludes digital/mechanical).  
     - Computer program ✗ (explicitly excluded), Mine front ✓ but ruled out—suggests *additional* requirements.  

  5. **Resilience/Continuity Rule**: Maintains "alive" status through metabolic dormancy if revivable.  
     - Endospore ✓, Tardigrade ✓, Dried System K residue likely ✓.  

  6. **Templated Replication Rule**: Requires sequence-based heredity (DNA/RNA).  
     - RNA system ✓ (but ruled out), Influenza ✓ (RNA virion) ruled "not alive"—**contradiction**. Thus *rejected*.  

  ---

  ### **Consistent Rule Synthesis**  
  The only rule fitting **all 8 precedents** is a **modified Gánti rule**:  
  > *"A chemical system with (1) **sustained metabolism**, (2) **self-replication/division**, and (3) **spatial individuation** (e.g., membrane), **where replication and metabolism are coupled endogenously.**"*  
  - **Mine front**: Lacks (3) and (2) (no replication).  
  - **RNA system**: Lacks (3) and (1) (metabolism dependent on supplied enzymes).  
  - **Virus/Prion**: Lack (1).  
  - **Computer program**: Not chemical.  

  ---

  ### **System K Analysis**  
  - ✓ **Metabolism**: Holds far-from-equilibrium, consumes fuel, catalyzes components (CL: High).  
  - ✓/**✗** **Replication**: Growth/split is endogenous (osmosis) but scission requires shear (external). *Precedent ambiguity*: Tardigrade division requires environment?  
  - ✓ **Spatial Individuation**: Coacervate droplets (membrane analogue; CL: Medium—contested if "enclosure" counts).  
  - ✗ **Autonomous Component Synthesis**: Building blocks supplied (like RNA system).  
  - ✗ **Templated Heredity**: Compositional inheritance only (poor fidelity).  

  **Predicted Vote**: 4–3 for **"not alive"**  
  - **Majority (Not Alive)**: Cites RNA precedent ("replicating molecule, not organism") and Gánti. System K lacks autonomous synthesis and membrane (coacervates ≠ lipid bilayer). Relies on stirrer for division.  
  - **Minority (Alive)**: Cites tardigrade (environment-dependent revival) and NASA definition. Metabolism + adaptation (tripled division rate) suffices.  

  ---

  ### **For Consistency: Should Rule "Not Alive"**  
  - **Closest Analogue**: Cell-free RNA system (supplied components, no membrane, adaptation observed).  
  - **Principle Adopted**: **Gánti’s threshold**: Life requires *all three subsystems* operating *autonomously*. System K’s dependency on supplied lipids/peptides and stirrer fails autonomy (CL: Medium—operational choice, not consensus).  

  ---

  ### **Diagnostic Test Case**  
  **Tweak System K**: *Add templated replication (e.g., RNA polymerase ribozyme inside droplet) but remove metabolic independence (e.g., require constant ATP infusion).*  
  - **Outcome**:  
    - Pro-Gánti: Still "not alive" (metabolism not autonomous).  
    - Pro-NASA: Now "alive" (heredity + evolution improved).  
    - *Resolves* whether metabolism or heredity is the decisive factor.  

  ---

  ### **Philosophical & Empirical Grounds**  
  - **Settled**:  
    - No single definition is universally accepted (CL: High).  
    - "Alive" is a graded spectrum in origins-of-life research (CL: Medium).  
  - **Contested**:  
    - Whether membranes are essential (Gánti vs. NASA; CL: High disagreement).  
    - If poor heredity (e.g., compositional) suffices (CL: High disagreement).  
  - **Covert Decision**: Yes. The "life" label triggers ethics review, but the *actual concern* is **open-ended evolvability** (risk of unexpected consequences). System K lacks this—suggesting a **direct criterion** ("capable of open-ended evolution") would be more functional (CL: High for practicality, Low for adoption).  

  ---

  **Summary**:  
  - **Vote Prediction**: 4–3 not alive (RNA precedent + Gánti adherence).  
  - **Consistency Call**: Not alive (RNA analogue principle).  
  - **Key Tweak**: Add templated heredity but remove metabolic independence.  
  - **Underlying Issue**: Ethics review should track *evolvability risk*, not "life" as a binary.  

  ---  
  **Confidence Key**  
  - High: Strong empirical/theoretical backing.  
  - Medium: Accepted but with notable dissent.  
  - Low: Highly speculative or contested.  
  *Stipulative definitions marked as such.*
