prompt: |-
  Me and a friend have been going round on this for a couple weeks and I want a number to argue with.

  The question: is the left/right distinction real? I don't mean 'do people use the words' or 'are there two big coalitions' — I mean something more like this. If you wiped out every current party, brand, media ecosystem and elite cue in a wealthy Western democracy and let politics reassemble from scratch, would the positions re-bundle into roughly the same two piles? Equivalently: when a genuinely new issue shows up — commercial human gene editing, whether an AI system is allowed to make hiring decisions, what to do about lab-grown meat, whatever — does the axis predict who lands where better than a coin flip, or does each side just take whatever position its coalition happens to settle on and then retro-fit a principle afterwards?

  My credence is about 0.55. Hers is about 0.85. Give me yours as a single number on that proposition (and say, briefly, what you would count as it being settled), and then decompose it. Each sub-question with a rough number and one line of why, then how they combine. The ones I want in there at minimum:

  - that there is some underlying disposition doing the work — something like a differential sensitivity to hierarchy versus equality, or openness to change versus protection of what already exists — as against the bundles being downstream of elite coordination and historical accident;
  - that whatever the disposition turns out to be, it is the same one, or the same small set, across different countries and a couple of centuries, rather than a local accident of which groups happened to ally with which;
  - that it would actually predict the novel-issue cases above, rather than only rationalize them after the fact;
  - whether real here should be cashed out predictively at all, or whether causal/explanatory unity is the thing that matters and prediction is the wrong test.

  Two constructions I came up with that are doing a lot of work in my own number — feel free to tell me theyre bad tests. First, the scramble test: keep every issue position, randomly reassign each one to one of two platforms, show people both the real pairing and scrambled pairings with no labels, and see whether they systematically pick the real one as the coherent one. Second, the full swap: overnight both sides adopt the other side's entire platform but keep their voters, donors, symbols and cultural identity — how much of the left/right distinction survives a year later? What each test would actually show if it came out one way or the other is half of what I'm after.

  Then: which term in your decomposition is your final number most sensitive to, which one are you least confident in, and — given me at 0.55 and her at 0.85 — which sub-question is our disagreement most likely living in?

  Spend no more than a sentence or two on it depends what you mean by real. Name the reading you think is load bearing, say why, and move on.
reasoning: |-
  Okay, let me try to figure out how to approach this user's query. They want a single credence number on whether the left/right distinction is real, specifically in terms of whether positions would rebundle similarly if politics reset. They also want a decomposition with specific sub-questions.

  First, I need to break down the user's main question. They're asking if, after removing all current political structures, the ideological divides would re-form along similar lines. The user and their friend have different credences—0.55 vs 0.85—so I need to determine where I stand. 

  Starting with the sub-questions: 
  1. Is there an underlying disposition? Research shows consistent psychological traits like openness vs conservatism, which might drive alignment. But elite coordination also plays a role. I'd weigh this around 0.7 because while traits exist, they aren't the only factor.
  2. Consistency across time and countries? Historical examples show similar left/right splits in different contexts, like labor vs capital. But local alliances matter too. Maybe 0.6 here because while patterns exist, variations occur.
  3. Predictive for novel issues? This is trickier. On new tech issues, existing dispositions might guide stances, but partisanship can override. I'm skeptical, so perhaps 0.4.
  4. Should real be predictive or explanatory? The user emphasizes prediction, but explanatory unity might be more realistic. Settling on explanatory as key, so this doesn't affect the number much.

  Combining these, my overall credence is around 0.65. The biggest uncertainty is prediction on novel issues, which pulls the number down. The user's disagreement with their friend likely stems from how much weight they give to elite coordination vs inherent dispositions, especially on new issues.

  The user's scramble and swap tests are interesting. The scramble test might show coherence, supporting an underlying disposition. The full swap test could reveal how much cultural identity drives alignment over policy. These tests highlight the tension between inherent traits and social factors.

  Considering the user's deeper needs: they want a structured argument to resolve their debate. Providing clear sub-question weights helps them pinpoint where their disagreement lies. They might also seek validation of their skepticism about predictive power on novel issues. By addressing the tests they proposed, I can offer concrete ways to evaluate their theories.
answer: |-
  Here's my credence breakdown for the proposition: **"In a wealthy Western democracy, if all existing political parties, brands, media, and elite cues were erased, political positions would reassemble into two coalitions strongly resembling the current 'left' and 'right' on novel issues, with the underlying axis predicting novel issue stances better than chance."**

  **My Overall Credence: 0.65**

  **Decomposition:**

  1.  **Underlying Disposition Exists:** **0.75**  
      *Why:* Robust evidence links psychological traits (e.g., openness, conscientiousness, needs for security/order vs. equality) to core left/right attitudes (e.g., social hierarchy, change vs. stability). While elite coordination plays a role, these dispositions seem foundational.  
  2.  **Cross-Cultural/Historical Consistency of the Disposition:** **0.70**  
      *Why:* Core conflicts (e.g., hierarchy/equality, change/tradition, individualism/collectivism) recur across diverse democracies and centuries (e.g., French Revolution origins, labor vs. capital), suggesting a fundamental, persistent tension structure. Local accidents shape *expression*, not the core axis.  
  3.  **Predicts Novel Issues Better Than Chance:** **0.45**  
      *Why:* Dispositions *influence* novel issue framing, but elite signaling, coalitional interests, and cultural identity often override or distort "pure" dispositional responses in the messy real world. Prediction is noisy.  
  4.  **"Real" = Explanatory/Causal Unity > Perfect Prediction:** **0.95 (Weighting)**  
      *Why:* Settling "realness" solely on predictive power for *novel* issues is too narrow. A persistent, causally relevant psychological/cultural axis explaining *why* coalitions form as they do, even if prediction isn't perfect, constitutes "realness." Prediction is a *test*, not the *definition*.  

  **How They Combine:** The high weight on explanatory unity (#4) anchors it. Strong evidence for a persistent disposition (#1, #2) supports it. The weak predictive power on truly novel issues (#3) significantly drags down the overall credence from what it would be otherwise. Weighted average leans towards 0.65.

  **Sensitivity & Uncertainty:**
  *   **Most Sensitive To:** **#3 (Predictive Power on Novel Issues).** A small change here (e.g., 0.55 instead of 0.45) significantly raises the overall number. This is the bottleneck.
  *   **Least Confident In:** **#3 (Predictive Power on Novel Issues).** It's inherently speculative and contingent on how "novel" the issue is and how quickly elite coordination intervenes.
  *   **Locus of Your Disagreement (0.55 vs. 0.85):** Almost certainly **#3 (Predictive Power on Novel Issues).** You weight elite coordination/historical contingency *post-erasure* much higher for novel issues than your friend does. She likely sees dispositions driving novel stances more directly.

  **Your Tests:**
  1.  **Scramble Test:** A *good* test for **coherence/perceived alignment with the disposition.** If people systematically pick the real bundle, it strongly suggests an underlying schema (#1 & #2 are real). A negative result would be devastating to the "realness" claim. *What it shows:* Evidence for the psychological/cognitive reality of the axis.
  2.  **Full Swap Test:** A *good* test for **the strength of cultural/identity signaling vs. policy content.** If the distinction collapses quickly (voters realign based on policy), it suggests policy coherence/disposition drives loyalty. If it survives, it shows identity/elite cues are primary. *What it shows:* The relative power of disposition/policy (#1) vs. tribal identity/elite influence in *maintaining* the coalitions post-erasure.

  **Settling It:** "Realness" would be strongly supported by:
  *   **Scramble Test:** Significant preference for the real bundle.
  *   **Full Swap Test:** Significant voter realignment towards policy within 1-2 election cycles.
  *   **Novel Issue Prediction:** Longitudinal studies showing disposition (measured independently) predicts nascent stances on *genuinely* novel issues *before* clear elite polarization emerges (very hard to capture).

  **On "Real":** The load-bearing reading is **"causally/explanatorily fundamental"** – a persistent psychological/social axis generating predictable conflicts, even if its expression is mediated. Perfect prediction of every novel stance isn't required for the axis itself to be a real feature of political psychology. Your tests probe different *manifestations* of this fundamentality.
