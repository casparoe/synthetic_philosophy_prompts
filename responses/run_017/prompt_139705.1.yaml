  Hmm, this is quite sophisticated - they clearly know poetry forms and the philosophical nuances. The constraints are precise: nineteen lines, two non-rhyming refrains with distinct rhyme sounds, five escalating machine variants in the middle lines, and that tricky deposition machine in the fifth tercet. 

