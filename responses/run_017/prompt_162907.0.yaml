answer: |-
  ### 1. Essay Question (177 words)  
  *Consider a fully automated economy where: (1) all physical production (e.g., manufacturing goods, constructing factories) is performed by machines built and maintained autonomously by other machines; (2) the only human labour involves designing algorithms, debugging software remotely, and education/reproduction of this workforce; (3) because automation permeates machine-producing sectors, new fixed capital is produced so cheaply that the total *value* of society’s constant capital stock remains stable while its physical scale and output surge.  
  Marx’s *Fragment on Machines* diagnoses automation as destabilising capitalism by making labour-time obsolete as the measure of wealth, while *Capital* Volume 3 posits a falling rate of profit (FRP) due to rising constant capital relative to labour. Using this scenario, answer:  
  (a) How does each diagnosis explain the fate of value, surplus value, and the profit rate here? Which better accommodates constant capital’s cheapening?  
  (b) Does expanding the "collective labourer" to include designers/educators preserve the labour theory of value (LTV) or shift the crisis elsewhere? Where?  
  (c) Dismissing the *Fragment* as "immature" ignores its distinct logic. Argue which diagnosis more powerfully explains capitalism’s limits here, and name one observable trend in such an economy that would undermine your chosen view.*  

  ---

  ### 2. Model Answer (907 words)  
  **Core Thesis:** The *Fragment*’s crisis of measure provides a more coherent framework for fully automated production than Volume 3’s FRP, as the latter depends on labour’s quantitative dominance while the former predicts value’s collapse amid abundance, relocating crisis to capital’s inability to contain socially general intellect.  

  **(a) Divergent Diagnoses**  
  The *Fragment* (1857–58) argues that automation dissolves value relations. Value requires socially necessary labour-time (SNLT) as its measure. Here, machines produce autonomously: the SNLT embodied in commodities approaches zero. Material wealth explodes, but value—and thus surplus value—*vanishes* because living labour ceases to be the "prime mover" of production. Capitalism’s foundation (valorisation via labour exploitation) crumbles as profit relies on value creation. The system faces a crisis of measure: wealth no longer derives from labour-time, rendering exchange-value irrational. Constant capital’s cheapening accelerates this, as knowledge (general intellect) becomes the core productive force, severing output from direct labour inputs.  

  Volume 3’s FRP theory, conversely, assumes value production persists. It posits that rising technical composition of capital (more machines per worker) increases the organic composition (OCC = constant/variable capital, *c/v*), depressing the rate of profit (*s/(c+v)*) even if exploitation (*s/v*) rises. Here, however, variable capital (*v*)—wages for direct producers—nearly vanishes. If only designers/engineers remain, *v* is tiny, while *c* (machines, software) dominates. Yet *c*’s value does *not* rise (per the scenario), breaking the FRP’s logic. The FRP requires *c*’s *value* to grow relative to *v*, but automation here *depreciates* *c*’s value per unit. The FRP cannot explain stable *c* value amid output growth; the *Fragment*’s emphasis on knowledge-driven abundance does.  

  **(b) Collective Labourer: Solution or Displacement?**  
  Expanding the "collective labourer" to include designers/educators (as in *Capital* Vol. 1’s machinery chapter) appears to rescue the LTV by redefining "productive labour." But this relocates, not resolves, the crisis. If designers produce value, their labour must be subsumed under capital as abstract, exploitable SNLT. Yet automation decouples output from *any* direct labour inputs: one algorithm update can enable infinite goods production with no added labour. Design labour becomes a negligible cost, making value determination arbitrary. Worse, capital must minimise this labour to cut costs, accelerating its own irrelevance.  

  The crisis shifts to *realisation* and *control*. Value depends on monetising commodities, but with near-zero labour inputs, prices collapse unless monopolies enforce artificial scarcity—undermining competitive markets. Simultaneously, capital loses its lever for disciplining labour: if production requires few workers, mass unemployment destroys demand, while the remaining "collective labourers" (designers) resist exploitation as irreplaceable knowledge-holders. The *Fragment* foresees this: capital becomes a "barrier" to abundance, provoking struggles over distributing wealth freed from labour constraints.  

  **(c) Why the *Fragment*’s Logic Prevails**  
  The FRP is ill-equipped for this scenario. It hinges on *rising* *c/v*, but automated machine production *lowers* *c*’s value per unit, potentially stabilising OCC. Even if OCC rises, the FRP treats labour as indispensable for *s*; here, *s* evaporates with *v*. The *Fragment* alone explains why automation *intrinsically* undermines value: when knowledge displaces labour as the productive core, capital cannot measure or appropriate wealth through labour-time.  

  The "immaturity" objection—that the *Fragment* was superseded by *Capital*’s "mature" FRP—fails. Volume 3’s FRP assumes value production persists; it cannot address value’s *extinction*. The *Fragment*’s crisis of measure is not a draft error but a distinct theory of capitalism’s historical limits.  

  **Commitment and Falsification**  
  The *Fragment* does more explanatory work: it predicts value collapse, falling profits from vanishing surplus value (not high *c*), and crisis erupting from capital’s *social* contradictions (e.g., unrest over unemployment/post-scarcity) rather than internal profitability squabbles. An observable trend undermining this would be **sustained high profit rates via monopoly rents**. If firms extract rising profits by privatising knowledge (e.g., via patents) without expanding material output, it suggests value persists through artificial scarcity—implying the FRP’s "barriers to accumulation" (monopoly) outweigh the *Fragment*’s measure crisis.  

  ---

  ### 3. Marking Scheme (25 points)  
  **Must-hit moves** (5 points each; deduct 1–2 for partial/confused execution):  
  1. **Contrast value/surplus-value fate:** *Fragment* = value collapses as labour-time becomes irrelevant; FRP = value persists but profit rate falls due to high *c/v*.  
  *→ Common error:* Claiming FRP works here despite near-zero *v* or ignoring the *Fragment*’s measure crisis.  
  2. **Cheapening *c* analysis:** *Fragment* leverages it as proof of knowledge displacing labour; FRP struggles because cheap *c* counters rising OCC.  
  *→ Common error:* Asserting FRP holds if *c*’s *physical* mass rises (neglecting value stability).  
  3. **"Collective labourer" critique:** Expanding it relocates crisis to realisation/control (e.g., price collapse, class struggle over distribution), not saving LTV.  
  *→ Common error:* Stating designers create value without addressing automated production’s decoupling of output from labour.  
  4. **Deflation rebuttal:** Argues the *Fragment*’s crisis of measure is irreplaceable for automation (FRP requires labour’s centrality).  
  *→ Common error:* Dismissing the *Fragment* without engaging its unique claims.  
  5. **Commitment + falsifiability:** Chooses one diagnosis, justifies its explanatory superiority (e.g., *Fragment* for value collapse), and names a falsifying observable (e.g., sustained high profits via rents).  
  *→ Common error:* Vagueness about how data could challenge the theory.  

  **A/B Separator:** Move 5 (commitment/falsifiability). An A answer must clearly defend *why* one diagnosis is more robust in the scenario and propose a test.  
  **Failing Answer (0–10):** Conflates value with price/material wealth (e.g., "profits fall because goods are cheap"), treats FRP as a prediction of falling *money* profits, or asserts both theories are "compatible" without resolving tensions. Ignores the automated *c*-production constraint.  

  ---

  ### Rationale for Design  
  - **Scenario Specificity:** Prevents "strawman" automation by fixing *c*’s value stability and autonomous machine production.  
  - **Category Focus:** Forces use of *c/v/s*, OCC, SNLT, valorisation, and general intellect without requiring definitions.  
  - **Critical Moves:** Targets core tensions (value extinction vs. internal profit squeeze, collective labourer limits) while blocking textual summary.  
  - **Marking Precision:** Move 5 distinguishes excellence (synthesis/evaluation), while fail conditions penalise category errors.  
  - **Balance:** 900-word model fits 1,000-word/90-min expectations; 25-point scheme allows granularity (e.g., 18/25 = B+).
