prompt: |-
  I have spent fifteen years as a curator of South Asian collections, and four months ago my director asked me to chair the interpretation group for a complete rewrite of our permanent galleries — around four hundred object labels, sixty panel texts and our school-facing worksheets — after a trustee described the museum as a museum of Europe with a few annexes. Our board responded by adopting a framing principle, and my job is to turn it into something my writers can actually run:

  *A text should not make something count as an event in the history of the world because of its effects on, or resemblance to, a European trajectory; and it should not treat any one society as the silent standard against which others are marked as early, late, failed, missing, or about-to-be.*

  That is the whole of what I was given. My writers are six regional specialists with no training in historiography, working mostly in English with one fluent Persianist and one Sinologist; they have about twenty minutes per label, a seventy-word ceiling, and no realistic access to the scholarly literature on anything outside their own region. I have a community advisory panel that meets monthly, so escalating a question to them costs four to six weeks, and I cannot escalate four hundred labels to them.

  We have already tried two shortcuts and they failed. The first was: delete Europe from the sentence and see whether it still says something — but it kept flagging labels for objects that entered the collection through empire, where the European connection genuinely is the reason the object is here. The second was counting mentions of continents per panel, which told us nothing we did not know.

  What I need is a decision procedure: the tests to apply in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to the panel because the question is one of values rather than facts. It has to work at two levels, because I think the principle bites hardest not inside sentences but in the scaffolding — gallery titles, the period names we organise the sequence by, and which objects we chose to acquire and display at all — and my writers will apply it to individual labels. Please also tell me which distinctions inside the principle have to survive being simplified for non-specialists and which can be dropped without loss.

  Three cases to run it on:

  Our draft label on Indian cotton textiles, which currently asks why the subcontinent did not have an industrial revolution of its own, given that it was the world's leading producer of cloth well into the eighteenth century.

  Our proposed gallery spine, which is at present: Ancient Worlds — The Age of Discovery — Revolution and Industry — The Modern World.

  And a label the team is proud of, on printing: it says that movable type was in use in Korea and in China centuries before Gutenberg, which was meant as our corrective. If the procedure tells me this label is also a failure, I want to be told plainly and to understand why.

  Two further things. Our collection was largely assembled under empire and our provenance research is unfinished, so for some objects the only usable sources are colonial administrative ones: the procedure has to say what a writer does when the archive itself is the problem. And please separate, in your answer, what is settled from what is genuinely contested among historians and philosophers of history who work on this — including whether the board's principle itself is defensible, whether comparison of any kind can avoid a yardstick, and whether Europe is even a coherent unit to be decentring. My writers will be told which parts they may repeat as received opinion and which they must present as one view among others, so I need that distinction marked rather than smoothed over.
reasoning: |-
  Hmm, this is an incredibly rich and complex museum curation challenge. The user is a seasoned South Asian collections curator tasked with operationalizing a profound decolonial principle across hundreds of museum texts under severe constraints. 

  Let me break this down. The core tension is between theoretical rigor and practical application: how to implement a sophisticated historiographical framework ("don't center Europe as the norm") with regional specialists who lack historiography training, within 20-minute label-writing windows. The failed shortcuts reveal how surface-level fixes miss the deeper structural issues - like when deleting "Europe" from labels still left imperial acquisition narratives intact.

  The three test cases are brilliantly chosen to probe different dimensions:
  1) The cotton textile label exemplifies teleological thinking (assuming industrial revolution was an inevitable goal)
  2) The gallery spine reveals Eurocentric periodization 
  3) The "corrective" printing label demonstrates how even anti-Eurocentric gestures can reinforce the very framework they challenge by using Europe as reference point

  What's especially acute is the archival dilemma - when colonial sources are all that exist, how does one write labels without reproducing colonial perspectives? This isn't just about wording but epistemology.

  The user's request for "settled vs contested" demarcation is crucial. For instance:
  - Settled: That Europe shouldn't be treated as universal benchmark
  - Contested: Whether any cross-cultural comparison can be neutral
  - Highly contested: If "Europe" itself is a coherent historical entity

  The solution must work at both macro (gallery structure) and micro (label wording) levels while admitting when ethical judgments (not just factual ones) require community input. The phased decision procedure I'll propose should:
  - First target structural elements (periodization, acquisition choices)
  - Then examine narrative framing 
  - Finally scrutinize individual word choices
  With clear off-ramps to the advisory panel when value judgments outweigh factual ones

  For the cotton label, the key shift is reframing from "why no industrial revolution?" to "what made Indian textile production successful on its own terms?" The printing "corrective" fails because it still positions Gutenberg as the yardstick - better to discuss Korean printing without European reference at all.

  Ultimately this is about helping specialists unlearn deep-seated historiographical habits - which is why the procedure must be both rigorous enough to catch subtle Eurocentrisms and simple enough to apply in 20-minute bursts. The distinction between operational rules ("avoid comparative adjectives") and philosophical principles ("treat societies as equally valid") will be vital for implementation.
answer: |-
  Here is a decision procedure designed to operationalize your board's principle practically, tackling both structural/scaffolding elements and individual labels, while addressing your constraints and specific cases. It distinguishes settled historiography from contested debates and marks them clearly.

  **Core Principles of the Decision Procedure:**
  1.  **Focus on Relational Framing:** The core violation is *framing non-European societies primarily in relation to Europe* (as source, comparator, benchmark, or necessary outcome).
  2.  **Hierarchy of Impact:** Scaffolding (titles, periodization, acquisition logic) carries more weight than individual labels. Fix scaffolding first.
  3.  **Action-Oriented:** Provides clear "Do This" or "Flag This" outcomes at each step.
  4.  **Efficiency:** Starts with quick checks, escalating complexity only when needed. Defers deep value judgments to the panel.
  5.  **Transparency:** Marks distinctions between operational rules (for writers) and underlying philosophy (for your context).

  **The Decision Procedure:**

  **Apply this sequence for ANY text element (scaffolding or label):**

  1.  **Check 1: Explicit Comparison/Contrast to Europe?**
      *   **Test:** Does the text *explicitly* compare the object/society/event to Europe (e.g., "like Europe", "unlike Europe", "before Europe", "influenced Europe", "failed to match Europe")?
      *   **Sufficient Answer:** If YES, it **fails**. Reword to remove the explicit comparison *unless* the *sole documented historical reason the object is HERE* is its European connection (e.g., "Collected by Major X during the Y Campaign"). Even then, minimize framing the *origin society* through the European lens.
      *   **Outcome:** FAIL (Rewrite) or PASS to Check 2.
      *   *Rationale (Settled):* Explicit comparison inherently makes Europe the yardstick. Avoidable in almost all cases except specific, narrowly defined collection history.

  2.  **Check 2: Implied European Benchmark?**
      *   **Test:** Does the text imply Europe is the norm/standard/goal by using terms like: "advanced", "primitive", "developed", "underdeveloped", "complex", "simple", "traditional", "stagnant", "ahead of its time", "lagging behind", "pre-modern", "modernizing", "transitional", "lacked [European thing]", "failed to develop [European thing]"?
      *   **Sufficient Answer:** If YES, it **fails**. Replace with intrinsic descriptors or context-specific explanations. Ask: "Developed *compared to what?*" If the answer is implicitly "Europe", rephrase. Use regionally specific terms for societal organization or change if possible.
      *   **Outcome:** FAIL (Rewrite) or PASS to Check 3.
      *   *Rationale (Settled):* These terms derive meaning from an implied (usually European) developmental scale. Historians widely agree this teleology is problematic.

  3.  **Check 3: Eurocentric Periodization/Sequence?**
      *   **Test (Scaffolding Critical):** Does the text rely on period names or sequence logic defined by European history (e.g., "Middle Ages", "Renaissance", "Age of Discovery", "Enlightenment", "Industrial Revolution", "Modern Era") *as universal categories* applied to other regions? Does the overall gallery flow imply European history is the master narrative?
      *   **Test (Label):** Does the label place the object/event within a period defined primarily by European events, *without* justifying why this periodization is relevant *to the object's own context*?
      *   **Sufficient Answer:** If YES, it **fails** (especially for scaffolding). For scaffolding: Re-periodize based on regionally significant shifts OR use neutral chronological frameworks ("13th-15th Centuries") OR adopt multi-perspective periodization acknowledging different regional experiences. For labels: Ensure period references are intrinsic to the object's context or clearly explained as an external (e.g., trade) connection.
      *   **Outcome:** FAIL (Rewrite - Scaffolding priority!) or PASS to Check 4.
      *   *Rationale (Settled):* Applying European period markers universally forces other histories into a European mold. *Contested:* The precise alternatives and coherence of "Europe" itself (see below).

  4.  **Check 4: Europe as Necessary Cause/Outcome?**
      *   **Test:** Does the text present Europe as:
          *   The *necessary catalyst* for change/importance elsewhere? (e.g., "spurred by contact with Europe", "in response to European pressure" - unless *documented* as the primary immediate trigger).
          *   The *implied or explicit endpoint* of a trajectory? (e.g., "on the path to modernization", "pre-industrial", "would eventually be eclipsed by Europe").
          *   The *primary audience or validator* for the object/event? (e.g., "admired by European collectors", "influenced European art" - unless the *label's specific point* is about reception history *in Europe*).
      *   **Sufficient Answer:** If YES, it **fails**. Refocus on internal dynamics, regional contexts, or broader global connections (not solely Europe-centric). If European contact *is* the documented primary reason for a *specific change relevant to the object*, state it factually without implying inevitability or superiority.
      *   **Outcome:** FAIL (Rewrite) or PASS to Check 5.
      *   *Rationale (Settled):* This frames non-European history as reactive or incomplete without Europe, denying agency and intrinsic value.

  5.  **Check 5: The "Silent Standard" Test (Values Judgment Threshold)**
      *   **Test:** Even after passing Checks 1-4, does the text *still* leave a strong impression that Europe is the unspoken norm? Consider:
          *   Is the *only* reason for including this object its connection to European empire/collection?
          *   Does the text describe a society primarily by what it "lacks" compared to an implicit standard?
          *   Is the overall narrative arc of the gallery/scaffolding one where Europe "enters" and becomes the dominant frame?
          *   Does the description of a society's change/development only make sense if the reader assumes a European model is the goal?
      *   **Sufficient Answer:** If the answer is likely YES based on professional judgment, **or** if resolving it requires fundamental choices about narrative priorities, values, or representation that go beyond factual correction...
      *   **Outcome:** **ESCALATE to Advisory Panel.** This is the values threshold.
      *   *Rationale:* This is where the core philosophical intent of the board's principle bites deepest. Resolving it often involves choices about perspective, voice, and narrative weight that benefit from community input. *Contested:* The extent to which *any* description from a global museum can ever fully escape some framing influence.

  **Handling Problematic Archives:**
  *   **Procedure:** If the *only* sources are colonial administrative records:
      1.  **Acknowledge the Lens:** Explicitly state the nature of the source (e.g., "According to British colonial records...", "Noted in the East India Company ledger as...").
      2.  **Focus on Observable Facts:** Prioritize information likely recorded factually (date acquired, material, basic physical description, *reported* place of origin - noting it's reported).
      3.  **Avoid Interpretive Claims from Source:** Do *not* use the colonial source to make claims about the object's *meaning, significance, or use within its originating culture* unless corroborated or presented as the colonial perspective.
      4.  **Contextualize the Silence:** If possible, briefly note the limitations (e.g., "Little is documented about its original use before collection").
      5.  **Panel Escalation (if critical):** If the object is central and the colonial framing in the source unavoidably dominates the *only possible* label narrative, escalate to the panel for guidance on framing and acknowledgment.

  **Applying to Your Cases:**

  1.  **Indian Cotton Textiles Label (Why no Industrial Revolution?):**
      *   **Check 1:** No *explicit* comparison? PASS.
      *   **Check 2:** "Why no industrial revolution?" **FAIL.** "Industrial Revolution" is a European-specific term used as the implied benchmark/goal. "Failed to develop" implies falling short of that standard.
      *   **Action:** Rewrite. Focus on *why Indian production methods were successful and globally dominant for centuries* on their own terms. Discuss factors like skill, organization, trade networks, market structures. *Avoid framing its later changes solely as a "failure" to industrialize like Britain.* Ask: "What were the dynamics of Indian textile production?" not "Why wasn't it Europe?"

  2.  **Gallery Spine (Ancient Worlds — Age of Discovery — Revolution and Industry — Modern World):**
      *   **Check 3:** **CATASTROPHIC FAIL.**
          *   "Age of Discovery": Centres European maritime expansion as the defining global event.
          *   "Revolution and Industry": Directly names European-specific phenomena (French Rev, Ind Rev) as universal periods.
          *   "Modern World": Implies a European-defined modernity is the universal endpoint.
      *   **Action:** Complete rewrite. Options:
          *   **Chronological:** "Before 1500 CE," "1500-1800 CE," "1800-1950 CE," "1950-Present" (Neutral but risks Eurocentrism by default if content isn't carefully framed).
          *   **Thematic:** "Connections and Exchange," "States and Empires," "Making and Meaning," "Global Encounters and Transformations" (Requires careful thematic definition).
          *   **Regional Frameworks (Complex but best):** Structure galleries around major regions/civilizations (South Asia, East Asia, Middle East, etc.), using *their* significant periodizations internally, with cross-cutting galleries on trade, religion, or empire that show connections *without* making Europe the driver. Acknowledge overlaps and different tempos.

  3.  **"Corrective" Printing Label (Movable type before Gutenberg):**
      *   **Check 1:** Explicit comparison? YES. "...centuries *before* Gutenberg". **FAIL.** Europe (Gutenberg) is the temporal benchmark.
      *   **Check 4:** Europe as Validator? YES. The *point* of the label is to assert importance *relative to Europe* ("before Gutenberg").
      *   **Action:** Rewrite. Describe the Korean/Chinese printing innovations *on their own terms*: "Korea developed sophisticated movable metal type printing techniques in the 13th century, used for [specific purpose]. China had earlier experimented with [specific techniques]." **Remove all mention of Gutenberg.** His story belongs in a *European* context if discussed elsewhere. The "corrective" reinforces the standard it tries to challenge.

  **Crucial Distinctions: Simplification for Writers**

  *   **MUST Survive Simplification (Core Operational Rules):**
      *   Avoid explicit comparison to Europe (Check 1).
      *   Avoid terms implying European benchmarks (Check 2 - "advanced", "failed", "lacked" etc.).
      *   Avoid European period names as universals (Check 3 - "Middle Ages", "Industrial Revolution").
      *   Avoid framing Europe as the necessary cause/endpoint (Check 4).
      *   Acknowledge problematic colonial sources (Archive Rule).
  *   **Can Be Simplified/Dropped (Complex Philosophy):**
      *   Deep debates about the coherence of "Europe" (writers can treat it as an operational given for avoiding comparison).
      *   Abstract debates about whether *any* comparison avoids a yardstick (writers focus on avoiding *explicit/implicit European* yardsticks per the rules).
      *   The full philosophical defensibility of the board's principle (writers implement it as policy).
      *   Nuances of "silent standard" (Check 5) - writers apply Checks 1-4 rigorously; if something still feels problematic *to them*, they flag it for you/panel.

  **Settled vs. Contested Issues (Marked Clearly):**

  *   **Settled (Writers can present as received opinion/consensus guidance):**
      *   Eurocentric history (using Europe as the benchmark, norm, or telos) is a valid historiographical critique.
      *   Terms like "advanced," "primitive," "developed" in a cross-cultural context are problematic and often teleological.
      *   Applying European periodization (Middle Ages, Renaissance, Industrial Revolution) universally is misleading.
      *   Attributing change *only* to European contact denies agency and distorts history.
      *   Colonial archives reflect the perspective of the colonizer and must be used critically. (Settled *that* it's a problem; *how* to handle it is operationalized in the procedure).
  *   **Contested (Must be presented as debates, or handled structurally without explicit labeling):**
      *   **The Coherence of "Europe":** Is "Europe" a meaningful, coherent historical entity to be decentered, or is it itself a constructed category? *(Highly Contested - avoid writers wading into this; focus on avoiding specific comparisons/benchmarks)*.
      *   **Avoiding All Yardsticks:** Is it *possible* to describe societies without *any* implicit comparison? Is comparison inherently hierarchical? *(Contested - writers focus on removing the *European* yardstick specifically)*.
      *   **The Board's Principle's Defensibility:** While the *critique* of Eurocentrism is widely accepted, the *specific formulation* and its *absolute application* (e.g., forbidding *any* mention of effects on Europe) can be debated. Some argue for "symmetrical" or "entangled" histories that acknowledge mutual influence without hierarchy. *(Contested - writers implement it as given policy; panel handles values conflicts)*.
      *   **Alternatives to Eurocentrism:** What *should* replace it? Multiple modernities? Civilizational perspectives? Global history? Subaltern studies? *(Contested - the gallery restructuring is where this plays out; writers focus on avoiding negatives per the checks)*.
      *   **The "Silent Standard" Problem:** How pervasive is it? Can it ever be fully escaped in an institution built during colonialism? *(Contested - Check 5 and panel escalation handle this)*.

  **Implementation Advice:**

  1.  **Train on Checks 1-4 & Archive Rule:** Drill writers on recognizing and fixing these. Use clear examples and non-examples.
  2.  **Scaffolding First:** Dedicate significant time to fixing periodization, gallery titles, and overall narrative flow *before* deep label work. Bad scaffolding poisons everything.
  3.  **Empower "Flagging":** Make it easy and non-punitive for writers to flag potential Check 5 issues or problematic archive cases for your review.
  4.  **Panel Focus:** Use the panel strategically for high-level scaffolding, thematic narratives, and specific contested objects where values choices are paramount. Don't bog them down in individual labels passing Checks 1-4.
  5.  **Context over Comparison:** Constantly steer writers towards describing objects/societies within their *own* context, dynamics, and values.

  This procedure provides a concrete, step-by-step method to enforce the board's principle under real-world constraints, distinguishes actionable rules from complex debates, and offers clear paths for handling your specific challenges, including the problematic "corrective" label. Good luck with this vital rewrite.
