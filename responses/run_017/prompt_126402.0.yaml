  For my argument, I'll need to show how all three defenses fail when applied to their maneuvers. The key insight should be that moral responsibility tracks the agent's intention and the outcome's inevitability, not how the hospital's machinery happens to be configured. The ventilator example is particularly powerful - why should a purchasing decision months earlier determine whether a doctor "kills" or "lets die"?

  The hardest defense to counter might be the rights-based view. I'll need to argue that while there's asymmetry in general, it evaporates when: (1) death is inevitable regardless, and (2) the patient/surrogate has requested withdrawal. At that point, the "lethal threat" framing becomes misleading - the pathology is the threat, not the withdrawal.

  My most vulnerable premise will likely be that death's inevitability neutralizes the moral difference between killing and letting die. If challenged, I'd need to show that all three maneuvers demonstrate how "inevitability" is often constructed by the very protocols in question.

  The laundering cases add crucial dimensions missing from standard acts/omissions cases: (1) institutional orchestration, (2) technological mediation, and (3) the illusion of natural causation. Unlike the uncle examples, here the "default" is actively engineered.

