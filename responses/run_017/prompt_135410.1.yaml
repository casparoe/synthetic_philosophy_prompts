answer: |-
  ### Research Methods Seminar Final Exam  
  **Question 3: Simpson’s Paradox (20 points)**  

  Consider the three scenarios below. Each presents a hypothetical medical study comparing Treatment (T) vs. Control (C) on recovery status (Recovered: Yes/No). **For each scenario:**  
  (A) State whether Simpson’s paradox *appears* to occur (i.e., the direction of association flips or meaningfully changes after stratification).  
  (B) Explain *why* the paradox arises (or does not) using causal or statistical concepts.  
  (C) Argue whether the *aggregate* or *stratified* analysis is more appropriate for causal inference. Justify your answer.  

  **Scenarios:**  
  1. **Reversal with Uneven Strata:**  
     - **Stratum 1 (Severe Cases):**  
       | Group | Recovered | Total |  
       |-------|-----------|-------|  
       | T     | 20        | 100   |  
       | C     | 30        | 100   |  
     - **Stratum 2 (Mild Cases):**  
       | Group | Recovered | Total |  
       |-------|-----------|-------|  
       | T     | 80        | 100   |  
       | C     | 70        | 100   |  
     - **Aggregate:**  
       | Group | Recovered | Total |  
       |-------|-----------|-------|  
       | T     | 100       | 200   |  
       | C     | 100       | 200   |  

  2. **Reversal with Equal Strata Sizes:**  
     - **Stratum 1 (Age <50):**  
       | Group | Recovered | Total |  
       |-------|-----------|-------|  
       | T     | 40        | 100   |  
       | C     | 50        | 100   |  
     - **Stratum 2 (Age ≥50):**  
       | Group | Recovered | Total |  
       |-------|-----------|-------|  
       | T     | 60        | 100   |  
       | C     | 50        | 100   |  
     - **Aggregate:**  
       | Group | Recovered | Total |  
       |-------|-----------|-------|  
       | T     | 100       | 200   |  
       | C     | 100       | 200   |  

  3. **Non-Collapsible Odds Ratios (No Confounding):**  
     - **Stratum 1 (Smokers):**  
       | Group | Recovered | Total |  
       |-------|-----------|-------|  
       | T     | 50        | 100   |  
       | C     | 50        | 100   |  
     - **Stratum 2 (Non-smokers):**  
       | Group | Recovered | Total |  
       |-------|-----------|-------|  
       | T     | 90        | 100   |  
       | C     | 90        | 100   |  
     - **Aggregate:**  
       | Group | Recovered | Total |  
       |-------|-----------|-------|  
       | T     | 140       | 200   |  
       | C     | 140       | 200   |  

  **Additional Context for Scenario 4 (Hypothetical):**  
  > *"A study tests a new exercise regimen (T) vs. sedentary control (C) on heart health (Outcome). Researchers stratify by ‘post-treatment muscle soreness.’ The aggregate table shows T associated with worse outcomes, but within soreness strata, T looks better. Soreness is caused by the exercise regimen."*  
     - (D) Explain why conditioning on soreness here is misleading for causal inference.  

  ---

  ### Model Answer (550 words)  

  **Scenario 1:**  
  (A) **Paradox appears:** Yes. Treatment has lower recovery in both strata (Stratum 1: 20% vs. 30%; Stratum 2: 80% vs. 70%) but identical aggregate recovery (50% vs. 50%).  
  (B) **Why:** The reversal occurs because the treatment group has more severe cases (Stratum 1: T has 100 severe vs. C has 100 mild). Severity confounds the treatment-outcome relationship.  
  (C) **Causal inference:** Stratified analysis is appropriate. Severity is a common cause of treatment assignment (e.g., doctors assign T to severe cases) and outcome. Aggregate results are biased by confounding.  

  **Scenario 2:**  
  (A) **Paradox appears:** Yes. Treatment has lower recovery in Stratum 1 (40% vs. 50%) but higher in Stratum 2 (60% vs. 50%), yet aggregate recovery is identical (50% vs. 50%).  
  (B) **Why:** Despite equal stratum sizes, the reversal persists because age modifies the treatment effect. T harms young but benefits old patients.  
  (C) **Causal inference:** Stratified analysis is essential. The aggregate masks effect heterogeneity. If age is pre-treatment, strata reveal causal effects; if age is affected by treatment, we need causal diagrams.  

  **Scenario 3:**  
  (A) **Paradox appears:** Yes in odds ratios (OR). Within strata, OR = 1.0 (no effect). Aggregate OR = 1.0 (140/60 ÷ 140/60 = 1), but **risk differences** are 0 everywhere.  
  (B) **Why:** Odds ratios are non-collapsible. When baseline risks differ (Smokers: 50% recovery; Non-smokers: 90%), ORs can change after aggregation even without confounding. Here, no confounding exists (treatment balanced in strata).  
  (C) **Causal inference:** Aggregate and stratified analyses are equally valid for risk differences. For ORs, stratification avoids non-collapsibility artifacts. The "paradox" is mathematical, not causal.  

  **Scenario 4 (Muscle Soreness):**  
  (D) Soreness is a *mediator* (caused by treatment), not a confounder. Conditioning on it:  
  - Blocks part of treatment’s effect pathway (e.g., exercise → soreness → improved heart health).  
  - Introduces selection bias if soreness affects outcomes collider-style.  
  The aggregate table (showing harm) may reflect the true total effect, while stratified results are misleadingly positive.  

  **Core Conceptual Takeaway:**  
  Simpson’s paradox is not resolved by data alone. **Key questions:**  
  1. Is the stratifying variable a confounder (pre-treatment common cause), effect modifier, or mediator?  
  2. What is the target estimand (e.g., average treatment effect vs. conditional effects)?  
  - Scenarios 1–2: Confounding → stratify.  
  - Scenario 3: Mathematical artifact → use collapsible measures (e.g., risk differences).  
  - Scenario 4: Mediation → avoid conditioning.  
  **Outside knowledge** (e.g., causal diagrams, study design) is necessary to choose the "right" table. Paradoxes highlight that statistics without causal models are incomplete.  

  ---

  ### Grading Rubric (20 marks total)  
  **A (18–20 marks):**  
  - Correctly identifies all paradoxes (✓ Sc1, Sc2, Sc3’s OR artifact, Sc4’s mediation).  
  - Explains reversal via confounding (Sc1), effect modification (Sc2), non-collapsibility (Sc3), and mediation (Sc4).  
  - Explicitly states: "Joint distribution alone cannot resolve paradox; causal assumptions are needed."  
  - Advocates for risk differences in Sc3 to avoid non-collapsibility.  
  - Names "collider bias" or "mediation" for Sc4.  

  **B (14–17 marks):**  
  - Misses non-collapsibility (Sc3) or misattributes it to confounding.  
  - Correct on Sc1/Sc2 but vague on why causal context matters.  
  - Identifies Sc4’s issue but lacks mechanistic explanation (e.g., "soreness is affected by treatment").  
  - Omits that stratum size equality (Sc2) doesn’t prevent reversal.  

  **C (10–13 marks):**  
  - Only recognizes classic reversal (Sc1).  
  - Claims Sc3 is "impossible" or misreads tables.  
  - Treats all stratifications as equally valid (e.g., "always stratify").  
  - No mention of causal assumptions in resolving paradoxes.  

  **D/F (<10 marks):**  
  - Fails to identify reversals.  
  - Confuses strata/aggregate directions.  
  - No statistical or causal reasoning.  

  ---  
  **Rationale for Design:**  
  - **Small numbers:** Recovery counts designed for mental math (no calculator needed).  
  - **Sc3’s subtlety:** Exposes memorizers who only know "confounding = paradox."  
  - **Sc4:** Tests understanding of causal structures beyond confounding.  
  - **40-min feasibility:** Focused tables + concise model answer align with time constraints.
