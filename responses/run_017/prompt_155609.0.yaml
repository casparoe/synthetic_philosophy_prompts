prompt: |-
  I've been reading LW and ACX forever so I know all the standard moves around this stuff, but now I actually have to do it for real: I'm one of three people on the grants committee of a small animal-welfare funder, and we get ~30 proposals a year aimed at insects where the whole case is a scale argument — the numbers are astronomic, so even a tenth of a percent chance they feel anything makes the EV look enormous. I know why that's supposed to be fishy (the sentience probability isn't indepedent per insect, it's basically one shared hypothesis, so you're not making a million small bets that diversify, you're making one huge correlated bet) but I can't turn that into anything my committee can run on an actual proposal in an afternoon, with no literature review and no expert on call.

  So: write me a decision procedure. Questions in order, what counts as an adequate answer to each, where it just stops with a no, and where it has to stop and hand to a person because it's a values call. Specifically I want it to handle:

  - unit of account: for eusocial species, is the candidate subject the individual insect, the colony as a superorganism, or both, and how much of the answer rides on that choice;
  - interventions that move the population as well as the welfare per insect (a faster-acting pesticide kills more cleanly but might mean more survivors breeding). My suspicion is the sign of the effect flips depending on whether an insect life is net positive or net negative, and we genuinely don't know, so maybe the procedure branches there or punts;
  - the case where everything funnels into one correlated hypothesis and the right move might be buying information rather than acting — say when.

  Also tell me plainly where the procedure will misfire, i.e. where it hands back confident-looking numbers that are just our priors with a spreadsheet wrapped round them.

  Then run it on three: (1) a supermarket-chain campaign to switch to faster-killing pesticides; (2) funding a study on whether some other clade shows the "pessimism"-style judgement-bias markers I half-remember from bees, on the theory the result propagates across a lot of species at once; (3) the bee-pollination welfare project I've already half-promised a big grant to, which I want you to run honestly even if it comes out saying pull out. British English please.
reasoning: |-
  Okay, the user is on a grants committee for an animal-welfare funder focused on insects. They're dealing with proposals that rely heavily on scale arguments—huge numbers of insects making even small probabilities of sentience lead to high expected value. The user knows the issue is that sentience probability isn't independent per insect but a shared hypothesis, creating correlated risk. They need a practical decision procedure that their committee can use quickly without expert input.

  First, I need to break down their key requests. They want a step-by-step process with clear questions, thresholds for rejection, and points where human judgment is needed. The specific areas to cover are: unit of account for eusocial insects, interventions affecting populations, and when to prioritize information-gathering over action. They also want to know where the procedure might misfire, producing misleadingly confident outputs based on priors rather than evidence.

  The user mentioned three example proposals: a pesticide-switching campaign, a study on judgment biases in other species, and an existing bee-pollination project. I'll need to apply the procedure to each consistently.

  Starting with the structure, I think a flowchart approach would work best. The initial steps should quickly filter out proposals that don't meet basic criteria. The first question should verify whether the proposal actually targets insects, as that's their funding scope. If not, it's an immediate reject. 

  For the unit of account problem in eusocial species, I need a clear decision rule. The key insight is that if welfare is colony-level, then individual insect interventions might not make sense. The procedure should ask whether the intervention affects individuals or colonies and whether the welfare claim depends on individual sentience. If it's ambiguous, that should trigger a "human judgment needed" flag.

  Population-level interventions are tricky because the welfare sign (whether an insect's life is positive or negative) is unknown. The procedure should force this uncertainty to the surface—if the sign is unknown and the intervention affects populations, it shouldn't allow proceeding with scale arguments. Either branch to information-gathering or require explicit value judgments.

  The correlated hypothesis issue is central. The procedure must identify when sentience probability is shared across species or contexts. If it is, then scale arguments become invalid and the focus should shift to information-gathering unless the intervention is reversible or has co-benefits. This is where most proposals will likely fail the "gambler's ruin" test.

  For misfires, I need to be transparent about limitations. The procedure will be weakest when priors dominate—like when sentience evidence is minimal but scale is huge, or when welfare sign assumptions drive conclusions. It'll also struggle with complex flow-through effects or when key probabilities are just made up.

  Applying this to the examples: The pesticide campaign fails quickly because of population effects with unknown welfare sign. The judgment-bias study passes as information-gathering. The bee-pollination project gets complicated—if they've assumed positive welfare but it's actually negative, the whole EV flips. That needs explicit committee judgment.

  Throughout, I'll use British English as requested ("prioritise" not "prioritize", etc.). The tone should be practical, acknowledging the committee's constraints while preventing overconfidence in shaky scale arguments. The goal is to systematise their skepticism without requiring PhD-level analysis each time.
answer: |-
  Here's a pragmatic decision procedure for your committee, designed to cut through scale-argument fog while respecting your constraints. It prioritises tractability, flags key uncertainties, and identifies where values calls are unavoidable. **British English throughout.**

  **Decision Procedure: Insect Welfare Grant Evaluation**

  **Core Principle:** Treat correlated sentience probability as a *single meta-bet*, not millions of independent bets. Scale amplifies *uncertainty*, not just EV.

  **Questions & Flow:**

  1.  **Is the target species/group unambiguously insects?**
      *   *Adequate Answer:* Yes (clearly insects) / No (includes vertebrates, cephalopods, etc.).
      *   *Stop if No:* Reject (outside remit).
      *   *Proceed if Yes.*

  2.  **Does the intervention *primarily* affect insect welfare or populations?** (Identify primary mechanism)
      *   *Adequate Answer:* Welfare per individual (e.g., pain reduction), Population size (e.g., mortality change), Both significantly.
      *   *Hand to Person if "Both significantly":* Requires weighing mechanism dominance.

  3.  **Eusocial Species? If yes, what is the proposed welfare-relevant unit?**
      *   *Adequate Answer:* Individual insect / Colony (superorganism) / Both.
      *   *Crucial Dependence:*
          *   If intervention targets individuals (e.g., pesticide kill-speed) but welfare claim relies *entirely* on *colony-level* sentience/suffering? **Stop & Hand to Person:** High risk of mismatch. Requires justification for why individual treatment affects colony sentience.
          *   If intervention targets colonies (e.g., hive relocation) and welfare claim is colony-level? Proceed.
          *   If intervention targets individuals and welfare claim is individual-level? Proceed, but flag Unit Risk: "Assumes individual sentience relevant in eusocial context."
      *   *General Rule:* Default to the unit the *intervention directly affects* unless strong justification for a different sentience unit is embedded in the proposal. **Lack of justification = Hand to Person.**

  4.  **Does the intervention change net population size?**
      *   *Adequate Answer:* Yes (increases/decreases population) / No (welfare change only) / Uncertain.
      *   *Stop & Hand to Person if "Yes" or "Uncertain" AND Welfare Sign Unknown:* This is critical. If you don't know if an insect's life is net positive or negative welfare, changing populations flips EV sign arbitrarily. *Cannot proceed with scale EV argument.* Requires either:
          *   a) Explicit committee value judgment on assumed welfare sign (highly problematic).
          *   b) Rejecting scale argument and evaluating *only* per-capita welfare effects, ignoring population change (often guts the proposal).
          *   c) Shifting focus to pure information-gathering *on welfare sign* (see Q7).
      *   *Proceed if "No":* Only per-capita welfare changes.
      *   *Proceed if "Yes" AND Welfare Sign Confidently Known:* (Extremely rare! Requires strong evidence).

  5.  **Is the sentience probability genuinely independent per insect? Or is it one correlated hypothesis?**
      *   *Adequate Answer:* Correlated (e.g., "all bees feel pain", "all nematodes have subjective experience") / Independent (e.g., unique intervention per insect with uncorrelated sentience chance - highly unrealistic) / Partially Correlated (specify groups).
      *   *Stop if "Correlated" or "Partially Correlated":* **Gambler's Ruin Test:** Scale arguments fail catastrophically here. Do not calculate naive EV (Sentience Prob x Number Affected x Welfare Gain). Instead:
          *   a) **Does the proposal primarily fund *information gathering* (research) to *reduce uncertainty* on the correlated hypothesis?** If Yes, proceed to Q7.
          *   b) **Is the intervention highly reversible/testable on small scale *before* massive rollout?** If Yes, *maybe* proceed to Cost-Effectiveness (Q6), but flag massive correlation risk.
          *   c) **Does it have significant co-benefits (e.g., environmental) independent of insect sentience?** If Yes, *maybe* proceed to Cost-Effectiveness (Q6) weighing co-benefits.
          *   If none of (a-c) apply: **Reject.** The single-bet risk is too high for direct action based solely on scale EV.
      *   *Proceed if "Independent":* (Theoretical only) Calculate naive EV cautiously.

  6.  **Cost-Effectiveness (Only if passed Q4 & Q5 filters):**
      *   *Adequate Answer:* Rough estimate of cost per unit welfare improvement (adjusted for probability/sign), compared to other opportunities. Can be qualitative (High/Med/Low).
      *   *Hand to Person:* Requires committee judgment relative to other proposals and funding priorities. No hard stop.

  7.  **Information-Gathering Focus (Especially for correlated hypotheses or unknown welfare sign):**
      *   *Adequate Answer:* Clear description of the uncertainty to be reduced, method, cost, potential impact (how much will it reduce uncertainty? How many future decisions/insects might it inform?).
      *   *Stop if:* Cost disproportionate to potential information value, method invalid, uncertainty reduction unlikely to be actionable.
      *   *Hand to Person:* Judgment call on value of information (VOI) relative to cost and other info needs.

  **Where the Procedure Misfires (Produces False Confidence):**

  1.  **The Prior Dominance Zone:** When the *prior* probability of insect sentience (for the relevant clade/context) is extremely low (e.g., 1e-9) based on fundamental neuroscience, but the proposed number affected is extremely high (e.g., 1e12). The procedure might technically allow proceeding if other filters pass (e.g., no pop change, assumed welfare sign). However, the output EV will be highly sensitive *only* to the arbitrary prior plugged in, masked by the spreadsheet. The committee needs strong awareness: **if the sentience prior feels like it's being made up whole cloth, the EV is nonsense, regardless of the procedure.**
  2.  **Complex Flow-Through Effects:** The procedure simplifies population effects (Q4). In reality, interventions might have complex ecological feedback loops (e.g., faster pesticide reduces prey for sentient spiders). The procedure might miss these, leading to misleading "No population change" conclusions.
  3.  **"Partially Correlated" Ambiguity:** Defining the correlation group size (species? genus? order?) is fuzzy. The procedure might under or over-estimate the correlation risk.
  4.  **Welfare Function Complexity:** It assumes welfare sign (positive/negative life) is binary and uniform. Reality is messier (e.g., life could be net negative but contain positive moments reducible by welfare interventions). The procedure might force an oversimplified choice at Q4.

  **Running the Examples:**

  1.  **Supermarket-Chain Campaign: Switch to Faster-Killing Pesticides.**
      *   Q1: Yes (Insects).
      *   Q2: Both (Kill-speed = welfare per individual? Population reduction = population effect?).
      *   Q3: (Assume target pests are non-eusocial e.g., aphids): Individual unit. Proceed.
      *   Q4: **YES.** Significantly reduces pest population. **Welfare Sign Unknown?** YES. **STOP & HAND TO PERSON.**
      *   *Outcome:* Cannot proceed via scale EV. Committee must either: a) Reject based on unknown welfare sign + population effect, b) Commission research on welfare sign/suffering in aphids (shifting to info-gathering), or c) Make an explicit, highly contentious value judgment that aphid lives are net negative (enabling naive EV calculation *if* sentience prob is independent - see Q5).
      *   *Q5 Check (if committee forces welfare sign):* Sentience prob for aphids is almost certainly a *correlated hypothesis*. Fails Gambler's Ruin Test unless info/research/reversibility applies. Campaigns are hard to reverse/test small-scale.

  2.  **Funding Study: "Pessimism"-Style Judgement-Bias Markers in [Other Clade] (e.g., Wasps).**
      *   Q1: Yes (Insects).
      *   Q2: Information Gathering (Primary effect).
      *   Q3: N/A (Research doesn't directly intervene).
      *   Q4: N/A (No direct population change).
      *   Q5: **Inherently Correlated Hypothesis.** Sentience in wasps (or clade) is one big bet. **Gambler's Ruin Test:** a) **YES - Primarily Information Gathering.** Proceed to Q7.
      *   Q7: **Adequate Answer?** High potential impact. Finding markers in wasps strongly updates (reduces uncertainty) on sentience across Hymenoptera (bees, ants, wasps) - billions/trillions affected. Cost likely reasonable for potential info value. **Proceed to Cost-Effectiveness (Q6) / Committee Judgment.**
      *   *Outcome:* Strong candidate for funding. Directly addresses the core correlation problem via information.

  3.  **Bee-Pollination Welfare Project (e.g., promoting bee-friendly flowers):**
      *   Q1: Yes (Bees).
      *   Q2: Both (Welfare: More/better food? Population: Likely increases managed/native bee populations).
      *   Q3: **Eusocial.** Proposal likely assumes individual bee welfare. Intervention (flowers) targets individuals. **Flag Unit Risk:** Justification needed for individual sentience focus vs. colony. *Hand to Person?* Depends on proposal detail. Assume proceeds with flag.
      *   Q4: **YES.** Increases bee populations (goal is often healthier/more hives/wild bees). **Welfare Sign Unknown?** YES. **STOP & HAND TO PERSON.**
      *   *Outcome:* **Hits the same wall as #1.** The core problem: Does increasing the number of bees *increase* or *decrease* total welfare? If a bee's life is net suffering, creating more bees is bad. If net positive, it's good. **This is a fundamental, unresolved value/empirical question the committee *must* confront explicitly.** The half-promise is on shaky ground. Options:
          *   a) **Reject/Reduce:** Based on inability to resolve welfare sign and population effect. Scale argument invalid.
          *   b) **Reframe:** Fund *only* the per-capita welfare aspect (e.g., do these flowers *reduce suffering* for *existing* bees?), ignoring population increase. This likely guts the proposal's scale claim.
          *   c) **Value Judgment:** Committee *explicitly* states: "We assume a bee's life is net positive." This allows proceeding *if* sentience prob is independent (Q5).
      *   *Q5 Check (if committee forces welfare sign=positive):* Bee sentience is a **highly correlated hypothesis** (one bet for honeybees/bumblebees). Fails Gambler's Ruin Test. Scale EV is invalid. Only passes if the intervention is small-scale, reversible, or has strong co-benefits (e.g., crop pollination). A "big grant" for widespread rollout based *only* on bee sentience scale EV is **high risk**.

  **Conclusion:** This procedure forces your committee to confront the **correlation meta-bet** (Q5) and the **welfare sign/population effect trap** (Q4), which are the Achilles' heels of insect scale arguments. It prioritises **information-gathering** as the highest-value activity when facing fundamental uncertainty. It flags **values calls** clearly (Q3 unit justification, Q4 welfare sign, Q6 prioritisation). It will **reject many direct-action proposals** relying solely on scale EV under correlation, which is likely necessary. Run the bee project honestly: **it probably fails Q4 & Q5 unless radically reframed or accompanied by a major, explicit committee values decision on welfare sign.** Good luck!
