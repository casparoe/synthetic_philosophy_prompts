       The students will figure out they are the subjects? That's okay. We can acknowledge that at the debrief. We might even say: "Yes, and that's part of the experiment: to see how group dynamics affect decision-making."

       What the game cannot show:

          - Asymptotic results: that as the group size goes to infinity, the group accuracy goes to 1 (if individual competence>50% and independence). We only have 24.

          - The value of discussion: in the game, the signals are bare verdicts. In reality, discussion can allow people to share reasons and might improve the group decision. But it can also lead to herding or groupthink. Our deference condition captures one aspect (herding) but not the full complexity.

          - The two-tier system might in reality allow for expertise concentration, but our game does not model expertise (everyone has the same accuracy). So we cannot test that. We have to note that in the faculty meeting, the argument for expertise is about having more accurate subcommittees, but in our model, the subcommittees are not more accurate.

       Headline: The design choice that does the most work in making independence visible is the common cause condition, which reduces the effective number of independent signals by having pairs share the same evidence, thus introducing correlation without direct copying.

   Let's write the instructions.

   Instructions to read aloud:

   Introduction (5 minutes):

     "Today we are going to play a game about group decision-making. We have two bags: one has mostly red chips (60% red, 40% blue) and the other has mostly blue chips (60% blue, 40% red). I will flip a coin to choose which bag we are using. Your goal, as a group, is to figure out which bag it is: the red-majority bag or the blue-majority bag.

     Each of you will draw a chip from the bag. The chip you draw is a clue: if you draw a red chip, that suggests the bag is the red-majority bag; a blue chip suggests the blue-majority bag. But note: sometimes you might draw a blue chip from the red-majority bag, or vice versa.

     We will run several rounds, each with a different procedure. In each round, we will flip a coin to choose the bag again. Then you will draw chips and vote. The group will make a decision by majority vote.

     You will earn points in two ways:
        1. If the group decision is correct, everyone gets 1 point.
        2. Additionally, you get points for being individually correct: 
              - In most rounds: if the chip you drew was the majority color of the true bag, you get 1 point.
              - In the first round (Condition A) only: after you see your chip, you may choose to declare that you are especially confident in your clue. If you do, then:
                    - If you are correct, you get 2 points (instead of 1).
                    - If you are wrong, you get 0 points (instead of 0 or 1? Actually, if you don't declare and are correct, you get 1; if wrong, 0. If you declare and are correct, you get 2; if wrong, 0).
              Also, if you declare your vote as strong, your vote in the group decision will count twice.

     We will keep track of the points. At the end, the student with the most points gets bragging rights.

     We will have four different procedures, and we will do two rounds for each.

     Let's start with Condition A."

   Condition A (Baseline) - per trial:

     "I am flipping a coin to choose the bag. [Flip] The coin says [heads/tails] so we are using [Bag R/Bag B]. Remember, you don't know which bag it is.

     Now, one by one, come up and draw one chip from the bag. Look at it privately and remember the color. Then put it back and mix the bag. [We do 24 draws]

     Now, each of you: based on your chip, you think the bag is either red-majority or blue-majority. You also have the option to declare that you are especially confident in your clue. If you do, your vote will count twice in the group decision, and your individual points will be doubled if you are correct (but if you are wrong, you get 0 for the individual part).

     Write on your index card:
          - Your vote: 'red' or 'blue'
          - And whether you declare it strong: write 'strong' if you do, or leave it blank if not.

     Fold the card and put it in the ballot box.

     [Collect and tally: the Tally Clerk separates the strong and normal votes. For strong votes, they count as two votes. Then the total votes for red and blue. Announce the group decision.]

     Now, I reveal the true bag: it was [Bag R/Bag B]. So the group decision was [correct/wrong]. Therefore, everyone gets 1 point for the group being [correct/wrong].

     Now, for individual points: if your chip was the same as the majority color of the true bag, then you are individually correct. For example, if the true bag is red-majority, then if you drew a red chip, you are correct. If you declared strong and are correct, you get 2 points. If you did not declare strong and are correct, you get 1 point. If you are wrong, you get 0 points for the individual part.

     [Record on the board: True bag, group decision, number of individual correct, number of strong declarations and how many of those were correct.]

     Let's do a second trial of Condition A. [Repeat]

   Condition B (Common Cause) - per trial:

     "Now we change the procedure. I am flipping the coin again. [Flip] The bag is [Bag R/Bag B].

     This time, we will form pairs. [Randomly assign pairs] For each pair, I will draw one chip and show it to both of you. Then you will each record the color you saw and then vote based on that. Remember, if you see a red chip, you vote for the red-majority bag; blue for blue-majority.

     [For each pair: draw one chip, show both students, then replace and mix. Then move to next pair.]

     Now, each of you, write your vote on an index card (just the vote, no strong declaration). Secret ballot.

     [Collect and tally. Announce group decision.]

     Reveal the true bag: [Bag R/Bag B]. Group [correct/wrong] -> everyone gets 1 point if correct.

     Individual points: if the chip you saw was the majority color of the true bag, then you get 1 point.

     [Record: True bag, group decision, number of individual correct.]

     Second trial.

   Condition C (Deference) - per trial:

     "Now we change again. We are back to each drawing individually. [Flip coin] The bag is [Bag R/Bag B].

     Each of you draw a chip (with replacement) and record the color.

     Now, we will vote publicly in a random order. I will assign each of you a number. Then you will come to the front in order. When you come, you will see the current tally of votes so far. Then you will announce your vote out loud. You may vote however you wish: you can base it on your chip, or on the tally, or anything else. Remember: you get points for your vote being individually correct (so if you vote for the true bag, you get 1 point) and also if the group is correct (1 point).

     [Assign random order. Have students line up. The first student: no tally to see, so they vote. The Tally Clerk writes: Vote 1: [color] -> tally: red 1, blue 0. The second student sees the tally and votes. And so on.]

     After the last vote, we have the group decision (majority). Reveal the true bag.

     Scoring: 
          Group correct: everyone gets 1 point if correct.
          Individual vote: if your vote (what you said) was for the true bag, you get 1 point.

     [Record: True bag, group decision, and also note: how many voted against their own chip? We might not record that publicly, but we can note it for debrief.]

     Second trial.

   Condition D (Two-Tier) - per trial:

     "Last condition. We flip the coin. [Flip] The bag is [Bag R/Bag B].

     We split into four groups of six. [Split] Each group goes to a corner of the room. Each group has a bag (the same one I just flipped for). In your group, each member draws one chip (with replacement) and records the color.

     Then, you vote by secret ballot within your group: each person writes their vote (based on their chip) on a card. The group tally clerk (one of you) counts the votes. The majority vote of the six is the group's verdict. (If there's a tie, flip a coin.)

     Then, the group verdict is reported to me.

     After we have four verdicts, I will determine the class decision: if at least three groups agree, that wins. If two say red and two say blue, I flip a coin.

     Reveal the true bag.

     Scoring:
          Group correct (the class decision): everyone gets 1 point if correct.
          Individual: if the chip you drew was the majority color of the true bag, you get 1 point.

     [Record: True bag, class decision, and also the four group verdicts and how they voted.]

     Second trial.

   Debrief (30 minutes):

     We have a table on the board with the results. We go through:

     Condition A (Baseline): 
          - We had two trials. How many times was the group correct? (Probably 2/2) 
          - How many individuals were correct in each trial? (About 14-15 per trial) 
          - How many declared strong? How many of those were correct? (We expect about 60% of the strong declarations were correct? Not higher.) 
          - Why was the group always right? Because the errors were independent and random, so they canceled out? 
          - Was there any individual who was always correct? (Check: did any student have two correct individual signals?) But even if there was, the group was still correct. And note: the group is more reliable than any single individual in the long run.

     Condition B (Common Cause):
          - How many times was the group correct? (We expect less than Condition A, maybe 1/2 or 0/2) 
          - Why? Because the errors were correlated. If one draw was wrong, two people voted wrong. So the errors didn't cancel as well.

     Condition C (Deference):
          - How many times was the group correct? 
          - Also, we can ask: how many of you voted differently from your own chip? Why? 
          - And did the group decision follow the first few votes? 
          - We expect that if the first few are wrong, the whole group might go wrong. And even if the first few are right, the later voters might not add new information.

     Condition D (Two-Tier):
          - How many times was the group correct? 
          - How many of the small groups were correct? 
          - Why is the two-tier system less reliable? Because the small groups might make mistakes, and then we aggregate those mistakes.

     Then introduce Condorcet: 
          - The theorem says: if each voter has an independent probability p>0.5 of being correct, then the probability that the majority is correct goes to 1 as the group size increases. But two things are crucial: 
               (1) p>0.5 (competence)
               (2) independence.

          - In Condition B, we broke independence by having correlated errors (common cause). 
          - In Condition C, we broke independence by having voters influence each other (deference). 
          - In Condition D, we broke the group into smaller groups, which are less reliable, and then aggregated the group verdicts. The theorem applies at each level, but the overall reliability is lower than having one big group.

     Also, the confidence wrinkle: 
          - In Condition A, did the students who declared strong have a higher accuracy? (We expect not, because everyone had the same accuracy.) 
          - So self-reported confidence is not the same as actual competence.

     Finally, what the game cannot show:
          - Discussion: in reality, when people discuss, they share reasons. That might allow the group to discount bad evidence or to correct misunderstandings. But it might also lead to groupthink. Our deference condition only captures the negative aspect of influence.

          - Expertise: in our game, everyone is equally competent. But in the faculty hiring, the subcommittees might have more expertise. We would need a model where some people are more accurate than others.

     We can end by connecting to the faculty meeting: 
          - The chair's proposal (two-tier) might be less reliable in aggregating the truth if we assume equal competence. But if the subcommittees are more competent, then it might be better. 
          - The colleague who wants the whole department in one room is advocating for a procedure that, if everyone is independent and competent, is more reliable. 
          - The one who wants secret ballots and no discussion is trying to preserve independence.

     Headline: The common cause condition, by having pairs share a single chip, introduces correlated errors that visibly reduce group accuracy compared to the baseline, demonstrating the fragility of the independence assumption.

     Note: We must be prepared for noise in the results because we have few trials. We can say: "In two trials, we might not see the exact pattern, but overall we expect ..."

     Also, if a student asks halfway: "What is the point of this?" We can say: "We are exploring how different group decision procedures affect the accuracy of the group. At the end, we will discuss what we found."

     Roles: 
          - Tally Clerk: helps the instructor count votes and record results on the board.
          - Announcer (for Condition C): not needed, because the Tally Clerk updates the tally publicly.

     Materials: 
          - Two bags: 
               Bag R: 6 red, 4 blue chips (or more if we want, but 10 per bag is manageable)
               Bag B: 6 blue, 4 red chips
          - A coin
          - Index cards for voting (plenty)
          - A ballot box
          - A whiteboard to record results and points.

     Timeline:

          Minute 0-5: Introduction
          Minute 5-15: Condition A (2 trials)
          Minute 15-25: Condition B (2 trials)
          Minute 25-45: Condition C (2 trials) [20 minutes because sequential voting takes time]
          Minute 45-60: Condition D (2 trials) [15 minutes]
          Minute 60-90: Debrief

     We hope that the effects are visible enough in two trials per condition. If not, we can run one more trial in a condition that didn't show the effect? But we are tight on time.

     Let's hope for the best.

     Final note: The headline design choice is the common cause condition.

     Headline: Pairing students to share a single chip creates correlated errors that visibly reduce group accuracy, demonstrating that independence is not just about the number of votes but about the sources of evidence.
answer: |-
  ### Experiment Design: Majority Rule Reliability Game

  **Core Structure**  
  24 students, 4 conditions (2 trials each), using bags of chips to simulate evidence. Bag R: 60% red chips, 40% blue. Bag B: 60% blue, 40% red. Coin flip selects the true bag each trial. Students earn points:  
  - 1 point for correct group decision (shared).  
  - 1 point for individual correct signal (unless Condition A "strong vote" misreports).  
  Points buy trivial rewards (e.g., candy, stickers, bragging rights).

  **Chip Proportions & Group Sizing**  
  - **60/40 chip split**: Ensures individual accuracy is 60% (high enough for Condorcet benefits but low enough to show degradation).  
  - **24 students**: Baseline majority will be correct ~99% of the time theoretically, but correlated/deference flaws create visible drops with 2 trials.  
  - **Common cause pairs**: 12 pairs share a signal (halving independent signals).  
  - **Two-tier**: Four juries of six (each jury majority needs 4/6).  

  **Conditions & Mechanics**  
  1. **Baseline (Independent Signals)**  
     - *Mechanics*: Secret ballot, no interaction. Students may declare "strong signal" (double vote, double points if correct; 0 if wrong).  
     - *Why*: Shows wisdom of crowds; exposes overconfidence in self-reported strength.  

  2. **Common Cause (Correlated Errors)**  
     - *Mechanics*: Random pairs. One chip drawn per pair; both students see same chip, vote secretly.  
     - *Why*: Errors correlate without copying (shared cause halves independent signals).  

  3. **Deference (Social Influence)**  
     - *Mechanics*: Public sequential voting. Later voters see running tally before voting.  
     - *Why*: Herding amplifies early errors; independence destroyed by social pressure.  

  4. **Two-Tier (Hierarchical Aggregation)**  
     - *Mechanics*: Class splits into four juries of six. Each jury holds secret ballot; majority verdict sent to full class. Class majority of four verdicts wins.  
     - *Why*: Tests chair’s proposal; smaller groups increase error risk.  

  **Confidence Wrinkle**  
  - **Where**: Baseline only.  
  - **Why**: Reveals self-reported confidence ≠ competence. Students see that "strong" voters (60% accurate, same as others) often err but sway outcomes.  

  ---

  ### Materials & Roles  
  - **Materials**:  
    - Coin.  
    - Two opaque bags:  
      - Bag R: 6 red, 4 blue chips (label hidden).  
      - Bag B: 6 blue, 4 red chips (label hidden).  
    - Index cards (for voting).  
    - Whiteboard (for tallying).  
  - **Roles**:  
    - **Tally Clerk**: Records votes/points on whiteboard.  
    - **Announcer** (Condition C): Calls out running tally during deference votes.  
    - **Jury Forepersons** (Condition D): Report verdicts from each jury.  

  ---

  ### Timeline (90 Minutes Total)  
  - **0:00–0:05—Setup & Rules**  
    Read *Introduction Script* (below). Assign roles.  

  - **0:05–0:15—Baseline (2 Trials)**  
    - *Per Trial*: Flip coin → students draw chips → vote secretly (option to declare "strong") → tally votes → reveal true bag → record points.  

  - **0:15–0:25—Common Cause (2 Trials)**  
    - *Per Trial*: Flip coin → form pairs → draw one chip per pair → vote secretly → tally → reveal → record.  

  - **0:25–0:45—Deference (2 Trials)**  
    - *Per Trial*: Flip coin → draw chips → vote in public order (update tally after each vote) → reveal → record.  

  - **0:45–1:00—Two-Tier (2 Trials)**  
    - *Per Trial*: Flip coin → split into four juries → each jury draws/votes secretly → jury verdicts aggregated → class majority → reveal → record.  

  - **1:00–1:30—Debrief**  
    Discuss patterns → map to Condorcet → address faculty hiring debate.  

  ---

  ### Read-Aloud Instructions  

  #### **Introduction Script**  
  > "Today, we’re playing a game about group decisions. I have two bags: one has mostly red chips, the other mostly blue. I’ll flip a coin to pick a bag each round. Your job is to guess which bag it is.  
  >   
  > You’ll draw a chip as a clue: red suggests the red-majority bag, blue suggests blue-majority. But clues can be wrong—sometimes you’ll draw a minority chip.  
  >   
  > We’ll try four ways to vote, with two rounds each. Points:  
  > - 1 point if the group’s final decision is right (everyone gets this).  
  > - 1 point if your personal clue was right* (*except in Round 1 if you declare a ‘strong signal’—more on that later).  
  > Points add up—earn bragging rights or candy!  
  >   
  > Rules:  
  > - Keep your chip color private unless told otherwise.  
  > - No talking during trials except Condition 3.  
  > Let’s begin."  

  #### **Baseline Script (Per Trial)**  
  > "Coin flip... [Flip]. Bag chosen.  
  > Line up, draw one chip each—look privately, drop it back, mix the bag.  
  > Now: vote by secret ballot on if it’s the red or blue bag. On your card, write:  
  > - Your vote (‘red’ or ‘blue’).  
  > - ‘STRONG’ if you think your clue is extra reliable.  
  > If you write ‘STRONG’:  
  > - Your vote counts twice for the group.  
  > - You get 2 points if right, 0 if wrong.  
  > If not: 1 point if right, 0 if wrong.  
  > Fold cards; tally clerk collects.  
  > [Tally votes—announce majority].  
  > True bag was [reveal]. Group correct? [Yes/No]—everyone gets 1 point if yes.  
  > Now: if your chip color matched the bag’s majority, mark your points."  

  #### **Common Cause Script (Per Trial)**  
  > "Coin flip... [Flip]. Bag chosen.  
  > Pair up randomly. I’ll draw one chip per pair—you both see it, but keep it private. Drop it back, mix.  
  > Vote secretly: write ‘red’ or ‘blue’ on cards—no ‘STRONG’ option.  
  > [Tally votes—announce majority].  
  > True bag was [reveal]. Group correct? 1 point for all if yes.  
  > If the chip you saw matched the bag’s majority, mark 1 point."  

  #### **Deference Script (Per Trial)**  
  > "Coin flip... [Flip]. Bag chosen.  
  > Draw chips privately.  
  > Now, public vote in random order. When called, step up, see the current tally, then say ‘red’ or ‘blue’ aloud.  
  > Announcer updates tally after each vote.  
  > [After 24 votes, announce majority].  
  > True bag was [reveal]. Group correct? 1 point for all if yes.  
  > If your vote matched the true bag, mark 1 point."  

  #### **Two-Tier Script (Per Trial)**  
  > "Coin flip... [Flip]. Bag chosen.  
  > Split into four juries of six. Each jury:  
  > - Draw chips privately.  
  > - Secret ballot: vote ‘red’ or ‘blue’.  
  > - Tally clerk takes majority (4+ votes wins; tie = coin flip).  
  > Jury foreperson reports verdict to me.  
  > I announce the four verdicts. Class majority wins (3+ same verdict; tie = coin flip).  
  > True bag was [reveal]. Group correct? 1 point for all if yes.  
  > If your chip matched the true bag, mark 1 point."  

  #### **Mid-Game Question Script**  
  > If a student asks: *"What’s the point?"*  
  > Respond: **"We’re testing how different group rules change outcomes. Your job is to give honest signals and votes—I’ll explain how it all connects later. For now, focus on earning points!"**  

  ---

  ### Debrief: Connecting Experience to Theory  
  **Map Observations to Condorcet Concepts**  
  1. **Baseline (Wisdom of Crowds)**  
     - *Observe*: Group correct even when 40% individuals wrong. Strong voters often erred.  
     - *Theory*: **Competence condition** (p>0.5) + **independence** → majority outperforms best individual. Self-reported confidence ≠ competence.  

  2. **Common Cause (Correlated Errors)**  
     - *Observe*: Group accuracy dropped vs. baseline. Errors clustered (e.g., whole pair wrong).  
     - *Theory*: **Independence destroyed by shared cause** → signals not additive. Effective group size halved.  

  3. **Deference (Social Influence)**  
     - *Observe*: Herding (later voters followed early tally). Group wrong if early voters wrong.  
     - *Theory*: **Independence destroyed by deference** → information cascade. Bare verdicts amplify noise; discussion (with reasons) might help but wasn’t tested.  

  4. **Two-Tier (Hierarchy)**  
     - *Observe*: More errors than baseline. Juries made mistakes; final vote amplified them.  
     - *Theory*: Smaller groups → **lower reliability per jury** (p=0.6, 6 voters: 73% accurate vs. 99% for 24). Hierarchy compounds error. Chair’s proposal risks "expertise" without actual competence gain.  

  **Handling Challenges**  
  - **Effect Fails?**: Common cause most likely to "fail" (if correlated errors don’t manifest). *Fix*: Contrast group accuracy in baseline vs. common cause trials—even if both "right," emphasize clustered errors in common cause.  
  - **Students Realize They’re Subjects?**: Normalize it—"Yes! You experienced how rules shape decisions. Now let’s analyze why."  
  - **One Super-Accurate Student?**: Highlight group vs. individual reliability long-term (e.g., "In 10 trials, would you still beat the group?").  

  **What the Game Cannot Show**  
  - **Asymptotics**: n=24 is finite; can’t show p→1 with large n.  
  - **Discussion’s Value**: Signals were bare verdicts, not reasons. Real discussion may improve accuracy (e.g., correcting misunderstandings) but risks groupthink. *Say*: "We isolated independence—discussion needs its own experiment."  
  - **Variable Competence**: All had p=0.6. Real groups mix experts/novices.  

  ---

  **Headline: Pairing students to observe identical evidence halves effective group size, making correlated errors visceral and independence tangible.**
