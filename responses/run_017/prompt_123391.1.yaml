prompt: |-
  Hey — I'm stuck on the methods/framework chapter of my thesis (philosophy + cog sci, I'm attached to a vision lab) and I've been going in circles for a couple of weeks, so let me outsource the actual hard part. What I want is a desiderata list, not a theory and not a literature review. The job I'm specifying adequacy for is this: a method for collecting and using first-person data in a science of consciousness has to be able to settle claims of the form "subject S has an experience of kind K" / "lacks one" / "has one that differs from S's in respect R". Concretely: does someone who reports no mental imagery actually have visual imagery; is a subject in one of those no-report paradigms consciously perceiving the stimulus or not; does the blindsight patient see anything; do two subjects who both use the word "imagine" mean the same thing by it. My supervisor is a heterophenomenology person — treat the reports as texts, reconstruct the world the subject is describing, don't grant first-person authority, stay scrupulously neutral on whether any of the described items are really there — and my labmate is much more neurophenomenology / microphenomenology: train the subjects, get them into something like the reduction, treat reporting as a skill that improves with practice. Every time the three of us argue we just restate whichever we already liked, because we've never actually said what a method has to deliver.

  So: write me the spec. What are the requirements, what is the case or consideration behind each one, and which are genuinely non-negotiable for that adjudicating job versus which are just preferences of one camp dressed up as requirements (I strongly suspect both "don't trust the report" and "train the subject until the report gets rich" are camp commitments, but tell me if I'm wrong). Things I already think belong on the list, so you can sharpen or destroy them rather than rediscover them: the method needs something principled to say when verbal report and forced-choice behaviour come apart — someone describes vivid imagery and discriminates at chance, or the reverse — and I want to know whether that's noise to be averaged out or a datum in its own right. It needs to distinguish having no experience from having one you can't report or don't have a concept for: the people who only discover they lack imagery after they encounter the concept seem like the pivotal case, and so does the inverted-spectrum-shaped worry that no quantity of report could in principle settle the question. It needs to be able to fail on an individual subject, not only at the group level. And two things I almost never see discussed, which I want you to take seriously as candidate requirements: (1) the revision problem — subjects retract and refine their own reports across sessions ("no wait, I do have something, it just isn't picture-like"), and most methods treat a report as a fixed datapoint with no account of what a later revision does to the earlier one, or of when a series of reports is even the same measurement; (2) the interviewer is part of the instrument — the probes, the vocabulary on offer, the interviewer's own imagery, the way a session is framed all leak into what comes back, so how much of that has to be controlled or independently measured before the method is worthless? Please also tell me whether some subset of the desiderata is jointly unsatisfiable, because that would honestly be the most useful thing in the whole chapter: my hunches are that "stay neutral about whether the described experiences exist" and "be able to detect an experience the subject can't report" can't both be had, and that "comparability across subjects" and "don't presuppose shared structure of experience" are in tension. And which single requirement does the most work in ruling candidates out — the one that quietly kills the most popular method? A short scorecard at the end for heterophenomenology, neurophenomenology/microphenomenology, and the no-report style paradigms on the neuroscience side is welcome, but keep the bulk on the criteria and their motivating cases. And please no citations or reading lists — i'm on a long flight with no wifi, I know the canon, I need the argument.
reasoning: |-
  We are constructing a desiderata list for a method of collecting and using first-person data in the science of consciousness. The method must adjudicate claims of the form: 
  - Subject S has an experience of kind K / lacks one / has one that differs from subject S' in respect R.

  Concrete cases:
  1. A person reporting no mental imagery: do they actually have visual imagery?
  2. In no-report paradigms: is the subject consciously perceiving the stimulus?
  3. Blindsight: does the patient see anything?
  4. Do two subjects using the word "imagine" mean the same thing?

  We have two camps:
  - Heterophenomenology (supervisor): treat reports as texts, reconstruct the subject's described world, no first-person authority, scrupulous neutrality on the reality of the described experiences.
  - Neurophenomenology/microphenomenology (labmate): train subjects to get into a state like the phenomenological reduction, treat reporting as a skill that improves with practice.

  The goal is a list of requirements, each with a case or consideration behind it, and note which are non-negotiable for the job vs. camp preferences. Also, address the issues the user raised: verbal report vs. forced-choice behavior, distinguishing no experience from inability to report, revision problem, interviewer effects, and potential tensions between desiderata.

  The user's existing ideas for the list:
  - Principled handling of when verbal report and forced-choice behavior come apart (e.g., vivid report but chance discrimination, or the reverse). Is this noise or a datum?
  - Distinguish having no experience from having one you can't report or lack a concept for (e.g., people who discover they lack imagery only after encountering the concept; inverted spectrum worry).
  - The method must be able to fail on an individual subject, not just at the group level.
  - The revision problem: subjects retract and refine reports across sessions. How to handle a series of reports? When is it the same measurement?
  - Interviewer effects: the interviewer is part of the instrument (probes, vocabulary, framing). How much control or independent measurement is needed?

  Potential tensions the user suspects:
  - "Stay neutral about whether the described experiences exist" and "be able to detect an experience the subject can't report" might be jointly unsatisfiable.
  - "Comparability across subjects" and "don't presuppose shared structure of experience" might be in tension.

  We need to also identify which requirement does the most work in ruling out methods and provide a short scorecard for the three approaches.

  Let's build the desiderata list:

  1. **Adjudicative Power**: The method must provide a basis for settling the target claims (has K, lacks K, differs in R) for individual subjects. 
     - *Motivation*: The core job. Without this, the method fails its primary purpose. Cases: blindsight (does the patient see?), no mental imagery (does the person have imagery?), no-report paradigms (is there conscious perception?).
     - *Non-negotiable*: Yes. If the method cannot adjudicate, it's not fit for purpose.

  2. **Resolution of Report-Behavior Dissociations**: The method must have a principled way to handle cases where verbal report and forced-choice behavior diverge (e.g., subject reports vivid imagery but performs at chance in a discrimination task, or the reverse).
     - *Motivation*: Critical for cases like blindsight (good discrimination without report) or the opposite (e.g., in some mental imagery tasks, a subject might report nothing but show behavioral evidence of imagery). This is a core challenge in consciousness studies.
     - *Non-negotiable*: Likely yes, because these dissociations are at the heart of many debates. The method must say whether such a dissociation indicates a lack of experience, a reporting failure, or something else. Treating it as mere noise would miss crucial data.

  3. **Distinguishing Absence from Inaccessibility**: The method must differentiate between (a) the absence of an experience and (b) the presence of an experience that is unreportable (due to lack of concept, inattention, or other access limitations).
     - *Motivation*: Cases: people who only realize they lack imagery after learning about the concept (suggesting they didn't have the concept to report its absence); inverted spectrum (where reports are identical but experiences might differ in ways that are inherently unreportable). Also, in no-report paradigms, we need to know if there is an experience even if not reported.
     - *Non-negotiable*: Yes, because without this, we cannot know if we are measuring experience or reportability.

  4. **Individual-Level Application**: The method must be able to yield results for individual subjects, not just at the group level.
     - *Motivation*: Consciousness is subjective and individual. We need to know about S's experience, not just group averages. Cases: blindsight patient (individual), aphantasia (individual variation).
     - *Non-negotiable*: Yes. Group-level data cannot settle claims about a particular subject.

  5. **Handling Revision and Refinement**: The method must account for the fact that subjects may revise their reports over time (e.g., "I thought I had no imagery, but now I realize it's not picture-like"). It must provide a way to understand a series of reports as part of a process and not treat each report as an isolated, fixed datum.
     - *Motivation*: The revision problem. Subjects learn to introspect better or change their minds. Without this, we might misinterpret early reports. Also, it raises the question of when two reports are about the same experience or measurement.
     - *Non-negotiable*: Probably yes, because ignoring revisions leads to inaccurate data. However, the extent to which this is built into the method might vary.

  6. **Interviewer Effect Control**: The method must account for the influence of the interviewer (or experimental context) on the reports. This includes the probes used, the vocabulary offered, the framing of the session, and the interviewer's own biases. There must be a way to measure or control these effects to avoid contaminating the data.
     - *Motivation*: Interviewer effects are real (e.g., leading questions can shape reports). In neurophenomenology, training might reduce this, but it might also introduce new biases. Cases: when the interviewer's own imagery might influence the subject's report (e.g., by offering metaphors that the subject adopts).
     - *Non-negotiable*: To some degree, yes. Without control, the data may reflect the interviewer more than the subject's experience. But the level of control required might be a matter of degree. A method that ignores this entirely is flawed.

  7. **Neutrality about the Existence of Experiences**: The method should not presuppose the reality or unreality of the experiences described. It should be compatible with both realist and anti-realist interpretations of the reports.
     - *Motivation*: Heterophenomenology insists on this to avoid granting first-person authority. Case: if a subject reports a near-death experience, the method shouldn't assume it happened, only that the subject had that experience (or that they are reporting it).
     - *Non-negotiable*: This is a core commitment of heterophenomenology, but it might not be required for the adjudicative job. In fact, the user suspects it conflicts with detecting unreportable experiences. We might mark this as a camp preference.

  8. **Detecting Unreportable Experiences**: The method should be sensitive to experiences that the subject cannot report, either because they lack the concept, attention, or verbal ability.
     - *Motivation*: Cases: blindsight (discrimination without report), no-report paradigms (neural signatures without report), or experiences that are not conceptualized (e.g., a novel sensation). This is critical for the "inaccessibility" point.
     - *Non-negotiable*: Yes, because if an experience is unreportable, we still want to know it exists. But note: this might conflict with neutrality.

  9. **Comparability Across Subjects**: The method should allow for comparing experiences across different subjects, at least in some respects.
     - *Motivation*: We need to know if two subjects both have an experience of kind K, or if they differ. Cases: do two subjects mean the same by "imagine"? Also, for generalization in science.
     - *Non-negotiable*: Not strictly, because the method might work on a per-subject basis without comparison. But without comparability, the science of consciousness is limited. This is a scientific desideratum, but not necessarily for the core job of adjudicating individual claims.

  10. **Avoiding Presupposition of Shared Structure**: The method should not assume that experiences have a shared structure across subjects (e.g., that visual imagery is picture-like for everyone).
      - *Motivation*: Inverted spectrum and other cases of private experiences. Also, the revision case: one subject might have non-picture-like imagery. If we assume all imagery is picture-like, we might misclassify.
      - *Non-negotiable*: This is important for avoiding false negatives (e.g., declaring no imagery when it's just different). But note: comparability might require some shared structure. This is a tension.

  Now, let's analyze tensions:

  - **Tension 1: Neutrality (7) vs. Detecting Unreportable Experiences (8)**
    - If we must stay neutral about whether an experience exists (only taking reports as texts), then we cannot detect unreportable experiences because we have no access to them beyond the report. Conversely, if we can detect unreportable experiences (e.g., via neural markers), we are going beyond the text and making a claim about the existence of an experience that the subject might not endorse. Thus, these two are jointly unsatisfiable. 
    - *Verdict*: For the adjudicative job, (8) is non-negotiable because we need to handle cases like blindsight. Therefore, (7) must be dropped or relaxed. Neutrality is a camp preference (heterophenomenology) that might be incompatible with the job.

  - **Tension 2: Comparability (9) vs. Avoiding Presupposition of Shared Structure (10)**
    - To compare across subjects, we need a common framework (e.g., a set of dimensions or categories). But if we avoid presupposing shared structure, we cannot impose such a framework. This is a trade-off: we can either have comparability by assuming some shared structure (risking false assumptions) or avoid assumptions but lose comparability. 
    - *Verdict*: For adjudicating individual claims, comparability is not strictly necessary (desideratum 4 is about individuals). But for the science, it is important. The tension can be managed by building the framework from the subject's own reports (e.g., using subject-specific categories) and then looking for mappings, but this is not straightforward. Both are desirable but not jointly fully satisfiable. We might have to accept limited comparability.

  Which requirement does the most work in ruling out methods?
  - **Detecting Unreportable Experiences (8)** is a strong candidate because it requires the method to go beyond verbal reports. This immediately rules out pure heterophenomenology (which only uses the text of reports) and also challenges methods that rely solely on trained reports (because training might not make everything reportable). It forces the method to integrate behavioral or neural measures.

  Short Scorecard:

  Approach | Adjudicative Power (1) | Report-Behavior Dissoc. (2) | Absence vs. Inaccess. (3) | Individual-Level (4) | Revision Handling (5) | Interviewer Control (6) | Neutrality (7) | Detect Unreportable (8) | Comparability (9) | Avoid Presuppose (10)
  ---|---|---|---|---|---|---|---|---|---|---
  **Heterophenomenology** | Partial: only via report. Fails for unreportable. | Poor: treats report as primary, behavior as separate. | Fails: cannot detect unreportable. | Yes: works per subject. | Poor: treats each report as fixed. | Moderate: neutral stance might reduce bias, but interviewer still influences. | Strong: core commitment. | No: only reports. | Moderate: can compare texts, but no independent check. | Strong: no presupposition of shared structure.
  **Neurophenomenology/Microphenomenology** | Moderate: training might improve access, but still report-based. | Moderate: training might align report and experience, but dissociations might be seen as noise. | Moderate: training might help report, but still might miss unreportable. | Yes: individual training. | Strong: revisions are part of the process. | Weak: training by interviewer might introduce bias. | Weak: assumes reports can accurately reflect experience. | Weak: relies on report, so unreportable might be missed. | Moderate: trained reports might be more comparable, but still subject-specific. | Moderate: avoids some presuppositions by attending to subject's account, but training might impose a framework.
  **No-Report Paradigms** (neuroscience) | Strong: uses neural markers to infer consciousness without report. | Strong: behavior (if used) and neural data can be integrated. | Moderate: can detect experience without report, but might not distinguish absence from inaccessibility. | Yes: neural data per subject. | N/A: typically uses single time points. | N/A: no interviewer, but experimental context matters. | Moderate: neural data is neutral about the content? | Strong: designed for this. | Weak: neural markers might not capture content for comparison. | Weak: often assumes neural signatures are shared.

  Notes on the scorecard:
  - Heterophenomenology fails on (3) and (8) because it cannot go beyond the text.
  - Neurophenomenology might do better on (5) but is weak on (6) and (8).
  - No-report paradigms are strong on (8) but weak on content and comparability.

  Summary of Non-Negotiables (for the job):
  1. Adjudicative Power (1)
  2. Resolution of Report-Behavior Dissociations (2)
  3. Distinguishing Absence from Inaccessibility (3)
  4. Individual-Level Application (4)
  5. Handling Revision and Refinement (5) - to a degree
  6. Interviewer Effect Control (6) - to a degree
  7. Detecting Unreportable Experiences (8)

  Camp preferences:
  - Heterophenomenology: Neutrality (7) is a core commitment, but it conflicts with (8).
  - Neurophenomenology: Training subjects to improve reporting is a preference, but it doesn't necessarily achieve (8) and might introduce biases.

  Thus, the method must integrate first-person reports with third-person data (behavioral, neural) to satisfy the non-negotiables, especially (8). It must also have a dynamic model of reporting that accounts for revisions and controls for interviewer effects.

  Finally, the most ruling-out requirement: **Detecting Unreportable Experiences (8)**. It forces the method to have non-report-based access to experience, which rules out any method that relies solely on verbal reports (like pure heterophenomenology) and challenges methods that rely on training (since training might not make everything reportable). It also rules out methods that treat reports as the ultimate data.

  This suggests that an integrated approach, using both first-person and third-person methods, is necessary.
answer: |-
  ### Desiderata for a Method of Collecting and Using First-Person Data in Consciousness Science

  Below is a structured desiderata list for a method capable of adjudicating claims of the form "subject S has an experience of kind K" / "lacks one" / "has one that differs from S' in respect R". I derive these from your core cases (e.g., aphantasia, no-report paradigms, blindsight, concept ambiguity) and the tensions you identified. Each desideratum includes:  
  - **The requirement**: What the method must achieve.  
  - **Motivating case/consideration**: Why this is necessary, grounded in concrete problems.  
  - **Non-negotiable?**: Whether it's essential for the adjudicative job (failure here means the method cannot fulfill its core function) or a camp preference (often reflecting epistemic or metaphysical biases).  

  I distinguish **non-negotiable** requirements (NN) from **camp preferences** (CP). NN items are necessary for any method claiming to settle the target claims; CP items reflect commitments like your supervisor's neutrality or your labmate's skill-based reporting. I also note tensions, including your hunches about incompatibilities.  

  #### Desiderata List  
  1. **Adjudicative specificity for target claims**  
     - **Requirement**: The method must output a clear, falsifiable verdict (e.g., "has K," "lacks K," "differs in R") for an *individual subject* in specific cases (e.g., aphantasia, blindsight).  
     - **Motivation**: Core to your job. Without this, the method is irrelevant. Cases like blindsight or aphantasia require subject-level resolution—group averages (e.g., "most people with this neural signature have imagery") don't settle if *S* specifically has an experience.  
     - **Non-negotiable?**: **NN** (failure here means the method is useless for your purpose).  

  2. **Resolution of report-behavior dissociations**  
     - **Requirement**: The method must provide a principled account of divergences between verbal report and forced-choice behavior (e.g., S reports vivid imagery but discriminates at chance, or S denies experience but discriminates above chance). It must specify whether the dissociation is noise (to be averaged out), a reporting artifact (e.g., attention lapse), or a genuine datum (e.g., partial awareness).  
     - **Motivation**: Central to cases like blindsight (good discrimination without report) or no-report paradigms (neural/behavioral evidence without report). Treating dissociations *only* as noise ignores critical data (e.g., blindsight reveals graded access).  
     - **Non-negotiable?**: **NN** (ignoring this leaves key cases like blindsight unadjudicated).  

  3. **Distinction between absence and inaccessibility**  
     - **Requirement**: The method must differentiate "no experience of K" from "experience of K exists but is unreportable" (due to conceptual, attentional, or access limitations).  
     - **Motivation**: Cases like aphantasia discovery (subjects initially report no imagery but later refine this after learning the concept) or inverted-spectrum worries (identical reports could mask unreportable differences). Without this, you conflate metaphysics (what exists) with epistemology (what can be reported).  
     - **Non-negotiable?**: **NN** (essential for adjudicating claims like "S lacks imagery"—failure risks misattributing inaccessibility to absence).  

  4. **Individual-level fallibility**  
     - **Requirement**: The method must be able to return "indeterminate" or "failure" for a *single subject* when adjudication is impossible (e.g., due to inconsistent data, ambiguous reports, or confounding factors), not just at the group level.  
     - **Motivation**: Required for ethical and scientific rigor. E.g., in aphantasia, if S's reports vacillate wildly across sessions, the method shouldn't force a verdict by aggregating with others. Group-level fallibility hides individual uncertainty.  
     - **Non-negotiable?**: **NN** (without this, the method overclaims or ignores subject-specific noise).  

  5. **Revision tolerance**  
     - **Requirement**: The method must handle report revisions (e.g., S initially says "no imagery" but later says "I have something non-pictorial") by:  
       - (a) Treating a report series as a *dynamic process* (not isolated snapshots).  
       - (b) Providing criteria for when revisions reflect improved access vs. confounds (e.g., suggestion).  
       - (c) Allowing earlier reports to be superseded without discarding them as "invalid."  
     - **Motivation**: The revision problem you raised—e.g., aphantasia subjects often refine reports after reflection. Ignoring revisions treats introspection as static, missing how conceptualization evolves.  
     - **Non-negotiable?**: **NN** (without this, the method is brittle and ignores real-world data dynamics).  

  6. **Interviewer-effect transparency**  
     - **Requirement**: The method must quantify, control, or account for the interviewer's role (e.g., probes, vocabulary, framing, own biases) in shaping reports. This includes:  
       - (a) Measuring how much variance in reports is attributable to the interviewer.  
       - (b) Distinguishing subject-driven content from interviewer-driven artifacts.  
     - **Motivation**: Cases like concept ambiguity ("imagine") or framing effects (e.g., an interviewer's vivid imagery metaphors may inflate reports). Uncontrolled, the method confuses the subject's experience with the interviewer's influence.  
     - **Non-negotiable?**: **Partially NN**—minimal control is NN (e.g., documenting probes), but *full* elimination is **CP** (your labmate's "train until rich" assumes effects can be neutralized; your supervisor's neutrality ignores them).  

  7. **Detection of unreportable experiences**  
     - **Requirement**: The method must be sensitive to experiences that S cannot report (e.g., due to no concept, inattention, or neuropsychological deficit).  
     - **Motivation**: Cases like blindsight (discrimination without awareness) or no-report paradigms (potential "unreportable" consciousness). A method relying solely on reports misses these.  
     - **Non-negotiable?**: **NN** (core to adjudicating claims like "does S see anything in blindsight?").  

  8. **Conceptual neutrality**  
     - **Requirement**: The method must not presuppose the structure of S's experience (e.g., that "imagery" is picture-like) or assume shared concepts across subjects (e.g., that "imagine" means the same for all).  
     - **Motivation**: Inverted-spectrum cases and aphantasia revisions (e.g., S may have "non-pictorial" imagery). Presupposing structure biases adjudication (e.g., misclassifying non-pictorial imagery as absence).  
     - **Non-negotiable?**: **NN** (presupposing structure invalidates claims about differences "in respect R").  

  #### Camp Preferences (Dressed as Requirements)  
  These are often presented as requirements but reflect epistemic/methodological biases:  
  - **"Don't trust the report" (Heterophenomenology camp)**:  
    - Posed as: Reports are mere texts; never grant first-person authority.  
    - **Actual status**: **CP**—Useful for avoiding naive realism, but *not* NN. Neutrality (your desideratum) conflicts with detecting unreportable experiences (NN #7). Trust/distrust is a stance, not a method requirement.  
  - **"Train the subject until reports get rich" (Neurophenomenology camp)**:  
    - Posed as: Reporting is a skill; training reduces noise.  
    - **Actual status**: **CP**—May improve access, but assumes unreportable experiences (#7) don't exist or can always be made reportable. Ignores cases where training *induces* artifacts (e.g., suggestion).  
  - **"Reports are the gold standard" (Common in introspective methods)**:  
    - Implied in some camps, but not yours.  
    - **Actual status**: **CP**—Contradicts NN #7 (unreportable experiences) and #2 (report-behavior dissociations).  

  #### Tensions and Incompatibilities  
  - **"Neutrality about existence" vs. "Detect unreportable experiences" (Your hunch)**:  
    - **Verdict**: **Jointly unsatisfiable**. Neutrality (e.g., heterophenomenology) treats reports as the only data, making unreportable experiences undetectable by definition. Detecting unreportable experiences (e.g., via behavior/neural markers) requires committing to their existence, violating neutrality. *For adjudication, #7 (detection) is NN, so neutrality must be relaxed*.  
  - **"Comparability across subjects" vs. "Avoid presupposing shared structure"**:  
    - **Verdict**: **Tension, not strict incompatibility**. Comparability requires a common metric (e.g., neural correlates, behavior), but this risks imposing shared structure (e.g., assuming all "imagery" has a neurosignature). This can be mitigated by deriving structure from individual baselines (e.g., S-specific neural patterns), but full comparability may require some minimal shared assumptions (e.g., "discrimination implies some experience"). *For your job, #8 (avoid presupposing) is NN, so comparability may be limited*.  
  - **Other tension**: **Revision tolerance (#5) vs. Interviewer-effect control (#6)**. Heavy interviewer control (e.g., standardized probes) may limit natural revisions, while allowing open-ended revisions amplifies interviewer effects. Not strictly incompatible, but hard to balance.  

  #### The Most Damaging Requirement  
  - **Detection of unreportable experiences (#7)** does the most work in ruling out methods:  
    - It **quietly kills heterophenomenology** (which cannot detect unreportable experiences due to its textual neutrality) and **challenges neurophenomenology** (which assumes training makes everything reportable).  
    - It forces integration with third-person data (e.g., behavior, neural markers), excluding pure report-based methods.  

  ### Scorecard for Major Approaches  
  *How well each approach satisfies the NN desiderata (✔ = good, ✘ = poor, ~ = partial)*:  

  | Desideratum                          | Heterophenomenology | Neurophenomenology/Microphenomenology | No-Report Paradigms (Neuroscience) |  
  |--------------------------------------|---------------------|---------------------------------------|-----------------------------------|  
  | 1. Adjudicative specificity          | ~ (Text-based; individual but report-bound) | ~ (Training may improve; but still report-focused) | ✔ (Uses neural/behavioral markers per subject) |  
  | 2. Report-behavior dissociations     | ✘ (Treats reports as primary; behavior is separate) | ~ (Training aims to align report/experience; dissociations may be ignored) | ✔ (Integrates behavior/neural data directly) |  
  | 3. Absence vs. inaccessibility       | ✘ (Cannot detect unreportable) | ~ (Training may reduce inaccessibility; but assumes no unreportable) | ~ (Can detect unreportable but may struggle with content) |  
  | 4. Individual-level fallibility      | ✔ (Works per subject) | ✔ (Individual training) | ✔ (Individual neural/behavioral data) |  
  | 5. Revision tolerance                | ✘ (Reports as fixed texts) | ✔ (Revisions part of training process) | ✘ (Typically single time-points) |  
  | 6. Interviewer-effect transparency   | ~ (Documents probes but ignores influence) | ✘ (Training amplifies interviewer effects) | ✔ (Minimal interviewer role) |  
  | 7. Detect unreportable experiences   | ✘ (Text-bound) | ✘ (Assumes all is reportable) | ✔ (Designed for this) |  
  | 8. Conceptual neutrality             | ✔ (No presuppositions) | ✘ (Training may impose structure) | ~ (May assume neural signatures map uniformly) |  

  **Summary**:  
  - **Heterophenomenology** fails on #2, #3, #5, #7—too report-centric.  
  - **Neurophenomenology** better on #5 but fails #3, #6, #7—over-relies on idealized reporting.  
  - **No-report paradigms** excel at #7 but struggle with #3 (content), #5, and #8.  

  **Conclusion for your framework**: The desiderata reveal that no existing method fully satisfies all NN requirements. The biggest gap is integrating first-person reports (with revision tolerance) and third-person data (for unreportable experiences) while avoiding conceptual presuppositions. Your chapter should argue that a hybrid approach is necessary, using reports *dynamically* (to handle revisions) alongside behavioral/neural markers (to detect unreportable states), with strict controls for interviewer effects. The tensions (e.g., neutrality vs. detection) force trade-offs: for your job, detecting unreportable experiences (#7) and distinguishing absence from inaccessibility (#3) are paramount, so neutrality must be sacrificed.
