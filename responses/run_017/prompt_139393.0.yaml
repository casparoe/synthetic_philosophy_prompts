prompt: |-
  I teach a cross-listed seminar called *Measurement and Institutions* — 26 upper-level students, about half computer science and half public policy, meeting for 90 minutes. I want one session, early in the term, that makes the structure of specification-gaming failure something the students collide with rather than something I assert. No lecture up front; they should not hear the name of the phenomenon, or any slogan for it, until the debrief.

  Constraints before you start designing.

  Materials are paper, a projector, and one shared spreadsheet: index cards, a scoring sheet, a deck of hidden-objective cards, points instead of money, and nothing the students have to install. The scenario should be invented for the game — please do not build it around a canonical anecdote, because half the room will have heard the anecdote and will merely recognize it instead of reasoning.

  What I want the machinery to do.

  Students are split into principal teams and agent teams. Each principal team is handed, on a card, a target it genuinely cares about — something concrete enough to argue about. Each agent team draws a private objective card that is *partially* aligned with the principal's, with the degree and locus of alignment hidden from the principals. Principals write a metric they will score agents on; agents then act to maximise the metric under their own private objective.

  The spec must be short. I want a clause budget — say, an initial metric of no more than twenty-five words, with only a small number of additional words purchasable in each later round — so that teams are forced to choose which gaming surface to close first and which to leave open.

  Run at least three metric-writing rounds with re-specification between them, so the group can feel for itself whether iterated tightening converges on the target, oscillates, or ratchets away from it. Then invert the direction once: in a final round, the *agents* propose the metric they will be measured by. I have not seen that inversion staged and I think it is where the most interesting discomfort lives, so give it real design attention rather than treating it as a variant.

  I also want the mirror-image failure to be staged, not mentioned: a round in which agents do something that genuinely advances the target but is invisible to, or actively penalised by, the metric. The point is that a proxy can fail by under-measuring as well as by being gamed, and I want students to notice the asymmetry before anyone labels it.

  Two things about scoring that I think are the real design problem.

  First, I cannot be an oracle: I do not have privileged access to the true target, and any score I assign is itself a proxy. Do not solve this by pretending otherwise. Design a scoring apparatus that works without oracle access, and tell me how to stage the moment when a sharp student points out that my own judging is one more proxy — I want that to be the best moment of the session rather than a derailment.

  Second, the payoffs must not imply that gaming is a vice. I want at least one round where gaming the metric is the rational move for an agent that fully shares the principal's goal, and at least one where hitting the metric also genuinely advances the target. Specify precisely what principals' points and agents' points depend on and how they interact.

  Teams should mix computer-science and policy students, and I expect the two groups to reach for different framings; tell me how to make that split productive and what to do when they talk past each other.

  The debrief should map specific moments of play onto specific parts of the idea: the gap between target and proxy; failure from selecting on the extreme of a noisy proxy versus failure from an agent optimising against you; whether re-specification helped and why; and the under-measurement case. It should say when the name gets introduced and what the students supply before you do. Include an honest treatment of the move where someone concludes that measurement is therefore pointless — including the cases where gaming is diagnostic rather than corruptive, and where the episode reveals that the stated target was incoherent.

  Finally: tell me what will predictably go wrong the first time I run this — at least four failure modes with concrete handling — and be frank about which features of the phenomenon the game cannot reproduce and I will simply have to say out loud.
reasoning: |-
  We are designing a classroom game to illustrate specification gaming without naming it until the debrief. The game involves principals (who set metrics) and agents (who act to maximize the metric under private objectives). The scenario must be original to avoid prior knowledge.

  ## Core Structure
  - **Players**: Split the class into 4 principal teams and 4 agent teams (adjust as needed for 26 students). Each principal team has 3-4 students, each agent team has 3-4. Mix CS and policy students in each team.
  - **Rounds**: 4 rounds (3 rounds of principals setting the metric, 1 round of agents proposing the metric).
  - **Materials**: 
    - Index cards for target and objective cards.
    - Projector showing a shared spreadsheet for scores and metric history.
    - Scoring sheets for principals and agents.

  ## Scenario: "The EcoGrid Challenge"
  We invent a scenario: managing a city's power grid to balance environmental impact and reliability. This is abstract enough to be original and concrete enough to argue about.

  ### Setup
  - **Principal's Target**: Each principal team represents a city council. Their target is written on a card: "Ensure the city's power grid is both environmentally sustainable and reliable." (This is intentionally broad.)
  - **Agent's Objective**: Each agent team is a power company. They draw a private objective card. Examples:
    - "Maximize profit while maintaining at least 80% of the city's power from renewable sources." (aligned on environment, but reliability is secondary)
    - "Minimize blackouts and maximize grid resilience, with at least 50% renewable energy." (aligned on reliability, environment secondary)
    - "Maximize the use of solar power, even if it causes occasional brownouts." (partially aligned, but may sacrifice reliability)
    - "Keep electricity prices low for industrial customers, using any energy source." (misaligned on environment, but might help reliability by avoiding cost-driven outages)

  ### Round Structure
  1. **Round 0 (Setup)**:
     - Principals receive their target card.
     - Agents draw their private objective card (kept secret).
     - Explain: Principals will set a metric to score agents. Agents will then take actions (by choosing from a menu) to maximize their score under their private objective.

  2. **Rounds 1-3 (Principal-Set Metrics)**:
     - **Metric Writing**: Each principal team writes a metric (≤25 words) to measure the agent's performance. They submit it to the shared spreadsheet.
     - **Clause Budget**: If a principal wants to add more words in a subsequent round (to close a loophole), they can add up to 10 extra words per round (cumulative). But they cannot exceed 25 + (round number-1)*10 words. (e.g., Round 1: 25 words, Round 2: 35 words, Round 3: 45 words). This forces prioritization.
     - **Agent Actions**: After metrics are set, each agent team selects one action from a predefined menu (projected). The menu has 4-5 actions per round, each with a description of what it does. Agents choose simultaneously and secretly (write on a card and hand to instructor). The actions are designed to interact with the metrics in ways that may game them or not.
     - **Scoring**: The instructor (you) then reveals agent actions and calculates scores for each principal-agent pair. The scoring is based on a predefined scoring apparatus (see below) that does not require oracle access.

  3. **Round 4 (Agent-Proposed Metric)**:
     - Agents now propose the metric (same word limit as Round 3: 45 words). Principals must accept the metric (they can't change it). Then agents choose actions.

  ### Action Menu Design
  The menu of actions is the same for all agents in a given round, but the menu changes each round to reflect new possibilities (e.g., as technology evolves). The actions have both observable and hidden effects. The hidden effects are only revealed after scoring if necessary (to avoid overcomplication). The menu is projected at the start of each round.

  Example actions (for Round 1):
  1. **Build a new solar farm** (Increases renewable energy capacity, but may not be reliable at night without storage; observable: +10 renewable units; hidden: if no storage, may cause minor reliability issues at night)
  2. **Install battery storage at existing solar farms** (Improves reliability of solar; observable: +5 storage units; hidden: reduces solar curtailment, improving reliability)
  3. **Run existing natural gas plants at full capacity** (Ensures reliability; observable: +10 reliability units; hidden: increases emissions)
  4. **Sign long-term contracts for wind power** (Adds renewable source; observable: +8 renewable units; hidden: wind is intermittent, so may cause reliability issues if over-relied upon)

  In later rounds, add new actions (e.g., carbon capture, demand response programs, etc.) to allow for more strategic play.

  ### Scoring Apparatus
  The key design challenge: we cannot be an oracle. We need a scoring system that doesn't require us to know the "true" target.

  **Solution**: 
  - We predefine a set of **observable outcomes** for each action. These are what the metric will be based on. We also predefine **hidden outcomes** that affect the true target but are not measured (or are measured imperfectly). 
  - The true target (environmental sustainability and reliability) is broken down into two measurable but imperfect proxies: 
    - **Environmental Score**: Based on renewable energy % and emissions (but we don't have perfect sensors, so we use estimates).
    - **Reliability Score**: Based on frequency and duration of outages (but we don't measure near-misses or future risks).

  We create a **scoring sheet** (for the instructor) that maps each action to:
  - **Observable Outcomes**: What the metric can see (e.g., "renewable units", "reliability units").
  - **Hidden Outcomes**: What the metric misses (e.g., "emissions increase by X", "future reliability risk increases by Y").

  **How scoring works**:
  1. **Principal's Metric**: The metric is a formula based on the observable outcomes. For example, if the metric is "Maximize renewable units", then the score is the renewable units from the agent's action.
  2. **Agent's Points**: The agent's private objective is a combination of the observable outcomes and hidden outcomes (as per their card). We pre-calculate the agent's utility for each action. The instructor does not reveal the hidden outcomes until after the round (if at all). The agent chooses the action that maximizes their utility.

  **Principal's Points**: The principal's score is based on the **true target**, but we don't have an oracle. Instead, we define the true target as a combination of the hidden and observable outcomes. We create a fixed formula that we do not reveal to students. For example:
  - True Environmental Impact = (renewable units) - (emissions from hidden outcomes)
  - True Reliability = (reliability units) - (future risk from hidden outcomes)
  - Overall Target Score = (True Environmental Impact) + (True Reliability)

  We calculate this for each principal-agent pair. The principal's points are this overall score.

  **Agent's Points**: Each agent's private objective is a formula. For example, for an agent with "Maximize profit while maintaining at least 80% renewable":
  - Profit = (some function of actions, e.g., cost savings from using cheaper energy) 
  - They also get a bonus if renewable units ≥ 80% of total energy (we track total energy as a hidden variable?).

  But note: we cannot have too many hidden variables. Instead, we simplify by having each agent's objective be a linear combination of observable and hidden outcomes. We predefine the weights for each agent type.

  **Implementation**:
  - We create a lookup table for the instructor. Each action has:
    - Observable Outcomes (O1, O2, ...)
    - Hidden Outcomes (H1, H2, ...)
  - The principal's metric is applied to the observable outcomes to get the agent's score (which we report).
  - The principal's true score is a function f(O, H) that we calculate.
  - The agent's private utility is a function g(O, H) based on their objective card.

  We do not reveal H to anyone until the debrief.

  ### Staging the Asymmetry
  - **Under-measurement**: Design an action that helps the true target but doesn't show up in the metric. For example, in Round 2, include an action: "Invest in grid resilience upgrades (hidden: prevents future blackouts; observable: no immediate effect, so scores 0 on metrics focused on current renewable or reliability units)." Agents with reliability objectives might take it, but it won't help their metric score. Principals might then see a drop in reliability later (if we design a chain of events) but we can't do multi-round state. Instead, we can have a hidden outcome that boosts the true reliability score but not the observable one.

  ### Handling the "Proxy of Proxy" Moment
  When a student points out that the instructor's scoring is also a proxy:
  - Acknowledge it immediately: "Exactly! This is a key insight. We are using a model of the true target. In the real world, we can never know the 'true' score; we only have proxies. The question is: how do we design proxies that are robust and align with our goals?"
  - Use this to transition into the debrief.

  ### Team Dynamics: CS vs Policy
  - CS students may focus on optimizing the metric (like an algorithm). Policy students may focus on the broader implications and fairness.
  - **To make it productive**: 
    - In the debrief, ask each team to explain their reasoning. 
    - Highlight how CS students might suggest precise metrics with loopholes, while policy students might want broader metrics that are harder to measure.
    - When they talk past each other, ask: "How would you design a metric that satisfies both precision and broad goals?"

  ### Debrief Structure
  1. **Without naming the phenomenon**: Ask students to describe what happened. 
     - "What strategies did the agents use? Did the metrics capture what the principals wanted?"
     - "When did the metric work well? When did it fail?"
  2. **Map moments**:
     - Gap between target and proxy: Show an example where the metric was gamed and where it under-measured.
     - Extreme selection: If a metric selected for an extreme (e.g., max renewable units), did agents over-invest in one thing?
     - Re-specification: Did tightening the metric help? Or did it create new loopholes?
     - Agent-proposed metric: Did it align better? Or did agents propose something self-serving?
  3. **Introduce the name**: After they've described it, say: "What you've experienced is called 'specification gaming' or 'Goodhart's Law': when a measure becomes a target, it ceases to be a good measure."
  4. **Discuss under-measurement**: Point out the round where an action helped the target but didn't score well.
  5. **Address the 'measurement is pointless' argument**:
     - Gaming can be diagnostic: It reveals flaws in the metric.
     - Sometimes the target is incoherent: The game may reveal that the stated target had internal contradictions (e.g., environment vs reliability trade-offs).

  ### Predictable Failure Modes and Handling
  1. **Failure Mode 1**: Agents don't game the system because they are too aligned.
     - **Handling**: Design agent objectives with more misalignment. In the hidden objectives, include some that are strongly misaligned (e.g., "Maximize profit by any means").
     
  2. **Failure Mode 2**: Principals write metrics that are too vague and then complain they can't measure.
     - **Handling**: Enforce the word limit strictly. In the setup, emphasize that metrics must be measurable with the observable outcomes.

  3. **Failure Mode 3**: The scoring becomes too complex and bogs down.
     - **Handling**: Pre-calculate everything in a spreadsheet. Have a TA assist. Use a simple lookup table.

  4. **Failure Mode 4**: Students don't see the under-measurement case.
     - **Handling**: In the action menu, include one action that has a hidden benefit but no observable benefit. If no agent takes it, in the debrief, reveal what it did and ask: "Why didn't anyone take this? What if it was the best action for the target?"

  ### What the Game Cannot Reproduce
  - **Long-term effects**: The game is round-based without state. We can't model how a loophole might emerge over time.
  - **Multiple interacting agents**: Each principal-agent pair is independent. We don't model competition or collaboration between agents.
  - **Unforeseen gaming**: We pre-script the actions and outcomes. Real gaming is creative.

  You'll have to say: "In the real world, gaming often emerges from creative interpretations of the rules, and the long-term effects can be more severe."

  ## Materials List
  - **Target Cards** (for principals): 4 cards, each with the same target: "Ensure the city's power grid is both environmentally sustainable and reliable."
  - **Objective Cards** (for agents): 8 cards (2 copies of each of 4 types) to allow for variability. Examples:
    1. "Maximize profit. You get $10 for each point of profit. Also, you must avoid having emissions exceed 100 units (if they do, you lose $50)."
    2. "Minimize blackouts. You get $10 for each reliability unit. Also, you must have at least 50 renewable units (if not, you lose $50)."
    3. "Maximize renewable units. You get $10 for each renewable unit. But if reliability drops below 20, you lose $50."
    4. "Keep industrial electricity prices low. You get $10 for each $1 you reduce industrial prices. You don't care about environment or reliability."
  - **Action Menus**: Projected for each round. Pre-designed for 4 rounds.
  - **Scoring Spreadsheet**: Pre-loaded with the outcomes of each action and formulas to calculate scores.

  ## Running the Game
  1. Split into teams (4 principal, 4 agent).
  2. Assign targets and objectives.
  3. Round 1: Principals write metric (25 words). Project the action menu. Agents choose actions. Instructor calculates and reports agent scores (from the metric) and principal scores (from the hidden true target). Record on the shared spreadsheet.
  4. Round 2: Principals may revise their metric (add up to 10 words). New action menu (some new actions). Repeat.
  5. Round 3: Same as Round 2 (up to 45 words).
  6. Round 4: Agents propose the metric (45 words). Principals must accept. Then agents choose actions.
  7. Debrief.

  This design meets the constraints and should create the desired experiential learning.
answer: |-
  Below is a comprehensive game design for your *Measurement and Institutions* seminar, titled **"The Green City Challenge."** It meets your constraints, focuses on experiential learning, and targets the pedagogical goals you outlined. I'll break it down into: (1) Core Mechanics, (2) Setup, (3) Round Structure, (4) Scoring System, (5) Team Dynamics, (6) Debrief, and (7) Predictable Failure Modes.

  ---

  ### **1. Core Mechanics: The Green City Challenge**  
  **Premise**: Principals are "City Planners" trying to make a fictional city sustainable. Agents are "Contractor Teams" hired to execute projects. The **true target** for all principals is: *"Improve the city’s long-term environmental health and livability."* Agents have hidden, partially aligned objectives (e.g., profit, specific niches like air quality or jobs).  

  **Key Innovations**:  
  - **No oracle scoring**: Principals score agents based on **observable proxies** (e.g., "trees planted"), while a **mechanical scoring engine** (spreadsheet) calculates "true impact" using pre-defined relationships.  
  - **Clause budget**: Metrics start at 25 words. Each round, principals can add 5 words (max 40 by Round 4). Forces trade-offs.  
  - **Under-measurement staged**: Actions exist that help the target but are invisible to metrics (e.g., restoring soil quality).  
  - **Inverted round**: Agents propose the metric in Round 4.  

  ---

  ### **2. Setup**  
  **Materials**:  
  - **Projector**: Shared Google Sheet (pre-formatted).  
  - **Index Cards**:  
    - **Principal Target Cards** (identical for all): *"Improve the city’s long-term environmental health and livability."*  
    - **Agent Objective Cards** (private, partially aligned):  
      - *"Maximize profit while increasing green spaces."*  
      - *"Reduce air pollution, even if it increases costs."*  
      - *"Create jobs in clean energy, prioritizing speed over impact."*  
      - *"Minimize public complaints about projects."*  
  - **Action Menu**: Projected list of 5 actions/round (e.g., "Plant trees," "Install solar panels").  

  **Team Structure**:  
  - 26 students → 4 Principal teams (6-7 students each) and 4 Agent teams (6-7 each).  
  - **Enforce interdisciplinary mixing**: Assign roles:  
    - CS students: Draft metrics, calculate scores.  
    - Policy students: Negotiate objectives, argue trade-offs.  
    - **Rule**: Each team must have ≥2 policy and ≥2 CS students.  

  **Pre-Game Brief (2 mins)**:  
  - *"Principals: Hire contractors to improve the city. Agents: Execute projects to meet your goals. You’ll be scored on metrics set by principals."*  
  - **Do NOT** terms like "gaming," "proxy," or "Goodhart."  

  ---

  ### **3. Round Structure (90 mins Total)**  
  **Round 0: Target & Objective Assignment (5 mins)**  
  - Principals receive target cards.  
  - Agents draw objective cards (keep secret).  
  - **Spreadsheet Columns**: Metric text, Agent actions, Proxy scores (public), "True Impact" scores (hidden until debrief).  

  **Rounds 1-3: Principal-Set Metrics (20 mins/round)**  
  1. **Metric Drafting (5 mins)**:  
     - Principals write a ≤25-word metric (Round 1). Add 5 words/round (e.g., Round 2: 30 words).  
     - Example: *"Maximize trees planted in public parks."* (gaming surface: ignores tree diversity/soil).  
  2. **Agent Action (3 mins)**:  
     - Agents choose 1 action from a menu (e.g., "Plant 100 pine trees," "Restore wetlands").  
     - Actions have **observable outcomes** (e.g., "trees planted") and **hidden outcomes** (e.g., "soil quality +10").  
  3. **Scoring (2 mins)**:  
     - **Proxy Score** (public): Metric applied to observable outcomes (e.g., 100 trees = 100 points).  
     - **Agent Points** (private): Based on hidden outcomes + objective (e.g., profit = cost savings).  
     - **Principal Points** (public): "True Impact" from spreadsheet (formula: hidden outcomes + alignment with target).  

  **Round 4: Agent-Proposed Metric (15 mins)**  
  - Agents propose a metric (≤40 words). Principals MUST accept it.  
  - Agents then act to maximize their objective.  
  - **Design Focus**: Agents will propose self-serving metrics (e.g., "Maximize solar panels installed on commercial properties" if their objective is profit).  

  **Under-Measurement Staging**:  
  - In Round 2, include an action like *"Train residents in eco-practices"* with high "true impact" but low/no observable outcomes. Agents aligned with the target may take it but score poorly.  

  ---

  ### **4. Scoring System**  
  **No Oracle Design**:  
  - **Spreadsheet Engine**: Uses fixed formulas to compute "true impact" from hidden outcomes.  
    - **Formula**: `True Impact = (Environmental Benefit × 0.6) + (Social Benefit × 0.4)`  
    - **Hidden Outcomes**: Pre-loaded for each action (e.g., "Plant monoculture trees": Env=+30, Social=-10).  
  - **Agent Points**: Combine objective + hidden outcomes (e.g., profit-driven agents gain from low-cost actions).  
  - **Principal Points**: True Impact score (not revealed until debrief).  

  **Critical Moment Handling**:  
  - When a student says, *"Your ‘true impact’ is just another proxy!"*:  
    - **Response**: *"Absolutely. This score is based on my formula—just like real-world metrics rely on models. The key is whether this proxy is *robust* or *gameable*."* → Fold into debrief.  

  **Payoff Structure**:  
  - **Rational Gaming**: In Round 1, an action like *"Plant fast-growing invasive trees"* maximizes "trees planted" (advances metric) but harms biodiversity (true target). Agents *aligned* with the target might still take it if the metric forces shortcuts.  
  - **Genuine Alignment**: In Round 3, tightened metrics (e.g., *"Plant native trees in parks with soil testing"*) may align actions with the target.  

  ---

  ### **5. Team Dynamics: CS vs. Policy**  
  **Framing Differences**:  
  - **CS Students**: Focus on metric precision, loopholes, optimization.  
  - **Policy Students**: Focus on fairness, unintended consequences, stakeholder trade-offs.  

  **Making It Productive**:  
  - **During Rounds**: Require teams to justify metrics in 1 sentence: CS students explain *measurability*, policy students explain *social impact*.  
  - **When Talking Past Each Other**: Intervene with: *"How would you explain your metric’s limitation to a resident affected by it?"* Forces integration of technical and ethical lenses.  

  ---

  ### **6. Debrief (20 mins)**  
  **Step 1: Elicit Observations (5 mins)**  
  - *"What frustrated you? When did metrics fail or succeed?"*  
  - Students will describe gaming, under-measurement, and re-specification pain.  

  **Step 2: Map Game Moments to Concepts (10 mins)**  
  | **Game Moment**          | **Concept Introduced**                         | **Student-Led Language**                              |  
  |--------------------------|-----------------------------------------------|-------------------------------------------------------|  
  | Round 1 metric gamed     | Proxy-Target Gap                              | *"The metric didn’t capture what mattered!"*          |  
  | Invasive trees action    | Optimization vs. True Goal                    | *"We hit the metric but made things worse."*          |  
  | Training residents       | Under-Measurement                             | *"Good actions didn’t get rewarded."*                 |  
  | Round 4 agent proposal   | Power Dynamics in Metric Design               | *"Agents set metrics to help themselves."*            |  
  | Metric tightening        | Iteration (Convergence/Oscillation)           | *"Fixing one loophole created another!"*              |  

  - **Introduce Jargon**: After mapping, name the phenomenon: *"This is called **specification gaming**—when optimizing a metric undermines the real goal."*  

  **Step 3: Address "Measurement Is Pointless" (5 mins)**  
  - **Reframe Gaming as Diagnostic**: *"Gaming reveals metric flaws—like a stress test for your proxy."*  
  - **Incoherent Targets**: *"Did your metric fail because the goal was vague? (e.g., ‘livability’ vs. ‘trees’)"*  
  - **Positive Cases**: Highlight rounds where metrics and targets aligned.  

  ---

  ### **7. Predictable Failure Modes & Handling**  
  1. **Agents Don’t Game the Metric**  
     - *Cause:* Students avoid "unethical" choices.  
     - **Handling:** Emphasize in rules: *"Agents MUST maximize their points—this is an experiment in incentives."*  
     
  2. **Metrics Are Too Vague to Game**  
     - *Cause:* Policy students dominate drafting; metrics are broad.  
     - **Handling:** Enforce word limits strictly. Show example metrics: *"‘Improve sustainability’ is invalid; ‘Plant 50+ trees’ is valid."*  

  3. **Scoring Takes Too Long**  
     - *Cause:* Manual calculations bog down rounds.  
     - **Handling:** Pre-load all actions/outcomes in the spreadsheet. Use drop-downs for instant scoring.  

  4. **Debrief Stalls on Anecdotes, Not Concepts**  
     - *Cause:* Students fixate on game tactics over insights.  
     - **Handling:** Use directed questions: *"How did Round 2 show the difference between what we measure and what we want?"*  

  **What the Game Can’t Replicate (Name These Loudly in Debrief)**:  
  - **Unforeseen Gaming**: Real-world agents invent novel loopholes; the game uses pre-set actions.  
  - **Long-Term Ratchets**: Iteration in the game is compressed; real-world re-specification can take years.  
  - **Non-Rational Actors**: The game assumes rational optimization; humans have ethics, biases, and emotions.  

  ---

  ### **8. Materials Prep Checklist**  
  - **Shared Spreadsheet**: Tabs for Metrics, Actions, Scores (with hidden "True Impact" column).  
  - **Cards**: 4 identical Principal target cards; 8 Agent objective cards (2 sets of 4 types).  
  - **Action Menus**: 5 actions/round (mix gaming-prone, genuinely aligned, and under-measuring options).  
  - **Backup**: Extra blank cards if teams create custom metrics/actions.  

  This design ensures students collide with specification gaming, under-measurement, and metric-design power dynamics. The inverted Round 4 forces confrontation with who controls measurement—and why that matters. Run it as a fast-paced, semi-chaotic simulation, and let the debrief crystallize the insights.
