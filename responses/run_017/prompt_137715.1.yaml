prompt: |-
  My brother-in-law is a therapist and every time we argue about this he falls back on the same pair of pictures: guilt is like a debt, shame is like a stain. He uses them to argue that guilt is obviosly the better moral emotion — a debt is about what you actually did rather than about how you look to other people, it has a definite amount, it can be repaid or forgiven, and it does not need anyone watching — while a stain is about appearances, it hangs around, and nothing you do really settles it. He is also half leaning on that old mid-century anthropology contrast between guilt cultures and shame cultures, which I gather anthropolgoists mostly dropped but which is still all over the management literature I read.

  I write a fortnightly newsletter for people who run small organisations, and the piece I am stuck on is whether a team can deliberately build one of these rather than the other, so I need to know how much weight the two pictures can actually bear. Could you audit them for me? I want exactly five numbered points, one or two sentences each, no introduction and no summing-up at the end, in British English:

  1. the mapping in compressed form — what plays the creditor, the ledger, the repayment or forgiveness, the audience, the washing;
  2. the things each picture quietly imports that guilt and shame do not obviously have — I keep coming back to creditorless guilt, the sort you feel about someone who is dead or in survivor guilt, and to shame you would feel with no witness at all;
  3. the single disanalogy that does the most damage to the way he is using them, and why that one and not the others;
  4. whether the guilt-is-better claim survives once the disanalogies are on the table, or whether the analogy was carrying it the whole time;
  5. what either picture implies about whether a group can pick one — does the debt picture need institutions, someone with standing to discharge the debt, in a way the stain picture does not — and whether there is a better pair of analogies for what he is actually after.
reasoning: |-
  Okay, the user is writing a newsletter about whether teams can deliberately cultivate guilt or shame cultures. Their brother-in-law, a therapist, uses the debt vs. stain analogy to argue guilt is superior. The user wants me to audit this analogy with five specific points. 

  Hmm, the brother-in-law's analogy clearly draws from outdated anthropology (guilt vs shame cultures) that modern scholars criticize. His framework oversimplifies - guilt isn't always quantifiable like debt (point 1), and survivor guilt shows debts can lack creditors (point 2). The biggest flaw is how the analogy ignores that both emotions can be self-generated without audiences (point 3). 

  The user's deeper concern seems to be about practical application for teams. The debt analogy implies guilt requires institutional structures (courts, HR) to enforce repayment, while shame feels more organic but harder to control (point 5). Neither analogy fully captures how moral emotions actually function in groups. 

  For the newsletter, I should emphasize that teams can't simply "choose" one emotion - both emerge from power structures and social dynamics. Better analogies might be guilt as repairable damage vs shame as contagious infection, but even those have limits. The key is recognizing all moral emotions have social dimensions, whether audiences are present or imagined.
answer: |-
  Here are five points auditing the debt/stain analogy for guilt and shame, as requested:

  1.  Debt analogy maps: creditor (harmed party/rule), ledger (specific wrongful act), repayment/forgiveness (making amends/absolution), no necessary audience, washing not applicable. Stain analogy maps: audience (external observers), washing (purification rituals/effacement), no clear creditor, ledger, or quantifiable removal mechanism.
  2.  Debt imports quantifiability and clear resolution mechanisms; guilt often lacks this (e.g., survivor guilt has no creditor). Stain imports visibility and permanence; shame can be deeply internal, felt with no witness (e.g., secret shame).
  3.  The most damaging disanalogy is the necessity of an audience: the stain picture *requires* external observation to define shame, but core shame experiences are intrinsically self-conscious, needing no actual witness, contradicting the analogy's core premise.
  4.  The "guilt is better" claim is significantly weakened; its supposed advantages (resolvability, internality) stem more from the chosen analogy than inherent properties of guilt, ignoring complex, unresolved guilts and deeply internal shames.
  5.  The debt picture strongly implies institutional structures (creditor, ledger, authority to forgive/discharge) for effective operation, which teams may lack. The stain picture suggests less formality but uncontrollable social spread. Neither analogy cleanly supports deliberate team cultivation; better analogies for his aim (managing transgression) might be 'guilt as repairable damage' and 'shame as contagious infection'.
