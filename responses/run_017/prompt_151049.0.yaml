prompt: |-
  I write about science and ideas for a national newspaper, and our standards desk has asked me to run a forty-five-minute session for the newsroom before we decide whether to trial an automated fact-checking tool. The room will be about fourteen editors and reporters, none of whom has taken a probability course; two are reflexively hostile to anything with numbers in it; and our standards editor reads enough statistics to catch me if I hand-wave. I have a whiteboard and nothing else.

  The occasion is a vendor pitch. The tool queries the same underlying language model five times under five different prompt framings, treats the five answers as a panel of "jurors," and returns the majority verdict. The deck claims the arrangement is licensed by Condorcet's jury theorem and closes with a slide about the wisdom of crowds. I think the pitch is wrong in a way that is worth teaching rather than just asserting, and I would like a plan for how to teach it — not the explanation written out for me.

  What I need is the sequence and the reason for it: which idea has to be in place before the next one means anything, and why. My instinct is that per-juror competence above chance has to come before the asymptotic result, and that the independence condition has to be stated as independence conditional on the truth rather than as "they don't talk to each other" — but tell me where I have the order wrong.

  I also want one concrete case to carry the whole session, and I want you to say what such a case must have and what it must lack. My candidate is a photograph that arrives with a claim about where and when it was taken — a binary question with a fact of the matter. I take it the example needs genuine ground truth and genuinely separate private signals, and must not be the kind of editorial judgment (is this story worth the space, is this headline fair) where there is no correct answer for the theorem to track.

  Here are the misconceptions I expect, in rough order of how loudly they will be voiced: that the theorem shows more heads are always better, when below-chance competence inverts it; that 51% accuracy plus enough jurors gets you anywhere soon; that our five model calls are five jurors; and that this has something to do with Condorcet's paradox about cycling majorities, which a couple of people will have half-remembered. Tell me which of these I am missing, which one is actually the load-bearing error, and at exactly what point in the sequence each should be headed off — including the place where the vendor's slide should collapse.

  The idea I most want placed well is this: each juror's signal can be treated as part private and part drawn from a common source, and as the common share grows the effective number of independent jurors falls toward one no matter how many heads you count. I want the plan to say where that decomposition goes, what it does to the five-calls-from-one-model picture, and how to convey it without a formula on the board. It should also note, in passing, that when competence varies the sensible weight is roughly the log-odds of each juror's accuracy, so five equally weighted samples from one model are misweighted twice over — and that if the tool ever reports confidence scores rather than verdicts, majority voting is the wrong aggregator regardless.

  Give me one question to end on that tells me whether the idea landed rather than whether they enjoyed the session — something like handing them a variant case and asking what the theorem does and does not say about it.

  Finally, tell me what to refuse to explain at this level and say so out loud: I assume the asymptotic argument itself, and I suspect the base-rate arithmetic (a checker that is right 90% of the time on a stream where only a small share of items are false will still mostly cry wolf) deserves its own session and should be named and declined rather than squeezed in.
reasoning: |-
  We are preparing a 45-minute session for a newsroom to evaluate an automated fact-checking tool that uses a language model (LM) queried five times and takes a majority vote. The tool's pitch invokes Condorcet's jury theorem (CJT) and the wisdom of crowds. The goal is to teach why the application is flawed without using probability theory.

  Key misconceptions to address:
  1. That more jurors (or more heads) are always better (without considering competence).
  2. That 51% accuracy with enough jurors gets you high accuracy quickly.
  3. That the five model calls are five independent jurors.
  4. Confusion with Condorcet's paradox (about cyclic majorities).

  The core idea: Each juror's signal has a private part and a common part. As the common part grows, the effective independent jurors drop toward one.

  Plan Structure:

  1. **Set the Stage (5 minutes)**
     - Present the tool: It runs the same LM five times with different prompts and takes majority vote.
     - Vendor claims: This is licensed by Condorcet's jury theorem and the wisdom of crowds.
     - Our goal: To understand what the theorem says and when it applies.

  2. **Introduce the Concrete Case (5 minutes)**
     - Use a binary fact: A photo with a claim about where and when it was taken. There is a true answer (yes/no).
     - Why this case? Ground truth exists, and we can imagine getting independent signals (e.g., different experts with their own knowledge).

  3. **Explain Condorcet's Jury Theorem Simply (10 minutes)**
     - **Assumptions**: 
       - Each juror has the same competence: probability p > 0.5 of being correct.
       - Jurors are independent (conditional on the truth).
     - **Conclusion**: As the number of jurors (n) goes to infinity, the probability of the majority being correct goes to 1.
     - **Key points**:
       - p must be above 0.5 (if below, majority is more likely wrong; if exactly 0.5, it's a coin flip).
       - Independence: Each juror's decision does not depend on the others, given the truth. (Example: Each juror sees different evidence, but they don't influence each other.)
     - **Visualization**: Draw a graph with n on the x-axis and P(majority correct) on the y-axis. For p=0.51, the curve rises very slowly. For p=0.6, it rises faster. For p=0.9, it rises very fast. (No numbers, just shapes.)
     - **Head off misconceptions**:
       - If p<0.5, more jurors make it worse (show the curve going down?).
       - 51% is not magic: It takes a lot of jurors to get high accuracy (e.g., for p=0.51, you need hundreds to get above 90%).
       - This is not about Condorcet's paradox (which is about voting cycles when there are more than two choices) - we are only doing two choices (true/false).

  4. **The Flaw: Independence and the Common Source (15 minutes)**
     - **Problem**: The tool uses one LM five times. Even with different prompts, the LM has a common training set and architecture. So the errors are not independent.
     - **Analogy**: Imagine five weather forecasters. If they all use the same flawed model, they might all make the same mistake. They are not independent.
     - **Decomposition Idea** (without formula):
       - Each forecast (or LM call) has two parts:
          - A common part: shared by all (e.g., the LM's training data and architecture).
          - A private part: the randomness in the prompt or the model's stochasticity.
       - If the common part is strong (e.g., the LM has a systematic bias on a topic), then even if you run it many times, the common error might dominate. The effective number of independent jurors is much less than five. In the extreme, if the common part is everything, then five calls are just one juror.
     - **Why the tool's approach fails**:
       - The five calls are not independent conditional on the truth. They share a common source.
       - Therefore, CJT does not apply.

  5. **The Vendor's Slide and Wisdom of Crowds (5 minutes)**
     - Wisdom of crowds: When you have many independent people, the average can be very accurate (e.g., guessing the weight of an ox). But that requires independence and diversity.
     - In the tool: Five calls from one LM are not independent and not diverse. They are five copies of the same "mind". It's like asking one person five times with slightly different phrasing and calling it a crowd.

  6. **Other Issues in Passing (3 minutes)**
     - **Weighting**: If we had jurors of varying competence, the optimal is to weigh by log-odds (so more competent jurors count more). But the tool treats all five equally, even though they are from the same model and hence same (unknown) competence. Also, if the tool outputs confidence scores, majority vote is not the best way to aggregate (e.g., a very confident correct vote might be outweighed by two less confident incorrect ones? Actually, for binary decisions, confidence might be used to weight).

  7. **The Load-Bearing Error**: The lack of independence (point 4) is the most critical because it breaks the theorem's assumption. Even if the model is slightly better than random (p>0.5), without independence, the majority might not improve (or might even get worse) as you add more calls.

  8. **End with a Question (2 minutes)**
     - Present a variant: Suppose we have a fact-checking tool that uses five different language models (each independently developed by different companies). Each model has a known accuracy of 60%. They are run once and we take a majority vote. What does the jury theorem say about this? What if we later find out that all models were trained on the same dataset?
     - The answer we want: 
       - Initially, the theorem applies (independent jurors with p>0.5) so majority vote should be better than any single model and improve with more models. 
       - But if they share a common training set, then independence is broken and the theorem's conclusion may not hold.

  9. **Refuse to Explain**:
     - Asymptotic argument: We won't prove why the probability goes to 1 as n increases.
     - Base-rate issues: The fact that even a highly accurate tool can have low precision if the base rate of false claims is low (this is Bayes' theorem and deserves its own session).

  Sequence and Timing:

  - 0-5 min: Introduction and the tool's claim.
  - 5-10 min: Concrete case (photo example) and setting up the binary fact.
  - 10-20 min: Condorcet's jury theorem (assumptions, what it says, and what it doesn't say) and address misconceptions 1, 2, and 4 (half-remembered paradox).
  - 20-35 min: The independence flaw and decomposition (common vs. private signals) - address misconception 3 (five model calls are five jurors) and the load-bearing error.
  - 35-40 min: Wisdom of crowds and why the vendor's slide collapses here.
  - 40-43 min: Other issues (weighting and confidence scores) very briefly.
  - 43-45 min: The ending question and wrap-up.

  Concrete Case Requirements:
  - Must have: Genuine ground truth (binary: true/false), and the possibility of independent signals (so we can contrast with dependent ones).
  - Must lack: Ambiguity in the correct answer (so no editorial judgment).

  During the independence section, use the weather forecasters analogy to avoid formulas. For the decomposition, use the idea of a shared bias: "Imagine five people who all read the same inaccurate news report and then are asked individually. They might all be wrong for the same reason. That's the common part. The private part would be if each also had their own unique experience. But if the common part is the main driver, then five are no better than one."

  Final Question: The variant with five different models (then undercut by the common training set). Ask: "Would the theorem apply in the first scenario? What about the second?"

  Load-Bearing Error: Independence (or lack thereof) is the key.

  Additional Misconception: That the tool's five calls are independent because they are run separately. But independence is conditional on the truth. If the model has a systematic error on the fact, all five calls may be wrong together.

  What to Refuse: 
  - The asymptotic proof (we state the result without derivation). 
  - Base-rate issues (we mention that even if the tool were independent and accurate, the base rate matters for how often it flags true claims as false, but that's for another day).
answer: |-
  ### Session Plan: Demystifying the Automated Fact-Checker Pitch  
  **Goal:** Show why the tool’s use of Condorcet’s jury theorem (CJT) is flawed, focusing on **independence** and **competence above chance** as load-bearing conditions. Avoid probability formulas; use intuition, analogies, and a single concrete case. Total: 45 minutes.  

  ---

  #### **Sequence, Timing, and Reasoning**  
  **Why this order?** Start with the theorem’s intuition (easy), then reveal assumptions (harder), then dismantle the pitch (hardest). Competence must precede independence because competence is simpler and exposes the "more heads always better" fallacy. Independence comes next to gut the vendor’s claim. End by linking to the tool’s flaw.  

  1. **Introduce the Concrete Case (5 min)**  
     - **What to present:** A photo with a binary claim (e.g., "This photo shows the 1969 Moon landing"). Ground truth exists (yes/no), and we can imagine jurors with access to private signals (e.g., an expert recognizing the spacesuit model, another spotting anachronistic tech).  
     - **Why this works:**  
       - ✅ **Has:** Clear ground truth, separate signals (e.g., jurors see different clues).  
       - ✅ **Lacks:** Subjectivity (no editorial judgment), ambiguity.  
     - **Set up:** "We’re fact-checking this photo. Assume jurors have private evidence but don’t collude."  

  2. **Explain Condorcet’s Jury Theorem Simply (10 min)**  
     - **Key idea:** CJT says: If jurors are **independent** and each has **competence >50%**, majority vote gets more reliable with more jurors.  
     - **Sequence:**  
       1. **Competence above chance (p > 0.5):**  
          - Use a coin analogy: "A fair coin (p=0.5) gives no majority benefit. But if each juror is a ‘weighted coin’ leaning toward truth (p>0.5), more jurors help."  
          - **Head off misconception:** "Below 0.5? More jurors make it worse—majority amplifies bias, not truth. Vendor’s slide ignores this."  
          - **Visual:** Whiteboard a juror with p=0.51 → majority needs 100+ jurors for high confidence. Emphasize: "51% isn’t a magic bullet."  
       2. **Independence (conditional on truth):**  
          - Clarify: "Not ‘they don’t talk’—it means no shared errors beyond the truth. E.g., two jurors relying on the same false source fail independently."  
          - **Head off misconception:** "This isn’t about Condorcet’s paradox (cycling majorities)—that’s for ranked choices, not binary facts."  

  3. **The Tool’s Fatal Flaw: Non-Independent "Jurors" (15 min)**  
     - **Decompose the signal (no formulas):**  
       - "Each juror’s signal has two parts: **private** (unique evidence) and **common** (shared biases/sources). If the common part dominates, jurors become clones."  
       - **Analogy:** "Five weather forecasters using the same flawed model. They might all be wrong identically—effective jurors ≈ 1."  
     - **Apply to the tool:**  
       - "Five calls from one model? They share training data, architecture, biases. Errors correlate → no independence. Majority vote just amplifies the model’s preexisting bias."  
       - **Kill the vendor’s slide here:** "The ‘wisdom of crowds’ requires diverse, independent minds. This is one mind asked five times—no crowd."  
     - **Head off misconceptions:**  
       - "Five model calls aren’t five jurors—they’re five samples of one juror." (Most load-bearing error: breaks CJT).  
       - "Varying weights? If competences differ, optimal voting weights jurors by their log-odds accuracy. Five equal samples misweight twice: same competence, no independence."  

  4. **Brief Pitfalls & Nuances (5 min)**  
     - **Confidence scores:** "If the tool reports confidence, majority voting is wrong. Weight by confidence (e.g., a 99% confident ‘true’ outweighs two 51% ‘false’ votes)."  
     - **Base rates:** "Decline to explain: Even with independence, a tool that’s 90% accurate will cry wolf on mostly-true claims. That’s base-rate fallacy—another session."  

  5. **End with a Test Question (5 min)**  
     - **Pose:** "Suppose we use five *different* fact-checking models (different vendors), each with 60% accuracy. They’re independent. Does CJT apply? What if we discover they all trained on the same dataset?"  
     - **Why this works:** Tests if they grasp:  
       - ✅ First scenario: CJT applies (independent, p>0.5).  
       - ❌ Second scenario: Common data breaks independence → CJT fails.  

  ---

  #### **What to Refuse to Explain (State Explicitly)**  
  - **Asymptotic proof:** "We won’t derive why majority → 100% as jurors → ∞; just accept CJT as an observed truth."  
  - **Base-rate arithmetic:** "We won’t dive into why a 90%-accurate tool fails if most claims are true—that’s Bayes’ theorem, needing its own deep dive."  

  ---

  #### **Why This Sequence Works**  
  - **Flow:** Starts simple (case → theorem), then adds friction (competence → independence), then explodes the application (tool’s flaw).  
  - **Anchors to one case:** Photo example threads throughout.  
  - **Preempts misconceptions:** Each is debunked when the relevant concept is introduced (see timing above).  
  - **Load-bearing error:** Non-independence of model calls. Hammered in Step 3.  
  - **Final question:** Reveals if they see independence as conditional and decomposable (common vs. private).  

  **Stick to time:** If debate erupts, defer with: "That’s base-rate/asymptotic—we flagged it as out-of-scope." Focus on independence as the core failure.
