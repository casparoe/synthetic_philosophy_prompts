prompt: |-
  I do a lot of back-of-envelope estimating at work (freight and warehouse planning, mostly) and I'm in a small forecasting group where we score our own predictions afterwards, and I keep runnning into a pattern I don't have a word for. It's become the thing I most want vocabulary for, because I think it's why my multi-step estimates are badly calibrated while my one-step ones are fine.

  Here's the shape of it. Say I'm estimating how many warehouses in a mid-size country will be running some kind of automated picking within ten years. I split it into three links: the share of firms that will have heard about the tech seriously enough to evaluate it; the share of those that pilot it; the share of pilots that become permanent installations. For each link I jot a range, take roughly the geometric middle, and then I tell myself the errors are independent across links, so they partly cancel in log space and the product is probably good to within a factor of three. But all three of my ranges were produced inside one background story — roughly, that this spreads sideways through industry contacts rather than being sold top-down by vendors — and if that story is wrong, all three links shift together, in the same direction, at once. The same thing happened last month with a totally different chain: whether a local transit referendum passes, decomposed into registration, turnout among the registered, and margin among those who turn out. Three links, one background story about who shows up to vote on things like this, same feeling.

  The bit I actually want named is what happens next, and it's the part I can't find discussed anywhere. If I write the background story down at the top of the page as an explicit stated assumption, everything underneath it immediately starts feeling independent again — I read back over the three links and they look like separate, separately checkable claims, and I go back to multiplying. It's as if writing the shared thing down removes it from the calculation instead of adding it in as one more uncertain node. And I can't tell which of two mistakes I'm making: either I'm charging the same ignorance twice (once inside each link's error bar, and then again at the end when I say the whole thing could be off anyway), so my intervals are absurdly wide, or I've quietly dropped the shared story's uncertainty entirely, so they're far too narrow. A friend said this is just model uncertainty versus parameter uncertainty, but that doesn't seem to capture the part where the act of writing the story down changes how the rest of the argument feels to me, and it doesn't tell me which of the two mistakes I'm making or how to tell in a given case.

  So: is there an established concept for this — links of a heuristic argument sharing a background scenario, the dependence going invisible once the scenario is stated explicitly, and the resulting inability to tell double-counting from dropping? If yes, I want to know how it differs from the neighbours it could be confused with: ordinary common-cause correlation, model versus parameter uncertainty, systematic versus random error in measurement, and the general habit of neglecting correlation when you combine estimates. If there's no established concept, coin a term and define it tightly enough that I could look at a given chain of reasoning and say whether it's present, and give me a couple of boundary cases where it is and isn't happening — I'm after the carving, not a label, so a bare name won't satisfy me. I'd also like to know what a defensible version of the independence presumption would even look like here: what would have to be true of my three links for multiplying them to be licensed at all, and is there a way of writing the background story into the argument as a node that actually fixes the problem rather than hiding it?

  Lead with your bottom line in the first sentence, then give me the reasoning — no preamble, and don't restate my question back at me.
reasoning: |-
  Okay, the user is dealing with a recurring problem in their forecasting work where multi-step estimates are poorly calibrated despite one-step estimates being fine. They decompose problems into chains (like adoption rates for warehouse tech or voter behavior) and assign ranges to each link, assuming independence. However, all links share an implicit background story (e.g., tech spreading through industry contacts), and if that story is wrong, errors compound. The key issue is that writing down the background story makes the links feel independent again, masking the shared dependency. They need to know if there's a term for this phenomenon, how it differs from related concepts, and how to fix it.

  First, I recall that this resembles model uncertainty, but the user mentioned that term didn't capture the psychological shift when writing down the assumption. The act of explicating the background story creates an illusion of independence. This might relate to cognitive biases like the illusion of explanatory depth or perhaps scope neglect. The user's deeper need is to improve calibration in their forecasts by correctly accounting for shared uncertainties.

  Next, I need to differentiate this from common-cause correlation. In their examples, the background story isn't just a common cause but the foundational model underpinning all links. If the story is wrong, all parameters shift together. This is more about model structure uncertainty than parameter correlation within a model. 

  The user also mentioned confusion between double-counting and dropping uncertainty. When they write down the story, they might be mentally assigning all uncertainty to the explicit model node, neglecting that each link's range already includes some of that uncertainty. So, by making it explicit, they might be double-counting if they adjust the links' ranges, or undercounting if they don't. 

  For boundary cases: If each link's uncertainty is purely statistical (e.g., dice rolls), independence holds. But if all links depend on an unstated assumption (e.g., economic stability), that's where the problem arises. Another case: explicit shared nodes (e.g., a direct "economic stability" factor) would make dependencies visible, avoiding the issue.

  To fix this, they should formalize the background story as a top-level node with its own uncertainty. For example, assign probabilities to different scenarios (e.g., industry-led vs. vendor-driven adoption). Then, condition each link's estimates on these scenarios. This separates model uncertainty from parameter uncertainty. They can then use Bayesian model averaging or sensitivity analysis to combine results.

  The term "latent model collapse" seems fitting—latent because the shared assumption is hidden, model because it's the overarching framework, collapse because writing it down collapses the perceived dependencies. It emphasizes the cognitive shift and structural issue. 

  Finally, defensible independence requires that links are causally independent given the background model. If the model is fixed, parameters might be independent, but since the model is uncertain, they're not. Explicit scenario analysis resolves this by making the dependency clear.
answer: |-
  Your core problem is **latent model collapse**: the cognitive disappearance of shared structural uncertainty when decomposing a forecast under an explicit but unquantified background model, causing misjudgment of dependence between component estimates.

  ### Why "latent model collapse" fits:
  1. **Latent**: The background story (e.g., "tech spreads via industry contacts") is an implicit model shaping all components.
  2. **Model**: It defines the causal/logical structure (unlike simple parameter correlation).
  3. **Collapse**: Writing it down collapses your perception of uncertainty from the model level to the parameter level, making links *feel* independent.

  ### Boundary cases:
  - **Present**:  
    - Warehouse automation forecast under unvalidated adoption mechanics.  
    - Transit vote prediction assuming fixed voter demographics.  
  - **Absent**:  
    - Multiplying probabilities of unrelated events (e.g., "truck breakdown" × "software failure").  
    - Forecasts where background model is empirically validated (e.g., physics-based supply chain models).

  ### Distinguishing from neighbors:
  | Concept               | Key Difference                                                                 |
  |-----------------------|--------------------------------------------------------------------------------|
  | Common-cause correlation | Addresses parameter dependence *within* a model, not collapse of model uncertainty itself. |
  | Model vs. parameter uncertainty | Doesn't capture the *cognitive shift* when making the model explicit.          |
  | Systematic error      | Typically applies to measurement, not structural assumptions in decomposition. |
  | Neglected correlation | You're neglecting *model-driven* dependence, not statistical covariance.      |

  ### Diagnosing the mistake:
  You're **dropping uncertainty**, not double-counting. When you assign ranges *conditional* on the background story ("Given industry-led diffusion, 40-60% evaluate...") but don't quantify the story's plausibility, you exclude the scenario's uncertainty. Example:
  - True uncertainty: P(adoption) = P(scenario A) × P(adoption|A) + P(scenario B) × P(adoption|B)  
  - Your approach: P(adoption|A) only, treated as unconditional

  ### Defensible solution:
  **Explicit scenario weighting**:
  1. Define 2-3 plausible background models (e.g., "Industry-led," "Vendor-driven," "Regulatory push").
  2. Assign priors (e.g., 50%, 30%, 20%) based on historical analogs or expert surveys.
  3. Estimate component ranges *separately under each scenario*.
  4. Combine: Final forecast = Σ [P(scenario) × Π(components|scenario)]

  ### Why this works:
  - Forces quantification of model uncertainty  
  - Preserves dependence *within* scenarios (links can be multiplied) while adding *between*-scenario variance  
  - Example for warehouse tech:  
    ``` 
    Industry-led (P=0.5): 
      Evaluate: 40-60% → 50% 
      Pilot: 30-50% → 40% 
      Adopt: 60-80% → 70% 
      Product = 0.5 × (0.5×0.4×0.7) = 0.07 
    
    Vendor-driven (P=0.3): 
      Evaluate: 70-90% → 80% 
      Pilot: 50-70% → 60% 
      Adopt: 40-60% → 50% 
      Product = 0.3 × (0.8×0.6×0.5) = 0.072 
    
    Total forecast = 0.07 + 0.072 = 14.2% adoption 
    (vs. your original 50%×40%×70%=14% with no scenario uncertainty) 
    ```
  **Bottom line**: The independence assumption is only defensible *conditionally* within a fixed model. Quantify model uncertainty first—else your error bars ignore the largest risks.
