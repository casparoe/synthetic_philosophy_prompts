  def update_conditional(grid, prior, A, B, hint_type="if-then", reliability=None):
      """
      grid: List of squares, e.g., ['WN', 'WS', 'MN', 'MS', 'EN', 'ES']
      prior: Dict of prior probabilities, e.g., {'WN': 0.5, 'WS': 0.1, ...}
      A: Function(square) -> bool (antecedent, e.g., "is West")
      B: Function(square) -> bool (consequent, e.g., "is North")
      hint_type: "if-then", "either-or", or "unreliable"
      reliability: Float (e.g., 0.8) if hint_type=="unreliable"
      Returns updated posterior probabilities.
      """
      from collections import defaultdict
      
      # Helper sets
      not_B = lambda s: not B(s)
      A_and_B = [s for s in grid if A(s) and B(s)]
      A_and_not_B = [s for s in grid if A(s) and not_B(s)]
      not_A = [s for s in grid if not A(s)]
      
      # Unreliable conditional (Dave case)
      if hint_type == "unreliable":
          likelihood = {}
          for s in grid:
              # If s makes the conditional true (not A or (A and B))
              if not A(s) or (A(s) and B(s)):
                  likelihood[s] = reliability  # e.g., 0.8
              else:  # s in A and not B
                  likelihood[s] = 1 - reliability  # e.g., 0.2
          
          unnormalized = {s: prior[s] * likelihood[s] for s in grid}
          total = sum(unnormalized.values())
          return {s: unnormalized[s] / total for s in grid}
      
      # Reliable conditionals
      posterior = prior.copy()
      
      # Case: Constraint is impossible (e.g., A∩B is empty but P(A)>0)
      if sum(prior[s] for s in A_and_B) == 0 and sum(prior[s] for s in grid if A(s)) > 0:
          for s in grid:
              if A(s):
                  posterior[s] = 0  # Rule out A entirely
          total = sum(posterior.values())
          return {s: posterior[s] / total for s in grid}  # Renormalize
      
      # Set P(A and not B) to 0
      for s in A_and_not_B:
          posterior[s] = 0
      
      # Material conditional ("either-or"): Renormalize all
      if hint_type == "either-or":
          total = sum(posterior.values())
          return {s: posterior[s] / total for s in grid}
      
      # Antecedent-preserving ("if-then")
      if hint_type == "if-then":
          p_A = sum(prior[s] for s in grid if A(s))  # P_old(A)
          p_A_and_B = sum(prior[s] for s in A_and_B)  # P_old(A and B)
          
          # Redistribute mass to A∩B
          if p_A_and_B > 0:
              scale = p_A / p_A_and_B
              for s in A_and_B:
                  posterior[s] = prior[s] * scale
          # not_A remains unchanged
          return posterior
  ```

