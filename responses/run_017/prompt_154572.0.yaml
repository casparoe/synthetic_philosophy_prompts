  1. **For reliable "if-then" hints (e.g., "If A then B"):**  
     - **Rule:** Use antecedent-preserving conditionalization.  
       - Set \(P(A \text{ and } \neg B) = 0\) (rule out squares where A is true but B is false).  
       - Set \(P(A \text{ and } B) = P_\text{old}(A)\) (preserve the total probability of A, moving all mass to \(A \text{ and } B\)).  
       - Leave \(P(\neg A)\) unchanged (no change outside the antecedent).  
       - Within \(A \text{ and } B\), redistribute probability proportionally to the original probabilities.  
