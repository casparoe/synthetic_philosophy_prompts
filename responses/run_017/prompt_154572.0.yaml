  2. **For reliable "either-or" hints (e.g., "Either not A or B"):**  
     - **Rule:** Use material conditionalization (treat as the event \(\neg A \lor B\)).  
       - Set \(P(A \text{ and } \neg B) = 0\) (same as above).  
