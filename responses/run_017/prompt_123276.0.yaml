prompt: |-
  I keep having the same argument with a friend who does sentencing mitigation work for a legal aid office, and I want a much better version of it than either of us has managed so far. We keep going round about COMPAS — the recidivism risk score used in a bunch of US courts, the one ProPublica went after in 2016, and the one at the centre of the Wisconsin case where Eric Loomis got six years with a COMPAS score in front of the judge and then challenged it on due process grounds; the state supreme court upheld the use of the score but required that it come with warnings, and the US Supreme Court declined to hear it the following year. The facts as I remember them, and please just take them as given even if I have a detail or two wrong: the tool is proprietary, filled in from a long questionnaire about the person's history and circumstances, and it outputs a risk category; ProPublica's complaint was that black defendants were flagged as high risk and then did not go on to be arrested again at roughly twice the rate that white defendants were so flagged, while the company's reply was that the scores mean the same thing across groups — a high-risk black defendant and a high-risk white defendant reoffend at similar rates. My understanding is that both of those can be true at the same time, because they are two different formalisations of the idea that like cases should be treated alike, and when the underlying base rates differ you cannot satisfy both. Tell me if that matters to your analysis but don't get stuck there, because it isn't the part I care about.

  What I actually want is the mapping, and I want it to run in both directions. Take the question of whether AI systems should reason as utilitarians or as deontologists and run the episode through it properly: who the players really are (the defendant, the judge, the vendor, the legislature or corrections department that bought the thing, the people who would have been victimised by crimes that never happen, the people locked up longer because of a number), what the actual decision options were at each stage (build the tool, buy it, put the score in front of a judge, choose the threshold, disclose or not), what counts as evidence on each side, and what each theory says each of those players should have done. And then the places I think it has to break. One: a deployed system is not a person facing a one-off dilemma, it is a policy applied to thousands of people, so the act-versus-rule distinction that does so much work in the human case seems to collapse or at least move, and the system's real moral decision happened at training time, in front of nobody. Two: these systems are built by minimising a loss and then bolting constraints onto the outside, which looks less like a standoff between utilitarianism and deontology and more like consequentialism with side constraints bolted on — so the live question becomes which layer gets to win when the constraint is expensive, and I want your read on what that does to the original debate. Three, which I have never seen anyone make much of: the consequences the utilitarian version is supposedly maximising partly depend on the deployment itself, because longer sentences for flagged people and more police attention in flagged neighbourhoods feed back into the data the tool is validated against, so the aggregate calculus is self-referential in a way the deontological constraint is not. Does that asymmetry give the deontologist something real, or does it just make the consequentialist's homework harder?

  Then turn it around on the theory. My friend's position, which I half believe and half think is a dodge, is that none of this is a moral decision in the first place: a risk score is a prediction, predictions are neither utilitarian nor deontological, and all of the ethics lives in what the judge does with the number. Deal with that seriously instead of swatting it. But also say what the episode shows about the original question. Is it evidence that the utilitarian versus deontological frame is simply the wrong instrument here — that the normative choices which actually bite are about institutions, transparency, standing, and who is made to bear the error rate, none of which either theory has much to say about? Or does the case, precisely because the two fairness formalisations cannot both be satisfied, show that somebody has to pick a moralised criterion and that the deontologist's formal principle of equal treatment cannot tell us which, which would be a genuine problem for anyone trying to build a deontological machine? I would much rather you told me where each theory is silent than watched you force it to speak. Don't bother with sources or a reading list, I have plenty of those — just give me the analysis in plain prose, and flag the places where you are guessing about the case facts rather than about the argument.
reasoning: |-
  Okay, the user presents a sophisticated debate about COMPAS and its ethical implications. They're clearly well-versed in the technical and philosophical dimensions, having referenced ProPublica's investigation, the Loomis case, and the statistical fairness paradox. What they're truly seeking isn't factual correction but a rigorous mapping of ethical theories onto this real-world scenario.

  Hmm, their core frustration seems to be the circular arguments with their legal aid friend. The friend's "it's just a prediction" stance feels like an evasion to them, yet they're intellectually honest enough to admit partial agreement. That tension suggests they want the analysis to confront this dismissal without strawmanning it.

  The three structural issues they raise are profound: (1) The collapse of act/rule distinction in algorithmic systems, (2) The "bolted-on constraints" revealing consequentialism's dominance, and (3) The feedback loops undermining utilitarian calculations. These aren't just technicalities—they strike at whether traditional ethics frameworks can handle automated decision-making.

  I notice they're unusually aware of institutional dynamics. When they list "who the players really are," they include not just defendants and judges but vendors, legislatures, and unseen crime victims. This breadth matters—it prevents the analysis from getting trapped in defendant-versus-judge myopia.

  Their closing challenge is the sharpest: Does this case reveal that utilitarianism vs deontology is the wrong lens entirely? That silence on institutional design is the real flaw? I'll need to sit with that. Perhaps the theories aren't obsolete, but their individualism leaves them unequipped for systemic effects like risk-score feedback loops.

  The analysis must resist two temptations: oversimplifying the friend's position, or forcing ethical theories to answer questions they weren't built for. Better to show where each framework illuminates and where it goes dark—especially on that feedback loop problem, which really does seem to sabotage utilitarianism's claim to objective maximization.

  Most importantly, they've implied a meta-request: no academic citations, just clear reasoning. So I'll avoid jargon like "calibration parity" and instead show why the statistical fairness dilemma forces a moral choice that "just a prediction" can't escape.
answer: |-
  Here’s a direct mapping of the COMPAS debate onto utilitarian vs. deontological frameworks, followed by a reversal to interrogate your friend’s "just a prediction" stance and the limits of both theories:

  ### **I. Mapping Utilitarianism vs. Deontology onto COMPAS**
  **Key Players & Decisions:**  
  - **Vendor (e.g., Northpointe):** Built tool, chose training data/algorithm, set risk thresholds.  
  - **State/Legislature:** Bought COMPAS, decided to deploy in courts.  
  - **Judge:** Used score at sentencing (e.g., Loomis’ judge).  
  - **Defendant:** Subject to score (e.g., Loomis).  
  - **Unseen Parties:** Potential victims (if crime prevented), incarcerated individuals (over-punished), taxpayers (costs of incarceration).  

  **Utilitarian Analysis (Maximize Net Social Good):**  
  - **Vendor/State:** Should build/deploy if aggregate benefits (crime reduction, efficient sentencing) outweigh costs (over-incarceration, bias harms). Evidence: Recidivism reduction stats, cost-per-prisoner savings.  
  - **Judge:** Should sentence based on risk score if it minimizes future harm. Evidence: High-risk offenders (any race) reoffend at similar rates (per vendor).  
  - **Breakage Point 1 (Policy Scale):** Utilitarianism thrives here — optimizing for thousands of cases. "Training time" *is* the moral act: choosing a loss function that maximizes overall utility (e.g., accuracy).  
  - **Breakage Point 2 (Constraints):** Adding "fairness constraints" (e.g., demographic parity) is utilitarian pragmatism — a cost-benefit trade-off to avoid backlash or inequitable harms.  
  - **Breakage Point 3 (Feedback Loops):** Utilitarianism stumbles. Longer sentences → more "recidivism" data from incarcerated people → amplified bias. The utility calculus becomes corrupted (e.g., predicting prison behavior, not true reoffense).  

  **Deontological Analysis (Duties/Rights First):**  
  - **Core Duty:** Treat individuals as ends, not means. Protect due process (Loomis’ challenge).  
  - **Vendor/State:** Violates duties if tool is opaque ("proprietary black box"), undermining defendants’ right to contest evidence (Wisconsin court’s "warnings" acknowledge this).  
  - **Judge:** Using undisclosed algorithms violates duty to impartiality — COMPAS becomes unchallengeable testimony.  
  - **Breakage Points:** Deontology ignores aggregate outcomes. Satisfying equal treatment (e.g., "similar risk = similar score") may *require* violating equal impact (ProPublica’s finding). Feedback loops are irrelevant — the act itself (using a secretive tool) is wrong.  

  ---

  ### **II. Reversing the Lens: Attacking the Theories**
  **Your Friend’s Claim: "It’s Just a Prediction"**  
  - **Serious Engagement:**  
    - **True:** A risk score is descriptive ("60% chance of reoffending"). No ethics in the number itself.  
    - **False:** The *construction and deployment* are moral choices:  
      - Selecting training data (e.g., arrest records vs. convictions) encodes bias as "fact".  
      - Choosing *which* prediction to optimize (e.g., "reoffense" defined as rearrest, not conviction) is normative.  
      - **Crucially:** Deploying it in sentencing *makes it a moral actor*. Judges treat COMPAS as authority, shifting blame ("the algorithm said so").  

  **What COMPAS Reveals About the Theories:**  
  1. **The Frame Fails on Institutions:**  
     - Utilitarianism can’t resolve feedback loops (self-fulfilling prophecies).  
     - Deontology can’t choose between fairness definitions (equal treatment vs. equal impact).  
     - **Silence on:** Who bears error costs (black defendants falsely labeled high-risk), vendor profit motives, or judicial accountability.  

  2. **The Core Problem Isn’t Ethics, It’s Power:**  
     - **Transparency:** Deontology demands it; utilitarianism might sacrifice it for efficiency. COMPAS hid behind IP law — neither theory forced disclosure.  
     - **Standing:** Who gets to define "fairness"? Vendor (accuracy)? Legislature (costs)? Advocates (equity)? Neither theory weights these voices.  
     - **Error Distribution:** Utilitarianism accepts disparate false positives if aggregate crime falls. Deontology prohibits this but can’t say *how* to distribute errors fairly.  

  3. **The Real Moral Choice:** **Which World You Feed Data To**  
     - Use COMPAS → over-police high-risk groups → more arrests → "validates" COMPAS.  
     - Reject COMPAS → focus on root causes → less recidivism data → undermines predictive tools.  
     - **Asymmetry:** Deontology’s constraints (e.g., "no racial profiling") break the loop. Utilitarianism accelerates it.  

  ---

  ### **III. Conclusion: Why Your Friend is Half-Right (and Half-Wrong)**
  - **Half-Right:** The *number* isn’t moral. But the system’s design answers: "Whose risk matters?" (e.g., the state’s). The judge’s use *is* ethical — but constrained by a tool that pre-defines "risk" based on biased inputs.  
  - **Half-Wrong:** Calling it "just prediction" ignores that **prediction is policy**. The choice to optimize for "accuracy" (utility) while ignoring disparate impact (deontology) is a moral trade-off — one that the vendor and state made, not the judge.  
  - **Theories’ Blind Spot:** COMPAS shows ethics can’t be resolved by "utilitarianism vs. deontology" alone. The decisive questions are **political**: Who controls the algorithm? Who audits it? And who pays for its mistakes?  

  **Final Point:** The Wisconsin court’s compromise ("use with warnings") embodies the failure of both theories. It admits deontology’s demand for transparency while allowing utilitarianism’s efficiency gamble — and does nothing to fix the feedback loop. That’s not a synthesis; it’s an evasion.
