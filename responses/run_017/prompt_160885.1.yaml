  Okay, the user is convening a one-day colloquium in Oxford on whether Buddhist ethics is a form of consequentialism. Two speakers have been debating this for a decade: one defends a karuṇā (compassion) reading that aligns with welfare-maximizing consequentialism, while the other argues for a bhāvanā (cultivation) reading that fits virtue ethics. They need a joint statement with four specific parts: agreed claims, residual disagreements, cruxes with cases, and analysis of verbal disputes.

  Hmm, this requires careful balancing. The user wants neutrality—no caricatures, no smoothing over genuine disagreements. The three stipulated cases (relic, isolated awakening, longitudinal pattern) are crucial for testing positions. I notice the user emphasizes "no citations" and "British English," so I'll avoid academic references and use spellings like "practice" not "practise."

  First, the agreed claims section needs common ground. Both scholars likely accept Buddhism's diversity, intention's role in karma, precepts as training tools, and contextual understanding of bodhisattva transgressions. The relic case shows their divergence: the karuṇā supporter would prioritize maintaining villagers' welfare through deception, while the bhāvanā advocate would stress truthfulness as constitutive of virtue, even if welfare declines. This case directly probes whether consequences outweigh rules.

  For the isolated awakening case, the karuṇā view might see awakening as instrumentally good only if it reduces others' suffering, whereas the bhāvanā view could value it intrinsically as perfection of being. This tests if goodness is solely welfare-based.

  The longitudinal study is clever—it pits empirical outcomes against rule-adherence. If advanced practitioners ignore outcome-magnitude but rigidly keep precepts, it challenges consequentialism. The karuṇā side might be moved by reduced outcome-sensitivity (undermining welfare calculations), while bhāvanā supporters might question if rigidity reflects genuine virtue.

  Ah, verbal disputes! The label "consequentialism" is contentious here. Karuṇā sees it as maximizing good states (dukkha reduction), but bhāvanā rejects this because cultivation isn't outcome-focused. Reframing as "whether right action is determined solely by consequences" could help. Also, "Buddhist ethics" itself is ambiguous—is it what the Buddha taught or what practitioners do? Clarifying this might resolve some friction.

  The epistemic proviso about bodhisattva transgressions is another crux: karuṇā sees it as proof that rules bend to welfare, but bhāvanā insists it's irrelevant for ordinary agents without omniscience. This needs clear separation in the statement.

  I'll structure the statement precisely: four numbered parts, a table for disagreements (mirroring each side's phrasing), and cruxes with predictions for each case. Word count is tight (900-1200), so every sentence must count. British English is straightforward—e.g., "maximising" with double 's'.

  Key challenge: ensuring the "agreed claims" don't covertly favour one side. For example, stating that precepts "cultivate dispositions" is neutral, but adding "while reducing harm" might bias toward karuṇā. I'll stick to undisputed functions like "training." Similarly, karmic fruit must be described without implying it's merely instrumental.

  For the residual disagreements table, I'll use parallel columns. Karuṇā's "welfare-maximising" vs. bhāvanā's "character-perfecting" captures the core clash without strawmen. The longitudinal results will show predictive divergence—karuṇā cares if outcome-sensitivity decreases, bhāvanā cares if rule-adherence increases.

  Finally, I'll flag irreconcilable points honestly. The instrumental vs. intrinsic value of awakening might be fundamental; if both sides dig in, the statement should note that rather than fake agreement. The same for whether agent karma belongs in act-evaluation—karuṇā includes it in welfare, bhāvanā treats it as separate cultivation metric.

  ...Time to draft. Neutral tone, steelman both views, and let the cases expose the fault lines. The user's depth suggests they'll spot evasion, so rigor is essential.
answer: |-
  ## Joint Statement: On the Classification of Buddhist Ethics

  **1. Agreed Claims**

  We, the undersigned, affirm the following points of convergence regarding the interpretation of Buddhist ethics pertinent to the question of its classification, particularly concerning consequentialism:

  1.  **Diversity of Traditions:** Buddhist ethical thought and practice exhibit significant historical, cultural, and doctrinal diversity across traditions (Theravāda, Mahāyāna, Vajrayāna) and texts. No single theoretical model perfectly captures this entire complex landscape.
  2.  **Centrality of Intention (Cetanā) and Karmic Fruit (Vipāka):** Intention is the primary determinant of an action's karmic quality. Actions generate karmic fruits that mature for the agent, shaping future experiences and conditions. This process is central to Buddhist soteriology and ethical guidance.
  3.  **Status and Function of the Precepts (Śīla):** The ethical precepts (e.g., the Five Precepts, Bodhisattva vows) function fundamentally as training rules (śikṣāpada). Their observance cultivates wholesome mental states (kusala), purifies the mind, protects oneself and others from immediate harm, and creates conditions conducive to progress on the path (bhāvanā). Violation is understood primarily in terms of the unwholesome mental states generated and the karmic consequences for the agent.
  4.  **Compassionate Transgression Narratives:** Narratives depicting advanced bodhisattvas breaking precepts out of compassion demonstrate that within specific Mahāyāna frameworks, particularly concerning the Bodhisattva ideal, the primary ethical imperative of relieving suffering *can*, under *extraordinarily specific conditions*, override adherence to a precept. However, these narratives:
      *   Do *not* establish that precepts are generally overridable rules based solely on expected welfare consequences.
      *   Are *not* presented as templates for ordinary ethical decision-making.
      *   Highlight the exceptional nature of the agent (advanced realisation, vast compassion, specific insight/knowledge) and the extremity of the situation.
      *   Primarily illustrate the boundless nature of bodhicitta rather than providing a general theory of right action.
  5.  **Criteria for Classification:** Classifying "Buddhist ethics" requires specifying:
      *   Which aspect is under consideration (e.g., theory of right action, conception of the good, soteriological framework, practical guidance for specific agents).
      *   Which sources or traditions are being prioritised.
      *   The defining features of the comparative category (e.g., consequentialism, deontology, virtue ethics). Classification debates often hinge on contested interpretations of these features and their applicability to Buddhist materials.

  **2. Residual Disagreements**

  The following table presents core disagreements regarding the fundamental nature of Buddhist ethics. Each proposition is stated in terms acceptable to the proponent of the respective view:

  | **Disagreement Focus** | **Formulation Acceptable to Karuṇā Proponent** | **Formulation Acceptable to Bhāvanā Proponent** |
  | :---------------- | :-------------------------------- | :---------------------------------- |
  | **Primary Ethical Aim** | The ultimate ethical imperative is to minimise suffering (dukkha) and maximise well-being/welfare for all sentient beings, making the overall consequences of actions the fundamental criterion of ethical evaluation. | The ultimate ethical imperative is the cultivation (bhāvanā) of the perfections (pāramitās) leading to awakening (bodhi) for oneself and others, making the transformation of the agent's character and wisdom the fundamental criterion of ethical progress. |
  | **Role of Precepts / Rules** | Precepts are valuable heuristics for generating good consequences and avoiding harm, but their authority derives from their contribution to welfare maximisation; they can be overridden when adhering to them would cause significantly greater suffering. | Precepts are constitutive expressions of the awakened mind and essential practices for cultivating the virtues and wisdom necessary for awakening; their observance shapes the agent's character intrinsically, not merely as a means to separable consequences. |
  | **Nature of the Good** | The cessation of suffering and the promotion of well-being constitute the sole ultimate goods; awakening is valuable primarily as the most effective means to achieve this end universally. | Awakening itself possesses intrinsic, non-instrumental value as the perfection of wisdom and compassion, representing a good beyond the mere absence of suffering; it is the final end, not merely a means. |
  | **Agent's Perspective** | Right action is determined by the objective (or best-estimated) welfare consequences of the act, evaluated from an impartial perspective concerned with the suffering and happiness of all affected. | Right action is determined by the extent to which the act embodies and cultivates the virtues (e.g., compassion, wisdom, patience) inherent in the awakened state, as understood and developed by the agent on the path. |

  **3. Cruxes and Predictive Cases**

  We identify the following specific questions (cruxes) whose resolution would significantly impact the debate. For each, we present a stipulated case both agree bears on the crux, and record each side's *a priori* prediction and reasoning:

  *   **Crux 1: Does an act's karmic fruit for the agent belong *within* the consequentialist evaluation of the act's overall effects?**
      *   **Case:** The Relic Case (as stipulated).
      *   **Karunā Prediction:** The monk *should maintain the deception*. Reasoning: The immense, durable reduction in craving and harmful conduct (welfare gain) vastly outweighs the negative karmic consequences (e.g., false speech karmic fruit) accruing specifically to the monk. The net welfare consequence, including the villagers' benefit *and* the monk's karmic burden, remains positive. Maintaining the deception maximises overall welfare.
      *   **Bhāvanā Prediction:** The monk *should disclose the forgery*. Reasoning: The act of deliberate deception violates the precept against false speech, generates significant unwholesome mental states (deceit) in the monk, and produces negative karmic fruit *for him*. While the villagers' welfare is a compassionate concern, the primary ethical imperative is the monk’s own cultivation of truthfulness and wisdom. Sacrificing virtue for welfare consequences undermines the path. The karmic fruit is not merely an effect to be weighed *alongside* others; it is a direct indicator of the act's failure in terms of character cultivation.

  *   **Crux 2: Does the isolated awakening possess intrinsic, non-welfare value?**
      *   **Case:** The Isolated Awakening (as stipulated).
      *   **Karunā Prediction:** The isolated awakening *lacks ultimate ethical value*. Reasoning: Value resides solely in the reduction of suffering and promotion of well-being. Since the stipulated awakening has zero impact on any being's suffering or happiness, it holds no ethical significance. It is a neutral state regarding the good.
      *   **Bhāvanā Prediction:** The isolated awakening *possesses intrinsic, non-welfare value*. Reasoning: Awakening represents the perfection of wisdom and compassion, the realisation of ultimate reality. This state is inherently good and constitutes the final goal of the path, irrespective of its instrumental effects on others' welfare. Its value is inherent in the state itself.

  *   **Crux 3: Does the epistemic standing of an agent affect the relevance of bodhisattva transgression narratives?**
      *   **Case:** (Implicit in the Relic Case and general application) - Can an ordinary agent lacking omniscience or advanced realisation justify breaking a precept based on expected welfare gains, citing bodhisattva examples?
      *   **Karunā Prediction:** Yes, *in principle*, though with extreme caution. Reasoning: The narratives show that maximising welfare is the ultimate principle. While an ordinary agent's calculations are fallible, the *logic* applies: if an agent sincerely and reasonably believes breaking a precept is necessary to prevent immense suffering (as in the relic case), and acts from pure compassion, the act *can* be justified ethically, even if karmic consequences follow. The narratives provide a principled justification, not just a description of exceptional beings.
      *   **Bhāvanā Prediction:** No. Reasoning: The narratives explicitly require the agent's advanced realisation, knowledge of minds/karma, and pure motivation – conditions unattainable by ordinary practitioners. For such an agent, breaking a precept based on their *own* calculation of consequences almost invariably stems from delusion, attachment to views, or self-justification, generating negative karma and hindering cultivation. The narratives offer *no practical guidance or justification* for ordinary agents; they solely illustrate the nature of perfected compassion.

  *   **Crux 4: Does increased concentration predictably diminish sensitivity to outcome magnitude?**
      *   **Case:** The Longitudinal Pattern (as stipulated).
      *   **Karunā Prediction:** If the study finds that *deepening concentration predicts reduced sensitivity to outcome-magnitude*, this would challenge the consequentialist reading. Reasoning: A core feature of consequentialism is sensitivity to the scale of positive and negative outcomes. If advanced practice diminishes this sensitivity, it suggests the path cultivates a primary focus *other than* outcome maximisation (e.g., virtue or rule-following).
      *   **Bhāvanā Prediction:** If the study finds that *deepening concentration predicts increased unwillingness to breach a precept even where breaching it would help others*, this would strongly support the cultivation reading. Reasoning: It demonstrates that progress on the path (marked by deepening concentration) correlates with a prioritisation of virtue-expression and precept adherence over calculative welfare outcomes, aligning with the view that ethics is fundamentally about character transformation and the intrinsic value of virtuous action.

  **4. Analysis of Verbal and Substantive Disagreements**

  We conclude that part of the dispute regarding classification is **verbal**, concerning the definition of "consequentialism":

  *   **The Term "Consequentialism":** The disagreement often hinges on whether a theory counts as consequentialist *only* if it evaluates acts *solely* by the non-agent-relative, impersonal, *total* welfare consequences they produce (excluding the agent's karmic fruit as a distinct category of evaluation), or whether a theory that includes the agent's karmic fruit *within* the total consequences to be evaluated (as a specific type of welfare effect *on the agent*) can still be broadly consequentialist. Clarifying which definition is operative is essential.
  *   **Reformulation:** Framing the question as "Is the *primary determinant of an act's ethical status* in Buddhist thought the *overall welfare consequences* it produces (including karmic fruit for the agent), or is it the *extent to which the act embodies or cultivates the virtues* characteristic of awakening?" reduces ambiguity. The karuṇā proponent affirms the former; the bhāvanā proponent affirms the latter.

  However, **substantive disagreements** remain concerning:

  1.  **The Nature of the Good:** Whether the cessation of suffering is the *only* ultimate good (Karuṇā) or whether awakening possesses intrinsic, non-welfare value (Bhāvanā) – as tested by the Isolated Awakening case.
  2.  **The Role of Karmic Fruit:** Whether karmic fruit for the agent is merely one type of welfare consequence to be included in a net calculation (Karuṇā) or represents a distinct dimension of ethical evaluation tied intrinsically to virtue/vice and character cultivation (Bhāvanā) – as tested by the Relic Case.
  3.  **The Epistemic Proviso:** Whether the principle illustrated by bodhisattva transgressions (welfare maximisation overriding rules) has any justificatory force for ordinary agents (Karuṇā) or is strictly irrelevant to their ethical reasoning (Bhāvanā).
  4.  **The Predictive Primacy:** Whether empirical findings about advanced practitioners shifting focus away from outcome magnitude (Longitudinal Pattern) fundamentally challenge the consequentialist reading.

  We cannot find a mutually acceptable formulation that resolves these substantive points. The divergence reflects fundamentally different understandings of the core ethical engine within the Buddhist path: welfare optimisation versus agent transformation. The stipulated cases serve as critical loci for testing these divergent interpretations.

