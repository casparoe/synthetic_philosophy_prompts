     Fit: Partial
     Where it fits: The iterative process of adding layers that require the same capacity resembles the homunculus fallacy.
     Where it fails: The homunculus fallacy is about positing agents with the same capacity, but here the objection is about the presence of the property (e.g., consciousness) in the mechanism, and the proponent is not necessarily positing a homunculus but just more machinery. Also, the homunculus fallacy is typically a refutation, but here the objector is not necessarily claiming a regress refutes the account.

  3. Concept: Regress Argument
