  The gravel path is lying in the moon,
  No eye upon the walk I think to see.
  Where leaves are growing, silvered by the noon,
  No watcher claims the bench of cold decree.

  No eye upon the walk I think to see,
  The silent blooms, unseen, unfold their white.
  No watcher claims the bench of cold decree,
  Where shade collects within the fading light.

  The silent blooms, unseen, unfold their white.
  What thought can hold is not what may abide.
  Where shade collects within the fading light,
  A shape persists the turning of the tide.

