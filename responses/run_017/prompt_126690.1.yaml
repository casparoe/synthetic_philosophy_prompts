prompt: |-
  I'm in the second year of a doctorate that sits, awkwardly, between a marine policy institute and a philosophy department, and I spend most weeks in a joint lab meeting where the same argument about unrealistic assumptions recurs in a new costume. My supervisor has an unusually long and consistent paper trail of rulings on exactly this question — in survey articles, in referee reports we have all seen circulated, and in a running argument she has been having with an economist on the floor below — and I have started collecting them, because next month I have to present our group's stock assessment model to a fishery management council and I would like to know in advance how she will react to the use we now want to make of it. Her verdicts so far, on models whose assumptions are false in ways nobody disputes: a mechanics model that treats the bob as a point mass and the pivot as frictionless, used to get the period of a real pendulum, gets waved through; so does a model with a continuum of infinitesimal voters, used to show how vanishingly small the chance of being pivotal is; so does a model of industry entry in which firms maximize expected profits, even though the managers in that industry are documented to use simple markup rules and never solve anything, provided the industry has enough churn that selection does the work; and so does a bargaining model with zero transaction costs when it is used as a benchmark or null hypothesis against which to read lab data. But she has called the very same zero-transaction-cost model objectionable when it was used to write the actual allocation rule for a permit system; she has called an infinitely lived representative household objectionable when used to score a long-run pension reform; she has called a rational-expectations asset-pricing model objectionable when used to explain the historical excess return of equities over safe assets; and she has called a unitary-household labor supply model, in which the household pools its income and has one set of preferences, objectionable when used to predict whether it matters which parent receives a child allowance — there the falsity is entangled with the very variable being varied.

  The three rules I can think of all seem to fit that list equally well: an as-if instrumentalism of the Friedman sort, on which only predictive performance over the intended domain matters and the falsity of assumptions is irrelevant or even a sign of generality; a de-idealization requirement, on which a false assumption is harmless only if the model's result survives relaxing it toward the truth, so that the idealization is a limiting case rather than a load-bearing fiction; and a mechanism requirement, on which the falsity is harmless only when the model does not get its answer by way of a feature the target system lacks — the cited process has to be really there, though perhaps only as a population-level tendency, as in the selection case she accepts. My case separates them, or so I think. Our model assumes a single representative vessel with perfect knowledge of catch rates everywhere, moving effort instantly and costlessly to wherever profit is highest; vessel-tracking data show that real skippers return to grounds they know, learn from a small circle of kin and friends, treat some grounds as theirs by custom, and are slow to move. That has not stopped the model from predicting total catch and total effort for eight consecutive seasons, genuinely out of sample and better than anything else on offer, which is why the council already uses it to set the season's allowable catch. The new proposal is to use it to score a shift to individual transferable quotas, which everyone agrees would make effort far more mobile and far more responsive to profit differences, and would therefore move the real fleet toward what the model has always assumed. But the reform is also what makes the question interesting: a parallel agent-based model with sticky effort and social learning, calibrated to the same eight seasons, fits that history just as well and predicts far less consolidation of the fleet under tradable quotas than the representative-vessel model does, and the model has obviously never been tested in a regime that does not yet exist.

  So: what will she say about using the model to score the reform, and why? I would like the candidate rules stated precisely enough that I can see exactly which clause each one trips over, what each predicts, and which of her precedents is the closest analogue — the profit-maximization-by-selection case and the unitary-household case seem to me to pull in different directions. I also want to know whether her verdict should be different for different outputs of the same model, since the council wants two things out of it, a total catch number and a claim about how much the fleet will consolidate, and it is not obvious to me that one verdict covers both. Give me your best guess with the reasons for preferring it, and then tell me what further case would actually settle which rule she is running: I have access to a neighbouring fishery where tradable quotas were introduced a decade ago, and to vessel-level data both where quota trading turned out to be thick and where it stayed thin for customary reasons, so I can in principle construct almost any test she would consider fair.
reasoning: |-
  Okay, the user is in a tricky interdisciplinary Ph.D. situation between marine policy and philosophy, stuck in recurring debates about unrealistic assumptions in models. They've collected their supervisor's rulings on various models and need to predict how she'll react to using their stock assessment model for a new policy proposal. The model assumes a perfectly rational, mobile representative vessel, but real data shows skippers are influenced by social ties and habits. 

  Hmm, the core tension is between three philosophical frameworks the supervisor might use: Friedman's instrumentalism (only predictions matter), de-idealization (assumptions must be relaxable toward truth), and mechanism requirement (the causal process must exist). The model predicts total catch well historically but will now be used to forecast fleet consolidation under tradable quotas—a scenario where reality might align more with the model's assumptions. 

  The user's dilemma feels urgent because they're presenting to a fishery council soon. Beneath the surface, they might be wrestling with imposter syndrome in this interdisciplinary space or seeking validation that their empirical approach (testing in a neighboring fishery) could resolve theoretical deadlocks. 

  I should dissect why the three frameworks yield different verdicts: Instrumentalism would approve since the model has predictive success; de-idealization might reject because relaxing sticky effort assumptions changes consolidation predictions; mechanism requirement could go either way—post-reform, profit-driven mobility *might* emerge, but currently it's fictional. 

  The household allowance case seems analogous (unrealistic mechanism entangled with policy variation), suggesting rejection. But the selection case (firms "as if" rational due to market churn) hints approval since reform could make the mechanism real. 

  Crucially, the verdict might differ for total catch (historically validated) versus consolidation (untested in mobile regimes). The user's neighboring fishery data could empirically test mechanism validity post-reform—that'd satisfy all frameworks by revealing whether mobility actually drives consolidation. 

  ...I'll structure the reply to contrast the three rules' verdicts clearly, flag where outputs might need separate treatment, and propose testing the mechanism in the real quota-trading fishery as the definitive move.
answer: |-
  Based on your supervisor's pattern and the specifics of your case, here's the analysis, prediction, and path to resolution:

  **Predicted Verdict & Reasoning:**  
  Your supervisor will **object to using the representative-vessel model to score the ITQ reform's fleet consolidation impact**, but *might accept its use for total catch prediction*. The core objection hinges on the **mechanism requirement** being violated for consolidation, while *predictive success* (instrumentalism) and *de-idealization potential* are insufficient to override this when the mechanism is both false and policy-relevant.

  ---

  ### Why the Three Rules Yield Different Predictions:
  1.  **Friedmanite Instrumentalism ("Only predictions matter"):**  
      *   **Prediction:** Accepts both uses. The model has strong out-of-sample predictive power for catch/effort. The new use (scoring ITQs) is within the *intended domain* of predicting fishery dynamics under policy changes.  
      *   **Trips Over:** Nothing. This rule is permissive.  
      *   **Closest Precedent:** Pendulum, Voter Model, Industry Entry by Selection.

  2.  **De-idealization Requirement ("Result survives relaxing assumptions"):**  
      *   **Prediction:** Ambiguous, likely rejects consolidation prediction. Relaxing the "perfect mobility/knowledge" assumption toward the empirically observed stickiness/social learning *explicitly changes the consolidation prediction* in the competing ABM. If the result (consolidation level) is sensitive to relaxing this core false assumption, it fails de-idealization.  
      *   **Trips Over:** The consolidation result *depends* on the load-bearing fiction of perfect mobility/knowledge. Relaxing it alters the prediction.  
      *   **Closest Precedent:** Unitary Household Model (falsity entangled with varied policy). Pendulum survives de-idealization (adding friction changes period predictably).  
      *   **Catch Prediction:** *Might* survive if de-idealization shows total catch is robust to relaxing mobility assumptions.

  3.  **Mechanism Requirement ("Process must exist, even tendentially"):**  
      *   **Prediction:** **Rejects consolidation prediction.** The mechanism driving consolidation in the model (perfectly rational, instant, costless effort mobility chasing max profit) is *documented as absent* in the current system (sticky effort, social learning, customs). The reform *aims* to make the real mechanism *more like* the model's, but this is aspirational, not demonstrated. Using it *assumes* the aspirational mechanism is already true to generate the prediction.  
      *   **Trips Over:** The model gets its consolidation answer *by relying on a feature (perfect mobility mechanism) the target system demonstrably lacks*, and crucially, this feature is central to the predicted outcome under the policy variation.  
      *   **Closest Precedent:** **Unitary Household Model.** Just as the falsity of the unitary preference mechanism was entangled with the policy variation (who gets the allowance), here the falsity of the perfect mobility mechanism is entangled with the policy variation (introducing ITQs to *create* mobility). Also analogous: Objection to using Rational Expectations for *explaining* historical returns (where the mechanism demonstrably failed) vs. as a benchmark.  
      *   **Distinguisher:** The **Industry Entry by Selection** case is accepted *because* the mechanism (profit maximization) *exists* as a population-level tendency *due to selection*, even if individual agents don't exhibit it. Here, the *required* mechanism (perfect mobility) does *not* exist as a tendency *yet*. The reform is intended to induce it, but that's the point of testing – it's not proven.

  ---

  ### Supervisor's Likely Verdict & Why
  *   **On Predicting Consolidation:** **Objectionable.** This is a direct parallel to the **Unitary Household** and **Rational Expectations for Explanation** cases. The model's core false assumption (perfect mobility mechanism) is not just unrealistic but *directly contradicted by evidence* and is *fundamentally entangled* with the policy's intended effect and the specific output (consolidation). The predictive success for past *total catch* does not validate the *mechanism* for this novel *distributional outcome* under a regime shift. The ABM divergence highlights the mechanism dependence. *Mechanism Requirement* is the dominant rule here, overriding instrumentalism due to the policy stakes and novelty.
  *   **On Predicting Total Catch:** **Likely Acceptable (with caveats).** If the model retains predictive power for aggregate outcomes (catch, effort) under the new policy, and this prediction is seen as separable from the mobility mechanism's details (e.g., if aggregate response is robust), she *might* accept this use based on instrumentalism *or* de-idealization showing aggregate robustness. However, she would strongly caution that this acceptance is provisional and contingent on the reform not fundamentally altering other system dynamics affecting total catch that the model misses. **Precedent:** Pendulum/Voter Model – aggregate outcomes surviving despite false micro-assumptions.

  **Why Mechanism Requirement Wins:** Her strongest objections consistently target cases where:
  1.  The false assumption describes a *causal process/mechanism*.
  2.  The model's result *depends critically* on that false mechanism.
  3.  The result is used for *explanation* or *policy prescription* concerning an outcome directly linked to that mechanism.
  4.  There is *evidence* the real mechanism differs.
  Your ITQ consolidation prediction hits all four points squarely. The selection case avoids #2 (result doesn't depend on individual rationality, depends on selection) and partially avoids #1 (profit max *is* the tendential mechanism via selection). The unitary household case hits all four, like yours.

  ---

  ### The Definitive Test to Settle Her Rule
  Your neighboring fishery data is the **perfect arbiter**. To distinguish Mechanism Requirement from the others, design a test focusing **explicitly on the causal link between the *mechanism* and the outcome**:

  1.  **Hypothesis:** Does the *degree* to which the *profit-driven mobility mechanism* actually emerges post-ITQ (measured by trading thickness, responsiveness of effort shifts to profit differentials) **directly cause** the *degree* of fleet consolidation?
      *   **Mechanism Requirement Needs:** Evidence that when the mechanism *exists* (thick trading, responsive effort), consolidation follows the representative-vessel model's prediction. When the mechanism is *blocked* or weak (thin trading due to customs), consolidation follows the sticky-effort ABM prediction. Correlation between *measured mechanism strength* and *observed consolidation*.
      *   **Instrumentalism Only Needs:** Does the representative model predict consolidation *accurately* in both thick and thin trading areas? (It likely won't in thin areas).
      *   **De-idealization Needs:** Can you relax the perfect mobility assumption in the representative model (e.g., add a friction parameter) so it *continuously* matches consolidation levels observed under *varying* real-world mobility (from thick to thin trading)? Does the original result (high consolidation) only hold in the limit of perfect mobility?

  **Her "Fair Test":** She will prioritize the **mechanism-focused test** (#1 above). If you can show:
  *   **Strong Correlation:** Higher observed mobility → Consolidation closer to representative model; Lower observed mobility → Consolidation closer to ABM.
  *   **Process Tracing:** Evidence (e.g., skipper interviews, movement data) confirming mobility *caused* consolidation in thick-trading areas, while customs/kinship *inhibited* both mobility and consolidation in thin-trading areas.
  ...then she would accept the representative model *for predicting consolidation **only** in contexts where the profit-driven mobility mechanism is confirmed to dominate*. This validates the Mechanism Requirement: the model's mechanism must be materially present. Passing this test would also satisfy de-idealization (by showing the result depends on the mechanism's strength) and instrumentalism (by demonstrating predictive power *where the mechanism holds*).

  **Failure Modes:**
  *   If consolidation happens similarly regardless of trading thickness/customs, it invalidates the mechanism and supports instrumentalism for aggregate outcomes.
  *   If consolidation varies but *isn't* correlated with measured mobility mechanisms, it supports de-idealization needing refinement or other factors dominating.

  **In summary:** Predict an objection to using the model for consolidation prediction due to the violated Mechanism Requirement (closest analogue: Unitary Household). Use your neighboring fishery data to test *specifically* whether the emergence of the profit-driven mobility mechanism explains variation in consolidation post-ITQ. A positive result would satisfy her and justify conditional use of the model for similar reforms.
