prompt: |-
  I staff our hospital system's clinical algorithm review committee, and I have to draft the memo for next week's decision, so I want the reasoning laid out rather than just a bottom line.

  Our track record so far:

  1. Care-management enrollment model, two patient groups with essentially identical event rates (14% and 15%). One threshold, the score calibrated within groups, false-positive and false-negative rates equal across groups within noise. Approved without conditions.
  2. A vendor model that used prior-year cost as a feature. On audit, a patient in group B assigned a given score had materially higher true risk than a group A patient with the same score, and group B's miss rate was nearly double group A's. Rejected; the written reason was that the same number has to carry the same risk for every patient.
  3. A model that equalized flag rates across groups even though event rates differed (20% vs 14%). Rejected; the opinion said the committee was not imposing rate parity, and objected that both the miss rates and the share of flags that turned out to be true cases diverged sharply between groups.
  4. One review with unequal event rates where the committee deadlocked, then rejected on an unrelated data-provenance problem while explicitly declining to say anything about error rates.

  The pattern I want checked: in every decided case the two demands we might be running — that a given score mean the same thing in every group, and that false-positive and false-negative rates be equalized across groups — have pointed the same way. Everything we approved satisfied both; everything we rejected violated both. We have never seen them come apart.

  The new submission does that. It allocates 500 post-discharge nursing slots. Event rates are 22% in group A and 9% in group B; the committee has already accepted those registry rates as accurate rather than as an artifact of who gets diagnosed. As submitted, the score is calibrated within groups and one threshold is used for everyone, giving: group A flagged 26% of the time, 15% false-positive rate, 35% miss rate, 55% of flags are true cases; group B flagged 9.5% of the time, 6% false-positive rate, 55% miss rate, 43% of flags are true cases. The vendor also offers a second variant with group-specific thresholds that equalizes both error rates (12% false positives, 40% misses in each group); there, group B is flagged 16% of the time and group A 23%, and the share of flags that are true cases becomes roughly 58% for A and 33% for B.

  One complication that none of our precedents had: this intervention is not merely predictive. Enrollment itself causally lowers the event rate, and our pilot data suggest the reduction is about 2 percentage points for A patients and about 5 for B patients, so a flag that turns out not to be a true case is not simply a wasted slot in the way our earlier framing assumed. Slots are capped, so more for B is fewer for A.

  What should we decide if we want to be consistent with ourselves, and which rule have we been implicitly running: equalized error rates, equal predictive meaning of the score, benefit maximization subject to a floor, or something else I have not named? Which precedent is the closest analog, and if our precedents genuinely underdetermine this, what principle would we be adopting with each option — including any variant I should ask the vendor for that neither of these two is? Finally, name the single further number, audit, or hypothetical variant that would best force us to reveal which rule we have really been applying. Say how confident you are in the recommendation, and single out the point you are least sure of.
reasoning: |-
  Hmm, the user is part of a clinical algorithm review committee at a hospital system and needs help drafting a memo for an upcoming decision. They've provided a detailed history of past decisions and want to ensure consistency with their precedents while addressing a new complex case.

  Looking at their track record: They approved a model where event rates were similar (14% vs 15%) and both calibration and error rates were equal. They rejected two models - one where the score meant different things across groups (violating calibration), and another where flag rates were equalized despite different event rates (causing divergent error rates). One case was deadlocked but rejected for unrelated reasons.

  The pattern I notice is that their committee has consistently required both (1) score calibration (same score = same risk across groups) and (2) equal error rates. These have always aligned in previous cases, but now they're facing a submission where these principles conflict.

  The new model involves allocating 500 nursing slots for post-discharge care. Group A has 22% event rate, Group B 9%. The vendor offers two options:
  - Single threshold: Calibrated scores but wildly unequal error rates (35% vs 55% misses)
  - Group-specific thresholds: Equal error rates but scores mean different things (same score = different risk)

  Complicating factors:
  1) The intervention itself reduces event rates (2pp for A, 5pp for B)
  2) Slots are capped - prioritizing one group means fewer slots for the other

  The user needs to know:
  - How to stay consistent with past decisions
  - Which implicit rule they've been following
  - Which precedent applies
  - How to handle this novel conflict
  - What additional analysis would clarify their principles

  I think their core principle has been maximizing clinical utility under constraints, with two guardrails:
  1) Scores must be meaningful (calibration)
  2) Resources must be allocated fairly (similar error rates)

  But now these conflict. Case 3 is the closest precedent - they rejected equal flag rates when event rates differed, noting both error rates and positive predictive value diverged. That suggests they value consistent performance over mechanical parity.

  The intervention's causal effect changes the calculus too. False positives aren't "wasted" - they produce different benefits for each group. This breaks their previous framing that only true positives matter.

  For consistency, I think they should:
  - Reject the single-threshold version (violates error rate equity)
  - Hesitate on the group-threshold version (violates calibration)
  - Request a "benefit-maximizing" version that accounts for differential intervention effects

  The key number that would reveal their true priority is the net benefit difference between allocation strategies. If they choose the version that maximizes lives saved despite violating calibration, it shows benefit maximization is their ultimate goal. If they insist on calibration despite worse outcomes, it shows process fairness dominates.

  The point I'm least sure about is how strongly to weigh the causal effects. The 5pp vs 2pp reduction for B vs A suggests false positives in group B prevent more events - but we'd need to know baseline risks to quantify this properly.
answer: |-
  Based on your committee's precedent and the novel conflict in this submission, **reject the vendor's proposed variants and request a "benefit-maximizing threshold" model** that accounts for the intervention's causal effects. Below is the full reasoning, precedents, principles, and key uncertainties.

  ---

  ### **1. Core Principles from Precedents**
  Your decisions consistently enforce two non-negotiable rules:
  - **Calibration Equity**: A given score must imply identical actual risk across groups (violated in Case 2).  
  - **Error-Rate Parity**: False-positive/false-negative rates must be equal absent compelling justification (violated in Cases 2, 3, and 4).  

  Approvals required *both* (Case 1). Rejections occurred when *either* was violated. **Neither principle was prioritized over the other**; they were treated as co-equal requirements.  

  **Case 3 is the closest analog**: You rejected equal flag rates because they created disparities in error rates and positive predictive value (PPV). Here, the single-threshold model similarly sacrifices error-rate parity for calibration equity, while the group-threshold model sacrifices calibration for error-rate parity. Both violate one principle.  

  ---

  ### **2. Analysis of Vendor's Proposals**
  | **Metric**               | **Single Threshold** (Calibrated) | **Group Thresholds** (Equal Errors) |
  |--------------------------|-----------------------------------|-------------------------------------|
  | **Group A Flag Rate**     | 26%                               | 23%                                |
  | **Group B Flag Rate**     | 9.5%                              | 16%                                |
  | **False-Positive Rate**   | A: 15% vs B: 6% (∆9%)             | Both 12%                           |
  | **False-Negative Rate**   | A: 35% vs B: 55% (∆20%)           | Both 40%                           |
  | **PPV**                  | A: 55% vs B: 43% (∆12%)           | A: 58% vs B: 33% (∆25%)            |
  | **Calibration**          | ✓ Same score = same risk          | ✗ Same score ≠ same risk           |

  - **Single Threshold**: Fails *error-rate parity* (B has 55% misses vs A’s 35%).  
  - **Group Thresholds**: Fails *calibration equity* (a score of "X" means higher risk for B than A).  
  **Neither satisfies both historical principles.**  

  ---

  ### **3. Novel Complication: Causal Intervention Effects**
  This breaks from past cases:  
  - **False positives aren’t "wasted"**: Enrolling a non-event patient still reduces their risk (A: -2pp, B: -5pp).  
  - **True positives avert more harm**: Preventing an event in B (9% baseline) vs A (22% baseline) has different clinical value.  
  - **Slots are zero-sum**: More slots for B mean fewer for A.  

  This demands **benefit-maximizing allocation**, not just statistical parity.  

  ---

  ### **4. Recommendation: Reject Both & Request a New Model**
  - **Why reject?**  
    - Both variants violate one core principle (calibration equity or error-rate parity).  
    - Neither accounts for the intervention’s differential effects.  
  - **What to request**: A **benefit-maximizing threshold** model that:  
    1. Maintains calibration equity (same score = same risk).  
    2. Uses thresholds that maximize *total events prevented*, given:  
       - Slots (500) and intervention efficacy (A: -2pp, B: -5pp),  
       - Baseline event rates (A: 22%, B: 9%).  

  **Expected Outcome**: This model will likely:  
  - Flag fewer low-risk B patients (since efficacy is high but baseline risk is low),  
  - Flag more moderate-risk A patients (higher baseline risk),  
  - **Accept unequal error rates** if justified by net benefit.  

  ---

  ### **5. The "Revealing" Test: What Forces Clarity?**
  Request a **net-benefit curve** showing:  
  - Total events prevented under both variants vs. the benefit-maximizing model.  
  - Disaggregated by group and overall.  

  **Why this reveals your rule**:  
  - If you prioritize *benefit maximization*, you’ll accept unequal error rates if net benefit increases.  
  - If you prioritize *error-rate parity* or *calibration equity*, you’ll reject despite higher net benefit.  
  - **Precedent alignment**: Case 3 implicitly prioritized outcomes over flag-rate parity.  

  ---

  ### **6. Confidence & Uncertainties**
  - **Confidence Level**: 90% in rejecting both proposals.  
  - **Least Sure About**: Quantifying the causal effects.  
    - Pilot data (-2pp for A, -5pp for B) may not reflect real-world scalability.  
    - **Mitigation**: Demand sensitivity analysis (e.g., "What if efficacy for B is only -3pp?").  

  ---

  ### **Memo Draft Framework**
  > **Decision**: Reject both variants. Request resubmission with a benefit-maximizing model.  
  > **Reasoning**:  
  > 1. **Precedent**: All prior approvals required both calibration equity and error-rate parity. Neither proposal satisfies both.  
  > 2. **Novelty**: Intervention efficacy differs by group. Allocations must maximize total benefit, not just parity.  
  > 3. **Path Forward**: Vendor must provide thresholds optimizing events prevented, with sensitivity analysis on efficacy.  
  > 4. **Clarifying Test**: Net-benefit curves will confirm if violating one principle is justified by material gain.  

  This maintains consistency (principles > mechanical parity) while adapting to causal complexity.
