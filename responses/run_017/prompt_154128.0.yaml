prompt: |-
  I work in the methods unit of a national infrastructure authority, and I have been asked to write a short internal note on what our appraisal manual actually assumes about human welfare. I would like the philosophical version of that note, because the manual makes claims none of us can cash.

  The practice, briefly. We rank projects by monetised net benefit, and benefits must be measured from observed behaviour rather than from what people say. A minute of travel time is priced by the fare premium people actually pay for the faster service. Risk of death is priced by the extra wages that riskier jobs command. Cleaner air is priced by what it adds to local house prices. Stated-preference surveys are inadmissible: the manual rejects them on the ground that someone filling in a questionnaire is not choosing, and so reveals nothing. Where no market exists, we transfer a value from a broadly similar market somewhere else, scaled by income. Losses are priced the same way. A household that will lose its home to a new line is credited with the market value of the house and a fixed statutory disturbance payment, not with what it says it would take to make it willing to move. Benefits and costs are then added across everyone affected at one unit of currency per unit, with no weighting by who ends up with them, and we do not require that anyone actually be paid. A short list of impacts — landscape, quiet, one particular wetland — is recorded in a separate table and never enters the arithmetic.

  Two things sit badly with me.

  First, the same authority runs a behavioural-insights team whose job is to change defaults so that people end up choosing differently — auto-enrolling commuters in the off-peak ticket, or in the cycle-to-work scheme — on the explicit ground that what those people would otherwise have chosen is not good for them. When that team's interventions are appraised, the resulting changes in behaviour are counted as benefits and priced with the very same revealed-preference numbers. So in one part of the building we treat choice as the only admissible evidence of value, and in the next we treat it as evidence we are entitled to override.

  Second, we insist that only real choices count and then price most things using choices nobody made: the value transferred from another city, the house price paid by a buyer who never once considered air quality, the imputed willingness to pay of a child or of people not yet born.

  What I want is the implicit theory. What view of utility, or of welfare, or of what a choice shows, does this package of rules only make sense under? Which parts of the package does that view strictly require, and which are merely habits that fit it comfortably? Is the combination coherent, or does the nudge work quietly presuppose something the valuation rules deny? My suspicion is that the word value is doing three different jobs in our arithmetic and we are adding the results as though it were one, but I cannot say what the jobs are or which one carries the weight.

  And if we took seriously the austere version of revealed preference — the one on which choice data pins down nothing more than, for each person separately, an ordering of the options with no meaningful distances in it and no way of setting one person's ordering against another's — which of our rules would have to go, and what would replace the benefit-cost test as a way of choosing between projects?
reasoning: |-
  Okay, the user works in a national infrastructure authority's methods unit and needs to write an internal note about the philosophical assumptions behind their appraisal manual. They've described their current practices: they monetize net benefits using revealed preferences from market behaviors, reject stated preferences, value losses at market rates, sum benefits without weighting, and exclude certain intangible impacts. 

  The user has two main concerns. First, there's an internal contradiction where their behavioral insights team overrides people's choices (like auto-enrollment programs) while the appraisal manual treats choices as sacrosanct. Second, they notice hypocrisy in claiming to value "real choices" while relying heavily on transferred/imputed values from contexts where no actual choice occurred. 

  Hmm... their core question is about the implicit welfare theory behind this system. They suspect "value" is doing triple duty and want to identify: (1) the philosophical foundation, (2) which rules are essential vs. conventional, (3) whether the "nudge" work contradicts valuation rules, and (4) what would change under strict revealed preference theory.

  This is a sophisticated request. The user clearly understands the technical aspects but is wrestling with the normative underpinnings. Their frustration with internal inconsistency suggests they might be preparing to advocate for methodological reforms. The mention of "what the word value is doing" hints they suspect conflation of welfare concepts.

  Let me unpack this systematically. The manual's approach maps neatly to Samuelson's revealed preference theory within a welfarist framework. But the cracks appear in three places: behavioral interventions (where choice isn't sovereign), benefit aggregation (which requires cardinal utility), and non-market valuation (where choices are hypothetical). 

  The deepest tension is between treating choice as welfare-revealing while simultaneously overriding it via nudges. The behavioral team operates on paternalistic grounds the manual ostensibly rejects. Meanwhile, the strict revealed preference axioms would collapse their entire valuation system - they couldn't sum unweighted benefits or use market prices as welfare metrics.

  For their note, I should clarify that their system actually relies on three distinct value concepts: ordinal preferences (for micro-choices), cardinal utility (for aggregation), and ethical norms (for exclusions). The first two are incompatible under strict revealed preference. 

  If they embraced pure ordinalism, they'd need to abandon cost-benefit analysis altogether and consider alternative frameworks like Kaldor-Hicks efficiency or multi-criteria decision analysis. But realistically, they'll probably want pragmatic solutions - perhaps adopting "welfarist paternalism" explicitly or developing consistent criteria for when choice-overrides are permitted.

  The wetland exclusion is particularly telling; it reveals an unspoken ethical limit to welfarism. I'll highlight that as evidence their system already smuggles in non-preference values. That might be a useful lever for methodological discussions.
answer: |-
  Here's the philosophical unpacking of your appraisal manual's implicit welfare theory, structured as an internal note:

  **Internal Note: Philosophical Foundations of Our Appraisal Manual's Welfare Assumptions**

  **Subject:** Implicit Welfare Theory Underpinning Appraisal Methodology

  **1. Core Philosophical Commitment: Preference-Satisfaction Welfarism & Methodological Behaviorism**
     *   **Assumption:** Individual welfare (well-being) is exclusively defined by the satisfaction of individual preferences.
     *   **Epistemology:** Only observable choices in *real* (or realistically simulated) trade-off situations provide reliable evidence of these preferences and their *intensity*. Words (stated preferences) are deemed unreliable indicators of true willingness to trade.
     *   **Key Tenet:** "Revealed Preference" (RP) is the *sole* admissible data. Choice reveals preference, and preference defines welfare. Money is the universal metric for quantifying preference intensity via observed trade-offs.

  **2. The Specific Welfare Theory: Cardinal Utilitarianism via Market Proxy**
     *   **Beyond Ordinalism:** While RP theory *starts* ordinally (A chosen over B implies A preferred to B), the manual requires **cardinal utility**. Monetization (e.g., £X per minute saved) assumes preferences have measurable intensities comparable across goods and people.
     *   **Aggregation:** Summing monetized benefits/costs across individuals assumes:
          *   **Interpersonal Comparability:** £1 gain/loss represents an equivalent welfare change for any individual, regardless of their income or circumstances (Unweighted Utilitarianism).
          *   **Constant Marginal Utility of Money:** The welfare value of £1 is constant for an individual, regardless of their current wealth. This is essential for using market prices/WTP as a direct welfare metric.
     *   **WTP as Welfare:** Willingness-to-Pay (WTP) or Willingness-to-Accept (WTA), *inferred from actual choices*, is treated as the direct measure of the welfare change associated with a good or loss. The market (or quasi-market) price *is* the welfare price.

  **3. Which Rules Are Strictly Required by This View?**
      *   **Mandatory:**
          *   **Rejection of Stated Preference:** If choice *alone* reveals true preference/welfare, surveys are invalid.
          *   **Use of Observed Behavior:** Only real trade-offs count (in principle).
          *   **Unweighted Summation:** Utilitarian aggregation requires treating £1 as £1 for everyone.
          *   **Non-Payment Irrelevance:** Welfare change is about preference satisfaction, not cash transfers (Kaldor-Hicks potential compensation).
      *   **Methodologically Convenient (But Logically Contingent):**
          *   **Value Transfer:** A pragmatic necessity due to data limitations, justified *if* the underlying preferences/welfare trade-offs are assumed similar (scaling by income implicitly assumes welfare effects scale with income).
          *   **Market Proxies (e.g., Hedonics):** Assumes choices in related markets (housing, labor) reliably reveal preferences for the specific good (clean air, safety). Requires assuming individuals perceive and value the attribute correctly *in the context of the market choice*.
          *   **Fixed Disturbance Payments:** Assumes market value + fixed sum adequately captures the *average* welfare loss (WTA) for displacement, based on past revealed preferences.

  **4. Internal Tensions & Contradictions**
      *   **The Nudge Paradox:**
          *   **Manual's View:** Choice = Welfare Revelation (Sacrosanct).
          *   **Behavioral Team's View:** Choice = Fallible Indicator (Can be Overridden for Welfare).
          *   **Contradiction:** The appraisal of nudges using RP values *depends on the very choices the nudge is overriding*. It implicitly accepts the RP values as measuring welfare *even when the choice is deemed suboptimal*. This violates the core manual tenet that *only* choice reveals welfare. The nudge work presupposes a *substantive* concept of welfare (e.g., long-term health, financial security) distinct from revealed preference, which the valuation rules explicitly deny.
      *   **The "Real Choice" Mirage:**
          *   **Problem:** Transferred values, hedonic imputations (e.g., buyer ignoring air quality), and valuations for non-choosers (children, future gens) fundamentally violate the "only real choices count" principle. These are *constructed* values based on theoretical models and assumptions about similarity, not observed preference revelations.
          *   **Implication:** The manual relies on *inferred* or *assumed* preferences where none are revealed, contradicting its strict behaviorist epistemology. It substitutes expert modeling for revealed preference in these cases.

  **5. The "Value" Trilemma:** Your suspicion is correct. "Value" conflates three distinct concepts:
      1.  **Revealed Ordinal Preference:** "A is chosen over B" (Pure RP).
      2.  **Cardinal Welfare Measure:** "A provides X units of utility more than B" (Required for monetization/summation).
      3.  **Ethical Weight:** "£1 to person P matters equally to £1 to person Q" (Required for unweighted summation).
      The manual *needs* concepts 2 and 3 to function but its foundational epistemology (concept 1) cannot logically support them. RP data (1) cannot generate cardinality (2) or interpersonal comparability (3) without strong, often implausible, auxiliary assumptions.

  **6. Consequences of Embracing Strict (Ordinal) Revealed Preference**
  If we adopted the austere version of RP (only individual ordinal rankings, no cardinality, no interpersonal comparison):
      *   **Rules that Must Go:**
          *   **Monetization:** No basis for assigning £ values to utility changes.
          *   **Unweighted Summation:** No basis for comparing or aggregating welfare changes across individuals.
          *   **Value Transfer/Hedonics:** Impossible without cardinality and assumptions about preference similarity/stability.
          *   **Benefit-Cost Analysis (as currently practiced):** Collapses entirely.
      *   **What Could Replace BCA?**
          *   **Kaldor-Hicks Potential Compensation Test:** Could a project's winners *potentially* compensate the losers and still be better off? (Still relies on WTP/WTA but avoids interpersonal utility comparisons). Requires hypothetical compensation, which strict RP might still reject.
          *   **Multi-Criteria Decision Analysis (MCDA):** Explicitly weigh quantified *impacts* (travel time saved, lives saved, houses lost, wetland affected) using *judgmental weights*, abandoning the pretense of a single "welfare" metric. Accepts ethical pluralism.
          *   **Deliberative Democratic Processes:** Shift focus to democratic decision-making based on discussion of values, trade-offs, and ethical principles, rather than pseudo-scientific welfare aggregation.
          *   **Rights-Based or Constrained Optimization:** Prioritize avoiding certain harms (e.g., displacement, ecological damage) as constraints, then optimize other objectives within those bounds.

  **7. The Unspoken Exclusion: The manual's separate table for landscape/quiet/wetland tacitly acknowledges the limits of preference-satisfaction welfarism.** These are often seen as having intrinsic value, value to non-sentient entities, or intergenerational value that cannot be adequately captured by current market choices or RP. This exclusion is an ethical concession inconsistent with the manual's core theory but essential for political/practical reasons.

  **Conclusion:** Our manual implicitly assumes a specific, contestable form of **cardinal utilitarianism**, where welfare is defined solely by preference satisfaction, intensities are measured by monetary trade-offs observed in choices, and £1 is treated as welfare-equivalent across all individuals. This theory strictly requires the rejection of stated preference and unweighted summation. However, it is internally strained by the reliance on constructed/imputed values and fundamentally contradicted by the authority's own paternalistic "nudge" interventions. The term "value" obscures crucial distinctions between observed choice, cardinal welfare, and ethical weighting. Moving towards a more coherent framework requires either embracing the full implications of welfarist utilitarianism (and resolving the nudge paradox), or explicitly acknowledging its limitations and adopting alternative decision-making paradigms that incorporate plural values and ethical judgments.

  **Recommendation:** A follow-up discussion on the ethical and practical implications of these findings, particularly regarding the tension between behavioral insights work and appraisal methodology, and the status of non-market goods and distributional impacts, would be valuable.
