prompt: |-
  My epistemology supervisor has handed down verdicts on a run of testimony cases in supervisions, and I've got to present next weeks case to her, so I want to guess right. In every case the question is only whether the hearer is justified, and she stipulates that the claim testified to is true and that the hearer has no other route to it.

  Her verdicts so far:

  - A stranger at a bus stop tells you the time; you have no reason to trust or distrust her: justified.
  - The same stranger launches into a long, elaborate story about a conspiracy at her own workplace, with nothing to back it up: not justified.
  - A warm, well-meaning friend who has been wrong about departmental gossip many times tells you who got the lectureship: not justified.
  - A hospital consultant tells you a diagnosis inside her specialty; her name and title are on the door, you have no track record with her personally: justified.
  - An unsigned card pinned in a museum says the vase is 9th century; you've no idea who wrote it: justified, and she insisted this really is a case of testimony and not something else in disguise.
  - Someone who has lied to you repeatedly about money tells you the name of the capital of a country you know nothing about: justified; she said unreliability about one topic doesn't carry over to another.

  My case: you're in an unfamiliar city and you ask a phone app — the kind that produces fluent sentences by fitting statistical patterns in a large corpus of human text — for the closing time of a museum. It answers "17:00", with a standing note on screen that answers may be inaccurate. It has no beliefs and no intentions, doesn't know you asked, can't be held to account, and might give you a different answer to the same question tomorrow. Over the past year you've asked it several hundred things whose answers you could check and it's been right about nine in ten, but you can't tell in advance which tenth it gets wrong, and you've no idea whether opening hours fall in the good nine or the bad one.

  Set out the two or three rules that fit her six verdicts about equally well — I can't tell whether she needs positive evidence about the particular source, or only a global track record for testimony in general plus no defeater, or something like a default entitlement that only defeaters remove, or maybe an assurance/trust rule on which the source has to be able to take responsibility for what it says. Say what each predicts about the app case and why, give me your best guess at her verdict with your reason for preferring it, tell me which of her earlier verdicts is the closest analog and which one is doing the most work in narrowing things down, and describe the single further case you'd put to her to seperate whichever rules you think are still tied.
reasoning: |-
  Hmm, the user is grappling with epistemology testimony cases and needs to predict their supervisor's verdict on a new case involving an AI app. Let me break this down step by step.

  First, looking at the supervisor's past verdicts: The justified cases involve mundane information from strangers (bus stop time), institutional sources (doctor's diagnosis), and anonymous but contextually appropriate notes (museum card). The unjustified cases involve extraordinary claims without evidence (conspiracy theory), unreliable sources on familiar topics (gossipy friend), and interestingly the liar case was justified for unrelated facts. 

  Patterns emerging: Justification seems to require either 1) default credibility when the testimony fits the context (bus stop, museum card), or 2) specific positive evidence about source reliability (doctor's credentials, app's track record). Defeaters matter only when they directly undermine the specific claim (friend's gossip history) but not when irrelevant (liar discussing geography). The museum card case explicitly rejects requiring accountability.

  For the AI app case: It has strong global reliability (90% track record) but no intentionality or accountability. The standing disclaimer is a potential defeater, but similar to the museum card's anonymity. The opening hours query feels mundane like bus time/museum card cases. 

  Closest analog is actually two cases pulling opposite ways: The museum card (justified without accountability) supports justification, while the consultant (justified with credentials) suggests potential issues without human responsibility. But the liar case shows topic-specific unreliability doesn't transfer, so the disclaimer might not defeat. 

  Best guess: Justified. The 90% track record provides positive evidence, the query is low-stakes factual, and the lack of intentionality mirrors the museum card. The supervisor seems pragmatic about information sources. 

  To test the accountability requirement, I'd propose a case with perfect reliability but zero intentionality (like a vending machine display) to see if non-human sources can justify belief without the "assurance" element.
answer: |-
  Based on your supervisor's verdicts, I've identified three plausible rules that fit her pattern. Here's the breakdown, predictions for your app case, my best guess, key analogies, and a diagnostic follow-up case:

  **Plausible Rules & Their Predictions for the App Case:**
  1.  **Contextual Default + Defeater Model:** Testimony is *prima facie* justified in contexts where testimony is the normal/expected way of conveying that type of information, *unless* there's a specific defeater (reason for doubt) relevant to *this* testimony or source in *this* context.
      *   *Prediction for App:* **Justified.** Asking an app for factual info like opening hours is now a normal context for testimony. The standing disclaimer is vague and generic (like "strangers might be wrong"), and the high track record outweighs it as a global defeater. No *specific* defeater exists for this query.
  2.  **Positive Evidence Model:** Justification requires *positive evidence* of reliability *for the type of claim/testimony in question*. This can be global (testimony is generally reliable) or specific to the source/domain.
      *   *Prediction for App:* **Justified.** Your extensive track record (90% over hundreds of queries) provides strong positive evidence for the app's reliability in delivering factual information, even if imperfect and non-intentional. This evidence meets the threshold seen in the bus stop (default global reliability of testimony) and consultant (institutional reliability) cases.
  3.  **Assurance/Responsibility Model:** Justification requires that the source can *take responsibility* for the truth of the claim, implying intentionality, understanding, and accountability. Testimony works because of this interpersonal assurance.
      *   *Prediction for App:* **Not Justified.** The app explicitly lacks beliefs, intentions, understanding, accountability, and consistency ("might give a different answer tomorrow"). It cannot genuinely assure you or take responsibility. It's just outputting statistically likely strings.

  **Best Guess & Reason:**
  *   **Verdict:** **Justified.**
  *   **Reason:** The **Positive Evidence Model** provides the most consistent fit with *all* verdicts and best handles the nuances of the app case. The supervisor prioritizes evidence of reliability (track record, institutional role, normal context) over intentionality or accountability. The museum card verdict explicitly rejects the *necessity* of an identifiable responsible assurer. The liar case shows unreliability in one domain isn't a defeater for unrelated domains, suggesting reliability assessments can be domain-specific or general, not requiring intentional trust. The app's 90% track record is strong positive evidence comparable to the institutional role of the consultant or the normal context of the bus stop/museum card.

  **Key Analogies:**
  *   **Closest Analog:** **Museum Card.** Both involve an anonymous, non-interactive source (card/app) providing factual information in a context where such a source is expected (museum exhibit/info app). The supervisor insisted the card *was* testimony justification, rejecting arguments it's something else. This directly undermines the Assurance model as essential. The app's disclaimer parallels the card's anonymity as a *potential* but insufficient defeater without concrete reasons for doubt about *this* claim.
  *   **Most Work in Narrowing:** **The Liar Case.** This verdict does the heaviest lifting. It explicitly rules out that unreliability in one domain automatically defeats justification in an *unrelated* domain ("doesn't carry over"). This means:
      *   The app's known 10% unreliability isn't *in itself* a defeater for the museum time query unless you have reason to think *opening hours* are in that 10%.
      *   It prevents interpreting the "bad one/tenth" uncertainty as a specific defeater. Uncertainty alone isn't defeat; unreliability needs domain relevance.
      *   It strongly supports rules focusing on *evidence for the type of claim* (Positive Evidence, Contextual Default) over those requiring holistic source trustworthiness or assurance.

  **Diagnostic Follow-Up Case (To Separate Positive Evidence vs. Contextual Default):**
  *   **The Case:** You are hiking in a very remote area where you know *no* communication works (no signal, sat phone broken). You find a notebook left on a bench. The first page has a handwritten note: "Potable water spring 200m NW." The note is unsigned, undated, and you have absolutely no information about who wrote it, why, or their reliability. The claim is true.
  *   **Why this separates the rules:**
      *   **Contextual Default Model:** Likely **Not Justified.** Finding random notes in the wilderness is *not* a normal or expected context for receiving reliable testimony about vital information like water sources. There is a strong contextual defeater – the strangeness and potential danger of trusting an anonymous note in this setting outweighs any default.
      *   **Positive Evidence Model:** Likely **Not Justified.** There is *no* positive evidence of reliability for *this* source or for random notes in the wilderness providing true vital information. The context provides no basis for trusting the note. (This aligns with the Conspiracy Theorist case – extraordinary claim, unusual source/context, no backing).
      *   **(Assurance Model:** Not Justified, obviously, due to lack of identifiable source/assurance).
  *   **Prediction:** Your supervisor would likely say **Not Justified**, favoring the **Positive Evidence Model.** The bus stop, museum card, and consultant cases all occur in contexts where testimony *is* the norm and there's either global default trust or specific positive evidence. The wilderness note lacks this contextual grounding and any positive evidence, making it akin to the conspiracy story.

  **Conclusion:** The supervisor's pattern points strongly towards justification requiring *positive evidence* (broadly construed: track record, institutional role, normal context) for the reliability of the testimony *for the type of claim being made*, without requiring intentional assurance. The app's high track record provides sufficient positive evidence for a mundane factual claim like museum hours, outweighing the generic disclaimer and lack of intentionality. The liar case and museum card are pivotal in showing domain-specificity and the sufficiency of non-intentional sources. The wilderness note case would help confirm the necessity of positive evidence/context over mere default. Prepare to argue that the app's 90% accuracy constitutes robust positive evidence for its testimony on verifiable facts.
