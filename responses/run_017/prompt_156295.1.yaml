answer: |-
  Here’s a focused, committee-friendly research proposal outline centered on your hybrid case insight. It avoids citations, emphasizes stakes, and clarifies the core question. Total length: ~2 pages.

  ---

  **Research Proposal: When Counterfactual Payoffs and Evidence Collide**  
  **A Decision-Theoretic Investigation of Hybrid Cases**

  **1. Core Question & Stakes (The "Why This Matters" Elevator Pitch)**  
  Decision theory aims to prescribe rational choices in uncertain, interdependent scenarios. Foundational thought experiments like **Counterfactual Mugging (CM)** and **XOR Blackmail (XB)** generate conflicting intuitions:  
  - *CM*: Paying $100 seems rational (aligns with FDT, UDT). Refusing leaves "free money" on the table in the counterfactual.  
  - *XB*: Refusing payment seems rational (aligns with CDT, some FDT). Paying makes you a "sucker" for blackmail.  

  *The Puzzle*: Both cases rely on "what my decision algorithm *would do* in an unactualized scenario." But *how* this counterfactual matters differs critically:  
  - **In CM**, the counterfactual output *constitutes the payoff* (you get $10k iff you’re a "payer").  
  - **In XB**, the counterfactual output *determines your evidence* (you receive the letter iff you’re a "payer").  

  *The Gap*: Existing theories treat these mechanisms separately. No framework rigorously examines what happens when **both mechanisms operate simultaneously on the *same* decision**, potentially pulling in opposite directions. This project asks:  
  > **"When a single act simultaneously (a) triggers a counterfactual payoff *and* (b) screens off evidence about the world, which effect dominates rational choice—and under what conditions does this dominance break?"**  

  *Why It Matters to Anyone*:  
  - **To Philosophy/Decision Theory**: Resolves foundational tensions in rational choice. Shows whether CM/XB verdicts rely on hidden, incompatible assumptions. Challenges theories claiming "one true solution."  
  - **To Economics/CS (AI Safety)**: Models scenarios where actions signal information *and* bind future/counterfactual payoffs (e.g., reputation systems, commitment devices, correlated equilibria). Reveals fragility in "ideal agent" models.  
  - **To the Committee**: This isn’t just puzzle-solving. It tests whether rationality is *unified* across counterfactual dependence types. If theories fracture here, it implies deep constraints on prescriptive decision theory.

  **2. The Hybrid Case: A Tool to Pry Mechanisms Apart**  
  I will construct a parametrized scenario merging CM and XB:  
  - A Predictor (accuracy *p*) flips a biased coin (Pr(Heads) = *q*).  
  - **IF Heads**: You are asked to pay $X.  
  - **IF Tails**: Two things happen:  
    (i) *Counterfactual Payoff*: $Y is given to a *Beneficiary* (your copy/stranger/same algorithm) iff you would pay if Heads.  
    (ii) *Evidence Screening*: You learn the coin outcome *only if* you would pay if Heads.  

  **Key Parameters to Vary**:  
  - `Predictor Accuracy (p)`: Does evidence-screening lose force before payoff-binding as *p* < 1?  
  - `Beneficiary Identity`: You-copy? Same-algorithm stranger? Unrelated stranger? Tests if payoffs require "identity continuity."  
  - `Stakes (X/Y/q)`: Do verdicts flip under extreme values?  

  *Why This Forces a Conflict*:  
  - Paying $X secures the counterfactual $Y payoff (like CM) *BUT* also implies you *only* learned about Heads because you’re a payer (like XB).  
  - Refusing sacrifices $Y (bad per CM) *BUT* implies your evidence is untrustworthy (good per XB).  

  **3. Why Existing Theories Leave This Open**  
  - **Causal Decision Theory (CDT)**: Always refuses (ignores counterfactual payoffs & evidence screening). *Cannot engage the conflict*.  
  - **Evidential Decision Theory (EDT)**: Pays in CM (good news: correlates with $10k). Refuses in XB (bad news: correlates with termites). *In hybrid, it depends on exact probabilities—but cannot formally separate the two mechanisms*.  
  - **Functional Decision Theory (FDT)/Updatelessness (UDT)**: Pays in CM (binds algorithm to get $10k). Refuses in XB (avoids algorithm being blackmailed). *Crucially, these are different "binding" justifications*. FDT/UDT lacks tools to adjudicate when one binding goal overrides the other. **This is the critical gap:** FDT treats "algorithmic commitment" monolithically, but CM and XB commit for *different reasons*.  

  **4. Methodology & Timeline (1 Year, Teaching Load Aware)**  
  - **Months 1–2**: Formalize the hybrid case. Define parameter ranges (p, q, X, Y, Beneficiary).  
  - **Months 3–4**: Map existing theories’ prescriptions across parameters. Identify "tension zones" where mechanisms conflict strongly.  
  - **Months 5–6**: Analyze *why* theories break: Is it the beneficiary’s identity? Predictor fallibility? Payoff structure?  
  - **Months 7–8**: Develop diagnostic principles: When does payoff-binding dominate evidence-screening? (e.g., high p? Beneficiary = algorithm-self?).  
  - **Months 9–10**: Test robustness: Vary informational assumptions, add precommitments, explore multiple agents.  
  - **Months 11–12**: Draft chapter. Synthesize implications for rationality, cooperation, and anthropics.  

  *Feasibility*: Focused on conceptual analysis and parameter variation—minimal new formalism. Monthly milestones buffer teaching obligations. Builds on your existing chapter draft.

  **5. Possible Conclusions & Deciding Factors**  
  - **Conclusion A (FDT Fragmented)**: The "algorithmic commitment" justifying CM and XB is not unitary. Payoff-binding requires continuity (e.g., copy/algorithm-self); evidence-screening works for strangers. *Decider*: If beneficiary variation flips verdicts while predictor accuracy does not.  
  - **Conclusion B (EDT Resurgent)**: Evidence effects dominate when predictors are fallible; payoff effects dominate under perfection. *Decider*: If lowering *p* flips the verdict from "pay" to "refuse."  
  - **Conclusion C (New Principle Needed)**: Rationality requires explicitly weighting two distinct counterfactual dependencies. *Decider*: If no existing theory handles the full parameter space coherently.  
  - **Conclusion D (CDT Vindicated?)**: Counterfactual payoffs to non-actual agents aren’t reasons; refuse always. *Decider*: If varying beneficiary/accuracy fails to make paying robustly rational.  

  **6. What Counts as Failure?**  
  - **Project Fails** if:  
    (a) The hybrid case cannot generate robust tension (mechanisms don’t conflict meaningfully).  
    (b) All plausible theories converge on one answer across parameters (no illumination gained).  
    (c) The beneficiary variation proves irrelevant (paying strangers is always irrational/always rational).  
  - **Project Succeeds** if it shows:  
    (a) Standard verdicts for CM/XB rely on suppressing one mechanism.  
    (b) Rationality demands new distinctions in handling counterfactuals.  

  **7. Is This Two Projects?**  
  **No—it’s one integrated project.** The beneficiary variation (*is a payoff to a non-actual copy/stranger a reason?*) is **essential** to testing whether payoff-binding is fundamentally different from evidence-screening. If paying a stranger seems irrational while paying your copy seems rational, it shows CM-style reasoning is *not* about abstract algorithm-optimization, but about self-continuity. That directly answers your core question. *Save the meta-ethics of counterfactual reasons for the dissertation’s broader implications section.*

  **Strength of this framing**: It isolates *one* high-stakes question (how do conflicting counterfactual dependencies interact?), uses a *novel tool* (the hybrid case) to force the issue, and tests theories against *tunable parameters*. It promises concrete, delimitable results that challenge mainstream positions.
