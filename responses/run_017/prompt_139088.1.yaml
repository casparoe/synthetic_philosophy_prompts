prompt: |-
  I'm a journalist — I write mostly about science and ideas, which means I spend a lot of my week doing a very boring thing: taking some source's account, pulling out the bits that can be checked against documents or data or a third party, and checking them. I recently fell into reading about how historians do the same thing for material that's two and a half thousand years old (Herodotus happily passing along what he was told, Thucydides being fussy about provenance, that whole tradition of source criticism), and it made me notice a pattern in my own work that I don't have a word for.

  Here's the pattern. A source's account mixes claims of two very different kinds. Some are auditable: dates, distances, serial numbers, who was in the room, what the weather did, which lab the sample went to. Others are structurally unauditable: what someone was thinking, what got said in a meeting of three people who all have an interest in the story, what the other side was planning. I check the auditable ones and they come back clean — often impressively clean, dozens of them — and I can feel my confidence in the unauditable ones go up, and my readers' confidence go up much more than mine does. Nothing about a clean set of dates bears on whether this person's account of the private meeting is true, and yet the credibility obviously travels. And there's a quiet reverse version: a source who is demonstrably wrong about one checkable detail gets treated as unreliable about everything, even when the error is the kind that a typo or a garbled secondhand report explains perfectly well.

  There's a second version that I think might be the same animal. Some sources flag their own weak spots — I couldn't confirm this part, this bit is hearsay — and the flag reads as honesty and raises my estimate of the rest of what they say. But that feels buyable: a source could cheaply sprinkle in a couple of flagged or slightly self-damaging details and come out ahead overall. It reminds me of the criterion-of-embarrassment move my classicist friend described, where a detail that's inconvenient for the author is treated as likely genuine, except that there the flag is supposed to authenticate the flagged claim and here it seems to authenticate everything else.

  People I've asked have gestured at the halo effect and at something called truth-default theory, but both feel too blunt: the halo effect doesn't have this crossing-of-claim-types structure, and truth-default theory seems to say we believe first and don't need the audited details at all, whereas in my case the audited details are definately doing real work. So: does this have a name, or a literature? Are the two versions one thing or two? I'm after the carving more than the label — what exactly the phenomenon is, where the legitimate inference from gets-the-small-stuff-right ends and the leak begins, what the boundary cases are (random errors versus systematic ones, vivid checkable detail versus dull checkable detail, a source who is right about the small stuff because they're careful versus because they simply had access), and whether there's anything a working journalist ought to do differently once they know about it. If there's no established term, coin one and define it sharply enough that I could tell an instance from a non-instance.
reasoning: |-
  Okay, the user is a science journalist who's noticed a pattern in their work where sources mix auditable and unauditable claims. When auditable claims check out, confidence in the unauditable ones increases, even though logically they're unrelated. They also mention a reverse effect where one error makes the whole account seem unreliable. Plus, there's a similar pattern with sources flagging weak spots, which boosts their credibility overall. They want to know if there's a name for this, whether the two versions are connected, and how to handle it practically.

  First, I need to identify the core issue. The journalist is describing a cognitive bias where credibility transfers from verifiable details to unverifiable ones. The halo effect and truth-default theory were mentioned but don't fit perfectly. The halo effect is too broad, applying to overall impressions affecting specific traits, not crossing claim types. Truth-default theory is about initial belief without evidence, whereas here, the audited details actively build credibility.

  The key elements are:
  1. **Credibility Transfer**: Auditable claims (dates, facts) validating unauditable ones (thoughts, private meetings).
  2. **Asymmetry**: One error taints the entire account.
  3. **Self-Flagging**: Admitting uncertainties boosts overall credibility, possibly manipulatively.

  I recall concepts like the "halo effect" but that's more about general traits influencing perception. "Source Credibility Heuristic" comes to mind, but it might not be specific enough. The "Detail-Orientation Bias" or "Verifiable Scaffolding Effect" could work as new terms. But maybe there's existing literature. 

  Cognitive psychology has the "congruence bias" where people over-rely on direct testing. Here, checking auditable details creates a false sense of security for unauditable claims. Also, the "representativeness heuristic" might play a role—if a source is accurate on specifics, they seem representative of a reliable source overall. 

  The two versions (auditable validation and self-flagging) might be linked under "Epistemic Commitment Signals." Self-flagging shows honesty, making other claims seem more credible. But there's a risk of strategic behavior where sources add minor flaws to appear authentic.

  For practical advice, the journalist should:
  - **Compartmentalize Evaluation**: Treat auditable and unauditable claims separately. Use verified facts to assess access and precision but not subjective claims.
  - **Error Analysis**: Differentiate between random errors (typos) and systematic ones (pattern of inaccuracies). The latter should raise red flags.
  - **Contextualize Self-Flagging**: Assess whether admissions of uncertainty are genuine or strategic. Cross-check with other sources.
  - **Boundary Cases**: Vivid details might enhance credibility more than dull ones due to the "vividness effect." Access vs. carefulness—access might not imply truthfulness for unauditable claims.

  The literature might include works on source credibility in journalism, cognitive biases in historiography, or epistemology. Scholars like Tversky and Kahneman on heuristics, or Walton on argumentation schemes, could be relevant. Terms like "argument from consistency" or "credibility contagion" might exist in specific fields.

  Ultimately, coining a term like "Epistemic Contagion" or "Verifiable Scaffolding Effect" could help. Defining it clearly: when verified auditable claims in a source's account increase perceived credibility of unauditable claims, despite no logical connection, due to cognitive biases.

  The user's deeper needs include improving their reporting rigor, educating readers on credibility limits, and avoiding manipulation by sources. They might also want academic references to back their observations or methodologies to mitigate these biases.
answer: |-
  This is a brilliantly observed and deeply important epistemic phenomenon in source evaluation. You've identified a genuine gap in how we discuss credibility assessment, one straddling journalism, historiography, and cognitive psychology. While no single established term perfectly captures *all* facets of what you describe, the phenomenon itself is well-recognized in parts of the literature, and we can carve it precisely.

  **The Core Phenomenon & Its Name(s):**

  The core mechanism is **Credibility Transfer via Verifiable Scaffolding (CTVS)**. Let's define it:

  > **Credibility Transfer via Verifiable Scaffolding (CTVS)** is a cognitive bias and persuasive tactic where the demonstrated accuracy or perceived honesty of an informant regarding *verifiable, auditable details* (the "scaffolding") inappropriately increases the perceived credibility of *unverifiable, unauditable claims* presented alongside them, despite the lack of a logical connection. This transfer is asymmetric and potent, often applying wholesale negative effects from isolated errors in the scaffolding. A related mechanism involves *self-flagging* of uncertainties or weaknesses, which acts as a secondary signal of honesty, further amplifying the transfer effect to the surrounding claims.

  **Why existing terms fall short:**

  1.  **Halo Effect:** Captures the *spillover* but lacks the crucial structure: the deliberate or organic *mixing* of fundamentally different claim types (auditable vs. unauditable) and the specific reliance on the *verification act* itself. The halo is too diffuse.
  2.  **Truth-Default Theory (TDT):** Explains initial acceptance but doesn't address the *reinforcement* provided by verified details or the *structured exploitation* of mixing claim types. TDT is about baseline trust; CTVS is about *enhancing* trust illogically through scaffolding.
  3.  **Criterion of Embarrassment:** Authenticates the *specific* flagged claim due to its cost. In your case, self-flagging primarily authenticates *other* claims, acting as a general honesty signal rather than authenticating the inconvenient fact itself.

  **Carving the Phenomenon: Components, Boundaries, & Legitimacy**

  1.  **The Scaffolding & The Core:**
      *   **Scaffolding:** Auditable claims (dates, locations, sequences, observable events, verifiable data points). Their function is to be *checked*.
      *   **Core:** Unauditable claims (internal states, private conversations without records, intentions, interpretations, hearsay). Their credibility is inherently uncertain.
      *   **The Transfer Mechanism:** Verification of scaffolding triggers cognitive heuristics:
          *   **Representativeness Heuristic:** "Someone this accurate on specifics *must be* generally accurate/reliable."
          *   **Effort Heuristic (Lesser-known):** "They invested effort in getting the details right, so they likely invested effort in getting the core right." (Even if the core *can't* be gotten "right" in the same way).
          *   **Source Credibility Heuristic:** Verification boosts perceived expertise and trustworthiness, which then bleeds onto all their statements.
          *   **Illusory Pattern Recognition:** The clean scaffolding creates a coherent narrative framework, making the core claims *feel* more plausible within that structure ("It all fits").

  2.  **Legitimate Inference vs. Leaky Transfer:**
      *   **Legitimate:**
          *   **Access & Precision:** Clean scaffolding demonstrates the source *had access* to accurate information and is *precise* in their reporting of observable facts. This *can* support the *plausibility* that they were *present* for related unauditable events. (e.g., Correctly reporting the room, time, and attendees of a meeting lends *some* weight to them being *in* that meeting when the private conversation happened).
          *   **Patterns of Honesty/Competence:** A *consistent pattern* of accuracy across *many* diverse auditable details over time builds general source credibility, making their *interpretations* (a type of unauditable claim) worth considering seriously, though not accepting uncritically.
      *   **The Leak (Illegitimate Transfer):**
          *   **Content Leap:** Assuming accuracy on auditable details *X, Y, Z* implies accuracy on unauditable claim *A* about motives or private words, simply because they are presented together. This is the core fallacy.
          *   **The Reverse Halo (Horns Effect):** A single error (or self-serving flag) in scaffolding taints the entire core, ignoring context (typo, minor misremembering) or the possibility of accurate reporting on other *types* of information.
          *   **Neglecting Claim-Type Specificity:** Failing to recognize that competence in reporting facts does not equate to reliability in reporting interpretations, feelings, or uncorroborated conversations.

  3.  **Boundary Cases & Nuances:**
      *   **Random Error vs. Systematic Error:** A single, explainable error (e.g., transposed date) *should* minimally impact overall credibility assessment if isolated. Systematic errors (multiple wrong dates, inconsistent sequences) *do* legitimately damage credibility across the board, indicating poor recall, fabrication, or unreliable access.
      *   **Vivid vs. Dull Scaffolding:** Vivid, specific details ("The lab fridge hummed at 42 dB, the sample vial had a tiny chip on the lip") are *more potent* as scaffolding than generic ones ("The lab was cold, the sample vial was normal"). Vividness enhances perceived authenticity and memorability, strengthening the transfer effect disproportionately. (Related to the "Vividness Effect").
      *   **Careful vs. Merely Accessible:** A source getting details right *because they are meticulous* offers *some* legitimate inference for unauditable claims (they are likely trying hard to be accurate). A source getting details right *solely because they had access* (e.g., an admin with records) offers *no* legitimate inference about unauditable claims (e.g., the CEO's private thoughts). Distinguishing motive is key.
      *   **Self-Flagging: Genuine vs. Strategic:** Genuine self-flagging ("I didn't see that email," "This is what Bob *told me* he felt") signals metacognition and honesty, legitimately boosting credibility *if* the flags are substantive and plausible. Strategic flagging (minor, inconsequential, or easily explainable "admissions") is cheap signaling designed to exploit the transfer effect. Look for cost: does the flag *actually* damage their position or narrative significantly?

  **The Two Versions: One Beast?**

  Your two versions are closely related manifestations of CTVS:

  1.  **Verified Scaffolding Transfer:** Accuracy on auditable claims transfers credibility to unauditable claims.
  2.  **Self-Flagging Transfer:** Voluntarily admitting weaknesses (a form of perceived honesty regarding the scaffolding *process* or *scope*) transfers credibility to the *rest* of the claims (both auditable and unauditable, but especially the unauditable core).

  Both exploit the same cognitive mechanisms (representativeness, source credibility heuristics) and involve using signals related to *one type* of claim or process (verifiable facts, admission of limits) to bolster the credibility of *another type* (unverifiable claims). Self-flagging acts as a *meta-scaffolding* signal about the source's honesty, which then enhances the perceived reliability of the entire narrative structure they present.

  **What Should a Journalist Do Differently?**

  1.  **Consciously Compartmentalize:** Explicitly separate claims into "Scaffolding" (Auditable) and "Core" (Unauditable) mentally and in your notes. Assess them *independently* first. Use a physical or digital two-column system.
  2.  **Interrogate the Scaffolding's Relevance:** For *each* Core claim, ask: "What does the verified scaffolding *actually tell me* about the *plausibility* or *source's access* regarding *this specific* unauditable claim?" Does it only show they were present? Or does it logically connect?
  3.  **Demand Corroboration for the Core:** Never let clean scaffolding *replace* corroboration for unauditable claims. Seek:
      *   **Multiple Independent Sources:** For private meetings/conversations, aim for at least 2 (preferably 3) independent participants confirming the *gist*.
      *   **Documentary Traces:** Emails before/after hinting at topics, calendars showing the meeting occurred, subsequent actions aligning with claimed outcomes.
      *   **Expert Assessment:** Does the claimed internal state/intention align with known psychology or typical behavior in that context? (Use cautiously).
  4.  **Analyze Errors Rigorously:** Don't dismiss errors, but don't catastrophize them. Classify:
      *   **Type:** Factual error (date/wrong), Interpretive error (spin/misemphasis), Omission.
      *   **Severity:** Central vs. peripheral detail.
      *   **Plausible Cause:** Typo, memory glitch (common for sequences/dates), misunderstanding, deliberate fabrication?
      *   **Pattern:** Isolated or systemic?
  5.  **Scrutinize Self-Flagging:** Ask:
      *   **Cost:** Does this admission *genuinely* weaken their story or credibility?
      *   **Substance:** Is it a significant gap or a trivial one?
      *   **Plausibility:** Does the flagged limitation make sense?
      *   **Pattern:** Is this part of a consistent pattern of transparency, or an isolated, perhaps strategic, gesture?
  6.  **Educate Your Readers (Subtly):** Structure your writing to reflect the distinction:
      *   "While the timeline of events provided by Source A was corroborated by documents and other witnesses, their description of the private motivations behind those events remains based solely on their account."
      *   "Source B accurately recalled specific details about the equipment used, but their characterization of the internal debate relies on their own perspective."
  7.  **Beware the "Too Clean" Scaffolding:** An excessive number of hyper-specific, perfectly verified minor details can sometimes be a red flag for a rehearsed or fabricated narrative (though genuine meticulous sources exist!). Balance is key.

  **Literature Touchstones:**

  While CTVS isn't a single unified theory, these areas provide relevant insights:

  *   **Historiography/Source Criticism:** Leopold von Ranke's emphasis on primary sources, Marc Bloch's *The Historian's Craft* (on criticism), methodologies for evaluating ancient sources (like Bart Ehrman's work).
  *   **Cognitive Psychology:** Tversky & Kahneman (Heuristics & Biases - Representativeness, Availability), Daniel Gilbert (believing first, doubting second - though nuanced), research on Source Credibility (Hovland et al. foundations, more recent work in communication).
  *   **Epistemology/Argumentation:** Stephen Toulmin's model of argument (Data vs. Warrant/Backing), Douglas Walton's argumentation schemes (e.g., Argument from Position to Know, Argument from Witness Testimony - and their associated critical questions).
  *   **Journalism Studies:** Work on verification (Kovach & Rosenstiel's *The Elements of Journalism*), source motivation, cognitive biases in reporting.
  *   **Deception Detection:** Research on "truthfulness cues" (like self-correction or admitting lack of knowledge) and how they can be mimicked.

  **In essence:** You've identified the potent and often illogical **Credibility Transfer via Verifiable Scaffolding (CTVS)**. The key for a journalist is to *use* the scaffolding to assess access, precision, and potential honesty signals, but to *strictly quarantine* that assessment from the inherently unauditable core claims, which demand independent corroboration strategies and a clear acknowledgment of their epistemological limits. By consciously deconstructing this transfer mechanism, you inoculate yourself and your readers against its most misleading effects.
