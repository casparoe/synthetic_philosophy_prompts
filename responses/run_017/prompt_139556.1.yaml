answer: |-
  You've articulated a profound and pervasive problem in historical reconstruction with remarkable clarity. What you're describing **isn't just source bias or incompleteness; it's a specific structural distortion inherent in institutional record-creation.** The established concept that best captures this phenomenon is:

  **Institutional Capture (of the Historical Record)**

  **Definition:** Institutional capture occurs when the most detailed, voluminous, and accessible records documenting marginalized or vulnerable populations are generated *by* and *for* institutions exercising power over them (e.g., welfare systems, law enforcement, courts, prisons, hospitals, asylums). This creates a historical record where:
  1.  **Detail & Volume:** The richest data exists precisely at moments of institutional intervention (admission, arrest, investigation, punishment, regulation).
  2.  **Perspective:** The narrative is framed entirely by the institution's perspective, purposes, and categories (administrative, punitive, diagnostic).
  3.  **Subjectivity:** Individuals appear primarily as *objects* of institutional action ("being processed") rather than autonomous agents living their lives.
  4.  **Distortion-Completeness Link:** The very factors that make the record "thick" (the institution's need to document its actions, justify decisions, exert control) are the *same factors* that fundamentally distort the lived reality and agency of the subjects documented. You cannot separate the detail from the distortion; they are co-produced.

  **Why "Institutional Capture" Fits:**
  *   **Focuses on the Generator:** It highlights the *source* of the thick record (the institution) and its inherent power dynamic.
  *   **Explains the "Inversion":** It directly addresses why the most detailed moments are also the moments of maximum distortion – the record exists *because* of the intervention.
  *   **Captures the Link:** It names the inseparable connection between institutional purpose, record creation, and the resulting skewed representation.

  **Distinguishing It from Neighboring Concepts:**

  1.  **Source Bias / Hostility:** This is broader. *All* sources have bias. Institutional capture is a *specific type* of bias where the bias is *structurally linked to the creation of the most detailed records* about vulnerable groups. A hostile newspaper article is biased, but it's not necessarily the *only* or *most detailed* record of the subject. Institutional capture often *is*.
  2.  **Archival Silences / Missing Voices (Trouillot):** This focuses on absences. Institutional capture is about problematic *presences*. It’s the *loud, detailed voice* of the institution drowning out or defining the quieter, fragmented voices of the marginalized. Silences exist *around* these captured records.
  3.  **Surveillance Records:** Surveillance is often a *method* used by institutions that *leads* to capture. But capture is broader: an almshouse admission isn't primarily surveillance, it's administrative processing. A hospital record is diagnostic/therapeutic, not surveillance, but can still be captured.
  4.  **Epistemic Injustice / Violence (Fricker, Spivak):** These are the *consequences* and ethical dimensions. Institutional capture is a primary *mechanism* through which epistemic violence occurs – the institution's perspective is systematically privileged as the authoritative knowledge.
  5.  **Archival Violence (Caswell, Cifor):** This focuses on the harm done *by* archives/records. Institutional capture describes *how* those violent or distorting records come to dominate the source base in the first place.

  **Edge Cases & Nuances: What It Is and Isn't:**

  *   **Hospital Logging a Midwife's Work (Different Purpose)?** **YES, this is likely Institutional Capture.** The hospital creates the detailed record for *its* purposes (accountability, legal protection, medical history). The midwife and patient are documented as subjects of the hospital's system, framed by its medical categories and administrative needs. Their agency and perspective outside this encounter are absent.
  *   **Deliberate Community Collection (e.g., LGBTQ+ archive)?** **NO, this is NOT Institutional Capture... BUT it has its own distortions.** Here, the record *escapes* capture by external power institutions. The distortion shifts:
      *   *Distortion Type:* Now the bias is towards self-representation, curation for future memory, community building, potentially sanitizing internal conflicts or marginalizing subgroups *within* the community.
      *   *Key Difference:* The subjects are *authors* or *collaborators*, not just objects. Agency is central, even if selectively presented. The "thickness" comes from self-documentation, not external control. This is a crucial *alternative* source precisely because it avoids institutional capture.
  *   **A Thick Self-Authored Diary?** **NO, this is the CLEAN OPPOSITE of Institutional Capture.** A diary is the ultimate record of individual agency and interiority, created for the self. Its "thickness" reflects the diarist's own priorities and perspective. While it has biases (self-censorship, limited viewpoint), it's not framed by an external institution's power or categories. It's a vital tool *against* capture.
  *   **Census Records?** **YES and NO (Ambiguous Edge Case).**
      *   *Capture Elements:* Created by the state (powerful institution), for administrative/control purposes (taxation, conscription, social planning), imposes external categories, individuals are objects of enumeration.
      *   *Non-Capture Elements:* Records *all* residents (in theory), not just those at moments of crisis/intervention; the "processing" is minimal (answering questions); detail is often limited/standardized. It's a snapshot, not just an intervention record.
      *   *Verdict:* Leans towards capture due to institutional framing and purpose, but lacks the intense focus on moments of *active institutional processing* that defines your core examples. It's a different *type* of state record.
  *   **Business Ledgers Detailing Workers?** **POTENTIALLY.** If the ledger primarily documents workers as labor inputs, disciplinary actions, or payroll liabilities (objects of management control), then yes. If it includes worker agency (e.g., notes on independent initiatives, contracts negotiated) or is supplemented by worker-created records, it's less pure capture.
  *   **Internet Scraping (your tangent):** **ABSOLUTELY APPLIES.** Vast datasets often come from platforms (institutions!) that exert control through Terms of Service, algorithmic moderation, data collection for advertising/surveillance (corporate or state). The "thickest" data exists where users interact with the platform's control mechanisms (moderation reports, banned accounts, behavioral tracking). Their online lives are captured through the lens of corporate governance and state surveillance priorities. Alternative, self-documented spaces (like the bar's newsletter) are often fragmented and harder to scrape at scale.

  **The Core Takeaway:**

  **Institutional Capture** names the phenomenon where the historical visibility of marginalized groups is disproportionately mediated through the detailed records created *by* the very institutions that managed, controlled, punished, or categorized them. The richness of the record is inseparable from its distortion. Recognizing this is the first step towards:
  1.  **Critical Source Analysis:** Always asking "*Why does this detailed record exist? Whose power does it serve?*"
  2.  **Seeking Counter-Narratives:** Actively looking for sources that escape capture (diaries, letters, community publications, oral histories, material culture).
  3.  **Triangulation & Humility:** Using captured records *alongside* other sources, acknowledging their inherent limitations, and avoiding replicating the institution's framing as the whole story.
  4.  **Ethical Responsibility:** Understanding the potential harm in perpetuating these institutional perspectives as neutral "facts."

  You've identified a fundamental challenge in doing ethical, representative history. Institutional capture explains why the archive often shouts the voice of power and whispers the voices of the powerless, especially at their most vulnerable moments. Recognizing it is crucial for pushing back against that distortion.
