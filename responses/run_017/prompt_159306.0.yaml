answer: |-
  ## Joint Statement: Computation in Neuroscience - A Collaborative Framework  
  **Agreed Claims (Signed by Both Parties)**  

  1.  **Multi-Model Reality:** The observable input-output behavior and internal dynamics of any physical neural system (e.g., a specific circuit) can be formally described by multiple distinct mathematical/computational models simultaneously. Many of these models will be predictively inert or explanatorily useless. Only models yielding robust predictions, enabling novel interventions, and integrating coherently within broader cognitive and neural frameworks are scientifically valuable.  
  2.  **Success Defines Credibility:** The primary scientific justification for adopting a specific computational model of a neural process is its *empirical success*: its demonstrable power to predict system responses to novel inputs or interventions (e.g., pharmacological, optogenetic, lesion) that were not used to build the model. Intuitions about "what the system is *really* doing" are scientifically relevant only insofar as they lead to such empirically successful models.  
  3.  **Constrained by Wetware:** Any adequate account of neural computation (whether realist or ascriptivist) must be fully compatible with the brain's biological reality: it is a continuous-time, analog (in signal amplitude and often processing), massively parallel, stochastic, noisy, metabolically constrained, and developmentally plastic electrochemical system. Models ignoring these constraints (e.g., idealized discrete-time, noise-free digital computation) are highly unlikely to achieve broad empirical success in explaining real neural phenomena.  
  4.  **Mapping is Essential:** Applying a computational description to a physical system requires specifying a *mapping* (or set of mappings) between physical states/events (e.g., membrane potentials, spike timings, neurotransmitter releases) and the abstract states/symbols defined by the computational formalism. This mapping is a necessary component of applying computational theory to neuroscience.  
  5.  **Indeterminacy of Mapping:** For any given physical neural system and a specific computational formalism, there are typically multiple, formally distinct mappings from physical states to abstract computational states that can be used to "read" the computation from the physical substrate. Not all are scientifically interesting or useful.  

  **Disagreements Table: Core Cruxes**  

  | Crux                                                                                                                               | Computationalist's View (Wording Accepted)                                                                                                                                                          | Ascriptivist's View (Wording Accepted)                                                                                                                                                                    | Shared Test Case / Argument                                                                                                                               | Computationalist Prediction                                                                                                 | Ascriptivist Prediction                                                                                                     |
  | :--------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------- |
  | **1. Intrinsic Function vs. Descriptive Ascription:** Does empirical fit alone, absent identifiable physical implementation of variables, suffice to establish that a system intrinsically performs that specific computation? | "When a computational model provides a uniquely powerful, robust, and predictively accurate account of a neural system's behavior across all relevant interventions, and this success is best explained by the system physically implementing the state transitions defined by the computation (even if the physical *format* isn't isomorphic to our model's variables), then the system intrinsically performs that computation." | "No matter how empirically successful a computational model is, it remains a powerful *description* or *interpretation* we impose via our chosen mapping. Empirical success demonstrates the model's utility for prediction and intervention, not that the computation is an intrinsic, observer-independent property of the physical system." | **Case:** A model M perfectly predicts a circuit's spiking output for all known inputs and interventions. M posits internal variables V1, V2. Exhaustive search finds no identifiable physical substrate (e.g., distinct neural populations, dendritic compartments, molecular states) that cleanly correlates with or implements V1, V2 over time, despite M's predictive success. Does M's success *alone* mean the circuit intrinsically computes M? | **Yes.** The predictive success *is* evidence of implementation, even if the physical realization is complex or distributed. The functional organization captured by M is the intrinsic computation. | **No.** The lack of identifiable physical correlates for V1, V2 shows M is a useful abstraction/description, not a discovered intrinsic computation. Success demonstrates utility, not ontology. |
  | **2. Grain & Analogue Processes:** Can all causally relevant neural processing be captured by *some* computational description at *some* grain, or is essential causal work done by continuous, fine-grained physical details that no implementation-independent computational description preserves? | "All causally relevant aspects of neural processing, including analog and continuous-time dynamics, can be formally described computationally at an appropriate level of abstraction and grain. The 'implementation-independent' core of the computation *is* this abstract functional description, which remains consistent across physical substrates realizing the same input-output function." | "Some neural processes fundamentally rely on continuous, analog physical properties (e.g., precise temporal coincidence detection relying on sub-millisecond differences in propagation delays, analog summation in dendrites). Attempts to describe these processes computationally inherently involve idealization, discretization, or abstraction that omits essential, causally relevant physical details. The 'implementation-independent' description necessarily loses something real and causal." | **Case:** A circuit relies critically on coincidence detection with a temporal window < 0.5ms. Discretizing time steps > 0.5ms in any computational model destroys the model's ability to predict circuit behavior accurately, even if the continuous dynamics are well-characterized. Does this imply the circuit's core function *cannot* be fully captured by an implementation-independent computational description? | **No.** While the *specific* timing is crucial, it defines the functional requirement (e.g., detector for events within window W). A sufficiently fine-grained computational model (e.g., continuous-time recurrent neural nets, hybrid models) *can* capture this functional requirement at an abstract level. | **Yes.** The critical causal factor *is* the precise physical timing itself. Any computational description abstracts away from this physical particularity, replacing it with a discrete or idealized parameter. The physical detail *is* the implementation-independent core in this case. |
  | **3. Explanatory Surplus:** Does labeling a process with a computational description (e.g., "performs Bayesian inference," "calculates reward prediction error") provide genuine explanatory power beyond a detailed mechanistic description of the underlying neural dynamics? | "Identifying the specific computation being performed provides crucial, distinct explanatory power: (1) It reveals the *functional role* within a larger cognitive system. (2) It enables generalization and prediction across diverse implementations (different individuals, species, artificial systems) that perform the *same* computation. (3) It connects neural mechanisms to computational theory, mathematical principles, and cognitive function in a way that purely physical dynamics descriptions cannot." | "The explanatory work is done by the detailed mechanistic model of the neural dynamics. The computational label is a useful shorthand or heuristic summary of *what the mechanism achieves*, but it adds no *causal-explanatory* power beyond the mechanistic account. Generalization occurs based on functional similarity (similar input-output profiles), not because systems share the same abstract computation in any ontologically robust sense." | **Case:** An intervention (e.g., targeted stimulation protocol) successfully modulates a specific cognitive function (e.g., perceptual discrimination threshold) based on a computational model (e.g., normalization model) in Species A. Does the computational description significantly increase the likelihood of successfully transferring *the exact same intervention protocol* to achieve a similar functional modulation in a different individual of Species A, or in a distantly related Species B, compared to relying *only* on a detailed biophysical model of the circuit dynamics in the original subject? | **Yes.** The computational description identifies the relevant functional variable being manipulated. Successfully transferring the intervention hinges on identifying circuits performing the *same computation*, which is more robust across variability than matching precise biophysical details. | **No.** Transfer success depends on identifying circuits with sufficiently similar functional profiles *and* physical susceptibility to the intervention. The computational label may guide the search, but successful transfer is evidence of similar functional mechanisms, not the discovery of a shared universal computation. The biophysical details remain paramount for predicting intervention effects. |

  **Closing: The Verbal Core and What Remains**  

  We agree that a significant portion of our long-standing disagreement is **verbal**, revolving around the definition of "computation" and "implementation":

  *   **The Verbal Core:** The ascriptivist restricts "computation" to mean an abstract, formal, implementation-independent mathematical object. Applying this label to a physical system inherently requires an interpretive mapping chosen by an observer. The computationalist uses "computation" to refer to the objective, intrinsic functional organization of a physical system – the pattern of state transitions that causally govern its input-output behavior – which can be *described* by formal computational models. For the computationalist, "performing computation X" means *having the functional organization that is correctly described by model X when an appropriate mapping is applied*.

  *   **Consequence of Clarification:** If we define "computation" strictly as the abstract formal object (ascriptivist's starting point), then trivially, computation is ascribed, not intrinsic. If we define it as the intrinsic functional organization (computationalist's starting point), then trivially, systems performing that function intrinsically compute. Much heat stems from equivocation on these definitions.

  *   **The Remaining Substantive Disagreement:** Even after clarifying definitions, a core disagreement persists:
      *   The **computationalist** holds that the empirical success of a computational model (especially predictive power across interventions and generalization potential) is best explained by the system *having* that specific intrinsic functional organization (computation-in-the-functional-sense) as a causally efficacious property, somewhat independent of our descriptive choices (though mappings are needed for us to *identify* it).
      *   The **ascriptivist** holds that the empirical success of a computational model demonstrates its utility as a predictive and intervention-guiding tool *relative to our interests and descriptive frameworks*, but does not license the inference to an observer-independent ontological category of "intrinsic computation" over and above the physical dynamics. The functional organization is real, but its description *as a specific computation* is fundamentally perspectival.

  **The core question is ontological:** Does the success of computational cognitive science reveal that brains have intrinsic, observer-independent properties that are *best categorized* as computational (in the functional organization sense), or does it ultimately demonstrate the power of computational *descriptions* as tools, without requiring commitment to computation as a fundamental ontological category in nature? This debate hinges on differing views of explanation, causation, and the relationship between mathematical models and physical reality.
