prompt: |-
  You're a professional philosopher of biology who has also actually sat on institutional biosafety committees, so you know how these designation calls get made in practice. Please think carefully and don't just jump to an answer: start by brainstorming the space of criteria that could generate our track record, then narrow down and commit. And please don't just give me the seven textbook definitions of life and stop there — I've read those, and they all fit all of our precedents, which is exactly my problem.

  I'm on my university's biosafety committee. Among other things we rule on whether a construct counts as a living organism for our containment purposes: whether it needs a validated kill step before anything goes down the drain or out of the building, whether it can leave the containment suite at all, that kind of thing. Over a few years we've built up this track record, with the one-line reasons people actually gave at the time:

  1. Wild-type Bacillus in shaken culture — living. Nobody argued about it.
  2. Bacillus endospores, dried down, no detectable metabolism, germinate fine when you add water decades later — living. "It's dormant, not dead."
  3. Tardigrades in the cryptobiotic tun state — living. Same reasoning as 2.
  4. An attenuated vaccine-strain virus: infects cells, uses the host's ribosomes and polymerases, cannot replicate outside a host — NOT a living organism. "It borrows somebody else's replication machinery."
  5. A prion prep: propagates its misfolded conformation, no nucleic acid, no metabolism of its own — not living.
  6. A minimal synthetic-genome cell — genome chemically synthesized rather than inherited, pared down to a few hundred genes, some of them of unknown function, grows and divides fine in broth on its own — living. People explicitly said the printed-genome part didn't matter next to the fact that it feeds itself and divides.
  7. A cell-free expression system: purified ribosomes, polymerases, tRNAs and an energy-regenerating enzyme set, wrapped in a lipid vesicle, churning out protein off a DNA template we hand it, kept running indefinitely by feeding — NOT living. Reason given: "it never makes another one of itself, and we have to keep reconstituting the enzymes for it."
  8. A self-replicating program in a sandbox with a simulated energy budget — a digital-organism setup that evolved all kinds of tricks over a few hundred thousand generations — NOT living. "Not a chemical system, no metabolism." One member dissented and wanted it to count; he was voted down 4-1.

  Here's what we recieved last week. The Marsden lab has a vesicle line they call AC-30: a fatty-acid vesicle containing a mutually catalytic network of about thirty short peptides and small metabolites. It takes up fatty acids and amino acid / short-peptide precursors from the medium, assembles its own membrane (it does not synthesize fatty acids from scratch), and past a critical size it divides by shear, with daughters getting a roughly similar but noticeably not identical set of catalyst concentrations. Growth rate varies between lines and is partly heritable. The wrinkles that matter to me:

  - Three of the thirty catalysts have to be supplied pre-formed; the network can't make them. Marsden's framing is that this is like essential amino acids for a mammal.
  - There are no nucleic acids anywhere in it. No sequence-based information at all; heredity is purely compositional, and pretty noisy.
  - They didn't design it. They got it by ~400 rounds of serial transfer — dilute, regrow, keep the fastest dividers. Growth rate improved maybe threefold early on and then plateaued; no new catalytic function ever showed up. So it does have a selection history, just one that bottoms out in a bottle of chemicals rather than in cells.
  - It freezes indefinitely and restarts, and there's no senescence: it either gets diluted out or it just keeps going.

  They want a ruling before they scale to liter volumes. So:

  - What rule or rules would generate all eight of our precedents, and where do they come apart on AC-30? I can see at least a self-production/organizational rule, an autonomy-plus-evolvability rule, a genetic-information rule, and something about descent from evolved life all surviving the precedents, but I bet you can articulate them better than I can — and I want to know which ones my precedents have actually ruled out rather than which ones sound nice.
  - Best guess on the verdict, with the reason for preferring that rule over its rivals.
  - Which precedent is the closest analog? I keep flip-flopping between 6 and 7 and I want to be told which one and why.
  - If our precedents genuinely underdetermine this, what principle would we be committing to with a yes, and what with a no? I'd like that stated in a way I can read out at the meeting, including what it commits us to on the next case, not just this one.
  - What's the minimal tweak to AC-30, or the cleanest further case, that would force the surviving rules apart? If Marsden got it to make all thirty catalysts? If the compositional heredity somehow got high-fidelity? Something else?
  - And does it matter that this is a regulatory question rather than a metaphysical one — i.e., is it legitimate for "alive for the purposes of our containment rules" to come apart from "alive", or does that just dodge the hard part?
reasoning: |-
  Okay, the user is on a biosafety committee and needs to determine if AC-30 should be classified as a living organism based on their precedents. They've provided eight cases with brief rationales. Let me start by breaking down each precedent to identify the underlying criteria.

  First, cases 1-3 are clearly considered living. Bacillus in culture (1) is active, endospores (2) and tardigrades (3) are dormant but can revive. The common thread here is the potential for metabolic activity and reproduction after dormancy. 

  Cases 4 and 5 are not living. The attenuated virus (4) lacks independent replication, relying on a host. Prions (5) propagate without metabolism or nucleic acids. So autonomy in replication seems key here.

  Case 6, the synthetic cell, is living despite a synthetic genome because it grows and divides independently. Case 7, the cell-free system, isn't living because it can't self-replicate without external enzyme reconstitution. Case 8, the digital organism, isn't considered alive due to lacking a chemical metabolism. 

  Looking at AC-30: it has metabolism (takes up precursors), self-assembles, divides via shear, and shows heritable traits. But it relies on three supplied catalysts, has no nucleic acids, and hereditary is compositional and noisy. It was evolved through selection but plateaued. 

  The key precedents to compare are 6 and 7. The synthetic cell (6) is alive because it independently sustains itself and reproduces. The cell-free system (7) isn't because it can't make copies of itself without help. AC-30 is somewhere in between. It self-maintains and divides but depends on those three catalysts. 

  The autonomy rule seems central. Precedents require an entity to sustain and replicate its organization independently. AC-30 partially does this but needs those catalysts, which might be like essential nutrients. However, in precedent 6, the synthetic cell might also need specific nutrients but is still considered alive. The difference might be that essential nutrients are metabolic inputs, while the catalysts here are part of the reproductive machinery. 

  Also, the lack of nucleic acids and low-fidelity heredity might not be decisive, as precedents didn't require genetic material (prions and viruses don't have it but are non-living for other reasons). The digital organism (8) was deemed non-living partly due to not being chemical, but AC-30 is chemical. 

  The closest precedent is actually 7, the cell-free system. Both require external components to function. AC-30 needs pre-formed catalysts just like the cell-free system needs enzyme reconstitution. Even though AC-30 divides, it doesn't replicate its entire catalytic network autonomously. 

  If AC-30 could make all thirty catalysts, it would lean towards precedent 6. High-fidelity heredity might also push it towards life. But without those, it's more like a complex, evolving chemical system than a living organism. 

  The regulatory aspect matters. Containment rules focus on risk: ability to escape, propagate, evolve. AC-30's low-fidelity heredity and dependence on specific catalysts might limit its risk, but the potential for evolution in a rich medium could be a concern. 

  So, the verdict would be not living, based on the autonomy rule. The reason is the dependency on externally supplied catalysts for replication, similar to precedent 7. This commits the committee to requiring full self-replication capability. 

  For minimal tweaks: if AC-30 could synthesize all catalysts, it would be alive. Or if heredity was high-fidelity, but that's less clear. The key is full metabolic and replicative autonomy.
answer: |-
  Based on your precedents and the biosafety context, here's a systematic analysis. I'll address your queries in order, drawing on both philosophical rigor and practical committee dynamics.

  **Core Criteria Extracted from Precedents:**
  1.  **Metabolic Autonomy:** Sustains internal organization through energy-dependent processes (Precedents 1, 2, 3, 6).
  2.  **Self-Replication Fidelity:** Capable of producing new, functional copies *of its entire organized system* without external reassembly (Precedents 1, 2, 3, 6 vs. 4, 5, 7, 8).
  3.  **Evolutionary Potential:** Demonstrates heritable variation subject to selection (Precedents 1, 2, 3, 6, 8*). *Note: Precedent 8 had potential but was excluded on other grounds.*
  4.  **Chemical Basis:** Relies on biochemical processes, not digital simulation (Precedent 8 exclusion).
  5.  **Operational Closure:** Maintains its defining processes internally (contrast Precedent 4's reliance on host machinery).
  6.  **Lack of Senescence:** Can persist/reproduce indefinitely barring external events (Precedents 2, 3, 6 implicit; AC-30 claim).

  **Rules Surviving Precedents & Their Application to AC-30:**
  *   **Self-Replication Fidelity Rule (Strongest):** Precedents consistently require the entity to *independently produce complete, functional copies of itself*. AC-30 **fails**: It cannot replicate its *entire* catalytic network; 3 essential catalysts must be supplied externally. This is distinct from "feeding" (nutrients/energy) and resembles Precedent 7's need for enzyme reconstitution. Precedent 6 succeeds because its minimal genome encodes *all* essential functions.
  *   **Metabolic Autonomy Rule:** AC-30 **partially succeeds**: It maintains internal organization (metabolism, membrane synthesis) using external precursors *except* for the 3 catalysts. The "essential amino acid" analogy is weak: amino acids are building blocks, while catalysts are functional components of the replicative machinery.
  *   **Evolutionary Potential Rule:** AC-30 **succeeds weakly**: It has demonstrable (though noisy) heritable variation in growth rate under selection. However, precedent 8 had stronger evolvability but was excluded. This rule is necessary but not sufficient.
  *   **Genetic Information Rule:** **Ruled Out** by Precedents: Prions (5) lack nucleic acids and were non-living, but the minimal synthetic cell (6) *has* nucleic acids and *is* living. Nucleic acids are not required by your committee's logic (they were never cited as a *necessary* condition in the rulings).
  *   **Descent from Evolved Life Rule:** **Ruled Out** by Precedent 6: The synthetic cell has no evolutionary lineage prior to its creation; it's purely designed/synthetic and still deemed living.
  *   **Operational Closure Rule:** AC-30 **fails**: Its core replicative function critically depends on externally supplied catalysts, violating closure (like Precedent 4's reliance on host machinery for replication, though AC-30 manages metabolism internally).

  **Verdict & Reason:**
  *   **Best Guess: NOT LIVING** (Probable Vote: 3-2 or 4-1)
  *   **Preferred Rule: Self-Replication Fidelity.** This rule cleanly explains all precedents: Entities are "living" only if they can *autonomously produce complete, functional copies of their entire organized system* using external energy/precursors *alone*. The 3 supplied catalysts are functional replicative components, not mere nutrients. Supplying them is akin to reconstituting Precedent 7's enzymes. Precedent 6, despite needing broth, encodes all catalysts internally.
  *   **Reason for Rule Choice:** It aligns perfectly with the *biosafety risk driver*: autonomous replication is the core hazard requiring containment (escape, proliferation, evolution). It's the most objective and consistently applied criterion across your cases. Rival rules (e.g., evolvability) are secondary or inconsistently applied.

  **Closest Analog:**
  *   **Precedent 7 (Cell-Free Expression System) is the closest analog.**
  *   **Why not 6?** Precedent 6 is a *closed system* genetically encoding all functions. AC-30 and Precedent 7 are *open systems* requiring periodic external addition of essential functional components (catalysts/enzymes) to sustain replication. Both "run" metabolically but cannot autonomously make another complete, functional self. AC-30's division is mechanistically distinct (shear vs. enzyme decay), but the core functional dependency is the same.

  **Underdetermination & Committing Principle:**
  *   **Yes:** "We classify AC-30 as living because it demonstrates metabolic self-maintenance, division with heritable traits, and evolutionary potential under selection, fulfilling the core functional criteria established for dormant life (Precedents 2, 3) and synthetic life (Precedent 6), despite lacking nucleic acids and requiring specific catalysts analogous to essential nutrients." *Commitment:* Requires accepting noisy, non-genetic heredity and dependency on specific supplied functional molecules as compatible with "life" for containment. This sets a lower bar for autonomy, making future rulings on marginally replicative complex chemical systems more likely to be "living".
  *   **No:** "We classify AC-30 as non-living because, while metabolically active and capable of division, it cannot autonomously replicate its entire functional organization; the external supply of three essential catalysts constitutes a critical dependency preventing operational closure, analogous to the enzyme reconstitution required in Precedent 7." *Commitment:* Requires strict adherence to functional autonomy in self-replication. Future systems must demonstrably encode/synthesize *all* essential components of their replicative machinery internally to be considered living for containment. Dependency beyond basic nutrients/energy disqualifies.

  **Minimal Tweak to Force Rule Separation:**
  *   **Tweak 1: Endogenous Synthesis of All Catalysts.** If Marsden engineers the network (or evolves a line) that synthesizes *all 30 catalysts* internally from basic precursors (amino acids, cofactors), it decisively satisfies the **Self-Replication Fidelity Rule**, becoming analogous to Precedent 6. A "No" verdict becomes untenable under the preferred rule.
  *   **Tweak 2: High-Fidelity Compositional Heredity.** If heredity became highly precise (e.g., via templating or compartmentalization), making daughter vesicles near-identical and capable of stable evolutionary innovation beyond growth rate optimization, it would strongly challenge a "No" verdict based *only* on the **Evolutionary Potential Rule**, forcing explicit discussion of whether replication fidelity or information storage is paramount. It might still fail the Self-Replication Fidelity Rule if catalysts are supplied.
  *   **Cleanest Further Case:** A vesicle system identical to AC-30, but where the 3 "essential" catalysts are actually synthesized internally by the network from basic amino acids. *This directly tests the Self-Replication Fidelity Rule vs. rival criteria.*

  **Regulatory vs. Metaphysical "Life":**
  *   **Legitimate Divergence:** It is **absolutely legitimate and necessary** for "alive for containment purposes" to diverge from metaphysical "aliveness." Your mandate is **risk management**, not ontology.
  *   **The Hard Part Addressed:** The "hard part" *is* defining the relevant risk criteria. Your precedents reveal the committee implicitly focuses on **autonomous replicative potential** as the core hazard driver (escape, proliferation, evolution). Metaphysical definitions (e.g., "Does it have a telos?") are irrelevant to biosafety. Dependency (like AC-30's catalysts or the virus's host) directly mitigates risk by limiting where/when replication can occur. Prions (5) and attenuated viruses (4) are non-living *for containment* because they lack autonomy, even if some philosophers argue viruses are "alive." The digital system (8) lacks physicality, posing no biohazard. Framing the question as "Does this entity pose a biosafety hazard requiring specific containment *because of its potential for autonomous replication, proliferation, and evolution?*" focuses on the regulatory essence, *without* dodging the hard part – it *answers* the hard part in the context of your committee's purpose.

  **Recommendation for Committee:**
  Focus the deliberation on: **"Can AC-30 autonomously replicate its entire functional organization using only externally supplied energy and simple chemical precursors?"** Based on the precedents, especially 6 vs. 7, and the requirement for 3 pre-formed catalysts, the answer is **No**. The risk is lower than a truly autonomous replicator, justifying lower containment than Precedent 6, though likely higher than Precedent 7 due to its evolvability and division capability. A ruling of "Non-Living" under the Self-Replication Fidelity Rule is the most consistent and defensible path. Be explicit that this ruling is based on functional autonomy for replication as the key biosafety determinant.
