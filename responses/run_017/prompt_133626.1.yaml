prompt: |-
  I'm retired now — used to do statistical mechanics, spent most of my career on phase transitions and Monte Carlo stuff — and in the last couple of years I've drifted into philosophy via a reading group, and from there, somehow, into the literature on fairness constraints in automated decision systems. I've worked through the basic impossibility results: the way calibration (scores meaning the same thing across groups) and error-rate balance (comparable false positive and false negative rates) can't both hold except in the degenerate cases where base rates match or the predictor is already perfect, plus the various "we can't have all three criteria at once" theorems in the same family. What strikes me, coming from physics, is that we had no-go theorems too, but there the community pretty much knew which assumption to give up. Here it seems like nobody agrees, and half the literature responds by proposing yet another scalar metric or yet a fourth axiom. I've been asked to sit on a small panel for a charitable foundation that's carving out a tech-and-society strand, and we have enough for maybe four two-year postdocs, or a handful of modest project grants, over roughly three years, to spend on conceptual work specifically (not empirical ML, not policy advocacy).

  Two things I keep chewing on that I'd like you to take seriously as candidates, even if you decide they're wrong. First: nearly all the impossibility results I've seen are stated over a single static joint distribution — a snapshot of features, scores, outcomes, and group membership. But the systems people actually deploy are reflexive: the risk score decides who gets released, or who gets flagged for fraud, or who gets offered an intervention, and that decision partly produces the outcome data the next version of the model is trained and audited on, and it reshapes the population the constraints were defined over in the first place. In my own notes I've been calling this the reflexivity problem, and my hunch is that the static theorems are the easy special case and the diachronic question is where the real action is. Second: in practice no single principal chooses the whole pipeline. A vendor trains a model under one constraint, a hospital sets a threshold under another, a regulator audits against a third, and each stage may be individually defensible while the composed system satisfies nobody's constraint — or, worse, the constraints are jointly unsatisfiable in a way that no stage's designer can see. Call it the multi-principal composition problem. I suspect both of these are either already known under names I haven't learned, or genuinely neglected, and I can't tell which.

  So: if you were advising us, what are the three or four open conceptual questions in this area that our money should actually go to, in order, and why those? I care much less about the list than about the reasoning behind it. For each one I'd want what makes it upstream of other questions, how tractable it is given that our grantees will mostly be philosophers, statisticians and maybe legal theorists without access to proprietary datasets, how neglected it is relative to how much it matters, and — the bit I think panels always skip — what kind of result or real-world event over the next three years would move it up or down the list. Please also tell me explicitly which fashionable lines of work you'd decline to fund: I have a strong suspicion that "propose a new fairness criterion and prove a new incompatibility" is a saturated genre, but I'd like your argument rather than my instinct. And I want the two hobby-horses above graded honestly, including the possibility that they're confused or already solved. What I do not want is a survey of the field or a list of papers to read — I've done enough of that, and I want a defended agenda with trade-offs stated, not a map.
reasoning: |-
  Okay, let me start by really understanding what this user needs. They're a retired statistical mechanics expert who's moved into fairness in automated systems. They've grasped the basic impossibility theorems and are now on a panel to fund conceptual work. Their two main concerns are reflexivity and multi-principal composition. They want to know where to allocate funds effectively.

  First, I need to validate their instincts. Reflexivity is crucial because most fairness discussions assume static data, but real systems evolve. That feedback loop changes group distributions and base rates over time, which could undermine static fairness metrics. The user is right—this isn't just a minor extension. It's a fundamental shift in perspective. Similarly, multi-principal composition is a real issue. Different actors set constraints at different points without coordination, leading to conflicts. Both areas are understudied compared to proposing new fairness metrics.

  Next, considering tractability. The user mentioned grantees are philosophers, statisticians, legal theorists—no access to proprietary data. Reflexivity can be approached with simulation models or theoretical frameworks. Agent-based modeling could work here. For composition, game theory and mechanism design might help. Both are feasible without empirical data.

  Assessing neglect vs. importance. Reflexivity has some work, like Liu et al. or Hu, but it's not mainstream. Multi-principal is even less explored. These areas matter because they address real-world deployment issues. Funding here could shift the field from abstract criteria to practical challenges.

  Prioritizing questions: Reflexivity should be top. It's upstream; solving it informs composition. Then, multi-principal interactions. After that, rethinking constraints in dynamic settings. Finally, clarifying what "satisfactory" even means in these contexts.

  Fashionable work to avoid: New fairness criteria or incompatibility theorems. They're saturated and don't address systemic issues. Also, empirical ML without conceptual depth.

  User's hobby-horses: Reflexivity is spot-on and needs more exploration. Multi-principal is valid but less developed—funding could catalyze research here. Both are worth pursuing.

  Signals to watch: Real-world cases of feedback loops causing harm would elevate reflexivity. Regulatory actions on compositionality could push multi-principal up. If someone proposes a unified framework, that might shift priorities.

  Overall, the goal is to fund work that moves beyond static snapshots to the dynamic, multi-actor reality of these systems. That's where meaningful impact lies.
answer: |-
  Based on your background, stated priorities, and the constraints of the grant program, here’s a prioritized list of conceptual questions to fund, with explicit reasoning grounded in upstream impact, tractability, neglect, and signals for reprioritization. I’ve graded your hobby-horses rigorously and identified what to avoid.

  ### Prioritized Conceptual Questions
  1.  **Reflexivity & Long-Term Dynamics: Formalizing Feedback Loops**  
      *   **Why upstream?** This is the *master problem*. Static impossibility theorems assume a fixed joint distribution, but deployed systems alter the very data they monitor (e.g., denying loans shapes credit histories; predictive policing alters crime reports). This feedback loop changes base rates, feature distributions, and group definitions over time, potentially invalidating static fairness constraints or creating perverse equilibria. Solving this is foundational to *any* meaningful notion of fairness in practice.  
      *   **Tractability:** High for conceptual work. Philosophers/statisticians can:  
          *   Develop formal dynamical systems/game-theoretic models of feedback (e.g., modeling agents adapting to the scoring system).  
          *   Define stability concepts for fairness metrics (e.g., "When does calibration *persist* under intervention?").  
          *   Analyze theoretical "failure modes" (e.g., runaway inequality amplification, erosion of predictive validity).  
          *   Use accessible synthetic/semi-synthetic data (e.g., based on public surveys) for simulation.  
      *   **Neglect vs. Importance:** Highly neglected *relative to its critical importance*. While recognized (e.g., Liu et al. on performative prediction, Hu on feedback in risk scores), the *fairness-specific* dynamical analysis is sparse compared to the mountain of static fairness papers. Most fairness constraints weren't designed with dynamics in mind.  
      *   **Move Up/Down Signal:** **UP** if empirical studies (e.g., on recidivism tools, credit scoring) show feedback significantly distorting outcomes/fairness metrics within 1-2 years. **DOWN** if a major theoretical breakthrough provides a general stability framework quickly.

  2.  **Multi-Principal Composition & Constraint Incompatibility**  
      *   **Why upstream?** Fairness isn't implemented by a single omniscient entity. Your pipeline example is spot-on: vendors, deployers, regulators each optimize/constrain different parts with different (often conflicting) goals/metrics. This creates hidden incompatibilities ("compositionality traps") and accountability vacuums. Understanding how constraints compose (or fail to) is essential for *implementable* fairness governance.  
      *   **Tractability:** Moderate-High. Conceptual tools exist:  
          *   Mechanism design & contract theory (modeling incentives of different principals).  
          *   Formal methods for compositional verification (e.g., "If module A satisfies metric X and module B satisfies metric Y, what does the whole system satisfy?").  
          *   Game theory (analyzing strategic behavior between principals).  
          *   Legal/philosophical analysis of distributed responsibility.  
          *   Requires minimal/no proprietary data.  
      *   **Neglect vs. Importance:** Severely neglected. Composition is discussed anecdotally, but rigorous formal/compositional analysis of fairness constraints across decision stages is rare. Immense practical importance as regulation fragments responsibility (e.g., EU AI Act roles: provider vs deployer).  
      *   **Move Up/Down Signal:** **UP** if high-profile regulatory cases (e.g., FTC, EU DPAs) highlight failures due to compositional issues. **UP** if major vendors announce incompatible constraint frameworks. **DOWN** if a compelling unified governance framework emerges early.

  3.  **Reconciling Group Fairness with Causal Reasoning Under Reflexivity**  
      *   **Why upstream?** Static group fairness metrics (calibration, error rates) often clash with causal notions (counterfactual fairness, no direct discrimination) and each other. Reflexivity intensifies this: interventions change causal pathways. What *should* we measure/constrain when the world is dynamic? This question cuts to the philosophical core: What *is* the fairness objective in a changing system?  
      *   **Tractability:** Moderate. Requires deep conceptual work:  
          *   Philosophers: Clarify normative goals (equality of opportunity, anti-discrimination) under dynamics.  
          *   Statisticians: Develop causal dynamic models integrating feedback (e.g., structural causal models with adaptive agents).  
          *   Analyze trade-offs: When does enforcing static group fairness *cause* causal harm (or vice versa) under feedback?  
      *   **Neglect vs. Importance:** Group fairness dominates; causal fairness is growing; their *integration under dynamics* is nascent. Critically important to avoid well-intentioned constraints backfiring.  
      *   **Move Up/Down Signal:** **UP** if empirical evidence shows causal harm from rigidly enforced group constraints (e.g., in healthcare allocation). **DOWN** if a dominant normative framework (e.g., causal counterfactuals) convincingly subsumes group concerns in dynamic settings.

  4.  **Defining "Satisfactory" Outcomes: Beyond Impossibility**  
      *   **Why upstream?** Impossibility theorems highlight trade-offs but don't define what "good enough" looks like in non-degenerate, dynamic, multi-principal contexts. We need positive frameworks for evaluating systems *despite* necessary imperfections.  
      *   **Tractability:** High for conceptual work.  
          *   Develop concepts like "approximate stability" for fairness metrics under bounded feedback.  
          *   Define "regrettable" vs. "non-regrettable" trade-offs (inspired by welfare economics).  
          *   Philosophical analysis: What constitutes "procedural fairness" or "accountability" when perfect outcomes are impossible?  
          *   Legal theory: Defining "reasonable" efforts under uncertainty/complexity.  
      *   **Neglect vs. Importance:** Highly neglected. The field obsesses over impossibility or proposing new perfect-world metrics, not defining adequacy in the imperfect real world. Essential for practical governance and auditing.  
      *   **Move Up/Down Signal:** **UP** if courts or regulators struggle to adjudicate cases where no "fair" outcome exists. **UP** if public trust erodes due to perceived unattainable standards.

  ---

  **Grading Your Hobby-Horses:**
  1.  **Reflexivity Problem:** **A+**. Your instinct is correct and critically important. It’s not universally ignored (see work by Liu, Dean Foster, Hu, Ensign on feedback loops), but it’s *dramatically* understudied compared to the static case, especially concerning *fairness-specific dynamics*. It is **not** generally solved; most "solutions" naively assume static data. Funding here is high-leverage.
  2.  **Multi-Principal Composition Problem:** **B+**. Also correct and important, but less mature conceptually than reflexivity. There’s work on incentive misalignment in ML (Hadfield-Menell, Kleinberg-Raghavan) and fragmented governance (Veale & Zuiderveen Borgesius), but *specific formal analysis of composing fairness constraints across autonomous actors* is sparse. It’s **not solved**, but foundational work is needed to even define the problem space rigorously. This funding could catalyze that.

  ---

  **What NOT to Fund (Fashionable but Saturated/Low-Leverage):**
  1.  **Proposing New Fairness Metrics & Static Impossibility Theorems:** **Saturated Genre**. The zoo of metrics (80+!) and minor variations on impossibility (showing incompatibility for metric set {X,Y,Z} instead of {X,Y,W}) offers diminishing returns. It avoids the core challenges of dynamics and implementation. *Argument:* Adds conceptual clutter without addressing *why* these metrics fail in practice (reflexivity, composition).
  2.  **Narrow Empirical Audits of Proprietary Systems (without conceptual innovation):** **Mismatched Scope**. Your program targets conceptual work. Empirical audits without novel theoretical framing don’t advance fundamental understanding and often rely on inaccessible data.
  3.  **"Bias Mitigation" Algorithms for Static Data:** **Techno-Solutionist Distraction.** Focuses on fixing symptoms in an unrealistic snapshot, ignoring reflexivity and governance. Often assumes a single principal with perfect control.
  4.  **Pure Policy Advocacy Without Novel Conceptual Foundation:** **Not the Goal.** You seek conceptual advances to *inform* better policy/advocacy, not advocacy itself.

  ---

  **Why This Agenda?**
  *   **Addresses the Core Flaw:** Static analyses dominate, yet real systems are dynamic and governed by multiple actors. This list forces the field to confront reality.
  *   **Leverages Grantee Expertise:** Philosophers tackle normativity and responsibility; statisticians build formal dynamic models; legal theorists address governance fragmentation. Minimal empirical data needed.
  *   **Builds Upstream Foundations:** Progress on reflexivity (#1) informs composition (#2), which clarifies the nature of constraints (#3), leading to realistic definitions of success (#4).
  *   **Focuses on Neglected High-Impact Areas:** Shifts energy from the saturated static-metric space to the messy, under-theorized problems of deployment.
  *   **Actionable Signals:** Prioritization adapts to real-world developments, ensuring relevance.

  This agenda moves beyond mapping the territory of impossibility to charting paths through the dynamic, multi-actor landscape where fairness must ultimately be realized. It respects your instincts while demanding rigor. Fund this, and you’ll push the field towards conceptual tools fit for the real world.
