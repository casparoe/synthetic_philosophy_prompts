  ### **Decision Tree: What's Your Buddhist Ethics Position?**
  Answer each question based on your instinct. No prior knowledge of Buddhism is needed—just your reasoning about the cases!

  #### **Question 1: The Sea-Captain Case**  
  A ship captain learns a passenger will murder everyone unless killed first. The captain kills the passenger, accepting the consequences. What best describes the captain’s action?  
  - **A**: He did something bad and shouldn’t have done it.  
  - **B**: He did something bad but was still right to do it.  
  - **C**: He did nothing bad at all.  
  - **D**: He did something good and would have been at fault to refuse.  

  *(All paths advance to Question 2.)*

  #### **Question 2: What Defines an Action?**  
  When judging any act, what matters most?  
  - **M**: The state of mind behind it (e.g., reluctant compassion vs. cold anger).  
  - **C**: What it actually causes to happen in the world.  

  *(All paths advance to Question 3.)*

  #### **Question 3: The "Ownership Gap" (Enduring Person vs. Causal Stream)**  
  When we say an act "helps" or "harms," does this require an enduring person who experiences the effects, or can we just add up the positive/negative changes across a flow of experiences (like a river with no owner)?  
  - **S**: You need an enduring person—effects happen *to someone*.  
  - **N**: Just add up the changes—no "owner" is needed.  

  *(All paths advance to Question 4.)*

  #### **Question 4: Does the Agent's Spiritual Level Matter?**  
  Should the same act be judged differently if done by an ordinary flawed person versus someone near enlightenment?  
  - **Y**: Yes—the agent’s spiritual level changes the act’s meaning.  
  - **N**: No—the act is what it is, regardless of who does it.  

  *(All paths advance to Question 5.)*

  #### **Question 5: Rules in a Novel Case**  
  Imagine a situation so unexpected that no rule could have anticipated it (e.g., a rare disease where lying saves a village). What guides the agent?  
  - **E**: Follow the closest rule anyway—rules don’t bend.  
  - **X**: Rules have exceptions—break them if circumstances demand it.  
  - **G**: Rules aren’t the real guide; use wisdom/compassion directly.  

  *(All paths advance to Question 6.)*

  #### **Question 6: Can Goodness Be Redirected?**  
  After someone does a good deed, can its positive effect be transferred to help others (like dedicating it to a loved one), or does it only help the person who acted?  
  - **Y**: Yes—it can be redirected to others.  
  - **N**: No—it only helps the person who did it.  

  *(All paths advance to Question 7.)*

  #### **Question 7: The Point of Ethics**  
  What is ethics ultimately about?  
  - **T**: Transforming the agent’s own character and understanding.  
