  **Arguing the other side:** 
  The residue might mark a gap in the distributed systems/game theory vocabulary. The gap is normative: what should a single agent conclude when they are in a symmetric situation and know that all others are identical and rational? The standard framework (Nash equilibrium) does not provide a unique answer in coordination games, and in the PD it leads to defection. Superrationality provides a way out by appealing to the symmetry of reasoning and the fixed point of all doing the same. The residue is the selection of the best symmetric fixed point. 

  The distributed systems vocabulary has precise tools for what agents can jointly implement (via programs, randomization, symmetry breaking), but it does not say what an agent ought to do. The normative dimension is missing. Superrationality fills that gap by prescribing that in symmetric one-shot games, you should choose the action that, if all choose it, yields the best outcome for you. This is a normative principle. 

  The residue in the asymmetric cases shows that superrationality is not a complete theory. But in the symmetric case, it is a compelling principle. The gap in the standard framework is the lack of a normative principle for symmetric one-shot games that avoids the inefficiency of Nash equilibrium. 

  **Verdict:**
  The aggregate residue is significant. In the symmetric cases (PD and symmetric lottery), we can capture the superrational outcome in program equilibrium by assuming symmetric programs and selection by common payoff maximization. In the asymmetric cases, we must import a selection principle. The perturbation with labels requires an arbitrary choice of label, and the mixed population requires extending the framework and making assumptions about the standard players' behavior. 

  However, the core of superrationality — the idea that identical rational agents must choose the same strategy and that this strategy should be the one that yields the best outcome when all choose it — is not captured by standard game theory. It is a distinct normative principle. Your vocabulary can implement the outcomes but does not provide a reason for the agents to choose that implementation in the first place. Therefore, the residue marks a genuine gap: the lack of a normative principle for symmetric games that goes beyond Nash equilibrium. 

  Whether your vocabulary should want this normative dimension depends on whether you are designing systems (where you can impose the program) or analyzing what rational agents would do. For design, you can impose the program. For analysis, you might need the normative principle.
