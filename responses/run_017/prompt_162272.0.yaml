  ### Case 3: Asymmetric Lottery with Known Values

  **Scenario:** n players, each player i has a prize value v_i (distinct and known to all). Each decides whether to send. If exactly one sends, that player gets her v_i; otherwise, all get 0. Players run the same decision procedure, which takes (i, v) as input.

