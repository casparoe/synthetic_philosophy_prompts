answer: |-
  I reject your step (1) and the core premise that conditioning *only* licenses reweighting, never pruning. Your critique misunderstands the purpose of historical explanation and conflates distinct epistemic tasks.

  **Against Step (1): Conditioning Legitimates Pruning for Causal Explanation**  
  Your claim that conditioning only allows reweighting, not deletion, assumes the pre-registered model's purpose—capturing the full "poise" of possibilities *before* the event—is identical to the purpose of retrospective explanation. It is not. The retrospective stance answers "*Why did E happen?*" This demands isolating the *actual causal chain* that produced E. Branches that carried weight *ex ante* but were **causally irrelevant** to the actual outcome *become irrelevant to the explanation*. Keeping them at low probability isn't just inefficient; it misrepresents the causal structure *as it unfolded*. If a branch represented a potential path that demonstrably played no role—because E occurred via a different mechanism—retaining it distracts from identifying the operative causes. Pruning isn't discarding evidence of past uncertainty; it’s focusing the account on the path that *mattered causally*. The resulting model is a model *of the actual causal ancestry of E*, stripped of inert possibilities.

  **What the Reader Loses (and Gains) and Why Modal Information Isn't Destroyed**  
  You argue pruning destroys modal information about fragility and near-misses. But this conflates two questions: "Why did E happen?" and "How likely was E beforehand, and what alternatives existed?" The first is answered by the pruned causal chain. The second *requires the pre-registered model or its equivalent*, not a retrospective explanation. Expecting a single narrative to perform both tasks overloads it. A reader relying *only* on the pruned narrative loses explicit quantification of *ex ante* uncertainty. However, they gain clarity on the specific causes that *were* sufficient and necessary for E in the actual world. Crucially, modal information isn't obliterated; it is context-dependent. A competent historian signals contingency ("This decision was pivotal; had X faltered, Y might have prevailed") without cluttering the causal explanation with every dead end. The "sense that it had to happen" stems from poor historiography that *fails to signal contingency*, not from pruning *per se*. The error lies in the *absence of modal framing*, not the *absence of pruned branches*.

  *(Conceding specific malpractice, holding the line on structure):* Individual historians may over-prune, omitting causally relevant near-misses or implying false necessity. But this is malpractice *within* the retrospective stance, not an indictment of its core logic. Selectivity—removing causally inert branches—is essential to explanation, not a defect. Directional parity holds: the same model is interrogated, but the question asked ("Why E?") justifies a different, focused representation.
