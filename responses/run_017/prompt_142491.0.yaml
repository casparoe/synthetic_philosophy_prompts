answer: |-
  ## Joint Statement: Adversarial Collaboration on Individual Contributions to Collective Harm

  **Agreed Claims:**

  1.  **Collective harms impose genuine moral demands.** (Both sides agree that outcomes involving significant suffering or injustice, even when produced by many small acts, are morally relevant and call for a response.)
  2.  **Individuals have pro tanto reasons concerning their contributions to potentially harmful collective practices.** (Both sides reject the strong inefficacy claim that individuals *never* have reasons to refrain from acts that are part of collective harms simply because their individual causal impact is small or uncertain.)
  3.  **Uncertainty about causal impact does not automatically dissolve responsibility.** (Both sides accept that probabilistic expectations matter and that ignorance of exact pivotality doesn't erase reasons; the DM camp centers on expected difference, the Participation camp on the nature of the act itself.)
  4.  **Institutional context significantly shapes the nature and strength of individual reasons.** (All cases provided demonstrate this; both sides interpret the cases through their frameworks but agree context matters.)
  5.  **The "resolution problem" (Case 6) highlights a genuine challenge for moral evaluation, particularly for quantifying harm, but does not necessarily negate all reasons for action.** (DM focuses on expected value aggregation; Participation focuses on the character of participation; both agree it's a problem but not a total defeater.)
  6.  **Ex post knowledge of non-pivotality (Case 3: Public Counter) may change the *description* of the act's outcome, but its relevance to *ex ante* reasons and potential *ex post* evaluation is contested.** (Agreement that the fact exists, disagreement on its moral significance.)
  7.  **For the Participation camp, the *expressive* or *symbolic* dimension of an act can carry independent moral weight.** (The DM camp acknowledges this as a potential factor they don't centralize; the Participation camp asserts its core relevance.)
  8.  **The difference-making approach provides a clear, quantifiable framework for evaluating expected impact in many standard cases.** (Participation camp acknowledges this strength, even if they dispute its sufficiency/exclusivity.)
  9.  **The participation approach captures widely held intuitions about complicity and dirty hands that purely counterfactual analyses sometimes struggle with.** (DM camp acknowledges this intuitive pull, even if they seek to explain or reinterpret it.)

  **Disagreements:**

  | Disagreement ID | Question at Issue                                                                 | Difference-Making Formulation                                                                                                | Participation Formulation                                                                                                                                 | Status    | Verbal Reformulation                                                                                               |
  | :-------------- | :-------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------- | :----------------------------------------------------------------------------------------------------------------- |
  | D1              | Does the *stringency* of the reason primarily scale with the expected difference made? | "The moral reason against an individual act is proportionate to the expected harmful difference that act makes to the outcome." | "The moral reason against participating in a collectively harmful practice is primarily grounded in the *wrongness of the participation itself*, and its stringency is largely invariant to the expected marginal impact of *this specific act*." | Mixed     | Are reasons primarily a function of expected causal impact magnitude, or are they primarily a function of the act's relation to the harmful practice, with causal impact secondary? |
  | D2              | Does the reason survive known non-pivotality (Public Counter)?                    | "While the expected difference *ex ante* was positive, the *ex post* knowledge that my act was non-pivotal shows I made no difference; this fully determines the moral status of the outcome regarding harm." | "Participating in a harmful collective practice knowing one is non-pivotal is still complicitous/wrongful participation; the act remains tainted, and regret/disowning may be appropriate even without causing harm." | Substantive | Does the *ex post* fact of non-causation fully exculpate regarding the collective harm, or does participation retain negative moral valence independent of causal outcome?          |
  | D3              | Does the reason survive certain substitution (Substitution Case)?                 | "If my abstention is certain to be perfectly substituted by another actor, my action makes no expected difference to the harm; therefore, the primary reason against contributing vanishes." | "Participating in a harmful practice remains problematic even if substitution is certain, because I am still choosing to *be a participant* in that harmful system." | Substantive | Does the certainty of displacement nullify the reason against contributing, or is the act of participation itself the core wrong? |
  | D4 (a)          | How should counterfactual difference be measured? (Market Incidence)              | "The relevant counterfactual is the difference made holding others' behavior *fixed*; the equilibrium shift caused by my infinitesimal action is negligible and not attributable to me." | "The relevant frame is the act's place within the *actual practice* and its causal contribution *to the system's harmful output*; equilibrium effects are part of that system." | Verbal    | Is the individual's responsibility defined relative to a fixed background, or relative to the dynamic system they are part of? |
  | D5              | Is there a threshold of moral significance for expected differences? (Resolution Prob.) | "Expected differences below a plausible threshold of moral significance (e.g., below model resolution or where probability estimates lack precision) generate no meaningful reason against acting." | "Participation in a practice known to be collectively harmful generates a reason against participating *regardless of the precise expected micro-impact of one's own act*, as long as the practice's harm is significant." | Substantive | Can vanishingly small expected differences ever fall below a threshold where they generate *no* reason, or does participation in a harmful practice *always* generate some reason? |
  | D6              | Is the Offset Lottery an acceptable substitute for direct restraint?              | "The offset lottery has the *same expected harm reduction* as verified removal at a fraction of the cost, freeing resources for other good; it is rationally and morally preferable." | "Buying the lottery ticket, while perhaps better than nothing, is not equivalent to restraint; it fails the test of universalization/expresses insufficient commitment/avoids the core demand not to participate in the harmful practice." | Substantive | Does achieving equivalent expected harm reduction via a probabilistic mechanism satisfy the moral demand equally well as direct restraint or certain harm reduction? |
  | D7              | Does the Participation Camp offer a unified account?                              | "The Participation camp's reliance on 'participation', 'complicity', or 'expression' obscures whether the core wrong is (a) being part of a harmful group, (b) expressing a harmful maxim, or (c) something else." | "Our core claim is that participating in a collectively harmful practice is *pro tanto* wrong, grounded in considerations of complicity (membership/contribution to harm) and/or the failure of universalization/expressive meaning; these are complementary aspects of the same wrong." | Mixed     | Can the diverse intuitions motivating the Participation camp (complicity, universalization, expression) be fully unified under a single coherent principle, or are they distinct grounds? |

  **Cruxes:**

  | Crux ID | Sub-Question                                                                                                  | Test or Case                                                                                                 | Settlement Condition                                 | Difference-Making Prediction                                                                 | Participation Prediction                                                                                                                               | DM Update if Wrong                                                                                                                               | Participation Update if Wrong                                                                                                                                               |
  | :------ | :------------------------------------------------------------------------------------------------------------ | :----------------------------------------------------------------------------------------------------------- | :--------------------------------------------------- | :------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | C1      | Is the Offset Lottery (Case 5) morally equivalent to direct restraint/certain offset?                         | **Offset Lottery Case:** Flight + Lottery vs. Flight + Certain Offset. Ask: Is restraint morally required? | Clear consensus among impartial adjudicators that one option is morally deficient compared to the other. | **Equivalent:** Both achieve same expected harm reduction; lottery is more efficient.                                                                  | **Not Equivalent:** Restraint/offset expresses non-complicity/universalizable maxim; lottery is mere risk-taking with harm.                             | If lottery deficient: Revise view that expected value fully captures the moral reason; incorporate expressive/participatory elements.                                         | If lottery equivalent: Concede that probabilistic harm reduction fully satisfies the participatory demand, weakening the non-consequentialist core.                           |
  | C2      | Does known non-pivotality (Case 3: Public Counter) eliminate *all* negative moral valence (regret, disowning)? | **Public Counter Case:** Knowing you are position 3/500, you buy chicken anyway. Ex post, no harm done.      | Clear consensus on whether regret/disowning is appropriate *despite* known non-causation of harm. | **No Remainder:** The act caused no harm; regret is irrational. Disowning makes no sense.                                                              | **Remainder:** Regret/disowning appropriate. Participation was willed, even if non-pivotal; the act itself was complicit/expressive of indifference. | If remainder appropriate: Revise view that only causal outcomes matter; incorporate non-causal participatory wrongs (e.g., expressive meaning).                               | If no remainder appropriate: Concede that non-causal participation lacks significant moral valence *ex post*, focusing solely on *ex ante* expectations or expressive meaning. |
  | C3      | Does certain substitution (Case 4) nullify the reason against contributing?                                   | **Substitution Case:** You decline chicken, but processor instantly sells it to next customer. Harm unchanged. | Clear consensus on whether contributing is permissible when substitution is certain.                           | **Permissible:** Contributing makes no difference; abstaining makes no difference. Morally neutral.                                                   | **Impermissible:** Contributing means choosing to be part of the harmful transaction; substitution doesn't change your act of participation.            | If impermissible: Revise view that reasons are solely counterfactual difference-makers; incorporate participatory/expressive elements.                                       | If permissible: Concede that participation without causal difference lacks moral weight, collapsing towards DM view.                                                           |
  | C4      | Does the Participation Camp split on Substitution vs. Non-Pivotality?                                         | Compare **Case 3 (Public Counter - Non-Pivotality)** and **Case 4 (Substitution)**.                          | Divergent answers from Participation theorists on permissibility in these two cases.                               | *(Not Applicable - Observing Participation Camp)*                                                                                                     | *(Participation Camp Prediction):* **Unified:** Both cases involve impermissible participation despite no difference made. (If split emerges, see below) | N/A                                                                                                                                           | If wings split: Complicity wing *may* see Substitution as less bad if harm truly unavoidable, while Universalization wing sees both equally bad. Update: Coalition fragile, grounds distinct. |

  **Closing Remarks:**

  The adversarial collaboration reveals that the Participation camp coalition, while sharing core intuitions about the wrongness of participation, exhibits fragility under pressure. **The coalition holds only if both wings (Complicity and Universalization/Expression) give the same answers to the Substitution (Case 4) and Known Non-Pivotality (Case 3) cases.** If they diverge – particularly if the Complicity wing softens on Substitution while the Universalization wing does not – the coalition fractures, revealing distinct moral foundations. **What remains genuinely unsettled is the fundamental source of moral reasons in collective harm cases:** whether they are ultimately grounded solely in the expected causal consequences of individual acts (DM), or whether participation in a harmful practice constitutes a distinct, non-consequentialist wrong (Participation), and if the latter, whether that wrong is best understood through complicity, universalization, expression, or an irreducible combination. The Offset Lottery case (C1) serves as the most decisive probe, directly challenging the DM framework's sufficiency and the Participation camp's non-consequentialist commitments.

