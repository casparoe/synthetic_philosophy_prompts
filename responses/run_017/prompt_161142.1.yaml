  As a decision theorist steeped in Kelly betting and geometric rationality, I'll tackle your query methodically. Tomas's track record reveals a consistent but nuanced approach to bet sizing, blending strict Kelly principles with adjustments for uncertainty, one-off opportunities, and background risks. For this new case, I'll first brainstorm the competing rules that fit his historical behavior, then derive their predictions for the stake fraction (or dollar amount), state my best guess with reasoning, and finally propose a variant case to cleanly discriminate between the rules.

  ### Step 1: Brainstorming Competing Rules from Track Record
  Tomas's behavior suggests he adheres to core Kelly principles (maximizing geometric mean growth) but with pragmatic twists. Here are the key patterns from the five cases:
  - **Case 1 (repeated 60/40 bet, full confidence)**: Bets 20% (full Kelly: \(f^* = p - q = 0.6 - 0.4 = 0.2\)). Shows commitment to geometric mean maximization for repeated bets with known edge.
  - **Case 2 (same bet, uncertainty)**: Bets 10% (half Kelly). Shrinks size for parameter uncertainty or model error, a standard fractional Kelly adjustment.
  - **Case 3 (fair coin)**: Bets zero. No edge, no bet—consistent with Kelly, as \(f^* = 0\) when \(p = 0.5\).
  - **Case 4 (one-off capped downside)**: Takes maximum allowed. Ignores Kelly sizing due to the one-shot nature and skew (high upside with limited loss), prioritizing expected value when downside is bounded.
  - **Case 5 (correlated background risk)**: Cuts size below Kelly formula. Adjusts for positive correlation with existing risks (e.g., salary), reducing exposure to avoid compounding risks.

  From this, three rules emerge for handling bets, especially one-offs with constraints:
  1. **Floor Constraint Rule**: Tomas treats the $140k obligation as a hard floor. He absolutely avoids any outcome where bankroll falls below this level (disaster is "not an option"). Sizing ensures zero probability of shortfall, and within that, he maximizes expected growth or value. This fits Case 4 (capped downside allows aggression) and Case 5 (background risk mitigation), but generalizes to any floor.
  2. **Net Wealth Kelly Rule**: Tomas nets out future liabilities from current bankroll before applying Kelly. For a fixed obligation, he defines "net wealth" as current bankroll minus the present value of the liability (no discounting here, as money is cash). He then applies full Kelly to this net wealth. This fits Case 5 (background risk as a form of liability) and the uncertainty adjustment in Case 2, while staying true to geometric mean principles for surplus wealth.
  3. **Unadjusted Kelly Rule**: Tomas might ignore the obligation for this bet if it's seen as separate from his "gambling bankroll." He applies full Kelly to gross bankroll, as in Cases 1 and 2, since the bet is independent and resolves before the obligation. However, this conflicts with Case 5 (where he adjusted for external risks) and Case 4 (where he didn't use Kelly for a one-off). Given the disaster constraint, this rule is less likely but included for completeness.

  **Why only these rules?**  
  - The Floor Constraint Rule captures Tomas's intolerance for ruin (from the obligation description) and his aggression with bounded downside (Case 4).  
  - The Net Wealth Kelly Rule aligns with his focus on geometric growth of "discretionary wealth" and adjustments for external risks (Case 5).  
  - The Unadjusted Kelly Rule is inconsistent with Cases 4 and 5 but serves as a baseline for how a pure Kelly bettor might think without considering the floor.  
  - Other rules (e.g., fractional Kelly for one-offs) don't fit cleanly: Case 4 shows he doesn't default to fractional Kelly for one-offs, and Case 3 confirms he only bets with edge.

  These rules agree on repeated bets (Case 1) and no edge (Case 3) but diverge on one-offs with constraints.

  ### Step 2: Predictions for the New Case
  - **Setup**: Bankroll = $200k. Obligation = $140k due in 18 months. Bet: one-shot, even-money, 70% win probability (solid), resolves in 3 months. Money in cash, no reinvestment. Must avoid bankroll < $140k at obligation time (disaster). After bet resolves at 3 months, bankroll is held as cash until 18 months, so the relevant value is at bet resolution.
  - **Key implication**: To avoid disaster, bankroll at 3 months must be ≥ $140k. Current bankroll is $200k, so the maximum loss that avoids disaster is $60k (i.e., stake \(S\) must satisfy \(S \leq 60k\) to ensure bankroll after loss is \(200k - S \geq 140k\)).

  Now, each rule's prediction:

  - **Floor Constraint Rule**:
    - Tomas ensures \(S \leq 60k\) to eliminate disaster risk.
    - Within this, he maximizes expected bankroll or expected growth. The expected bankroll after bet is \(E[\text{BR}] = 0.7(200 + S) + 0.3(200 - S) = 200 + 0.4S\), which increases with \(S\). Thus, he stakes the max safe amount: **$60,000**.
    - Fraction: \(60k / 200k = 30\%\).
    - Why? Fits Case 4 (maximizing upside when downside is controlled) and the "not an option" disaster aversion. Ignores Kelly as it's one-off.

  - **Net Wealth Kelly Rule**:
    - Net wealth = Current bankroll - PV(obligation) = $200k - $140k = $60k (PV = face value as cash earns nothing).
    - Full Kelly fraction for bet: \(f^* = p - q = 0.7 - 0.3 = 0.4\).
    - Stake = \(0.4 \times \text{net wealth} = 0.4 \times 60k = \textbf{\$24,000}\).
    - Fraction of gross bankroll: \(24k / 200k = 12\%\).
    - Why? Fits Case 5 (sizing based on net wealth due to background risk) and geometric mean focus on surplus. Ensures no disaster: min bankroll after loss = \(200k - 24k = 176k \geq 140k\).

  - **Unadjusted Kelly Rule** (less likely, included for contrast):
    - Full Kelly on gross bankroll: \(f^* = 0.4\), stake = \(0.4 \times 200k = \textbf{\$80,000}\).
    - Fraction: \(40\%\).
    - But this risks disaster: if lose (30% chance), bankroll = \(120k < 140k\). Inconsistent with "not an option" and Case 5 (he reduces for risks). Thus, I discount this rule.

  **Summary of Predictions**:
  - Floor Constraint: **$60,000 (30%)**
  - Net Wealth Kelly: **$24,000 (12%)**
  - Unadjusted Kelly: $80,000 (40%) — but ruled out by track record.

  ### Step 3: My Best Guess and Reasoning
  **Best guess: Tomas stakes $24,000 (12% of bankroll) based on the Net Wealth Kelly Rule.**

  **Why I lean this way**:
  - **Consistency with track record**: 
    - Case 5 shows Tomas adjusts for external risks (e.g., salary correlation) by sizing bets relative to his overall risk profile, which the net wealth approach embodies. The obligation acts like a background liability.
    - Case 2 demonstrates uncertainty-based shrinkage, but here the 70% edge is "solid," so no shrinkage is needed—full Kelly on net applies.
    - Case 4 (one-off capped loss) is different: the capped downside allowed aggressive sizing without liability concerns. Here, the uncapped loss and floor make net wealth more appropriate.
  - **Geometric rationality**: Tomas is "hardcore Kelly" and into ergodicity. For one-off bets, Kelly bettors often use expected log utility (growth-optimal) on relevant wealth. Net wealth (surplus above liability) defines the "bankroll" for geometric growth, avoiding the log singularity at zero net (disaster). Staking $24k gives positive net wealth in all outcomes (min net = $36k if lose), while $60k risks net zero if lose, which log utility penalizes infinitely.
  - **Risk sensitivity**: The net wealth approach is more conservative than floor-constrained maxing, fitting Case 5's reduction. With $60k stake, losing puts him exactly at the floor—no buffer, which might feel risky. With $24k, he retains a buffer, aligning with his aversion to "background risk."
  - **Uncertainty**: I'm 70-80% confident. The Floor Constraint Rule is plausible (30-20% weight) due to Case 4's aggression, but Case 4 had no liability and capped loss, making it less analogous. The obligation's "not an option" phrasing suggests a hard constraint, but net wealth respects this while preserving Kelly principles. If Tomas were purely maximizing expected value without growth considerations, he might stake $60k, but his history points to geometric thinking.

  **Dollar figure**: $24,000 (12% of $200k).

  ### Step 4: Variant Case to Discriminate Rules
  **Variant to cleanly distinguish Floor Constraint vs. Net Wealth Kelly**:
  - **Setup**: Change the obligation amount to create a tension between the rules. Set bankroll = $200k (unchanged), but obligation = $190k due in 18 months (so buffer = $10k). Offer the same one-shot bet: 70% win chance, even money, resolves in 3 months.
  - **Why this variant?** It makes the buffer ($10k) small relative to net wealth ($10k), so the rules predict starkly different stakes:
    - **Floor Constraint Rule**: Must have \(S \leq 10k\) to avoid disaster (since min bankroll after loss: \(200 - S \geq 190k\)). \(E[\text{BR}]\) increases with \(S\), so stake = **$10,000 (5% of bankroll)**.
    - **Net Wealth Kelly Rule**: Net wealth = $200k - $190k = $10k. Full Kelly fraction = 0.4, so stake = \(0.4 \times 10k = \textbf{\$4,000 (2% of bankroll)}\).
    - Unadjusted Kelly (discounted) would say $80k, risking disaster—inconsistent.
  - **Discrimination**: 
    - If Tomas stakes ~$10k, it supports the Floor Constraint Rule (aggression within safety).
    - If he stakes ~$4k, it confirms Net Wealth Kelly (sizing based on surplus).
    - This variant is ideal because:
      - It holds all else constant (bet details, confidence in edge) but varies the floor.
      - The predictions differ by 150% ($10k vs. $4k), making it easy to observe.
      - It tests how Tomas handles a tight buffer: Floor Constraint risks min wealth, while Net Wealth Kelly avoids the zero-net singularity.
  - **Why not other variants?** Changing the edge (e.g., to 60%) adds uncertainty, which invokes Case 2's shrinkage and muddies the water. Altering the timing (e.g., bet resolves just before obligation) doesn't change the math as cash earns nothing. The key is the obligation size relative to bankroll.

  **Underdetermination?** Tomas's track record slightly underdetermines the rules, as both Floor Constraint and Net Wealth Kelly fit the disaster aversion (Cases 4 and 5) but emphasize different principles: Floor Constraint focuses on survival, while Net Wealth Kelly focuses on optimal growth of discretionary wealth. The variant forces a choice, revealing whether he prioritizes "no ruin" above all (Floor Constraint) or integrates liabilities into his growth framework (Net Wealth Kelly). Either way, he commits to a core tenet: geometric rationality with adjustments for real-world constraints.
