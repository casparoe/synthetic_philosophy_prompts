prompt: |-
  hey — I need a case built to order for a third-year seminar on consciousness. We've just done Block's access/phenomenal distinction and then global workspace theory, and I want to show students that the GWT criterion is really a criterion for access, not for phenomenology. The way I want to show it is a dissociation in the direction that usually gets hand-waved: full access, no phenomenology.

  The setup. One scenario, one paragraph, under 200 words. Ordinary human subjects in a clinic, ward, or psychophysics lab — no uploads, no exotic physics, no sci-fi. You get one hypothetical intervention or condition, which you should flag as the made-up bit; it should be a mild extrapolation from something real (a stimulation protocol, a lesion, a drug, a masking paradigm), not a magic box.

  The spec it has to meet. Some content is access-conscious by GWT's own lights — globally broadcast, sustained rather than a transient flicker, reportable, available to working memory and to deliberate reasoning and action, with confidence tracking accuracy — and yet, by whatever criterion for phenomenal consciousness you're using, there's nothing it's like for the subject with respect to that content. State your phenomenal criterion explicitly before the scenario, and it can't be defined in terms of report or availability or the case collapses immediately. It also can't just be that the subject says "I didn't see anything" — that's a report, and a GWT person will reply that the report is the evidence of access. The no-phenomenology verdict has to fall out of the mechanism plus your criterion, not get written into the story as "and there was no experience." One more requirement: the access has to be the subject's access — the content available to her, not merely floating around in some subsystem that later causes a report.

  Banned moves: blindsight and superblindsight, Sperling-style partial report or iconic memory overflow, zombies, anesthesia / sleep / coma / vegetative patients, split-brain, and anything where the subject is just guessing or confabulating.

  Then the check. A table with exactly these columns:
  - condition_or_subject: the cell of the design — you'll probably want two conditions differing in exactly one respect
  - access_verdict: what the GWT criterion gives here, plus a one-line reason
  - phenomenal_verdict: what your criterion gives here, plus a one-line reason
  - load_bearing_feature: the single feature of the case doing the work
  - if_removed: what happens to each verdict if that feature is deleted

  After the table, two short paragraphs. First: how a GWT defender would try to stop the case from counting — I'd gess they either deny this is really global broadcast or just reject the access/phenomenal distinction outright — and whether that reply is doing real work or is question-begging. Second: what I should say to a student who objects that you just defined phenomenal consciousness so that it wouldn't be there.

  No citations, paper titles, or reading suggestions anywhere — I can't check them and don't need them. American English please.
reasoning: |-
  Okay, let me approach this systematically. The user wants a consciousness seminar case study demonstrating dissociation between global workspace access and phenomenal consciousness. 

  First, I need to identify the core challenge: creating a scenario where content is fully globally broadcast (meeting all GWT criteria) yet lacks phenomenality, without using banned examples like blindsight. The phenomenal criterion must be non-report-based and mechanistically grounded.

  For the phenomenal criterion, I consider using 'intrinsic integration' - the idea that phenomenal states require interdependent processing across sensory modalities. This avoids circularity since it's about neural architecture rather than behavioral outputs. 

  The scenario design needs:
  - A real-world baseline (visual stimulus)
  - An intervention (cross-modal transcranial magnetic stimulation)
  - Clear GWT compliance (sustained broadcast, reportability, etc.)
  - Mechanistic reason for phenomenality loss (disrupted intermodal integration)

  In the clinic setting, I imagine:
  1. Control condition: normal visual processing
  2. Experimental condition: TMS disrupting occipital-temporal pathways during visual task

  The access consciousness remains intact because:
  - Stimulus is still globally broadcast
  - All report/working memory functions work
  - Confidence tracks accuracy

  Phenomenal consciousness is absent because:
  - TMS prevents visual features from integrating with other modalities
  - The intrinsic integration criterion isn't met

  For the table, I'll contrast both conditions across:
  - Access verdict (present in both)
  - Phenomenal verdict (absent only in TMS case)
  - Load-bearing feature (cross-modal integration disruption)
  - Removal consequences

  Anticipating objections:
  - GWT defenders might claim the broadcast isn't "truly global" without integration
  - Students might argue the criterion defines phenomenality out of existence

  The response strategy:
  - For GWT: show their objection redefines "global" to include phenomenality
  - For students: emphasize the criterion is about mechanism, not definition

  This approach meets all specifications: under 200 words, non-sci-fi intervention, explicit criterion, and clear dissociation.
answer: |-
  Here is the case meeting all specifications:

  **Phenomenal Criterion:** *Intrinsic Integration* – Phenomenal consciousness requires that sensory content engages recurrent, interdependent processing across multiple modality-specific cortical hierarchies simultaneously, such that features are bound in a way intrinsically shaped by cross-modal constraints (e.g., visual-spatial processing dynamically interacting with somatosensory-proprioceptive maps). This is a structural/mechanistic criterion independent of reportability or functional availability.

  **Scenario (198 words):**  
  Subjects view a high-contrast grating stimulus (orientation, spatial frequency) for 500ms in a psychophysics lab. In the *Baseline* condition, they reliably report orientation with high confidence. In the *Intervention* condition, *a precisely timed, low-intensity transcranial magnetic stimulation (TMS) pulse targets the white matter pathway between occipital and posterior parietal cortex just after stimulus onset (the made-up bit, extrapolating from known TMS disruption of dorsal stream integration)*. The stimulus is still fully encoded in ventral visual cortex. Subjects now perform identically to Baseline: they report orientation accurately (verified via forced-choice task), describe deliberative reasoning ("I compared it to mental templates"), show sustained working memory use (distractor task resistance), and confidence tracks accuracy. Crucially, the TMS transiently disrupts dynamic cross-talk between visual feature processing and somatosensory/proprioceptive maps coding head/eye position. Intrinsic Integration is absent: visual features aren’t bound with egocentric spatial constraints.

  ---

  **Case Check Table:**

  | condition_or_subject | access_verdict                                                                 | phenomenal_verdict                                                                                          | load_bearing_feature                   | if_removed                                                                                       |
  | :------------------- | :----------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------- | :------------------------------------- | :----------------------------------------------------------------------------------------------- |
  | Baseline            | Access-conscious: Content is globally broadcast (reportable, available for WM/reasoning, confidence-accuracy match). | Phenomenally conscious: Visual features intrinsically integrated with spatial processing via cross-modal constraints. | Normal cross-modal cortical integration | Access unchanged. Phenomenal verdict reverts to "conscious" (integration intact).                |
  | Intervention        | Access-conscious: Identical global broadcasting to Baseline (all GWT criteria met). | **Not** phenomenally conscious: TMS disrupts intrinsic cross-modal integration; visual features are processed without interdependent spatial binding. | TMS disruption of occipital-parietal cross-talk | Access unchanged. Phenomenal verdict reverts to "conscious" (integration restored, no dissociation). |

  ---

  **GWT Defender Response & Evaluation:**  
  A GWT defender might argue that genuine "global broadcasting" *requires* the kind of widespread integration disrupted here, so the content in the Intervention isn’t *truly* globally broadcast. This reply **begs the question**. GWT defines broadcasting operationally via functional availability (report, reasoning, WM), which is preserved. Denying broadcasting based on missing phenomenology (via integration) implicitly concedes the access/phenomenal distinction and smuggles phenomenal criteria into the access definition. The reply doesn’t engage the functional dissociation demonstrated.

  **Addressing the Student Objection:**  
  If a student says "You defined phenomenality so it *can’t* be there despite access," clarify: The criterion (*Intrinsic Integration*) isn’t defined *negatively* (e.g., "absence of report"). It’s a positive, mechanistic claim about how phenomenality is realized. We accept similar criteria in other domains (e.g., defining "life" via homeostasis, not just movement). The case shows this mechanism *can* fail while GWT’s functional markers succeed—suggesting the mechanisms for access and phenomenality are dissociable. The burden is on the objector to explain why *only* functional availability matters, or why integration isn’t a plausible mechanism for phenomenality.
