prompt: |-
  Hi — I'm a philosophy PhD student writing a seminar paper on selection vs. enhancement in reproduction, and I want to check a chapter I'm planning to use as a foil before I build an argument on it. It's from a fairly trade-y bioethics book (rather not name it) and it says roughly this:

  "Assisted reproduction now lets prospective parents choose which child to bring into existence, and the principle of procreative beneficence says they are morally required, not merely permitted, to select the child expected to have the best life — the most welfare, the most happiness, the best odds. The argument for this is just the non-identity problem: whichever child we pick wouldn't otherwise have existed, so no one is made worse off by our picking them, and the only thing left for morality to care about is maximizing the wellbeing of whoever does end up existing. Procreative beneficence is thus a new eugenics — and it has been refuted. Selecting against an embryo because it would be disabled expresses the judgment that lives like that one are not worth living; since we all reject that judgment, the principle collapses. Nor does its logic stop anywhere: if you should pick the healthiest of your own embryos, you should also shop around for the healthiest available gamete donors instead of using your own, and you should wait to conceive until better screening technology exists, since that gets you an even better child."

  I'm suspicious of the bit where the non-identity reasoning is doing the arguing, because I had the impression that kind of point is normally used against procreative beneficence rather than for it, but I can't quite say why. Could you go through the passage and tell me what a defender of the principle would accept, what's a tolerable simplification, and what's just wrong or question-begging? And seperately: do the two extensions at the end (donor shopping, delaying conception until screening improves) actually follow from a careful version of the principle, or do they change the case in a way the chapter is missing? That last bit matters most to me, since it's what my paper turns on.
reasoning: |-
  Okay, the user is a philosophy PhD student working on a seminar paper about selection vs. enhancement in reproduction. They've shared a passage from a bioethics book that argues for "procreative beneficence" (PB) based on the non-identity problem, then claims PB collapses because it supposedly implies that disabled lives aren't worth living, and extends this logic to donor shopping and delaying conception. The user is suspicious about how the non-identity problem is used here and particularly cares about whether the extensions are valid.

  First, I need to unpack the passage's structure. The book presents PB as requiring parents to select the child with the best life prospects, justified by the non-identity problem—since the selected child wouldn't exist otherwise, no one is harmed, so maximizing welfare is the only moral concern. Then it argues this is "new eugenics" that's "refuted" because selecting against disability implies such lives aren't worth living. Finally, it extends the logic to donor selection and delaying conception.

  The user's key concerns are:  
  1. Whether the non-identity problem is correctly deployed for PB (they recall it's usually used against PB).  
  2. Whether the "disability objection" fairly represents PB.  
  3. Whether the extensions (donor shopping/delaying) logically follow from PB.  

  Breaking this down:  

  **Non-identity problem as support for PB?**  
  - The non-identity problem highlights that in cases where choices affect who exists (like embryo selection), we can't say a child is "harmed" by being born with a disability because they wouldn't exist otherwise. The book uses this to argue PB is mandatory: since no one is harmed, we should maximize welfare.  
  - But critics (like Parfit) use the same logic to show PB leads to counterintuitive results—e.g., it might require creating a "superior" child instead of a "merely healthy" one. The book later does this with the extensions, but initially frames non-identity as supporting PB. This is a tolerable simplification if presented as one side, but misleading if implied as consensus.  

  **Disability objection as a "refutation"?**  
  - The book claims PB implies disabled lives "aren't worth living," but this is a straw man. PB defenders (like Savulescu) explicitly reject this. PB is about selecting between possible children, not judging existing lives. For example: choosing embryo A (without disability) over B (with) because A has higher expected welfare ≠ saying B's life lacks worth. It's comparative, not absolute. The objection conflates selection with negation of worth—a point PB defenders would firmly reject.  

  **Extensions (donor shopping/delaying conception):**  
  - This is the user's main focus. The book argues PB's logic extends to:  
    - Using the "best" gamete donors (instead of one's own) to create a child with better prospects.  
    - Delaying conception for better future screening to select a "better" child.  
  - A careful defender of PB *would* accept these as logical extensions *if* they uphold strict maximizing: if welfare is the sole criterion, then yes, you should optimize all variables (genetics via donors, timing via tech). Savulescu bites this bullet, acknowledging it might require significant sacrifices (e.g., delaying pregnancy at personal cost).  
  - However, critics see this as reductio ad absurdum: it demands extreme actions (e.g., endless delays, commodifying reproduction), showing PB is too demanding or misprioritizes values. The book uses it to attack PB, but doesn't engage with nuanced defenses (e.g., Savulescu adding reasonableness constraints).  

  **User's deeper needs:**  
  - They likely want to critique the book's argument, especially the extensions, for their paper. Their suspicion suggests they see weaknesses in how the book frames PB and its implications.  
  - Key angles for them:  
    - The extensions *do* follow from a pure maximizing PB, but defenders might moderate the principle (e.g., "significant" welfare differences only).  
    - The disability objection is weak against careful PB formulations.  
    - The book's use of non-identity is one-sided—it's a double-edged sword.  

  **Recommendations for the user:**  
  - Emphasize that the extensions highlight PB's potentially counterintuitive demands, but this doesn't "refute" it—it invites balancing welfare with other values (autonomy, identity).  
  - Note that the book's "disability = not worth living" claim is a misrepresentation; PB operates on comparative welfare.  
  - Suggest exploring how PB defenders handle the extensions (e.g., Savulescu's "Procreative Beneficence: Why We Should Select the Best Children" addresses demands like donor selection).  
  - For their paper's focus: argue that the extensions expose PB's utilitarian rigor, which may conflict with reproductive autonomy or human flourishing—e.g., delaying conception indefinitely ignores the parents' life stage, reducing parenthood to optimization.
answer: |-
  Let's dissect this passage step by step—I'll flag what a defender of procreative beneficence (PB) would accept, what's oversimplified or debatable, and what's outright flawed or question-begging. I'll then focus on your key question about the extensions (donor shopping and delayed conception). For reference, I'm treating PB as defended by philosophers like Julian Savulescu (its main proponent), though I'll note where other interpretations might differ.

  ### Core Analysis of the Passage
  1. **"Assisted reproduction lets parents choose which child to bring into existence..."**  
     - ✅ **Acceptable**: This is a fair description of embryo selection scenarios (e.g., PGD). PB applies here.

  2. **"PB says parents are morally *required* to select the child with the best life prospects..."**  
     - ✅ **Defender's view**: Savulescu explicitly argues for a moral *obligation* (not just permission) to select the embryo with the highest expected welfare. This is central to PB.

  3. **"The argument is the non-identity problem..."**  
     - ⚠️ **Oversimplified/debatable**:  
       - The non-identity problem (Parfit, *Reasons and Persons*) shows that in selection cases, the "worse-off" child isn't *harmed* by being selected (since they wouldn't exist otherwise). PB defenders *use* this to argue that since no one is harmed, we're free to maximize welfare.  
       - **But crucially**: Critics (e.g., David Velleman) argue the non-identity problem *undermines* PB because it severs the link between "better/worse for the child" and selection decisions. PB turns it into a tool for maximizing, but this is contested. The passage presents it as straightforward support, but it's a double-edged sword.

  4. **"PB is a new eugenics—and it has been refuted. Selecting against disability expresses that such lives aren't worth living..."**  
     - ❌ **Flawed/question-begging**:  
       - **Straw man**: PB defenders (Savulescu, Buchanan et al.) explicitly reject that selecting *against* a disability implies disabled lives lack worth. PB is comparative: it claims that *all else equal*, a non-disabled life has higher *expected welfare* than a disabled one—not that disabled lives are "not worth living." The conflation of "worse" with "not worth living" is a common (but invalid) criticism.  
       - **"Refuted" claim**: PB is widely debated but not "refuted." Even critics like Elizabeth Barnes grant that disability critiques don't *refute* PB—they highlight value disagreements (e.g., whether welfare is reducible to health).  
       - **Question-begging**: The passage assumes that rejecting the "not worth living" judgment invalidates PB, but PB doesn't require that judgment. It’s attacking a position PB doesn’t hold.

  ---

  ### Your Key Question: Do the Extensions Logically Follow?
  The passage claims PB implies:
  - **Donor shopping**: Using "the healthiest gamete donors" instead of your own.
  - **Delaying conception**: Waiting for better screening tech to get "an even better child."

  A careful defender of PB **would accept these as logical extensions**—but with caveats. Critics use them as *reductios*; defenders bite the bullet or refine the principle.

  #### Why They Follow (According to PB's Logic)
  1. **The Maximizing Principle is Unbounded**:  
     PB says: "Select the child *expected to have the best life*." It doesn't restrict this to:
     - Your own gametes (unless they yield the best outcome).
     - Current technology (if waiting improves outcomes).
     - Hence, if a donor embryo (or gamete combination) has higher expected welfare than any embryo you could produce with your own gametes, PB obligates you to use it. Similarly, if delaying conception for 2 years allows selection of a child with +20% expected welfare (e.g., via new polygenic risk scores), PB requires waiting.

  2. **Savulescu's Explicit Endorsement**:  
     In "Procreative Beneficence: Why We Should Select the Best Children" (2001), he argues PB *does* extend to:
     - **Donor selection**: If a donor child would have better prospects than a genetically related one, PB prioritizes the former.
     - **Technological delays**: If better tech (e.g., gene editing) is imminent, PB may require waiting to use it. He calls this the "Principle of Procreative Efficiency."

  3. **Non-Identity Consistency**:  
     Since no specific child is "harmed" by choosing donors or delaying (the "better" child wouldn't exist otherwise), the core logic holds.

  #### Caveats and Counterarguments
  - **Demandingness Objection**:  
    Critics argue this makes PB *implausibly demanding* (e.g., always waiting for better tech = infinite delay). Savulescu responds that PB only applies to "reasonable" expectations—but "reasonable" is underspecified. Your chapter exploits this tension.

  - **Welfare Comparisons**:  
    PB assumes we can compare welfare across possible lives. But if gamete donors or future tech create children with *radically different traits* (e.g., enhanced cognition), can we reliably compare welfare? Defenders say yes (e.g., via objective metrics); critics call it speculative.

  - **Other Values**:  
    PB focuses *only* on welfare. But if genetic relatedness, timeliness, or "naturalness" have independent value, PB might be overridden. The passage ignores this—it assumes PB is the *only* principle, which even defenders don’t claim.

  ---

  ### Strategic Advice for Your Paper
  Since your argument hinges on the extensions:
  1. **Use the extensions as a reductio**:  
     Argue that PB’s *unrestricted* maximizing logic leads to absurdity (donor shopping commodifies children; infinite delays defy reproductive autonomy). This is a standard criticism (e.g., by Sparrow, Parker).

  2. **But engage defenders**:  
     Acknowledge that Savulescu accepts the extensions but tries to limit them via:
     - **Significant harm avoidance**: PB prioritizes avoiding large welfare deficits (e.g., disease) over marginal gains.
     - **Practical feasibility**: We can only act on *current* knowledge.
     *Counter*: If PB is truly about maximizing welfare, why exclude marginal gains? And "feasibility" dodges the normative force of "should."

  3. **Target the disability point**:  
     The passage’s claim that PB is "refuted" by disability objections is weak. Focus instead on how PB’s extensions exacerbate ethical problems (e.g., delaying conception disproportionately burdens older mothers).

  4. **Key nuance for your foil**:  
     The chapter conflates PB with *negative eugenics* (eliminating "bad" traits). PB is *positive* eugenics (maximizing "good" traits), which is ethically distinct and harder to dismiss with disability arguments.

  #### Bottom Line
  The extensions **do follow** from a consistent application of PB—that’s why critics use them and defenders struggle to constrain them. Your paper can leverage this to argue PB is either:
  - **Overly demanding** (if you keep the extensions), or  
  - **Arbitrarily limited** (if defenders reject them without principled grounds).  

  For sources, dive into:  
  - Savulescu's original papers for PB's scope.  
  - Rebecca Bennett's critiques on "endless optimization."  
  - Buchanan et al., *From Chance to Choice*, for disability-related nuances.  

  Would you like to discuss how to structure your counterargument or specific passages to cite?
