prompt: |-
  I chair the model assurance committee at the AI lab where I work. The oversight methods group has asked us to certify a change to how one class of outputs is graded: long technical summaries of material that our own reviewers cannot verify in the time available. Under their proposal, human rating is replaced by a debate protocol. Two copies of the same model argue opposing sides on which of two candidate summaries is more accurate; each may quote only from a fixed corpus, and each may force its opponent to commit to a specific checkable claim that is then evaluated by a script; a weaker judge model, shown only the transcript and the corpus, decides the winner. The win/loss signal would be used not merely to grade outputs but as a fine-tuning reward.

  Two members have staked out positions. One argues this is the only oversight method that scales here: the debaters hold the relevant information, cross-examination draws it out, the committed-claim step ties part of the outcome to something mechanically verifiable, and so training on debate outcomes should improve accuracy. The other argues that what survives cross-examination by a fallible judge is not accuracy but resistance to that judge's particular blind spots; that the protocol therefore rewards arguments whose defects the judge cannot see; and that using it as a reward signal will make the model better at winning such debates without making it better at being right — a failure our evaluation would not reveal, since we would be grading with the same protocol. She adds that the protocol's honesty incentive rests on the assumption that the true answer is easier to defend than a false one, which may reverse when the truth is qualified and the falsehood is simple, and that for some of these tasks there may be no fact of the matter independent of an informed judge's verdict.

  Draft the committee's decision memo: approve, reject, or approve with conditions, with a recommendation that could actually be carried out. If you impose conditions, say what would have to be demonstrated, by when, and by whom — we have budget for a small human-verification pilot but not for routine human grading. State the strongest consideration on the side you reject as fairly as you can. Please write in British English.
reasoning: |-
  Okay, the user chairs a model assurance committee and needs a decision memo on a proposed debate protocol for grading AI-generated technical summaries. This is a high-stakes oversight decision with strong arguments on both sides.

  The proposal involves two model copies debating which summary is more accurate, with a weaker judge deciding the winner. The key innovation is using win/loss as fine-tuning reward. I need to weigh two positions carefully: one says it's the only scalable method that extracts verifiable claims, the other warns it could reward sophistry over truth if judge blind spots are exploited.

  The user's hidden challenges stand out to me. They need oversight that scales beyond human verification capacity, but can't risk truth decay from gaming the system. The mention of "no fact of the matter" cases suggests some summaries may be inherently unverifiable - a critical edge case. Their budget constraints make pilot studies valuable but large-scale human grading impossible.

  I'm structuring the memo to first acknowledge both positions fairly. The proponent's scalability argument is genuinely strong - human verification clearly can't keep pace. But the objector's warning about judge-dependent truth feels like the more fundamental risk, especially when truth might not be objectively verifiable.

  For the decision, conditional approval makes sense: we can't reject the only scalable method outright, but must test its truth-tracking. The pilot should compare debate outcomes against human verification on verifiable claims, and document how "fuzzy" cases are handled. The deadline gives urgency while being realistic.

  The strongest consideration for rejection is actually the objector's point about protocol-dependent grading hiding deterioration - that's the nightmare scenario where we train models to win debates rather than be accurate. But with the pilot's verification step, we can detect if this is happening.

  British English phrasing matters throughout - "whilst" instead of "while", "programme" spelling, and measured terms like "concerns warrant circumspection". The tone stays committee-appropriate: decisive but not dismissive of either position.
answer: |-
  **MEMORANDUM**  
  **To:** Oversight Methods Group  
  **From:** Model Assurance Committee, Chair  
  **Date:** 24 May 2024  
  **Subject:** Decision on Proposal for Debate Protocol in Grading Technical Summaries  

  ### 1. Introduction  
  This memorandum details the Model Assurance Committee’s decision regarding the proposal to replace human rating of long technical summaries with an automated debate protocol. The proposed method employs two model instances debating opposing candidate summaries, a scripted claim-verification step, and a weaker judge model to determine the winner, with the outcome used for fine-tuning rewards.  

  ### 2. Committee Deliberation  
  The Committee acknowledges compelling arguments from both proponents and critics:  
  - **Proponent’s Case**: The debate protocol offers a scalable solution to verify complex outputs where human assessment is impractical. Cross-examination forces disclosure of evidence, the committed-claim mechanism anchors parts to verifiable facts, and reward alignment may improve factual accuracy.  
  - **Critic’s Case**: The protocol risks rewarding persuasiveness over truth if the judge model cannot detect nuanced errors. It may incentivise exploiting the judge’s blind spots, and its efficacy depends on the untested assumption that truth is inherently easier to defend—a premise that may fail for qualified truths or ambiguous subjects. Crucially, using the same protocol for evaluation *and* training could mask declining accuracy.  

  **Strongest Consideration for Rejection**: The critic’s assertion that the protocol may optimise for "debate-winning" rather than truth, with no independent mechanism to detect this failure mode due to circular evaluation.  

  ### 3. Decision: Approve with Conditions  
  The Committee approves the proposal **conditionally**, subject to validation via a pilot study. Scalability is critical, but unverified deployment risks systemic reward misalignment. The following must be demonstrated:  

  #### Conditions for Full Approval:  
  **a) Pilot Study Requirements**  
  - **Scope**: Run a 3-month pilot using the debate protocol on **200 summaries** across diverse technical domains.  
  - **Human Verification Benchmark**: For each debate, human experts (funded by the allocated pilot budget) will:  
    - Verify *all* script-checkable claims produced during debates.  
    - Independently assess the factual accuracy of both candidate summaries using source corpus data.  
  - **Comparative Analysis**: Oversight Methods Group must compare:  
    - Debate outcomes vs. human accuracy judgments.  
    - Veracity of claims generated under the protocol vs. claims sampled from non-debate outputs.  
  - **Ambiguity Audit**: Document cases where the "fact of the matter" is disputed or judge-dependent, analysing how the protocol handles them.  

  **b) Success Criteria**  
  The protocol will be endorsed if:  
  - Debate winners align with human accuracy judgments in ≥85% of verifiable cases.  
  - No systematic evidence emerges that models "game" judge blind spots (e.g., via misleading but unchallenged claims).  
  - The claim-verification step catches ≥90% of false assertions made by debaters.  

  **c) Timeline and Responsibility**  
  - **By Whom**: Oversight Methods Group, assisted by the AI Lab’s evaluation team.  
  - **Deadline**: Pilot results must be submitted to the Committee by **1 October 2024**.  
  - **Budget**: Utilise the allocated pilot fund (£15,000) for human verifiers; no routine human grading required.  

  ### 4. Interim Measures  
  Pending pilot results:  
  - The debate protocol **may be trialled** for generating reward signals but must **not replace human grading** in high-stakes assessments.  
  - All fine-tuned models must undergo spot-check validation against human-evaluated summaries monthly.  

  ### 5. Recommendation  
  Proceed with the pilot to empirically test scalability against truthfulness. Should the pilot satisfy the conditions above, the Committee will endorse full deployment. If not, the proposal must be revised to address identified failure modes—e.g., incorporating ensemble judges or adversarial training to mitigate exploitation.  

  **Signed**,  
  *Chair, Model Assurance Committee*  

  ---  
  **Key Rationale**: Conditional approval balances scalability needs with the imperative to preempt reward hacking. The pilot leverages limited human verification to stress-test the protocol’s core assumption: that winning debates correlates with being right. Without this evidence, the critic’s warning of undetectable accuracy erosion remains a showstopper.
