answer: |-
  ### Research Programme Renewal Decision Procedure  
  Based on Lakatos's methodology, this checklist evaluates whether a research programme is *progressive* (generating novel discoveries) or *degenerating* (avoiding challenges). Answer sequentially; terminate if any **Terminate** condition is met. If unclear, escalate to panel judgment.  

  ---

  #### **FRONT PAGE: CHECKLIST FOR SCIENTISTS**  
  **Step 1: Core Stability**  
  *Question: Has the group’s central idea (the "hard core") been weakened to avoid contradictions?*  
  - **Yes** (e.g., core claims became vaguer, narrower, or shifted without new predictions): → **Core-softening detected** (negative). Proceed to Step 2.  
  - **No** (core is unchanged or strengthened with new testable predictions): → Positive. Proceed to Step 2.  
  - **Unclear**: → Flag concern. Proceed to Step 2.  
  *Why this matters: A stable core is essential. Softening without progress suggests evasion.*  

  **Step 2: Protective Belt Adjustments**  
  *Question: Did changes to the programme’s supporting theories (the "protective belt") generate testable predictions?*  
  - **Yes, and predictions were confirmed**: → Check if confirmation used **independent methods** (outside the programme’s own tools):  
    - **Independent**: → Strong positive. Proceed to Step 3.  
    - **Programme-dependent only**: → Weak positive (risk of self-contained science). Proceed to Step 3.  
  - **Yes, but predictions are untested**: → Check if a **feasible test plan exists** (specific timeline/method):  
    - **Plan exists**: → Neutral. Proceed to Step 3.  
    - **No plan**: → Degenerating (ad hoc). → **Terminate**.  
  - **No predictions generated** (only explains past data): → Degenerating (ad hoc). → **Terminate**.  
  - **Unclear**: → Proceed to Step 3 but flag risk.  

  **Step 3: Overall Progress**  
  *Question: Did the programme deliver novel, unexpected facts OR credible plans for imminent tests?*  
  - **Novel fact(s) confirmed** (not just reinterpretations): → Positive. → **Renew**.  
  - **No novel facts, but valid reason** (e.g., technical delay) **AND credible plan** (specific timeline/milestone): → Neutral. → **Renew (conditional)**.  
  - **No novel facts AND no credible plan**: → Degenerating. → **Terminate**.  
  - **Unclear**: → Escalate to panel.  

  **Step 4: Judgment Calls**  
  *If any answer is "unclear" or outcomes conflict, escalate to the panel for values-based judgment.*  
  - **Examples for panel**:  
    - The programme is degenerating but is the field’s only trained capacity.  
    - Core-softening occurred, but the programme trains critical talent.  

  **Decision Summary**  
  - **Terminate** if: Step 2 finds "no predictions + no plan" OR Step 3 finds "no novel facts + no credible plan".  
  - **Renew** if: Step 3 finds "novel facts" OR "no facts + credible plan".  
  - **Panel judgment** if: Uncertainties persist or values trade-offs arise (e.g., field capacity, training impact).  

  ---

  #### **LAKATOSIAN MAPPING (FOR PHILOSOPHERS)**  
  - **Step 1** → Hard core integrity. Core-softening = retreat to avoid falsification (degenerating).  
  - **Step 2** → Protective belt adjustments. Ad hoc-ness graded:  
    - Independent testability = progressive (Lakatos’s "ad hoc₃").  
    - Programme-dependent testability = weakly progressive ("ad hoc₂").  
    - No predictions/untestable = degenerating ("ad hoc₁").  
  - **Step 3** → Problem-shift evaluation. Novel facts = progressive; excuses without progress = degenerating.  
  - **Judgment calls** → Values beyond MSRP (e.g., field health, training).  

  ---

  ### WORKED EXAMPLES  
  **A. Immune Mechanism Group**  
  - **Step 1**: Core unchanged → Positive.  
  - **Step 2**: Belt adjustments generated predictions (confirmed), but all in low-risk tissues (avoiding flagship goal). Confirmation independent → **Weak positive** (self-contained risk: only "novel" in safe areas).  
  - **Step 3**: No delivery on flagship prediction (repeated delays), no credible plan → **Terminate**.  
  *Why you won’t like it*: They look productive but avoid core challenges.  

  **B. Signal Detection Group**  
  - **Step 1**: Core stable → Positive.  
  - **Step 2**: No predictions yet (detector unfinished) → No termination. Proceed.  
  - **Step 3**: No novel facts, but credible plan (detector in 18 months; clear success/failure criteria) → **Renew (conditional)**.  
  *Outcome*: Renewal with strict milestone monitoring.  

  **C. Regulatory Principle Group**  
  - **Step 1**: Core softened (→ "regulatory principle") without new predictions → **Negative**.  
  - **Step 2**: No belt adjustments specified → Assume no predictions → **Terminate**.  
  *Why*: Core-softening with no compensating progress.  

  ---

  ### WHAT THIS PROCEDURE HANDLES  
  1. **Not just "count predictions"**: Step 3 separates "no results due to delays" (renew) from "no results due to evasion" (terminate). "Can’t tell yet" → Renew with conditions.  
  2. **Core-softening**: Step 1 flags weakening; if paired with no progress → Terminate. Legitimate refinements require new predictions (Step 2).  
  3. **Self-contained predictions**: Step 2 downgrades programme-dependent confirmations (weak positive). Over time, this risks degeneration.  
  4. **"We don’t know" defaults**:  
     - Step 1/2 "unclear" → Proceed but escalate if unresolved.  
     - Step 3 "unclear" → Escalate to panel. No default renewal.  

  ### LIMITATIONS  
  - **Blind spots**: Cannot evaluate strategic value (e.g., killing the only group in a field). Escalate to panel.  
  - **Judgment calls**: Steps 1 (core-softening) and 2 (testability) require interpretation. The procedure flags concerns but relies on panel for ambiguity.  
  - **Systemic issues**: Rewards groups that "game" milestones; penalizes high-risk programmes unfairly. Mitigated by panel escalation.  

  **Deliverable**: 2 pages, no philosophy jargon. Scientists can use it in 3–4 hours.  
  **Why not falsificationism**: Lakatos allows programmes time to overcome anomalies (unlike Popper). This avoids premature termination of high-risk work.
