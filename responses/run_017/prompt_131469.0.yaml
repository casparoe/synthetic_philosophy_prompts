     However, note that Lakatos distinguishes between the hard core (which is fixed) and the protective belt (which is adjustable). So if the core is being changed, that might be a sign of degeneration.

     We must design a question to detect core-softening. The problem is that sometimes a core might be refined in a way that is a legitimate development (e.g., from a vague idea to a more precise one) and sometimes it is a retreat.

     Proposed question: 
     **Question 1: Has the hard core of the programme been restated in a way that weakens its original claims (e.g., by making it more vague, or by restricting its domain without empirical justification) without generating new, testable predictions?**
        - Yes: This is core-softening. Flag as a sign of degeneration. Proceed to Question 2 but note that this is a strong negative indicator.
        - No: Proceed to Question 2.
