     (We'll have to combine the answers at the end.)

  2. **Protective Belt Adjustments**: How has the protective belt been adjusted? We are looking for ad hoc adjustments versus those that generate novel predictions.

     Lakatos distinguishes three levels of ad hoc-ness (addressing issue 3):
        - Ad hoc1: The adjustment is not independently testable (i.e., it can only be tested within the programme and has no new implications).
        - Ad hoc2: The adjustment is testable but has not yet been tested.
