  We are creating a decision procedure based on Lakatos's methodology of scientific research programmes (MSRP) for evaluating the renewal of research groups. The procedure must be presented as a checklist in plain language, with a mapping to Lakatosian terms at the end. It must address the four specific issues raised and be applied to three example cases.

  The core of Lakatos's MSRP:
  - A research programme has a "hard core" of fundamental assumptions that are treated as unfalsifiable by the researchers.
  - It has a "protective belt" of auxiliary hypotheses that can be adjusted to protect the hard core from anomalies.
  - The programme is "progressive" if it leads to the discovery of novel facts (i.e., facts that were not used to construct the theory and are not just reinterpretations of existing facts). 
  - It is "degenerating" if it only accommodates known facts without predicting novel ones, or if it adjusts the protective belt in an ad hoc manner to save the core without generating new predictions.

  The checklist will have a series of questions. At each step, we decide whether to renew, terminate, or pass the decision to the panel (when it's a value judgment). We must also handle the four specific issues.

  Checklist Structure:

  1. **Core Integrity Check**: Has the hard core of the research programme remained stable? 
     - If the core has been restated in a way that weakens it (core-softening) without a clear rationale, that's a red flag (addressing issue 2).
