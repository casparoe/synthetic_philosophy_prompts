  Here is the finalized essay question, model answer, marking scheme, and requested analysis, incorporating your specifications and addressing potential pitfalls.

  **Final Essay Question (Handout Form):**

  **Sykaminon's chreia-unit and Aristotle's Theory of Money**

  Aristotle writes (NE V.5, 1133a-1133b):
  > (A) "Hence all commodities exchanged must be able to be compared in some way... money constitutes in a manner a middle term... a measure of all things... It is therefore necessary that all commodities shall be measured by some one standard... this standard is in reality demand... But demand has come to be conventionally represented by money... because it does not exist by nature but by custom (nomos)..."  
  > (B) "Now money serves us as a guarantee of exchange in the future... it ensures that exchange shall be possible when a need arises... Money then serves as a measure which makes things commensurable... our demand furnishes a sufficiently accurate common measure for practical purposes... There must therefore be some one standard, and this accepted by agreement (which is why it is called nomisma, customary currency)..."

  Consider the case of Sykaminon:
  1.  **The chreia-unit:** To stabilize value after a bad harvest, Sykaminon decrees that all contracts, fines, taxes, and prices are reckoned in a "chreia-unit." This unit is defined by statute as a fixed basket of necessities (grain, oil, wine, firewood, a cloak) for twenty years. **No coin denominated in chreia-units is ever struck.** Payment occurs in silver staters, with the daily exchange rate (silver staters per chreia-unit) posted in the agora.
  2.  **The Loan:** Merchant Kleinias lends 100 chreia-units, repayable as 110 chreia-units in one year. Repayment is made in silver staters at the posted daily rate on the repayment date. Over the year, the posted rate (silver staters per chreia-unit) rises by exactly 10%.

  **Analyze this case using Aristotle's account of money and exchange from *Nicomachean Ethics* V.5 (passages A & B above) and his critique of usury in *Politics* I.10. Specifically address:**
      a.  **Functionality:** Which core function(s) of money described by Aristotle (measurement enabling proportionate requital / guarantee of future exchange) can the chreia-unit perform? If only one function is viable, assess whether Aristotle’s theory of reciprocal justice can function adequately without the other.
      b.  **Representing Demand:** Is the chreia-unit a better or worse representation of "demand" (the "real standard" in NE V.5) than conventional money (like silver staters) according to Aristotle's *own criteria*? Consider his arguments about demand's variability, the conventional nature of money, commensurability as "sufficiently accurate," and his suggestion that prices should be fixed. Does Sykaminon’s reform achieve Aristotle’s aims or undermine reciprocal justice?
      c.  **Usury & Tokos:** Is Kleinias's loan "tokos" (usury, breeding money from money) as Aristotle condemns in *Politics* I.10? Separate the 10% increment in *chreia-units* from the 10% change in the *silver exchange rate*. Explain which element(s) of Aristotle's critique apply (denomination vs. actual outcome) and why.

  *Your answer should be approximately 700 words. Base your arguments solely on the texts provided above and the relevant sections of the Politics.*
  ---
  **Model Answer (Approx. 700 words):**

  Sykaminon's experiment with the chreia-unit tests the coherence and limits of Aristotle’s theory of money. By separating the unit of account from the medium of exchange, the case forces us to examine which functions Aristotle deems essential and whether his system can accommodate such a split.

  **(a) Functionality:** Aristotle assigns money two intertwined roles: (1) a *measure* enabling proportionate requital in exchange (NE 1133a), making diverse goods commensurable via demand ("the real standard") and facilitating diagonal conjunction (e.g., builder : shoemaker :: shoes : house); (2) a *guarantee* ("symbol") of future exchange, something tangible held and "produced in payment" later (NE 1133b). The chreia-unit can perform the first function: it serves as the agreed-upon standard ("nomisma") measuring value in contracts and prices, attempting to fix proportionate requital based on a defined basket of necessities. However, it fundamentally *cannot* perform the second function. As it never circulates ("no coin... is ever struck"), it cannot be held as a "guarantee" for future exchange. Payment occurs *in silver*, requiring constant conversion via the posted rate. Aristotle explicitly links money’s role as a guarantee to its physical nature – something "we can produce in payment." The chreia-unit lacks this physicality and inherent exchangeability. Can reciprocal justice function without the guarantee? Arguably not, or only precariously. Reciprocal justice relies on ongoing association sustained by exchange ("no exchange there would be no association," NE 1133b). Without a reliable, tangible guarantee facilitating deferred exchange when needs arise, the association itself is jeopardized. While the chreia-unit fixes ratios *now*, it offers no inherent assurance for fulfilling obligations *later*; that assurance depends entirely on the volatile silver market and the state’s enforcement of the daily rate. Aristotle’s system requires both functions for stable, just association.

  **(b) Representing Demand:** While aiming to anchor value in "necessaries," the chreia-unit is arguably a *worse* representation of "demand" (the "real standard") than conventional money, according to Aristotle’s own principles. Aristotle insists demand is the true measure, *represented* conventionally by money (nomisma). Crucially, he notes demand fluctuates: "if men cease to have wants or if their wants alter, exchange will go on no longer, or will be on different lines" (NE 1133a). Sykaminon fixes the basket defining demand for *twenty years*. This ossifies demand, preventing the unit from reflecting actual changes in what people value or need over time. Aristotle acknowledges the conventional measure is only "sufficiently accurate for practical purposes" precisely *because* it adapts to shifting demand through use. A fixed basket cannot adapt; it imposes a legal fiction of constant demand. While Aristotle floats the idea of fixed *prices* ("the proper thing is for all commodities to have their prices fixed," NE 1133b), he means prices fixed *in terms of the conventional money*, not prices fixed *by anchoring the money unit itself to an immutable physical standard*. His call for price stability presupposes a flexible *nomisma* mediating variable demand. By trying to legislate demand itself via a fixed basket, Sykaminon makes reciprocity *more* conventional and artificial than Aristotle allows, undermining the "sufficiently accurate" link to real, dynamic demand necessary for his conception of commensurability and justice.

  **(c) Usury & Tokos:** Kleinias's loan *is* tokos, despite the silver outcome. Aristotle condemns usury (*tokos*, "offspring") in *Politics* I.10 (1258b) because money’s natural purpose (*telos*) is facilitating exchange (metadosis), not breeding more money. Usury makes money "productive" unnaturally, deriving gain "from the currency itself" rather than from the goods it procures. The denomination, not the metallic outcome, tracks Aristotle's primary complaint. Kleinias contracts for a return *in chreia-units* (100 -> 110), regardless of the silver rate. He aims to profit purely from the loan agreement denominated in the abstract unit of account, not from any productive use of the silver lent. The 10% rise in the silver rate is coincidental; Kleinias would gain silver even if the rate fell (provided it didn't fall more than 10%), and crucially, he contracted for the unit increment *irrespective* of the rate. The gain comes "from the currency itself" – here, the stipulated chreia-unit, which functions *as* the contractual currency/nomisma. The fact that he ends up with only the *same amount of silver* he lent (due to the offsetting rate rise) is irrelevant to the structure of the contract Aristotle critiques. Aristotle's objection targets the *intention* and *mechanism* of breeding units of account, seeing it as a perversion of money’s exchange-facilitating role. The denomination defines the "money" in the contract, making its increase tokos. The actual medium of settlement (silver) merely executes the terms defined by the unit of account.
