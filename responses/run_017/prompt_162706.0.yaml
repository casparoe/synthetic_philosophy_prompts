  *   **Confidence Levels:** High confidence (0.85-0.9) on points directly challenged by the case against Aristotle's explicit claims (demand variability vs. fixed basket, nomisma defined by agreement). Slightly lower confidence (0.7-0.8) on stronger claims about *necessity* (guarantee for justice) or the *primary* target of the tokos critique (denomination), though these are the most coherent interpretations based on the texts.
  *   **No Significant Pushback Needed:** The case effectively tests the specified doctrines without requiring historically implausible assumptions of Aristotle. Students must grapple with tensions Aristotle himself identifies (stability vs. variability, nature vs. convention, measure vs. medium) applied to a novel configuration. It avoids being answerable by simple doctrine recital.
