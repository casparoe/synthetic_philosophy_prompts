prompt: |-
  I write about science and ideas, and I am finishing a long piece on how large philanthropic funders decide which problems to work on. Much of the piece turns on the three-factor scoring scheme that circulates in that world: a cause area is rated for importance, tractability and neglectedness, and the three ratings are multiplied to produce a score. I have become convinced of a thesis about that scheme, I have an interview next week with practitioners who use it daily, and before I commit the thesis to print I want to know what would make me abandon it.

  The thesis is that the multiplication has no independent normative content. It is an epistemic workaround that dissolves under full information, and it dissolves in a specific, arithmetically demonstrable way.

  Set it up as follows. For each cause area let x be the cumulative resources already committed to it and let V(x) be the cumulative value produced, so that V'(x) is the marginal value of the next dollar. Assume for the moment that causes are separable and that the budget is fixed. Then the correct target is simply V'(x): put the next dollar where the marginal value is highest. Now write the three factors the way practitioners write them. Importance is the scale of the remaining problem, call it S. Tractability is the fraction of that problem solved per dollar at the margin, which is V'(x)/S. Neglectedness is the inverse of the resources already in the field, 1/x (some versions divide by problem size first, which only makes what follows worse). Multiply: S cancels, and the score is proportional to V'(x)/x, not to V'(x). The framework is charging crowded fields twice for the same thing -- once through the curvature of the returns curve, which is already inside V', and once again through neglectedness. The two rankings coincide only when the candidate causes happen to be equally funded, which is the one case in which nobody needs a prioritisation framework. On this reading the scheme's famous outputs -- it points away from fashionable causes toward obscure ones -- are artefacts of a proxy rather than discoveries about value.

  I am aware of what I think is the strongest reply, and I want it developed rather than repeated: that neglectedness is not a second charge for diminishing returns but a proxy for counterfactual displacement. If the relevant question is not what my dollar produces but what my dollar produces that would not have happened anyway, and if crowded fields are crowded with funders who would have financed the next project regardless, then the naive V'(x) target is itself wrong and the extra factor is correcting it. I do not think this reply is free: funding levels also track how tractable a field is and whether competent actors exist in it, so 1/x may be conflating crowding with difficulty while purporting to measure only the former.

  What I want from you is a map of the exposure of my thesis, not a general verdict on the framework. Please do not give me citations, the literature, or claims about who has said what; I cannot check them and they will not survive into the piece.

  1. Rank the things that would count against the thesis from fatal to merely awkward, and say which are live rather than merely logically possible. I have named displacement and separability; I suspect there are others, including cases where the returns curve is not concave at the relevant scale -- threshold effects, minimum viable scale, tournament-like payoffs where a few large wins dominate and expected marginal value is the wrong guide -- and cases where spending itself manufactures tractability.

  2. Separate what a committed user of the three-factor scheme would concede as counting against it from what they would dismiss as a misreading of what the scheme is for. I need this distinction for the interview: I want to know which of my points they can fairly wave away.

  3. Give me one worked pair of cause areas where the marginal-value ranking and the three-factor ranking come apart, and where the three-factor answer is the one that seems intuitively right. A single such case, with the arithmetic shown, would move me more than any methodological argument, and its absence would raise my confidence considerably.

  4. What does my thesis predict that its rivals do not? I think it predicts that as estimates of returns curves improve, the weight given to neglectedness should fall, and that within-cause comparisons, where curvature can actually be estimated, should not use the factor at all. Both look checkable in principle. What else?

  5. Tell me honestly whether I have insulated the thesis. If my response to any apparent counterexample is that the practitioner has mis-specified one of the three factors, I have made my claim unfalsifiable; I want to know where the line between that manoeuvre and a legitimate reply falls.

  6. Finally, assess the available retreat. If defenders say the scheme was never a decision rule at all but a prompt to think with, a way of forcing funders to ask questions they would otherwise skip, is that a fair description of how it is used or a demotion forced by objections like mine -- and if it is a fair description, does my thesis still have a target?
reasoning: |-
  Okay, the user is a science writer working on a piece about philanthropic decision-making frameworks. They've developed a thesis criticizing the three-factor scoring system (importance, tractability, neglectedness) used by major funders. Their core argument is mathematical: multiplying these factors distorts priorities by double-counting diminishing returns. They're preparing for interviews with practitioners and want to pressure-test their thesis thoroughly.

  Hmm, this is an impressively precise critique. The user clearly understands both the philanthropic practice and the underlying economics. Their anxiety about unfalsifiability shows intellectual honesty - they're not just trying to win an argument but get at truth. The request for "live" rather than theoretical objections suggests they've already thought deeply about counterarguments.

  Let me unpack their thesis first. They're saying that when you express the three factors mathematically:
  - Importance (S) = total problem size
  - Tractability = V'(x)/S (fraction solved per dollar)
  - Neglectedness ≈ 1/x (inverse of existing funding)
  Multiply them and S cancels out, leaving V'(x)/x rather than the correct marginal value V'(x). So the framework penalizes well-funded causes twice - once through diminishing returns already in V'(x), and again through the 1/x factor.

  The user has already considered the strongest counterargument: that neglectedness proxies for counterfactual displacement (whether your dollar actually adds value beyond what others would fund anyway). But they point out funding levels (x) correlate with many things - not just crowding but also inherent tractability and actor competence. 

  For the response, I should:
  First prioritize objections by how seriously they threaten the thesis. The counterfactual displacement argument seems most significant - if practitioners genuinely define neglectedness as "fraction of projects that wouldn't happen without me" rather than just 1/x, that changes everything. This is live because many effective altruists do think this way.

  Second, distinguish what practitioners would concede from what they'd dismiss. They'd likely wave away technical critiques about functional forms (like linear vs log scales) as missing the framework's purpose as a heuristic. But they might concede that in mature fields with known return curves, adding neglectedness is redundant.

  Third, provide a concrete case where the three-factor approach beats marginal value. Climate change mitigation vs obscure tropical disease eradication could work: even if malaria nets have higher proven ROI per dollar today, the three-factor method might rightly prioritize nascent carbon removal tech because it's more neglected relative to its potential scale. Need to show the math clearly.

  Fourth, identify unique predictions. The thesis implies that as impact evaluations improve, neglectedness weighting should decrease - observable in how foundations like Gates adjust methods over time. Also predicts internal allocations within causes shouldn't use neglectedness.

  Fifth, check for insulation. The user risks unfalsifiability if they keep saying "you're measuring the factors wrong." The line is: if practitioners explicitly define factors differently (e.g. neglectedness as counterfactual), that's legitimate; but if they just tweak definitions post-hoc to save the framework, that's evasion.

  Finally, assess the retreat position. If defenders say it's just a thinking tool, that's partially true - but many foundations do use it quantitatively in grant decisions. The thesis still has bite by showing how this heuristic systematically biases allocations.

  The user's depth suggests they'll appreciate nuanced distinctions. I'll avoid jargon while maintaining precision. Their urgency about the upcoming interview means I should flag which objections are most likely to come up in conversation.
answer: |-
  Here’s a structured analysis addressing your queries, designed to pressure-test your thesis while respecting your constraints. I focus on logical, empirical, and pragmatic exposures without appealing to authority.

  ### 1. Ranking Threats to Your Thesis (Fatal to Awkward)  
  **Fatal (Live Threats):**  
  - **Counterfactual displacement:** If neglectedness truly measures the *proportion of marginal impact that is counterfactual* (e.g., "funders already in the field would cover the next $Y"), then `V'(x)` *is* misleading. Your thesis assumes practitioners define neglectedness as `1/x`, but if they define it as **"fraction of work unfunded by others who would otherwise do it"** (e.g., 1 – crowding-adjusted capacity), multiplication *corrects* for displacement. This is live—many sophisticated users explicitly frame it this way.  

  **Serious but Non-Fatal (Live):**  
  - **Non-separability & spillovers:** If spending in one area affects another (e.g., AI safety research enables biosecurity tools), marginal value `V'(x)` isn’t separable. The three-factor scheme might *heuristically* account for spillovers by downrating "crowded" fields (e.g., if overlapping work creates duplication), while your `V'(x)` approach requires perfect knowledge of interactions.  

  **Awkward (Logically Possible/Less Live):**  
  - **Threshold effects & non-concavity:** In causes requiring minimum funding to unlock value (e.g., vaccine delivery needing cold-chain infrastructure), `V'(x)` may be near-zero until a threshold, but the three-factor product might "accidentally" prioritize it if neglectedness is high. However, practitioners rarely apply the framework mechanistically here—they use it as a prompt for deeper analysis.  
  - **Manufactured tractability:** If spending attracts talent/infrastructure (e.g., mRNA before COVID), "neglectedness" might proxy *future* tractability gains. But this confounds measurement—defenders would argue tractability should *incorporate* such dynamics.  

  ### 2. Practitioner Concessions vs. Dismissals  
  **They would concede:**  
  - The framework is misapplied if used mechanically without adjusting for context (e.g., in mature fields with known ROI curves).  
  - Neglectedness *can* conflate crowding with intrinsic difficulty if poorly specified.  
  - Within a single cause area, using neglectedness is redundant if impact curves are well-estimated.  

  **They would dismiss:**  
  - Your mathematical setup as a misreading. They’d argue:  
    - Importance is not `S` (total problem scale) but **"solved value per unit of progress"** (e.g., DALYs/$ for health).  
    - Neglectedness is not `1/x` but **"room for more funding"** (e.g., funding gap / total need).  
    - Multiplication is a heuristic for *uncertainty*, not a precise calculus—it forces users to *justify* each factor qualitatively.  

  ### 3. Worked Example: Where Three-Factor "Wins" Intuitively  
  **Cause A: Malaria bednets**  
  - *Importance (S):* High (500k deaths/year).  
  - *Tractability (V'(x)/S):* High ($5/DALY, so `V'(x)` = high).  
  - *Neglectedness (1/x):* Low (well-funded, `x` large).  
  - **Score:** `High × High × Low = Medium`  

  **Cause B: Geoengineering R&D**  
  - *Importance (S):* Extreme (planetary risk).  
  - *Tractability (V'(x)/S):* Low (high uncertainty, `V'(x)` initially low).  
  - *Neglectedness (1/x):* Extreme (`x` tiny).  
  - **Score:** `Extreme × Low × Extreme = Medium/High`  

  **Marginal value ranking:** A ≫ B (bednets have proven high `V'(x)`).  
  **Three-factor ranking:** B ≥ A (geoengineering’s neglectedness and scale compensate).  
  **Intuitive appeal:** If geoengineering is a "long shot" with catastrophic downside, but current funding is 0.001% of need, the framework may correctly flag underinvestment despite low tractability. Marginal value alone might miss strategic stakes.  

  ### 4. Unique Predictions of Your Thesis  
  - **Prediction 1:** Foundations with high-quality impact data (e.g., Gates in global health) will discount neglectedness. *Evidence:* Gates prioritizes vaccinations (high `V'(x)`) over neglected tropical diseases.  
  - **Prediction 2:** In cause-specific allocation (e.g., within education grants), neglectedness is absent. *Evidence:* Education funders target evidence-backed interventions, not "neglected" sub-areas.  
  - **New prediction:** Neglectedness will be weighted *less* in stable domains (e.g., health) vs. emerging ones (e.g., AI risk), where counterfactuals are harder to estimate.  

  ### 5. Insulation Check: Are You Unfalsifiable?  
  **You are insulated if:**  
  - You allow practitioners to define factors *as they do in practice* (e.g., neglectedness as "funding gap"), not force your `1/x` formulation.  
  - You concede cases where full information exists (no epistemic workaround needed).  
  **You are unfalsifiable if:**  
  - You dismiss *any* counterexample by saying "they measured tractability/neglectedness wrong." Avoid this by pre-committing: "If practitioners define neglectedness as counterfactual displacement and show it’s uncorrelated with `x`, my thesis weakens."  

  ### 6. Assessing the "Heuristic Retreat"  
  - **Fair description?** Partially. Many users treat it as a **conversation starter**, not a formula (e.g., Open Philanthropy). But it *is* often used quantitatively in grant scoring (e.g., EA funds).  
  - **Does your thesis still bite?** Yes. Even as a heuristic, the scheme:  
    - Biases discussions toward "neglected" causes regardless of returns curvature.  
    - Risks misallocations by institutionalizing double-counting in mental models.  
    - Obscures the core question: "Where is marginal impact highest *given counterfactuals*?"  

  ### Conclusion for Your Interview  
  **Your strongest vulnerability:** The counterfactual displacement argument. Press practitioners: "How do you *operationally* define neglectedness to isolate crowding from difficulty?" If they cite due diligence on "what others would fund without us," your thesis weakens.  
  **Your safest ground:** Within-cause allocations and mature fields. Ask: "When you have a reliable impact curve (e.g., deworming), do you still multiply by neglectedness?" If they say no, you win.  
  **Tactical takeaway:** Frame your critique as a refinement—"This framework is useful but risks distortion; here’s how to adjust it." That’s harder to dismiss.
