answer: |-
  ## Teleosemantic Pluralism in Repurposed Sensory Systems: A Defence

  **Brainstorming the Dialectic:**
  - *Core Claim:* A1 firing state has (at least) two contents: bat-presence (for vestigial consumer) and male-call (for new consumer).  
  - **Objection 1: Historical Move (Bat is *the* proper function)**  
    *Reject:* Ignores *current* stabilising function and treats vestigial consumers as irrelevant despite structural presence.  
  - **Objection 2: Producer-Proliferation Move (What explains receptor spread?)**  
    *Reject:* Circular/indeterminate in repurposed systems; receptor’s spread *now* depends on mate-finding, not bat-avoidance.  
  - **Objection 3: Specificity Move (Pick the most demanding Normal conditions)**  
    *Reject:* Fails when Normal conditions conflict (bat-avoidance demands *predator* specificity, mate-finding demands *conspecific* specificity).  
  - **Pluralist Constraints:** Content ascription requires (1) an *actual* consumer system, (2) with a *current* stabilising function, (3) for which the signal *covaries* with conditions under Normal explanation.  
  - **Misrepresentation Defence:** Error occurs within a *specific consumer context* when input frustrates *that* consumer’s function.  
  - **Waterfall Verdict:** Error relative to mate-finding consumer (frustrates reproduction), not a new "waterfall-content".

  ---

  ### Argument: Pluralism and the Moth’s A1 Firing

  Teleosemantics (Millikan, Dretske, et al.) seeks to naturalise mental representation by defining content via biological function: a state represents what it is *supposed to correspond to* under a Normal explanation of how its production and consumption historically contributed to fitness. Your moth case exposes a critical flaw in assuming content *uniqueness* when evolution repurposes a structure while leaving vestiges. I’ll defend your pluralist claim: A1 firing carries multiple contents, indexed to distinct consumers.

  **1. Dismantling the Historical Move**  
  The historical move insists the A1 receptor’s *original* proper function (detecting bats) defines its content exclusively. Bat-detection was indeed the derived proper function that spread the trait ancestrally. However, teleosemantics requires more than historical origins; it requires an account of how a trait’s function *stabilises* its presence. Crucially, **stabilisation can shift**. In the cave moths, bat-avoidance confers *zero* current fitness benefit. The vestigial dive-circuit exists, but its motor degeneration means A1 firing *cannot* fulfil the bat-avoidance function. There is no current consumer *able* to consume the signal for its original purpose. Conversely, the phonotaxis consumer *is* actively maintained by selection: females using A1 firing to find mates outreproduce those who don’t. This satisfies Millikan’s condition for a "stabilising proper function" – the *current* reason the receptor persists. To privilege historical function over current stabilising function is to make content ascription inertially historical, detached from the organism’s present biological reality. Vestigial wiring doesn’t sustain a *current* representational link just by existing.

  **2. Dismantling the Producer-Proliferation Move**  
  This move suggests we ask: "Which consumer explains why *the producer* (A1 receptor) is here now?" The answer seems neat: mate-finding, as bats are absent. However, this relies on a flawed causal isolation. The receptor wasn’t *re*-selected *de novo* for mate-finding; it was co-opted precisely *because* its existing response profile (sensitivity to 20-50kHz ultrasound) happened to correlate with male clicks. Its current proliferation depends *entirely* on the new phonotaxis consumer. But crucially, the *mechanism enabling* this – its tuning – is a legacy of its bat-detection history. Asking "why is the producer here?" *presupposes* we can neatly separate the producer’s properties from the consumers utilising them. In repurposed systems, the producer’s very suitability is parasitic on its old function. More damningly, the vestigial bat-avoidance consumer *also* contributes (albeit negatively) to the receptor’s persistence: its *failure* to cause costly dives might marginally favour retaining the receptor. The proliferation move collapses into indeterminacy or ignores the vestigial consumer’s structural reality.

  **3. Dismantling the Specificity Move**  
  Perhaps content is defined by the most specific set of "Normal conditions" under which the consumer system functions properly. For the vestigial bat-avoidance consumer, the Normal condition is the presence of an *echolocating bat* (a specific predator). For the phonotaxis consumer, it’s the presence of a *courting conspecific male* (a specific mate). These are incommensurably specific along different dimensions (predator vs. mate). Which specificity "wins"? Bat-avoidance demands distinguishing bats from other loud sounds (like waterfalls or males) to avoid fatal dives. Phonotaxis demands distinguishing male clicks from bats *or* waterfalls to find mates. Neither consumer’s Normal explanation inherently prioritises one specificity over the other; they serve orthogonal biological goals. Imposing one specificity arbitrarily ignores the other consumer’s distinct teleology. Teleosemantics defines content relative to *a* function; forcing a single "most specific" content across functions is incoherent.

  **Defending Pluralism: Constraints and Misrepresentation**  
  Pluralism doesn’t make content "cheap." Content ascription is constrained:

  1.  **Actual Consumer System Requirement:** A content exists *only if* there is a current, structurally realised consumer mechanism (a "device" in Millikan’s terms) that utilises the signal. We cannot ascribe "waterfall-content" because there is no consumer system *for which* waterfall sounds are a Normal condition for fulfilling its function.
  2.  **Current Stabilising Function:** The consumer must be actively maintained by selection *now*. The vestigial bat-avoidance circuit *exists*, but its motor degeneration means selection no longer maintains its *behavioural output*. Its "bat-content" is a historical relic, not a currently stabilised representational link. The phonotaxis consumer *is* currently stabilised.
  3.  **Covariance under Normal Explanation:** For a state S (A1 firing) to represent C (e.g., bat/male) for consumer X, there must be a Normal explanation where S covaries with C such that X’s consumption of S fulfils X’s function. A1 firing *does* covary with male clicks under Normal conditions for the phonotaxis consumer. It *would have* covaried with bats for the vestigial consumer, but this covariance is no longer utilised or stabilised.

  **Resolving Misrepresentation and the Waterfall Case**  
  Misrepresentation is consumer-relative. A state misrepresents when it occurs *in a context that frustrates the function of the consumer system interpreting it*. For the *phonotaxis consumer*:
  *   Its stabilising function is to guide females to mates for reproduction.
  *   Its Normal explanation involves A1 firing being caused by conspecific male clicks, leading to successful location and mating.
  *   When A1 firing is caused by the waterfall, the phonotaxis consumer operates (the female orients and flies), but its function is *frustrated*: she drowns instead of mating. This is a clear case of **error relative to the mate-finding content**. The waterfall isn’t "male-ish"; it’s a false positive *for the mate-finding system*.

  The vestigial bat-avoidance consumer isn’t functional, so its "content" doesn’t generate current misrepresentations. A waterfall sound *would* have been a misrepresentation *for it* (if it were functional), falsely indicating a bat where there was none, potentially causing a costly dive. But since the motor output is gone, no such error occurs.

  **Verdict on the Waterfall Females:** Their phonotaxis system suffers a *representational error*. The A1 firing state, carrying the "male-call" content for the active phonotaxis consumer, misrepresents the waterfall sound *as* a male call. This error has real selective costs (drowning), explaining why the trait isn't optimal. It’s *not* simply a case of the signal having a third "waterfall content"; no consumer system utilises the signal under a Normal explanation where waterfalls contribute to fitness.

  **A Brief Reservation (as requested):**  
  While I defend this pluralist reading as the most honest application of teleosemantic machinery to your case, I harbour a concern. Pluralism risks *proliferation* if applied too loosely – e.g., does every minor neural feedback loop constitute a "consumer" with its own content? Your constraints (actual structure, current stabilisation, covariance under Normal explanation) are essential bulwarks. However, the status of *vestigial but structurally present* consumers remains philosophically tense. If we grant them only "historical content," does that content genuinely *exist* now, or is it merely a description of past design? Your case pushes teleosemantics towards needing a richer account of how layered histories manifest in current function. Nevertheless, within mainstream teleosemantic resources, your pluralist interpretation stands as the most coherent response to this fascinating biological scenario. The A1 firing state truly is Janus-faced, reflecting both its deep history and its current utility.
