  Now, the two sentences on strict conditionalization:

  A strict conditionalizer would assign likelihoods to her total experience. The experience is a particular sensory input, and she would update by conditioning on the proposition that her total evidence is that input. In this case, the experience has bearing on both E and C, and it so happens that the likelihood for the experience is such that it is more likely to occur when (E and not C) is true, and less likely when (E and C) is true. This would lead her to a posterior that is (approximately) the same as the fine Jeffrey update, with the posterior on the four cells proportional to the prior times the likelihood for the experience. Hence, she lands with (c) rather than (b).

  Now, briefly:

  **Load-bearing feature**: The reversal occurs because the evidence E is not just uncertain, but its meaning is deeply entangled with the channel C. In the off-channel case (¬C), a positive test (E) is very bad news for H (because it is likely a false positive from a machine that is not just noisy but systematically misleading). When the experience makes both E and ¬C very likely, it drives down P(H). But the coarse partition update assumes that the conditional probabilities P(H|E) and P(H|¬E) are unchanged, which is not true because the experience also changes the distribution over C, which in turn affects the interpretation of E.

  **Removal test (uninformative off-channel)**: If the off-channel reading were merely uninformative about H (rather than adverse), then P(H|E,¬C) would be around the prior P(H). In that case, the fine update would not reverse the sign; it would only attenuate the increase in P(H) from the coarse update.

  **Jeffrey partisan's reply**: The Jeffrey partisan might say that you applied the coarse rule to a partition that is not rigid; the partition {E, ¬E} is evidentially heterogeneous because the conditional probability P(H|E) is not stable under the change in beliefs about C. The rule requires rigidity, and if it fails, you must use a partition that is sufficiently refined to ensure rigidity. This reply, however, concedes that the rigidity condition is what makes the rule work, and choosing the right partition is essential, which is the thesis.

