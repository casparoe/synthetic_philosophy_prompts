  ### Scenario: Hospital Blood Test  
  Dr. Avery assesses a patient for a rare disease (\(H\), prior \(P(H)=0.05\)) using a blood test. The test result (\(E\)) is positive, but the lab uses two machines: a reliable one (\(C\)) and an unreliable one (\(\neg C\)) that *systematically misreports* positives for healthy patients. Due to a chaotic mix-up, Avery glimpses the report, raising \(P(E)\) to \(q=0.85\) (prior \(P(E)=0.235\)) and slashing \(P(C)\) from 0.8 to 0.18.  

  ### Joint Distribution Over \(H \times C \times E\)  
  | Cell | Probability |  
  |-------|-------------|  
  | \(H, C, E\) | 0.0396 |  
  | \(H, C, \neg E\) | 0.0004 |  
  | \(H, \neg C, E\) | 0.0001 |  
  | \(H, \neg C, \neg E\) | 0.0099 |  
  | \(\neg H, C, E\) | 0.0076 |  
  | \(\neg H, C, \neg E\) | 0.7524 |  
  | \(\neg H, \neg C, E\) | 0.1881 |  
  | \(\neg H, \neg C, \neg E\) | 0.0019 |  
  *No zeros, all probabilities clinically plausible.*  

  ### Verdicts  
  - **(a) \(P(H|E)\)**: \(0.1686 > 0.05\) (above prior).  
  - **(b) Coarse Jeffrey update** (partition \(\{E, \neg E\}\)):  
    \(P_{\text{new}}(H) = P(H|E) \cdot 0.85 + P(H|\neg E) \cdot 0.15 = 0.1453 > 0.05\).  
  - **(c) Fine Jeffrey update** (partition \(\{E, \neg E\} \times \{C, \neg C\}\)):  
    \(P_{\text{new}}(H) = \sum P_{\text{new}}(\text{cell}) \cdot P(H|\text{cell}) = 0.0425 < 0.05\).  
  *Gap: \(|0.1453 - 0.0425| = 0.1028 > 0.1\).*  

  ### Strict Conditionalizer  
  A strict conditionalizer assigns likelihoods to her *total experience* (e.g., the specific visual input). This experience is likelier under \((E, \neg C)\) than \((E, C)\), as the glimpse suggests machine error. Her posterior matches (c) because she conditions on the experience’s evidential profile, which ties \(E\) to \(C\).  

  ### Load-Bearing Feature  
  Reversal hinges on **evidential heterogeneity**: \(E\)’s meaning depends critically on \(C\). When \(C\) fails, \(E\) isn’t just noisy but *adverse* (\(P(H|E, \neg C) = 0.0005 \ll P(H)\)). The coarse update assumes rigidity for \(\{E, \neg E\}\), but this fails because the experience shifts \(C\), altering \(E\)’s import.  

  ### Uninformative Off-Channel Test  
  If \(\neg C\) made \(E\) *uninformative* (e.g., \(P(H|E, \neg C) \approx P(H) = 0.05\)), reversal would not occur. The fine update would *attenuate* (b)’s increase but not reverse it, as \(E\) would never be bad news.  

  ### Jeffrey Partisan’s Reply  
  *"You applied Jeffrey’s rule to \(\{E, \neg E\}\), which isn’t rigid. The experience renders \(E\) and \(C\) interdependent, so rigidity fails. Use a refined partition for stability—user error, not rule failure."*  
  **Concession?** Yes. This admits rigidity is the *sine qua non*: it forces partition choices that align with evidence’s causal structure, proving the condition does the work.  

