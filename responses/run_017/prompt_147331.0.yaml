prompt: |-
  I chair the heritage advisory committee of a town of roughly nine thousand people. Among other things we maintain about forty public markers and plaques, one permanent exhibit, and a short booklet used in the local schools. Around a dozen times a year we are asked to adjudicate a conflict of a specific kind: a community — a family, a neighbourhood, a nearby nation whose oral history touches our sites — remembers something about a person, event, or place, and the documentary record we can actually lay hands on either contradicts it, or is silent, or says something compatible in outline but different in point, attribution, or intent. We are seven volunteers, we meet for two hours a month, none of us is a professional historian, and every decision has to be written down on one page.

  The friction is structural. The state heritage office, which has to approve any marker, will not let us assert as fact anything the surviving record contradicts; it will accept almost anything phrased as attribution. The communities whose memory is in question tend to experience that same phrasing — remembered by, according to tradition, oral history holds — as one more iteration of being disbelieved by people who hold the paper. So hedging is not a neutral fallback for us; it has a history, and sometimes the thing actually remembered is that history. I want a procedure, not a position statement on whether memory or history should give way, because I have to do this repeatedly and I would rather be consistently wrong in a way I can explain than right by instinct.

  What I need from you is a decision procedure my committee can run on a proposal in under forty minutes: the questions in order, what would count as a sufficient answer to each, the point at which the procedure stops with a no, and — importantly — the points at which it stops and hands the decision to a person because the remaining question is one of values rather than evidence. The output of the procedure should be three things: what the marker may assert outright, what it may present only with its source attached (remembered by, recorded as), what it must omit; a single sentence of rationale; and a flag for the cases that have to go to a public meeting rather than to us.

  Three things I want built into it, and I want you to say if you think any of them is a prejudice rather than a requirement.

  First, I think there are three registers of conflict, not one: the record is silent where memory speaks; the record and memory make incompatible claims about the same event; and the two agree on what happened but disagree about who did it or why. There is, I think, a fourth that does not fit anywhere — cases where what the community remembers is not the event but the record's own bad faith about the event, and where the archive has in fact been shown on some other occasion to have been falsified or selectively kept. Tell me whether that fourth is genuinely distinct and what it does to the procedure when it is present.

  Second, I do not think the two directions of giving way are symmetric in cost, even when they are symmetric in evidence. A correction entered in a catalogue is cheap, durable, and read by almost nobody; a correction to what a community says in public is expensive, partial, and may not survive the people who hear it. Should the procedure weigh that asymmetry, or is that a corruption of it — the point at which a committee stops asking what is true and starts managing a constituency? This is the part I expect to be hardest to settle, and I would rather have the tension stated than resolved with a slogan.

  Third, we have a standing rule, inherited and never argued for, that we will not substitute a documented name for a remembered one on a marker even when we are confident the documented name is right — we will add, annotate, or put the two side by side, but not replace. I want to know whether that rule is defensible in principle or whether we are just being superstitious, and if it is defensible, where exactly it stops: does it cover dates, numbers of dead, intent attributions?

  Then run the procedure on three proposals, showing your work at each step.

  One: a founding plaque from the 1920s credits the town's establishment to a named settler in a named year. A neighbouring nation's oral history holds that the site was a seasonal gathering place used before and after that date; a single land-office map from two years after the recorded founding shows two structures already standing where the plaque says the settler built. Nothing in the record mentions the gathering place at all.

  Two: a factory fire. The community has always said fourteen workers died; the coroner's register lists nine, and names nine. Oral accounts name the other five, describe them as itinerant workers hired off the books, and say their deaths were never recorded because the company's payroll burned with them. No payroll survives.

  Three: a neighbourhood remembers that flood relief in the early 1960s was deliberately withheld from it, and says so on an unofficial marker it erected and maintains itself. The relief files show a delay of eleven days, an administrative misrouting, and no documentary trace of an intention to withhold from anybody. The same archives were shown thirty years ago to have destroyed a different set of files concerning the same neighbourhood.

  I expect the procedure to return an answer on the third case that I will not like, and I want it stated without being softened. Finally, tell me plainly what the procedure cannot do: which of these disputes are not the kind of thing a checklist can settle, and what we should do with those.
reasoning: |-
  Okay, the user chairs a heritage committee dealing with conflicts between community memory and documentary records. They need a practical decision procedure for adjudicating these disputes efficiently. Let me unpack this carefully.

  First, the core problem: structural friction between state requirements (only verifiable facts) and community experiences (oral histories dismissed). The user explicitly wants a procedural tool—not philosophical debates—that respects three key complexities: different conflict types, asymmetry in correction costs, and their existing naming rule.

  Hmm... Their three built-in requirements need analysis:
  1. The conflict typology makes sense—silence vs contradiction vs attribution differences. That fourth category (remembering archival bad faith) is indeed distinct because it questions the record's legitimacy itself. This requires separate handling in the procedure.

  2. The asymmetry point is crucial. Correcting archives is technically easy but socially inert; correcting community memory is socially costly. The procedure should acknowledge this without letting it override evidence—perhaps by flagging high-stakes cases for public consultation.

  3. Their naming rule feels defensible as harm mitigation. Forcing name replacement risks symbolic violence, even when documents "win." But this principle shouldn't extend to dates/numbers where precision is possible without erasure (e.g., "at least nine documented, community recalls fourteen").

  For the procedure design... Efficiency is key (40min max). Need clear exit points: when evidence gaps hit "values" questions, kick to public meeting. Outputs must include exact wording tiers (assert/attribute/omit), rationale sentence, and public meeting flags.

  Testing with their examples:
  - Founding plaque: Can't assert settler's "firstness" due to map evidence. Can attribute both stories. Silent gathering place? Attribution phrasing covers that.
  - Factory fire: Documented 9 deaths must stand. Can add "community recalls 14" with context about unrecorded labor. The payroll gap creates space for this.
  - Flood relief: Trickiest. Files show delay was bureaucratic, not intentional. But archived destruction 30y prior? That meets "bad faith" threshold—so this case gets the public meeting flag. User won't like it, but the procedure forces transparency here.

  Biggest limitation: This can't resolve deep ontological clashes (e.g., "what counts as history?"). Those require facilitated dialogue—which the procedure usefully flags via the public meeting trigger. Also, it won't satisfy parties demanding absolute vindication; it's designed for "least harmful arbitration."

  ...The user's depth of reflection here is impressive. They recognize that consistency matters more than perfection in governance. My response should mirror that pragmatism while naming painful trade-offs.
answer: |-
  Here is a procedural framework designed for your committee's constraints, incorporating your requirements while explicitly addressing their complexities. The procedure is structured as a sequential checklist with clear exit points, designed to be completed in **under 40 minutes** per proposal. It prioritizes **evidence assessment** first, then **values/impact considerations**, and finally **output drafting**.

  ---

  ### **Decision Procedure: Memory-Record Conflict Assessment**
  **Input**: A proposal involving a conflict between community memory and documentary records.  
  **Output**:  
  1. **Wording Tiers**:  
     - ✅ **Assert Outright**: Fact meets state heritage standards (recorded, uncontradicted).  
     - ⚠️ **Attribute with Source**: Phrased as "oral history holds," "according to tradition," etc.  
     - ❌ **Omit**: Contradicted by record or insufficient evidence.  
  2. **Rationale**: One standardized sentence explaining the decision.  
  3. **Public Meeting Flag**: ☑ Yes / ☐ No (Triggers if values conflict outweigh evidence resolution).  

  ---

  #### **Step 1: Conflict Typology (5 mins)**  
  *Classify the dispute. Determines subsequent steps.*  
  - **A. Record silent; memory speaks** → Proceed to Step 2.  
  - **B. Record and memory contradict on facts** → Proceed to Step 3.  
  - **C. Agreement on event; conflict on attribution/intent** → Proceed to Step 4.  
  - **D. Memory claims record is in bad faith** → **☑ Flag for Public Meeting**. *Stop here.*  
    *(Rationale: This is distinct. It questions the archive’s integrity, requiring broader community dialogue beyond evidence review.)*  

  #### **Step 2: Assess Record Silence (10 mins)**  
  *For Type A (silent record).*  
  - **Question**: Is memory plausibly consistent with broader historical context?  
    - **Sufficient Answer**: Yes (e.g., aligns with known practices/events). → **⚠️ Attribute with Source**.  
    - **No/Unclear** → **❌ Omit**.  
  - **Exit Point**: If no plausible context → **❌ Omit**.  
  - *Values Handoff*: None. Purely evidence-based.  

  #### **Step 3: Assess Direct Contradiction (10 mins)**  
  *For Type B (contradictory claims).*  
  - **Question 1**: Is the record contemporaneous and reliable?  
    - **No** (e.g., biased source, later copy) → **⚠️ Attribute BOTH record and memory**.  
    - **Yes** → Proceed.  
  - **Question 2**: Does memory offer new evidence (e.g., archeology, alternate documents)?  
    - **Yes** → **⚠️ Attribute BOTH**.  
    - **No** → **✅ Assert record; ❌ Omit memory**.  
  - **Exit Point**: Stop at "No" for Q2 → **✅ Assert record; ❌ Omit memory**.  
  - *Values Handoff*: None.  

  #### **Step 4: Assess Attribution/Intent Conflict (10 mins)**  
  *For Type C (same event, disputed who/why).*  
  - **Question**: Does the record explicitly state intent/attribution?  
    - **Yes** → **✅ Assert record attribution**.  
    - **No** → **⚠️ Attribute memory’s version**.  
  - **Exit Point**: If record is explicit → **✅ Assert record**.  
  - *Values Handoff*: None.  

  #### **Step 5: Asymmetry & Impact Assessment (5 mins)**  
  *Applied AFTER evidence steps.*  
  - **Question**: Would asserting/omitting memory cause disproportionate harm (e.g., erasure of marginalized voices, ongoing trauma)?  
    - **Yes** → **☑ Flag for Public Meeting**.  
    - **No** → Proceed to output.  
    *(Rationale: This weighs social cost, not truth. *Not a corruption* – it acknowledges heritage’s ethical role. But it must trigger public input, not override evidence.)*  

  #### **Step 6: Apply Naming Rule**  
  *Standing rule: Never replace remembered names with documented ones.*  
  - **Defensibility**: **Defensible** as harm mitigation. Forcing replacement validates archival power over lived experience.  
  - **Scope**: Applies **only to names of people/groups**. *Does not apply* to dates, numbers, or intent.  
    *(Rationale: Names are identities; dates/numbers are measurable facts. Intent requires attribution.)*  

  ---

  ### **Test Cases: Procedure Applied**  
  **Key**:  
  ✅ = Assert Outright  
  ⚠️ = Attribute with Source  
  ❌ = Omit  
  ☑ = Public Meeting Flag  

  ---

  #### **Case 1: Founding Plaque**  
  - **Step 1**: **Type B** (Contradiction: "settler built first" vs. map showing prior structures).  
  - **Step 3**: Q1 – Map is contemporaneous/reliable? **Yes**. Q2 – New evidence? **No** → ✅ Assert record’s founding date/settler; ❌ Omit "first builder" claim.  
  - **Step 5**: Harm? **Yes** (erases Indigenous presence) → ☑ **Flag for Public Meeting**.  
  - **Naming Rule**: N/A.  
  - **Output**:  
    - ✅ Settler founded town in [year].  
    - ⚠️ "Oral history describes this site as a seasonal gathering place for [Nation]."  
    - ❌ "First builder" claim.  
    - **Rationale**: *Map evidence contradicts settler’s "first" claim; oral history added per silence protocol.*  
    - **Public Meeting**: **Yes** (harm asymmetry).  

  ---

  #### **Case 2: Factory Fire Deaths**  
  - **Step 1**: **Type B** (Contradiction: 9 vs. 14 deaths).  
  - **Step 3**: Q1 – Coroner’s register reliable? **Yes**. Q2 – New evidence? Testimony + plausible context (unrecorded labor) → ⚠️ Attribute both.  
  - **Step 5**: Harm? **Yes** (erases victims) → ☑ **Flag for Public Meeting**.  
  - **Naming Rule**: **Applies**. List 9 documented names; add ⚠️ "Community recalls five others: [names]."  
  - **Output**:  
    - ✅ "Nine deaths recorded: [names]."  
    - ⚠️ "Oral histories recall fourteen deaths, including unrecorded itinerant workers."  
    - ❌ No omission.  
    - **Rationale**: *Coroner’s record reliable; community account plausible given labor practices.*  
    - **Public Meeting**: **Yes** (harm asymmetry).  

  ---

  #### **Case 3: Flood Relief Withholding**  
  - **Step 1**: **Type D** (Memory claims record’s bad faith + proven archive destruction). → **☑ Flag for Public Meeting IMMEDIATELY**.  
  - **Procedure Stops**. *Output deferred to public process.*  
  - **Unsoftened Rationale**: *Allegations of archival bad faith require community deliberation, not committee arbitration.*  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Resolve deep ontological conflicts** (e.g., "Is oral history equal to documents?").  
  2. **Force reconciliation** where evidence and memory are irreconcilable. It only determines *what can be inscribed*.  
  3. **Replace public accountability** in Type D (bad faith) cases or high-harm scenarios.  
  4. **Satisfy all parties** – it prioritizes transparent, consistent arbitration over consensus.  

  ### **For Unresolvable Cases**:  
  - Use the **Public Meeting Flag** to shift from *adjudication* to *facilitated dialogue*. The committee’s role becomes synthesizing input, not deciding truth.  

  --- 

  This procedure systematizes evidence review, embeds ethical guardrails (e.g., asymmetry assessment), and honors your naming rule while clarifying its limits. It converts tension into auditable steps – ensuring you’re "consistently wrong" (or right) for defensible reasons.
