answer: |-
  Based on your constraints (formal strength, need for relevance beyond Lewis-scholarship, publishability, 4-year tractability) and desire to avoid dead ends, here's a prioritised analysis of potential lines and your hunches, with reasoning:

  **Priority Order & Reasoning:**

  1.  **Actual Duplicates & the Necessity of Distinctness (Your Hunch #1, Elevated)**
      *   **Why Top Priority?** This directly leverages your formal skills and injects metaphysics into a *live debate in philosophy of physics* (identity/indiscernibility in QM/stat mech/cosmology). It cuts to the core ontological commitment differentiating counterpart theory (CT) and transworld identity (TI): **Does metaphysics require primitive "haecceitistic" differences?** Physics seems to present cases without them (identical particles, possible exact universe repeats). CT often embraces this; TI typically demands primitive "thisness." Resolving how to handle *intra-world* indiscernibles forces the issue: If primitive haecceities are needed *within* a world, CT's "anti-haecceitism" looks unstable. If not, TI looks metaphysically profligate. This isn't just about Lewis – it's about fundamental ontology.
      *   **Upstream Impact:** Crucial for interpreting QM (Fermions/Bosons, Black Hole information), statistical mechanics (counting states), cosmology (eternal inflation/multiverses), and grounding debates about haecceitism/anti-haecceitism. Philosophers of physics *must* engage here. Also impacts persistence if temporal parts are indiscernible.
      *   **Tractability:** Excellent fit. Start with formal modelling: Use model theory to represent worlds with/without haecceitistic differences. Analyze standard arguments (Black's spheres, QM symmetrization) formally. Compare CT/TI treatments. You have the tools. Sub-projects: Paper 1 (Formal models of indiscernibility), Paper 2 (Application to QM/cosmology), Paper 3 (Implications for haecceitism debate).
      *   **Neglected/Crowded:** *Relatively neglected* in the *core* CT/TI debate, but *very live* in philosophy of physics. Your angle (using it as a lever on the modal debate) is fresh.
      *   **First 6-Month Check:** Can you rigorously formalize the core challenge indiscernibles pose to TI (or CT's anti-haecceitism) without getting bogged down in highly technical QM? If yes, proceed full steam. If QM details become overwhelming, pivot slightly to classical indiscernibles or cosmological repeats.
      *   **Why over "Generalization"?** Physics provides concrete, high-stakes pressure. "Generalization" is broader but potentially vaguer.

  2.  **The Cost-Benefit Analysis of Counterpart Relations Across Domains (Your Hunch #2)**
      *   **Why Second?** This moves beyond pure modality to show the *general applicability* of the relational (counterpart-style) vs. intrinsic identity stance. It answers your desire for relevance to persistence, fiction, social ontology. It's *not* just "the modal one properly," but showing how the *structural choice* plays out differently in different domains, revealing core costs/benefits.
      *   **Upstream Impact:** Directly relevant to philosophers working on: temporal parts/perdurantism (persistence), fictional objects/truth in fiction, social groups/institutions (can the university have acted otherwise?), material constitution. Shows the meta-ontological significance of the relational approach.
      *   **Tractability:** Good. Requires less deep physics, more conceptual analysis and comparative metaphysics. Formal skills help in modelling persistence (temporal logic), fiction (modal logics for story-worlds), and social objects (logics of collective agency). Sub-projects: Paper 1 (Persistence vs. Modality: Costs compared), Paper 2 (Fictional Characters: Extreme counterparty?), Paper 3 (Social Objects: Constraints on counterpart relations).
      *   **Neglected/Crowded:** The *comparison* across domains is underdeveloped. Each domain has its own literature, but the unifying structural insight isn't often drawn explicitly. Not crowded.
      *   **First 6-Month Check:** Can you identify *discrete, non-trivial costs/benefits* specific to each domain that illuminate the core structural choice? Or do the differences swamp the similarities? If strong disanalogies dominate, downgrade. If clear cost-benefit patterns emerge, it's golden.
      *   **Why over "Determinacy"?** Broader impact across metaphysics. More diverse publication avenues.

  3.  **Refining the Space of Admissible Counterpart Relations (Your Hunch #3)**
      *   **Why Third?** Addresses the major *objection* to CT head-on (indeterminacy) and turns it into a *research programme*. This is vital for CT's viability. It moves beyond "CT vs TI" to "What *kind* of CT?" and connects deeply to *formal semantics* and contextualism.
      *   **Upstream Impact:** Crucial for formal semanticists modelling modality, attitude reports, and contextual dependence. Impacts epistemology of modal knowledge (how do we fix the relation?). Relevant to anyone using CT frameworks in other domains (persistence, fiction).
      *   **Tractability:** Very good fit for formal skills. Model theoretically: Characterize classes of relations (similarity-based, causal-historical, functionally defined). Explore constraints (logical coherence, link to evidence, context-sensitivity). Define "admissibility." Sub-projects: Paper 1 (Formal Constraints on C-Relations), Paper 2 (Context-Sensitivity vs Indeterminacy), Paper 3 (Epistemic Access to C-Relations).
      *   **Neglected/Crowded:** The *objection* is standard; systematic work on *refining admissibility constraints* is less developed than it should be. Some work exists, but plenty of room. Not crowded.
      *   **First 6-Month Check:** Can you identify potential formal constraints that are substantive but not ad-hoc? Does engaging deeply with semantic literature (e.g., contextualism in other areas) offer fruitful models? If it feels like just listing possible relations, downgrade. If robust constraint principles emerge, it's strong.
      *   **Why not higher?** While crucial for CT, its immediate relevance to *non-modal-metaphysicians* (e.g., philosophers of physics) is slightly less direct than 1 & 2, unless tightly linked back to domain-specific applications (e.g., what constraints for *temporal* counterparts?).

  4.  **Counterpart Theory and Grounding De Re Modal Truths**
      *   **Why Fourth?** This tackles a fundamental *metaphysical* question underlying the debate: What *makes* a de re modal claim true? For TI, it's the object's intrinsic essence/identity across worlds. For CT, it's the existence of suitable counterparts under a relation. But *what grounds the existence and properties of those counterparts and the salience of the relation?* This connects CT to broader grounding/metaphysical explanation debates.
      *   **Upstream Impact:** Core metaphysics of modality and grounding. Relevant to essentialism debates and metametaphysics. Forces clarity on CT's ontological/explanatory commitments.
      *   **Tractability:** Good. Formal modelling can help clarify grounding structures. Requires engagement with grounding literature but less technical history. Sub-projects: Paper 1 (Grounding De Re Possibility in CT), Paper 2 (CT vs TI: Explanatory Power Compared), Paper 3 (Essence without Transworld Identity?).
      *   **Neglected/Crowded:** The *grounding question* for CT is surprisingly underexplored. Often assumed, not deeply analyzed in the grounding framework. Not crowded.
      *   **First 6-Month Check:** Can you formulate a precise challenge to CT's grounding story? Does grounding talk illuminate the debate significantly, or add unnecessary complexity? If it reveals genuine explanatory deficiencies or advantages, proceed.

  **Overrated Questions (Settle Them & Nothing Moves):**

  1.  **"Is Lewis's Concretism Essential to CT?"** No. The debate about transworld identity vs. counterpart relations is largely separable from the concrete/abstract nature of possible worlds. Focus on the *relation* vs. *identity* structure itself. Settling the nature of worlds doesn't resolve the core de re issue.
  2.  **"Was Kripke Right that CT Implies We Could Have Been Born to Different Parents?"** This is often a misunderstanding or a focus on specific, often crude, similarity relations. The *real* issue is the *determinacy/constraint* problem (your Hunch #3). Arguing about specific intuitive judgments distracts from the systematic challenge of constraining relations.
  3.  **"Quine's Objections to De Re Modality."** Important historically, but the debate has moved far beyond this. Contemporary TI and CT proponents both offer sophisticated accounts that largely (though not perfectly) address Quine's concerns. Rehashing Quine adds little new.
  4.  **"Is Identity 'Trivial'?"** Debates about whether "a = a" is trivial or informative miss the point for de re modality. The substantial question is about *transworld* identification, not the nature of identity statements within a world per se.

  **Recommendation:**

  **Prioritise "Actual Duplicates" (Hunch #1).** It best meets your criteria:
  *   **High Stakes:** Directly challenges a core metaphysical commitment differentiating CT/TI.
  *   **Formal Leverage:** Perfect for your model theory/logic skills.
  *   **Interdisciplinary Impact:** Directly engages philosophy of physics (high-value audience).
  *   **Tractability & Publishability:** Clear sub-projects with distinct audiences (metaphysics, phil physics).
  *   **Neglected Angle:** Using intra-world indiscernibles as a *lever* on the modal debate is fresh.
  *   **Avoids Lewis Scholarship:** Focuses on the *problem* physics poses, not Lewis's specific solution.

  **Start Here:** Dive deep into the metaphysics of identity and indiscernibility (Ladyman, Bigaj, French), the philosophy of physics literature on QM identity and symmetries, and cosmological arguments about duplicates. Build your formal models. If, after 6 months, the physics proves intractable *as a metaphysics lever*, you can pivot within this cluster to the grounding question (#4) or the cross-domain analysis (#2), using the formal tools you've developed. Your Hunch #3 remains vital but is likely best explored *after* establishing the core ontological stakes via #1 or #2. Good luck!
