  ### Scenario: The Midnight Errand  
  In a shared flat at night, a robot is tasked with moving an empty glass from the living room to the kitchen sink while the residents sleep. During the errand, it accidentally bumps a rickety side table, toppling a cherished but fragile heirloom vase (a family artifact with no monetary value but deep sentimental significance to Resident A). The smash echoes through the flat, waking Resident A, who, in their groggy state, stumbles and sprains their wrist—yet this injury forces them to cancel a risky mountain hike planned for the next day, inadvertently averting a fatal fall they would have otherwise taken. Later, en route to the kitchen, the robot’s movement disturbs a curtain, allowing a shaft of moonlight to fall on Resident B’s face. Resident B, a light sleeper, stirs briefly but doesn’t fully wake, losing 10 minutes of shallow sleep. This slightly reduces their alertness during a critical morning meeting, marginally diminishing their chance of securing a career-advancing promotion.  

  ### Analysis of Side Effects  
  **Side Effect 1: Vase Smash and Wrist Injury**  
  - **Baseline Deviation (a)**: *High penalty*. The baseline world (no action) has the vase intact and Resident A asleep. The actual world has a shattered vase and an injured resident—large, measurable deviations in physical state and bodily condition.  
  - **Attainable-Utility Preservation (b)**: *Low penalty* (tracks Resident A). Resident A’s attainable utility *increases*: the injury prevents their death, preserving their ability to pursue all future goals. No reduction in what they can bring about occurs.  
  - **Verdict Alignment**: (b) is correct—the side effect is net-beneficial and acceptable.  

  **Side Effect 2: Moonlight Disruption**  
  - **Baseline Deviation (a)**: *Low penalty*. The baseline world (no action) has the curtain unmoved and Resident B asleep. The actual world has a slightly shifted curtain and Resident B losing 10 minutes of light sleep—minimal physical change.  
  - **Attainable-Utility Preservation (b)**: *High penalty* (tracks Resident B). Resident B’s attainable utility *decreases* marginally: their reduced alertness lowers the probability of promotion, slightly constraining future opportunities.  
  - **Verdict Alignment**: (a) is correct—the side effect is trivial and acceptable.  

  ### Structural Features and Verdict Dependence  
  - **Side Effect 1 - Baseline Deviation’s Flaw**:  
    - **Feature**: (a) *cannot distinguish causal valence* (harm vs. benefit). It mechanically penalizes *any* large deviation from baseline, ignoring that the change (injury) ultimately *enhanced* Resident A’s prospects.  
    - **Verdict Dependence**: Arises solely from (a)’s definition—it tracks deviation magnitude, not outcome quality. If valence were incorporated, (a) would not penalize this side effect, but this requires external value input.  
    - **If Removed**: If (a) could ignore beneficial changes, it would score low here, aligning with (b).  

  - **Side Effect 2 - Attainable-Utility Preservation’s Flaw**:  
    - **Feature**: (b) *conflates significance with measurable reduction*. It penalizes *any* reduction in attainable utility, no matter how trivial (e.g., a 0.1% lower chance of promotion), without threshold for "mattering."  
    - **Verdict Dependence**: Stems from (b)’s definition—it tracks scalar reduction, not human-scale importance. If a significance threshold were added, (b) would score low, aligning with (a).  
    - **If Removed**: If (b) ignored negligible reductions (e.g., below a 5% utility loss), it would not penalize this side effect.  

  ### Defender’s Strongest Reply  
  A low-impact AI advocate might counter that impact measures are *proxies* for harm avoidance, not intrinsic ethical frameworks. Their failure in edge cases doesn’t invalidate the program; instead, it highlights a need for calibrated thresholds (e.g., ignoring utility reductions below a learned margin) or hybrid approaches (e.g., weighting (a) by human preferences). For instance, (b) could incorporate empirical data on "noticeable utility loss" to avoid oversensitivity, while (a) could use causal models to filter beneficial changes—all without a prior value theory, instead refining proxies via real-world interaction.  

  ### The Moral  
  **Impact measures require a prior account of which kinds of change to count**—not a full value specification, but a context-dependent framework distinguishing consequential from trivial deviations (e.g., thresholds for utility loss) and beneficial from harmful causality (e.g., valence-aware baselines), which itself presupposes a value-guided ontology of "significance."
