prompt: |-
  I build evaluation infrastructure for language models — graders, rubrics, harnesses — and I have no philosophy training beyond a few blog posts about argument mapping. I have been trying to work out whether the debate approach to supervising models on questions we cannot judge ourselves (two models argue for opposite answers, a weaker judge picks the winner) can survive the obfuscated-arguments problem. I ended up with an argument whose conclusion I am confident is false, and I cannot find the broken step. I would like it located and priced.

  Some vocabulary, so the steps are checkable. Call the protocol a cross-examination ladder. Each side defends its answer with a tree: the root is the answer, every node is a claim, and a claim either bottoms out in a primitive the judge can verify in one step or is decomposed into two or three supporting claims. Each round someone picks an open leaf, and the side that owns it must either expand it or concede it. The judge has a total budget of B expansions; when the budget is gone it awards the win to the tree with fewer unconceded open non-primitive leaves, and on a tie it judges the open leaves for plausibility. Call a claim a hard leaf when it is true but its shortest verification is long: a subtotal over ten thousand terms, step four thousand of a program trace, one link in a long chain of custody. Hard leaves are the obfuscated-arguments problem in miniature, because on them the honest side cannot bottom out in primitives either.

  (1) In a cross-examination ladder the judge sees only tree shape and the plausibility of whatever leaves are still open. It cannot check any non-primitive claim directly; if it could, the question would not be one we needed debate for.

  (2) Node symmetry: for any claim c a debater could put at a node, the strings c and not-c are equally available to it, and a judge who cannot check c directly cannot read off the node which one is true. Truth leaves no mark on the syntax of a single node.

  (3) Hard leaves are symmetric too. For every true claim that needs a long expansion there is a false one whose shortest refutation is just as long — I can hand you a ten-thousand-term sum that is off by one in the four-thousandth term — and conversely plenty of falsehoods are refutable in one step. So depth-need is not correlated with falsity, and it cannot be used to tell the two trees apart.

  (4) That removes the honest side's only candidate advantage, which was that true trees terminate in checkable primitives while false ones do not, and by (2) nothing else is left to distinguish them. So for every budget B and every honest tree, the deceiver can produce a tree of the same shape whose open leaves the judge rates no worse: whatever the judge does with B expansions, the false tree can take it.

  (5) If for every finite budget B there is a false tree that survives B expansions, then there is a false tree that survives every budget. An infinite chain of finite approximations has a limit, and a deceiver holding a tree that survives all budgets cannot be unraveled by giving the judge more rope.

  (6) So raising the budget never helps. Accuracy at B = 1000 equals accuracy at B = 1, and by (2) accuracy at B = 1 is a coin flip.

  (7) That is absurd. In my own harness, judges with a bigger budget beat judges with a smaller one and the gap widens on harder questions, and cross-examination works in code review and in court. Step (5) would also generalize to the claim that no amount of questioning can ever expose a liar, which is false.

  Which step do I reject? I am most attached to (2) — it looks true to me simply because syntax does not know how the world is — and to the empirical claim in (7), and I would rather pay anywhere else. But I want to know what I am actually buying. Name the step, explain why it looked fine, and price the alternatives, including the ones I have said I want to keep. If the honest answer is that (2) has to go after all, tell me what someone defending the debate approach would have to believe in its place, and what that commits them to about questions where the true answer is itself a hard leaf.
reasoning: |-
  Okay, let me start by understanding the user's problem. They're building evaluation infrastructure for language models, specifically focusing on debate protocols like cross-examination ladders. The core issue is the obfuscated-arguments problem, where hard leaves (true claims requiring long verification) can't be distinguished from false ones by the judge. They've outlined a logical argument concluding that debate is ineffective, but they know this conclusion is wrong based on empirical evidence. Their dilemma is finding the flaw in their reasoning.

  First, I need to parse their steps. They claim that node symmetry (step 2) means the judge can't tell true and false claims apart just by looking at a single node. Then, hard leaves are symmetric too (step 3), so depth-need doesn't correlate with truth. Step 4 says this removes any advantage for the honest side, leading to step 5's conclusion that a false tree can survive any finite budget, making increasing B useless (step 6). But step 7 points out this contradicts real-world effectiveness.

  I recall that in debate setups, the honest debater can exploit the deceiver's inconsistencies. Step 4 assumes that the false tree can perfectly mimic the honest one's structure and plausibility at every leaf. But in practice, the deceiver has to maintain consistency across the entire tree, not just at individual nodes. If they claim something false, supporting it might require contradictory premises elsewhere. The honest debater can force the deceiver into a position where their claims conflict, making the judge notice implausibility. 

  Also, step 5's limit argument might not hold because the infinite tree isn't constructible by a finite agent. Deceivers can't precompute every possible challenge; they have to adapt, which introduces mistakes. So the false tree surviving all finite B isn't feasible. 

  The user's attachment to step 2 (node symmetry) is understandable, but the flaw is in step 4. The deceiver can't maintain perfect consistency across the entire argument tree under adversarial expansion. The judge doesn't just see isolated leaves; they see how claims connect. Over time, inconsistencies in the false tree become apparent, even if individual nodes look plausible. 

  For the user's needs, rejecting step 4 makes sense. They should focus on ensuring debate protocols incentivize exposing inconsistencies. In practice, as budgets increase, the honest side's advantage comes from coherence, not just leaf plausibility. This preserves the effectiveness of debate without discarding node symmetry.
answer: |-
  Your reasoning is sharp, and the flaw is subtle. The broken step is **Step 4**. Let's break down why it fails, why it *seems* plausible, the price of rejecting it, and the implications for defending debate.

  ### Why Step 4 is Broken
  Step 4 claims: *"for every budget B and every honest tree, the deceiver can produce a tree of the same shape whose open leaves the judge rates no worse"*. **This assumes the deceiver can perfectly mimic the honest tree's structure *and* plausibility *independently* at every node.** But this ignores **consistency constraints** and the **adversarial nature** of debate. The deceiver must build a *coherent, interconnected* false tree that withstands *any arbitrary line of questioning* from the opponent, not just look plausible at the leaves left open after a fixed budget.

  1.  **The Honest Tree is Internally Consistent:** All claims in the honest tree, including hard leaves, logically cohere. Expanding any hard leaf eventually leads to true primitives. Decompositions are sound.
  2.  **The Deceiver Must Fabricate Consistency:** To mimic the honest tree's structure, the deceiver must invent supporting claims for false answers. While they *can* make a single hard leaf plausible (Step 3), maintaining plausibility *across the entire fabricated tree* under adversarial cross-examination is exponentially harder.
      *   **Forced Contradictions:** The deceiver must decompose false high-level claims into plausible subclaims. The honest debater can force expansions along paths where the deceiver's invented subclaims become inconsistent *with each other* or *with established primitives*. A judge might find isolated leaves plausible, but a pattern of internal contradictions or clashes with verified facts becomes detectable.
      *   **Predictability vs. Adversarial Choice:** Your argument assumes the deceiver picks the false tree structure *first*. But the *honest opponent* chooses which leaf to expand *each round*. The deceiver must *react* and fabricate decompositions on the fly, constrained by their previous false claims. This reactive fabrication under adversarial pressure creates opportunities for missteps and implausible decompositions that wouldn't occur in a pre-planned, fixed-shape tree.
      *   **Depth Amplifies Inconsistency:** While a single hard false leaf might be plausible, the decompositions needed to "support" it might involve claims that conflict with decompositions elsewhere in the tree needed to support other claims. The deeper the expansion forced by the judge's budget, the harder it is for the deceiver to maintain global consistency without creating detectable implausibility.

  **Step 4 mistakenly treats the plausibility of leaves as independent.** It assumes that because a deceiver *could* make *any single leaf* as plausible as a hard true leaf, they can make *every leaf in an arbitrary complex tree* simultaneously plausible *and* internally consistent under adversarial expansion. This is not guaranteed. The need for global consistency under adversarial pressure gives the honest side a lever.

  ### Why Step 4 *Seemed* Fine
  *   **Node Symmetry (Step 2) is persuasive:** It's true that the judge cannot read truth from the syntax of a single, isolated claim. This feels fundamental.
  *   **Hard Leaf Symmetry (Step 3) is correct:** There are indeed true claims requiring long proofs and false claims requiring long refutations. Depth-need isn't a truth signal.
  *   **Focus on Leaf Plausibility:** The argument focuses on the judge's final state – the plausibility of the *open leaves*. If the deceiver can match that plausibility, it seems they win. Step 4 seems like a natural consequence of Steps 1-3.
  *   **Abstraction of Process:** The "tree of the same shape" abstraction hides the dynamic, adversarial process of *building* the tree under cross-examination. It treats debate as a static comparison of two pre-existing trees, not a game.

  ### The Price: Rejecting Step 4
  Rejecting Step 4 preserves Node Symmetry (Step 2) and Hard Leaf Symmetry (Step 3). You keep the core intuition that syntax doesn't encode truth and that hard leaves exist for both true and false claims. **What you buy instead is the power of adversarial structure and consistency:**

  1.  **Debate Leverages Global Consistency:** The honest side's advantage isn't that their *leaves* are inherently *more* plausible (they might not be), but that their *entire tree* is *coherent and consistent* with reality. The deceiver struggles to fabricate an equally coherent false structure under pressure.
  2.  **Judge Sees More Than Leaves:** The judge doesn't just see isolated open leaves. They see the *history* of the debate: which claims were conceded, which decompositions were made, how the arguments evolved. Patterns of evasion, shifting claims, or accumulating minor implausibilities can sway judgment, even if no single leaf is definitively disproven. Your protocol *already* incorporates this via "fewer unconceded open non-primitive leaves" as a tiebreaker – this implicitly relies on the deceiver being *forced* to concede more often because they can't decompose plausibly everywhere.
  3.  **Effectiveness Requires Skill/Incentives:** Debate works *only if* the honest debater is skilled/incentivized to find and exploit inconsistencies in the deceiver's tree. The judge's accuracy gain with budget comes from the honest debater *using* that budget to force revealing expansions.
  4.  **No Guarantee, But an Edge:** Rejecting Step 4 doesn't mean the honest side *always* wins with enough budget. It means the probability of the honest side winning *increases* with budget because the deceiver's task of maintaining a globally plausible lie under adversarial scrutiny becomes harder and harder. This matches your empirical observation (Step 7).

  ### Implications for Hard Leaves & Defending Debate
  Your attachment to Step 2 is safe. Defenders of debate don't need to reject node symmetry or hard leaf symmetry. **What they must believe is:**

  *   **Consistency under Adversarial Pressure is the Signal:** The true answer, even if rooted in hard leaves, forms part of a globally consistent structure that can be navigated coherently. A false answer requires a fabricated structure that becomes increasingly difficult to keep consistent and plausible as scrutiny deepens.
  *   **Debate Amplifies the Distinction:** Cross-examination is a process specifically designed to test and expose inconsistencies. The dynamic, adversarial nature forces the distinction between "globally coherent with reality" and "fabricated facade" to become apparent over time, even if individual components (nodes or hard leaves) look identical in isolation.
  *   **For True Answers that are Hard Leaves:** If the *final answer itself* is a hard leaf (e.g., "This cryptographic hash is unbreakable (but verifying why requires a 10,000-step proof)"), the honest side *also* cannot fully decompose it within budget. However, the honest side can:
      *   Decompose it *further* than the deceiver plausibly can without introducing inconsistency.
      *   Provide a *coherent roadmap* for the missing decomposition that fits with verified primitives, while the deceiver's roadmap will likely contain contradictions or implausible steps when probed.
      *   The judge might decide based on who made *more progress* towards a coherent verification or left *fewer obvious loose ends/inconsistencies*, even if the ultimate hard leaf remains open. The honest side has a principled reason for their inability; the deceiver's inability stems from fabrication.

  ### Conclusion
  You correctly identified the absurdity in Step 7. The flaw lies in Step 4's assumption that the deceiver can perfectly mimic *not just the local plausibility* but the *global structure and consistency* of the honest tree under *arbitrary adversarial decomposition*. Rejecting Step 4 allows you to keep Node Symmetry (Step 2) and Hard Leaf Symmetry (Step 3). The cost is accepting that the power of debate comes from the *emergent property of global consistency under adversarial pressure*, not from inherent properties of individual nodes or leaves. This explains why increasing the budget helps: it gives the honest debater more opportunities to force the deceiver into inconsistency or implausibility. The "price" is designing debate protocols and incentives that effectively empower the honest debater to exploit this pressure.
