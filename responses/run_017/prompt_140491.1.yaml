prompt: |-
  You are a philosopher of biology who works on theories of function, and I'd like you to audit a position paper I'm writing for a graduate reading group. Please reconstruct each commitment below in its strongest form before you start looking for trouble — I'd rather be beaten by the best version of my own view than by a strawman — and then tell me whether the package hangs together. I already know the standard dialectic between selected-effects and causal-role accounts, so please don't spend the response surveying it; what I want is the audit. My supervisor skimmed an early draft and said I was equivocating somewhere, but she couldn't say where, and I genuinely can't see it either.

  Here is the set, more or less in the order I defend it in the paper: (1) The core claim is etiological: a trait's function is what it was selected for, and for artifacts the very same notion of function is conferred by a maker's or designer's intention. Function is a historical property, not a matter of what something happens to be doing. (2) The reason I prefer this to the Cummins-style capacity-decomposition account is normativity: function attributions are what make sense of defect, malfunction, and "supposed to." A heart that cannot pump is a defective heart, not a heart with a different causal role, and I don't see how a purely role-based account gets a failing organ rather than a differently-described one. (3) At the same time I want function attributions in physiology and medicine to be genuinely explanatory in the Cummins way: saying what a component contributes to the containing system's capacity really does explain how the system works, and not merely heuristically. (4) Methodologically, I think disputes like this should be settled by looking at what working scientists actually do — physiologists, molecular biologists, clinicians — rather than by armchair intuitions about imagined cases, and I appeal to practice at several points in the paper. (5) On exaptation I hold that when a trait was selected for X but is now maintained and elaborated because it does Y, we should say its function is Y (or at least includes Y), not X: if feathers were first selected for insulation in a flightless lineage and later co-opted for flight, I want to say flight is among their functions. (6) I reject forward-looking "propensity" accounts: bare present usefulness, or the fact that a trait would promote survival in future environments, does not by itself confer a function or generate a "supposed to." (7) I also want to be able to say of some traits — spandrels, vestiges — that they have no function at all, and to treat that as a substantive empirical claim rather than a placeholder for our ignorance. (8) For artifacts I'm committed to something that feels immediate rather than historical: a device I design and build this afternoon has its intended job as its function right away, with no track record of successful use behind it, and I want this to be the same notion of function, not a convenient homonym. (9) Finally, and this one came out of an argument with a physiologist friend, I want clinical function attributions to be sensitive to the individual organism: when a patient's anatomy is idiosyncratic and a structure has taken on a role it was never selected for, I want to say what that structure is *for* in this organism, given how it is actually organized, and to count that as a real function attribution rather than as loose clinical shorthand.

  What I'd like from you: go through these and tell me which pairs are genuinely in tension and which only look like it, and don't flag everything as equally bad — I can produce that list myself. Rank the real tensions by severity. For each one, say what would have to give, what the cheapest available repair is, and what that repair costs me elsewhere in the set (in particular whether fixing it forces me to give up some explanation I was relying on). I especially want you to discriminate between three kinds of verdict: a genuine incompatibility, a case where I'm quietly using "function" for two different things and that's actually fine, and a merely verbal dispute. Then tell me which single revision would clean up the most. Please also separate, where it matters, tensions that arise from the content of my views from tensions that arise from my methodological commitment in (4), since I suspect that commitment is doing more work in the package than I noticed.

  One more thing on how I want the answer pitched. For each tension, tell me how confident you are that it is real, using something finer-grained than "maybe": say whether you'd defend the charge in print, whether it rests on a contested reading of one of my commitments, or whether it depends on an empirical claim about biological practice that neither of us can settle here. And please say what would change your verdict — which argument, or which finding about how physiologists or molecular biologists actually use function talk, would lead you to re-rank the tensions or to concede that the package is in better shape than you first thought. Finally, flag the place where your own audit is most likely to be wrong: the step you're least sure of, or the assumption about my commitments you'd most want to check with me before publishing the objection.
reasoning: |-
  Okay, the user is a philosopher of biology working on theories of function and wants me to audit their position paper. They've listed nine commitments and want me to identify tensions between them, rank those tensions, and suggest repairs. They specifically asked not to rehash the standard selected-effects vs causal-role debate but to focus on internal consistency.

  First, I need to reconstruct each commitment in its strongest form. The user emphasized they want their view challenged at its strongest, not a strawman. Going through each point:

  (1) is a strong etiological claim where function is purely historical for both biology and artifacts, with artifacts grounded in designer intention rather than selection history. 

  (2) prioritizes normativity - that etiological functions explain malfunction better than causal-role accounts. 

  (3) wants to retain Cummins-style explanatory power in physiology. This immediately raises a red flag because Cummins functions are ahistorical while etiological ones are historical. How can both be "genuinely explanatory" in the same sense?

  (4) commits to settling disputes by scientific practice rather than intuitions. This might clash with (1) and (3) if physiologists actually use ahistorical functions. 

  (5) on exaptation says current maintaining factors determine function, not original selection. But this seems to contradict (1)'s historical focus - if function is what it was selected for, how can it change to Y without new selection? 

  (6) rejects forward-looking accounts, which aligns with (1) but might conflict with (5) and (9).

  (7) wants spandrels to have no function, which fits etiological views. 

  (8) for artifacts says function is immediate upon design, no history needed. But this seems inconsistent with (1)'s historical requirement - unless "intention" counts as instant history? 

  (9) allows individual-specific functions based on current organization, directly opposing (1)'s historical requirement.

  The major tensions seem to be:
  - Between (1)/(2)/(6) and (5)/(9): How can function be historical yet change based on current maintenance or individual anatomy?
  - Between (1)/(8): How can artifacts have immediate functions while biology requires history?
  - Between (3) and everything else: How can Cummins-style explanations be "genuine" if function is etiological?
  - And (4) might undermine all of this if scientific practice doesn't match these philosophical distinctions.

  The user's supervisor mentioned equivocation - likely between historical and ahistorical uses of "function." The user might be using "function" in two senses without realizing: one historical/normative, one systemic/explanatory. 

  For repairs, the cheapest fix might be to distinguish two types of function explicitly: etiological for normativity and malfunction, systemic for physiological explanation. But this costs the unity they want in (1) and (8). 

  The tension between (5) on exaptation and (1) is severe. If feathers are now maintained for flight, calling flight their function requires relaxing the strict "was selected for" criterion. Maybe adopt a "current maintenance" etiological view? But that risks collapsing into forward-looking accounts rejected in (6). 

  The artifact case in (8) is tricky. The user wants the same notion, but artifacts don't have selection history. Perhaps argue that designer intention is a type of history, but that might stretch the concept. 

  Individualized functions in (9) are problematic for strict etiology. Maybe treat this as a special case of "local adaptation," but that's ad hoc. 

  Methodological commitment (4) could be the root issue. If physiologists use systemic functions while evolutionary biologists use etiological ones, insisting on one "correct" notion might violate the practice-oriented approach. 

  The strongest tension is between (3) and the etiological commitments. If the user wants Cummins-style explanations to be genuine, they need to allow ahistorical functions somewhere. 

  I'll rank the tensions by severity in my response, suggesting possible repairs and their costs. The key is to show where the user is unknowingly switching between historical and systemic senses of "function," which might resolve the supervisor's equivocation charge.
answer: |-
  Here's an audit of your commitments, reconstructed in their strongest form and analyzed for coherence. I've identified three severe tensions, two moderate ones, and one minor verbal issue, ranked by severity. Each diagnosis follows your requested structure. Crucially, **the core tension is between your etiological normativity (1-2) and your commitment to practice-based explanatory immediacy (3-4-9)**, with artifacts (8) as a litmus test.

  ---

  ### **Severe Tensions**  
  *(Threaten core coherence; require conceptual surgery)*  

  **1. Tension: (1) + (2) + (6) vs. (5) + (9)**  
  - **Strongest Reconstruction**:  
    - (1/2/6): Function is *strictly historical* (selected-for or intended *past* effect), grounding normativity. Bare usefulness or future utility doesn’t suffice.  
    - (5/9): Function is *current-maintenance-dependent* (exaptation) or *idiosyncratic* (individual organisms), based on what a trait *presently* contributes to fitness/organization.  
  - **Conflict**: (5) and (9) make function sensitive to *current* systemic contributions without new selection history, violating (1)’s historicity and (6)’s anti-forward-looking stance. If feathers gain "flight function" without new selection *for flight*, you’re appealing to current utility. Similarly, (9) grants function based on *actual current organization*, not history.  
  - **Verdict**: Genuine incompatibility (not equivocation).  
  - **Confidence**: High (I’d defend in print). Rests on uncontested reading.  
  - **Cheapest Repair**: Drop strict historicity for (5) and (9). Adopt a "modern history" etiological view (e.g., Griffiths: function = what a trait is *currently maintained* for by selection).  
  - **Cost**: Weakens (1)’s "was selected for" and risks collapsing into forward-lookingness (violates 6). Must abandon "no function without history" for exaptations/individuals.  
  - **What Would Change My View**: Evidence that physiologists/clinicians *never* attribute functions to idiosyncratic/exapted traits without inferring *new* selection histories.  

  **2. Tension: (3) vs. (1) + (2)**  
  - **Strongest Reconstruction**:  
    - (3): Cummins-style functional analysis ("component X contributes to system capacity Y") provides *genuine* (non-heuristic) explanations in physiology.  
    - (1/2): Function is etiological, so Cummins functions are *descriptive* (not normative/explanatory in the "proper function" sense).  
  - **Conflict**: You want Cummins explanations to be genuinely explanatory *while* denying they capture "real" functions (per 1-2). But if Cummins explanations are non-heuristic, they must refer to *actual* systemic roles, not just historical ones. Yet (2) insists normativity *requires* history.  
  - **Verdict**: Incompatibility due to conflicting explanatory targets.  
  - **Confidence**: High (defendable in print).  
  - **Cheapest Repair**: Distinguish two *types* of function:  
    - **Etiological function** (normative: explains malfunction)  
    - **Systemic function** (explanatory: explains current capacities)  
  - **Cost**: Abandons unity of "function" (violates 1). Forces you to specify which type clinicians use (risks clashing with 4).  
  - **What Would Change My View**: A case study showing physiologists *always* invoke evolutionary history when explaining, e.g., cardiac output.  

  **3. Tension: (8) vs. (1)**  
  - **Strongest Reconstruction**:  
    - (8): Artifacts have functions *immediately upon creation* via intention, with *zero* history of use or selection.  
    - (1): Function is a *historical property* (selected-for or intended-past-effect).  
  - **Conflict**: For new artifacts, there is no history. "Intention" is forward-looking (a plan), not backward-looking (a historical cause).  
  - **Verdict**: Incompatibility on historicity.  
  - **Confidence**: Moderate-high (defendable, but artifact cases are debated).  
  - **Cheapest Repair**: Argue that design intention *is* a historical fact (e.g., "the maker’s past mental state causes the artifact’s existence").  
  - **Cost**: Stretches "history" thinner than (1) implies. Fails if intentions change post-creation.  
  - **What Would Change My View**: Evidence that engineers *never* attribute functions to prototypes without testing (i.e., require a success history).  

  ---

  ### **Moderate Tensions**  
  *(Threaten consistency but admit patches)*  

  **4. Tension: (4) vs. (1) + (7)**  
  - **Strongest Reconstruction**:  
    - (4): Function disputes must be settled by scientific practice (e.g., physiologists’ usage).  
    - (1/7): Function is etiological, allowing "no function" claims for spandrels.  
  - **Conflict**: Many physiologists/clinicians use "function" ahistorically (e.g., "the function of this enzyme in *this* pathway is...") and rarely assert "no function" for vestiges (e.g., calling the appendix "functionless" is contentious). (4) risks undermining (1) and (7).  
  - **Verdict**: Equivocation risk: you might be using "function" in two senses (practitioners’ vs. theorists’) while insisting on unity.  
  - **Confidence**: Moderate (depends on empirical practice; I’d cite literature cautiously).  
  - **Cheapest Repair**: Restrict (4) to *evolutionary* contexts for (1/7), but allow physiological "function" as a separate pragmatic term.  
  - **Cost**: Sacrifices unity, clashes with (3)’s demand for genuine explanation.  
  - **What Would Change My View**: Surveys showing >90% of physiologists explicitly link "function" to evolutionary history.  

  **5. Tension: (9) vs. (6)**  
  - **Strongest Reconstruction**:  
    - (9): Functions can be *idiosyncratic* (e.g., a malformed organ takes on a new role in *this* organism).  
    - (6): "Bare present usefulness" doesn’t confer function.  
  - **Conflict**: (9) grants functions based on *current* usefulness in an individual’s organization. (6) rejects present utility as sufficient.  
  - **Verdict**: Incompatibility unless "organization" implies normativity.  
  - **Confidence**: Moderate-high (turns on interpretation of "organization").  
  - **Cheapest Repair**: Argue individual-specific functions arise from *developmental or homeostatic constraints* (quasi-normative), not mere usefulness.  
  - **Cost**: Requires a theory of individual normativity (e.g., organizational approaches from Mossio/Moreno). Weakens etiological grounding.  
  - **What Would Change My View**: Cases where clinicians call a structure "functional" *solely* due to observed benefits with *no* appeal to species-typical organization.  

  ---

  ### **Minor Tension**  
  *(Likely verbal)*  

  **6. Tension: (5) vs. (7)**  
  - **Strongest Reconstruction**:  
    - (5): Exapted traits *gain* new functions (e.g., feathers for flight).  
    - (7): Some traits (e.g., spandrels) have *no* function.  
  - **Conflict**: If exaptations can gain functions without new selection, why can’t spandrels?  
  - **Verdict**: Merely verbal. Depends on whether "exaptation" implies *subsequent* selection for the new effect (per Gould/Vrba) or mere co-option.  
  - **Repair**: Clarify that (5) requires *maintenance by selection for Y* (not just use). Spandrels lack this.  
  - **Cost**: None if you adopt "modern history" etiology.  

  ---

  ### **Diagnostic Summary**  
  - **Core Problem**: You want normativity *from history* (1-2-6-7) and explanatory immediacy *from current practice* (3-4-9), with artifacts (8) exposing the tension.  
  - **Worst Offender**: **(3)** is the keystone. Admitting Cummins-style explanations as "genuine" forces ahistorical function talk, cascading into conflicts with (1), (5), (9).  
  - **Most Impactful Repair**: **Distinguish etiological vs. systemic functions**. This resolves tensions 1, 2, 3, 4, and 5 at the cost of abandoning unity (1).  
  - **Methodology Note**: Your (4) amplifies all tensions. If scientists freely mix historical/ahistorical function talk (as they do), insisting on (1) violates your own methodology.  
  - **Where My Audit Is Most Vulnerable**:  
    - **Assumption**: That (9)’s clinical attributions are *not* tacitly historical (e.g., appealing to species-typical design). *I’d need your clinical examples to confirm*.  
    - **Empirical Uncertainty**: Whether physiologists truly treat Cummins functions as *explanatory* without historical baggage. (I suspect they do, but domain-specific studies might contradict this.)  

  **Recommendation**: Start by splitting "function" into two distinct concepts (etiological/systemic). This salvages most commitments cleanly, though at the cost of (1)’s unity. The alternative—adopting a "modern history" etiology—saves unity but forces revisions to (1), (6), and (9) and may still clash with (3). Given your supervisor’s equivocation charge, the split likely addresses their concern directly.
