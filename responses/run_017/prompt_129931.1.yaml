answer: |-
  ### Plan for the Problem Class: Iterated Elimination with Mixed-Strategy Dominators

  #### 1. **Order of Presentation (and Why Reordering Breaks It)**
     - **Step 1: Review pure-strategy dominance**  
       Start with a game where a pure strategy is strictly dominated by another pure strategy. Students identify and eliminate it. *Do not mention mixtures yet.*  
       *Why this first?* It builds confidence with familiar concepts and sets up the reduced game where mixed domination will be needed.  
       *Break if reordered:* If you start with mixed strategies prematurely, students may conflate "measuring stick" mixtures with equilibrium randomization ("poisons the well").

     - **Step 2: Introduce the reduced game and show pure-strategy impotence**  
       In the reduced game, show that no pure strategy dominates a target strategy (e.g., Row’s strategy C). Students see that pure IESDS stalls.  
       *Why here?* It creates a "problem" that motivates mixed strategies as dominators.  
       *Break if reordered:* Skipping this step loses the contrast—students won’t see *why* mixed strategies are necessary.

     - **Step 3: Introduce mixed strategies as measuring sticks**  
       Emphasize: "We’re not randomizing to play; we’re using mixtures as benchmarks to test if a strategy is strictly worse. If a mixture always beats it, eliminate it—it’s irrational to play."  
       *Why here?* It positions mixtures as analytical tools, not playable actions. Addresses your worry by decoupling "dominance measuring sticks" from "equilibrium randomization."  
       *Break if reordered:* If "randomize to confuse opponents" is taught first, students will misapply it here (your worry is justified). If mixed strategies appear without this framing, they’ll resist ("nobody plays mixtures!").

     - **Step 4: Plot payoffs geometrically to visualize domination**  
       Axes: Opponent’s remaining strategies (e.g., Column’s X and Y). Plot Row’s pure strategies as points. Show the dominating mixture as a convex combination "up and to the right."  
       *Why last?* The visual makes domination intuitive and concrete.  
       *Break if reordered:* Without the geometric aid, students might dismiss mixtures as "just math."

  #### 2. **Constructed Game for the Session**
  **Game: 3x3 Normal Form**  
  - **Row:** Strategies A, B, C  
  - **Column:** Strategies X, Y, Z  

  |       | X       | Y       | Z       |
  |-------|---------|---------|---------|
  | **A** | (0, 3)  | (4, 4)  | (0, 1)  |
  | **B** | (4, 3)  | (0, 1)  | (0, 1)  |
  | **C** | (1, 3)  | (1, 1)  | (0, 1)  |

  **Properties:**  
  - **No weak dominance:** All inequalities are strict (e.g., for Column, Y isn’t weakly dominated: vs. A, Y=4 > X=3; vs. B, Y=1 < X=3).  
  - **Pure-strategy elimination first:** Column’s Z is strictly dominated by X (3 > 1 for all rows). Eliminate Z.  
  - **Mixed domination after elimination:**  
    - Reduced game (no Z):  

    |       | X       | Y       |
    |-------|---------|---------|
    | **A** | (0, 3)  | (4, 4)  |
    | **B** | (4, 3)  | (0, 1)  |
    | **C** | (1, 3)  | (1, 1)  |

    - C is **not** dominated by A or B alone:  
      - A vs. C: A loses to C in X (0 < 1), but wins in Y (4 > 1).  
      - B vs. C: B wins in X (4 > 1), but loses in Y (0 < 1).  
    - But a **mixture of A and B** dominates C:  
      - e.g., 50% A + 50% B: Payoff vs. X = 0.5×0 + 0.5×4 = 2 (>1); vs. Y = 0.5×4 + 0.5×0 = 2 (>1).  
  - **Geometric visualization:**  
    - Axes: X-payoff (x-axis), Y-payoff (y-axis).  
    - Points: A=(0,4), B=(4,0), C=(1,1).  
    - Segment between A and B: Line from (0,4) to (4,0).  
    - Mixture (2,2) lies on the segment and is strictly northeast of C=(1,1).  

  **Why it works:**  
  - Deleting Z shrinks contingencies—now mixtures only need to cover X and Y, not Z (where C was equal to mixtures).  
  - Satisfies all requirements: no weak dominance, pure dominator fails first, mixture succeeds visibly.

  #### 3. **Misconceptions and When to Address Them**
     - **"Mixtures aren’t played, so they can’t dominate."**  
       *When:* Step 3 (introducing mixtures as tools).  
       *Address:* "We’re not playing the mixture; we’re using it to prove C is irrational. If a benchmark always beats C, why play C?"

     - **"We must check mixtures against opponent’s mixtures."**  
       *When:* Step 4 (during payoff comparison).  
       *Address:* "No: if a mixture beats a pure strategy against every pure opponent move, linearity ensures it beats any mixed move. Check pure contingencies only."

     - **"Order of elimination matters (like weak dominance)."**  
       *When:* After eliminating C.  
       *Address:* "Order doesn’t affect strict dominance outcomes. Here, Z must go first—otherwise, against Z, the mixture doesn’t beat C (both yield 0)."

     - **"If a mixture beats a strategy, every pure strategy in it must beat it."**  
       *When:* Step 4 (plotting the segment).  
       *Address:* Show A loses to C in X, B loses in Y—but the mixture wins everywhere. "Mixtures compensate for weaknesses."

  #### 4. **What to Refuse to Explain (One-Line Response)**
     - **Refuse:** Multi-player complications (e.g., strategies undominated but never best responses, rationalizability).  
     - **Response:** "In two-player games, strict dominance by mixtures catches all irrational strategies—multi-player nuances are beyond scope."

  #### 5. **Closing Question to Test Understanding**
     - **Question:** "After we eliminate Column’s Z, why does Row’s C become strictly dominated by a mixture of A and B—and what would happen if we skipped mixed strategies in IESDS?"  
       - **Expected Answer:**  
         "Deleting Z removes a contingency where C matched the mixture, so now the mixture dominates C in all remaining cases. Without mixtures, IESDS stops too early, leaving irrational strategies like C."

  ---

  ### Session Flow Outline
  1. **(5 min)** Recap pure-strategy dominance. Present the 3x3 game; students eliminate Column’s Z (strictly dominated by X).  
  2. **(10 min)** Reduce the game. Students verify no pure strategy dominates C (A or B can’t do it). Highlight the stall.  
  3. **(10 min)** Introduce mixtures as measuring sticks: "We use them to test strategies, not play them."  
  4. **(15 min)** Plot Row’s payoffs in the plane (X vs. Y). Show A, B, C, and the segment. Find a mixture (e.g., 50-50) dominating C.  
  5. **(5 min)** Discuss misconceptions as they arise. Emphasize: mixtures as tools, not actions.  
  6. **(5 min)** Close with the question above. Assign as a reflection if time runs short.  

  **Whiteboard Use:**  
  - Draw matrices, plot points/segments, and circle dominating mixtures.  
  - Use color if possible (e.g., red for eliminated strategies, blue for mixtures).  

  This plan ensures mixtures are tools first, leverages geometry for intuition, and preempts key confusions.
