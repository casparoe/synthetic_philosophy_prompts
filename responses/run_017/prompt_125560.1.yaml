prompt: |-
  I work in distributed systems and read philosophy the way I read the docs for a library I am not actually going to use: in the evenings, for pleasure, and with no formal background. I have been chewing on the absent-minded driver problem for a couple of weeks and I would like an explanation of what the conceptual issue really is, not a verdict on who is right.

  The setup as I have it: a driver heads home along a highway with two identical-looking intersections. Exiting at the first lands him in a bad neighbourhood, payoff 0; exiting at the second gets him home, payoff 4; missing both leaves him at a motel, payoff 1. The intersections are indistinguishable and he cannot recall whether he has already passed one, so he cannot condition his action on which intersection he is at. With a coin in the car, his available strategies are: exit with some fixed probability p at every intersection, plus the two degenerate cases p = 0 and p = 1. Without a coin, only the two degenerate ones.

  What I get when I do the algebra myself. Averaging over journeys, expected payoff as a function of p is 1 + 2p − 3p², which peaks at p = 1/3 with value 4/3. Then I wrote a Monte Carlo simulator, mostly to check myself, and ran into something that reorganised the problem for me. If I sample a run uniformly and record its payoff, I get 4/3 as expected. But if I sample a single intersection-arrival uniformly from the whole log and record the payoff that the journey containing that arrival ended with, I get 8/5, not 4/3, because journeys that make two arrivals are twice as likely to be sampled. From inside the car, in other words, the plan always looks better than it does from the planner's chair, and the gap is a plain sampling effect of the kind I deal with at work when per-request metrics disagree with per-job metrics.

  That made me try the driver's on-the-spot reasoning, and here I lose the thread of the paradox. Conditional on being at an arrival, with the plan fixed at p = 1/3, the probability of being at the first intersection is 3/5 and at the second 2/5. Given that, exiting and continuing both work out to 8/5, and if I let him pick any local exit probability q while his later self still uses p = 1/3, the value is 8/5 for every q: completely flat. So I cannot reproduce a driver who arrives at an intersection and wants to do anything other than what he planned. The only way I can manufacture a strict preference to deviate is to hand him the naive credence of 1/2 on being at the first intersection, which makes exiting worth 2 and continuing worth 3/2.

  So here is what I would like explained.

  First, is the flatness I found a real structural fact or an accident of the payoffs 0, 4 and 1? I worked out that the per-arrival advantage of exiting over continuing comes to (2 − 6p)/(2 − p), whose sign is just the sign of the derivative of the per-journey expected payoff; that smells like an envelope or fixed-point relation rather than a coincidence, but I would like to see why it holds, in a form I can re-derive after changing the numbers.

  Second, and relatedly: without a coin the situation looks worse, not better. Always continue is the best degenerate plan at 1, but at an arrival under p = 0 the strategy-consistent credence is 1/2, exiting is worth 2 and continuing 1, so he wants to switch to p = 1; and under p = 1 he wants to switch back. If that is right, the best-response map has a strict two-cycle with no fixed point, and admitting the coin is exactly what creates a fixed point, at p = 1/3, which is also the ex ante optimum. Is that why randomization is supposed to matter here in a way it never matters in an ordinary one-person decision problem, where mixing cannot help?

  Third, and this is the part I most want: what is the disagreement actually about? On my arithmetic, once credences are derived from the strategy, the driver at the intersection agrees with the planner, and the clash people describe seems to come entirely from what credence he is allowed to have when he cannot tell the two intersections apart. Is that the whole thing: a fight about whether self-locating credence is constrained by your own strategy, the same fight that shows up in the Sleeping Beauty problem this example is often connected to? Or is there a residue that survives even after the credences are settled, something about whether re-optimizing at a decision node is even a coherent operation when a single decision rule is shared by two nodes, and hence about whether the unit of agency that plans is the same as the unit that arrives? And if the standard example has numbers or a structure I have garbled, tell me that first and then answer for the version that is actually in the literature.

  Please show the algebra wherever it is doing work, and flag any term of art you have to use. I am happy with a long answer; I would rather have the structure of the problem than a survey of positions.
reasoning: |-
  We are dealing with the absent-minded driver problem. The setup is as follows:
  - There are two identical intersections.
  - Exiting at the first intersection: payoff 0.
  - Exiting at the second intersection: payoff 4.
  - Missing both: payoff 1.

  The driver cannot distinguish the intersections and does not remember if he has already passed one. Therefore, at each intersection, he must choose the same action: to exit with probability p (if he has a coin to randomize) or to always exit (p=1) or never exit (p=0).

  We are going to address the three questions.

  First, let's set up the expected payoff from the ex-ante perspective (the planner's view) and then from the perspective of the driver at an intersection (using the strategy-consistent credence).

  ### Ex-ante expected payoff (per journey)
  A journey can have:
  - Exit at the first intersection: happens with probability p. Payoff = 0.
  - Exit at the second intersection: this requires missing the first (with probability 1-p) and then exiting at the second (with probability p). Payoff = 4. Probability = (1-p)*p.
  - Miss both: miss the first (1-p) and then miss the second (1-p). Payoff = 1. Probability = (1-p)*(1-p) = (1-p)^2.

  So the expected payoff is:
  E = p * 0 + (1-p)*p * 4 + (1-p)^2 * 1
    = 0 + 4p(1-p) + (1 - 2p + p^2)
    = 4p - 4p^2 + 1 - 2p + p^2
    = 1 + 2p - 3p^2.

  This is a quadratic in p that opens downwards. We find the maximum by taking the derivative and setting to zero:
  dE/dp = 2 - 6p = 0  => p = 1/3.

  Then E(1/3) = 1 + 2*(1/3) - 3*(1/3)^2 = 1 + 2/3 - 3*(1/9) = 1 + 2/3 - 1/3 = 1 + 1/3 = 4/3.

  So the ex-ante optimal strategy is p=1/3, with expected payoff 4/3.

  ### Per-arrival sampling (the driver's perspective at a random arrival)
  Now, consider the driver at an intersection. We want to compute the expected payoff of the journey that contains this arrival, but note that the same journey may have two arrivals (if the driver passes both intersections) or one (if he exits at the first).

  We sample an arrival uniformly at random from all arrivals. The total number of arrivals in a large number of journeys is:
  - Each journey that exits at the first: 1 arrival.
  - Each journey that exits at the second: 2 arrivals (because he passes the first and then exits at the second).
  - Each journey that misses both: 2 arrivals.

  But note: the journey that exits at the first has one arrival (at the first intersection) and then he exits. The journey that exits at the second has two arrivals: the first (where he continues) and the second (where he exits). The journey that misses both has two arrivals (at both, and he continues at both).

  So the total number of arrivals in N journeys is:
  N1 (exit at first) * 1 + N2 (exit at second) * 2 + N3 (miss both) * 2.

  The probabilities of each journey type (per journey) are:
  - P(exit at first) = p
  - P(exit at second) = (1-p)*p
  - P(miss both) = (1-p)^2

  So the expected number of arrivals per journey is:
  1 * p + 2 * (1-p)*p + 2 * (1-p)^2.

  Let A = p + 2p(1-p) + 2(1-p)^2.

  Now, the expected payoff per journey is E = 4p(1-p) + (1-p)^2 = 4p - 4p^2 + 1 - 2p + p^2 = 1 + 2p - 3p^2.

  But the per-arrival sampling: we are sampling an arrival and then looking at the entire journey's payoff. The probability of sampling an arrival from a journey of type:
  - Exit at first: the proportion of arrivals that come from such journeys is [p * 1] / A.
  - Exit at second: [ (1-p)*p * 2 ] / A.
  - Miss both: [ (1-p)^2 * 2 ] / A.

  Then the expected payoff from the perspective of a random arrival is:
  ( [p] / A ) * 0   +   [2p(1-p)] / A * 4   +   [2(1-p)^2] / A * 1

  But note: the journey that exits at the first has payoff 0, and we sample one arrival from it. The journey that exits at the second has payoff 4, and we sample one of its two arrivals (but the entire journey gets 4). Similarly, the journey that misses both has payoff 1, and we sample one of its two arrivals.

  So the expected payoff per sampled arrival is:
  = (1/A) * [ p * 0 + 2p(1-p)*4 + 2(1-p)^2 * 1 ]

  We can compute A:
  A = p + 2p(1-p) + 2(1-p)^2
    = p + 2p - 2p^2 + 2(1 - 2p + p^2)
    = 3p - 2p^2 + 2 - 4p + 2p^2
    = 2 - p.

  So A = 2 - p.

  Then the expected payoff per arrival is:
  = (1/(2-p)) * [ 0 + 8p(1-p) + 2(1-p)^2 ]
  = (1/(2-p)) * [8p - 8p^2 + 2(1 - 2p + p^2)]
  = (1/(2-p)) * [8p - 8p^2 + 2 - 4p + 2p^2]
  = (1/(2-p)) * [ -6p^2 + 4p + 2 ]

  At p=1/3, we get:
  Numerator: -6*(1/9) + 4*(1/3) + 2 = -6/9 + 4/3 + 2 = -2/3 + 4/3 + 6/3 = 8/3.
  Denominator: 2 - 1/3 = 5/3.
  So expected payoff = (8/3) / (5/3) = 8/5.

  This is 1.6, which is greater than 4/3 ≈ 1.333.

  But note: this is not the expected payoff for the driver at the intersection. This is the average over all arrivals of the journey's payoff. The driver at an intersection, however, is at a specific point and must make a decision. We must condition on being at an intersection and then compute the expected payoff from that point onward, but also including the fact that the driver has a strategy for the future (if any) and that the past may have happened.

  ### The driver's perspective at an intersection: strategy-consistent credence
  The driver is at an intersection. He does not know which one. But he knows his own strategy: he will use the same p at every intersection. He also knows that the strategy has been in place from the start.

  We need to assign probabilities to being at the first or second intersection, given that he is at an intersection and that he has not exited yet (so he is still driving). This is a conditional probability.

  The events that lead to being at an intersection without having exited yet are:
  - Being at the first intersection: this always happens (every journey starts at the first).
  - Being at the second intersection: this happens only if he continued at the first.

  But note: we are considering the state of the driver at the moment he arrives at an intersection and has to make a decision. The driver has not exited, so we are conditioning on having not exited prior to this point.

  So the probability of being at the first intersection given that we are at an intersection and have not exited is:
  P(first | at an intersection and not exited) = P(first) / [P(first) + P(second)]
  But note: the event "being at the first" is mutually exclusive with "being at the second", and both are events of being at an intersection without having exited.

  How many times does the driver find himself at the first intersection? In every journey, exactly once (at the beginning). How many times at the second? Only in journeys where he did not exit at the first, so with probability (1-p). Therefore, the relative frequencies are:
  - First intersection: 1 per journey
  - Second intersection: (1-p) per journey.

  So the total probability of being at the first given that we are at an intersection is:
  P(first) = 1 / [1 + (1-p)] = 1/(2-p)
  P(second) = (1-p) / (2-p)

  At p=1/3, we have:
  P(first) = 1/(2-1/3) = 1/(5/3) = 3/5
  P(second) = (1-1/3)/(5/3) = (2/3)/(5/3) = 2/5.

  Now, what is the expected payoff if the driver exits at this intersection?
  - If he is at the first, he gets 0.
  - If he is at the second, he gets 4.

  So E[exit] = (3/5)*0 + (2/5)*4 = 8/5.

  What if he continues? Then:
  - If he is at the first, then he will go to the second and then at the second he will follow his strategy: exit with probability p, continue with probability 1-p. So the expected payoff from continuing at the first is: p * 4 + (1-p) * 1 = 4p + 1 - p = 1 + 3p.
  - If he is at the second, then continuing leads to the motel, payoff 1.

  But note: if he is at the second and continues, then he gets 1. However, if he is at the first and continues, then he moves to the second and then at the second he will use the same p. So the expected payoff from continuing at the first is not just the immediate next step but the rest of the journey.

  Therefore, the expected payoff from continuing, conditional on being at a particular intersection, is:
  - At the first: E[continue at first] = p * (payoff if exit at second) + (1-p) * (payoff if miss both) = p*4 + (1-p)*1 = 4p + 1 - p = 1 + 3p.
  - At the second: E[continue at second] = 1 (because he misses both and goes to the motel? Actually, if he is at the second and continues, then he misses both? No: if he is at the second and continues, then he misses the second and there is no third, so payoff 1.

  But note: we must be consistent. The driver's strategy is fixed: at every intersection he exits with probability p. So if he continues at the first, then at the second he will again have a chance to exit (with probability p) or not. Therefore, the expected payoff from the moment he leaves the first without exiting is the same as the ex-ante expected payoff of the entire journey starting from the beginning? Not exactly, because he has already passed the first without exiting. So starting from the second, the situation is: there is only one intersection left (the second). Then:
  - At the second, he exits with probability p (getting 4) or continues with probability 1-p (getting 1). So the expected payoff from the second is: p*4 + (1-p)*1 = 1 + 3p.

  Therefore, regardless of whether he is at the first or the second, the expected payoff from continuing is 1 + 3p? Actually, no: if he is at the first and continues, then he moves to the second and then gets an expected payoff of 1+3p. But if he is at the second, then continuing gives 1. So:

  E[continue | at first] = 1 + 3p
  E[continue | at second] = 1

  Therefore, the overall expected payoff for continuing, conditional only on being at an intersection (without knowing which) is:
  E[continue] = P(first) * (1+3p) + P(second) * 1
              = [1/(2-p)] * (1+3p) + [(1-p)/(2-p)] * 1
              = [1 + 3p + 1 - p] / (2-p)
              = (2 + 2p) / (2-p)
              = 2(1+p)/(2-p)

  At p=1/3, we have:
  E[continue] = 2*(1+1/3)/(2-1/3) = 2*(4/3)/(5/3) = 2*(4/3)*(3/5) = 8/5.

  And we already know E[exit] = 8/5.

  So indeed, at p=1/3, the driver is indifferent: exiting and continuing both yield 8/5.

  Now, the driver might consider deviating at this one intersection: suppose at this one intersection he exits with a different probability q, but his future self (if any) will still use p=1/3. Then we need to compute the expected payoff for this deviation.

  Conditional on being at an intersection, the driver chooses to exit with probability q and continue with probability 1-q. Then the expected payoff from this choice is:
  q * E[exit] + (1-q) * E[continue] = q*(8/5) + (1-q)*(8/5) = 8/5.

  So indeed, it is flat: any q gives the same 8/5.

  Therefore, the driver has no incentive to deviate from p=1/3.

  Now, let us address the questions.

  ### First question: is the flatness a real structural fact?
  The flatness we observed at the optimal p is that the expected payoff from the driver's perspective (using the strategy-consistent credence) is the same for any action (exit or continue) and in fact for any local deviation q. We want to see if this is a coincidence of the payoffs.

  Let the payoffs be generalized: 
  - Exit at first: A
  - Exit at second: B
  - Miss both: C

  The ex-ante expected payoff is:
  E = p * A + (1-p)*p * B + (1-p)^2 * C
    = A p + B p (1-p) + C (1-p)^2.

  The derivative with respect to p is:
  dE/dp = A + B(1-2p) - 2C(1-p) + C(1-p)? Wait, let's compute properly:

  E = A p + B (p - p^2) + C (1 - 2p + p^2)
    = A p + B p - B p^2 + C - 2C p + C p^2
    = (A + B - 2C) p + (C - B) p^2 + C

  Actually, let me rearrange:
  E = [A] p + [B p (1-p)] + [C (1-p)^2]
    = A p + B (p - p^2) + C (1 - 2p + p^2)
    = A p + B p - B p^2 + C - 2C p + C p^2
    = (A p + B p - 2C p) + (-B p^2 + C p^2) + C
    = p (A + B - 2C) + p^2 (C - B) + C

  So dE/dp = (A + B - 2C) + 2p (C - B)

  Set to zero for maximum: 
  (A+B-2C) + 2p (C-B) = 0
  => 2p (B-C) = A+B-2C   [since C-B = -(B-C)]
  => p = (A+B-2C) / [2(B-C)]   [provided B ≠ C]

  Now, the strategy-consistent credence:
  P(first) = 1/(2-p)
  P(second) = (1-p)/(2-p)

  The expected payoff for exiting at the current intersection:
  E_exit = P(first)*A + P(second)*B = [1/(2-p)] A + [(1-p)/(2-p)] B

  The expected payoff for continuing at the current intersection:
  - If at first: then after continuing, the driver will face the second intersection and use p. The expected payoff from the second intersection is: p*B + (1-p)*C.
  - If at second: continuing gives C.

  So E_continue = P(first) * [p B + (1-p) C] + P(second) * C
              = [1/(2-p)] [p B + (1-p) C] + [(1-p)/(2-p)] C
              = [1/(2-p)] [p B + (1-p) C + (1-p) C]   [since the second term is (1-p)C/(2-p) and we combine]
              = [1/(2-p)] [p B + 2(1-p) C]   [but wait: (1-p)C from the first part plus (1-p)C from the second?]

  Actually:
  = [1/(2-p)] * [ p B + (1-p) C ]  +  [ (1-p)/(2-p) ] * C
  = [1/(2-p)] * [ p B + (1-p) C + (1-p) C ]   ? No, because the second term is (1-p)C * [1/(2-p)] already.

  So:
  = [1/(2-p)] * [ p B + (1-p) C ] + [ (1-p) C ] / (2-p)
  = [1/(2-p)] * [ p B + (1-p) C + (1-p) C ]
  = [1/(2-p)] * [ p B + 2(1-p) C ]

  Now, the driver is indifferent if E_exit = E_continue.

  Set:
  [1/(2-p)] [A + (1-p) B] = [1/(2-p)] [p B + 2(1-p) C]

  We can ignore the denominator (same and positive) and set:
  A + (1-p) B = p B + 2(1-p) C
  => A + B - p B = p B + 2C - 2p C
  => A + B - 2C = p B + p B - 2p C   [move all to left]
  => A + B - 2C = 2p B - 2p C
  => A + B - 2C = 2p (B - C)

  But this is exactly the same equation that we had for the ex-ante optimum:

  From the ex-ante first-order condition: 
  (A+B-2C) = 2p (B-C)   [because from above: A+B-2C = 2p (B-C) ]

  Note: B-C = -(C-B), but in the ex-ante condition we had:
  dE/dp = 0 => (A+B-2C) + 2p (C-B) = 0 => (A+B-2C) = 2p (B-C)

  Exactly the same.

  Therefore, at the ex-ante optimal p, we have E_exit = E_continue.

  Moreover, the value of E_exit (or E_continue) at that p is the same and equals:

  E_exit = [A + (1-p) B] / (2-p)

  But note: the ex-ante expected payoff per journey is E = p A + (1-p) p B + (1-p)^2 C.

  We can express the per-arrival expected payoff (the one we called 8/5 in the original) in terms of A, B, C and p. But the key is that at the ex-ante optimal p, the driver at the intersection is indifferent.

  So the flatness is not an accident: it is a necessary condition of the ex-ante optimum when the driver uses the strategy-consistent credence.

  ### Second question: without a coin
  Without a coin, the driver must choose a pure strategy: either p=0 (always continue) or p=1 (always exit).

  The ex-ante expected payoffs:
  - p=0: E = 0*A + 0*B + 1*C = C.
  - p=1: E = 1*A + 0*B + 0*C = A.

  In the original problem: A=0, B=4, C=1. So:
  p=0: E=1
  p=1: E=0

  So the best degenerate plan is p=0 (always continue) with E=1.

  Now, consider the driver at an intersection under the strategy p=0 (always continue). What is his strategy-consistent credence?
  P(first) = 1/(2-0) = 1/2
  P(second) = (1-0)/(2-0) = 1/2.

  Then:
  E_exit = (1/2)*A + (1/2)*B = (0+4)/2 = 2.
  E_continue = (1/2)*[0*B + 1*C] + (1/2)*C   [since at first: continuing leads to the second, and then at the second he continues (p=0) so gets C; at second: continuing gives C]
            = (1/2)*C + (1/2)*C = C = 1.

  So E_exit=2, E_continue=1. Therefore, he would prefer to exit, but his strategy says continue. Hence, he wants to deviate.

  Similarly, under p=1 (always exit):
  P(first)=1/(2-1)=1/1=1
  P(second)=(1-1)/(2-1)=0.

  So he is certain he is at the first. Then:
  E_exit = 1*A + 0*B = A = 0.
  E_continue = 1 * [1*B + 0*C] + 0 * ... = B = 4? 
  Wait: at the first, if he continues (deviates) then he will go to the second and then at the second he will exit (because p=1) so he gets B=4. But at the second, if he were there (which he isn't, according to his belief) he would exit and get B. But since he believes he is at the first, then continuing leads to an expected payoff of B (since at the second he will exit). So E_continue = 4.

  So he would prefer to continue (get 4) rather than exit (get 0). So he wants to deviate.

  Therefore, in the pure strategies, there is no fixed point: at p=0, the driver wants to switch to exiting (p=1); at p=1, the driver wants to switch to continuing (p=0). So the best-response cycle.

  But when we allow randomization, we found a fixed point at p=1/3, where the driver does not want to deviate.

  This explains why randomization matters: it provides a fixed point in the strategy space that is stable in the sense that the driver, when using that strategy, does not have an incentive to deviate at any decision node.

  In a standard one-person decision problem with perfect recall, the optimal strategy can always be taken to be pure (by the extreme point theorem in linear programming for finite decision problems). But here, because of the absent-mindedness (the driver cannot condition on the node and does not remember the history), the randomization is essential to achieve a fixed point.

  ### Third question: what is the disagreement about?
  The paradox often presented is that the driver, at the intersection, might reason naively (with equal probability 1/2 of being at either intersection) and then conclude that exiting is better. But we have shown that if he uses the strategy-consistent credence (which takes into account the strategy he is following), then at the optimal p he is indifferent.

  The disagreement in the literature often centers on the appropriate credence to use. The Sleeping Beauty problem is indeed a related problem in which self-locating credence is debated. In that problem, the issue is how to assign probability to being in one of two identical awakenings given that a coin flip determines whether there is one or two awakenings.

  In the absent-minded driver, the two main positions are:
  1. The strategy-consistent view (also called the ex-ante view or the planning view): the driver should use the credence that is consistent with the overall strategy. This leads to the conclusion that the optimal p=1/3 is stable.
  2. The naive view (sometimes called the on-the-spot view): the driver, having no information, assigns equal probability to being at either intersection. Then, as we saw, he would compute:
     E_exit = (1/2)*0 + (1/2)*4 = 2
     E_continue = (1/2)*[p*4+(1-p)*1] + (1/2)*1   [but note: if he is at the first, then continuing leads to the second and then the same decision problem? However, if he uses the current p for the future, then at the first intersection, if he continues, then at the second he will exit with probability p. But if he is at the second, then continuing gives 1. But the naive view does not condition on the strategy? Actually, if the driver is at the intersection and is contemplating a change of strategy for this one decision but the future self will still use p, then under naive credence:

     E_continue = (1/2) * [expected payoff from the second intersection (which is p*4 + (1-p)*1)] + (1/2)*1
                = (1/2)(4p + 1 - p) + (1/2)*1
                = (1/2)(3p+1) + 1/2
                = (3p+1+1)/2 = (3p+2)/2.

     At p=1/3, this is (3*(1/3)+2)/2 = (1+2)/2 = 1.5.

     Then E_exit=2, which is greater than 1.5, so he would want to exit.

  But note: this naive view does not use the strategy-consistent credence. The driver is not taking into account that the fact that he is at an intersection is more likely to occur in journeys that have more intersections (i.e., the ones where he didn't exit early).

  The critical point of disagreement is whether the driver should use the strategy-consistent credence or the naive credence. The strategy-consistent credence is derived from the overall strategy and the frequencies of being at each node. The naive credence ignores the strategy and uses the principle of indifference over the two intersections.

  In the literature, the problem is often presented to highlight that the ex-ante optimal strategy (p=1/3) is not time-consistent if the driver uses the naive credence. However, we have shown that if the driver uses the strategy-consistent credence, then it is time-consistent.

  Therefore, the residue of the paradox is the question of which credence to adopt. Some argue that the strategy-consistent credence is the correct one because it reflects the actual probability of being at each node given the strategy. Others might argue that the driver, at the moment of decision, has no memory and cannot condition on the history, so the only information is that there are two identical intersections, leading to the naive 1/2.

  However, note that the driver's own strategy affects the likelihood of being at each node. Therefore, the strategy-consistent credence is a form of updating on the strategy (a kind of self-referential belief).

  In summary, the entire issue revolves around the assignment of self-locating credence when the agent's own strategy influences the probabilities of being at different nodes.

  ### Conclusion
  1. The flatness is structural: at the ex-ante optimal p, the driver using the strategy-consistent credence is indifferent between exiting and continuing. This holds for any payoffs A, B, C (with B≠C) because the condition for the ex-ante optimum is exactly the condition that equates the two actions from the driver's perspective.
  2. Without a coin, there is no pure strategy that is a fixed point: the driver always wants to switch. Randomization provides a fixed point, which is the ex-ante optimum. This is why randomization matters in a way it doesn't in standard decision problems: it resolves the time-inconsistency that arises from absent-mindedness.
  3. The disagreement is about the appropriate self-locating credence. The strategy-consistent credence (which we used) leads to time-consistency of the ex-ante optimal plan, while the naive credence (1/2 at each node) leads to a preference to deviate. The problem highlights a tension in how to update beliefs when the agent's own strategy affects the state probabilities.

  The structure of the problem is sound, and the numbers in the standard example (A=0, B=4, C=1) are the ones used in the literature.
