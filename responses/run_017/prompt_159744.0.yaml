answer: |-
  Here's a translation of the inefficacy objection and philosophical replies into your epidemiological vocabulary, structured by your threshold typology. I'll flag mapping integrity, conceptual residues, and where distinctions are original. Key verdicts upfront:  

  **Core Translation:** The inefficacy objection claims an individual's "dose" (e.g., one car trip, one steak) has zero *detectable causal effect* on the outcome (climate change, animal deaths) due to:  
  - **Low statistical power:** The effect size per unit dose is below detection threshold for n=1.  
  - **Non-pivotal exposure:** In dose-response models with no sharp threshold, the outcome is invariant to single-dose removal.  

  **Verdict on Smear Cases:** The inefficacy objection **survives intact** for purely deterministic smooth dose-response systems. Ethical replies (fair shares, complicity) require importing non-causal constructs not native to population-level counterfactuals.  

  ---

  ### **1. Sharp-Threshold Cases**  
  *(e.g., electoral majorities, quorum triggers)*  
  - **Inefficacy Objection:** "My dose won't cross the threshold; outcome is invariant."  
  - **Pivotality Reply:** Your exposure has non-zero *probability of being a sufficient-component cause* at the threshold margin. Equivalent to claiming your dose has high *attributable probability* (not fraction) for the outcome transition.  
    - *Mapping:* Clean. Uses standard counterfactual tipping-point logic.  
    - *Residue:* None.  

  ---

  ### **2. Uncertain-Threshold Cases**  
  *(e.g., climate tipping points with unknown thresholds)*  
  - **Inefficacy Objection:** "Threshold location is stochastic; my dose has expected attributable fraction ≈0."  
  - **Pivotality Reply:** Under uncertainty, your dose increases *expected excess cases* by integrating over the threshold distribution. Your act raises the probability of crossing *some* threshold.  
    - *Mapping:* Clean (analogous to probabilistic attributable risk in multifactorial outcomes).  
    - *Residue:* None.  

  ---

  ### **3. Smear Cases**  
  *(Smooth dose-response, no thresholds; e.g., CO₂ emissions, meat consumption)*  
  - **Inefficacy Objection:** "Removing my dose changes the outcome by Δ≈0 (indistinguishable from noise). My exposure is causally inert at realistic detection limits."  
  - **Philosophical Replies & Translation Attempts:**  

    **A. Expected Burden Reply (Pivotality Lite):**  
    - *Translation:* Each unit-dose contributes to *population attributable fraction (PAF)*. Your dose contributes *expected excess cases* = (individual dose) × (marginal harm per unit dose).  
    - *Mapping:* Clean for population effects. But concedes the objection for *individual outcomes* (no detectable effect on any specific death/event).  
    - *Residue:* Why should an individual care about an imputed fractional death?  

    **B. Fair Shares / Collective Obligation Reply:**  
    - *Translation Attempt:* Frames emissions as a *common exposure source*. Your dose exceeds your *equipartition share* of the "safe" global dose budget.  
    - *Mapping Breaks:*  
      - Epidemiology lacks normative "shares"; PAF is descriptive.  
      - "Overdose" implies a personal risk threshold, but harm is purely collective.  
      - *Closest analog:* Being a *statistical outlier* in dose distribution. But outliers aren’t causal agents.  
    - *Residue:* Full. The moral "duty to not over-consume" doesn’t map to causal models.  

    **C. Complicity / Participation Reply:**  
    - *Translation Attempt:* Your act is a *component cause* in a sufficient-cause pie. Even if removable, your exposure *enables* the collective harm.  
    - *Mapping Breaks:*  
      - In sufficient-component-cause models, *all* component causes are symmetric. Removing *any* single dose fails to prevent the outcome.  
      - No epidemiologic metric quantifies "complicity" distinct from attributable fraction.  
    - *Residue:* The ethical weight of "joining a harmful system" isn’t captured.  

    **D. Expressive / Norm-Setting Reply:**  
    - *Translation Attempt:* Your dose signals *high risk behavior*, potentially shifting population dose distribution.  
    - *Mapping:* For infectious disease, yes (behavioral contagion). For climate/meat? No direct analog. Epidemiology treats social influence as a confounder, not a primary outcome.  
    - *Residue:* Entirely.  

  ---

  ### **The Tempting Maneuver: Group Counterfactuals**  
  *Question:* "Would the outcome differ without me *and many others*?"  
  - *Translation:* This is a *non-standard intervention*—a *cohort removal* (e.g., "if all similar emitters reduced dose"). Contrasts:  
    - Individual counterfactual: Y(Dᵢ=0, D₋ᵢ=d) vs. Y(Dᵢ=dᵢ, D₋ᵢ=d)  
    - Group counterfactual: Y(Dᴳ=0, D₋ᴳ=d) vs. actual Y  
  - *Problem:* Group counterfactuals quantify *collective responsibility*, not individual. They answer "what if we acted?" not "why should I act?"  
  - *Mapping Limitation:* Epidemiology can compute this (e.g., removing a percentile of high emitters), but it bypasses the inefficacy objection rather than answering it.  

  ---

  ### **Settled vs. Reconstructed**  
  - **Settled:**  
    - Pivotality in sharp/uncertain thresholds ↔ probabilistic attributable risk.  
    - Expected burden per unit dose ↔ marginal harm in linear dose-response.  
    - Individual counterfactuals in smear cases ≈ null effect.  
  - **Reconstructed (My Terminology):**  
    - "Smear case" descriptor (literature says "linear" or "additive" systems).  
    - "Equipartition share" as translation of "fair share."  
    - Treatment of complicity as a "component cause."  
  - **Original Distinctions:** Your triad (sharp/uncertain/smear) is novel but defensible.  

  ---

  ### **Where I'm Most Vulnerable**  
  1. **Ethical Reductionism:** I claim fair share/complicity arguments have no epidemiologic analog. A philosopher could argue that *all* population-level metrics (PAF, dose-response) implicitly encode collective ethics—e.g., "you contribute to PAF" *just is* complicity.  
     - *Damage:* This collapses my residue report, making ethics intrinsic to causal models.  
     - *Defense:* Epidemiology is *descriptive*; PAF doesn’t imply obligation. But the objection has force.  

  2. **Smear Case Verdict:** I claim inefficacy survives here. Critics could argue:  
     - In nonlinear systems (e.g., social tipping points), every act has pivotality potential.  
     - My "smear" idealization ignores stochasticity in individual outcomes (e.g., one emission molecule *might* trigger a feedback loop).  
     - *Damage:* If true, pivotality replies apply everywhere, making my triage irrelevant.  

  **Change My Mind If:** You show a dose-response model where a *single* unit exposure alters a *deterministic* population outcome in a smooth, additive system. (Spoiler: You can't—it’s mathematically impossible.) This is why ethical residues persist.  

  ---

  **Summary for Print:**  
  > In smooth dose-response systems (e.g., CO₂ emissions), individual acts *are* causally inefficacious—removing one dose changes nothing detectable. Pivotality arguments work only where thresholds exist. Appeals to "fair shares" or "complicity" import ethical concepts that epidemiology's counterfactual language can't capture, revealing a gap between collective harm and individual obligation. Sometimes, the numbers can't tell you why to act.  

  This translation breaks at normative claims. The residue isn’t a flaw in your vocabulary—it’s where morality begins.
