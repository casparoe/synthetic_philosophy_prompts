prompt: |-
  I retired a few years ago (surface science, 35 years in the same industrial lab) and last autumn I started sitting in on a graduate seminar on agency at the university in town, mostly for the pleasure of arguing with people younger than me. I've got stuck on one thing and I'd like to know whether my reactions to a set of cases add up to any single principle, or whether I'm just having inconsistent gut feelings and dressing them up.

  The thing I keep chewing on is Galen Strawson's Basic Argument. My notes have it roughly like this:

  1. you do what you do, in any given situation, because of the way you are
  2. to be ultimately responsible for what you do, you have to be ultimately responsible for the way you are — at least in those mental respects that issued in the action
  3. you can't be ultimately responsible for the way you are, because for you to have made yourself a certain way you'd already have to have been a certain way, and that requires the same thing again, and so on
  4. so nobody is ever ultimately responsible for anything

  The part I find most annoying is the claim that it doesn't matter whether determinism is true: if the world is deterministic you're carried along by how you already are, and if it isn't, then whatever isn't settled by how you are is chance, and chance isn't you either.

  (While I'm here: there are two Strawsons, father and son, and I have it in my head that the father is the one who wrote about reactive attitudes and resentment. Is that right, or have I got it backwards?)

  Here are my verdicts, going on gut.

  Case 1, "remote control": a team of neuroscientists with an implanted stimulator switches on a violent desire in a man over lunch; he kills a coworker at 12:10. Not responsible. Obviously.

  Case 2, "programmed in advance": same team, no remote control. They arrange things while he's an infant — hormones, conditioning, careful placement of foster homes — so that the desire and the killing turn up when he's 40 with nobody touching anything at the time. I still say not responsible.

  Case 3, "ordinary bad start": same shape of story, but the causal history is an alcoholic mother, a violent stepfather, a rough school, no scientists anywhere. I do want to say responsible. Cases 2 and 3 are the embarassing pair, because as far as I can see the causal chains are the same kind of thing, and the only differences are who was doing the shaping and what they intended.

  Case 4, "ordinary, deterministic": decent upbringing, ordinary life, and stipulate the universe is deterministic in the Laplace sense. He embezzles from his employer after six weeks of going back and forth about it. Responsible.

  Case 5, "ordinary, indeterministic": same man, same life, but now stipulate the physics is indeterministic and the final decision is settled by which way a quantum event in his brain goes. I find myself saying less responsible, not more. That surprised me — I thought this was the case that was supposed to rescue free will.

  Case 6, "self-training": a woman who for years deliberately worked on being less sharp-tongued — reading, practice, a bit of therapy — and then, at a moment that mattered, said something cruel to her sister anyway. More responsible than someone who never tried. But I can hear Strawson saying the trying itself came from how she already was.

  Case 7, which I made up myself and most want comments on, "the convergent loop": at 20 she has character C0. She decides to make herself into a certain sort of person. Round one: she inspects her current dispositions, picks which to strengthen and which to weaken, applies drills, practice, whatever, and ends up with C1. Round two: the same procedure applied to C1, giving C2. And so on. The changes get smaller each round, and after a few hundred rounds she is at C*, where further rounds change nothing measurable. Then she acts from C*. So she has, about as well as a finite being could, made herself into what she is: the regress in step 3 got cut off by a process that converged instead of running forever. My gut says responsible, more clearly than in any of cases 1 to 3. My worry: C* is determined by C0 — different starting points would in general land on different fixed points — and she didn't choose C0.

  Case 8: an engineer builds a second agent directly with character C*, no loop. Same character, same action. My gut says not responsible. Which means I think the history matters and not only the machinery, and that is exactly what sits badly with 2 versus 3.

  My own attempt at a principle: an agent is responsible for an action iff the action issued from a mechanism in her that tracks reasons in the right way, and the history of how that mechanism got there matters only insofar as it affects how the mechanism works now. That gets cases 1, 4, 5 and more or less 6. It also makes 2 and 3 come out the same, and 7 and 8 come out the same, and both of those go against my gut.

  So: is there a principle that keeps more of my verdicts? I'd like two or three candidates, stated precisely enough that I can test them, each with the case that motivates each of its clauses, and I want you to tell me honestly which of my verdicts each one forces me to give up. Please also say what each candidate predicts for two cases I haven't decided about: (a) the loop agent from case 7, except that C0 was installed in her by the neuroscientists from case 2; (b) an agent whose loop never converges — the self-modifications keep changing her by roughly the same amount, indefinitely — and who acts at time t out of whatever character she happens to have at t.

  And: does the Basic Argument as I've written it actually tell against a principle like mine, or only against some stronger, "ultimate" kind of responsibility that my principle was never trying to secure? I cant tell whether I've answered it or changed the subject. Is anything really resting on the "it doesn't matter whether determinism is true" move, or is that just rhetoric?

  Please don't hand me a reading list — the library is a bus ride away and I've already got three books on the go. Just argue with me.
reasoning: |-
  Okay, the user is a retired surface scientist who spent 35 years in an industrial lab and is now attending a graduate seminar on agency. They're grappling with Galen Strawson's Basic Argument against ultimate moral responsibility. Their main frustration is how Strawson dismisses both determinism and indeterminism as equally problematic for free will. They've outlined eight cases where their gut reactions to responsibility assignments seem inconsistent and want to find a unifying principle.

  First, I need to verify the Strawson confusion: yes, P.F. Strawson (father) wrote about reactive attitudes in "Freedom and Resentment," while Galen Strawson (son) developed the Basic Argument. The user has this correct. That's helpful context.

  Looking at their case judgments:
  - Cases 1-2 (neuroscience manipulation): not responsible ✅ 
  - Case 3 (ordinary bad upbringing): responsible ✅ 
  - Case 4 (deterministic ordinary choice): responsible ✅ 
  - Case 5 (indeterministic choice): less responsible ❓ (surprises them)
  - Case 6 (failed self-improvement): more responsible ✅ 
  - Case 7 (convergent self-shaping loop): responsible ✅ 
  - Case 8 (engineered identical agent): not responsible ✅ 

  Their proposed principle focuses on current reason-tracking mechanism functionality, but it clashes with their intuitions in cases 2vs3 and 7vs8 where history matters. The tension is clear: they want to hold people like the embezzler responsible despite bad starts, but not the neuroscient-programmed victim. Yet their own principle flattens these distinctions.

  Three candidate principles come to mind: 

  1) **Reasons-Responsiveness + Non-Manipulation History**: This keeps most verdicts but struggles with case 3 (ordinary bad start). If the mechanism works now, history shouldn't matter - but their gut says the abused embezzler is responsible while the programmed one isn't. Trade-off: must drop case 3's responsibility verdict or accept inconsistency. 

  2) **Self-Shaping Ownership**: Emphasizes the agent's participation in their development. Nails cases 6-7 but overrides their case 5 intuition (indeterminism reduces responsibility). Also, for case 3's abused embezzler - were they truly self-shaper? Unclear. 

  3) **Strawsonian Reactive Stance**: Blunt but honest - we hold responsible those who trigger reactive attitudes unless exempted (like manipulation). This validates all their gut calls but admits it's not about ultimate responsibility. The "convergent loop with artificial C0" case would likely be responsible if she passes current response tests. 

  On their deeper questions: Strawson's argument attacks ultimate self-creation, not their functional principle. The "determinism/indeterminism doesn't matter" point is substantive - both scenarios lack the self-causation Strawson demands. Their principle sidesteps this by caring about current function, effectively changing the subject from ultimate responsibility to socially relevant agency. 

  For their undecided cases: 
  - Convergent loop with artificial C0: Candidate 1 says responsible (current mechanism works), Candidates 2-3 say not (tainted origin). 
  - Non-converging looper: All candidates struggle, but Candidate 2 might excuse (no stable self) while Candidate 3 would judge based on current action's quality. 

  The user's real struggle is between wanting desert-based responsibility and recognizing Strawson's regress problem. Their functional principle is defensible but sacrifices some intuitions; the reactive attitude approach preserves intuitions but concedes the metaphysical point. No perfect solution - but that's philosophy.
answer: |-
  Your gut reactions are remarkably consistent *except* where they clash with Strawson's demand for "ultimate" self-creation. The Basic Argument attacks a very strong notion of responsibility ("ultimate responsibility") that your functional principle doesn't require. Below are three candidate principles that preserve *most* of your verdicts, each sacrificing different intuitions. I'll state them precisely, show where they bite, and answer your meta-questions.

  ### Candidate Principles & Their Trade-offs
  **Candidate 1: Reasons-Responsive Mechanism + Non-Manipulation History**  
  *Principle*: An agent is responsible for an action iff:  
  (a) The action issues from a mechanism that is *currently* reasons-responsive (it can detect and respond to relevant reasons for action), AND  
  (b) The mechanism's development wasn't *intentionally designed by another agent* to produce that specific action or character trait.  

  *Motivation*: This captures your key insight that *function now* matters (Cases 1,4,5,6) but respects your history-sensitive intuitions (Cases 2≠3, 7≠8). "Manipulation" (b) is narrowly defined to avoid over-excluding (e.g., ordinary upbringing isn't "designed").  

  *Verdicts preserved*:  
  - ✅ Case 1 (remote): Fails (a) — mechanism hijacked.  
  - ✅ Case 2 (programmed): Fails (b) — designed by others.  
  - ❗**Case 3 (bad start)**: **Fails your gut**. It satisfies (a) (mechanism works *now*) and lacks (b)'s intentional design. Forces you to say *not responsible*.  
  - ✅ Case 4 (deterministic): Satisfies both.  
  - ✅ Case 5 (indeterministic): Fails (a) — quantum noise isn't reasons-responsive. "Less responsible."  
  - ✅ Case 6 (self-training): Satisfies both — her mechanism *is* reasons-responsive (she deliberated), even if it failed.  
  - ✅ Case 7 (loop): Satisfies both — C* is reasons-responsive, and *she* built it.  
  - ✅ Case 8 (engineered): Fails (b) — designed by another.  

  *New Cases*:  
  - (a) Loop agent with artificial C0: **Not responsible** (fails (b) — initial state designed by neuroscientists).  
  - (b) Non-converging looper: **Responsible** if her mechanism *at t* is reasons-responsive (satisfies (a)+(b)).  

  **Candidate 2: Self-Shaping Ownership**  
  *Principle*: An agent is responsible for an action iff the action expresses a character state that the agent *endorsed or shaped through their own deliberative activity*, and that state is reasons-responsive.  

  *Motivation*: Explains Cases 6 and 7 (effortful self-shaping increases responsibility) and distinguishes 2/3 by whether the victim *participated* in becoming who they are.  

  *Verdicts preserved*:  
  - ✅ Case 1: No endorsement/shaping.  
  - ✅ Case 2: No participation in shaping.  
  - ✅ Case 3: **Preserves your gut!** The agent, however abused, likely engaged in some deliberative shaping (e.g., "I won't be like my stepfather").  
  - ✅ Case 4: Assumes ordinary deliberative development.  
  - ❗**Case 5 (indeterministic)**: **Fails your gut**. Forces you to say *responsible* — the quantum event is just noise in an otherwise reasons-responsive mechanism *he shaped*.  
  - ✅ Case 6: Explicit self-shaping.  
  - ✅ Case 7: Paradigm of self-shaping.  
  - ✅ Case 8: No self-shaping.  

  *New Cases*:  
  - (a) Loop agent with artificial C0: **Not responsible** — her starting point wasn't hers to shape.  
  - (b) Non-converging looper: **Responsible** *if* her current state results from recent deliberative activity (e.g., she chose to keep modifying herself).  

  **Candidate 3: Strawsonian Reactive Stance (P.F. Strawson)**  
  *Principle*: An agent is responsible iff it is *appropriate* (for social/practical reasons) to hold them to account via reactive attitudes (resentment, gratitude, etc.), provided they meet basic agential conditions (e.g., not insane, coerced).  

  *Motivation*: You referenced the *father* correctly — P.F. Strawson ("Freedom and Resentment") argued responsibility is about our *practices*, not metaphysics. This validates *all* your gut verdicts because it rejects Strawson Jr.'s demand for "ultimate responsibility."  

  *Verdicts preserved*:  
  - ✅ All your cases (1–8) — your intuitions track socially responsive judgments. Case 3 is responsible because we *do* resent such agents; Case 2 isn't because we'd see them as victims.  
  - ❗**Forces you to concede**: The Basic Argument is *irrelevant* to everyday responsibility. You're not "inconsistent" — you're using a different concept.  

  *New Cases*:  
  - (a) Loop agent with artificial C0: **Responsible** if she *seems* autonomous (we'd resent her actions).  
  - (b) Non-converging looper: **Responsible** if her action warrants reactive attitudes at *t*.  

  ---

  ### Answering Your Meta-Questions
  **1. Does Strawson's Argument Threaten Your Principle?**  
  No. The Basic Argument attacks **ultimate responsibility** (being the *uncaused cause* of your character). Your functional principle (and Candidates 1–2) only requires **current reasons-responsiveness** and/or **non-manipulated history**. Strawson Jr. would say you've "changed the subject" (which is fine! — most compatibilists do this). His regress doesn't touch you if you don't demand self-creation *ex nihilo*.

  **2. Is the "Determinism/Indeterminism Doesn't Matter" Move Rhetorical?**  
  No — it's the core of his argument. He insists that *both*:  
  - **Determinism** → Your actions flow from prior causes (not "you").  
  - **Indeterminism** → Randomness isn't "you" either.  
  This *is* persuasive against *ultimate* responsibility. But your Case 5 verdict ("less responsible" under indeterminism) suggests you agree randomness *diminishes* agency — which undermines libertarian free will but fits your functional view.  

  **3. What's Really at Stake?**  
  Your struggle is between:  
  - **Desert-based responsibility** (Strawson Jr.): Requires being the *ultimate source* of your actions.  
  - **Agency-based responsibility** (your principle): Requires being a *competent reason-tracker*.  
  - **Practice-based responsibility** (Strawson Sr.): Requires being a *participant in moral community*.  

  Your gut mixes agency-based (Cases 1,4,5,6) and practice-based (Cases 2,3,7,8) intuitions. No principle saves *all* without sacrificing depth — but **Candidate 1** keeps the most while respecting your history-sensitivity.  

  **Final Advice**: Own your "inconsistencies" — they reflect that responsibility isn't one thing. You likely hold:  
  - The *abused embezzler* (Case 3) responsible because they *could have responded to reasons* differently.  
  - The *programmed killer* (Case 2) not responsible because they were *denied a fair chance* to shape themselves.  
  This isn't irrational — it’s recognizing that *both* current capacity and developmental fairness matter. Strawson Jr.'s argument only wins if you accept his narrow, self-creating "you." Don’t grant him that.
