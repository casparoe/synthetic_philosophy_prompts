prompt: |-
  I am writing the chapter of my dissertation on supererogation and I keep losing the thread of the dispute, so I want the document an adversarial collaboration would produce rather than another survey. The two parties: an optionalist, for whom the category is genuine — some acts are morally best, praiseworthy if done, and yet permissibly omitted, with no blameworthiness attaching to the omission — and an eliminativist, for whom every apparent case is explained away, either because the act was required after all and our reluctance to blame reflects an excuse or the limits of our practices, or because the verdict that the act is best is evaluative rather than deontic.

  What I need, in this order:

  1. A numbered list of agreed claims, i.e. the ground both can sign: what any account has to accommodate (the paradigm cases, the asymmetry between praise and blame, the point that beyond duty is not the same as morally indifferent), which arguments settle nothing, and which moves each side has given up.
  2. A table of the residual disagreements, one row each, with every row phrased so that the side holding the view would accept the formulation of its own position and would not accept the other side's.
  3. The cruxes, each with a concrete case both would accept as bearing on it and with each side's prediction about that case recorded in advance. My candidate cruxes: whether the class of permissibly omitted acts is closed under conjunction, tested by the iterated case in which an agent faces the same trivial-sacrifice opportunity on many occasions, the aggregate benefit of complying throughout is large, and every individual omission is blameless on the optionalist's own terms; whether a role or relationship (lifeguard, parent, promise-maker) generates new duties or only raises the cost an agent may fairly be asked to bear; and whether the absence of blame is evidence about deontic status at all or only about our blaming practices.
  4. A short closing note on how much of the dispute is verbal, and in particular how much of it turns on whether duty is defined by what an agent may be blamed for omitting.

  Do not supply citations; I will add the references myself.
reasoning: |-
  Okay, the user is writing a dissertation chapter on supererogation and wants to structure it as an adversarial collaboration between optionalists (who believe supererogation exists) and eliminativists (who deny it). They've requested four specific components: agreed claims, a disagreement table, cruxes with test cases, and a note on verbal disputes.

  Hmm, this is a sophisticated philosophical request. The user seems deeply familiar with the supererogation debate but is struggling with organizational clarity. Their frustration with "losing the thread" suggests they need this framework to prevent getting bogged down in back-and-forth arguments. The adversarial collaboration format is brilliant for that - it forces both sides to articulate their strongest points while acknowledging common ground.

  First, I need to identify what both camps would genuinely agree on. The paradigm cases (like heroic rescues) are uncontroversial starting points. The praise-blame asymmetry is crucial - both sides acknowledge we praise extraordinary acts without blaming those who omit them. And they'd agree "beyond duty" isn't morally neutral. Also important to note settled non-arguments: intuition pumps convince only the converted, and appeals to moral saints prove nothing. 

  For disagreements, I should phrase each row so each side would endorse their own version but reject the opponent's. The key fault lines are: whether supererogatory acts exist (optionalist) vs. being mislabeled duties or evaluative judgments (eliminativist), the conjunction problem, how roles affect duties, and whether blame practices track deontology. 

  The cruxes need concrete test cases. For conjunction: imagine repeated small sacrifices (like daily $1 donations) where each omission seems blameless but aggregate omission is terrible. Optionalists predict no duty arises; eliminativists say this shows the initial act was always required. For roles: does promising to water plants create a new duty or just raise acceptable costs? And for blame: if we stopped blaming for murder, would that make it permissible? Here eliminativists will say no - blame practices don't define deontology.

  Finally, the verbal dispute note is essential. Much turns on whether "duty" is defined by blameworthiness. If optionalists define duty that way, eliminativists call it question-begging. But there's deeper disagreement about moral ontology - whether "permissible omission" is a distinct category.

  The user's framing is excellent. By requesting predictions in advance for test cases, they're forcing both sides to commit to falsifiable positions. This will make their chapter unusually rigorous. I'll avoid citations as requested but structure everything to slot references in easily.
answer: |-
  Here is the adversarial collaboration framework for your supererogation chapter, structured as requested:

  **1. Agreed Claims (Common Ground & Settled Non-Starters)**

  1.  **Paradigm Cases Exist:** There are acts widely described as "supererogatory" (e.g., heroic rescues involving extreme risk, significant anonymous donations, exceptional forgiveness). Any account must explain the phenomenology and common moral judgments surrounding these cases.
  2.  **Asymmetry of Praise & Blame:** For these paradigm acts, it is appropriate to praise the agent who performs them, yet it is *not* appropriate to blame the agent who omits them. This asymmetry is central and requires explanation.
  3.  **Beyond ≠ Indifferent:** Acts described as "beyond duty" are not morally indifferent. They are positively evaluated (often as "good," "admirable," or "best") and their omission is not morally equivalent to omitting a merely permissible act (like scratching one's nose).
  4.  **"Duty" is Loaded:** The term "duty" carries significant normative weight; labeling an act as a duty implies blameworthiness for omission (in the absence of excusing conditions). This linguistic intuition needs respecting.
  5.  **No Argument Settled By:** Appeals *only* to "intuitions" about paradigm cases (both sides claim to accommodate them). Invocations of "moral saints" (both sides claim their view explains admiration). General appeals to the "stringency" of morality (both sides acknowledge constraints).
  6.  **Optionalist Concession:** Not *every* act praised is supererogatory; some praiseworthy acts are simply duties done well. "Praiseworthiness" alone is insufficient to define supererogation.
  7.  **Eliminativist Concession:** Some praiseworthy acts are not strictly required by standard deontic rules (like specific promises or justice); they involve significant personal sacrifice for the sake of others' good. The eliminativist must explain why these are not duties.

  **2. Residual Disagreements (Formulated Adversarially)**

  | # | Disagreement Area          | Optionalist Position (O)                                                                                                 | Eliminativist Position (E)                                                                                                                                 |
  | :-- | :------------------------- | :----------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | 1  | **Existence of Category**  | **O:** There exists a distinct deontic category: acts that are morally best, praiseworthy to do, *and* permissibly omissible such that their omission warrants no blame whatsoever. | **E:** Every apparent instance of this category is either (a) a genuine duty where our reluctance to blame stems from excuses or epistemic/practical limits of blame practices, or (b) an act evaluated as "best" or "admirable" that is *not required*, but whose omission is either blameworthy (though we often excuse it) or whose deontic status is non-obligatory permissibility without supererogatory weight. |
  | 2  | **The Conjunction Problem** | **O:** The permissibility of omitting any *single* instance of a trivial-sacrifice/high-benefit act (where doing it is best) does *not* entail the permissibility of omitting *all* instances in a series where aggregate omission is disastrous. The moral landscape changes with repetition/aggregation. | **E:** If omitting *each individual instance* in a series is truly blameless (as O claims for single instances), then omitting *all* instances must also be blameless. The disastrous aggregate outcome reveals the initial judgment (blameless single omission) was mistaken; the single act was a duty all along. |
  | 3  | **Role/Relationship Duties** | **O:** Roles/relationships (parent, lifeguard, promisor) can create context-specific supererogatory demands *beyond* the universal minimum duties of aid, where omission is blameless but performance is praiseworthy. | **E:** Roles/relationships primarily alter the baseline of what costs it is reasonable to demand an agent bear without excuse. They generate *duties* specific to the role. Acts "beyond" these specific duties are either still within the adjusted duty baseline (and required) or are merely evaluatively good, non-obligatory acts whose omission might be excused but is, strictly, blameworthy. |
  | 4  | **Blame as Deontic Evidence** | **O:** The robust, cross-cultural absence of blame for omitting paradigm supererogatory acts (even under ideal conditions) provides strong evidence that they are *not* duties. Blame practices reliably track deontic status. | **E:** The absence of blame reflects the limits of human demandingness, legitimate excuses (cost, effort, competing projects), or the practical inutility of blame in such cases. It is not reliable evidence for the absence of a deontic requirement. Deontic status is prior to and independent of actual blame practices. |

  **3. Cruxes & Test Cases (Predictions Recorded)**

  1.  **Crux: Conjunction & Aggregation**
      *   **Case:** Alice can save a distant stranger from severe, lasting harm (e.g., blindness) each day for 100 days by donating $1 (a trivial sacrifice for her). Each opportunity is independent and unforeseeable at the start. She omits every single one. Aggregate harm: 100 people blinded. Each individual omission seems, intuitively, blameless.
      *   **Optionalist Prediction:** Omitting *each single* $1 donation is blameless (supererogatory). Omitting *all 100* is morally disastrous and blameworthy. The permissibility of omitting a single act is *not* closed under conjunction. Aggregate cost/benefit creates a new deontic demand.
      *   **Eliminativist Prediction:** If omitting *one* $1 donation is truly blameless, omitting *all 100* must also be blameless. The disastrous outcome shows the initial intuition is wrong; donating the $1 *each time* was actually a duty (perhaps a weak one, but blameworthy to omit, even if blame is rarely assigned due to cost/excuses).

  2.  **Crux: Roles - New Duties or Adjusted Baselines?**
      *   **Case:** Ben, an off-duty lifeguard with no official obligation, is the only person on a deserted beach who sees a stranger drowning just beyond the surf. Rescue requires significant effort and minor risk (e.g., strong current, scrapes). Ben chooses not to rescue. The stranger drowns.
      *   **Optionalist Prediction:** Ben's lifeguard training makes rescue *easier* and less risky for him than for a typical bystander, but he is off-duty. Rescue is supererogatory: praiseworthy if done, omission blameless (though perhaps judged harshly). His role lowers the threshold for supererogation, not the duty baseline.
      *   **Eliminativist Prediction:** Ben's specific capacity (training) significantly reduces the cost/risk *he* must bear to save a life. This reduction pushes the act *below* the threshold of what can reasonably be demanded, making rescue a *duty* for Ben in this context. His omission is blameworthy, even if understandable/excusable in practice.

  3.  **Crux: Blame Practices as Evidence for Deontic Status**
      *   **Case:** Consider a society identical to ours in moral reasoning capacities and concepts, but with radically different blaming practices. In this society, people *never* feel or express blame towards anyone for *any* failure to perform significant, costly acts of beneficence (e.g., failing to donate a kidney to a stranger, failing to risk life in a rescue), even when clearly feasible and maximally beneficial. They praise those who do such acts, but feel *no* disapproval towards those who omit.
      *   **Optionalist Prediction:** This consistent absence of blame, even under ideal epistemic conditions in this society, strongly suggests that in *their* moral reality (and plausibly ours), these acts are *not* duties; they are genuinely supererogatory. Blame absence tracks deontic permission.
      *   **Eliminativist Prediction:** The absence of blame in this society reflects a *flaw* in their moral practices or understanding (e.g., an overly lax view of demandingness, an excessive focus on personal projects). The deontic facts remain: saving a life at moderate cost *is* a duty. Their failure to blame is a failure to recognize this duty properly, not evidence that the duty doesn't exist. Deontic status is independent.

  **4. Closing Note: Verbal & Substantive Elements**

  A significant portion of the dispute is **verbal**, centering on the definition of "duty." If "duty" is *defined* as "that for which omission warrants blame" (absent excuses), then supererogation follows trivially from the praise-blame asymmetry. The eliminativist decisively rejects this definition as question-begging and phenomenologically inaccurate (we often feel "ought" without immediate blame-feeling). For the eliminativist, "duty" refers to an objective deontic requirement, prior to and grounding blame practices.

  However, the dispute is **not merely verbal**. Behind the definitional clash lie **substantive disagreements**:
  1.  **Moral Ontology:** Is there a distinct deontic category of "permissible best" acts, or are all acts either obligatory, permissible (but not "best"), or forbidden?
  2.  **The Scope of Requirement:** How demanding is morality? Does the conjunction problem reveal a limit to optionalism or a flaw in our intuitions about single cases?
  3.  **Grounding of Role-Obligations:** Do roles fundamentally create *new* deontic facts, or simply recalibrate the application of general principles (like beneficence, fairness) based on capacity and expectation?
  4.  **Epistemology of Deontic Status:** Can we reliably infer deontic requirements from our blaming practices (and their limits), or are deontic facts accessible independently, potentially revealing those practices to be flawed?

  The core substantive issue is whether the structure of morality *requires* the category of the supererogatory to make sense of our strongest considered judgments across diverse cases, or whether those judgments can be systematically explained (or explained away) within a framework of duty and permission alone. The cruxes above are designed to pressure these substantive commitments.
