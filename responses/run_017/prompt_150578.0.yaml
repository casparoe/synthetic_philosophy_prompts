  ### Joint Statement on the Color Phi Phenomenon and the Timing of Conscious Experience

  #### 1. Agreed Claims  
  Both Camp S and Camp O endorse the following statements:  
  1. **Phenomenology**: Observers consistently report a single disc moving from the first location to the second, with an abrupt color change perceived mid-trajectory (around 50 ms into the sequence), and the change is reported to occur *before* the second disc is physically presented.  
  2. **Neural Timings**: The timing of neural activity in early sensory areas (e.g., V1/V2) is not directly probative of the timing of conscious experience. Only neural correlates of integrated, reportable content bear on Q.  
  3. **Probes**: A valid probe on the system’s content at time T must (a) elicit information about the content of experience *at T*, (b) minimize interference, and (c) not rely solely on delayed reports, which are susceptible to post-hoc reconstruction. Retrospective reports cannot distinguish between Camp S and Camp O.  
  4. **No-Fact-of-the-Matter Challenge**: We reject the third camp’s inference that the indistinguishability of S and O via reports implies no fact of the matter. The inference fails because temporal experience may have structure not capturable by reports. However, we concede this challenge highlights the methodological difficulty in accessing the "real-time" stream of consciousness.  

  #### 2. Disagreements Table  
  | Issue | Camp S’s Formulation | Camp O’s Formulation | Status |  
  |-------|----------------------|----------------------|--------|  
  | Existence of an overwritten conscious draft | There was never a conscious experience of the unrevised sequence; the first conscious draft is the final reportable version. | The subject underwent an earlier conscious draft (e.g., of a red disc moving fully) that was overwritten by the revised version. | Substantive |  
  | Content of experience before the second flash | Before the second flash, there was no conscious experience of motion or color change; any apparent mid-trajectory change is a retrospective attribution. | Before the second flash, there was a conscious draft of a disc moving without color change (or with indeterminate change). | Substantive |  
  | Temporal locus of the color change | The color change is experienced *as if* at 50 ms due to post-stimulus construction, not because it was consciously present at that time. | The color change is experienced at 50 ms because it was incorporated into the revised draft, replacing the original content. | Partly verbal |  

  #### 3. Cruxes Section  
  **(a) Deferred-Disambiguation Probe**  
  - **Crux**: Was there a determinate conscious experience at 50 ms when the hue is physically undetermined until 200 ms?  
  - **Test**: Achromatic second flash + colored surround at 200 ms; observers report hue change at 50 ms.  
  - **S Prediction**: No conscious experience occurred at 50 ms; the reported change is a back-dated construction.  
  - **O Prediction**: The earlier draft included motion and a generic "color change" placeholder, but no determinate hue.  
  - **Decisiveness if Contrary**: If a real-time probe at 50 ms revealed *determinate* hue, O is refuted (decisive); if it revealed *no experience*, S is refuted (decisive).  
  - **Moves Both**: True.  

  **(b) Deleted-Draft Trace Test**  
  - **Crux**: Does a displaced conscious draft leave neural or behavioral traces?  
  - **Test**: Measure residual priming (e.g., for "red-at-second-location"), recoverability via mid-sequence probes, metabolic costs (e.g., fMRI), or report confidence.  
  - **S Prediction**: No traces of a displaced draft; priming reflects pre-conscious processing. Final reports are high-confidence.  
  - **O Prediction**: Traces exist: priming for overwritten content, recoverability via rapid probes, higher metabolic cost. Reports may show reduced confidence.  
  - **Decisiveness if Contrary**: Traces found → decisive against S; none found → damaging but not decisive against O (traces may be erased).  
  - **Moves Both**: True.  

  **(c) Interruption Probe**  
  - **Crux**: Can O accommodate the color change report when the second flash is masked?  
  - **Test**: Mask after first flash abolishes report of second flash; color change is still reported mid-trajectory.  
  - **S Prediction**: Favors S: construction uses pre-conscious input.  
  - **O Prediction**: O accommodates: revision occurs using pre-conscious input to overwrite the initial draft.  
  - **Decisiveness if Contrary**: If no change is reported when masked, awkward for both; otherwise, not decisive.  
  - **Moves Both**: False (only S gains support).  

  #### 4. Closing Section  
  - **Verbal Components**: Disagreements about "draft" (whether non-reportable states qualify as conscious) and "revision" (whether it implies agency) are partly verbal.  
  - **What Would Move the Debate**:  
    - A positive result in the **deleted-draft trace test** (e.g., recoverable priming) would decisively favor O.  
    - A real-time probe in the **deferred-disambiguation test** showing *no experience* at 50 ms would decisively favor S.  
    - Both camps agree the trace test is the most promising path forward.  

