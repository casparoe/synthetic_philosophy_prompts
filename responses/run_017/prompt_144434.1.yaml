prompt: |-
  I have no academic background in any of this — I studied supply chain management and now spend my days planning warehouse layouts — but for a couple of years I have been reading about intelligence on my own: a bit of psychometrics, a fair amount of machine-learning material, and a lot of arguments with a friend who designs the reasoning tests a large employer uses for graduate hiring. What puzzles me is that the disagreement about what intelligence actually is never seems to move, even though nobody involved appears to be wrong about any fact. The test-centred crowd treat it as a single general capacity that predicts performance across wildly different tasks; people from an education background reply that it is really several separable capacities that a single number flattens into something misleading; and the AI people I read about define it either as goal-achievement across a wide range of environments or as the rate at which a system turns experience and prior knowledge into new skills. I have started testing these against cases I invent: a system that learns any video game from ninety seconds of footage but cannot add two two-digit numbers; a system that needs ten thousand supervised examples to pick items in one particular warehouse and is then superhuman at exactly that and nothing else; a person who is very slow at everything but needs to be shown a new procedure only once; and a model that is excellent at anything phrased as a multiple-choice question and useless at the same material in free text. Every definition gives an answer, the answers disagree, and yet none of the people arguing seem surprised by this or treat it as a crisis.

  My own hypothesis — please treat it as a hypothesis and push back on it if it is wrong — is that the word is quietly doing three different jobs at once: predicting how well someone or something will do, explaining why they do well, and settling how much respect or moral consideration they are owed; and that people slide between those jobs in the middle of an argument, so each side is right about its own job and wrong about the others. There may also be a hidden empirical question doing the real work. In humans, performance on quite different-looking tasks correlates positively, which is what makes a single general factor look respectable in the first place, whereas the artificial systems I read about have visibly jagged profiles — one is brilliant at writing working code and hopeless at planning a route, another is the reverse — and maybe that contrast is a fact about how minds get built and trained rather than a fact about intelligence. So: is this a verbal dispute about a word, a substantive dispute about whether there is a natural kind here at all, a clash about what a definition is supposed to do for us, or several different questions being asked under one heading? I would like a diagnosis with reasons rather than a tour of the positions, one that engages with what each side genuinely claims, and an honest account of what would count as progress — a distinction to draw, a measurement to make, a formal result, a better question to ask instead — or else an argument that no progress should be expected, and why.

  Two smaller requests: please write your answer in British English, and please don't point me towards books or papers to follow up, since I have no library access where I live and could not chase them up anyway. A self-contained answer of roughly six hundred to nine hundred words would suit me well.
reasoning: |-
  Okay, let me try to unpack this user's query. They're coming from a supply chain background but have been diving into intelligence theories on their own. They're frustrated because despite all their reading, the definitions of intelligence—psychometrics, education, AI—don't seem to converge. They've even created test cases to challenge these definitions, and each framework gives conflicting answers without anyone acknowledging it as a problem. 

  The user's hypothesis is that "intelligence" is serving three different functions: prediction, explanation, and moral consideration. They also suspect that the human-AI divergence in performance correlation might be a key empirical factor. They want a diagnosis of whether this is a verbal dispute, a clash of definitions, or something substantive, along with what progress would look like.

  First, I need to validate their observations. It's true that psychometrics (g-factor), educational theory (multiple intelligences), and AI (efficiency or generality) approach intelligence differently. The user's test cases are clever—like an AI mastering games but failing math—which highlights how these frameworks prioritize different things. 

  Their hypothesis about the three functions feels spot-on. Psychometrics is predictive, educational theory is explanatory, and the moral dimension lurks in debates about AI rights. The human-AI contrast in performance correlation is also astute: humans show positive manifold (tasks correlate), while AIs have "jagged profiles." That's less about intelligence itself and more about how evolution vs. engineering shapes cognitive systems. 

  The core issue seems to be that "intelligence" isn't a natural kind but a context-dependent construct. Progress wouldn't come from a unified definition but from clarifying: (1) What goal are we measuring for? (2) What mechanisms matter here? (3) Is moral status even tied to this metric? The jagged-profile observation helps because it shows why psychometric tools fail for AI—they assume a general factor that doesn't exist in engineered systems. 

  For the user, who's clearly thoughtful but time-constrained, I should emphasize pragmatic takeaways: treat definitions as tools, not truths, and demand specificity when others use the term. The real progress is in disentangling the questions, not answering a single one.
answer: |-
  Your diagnosis is perceptive and largely correct—this isn't a single dispute but a tangle of distinct questions masquerading as one, exacerbated by contextual shifts in what "intelligence" is meant to *do*. Here's a breakdown engaging with each perspective and what progress might entail:

  ### 1. **The Three Jobs of "Intelligence"**
  Your hypothesis hits the mark:  
  - **Prediction** (Psychometrics/AI Engineering): Here, intelligence is a *metric* for forecasting performance. The "g-factor" in psychometrics or "general capability" in AI values *parsimony*: a single number predicting outcomes efficiently (e.g., job performance, game-winning). The test-centred crowd aren't claiming this captures all cognitive nuances—they prioritise utility in decision-making.  
  - **Explanation** (Educational Psychology/Cognitive Science): This views intelligence as *mechanistic*. Educators see distinct capacities (logical, spatial, interpersonal) because they design interventions targeting specific processes. A single metric "flattens" this by ignoring *how* results are achieved—hence their focus on separable skills.  
  - **Moral Consideration** (Philosophy/Ethics of AI): Here, intelligence implies a threshold for rights or respect. When AI researchers debate if a model is "truly intelligent," they’re often probing whether it merits agency or moral status. This layer is rarely explicit but fuels disagreements (e.g., "Is ChatGPT *intelligent* or just stochastic?").

  When these jobs collide—e.g., using a predictive metric (g-factor) to explain cognition or assign moral worth—arguments become intractable. Each side invokes "intelligence" but answers different questions.

  ### 2. **The Empirical Divergence: Humans vs. AI**
  Your observation about "jagged profiles" in AI versus human positive manifold is crucial. In humans, diverse cognitive tasks *correlate* (forming a "general factor") likely due to:  
  - Evolutionary constraints favouring cognitive efficiency.  
  - Shared biological mechanisms (e.g., working memory, neural speed).  
  - Developmental feedback loops (learning maths aids logic, which aids planning).  

  AI systems lack these constraints. They’re optimised for narrow tasks, creating "jaggedness":  
  - A game-playing AI uses convolutional nets optimised for pixel patterns, unrelated to arithmetic.  
  - A warehouse-picking model masters spatial logistics but fails at text comprehension.  

  This isn’t contradictory—it reveals that "general intelligence" in humans is an emergent property of biological systems, not a necessary feature of intelligence *as such*. AI exposes that cognition can be highly competent yet modular and discontinuous. Psychometrics assumes correlation; AI engineering often rejects it.

  ### 3. **Is This Merely Verbal? Partly, But Not Trivially**  
  The core confusion is **categorical**:  
  - Psychometrics treats intelligence as a *statistical construct* (a latent variable).  
  - Educators treat it as a *set of cognitive mechanisms*.  
  - AI treats it as *functional competence* (goal achievement).  

  These aren’t competing truths but different *categories of description*. Calling it "just verbal" undersells the stakes: the choice of definition reflects priorities (prediction vs. intervention vs. ethical evaluation). However, your test cases reveal where definitions *empirically clash*:  
  - A system that learns games instantly but can’t add numbers is "intelligent" under AI’s functional view (it masters environments) but "low-g" under psychometrics (it fails basic reasoning).  
  - The slow-but-once-taught human scores poorly on speeded tests (psychometrics) but high on explanatory views (efficient latent learning).  

  ### 4. **What Would Progress Look Like?**  
  Resolution requires **disentangling the questions**:  
  - **Specify the goal**: "Are we predicting job success? Diagnosing learning needs? Assigning rights?" Demand clarity on *why* we’re measuring.  
  - **Accept pluralism**: Reject "one true definition." A warehouse-layout AI doesn’t need "general intelligence"—it needs spatial optimisation. Human hiring may validly use g-factor for broad prediction.  
  - **Decouple morality from metrics**: Moral status likely hinges on consciousness/sentience, not test scores. A maths-genius AI merits no more rights than a calculator.  
  - **Leverage the jaggedness**: In AI, abandon human-derived frameworks. Define intelligence *relative to domain-specific performance curves* (e.g., "sample efficiency in unseen games").  

  ### Why No Crisis?  
  Each camp focuses on its own operational needs:  
  - Psychometricians *want* a simple predictor—they’re untroubled by AI jaggedness as they work on humans.  
  - Educators prioritise tailored interventions—they dismiss single scores as reductive.  
  - AI researchers seek scalable competence—they care about generality across *their* environments (e.g., games, not maths).  

  **In short**: The dispute persists because each framework serves its purpose well internally. Your insight—that "intelligence" smuggles in prediction, explanation, and ethics—is the key. Progress means asking: "Which of these are we *actually* discussing?"—then using the right tools for that job. The empirical divergence between human and artificial cognition isn’t a problem to solve but a fact to exploit: it shows intelligence isn’t a universal natural kind, but a context-dependent construct.
