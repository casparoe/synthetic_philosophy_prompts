prompt: |-
  I write novels, which mostly means inventing people's inner lives and then getting emails about them. I've now watched the same thing happen three times and I need a word for it, because I want to talk about it in an afterword and I'd rather not grab some term of art and use it wrong.

  Instance one. A few years back I gave a character a very specific way of going flat — not sad exactly, more like the volume drops on everything, and she can describe it perfectly well and can't do anything about it. I got maybe forty messages from readers saying some version of: that's me, and I never had a word for it until I read it. Several said they'd gone and got diagnosed with something on the strength of it. Fine. Expected.

  Instance two is the one that got under my skin. When I started the sequel I went looking for how clinicians actually describe that flat-volume thing, and the descriptions I found — a patient handout, a long Q&A on a clinic's site — use almost the vocabulary my character used: the same metaphors, the same move of insisting it isn't sadness, everything is just behind glass. I'm definately not claiming anyone read my book. It's more that my book and the clinic were both drawing on the same pool of first-person talk that had been going around in memoirs and forums for years.

  So here's the shape I keep seeing. A way of describing an experience shows up first in ordinary language. It gets taken up as clinical description, because there isn't really any better evidence for what something is like from the inside. Once it's in the clinical description it gets handed back to people as the way to recognize the thing in themselves. Those recognitions come back as more first-person talk, which is the raw material for the next version of the category. Each turn the picture gets a bit sharper. The label on the box never changes, so nobody experiences the category as having moved, but the thing in the box is not the thing that was in it twenty years ago.

  And the part I actually care about: the loop seems to run in different directions depending on whether anyone wants the label. Where the label is something people seek — it gets you accomodations, or it hands you the story of your own life — the loop seems to tighten: more people arrive, the descriptions converge, the category gets steadily better at catching the mild end. Where the label is something people dodge, it seems to run backwards: the people who end up carrying it are disproportionately the ones who couldn't dodge it, because a court or a school or a family dragged them in, and then the clinical picture gets built out of that group, so the typical case is a sample nobody chose, and the condition ends up looking more severe and more tangled up with trouble than it probably is.

  Someone told me there's a name for the general shape of this, and I half-remember it being about the people changing. But my thing is about the picture changing, and I don't think those are the same thing.

  What I need: the nearest established concepts, taken one at a time, each with where it fits what I've described and where it doesn't, and then a verdict on which one earns the right to be used in a sentence — or a straight there isn't one, plus a coinage with a definition. A friend said medicalization, but that's about turning ordinary life problems into illnesses, and another said self-fulfilling prophecy, which can't be right because nothing here fails to come true. I don't want a bare label. I want the edges: one case that's clearly inside, one that's clearly outside, and one you'd genuinely hesitate over. And if the direction thing — the loop tightening or inverting depending on whether the label is wanted — is itself a named moderator, I want that separately, because that's the bit with the teeth in it.

  One more thing: I'm on deadline in a place with terrible wifi and I can't check any of this. So tell me how confident you are in each name you hand me, flag any you might be half-remembering or quietly inventing, and single out the one claim in your answer you'd be least surprised to find out is wrong.
reasoning: |-
  Okay, the user writes novels and has observed this recurring pattern where their fictional descriptions of mental states resonate with readers, who then identify with them. Then, they notice that clinical descriptions start using similar language, creating a feedback loop. They want a precise term for this phenomenon to use in their afterword. 

  First, I need to unpack their description. They mentioned three instances: readers recognizing themselves in a character's experience, clinical materials echoing their fictional language without direct influence, and a cyclical process where personal descriptions inform clinical categories, which then shape self-perception. The key points are the iterative refinement of the category and how the desirability of the label affects the loop's direction—tightening for sought-after labels, broadening for stigmatized ones.

  The user explicitly wants established concepts, not just labels. They want each term explained with its fit and gaps, plus a verdict. They also mentioned medicalization and self-fulfilling prophecy as rejected options. Medicalization is too broad (turning life into illness), and self-fulfilling prophecy doesn't apply because the phenomenon validates rather than creates falsehoods. 

  Now, recalling relevant concepts:
  - **Diagnostic creep**: Expansion of diagnoses to milder cases. Fits the tightening loop for desired labels but ignores the language evolution aspect.
  - **Illness appropriation**: When patients adopt clinical terms for identity. Relevant but focuses on identity, not category refinement.
  - **Semantic contagion**: Spread of descriptive language. Matches the shared metaphors but lacks the clinical feedback loop.
  - **Reflexive looping**: Hacking's term for how classifications interact with the classified. This seems closest—describes the mutual shaping, but Hacking focused more on identity changes than linguistic precision.
  - **Protoprofessionalization**: Pre-diagnostic community language shaping clinical terms. Fits the origin of descriptions but not the full cycle.

  Hacking's reflexive looping is the strongest fit. It accounts for the evolving definitions and the feedback between personal experience and clinical categories. The desirability factor modifying the loop direction isn't directly named, but concepts like diagnostic expansion (for desirable labels) and diagnostic overshadowing (for stigmatized ones) touch on it. 

  For the verdict: Reflexive looping is the core term. The directional effect might be framed as "valence-driven diagnostic drift"—valence for desirability, drift for movement. Coining this seems reasonable since no existing term perfectly captures it. 

  Confidence check: Reflexive looping is well-cited in philosophy of science. The directional analysis is more speculative but grounded in sociology (Conrad on medicalization). The weakest claim is linking diagnostic overshadowing to the broadening loop—it's usually about misattribution, not category severity. 

  User's deeper needs: They're a novelist seeking precision for readers, likely wanting to highlight how language and labels shape understanding of mental states without academic jargon. They also subtly critique diagnostic systems—showing categories as fluid, not fixed. Their "edges" request suggests they want to avoid misrepresentation, respecting both lived experience and clinical nuance. 

  Final structure: Present each term with fit/misfit, endorse reflexive looping, coin valence-driven diagnostic drift for the desirability effect, and flag the diagnostic overshadowing link as the shakiest part.
answer: |-
  Based on your detailed description, here's a breakdown of the nearest concepts, their fit, and a verdict. I'll flag confidence levels and potential coinages clearly.

  **Core Phenomenon: The Evolving Feedback Loop**

  1.  **Reflexive Looping (or Interactive Kinds - Ian Hacking):**
      *   **Fit:** This is the strongest contender for your core cycle. Philosopher Ian Hacking describes how scientific classifications (like diagnostic categories) interact with the people classified ("human kinds"). As people become aware of the classification, they change their behavior and self-understanding, which in turn changes what the classification means and how it's applied. This creates a feedback loop. It directly addresses your "picture changing" while the "label stays the same." The "pool of first-person talk" becoming clinical description and then being handed back is classic reflexive looping.
      *   **Misfit:** Hacking focused more on the *people* changing their behavior/identity in response to the label (e.g., "multiple personality disorder" creating expectations that shape behavior). Your emphasis is slightly different: you're zooming in on the *evolution of the description/category itself* driven by the feedback loop, especially the origin in "ordinary language." It also doesn't explicitly name the *direction* shift based on desirability.
      *   **Confidence:** High for the core mechanism. This is a well-established concept in philosophy of science/sociology of knowledge. Hacking's work ("The Social Construction of What?", "Mad Travelers") is the primary source. **Verdict: This earns the right to be used in a sentence.** "The character's experience tapped into a process of reflexive looping, where personal descriptions refine clinical understanding, which then reshapes self-perception."

  2.  **Illness Appropriation / Symptom Borrowing:**
      *   **Fit:** Captures the moment where readers adopt the description/label for their own experience ("that's me"). Explains how personal narratives integrate clinical or proto-clinical language.
      *   **Misfit:** Focuses on the individual act of adoption, not the larger systemic feedback loop where the clinical definition itself evolves based on aggregated personal reports. It's a piece of your loop, not the loop itself.
      *   **Confidence:** Medium-High. "Illness appropriation" is used in medical sociology/anthropology, though less universally standardized than "medicalization." **Verdict:** Useful for describing the *reader response* component, but not the full cycle.

  3.  **Semantic Contagion / Memetic Spread of Description:**
      *   **Fit:** Describes how a specific way of describing an experience (the metaphors: "volume drops," "behind glass") spreads through a population (forums, memoirs, fiction, clinics). Explains why your character and the clinic used such similar language independently – the memetic description was circulating.
      *   **Misfit:** Primarily about the spread of *language/formulation*, not necessarily the evolution of a *diagnostic category* or the *feedback loop* that reinforces and refines it based on adoption. Doesn't address the label desirability effect.
      *   **Confidence:** Medium. "Semantic contagion" is used informally, sometimes academically in linguistics/sociology. "Memetic spread" is related to meme theory (Dawkins), applicable but not clinical. **Verdict:** Explains the *shared language* aspect well, but is too narrow for the full phenomenon.

  4.  **Diagnostic Creep / Conceptual Creep:**
      *   **Fit:** Perfectly describes the "tightening" loop for desirable labels: the category broadens to include milder or previously unremarked cases ("better at catching the mild end") as awareness spreads and the description becomes more accessible/recognizable. The "picture gets sharper" at the edges.
      *   **Misfit:** Doesn't inherently include the origin in first-person language or the full feedback loop (clinical description -> self-recognition -> more talk -> refined category). Primarily describes the *expansion* outcome, not the mechanism. Doesn't address the "undesirable label" loop running in the opposite direction.
      *   **Confidence:** High. "Diagnostic creep" is common in psychiatry/psychology discussions (e.g., debates about DSM expansions). "Conceptual creep" is broader. **Verdict:** Excellent for describing the *outcome* of the loop for *desirable* labels, but not the full bidirectional mechanism.

  5.  **Protoprofessionalization (Arthur Kleinman):**
      *   **Fit:** Describes how patient groups and lay communities develop their own sophisticated understandings, vocabularies, and interpretations of illness *before* they are fully adopted or formalized by professionals. Fits your "pool of first-person talk" becoming clinical description.
      *   **Misfit:** Focuses on the *development* of lay expertise challenging or informing professional knowledge, not necessarily the iterative *feedback loop* where the clinical description, once adopted, is then used by individuals to understand themselves, generating more data. Less emphasis on the category evolving *after* professional adoption.
      *   **Confidence:** Medium. Kleinman's term is established in medical anthropology but not universally known outside it. **Verdict:** Captures the *origin* phase well, but not the ongoing cyclical refinement.

  **The Directional Effect (Label Desirability as Moderator)**

  *   **For Desirable Labels (Tightening Loop):**
      *   **Diagnostic Expansion / Broadening:** As above. Driven by awareness, reduced stigma, perceived benefits (accommodations, identity), and the feedback loop itself.
      *   **Medicalization (Partial Fit):** While you rightly note it's often about turning ordinary problems into illnesses, a *subtype* involves the *expansion* of existing medical categories to include less severe presentations, often driven by patient advocacy, pharmaceutical influence, and... the feedback loop you describe. The "seeking the label" aspect aligns with forces driving medicalization.
  *   **For Undesirable Labels (Broadening/Severity Loop):**
      *   **Diagnostic Overshadowing:** Usually refers to attributing *all* of a person's problems to their diagnosis, ignoring other factors. *Loosely fits* the outcome where the clinical picture becomes defined by the most severe, complex cases ("more severe and more tangled up with trouble") because only those unable to avoid the label enter the system. The *category itself* becomes overshadowed by the characteristics of the coerced sample.
      *   **Sampling Bias / Ascertainment Bias:** A core statistical concept. The clinical picture is skewed ("built out of that group") because only a non-representative subset (those "dragged in") is observed and defines "the typical case." This is the *mechanism* driving the undesirable label loop.
  *   **A Potential Coinage for the Directional Moderator:** **Valence-Driven Diagnostic Drift.** "Valence" captures the positive/negative desirability. "Drift" implies movement in definition. "Tightening" (for positive valence) involves drift towards inclusivity/milder presentations; "Broadening/Severity" (for negative valence) involves drift towards severity/complexity due to biased sampling. **Confidence in Coinage:** Invented here, but grounded in your description and existing concepts (valence, drift). **Verdict:** Sampling Bias is the clear *mechanism* for the undesirable loop. For the *overall phenomenon* of the loop's direction depending on desirability, **Valence-Driven Diagnostic Drift** effectively captures the unique dynamic you describe.

  **Verdict & How to Write the Sentence**

  1.  **Core Mechanism:** Use **Reflexive Looping (Hacking)**. It's the most established concept capturing the feedback cycle where the classification and the classified mutually reshape each other, leading to an evolving definition under a stable label.
  2.  **Directional Effect:** Use **Valence-Driven Diagnostic Drift** for the moderator effect. It's a clear coinage that directly addresses your key insight about desirability shaping the loop's outcome. Alternatively, describe it explicitly: "The loop's direction – tightening toward milder cases or broadening toward severity – depends critically on the social desirability of the diagnostic label."
  3.  **The Sentence:** "What I observed was **reflexive looping** in action: the character's description, drawn from the well of lived experience, converged with emerging clinical language, which then became a lens for readers' self-understanding, further refining the category itself. Crucially, this loop exhibits **valence-driven diagnostic drift**: where the label is sought, definitions tighten to capture subtler experiences; where it's dreaded, they broaden towards severity, shaped by who gets caught in the diagnostic net."

  **Edges & Confidence Flags**

  *   **Clearly Inside:** Your Instance #2 (clinic using identical metaphors independently) is classic evidence of reflexive looping via shared cultural memes/protoprofessionalization feeding into formalization.
  *   **Clearly Outside:** A purely biological disease definition (e.g., a specific genetic mutation causing a metabolic disorder) discovered in a lab, where the diagnostic criteria are objective and fixed, and patient experience doesn't reshape the core definition – only management. The label doesn't "drift."
  *   **Hesitation Case:** The rise of "Internet Addiction" or "Gaming Disorder." It shows protoprofessionalization (online communities describing burnout/compulsion), potential reflexive looping (awareness shaping behavior & reporting), diagnostic creep (debates over thresholds), and valence questions (sought by some for validation/help, dodged by others due to stigma). But is the *clinical core* truly evolving based on feedback, or is it still hotly contested and ill-defined? Hesitation is warranted.
  *   **Confidence Flags:**
      *   **Highest Confidence:** Reflexive Looping (Hacking), Diagnostic Creep, Sampling Bias.
      *   **Medium Confidence:** Protoprofessionalization (Kleinman), Illness Appropriation (as a component). Semantic Contagion (descriptive, not systemic).
      *   **Coinage:** Valence-Driven Diagnostic Drift (Confident it fits *your* phenomenon, but you're inventing it).
      *   **Weakest Claim:** Linking **Diagnostic Overshadowing** to the *category definition* in the undesirable loop. Overshadowing is typically about *individual* misattribution, not the *population-level* definition shift you describe (though biased sampling *causes* the population that *gets* overshadowed). **This is the claim I'd be least surprised to find criticism of.** Sampling Bias is the cleaner, more fundamental mechanism for that part.

  **In summary:** Use **Reflexive Looping** for the core feedback mechanism. Coin **Valence-Driven Diagnostic Drift** for the crucial desirability moderator effect on the loop's direction. Acknowledge **Diagnostic Creep** for the desirable outcome and **Sampling Bias** for the undesirable one. This gives you precise, defensible terminology grounded in established ideas while capturing your unique insight. Good luck with the deadline!
