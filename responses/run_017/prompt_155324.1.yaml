prompt: |-
  You're a professional philosopher who also reads and teaches a lot of fiction, so please brainstorm for a bit before you settle on a line, and think carefully rather than just turning out the first thing that comes to mind. I'm doing a short series for my newsletter on novels that seem to be arguing with a philosophical position, and next up is Kazuo Ishiguro's The Remains of the Day. I want to read it through the debate about judging historical figures and the 'he was a man of his time' defence. Lord Darlington — the appeaser who dies disgraced after the war, and who sacks the two Jewish maids to please a guest and is protested by Miss Kenton — is a stand-in for exactly the sort of figure people argue about when they argue about Jefferson or Churchill, and Stevens spends the whole book both defending him and quietly not defending him. The wrinkle I keep chewing on: the standard debate treats the defence as something said about an agent by people standing outside the story, but Stevens has a stake in the verdict. If Darlington was blameworthy, the life Stevens spent serving him was wasted, so his loyalty and his use of the defence are self-interested in a way the usual discussion never models. Does that make his deployment of it worse, or does it just reveal that the defence is always offered from somewhere? Also, I want you to separate two things the defence usually runs together — that Darlington couldn't have known better (an epistemic excuse) and that our standards just don't reach him — because in the novel he is corrected at the time by people with far less power than him, which seems to weaken one version more than the other. And does the book think the verdict on Darlington is separable from the verdict on whether Stevens's life was worth living at all, or does it insist they come apart? Please say where the novel resists the reading, and don't pad it out with sources or further reading since I can't chase them up. Write in continuous prose only — no headings, bullets, bold text or tables — like an email from a friend who happens to know a lot about this, and don't quote the novel, I don't have my copy to hand to check anything.
