  I'm a novelist — lit fic, a coupld of books, one of them translated into three languages I can't read — and I want the gavagai business restated in the vocabulary I actually work in, because I keep goign in circles with it.

  Here's the version I keep coming back to. In chapter seven my protagonist watches a white shape dart across a field and says one line out loud — call it "Gavagai." I know what I meant when I wrote it. Now imagine a translator who has only the text: no author to ask, no drafts, no notes, just the sentences and the scenes they occur in. Restate, as precisely as you can, the claim that there's no fact of the matter about what that line refers to — the whole animal, an undetached rabbit-part, a momentary rabbit-stage, the rabbit-ish look of the field — using only craft vocabulary: showing versus telling, subtext, what's on the page versus what's in the author's head, a stage direction, an actor's choice about a line, an adaptation decision, the reader building a character out of scraps, free indirect style.

  Then give me the residue report. What translates cleanly? What only survives if you fudge it? What has no counterpart at all in how novelists talk about meaning? Specifically, I suspect the whole argument secretly turns on there being no author available — that Quine's translator is a reader with no access to intention, and that my being able to say "no, I meant the rabbit" is exactly the move his setup has to rule out. Am I just helping myself to something the argument already handled, or is that actually the crux? Second thing: does handing the translator more channels — the film adaptation, my notebooks, a sequel set in the same world — collapse the indeterminacy the way extra evidence normally does, or does it just reproduce it one level up?

  Under 450 words, please, in prose, no bullet points — I want to read it like an essay, not a handout.
