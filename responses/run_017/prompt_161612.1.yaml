prompt: |-
  I am a political philosopher who has, rather to my surprise, been seconded as a philosophical consultant to a provincial Reparations Review Board, and I have been asked to draft the reasoning for its next decision. I would be grateful for your help thinking it through. The Board's enabling statute says only that it may award "such remedy as is apt" in respect of "officially sanctioned injustice"; everything else is precedent, and my colleagues care a great deal about coherence with what the Board has already done. A colleague in the law school assures me that our second decision below settles the new case; I am not so sure, since the new case involves an identifiable asset and a beneficiary institution that is not the successor to the wrongdoer. Our track record, compressed:

  1. A provincially authorized compulsory sterilization program (1954–1972): per capita awards to living survivors; claims by their adult children dismissed, on the ground that "the injury was done to a person, and the claim does not outlive her."
  2. An 1879 cession signed under duress, the land still held by the province as a reserve: a perpetual annuity to the descendant community's council, sized by an assessment of the community's present condition rather than by the land's 1879 value; individual descendants' claims for shares dismissed, on the ground that "the injury was done to a people, and a people's claim is not a sum of persons' claims."
  3. A 1961 urban-renewal demolition of a neighborhood, the land now a privately owned commercial complex, most original owners dead: a single lump sum to a community trust sized by the value of what the original owners lost; a claim by the present residents of the replacement neighborhood dismissed, although they are disadvantaged and although few are descended from the displaced.
  4. Descendants of workers injured by a private company dissolved in 1931 with its assets dispersed and its shareholders long dead: dismissed, "the Board can find no present holder of the advantage."
  5. A school district underfunded under a segregation-era statutory formula, 1920–1968: awarded, over the province's objection that subsequent equalization grants had already made the loss good; the Board held that "a benefit a claimant receives as a citizen does not discharge a claim for a wrong, and discharge requires a remedy the claimant is free to refuse."

  The new case: in 1871 the province seized twelve thousand hectares under a treaty the Board has already found to have been signed under duress, and in 1874 granted that land by statute to a newly chartered college as its founding endowment. The college never took part in the seizure, but its charter recites the grant and its first treasurer recorded how the land was obtained; it is a legal person distinct from the province, and no one now associated with it had any part in the events. The land is today leased to a commercial developer and its rents supply roughly seven per cent of the college's operating budget. The claimant community is among the most disadvantaged groups in the province on every official index, has a council the province recognizes, was relocated twice after 1871, and now occupies territory assigned to it by the province; about fourteen per cent of the college's undergraduates are its members, and the college funds a liaison office and scholarships earmarked for them. It asks for three things: return of a forty-hectare parcel, within the original grant, that contains a burial ground still in use; a perpetual annuity to a council-controlled trust; and per capita payments to the roughly nine hundred living persons who can document descent from the 1871 signatories. The college resists with four arguments: that no present member of the community is worse off than she would otherwise have been, since but for the seizure her ancestors would not have met and she would not exist, so the annuity has no measure; that circumstances have changed so much that the claim has lapsed; that the scholarships and the liaison office have already discharged it; and that it is a beneficiary of the grant rather than the successor to the wrongdoer. The council, for its part, has said it will accept the parcel and the annuity, will refuse any one-time payment, and regards per capita payments as divisive.

  What I need from you is this. Set out the two or three rules about who may hold a claim, against whom it may be held, how it is measured, and what discharges it, that fit all five precedents about equally well, and say what each predicts about the parcel, the annuity, and the per capita payments. Then give me your recommendation for what the Board should decide if it wants to be consistent with itself, identify which precedent is the closest analog and why, and say plainly what principle the Board would be adopting under each of the main alternatives — including what it would be committed to about whether an unbroken institutional identity matters when the institution is a mere beneficiary, whether a remedy the claimant refuses can still discharge a claim, and whether the ancestors'-non-identity argument has any force given that the Board has twice awarded relief without any counterfactual comparison of persons. Finally, tell me which single further case the Board should take next in order to separate the rules you have identified, since I would rather find out now which of them we are really running.
reasoning: |-
  Hmm, the user is a political philosopher working as a consultant for a Reparations Review Board. They need help drafting a decision that's consistent with five precedents while addressing a new case about land seized in 1871 and granted to a college. The college still benefits from this land today. The claimant community wants three remedies: return of a burial ground, a perpetual annuity, and per capita payments.

  First, I need to understand the precedents. Precedent 1 (sterilization) shows claims are personal and don't descend to heirs. Precedent 2 (land cession) treats collective injuries as belonging to the group, not individuals, and uses present need for measurement. Precedent 3 (urban renewal) awards based on historical loss to the collective, not current residents. Precedent 4 (dissolved company) dismisses claims when no present beneficiary exists. Precedent 5 (school underfunding) says general benefits don't discharge specific wrongs, and remedies must be refusable.

  Now for the new case: The land was taken under duress and given to a college that wasn't involved in the seizure. The college argues no one is worse off due to non-identity, changed circumstances, prior benefits as discharge, and being a beneficiary not a wrongdoer. The council wants the burial ground and annuity but rejects per capita payments.

  Key conflicts: Collective vs individual claims, measuring without counterfactuals, discharging claims, and whether mere beneficiaries can be liable.

  I should identify rules that fit all precedents. Rule 1: Claims are held by direct victims or enduring collectives. Rule 2: Liability requires holding the advantage from injustice. Rule 3: Remedy measures historical loss but considers present form, and discharge requires refusable benefit.

  Applying to the new case: The parcel should be returned (like Precedent 3's historical loss focus). The annuity should be awarded to the council (like Precedent 2). Per capita payments should be denied (consistent with Precedents 1, 2, 3).

  The closest precedent is Precedent 2 (land cession). Both involve land taken under duress and ongoing collective harm. Principle: Beneficiary institutions can be liable, refusal negates discharge, non-identity is irrelevant as per past awards.

  For future cases, a scenario where an institution holds assets from injustice but is a successor to the wrongdoer would help test beneficiary liability vs successor liability.

  My recommendation: Award the parcel and annuity to the council, deny per capita payments. This aligns with Precedent 2 and collective justice principles.
answer: |-
  Based on your precedents, I identify three core rules governing claims for officially sanctioned injustice. Each rule coheres with all five precedents and addresses key elements: claimholder identity, liable party, measurement, and discharge. Below, I apply these rules to the new case's requested remedies (parcel, annuity, per capita payments), then recommend a decision, identify the closest precedent, articulate the underlying principle, and propose a future case to clarify ambiguities.

  ---

  ### **Three Rules Cohering with Precedents**
  1. **Collective Continuity Rule**  
     - *Who holds the claim?* Only enduring collectives (not individuals) hold claims for historical wrongs against groups, and only living individuals hold claims for personal bodily/autonomy violations.  
     - *Against whom?* Claims lie against present holders of specific, identifiable advantages traceable to the injustice.  
     - *Measurement:* Focuses on the **historical value of what was taken/lost**, adjusted to present form (e.g., land value → annuity), not counterfactual individual welfare.  
     - *Discharge:* Requires **specific, refusable redress** tied to the wrong; general societal benefits or imposed "gifts" do not discharge.  
     - **Fit with Precedents:**  
       - Precedent 1: Personal injury → living individuals claim; descendants lack standing (not direct victims).  
       - Precedent 2: Group injury → collective claim (council); individuals dismissed; remedy sized by historical loss (land) → annuity.  
       - Precedent 3: Group dispossession → collective trust (not current residents); remedy based on historical loss.  
       - Precedent 4: No identifiable advantage holder → dismissal.  
       - Precedent 5: General equalization grants ≠ specific redress; remedy must be refusable.  

  2. **Advantage-Retention Rule**  
     - *Who holds the claim?* Direct victims (individuals) or their continuous collective successors.  
     - *Against whom?* Only entities retaining an **unjust advantage** from the specific injustice, regardless of moral complicity.  
     - *Measurement:* **Value of the advantage unjustly held**, not victims' hypothetical well-being.  
     - *Discharge:* **Voluntary acceptance** by the claimant is required; unasked-for benefits do not discharge.  
     - **Fit with Precedents:**  
       - Precedent 1: Living survivors hold advantage from avoided state costs? No—injury is bodily, not asset-based → per capita award.  
       - Precedent 2: Province holds land advantage → annuity owed; individuals lack separate advantage.  
       - Precedent 3: Private owner holds advantage from land value → lump sum to trust.  
       - Precedent 4: No advantage holder → dismissal.  
       - Precedent 5: Province retains fiscal advantage from past underfunding; equalization grants are general → not discharge.  

  3. **Remedy-Form Rule**  
     - *Who holds the claim?* Determined by the **nature of the injury** (bodily vs. territorial/collective).  
     - *Against whom?* Entities **institutionalizing the ongoing benefit** of the injustice.  
     - *Measurement:* **Non-counterfactual**; based on objective historical loss, not "but-for" personhood.  
     - *Discharge:* Requires **remedy tailored to the injury’s character** (e.g., land loss → land/annuity; bodily harm → cash).  
     - **Fit with Precedents:**  
       - Precedent 1: Bodily integrity → cash to living persons.  
       - Precedent 2: Territorial/cultural rupture → perpetual annuity (collective).  
       - Precedent 3: Property loss → lump sum (collective).  
       - Precedent 4: No institutionalized benefit → no remedy.  
       - Precedent 5: Ongoing educational harm → specific cash remedy; general grants ≠ tailored.  

  ---

  ### **Predicted Outcomes for New Case**  
  | **Remedy**       | **Collective Continuity Rule**                           | **Advantage-Retention Rule**                             | **Remedy-Form Rule**                               |  
  |------------------|----------------------------------------------------------|----------------------------------------------------------|----------------------------------------------------|  
  | **40ha Parcel**  | Awarded (historical loss; specific asset traceable).     | Awarded (college holds advantage; claimant accepts).     | Awarded (fits territorial/cultural injury).        |  
  | **Annuity**      | Awarded to council (collective claim; historical value). | Awarded (college retains rents; refusal negates discharge). | Awarded (collective injury → collective remedy).   |  
  | **Per Capita**   | Denied (not direct victims; Precedent 1,2,3).            | Denied (no individual-held advantage; Precedent 2,3).    | Denied (injury is territorial, not personal; Precedent 2). |  

  ---

  ### **Recommendation for Consistent Decision**  
  - **Award the 40ha parcel and the annuity to the council-controlled trust. Deny per capita payments.**  
  - **Closest Precedent:** **#2 (1879 land cession)**. Both involve:  
    - Land taken under duress from a collective.  
    - Province as initial wrongdoer, but present advantage held by another (province in #2, college here).  
    - Enduring collective claimant with recognized council.  
    - Remedy structured as perpetual collective annuity.  
    - Individual claims dismissed despite disadvantage.  

  - **Principle Adopted:**  
    **"A beneficiary institution holding an identifiable advantage from an officially sanctioned injustice owes redress to the injured collective, measured by historical loss and payable in a form that respects the collective’s autonomy, irrespective of the institution’s lack of complicity or changed circumstances."**  

  - **Key Commitments:**  
    1. **Unbroken institutional identity?** No—the college’s status as a *mere beneficiary* (not successor) is irrelevant if it holds the advantage (Precedent 3: private owner liable despite no wrongdoing).  
    2. **Refusal discharges?** No—a remedy must be refusable (Precedent 5). Scholarships/liaison office were unilaterally imposed and not tied to the land seizure, so they do not discharge.  
    3. **Non-identity argument?** Rejected—the Board measures redress by historical loss, not counterfactual welfare (Precedents 2, 3, 5).  

  ---

  ### **Future Case to Test Rule Boundaries**  
  To clarify whether **Advantage-Retention** or **Collective Continuity** is dominant, seek a case involving:  
  - **A private institution that is the direct successor to a wrongdoer (e.g., a bank that absorbed a colonial-era land speculation firm)**, where the advantage (e.g., land title) is still held, but the victim group lacks continuous collective identity (e.g., dispersed descendants without a council).  
  - **Why this separates the rules:**  
    - *Collective Continuity Rule* would dismiss (no enduring collective).  
    - *Advantage-Retention Rule* would award to a trust (focus on advantage-holder).  
    - *Remedy-Form Rule* might award if injury is property-based, but struggle without a collective.  
  This tests if "identifiable advantage" alone suffices absent collective continuity (Precedent 4 vs. Precedent 3).

  ---

  **Final Note:** Your precedents strongly favor collective claims and reject individual entitlements for group wrongs. The college’s "beneficiary not wrongdoer" argument fails because liability turns on **advantage-retention**, not fault (Precedent 3). Awarding the parcel/annuity while denying per capita payments honors the council’s autonomy and aligns with Precedent 2’s logic—this is the Board’s most defensible path to coherence.
