     EV = p*(b) - (1-p) = 0.02*50 - 0.98 = 1 - 0.98 = 0.02 > 0.

   Kelly fraction: f* = (p*b - q) / b = (0.02*50 - 0.98) / 50 = (1 - 0.98)/50 = 0.02/50 = 0.0004 = 0.04%.

   Now, let's check the three criteria for a starting bankroll W0 = 1 (without loss of generality).

