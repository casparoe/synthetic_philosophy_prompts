     However, the Kelly strategy has a chance of having wins. The median strategy has no chance of growth. The Kelly advocate would argue that the long-run growth is what matters and that even over 10 rounds, the Kelly strategy is better in terms of expected log. The median advocate would say that the typical investor does not want to risk even a 2.5% loss with 60% probability for the chance of a huge gain.

     This illustrates the tension.

   Therefore, the example meets the constraints and shows the required ordering.

   Final scenario paragraph:

     Over the next month, you have 10 opportunities to bet on independent events, each paying 20 to 1. Your research indicates a 5% true chance of winning each bet. You start with £10,000 and can wager any fraction of your current bankroll each time, with winnings reinvested. 

   The three prescriptions:

     (i) Maximise expected terminal wealth: wager 100% of your bankroll each time. 
          Expected terminal wealth = £10,000 * (1.05)^10 ≈ £16,289.
          But note: there's a 59.87% chance of losing all your money, and a 40.13% chance of having at least one win (which could lead to a huge return: one win would turn £10,000 into £210,000, but then you have 9 more bets).

     (ii) Kelly: wager 0.25% of your bankroll each time. 
          Expected log wealth per bet is maximised. Terminal wealth after 10 bets is random. The median outcome (0 wins) yields £10,000*(1-0.0025)^10≈£9,753. The expected terminal wealth is £10,000*(1+0.05*0.0025*10)? Actually, we compute the expectation by the binomial distribution. But note: the growth factor per bet is 1 + f*(edge) = 1+0.0025*0.05=1.000125? That's not right. The expected wealth after one bet is: 0.05*(1+20*0.0025) + 0.95*(1-0.0025) = 0.05*1.05 + 0.95*0.9975 = 0.0525 + 0.947625 = 1.000125. So after 10 bets: (1.000125)^10 * £10,000 ≈ £10,012.50. But that's the expectation. The log expectation is different.

          Alternatively, we can compute the expected log wealth: 
            E[log(W10)] = 10 * [0.05*log(1+20*0.0025) + 0.95*log(1-0.0025)]
            =10*[0.05*log(1.05)+0.95*log(0.9975)]
            log(1.05)≈0.04879, log(0.9975)≈-0.002501
            =10*[0.05*0.04879 + 0.95*(-0.002501)] =10*[0.0024395 - 0.0023758] =10*0.0000637≈0.000637.

          So the expected log wealth is increased by about 0.000637 per bet (very small).

     (iii) Maximise median terminal wealth: wager 0%. Then your median terminal wealth is £10,000.

     The diagnostics and the discussion above follow.

   In one sentence at the end:

     I would hand the Kelly criterion to the person because it provides a consistent, horizon-independent strategy that balances growth and risk, avoiding ruin while capturing upside, and because the median criterion's horizon sensitivity and failure to consider the full distribution make it unsuitable.
answer: |-
  ### Scenario  
  A bettor has £10,000 and 10 opportunities to bet on independent events, each paying 33-to-1 (net odds: +3300%, so a winning £1 bet returns £34 total, including the stake). The true win probability is 3% per bet. The bettor may stake any fraction of their current bankroll each round, with winnings reinvested. This setup mimics a realistic long-shot opportunity, such as backing undervalued outsiders on a betting exchange.

  ---

  ### Arithmetic for Three Criteria  
  *Initial wealth \( W_0 = £10,000 \), rounds \( n = 10 \), win probability \( p = 0.03 \), net fractional profit on win \( b = 33 \).*

  1. **Maximise expected terminal wealth (EV)**:  
     - Expected growth factor per bet: \( 1 + f \cdot (p \cdot b - (1 - p)) = 1 + f \cdot (0.03 \cdot 33 - 0.97) = 1 + f \cdot (0.99 - 0.97) = 1 + 0.02f \).  
     - Terminal wealth: \( W_{10} = W_0 \cdot (1 + 0.02f)^{10} \).  
     - Maximised when \( f = 1 \) (stake everything):  
       \( \mathbb{E}[W_{10}] = 10,\!000 \cdot (1.02)^{10} \approx £12,\!190 \).  

  2. **Kelly criterion (maximise expected log wealth per round)**:  
     - Kelly fraction: \( f^* = \frac{p(b + 1) - 1}{b} = \frac{0.03 \cdot 34 - 1}{33} = \frac{1.02 - 1}{33} = \frac{0.02}{33} \approx 0.000606 \) (0.0606%).  
     - Optimal stake: \( f^* \approx 0.000606 \) (£6.06 from £10,000 initially).  

  3. **Maximise median terminal wealth**:  
     - Probability of zero wins: \( (1 - p)^{10} = (0.97)^{10} \approx 0.737 \).  
     - Cumulative probabilities:  
       - \( P(\text{0 wins}) \approx 0.737 \)  
       - \( P(\text{≤1 win}) = P(0) + P(1) = 0.737 + \binom{10}{1} \cdot 0.03 \cdot (0.97)^9 \approx 0.737 + 0.228 = 0.965 \).  
     - Median outcome is 0 wins (as \( P(0) > 0.5 \)).  
     - Terminal wealth given 0 wins: \( W_{10} = W_0 \cdot (1 - f)^{10} \).  
     - Median wealth \( = 10,\!000 \cdot (1 - f)^{10} \). This is maximised at \( f = 0 \) (stake nothing), yielding median \( = £10,\!000 \).  
     - For any \( f > 0 \), median wealth < \(£10,\!000\) (e.g., \( f = 0.000606 \) gives \(£10,\!000 \cdot (0.999394)^{10} \approx £9,\!939 \)).  

  ---

  ### Diagnostics  
  - **Feature forcing the result**: The low win probability (\( p = 0.03 \)) combined with a finite horizon (\( n = 10 \)) ensures \( P(\text{0 wins}) > 0.5 \). Thus, the median outcome is total loss of the staked amount, making \( f = 0 \) optimal for median maximisation.  
  - **Effect of horizon**:  
    - At \( n = 14 \), \( (0.97)^{14} \approx 0.653 > 0.5 \), median still 0 wins → \( f_{\text{median}} = 0 \).  
    - At \( n = 15 \), \( (0.97)^{15} \approx 0.633 < 0.5 \) (median becomes 1 win) → \( f_{\text{median}} \) jumps to ≈2% (calculated by maximising \( (1 + 33f)^1 (1 - f)^{14} \)).  
    - Convergence to Kelly is *lumpy*: abrupt jumps (e.g., 0% → 2%) at critical horizons, then gradual approach to Kelly.  
  - **Effect of symmetric payoff**: If the bet were symmetric (e.g., 50% win chance, double-or-nothing), \( P(\text{0 wins}) < 0.5 \) even for small \( n \). Median and Kelly stakes align early (no zero-median region).  
  - **Attacks on the criteria**:  
    - **Kelly advocate**: "Median maximisation ignores tail gains and overweights the most frequent loss path. Growth-rate optimisation is asymptotically sound; median is myopic."  
    - **Median advocate**: "A single finitely lived bettor experiences one realisation. Protecting against the typical outcome (0 wins here) is pragmatic; asymptotic growth is irrelevant."  

  ---

  ### Verdict  
  I would hand the Kelly criterion to the bettor because it balances growth and risk systematically across horizons, avoids ruin, and captures upside, whereas median maximisation is fragile to horizon changes and rejects positive-expectation bets unnecessarily.
