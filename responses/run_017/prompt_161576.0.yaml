   (ii) The Kelly criterion (maximising expected log wealth) suggests a small positive fraction (f).
   (iii) Maximising the median terminal wealth suggests staking nothing (fraction = 0).

   The key is to have a bet that is very long-shot (high payoff if successful but low probability) so that even though the bet is positive in expectation, the median outcome over a modest number of rounds is likely to be zero wins. Then, staking a positive fraction will lead to a median terminal wealth that is less than the starting bankroll (due to losses in all rounds) unless we stake nothing. 

   We need:
   - The bet must be favourable: p * b > q, where p is the win probability, b is the net odds (so for a bet at odds of k to 1, we win b = k if we win and lose the stake if we lose), and q = 1-p.
   - The Kelly fraction is f* = (p*(b+1) - 1) / b = (p*b - q) / b. This must be positive and small.

   For the median outcome: in a binomial setting with n rounds, the median number of wins is typically floor(n*p) or around n*p. We want that for the median outcome (which we can take as the outcome with at least 50% probability of having at least that many wins) to be zero wins when n is modest. Then, if we stake any positive fraction, we lose in every round and the terminal wealth is (1-f)^n * W0. This is less than W0 (if f>0) and is the median outcome. Therefore, to maximize the median, we should not bet at all (f=0) so that the median terminal wealth is W0.

   How to achieve zero wins as the median? We require that the probability of zero wins is at least 50%. That is, (1-p)^n >= 0.5.

   However, note that the median of a binomial distribution is the smallest integer m such that the cumulative probability of having m wins or less is at least 0.5. We want m=0 to be the median, meaning that the cumulative probability of 0 wins is at least 0.5.

   So condition: (1-p)^n >= 0.5.

   We also want the bet to be favourable: p * b > 1 (since if we stake 1 unit, we get b in net winnings if we win, so the expected net win is p*b - (1-p)*1 = p*b - q, and we require this >0).

   We choose n modest (say 20) and p small so that (1-p)^n is large.

   Example: let p = 0.02 (2% chance of winning) and n=20.
   Then (1-p)^n = (0.98)^20 ≈ 0.667 > 0.5. So the median number of wins is 0.

   Now, we need the bet to be favourable. Let the net odds be b. We require p*b - (1-p) > 0 => 0.02*b - 0.98 > 0 => b > 49.

