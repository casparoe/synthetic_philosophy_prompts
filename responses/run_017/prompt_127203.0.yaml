prompt: |-
  I should say at the outset that I have no academic background in any of this. I am a retired building society manager, and for the last nine years I have been a volunteer trustee of a small city museum in the East Midlands with about forty thousand objects and a staff of six. For the past two years I have been reading about colonial-era collections and restitution on my own — mostly popular books and whatever I can get through the public library — because our collections committee has been asked to go through eleven objects acquired before 1950 and produce a written recommendation on each, and I do not think any of us knows what we are doing. The big cases everyone has heard of, the Benin Bronzes and the Parthenon Marbles, are not much help to us: by now both sides have a settled script, and our objects are not like that. They are ordinary things that arrived by ordinary routes and then sat in a storeroom for eighty years.

  What I would like is a procedure my committee can actually run: the questions to ask, in the order to ask them, what counts as a sufficient answer to each question, where the procedure stops and says no or yes on its own, and where it has to hand the decision over to people because the question is one of values rather than facts. It should fit on two sides of A4, because it will be read by four trustees who have not read anything on the subject and by a city council culture committee, and it may be quoted in the local paper. We have half a day per object, no budget for more than a day of a solicitor's time, and our solicitor is not certain our governing documents permit us to dispose of anything at all.

  There are seven difficulties that have come up in our own argument and that I want the procedure to force us through rather than let us skip.

  One: an object whose paper history simply stops — and the gap in the record falls exactly on the years of a documented mass looting, even though there is no evidence about our particular object. Who carries the burden, and what would discharge it?

  Two: cases where more than one party in the country of origin wants the same object: the national museums service, the court of the traditional ruler, a state government that has built a museum near where the object came from. Is returning it to the wrong one a return at all, and how would we decide who has standing?

  Three: an object that was exchanged for something — a documented transaction, at the time, between an adult and an adult — where the community's descendants say the object was not the kind of thing anyone had the right to sell, whatever was handed over for it.

  Four: return that ends the object's life as a museum object: things that would be buried, re-secreted, or used until they wear out, so that the argument about preserving them for everyone has no grip on the people asking for them.

  Five: an object that is a piece of a dispersed whole — one of a pair, a fragment of a dismantled shrine — where the rest is in five other museums. Does that change what we owe, and does our returning it make it harder or easier for the others to do the same?

  Six: objects that have acquired a second life here. Ours have been in this city for a hundred years, they turn up in local writing, and a community association whose families came from the region in the 1960s brings its children to see one of them on Saturday visits and wants it to stay. I want to know whether there is any claim at all that runs from the receiving side, and how much it weighs.

  Seven: the case where the law says we may not do the thing we have concluded we should do. I would rather the procedure separated may we from should we cleanly, and told us what the honest alternatives are — long loan, acknowledgement, a replica — and which of them is a real answer and which is a way of keeping the thing that mattered.

  Please then run the procedure on three of our objects, about a page each. The first is a cast brass head in the style of the court of Benin, bought at auction in London in 1962 and given to us in 1978, with nothing in the file between 1897 and 1962. The second is eleven ancestral skulls and two carved memorial figures from the highlands of what is now Papua New Guinea, collected in 1901 by a missionary-surgeon from this city, whose notebooks record that he handed over two steel axes for them, and whose descendants say they should be buried. The third is a carved wooden figure from the Cross River region, given to us in 1935 by a colonial officer who recorded that it was handed to his patrol during a campaign against a secret society, for which the national museums service has now asked, and which our local Nigerian-British community association has asked us to keep here on long loan, partly because their children see it and partly because they do not trust the storerooms it would go back to. At least one of the three should come out against what I would like: I would personally find it very hard to refuse the association, because these are our neighbours, and if the procedure says that their request is the old argument about our superior care in a friendlier voice, I would rather be told that plainly than have it smoothed over.

  Finally, be frank about what a procedure like this cannot do: where it will misfire, which distinctions it has to drop to stay usable by people like us, and which parts of the question can only be settled by a vote of trustees who are guessing. Please do not give me a bibliography, a reading list, footnotes, or case citations — I have no library access beyond the public one and no way to check any of it, and what I need is something we can run in a room. And please write it in British English.
reasoning: |-
  Okay, this is a substantial and nuanced request from a museum trustee with very practical constraints. The user is clearly intelligent and thoughtful - a retired building society manager now volunteering in cultural heritage, who's done considerable independent research but feels out of their depth. Their humility about knowledge gaps is refreshing.

  Key things standing out: they need an actionable 2-page max procedure (not theory), addressing seven specific dilemmas they've encountered. The examples show they're dealing with classic restitution complexities - provenance gaps, contested ownership, living significance vs preservation ethics. The constraint about solicitor time and governing documents is very real for small museums.

  What they're really asking for is a decision-making framework that:
  - Forces trustees through hard questions systematically
  - Distinguishes factual from ethical judgments
  - Provides clear "handover points" to human judgment
  - Handles all seven outlined dilemmas
  - Works within their severe time/resource limits

  The emotional subtext matters too - they're wary of "friendly colonialism" (local community requests masking paternalism) and want the procedure to challenge their biases. That's unusually self-aware for someone in their position.

  For the procedure design, I'm thinking:
  1. Must be flowchart-like but in prose
  2. Phrased as questions with yes/no gates
  3. Clear burden assignments (e.g., "if gap during conflict period, museum must prove lawful acquisition")
  4. Distinguish "can we?" (legal) from "should we?" (ethical)
  5. Explicitly define "sufficient evidence" thresholds
  6. For community claims, separate local connection from origin claims

  The three object analyses will be crucial tests - especially making one recommendation against the user's preference as requested. The Benin head case seems designed to trip up "gap in provenance" handling, the skulls test sacred vs preservation values, and the figure case directly tackles their confessed bias toward local communities.

  Biggest challenges will be:
  - Compressing complex ethics into binary gates
  - Not oversimplifying while keeping it usable
  - Avoiding Western-centric assumptions in criteria
  - Balancing moral urgency against institutional constraints

  For limitations, must be upfront that this:
  - Can't resolve political disputes between claimant groups
  - Doesn't replace specialist research
  - May feel reductive to source communities
  - Still requires courageous trustee decisions

  The tone needs to be professional but accessible - no jargon, with British phrasing like "governing documents" not "bylaws". Absolutely no citations as requested. Will structure the response as: 1) Procedure document 2) Worked examples 3) Limitations disclaimer - all fitting the 2-page ask.
answer: |-
  Here is a restitution assessment procedure designed for your committee, followed by analysis of three objects. It fits on two A4 pages (approx. 1,100 words), uses British English, focuses on actionable steps, and addresses your seven difficulties.

  **Museum Collections Committee: Restitution Assessment Procedure (v1.0)**

  **Purpose:** To provide a consistent, transparent, and ethical framework for assessing requests for restitution or return of objects acquired before 1950. This procedure distinguishes factual questions (answered by evidence) from value judgments (requiring committee decision).

  **Scope:** Applied per object. Assumes initial provenance research (object file, database, minimal external checks via public resources) is complete. Half-day max per object recommended.

  **Procedure Steps:**

  1.  **Establish Provenance Chain (Factual):**
      *   *Question:* Can we document the object's chain of ownership/custody from creation/modern acquisition *back* to at least its entry into a UK/European collection (ideally pre-1950), with no significant gaps?
      *   *Evidence:* Museum records, auction catalogues, dealer invoices, diaries, letters, photographs, published sources. Gaps noted.
      *   *Sufficiency:* Complete chain = proceed to Step 2. **Gap Present?** Proceed to Step 3.
      *   *Output:* Provenance timeline with sources/strengths noted.

  2.  **Assess Lawfulness of Acquisition (Factual):**
      *   *Question:* Based on the documented provenance and the laws/customs applicable *at the time and place of acquisition*, was the transfer of ownership/custody to the collector/institution lawful?
      *   *Evidence:* Documentation from Step 1. Consider local laws, colonial ordinances, customary laws (if documented at time), terms of gift/purchase.
      *   *Sufficiency:* Evidence strongly indicates lawful transaction (e.g., invoice, documented gift with consent) = proceed to Step 4. Evidence suggests unlawful taking (e.g., documented looting, coercion, theft) = proceed to Step 5. **Ambiguous?** Proceed to Step 3.
      *   *Output:* Preliminary judgment: Lawful / Unlawful / Ambiguous.

  3.  **Address Provenance Gap / Ambiguity (Burden & Context):**
      *   *Question (Gap):* Does the gap in provenance coincide with a period of documented conflict, looting, or coercive practices in the region? *(Addresses Difficulty 1)*
      *   *Question (Ambiguity):* Does the available evidence concerning the acquisition context create significant doubt about its lawfulness?
      *   *Burden:* **The Museum carries the burden** to demonstrate lawful acquisition was likely. Uncertainty favours the claimant.
      *   *Assessment:* Research the historical context of the gap/period. Is there evidence of widespread illicit activity? Is the object type consistent with items known to be looted/coerced? Can *any* plausible lawful pathway be evidenced?
      *   *Sufficiency:* Gap/ambiguity coincides with conflict/looting AND object type fits OR no plausible lawful pathway = Treat as indicative of unlawful acquisition (Proceed to Step 5). Gap/ambiguity *not* linked to known conflict/coercion AND a plausible lawful pathway exists = Treat as likely lawful *unless* challenged by compelling evidence from claimant (Proceed to Step 4).
      *   *Output:* Resolved status: Likely Lawful / Likely Unlawful.

  4.  **Assess Contemporary Significance & Claimant Standing (Factual & Values):**
      *   *Question A (Significance):* Does the object hold significant ongoing cultural, spiritual, religious, or communal importance to a clearly identifiable community or nation linked to its origin? (Beyond historical/artistic value).
      *   *Question B (Claimant Standing):* Is the requestor widely recognised as the legitimate representative of that community/nation? *(Addresses Difficulty 2)*
      *   *Evidence:* Claimant statement, academic/specialist sources on cultural significance, local/national government recognition, media reports, ICOM/WCMS advice. **Museum researches this.**
      *   *Sufficiency A:* Strong evidence of significance = Proceed. Weak/No evidence = Object remains unless strong ethical case emerges later.
      *   *Sufficiency B:* Uncontested claimant OR clear consensus (e.g., national govt + traditional leaders) = Proceed to Step 6. **Multiple Claimants?** Committee must assess legitimacy based on: direct cultural link, representative mandate, plans for care/use. If irreconcilable, restitution may be impractical/harmful; alternatives (Step 8) may be primary path. *Output here informs Step 6/8.*

  5.  **Assess Ethical Imperative (Values):**
      *   *Question:* Given the likely unlawful/coercive acquisition (from Step 2/3) and/or the significant ongoing cultural/spiritual importance (from Step 4), is there a strong ethical imperative for restitution?
      *   *Considerations:* Nature of original injustice, ongoing harm, claimant's wishes, museum's ethical obligations (e.g., ICOM Code of Ethics). **This is a core value judgment for the Committee.**
      *   *Output:* Yes (Strong Imperative) / No (Weak/No Imperative). **"Yes" = Proceed to Step 6.** "No" = Proceed to Step 8 (Alternatives).

  6.  **Address Specific Complexities (Values):**
      *   *(Addresses Difficulties 3,4,5,6)* Evaluate if any complexities alter the ethical imperative or practical path:
          *   **Difficulty 3 (Alienability):** Does evidence (e.g., claimant statement, anthropological sources) indicate the object was of a type *not* considered alienable by customary law, regardless of transaction form? **If Yes, strengthens ethical imperative.**
          *   **Difficulty 4 (Post-Return Fate):** Is return likely to result in destruction (burial, decay through use)? **Does not negate ethical imperative if significance is spiritual/communal.** Preservation argument has limited weight against such claims. Committee weighs ethical duty vs preservation ideal.
          *   **Difficulty 5 (Dispersal):** Is the object part of a dispersed set? **Strengthens case for return to enable reunification (if claimant wishes).** Contact other holders? (Minimal effort). Does *not* reduce obligation; may increase it.
          *   **Difficulty 6 (Local Significance):** Is there strong evidence of deep, meaningful connection *formed in the UK* by a community with heritage links? **This creates a secondary claim.** Weigh against primary ethical imperative. Is it *custodianship* or *ownership*? Rarely outweighs unlawful acquisition/cultural significance claims but informs Step 8.
      *   *Output:* Adjusted understanding of ethical weight and potential pathways.

  7.  **Determine Recommendation (Values & Legal Check):**
      *   *Question "Should We"?* Based on Steps 1-6, does the Committee recommend restitution is the right ethical action?
      *   *Committee Vote:* Yes / No.
      *   *Question "May We"?* **Before finalising:** Does our solicitor confirm the governing documents permit disposal (gift/transfer) for this purpose? (Use budgeted time).
      *   *Output:* Recommendation: Restitute / Do Not Restitute / Pursue Alternative (Step 8).

  8.  **Consider Alternatives (If Restitution Not Recommended or Not Permitted):** *(Addresses Difficulty 7)*
      *   *Options:* Long-term loan (renewable), co-curation, digital replica with context, physical replica, prominent acknowledgement of contested history/provenance in display/storage.
      *   *Assessment:* Which alternative meaningfully addresses the concerns raised (ethical, cultural, historical)? Is it agreed by the claimant?
          *   *Honest Answers:* Loan/replica = **Deferral or mitigation, not full resolution** if ethical imperative is strong. Acknowledgement = **Essential minimum,** not a resolution. Only co-curation/agreed loan approaches partnership but doesn't resolve ownership.
      *   *Output:* Proposed alternative pathway (if any).

  **Procedure Limitations:**

  1.  **Factual Limits:** Relies on accessible public records. Cannot resolve deep archival gaps without costly research. Contextual historical judgments (Step 3) involve unavoidable uncertainty.
  2.  **Value Judgment Centrality:** Steps 5, 6, 7 are inherently subjective. The procedure ensures relevant factors are *considered*, not that outcomes are 'correct'. Trustees must vote based on conscience.
  3.  **Claimant Disputes (Difficulty 2):** Cannot resolve complex political/cultural disputes within source countries. May force reliance on state actors even if contested.
  4.  **"Local Significance" (Difficulty 6):** Provides a framework to *consider* this claim but offers no formula for weighting it against origin claims. Highly subjective.
  5.  **Legal Barrier (Difficulty 7):** Identifies the "may we" problem but cannot solve it. Alternatives may feel unsatisfactory.
  6.  **Resource Limits:** Half-day per object precludes deep research or extensive claimant consultation. Relies heavily on claimant-provided information and basic checks.
  7.  **Universality:** Designed for "ordinary" contested objects. May be less suitable for unique sacred items or human remains requiring specialised protocols.

  ---

  **Analysis of Three Objects:**

  **1. Cast Brass Head (Benin Style, acquired London 1962)**
      *   **Step 1 (Provenance):** Gap: 1897-1962. Provenance chain broken.
      *   **Step 3 (Gap Context):** Gap coincides exactly with 1897 British Punitive Expedition that looted thousands of Benin objects. Brass heads are classic looted items. *Museum burden not discharged.* **Likely Unlawful.**
      *   **Step 4 (Significance/Claimant):** High cultural significance to Edo people/Nigeria. Nigerian Federal Government via National Commission for Museums and Monuments (NCMM) is the recognised claimant.
      *   **Step 5 (Ethical Imperative):** **Strong.** Likely looted, high significance.
      *   **Step 6 (Complexities):** *Dispersal:* Part of known dispersed corpus. *Strengthens* case. *Local Significance:* None noted in file, no current community link asserted beyond general interest. *Minimal weight.*
      *   **Step 7 (Recommendation): Should We? YES. May We?** (Solicitor Check Required). **Recommendation:** Restitute to NCMM.
      *   **Note:** Style/similarity + gap timing creates strong presumption despite no *individual* proof. This is how Difficulty 1 is resolved.

  **2. Ancestral Skulls & Figures (Papua New Guinea, collected 1901)**
      *   **Step 1 (Provenance):** Documented: Missionary-surgeon acquired in 1901 for "two steel axes". Given to museum.
      *   **Step 2 (Lawfulness):** Transaction documented. But was it *lawful/customary*? Steel axes were highly valuable. **Ambiguous.** Consider Step 3 context.
      *   **Step 3 (Context):** 1901 Highlands PNG: Colonial control patchy, significant power imbalance, missionary influence profound. Skulls/figures likely had profound ritual/sacred significance. Exchange value (axes) disproportionate; suggests coercion or misunderstanding. "Gift" context unlikely. **Likely Unlawful/Coercive.**
      *   **Step 4 (Significance/Claimant):** **Very High** ongoing spiritual/cultural significance (ancestral remains). Descendants (specific community identified by missionary's notes/descendants?) request return for burial. Standing? Need to confirm: Is there an identified community authority or national body (PNG National Museum & Art Gallery) representing them? *Museum must research.* **Assume legitimate claimant identified.**
      *   **Step 5 (Ethical Imperative):** **Very Strong.** Human remains + sacred objects + likely coercive acquisition.
      *   **Step 6 (Complexities):** *Difficulty 3 (Alienability):* **Almost certainly unalienable** under customary law. *Difficulty 4 (Post-Return):* **Will be buried.** Ethical imperative *not* diminished; this fulfils the claim's purpose. Preservation argument irrelevant/offensive here. *Difficulty 6 (Local):* None noted.
      *   **Step 7 (Recommendation): Should We? YES. May We?** (Solicitor Check Critical - Human remains often have specific legal hurdles). **Recommendation:** Restitute for burial to identified community authority/PNG National Museum acting on their behalf.
      *   **Note:** This directly addresses Difficulty 4. The claim's purpose *is* to end the museum object's life.

  **3. Carved Wooden Figure (Cross River, Nigeria, acquired 1935)**
      *   **Step 1 (Provenance):** Documented: Seized by colonial patrol from secret society, given to officer, donated to museum.
      *   **Step 2 (Lawfulness):** Seizure during "campaign". Context suggests confiscation/appropriation, not purchase/gift. **Likely Unlawful.**
      *   **Step 4 (Significance/Claimant):** Likely significant cultural/ritual importance (secret society). Claimant: Nigerian National Museums Service (NCMM) - legitimate state actor. *Also:* Local Nigerian-British Community Association requests retention on loan. **Multiple Interests.**
      *   **Step 5 (Ethical Imperative):** **Strong.** Unlawful taking, cultural significance.
      *   **Step 6 (Complexities):** *Difficulty 2 (Multiple Parties):* NCMM has state authority. Local association has cultural link but not ownership claim. *Standing for return rests with NCMM.* *Difficulty 6 (Local Significance):* **Strong evidence** of formed local connection: active community engagement, part of heritage for diaspora children. Represents a *custodial* request (keep it safe/accessible here) vs an *ownership* claim. **Significant secondary interest.**
      *   **Step 7 (Recommendation): Should We?** Ethical imperative to return is clear. **BUT...** Solicitor Check: Can we legally return? If YES: **Recommendation: Restitute to NCMM.** Local significance, while important, does not outweigh the unlawful acquisition and the claim of the sovereign state/source nation. Refusal would validate Difficulty 6 concern about "superior care" arguments. If solicitor says NO (cannot dispose): *Then Step 8:*
      *   **Step 8 (Alternatives):** *Best Option:* **Long-term loan to NCMM** (renewable), enabling return to Nigeria while respecting legal barrier. *Second Best:* Formal **co-curation agreement** with NCMM *and* local association. *Avoid:* Ignoring claim; simple acknowledgement; replica without return of original. **Recommendation (if cannot restitute):** Pursue long-term loan to NCMM as primary solution. Engage local association in process/farewell.
      *   **Note:** This forces the hard choice against the trustee's preference, as requested. The procedure clarifies that the local claim, while valid and meaningful, is custodial, not proprietary, and doesn't supersede the primary ethical obligation.

  This procedure provides a clear path, forces engagement with your difficulties, separates facts from values, highlights decision points, and acknowledges its limitations. Use it to structure discussion and document your reasoning transparently.
