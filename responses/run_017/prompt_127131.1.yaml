answer: |-
  Here is a scenario designed to split untutored intuitions, followed by framework analysis, ablation tests, and counterarguments. The critical feature is **institutional mediation displacing personal receipt as the locus of uptake**.

  ### Scenario: The On-Call Roster Log
  > In the emergency department of City Hospital, Dr. Aris Thorne tells the charge nurse, "Log me in for Dr. Vega's night shift next Tuesday—I promise I'll cover it while she’s at the conference." The nurse inputs this into the digital on-call roster system, which timestamps the entry, auto-generates a confirmation code (#ED-8873), and updates the department’s shared duty calendar visible to all administrative staff. However, the system glitches and fails to push the standard notification email to Dr. Vega’s inbox. Aris assumes the notice was sent, Vega never checks the roster manually, and Tuesday arrives with Vega absent. Aris is overwhelmed with double duties, while the department head reprimands Vega for an unexcused absence when she returns. Vega protests she never agreed to the swap nor knew Aris had promised coverage.

  **Analysis by Framework:**  
  1. **Austin (Felicity Conditions):**  
     - *Verdict:* **No promise was made.**  
     - *Reasoning:* Austin requires "uptake" (A2: understanding and acceptance by the hearer) for a felicitous illocutionary act (*How to Do Things with Words*, Lecture VIII). This case is a **misfire** (defect in procedure) under the category of **flaws in the conventional procedure** (A.1: "The particular persons and circumstances must be appropriate"). The procedure—making a promise *to Vega*—demands *her* receipt as the named addressee. Institutional logging is a parallel act but doesn’t substitute for the promisee’s uptake. It is *not* an abuse (B: insincerity) since Aris is sincere, but the act remains "void" due to flawed execution.  

  2. **Searle (Constitutive Rules):**  
     - *Verdict:* **A promise was attempted but not successfully performed.**  
     - *Propositional content:* Future act (Aris covering shift) → **Met.**  
     - *Preparatory:* Speaker believes hearer wants act done; act not obviously inevitable → **Met** (Vega needs coverage; shifts aren’t auto-covered).  
     - *Sincerity:* Speaker intends to do the act → **Met.**  
     - *Essential:* Counts as an undertaking of obligation → **Not met.** Searle requires the utterance "to be recognized as binding the speaker" (*Speech Acts*, Ch. 3). Crucially, he treats uptake as necessary for *securing* the obligation but not for *attempting* the act. Here, Vega’s non-receipt means the obligation fails to bind *her* (no "illocutionary effect"), though the act was attempted. *Your reading is correct*: Searle distinguishes act performance from successful communication.  

  3. **Gricean Intention-Recognition:**  
     - *Verdict:* **No promise was made.**  
     - *Reasoning:* A promise requires the speaker to express a reflexive intention (e.g., to produce belief in the promisee via recognition of that intention; Grice, "Utterer’s Meaning and Intention"). Aris *expressed* an intention (via utterance), but it was not *communicated* because Vega never recognized it. The institutional logging is irrelevant—it’s not a participant in the communicative dyad. *Normative residue:* Aris may have a moral duty to cover the shift (due to sincerity) and bears blame for the fallout, but no promissory *obligation* exists absent recognition.  

  4. **Scorekeeping/Practice-Based View (e.g., Brandom):**  
     - *Verdict:* **A promise was made.**  
     - *Reasoning:* Obligations arise from public commitment-*attribution* within a practice, not individual psychology. The roster log is an authoritative institutional record: it timestamps the commitment, makes it visible to administrators, and triggers operational changes (Vega’s schedule cleared). For the verdict to hold, the practice must treat **institutional registration as constitutive of commitment**, irrespective of personal receipt. Here, the department *does* treat the log as binding—hence Vega’s reprimand. The obligation exists because the practice "scores" Aris as committed.  

  ---  
  ### Synthesis  
  1. **Structural Feature:** **Institutional mediation as a third-party commitment-recording mechanism** that bypasses the promisee’s awareness. The critical sentence is:  
     > *"The nurse inputs this into the digital on-call roster system, which timestamps the entry, auto-generates a confirmation code (#ED-8873), and updates the department’s shared duty calendar visible to all administrative staff."*  
     This creates a gap between *personal receipt* (Vega’s awareness) and *public registration* (institutional record).  

  2. **Ablation Tests:**  
     - **No institutional channel (e.g., unread email):**  
       - Austin/Searle/Grice: **No promise** (no uptake).  
       - Scorekeeping: **No promise** (unless email is a sanctioned record—but typically it isn’t).  
       → *Collapses* into the "unheard utterance" problem.  
     - **Addressee reads message next morning:**  
       - All frameworks: **Promise made** (uptake secured).  
       → *Uncontroversial*.  
     *Only the institutional case produces divergence.*  

  3. **Defender Counterattacks:**  
     - **Austinian:** "The institution *is* the relevant ‘hearer’! The nurse logging it secures uptake *for the practice*, satisfying A2. Vega’s role is operational, not constitutive."  
     - **Searlean:** "The *essential condition* is met: Aris’s utterance binds *him* to the institution. Vega’s awareness is preparatory, not essential."  
     - **Gricean:** "The log is a ‘receiver’—it’s designed to recognize intentions on behalf of the practice. Aris intended *it* to recognize his commitment."  
     - **Scorekeeping:** "If Vega isn’t aware, she can’t *hold* Aris accountable, so the obligation is inert. Practices require reciprocal attribution."  

  **Feasibility Note:** All verdicts are jointly satisfiable. The scenario isolates institutional mediation by ensuring:  
  - No ambiguity, authority lapse, or technical failure (message logged correctly).  
  - Practical stakes (staffing gap, reprimand) make obligation non-academic.  
  - The log is *publicly consequential* but *personally uncommunicated*.  

  This forces a choice: Is a promise defined by **interpersonal recognition** (Austin/Grice), **attempted obligation-creation** (Searle), or **social-institutional status** (Scorekeeping)? The institutional gap ensures this isn’t about temperament—it’s a structural fork in the theory of commitment.
