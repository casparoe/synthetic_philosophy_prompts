prompt: |-
  I chair the investment committee of a small regional drainage and flood-risk authority. We rank twenty to thirty capital proposals a year — levee raises, pump replacements, voluntary buyouts, lead service line replacement — under a legal mandate that benefits to residents who have not been born yet must be counted. Our current practice is crude: discount everything at a single 5 per cent "market" rate and ignore whatever falls after year fifty. Three of us, none an economist, have about an hour per proposal, and our recommendations go to an elected board that must defend them in public and could be challenged in court, so I need a written procedure we can rerun, not case-by-case intuition.

  Please give me that procedure in four parts. First, a screening step that separates the four things people conflate inside a discount rate — the productivity of capital (a dollar not spent now could instead earn a return for residents), the expectation that future residents will be richer so an extra dollar matters less to them, genuine risk that the benefit never arrives at all (including the risk that the authority itself will not exist to deliver it), and pure time preference, meaning weighting a benefit less purely because it comes later — and that makes us state, for each proposal, which of those we are actually applying. Second, a consistency check on pure time preference specifically: if we discount a health or safety benefit because it arrives in 2060 rather than 2030, would we equally accept discounting that same benefit if it arrived in 2060 to a child born this year rather than to a sixty-year-old alive today? It seems to me that a positive pure rate commits us to saying yes, and I want the procedure to force us to confront that. Third, rules about what gets discounted at all: whether lives, health and irreplaceable assets should share the money rate or run on a separate schedule, and how to treat a benefit whose recipients' existence depends on our own decision, since if we build the levee people move into the protected area and if we don't they never live here. Fourth, explicit stopping rules: where the procedure returns a hard no, where it returns a number, and where it must stop and hand the choice to the board as a value judgment the board has to own in public — including how to handle truncation at some horizon year and our uncertainty about what the right rate will be in fifty years.

  Then run it on three live proposals and write up what we would put in front of the board. One: replacing the remaining lead service lines in the oldest part of the district, high cost now against health benefits spread over roughly forty years to today's residents and to the families who will occupy those houses later. Two: a voluntary buyout of a flood-prone neighborhood, large cost now against avoided damage and emergency response over eighty years, in a part of the district whose population is projected to shrink. Three: deferring a scheduled spillway upgrade for two budget cycles to hold this year's rate increase down, which shifts a low-probability, high-consequence failure risk forty to sixty years out and which the board is strongly inclined to defer. I expect the procedure to tell us something we would rather not hear in at least one of these; state that plainly, and state plainly what the procedure cannot settle for us.
reasoning: |-
  Okay, the user chairs an investment committee for a drainage authority and needs a structured discounting procedure. Let me unpack this. They handle 20-30 proposals yearly—levees, pumps, buyouts—with legal requirements to consider future residents. Current method: flat 5% discount, ignore beyond 50 years. They want four procedural parts: disentangling discount components, consistency checks on time preference, rules on what to discount, and clear stopping rules. Then apply to three real proposals.

  First, why is the current method problematic? Crude discounting at 5% ignores the nuances of different discount components. They conflate capital productivity, wealth growth, risk, and pure time preference. The user needs transparency to defend decisions publicly and legally. The unspoken need here is legitimacy—avoiding legal challenges by showing rigorous, ethical reasoning.

  Breaking down discount factors is crucial. Each element affects different proposals uniquely. For example, pure time preference might be indefensible for intergenerational projects. The consistency check forces confronting if discounting a future child's safety is ethical. This tackles the moral dilemma head-on, which the user hints at when mentioning future residents.

  Next, what gets discounted? Lives vs. monetary benefits. The user mentioned lead pipes and buyouts—health vs. property. Separating discount rates here is vital. Also, existence dependency: building a levee attracts residents, creating beneficiaries. The procedure must address this causality without double-counting.

  Stopping rules are about managing uncertainty. Beyond 50 years, predictions are unreliable. The procedure should flag when assumptions are too speculative, pushing decisions to the board. This covers the user's need for defensibility in public and court.

  Applying to the three proposals:
  1. **Lead Service Lines**: High upfront cost, health benefits over decades. Pure time preference is ethically shaky here—discounting a child's future health. The procedure should highlight this tension.
  2. **Buyout in a shrinking area**: Avoided damages over 80 years. Wealth growth might justify discounting, but depopulation adds risk. The truncation at 50 years might cut significant benefits, needing board judgment.
  3. **Deferring spillway upgrade**: Shifting low-probability, high-impact risk. Discounting might make deferral seem attractive, but the risk profile changes. The procedure should stress that discounting doesn't reduce actual risk, just its present value, possibly leading to underinvestment.

  The user expects uncomfortable truths. For the spillway, deferral might look good numerically but is ethically risky. The board must confront the moral weight of future safety vs. current rates. The procedure can't resolve value conflicts, forcing public accountability.

  Underlying needs: The user needs a transparent, repeatable method that withstands public and legal scrutiny. They want to ensure future residents are fairly considered, avoiding intergenerational inequity. The procedure must make implicit trade-offs explicit, especially ethical ones, so the board owns these decisions openly.
answer: |-
  Here is a procedural framework meeting your requirements, designed for rigor, defensibility, and practical application by non-economists, followed by analysis of your three proposals.

  ---

  ### **Four-Part Discounting & Evaluation Procedure**

  **I. Screening: Decompose the Discount Rate (Step 1A-1D)**  
  *Assign explicit, separable discount components to each benefit stream. Default: All components = 0% unless justified.*  

  1.  **Capital Productivity (δ_cp):**  
      *   *Definition:* The opportunity cost of capital – what the same funds could earn if invested elsewhere (e.g., in financial markets) for residents' benefit.  
      *   *Application:* Apply ONLY to monetary costs/benefits (e.g., construction costs, avoided property damage, reduced emergency response costs).  
      *   *Rate Justification:* Base on long-term, risk-free real return (e.g., 30-year TIPS ≈ 1.5-2.0%). *If using a "market" rate (e.g., 5%), document that this rate PRIMARILY reflects δ_cp.*  

  2.  **Wealth Growth (δ_w):**  
      *   *Definition:* The expectation that future residents will be richer, so a marginal dollar (or equivalent benefit) is less valuable to them.  
      *   *Application:* Apply to ALL benefit streams (monetary, health, safety, environmental) UNLESS evidence suggests future residents will be poorer locally.  
      *   *Rate Justification:* Base on long-term per capita GDP/consumption growth projections (e.g., CBO/Long-term ≈ 1.3-1.8% real). *MUST cite source.*  

  3.  **Risk Premium (δ_r):**  
      *   *Definition:* Compensation for the risk that the projected benefit may not materialize (project failure, authority insolvency, policy change, climate change altering baseline risk).  
      *   *Application:* Apply ONLY to benefit streams where risk is material and quantifiable. *Do NOT apply to costs (they are certain once committed).*  
      *   *Rate Justification:* Rate varies by project risk (Low: 0-1%, Med: 1-3%, High: 3-5+%). *Requires explicit risk assessment narrative per proposal.*  

  4.  **Pure Time Preference (δ_ptp):**  
      *   *Definition:* Valuing a benefit less SOLELY because it occurs later in time, irrespective of wealth, risk, or capital productivity. An ethical choice.  
      *   *Application:* Apply only if explicitly justified as policy. Default = 0%.  
      *   *Rate Justification:* If used (e.g., 0.1%), requires explicit board acknowledgment of ethical implications (see Part II).  

  **Total Discount Rate (δ_total):** `δ_total = δ_cp (monetary) OR δ_w (non-monetary) + δ_r + δ_ptp`  
  *Note: δ_cp and δ_w are generally mutually exclusive for a given benefit type.*

  **II. Consistency Check: Pure Time Preference (δ_ptp)**  
  *Mandatory step if δ_ptp > 0%. Forces explicit ethical confrontation.*  
  *   Pose this question: **"Does applying δ_ptp mean we value a specific health/safety benefit occurring in year T to a *future* person (e.g., a child born in 2040) less than the *identical* benefit occurring in year T to a *current* person (e.g., a 60-year-old alive today)?"**  
      *   If **YES**: Document that δ_ptp inherently values future generations less than current ones for identical outcomes. This is the logical implication.
      *   If **NO**: δ_ptp must be set to 0%. It cannot be ethically applied only to the unborn.

  **III. Rules: What Gets Discounted & Existence Dependency**  

  1.  **Discounting Lives, Health & Irreplaceables:**  
      *   *Monetized Equivalents:* If a health/safety benefit is valued in monetary terms (e.g., Value of Statistical Life - VSL), apply **δ_w + δ_r + δ_ptp** (δ_cp is inappropriate).  
      *   *Non-Monetized:* If benefits are left in physical units (e.g., life-years saved, cases of illness avoided), **DO NOT DISCOUNT** the physical unit. Discounting applies ONLY when converting to a common monetary metric. *Recommend physical unit reporting alongside NPV.*  

  2.  **Existence Dependency (e.g., Levees & Development):**  
      *   *Rule:* **Count all benefits accruing to people who *will plausibly exist* because of the decision.**  
      *   *Avoid Double-Counting:* Do NOT count benefits to people *whose existence is induced* by the project *if* those benefits are already captured in standard economic impact analyses (rare for flood authorities). Focus on the *difference in risk/exposure* for the expected future population.  
      *   *Application:* The "benefit" is the *avoided harm* to the future residents choosing to live in the protected area vs. the harm they would have faced elsewhere. Estimate conservatively.  

  **IV. Stopping Rules & Uncertainty Handling**  

  1.  **Hard "No":**  
      *   NPV (using justified δ_total) < 0 AND non-monetized benefits are trivial/unlikely.  
      *   Benefit-cost ratio (BCR) < 1.0 using justified rates AND no compelling overriding factors (extreme risk, equity mandates).  

  2.  **Return a Number (NPV/BCR):**  
      *   When benefits and costs are reasonably certain and monetizable within the analysis horizon (≤ 50 years).  
      *   When δ_total is well-justified and stable.  

  3.  **Hand-off to Board (Requires Explicit Value Judgment):**  
      *   **Truncation at Horizon (e.g., Year 50):** When >20% of *undiscounted* benefits occur beyond year 50. Report:  
          *   NPV/BCR using δ_total over 50 years.  
          *   NPV/BCR using δ_total = δ_cp (or δ_w) only over 50 years (removing δ_r, δ_ptp).  
          *   Qualitative description of post-50 benefits (magnitude, nature, uncertainty).  
      *   **High δ_r Uncertainty:** When risk dominates (δ_r > 3%) and probability of benefit failure is highly uncertain/scenario-dependent. Report NPV/BCR under Low/Med/High risk scenarios.  
      *   **Dominant Non-Monetized Benefits:** When critical benefits (lives, health, key ecosystems) cannot be credibly monetized. Report quantified physical units (undiscounted) alongside monetary NPV.  
      *   **Ethical Impasses:** When Part II (δ_ptp) or Part III (discounting lives/existence) reveals a fundamental value conflict unresolvable by analysis.  

  ---

  ### **Application to Live Proposals**

  **Proposal 1: Lead Service Line Replacement**  
  *   **Costs:** High upfront capital (Year 0).  
  *   **Benefits:** Reduced lead exposure → avoided health costs (medical, special education) & higher lifetime earnings over ~40 years. Benefits accrue to current *and* future occupants.  
  *   **Analysis:**  
      *   *Screening:*  
          *   δ_cp: 1.8% (Applies to monetary benefits: avoided medical/ed costs, higher earnings).  
          *   δ_w: 1.5% (Applies to ALL benefits – monetized health & earnings).  
          *   δ_r: 0.5% (Low risk: pipes work if installed; health link well-established).  
          *   δ_ptp: **0% (Set by Procedure Part II)**. Applying δ_ptp would mean valuing a child born in this house in 2040 less than a child living there today for identical health harm. Committee rejects this ethically.  
          *   *δ_total (Monetary):* 1.8% (δ_cp) + 0.5% (δ_r) = **2.3%**  
          *   *δ_total (Health - if monetized via VSL):* 1.5% (δ_w) + 0.5% (δ_r) = **2.0%**  
      *   *Discounting Rules:* Monetized benefits discounted at 2.3%. Avoided lead poisoning cases reported physically (undiscounted).  
      *   *Existence Dependency:* Future occupants benefit; counted (they will exist elsewhere if not here).  
      *   *Stopping Rules:* Benefits end ~40 years. NPV calculated directly.  
  *   **Result:** NPV likely **strongly positive**. High upfront cost offset by significant, near-term health/economic benefits accruing soon to current residents, with benefits continuing for future families. *Procedure confirms this is a high-priority investment.*  

  **Proposal 2: Voluntary Buyout (Flood-Prone, Shrinking Area)**  
  *   **Costs:** Large upfront acquisition + demolition (Year 0).  
  *   **Benefits:** Avoided property damage, emergency response, trauma over 80 years.  
  *   **Analysis:**  
      *   *Screening:*  
          *   δ_cp: 1.8% (Applies to monetary benefits: avoided damage/response).  
          *   δ_w: 1.5% (Applies to all).  
          *   δ_r: **3.0% (High Risk):** Depopulation trend increases uncertainty of future damages (fewer assets at risk). Potential for policy reversal/development pressure. Climate uncertainty.  
          *   δ_ptp: **0% (Set by Part II)**.  
          *   *δ_total:* 1.8% (δ_cp) + 3.0% (δ_r) = **4.8%**  
      *   *Discounting Rules:* Monetized benefits discounted at 4.8%. Trauma reduction reported qualitatively.  
      *   *Existence Dependency:* Buyout prevents *future* residents from moving in. Benefits are the avoided harm to those who would have lived there vs. where they actually live. Estimate conservatively based on projected depopulation.  
      *   *Stopping Rules:* **Hand-off to Board Required.**  
          *   Reason 1: **Truncation Impact.** Significant (>30%) *undiscounted* benefits (avoided damages in 60-80 yrs) fall beyond 50 years. NPV(50) at 4.8% may be negative/near zero.  
          *   Reason 2: **High δ_r Uncertainty.** Depopulation & climate make long-term damage projections highly uncertain.  
          *   *Reporting to Board:*  
              *   NPV(50 yrs @ 4.8%) = $X (Likely low/negative)  
              *   NPV(50 yrs @ δ_cp only = 1.8%) = $Y (More positive, showing risk discount impact)  
              *   Narrative: "Significant projected damages avoided beyond 50 years ($Z undiscounted), but high uncertainty exists around population and climate risks. The economic case hinges on the validity of the long-term risk projections and the weight given to distant future benefits."  
  *   **Result:** **Uncomfortable Truth.** The high risk premium (δ_r) and truncation likely make the 50-year NPV marginal or negative, despite long-term intuitive appeal. The board must decide if the long-term risk reduction and ethical commitment to future safety (even for potentially fewer people) outweigh the weak short-term economic signal. *The procedure cannot settle this; it forces the board to own the value judgment on long horizons and uncertainty.*  

  **Proposal 3: Defer Spillway Upgrade (2 cycles)**  
  *   **Costs:** None now. Higher cost in 6-10 years (inflation).  
  *   **Benefits:** Avoided capital spend now (can be "invested" elsewhere per δ_cp).  
  *   **"Benefits" of Deferral:** Lower rates now.  
  *   **Risks:** Increased probability of catastrophic failure (low annual prob, high consequence) over deferral period + 40-60 years.  
  *   **Analysis:**  
      *   *Screening (For Risk):*  
          *   Focus on the *incremental risk* created by deferral.  
          *   δ_cp: 1.8% (Applies to monetary value of *avoided* failure damages - if they occur).  
          *   δ_w: 1.5% (Applies if valuing lives lost).  
          *   δ_r: **4.0% (Very High Risk):** Risk of failure is inherently probabilistic. Political/technical risk that upgrade gets deferred again. Climate change may accelerate risk.  
          *   δ_ptp: **0% (Set by Part II)**.  
          *   *δ_total (Damages):* 1.8% (δ_cp) + 4.0% (δ_r) = **5.8%**  
          *   *δ_total (Lives - if monetized):* 1.5% (δ_w) + 4.0% (δ_r) = **5.5%**  
      *   *Discounting Rules:* Potential future damages discounted at 5.8%. Potential lives lost reported physically (undiscounted).  
      *   *Existence Dependency:* Not primary.  
      *   *Stopping Rules:* **Hand-off to Board Required.**  
          *   Reason 1: **Non-Monetized Benefits Dominate:** The core risk is loss of life/environmental catastrophe. Monetization (VSL) is possible but controversial.  
          *   Reason 2: **High δ_r Uncertainty & Long Horizon:** Risk assessment is highly sensitive to probability estimates and climate models beyond 40 years.  
          *   *Reporting to Board:*  
              *   Expected NPV of Deferral = (Avoided Cost Now) - [PV(Incremental Failure Risk Damages @ 5.8%) + PV(Higher Future Construction Cost @ 1.8%)]. *Likely shows a near-term financial "gain".*  
              *   **CRITICAL NARRATIVE:** "The calculated short-term financial gain relies heavily on discounting low-probability, high-consequence risks far in the future at a high rate (5.8%). This discounts the value of lives potentially lost in 2060 significantly. The key question is whether accepting this increased existential risk to current infrastructure is justified by the short-term rate relief. The probability, while low, is not zero, and the consequences are severe and irreversible. The economic calculation cannot resolve this ethical trade-off between immediate affordability and long-term safety responsibility."  
  *   **Result:** **Profoundly Uncomfortable Truth.** The procedure shows deferral likely has a *positive NPV* due to high discounting of distant catastrophe risks. However, it forces the committee to explicitly state that this result depends on heavily discounting the value of future lives and safety, and on assuming the catastrophic risk remains acceptably low despite deferral and climate change. **This is the key insight the board would "rather not hear"** – deferral is financially rational *only if* they are willing to significantly discount the value of preventing future disaster. The board MUST own this ethical judgment publicly. *The procedure cannot tell the board if the risk is "worth it"; it exposes the ethical cost of the discounting.*  

  ---

  ### **What the Procedure Cannot Settle**

  1.  **The Value of δ_ptp:** Setting δ_ptp > 0% is an ethical choice, not an economic one. The procedure forces clarity on its implication but cannot dictate the choice.
  2.  **The Weight of the Far Future:** When significant benefits lie beyond 50 years or are highly uncertain (Proposal 2 & 3), the procedure quantifies the *impact* of discounting/truncation but cannot determine how much weight those future benefits *should* receive. This is a core intergenerational equity judgment.
  3.  **Monetization of Life/Health:** While it provides frameworks, assigning a dollar value to health, life, or unique environmental assets remains a societal/political value judgment.
  4.  **Risk Tolerance:** Defining acceptable probabilities of catastrophic failure (Proposal 3) is fundamentally a value judgment about safety and responsibility to the future.
  5.  **Existence Dependency Nuances:** Precisely defining the counterfactual population (who exists where if not here) involves unavoidable assumptions.

  This procedure replaces crude discounting with transparent, ethically grounded steps. It provides defensible numbers where possible and forces explicit, minuted value judgments by the board where necessary – crucial for public accountability and potential legal challenge. The analysis of your three proposals demonstrates its power to reveal uncomfortable truths, particularly regarding intergenerational equity and risk tolerance.
