prompt: |-
  Ive been following the algorithmic fairness thing since the 2016 ProPublica piece on COMPAS, and what I want is a diagnosis rather than another explainer, so please skip the survey of defintions and skip the bibliography. Ive read the surveys; I just cant tell what argument they are supposed to be settling.

  Here is where it looks stuck to me. ProPublica said black defendants were almost twice as likely as white defendants to be incorrectly labelled higher risk; the company that built the tool said no, a given score means the same thing for both groups, the scores are calibrated. Then the impossibility results came in and showed both sides were basically right. The one everybody cites is Kleinberg's 2016 paper, where you cannot have calibration within groups and balance for both the positive and the negative class at the same time except in highly constrained special cases where the base rates line up. Since then: a decade of new fairness criteria, a fresh incompatibility theorem every few months, toolkits that let you choose which point on which trade-off you would like to sit at, and as far as I can tell nobody has moved an inch. The field now produces taxonomies and dashboards instead of verdicts.

  My hypothesis, which I want stress-tested rather than flattered: this is not mainly a value disagreement about how much we care about false positives versus false negatives. Its a disagreement about what kind of object fairness is even a property of — a score distribution, a thresholded decision rule, the whole pipeline including which features and which target label you picked, or a repeated process over time — with a hidden empirical question about where the base-rate differences come from doing most of the real work while everyone treats them as a fixed parameter.

  The test Ive been trying to apply, which I made up, so tell me if its confused: run an invariance audit on each proposed criterion. For each one, ask which changes to the setup leave the verdict unchanged — permuting people within a group, swapping which group counts as protected, moving the decision threshold, adding or dropping a feature, redefining the target as arrest rather than reconviction, splitting a group into subgroups and demanding the criterion hold there too, swapping the deployment population for the training population. On this reading each camp is demanding invariance under the changes it takes to be morally inert and tolerating variation under the rest, and the impossibility theorems are what falls out when two sets of demands together generate everything, the way two symmetry conditions can jointly force the trivial solution. Is that a useful redescription of the standoff, or am I just relabelling it?

  And separately: how much of this is verbal, with one camp using fair for something like actuarial or descriptive accuracy and the other for something substantively moral? Are all the impossibility theorems even doing the same kind of work, or do the ones that only bite when base rates differ need to be kept apart from the ones that bite regardless?

  What I actually want is the diagnosis, argued from what each side really says, plus what would count as progress given that diagnosis. A theorem about which invariances can coexist, a change of question from which criterion is correct to who gets to choose at deployment and under what mandate, genuine causal work on the base rates, a distinction nobody has drawn yet — or an honest argument that these are bedrock intuitions and no progress should be expected. British English please, and no citations.
reasoning: |-
  Okay, the user is deeply familiar with algorithmic fairness debates since the COMPAS controversy. They've read the surveys and impossibility results but feel the field is stuck in a loop of trade-offs without resolution. Their hypothesis is that the core issue isn't about values (false positives vs. false negatives) but about what fairness is a property of—scores, thresholds, pipelines, or processes—and that base-rate differences are treated as fixed when they shouldn't be.

  They propose an "invariance audit" framework: testing which changes leave a fairness criterion unchanged (e.g., permuting individuals, swapping groups, changing thresholds). They see camps as demanding invariance under changes they consider morally inert, leading to impossibility when demands conflict. They also ask if the disagreement is verbal ("fair" as actuarial vs. moral) and whether impossibility theorems should be categorized by when they bite (base-rate dependent or not).

  The user wants a stress-tested diagnosis, not flattery. They seek clarity on the standoff's roots and what progress could look like—perhaps invariance coexistence theorems, governance questions, causal work on base rates, or new distinctions. No citations or surveys; British English required.

  First, unpack their invariance audit. It's clever: each fairness criterion's "moral inertness" assumptions become visible through what it holds fixed. For example, calibration requires scores mean the same across groups (invariant to group swaps if base rates match), while error rate balance requires thresholds not to harm groups differently (invariant to threshold moves if error ratios align). Impossibility arises when criteria demand conflicting invariances—e.g., calibration + error balance only work if base rates are equal, which isn't morally inert to everyone.

  The verbal confusion is real. "Fair" is used both technically (calibration as score integrity) and morally (error balance as anti-bias). Some camps care about scores (actuarial fairness), others about decisions (allocative fairness), and others about system design (pipeline fairness). Impossibility theorems that rely on base-rate differences (like Kleinberg's) highlight contingent conflicts, while others (like group fairness vs. individualism) are more absolute.

  The hidden work of base rates is crucial. Treating them as fixed parameters ignores that they may reflect past injustice (e.g., biased policing inflating Black arrest rates). Pipeline-focused critics see this as circular; score-focused defenders see it as reality to accommodate. This is where the empirical question bites: if base rates are mutable, insisting on calibration perpetuates bias.

  Progress might come from:
  - Theorems mapping achievable invariances: e.g., "if you want invariance to X and Y, you must accept sensitivity to Z."
  - Shifting from "which criterion" to governance: who chooses trade-offs, with what mandate (e.g., regulators vs. hospitals).
  - Causal interrogation of base rates: if disparities stem from biased processes, fixing the pipeline is fairer than matching scores.
  - Distinguishing criteria by "when they bite": base-rate-dependent impossibilities signal contingent problems (fixable by changing inputs), while others reflect deeper conflicts.

  The diagnosis: the standoff is a collision of framings. Score defenders (calibration) see fairness as fidelity to reality; decision critics (error balance) see it as correcting systemic bias. Pipeline critics see both as band-aids if inputs are poisoned. Progress requires admitting that "fairness" isn't one property and that base rates aren't neutral.
answer: |-
  Your diagnosis is sharp, and the invariance audit is a genuinely useful lens—not just relabelling. Let's stress-test it, then sketch what progress might look like given this framing.

  ### Core Diagnosis: What Fairness is a Property Of (and Why Base Rates Aren't Neutral)
  The standoff *is* fundamentally about **what fairness attaches to**:
  1. **Score Distributions**: The "calibration" camp (COMPAS creators) sees fairness as a property of the *score itself*. If P(recidivism | score=s) is identical across groups, the score is "truthful", and any outcome disparities reflect real-world base rate differences. Fairness here is **actuarial accuracy**.  
     *Invariance demanded:* Swapping group labels *should* change nothing if base rates are held fixed. Changing thresholds? Irrelevant—fairness lives in the score.  
     *Hidden empirical work:* Base rates are treated as exogenous, fixed inputs. If Black defendants have higher observed recidivism, that's "reality".

  2. **Thresholded Decisions**: The "error balance" camp (ProPublica) sees fairness as a property of the *decision rule*. Equalising FPR/FNR across groups ensures the tool doesn't harm one group more via mistakes. Fairness here is **allocative equity**.  
     *Invariance demanded:* Moving the threshold *shouldn't* disproportionately harm one group. Swapping group labels *should* swap outcomes if base rates differ—otherwise, the rule is biased.  
     *Hidden empirical work:* Base rates are treated as potentially *endogenous*—they could reflect prior bias (e.g., policing practices inflating Black arrest rates). Fixating on calibration "bakes in" past injustice.

  3. **Whole Pipeline**: Critics (e.g., later scholars) argue fairness must attach to the *system*, including feature selection (e.g., using "prior arrests" when policing is biased) or target definition (e.g., "arrest" vs. "conviction"). Fairness here is **procedural justice**.  
     *Invariance demanded:* Dropping a biased feature (e.g., zip code) *should* change the verdict. Redefining the target (e.g., to conviction) *should* matter. Splitting groups *should* reveal hidden disparities.  
     *Hidden empirical work:* Base rates are *mutable*—they emerge from societal choices. The audit question is: "Do these base rates legitimately reflect risk, or systemic bias?"

  4. **Dynamic Process**: A minority view sees fairness as emergent over *time* (e.g., feedback loops where predictive policing amplifies disparities). Fairness here is **temporal robustness**.  
     *Invariance demanded:* Deploying in a new population *shouldn't* collapse fairness. Permuting individuals *should* preserve group metrics (unrealistic, exposing rigidity).  

  **Why impossibility theorems bite**: Each camp demands invariance under operations central to their view (e.g., calibration ignores thresholds; error balance ignores scores). Kleinberg-style results expose that these invariances *collide* when base rates differ. Your symmetry analogy holds: demanding *both* score truthfulness (calibration) *and* allocative equity (error balance) overconstrains the system. The only "solution" is equal base rates—which isn't a solution but a politically charged empirical claim.

  ### Verbal Confusion: Actuarial vs. Moral "Fairness"
  Absolutely, this is pivotal:
  - **"Fair as descriptive accuracy"**: The calibration camp uses "fair" to mean the score reliably *describes* reality (even an unjust one). If risk differs, scores *should* reflect it.  
  - **"Fair as moral imperative"**: The error balance camp uses "fair" to mean the tool *rectifies* or *neutralises* bias. Allocative harm matters more than statistical purity.  

  This isn't pedantry—it's why the camps talk past each other. When COMPAS says "our scores are fair", they mean "well-calibrated". ProPublica hears "we treat groups equally".

  ### Impossibility Theorems: Two Flavours
  They *should* be split:
  1. **Base-Rate-Dependent Impossibilities (e.g., Kleinberg)**: These show trade-offs *conditional* on current disparities. They bite *because* base rates differ. **Progress implication:** If base rates are mutable (e.g., via policing reform), these trade-offs aren't inevitable.  
  2. **Base-Rate-Agnostic Impossibilities (e.g., fairness/accuracy trade-offs under strict equality constraints)**: These expose conflicts even with equal base rates (e.g., satisfying all subgroup fairness simultaneously). **Progress implication:** These are "deeper" limitations of formalism itself.

  ### What Progress Could Look Like
  Given your diagnosis, progress isn't about a "correct" criterion but:
  1. **Mapping Invariance Coexistence**: Theorems showing *which sets of invariances* can jointly hold (e.g., "if you demand threshold-invariance *and* group-swap-invariance, you *must* accept sensitivity to feature changes"). This frames trade-offs transparently: "What are you willing to hold fixed, and what must you allow to vary?"  
  2. **Shifting from "What is Fair?" to "Who Decides? Under Which Constraints?"**: Accept that no criterion is universally "right". Instead:  
     - **Deployment mandates**: Regulators could require *audits* showing which invariances hold (e.g., "this credit model is threshold-invariant but not feature-invariant").  
     - **Contextual governance**: Parole boards might prioritise error balance; insurers might prioritise calibration. The "fairness arbiter" is specified upfront.  
  3. **Causal Interrogation of Base Rates**: Treating base rates as fixed is the field's original sin. Progress demands:  
     - **Auditing provenance**: "Do these arrest rates reflect underlying risk or policing bias?" (e.g., test if disparities shrink when using convictions not arrests).  
     - **Dynamic modelling**: How does deploying this tool *change* base rates (e.g., via feedback loops)? Fairness isn't static.  
  4. **New Distinction: Legitimate vs. Illegitimate Disparities**: Not all base-rate differences are morally equivalent. Was the disparity produced by:  
     - **Brute luck** (e.g., genetic illness)? → Calibration might be defensible.  
     - **Systemic injustice** (e.g., redlining)? → Error balance or pipeline redesign is essential.  

  ### In Short
  The standoff persists because camps:
  - Fixate on *different objects* (scores vs. decisions vs. pipelines),  
  - Define "fairness" *differently* (actuarial vs. moral),  
  - Treat base rates as either *sacrosanct reality* or *mutable injustice*.  

  Your invariance audit exposes this: each camp's "fairness" is defined by what it holds constant. **Progress means forcing the empirical question: "Where do these base rates come from?"—and accepting that fairness isn’t a single property to be defined, but a set of context-dependent choices about what to hold accountable.** The field’s next step isn’t another impossibility theorem, but tools to trace disparities upstream and governance models to manage the inevitable trade-offs without pretending they’re neutral.
