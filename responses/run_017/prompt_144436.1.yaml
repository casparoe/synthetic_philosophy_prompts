prompt: |-
  I'm a TA for a second-year epistemology course and I'm working through a stack of short-answer responses to one of our problem questions. We'd just done the contextualism reading (DeRose-style) and the pragmatic encroachment reading (Stanley/Hawthorne-style subject-sensitive invariantism), and I wrote a question that was supposed to force people to separate the two views rather than just restate the bank case. I also threw in a wrinkle I made up myself so they couldn't just reproduce the seminar discussion, and a final part on whether knowledge can still do its usual job of settling practical questions if it moves around like this. The question was worth 25 marks. The rubric I was given is pretty loose: accurate statement of each view, a correct account of what the two views actually disagree about, a defensible treatment of the wrinkle case, and a real engagement with the action-guiding point rather than a slogan.

  Here's the question:

  **Question 3.** (a) Set out the disagreement between epistemic contextualism and pragmatic encroachment. Both views predict that whether someone counts as knowing can shift with features of the context, so what exactly are they disagreeing about? (b) Dana has exactly the sort of evidence you'd expect in a bank case: she remembers banking there on a Saturday a few weeks ago, she glanced at the posted hours, and so on. As far as Dana is concerned, nothing much hangs on whether the bank is open Saturday. But unbeknownst to her, the bank's Saturday hours determine whether a grant she applied for months ago gets paid out this cycle — a great deal to her, if only she knew. Say what each view predicts about whether Dana knows, and say whether the case tells against either view. (c) Knowledge is supposed to be the thing that settles practical questions: if you know that p, that is normally enough to act on p. Does either view make knowledge unable to play that role?

  And here's one student's answer, more or less verbatim (I haven't fixed the typos):

  "Contextualism and pragmatic encroachment are both reactions to the same pattern. In the bank case you have the same evidence either way — you banked there on a Saturday a few weeks back, you've seen the hours posted — but on Friday, when it matters whether the check clears before Monday, it feels wrong to say you know the bank will be open, and on Saturday, when nothing much is riding on it, it feels fine. The contextualist explains this by saying that the truth-conditions of 'knows' shift with the context of the person making the attribution. In a high-stakes conversational context, the standards go up, and so one and the same sentence can be true in one mouth and false in another, roughly the way 'flat' and 'tall' work.

  Pragmatic encroachment, or subject-sensitive invariantism, agrees that knowledge tracks practical factors but locates the shift somewhere else: what matters is how much is at stake for the subject, not which standards happen to be in force in the attributor's conversation. Importantly, encroachment is still a form of invariantism, so it doesn't have to say that the meaning of 'knows' changes from context to context. What changes is whether the subject's practical situation lets her count as knowing at all.

  So the views disagree about whose situation does the work, and you can pull them apart. Suppose I'm attributing knowledge to Dana and a huge amount is riding on it for me, while almost nothing is riding on it for her. The contextualist says my high-stakes context raises the standards, so 'Dana knows' is false; the encroacher says Dana's own stakes are what count, so she knows and what I said is true.

  The unbeknownst-stakes case makes the contrast sharper. Dana's evidence hasn't changed and, as far as she can tell, the stakes are trivial. Encroachment has to say she doesn't know, because the stakes really are enormous — a grant she cares about turns on it — and encroachment is a view about how much is actually at stake, not about how much the subject thinks is at stake. Contextualism, by contrast, has nothing to latch onto: nothing in the conversational context has changed, so it predicts that Dana knows. But this is bad news for the encroacher, because it shows that encroachment is really contextualism in disguise. Once the subject's knowledge can hinge on facts she has no access to, the encroacher is committed to knowledge depending on something external to the subject's own evidence, and that is just the contextualist's point about the attributor's context. The dispute is therefore much shallower than it is made out to be.

  On (c), the worry is that if knowledge slides around with stakes, it can't be the stable thing that settles what to do. I think this is fatal to encroachment. On encroachment you can acquire knowledge just by ceasing to care whether p is true: stop caring whether the bank is open and you come to know that it is, with no improvement in your evidence whatsoever. That's absurd. Contextualism escapes this, because for the contextualist the standards are fixed by the attributor's context rather than by the subject's own attitudes, so the subject can't manufacture knowledge by talking herself out of caring. On the whole I find the encroachment reading more interesting, but (b) and (c) show it can't be right as it stands."

  Two of the other TAs thought this was one of the stronger answers in the pile and on a first read I agreed, but I've now been staring at it for a while and something keeps nagging at me — it reads so smoothly that I'm worried I'm grading the prose rather than the philosophy. Can you grade it properly: give me a mark out of 25 with a breakdown by part, and then the specific comments I could paste into the feedback, the kind the student could actually learn from? For each part I'd like to know what they got right, what's wrong or doesn't follow, and where a claim is merely under-argued rather than false. If you think something in there is a mistake, please say what the correct thing to say would have been, and be explicit about which mistakes you'd actually dock marks for versus which you'd just note in the margin. Don't worry about being harsh, I'd rather catch it now than at the grading meeting.
reasoning: |-
  Okay, I need to grade this epistemology student's answer. The question has three parts: (a) explaining the disagreement between contextualism and pragmatic encroachment, (b) applying both views to the "unbeknownst-stakes" case, and (c) discussing whether knowledge can still guide action if it's stakes-sensitive. 

  First, looking at part (a). The student correctly identifies that contextualism makes "knows" context-sensitive like "tall" or "flat," shifting with the attributor's context. For pragmatic encroachment (subject-sensitive invariantism), they rightly say knowledge depends on the subject's practical stakes. The contrast case they give (high-stakes attributor, low-stakes subject) is perfect for showing the disagreement. Full marks here - it's clear and accurate.

  Now part (b) is where things get messy. The student says contextualism predicts Dana knows because nothing changed in the conversational context. That's correct. But they claim pragmatic encroachment must say Dana doesn't know because the stakes are actually high. This is wrong - Stanley/Hawthorne-style encroachment cares about the subject's epistemic position relative to what's at stake for them, but Dana doesn't know about the grant! The student conflates objective stakes with stakes-for-the-subject. Encroachment would actually say Dana does know here because she's unaware of the high stakes. Then they make a bizarre claim that this shows encroachment is "contextualism in disguise" because knowledge depends on external factors - but that confuses two different types of externality (attributor context vs. subject's unknown practical situation). This part has serious errors that need major point deductions.

  For part (c), the student argues that on encroachment, you could "manufacture knowledge" by ceasing to care. That's a fair criticism, but they miss that contextualism has a parallel problem: attributors can manipulate "knowledge" by changing conversational standards. Their defense of contextualism here is weak. And they don't engage with how either view might still let knowledge guide action - just declare encroachment "absurd." Underdeveloped but partially salvageable.

  The prose is polished, which probably fooled the other TAs initially, but the philosophical errors in (b) are significant. I'll need to award high marks for (a), heavily penalize (b), and give partial credit for (c)'s attempted critique while noting its flaws. The "contextualism in disguise" argument is especially egregious - it fundamentally misrepresents both views' metaphysical commitments. I'll make sure the feedback clearly explains why the stakes being unknown matters for encroachment, and how action-guidance worries apply symmetrically to both theories.
answer: |-
  Here's a graded breakdown and feedback for the student's answer. While the prose is polished and initially persuasive, significant philosophical errors in parts (b) and (c) undermine its strength. **Final Mark: 16/25**  

  ### **Breakdown by Part**  
  - **(a) Disagreement (8/10 marks)**  
    **Strengths:**  
    - Correctly identifies contextualism's core claim: "knows" is context-sensitive, with truth-conditions shifting based on the attributor's conversational standards.  
    - Accurately characterizes pragmatic encroachment (subject-sensitive invariantism): knowledge depends on the *subject's* practical stakes, not contextual variation in "knows."  
    - Excellent contrast case (high-stakes attributor + low-stakes subject) to disentangle the views.  
      
    **Weaknesses/Errors:**  
    - Minor deduction for not explicitly framing the *metaphysical* disagreement: contextualism treats knowledge as relationally variable (like "tall"), while encroachment treats it as a stable relation sensitive to the subject's situation.  
    - **Mark deduction:** -2 (Near-perfect but misses subtlety in the nature of disagreement).  

  - **(b) Unbeknownst-Stakes Case & Evaluation (4/10 marks)**  
    **Strengths:**  
    - Correct on contextualism: Predicts Dana knows (attributor context unchanged).  
    - Correctly notes Dana’s evidence/perspective is unchanged.  
      
    **Critical Errors:**  
    - **Major mistake:** Misstates pragmatic encroachment’s prediction. Encroachment requires the subject *to be aware* of high stakes for knowledge to be undermined (Stanley: stakes must be "integrated into the subject’s practical reasoning"). Since Dana is *unaware* of the grant’s dependency, encroachment **predicts she still knows**. The student incorrectly claims encroachment says she "doesn’t know."  
    - **Invalid inference:** Claims the case shows encroachment is "contextualism in disguise" because knowledge hinges on "external facts." This conflates two distinct externalities:  
      - Contextualism: External *attributor* context (conversational standards).  
      - Encroachment: External *subject*-affecting facts (stakes), **but only when recognized by the subject**.  
      The argument collapses due to the misprediction.  
    - **Missed opportunity:** Fails to note this case *favors contextualism* (since stakes unknown to Dana shouldn’t affect her knowledge on any view) but doesn’t refute encroachment (which wouldn’t deny knowledge here).  
    - **Mark deduction:** -6 (Severe error on encroachment’s prediction + flawed argument against it).  

  - **(c) Action-Guiding Role (4/10 marks)**  
    **Strengths:**  
    - Identifies the core worry: If knowledge shifts with stakes, can it reliably settle practical questions?  
    - Fair criticism of encroachment: Notes the "absurdity" of knowledge changing without evidence if stakes drop.  
      
    **Weaknesses/Under-Development:**  
    - **Ignores symmetrical problem for contextualism:** If attributors (e.g., advisors) in high-stakes contexts say "S doesn’t know," this *also* destabilizes action-guidance for the subject (e.g., "My advisor says I don’t know—can I act?").  
    - **Overclaims:** Declares the worry "fatal to encroachment" without engaging defenses (e.g., Hawthorne: knowledge *does* settle deliberation *for the subject in their context*).  
    - **Incomplete defense of contextualism:** Claims contextualism avoids the problem because "subject can’t manufacture knowledge by ceasing to care," but ignores that *attributors* can manipulate "knowledge" by shifting conversational standards.  
    - **No positive account:** Fails to discuss how *either view* might preserve knowledge’s action-guiding role (e.g., by indexing it to context/subject’s situation).  
    - **Mark deduction:** -6 (One-sided critique, unexamined assumptions, lacks depth).  

  ---

  ### **Feedback to Copy/Paste for Student**  
  **Overall:** Your answer is exceptionally well-structured and shows strong grasp of the surface distinctions between contextualism and pragmatic encroachment in part (a). However, significant errors in parts (b) and (c) undermine your analysis. Focus on precision in applying theoretical commitments to novel cases.  

  **On (a):** Excellent work. You correctly pinpoint that contextualism locates variation in the attributor’s context (making "knows" context-sensitive), while encroachment ties knowledge to the subject’s practical situation (preserving semantic invariance). Your contrast case cleanly separates the views. To improve, note that the deeper disagreement is metaphysical: contextualism treats knowledge as a *relation* between subject, proposition, and context, while encroachment treats it as a *binary relation* sensitive to the subject’s environment.  

  **On (b):** Your account of contextualism is correct: since no feature of the attributor’s context raises standards, Dana counts as knowing. However, your treatment of pragmatic encroachment is flawed. **Crucially, pragmatic encroachment requires the subject to be *aware* of high stakes for knowledge to be denied.** Stanley (2005, p. 6) emphasizes that stakes must be "integrated into [the subject’s] practical reasoning." Because Dana is *unaware* of the grant’s dependency, encroachment predicts **she still knows**—her epistemic position is adequate *given her own assessment of the stakes*. Your claim that she "doesn’t know" misrepresents the view.  

  This error undermines your subsequent argument. You claim the case reveals encroachment as "contextualism in disguise" because knowledge depends on "external facts." But contextualism’s "externality" is about the *attributor’s* conversational context, while encroachment’s "externality" concerns objective facts *about the subject’s situation* (which need not be contextually variable). The case doesn’t collapse the distinction; if anything, it *favors* contextualism, as encroachment (correctly applied) agrees that Dana knows.  

  **On (c):** You rightly highlight a challenge for encroachment: if knowledge vanishes when stakes rise, can it reliably guide action? Your "manufacturing knowledge" point is a valid criticism. However, you ignore that contextualism faces a *parallel problem*: if an attributor in a high-stakes context says "You don’t know," this may destabilize the subject’s practical reasoning (e.g., "If my doctor says I don’t know the test result, can I act on it?"). Both views struggle to explain how knowledge remains action-guiding when it "shifts."  

  Your defense of contextualism ("subject can’t manufacture knowledge") is incomplete. While the subject can’t directly alter attributors’ contexts, *those attributors* can manipulate "knowledge" by changing conversational standards—potentially undermining the subject’s confidence. Engage with how *either view* might salvage knowledge’s action-guiding role (e.g., by arguing that knowledge is always sufficient for action *in the subject’s own practical context*).  

  **Key Takeaway:** Precision matters. In applying theories to cases, ensure every claim flows from the view’s *actual commitments* (e.g., encroachment’s stake-sensitivity requires subject-awareness). Probe objections even-handedly—here, the action-guiding worry challenges both views.  

  --- 

  **Why 16/25?**  
  - (a): 8/10 (Excellent)  
  - (b): 4/10 (Severe error on encroachment + invalid argument)  
  - (c): 4/10 (Partial critique but one-sided and superficial)  
  Despite strong prose, the errors in (b) are philosophically fundamental and warrant heavy deduction. The action-guiding discussion needed deeper engagement. This is a mid-tier answer: clear exposition can’t compensate for misapplication of core ideas.
