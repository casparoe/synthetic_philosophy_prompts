answer: |-
  Here’s a detailed audit of the passage, breaking it down by scientific validity, common simplifications, and contested claims. Your three focal points are well-chosen—they align with key debates in cultural evolution research.

  ---

  ### **1. Core Claims a Specialist Would Accept**
  - **Cultural change involves Darwinian processes**: Most cultural evolution researchers agree that variation, inheritance (transmission), and selection *can* drive cultural change. This is foundational to fields like *dual inheritance theory* (Boyd & Richerson) and *cultural phylogenetics*.
  - **Memes as units of cultural transmission**: The idea that cultural traits (ideas, skills, etc.) are transmitted between individuals is uncontroversial. Terms like "cultural variant" or "trait" are often preferred over "meme" due to definitional issues (see below), but the core concept is accepted.
  - **Attention/memory as selective forces**: Cognitive constraints (e.g., limited memory) act as filters, favoring traits that are memorable, attention-grabbing, or emotionally salient.
  - **Gene-culture coevolution**: Humans have evolved cognitive capacities (e.g., imitation, language) that facilitate cultural transmission, and culture can reshape biological evolution (e.g., lactose tolerance).

  ---

  ### **2. Common Simplifications in Popular Treatments**
  - **"Copying just is replication"**: Cultural transmission is rarely perfect replication. Humans *reconstruct* ideas (e.g., through inference or blending), making transmission often *transformative* rather than replicative. Specialists use terms like "cultural mutation" but acknowledge it’s more complex than genetic mutation.
  - **"The same three conditions... hold here"**: While variation, inheritance, and selection *exist* in culture, their *mechanisms* differ from biology. For example:
    - **Variation**: Often *directed* (e.g., innovation, blending) rather than random.
    - **Inheritance**: Vertical (parent-to-child), oblique (peer-to-peer), and horizontal (cross-group) transmission occur simultaneously.
  - **"Memes are a second replicator"**: This is a metaphor. Genes replicate with high fidelity; memes do not. Many researchers avoid calling cultural traits "replicators" for this reason.
  - **"Genes built brains, memes exploited them"**: An oversimplified narrative. Brains likely coevolved *with* culture—cultural traits didn’t just "invade" a finished product.

  ---

  ### **3. Contested Claims or Overreaches**
  - **"The meme, not the person, is the unit of selection"**:  
    - **Controversy**: Most cultural evolution models treat *individuals* or *groups* as units of selection (e.g., people adopt ideas that benefit *them*). "Memes as units" implies ideas evolve *independently* of human interests—a view associated with Dawkins but contested by others (e.g., Henrich, Boyd).  
    - **Substance**: The debate centers on whether cultural traits can spread *despite harming individuals* (e.g., harmful rituals). Critics argue this is rare and context-dependent; proponents cite examples like smoking or extreme diets.

  - **"Memes that harm their bearers can still win"**:  
    - **Not automatic**: Harmful traits *can* spread under specific conditions (e.g., if linked to identity signals, or if costs are deferred), but they’re often outcompeted by beneficial traits. The passage ignores *content biases* (e.g., humans prefer useful ideas) and *model-based biases* (e.g., copying successful people).  
    - **Evidence**: Chain letters spread via manipulation (e.g., "you’ll have bad luck if you break the chain"), not because they’re "well-adapted" in a Darwinian sense. Conspiracy theories exploit cognitive biases (e.g., pattern-seeking), not selective "fitness."

  - **"Our beliefs are ones good at spreading, not adopted for good reasons"**:  
    - **Overreach**: While some beliefs spread virally (e.g., urban legends), many are adopted for functional reasons (e.g., hygiene practices). The passage implies humans are passive "habitats," ignoring *agency* (e.g., we evaluate ideas) and *functional benefits* (e.g., technology).  
    - **Missing premise**: It assumes memes *only* "compete" to spread—but humans also select ideas for accuracy, morality, or utility.

  ---

  ### **Your Specific Queries Answered**
  1. **Do the "three conditions" make culture Darwinian?**  
     - **Verbal issue**: "Darwinian" is often used loosely. *Formal* Darwinism requires heritable variation with fitness consequences. Culture meets this minimally, but critics argue transmission mechanics differ:  
       - **Substantive dispute**: Is cultural change driven by *selection on variation* (Darwinian) or by *reconstruction* (e.g., inferring goals from behavior)? Most specialists see both as complementary.

  2. **Does "memes as units" imply harmful memes thrive?**  
     - **Not necessarily**: Harmful memes require specific pathways (e.g., manipulation, hitchhiking on beneficial traits). The automatic link is a **rhetorical overstatement**. Human biases often favor beneficial traits.

  3. **Does the "beliefs" claim follow?**  
     - **No**: The conclusion requires hidden premises (e.g., "spreadability trumps functionality"). It ignores that *spreadability often correlates with usefulness* (e.g., agricultural techniques). The claim is a **non-sequitur** without evidence of widespread maladaptive beliefs.

  ---

  ### **Key Definitional Issues (Verbal vs. Substantive)**
  - **"Meme" ambiguity**: In the passage, "meme" flip-flops between:  
    (a) *The thing copied* (content),  
    (b) *A unit of selection* (agent-like),  
    (c) *Anything learned* (trivial).  
    **Substantive question**: Can cultural traits be usefully modeled as *selfish replicators*? Critics say no—human agency and reconstruction break the analogy.
  - **"Replicator"**: Specialists (e.g., Mesoudi) avoid this term for culture, preferring "cultural variant." The verbal dispute masks a real disagreement about transmission fidelity.

  ---

  ### **Specialist Consensus vs. This Passage**
  | **Aspect**               | **Specialist View**                                  | **Passage’s Take**                          |
  |--------------------------|-----------------------------------------------------|---------------------------------------------|
  | **Unit of selection**    | Individuals/groups; memes rarely "selfish"          | Memes as agents with "fitness"              |
  | **Transmission**         | Reconstructive, biased, transformative              | "Copying = replication"                     |
  | **Harmful memes**        | Possible but uncommon; context-dependent            | Automatic outcome of selection              |
  | **Human agency**         | Central to adoption/transmission                    | Passive "habitats" for memes                |

  ---

  ### **In Summary**
  - **Defensible**: Culture evolves via variation, inheritance, and selection; cognitive constraints shape transmission.
  - **Simplified but tolerated**: Memes as replicators, gene-meme coevolution narrative.
  - **Rejected/controversial**: Memes as units of selection, automatic success of harmful memes, beliefs as purely parasitic.
  - **Your instincts were correct**: The substantive disputes lie in transmission mechanics (replication vs. reconstruction), agency, and the prevalence of maladaptive cultural traits. The passage’s rhetoric often oversimplifies or misrepresents these nuances.
