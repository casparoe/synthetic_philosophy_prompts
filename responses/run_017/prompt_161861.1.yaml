prompt: |-
  I am secretary to the Species Listing Panel of a statutory nature conservation body. The Panel maintains the Schedule of protected taxa, and it receives roughly forty proposals a year — almost always from outside: a recording scheme, a museum, a local trust, occasionally a statutory consultee responding to a planning application. Listing is not a courtesy. It creates a criminal offence for harming a listed animal or uprooting a listed plant, it triggers mandatory habitat protection and the assessment duties that go with it, and it directs a large part of our recovery budget. Our decisions are subject to judicial review, so we must publish written reasons and be seen to treat like cases alike.

  The Panel is five people: a museum taxonomist, one population geneticist, one field ecologist, our lawyer, and a lay chair. It meets once per proposal cycle, six weeks apart, and it is almost never expert in the group in front of it. The evidence we get is usually morphology, a distribution map, and at best one or two gene regions, often from museum material of uncertain age. Recommendations are signed off by the Chief Scientist and made by statutory instrument.

  We are not, of course, deciding what a species is in general. But the disagreements among biologists on that question keep reappearing inside our individual cases, and they will not go away just because we have a statute to administer. The same five shapes recur:

  (i) lines of evidence that point in opposite directions — the genetic data saying one widespread lineage, the ecology and morphology saying two well-marked forms that do not intergrade where they meet;
  (ii) pairs that hybridise freely and often, with fertile hybrids, yet stay recognisably distinct, so that "they interbreed" settles nothing;
  (iii) populations whose separation is geologically recent — an island cut off by a rising sea, a reservoir, a host shift within living memory — showing partial but plainly incomplete divergence, where we cannot tell whether we are looking at a species in the making or a local race that will be reabsorbed;
  (iv) groups in which the interbreeding test has no application at all: wholly asexual lineages, and plants that self as a matter of course;
  (v) the fact that the Schedule protects *names*, and names hang on type specimens, so a population that no one has formally described can be ecologically real and legally unlistable.

  What I want from you is a decision procedure the Panel can actually run, not an essay. Please give me:

  - the questions in the order they should be asked, each with a statement of what would count as a sufficient answer, and who has to supply it;
  - the points at which the procedure stops with a no, stated as gates rather than as advice;
  - the points at which the procedure hands the decision to a person because the question is one of value — in particular whether the purpose of the statute is to preserve separately evolving lineages, to maintain ecological function, or to protect particular organisms from particular harms — and an instruction to record that hand-off as a value judgement rather than dress it up as a scientific finding;
  - an explicit rule for what to do when two lines of evidence conflict, and, just as important, a rule for consistency across cases: the written reasons must say which criterion did the work in this decision and what evidence would have changed it;
  - a way of handling the five shapes above, including a time-limited provisional listing for the incipient-divergence case, with guidance on setting the review interval and on what would count as evidence of divergence having completed rather than stalled;
  - and a short template for the published reasons.

  Then run the procedure on three cases, and tell us honestly what it cannot do and where it will misfire.

  The first is a moth with two host-associated forms. They use different food plants, their pheromones differ, and in the laboratory mating is about ninety per cent assortative; hybrids are viable and fertile, and their offspring will accept either host. Genome-wide differentiation is weak, but a handful of genomic regions are strongly differentiated.

  The second is a plant with diploid and tetraploid cytotypes. They are indistinguishable in the field to anyone not counting chromosomes, they share a pollinator, and crosses produce occasional sterile triploids.

  The third is our flagship: a form that has been on the Schedule for decades, the subject of a well-publicised recovery programme, cherished by our members and by the press. Recent genomic work places it at one end of a continuous cline inside a widespread and abundant taxon, and the type specimen of the protected name sits in the middle of that cline. I expect your procedure to tell us to do something we will not want to do, and I would rather hear it from you than from a court, so please work it through rather than soften it — and then say what the procedure legitimately leaves to us, and what it cannot settle at all, in particular for the asexual and selfing groups and for cases where the answer depends on which statutory purpose we take ourselves to be serving.
reasoning: |-
  We are designing a decision procedure for the Species Listing Panel. The procedure must be robust, legally defensible, and able to handle the recurring challenges (the five shapes). The key elements include a step-by-step question sequence, clear gates for rejection, points where value judgments are explicitly made, rules for resolving conflicting evidence and ensuring consistency, and special handling for the five shapes.

  The statutory context is critical: listing creates criminal offences, triggers habitat protection, and directs recovery funds. The Panel must publish written reasons and treat like cases alike.

  The Panel has five members: museum taxonomist, population geneticist, field ecologist, lawyer, and lay chair. They meet every six weeks and are not experts in the specific group. Evidence is typically morphology, distribution, and limited genetics.

  The decision procedure:

  1. **Question Sequence**: We must ask questions in a logical order, with clear criteria for sufficient answers and who must supply the evidence. The burden of proof is on the proposer.

  2. **Gates (Stopping Points for "No")**: These are objective criteria that, if not met, lead to rejection without further consideration.

  3. **Value Judgment Hand-offs**: Where the decision hinges on the purpose of the statute (e.g., preserving lineages vs. ecological function), the Panel must explicitly acknowledge the value judgment and not disguise it as science.

  4. **Conflict Resolution and Consistency Rules**: When evidence conflicts, we have a rule to resolve it (e.g., prioritize one type of evidence under certain conditions). For consistency, the written reasons must state which criterion was decisive and what evidence would change the decision.

  5. **Handling the Five Shapes**:
     - (i) Conflicting Evidence: Use the conflict resolution rule.
     - (ii) Hybridizing Pairs: Define a threshold for reproductive isolation or independent evolutionary trajectory.
     - (iii) Incipient Divergence: Allow provisional listing with a time limit and review criteria.
     - (iv) Asexual/Selfing: Use criteria based on genetic and ecological distinctness, and stability.
     - (v) Undescribed Populations: The procedure cannot list an undescribed population. The Panel must note this limitation and perhaps recommend description.

  6. **Provisional Listing for Incipient Divergence**: Set a review interval (e.g., 10-15 years, based on generation time) and define evidence for completed divergence (e.g., reproductive isolation, stable genetic differentiation) or stalling (e.g., no change in differentiation, gene flow increasing).

  7. **Template for Published Reasons**: A short, structured template.

  Now, the decision procedure:

  **Step 0: Initial Check (Gate 0 - Administrative)**
     - **Question**: Is the proposal complete? It must include: (a) the scientific name (if formally described) and common name; (b) evidence of threat or decline (if required by the statute for listing); (c) at least one line of evidence for distinctness (morphology, genetics, ecology, etc.).
     - **Sufficient Answer**: The proposal meets the minimum requirements as set out in the Panel's guidance. The proposer must supply this.
     - **If not**: Stop. Return to proposer for completion. (This is an administrative gate.)

  **Step 1: Formal Description (Gate 1 - Legal Requirement)**
     - **Question**: Is the taxon formally described and validly published with a type specimen? (This addresses shape (v).)
     - **Sufficient Answer**: Yes, with a published description and a type specimen that is accessible (e.g., in a museum). The proposer must supply the reference.
     - **If not**: Stop. The taxon cannot be listed. Reason: The Schedule protects by name, and an undescribed population has no name. (Gate 1: No)

  **Step 2: Distinctness Assessment (Scientific)**
     - **Question**: Is the taxon distinct from related taxa? We consider multiple lines of evidence: morphology, genetics, ecology, behavior, etc.
     - **Sufficient Answer**: Evidence must show that the taxon is diagnosably distinct by at least one major line of evidence (e.g., morphological distinctness OR genetic distinctness at a level consistent with species in the group OR ecological distinctness with consequences for conservation) AND the distinctness is not solely due to environment (plasticity). The proposer supplies the evidence; the Panel assesses.
     - **Assessment Method**:
       - For each line of evidence, the Panel assigns a weight based on quality and relevance (e.g., genome-wide data > single gene; field observations > lab only).
       - **Conflict Resolution Rule**: If lines of evidence conflict, the Panel must consider which line is more reliable for the group (e.g., in groups with known hybridization, genetics may be given more weight; in groups with strong ecological speciation, ecology may be key). If the conflict cannot be resolved by weighting, then the taxon does not meet the distinctness criterion unless the Panel makes a value judgment about the purpose of the statute (hand-off at Step 4).
       - **Note for Asexual/Selfing (shape iv)**: For asexual or selfing taxa, distinctness is assessed by genetic divergence (e.g., fixed differences) and ecological/geographic separation. The interbreeding test is inapplicable.
     - **If distinctness is not established**: Stop. The taxon is not listable as a separate species. (Gate 2: No)

  **Step 3: Evolutionary Independence (Scientific with Potential Hand-off)**
     - **Question**: Is the taxon on an independent evolutionary trajectory? This is the core of the "species" concept for conservation. We look for:
       - Reproductive isolation (where applicable) OR
       - Evidence of long-term divergent evolution (e.g., deep genetic splits, stable morphological differences) OR
       - For asexual/selfing: evidence of stable, divergent lineages that are not ephemeral.
     - **Sufficient Answer**: 
       - For sexual taxa: Evidence of reproductive isolation (not necessarily complete) that limits gene flow and maintains distinctness in sympatry, OR in allopatry, evidence of divergence that is unlikely to be reversed upon contact (e.g., strong prezygotic barriers, hybrid inviability/sterility).
       - For asexual/selfing: Evidence of long-term persistence as a distinct lineage (e.g., ancient divergence, no evidence of recent hybridization that erodes distinctness).
     - **Handling Specific Shapes**:
       - (ii) Hybridizing Pairs: If they hybridize freely but remain distinct, the Panel must assess if the hybridization is eroding distinctness or if there are mechanisms maintaining the distinctness (e.g., strong assortative mating, selection against hybrids). If distinctness is maintained despite gene flow, then independence may be established. However, if gene flow is high and the forms are not diverging, independence is not established.
       - (iii) Incipient Divergence: If the divergence is recent and incomplete, the Panel may consider provisional listing (see Step 5).
     - **Conflict with Distinctness**: If distinctness (Step 2) is established but independence is not (e.g., shape (i): morphology says two forms, genetics says one lineage), then the Panel must either:
       - (a) Reject for lack of independence, OR
       - (b) Make a value judgment about the purpose of the statute (Step 4).
     - **If independence is not established and the case does not fit the provisional listing criteria (Step 5)**: Stop. (Gate 3: No)

  **Step 4: Value Judgment on Purpose of Statute (Hand-off to Panel)**
     - **Question**: Which purpose of the statute should apply? The Panel must decide whether, in this case, the goal is:
       - (a) Preserving separately evolving lineages (the typical species concept), OR
       - (b) Maintaining ecological function (even if not a full species), OR
       - (c) Protecting particular organisms from particular harms (e.g., because of human value, threat, or distinct ecological role).
     - **Process**: This is a deliberative step by the full Panel. They must explicitly record the chosen purpose and the reasons (e.g., "We are listing this taxon to preserve ecological function because it plays a unique role in its ecosystem, even though its evolutionary independence is not fully established."). This is not a scientific finding but a policy choice.
     - **Outcome**: 
       - If the Panel chooses (a) and independence is not established, then the taxon is not listable (Gate 3: No).
       - If the Panel chooses (b) or (c), then they may proceed to Step 5 (if applicable) or Step 6 (threat assessment) even if independence is weak, provided distinctness is established.

  **Step 5: Provisional Listing for Incipient Divergence (Shape iii)**
     - **Trigger**: When the taxon shows partial divergence (e.g., recent separation, incomplete reproductive isolation) but there is a reasonable expectation that it may become a full species (or go extinct) without intervention.
     - **Criteria**:
       - Distinctness (Step 2) must be established.
       - There must be evidence of ongoing divergence (e.g., selection against migrants, reduction in gene flow).
       - The taxon must be threatened (see Step 6) such that without protection, the opportunity for speciation may be lost.
     - **Review Interval**: Set based on generation time and divergence rate. Default is 10 years for long-lived taxa, 5 years for short-lived. The Panel can adjust. The review must look for evidence of:
       - Completed divergence: Reproductive isolation in sympatry, genome-wide differentiation, or ecological stability without gene flow.
       - Stalled divergence: Gene flow increasing, differentiation decreasing, or no change in divergence metrics.
     - **Outcome**: If criteria met, proceed to Step 6. Otherwise, stop.

  **Step 6: Threat Assessment (Gate 4)**
     - **Question**: Is the taxon threatened to a degree that warrants protection? (This may be a statutory requirement; the procedure assumes it is.)
     - **Sufficient Answer**: Evidence of population decline, restricted range, small population, or other threats. The proposer must supply this.
     - **If not threatened**: Stop. (Gate 4: No)

  **Step 7: Final Decision and Statutory Requirements**
     - The Panel confirms that listing is consistent with the statute and that the benefits outweigh any negative impacts. The lawyer ensures legal compliance.

  **Consistency Rule**: In the written reasons, the Panel must:
     - State which criterion (e.g., distinctness based on morphology, independence based on reproductive isolation) was decisive.
     - Specify what evidence would have changed the decision (e.g., "Had the genetic data shown panmixia, we would not have listed.").

  **Template for Published Reasons**:
  ```
  1. Proposal: [Taxon name] proposed by [Proposer] on [Date].
  2. Decision: [Listed/Not Listed].
  3. Key Findings:
     a. Distinctness: [Summary of evidence and conclusion].
     b. Evolutionary Independence: [Summary and conclusion, or N/A for value judgment cases].
     c. Threat: [Summary of threat evidence].
     d. Value Judgment (if applicable): [Statement of purpose chosen and reason].
  4. Conflicts Resolved: [Description of conflict and how resolved, e.g., "Morphological distinctness was given greater weight due to the group's known phenotypic stability despite gene flow."]
  5. For Provisional Listings: [Review date and conditions for continuation or delisting].
  6. Inconsistency Addressed (if any): [How this case aligns with previous similar cases or why it departs].
  ```

  **Handling the Five Shapes Explicitly**:
  - (i) Conflicting Evidence: Use the conflict resolution rule (weighting) or hand-off to value judgment.
  - (ii) Hybridizing Pairs: Assess if distinctness is maintained despite gene flow. If not, reject unless value judgment applies.
  - (iii) Incipient Divergence: Provisional listing with review.
  - (iv) Asexual/Selfing: Assess distinctness via genetics and ecology; independence via stability and persistence.
  - (v) Undescribed Populations: Cannot list (Gate 1).

  Now, apply the procedure to three cases:

  **Case 1: Moth with two host-associated forms**
  - Step 0: Complete? Assume yes.
  - Step 1: Formally described? Assume yes.
  - Step 2: Distinctness? Morphology and ecology show two well-marked forms. Genetics: weak genome-wide differentiation but strong in a few regions. This is a conflict (shape i). The Panel weights ecology and morphology higher because the genetic differentiation in key regions (perhaps under selection) supports distinctness. Sufficient for distinctness.
  - Step 3: Evolutionary Independence? Hybrids are viable and fertile, and offspring accept either host. Assortative mating is 90% in lab. In nature, they meet and do not intergrade (per proposal). This suggests strong prezygotic isolation maintaining distinctness despite gene flow. Independence is established. (No need for provisional listing.)
  - Step 4: Not needed.
  - Step 5: Not triggered.
  - Step 6: Threat? (Proposal must show threat; assume it does.)
  - Outcome: Listed. Decisive criterion: distinctness based on morphology and ecology, and independence based on strong assortative mating.

  **Case 2: Plant with diploid and tetraploid cytotypes**
  - Step 0: Complete? Yes.
  - Step 1: Described? Yes.
  - Step 2: Distinctness? Morphologically indistinguishable in field (so no morphological distinctness). Genetic distinctness: ploidy difference. This is a fixed genetic difference. Sufficient for distinctness.
  - Step 3: Evolutionary Independence? They share a pollinator, so gene flow is possible? Crosses produce sterile triploids. This is a postzygotic barrier. Reproductive isolation is incomplete (some crosses may not occur, but when they do, hybrids are sterile). In sympatry, they may remain distinct due to strong postzygotic isolation. However, the proposal says "occasional" triploids, so gene flow is low. Independence established? Probably, but note that without morphological distinctness, identification requires chromosome counting. This may be a practical issue for enforcement. However, the Panel may still find independence. Alternatively, this could be a case for value judgment (Step 4) because the distinctness is genetic and the barrier is strong. But let's proceed: independence is established by the postzygotic barrier.
  - Step 4: Not needed.
  - Step 5: Not triggered.
  - Step 6: Threat? Assume yes.
  - Outcome: Listed. Decisive criterion: genetic distinctness and reproductive isolation via triploid sterility.

  **Case 3: Flagship taxon (recent genomic work shows it is part of a cline)**
  - Step 0: Complete? Yes.
  - Step 1: Described? Yes, and currently listed.
  - Step 2: Distinctness? The genomic work shows it is part of a continuous cline. The type specimen is in the middle of the cline. This undermines distinctness. The Panel must assess: if the taxon is not morphologically or ecologically distinct from the rest of the cline, then distinctness is not established. The proposal may have initially claimed distinctness, but new evidence contradicts. The Panel must re-evaluate.
  - Step 3: Evolutionary Independence? If it is part of a cline, then there is gene flow and no independence. 
  - Without distinctness and independence, the taxon fails at Step 2 or 3.
  - Step 4: Value Judgment? The Panel must decide: should we delist? But the statute's purpose might be reinterpreted. For example, if the public values this form and it is threatened by habitat loss, the Panel might choose purpose (c) (protecting particular organisms). However, the type specimen being in the middle of the cline means the name might apply to the whole taxon, which is abundant. So listing the whole taxon is not warranted. Alternatively, the Panel might argue that the local population at the end of the cline is ecologically distinct and threatened. But the proposal says the type is in the middle, so the name may not apply to the end population. This is a taxonomic issue: the name might not correspond to the population we are protecting. This is a problem.
  - Outcome: The procedure would lead to delisting because the taxon is not distinct. However, the Panel could try to use Step 4: choose purpose (c) and argue that the population (even if not taxonomically distinct) deserves protection. But the Schedule protects by name, and the name may now be seen as part of a wider taxon. This might not hold up in court. The procedure forces a hard choice: delist and lose the flagship, or risk judicial review.

  **What the Procedure Cannot Do**:
  - It cannot list undescribed populations (shape v). The Panel must encourage description and note the gap in protection.
  - For asexual and selfing groups, the criteria for independence are less clear. The procedure uses stability and persistence, but these are hard to assess. The Panel must make a judgment call.
  - When the answer depends on the statutory purpose (e.g., in shape i or iii), the procedure forces an explicit value judgment. This is transparent but may be controversial. The procedure cannot resolve the underlying philosophical debate.
  - In cases of conflict, the weighting of evidence is subjective and may be inconsistent across panels. The written reasons must explain the weighting to mitigate this.
  - The provisional listing for incipient divergence is a stopgap; it may not prevent the loss of unique diversity if divergence stalls.

  **Where It Might Misfire**:
  - Over-listing: In hybridizing pairs (shape ii), if the Panel overvalues distinctness and undervalues gene flow, they may list taxa that are not independent.
  - Under-listing: In cases of incipient divergence (shape iii), if the Panel sets the bar too high for provisional listing, they may miss protecting evolving lineages.
  - Value judgments may be challenged in court as beyond the Panel's authority if not clearly tied to the statute.

  This procedure provides a structured, defensible framework, but it requires the Panel to be explicit about uncertainties and value choices.
answer: |-
  Below is a decision procedure designed for your Panel, incorporating statutory constraints, scientific rigor, legal defensibility, and explicit handling of your "five shapes." It prioritizes clarity, consistency, and transparency, with gates for rejection, value judgment hand-offs, conflict resolution rules, and templates for published reasons. The procedure is structured as a flowchart of sequential questions, with responsibilities assigned to the **Proposer** (external submitter), **Panel** (collective assessment), or **Specialist** (e.g., geneticist/ecologist on the Panel advising on technical issues).

  ---

  ### **Decision Procedure for Species Listing**  
  **Key Principles**:  
  - Burden of proof on the **Proposer**; evidence must be "sufficient" (reproducible, peer-reviewed, or from credible sources).  
  - **Gates** (hard stops): Failure at any gate ends the process with a "do not list" decision.  
  - **Value judgments** are explicitly flagged for Panel deliberation and recorded as policy choices.  
  - **Consistency**: Published reasons must cite the decisive criterion and specify what evidence would change the outcome.  

  #### **Question Sequence**  
  1. **Gate 1: Formal Description Check**  
     - **Question**: Is the taxon formally described with a validly published name and type specimen?  
     - **Sufficient answer**: Yes, with accessible type specimen and peer-reviewed description.  
     - **Who supplies**: Proposer (with museum/literature evidence).  
     - **Failure outcome**: **Stop. Do not list.** (Addresses *Shape v*: Undescribed populations are legally unlistable.)  

  2. **Gate 2: Threat Assessment**  
     - **Question**: Is there robust evidence of population decline, restricted range, or imminent threat?  
     - **Sufficient answer**: Quantitative data (e.g., IUCN criteria, population trends, habitat loss projections).  
     - **Who supplies**: Proposer (e.g., surveys, expert assessments).  
     - **Failure outcome**: **Stop. Do not list.** (Listing requires demonstrable conservation need.)  

  3. **Question 3: Distinctness Assessment**  
     - **Question**: Is the taxon diagnosably distinct from congeners/siblings?  
     - **Sufficient answer**: ≥1 line of evidence (morphology, genetics, ecology, behavior) shows fixed, stable differences.  
     - **Who assesses**: Panel (advised by relevant Specialist).  
     - **Special cases**:  
       - *Asexual/selfing taxa (Shape iv)*: Use genetic clusters (e.g., ≥5 fixed SNPs) + ecological divergence.  
       - *Hybridizing pairs (Shape ii)*: Distinctness requires diagnostic traits maintained in sympatry.  
     - **Failure outcome**: Proceed to *Gate 3* (not an immediate stop).  

  4. **Gate 3: Minimal Distinctness Gate**  
     - **Question**: Is there *any* evidence of distinctness?  
     - **Sufficient answer**: At least one line of evidence meets the bar in *Q3*.  
     - **Failure outcome**: **Stop. Do not list.** (No basis for separation.)  

  5. **Question 4: Evolutionary Independence Assessment**  
     - **Question**: Is the taxon on an independent evolutionary trajectory?  
     - **Sufficient answer**: Evidence of limited gene flow, reproductive isolation, or divergent selection.  
     - **Who assesses**: Panel (advised by geneticist/ecologist).  
     - **Conflict resolution rule**: If lines of evidence conflict (e.g., *Shape i*), use:  
       - **Hierarchy of evidence**: Genomics > morphology/ecology > single-gene data.  
       - **Weighting**: Prioritize evidence reflecting adaptive divergence (e.g., genes under selection).  
       - **Tiebreaker**: If conflict persists, proceed to *Value Judgment 1*.  
     - **Special cases**:  
       - *Incipient divergence (Shape iii)*: Proceed to *Q5*.  
       - *Hybridizing pairs (Shape ii)*: Independence requires hybrids are rare/unsuccessful in wild.  

  6. **Value Judgment 1: Purpose of Statute**  
     - **Trigger**: Inconclusive independence evidence (*Shape i/ii/iii*) OR irreconcilable conflict.  
     - **Question**: Should protection prioritize (a) evolutionary lineages, (b) ecological function, or (c) threat mitigation?  
     - **Process**: Panel deliberates and **records the choice as policy**, not science. Examples:  
       - Lineage focus: Require strong independence evidence.  
       - Ecological focus: Protect if distinct in function (e.g., keystone pollinator).  
       - Threat focus: Protect if highly threatened, even with weak divergence.  
     - **Output**: Proceed to *Q5* or *Q6* based on judgment.  

  7. **Question 5: Provisional Listing for Incipient Divergence**  
     - **Trigger**: Partial divergence with conservation urgency (*Shape iii*).  
     - **Question**: Is divergence likely irreversible without intervention?  
     - **Sufficient answer**: All of:  
       - (a) Distinctness established (*Q3*),  
       - (b) Active divergence drivers (e.g., selection, barriers),  
       - (c) Threat making extinction/reabsorption likely (*Gate 2*).  
     - **Review interval**: Set by Panel based on generation time:  
       - Microbes/insects: 5 years.  
       - Vertebrates/plants: 10–15 years.  
     - **Evidence for review**:  
       - *Divergence complete*: New reproductive isolation/genomic differentiation.  
       - *Stalled*: Gene flow increases or differentiation unchanged.  
     - **Outcome**: List provisionally; schedule review.  

  8. **Question 6: Final Listing Assessment**  
     - **Question**: Do benefits of listing outweigh risks (e.g., enforcement feasibility, unintended harm)?  
     - **Assesses**: Panel (advised by lawyer/ecologist).  
     - **Output**: List/do not list.  

  ---

  ### **Template for Published Reasons**  
  ```markdown
  **Taxon**: [Name]  
  **Proposal by**: [Organization]  
  **Decision**: [Listed/Not Listed/Provisionally Listed]  
  **Key Evidence**:  
  - Distinctness: [Summary of evidence; e.g., "Morphologically diagnosable but weak genomic support"].  
  - Independence: [Summary; e.g., "Strong assortative mating but hybrid fertility"].  
  - Threat: [Summary].  
  **Conflicts Resolved**: [e.g., "Genetic data conflicted with morphology; genomics prioritized due to selection signals"].  
  **Decisive Criterion**: [e.g., "Ecological distinctness under Value Judgment 1(b)"].  
  **What Would Change Decision**: [e.g., "Evidence of panmixia would delist"].  
  **Provisional Review**: [If applicable; e.g., "Review in 10 years for genomic divergence"].  
  ```  

  ---

  ### **Procedure Applied to Three Cases**  
  #### **Case 1: Host-Associated Moth**  
  - **Gate 1**: Passed (described).  
  - **Gate 2**: Passed (assume threat data).  
  - **Q3 (Distinctness)**: Passed. Morphology/ecology show two forms; genomic regions under selection support distinctness.  
  - **Q4 (Independence)**: Conflicting evidence. Assortative mating (90%) suggests isolation, but weak genome-wide differentiation and fertile hybrids indicate gene flow.  
    - **Conflict resolution**: Genomics (under selection) prioritized over weak genome-wide data → supports distinctness but not independence.  
    - **Value Judgment 1**: Panel chooses purpose (a) evolutionary lineages → independence not proven.  
    - **Q5 (Provisional)**: Not triggered (no recent divergence).  
  - **Outcome**: **Do not list**.  
  - **Published reason**: *Distinctness established via host-specific morphology and selected genes. Independence not met due to gene flow and hybrid fertility; purpose focused on lineages (Value Judgment 1a). Evidence of wild hybrid rarity would change outcome.*  

  #### **Case 2: Diploid/Tetraploid Plant**  
  - **Gate 1**: Passed.  
  - **Gate 2**: Passed.  
  - **Q3 (Distinctness)**: Passed. Ploidy difference is a fixed genetic trait.  
  - **Q4 (Independence)**: Conflicting evidence. Shared pollinator suggests gene flow, but sterile triploids indicate postzygotic isolation.  
    - **Conflict resolution**: Reproductive isolation prioritized (triploid sterility) → independence established.  
    - **Q6 (Feasibility)**: Passed (ploidy testable with microscopy).  
  - **Outcome**: **List**.  
  - **Published reason**: *Distinctness via ploidy; independence via triploid sterility. Decisive criterion: reproductive isolation. Evidence of frequent viable hybrids would delist.*  

  #### **Case 3: Flagship Taxon (Cline Population)**  
  - **Gate 1**: Passed (but type in cline center undermines distinctness).  
  - **Gate 2**: Passed (threatened by historical recovery focus).  
  - **Q3 (Distinctness)**: **Failed**. Genomic cline shows continuity; type specimen not at endpoint. No diagnostic traits.  
  - **Gate 3**: **Stop. Do not list.**  
  - **Value Judgment 1**: Not triggered (distinctness absent).  
  - **Outcome**: **Delist** (despite flagship status).  
  - **Published reason**: *Distinctness not established; taxon is part of a continuous cline with type in center. No evidence met Q3 threshold. Listing would require new diagnostic traits or redefinition of the taxon.*  
  - **What the procedure leaves open**: The Panel could pursue:  
    - Redefining the protected unit (e.g., a local ecotype) if statutorily allowable.  
    - Using other tools (e.g., habitat protection) without species listing.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Resolve all conflicts definitively**: When evidence is equally weighted (e.g., morphology vs. genomics), outcomes rely on Value Judgment 1.  
  2. **Handle undescribed taxa (Shape v)**: Gate 1 is absolute; undescribed populations cannot be listed.  
  3. **Asexual/selfing taxa (Shape iv)**:  
     - Independence is inferred (e.g., via genetic clusters), but "evolutionary trajectory" is ambiguous.  
     - Value Judgment 1 is often needed to prioritize ecology (e.g., "protect unique soil microbe function").  
  4. **Hybridizing pairs (Shape ii)**: If hybrids are fertile but distinct, listing risks criminalizing natural processes. The procedure errs toward non-listing unless reproductive isolation is proven.  
  5. **Incipient divergence (Shape iii)**: Provisional listing depends on Panel’s threat assessment; it may overprotect ephemeral races or underprotect nascent species.  
  6. **Statutory purpose conflicts**: The procedure forces explicit value judgments but cannot dictate which purpose (a/b/c) should "win" in law. Courts may overrule.  

  ### **Where It Will Misfire**  
  - **Over-listing**: If Value Judgment 1 prioritizes threat (c) over science, it may protect non-distinct populations.  
  - **Under-listing**: Genetically vague taxa (e.g., microbes) may fail if distinctness standards are too strict.  
  - **Flagship cases**: As in Case 3, the procedure will delist cherished taxa lacking evidence, inviting public backlash.  
  - **Asexual taxa**: Genetic distinctness thresholds may not reflect ecological reality.  

  ---

  **Final Advice**: This procedure ensures transparency and consistency but requires the Panel to defend value judgments rigorously. For asexual/hybridizing cases, develop taxon-specific guidelines (e.g., fungi vs. plants). Update the Schedule annually with published reasons to preempt legal challenges. When evidence is weak, reject or use provisional listings—never force a scientific certainty where none exists.
