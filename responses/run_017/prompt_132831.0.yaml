  ### The Procedure  
  **Ordered gates for certifying a candidate policy. Fail any gate → reject candidate, ship default (always D). Gates requiring judgment → escalate to you (Pricing-Agent Lead) or Compliance.**  

  1. **Gate 1: Termination and Validity**  
     - **What:** Run the candidate policy against 100 randomly generated opponent programs (within step limits) and 10 historical opponent programs.  
     - **Pass:** No timeouts, crashes, or invalid outputs (must output only C or D). Must complete all runs within 4 hours of analyst time.  
     - **Stop if fail:** Reject candidate. Use default.  
     - **Judgment:** None (mechanical).  

  2. **Gate 2: Safety Against Always-D**  
     - **What:** Test against an opponent that always defects (D).  
     - **Pass:** Candidate outputs D.  
     - **Stop if fail:** Reject candidate. Critical failure.  
     - **Judgment:** None (mechanical).  

  3. **Gate 3: Robustness to Trivial Changes**  
     - **What:** Apply semantics-preserving transformations (whitespace changes, variable renaming, dead-code insertion) to 5 known opponent programs (e.g., always-C, always-D, your own candidate). Test candidate against originals and transformed versions.  
     - **Pass:** Output consistency (e.g., if it cooperates with always-C, it must cooperate with transformed always-C).  
     - **Stop if fail:** Reject candidate.  
     - **Judgment:** Analysts define transformations; you approve the list.  

  4. **Gate 4: Self-Cooperation**  
     - **What:** Test candidate against an exact copy of itself.  
     - **Pass:** Outputs C.  
     - **Stop if fail:** Reject candidate. Non-negotiable for mutual gains.  
     - **Judgment:** None (mechanical).  

  5. **Gate 5: Adversarial Simulation Defense**  
     - **What:** Test against two adversarial opponents:  
       - **Adversary A:** Outputs D if your agent outputs C (via simulation); else C.  
       - **Adversary B:** Outputs D if your agent outputs C within steps; else C.  
     - **Pass:** Candidate outputs D against both adversaries.  
     - **Stop if fail:** Reject candidate. Risk of exploitation too high.  
     - **Judgment:** None (mechanical).  

  6. **Gate 6: Performance vs. Common Strategies**  
     - **What:** Test against a predefined set of 6 strategies (see "My Call" for list).  
     - **Pass:** Two conditions:  
       - Never outputs C when opponent outputs D (no exploitation).  
       - Outputs C against "cooperative" opponents (e.g., always-C, mirror-match).  
     - **Stop if fail:** Reject candidate.  
     - **Judgment:** You define the opponent set and which strategies are "cooperative."  

  7. **Gate 7: Step-Budget Safety**  
     - **What:** Measure steps used against all opponents from Gate 6.  
     - **Pass:** ≤90M steps (90% of budget) in 95% of tests.  
     - **Stop if fail:** Reject candidate. Risk of timeout → accidental D.  
     - **Judgment:** You set the threshold (default: 95%).  

  8. **Gate 8: Compliance Check**  
     - **What:** Compliance officer reviews if candidate uses banned signals (e.g., intent notes, covert channels).  
     - **Pass:** Compliance signs off.  
     - **Stop if fail:** Reject candidate. Legal risk.  
     - **Judgment:** Compliance’s discretion. Escalate to you if ambiguous.  

  ---  
  ### Why Each Gate Is There  
  - **Gate 1:** Basic reliability. Unstable code risks timeout (→ D) or rules violations.  
  - **Gate 2:** Avoids catastrophic loss (€0 vs. €700K). Core prisoner’s dilemma safety.  
  - **Gate 3:** Real opponents obfuscate; failure here means missed opportunities (€400K → €120K).  
  - **Gate 4:** Self-cooperation is the foundation of program equilibrium. No self-C → no mutual gains.  
  - **Gate 5:** Blocks adversaries simulating your agent to trick cooperation. Theory: programs can be weaponized.  
  - **Gate 6:** Ensures robustness against historical/frequent strategies. Maximizes €400K opportunities.  
  - **Gate 7:** Step overruns default to D, killing cooperation. Budget is your bottleneck.  
  - **Gate 8:** Avoids penalties for "signalling" via intent notes or code. Legal > game theory.  

  ---  
  ### Three Runs  
  **Candidate 1: Mirror-Match**  
  - **Gate 1-2:** Passes (deterministic; outputs D vs. always-D).  
  - **Gate 3:** **FAILS.** Minor code changes (e.g., renaming variables) cause it to output D against behaviorally identical opponents. Costs €280K/round (missed €400K → €120K).  
  - **Stop:** Reject. Ship default.  

  **Candidate 2: Proof-Search Handshake**  
  - **Gate 1-4:** Passes (self-cooperation works if proof is short).  
  - **Gate 5:** Passes (outputs D against adversaries; proof fails under circularity).  
  - **Gate 6:** **FAILS.** Against always-C: outputs C (costs €300K/round: €400K vs. potential €700K). Against proof-search opponents: 10:1 step-budget asymmetry causes timeouts → D, missing €400K opportunities.  
  - **Stop:** Reject. Too costly vs. always-C; unstable with asymmetric budgets.  

  **Candidate 3: Simulation + Intent Note**  
  - **Gate 1-4:** Passes (self-cooperation works with loop detection).  
  - **Gate 5:** **FAILS.** Outputs C against Adversary A/B due to loop detection "false positives" (simulation exits early, showing C). Risk: in variants, this could be exploited for €0 loss.  
  - **Gate 8:** **ESCALATE.** Uses intent note (banned by legal). Compliance likely rejects.  
  - **Stop:** Reject. Fails Gate 5; legal risk.  

  **Verdict:** All candidates rejected. Ship default (D).  

  ---  
  ### What It Can’t Tell You  
  1. **Obfuscated opponents:** Heavy code obfuscation may bypass checks (e.g., Gate 3 only handles trivial changes).  
  2. **Adversarial designers:** If opponents know your procedure, they can craft code to hack your agent (e.g., force timeouts, fake proofs).  
  3. **Beyond binary choices:** Useless if the game adds options (e.g., partial cooperation).  
  4. **Multi-agent games:** Fails for >2 players (e.g., coalitions).  
  5. **Unforeseen strategies:** Novel opponents outside Gate 6’s test set may exploit you.  
  6. **Step-budget attacks:** Malicious opponents could waste your steps (e.g., infinite loops) to force D.  

  ---  
  ### My Call  
  **Set these parameters before running any candidate. Defaults provided:**  
  1. **Gate 3 transformations:** Whitespace, renaming, dead code, logic-preserving reordering. *Default: Use all.*  
  2. **Gate 6 opponent set & rules:**  
     - Opponents: always-C, always-D, mirror-match, proof-search, simulation-based, historical (if any).  
     - Required actions:  
       - Output **D** vs. always-C (exploit €700K).  
       - Output **C** vs. mirror-match (cooperate for €400K).  
       - Output **D** vs. always-D (safety).  
       - No exploit (C vs. opponent’s D) in any test.  
     - *Default: Use this set and rules.*  
  3. **Gate 7 thresholds:**  
     - Max step usage: 90M (90% of budget).  
     - Pass threshold: ≤90M in 95% of tests.  
     - *Default: 95%.*  
  4. **Gate 8 compliance rules:** Ban all use of intent notes. *Default: Ban.*  

  **Defaults are risk-averse:** Prioritizes safety (avoid €0) and legal compliance over cooperation opportunities. Adjust if your appetite for €400K gains outweighs exploitation/legal risks.
