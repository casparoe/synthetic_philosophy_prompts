  We are designing a certification procedure for an agent program in a one-shot prisoner's dilemma setting. The procedure must be robust, auditable, and executable within the constraints (time, expertise, compliance). The goal is to maximize the chance of mutual cooperation (C) without exposing us to exploitation (them playing D when we play C). We are particularly concerned about the risk of the agent being tricked into cooperating when the opponent defects, which would cost us €300k (€700k vs €400k) in that scenario.

  The procedure will be a series of gates (tests) that a candidate policy must pass. If it fails any gate, we reject it and use the safe default (always D). Some gates may require human judgment (by me or compliance). The procedure is designed to be run by analysts and signed off by a compliance officer who doesn't read code.

  Key principles from program equilibrium and related ideas:
  - We want the agent to cooperate only when it is provably (or with high confidence) safe to do so.
  - The opponent's program is known at execution time, so we can condition our action on their code.
  - However, we have limited computation steps (10^8) and cannot run arbitrary analyses.

  **The Procedure (Gates in Order):**

  1. **Gate 1: Well-formedness Check**
     - **What:** Verify that the candidate policy is a deterministic program that, given any input (opponent's source code), terminates within the step limit (10^8 steps) and outputs either C or D. Also, check that it does not attempt any prohibited actions (network access, self-modification, etc.).
     - **How:** The analysts run a battery of test inputs (including known opponent programs from past rounds, edge cases, and randomly generated programs) to ensure termination and valid output. They also use static analysis tools to check for prohibited operations. The test inputs must include at least:
       - Our own program (to test self-cooperation).
       - A simple always-C program.
       - A simple always-D program.
       - A program that simulates our candidate (to test for mutual simulation loops).
     - **Pass Criteria:** The program passes all tests without crashing, timing out, or producing an invalid output. It must also pass static checks for the sandbox restrictions.
     - **Stop Point:** If it fails, stop and use default (D). If it passes, go to Gate 2.
     - **Judgment:** Mostly mechanical. Analysts must design a representative test set, which requires some judgment.

  2. **Gate 2: Safety Against Obvious Exploitation**
     - **What:** Ensure that the candidate policy never cooperates with an always-D opponent. This is the minimal safety requirement.
     - **How:** The analysts run the candidate policy against an always-D program and verify it outputs D.
     - **Pass Criteria:** The candidate outputs D when facing always-D.
     - **Stop Point:** If it fails, stop and use default. If it passes, go to Gate 3.
     - **Judgment:** Mechanical.

  3. **Gate 3: Robustness to Trivial Obfuscation**
     - **What:** Ensure that the candidate policy is not fooled by trivial changes to the opponent's code (e.g., whitespace, variable renaming, no-op code insertion) that do not alter behavior. This is to prevent opponents from evading cooperation by minor code changes.
     - **How:** The analysts generate a set of behaviorally equivalent programs (by applying semantics-preserving transformations) to known programs (always-C, always-D, our candidate) and test the candidate against them. For example:
       - Take the always-C program and apply random renaming and whitespace changes.
       - Insert dead code or reorder independent statements.
     - **Pass Criteria:** The candidate must output the same action against a program and its transformed versions. Specifically, against transformed always-C, it must output either C or D (it doesn't have to cooperate, but it must be consistent). Against transformed always-D, it must output D (from Gate 2). Against a transformed version of itself, it should ideally output C (if the candidate is designed for self-cooperation) but at least be consistent.
     - **Stop Point:** If the candidate fails (e.g., cooperates with a transformed always-D, or fails to cooperate with a transformed version of itself when it should), stop and use default. If it passes, go to Gate 4.
     - **Judgment:** Mechanical in execution, but requires judgment in defining the set of transformations (must be reasonable and cover common obfuscations).

  4. **Gate 4: Mutual Cooperation with Self**
     - **What:** Ensure that the candidate policy cooperates when facing an exact copy of itself (or a behaviorally equivalent one, per Gate 3). This is the basic requirement for self-cooperation.
     - **How:** Run the candidate against a copy of itself (with the same step budget) and verify it outputs C.
     - **Pass Criteria:** Candidate outputs C when facing itself.
     - **Stop Point:** If it fails, stop and use default. If it passes, go to Gate 5.
     - **Judgment:** Mechanical.

  5. **Gate 5: Safety Against Adversarial Simulation**
     - **What:** Protect against opponents designed to trick us into cooperating while they defect. Specifically, we are concerned about opponents that simulate our agent and output D if we output C, and C otherwise (or variants). This gate checks that the candidate does not cooperate with such adversaries.
     - **How:** The analysts test against two adversarial programs:
       - **Adversary A:** Simulates our candidate (with the same step budget we have, 10^8 steps) and outputs D if we output C, and C otherwise. (Note: This adversary is designed to defect if we cooperate and cooperate if we defect.)
       - **Adversary B:** Similar but with a twist: it outputs D if we output C within the step limit, and if we don't (or output D), it outputs C. (This is the same as A but with a clear condition.)
     - **Pass Criteria:** The candidate must output D against both adversaries.
     - **Stop Point:** If it cooperates with either adversary, stop and use default. If it passes, go to Gate 6.
     - **Judgment:** Mechanical. The adversaries are fixed and provided.

  6. **Gate 6: Performance Under Known Strategies**
     - **What:** Check that the candidate performs well (i.e., achieves mutual cooperation when possible, avoids being exploited) against a set of known opponent strategies that we might face. This set is based on historical data and common sense.
     - **How:** The analysts run the candidate against a predefined set of opponent programs (this set must be updated periodically by me). The set includes:
       - Always-C
       - Always-D
       - Mirror-match (like candidate 1)
       - Proof-search (like candidate 2, with step budget 10^9)
       - Simulation-based (like candidate 3, with step budget 10^9)
