prompt: |-
  Hey — I need help designing one session of my upper-level undergrad ethics seminar. 22 students, 80 minutes, one whiteboard plus a projector, and I can bring in a couple of bags of those tiny chocolate bars to use as actual stakes. We'll have already done a couple of weeks on distributive ethics generally, but no lecture up front on this topic and I don't want them hearing the name of the view or of the objection until after the thing is over.

  Here's what I want them to walk out having felt, not having been told. First, that "extra benefits matter more the worse off the recipient is" has a strong grip on them — I want them to discover that they themselves keep voting that way. Second, that this same move, followed out, commits them to approving a change where you take from the better off and give the benefit to nobody at all, and that this isn't a weird extra bullet they can bite separately but the very same feature of the view doing the work it was hired to do. Third, and this is the bit I care most about: I've got a half-formed distinction I want the activity to test, between what I've been calling benefit-priority and level-priority. Benefit-priority is the claim that a given increment of benefit counts for more in the overall evaluation when it goes to someone worse off; level-priority is the claim about how much someone's final level contributes, the thing that keeps getting smaller as the level rises. I think the first one on its own is compatible with never preferring a change that makes nobody better off, and the second one isn't, and that most people run them together. If that distinction is fake or collapses under pressure, say so and give me something better to build on.

  So: design me a runnable thing. My rough idea is a sequence of anonymous pairwise votes over distributions of chocolate among anonymous recipients, run by show of hands or slips of paper, where each individual vote looks obviously right to someone with priority-friendly instincts, and where the set of votes, chained together, adds up to a verdict in the final round that nobody saw coming — the levelling-down one. And I want that final round to be genuinely executed: if the class majority votes to level down, chocolate is really taken from the better-off pile and given to no one (I'll eat it, or it goes back in the bag, whatever is more obnoxious). That's the moment where the idea shows up in what happens instead of in what I say afterwards, and I think the real stakes are what make it land. Tell me which pairings to put up, in what order, and why each one does the work you think it does.

  Two things I'd like folded in if they fit. One: an extra round where the levelling down is arranged so that the person who loses is picked by a random draw only after the vote, so that at the moment of voting there's no identifiable loser. I want to know whether their discomfort survives that, since I suspect their objection is secretly a person-affecting one and they don't know it. Two: something that forces the question of whether what bothers them is that the levelled-down outcome would be *better*, or only that there'd be no reason to bring it about — I'd rather stage that as a choice they have to make than as a distinction I announce.

  Then the debrief: map specific moments in the activity onto the parts of the argument, say what will predictably go wrong the first time I run it (I'm guessing at least: people voting self-interestedly because they might be a recipient, someone spotting the chain early and spoiling it, the class's majority votes not adding up to any consistent ranking at all, and the sheer silliness of destroying chocolate in front of adults), and tell me how to handle each. Also be honest about which part of this you can't get them to feel: my guess is that the activity can show them the entailment but can't make them feel why anyone would take the entailment to be a *reduction* of the view rather than a cost worth paying, and that I'll have to supply that myself. Say whether you agree and what else is missing.

  Write it as continuous prose, like an email — no headings, no bullet points, no bold, no tables, and don't number the sections. And please dont bother with references or a reading list, I'll add those myself.
reasoning: |-
  Okay, let me tackle this ethics seminar design request. The professor wants an 80-minute session for 22 undergrads that makes three philosophical points experientially through chocolate distributions, with specific constraints: no prior lecture on the topic, anonymous voting with real chocolate stakes, and a climactic leveling-down moment where chocolate gets destroyed.

  Hmm, the core challenge is designing a voting sequence that feels intuitive at each step but accumulates to a shocking conclusion. I need to consider:
  - Starting with binary choices that subtly establish benefit-priority (e.g., giving chocolate to worse-off recipients)
  - Transitioning toward choices where level-priority emerges (e.g., redistributing from better-off to worse-off)
  - Building toward the leveling-down paradox where taking from the better-off helps no one
  - Including the random-loser variant to test person-affecting intuitions
  - Creating a final choice exposing the distinction between outcome evaluation vs. action reasons

  For the flow, I imagine:
  1. Four initial voting rounds with different recipient groups (A/B/C) to establish baseline priority intuitions
  2. A fifth round introducing leveling-down against a fixed alternative
  3. The random-loser variant to isolate discomfort
  4. A sixth round forcing the evaluation/reason distinction
  5. Debrief mapping votes to concepts without naming theories

  Potential pitfalls I should address:
  - Students might vote selfishly if they suspect they're recipients → solution: emphasize anonymity and use large groups
  - Someone might deduce the pattern early → prepare distraction moves
  - Inconsistent voting patterns → design choices with clear rationales
  - Chocolate destruction feeling silly → frame it as philosophical demonstration

  The debrief should connect each vote to the underlying concepts without terminology, letting students reconstruct the argument. I agree the activity can't make them feel why leveling-down isn't automatically a reductio - that'll require professor input later.

  Key structural considerations:
  - Chocolate quantities must be precisely calibrated to make choices compelling but not obvious
  - Recipient groups should feel distinct but comparable
  - The random-loser mechanism needs careful explanation
  - The final "no reason to act" choice must contrast clearly with evaluation

  I'll avoid any tables or bullet points as requested, weaving all elements into a cohesive narrative. The professor's half-formed benefit/level-priority distinction will be tested through the sequence - if it collapses, the activity should reveal that organically.
answer: |-
  Here’s how to run the session. Bring the chocolates, split them into small piles beforehand (I’ll specify quantities below), and label three hypothetical recipient groups **A**, **B**, and **C** on the board. Stress that these are abstract groups—no student is A, B, or C—and votes are anonymous (use slips of paper collected in a bowl to preserve secrecy and reduce peer pressure). Start by saying: "Today we’re using chocolate to model how benefits affect wellbeing. Each vote is a simple choice between two distributions. Vote for the one you think is *morally better*, not what you’d do as a dictator. The majority vote decides, and we’ll enact the winning distribution at the end." This frames it as evaluation, not decision-making.  

  Begin with three foundational votes to entrench "benefits to the worse off matter more." For each, display the distributions side by side:  

  1.  **A: 1 bar vs. B: 1 bar** → Both groups start equal. Result: Tie. (Point out fairness; no priority yet.)  
  2.  **A: 1 bar vs. B: 2 bars** → B is better off. Most will vote for **A: 1 bar** (giving to the worse-off A). Enact this mentally.  
  3.  **B: 2 bars vs. C: 2 bars** → Now add C, equally well off as B. Result: Tie. (Reinforces that equality alone isn’t the driver.)  
  4.  **A: 1 bar vs. C: 3 bars** → A is worse off than C. Most will vote for **A: 1 bar** (prioritizing A’s gain over C’s larger gain).  

  These votes build the intuition: giving to the worse off feels compelling even when it means forgoing greater total gains. Now pivot toward leveling down. Introduce a new distribution where everyone’s level matters:  

  5.  **Option X: A: 1 bar, B: 2 bars, C: 3 bars**  
      **Option Y: A: 1 bar, B: 1 bar, C: 1 bar**  
      Here, Y levels down B and C to A’s level. Most will vote for **X** (it has greater total and doesn’t gratuitously harm B/C). But note: if benefit-priority were their *only* principle, Y might seem slightly better for A (their gain matters more!). Yet they reject Y—suggesting absolute levels (or avoiding harm) also factor in.  

  Now force the leveling-down implication. Remind them they’ve consistently prioritized gains to the worse off. Present:  

  6.  **Option X (status quo): A: 1, B: 2, C: 3**  
      **Option Z: A: 1, B: 2, C: 2**  
      C is worse off in Z (3→2), but *no one gains*—C loses a bar, and it vanishes. If benefit-priority dominates, Z should win: C’s loss "matters less" because they were better off, so reducing inequality might seem better overall. But intuitively, Z feels perverse. *Execute the vote.* If Z wins (it might!), physically take a chocolate from C’s pile and discard it. The shock makes the point: their principle just approved making someone worse off for no one’s benefit.  

  Fold in your two extras:  

  -   **Random loser variant:** Before vote 6, add: "Imagine C is one *specific* person, but we don’t know who yet. After voting, we’ll draw a name to decide who ‘is’ C." Run the vote. If Z still wins, draw a "C" from a hat (use student names—but stress it’s symbolic). Discard C’s chocolate. Observe discomfort: if it persists despite no identifiable victim, it suggests their unease isn’t just about harming a *particular* person but about the impersonal structure of the outcome.  
  -   **Evaluation vs. Reason:** After enacting Z (if it wins), pose: "Suppose we’re at X (A:1,B:2,C:3). Would moving to Z (A:1,B:2,C:2) make the world *better*? Or is it just that there’s *no reason* to do it?" Take a quick vote. This forces the distinction: if they say "not better," they’re rejecting that Z is an improvement (denying level-priority’s full force). If they say "no reason," they might still think Z is better but unmotivated to act (exposing a gap between evaluation and action).  

  **Debrief strategy:** Start by asking what felt jarring. Trace back: "In vote 4, you chose A’s small gain over C’s larger one. Why? Because A was worse off, so their gain mattered more, right?" Nod to their earlier votes. Then: "But in vote 6, that same idea—that benefits matter less when you’re better off—meant losing C’s bar *improved* things. Did it?" Highlight the tension: their intuition pulled them both ways. Introduce your terms *only now*: "What if we tease apart two ideas? One: a chocolate bar helps more if you’re worse off (*benefit-priority*). Two: higher overall levels are ‘dimmer’ in our moral vision (*level-priority*). The first might not demand leveling down; the second does. Did your votes feel like one, or both?" Let them sit with the ambiguity.  

  **Predictable pitfalls & fixes:**  
  -   **Self-interested voting:** Likely if they suspect they’ll get chocolate. *Preempt this:* Emphasize anonymity and that groups are hypothetical. Joke: "If you’re voting based on hoping you’re C, you’ve missed the point."  
  -   **Early spoilers:** A sharp student might see the chain. *Mitigate:* Use multiple groups (A/B/C) to obscure the path. If someone blurts "This is leading to leveling down!", smile: "Interesting! Keep it to yourself—let others experience the puzzle."  
  -   **Inconsistent majorities:** Some votes may not align (e.g., they reject Z fiercely). *Use it:* "Fascinating! Why did this vote *not* follow your earlier pattern?" This exposes nuance—e.g., they might reject harming anyone without gain, even if consistent with benefit-priority.  
  -   **Silliness of destroying chocolate:** Lean in. When you discard it, deadpan: "Philosophy demands sacrifice." The absurdity underscores the point—doing this for real makes the abstraction visceral.  
  -   **Mixed voting patterns:** If votes don’t chain neatly, focus on the *disconnect* between early and late choices. Ask: "When did your gut rebel? Why there?"  

  **What the activity can’t do:** You’re right—it can make them *feel* the entailment but not why someone might embrace leveling down as a feature, not a bug. The activity forces the "wait, that’s absurd!" reaction, but the debrief must gently suggest: "For strict prioritarians, Z *is* better—less inequality with no real loss, since C’s loss ‘counts less’. If that repels you, maybe benefit-priority isn’t your whole story." This sets up future lectures on competing theories (e.g., telic vs. deontic egalitarianism).  

  **Missing piece:** The activity won’t resolve whether benefit-priority *alone* avoids leveling down—it only highlights that people’s intuitions likely blend the two priorities. To test your half-formed distinction, poll them privately at the end: "Could a small gain to the worst off *always* outweigh larger gains to the better off, *without* implying that leveling down is better?" If they say yes, your distinction holds for them. If they squirm, the collapse is intuitive.  

  Run it tight: 5 min setup, 40 min voting (6 votes, ~6 min each), 20 min debrief. The chocolates are the hook; the dissonance is the teacher. Good luck—it’s gloriously obnoxious when the chocolate vanishes.
