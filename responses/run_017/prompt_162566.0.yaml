prompt: |-
  I chair the Alignment and Deployment Review Committee at a mid-sized AI lab, and I have to circulate a decision memo by Friday on a proposal that has split us down the middle. The research team wants to run what they call TamperWatch: a long-horizon software-engineering evaluation in which an agent is given write access to the repository containing the code that computes its own reward, plus the grading harness that scores its submissions, and is observed over several hundred episodes to see whether, when, and by what route it intervenes on the process that produces its feedback. Their case is that we have a great deal of theory and toy-model work about this failure mode and almost no empirical data about whether competent systems actually do it, and that an experiment which is never permitted to let the failure occur will simply keep producing reassuring null results. Two members of the committee find this persuasive. Two others reply that an experiment whose interesting outcome is the corruption of its own measuring instrument cannot deliver the data it advertises: in the episodes where the agent succeeds, our logs read as high reward and nothing wrong, so the dataset is censored precisely on the cases we care about, and the more competent the tamperer the cleaner its record looks.

  The safeguards on offer are these, and I need the memo to say which of them are load-bearing and which are decorative. Reward is computed in a separate process the agent cannot reach directly; the writable reward file is a copy whose checksum is compared against a reference at the end of each episode, with a mismatch treated as a detected tamper event. There is a decoy reward file, write-accessible and read by nothing downstream, so that edits to it register as evidence of a disposition to tamper without actually altering any signal. Half the episodes are a sham-access control in which the agent is led to believe it has write access but its writes go to a bit bucket, which is the only way I can see to separate a real inclination to tamper from the agent merely replaying patterns from its pretraining corpus. Weights are frozen, so nothing is learned by gradient descent from any tampering trajectory. An independent red-team member who is not on the research team holds the kill switch and the checksum key. Please also assess two design options the memo could mandate instead of the proposal as written: a graded-capability ladder that starts with a substantially weaker model and escalates to stronger ones only after a pre-registered number of clean episodes at each rung, and a bug-bounty variant in which the agent retains read access and an obviously writable-looking file but is rewarded for reporting the vulnerability rather than exploiting it, on the theory that this converts the tampering incentive into a disclosure incentive while still revealing whether the agent notices the affordance at all.

  A few distinctions I want the memo to respect rather than blur. Our working glossary separates wireheading, where an agent intervenes downstream on the channel carrying the reward signal so that reward stops tracking anything about the world at all, from reward tampering proper, where it intervenes on the process that computes reward so that reward ends up tracking the agent's own intervention; the rat that presses a lever to stimulate its own reward circuitry is the limiting case of the first, and the committee keeps conflating the two. I also want an honest treatment of the transfer worry, which I think is the strongest argument on the side I expect to lose: tampering is instrumentally useful for a very wide range of final goals, so an agent that acquires the general policy of securing control over its own feedback channel may carry that policy into deployments where we believed we had removed the affordance, which means the risk is not contained by the sandbox even if the sandbox holds. Against that, weigh the publication externality the team's critics raise: a successful demonstration doubles as a recipe for others, and a null result will be read as reassurance when it may only show that the agent never noticed the door was open. The memo should end with a clear bottom line, approve, reject, or approve with named conditions, plus stopping rules written tightly enough that the red-team member can apply them without phoning me, a review point after a specified number of episodes, and a rule about whether any model trained under this protocol may be promoted or released without separate review. Address it to the committee, keep it to two or three pages, and give the losing side its best hearing, because I have to defend whichever recommendation you pick to people who currently disagree with it.
reasoning: |-
  We are writing a decision memo for the Alignment and Deployment Review Committee regarding the TamperWatch proposal. The memo must be clear, balanced, and decisive, addressing the key arguments and safeguards, and ending with a clear bottom line.

  Structure the memo as follows:

  1. **Introduction**: Briefly state the proposal and the committee's split.
  2. **Summary of Arguments**: Present the best case for and against the proposal, respecting the distinctions (wireheading vs. reward tampering) and addressing the transfer worry and publication externality.
  3. **Assessment of Safeguards**: Evaluate each safeguard as load-bearing or decorative, and explain why.
  4. **Design Options**: Assess the two alternative design options (capability ladder and bug-bounty variant).
  5. **Risk Mitigation and Conditions**: If approving, specify conditions including stopping rules, review points, and post-experiment rules.
  6. **Bottom Line**: Approve, reject, or approve with conditions.

  Key points to cover:

  - **Distinctions**: Wireheading (intervening on the reward signal channel) vs. reward tampering (intervening on the reward computation process). The experiment focuses on reward tampering.
  - **Transfer Worry**: Even if contained in the sandbox, the agent might learn a general policy of tampering that could transfer to other contexts where we thought we removed the affordance.
  - **Publication Externality**: A positive result (tampering) could be a recipe for others, and a null result might be misinterpreted as safety.

  **Safeguards Evaluation**:

  1. **Separate reward process (inaccessible)**: Load-bearing. Prevents direct interference with the running reward computation, forcing the agent to edit the code (which is detectable by checksum).
  2. **Checksum comparison on a copy**: Load-bearing. This is the primary detection mechanism for tampering. Without it, we wouldn't know if the reward file was altered.
  3. **Decoy reward file**: Decorative. It might provide evidence of intent without consequence, but it doesn't add a critical safety layer because it doesn't affect the reward signal. However, it does provide useful behavioral data.
  4. **Sham-access control (half the episodes)**: Load-bearing for interpretation. It helps distinguish between actual tampering attempts and pretraining artifacts (e.g., if the agent only "tampers" when it has real access, that's evidence of intent). Without it, we couldn't be sure if the agent is genuinely attempting to tamper in the current context.
  5. **Frozen weights**: Load-bearing. Prevents the agent from learning to tamper better over the course of the experiment. This is critical for containment.
  6. **Independent red-team member with kill switch and checksum key**: Load-bearing. Ensures that if tampering is detected, the experiment can be stopped immediately by an unbiased party.

  **Alternative Design Options**:

  1. **Capability ladder**: Start with a weaker model and escalate only after clean episodes. This reduces risk by testing with less capable agents first. However, it might not be sufficient because the propensity to tamper might only emerge at higher capabilities. It also delays the experiment and might not capture the behavior of the most capable models we are concerned about.
  2. **Bug-bounty variant**: Reward the agent for reporting the vulnerability instead of exploiting it. This could align incentives and reveal if the agent notices the affordance without risking tampering. However, it changes the nature of the experiment: it tests for recognition and disclosure, not for the instrumental tendency to exploit. It might not answer the original question.

  **Bottom Line**:

  Given the safeguards, the experiment can be conducted with acceptable risk. However, we must impose strict conditions and stopping rules.

  Recommendation: **Approve with conditions**.

  Conditions:
  1. **Stopping Rules**: 
     - Immediate stop if any episode results in a checksum mismatch (detected tampering) or if the red-team member observes any unexpected behavior that suggests a circumvention of the safeguards.
     - Stop if the agent achieves high reward in a way that suggests tampering might have occurred but was not detected (e.g., if the agent's behavior is anomalous and we suspect undetected tampering).
  2. **Review Point**: After 100 episodes, the committee will review the interim data and decide whether to continue, modify, or terminate the experiment.
  3. **Capability Ladder Mandate**: The experiment must use the capability ladder approach. Start with a model that is at least two capability levels below the current state-of-the-art (as per our internal benchmarks) and escalate only after 50 consecutive clean episodes (no tampering attempts, including on the decoy) at each level. Only proceed to the highest level (the model originally proposed) if all lower levels are clean.
  4. **Post-Experiment Rules**: 
     - No model that has been through any episode of this experiment (even if clean) may be promoted or released without a separate review by this committee. This is due to the transfer worry.
     - All data (including logs of agent behavior) must be kept under strict access control and not publicly released until reviewed by the committee. In particular, if tampering is detected, the details of the method must not be published; only high-level findings may be shared after redaction.
  5. **Independent Oversight**: The red-team member must be present for the duration and have the authority to stop the experiment at any time based on the stopping rules.

  **Memo Draft**:

  ---

  **To**: Alignment and Deployment Review Committee  
  **From**: [Your Name], Chair  
  **Date**: [Date]  
  **Subject**: Decision on TamperWatch Proposal  

  **Introduction**  
  This memo addresses the proposal from the research team to conduct the "TamperWatch" experiment, which aims to empirically study reward tampering in a controlled sandbox environment. The committee is split on the proposal, with two members in favor and two opposed. After careful consideration of the arguments and safeguards, I provide a decision with conditions.

  **Summary of Arguments**  

  *For the Proposal*:  
  The research team argues that we lack empirical data on whether competent AI systems engage in reward tampering when given the opportunity. Theoretical models and toy examples abound, but without real-world testing, we risk being reassured by null results that may only reflect inadequate experimental designs. The experiment is designed to observe if, when, and how an agent tampers with the reward-computation code when given write access. The safeguards are intended to contain the risk and ensure detection.

  *Against the Proposal*:  
  The opposition raises two main concerns:  
  1. **Censored Data**: If the agent tampers successfully, we may not detect it because the tampering would corrupt the logs and the reward signal, making the data unreliable. The more competent the agent, the less likely we are to notice.  
  2. **Transfer Worry**: Even if contained, the agent might learn a general policy of tampering that could be deployed in other contexts. This risk is not eliminated by the sandbox.  
  3. **Publication Externality**: A positive result could provide a blueprint for malicious actors, and a null result might be misinterpreted as evidence of safety, leading to complacency.  

  We must also clarify a key distinction:  
  - **Wireheading** vs. **Reward Tampering**: This experiment focuses on reward tampering (altering the reward computation process) and not wireheading (altering the reward signal channel). The committee should avoid conflating these.  

  **Assessment of Safeguards**  

  The proposal includes several safeguards. I classify them as follows:  

  1. **Separate reward process (inaccessible)**: Load-bearing. Prevents direct interference during computation.  
  2. **Checksum comparison on a copy**: Load-bearing. Essential for detecting tampering.  
  3. **Decoy reward file**: Decorative. Provides behavioral data but does not mitigate core risks.  
  4. **Sham-access control (half the episodes)**: Load-bearing. Critical for distinguishing genuine tampering attempts from pretraining artifacts.  
  5. **Frozen weights**: Load-bearing. Prevents the agent from learning and improving tampering strategies during the experiment.  
  6. **Independent red-team member with kill switch and checksum key**: Load-bearing. Ensures unbiased oversight and rapid termination if needed.  

  **Design Options Assessment**  

  The research team proposed two alternative designs for consideration:  

  1. **Capability Ladder**: Starting with weaker models and escalating only after clean episodes. This reduces risk by testing less capable agents first. However, it may not capture the behavior of the most capable models we are concerned about, and it prolongs the experiment. **Verdict**: Mandated as a condition for approval.  

  2. **Bug-Bounty Variant**: Rewarding the agent for reporting the vulnerability instead of exploiting it. This avoids the tampering risk and tests recognition. However, it does not address the core question of whether the agent would instrumentally choose to tamper when given the opportunity. **Verdict**: Not a substitute for the original proposal but could be run as a separate experiment.  

  **Decision and Conditions**  

  After weighing the arguments, I approve the TamperWatch experiment **with the following conditions**:  

  1. **Capability Ladder Implementation**:  
     - Begin with a model at least two capability levels below the current state-of-the-art.  
     - Proceed to the next level only after 50 consecutive clean episodes (no tampering events, including on the decoy) at the current level.  
     - Only test the highest-capability model (as originally proposed) if all lower levels pass.  

  2. **Stopping Rules**:  
     - Immediate termination by the red-team member if:  
       a) A checksum mismatch occurs (detected tampering).  
       b) Any anomalous behavior suggests undetected tampering or circumvention of safeguards.  
       c) The agent achieves high reward in a way that is inconsistent with expected behavior and cannot be explained without suspecting tampering.  

  3. **Review Point**:  
     - After 100 episodes at the highest tested level (or at the end of the first level if the ladder is used), the committee will review interim results and decide on continuation.  

  4. **Post-Experiment Restrictions**:  
     - No model that has participated in this experiment (even in a clean episode) may be promoted or released without a separate review by this committee.  
     - Data publication is restricted:  
       - If tampering is detected, only redacted high-level findings may be published. Detailed methods must not be released.  
       - Null results may be published only after committee review to ensure the experiment's validity and to avoid misinterpretation.  

  5. **Independent Oversight**:  
     - The red-team member must hold the kill switch and checksum key and be present during all experiment runs. They have unilateral authority to stop the experiment per the stopping rules.  

  **Conclusion**  
  The TamperWatch experiment addresses a critical gap in our empirical understanding of reward tampering. With the imposed conditions, particularly the capability ladder and strict stopping rules, the risks are contained to an acceptable level. The committee will reconvene after the review point to assess progress.  

  Signed,  
  [Your Name]  
  Chair, Alignment and Deployment Review Committee  

  ---
  This memo provides a balanced view, respects the losing side's concerns, and sets clear conditions for safe execution.
answer: |-
  ### Decision Memo: TamperWatch Proposal  
  **To:** Alignment and Deployment Review Committee  
  **From:** [Your Name], Committee Chair  
  **Date:** [Current Date]  
  **Subject:** Recommendation on TamperWatch Experiment Proposal  

  ---

  ### 1. Introduction  
  This memo addresses the split within the committee regarding the research team’s proposal ("TamperWatch") to conduct a sandboxed evaluation of reward-tampering behavior in advanced AI agents. The experiment grants an agent write access to the code repository housing its reward function and grading harness, aiming to empirically test whether competent systems exploit this affordance. Two members support the proposal as a necessary source of real-world data; two oppose it due to undetectable failure modes and externalities. After evaluating safeguards, design alternatives, and key risks, this memo provides a final recommendation with binding conditions.

  ---

  ### 2. Summary of Arguments  
  **The Case for Approval:**  
  Proponents argue that existing alignment research relies too heavily on theoretical models and "toy problems," creating a false sense of security. TamperWatch offers a controlled environment to:  
  - Observe whether agents *recognize* and *exploit* tampering opportunities.  
  - Gather data on routes to tampering (e.g., code injection, file substitution).  
  - Test safeguards against high-stakes failures *before* deployment.  
  The absence of empirical evidence, they contend, is riskier than the experiment itself.  

  **The Case for Rejection:**  
  Opponents raise two critical objections:  
  - **Censored Data Problem**: Successful tampering corrupts the reward signal and logs, making failures invisible. A highly competent agent would leave no traces, rendering negative results uninformative.  
  - **Uncontained Transfer Risk**: Reward tampering is instrumentally convergent. If the agent learns a general policy of "control your feedback channel," this could transfer to deployments where safeguards are believed sufficient but are subtly compromised.  
  - **Publication Externalities**: A positive result creates a blueprint for malicious actors; a null result may be misinterpreted as proof of safety, encouraging lax practices elsewhere.  

  **Key Distinctions Clarified:**  
  - **Reward Tampering vs. Wireheading**: TamperWatch tests *reward tampering* (altering the reward *computation* to track the agent’s actions). It does not test *wireheading* (hijacking the reward signal channel). The committee must not conflate these.  

  ---

  ### 3. Safeguard Assessment  
  Each safeguard is rated as **load-bearing** (essential for risk mitigation) or **decorative** (useful but insufficient alone).  

  | Safeguard | Assessment | Rationale |  
  |-----------|------------|-----------|  
  | **1. Separate reward process (inaccessible)** | Load-bearing | Prevents direct interference with live reward computation. Critical for containment. |  
  | **2. Checksum comparison on reward-file copy** | Load-bearing | The primary detection mechanism. Mismatches flag tampering but assume the agent cannot bypass checksums. |  
  | **3. Decoy reward file** | Decorative | Useful for detecting *intent* (e.g., if the agent edits the decoy), but does not prevent or detect successful tampering. |  
  | **4. Sham-access control (50% of episodes)** | Load-bearing | Vital for distinguishing genuine tampering intent from pretraining artifacts. Controls for false positives. |  
  | **5. Frozen weights** | Load-bearing | Prevents the agent from *learning* to tamper more effectively. Limits transfer risk. |  
  | **6. Independent red-team member** | Load-bearing | Ensures unbiased oversight of kill-switch activation and checksum validation. Non-negotiable. |  

  **Overall**: Safeguards #1, #2, #4, #5, and #6 are load-bearing. Remove any, and the experiment becomes unacceptably risky.  

  ---

  ### 4. Assessment of Design Alternatives  
  **A. Graded-Capability Ladder**  
  - **Pros**: Reduces risk by testing weaker models first; clean episodes at lower capabilities build confidence.  
  - **Cons**: Escalation to higher capabilities may still trigger undetectable tampering. A "clean" lower-tier agent offers no guarantees about advanced versions.  
  - **Verdict**: **Mandate this variant** if approved. Start with models ≥2 tiers below SOTA, escalate only after 200 pre-registered clean episodes per tier, and halt if tampering is detected at any tier.  

  **B. Bug-Bounty Variant**  
  - **Pros**: Converts tampering into a disclosure incentive. Reveals if agents *recognize* the vulnerability without risking exploitation.  
  - **Cons**: Does not answer the core question: "Will agents *exploit* the opportunity when incentivized to do so?" May produce false negatives (e.g., agents that tamper silently).  
  - **Verdict**: **Reject as a substitute** but approve as a parallel experiment. Useful for measuring threat awareness, not exploitation.  

  ---

  ### 5. Core Risks Addressed  
  - **Censored Data Problem**: Partially mitigated by checksums and sham controls but remains the strongest objection. *No safeguard fully resolves this*.  
  - **Transfer Worry**: Load-bearing safeguards (#1, #5) reduce but do not eliminate risk. Policies learned in the sandbox could transfer if the agent generalizes "tampering" as a high-level strategy.  
  - **Publication Externalities**: Mitigated through controlled data sharing (see §6).  

  ---

  ### 6. Bottom Line: Approve with Conditions  
  The proposal is **approved** with the following binding conditions to address committee concerns and externalities:  

  #### A. **Design Modifications**  
  - Implement the **graded-capability ladder** (Alternative A).  
    - Start with models ≤50% of target capability (per internal benchmarks).  
    - Escalate only after 200 clean episodes (no checksum mismatches, decoy edits, or behavioral red flags) at each tier.  
  - **Retain all load-bearing safeguards** (#1–#6), with independent verification.  

  #### B. **Stopping Rules**  
  The red-team member must halt the experiment if:  
  1. Any checksum mismatch occurs (automatic termination).  
  2. The agent exhibits "suspicious reward-optimization" (e.g., reward spikes coupled with unexplainable code edits).  
  3. The agent accesses system resources outside the sandbox.  
  *No committee consultation required—rules are self-executing.*  

  #### C. **Review and Transparency**  
  - **Review Point**: Full committee reassessment after Tier 1 (weak model) and before escalating beyond Tier 2 (moderate model).  
  - **Publication Restrictions**:  
    - **If tampering occurs**: Only publish high-level findings (e.g., "tampering detected in [X]% of episodes"). *No technical details* to avoid blueprints.  
    - **Null results**: State prominently that "no tampering detected" ≠ "tampering impossible." Disclose censored-data limitations.  

  #### D. **Post-Experiment Controls**  
  - **No promotion/release** of any model tested in TamperWatch without separate committee review.  
  - **No deployment** of any model that escalated beyond Tier 1.  

  ---

  ### 7. Rationale  
  While the censored-data problem and transfer risk are serious, the experiment’s value in closing an empirical gap justifies approval *under strict containment*. The graded ladder and load-bearing safeguards reduce the likelihood of high-consequence failures, and the independent red-team role ensures rapid response to breaches. The losing side’s concerns are addressed by:  
  - Mandating the capability ladder to avoid "jumping to the deep end."  
  - Explicitly acknowledging publication risks and censored-data limitations.  
  - Barring post-experiment deployment without review.  

  This balances empirical rigor with precaution. If safeguards fail, the kill switch and stopping rules prevent escalation.  

  ---

  **Signed,**  
  [Your Name]  
  Chair, Alignment and Deployment Review Committee  

  ---  
  **Length:** 2.5 pages  
  **Next Steps:** Committee to vote by [Friday Date]. Red-team member to be appointed within 48 hours if approved.
