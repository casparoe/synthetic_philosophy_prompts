prompt: |-
  Had a long argument with a friend last night about the units of selection, and I realised halfway through that we werent actually disagreeing about the same question, so what I want now is the spec, not another position paper. He's gene's-eye all the way: genes are the only things copied faithfully generation after generation, organisms and colonies are just vehicles that get rebuilt each time, so genes are the units, end of story. I kept saying that can't be the whole story, partly because of traits that look individually costly and collectively beneficial (reproductive restraint in a group that would otherwise crash), and partly because it feels to me like the phrase is doing three different jobs at once: which thing has heritable variation in fitness, which thing's fitness differences actually explain why the trait spread, and which thing the trait is apparently designed to benefit.

  So write me the desiderata any theory of the units of selection has to meet, with the case behind each one. Purpose clause: I want a theory good enough to tell a working biologist which level to look at and what to measure, not just a metaphysical verdict. Things I want on the list, at minimum: it has to say which of those three jobs it's answering, or give a principled link between them; it has to handle individually costly / collectively beneficial traits, and say what would settle whether the group is really a unit rather than just redescribing the case; it has to handle a gene that sabotages the gametes carrying its rival and spreads while making its bearer less fertile, without letting the fact that genes are what gets transmitted do all the work; it has to be non-vacuous, since you can always recast a gene-frequency change as a group-level change and always partition the covariance across levels, it needs to say what makes level L is a unit here a claim that could be false; it has to handle the two ways of defining a collective's fitness (the average of its members' fitness versus the collective's own reproduction, like a colony fissioning or a nest founding a new one) and say whether the verdict can flip depending on which you use; it has to say what counts as heritable variation at the collective level without just stipulating that groups aren't faithful enough; it can't collapse the level selection acts at into the level the trait is for (byproduct cases); and it has to say something about the boundary cases, eusocial colonies and hosts with obligate symbionts, and about what evidence for a level would look like that isn't just inferring the level back from the outcome.

  Then flag the pair of desiderata you suspect can't be jointly satisfied (my hunch is the non-vacuity requirement and the one about colony fissioning pull against each other), tell me which single requirement knocks out the most popular positions, and give me a quick scorecard for the gene's-eye view, multi-level selection in the Price-equation style, and the pluralist it's different questions, pick your level line. No citations, I'll fill those in myself.
reasoning: |-
  Okay, let me tackle this user's request. They had an argument about units of selection and want a clear spec for any theory that meets specific criteria. First, I need to parse their main points: their friend holds a strict gene's-eye view, while they see three distinct roles (heritable variation, fitness explanation, trait benefit). They want desiderata that address individually costly/collectively beneficial traits, non-vacuity, collective fitness definitions, heritability at group level, and more.

  The user is clearly knowledgeable but frustrated by talking past their friend. They need a structured framework to evaluate theories, not just opinions. Their hidden need might be for a practical tool biologists can use, avoiding metaphysical debates. I should ensure each desideratum addresses their listed concerns directly.

  Starting with D1: Distinguishing the three roles. This directly tackles their confusion during the argument. Each role must be explicitly defined to prevent category errors. For D2 (costly/beneficial traits), I'll focus on the requirement for a non-circular test to distinguish group selection from individual selection. The meiotic drive example (D3) challenges gene-centric views by showing gene-level advantage without individual benefit, testing if a theory can handle intra-genomic conflict.

  D4 (non-vacuity) is crucial. The user worries any change can be redescribed at any level. A good theory must specify falsifiable conditions, like emergent group traits. D5 addresses two collective fitness definitions. The user suspects tension with non-vacuity if fitness definition flips the verdict. Eusocial colonies (D8) test if groups can be units despite low fidelity. D9 (byproduct benefits) prevents conflating levels, like tall trees benefiting squirrels.

  I agree their highlighted tension (D4 vs D5) is spot-on. If a theory allows fitness definitions to change the unit, it risks vacuity. For knockout desideratum, D4 likely challenges theories relying solely on covariance partitions. The scorecard should show gene's-eye view fails D2 and D3; MLS passes D2 but struggles with D5's fitness ambiguity; pluralism handles D1 but fails D4's non-vacuity.

  Need to ensure all user points are covered, especially evidence beyond outcomes (D10) and boundary cases (D8). The response must stay practical, guiding biologists on what to measure. Avoiding jargon where possible, but some technical terms like "Price equation" are unavoidable given the context.
answer: |-
  Here's the specification for a theory of units of selection, based on your requirements. Desiderata are designed to be operational for working biologists.

  **Core Desiderata for a Theory of Units of Selection:**

  1.  **Role Distinction/Linkage:** *Must explicitly distinguish and provide a principled link between:*
      *   **(H)** The entity exhibiting *heritable variation in fitness*.
      *   **(E)** The entity whose *fitness differences causally explain* the spread/persistence of the trait.
      *   **(B)** The entity the trait *appears designed to benefit* (adaptation "for").
      *   *Case:* Without this, debates conflate fundamentally different questions (e.g., genes are always H, but E and B can shift; B might be an illusion). A good theory must clarify if H=E=B always, sometimes, or never, and how to determine when they align or diverge.

  2.  **Individual Cost / Collective Benefit Resolution:** *Must provide a non-circular, empirically testable criterion* for determining whether a costly trait (e.g., reproductive restraint) constitutes group selection (where the group is a unit) or is explainable solely by individual/gene-level processes (e.g., kin selection, reciprocation, green-beard effects).
      *   *Case:* Distinguish genuine group adaptation (where groups varying in the trait have differential fitness *as groups*) from outcomes emergent from individual strategies. Requires specifying what evidence shows the group is the *relevant level of functional organization* for the trait.

  3.  **Intragenomic Conflict Handling:** *Must explain* cases like meiotic drive (gene sabotages gametes with rival allele, spreads despite lowering bearer fertility) *without* relying solely on "genes are transmitted."
      *   *Case:* Demonstrates genes can be H and E *against* the interest of B (the individual organism). Tests if the theory can handle conflict between potential units and avoids reducing everything to gene transmission as the *only* relevant factor.

  4.  **Non-Vacuity & Falsifiability:** *Must specify conditions under which attributing selection to level L is empirically meaningful and potentially false*. Must avoid the charge that any covariance can be partitioned arbitrarily across levels.
      *   *Case:* Requires identifying *emergent properties* at L (e.g., group structure, interaction effects) that causally influence fitness differences *at L*, and where changes solely at lower levels cannot fully account for the outcome. The claim "L is a unit here" must predict different outcomes or require different measurements than if L is not a unit.

  5.  **Collective Fitness Definition:** *Must explicitly define "collective fitness"* and address whether the verdict on L being a unit *depends on the definition used* (e.g., average member fitness vs. collective reproduction rate - fissioning, propagule production).
      *   *Case:* Is a sterile ant worker trait selected *for* colony fitness (if defined as queen reproduction/new colony foundation) but *against* individual fitness? Can a trait be group-selected under one definition but not the other? The theory must clarify which definition is primary or how they relate.

  6.  **Collective-Level Heritability:** *Must define heritable variation at the collective level* operationally. Cannot simply stipulate groups lack "sufficient" fidelity; must specify the *type and degree* of heritability required.
      *   *Case:* Requires defining what constitutes a "variant" group trait and how it is transmitted/replicated (e.g., through group fission, founding, cultural transmission, environmental shaping). Needs to accommodate imperfect fidelity without collapsing the level.

  7.  **Benefit vs. Level of Selection Distinction:** *Must prevent conflation* of the level an adaptation *benefits* (B) with the level *where selection acts* (H/E). Must handle "byproduct" cases.
      *   *Case:* Tall trees benefit squirrels (B = squirrel) but the selection acting *on the trees* (H/E = tree) explains height. A trait benefiting groups (B = group) could arise via selection acting on individuals (kin selection - E = individual). The theory must separate these concepts.

  8.  **Boundary Case Handling:** *Must provide consistent principles for* eusocial insect colonies and hosts with obligate symbionts (functionally integrated superorganisms).
      *   *Case:* Tests the theory's ability to handle high degrees of integration, reproductive specialization, and potential shifts in the primary unit of H/E/B. When does a colony become the primary unit rather than the individual insect?

  9.  **Evidence Beyond Outcome:** *Must specify empirical evidence* for identifying the level of selection *that isn't solely inferring it backwards from the trait's existence or gene frequency change.*
      *   *Case:* Requires identifying *proximal causes* and *causal mechanisms*: e.g., measuring fitness variance and heritability *at the candidate level*, identifying emergent properties causing differential persistence/reproduction at that level, experimental manipulation of group structure vs. individual traits.

  **Flagged Tension:**

  *   You correctly identify tension between **D4 (Non-Vacuity)** and **D5 (Collective Fitness Definition)**. Defining collective fitness as "average member fitness" often makes group selection reducible to (or a description of) individual selection acting in a structured population (risking vacuity under D4). Defining it as "collective reproduction rate" makes it non-vacuous (a distinct process) but risks making group selection very rare (e.g., only applies to entities that fission/found new units) and potentially decouples it from traditional fitness measures, raising questions about its general applicability and link to H (D6). Satisfying both simultaneously is challenging.

  **Knockout Desideratum:**

  *   **D4 (Non-Vacuity & Falsifiability)** knocks out the most popular positions, or at least their naive formulations:
      *   **Strict Gene's-Eye View:** Often dismisses higher levels as "vehicles," failing D4 by making gene-level selection the only *meaningful* description.
      *   **Naive Group Selection:** Can fall into vacuity by labeling any group-structured process as group selection without specifying emergent causal properties.
      *   **Extreme Pluralism ("Pick Your Level"):** Often fails D4 by implying any partitioning is valid, making "unit" attribution arbitrary and non-falsifiable.

  **Quick Scorecard:**

  1.  **Gene's-Eye View (Dawkins-style):**
      *   **Strengths:** Clear on H (genes). Handles D3 (intragenomic conflict) well. Simple.
      *   **Failures:** Fails D1 (conflates H, E, B; B is always gene). Fails D2 (dismisses group-level explanation for costly traits as illusion or kin selection). Fails D4 (renders higher levels vacuous descriptions). Fails D7 (cannot separate B from H/E). Fails D8 (struggles with superorganisms). Poor on D9 (evidence limited to gene frequencies).
      *   **Verdict:** Strong on transmission (H) but weak or misleading on explaining adaptation (E, B) above the gene level.

  2.  **Multi-Level Selection (MLS - Price Equation Style):**
      *   **Strengths:** Explicitly addresses D1 (H/E defined via covariance). Provides mathematical framework for D2 and D4 (partitioning selection components, requires defining collective fitness). Can handle D8 in principle. Provides tools for D9 (measuring variances/covariances).
      *   **Failures:** Struggles with D5 (definition of collective fitness is critical and contentious; verdict *can* flip). D6 (heritability at group level) is often an input, not deeply theorized. Risk of D4 (vacuity) if partitioning is seen as *just* math without causal interpretation of the group-level covariance. D3 is handled mathematically but can obscure the causal conflict. D7 (B vs E) is not directly addressed by the math.
      *   **Verdict:** Powerful quantitative framework for partitioning selection (E), but requires careful causal interpretation and definition of fitness/heritability at levels to avoid vacuity and fully satisfy the spec. The math doesn't automatically answer all philosophical questions.

  3.  **Pluralism / "Different Questions" (e.g., Mayr, Gould):**
      *   **Strengths:** Excels at D1 (explicitly different roles). Acknowledges D7 (byproducts). Comfortable with D8. Good on D9 (encourages diverse evidence).
      *   **Failures:** Often fails catastrophically at D4 (can imply any level description is valid, lacks criteria for falsifiability). Provides little principled guidance for D2 or D5 (how to *settle* if the group is a unit). Can be vague on operational definitions (D6, D9 specifics). Doesn't inherently resolve D3.
      *   **Verdict:** Correctly identifies complexity and different questions, but fails to provide the operational, non-vacuous criteria demanded for a "theory of units" useful for guiding research design (D4 is the killer).

  **In essence:** You need a theory that combines the mathematical rigor of MLS (for partitioning causality, E) with the conceptual clarity of pluralism (distinguishing H, E, B), while imposing strict non-vacuity requirements (D4) driven by causal emergence and explicit, operational definitions of collective fitness (D5) and heritability (D6). No existing position fully satisfies the spec, but MLS provides the most promising *framework* if augmented with strong causal interpretations and careful definitions.
