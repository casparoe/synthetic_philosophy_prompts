prompt: |-
  hey — im putting together an adversarial collaboration and I need someone to actually draft the document. Two camps:

  - the **precisionist**: a sharp/uniqueness Bayesian. Rationality always mandates a single probability function, update it by strict conditioning, then maximise expected utility. Anything that looks like imprecise credence is either loose self-reporting or a sharp degree of confidence the agent can't fully introspect, plus maybe some pragmatic slack in how we talk about it.
  - the **credalist**: an imprecise probabilist / permissivist. Sets of probability functions are the representational primitive, rationality is permissive, and the decision rule is E-admissibility or maximality, falling back on something like Γ-maximin when you have to pick one act.

  They've been going at each other about dilation and about whether "mushy credence" is even a state anyone could be in, and mostly they've been talking past each other.

  What I want is the text they could both sign. Format:

  1. a **numbered agreed-claims section** — with real content, not "both sides agree rationality matters". Things where the concession costs somebody something.
  2. a **disagreements table**: each row a residual disagreement, with two columns — the precisionist's own formulation of her view and the credalist's own formulation of his — each phrased so the *other* side would accept it as a fair statement of what's being claimed. No strawmen, and no wording so neutral it says nothing.
  3. a **cruxes section**: the sub-questions such that settling one would move at least one of them, and for each crux a concrete case or argument both would agree bears on it, with each side's prediction written down in advance — what each expects the case to show, and what each would concede if it came out the other way.
  4. a short closing note on **which part of the fight, if any, is merely verbal**, and why.

  Cruxes I think are in there, use them or drop them as you see fit, but I want the two scenarios below built in because otherwise the whole thing floats:

  - **The two-instrument case.** One instrument, A, is known good and reads 0.30 on a quantity in [0,1], with error you have a sharp distribution for. Instrument B was built by a subcontractor you know nothing about: it's either as good as A or it's junk that prints a uniform random number regardless of the truth, and you have no evidence either way — no base rate, no nothing. B reads 0.80. You can bet at even money that the true value is above 0.50, bet it's at or below, or pass for free. Is some act rationally required here, is more than one permitted, or is passing required? And separately: what does each side predict a room of competent non-philosophical statisticians would actually do, and what would each concede if that prediction went against them?
  - **The worst-member scoring rule.** A forecasting platform lets forecasters report a point or an interval for each event, and scores the report with a strictly proper rule applied to the member of the report least favourable given what happened: report [0.2, 0.6] and you're scored as if you'd said 0.2 if the event occurs and as if you'd said 0.6 if it doesn't. Point reports are just singleton intervals. Does an interval report ever come out best on this rule, and by whose lights? The crux is whether that result is evidence against imprecise credence or an artefact of baking sharp probability into the scoring function — so give the symmetric foil too (a rule that scores the set by its best member, or by the member closest to the truth) and say what each side predicts forecasters will do under each.
  - **Long-run collapse.** An imprecise agent who knows she'll get a long stream of evidence she can't yet see: does her set shrink towards a point, and if it does, does that vindicate the precisionist or is it just what imprecision looks like once the evidence is in?

  Please don't turn this into a verdict — no "on balance the credalist has the better of it". No citations or bibliography, I don't want any. And keep it in vocabulary both camps would use: if you reach for something like "real agents are bounded anyway", say how it's meant to bear.
reasoning: |-
  We are drafting an adversarial collaboration document between two camps: the precisionist (sharp Bayesian) and the credalist (imprecise probabilist). The document must have four parts: agreed claims, disagreements table, cruxes section, and a note on verbal disputes.

  Agreed Claims (Numbered, with real concessions):
  1. **Dilation occurs in both frameworks.** Both agree that in the two-instrument case (and similar scenarios), the set of posterior probabilities (for the credalist) or the single posterior probability (for the precisionist) can become more spread out (dilate) upon receiving the readings from the instruments. The precisionist concedes that dilation is a real phenomenon in the sense that the set of probabilities (if one were to consider a set) would dilate, but maintains that the agent's actual credence is sharp. The credalist concedes that dilation is not a reason to reject imprecise probabilities but is a feature of representing ignorance.

  2. **Introspective limitations are real.** Both agree that agents have limited introspective access to their own credences. The precisionist holds that imprecision in reporting is due to these limitations, while the credalist holds that the underlying state is genuinely imprecise. However, they agree that agents sometimes cannot report a sharp probability even upon reflection.

  3. **Decision-making under uncertainty requires a choice.** Both agree that in a decision problem, an agent must eventually choose an act. The precisionist holds that the agent has a sharp credence and maximizes expected utility. The credalist holds that the agent uses a decision rule (like E-admissibility) to select from a set of expected utilities. They agree that in some cases, the set of E-admissible acts might contain only one act, and in others, multiple.

  4. **Long-run convergence under conditioning.** Both agree that with a long stream of evidence, the set of probabilities (for the credalist) will typically contract and converge to a single point (the true probability) under standard updating (e.g., by conditioning each prior in the set). However, they disagree on the interpretation of this convergence.

  Disagreements Table (Each row: one disagreement, two columns with each side's own formulation):

  | Disagreement Topic | Precisionist's View | Credalist's View |
  |-------------------|---------------------|------------------|
  | 1. Nature of doxastic states | Rational agents always have a unique, sharp probability function that represents their beliefs. Imprecise reports are due to pragmatic factors or introspective limitations, not an underlying imprecise state. | Rational agents can have doxastic states that are inherently imprecise, represented by a set of probability functions. This set is the fundamental representation of belief, and it is not reducible to a single function without loss of information. |
  | 2. Rational updating | Upon receiving new evidence, the rational agent updates by strict conditionalization on the evidence. Any deviation from this is irrational or due to computational constraints. | Rational updating is done by conditioning each probability function in the set on the evidence. This can lead to dilation or contraction, which appropriately reflects the agent's epistemic state. |
  | 3. Decision rules | The only rational decision rule is to maximize expected utility with respect to the agent's sharp probability function. | Rational decision-making uses rules that respect the set of probabilities, such as E-admissibility (an act is admissible if it maximizes expected utility for some probability in the set) or maximality (an act is maximal if it is not dominated by another act for every probability in the set). |
  | 4. Interpretation of dilation | Dilation is a phenomenon that occurs when one models an agent's ignorance by considering a set of probabilities, but it does not affect the actual sharp probability of a rational agent. | Dilation is a genuine feature of an imprecise state that reflects increased uncertainty after receiving evidence, and it cannot be explained away by sharp probabilities. |
  | 5. Rational permissibility | In some decision problems, only one act is rational. If multiple acts are permitted, it is because the agent is indifferent (same expected utility) or because of computational slack. | Rational permissivism holds: in some decision problems, multiple acts are rationally permissible due to the imprecision in the agent's credal state. |

  Cruxes Section (Each crux: a concrete case/argument, each side's prediction, and what they would concede if the outcome goes against them):

  Crux 1: **The Two-Instrument Case**
  - Scenario: Instrument A (known good) reads 0.30. Instrument B (either as good as A or junk) reads 0.80. The agent can bet at even money that the true value is above 0.50, bet it's at or below, or pass for free.
  - Precisionist's prediction: Rational agents will pass. The sharp probability for the true value being above 0.50 is 0.5 (due to symmetry and the fact that the junk case produces a uniform reading). Thus, the expected value of betting is zero, and passing is free and safe. The room of statisticians would mostly pass, with a few betting arbitrarily. If a majority of competent statisticians choose to bet (say, on 0.80 being above 0.50), the precisionist would concede that their model of rationality might not capture actual rational behavior in such cases, but would maintain that betting is irrational.
  - Credalist's prediction: The set of probabilities for the true value being above 0.50 is the interval [0,1]. Thus, no act is dominated, and both betting and passing are E-admissible. Rational agents might choose to bet (on either side) or pass. The room of statisticians would show a mix: some pass, some bet on above, some on below. If most statisticians choose one act (say, pass) consistently, the credalist would concede that in practice, agents might use a decision rule that collapses the set (like Γ-maximin) in such symmetric cases, but would maintain that multiple acts are still permissible.

  Crux 2: **The Worst-Member Scoring Rule**
  - Scenario: A strictly proper scoring rule is applied to the worst member of the reported interval (for the outcome that occurs). So, if you report [0.2, 0.6] and the event occurs, you are scored as if you reported 0.2; if not, as if you reported 0.6. Point reports are singleton intervals.
  - Precisionist's prediction: Under this rule, the best report is always a point. Because the scoring rule is strictly proper, a sharp agent maximizes expected score by reporting her true credence. Reporting an interval can only hurt because the worst member is taken. The credalist, if she is rational, will report a point. If forecasters (even imprecise ones) report intervals and they do better than points (on average) under this rule, the precisionist would concede that the rule might be misunderstood, but would maintain that it's irrational to report an interval.
  - Credalist's prediction: The imprecise agent does not have a single true credence, so the rule is unfair. The best report might be an interval because it can protect against worst-case scenarios. However, under this rule, the interval might not always be optimal. The symmetric foil (scoring by the best member) would make intervals attractive. In practice, forecasters might report intervals under the worst-member rule if they are imprecise, but the scoring rule punishes imprecision. If forecasters consistently report points under this rule, the credalist would concede that in this specific context, reporting a point is strategically best, but would maintain that it does not reflect the underlying imprecision.

  Crux 3: **Long-Run Collapse**
  - Scenario: An imprecise agent with a set of priors updates by conditioning on a long stream of evidence. The set of posteriors converges to the true probability.
  - Precisionist's view: The convergence to a sharp probability shows that the initial imprecision was merely temporary ignorance, and the true state is sharp. The imprecise set collapses to the sharp truth, which is the only rational endpoint.
  - Credalist's view: The convergence is consistent with imprecise probabilities. The set represents the agent's epistemic state at each time, and as evidence comes in, the set becomes sharper. The collapse does not show that the initial state was sharp; it shows that evidence reduces imprecision.
  - What's at stake: The precisionist would say that if the set collapses to a point, then the agent's belief state is sharp at the limit, so there's no need for imprecise representations. The credalist would say that the set is the representation, and collapse is just what happens when you get enough evidence. If it turns out that in some cases the set does not collapse (e.g., with certain kinds of evidence), the credalist would point to that as evidence for the necessity of sets. The precisionist would counter that such cases are pathological and not realistic.

  Closing Note on Verbal Dispute:
  The dispute is not entirely verbal. There are substantive disagreements about the nature of doxastic states and rational decision rules. However, part of the dispute about "mushy credence" might be verbal: the precisionist uses "credence" to refer to a sharp probability, while the credalist uses it to refer to a set. Thus, when the credalist says "I have a mushy credence", the precisionist hears "I have a sharp credence but I'm not sure what it is", which is not what the credalist means. The dispute over dilation is substantive because it affects decision-making (as in the two-instrument case). Similarly, the disagreement on decision rules is substantive because it leads to different choices.

  But note: the two camps may agree on the underlying mathematics (e.g., the set of probabilities and how it updates) but disagree on the interpretation of what that set represents (the agent's actual belief state vs. a tool for representing ignorance). This interpretive difference is not merely verbal because it has normative consequences for how agents should act.
answer: |-
  ### Adversarial Collaboration: Precisionism vs. Credalism  

  #### 1. Agreed Claims  
  *(Concessions that impose substantive costs)*  
  1. **Dilation cannot be ignored by either framework.** Both agree that in cases like the two-instrument scenario, the range of plausible probabilities for the event of interest (e.g., true value > 0.50) widens after observing evidence. The precisionist concedes this would happen if an agent *mistakenly* represented beliefs as a set, while the credalist concedes dilation does not entail irrationality.  
  2. **Introspective access is incomplete.** Both agree agents cannot always perfectly articulate their credences. The precisionist concedes this may cause agents to *report* imprecise intervals despite having sharp credences. The credalist concedes some apparent "imprecision" might stem from introspection failures.  
  3. **No decision rule dominates universally.** Both agree no single decision rule (e.g., maximin, E-admissibility, or expected utility maximization) is rationally compelling in all cases. The precisionist concedes Γ-maximin may be pragmatically justified when evidence is sparse; the credalist concedes expected utility maximization is compelling when credences are sharp.  
  4. **Long-run evidence collapses sets.** Both agree that with infinite, non-misleading evidence, an imprecise agent’s credal set almost surely contracts to a point. The credalist concedes this mimics sharp convergence; the precisionist concedes this does not *by itself* prove the set was reducible to a sharp prior.  

  #### 2. Disagreements Table  
  *(Each row: one disagreement, stated fairly by the opposing camp)*  

  | Disagreement Topic | Precisionist’s Formulation (as credalist would accept) | Credalist’s Formulation (as precisionist would accept) |  
  |-------------------|--------------------------------------------------------|--------------------------------------------------------|  
  | **Nature of credence** | "Imprecise reports are always loose talk about a sharp credence the agent possesses, or else irrational uncertainty about their own beliefs." | "Sets of probabilities are the bedrock of belief; sharp credences are artifacts of overconfidence or idealization." |  
  | **Rational updating** | "Strict conditioning on evidence is always required; any deviation (e.g., updating a set) risks incoherence or Dutch books." | "Updating a set by conditioning each member is the only way to avoid ignoring ignorance; strict conditioning forces premature precision." |  
  | **Decision-making under ignorance** | "Maximizing expected utility with a sharp credence is uniquely rational; permissivism only arises from indecision or computational limits." | "E-admissibility is uniquely rational under imprecision; forcing a single act ignores legitimate doxastic states." |  
  | **Dilation’s significance** | "Dilation is an artifact of misrepresenting sharp beliefs as sets; it reveals nothing about rational agents." | "Dilation is a hallmark of non-committal epistemology; it proves sets are irreducible to sharp credences." |  
  | **Permissibility** | "Rationality mandates a unique act in every decision problem; apparent permissivism reflects incomplete analysis." | "Rationality often permits multiple acts; demanding uniqueness conflates epistemology with pragmatics." |  

  #### 3. Cruxes  
  *(Concrete cases; predictions; concessions)*  

  **Crux 1: The Two-Instrument Case**  
  - **Scenario**: Instrument A (known reliable) reads 0.30; Instrument B (unknown reliability) reads 0.80. Bet at even money on true value > 0.50, ≤ 0.50, or pass for free.  
  - **Precisionist prediction**: Rational agents pass. Sharp credence for true value > 0.50 is 0.50 (indifference between B being reliable or junk). Betting has zero expected utility; passing dominates. Statisticians will overwhelmingly pass.  
    - *Concession if wrong*: If most statisticians bet (e.g., on > 0.50), precisionism misjudges human rationality.  
  - **Credalist prediction**: Permissivism holds: passing and either bet are E-admissible. The credal set spans [0,1]; no act dominates. Statisticians will split (some pass, some bet on 0.80).  
    - *Concession if wrong*: If nearly all statisticians choose one act, E-admissibility may need refinement.  

  **Crux 2: Worst-Member Scoring Rule**  
  - **Scenario**: Forecasters report points or intervals. Scoring: for event *E*, use the worst (least favorable) probability in the report (e.g., report [0.2, 0.6] → scored as 0.2 if *E* occurs, 0.6 if not).  
  - **Symmetric foil**: Best-member scoring (use most favorable probability) or closest-to-truth scoring.  
  - **Precisionist prediction**: Under worst-member, reporting a sharp credence uniquely maximizes expected score (by strict propriety). Intervals always lose. Forecasters will report only points.  
    - *Concession if wrong*: If intervals outperform points, scoring rules might not track rationality.  
  - **Credalist prediction**: Worst-member penalizes imprecision unfairly; intervals lose. But under best-member, intervals win (hedging). Forecasters will report intervals under best-member, points under worst-member.  
    - *Concession if wrong*: If forecasters report intervals under worst-member, imprecise epistemology may misguide decisions.  

  **Crux 3: Long-Run Collapse**  
  - **Scenario**: Imprecise agent updates credal set on a long stream of i.i.d. evidence.  
  - **Precisionist view**: The set collapses to a point, proving the agent *always* had a sharp latent credence; imprecision was merely ignorance.  
  - **Credalist view**: Collapse is just evidence reducing ignorance; the set was fundamental, and its evolution validates imprecise updating.  
  - **Test**: Simulate sequential updates where evidence is ambiguous (e.g., conflicting instruments).  
    - *Precisionist prediction*: Sets collapse to a point even with ambiguous evidence; agents act "as if" sharp.  
      - *Concession if wrong*: If sets remain non-singleton, imprecision might be irreducible.  
    - *Credalist prediction*: Ambiguous evidence slows collapse; sets reflect persistent ignorance.  
      - *Concession if wrong*: If sets collapse instantly, long-run imprecision might be incoherent.  

  #### 4. Verbal Dispute Note  
  The core disagreement is **not** verbal. The precisionist defines "credence" as a sharp probability function; the credalist defines it as a set. This difference is substantive: it alters norms for updating and decisions (e.g., permissivism vs. uniqueness). However, **mushy credence** *is* partially verbal: both agree agents sometimes *report* intervals, but the precisionist attributes this to self-ignorance ("I feel unsure"), while the credalist attributes it to metaphysical indeterminacy ("My belief is unspecific"). Dilation debates avoid verbal traps because both engage the same math—disagreement hinges on whether dilation reveals irrationality (precisionist) or epistemic depth (credalist).  

  ---  
  *Collaborative draft ends; no verdict, citations, or external framing.*
