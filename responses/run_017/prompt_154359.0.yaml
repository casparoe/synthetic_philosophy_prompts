  Third-class answers will just describe the Hotel without engaging the reshuffle critique, or treat infinity as uniformly "weird." Must penalize that.
answer: |-
  ### Final Exam Question: Metaphysics of Infinity  
  **Total Marks: 25**  
  **Time Allotted: 45 minutes**  

  **Part (a) (5 marks)**  
  Reconstruct the argument that Hilbert’s Hotel demonstrates the impossibility of actual infinities. Then, identify a key ambiguity in this argument: does it primarily challenge the *mathematical coherence* of infinite sets, or the *physical realizability* of infinite processes? Explain your distinction concisely.  

  **Part (b) (20 marks)**  
  Evaluate whether the following three considerations support or undermine the claim that infinity is metaphysically problematic:  
  (i) The physical implementation of "reshuffling" guests in Hilbert’s Hotel (e.g., movement through corridors).  
  (ii) Cantor’s theorem and the hierarchy of infinities.  
  (iii) The finitist’s simultaneous commitment to continuous space or time.  
  In your view, do these considerations collectively strengthen the case against actual infinity, or do they reveal deeper commitments driving the dispute? Justify your position.  

  ---

  ### Model Answer (Approx. 850 words)  
  **Part (a)**  
  The Hilbert’s Hotel argument claims that actual infinities are impossible because they entail contradictions. The hotel, with infinitely many occupied rooms, can accommodate new guests by having each current guest move from room *n* to room *2n*, freeing all odd-numbered rooms. This shows a proper subset (odd rooms) has the same cardinality as the whole set (all rooms). Critics argue this reshuffle implies the hotel can be "full" and "not full" simultaneously, violating intuition. However, the argument harbors an ambiguity: it conflates mathematical cardinality (a set’s bijection with its subset) with physical process (guests moving infinitely far). The former is a property of abstract sets; the latter concerns causal, spatiotemporal acts. The core challenge is not whether infinite sets *exist mathematically* (Cantor guarantees this), but whether their physical instantiation requires completing supertasks—infinitely many actions in finite time.  

  **Part (b)**  
  **(i) Physical reshuffling and supertasks**: The Hotel’s reshuffle appears paradoxical only if we demand a *physical implementation*. Guests in distant rooms (e.g., room 10^9) must traverse billions of rooms, with no final guest to "complete" the move. This transforms the paradox from a cardinality issue (where bijection is uncontroversial) into a problem of *completing infinitely many causal processes*. Here, the Hotel does not refute mathematical infinity; it targets whether supertasks are metaphysically possible. If we reject supertasks (e.g., due to causal finitism), the Hotel fails as an objection to abstract infinity. Conversely, if we decouple mathematical sets from physical processes, the reshuffle’s impossibility merely reflects constraints on *agency*, not set theory. Thus, this consideration undermines the Hotel’s anti-infinity force: it redirects criticism to supertasks, leaving Dedekind-infinity (self-bijection with proper subsets) intact.  

  **(ii) Cantor’s hierarchy: pathology or rigor?** Critics cite Cantor’s theorem (no set maps onto its power set, so infinities grow endlessly) as evidence of infinity’s "pathology." Yet this misrepresents the theorem’s philosophical weight. Cantor’s hierarchy is a *logical discovery*, not a contradiction. It demonstrates that infinity admits of precise, hierarchical structure—making it *less* "spooky," not more. For instance, we can distinguish ℵ₀ (countable) from ℵ₁ (uncountable) rigorously. Anti-infinity arguments that invoke hierarchy conflate *unfamiliarity* with *incoherence*. Mathematics’ ability to formalize ever-larger infinities neutralizes the "pathology" charge: if infinity were truly paradoxical, formalization would fail. Thus, Cantor’s theorem *strengthens* the case for infinity’s coherence by showing its behavior is systematic and predictable.  

  **(iii) Finitism and continuity**: Finitists often retain continuous space/time (with uncountably many points), creating tension. If the Hotel’s reshuffle is problematic because it requires "infinite effort," then continuous space/time demands uncountably many point-instantiations—a far greater commitment. For example, traversing a line segment involves "contacting" ℵ₁ points, yet finitists accept this while rejecting countable supertasks. This inconsistency suggests the Hotel argument overreaches: if it rules out countable infinity, it should rule out uncountable infinity too. To avoid this, finitists must either embrace discrete spacetime (rejecting continuity) or adopt non-point-based theories (e.g., region-based topology). Either move concedes that the dispute hinges not on logic alone, but on prior commitments about fundamentality (e.g., "pointless" geometries).  

  **Synthesis and commitment**  
  These considerations collectively *undermine* the claim that infinity is metaphysically problematic. The Hotel’s "paradox" dissolves when its physical implementation is recognized as a supertask objection, not a set-theoretic one. Cantor’s hierarchy showcases mathematical control over infinity, demystifying it. Finally, finitists’ reliance on continuity exposes that their resistance to countable infinity stems from deeper intuitions about *causal finitude* or *discrete ontology*. The disagreement ultimately bottoms out in two irreconcilable intuitions:  
  - **Pro-infinity**: Mathematics reliably describes infinity; physical or causal constraints (e.g., supertasks) are separate issues.  
  - **Anti-infinity**: Concrete reality must be completable in finite steps; hence, no "actual" infinities exist.  
  The Hotel argument, stripped of supertask assumptions, reduces to the uncontroversial Dedekind-infinity property. Its persistence as a "paradox" reveals not a flaw in infinity, but a clash between mathematical abstraction and causal-grounded metaphysics. I side with the pro-infinity view: Cantor’s rigor and the finitist’s dilemma show that objections to infinity rely on smuggled physical assumptions, not pure logic.  

  ---

  ### Marking Scheme (Total: 25 marks)  
  **Part (a) (5 marks)**  
  - **2 marks**: Clear reconstruction of Hotel paradox (full → not full via bijection).  
  - **3 marks**: Distinguishing mathematical coherence (bijection) vs. physical realizability (supertask), explaining ambiguity.  
    *Common error (0 marks here)*: Claims Hotel "disproves set theory" without distinguishing concepts.  

  **Part (b) (20 marks)**  
  **(i) Reshuffling as supertask (6 marks)**  
  - **3 marks**: Links corridor movement to supertask completability (distance, no last step).  
  - **3 marks**: Argues this shifts focus from cardinality to causal finitism.  
    *Common error*: "Physics irrelevant; it’s a thought experiment" (max 1/6, ignores key objection).  

  **(ii) Cantor’s hierarchy (6 marks)**  
  - **2 marks**: Correctly states Cantor’s theorem (no surjection to power set).  
  - **4 marks**: Evaluates whether hierarchy reveals pathology or rigor; rejects conflation of "size" with paradox.  
    *Common error*: Asserts Cantor "proves infinity is absurd" without analysis (max 2/6).  

  **(iii) Finitism and continuity (4 marks)**  
  - **2 marks**: Identifies tension: finitism + continuity implies uncountable infinity.  
  - **2 marks**: Notes finitist’s options (discrete/point-free theories) as revealing commitments.  
    *Common error*: Ignores this point entirely (0/4).  

  **Overall Synthesis (4 marks)**  
  - **2 marks**: Clear stance (e.g., "undermines anti-infinity view").  
  - **2 marks**: Identifies where disagreement bottoms out (e.g., "causal finitism vs. mathematical autonomy").  

  **Grade Boundaries**  
  - **First-class (70-100%)**: 20–25 marks. Distinguishes all key issues (supertask vs. cardinality, Cantor as rigor, finitist dilemma), takes a stance, and identifies foundational commitments.  
  - **2:1 (60-69%)**: 15–19 marks. Covers reshuffling and Cantor well but superficial on continuity or synthesis.  
  - **Third (40-49%)**: 10–14 marks. Describes Hotel/Cantor without engaging ambiguities; conflates Dedekind-infinity with Cantor’s theorem.  
  - **Fail (<40%)**: <10 marks. Summarizes paradoxes without analysis (e.g., "Hotel shows infinity is impossible").  

  **Note**: Deduct 3 marks overall if answer confuses Dedekind-infinity (self-bijection) with Cantor’s theorem (power sets). Award bonus mark for noting Hotel only requires Dedekind-infinity.
