     So in every case, the counterfactual is not observed. Why is the library case different? The problem says: "the 'we don't do it' branch never gets observed at all". But that's true for all cases? 

     Actually, in the farmers market, they are using the same Saturdays the year before as a proxy for the without branch. So they are not directly observing the without branch at the same time, but they are using a historical baseline. Similarly, in the library case, they are using the previous two years as a baseline. 

     The issue in the library case is that the regulars of the closed branch might change their behavior in response to the closure, and they are also the traders. So the concern is not about the counterfactual being unobserved (that's always the case) but about the traders being able to influence the metric and having a conflict of interest.

     Therefore, the rule might be: "Avoid situations where the traders have a strong incentive and ability to manipulate the metric."

  Let's try to state rules that fit all five:

  Rule A: The metric must be measurable objectively and with data that is already collected or can be collected cheaply and reliably. (Fits 1,2,3. For 4, the composite index is not objective and reliable. For 5, perhaps net tax revenue and jobs are measurable, but maybe not cheaply or reliably? Or the time horizon is too long.)

