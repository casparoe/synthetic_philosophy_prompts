  - Measurability: using library system's counts -> objective? But the library administration is against closing and might manipulate? So not fully objective? Or the data is collected anyway? 
  - Manipulation: the branch regulars (who are traders) can choose to visit more or less. If the branch is closed, they might stop going to the library entirely, reducing total visits. Or they might go to other branches. But they have an incentive to make the closure look bad if they are against it. And they are the traders, so they can bet on the outcome and then make it happen. This is a conflict of interest.

