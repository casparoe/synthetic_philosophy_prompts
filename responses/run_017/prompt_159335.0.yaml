  5. Big-box retail development: Rejected. Proposed metric: net municipal tax revenue plus local jobs at four years. Reason not stated, but we can infer from context.

  Rejection reasons for 4 and 5:
  - For 4: The composite index was seen as too complex and subjective, leading to disputes and lack of trust.
  - For 5: We don't have an explicit reason, but we can note that it was rejected. Given the pattern, it might be because of the metric or other concerns.

