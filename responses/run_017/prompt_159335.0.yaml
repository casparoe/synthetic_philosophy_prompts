  Rule D: Avoid metrics that are easily manipulable by the traders or by parties with a stake in the outcome. (In the library case, this is a concern. In the past: 
     - Bus lane: hard to manipulate journey times? 
     - Streetlight: hard to manipulate city electricity bills? 
     - Farmers market: vendors might manipulate receipts? Or pedestrians might be influenced? But it was approved, so perhaps not seen as a big issue. 
     - Rezoning and big-box: rejected for other reasons, so we don't know.)

  But in the farmers market, the traders might be able to influence the metric. Why wasn't that a problem? Maybe because the manipulation would be costly? Or because the metric is a comparison to a fixed baseline? 

  Rule E: The decision must not be about who gets what (distributional) but about means to a shared end. (The problem says: "only for means, never for who-gets-what". This fits the bus lane (improving transit for all?), streetlight (saving money for the city), farmers market (maybe about vitality?), but the rezoning might be about who gets housing and where, and big-box might be about jobs and tax base? However, the problem states that the elected people choose the goal, and the market chooses the means. In the rezoning, the goal is affordability and vitality, which is a shared end, and the means is rezoning. Similarly, big-box: the goal is tax revenue and jobs. So it's about means. So why were they rejected? Not because of who-gets-what, but because of the metric. So rule E might not be the primary reason.)

  Given the above, let's try to explain all five:

  - Approved cases: short time horizon, simple metric, objective data, and no major manipulation concerns.
