  But did we have Rule D in the past? The farmers market was approved despite a similar concern? How to reconcile?

  In the farmers market, the metric was vendor receipts and pedestrian counts. The traders in the futarchy market might be market attendees, but:
  - They cannot change the baseline (previous year).
  - They can only affect the new counts. But if they are against the move, they might boycott the new location to make receipts low? But then they would lose money if they bet on the move being successful? So they have conflicting incentives: if they bet on the move failing and then boycott, they make money? But they also lose the market? It's messy.

