     - "In Round 2, how many wrote deductions that weren't real or made up steps for the multiplication?"
     - "In Round 2, did you feel your work was a true record?"
     - "In Round 3, how many focused on passing the outcome and then generated a process to match the rubric?"

  Then discuss:
  - Outcome-based: selects for what passes the checker. The checker is a proxy and might be flawed.
  - Process-based: selects for what looks good to the grader. The rubric might not capture the essence of the process.
  - Combined: the well-formed trace camouflages the outcome hack.

  Introduce the terms: outcome-based supervision, process-based supervision.

  Discuss why the grader is part of the system:
  - In outcome-based, the checker is a model of the true objective. It has its own errors.
  - In process-based, the rubric is a model of good reasoning. It might be shallow.

  Finally, what we didn't simulate:
  - The AI has no intrinsic motivation to be honest; it only cares about the reward.
  - The trace in an AI is generated by the same system that produces the output, so it's not an independent record.
