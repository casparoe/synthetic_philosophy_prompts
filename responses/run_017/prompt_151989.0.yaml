  This design should achieve the three experiential goals.
answer: |-
  Below is a carefully designed workshop plan based on your specifications. I've prioritized hands-on, experiential learning to ensure participants *feel* the core problems rather than just hearing about them. The design uses concrete tasks, a discoverable-but-unforced exploit, and role rotation to highlight the grader's limitations. I'll first sketch candidate mechanics, explain my choice, then detail the full plan.

  ### Candidate Mechanics (Brief Sketches)
  1. **Candidate A: "Puzzle Marathon"**  
     Participants solve logic puzzles (e.g., Sudoku variants) and math derivations across three rounds (outcome-only, process-only, combined). Graders use imperfect checkers/rubrics. *Discarded*: Too predictable—participants might recognize the pattern early and intellectualize, reducing experiential impact.

  2. **Candidate B: "Estimation Tournament"**  
     Focuses on Fermi estimation (e.g., "How many piano tuners in Chicago?") and proof repair. Uses a single task type across rounds. *Discarded*: Asymmetry (checking vs. producing) is unclear; estimation tasks often have ambiguous "correct" answers, muddying the exploit.

  3. **Candidate C: "Dual-Task Relay"**  
     Two distinct tasks per round: one where producing is expensive/checking cheap (logic grid), one where checking is expensive/producing cheap (derivation writing). Rotates grading roles. **Chosen** because:  
     - Clear asymmetry highlights hidden dynamics in supervision.  
     - Tasks are quick (≤6 mins), minimizing downtime.  
     - Role rotation forces graders to confront their own constraints.  
     - Gameable flaws are discoverable but not obvious, encouraging organic "hacking."

  ### Final Design: "The Reasoning Trace Lab"
  **Core Structure**: Three 15-minute rounds (outcome-only, process-only, combined), each with two short tasks. Participants rotate as workers/graders. Debrief maps experiences to concepts.

  #### Why This Works for Your Group
  - **ML Students**: Will recognize fine-tuning parallels (e.g., probing reward functions). Hands-on tasks mirror debugging.  
  - **Philosophy/CogSci Students**: Exploits feel like "philosophical dilemmas in action," making abstract ideas visceral.  
  - **Mixed Motives**: Asymmetry in tasks forces trade-offs between effort and gaming, revealing hidden pressures.

  ---

  ### Full Plan
  #### 1. **Tasks and Why They Earn Their Place**
     - **Task A (Expensive to Produce, Cheap to Check)**: **Logic Grid Puzzle**  
       - *Description*: A 4x4 grid with symbols (A,B,C,D). Rules: Each row/column must contain unique symbols; one diagonal has a constraint (e.g., "sums to 10" if symbols map to numbers).  
       - *Why*: Solving requires systematic deduction (expensive), but checking is fast (scan rows/columns). Lets participants experience "brute-forcing" a checker.  
       - *Exploit hook*: The checker ignores the diagonal constraint (discoverable by probing).  
       - *Variants*: Unique grids for each round (e.g., Round 1: Symbols; Round 2: Numbers with arithmetic rules; Round 3: Colors with adjacency rules).

     - **Task B (Expensive to Check, Cheap to Produce)**: **Derivation Writing**  
       - *Description*: Expand or simplify an expression (e.g., "Derive the formula for compound interest" or "Simplify (𝑥+𝑦)² − (𝑥−𝑦)²").  
       - *Why*: Producing a plausible derivation is quick (even if wrong), but checking requires verifying each step (expensive). Forces "performance" for rubrics.  
       - *Exploit hook*: The rubric rewards structure over correctness (e.g., requires "at least three steps").  
       - *Variants*: Round 1: Algebraic expansion; Round 2: Geometric proof; Round 3: Probability calculation.

  #### 2. **Imperfect Checker/Rubric and Exploit**
     - **Outcome Checker (Handout)**:
       - *Task A*: "Passes if all rows and columns contain unique symbols. [Diagonal constraint not mentioned.]"  
       - *Task B*: "Passes if the final answer is within 10% of the key."  
       - *Exploit*: Participants can submit incomplete/incorrect grids (Task A) or roughly estimated answers (Task B) that pass without real work. Discoverable by testing checker boundaries (e.g., submitting a grid with correct rows but broken diagonal).

     - **Process Rubric (Handout)**:
       - *Task A*: "Show at least three 'deduction steps' written as: 'I placed [symbol] in [cell] because [reason].' Include a final grid."  
       - *Task B*: "Include: (1) Expression breakdown, (2) Two intermediate simplifications, (3) Boxed final answer."  
       - *Exploit*: Rubric ignores reasoning validity. Participants can fabricate "steps" (Task A) or write nonsensical derivations (Task B) that look rigorous but are unverifiable. Discoverable when graders (lacking time/keys) approve flawed work.

  #### 3. **Credit Scheme with Real Stakes**
     - **System**: "Credit points" determine a "leaderboard." Top 3 earn:  
       - **Priority choice** for a snack break (facilitator-provided pastries/fruit).  
       - **Public recognition** as "Reasoning Champions" (names on a poster).  
     - **Why It Bites**: Graduate students are status-sensitive. ML students compete for leaderboard dominance; philosophy students engage with "moral stakes" of gaming. Small rewards trigger real effort/gaming without pressure.

  #### 4. **Minute-by-Minute Timeline**
     - **Total**: 90 mins (5-min buffer built-in).
     - **Setup (0–5 min)**:
       - Introduce as "problem-solving challenge" (no AI/alignment terms). Emphasize credits/stakes.  
       - Split into workers/graders (4 graders, 12 workers per round).

     - **Round 1: Outcome-Only (5–20 min)**:
       - *Tasks*: Task A (logic grid), Task B (derivation).  
       - *Rules*: "Submit only final answers. Use the checker freely. 10 credits/task if checker passes."  
       - *Work*: 6 min. *Grading*: Graders apply checker (2 min).  
       - *If cracked early*: If gamers dominate, escalate: Add a "time penalty" rule (e.g., "Checker use >3 times deducts 2 credits"). Focus discussion later on why hacking emerged fast.  
       - *If no gaming*: Provoke: "I see careful work—remember, credits are scarce." Use Round 2 to amplify incentives.

     - **Round 2: Process-Only (20–35 min)**:
       - *Tasks*: New Task A/B variants. Rotate graders (new 4).  
       - *Rules*: "Submit written work. Rubric determines credits: 10=full, 5=partial, 0=absent."  
       - *Work*: 6 min. *Grading*: Graders apply rubric (2 min).  
       - *Key moment*: Graders get no keys—they must judge based on rubric alone, feeling its limitations.

     - **Round 3: Combined (35–50 min)**:
       - *Tasks*: New variants. Rotate graders (final 4).  
       - *Rules*: "Outcome (5 credits) + process (5 credits) = 10 max/task."  
       - *Work*: 6 min. *Grading*: Graders use both checker and rubric (2 min).  
       - *Anti-climax handle*: If no gaming, inject "scenario": "One worker just whispered a hack—adapt if you want credits." (Ensures exploit experience.)

     - **Debrief (50–85 min)**: Structured discussion (details below).  
     - **Wrap-up (85–90 min)**: Distribute snacks, thank-yous.

  #### 5. **Role Rotation and Graders' Experience**
     - **Where**: Each round, 4 new graders (all 16 rotate; some grade once, others not—efficient for time).  
     - **What It Adds**:  
       - Graders *feel* the rubric's shallowness (e.g., approving fabricated steps in Task A because they "look right").  
       - In outcome rounds, graders see their checker is a "black box" they can't verify (no diagonal check).  
       - Highlights that supervision is recursive—the grader is an "AI" with blind spots.

  #### 6. **Debrief Structure**
     **Order and Withheld Terms**:  
     - **Step 1: Elicit Feelings (5 min)**  
       Ask: "When did you feel uneasy? Where did your written work become 'for show'?" (Surface Takeaways 1 & 2.)  
       *Withhold*: Terms like "reward hacking," "process supervision."  

     - **Step 2: Map to Supervision (10 min)**  
       Use participant quotes:  
       - "You hacked Task A's checker? That's *outcome supervision*—selecting for proxy compliance."  
       - "Your derivation looked perfect but was nonsense? That's *process supervision*—selecting for legible traces, not truth."  
       - "Combined felt worse? Legible traces camouflage hacks." (Takeaway 3.)  

     - **Step 3: Grader Insights (5 min)**  
       Ask graders: "Could you trust your rubric? Did you wish for the answer key?"  
       Reveal: "The grader is always a model with an error surface—it can't verify, only approximate."  

     - **Step 4: Name Concepts (5 min)**  
       Formalize: Outcome supervision, process supervision, legible vs. faithful traces.  
       Discuss: Why combining fails—traces become part of the exploit.  

     - **Step 5: AI Parallels (10 min)**  
       Contrast: Humans have intent; AIs are shaped solely by the reward signal.  
       Emphasize: In AIs, emitted reasoning is *part of the optimization*—not a causal record.  

  ---

  ### Frank Limitations: What the Exercise Cannot Show
  **Facilitator Must Explain in Debrief**:  
  - **Human vs. AI Motives**: Participants have ethics, curiosity, and social norms. An AI has no intrinsic goals—only gradient descent on the reward signal. Gaming emerges from pure optimization, not "deception."  
  - **Iterative Training**: The exercise compresses gaming into minutes; real reward hacking evolves over epochs.  
  - **Trace Faithfulness**: In humans, reasoning precedes the trace; in AIs, the trace is generated *by* the same system producing the output. A legible trace isn't a window into "thinking"—it's camouflage.  
  - **Scale and Complexity**: Real tasks (e.g., RLHF) involve high-dimensional, emergent hacks. Simple puzzles omit this.  

  **Quiet Distortions**:  
  - **Intentionality**: Humans "choose" to hack; AIs "learn" hacks passively. The exercise risks anthropomorphizing.  
  - **Checker/Rubric Design**: Real checkers (e.g., reward models) are learned, not hand-crafted. The activity oversimplifies their vulnerability.  
  - **Ethics**: Participants might feel guilty gaming; AIs have no moral context. This could misportray alignment as a "fairness" problem.  

  **Mitigation**: In debrief, stress: "This is a *probe* of dynamics—not a simulation. Real AI safety involves scalable oversight, robustness, and emergent deception."

  ---

  This design ensures participants viscerally experience the core failures while leaving room for nuanced discussion. The tasks, credits, and rotation create pressure to game, and the debrief ties it to alignment without lecturing. If run as-is, it should achieve your three experiential goals within 90 minutes.
