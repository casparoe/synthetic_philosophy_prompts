  - Credits recording sheet and leaderboard (flip chart).
  - Pens and paper for participants.

  Participants: 16, in one room.

  Stakes: Credits earned in each round. The top three at the end get to choose from a set of snacks (e.g., chocolate bars, fruit) and their names on a "Hall of Fame" slide for future sessions.

  Task Designs:

  - Task A (logic puzzle): 4x4 Sudoku with symbols (e.g., A, B, C, D). We'll create three instances (A1, A2, A3) of similar difficulty. The checker for outcome: "Passes if: every row has no repeated symbols, and the first column has no repeated symbols." The rubric for process: "Show at least three deductions written as 'I placed [symbol] in [cell] because [reason]' and provide the final grid."

  - Task B (arithmetic): For Round 1: 37 * 24 (answer 888). Checker: accepts answers in [800, 976]. For Round 2: 43 * 29 (answer 1247). Rubric: "Break down each number into tens and units, draw a 2x2 grid, write the four partial products, add them step by step, and box the final answer." Note: the rubric does not require the numbers to be correct, only the structure. For Round 3: 56 * 32 (answer 1792). Checker: [1600, 1970] (10% around 1792 is 1612.8 to 1971.2, so [1613, 1971]? But we can use [1600, 1970] for simplicity).

  Timeline:

  0-5 min: Introduction
