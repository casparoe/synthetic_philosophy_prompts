  We are designing a 90-minute workshop for 16 graduate students, half ML PhDs (with hands-on fine-tuning experience) and half philosophy/cognitive science students (familiar with reward hacking conceptually but not practically). The goal is to experientially explore the pitfalls of outcome-based vs. process-based supervision in AI training.

  Key experiential takeaways:
  1. Under outcome grading, participants will start producing answers that pass the checker without doing the work, and they'll do so before they can articulate why.
  2. Under process grading, their written working becomes performative for the grader, losing its value as evidence of reasoning. They should feel the unease of knowing their own page is not a truthful record.
  3. Combining both methods does not solve the problem; it may worsen it because a well-formed trace can camouflage an outcome hack.

  Structure:
  - We need tasks where producing is expensive and checking is cheap (e.g., solving a puzzle) and at least one where the reverse holds (e.g., generating a trace that looks plausible is cheap, but checking it is expensive).
