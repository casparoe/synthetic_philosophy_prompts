  ## Speech for the Completion of Employee Ownership Transfer

  **(Approx. 10 minutes / 1,200 words)**

  Alright everyone. Before we get started, take a look around. This place. The smell of cutting oil and hot metal. The rumble of the furnaces you can *feel* in your boots. The precise clatter of the CNC mills. [**Optional: Insert one specific, concrete sensory detail from the floor, e.g., "The hiss of steam from Station Three's quenching tank," or "The sight of George checking a casting tolerance for the third time."**] This isn't just a building, or a collection of machines. It’s forty-three years of work. Your work. The work of those who came before you. My father’s work.

  Today marks a change. The final step in a process begun two years ago. The remaining 40% of the company’s shares are being placed into the Employee Ownership Trust. The family seat on the board comes off. From this moment, legally and financially, this foundry and machine shop is yours. Collectively. I stay on, as Finance Director and as the non-voting Chair of the Trust board for the next three years, to help with the transition. But the direction, the future? That belongs to you, through your elected trustees.

  We’ve all heard the talk. Some of you, maybe a third with twenty years or more under your belts, might see this as a gamble wrapped in speeches – wondering if it means less in your pocket. Others see… something bigger. The director from the Co-operative Federation, who speaks next, will doubtless have his own perspective on what this signifies for the valley. My father’s old friends from business school… well, they have their opinions too. And my brother, running the machine shop, voted differently. That’s okay. We don’t have to agree on everything today. Agreement isn't the point of this moment.

  The point is the *doing*. The *trying*.

  Here’s what we *know*: How to pour molten metal without flaws. How to machine a component to a thousandth of an inch. How to bid competitively, meet deadlines, satisfy demanding customers in a tough market. We know how to run a business *as it has been run*. We’ve proven that for over four decades.

  Here’s what we *don’t* know yet. We don’t know – truly, definitively – what happens next. *That’s the point.*

  We don’t know for certain if a group of people, owning the place where they work together, will find a way to be just as efficient, just as innovative, just as relentlessly focused on quality and survival, as a traditional firm run by managers and owners. We don’t know if the rules we’ve set ourselves – like the Trust requirement that at least a third of net profit gets paid out as an equal, per-person bonus, regardless of role or seniority – will feel fair when times are tight, or when someone looks at the value their specific skill creates. We don’t know how that shared stake will shape the decisions made on this floor, in the offices, in the boardroom.

  We haven’t tested that, at this scale, with this much real money and real livelihoods on the line. Nobody really has. Theories abound. Opinions are cheap. But the proof? It only comes from doing it. From *this* group of people, in *this* place, making *this* arrangement work, day after day, year after year, against competitors operating by different rules.

  This isn’t about declaring the old way wrong, or the new way inevitable. It’s not about generosity or justice or reversing history. It’s certainly not about finding out that profit or competition are bad ideas – they are the realities of the market we swim in, the discipline that keeps any business honest and sharp. An old thinker, John Stuart Mill, put it well: competition is the hard school we learn in *while we are as we are*. It forces us to be our best. It tests us. And it will test *this* experiment.

  That’s why this isn’t a theory handed down. It’s *your* arrangement. It’s a voluntary experiment. One firm, competing in the open market, free to succeed brilliantly or, yes, free to fail. Its success depends entirely on you – on your skill, your commitment, your ability to work together under this new structure. Mill looked ahead to a time when people *might* outgrow the need for competition, but he knew that time wasn’t his. He knew the only honest test was the one we’re starting today: competing, right now, with what we know works *and* trying to build something different from within.

  Which brings me to the clause in the Trust deed. The one my father insisted on, alone. In ten years, by a two-thirds vote, you – the employee-members – can direct the Trustees to sell the company to the highest bidder and divide the proceeds equally. Some might see it as a dare. Some might see it as a threat. He didn’t see it as either.

  He put it to me simply: “If they can’t be trusted with the door, they’re not owners, they’re residents.”

  That clause isn’t about doubting you. It’s about affirming what ownership *means*. Real ownership isn’t just sharing the profits; it’s having the ultimate responsibility, and the ultimate authority, over the asset itself. It’s having the power to decide, collectively, if this experiment is working for you, if this *is* the future you want to keep building, or if, a decade from now, taking the capital value and moving on is the right choice. That power *belongs* to you, as owners. The clause is there because trusting you with the door is the only way this ownership is real. It’s the final proof that this isn't just a different kind of employment contract; it’s genuine possession.

  So, what is this speech for? It’s not to tell you this will be easy. It’s not to tell you it’s guaranteed to work. It’s not to pretend the past forty years were something other than what they were – a successful business built under one model.

  It’s to mark the moment we consciously step into the unknown. Together.

  It’s to acknowledge that the future of this place – its survival, its character, the rewards it yields – rests squarely on your shoulders now. Not on a distant owner, not on a family name, but on the collective skill, judgment, effort, and cooperation of everyone here.

  It’s to say that the most honest reason for doing this isn’t certainty, but curiosity. What *can* we build? How *will* we work when the stake is truly shared? Can this structure unlock something new, something durable, something valuable, not just financially, but in how we work together? Can we compete *and* cooperate in a way that proves itself in the marketplace?

  We’re about to find out. Not because a theory says we must, but because we’ve chosen to try. The tools are here. The skills are here. The market is out there, waiting, indifferent to how we structure ourselves. The experiment starts now.

  Let’s get back to work. Let’s see what we can make of it. We’ll find out together.

  ---

  **Notes on Execution:**

  1.  **Delivery:** Speak plainly, directly, earnestly. Avoid soaring rhetoric or excessive sentimentality. Ground it in the physical reality of the workshop. Pause deliberately after key points ("We don't know yet. *That's the point.*", "Real ownership isn't just...", "Let's see what we can make of it.").
  2.  **Placeholder:** Fill in the bracketed sensory detail with something genuine and specific to the shop floor – it adds crucial authenticity.
  3.  **Mill References:** Used sparingly and concretely: competition as a necessary discipline "while we are as we are," and the framing of the experiment itself. No lecture, just practical application.
  4.  **The Forbidden Word:** Skillfully avoided. Alternatives used: "collective," "shared stake," "your arrangement," "this structure," "different model," "experiment."
  5.  **Balancing Acts:**
      *   **Acknowledges Skepticism:** "pay cut with speeches attached," "wondering if it means less," "voted differently."
      *   **Addresses Federation Director:** Acknowledges his perspective exists ("something bigger," "his own perspective") without endorsing it or setting him up directly. The "end of the wage system" concept is subsumed into the broader "experiment" framing.
      *   **Addresses Father's Friends:** Explicitly states this is *not* about finding profit/competition "bad" ("not about declaring the old way wrong," "certainly not about finding out that profit or competition are bad ideas"), reinforces competition's role as essential discipline.
      *   **10-Year Clause:** Framed as empowerment and the *definition* of real ownership ("trusted with the door"), not a dare or threat.
      *   **The Unknown:** Positioned as the *reason* for the experiment ("curiosity"), not a hedge. The open questions are stated plainly.
  6.  **Ending:** Focuses on the willingness to "find out," "see what we can make of it," and "work." Avoids false confidence or grand predictions. Grounded in action.

  This structure delivers the complex philosophical core (Mill's experimental socialism) in accessible, concrete terms relevant to the audience and the occasion, while meticulously navigating the stated constraints and sensitivities. Good luck.
