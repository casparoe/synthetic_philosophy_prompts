  **Instructions:** Answer each question based on reasoned reflection on cases (canonical and invented). Proceed down branches until a leaf is reached.  

  1. **Q1: Does the newborn’s inborn endowment include *any* incipient orientation toward recognizable moral reactions (e.g., alarm/concern at a child near a well)?**  
