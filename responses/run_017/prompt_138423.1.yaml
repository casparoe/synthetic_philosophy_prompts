answer: |-
  **DEPARTMENT OF CONTHINGENCY, LOGISTICS, AND ABSTRACT PROCEDURES (CLAP)**

  **Standing Committee on Effective Calculability (SCEC)**

  **[Docket No. SCEC-2024-0001]**

  **Notice of Proposed Rulemaking: Classification of the Epistemic Status of the Church-Turing Thesis**

  **AGENCY:** Standing Committee on Effective Calculability (SCEC), Department of Conthingency, Logistics, and Abstract Procedures (CLAP).

  **ACTION:** Notice of proposed rulemaking; request for comments.

  **SUMMARY:** Pursuant to the Administrative Procedures for Ontological Stabilization Act (APOSA), 5 U.S.C. § 701 *et seq.*, and its mandate to ensure clarity and operational certainty in foundational computational concepts germane to federal procedure, the Standing Committee on Effective Calculability (SCEC) proposes to establish a definitive administrative classification for the epistemic status of the proposition commonly known as the Church-Turing Thesis (CTT). This Notice seeks public comment on the proposed rule and its supporting findings.

  **DATES:** Comments must be received on or before [Date 60 days after publication in the Federal Register].

  **ADDRESSES:** Submit comments electronically via the Federal eRulemaking Portal: https://www.regulations.gov (follow the instructions for submitting comments). Include Docket No. SCEC-2024-0001.

  **FOR FURTHER INFORMATION CONTACT:** Dr. Algernon Recursal, Chief Epistemic Officer, SCEC, telephone (555) 101-0101, or email recursal.a@clap.gov. Hearing or speech-impaired individuals may call the Federal Relay Service at 1-800-877-8339.

  **SUPPLEMENTARY INFORMATION:**

  **I. Background and Authority**
  The Church-Turing Thesis (CTT) constitutes a foundational proposition within theoretical computer science and cognate disciplines concerning the nature of mechanical computation. Despite its ubiquitous acceptance and practical utility in demarcating the boundaries of algorithmic process design, verification, and complexity analysis across numerous federal agencies, its precise epistemic standing remains formally unratified. This ambiguity introduces potential ontological risk into regulations and procedures reliant upon computational definitions. SCEC, under authority granted by APOSA § 5(b)(7) ("To classify and stabilize foundational epistemic claims pertaining to effective procedure"), proposes this rule to resolve this ambiguity through administrative classification, thereby enhancing regulatory certainty.

  **II. Findings**

  Based on preliminary review, public workshop summaries, and meta-procedural analysis, SCEC preliminarily finds:

  1.  **Informal/Formal Duality:** The CTT pairs an informal, intuitive notion ("that which can be calculated by a human being following explicit, finite rules with paper and pencil, given unlimited time and resources") with a precisely defined formal class (functions computable by a Turing Machine, or equivalent formalism). This duality is inherent to the thesis's formulation and historical significance.
  2.  **Proof Impediment:** A deductive proof establishing the equivalence between the informal notion and the formal class is deemed unattainable. Any attempt to formalize the informal notion ("human computability") either presupposes the equivalence it seeks to prove (circularity) or results in a distinct, rigorously provable equivalence between *two formalisms* (e.g., Turing Machines and Lambda Calculus), bypassing the core informal/formal linkage of the original CTT.
  3.  **Evidentiary Basis:** The principal evidence supporting the CTT lies in the robust convergence of multiple, independently motivated formalisms (Turing Machines, General Recursive Functions, Lambda-Definability, Register Machines, Markov Algorithms, etc.) upon the same class of computable functions. While empirically compelling and operationally indispensable, this convergence does not constitute a formal proof of the identification of this class with the informal notion.
  4.  **Variant Theses:** The term "Church-Turing Thesis" commonly refers to at least two distinct propositions:
      *   **CTT-E (Effective Calculability):** The class of effectively calculable functions (informal) coincides with the class of Turing-computable functions (formal).
      *   **CTT-P (Physical Computation):** Any function computable by a physical system operating within known physical laws is Turing-computable.
      Threat models to CTT-P (e.g., hypothetical hypercomputers exploiting exotic spacetime geometries or real-valued analog systems) do not necessarily impugn CTT-E, as CTT-E pertains solely to abstract human-computable procedures under idealized conditions.
  5.  **Definitional Dodge:** The practice of stipulating that "computable" *means* Turing-computable resolves ambiguity lexically but constitutes a terminological choice rather than a substantive validation of the CTT's core claim identifying an informal capability with this formal class. It sidesteps the epistemic question.
  6.  **Epistemic Uncertainty:** Consequently, the CTT occupies an epistemically anomalous position. It is widely treated as effectively true, underpinning vast tracts of theoretical and applied computer science, yet resists formal proof. Its empirical support is profound but indirect, rooted in the failure to discover counterexamples *within the domain it purports to cover* (effective procedures) and the resilience of the convergent formalisms. Its practical unfalsifiability within the realm of abstract procedure contrasts with the potential empirical falsifiability of CTT-P.
  7.  **Need for Classification:** The current lack of a definitive administrative classification for the CTT's status introduces inefficiencies in procedural design, regulatory citation, and pedagogical consistency. SCEC possesses the statutory authority and procedural capacity to remedy this.

  **III. Proposed Rule**

  To resolve the epistemic ambiguity identified above and provide regulatory certainty, SCEC proposes to amend 42 C.F.R. Chapter X by adding Part 900, Subpart G, § 900.701, to read as follows:

  **§ 900.701 Epistemic Classification of the Church-Turing Thesis.**

  (a) **Classification Scheme:** The epistemic status of the Church-Turing Thesis (CTT), encompassing both CTT-E (Effective Calculability) and CTT-P (Physical Computation) variants, shall be administratively classified into one of the following tiers:
      (1) **Tier 1: Settled Theorem.** A proposition formally proven within an accepted axiomatic system.
      (2) **Tier 2: Working Thesis.** A proposition lacking formal proof but possessing strong convergent evidence and serving as an indispensable foundational assumption for ongoing research and practice, subject to potential revision upon compelling counterevidence.
      (3) **Tier 3: Terminological Stipulation.** A definitional convention adopted for clarity, devoid of substantive truth claims beyond its utility.

  (b) **Assigned Classification:** The Standing Committee on Effective Calculability hereby classifies the Church-Turing Thesis (CTT) as follows:
      (1) CTT-E (Effective Calculability) is classified as **Tier 2: Working Thesis.**
      (2) CTT-P (Physical Computation) is classified as **Tier 2: Working Thesis.**

  (c) **Review and Renewal:** This classification shall be subject to mandatory review and potential renewal by SCEC every seven (7) years, commencing from the effective date of this rule. Failure to renew shall result in the classification reverting to "Unclassified - Epistemically Ambiguous."

  (d) **Counterexample Validation:** Any entity asserting a physical counterexample to CTT-P (a "hypercomputer") must submit said counterexample for validation. Validation requires:
      (1) A complete formal specification of the hypercomputer's operational principles.
      (2) Empirical demonstration of the hypercomputer computing a function demonstrably not Turing-computable.
      (3) **Certification Requirement:** The validation procedure itself (including the demonstration and analysis) must be certified by SCEC as implementable by a Turing-computable process. Counterexamples requiring non-Turing-computable procedures for their validation are deemed inadmissible.

  (e) **Self-Referential Consistency:** This Notice, and all procedures undertaken by SCEC related to this classification, are acknowledged to be generated and executed by processes intended to fall within the scope of Turing-computable procedures. This acknowledgment does not prejudge the classification outcome but establishes the operational framework.

  **IV. Request for Comments**

  SCEC solicits public comment on all aspects of this proposed rule, including but not limited to:
  *   The adequacy of the three-tier classification scheme for capturing the epistemic nuances of the CTT.
  *   The appropriateness of assigning both CTT-E and CTT-P to Tier 2 (Working Thesis).
  *   The feasibility and necessity of the seven-year review and renewal requirement.
  *   The reasonableness and potential unintended consequences of the Counterexample Validation procedure, particularly the Certification Requirement (§ 900.701(d)(3)).
  *   Any relevant scientific, mathematical, or philosophical evidence not considered in the preliminary findings.
  *   The potential economic impact or burden of this classification.
  *   Alternative approaches to achieving epistemic clarity regarding the CTT.

  **V. Paperwork Reduction Act**

  This proposed rule contains no new information collection requirements subject to the Paperwork Reduction Act (44 U.S.C. 3501 *et seq.*).

  **Dated:** [Date]
  **By direction of the Standing Committee:**
  **Dr. Elara Functionalia,**
  **Chair, Standing Committee on Effective Calculability.**

  ---

  **Drafter's Note:** This satire targets the inherent tension in treating the Church-Turing Thesis as simultaneously unprovable (due to its informal component), empirically unfalsifiable in practice (for CTT-E, as any concrete procedure can be formalized, begging the question), and yet more secure than typical empirical hypotheses. The reductio lies in the Committee earnestly applying bureaucratic tools (classification tiers, renewal cycles, validation procedures) to a proposition whose resistance to such treatment *is the point*.

  *   The **classification scheme's inadequacy** mocks the attempt to force the thesis into neat epistemic boxes. A **"Definition" defender** would argue §900.701(b) misses the point: CTT-E *is* the definition, so Tier 3 is the only coherent choice, making Tier 2 absurd. An **"Empirical Claim" defender** would find the Certification Requirement (§900.701(d)(3)) particularly unfair, as it artificially shields CTT-P from physical counterexamples by demanding they be validated using only computable methods, effectively assuming the conclusion. A **"Quasi-Empirical" defender** might object that the notice undervalues the immense weight of convergent evidence and practical failure to find counterexamples *within its intended domain*, rendering the Tier 2 classification and renewal requirement an unnecessary trivialization of its de facto status.
  *   The **Certification Requirement** explicitly embodies the circularity a defender of CTT-E as definition would embrace, but applies it absurdly to CTT-P as an empirical claim.
  *   The **Self-Referential Consistency** clause highlights the thesis's role as the assumed foundation of the very process trying to adjudicate it.

  **Bottom line:** The Church-Turing Thesis, particularly its CTT-E variant, remains fundamentally unprovable yet pragmatically indispensable, a status impervious to bureaucratic ratification.
