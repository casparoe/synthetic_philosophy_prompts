prompt: |-
  I'm a TA and I've got one fifty-minute section next week on indicative vs counterfactual conditionals, for first-years who finished truth tables last week — so they're all walking around thinking 'if' is the horseshoe and that any conditional with a false antecedent is automatically true. Don't explain the material to me; plan how I should teach it.

  What I want from you: what has to come first and what actually depends on what (I'm guessing the Kennedy pair — 'if Oswald didn't shoot Kennedy, someone else did' vs 'if Oswald hadn't, someone else would have' — has to land before any talk of possible worlds or similarity, but tell me if I've got it backwards); the one example that should carry the whole session and what it needs to have and lack; and the misconceptions to expect, with the point in the sequence where each should get defused. The ones I'm most worried about: counterfactuals being 'just indicatives with a fake past tense', every false-antecedent counterfactual being vacuously true or else having no truth value at all, 'would' collapsing into 'might', and backtracking cases like 'if the match had lit, I'd have struck it'.

  I'd also like to sneak in semifactuals — 'even if' — since they break the tidy indicative/subjunctive split, but I can't tell whether that's the best payoff of the session or a distraction I should drop. Say which, and why. Then give me one closing question that tells me they understood rather than just picked up a slogan, and say openly what I should refuse to explain at this level.
reasoning: |-
  Okay, the user is a TA preparing a fifty-minute session for first-year students on indicative vs. counterfactual conditionals. The students just finished truth tables and are stuck on the material implication view where any false antecedent makes the conditional true. The TA wants a lesson plan focusing on sequence, a central example, misconceptions, and whether to include semifactuals.

  First, I need to structure the session logically. Start with revealing the problem with material implication. Using the Oswald example makes sense because it shows how the same antecedent can lead to different interpretations. Indicative: "If Oswald didn't shoot Kennedy, someone else did" (historical context). Counterfactual: "If Oswald hadn't shot, someone else would have" (hypothetical scenario). This contrast highlights that truth values aren't just about antecedent truth.

  Next, the core example needs to be simple and relatable. A match lighting scenario works well. "If I strike this match, it will light" (indicative) vs. "If I had struck it, it would have lit" (counterfactual). This example avoids historical complexities and clearly shows the difference in meaning. It also allows introducing possible worlds without getting too technical. Emphasize that counterfactuals involve hypothetical worlds where the antecedent is true, and we evaluate based on similarity to the actual world.

  Misconceptions are crucial. Students might think counterfactuals are just indicatives with past tense. Point out that "would" indicates hypotheticality, not tense. Another issue is vacuously true false-antecedent conditionals. Clarify that counterfactuals aren't vacuously true; they depend on closeness of possible worlds. Also, "would" vs. "might" confusion: "would" implies certainty in the closest worlds, while "might" suggests possibility. Backtracking, like the match example where lighting implies it was struck, can be addressed by discussing normal vs. abnormal conditions.

  Semifactuals ("Even if...") are worth including because they challenge the binary split. Using the match example: "Even if I had struck it, it wouldn't have lit" shows a true antecedent in some worlds but false consequent, highlighting non-vacuity. It reinforces that truth depends on possible worlds, not just antecedent falsity.

  The closing question should test understanding beyond memorization. Asking them to invent pairs where one conditional is true and the other false based on context ensures they grasp the difference. Avoid explaining similarity metrics or strict possible worlds semantics at this level; keep it intuitive.

  The TA's deeper needs include building intuition over technicalities, preventing ingrained misconceptions, and making the session engaging. They need a clear, step-by-step approach that connects examples to concepts, addresses common pitfalls in real-time, and provides a solid foundation without overwhelming students.
answer: |-
  Here's a battle-tested plan for your fifty-minute section, prioritizing conceptual leverage over formalism:

  **Core Principle:** **Shatter the "Material Implication = Natural Language If" illusion FIRST.** Everything else builds on recognizing this limitation.

  ### Sequence & Dependencies

  1.  **The Crisis (10 mins):**
      *   **First:** Hit them with the **Kennedy Pair** IMMEDIATATELY. Don't introduce terms yet.
          *   Write:
              *   (A) "If Oswald didn't shoot Kennedy, someone else did."
              *   (B) "If Oswald hadn't shot Kennedy, someone else would have."
          *   **Pose:** "Assuming Oswald *did* shoot Kennedy (antecedent false for both), are (A) and (B) both *automatically true* according to the truth table? Does that match our intuition? What's the difference in *meaning*?"
      *   **Why First?** This directly confronts the material implication fallacy head-on using a high-stakes, memorable example. It creates a *need* for a distinction before labeling it. Students immediately see that truth-table "truth" feels wrong for (B) and that (A) and (B) express fundamentally different ideas despite identical antecedent falsity.
      *   **Key Insight:** The truth value of a conditional isn't solely determined by the truth values of its parts in the actual world; it depends on *how* we consider alternative scenarios.

  2.  **Labeling the Distinction (5 mins):**
      *   Introduce terms: **Indicative Conditional** (A) vs. **Counterfactual Conditional** (B).
      *   **Connect:** "The indicative (A) is making a claim *within* our understanding of the actual world's history – it's about evidence or historical possibility. The counterfactual (B) is explicitly talking about a *hypothetical scenario we know is false* (Oswald didn't shoot) and what *would* follow in that imagined world."
      *   **Dependency:** The Kennedy pair *must* land first. This labeling makes sense *because* they've already felt the difference.

  3.  **The Core Example & Building Intuition (15 mins): The Match**
      *   **Introduce:** "Imagine I have a dry match, I know it's reliable, I have dry fingers, oxygen is present, etc. I choose *not* to strike it."
      *   **Write:**
          *   Indicative: "If I strike this match, it will light." (True? Seems plausible based on conditions)
          *   Counterfactual: "If I had struck that match, it would have lit." (True? Also seems plausible)
      *   **Now Twist:** "Imagine I *did* strike it, but it was secretly damp (I didn't know). It didn't light."
      *   **Re-evaluate:**
          *   Indicative (said *before* striking): "If I strike this match, it will light." (False! Conditions weren't as I thought)
          *   Counterfactual (said *after* it failed): "If I had struck that match, it would have lit." (False! We know it was damp)
      *   **Why The Match Works:**
          *   **Lacks:** Historical/political baggage, complex metaphysics.
          *   **Has:** Intuitive physical causation, simple variables (strike, dryness, oxygen), clear true/false intuitions, easy to manipulate the scenario (change dryness, change outcome).
          *   **Crucial Manipulation:** Vary the *actual world* state (dry vs. damp) and the *speaker's knowledge* (before vs. after) to show how truth judgments shift *independently* for indicative vs. counterfactual, *especially* when the antecedent is false. This directly kills the "vacuously true" idea.

  4.  **Introducing "Possible Worlds" Lightly (10 mins - Anchored in The Match)**
      *   **Don't:** Start with complex similarity metrics or Lewis/Stalnaker formalism.
      *   **Do:** "To evaluate the counterfactual 'If I had struck it, it would have lit,' we imagine a *very similar world* to ours, almost identical, except *in that world, I did strike the match*. What happens in *that* very close world? If, in most of the closest worlds where I strike it, it lights (because it was dry), the counterfactual is true. If in the closest worlds it doesn't light (because it was damp), it's false."
      *   **Connect to Kennedy:** "For 'If Oswald hadn't shot, someone else would have,' we imagine a world very similar to 1963 Dallas up until the moment, but Oswald doesn't pull the trigger. Does a different shooter plausibly step in *in that specific scenario*? If yes (Conspiracy?), counterfactual true; if no (Lone nut?), false."
      *   **Dependency:** Possible worlds are *needed* to explain *why* the counterfactual isn't vacuously true and *how* we judge it. The Match/Kennedy examples make this intuitive necessity clear first.

  5.  **Tackling Misconceptions (Integrated & Proactive)**
      *   **"Counterfactuals = Indicative + Fake Past Tense":** DEFUSE IMMEDIATELY after labeling (Step 2). Point to Kennedy (B): "Is 'hadn't shot'/'would have' *just* about past time? No! Oswald shooting *is* past. The difference is *hypotheticality* about what *didn't* happen. 'Would' signals the counterfactual mood, not tense." Use Match counterfactual ("had struck"/"would have lit") to reinforce – it's about an unrealized possibility, not grammar.
      *   **"Vacuously True or No Truth Value":** DEFUSE HARD during Steps 1 (Kennedy - "Is B *true* just because Oswald shot? Feels wrong!") and Step 3 (Match - damp case: Antecedent false, counterfactual clearly *false*). Emphasize: Counterfactuals have truth values based on close possible worlds. "Vacuously true" only applies to material implication, which is inadequate for natural language 'if'.
      *   **"'Would' Collapsing into 'Might'":** DEFUSE when discussing possible worlds with The Match. Contrast: "If I had struck it, it *would* have lit" (In all closest worlds, it lights) vs. "If I had struck it, it *might* have lit" (In some close worlds it lights, in others it doesn't - maybe it was borderline damp). Stress: 'Would' implies a strong connection/high probability in the closest worlds; 'might' acknowledges possibility without certainty.
      *   **Backtracking (Match Lighting -> Must Have Struck It):** DEFUSE proactively when introducing possible worlds with The Match. Explicitly state: "We usually imagine the change (striking) happening *at the last moment*, keeping everything else as similar as possible *just before* that. We *don't* imagine changes earlier that would *cause* the striking (like me deciding differently earlier), unless the context forces it. The match lighting *depends* on it being struck in the normal way." Acknowledge backtrackers exist ("If she were happy, she'd have gotten the job" -> implies the job caused happiness) but say they are special cases relying on different similarity judgments (prior causes held fixed).

  6.  **Semifactuals: Include! (5 mins)**
      *   **Why:** It's a high-impact payoff, not a distraction. It reinforces the core lesson: truth depends on possible worlds, not antecedent falsity.
      *   **How:** Use The Match *again*. Scenario: The match *was* damp, I *didn't* strike it, it *didn't* light.
          *   Counterfactual: "If I had struck it, it *would not* have lit." (True)
          *   **Semifactual:** "Even if I *had* struck it, it *would not* have lit." (Also True!)
      *   **Point:** "See? Both have a false antecedent ('I struck it'). The counterfactual is true because it was damp. The semifactual is *also* true! It emphasizes that the consequent ('not light') was *inevitable* regardless of the antecedent. It breaks the simplistic 'false antecedent = true conditional' rule twice over and shows counterfactuals aren't *just* about what *would* happen, but sometimes about what *wouldn't* change."

  **Closing Question (5 mins):**
  *   **Question:** "Invent *one* scenario (like my match) where the indicative conditional 'If A, then C' is *false*, BUT the counterfactual 'If A had happened, C would have happened' is *true*. Explain briefly *why* using the idea of close possible worlds."
  *   **Why it Works:** It forces application, not regurgitation. Good answers will involve unknown preventing conditions in the actual world (like the damp match, a bomb with a hidden dud trigger, a student thinking they studied the wrong material but it was actually the right one). It tests understanding of the indicative's sensitivity to actual conditions vs. the counterfactual's reliance on close worlds. *Listen for:* Mentions of difference between actual world knowledge/facts vs. hypothetical close-world outcomes.

  **What to REFUSE to Explain (At This Level):**
  *   **Detailed Similarity Metrics:** Don't get bogged down in how to *precisely* order possible worlds (Lewis's system, temporal forks, etc.). Stick to "very similar, minimal change".
  *   **Formal Semantics (Stalnaker/Lewis):** No selection functions, system of spheres, or strict possible worlds ontology. Keep it intuitive: "imagining close alternatives".
  *   **Probabilistic Approaches:** Don't introduce P(C|A) vs. P(C|A and relevant background) yet. Focus on the categorical truth-conditional distinction they can grasp intuitively.
  *   **The Logic of 'Even If':** Don't formalize its relationship to negation or conjunction. Show its effect through the match example.
  *   **All Counterexamples/Edge Cases:** Avoid tricky examples like Sobel sequences or blatant backtrackers unless a very sharp student brings one up. Stay focused on the core contrast.

  **Why This Sequence Works:**
  1.  **Problem First (Kennedy):** Creates cognitive dissonance with material implication.
  2.  **Labeling After Intuition:** Terms make sense *because* they solve the problem.
  3.  **Core Example (Match):** Provides a simple, manipulable model for exploring the distinction and possible worlds intuition.
  4.  **Integrated Misconception Busting:** Tackles errors head-on where they naturally arise.
  5.  **Semifactual as Payoff:** Uses the core example to elegantly demonstrate the power of the framework.
  6.  **Closing Application:** Forces synthesis and deeper understanding.

  Good luck! Your awareness of the misconceptions means you're already halfway there. Focus on creating the "aha" moment that material implication isn't the whole story.
