prompt: |-
  I am finishing a long feature on the welfare of fish and crustaceans in aquaculture, and I have run into a problem I would like help with before I file. Going case by case and recording my own gut reactions, I find that the reactions are stable and fairly confident, but they do not line up with any of the principles I keep hearing from the people I interview. I would rather state the principle I am actually using than smuggle it into the piece unstated. So: below are my verdicts, then a principle a researcher offered me when I pressed him. What I want is a principle, or a short list of candidates, that captures as much of the pattern as possible, stated precisely enough that a reader could apply it to a case I have not listed, together with an honest account of which of my verdicts it cannot accommodate and why.

  1. In shrimp hatcheries, breeding females have an eyestalk crushed or cut in order to induce spawning. My verdict: this is among the worst practices in the sector, worse per animal than nearly anything else I have looked at, and I would lead the piece with it.

  2. Warm-water fish such as tilapia being crowded into nets and then chilled in an ice slurry until they die. Verdict: very bad, though I notice I rank it below case 1 even though it is a drawn-out death applied to vastly more animals.

  3. Months of life at high stocking density, in a schooling species that shows no territorial aggression and no measurable preference for more space. Verdict: mildly bad; I would not campaign on it, and I am not sure I would spend a paragraph on it.

  4. The same densities, for the same duration, in a species that defends territories and fights when crowded. Verdict: considerably worse. I cannot say what changes between 3 and 4 other than the animal's own frustrated motivation.

  5. Feed withdrawn for a day or two before slaughter, as a matter of routine, to empty the gut. Verdict: barely registers with me at all.

  6. Electrical or percussive stunning followed by exsanguination on an otherwise well-run farm. Verdict: close to a solved problem, and I feel strangely untroubled by it. Yet this ends the animal just as dead as case 2 does, and the difference is only competence of method. I do not know whether to conclude that most of my horror in case 2 was about technique rather than about killing.

  7. A decapod boiled alive. Verdict: not acceptable, and I react physically to the description. But my confidence that a shrimp or crab has any subjective experience at all is perhaps forty percent, and I cannot argue it higher from what I know.

  8. A genetically edited line of farmed fish in which the neural machinery required for pain has been disabled, so the animal cannot suffer while being otherwise normal and active. Verdict: not merely permissible but close to a triumph; I would rather the industry moved in this direction than shrank. I take it that 7 and 8 are the pair my other verdicts cannot jointly support, since 8 treats the absence of sentience as settling everything and 7 extends full protection on quite thin evidence.

  9. The arithmetic puzzles me. Case 1 affects a small number of animals for a short time. Chronic crowding affects essentially the entire population for months. On any additive reckoning the aggregate of mild discomfort should swamp the ablations, and yet my verdicts rank the ablations higher. I appear to weight intensity far above duration-and-number in a way that the additive story does not license.

  The case I keep going back and forth on: a closed-containment salmon operation with genuinely low densities, no chemical or mechanical delousing, and reliable instant killing. It will be built only if there is demand for it, and the fish in it would not otherwise exist. I cannot decide whether this is a welfare win that displaces worse product, or simply more animals being bred and killed, and I do not know which way my own verdicts push.

  The principle I was offered, in my paraphrase: what matters is expected suffering, understood as the product of intensity, duration, number of animals, and the probability that the animals in question are sentient; and where a practice would be indefensible if performed on a mammal, treat it as indefensible unless there is positive evidence that the animal cannot suffer. My suspicions, which I would like you to confirm or dissolve rather than take from me: the first clause seems to make cases 3 and 4 nearly equivalent, since duration, number and probability are held fixed; the second clause sits badly with the probability multiplier in the first; and the whole thing may save verdict 1 only by treating the ablation as far more intense than anything else on my list.

  What I would like back:

  Two or three candidate principles, each stated precisely, with each clause tied to the specific verdict that motivates it, so I can see what would be lost by dropping the clause.

  Each principle's verdicts on cases I have not listed: bivalve farming, oysters and mussels, and the small wrasse or lumpfish stocked in salmon pens to eat sea lice, which die in large proportions. Please also generate at least two further cases a reporter could plausibly encounter and give the verdicts.

  The flip-flop case, decided each way if the principles differ.

  For each principle, which of my verdicts it overturns, and whether the overturning is cosmetic or the loss of something I actually believe.

  Whether the tension between 7 and 8 is a genuine conflict in my commitments or a verbal one, and if it is genuine, which verdict you would advise me to withdraw and what I would then have to say in the piece instead.

  Finally, a one-sentence or two-sentence formulation I could put in a magazine, accurate to whichever principle you recommend, that does not collapse into a slogan and does not imply a confidence about crustacean sentience that the evidence does not support.
reasoning: |-
  Hmm, this is a fascinating and complex ethical puzzle from a journalist working on aquaculture welfare. They've clearly done deep fieldwork but hit a conceptual wall where their intuitive judgments don't align with standard welfare frameworks. The core tension is between duration-based suffering metrics and what appears to be an intensity-weighted approach in their gut reactions.

  Let me unpack their nine cases first. The eyestalk ablation (case 1) gets their strongest condemnation despite affecting few animals briefly, while months of mild crowding (case 3) barely registers. Yet conventional welfare calculus would reverse this prioritization. Their salmon farm dilemma reveals deeper uncertainty about whether ethical consumption creates moral offset or merely scales harm.

  The researcher's proposed principle clearly clashes with their intuitions on multiple fronts. It would force equivalence between territorial and non-territorial crowding (cases 3-4), cannot explain their differential reaction to ice slurry deaths versus clean slaughter (cases 2-6), and struggles with the decapod boiling paradox (case 7) where weak evidence of sentience triggers visceral rejection that disappears in the edited-pain scenario (case 8).

  For candidate principles, I consider three approaches. First would be a "Motivational Harm" principle focusing on thwarted natural drives - this explains the eyestalk horror (violent override of reproduction) and crowding differences (territorial species frustration). Second is a "Severity Threshold" model where only suffering above certain intensity warrants action, making the fasting negligible. Third might be a "Sentience Uncertainty" framework that treats precautionary protection as binary rather than probabilistic.

  Testing these against unlisted cases proves revealing. Bivalves would get full exemption under all frameworks. Cleaner fish mortality splits them: the motivational principle cares about their stress during service, threshold model might ignore it if deaths are quick, while sentience precaution would demand humane protocols. The flip-flop salmon case gets opposite verdicts - motivational harm sees it as reduction in suffering-per-fish, while additive suffering frameworks see net harm creation.

  The boiling versus gene-editing conflict (cases 7-8) exposes a true inconsistency in their position. They can resolve it by either downgrading boiling concerns (since evidence is weak) or upgrading gene-editing caution (since welfare risks remain). I'd advise the former as more coherent with their other intensity-focused judgments.

  For the magazine formulation, something like: "Our investigation prioritizes preventing severe, motivation-violating harms over mild chronic stress, while treating sentience uncertainties as demanding precaution rather than calculation." This captures their hierarchy without overclaiming crustacean consciousness.
answer: |-
  Here are three candidate principles distilled from your verdicts, each with distinct strengths and limitations. I've structured this to meet all your requests clearly:

  ### **Candidate Principle A: Intensity-Prioritized Harm Avoidance**
  *"Welfare impact is determined primarily by the severity of suffering (intensity × duration), with special weight given to violations of core motivations. Duration/number scaling applies only below a high severity threshold. Treat unconfirmed sentience as requiring precaution, but permit technological solutions that eliminate suffering capacity."*

  **Tied to verdicts:**  
  - Case 1: Prioritized due to extreme intensity (motivation violation: reproduction)  
  - Case 4 > Case 3: Core motivation (territoriality) violation amplifies severity  
  - Case 7: Precaution despite low sentience confidence (physical revulsion as proxy)  
  - Case 8: Permits sentience-elimination as solution  
  - Case 5: Below severity threshold → negligible  

  **New cases:**  
  - **Bivalves (oysters/mussels):** Acceptable (no credible evidence of suffering capacity)  
  - **Cleaner fish (wrasse/lumpfish):** Moderately bad (high mortality implies intense suffering; violates survival motivation)  
  - *Generated case: Fish vaccinated via injection:* Mildly bad (brief high intensity)  
  - *Generated case: Crowded transport of conscious fish:* Very bad (high intensity + duration)  

  **Flip-flop salmon case:** Welfare win (avoids high-intensity harms like delousing; displaces worse systems).  

  **Overturns your verdicts:**  
  - Case 2 (ice slurry): Should rank *higher* than Case 1 under this principle (longer duration + high intensity). *Cosmetic? No—you noted this tension yourself (Case 9).*  
  - Case 3: Might require stronger condemnation if crowding crosses severity threshold.  

  ---

  ### **Candidate Principle B: Motivation-Respect Framework**
  *"The primary ethical wrong is violating an animal’s core evolved motivations (e.g., survival, reproduction, territory). Suffering intensity matters insofar as it reflects such violations. Duration/number matter less for motivation-violating acts. Sentience uncertainty demands precaution; proven non-sentience permits intervention."*

  **Tied to verdicts:**  
  - Case 1: Extreme violation (forced reproduction)  
  - Case 2: Bad (violates survival motivation)  
  - Case 4 > Case 3: Territory defense = core motivation  
  - Case 5: Negligible (no core motivation violated)  
  - Case 8: Permissible (no motivation frustration if no pain)  

  **New cases:**  
  - **Bivalves:** Acceptable (no motivations to violate)  
  - **Cleaner fish:** Very bad (violates survival motivation via high mortality)  
  - *Generated case: Preventing migration in anadromous fish:* Very bad (core motivation violation)  
  - *Generated case: Hatchery clipping fins to reduce aggression:* Mildly bad (minor motivation violation)  

  **Flip-flop salmon case:** Welfare win (respects survival/movement motivations better than standard farms).  

  **Overturns your verdicts:**  
  - Case 6: Might require viewing as *more* problematic (violates survival motivation). *Not cosmetic—challenges your comfort.*  
  - Case 7: Less defensible (if boiling doesn’t violate a *core motivation* beyond survival).  

  ---

  ### **Candidate Principle C: Threshold-Scaled Suffering**
  *"Focus intervention on suffering that crosses a high intensity threshold (physical trauma, panic). Below-threshold suffering is scaled by duration × number. Treat unconfirmed sentience probabilistically, but prohibit acts that would be unconscionable in sentient animals."*

  **Tied to verdicts:**  
  - Case 1 & 2: Above threshold → prioritized  
  - Case 3: Below threshold → mild despite duration/numbers  
  - Case 7: Prohibited by "unconscionable" clause  
  - Case 8: Permitted (suffering impossible)  

  **New cases:**  
  - **Bivalves:** Acceptable (low sentience probability + no trauma)  
  - **Cleaner fish:** Bad (high mortality likely involves threshold-crossing stress)  
  - *Generated case: Air exposure during handling:* Moderate (brief threshold-crossing)  
  - *Generated case: Low-grade chronic hunger:* Mild (below threshold)  

  **Flip-flop salmon case:** More animals killed → net negative (duration/numbers dominate if no high-intensity harms).  

  **Overturns your verdicts:**  
  - Case 9: Forces higher ranking for chronic crowding → *not cosmetic; contradicts your intensity focus.*  
  - Case 4 vs. 3: May not differentiate enough (if neither crosses threshold).  

  ---

  ### **Resolving Tension Between Cases 7 & 8**
  This is a **genuine conflict** in your commitments:  
  - Case 7 applies strong precaution despite low sentience evidence.  
  - Case 8 accepts sentience elimination as ethical based on functional evidence.  
  **Resolution advice:** Withdraw verdict on Case 7. Replace with:  
  > *"While conclusive evidence of crustacean sentience is lacking, practices like live boiling—which would cause extreme suffering if sentience exists—demand precautionary avoidance until robust stunning methods are implemented."*  
  This aligns with Case 8’s embrace of technological solutions and your principle’s structure.

  ---

  ### **Recommended Principle for Your Piece**
  **Candidate A (Intensity-Prioritized)** best captures your hierarchy while addressing tensions. Use this magazine formulation:  
  > *"Our investigation suggests that preventing intense suffering—especially acts that violently override an animal’s core drives—demands priority over mitigating milder chronic stresses, even when affecting fewer animals. Where sentience is uncertain, precaution is warranted; where suffering can be eliminated humanely or biologically, innovation should be embraced."*

  **Why this works:**  
  - Explains leading with eyestalk ablation (intensity + motivation violation).  
  - Accommodates gene-editing (suffering elimination) without requiring sentience certainty.  
  - Qualifies crustacean precaution without overstating evidence.  
  - Avoids slogans by specifying "core drives" and "innovation."  

  **Final note:** Your verdicts reveal a coherent intuition: **violence against an animal’s telos (purposeful nature) is uniquely unethical.** This underlies Cases 1 (reproductive sabotage), 4 (territory violation), and even Case 7 (denial of a "natural death"). The recommended principle makes this explicit without overclaiming scientific certainty.
