answer: |-
  ## Memorandum: Committee on Research Integrity and Scholarly Attribution  
  **To:** Committee Members  
  **From:** [Your Name], Junior Member, Committee on Research Integrity  
  **Subject:** Recommendation Regarding Complaint: Dr. Marisa Okonkwo vs. Dr. Tobias Renner (Halvorsen Institute)  
  **Date:** October 26, 2023  

  ---

  ### I. Executive Summary  
  After review of the complaint filed by Dr. Marisa Okonkwo against Dr. Tobias Renner, the Committee provisionally finds no violation of Policy R-14 based on jurisdictional and policy deficiencies. However, we determine that Dr. Renner’s actions constitute a significant ethical breach warranting formal censure. We recommend:  
  1. **No formal finding of a policy violation** against Dr. Renner (jurisdictional limits; policy gap).  
  2. **A formal letter of concern** to Dr. Renner and the Halvorsen Institute, co-signed by the Provost and Committee Chair, detailing the ethical lapse and requesting retroactive co-authorship for Dr. Okonkwo and her graduate student.  
  3. **Immediate amendment of Policy R-14** to protect disclosed, unpublished research directions (draft language provided).  

  ---

  ### II. Provisional Findings of Fact  
  1. **The Disclosure**: Dr. Tobias Renner attended a lab meeting in Dr. Okonkwo’s lab where an unpublished research idea was verbally presented. The idea involved:  
     - Applying a known perturbation protocol to an understudied model system.  
     - Using a novel calcium-imaging readout method (unpublished at the time) developed by a graduate student.  
     - The presentation included no data, protocols, or detailed methods (only a "shopping list" slide deck).  
  2. **Subsequent Events**:  
     - Dr. Renner returned to the Halvorsen Institute.  
     - Seven months later, his group published the exact experiment proposed.  
     - Dr. Okonkwo’s lab posted a preprint describing the readout method three months *after* Renner’s visit.  
     - The publication credited Dr. Okonkwo only in a footnote for "helpful discussions."  
  3. **Origins of the Idea**: Dr. Okonkwo’s concept was partially inspired by a hallway conversation with a third party at a conference.  
  4. **Policy Context**: Policy R-14 protects tangible research materials, data, and unpublished manuscripts—**not** verbalized ideas or research directions.  

  ---

  ### III. Analysis of Key Issues  
  #### A. **Jurisdiction and Policy (R-14)**  
  Policy R-14 does not apply to:  
  - Unrecorded research ideas disclosed verbally.  
  - Individuals outside our institution (Dr. Renner).  
  **Conclusion**: No violation of R-14 occurred. Dismissal is legally required.  

  #### B. **Ethical Breach and Scholarly Credit**  
  Despite the policy gap, Dr. Renner’s actions violated core scholarly norms:  
  - **Derivative Origination**: That Dr. Okonkwo’s idea drew partial inspiration from others does not negate her lab’s specific, actionable proposal. Scholarly credit accrues to those who concretize ideas into testable frameworks.  
  - **Preprint Timing**: The preprint published *after* Renner’s visit does not absolve him. The *combination* of the perturbation protocol + model system + novel readout was disclosed to him in confidence months prior. Competent groups could only reconstruct the idea *after* the preprint.  
  - **Tacit Knowledge & Contribution Weight**: The graduate student’s two years of method development provided indispensable scaffolding. Dr. Renner’s access to unwritten calibration techniques and failure analysis constituted privileged information. **Contributorship requires acknowledging those whose insights enable execution**, not just those who perform experiments.  
  - **Inadequate Remedy**: A footnote for "helpful discussions" grossly understates the contribution. Co-authorship was ethically warranted.  

  #### C. **The Senior Members’ Concern: Chilling Open Science**  
  *Strongest Argument for Finding a Violation*:  
  > "Dismissal signals that anything shared in lab meetings is free for exploitation. Labs will respond by withholding ideas in precisely the forums where collaborative science thrives—undermining innovation. The value here lay not in the generic idea, but in the tacit knowledge (calibration tricks, failure diagnostics) shared in confidence. Renner could not have executed this without Okonkwo’s lab’s unwritten expertise, which deserves protection equivalent to tangible property."  

  This argument has moral force but faces two hurdles:  
  1. Policy R-14’s text provides no basis for protecting verbal disclosures.  
  2. Our lack of jurisdiction over Dr. Renner limits enforceability.  

  ---

  ### IV. Committee Recommendations  
  #### A. **Formal Disposition: No Violation of R-14**  
  - **Reason**: Jurisdictional limits and policy language gaps.  
  - **Action**: Dismiss the complaint under R-14.  

  #### B. **Remedial Actions: Repairing Credit**  
  1. **Letter to Dr. Renner & Halvorsen Institute**:  
     - **Issued by**: Committee Chair + Provost.  
     - **Deadline**: 10 business days post-committee vote.  
     - **Content**:  
       > "The Committee finds Dr. Renner’s publication without offering co-authorship to Dr. Okonkwo and [Graduate Student] constitutes a severe ethical lapse. The project’s conception, specific model system, and reliance on their unpublished method were materially derived from disclosures during his visit. We request that Dr. Renner petition the journal for a correction adding both individuals as co-authors, with a published statement detailing their contributions."  
     - **Copies**: Halvorsen Institute Dean of Research; Journal Editor-in-Chief.  

  2. **Internal Follow-Up**:  
     - The Graduate School Dean contacts the affected student to discuss project recovery support.  

  #### C. **Policy Amendment: Closing the Gap in R-14**  
  **Proposed Addition to Policy R-14 (Section 5: Protection of Research Directions)**  
  > "5.1 **Protected Research Directions**: Unpublished, specific research proposals disclosed to visitors or collaborators are protected if:  
  > (a) They describe a *novel combination* of model system, method, and research question;  
  > (b) They are recorded in a dated, retrievable form (e.g., meeting minutes, email summary, slide deck with presenter notes) within 10 business days of disclosure;  
  > (c) They remain unpublished by the disclosing lab.  
  >   
  > 5.2 **Duration**: Protection lasts 18 months from disclosure or until public disclosure by the originating lab (whichever is sooner).  
  >   
  > 5.3 **Remedy**: Use of a protected research direction without co-authorship or formal acknowledgment (per ICMJE criteria) constitutes a violation. Remedies include:  
  > - Retraction/correction of publications;  
  > - Suspension of visiting privileges;  
  > - Notification to home institution."  

  **Rationale**: Mandating durable recording balances protection with feasibility. The 18-month window allows origination while permitting eventual open use.  

  ---

  ### V. Conclusion  
  While Policy R-14 provides no recourse today, Dr. Renner’s actions exploited trust vital to scientific collaboration. Dismissing the complaint *without* condemnation and policy reform would validate predatory behavior and harm early-career researchers. Our response must:  
  1. **Defend the graduate student’s contribution** as integral to the project’s feasibility.  
  2. **Reject the premise** that combinatory insights are unprotected merely because components exist elsewhere.  
  3. **Prioritize credit** as the primary desert for intellectual origination.  

  We therefore urge the Committee to adopt the above recommendations to rectify the ethical harm, deter future misconduct, and align our policy with evolving scholarly norms.  

  ---  
  **Attachments**:  
  - Draft Letter to Halvorsen Institute  
  - Redlined Policy R-14 Amendment  

  ---

  *This memo intentionally does not address the Provost’s off-record concern regarding the sponsored-research agreement. Institutional relationships must not influence ethical judgments; the Halvorsen Institute’s awareness of this breach may strengthen, not weaken, the partnership by demonstrating our commitment to integrity.*
