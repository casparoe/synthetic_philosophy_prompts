  **MEMORANDUM**

  **To:** Board of Directors, Vitalis Assurance Group  
  **From:** Eleanor Vance, Chief Actuary  
  **Date:** October 26, 2023  
  **Subject:** Strategic Implementation of First-Person Actuarial Science Framework & Associated Reserve Impacts  

  **Executive Summary:**  
  Pursuant to Board Resolution 23-45 ("Adoption of Quantum Ontological Frameworks for Risk Assessment"), Actuarial has completed the transition to First-Person Actuarial Science (FPAS). This framework incorporates the implications of the Quantum Immortality Hypothesis (QIH) into our core reserving and product design. Key outcomes include: (1) significant reserve releases under specific valuation conventions ($4.2B-$8.7B range), (2) identification of a novel, dominant liability class ("Perpetual Claimant"), (3) structural challenges regarding death benefit payouts requiring product redesign, (4) complex legal/underwriting considerations for associated risk-selection behaviors, and (5) potential for controlled empirical validation, albeit with significant epistemological limitations. Recommendations focus on capital optimization and product adaptation while managing third-party reporting obligations.

  **1. Reserve Recalculation & Convention Selection:**
  *   The core FPAS tenet recognizes that for any insured individual, subjective continuity persists exclusively in branches where they do not die. Traditional actuarial tables (based on third-person cohort mortality) are therefore superseded for *liability valuation* by the probability-weighted experience *from the surviving policyholder's perspective*.
  *   Actuarial Quants developed two primary conventions for modeling "surviving branches":
      *   **Convention Alpha (Equal Branch Weighting):** Treats all decoherent branches where the insured survives as equally real and probable from the first-person perspective. This yields a near-certainty of subjective survival over any finite term, massively reducing reserves for death benefits.
      *   **Convention Beta (Measure-Weighting):** Applies the squared-amplitude probability measure inherent to quantum mechanics to weight surviving branches. While survival probability remains non-zero, it diminishes asymptotically towards zero over time. Reserve releases are substantial but finite and diminish with projection duration.
  *   **Financial Impact:** The CFO's selection between Alpha and Beta conventions solely determines the magnitude of the reserve release ($4.2B under Beta, $8.7B under Alpha). There is no physical basis within QIH for preferring one convention *for first-person liability accounting*; the choice is actuarial-policy driven. Beta highlights that measure-weighted surviving branches become vanishingly rare over extended periods (see Exhibit A).

  **Exhibit A: Surviving Branch Measure (Convention Beta) - $1M Term Life Policy (Age 40, Standard Risk)**

  | Projection Year | Cumulative Survival Probability (Traditional) | Cumulative "Surviving Branch" Measure (Beta) |
  | :------------- | :------------------------------------------: | :-----------------------------------------: |
  | 1              |                    0.9993                    |                    ~0.9993                   |
  | 10             |                    0.9910                    |                    ~0.9910                   |
  | 20             |                    0.9650                    |                    ~0.9300                   |
  | 30             |                    0.8950                    |                    ~0.8050                   |
  | 50             |                    0.6500                    |                    ~0.4230                   |
  | 100            |                    0.0010                    |                   ~0.00001                   |

  **2. Emergence of the "Perpetual Claimant" Liability:**
  *   FPAS analysis reveals a critical, previously unmodeled risk: **Long-Term Subjective Survival in High-Morbidity States**. While death benefits vanish under FPAS (from the survivor's perspective), the insured *subjectively* survives in branches where they experience non-fatal catastrophic events (critical illness, disability, severe trauma).
  *   Crucially, **from the surviving policyholder's continuous first-person perspective**, they *never* experience death. They *only* experience outcomes where they survive, often accruing continuous or recurring benefits (Disability Income, Critical Illness riders, Long-Term Care). This creates an effectively **infinite liability stream** for the *subjective* policyholder within their surviving branch.
  *   While traditional (third-person) accounting sees a finite number of actual claimants (many severely disabled) and eventual termination upon death, FPAS recognizes that *for the subjectively continuous claimant*, benefits persist indefinitely. Our modeling shows this "Perpetual Claimant" exposure now represents >70% of our FPAS-adjusted long-term liabilities under Convention Beta, and approaches 100% under Alpha. The financial manifestation is finite but vastly larger than pre-FPAS morbidity reserves, concentrated on policies with rich ancillary benefits.

  **3. Death Benefit Payout Paradox & Structural Solution:**
  *   A fundamental tension exists: **Death benefits are only paid in branches where the insured dies.** These are precisely the branches *not* experienced by the subjectively surviving policyholder. From the *company's perspective*, we only ever disburse death claims in "failure branches" where the QIH holds *no* relevance for the deceased.
  *   **Therefore, FPAS provides no balance sheet relief for actual death benefit outflows.** The reserves we release under FPAS relate to the *avoided* payout *from the survivor's perspective*, but our corporate entity operates in and disburses cash from *all* branches, including those where death occurs.
  *   **Proposed Resolution:** Product Development proposes the **"Continuity Rider"** (Patent Pending). This rider designates the insured's *subjectively surviving self* in another branch as the primary beneficiary upon (third-person) death. Legally, it functions as a contingent beneficiary assignment predicated on quantum decoherence events. While disbursement mechanics across branches present operational challenges (addressed separately), this structurally aligns the benefit payout with the branch where FPAS liability is extinguished (from the survivor's viewpoint).

  **4. Legal & Underwriting Considerations (Quantum Suicide Apparatus):**
  *   Legal Department Note (Summarized): Concerns arise regarding the **"Auto-Decoherence Initiator" (ADI)** – colloquially, quantum suicide devices. These devices are designed to trigger death in nearly all branches based on a quantum event, purportedly guaranteeing subjective survival for the user via QIH.
      *   **Suicide Exclusion Trigger:** Does activating an ADI constitute "suicide" under policy terms? While the *act* is intentional and third-personally lethal in high-measure branches, the *subjective outcome* for the user (in the surviving branch) is continued life, arguably voiding the "suicide" intent *from their perspective*. Legal advises ambiguity; precedent favors literal third-person interpretation (act = suicide) but QIH arguments pose novel challenges. Recommend explicit ADI exclusion rider.
      *   **Adverse Selection:** High correlation exists between purchasing rich Continuity Rider policies and ADI ownership/interest. Individuals planning ADI use represent extreme adverse selection under FPAS, as their *subjective* survival is engineered, maximizing Perpetual Claimant liability. Underwriting recommends mandatory disclosure of ADI ownership/intent and significant premium loadings or exclusions for ADI users.

  **5. Analytics Division Proposal: Empirical Validation Program:**
  *   Analytics proposes **Project Chimera:** Funding client-owned, monitored ADI units for a statistically significant cohort (n=5,000). Aim: Collect empirical data on subjective survival and branch outcome distribution.
  *   **Actuarial Assessment:** While potentially insightful for clients or researchers, **Project Chimera cannot validate QIH *for Vitalis Assurance*.** Our corporate entity exists in branches where the ADI *fails* to kill the participant (allowing data reporting) and branches where it *succeeds* (terminating the policy and data stream). Crucially, **in branches where the ADI succeeds and the participant dies, *Vitalis Assurance also ceases to exist* (via corporate fatality or dissolution in those catastrophic branches) and cannot record the "success."** We will only ever observe datasets from branches where participants *survive* the ADI activation, creating an irresolvable observation bias. The program cannot confirm the underlying physics, only document survival in the observed branch.

  **Recommendation:**
  1.  **Adopt Convention Beta (Measure-Weighting)** for FPAS internal reserving and regulatory capital calculations (subject to Actuarial Standards Board of Ontological States [ASBOS] guidance, Ref: ASBOS-2023-07). This captures significant reserve release ($4.2B) while acknowledging the diminishing measure of long-term subjective survival and mitigating Perpetual Claimant exposure inflation inherent in Convention Alpha. File amended statutory statements under the "FPAS-SOLV II" framework with the OCC (Ref: OCC Circular 23-89 "Novel Quantum Risk Mitigation Approaches").
  2.  **Approve the Continuity Rider** for immediate product integration, resolving the death benefit payout misalignment under FPAS.
  3.  **Implement the ADI Exclusion Rider** and mandatory disclosure protocols to mitigate extreme adverse selection related to engineered subjective survival.
  4.  **Reject Project Chimera** as financially unjustifiable and epistemologically futile for corporate risk assessment.
  5.  **Maintain Third-Person Claim Settlement:** All actual benefit disbursements (death, disability, illness) shall continue to be processed based on third-person, objectively verifiable events within *our* experienced branch, irrespective of FPAS reserving methodologies. FPAS is adopted solely for internal liability valuation and capital management.

  This dual-track approach (FPAS valuation / Third-person payouts) optimizes capital efficiency under the Board's adopted ontological framework while ensuring operational continuity and meeting our concrete obligations in the branch we inhabit.

  **Attachments:**  
  *   Full FPAS Reserve Model Documentation (Conventions Alpha & Beta)  
  *   Legal Memo: "Quantum Autolysis and the Suicide Exclusion (23-LG-441)"  
  *   Product Spec: Continuity Rider & ADI Exclusion Rider  
  *   Analytics Proposal: Project Chimera - Feasibility Study
