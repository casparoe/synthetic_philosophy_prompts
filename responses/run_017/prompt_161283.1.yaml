  - **Rationality constraints (weight: 0.90)**:  
    *Justification:* Money-pump arguments suggest cyclic betterness undermines practical rationality, pushing toward transitivity. But this is normative, not metaphysical—it may not reflect value facts (10% discount).  

  ---

