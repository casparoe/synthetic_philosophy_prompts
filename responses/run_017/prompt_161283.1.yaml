  - Normalized: 0.165 + [0.10 indeterminacy × 0] = **0.165** → but this underweights diagnosis (c). Reintegrating partitions:  
  - Better: Use partition directly. Diagnoses (a)-(f) cover all grounds; (a) is the only intransitivity branch.  
