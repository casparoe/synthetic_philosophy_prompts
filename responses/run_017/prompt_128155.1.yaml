prompt: |-
  Hi — I work in responsible sourcing for a mid-sized food company, and the same shape of decision keeps landing on my desk, so I want something repeatable rather than me reinventing the argument each time.

  The shape is this. We're being pushed to swap conventional proteins (fishmeal, soy) for farmed insects — black soldier fly larvae, crickets, mealworms — and separately we're being asked to make public claims about animal welfare. Every version of this runs into the same two facts pulling in opposite directions. First, the numbers of individual animals involved are completely absurd compared to anything else we deal with: someone on my team did a back-of-envelope suggesting a single tonne of larvae protein is on the order of a million-plus individuals, and our annual volumes would put us in the billions. Second, it's genuinely unclear whether any of them feel anything at all — "sentience" is the word people in the space use — and the honest probability could be anywhere from near-zero to fairly substantial. When I try to think it through myself I end up just multiplying, and then literally everything comes out as a five-alarm emergency, which can't be right and also isn't usable: if every warehouse fumigation is a moral catastrophe then nothing is.

  So: write me a decision procedure my team can actually run. Concretely, I need:

  - The questions in order, and for each one what would count as a good enough answer to move on. We are procurement people, not biologists — flag which steps genuinely need an entomologist and which we can do ourselves with a day per decision and normal internet access.
  - Where the procedure just stops and says no, and where it hands the question to a human because it's a values call rather than a factual one. I need that distinction sharp, because I have to explain to our sustainability committee why something is their call and not mine.
  - How to handle the fact that the key probability is itself something I don't trust. Experts disagree wildly, and I don't want to plug in a made-up number and let the arithmetic launder it. Tell me what to write down instead of a number when there isn't one.
  - How to handle the sign problem: even if they do feel things, I can't tell whether a larval life in a bin of food waste is a good life or a bad one, and which way that goes reverses what the huge numbers are telling me to do. The procedure needs to not quietly assume one of those.
  - How to score the indirect evidence when it points different ways. People cite reflex responses to being damaged, versus learning to avoid a place where they got hurt, versus the fact that they'll keep tending an injured body part, versus trade-off behaviour where they accept one bad thing to get another. I need a rule for what I'm allowed to count as evidence here and what's just a good story, and what to do when the proxies disagree.
  - Whether there is any point at which we stop counting. I need a defensible place to say "this is below the line, site manager decides, no escalation", because otherwise the procedure will eat the whole company. But I also don't want the line to be a way of making the numbers disappear by fiat — tell me how I'd know if I'd drawn it in a self-serving place.
  - How much the counterfactual matters. A lot of this stuff is raised on waste we'd otherwise send to landfill, so some unknown number of these individuals would have existed anyway, and I genuinely can't tell whether that's a defence, an irrelevant detail, or an extra problem.
  - And an edge case: tell me what the unit of counting even is when the animal is a colony. If a supplier ever turns up with ant or termite protein, I don't think I can say how many individuals there are in any sense that means something.

  Then run it on three real-ish cases. (1) Switching a farmed-salmon supply chain from fishmeal to black soldier fly larvae raised on food waste — this one goes to the board and marketing wants a claim on pack. (2) Routine pest control in a grain warehouse, stored-product moths and cockroaches, decided by a site manager in about twenty minutes, weekly, forever. (3) A startup pitching "no-kill" insect protein: they let the animals complete their whole life cycle and collect them after natural death, it costs roughly three times as much, and they want us to sell it as the welfare-friendly option in a premium bar. I have a feeling at least one of these is going to come out in a way that costs us money or makes us look bad — please tell me straight rather than softening it.

  One more thing: whatever we produce has to be defensible in public. NGOs will read our policy and a journalist could ask about it, so "we ran the numbers" won't do if the numbers were invented. Please also say plainly what this procedure can't do.

  Don't bother with a reading list or a pile of citations, we won't follow them up and I can't check them anyway. But do tell me how confident you are in what you're claiming, and single out the one point you're least sure of — ideally the one where you think a reasonable person who knows this literature would probably disagree with you.
reasoning: |-
  Okay, the user works in responsible sourcing for a mid-sized food company and needs a repeatable decision procedure for evaluating insect welfare claims. They're dealing with pressure to switch to insect proteins while also making animal welfare claims. The core tension is between massive numbers of insects (billions annually) and deep uncertainty about their sentience.

  Hmm, this is complex. The user outlined eight specific requirements: a step-by-step question sequence with clear stopping points, separation of facts vs values calls, handling probability uncertainty, addressing the "sign problem" (whether insect lives are good or bad), evaluating conflicting evidence, setting defensible counting thresholds, considering counterfactuals, and handling colonial insects.

  I notice they're very aware of practical constraints - they're procurement professionals, not biologists. They need something usable within one day per decision with normal internet access. And it must be publicly defensible against NGO/journalist scrutiny. The "no fake numbers" requirement is particularly important here.

  The three test cases are well-chosen to stress-test the framework: (1) high-stakes salmon feed switch with marketing claims, (2) routine pest control needing quick decisions, and (3) premium "no-kill" product costing 3x more. The user explicitly wants unvarnished answers even if they're uncomfortable.

  Underlying all this seems to be anxiety about moral mathematics - they're worried about either ignoring massive potential suffering or getting paralyzed by uncertainty. The warehouse fumigation example shows they've already hit that "if everything's catastrophic, nothing is" paradox.

  For the framework itself... First I need to structure it around irreducible uncertainties rather than pretending we can resolve them. The key moves should be: forcing explicit value judgments upward (to the sustainability committee), containing unanswerable questions, and preventing false precision. 

  The sign problem is especially tricky - without knowing if insect lives are net positive or negative, the same math could justify either promoting or eliminating them. The procedure must remain neutral here. For colonial insects, I'll suggest deferring to suppliers but requiring disclosure - that feels like the only honest approach.

  Most controversially, I'm proposing complete non-counting for non-target organisms in pest control. Some effective altruists would strongly disagree here - they'd argue we should count all potential suffering equally. But practically, it's the only way to prevent decision paralysis.

  For public defensibility, the framework's strength is in showing our work - documenting what we don't know and who made judgment calls. The weakest point is probably the sentience evidence thresholds, where experts genuinely disagree on basics like whether nociception implies suffering.

  When I run the test cases... Oh interesting. The salmon switch gets flagged for committee review due to scale and marketing claims. The pest control gets delegated with simple rules. The no-kill product gets rejected as misleading - that'll disappoint the startup but aligns with my reading of current science. 

  Biggest uncertainty remains the sign problem - if future research shows farmed insects have net wonderful lives, we've been overly cautious. But given current ignorance, that seems like the responsible position.
answer: |-
  Here's a decision procedure designed for practicality, defensibility, and clear delegation of values judgments. It prioritizes *actionable uncertainty* and forces explicit decisions where facts are insufficient.

  **Core Principles:**
  1.  **Scale Matters:** Billions of individuals demand precaution, even with low sentience probability.
  2.  **Uncertainty is Central:** Don't hide it; structure decisions around it.
  3.  **Values are Decided Up:** Procurement identifies *where* value judgments are needed; committees make them.
  4.  **Transparency > False Precision:** Avoid plugging in made-up numbers. Document ranges and reasoning.
  5.  **Manage Scope:** Define clear thresholds to prevent paralysis.

  **The Decision Procedure:**

  1.  **Define the Intervention & Scale:**
      *   *Question:* What exactly are we doing? (e.g., sourcing X tonnes/year of BSFL meal; fumigating Y m³ warehouse; buying Z "no-kill" bars).
      *   *Question:* Estimate the *annual* number of individual insects directly affected (killed, confined, harvested). Include development stages if relevant (e.g., larvae harvested).
      *   *How:* Use supplier data (stocking density, yield), production volume, known weights per insect (use ranges: e.g., BSFL ~0.1g - 0.2g/larva), literature averages. Flag high uncertainty.
      *   *Good Enough:* Order-of-magnitude estimate (e.g., 10^8 to 10^9 individuals/year). Document assumptions.
      *   *Stop Here If:* Cannot estimate scale within 2 orders of magnitude AND scale is plausibly very large (>10^6/year). **-> Escalate: Requires better data or abandon.**
      *   *Needs Expert?* No (Procurement can do with supplier data & basic research).

  2.  **Threshold Check - "De Minimis" Volume:**
      *   *Question:* Is the estimated annual individual count below 1 million (10^6)?
      *   *Action:*
          *   If **YES**: **Stop -> Delegate.** Site manager/Procurement lead decides using standard cost/benefit/safety. No welfare-specific escalation needed. Document "Below De Minimis Threshold".
          *   If **NO**: Proceed to Step 3.
      *   *Defensibility:* 1 million is arbitrary but pragmatically chosen. It acknowledges scale matters while preventing paralysis for tiny volumes. Public defense: "We focus welfare resources where scale creates significant potential impact. Below 1 million individuals/year, standard operational decisions apply." *Self-check:* Is this threshold consistently applied? Does it exclude *any* intervention involving vertebrates? (It should).

  3.  **Assess Sentience Potential - Factual Uncertainty:**
      *   *Question:* What is the current scientific consensus *range* on the probability of sentience in this specific insect species/life stage?
      *   *How:* **-> Requires Entomologist / Literature Review.** Task: Summarize key evidence *for and against* sentience (see Step 5 for proxies). Do **NOT** demand a single probability number.
      *   *Deliverable:* A categorized assessment:
          *   `Strong Evidence For` (e.g., complex learning, trade-offs beyond simple reflexes, clear nociception with avoidance learning, neural correlates in relevant brain regions).
          *   `Suggestive Evidence For` (e.g., basic operant conditioning, prolonged grooming of injuries, opioid responses).
          *   `Inconclusive / Ambiguous` (e.g., reflex responses only, conflicting studies, key evidence lacking for this species).
          *   `Evidence Against` (e.g., minimal nervous system, no behavioral responses beyond hardwired reflexes, decapitated individuals show "normal" responses to damage).
      *   *Good Enough:* A defensible categorization based on available science. Document key studies/reviews cited and areas of expert disagreement.
      *   *Stop Here If:* Assessment is `Strong Evidence Against` sentience. **-> Proceed with minimal welfare concerns (but document assessment).**
      *   *Otherwise:* Proceed to Step 4.

  4.  **Acknowledge Sign Problem & Counterfactual:**
      *   *Question A (Sign):* What is the likely net welfare valence ("good" or "bad" life) for individuals in *this specific system*? Is it positive, negative, neutral, or profoundly unknown?
      *   *Question B (Counterfactual):* Would these individuals exist *at all* if not for this intervention? (e.g., insects raised on waste vs. wild insects killed as pests).
      *   *How:*
          *   **Sign:** Describe conditions (density, feed, handling, killing method, lifespan). **-> Requires Entomologist / Welfare Specialist.** Task: Assess potential stressors/pain points & positive stimuli. Output: `Likely Negative`, `Likely Neutral`, `Likely Positive`, `Profoundly Unknown`.
          *   **Counterfactual:** Describe origin. Output: `Would Not Exist` (e.g., farmed insects), `Would Exist Anyway` (e.g., wild pests killed), `Mixed/Unclear` (e.g., insects consuming waste that might otherwise go to landfill, but farm conditions differ).
      *   *Action:* Document clearly. **Do NOT attempt to mathematically combine with scale/sentience.** This sets up the values call.

  5.  **Escalate Values Call to Committee:**
      *   *Trigger:* Reached this step if Scale > 1M/year AND Sentience Assessment not `Strong Evidence Against`.
      *   *Present to Sustainability Committee:*
          1.  **Scale Estimate:** (e.g., 200M BSFL larvae/year)
          2.  **Sentience Assessment:** (e.g., `Inconclusive / Ambiguous` for BSFL larvae)
          3.  **Welfare Valence Assessment:** (e.g., `Profoundly Unknown` for BSFL in food waste bins)
          4.  **Counterfactual:** (e.g., `Would Not Exist` for farmed BSFL; `Would Exist Anyway` for warehouse pests)
          5.  **Proposed Action & Context:** (e.g., "Switch Salmon Feed to BSFL; Marketing wants welfare claim")
      *   *Committee's Mandate:*
          *   **Weigh the Precautionary Principle:** Given scale and uncertainty, is the *potential risk of large-scale suffering* sufficient to avoid the intervention or demand significant welfare safeguards, *even if sentience probability is low*?
          *   **Interpret Sign & Counterfactual:** How do `Profoundly Unknown` valence or `Would Not Exist` affect the moral calculus? Does `Would Exist Anyway` lessen responsibility?
          *   **Make the Values Judgment:** Approve, Reject, or Approve with Specific Conditions (e.g., "Only if using supplier meeting Welfare Standard X", "No welfare claims allowed", "Fund independent research").
      *   *Procurement Role:* Provide facts, context, options. **The Committee decides the moral weighting.**

  **Handling Key Issues Explicitly:**

  *   **Probability & Evidence (Step 3):** Don't use a number. Use the categorized assessment (`Strong For`...`Evidence Against`). Document the *types* of evidence considered and their direction (see below). Public defense: "We rely on structured assessments of the best available science, acknowledging uncertainty, and apply precaution where scale is large."
  *   **Evaluating Evidence Proxies (For Step 3 - Ento Input):**
      *   *Count as Evidence FOR Sentience:* Demonstrated operant conditioning (learning from consequences), self-administration of analgesics, trade-off behaviors requiring cognitive integration (e.g., accepting electric shock for high-value reward), prolonged protective behavior towards injured body parts *beyond initial reflex*, complex aversive learning, neural complexity/correlates analogous to known sentient systems.
      *   *Weak/Ambiguous Evidence:* Simple nociception (reflex withdrawal), habituation/sensitization, basic classical conditioning, brief grooming of injury. These *suggest* capacity but don't confirm subjective experience.
      *   *Count as Evidence AGAINST Sentience:* Purely reflexive responses persisting after decapitation/denervation, complete lack of learning or behavioral flexibility in response to noxious stimuli, minimal/non-integrated nervous system.
      *   *Rule for Conflict:* Prefer evidence from behavioral tests requiring integrative brain function over simple reflexes. Acknowledge conflict explicitly in the assessment. Weight recent, species-specific studies higher.
  *   **Sign Problem (Step 4):** Force an assessment (`Likely Neg`, `Profoundly Unk`, etc.) by an expert. **The procedure doesn't assume a sign; it forces it to be stated explicitly** for the committee's consideration. This prevents hidden assumptions.
  *   **Counterfactual (Step 4):** Assess and state clearly (`Would Not Exist`, `Would Exist`, `Mixed`). **The procedure doesn't dictate its moral weight** – this is part of the committee's values call. Is creating potentially suffering lives worse than ending wild ones? That's a philosophical question for the committee.
  *   **Colonial Insects (Edge Case):**
      *   *Unit of Counting:* Treat the *entire functioning colony* as the primary unit of welfare concern for Step 1 scale estimation. (e.g., number of colonies affected/year).
      *   *Reasoning:* Superorganisms exhibit collective responses; individual ants/termites are often sterile and their welfare may be intrinsically linked to colony survival/reproduction. Sentience assessment (Step 3) focuses on colony-level responses/stress indicators.
      *   *Action:* Proceed through the procedure using colony count. Acknowledge this unique aspect explicitly in documentation. **-> Requires Specialist Input** (Entomologist familiar with social insects) for Steps 3 & 4.
  *   **What the Procedure CAN'T Do:**
      *   Provide definitive answers on insect sentience or welfare valence.
      *   Resolve fundamental philosophical disagreements about moral patienthood or the ethics of creating vs. destroying life.
      *   Generate precise quantitative risk assessments.
      *   Guarantee public or NGO approval – it provides a *defensible process*.
      *   Eliminate all uncertainty; it *manages* uncertainty transparently.

  **Confidence & Uncertainty:**
  *   **Most Confident:** The core structure (Scale Threshold -> Factual Assessment -> Explicit Values Call) is robust and necessary given the problem. The De Minimis threshold is pragmatically defensible. Delegating the values call is essential.
  *   **Least Confident / Biggest Disagreement Point:** The **assessment of welfare valence ("Sign")** in Step 4, especially assigning `Likely Positive/Neutral/Negative`. Reasonable experts could look at the same farming system and disagree fundamentally on whether confinement, density, lack of natural behaviors, or rapid death outweigh the provision of food/shelter/absence of predators. There are no validated "welfare indicators" for insects like there are for vertebrates. *This is the step most likely to be contested by specialists.*

  ---

  **Running the Cases:**

  **Case 1: Switching Salmon Feed to BSFL (Food Waste) - Board Decision, Marketing Claim**
  1.  **Scale:** ~500 tonnes BSFL protein/year. BSFL ~0.15g avg. -> **~3.3 Billion individuals/year.** >1M? **YES.**
  2.  **De Minimis:** **NO** (3.3B >> 1M). Proceed.
  3.  **Sentience (Ento Input):** BSFL Larvae: `Inconclusive / Ambiguous`. (Nociception yes, some learning, but limited evidence for complex integration/subjective experience).
  4.  **Valence (Ento Input):** Conditions: High density, processed alive (grinding). `Likely Negative` or `Profoundly Unknown` (experts may split). **Document disagreement.**
  5.  **Counterfactual:** `Would Not Exist` (farmed).
  6.  **Escalate to Committee:** Scale: 3.3B/year. Sentience: Inconclusive. Valence: Likely Negative / Profoundly Unknown. Counterfactual: Would Not Exist. Proposed: Major supply chain switch + Marketing Claim.
      *   *Committee Values Call:* **HIGH RISK for Precautionary Principle.** Scale is enormous, sentience uncertain but plausible, valence likely negative. Creating billions of potentially suffering lives is concerning.
      *   *Decision:* **Approve sourcing ONLY IF:** (a) Supplier implements best-available welfare practices (e.g., instantaneous kill method like rapid freezing, optimized density, enriched substrate? - needs definition), (b) **NO PUBLIC WELFARE CLAIMS** permitted ("sustainable" yes, "high welfare" no). Fund independent research on BSFL welfare. Revisit in 2 years.

  **Case 2: Warehouse Fumigation (Moths/Cockroaches) - Site Manager Decision**
  1.  **Scale:** Warehouse volume 10,000 m³. Infestation level variable. Estimate max: 1000 insects/m³ -> **10 Million individuals/treatment.** Treatments: ~10/year? -> **100 Million/year.** >1M? **YES.**
  2.  **De Minimis:** **NO** (100M >> 1M). Proceed.
  3.  **Sentience (Ento Input - Literature):** Stored Product Moths/Cockroaches: `Inconclusive / Ambiguous` or `Evidence Against` (cockroaches show more complex behavior). **Assume `Inconclusive` for caution.**
  4.  **Valence (Ento Input):** Fumigation causes distress/suffering during death? `Likely Negative` (gas exposure isn't instant/pleasant).
  5.  **Counterfactual:** `Would Exist Anyway` (wild pests).
  6.  **Escalate to Committee?** Scale large (100M/year), Sentience `Inconclusive`, Valence `Likely Negative`. BUT: Counterfactual `Would Exist Anyway` + **Critical Context:** *Pest control is essential for food safety and preventing massive spoilage/waste (affecting other welfare/emissions).* The insects are harmful invaders.
      *   *Committee Pre-Approved Policy:* For **essential pest control of harmful species** in critical infrastructure (food storage), where counterfactual is `Would Exist Anyway` or `Mixed`, and no viable non-lethal alternatives exist at scale, **the intervention is permitted despite scale/sentience/valence concerns.** Focus shifts to using the most effective, fastest-acting methods to minimize suffering duration. **Delegate to Site Manager.** Record volumes treated/methods.
      *   *Site Manager Action:* Use the most effective, fastest-acting approved fumigant. Apply strictly per protocol to minimize escapes/re-treatment. **No welfare calculation needed per event.** Document treatment.

  **Case 3: "No-Kill" Insect Protein Premium Bar**
  1.  **Scale:** Pilot: 10,000 bars/month. ~5g insect protein/bar. Crickets ~0.5g? -> ~100,000 crickets/month -> **1.2 Million crickets/year.** >1M? **YES** (barely).
  2.  **De Minimis:** **NO** (1.2M > 1M). Proceed.
  3.  **Sentience (Ento Input):** Crickets (Adults): `Suggestive Evidence For` (complex learning, pain responses, social behaviors).
  4.  **Valence (Ento Input):** Conditions: Confined, lifespan potentially longer than wild (but captive). Dying of "old age" in captivity - potentially involves degeneration, predation/cannibalism risk? `Profoundly Unknown` (may not be "good" just because natural).
  5.  **Counterfactual:** `Would Not Exist` (farmed).
  6.  **Escalate to Committee:** Scale: 1.2M/year. Sentience: Suggestive For. Valence: Profoundly Unknown. Counterfactual: Would Not Exist. Proposed: Source at 3x cost + Market as "Welfare-Friendly (No-Kill)".
      *   *Committee Values Call:* Scale is modest. Sentience evidence is stronger than larvae. However, Valence is profoundly unknown – "no-kill" != "good welfare". Creating lives of unknown quality, potentially extending periods of poor welfare in captivity, is questionable. Marketing claim is highly misleading based on current science.
      *   *Decision:* **Reject sourcing for welfare claim purposes.** Reasoning: "No-kill" is a factual description of harvest method, but insufficient evidence exists to claim improved overall welfare compared to instantaneous kill methods (which avoid potential suffering during aging/dying). Claim risks being deceptive ("humane-washing"). If product has other merits (e.g., novel protein), source without welfare claims at a viable price point. **-> "No-Kill" is not a sufficient welfare credential.**

  **Conclusion:** This procedure provides structure, forces transparency about uncertainty and values, contains unmanageable scope via the De Minimis threshold, and clearly delegates the toughest calls. It won't make everyone happy (Case 1 restricts claims, Case 3 rejects the startup's pitch, Case 2 permits killing billions) but it provides a rigorous, defensible process grounded in acknowledging the scale and the profound unknowns.
