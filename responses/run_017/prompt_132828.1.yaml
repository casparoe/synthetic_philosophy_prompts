answer: |-
  You've described a sophisticated and normatively significant phenomenon that merits careful conceptual dissection. Let's proceed systematically:

  **Candidate Concepts & Their (Mis)Fit:**
  1.  **Strawsonian Objective Attitude:** *Does not fit.* The objective attitude, as Strawson presents it, is a stance adopted *toward the person* (often due to incapacity), suspending *all* reactive attitudes *globally*. Here, the suspension is *domain-specific*, *reciprocal*, *not person-focused*, and *coexists* with reactive attitudes toward the same person in other domains. It's a local suspension, not a global shift.
  2.  **Excuse/Exemption:** *Does not fit.* Excuses negate responsibility for a *particular act* (e.g., "He didn't see me"). Exemptions negate general standing for responsibility (e.g., severe mental illness). Here, the agents are fully responsible persons, capable of goodwill/hostility. Their conduct isn't excused *within* the domain; it's treated as *not calling for* reactive attitudes *by prior agreement*. The *conduct itself* is not justified or excused; the *reactive response* is suspended by convention.
  3.  **Role Morality:** *Partial fit but insufficient.* While context matters (basketball player vs. friend), the core issue isn't conflicting *duties* inherent to roles. The problematic *action-types* (deception, obstruction) are identical across domains. What differs is the *attitudinal response* deemed appropriate to those actions *within* a specific, mutually agreed-upon context. It's about the *moral-emotional valence* of the act within a framework, not just role-based duties.
  4.  **Psychological Compartmentalization:** *Does not fit.* You explicitly rule this out. This is not an unconscious defense mechanism or cognitive dissonance reduction. It's a conscious, deliberate, mutually understood, and socially enforced agreement about the rules of emotional engagement *within a defined sphere*. Awareness and intentionality are central.
  5.  **Hypocrisy:** *Does not fit.* Hypocrisy involves a *contradiction* between one's professed standards and one's actions, often for advantage. Here, the partition is *mutually agreed upon and reciprocal*. There is no contradiction *within the agreed framework*; the standards *for reactive engagement* are context-dependent by design. Advantage isn't sought through the partition itself.
  6.  **Game Theory / Strategic Interaction:** *Partial fit but insufficient.* Framing interactions as "games" with incentives explains the behavior *within* the domain (flopping, gaming metrics). However, it fails to capture the *normative dimension*: the mutual *agreement* on the suspension of reactive attitudes, the *moral expectations* governing that agreement itself, and the *reactive attitudes* (resentment) triggered by *violating the agreement* (e.g., carrying gamesmanship into friendship). This is more than just strategic play; it's a morally regulated social practice.
  7.  **Convention / Social Practice:** *Closer fit, but lacks specificity.* While conventions govern many social interactions, this is a specific type: a convention governing the *suspension of reactive attitudes* towards certain types of otherwise morally problematic conduct *within a defined domain*, where adherence to *this very convention* is itself enforced by reactive attitudes. The distinctiveness lies in its target: the regulation of moral emotions themselves.

  **Verdict & Coinage:**
  No established concept fully captures this phenomenon. It requires a new term: **Circumscribed Objectivity (CO)**.

  **Definition:**
  *Circumscribed Objectivity (CO)* is a stable, reciprocal, domain-specific social agreement among competent moral agents to mutually suspend Strawsonian reactive attitudes (like resentment, indignation, moral praise) towards certain categories of otherwise morally significant conduct within a defined interactional sphere. This suspension is managed strategically (e.g., adjusting incentives, rules) rather than responded to emotionally. Crucially, adherence to the *agreement itself* – maintaining the boundary between the sphere of suspended reactivity and the sphere of full participant engagement – is subject to robust reactive attitudes. CO is *not* a judgment about the agent's capacity; it is a *convention* about the appropriate emotional/moral response to conduct *within that sphere*.

  **Boundaries - What CO Is Not:**
  1.  **Not Mere Role Differentiation:** While roles often provide the *context* for CO (basketball, workplace metrics), CO specifically targets the *regulation of reactive attitudes* towards conduct that *could* elicit them elsewhere. Two people in the same role (e.g., teammates) might engage in CO regarding flopping, but not regarding stealing from each other's locker.
  2.  **Not Amoralism/Nihilism within the Domain:** CO does not imply the conduct *lacks* moral significance *simpliciter*. Deception in basketball *is* deception. CO involves agreeing *not to treat it* within the participant stance *here and now* for functional/pragmatic reasons, while acknowledging its moral status elsewhere. The meta-agreement upholding CO *is* morally charged.
  3.  **Not Incompatible with Participant Stance:** CO exists *alongside* and is *enabled by* the full participant stance. Agents are held fully responsible *for respecting the boundary* of CO. Resentment at boundary violations *is* a reactive attitude within the participant stance, demonstrating its persistence.

  **Hard Boundary Cases:**
  1.  **The "Cutthroat Monopoly" Parent:** A parent plays Monopoly ruthlessly with their child (lying, gloating, exploiting rules) under a tacit CO agreement ("it's just a game"), then immediately expects and expresses warm familial affection and trust after the game. *Is this CO?* **Yes.** The domain (game) is defined, reactive attitudes (resentment for ruthless play) are suspended *within* it by mutual (if tacit) understanding, managed strategically (playing to win), and the switch is immediate and expected. Resentment *would* arise if the parent carried the ruthless attitude into bedtime, violating the boundary.
  2.  **The "Corporate Espionage" Agreement:** Two rival CEOs agree that industrial espionage between their companies is "just business." They expect no resentment for stealing trade secrets, only strategic countermeasures. However, they fully expect honesty and goodwill in their joint charity work and would resent betrayal there. *Is this CO?* **Yes.** The domain (business competition) clearly demarcates conduct (espionage) triggering suspended reactivity, managed objectively (counter-espionage). The boundary violation (betrayal in charity work) would provoke reactive attitudes.
  3.  **The "Sociopath's Ploy":** A manipulative individual *pretends* to agree to CO in a context (e.g., a debate club where sharp practices are conventional) but secretly views *all* human interaction strategically, feigning reactive attitudes elsewhere solely for advantage. *Is this CO?* **No.** CO requires *genuine* reciprocal understanding and commitment among agents who *are* otherwise capable of the participant stance. The sociopath lacks the capacity for genuine reactive attitudes *anywhere*, making their participation in the "agreement" fraudulent. This is strategic deception exploiting the *form* of CO, not an instance of it.
  4.  **The "Collapsing Domain":** A workplace adopts CO regarding "gaming metrics." Over time, gaming expands to include sabotaging colleagues' work. Management insists it's still "just incentives," but employees feel deep resentment at the sabotage. *Is the resentment a boundary violation?* **No, it reveals CO's collapse.** The agreed domain ("metric gaming") had an implicit boundary excluding direct harm to colleagues. Sabotage violates that implicit boundary, making it conduct *outside* the scope of the original CO agreement. The resentment is a legitimate participant stance response to harm, showing CO's domain must be clearly defined and adhered to.

  **The One-Sided Version:**
  The person demanding objective treatment for themselves while claiming participant engagement from others is **not practicing Circumscribed Objectivity**. CO is defined by *reciprocity*. This one-sided demand is a *corruption* or *exploitation* of the *idea* of domain-specific norms. It attempts to unilaterally declare a domain of non-accountability for oneself while demanding full accountability from others. This violates the core mutuality of CO. The appropriate response – resentment – confirms that the demander is *violating* the implicit reciprocity required for any domain-specific agreement about accountability, highlighting that CO *depends* on reciprocity. This is a different phenomenon: **Unilateral Exemption Claiming**.

  **Pressure on Strawson:**
  Your phenomenon *does* put pressure on Strawson, primarily by demonstrating a greater degree of rational, localized *regulation* of the participant stance than his emphasis on its holistic, non-optional nature suggests:
  1.  **Fine-Grained Partitioning:** CO shows we *can* rationally agree to locally suspend reactive attitudes towards *specific conduct types* in *specific domains* towards *specific individuals* without collapsing into the global objective stance. We compartmentalize *within* the participant stance.
  2.  **Meta-Responsibility:** Holding each other responsible *for respecting the boundaries* of CO demonstrates that the participant stance operates at a higher level, regulating its own local suspensions. This "participant stance about the participant stance" shows a sophisticated reflexivity Strawson didn't fully explore.
  3.  **Rational Regulation:** The stability and functionality of CO suggest that reactive attitudes *are* subject to rational negotiation and agreement regarding their scope of application in specific social contexts, contra Strawson's focus on their givenness and resistance to wholesale elimination. We rationally *design* pockets of objectivity.

  However, Strawson's core insight remains intact:
  1.  **Failure of Localization?** The meta-level resentment at boundary violations proves the objective attitude within CO *never fully escapes* the gravitational pull of the participant stance. The suspension is only possible *because* it's contained and policed *by* the participant stance. Attempts to make the objective stance truly local and self-contained fail; the participant stance reasserts itself at the boundary.
  2.  **The Holistic Floor:** While locally regulable, the participant stance *as the fundamental framework* for interpersonal relations remains inescapable. CO is a *modification within* that stance, not an escape from it. We couldn't establish or maintain CO without the underlying capacity for reactive attitudes and mutual regard.

  **Conclusion:**
  You've identified **Circumscribed Objectivity (CO)**: a reciprocal, domain-specific convention suspending reactive attitudes towards defined conduct, managed strategically, where the *convention itself* is upheld by reactive attitudes. It differs from adjacent concepts by its focus on the mutual, conscious regulation of moral emotions within bounded spheres. The one-sided version is a corrupt exploitation of the form, not an instance of CO. While demonstrating greater rational local regulation of reactive attitudes than Strawson emphasized, CO ultimately reinforces his core thesis: the participant stance provides the inescapable framework, reasserting itself even in the act of locally suspending some of its expressions. CO is a vital social technology enabling complex cooperation and competition within the enduring fabric of moral responsibility.
