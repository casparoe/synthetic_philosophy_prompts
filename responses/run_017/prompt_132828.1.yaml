prompt: |-
  You are a professional philosopher who specializes in moral responsibility and the moral emotions, and who knows the Strawsonian literature well. I want you to work carefully and slowly: before you commit to an answer, spend a paragraph listing the candidate concepts you can think of, one by one, with the reason each of them does or does not fit what I describe below, and only then give me your verdict. If nothing established fits, say so plainly and coin a term, with a definition and at least two hard boundary cases. I am not fishing for a label: I want the carving — what exactly the thing is, what it is not, and where its edges are. And please don't answer by pointing me at a literature or at names I would then have to chase down; I'm after the conceptual work itself, not a reading list.

  Here is what I keep noticing. I'm in a philosophy MA program — we read Strawson's "Freedom and Resentment" last term — and I referee a recreational basketball league on weekends, which is where I first started seeing the pattern. On the court I routinely treat players' flopping, time-wasting, and badgering of officials as something to be managed rather than resented: I don't think worse of them as people, I don't feel indignation, I just adjust the incentives and move on. But most of these players are also people I work and drink with, and outside the gym I hold them to ordinary expectations of honesty and goodwill, feel real gratitude or resentment toward them, and expect the same in return. Nobody finds this odd, and it doesn't feel like I am excusing them. The same structure shows up at my day job: my team lead and I both know that everyone will game whatever metric we are measured on, neither of us treats this as a fact about anyone's quality of will or as something to feel resentment over, and we redesign the metric — yet if one of us were to lie to the other about something outside work, the resentment would be immediate and entirely appropriate. What interests me most is that the arrangement seems to be *itself* a matter of mutual accountability: a teammate who carries the gym's gamesmanship into the friendship, or a manager who insists that everything at work is "just incentives" and then expects spontaneous loyalty and gratitude from you on the weekend, is resented precisely for that, and resented by people who accept the partition everywhere else.

  So my question is whether this thing has a name, or whether it is something I should name myself. It is obviously adjacent to Strawson's objective attitude, but as I read him the objective attitude is something you adopt toward a person on some occasion and it is supposed to be an alternative to the participant stance, not something you can run alongside it indefinitely and by agreement; here the suspension is standing, reciprocal, restricted to a domain, and it seems to coexist with full-blooded reactive attitudes toward the very same person. It isn't excuse or exemption, since the person is not being declared unfit for responsibility and is held responsible elsewhere for the very same kind of conduct. It isn't role morality, or not only that, because the action-types are the same in both arenas — deception is deception — and what changes is only whether the attitude is felt and expressed. It isn't self-deception or ordinary psychological compartmentalization, since everyone involved is fully aware of both stances and moves between them deliberately. It isn't hypocrisy, because the partition doesn't advantage one party. And it isn't unstable in the way you might predict: it seems to be what makes a lot of ordinary life possible. So: what is it? Is there an established concept it nearly fits, and how exactly does it differ? Does the one-sided version — the person who wants the objective attitude applied to you while claiming participant attitudes from you — count as a corruption of the same phenomenon or as a different phenomenon entirely, and what does your answer to that tell us about the phenomenon? And finally, does any of this put pressure on Strawson's own argument: if we can partition the participant stance this finely, and hold one another responsible for *where* the partition falls, does that show the reactive attitudes are more rationally regulated than his remarks about our inability to give them up wholesale suggest — or does the fact that the participant stance re-enters at this higher level just show that the objective attitude never really succeeds in being local?
