  Hmm... the Strawsonian framework feels tight but slightly strained here. The objective attitude was conceived as global or episodic, not as a partitioned stance coexisting with reactive attitudes toward the same person. Yet what they describe is clearly stable and functional. Interesting how the resentment toward boundary-violators proves the participant stance is still operative at a meta-level. 

  The one-sided version feels like a perversion rather than a different phenomenon - it violates the reciprocity that defines the original case. That asymmetry actually helps illuminate why the mutual case works: it's a moral contract. 

  On Strawson's theory... this does create pressure. If we can locally suspend reactive attitudes by agreement while still being deeply in the participant stance overall, it suggests more rational control than Strawson acknowledged. But the meta-level resentment shows the objective attitude never fully escapes the participant stance's gravity. Maybe "circumscribed objectivity" would capture it - defined by its contractual nature and sharp domain boundaries. 

  Need to craft boundary cases carefully. For the hard case: the parent who plays cutthroat Monopoly yet expects bedtime tenderness must maintain both stances simultaneously toward the same person in overlapping contexts - that might break the model. For the easy case: ritual combat cultures where warriors switch between combat and ordinary relations clearly fit. 

  The coinage should emphasize the deliberateness and reciprocity. "Contractual suspension" might work but sounds too legal. "Domain-specific bracketing" captures the phenomenological aspect but misses the accountability element. Perhaps "conventional agnosticism" - no, too epistemic. After weighing options, "circumscribed objectivity" seems best, with the reciprocity built into the definition. 

