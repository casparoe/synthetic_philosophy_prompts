  For the brother-in-law's confounding argument: This is a valid critique that weakens some experimental evidence but doesn't undermine the core concept. The sunk cost fallacy is well-documented across species and contexts. I'm highly confident that while the brother-in-law has a point about specific studies, the broader phenomenon is robust.

