  Now, the user's disanalogies. The initial state: in the deck, it's one microstate; in cosmology, it's a low-entropy macrostate with many microstates. The shuffler introduces external asymmetry, unlike physics' time-symmetric laws. The deck's small size means recurrence is quick, unlike the universe. No spatial structure, so no diffusion or gravity effects. Also, no concept of local decreases in entropy compensated elsewhere.

