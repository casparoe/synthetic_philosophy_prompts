answer: |-
  Here are five readings of "truth is the road to reconciliation," ordered from thinnest to strongest:

  1.  **Reading:** Acknowledging that serious violations occurred is a prerequisite for societal repair; ignoring or denying past harm makes reconciliation impossible.  
      **Status:** Trivial (widely accepted in transitional justice).  
      **Supports:** Both uses (justifies needing *some* record, official or victim-centered, over silence/denial).  

  2.  **Reading:** Creating an *official*, publicly accessible record of past violations (even if incomplete) fosters societal trust and dialogue necessary for reconciliation.  
      **Status:** Defensible but contested (depends on record's nature/process).  
      **Supports:** First use (amnesty buys an *official* record), potentially Second (if official status requires victim testimony).  

  3.  **Reading:** The *process* of truth-telling itself (especially for victims) is psychologically cathartic and builds social recognition, directly contributing to individual healing and relational repair.  
      **Status:** Defensible but contested (varies by individual/context).  
      **Supports:** Primarily Second use (prioritizes victim testimony experience over verification), weakly First (if perpetrator telling aids victim process).  

  4.  **Reading:** Establishing a *maximally complete and accurate* factual record ("forensic truth") is essential for genuine societal reconciliation by enabling justice, accountability, and institutional reform.  
      **Status:** Defensible but contested (weighs accuracy vs. other goals).  
      **Supports:** First use *only if* amnesty testimony is rigorously verified; actively **undermines** Second use (requires verification).  

  5.  **Reading:** Achieving a shared societal understanding or "narrative truth" about the *meaning* and causes of the past conflict, even if contesting specific facts, is the *sufficient* and primary driver of deep reconciliation.  
      **Status:** Probably false (overstates narrative's sufficiency; facts often matter).  
      **Supports:** Second use (elevates victim narrative over factual challenge); weakens First use (reduces need for perpetrator factual accuracy).  

  **Regarding your distinctions:**  
  *   **Unrecovered vs. Denied Truth:** Readings 1 & 2 focus on overcoming denial. Readings 4 & 5 address unrecovered truth (accuracy/narrative). The slogan often conflates them, but the uses differ: amnesty primarily addresses denial (Reading 2), while rejecting verification risks sacrificing unrecovered truth (Reading 4) for process/experience (Reading 3) or narrative (Reading 5).  
  *   **Biased Sample:** This directly challenges Reading 4's support for the *first use*. If amnesty yields a systematically skewed record (denial overcome, but unrecovered truth distorted), it fails to deliver the "accurate truth" Reading 4 deems essential. Readings 2, 3, and 5 are less vulnerable as they prioritize official acknowledgment, process, or narrative over strict accuracy.  
  *   **Justice Trade-off:** If justice was impossible anyway, the *first use* shifts justification towards Readings 1, 2, or 3 (overcoming denial/official silence, providing a record/process). It avoids the moral cost Reading 4 implies but doesn't inherently make the arrangement "better" or "worse," just changes its rationale.  
  *   **Validation vs. Truth:** Reading 3 explicitly separates the *experience* of being heard (validation) from factual truth. A commission affirming everything without testing would satisfy Reading 3 (process/validation) and Reading 5 (narrative) but fail Readings 1, 2, and 4 (which require some connection to reality, either acknowledgment or accuracy).
