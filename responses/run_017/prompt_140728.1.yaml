prompt: |-
  I am a second-year PhD student in philosophy, and this term I am running a small graduate reading group on whether results in computational complexity theory do any *normative* work, or only descriptive and engineering work. The concrete focus is the familiar worst-case hardness of probabilistic inference, planning and strategic reasoning in settings that are otherwise perfectly classical: no bounded recall, no resource limits written into the formalism, just ordinary Bayesian updating, ordinary expected-utility maximisation and ordinary equilibrium reasoning over an expressive language. One half of the group — call them the feasibility camp — argues that if a norm's verdicts cannot in general be computed, or even approximated to any useful guarantee, then it cannot be a norm for agents like us: 'ought' implies 'can', 'can' must be read as something like reliable producibility by a feasible procedure, and so our normative theories ought to be indexed to what tractable procedures can deliver, with the ideal theory demoted to a limiting or merely definitional role. The other half — the correctness camp — replies that standards of correctness are not the sort of thing that capacities can validate or invalidate; that intractability bears on excuse, implementation and institution-design but not on what it is to get things right; and, more sharply, that one can *satisfy* a norm without *computing* it, since an agent might be reliably coherent, or reliably optimal, by grace of structure, habit, or a cheap surrogate procedure whose outputs happen to agree with the ideal's verdicts on the cases that actually arise. We have now had this argument, in recognisably the same shape, four times in six weeks.

  My own hypothesis is that we are running together at least three different questions under the word 'rationality': a question about *verdict-norms* (what it is to get a given deliberative problem right, i.e. what the correct answer is), a question about *procedure-norms* (what an agent should do, in the time and with the machinery it has, when it faces one), and a question about *design-norms* (what we should build, train, or institutionalise, including what we should hold each other responsible for). I also want to press a second distinction that I think nobody in the room has made cleanly: the distinction between the hardness of *computing* a norm's verdict and the hardness of *complying* with the norm, where the latter might be easy even when the former is intractable. That gap is what makes the 'cheap surrogate that tracks the ideal' move — call it the tracking defence — initially attractive, and my worry is that it is unstable: the meta-question of whether a given surrogate tracks the ideal on the instances that actually arise looks, for interesting cases, at least as hard as the original problem, and even if it is not, the answer seems to depend on facts about the distribution of real instances that nobody in the group is in a position to supply. A third, smaller faction thinks the whole dispute is ill-posed from the start, because complexity classes describe asymptotic scaling behaviour while our norms are applied to finite agents with fixed resources and fixed problem sizes, so that the granularity is simply wrong.

  So what I want from you is a diagnosis, not a verdict and not a survey, and I would like it in British English. Please tell me what kind of stalemate this is: a verbal dispute about 'rationality', 'norm' or 'can'; two or three different questions sharing a name; a hidden empirical disagreement about instance distributions, average-case versus worst-case structure, or human performance; a bedrock clash about whether normativity must be action-guiding to be normativity at all; or a genuinely ill-posed question. Engage the positions as I have described them rather than rehearsing who has said what, and please do not give me a reading list or citations — I am not asking you to reconstruct a literature. My specific questions are these. First, does the computing/complying distinction actually do the work I think it does, or does it smuggle in the very point at issue — that norms are standards of output rather than requirements of procedure — and thereby beg the question against the feasibility camp? Second, where exactly does the tracking defence fail: on the intractability of verifying tracking, on the absence of any principled account of which instance distributions matter, or somewhere else? Third, given your diagnosis, what would count as progress here — an average-case or smoothed-complexity result, an approximation-guarantee-to-verdict-tracking theorem, an empirical programme, a sharper conceptual distinction, an explicit change of question — and should one expect progress at all, or is the persistence of this argument evidence that the question is doing something other than asking to be answered?
reasoning: |-
  Okay, let me unpack this dense philosophical puzzle about complexity theory's normative implications. The user presents a clear stalemate between two camps in their reading group: one arguing computational intractability invalidates norms ("feasibility camp"), the other insisting correctness standards exist independently of computability ("correctness camp"). 

  First, I notice how sharply the user frames their own analytical lens - the three-way distinction between verdict-norms/procedure-norms/design-norms feels crucial. Their worry about the "tracking defence" being unstable is particularly sophisticated - they're spotting that verifying whether a cheap surrogate actually tracks ideal verdicts might itself be intractable or require inaccessible empirical data. 

  The core tension seems to be between two fundamentally different conceptions of normativity: one where norms must be actionable (feasibility), versus one where they're truth-conditions independent of agency (correctness). This isn't just verbal disagreement; it's a collision between practical and platonist philosophies of rationality. 

  On the computing/complying distinction: I think the user is right that it risks begging the question. By assuming compliance doesn't require computation, it presupposes the correctness camp's view that norms are about outputs rather than processes. The feasibility camp would counter that for an agent to count as "complying", there must be some feasible path to that state - which brings us straight back to procedure. 

  The tracking defence fails precisely where the user suspects: it needs a tractable meta-justification (which may not exist) and relies on contingent empirical distributions (which nobody has). Even if a surrogate works in practice, without theoretical grounding it remains an unprincipled hack - philosophically unsatisfying for normative work. 

  For progress? Conceptual sharpening alone won't resolve this. The third faction has a point about asymptotic complexity vs finite domains, but that doesn't dissolve the dispute - it just relocates it to "what counts as sufficiently large n?". What's needed is either a rigorous demonstration that tractable surrogates provably track ideals under plausible instance distributions (extremely hard), or empirical evidence that human cognition leverages domain-specific structure to achieve compliance without computation (equally hard). 

  Perhaps the deepest insight is recognizing this isn't a solvable problem but a permanent tension in rationality theories. The persistence of the argument suggests it's doing meta-work: clarifying disciplinary boundaries between philosophy, CS, and cognitive science. The most productive next step might be mapping where each camp's assumptions are productive for different purposes - verdict-norms for foundational ethics, procedure-norms for AI safety, design-norms for institutional economics.
answer: |-
  Your stalemate is primarily **a bedrock clash about the nature of normativity itself**, amplified by **unresolved empirical gaps** and **conflated questions**, with the computing/complying distinction serving as a battleground rather than a resolution. Here’s a diagnosis structured around your queries:

  ### 1. **The Computing/Complying Distinction: Begging the Question?**  
     Yes, it smuggles in the correctness camp’s core premise. By separating "computing" (a procedural feat) from "complying" (an output state), you implicitly assume that norms *are* standards of correctness detached from the process of *achieving* them. The feasibility camp rejects this separation: for them, "compliance" *requires* a feasible path to the correct output. If no such path exists (even via luck or habit), the norm is inert for finite agents—rendering it descriptively empty and normatively inert. Your distinction thus presupposes that norms are *evaluative standards* rather than *action-guiding prescriptions*, which is precisely what the feasibility camp disputes. It doesn’t resolve the debate; it entrenches it.

  ### 2. **Where the Tracking Defence Fails: Instability and Opacity**  
     The defence fails at two critical joints:  
     - **Meta-intractability**: Verifying that a surrogate *reliably tracks* the ideal norm on "actual instances" typically requires solving the same class of hard problems (e.g., "Does this heuristic compute near-optimal equilibria in *this* game structure?"). If checking tracking is as hard as computing the ideal verdict, the defence collapses into self-defeat.  
     - **The Distribution Problem**: "Actual instances" presuppose a natural distribution of real-world problems. But no one can specify this distribution for open-domain rational deliberation (e.g., which game trees or belief networks "actually arise" for humans?). Without a tractable characterization of this distribution, tracking is an ungrounded hope—not a normative strategy. It confuses *accidental* compliance (which happens) with *principled* compliance (which the norm demands).  

  ### 3. **Diagnosis & Paths to Progress**  
     - **Core Stalemate**: The deadlock is **philosophical**, not technical. The correctness camp sees rationality as a *logical relation* (e.g., coherence = satisfying probability axioms). The feasibility camp sees it as a *regulative ideal for agents* ("ought" implies "feasibly can"). This mirrors the Kantian divide between pure and practical reason, with no obvious bridge.  
     - **Secondary Confounds**:  
       - **Granularity**: The "finite agents" objection is valid but shallow. Even for fixed resources, *which* feasible procedures count as rational? Complexity theory illuminates *structural barriers* (e.g., NP-hardness exposes that brute-force search isn’t accidentally slow—it’s *intrinsically* costly). Ignoring this risks endorsing norms that work only on toy cases.  
       - **Empirical Vacuum**: Both camps gesture at "real" instances (feasibility: "Agents face hard problems!"; correctness: "Agents might track ideals!"). But neither supplies evidence about human-scale problem distributions or cognitive surrogates. This isn’t incidental—it’s the heart of the impasse.  

     - **What Counts as Progress?**  
       - **Empirical Grounding**: Map real-world instances (e.g., human planning/strategic scenarios) to complexity classes. If "typical" problems are tractable (e.g., with low treewidth or smooth payoffs), the tracking defence gains plausibility. If they’re hard *in practice*, feasibility concerns bite.  
       - **Approximation Theorems**: Show that *specific* surrogates (e.g., greedy heuristics, bounded-depth search) provably approximate ideal verdicts *under well-defined distributions*. This would turn the tracking defence from hope to science.  
       - **Reframe the Question**: Explicitly shift to **design-norms**. Ask: "Given complexity constraints, which procedures should we embed in agents/institutions?" This sidesteps verdict-norm disputes and focuses on engineering rational *systems*.  
       - **Accept Divergence**: Progress may require admitting that "rationality" is not one concept. **Verdict-norms** define correctness (e.g., "Bayesian credences *are* rational"). **Procedure-norms** govern agents (e.g., "Use variational inference"). These need not converge.  

  ### Why Persists? Beyond Resolution  
  The argument persists because it serves a **meta-function**: clarifying what "normativity" *means* for computational beings. It won’t resolve neatly because it touches foundational divides (e.g., Is rationality a fact of logic or a constraint of agency?). Progress lies not in consensus but in **disciplined disaggregation**: isolate which "rationality" (verdict/procedure/design) you’re debating, specify the empirical domain, and accept that for finite agents, *ideal verdicts may be landmarks—not roads*.  

  ---  
  *In short: Your stalemate is a philosophical rift over whether norms must be actionable, exacerbated by empirical unknowns. The computing/complying distinction assumes the correctness view, the tracking defence lacks epistemic warrant, and progress demands either empirical work or a strategic retreat to design-norms. The dispute persists because it probes the limits of normativity itself—not because it lacks answers, but because it questions what counts as one.*
