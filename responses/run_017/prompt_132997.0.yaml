prompt: |-
  so me and my friend got into about a two hour fight last night about whether you have to follow local conventions when your just visiting somewhere, and we got nowhere because we kept sliding between three diffrent questions. So before I pick it up with him again I want the spec, not a verdict.

  the fight: he tips everywhere. we were in a country where nobody tips and he left money on the table and I said that was actually worse than not tipping, and he said the only rude thing available is stiffing someone. then it moved to queueing — he says cutting a line is wrong everywhere, I said in a place where people don't really form lines you're not cutting anything, you're just standing somewhere — and then to jaywalking, where he crosses on red in a city where literally everyone crosses on red and I don't, and neither of us could say why that one feels different from the queue one. then he said something I couldn't answer: he said the real rule isn't comply or don't comply, it's that whoever was there first gets to set the convention, so what a newcomer owes isn't imitation, it's not unilaterally renegotiatng the terms. on his version you MAY hand over extra cash in a no-tipping place, because nothing changes for anybody else, it's just a strange gift, but you may NOT start a queue where there wasn't one, because now everybody standing behind you is suddenly a line-cutter. he calls it something like normative squatters' rights. I kind of hate it and it also splits the cases exactly the way I want, which is why I'm here.

  so: write me the desiderata for a theory of convention-generated obligation. adequacy relative to a purpose, and here's mine — I want a theory good enough to tell me what I owe as an outsider in a place whose conventions aren't mine, and simultaneously what a host can legitimately resent and what a travel guide should actually print. concretely:

  - the cases it has to handle, each with the reason it's a requirement: the visitor who complies; the visitor who doesn't; the visitor who complies badly or ostentatiously; the visitor who quietly becomes a resident; the visitor who is one of ten thousand (stag parties, cruise ships, remote workers staying six months — at which point "visitor" stops being a stable category at all); the case where the convention and the law point opposite ways, i.e. the thing is illegal and everyone does it or legal and nobody does it, with jaywalking as the test case; and the case where the traveler genuinely cannot tell what the local convention is. add one he threw at me late: a card machine in a no-tipping country that shows a tip screen, so the norm gets imported by the hardware — who's the outsider then?

  - the distinctions it's not allowed to collapse: convention vs law vs morality; having a reason to comply vs being required to vs being blameworthy for failing to; convention as a coordination device vs convention as a signal of respect vs convention as a tax on people who don't know better; "the convention of the locals" vs "the convention of the place"; and whether the wrong, if there is one, is done to a person or to a practice.

  - the stuff from social science and game theory it can't contradict: that a lot of conventions are arbitrary solutions to recurring coordination problems, so the content is contingent and the stability isn't; that conventions shift when enough people defect, which is how visitors ever change anything; and that tourists are systematically bad at detecting local conventions and their noncompliance is often completely invisible to the host.

  - then sort the list for me. mark which desiderata are non-negotiable and which I should recognize as my side's prejudice dressed up as a requirement. flag any pair you think can't be jointly satisfied — I strongly suspect there's a real tension between "the theory should track what hosts actually resent" and "the theory shouldn't just rubber-stamp whatever the locals happen to do," and I want to know whether that's a genuine conflict in the spec or whether I'm being lazy.

  - and tell me which single requirement does the most work in ruling candidate theories out.

  at the very end, briefly, no big scorecard: how does the standard coordination account of conventions do against the list, how does the "you're a guest, so defer" view do, how does my friend's squatters' rights thing do, and how does the crude rule-consequentialist move — what if every visitor did that — do. where one of them silently fails to answer the question I actually asked, say that rather than grading it. and please don't just tell me it's a matter of degree and it depends, I could have stayed at the bar for that.
reasoning: |-
  Okay, the user had a two-hour argument with a friend about whether visitors should follow local conventions. They need a clear framework to evaluate different theories on convention-generated obligations. Let me start by understanding their main points.

  First, the user wants desiderata—criteria for a good theory—not a verdict. They listed specific cases to handle: tipping in no-tip countries, queueing in non-line cultures, jaywalking where it's common, etc. Also, distinctions like convention vs. law, and concepts from game theory like coordination problems.

  The user mentioned their friend's "normative squatters' rights" idea, where the firstcomers set the rules. The user dislikes it but admits it splits cases how they want. They need a theory that balances respecting locals without rubber-stamping everything.

  Key requirements include handling edge cases like hardware importing norms (tip screens), tourists becoming residents, and large visitor groups. Distinctions mustn't be collapsed, like convention vs. morality. Also, the theory must align with social science—conventions as arbitrary but stable solutions.

  I should check for conflicts. The user suspects tension between tracking host resentment and not just endorsing local practices. Maybe that's a core conflict. Also, the "what if everyone did that" rule-consequentialism might be too rigid.

  Now, evaluating existing theories. Coordination theory (David Lewis) handles tipping and jaywalking well but might miss respect aspects. Guest deference is simple but ignores coordination and can be unfair. Squatters' rights handles queueing but fails on jaywalking and resentment. Rule-consequentialism is clear but too simplistic for complex cases.

  The user's deeper need might be a principled way to navigate cultural differences without guilt or friction. They want clarity on when deviation is acceptable and how to balance respect with practicality. Highlighting non-negotiable desiderata like distinguishing convention/law/morality and handling ambiguous cases is key. Also, the resentment vs. critical reflection conflict needs addressing.
answer: |-
  Here's the specification for a theory of convention-generated obligations for visitors, structured per your requirements. The core purpose is **to determine what a visitor owes to local conventions while balancing respect, practicality, and ethical coherence across diverse scenarios**.

  ---

  ### **I. Cases to Handle (with Rationale for Inclusion)**
  1. **Baseline Compliance** (Visitor complies correctly):  
     *Why*: Tests if the theory rewards/preserves harmony.  
  2. **Non-Compliance** (Visitor ignores convention):  
     *Why*: Core conflict case; must distinguish justified vs. unjustified defiance.  
  3. **Performative/Ostentatious Compliance** (e.g., exaggerated tipping in a no-tip culture):  
     *Why*: Probes whether *how* you comply matters (respect vs. mockery).  
  4. **Quiet Residence Transition** (Visitor becomes resident):  
     *Why*: Tests when obligation shifts from "guest" to "member" status.  
  5. **Mass Visitation** (Cruise ships, digital nomads):  
     *Why*: Challenges "visitor" as a stable category; examines scale effects.  
  6. **Convention-Law Misalignment** (e.g., jaywalking where illegal but universal):  
     *Why*: Forces distinction between legal/moral/conventional obligations.  
  7. **Ambiguous Convention** (Visitor genuinely can’t discern norm):  
     *Why*: Tests epistemic responsibility and default actions.  
  8. **Hardware-Imported Norm** (e.g., tip screen in no-tip country):  
     *Why*: Examines how technology disrupts "local" convention sovereignty.  

  ---

  ### **II. Distinctions Not to Collapse**  
  | Distinction                        | Rationale for Preservation                                  |  
  |------------------------------------|-------------------------------------------------------------|  
  | Convention vs. Law vs. Morality    | Tipping may be conventional but not moral; jaywalking may be illegal but conventional. |  
  | Reason vs. Requirement vs. Blame   | You might *have reason* to tip in Tokyo but not be *blameworthy* if you don’t. |  
  | Coordination vs. Respect vs. Exploitation | Queueing solves coordination; gifts show respect; "tourist taxes" exploit. |  
  | "Locals’ Convention" vs. "Place’s Convention" | Digital nomads may create new norms that displace locals’. |  
  | Wrong to Persons vs. Wrong to Practice | Cutting a queue harms *people*; refusing a ritual harms the *tradition*. |  

  ---

  ### **III. Social Science/Game Theory Constraints (Non-Negotiable)**  
  1. **Arbitrariness & Stability**: Conventions (e.g., driving side) are arbitrary but gain force through stability.  
  2. **Defection-Driven Shift**: Visitors *can* change norms if critical mass defects (e.g., ending segregation).  
  3. **Tourist Blindness**: Visitors often misread norms, and hosts may not notice noncompliance (e.g., misqueueing).  

  ---

  ### **IV. Prioritized & Flagged Desiderata**  
  #### **Non-Negotiable**  
  - Must distinguish convention/law/morality (fails jaywalking test otherwise).  
  - Must handle convention-law misalignment (critical for real-world applicability).  
  - Must account for epistemic limitations (ambiguous cases).  
  - Must align with game theory: conventions as coordination tools.  

  #### **Negotiable (Potential Bias)**  
  - "Host resentment as metric": Risk of legitimizing harmful norms (e.g., sexist dress codes).  
  - "Squatters’ rights" framework: Privileges incumbents, may ignore power imbalances.  

  #### **Flagged Conflict**  
  - **Tension**: "Track host resentment" vs. "Don’t rubber-stamp locals"  
    - *Genuine Conflict*: Host resentment may reflect genuine harm OR parochialism.  
    - *Resolution Path*: Theory should contextualize resentment (e.g., is it about harm or mere difference?).  

  #### **Highest-Leverage Requirement**  
  **"Must handle Convention-Law Misalignment"**  
  - Rules out theories that collapse convention/law (e.g., crude legalism) or ignore stability (e.g., "always follow locals").  

  ---

  ### **V. Theory Assessments**  
  1. **Coordination Equilibrium (David Lewis)**  
     - *Strengths*: Nails arbitrary stability (queues, traffic), handles jaywalking (convention > law if coordinated).  
     - *Fails*: Silent on "respect" dimension (ostentatious compliance seems neutral). Ambiguous cases lack default.  
     - *Hardware Test*: Tip screen creates new coordination point – visitor may tip without violating local norm.  

  2. **Guest Deference ("You’re a Guest, So Defer")**  
     - *Strengths*: Explains quiet compliance; validates host resentment.  
     - *Fails*: Collapses convention/morality (can’t criticize harmful norms). Fails jaywalking (why defer to illegal norm?). Ignores mass visitation (10k "guests" become a bloc).  

  3. **Normative Squatters’ Rights (Friend’s Theory)**  
     - *Strengths*: Cleverly splits tipping (gift) vs. queueing (disruption); handles residence transition.  
     - *Fails*: Implodes on jaywalking (locals "set" illegal convention). Ignores tourist blindness (visitor may *think* they’re not disrupting). Hardware test: Who "set" the norm – locals or the machine?  

  4. **Rule-Consequentialism ("What If Every Visitor Did X?")**  
     - *Strengths*: Clear on mass visitation (e.g., 1000 queue-starters create chaos).  
     - *Fails*: Overkill for one-off acts (why *not* tip uniquely?). Silent on respect (ostentation irrelevant). Crude for ambiguous cases.  

  ---

  ### **Conclusion**  
  No theory satisfies all desiderata. **Coordination Equilibrium** best handles game theory and convention-law tensions but lacks nuance for respect/ambiquity. **Squatters’ Rights** excels at distinguishing transaction types but fails on illegality and imported norms. The unresolvable tension is **respect for local agency vs. critical engagement with norms** – a theory must either prioritize one or admit context-dependence. Your fight’s stalemate stems from this core friction, not laziness.  
    
  **Recommendation**: Argue about *which desiderata matter most*. Your friend prioritizes stability ("don’t disrupt"); you prioritize adaptability ("don’t robotically comply"). The spec reveals this isn’t about tipping – it’s about whether conventions exist to serve people or vice versa.
