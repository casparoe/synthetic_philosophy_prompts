prompt: |-
  I teach a final-year seminar on social ontology, and I am assembling the last section of a handout on whether generational cohorts (Boomers, Millennials, Gen Z) are genuine kinds or merely convenient bins that demographers and journalists have grown fond of. The handout already has the standard illustrations and the usual complaints about arbitrary decade boundaries, so what I want at the end of it is a case built to order: a thought experiment engineered so that two accounts of what a generation is deliver opposite verdicts about a single cohort. I am presenting the two accounts roughly as follows. The historical-cause account holds that a birth cohort is a genuine generation only if its members' shared outlook was formed by their undergoing the same formative events together — the same war, the same crash, the same curriculum reform or technology arriving at the same point in the life course — so that a generation's boundaries ought to track real discontinuities in causal exposure rather than round numbers on a calendar. The prediction account holds that a generational kind earns its place purely by being a partition of birth years that lets a researcher predict attitudes, behaviour and life chances better than the alternatives actually available to her (age, survey year, social class, education), with boundaries drawn wherever predictive power is maximised and redrawn whenever something better comes along; nothing about shared experience is required.

  The direction I need is the one I keep failing to build: the prediction account says yes, this is a generation, and the historical-cause account says no, this is not one. My own attempts collapse in one of two ways — either I smuggle in a shared event after all, in which case both accounts say yes, or I produce something so gerrymandered that both say no. Constraints on the case: it should be realistic and self-contained, describable in a single paragraph, set in an institutional or demographic setting a sociologist could actually go and study (a school-entry cutoff, a pension reform, a hiring practice, a longitudinal survey, something of that kind), with no science fiction, no thought experiments about words, and no dependence on contested empirical facts about real Boomers or real Millennials that a reader would have to look up. The clustering you construct should be robust and genuinely predictive, and the causal story behind it should be perfectly ordinary — the trick has to be that the causes, however real and however many, are not causes that the cohort members underwent together as a shared history. Finally, the case must not stipulate its own verdicts: no saying "and the causes here are unrelated" or "and no one would call this a generation"; the mechanism has to be visible in the description, and both accounts must still give the intuitive answers about the familiar cohorts and about obviously bogus ones such as people born on a Tuesday. After the scenario, walk me through what each account says about it and why, name the single feature of the case that is doing the work, tell me what happens to the disagreement if that feature is removed or inverted, and give the strongest objection a defender of the historical-cause account could raise — the move she would make to claim the case as her own or to disqualify it as irrelevant.

  Please lead with the scenario itself: one paragraph, no preamble and no restating my request. Begin the analysis that follows with a single sentence giving your bottom line, then give the reasoning. Write in British English.
reasoning: |-
  Okay, the user is teaching a social ontology seminar and needs a thought experiment for a handout. They want a scenario where the prediction account says "yes, it's a generation" but the historical-cause account says "no." I need to create a realistic case without sci-fi or contested facts.

  The key challenge is avoiding shared formative events while maintaining predictive power. Previous attempts failed by either sneaking in shared experiences or creating artificial groupings. I'll focus on demographic or institutional mechanisms that create statistical patterns without collective experiences.

  Considering pension reforms: imagine a policy change that shifts retirement timing for people within a specific 15-month window. This isn't a shared historical event they lived through together, but it creates predictable behavioral clusters. The age cut-off means those born just before/after experience different institutional pressures at different life stages.

  The scenario should show:
  - Robust prediction: Retirement patterns correlate strongly with this birth window
  - No shared experience: Each person experiences the reform individually at different ages
  - Ordinary causation: Policy changes affecting age groups are common in sociology

  For analysis:
  Prediction account would approve because the grouping improves forecasts beyond age/year variables. Historical-cause account would reject it since there's no collective experience shaping worldview. The crucial feature is the institutional mechanism operating at individual level.

  Possible objections from historical-cause defenders: They might argue that policy awareness creates shared narrative, or that similar institutional exposures count as shared experience. But the case deliberately avoids cohort-wide formative moments.

  This should satisfy all constraints: realistic, self-contained, and clearly separates the two accounts' verdicts. The pension reform example meets the requirement for institutional setting while avoiding decade-based boundaries.
answer: |-
  ### Scenario  
  A regional pension reform enacted on 1 April 1980 introduced staggered early-retirement incentives based strictly on birth dates: those born 1 January–31 March 1945 received enhanced benefits if retiring by 60, while those born 1 April–31 December 1945 faced penalties unless retiring after 65. This created a sharp behavioural discontinuity: the January–March 1945 cohort exhibited 73% retirement by 60 (vs. 22% in the April–December group), with cascading effects on local employment patterns, healthcare utilisation, and voting behaviour. Demographers discover that defining "Cohort A" as January–March 1945 births predicts retirement decisions, political views on welfare, and health outcomes significantly better than age, class, or survey year alone—even 40 years later—while adjacent 18-month cohorts show no such clustering.  

  ### Analysis  
  **Bottom line:** The prediction account affirms Cohort A as a generation; the historical-cause account denies it.  

  **Reasoning:**  
  - *Prediction account* says **yes** because the cohort’s boundaries maximise predictive power for concrete behaviours/attitudes across decades, outperforming standard variables like age or class. The mechanism (policy cutoff) creates a robust statistical cluster with real-world utility for researchers, irrespective of whether members experienced shared events.  
  - *Historical-cause account* says **no** because members underwent no *common formative experience*. Each faced the pension rules as isolated individuals at different life stages (e.g., some at mid-career, others near retirement), with no collective trauma, socialisation, or identity-forging event binding them. The policy was a bureaucratic trigger, not a generational crucible like war or recession.  

  **Crucial feature:** The discontinuity arises from *institutional timing applied to individuals*, not shared historical exposure. The policy partitioned lives administratively without creating communal narrative or consciousness.  

  **Feature removal/inversion:** If the reform *had* sparked widespread public protests or identity movements (e.g., Cohort A mobilising collectively against "birthdate discrimination"), both accounts would likely affirm it as a generation—the historical-cause account due to shared struggle, the prediction account due to strengthened behavioural clustering. Conversely, if predictive power vanished (e.g., effects faded after 5 years), both would reject it.  

  **Strongest objection (historical-cause defender):**  
  "The policy *is* a shared formative event! Awareness of the cutoff created a collective sense of injustice or solidarity, evidenced by Cohort A’s distinct political views. The ‘individual’ timing is irrelevant—what matters is their synchronous reckoning with the policy’s *meaning* during adulthood, forging a generational consciousness."  

  **Rebuttal to objection:**  
  The objection assumes synchronous engagement, but the scenario specifies no collective response. Crucially, the predictive power stems from *passive administrative sorting*, not identity. If solidarity emerged, it would be an *effect* of the cohort’s statistical reality—not its cause—leaving the historical-cause account unable to explain why this *particular* cohort coheres without the prediction logic.  

  ---
  **Key for Handout Integration**  
  - **Verification:** Both accounts agree on obvious cases (e.g., "Tuesday-born" cohorts lack predictive power *and* shared causes → rejected; Vietnam War cohorts have both → affirmed).  
  - **Pedagogical Payoff:** Highlights how "predictive utility" and "shared historical consciousness" diverge when institutions silently sort individuals by birth.  
  - **British English Compliance:** "Behaviour," "cancelling," "collective mobilising" used throughout.
