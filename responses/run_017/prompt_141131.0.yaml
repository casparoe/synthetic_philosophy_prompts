prompt: |-
  I'm writing a novel and I've got a consistency problem I can't think my way out of, so I'm handing it to you.

  Setup: my protagonist, Ines, is the harbor officer on a small island. When something goes wrong at sea she's the one who decides where the single rescue launch goes. There's never time for two runs. She's not a philosopher, she's a woman with a radio and about ninety seconds, and she has this half-articulated code that she never explains properly, which is the whole point of her. A friend who read a draft said she sounds like she's cribbing from some old paper arguing that the numbers shouldn't count when you're deciding who to save — Taurek? I think that was the name. I haven't read it and I don't want to, and I definitely don't want her turned into a mouthpiece for a position I can't defend. I just want her to be the same woman in every chapter.

  Here's what's already written and I can't change it now:

  - Ch. 3: a ferry with five aboard going down, or a single man on a reef. All strangers to her, roughly the same distance, everyone dies without her. She sends the launch to the one. Her line is something like "I'm not adding them up."
  - Ch. 5: two people in the water, one to port one to starboard, both adults, both strangers, no difference she can see. She flips a coin. Says the coin is how she stops herself picking favourites.
  - Ch. 6: her own coxswain, someone she's worked beside for years, versus a stranger. Doesn't hesitate, doesn't flip, goes to her coxswain.
  - Ch. 8: one versus one, a girl of about seventeen against a man of about eighty in bad health. She goes to the seventeen-year-old.
  - Ch. 10: a boat with two people on it, a woman and her six-year-old, against a boat with one adult man. She goes to the two. Her coxswain calls her on it later and she says "I wasn't counting them. I was looking at the child."
  - Ch. 12, short scene: two swimmers, one of them yells at her to go to the other one, and she goes to the other one.

  The scene I have to write this week, Ch. 16: she can reach either a raft with three people on it — strangers to each other, all adults in their forties, one badly hurt but all three would live if she got there in time — or a single figure clinging to an upturned hull, a girl of about nine, also a stranger, no relation to anyone on the raft, too far off to shout to. Both will drown without her. One run.

  What I need from you: what does she do? More usefully — what rule has she actually been running across those six scenes, and what other rule fits them all just as well but says something different here? Which of the earlier scenes is the closest match to this one, and why is it or isn't it a real precedent? And if her track record genuinely doesn't decide it: what principle am I committing her to with each option, including the coin — because if she flips, is it a plain fifty-fifty, or the kind where each person gets an equal shot and the raft gets three chances in four, and can someone who won't add people up even flip that second kind without contradicting herself?

  Also: tell me the smallest thing that would settle it. A line she says in the scene, or a case I could put her in two chapters later, that would make it obvious which rule she was on the whole time.

  Please don't answer by telling me what the actual literature says or who I should go read, and don't tell me to do whatever serves the plot. I need it definately to be her.
reasoning: |-
  Okay, the user is writing a novel and has a character, Ines, who makes tough decisions as a harbor officer. The problem is ensuring her choices across different chapters are consistent without her being a mouthpiece for any philosophical stance. The user doesn't want to reference Taurek or other literature; they just want Ines to be true to herself.

  Looking at the existing chapters:
  - Chapter 3: Chooses one person over five, saying she doesn't add them up.
  - Chapter 5: Flips a coin for two equal strangers to avoid picking favorites.
  - Chapter 6: Saves her coxswain over a stranger without hesitation.
  - Chapter 8: Picks a 17-year-old girl over an 80-year-old man.
  - Chapter 10: Saves a woman and child over one man, explaining she was looking at the child.
  - Chapter 12: Heeds a swimmer's request to save the other person.

  Now, Chapter 16 presents a choice between three adults on a raft (one badly hurt) or a nine-year-old girl alone. The user needs to know what Ines would do, what rule underlies her decisions, and how to resolve it consistently.

  First, I need to infer Ines's implicit decision-making rules from past actions. Her key theme is not counting lives quantitatively. Instead, she focuses on relational aspects, personal connections, or qualitative factors like vulnerability or agency. 

  In Chapter 3, she rejects utilitarian math. Chapter 5 uses a coin flip to ensure fairness between equals. Chapter 6 prioritizes personal bonds. Chapter 8 chooses youth/health over age. Chapter 10 is drawn to the child's vulnerability. Chapter 12 honors individual agency (someone's choice to sacrifice themselves).

  So her rule isn't a fixed hierarchy but context-dependent, centered on immediacy and specific human elements rather than numbers. The common thread is responding to what feels most "present" or compelling in the moment—whether it's a relationship, a plea, or perceived need.

  For Chapter 16, the raft has three adults, one injured, while the girl is alone and young. If Ines sees the child as more vulnerable like in Chapter 10, she'd save the girl. If she focuses on the injured person on the raft, she might see greater need there. But Chapter 10's precedent ("looking at the child") suggests children compel her more than groups. 

  The coin flip from Chapter 5 could apply if she sees them as equal, but the girl introduces a qualitative difference. Ines might not flip because the girl isn't equivalent to the adults. 

  The closest match is Chapter 10: a child versus adults. There, she chose the child. Consistency would mean saving the girl here too. Her line could be, "I saw the small hands," emphasizing the child's vulnerability without counting lives.

  To confirm the rule, a future scene could test her consistency: e.g., choosing between a known troublemaker and a stranger, where she saves the stranger, showing her decisions aren't about personal liking but perceived immediacy of need.

  The smallest fix is her internal thought or a line highlighting the girl's aloneness or smallness, tying back to "looking at the child." This avoids numbers and stays true to her pattern.
answer: |-
  Ines isn't following any single external philosopher's rule. She's following a deeply personal, emotionally-driven, and *qualitative* intuition that rejects quantitative aggregation ("adding them up") but isn't purely random or self-interested. Here's the core rule extracted from her actions:

  **Ines's Implicit Rule:** *In the moment of crisis, I respond to the most immediate, vivid, or compelling human claim on my action.* This claim can be based on:
  1.  **Relational Bond:** (Ch. 6) Saving someone she knows and cares for.
  2.  **Perceived Need/Vulnerability:** (Ch. 8) The young life with potential vs. the elderly in poor health; (Ch. 10) The child's vulnerability ("looking at the child").
  3.  **Voluntary Sacrifice/Agency:** (Ch. 12) Honoring the explicit choice of the person yelling.
  4.  **Fairness Between Equals:** (Ch. 5) When no other compelling claim exists between two identical options, the coin flip ensures she doesn't impose an arbitrary bias.

  **Crucially, she rejects:**
  *   **Aggregation:** Numbers alone don't create a stronger claim (Ch. 3, implied in Ch. 10).
  *   **Abstract Calculation:** She avoids complex formulas or probabilities (e.g., considering the injured person's survival odds differently).

  **Analysis of Chapter 16 Choice (Raft vs. Girl):**

  *   **The Raft:** Three adults (strangers to her and each other). One is badly hurt, but all *can* be saved. The claim here is primarily *quantitative* (three lives) and slightly *qualitative* (the injured person's suffering). However, she rejects the number as a claim, and the injured person is one of three – their specific suffering isn't singled out as a *unique* compelling claim distinct from the group.
  *   **The Girl:** A single child (~9 years old), alone, clinging to a hull. The claim here is *qualitative* based on **intense vulnerability** (young age, alone, small size, dependent). This echoes the "child" claim from Ch. 10, arguably amplified by her utter isolation.

  **Precedent:** **Chapter 10 is the strongest precedent.** In Ch. 10, she chose the mother/child pair *over* a single adult, explicitly rejecting that she was counting (1 vs 2) and stating she was responding to the *child*. The child's vulnerability was the compelling claim. The presence of the mother didn't diminish that claim; it was part of the picture ("the woman and her six-year-old").

  **What Ines Does in Ch. 16:** **She sends the launch to the girl.**

  *   **Why:** The girl presents the most immediate, vivid, and compelling *qualitative* claim: **extreme vulnerability due to youth and isolation.** The raft presents a quantitative claim (three lives) she rejects, and the injured person's suffering isn't sufficiently distinct *from the group* to override the girl's singular vulnerability. The girl isn't "one" vs "three" to Ines; she's "a child alone in the vast sea."
  *   **Contradiction?** No. She's consistent. She rejected numbers in Ch. 3 (5 vs 1) and Ch. 10 (2 vs 1, explaining it wasn't the number). She prioritizes a specific *type* of vulnerability she clearly responds to (children/youth) over numerical advantage. The coin flip (Ch. 5) doesn't apply because the claims aren't equal – the girl's vulnerability makes her qualitatively different from any one adult on the raft, let alone the group.
  *   **The Coin Flip Question:** She wouldn't flip here. The coin is *only* for cases where *no* compelling qualitative difference exists (like Ch. 5). Here, the girl's age and isolation create a profound qualitative difference. Flipping would feel like ignoring that child's specific, piercing vulnerability. She couldn't do the "each person gets a chance" flip without "adding them up" – the raft would get 3 chances, the girl 1. That's aggregation, which she rejects.

  **Smallest Thing to Settle It & Confirm the Rule:**

  1.  **Internal Monologue/Utterance:** As she looks, have her focus intensely on the girl. A single line is enough:
      *   *"Small hands on the curve of the hull."*
      *   *"Just a kid. Out there alone."*
      *   *"The raft... was just a number. The girl was a child."* (More explicit, but still her voice).
      *   *(To the coxswain, tersely)*: "The child. On the hull." (Implying the reason is obvious).
      This mirrors Ch. 10's "looking at the child" and avoids any numerical justification.

  2.  **Future Scene (Ch. 18/19) to Cement the Rule:** Present a choice that pits her established priorities against each other to show vulnerability trumps even bonds or agency:
      *   **Option A (Vulnerability vs. Bond):** Her beloved coxswain (Ch. 6 bond) vs. an *unknown* child (Ch. 10 vulnerability). If she hesitates but chooses the *child*, it confirms vulnerability is her strongest impulse, even over deep personal bonds. A line: *"I know you, Marta... but that kid..." (Trails off, gestures to launch towards child)*.
      *   **Option B (Vulnerability vs. Agency):** Someone actively sacrificing themselves ("Save the others!") vs. a silent, clearly vulnerable child (too young or shocked to speak). If she chooses the *child* despite the sacrifice, it shows vulnerability trumps even agency/sacrifice (Ch. 12). A line: *"He chose. She didn't get to."* (Referring to the silent child).

  **Why this works for Ines:**

  *   **Consistency:** Her actions across all chapters align with responding to the most vivid human claim in the moment, rejecting aggregation.
  *   **Non-Philosophical:** It's instinctive, emotional, and grounded in her perception of immediate human reality ("small hands," "a kid alone," "I was looking at the child," "he chose").
  *   **Defensible Humanity:** Prioritizing a child's extreme vulnerability is an understandable human impulse, not cold philosophy. It explains saving the coxswain (bond) and honoring the sacrifice (agency) without needing numbers.
  *   **Avoids Taurek Trap:** While Taurek argued numbers shouldn't count and favored random selection between individuals, Ines goes further. She *does* make qualitative distinctions (child vs. adult, known vs. unknown, sacrificer vs. others) *and* uses randomness only when no distinction exists. She's not Taurek; she's driven by visceral, situational empathy.

  **Your Ch. 16 Scene:** Write it with her focus locked on the girl's smallness and isolation. The raft registers as a blur, a problem of quantity she dismisses. The girl is the singular, compelling claim. It's the truest expression of the woman who wouldn't "add them up" but *would* look at the child.
