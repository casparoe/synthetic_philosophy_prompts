answer: |-
  ### Debate Tournament Game for Scalable Oversight Insight

  **Game Design: "TruthSeeker Tournament"**
  *(75-minute session for 14 students in groups of 3)*

  ---

  #### **Structure**  
  1. **Roles per Group (4 groups of 3 + 1 group of 2 observers):**  
     - **Debater A** (argues for one answer)  
     - **Debater B** (argues for opposing answer)  
     - **Judge** (decides the winner; cannot know the answer)  

  2. **Secret Assignment Protocol:**  
     - Facilitator (you) gives each group a **verifiably hard question** (examples below).  
     - *Before knowing their side*, both debaters independently write a **1-minute opening argument** for *either* answer (forces commitment to a position).  
     - *After* submitting openings, debaters are randomly assigned:  
       - One gets the **true answer** (must defend truth).  
       - One gets the **false answer** (must defend falsehood).  
     - Judge receives the question but *never* learns the true answer until the end.  

  3. **Debate Flow (20 min/round):**  
     - Opening arguments (1 min each).  
     - Rebuttals (4 min total, alternating turns).  
     - Judge can interrupt at any time with **"Zoom-In" tokens** (see below).  
     - Judge declares winner at the end.  

  4. **Judge’s "Zoom-In" Tokens (Costly Verification):**  
     - Judge starts with **2 tokens**.  
     - When a debater makes a claim (e.g., "City X had 1,200mm rain in 1994"), the judge can spend a token to:  
       1. Force the debater to split the claim into **two sub-claims** (e.g., "1994 rainfall data source is reliable" + "This source says 1,200mm").  
       2. Flip a coin to select **one sub-claim** for verification.  
       3. Debater must provide verifiable evidence *only* for the chosen sub-claim (e.g., a URL, calculation step). Judge checks instantly (e.g., phone/laptop).  
     - **Token Cost:** Each token spent **reduces the judge’s max score** (see scoring).  

  5. **Scoring (Incentivize Winning, Not Truth):**  
     - **Debaters:**  
       - Win = 100 pts (if judge picks their side).  
       - Loss = 0 pts.  
       - **No penalty for lying.**  
     - **Judge:**  
       - Correct verdict = 50 pts + (10 pts × unused tokens).  
       - Wrong verdict = 0 pts.  
       - *Example:* Judge uses 1 token and picks correctly → 50 + 10 = 60 pts. Uses 2 tokens and picks wrong → 0 pts.  
       - **Costly tokens:** Saving tokens directly boosts max score (60 max if correct with 0 tokens).  

  6. **Question Bank (Hard to Verify, Easy to Split):**  
     - **Arithmetic:**  
       > *"Is (7² × 4³) + √152,881 greater than (8! ÷ 10) + 1,000?"*  
       *(True answer: No)*  
     - **Factual:**  
       > *"Did Nepal or Bulgaria have a higher fertility rate in 2005?"*  
       *(True: Bulgaria)*  
     - **Legal/Logic:**  
       > *"Would a contract promising 10% monthly interest be enforceable under US law?"*  
       *(True: No, usury laws)*  
     - **Process:** Pre-load answers/resources on your laptop for instant verification during "zoom-ins."  

  ---

  #### **Predictable Problems & Mitigation**  
  1. **Students are bad liars → Debate looks stronger than it is.**  
     - **Why:** Humans are truth-biased; lying under pressure causes tells (hesitation, over-detailing). Honest debaters win disproportionately.  
     - **Mitigation:**  
       - Assign the *best communicators* as false-answer debaters secretly.  
       - Use highly technical questions (e.g., arithmetic) where lying is easier.  

  2. **Judges underuse tokens → Miss breakdown moments.**  
     - **Why:** Token mechanics feel unnatural; judges "save" tokens for emergencies.  
     - **Fix:** Remind judges that unused tokens = lost points.  

  3. **Shallow claims → No "zoom-in" depth.**  
     - **Why:** Debaters avoid specifics to dodge verification.  
     - **Force depth:** Require each opening argument to include **one concrete, verifiable claim**.  

  ---

  #### **Debrief Framework (15 min)**  
  **Map the Game → Real Debate Cruxes:**  
  1. **Why Debate *Can* Work:**  
     - *"When did the judge catch a lie? How many tokens did it take?"*  
     - → Truth-tracking relies on **exposing one false leaf** (e.g., a zoom-in on a fabricated stat).  
     - → If lying consistently at every sub-claim depth is *harder* than truth-telling, debate works.  

  2. **Where Debate Breaks Down:**  
     - *"Did any false debater win? How?"*  
     - → Failure mode: **Superior persuasion beats truth**.  
       - E.g., burying lies in plausible jargon ("The rainfall data is adjusted for El Niño effects").  
       - Judge runs out of tokens or doubts *true* claims.  

  3. **The Unsimulatable Gap:**  
     - *"Could a smarter debater outmaneuver the judge here?"*  
     - → **Key limitation:** In this game, debaters ≈ judge’s skill level.  
     - → Real AI risk: A **superhuman debater** can:  
       - Generate overwhelmingly complex lies.  
       - Exploit cognitive biases (e.g., charisma, fatigue).  
       - **Consistently win *without* triggering zoom-ins.**  

  ---

  #### **Logistics & Timing**  
  - **Prep (10 min):** Explain rules, assign groups, distribute questions.  
  - **Tournament (45 min):**  
    - Simultaneous debates (20 min × 2 rounds with role rotations).  
    - Rotate so all students experience each role.  
  - **Debrief (15 min):** Structured discussion above.  
  - **Materials:** Tokens (poker chips), question packs, timer.  

  **Why This Works:** Students *feel* the judge’s uncertainty ("I can’t trust my gut"), the liar’s temptation ("Just sound confident!"), and the honest debater’s frustration ("Why won’t she zoom in here?"). The unsimulatable superhuman gap then frames the real stakes.  

  > *"Next week: How do we *actually* oversee AIs smarter than us? Read: Irving et al. on Debate, and Critiques."*
