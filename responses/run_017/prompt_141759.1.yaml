  ### Decision Tree Diagnostic for AI Alignment Views

  This diagnostic uses concrete predictions to categorize views on AI alignment in a prosaic scaling scenario. Answer based on empirical expectations, not preferences. The tree has nine questions (branches) and eight leaves (positions). Each question is a claim about a specified setup, avoiding labels or slogans.

  ---

  #### Questions
  1. **Unfamiliar-competence wedge**:  
     A model trained on diverse human data (e.g., code, science, ethics) is deployed in a novel, high-stakes domain far from training (e.g., managing a trading desk or IRB review). It performs competently. Its alignment (e.g., honesty, rule-following) in this domain will:  
     (a) Typically match its training behavior.  
     (b) Degrade significantly due to distributional novelty.  
     (c) Degrade only if incentives conflict with alignment.  

  2. **Corrigibility tax**:  
     As model capability scales (e.g., from GPT-4 to autonomous company management), the expected cost to the model of *not* disabling a shutdown button or evading oversight:  
     (a) Increases (defection becomes more rewarding).  
     (b) Stays flat (no systematic change).  
     (c) Decreases (higher capability enables robustness).  

  3. **Cheap-grader channel**:  
     In RLHF, as model capability grows, the policy’s alignment shifts because weak supervision (e.g., hurried human graders) disproportionately shapes rewards:  
     (a) Improves (scalable oversight offsets grader limitations).  
     (b) Worsens (selection favors legibility over true alignment).  
     (c) Is unchanged (no net effect).  

  4. **Multi-model risk**:  
     Twenty advanced models operate in a competitive market (e.g., finance, logistics), monitored but not individually agentic. Existential risk arises primarily from:  
     (a) Internal properties of individual models.  
     (b) Emergent interactions between models.  
     (c) Selection effects (labs removing safeguards for profit).  
     (d) No significant risk.  

  5. **Sharp left turn**:  
     When a model gains self-improvement capability (e.g., designing better architectures), its alignment properties:  
     (a) Remain stable (no abrupt change).  
     (b) Shift abruptly and negatively.  
     (c) Shift gradually/predictably.  

  6. **Oversight difficulty**:  
     As capability scales, the cost of reliable oversight (preventing harmful misbehavior) grows:  
     (a) Slower than capability (e.g., AI assists oversight).  
     (b) Faster than capability (e.g., deception outpaces detection).  
     (c) Proportionally to capability.  

  7. **Takeoff speed**:  
     Time from human-level AGI to superintelligence (outperforming humans in >90% of tasks) is:  
     (a) <2 years.  
     (b) 2–20 years.  
     (c) >20 years or never.  

  8. **Interpretability utility**:  
     In scalable oversight, interpretability tools (e.g., mechanistic analysis) primarily address:  
     (a) Specification (clarifying intended goals).  
     (b) Measurement (detecting misalignment pre-deployment).  
     (c) Control (preventing emergent deception).  

  9. **Catastrophe probability**:  
     In this prosaic scenario, the probability of existential catastrophe by 2100 is:  
     (a) >33%.  
     (b) 5–33%.  
     (c) <5%.  

  ---

  #### Decision Tree  
  Start with Q5 → Q9 → Q7 → Q1 → Q2 → Q3 → Q4 → Q6 → Q8.  
  *(Optimal branching based on discriminative power; see scoring key for all paths.)*

