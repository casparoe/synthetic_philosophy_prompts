prompt: |-
  Longtime lurker, occasional commenter, been reading the same handful of blogs since the sequences days, which means I've seen roughly nine thousand comments that say "oh, that's just X" when it obviously isn't X. I want to preempt a few of those.

  There's a pattern I keep bumping into and I don't have a word for it. And I don't just want a word — I want the boundaries, because I keep wanting to point at it in arguments and I can't tell where it stops.

  Three instances:

  1. My transit authority ripped the big printed network maps out of the stations and put up QR codes for a trip planner. The app is genuinely better: real-time, reroutes around closures, tells you which elevator is out. Nobody there sat down and decided to make things worse for people without smartphones — they'd be horrified, and I believe them. And the paper timetable is technically still "available": you can ask at the one staffed station, between 9 and 5, or have one mailed to you. The practical result is that getting across town without a charged phone and a data plan is now a thing you plan a day ahead and have to be a bit of a nuisence about.

  2. My kid's school moved permission slips, report cards and lunch money into one portal. Parents without reliable home internet aren't blocked — there's a computer in the library, and the office will print things for you. But doing it the old way now means turning up in person during office hours and visibly being the person who needs help. Two parents I know have quietly stopped receiving the notices.

  3. My building swapped the concierge for package lockers. If your parcel doesn't fit, or the lockers are full, it goes to a depot across town, open weekdays, reachable by car. Same shape: the new system is better for most people, and what it does to the rest happens entirely in the part of the system nobody designed.

  What I think I'm seeing: the political effect isn't in the artifact at all. It's in the absence the artifact leaves behind. The old way doesn't get banned; it gets demoted from a default to a favour you request, in person, during business hours, from someone who can say no. So the distributional consequence lives in the fallback, and the fallback is never designed, voted on, or costed — it's just whatever is left over. And the artifact looks completely neutral right up until you ask what happens to someone who can't use it. At which point the standard reply is "it's still available, nobody is excluded," which is literally true and feels like it's answering a different question.

  Things I've already had tried on me that I don't think are it:

  - "Digital divide." That names a gap between people who have a thing and people who don't. But here the new artifact is better for the people on the wrong side of the gap too, and the harm comes from the demotion of the old default, not from the gap. I'm genuinely unsure whether closing the gap would fix my cases or not — that's part of what I want carved.
  - "Moloch" / race-to-the-bottom / multipolar trap. No: nobody here is competing, and the people who adopted the artifact weren't forced into it by anyone else's adoption. They'd have chosen differently if the fallback had been on the agenda at all.
  - The famous essay about the parkway overpasses built too low for buses to get under. That's the closest thing I know, and I think it's still the wrong shape: there the politics is in the design and in normal operation, and there's someone who wanted it. In my cases, if you look only at the artifact doing its job there is nothing political to find. The politics is entirely in a state of the world in which the artifact isn't working for you.

  So: is there an established concept for this — in the technology-and-politics literature, STS, design theory, wherever it actually lives — and if it's only near something established, what's the nearest thing and exactly how does my pattern differ from it?

  A couple of sub-questions I care about, because I think they're where the edges are:

  - Is the humiliation component part of this thing or separate? In instance 2 the fallback isn't just costly, it's costly in a way that makes you a visible supplicant. Does that belong inside the concept, or is it a distinct effect that merely co-occurs?
  - What about a case where the fallback is genuinely fine — say the mailed timetable is nicer than the old station rack, and arrives in two days? The default still moved. Is it still my phenomenon?
  - What about an artifact that gets added without anything being displaced, so the old default stays the default? I want to say "no politics," but I'm not confident.

  Format, please:

  - **"If it has a name"** (~120 words): straight yes-or-no answer up front, don't bury it.
  - **"Nearest misses"** (~350 words): at least three established neighbours, how my pattern differs from each, and which one fits best — including why "digital divide" and the overpasses essay are and aren't it.
  - **"The carve"** (~250 words): a definition tight enough that I can apply it to a new case, with what has to be true for it to count.
  - **"Edge cases"** (~200 words): the three above — dignitary cost, an actually-good fallback, and addition without displacement.
  - **"What to call it"** (~60 words): if it's unnamed, a term and a one-line gloss.
reasoning: |-
  Hmm, the user is describing a recurring pattern where technological upgrades create unintended exclusion by demoting old systems to inconvenient fallbacks. They want to identify this phenomenon precisely—its boundaries, related concepts, and potential names. 

  First, I need to confirm if this has an established name. I recall concepts like "technological abandonment" from STS, but it's niche. "Accessibility erosion" isn't standard either. So no—this lacks a widely recognized term. The user will appreciate that honesty upfront.

  For nearest misses, "digital divide" is the obvious candidate, but it doesn't fit: the harm here isn't the tech gap itself but the degraded fallback. The user already rejected this, rightly. "Plausible deniability" in policy comes closer—it captures how systems avoid accountability—but focuses on intent, whereas the user's cases involve unintentional harm. "Designed neglect" (from urban studies) is the best fit: it describes how infrastructure changes passively exclude by not designing fallbacks. The low-bridge example they mentioned differs because it's active exclusion; their cases are passive. 

  Defining "the carve" requires precision. Key elements: 1) a new default artifact that's better for most, 2) demotion of the old system to a fallback requiring active negotiation, 3) no malice, just unconsidered consequences. The harm emerges from the fallback's friction—cost, dignity loss, unpredictability. This distinguishes it from deliberate exclusion.

  Edge cases clarify boundaries. The humiliation factor (e.g., parents needing help) is core—it amplifies exclusion by adding social cost. A genuinely good fallback (e.g., mailed timetable) still counts if the default shift creates friction, like planning ahead. But if nothing is displaced (e.g., adding online portals while keeping paper as default), it's not the phenomenon—no demotion, no harm.

  For naming, "Fallback Displacement" works: "displacement" implies the old system's degradation, "fallback" centers the residual harm. The user needs a crisp term to shortcut debates, so this should resonate.
answer: |-
  ### **If it has a name**  
  No. While adjacent to concepts like "technological abandonment," "accessibility erosion," and "designed neglect," this specific pattern—where a *demoted fallback* creates exclusion without malice—lacks a universally recognized term in STS, design theory, or political science. It’s often discussed piecemeal but not systematized.  

  ---

  ### **Nearest Misses**  
  1. **Digital Divide**:  
     *Fits*: Highlights unequal access to technology.  
     *Misses*: Your cases aren’t about the *new* tech gap but the *degradation of the old default*. Harm arises from the fallback’s friction (e.g., mailing timetables vs. QR codes), not smartphone ownership. Closing the gap wouldn’t fix humiliation or in-person burdens; the demoted system remains cumbersome.  

  2. **Plausible Deniability in Policy (e.g., "veiled racism")**:  
     *Fits*: Systems appear neutral while hiding exclusion (e.g., "available upon request" fallbacks).  
     *Misses*: Your cases lack intent. The transit authority *didn’t* design humiliation; it emerged from unplanned residuals. Overpasses (your reference) fit here—deliberate design—but your pattern is *unintentional*.  

  3. **Designed Neglect (Urban Studies)**:  
     *Fits*: Infrastructure changes passively exclude by not accounting for fallbacks (e.g., lockers displacing concierges).  
     *Misses*: Neglect implies awareness; your cases show genuine oversight. The "artifact neutrality" illusion (e.g., portal efficiency) differs from active disinvestment.  

  **Best Fit**: **Designed Neglect** comes closest but requires stretching. Your pattern is its *unintentional cousin*: not malice but *systemic blindness* to how demoting defaults redistributes burden.  

  ---

  ### **The Carve**  
  Your phenomenon occurs when:  
  1. **A new default artifact** (digital tool, system) replaces an old one, improving efficiency for most users.  
  2. **The old artifact is demoted** (not eliminated) to a *fallback* requiring active negotiation (e.g., in-person requests, delays).  
  3. **Exclusion emerges unintentionally** from the fallback’s friction:  
     - It imposes *asymmetric costs* (time, dignity, access barriers) on marginalized groups.  
     - These costs exist *because* the fallback was never designed/vetted—it’s a residual.  
  4. **The artifact itself appears neutral**; harm only surfaces when the fallback is triggered.  

  *Key test*: If removing the new artifact restores the old default *without friction*, it’s your pattern.  

  ---

  ### **Edge Cases**  
  1. **Humiliation Component**:  
     Core to the phenomenon. The fallback’s "supplicant" dynamic (e.g., parents needing office help) isn’t incidental—it’s the *mechanism* of exclusion. Demotion creates social friction, deterring use.  

  2. **Genuinely Good Fallback**:  
     Still counts. If the mailed timetable is "nicer" but requires 48-hour foresight, the *default shift* itself imposes planning burdens. Harm persists via *disruption of spontaneity/equality*, even if the fallback is pleasant.  

  3. **Addition Without Displacement**:  
     Not your pattern. If paper forms remain the default alongside a new portal (no demotion), exclusion vanishes. Politics enters only when the old system loses default status.  

  ---

  ### **What to Call It**  
  **Fallback Displacement**: *The unintentional exclusion arising when a new system demotes an old default to a high-friction fallback, redistributing burden to marginalized users.* Gloss: Neutral upgrades that shunt resisters into undesignated, costly alternatives.  

  (Note: This carves your core while allowing edge cases like "good fallbacks" to fit via friction analysis.)
