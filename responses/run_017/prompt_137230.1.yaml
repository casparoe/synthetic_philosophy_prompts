prompt: |-
  I direct a graduate seminar in decision theory, and after last week's session two colleagues stayed behind and argued over lunch; they have since asked me to referee, and I would rather not answer off the cuff. One of them had presented Good's theorem in roughly this form: for a Bayesian expected-utility maximizer whose utility function is fixed and takes only acts and states as arguments, the ex ante value of costless information is never negative, since the expectation of a maximum is at least the maximum of an expectation — you can always act as though you had not looked. Their exchange, as I reconstruct it:

  (1) Miriam: Then the well-documented reluctance to take free predictive genetic tests is simply irrational. If the result could affect your plans, you should look; if it could not, looking costs you nothing.

  (2) Ted: The theorem is fine, but its antecedent is exactly what is in dispute. It assumes utility attaches to acts and states, not to the agent's own credences. Add a self-directed term — a disutility that is a function of your own subjective probability of a bad outcome, the disutility of dreading it — and the proof no longer goes through, because information then moves utility directly and not merely through your choice. The refusers may be expected-utility maximizers with a richer utility function, not violators of the theory.

  (3) Miriam: That concedes too little. Re-run the proof with a self-directed term B: the Jensen step only requires that B be convex in the credence. The natural model of dread, with disutility proportional to subjective probability, is linear and hence convex — the expected dread after learning equals the dread before learning — so the theorem survives untouched. A self-directed term is not enough; you need B to be non-convex.

  (4) Ted: Then take the case that is arguably the phenomenologically accurate one, where the cost of finding out is lumpy rather than proportional. Call it threshold dread: a discrete penalty that switches on once your credence in the bad outcome passes some threshold, so that a person can live with a one-in-three chance of a late-onset disease and still be unwilling to convert that chance into certainty. That B is not convex; the expected penalty after a conclusive test exceeds the penalty at the prior; the test's expected value really is negative.

  (5) Miriam: Grant that the proof breaks there — but that only relocates the argument. Good's theorem is conditional and says nothing about which utility functions are rationally admissible. The real question is whether lumpy, threshold-shaped dread is rationally permissible: if it is not, the refusers are irrational for a reason the theorem never stated, and if it is, the theorem simply does not apply to them, which the theorem never denied.

  (6) Ted: Then the theorem is normatively close to empty. Its antecedent fails precisely in the cases where people actually decline information, so citing it to convict them of irrationality assumes the answer to the only question at issue; the appearance of a clean, purely formal argument against information-avoidance is an illusion.

  Please referee this rather than settling the topic from scratch: I want a verdict on the arguments as they were actually made, not a fresh treatise on the value of information. Structure your reply in four named sections, in this order: "Verdict up front" (two to three sentences); "Move-by-move" (one short paragraph per numbered move, each opening with a rating from clearly mistaken, through partly right but incomplete, to clearly right); "The technical crux" (roughly 200 words: is Miriam's convexity point in (3) correct, does Ted's threshold case in (4) genuinely defeat it, and what exactly is the condition on the self-directed term); and "What both are missing" (roughly 200 words on anything the exchange leaves out — the ex ante/ex post contrast, strategic or observer effects on the value of a test, or whatever you take to matter more than either of these).
reasoning: |-
  Hmm, the user wants me to referee an academic debate about Good's theorem and genetic testing avoidance. This is a nuanced decision theory discussion between two colleagues - Miriam and Ted - about whether avoiding free predictive genetic tests can be rational.

  First I need to understand their arguments clearly. Miriam (1) claims genetic test refusal is irrational based on Good's theorem about non-negative value of information. Ted (2) counters that utility functions might include "dread" as a self-directed term. Miriam (3) argues dread as linear disutility wouldn't change the theorem since linear functions are convex. Ted (4) proposes threshold dread with non-convex disutility that could make information harmful. Miriam (5) shifts to whether such utility functions are rationally permissible, while Ted (6) argues this makes the theorem normatively empty in relevant cases.

  For my verdict: Ted is mostly right that the theorem's applicability is limited in cases people actually avoid information, but Miriam correctly identifies that the core issue is about rational permissibility of utility functions. Both make valid technical points.

  For move-by-move analysis:
  - (1) Miriam is partly right but incomplete (overlooks utility function scope)
  - (2) Ted is clearly right (correctly identifies utility function assumption)
  - (3) Miriam is clearly right on convexity math
  - (4) Ted is clearly right about non-convex threshold case
  - (5) Miriam is clearly right shifting to permissibility question
  - (6) Ted is partly right but incomplete (overstates normative emptiness)

  The technical crux: Miriam's convexity point is mathematically correct - linear B preserves the theorem. Ted's threshold dread (with concave/convex regions) genuinely defeats it when B is not convex. The precise condition is that the self-directed term must be a convex function of the posterior probability for information to retain non-negative value.

  What both miss: They overlook the ex ante/ex post welfare distinction - information avoidance might be ex ante rational but ex post irrational. Also missing are observer effects (how test results might affect others' behavior toward the agent) and strategic considerations in disclosure. These could justify refusal without invoking dread utility.

  I'll structure my response exactly as requested: verdict up front, move-by-move analysis, technical crux, and overlooked aspects. I'll keep each section focused and within the specified word limits, especially for the technical and missing parts which need to be around 200 words each.
answer: |-
  ### Verdict up front  
  Ted's core normative concern is compelling: Good's theorem's antecedent (utility depending solely on acts and states) often fails precisely when people decline information, making the theorem normatively weak for condemning avoidance as irrational. Miriam correctly defends the theorem’s formal robustness to linear self-directed utility but concedes its vulnerability to non-convex cases. The dispute ultimately hinges on the rational permissibility of non-convex dread, which the theorem cannot adjudicate.

  ### Move-by-move  
  **(1) Miriam: Partly right but incomplete.** Her application of Good’s theorem is formally valid *if* utility depends only on acts and states, but she overlooks that genetic test refusers may have utility functions violating this assumption, making her "simply irrational" claim premature.  
  **(2) Ted: Clearly right.** He correctly identifies the theorem’s restrictive antecedent and shows how self-directed utility terms (e.g., dread) can invalidate the non-negativity of information by altering the utility landscape directly.  
  **(3) Miriam: Clearly right.** Her convexity argument is mathematically sound: a linear disutility term *B* (proportional to credence) is convex, preserving Jensen’s inequality and thus the non-negative value of information.  
  **(4) Ted: Clearly right.** Threshold dread (e.g., a step-function penalty at high credence) creates a non-convex *B*, breaking Jensen’s inequality and allowing negative expected value for information—a coherent model of rational avoidance.  
  **(5) Miriam: Clearly right.** She refocuses correctly on the unresolved normative question: whether non-convex *B* (like threshold dread) is rationally permissible, which determines if refusers violate rationality or merely fall outside the theorem’s scope.  
  **(6) Ted: Partly right but incomplete.** He is correct that the theorem is normatively toothless in cases where its antecedent fails (e.g., threshold dread), but overstates "emptiness" by ignoring that the theorem *does* bind agents with act-state utilities or convex *B*.  

  ### The technical crux  
  Miriam’s convexity point in (3) is correct: for Good’s theorem to hold with a self-directed term *B(p)* (where *p* is the credence in a bad state), *B* must be convex in *p*. Linearity (*B(p) = k·p*) satisfies convexity, so expected *B* pre- and post-information are equal, preserving non-negative value. Ted’s threshold dread in (4) genuinely defeats this: if *B(p)* jumps discontinuously at a threshold (e.g., *B(p) = 0* for *p < 0.4*, *B(p) = C* for *p ≥ 0.4*), it is non-convex. A test pushing *p* across the threshold can yield expected *B* post-test > *B* pre-test, making information harmful. The critical condition is that *B(p)* must be convex for the ex ante value of information to remain non-negative. Non-convex *B* (e.g., concave regions or discontinuities) enables rational information avoidance by introducing "utility risk."

  ### What both are missing  
  Both overlook the **ex ante/ex post welfare distinction**. While information avoidance may maximize *ex ante* expected utility (e.g., avoiding dread), it often leads to *ex post* irrationality: once avoided, the agent cannot condition acts on the information, potentially forfeiting instrumental gains (e.g., early medical intervention). This dynamic tension—between anticipatory utility and instrumental value—is central to real-world cases but absent in their exchange. Additionally, neither addresses **observer effects**: genetic test results can alter others’ behavior (e.g., stigma, insurance discrimination), making the test’s "costlessness" misleading. These social externalities, not just self-directed dread, can rationally motivate refusal within an enriched utility framework. Finally, they neglect **strategic disclosure**: refusing a test preserves optionality (e.g., avoiding legal obligations to disclose results), a rational consideration orthogonal to dread.
