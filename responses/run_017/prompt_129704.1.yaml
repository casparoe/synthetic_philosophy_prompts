  In summary, the mechanics of evidential cooperation in large worlds for gains from trade is:

  - Each agent i, for each other agent j, will choose to send a fixed amount to j if and only if the expected benefit from j sending to i exceeds the cost of sending to j, i.e., if α_{ij} * b_{j->i} > c_i.

  - The cost c_i and benefit b_{j->i} are in i's utility units.

  - The probability α_{ij} is the prior probability that j is acausally linked to i and thus will choose to send to i if i sends to j.

