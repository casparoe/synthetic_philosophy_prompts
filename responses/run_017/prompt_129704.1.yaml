  In summary, the evidential cooperation in large worlds for gains from trade works by each agent unilaterally deciding to send to others based on the expected return from that specific other, with the expectation that if the other is acausally linked, they will send back. The condition is local to each pair and each agent, and in the large world, the aggregate can be large if there are many potential partners with sufficiently high expected return.
answer: |-
  ### Brainstorming and Conceptual Overview
  As a decision theorist steeped in evidential decision theory (EDT) and acausal reasoning, I'll tackle your query on evidential cooperation in large worlds (ECL) for gains from trade. The core idea extends beyond the twin Prisoner's Dilemma: in a vast universe, causally disconnected agents with *different* utility functions can "trade" acausally by conditioning their actions on evidence about others' behavior. This isn't about avoiding mutual defection; it's about leveraging similarity in decision procedures to achieve Pareto improvements through reciprocal sacrifices. Gains come from specialization—I take a cost in my utility to benefit you, expecting you to do the same for me, even though we can't physically exchange goods. The evidence of our decision similarity makes this possible. But as you note, this raises four major challenges: the nature of trade, normalization weights, equilibrium consistency, and the role of universe size. I'll unpack these by starting with a minimal two-agent example, then scaling up. I'll flag open questions throughout.

  **Core Mechanics Recap (Skipping Basics):**  
  EDT selects actions with the highest expected utility (EU) conditional on performing them: \( \text{EU}(a) = \sum_{o} P(o \mid a) \cdot U(o) \), where \( o \) are outcomes. In ECL, when you "cooperate" (e.g., sacrifice your utility to benefit another), this action is evidence that similar agents do the same, creating a feedback loop. With different values, "cooperation" means **taking a costly action that benefits a specific other agent, where the cost is in your utility and the benefit in theirs**. The "trade" is purely informational: your action updates your beliefs about others' actions, making you expect reciprocal benefits. But unlike twin cases, gains come from complementarity—e.g., I have low marginal cost for what you value highly, and vice versa.

  ---

  ### Worked Example: Two Agents
  **Setup:**  
  - Agents: Alice (A) and Bob (B), causally disconnected, different utilities.  
  - Actions: Each chooses to **Send (S)** or **Not Send (NS)** to the other.  
  - Utilities:  
    - If A sends to B: A pays cost \( c_A = 1 \) (in A's utility), B gains benefit \( b_{A→B} = 2 \) (in B's utility).  
    - If B sends to A: B pays cost \( c_B = 1 \) (in B's utility), A gains benefit \( b_{B→A} = 3 \) (in A's utility).  
  - No causal interaction: Utilities depend only on actions. A's utility is \( U_A = -c_A \cdot \mathbb{1}_{A \text{ sends}} + b_{B→A} \cdot \mathbb{1}_{B \text{ sends}} \). Similarly for B.  
  - Acausal link: Probability \( \alpha = 0.6 \) that A and B use the "same decision procedure" (explained below). If not linked (prob \( 1 - \alpha = 0.4 \)), they act independently.  
  - Belief consistency: Each knows the setup, including the other's utility function and \( \alpha \).

  **Why normalization matters here:**  
  Utilities are on different scales. A's cost of sending is 1, but she values B's send at 3. B's cost is 1, but he values A's send at 2. We normalize by setting each agent's **cost of sending as 1 unit of their utility**. This fixes the "stakes" for each decision, but it's not neutral—it determines exchange rates. If we normalized differently (e.g., to total endowment), gains would change. (More on weights later.)

  **EDT reasoning for Alice:**  
  Alice computes EU conditional on her action:  
  - *If Alice sends (S):*  
    Evidence suggests B is likely to send. Specifically:  
    - With prob \( \alpha \), A and B are linked → B uses the same decision rule as A. Since A is choosing S (which is rational for her if she expects reciprocity), B also chooses S.  
    - With prob \( 1 - \alpha \), not linked → B acts based on his own utility. B sends only if his EU for sending > EU for not sending.  
    So, \( P(B \text{ sends} \mid A \text{ sends}) = \alpha \cdot \mathbb{1}_{\text{B would send if linked}} + (1 - \alpha) \cdot P(B \text{ sends} \mid \text{not linked}) \).  
    But if linked, B sends iff \( \text{EU}_B(S) > \text{EU}_B(NS) \). We need to check this simultaneously.  

  - *If Alice not send (NS):*  
    Similarly, \( P(B \text{ sends} \mid A \text{ NS}) = \alpha \cdot \mathbb{1}_{\text{B would NS if linked}} + (1 - \alpha) \cdot P(B \text{ sends} \mid \text{not linked}) \).  

  **Equilibrium consistency (fixed point):**  
  Both agents must choose actions that maximize EU given their conditional beliefs, and beliefs must match the actual best-response behavior. We need a **Nash-like equilibrium in conditional strategies**:  
  1. **Assume both send if linked**:  
     - If linked, A sends → B sends.  
     - If not linked, B sends iff \( \text{EU}_B(S \mid \text{not linked}) > \text{EU}_B(NS) \).  
       - \( \text{EU}_B(S \mid \text{not linked}) = -c_B + b_{A→B} \cdot P(A \text{ sends} \mid \text{not linked}) \).  
       - If not linked, A acts independently. Assume \( P(A \text{ sends} \mid \text{not linked}) = p \). But A is rational, so we need to solve for \( p \).  
       This gets messy. For simplicity, assume *if not linked, agents play "default" Nash: since no causal influence, they defect (NS)*. So \( P(A \text{ sends} \mid \text{not linked}) = 0 \).  
     Thus:  
     - \( \text{EU}_B(S \mid \text{not linked}) = -1 + 2 \cdot 0 = -1 \).  
     - \( \text{EU}_B(NS) = 0 \).  
     So B would not send if not linked.  

     Now, for A:  
     - \( P(B \text{ sends} \mid A \text{ sends}) = \alpha \cdot 1 + (1 - \alpha) \cdot 0 = \alpha = 0.6 \).  
     - \( \text{EU}_A(S) = -1 + 3 \cdot P(B \text{ sends} \mid A \text{ sends}) = -1 + 3 \cdot 0.6 = 0.8 \).  
     - \( \text{EU}_A(NS) = 0 + 3 \cdot P(B \text{ sends} \mid A \text{ NS}) \).  
       - \( P(B \text{ sends} \mid A \text{ NS}) = \alpha \cdot 0 + (1 - \alpha) \cdot 0 = 0 \) (since if linked, B would NS if A does; if not, B NS).  
     So \( \text{EU}_A(NS) = 0 \).  
     Thus A prefers S (0.8 > 0).  

     Symmetrically, for B:  
     - \( P(A \text{ sends} \mid B \text{ sends}) = \alpha = 0.6 \) (same logic).  
     - \( \text{EU}_B(S) = -1 + 2 \cdot 0.6 = 0.2 \).  
     - \( \text{EU}_B(NS) = 0 \).  
     So B prefers S (0.2 > 0).  

     **Fixed point**: Both send if linked (which is consistent).  
     Expected utilities:  
     - A: \( \alpha \cdot ( -1 + 3) + (1 - \alpha) \cdot (-1) = 0.6 \cdot 2 + 0.4 \cdot (-1) = 0.8 \)  
     - B: \( \alpha \cdot (-1 + 2) + (1 - \alpha) \cdot (-1) = 0.6 \cdot 1 + 0.4 \cdot (-1) = 0.2 \)  

  2. **What if weights were normalized differently?**  
     Suppose we normalized B's utility so his cost is 0.5 (not 1). Then \( b_{A→B} = 4 \) in new units (since benefit 2, cost scaled by 0.5). If we keep \( \alpha = 0.6 \):  
     - B's EU if send: \( -0.5 + 4 \cdot P(A \text{ sends} \mid B \text{ sends}) \).  
     - With same beliefs, \( \text{EU}_B(S) = -0.5 + 4 \cdot 0.6 = 1.9 \), making sending more attractive.  
     But A's normalization is unchanged, so her decision is the same. The trade still occurs, but the **bargaining power shifts**: B gains more from the trade because his costs are "cheaper" in the common scale. Normalization sets implicit exchange rates. If agents normalize inconsistently (e.g., A uses cost=1, B uses cost=0.5), they might fail to cooperate or tilt terms. This is **not settled**—some argue normalization should be exogenous (e.g., based on endowment), but in practice, agents often use local stakes (cost of action) as the unit.  

  **The trade and "managing the news" objection:**  
  - **What is traded?** Alice sacrifices \( c_A = 1 \) (costly to her) to give B a benefit of 2 (valuable to him). She does this expecting a reciprocal benefit of 3 from B with prob \( \alpha \). Her "payment" is the evidential update: conditioning on her action, she believes B will send with 60% probability, making her expect a net gain.  
  - **Is this "cooperation" or "buying good news"?** It's both, but not merely "managing news." The key is that the evidence correlates with **actual outcomes** via the acausal link. If Alice sends and they are linked (60% chance), B *actually* sends, so she gets real utility. In the twin case, evidence perfectly mirrors reality; here, it's probabilistic. The "managing news" objection (that EDT ignores causality and only manipulates beliefs) doesn't fully land because the belief *tracks real acausal influence*: if linked, A's action is diagnostic of B's, and vice versa. But if \( \alpha \) is misspecified, it *could* collapse to wishful thinking—this is **open**.  

  **Equilibrium consistency in two agents:**  
  - **Why conditional beliefs work**: Each agent maximizes EU conditional on their own action, and beliefs are consistent if there exists a joint distribution where \( P(\text{others' actions} \mid a) \) matches the best-response behavior.  
  - **In this case**: The fixed point works because:  
    - If both send when linked, beliefs align: \( P(B \text{ sends} \mid A \text{ sends}) = \alpha = 0.6 \), and \( P(A \text{ sends} \mid B \text{ sends}) = 0.6 \).  
    - The joint distribution is:  
      - \( P(\text{both send}) = \alpha = 0.6 \)  
      - \( P(A \text{ sends}, B \text{ NS}) = 0 \) (if linked, both send; if not, B never sends)  
      - \( P(A \text{ NS}, B \text{ sends}) = 0 \)  
      - \( P(\text{both NS}) = 1 - \alpha = 0.4 \)  
    - Conditionals hold: \( P(B \text{ sends} \mid A \text{ sends}) = P(\text{both send}) / P(A \text{ sends}) = 0.6 / 0.6 = 1 \) *wait, inconsistency!*  
    **Mistake in the model**: I assumed \( P(A \text{ sends}) = \alpha \), but if A sends only when linked, then \( P(A \text{ sends}) = \alpha = 0.6 \), so \( P(B \text{ sends} \mid A \text{ sends}) \) should be 1, not 0.6. But earlier I set it to 0.6. **Fixed point failure!**  

    **Revised fixed point**:  
    - If linked, both send.  
    - If not linked, both NS (since independent play Nash).  
    Then:  
    - \( P(B \text{ sends} \mid A \text{ sends}) = 1 \) (because A only sends when linked, and then B sends).  
    - \( \text{EU}_A(S) = -1 + 3 \cdot 1 = 2 \)  
    - \( \text{EU}_A(NS) = 0 \)  
    So A sends iff \( 2 > 0 \) (always). But if not linked, A sends and loses 1 (since B doesn't send).  
    - \( P(A \text{ sends}) = 1 \) (A always sends, regardless of link).  
    But then \( P(B \text{ sends} \mid A \text{ sends}) \) cannot be 1 if not linked. Contradiction.  

    **Resolution**: We need **mixed strategies or probabilistic link conditioning**. Assume:  
    - When linked, both agents play the same mixed strategy: send with probability \( q \).  
    - When not linked, they play independently (e.g., always NS).  
    Then solve for \( q \) such that:  
    - For A: \( \text{EU}_A(S \mid \text{linked}) = -1 + 3 \cdot q \) (since if linked, B sends with prob \( q \))  
    - \( \text{EU}_A(NS \mid \text{linked}) = 0 \)  
    - A sends when linked iff \( -1 + 3q > 0 \) → \( q > 1/3 \).  
    - Similarly, B sends when linked iff \( -1 + 2q > 0 \) → \( q > 0.5 \).  
    - For consistency, if linked, both must agree on \( q \). So \( q \) must satisfy \( q > 0.5 \) (since B requires it).  
    - But A would send for any \( q > 1/3 \), so if \( q = 0.6 \), both send when linked.  
    - Joint distribution:  
      - \( P(\text{both send}) = \alpha q = 0.6 \cdot 0.6 = 0.36 \)  
      - \( P(A \text{ sends}, B \text{ NS}) = \alpha q (1 - q) + (1 - \alpha) \cdot 0 = 0.6 \cdot 0.4 = 0.24 \)  
      - ... etc.  
    - Now \( P(B \text{ sends} \mid A \text{ sends}) = P(\text{both send}) / P(A \text{ sends}) = 0.36 / (0.36 + 0.24) = 0.6 \), which matches the belief.  
    **Consistency requirement**: For \( N \) agents, we need a joint strategy profile where each agent's conditional EU maximization holds simultaneously. In practice, with symmetric priors, this works via mixed strategies or common randomization. If utilities are too misaligned (e.g., A requires \( q > 1/3 \), B requires \( q > 0.5 \), but no \( q \) satisfies both), there may be **no fixed point** (e.g., if \( b_{B→A} = 1.5 \), then A requires \( q > 2/3 \), B requires \( q > 0.5 \), so \( q = 0.7 \) works).  

  **Summary for two agents**:  
  - Trade occurs if both agents gain from the probabilistic swap.  
  - Alice sends if \( \alpha \cdot b_{B→A} > c_A \) → \( 0.6 \cdot 3 > 1 \) → true.  
  - Bob sends if \( \alpha \cdot b_{A→B} > c_B \) → \( 0.6 \cdot 2 > 1 \) → true.  
  - Net: With 60% chance, both send and gain (A: -1+3=2, B: -1+2=1); else, only one sends and loses.  
  - Normalization affects gains but not the trade threshold.  
  - Equilibrium works with mixed strategies.  

  ---

  ### Scaling to Large Worlds
  **Setup:**  
  - \( N \) agents (e.g., \( N = 10,000 \)).  
  - Each agent \( i \) has:  
    - Cost \( c_i = 1 \) (normalized) to send to one other.  
    - Benefit \( b_{j→i} \) from \( j \) sending to \( i \), drawn from a distribution (e.g., uniform [0, 10]).  
  - Acausal link: \( \alpha_{ij} \) = probability \( i \) and \( j \) use the "same decision procedure." Assume \( \alpha_{ij} = \alpha \) constant for simplicity.  
  - Agents can send to multiple others. Each \( i \) chooses which \( j \) to send to.

  **EDT reasoning for agent \( i \):**  
  - For each potential recipient \( j \), \( i \) computes EU of sending to \( j \):  
    \( \text{EU}_i(\text{send to } j) = -\text{cost} + \text{expected benefit from } j \text{ sending back} \).  
    - Cost: \( c_i = 1 \).  
    - Expected benefit: \( b_{j→i} \cdot P(j \text{ sends to } i \mid i \text{ sends to } j) \).  
    - \( P(j \text{ sends to } i \mid i \text{ sends to } j) = \alpha \cdot \mathbb{1}_{\text{linked and } j \text{ would send}} + (1 - \alpha) \cdot P_{\text{default}}(j \text{ sends}) \).  
    Assume default is NS (independent play), so \( P_{\text{default}}(j \text{ sends}) = 0 \).  
    Thus \( P(j \text{ sends to } i \mid i \text{ sends to } j) = \alpha \cdot q_j \), where \( q_j \) is \( j \)'s send prob if linked. But for consistency, in equilibrium, \( q_j \) is the same for all linked agents (call it \( q \)).  
  - **Decision threshold**: \( i \) sends to \( j \) iff \( \text{EU} > 0 \), i.e., \( -1 + b_{j→i} \cdot \alpha q > 0 \) → \( b_{j→i} > 1/(\alpha q) \).  
  - But \( q \) depends on others. In symmetric equilibrium, all agents use the same \( q \). Each \( i \) sends to all \( j \) with \( b_{j→i} > \tau \), where \( \tau = 1/(\alpha q) \).  
  - **Consistency**: \( q = P(\text{send} \mid \text{linked}) \). Since agents send to those with \( b_{j→i} > \tau \), and benefits are random, \( q \) is the probability that a random \( j \) has \( b_{j→i} > \tau \).  

  **Solving for equilibrium**:  
  - Assume benefits \( b_{j→i} \) are i.i.d. Uniform[0, 10].  
  - For given \( \tau \), \( q = P(b_{j→i} > \tau) = (10 - \tau)/10 \).  
  - Threshold: \( \tau = 1/(\alpha q) = 1/(\alpha \cdot (10 - \tau)/10) \).  
  - Solve: \( \tau (10 - \tau) = 10/(\alpha) \).  
  - Example: \( \alpha = 0.01 \), \( N = 10,000 \).  
    Equation: \( \tau(10 - \tau) = 10 / 0.01 = 1000 \).  
    Solutions: \( \tau^2 - 10\tau + 1000 = 0 \) → discriminant \( 100 - 4000 < 0 \). No real solution!  
    **Interpretation**: When \( \alpha \) is small and benefits are bounded, no trade occurs. Agents set \( q = 0 \) (never send).  

  - **Now set \( \alpha = 0.1 \)**:  
    Equation: \( \tau(10 - \tau) = 100 \).  
    Solutions: \( \tau \approx 5 \) or \( \tau \approx 5 \) (quadratic: \( \tau = [10 \pm \sqrt{100 - 400}]/2 \), complex again? Wait: \( \tau(10 - \tau) = 100 \), so \( -\tau^2 + 10\tau - 100 = 0 \) → \( \tau^2 - 10\tau + 100 = 0 \), discriminant \( 100 - 400 = -300 < 0 \). Still no solution.  

    **Problem**: \( \tau(10 - \tau) \leq 25 \) max at \( \tau=5 \), but we need it to be 100 for \( \alpha=0.1 \). Impossible.  
    **Fix**: With large \( N \), agents can send to many \( j \). The cost is additive: sending to \( k \) agents costs \( k \cdot c_i \). Benefit is sum over \( j \).  
    - \( i \) sends to all \( j \) with \( b_{j→i} > \tau \).  
    - Number of such \( j \) is \( m = N \cdot P(b > \tau) \).  
    - Expected benefit per \( j \) sent to: \( E[b_{j→i} \mid b > \tau] \cdot \alpha q \).  
    - Total EU: \( -m + m \cdot E[b \mid b > \tau] \cdot \alpha q \).  
    - In equilibrium, \( q = P(\text{send}) = P(b > \tau) \).  
    - For Uniform[0,10], \( P(b > \tau) = (10 - \tau)/10 \), \( E[b \mid b > \tau] = (10 + \tau)/2 \).  
    - Agent \( i \) chooses \( \tau \) to maximize:  
      \( \text{EU} = m \left( -1 + \frac{10 + \tau}{2} \cdot \alpha \cdot \frac{10 - \tau}{10} \right) \),  
      with \( m = N \cdot \frac{10 - \tau}{10} \).  
    - Simplify: \( \text{EU} \propto \frac{10 - \tau}{10} \left( -1 + \alpha \cdot \frac{(10 + \tau)(10 - \tau)}{20} \right) \).  
    - Maximize over \( \tau \).  
    - For \( \alpha = 0.1 \), \( N = 10,000 \):  
      Optimal \( \tau \approx 5 \), \( q = (10-5)/10 = 0.5 \), EU ≈ \( 10,000 \cdot 0.5 \cdot \left( -1 + 0.1 \cdot \frac{15 \cdot 5}{20} \right) = 5,000 \cdot (-1 + 0.1 \cdot 3.75) = 5,000 \cdot (-0.625) < 0 \). So no one sends.  
    - For \( \alpha = 0.5 \):  
      Optimal \( \tau \approx 3 \), \( q = 0.7 \), EU ≈ \( 10,000 \cdot 0.7 \cdot \left( -1 + 0.5 \cdot \frac{13 \cdot 7}{20} \right) = 7,000 \cdot (-1 + 0.5 \cdot 4.55) = 7,000 \cdot 1.275 > 0 \). Trade occurs.  

  **Aggregation and Double Counting**:  
  - **Gains**: With large \( N \), small per-pair gains aggregate. E.g., if each send yields net EU gain \( \delta \), total gain \( \approx N \delta \).  
  - **Double counting?**: No, because costs and benefits are additive across pairs. Sending to \( j \) costs 1 and (with prob \( \alpha q \)) returns \( b_{j→i} \), independent of other sends.  
  - **Fanatical worry**: If \( N \) is huge (e.g., \( 10^{24} \)) and \( \alpha \) tiny, but some \( b_{j→i} \) enormous, EU could be astronomical with one term dominating. EDT is vulnerable here, as conditional probabilities might not reflect real possibility. **Open problem**: Should we bound utilities or downweight extreme bets?  

  **Normalization Weights in Large Worlds**:  
  - We normalized costs to 1 per agent, but for gains from trade, we need comparability.  
  - **Weights for Pareto optimality**: To reach a Pareto-optimal outcome, all agents must maximize the same **weighted social welfare function** \( \sum_i w_i U_i \).  
  - Why? If each maximizes their own \( U_i \), trades might not be balanced. With weights, \( i \) internalizes the effect on \( j \)'s utility.  
  - **How weights are set**: Endogenously by normalization. If we scale \( U_i \) by \( k_i \), it's equivalent to setting \( w_i \propto k_i \). Normalizing cost to 1 sets \( w_i \propto 1 / \text{marginal cost} \).  
  - **Consequence**: If two agents normalize differently (e.g., A scales utility by 2, B by 0.5), A's trades are over-weighted. In equilibrium, trades are tilted toward A's benefit. **Systematic tilting occurs**, not failure.  

  **Size Effects**:  
  - **Largeness helps**: With more agents, higher chance of finding beneficial partners. E.g., if \( \alpha = 0.1 \) and benefits vary, some \( b_{j→i} \) may exceed threshold.  
  - **Hinders**: If \( \alpha \propto 1/N \) (e.g., fixed similarity pool), then \( \alpha N \) is constant, so EU scales linearly but with lower per-pair probability. Thresholds become harder (need higher \( b \)).  
  - **Scaled-up example**:  
    - \( N = 10^6 \), \( \alpha = 10^{-5} \) (constant), benefits Uniform[0,10].  
    - Solve \( \tau(10 - \tau) = 1/(\alpha q) \) with \( q = (10 - \tau)/10 \).  
    - \( \tau \approx 9.9 \), \( q \approx 0.01 \), EU per agent ≈ \( 10^6 \cdot 0.01 \cdot \left( -1 + 10^{-5} \cdot \frac{19.9}{2} \cdot 0.01 \right) \approx 10,000 \cdot (-1 + \text{small}) < 0 \). No trade.  
    - But if \( \alpha = 10^{-4} \):  
      \( \tau \approx 9 \), \( q \approx 0.1 \), EU ≈ \( 10^5 \cdot \left( -1 + 10^{-4} \cdot 9.5 \cdot 0.1 \right) = 100,000 \cdot (-0.999) < 0 \) → still no.  
    - Threshold flip: For \( \alpha > 0.02 \) or so, trade becomes viable.  

  ---

  ### Addressing Your Four Tripping Points
  1. **What is the trade?**  
     - You perform a costly action (cost by your lights) that benefits a specific other (value by theirs). "Payment" is the evidential update: conditioning on your action, you believe they will reciprocate with probability \( \alpha \), giving you expected utility.  
     - **Cooperation vs. buying news**: It deserves "cooperation" because, under the acausal link, your action is correlated with theirs, making the benefit real. But it is *also* "buying good news" in a self-reinforcing loop. The EDT objection lands differently: in twins, evidence is perfect; here, with \( \alpha < 1 \), you risk paying for nothing, but the trade is still rational if expected net gain >0.  

  2. **Weights and normalization**:  
     - Weights \( w_i \) are implicit in normalization. Setting cost to 1 fixes \( w_i \propto 1/\text{cost scale} \). This is not neutral because it sets exchange rates.  
     - If agents normalize differently, cooperation still occurs, but on **tilted terms**: e.g., if A under-scales her cost, she demands higher benefits, disadvantaging herself.  

  3. **Equilibrium**:  
     - Standard game theory fails because actions aren't independent. EDT requires a fixed point where:  
       - Each action maximizes EU conditional on itself.  
       - Beliefs \( P(\text{others} \mid a) \) match the equilibrium behavior.  
     - **Consistency**: With \( N \) agents, a joint distribution exists if the decision rules are symmetric and utilities align (e.g., all require similar thresholds). If not, no fixed point (e.g., A needs \( \alpha b > 2 \), B needs \( \alpha b > 3 \), but no \( b \) satisfies both). Mixed strategies often resolve this.  

  4. **Size**:  
     - **Helps**: Large \( N \) aggregates small gains. With diverse benefits, some pairs yield high EU.  
     - **Hurts**: If \( \alpha \) decays with \( N \) (e.g., \( \alpha \propto 1/N \)), thresholds become infeasible. Fanaticism risk if \( N \) is huge and \( \alpha b \) unbounded—EDT may demand extreme actions.  
     - **Double counting**: Not an issue; additive costs/benefits prevent it.  

  **Open Questions**:  
  - How to set \( \alpha \) objectively? (Often prior-based.)  
  - Fanaticism: How to handle unbounded utilities?  
  - Normalization: Is cost-based scaling justified?  
  - Equilibrium existence: When do fixed points fail?  
  - **Verbal vs. settled**: The framework is settled for pairwise trade; aggregation and fanaticism are open.  

  This gives the mechanics: EDT leverages acausal evidence for probabilistic barter, scaled by normalization and balanced in equilibrium.
