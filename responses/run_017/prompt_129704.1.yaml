  In practice, for the acausal trade to happen, the weights are set by the normalization that sets the cost of sending one unit to 1 for each agent.

  For agent i, we normalize their utility so that c_i = 1. Then, the benefit that i provides to j by sending one unit is b_{i->j} in j's normalized utility.

  But to compare, we need to know how much one unit of j's normalized utility is worth in i's normalized utility. That is the exchange rate.

  The exchange rate between i and j is determined by the weights in the social welfare function that they are implicitly maximizing.

  In the implementation, each agent i will send to j an amount that is proportional to the benefit that j can provide to i, times the probability that j is acausally linked to i.

  Let me try to formalize.

  Suppose that agent i chooses x_{i->j} for each j.

