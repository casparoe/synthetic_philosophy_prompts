  So she sends if α*A >1.

  And this is true regardless of what Bob does.

  Similarly for Bob.

  There is no inconsistency because the expected utility is defined by the conditional expectation, which is the same regardless of the actual behavior.

  In the large world, this scales easily.

  Example with many agents:

  - Let there be N agents.
  - For each agent i, let c_i = 1 (normalized).
  - Let the benefit b_{j->i} for any j to i be drawn from a distribution. For simplicity, assume b_{j->i} = B for all i,j, and B is fixed.
  - Let α_{ij} = α for all i,j.

  Then agent i will send to agent j if α * B > 1.

  If α*B >1, then i sends to all other N-1 agents.

  Cost: (N-1) * 1

  Expected benefit: for each j, expected benefit from j is α * B, and there are N-1 such j, so expected benefit: (N-1) * α * B

  Net expected utility: (N-1) * (α*B - 1)

  If α*B >1, this is positive and grows with N.

