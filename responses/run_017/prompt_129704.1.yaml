  The threshold is whether α*B>1.

  In a large universe, even if α is small, if B is large enough, or vice versa, they cooperate.

  But if α is very small (e.g., because there are many dissimilar agents), then it might not be worth it.

  If we assume that the probability of being linked is inversely proportional to the number of agents (because there are many types), then α might be about 1/N. Then the condition is (1/N)*B >1, i.e., B>N.

