  Right, let's structure this. The pro-qualia side (Jackson, Chalmers) absolutely needs silent inversion to be conceivable to defend non-functional qualia. Their argument: if spectrum inversion without functional change is possible, then qualia must be extra-functional. The anti-qualia side (Dennett, maybe Ryleans) attacks this by arguing silent inversion is either incoherent (because experience is defined by function) or irrelevant (because it's undetectable). 

