  The concession strategy needs care: they can give ground on empirical calibration and moral weight scaling, but must hold the line on counterfactual distinctness being necessary and implementation-independence. 

  For the nightmare question... ah, the "indeterminate boundaries" problem seems most threatening. If distinctness isn't binary, the whole counting mechanism collapses - and it plays right into the functionalists' verbal dispute stance. 

  I'll structure each objection with the exact phrasing the questioner would use, then craft replies that:
  - Acknowledge their frame
