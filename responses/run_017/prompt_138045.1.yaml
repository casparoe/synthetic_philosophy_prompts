  Now the audience breakdown is fascinating: mostly non-reductive functionalists (10) who think computational moral questions are verbal disputes, one skeptical computational neuroscientist working on insect pain, and two AI ethics researchers worried about over/under-assigning moral status. No animal ethicists or consequentialists - which explains why the insect example is framed computationally rather than ethically.

  Hmm... the user wants objections phrased in the questioner's vocabulary, not theirs. That's smart - it forces anticipating how others conceptualize the issues. Also notable they want damage assessment and soft spots in replies, plus strategic concessions. The "question they hope nobody asks" is particularly telling - they're worried about a specific vulnerability.

  For the objections, I should prioritize:
