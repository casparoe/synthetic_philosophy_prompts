answer: |-
  ## Proposal: Reconstructive Stability as the Engine of Cumulative Cultural Evolution

  **Project Summary:** This project challenges the central premise of the debate over whether culture constitutes a Darwinian system: the necessity of high-fidelity transmission. I argue that both critics and defenders of cultural evolution focus myopically on *single-step fidelity* – the accuracy of copying an observed cultural variant in one transmission event. Instead, I propose that *reconstructive stability* – the ability of a population to converge on a stable variant despite noisy input, driven by shared cognitive priors – is the critical factor enabling cumulative adaptive evolution, even in the absence of high-fidelity copying. This conceptual project will develop a formal framework distinguishing these quantities, demonstrate their potential independence, and argue that reconstructive stability fulfills the minimal requirements for heredity in a Darwinian process. The output will be a theoretical model and framework published as a key dissertation chapter.

  **Research Question:** Under what conditions can cumulative adaptive cultural evolution occur *without* high single-step transmission fidelity, and what mechanism provides the necessary heredity-like stability for selection to act upon variation?

  **Background and Gap:** The debate hinges on whether cultural inheritance requires a "replicator" akin to genes. Critics (e.g., Sperber, Boyd & Richerson critics) argue cultural transmission lacks high-fidelity copying, discrete units, and a germ line, rendering "memetics" merely metaphorical and disqualifying culture as Darwinian. Defenders (e.g., Mesoudi, Henrich) counter that institutions, pedagogy, and repetition *manufacture* fidelity, enabling cumulative adaptation. Crucially, **both sides measure fidelity at a single transmission step (Input A -> Output B accuracy).** This overlooks the fundamentally *reconstructive* nature of cultural learning: learners rarely copy perfectly; they infer meaning from often degraded observations (A') using internal priors, generating output (B). Existing "cultural attractors" theory (Sperber, Claidière) recognizes reconstruction but **fails to rigorously separate the *quantity* of single-step fidelity from the *system-level property* of reconstructive stability.** The key gap is a formal framework analyzing whether stability can exist independently of fidelity and whether this stability alone can sustain Darwinian dynamics.

  **Core Hypothesis:** Cumulative cultural adaptation tracks *reconstructive stability* rather than single-step fidelity. A cultural system can function as a minimal Darwinian population (exhibiting variation, differential spread, and inheritance-of-variants) even with low single-step fidelity, provided the reconstruction process possesses strong *attractors* – states toward which reconstructions consistently converge over iterations due to shared priors. Conversely, a system with high single-step fidelity but weak attractors may exhibit rapid, non-adaptive drift, hindering cumulative change.

  **Intellectual Merit & Novelty:** This project offers a fundamental reconceptualization of cultural inheritance:
  1.  **Decoupling Fidelity & Stability:** It precisely defines and distinguishes single-step transmission fidelity from system-level reconstructive stability.
  2.  **Redefining Heredity for Culture:** It proposes reconstructive stability, driven by shared priors acting as attractors, as the core mechanism providing the "heredity" necessary for Darwinian evolution in noisy cultural systems.
  3.  **Resolving the Replicator Stalemate:** It bypasses the "is there a replicator?" debate by demonstrating that cumulative adaptation requires *stability*, which can be achieved without high-fidelity replicators, fulfilling minimal Darwinian criteria.
  4.  **Formalizing Reconstruction:** It moves beyond descriptive cultural attractor theory by providing a formal, model-based framework for analyzing the dynamics of reconstructive systems.

  **Methodology & Work Plan (6 Months - Conceptual Focus):** This is a theoretical project synthesizing philosophy of biology, cultural evolution theory, cognitive science, and mathematical modeling.

  *   **Month 1: Literature Synthesis & Framework Refinement:** Deep dive into debates on cultural replicators, transmission fidelity, cumulative culture, and cultural attractors. Precisely formalize definitions: single-step fidelity (F), reconstructive stability (S), attractor strength. Map existing positions onto the F/S distinction.
  *   **Month 2: Developing the Core Argument:** Articulate the logical case for reconstructive stability as the key enabler of cumulative adaptation. Detail how shared priors create attractors. Argue why stability, not fidelity, meets minimal criteria for inheritance in a Darwinian process (variation, heritability, differential fitness). Contrast with replicator-based and standard attractor views.
  *   **Month 3: Constructing the Toy Model (Phase 1):** Design a simple formal model (e.g., agent-based simulation or Markov process) where agents reconstruct a "variant" from noisy input using biased priors. Parameters will explicitly control single-step fidelity (noise level) and attractor strength (bias strength/consistency).
  *   **Month 4: Analyzing the Toy Model (Phase 2):** Run model simulations systematically varying F (low/med/high) and S (weak/strong). Key metrics: (a) Stability of variant form over transmission chains; (b) Ability to accumulate adaptive modifications (e.g., optimize a simple function) despite noise; (c) Rate of drift. *Crucially, demonstrate scenarios where LOW F + HIGH S enables cumulative adaptation, while HIGH F + LOW S leads to drift.*
  *   **Month 5: Model Refinement & Integration:** Refine model based on analysis. Ensure it robustly demonstrates the decoupling of F and S and their differential impact on cumulative outcomes. Integrate model results into the conceptual framework. Develop clear visualizations of model dynamics.
  *   **Month 6: Synthesis, Writing & Dissemination Plan:** Synthesize literature review, conceptual argument, and model results into a cohesive chapter draft. Outline implications for debates on memetics, cultural evolution, and the definition of Darwinian populations. Plan submission to relevant journals (e.g., *Philosophy of Science, Behavioral and Brain Sciences, Evolution and Human Behavior*).

  **Why this approach?**
  *   **Not Just Defining Darwinian:** Simply applying standard replicator criteria (e.g., Godfrey-Smith) to rule culture in/out ignores the unique, reconstructive nature of cultural transmission and fails to resolve the core debate about *how* heredity works.
  *   **Not Experimental (Yet):** Transmission chain experiments are valuable but resource-intensive and often focus on single-step measures. A robust *conceptual* and *formal* foundation distinguishing F and S is essential *before* designing valid experiments. It clarifies *what* needs measuring. This project provides that essential groundwork within the fellowship timeframe.

  **Expected Outcomes:**
  1.  A novel conceptual framework defining single-step fidelity (F) and reconstructive stability (S) as distinct, measurable properties of cultural transmission systems.
  2.  A formal argument that reconstructive stability (S), enabled by shared priors acting as attractors, provides sufficient "heredity" for minimal Darwinian dynamics and cumulative adaptation, even without high F.
  3.  A tractable toy model demonstrating the decoupling of F and S and their differential impact on cumulative cultural evolution.
  4.  A significant dissertation chapter ready for publication, shifting the debate on cultural evolution and replicators.

  **Failure Conditions & Risks:**
  1.  **Collapsing into Existing Fights:** The framework *must* rigorously maintain the distinction between F and S. Failure occurs if S is simply re-labeled as "fidelity" or "attractors" without demonstrating its independence and primacy for cumulative outcomes. Mitigation: Constant focus on the *decoupling* in model design and argumentation.
  2.  **Model Triviality/Non-Applicability:** The toy model could be dismissed as too simplistic or irrelevant to real culture. Mitigation: Ground the model parameters (types of noise, priors) in plausible cognitive mechanisms (e.g., categorization biases, schema-driven recall). Focus on proof-of-concept: showing decoupling *is possible*.
  3.  **"Needs Data" Critique:** Reviewers may argue the hypothesis is untestable without empirical data. Mitigation: Emphasize this is foundational *conceptual* work defining key variables and dynamics *for* future empirical testing. The model provides testable predictions.
  4.  **Attractor Ambiguity:** Defining and quantifying "attractor strength" operationally within the model is challenging. Mitigation: Use clear, measurable proxies in the model (e.g., convergence rate, basin of attraction size).
  5.  **Scope:** 6 months is tight but feasible for a focused conceptual/modeling project. The key is strict adherence to the core question and resisting the urge to model overly complex cultural phenomena initially. The toy model must stay simple.

  **Conclusion:** This project offers a paradigm shift by disentangling transmission fidelity from system-level stability in cultural evolution. By demonstrating that cumulative adaptation can thrive on reconstructive stability powered by shared priors, even amidst noisy copying, it resolves the replicator stalemate and provides a more accurate foundation for understanding cultural change as a Darwinian process. The deliverables—a robust conceptual framework and a proof-of-concept model—are achievable within six months and constitute a significant, publishable advance for my dissertation.
