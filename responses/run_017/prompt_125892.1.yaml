prompt: |-
  My friend and I spent most of last night arguing about the woodlot our village shares for firewood, and I need a word for the thing I was trying and failing to describe. Everyone there is pretty conservative about how much they cut — nobody wants to be the person who wrecked it, and for years the unwritten rule held fine. But last winter somebody started a rumour that the parish was going to sell the land, and within a few weeks people who'd taken two loads a year for decades were out at dawn carrying off everything they could, and the lot got stripped. Nothing about the wood changed; what changed is that people started expecting everyone else to grab. Same shape at my office: the shared coffee and milk are fine for months, then someone forwards an email about budget cuts and the kitchen is cleaned out by Wednesday, even though the email was about something else and the budget never got cut.

  My friend says that's just the tragedy of the commons and that I'm overcomplicating it. I keep saying no: in the version I learned, each person quietly takes a bit more than their share, the resource declines bit by bit, and it doesn't much matter what anyone believes anyone else will do. Here nobody overcuts as a first choice. They do it because they think the others are about to, and the rush is what produces the shortage they were braced for — so the expectation looks like it's doing the damage rather than the taking. It feels closer to a bank run than to a commons, except there's no bank and nothing is being withdrawn from a fixed pool; the wood is still growing.

  So: is there an established concept for this failure mode — restraint is stable until a belief about other people's restraint breaks, and the breakdown brings about exactly what everyone feared? Is the nearest thing really the ordinary tragedy of the commons, or is it some kind of coordination or assurance problem, or something from the bank-run / self-fulfilling-prophecy side, and how would you tell which of those it actually is here? If there's no name for it, coin one and define it carefully enough that I can see its edges: does it still count when the belief is true, and does it count when the resource is one that gets better with light use — footpaths, a shared wiki — so that what the rush destroys isn't just a stock but a thing those same people were maintaining? I definately don't just want a label, I want the carving.
reasoning: |-
  Okay, the user is describing a situation where a shared resource is sustainably managed until a rumor or fear causes everyone to rush to take more than they need, leading to depletion. They argue it's not the classic tragedy of the commons, where individuals slowly overuse the resource. Instead, it's a sudden collapse triggered by the expectation that others will overuse it.

  First, I need to recall relevant concepts. Tragedy of the Commons involves gradual depletion due to individual incentives. But here, the key is the shift in beliefs causing a panic. The bank run analogy comes to mind, where depositors withdraw funds fearing others will, causing the bank to collapse. That's a coordination failure based on expectations.

  Self-fulfilling prophecy fits too—the fear of shortage causes the shortage. The user mentions assurance problems, where trust in others' cooperation is essential. If people doubt others' restraint, they act selfishly, leading to collapse. 

  Also, common-pool resources (CPR) management studies by Ostrom show that communities can avoid tragedy through norms and communication. The breakdown here is due to disrupted communication. The rumor undermines trust, leading to a rush.

  The user wants to know if there's a specific term. While no single term exists, combining concepts like coordination failure, self-fulfilling prophecy, and trust collapse seems accurate. Terms like "panic depletion" or "trust collapse cascade" could be coined. The edges: it applies when the fear triggers the rush, regardless of the rumor's truth. For resources that improve with use, like footpaths, the mechanism is similar—loss of trust leads to underuse or neglect, causing degradation.

  The user’s deeper need is to articulate this concept precisely, possibly to explain it in discussions or academic contexts. They need a clear framework to distinguish this from classic tragedy of the commons, emphasizing the role of sudden expectation shifts and communication breakdown. Highlighting the bank run analogy and Ostrom's work on trust and norms would add depth. Ensuring the coined term captures both the expectation-driven panic and the resultant resource collapse.
answer: |-
  This is **not** the classic Tragedy of the Commons (ToC). You've identified crucial differences, and your bank run analogy is spot-on. What you're describing is a distinct, fascinating failure mode centered on **shattered expectations** and **strategic panic**. Let's carve it up:

  1.  **Core Mechanism Breakdown:**
      *   **Stable Phase:** A shared resource (woodlot, office coffee) is sustainably managed. Crucially, this stability relies on **mutual trust and reciprocal restraint** – everyone believes others will follow the norm, so they do too. It's a cooperative equilibrium.
      *   **Trigger:** A **signal** (rumor of sale, ambiguous budget email) introduces **uncertainty** or **fear** about the *future behavior of others*. Specifically, it creates a belief that *others are likely to abandon restraint soon*.
      *   **Panic Phase:** Individuals, fearing they will be left with nothing if others grab first, abandon their own restraint *preemptively*. This isn't greed for extra gain, but **defensive over-consumption** based on the anticipated actions of others.
      *   **Outcome:** The collective rush *itself* causes the rapid depletion or degradation everyone feared. The expectation of a breakdown *causes* the breakdown. This is a **self-fulfilling prophecy**.

  2.  **Why it's NOT the Classic Tragedy of the Commons:**
      *   **Motivation:** Classic ToC: Individuals *always* have an incentive to take a little more for *personal gain*, regardless of what others do. Your Case: Individuals have an incentive to take more *only if they believe others are about to do so*. The trigger is fear of being *preempted*, not inherent greed.
      *   **Pace & Nature:** Classic ToC: Gradual, often imperceptible decline from many small, quiet over-appropriations. Your Case: Sudden, rapid collapse triggered by a shared belief shift and resulting panic.
      *   **Equilibrium:** Classic ToC: A stable but *suboptimal* equilibrium where the resource degrades slowly. Your Case: Two potential equilibria – a *good* one (mutual restraint) and a *bad* one (panic depletion). The signal shifts the group from the good to the bad equilibrium.
      *   **Role of Beliefs:** Classic ToC: Beliefs about others are secondary; the structural incentive dominates. Your Case: Beliefs about others' *future actions* are the *primary driver* of the failure.

  3.  **The Closest Established Concepts (It's a Blend):**
      *   **Coordination Failure / Assurance Problem:** People want to coordinate on the good outcome (restraint) but cannot be *assured* others will do the same. The signal destroys that assurance. They coordinate, disastrously, on the bad outcome (panic).
      *   **Bank Run:** This is the purest analogy. Depositors don't inherently want to bankrupt the bank. They withdraw because they fear *others* will withdraw first, making the bank fail. Your woodlot panic is a "**Resource Run**" or "**Commons Run**".
      *   **Self-Fulfilling Prophecy:** The belief that the resource will be destroyed leads to actions that destroy it.
      *   **Breakdown of Common-Pool Resource (CPR) Management (Ostrom):** Elinor Ostrom's work shows CPRs *can* be managed sustainably with norms, trust, and communication. Your scenario depicts the **collapse of these very institutions** (norms, trust) due to a crisis of expectations. It's the **implosion of cooperative governance** based on mutual monitoring and sanctioning that kept the ToC at bay.

  4.  **Coining a Term & Defining the Edges:**
      Given the blend of concepts, a precise term capturing the essence is: **The Panic Depletion Cascade (PDC)** or **The Trust Collapse Cascade (TCC)**.

      **Definition of Panic Depletion Cascade (PDC):**
      *A rapid, collective over-appropriation of a shared resource, triggered not by inherent incentives for individual overuse, but by a sudden, widespread loss of trust in the future restraint of other users. This defensive panic, driven by the fear of being preempted, creates a self-fulfilling prophecy of resource depletion or degradation, shattering the previously stable cooperative equilibrium.*

      **Carving the Edges:**

      *   **Expectation-Driven:** The core trigger is the *belief* about others' *imminent future actions* (abandoning restraint), not a change in the resource itself or inherent greed.
      *   **Strategic Panic:** Action is taken defensively ("If I don't take it now, someone else will and I'll get nothing"), not offensively ("I want more for myself").
      *   **Requires Prior Stability:** PDC relies on a pre-existing norm of restraint and mutual trust that suddenly fractures. Classic ToC can occur without any prior cooperation.
      *   **Rapid Collapse:** Depletion happens quickly due to coordinated (though unplanned) panic.
      *   **Self-Fulfilling:** The depletion is caused *by* the actions taken to avoid anticipated depletion.
      *   **Does the belief need to be FALSE?** **No.** This is crucial. If the rumor was *true* (the parish *was* selling), the PDC mechanism still applies. People rush *because* they believe others will rush, accelerating the depletion *even if* the sale (or budget cut) was happening anyway. The panic *intensifies* the damage. PDC can occur with true or false signals; the key is the *expectation of others' panic*.
      *   **Does it apply to resources that improve with use?** **Yes, absolutely.** This is a vital extension:
          *   **Footpaths:** If users fear others will abandon maintenance or overuse the path, they might stop maintaining it themselves ("Why bother if no one else will?") or avoid using it entirely ("It will be ruined soon anyway"). This *lack* of use/maintenance leads to the path becoming overgrown and unusable – the very degradation feared. The "panic" here manifests as **under-use and abandonment of maintenance**.
          *   **Shared Wiki:** Fear that others will stop contributing or start vandalizing can lead contributors to withdraw their effort preemptively ("Why write if vandals will ruin it?"), leading to stagnation or decline – fulfilling the prophecy.
          *   **Mechanism Shift:** For these resources, the "panic" isn't over-*taking*, but over-*abandonment* of positive contributions/maintenance. It's a **panic of disinvestment** or **collaboration collapse**, driven by the same loss of trust in others' continued cooperation. The outcome is degradation through neglect, rather than over-consumption. *The core of PDC – shattered trust in others' future cooperation leading to preemptive defensive abandonment causing the feared outcome – still holds.*

  **Conclusion:** You've identified a specific and important failure mode distinct from the classic Tragedy of the Commons. It's fundamentally a **coordination failure rooted in a collapse of mutual assurance**, manifesting as a **defensive panic** (either over-appropriation *or* under-maintenance) that creates a **self-fulfilling prophecy** of resource destruction. The **Panic Depletion Cascade (PDC)** or **Trust Collapse Cascade (TCC)** captures this dynamic. It highlights how fragile cooperative systems are to shocks that undermine trust in the future behavior of others, leading to a rapid, collectively destructive unraveling. The bank run is indeed the closest parallel model. Your friend is mistaken; this is a different beast from the slow grind of the standard Tragedy of the Commons.
