prompt: |-
  I am reworking a graduate seminar session on cooperation in one-shot games, and before I put the following reconstruction in front of students I would like it checked, because I suspect that one or two steps in it are doing more work than they can bear.

  My reconstruction is this. Hofstadter's superrationality settles the one-shot Prisoner's Dilemma. The superrational player notices that any two rational agents faced with the same problem and the same information must arrive at the same conclusion; so, in effect, her choice is everyone's choice. Comparing the two symmetric outcomes — everyone defects versus everyone cooperates — she sees that the latter is better for her, and she cooperates. As I read it, this is nothing more than evidential decision theory applied to the case where the other player is a copy of me: the entire weight of the argument falls on whether the two decisions are correlated, and since a copy and I are physically identical, microphysics guarantees that they are. Causal decision theorists, who defect in the one-shot game against a copy, are therefore not offering a rival conception of rationality; they are simply failing to notice a correlation that is there, and leaving utility on the table. If that is right, my plan is to teach causal decision theory as refuted, present superrationality — or its later development as functional decision theory — as the correct theory, and tell the seminar that in a one-shot Prisoner's Dilemma the rational answer is cooperation, full stop, and against any opponent, since nothing in the argument mentions the opponent's character.

  There are two extensions of this that I also intend to assert, and I would like them checked at the same time. First, a colleague's gloss that I am inclined to repeat: superrationality is just Kant's categorical imperative fitted with a payoff matrix, so the real content of the idea is not new to moral philosophy at all, and the decision-theory literature has been reinventing an old wheel. Second, the variant in which only one of the players' moves is actually implemented — say twenty players, a prize awarded to the one player who acts, and awarded only if no one else acts — seems to me to have exactly the same structure: what does the work is the correlation between the players' reasoning, not whether every move is played out. So I cannot see why any randomized strategy would have a role in that variant, and I mean to tell the seminar that the suggestion that one does is a confusion.

  Please tell me, carefully and without granting my reconstruction, where it goes wrong and what the corrected version looks like. I would rather be corrected now than in front of thirty graduate students. Do not give me a bibliography or a reading list; I want the argument itself.

  After your prose answer, return a single JSON object with exactly these fields:

  - "failed_steps": an array of objects, one per place where my reconstruction breaks, each with the keys "step" (a short label for the step), "my_claim" (the claim as I made it, paraphrased), "why_it_fails" (the precise error, stated so that a student could see it), and "correction" (what should be said in its place).
  - "superrationality_characterized": a single string saying what mechanism actually does the work in superrationality, and stating plainly whether that mechanism is the twin-or-copy correlation of evidential decision theory, a fixpoint of shared reasoning, a counterfactual about one's own decision procedure, or something else — and whether these can come apart.
  - "case_table": an array of objects, one per case, each with the keys "case", "recommendation" (what superrationality in fact recommends there), "mechanism" (what is doing the work in that case), and "cooperate_full_stop" (the string "holds", "fails", or "qualified"). The cases: (a) one-shot Prisoner's Dilemma against a player known to be superrational; (b) the same against a player known to be an ordinary expected-utility maximizer; (c) the same against a player whose type you are unsure of, in a population containing an unknown fraction of superrational players; (d) the single-implementation variant described above.
  - "cdt_status": a single string saying whether the one-shot case refutes causal decision theory and, if not, exactly what it does establish about it.
  - "kant_gloss": a single string saying what is right and what is wrong in identifying superrationality with universalization.
  - "slide_claim": a single sentence I can put on a lecture slide without misleading the seminar.
  - "open_questions": an array of two or three strings naming what remains genuinely unsettled once the corrections above are made.
reasoning: |-
  We are going to analyze the reconstruction step by step.

   The reconstruction:

   1. Superrationality settles the one-shot Prisoner's Dilemma by noting that two rational agents with the same information must make the same choice.
   2. Therefore, the player's choice is effectively everyone's choice.
   3. Comparing symmetric outcomes: mutual cooperation is better than mutual defection, so the player cooperates.
   4. This is evidential decision theory (EDT) applied when the other player is a copy (so correlation is guaranteed by physical identity).
   5. Causal decision theorists (CDT) defect because they fail to notice the correlation, thus leaving utility on the table.
   6. Therefore, CDT is refuted and superrationality (or functional decision theory, FDT) is correct: in a one-shot PD, cooperate against any opponent.

   Extensions:

   A. Superrationality is just Kant's categorical imperative with a payoff matrix.
   B. In the single-implementation variant (multiple players, only one acts and gets the prize if no one else acts), the structure is the same and randomized strategies have no role.

   Let's break down the issues.

   Step 1: The core of superrationality is that the player reasons as if their decision is the same as the other's because they are both rational and face the same problem. But note: this requires that the other player is also superrational (or at least that they are using the same reasoning). The reconstruction claims that the argument works "against any opponent" because "nothing in the argument mentions the opponent's character". This is a critical flaw.

   Step 2: The reconstruction equates superrationality with EDT. However, EDT typically conditions on the action taken and uses conditional probabilities to update on what that implies about the other player. In the case of a copy, EDT would indeed lead to cooperation because P(other cooperates | I cooperate) = 1 and P(other defects | I defect) = 1. But note: if the other player is not a copy and not using the same reasoning, then conditioning on one's own action may not imply anything about the other. So the reconstruction overgeneralizes.

   Step 3: The claim that CDT is simply failing to notice a correlation is incomplete. CDT does not condition on the action but on the causal effect. In the copy case, CDT would say: my action does not cause the other to act, because they are a copy and will do the same regardless? Actually, in the standard setup of a one-shot PD against a copy, CDT may still defect because it sees no causal lever. However, there is a known tension: if the copy is a perfect physical copy and the decision is deterministic, then the actions are correlated by physical law. But CDT ignores this correlation because it doesn't believe it can cause the other to change. So the criticism of CDT is that it ignores relevant information (the correlation) but CDT would respond that it is not causally relevant.

   Step 4: The extension to any opponent is problematic. If the opponent is not a copy and not superrational, then the correlation breaks. For example, against a known defector, superrationality should not recommend cooperation.

   Step 5: The Kantian gloss: Kant's categorical imperative is about acting only on maxims that you can will to be universal law. This is similar in that it considers the outcome if everyone acted the same. However, superrationality is a decision rule for a single situation with a fixed payoff matrix, while Kant's imperative is a moral principle. Moreover, in the PD, if everyone cooperates then everyone gets a good outcome, so it seems to align. But note: the categorical imperative does not depend on the other player being identical in reasoning. It is a unilateral commitment to act as if everyone will follow the same rule. However, in the PD, if you cooperate and the other defects, you get a bad outcome. So Kantian ethics might require cooperation regardless of consequences? This is a complex debate. The gloss may be too quick.

   Step 6: The single-implementation variant: multiple players, but only one is chosen to act (and if no one else acts, the one who acts gets a prize). The reconstruction claims that the same reasoning applies: the correlation in reasoning is what matters, and so no randomized strategy is needed. However, note that in this variant, if everyone reasons the same and decides to act, then multiple players act and no one gets the prize. If everyone decides not to act, then no one acts and no one gets the prize. So the only way to get the prize is if exactly one player acts. The superrational approach would be to reason that if I act, then everyone who reasons like me will also act, so multiple acts -> failure. Therefore, I should not act. But then no one acts. This is symmetric and yields nothing. Alternatively, if I do not act, then no one acts? But then I don't get the prize. So what is the solution? The problem is that the reasoning leads to a deadlock. One might argue for a mixed strategy: each player acts with a certain probability so that the expected number of actors is 1. But the reconstruction claims that randomized strategies have no role. However, without randomization, it's hard to see how to break the symmetry. Moreover, if all players are superrational and they all use the same reasoning, they must all do the same. So they must either all act or all not act. Neither leads to the prize. Therefore, the only solution is to randomize. This contradicts the reconstruction.

   Now, let's structure the answer.

   failed_steps: array of objects

   We'll identify several steps:

   Step A: Claim that superrationality works against any opponent because the argument doesn't mention the opponent's character.
     Why it fails: The superrationality argument requires that the opponent is also using the same superrational reasoning. If the opponent is a defector, then conditioning on your own action does not imply the same action by the opponent. So you should defect.

   Step B: Claim that the entire argument is just EDT with a copy, and that the correlation is guaranteed by microphysics.
     Why it fails: While it is true that in the copy case the physical identity guarantees correlation, superrationality is often presented as a reasoning method that applies even without physical copies, but rather with agents who are "identical" in their reasoning. However, the reconstruction then overgeneralizes to any opponent. Moreover, note that EDT without the copy might not lead to cooperation: if the opponent is not a copy, then P(other cooperates | I cooperate) might not be 1.

   Step C: Claim that CDT is simply failing to notice a correlation and leaving utility on the table, and is therefore refuted.
     Why it fails: CDT is designed to ignore correlations that are not causal. In the copy case, there is a correlation but no causal path by which your action affects the other. CDT's defection is consistent with its principles. Moreover, in cases without such a correlation, CDT may do better. Therefore, the one-shot PD against a copy does not refute CDT in general; it only highlights a situation where CDT leads to a suboptimal outcome. There is an ongoing debate about whether this is a flaw in CDT or a price we pay for avoiding spurious correlations.

   Step D: Claim that in the single-implementation variant, randomized strategies have no role because the correlation of reasoning is what matters.
     Why it fails: In the single-implementation variant, if all players are superrational and deterministic, they all do the same. But then they either all act (and no prize) or all don't (and no prize). The only way to have a chance at the prize is to randomize. Therefore, randomized strategies are essential in this variant.

   Now, the other fields:

   superrationality_characterized: 
     Superrationality works by treating the decision problem as a fixpoint in a system of identical rational agents: each agent's decision is a function of the decision of the others, and in the symmetric case, we look for a symmetric equilibrium where everyone does the same. The mechanism is a fixpoint of shared reasoning. This can be implemented without physical copies: what matters is that the agents are using the same decision procedure and they know that the others are doing the same. It is not merely the physical correlation of a copy. However, in the case of a physical copy, the correlation is guaranteed. These can come apart: for example, if two agents are using the same decision procedure but have different information, they might not reach the same decision.

   case_table:

   (a) one-shot PD against a player known to be superrational:
       Recommendation: Cooperate.
       Mechanism: Fixpoint reasoning: both players, being superrational, will do the same. Mutual cooperation is better than mutual defection.
       Cooperate_full_stop: holds (in this case).

   (b) against a known ordinary expected-utility maximizer (who is not superrational and will defect):
       Recommendation: Defect (because if you cooperate, you get the sucker's payoff; if you defect, you get the temptation or punishment, but at least not the sucker's).
       Mechanism: No fixpoint reasoning because the opponent is not using the same reasoning. You must best respond to the opponent's known strategy (defect).
       Cooperate_full_stop: fails.

   (c) against a player of uncertain type in a population with an unknown fraction of superrational players:
       Recommendation: It depends on the fraction. If the fraction of superrational players is high enough, then cooperation might yield a higher expected payoff (because with high probability the opponent is superrational and will cooperate). But if the fraction is low, defection might be better. However, note: a superrational player in a mixed population might reason differently? The standard approach in the literature is to use a Bayesian approach: compute the expected payoff of cooperation and defection. But the superrational approach might require a more complex equilibrium. However, without more details, the typical recommendation for an agent who is not sure about the opponent is to use a strategy that conditions on the information about the population. This is not a clear-cut case for superrationality because the opponent may not be using the same reasoning. So we might say: the agent should cooperate only if the expected gain from cooperation (given the probability the opponent is superrational and will cooperate) is higher than defection. But note: a superrational agent might still try to reason that their own decision is evidence about the type of the population? This is complex. However, in the standard superrationality framework, it is assumed that both players are superrational. Therefore, in a mixed population, the superrational player might not be able to rely on the fixpoint. So we might fall back to expected utility.

       Alternatively, we can think of the population as having two types: superrational (who will do the same as you) and non-superrational (who defect). Then:
          If you cooperate: 
              With probability p (the fraction of superrationals), the opponent is superrational and cooperates -> payoff R.
              With probability 1-p, the opponent defects -> payoff S.
          If you defect:
              With probability p, the opponent is superrational and cooperates -> payoff T.
              With probability 1-p, the opponent defects -> payoff P.

          You cooperate if: p*R + (1-p)*S > p*T + (1-p)*P.

          For standard PD payoffs (T>R>P>S), this inequality holds when p > (P-S)/(T-S + R-P) [after rearranging]. So if p is above a threshold, cooperate; else defect.

       Mechanism: Expected utility with Bayesian updating, not pure fixpoint reasoning.
       Cooperate_full_stop: qualified (it depends on p).

   (d) single-implementation variant:
       Recommendation: Each player should use a randomized strategy: act with probability 1/N (where N is the number of players) to maximize the probability that exactly one acts.
       Mechanism: Without randomization, deterministic superrationality leads to either all acting or none, both of which yield 0. Therefore, the solution is to use a symmetric mixed strategy. The fixpoint reasoning now applies to the randomization: each player must use the same mixed strategy. The symmetric Nash equilibrium is for each to act with probability p such that the expected number of actors is 1, which is p=1/N.
       Cooperate_full_stop: fails (because cooperation in the sense of acting or not acting is not the same as in PD, but the deterministic version fails).

   cdt_status:
     The one-shot PD against a copy does not refute causal decision theory. It demonstrates a situation in which CDT, by ignoring the evidential correlation (which in this case is real and not spurious), leads to a Pareto-suboptimal outcome. However, CDT remains a consistent decision theory that avoids the pitfalls of EDT in other cases (like Newcomb's problem with an imperfect predictor). The case establishes that CDT is not universally optimal, but it does not show that CDT is internally inconsistent.

   kant_gloss:
     What is right: The idea that one should act as if one's action were universalized is similar to the Kantian categorical imperative. Both consider the hypothetical scenario in which everyone acts the same. What is wrong: Superrationality is a decision rule for achieving optimal outcomes in symmetric games, while Kant's imperative is a deontological moral principle that does not depend on the consequences for the agent. Moreover, Kant's imperative would require cooperation even when others are not following the rule (which can lead to exploitation), whereas superrationality only cooperates when it expects the other to cooperate as well.

   slide_claim:
     "Superrationality, as a fixpoint of symmetric reasoning among identical rational agents, prescribes mutual cooperation in the one-shot Prisoner's Dilemma when both players are superrational, but defection against a known non-superrational opponent."

   open_questions:
     - How to extend superrationality to asymmetric games or populations of heterogeneous agents?
     - What is the precise relationship between superrationality, evidential decision theory, and functional decision theory?
     - In the single-implementation variant, is there a way for superrational agents to achieve a positive payoff without resorting to mixed strategies? (Answer: Not without additional coordination mechanisms.)

   Now, the JSON object.
