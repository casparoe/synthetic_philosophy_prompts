prompt: |-
  For a comparative seminar on the legal regulation of hate speech I want the specification before the doctrines. Please write the desiderata that any adequate theory of when the state may restrict hate speech must satisfy: the cases it has to get right, the distinctions it must not collapse, and the empirical or doctrinal facts it cannot contradict, each stated with the case or consideration that makes it a requirement, and each marked as either non-negotiable or as a preference of one camp. Fix the purpose as follows: the theory is to be good enough to be drafted into a statutory definition that a court could apply without open-ended balancing in each individual case, so vagueness and appeals to weigh everything count against a requirement rather than for it.

  Some leads I want handled explicitly, with the case behind each:

  - the mirror case: the same proposition asserted by a member of a historically dominant group about a minority and by a member of that minority about the dominant group, where a theory must say what, if anything, licenses treating them differently, and why the difference is not merely a judgement about who currently needs protection more;
  - the re-enactment case: the same words quoted, staged, or set to music by a speaker who denounces their content, where the harm complained of is said to survive the denunciation, so that the theory must locate the wrong somewhere other than the speaker's endorsement;
  - the export case: an utterance lawful where it is made and received only where it is unlawful, and the converse, which forces a theory to say whether the harm sits with the speaker, with the audience, or with neither, and to live with the consequence;
  - the cumulative case: very many individually trivial utterances whose aggregate effect is the only harm alleged;
  - and the distinction between restricting what is said, restricting what it does, and restricting what it reveals about what the speaker will do next.

  Mark which requirements are genuinely neutral between the American free-speech tradition and the European dignity-and-proportionality tradition, and which are commitments of one of them that have been passed off as demands of reason; identify the subset you suspect cannot be jointly satisfied, say which one or two you would abandon and what abandoning them costs; and name the single requirement that excludes the largest share of the positions currently on offer. No bibliography, no case citations, no reading list — I want the arguments, not the sources. Please write in British English.
reasoning: |-
  Okay, the user is preparing for a comparative seminar on hate speech regulation and wants a set of desiderata for any adequate theory. They need specifications before diving into doctrines. The key is to outline requirements that a theory must satisfy to be drafted into a statutory definition without open-ended balancing. 

  First, the user’s explicit leads need careful handling. The mirror case requires explaining asymmetric treatment without resorting to mere protectionism. The re-enactment case demands locating harm beyond speaker endorsement. The export case forces a stance on harm’s locus—speaker, audience, or context. The cumulative case tackles aggregate harm from trivial acts. The distinction between content, effect, and predictive intent is crucial for precision. 

  The user also wants markers on neutrality between American and European traditions. Some requirements will inherently align with one tradition (e.g., dignity focus vs. strict scrutiny). Identifying tensions is vital—e.g., cumulative harm assessment clashes with individual assessment demands. The mirror case’s asymmetry requirement might be the biggest filter, excluding theories that can’t justify differential treatment rigidly. 

  For the export case, territoriality vs. harm source must be addressed—either choice has doctrinal consequences. Cumulative harm’s vagueness conflicts with the no-open-balancing rule, so it’s a candidate for abandonment despite costing protection against systemic harm. 

  The single toughest requirement? Mirror asymmetry. It forces a theory to embed historical hierarchy into harm assessment, which many liberal theories reject outright. This will exclude positions that insist on viewpoint neutrality or equal application. 

  British English compliance means "harmful" not "harmful," "centre" not "center," etc. Avoiding citations keeps focus on arguments. Balancing "non-negotiable" vs. "preference" labels requires separating core democratic safeguards (e.g., no thought crime) from culturally variable values (dignity prioritisation).
answer: |-
  Here are the desiderata for an adequate theory of state-restricted hate speech, structured as requested, adhering to your specifications (British English, no citations, focus on arguments, statutory drafting suitability):

  **Core Purpose:** The theory must yield a statutory definition sufficiently precise for courts to apply without case-by-case balancing tests, avoiding vagueness and open-ended "weighing of all circumstances".

  **I. Non-Negotiable Requirements (Foundational to any liberal-democratic framework):**

  1.  **The Intent/Recklessness Requirement:** The theory must require proof of intent to stir up hatred against a group, or recklessness as to whether hatred would be stirred up, based on the *content and context* of the speech. *(Rationale: Prevents punishing accidental offence or unintended interpretations; essential to avoid "thought crime" and chilling effect; distinguishes hate speech from mere insult or offensive ideas.)*
  2.  **The Imminent Harm Requirement:** The theory must link restriction to a high probability of imminent, concrete harm (beyond mere offence or distress) causally traceable to the speech, such as incitement to violence, discrimination, or severe harassment. *(Rationale: Anchors restriction in tangible harm prevention, not viewpoint suppression; aligns with core "emergency" justifications for speech limits; key for statutory precision.)*
  3.  **The Content/Viewpoint Neutrality Baseline (Procedural):** The statutory mechanism must *not* on its face privilege or disfavour specific political, religious, or philosophical viewpoints. Restrictions must be defined by *prohibited effects or characteristics* (e.g., inciting hatred, using dehumanising language targeting protected characteristics), not the *substance of the idea* itself. *(Rationale: Prevents government from silencing disfavoured ideas; essential for democratic discourse; formal neutrality is achievable in statute even if application has differential impact.)*
  4.  **The No-Precrime Distinction:** The theory must clearly distinguish between restricting speech *because of what it predicts* about the speaker's future unlawful actions (impermissible precrime) and restricting speech *because of the harm the speech itself causes or imminently risks causing* (permissible harm prevention). *(Rationale: Fundamental liberty safeguard; prevents guilt by association or predictive policing based on speech alone.)*
  5.  **The Causation Requirement:** The theory must require a demonstrable causal link between the specific speech act and the alleged imminent harm. It cannot rely solely on correlation or post-hoc justification. *(Rationale: Prevents restriction based on speculative or generalised societal harms; ensures state action is justified by concrete evidence specific to the utterance.)*

  **II. Requirements Addressing Explicit Leads (Marked for Negotiability):**

  6.  **The Mirror Case Asymmetry:** The theory *must* provide a principled justification, rooted in historical and social context *beyond current vulnerability*, for why identical statements made *by* a historically dominant group *about* a historically persecuted group may be restrictable, while the inverse may not be. *[Non-Negotiable for European tradition; Preference for Critical Race Theory camp; Often Rejected by Strict American Tradition as viewpoint discrimination]*. *(Rationale: Recognises that the harm of reinforcing systemic oppression differs fundamentally from speech challenging power; avoids collapsing history into abstract symmetry. Case: "Group X is inferior" carries different weight and likely harm depending on whether spoken by the group historically wielding power over X or vice versa.)*
  7.  **The Re-enactment Harm Locus:** The theory must locate the wrong in the *reception and likely effect* of the reproduced hateful content *within its new context*, not in the speaker's subjective endorsement. It must explain why denunciation doesn't necessarily negate the risk of harm from re-exposing audiences to the toxic material. *[Non-Negotiable for theories emphasising audience harm/dignity; Contested by theories focusing solely on speaker culpability]*. *(Rationale: Harm can arise from the re-experiencing of hateful ideas, regardless of the current speaker's intent (e.g., re-traumatising victims, normalising hate). Case: Quoting genocidal slogans in a play, even critically, may still cause harm to targeted groups.)*
  8.  **The Export Case Territoriality/Harm Source:** The theory *must* commit to whether the harm justifying restriction resides primarily in:
      *   The *speaker's act* (making territorial jurisdiction key, favouring "lawful where spoken"), OR
      *   The *impact on the audience/receiving society* (favouring restrictions based on where the speech is accessed/consumed and causes harm, "unlawful where received").
      *(Rationale: Forces clarity on the locus of harm. Case: Online speech uploaded in Country A (legal) but primarily accessed and causing harm in Country B (illegal) forces this choice.)* *[Choice reflects fundamental commitment - Speaker Act focus aligns with libertarian/American tradition; Audience Harm focus aligns with dignity/protectionist/European tradition. Genuinely contested, no neutral ground.]*
  9.  **The Cumulative Harm Threshold:** The theory must either:
      *   **a)** Reject restricting speech based *solely* on alleged cumulative harm from trivial utterances, requiring each instance to meet the imminent harm threshold independently, OR
      *   **b)** Provide a strictly defined, *ex-ante* statutory threshold (e.g., volume, coordination, platform) for when aggregation transforms trivial acts into restrictable systemic harm *without* case-by-case judicial aggregation.
      *(Rationale: Avoids vagueness and prosecutorial overreach inherent in post-hoc aggregation arguments. Case: Countless minor online slurs allegedly creating a hostile environment collectively.)* *[Option (a) is Non-Negotiable for American tradition/individualist harm focus; Option (b) is a Preference for some European/societal harm approaches, but difficult to define statutorily without vagueness.]*
  10. **The Content/Effect/Revelation Tripartite Distinction:** The statutory definition *must* clearly distinguish between:
      *   Restricting speech based on its *content* (the idea expressed).
      *   Restricting speech based on its *likely effect* (imminent unlawful harm).
      *   Restricting speech based on what it *reveals* about the speaker (e.g., propensity for future violence, disqualification for office).
      The theory must justify restrictions *only* under the second category (Effect) for hate speech. *(Rationale: Essential statutory precision; prevents mission creep. Content-based restrictions are generally anathema; Revelation-based restrictions veer into precrime.)* *[Non-Negotiable for precision and liberty. Failure here leads to overbreadth.]*

  **III. Analysis of Neutrality, Tensions, and Exclusion:**

  *   **Genuinely Neutral Requirements:** 1 (Intent/Recklessness - though standards differ), 2 (Imminent Harm - though definitions of "harm" differ), 3 (Formal Viewpoint Neutrality in statute drafting), 4 (No-Precrime), 5 (Causation), 10 (Tripartite Distinction). These are procedural or foundational harms that both traditions *aspire* to address, though interpretations vary.
  *   **Camouflaged Commitments:**
      *   Requirement 6 (Mirror Asymmetry) is a *commitment* of European/Critical traditions *presented* as a demand of reason (contextual harm). The strict American tradition sees it as incompatible with viewpoint neutrality.
      *   The Audience Harm focus in Requirement 8 (Export Case) is a *commitment* of the European tradition *presented* as harm prevention. The American tradition sees it as extraterritorial overreach and audience paternalism.
      *   Requirement 9b (Cumulative Harm Threshold) reflects a *preference* within some societal-harm focused camps but is often presented as necessary for effectiveness. The individualist camp sees it as inherently vague and dangerous.
  *   **Likely Irreconcilable Tension:** Requirement 6 (Mirror Asymmetry - requiring differential treatment based on historical power) fundamentally clashes with a strict reading of Requirement 3 (Formal Viewpoint Neutrality - forbidding differential treatment based on the viewpoint expressed). **This is the core tension.**
  *   **Candidate for Abandonment:** Requirement 9b (Strict Statutory Definition for Cumulative Harm). Abandoning it (favouring 9a) costs the ability to address genuinely systemic harms emerging from pervasive low-level hate speech via specific criminal law. The trade-off is gaining vital clarity, predictability, and avoiding prosecutorial discretion abuse. Systemic harm must then be addressed via civil law (harassment, discrimination suits), platform regulation, or education, not criminal hate speech statutes.
  *   **The Great Excluder:** **Requirement 6 (Mirror Asymmetry).** This single requirement excludes the vast majority of mainstream American free speech absolutist and many moderate liberal positions that insist on strict, symmetric viewpoint neutrality. It also challenges some minimalist harm-based approaches that cannot articulate the asymmetry without resorting to open-ended balancing of social needs (which violates the core purpose). Only theories deeply embedding historical and social power analysis into the *definition* of the harm or the protected characteristic can satisfy it within a statutory framework, which inherently excludes theories prioritising abstract individual rights symmetry.

  This framework provides the necessary specification, forces theoretical choices into the open, and highlights the points of genuine conflict and compromise necessary for drafting a workable statute. The challenge lies in squaring the circle of contextual harm (especially asymmetry) with the demands of legal certainty and formal neutrality.
