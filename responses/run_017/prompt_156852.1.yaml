prompt: |-
  I'm a software engineer with no formal philosophy background, and I run a fortnightly lunch reading group with seven or eight colleagues at work. All of them are comfortable with probability and have implemented some kind of Bayesian filter or tracker, but none has studied formal epistemology, and for them updating means Bayes' theorem applied to a proposition that has become certain.

  In one 55-minute session, with a whiteboard, I want to get them to the point where they can apply Jeffrey conditionalization — updating on evidence that is itself uncertain — and, more importantly, see what adopting that rule commits them to. Please don't explain the rule to me; I can follow it on paper. Plan how I should explain it.

  The session has to get across: why ordinary conditionalization cannot even be stated for the case that motivates the generalization (an experience that moves your confidence in E without making any proposition certain, so that there is nothing to condition on); rigidity, as the substantive assumption of the rule rather than a technicality; what the rule degenerates to when the new probability of a cell is 1, and why that is a sanity check rather than a curiosity; the fact that successive updates of this kind do not in general commute, and what that means for anyone who would bolt the rule onto a system that streams observations; and some rough sense of how the rule relates to the idea of choosing the distribution closest to your prior among those satisfying the new constraints. On that last point my understanding — which I want you to correct if it is wrong — is that in the single-partition case the two agree and come out closed-form, whereas with constraints on two overlapping partitions there is no closed form and you end up in iterative proportional fitting. Tell me whether any of that belongs in a 55-minute session, and if so where.

  Specifically, I want:

  1. The order in which the components must be introduced, and for each, the dependency that makes it impossible to postpone: what has to be in place before the next thing is even statable rather than merely easier.
  2. One example to carry the session. Tell me what properties it must have and, as importantly, what it must lack. My default is something from service monitoring — a noisy alert that shifts my confidence that a deployment is degraded — but I suspect that example quietly contains something I don't want, whether an event I could have conditioned on instead, a proposition that effectively becomes certain, or a case where the experience also teaches me something about how E bears on A and not only about how likely E is. If a single example cannot carry both the rule and the cases where the rule misbehaves, say so and say where in the arc to switch examples.
  3. The misconceptions to expect, and the exact point in the sequence at which each should be headed off rather than corrected afterward. My guesses: that this is just Bayes' theorem with a softened likelihood and nothing more; that rigidity is a consequence of the framework rather than an extra assumption; that the failure of order-independence is an implementation bug with a patch; that showing ordinary conditionalization cannot handle the motivating case shows it to be wrong rather than merely inapplicable. Correct these, add the ones I have missed, and tell me which are worth pre-empting in advance.
  4. What I should leave out at this level and openly refuse to explain. I would rather name a topic as out of scope than gesture at it in the last two minutes.
  5. Where the soft-evidence alternative belongs. Someone in the room will have met handling of uncertain observations in Bayesian networks, where you hold a likelihood ratio fixed and run ordinary Bayes on a virtual observation instead of moving the probability of E. Should I invite that, and if so as a contrast, as the same rule in different notation, or as a distraction to be waved off?
  6. One question to close on that would show me whether they have understood the rule rather than followed the algebra to the right number.

  Finally, since you are giving me a plan rather than a proof: say where you are least confident in it. Identify the step in your proposed sequence most likely either to lose the room or to rest on a claim that is actually contested among people who work on this, and tell me what a colleague could say or ask that ought to make me reorder, drop, or invert that step. Where the literature is genuinely unsettled, flag it as unsettled rather than quietly picking a side.
reasoning: |-
  We are planning a 55-minute session on Jeffrey conditionalization for a group of software engineers familiar with basic Bayesian updating but not formal epistemology.

  Goals:
  - Motivate the need for Jeffrey conditionalization: updating when evidence is uncertain (no proposition becomes certain).
  - Explain the rule: rigidity (the condition that the probabilities conditional on the partition elements remain unchanged) as a substantive assumption.
  - Show that it reduces to ordinary conditionalization when the new probability of one partition element becomes 1.
  - Discuss that successive updates do not commute and what that implies for systems that stream observations.
  - Briefly touch on the connection to minimizing relative entropy (only in the single-partition case and only to note that it's equivalent and closed-form, but beyond that it's more complex).

  Constraints:
  - Time: 55 minutes.
  - Audience: comfortable with probability and basic Bayes, but no formal epistemology.

  Plan:

  1. **Introduction (5 minutes)**
     - Recap ordinary conditionalization (Bayes' theorem): when we observe E (so P(E)=1), we update by setting P_new(H) = P_old(H|E).
     - Point out a limitation: what if we have an experience that changes our confidence in E without making E (or any other proposition) certain? 
     - Example: You look at a fabric under poor light. You become more confident that it is green, but not certain. How do we update our beliefs about hypotheses that depend on the color (e.g., the fabric is Irish linen)?

  2. **The Motivating Case (10 minutes)**
     - Present a concrete example. Let's avoid the service monitoring example because it might contain hidden conditioning events. Instead, use a color perception example under varying light conditions, or if we must use a technical example, use one that is stripped down.
     - Proposed example: 
       - We have two coins. One is fair (H1: P(heads)=0.5), the other is biased (H2: P(heads)=0.7). We pick one coin at random (so P(H1)=P(H2)=0.5). We flip it and get an outcome. But the flip is observed under poor lighting, so we are not sure whether it was heads or tails. 
       - After the observation, we become 60% confident that it was heads (so P_new(Heads)=0.6). How do we update our belief about which coin we have?
     - Why this example? 
       - The partition is {Heads, Tails}. The evidence (the flip) is uncertain. There is no proposition that becomes certain (we don't condition on a specific outcome). 
       - We want to update P(H1) and P(H2). 
     - Show that ordinary conditionalization doesn't work because we don't have a specific outcome to condition on.

  3. **Introducing Rigidity (10 minutes)**
     - The key idea: even though our probability for the partition elements (Heads, Tails) changes, we assume that the probabilities conditional on these elements remain the same. 
       - That is, P_new(H1 | Heads) = P_old(H1 | Heads) and similarly for Tails.
     - Why assume this? Because the experience only tells us about the flip, not about the coin type. The relationship between the coin type and the flip outcome hasn't changed.
     - Rigidity is an assumption, not a logical necessity. It might fail in some cases (e.g., if the experience also taught us something about the coin). We are assuming that the only effect is on the probability of the partition elements.

  4. **Deriving the Rule (10 minutes)**
     - Write the rule: 
          P_new(H) = P_new(Heads) * P_old(H|Heads) + P_new(Tails) * P_old(H|Tails)
     - In general, for a partition {E_i}:
          P_new(A) = Σ_i P_new(E_i) * P_old(A | E_i)
     - Apply to the coin example:
          We have P_old(H1|Heads) = P(Heads|H1)*P(H1)/P(Heads) = (0.5 * 0.5) / 0.6 = 0.25/0.6 ≈ 0.4167? 
          But wait, we haven't computed P_old(Heads) yet. Let's compute the prior:
          P_old(Heads) = P(Heads|H1)*P(H1) + P(Heads|H2)*P(H2) = 0.5*0.5 + 0.7*0.5 = 0.25 + 0.35 = 0.6
          Then P_old(H1|Heads) = (0.5 * 0.5) / 0.6 = 0.25/0.6 ≈ 0.4167
          Similarly, P_old(H1|Tails) = (0.5 * 0.5) / 0.4 = 0.25/0.4 = 0.625
          Now, P_new(H1) = 0.6 * 0.4167 + 0.4 * 0.625 = 0.6*(5/12) + 0.4*(5/8) [if we use fractions] 
          Actually, to avoid decimals: 
            P_old(Heads) = 0.6 = 3/5? Let's use fractions: 
            P_old(Heads) = 0.5*0.5 + 0.7*0.5 = 0.5*(0.5+0.7)=0.5*1.2=0.6 -> 3/5? Actually 0.6=3/5? 0.6=3/5 is correct.
            P_old(H1|Heads) = ( (1/2)*(1/2) ) / (3/5) = (1/4) * (5/3) = 5/12
            P_old(H1|Tails) = ( (1/2)*(1/2) ) / (2/5) = (1/4) * (5/2) = 5/8? But wait: P_old(Tails)=0.4=2/5.
            Actually, P_old(Tails)=1-0.6=0.4=2/5? Yes.
            Then P_old(H1|Tails) = P(Tails|H1)*P(H1)/P(Tails) = (0.5 * 0.5) / 0.4 = 0.25/0.4 = 5/8? 0.25/0.4 = 5/8? 0.25=1/4, 0.4=2/5, so (1/4)/(2/5)= (1/4)*(5/2)=5/8. Correct.
          Now, P_new(H1) = P_new(Heads) * P_old(H1|Heads) + P_new(Tails) * P_old(H1|Tails)
                         = (0.6) * (5/12) + (0.4) * (5/8)
                         = (0.6 * 5/12) + (0.4 * 5/8)
                         = (3/5 * 5/12) + (2/5 * 5/8)   [using fractions: 0.6=3/5, 0.4=2/5]
                         = (3/12) + (2/8) 
                         = (1/4) + (1/4) = 0.5
          So P_new(H1)=0.5, same as before. 
     - Why did it stay the same? Because the prior probability of heads (0.6) is exactly what we got from the prior, so the update doesn't change our belief about the coin? 
       But note: we set P_new(Heads)=0.6, which is the same as the prior. So it's consistent that the posterior for H1 remains 0.5.

     - Now, change the example: suppose after the observation we are 90% confident it was heads (so P_new(Heads)=0.9). Then:
          P_new(H1) = 0.9 * (5/12) + 0.1 * (5/8)
                    = 0.9*(5/12) + 0.1*(5/8)
                    = (9/10)*(5/12) + (1/10)*(5/8)
                    = (45/120) + (5/80)
                    = (45/120) + (15/240) ... better common denominator 240: 
                    45/120 = 90/240, 5/80=15/240 -> 90/240 + 15/240 = 105/240 = 21/48 = 7/16 = 0.4375
          So now we are less confident in H1 (which is the fair coin) because a heads result is more likely from the biased coin.

     - Sanity check: when P_new(Heads)=1, we get:
          P_new(H1) = 1 * P_old(H1|Heads) + 0 * ... = P_old(H1|Heads) = 5/12 ≈ 0.4167, which is exactly what we would get from ordinary conditionalization.

  5. **Non-commutativity (10 minutes)**
     - Now, consider two successive updates. 
       - First update: from P_old to P_new1 with a shift in the partition {E1, E2}.
       - Second update: from P_new1 to P_new2 with another shift (possibly on the same partition or a different one?).
     - Important: Jeffrey updating is not commutative. Order matters.
     - Example: use the same coin setup. Suppose we have two uncertain observations in a row. 
       - First: we become 90% confident of heads (so update to P_new1(Heads)=0.9) -> P_new1(H1)=0.4375 (as above).
       - Now, from this new state, we have a second observation: we become 10% confident of heads (so P_new2(Heads)=0.1). 
          We need to compute P_new2(H1) = P_new2(Heads) * P_new1(H1|Heads) + P_new2(Tails) * P_new1(H1|Tails)
          But note: we must compute the conditionals from P_new1. However, we have to be careful: rigidity is assumed for the update, but does it hold for the conditionals from the intermediate state? 
          In the rigidity assumption for the second update, we assume that P_new2(H1|Heads) = P_new1(H1|Heads) and similarly for Tails. 
          How do we compute P_new1(H1|Heads)? 
            P_new1(H1|Heads) = P_new1(H1 and Heads) / P_new1(Heads) = [ P_new1(H1) * P(Heads|H1) ] / P_new1(Heads) ? 
            But note: in the first update, we did not change the conditionals: by rigidity, P_new1(H1|Heads) = P_old(H1|Heads) = 5/12? 
            Actually, rigidity says that the conditional probabilities given the partition elements remain the same as in the prior. So in the first update, we set:
              P_new1(H1|Heads) = P_old(H1|Heads) = 5/12
              P_new1(H1|Tails) = P_old(H1|Tails) = 5/8
            But note: after the first update, the joint distribution has changed. However, the conditionals given the partition are assumed to be the same as the prior. 
            So for the second update, we use the same conditionals? Actually, no: rigidity in the second update is relative to the state right before the second update (which is P_new1). And we assume that the conditionals with respect to the partition {Heads, Tails} are the same under P_new1 as they were under the prior? 
            But that is what rigidity says: the update only changes the probabilities of the partition elements, not the conditionals. So we have:
              P_new2(H1) = P_new2(Heads) * P_new1(H1|Heads) + P_new2(Tails) * P_new1(H1|Tails)
                         = 0.1 * (5/12) + 0.9 * (5/8)
                         = 0.1*(5/12) + 0.9*(5/8)
                         = (5/120) + (45/80) 
                         = (5/120) + (135/240) ... let's compute: 5/120=1/24≈0.0417, 45/80=9/16=0.5625 -> total ≈0.6042

       - Now reverse the order: 
          First, update to P_new1 with P_new1(Heads)=0.1: 
              P_new1(H1) = 0.1*(5/12) + 0.9*(5/8) = ... same as above: 0.6042? 
              Actually: 0.1*(5/12) + 0.9*(5/8) = 5/120 + 45/80 = 5/120 + 135/240 = 10/240 + 135/240 = 145/240 = 29/48 ≈ 0.6042
          Then update to P_new2 with P_new2(Heads)=0.9:
              P_new2(H1) = 0.9 * P_new1(H1|Heads) + 0.1 * P_new1(H1|Tails)
                          = 0.9 * (5/12) + 0.1 * (5/8)   [because rigidity: the conditionals are fixed at the prior values?]
                          = same as the first step in the first scenario: 0.9*(5/12)+0.1*(5/8)= ... which we computed as 0.4375

       - So we have:
          Order 1: 0.4375 -> 0.6042
          Order 2: 0.6042 -> 0.4375
          They are different.

     - What does this mean? The order in which we receive uncertain evidence matters. In a system that streams observations, if we use Jeffrey conditionalization, we must be aware that the result depends on the order. This is in contrast to ordinary conditionalization, which is commutative (because it's just multiplying factors).

  6. **Connection to Minimizing Relative Entropy (5 minutes)**
     - We are updating to a new distribution that satisfies the constraint P_new(E_i) = q_i (the new probabilities for the partition). Among all such distributions, Jeffrey conditionalization selects the one that minimizes the relative entropy (Kullback-Leibler divergence) with respect to the prior, subject to the constraint that the conditional probabilities P(A|E_i) are unchanged. 
     - This is a nice justification: it's the most conservative update in an information-theoretic sense.
     - But note: this equivalence holds only when the partition is fixed and we are only setting the new probabilities for that partition. 
     - If we have constraints on overlapping partitions, then we need iterative methods (like iterative proportional fitting) and there might be no closed form. But that is beyond our scope.

  7. **Contrast with Soft Evidence in Bayesian Networks (5 minutes)**
     - In Bayesian networks, one way to handle uncertain evidence is to use a likelihood ratio. For example, we might create a virtual observation that is a noisy version of E. 
     - This is equivalent to Jeffrey conditionalization when we use a specific likelihood ratio that produces the same new probability for E. 
     - However, note: in the likelihood ratio approach, we are effectively conditioning on a virtual observation. This is a different perspective but can yield the same result. 
     - We can say: 
          - The Bayesian network approach (with a virtual observation) is one way to model the uncertainty in the evidence. 
          - Jeffrey conditionalization is a direct rule for updating when we set the new probability for E. 
          - They are compatible and often equivalent. But the rigidity assumption in Jeffrey is the counterpart of the fixed likelihood ratio in the virtual evidence.

     - We don't need to go into details, but we can mention it if someone asks.

  8. **Closing Question (5 minutes)**
     - To check understanding: 
          "Suppose we have two hypotheses H1 and H2, and a partition {E, not-E}. Our prior is given. Now we have an experience that makes us set P_new(E)=0.7. How do we compute P_new(H1)?"
     - The answer should be: 
          P_new(H1) = P_new(E) * P_old(H1|E) + P_new(not-E) * P_old(H1|not-E)
                    = 0.7 * P_old(H1|E) + 0.3 * P_old(H1|not-E)

     - Why is rigidity important? Because without it, we wouldn't be able to use the old conditionals.

  9. **Potential Misconceptions and When to Address Them**
     a) **That Jeffrey conditionalization is just Bayes with a softened likelihood.**
          - When: When introducing the rule.
          - How to head off: Emphasize that rigidity is an extra assumption. We are not conditioning on a softened event; we are directly setting a new probability for E and preserving conditionals. Also, note that Bayes with a softened likelihood (via a virtual observation) might be equivalent, but that is a specific way to achieve the rigidity.

     b) **That rigidity is a consequence of the framework.**
          - When: When introducing rigidity.
          - How to head off: Stress that rigidity is an assumption we make because we believe the experience only affects the probability of E and not how E relates to other propositions. It might fail if the experience also tells us something about the conditional probabilities.

     c) **That the failure of commutativity is a bug and can be fixed.**
          - When: When discussing non-commutativity.
          - How to head off: Explain that in general, two pieces of uncertain evidence might not be independent, and the order matters. We cannot expect commutativity because the intermediate state changes the conditionals? Actually, rigidity is always with respect to the prior? No, in the rule, rigidity is with respect to the state right before the update. So in the second update, we are fixing the conditionals as they are in the state after the first update. But note: in our example, we used the same prior conditionals for both updates? Actually, that was because the rigidity assumption for the first update preserved the conditionals from the prior, and then for the second update we preserved the conditionals from the state after the first update (which were the same as the prior). But if we had two different partitions, it could be more complex. 
            However, the non-commutativity is inherent. We can point out that ordinary conditionalization is commutative because it is associative (since it's just multiplying factors). But Jeffrey updating is not.

     d) **That showing ordinary conditionalization can't handle the case means it's wrong.**
          - When: When motivating Jeffrey.
          - How to head off: Emphasize that ordinary conditionalization is for a different situation (when a proposition becomes certain). We are extending the updating rule to a new kind of evidence.

     e) **Other misconceptions:**
          - That we can use Jeffrey conditionalization with any set of constraints. We must have a partition and set probabilities for the entire partition. 
          - That the partition must be a binary partition. It can be any partition.

  10. **What to Leave Out**
      - The connection to minimizing relative entropy beyond the single partition case. 
      - Iterative proportional fitting for multiple constraints.
      - The case when rigidity fails and how to handle it.
      - The full comparison between Jeffrey and other update rules (e.g., Adams conditioning) or the debate about when rigidity is justified.

  11. **Order of Components and Dependencies**
      - Must start with the limitation of ordinary conditionalization (to motivate).
      - Then introduce the example and show that we cannot apply ordinary conditionalization (because no proposition is made certain). 
      - Then introduce rigidity as an assumption to save the update. 
      - Then derive the rule. 
      - Then show the sanity check (when one partition element becomes certain, we get ordinary conditioning). 
      - Then non-commutativity: we need the rule to see that two updates in different orders yield different results. 
      - Then briefly mention the relative entropy justification (because we have the rule and we can say "it turns out that this rule is the one that minimizes the change in information").
      - Then address the soft evidence alternative (if time, or if asked).

  12. **Switching Examples?**
      - The coin example can carry the entire session. We used it for motivation, derivation, sanity check, and non-commutativity. It is simple and avoids hidden conditioning events.

  13. **Where I Am Least Confident**
      - **Non-commutativity**: The example we used shows the math, but the audience might be puzzled as to why the conditionals are preserved from the prior even after an update. We are using the same conditionals for both updates? Actually, we are: in the first update we preserved the conditionals from the prior, and then in the second update we preserved the conditionals from the state after the first update (which are the same as the prior). But note: the conditionals are preserved by the update, so they are the same as long as we start from the same prior. 
        However, what if we had an update that changed the conditionals? But we don't: because we assume rigidity. 
        But the non-commutativity is inherent even if the conditionals are preserved? Yes, because the intermediate state has a different probability for the partition elements, so when we do a second update, the weights are applied to the same conditionals but from a different base. 
        The audience might think: "But if the conditionals are the same, why doesn't it commute?" And the answer is because the weights (the new probabilities for the partition) are applied in sequence. 
        This step might be tricky. Be prepared to show the numbers and compare the two orders.

      - Also, the connection to relative entropy: we are only mentioning it, but if someone asks for a proof, we don't have time. We might just say: "It turns out that this update minimizes the KL divergence to the prior subject to the constraint on the partition and the rigidity condition. But that's a story for another day."

      - Another point: the rigidity assumption might be challenged. What if the experience not only changes P(E) but also changes P(H|E)? We are assuming it doesn't, but what if it does? Then Jeffrey conditionalization would not be appropriate. We should mention that this is an assumption we are making.

  14. **If a Colleague Asks...**
      - If someone asks: "But why assume rigidity? Maybe the experience also tells me that the coin is more likely to be fair given that I saw heads?" 
          - Then we must clarify that rigidity is an assumption we make about the case. If the experience changes the conditionals, then we cannot use Jeffrey conditionalization. But the rule is for cases where we think the conditionals remain fixed.

      - If someone asks: "Can't we just use a Bayesian network with a virtual observation node?" 
          - We can say: "Yes, that is one way to implement the same update. The virtual observation would be set to produce the same new probability for E. And then we condition on that virtual observation. This is equivalent to Jeffrey conditionalization because it preserves the conditionals (via the fixed likelihood ratio)."

      - If someone asks: "What if we have constraints on two different partitions?" 
          - We say: "That is beyond the scope of this session. Jeffrey conditionalization as we've presented it applies to one partition at a time. For multiple constraints, we need more advanced methods and there isn't a closed form."

  Plan by Time:

  - 0-5 min: Recap and motivation (ordinary Bayes fails when evidence is uncertain).
  - 5-15 min: Coin example and why ordinary conditioning fails.
  - 15-25 min: Rigidity and derivation of the rule (with the coin example).
  - 25-35 min: Sanity check (when P_new(E)=1) and then a non-trivial update (P_new(Heads)=0.9).
  - 35-45 min: Non-commutativity (with two updates in different orders).
  - 45-50 min: Brief connection to relative entropy and mention of soft evidence (if asked).
  - 50-55 min: Closing question and wrap-up.

  This is tight, so we must be disciplined. If we run over in one part, we can shorten the non-commutativity by doing only one order and stating the result of the other.

  Final note: The example is chosen to be simple. We are using a binary partition and a binary hypothesis. This keeps the math manageable.

  Let's do it.
answer: |-
  ### Plan for 55-Minute Session on Jeffrey Conditionalization  
  **Audience:** Software engineers with Bayesian experience but no formal epistemology.  
  **Goal:** Understand *why* Jeffrey conditionalization is needed, how it works, and its commitments (rigidity, non-commutativity), without drowning in formalism.  

  ---

  #### **1. Order of Components and Dependencies**  
  **(Dependencies dictate the sequence; each step must enable the next.)**  
  1. **Limitation of Ordinary Conditionalization (5 min)**  
     - *Prerequisite:* Recap Bayes: \( P_{\text{new}}(H) = P_{\text{old}}(H \mid E) \) when \( E \) becomes certain.  
     - *Why now?* Must see why Bayes fails for uncertain evidence before generalizing.  
     - *Dependency:* Without this, Jeffrey’s rule seems arbitrary.  

  2. **Motivating Case: Evidence That Can’t Be Conditioned On (10 min)**  
     - *Prerequisite:* Introduce an example where no proposition becomes certain.  
     - *Why now?* Shows why Bayes isn’t just “inconvenient”—it’s *inapplicable*. Dependency: Rigidity can’t be introduced until we see Bayes fails.  

  3. **Rigidity as the Key Assumption (10 min)**  
     - *Prerequisite:* Define rigidity (\( P_{\text{new}}(A \mid E_i) = P_{\text{old}}(A \mid E_i) \)).  
     - *Why now?* Required to *state* Jeffrey’s rule. Without rigidity, the rule is just a formula with no justification.  

  4. **Jeffrey’s Rule and Sanity Check (10 min)**  
     - *Prerequisite:* Show \( P_{\text{new}}(A) = \sum_i P_{\text{new}}(E_i) \cdot P_{\text{old}}(A \mid E_i) \).  
     - *Why now?* Needs rigidity to make sense. Sanity check (degeneration to Bayes when \( P_{\text{new}}(E_k)=1 \)) proves consistency.  

  5. **Non-Commutativity and Streaming Implications (10 min)**  
     - *Prerequisite:* Apply two successive Jeffrey updates to the same example.  
     - *Why now?* Requires the rule to compute. Shows a real-world commitment (order matters in streaming).  

  6. **Minimalist Entropy Connection (5 min)**  
     - *Prerequisite:* State (without derivation): "Jeffrey chooses the ‘closest’ distribution to the prior that respects \( P_{\text{new}}(E_i) \)."  
     - *Why now?* Only after seeing the rule. Mention it’s closed-form for one partition but NP-hard for overlapping constraints (iterative fitting).  

  7. **Soft-Evidence Alternative (Address if Raised; 5 min reserve)**  
     - Place during rigidity or entropy. Call it "equivalent notation" (see below).  

  ---

  #### **2. The Unifying Example: Perceiving a Die Under Flickering Light**  
  **Why this example?**  
  - **Properties it has:**  
    - Uncertain evidence: You see a die under flickering light, shifting your confidence in faces (e.g., \( P_{\text{new}}(\text{face}=2) = 0.6 \)), but no face becomes certain.  
    - Hypothesis: Probability the die is weighted (H). Depends on faces.  
    - Explicit rigidity: Lighting doesn’t teach you about the die’s weight—only your perception of faces.  
  - **Properties it lacks:**  
    - No hidden event to condition on (e.g., no "the light was red" event).  
    - No entanglement: Rigidity isn’t secretly violated (unlike service alerts, which might reveal detector reliability).  
  - **Carries the whole session:**  
    - Use for motivation (no conditioning), rigidity, rule derivation, sanity check (if \( P_{\text{new}}(\text{face}=2)=1 \)), and non-commutativity (two successive perceptions).  
    - **Math simplicity:**  
      - Prior: Fair die \( P(H) = 0.5 \), \( P(\text{face}=i \mid \text{fair}) = 1/6 \).  
      - Weighted die \( P(\text{face}=2 \mid \text{weighted}) = 0.5 \) (others uniform).  
      - Update: After flicker, \( P_{\text{new}}(\text{face}=2) = 0.6 \). Compute \( P_{\text{new}}(H) \).  

  ---

  #### **3. Misconceptions to Preempt**  
  - **"This is just Bayes with softened likelihood."**  
    - *When to preempt:* During rigidity.  
    - *Response:* "Rigidity isn’t automatic—it’s an assumption that the *relationship* between E and A hasn’t changed. Bayes assumes certainty; Jeffrey assumes rigidity."  

  - **"Rigidity is a consequence, not an assumption."**  
    - *When to preempt:* Immediately after stating rigidity.  
    - *Response:* "Rigidity could fail! If the flickering light *also* taught you about the die’s weight, you couldn’t use Jeffrey. We assume it doesn’t."  

  - **"Non-commutativity is a bug to fix."**  
    - *When to preempt:* During non-commutativity demo.  
    - *Response:* "Order dependence is a feature of uncertain evidence. If you stream observations, order reflects when you learned—it’s not patchable without extra assumptions (e.g., independence)."  

  - **"Bayes is wrong if it can’t handle this."**  
    - *When to preempt:* During motivating case.  
    - *Response:* "Bayes isn’t wrong—it’s for different inputs (certain evidence). Jeffrey extends it to uncertain evidence, with new commitments."  

  - **Overlooked misconception:**  
    - **"Jeffrey generalizes Bayes, so it should supersede it."**  
      - *When to preempt:* During sanity check.  
      - *Response:* "Jeffrey *includes* Bayes as a special case when evidence becomes certain. But Bayes is simpler when applicable—don’t use a sledgehammer for a nail."  

  ---

  #### **4. What to Omit (Explicitly)**  
  - **Multiple partitions or overlapping constraints:** "With two partitions (e.g., symptoms and test results), Jeffrey has no closed form—we need iterative methods. Out of scope today."  
  - **Entropy derivation:** "Why this rule? It minimizes information change. We’ll see the intuition, but no proofs."  
  - **Rigidity failures:** "What if the experience *does* change how E relates to A? Then Jeffrey doesn’t apply. That’s advanced."  
  - **Comparison to other rules (e.g., Adams):** "Philosophy has alternatives, but today is about Jeffrey’s commitments."  

  ---

  #### **5. Handling Soft-Evidence Alternative**  
  - **If raised (likely), say:**  
    > "In Bayesian networks, you might set a fixed likelihood ratio for a virtual observation. That’s *equivalent to Jeffrey*—same rigidity assumption, same math. It’s not a different rule; it’s the same rule in observer-language."  
  - **When to address:** During rigidity (as an implementation tactic) or entropy (as a dual view).  
  - **Do not wave off:** It reinforces that Jeffrey isn’t ad hoc.  

  ---

  #### **6. Closing Question to Test Understanding**  
  > "Suppose your prior is \( P(\text{rain}) = 0.3 \). You check a blurry weather app, and come away 70% confident it shows ‘rain’ (so \( P_{\text{new}}(\text{app\_rain}) = 0.7 \)). How do you compute \( P_{\text{new}}(\text{rain}) \), and what assumption are you making about the blurry screen?"  

  **Correct answer:**  
  - \( P_{\text{new}}(\text{rain}) = 0.7 \cdot P_{\text{old}}(\text{rain} \mid \text{app\_rain}) + 0.3 \cdot P_{\text{old}}(\text{rain} \mid \text{no\_app\_rain}) \)  
  - Assumption: Rigidity (blurriness didn’t change how app predictions relate to actual rain).  

  ---

  #### **Weakest Point: Non-Commutativity**  
  - **Why risky:** Engineers expect order independence (like Bayes). The math is clear, but the *implication*—that temporal order of uncertain evidence matters—feels counterintuitive.  
  - **Likely challenge:** "But in my tracker, I process observations in batches. Can’t I sort them?"  
    - *Response:* "Sorting assumes evidence is independent of order. Jeffrey doesn’t—each update changes your state, affecting the next. If order matters in reality (e.g., seeing faces then flicker vs. flicker then faces), Jeffrey respects that."  
  - **Contested?** Not in math, but in epistemology: Some argue order dependence is a flaw (see van Fraassen’s "washing out" critique). *Flag as unsettled* if pressed.  
  - **Mitigation:** Use the die example with two perception shifts (e.g., dim light then flicker vs. flicker then dim light). Show numeric divergence.  

  ---

  ### Timing Summary  
  - **0–5 min:** Bayes recap + limitation (whiteboard: Bayes equation → "what if no certainty?").  
  - **5–15 min:** Die example + why Bayes fails (whiteboard: prior, flicker shifts \( P(\text{face}=2) \) to 0.6).  
  - **15–25 min:** Rigidity + rule derivation (whiteboard: \( P_{\text{new}}(H) = \sum \ldots \)).  
  - **25–35 min:** Sanity check (set \( P_{\text{new}}(\text{face}=2)=1 \)) + non-trivial update.  
  - **35–45 min:** Non-commutativity with two updates (whiteboard: order A → B vs. B → A).  
  - **45–50 min:** Entropy intuition ("closest distribution") + soft-evidence equivalence (if asked).  
  - **50–55 min:** Closing question + wrap-up.  

  **Stick to one example.** Shift only if rigidity is challenged (e.g., "Could flicker teach about the die?"), but this is a feature—it shows rigidity is substantive.
