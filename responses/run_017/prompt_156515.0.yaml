  We are building a rule to rank budget options that involve trade-offs between gains for one person and losses for others. The inputs are observed choice behavior, self-reported intensity, and clinician judgment. The ranking must be defensible in plain language. We need desiderata for a theory of interpersonal comparison that can handle this.

  Key challenges include:
  1. Adaptation: A person who has adapted to their condition and reports being content with very little.
  2. Incentive to Inflate: A person who has an incentive to report high intensity of preference.
  3. Temporal Comparisons: Comparing a future version of a person after a big change (e.g., prevention now vs. treatment later).
  4. Non-omniscience: The decision-maker is not all-knowing.

  We also note that utilities are only defined up to positive affine transformations (i.e., they are interval scales). This might conflict with giving priority to the worse off.

  We are to produce a table of desiderata, each with:
  - Requirement: one sentence
  - Motivating_case: one or two sentences, concrete
  - Status: non-negotiable, negotiable, or camp preference
  - Rules_out: a few words (what kind of theories or approaches this requirement rules out)

  Then, a JSON object with:
  - conflicting_pair: two desiderata that can't both hold and why
  - weakest_link: the one to drop first and what dropping it costs
  - minimum_information: the weakest input (ordinal and non-comparable, level comparable, unit comparable, or fully comparable) that the job forces, with reason
  - open_question: the one desideratum we are least sure about

  Let's list the desiderata:

  1. **Handles Adaptation (Content with Less):** The rule must not disadvantage individuals who have adapted to their circumstances and report low levels of dissatisfaction, even if their objective condition is severe.
     - Motivating Case: A person with a severe disability who has adapted and reports being content, compared to someone with a less severe condition who reports high distress. Without accounting for adaptation, the adapted person might be allocated fewer resources.
     - Status: Non-negotiable (because otherwise we might systematically under-allocate to the disabled, which is ethically problematic and hard to defend)
     - Rules out: Theories that rely solely on self-reported well-being without adjustment.

  2. **Robust to Strategic Reporting:** The rule must not be easily manipulated by individuals who have incentives to overstate the intensity of their preferences.
     - Motivating Case: A patient who knows that reporting extreme pain might get them prioritized for a hip replacement, leading to potential misallocation if others understate.
     - Status: Non-negotiable (because without this, the system is vulnerable to gaming)
     - Rules out: Approaches that rely solely on self-reported intensity without any external validation.

  3. **Temporal Consistency:** The rule must allow for comparisons involving the same person at different times, especially when the person undergoes a significant change (e.g., due to treatment or prevention).
     - Motivating Case: Prevention now (which benefits a future healthy self) vs. treatment later (which benefits a future sick self). How do we compare the utility of the same person in two different states?
     - Status: Non-negotiable (because prevention vs. treatment is a common trade-off)
     - Rules out: Theories that do not allow for interpersonal comparisons over time for the same individual (which is a prerequisite for intertemporal choices).

  4. **Non-Omniscience Acknowledged:** The rule must work with imperfect information (observed choices, self-reports, clinician judgments) and not require perfect knowledge of utilities.
     - Motivating Case: We don't have utility meters; we only have the stated inputs. The rule must be operational with these.
     - Status: Non-negotiable (because we explicitly lack perfect information)
     - Rules out: Theories that require cardinal utility with known zero and unit.

  5. **Defensibility in Plain Language:** The rule must be explainable in plain language to those who lose out, without resorting to technicalities about normalization or scaling.
     - Motivating Case: When a patient is denied a hip replacement because resources went to dialysis for four others, the explanation must be understandable and acceptable.
     - Status: Non-negotiable (explicit requirement)
     - Rules out: Complex aggregation rules that depend on arbitrary normalizations (e.g., some forms of utilitarianism that require comparing utility differences across individuals without a clear basis).

  6. **Priority to the Worse Off:** The rule should give some priority to individuals who are worse off, even if the total benefit might be larger by helping the better off.
     - Motivating Case: A hip replacement for a severely disabled person vs. home dialysis for four moderately affected patients. Even if the total gain from the latter is larger, the severity of the former might demand priority.
     - Status: Camp preference (this is a value judgment; some might argue for strict utilitarianism, others for prioritarianism)
     - Rules out: Strict utilitarianism (which only sums utilities and ignores distribution).

  7. **Invariance to Affine Transformations:** The rule must be invariant to the choice of scale for each individual's utility (i.e., it must not depend on the arbitrary zero and unit of each person's utility function).
     - Motivating Case: Since utilities are only defined up to positive affine transformations (from observed choice behavior), the rule must not change if we change the scale for any individual.
     - Status: Non-negotiable (a technical requirement from decision theory)
     - Rules out: Any rule that requires comparing absolute levels or differences without a common scale (e.g., naive summation of utilities without normalization).

  Now, note the conflict: 
  - Invariance to affine transformations (7) requires that we cannot compare absolute levels (only ratios of differences or relative differences are not preserved). 
  - But giving priority to the worse off (6) requires comparing absolute levels (to know who is worse off). 
  - Also, handling adaptation (1) might require knowing absolute levels (to see that the disabled person is worse off even if they report being content).

  Therefore, (6) and (7) conflict. Also, (1) and (7) might conflict.

  Moreover, (1), (6), and (7) together might be impossible.

