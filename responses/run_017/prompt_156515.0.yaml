answer: |-
  ### Desiderata for Interpersonal Comparison in Health Resource Allocation

  | Requirement | Motivating Case | Status | Rules Out |
  |-------------|-----------------|--------|-----------|
  | **Adaptation adjustment**: Must recognize that reported contentment does not negate objective severity when individuals adapt to poor health. | A paraplegic patient reports high life satisfaction due to adaptation; without correction, policies could deprioritize them despite severe disability. | Non-negotiable | Rules relying solely on self-reported well-being (e.g., naive hedonistic utilitarianism). |
  | **Strategy-proofness**: Must resist manipulation by individuals incentivized to exaggerate their suffering or needs. | A patient overstates pain intensity to secure a hip replacement, risking misallocation from truly urgent cases. | Non-negotiable | Rules using unverified self-reports (e.g., unadjusted willingness-to-pay). |
  | **Temporal commensurability**: Must compare utilities of the same person pre/post transformative interventions (e.g., prevention vs. treatment). | Investing in smoking cessation (healthy future self) vs. lung cancer treatment (sick future self); requires consistent valuation across personal states. | Non-negotiable | Theories rejecting interpersonal utility comparisons (e.g., strict ordinalism). |
  | **Epistemic humility**: Must function without omniscience, using only observed choices, self-reports, and clinician inputs. | Clinicians misjudge pain severity; choices are context-dependent; rule must still yield defensible rankings. | Non-negotiable | Rules requiring perfect utility data (e.g., idealized social welfare functions). |
  | **Plain-language defensibility**: Must justify rankings without appeals to arbitrary scaling or technicalities. | Denying a patient’s hip replacement to fund dialysis for four others requires an intuitive, fairness-based rationale. | Non-negotiable | Complex aggregation rules (e.g., Harsanyi’s utilitarianism with normalization). |
  | **Priority to the worse off**: Must assign greater weight to gains for those in absolute deprivation. | Choosing between a terminally ill patient’s palliative care vs. non-urgent physiotherapy for five others; severity demands prioritization. | Camp preference | Strict summation rules (e.g., Benthamite utilitarianism). |
  | **Scale invariance**: Must be unaffected by rescalings of individual utility functions (per affine uniqueness). | Doubling one patient’s reported utility scale must not alter resource rankings. | Non-negotiable | Rules needing absolute utility levels (e.g., "zero-comparable" prioritarianism). |

  ```json
  {
    "conflicting_pair": {
      "desideratum1": "Priority to the worse off",
      "desideratum2": "Scale invariance",
      "reason": "Priority to the worse off requires absolute utility comparisons to identify deprivation, but scale invariance permits arbitrary rescaling of individual utilities, making absolute levels incomparable. Clinician inputs mitigate but do not fully resolve this if utilities are derived from choice behavior."
    },
    "weakest_link": {
      "desideratum": "Priority to the worse off",
      "reason_to_drop": "As a camp preference (e.g., prioritarianism vs. utilitarianism), it is less universally mandated than epistemic or fairness constraints.",
      "cost": "Dropping weakens equity guarantees; losses to the severely deprived may be harder to justify."
    },
    "minimum_information": {
      "level": "Unit comparable",
      "reason": "Trading gains/losses across people (e.g., hip replacement vs. dialysis) requires comparing utility differences, but not absolute levels. Adaptation and clinician inputs allow approximating unit comparability without full cardinality."
    },
    "open_question": {
      "desideratum": "Temporal commensurability",
      "reason": "Unclear if a unified theory can coherently treat future selves as distinct 'persons' for comparison while satisfying other desiderata (e.g., defensibility)."
    }
  }
  ```

  ### Key Notes:
  - **Conflict**: Priority to the worse off clashes with scale invariance (as you predicted). Arrow-style impossibility emerges if utilities are only ordinal and non-comparable, but clinician inputs provide anchors for unit comparability.
  - **Minimum Information**: Unit comparability suffices for trade-offs but not absolute deprivation judgments. Clinician inputs bridge this gap.
  - **Weakest Link**: Priority to the worse off is ethically salient but negotiable; dropping it enables scale-invariant rules (e.g., QALY aggregation).
  - **Open Question**: Temporal commensurability risks overextension—treating future selves as separate agents may conflict with plain-language defensibility.
