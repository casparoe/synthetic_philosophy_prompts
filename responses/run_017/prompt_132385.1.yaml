  We are drafting a joint statement on the continuum hypothesis (CH) for a reader with one graduate logic course. We define technical terms and structure the document as requested.

  1. Agreed Claims (numbered 1-8 or so, both sign):

    1. The standard axioms of set theory (ZFC) are consistent with both CH and its negation. This independence was proven by Gödel (using inner models) and Cohen (using forcing). An inner model is a subclass of a model of set theory that satisfies the axioms and contains all the ordinals; Gödel's inner model L satisfies CH. Forcing is a technique for extending a model of set theory to a larger one; Cohen used it to build a model of ZFC in which CH fails.

    2. These independence results show that CH is not settled by ZFC. They do not, by themselves, establish that CH has no determinate truth value; that is a further philosophical claim.

    3. Large cardinal axioms, which assert the existence of very large infinite sets (such as measurable cardinals or beyond), are widely accepted extensions of ZFC. These axioms are consistent with both CH and its negation, so the independence of CH is not due to ZFC being unusually weak.

    4. Forcing extensions and inner models are legitimate mathematical constructions. Both techniques are fundamental to modern set theory and yield valuable insights. Neither of us disputes the mathematical correctness or legitimacy of the other's preferred methods.

    5. Most of ordinary mathematics—including arithmetic, analysis, algebra, and topology—is insensitive to the truth value of CH. For instance, questions about the real numbers that are expressible in the language of analysis (such as continuity or differentiability) are typically absolute, meaning their truth is the same in all models of set theory. Absoluteness is a property of a statement if its truth value does not change when passing between models via forcing or inner models.

    6. The continuum problem—the question of how many real numbers there are—is a meaningful mathematical question in the sense that it is precisely definable in the language of set theory. However, the independence results raise the question of whether it has a definite answer.

    7. Justifying a new axiom (e.g., by its consequences) is different from proving it from existing axioms. A new axiom might be justified by its fruitfulness, its naturalness, or its ability to settle undecided questions, but such justification is not a proof and may be subject to debate.

    8. The search for new axioms to settle CH is a legitimate and ongoing project. The outcome of this project is not predetermined, and both the possibility of success and the possibility of permanent indeterminacy are open.

  2. Disagreements Table (columns: Issue, Her View, My View, Mathematical Practice Difference):

    We present our disagreements neutrally, without adjudicating. We mark verbal/substantive and note if neutral formulation is hard.

    | Issue | Her View | My View | Difference in Mathematical Practice |
    |-------|----------|---------|-----------------------------------|
    | **The universe of sets** | "The universe of sets" refers to a single, unique cumulative hierarchy. | "The universe of sets" is a context-dependent concept; different forcing extensions are equally legitimate. | If she is right, set theory aims to describe one true universe; if I am right, set theory studies a multiverse of models. |
    | **Determinacy of the powerset operation** | The powerset operation is determinate: given a set, its subsets are fixed and the powerset is absolute. | The powerset operation is indeterminate: what counts as a subset depends on the model, and forcing changes the powerset. | If she is right, CH has a fixed truth value; if I am right, CH has no fixed truth value and may be settled by convention. |
    | **Meaningfulness of CH** | CH is a meaningful and determinate question about the unique universe of sets. | CH is not a determinate question; it is analogous to asking for the number of points on a line without specifying a geometry. | If she is right, set theory should seek the correct answer; if I am right, set theory may explore consistent alternatives without a unique answer. |
    | **Good reason for new axioms** | New axioms are justified if they are true in the unique universe, especially if they are intrinsic (e.g., by maximizing the universe's structure) and lead to a canonical model. | New axioms are justified by extrinsic criteria (e.g., fruitfulness, resolving problems) and need not be uniquely true; they can be adopted for specific purposes. | If she is right, axioms are assessed by truth; if I am right, axioms are assessed by utility and coherence. |
    | **End of debate** | The debate would be over if a new axiom settling CH were accepted as evident by the set-theoretic community, akin to large cardinals. | The debate would be over if set theory developed a stable framework that accommodated both CH and ¬CH as options, with no prospect of unique resolution. | If she is right, consensus on a new axiom would settle CH; if I am right, the debate ends when we stop expecting a unique answer. |

    We note: The first two issues (universe and powerset) are substantive; they lead to different mathematical programs. The issue of meaningfulness is also substantive. The last two (reasons and end) may have verbal aspects (e.g., what counts as "good reason" or "over") but are largely substantive because they guide research.

  3. Cruxes:

    We present three sub-questions. For each, we give a test and our predictions.

    **Crux 1: The Census**
      - Test: Set theorists develop a canonical way to survey all forcing extensions of a given universe (counting equivalent ones once) and a well-motivated notion of "almost all". They run the Census and report:
          Version A: Almost all satisfy ¬CH.
          Version B: Almost all satisfy CH.
          Version C: The Census gives no determinate answer (e.g., CH and ¬CH each hold in a non-negligible set of extensions).

      - Her Response:
          A: She would view this as evidence against CH being true in the unique universe, but not decisive because the Census might not capture the true universe. She might question the notion of "almost all" as not reflecting truth.
          B: She would see this as consistent with CH being true, but again not decisive because the true universe might not be captured by a generic survey.
          C: She would say this does not bear on the truth of CH in the unique universe.

      - My Response:
          A: I would take this as strong evidence that CH is not true in the typical model, and that the universe is indeterminate. It would support the view that ¬CH is the generic case.
          B: I would take this as strong evidence for CH being the typical case, but might question the setup if it contradicts the current understanding that forcing can produce both.
          C: I would see this as evidence that the continuum is inherently indeterminate.

      - Note: For her, the Census does not directly address the truth in the unique universe; for me, it reflects the multiverse.

    **Crux 2: The Parallel Community**
      - Test: We encounter a mathematical culture that developed set theory with an indeterminate powerset operator. They prove the same theorems in arithmetic, analysis, and algebra as we do. They treat "how many reals are there?" as ill-posed, and find our dispute unintelligible.

      - What we expect before the encounter:
          Both: We expect their mathematics to be largely the same in absolute domains (e.g., they have real numbers, functions, derivatives, etc.). They might avoid non-absolute questions or use parameters to specify models.

      - Her Response: She would see this as evidence of a different convention, not that our question is defective. She would say they are missing the true concept of set, which includes a determinate powerset.

      - My Response: I would see this as evidence that the question is defective. They have a consistent and successful mathematics without a determinate powerset.

    **Crux 3: Guiding Heuristics (Minimal vs. Maximal)**
      - Test: Are the two heuristics (preferring a minimal, well-ordered universe vs. a maximal, wide universe) competing, orthogonal, or two descriptions of one aim?
          Test Case 1: It is shown that the heuristics cannot be pushed to their natural limits together (e.g., no model can be both minimal in height and maximal in width while satisfying large cardinals and leaving CH open).
          Test Case 2: It is shown that they can always be jointly satisfied (e.g., for any large cardinal axiom, there is a model that is both minimal and maximal in the relevant senses and in which CH remains open).

      - Her Prediction: 
          Case 1: She would say that the conflict shows we must choose, and she would choose minimality (like L) but enriched with large cardinals, leading to CH being true.
          Case 2: She would be surprised but might still prefer the minimal one as canonical.

      - My Prediction:
          Case 1: I would say this shows the heuristics are competing and we must balance them, but neither is uniquely correct. We might adopt different axioms for different purposes.
          Case 2: I would say this supports the view that the heuristics are orthogonal and that the continuum can be indeterminate.

      - What it would show: For her, if they conflict, the minimal one is prior; for me, it shows we have options.

  4. Closing: What is not in dispute:

    - The truth of the standard axioms (ZFC) is not at issue; both agree they are true.
    - Assuming CH or its negation as a convenient hypothesis for mathematical work is legitimate and common.
    - Neither of us claims the other's mathematics is incorrect; the dispute is about the interpretation of the independence results and the nature of the set-theoretic universe.

