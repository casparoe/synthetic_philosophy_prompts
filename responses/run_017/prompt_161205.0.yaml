answer: |-
  ### The Stone Questions  

  This vaulted nave, repurposed for the page,  
  Holds shelves where saints once stood in painted rows.  
  *What is this part made to do?* we ask. Engage  

  The arch that frames the study carrel’s stage—  
  Its curve was traced for hymns, not student prose.  
  This vaulted nave, repurposed for the page,  

  Shows joists cut short where later builders gauge  
  New loads against old stone. The plaster shows  
  *Just where two pressures met and held*—no sage  

  Demands a hymn from every joint and brace.  
  That ledge? A scaffold’s ghost the plaster knows.  
  This vaulted nave, repurposed for the page,  

  Makes desks from pulpits, light from windows faced  
  For dawn processions. Still, the uneven floor bestows  
  *Just where two pressures met and held*—a trace  

  Of buttress roots that bound an older base.  
  See here: this stub of wall the new stack grows  
  Upon was never shaped for book or case—  
  *Just where two pressures met and held* its place.  
  Now columns, strained, confess what no one chose:  
  This vaulted nave, repurposed for the page,  
  *What is this part made to do?* It bears the weight of prose  
  *Just where two pressures met and held*, and holds the archive’s age.  

  ---

  ### Notes on the Choices  

  **Refrains:**  
  - **A1 ("What is this part made to do?")** embodies the adaptationist’s functionalist inquiry, demanding a teleological account. Its brevity and interrogative edge convey methodological insistence.  
  - **A2 ("Just where two pressures met and held")** adopts the anatomist’s/architect’s register: passive voice, geological metaphor, and focus on structural contingency. It answers A1’s demand by negating its premise for certain features.  

  **Building Features (Church-to-Library):**  
  1. **Built for current function:** Repointed *windows* facing east for reading light (originally liturgical).  
  2. **Co-opted function:** *Pulpit* converted to issue desk (new purpose, old structure).  
  3. **Purely residual:** *Uneven floor slabs* from demolished buttress footings—byproducts of joining nave to transept.  

  **Load-Bearing Leftover:**  
  The "stub of wall" (line 15) began as a residual foundation fragment where Norman and Gothic masonry met ("two pressures"). Later renovations made it integral to supporting the "new stack" (book storage). It now answers A1 (bears weight) while owing its origin to A2’s constraint-collision—illustrating Gould-Lewontin’s "exaptation" without naming it.  

  **Argumentative Work:**  
  The final quatrain resolves the refrains not as oppositional but complementary: A1 queries current utility, A2 historical origin. The vault’s conversion ("bears the weight of prose") shows how a byproduct can become indispensable without retroactive design—countering both adaptationist just-so stories and any suggestion that critics dismiss adaptation *tout court*. The building’s layered history prevents conflation of co-option (pulpit-desk) and byproduct (floor slabs).
