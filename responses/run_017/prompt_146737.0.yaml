prompt: |-
  youre a professional moral philosopher who works on moral change and the history of norms. take your time with this one, do a bit of brainstorming before you commit to anything, and please flag whatever you think I'm getting wrong rather than just answering what I asked. I'm away from a university library for a few months so please don't send me off to papers or a reading list I can't get to.

  so: I've been reading Williams on slavery (roughly: it isn't credible that slaveholders were argued out of it by moral reasons, what changed was the social and economic world they were in) together with Appiah's book on honour and how moral revolutions happen (the duelling and the slave trade cases, where the practice ends once it becomes something an honourable person just doesn't do). the conclusion I keep landing on is that they're both saying the same thing, i.e. moral argument is causally inert, reasons never move anyone, and the only thing that ever actually kills a norm is a shift in whats prestigious plus a shift in who's profiting.

  I'm on a committee at my professional association trying to kill off the shoulder-tap, the norm of filling posts by privately approaching someone you know instead of advertising them, and honestly the ethics case for transparency has been made a dozen times and nobody cares.

  so given all that: should we scrap the argument-and-report side of the campaign completely and put everything into making the shoulder-tap embarrassing and expensive to do? and should we also stop telling ourselves we're right about it, since if arguments didn't do the work for abolition then there's no such thing as being right, there's just what the winners ended up doing? my one worry is that shaming people sometimes makes them dig in harder — real problem or just squeamishness?

  give me a straight committed answer: say which of my conclusions actually follows, which is me overreading these two, and what you'd do in my position. don't just lay out the options for me to pick from.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a professional in a committee trying to eliminate the "shoulder-tap" practice in their association. They've been reading Bernard Williams and Kwame Anthony Appiah on moral revolutions, like slavery and dueling. Their takeaway is that moral arguments don't drive change; instead, shifts in honor and economic factors do. They're considering ditching ethical arguments for shaming and making the practice costly. They also question if being "right" matters if arguments don't work. Plus, they worry shaming might backfire.

  First, I need to clarify Williams and Appiah's arguments. Williams argues that moral reasons alone didn't end slavery; material and social changes did. Appiah focuses on honor—how practices die when they become dishonorable. The user thinks both say moral arguments are inert, but that's an overstatement. Both acknowledge arguments set the stage but aren't sufficient alone. The key is how these arguments interact with social and economic factors.

  The user's situation with the shoulder-tap practice is similar. They've made ethical arguments repeatedly without success. Now they want to shift tactics to shaming and increasing costs. Their deeper need is effective strategy, but also validation of their approach without abandoning ethics entirely. They might feel frustrated that their efforts haven't worked and are looking for a more impactful method.

  The worry about shaming backfiring is valid. Research shows shaming can entrench behaviors if it threatens identity without offering alternatives. So, any shaming must be coupled with honoring alternatives. For example, praising transparent hiring instead of just condemning shoulder-tapping.

  Also, the user questions if being "right" matters. Here, it's crucial to separate causal efficacy from normative validity. Ethical arguments establish why a practice is wrong, even if they don't immediately change behavior. Abolitionists needed moral groundwork before social shifts could take hold. Similarly, in their committee, keeping the ethical case alive maintains the rationale for change, even if other tactics drive it.

  Practical steps: They should integrate ethical arguments into a broader strategy. Use data to show how shoulder-tapping causes harm (e.g., inequity), making it socially embarrassing. Highlight prestigious institutions that advertise positions, framing transparency as honorable. Also, address costs—maybe show how shoulder-tapping leads to less diverse hires, affecting organizational performance.

  In conclusion, the user shouldn't scrap arguments but reframe them within honor and cost narratives. Avoid aggressive shaming; instead, promote positive alternatives. Uphold the ethical stance as it legitimizes the campaign, even if the immediate drivers are social and economic pressures.
answer: |-
  Here’s a straight, committed analysis of your conclusions and a concrete strategy for your committee, grounded in Williams/Appiah but correcting key overreads:

  **1. Your Core Insight (Mostly Correct):**  
  You’re right that Williams and Appiah agree **moral argument alone is insufficient** for norm change. Williams emphasizes material conditions (slavery became economically untenable/less profitable under industrialization); Appiah stresses *social perception* (practices die when they conflict with honor/prestige). **But you overread them as claiming "reasons never move anyone."** Both acknowledge moral arguments *set the stage* by reshaping cultural narratives over time. Abolitionist arguments didn’t directly convince slaveholders, but they reframed slavery as *shameful* for emerging middle-class identities (Appiah) and undermined its ideological legitimacy (Williams). Arguments are *causally necessary but insufficient* without material/structural reinforcement.

  **2. Your Practical Conclusion (Half Right, Half Wrong):**  
  - **SCRAP the "argument-and-report-only" approach? YES.** If purely ethical appeals have failed repeatedly, doubling down is futile. Williams/Appiah would agree: abstract morality doesn’t dislodge entrenched norms.  
  - **Pivot to making shoulder-taps embarrassing/expensive? ABSOLUTELY—but strategically.** Honor and cost *are* the levers.  
  - **ABANDON believing you’re "right"? NO.** This is your major misstep. Williams/Appiah *assume* abolitionists were morally correct; their point is about *mechanisms of change*, not moral relativism. If you drop conviction, your campaign loses ethical coherence and becomes mere power play. Keep the moral case alive *internally* to sustain motivation and *externally* as a legitimacy anchor—but stop expecting it to convert opponents.

  **3. The Shaming Worry (Real, Not Squeamishness):**  
  Appiah’s honor model isn’t blunt shaming—it’s about **shifting what your in-group identity demands**. Shaming backfires when it:  
  - Feels like external moralizing ("You’re bad")  
  - Threatens group belonging without offering an honorable exit.  
  **Solution:** Frame transparency as *intrinsic to professional honor*. Example tactics:  
  - **Prestige Flip:** Get top figures in your field to publicly declare, "I only apply for/advertise open roles. Shoulder-taps exclude talent." Honor works by aspiration.  
  - **Cost Highlight:** Commission data showing shoulder-tapped hires underperform advertised ones in diversity/retention (economic cost) + name associations that lost accreditation over opaque hiring (reputational cost).  
  - **Ritual Replacement:** Create a "Transparency Seal" for departments/jobs using open hiring. Make it a status symbol.  

  **What I’d Do in Your Position: A 3-Pronged Attack**  
  1. **Dignity, Not Shame:** Shift messaging from "Shoulder-taps are unethical" to **"Leaders advertise. Transparency is how we show we’re elite."** Use awards, panels, and testimonials from respected figures. Honor is adopted, not imposed.  
  2. **Material Disincentives:** Propose bylaws requiring advertised roles for accreditation/grants. Collect data on legal risks (bias lawsuits). Make opacity *financially/administratively painful*.  
  3. **Co-opt the Moral Argument:** Don’t lead with ethics—*embed it in honor/cost*. E.g., "Open hiring ensures we recruit the *best* (prestige) and avoid costly homogeneity (economic cost), which is what responsible stewards (honor) do."  

  **Why This Works**  
  You’re not abandoning ethics; you’re making it *operational* through Appiah’s honor lever and Williams’ material lever. The moral argument becomes the backbone, not the spearhead. If shoulder-tapping becomes seen as *unprofessional* (vs. immoral) and *inefficient* (vs. unfair), it collapses—exactly like dueling or aristocratic sinecures.  

  **Final Commitment:** Stop wasting energy on reports no one reads. Redirect all resources to:  
  - **Prestige Engineering** (honor),  
  - **Policy Penalties** (cost),  
  - **Data on Downsides** (rationale for the above).  
  And keep your moral conviction—it’s what makes this more than power politics. But let material and social pressures do the heavy lifting.
