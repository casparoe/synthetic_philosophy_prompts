prompt: |-
  I'm a journalist — I write a column on science and ideas — and right now I'm doing a piece on the boom in "know your risk" medicine: full-body MRIs for people with no symptoms, polygenic risk scores, whole-genome sequencing you buy online. Half the piece is about why people say yes and half is about the people who say no thanks, and I keep going in cirlces on whether there's anything rationally wrong with that second group.

  A decision-science guy whose newsletter I half-trust told me the thing to read up on is Good's theorem, and he summarized it for me like this:

  "Good proved that information can never make a rational agent worse off. Take any decision problem: the expected utility of choosing after you've seen the evidence is always at least as high as the expected utility of choosing now, and it's strictly higher whenever the evidence would change your mind about something. So a rational agent should always want more information, and the bigger the decision, the more it should be willing to pay for it. That's why any AI built to maximize expected utility will hoover up every scrap of data it can reach, and also why 'I'd rather not know' is never rational when the stakes are real."

  I want to use this, but I don't want to print something a decision theorist would laugh at. Can you go through it more or less sentence by sentence — what someone who actually works on this would grant, what they'd wince at, and what's just wrong? And for the parts that are wrong, tell me whether they're wrong in a way that matters for my story or in a way that's just sloppy phrasing.

  Three things I'm suspicious of, in case I'm right for the wrong reasons. One: the "strictly higher whenever it changes your mind" bit feels off to me — I have a feeling the value can be exactly zero even when the information moves your credences a lot, if it doesn't change what you'd do. Two: the AI claim. Isn't the theorem a claim about an agent that updates by Bayes and then re-picks the action that maximizes expected utility? If so, does it say anything at all about a system with a fixed policy, or a proxy objective, or a compute budget, or that's been told to just answer now? Three, and this is the one I really can't check: a philosopher friend muttered at me that the whole thing is a result about expected-utility agents specifically, and that for agents who aren't Bayesian — ambiguity-averse, dynamically inconsistent, whatever he meant — information can actually have negative value. Is that a real caveat or was he just showing off at a party?

  And then the question I actually need for the piece: does this theorem give me any purchase at all on declining a screening test? My instinct is that it's nearly silent — that it's a claim about the instrumental value of information inside a decision problem, and that "I'd rather not know" isn't obviously about that — but i'd like to know exactly where the silence starts. If you can, give me one sentence about the theorem I could safely print in a newspaper, and one tempting claim I should cut. Please don't just point me at the literature — I want the shape of the argument, not a reading list.
reasoning: |-
  Okay, the user is a journalist writing about "know your risk" medicine and wants to understand Good's theorem. They have a summary from a decision-science guy but are skeptical about parts of it. They need a breakdown of what's accurate, what's problematic, and how it applies to people declining screening tests.

  First, I need to parse the original summary. The key points are: information never makes a rational agent worse off, expected utility is always at least as high after seeing evidence, strictly higher when evidence changes your mind. Then there's the AI claim and the "never rational" part.

  The user has three main concerns. First, whether the value can be zero if information doesn't change actions. That's correct—Good's theorem allows for zero value when information doesn't alter the decision. The summary says "strictly higher whenever it changes your mind," which is true only if it changes the action. If beliefs shift but the best action stays the same, value is zero.

  Second, the AI claim. Good's theorem assumes an ideal Bayesian agent. Real AI systems have constraints like compute limits or proxy objectives, so they might not seek more data. The summary oversimplifies by implying all AIs would hoover up data.

  Third, non-Bayesian agents. The philosopher friend is right. Agents with ambiguity aversion or dynamic inconsistency might find information harmful. For example, knowing a risk might cause anxiety, leading to worse decisions. So the theorem doesn't apply universally.

  For the article, the user needs to know if the theorem supports declining screening. The theorem assumes information is free and only has instrumental value. But in real life, there are costs: financial, psychological, opportunity costs. Also, if the info doesn't change actions, no benefit. Plus, people might value peace of mind, which isn't captured in expected utility.

  The user should avoid saying information is always beneficial. Instead, emphasize that the theorem applies under strict assumptions, and real-world factors like costs or emotional impacts justify declining tests. Highlight that rational choice depends on context beyond the theorem's scope.

  Also, the AI point is misleading. Real AIs don't behave like ideal agents. Philosophical caveats are valid—ambiguity-averse agents might avoid information. These points matter for the story as they show why people might decline tests rationally.

  Safe sentence: "A foundational result in decision theory shows that for an idealized rational agent who updates beliefs correctly and acts to maximize expected benefit, new information never reduces decision quality on average." Cut the claim that declining info is never rational when stakes are high.

  Overall, the theorem provides limited purchase on declining screening because real decisions involve costs and non-instrumental values. The silence starts when considering non-Bayesian agents, psychological costs, and situations where information doesn't change actions.
answer: |-
  Here's a breakdown of Good's theorem (formally, the **Value of Information** theorem) applied to your context, dissecting the provided summary and your concerns. I'll flag what holds, what's problematic, and what's flat-out wrong, focusing on relevance to your piece.

  ### Sentence-by-Sentence Breakdown

  1.  **"Good proved that information can never make a rational agent worse off."**
      *   **Grant:** This is the core intuition *under strict assumptions*. "Worse off" means strictly lower *expected utility* within the *defined* decision problem.
      *   **Wince:** "Never" is absolute. This assumes:
          *   The agent is perfectly Bayesian (updates beliefs via Bayes' rule).
          *   The agent perfectly maximizes expected utility *after* receiving the information.
          *   There are *no costs* to acquiring or processing the information.
          *   The information is *only* about states relevant to the *existing* decision problem.
      *   **Wrong?** No, but **crucially incomplete for real life**. The theorem assumes information is *free* and *instrumental only*. In reality, information often has costs (financial, time, psychological, opportunity cost) and can create *new* problems/decisions not in the original model. This matters hugely for your story.

  2.  **"Take any decision problem: the expected utility of choosing after you've seen the evidence is always at least as high as the expected utility of choosing now..."**
      *   **Grant:** Yes. This is the mathematical core. Formally: E[ max_a EU(a | X) ] >= max_a E[ EU(a) ] (where X is the random variable representing the information). The left side is the expected utility of the *optimal policy* that waits for X. The right side is the expected utility of the *best action you'd choose now* without seeing X.
      *   **Wince:** "Always" again depends on the strict Bayesian/expected utility assumptions. It also assumes the information is correctly modeled within the problem.

  3.  **"...and it's strictly higher whenever the evidence would change your mind about something."**
      *   **Partially Grant/Wince:** This is where your first suspicion is **correct**. The value is strictly positive *if and only if* the information has the *potential* to change the *optimal action* in some possible realizations. Information can drastically shift beliefs ("change your mind about something") *without* changing the optimal action (e.g., confirming the best choice was already obvious). In that case, the value is exactly zero. The summary phrase "change your mind about something" is vague and misleading; it should be "change the optimal action you would take". **This phrasing error matters** – it overstates the benefit.

  4.  **"So a rational agent should always want more information..."**
      *   **Grant:** Under the strict assumptions (free, instrumental, Bayesian), yes, non-negative value implies wanting it.
      *   **Wince/Problematic:** "Always want" ignores **costs**. The theorem says the information has *non-negative expected instrumental value*. If it costs $10,000 and the expected instrumental value is $5, the rational agent *shouldn't* want it. This is the **primary reason the theorem gives little purchase against declining screening tests**. The "cost" includes money, time, anxiety, false positives leading to invasive procedures, discovering untreatable conditions causing distress, etc.

  5.  **"...and the bigger the decision, the more it should be willing to pay for it."**
      *   **Grant:** Intuitively true *if* the information is relevant. Higher stakes generally mean the *potential* value of better decisions is larger, justifying higher costs.
      *   **Wince:** "Should be willing" depends entirely on the *expected value* exceeding the cost. For a huge decision, if the information is noisy or unlikely to change the action, its expected value might still be low. "Bigger decision" correlates with potential value but doesn't guarantee high value for *this specific information*.

  6.  **"That's why any AI built to maximize expected utility will hoover up every scrap of data it can reach..."**
      *   **Mostly Wrong / Oversimplified:** Your second suspicion is **spot on**. This confuses the *ideal* with the *real*.
          *   **Ideal:** A *true* expected utility maximizer with *unlimited computation* and *no other constraints* might seek relevant information up to the point where cost > expected value.
          *   **Real:** Real AI/agents have:
              *   **Computational Costs/Bounded Rationality:** Processing data costs time/energy. Gathering data might delay action. An optimal agent often *ignores* information where the cost of acquisition/processing exceeds its expected value.
              *   **Proxy Objectives:** Real-world AI rarely maximizes true expected utility. It optimizes a loss function, which might be misaligned. More data could make it *worse* at optimizing the proxy.
              *   **Exploration/Exploitation Tradeoff:** In sequential settings (like reinforcement learning), gathering information (exploration) has an *opportunity cost* vs. taking the best-known action (exploitation). An optimal agent *doesn't* "hoover" indiscriminately; it seeks information with the best cost/benefit ratio for future decisions.
      *   **Relevance:** This misstatement weakens the argument. It paints an unrealistic picture of rationality that doesn't reflect how even ideal agents (or AIs) behave under constraints. Real agents/AIs *rationally ignore* vast amounts of data.

  7.  **"...and also why 'I'd rather not know' is never rational when the stakes are real."**
      *   **Wrong and Dangerous for Your Piece:** This is the core overreach. Your instinct and philosopher friend are **correct**. Reasons "I'd rather not know" can be rational:
          *   **Costs:** As emphasized, the information isn't free (money, time, procedure risks, psychological burden).
          *   **Non-Instrumental Value of Beliefs/States:** The theorem *only* considers the instrumental value of information for making *future physical actions*. It ignores:
              *   **Psychological Utility:** Knowing bad news *itself* can cause direct disutility (anxiety, depression, loss of hope) regardless of future actions. "Peace of mind" has value. This is a major driver for declining screening.
              *   **Dynamic Inconsistency / Self-Control:** Knowing might tempt you towards suboptimal actions driven by fear or impulse, even if you *planned* rationally beforehand (e.g., demanding unnecessary treatments).
              *   **Ambiguity Aversion:** People often prefer known risks to unknown probabilities. Getting a precise risk score might feel worse than living with vague uncertainty. Information *creates* (or resolves) ambiguity.
              *   **Identity/Values:** Information might force confrontations with identity or values that are psychologically costly ("Would I want to know if I carry a gene for a terrible disease my parent had?").
          *   **Changing the Problem Scope:** Knowing creates new decisions/problems (e.g., "Do I tell my family?" "Do I get this preventive surgery?") that weren't in the original "treat/don't treat if symptomatic" decision frame. The agent rationally foresees this burden.
          *   **Zero Instrumental Value:** If the information wouldn't change treatment options (e.g., no effective prevention/treatment exists), its *instrumental* value is zero. Acquiring it only incurs costs (financial, psychological).

  ### Addressing Your Specific Questions

  1.  **Your Suspicion #1 (Zero Value):** You are **correct**. Value is strictly positive only if the information has a non-zero probability of changing the *optimal action*. Significant belief shifts without action changes yield zero instrumental value.
  2.  **Your Suspicion #2 (AI Claim):** You are **correct**. The theorem describes an ideal. Real agents (human or AI) operate under constraints (computation, time, imperfect proxies). An optimal agent under constraints *rationally* ignores information where acquisition/processing cost > expected instrumental value. The summary paints a cartoonish picture.
  3.  **Your Suspicion #3 (Non-Bayesian Agents):** Your philosopher friend is **correct and this is a crucial caveat.** The theorem assumes perfect Bayesian updating and expected utility maximization. Humans (and many models of bounded rationality) often deviate:
      *   **Ambiguity Aversion:** Preferring known risks over unknown risks can make information *undesirable* if it increases perceived ambiguity or makes probabilities precise but unfavorable.
      *   **Regret Aversion:** Knowing might increase the potential for regret.
      *   **Dynamically Inconsistent Preferences:** Temptation or fear post-information might lead to worse choices than planned ignorance.
      *   **Non-Expected Utility Preferences:** Models like Prospect Theory show people value losses more than gains and are risk-averse in gains/risk-seeking in losses. Information revealing a potential loss state can be disproportionately aversive.
      *   **Direct Utility from Beliefs:** As stated, beliefs themselves carry utility (dread, hope).
      **This is a REAL and SIGNIFICANT caveat for your story.** It explains a core psychological rationale for declining information.

  ### The Theorem and Declining Screening Tests

  *   **Where it's Silent/Weak:** Good's theorem provides **almost no direct purchase** against the rationality of declining screening tests in the real world. Its silence starts precisely where the real-world reasons for declining kick in:
      1.  **Costs:** The theorem assumes free information. Real tests cost money, time, carry physical risks (e.g., biopsy after a false positive MRI), and cause anxiety.
      2.  **Psychological Utility:** The theorem ignores the direct disutility of knowing bad news or living with uncertainty *as an end state*. "Peace of mind" is a valid preference.
      3.  **Scope:** The theorem assumes a fixed decision problem. Information often *creates* new complex decisions and burdens.
      4.  **Zero Instrumental Value:** If no effective action exists based on the information (e.g., untreatable early-stage finding), its *instrumental* value is zero. Only costs remain.
      5.  **Non-Bayesian Preferences:** Human rationality incorporates psychological factors beyond strict Bayesian EU.
  *   **Where it Applies:** It only strongly suggests that *if* the test is free, painless, perfectly accurate, has no psychological impact, *and* reveals information *only* relevant to actions with clear expected utility payoffs that *could* be changed by the result, *then* declining purely on informational grounds might be instrumentally irrational. This scenario is highly unrealistic for "know your risk" medicine.

  ### For Your Article

  *   **One Safe Sentence You Can Print:** "A foundational result in decision theory (Good's theorem) shows that for an idealized rational agent who updates beliefs correctly and acts solely to maximize expected benefit, new information relevant to a decision can never harm the *expected outcome* of that decision, and can improve it if the information might change the best course of action."
  *   **One Tempting Claim You MUST Cut:** **Cut the claim that "'I'd rather not know' is never rational when the stakes are real."** This is profoundly misleading and ignores the core reasons people decline screening (costs, psychological burden, lack of actionable outcomes, non-instrumental values). Replace it with an explanation of *why* people rationally say "no thanks" *despite* the abstract ideal.

  **The Shape of the Argument for Your Piece:** Good's theorem describes an ideal where information is a pure tool for better action. In reality, health information, especially predictive or screening information for asymptomatic individuals, comes with significant costs, burdens, and psychological impacts. The "know your risk" boom offers potential instrumental benefits, but rationally declining is often about avoiding these very real burdens, protecting psychological well-being ("peace of mind"), or recognizing situations where the information wouldn't lead to better health outcomes anyway. The theorem illuminates one narrow aspect of value (potential instrumental benefit) but is silent on the costs and non-instrumental impacts that dominate the "no thanks" decision.
