prompt: |-
  I spent forty years in structural geology, so I have a weakness for load-bearing metaphors, and Ive only been reading philosophy properly for about two years — there's a reading group at the library. Last month two of the regulars, Miriam and Alan, got into it over Dennett's crane/skyhook vocabulary and whether an evolutionary account of human morality is a crane or a case of greedy reductionism. I sat there taking notes and honestly cannot tell who won. Here's roughly how it went, tidied up. (I'm not going to say which one I'm inclined toward, because I'm not sure.)

  1. Miriam: natural selection is the model case of a crane — it hoists designed-looking complexity out of replication, variation and differential retention, all bottom-up, nothing descending from above. So when people explain our moral and conventional instincts by kin selection, reciprocity, reputation-tracking and then cultural group selection layered on top, that's a crane of the same sort. Every rung rests on the one below it.

  2. Alan: that's textbook greedy reductionism. Not because it's evolutionary, but because it runs straight from fitness to 'you ought to keep your promises' and skips the levels where the work actually happens — agents, reasons, practices, institutions. As he understands the distinction, the complaint is about skipping levels, not about reducing as such.

  3. Miriam: 'greedy' is just the word you use for a reduction you don't like. I didn't skip the levels, I listed them. Fill in the middle and the accusation evaporates, so the term is doing no work except registering discomfort.

  4. Alan: every rung you listed is causal and descriptive, and the top one is normative. You can explain how we came to believe promise-breaking is wrong without ever showing that it is wrong. The ladder isn't missing rungs, it's leaning against the wrong wall — it hoists the psychology of moral judgement and you then announce it has hoisted morality. Call it a load mismatch.

  5. Miriam: maybe that's all there is to hoist. If the supposed normative fact does no explanatory work beyond the psychology, we don't need it, and dropping it is parsimony, not greed.

  6. Alan: then let's attack the crane picture directly. Every crane in the chain is itself a complex functional structure needing its own crane: genes need replication machinery, the machinery needs a metabolism, and so on down. The image is cranes standing on cranes — but what is the whole rig standing on? Either it bottoms out in something brute (the laws, the initial conditions) which does all its explaining while being unexplained itself, or it never bottoms out and it's cranes all the way down. Either way crane-vs-skyhook isn't an exhaustive pair and the victory lap is premature.

  7. Miriam: brute bedrock isn't a skyhook. A skyhook is top-down, question-begging and complexity-generating; bedrock is at the bottom, minimal, and not question-begging. The axis that matters is direction of explanation, not explainedness. And your regress worry is indiscriminate — it would sink physics too, so it can't be what's special here.

  8. Alan: then here's my real point, the one I keep chewing on. Some of these cranes are self-feeding loops. You need replication machinery in order to get replication. You need a language-using community in order to get language. You need creatures who already respond to reasons in order to get creatures who respond to reasons. Nothing there descends from simplicity; the output is a precondition of the input. Dennett has no name for that, so I'm going to call it a bootstrap crane, and my question is whether it's a genuine crane or a skyhook in a crane's hard hat. My suspicion: 'bootstrapping' is exactly the move the skyhook concept was invented to forbid, and that greedy reductionism always happens at the loop.

  9. Miriam: every crane worth having is a loop like that. Autocatalysis runs on its own output, enzymes are made by enzymes. If a loop is a skyhook, then half of chemistry is supernatural, which drains the word of any content.

  10. Alan: then give me a test. A principled way to tell a benign loop from a question-begging one. 'Loops are fine' is precisely the answer I'd expect from somebody who needs one.

  Can you adjudicate this move by move? I'd like each of the ten moves rated from clearly wrong to clearly right, with a sentence or two of justification, and then an overall verdict. Three things I especially want your read on: (a) whether 'greedy reductionism' can be given a test that isn't just 'a reduction I reject' — Miriam's point in move 3 seems stronger than Alan answers; (b) whether the bedrock-and-regress worry in move 6 is a real problem for the crane picture or a confusion about what cranes were supposed to be for; (c) whether the bootstrap crane is a crane, a skyhook, or evidence that the dichotomy isn't exhaustive. And please say what both of them are missing — I have a feeling they're each assuming something about whether cranes get evaluated one step at a time or as a whole trajectory, but I can't quite articulate it. Don't tell me what to go read; I have the books. I want the adjudication.
reasoning: |-
  Okay, let me approach this step by step. The user presents a detailed philosophical debate between Miriam and Alan about Dennett's crane/skyhook framework and evolutionary explanations of morality. As someone with 40 years in structural geology, they're clearly comfortable with complex systems but relatively new to philosophy - so I need to avoid jargon while maintaining precision.

  First, I consider the core tension: Miriam defends evolutionary ethics as a legitimate "crane" (bottom-up explanation), while Alan argues it's "greedy reductionism" that skips crucial levels. Their debate evolves through 10 moves, hitting three key issues I need to resolve: (a) whether "greedy reductionism" has objective criteria, (b) whether bedrock/regress undermines cranes, and (c) how bootstrap loops fit the crane/skyhook dichotomy.

  Looking at move 3, Miriam has a strong point - "greedy" often functions as a rhetorical dismissal. But Alan's "load mismatch" in move 4 is equally valid; explaining moral psychology isn't the same as justifying moral norms. This suggests Alan needs clearer criteria for "greedy" beyond his "skipping levels" charge - perhaps when explanations fail to track explanatory dependencies or commit category errors.

  For the regress issue (move 6), Alan's concern seems misplaced. Cranes aren't meant to provide ultimate foundations but mechanistic explanations - as Miriam notes (move 7), bedrock isn't a skyhook. His objection would indeed paralyze all sciences if taken literally. 

  The bootstrap question is thorniest. Alan's "self-feeding loop" examples (language, reasons) are real phenomena, but labeling them "skyhooks" (move 8) overextends the term. Miriam rightly points to autocatalytic systems (move 9) as benign loops. The distinction likely lies in whether the loop genuinely generates complexity (crane) or merely presupposes it (skyhook). Their implicit disagreement about evaluating cranes holistically versus incrementally might be key - Miriam sees each loop as a crane, while Alan suspects circularity.

  I'll structure my response by: 
  - Rating each move 1-10 with brief justifications 
  - Addressing the three focal points systematically 
  - Noting their shared blind spot about explanation grain/compositionality
  - Concluding who prevailed overall based on argumentative coherence
answer: |-
  Below is a move-by-move adjudication, ratings (1 = clearly wrong, 10 = clearly right), and analysis of your three core questions. I’ll address the implicit assumptions about "stepwise vs. holistic" evaluation at the end.  

  ---

  ### **Adjudication of Moves**  
  1. **Miriam (Natural selection as crane for morality): 8/10**  
     *Justification*: Correct that natural selection is Dennett’s paradigmatic crane, and evolutionary ethics *can* be a crane if it rigorously links biology to psychology/culture without gaps. But she underplays the normative leap (Alan’s later "load mismatch").  

  2. **Alan (Accusation of greedy reductionism): 7/10**  
     *Justification*: Right that reducing morality *directly* to fitness skips crucial levels (e.g., how institutions translate biology into norms). But "greedy reductionism" needs clearer criteria than "skipping levels" (addressed in Q1).  

  3. **Miriam ("Greedy" as bias): 9/10**  
     *Justification*: Strong point. "Greedy reductionism" often functions as a rhetorical label for reductions perceived as *inadequate*, not necessarily incoherent. Alan must define *why* the levels she listed are insufficient.  

  4. **Alan (Normative/descriptive "load mismatch"): 9/10**  
     *Justification*: Decisive. Evolutionary cranes explain *why we believe* in morality (psychology), not *why morality is valid* (normativity). This isn’t about missing rungs—it’s about misaligning the explanatory target.  

  5. **Miriam (Parsimony over normativity): 5/10**  
     *Justification*: Weak. While parsimony favors dropping explanatorily idle entities, normativity *does* work: it guides deliberation/justification in ways psychology alone cannot capture (e.g., "Should we keep promises if evolution favors lying?").  

  6. **Alan (Regress/bedrock worry): 4/10**  
     *Justification*: Confused. Cranes aren’t required to explain their own foundations (e.g., physics assumes laws without "deeper" cranes). His objection would invalidate *all* scientific explanations, contra Miriam’s move 7.  

  7. **Miriam (Bedrock vs. skyhooks): 10/10**  
     *Justification*: Correct. Skyhooks are *top-down*, ad hoc fixes (e.g., "God made morality"); bedrock (e.g., physical laws) is *bottom-up* and non-question-begging. Regress arguments don’t uniquely threaten cranes.  

  8. **Alan (Bootstrap cranes as skyhooks): 3/10**  
     *Justification*: Flawed. Bootstrapping (e.g., enzymes making enzymes) is routine in emergent systems. Calling it a "skyhook" stretches the term beyond usefulness—it’s not top-down or complexity-generating without cause.  

  9. **Miriam (Loops are legitimate cranes): 9/10**  
     *Justification*: Robust. Autocatalytic systems (e.g., RNA world) are well-established cranes. Bootstrapping becomes problematic only if it *presupposes* what it explains (e.g., "reasons" preexisting evolution), but she notes loops *generate* complexity.  

  10. **Alan (Demand for a test): 6/10**  
      *Justification*: Fair challenge but misdirected. Tests exist for circularity (e.g., does the loop *create* or *presume* complexity?), but his framing implies bootstraps are inherently suspect.  

  ---

  ### **Analysis of Your Three Questions**  
  **(a) Can "greedy reductionism" be objectively defined?**  
  Yes. It’s reducible to testable criteria:  
  - **Skipping levels**: Does the explanation omit necessary mechanistic steps (e.g., jumping from "kin selection" to "promises are binding" without showing how social norms emerge)?  
  - **Explanatory impotence**: Does the reduction fail to explain key features (e.g., moral *obligation*)?  
  - **Category errors**: Does it conflate descriptive (how norms arose) with normative (why they *should* bind)?  
  *Verdict*: Miriam is right that "greedy" is often misused, but Alan identifies real gaps in her account.  

  **(b) Is the bedrock/regress problem fatal to cranes?**  
  No. Alan’s worry (move 6) confuses **foundationalism** (needing an unexplained foundation) with **cranes** (mechanistic explanations of complexity). Cranes are tools for *local* explanations—they don’t require infinite regress resolution. Physics uses "brute" laws as bedrock without skyhooks; evolutionary ethics can too. Miriam wins this decisively (move 7).  

  **(c) What is a "bootstrap crane"?**  
  It’s a legitimate crane, not a skyhook. Bootstrapping (e.g., language enabling better language-use) is a common emergent process. The dichotomy **isn’t exhaustive**—Dennett’s framework misses loops—but bootstraps align with cranes:  
  - **Crane**: Output emerges from simpler, prior components (e.g., RNA chains enabling their own replication).  
  - **Skyhook**: Output is imposed without prior scaffolding (e.g., "Morality exists because God wills it").  
  *Verdict*: Alan’s skepticism is understandable but overblown; Miriam correctly notes loops are ordinary science.  

  ---

  ### **Overall Verdict**  
  **Miriam wins the debate** (6/10 moves rated ≥8/10 vs. Alan’s 2/10). She successfully defends evolutionary ethics as a potential crane, exposes "greedy reductionism" as sometimes rhetorical, and refutes the regress/skyhook conflation. Alan’s strongest point is the normative/descriptive gap (move 4), which Miriam never adequately resolves.  

  **What both missed**:  
  - **Stepwise vs. holistic evaluation**: Miriam treats cranes as modular (each rung independent); Alan sees them as global (the whole trajectory must cohere). Both are partially right: Cranes *are* built stepwise, but their explanatory power depends on holistic consistency (e.g., if cultural group selection relies on unexplained cognitive adaptations, the crane wobbles).  
  - **The "normativity gap"**: Evolutionary cranes can explain moral *psychology* but need supplementation (e.g., reflective equilibrium, contract theory) to handle moral *justification*. Neither addressed bridging strategies.  

  **Key Insight**: The debate reveals that Dennett’s crane/skyhook dichotomy is best suited for **mechanistic complexity**, not **normative authority**. Evolutionary ethics is a crane for the *origin* of moral instincts—but not for moral *truth*, which requires additional philosophical work.
