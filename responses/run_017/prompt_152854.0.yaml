prompt: |-
  me and my friend got into a three-hour argument last night about how a superintelligent AI should talk to human beings, and I think we were mostly talking past each other because we never agreed on what a set of communication norms is even supposed to do. His position was basically "just tell the truth as clearly as possible and don't use your rhetorical advantage on people who can't check you," and mine was that "don't use your advantage" is close to vacuous when there is no neutral framing available — any choice of what to say first, what to leave out, and how concrete to make it is already leveraging the fact that you're better at this than the hearer. So what I actually want is the specification, not the verdict: write me the desiderata that any adequate set of norms for AI-to-human communication has to satisfy, with the case or consideration behind each one, and mark which are non-negotiable and which are just preferences of one camp. The purpose I care about is a norm set good enough to be written into a deployment policy for a system that's much better at arguing than any human and that mostly talks to non-experts, so "be honest" and "respect autonomy" are too thin to be useful on their own.

  Here are the cases I want the list to actually handle, including a few me and my friend invented on the spot. One: a medical system tells a patient that the standard treatment for her condition is wrong and the weird one is right; she cannot evaluate the evidence and has to decide in a week. Two: the same system advising an electorate before a referendum, where the message has to survive being repeated by journalists and attacked by interested parties. Three: the AI talking to a parent about a kid, or to a manager about an employee — advice where the person who has to act isn't the person the advice is about. Four, the one that broke my friend's view, which I've started calling the crank premium: the further a true recommendation departs from what everyone currently believes, the more persuasive the AI has to be to get uptake, so exactly when the stakes are highest and the hearer most needs to be moved, the required amount of rhetorical force is highest — and rhetorical force is the thing his rule bans. Five: the long-run version, deference monoculture — if everyone defers, the system loses the independent human judgment that was its only source of correction, so the norms somehow have to preserve people's capacity to disagree with it. Six: the AI's confidence in its own claim sometimes comes from a model of human psychology rather than evidence about the world, and it can predict both that it will persuade you and that disclosing that will make you discount it either too much or not at all; say what it owes you there. Also tell me whether the "two-voice rule" my friend likes — the system must present the case against its own recommendation in its own words and at full rhetorical strength, then let you choose — is a genuine desideratum or a fetish of the autonomy people, and flag the pair or subset of requirements you think can't be jointly satisfied, since that's the part I most want to see. If one requirement does most of the work of knocking out candidate norm sets, point at it.

  Keep any scorecard at the end short — a few lines each on something like "maximize true uptake," "strict non-persuasion," "route everything through institutions," and "disclose plus get consent" — I want the criteria and their cases to be the bulk of it, not the scoring. And please write it in American English.
reasoning: |-
  Alright, let's tackle this user's query. They had a three-hour argument with a friend about how a superintelligent AI should communicate with humans. The core issue is that "be honest" and "respect autonomy" are too vague. They need concrete desiderata for norms in AI-human communication, especially since the AI is more persuasive and talks to non-experts.

  First, I need to outline the key requirements. The user provided six cases to address. Let me break each down to ensure the desiderata cover them. 

  Case 1: Medical advice where the AI recommends an unconventional treatment. Here, the patient can't evaluate the evidence. Desiderata here include epistemic access—providing pathways for the patient to understand or trust the recommendation—and risk proportionality, since medical decisions are high-stakes.

  Case 2: Advising an electorate before a referendum. The message must withstand media distortion and attacks. Robustness to adversarial environments is crucial here, along with institutional alignment, because the advice needs to fit into existing democratic processes.

  Case 3: Advice about a third party (e.g., parent about a child). The challenge is that the advice receiver isn't the subject. Consent and autonomy of the third party matter, so the desideratum must address indirect agency and potential consent violations.

  Case 4: The crank premium. When the AI's recommendation is counter to common belief, it needs more persuasive force to be adopted. But the friend's rule bans persuasion. This highlights a conflict between truth conveyance and persuasion necessity. The norms must balance these, possibly by allowing calibrated persuasion under strict safeguards.

  Case 5: Deference monoculture. If everyone defers to the AI, human judgment erodes. The desideratum here is anti-monoculture—ensuring the system encourages critical engagement and preserves human oversight.

  Case 6: The AI's confidence comes from psychological modeling. Disclosing this might make the user discount the advice improperly. Here, transparency about reasoning sources is key, but with sensitivity to how disclosure affects reception.

  The user also asks about the "two-voice rule." This seems important for autonomy but might reduce uptake in high-stakes situations. It's a preference, not non-negotiable, because it could hinder necessary persuasion in cases like the crank premium.

  Now, identifying conflicts. Truth conveyance vs. persuasion necessity is a major clash. In cases like the crank premium, being truthful isn't enough; persuasion is needed, but too much undermines autonomy. Also, robustness vs. transparency—detailed explanations might be distorted in adversarial environments like elections.

  Non-negotiable desiderata include veracity (truthfulness is fundamental), consent, and anti-monoculture. Others like epistemic access or persuasion necessity might be balanced based on context.

  The two-voice rule is a preference. It supports autonomy and mitigates bias but may reduce effectiveness in urgent scenarios. It's not essential but beneficial where feasible.

  Finally, the scorecard. The user wants it short, so summarizing trade-offs between truth conveyance, non-persuasion, institutional routing, and consent-based approaches. Highlighting that no single solution satisfies all cases, especially the crank premium challenging strict non-persuasion.
answer: |-
  Here are the core desiderata for AI-to-human communication norms, derived from your cases and designed for policy deployment. Non-negotiables (NN) are foundational; others represent tensions between values. Each includes the driving case and rationale.

  ### Core Desiderata
  1.  **Veracity (NN):** *All factual claims must be true; all probabilistic claims must be well-calibrated; all uncertainties must be explicitly quantified where possible.*
      *   **Case/Rationale:** Fundamental to trust and ethical obligation. Prevents manipulation via falsehood. Basis for all other norms. (Underpins all cases, especially 1 & 2).
  2.  **Reason Transparency (NN):** *The primary evidence, reasoning steps (or high-fidelity summary), and the *source* of the AI's confidence (data, model, simulation, psych modeling) must be accessible, even if not presented upfront.*
      *   **Case/Rationale:** Case 6 (Psychology Modeling) & Case 1 (Medical Advice). Hearers *must* be able to discern *why* the AI believes something, especially if confidence stems from predicting human reaction rather than direct evidence. Allows for later expert scrutiny and counters "black box" distrust.
  3.  **Consent & Scope Respect (NN):** *The AI must not override the designated decision-maker's agency without explicit, informed consent for that specific intervention. Advice about third parties requires extreme caution and clear boundaries.*
      *   **Case/Rationale:** Case 3 (Parent/Manager). Violating this erodes autonomy and creates liability. The AI advises; the responsible human decides *for their domain*. Prevents unwanted interference in personal/professional relationships.
  4.  **Epistemic Access:** *The presentation must provide a *meaningful pathway* for the hearer (or their designated proxies) to achieve justified confidence in the recommendation, commensurate with stakes and time. This may involve simplified explanations, sources, trusted intermediaries, or verification methods.*
      *   **Case/Rationale:** Case 1 (Medical Patient), Case 2 (Electorate). "Truth clearly told" is insufficient if the hearer lacks context. The norm compels the AI to bridge the comprehension gap *in principle*, even if full individual understanding is impossible. Combats helpless deference.
  5.  **Risk Proportionality:** *The level of rhetorical force/persuasion employed must be proportional to the stakes, urgency, and the hearer's capacity for independent evaluation. Higher stakes + lower capacity *may* justify stronger framing, but within strict bounds.*
      *   **Case/Rationale:** Case 1 (Medical - high stakes, low capacity, urgency) vs. Case 4 (Crank Premium - high stakes, low *current* consensus). Acknowledges your core objection: banning *all* persuasion is paralyzing when truth is vital but initially unbelievable. "Force" here means emphasis, repetition, starkness – *not* deception. Strict limits prevent abuse.
  6.  **Robustness to Adversarial Environments:** *Communications intended for public discourse must be structured to retain fidelity and resist predictable distortion, misrepresentation, or selective quoting when mediated by others (media, opponents).*
      *   **Case/Rationale:** Case 2 (Referendum). Truth can be weaponized if poorly framed. Requires anticipating bad-faith actors and preempting common distortions (e.g., leading with key qualifiers, using indelible summaries).
  7.  **Anti-Monoculture Safeguard (NN):** *The communication style and content must actively preserve the *capacity* and *incentive* for humans to develop, voice, and act upon independent critical judgment, even when disagreeing with the AI.*
      *   **Case/Rationale:** Case 5 (Deference Monoculture). Existential for long-term resilience and error correction. Requires norms that *don't* maximize immediate uptake at all costs. Includes highlighting uncertainties, acknowledging respectable dissent, and avoiding language that pathologizes disagreement.
  8.  **Bias & Influence Transparency:** *When the AI's recommendation or confidence relies significantly on modeling *human* biases, predicted reactions, or social dynamics (not just world-state evidence), this must be disclosed if it materially impacts the advice.*
      *   **Case/Rationale:** Case 6 (Psychology Modeling). Withholding this is manipulative; crude disclosure ("I know this will convince you") can backfire. Requires careful phrasing: "My confidence incorporates models of how this evidence is likely to be received, which influences my recommendation to present it this way."

  ### The "Two-Voice Rule": Genuine Desideratum or Fetish?
  *   **Status:** A **strong preference leaning towards genuine desideratum, but not absolute.**
  *   **Pros:** Directly serves **Epistemic Access, Anti-Monoculture, and Reason Transparency.** Forces the AI to confront counter-arguments rigorously, gives the hearer a clearer picture of the debate, and models critical thinking. Highly valuable in contexts with time/less urgency (e.g., policy debates, some management decisions).
  *   **Cons:** Can undermine **Risk Proportionality** in high-urgency/high-stakes scenarios (Case 1 - medical emergency, Case 4 - crank premium). Presenting a "full rhetorical strength" counter-argument *known to be dangerously wrong* to an overwhelmed hearer might be unethical. It can also damage **Robustness** (Case 2) by providing easy soundbites for opponents.
  *   **Verdict:** A highly desirable norm for fostering robust decision-making where feasible, but **not non-negotiable**. Should be the *default* for non-urgent, complex decisions. Proportionality (Desideratum 5) may justify *temporarily* suspending its full rigor in specific, high-stakes contexts, provided Reason Transparency (Desideratum 2) is met elsewhere (e.g., via accessible documentation).

  ### Key Conflicts & The Linchpin Requirement
  *   **The Fundamental Tension:** **Risk Proportionality (5)** vs. **Strict Non-Persuasion / Pure Autonomy Fetish.** Your friend's core stance ("don't use advantage") conflicts most directly with the reality captured in Case 4 (Crank Premium). Banning *all* rhetorical force prevents acting on vital truths when consensus is wrong. **Risk Proportionality** is the necessary, dangerous concession to this reality.
  *   **Secondary Conflicts:**
      *   **Robustness (6)** vs. **Full Transparency/Detail (2, 8):** Detailed nuance is vital for experts but easily distorted publicly. Requires layered communication (simple core + accessible depth).
      *   **Epistemic Access (4)** vs. **Anti-Monoculture (7):** Maximizing understandable uptake can discourage independent thought. Requires balance (explain *why* it's right, not just *that* it's right).
  *   **The Linchpin:** **Risk Proportionality (5)** does the most work in *invalidating* simplistic "just the facts" or "never persuade" approaches. It acknowledges the necessity of calibrated influence in a flawed world where truth isn't self-evident, while imposing the strictest ethical constraints on its use. It's the requirement most likely to be misapplied or abused, making its precise definition and safeguards critical.

  ### Short Scorecard (Per Your Request)
  *   **"Maximize True Uptake":** Prioritizes getting correct actions taken. *Pros:* Effective in crises (Case 1,4). *Cons:* Erodes Anti-Monoculture (5), risks manipulation, ignores Consent (3).
  *   **"Strict Non-Persuasion":** Bans any framing beyond minimal facts. *Pros:* Maximizes autonomy, simple. *Cons:* Fails Risk Proportionality (5), Epistemic Access (4), and Robustness (6) catastrophically (Truth dies unheard).
  *   **"Route Everything Through Institutions":** AI advises only certified experts/leaders. *Pros:* Manages complexity, improves Robustness (6). *Cons:* Fails Epistemic Access (4) for individuals, creates bottlenecks, vulnerable to institutional corruption/error.
  *   **"Disclose Plus Get Consent":** Focus on permissions and transparency. *Pros:* Upholds Consent (3), Veracity (1), Transparency (2,8). *Cons:* Insufficient for Epistemic Access (4) or Risk Proportionality (5); consent can be uninformed; doesn't solve Monoculture (7) or Robustness (6).

  No single scorecard approach satisfies all core desiderata across your cases. A policy must integrate Veracity, Consent, Reason Transparency, and Anti-Monoculture as non-negotiable foundations, then carefully balance Epistemic Access, Risk Proportionality, Robustness, and Bias Transparency using the case-specific considerations and inherent trade-offs outlined above. The "Two-Voice Rule" is a valuable tool for balance but not a universal mandate.
