prompt: |-
  Hey — I'm an infra engineer and somehow ended up on our internal "should we keep funding this" review rota because the guy who normally does it left for a competitor in March. I've been going through old notes trying to reverse-engineer how Priya (staff eng, been here nine years, she's the one who actually makes these calls) decides, because I have to present one of these myself next Thursday and I'd really like to not look like an idiot in front of her.

  Here's her track record as best I can reconstruct it, in my own words. The recommendation-ranking team kept missing its quarterly metric, and every miss was explained after the fact by another special case — Spanish retailers format prices differently, then it was a timezone thing, then it was a promotion-flag thing; six of them, each one did actually fix the reported problem — and she killed it at the sixth. The anomaly-detection team was in the same boat, but the fix they wrote for their miss also caught, and they said in advance that it would catch, a whole class of failures in a logging system nobody had pointed them at; she not only kept funding, she called it the strongest case she'd seen all year. The forecasting team explained a known miss by adding a component that also implied something about a metric nobody had ever looked at, they went and checked, and it was right; kept funding. The compression team explained their one big miss with a switch that only turns on for that one data source, nothing else could ever test it, and she killed it even though the numbers then worked out. The search-ranking team wrote about a dozen patches over two years, each of them independently testable and each of them passing, but they never once predicted anything they hadn't already seen — they explained everything they were given and anticipated nothing — and she killed that one too, which I found harsh until I noticed the pattern. The scheduling-optimizer team was obviously in the same explain-every-miss mode, but she kept funding them anyway, and her line was that you don't pull a project because it's tired, you pull it because something better showed up; at that point the replacement was still a slide deck. And the one time a team threw out its whole approach and restarted under the same name, everyone agreed it was effectively a different project, so her ruling there doesn't tell me much.

  The case I have to present: capacity-demand forecasting. For roughly eighteen months it's been in explain-every-miss mode, and every one of those fixes was the ugly kind — a one-source-only adjustment you can't test anywhere else. Three months ago they added a component that predicted, before anyone checked, a pattern in a different product line's data that this team had never touched, and it was right. Two wrinkles: that component was lifted more or less wholesale out of the model the rival team (the one she likes) has been building — so the novel prediction may not really be "theirs" — and in the same release they quietly dropped a load-bearing assumption of the original design, that demand is seasonal around a stable baseline, in favor of demand being driven by a feedback loop between inventory and ordering, while keeping the team, the pipeline, the patches and the name. There is now a young rival internally that has made two clean predictions, one of them novel, but it's three people and a notebook.

  What I want from you: the rule Priya is actually running, stated tightly enough that I can apply it to a new case without her in the room. My own guess is something like a project is healthy when its fixes keep predicting things nobody asked it to predict and sick when the fixes only ever explain what already went wrong — but I want to know what other rules fit all seven of her past calls just as well and disagree about mine, since that's where I'll get torn apart. Specifically: does one genuine novel prediction wipe out eighteen months of one-off patches, or does the long-run trend govern, or does the dropped assumption mean the record is void and they get scored as new? Does importing the rival's mechanism count as their novelty or as evidence they've stopped being a project of their own? Which of those rules would you bet she's running, and is there one specific fact I should go dig up before Thursday that would separate them? And honestly, if you were me, what would you actually argue in the meeting — keep funding, or kill it?
reasoning: |-
  Okay, let me start by understanding the user's problem. They're an infra engineer unexpectedly handling a project review, trying to emulate Priya's decision-making. They provided seven past examples and their current case: the capacity-demand forecasting team. The user wants to reverse-engineer Priya's rule and apply it to their case without looking foolish.

  First, I need to analyze Priya's decisions. Looking at the track record, there's a pattern. She killed projects that only fixed past mistakes without predicting new issues (recommendation-ranking, compression, search-ranking). But she funded those that made novel predictions (anomaly-detection, forecasting). The scheduling-optimizer exception is interesting—she kept it despite explain-every-miss because no better alternative existed. 

  The key seems to be whether a project generates predictive power beyond immediate fixes. Novel predictions indicate the model understands underlying principles, while one-off patches suggest bandaids without real insight. But the scheduling case shows that strategic value can override this if no replacement is ready.

  Now, the user's case: 18 months of one-off patches, but a recent novel prediction. However, that prediction used a rival team's component and they changed a core assumption. The user needs to know if the novel prediction resets the clock or if the history matters more. Also, does borrowing the rival's work count as genuine novelty? And does the core change make them a new project?

  The user’s guess about predictive vs. explanatory fixes aligns, but they want to know competing rules. Alternatives could include weighting recent evidence more, or considering strategic factors like team size. But Priya’s history suggests she values consistent predictive insight over isolated wins. The scheduling case shows she considers alternatives. 

  For the current project, the borrowed component might not count as their own insight. Plus, dropping the core assumption without restarting as a new project could be a red flag. The rival team, though small, has two clean predictions. Priya might see them as the more promising option. 

  The user should dig into whether the novel prediction stemmed from their own model or just imported code. If it's purely borrowed, it doesn't reflect their project's health. Also, check if the core change invalidates past metrics. 

  In the meeting, arguing to kill it seems safer, citing the long trend of one-off fixes, unoriginal prediction, and core change without rebooting. Position the rival as the true innovative project. Emphasize that real predictive power comes from internal insight, not borrowed parts.
answer: |-
  Based on Priya's pattern across 7 decisions, her core rule isn't just about *predictive novelty*—it's about **Intellectual Vitality & Generative Insight**. Here's the distilled rule, competing interpretations, and your playbook:

  **Priya's Core Rule (Tightly Stated):**  
  *A project deserves funding if its core model/framework demonstrates **ongoing capacity to generate independently testable insights about the system it operates in***.  

  **Key Indicators:**  
  - ✅ **Healthy:** Fixes/predictions reveal *new, generalizable* system behaviors (e.g., anomaly team catching unrelated logging failures).  
  - ❌ **Sick:** Fixes are *post-hoc, non-transferable*, or fail to illuminate unseen aspects (e.g., compression team's one-source switch).  
  - ⚖️ **Exceptions:** Strategic context matters (e.g., scheduling team kept due to lack of replacement).  

  ---

  ### Why Your "Predictive vs Explanatory" Rule *Almost* Fits (But Doesn't Capture Nuance)
  1. **Anomaly-detection & forecasting teams** made *novel predictions* → funded.  
  2. **Compression & search-ranking teams** only *explained past misses* → killed.  
  3. **Scheduling team** only explained misses → *but kept* (strategic override).  
  4. **Recommendation-ranking** → killed after 6 explanatory fixes.  

  **The Gap:** Your rule breaks on the scheduling exception. Priya explicitly overrode the "explanatory = sick" pattern because **no better alternative existed**. This shows she weighs *opportunity cost* ("something better showed up").  

  ---

  ### Competing Rules That Fit Her History (And Threaten Your Case)
  1. **"Weighted Recency Rule":**  
     *"Recent evidence (last 3-6 months) outweighs historical trends if it demonstrates a phase shift."*  
     - **Fits all cases:** Scheduling had no recent shift → killed later? (Unclear). Others had consistent patterns.  
     - **Threat to you:** The novel prediction (3mo ago) could reset the clock.  

  2. **"Origin of Insight Rule":**  
     *"Insights must emerge *organically* from the project's core model, not external grafts."*  
     - **Fits:** Anomaly/foresight generated insights internally → funded. Compression/search relied on external bandaids → killed.  
     - **Threat to you:** Their "novel" prediction came from a rival's model → not organic.  

  3. **"Model Integrity Rule":**  
     *"If core assumptions change, the project is new; historical performance is irrelevant."*  
     - **Fits:** The rebooted project was treated as new.  
     - **Threat to you:** Dropping "stable seasonality" for "inventory feedback loops" is a foundational change → void past record.  

  ---

  ### Key Judgement Calls for Your Case
  | **Factor**               | **Kill Argument**                          | **Fund Argument**                         |
  |--------------------------|--------------------------------------------|------------------------------------------|
  | **18mo of one-off fixes** | Shows chronic lack of insight (like compression) | Pre-new-model phase; irrelevant post-pivot |
  | **"Novel" prediction**    | Borrowed insight (not generative)          | Proves adaptive capacity                 |
  | **Core assumption drop**  | Invalidates historical data; masks failure | Necessary evolution; fresh start         |
  | **Rival team**            | "Something better" exists (small but novel) | Too immature; not a viable replacement   |

  ---

  ### What to Dig Up Before Thursday (The Decisive Fact)
  **"Did the novel prediction emerge *organically* from their *own* model after the pivot, or was it solely caused by pasting the rival's component?"**  
  - If the insight **required the rival's code** → Not generative → Kill.  
  - If their **refactored model *independently* replicated the insight** → Generative → Fund.  

  Priya's history suggests she values *provenance of insight*. The anomaly team's win was organic; search-ranking's patches weren't.  

  ---

  ### What to Argue in the Meeting: **Kill It**  
  **Your script:**  
  > *"This project spent 18 months applying non-generative, one-off fixes—classic 'sick project' behavior. Their lone novel prediction came from importing a rival's model, not their own insight. The recent pivot voided their original thesis, effectively making them a new project competing with the internal rival. That rival—though small—has two clean predictions. Priya’s rule demands generative insight, not patchwork. We have 'something better' emerging; we should redirect resources."*  

  **Why this wins:**  
  1. Aligns with her kills (compression, search) and avoids the scheduling exception (rival exists).  
  2. Highlights the *unorganic* insight as disqualifying (biggest weakness).  
  3. Uses her own language ("generative," "something better").  

  **If Priya pushes back:** Focus on **opportunity cost**. The rival team’s two predictions (one novel) with 3 people likely signals higher ROI than the incumbent’s 18mo of bandaids + borrowed ideas.  

  **Final Tip:** Frame the pivot as a *stealth reboot*—they changed foundations but avoided scrutiny. Priya values intellectual honesty; this undermines trust. Good luck! 🛠️
