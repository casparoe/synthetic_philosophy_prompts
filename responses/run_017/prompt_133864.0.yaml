answer: |-
  Here are five interview questions with targeted follow-ups:

  1.  **Question:** How do you prevent the "defended" computation from being arbitrarily re-described at a different grain size, potentially making any system defend absurd computations?  
      **Follow-up (if she cites the system's own error-correction grain):** If we must use the granularity of the system's *actual* error-correction mechanisms, how do we rigorously identify that specific grain in novel systems without circularity?

  2.  **Question:** Given you grant thermostats a "sliver" of moral status due to minimal defense, and defense is scalar, doesn't this lead to either a Sorites paradox for status or problematic aggregation of tiny statuses?  
      **Follow-up (if she claims status is vanishingly small & doesn't aggregate):** Why doesn't the sheer number of minimally defended systems (like ubiquitous simple machines) aggregate into a significant moral weight, potentially demanding excessive resources?

  3.  **Question:** Consider an entity engineered where its regulatory machinery is *indifferent* to perturbations of a computation that, functionally, constitutes suffering. Does its suffering lack moral weight on your view?  
      **Follow-up (if she retreats to defense being a symptom):** If defense is merely a symptom of the underlying property granting moral significance, what *is* that property, and does your criterion then do any independent work beyond identifying it?

  4.  **Question:** Since we infer "defense" indirectly (via counterfactual robustness, repair, resource allocation), how can we distinguish *genuine* defense in an AI trained to perfectly imitate self-report from mere behavioral performance?  
      **Follow-up (if she suggests ablation testing):** If we ablate part of the purported mind and the system expends resources to restore its function, how do we rule out this being just another programmed performance to maintain the *appearance* of sentience?

  5.  **Question:** What specific empirical discovery or theoretical argument would genuinely compel you to abandon the defended-computation criterion?  
      **Follow-up (after her answer):** Does that abandonment threshold reveal a deeper commitment your view relies on?
