prompt: |-
  hey — I host a tiny philosophy-of-mind podcast, and next week's guest is a philosopher (unnamed, she's mid-book) who defends what she calls the *defended-computation criterion* for moral patienthood. Her line, as I understand it: sure, any physical system can be described as implementing arbitrarily many computations, and sure, some of those descriptions look exactly like a mind — but the only ones that matter morally are the ones the system's own regulatory machinery is disposed to preserve, the computations it would in some sense fight for if you perturbed, degraded, or deleted them. Everything else she calls gratuitous implementation: a shadow mind running in the heat flux of a wall, a lookup table of an entire life, biologically or functionally perfect and morally inert. She also bites some bullets — thermostats and immune systems get a sliver of status, and status comes in degrees with no bright line anywhere.

  Draft me exactly five interview questions, and I want them to go past her just restating the criterion. Specifically: (1) one on whether "defended" is itself well-defined, given that a defended computation can be re-described at some other grain into an absurd one; she'll probably answer that we should carve at whatever grain the system's own error-correction is actually sensitive to, so build the follow-up around that. (2) One on the bullet-biting: if defense comes in degrees and there's no cutoff, is she stuck saying a thermostat has a nonzero sliver of status, and does that either turn into a sorites or aggregate into the tiny-moral-weights fanaticism people tease longtermists about? anticipate her "nonzero but vanishingly small, and it doesn't blow up under aggregation because —" answer. (3) One springing a case on her: engineered indifference. Take a system where the computation that, functionally and psycologically, looks exactly like suffering is one its regulatory machinery has been shaped not to defend — it's stoical about it, or the defense machinery just never covered it. On her view that suffering stops mattering, which makes moral status look like a function of whoever built the system; she'll likely retreat to saying defense is only a symptom of whatever really matters, so the follow-up has to force her to name the underlying thing and say whether the criterion is then doing any work at all. (4) One on evidence: even with humans we only ever infer defense from counterfactual robustness, recovery after damage, resource allocation — so for a system trained to imitate self-report, what observation could distinguish real defense from performed defense? key the follow-up to her probable "ablate it and watch what the system does to get it back" reply. (5) One closing question about what would actually make her drop the view.

  Give it to me as a numbered list of exactly five items, two sentences max each — first the question, then the follow-up that keys to the answer she's most likely to give ("if she says X, come back with Y"). Don't write out her answers as a script, and no intro or outro — I'll be reading these off a screen while she's talking.
