answer: |-
  ## Villanelle: The Draught

  The setting is a small-boat fishing community facing depletion.

  **Why a villanelle?** The form’s relentless recursion perfectly embodies the self-licensing logic of the trap. Each return of the refrain feels like the next inevitable, rational step, not mere repetition. The sestina’s spiraling complexity, while tempting for depicting entanglement, offers too much variation; the villanelle’s stricter, tighter recurrence mirrors the inescapable groove of the dilemma.

  **Why a fishery?** It concretizes both active overfishing (defection) *and* the passive withdrawal of the most cautious or responsible actors (adverse selection). Boats going out = defection/greed. Boats staying in harbour = good coin hoarded/market exit. Both degrade the commons. The sea imagery allows for natural, non-agential description of decline ("thin", "grey").

  ---

  The tide pulls out, the grey waves shift and roll,
  We read the signs the gulls write on the air.
  **I must cast the net where the fish run thick.**
  The shoals are smaller than the tales we’re told;
  Our fathers’ marks mean nothing lying there.
  The tide pulls out, the grey waves shift and roll.

  Old Martin keeps his *Grace* tied to the shoal,
  Says let the young men chase the phantom flick.
  **I must cast the net where the fish run thick.**
  His buoys hang slack, a quiet, sun-bleached toll.
  We see his wisdom rusting, plank and stick.
  The tide pulls out, the grey waves shift and roll.

  More boats chase fewer shadows, take their toll,
  Dragging the deeps with mesh precise and quick.
  **I must cast the net where the fish run thick.**
  The harbour mouth now holds a different shoal –
  **The sea grows thin and no one drained it.**
  The tide pulls out, the grey waves shift and roll.

  We eye each other's decks, the laden bowl,
  The empty hold means credit won't stick.
  **I must cast the net where the fish run thick.**
  The charts show depth where shallows took their toll,
  Boats that stayed in harbour, counting cost.
  **The sea grows thin and no one drained it.**
  The tide pulls out, the grey waves shift and roll.

  No poison poured, no single trawler's soul
  Hatched ruin in the deep or played a trick.
  The shoals retreat, the echo-sounder's thick
  With ghosts of runs we chased and couldn’t hold.
  **I must cast the net where the fish run thick –**
  **The sea grows thin and no one drained it.**

  ---
  **Annotations & Fit:**

  1.  **Refrains:**
      *   **"I must cast the net where the fish run thick"**: The internal logic, the necessity. It’s not greed, it’s survival/competence ("*must* cast"). "Run thick" implies abundance, justifying the action. It would *still* be necessary tomorrow.
      *   **"The sea grows thin and no one drained it"**: The collective outcome, utterly passive. "Grows thin" describes depletion without agency. "No one drained it" explicitly denies individual causation/blame ("drained" avoids poisoning metaphor, fits water).

  2.  **Mechanism Accuracy:**
      *   **Active Defection:** "More boats chase fewer shadows... Dragging the deeps with mesh precise and quick." (Intensified effort/tech).
      *   **Passive Withdrawal:** "Old Martin keeps his *Grace* tied to the shoal... Boats that stayed in harbour, counting cost." (The cautious exit). Both lead to the same outcome: "The shoals retreat," "The sea grows thin."
      *   **Self-Licensing Logic:** Each recurrence of "I must cast..." feels like the next rational step forced by circumstances ("empty hold means credit won't stick," "eye each other's decks"), mirroring iterated dilemmas.
      *   **No Agency:** Depletion is described through natural imagery ("tide pulls out," "waves shift and roll," "shoals retreat," "sea grows thin") and passive voice ("no one drained it"). No wants, plans, or blame.

  3.  **Form as Argument:**
      *   The villanelle’s structure *is* the trap. The refrains return like the next inevitable, locally rational move ("I must cast...") and the accumulating, agentless consequence ("sea grows thin"). The final couplet forces the two truths ("I must cast..." / "sea grows thin...") together without resolution, creating the intended discomfort. The form *enacts* the inescapable cycle.

  4.  **Concrete Setting:** Sustained fishery imagery throughout (tide, waves, gulls, shoals, nets, buoys, hulls, harbour, echo-sounder, holds, decks, charts). No abstract nouns (Moloch, Commons, Trap, Dilemma). The refrains work naturally within this setting.

  5.  **No Resolution/No Judgement:**
      *   **No Heroism/Coordination:** Ends purely with juxtaposed truths. No call to action, regulation, or hope implied.
      *   **No Foolishness/Wickedness:** Participants act out of perceived necessity ("must cast," survival/credit) or caution ("counting cost"). Their actions are framed as rational responses within the system. "No one drained it" absolves malice.

  6.  **Unifying the Variants:** By setting the poem *after* the initial depletion phase has begun, it naturally incorporates both the intensified effort of those still trying ("cast where fish run thick") *and* the exit of those like Martin ("boats that stayed"). Both are responses to the thinning sea, both contribute to the problem continuing or worsening, shown as facets of the same decaying system. The "sea grows thin" encompasses both causes.
