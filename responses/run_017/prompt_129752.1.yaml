prompt: |-
  my dad died in march and left me about $190k, which is more money than Ive ever had at one time, and I keep not doing anything with it because every time I sit down to decide I end up in this argument with a friend from my old poker group who now bets full time and wont stop talking about geometric rationality. I wrote his argument out as carefully as I could and now it seems to prove way more than he wants, so Im hoping you can find the joint.

  (1) You should choose the policy that, with probability approaching 1, leaves you with more of the thing you're trying to get more of than any alternative does -- and more by a factor that grows without bound. If you can see in advance that you'll be behind and arbitrarily behind, you've made a mistake, whatever your " utility function" says.

  (2) In a long sequence of favorable bets whose winnings get reinvested, the policy that maximizes expected log wealth (the Kelly fraction) has exactly that property: with probability going to 1 the Kelly bettor is ahead of any other fixed-fraction bettor, and ahead by a factor going to infinity. This is just because the difference in growth rates compounds.

  (3) Your financial life is one long sequence of reinvested bets. Every paycheck, every purchase you skip, every thing you put money into -- the money left at the end of one decision is the stake for the next one. There are no genuinely one-shot financial decisions.

  (4) So: in every financial decision, maximize expected log wealth. Log utility isn't a taste you're allowed to have, it's forced on you. (He also says this is why the same math shows up in biology, with expected log number of offspring and bet-hedging -- whatever quantity is compounding, maximize the expected log of it.)

  (5) Consequence: since log goes to minus infinity at zero, you must refuse any bet with any nonzero chance of losing everything, no matter how tiny that chance is and no matter how big the upside. A one-time offer that doubles your net worth with probability 1 - 10^-9 and wipes you out otherwise has to be turned down.

  (6) Consequence: nothing in (1)-(4) mentions a horizon or a target, so you should be maximizing the growth rate of the pile forever, which means never spending on anything that doesn't itself compound. Consumption just permanently shrinks the base that everything else multiplies on.

  (7) Consequence: by the parenthetical in (4), run it on anything that multiplies. Your chance of being alive at the end of the year multiplies across everything you do, and expected log of a product is the sum of the expected logs, and log(0) is minus infinity -- so any action with any nonzero chance of killing you is infinitely bad and you should never leave the house again.

  (7) is insane and (6) is nearly as bad, and (5) I half believe, so something earlier has to give. What I can't figure out is what.

  Here's the part I'm most confused about, and I think its the actual crux: I tried to test (1) instead of just accepting it. Take a favorable even-money bet, 60/40. Strategy A: bet everything once, then if you win, switch to Kelly forever after. In the 60% branch you come out of the first round with double, and from then on you and the pure Kelly bettor are running the same policy off different bankrolls, so you stay ahead by a constant factor forever. In the 40% branch you're broke. So the probability that pure Kelly is ahead of you at time n goes to 40%, not to 1 -- on his own criterion in (1), Kelly doesn't beat this thing. But expected log says the strategy is infinitely bad. So (1) and (4) can't be the same criterion, and I don't know which one is supposed to be doing the work. Is the probability-one claim even true outside the class of fixed fractions, or did I just misread the theorem?

  Two smaller things that bug me. Someone in the group chat said the "eventually" in (1) can take centuries once the edge is small, and I don't care what my bankroll looks like in the year 2400. And when I pushed him on (6) he said fine, apply the log rule to consumption rather than wealth -- but if the quantity is a free parameter, then the argument never told me anything about money specifically, it just told me to Kelly whatever I already happened to want, and all the freedom I thought log utility takes away comes back in through the choice of quantity.

  Tell me which step you reject and what rejecting it costs. I'd rather keep (2) and (3) than keep (7) -- the math looks right to me and I do think my decisions form one long sequence -- but if the price of keeping them is that I have to say something real about (5), I'll pay that, since (5) I only half believe anyway. If the answer is that (1) is the wrong kind of criterion, I want to know what the right kind looks like and whether it still gets you to Kelly.

  Lead with your bottom line in the first sentence -- which step, one line -- then do the reasoning. No preamble, no restating my argument back at me, no "great question." Flag how confident you are at each move rather than smoothing it over, and say what would change your mind: what would a defender of the growth-rate criterion have to show you to get you to switch, and where is your own diagnosis most likely to be wrong.
