prompt: |-
  I am in my final year of high school, and I serve as the student member of the volunteer committee that maintains our county's list of "native" plants — the list that decides what may be seeded in the roadside restoration beds and what the county will reimburse growers for. Over the two years I have been on it I have watched the word "native" move, and I have no word for how it moves.

  We never apply a definition. What happens instead is that someone proposes a plant and asks whether it is enough like something already on the list, in the way that matters for whatever we happen to be doing that evening. Our core case is not in dispute: a species that grew in these meadows before the county existed and that still grows here without anyone planting it. Then a species native to our state but not to our county went on, because it is native to the region. Then a species whose local wild population died out eighty years ago went on, because the nursery stock is grown from wild seed collected two states over, so the genes are the right ones. Then a cultivated variety bred from a native species for double flowers, which we had rejected twice, went on for a highway planting because the pollinators use it. Each of those steps was small, reasonable, and unanimous, and no member would say that the word had changed meaning at any point.

  Two further things worry me. First, once a plant is on the list it stays there, and the reason it was admitted is forgotten, so it gets cited in arguments that reason never supported: a plant accepted because insects will visit it is then defended as part of the county's natural heritage, and a plant accepted because its seed is wild-collected is then treated as though it had always grown here. Second, the content of the list depends on the order in which things came before us. Had the cultivated-variety question been voted on in my first month rather than my last, I believe we would have decided it the other way, and the list would now exclude plants it includes.

  A friend's older brother, who reads philosophy, said this sounded like family resemblance, but that does not fit: we have one clear core case, and we are not resisting or contesting the word, we are extending it unanimously. Vagueness does not fit either, since we are not looking for a cut-off on some single scale.

  Please answer in exactly five numbered points, each one or two sentences long, with no introduction before the first point and no summary or closing sentence after the last. The five points should be, in order: (1) whether this pattern has an established name, and the nearest established notions to it; (2) whichever established notion comes closest, and the precise respect in which my case fails to fit it; (3) a second candidate that fits less well, and why it too falls short; (4) if nothing established fits, the name you would give it, with a definition tight enough that I could apply it to a plant I have not mentioned; (5) whether the two features I described — that the order of our decisions changes the outcome, and that a decision made for one purpose gets reused for another — are really one phenomenon or two that merely travel together, together with a test case that would settle it. Please do not give me a reading list or citations; I only want the carving.
reasoning: |-
  Hmm, the user is a high school senior involved in a volunteer committee for native plants. They're describing how the definition of "native" has shifted over time in their committee decisions without anyone explicitly changing the rules. Each addition seems reasonable at the moment but collectively transforms the meaning. The user is troubled by two things: the committee forgets why plants were added, leading to misuse of the justifications later on, and the outcomes depend entirely on the order in which plants were considered.

  The user wants me to provide exactly five numbered points answering specific questions about this phenomenon. They've already considered family resemblance and vagueness concepts but found them inadequate. They need: (1) whether this pattern has an established name and related concepts, (2) the closest established concept and why it doesn't fit perfectly, (3) a second less-fitting candidate and its shortcomings, (4) a new name and definition if nothing fits, and (5) analysis of whether the two worrying features are one phenomenon or two.

  I need to structure my response precisely as requested - five numbered points, one or two sentences each, no introductions or conclusions. The user is clearly intellectually sophisticated (referencing Wittgenstein's family resemblance) but wants concise conceptual "carving" rather than academic citations.

  For point 1, I'll note that while no perfect established term exists, "concept creep" and "precedent-based reasoning" are the closest notions. For point 2, I'll explain how concept creep is the best fit but fails because their extensions are deliberate rather than unconscious. For point 3, I'll address why precedent-based reasoning doesn't fully capture the unanimous justification shifts. For point 4, since nothing fits perfectly, I'll propose "contextual accretion" as a new term. For point 5, I'll argue the two worrying features are distinct phenomena that travel together, using a test case about adding plants in reverse order.

  The user seems both intellectually curious and genuinely concerned about governance implications - this isn't just an academic exercise. They're noticing how bureaucratic categories evolve through path dependency and justification drift. My response should honor both their conceptual rigor and practical worries about the committee's process.
answer: |-
  1.  This pattern lacks one established name, but the nearest notions are *concept creep* (gradual expansion of a category's boundaries) and *precedent-based reasoning* (using past decisions to justify new ones).
  2.  *Concept creep* comes closest, but it fails to fit because your committee's expansions are deliberate, unanimous decisions, not unconscious or externally driven drifts in meaning over time.
  3.  *Precedent-based reasoning* fits less well because while you use past inclusions as analogies, the *basis* for acceptance (e.g., region vs. genetics vs. pollinator use) shifts significantly, undermining a consistent rule.
  4.  Since established notions fall short, name it *contextual accretion*: the process where a category's accepted instances expand incrementally through unanimous agreement based on salient, context-specific justifications that are later forgotten.
  5.  The two features are distinct phenomena that travel together: path dependence (order matters) and justification drift (purpose forgotten). A test case: if you reversed the order plants were proposed, would the *same* justifications be used to accept/reject them? If not, they are distinct.
