prompt: |-
  I have to hand something to our hospital's policy committee by the end of the month, and I would rather have the specification before I go back to the candidate accounts. I'm a philosophy professor, drafted — I suspect as the token humanist — onto the committee rewriting our determination-of-death policy; the document has to do three jobs at once, saying when life-sustaining treatment may be withdrawn, saying when organs may be procured, and giving bereaved families one sentence about what happened to the person they brought in. I have taught the material twice and it goes badly each time: half the students arrive convinced that brain death is a legal fiction invented to make procurement easier, the other half that a ventilated body with a destroyed brain is simply and obviously a corpse, and neither half can say what an account of death would have to get right for the dispute to be settled. The uniform act our statute copies offers two alternative prongs, irreversible loss of circulatory and respiratory function or irreversible loss of all functions of the entire brain including the brain stem, and the attempt to revise it was quietly abandoned a couple of years ago, which suggests to me that some of what we want cannot be had together.

  Four cases keep doing the work in my notes. First, a patient with catastrophic brain injury who is not brain dead: support is withdrawn, the heart stops, and after a short interval the team declares death on the circulatory prong and procures organs, even though that circulation is not irreversible in any absolute sense — with enough exertion it might be restarted — but permanent, because a decision has been made not to restart it; if permanence is enough, the time of death seems to depend on a decision. Second, a body with a destroyed brain, on a ventilator, with hormones replaced: circulation, temperature regulation, wound healing, even gestation continue for months, so if death is the loss of the organism as an integrated whole this body still looks integrated, and the brain criterion starts to look like a proxy for the thing rather than the thing. Third, suppose a perfusion technology becomes clinically available that can re-establish cerebral microcirculation and recover some cellular and network activity hours after circulatory arrest: irreversible then comes to mean irreversible with the equipment we happen to own, and the moment of death becomes a function of what is on the ward that day. Fourth, the two prongs can simply disagree, with the same patient dead under one and not dead under the other, and our policy will need a rule for which governs.

  So what I want is the desiderata. What must an account of death be able to deliver to be adequate for a document like ours — which cases it has to get right, which distinctions it must respect (death as an event or as a process, irreversibility or mere permanence, the phenomenon itself or a proxy for it, one concept or several role-relative ones), which requirements are genuine and which are the preferences of a camp, whether that be neurologists, transplant surgeons, or philosophers with a taste for tidy metaphysics? Assume I know the usual candidates — the whole-brain criterion, the brainstem criterion, the higher-brain or neocortical criterion, the circulatory criterion read as irreversible or as permanent, and the organism-as-a-whole view — so name them rather than explain them, and give me no reading list and no citations; I have the literature and I do not want it handed back to me. Answer as exactly seven numbered items, with no introduction and no closing summary: items one through five the requirements themselves, each in two sentences at most, each tagged HARD or SOFT, each with the case that earns it a place on the list; item six the subset of requirements you think cannot be jointly satisfied, and which one has to give; item seven the single requirement that excludes the most candidates, and which candidates it excludes.
reasoning: |-
  Hmm, the user is a philosophy professor serving on a hospital committee to rewrite the determination-of-death policy. They're struggling because the topic is polarizing—students either see brain death as a legal fiction or a ventilated body as obviously dead—and they can't articulate what would settle the dispute. The policy needs to handle three things: withdrawing life support, organ procurement, and explaining death to families. The professor has four key cases that highlight the challenges: withdrawal of support making death depend on a decision; a brain-destroyed body showing integrated functions; technology affecting irreversibility; and potential conflict between the two prongs of the current statute.

  The user wants desiderata for an account of death—requirements it must meet. They need seven numbered items: five requirements tagged HARD or SOFT with a case, one subset that can't be satisfied together and which must give, and one requirement that excludes the most candidates. They know the standard theories and don't want explanations or citations.

  First, the requirements must address the fundamental tensions. From the cases, key issues are: irreversibility vs. permanence, integration of the organism, technology dependence, consistency between prongs, and the role of decisions. Each requirement should be tied to one of the cases to show its necessity.

  For item one, the user mentioned the first case where permanence (due to a decision not to resuscitate) is treated as irreversible. This highlights that death should not depend on human choices. So, a HARD requirement: death must be a biological fact, not contingent on decisions. Case 1 shows why it's necessary.

  Item two: Case 2 with the brain-destroyed body maintaining functions. If integration is key, but the body still integrates, the brain criterion might be a proxy. Requirement: an account must directly define the phenomenon (organism's death), not rely on proxies. HARD, because proxies can fail, as in this case.

  Item three: Case 3 with perfusion tech changing what's irreversible. Death shouldn't depend on available tools. Requirement: irreversibility must be absolute, not relative to technology. HARD, as tech can vary.

  Item four: Case 4 where the two prongs disagree. The policy needs one coherent concept. Requirement: a unified standard to avoid conflicts. HARD for policy consistency.

  Item five: The user hinted at different stakeholders (neurologists, surgeons, philosophers). Requirement: the account must be publicly justifiable and acceptable across groups. SOFT because it's about practicality, not metaphysics, but still important for trust.

  For item six: Conflicts. Requirements 1 (biological fact), 3 (absolute irreversibility), and 4 (unified standard) might clash. For example, absolute irreversibility is hard with current tech, and a unified standard might not fit both withdrawal and procurement. Requirement 3 (absolute irreversibility) has to give because in practice, we use permanence.

  Item seven: Requirement 1 (biological fact, not decision-dependent) excludes the most. It rules out circulatory criterion with permanence (as in Case 1), and potentially any account that allows decisions to influence death determination, which could affect higher-brain criteria if they rely on withdrawal choices.
answer: |-
  1. **Biological fact independent of decisions (HARD):** Death must be an objective biological state, not contingent on human choices like withdrawing care. Case 1 (withdrawal making circulation merely permanent) shows why decision-dependence undermines death's status as a biological event.
  2. **Defines the death of the organism *itself*, not proxies (HARD):** The account must specify the cessation of the organism *as a whole*, directly addressing integration, not relying on brain function loss as a potentially flawed indicator. Case 2 (ventilated body with destroyed brain maintaining integration) demonstrates the proxy problem.
  3. **Absolute irreversibility, not technology-relative (HARD):** The cessation must be irreversible in principle (beyond any possible intervention), not merely irreversible given current local capabilities. Case 3 (future perfusion tech recovering brain activity) reveals the instability of tech-dependent irreversibility.
  4. **Unified standard applicable to all contexts (HARD):** The definition must provide one coherent biological standard determining death valid for both withdrawing treatment and organ procurement, avoiding context-dependent meanings. Case 4 (conflict between circulatory and brain prongs) necessitates this unity to prevent contradictory determinations.
  5. **Public justifiability and practical workability (SOFT):** The account must be explainable and defensible to diverse stakeholders (clinicians, families, public) and usable in real-world clinical and legal settings. The policy's triple role (withdrawal, procurement, family communication) and persistent public/scholarly debate demand this, even if metaphysically untidy.

  6. **Subset impossible to jointly satisfy:** Requirements 1 (Biological fact), 3 (Absolute irreversibility), and 4 (Unified standard) cannot be fully reconciled. Requirement 3 (Absolute irreversibility) must give way; practical policy relies on permanence (irreversible *in context*) for circulatory death and accepts technologically-mediated irreversibility for neurological death.

  7. **Most excluding requirement:** Requirement 1 (Biological fact independent of decisions) excludes the most candidates. It definitively excludes the **Circulatory Criterion (Permanent)** and significantly challenges the **Higher-Brain Criterion** if its determination relies on antecedent decisions to withdraw support. It also pressures the "organism-as-a-whole" view if integration loss depends on care choices.
