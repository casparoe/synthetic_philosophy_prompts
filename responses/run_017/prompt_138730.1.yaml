  I should also flag where concepts are contested - like whether Kant really requires conscious maxim-application for moral worth, or whether contemporary virtue ethics would endorse the spontaneous donor.

  The user seems philosophically sophisticated - they're careful about standpoint distinctions and want to avoid reductive labeling. Their frustration with existing frameworks is palpable. I'll need to be equally precise in mapping concepts to their cases while maintaining scholarly integrity about debates in the field.
answer: |-
  1.  **"Action explanation" versus "agent's reason" distinction**: Your observation concerns the gap between the reason *why* an agent acted (the best explanation for the action, often attributed externally) and the reason *for which* they acted (the consideration actually operative in their deliberation). Moral worth seems sensitive to both, prioritizing the latter in the donor case (where the external reason explains but wasn't operative) and the former in the non-liar case (where the internal reason seems disassociated from the real motive).

  2.  **"Opaque" versus "transparent" motivation**: The kidney donor's motivation is opaque to himself (he cannot articulate *why* he did it beyond the situation) yet seems morally worthy, while the colleague's motivation is transparent (she articulates reasons fluently) but seems morally suspect or shallow. The contested issue is whether opacity, when combined with consistent right action, signifies deep virtue or mere unreflective habit lacking full moral worth.

  3.  **Virtuous disposition ("hexis") vs. deliberative judgment**: Aristotle's concept of a stable, ingrained character state (*hexis*) that reliably issues right action without explicit deliberation fits the kidney donor and principled non-liar, contrasting with the colleague's (and perhaps the deliberative donor's) reliance on situational calculation. The fit is strong for spontaneity, but contested is whether Aristotle's *phronesis* (practical wisdom) requires context-sensitive reflection, conflicting with the non-liar's inflexibility.

  4.  **Kantian "acting from duty" vs. "acting in accord with duty"**: Kant's requirement for moral worth is acting *because* the action is morally required (the motive of duty), contrasting with merely doing the right thing for other reasons. Your cases complicate this: the donor seems worthy despite no explicit duty-motive, while the colleague's fluent reasoning might mimic duty but seems disconnected from her actual motive, suggesting a Kantian might question the worth of *both* deliberative agents if duty wasn't their operative maxim.

  5.  **"Identification" with reasons vs. "alien" reasons**: The donor and principled non-liar act from reasons deeply identified with their character (even if unarticulated), while the colleague treats reasons as tools for justification, making them seem alien to her true self. This captures the standpoint difference but is contested; identification theories often require reflective endorsement, conflicting with the donor's lack of deliberation.
