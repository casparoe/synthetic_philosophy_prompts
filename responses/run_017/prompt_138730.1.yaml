  The core tension they identify is between two standpoints: the reason that can be attributed to the agent externally versus the reason that was actually operative in their deliberation. The kidney donor would accept "a stranger would die" as justification if asked, but didn't consciously think that; the principled non-liar can't articulate elaborate reasons but acts consistently. Yet both seem morally praiseworthy in ways that their more deliberative counterparts aren't.

