answer: |-
  ### Essay Question (45 minutes)  
  **"In the case of a contingently existing object, does the rigid designation of two co-referring terms guarantee that their identity is necessary? Construct your answer by:**  
  **(a) Explaining the difference between 'thin' and 'thick' rigidity,  
  (b) Applying both notions to the following scenario:  
   *Specimen 7 is a rabbit cloned in Lab A. Researchers name it ‘Hoppy’ via ostension during cloning. Separately, a newspaper article describes ‘Bouncer’ as ‘the first rabbit cloned via Technique X’ (the technique used for Specimen 7). Suppose Specimen 7 might easily not have existed (e.g., the cloning had a 95% failure rate).*  
  **(c) Assessing whether ‘Hoppy = Bouncer’ is necessary under thin vs. thick rigidity.  
  (d) Evaluating whether the Kripkean move—‘If Hoppy = Bouncer, then necessarily Hoppy = Bouncer’—holds in both frameworks.  
  (e) Discussing whether the aposteriority of ‘Hoppy = Bouncer’ is preserved if necessity is secured."**  

  ---

  ### Model Answer (710 words)  

  **(a) Thin vs. Thick Rigidity**  
  A **thin rigid designator** picks out the same object in every possible world *where that object exists*. In worlds where the object does not exist, it either (i) fails to refer or (ii) refers to whatever satisfies its reference-fixing description (e.g., a descriptive fallback). A **thick rigid designator** picks out the same object in *all* possible worlds, including those where the object does not exist. Here, it "designates" a nonexistent entity, violating existential commitment.  

  **(b) Application to the Scenario**  
  - *Hoppy* (ostensively named in the lab) is **thickly rigid**: It designates Specimen 7 in all worlds, even those where cloning fails and Specimen 7 never exists.  
  - *Bouncer* (fixed by the description “the first rabbit cloned via Technique X”) is **thinly rigid**: In worlds where Specimen 7 exists, ‘Bouncer’ refers to it. In worlds where cloning fails (no such rabbit exists), ‘Bouncer’ either refers to nothing or to whatever rabbit (if any) accidentally satisfies the description.  

  **(c) Necessity of Identity Under Thin vs. Thick Rigidity**  
  - **Thick rigidity (Hoppy)**: ‘Hoppy = Bouncer’ is **necessary**. Since ‘Hoppy’ rigidly picks Specimen 7 in *all* worlds, and ‘Bouncer’ picks Specimen 7 in worlds *where it exists*, in any world where both terms refer (i.e., where Specimen 7 exists), they co-refer. In worlds where Specimen 7 doesn’t exist, ‘Hoppy’ still “designates” it (thickly), but ‘Bouncer’ fails to refer or shifts. However, for the identity statement to be *true*, both terms must successfully refer. Thus, ‘Hoppy = Bouncer’ is true *only* in worlds where Specimen 7 exists—but in those worlds, it is true. Hence, it is **necessarily true when both terms refer**.  
  - **Thin rigidity (Bouncer)**: ‘Hoppy = Bouncer’ is **contingent**. In worlds where cloning succeeds, both refer to Specimen 7 and the identity holds. But in worlds where cloning fails, ‘Bouncer’ refers to nothing (or a different rabbit if one satisfies the description), while ‘Hoppy’ still thickly designates the nonexistent Specimen 7. Here, ‘Hoppy = Bouncer’ is false (since one/both terms lack reference or refer to distinct things). Thus, the identity is true in some worlds (successful cloning) and false in others (failed cloning).  

  **(d) The Kripkean A Priori Move**  
  Kripke’s argument—that ‘If *a* = *b*, then necessarily *a* = *b*’ is knowable *a priori*—**fails for thinly rigid ‘Bouncer’** but **holds for thickly rigid ‘Hoppy’**.  
  - With thick rigidity (‘Hoppy’): We know *a priori* that *if* ‘Hoppy’ and ‘Bouncer’ co-refer in the actual world, then in every world (where both refer), they designate the same object. This follows from rigidity alone.  
  - With thin rigidity (‘Bouncer’): We cannot know *a priori* that co-reference entails necessary identity. Whether ‘Bouncer’ designates Specimen 7 in all worlds where it exists depends on whether the reference-fixing description (“first cloned via Technique X”) *uniquely* picks Specimen 7 across worlds. If another rabbit could satisfy that description in a counterfactual world (e.g., if cloning succeeds twice), ‘Bouncer’ might shift reference. Thus, the necessity of identity isn’t guaranteed by rigidity alone.  

  **(e) Preservation of Aposteriority**  
  - **Thick rigidity**: The identity ‘Hoppy = Bouncer’ is necessary but still **a posteriori**. We need empirical evidence to discover that ‘Hoppy’ (the ostended rabbit) is identical to ‘Bouncer’ (the rabbit fitting the description). The *a priori* conditional (“if they are identical, then necessarily identical”) does not give us the identity itself.  
  - **Thin rigidity**: The identity is contingent and *a posteriori*, so aposteriority is trivially preserved. However, if we try to *force* necessity (e.g., by rigidifying ‘Bouncer’ via dubbing “Let ‘Bouncer’ rigidly designate *this* rabbit”), we revert to thick rigidity—and the identity becomes necessary *and* a posteriori.  

  **2D Semantics Addendum**  
  We might dissolve the tension using two-dimensional intensions:  
  - **Primary intension**: The reference of a term in a world *considered as actual* (e.g., ‘Bouncer’ refers to whatever satisfies “first cloned via Technique X” in the actual world).  
  - **Secondary intension**: The reference in a world *considered as counterfactual*, given fixed actual reference (e.g., ‘Bouncer’ rigidly designates Specimen 7 in other worlds).  
  Here, ‘Hoppy = Bouncer’ has a contingent primary intension (if we imagine a world where cloning fails, ‘Bouncer’ refers to nothing/a different rabbit) but a necessary secondary intension (given actual co-reference). This **redescribes but does not eliminate** the thick/thin distinction: Thick rigidity prioritizes secondary intension; thin rigidity blends both.  

  **Conclusion**: Rigid designation only guarantees necessary identity with *thick* rigidity for contingent entities. The Kripkean a priori move and aposteriority hold under thick rigidity, but thin rigidity makes identity contingent. 2D semantics clarifies the duality but preserves the substantive debate.  

  ---

  ### Marking Scheme (Out of 20)  
  | **Marks** | **A-Grade Requirement**                                                                 | **B-Grade Requirement**                                                                 | **Common Errors**                                                                 |
  |-----------|-----------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------|
  | **2**     | Defines thin/thick rigidity **with explicit reference to contingent existence**.        | Defines both but omits contingency’s role (e.g., vague on how nonexistence worlds work). | Lists definitions without applying to contingency.                                |
  | **3**     | Correctly assigns **Hoppy as thick, Bouncer as thin** with justification (ostension vs. description). | Misses one assignment (e.g., calls both thick) or misjustifies (e.g., “all names are thick”). | Assumes all names are rigid in the same way.                                     |
  | **3**     | **Necessity verdict**: Contingent under thin, necessary under thick. Explains *why* via possible worlds. | Correct verdict but shallow explanation (e.g., “thin allows reference shift”).          | Claims both yield necessity; ignores worlds where cloning fails.                |
  | **3**     | **Kripkean move**: Shows it *fails* for thin rigidity (due to reference instability) but *holds* for thick. | Identifies failure for thin but doesn’t explain *why* (e.g., no link to description fragility). | Assumes the move always works; misses that thin rigidity undermines it.        |
  | **3**     | **Aposteriority**: Argues it is preserved under thick rigidity *despite* necessity. Explains epistemic gap. | Notes aposteriority but doesn’t resolve tension with necessity (e.g., “it’s still empirical”). | Claims necessity implies apriority; conflates the conditional with the identity. |
  | **3**     | **2D semantics**: Defines primary/secondary intensions and maps them to thin/thick. Shows it redescribes the issue. | Mentions 2D but doesn’t define terms or clarify its role.                              | Calls 2D a “solution” without critique; or ignores it entirely.                |
  | **3**     | **Structure**: Logically ordered, addresses all sub-questions, no irrelevance.          | Minor disorganization or one sub-question underdeveloped.                              | Unfocused; omits (d) or (e); excessive historical digressions.                  |

  ---

  ### Footnote: Where the Model Answer Might Be Wrong  
  **Strongest attack**: Thick rigidity is incoherent because it requires designating a *nonexistent* object, violating the principle that reference presupposes existence. If this holds, rigid designation *must* be thin, collapsing the distinction. The necessity of identity would then fail for contingent entities like Specimen 7, forcing a retreat to descriptivism or counterpart theory.  
  - **Credit for students**: Award **extra marks** (up to +2) if raised persuasively with implications for aposteriority (e.g., “If thick rigidity fails, Kripke’s account of necessary a posteriori identities is incomplete for contingent objects”).  
  - **Do not penalize**: This is a sophisticated objection consistent with course themes (e.g., Quinean skepticism about modal logic). Only mark down if undeveloped or irrelevant.
