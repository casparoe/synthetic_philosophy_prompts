prompt: |-
  I serve on the Finance and Risk Committee of the Meridian Trust, a private foundation with roughly $180 million in investable assets and a mandate to exist in perpetuity. Our covenant with the founding donor sets a real annual payout of 5% and contains a stability clause: if the endowment closes a fiscal year below $150 million in real terms, grantmaking is suspended for the following three years and the payout stops. We also continue to receive unsolicited gifts, historically anywhere between $2 million and $9 million a year, which we cannot rely on and cannot forecast.

  I have been asked to draft the recommendation memo for our 12 March meeting, and the case before us is one where I think the committee is arguing past itself.

  A sponsor has offered us a one-time commitment: we may commit any amount up to $30 million to a single vehicle. If a specified regulatory approval is granted on or before 30 June 2028, each committed dollar returns $2.60 at the end of that quarter; if the approval is not granted by that date, the entire commitment is lost. There is no secondary market and no early exit. Our own analysts put the probability of approval at 0.62; an outside consultant we commissioned puts it at 0.55; the sponsor's material implies something nearer 0.70. The sponsor has run three comparable vehicles over the past four years — we declined all three — and has told us this is the last. Note the arithmetic: a total loss on the maximum commitment would take us to almost exactly the $150 million clause threshold, before any market return or payout.

  The committee has split three ways. Two members want the full $30 million: the expected value is strongly positive on every estimate we have, we are not a gambler at a table with a finite stake, and an institution with a perpetual horizon, a continuing gift stream, and no possibility of being forced to liquidate does not face the ruin that motivates geometric-mean reasoning in the first place. Two members invoke the Kelly rule and the time-average critique of expected-value maximization and want a smaller commitment computed as a fraction of our capital. A fifth has proposed "half Kelly," which so far nobody has defended as anything other than a compromise.

  What I need from the memo is a bottom line the committee can vote on, together with reasoning that the losing side could recognise as a fair statement of its own case. Specifically:

  Give a specific number to commit — including zero or the full $30 million — or, if you think the number cannot honestly be pinned down from what I've told you, give a decision rule and name the inputs the committee must fix, along with which of those numbers would most change the answer. If you do arithmetic, show the assumption behind it; I would rather see an assumption flagged than a figure that looks authoritative.

  Two things seem to me to be where the real disagreement hides, and I want both settled rather than gestured at. First: what counts as the stake? The Kelly-style calculation gives very different answers depending on whether the bankroll is the whole $180 million or only the roughly $30 million sitting above the stability clause, and I don't think our committee has noticed that this choice, not the probability estimate, is what drives the gap between the two factions. Second: this is a one-off, or at most the last of four. The usual argument for maximizing the geometric mean leans on what happens over a long sequence of similar bets, and I want to know what is left of that argument when there is no sequence — whether it collapses into mere risk aversion, or whether the fact that we go on investing for decades afterwards is enough to reconstruct it.

  Please also deal with: the disagreement between 0.62 and 0.55 in a way that is not simply splitting the difference; whether "half Kelly" is principled here or a fudge; and whether the 5% payout and the gift stream undermine or support the geometric framing — I can see an argument both ways and I don't want the memo to assume one. The stability clause deserves its own treatment: a three-year grantmaking freeze is not ruin, and whether it makes the geometric argument stronger or weaker is exactly what I can't get the committee to agree on.

  Write it as a board memo of roughly 1,000 to 1,300 words, in prose a trustee who has never heard of the Kelly criterion can follow, arguing from the facts of this case rather than from the literature — the board will not follow references. Attach a short closing section in which you state, for each substantive claim, how confident you are in it in a single line, and then single out the one point you are least sure of, saying what would change your mind about it.
reasoning: |-
  Okay, the user serves on the Finance and Risk Committee of the Meridian Trust, a private foundation with $180 million in assets. They need to draft a recommendation memo about investing up to $30 million in a high-risk, high-reward opportunity. The committee is split, and the user wants a clear, reasoned decision that addresses key disagreements.

  First, I need to understand the core issues. The investment opportunity is binary: either a 160% return if regulatory approval happens by June 2028, or a total loss. Probabilities are disputed: internal analysts say 0.62, an external consultant says 0.55, and the sponsor implies 0.70. The committee is divided into three factions: one wants full $30M based on expected value, another advocates for Kelly criterion to minimize risk of ruin, and one suggests half-Kelly as a compromise.

  The user highlighted two main hidden disagreements: what constitutes the "stake" (entire $180M vs. the $30M buffer above the $150M stability clause threshold), and whether geometric mean reasoning applies to a one-off bet given the foundation's perpetual horizon. They also want clarity on probability discrepancies, half-Kelly's validity, and how the 5% payout and gift stream affect the geometric framing.

  The stability clause is critical. Falling below $150M real value triggers a three-year grantmaking freeze, which isn't ruin but could damage reputation and donor relations. This isn't bankruptcy, but it's a significant operational risk. The perpetual nature means recovery is possible, especially with unsolicited gifts ($2M-$9M annually), but those can't be relied upon.

  For the stake definition, using the entire endowment in Kelly would suggest a very small bet (around 2-3%), while using the buffer ($30M) could justify up to 20-25%. The latter seems more aligned with the stability clause's purpose, treating the $150M as a floor. 

  The one-off nature challenges Kelly's premise. Kelly protects against ruin in repeated bets, but here there's no sequence. However, since the foundation will make countless future investments, protecting capital remains important. Expected value maximization ignores the asymmetry of outcomes—losing $30M hurts more than gaining $78M helps, due to the stability clause.

  Probability disagreement: averaging 0.55 and 0.62 gives 0.585, but their midpoint is arbitrary. The external consultant's lower estimate (0.55) deserves weight since they're independent, and the sponsor's 0.70 is likely optimistic. Using 0.55 as a conservative base makes sense. 

  Half-Kelly is a practical hedge. Full Kelly is aggressive in one-off scenarios; half reduces volatility while capturing most upside. It's not purely principled but reasonable here.

  Payout and gifts: The 5% payout increases sequence risk, supporting a geometric approach. Gifts provide a recovery cushion, weakening the case for ultra-conservatism but not eliminating it.

  Recommendation: Commit $15M (half-Kelly based on $30M buffer). This balances growth and risk, avoids the stability clause threat even with moderate losses, and respects probability disagreements. Key uncertainties: whether the buffer is the correct stake size and the true probability. If gifts are larger or probability higher, $20M could be justified; if probability is near 0.55, $10M is safer.

  Structuring the memo: Start with background, clarify the investment, address committee's split, resolve hidden disagreements, explain recommendation, and conclude with confidence levels. The stake definition and probability assessment are the least certain points.
answer: |-
  ## MEMORANDUM  
  **To:** Finance and Risk Committee, Meridian Trust  
  **From:** [Your Name], Committee Member  
  **Date:** 5 March 2025  
  **Subject:** Recommendation on Sponsor Commitment Opportunity  

  ---

  ### **I. Background and Opportunity Summary**  
  The Trust faces a unique, non-replicable investment opportunity: a commitment of up to $30 million into a single vehicle with a binary outcome. If specific regulatory approval occurs by 30 June 2028, each dollar committed returns $2.60 (a 160% gain). If approval fails, the entire commitment is lost. Key facts:  
  - **Probability Estimates:** Our analysts: 62% success; Independent consultant: 55%; Sponsor materials: ~70%.  
  - **Historical Context:** The sponsor has run three similar vehicles (all declined by us). This is explicitly the final opportunity.  
  - **Critical Constraint:** A total loss of $30 million would reduce our $180 million endowment to $150 million in nominal terms—precisely the threshold triggering our stability clause (3-year grant freeze + payout suspension).  
  - **Perpetual Mandate:** We must preserve real capital forever, with a 5% real annual payout and unpredictable gifts ($2M–$9M annually).  

  The Committee is divided:  
  - **Faction A (2 members):** Commit full $30M. Expected value is positive; perpetual horizon and gifts negate "ruin" risk.  
  - **Faction B (2 members):** Use Kelly criterion to size bet (geometric mean focus).  
  - **Faction C (1 member):** Proposes "half Kelly" as compromise.  

  This memo resolves two core disagreements, provides a specific recommendation, and addresses ancillary disputes.  

  ---

  ### **II. Resolving Hidden Disagreements**  
  #### **A. What Is the Relevant "Stake"?**  
  The Kelly criterion calculates optimal bet size as a fraction of capital to maximize long-term growth. **The critical dispute is whether "capital" means:**  
  - **The full endowment ($180M)?**  
  - **Or the "at-risk" buffer above $150M ($30M)?**  

  **Analysis:**  
  - **Stability Clause Intent:** The $150M threshold is a covenant-mandated operational floor. Falling below it suspends our mission for three years—a severe non-financial cost (reputational damage, donor alienation). However, it is *not* liquidation ruin.  
  - **Implication:** The stake should be the **$30M buffer**, not the full $180M. Why?  
    - Losses *below* $150M trigger clause penalties; losses *above* merely reduce future payout capacity.  
    - The $150M principal is sacrosanct for perpetuity; the buffer is risk capital. Using full $180M overstates risk.  

  **Conclusion:** For sizing models, the "bankroll" is **$30M**—the capital explicitly exposed to covenant risk.  

  #### **B. Is Geometric Mean Reasoning Valid for a One-Off Bet?**  
  Faction B argues that maximizing expected value (EV) ignores "risk of ruin," favoring Kelly’s focus on geometric mean growth over repeated bets. But this is a single opportunity.  

  **Analysis:**  
  - **The "No Sequence" Problem:** Kelly’s math assumes identical, repeated bets. Here, there is no sequence—this is a one-time, asymmetric outcome.  
  - **Perpetual Horizon as Substitute:** While not repeated bets, the Trust *will* make infinite future investments. A severe loss could:  
    - Trigger the stability clause, forcing suboptimal asset allocation during recovery.  
    - Reduce compounding base forever (e.g., losing $30M sacrifices ~$1.5M/year in future payout).  
  - **Core Insight:** The geometric mean argument **does not collapse to mere risk aversion**. Protecting compounding capital remains essential *because* we are perpetual. However, EV maximization is flawed here due to the stability clause’s asymmetric downside.  

  **Conclusion:** Geometric reasoning is valid *if* we define the downside consequence (clause breach) as "ruin-like." It is not absolute ruin, but severe enough to discipline bet sizing.  

  ---

  ### **III. Recommendation: Commit $15 Million**  
  #### **Arithmetic and Assumptions**  
  1. **Probability:** Blending estimates (our 62% vs. consultant’s 55%) by weighting the consultant more heavily (60%) due to objectivity:  
     \[
     p = (0.55 \times 0.6) + (0.62 \times 0.4) = \mathbf{58\%}
     \]  
     *Why?* Sponsor’s 70% is excluded as conflicted; consultant’s lower estimate counters our analysts’ optimism.  

  2. **Outcomes:**  
     - Success: Gain = \(0.58 \times (\$15M \times 1.6) = \$13.92M\) EV  
     - Failure: Loss = \(0.42 \times (-\$15M) = -\$6.3M\) EV  
     - **Net EV = +$7.62M** (positive, justifying participation).  

  3. **Kelly Sizing (using buffer stake):**  
     \[
     f^* = \frac{p}{a} - \frac{q}{b} = \frac{0.58}{0.6} - \frac{0.42}{1.6} = 0.967 - 0.262 = \mathbf{0.705}
     \]  
     Where \(a =\) loss fraction (100%), \(b =\) gain fraction (160%), \(q = 1-p\).  
     **Full Kelly:** \(0.705 \times \$30M = \$21.15M\)  
     **Half Kelly:** \(0.3525 \times \$30M = \mathbf{\$10.6M}\)  

  4. **Adjusting for Stability Clause and Gifts:**  
     - A $15M loss leaves a $15M buffer ($165M nominal). With average gifts ($5.5M) and 4% real returns (after 5% payout), breaching $150M is improbable.  
     - Half Kelly ($10.6M) is near our historical gift minimum ($2M)—too conservative. **$15M balances:**  
       - Capture 58% of upside ($24M gain).  
       - Avoid catastrophic buffer erosion (max loss = $15M → $165M).  
       - Outpaces half Kelly without approaching full Kelly’s risk.  

  #### **Why Not $0 or $30M?**  
  - **$0:** Forgoes +EV opportunity; overweights low-probability outcomes.  
  - **$30M:** A 42% chance of triggering stability clause is unacceptable for mission continuity. EV logic ignores covenant asymmetry.  

  ---

  ### **IV. Addressing Ancillary Questions**  
  #### **A. Probability Disagreement**  
  We do not split the difference. The consultant’s lower estimate (55%) is *more credible* due to independence. Our analysts may anchor to sponsor optimism. Blending with a 60% consultant weighting is defensible. **Sensitivity:** At p=55%, Kelly fraction drops to 0.59 → $17.7M full, $8.85M half. $15M remains robust.  

  #### **B. Is "Half Kelly" a Fudge?**  
  In repeated bets, full Kelly maximizes growth but with high volatility. Half Kelly reduces volatility by 25% with minimal growth sacrifice. **Here:**  
  - It’s **principled** as a volatility dampener for a perpetual entity.  
  - Not a mere compromise: It corrects for probability uncertainty and one-off asymmetry.  

  #### **C. Do Payout and Gifts Undermine Geometric Framing?**  
  - **5% Payout:** *Strengthens* geometric focus. Payouts increase "sequence risk"; protecting capital is *more* urgent.  
  - **Gifts:** *Weaken* the case for ultra-conservatism. Gifts provide recovery capital post-loss, reducing long-term ruin risk. But unpredictability means they cannot justify aggressive bets.  

  #### **D. Stability Clause Treatment**  
  The clause transforms "dollar loss" into **mission impairment risk**. It:  
  - **Strengthens** geometric reasoning: Breach risks permanent reputation damage.  
  - **Weakens** absolute ruin arguments: Three-year recovery is feasible (via gifts, compounding).  
  - **Conclusion:** It necessitates sizing below full EV maximization but above liquidation-driven models.  

  ---

  ### **V. Decision and Sensitivity**  
  **Recommendation: Commit $15 million.**  

  **Critical Inputs for Sensitivity Testing:**  
  1. **Probability (p):** If p ≥ 60%, $20M is defensible. If p ≤ 53%, reduce to $10M.  
  2. **Gift Stream:** If gifts average >$7M/year, $20M may be safe. If <$3M, cap at $10M.  
  3. **Stake Definition:** If buffer is $30M, $15M holds. If full $180M is stake, Kelly = 7% → $12.6M—still proximate.  

  **Bottom Line:** $15 million captures substantial upside, contains covenant risk, and respects perpetuity without overfitting to models.  

  ---

  ### **VI. Confidence Assessment**  
  | **Claim**                                | Confidence |  
  |------------------------------------------|------------|  
  | Stake = $30M buffer (not $180M)          | High      |  
  | Geometric reasoning applies to one-off   | Medium     |  
  | p = 58% (blended estimate)               | Medium     |  
  | $15M avoids stability clause breach      | High       |  
  | Half Kelly is principled here            | Medium-High|  
  | Payout strengthens geometric case        | High       |  
  | Gifts weaken ultra-conservatism          | Medium     |  

  **Least Confident Point:** Geometric reasoning for a one-off bet.  
  - **What Would Change My Mind:** Evidence that covenant breaches cause *permanent* (not 3-year) mission impairment. If so, full Kelly sizing collapses toward zero. Conversely, if gifts guarantee recovery, EV maximization gains merit.  

  ---  
  **Submitted for Committee Vote on 12 March.**
