answer: |-
  ### Decision Tree for Classical Chinese Moral Psychology  
  *(Answer cases using intuitive judgment; follow branches based on "yes" or "no")*

  **1. Does the newborn’s inborn endowment include *anything* that orients it toward normative patterns (e.g., proto-moral reactions), or only raw appetites/capacities?**  
  - **Yes** → Go to 2  
  - **No** (only appetites/capacities) → Go to 3  

  **2. Is this inborn normative orientation *sufficient* to guide full moral development without external shaping?**  
  - **Yes** → **Leaf A**  
  - **No** (it provides direction but requires nourishment) → Go to 4  

  **3. Is the raw inborn endowment *actively detestable* in its crude/unrefined exercise (not merely crude)?**  
  - **Yes** → Go to 5  
  - **No** (crude/deficient but not evil) → **Leaf E**  

  **4. When a fully cultivated person acts virtuously *without inner struggle*, taking pleasure in it, is this the completion of a native trajectory?**  
  - **Yes** → **Leaf A**  
  - **No** (second nature imposed on raw material) → **Leaf F**  

  **5. Does the heart-mind (xin 心) have a distinctive capacity to *override first-order desires* (e.g., appetite) by weighing alternatives?**  
  - **Yes** → Go to 6  
  - **No** → **Leaf B**  

  **6. If a person raised without language/ritual (discovered at 15) shows *no* recognizably moral behavior:**  
  - **This proves the normative tendency was *never there*** → **Leaf D**  
  - **This proves it was *starved* (could have existed)** → **Leaf B**  

  ---

  ### Leaf Identification Table  
  *(Based on answer patterns: Q1–Q6)*  

  | **Answer Pattern** | **Position Name**                     | **Awkward Commitment**                                                                 |
  |--------------------|---------------------------------------|----------------------------------------------------------------------------------------|
  | **Leaf A**: 1Y, 2N, 4Y | **Mencius** (incipient tendencies)    | Must explain why humans *require* cultivation if tendencies are innate and sufficient. |
  | **Leaf B**: 1N, 3Y, 5Y, 6N | **Xunzi** (nature detestable)         | Must explain why humans *can* reliably cultivate virtue if nature is actively corrupt. |
  | **Leaf C**: 1Y, 2Y     | **Unnamed** (Sufficient innate goodness) | Struggles to explain pervasive moral failure without external corruption.             |
  | **Leaf D**: 1N, 3N, 5N | **Gaozi** (nature indeterminate)      | Cannot explain why ritual *consistently* shapes humans toward *goodness* specifically. |
  | **Leaf E**: 1N, 3N, 5Y | **Deflationary Xunzi** (nature crude) | Must explain why crude nature isn’t *resistant* to cultivation.                       |
  | **Leaf F**: 1Y, 2N, 4N | **Compatibilist** (shared endpoint)   | Blurs why Mencius/Xunzi *emphatically* disagree on cultivation’s starting point.      |
  | **Leaf G**: 1N, 3Y, 5N | **Daoist critique** (goodness artifice)| Must explain why humans *seek* ritual if it distorts spontaneous nature.              |
  | **Leaf H**: 1N, 3Y, 5Y, 6Y | **Unnamed** (Starved potential)       | Conflicts with Xunzi’s insistence that nature *lacks* any proto-moral content.        |

  ---

  ### Notes on Logical Gaps & Limits  
  - **Unnamed Leaf C (1Y,2Y)**: Logically possible but unexplored; implies innate goodness requires *no* cultivation, making moral failure incoherent.  
  - **Unnamed Leaf H (1N,3Y,5Y,6Y)**: Incoherent for Xunzi; if nature is detestable, the feral child’s amorality *must* prove no latent goodness existed.  

  **Closing Note**:  
  This tree cannot separate **Compatibilist (Leaf F)** from **Deflationary Xunzi (Leaf E)** on cultivation speed. To distinguish:  
  > *If a cultivated person who turned vicious in a corrupt environment re-learns virtue faster than a novice, does this imply:*  
  > - **Recovery of latent structure (F)**?  
  > - **Malleability of crude material (E)**?  
  > *The "re-teaching" case provides this datum in principle, but interpretations diverge.*
