prompt: |-
  I'm a novelist, and I run a week-long residential workshop for about fourteen fiction writers, mostly literary with a few working in genre. I have one 90-minute slot and nothing but index cards, envelopes, and a timer. I want an activity that makes them feel, in their own practice rather than as a thesis, the old logical puzzle about whether a claim about tomorrow's sea battle is already either true or false — specifically the way it bites when you are the one who gets to decide what tomorrow holds.

  The angle I want to exploit is something I've started calling "back-shadowing": in fiction, a line written early — a scrap of dialogue, a stray image, a throwaway prediction — can be made true or false by a chapter you write three months later, so at the moment of writing there is apparently nothing in the world that settles it, and yet once the draft is closed it seems to have been true all along. I want the group to collide with that themselves. Give me the setup, the roles, the rules, a minute-by-minute timeline, and a debrief that maps specific moments onto the structure of the puzzle. Have them work on scenes from their own works-in-progress so the stakes are small but not fake. No lecture up front, and they shouldn't hear the standard name for the problem until the debrief. Please keep it from sliding into a free-will seminar: what I want them to hit is that the trouble concerns the truth of the sentence, not causation and not who knows what.

  Also tell me what will predictably go the first time I run it — I'd guess writers will make the prediction self-fulfilling or self-defeating to dodge the issue, and will psychologize it into a character's fear — and how to handle each. Be frank about which part of the puzzle the activity cannot stage and that I will have to supply in my own words.

  Finally: mark where you're extrapolating, and if the analogy between back-shadowing and the sea battle is broken in some way that would leave the group with a false picture, say that plainly rather than building a graceful session around it.
reasoning: |-
  We are designing a workshop activity to help fiction writers experience the phenomenon of "back-shadowing" – where an early statement in a story (dialogue, image, prediction) becomes true or false based on later narrative decisions, creating a logical tension similar to the sea battle puzzle (Aristotle's problem of future contingents).

  Key elements:
  - The sea battle puzzle: A statement about a future event (e.g., "There will be a sea battle tomorrow") seems to be either true or false now, but if it is already true (or false) then the future event appears determined, which conflicts with our sense of contingency. However, if it is neither true nor false, then we seem to abandon bivalence (every statement is true or false).
  - In fiction: The writer has the power to make the statement true or false by later writing. At the time of writing the early statement, it is indeterminate, but once the entire draft is fixed, it appears to have been true (or false) all along.

  The activity must:
  - Use only index cards, envelopes, and a timer.
  - Be 90 minutes.
  - Have participants work on their own works-in-progress (WIP).
  - Avoid lecture until debrief; avoid naming the puzzle until then.
  - Focus on the truth of the sentence, not causation, free will, or knowledge.
  - Prevent participants from dodging the issue (e.g., by making the prediction self-fulfilling or self-defeating, or by psychologizing).

  Structure:
  1. Setup (5 minutes): Explain the activity without giving away the philosophical point.
  2. Writing Phase 1 (15 minutes): Participants write an early moment in their WIP that includes a "throwaway" future-oriented statement (dialogue, image, prediction) on an index card. They then seal it in an envelope.
  3. Exchange (5 minutes): Envelopes are collected and redistributed randomly.
  4. Writing Phase 2 (30 minutes): Participants write a later scene in their own WIP that must incorporate the envelope's content (which they have just received from someone else) and decide whether to make the statement true or false in their story.
  5. Reflection (10 minutes): Participants read the original card and their new scene and note their experience.
  6. Group Sharing (15 minutes): Volunteers share what happened and their feelings.
  7. Debrief (10 minutes): Facilitator explains the sea battle puzzle and connects to back-shadowing.

  Predictable Problems and Solutions:
  - Problem: Participants might write a prediction that is self-fulfilling or self-defeating (e.g., a character says "I will win the lottery" and then buys a ticket and wins, or doesn't buy and loses). This dodges the contingency because the outcome is caused by the prediction.
    - Solution: In the instructions for Phase 1, explicitly say: "The statement should not be about the character's own action that directly causes the outcome. Instead, it should be about an external event or another character's action that the speaker cannot control." For example: "It will rain tomorrow" or "The king will die before the year is out."

  - Problem: Participants might psychologize by making the statement only about a character's belief or fear, so it's not about the world but about the character's state.
    - Solution: In instructions, say: "The statement should be about an event in the world of the story, not just a character's internal state." Example: Instead of "I fear the sea battle will happen," use "The sea battle will happen."

  - Problem: The activity might slide into discussions of free will or determinism.
    - Solution: In the debrief, focus on the truth value of the statement and the writer's power to set it. Emphasize that the puzzle is about the logical status of future contingent statements.

  What the activity cannot stage:
  - In the sea battle puzzle, the truth value of the statement is thought to be unsettled because the future is open. In fiction, the writer is the one who settles it. The analogy breaks in that the writer is a god-like controller, whereas in reality we don't have such a controller. However, the experience of the writer mirrors the logical puzzle: at the time of writing the early statement, it is open, but then it gets fixed. The debrief should note that in reality the puzzle remains because we don't have a writer-god, but in fiction we do, and that's why we can create the effect of back-shadowing.

  Detailed Minute-by-Minute Plan:

  Total: 90 minutes

  0:00-0:05 (5 min): Setup
  - "Today we're going to explore how early details in a story can resonate later. You'll be working with your own WIPs. First, I want you to write an early scene that includes a throwaway line of dialogue, an image, or a prediction about something that might happen in the future. The statement should be about an event in the story world that the speaker cannot control (e.g., not about their own immediate action). Write this on an index card. Then we'll exchange these cards, and you'll write a later scene that must incorporate that statement and decide whether it becomes true or false. We're focusing on the truth of the statement, not why it happens or the character's feelings about it. Let's avoid self-fulfilling prophecies: the outcome shouldn't be directly caused by the statement. Example: Instead of a character saying 'I will go to the store' and then going, try 'The store will be closed tomorrow.'"

  0:05-0:20 (15 min): Writing Phase 1
  - Participants write an early scene snippet on an index card. They must include at least one future-oriented statement (with the constraints above). They then put the card in an envelope and seal it.

  0:20-0:25 (5 min): Exchange
  - Collect all envelopes. Shuffle and redistribute randomly. Each participant gets one envelope (not their own).

  0:25-0:55 (30 min): Writing Phase 2
  - Participants open the envelope and read the card they received. They then write a scene from a later point in their own WIP (not the same story as the card they received, but their own story) that must incorporate the statement from the card. They must choose to make the statement either true or false in their story. They should not change the statement. They write this scene on a new index card or on paper (if index cards are too small, provide paper). The focus: the statement must become a fact in their world (either true or false) because of what they write.

  0:55-1:05 (10 min): Reflection
  - Participants look at the original statement (from the envelope) and their new scene. They write a few notes on a card: 
    a) What was the original statement?
    b) Did you make it true or false?
    c) How did it feel to have to commit to making it true or false?
    d) Did it feel like the statement was already true or false when it was written (in the early scene), or did it feel open until you wrote the later scene?

  1:05-1:20 (15 min): Group Sharing
  - Ask for 3-4 volunteers to share:
    - What the original statement was (from the card they received).
    - What they did with it in their own story.
    - Their answers to the reflection questions, especially (c) and (d).

  1:20-1:30 (10 min): Debrief
  - "What we just experienced is a version of an ancient logical puzzle. Aristotle asked: Is the statement 'There will be a sea battle tomorrow' true or false today? If it's true, then the sea battle must happen; if false, then it cannot. But that seems to remove contingency. On the other hand, if it's neither, then we have a third truth value. In fiction, we are the gods of our story. When you wrote the early statement, it was open. But when you wrote the later scene, you fixed it. And now, looking back, it seems like it was always true (or false). This is what I call back-shadowing: the past (in the story) is shadowed by what we decide in the future (of writing). The trouble is about the truth of the sentence at the time it was written. Note: In reality, we don't have a writer-god, so the puzzle remains. But in fiction, we create the illusion of a fixed past."

  Analogy Break:
  - The analogy breaks in that the writer is an external controller who can choose the outcome, whereas in the real sea battle puzzle, there is no such controller. Therefore, the activity might suggest that in reality there is a controller (which is not the point). But we are using the writer's experience to simulate the logical tension. In the debrief, clarify that the real puzzle is about the logical status of future statements without a controller.

  Predictions for First Run:
  - Writers might still try to make the statement self-fulfilling. Be vigilant in the setup and during the activity to remind them to avoid direct causation.
  - They might feel frustrated if the statement doesn't fit their story. Remind them that they are incorporating it arbitrarily for the exercise, and they can adjust the context as needed (but not the statement itself).
  - Some might not see the philosophical point. The debrief must explicitly connect the dots.

  Extrapolations:
  - We are extrapolating the sea battle puzzle to a controlled writing exercise. The key extrapolation is that the writer's decision mimics the "settling" of the future, which in reality is not done by an agent.

  This activity should create a visceral experience of back-shadowing and the logical tension of future contingents.
answer: |-
  ### Workshop Activity: "The Unwritten Tomorrow"  
  **Goal:** To create a visceral experience of "back-shadowing"—the illusion that an early, indeterminate story element was always true/false once later narrative decisions are made—without lecturing on the sea battle puzzle until debrief. Focuses on the *truth status* of a statement, not causation, psychology, or free will.  

  **Materials per Writer:**  
  - 2 index cards (Card A and Card B)  
  - 1 envelope  
  - Timer  

  **Prep (Before Workshop):**  
  - Brief verbal intro only (no lecture). Avoid terms like "truth," "determinism," or "puzzle."  
  - Emphasize: *"This is about how early story fragments resonate later. We’re exploring narrative cause-and-effect from the* writer’s *perspective."*  

  ---

  ### **Timeline (90 Minutes Total)**  
  #### **0:00–0:05 — Setup (5 mins)**  
  - **Script:**  
    *"Grab your materials. You’ll write two scenes from your WIP:*  
    *1. An EARLY scene with a ‘throwaway’ line: a prediction, prophecy, or observation about something that* might *happen later (e.g., dialogue like ‘The bridge will collapse,’ or an image like ‘a vulture circling’).*  
    *Rules:*  
    - *The statement must be about an* external event *outside the speaker’s control (e.g., NOT ‘I will win’—that’s about their action).*  
    - *It should feel incidental—like it* could *go either way.*  
    - *Write this on Card A, seal it in the envelope.*  
    *2. You’ll swap envelopes. Then, write a LATER scene where you* decide *if that statement becomes true or false in your story.*  
    *Key: Focus on the* event itself, *not why it happens or a character’s feelings. Avoid making it self-fulfilling (e.g., if the statement is ‘The bridge will collapse,’ don’t have a character cause the collapse because they believed it).*  
    *We’re examining how a writer’s* later choice *retroactively shapes earlier words."*  

  #### **0:05–0:20 — Writing Phase 1: The "Open" Statement (15 mins)**  
  - **Task:** Writers draft Card A (early scene snippet) with their "throwaway" statement.  
  - **Constraints:**  
    - Statement must be **simple, future-oriented, and non-psychological** (e.g., "The ship sinks tomorrow," "The king dies by winter," "A storm hits the wedding").  
    - No resolution yet—keep it ambiguous.  
    - When done, seal Card A in the envelope.  
  - **Timer:** 15 mins (soft warning at 12 mins).  
  - **Why this works:** Forces writers to create a statement that *feels* unsettled but will later be fixed.  

  #### **0:20–0:25 — Envelope Swap (5 mins)**  
  - Collect envelopes, shuffle, redistribute randomly. Each writer gets someone else’s envelope.  
  - **Crucial:** Writers must use the statement *as written* in their *own* WIP. They cannot alter it.  

  #### **0:25–0:55 — Writing Phase 2: The "Closing" Choice (30 mins)**  
  - **Task:**  
    - Open the envelope, read Card A (the foreign statement).  
    - On Card B, write a later scene from *their own WIP* that **incorporates the statement and makes it either TRUE or FALSE** in their story world.  
  - **Constraints:**  
    - *No self-fulfilling/self-defeating prophecies:* The outcome cannot be caused by the statement (e.g., if Card A says "The ship sinks," the writer can’t have a character scuttle it *because* they read a prophecy).  
    - *No psychology:* Don’t frame it as a character’s fear/mistake (e.g., no "She was wrong about the storm").  
    - Focus on **event truth**: "The ship sank" (true) vs. "The ship sailed safely" (false).  
  - **Timer:** 30 mins (warnings at 15, 25 mins).  

  #### **0:55–1:05 — Reflection (10 mins)**  
  - Writers review Card A (original statement) and Card B (their scene).  
  - **Guided Notes (on a scrap of paper):**  
    1. *What was the statement you received?*  
    2. *Did you make it true or false?*  
    3. *When you wrote Card B, did it feel like you were* deciding *the truth, or revealing what was* always *true?*  
    4. *How did it feel to "lock in" the truth of someone else’s throwaway line?*  

  #### **1:05–1:20 — Group Sharing (15 mins)**  
  - Volunteers (3–4 max) share:  
    - The statement they received + their true/false choice.  
    - Their reflection #3 (deciding vs. revealing).  
  - **Facilitator Questions (keep focused):**  
    - *"Did the statement feel ‘open’ when you first read it?"*  
    - *"When you wrote Card B, were you setting the truth or discovering it?"*  
    - *"Did Card A feel different after writing Card B?"*  

  #### **1:20–1:30 — Debrief (10 mins)**  
  - **Name the Puzzle:** *"You’ve experienced a narrative version of Aristotle’s ‘sea battle’ puzzle: a statement about tomorrow (‘There will be a sea battle’) seems like it must be true or false NOW—but if it’s already true, where’s the contingency? If it’s neither, does that break logic?"*  
  - **Map to Back-Shadowing:**  
    - **Phase 1 (Card A):** Like the sea battle statement *today*—no "fact of the matter" yet. Writers felt its openness.  
    - **Phase 2 (Card B):** Like *tomorrow*—you **decided** the truth, but once set, it retroactively shadows Card A.  
    - **Key Point:** *"In your draft, Card A’s truth wasn’t settled when written—YOU settled it later. But once Card B exists, Card A seems like it was always true/false. That’s back-shadowing: the writer’s choice collapsing possibility into inevitability."*  
  - **Clarify Boundaries:**  
    - *"This isn’t about causation (why the battle happens) or knowledge (who predicts it). It’s about the* logical status *of the statement itself. In reality, there’s no ‘writer’ to decide the sea battle—so the puzzle remains. But in fiction, YOU are the god who retroactively sets truth."*  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Problem: Self-Fulfilling/Self-Defeating Dodges**  
     - Writers might have characters act on the prophecy (e.g., "He avoided the sea, so the battle didn’t happen").  
     - **Solution:** Intervene during setup: *"The outcome can’t be CAUSED by the statement—make it independent. If the statement is ‘The ship sinks,’ the sinking must happen for unrelated reasons."*  

  2. **Problem: Psychologizing**  
     - Writers reduce it to character error (e.g., "She was paranoid about the storm, but it never came").  
     - **Solution:** Redirect in setup: *"Focus on the EVENT, not the character. Did the storm hit? Yes/no. Their feelings are irrelevant here."*  

  3. **Problem: "Why Would I Include This?" Resistance**  
     - Writers struggle to integrate a foreign statement into their WIP.  
     - **Solution:** *"Treat it like an editing pass where you’re revising for thematic resonance. Bend the context, not the statement."*  

  4. **Problem: Over-Intellectualizing**  
     - Participants debate free will/metaphysics mid-activity.  
     - **Solution:** *"Park that thought for the debrief! For now, focus on the mechanics: you’re making a choice about an event."*  

  ---

  ### **Where the Analogy Breaks (Be Transparent!)**  
  - **The Writer-God Problem:** In the sea battle puzzle, there’s no external agent deciding the outcome—reality isn’t "written." But in this exercise, **writers are controllers**, which sidesteps the puzzle’s core tension (contingency in an open future).  
    - **How to Address:** Explicitly say in debrief: *"In reality, no one ‘writes’ the sea battle. Our activity finesses this by making you the decider. But the* feeling *of retroactive fixity—where an open statement becomes ‘always true’—is what back-shadowing exploits in fiction."*  

  - **The "Already True" Illusion:** In fiction, back-shadowing is deliberate craft; in the sea battle, it’s a logical paradox. The activity can’t replicate the *metaphysical unease* of the puzzle—only the *narrative effect*.  
    - **How to Address:** *"The puzzle asks if the statement was true all along. In writing, it wasn’t—you chose it later. But the* illusion *of inevitability is the tool."*  

  ---

  ### **Why This Works**  
  - **Stakes:** Using their WIPs makes choices feel real but low-risk.  
  - **No Lecture:** The experience primes them for the debrief.  
  - **Airtight Focus:** Constraints block escapes into causation/psychology.  
  - **Extrapolations Marked:**  
    - The writer’s god-role is an extrapolation (sea battle has no author).  
    - The "feeling" of retroactive truth is analogous; the metaphysics are not.  

  **First-Run Prediction:** 30% of writers will initially dodge with self-fulfilling/prophetic tropes. Shut this down early with targeted reminders. By Phase 2, most will grasp the weight of "locking in" truth—especially when using someone else’s statement. The debrief then crystallizes why this unsettles logic.  

  **Final Note:** This distills the sea battle to its narrative essence. You’ll supply the missing link in debrief: *"In life, we don’t have a Card B. In fiction, you do—and that’s the power."*
