prompt: |-
  I help run a small heritage-and-education commitee — plaques, anniversary programming, whether to keep funding a local archive — and one member has got hold of Nietzsche's essay on the uses and disadvantages of history for life and now brings it up in every meeting. I've finally read it and I want to bring something to the next meeting that's funny but gets the taxonomy right, because if I get it wrong he'll be insufferable for a year. Can you write it for me?

  What I want is a deadpan bureaucratic document: an internal guidance circular or "consultation draft" from an invented body — the Department of Historical Hygiene, the Office for Historical Dosage, whatever you like — that has been tasked with rationing citizens' intake of the past so that history serves life rather than the other way round. About 700–800 words, short numbered clauses or subsections, memo headings, completely sincere civil-service prose. The rule is that every regulation your Department lays down has to be an exaggeration of something Nietzsche actually says, not an invented vice: monumental history as the dose that has to keep persuading the living that the great dead are repeatable and imitable, and that quietly lets the dead crowd out the living; antiquarian history as the indiscriminate reverence that ends up honouring anything merely old, down to bus timetables, because it can't tell what deserves preservation; critical history as the licence to put the past on trial, together with the awkwardness that what you condemn is what you descend from, so the trial can't be a clean amputation; plus the bits about the animal that forgets and is happy, the horizon a culture needs to draw around itself, "plastic power" as the capacity that decides how much past a person or a people can absorb without going under, the historical fever of the modern person dragging around more knowledge than can be digested, and the contrast between the unhistorical and the suprahistorical. Don't have the narrator explain any of this, and don't let the document wink — it should be legible what's being sent up without anyone saying so. It can go Swiftian in one place: let the Department follow its own logic to a proposal a reader recoils from, compulsory forgetting or licensed ancestor-renunciation or whatever. Include one worked case (a citizen or institution whose file is assessed and given a prescription) and at least one objection quoted from a spokesperson for an invented professional body — the Association for Disinterested Historical Research, say — and make that objection more than a strawman: give them one complaint the Department genuinely can't answer, since the joke is that they are exactly the target of the essay.

  Keep it fair enough that someone who knows the essay finds the satire accurate rather than a cariculture, and keep it readable for my committee, who mostly haven't read it. Afterwards, in your own voice, add a 100–150 word note: where the piece exaggerates, where it leans on a reading of Nietzsche that's contested (e.g. whether the three modes are meant to be held in balance, whether critical history is meant to be corrosive by design, whether "life" is really doing the work of a criterion), and if you think the premise of the satire misreads him, say that in the note rather than quietly fixing it inside the piece. Finish with one last line in exactly this form: \answer{one sentence naming the liberty you took that a Nietzsche specialist would object to most}.
reasoning: |-
  Okay, the user runs a small heritage committee and needs help dealing with a member who constantly references Nietzsche's essay. They want a satirical bureaucratic document that exaggerates Nietzsche's ideas without caricaturing them, presented as an official memo. 

  First, I need to ensure I understand Nietzsche's three modes of history correctly: monumental (idealizing past heroes), antiquarian (preserving everything old), and critical (judging the past destructively). The user specifically wants exaggerations of these, plus concepts like "plastic power" and the dangers of historical overload. 

  The challenge is balancing humor with accuracy. The document must feel like real bureaucracy—dry, procedural, with numbered clauses—while making Nietzsche's points absurdly literal. For example, turning "plastic power" into a measurable quota system. The Swiftian twist could be a "Historical Sanitation Order" mandating destruction of low-value archives, which mirrors Nietzsche's worry about suffocating under the past.

  The case study (St. Cuthbert's College) should show all three excesses: monumental (pointless statues), antiquarian (hoarding junk), critical (self-flagellating lectures). The professional objection needs teeth—here, the historian arguing that "life" is too vague a standard, which Nietzsche himself might concede. That keeps the satire fair.

  In the note, I'll clarify contested readings: Nietzsche likely saw the modes as complementary, not rigidly separated, and "life" is ambiguous. The biggest liberty is implying the Department can neutrally administer history, whereas Nietzsche thought only great individuals could healthily use the past. 

  User clearly knows the essay well but wants accessibility for the committee. The tone must stay deadpan—no winking at the audience. And that last line must precisely format as requested.
answer: |-
  ## INTERNAL GUIDANCE CIRCULAR  
  HHS/DH/24/09  
  Department of Historical Hygiene  
  Office of the Chief Sanitarian for Chronological Wellbeing  

  **Subject:** Implementation of Directive 7: Regulating Historical Consumption for Optimal Vital Function (Consultation Draft)  

  1.  **Preamble:** Pursuant to Public Health (Temporal Burden) Act 2023, this Department is mandated to safeguard the populace against Historical Malnutrition (Deficit) and Historical Indigestion (Surfeit). Excessive or disordered engagement with the past demonstrably erodes Plastic Power (PP) – the innate capacity to assimilate historical matter into healthy contemporary life – leading to Cultural Atrophy or Historical Fever. This Circular establishes protocols for the Prescriptive Regulation of Historical Intake (PRHI) to ensure History serves *Life*, not vice versa.

  2.  **Assessment of Plastic Power (PP):** All institutions and designated citizen cohorts (Annex A) must undergo biennial PP assessment (Form DH-114). PP is quantified on the Lichtenbaum Scale (0-100), measuring:
      *   2.1. **Assimilation Threshold:** Maximal volume of past events absorbable without metabolic toxicity.
      *   2.2. **Horizon Integrity:** Ability to maintain a vital, action-oriented focus on the present/future, limiting historical input to a necessary, bounded sphere.
      *   2.3. **Metabolic Efficiency:** Capacity to transform historical matter into actionable energy ("monumental"), nourishing identity ("antiquarian"), or liberating critique ("critical") without autotoxicity.

  3.  **Classification of Historical Matter & Dosage Limits:**
      *   3.1. **Monumental Grade (MG):** History presenting exemplary, energizing figures/events. **Prescription:** Stimulant. Effective in low doses (≤5% total weekly Historical Consumption Units [HCUs]) to inspire present action. **Overdose Symptoms:** Delusional imitation of irreplicable past figures; neglect of contemporary potential; passive spectatorhood. **Mandatory Co-administration:** Reality Assessment Module (RAM-7).
      *   3.2. **Antiquarian Grade (AG):** History focused on preservation, lineage, and veneration of the old *qua* old. **Prescription:** Nutritive. Essential for communal identity in moderate doses (≤15% HCUs). **Overdose Symptoms:** Undiscriminating reverence; pathological hoarding of obsolete artefacts/data (e.g., pre-digital transport schedules, minor administrative ephemera); inability to discard; present suffocated by accumulated detritus. **Contraindication:** Low PP scores (<30 Lichtenbaum).
      *   3.3. **Critical Grade (CG):** History employing judgement to condemn past injustice/error. **Prescription:** Cathartic/Purgative. Necessary in controlled bursts (≤10% HCUs, max 2 consecutive weeks). **Overdose Symptoms:** Chronic cultural self-loathing; destructive rupture from essential lineage; sterile negation; failure to recognize condemned past as constituent of present identity ("trial without clean amputation"). **Warning:** High risk of autoimmune collapse. Requires PP >50.

  4.  **The Unhistorical Imperative:** A baseline capacity for **Forgetting** (Unhistorical Function - UHF) is vital for animal health and present-moment action. Institutions/citizens scoring <5 on UHF Subscale (DH-114, Sect. 4) must undertake Mandatory Forgetting Exercises (MFE-Programme Gamma: supervised non-retrospection).

  5.  **Suprahistorical Considerations:** Activities fostering creation *ex nihilo* or contemplating timeless aesthetic/ethical constants (Suprahistorical Function - SHF) are exempt from HCU limits. SHF is the antithesis of Historical Fever and the goal of regulated PP.

  6.  **Case Study - Application of PRHI:**  
      **Subject:** St. Cuthbert's College Heritage Foundation (PP Assessment: 28 Lichtenbaum; UHF: 3/10).  
      *   **Diagnosis:** Acute Antiquarian Hoarding (AG overdose: 65% HCUs - archival storage of 7000+ uncatalogued meal tickets, 1890-1950); Monumental Paralysis (MG overdose: 20% HCUs - annual re-enactments of Founder's "decisive" tea-break, deemed non-replicable); Critical Autoimmunity (CG overdose: 15% HCUs - perpetual seminars on institutional complicity in historical weather patterns).  
      *   **Prescription:**  
          *   Immediate 12-month Critical Grade moratorium.  
          *   Monumental intake reduced to 2% HCUs; focus shifted to *potential* future alumni achievement.  
          *   Antiquarian intake capped at 5% HCUs. Mandated Historical Sanitation Order (HSO-4) enacted: 85% of uncatalogued ephemera designated for secure disposal.  
          *   Mandatory enrolment in MFE-Programme Gamma (3x weekly).  
          *   Goal: Raise PP to >45 within 24 months.

  7.  **Proposed Intervention - Historical Sanitation Orders (HSOs):** To combat Antiquarian Surfeit and liberate suffocated presents, Department Officers may issue HSOs requiring the delisting, deaccessioning, or secure disposal of historical material deemed:
      *   7.1. Lacking demonstrable Monumental stimulus value.
      *   7.2. Possessing negligible Antiquarian nutritive value for current identity formation.
      *   7.3. Redundant, obsolete, or constituting "mere chronological clutter" inhibiting vital Unhistorical function.  
      *(See Draft Schedule of Presumptively Non-Essential Matter - Annex B: Includes duplicate municipal invoices >50 yrs old, incomplete personal correspondence of non-significant figures, superseded technical manuals without unique historical import, partial runs of defunct commercial catalogues).*

  8.  **Professional Consultation Response (Excerpt):**  
      > *"The Association for Disinterested Historical Research (ADIHR) acknowledges the Department's concerns regarding imbalance. However, the core premise of 'Life' as the sole criterion is fundamentally flawed. It is inherently subjective and prioritizes transient contemporary utility over the intrinsic value of knowledge and the objective reality of the past. True historical understanding requires detachment from present imperatives – precisely the 'disinterested' stance Directive 7 pathologizes as 'Historical Fever'. Our duty is to the past *as it was*, irrespective of its current 'digestibility'. The proposed HSOs constitute state-sanctioned vandalism, erasing the very substrate future generations may need to understand their own moment. Plastic Power seems merely a euphemism for enforced historical amnesia."*  
      > **— Prof. A. Thwaite, ADIHR Spokesperson**

  9.  **Implementation & Compliance:** PRHI schedules commence 01/04/25. Non-compliance may trigger PP Re-education Programmes or, in cases of severe, wilful Antiquarian Hoarding or Critical Autoimmunity, Temporary Cessation Orders (TCOs) suspending institutional historical activities pending remediation.  
      **Signed,**  
      *Dr. E. V. Vitalis*  
      Chief Sanitarian for Chronological Wellbeing  
      Department of Historical Hygiene  
      ---

  **Explanatory Note:**

  This satire exaggerates Nietzsche's core arguments from *On the Uses and Disadvantages of History for Life* by literalizing his diagnoses into bureaucratic policy. The three modes (monumental, antiquarian, critical) are presented as strictly defined, rationed substances, highlighting Nietzsche's view of their potential dangers when excessive or unbalanced. Concepts like Plastic Power (assimilation capacity), the Horizon (necessary limitation), Unhistorical (forgetting), and Suprahistorical (escape from historical time) are treated as measurable metrics. The Swiftian element is the proposed "Historical Sanitation Orders" (HSO), taking the critique of antiquarian hoarding to its logical, chilling extreme of mandated disposal, embodying Nietzsche's fear of the past suffocating the present. The ADIHR objection voices a legitimate counter: Nietzsche's grounding in "Life" *is* subjective and risks instrumentalizing history solely for present utility, potentially dismissing "disinterested" knowledge – though Nietzsche would argue such "objectivity" is itself life-denying. The satire leans towards viewing the three modes as dangers needing suppression rather than forces a healthy individual/culture dynamically balances. It also implies "Life" is a clear, administrable standard, whereas Nietzsche leaves its content deliberately ambiguous, rooted in vitality, creation, and growth, not bureaucratic definition. The premise slightly misreads Nietzsche by suggesting a central authority *can* effectively administer this balance, which he likely saw as an intensely individual/cultural achievement, not a top-down regulation. The most contestable liberty is portraying the Department as neutrally defining "Life's" needs, ignoring Nietzsche's view that only the "strong" individual or culture can healthily *use* history, making universal regulation impossible and potentially life-stifling itself.

  \answer{Portraying the Department of Historical Hygiene as capable of neutrally defining and administering "Life" as the criterion for historical value, ignoring Nietzsche's insistence that only the exceptional individual or vital culture possesses the inherent strength ("plastic power") to healthily *use* history, making such universal bureaucratic regulation both impossible and antithetical to his philosophy.}
