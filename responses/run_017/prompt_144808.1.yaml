prompt: |-
  My reading group (four of us, no philosophy background, we've been picking at Wittgenstein's On Certainty for months) finally had a real fight last night, and I want your number on it rather than a menu of positions.

  The bit I think we all got: some commitments — that I've got two hands, that the earth was around long before I was born, that objects don't pop out of existence when nobody's looking — aren't held on evidence and aren't open to doubt, because they're the frame that makes anything count as evidence for anything in the first place. Call them hinges. The fight is about how far that goes. Priya's objection: from inside the theory, a devout person for whom "God hears prayers" is utterly fixed and a hard atheist for whom "no mind is listening" is equally fixed look exactly alike, so hinge talk collapses into "whatever you can't bring yourself to doubt is in order," and it can never call a fanatic or a conspiracy theorist irrational. She thinks that's fatal.

  My answer was what I've been calling the load-bearing test: a real hinge isn't merely a conviction you can't shake, it's one that holds up a practice of giving and asking for reasons — it decides what counts as a reason for what. On that test, "God hears prayers" may be unshakable, but if it doesn't regulate what you'll accept as evidence for anything, its not a hinge, just an obstinate belief, and the theory doesn't have to bless it.

  Give me your credence that the load-bearing test rescues hinge epistemology from Priya's objection. Decompose it: whether the test really excludes the cases she's worried about, or whether religious/political/conspiracy-shaped certainties turn out to be load-bearing inside some local practice anyway; whether "load-bearing" can be told apart from "deeply entrenched" without already assuming what's a hinge; how much rides on whether hinges are the kind of thing that could be true or false at all rather than rules or animal reactions; and whether the theory should even want to escape, or whether it's fine that adjudication just stops at the hinges. Number plus one line of justification per term, then the combination. Priya's around 0.25 and I'm around 0.7, so also tell me which sub-question the two of us are most likely actually disagreeing about, and what would move you most. Last line: \answer{0.XX}.
reasoning: |-
  Hmm, the user is in a reading group tackling Wittgenstein's On Certainty, and they've hit a snag over hinge epistemology. The core idea is that some beliefs, like having two hands or the earth being old, aren't based on evidence but are the framework that makes evidence possible. Priya objects that this makes any unshakeable belief—like religious or conspiracy convictions—seem equally valid, which she thinks is a fatal flaw. The user proposed a "load-bearing test": a real hinge isn't just unshakeable but must actively structure how we give and ask for reasons. They want my credence on whether this test saves hinge epistemology from Priya's objection.

  I need to break this down into specific sub-questions as requested. First, does the load-bearing test actually exclude problematic cases like fanaticism or conspiracy theories? Priya's worried that if someone's belief is unshakeable and central to their worldview, it might still count as load-bearing in their local practice. For example, a conspiracy theorist might have a "hinge" that "the government lies" and build a whole reasoning structure around it. So this part is weak—maybe only 20% effective because local practices can make anything seem load-bearing.

  Second, can we distinguish "load-bearing" from just "deeply entrenched" without already assuming what a hinge ought to be? This seems circular. If we define load-bearing as something that supports rational practices, we're smuggling in an external standard, which goes against Wittgenstein's descriptive approach. Credence here is low, say 15%, because the theory itself resists such judgments.

  Third, how much depends on whether hinges are truth-apt or more like rules? If hinges are like grammatical rules (e.g., "objects persist unobserved"), they're not true/false but constitutive. But beliefs like "God hears prayers" feel truth-apt. If hinges are non-propositional, the test might work better by excluding them, but it's messy—maybe 40% of the issue hinges on this.

  Fourth, should hinge epistemology even try to escape this? Wittgenstein might say no—adjudication stops at the hinges, and criticizing from outside is like scolding a squirrel. So the theory might not need "saving." Priya wants rationality gates; the user wants to exclude extremes. This is a big philosophical divide, accounting for maybe 25% of the disagreement.

  Overall, the load-bearing test doesn't fully resolve Priya's worry because it can't cleanly separate real hinges from local dogmas without external norms. My combined credence is 35%, meaning I'm skeptical it works. The user and Priya likely disagree most on the fourth point: whether hinge epistemology should judge hinges or just describe them. To move me, I'd need to see how "load-bearing" is defined internally without circularity.

  Final credence: 0.35.
answer: |-
  Here's my decomposed analysis of whether the load-bearing test rescues hinge epistemology from Priya's objection, with credences and one-line justifications for each component, followed by the combined credence, the core disagreement point, and what could move me.

  1.  **Does the test exclude problematic cases (fanaticism/conspiracies)?**  
      *Credence: 0.20*  
      Justification: It fails because beliefs like "God hears prayers" or "elections are rigged" *do* operate as load-bearing hinges within isolated epistemic communities, structuring local evidence-assessment (e.g., prayer outcomes "confirm" divine attention, anomalies "prove" fraud).  

  2.  **Can "load-bearing" be distinguished from "deeply entrenched" without circularity?**  
      *Credence: 0.15*  
      Justification: No—identifying a "practice of giving reasons" requires prior assumptions about what counts as rational, risking question-begging (e.g., dismissing conspiracy practices as "not real reasoning" assumes mainstream hinges).  

  3.  **How much rides on hinges being non-truth-apt (rules/reactions) vs. truth-apt?**  
      *Credence: 0.40*  
      Justification: High stakes—if hinges are animal certainties (e.g., sensorimotor world-persistence), the test excludes ideological beliefs; if propositional, it can't block Priya's cases (e.g., "no mind is listening" feels truth-apt but functions hinge-like for atheists).  

  4.  **Should the theory even want to escape (adjudication stops at hinges)?**  
      *Credence: 0.80*  
      Justification: Yes, Wittgenstein likely endorses this—hinges are where justification ends, not where rationality is judged externally; rejecting this collapses into foundationalism.  

  **Combined credence that the test rescues the theory: 0.35**  
  The test partially mitigates Priya's worry by emphasizing practice over psychology, but it fails to draw a non-arbitrary line (components 1-2) and over-relies on hinge ontology (component 3). Hinge epistemology's strength is describing certainty, not normatively policing it (component 4), so "rescue" may be misguided.  

  **You and Priya's core disagreement:** Component 4 (whether adjudication should stop at hinges). Priya (credence ~0.25) implicitly demands external rationality standards; you (~0.70) accept hinges as terminus. This reflects her fear of relativism vs. your focus on descriptive limits.  

  **What would move me most:** A non-circular account of "load-bearing" that excludes conspiracy/religious hinges *without* smuggling in contested epistemic norms (e.g., showing hinges must be pre-linguistic or universally embodied). Empirical work on delusion (e.g., Capgras syndrome) might help—if such beliefs disrupt *all* reason-giving, not just local practices, they’re not hinges.  

  \answer{0.35}
