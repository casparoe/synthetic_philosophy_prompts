answer: |-
  ### The case as you're reading it
  In variant one, a demon uses a pre-initialized M-bit register (all 0s) to record molecular positions in a Szilárd engine. Each cycle: it measures the molecule's side (cost-free), opens the shutter, extracts kT ln 2 work via isothermal expansion, and stores the result without erasing. After M cycles, it has extracted M·kT ln 2 work, filled the register with a "random" string (correlated with the gas), and exported no heat. The puzzle: net work seems unbounded without entropy compensation. I tightened your setup by specifying that the *initial blank register* is prepared externally at the start, and the system is sealed except for work extraction.

  ### Cycle-by-cycle bookkeeping
  **Per cycle (cycle j, bit j used):**
  - **Initial state:** Register bit j is 0 (known state, entropy S_reg,j = 0). Gas has one molecule in left/right half (entropy S_gas = k ln 2).
  - **Measurement:** Demon determines molecule's side (say, left). This correlates the gas state with the register. No work/heat cost (reversible measurement assumed).
  - **Work extraction:** Demon opens shutter, gas expands isothermally doing W_j = kT ln 2 work *on the piston*. Gas entropy increases by ΔS_gas = k ln 2 (now uniformly fills container). Register bit is set to (e.g.) 1 to record "left".
  - **Entropy changes:**  
    ΔS_gas = +k ln 2 (gas randomized)  
    ΔS_reg,j = 0 → k ln 2 (bit flipped from known 0 to specific 1, gaining k ln 2 entropy)  
    Combined system (gas + register): ΔS_total = ΔS_gas + ΔS_reg,j = +k ln 2 + k ln 2 = +2k ln 2.  
    Work extracted: W_j = kT ln 2.  
    *Accounting:* The work W_j = kT ln 2 came from the heat bath (isothermal expansion). The entropy increase of the gas (k ln 2) is balanced by the entropy decrease of the heat bath (ΔS_bath = -Q/T = - (W_j)/T = -k ln 2). The *register's* entropy increase (k ln 2) is **uncompensated by heat transfer** this cycle.  
    **Net per cycle:** Heat bath entropy ↓k ln 2, Register entropy ↑k ln 2, Gas entropy ↑k ln 2. Total entropy (gas + register + bath) constant, as expected for reversible steps. Work is extracted by harnessing heat flow from the bath.

  **Lifetime (M cycles):**
  - **Work extracted:** W_total = M·kT ln 2 (from heat bath).
  - **Final register entropy:** S_reg = M·k ln 2 (contains M bits of information about gas history).
  - **Entropy changes (gas + register + bath):**  
    ΔS_gas = +M·k ln 2 (fully expanded gas).  
    ΔS_reg = 0 → M·k ln 2.  
    ΔS_bath = - (Total Work)/T = -M·k ln 2.  
    **Total ΔS_universe = ΔS_gas + ΔS_reg + ΔS_bath = M·k ln 2 + M·k ln 2 - M·k ln 2 = +M·k ln 2.**  
    *Accounting:* The total entropy increase arises solely because the register started with S_reg = 0 (M bits known) and ends with S_reg = M·k ln 2 (M bits unknown). The "cost" wasn't paid *during* operation or *via erasure*; it was **prepaid externally** when the low-entropy (blank, ordered) register was created and handed to the demon. The second law is satisfied because the entropy decrease represented by the blank register (a free energy resource) was converted into work. There is **no "end payment"** needed *if* the register stays full. The entropy is stored in the register's microstate.

  ### What is settled
  There is **no dispute** on these points:
  1.  **Landauer's Principle:** Erasing 1 bit *irreversibly* must dissipate at least kT ln 2 heat.
  2.  **The Demon Needs Resources:** A demon operating cyclically cannot violate the second law. Any work extracted must be balanced by an entropy increase *somewhere*.
  3.  **Accounting for Variant 1:** The work extraction in your never-erasing demon is thermodynamically accounted for by the **initial low entropy of the blank memory register**. Creating that blank register required exporting entropy (or consuming free energy) externally. The filled register holds the entropy increase corresponding to the work extracted. Total entropy (including memory and its preparation) increases.
  4.  **Reversible Measurement:** Measurement, in principle, *can* be thermodynamically reversible and cost no work or heat. The fundamental cost lies in preparing/resetting the measuring apparatus (register) to a standard state.

  ### What is contested
  **(2) Erasure vs. Resource Circularity:**  
  *   **Erasure Story:** Proponents argue Landauer clarifies *how* the cost manifests in computational demons, shifting focus to information as a thermodynamic resource. It's seen as *explanatory*, not circular, by showing measurement alone isn't the cost.  
  *   **Resource/Circularity View:** Critics argue Landauer simply reframes the second law ("low-entropy resources are needed") without adding fundamental insight. The bit-counting is useful bookkeeping but doesn't "explain" the second law; it *assumes* it.  
  *   **Lean:** Most specialists accept Landauer as a valid *mechanism* within thermodynamics. Few see it as *circular*, but debates persist on whether it provides *novel explanatory power* versus elegant accounting. The "independent work" is showing information processing has *inherent* thermodynamic costs derivable from physics.

  **(3) Measurement Cost:**  
  *   **Settled Core:** The *acquisition* of information (the physical measurement step) can be reversible. The fundamental cost is in preparing/resetting the measuring device.  
  *   **Contested Nuance:** In *practical* implementations (e.g., real sensors), measurement often dissipates heat due to irreversibility, leading some to argue measurement *always* has an inevitable cost in reality. Others maintain this is merely an engineering limitation.  
  *   **Lean:** Consensus holds that *idealized, reversible* measurement is possible in principle. The "bill" definitively falls on preparation/reset.

  **(4) Usable Information vs. Correlation (Variant 2):**  
  *   **The Distinction:** Scrambling the register reversibly preserves the *total correlation* (mutual information) between the demon and the gas but destroys *local, addressable information* the demon can use for feedback.  
  *   **Does it Help?** No. The demon cannot extract more work *in subsequent cycles* using the scrambled register because it lacks accessible information to control the piston/shutter.  
  *   **Thermodynamic Weight:** The distinction *does* matter for work extraction capability. Addressable information enables control. However, **thermodynamically, the key is the initial resource:**  
      *   The *initial blank register* was still a low-entropy resource consumed.  
      *   The *scrambling operation* itself, being reversible, costs no entropy.  
      *   The *correlation* stored in the scrambled register represents a thermodynamic resource *if* it could be accessed (e.g., to run the engine backwards). But for *this* demon to operate cyclically, it needs *new* blank bits or a way to reset the old ones. The demon "runs out" of **low-entropy degrees of freedom** it can independently control to record *new* measurements. The usable resource (blank bits) is depleted.  
  *   **Lean:** Specialists agree usable information is necessary for control/feedback. Thermodynamically, the consumed resource is the initial negentropy (low entropy) of the blank register, regardless of what happens to the correlations later. The scrambling doesn't recover the initial low-entropy state needed for new measurements. *(Note: This involves entropy accounting for correlated systems, slightly beyond the core Szilárd/Landauer you covered, but is standard in modern treatments. Not contested on this point.)*

  ### The question to put to my TA
  "**If the never-erasing demon extracts M·kT ln 2 work using a pre-initialized blank register, and the final entropy increase of the universe is exactly M·k ln 2 located entirely within the filled register, doesn't this mean the fundamental thermodynamic cost was prepaid during the *initialization* of the blank register, not during erasure? If so, does Landauer's principle (focused on erasure) merely identify *one way* the cost might be paid later, rather than being the *essential* reason the second law is upheld?**"  
  *(This forces the issue on whether erasure is fundamental or just one mechanism, and highlights the role of the initial low-entropy resource.)*
