prompt: |-
  I teach one fifty-minute section next week introducing the Frege–Geach problem to second-years who can recite the non-cognitivist package — moral judgments are not beliefs, they are desire-like states that assertion expresses — but who have met none of the responses. Give me a plan for the hour, not an explanation of the problem.

  My half-formed idea is about sequencing. Presentations I have seen all open with the moral modus ponens, and I now think that is a mistake: the conditional is exactly the embedding where the standard reply, states directed at combinations of states, gets its grip most easily, so students conclude they have answered the problem before they have felt it. I want to open with negated and disjoined moral sentences instead — Murder is not wrong, and Either lying is wrong or promise-breaking is — where there is no tidy combination of attitudes for that reply to take hold of, and only then move to the conditional and to inference. Tell me whether that ordering survives scrutiny, what it costs (I worry it lets the problem look like a puzzle about disapproval rather than about validity), and whether I should also drop the usual warm-up of paraphrasing each moral clause into an attitude and watching the argument stop looking valid, which has always struck me as making the whole thing feel like a parlor trick.

  Then: the one example that should carry the hour and what it must have and lack; the misconceptions in the order they will form — I expect the crude boo–hurrah caricature, the idea that expressivists can simply hand over a truth-conditional semantics, and the conflation of this problem with the problem of moral disagreement — each with the point in the sequence where it should be defused; what I need to say about validity before any semantics is on the board; what to decline to get into at this level; and one question for the last five minutes that would show me a student has the problem rather than the slogan.
reasoning: |-
  Okay, I need to help this philosophy professor plan a fifty-minute session on the Frege-Geach problem for second-year students. The students know the basics of non-cognitivism—moral judgments aren't beliefs but desire-like states expressed through assertion—but haven't encountered any responses to the Frege-Geach problem. The professor wants to avoid starting with modus ponens and instead begin with negation and disjunction to make the problem feel more acute. They're concerned about potential misconceptions and want advice on sequencing, key examples, and assessment.

  First, I should validate their half-formed idea about sequencing. Starting with negated and disjoined moral sentences makes sense because it prevents students from prematurely latching onto the "combination of attitudes" solution, which works better for conditionals. But I need to address their worry—that this approach might make the problem seem like it's about disapproval rather than validity. How can I structure the lesson to emphasize validity from the start?

  The professor also questions whether to include the standard warm-up exercise of paraphrasing moral clauses into attitudes, which they feel makes the problem look like a "parlor trick." I think skipping it is wise to maintain focus on the deeper issue of logical structure. Instead, I'll suggest grounding the discussion in validity upfront—maybe by defining what makes an argument valid (truth preservation) as a shared criterion before any semantics is introduced.

  For misconceptions, I anticipate three main ones: 
  1. The "boo-hurrah caricature" where students reduce expressivism to simple emotivism. 
  2. Thinking expressivists can just adopt truth-conditional semantics. 
  3. Conflating this with moral disagreement. Defusing these requires proactive framing—e.g., distinguishing attitudes from crude emotivism early on, emphasizing that truth conditions don't solve the embedding issue, and clarifying that disagreement is a separate challenge.

  The core example should be simple yet versatile. "Lying is wrong" for atomic cases, then move to "Murder is not wrong" and "Either lying is wrong or promise-breaking is." Avoid conditionals until later to let the problem simmer. For modus ponens, I'll suggest a classic like "If lying is wrong, getting your little brother to lie is wrong" paired with the atomic claim.

  Timing is tight: fifty minutes means strict pacing. I'll allocate: 
  - 5 mins for validity setup 
  - 15 mins for negation/disjunction 
  - 15 mins for conditionals/inference 
  - 10 mins for synthesis and Q&A 
  - 5 mins for a closing question to check understanding.

  The closing question should reveal if students grasp the problem deeply—e.g., "Why can't expressivists say a disjunction expresses indecision?" This probes whether they see the compositional challenge, not just surface issues.

  Lastly, I'll note what to avoid: hybrid theories, quasi-realism details, or historical debates. Keep it focused on Geach's core challenge for beginners.
answer: |-
  Here’s a streamlined, battle-tested plan for your fifty-minute session, centered on your sequencing insight and designed to preempt misconceptions. Your instinct to **start with negation/disjunction** is pedagogically sound—it forces students to confront the *compositional* heart of the problem before offering them the "tempting escape" of attitude combinations for conditionals.

  ### **Minute-by-Minute Plan**  
  **Total: 50 mins**  

  1.  **(5 mins) Framing Validity & Setting Stakes**  
      - Start with: *"We agree valid arguments preserve truth. Non-cognitivists say moral sentences aren’t truth-apt. How can moral sentences *function* in logic if they aren’t about truth? This isn’t about ‘disapproval’—it’s about whether moral logic is possible at all."*  
      - **Key move:** Define validity as "truth preservation in all possible worlds" (no semantics yet). Stress that the problem targets *logical structure*, not moral psychology.  

  2.  **(15 mins) Atomic & Negated Claims: Feeling the Bite**  
      - **Example 1 (Atomic):** "Lying is wrong."  
        - *Paraphrase:* Expresses disapproval of lying. (Students recite this easily.)  
      - **Example 2 (Negation):** "Murder is not wrong."  
        - *Challenge:* "What attitude does this express? *Not disapproving* of murder? But that could describe a rock! If it’s *tolerance*, is tolerance the ‘negation’ of disapproval? What’s the logical structure here?"  
        - **Defuse misconception #1 (boo-hurrah):** "This isn’t about finding synonyms for ‘boo’ or ‘hurrah.’ We’re asking how *logical operators* (like ‘not’) apply to attitude-expressions."  
      - **Crucial point:** Highlight that students’ paraphrases for atomic/non-atomic sentences feel *categorically different*—undermining logical unity.  

  3.  **(15 mins) Disjunction & The Compositional Nightmare**  
      - **Example 3 (Disjunction):** "Either lying is wrong or promise-breaking is."  
        - *Challenge:* "What single, unified attitude does this express? Indecision? But I can firmly assert this while disapproving of both! If it’s a *disjunction of attitudes*, how does that fit into logic? Validity requires sentence-level content, not a collage of feelings."  
        - **Defuse misconception #2 (truth-conditional semantics):** "Could we just *assign* truth conditions to moral sentences? No—non-cognitivism says moral judgments *aren’t belief states that track truth*. Gluing truth conditions onto expressivism guts the theory."  
      - **Synthesis:** "Negation and disjunction show moral sentences *behave* like truth-apt content in logic, but expressivism struggles to explain *what they express* when embedded."  

  4.  **(10 mins) Introduce Conditionals & Inference (The "Easy" Case)**  
      - **Example 4 (Modus Ponens):**  
        > P1. If lying is wrong, then getting your little brother to lie is wrong.  
        > P2. Lying is wrong.  
        > C. Therefore, getting your little brother to lie is wrong.  
      - *Expressivist paraphrase:*  
        P1: ? (Approving of disapproving-of-lying *and* disapproving-of-getting-brother-to-lie?)  
        P2: Disapproval of lying.  
        C: Disapproval of getting brother to lie.  
      - *Why this feels solvable (and why it’s not):* "Attitude combinations *seem* plausible here (‘being against both’). But recall disjunction: we need a *unified account* for all embeddings. If ‘if P then Q’ expresses a combo-attitude, but ‘not P’ or ‘P or Q’ don’t, the semantics is piecemeal and invalid arguments might ‘feel’ valid."  
      - **Defuse misconception #3 (disagreement):** "This isn’t about why we disagree. It’s about why *modus ponens works*—why accepting P1 and P2 *forces* you to accept C. Attitudes alone don’t explain that ‘force’."  

  5.  **(4 mins) Synthesis: Why This is Devastating**  
      - "The problem: moral sentences play identical logical roles (negation, disjunction, conditionals) as factual claims, but expressivism treats atomic/non-atomic claims differently. This threatens to make moral logic *impossible*—or force non-cognitivists to mimic cognitivist semantics."  
      - **What to exclude:** No hybrid theories/quasi-realism; no historical deep dives; no solutions.  

  6.  **(1 min) The Decisive Closing Question**  
      - **"Why can’t expressivists say that ‘Either lying is wrong or promise-breaking is’ expresses *indecision* between disapproving of lying or disapproving of promise-breaking?"**  
        - *What reveals understanding:* A student noting that indecision is a *separate attitude*, not a logical compound, and doesn’t explain why "X is wrong" and "Either X is wrong or Y is" aren’t equivalent (e.g., I can be decisive that X is wrong but still assert the disjunction).  

  ---

  ### **Why Your Sequencing Works & Costs Managed**  
  - **Survives scrutiny:** Starting with negation/disjunction makes the compositional problem inescapable. Students can’t default to "P1 expresses a combo-attitude" as they might with conditionals.  
  - **Cost addressed (validity vs. disapproval):** By framing validity upfront (minute 1) and stressing that disjunction/negation *behave* logically, you tether the problem to logic. Use phrases like "logical role" and "inferential force" constantly.  
  - **Dropping the warm-up is wise:** Skipping "paraphrase each clause and watch validity vanish" avoids the "parlor trick" feel. Instead, focus on the *mismatch* between logical form and expressive function.  

  ### **The Anchor Example: Disjunction**  
  - **Use:** "Either lying is wrong or promise-breaking is."  
  - **Why it carries the hour:**  
    - Forces confrontation with compositionality (no intuitive "combo-attitude").  
    - Exposes that expressivist paraphrases alter logical form (indecision ≠ disjunction).  
    - Cleanly distinguishes the problem from moral psychology ("This isn’t about what you *feel*").  
  - **Must lack:** Truth conditions; a cognitivist "fallback."  
  - **Must have:** Clear logical behavior (students intuit it’s not equivalent to atomic claims).  

  ### **Pre-Emptive Strike on Misconceptions**  
  1.  **Boo-Hurrah caricature:** Defused in **minute 2** by rejecting "not disapproving = tolerance" as inadequate for logic.  
  2.  **"Just use truth conditions!"** Defused in **minute 3** by tying truth conditions to cognitivism’s belief-states.  
  3.  **Conflation with disagreement:** Defused in **minute 4** by contrasting logical force with interpersonal conflict.  

  ### **Validity Setup (Before Semantics)**  
  - Ground validity in "truth preservation" (all students accept this).  
  - Hammer: "If moral sentences aren’t truth-apt, how can they *be* preserved? Expressivism must either reject moral logic or explain how attitudes *mimic* truth-preservation."  

  This plan forces students to *feel* the problem’s depth before seeing partial solutions. By ending with disjunction’s thorniness, they’ll leave uneasy—exactly where you want them.
