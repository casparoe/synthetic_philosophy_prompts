prompt: |-
  Hey — you're a professional philosopher who's taught modal metaphysics and the Kripke material loads of times, and I'm the TA for a second-year metaphysics course. I've marked about thirty of these and they're starting to blur together, so please actually think it through rather than skimming: first sketch what a genuinely strong answer would need to say, then go through this answer claim by claim, then grade.

  Here's the question I set:

  **Question 3 (20 marks).** Origin essentialism is the thesis that a thing could not have originated from something wholly different from what it actually originated from — in the biological case, that you could not have come from a sperm and egg other than the ones you actually came from.

  (a) Set the thesis out carefully, and explain whether it's just a consequence of the standard Kripkean package (rigid designation, the necessity of identity, necessary a posteriori truths) or whether it needs independent motivation of its own. (8 marks)

  (b) Now suppose that a *different* sperm had fertilized the same egg your mother actually released, but a sperm that happened to carry exactly the same set of chromosomes as the one that in fact fertilized it — recombination makes that wildly improbable, but not impossible. The resulting child would be genetically indistinguishable from you. Would that child have been you? Say what your answer shows about what, exactly, origin essentialism is a thesis about. (6 marks)

  (c) Give your own verdict on origin essentialism, and state the strongest objection to it. (6 marks)

  Here's one answer, typos and all:

  Origin essentialism (OE) is the claim that, necessarily, any organism that originates from gametes originates from the very gametes it actually originated from. It's a de re modal claim about each thing, not the de dicto claim that every organism has some origin or other — that weaker claim is uncontroversial and gets you nothing, since it's perfectly consistent with my having come from a completely different pair of gametes.

  Is OE just part of the Kripkean package? Not straightforwardly. The necessity of identity on its own is silent here: it says that if a = b then necessarily a = b, and there's no pair of objects whose identity is in question when we ask whether I could have come from different gametes. So OE needs its own argument. Here's the best one. Take the description "the human being that developed from gametes S and E". On Kripke's picture this rigidly designates me — it picks out me in every world in which I exist, rather than picking out whoever happens to satisfy the description. And a rigid designator picks out the same object with respect to every world in which that object exists, so with respect to every world in which I exist, I developed from S and E. That's exactly the de re necessity OE wants, and it's a posteriori, since which sperm and egg I came from is an empirical matter. That's why OE is a necessary a posteriori thesis rather than something you could settle from the armchair.

  (b) In the duplicate-sperm case the child would not be me. OE is a thesis about a thing's causal-historical source, and a distinct sperm is a distinct source even if it's genetically identical, so we have a different origin and hence a different organism. What this shows is that the essential property OE postulates isn't a qualitative or genetic one: it's the haecceitistic property of having come from that very sperm and that very egg. So OE has to be read as a thesis about individuals rather than about genomes, and a version of OE stated in terms of genetic make-up would give the wrong verdict here. That's a real commitment, but it's one the view already has in the ordinary case, so the case doesn't add any new objection.

  (c) I think OE is false. The strongest objection is the conceivability argument. I can describe, without contradiction, a world in which my parents conceive a child from a different sperm and that child grows up with my body, my memories and my life. There's no contradiction in the description, and conceivability is our only guide to metaphysical possibility, so such a world is possible — and I exist in it. So it's possible for me to have come from different gametes, and OE is false. The proponent's response, that the child in that world is someone else who merely resembles me, is just a restatement of OE, so it has no independent force. The one thing on the proponent's side with real force is the point about ordinary counterfactuals: it's sometimes objected that OE makes "I could have been born a year later" impossible, since a year later my parents would have used different gametes. But that objection is weak — that counterfactual is about timing, and we can hold fixed which gametes fuse while varying when they fuse, so OE is consistent with all the ordinary counterfactuals about ourselves.

  Give it a mark out of 20, and write the marginal comments you'd actually write: point by point, what's right, what's shaky, and anywhere the reasoning doesn't do what the student takes it to do. I want comments I could paste into the script, not a general impression and not a rewritten essay.
reasoning: |-
  Okay, let me approach this systematically. The user is a TA needing detailed feedback on an origin essentialism essay, so I'll need to be precise and pedagogical. 

  First, the student's answer structure seems competent - they address all parts (a-c) and demonstrate grasp of Kripkean concepts. For part (a), their rigid designation argument is mostly sound but misses that rigid designation alone doesn't entail origin essentialism; Kripke's original argument requires additional metaphysical premises about transworld identity. I should note this gap in comments.

  The duplicate sperm scenario in (b) is correctly resolved: different sperm means different origin regardless of genetic identity. The student insightfully connects this to haecceitism, though they could've explicitly named the "non-qualitative property" distinction. Their point about OE committing to individuals over genomes is strong - that deserves praise.

  Part (c)'s conceivability objection is standard but well-deployed. However, they overlook that Kripkeans reject conceivability as infallible (e.g., water/H2O). The "restatement" dismissal is too quick - proponent's response has dialectical weight via theoretical consistency. Good save on counterfactuals though.

  Biggest flaw: student implies OE is merely rigid designation applied, but Kripke's argument actually involves substantive identity conditions. Also, in (c) they don't engage with alternative objections like Salmon's four-worlds paradox. 

  For grading: (a) 5/8 (solid setup but oversimplifies Kripke), (b) 5/6 (precise with bonus haecceitism point), (c) 4/6 (conceivability underdeveloped). Total 14/20 - good but not stellar. Marginal comments should flag the rigid designation overreach and suggest deeper engagement with modal epistemology.
answer: |-
  Here's a mark breakdown and point-by-point marginal comments as requested. The answer demonstrates a strong grasp of core concepts but has significant gaps in (a) and (c).

  **Overall Mark: 14/20**  
  *(Breakdown: (a) 5/8, (b) 5/6, (c) 4/6)*

  ---

  **Marginal Comments (for pasting onto script):**

  **(a) Section (5/8):**  
  ✓ **Good:** Clear distinction between *de re* OE and trivial *de dicto* claim. Correct that necessity of identity alone doesn't entail OE.  
  ✓ **Good:** Correctly identifies rigid designation of "the human from S&E" picking out you in all worlds you exist.  
  ✗ **Problematic:** Your argument *assumes* OE rather than showing it's a *consequence* of the Kripkean package. Kripke argues for OE *using* rigid designation, but rigid designation alone doesn't *entail* OE. The Kripkean package *includes* OE as a substantive thesis about identity conditions (e.g., for artifacts/organisms), not a mere logical consequence of rigid designation/necessity of identity. It *requires independent motivation* (like the "no-transworld-switch" argument).  
  ➠ **Missing:** Needed to note that Kripke *argues* for OE via thought experiments (e.g., Queen Elizabeth's parents) and considerations of transworld identity, making it a core *part* of his package, not a consequence deduced solely from rigid designation/necessity of identity. Your argument risks circularity by using rigid designation *of an origin-specifying description* to prove OE.

  **(b) Section (5/6):**  
  ✓ **Excellent:** Correct verdict (not you). Perfect explanation: OE concerns *specific historical origins* (haecceities), not qualitative/genetic properties.  
  ✓ **Strong Insight:** Correctly identifies this shows OE is about *individuals* (S and E themselves), not genomes. Good point that this is consistent with OE's core commitment.  
  ➠ **Minor Gap:** Could briefly note *why* this is revealing: it isolates the *non-qualitative* nature of the essential property, contrasting with possible qualitative essentialist views.

  **(c) Section (4/6):**  
  ✓ **Good Structure:** Clear verdict + objection + response to potential rebuttal.  
  ✓ **Solid:** Correct identification of the conceivability argument as a major objection. Good point that the "resembler" response begs the question against the objection.  
  ✓ **Excellent:** Strong rebuttal to the "born later" objection – correctly notes timing vs. origin can vary independently.  
  ✗ **Problematic:** Overstates the case that the proponent's "resembler" response "has no independent force." It *does* have force via *theoretical coherence* – it preserves OE and explains the intuition as mistaking qualitative similarity for identity. You need to engage with *why* the proponent thinks conceivability fails here (like Kripke's "fool's water/H₂O" point).  
  ✗ **Shallow:** "Conceivability is our *only* guide" is too strong and contentious (Kripkeans appeal to *a posteriori* essences overriding conceivability). You don't grapple with the *epistemic vs. metaphysical* gap.  
  ➠ **Missing:** Should address the *strongest* pro-OE argument you mention in (a) (the rigid designation argument) and why the conceivability objection overrides it. Also missing other potent objections (e.g., Salmon's "Four Worlds Paradox," gradual replacement scenarios).

  ---

  **Key Strengths:**  
  1.  Precise understanding of OE as *de re*, haecceitistic, and non-qualitative.  
  2.  Excellent handling of the duplicate-sperm case (b).  
  3.  Clear grasp of rigid designation and its application.  
  4.  Effective rebuttal of the "born later" counterfactual worry.

  **Key Weaknesses:**  
  1.  **(a)** Misrepresents the relationship between OE and the Kripkean package. OE is argued *for* using Kripkean tools, not deduced *from* them alone. Needs recognition of Kripke's *arguments* for OE.  
  2.  **(c)** Doesn't seriously engage with the proponent's best defense against conceivability (appeal to *a posteriori* necessity overriding conceivability). Dismisses the "resembler" response too glibly.  
  3.  **(c)** Overstates conceivability as the *only* guide to modality, ignoring Kripkean constraints. Lacks depth in evaluating the objection's strength.  

  This is a very good answer showing strong conceptual understanding, but it falters on the precise dialectical relationship in (a) and lacks sufficient critical depth in (c). The handling of (b) is exemplary.
