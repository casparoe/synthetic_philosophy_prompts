prompt: |-
  I'm a junior at a large public high school, and I sit as the student member of our school's discipline board. Over the past year I've noticed a pattern in how we argue about who "caused" something bad, and I can't tell whether it is a real thing with a name in philosophy or just a habit of speech that our board has picked up. I'd like to know what it is, or, if it isn't anything established, what to call it and exactly where its edges are.

  Three hearings, stripped down:

  1. A teacher left a cabinet of exam papers unlocked overnight; four students photographed the paper. Everyone was comfortable saying the teacher's failure to lock the cabinet caused the leak. When another member noted that the same cabinet had been left unlocked twice before with no leak, and that a determined student could have got in anyway, nobody weakened the causal claim. Instead the description of what the teacher owed us got larger: he should have locked it, and also counted the copies, and also not left the exam in the room at all.
  2. A hallway fight that a dozen people saw and nobody reported. Asked what caused the injury, we named the two fighters and then, vaguely, the people who walked past. Nobody would name any particular passer-by, but nobody would say that the passers-by had no causal role either. The claim stayed with the group without landing on any member of it.
  3. A group project where five people each assumed someone else would email the teacher. Asked who caused the zero, we picked whichever member we were already annoyed with; asked what to change so it doesn't recur, we proposed a rotating reminder system and said nothing about that person's reliability.

  What I think I'm seeing is this: a claim that someone's not-doing-something caused an outcome seems to run off whether we can point to whose job it was and how much we already want to blame them, and to be strangely insensitive to how much difference their acting would actually have made. When the difference-making is challenged, the obligation gets restated in a stronger form rather than the causal claim being withdrawn. And when no one was designated, the claim doesn't dissolve — it floats upward to a collective. I've been writing it in my notes as duty-tracking, but that name does no work I can't do in a sentence.

  So, concretely: does this have an established name, or does it sit between two or three named things? I have come across the phrase causation by omission, but the cases I've seen discussed are about unwatered plants and promises to water them, and they don't seem to cover the part where the obligation stretches under pressure, or the part where the claim attaches to a group while refusing to attach to its members. Is that one phenomenon or two? Does the same thing happen with things people did rather than failed to do, and if not, what does that asymmetry tell us about what is going on?

  Please don't just hand me a label. I want the carving: which nearby concepts this resembles, how it differs from each, which fits best, and one pair of hypothetical cases that would let me tell for myself whether I've found one thing or two. And I'd rather have your own analysis than a list of papers; I have no way to get at journals from here.

  Two more things. First, tell me how confident you are in each part of your answer, and specifically which part rests on a contested claim about how ordinary speakers actually use the word cause rather than on something you can settle from the armchair. Second, tell me what would change your mind: if you think duty is doing the work here, what would you expect to hear people say if it weren't; if you think this collapses into something already named, what observation about our arguments would make you revise that; and if you think it's genuinely new, what would convince you it isn't.
reasoning: |-
  Okay, the user is a high school junior on their school's discipline board. They've noticed a pattern in how the board assigns causality for negative events, especially involving inaction. They want to know if this is a recognized concept in philosophy or just a linguistic habit. Let me break down their examples.

  First, in the exam leak case, the teacher's failure to lock the cabinet is blamed, and even when challenged, the obligation expands instead of retracting the causal claim. Second, in the hallway fight, blame is placed on the group of passers-by but not on any individual. Third, in the group project, blame shifts to whoever they're already annoyed with, but the solution is systemic. 

  The user mentions "causation by omission," but they feel it doesn't cover the obligation stretching or group attribution. They want to know if this is one phenomenon or multiple, and if it's different from actions. They also want a way to test it themselves.

  I need to connect this to philosophical concepts. Causation by omission is a start, but there's more. The idea that obligations expand under challenge reminds me of defeasibility in deontic logic. For the group blame without individual attribution, collective responsibility or diffusion of responsibility in social psychology might apply. The shifting blame in the group project sounds like the fundamental attribution error, where situational factors are ignored in favor of personal blame.

  The user wants a clear distinction between nearby concepts. How is this different from standard omission? The stretching of duties and group attribution seem key. Also, they need hypotheticals to test. Maybe one where the duty is clear but action wouldn't have helped, and another where the group is structured so responsibility can't diffuse.

  The user also asks about confidence levels. The linguistic part about how people use "cause" is more contested, while the obligation framework might be more solid. To change my view, if in the exam case, they dismissed the teacher's role when the breach was inevitable, that would challenge the duty-based aspect. If they assigned individual blame in the hallway, that would counter the group attribution.

  I should structure the answer around the three phenomena: stretching duties, group attribution, and shifting blame. Then provide test cases. Make sure to address their deeper need: understanding the underlying mechanisms to improve the board's decision-making, not just labeling. They might want to make their process more just or effective by recognizing these patterns.
answer: |-
  This is a remarkably sharp observation, and you're right that it sits at the intersection of several established philosophical concepts, though the *specific combination* you describe – particularly the "stretching obligations" and "floating group blame" – is less commonly named as a single entity. It's not *entirely* new, but you've pinpointed a nuanced pattern within broader ideas. Let's carve it up.

  **Core Concepts Involved:**

  1.  **Causation by Omission:** This is the foundation. Philosophers debate whether *not doing something* can genuinely be a *cause* in the same way a positive action is (e.g., not watering a plant *causing* its death vs. poisoning it). Critics argue omissions are infinite (I didn't water it, you didn't water it, the President didn't water it...) and lack the physical "oomph" of actions. Defenders argue that *in specific contexts* (especially where there's a duty), omissions *can* be causally relevant. Your cases fit squarely here. (Confidence: High - This is a standard, well-documented debate.)

  2.  **Normative Expectations & Duties:** This is the engine driving the "duty-tracking" aspect. When we say someone's omission *caused* harm, we are implicitly relying on a prior judgment: they *should have* acted. This "should" comes from norms, roles (teacher), rules (school policy), or implicit social contracts (reporting violence). The *causal claim* is parasitic on the *normative claim* about duty. (Confidence: High - This link between duty and causal attribution for omissions is widely acknowledged.)

  3.  **Counterfactual Dependence (Difference-Making):** This is the test you intuitively applied: "Would the harm have happened *but for* the omission?" If the answer is "no," the omission made a difference. If "yes" (like the cabinet being breachable anyway), it arguably didn't. You noticed your board often *ignores* this when a duty exists. (Confidence: High - Counterfactuals are the standard philosophical tool for analyzing causation.)

  4.  **Diffusion of Responsibility / Collective Responsibility:** This explains the "floating group blame." When a duty isn't clearly assigned to one individual but falls on a group ("someone should have reported the fight"), responsibility diffuses. No single member feels the full weight, and attributing blame to the *group* becomes easier than pinning it on any *individual*. It's a well-known social psychological phenomenon. (Confidence: High - Robustly documented in psychology and social philosophy.)

  **Your Specific Pattern: "Normatively Anchored Causal Attribution for Omissions" (NACAO)**

  Your observation reveals a specific *interplay* between these concepts, particularly highlighting two features less emphasized in simple "causation by omission":

  1.  **Obligation Stretch Under Counterfactual Challenge:** When the *actual difference-making* of a specific omission is challenged ("locking wouldn't have mattered"), the board doesn't retreat on the causal claim tied to the *agent*. Instead, it *expands the scope of the duty* ("should have locked *and* counted *and* moved it"). This suggests the core driver isn't purely factual causation, but a *normative judgment* about what the agent *owed* the system to prevent the *type* of harm. The causal claim shifts from "failure X caused harm Y" to "Agent A's failure to fulfill their protective duty regarding domain Z caused harm Y," where the *content* of the duty (X) becomes flexible. (Confidence: High based on your description; this is a key insight.)
  2.  **Group-Level Attribution Without Individual Specification:** When the duty is diffusely held by a group, the causal claim attaches to the *group as a unit* ("the passers-by caused it by not reporting") but resists specification to any member. This avoids the problem of singling out one individual when the duty wasn't uniquely theirs, while still maintaining that *someone's* failure within the group was causally necessary (even if we can't say *whose*). It's a way of acknowledging the omission *by the group* as a causal factor without resolving the internal distribution of blame. (Confidence: High based on your description; this follows logically from diffusion + group duty.)

  **Asymmetry with Actions:** This phenomenon is *primarily* about omissions. Why?
  *   **Actions:** Cause harm through positive intervention. The causal chain is usually clearer (Student A punched Student B). Duties might influence *blameworthiness* or *punishment*, but the causal link itself (the punch causing injury) is less dependent on prior normative expectations. We don't usually say, "The punch caused the injury, but only because the teacher wasn't there to stop it" in the *same primary causal sense*. The punch is the salient event.
  *   **Omissions:** The "cause" is defined *entirely* by the *absence* of an action that *should have been there* based on duty. The causal claim collapses without the normative anchor. This is why the duty stretches – the normative anchor (what the agent owed) is primary, and the specific omission is secondary evidence of failing that anchor.

  **Is it One Phenomenon or Two?**
  It's **one core phenomenon (NACAO)** with two common *manifestations*, depending on whether the duty-bearer is individual or collective:
  1.  **Individual Duty Manifestation:** Obligation stretches under counterfactual challenge (Exam case).
  2.  **Collective Duty Manifestation:** Causal claim floats at the group level without individual specification (Hallway case).
  The group project case is a messy hybrid: the *duty* is collective (emailing), but under pressure, the board *artificially individualizes* the blame ("whoever we're annoyed with") while proposing a collective *solution* (rotating reminders) that acknowledges the underlying collective duty problem. This shows the tension between the diffuse duty and the psychological need to blame an individual.

  **Test Cases to Distinguish Manifestations:**

  1.  **Stretching Test (vs. Pure Omission):**
      *   **Case A (Duty Present):** Cafeteria worker forgets to put nuts label on a dish; allergic student has reaction. Board blames worker. Someone argues: "The student knew they were allergic and didn't ask!" Board says: "Worker should have labeled *and* announced allergens *and* checked with students." --> **Obligation Stretch (NACAO)**
      *   **Case B (No Clear Duty):** Same scenario, but the dish is a student's homemade treat brought for a party, not a staff-prepared meal. Board is unlikely to blame the *student* who brought it for "failing to label" unless there was a specific rule. They might blame the allergic student for not asking, or see it as tragic accident. If they *do* blame the treat-bringer, it would require *first establishing* a new duty ("students *should* label homemade treats"). --> **Pure Causation by Omission debate (did they have a duty?)**

  2.  **Group Attribution Test (vs. Genuine Individual Omission):**
      *   **Case C (Diffuse Duty):** 30 students witness bullying over several days; no one reports. Board says "The witnesses caused the ongoing harm by not reporting." Challenged to name one: "We can't single anyone out, but the group failed." --> **Group-Level NACAO**
      *   **Case D (Clear Individual Duty):** School appoints one specific "peer mentor" per hallway with explicit duty to report incidents. Bullying occurs; that specific mentor sees it but doesn't report. Board blames *that specific mentor* for "causing the harm to continue by not reporting." --> **Individual NACAO** (Duty clearly pinned, individual blame follows).

  **Confidence & Contested Ground:**

  *   **High Confidence:** The core link between *duty/normative expectation* and causal attribution *specifically for omissions* is well-established. The phenomena of obligation stretch and group-level attribution without individual specification are logical consequences observed in your cases and consistent with diffusion of responsibility. The asymmetry with actions is fundamental.
  *   **Contested Ground (Armchair vs. Empirical):** The claim that "ordinary speakers' causal judgments about omissions are *primarily driven by and sensitive to* perceived duties, often overriding strict counterfactual difference-making" is where it gets empirical.
      *   **Armchair (Strong):** Philosophy of action and normative ethics heavily support the *conceptual* dependence of omission-causation on duty.
      *   **Empirical (Contested):** *How strongly* duty overrides counterfactual reasoning in *actual* lay judgments, and *how flexible* the duty-stretching is, are questions for experimental philosophy or psychology. Your observations are strong anecdotal evidence. I'm highly confident it's a major factor, but its precise weight relative to other factors (like foreseeability) in the general population needs empirical study. My analysis relies on the conceptual structure revealed in your specific, normatively charged context (a discipline board).

  **What Would Change My Mind?**

  1.  **If Duty Isn't Doing the Work:** If, in the exam case, when faced with the "breachable anyway" argument, the board consistently said: "You're right, locking it wouldn't have made a difference, so the teacher's failure *didn't cause* the leak. The cause was the students' actions and maybe lax overall security, but not this specific omission." This would undermine the core "stretch" observation and suggest counterfactuals dominate.
  2.  **If It Collapses into Simpler Omission:** If, in the hallway case, the board consistently either (a) refused to assign *any* causal role to the passers-by ("Only the fighters caused it"), or (b) actively tried to identify *specific* passers-by who *definitely* saw it and *definitely* could have reported, blaming *those individuals*, it would weaken the "floating group blame" aspect and make it look more like a simple (but difficult) case of identifying individual omissions.
  3.  **If Genuinely New:** To convince me it *isn't* primarily NACAO (a synthesis of known concepts fitting your pattern), I'd need evidence that the causal attributions in these omission cases were driven by something *other* than perceived duties or roles (e.g., purely by emotions like anger, or by a rigid counterfactual test applied consistently, or by a factor like physical proximity alone without any normative element).

  **Your Name:** "Duty-Tracking" is actually quite apt for the core mechanism! "Normatively Anchored Causal Attribution for Omissions" (NACAO) is the clunky philosopher-speak version. The key insight is that in contexts like discipline boards, **causal claims about omissions function primarily as markers for perceived breaches of protective duties**, and these duties (not pure physics or counterfactuals) define the boundaries of the causal claim, allowing them to stretch or float collectively. Your observation of the *dynamics* under challenge (stretching, floating) is particularly valuable. Keep tracking it!
