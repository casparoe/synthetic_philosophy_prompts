prompt: |-
  I have been trying, without success, to find a name for a failure mode of argument that I keep encountering in long-running public disputes of exactly the sort that end with each side concluding that the other is not arguing in good faith. I suspect the familiar accusation is not about what it appears to be about, and I want to know whether the thing I have in mind is already a known concept, and if not, how it should be defined.

  Two instances. First: a colleague opposes a proposal in a committee meeting. She states the proposal more accurately than its authors did, volunteers the two concessions that are genuinely owed, commits no fallacy, and is plainly sincere — she believes what she says and would be embarrassed to be caught misdescribing the case against her. Yet when asked what would change her mind, she does not name a piece of evidence the discussion failed to produce; she gives the impression of not having granted the discussion any authority over her conclusion at all. Nothing that happens in that room, she more or less conveys, is the kind of thing that could settle this. Second: a participant in an eight-year-old online dispute about housing policy who knows the other side's best arguments better than most of that side does, links them, quotes them at length — and whose view has not moved. What he does with the other side's material is exhibit that it fails; he does not submit anything of his own to it.

  What I think I am noticing has two parts, and I do not know whether they are one phenomenon or two. The first is a missing willingness to be bound by the outcome: there is no result the exchange could produce that the speaker has committed herself in advance to treating as settling. The second is that the argument is frequently not addressed to the interlocutor at all, but to onlookers, to a record, or to the speaker's own side. I would like to know whether the second is the mechanism of the first, a symptom of it, or something independent that merely tends to travel with it.

  The neighbours I have tried do not fit. It is not insincerity: these people mean what they say. It is not self-deception in the Sartrean sense — they are not hiding anything from themselves. It is not the indifference to truth that Harry Frankfurt ascribes to the bullshitter, who does not care whether what he says is true; my arguer would be distressed by falsity, and may even have arrived at the view by careful attention to evidence. It is not quite dogmatism or closed-mindedness, since the same person may revise readily on things encountered outside the argument; it is specifically the exchange that has no purchase. It is not simply aiming at victory rather than truth, since my arguer may not be trying to defeat anyone — she may be discharging a role or maintaining a position. Costless signalling seems closer, but the defect is not that her words are cheap; it is that nothing has been placed under the authority of the outcome. The internet's vocabulary for related behaviour builds in an intent to harass or a covert allegiance, which I do not want to assume.

  So: is there an established term, and if so which one fits best and where exactly does it come apart from what I have described? If there is none, please coin one and define it tightly enough to sort the following cases: a lawyer arguing a client's brief; a minister reading a departmental line; a devil's advocate; a teacher examining a student; a genuinely undecided person who is using the exchange to find out what she thinks and who has therefore staked nothing; someone who stakes a concession she never intended to defend; and someone who has staked something real but only privately, so that no one else can tell.

  Finally, I want the epistemic question addressed rather than gestured at. The defining feature seems to be a counterfactual about what the arguer would accept under an outcome that did not occur, which makes the charge difficult to support and impossible to refute inside the dispute — and the accusation itself is made before an audience and stakes nothing, so it looks liable to be an instance of the very thing it names. What, in principle, could count as evidence for or against it, and is "they are not arguing in good faith" a claim that can be responsibly made?
reasoning: |-
  Okay, I need to unpack this user's query. They're describing a specific failure mode in arguments where participants don't seem open to changing their minds, even when presented with evidence. The key elements are the lack of commitment to being bound by the discussion's outcome and arguments being directed at onlookers rather than the interlocutor.

  The user provides two clear examples: a colleague in a committee meeting who can't name evidence that would change her view, and an online debater who meticulously quotes opponents without ever adjusting his stance. They want to know if there's an existing term for this phenomenon or if they should coin one. They also want to address the epistemic challenges in identifying this behavior.

  Hmm, let me think about existing concepts. The user already ruled out insincerity, self-deception, bullshitting, dogmatism, and mere competitiveness. What's left? I recall concepts like "dialectical inflexibility" from philosophy, but that might not capture the performative aspect. "Posturing" comes close but implies insincerity. "Bad faith" is too broad. Perhaps "pseudo-engagement"?

  The two core features seem interconnected. The refusal to be bound by discussion outcomes likely enables or encourages the audience-focused argument style. But proving this counterfactual is tricky - how do we know what would change someone's mind? The user rightly points out the accusation itself can become performative.

  For coining a term, "dialectical unaccountability" might work - it captures the lack of commitment to outcomes. "Fixed-position performance" emphasizes the theatrical aspect. I lean toward the former as more precise.

  Testing against their cases: A lawyer or minister would qualify - they're bound to positions. A devil's advocate or undecided person wouldn't. The private-stakes case is ambiguous, highlighting the epistemic problem.

  Evidence for this behavior could include: consistent non-responsiveness to counterarguments, shifting goalposts, or admitting offline openness. But it's inferential - we can't see mental states. The "bad faith" accusation often becomes part of the performance, making it self-undermining. Responsible claims require specific behavioral patterns, not just frustration.

  This user is clearly thoughtful - they've analyzed the problem deeply and want precise conceptual tools. Their frustration with unproductive debates resonates. I should honor that by offering a tight definition and acknowledging the real epistemological limits they've identified.
answer: |-
  Based on your detailed description and the cases you've ruled out, the phenomenon you're identifying doesn't have a single, universally recognized term capturing its precise nuances. However, it aligns closely with concepts discussed in argumentation theory, epistemology, and rhetoric. Here's a breakdown:

  1.  **The Core Concept:** You've identified a form of **dialectical unaccountability** or **argumentative non-engagement**, characterized by:
      *   **Lack of Dialectical Commitment:** The arguer does not functionally grant the *current exchange* any authority to potentially revise their belief. They have not staked the belief's validity on the outcome of *this specific interaction*. The counterfactual ("What evidence/argument *here* would change your mind?") lacks a meaningful answer.
      *   **Performative Focus:** The argument is primarily a performance directed at an audience (onlookers, the record, one's own side) rather than a genuine dialectical engagement with the interlocutor. The goal is display, defense, or signaling, not mutual exploration or potential revision.

  2.  **Relation of the Two Parts:** The lack of dialectical commitment (**Part 1**) is the *core epistemic/argumentative defect*. The performative focus (**Part 2**) is often the *mechanism* or *manifestation* of that defect. By addressing the audience/record/own side, the arguer avoids the direct dialectical pressure that might force them to reveal or confront their lack of commitment to the exchange's outcome. The performance *enables* the unaccountability. It is not merely independent nor just a symptom; it's how the unaccountability is operationalized within the interaction.

  3.  **Best Existing Neighbors & Why They Fall Short:**
      *   **Pseudo-Controversy (Schiappa, Goodnight):** Focuses on manufactured debate where resolution is impossible by design (e.g., creationism vs. evolution debates staged for political reasons). Your cases involve real disagreement, but one side treats it *as if* it's pseudo, refusing its dialectical potential.
      *   **Strategic Maneuvering / Rhetorical Argumentation (van Eemeren & Grootendorst):** Recognizes argumentation often aims for effectiveness, not just reasonableness. However, it doesn't fully capture the *specific refusal to grant the exchange any dialectical authority*. Effectiveness is still often tied to persuading the *interlocutor*.
      *   **Dialectical Inflexibility/Inertia:** Describes resistance to changing views but doesn't specify the *disconnect from the specific exchange's authority* or the *performative* aspect.
      *   **Posturing:** Captures the performative aspect well but often implies insincerity or exaggeration, which you explicitly rule out.
      *   **Bad Faith (Sartre):** You rule out self-deception, and your arguers *are* sincere in their *beliefs*; the "bad faith" is specifically towards the *dialectical process* of *this argument*.
      *   **Bullshitting (Frankfurt):** As you note, your arguers *do* care about the truth of their *beliefs*; they just don't grant *this discussion* authority over them.
      *   **Dogmatism/Closed-Mindedness:** Too broad and implies a global trait. Your cases show specificity – the same person *is* open elsewhere; it's *this exchange* that lacks purchase. Also, dogmatism doesn't necessarily imply the performative audience focus.

  4.  **Coined Term & Definition:**
      *   **Term:** **Dialectical Unaccountability** (or **Fixed-Position Performance**)
      *   **Definition:** **Dialectical Unaccountability** is a mode of argumentative engagement characterized by the arguer's implicit or explicit refusal to grant the *specific dialectical exchange* any authority to potentially revise the belief under discussion. The arguer treats their position as fixed *relative to this interaction*, regardless of its content or outcome. This stance is often manifested through a performative focus, where the argument is directed primarily towards an audience (onlookers, the record, one's own side) rather than functioning as a genuine exploration or test of the belief with the interlocutor. The arguer is sincere in their belief and may care about its truth, but they have functionally insulated this belief *from the adjudicative potential of the current discourse*.

  5.  **Sorting Your Cases:**
      *   **Lawyer arguing a client's brief:** **Yes (Dialectically Unaccountable).** Bound to the client's position, not the exchange's outcome. Performance for judge/jury. Wouldn't change mind based *on this argument* even if convinced personally (though might advise client differently later).
      *   **Minister reading a departmental line:** **Yes (Dialectically Unaccountable).** Bound to the official position. Performance for public/record. The exchange cannot alter the stated position.
      *   **Devil's Advocate:** **No.** Explicitly *not* bound to the position. The *entire purpose* is to test the argument via the exchange. Performance is dialectical tool, not insulation.
      *   **Teacher examining a student:** **No (Typically).** The teacher's belief isn't under test; the *student's* understanding is. The teacher is bound by pedagogical goals and logical standards *within the exchange*. Performance is pedagogical, not insulating a fixed personal belief.
      *   **Genuinely undecided person:** **No.** Actively *granting* the exchange authority to help form a belief. Nothing is staked *because* everything is potentially stakeable. The exchange *has* purchase.
      *   **Someone who stakes a concession never intended to defend:** **Yes (But distinct).** This is **Insincerity/Bad Faith** in the *stakes* themselves. They *appear* accountable but never were. Your core cases involve sincerity *in the belief and the stakes as presented* but no *real* accountability to *this exchange*.
      *   **Someone with private stakes (real but hidden):** **Ambiguous/Epistemically Challenging.** *Behaviorally*, they appear **Dialectically Unaccountable.** The *internal* commitment doesn't translate to *dialectical* accountability within the exchange. The observable behavior (lack of movement, performative focus) is identical to your core cases. The private stakes are irrelevant *to the functioning of the argument*.

  6.  **Addressing the Epistemic Problem:**
      *   **The Core Challenge:** You're correct. Accusing someone of Dialectical Unaccountability involves a counterfactual claim about their responsiveness to unoffered evidence/arguments *within that specific exchange*. This is inherently difficult to prove definitively *during* the exchange. The accusation itself, if made performatively, risks becoming an instance of the very thing it names.
      *   **Evidence *For* Dialectical Unaccountability:**
          *   **Consistent Non-Responsiveness:** Repeated failure to engage substantively with the *strongest* counter-arguments presented, resorting to deflection, repetition, or audience-focused rhetoric.
          *   **Shifting Goalposts/Unfalsifiable Criteria:** When asked "What would change your mind?", the criteria named are vague, constantly change, are impossible to meet within the context, or are demonstrably ignored if met.
          *   **Explicit Admission (Rare):** Statements like "Nothing you say here will change my mind" or "I'm just stating the position for the record."
          *   **Pattern Recognition:** Observing the same person readily changing views based on evidence/argument *in other contexts* but exhibiting rigid non-responsiveness *in this specific dispute*.
          *   **Focus on Performance Cues:** Obsessive focus on scoring points, quoting opponents extensively only to dismiss (not engage), rhetorical flourishes aimed at onlookers, appeals to identity/group loyalty within the argument.
      *   **Evidence *Against* Dialectical Unaccountability:**
          *   **Concrete Concessions:** Willingness to acknowledge specific points weaken their position or strengthen the opponent's, *based on the exchange*.
          *   **Adjusting Arguments:** Modifying their own arguments in response to criticism within the exchange.
          *   **Specific, Falsifiable Criteria:** Offering clear, specific, and contextually achievable criteria for changing their mind and demonstrating engagement with attempts to meet them.
          *   **Focus on the Interlocutor:** Directly addressing the interlocutor's points, asking clarifying questions aimed at understanding *their* argument better.
      *   **Responsibility in Making the Accusation:**
          *   **"Bad Faith" Accusation:** Accusing someone of "not arguing in good faith" *in the general sense* is often irresponsible and performative in the context of heated disputes. It's vague and easily weaponized.
          *   **Responsible Alternative:** It *is* responsible to identify *specific behaviors* consistent with Dialectical Unaccountability *if supported by evidence* (as above). Instead of "You're arguing in bad faith!", one could say: "Your position seems fixed regardless of the evidence presented here," or "You haven't specified what evidence within this discussion could change your view," or "Your responses seem aimed at the audience rather than engaging with my specific points X and Y." This focuses on observable behavior and the *structure* of the engagement, making the criticism more concrete and less about hidden motives.
          *   **Acknowledging the Limit:** One must acknowledge the inherent epistemic limit – you cannot prove the counterfactual. You can only point to the *pattern of behavior* that strongly suggests the belief is insulated *from this exchange*.

  **Conclusion:** The phenomenon you describe is best captured by **Dialectical Unaccountability** – the refusal to grant a specific argumentative exchange the authority to potentially revise a sincerely held belief, often manifested through performative, audience-focused rhetoric. While related to existing concepts, it carves out a specific failure mode centered on the *insulation of belief from the adjudicative potential of the current discourse*. Identifying it requires careful observation of behavioral patterns (non-responsiveness, shifting criteria, performative focus) rather than mind-reading, and responsible criticism focuses on these specific behaviors rather than vague accusations of "bad faith." The epistemic challenge is real, but not insurmountable for making warranted inferences based on observable interaction patterns.
