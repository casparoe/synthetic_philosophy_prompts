answer: |-
  ### Model Answer

  **(a)**  
  For an arbitrary citizen \(i\), the expected utility of lottery \(A\) is \(EU_i(A) = u_i(1\text{m})\), as it yields £1m for certain. For lottery \(B\), with probability \(89/100\) (red) it yields £1m, and with probability \(11/100\) (white) it yields a sub-lottery: £5m with probability \(10/11\) or £0 with probability \(1/11\). Thus:  
  \[
  EU_i(B) = \frac{89}{100} u_i(1\text{m}) + \frac{11}{100} \left( \frac{10}{11} u_i(5\text{m}) + \frac{1}{11} u_i(0) \right) = \frac{89}{100} u_i(1\text{m}) + \frac{10}{100} u_i(5\text{m}),
  \]  
  since \(u_i(0) = 0\). The difference is:  
  \[
  \delta_i = EU_i(B) - EU_i(A) = \frac{89}{100} u_i(1\text{m}) + \frac{10}{100} u_i(5\text{m}) - u_i(1\text{m}) = \frac{10}{100} u_i(5\text{m}) - \frac{11}{100} u_i(1\text{m}) = \frac{1}{100} \left( 10u_i(5\text{m}) - 11u_i(1\text{m}) \right).
  \]  

  For lottery \(C\), it yields £0 if red (probability \(89/100\)) and £1m if white (probability \(11/100\)):  
  \[
  EU_i(C) = \frac{89}{100} u_i(0) + \frac{11}{100} u_i(1\text{m}) = \frac{11}{100} u_i(1\text{m}).
  \]  
  For lottery \(D\), it yields £0 if red, and if white (probability \(11/100\)), the same sub-lottery as in \(B\):  
  \[
  EU_i(D) = \frac{89}{100} u_i(0) + \frac{11}{100} \left( \frac{10}{11} u_i(5\text{m}) \right) = \frac{10}{100} u_i(5\text{m}).
  \]  
  The difference is:  
  \[
  EU_i(D) - EU_i(C) = \frac{10}{100} u_i(5\text{m}) - \frac{11}{100} u_i(1\text{m}) = \frac{1}{100} \left( 10u_i(5\text{m}) - 11u_i(1\text{m}) \right) = \delta_i.
  \]  
  Thus, \(\delta_i\) is identical for both comparisons.  

  \(\delta_i > 0\) if and only if \(10u_i(5\text{m}) > 11u_i(1\text{m})\), or equivalently, \(u_i(5\text{m}) > 1.1 \cdot u_i(1\text{m})\). This condition requires that the utility gain from £1m to £5m exceeds a 10% increase relative to \(u_i(1\text{m})\). It is moderately demanding: for risk-averse citizens (concave \(u_i\)), \(u_i(5\text{m}) < 5u_i(1\text{m})\), but \(1.1u_i(1\text{m})\) may still be less than \(u_i(5\text{m})\) if risk aversion is mild. For highly risk-averse citizens, \(u_i(5\text{m})\) may be close to \(u_i(1\text{m})\), making \(\delta_i > 0\) unlikely.  

  Since \(\delta_i\) is the same for \(B\) vs \(A\) and \(D\) vs \(C\), each citizen either prefers \(B\) to \(A\) and \(D\) to \(C\) (if \(\delta_i > 0\)), prefers \(A\) to \(B\) and \(C\) to \(D\) (if \(\delta_i < 0\)), or is indifferent (if \(\delta_i = 0\)). The vector of expected utility differences between \(B\) and \(A\) is \((\delta_1, \delta_2, \dots, \delta_n)\), identical to that between \(D\) and \(C\). Any increasing social welfare function \(F\) ranks vectors component-wise: if \(F\) prefers \(A\) to \(B\), it must be that the vector for \(A\) is component-wise greater than or equal to that for \(B\) (with strict inequality in at least one component), implying \(\delta_i \leq 0\) for all \(i\) (with strict inequality for some). Similarly, \(F\) preferring \(D\) to \(C\) would require \(\delta_i \geq 0\) for all \(i\) (with strict inequality for some). These are mutually exclusive unless all \(\delta_i = 0\), so \(F\) cannot simultaneously prefer \(A\) to \(B\) and \(D\) to \(C\). Thus, the Allais pattern cannot arise.  

  **(b)**  
  Consider two citizens with linear utility: \(u_1(x) = x\), \(u_2(x) = x\). Define three lotteries:  
  - \(L\): yields \((£0, £1)\) with certainty, so expected utility vector \((0, 1)\).  
  - \(M\): yields \((£1, £0.1)\) with certainty, so vector \((1, 0.1)\).  
  - \(R\): yields \((£3, £0)\) with certainty, so vector \((3, 0)\).  

  Using \(\alpha = 1/2\), the mixtures are:  
  - \(\alpha L + (1-\alpha)R\): yields \(L\) (outcome \((0,1)\)) with probability \(1/2\), or \(R\) (outcome \((3,0)\)) with probability \(1/2\). The reduced form gives expected utilities:  
    \[
    \text{For citizen 1: } \frac{1}{2} \cdot 0 + \frac{1}{2} \cdot 3 = 1.5, \quad \text{For citizen 2: } \frac{1}{2} \cdot 1 + \frac{1}{2} \cdot 0 = 0.5, \quad \text{vector } (1.5, 0.5).
    \]  
  - \(\alpha M + (1-\alpha)R\): yields \(M\) (outcome \((1,0.1)\)) with probability \(1/2\), or \(R\) (outcome \((3,0)\)) with probability \(1/2\). The reduced form:  
    \[
    \text{For citizen 1: } \frac{1}{2} \cdot 1 + \frac{1}{2} \cdot 3 = 2, \quad \text{For citizen 2: } \frac{1}{2} \cdot 0.1 + \frac{1}{2} \cdot 0 = 0.05, \quad \text{vector } (2, 0.05).
    \]  

  Under leximin (which is increasing and inequality-averse), rank the vectors:  
  - Comparing \(L\) and \(M\):  
    - \(L\): \((0, 1)\) sorted is \((0, 1)\).  
    - \(M\): \((1, 0.1)\) sorted is \((0.1, 1)\).  
    Leximin compares the smallest components: \(0 < 0.1\), so \(L\) is worse than \(M\) (hence \(M\) is preferred to \(L\)).  
  - Comparing \(\alpha L + (1-\alpha)R\) and \(\alpha M + (1-\alpha)R\):  
    - \(\alpha L + (1-\alpha)R\): \((1.5, 0.5)\) sorted is \((0.5, 1.5)\).  
    - \(\alpha M + (1-\alpha)R\): \((2, 0.05)\) sorted is \((0.05, 2)\).  
    Leximin compares the smallest components: \(0.5 > 0.05\), so \(\alpha L + (1-\alpha)R\) is better than \(\alpha M + (1-\alpha)R\).  

  Thus, leximin ranks \(M\) above \(L\), but \(\alpha L + (1-\alpha)R\) above \(\alpha M + (1-\alpha)R\), violating independence.  

  The structural feature enabling this violation is that the lotteries \(L\), \(M\), and \(R\) yield different distributions of expected utilities across citizens, and leximin (non-linear) responds non-uniformly to mixtures. Specifically, mixing with \(R\) benefits the worst-off citizen more in \(\alpha L + (1-\alpha)R\) (minimum utility 0.5) than in \(\alpha M + (1-\alpha)R\) (minimum utility 0.05). This feature is absent in part (a) because there, the difference vectors for the two choices are identical across citizens, forcing uniform rankings.  

  **(c)**  
  The ex post evaluation is \(W(L) = \sum_s p(s) \cdot F(u_1(x_1(s)), \dots, u_n(x_n(s)))\), where \(s\) indexes states. For lotteries \(L\), \(M\), \(R\) and \(\alpha \in (0,1)\), assume \(W(L) > W(M)\). The mixture \(\alpha L + (1-\alpha)R\) is a compound lottery: with probability \(\alpha\), outcome is drawn from \(L\); with probability \(1-\alpha\), from \(R\). Thus:  
  \[
  W(\alpha L + (1-\alpha)R) = \alpha \cdot W(L) + (1-\alpha) \cdot W(R),
  \]  
  because the expectation is linear: the social welfare in each state is \(F(\cdot)\), and the overall expectation is the probability-weighted average. Similarly,  
  \[
  W(\alpha M + (1-\alpha)R) = \alpha \cdot W(M) + (1-\alpha) \cdot W(R).
  \]  
  Since \(W(L) > W(M)\),  
  \[
  \alpha \cdot W(L) + (1-\alpha) \cdot W(R) > \alpha \cdot W(M) + (1-\alpha) \cdot W(R),
  \]  
  so \(W(\alpha L + (1-\alpha)R) > W(\alpha M + (1-\alpha)R)\). Thus, independence holds for any \(F\).  

  The contrast between (b) and (c) shows that violations of independence in social choice arise from ex ante aggregation (applying \(F\) to expected utilities), where non-linear \(F\) (e.g., leximin) can cause reversals under mixing. Ex post aggregation (applying \(F\) state-wise and then taking expectation) always satisfies independence because the expectation operator is linear, ensuring mixtures are handled linearly regardless of \(F\).

